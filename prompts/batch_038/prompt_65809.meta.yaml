  ---


  I am preparing a short statement of my own position for a graduate seminar on the
  philosophy of nationalism, and I want it audited rather than applauded: I have written
  down what I take myself to believe, and I no longer trust my own sense of where
  the pressure points are.


  My commitments:


  1. Genealogy. I accept the modernist account: the nation, as a unit of political
  claim-making, is recent. Standardized print languages, mass schooling, conscription,
  censuses and maps are what produced a population that experiences itself as a people
  and then projects that experience backwards. I hold this with Gellner, Anderson
  and Hobsbawm and against the perennialists.


  2. Anti-debunking. I reject the move from "invented" to "therefore illegitimate."
  A tradition''s recent manufacture says nothing about its capacity to bind those
  who live inside it, and I do not permit genealogy to do normative work in my arguments.


  3. Critique nonetheless. Even so, I think it matters that the antiquity claims of
  nationalist movements are false, and that correcting them is part of what scholarship
  owes the public. I regard the story of immemorial continuity as a claim about the
  world that can be shown to be untrue, and I want it shown.


  4. The demos. Democratic procedure cannot settle its own scope: the question of
  who constitutes the electorate cannot be put to an electorate. I think the unit
  has to be given in advance, and that what gives it is a shared national identity
  — a people who already think of themselves as a we, and who owe one another the
  kind of solidarity that redistribution and democratic trust presuppose. This is
  roughly the liberal nationalism of Miller and Tamir, and I sign on.


  5. Civic and ethnic. I hold the civic/ethnic distinction to be real and normatively
