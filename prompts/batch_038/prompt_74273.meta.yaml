  habit, so that M has bought an ontological extra with no explanatory return.

  - The dialogue should include: S''s argument that inanimate things cannot be agents;
  M''s non-voluntarist reply; M''s use of masking/finking/antidote style explanations
  for the single non-occurrence, and S''s rejoinder that if every failure is to be
  explained by an unnoticed interfering power, the theory can no longer fail; a point
