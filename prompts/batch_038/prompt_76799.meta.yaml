  the D''Arcy Thompson tradition; constraint-based views grounded in development and
  lack of available variation; phylogenetic inertia; a weighted pluralism that assigns
  the burden of proof; and the methodological position that adaptationism is a heuristic
  whose fruitfulness is separable from any claim about how often traits are adaptations.
  If you think a further position deserves a leaf, add it; if you think one of the
  above is not really a position, say so and explain what it collapses into.


