  of how they''d treat evidence rather than by recognizing a school. Candidate questions
  of that kind — use, discard, or reorder as you see fit — include: does a trait''s
  good fit to a current function license an inference about its origin; what does
  the absence of that trait in close relatives that share the function show; what
  should you make of a trait whose form is predictable from general geometry or physics
  regardless of lineage; is the fact that a trait could not have arisen without prior
  selection on something else a claim about origins or about current utility; what
  follows from a trait''s being near-optimal under one environmental description and
  badly suboptimal under another; does the availability of many alternative adaptive
  stories for one trait weaken adaptationism or merely reflect its fertility as a
  method; and whether the adaptationist programme''s resilience under criticism is
  a virtue or a vice.


