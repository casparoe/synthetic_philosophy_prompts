  \ spraying the same field with a broad-spectrum insecticide isn't fine\" — that's\
  \ the classic \"means vs. side effect\" tension and also the \"targeted vs. indiscriminate\"\
  \ tension. Another pair: \"killing individual ants that enter my kitchen one at\
  \ a time is fine; flooding the anthill to kill thousands at once is not fine, even\
  \ though the aggregate harm is the same\" — hmm, that's a numbers issue.\n\nThe\
  \ principle candidates: number of insects killed, probability of sentience, suffering\
  \ caused (insecticide types differ in how painful/slow the death is — e.g., neurotoxins\
  \ causing quick paralysis vs. slow desiccation via diatomaceous earth vs. borax\
  \ baits vs. glue traps causing prolonged distress), directness/intent (targeted\
  \ pest vs. non-target pollinators), ecological function, whether the insects would\
  \ have lived otherwise (killing vs. never existing), whether the harm is averted\
  \ (crop loss) or merely convenience.\n\nAlso the \"asymmetry\" between killing and\
  \ preventing births: a widely-discussed point is that habitat/pest control often\
  \ reduces the number of insects who will exist at all (which matters if you think\
