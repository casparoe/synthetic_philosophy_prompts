  Key conceptual dependencies for teaching CPA + agreement theorem:

  1. Two people can have the same prior and the same evidence and still... no. The
  point: same prior, *different* private evidence → different posteriors is fine,
  no contradiction. So students must first see that the theorem isn''t "same prior
  ⇒ same belief."

  2. Posterior = function of prior + private information (their partition).

  3. Common knowledge is stronger than mutual knowledge — need level-k escalation
  and the sense that "everyone knows that everyone knows ... ad infinitum," and crucially
  that a public announcement in a room creates it.

  4. The theorem: if the priors are common (and commonly known), and their posteriors
  are common knowledge, they must be equal. The bite is in the antecedent''s second
  clause.

  5. So persistent disagreement in the wild is not evidence of irrationality or bad
  faith: usually the posteriors aren''t common knowledge.

  6. But then: what does disagreement tell you? If two experts announce their posteriors
  publicly and repeatedly and still disagree, then something''s off — either different
  priors, or one is lying/mistaken about their own evidence, or the announcements
  aren''t really public/common knowledge, or they aren''t both rational.

  7. The contested status of the CPA itself: is it an empirical claim? A methodological
  stipulation? Not falsifiable because it constrains counterfactual beliefs about
  evidence you don''t have. Also: people can''t introspect priors; the "prior" is
  a modeler''s device. And the fact that in the courtroom context, jurors and judges
  will use "they disagreed so someone''s lying" — the normative bite.

  8. Adjacent: no-trade theorem — speculative trade implies different beliefs, so
  common priors + common knowledge of rationality rules out mutually beneficial speculative
  trade; markets with common priors shouldn''t trade on private info... but they do
  trade. Nice tension.

