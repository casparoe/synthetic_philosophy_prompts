  revisionists concede prudence). Errors: (1) domestic analogy as Walzer''s ground
  + "states recognise each other as sovereign equals, soldiers inherit state''s standing"
  + "prohibition waived" — the waiver idea is actually something Walzer considers
  ("the consent/waiver" theory) but the state-agency inheritance framing is the domestic
  analogy he rejects. Note: is the "waiver" theory attributed to Walzer? Walzer discusses
  two justifications: (a) soldiers are "dangerous men" who lose their right not to
  be attacked (liability-ish), and (b) a version where combatants mutually consent/waive.
