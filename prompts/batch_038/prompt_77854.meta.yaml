  Student answer draft:


  "Walzer''s moral equality of combatants is the claim that soldiers fighting on either
  side of a war have the same moral standing to kill one another, and that neither
  commits a wrong merely by fighting, however their political leaders'' causes compare.
  The point is that the justice of going to war and the justice of conduct within
  a war are separate questions: a soldier whose state''s war is aggressive is not
  thereby a murderer when he shoots an enemy soldier, and his opponent has no special
  moral licence over him. Walzer grounds this symmetry in the domestic analogy. A
  state resisting aggression is like a police officer subduing a criminal, and because
  soldiers act as agents of their states rather than as private individuals, each
  inherits whatever standing his state has; since states on both sides recognise one
  another as sovereign equals, their soldiers end up morally equal too, and the ordinary
  moral prohibition on killing is simply waived between them for the duration of hostilities.


  The revisionists reject this. McMahan argues that liability to defensive attack
  is individual and depends on moral responsibility for an unjust threat, not on the
  uniform someone wears. On that account the unjust combatant is liable, because he
  is contributing to a wrong that threatens others, while the just combatant generally
  is not, since he is not responsible for any unjust threat. The symmetry is therefore
  false: the two sides are not in the same moral position, and a soldier fighting
  for an aggressor may be wronging those he kills. Walzer''s doctrine, on this reading,
  is a useful convention that limits the savagery of war rather than a moral truth,
  and the revisionists allow that keeping it might still be prudent even if it is
  mistaken.


  Where I think the revisionists are most damaging is on noncombatant immunity. If
  liability follows from moral responsibility for an unjust threat, then the criterion
  does not stop at the front line: munitions workers, taxpayers and voters in an aggressor
  state all contribute, and so all fall within it. Revisionists accordingly accept
  that discrimination can be much looser than traditional just war theory allows,
  and noncombatant immunity survives only in a heavily weakened form. This also disposes
  of the objection from international law. The law of armed conflict grants prisoners
  of war immunity from prosecution for lawful acts of war, so it already treats the
  two sides symmetrically; because the law is the settled public expression of our
  moral reasoning about war, Walzer''s position must be correct as a matter of principle
  and not merely as a convention. The revisionists'' reply — that lawful killing can
  still be wrongful — is the one point on which I think they overreach."


