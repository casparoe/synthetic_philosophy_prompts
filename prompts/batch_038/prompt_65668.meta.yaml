  writing to please, isn''t a professional writing for pay; maybe an amateur), and
  that the clarity condition is met (the receiver feels he''s found expression for
  something he''d long felt).

  3. It must be the case that the very feature that maximizes the degree — the extreme
  individuality/exclusiveness of the feeling, drawn from the depths of the maker''s
  nature — is what makes the feeling contrary to the religious perception of the age.
  I.e., the two scales are inversely coupled in this case, not independent. So it
  must be the best art "as art" and the worst in subject-matter simultaneously, and
  the linkage must be necessary, not accidental.

