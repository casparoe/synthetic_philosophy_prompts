  fit all the data, and the group realizes they can''t tell whether the manual differs
  in stimulus meaning or only in how it carves up reference. That''s a great game
  with real payoff structure. And the debrief can distinguish: underdetermination
  of theory by evidence (which is not special) vs. indeterminacy (no fact of the matter).
