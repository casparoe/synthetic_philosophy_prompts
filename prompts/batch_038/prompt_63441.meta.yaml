  ---


  I write a monthly column on science and ideas for a general-interest magazine, and
  I am drafting a long piece on what a legal system looks like once it stops believing
  in desert. My case is Norway''s handling of Anders Behring Breivik, and I want it
  analyzed against the Dennett–Caruso dispute over just deserts — the exchange published
  as Just Deserts: Debating Free Will (Polity, 2021), in which Caruso defends free-will
  skepticism and the public health-quarantine model he develops with Pereboom, and
  Dennett defends a compatibilist, competence-based account of responsibility and
  attacks the skeptic''s revisionism as overreach.


  The facts I will be relying on, so that you need not reconstruct them: on 22 July
  2011 Breivik killed seventy-seven people, eight in a bombing in Oslo and sixty-nine
  at a youth camp on Utøya. Two court-appointed psychiatric reports disagreed. The
  first, delivered in December 2011, diagnosed paranoid schizophrenia, which under
  Norwegian law would have meant compulsory psychiatric care rather than prison. After
  that report drew heavy criticism, a second team was appointed and concluded in April
  2012 that he was not psychotic. The Oslo District Court accepted the second report,
  and on 24 August 2012 found him sane and guilty, sentencing him to twenty-one years
  of preventive detention with a ten-year minimum, extendable indefinitely for as
  long as he is judged dangerous. He pleaded not guilty on grounds of necessity, admitted
  the acts, and his defence called witnesses to establish that ideological extremism
  is not a mental illness; he had explicitly wanted to be found responsible rather
  than dismissed as mad, and most of the bereaved wanted the same. In January 2022
  a court rejected his request for early release. The then prime minister answered
  the attacks by promising more democracy and more openness, and the court recorded
  the killings in graphic detail so that the file would be complete on the day he
  asked to be let out.


  Now the analysis...


