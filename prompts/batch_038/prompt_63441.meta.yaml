  does with the sanity question if it isn''t a distraction: is it doing covert work
  as a proxy for treatability or responsiveness to reasons? Under Dennett, responsibility
  attributions are part of the social technology that produces and sustains the relevant
  competences; say what he makes of a court that spends ten weeks establishing that
  a man who admits everything was nevertheless answerable.


  2. The convergence test: both frameworks appear to license indefinite detention
