  Setting: I co-host a small philosophy-of-science podcast / actually a "rationality-adjacent
  book club podcast." Guest: a philosopher who defends Lakatos''s methodology of scientific
  research programmes and has a new book arguing MSRP should be applied to the social
  sciences/psychology (replication crisis). I want 8–10 questions. Requirements:


  1. At least one question on the charge that MSRP is empty because it never tells
  you to quit a programme — and the follow-up keyed to the reply "appraisals aren''t
  rules of conduct."

  2. One on reflexivity: what''s the hard core of MSRP itself, what auxiliary hypotheses
  have been added over the decades to protect it (e.g., the move to "long-run" appraisals),
  and whether MSRP, appraised by MSRP, is progressive or degenerating.

  3. One on the timing problem: appraisals are retrospective, so a working scientist
  can''t use them; what is MSRP for, then? Follow-up if they say "it''s for historians/philosophers."

  4. One that presses the "novel prediction" criterion: what counts as novel? (Lakatos:
  a prediction is novel if it wasn''t part of the reasons for constructing the theory
  / would have been ad hoc.) Press: the criterion is about the history of the theory''s
  construction, so novelty is a fact about psychology/sociology of discovery, not
  about the theory — and the guest''s own recent work apparently relies on a purely
  logical notion of novelty. Follow-up: give a case where a prediction is novel in
  one sense and not the other (e.g., Einstein''s light bending? Halley''s comet return?
  the positron?). Hmm — careful with specifics. The classic example: Fresnel''s/Poisson''s
  bright spot prediction was novel; also the discovery of Neptune from Uranus perturbations
  — that''s a great case, and arguably a case where the "ad hoc" label is contested.
  Also Einstein''s perihelion of Mercury was an *accommodation*, not a prediction
  — Lakatosians treat the light-bending prediction (1919) as the novel one. I''m confident
  enough about these; but I''d rather keep specifics light and let the model supply
  them. Actually asking the guest to give such a case is fine without me asserting
  facts.

  5. One on the sociology of "degenerating": who gets to declare a programme degenerating,
  and the fact that the declaration is itself a move in a scientific/political fight
  — e.g., is "that programme is degenerating" just a rhetorical weapon? Press with
  a specific real case: the continental-drift debate? Plate tectonics as a programme
  that was degenerating for decades and then revived — actually continental drift
  was dismissed as degenerating and Wegener''s ideas were rejected; then plate tectonics
  vindicated them. Good: "a programme judged dead for thirty years that came back"
  — that''s a fine pressure case without needing precise claims. Or the revival of
  Mendelian genetics? Hmm. Or: the "prion" hypothesis — dismissed for years, then
  Nobel. That''s a real thing (Prusiner). Or: quantum foundations / Bohmian mechanics
  — a programme long declared degenerating by the Copenhagen mainstream, now flourishing.
  Bohm''s 1952 hidden-variable theory, ignored for decades, then revived by Bell/Dürr/Goldstein.
  That''s a good, safe case.

  6. One on the relation to Popper: is MSRP actually different from "sophisticated
  methodological falsificationism," or is it the same view with a historical gloss?
  Follow-up if they say the difference is the unit of appraisal.

  7. One on the hard core being immune by fiat: if the hard core is protected by a
  methodological decision, isn''t the "irrefutability by fiat" exactly what Popper
  condemned as immunizing stratagem? Where''s the line between a progressive modification
  of the protective belt and a stratagem?

  8. One on the guest''s new application: applying MSRP to a field with no clear hard
  cores (e.g., psychology / ML benchmark culture) — press on whether "programme" is
  doing any work there or is just a redescription; and what MSRP would have told a
  psychology grad student in 2010.

  9. End with a question about what would count as evidence against MSRP itself /
  what would make the guest abandon it.


