  Been reading Overcoming Bias / LW since around 2009 and I''ve finally talked a real
  philosopher of science into coming on my tiny podcast. He''s a Lakatos person —
  not a museum piece about Lakatos, an actual defender who thinks the methodology
  of scientific research programmes is still the best account of theory choice we
  have and who''s spent the last decade trying to extend it beyond physics into the
  squishier sciences. I''ve read enough of the primary stuff to know where the pressure
  points are but I don''t want to spend the hour letting him give the textbook summary
  of hard core / protective belt / progressive problemshift. Give me 8-10 questions,
  each with a follow-up aimed at the answer he''s most likely to give.


  Things I definitely want covered:


  - The empty-rules charge: if a programme''s hard core is irrefutable by methodological
  fiat and appraisals are only available decades later with hindsight, what does MSRP
  actually forbid? Follow up on his likely reply that appraisals aren''t rules of
  conduct — I want the follow-up to push on whether a methodology that can never tell
  anyone to stop doing anything is still a methodology or just a way of narrating.

  - Reflexivity: what''s the hard core of MSRP itself, and which bits of the protective
  belt have been quietly patched over the years (the retreat to long-run appraisal,
  the appeal to ''external history'' whenever the rational reconstruction doesn''t
  match what scientists did, etc.). Ask him to say out loud whether MSRP, appraised
  by MSRP, is progressive or degenerating, and don''t let him off with ''too early
  to tell''.

  - The novelty criterion: ''theoretically progressive'' means predicting novel facts,
  but novel is defined by whether the fact was already used in constructing the theory.
  So novelty is a fact about the history of a theory''s construction, not about the
  theory itself. Get him to handle a case where a prediction is novel in one sense
  and not the other...

  - Who gets to declare degeneration: the people doing it are always outside the programme,
  and the people calling it progressive are always inside. Is ''degenerating'' just
  an insider/outsider marker?...

  - The Popper question: is MSRP anything more than sophisticated falsificationism
  with a longer timescale and a unit-of-appraisal swap?

  - A revived-programme case: he''ll surely want to point at some programme that looked
  dead and came back (Bohmian mechanics is my guess). Ask what MSRP said during the
  decades when it looked dead, and whether the framework can be distinguished post-hoc
  from ''bet on whatever wins eventually.''

  - His extension into psychology/neuroscience/whatever: does ''programme'' do real
  work there or is it redescription — and concretely, what would a grad student in
  the field in, say, 2012 have done differently if they''d followed MSRP?

  - Close with: what evidence would make him give it up.


  Also: no softball questions, no ''what drew you to philosophy of science'', and
  don''t write questions that let him answer by naming a distinction — I want questions
  that make him use it on a specific case.


