  the whole God is hidden in something like the sense the argument requires. Where
  she parts company with the argument is over its conception of God. Her view, roughly,
  is that the argument takes as its target a being who is a person among persons,
  a divine individual whose perfection is expressed in seeking intimate, mutually
  recognized interpersonal contact with each creature, and that this is not the God
  of classical theism. On her telling, a being who is not one item in the order of
  things but the ground of that order is not the sort of thing that could be an object
  of belief in the way a person or a planet can; the appropriate stance toward such
  a being is not belief-that but something closer to trust, participation, or reorientation
  of the will; and the "hiddenness" the argument diagnoses is therefore built into
  the difference between creator and creature rather than a datum calling for explanation,
  let alone a reductio of theism. She is very good at closing off further pressure
  with a formulation to this effect: the argument succeeds only in showing that a
  certain description of deity is uninstantiated, and theists who never accepted that
  description have lost nothing.


