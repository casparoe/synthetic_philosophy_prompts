  Let me double-check the modal argument details. Schellenberg''s 2015 argument:

  1. Necessarily, if God exists, God loves us (i.e., is perfectly personally loving).

  2. If God loves us, then God desires a personal relationship with every person (capable
  of such).

  3. A personal relationship with God entails that one believes God exists.

  4. So if God exists, God desires that every capable person believe God exists (always).

  5. God''s desire, if God exists, is always satisfied (God is omnipotent) — this
  is the controversial move; Schellenberg argues a perfect being''s purposes would
  not be thwarted, and importantly the relationship is not just a finite earthly matter
  but extends into the afterlife, so "not yet" doesn''t help.

  6. If some capable person nonresistantly disbelieves, then God does not always get
  what God desires.

  7. There are such persons (nonresistant nonbelievers).

  8. So God does not exist.


