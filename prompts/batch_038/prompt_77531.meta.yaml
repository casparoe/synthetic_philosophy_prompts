  Student answer (condensed):

  "The intuitive starting point is that if a couple has a child whose life is happy,
  the world is better: nobody is harmed, someone gains, so this is a pure improvement.
  Parfit calls the challenge to this intuition the mere addition paradox, also known
  as the repugnant conclusion. The idea: start with population A of ten billion people
  with very high quality of life. Add another ten billion whose lives are worth living
  though less good — A+ is not worse than A, since the extra people are glad to exist.
  Then keep trading quality for quantity until you reach Z, a population of trillions
  whose lives are barely worth living but who, taken together, contain more total
  well-being than A. On the total view, Z is better than A, which is repugnant. Since
  Parfit thinks we should reject the conclusion but every escape route has costs,
  he proposed Theory X, the view that quality can be lexically more important than
  quantity, so Z is not better than A after all. One popular response is to deny the
  total view in favor of the average view: rank outcomes by average well-being, and
  huge-but-miserable populations lose out automatically. This also avoids the sadistic
  implications people sometimes worry about, because the average view is neutral about
  population size — it just tells you not to add people who would drag the average
  down. Another response is to change your account of well-being: the repugnant conclusion
  only bites if you''re a hedonist, because you need well-being to be measurable on
  a single scale that can be summed. If well-being is preference satisfaction, a barely-worth-living
  life is one in which almost no preferences are satisfied, and there''s no sense
  in which trillions of such lives outweigh ten billion flourishing ones. Either way,
  the policy implication is clear: the subsidy assumes we can rank populations by
  size and happiness, and since we can''t, the government has no grounds for the claim
  that more happy people makes the world better, so the subsidy is unjustified — even
  though, as I said at the start, a couple having a happy child obviously makes the
  world a better place."


