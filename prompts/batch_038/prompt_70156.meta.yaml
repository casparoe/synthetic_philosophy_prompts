  The distinction, paraphrased: "The organizing distinction for that week is C. Thi
  Nguyen''s between epistemic bubbles and echo chambers. Roughly, as I''ll put it
  to them: a bubble is a structure of omission — its members simply don''t hear the
  relevant outside testimony, and the remedy is exposure; a chamber is a structure
  of active discredit — its members hear the outside testimony but have been trained
  to regard its sources as corrupt, captured, or stupid, and the remedy is not more
  evidence but the slow rebuilding of trust. Bubbles are popped; chambers have to
  be burst, and the two require different work. On my gloss, which I''d like you to
  treat as available to the design: a bubble is a truncated source set, whereas a
  chamber is a corrupted reliability function over a source set that is not truncated
  at all."


  My extension: "I also want to put my own heresy in front of them. I suspect the
  binary is not exhaustive: a bubble that persists long enough can generate its own
  discrediting scripts endogenously, without anyone ever having been taught to distrust
  anything, simply because members start to notice and explain away the occasions
  on which outside testimony contradicts them. If that is right, chambers are partly
  a species of aged bubbles, and the two remedies come apart less cleanly than the
  taxonomy suggests. If you can build a round in which that possibility is at least
  testable in play — students able to produce a structure that is neither and say
  why — build it. If you cannot do that honestly within the time, tell me so rather
  than faking it."


  Constraints: "Content must be invented and apolitical... no phones... no real money...
  the diagnostic vocabulary must be withheld... the folk concept."


