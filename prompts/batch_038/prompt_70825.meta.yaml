  That''s a great setup: the ambiguity is that "counts for one" can mean (i) each
  person''s interests enter the calculus with equal weight (impartiality of the aggregation),
  or (ii) each person has an equal claim/standing, which is a claim about procedures
  and could support a lottery, or (iii) nobody gets extra weight for status/richness/social
  worth — a claim about which grounds for discrimination are ruled out, which is silent
  on numbers vs. lottery, or (iv) an aggregative premise that welfare is additive
  across persons (which is exactly what Taurek denies — he thinks loss to one person
  isn''t made worse by being added to another''s loss, since there''s no supra-personal
  subject who suffers the sum), or (v) a claim about equal moral status/dignity (non-comparative),
  or (vi) a claim about votes in a political procedure (one person one vote, majoritarian
  — which actually would favor the five, interesting!), or (vii) a claim about equal
  concern owed by an agent, where Taurek''s point is that concern for each individual
  doesn''t require maximizing, and may require giving each a chance.


  And the deliverable: for each reading, say whether it''s a platitude, substantive-but-defensible,
  or false, and specifically whether it supports "save the five" over the lottery,
  and which readings the committee member needs for his argument to go through — plus
  whether any reading supports the lottery instead. Also ask about a related twist:
  does the reading that gets him to the five also license the thing everyone on the
