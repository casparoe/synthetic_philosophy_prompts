  Now let me also consider adding the Deweyan apparatus gloss. Key elements:

  - The Public and Its Problems (1927): the public comes into being when people recognise
  the indirect, extensive consequences of transactions they''re not party to, and
  organise to control them; the state is the public organised through officials; in
  the "Great Society" the public is eclipsed — shadowy, unorganised, unable to identify
  itself — and the remedy is communication making a "Great Community".

  - Logic: The Theory of Inquiry (1938): inquiry begins from an indeterminate/problematic
  situation and aims at a determinate one; ideas are plans of action, hypotheses;
  knowledge claims are warranted assertibilities, not representations.

  - Democracy as the social counterpart of experimental method: policies are hypotheses
  to be tested in practice, not fixed dogmas; the demand that experts be in communication
  with the public, otherwise expertise becomes a closed caste.


