  2. Where do Hooker, the school board, the state DOH, EPA sit — inside the public,
  as the state-as-officials, or as the transaction-generators whose consequences the
  public must control? Dewey''s framework treats the state as the public organised
  through officials; so when the state health department says "no evidence of harm,"
  is that the eclipse, or the public acting against itself?

  3. Map the epistemology: the 1978-80 sequence as Deweyan inquiry — problematic situation,
  hypothesis formation, testing, warranted assertion. The residents'' door-to-door
  survey (Gibbs''s own health survey) as inquiry from below vs. the state''s epidemiology.
  Which is inquiry in Dewey''s sense? Does Dewey''s experimentalism privilege the
  official one, or does his insistence on communication cut the other way?

  4. The hard bit: the eventual outcome wasn''t the resolution of the problematic
  situation through inquiry but evacuation and demolition — the situation was dissolved
  rather than made determinate. Is that success or failure on Dewey''s own terms?
  And CERCLA/Superfund: a rule-based legislative fix with retroactive strict liability
  — is that Deweyan experimentalism (a policy as hypothesis, testable) or the opposite
  (a one-off settlement that forecloses inquiry)?

