  I''m writing up a seminar handout on the color-phi case and I''ve built an argument
  I no longer trust, because the conclusion is far stronger than anything I want to
  defend. Background as I take it: two stationary lights of different colors flash
  in succession at nearby positions, and subjects report one object moving continuously
  and changing color halfway along the path — a report whose content is fixed only
  by the second flash, which arrives after the reported midpoint has already been
  "traversed." Two explanations: Stalinesque revision (the content is assembled before
  it becomes an experience, so the subject genuinely experiences the mid-path change)
  and Orwellian revision (the subject experiences the first light''s color at the
  first position and the memory is edited afterward). Dennett and Kinsbourne insist
  no experiment can tell the two apart. Here is my argument.


  (1) Every piece of evidence we have about when an experience occurred, or in what
  order experiences occurred, is a report — verbal, button-press, or confidence rating
  — produced after the experience.

  (2) A report produced after the experience is a trace whose content can be altered
  between experience and report.

  (3) Therefore, for any report R about the temporal structure of experience, there
  is a hypothesis on which R accurately transcribes the experience and a rival hypothesis
  on which R reflects a later edit of it.

  (4) Where the rival hypotheses license the same report, no report can adjudicate
  between them. (Call this Report Parity.)

  (5) So no report can adjudicate between Orwellian and Stalinesque accounts of color
  phi — which is just what Dennett and Kinsbourne say.

  (6) But (1)–(4) are not specific to color phi. Any proposed test of an Orwellian/Stalinesque
  difference is itself a report, produced after the experiences in question. [Then
  insert the injected case.] Suppose I design a discriminating experiment: after the
  second flash, insert a 900 ms backward mask plus a concurrent tone-counting task
  before the report, on the theory that an edited trace should be more fragile than
  a delivered experience. Under Orwellian the mid-path color change should vanish
  from the report at higher rates than under Stalinesque. By (1)–(4), the report of
  what survived the mask is itself post-hoc and itself editable: a rival hypothesis
  on which the experience was Stalinesque and the interference degraded it, and a
  rival on which the experience was Orwellian and the edit was consolidated before
  the mask, predict the same numbers. So the experiment cannot break the tie either.

  (7) Generalizing: no evidence of any kind distinguishes any claim about when or
  in what order experiences occur.

