  a citizen can access — appointment slots, benefit renewals, housing offers — and
  that has been trained on, and continuously updated by, the citizen''s own expressed
  preferences. Two features make the case hard, and the dialogue should be built around
  them rather than around liberty in the abstract. First, the system almost never
  forbids anything: citizens can decline every ranked option and re-enter the queue,
  and the operator company insists that it does not interfere with anyone, since it
  merely orders choices the citizen already had. Second, the system''s only appeal
  mechanism is a feedback channel whose responses are fed back in as training data
  — so contesting a ranking changes the ranking without ever giving the citizen a
  say over the ranking procedure, and the procedure itself was adopted by a citizens''
  assembly years earlier and is now beyond any individual''s reach.


  Requirements:

  - Both characters must be at the top of their game... neither a strawman.

  - Each must at least once take the other''s own principle and apply it in good faith
  to the clause, showing where it yields an uncomfortable result.

