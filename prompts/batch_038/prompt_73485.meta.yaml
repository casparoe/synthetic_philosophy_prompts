  Berlin''s criterion limits unfreedom to deliberate human interference, so a ranking
  system that blocks nothing and frustrates no one''s plans leaves liberty untouched;
  (b) that non-domination, applied here, condemns systems on the basis of what a power-holder
  could do rather than what anyone''s options actually are — making freedom a matter
