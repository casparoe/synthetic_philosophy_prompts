  But careful: "construct a case where institutions appear to matter but don''t" —
  this requires the confounder to be geography or culture acting through an unobserved
  channel. But if geography is continuous across the border, how can geography cause
  a discontinuity in growth? The mechanism: the confounder needn''t be geography at
  the border; it could be a *selection* channel — i.e., the border determines which
  group of people migrated there (self-selection of migrants with certain traits),
  so "culture" is discontinuous because of an assignment rule, not because institutions
  cause it. That''s realistic: e.g., the border determined who got land grants, and
  settlers self-selected by religion/ethnicity/wealth. Or: the institutional difference
  is itself *caused by* an unobserved geographic feature that happens to jump at the
  border (a river valley soil type, presence of a mineral deposit on one side) — then
  it''s not geography-continuous. Or the deeper point: even with continuous geography
  and a sharp institutional discontinuity, the institutions might be a *mediator*/proxy
  for a geographic feature that is continuous — no, then it wouldn''t produce a jump.


  Better: use the "reverse causality / equilibrium selection" mechanism. Suppose the
  two sides differ in a legal regime, but the regime was adopted endogenously because
  of an anticipated divergence in something else — e.g., both sides were settled by
  the same company, but one side was designated the seat of a port/customs house for
  reasons of river depth (geography, unobserved in the data at hand because the researcher
  only has coarse coordinates), and the port produced agglomeration, not the legal
  code. So geography is discontinuous at the border in a fine-grained way that the
  researcher''s covariates don''t capture (soil, hydrology, elevation). That''s the
  standard worry about "coarse" geography controls (e.g., latitude/longitude fixed
  effects don''t capture local soil).


