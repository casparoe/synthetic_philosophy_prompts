  defined as long-run frequency so the PP is trivially true.

  5. Claiming the PP entails that a rational agent with full knowledge of chances
  must have identical credences to every other such agent — actually true-ish given
  the same chance hypothesis and admissible evidence, fine.

  6. Claiming that single-case chances are ruled out because the PP only makes sense
  with repeatable trials — Lewis insists on single-case chance, and the PP is meant
  to apply to single cases.

  7. Claiming the PP shows chance is "objective credence" and hence that objective
  chance is just a projection of credence — a subjectivist misreading; Lewis thought
