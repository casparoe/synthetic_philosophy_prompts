  Lewis''s Principal Principle (1980, "A Subjectivist''s Guide to Objective Chance"):
  roughly, for a reasonable credence function C and chance function Ch, and admissible
  evidence E: if C(Ch(A) = x) = 1 (or C(A | Ch(A)=x ∧ E) = x), then C(A | Ch(A)=x
  ∧ E) = x. More standard formulation: C(A | Ch(A) = x ∧ E) = x, where E is admissible.
  Also the version involving C(x) > 0.


  Key points a model should verify:

  - Admissibility: E is admissible iff, roughly, it doesn''t give you information
  about the outcome beyond the chance — technical: propositions about chances and
  about history-to-the-present... Lewis: "admissible" = the kind of evidence whose
  influence on credence about A is fully mediated through the chance. Lewis''s official
  definition: a proposition E is admissible if C(A | Ch(A)=x ∧ E) = x for all A and
  x. That''s circular-ish. Better gloss: evidence about the past and present, and
  about chances, is admissible; evidence about the future outcome isn''t.

  - The PP is a bridge principle connecting objective chance to rational credence;
  it''s why chance is a useful notion for a subjectivist.

  - Undermining problem: the PP as stated, combined with Humean supervenience of chance
  on the actual history, is inconsistent — because a chance hypothesis plus a long-run
  frequency claim can be undermined: the chance hypothesis itself assigns positive
  probability to futures in which the frequency diverges; and if the future actually
  diverges, then... Hall''s New Principle: C(A | Ch(Ch(A)=x ∧ E) = x) — i.e., defer
  to the chance of the chance hypothesis. Lewis accepted the New Principle as a fix
  (1994, "Humean Supervenience Debugged"). Vranas (2002, 2004) criticized. Ismael''s
  "General Recipe" / Ismael''s deflationary account (2006 "How do chances explain
  events?"). Also Meacham''s account (2005). Fine.

  - The PP is not a claim that chance = credence; it''s a constraint on credence given
  chance hypotheses.

  - A subtle error: saying the PP says your credence should equal the chance unless
  you have evidence to the contrary — where "evidence" is any evidence. Actually the
  admissibility condition does much of the work: only admissible evidence screens
  off; inadmissible evidence (e.g., information about the outcome itself, or about
  future frequencies) can rationally move you away from x. A confident popularizer
  might say "as long as you don''t have evidence that the coin is biased," conflating
  with the everyday notion.

  - Another subtle error: the popularizer says the PP is a definition of chance —
  "chance is whatever plays the role of governing credence" — which is closer to Lewis''s
  "subjectivist guide" motivation but is a functionalist claim, and conflating the
  PP with the "best-system account" (chance as whatever appears in the best deductive
  system) is a conflation of two distinct parts of Lewis''s program. That''s a good
  "conflation of two claims the view keeps apart."

  - Also: "the PP entails that rational agents must have the same credences" — no,
  it''s conditional on chance hypotheses.

  - Also potential error: the popularizer says the PP only applies to repeatable setups
  / long-run frequencies, whereas Lewis insists on single-case chance. Good one.

  - Also: the popularizer says that since the PP is a priori, chance facts are knowable
  a priori — or says chance is "objective credence," a phrase that muddles.


  Also possible: an error about "self-undermining" — the popularizer says the PP shows
  that chance is inconsistent with Humeanism, whereas actually Lewis accepted the
  New Principle and thought it consistent; Hall argued the inconsistency was real.
  Hmm, that''s a nice detail: the standard story is that Hall''s undermining problem
  forced a revision, and Lewis accepted the revision (Hall himself disagreed that
  it fixed things). A popularizer might say "the problem was fatal and Lewis abandoned
  chance" — which is wrong.


