  Here''s the shape. Two people are looking at the same numbers — say, a study of
  how many insect larvae a songbird pair has to produce to replace itself, or the
  census data after a wetland gets drained for a housing estate. They agree on the
  numbers. They even agree that suffering matters. But one concludes the habitat loss
  is a catastrophe, and the other concludes it''s a relief, because it means fewer
  lives of the starvation-and-getting-eaten variety. And when you press each of them
  on what evidence would move them, you get different answers — not different conclusions,
  different *standards*. The one who''s worried about suffering wants to see a very
  high bar cleared before anyone says a given wild life was worth living; the other
  wants a very high bar cleared before anyone says clearing a woodland is a harm.
  Each of them will tell you, sincerely, that they''re just following the evidence
  wherever it leads and applying the normal scientific standard.


  Same thing with predators. Reintroduce them, and one camp says you''d better be
  very sure the ecosystem benefits before you accept all that extra killing; the other
