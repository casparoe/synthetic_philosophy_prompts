  Draft:


  "I am preparing a seminar contribution on chance-credence principles and there is
  one conceptual knot I cannot untangle on my own. I would like an explanation of
  it — the explanation itself, not a survey of positions.


  The setup I want to work with. Lewis''s Principal Principle tells a rational agent
  to align credence with known objective chance: conditional on evidence E that is
  admissible together with the hypothesis H that the chance of A is x, the agent''s
  credence in A should be x. The difficulty arises when chance is Humean, so that
  H itself is a contingent matter fixed by how the whole history of the world turns
  out. Consider a deliberately crude toy case. A machine emits a million binary outcomes
  and nothing else exists in the world. The best system assigns chance 1/2 to each
  emission in any candidate history whose overall frequency of heads lies within one
  per cent of a half, and otherwise assigns the frequency itself. Now take E to be
  the report that the first 999,999 emissions were heads. PP tells me my credence
  in heads on the final emission, given H and E, should be 1/2; but E also makes it
  near certain that H is false, because a history like that would carry a chance near
  1. PP''s advice seems to come apart from the very evidence that was supposed to
  make it usable.


  Lewis''s repair conditions not on the local chance hypothesis but on T, the complete
  chance theory: the agent''s credence in A, given T and admissible E, is to equal
  the chance that T assigns to A in the world that E describes. My understanding of
  why this helps is that T is a claim about which function assigns chance distributions
  to worlds, rather than a claim about which distribution obtains here; so E no longer
  contradicts T, it merely selects the branch of T that applies. The residual unease
  — and the knot I want addressed — is whether T can be a genuine object of the credence
  1 that the principle demands, and whether, if it cannot, the principle has been
  rendered harmless at the cost of being inert.


  Please address, in this order:

  1. State precisely where the original principle fails in the toy case, in terms
  of what is and is not admissible; I want to see whether the failure is a contradiction,
  an instability in the advice, or something else.

  2. Say whether my gloss on the repair is right. In particular, is T world-general
  or world-specific, and does the answer to that question decide whether the repair
  works?

  3. Take on the charge that the notion of admissibility is being asked to do the
  work: if E is admissible just in case it leaves the chance hypothesis certain, is
  the principle informative at all, or true only by stipulation?

  4. Give me your own verdict on the deeper question: is the undermining phenomenon
  a reductio of a Humean account of chance, a reason to reject the chance-credence
  principle in its original form, or perfectly benign — chances that can be undermined
