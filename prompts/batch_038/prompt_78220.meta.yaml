  after Besso''s death (March 1955; Einstein wrote to Besso''s family, dated 21 March
  1955). Its evidential weight as physics is limited; also Einstein''s own views are
  not authoritative for what SR entails. Also note the article treats Einstein''s
  acceptance as supporting the argument rather than as a psychological datum.

