  Now, where are the misrepresentations?


  1. "both are equally correct" — fine, that''s actually the standard view.

  2. "if an event is real for one observer, it must be real for anyone who could in
  principle disagree" — this is the key premise (the "co-reality transitivity" premise)
  which is exactly what presentists attack; the article presents it as an uncontroversial
  step rather than the contested premise. Also the article omits that the argument
  requires the observers'' frames to be related in a specific way and that Putnam''s
  original argument had a premise about "I am real" and "all and only the things that
  exist are real" etc. Also the argument relies on the relativity of simultaneity
  in Minkowski spacetime; in general relativistic spacetimes with a preferred foliation
  or globally hyperbolic... hmm, careful. Actually the standard objection: the argument
  works in special relativity, but SR is a limiting case; general relativity admits
  spacetimes with a natural foliation (e.g., FLRW cosmology with cosmic time), so
  the "no privileged simultaneity" premise isn''t forced by our best physical theory.
  That''s a real and commonly-made point.

  3. Conflation: "the future already exists" (ontological claim about the block) with
  "nothing is open"/"no one could have done otherwise" (determinism). The block universe
  is a claim about the ontology of time, not about whether the laws are deterministic;
  a block universe could in principle contain genuinely indeterministic processes
  (e.g., quantum events), and eternalism is compatible with the future being fixed
  in the sense of "already there" but not fixed in the sense of "causally necessitated
  by the past" — the fatalist inference is the classic error. Also, compatibilists
  and even some libertarians accept eternalism. That''s the biggest subtle error:
  "That also settles the free-will question."

  4. "nothing flows and nothing is open" — the block view doesn''t obviously entail
  that change is illusory; change is variation of properties along the time axis.
  Presentists sometimes argue that, but the eternalist can accommodate change. Also
  "the passage of time is an illusion" is contested within eternalism (moving spotlight
  view).

