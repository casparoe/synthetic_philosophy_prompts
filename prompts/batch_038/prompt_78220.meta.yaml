  Draft:


  "Special relativity demolished the commonsense picture of a single present moment
  shared by the whole universe. Because simultaneity is relative to an observer''s
  state of motion, two people moving with respect to one another disagree about which
  distant events are happening right now, and neither is wrong. In the 1960s C. W.
  Rietdijk and Hilary Putnam pressed this into an argument for the block universe.
  Their reasoning is short. Whatever happens in some observer''s present is real.
  Two observers momentarily side by side but moving relative to one another have different
  presents. So what is merely future for one of them is already real for the other
  — and since the laws of physics make no distinction between observers, there is
  no principled way to privilege one present over another. Chain enough such observers
  together and every event in spacetime ends up real: past, present and future alike.
  The universe is a four-dimensional block, and the feeling that time passes is a
  psychological artifact of moving through it. Einstein said as much; writing to the
  family of his old friend Michele Besso about a month before his own death, he told
  them, ''For us believing physicists the distinction between past, present, and future
  only has the meaning of an illusion, though a persistent one.'' The moral consequences
  follow at once. If your future choices are already sitting there in the block as
  definitely as your past ones, then you could not have done otherwise, and the whole
