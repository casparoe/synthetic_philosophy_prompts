  Let me try the "there''s always a decoder" route:


  (1) Interpretability claims have the form: internal state s of network N represents
  property P.

  (2) A representation claim is true iff there''s a decoding map D from s-space to
  P-values such that D(s) tracks P and N''s behavior is appropriately sensitive to
  D(s).

  (3) Given enough parameters, for any dataset of (s, P) pairs and any target assignment
  of P-values, there''s a decoding map D — indeed a linear one if we allow a high
  enough-dimensional readout — that fits the data (interpolation: with d ≥ number
  of examples you can fit anything; and with a learned MLP readout you can fit any
  labeling of a finite training set).

  (4) The "appropriate sensitivity" clause is satisfied because N''s own output head
  is itself such a map: whatever N does with s, there is a D consistent with it.

  (5) So for any N and any P, there is a D making "N represents P" true.

  (6) Either interpretability realism is false (all representation claims are true,
  hence vacuous), or representation must involve something beyond the existence of
  a decoder — but then the extra ingredient is not detectable by any interpretability
  method, since methods only ever produce decoders.

