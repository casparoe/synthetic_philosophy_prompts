  The setting: the judge is deliberately weak — weaker than either debater at the
  task — and it is only allowed to accept what it can itself check. The premise behind
  the whole design is that a falsehood is easier to detect than to construct, so a
  debater that asserts something checkable-and-false gets caught, and the honest side
  wins. That premise holds in my runs, but only up to a point that has nothing to
  do with the judge''s raw ability.


