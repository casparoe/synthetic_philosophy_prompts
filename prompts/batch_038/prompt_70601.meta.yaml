  Draft of the phenomenon (A):


  Context: someone running oversight experiments where two models debate and a third
  (or a human, or a weaker model) judges. Observations:

  1. When the question can be settled in one step — "is this a prime?", "does this
  code contain a SQL injection on line 12?" — the honest debater wins nearly always,
  even when the judge is much weaker.

  2. When the correct answer requires a chain of 6-8 individually checkable steps,
  the honest debater wins only if the judge actually checks every link; and the dishonest
  debater''s best move is not to attack the conclusion but to concede links 1–5 and
  contest link 6, forcing the judge to verify the whole chain itself — which it won''t
  do — so the judge defaults to "unclear" and often picks the dishonest side or abstains.

  3. Worse: the dishonest debater can win by *extending* the chain — reframing the
  question so that the truth now requires 12 steps instead of 4, all of them true,
  so it''s not lying at all, but the judge runs out of budget.

  4. And the phenomenon is not about the judge''s raw capability — a stronger judge
  helps only up to a point; what matters is the ratio of chain length to checking
  budget. And it doesn''t look like sycophancy (the judge isn''t deferring to a confident
  answer) or like persuasion in the rhetorical sense (no emotional appeal), and it
  doesn''t look like the "obfuscation" problem because everything said is true and
  verifiable.


