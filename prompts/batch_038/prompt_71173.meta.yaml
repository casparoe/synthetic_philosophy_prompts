  Here is the argument. It was assembled in a graduate seminar on biological function,
  and its conclusion is one no participant accepts, yet none of them can locate the
  mistake.


  Context: the dispute between selected-effect (etiological) theories and causal-role
  theories of function. On the former, the function of a trait is an effect of that
  trait which explains why the trait is present in the lineage — roughly, what it
  was selected for. The seminar''s argument aims to show that the selected-effect
  account cannot accommodate dysfunction at all:


  (1) On a selected-effect account, a trait T has function F only if T''s ancestors''
  producing F explains why T is present in the population now.

  (2) Selection explains the presence of T only if producing F was, in the environments
  the lineage occupied while selection was acting, what caused T''s bearers to be
  retained relative to their competitors.

  (3) T is dysfunctional with respect to F only if T fails to produce F.

  (4) For any failure of a trait to produce F, either the environment no longer supplies
  the conditions under which F was produced, or the item in question is not the trait
  that was selected for F.

  (5) If the environment no longer supplies those conditions, then T is not malfunctioning
  but merely out of place: the failure is attributable to a change in circumstances,
  not to T, and a trait is not to be blamed for the world''s having changed. [hmm
  "blamed" is odd; better: "and it is the world, not the trait, that has departed
  from the norm."]

  (6) If the item is not the trait that was selected for F, then F is not its function
  by (1), and so it cannot fail to perform it.

  (7) Therefore, on the selected-effect account, no trait ever fails to perform its
  function.

  (8) But there are dysfunctional traits: hearts that cannot pump adequately, enzymes
  that misfold, eyes that do not resolve images.

  (9) Hence the selected-effect account is false, and function must be characterized
  without reference to history — for example, by causal role.


  Which step do you reject, and what does rejecting it cost? In particular: name the
  step at which something goes wrong (or, if you think the argument is valid and sound,
  say so and explain what has to be surrendered); explain why that step looked innocuous
  to the seminar; and say what each of the three main options — a selected-effect
  account, a causal-role account, and an account that treats function as what the
  trait normally does in members of the species — pays to block the argument at that
  point. I would most like to keep (8) and (1); tell me what I am giving up if I do."


  Hmm — careful with (4)-(6). The flaw: (4) is a false dichotomy. There''s a third
  case: the environment does supply the conditions, and the item is the trait that
  was selected for F (same type, same lineage, right environment), but this particular
  token fails to produce F because of a developmental/mutational/injury-related defect.
  That''s exactly malfunction. So (4) omits it, and (6) equivocates: "the item is
  not the trait that was selected" — in the malfunction case, the item IS an instance
  of the trait type (so F is its function by (1)) but is a defective token (a damaged
  instance). So (6) trades on type/token ambiguity: if we read "the trait" as a type,
  the malformed heart is still an instance of the type whose function is pumping,
  so (6) fails; if we read it as a token, then (1)''s reference to "T''s ancestors"
  and the type-level explanation doesn''t license the inference, since selection assigns
  functions to types and the token inherits its function from the type whether or
  not it works.


  Also there''s a subtlety in (2): selection explanations are statistical/population-level;
  a trait can be selected because on average it contributed to retention, even though
  many tokens fail. So (3)+(2) don''t imply tokens produce F.


  Great — there are two locatable flaws, one central (the (4)/(6) dichotomy, type-token
  equivocation), and an auxiliary statistical point about (2). The model should find
  at least the dichotomy. Also there is a genuine hard question: is the argument valid
  with a false premise, or does it equivocate? I said don''t announce.


  Now, is the conclusion "proves too much"? It concludes the selected-effect account
  is false and history-free analysis required. That''s a big conclusion. Good.


  Also note: does the causal-role account handle dysfunction better? Notoriously,
  causal-role functions don''t easily support malfunction either (a heart that can''t
  pump just doesn''t have the capacity to pump — on the causal-role account it has
  no function to pump; this is a well-known problem for Cummins-style accounts, and
  for "big-F function" vs "little-f"). Actually there''s a well-known point: causal-role
  accounts struggle to accommodate malfunction too, unless indexed to the containing
  system''s normal capacities. And the normal/proper-function account (Neander''s
  "proper function" / Boorse''s normal function) handles dysfunction by definition.
  So the final question "what does each pay" is well-posed and rich: the selected-effect
  theorist pays with a type/token or statistical refinement; the causal-role theorist
  pays because their account arguably cannot ground malfunction at all (so they can''t
  simply accept (9)); the normal-function theorist pays because normality needs an
  account (statistical normality vs. design-normality) and because a purely statistical
  notion makes novel-but-beneficial variants "dysfunctional" and makes universally-present
  defects "normal" — e.g., if every member of a species has a trait that fails, statistics
  says it''s normal. Also, the classic problem: statistical normality is relativized
  to a reference class (age, sex, species), which must be chosen non-arbitriously
  — that''s Boorse''s biostatistical theory and its well-known problems.


