  \ and locating positions). Actually the taxonomy type asks for diagnostic questions\
  \ where positions genuinely come apart.\n\nOption D: Lakatos's research programmes\
  \ + role-play. Model plays Lakatos? Or plays a \"sophisticated methodological falsificationist\"\
  \ evaluating a research program, e.g., in a field the asker works in. The asker\
