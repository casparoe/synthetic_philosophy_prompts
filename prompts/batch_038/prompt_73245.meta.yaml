  \ sophisticated\" — that's safe, since Lakatos's paper is literally titled around\
  \ \"sophisticated\" (the term appears in the text: \"sophisticated methodological\
  \ falsificationism\"). Yes, I'm confident Lakatos uses \"naive falsificationism,\"\
  \ \"naturalistic falsificationism,\" \"methodological falsificationism,\" and \"\
  sophisticated (methodological) falsificationism.\" I'll use \"sophisticated methodological\
  \ falsificationism.\"\n\nLet me double-check one thing: did Lakatos claim that MSRP\
  \ should be appraised by its own standards, i.e., that it produces progressive problemshifts\
