  \ falsificationism_0 (naive, dogmatic?), _1 (naturalistic), _2 (methodological),\
  \ _3 (sophisticated/methodological with a twist?). Hmm — that's fairly deep. If\
  \ I use \"falsificationism_2\" in the prompt as a term the student uses, a knowledgeable\
  \ model will handle it, but I risk misattributing. Safer: refer to \"sophisticated\
