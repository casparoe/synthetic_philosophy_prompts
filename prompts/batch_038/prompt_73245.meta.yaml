  \ confident. I don't need to quote it; I'll frame it in the student's voice as a\
  \ concession/challenge.\n\nAlso: Lakatos famously wrote the 1971 paper with appraisals\
  \ — e.g., he appraised the Bohr programme as degenerating (\"the programme of the\
