  \ commitments does a practice presuppose\"? Hmm, e.g., the practice of journal peer\
  \ review... no.\n\nActually, let me think about which combination yields the most\
  \ in-the-weeds, non-regurgitable but still answerable-without-search prompt.\n\n\
  Option A: Infinite ethics + role-play. Play a defender of \"catch-up\" / overtaking\
  \ criterion against someone using discounting... The asker is a PhD student in economics\
  \ or philosophy. Setup: I want to practice defending... The model plays a committed\
  \ opponent. Injection of niche ideas: e.g., the asker has constructed a specific\
  \ population/infinite-horizon scenario. Hmm, infinite ethics involves: aggregation\
  \ over infinite populations, the problem that total utilitarianism diverges, discounting,\
  \ averaging, Pareto violations in infinite settings (e.g., Vallentyne, Arrhenius,\
  \ Ng, Bostrom's \"infinite ethics\" 2011 review), the \"repugnant conclusion\" transposed\
  \ to infinite worlds, the impossibility results of Arntzenius? Actually there's\
  \ a known problem: with infinite populations, you can have worlds where one Pareto-dominates\
  \ the other in the sense of every location being better yet total sums equal. Also\
  \ the \"Pascal's mugging\" and \"infinite expected utility\" issues. Also the St.\
  \ Petersburg paradox variants.\n\nOption B: Davidson's radical interpretation +\
  \ role-play where the model plays Davidson himself, constrained to use only resources\
  \ available to him, pressed by a \"neo-Wittgensteinian\"/\"content externalist\"\
  \ or by an ML researcher asking about LLMs as radical interpreters. Hmm, but the\
  \ \"Leibniz + LLM\" example is close to that structure; I should avoid reusing that.\n\
  \nOption C: Cause prioritization frameworks + taxonomy/decision tree. I like this:\
  \ the ITN framework is often presented as a naive flowchart, but there are subtle\
  \ disputes: whether neglectedness is an independent criterion or a proxy for marginal\
  \ value; whether importance is a property of the cause area or of the intervention;\
  \ whether tractability includes \"our\" tractability vs. anyone's; whether diminishing\
  \ returns should replace neglectedness; whether expected value multiplies or something\
  \ else. A decision tree that sorts practitioners by their answers about marginal\
  \ cases. This can be made in-the-weeds: include cases like a cause area that is\
  \ highly important and tractable but where the marginal donor's dollar does nothing\
  \ (because funding is already abundant — a \"neglected\" vs. \"diminishing returns\"\
  \ split), or where tractability depends on our own research changing what's tractable,\
  \ or where the intervention is important only if a certain empirical hypothesis\
  \ holds, etc. Also, the \"hits-based giving\" / \"lottery ticket\" view where low\
  \ probability of success is a feature not a bug — that breaks the multiplicative\
  \ ITN model. And there's the \"value of information\" view: some interventions are\
  \ chosen not for their direct impact but to produce information for others. Those\
  \ are real, moderately niche but knowable ideas.\n\nHmm. Option C is nice but \"\
  cause prioritization frameworks\" is heavily represented in EA writing that models\
  \ have seen. The requirement is that the prompt inject new/niche ideas. I can inject:\
  \ a specific scoring rule an organization uses, plus ask the tree to be built from\
