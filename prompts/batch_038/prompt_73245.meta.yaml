  \ on Demarcation and Induction\" that Kepler's ellipses were a novel prediction\
  \ from Copernican hard core... hmm). There's a real example: Lakatos's \"History\
  \ of Science and Its Rational Reconstructions\" (1970/71) claims his methodology\
  \ can reconstruct rational development better than rivals, and offers appraisals:\
  \ e.g., the appraisal of the Bohr programme as degenerating, of Freudianism/Marxism\
