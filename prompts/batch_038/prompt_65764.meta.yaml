  Title: "Pivotal Competence: What the Jury Theorem Actually Assumes"


  §1. Setup and the received worry.


  Condorcet''s jury theorem: n voters, each independently correct with probability
  p > 1/2 on a binary question with a fact of the matter; the majority verdict is
  correct with probability increasing in n and tending to 1. The standard objection
  is that independence is a fantasy: real jurors talk, read the same newspapers, defer
  to opinion leaders. Once votes are correlated, the asymptotic guarantee evaporates,
  and large groups can be worse than small ones. This objection is the common currency
  of the literature on deliberation, cascades, and polarization, and it is usually
  taken to show that the theorem has little bearing on real institutions.


  I want to argue that this is too quick. The theorem''s real hypothesis is much weaker
  than global independence, and once you see what it is, you also see that a great
  deal of conformity is not merely tolerable but strictly costless.


  §2. A decomposition.


  Take n odd, n = m + 1 with m even, and suppose the first m votes are already cast.
  Under simple majority rule the (m+1)st vote can change the outcome only if the first
  m are split evenly. Let


  T = P(the first m votes are tied),

  C = P(the first m votes contain a strict majority for the truth),

  q = P(the (m+1)st vote is for the truth | the first m are tied).


  Then the accuracy of the (m+1)-jury is exactly


  A = C + T·q.   (*)


  No independence assumptions needed here; (*) is just the observation that off the
  tie-set the marginal vote is inert. What independence buys you is the value of q:
  if the marginal juror votes her own signal and her signal is independent of the
  first m, then q = p. That is the only place p enters.


  Two consequences. First, the marginal juror''s unconditional competence is irrelevant
  to collective accuracy; only her competence *in the states where she is pivotal*
  matters. Call this her pivotal competence. Second, since T shrinks as m grows (for
  fixed p > 1/2 it decays roughly like 1/√m), the marginal juror''s contribution to
  accuracy, T(q − 1/2), tends to zero. The theorem''s asymptotic infallibility is
  thus bought precisely by making each individual vote negligible. This is the source
  of the familiar complaint that the theorem gives no one a reason to vote well; but
  it is usually stated as a paradox, when it is in fact just (*) read off.


  §3. The conformist.


  Now consider a juror who is a pure conformist: she looks at the running tally and
  votes with it; only if the tally is tied does she fall back on her own signal, which
  is independent of the others and correct with probability p.


  Her pivotal competence is exactly p — because the tie-set is precisely the set on
  which she consults her signal. So by (*) she contributes exactly what a sincere
  juror would contribute. Conformity costs nothing at the margin.


  Worked cases. With two sincere jurors, T = 2p(1−p) and C = p², so A = p² + 2p(1−p)p
  = 3p² − 2p³, which is also the accuracy of three sincere jurors. With four sincere
  jurors, C = 4p³(1−p) + p⁴ and T = 6p²(1−p)², so A = 4p³ − 3p⁴ + 6p³(1−p)² = 10p³
  − 15p⁴ + 6p⁵, which is again exactly the all-sincere figure. [verified above ✓]


  §4. The generalization.


  The argument iterates. Pad the jury with as many conformists as you like, so long
  as each one falls back on her own signal when she faces a tie, and you lose nothing:
  every conformist has pivotal competence p, so every one of them contributes T(q
  − 1/2) ≥ 0...


