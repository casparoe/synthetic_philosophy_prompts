  7. "the group ought, by majority rule, to say that both premises hold and hence
  that the defendant is liable" — fine.

  8. "it is not even consistent" — correct.

  9. "This is the doctrinal paradox, or discursive dilemma" — a careful theorist distinguishes:
  doctrinal paradox is the legal/jury version (Kornhauser & Sager), discursive dilemma
  is List & Pettit''s generalization about groups reasoning discursively; treating
  them as mere synonyms is a simplification, and importantly the word "discursive"
  refers to reasoning-by-discussion, not to "whether to discuss or to vote." Good:
  the everyday-sense term point.


  Also maybe: the popularizer says the paradox shows that "majority voting over logically
