  Draft summary (the embedded text):


  "Here is the trouble with group belief. Suppose a three-judge panel must decide
  a contract case, where liability follows if and only if two things hold: that the
  defendant did the act, and that the contract forbade it. All three judges accept
  that equivalence; they differ on the facts. Judge 1 accepts both, Judge 2 accepts
  only the first, Judge 3 only the second. Now ask them one at a time. On each of
  the two premises a majority says yes — two out of three — so the group ought, by
  majority rule, to say that both premises hold and hence that the defendant is liable.
  Ask instead the single question ''Is the defendant liable?'' and a majority — the
  same two judges who split their support across the premises — says no. Nothing has
  changed except the order of the questions. This is the doctrinal paradox, or discursive
  dilemma, and it is the belief-shaped cousin of Condorcet''s cycling majorities:
  majority voting over logically connected propositions can hand a group a set of
  judgments that no member of it holds, and that is not even consistent.


  Two general lessons follow. First, the fix is obvious once stated: vote on the reasons,
  not on the conclusion. Aggregating premise by premise always produces a consistent
  collective set, because the premises are logically independent of one another, whereas
  the conclusion just packages them; the conclusion-based vote is what generates the
  contradiction, and courts that want to be rational should therefore always decide
  element by element. Second, this is not a quirk of small panels or of the legal
  setting. List and Pettit proved a general impossibility: no aggregation rule can
  simultaneously accept every possible combination of individual judgments as input,
  treat all voters alike, treat all propositions alike, and always deliver a complete
  and consistent collective judgment set. Since the conditions are all ones any democrat
  should want, the only way out is to designate a dictator — to let some one member''s
  judgments stand for the group''s. So the phrase ''the committee believes'' turns
  out to be a figure of speech. Groups can be held responsible, and they can be dangerous,
  but they cannot be believers; wherever a group seems to have a mind, either one
  person is really doing the thinking or the thinking is incoherent."


  Errors embedded:

  1. "the premises are logically independent of one another, so premise-based aggregation
  always produces a consistent set" — false; premise-based procedures can generate
  inconsistent collective sets (e.g., when the agenda contains conditionals/connected
  propositions — a majority can accept p, accept p→q, and reject q; List-Pettit''s
  "path-connectedness"; also Dietrich & List). Also "because the premises are logically
  independent" is wrong as a general claim.

  2. "the only way out is to designate a dictator" — overstatement; the conditions
  can be weakened (drop universal domain, drop systematicity/independence, allow incomplete
  collective judgment sets, restrict the agenda, use premise-based rules on structured
  agendas, etc.). Note also that anonymity already rules out dictatorship, so "the
  only way out is a dictator" is internally in tension with the stated conditions
  (a nice subtle catch: anonymity is incompatible with dictatorship, so the popularizer''s
  diagnosis is confused — the real conclusion is that one of the conditions must go).

  3. "''the committee believes'' is a figure of speech / groups cannot be believers"
  — this inverts List and Pettit''s own use of the result: they argue for group agents,
  and their escape is to drop systematicity (accept that a group can be reason-responsive
  in a way that treats propositions non-uniformly), plus intentional discontinuities/unified
  agency. So the conclusion doesn''t follow.

  4. Also: "complete and consistent" — the completeness requirement is itself one
  of the contested ones; a careful theorist notes that dropping completeness is a
  live escape route. The popularizer lumps it in as uncontroversial.

  5. Minor: "discursive dilemma is the belief-shaped cousin of Condorcet''s cycling
  majorities" — fine, defensible (it''s related; though strictly it''s not the same
  structure: cycling vs. inconsistency). Actually a careful person might note that
  the analogy is loose: Condorcet cycles are about preference orderings and cyclical
  majorities; the doctrinal paradox is about logically connected propositions and
  inconsistency. Also the discursive dilemma isn''t merely a "special case" of Condorcet
  — the generalizations differ (Arrow vs. List-Pettit). A defensible simplification
  but worth flagging.

  6. "Nothing has changed except the order of the questions" — subtle: it''s not order
  but the level at which votes are taken (issue-by-issue vs. outcome), and the two
  procedures need not be sequential. Also the case example: judge 1 accepts both premises
  and hence liability, so on the outcome question, judges 2 and 3 say no liability,
