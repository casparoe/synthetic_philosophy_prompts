  Now the errors embedded:

  1. "Any rule specifying who gets to vote must itself be adopted by somebody, and
  if that somebody is a democratic electorate, then we need a prior rule..." — The
  regress claim: mostly right as a statement of Whelan''s point, but subtly wrong
  in that it presents the regress as showing that democracy "cannot found itself"
  and therefore rests on "an act of sheer power." The standard diagnosis: the regress
  is not vicious in the way described; what it shows is that democratic theory cannot
  be democratic all the way down — the boundary question must be answered by a non-democratic
  principle of legitimacy (which can be a moral principle, not an act of violence).
  Conflating "not democratically decidable" with "decided only by violence" is the
  key move. Also, conflating the boundary problem with the paradox of founding / with
  the claim that democracy is self-undermining. Also, the "must be adopted by somebody"
  premise is questionable: a constitutional rule determining the electorate need not
  be adopted by a democratic decision at all — it can be adopted by a founding assembly,
  or be part of a treaty, or follow from a normative principle that isn''t anybody''s
  act. Normative principles aren''t "adopted."


  2. "Every actually existing democracy therefore rests on an undemocratic foundation"
  — an overstatement: even if the original boundary decision wasn''t democratically
  authorized, that doesn''t mean the foundation is undemocratic in a pejorative sense;
  also, subsequent boundary decisions (e.g., enfranchisement reforms) can be democratically
  ratified, and legitimacy may be conferred prospectively. Also, one can deny the
  premise that historical illegitimacy in founding transfers to present legitimacy
  (the "ought implies can"/historical taint issue).


  3. "The only honest alternatives are (a) accept politics begins in violence or (b)
  shared nationality fixes the boundary" — false dichotomy: there are other responses
  — the all-subjected principle (all those subject to the coercive authority of the
  state have a claim to a say), the all-affected-interests principle, procedural/moral
  constraints on border regimes (Abizadeh: unilateral border closure is illegitimate
  because coercive border enforcement must be justified to those coerced), the "demo-cratic
  bootstrapping" view that the demos can be provisionally constituted and then ratified,
  cosmopolitan responses, and the view that the regress is benign (an infinite regress
  of justification isn''t fatal if each step is legitimate), or that the boundary
  question is a matter for a higher-order norm rather than a decision.


  4. The all-affected point: the objection stated ("which decisions affect whom is
  itself determined by decisions made by some demos") is a real objection in the literature
  (the circularity/indeterminacy critique of all-affected), but the summary''s conclusion
  "so the all-affected principle presupposes the very boundaries it was supposed to
  justify" overstates: the standard replies are that affectedness can be cashed out
  in terms of interests, that the principle functions as a criterion of who ought
  to be included rather than as a decision procedure (a normative standard external
  to any demos), and that a criterion can be self-applying without circularity, since
  it doesn''t need a demos to apply it — it needs an agent of application but not
  a democratic one. Also, the "affectedness depends on decisions" objection confuses
  the fact of being affected with the institutional articulation of the decision.
  Also there''s Goodin''s point about "possibility of being affected," and the distinction
  between "actually affected" and "whose interests are at stake."


  5. "The upshot is that ''the will of the people'' is a fiction, since there is no
  non-arbitrary answer to the question of which people." — Conflation: even if the
  boundary question has no uniquely correct answer, that doesn''t make the will of
  the people a fiction within a settled demos; aggregation problems (Arrow, cyclical
  majorities) are a separate worry that the summary slides into. Also, "no non-arbitrary
  answer" ≠ "no answer" (epistemic vagueness vs. indeterminacy). And the leap from
  a meta-level problem about scope to a first-order claim about the fictiveness of
  popular will is a non sequitur.


