  — the "list itself is a result" possibility. Requirements for an adequate theory
  of X where X = an account of knowledge/justified belief that handles dogmatism.
  Let me draft candidate desiderata:


  D1. Learning must be possible: the account must not make it impossible/rational
  to gather new evidence about p, and must not license ignoring new evidence in the
  ordinary case. (Motivating case: a doctor who knows the diagnosis and then ignores
  a contradictory lab result; the juror; the person who refuses to check.)

  D2. Closure (or some principle transmitting warrant/knowledge across known entailment)
  must be handled explicitly — either preserved, restricted, or rejected with a principled
  line, not ad hoc. (Motivating: the paradox uses closure to get from knowing p to
  knowing that any future evidence against p is misleading.)

  D3. Must respect the fact/knowledge asymmetry: knowing p does entail that all counter-evidence
  is misleading — the account shouldn''t deny this trivial truth but should explain
  why it doesn''t license the dogmatist policy. (i.e., distinguish "truth of the proposition
  that counter-evidence is misleading" from "the permissibility of adopting a policy
  of dismissal".)

  D4. Timing/indexicality: must handle the fact that what you know now may not be
  what you know later once you receive the counter-evidence — must say whether knowledge
  can be lost by acquiring misleading evidence (and if so, whether it''s lost in every
  case or only some; and whether losing knowledge is compatible with retaining high
  credence).

  D5. Must handle the "pre-emption" version: you can''t be dogmatic in advance about
  a proposition whose evidence you haven''t yet seen, but arguably you can be about
  propositions you do know. Must explain the difference between dismissing evidence
  you have already considered and dismissing evidence in advance ("prospective immunity").

  D6. Distinctions it must not collapse: knowing p vs. being certain of p vs. p being
  highly probable on your evidence; misleading evidence vs. defeating evidence; a
  policy of dismissal vs. a disposition; propositional vs. doxastic; the difference
  between the claim that you will be justified and the claim that you should now bind
  yourself.

  D7. Must be consistent with the general anti-skeptical desideratum: the escape route
  must not be so radical that it makes most ordinary knowledge claims false (e.g.,
  denying closure in a way that also blocks transmission generally / denying that
  evidence can raise your credence).

  D8. Must generalize: the account must handle the parallel puzzles (easy knowledge
  / bootstrapping, the preface-like tension, the surprise examination?) — or explain
  why it need not. Actually, "must handle the analogous problems that use the same
  machinery" is a strong desideratum — e.g., if you deny closure to solve dogmatism,
  you should check whether you''ve thereby lost the ability to explain how testimony/perception
  transmit warrant.

  D9. Must not smuggle in a "self-fulfilling" element: e.g., a safety/sensitivity
  account must explain why knowing p doesn''t make your future dismissal safe.

  D10. Must accommodate the normative point: rationality requires responsiveness to
  evidence (there''s a requirement of "evidence-responsiveness" or "non-akrasia");
  the account must say whether this is a genuine requirement or a prejudice of the
  internalist camp.

  D11. Must handle higher-order: whether knowing p requires knowing that you know
  (KK), and whether the account''s verdicts vary with the availability of higher-order
  knowledge.

  D12. Must handle cases of known-unreliable future evidence: the case where you have
  learned that a source is unreliable, so you legitimately dismiss its reports — the
  account must not make all dismissal irrational (the "legitimate dogmatism" datum:
  dismissing a known liar, ignoring a known-broken instrument). This is important:
  the desiderata must let the theory distinguish legitimate from illegitimate pre-emptive
  dismissal.

  D13. Must be consistent with probability theory / Dutch-book-ish constraints if
  it''s a credence-based account (no self-undermining credence policies).

  D14. Explanatory: should explain why the paradox feels compelling — a diagnosis,
  not just a block.


  Which requirements are negotiable vs. not: e.g., "must preserve closure" is a camp
  commitment (Dretskeans reject it); "must allow knowledge to be lost" is negotiable;
  "must not license blanket dismissal" is non-negotiable; "must explain the intuition"
  is a preference (some are happy to bite the bullet, à la Harman?).


  Jointly unsatisfiable subsets: D2 (closure unrestricted) + D3 (knowing that all
  counter-evidence is misleading, which follows from knowing p) + D4'' (knowledge
  is stable / cannot be lost by acquiring misleading evidence) + D1 (must not license
  dismissal) — that''s the classic tension: if knowledge is closed and stable, then
  you can know now, in advance, that any future counter-evidence is misleading, and
  if you know that, then dismissing it is rational, so D1 fails. So the paradox''s
  real content: you can''t have unrestricted closure + stability of knowledge + the
  prohibition on pre-emptive dismissal + the trivial entailment. That''s a nice "the
  list itself is a result" element to invite.


