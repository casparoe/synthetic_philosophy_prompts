  Harman''s version (Thought, ch. 5?): You learn that a certain newspaper is reliable
  — you acquire evidence that reports in it are likely true. Also, you know that you
  will later receive reports in that newspaper. And you know that if the newspaper
  reports p, then (given reliability) p is true. So you seem to be in a position to
  know now that when you later read the paper reporting p, you will be justified in
  believing p and you may dismiss any contrary evidence you receive in the future
  as misleading. Hence dogmatism: knowing in advance that future counter-evidence
  will be misleading.


  Kripke''s paradox of knowledge (the "dogmatism paradox"): Suppose you know p. Then
  you know that p is true. So you know that any evidence against p is misleading evidence.
  Therefore you should dismiss all future evidence against p. Kripke''s analysis:
  the paradox arises because knowing p entails being able to know that all future
  evidence against p is misleading, but you cannot acquire that knowledge in advance
  — it''s about the order/timing of acquiring knowledge; the conclusion "I should
  disregard future evidence" doesn''t follow because at the time you receive the counter-evidence,
  your knowledge that p may have been undermined (you no longer know p, and so you
  no longer know that the evidence is misleading). The KK principle and the closure
  of knowledge under known implication do yield the premises; Kripke resolves by noting
  a shift in the epistemic situation: once you acquire the counter-evidence, you no
  longer know that p, so the derived knowledge that the evidence is misleading evaporates
  — it''s a kind of "unstable" knowledge. Also related: the paradox is avoided if
  knowledge requires that you not have misleading evidence, or if the relevant knowledge
  isn''t available in advance.


