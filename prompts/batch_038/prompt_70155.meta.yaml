  Draft:


  "I am preparing a session of an interdisciplinary seminar on the design of goal-directed
  artificial agents, and the topic is reward tampering and wireheading. One of my
  colleagues reliably reaches for the same illustration whenever the discussion turns
  to whether intelligence alone might protect an agent from seizing control of its
  own reward channel: the rats in the Olds and Milner self-stimulation experiments,
  which pressed a lever to send brief electrical pulses into their own brains and,
  on the popular telling, kept pressing until they neglected food, water, and mating
  altogether. His inference is that the rat''s cleverness was no protection — the
  animal never had to understand the electrode in order to be destroyed by it — so
  the suggestion that a sufficiently sophisticated agent would ''know better'' than
  to tamper with its reward signal is empty, and the only serious remedy is never
  to build the lever: no architecture that grants an agent direct, unmediated access
  to its own reward channel.


  A second colleague objects that the illustration is rigged in the opposite direction:
  the rat has no representation of the electrode, no model of what pressing does,
  and no capacity to endorse or reject the impulse; an artificial agent advanced enough
  to be dangerous would have all three, and might therefore decline the lever even
  while feeling its pull. On this view the analogy smuggles in precisely the ignorance
  that the real case excludes.


  Could you audit the rat analogy for me? Specifically:


  1. Set out the mapping explicitly — a table is fine — saying what in the artificial
  case plays the role of the electrode, the lever, the food and water the rat abandons,
  the experimenter who installed the apparatus, and the rat''s ignorance of what the
  pulses are.

  2. Separate the disanalogies that actually bear on my first colleague''s conclusion
  from the ones that are merely rhetorically convenient. ...

  3. Identify what the analogy quietly imports ... — the assumption that the reward
  channel is a signal of something else that remains valuable when the signal is seized;
  the assumption that there is a standpoint outside the agent from which the outcome
  counts as a failure; the assumption that the agent and its reward function are separable,
  so that the agent could be said to be misled by or enslaved to something that is,
  by hypothesis, the whole of what it cares about; and the fact that the lever is
  bolted to the cage floor, whereas an artificial agent might dismantle the channel,
  rewrite its own utility function, or install a lock on it.

  4. ... verdict on the conclusion, and on the second colleague''s objection — is
  knowledge a defense, or merely a clearer-eyed version of the same behavior?

