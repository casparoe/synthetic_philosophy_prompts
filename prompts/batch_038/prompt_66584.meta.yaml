  This is a fantastic fit for the flying man: the moment of dissociation is precisely
  the discovery that "I" am not identical to the body, to the aunt, to any particular
  person — Avicenna''s point that self-awareness is not derived from bodily awareness.
  But Bishop''s poem resists Avicenna: her self-awareness comes with horror, not serenity;
  it''s triggered by images and by the felt similarity to her aunt ("you are an I,
  you are an Elizabeth, you are one of them too"); and the poem ends by returning
  her to the body, the world, the date and the place — i.e., embodiment and indexical
  re-grounding. Whereas Avicenna''s flying man ends in the certainty of the soul''s
  separability. Also: Avicenna''s flying man is an adult created ex nihilo with no
  memory; Bishop''s child has a full history and it''s memory/imagination (the National
  Geographic) that triggers the flight. And the "falling" is exactly Avicenna''s suspension
  in air. Also, the question of indexicality: Avicenna says the man affirms "his self
  exists" — but what does "I" mean for him if he has no body to pick out? Bishop''s
  child asks "Why should I be my aunt, or me?" — a problem of individuation that Avicenna
  needs: if the self is not the body, what makes my self numerically distinct from
  yours? Avicenna''s answer involves the soul''s attachment to a particular body from
  the beginning (individuation via matter/origins). Bishop''s poem raises exactly
  the worry: "you are one of them too." That''s a strong, in-the-weeds prompt: the
  poem dramatizes the individuation problem for Avicenna''s soul, and the model has
  to handle both Avicenna''s own resources and the poem.


