  Gödel''s 1949 rotating universe solution to Einstein''s field equations admits closed
  timelike curves; Gödel argued that this shows time is not objective ("an a posteriori
  discovery of the ideality of time"), connecting to Kant and to his belief that time
  is unreal. The "proves too much" argument: (1) If a cosmological model permitted
  by the field equations and compatible with all known physical law contains closed
  timelike curves, then time travel is physically possible. (2) Gödel''s rotating
  universe is such a model. (3) Therefore time travel is physically possible. (4)
  But Gödel''s own conclusion was stronger: because a physically possible world lacks
  objective time (the lapse of time), our world''s time is not objective either —
  since what time is cannot depend on contingent facts about matter distribution.
