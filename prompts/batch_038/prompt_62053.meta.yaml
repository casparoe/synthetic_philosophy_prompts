  Option A: No-free-lunch + argument that proves too much. The argument: (1) No algorithm
  outperforms every other on every problem (trivially true). (2) Averaged over all
  possible target functions, all algorithms have identical performance (NFL). (3)
  Any prior favoring some functions is a choice among an infinite set with no principled
  basis — Hume''s point: past regularity gives no reason about the future. (4) So
  induction has no rational foundation; successful learning is an artifact of the
  distribution. (5) But by the same reasoning, the NFL theorem itself is a generalization
  from a finite set of theorems about finite hypothesis spaces to all of learning,
  so it too is unsupported. (6) Therefore NFL refutes itself. Hmm, that''s a self-defeat
  argument. Nice but maybe slightly cheap.


  Better version: an argument that seems to prove that machine learning is impossible
  / that all algorithms are equally good, which is absurd given practice, and ask
  where it goes wrong. The flaw: NFL holds only under a uniform prior over all possible
  target functions including all anti-correlated ones, and requires the performance
  measure to be averaged over all functions; also the "off-training-set" error theorem
  conditions; also the requirement that the distribution be uniform and that all functions
  be equally likely, which is exactly the contested premise. Also the equivocation
  between "no algorithm is universally best" and "no algorithm is better than any
  other on the actual problems we face."


