  Actually, one subtlety: is it true that if you know P you know that any evidence
  against P is misleading? That requires P → (evidence against P is misleading), which
  is true if P is true, plus closure of knowledge. The paradox. Standard replies:
  (1) The reasoning is valid but the conclusion isn''t absurd — knowledge IS dogmatic
  (Harman actually bites the bullet, or partially); (2) Distinguish between misleading
  evidence and defeating evidence: the fact that the evidence is misleading is a higher-order
  fact, and one can''t know which evidence is misleading in advance without knowing
  the total evidence; (3) The relevant principle fails: you may know P and know that
  P entails that contrary evidence is misleading, yet you can''t rationally ignore
  evidence because rationality requires responding to the evidence you actually have,
  not to what you know about its truth-value (this is roughly the "evidence is not
  the same as truth" reply, cf. the discussion of "misleading evidence" and of the
  KK principle); (4) Sorensen''s reply: the dogmatist''s inference is an instance
  of a general pattern that fails because knowledge isn''t closed under certain conditions
  / because of the "blindspot" structure. Also Kripke''s own suggested solution: distinguishing
  "knowing that P entails Q" from "being able to infer Q" — hmm. Kripke''s response
  (from "A Puzzle About Belief"? no) — Kripke proposed that the paradox shows something
  about the closure of knowledge under known entailment? Actually I recall Kripke''s
  own discussion in his 1970s lectures suggests that the problem is with treating
  "evidence against P" as something one can disregard because the reasoning is a "self-vitiating"
  one, similar to the paradox of the surprise examination. Also relevant: the "no-trouble"
  reply that the conclusion is about permission to disregard, and it''s actually fine
  because we should be dogmatic about what we know.


