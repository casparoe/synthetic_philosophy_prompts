  Analogy: "Moral compromise is a trade — like a market exchange between parties who
  want different things; there are gains from trade; we should just find the exchange
  rate." Used in effective altruism / rationalist circles to argue that we should
  treat disagreements with other value systems as bargaining opportunities: e.g.,
  "we support their animal welfare initiative if they support our AI safety initiative"
  — the analogy licenses the conclusion that compromise is always Pareto-improving,
  that refusing to compromise is irrational stubbornness (leaving gains on the table),
  and that there''s no principled objection to trading values.


  The audit: map the source (market trade) onto target (moral compromise):

  - goods traded ↔ concessions / resources / political support

  - preferences ↔ values

  - prices/exchange rates ↔ the terms of compromise

  - Pareto improvement ↔ both sides better off on their own lights

  - no third party ↔ but moral compromises have externalities: the beneficiaries of
  the values (animals, future people, patients) can''t consent; the parties trade
  goods that aren''t theirs.

  - revealed preference: in markets, wanting is enough; in morality, values come with
  claims about correctness — you can''t coherently treat your own values as merely
  your preferences while also thinking the other side is wrong. Trading presupposes
  each party''s ordering is authoritative for them.

  - fungibility: markets need a common measure (money); moral values resist commensuration
  — and the analogy imports the assumption that everything is measurable in units
  of "utility" or "expected value."

  - divisibility/rivalry: goods are rival and divisible; concessions about principles
  aren''t divisible — e.g., you can''t half-allow torture.

  - Identity/integrity: repeated trading changes the parties; a trader''s preferences
  are stable; a moral agent''s commitments constitute who they are (Williams'' integrity
  objection — well-known enough).

  - Enforcement/contract: markets presuppose property rights and enforcement; moral
  compromise has no umpire — who adjudicates the terms? Nash bargaining solution requires
  a threat point, which in ethics is often "continued conflict," and the threat point
  may itself be unjust (this is the big one: gains from trade depend on the status
  quo/disagreement point, which may reflect prior injustice — so "gains from trade"
  can entrench an unfair baseline. That''s a well-known point in political philosophy,
  e.g., criticism of bargaining approaches.)

  - Corruption/expressive dimension: some things shouldn''t be priced (Anderson, Sandel
  — well-known). Trading on values signals something about the value''s status.

  - Dynamic effects: markets have competition and prices that reveal information;
  moral "markets" lack price signals, and repeated compromise can be slippery-slope.


