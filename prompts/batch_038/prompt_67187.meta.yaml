  Philosophy & Public Affairs).


  Taurek''s key claims:

  - Given a choice between saving five strangers or one stranger (David), we should
  flip a coin; each person''s loss is equally great, and losses don''t add up across
  persons. "the death of one person is a loss to that person, ... there is no overarching
  entity ''the aggregate'' that suffers the loss of five."

  - He distinguishes cases where there''s a prior obligation/duty (e.g., parent-child,
  or a duty derived from having created the peril).

  - He rejects the idea that we can sum harms across persons — "there is no such thing
  as a sum of sufferings" / losses don''t add up.

  - Taurek considers that the five don''t have a stronger claim; each has an equal
  claim.

  - He also discusses the case of the drug/disease where you have a limited supply.

  - Taurek also argues against the idea that the numbers count in cases of saving
  one''s own loved one — partiality.

  - Taurek''s argument relies on the separateness of persons — but interestingly,
  Taurek is sometimes read as an anti-utilitarian; Rawls''s "separateness of persons"
  objection to utilitarianism is related, and Taurek invokes a similar idea (each
  person''s loss is his own; there''s no super-person who experiences the sum). Actually
  Taurek''s argument: the loss to the five is not the sum of five losses of a life,
  since each loss is only a loss to that person.


  Common subtle mistakes a student might make:

  1. Conflating Taurek with Scanlon''s contractualism (Scanlon''s "What We Owe to
  Each Other" defends pairwise comparison as a response to Taurek; Scanlon''s "Numbers"
  lecture). A student might attribute the coin-flip to Scanlon, or say Scanlon agrees
  with Taurek. Actually Scanlon developed a response: pairwise comparison, where in
  the 5-vs-1 case, saving the five is justified because the one''s complaint is balanced,
  and the extra four have unbalanced complaints. So attributing aggregation-justification
  to Taurek, or attributing the coin flip to Scanlon, is a misattribution.

  2. Saying Taurek is a Kantian / that Taurek thinks we must respect each person as
  an end — conflating with the "each person counts as one" idea.

  3. Thinking Taurek denies we should ever save the greater number (he allows it''s
  permissible to save the five, just not required; the coin flip is his suggestion,
  and he says he''s not committed to the coin flip being mandatory — actually Taurek
  says "I would argue that we should flip a coin"? Let me recall. Taurek suggests
  that a fair procedure (coin flip) respects each person''s equal claim. But he also
  acknowledges alternatives. He says "we may... let the coin decide." Hmm, in some
  readings Taurek says the coin flip is one way to show equal concern.

  4. Conflating Taurek''s view with "numbers never count" vs "numbers don''t always
  count" — Taurek''s title is "Should the Numbers Count?" and he holds they don''t
  count in the way aggregativists assume, but he does allow that in cases of prior
  duty (e.g., a duty to save more people? or the case where the many have a stronger
  claim because they were the ones you endangered).

  5. Confusing the "separateness of persons" with individualism vs the no-sums claim.

  6. Confusing Taurek with Parfit — Parfit discusses Taurek in "Innumerate Ethics"
  and "Can We Avoid the Repugnant Conclusion?" Actually Parfit''s discussion of "Taurek''s
  view" in "Equality or Priority" / Innumerate Ethics. Parfit offers the "no-difference"
  view. A student might attribute Taurek''s argument to Parfit or say Parfit defends
  it.

  7. Confusing with Kavka? Or with John Broome''s fairness discussion (Broome''s "Fairness"
  argues for proportional chance / the weighing view).


