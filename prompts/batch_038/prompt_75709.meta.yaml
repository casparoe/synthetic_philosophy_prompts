  "(a) The first thing to separate is the truth of what Nadia says from Nadia''s position
  to say it. That she is careless with money in a way she hides from her husband,
  and that she tells her brother he is careless with money, are two different facts,
  and the second does not make the first untrue. If a person who cheats on their taxes
  says that cheating on taxes is wrong, they have said something true; the wrongness
  of tax cheating doesn''t depend on who is saying it. The classic name for the mistake
  here is tu quoque: replying to a claim by pointing at the claimant. So ''no standing''
  cannot mean ''not true,'' and it cannot mean ''not justified'' either, at least
  not in the ordinary way, since Nadia is in as good a position as anyone to know
  that hiding debts from a spouse is a bad thing to do and that carelessness with
  money is a fault.


  What ''no standing'' does mean, I think, is that something about the blamer''s own
  relation to the standard makes her blame the wrong thing to do, even when the standard
  and her application of it are both correct. It''s not about the content of the judgement,
  it''s about who is entitled to make it and in what way.


  (b) In this case the reason Tomas''s remark has force is fairness. Nadia has spent
  three years holding him to a standard she has not held herself to. She has, in effect,
  taken the benefit of the standard — the authority to sit in judgement, the superiority
  it gives her in the family — without paying its cost. That''s a kind of free riding,
  and free riding on a moral standard is what makes the hypocrite''s blame unfair
  rather than merely unlucky. It also involves a claim about the two of them: that
  she is the sort of person who is above this fault and he is not. That claim is false,
  and it is the falsity of that claim, not the falsity of ''carelessness with money
  is a fault,'' that undercuts her.


  There''s a second thing wrong with her blaming that has nothing to do with hypocrisy,
  and it''s worth keeping separate because the case is built to make you run them
  together. The family finds her remarks humiliating. Blame that is delivered as humiliation
  is not really moral address; it doesn''t invite the other person to see anything,
  it just ranks them below you. Even a person with spotless financial conduct would
  be doing something objectionable in blaming this way. So Tomas has two complaints,
  and they can come apart: he might have the second without the first.


  Is his remark right? Yes, in a limited sense. He is right that she is in no position
  to say it to him; he is wrong if he thinks that shows he has been misdescribed.


  (c) Suppose Nadia were angrier with herself about the overdrafts than she has ever
  been with Tomas. I''d say the hypocrisy goes away, and with it the standing problem.
  Hypocrisy is essentially a matter of insincerity — saying what you do not believe,
  or at any rate saying what you do not do and pretending that you do. A person who
  berates herself is not pretending anything: she is applying the standard across
  the board, and she is saying exactly what she thinks. There is then nothing unfair
  left in her blame, and no question of standing arises; Tomas''s objection loses
