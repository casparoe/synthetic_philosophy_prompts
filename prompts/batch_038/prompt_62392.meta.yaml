  Draft:


  I cover science and ideas for a magazine with a philosophically literate readership,
  and I have been commissioned to write a long feature on the question of when an
  experience happens. The centre of the piece is going to be the colour phi phenomenon
  and the argument it sparked, and my problem as a reporter is that I cannot tell
  what the argument is about any more.


  The facts, as I have them: two small spots of different colours are flashed in different
  places on a screen, the second within a few tens of milliseconds of the first, and
  at the right combination of spacing and interval subjects report not two flashes
  but one spot moving between the positions — and, crucially, they report it changing
  colour partway along the path. The change is therefore reported at a time when,
  on any straightforward account, nothing could yet have been detected: the second
  spot, which is what carries the new colour, had not appeared. Kolers and von Grünau
  found the effect in the 1970s while chasing a question from Nelson Goodman; Dennett
  made it a philosophical instrument in Consciousness Explained, and then, with Marcel
  Kinsbourne, gave the field the two labels everyone still argues with. On the ''Orwellian''
  model, the subject does have an experience in the ordinary order — first spot, then
  second — but the later record is revised, so that what gets reported is a mid-path
  colour change that never occurred as reported. On the ''Stalinesque'' model, the
  sequence is edited before it is ever presented to the subject: the experience of
  motion-with-a-midway-change is composed offline and delivered as a single package,
  so that nothing is subsequently tampered with. Dennett and Kinsbourne''s striking
  claim was that the two models make exactly the same predictions about anything the
  subject can say, and that this is no accident — the question ''when did the experience
  happen'' has no determinate answer to be gotten wrong about.


  The critics have been saying versions of the same things for thirty-odd years: that
  the indeterminacy claim quietly assumes Dennett''s own account of how reports are
  produced; that Orwellian revision is independently implausible because the trace
  of the first colour survives and can be probed; that representationalist theories
  of experience give the timestamp a home without any inner event needing one; that
  vision science has since accumulated postdictive effects — flash-lag and its relatives
  — that look like real evidence for one model over the other. And Dennett''s side
  answers that every such probe is just another report, generated by the same machinery,
  and therefore inherits the same indeterminacy. Nobody moves. Both camps can predict
  each other''s next paragraph exactly.


  My hypothesis, which I want you to test rather than flatter: the stalemate is not
  a disagreement about the brain, nor even really about consciousness, but about the
  logical type of the word ''when'' — one side is asking for the clock time of a vehicle,
  the other for the time an experience represents itself as occurring at, and the
  two are not rivals because they are not answers to the same question. A subsidiary
  guess: the political metaphors are doing unearned work, since Orwell and Stalin
  both involve tampering with a record against which the original can in principle
  be checked, and the disanalogy — that experience has no such independent record
  — is precisely the thing the debate keeps failing to name.


