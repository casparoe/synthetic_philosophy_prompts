  The subtle errors I could plant:

  1. Claiming that the old-evidence problem arises because Bayesianism can''t learn
  from evidence already known — actually the problem is specifically that conditionalization
  says nothing when P(E) = 1, and that the confirmation relation between H and already-known
  E is supposed to be a real confirmation (like GR and Mercury''s perihelion) yet
  Bayesianism assigns it zero confirmatory power.

  2. Claiming Glymour''s own solution was to drop conditionalization in favor of bootstrapping
  — that''s roughly right (bootstrapping).

  3. Claiming Jeffrey conditionalization solves it — wrong, it''s about probability
  shifts without new certainties, not about already-certain evidence. Actually Jeffrey
  conditionalization handles the case where E''s probability changes without becoming
  1; it doesn''t handle E already at 1 and known long ago. Some people wrongly think
  it does.

  4. Conflating the "old evidence" problem with the "problem of easy knowledge" or
  with the "problem of knowing a logical consequence" (logical omniscience) — a nice
  subtle conflation: claiming that if you already know E, then you already know that
  H entails E, so the problem dissolves. That''s actually the standard objection from...
  hmm, that''s an objection people raise, that a Bayesian can say "learning that H
  entails E" is itself new information. Glymour''s response-ish: for the perihelion
  case the astronomers already knew the entailment.

  5. Claiming the standard response is to "de-idealize by lowering P(E) below 1" (the
  Chalmers/Garber "old evidence" solutions: Garber''s approach — learn the entailment
  relation itself as new information; Chalmers'' — use a maximally noncommittal priors
  approach / spread priors over sentences of a language including H→E; Jeffrey — reassign
  priors). The summary could misattribute or misdescribe one of these.

  6. Claiming this shows Bayesianism is false rather than incomplete — a standard
  "objection presented as refutation."

  7. Using "confirmation" in the everyday sense.


