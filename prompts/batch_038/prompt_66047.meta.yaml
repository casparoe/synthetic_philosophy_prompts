  Logical omniscience teaching plan:

  - Audience: first-year PhD students in a formal epistemology sequence; they''ve
  had a term of probability (Bayes, conditionalization) but no modal logic and no
  possible-worlds semantics.

  - 75-minute session, whiteboard.

  - What must come first: the representation of belief states as sets of worlds; the
  idea that a proposition is a set of worlds; then closure: if p entails q, every
  world-set containing p contains q. So belief-as-world-set is logically omniscient
  by construction — not an optional idealization.

  - Why the "idealization" objection fails: the problem isn''t that the idealization
  is unrealistic but that it makes belief content unusable for certain purposes (modeling
  agents'' reasoning, knowledge attribution in epistemology, AI knowledge representation).

  - The distinction: logical omniscience vs. bounded computational resources. It''s
  not about effort; it''s about the format of representation. Even an agent with infinite
  computational resources but finite... hmm, actually the deeper point: on the possible-worlds
  picture, the content of belief is coarse-grained in exactly the wrong way. Adding
  impossible worlds fixes content but breaks the semantics (what makes an impossible
  world a world?).

  - Misconceptions to expect: (1) "it''s just an idealization like the frictionless
  plane" — defuse by showing that the idealization is not a simplification but a distortion:
  the theory cannot even state the difference between believing p and believing q
  where p and q are logically equivalent; (2) "the fix is to say agents only believe
  what they''ve explicitly derived" — but then you lose the closure principles needed
  for... (3) "Jeffrey conditionalization / uncertainty handles it" — no, that''s about
  degrees, not content; (4) "credences solve it because you can have credence 0.6
  in a tautology" — but coherence axioms require credence 1 in logical truths (the
  axioms of probability are usually stated assuming logical omniscience; the probability
  axioms themselves presuppose it). Actually, the standard Kolmogorov axioms: P(tautology)
  = 1 follows. So graded beliefs don''t escape; they inherit.

  - (5) "The problem is only about knowledge, not belief" — Hintikka''s K operator;
  but the doxastic version is worse.

  - (6) "It''s solved by adding non-normal/impossible worlds, so it''s a solved problem"
  — the residual issue: what individuates impossible worlds, and the resulting loss
  of the clean connection between content and truth conditions.

  - Check for understanding: give them a scenario and ask whether it''s an instance
  of logical omniscience or a different problem.


