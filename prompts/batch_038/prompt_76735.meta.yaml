  Essay title: "Who Is Full Health? Interpersonal Utility Comparison in Practice and
  the Anchoring Problem"


  Section 1: The philosophy I was taught says interpersonal utility comparisons are
  either impossible or mere value judgments — Robbins. Harsanyi''s empathy postulate:
  the impartial observer imagines themselves in each person''s position with that
  person''s tastes and beliefs; the utility of being A vs B gives a common scale;
  with equal-chance random assignment this yields the utilitarian sum. Sen''s reply:
  the observer''s own values are doing the work; and subjective satisfaction is a
  poor target because of adaptive preferences — the deprived adjust their expectations
  downward, so satisfaction tracks deprivation only loosely; compare on capability
  instead.


  Section 2: But health policy hasn''t waited. QALYs are a live institutional implementation
  of interpersonal comparisons of wellbeing: TTO/SG elicit numbers anchored at death=0
  and full health=1; ICER thresholds ($50k–$150k per QALY; NICE ~£20k–£30k) make trade-offs
  across patients explicit. The interesting thing: the anchoring convention does the
  work that Harsanyi''s empathy postulate was supposed to do. "Full health" is the
  shared reference state, and the numbers are ratios of distances from death and from
  full health. So the scale problem (cardinal utility defined only up to affine transformation)
  is solved by fiat: fix the zero at death and the unit at "full health," and now
  every person''s utility is commensurable. That''s a normalization, not a discovery.
  But it''s a normalization with content: it says the relevant metric is health-related
  quality of life, that everyone''s "full health" is the same state, and that the
  state is achievable/meaningful for everyone.


  Section 3: The anchoring breaks for people for whom "full health" is not a state
  they can occupy. Two distinct problems:

  (a) The respondent problem: a person born with a congenital condition, or who has
  been disabled for years, rates their own health state near 1.0, while the general
  public rates it near 0.3 — the disability paradox. Which number goes into the QALY?
  Health economists have generally used public/lay preferences (the "societal perspective")
  precisely to avoid the response-shift/recalibration problem — the worry that a person''s
  ratings have adapted. But adaptation is exactly what Sen pointed at, and Sen''s
  point cuts both ways: if adaptation makes the disabled person''s high self-rating
  unreliable as a measure of wellbeing, then the public rating is being used to correct
  it — which is an interpersonal comparison of the observer''s own values over the
  subject''s, i.e., exactly the Harsanyi structure Sen criticized, now installed in
  a coverage decision.

  (b) The reference-state problem: if "full health" means a body without impairment,
  then for someone whose baseline is a permanent impairment, the anchor is a counterfactual
  state; every year of their life is scored as a fraction of a life they cannot have.
  The denominator is not shared after all.


  Section 4: The reply I anticipate and my response. Reply: TTO/SG instruments are
  preference measures, not welfare measures; nothing commits the system to saying
  a person with a disability has less wellbeing — the QALY is only about health, and
  separate disability weights/adjustments, or "severity" criteria, or the distinction
  between "health" and "wellbeing" handle it. My response: then the interpersonal
  comparison the system actually performs is not a comparison of wellbeing at all
  but a comparison of health-related quality of life, and the utilitarian justification
  (maximize total wellbeing) no longer licenses the threshold; the threshold''s apparent
  objectivity comes from a metric that has been silently narrowed. Also, in practice
  the "health" concept in the instruments is broad (mobility, self-care, usual activities,
  pain, anxiety/depression in EQ-5D), so the narrowing is not stable — usual activities
  includes work and social roles. And prioritarian/severity-weighted variants reintroduce
  the comparison problem: severity is measured by... a loss of QALYs relative to full
  health, i.e., the same anchor.


  Section 5: Proposal, deliberately modest: (i) report both lay and experienced ratings
  and treat the divergence as data, not error; (ii) state the anchoring convention
  explicitly in coverage documents, so that the value judgment is visible rather than
  buried in a scale; (iii) for conditions where "full health" is not attainable, use
  a within-population reference (best attainable health for people with that condition)
  and disclose that cross-condition comparisons are then partially incommensurable;
  (iv) drop the pretense that the threshold is a discovery about wellbeing. And a
  candid admission: (iii) gives up a common scale, which means giving up the aggregation
  the whole apparatus exists for — so the proposal is really a disclosure regime rather
  than a solution.


