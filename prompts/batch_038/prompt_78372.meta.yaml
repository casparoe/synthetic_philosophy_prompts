  The case


  The term unilateralist''s curse is used here for a structural problem about numbers,
  not about character. Suppose some action can be undertaken by any of n parties;
  suppose each party undertakes it if and only if their own estimate of its net value
  comes out positive; and suppose each estimate is an unbiased but noisy read on the
  same fixed truth. Then as n grows, the chance that at least one party''s estimate
  lands high enough to justify acting grows with it, even though no individual party
  is becoming less careful or less honest. With enough draws, the action gets taken
  on the strength of the single most over-optimistic estimate in the pool. The apparent
  upshot is uncomfortable: a room full of cautious, well-informed, well-meaning people
  can be more dangerous than one such person, and the danger is a function of how
  many of them there are.


  Now the specific version to be argued about. Forty-seven groups worldwide can each
  culture and release a strain of engineered soil microbe that fixes atmospheric nitrogen
  at scale, displacing most synthetic fertilizer use. Any one group, acting alone,
  can seed a continent-sized region within a season, and the organism thereafter spreads
  on its own; the release is a global, one-shot event, not a trial that can be rolled
  back. On the upside, it removes a large share of fertilizer production emissions
  and the runoff that dead-zones coastal waters. On the downside, the strain may outcompete
  native nitrogen-cycling microbiota across wide regions, and that displacement is
  effectively permanent on any timescale relevant to human planning. Both directions
  are large. The status quo is not a safe harbor either: continued fertilizer dependence
  carries its own accumulating, slow-moving harms that are likewise very hard to reverse
  once certain aquifers and coastal systems go.


