  For Rousseau: key theses in the Letter to d''Alembert:

  1. Theatre doesn''t reform morals; it only follows and embellishes them ("les spectacles
  ne changent pas les moeurs"). He says spectacles please us as we are; a theatre
  in Geneva would suit Genevan morals, or corrupt them.

  2. Against Aristotelian catharsis: theatre does not purge the passions; it may temporarily
  exhaust pity, but the pity is "sterile" — it satisfies our conscience at no cost,
  we feel virtuous while doing nothing.

  3. Comedy makes virtue ridiculous: his long reading of Molière''s Le Misanthrope
  — Alceste (the virtuous man) is made ridiculous, while Philinte (the worldly, moderate
  man) is made lovable; thus comedy corrects vices only by making vice more ridiculous
  than virtue, and it attacks not vice but virtue.

  4. Tragedy inflames the passions (love especially) — e.g., his discussion of Racine''s
  Bérénice, and of Voltaire''s plays; theatre purifies love only by purging... he
  says tragedy makes love more dangerous by rendering it interesting/heroic.

  5. Actors: their trade is one of public debauchery; they sell themselves for hire;
  the profession involves deceit ("état de tromperie") and being excommunicated while
  praised — he notes the inconsistency in French treatment of actors.

  6. Economics: theatres are expensive, they take people from work, and in a small
  republic like Geneva they''d be ruinous; luxury, idleness.

  7. Women on stage: actresses, etc.

  8. Positive alternative: public festivals, open-air, where the people are themselves
  the spectacle — "plantez au milieu d''une place un piquet couronné de fleurs, rassemblez-y
  le peuple, et vous aurez une fête" — the spectator becomes an actor, people see
  themselves and love themselves.

  9. Also: he distinguishes spectacle (passive, isolating, darkened room, money) from
  festival (active, communal, free).


  So the reading question: Does the Mousetrap vindicate or refute Rousseau? Points:

  - Rousseau says theatre cannot change morals or produce action — Hamlet''s whole
  plan is a counterexample: he uses a play as an instrument of moral knowledge and
  action. But: does it work? Claudius''s conscience is indeed caught, but the result
  is not reform: Claudius attempts prayer, fails, and resolves to send Hamlet to England
  / kill him. Rousseau would say: the spectacle did not purge or correct; it inflamed
  and hardened, and it accelerated the violence. So Rousseau''s stronger claim — that
  theatre cannot make anyone better — survives, while his weaker claim (theatre is
  inert) is refuted by the play''s causal efficacy.

  - The Hecuba soliloquy is a Rousseauvian text inside Shakespeare: Hamlet indicts
  the actor''s borrowed, counterfeit passion (Rousseau: the actor''s trade of deceit,
  playing a character he is not, selling his person) and indicts himself for exactly
  the sterile pity Rousseau describes — he has spent his feeling in the theatre of
  his own imagination instead of acting. So Shakespeare appears to anticipate Rousseau''s
  critique and to apply it to the spectator.

  - The audience structure: the Mousetrap is performed before the court — Rousseau''s
  complaint that the theatre assembles a passive crowd in the dark, each isolated;
  Hamlet''s version is a collective public spectacle in the manner of Rousseau''s
  festival, yet it works not on the community but on one guilty conscience, watched
  by a single spectator-designer (Hamlet) who watches Claudius watching. That inverts
  Rousseau''s ideal: in the festival the people see themselves; here one man sees
  another''s inner state. So the play is a Rousseauvian festival in form and an anti-Rousseauvian
  surveillance device in function.

  - The play-within-a-play is bad art on Shakespeare''s own showing (Hamlet calls
  the speech "indifferently" writen, "nothing either good or bad but thinking makes
  it so"? no that''s elsewhere; he says the play is "for the law of writ... though
