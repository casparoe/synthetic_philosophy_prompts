  So at the junction the driver wants to switch to always-exit. But always-exit as
  a global plan yields 0 ex ante. That''s the crisp inconsistency and it''s exactly
  the "double-counting"/self-defeating structure. Great — this is a clean, teachable
  illustration: the locally attractive deviation, applied everywhere, is ex ante terrible.
  And the reason: his local calculation treats the two junctions as independent draws
  of "which junction am I at," but the deviation applies at both junctions simultaneously,
  and at junction 1 exiting destroys everything.


  So the deep point: at the junction, the driver''s decision is not a one-off decision
  under uncertainty; it is a decision about a rule that governs every junction he
  can''t distinguish — so the relevant calculation must take into account that "what
  I do here, I also do there." That''s a genuinely illuminating framing that connects
