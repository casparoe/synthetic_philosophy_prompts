  Student answer draft:


  "Probabilism is the thesis that an agent''s degrees of belief ought to be a probability
  function: they should assign 1 to tautologies, 0 to contradictions, and be additive
  over mutually exclusive disjunctions. Two arguments are standardly offered for it.


  The older one is the Dutch book argument, going back to de Finetti. It starts from
  the idea that a credence is manifested in a betting disposition: if you assign 0.7
  to P, you should be disposed to accept a bet that pays $1 if P and costs you $0.70.
  Given a bridge principle linking credence to betting behaviour, one can show that
  if your credences violate the probability axioms there is some package of bets you
  would accept that loses you money come what may. So non-probabilistic credences
  are pragmatically self-defeating.


  The problem with this argument is that it is hostage to facts about the agent that
  have nothing to do with belief. It assumes the agent actually has the relevant betting
  dispositions, that she values money linearly, and that she isn''t averse to risk
  or to betting as such. A monk who has renounced property, or an agent with no dispositions
  to gamble, has credences that violate the axioms but is vulnerable to no Dutch book
  at all. Whatever the Dutch book argument shows, it is a fact about the agent''s
  practical situation, not about the accuracy of her beliefs.


  The accuracy-dominance argument, due to Joyce, avoids this. It replaces money with
  accuracy. Pick a measure of inaccuracy that assigns, for each possible world, a
  penalty to a whole credence function according to how far it is from the truth at
  that world — the Brier score, which uses squared error, is the usual example. A
  credence function is accuracy-dominated if there is an alternative that is more
  accurate than it at every possible world. Joyce shows that if your credences aren''t
  a probability function, some probability function accuracy-dominates them; and if
  your credences are a probability function, nothing dominates them. The argument
  is a dominance argument in the ordinary decision-theoretic sense, but the currency
  it dominates in is truth-conduciveness rather than money, so it applies to the monk
  and the non-gambler just as much as to the bettor. That is the normative gain: the
  accuracy argument shows non-probabilistic credences are defective in a respect that
  is internal to belief as such, since believing is aiming at truth.


  This is also why the accuracy argument is not vulnerable to the objection that the
  choice of a measure does the work. Because the measure is a mathematical device
  for tracking closeness to the truth, the argument has no evaluative premises: it
  is a theorem about which credence functions are dominated. And because the theorem
  identifies exactly the undominated credence functions as the probabilistic ones,
  accuracy-first epistemology can go further and rank the probabilistic credence functions
  themselves by how accurate they are, explaining why some coherent agents are epistemically
  better off than others and why conditionalising on new evidence improves a credence
  function''s accuracy. In that respect the accuracy argument is strictly stronger
  than the Dutch book argument, which can only tell you not to lose money."


