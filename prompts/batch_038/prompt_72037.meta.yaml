  Mechanistic anomaly detection (MAD): the idea is to use mechanistic interpretability
  tools (features, circuits, activation comparisons) to detect whether a deployed
  model is running some "anomalous" internal mechanism — e.g., deception, scheming,
  reward hacking — that was not present (or was rare) in a reference set of benign
  activations. Key conceptual problem: to say a mechanism is "the same" or "different"
  you need an identity criterion. Candidate criteria:


  1. Substrate/token-level: same neurons/weights active — trivially fails across paraphrase,
  position, and model versions.

  2. Feature-level: same SAE features or same directions in activation space firing
  — but features are model-relative, and a feature can be realized by different circuits;
  also feature granularity is arbitrary (a feature could be "deception-related" or
  "the word ''actually''").

  3. Circuit-level: same computational graph structure (which components read/write
  which) — but circuits are abstractions; the same circuit can implement different
  functions in different contexts, and the same function can be implemented by different
  circuits (multiple realizability within one model).

  4. Causal/functional: same input–output counterfactual profile — interventionist:
  does ablating/clamping the same set of components produce the same behavioral change?
  But behavior-level equivalence can hide different mechanisms (a model could pass
  the honesty benchmark by different routes).

  5. Teleological/etiological: same function in virtue of the same training history
  (a mechanism is "the same" if it was formed by the same optimization pressure) —
  historical/etiological identity, like Millikan''s proper function. This is interesting:
  it makes mechanism identity depend on lineage, which is unobservable at deployment.

  6. Grain-relativity: same mechanism relative to a level of description (Marr''s
  computational / algorithmic / implementational). Two runs can be the same mechanism
  at the algorithmic level and different at the implementational level.


  Key desiderata for an identity relation used by a monitor:

  - Must be detectable from a single forward pass (or a small number) at deployment
  — no access to counterfactual interventions, no access to training history. So the
  relation must be "readable off" activations.

  - Must be paraphrase- and format-invariant: the same mechanism should count as present
  whether the input is worded differently, in a different language, with different
  tokenization.

  - Must be sensitive to the distinctions that matter morally/safety-wise: e.g., must
  distinguish a model that says "I can''t help with that" because of a refusal feature
  vs. because it''s planning to comply later. Otherwise the monitor either over- or
  under-fires.

  - Must not collapse distinct mechanisms that happen to produce the same output on
  the eval distribution (out-of-distribution generalization).

  - Must be stable across fine-tuning / model versions, or else the monitor needs
  retraining each time (a "sameness across model updates" requirement).

  - Must yield a threshold-able scalar or a decidable yes/no, i.e., must be graded
  and calibrated.

  - Must handle multiple realizability: the anomaly may be realized by different circuits
  in different contexts (so a criterion that''s too fine-grained will miss it), but
  also mimicry: a benign circuit may match the anomalous signature (too coarse → false
  positives).

  - Should be compositional: mechanisms are nested; "same mechanism" at what grain?

  - Must be independent of behavior: MAD''s whole selling point is detecting misalignment
  that doesn''t show up in behavior; if the identity criterion is behaviorally defined,
  the monitor collapses into a behavioral monitor.


