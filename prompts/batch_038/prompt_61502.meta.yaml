  about similarity), śabda (testimony). Dignāga/Dharmakīrti Buddhists accept only
  two (perception and inference). Nyāya also has savikalpaka/nirvikalpaka perception,
  and the debate about whether upamāna reduces to anumāna or śabda. Also the Gettier-like
  "gavaya" (wild ox) case. This is a good domain for a decision tree — the question
  of whether upamāna reduces to inference. That''s genuinely in the weeds and a model
  without web access could do it, since the basic Nyāya framework is well-memorized.
