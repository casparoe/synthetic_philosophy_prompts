  debate — like Gaṅgeśa''s analysis, or the "memory-based" account, or whether śabda
  reduces when the speaker is unreliable (āptavākya). Hmm. I could inject my own novel
  cases (the asker invents cases) — that satisfies "inject new/niche ideas into the
  prompt."


