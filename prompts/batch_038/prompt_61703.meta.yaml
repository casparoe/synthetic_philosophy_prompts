  Draft:


  ---


  I am drafting the framework section of a paper on whether punishment can be borne
  by someone other than the offender, and before I engage with any of the existing
  accounts I want to fix the specification. Please write out the desiderata: the conditions
  an adequate theory of the permissibility of penal substitution must satisfy, each
  with the case or consideration that motivates it, and a judgment about whether it
  is non-negotiable or a preference belonging to a particular camp.


  Set up the puzzle the way I want it treated. Lewis''s short paper on this topic
  observes that we do not, in fact, uniformly reject penal substitution. If the sentence
  is a fine, we think it perfectly acceptable for a devoted friend to pay it, even
  though the fine is the punishment and the offender thereby escapes it; some fines
  are as burdensome as short custodial sentences and carry as much public opprobrium.
  If the sentence is imprisonment or death, the same proposal strikes us as monstrous.
  So the pattern of our reactions does not obviously track severity. A theory that
  merely concludes that substitution is impermissible, or that it is permissible,
  has not addressed this shape; the first requirement is presumably to account for
  the divergence rather than to explain it away as confusion.


  Beyond that, here are candidate requirements I can see, which you should assess,
  refine, and augment rather than simply accept:


  1. Transferability... burden-type dependence: the theory must explain why substitutability
  appears to vary with the kind of burden imposed, not merely its magnitude, and must
  say whether that variation reflects a real distinction or an artifact of how we
  administer fines.

  2. Desert constraint: ...

  3. Expressive constraint: punishment is supposed to communicate condemnation of
  the offender; if the suffering is borne by someone who deserves nothing, the theory
  must say what the communication now amounts to, and to whom it is addressed.

  4. Consent/voluntariness: ...the volunteer''s consent, the offender''s acceptance,
  the victim''s waiver, and the state''s authorization are four different permissions
  and the theory must not run them together.

  5. Compensation/substitution boundary: paying a fine looks like discharging a debt;
  the theory must say where compensation stops and punishment begins, or deny the
  distinction and live with the consequences.

  6. Scaling / no-cliff requirement: any line drawn must be principled, not a brute
  stipulation at some point on a continuum of burden.

  7. Practiceability: the theory should say something about the institutions we actually
  have — vicarious liability, corporate fines, sureties, someone serving time in another''s
  place historically? — and about why we permit third-party payment of fines today.

  8. Non-monstrousness / abuse constraint: an account on which substitution is generally
  permissible must explain why it is not a licence for the rich to purchase immunity,
  and this may be the requirement doing the most work.


  Then: flag any subset you believe jointly unsatisfiable — I suspect (3), (6), and
  (8) cannot all be met, but argue it rather than assert it. Say which single requirement
  knocks out the largest number of otherwise attractive views. Finally, briefly and
  without citations, indicate how the three broad strategies — denying that anything
  can transfer except the material burden, treating the substituted suffering as itself
