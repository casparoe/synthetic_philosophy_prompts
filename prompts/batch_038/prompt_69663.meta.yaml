  Draft:


  I am drafting the framing chapter of a thesis in formal epistemology, and I have
  hit a wall on the dispute between sharp and imprecise credences. I have now read
  the arguments on both sides three times, and my working impression is that the literature
  has reached a stable equilibrium in which every move has a standard countermove
  and nobody has moved. I want a diagnosis of the disagreement''s structure, not a
  verdict on which side is right and not a survey.


  Set-up, as I understand it. One camp holds that an ideally rational agent''s doxastic
  state is a single probability function: credences are sharp, and any spread is a
  defect or at best a useful fiction about an agent who has not yet made up her mind.
  The other camp holds that some bodies of evidence simply do not determine a unique
  probability, so a rational state is a family of probability functions — a convex
  set of priors, or upper and lower previsions — and that forcing sharpness smuggles
  in unwarranted information (a principle of indifference where none is licensed,
  a choice of a single prior from an equivalence class).


  The argument families I keep re-encountering:


  (a) Accuracy: relative to any strictly proper scoring rule, an imprecise state is
  dominated by some sharp state, or at least is never better and sometimes worse;
  so imprecision is epistemically defective. The reply: scoring a set requires an
  aggregation rule across its members (best-case, worst-case, average, spread-sensitive),
  and once you fix one you have already assumed something about what the object of
  assessment is; also, dominance is a claim about whole states rather than about the
  questions an agent actually faces, and the dominating sharp state may be one the
  imprecise agent has no reason to think is her own.


  (b) Dynamic coherence: imprecise agents are exposed to dilation (their intervals
  widen to near-total ignorance on learning information that is intuitively irrelevant),
  to failures of reflection, and to money-pump style sequences of choices; whereas
  sharp Bayesianism is protected by the standard representation and Dutch-book results.
  The reply: dilation is arguably the correct verdict about what the evidence licenses,
  and the dynamic criticisms depend on imposing a decision rule (maximin, E-admissibility,
  Γ-maximin) that the imprecise camp has not agreed is the right one — so the objection
  targets a decision theory, not the credal states.


  (c) The reverse charge: sharpness is arbitrary. If the evidence is symmetric or
  nearly empty, any particular sharp value is picked out by nothing; and the representation
  theorems only yield precision because they assume completeness of the agent''s comparative
  confidence (or of her preferences), an assumption that is a modeling convenience,
  not a requirement of rationality. The reply from the sharp camp: an agent who is
  not comparable across all pairs cannot be reasoned with, cannot be scored, and cannot
  update — incompleteness is not a richer description but an abdication, and "the
  evidence does not determine a unique probability" conflates a claim about evidence
  with a claim about the agent.


  (d) Behavioral: ambiguity-aversion data (Ellsberg-type choices, and the multiple-priors
  decision theories built for it) are said to show that real, competent agents do
  not have sharp probabilities. The reply: that is a claim about psychology, and the
  dispute is normative; alternatively, ambiguity aversion can be modeled sharply with
  second-order probabilities.


  My hypothesis, offered as a hypothesis and I expect you to test it: that the whole
  thing turns on (c) — that completeness is the hinge, that both sides know this,
  and that the other argument families are downstream of it, so the debate looks broad
  while really resting on one contested axiom about what rationality demands of an
  ordering of uncertainty. A rival hypothesis I want considered: that the two camps
  are answering different questions — one about the normative structure of an ideal
  agent''s doxastic state, the other about what a bounded inquirer is licensed to
  represent and act on — and that the appearance of a single debate is an artifact
  of both using the word "credence" and both writing in the same formal idiom.


