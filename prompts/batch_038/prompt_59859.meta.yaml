  Question text:


  "A hospital deploys a system trained by inverse reinforcement learning on eighteen
  months of triage decisions made by junior doctors allocating urgent scan slots.
  Its designers claim that, because the system learned from behaviour rather than
  from questionnaires, it now encodes the clinicians'' genuine preferences about who
  should be scanned, and that giving it more data will converge on those preferences.
  Explain, in principle, what such a system can and cannot recover from behaviour
  alone, and assess the designers'' claim."


  Student answer draft:


  "IRL is the problem of recovering a reward function from observed behaviour. Formally,
  we suppose the demonstrator is acting (approximately) optimally with respect to
  some unknown reward R over states or state-action pairs, and we search for the R
  that best explains the trajectories. The classic difficulty is that the problem
  is ill-posed: many different rewards make the same policy optimal. Adding a constant
  to R, or scaling it by a positive factor, leaves the optimal policy unchanged, and
  there are also ''potential-based'' shaping terms that can be added without changing
  which policy is optimal. So the system cannot, from the doctors'' choices alone,
  recover a unique reward — only a set of rewards consistent with them.


  The designers are therefore partly wrong. But the deeper issue is the assumption
  of optimality: the junior doctors are not optimal agents. They are tired, they anchor
  on the previous case, they have limited information. If we fit a reward to their
  behaviour assuming they are maximising it, we will encode their errors as if they
  were preferences. A doctor who systematically under-prioritises patients with a
  history of drug use is not revealing a preference for that; she is revealing a bias.
  IRL has no internal way to tell bias from taste. Also the recovered reward is only
  defined over the states the doctors actually visited. The system will be extrapolating
  wildly when it faces a state distribution that differs from the eighteen months
  of data — e.g., a mass casualty incident — and nothing about IRL guarantees the
  extrapolation is right. That''s a distribution shift problem, not just a modelling
  one.


  More data does help, though the designers overstate it. With demonstrations from
  enough different situations, the set of rewards consistent with the behaviour shrinks,
  and in the limit of unlimited data covering the whole state space it shrinks to
  a single reward function, which is what the system should maximise. So the right
  conclusion is that the claim is directionally correct but premature: the system
  needs much more data than eighteen months, and needs the data to cover rare and
  unusual cases.


  On the question of whether behaviour reveals genuine preferences, there''s a standard
  worry in decision theory, going back to Savage, that choice data underdetermines
  the split between beliefs and desires: a doctor might decline a scan because she
  thinks the patient is unlikely to survive (belief) or because she thinks scans are
  wasteful (desire). But IRL escapes this, because a modern IRL system infers the
  doctor''s beliefs about the state of the world at the same time as the reward, typically
  as a posterior over the environment''s dynamics. Since beliefs and rewards are inferred
  by separate parts of the model, the underdetermination doesn''t bite: any residual
  ambiguity is a matter of the two components being fitted jointly rather than a principled
  limit.


  Finally, on the slogan ''watch what people do, not what they say'': stated preferences
  are cheap talk and are subject to social desirability effects, so behaviour is the
  better evidence. But it is not the only evidence, and the reward function IRL recovers
  is not the same thing as the doctor''s utility function in expected-utility theory
  — for one thing humans violate the axioms, and for another the recovered R is a
  computational device for producing actions rather than a claim about what the doctors
  value."


