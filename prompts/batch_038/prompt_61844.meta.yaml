  R5. \"Conditional credence only\" minimalism: Reflection constrains only conditional\
  \ credences P_now(A | P_future(A)=p) = p, and is silent about what P_now(A) should\
  \ be; so a ruling \"she must not change her unconditional credence\" is not even\
