  of the jury theorem; the theorem''s independence assumption is standard. And the
  conceptual work: cascade models show that the informational content of votes collapses
  when agents observe each other''s actions — the effective sample size is a handful
  of signals, not n. So the jury theorem''s guarantee doesn''t just weaken; the aggregate
  can be confidently wrong and stay wrong (and be overturned by noise, not corrected
  by evidence).


