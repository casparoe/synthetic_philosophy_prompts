  an experimenter shifts the cricket a few inches to one side. She emerges, finds
  the prey out of place, drags it back to the threshold — and then, because the prey
  is once again outside and she is once again at the start of that stage, she goes
  in to check the burrow again. Move the cricket again and she begins again. By some
  accounts the loop can be closed indefinitely. The story reached philosophers by
  an odd route: it was picked up from an engineer''s book about the brain in the early
  1960s and turned into a parable about the difference between doing something and
  merely being caused to do it. Hofstadter gave the resulting vice a name, sphexishness,
  and it has since become the standard image of the unfree agent: not one who is compelled
  from outside, but one whose behaviour is locked to a track it cannot leave.


