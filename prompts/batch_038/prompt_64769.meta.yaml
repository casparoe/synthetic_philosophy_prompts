  Let me be careful with terminology:

  - Sufficiency: Y ⊥ A | S — includes calibration (E[Y|S=s,A=a] = s) and balance for
  positive/negative class.

  - Separation: Ŷ ⊥ A | Y — includes equalized odds (equal TPR and FPR) and error
  rate balance (equal FNR and FPR).

  - Independence: Ŷ ⊥ A — demographic parity / statistical parity.


  Kleinberg et al. impossibility: a score satisfies calibration, balance for positive
  class (FDR equal across groups), and balance for negative class (FNR equal across
  groups) iff groups have equal base rates or the score is perfect. Note: balance
  for positive class is FDR of a binary decision; for scores it''s calibration. So
  the three conditions are calibration + FDR balance + FNR balance.


  Chouldechova: a risk score cannot simultaneously satisfy FDR-parity, FNR-parity,
  and PPV-parity (predictive parity) unless base rates are equal (or trivial). Actually
  she states: a risk score is calibrated and has equal FDR and equal FNR across groups
  iff base rates equal.


