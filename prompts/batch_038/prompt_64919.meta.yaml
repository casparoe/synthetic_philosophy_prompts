  Case: "The Stuck Gauge."


  Mira is a night-shift supervisor at a fuel depot. For eleven years she has read
  the same pressure-and-volume gauge G on Tank 3 at the start of each shift and formed
  beliefs about the tank''s contents accordingly; G has been, so far as anyone can
  tell, entirely accurate, and it was recertified last month.


  Stipulations, all of which I want you to accept as given rather than argue with:

  (i) On the night in question, G reads "full," and Tank 3 is in fact full.

  (ii) Unbeknownst to everyone, G''s sensor lead was severed three weeks ago; since
  then G has displayed "full" continuously, regardless of the tank''s contents.

  (iii) Tank 3 was topped off by an automatic system two hours before Mira''s reading,
  for reasons independent of G.

  (iv) Mira''s belief that Tank 3 is full is caused by, and based on, her reading
  of G and nothing else. On that same night she also noticed the fill-pump''s runtime
  log and the tanker''s departure seal — each of which would have been, on its own,
  adequate grounds for the belief — but she did not register them as evidence and
  would not cite them if asked.

  (v) Mira also believes, on her supervisor''s word, that G was recalibrated the week
  before; that belief is false, but it plays no role in her reasoning: she would have
  trusted G on the strength of its eleven-year record alone.


  Question: what''s your credence that Mira knows Tank 3 is full? Decompose.


