  I am under contract for a book of essays about how I work, and the final chapter
  is meant to state plainly the assumptions I make about my own inner life when I
  use it as material. A philosopher friend who read the draft said the chapter does
  not hold together but could not, or would not, say where. Rather than argue with
  him, I would like the argument laid out properly, and so I am putting my commitments
  down here for audit. I should say at once that I do not know which of them I could
  afford to lose; several of them are load-bearing for books I have already written.


  My position, as best I can state it:


  (1) For what is occurring in my own experience at the moment I attend to it, a sincere
  and careful first-person report cannot be corrected from outside. There is no gap,
  for such a report, between its seeming to me that I am in a certain state and my
  being in it. Whatever else is uncertain about the mind, this much is not up for
  grabs.


  (2) I accept the confabulation literature in full: the experiments in which people
  confidently explain preferences produced by manipulations they could not detect,
  and the ones in which they argue at length for a choice that was never theirs. I
  hold that we have no introspective purchase on the processes that generate our judgments
  and reasons. An account of why I think what I think is a construction, built after
  the fact, and it deserves no more credence than a witness''s guess.


  (3) Introspection is nonetheless a trainable craft, and I have trained it. For more
  than twenty years I have used the beeper discipline — unpredictable interruptions,
  an obligation to describe what was in my experience in the instant before the signal,
  and coaching aimed at separating what was actually present from what I would ordinarily
  have said was present. I have got markedly better at this. I take that improvement
  as evidence that there is something there to improve upon: an inner domain that
  yields to sustained attention rather than dissolving under it.


  (4) What attention finds is not a presuppositionless given. The vocabulary and the
  narrative forms I have absorbed shape what I am able to notice in myself; I do not
  discover my jealousy so much as recognize it under a description my language supplied.
  To that extent my inner life is already partly an artifact of the books I have read,
  including my own.


  (5) Even so, my examined inner life is evidence about people and not merely about
