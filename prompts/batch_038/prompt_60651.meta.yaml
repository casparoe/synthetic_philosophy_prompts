  So the desiderata list: what must a criterion of "skyhook vs. crane" satisfy?

  1. Symmetry / two-sidedness: it must be able to convict posits on both sides — must
  be able to say when an anti-reductionist posit (a sui generis normative fact, a
  non-physical quale, a teleological tendency) is a skyhook AND when a reductionist''s
  posited mechanism (an unexplained selector, a fitness-maximizing optimizer, a "design
  without a designer" that presupposes the design) is a skyhook/greedy. Otherwise
  it''s a partisan slogan. Motivating case: adaptationist just-so stories; the "design
  space" search process itself needs a substrate whose complexity is not accounted
  for.

  2. Prospectivity: must be applicable at the time of positing, not only in retrospect
  after the level has been successfully eliminated. Motivating case: vitalism/"élan
  vital" was a live research program (Driesch, Waddington''s epigenetic landscape...),
  and the "gene" was arguably a placeholder posit that turned out fine (Mendelian
  factors → DNA), so a criterion that would have condemned the gene as a skyhook in
  1910 is too strict; a criterion that can''t condemn anything until it fails is useless.

  3. Non-question-begging: the criterion must not smuggle in the conclusion that all
  posits must be mechanistically decomposed, since that''s what''s at issue. Motivating
  case: if "skyhook" is defined as any posit that is not reducible to physics, then
  all emergentists are convicted by fiat.

  4. Distinguish skipped levels from compressed levels (Dennett''s own "good reductionism"
  vs. "greedy"): must permit explanations that skip intermediate machinery when the
  skipped machinery is provably irrelevant (e.g., thermodynamics explained without
  tracking microstates in detail; idealizations, renormalization group explanations
  where the micro-details are irrelevant — Batterman''s point). Motivating case: RG
  universality shows that successful explanation can be better by ignoring lower-level
  detail; if the criterion demands derivation, it condemns ordinary science.

  5. Consistency with the actual history of successful reductions: reductions are
  typically not Nagelian derivations; they involve idealization, approximation, and
  often change the reduced theory (so "crane" cannot mean "the higher-level theory
  is a theorem of the lower"). Motivating case: temperature/kinetic energy with the
  correction about negative temperatures; optics → EM; classical mechanics → quantum
  (the classical limit doesn''t exist in some regimes).

  6. Must handle the regress problem: cranes for cranes — if every crane must be explained
  by a lower crane, does the criterion demand an infinite regress or terminate in
  brute facts? If it terminates, what licenses the termination (a symmetry principle?
  a law?) — i.e., the criterion needs a theory of legitimate stopping points. Motivating
  case: the Past Hypothesis; the initial conditions of the universe; the Born rule;
  "why these laws?"

  7. Must not make explanatory danglers invisible: a skyhook in the classic sense
  is a posit that does the explanatory work by its very nature, unconstrained by anything
  else (compare: Molière''s dormitive virtue; the "vital force"; Chomsky''s charge
  that adaptationism explains everything and nothing). So the criterion should key
