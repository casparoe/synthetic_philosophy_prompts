  I am preparing a chapter on Scheffler''s "afterlife conjecture" — the thesis, argued
  from the doomsday scenario in *Death and the Afterlife* (2013), that much of what
  we value depends for its value on the continued existence of humanity after our
  deaths. I think I have an argument showing the reasoning behind that thesis proves
  far too much, but my conclusion is that the conjecture is empty, and I am not willing
  to accept that. Here is the argument as I have it.


  1. If, on learning that some condition will cease to hold shortly after my death,
  I find that things I now value strike me as pointless, then the value of those things
  depends on that condition''s continuing to hold.

  2. Suppose I learn that I will die in my sleep tonight and that, thirty days later,
  all human life will be extinguished. Most of what I care about — my students'' work,
  the language I write in, whether the theory I have spent twenty years on is confirmed,
  my daughter''s children — strikes me as pointless in a way it does not when I imagine
  merely dying tonight and humanity carrying on.

  3. So, by (1), the value of these things depends on humanity''s continuing after
  my death.

  4. Now consider a physically grander catastrophe: I learn that I will die tonight
  and that thirty days later a vacuum-decay event will alter the constants of nature,
  so that no structure survives. My reaction is, so far as I can tell, exactly the
