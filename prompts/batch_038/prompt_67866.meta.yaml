  (Sandel-ish): some goods have a proper mode of valuation, and pricing them or putting
  them up for sale degrades them or expresses the wrong attitude toward them, independent
  of who gets hurt. Camp B is the market-legitimacy camp: if an exchange is voluntary
  and informed between the parties, it''s presumptively fine, and repugnance is just
  a taste that has to be argued for rather than assumed (Roth''s point about repugnance
  being a constraint on markets rather than an argument, plus the usual economist
  skepticism). Normally camp A says ''block it'' and camp B says ''let it happen.''
  I want a case where it comes out the other way: camp A concludes a market in the
  good should be allowed (or even created where none exists), and camp B concludes
  it should be blocked or heavily restricted.


