  Seed content to inject: describe the landscape concretely:

  - Camp A ("devastationists"): the triviality proofs show that there is no non-trivial
  proposition expressible by an indicative conditional whose probability equals the
  corresponding conditional probability for all probability functions; so Adams''s
  thesis (P(A→C) = P(C|A)) cannot be a semantic thesis about the probability of a
  proposition; so either indicatives are non-propositional (suppositional view) or
  they express different propositions in different contexts (Gibbard''s Sly Pete argument
  → conditional expressivism/contextualism).

  - Camp B ("harmlessness"/"revisionists"): the results only rule out a particular
  package — assuming the conditional is an event in the original algebra, requiring
  the equation to hold for all probability functions in the conditionalization-closed
  family, requiring classical probability. Drop preservation-under-conditioning, or
  use conditional event algebras / non-Archimedean or imprecise probability, or restrict
  the class of admissible probability functions (context-sensitive domains), and non-trivial
  models exist. Also: rational agents'' actual credences never range over all functions,
  so the universal generalization is doing illicit work.

  - Also the "the equation was never a semantic thesis" camp: Adams''s thesis is about
  rational credence/acceptance conditions, not truth conditions, so triviality results
  miss the target entirely.


  Crux: is the disagreement about the formal theorem (no one disputes it), about what
  the theorem is a theorem about (which class of models / which idealization), or
  about what a semantics owes us?


