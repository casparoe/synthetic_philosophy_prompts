  Pluto/IAU:

  - Theory → case: HPC says a kind is a cluster of properties maintained by homeostatic
  mechanisms; is "planet" such a cluster? Roundness + orbit-clearing + Sun-orbiting
  — the cluster is heterogeneous and the homeostatic mechanism is... accretion/dynamical
  history. Actually there IS a homeostatic mechanism: planetary formation (accretion
  → roundness → dynamical dominance). So HPC could say planet is a genuine kind with
  a mechanism. Promiscuous realism says the astronomers'' choice was legitimate but
  so is the geophysical one; no fact of the matter about which is right, but both
  track real patterns. Microstructural essentialism says a kind is fixed by underlying
  nature — but for planets, what''s the "microstructure"? Mass? Orbital dynamics?
  This exposes the limits of the microstructural picture outside chemistry.

  - Case → theory: The vote''s significance; the "cleared the neighbourhood" criterion''s
  dependence on the contingent configuration of the solar system (planet-hood is relational
  and time-indexed: Pluto would be a planet if alone in its orbit; the Earth would
  not be a planet if placed in the Kuiper belt — actually Soter''s Λ parameter, Stern
  & Levison''s parameter). This shows that "planet" is a status conferred by context,
  which strains essentialism. Also the case shows that kind-making can be *stipulative*
  yet *answerable* to inductive/explanatory interests — an interesting middle position
  none of the three theories cleanly occupies. Also: does the theory have anything
  to say about who gets to decide (the sociological dimension)?


  That''s rich. And the "which theory earns the right to call this a joint in nature"
  demand gives a deliverable.


  Prokaryote:

  - HPC: prokaryote as cluster (no nucleus, no organelles, small size, circular genome,
  asexual reproduction, operons) — but the homeostatic mechanism is questionable given
  HGT, and the cluster is defined by absences.

  - Promiscuous realism: both groupings legitimate for different purposes; "prokaryote"
  is fine for cell biology, useless for phylogeny.

  - Microstructural essentialism / lineage essentialism: monophyly requirement (Hennig/phylogenetic
  systematics); prokaryotes are paraphyletic → not a kind.

  - Case → theory: shows that "kinds" in biology are indexed to the choice between
  mechanism-based and ancestry-based grouping; shows that a category can be inductively
  projectible (predictive about cell structure, antibiotics) while being non-monophyletic
