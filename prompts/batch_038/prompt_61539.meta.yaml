  no enforcement behind it gets ignored, and its defenders are contradicted rather
  than refuted.

  2. Force without justice is tyrannical and, importantly, is "accused" — it invites
  the language of illegitimacy.

  3. The two-way recipe: make what is just strong, or make what is strong just. And
  the asymmetry: justice is disputable, force is not (force is "very recognizable"),
  which is why the second option is the one that actually gets taken — we end up calling
  strong what is just.

  4. The prudential point: telling people the laws aren''t just destroys obedience,
  since they obey only because they believe the laws just; hence the instruction to
  say obey because they are laws, as one obeys superiors because they are superiors.

  5. Opinion/imagination vs force: an order that rests on opinion is "sweet and voluntary"
