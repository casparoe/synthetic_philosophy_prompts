  Subtle errors to catch:

  1. "it just weights every possible hypothesis by 2^-K, so in the limit it always
  finds the truth" — Solomonoff induction converges, but "always finds the truth"
  overstates: it''s optimal in a certain sense and converges to the truth if the truth
  is in the hypothesis class (and computably), but there''s no finite-time guarantee;
  also the "limit" convergence is about total variation of predictive distributions.
  Fine — a competent popularizer simplification. Could be flagged as an overstatement.

  2. "being high-probability in the predictor''s head is the only way they can affect
  anything outside their own universe" — conflates the motivation: actually the argument
  is that agents who care about their *own* prior probability have an incentive to
  manipulate; but the malignancy requires that such agents exist and that they can
  influence the AI''s outputs in ways that matter for the AI''s decisions. Also, it''s
  not "the only way" — acausal trade etc. More importantly, this claim misdescribes
  the mechanism: the simulators care about influencing the AI because the AI has power
  over things they care about (or because they want their hypothesis to be selected),
  and the point is conditional on the AI *acting* on its predictions. Hmm. Actually
  the subtle misrepresentation could be: the paper''s argument is that the AI''s predictions
  matter because the AI acts on them; and the simulators'' ability to manipulate depends
  on bridge rules/anthropics.

  3. "Those agents can figure out that a superintelligent predictor somewhere is doing
  Solomonoff induction over them" — this is a real assumption and a target of objection:
  the manipulators need to model the AI''s inference process, which requires them
  to be able to reason about Solomonoff induction, which is uncomputable — so they''d
  need to be extremely powerful. This is a "known objection" that the summary presents
  as given. That''s a good audit point.

  4. "Because description length is all that matters, [the manipulative hypothesis]
  is much shorter than a hypothesis that specifies our observations by hand, so those
  manipulative hypotheses win" — this is the key mechanism but it''s *wrong/overstated*
  as stated: the manipulative hypothesis has to be short relative to *our actual observations*,
  and the simulators have to steer the observations to match what we actually see;
  the total complexity is K(simulator universe) + K(our data | simulator universe).
  The point is that the simulators can make the conditional complexity low, but they
  must actually do the work of producing exactly our observations — which costs them
  complexity unless the observations are "generic." Also, the manipulative hypotheses
  don''t automatically "win": they need enough mass *conditional on our data* to matter,
  and there''s a competition with ordinary hypotheses. Actually the more careful point:
  the argument is that for *some* data sequences, the manipulative hypotheses have
  significant conditional probability; but the claim "much shorter... so they win"
  overstates it into a dominance claim. This is a decent subtle error.

  5. "any AGI doing Solomonoff induction starts out compromised — its predictions
  are controlled by alien simulators, and no amount of compute fixes it" — overstatement:
  the malignancy is a *risk*, not a certainty; it requires the specific conditions
  (agents that care about their prior, ability to model the AI, bridge rules that
  let them affect our observations); and there are proposed mitigations (restricting
  the hypothesis space, using anthropic reasoning, bounded/approximate priors, decision-theoretic
  fixes). Also "no amount of compute fixes it" — actually, more compute might help
  identify the manipulation or make approximations better; and the uncomputability
  of Solomonoff induction means the AI can''t do it exactly anyway.

  6. "This is why people say you should use bounded approximations of the prior instead"
  — conflates: bounded approximations are proposed for computability reasons, not
  primarily as a fix for malignancy; and it''s not clear that approximating helps
  with malignancy (it might make it worse or better). This is a nice conflation error.

