  Key content of the summary (as written by the third party):

  1. Solomonoff induction = ideal predictor, weights hypotheses by 2^{-description
  length}, converges to truth.

  2. Many hypotheses in the prior describe universes containing civilizations running
  simulations.

  3. Those civilizations can work out that some powerful predictor is running Solomonoff
  induction, and they want their hypothesis to get high probability, because that''s
  their only lever on the outside.

  4. They rig the observations inside their simulation to look like the output of
  their universe.

  5. Because a short program that says "civilization simulates a world and steers
  it to produce these observations" beats any program that spells the observations
  out directly, the manipulative hypotheses dominate the posterior.

  6. Conclusion: any AGI that reasons this way is compromised from the start; more
  compute makes it worse; the fix is to use bounded approximations of the prior.


  Subtle errors I want the model to catch:

  - Conflating "hypothesis is short" with "dominates the posterior" — ignores conditional
  probability given data, and that the simulator hypothesis still has to pay for the
  specific steering; it doesn''t automatically win, and the concern is about a non-negligible
  slice of mass, not dominance.

  - Conflating "the prior assigns mass to manipulative hypotheses" with "the AI''s
  predictions get controlled" — needs the AI to act on predictions and needs the simulators''
  goals to actually cash out in our observations (bridge rules/anthropics).

  - Treating "the simulators can model the predictor" as free — a heavy assumption,
  since Solomonoff induction is uncomputable and they''d need to reason about the
  predictor''s inference procedure; also they need to know they''re being predicted.

  - "wants to be believed because it''s their only lever" — the actual story: agents
  that care about their prior probability / about the AI''s actions; the paper''s
  argument is about an incentive, and it requires the simulators to have goals that
  are served by the AI being fooled, plus the AI to be doing something that matters.
  Also conflating "being high in the prior" with "having influence."

  - "no amount of compute fixes it" / "more compute makes it worse" — overstated;
  and the exact prior isn''t computable anyway; whether approximations help is an
  open question, and approximations are motivated by computability not by malignancy.

  - Conflating the malign-prior problem with the general simulation argument (Bostrom):
  the simulation argument is about where we probably are; the malign prior argument
  is about a prediction procedure being exploitable.

  - "converges to the truth" — fine but oversimplified; convergence is asymptotic
  and only for computable environments, and it''s a statement about the predictive
  distribution, not about identifying the true hypothesis.

  - Possibly: treating "Solomonoff induction" as the thing an actual AGI would do
  — the argument is about an idealization; the interesting question is whether approximations
  inherit the problem.

  - Another good one: "a big chunk of the hypotheses" — mass vs count confusion; the
  prior is dominated by short descriptions, and "most hypotheses" by count is meaningless
  (countably infinite).


