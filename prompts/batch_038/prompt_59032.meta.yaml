  I like: nuclear deterrence + fiction reading. Candidate works with well-known plots:
  *Dr. Strangelove* (1964), *Fail-Safe* (novel/film), *WarGames* (1983), *The Day
  After*, *Threads*, *On the Beach* (Nevil Shute), *Crimson Tide*, *Wargames*. Also
  *The Making of the Atomic Bomb* is nonfiction. Also Kubrick''s *Dr. Strangelove*
  and the "doomsday machine" — which is explicitly Schellingian: the doomsday machine''s
  deterrent value is destroyed by keeping it secret ("the whole point of the doomsday
  machine is lost if you keep it a secret!"). That''s a great hinge: the requirement
  that a threat be communicated to be credible — the doomsday machine as the perfect
  commitment device that fails because it''s not public. Also Strangelove''s line
  about "deterrence is the art of producing, in the mind of the enemy... the fear
  to attack" — that''s a paraphrase-ish of a definition. And the "mine shaft gap"
  ending — arms race stability vs. instability.


  But *Dr. Strangelove* + deterrence theory is somewhat a known reading. To make it
  "in the weeds," I could ask for a reading that engages specific concepts: the paradox
  of deterrence (the threat you must never be willing to carry out), Schelling''s
  "threat that leaves something to chance," the rationality of irrationality, credibility
  and the requirement of communication, second-strike stability vs. first-strike incentive
  (the "use it or lose it" problem dramatized by Jack Ripper''s fear of the "precious
  bodily fluids" and by the CRM-114 / fail-safe point), and the doomsday machine as
  a commitment device. Also the film''s ambivalence about whether the failure is rational
  or irrational: Ripper is mad, but the system converts individual madness into strategic
  catastrophe; and Strangelove''s plan is "rational" in a horrible way. Also the tension:
  the film treats deterrence as a machine that works perfectly right up until a component
  is insane — is that the right diagnosis, or does the film show that the system''s
  stability depends on an assumption (rational actors with correct information) that
  its own plot denies? Also relevant: General Turgidson''s estimate of "10 to 20 million
