  2. The analogy: money is a measuring instrument — a ruler, a set of scales, a standard
  unit — that makes heterogeneous goods commensurable by recording pre-existing value
  magnitudes; the lecturer says this is Aristotle''s core insight, and uses it to
  argue (a) that Aristotle was already a "neutral instrument" theorist of money, (b)
  that money therefore does no real work in exchange beyond recording, so any theory
  that makes money constitutive (chartalism, credit theory, the claim that money itself
  creates commensurability) is anachronistic overreach; and (c) that Aristotle''s
  claim that money exists by convention merely means the unit is conventional, like
  inches vs centimeters, not that money''s existence is conventional all the way down.

  3. Deliverables: mapping table; separate disanalogies that matter for the lecturer''s
  use from merely ornamental ones; what features of the measuring-instrument source
