  I have been reading about panpsychism in blogs and comment threads for the better
  part of two decades — the constitutive-vs-cosmopsychist split, Goff''s phenomenal
  bonding proposal, the objections about subjects failing to add up and about a limited
  palette of micro-qualities failing to yield the diversity of what we actually experience
  — and I have come to think the combination problem is badly served by its usual
  medium. Analytic metaphysics papers are the least vivid format imaginable for a
  problem that is ultimately about what it would be like to be a great many things
  at once. I would like to stage it in a different register instead.


  Please write a satirical legal document, 800–1,000 words, in the form of a class-action
  complaint with a caption, numbered paragraphs, a short procedural history, an exhibit
  list, and a prayer for relief. The forum should be invented (a chancery court for
  phenomenal aggregation, or similar), and every case, party, statute, and precedent
  cited should be invented as well — do not cite real papers or quote real philosophers;
  the satire must be self-contained.


  The plaintiff class consists of the micromental properties and microsubjects instantiated
  in the brain of one ordinary adult — say a regional logistics manager — and the
  named defendant is the manager''s own unified conscious subject, sued on behalf
  of everyone he is made of. Causes of action to develop: unjust enrichment or quantum
  meruit (the class has conferred the entirety of the defendant''s phenomenology and
  received none in return); breach of an implied phenomenal bonding relation; and
  a count for declaratory relief on whether the class can be certified at all.


  That last count is where the piece should do its real work. Let the certification
  fight stage the metaphysics: numerosity is trivially satisfied, but commonality
  fails because the class members cannot identify a single phenomenal property they
  all share; typicality and adequacy of representation collapse because the only candidate
  representative turns out to be the defendant himself; and notice to absent class
  members cannot be given to entities who, on the plaintiff''s own theory, are not
  yet anyone. The defendant''s answer should be a fair, internally consistent statement
  of constitutive panpsychism — he does not deny that the class members are real and
  fundamental, only that they are separate from him — and should include one alternative
  defense in which he claims the plaintiffs are in fact modes of a single cosmic subject,
  so that the true defendant is the universe and venue is improper. Have that alternative
  defense rebound on him: if unity comes from above rather than below, the defendant
  cannot explain why he, of all the nested unities, is the one being sued.


