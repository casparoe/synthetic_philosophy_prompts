  Commitments:


  (1) Justificatory ground: states may maintain nuclear arsenals because, as a matter
  of empirical fact, nuclear deterrence has made great-power war prohibitively costly
  and thereby prevented it. The justification is forward-looking and consequential
  in shape: what licenses the arsenal is the wars it doesn''t fight.


  (2) Targeting: I accept a version of noncombatant immunity — deliberate targeting
  of cities and civilian populations as such is impermissible regardless of the good
  it secures; I''m a deontologist about this. So retaliation must be limited to military
  targets: forces, command and control, weapons infrastructure. I call this the counterforce
  restriction.


  (3) Sincerity: a threat is genuinely a threat only if the threatener has a real
  conditional intention to execute it, and adversaries eventually find out. So bluffs
  are not available as a stable policy; the deterrent must be one we would in fact
  carry out. (I don''t think deception of this kind can be sustained across decades
  of probing.)


  (4) Execution judgment: whether executing a threat is permissible must be assessed
  at the moment of execution, on the information available then, not at the moment
  of issuing it. Retaliation after a disarming first strike would be a purely punitive
  act: it would protect nothing, and would only add deaths. So, on the evidence available
  at that moment, retaliation in that circumstance is impermissible.


  (5) Risk and chance: I''m sympathetic to the idea that the most credible threats
  in a nuclear crisis are the ones no single decision-maker fully controls — escalation
  managed by delegating, by alerting procedures, by allowing the situation itself
  to generate a probability of catastrophe. Deterrence works partly because each side
  fears losing control, not because either side has a clean decision to destroy the
  other.


  (6) Intentions: I think forming an intention to do what would be wrong is itself
  a wrong-making feature of the agent''s character and deliberation; intentions are
  not morally inert just because the condition never triggers.


  (7) Extended deterrence and allies: I think it''s permissible to risk nuclear exchange
  to defend treaty allies whose independence is at stake, but not to defend prestige
  or economic interest alone — and I think this asymmetry should be built into declaratory
  policy so adversaries can read it.


  (8) Method: I think the ethics of deterrence should be evaluated at the level of
  standing practices and institutions, not case-by-case acts — what matters is whether
  a practice, sustained over time by many agents, produces better outcomes than the
  alternatives.


