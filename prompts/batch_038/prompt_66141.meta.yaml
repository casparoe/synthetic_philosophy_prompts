  Davidson''s omniscient interpreter argument (in "A Coherence Theory of Knowledge
  and Truth", 1986): Consider an interpreter who is omniscient about the world — knows
  all truths about the world, including all causal histories — and who interprets
  a speaker charitably (assigns truth conditions to the speaker''s sentences that
  make the speaker''s beliefs come out largely true, using the omniscient interpreter''s
  own knowledge of what causes the speaker''s utterances). Davidson claims that such
  an omniscient interpreter would find the speaker largely coherent and largely in
  agreement with himself (the omniscient interpreter) about the world. And since the
  omniscient interpreter''s beliefs are all true, it follows that the interpreted
  speaker''s beliefs are largely true. Hence, a coherent set of beliefs must be largely
  true — the "coherence theory of truth and knowledge" anti-skeptical result. There''s
  a well-known modal-fallacy objection (Sosa, and the academia.edu result above mentions
  it: "his famous Omniscient Interpreter argument turns out to be a simply modal fallacy").
  Also objections that Davidson equivocates between "mostly true" in the interpreter''s
  mouth vs the speaker''s.


