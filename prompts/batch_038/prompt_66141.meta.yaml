  Essay draft:


  **Charity does not survive a filter**


  *1. The guarantee.* Davidson''s radical interpreter has, by stipulation, no prior
  dictionary, no shared language, and no independent access to the speaker''s mind.
  What she has is the speaker''s pattern of holding sentences true, together with
  the circumstances in which she does so. Out of that she is to construct a joint
  assignment of meanings and beliefs. The constraint that makes the construction possible
  is charity: the interpreter must, so far as she can, maximize the truth or intelligibility
  of what the speaker takes to be true, because massive agreement is not something
  she can discover only after the assignment is made — it is the background against
  which any assignment can be made at all. Davidson then pushes this further, in the
  argument he builds around the figure of an omniscient interpreter: a being who knows
  all the truths about the world, including the full causal history of the speaker''s
  utterances, and who interprets charitably, will find the speaker largely in agreement
  with herself; and since this interpreter''s beliefs are all true, the speaker''s
  must be largely true too. Coherence, on this picture, yields correspondence. That
