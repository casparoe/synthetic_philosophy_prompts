  hypoxic, sleep-deprived, drugged, or biased — never bears directly on the worldly
  question. What it bears on is how well my first-order evidence supports p. It can
  move my credence in p, but only by way of my assessment of that support relation,
  never by adding content about p itself.


  4. The Calibration Principle. Once I have formed a belief by some route and then
  formed an estimate of how reliable that route was, my rational credence in p is
  fixed by the estimate: I should hold p to the degree to which I take myself to have
  arrived at it reliably, conditional on everything else I know. I don''t get to keep
  the output of a route I''ve just judged unreliable.


  5. Enkratic requirement, for full belief. It is never rational to believe p while
  believing that believing p is irrational. Akrasia in this sense is a genuine defect,
  not a mere oddity.


