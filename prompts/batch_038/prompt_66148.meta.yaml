  I have no academic training in philosophy — I left school at sixteen and have spent
  thirty-one years driving a diesel van for a small haulage firm in the Midlands —
  but for the last few years I have been reading and thinking about collective harm
  on my own, mostly because of an argument with my daughter. She does not fly, does
  not eat meat, and has just turned down a job she wanted because it would have meant
  a longer commute in a car. I have never given up the van, and I built the following
  argument to explain why I did not think I was doing anything worse than she was.
  I set it out carefully, and to my alarm it appears to prove a great deal more than
  I intended. I would be grateful if you could tell me where it goes wrong, if it
  does, and what it costs to put it right there.


  1. An act of mine can be wrong because of what it brings about only if it makes
  some identifiable person''s situation worse: there has to be someone who ends up
  worse off, in the world as it will actually be, than they would have been had I
  not done it.

  2. My van''s exhaust cannot make anyone''s situation worse in that sense. The climate
  responds to cumulative emissions over decades; the share attributable to one van
  over one year is smaller than any unit in which a change to a person''s life could
  be registered — no particular person gets asthma because of me, no particular harvest
  fails because of me, no particular flood happens because of me. If I had parked
  the van for good, exactly the same people would have had exactly the same lives.

  3. So my driving is not wrong because of what it brings about.

  4. Nor can it be wrong for any other reason. The only other candidates are my attitudes
  — that I am indifferent, that I free-ride, that I benefit from a system I disapprove
  of. But if my neighbour felt exactly as I do about the climate and simply lacked
  a van, we would not say he was doing anything wrong. An attitude is not a wrong
  unless it issues in an act that makes a difference, and mine makes none.

  5. Nothing in (1) to (4) mentions vans, or the climate, or anything peculiar to
  my case. The reasoning applies wherever a harm is produced by a great many contributions
  and no one contribution is separately detectable. So: if a hundred marksmen fire
  at one man and each bullet would have killed him on its own, none of them makes
  his situation worse than it would have been, and none of them does anything wrong;
  and if a thousand households each draw one extra bucket a day from a reservoir until
  it runs dry, no household has made anyone''s situation worse either.

  6. And the argument runs the same way in reverse, which is the part that troubles
  me. If my driving makes no difference, then my not driving makes no difference either.
  So my daughter''s refusal to fly has not made anyone better off; she has done nothing
  wrong, but she has also done nothing at all, morally speaking, and the cost she
  has paid has bought nothing. She is not better than I am. She has merely been more
  expensive.

  7. Putting (3), (4), (5) and (6) together: no act is ever wrong because of what
  it brings about, no act is ever wrong for any other reason, and no abstention is
  ever to anyone''s credit. Wrongness has simply evaporated from the whole field of
  conduct that affects other people through the accumulated behaviour of crowds.


  I cannot believe (7). I am quite sure the hundredth marksman does something wrong,
  and I am quite sure my daughter''s refusal to fly is not on a par with my van, even
  though I cannot say why in a way that survives the argument. I would much rather
  keep (1) than (7), and I would rather keep the judgement about the marksmen than
  the judgement about my daughter, but I am not attached to (4) at all and would happily
  lose it if that dissolved the problem.


