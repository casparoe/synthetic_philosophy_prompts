  but have lived in the jurisdiction for some years. Two commissioners — I''ll call
  them Vera, a political theorist, and Daniel, a retired elections administrator —
  ended up arguing about whether the three proposals stand or fall together. I took
  notes at the time and again afterwards; what follows is my reconstruction of the
  exchange, with the order of their turns preserved as best I can.


