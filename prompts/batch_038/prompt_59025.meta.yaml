  "Szasz''s argument in The Myth of Mental Illness is that mental illness is a lie
  invented by psychiatrists to control people they don''t like. He showed that since
  disease can only afflict bodies, and minds aren''t bodies, there''s no such thing
  as mental illness — so schizophrenia isn''t real in the way cancer is real, and
  the people who are labeled schizophrenic are actually just making things up or,
  at worst, behaving badly. His conclusion is that psychiatry should be abolished:
