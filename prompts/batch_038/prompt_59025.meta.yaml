  Where are the subtle misrepresentations?

  1. "Anything you can''t perceive can''t make a difference to what you see" — this
  conflates two things: (i) the perceptual properties of the object, and (ii) what
  you see when you look, which is theory/knowledge-laden (the classic argument: knowing
  a picture is a forgery changes the aspect under which you see it; also the argument
  that a forgery is a performance in a context — an achievement relative to a tradition
  — so it isn''t the same artwork even if it looks the same). Also the empirical premise
  is questionable: forgeries are rarely visually indistinguishable; they tend to be
  "too perfect," stylistically anachronistic; and knowing provenance trains perception
  (experts do see differences). This is the classic "aesthetic relevance of provenance"
  debate.

  2. "Value of authenticity is really the value of a relic" — conflates two distinct
  claims: (a) authenticity as historical/artistic achievement (the object as the product
  of a specific creative act within a tradition — non-sentimental, cognitively relevant),
  and (b) authenticity as sentimental association (contact relic value). The analogy
  to grandmother''s ring treats all authenticity value as association value. A defender
  says the ring analogy begs the question precisely because the ring case is one where
  the duplicate genuinely is aesthetically equivalent but historically/associatively
  different — that''s the point of contention, not a settled premise. Also there''s
  a disanalogy: the forgery is a *failed* artistic performance and involves deception;
  the ring duplicate doesn''t.

  3. "Nobody cared historically / workshop practice shows the cult of the unique hand
  is recent" — conflates two distinct things: (i) collaborative workshop production
  under a master''s name (a different model of authorship/attribution, where the master''s
  design and finishing still mattered and where the workshop output was valued as
  the master''s product), and (ii) indifference to authenticity (people absolutely
  cared about attribution, provenance, and copies vs. originals — there was a market
  for copies and forgeries even in antiquity/Renaissance, and legal and reputational
  consequences). Also, the workshop case arguably *supports* the importance of authorship-as-design
  rather than undercutting it. And the claim that forgery-debate is a modern invention
  ignores that forgeries and their detection are ancient (e.g., faked antiquities,
  Michelangelo''s sleeping Cupid — careful, that''s a specific fact: Michelangelo
  aged a sculpture and passed it off as antique; that''s a well-known story but I
  shouldn''t state it as a fact in the prompt unless the model needs it. Actually
  the prompt doesn''t need it; the answering model may mention it. It''s a famous
  story, and I shouldn''t include it in the prompt since I''m not verifying. I could
  mention it... no, better not. Actually, the "never quote from memory" rule is about
  quotes; specific facts should be verified if the prompt leans on them. I won''t
  lean on it.)

