  Where''s wrong: Szasz didn''t say patients fabricate; he took their suffering seriously
  and called them "problems in living"; he didn''t oppose psychiatric drugs per se
  — he opposed compulsory treatment, and he supported voluntary, contract-based psychiatry
  (he founded the Thomas Szasz-derived Center for Independent Thought; he was against
  involuntary commitment and the insanity defense, and against psychiatry''s coercive
  powers). He did not deny that people have unusual experiences/thoughts — he denied
  that these are illnesses (diseases) in the medical sense, arguing "mental illness"
  is a metaphorical extension of disease language, and that literal disease applies
  to cells/tissues/organs. He accepted neurological disease (brain disease) as real
  — he was a board-certified psychiatrist and neurologist — and his point was that
  mental illnesses aren''t brain diseases (no lesion found), and that if a lesion
  is found it becomes neurology. He opposed the insanity defense because it excuses/infantilizes
  (he thought criminals should be held responsible, with the "myth" of mental illness
  not exempting them), whereas he opposed involuntary treatment. Also, "disease can
  only afflict bodies" — Szasz''s claim is more specific: illness is a deviation from
  a norm of bodily structure/function; "mind" isn''t a bodily organ, so "mental illness"
  is either a metaphor or, if literalized as brain disease, unproven. Also Szasz wasn''t
  arguing psychiatry should be abolished entirely — he wanted it separated from the
  state, i.e., no coercion, contract-based.


  The subtle misrepresentations to embed: (1) the conflation of "not an illness" with
  "not real" — the summary says labeled people are "making things up or behaving badly,"
  which collapses Szasz''s claim that they are experiencing genuine problems in living
  into a claim that they''re feigning or culpable. (2) "no drugs, no hospitals" —
  Szasz opposed coercive treatment, not voluntary treatment/drugs; he was fine with
  people choosing medication. (3) The "disease can only afflict bodies, and minds
  aren''t bodies" line is roughly right but flattened: Szasz''s actual argument is
  about metaphor and about the absence of lesion, and importantly, he distinguishes
  brain disease (real, neurology) from mental disease (myth). (4) The claim that "anyone
  who says otherwise is colluding with the state" — a caricature. (5) The dismissal
  claim that he ignored imaging evidence — the summary treats the absence of biomarkers
  as an empirical matter settled against him, but Szasz''s reply is conceptual: even
  if correlates are found, correlation isn''t lesion/etiology, and the real issue
  is whether the diagnosis explains behavior in the way disease explains symptoms.


