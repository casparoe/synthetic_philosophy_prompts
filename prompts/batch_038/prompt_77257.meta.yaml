  the order of a generation, after which it lapses unless it''s re-ratified by the
  same supermajority that would be needed to amend it. The theoretical part of the
  talk is where the fight will be: I claim the standard Ulysses-contract picture gets
  the problem backwards. Everyone assumes the worry about precommitment is that the
  present binds the future — the dead hand, Jefferson''s letter to Madison, that whole
  literature. But I think the deeper problem is that a binding that never gets revisited
  stops being a commitment and degrades into a habit: nobody alive can any longer
  say what reasons it was answering to, and the provision keeps its legal force long
  after it''s lost whatever made it a commitment rather than just an obstacle. I call
  this warrant decay. My positive claim is that precommitment should be modeled as
  a standing offer to your future self that the future self has to periodically accept,
  not a standing command. The mechanism for that is a recognition test: could the
  original binder, fully informed about how things actually turned out, still endorse
  the provision? Renewable entrenchment just institutionalizes the recognition test
