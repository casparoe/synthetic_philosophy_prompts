  ---


  I teach an eighty-minute seminar for eighteen third-year philosophy students on
  practical rationality. They are comfortable with dominance reasoning and expected-value
  comparisons but have had no formal game theory, and they have not encountered the
  centipede game. Design an in-class activity in which they collide with the backward-induction
  paradox themselves: the tension between the step-by-step argument that appears to
  force the first player to end play immediately and the observable fact that pairs
  who keep passing end up better off than that argument recommends.


  Please build the activity around a finite alternating-offers game of six decision
  nodes, played in pairs, one play per pairing, with the following properties. At
  every node, ending the game must yield the player to move strictly more than passing
  would on the assumption that the other player ends things at their own next turn;
  and both players must be better off the longer play continues. Give me the exact
  figures you would print on the cards, and show me the arithmetic establishing that
  the first condition really is strict — I am wary of payoff schemes where a doubling
  pot and a two-thirds split make ending and passing-then-being-ended exactly equal,
  which quietly ruins the induction.


  Stakes must be real but must not involve money; say what the accumulated points
  convert into, and how you will keep the stakes from being so trivial that students
  stop treating the choices seriously.


