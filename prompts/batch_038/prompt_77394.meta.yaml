  Setup: Nozick''s account: S knows p iff (i) p, (ii) S believes p via method M, (iii)
  if p weren''t true and S used M, S wouldn''t believe p via M (sensitivity), (iv)
  if p were true and S used M, S would believe p via M (adherence). Sensitivity isn''t
  closed under known entailment: you know you have hands (sensitive via looking) but
  you don''t know you''re not a handless BIV, because in the nearest world where you''re
  a BIV you''d still believe you''re not one. Nozick bites the bullet and denies closure.


  My essay''s move: distinguish two ways a belief in q can come about when q is entailed
  by p and you know p:

  - "Terminal deduction": you deduce q from p and your belief in q is *parasitic*
  on your belief in p — you''d abandon belief in q if you abandoned belief in p. In
  this case the counterfactual "if q weren''t true..." is evaluated: since q isn''t
  true in a world, either p isn''t true (so by sensitivity of the p-belief, you wouldn''t
  believe p, and hence, by parasitism, wouldn''t believe q) or p is true but q isn''t
  — impossible, since p entails q. So in the nearest not-q worlds, p is false, and
  hence you wouldn''t believe p, and hence wouldn''t believe q. Therefore the deduced
  belief IS sensitive. That''s the standard result: knowledge of p + competent deduction
  yields sensitive belief in q. But then why does BIV fail? Because the belief "I''m
  not a BIV" isn''t reached by deduction from "I have hands" in the right way... Hmm,
  actually the standard reply (Warfield''s) is exactly this: closure under *known*
  material implication is preserved. The catch: sensitivity of the deduced belief
  requires that in the nearest not-q world you don''t believe p — but the method M
  for the belief in q is "deduction from p-belief," and in the nearest not-q world,
  p is false, and by sensitivity of the p-belief via its method, you wouldn''t believe
  p, so you wouldn''t deduce q. Fine. But for the BIV case, the nearest world where
  you''re a BIV: you''d still believe you have hands (since you''d have the same experiences),
  so the premise-belief isn''t sensitive in that world? Wait — the premise belief
  "I have hands": nearest world where you lack hands is the BIV world, where you''d
  still believe you have hands. So "I have hands" is NOT sensitive either! That''s
  the punch: on the tracking account, you don''t know you have hands either (that''s
  the skeptic''s point, and Nozick''s response via method-relativity: the method isn''t
  "hand-detection simpliciter" but "looking at hands in the actual way," and in the
  nearest not-p world where you''re a BIV, you''d use... hmm, Nozick says you''d still
  use M and still believe, so he needs a different method-individuation: the actual
  method is "visual experience as of hands right now" — and in the nearest world where
  you lack hands, you''d use a different method? Nozick''s response is that the method
  is held fixed by the actual causal process; in the BIV world, you''d be caused to
  believe by the computer, which is a different method. That''s the "method individuation"
  trick and many find it ad hoc.)


