  \ knows that everyone knows that ... ad infinitum, for every finite depth. The proof\
  \ of Aumann's theorem runs through the join of the players' partitions. Consider\
  \ the event that player 1's posterior for A is p and player 2's is q. If this event\
  \ is common knowledge, it is a union of whole components of the join of the two\
  \ partitions — the coarsest partition that refines both. But on any such component\
  \ each player's posterior for A is just the prior probability of A, since each has\
  \ conditionalised on information that does not distinguish states within the component.\
  \ [planted error (iv): should be the prior probability of A *conditional on the\
  \ component*] So p and q both equal P(A), and hence equal each other. The common\
  \ prior does the work at the last step: without it the two players could conditionalise\
  \ the same way on the same component and still differ, because they would be starting\
  \ from different distributions over it.\n\nIt is tempting to think the infinite\
  \ regress in the definition of common knowledge is a formality, and in applications\
