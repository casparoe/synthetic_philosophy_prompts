  \ looks, and it is worth being clear about what it is not. It is not the trivial\
  \ observation that agents who have seen exactly the same evidence must agree; of\
  \ course they must. The content of the theorem is that even agents who have received\
  \ quite different private information — different signals, different partitions,\
  \ different evidence in the ordinary sense — must end up with the same posterior,\
  \ provided only that they share a common prior and that each of them is aware of\
  \ what the other has concluded. Disagreement, on this picture, is never a stable\
  \ resting place for rational agents: if you and I differ, then at least one of us\
  \ has failed to conditionalise correctly, or has been told something the other has\
  \ not, or is uncertain about what the other has been told. [planted error (i)]\n\
  \nKnowledge is modelled as a partition. Player i knows E at ω if the cell of i's\
