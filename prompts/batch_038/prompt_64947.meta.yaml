  (a) On Liberty''s core: coercion over an individual is justified only to prevent
  harm to others, and liberty matters in large part because self-chosen plans of life
  are what develop character and judgment.

  (b) Mill''s non-intervention thesis: institutions handed to a people from outside,
  or liberty won for them by a foreign power, do not take; real improvement has to
  be generated by the people''s own efforts and struggles.

  (c) Mill''s position on dependencies of unlike people (Representative Government,
  ch. XVIII): such a dependency is best governed by a semi-autonomous body of professional
  administrators with continuity and local knowledge, deliberately insulated from
