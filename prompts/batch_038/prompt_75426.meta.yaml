  and heroes" cases where the agent goes beyond even the most demanding reasonable
  requirement? Kagan''s reply: those are cases where the requirement is very demanding,
  or where the act is still not required because of the prerogative. Also the question
  of whether the view needs a "moral cost" concept. Also whether it collapses into
  utilitarianism with a prerogative. Also blame: is the person who declines to jump
  on the grenade blameworthy? Under Kagan''s view, no — that''s just the point. But
  then what makes the act praiseworthy? Need a distinction between praiseworthiness
  and blameworthiness. Also, what about "supererogatory acts that are wrong to do"
