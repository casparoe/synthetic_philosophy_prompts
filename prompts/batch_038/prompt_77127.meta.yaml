  I work as the sole nurse practitioner at a rural clinic about two hours from the
  nearest city. Our regional health authority issues a cardiac risk calculator that
  every clinic in the region is required to use: you enter age, blood pressure, cholesterol,
  smoking status, and a handful of other fields, and it returns a patient''s probability
  of a serious cardiac event within ten years. For a patient like the woman I will
  call Mrs. A, it returns six percent. The authority has audited the instrument repeatedly,
  and the audits consistently report that of the patients previously scored at six
  percent, close to six percent went on to have an event. By the standards the authority
  recognizes, the number has earned its authority.


  Three things are pulling against it, and I cannot find a principled way to rank
  them.


  First. I have been Mrs. A''s clinician for eleven years, and her presentation this
  spring does not resemble the other six-percent patients I have known. I could not
  write this into a chart note; there is no field for it, and if I were cross-examined
  I could not name the feature that concerns me. My medical director''s position is
  that a clinician''s unease should not move anyone off an audited figure unless the
  clinician can identify a specific variable the instrument has failed to capture,
  and that otherwise the figure is the only thing in the room entitled to be called
  a probability.


  Second. When I looked for the records the calculator was fitted on, I found that
  they come overwhelmingly from the urban teaching hospitals. The population here
  is different in ways I can list: agricultural labor, a different ancestral mix,
  no emergency department within forty minutes, ambulance response averaging over
  an hour. So far as I can determine, patients like mine were effectively absent from
  the data. The authority''s documentation notes the gap and instructs that the figures
  be applied to outlying districts with care, and does not say what care consists
  in.


  Third. Mrs. A''s brother had a fatal event at fifty-one. The calculator does not
  ask about siblings.


  The first and second worries look, from the inside, like the same sort of thing
  — my doubts about a number — yet my director dismisses one and takes the other seriously
  enough to have ordered a review. The third is different again, and I cannot say
  how.


  What I want is not clinical guidance; I know what the treatment guidelines recommend
  and I know roughly where the thresholds for starting a statin sit. What I want to
  understand is what I ought to believe about Mrs. A specifically. Does the six percent
  survive the discovery that the population it was derived from is not hers? If it
