  The question:


  "Many philosophers think that in some choices the options are neither better nor
  worse than one another, and yet not equally good either. Explain how that third
  possibility is supposed to work, giving the main argument for it. Then say what,
  if anything, can still make a choice between such options rational rather than arbitrary."


  The student''s answer (~500 words):


  Write it out.


  ---


  Answer draft:


  "The idea here is incommensurability, but it''s worth being careful about what it
  is not. It isn''t that we don''t know which option is better — that''s just ignorance,
  and it would go away with more information. It also isn''t that the concepts involved
  are vague at the edges. The claim is a substantive one about the values themselves:
  in certain cases there is no fact of the matter about whether A is better than B,
  worse than B, or exactly as good as B, and this is not because of anything about
  our knowledge.


  The standard argument runs through small improvements. Suppose Nadia is choosing
  between going to medical school and continuing to study cello at a conservatory.
  Neither option seems better. Now improve one of them by a small amount: say she
  gets a slightly better cello teacher, or a marginally larger stipend in the med
  school offer. Intuitively this small improvement doesn''t tip the scales — it doesn''t
  turn the conservatory option into the better one, because it wasn''t that close
  to begin with... Hmm.


  Actually the argument: if the two options were equally good, then any improvement,
  however small, to one of them should make it better than the other, since equally
  good options are exactly balanced. But we can find improvements that don''t do this
  — the slightly better stipend does not make med school the option she should take.
  So they were not equally good. But they are also not better or worse, since neither
  dominated the other in the first place. So the trichotomy fails, and what we''re
  left with is a fourth relation, which people call being ''on a par.''


  This is where I think the real difficulty is. If A and B are on a par, then there''s
  nothing about their values that settles which one to pick. The reasons have run
  out: every consideration you could give in favor of the cello is matched by considerations
  in favor of medicine, and no amount of extra information would break the tie, because
  we can''t tell whether a small improvement makes a difference. So the choice can''t
  be justified by reasons at all. What''s left is the will: Nadia simply commits,
  and by committing she makes it the case that she has a reason to pursue the cello.
  In that sense the choice is arbitrary — but it''s not irrational, because rationality
  only requires that you respond to reasons where there are any. Both options are
  equally justified, and the interesting thing about hard cases is that they''re where
  you find out who you are, since you can''t lean on the values to decide for you."


  Errors planted:

  1. "not better or worse, since neither dominated the other in the first place" —
  circular/begging the question: the argument establishes not-equally-good, but the
  claim that neither is better has to come from somewhere else; the student just asserts
  it. Mild.

  2. "because we can''t tell whether a small improvement makes a difference" — epistemic
  slide: the argument needs "is not better," not "we can''t tell." And the student
  earlier explicitly ruled out the epistemic reading, so it''s an internal inconsistency.
  Good, subtle.

  3. "every consideration ... is matched by considerations" — this describes a balance/equally-good
  picture (or a tie in the balance of reasons), which contradicts on-a-par. Subtle.

  4. "Both options are equally justified" — reintroduces the equally-good verdict
  the argument was meant to exclude. Nice.

  5. "What''s left is the will: Nadia simply commits, and by committing she makes
  it the case that she has a reason" — this is a defensible-ish move (Chang''s view
  that you can create reasons through commitment in hard cases; also Raz''s idea of
  engagement/commitment), so should be credited partly. But the student''s framing
  "the choice can''t be justified by reasons at all" + "arbitrary" misstates the view:
  on-a-par comparability still permits reason-guided choice; the standard line is
  that the choice is rationally permitted either way but not arbitrary, and that the
  agent''s commitment/identity-conferring role is itself a source of reasons. So the
  "who you are" point at the end is actually the best insight but it''s stapled onto
  the wrong conclusion (arbitrariness). A careful grader should note the tension:
  if the will can generate reasons, the choice isn''t arbitrary; and if it''s arbitrary,
  the "who you are" claim can''t do normative work.

  6. Also the first paragraph: "there is no fact of the matter about whether A is
  better than B, worse than B, or exactly as good as B" — that''s roughly right for
  the negative characterization but a picky grader might note that "on a par" proponents
