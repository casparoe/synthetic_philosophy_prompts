  them. That''s a well-designed puzzle I can author. The candidate rules could be:


  1. A "proceduralist" rule: a proposal is in order iff it follows the prescribed
  procedure; content doesn''t matter (so paradoxical content is fine).

  2. A "consistency-preservation" rule: reject any proposal that would produce a ruleset
  containing a contradiction or an undischargable obligation.

  3. A "no-self-entrenchment" rule: any rule, including the amendment rule, can always
  be amended; entrenchment clauses are void (Suber''s "acceptance theory" vs. "inference
  model").

  4. A "tiered/immutable-respected" rule: immutable rules are genuinely unamendable,
  but the rule that makes rules immutable can itself be amended, so you can go around
  via two steps (the "two-step" or ladder strategy).

  5. An "effect-focused" rule: judge proposals by whether they''d create a state of
  affairs where a future player is bound by a rule they can''t escape (i.e., preserve
  the game''s playability / avoid "irrevocable" commitments).


  The prior verdicts I invent should be consistent with several of these and split
  on the new case. Let me design carefully.


  Let me draft the prior rulings (a "Committee on Rules" in a long-running Nomic club,
  say 11 players, meeting weekly for three years):


  - P1: Approved a proposal adding "Rule 118 is immutable and may not be repealed,
  amended, or suspended" where Rule 118 was an ordinary scoring rule. (Accepts entrenchment.)
