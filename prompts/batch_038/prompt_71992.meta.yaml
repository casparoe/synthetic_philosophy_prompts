  P1 accepted a flat bar; P3 accepted the ladder; P4 rejected unplayable contradiction.
  Does the committee reject entrenchment-by-cost while accepting entrenchment-by-prohibition?
  That''s a nice distinction: form vs. effect. And candidate rules diverge:


  - Proceduralist (only check procedure): approve.

  - Consistency-preservation (only contradictions/unplayability): approve.

  - Anti-entrenchment-of-the-rule-of-change: reject (if it touches the rule of change).

  - "Effect" principle (a proposal is out of order iff its effect would be to place
