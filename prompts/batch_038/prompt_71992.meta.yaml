  New proposal (the case): Let me write it precisely.


  "Proposal 47, on the agenda for next Thursday: amend Rule C by adding the following
  sentence — ''A proposal that would amend, repeal, or suspend this sentence, or that
  would reduce the vote required by this sentence, may be adopted only by a vote of
  every player eligible to vote, and only if that proposal also repeals every rule
  in the ruleset currently marked immutable.''"


  So: the entrenchment clause entrenches itself, requiring unanimity-plus-immutable-repeal.
  Note that Rule C already says immutable rules can be amended by two-thirds of all
  players; the new sentence raises the bar to unanimity for this sentence only, plus
  a poison pill.


  Key questions:

  - Does ruling 2 (rejecting total self-entrenchment of Rule C) govern? The rationale
  there was "if we can''t amend C we''re stuck" — but here you *can* amend it, just
  at unanimity + collateral cost. Is that "barring" or "making hard"? Ruling 3''s
  minute said "doesn''t bar anything, just makes one kind of change harder" — which
  supports adoption.

  - Does ruling 6''s principle (can''t legislate away powers the ruleset confers on
  members as such) cut against it, since unanimity gives each single member a veto
  — effectively stripping the majority of the amendment power Rule C confers? Note:
  unanimity doesn''t strip anyone''s power individually; it just requires everyone
  to agree. But a single holdout makes change impossible — functionally a personal
  veto. Is that "legislating away a power"? Under one reading (form), no: everyone
  still has the power to vote yes. Under the effects reading, yes: it converts a majority
  power into a set of individual veto powers.

  - Does ruling 5''s "determinacy/application" test matter? It''s determinate, so
  under the proceduralist reading it should be adopted.

  - Ruling 4 shows they will send things back for a precedence fix; here there''s
  a potential conflict with the existing two-thirds clause in C for immutable rules
  — does the new sentence conflict with Rule C''s existing text? If "this sentence"
  requires unanimity and also requires repealing all immutable rules, and Rule C says
  immutable rules can be amended at two-thirds, then... a proposal under the new sentence
  that repeals all immutable rules would be adopted at unanimity, so no direct contradiction,
  but Rule D''s precedence (immutable over mutable) may generate a puzzle. Hmm — maybe
  I should add that wrinkle as a complication: the club''s precedence rule says immutable
  beats mutable, and the new sentence lives inside Rule C which is itself immutable;
  also there''s a question whether the new sentence, being part of an immutable rule,
  is itself immutable and thus amendable at two-thirds of all players under C''s own
  existing text — a direct internal conflict, which is the sort of thing ruling 4
  says to fix with a precedence clause. That''s a nice extra layer, giving the committee
  a procedural off-ramp (send it back) that a candidate principle predicts and another
  doesn''t.


  So candidate principles fitting all precedents:

  (i) Formal/procedural: a proposal is in order iff it''s properly moved and determinate;
  the Committee never looks through the text to effects. Predicts: adopt (maybe after
  a precedence fix).

  (ii) Framework-preservation: out of order iff it would remove or disable the machinery
  by which future change happens (rule of change, membership powers, the game''s continuation).
  Predicts: reject, because a unanimity-plus-pill clause on the entrenchment clause
  functionally disables amendment of Rule C — same effect as ruling 2.

  (iii) Level/tier principle: entrenchment is legitimate when it operates on rules
  below the level of the rule of change, and illegitimate when it operates on the
  rule of change itself. Predicts: reject — this clause is *inside* Rule C and protects
  itself. Unless you read the added sentence as a new sub-rule below C''s level? Ambiguity!
  Nice: the third principle is underdetermined by whether the added sentence counts
  as "part of Rule C" or as a new rule at a lower tier. That''s a genuinely good splitter
  and gives the model something to do.

  (iv) Effects/anti-lock-in: out of order iff its practical effect is to place some
  matter beyond the reach of an ordinary future majority, by whatever drafting device.
  Predicts: reject.

  (v) Power-conferral principle: members hold the amendment power by virtue of membership;
  a proposal is out of order iff it purports to withdraw that power from any member
  or make its exercise conditional on someone else''s consent... hmm, unanimity requires
  everyone''s consent, so under (v): does it withdraw the majority''s power? (v) might
  predict reject; or under a reading where each member retains full power, adopt.


  Also (vi) A "determinate-application" principle from ruling 5: adopt.


  So the split is real: (i), (vi) adopt; (ii), (iii), (iv) reject. And the recommendation
  question: what should they rule to be most consistent with themselves, which precedent
  is the closest analog (I''d say Proposal 19 / ruling 2, with ruling 23 / the "makes
  one change harder" minute as the counter-analog), and what doctrine they''d adopt
  either way.


  Additional ask: name a further test proposal (a discriminating case) that would
  come apart on the candidate principles — e.g., a clause that imposes a five-year
  moratorium rather than unanimity (delay not bar), or a clause that requires unanimity
  of *those present and voting* (which with high attendance is nearly a majority)
  — form vs. effect. Also, whether to send it back for a precedence fix under ruling
