  tracks whether the action expresses the deep self; (d) Nadelhoffer''s "bias" view;
  (e) conversational pragmatics / scalar implicature (Adams & Steadman) — people hear
  "intentionally" as "deliberately and for that reason"; (f) Phelan & Sarkissian''s
  "folk functionalism" / ordinary concept has a norm component; (g) Malle, Guglielmo,
