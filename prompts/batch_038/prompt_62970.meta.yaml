  3. Nuclear power in energy transition + disagreement adjudication

  4. Moral particularism vs generalism + thought experiment

  5. Refugees and asylum + research proposal


  Let me think about what combination works best.


  Idea A: Knobe effect + recount a disagreement and adjudicate. The Knobe effect:
  people are more willing to say a side effect was brought about intentionally when
  it''s morally bad (harm the environment) than when it''s good (help the environment).
  There are debates: the "competence" account, "blame first" account, the "deep self"
  account (Chandra Sripada), the "trade-off hypothesis" (Knobe''s later view: people
  think of harm in terms of costs, so mentioning that the outcome is a cost implies
  the chairman pursued it in a cost-benefit trade-off and hence intentionally), the
  "bias" account (Nadelhoffer), the "conversational pragmatics" account (Driver, Adams
  & Steadman). Also replication questions. A disagreement between two people at a
  lab meeting about a failed replication could be great — e.g., two grad students
  arguing about whether an experiment replicating the Knobe effect with a different
  harm/help pair shows the effect is about moral evaluation vs. about "side effect"
  framing.


  But is that too niche? The Knobe effect itself is reasonably well-known. A model
  should know the chairman/environment scenario. I''d need to inject the novel design
  detail myself.


  Idea B: Refugees and asylum + research proposal. Well-known domain, philosophy of
  immigration: Miller''s "fair distribution" argument, Carens''s open borders, the
  "special obligations to compatriots" view, the distinction between refugees and
  economic migrants, the "duty to rescue" framing, the "harm-based" vs "assistance-based"
  duties (Stilz?), the question of who bears the burden (Walzer''s lifeboat), the
  "asylum as a right vs. discretionary" distinction. Also the non-refoulement principle.
  A research proposal on e.g. whether the refugee/economic migrant distinction is
  morally load-bearing, with an angle like: the distinction tracks who caused the
  flight vs who merely could help — "causal responsibility" vs "capacity" — and whether
  obligations differ in kind, strength, or persistence. That''s decent but the domain
  has been hashed over a lot by LLMs.


  Idea C: Habitat destruction and net welfare + thought experiment. Construct a thought
  experiment where interventionist "compassionate conservation" and a "let nature
  be" deontologist converge/diverge... Or: build a case where reducing habitat (destroying
  habitat) increases total welfare — the classic r/K selection issue: habitat destruction
  may cause immediate suffering but reduce long-term population sizes, hence fewer
  animals in a life not worth living. Design a case where the numbers work out such
  that a totalist utilitarian prefers habitat destruction, but an average/neutral
  intuition disagrees. Or a case where the "worse off" and "more numerous" pulls come
  apart.


