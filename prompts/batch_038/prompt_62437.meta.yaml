  Let me state the target position as I understand it, so that we are working from
  the same thing. Friedman holds that the relevant question about a theory''s assumptions
  is not whether they are descriptively realistic but whether they yield sufficiently
  accurate predictions about the class of phenomena the theory is intended to explain;
  that simplicity and fruitfulness, rather than literal truth, are the virtues of
  assumptions; that descriptive accuracy matters only instrumentally, as a means or
  a sign of predictive success; and, more provocatively, that the hypotheses which
  prove most significant tend to be those whose assumptions are the least faithful
  to observed detail. Critics have called the resulting self-immunizing flavour of
  the view the F-twist. My friend''s argument is that this twist can be executed deliberately,
  and that once executed it defeats every realist objection.


  Here is the argument, as he laid it out:


  (1) The assumptions of any theory are to be assessed solely by whether they yield
  sufficiently accurate predictions within the theory''s intended domain; their descriptive
  realism is not an independent criterion of assessment, but matters only insofar
  as it is a means to or a reliable indicator of predictive success.


  (2) A methodological doctrine of the kind in (1) is itself a theory: it consists
  of assumptions about how inquiry works — about what scientists do, what makes theories
  succeed, and which criteria track success — put forward in order to guide the acceptance
  of theories.


  (3) Therefore the assumptions of (1) itself are to be assessed solely by whether
  (1) leads its users to accept predictively successful theories; whether (1) accurately
  describes scientific practice, or the actual relation between unrealistic assumptions
  and predictive success, is not an independent criterion of its assessment.


  (4) The standard realist objection to (1) is precisely an objection from descriptiveness:
  it says that (1) is false about what successful theories are like, that scientists
  do in fact test assumptions, that predictive accuracy cannot be cleanly separated
  from accommodation of known data, and so forth.


  (5) By (3), that objection is inadmissible as an assessment of (1): it applies to
  (1) a criterion that (1) itself, if applied, tells us not to apply.


  (6) What is left is the admissible test, and (1) passes it: the theories accepted
  under (1) — the price-theoretic and monetary work it was written to license — have
  a strong predictive record, while the methodologies urged by (1)''s critics have
  no comparably successful body of accepted theory to their name.


