  about the van that would be there for anyone to check who knew what to look for;
  whether the film is good is not a fact of that sort, because it depends on the response
  the film draws out of a viewer. So the mechanic''s report hands you a fact, whereas
  the film report at best hands you a forecast about your own reaction.


