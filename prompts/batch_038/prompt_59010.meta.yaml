  version is strictly stronger, and I could not say why that seemed wrong to me. Please
  diagnose..."


  The false presuppositions here:

  (a) "no sure-loss portfolio ⇒ provably an EU maximiser" — the converse doesn''t
  hold that way; coherence (avoiding sure loss) is necessary, and representation theorems
  go the other direction under extra assumptions; also avoiding Dutch books doesn''t
  establish *rationality* — you could avoid sure loss by refusing all bets, or by
  having no dispositions at all. Also, Dutch book theorems require the agent to have
  precise betting dispositions at all stakes, linear utility in money, and the bets
  to be acceptable in combination.

  (b) "one bet at a time in any order" — this conflates the synchronic Dutch book
  (package accepted simultaneously) with a sequential process. If bets are offered
  one at a time and the agent can revise between offers, the sure-loss argument fails;
  and there''s an important distinction between accepting a package and accepting
  each bet given that you''ve already accepted the others (sure-loss requires the
  conjunction of dispositions). Also, order can matter if the agent updates. And "strictly
  stronger" — a one-at-a-time test is actually *weaker* as a sufficient condition
  for flagging? Let''s think: if an agent accepts each bet individually when offered
  alone, does that mean they''d accept the package? Not necessarily. Conversely if
  they accept the package they might reject each alone (because of interaction with...
  hmm, actually accepting each alone is a weaker requirement than accepting the conjunction?
  Let''s see. A sure-loss portfolio exists if the *sum* of accepted bets loses. The
  classic theorem: if credences violate the axioms, there is a set of bets each of
  which is individually acceptable (positive expected value at the agent''s own credences)
  whose combination guarantees a loss. So each bet is acceptable *individually*, considered
  alone — that''s exactly how the theorem works: each bet has positive expected utility
  on the agent''s own numbers, so a bet-by-bet audit would flag each one as acceptable,
  and yet the package loses. So the one-at-a-time test in fact delivers the same verdict
  *provided* the agent doesn''t update between bets and the stakes are such that money
  utility is linear and there are no interaction effects on wealth. But: with non-linear
  utility in money, bets acceptable individually may not be acceptable in combination
  (risk aversion: the sum of the bets is riskier, and the expected utility of the
  combination isn''t the sum of the expected utilities of the parts... well, actually
  it is additive if utility is linear; with concave utility, accepting each individually
  doesn''t imply accepting the portfolio). So the friend''s claim "one at a time is
  strictly stronger" is confused: the individual-acceptance test can''t be aggregated
  into a portfolio verdict without additivity of utility; and the audit flags the
  agent only under the linear-utility assumption. Also, the reverse: an agent could
  refuse each bet individually (because of the risk) yet be perfectly coherent.


  Also there''s a deeper false presupposition: reading credences off betting quotients
  assumes the marginal utility of money is constant and identical across the bets
  — the theorem identifies credence only jointly with utility (the classic problem:
  separating beliefs from utilities requires extra assumptions, e.g., a desirably
  "ethically neutral" proposition or state-independence).


  (c) Also: "provably an expected utility maximiser" — the Dutch book theorem establishes
  coherence of the credence function, not that the agent maximises *expected utility*
  over acts generally (needs also preferences over acts, the sure-thing principle
  etc.). And avoiding a Dutch book doesn''t imply diachronic coherence (conditionalisation),
  which requires a Dutch *strategy*.


