  same theorem says they are, provably, an expected utility maximiser, so we can read
  their credences straight off their betting quotients and use them as probabilities
  in the model. He then added that the audit is safe because any analyst who would
  accept a sure-loss portfolio must also be willing to accept the individual bets
  in it, so the test can be run one bet at a time, in any order, without changing
