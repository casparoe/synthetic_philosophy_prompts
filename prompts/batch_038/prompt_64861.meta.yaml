  Let me design the exam question concretely. Setting: I''m a TA for a "Rational Choice
  and Its Limits" course (philosophy dept + a bit of AI), grading short-answer finals.
  The question, worth 15 points:


  "Question 3 (15 pts). Buridan''s ass is often presented as showing that an agent
  facing two exactly equally good options is paralyzed and starves. (a) Explain why
  that presentation is a bad argument as it stands — what does the case actually put
  in doubt? (b) Our lecture discussed a variant: an automated disaster-response system
  must allocate its only remaining rescue drone to one of two buildings, where its
  own utility model rates the two outcomes as exactly equal, and the window closes
  before it can serve both. Someone in section proposed that the engineers just add
  a random bit to break the tie, and that this ''dissolves the philosophical problem.''
  Evaluate that proposal: what does adding the random bit settle, and what (if anything)
  is left unsettled?"


  That''s a nice, self-contained, in-the-weeds question that doesn''t require obscure
  facts. The student answer can then be graded on: (i) does it identify that the paralysis
  conclusion doesn''t follow because indifference doesn''t entail inaction (rationality
  permits choosing either; there''s no requirement to have a preference before acting
  — "ought implies can" style point: any option is permissible, and picking one is
  required by the situation), (ii) does it distinguish exact equality from incomparability,
  (iii) does it correctly say what the random bit settles (it guarantees the agent
  doesn''t stall; it converts a tie into an implemented symmetry-breaking) and what
  it leaves unsettled (which building gets saved still has no reason; the *distribution*
  over time / repeated cases; the question of whether the choice is arbitrary in a
  way that matters morally — accountability, explanation to the families, whether
  the tie itself is a defect in the utility model, e.g., that the model may be coarse-grained
  and the equality may be an artifact of limited resolution rather than a real tie),
  (iv) the point that if the tie is an artifact of coarse representation, then it''s
  not a true tie and the "no reason" claim is undermined.


