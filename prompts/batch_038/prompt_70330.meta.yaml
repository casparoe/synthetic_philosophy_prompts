  Setup definitions in the prompt:

  - Sphexishness: a system that runs a routine whose triggering conditions are described
  at a coarse grain, and that repeats the routine even when the world changes in a
  way that makes the routine pointless — no revision.

  - Flexibility: revising behavior when the situation changes in relevant ways.


  Argument:


  (1) A system is non-sphexish (flexible) only if its behavior can change in response
  to changes in its situation that it did not previously register — i.e., only if
  there is some difference in circumstances that makes a difference to what it does.


  (2) For any actual system — wasp, person, or trained model — there is, at any time,
  a total specification of its internal state and its environment that fixes what
  it will do next; call this its response function.


  (3) Which differences in circumstances make a difference to behavior is therefore
  itself fixed by the response function: the function''s own shape determines what
  counts as a relevant difference.


  (4) But a system whose criterion of relevance is fixed by something it cannot revise
  is doing exactly what the wasp does: executing a routine whose trigger conditions
  were set for it, not chosen by it.


  (5) So every system is sphexish relative to the level at which its response function
  is fixed; flexibility, when we think we see it, is just our ignorance of the function
  (we call a system flexible when we can''t predict it and rigid when we can).


  (6) And since a system that cannot do otherwise than what its response function
  dictates is not free, the wasp example, far from marking a distinction between insects
  and minds, shows that nothing has free will — including you, and including any artifact
  you might build.


