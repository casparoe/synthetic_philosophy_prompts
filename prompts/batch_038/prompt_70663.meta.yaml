  Hey — I''m drafting a workshop paper (rational choice / philosophy of games) and
  I want a sanity check before I send it off. Notes below are rough, in my own words,
  no quotes yet. Comments welcome, blunt ones especially.


  **Draft abstract + argument notes**


  Setup: Hofstadter''s two superrationality devices. Platonia: 20 people each independently
  decide whether to send a telegram; if exactly one does, that person gets a billion;
  if zero or two-plus do, nobody gets anything. Luring Lottery (the June 1983 Scientific
  American column): readers mail in an entry, one winner drawn at random from the
  N entries, and the winner takes home a million divided by N — so every extra entry
  shrinks the prize for everyone.


  Standard line: in Platonia, superrational players randomize with p = 1/20; in the
  lottery, the dilution is supposed to make it rational to stay out, so the column
  tests whether readers can reason their way to the cooperative answer.


  My claim is that the two cases aren''t the same kind of thing, and the lottery one
  is broken as a test.


  1. In Platonia, a symmetric player''s expected payoff is proportional to p(1−p)^19,
  which has a genuine interior max at p = 1/20. Fine. But note it only buys you a
  success probability of about 1/e ≈ 0.37 — so even in the clean case superrationality
  is not a coordination device, it''s a 1-in-3 lottery ticket on coordination. (Is
  this an unfair complaint? Symmetry is doing the work, and no symmetric randomizing
  scheme can do better.)


  2. In the Luring Lottery, the symmetric payoff to playing with common probability
  p is roughly 10^6/(n²p) — strictly decreasing in p, all the way down. p = 0 is not
  allowed (payoff exactly zero, the sup is never attained), and every p > 0 is worse
  than a smaller one. So there is no superrational recommendation at all: the optimisation
  is degenerate, not hard. Whatever entry count comes back is compatible with superrationality,
  with ordinary egoism, and with plain confusion. An instrument with no scale is not
  a measurement.


  3. Fix: give entry a small real cost (in 1983 terms, requiring a stamped envelope
  does it). Then payoff(p) = p·(10^6·E[1/N²] − c) is maximised at exactly p = 0, the
  sup is attained, and the prediction "nobody enters" becomes falsifiable and non-vacuous
  — it separates superrationalists from optimists who figure N will be small. Costless
  entry is what kills the experiment.


  Comments I''d like:

  - is step 2''s monotonicity argument actually right, or am I mishandling the conditional-on-entry
  expectation?

