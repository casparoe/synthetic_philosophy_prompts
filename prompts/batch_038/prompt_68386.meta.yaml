  Design: A research group builds a "foraging controller" for a swarm of 200 small
  autonomous drones that pollinate an orchard. Two descriptions:


  (1) The engineers'' specification. The controller maintains no map, no model of
  the orchard, and no self-model. Each drone stores a table of about 40,000 (sensor-signature
  → motor-command) entries accumulated by reinforcement during training, plus a small
  hash of route statistics. There is no state that carries information about the bridge,
  the wind, or the nectar flow in any compositional way; the team''s own documentation
  insists there is nothing inside that "represents" anything. The engineers can predict
  each drone''s next motor command exactly, but only one step at a time: they cannot
  say what the swarm will do in a situation not covered by the table, and their predictions
  degrade sharply when they try to project beyond a few seconds.


  (2) The behavioral ecologist''s description. She assigns the swarm a handful of
  beliefs and desires — that the swarm "believes the north rows are depleted," "wants
  to minimize energy per unit of nectar," etc. — and from these predicts the swarm''s
  redistribution across the orchard over hours, including in novel conditions (a wind
  machine turned on, half the rows netted, 30 drones removed). Her predictions are
  right about 92% of the time across the novel trials, and beat the engineers'' simulation,
  which was built directly from the spec.


  Now the question: does the ecologist''s superior predictive success show that the
  swarm has beliefs — that belief-talk picks out a real pattern in the system — or
  does the fact that no internal state represents anything show that her description
  is a convenient fiction, a way of summarizing behavior from the outside?


  That''s a good crux: predictive success at the intentional level with representational
  poverty at the physical level. Strong answer notes:

  - The three stances are strategies for prediction, not competing ontologies; the
  physical stance''s completeness does not make higher-level descriptions unreal.
  Dennett''s point is that being "real" is about there being a pattern that is worth
  capturing — compressing the data — not about being in the furniture of fundamental
  physics.

  - Real patterns: a pattern is real if encoding it lets you predict aspects of the
  data more efficiently than brute enumeration (i.e., compression), and if it''s robust
  (survives changes of implementation/idealization). So the right question is whether
  the ecologist''s belief/desire attributions compress the swarm''s behavior — and
  the case is built so that they do (the engineers'' spec gives exact but non-generalizing
  predictions; hers gives fewer, more general ones). This means the "nothing inside
  represents anything" objection is a red herring at first pass: the criterion isn''t
  structural resemblance. Beliefs can be multiply realized, and the real-patterns
  criterion is about the level of description, not about internal isomorphism.

  - But then the sharper problem: the intentional stance proceeds by idealizing the
  system as rational. If we assign whatever beliefs a rational agent in that situation
  ought to have, the stance''s success may be manufactured by the ascriber''s norms
  rather than discovered in the system — in which case predictive success is compatible
  with there being no fact of the matter about which beliefs the swarm has (ascription
  underdetermination: multiple incompatible belief/desire sets predict equally well;
  e.g., does it "want to minimize energy per nectar" or "want to maximize nectar per
  hour subject to an energy ceiling"? These are intertranslatable). A top answer must
  confront the permissiveness/gerrymandering worry and the interdefinability of beliefs
  and desires, and say what would break the tie.

  - Also: instrumentalism vs realism — a B answer may stop at "it depends whether
  you''re a realist or an instrumentalist," which just restates the debate; an A must
  say what distinguishes a real pattern from a useful fiction on Dennett''s own terms
  and whether the distinction survives the case.

  - The level distinction: even if beliefs are real patterns, the causal story is
  the physical one; "real but not fundamental" isn''t a fudge if there''s an account
  of why the higher-level pattern is projectible and the lower-level description isn''t
  (the spec doesn''t support counterfactual/novel generalization; the intentional
  description does). Real patterns are precisely what survives across realizations.

  - The discriminating test the question should ask for: e.g., perturb the swarm in
  ways that the two accounts diverge on — transplant the controller into a different
  body/environment, lesion a subset of the table entries, check whether ascribed beliefs
  update in a rational-integrating way (belief revision on evidence), whether ascriptions
  are compositional/systematic (Quine: the holism of the mental), whether the swarm
  can be misled (false belief) — misrepresentation is a strong marker, because a pure
  input-output table cannot be "wrong about" anything in the way a belief can. A top
  answer should note that the ability to ascribe false belief and to see the system
  integrate new evidence into existing commitments is a better test than predictive
  accuracy alone.


  So I''ll build the question to demand: (a) an account of what makes a pattern real
  rather than a fiction; (b) a verdict on the case; (c) specification of what further
  evidence would discriminate; and (d) a response to the objection that the idealization
  manufactures the success.


