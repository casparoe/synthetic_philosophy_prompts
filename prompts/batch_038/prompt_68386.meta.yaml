  Dennett''s crux: The intentional stance''s success is supposed to show beliefs are
  real patterns — but only if the success is not just a matter of our own idealization
  projecting structure. The tension: (1) patterns are "real" when they are predictable/exploitable,
  i.e., when encoding them yields information compression ("a pattern is something
  that lets you predict some aspect of the data more efficiently than brute enumeration");
  (2) but Dennett also holds that intentional ascription works because we treat the
  system as optimally designed, rational agent — so any system, no matter how it''s
  built, gets treated the same way; that makes the stance''s success seem guaranteed/trivial,
  undermining the evidential force; (3) the physical stance tells you the real mechanism,
  the design stance tells you what the artifact is for — and the intentional stance
  is a special case of the design stance (the design is "rational agent"); so beliefs
  may be no more real than "the function of the heart" — real but not fundamental.


  So a good exam question crux: Can the intentional stance''s predictive success establish
  that beliefs and desires are real, given that the stance works by idealizing the
  system as rational — and given that the same success could be achieved by a system
  with no inner states resembling beliefs at all (e.g., a lookup table, or an LLM)?
