  workshop (not a literary event) where I''ll defend a specific interpretive claim
  about the fragment, plus a novelist reading it.

  - The thesis: sketch it — (a) TP ch. 11 breaks off not because of death-as-interruption
  but because the argument had hit a wall: the same premise that makes democracy the
  most natural state (that power pooled in the multitude remains collective power,
  and that obeying a decree you helped make is obeying yourself) also makes it impossible
  for Spinoza to say what a democracy is *not* — no distinction between the assembled
  multitude and a riot; (b) so the missing rest of the chapter would have had to be
  a chapter on the limits of the multitude''s power, and there''s evidence he knew
  it — the TTP''s discussion of the Hebrew state as a theocracy that dissolved into
  mob rule after Moses, the Saul/David material, the 1672 lynchings of the De Witts
  which the novel stages; (c) hence the novel''s structural device: the last chapter
  is left deliberately incomplete, and I want to defend that as interpretation, not
  a gimmick.

  - The audience: describe precisely — early-modernists who work from the Latin and
  care about the difference between TTP (1670, published, rhetorical, addressing theologians)
  and TP (unpublished, technical, addressed to philosophers); two or three who read
  Spinoza through the French multitude tradition and think "the political" in Spinoza
  is about affect and power, not institutions or rights; a historian of the Dutch
  Republic who cares about regent oligarchy and the 1672 Rampjaar; a grad student
