  The novelist''s described phenomenon: In her drafts, she deliberately leaves out
  a scene. The reader encounters two things that can''t both be true on the surface
  (e.g., a character''s diary says she never left the house, but in the next chapter
  her boots are caked with river mud). The reader doesn''t infer anything from a general
  rule; there''s no law-like connection. Instead the reader is forced to *suppose
  an unreported event* purely to resolve the incompatibility, and then treats that
  supposed event as established fact for the rest of the book, and would even defend
  it. Key features distinguishing it from inference: no general rule / no vyāpti-like
  invariable connection; the "reason" is the *impossibility of the alternative* rather
  than a mark pointing at the thing; the content posited is a particular event, not
  a repeatable kind; and it''s driven by the assumption that the text is coherent/non-wasteful
  (every detail is there for a reason) — an assumption about the *author*, like trustworthiness,
  but the author isn''t asserting anything at all.


  That is very close to arthāpatti (postulation), with the Mīmāṃsā paradigm case being
