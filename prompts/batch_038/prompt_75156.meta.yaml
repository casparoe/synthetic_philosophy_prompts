  and start by brainstorming candidates before you commit. What''s the closest thing
  the pramāṇa debates already have — is the ''resolve an incompatibility by positing
  the unobserved'' move the same as what one school wanted as its own channel and
  another school tried to fold into inference, and if so what exactly breaks when
  you move it from the world to an artifact where the incompatibility was planted
  by a person for effect? Does the ''nobody is asserting it'' point knock out the
  testimony option entirely, or is there a version of trustworthy-speech that covers
  a speaker who means you to supply what they witheld? And the memory business — the
  confident recollection of a scene that was never presented — is that a recognised
  failure anywhere in that framework, or is it just a modern psychology thing that
  they''d have no slot for? I''d like, for each candidate you consider, what it does
