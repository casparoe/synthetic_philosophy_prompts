  about citations or a reading list, I can''t chase them anyway. What I want is your
  read as someone who actually knows that literature: does the thing below already
  have a name in it?


  Here''s the thing. In my drafts I leave scenes out on purpose, and readers reliably
  supply them. Two examples from the current manuscript. (a) A woman''s brother tells
  her, in dialogue, that their mother spent every day of that August in the house
  — she was too ill to leave her bed — and eleven pages later the narrator notes that
  the mother''s shoes are by the door with river mud caked in the welts. Nobody says
  anything else. Every single one of my early readers came away knowing that the mother
  had been down to the river, and would argue for it, and got annoyed at me when I
  pointed out the book never says so. (b) A chapter ends with a man putting a letter
  in his coat, the next chapter he''s on a train with an empty coat and no letter,
  and readers will tell you, flatly, that he posted it at the station.


  Now, what I want the name of isn''t just ''readers fill in gaps'', I know that phrase,
  it''s useless to me. What''s odd about it, and why I think it might be a distinct
  item rather than a species of something else, is three things. First, there''s no
  rule doing the work. In the mud case the reader isn''t applying any general connection
  — mud doesn''t always mean secret trips, mothers don''t always lie — they''re positing
  one particular unreported event purely because otherwise two things the book has
  given them can''t both stand, and the posited event is the cheapest way to make
  them stand together. Second, nobody is telling them anything. The author isn''t
  asserting it, and the reader knows perfectly well the author isn''t asserting it,
  so whatever warrant this has, it isn''t the warrant of taking a trustworthy person''s
  word — the trustworthy person is pointedly not speaking. Third, and this is the
  part I have no handle on at all: it goes into memory as though it had been said.
  Six months later a reader will describe the mother''s trip to the river in detail,
  with feeling, and be genuinely startled to be shown the page where it isn''t. The
  invented fact isn''t experienced as a guess they made, it''s experienced as a thing
  they were told, or a thing they saw.


