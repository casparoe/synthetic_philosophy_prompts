  "Loschmidt''s objection is that the H-theorem purports to derive a time-asymmetric
  conclusion from time-symmetric premises. The microdynamics of a dilute gas — Hamilton''s
  equations with a time-reversal-invariant interaction — are unchanged by the transformation
  t → −t, p → −p. If a microstate beginning in a low-entropy macrostate reaches equilibrium
  after an interval T, then the state obtained by reversing every momentum at that
  moment retraces the history and returns the gas to its initial low-entropy macrostate
  at 2T. For every entropy-increasing trajectory there is therefore an entropy-decreasing
  one, and monotonic increase cannot be a theorem of the dynamics. The objection is
  sound as far as it goes, and Boltzmann''s first statement of the theorem did overreach,
  because the derivation assumes molecular chaos before each collision, an assumption
  which the collisions themselves destroy.


  Boltzmann''s substantive reply is statistical rather than deductive. The second
  law does not assert that entropy cannot fall; it asserts that a fall is overwhelmingly
  improbable. On the Boltzmann conception, the entropy of a macrostate measures the
  phase-space volume it occupies, and the equilibrium macrostate exceeds any non-equilibrium
  macrostate in volume by an astronomical factor — of the order of exp(10^23) for
  a mole of gas confined to half its container. Given that the dynamics preserve volume,
  a system placed at random within a low-entropy macrostate will thereafter be found
  in successively larger macrostates with probability indistinguishable from one.
  This is enough to dispose of Loschmidt: the objection shows only that decrease is
  possible, and the second law, properly stated, never denied that. Poincaré recurrence
  is sometimes pressed into service on the same side, but the recurrence time for
  a macroscopic system outruns any interval over which the question could meaningfully
  be asked, and a recurrence theorem does not in any case contradict a statistical
  regularity.


  Cosmology adds a refinement. The statistical argument requires that the system be
  in a low-entropy macrostate at some time, and it is the dynamics'' business to say
  what happens from there, not how it came to be there. The Past Hypothesis is the
  proposal that the universe began in a very special, very low-entropy macrostate;
  together with the microdynamics and a statistical postulate over the microstates
  within that macrostate, it yields entropy increase away from the boundary. Two difficulties
  are commonly noted. It is not easy to specify which macrostate the hypothesis selects
  with the precision a law would seem to require. And the rival account — that our
  region is a rare fluctuation within an ambient equilibrium — fares worse, because
  it predicts that we should overwhelmingly be momentary observers with spurious memories
  rather than observers situated in a long, coherent, entropy-increasing history.


  What, then, is the second law? Two characterisations are available. It may be treated
  as a theorem: given the microdynamics, the Past Hypothesis and the statistical postulate,
  entropy increase follows; and a proposition which follows from premises does not
  seem to be a law of nature in the same sense as those premises. Or it may be treated
  as an artefact of coarse-graining. Liouville''s theorem guarantees that the fine-grained
  Gibbs entropy of a distribution is invariant under Hamiltonian evolution, so nothing
  in the microscopic description ever increases; increase appears only when the distribution
  is smeared across macrostates, and the smearing is something we perform. Entropy,
  on this view, is a property of a description rather than of a system. I take this
  second characterisation to be the correct one. The first leaves the second law without
  content of its own, whereas the second explains why the law has seemed so resistant
  to derivation. It has a consequence worth stating plainly. If entropy increase depends
  on a choice of description which is ours to make, then the second law is not a fact
  about the world but a fact about our representation of it, and the direction of
  time, so far as it rests on the second law, is perspectival: nothing in nature distinguishes
  the two temporal directions, and the asymmetry we experience is imported by the
