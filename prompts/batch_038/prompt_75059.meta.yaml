  Hamiltonian evolution; increase appears only when we smear the distribution over
  macrostates, and the smearing is ours. Following Jaynes, entropy is a property of
  the description rather than of the system. The second law, on this view, is not
  a fact about the world at all but about how we choose to describe it, and the direction
  of time inherits that status: it is perspectival.


