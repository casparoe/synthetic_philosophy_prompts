  Loschmidt''s objection runs as follows. The microdynamics of a classical gas — Hamilton''s
  equations, or Newton''s second law with a time-reversal-invariant potential — are
  invariant under the transformation t → −t together with p → −p. Suppose a microstate
  M(0) in a low-entropy macrostate evolves to equilibrium at time T. Then the reversed
  microstate, obtained by negating every momentum at T, evolves back to the low-entropy
  macrostate at time 2T. So there is, for every entropy-increasing trajectory, an
  entropy-decreasing one; and entropy increase therefore cannot be a consequence of
  the dynamics. If the H-theorem claimed to derive monotonic increase from the dynamics
  alone, the H-theorem is false. This is right, and Boltzmann''s own formulation of
  the theorem was over-claimed: the derivation depends on the assumption of molecular
  chaos, which is not preserved by the evolution.


  Boltzmann''s real reply is statistical. The second law does not say entropy cannot
  decrease; it says that decrease is overwhelmingly improbable. On the Boltzmann definition,
  entropy is a measure of the phase-space volume of the macrostate, and the equilibrium
  macrostate occupies a volume larger than any non-equilibrium macrostate by an astronomically
  large factor — for a mole of gas, something like exp(10^23). So while the reversed
  microstate exists, the set of such microstates is a set of vanishingly small measure
  within the low-entropy macrostate, and a system started at random in that macrostate
  will, for all practical purposes, increase its entropy. That disposes of Loschmidt:
  what the objection establishes is that entropy increase is not necessary, and the
  second law never claimed necessity.


  Cosmology supplies a further refinement. To apply the statistical argument one needs
  to know that the system is in a low-entropy macrostate at some time, and the fact
  that our universe is in such a state now, and has been throughout the whole of recorded
  history, is not something the dynamics can account for. The Past Hypothesis is the
  proposal that the initial macrostate of the universe was a very special, very low-entropy
  one. Combined with the microdynamics and a statistical postulate about which microstates
  within it are actual, it entails entropy increase away from that boundary in one
  time direction. There is a well-known difficulty about saying precisely which macrostate
  the hypothesis picks out, and the alternative — that our region is a rare thermal
  fluctuation out of a surrounding equilibrium — is worse, since it predicts that
  we should overwhelmingly be isolated observers with false memories rather than observers
  embedded in a coherent, entropy-increasing history.


