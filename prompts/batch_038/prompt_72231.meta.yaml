  Thesis sketch:

  1. Standard PP: C(A | chance(A)=x ∧ E) = x, for admissible E.

  2. Problem: Humean best-system accounts make future frequencies partly constitutive
  of present chances → undermining: a future that would make present chances different
  is possible, and PP seems to forbid credence in it (the "Big Bad Bug" worry), so
  PP is inconsistent with Humeanism; Lewis''s fix (New Principle: condition on the
  entire chance theory) is ad hoc and makes PP uninformative, since no finite agent
  ever knows the complete chance theory, and it also seems to grant weird deference
  to "the whole truth about chances," which includes the future.

  3. My view: replace the chance-condition with a condition on the *best explanation*
  of one''s total evidence. Formally: C(A | E) = x where x is the chance value assigned
  by the theory that best systematizes E (plus, crucially, that would remain best
  under the addition of any admissible further evidence). This is a "stability-clause"
  version.

