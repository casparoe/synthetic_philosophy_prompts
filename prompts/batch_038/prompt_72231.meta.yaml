  explanatory; (b) undermining dissolves because the stability clause rules out conditioning
  on future frequency info that would flip the best system (it''s not "admissible"
  in the relevant sense, defined non-circularly now: admissible = evidence that doesn''t
  change which theory best explains); (c) recovers calibration in the limit for agents
  whose evidence grows; (d) explains why PP looks a priori without being a bridge
  to spooky stuff.

