  - Payoffs: (i) no commitment to chances as worldly features, so Humeans and anti-Humeans
  can both accept it; (ii) the undermining problem dissolves: an undermining future
  is just one where future frequencies would make my current best systematizer no
  longer the best, and the stability clause is what rules out conditioning on it,
  replacing Lewis''s circular notion of admissibility with a non-circular one; (iii)
  it explains why PP looks a priori.

