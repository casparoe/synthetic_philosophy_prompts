  Let me maybe verify a couple of details quickly? The instructions say search only
  if genuinely required. I think I know Dutch book arguments well. Key facts:

  - Ramsey (1926, "Truth and Probability") proposed measuring belief by betting odds;
  his "Dutch book" argument appears in a footnote-ish passage about the logic of partial
  belief being the calculus of probability, justified because a bookie could make
  a set of bets that guarantees a loss if the degrees of belief don''t conform. Actually
  Ramsey''s argument: "If anyone''s beliefs violated these laws, his choice would
  depend on the precise form in which the options were presented to him, which would
  be absurd." That''s the standard gloss — Ramsey''s Dutch book argument is about
  the form in which options are presented. I should be careful: I won''t quote. I
  can paraphrase without quotes.

  - de Finetti (1937) "La prévision" formulated the coherence criterion: an assessment
  of conditional probabilities is coherent iff no Dutch book can be made against it;
  and coherence is equivalent to satisfying the axioms of probability (including conditional
  probability axioms).

  - Lehman (1955) proved the Dutch book theorem for conditional probability.

  - Shimony (1955) "Coherence and the axioms of confirmation" — coined "coherence."

  - Carnap and Lewis discussed.

  - Christensen, Skyrms, Earman (1992 "Bayes or bust?") — Earman criticizes Dutch
  book arguments as resting on the premise that you''re in the betting business and
  treating utility linear in money.

  - Hajek''s "Dutch book argument" entry in Stanford Encyclopedia — discusses the
  assumptions: the betting interpretation of credence, the assumption that the agent''s
  utilities are additive/linear in money, the "sure-loss" premise, the "good-making"
  premise (avoiding sure loss is good), the connection premise (sure loss is a bad
  thing to have). Also the "Dutch bookability" arguments for conditionalization (Lewis''s
  diachronic Dutch book, Teller 1973) which require the assumption that you''ll accept
  the same bets later, and the "package principle."

  - Also: the converse Dutch book theorem — if your bets are coherent, no Dutch book
  can be made, i.e., coherence is sufficient as well as necessary, but that requires
  infinitely many bets available or divisible stakes, otherwise there are "coherent"
  agents vulnerable. Hajek points out the converse fails without the assumption of
  divisible stakes — actually Hajek''s point is that the converse Dutch book theorem
  requires the assumption that stakes are infinitely divisible / that bets can be
  scaled arbitrarily; otherwise coherence doesn''t guarantee immunity. Good detail.

  - Also: a Dutch book requires all bets placed simultaneously with known payoffs,
  and it doesn''t apply if the agent isn''t offered the bets; also, money bets vs
  utility bets: risk aversion means your betting quotient at any single stake needn''t
  be your credence.

  - Also: the conclusion is a normative claim about credences, not about actual money
  losses; and "coherence" is necessary but nowhere near sufficient for rationality
  — a perfectly coherent agent can be wildly wrong about the world. That''s the big
  overstatement to catch.

  - Also: the conjunction fallacy doesn''t show that people are incoherent in the
  technical sense because (a) subjects'' verbal probability estimates may reflect
  conversational interpretation ("how plausible"), (b) the bets aren''t actually available
  to them, (c) the money-vs-utility issue, (d) frequency formats reduce the effect.

  - Also: "guaranteed to lose money" is wrong: the Dutch book requires a bookie to
  construct bets that the agent will accept at their own quoted odds, and the loss
  is guaranteed only relative to those bets, which needn''t exist; also the loss could
  be tiny.

  - Also: Dutch book arguments for conditionalization require the assumption that
  you''ll buy/sell at odds you now forecast you''ll accept (Lewis''s "package principle"),
  and there are objections (Skyrms, Christensen: diachronic Dutch books can be blocked
  by rejecting the assumption that the agent would accept bets now on the basis of
  later credences; also van Fraassen''s reflection principle connections).

