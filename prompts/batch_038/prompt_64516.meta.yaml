  expected-utility maximizer with a stable utility function over consequences that
  does not mention beliefs or information states; (b) the observation is free in money,
  time, and effort; (c) the act set before and after is identical; (d) the states
  of nature are causally unaffected by whether the observation occurs (so no strategic
  signaling); and yet, on reflection, the agent rationally declines the observation,
  and the decline is not a mistake in the theorem''s math. Then ask: is such a case
  possible? If not, say which condition must go, and build the case that bends the
  least surprising one; identify precisely where the bending occurs (i.e., show the
  exact step in the proof that fails). Then also require a second, independent case
