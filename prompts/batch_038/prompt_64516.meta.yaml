  Let me design carefully. Good''s theorem (roughly): Let A be a set of acts, S a
  state space, U a utility function on consequences, and let the agent''s prior be
  P. For any experiment E with possible outcomes e, if the agent will choose, after
  observing e, the act maximizing conditional expected utility given e, and if observing
  E is costless, and neither A, S, nor U change, then the expected utility of "observe
  E, then choose" is at least the expected utility of "choose now." Proof: for each
  e, max_a Σ_s P(s|e)U(a,s) ≥ Σ_s P(s|e)U(a*,s) for the a* chosen now; take expectation
  over e; use the law of total probability/martingale property.


  Escape hatches:

  1. U depends on the agent''s own information state (e.g., U(consequence, belief)).
  If a preference over "knowing" is a consequence-level preference, it can be accommodated
  within U over consequences defined on states that include the agent''s epistemic
  state — but then it''s a genuine utility function over consequences and Good''s
  theorem applies to the enlarged consequence space... Actually no: if utility depends
  on whether you know, that means the utility function is defined on consequences
  that include the information state, so the theorem applies but then the comparison
  changes: the "no experiment" branch has different consequences than the "experiment"
  branch — and the theorem''s fixed-U condition arguably still holds, but the act
  set includes the choice of whether to observe, so observing changes the consequence
  space. Hmm, the standard treatment: Good''s theorem requires U not to depend on
  the experiment''s outcome; that''s the "no preference for information per se" condition
  (sometimes stated as: utility is a function of acts and states only, not of the
  observation). So a case with suspense/surprise preferences violates that condition
  — but it looks like a preference over consequences, not over information. This is
  subtle and is exactly the interesting philosophical point: is "feeling suspense"
  a consequence or an information state? I''d say the case bends condition (2)/(4).


  2. Non-expected utility: ambiguity aversion. E.g., an agent with a maxmin-EU (Gilboa-Schmeidler)
  prior set: free information can be strictly bad. There''s a classic example: a maxmin
  agent facing an Ellsberg-like urn... Actually known result: for ambiguity-averse
  (non-Bayesian) agents, the value of information can be negative (e.g., in the "information
  aversion" literature, Wakker 1988? or "Ambiguity aversion and the value of information").
  But that violates "Bayesian expected-utility maximizer."


  3. The state space is not independent of the observation: e.g., self-referential
  / "the observation tells me which act I will take." Consider a case where the observation
  is about the agent''s own future disposition.


  4. Costless but with a side effect on the world: e.g., the measurement disturbs
  the state. In a strategic setting, the observation is public, so it changes the
  opponent''s beliefs and behavior. This is a great, realistic escape hatch: "costless
  private observation" vs "observable observation." If the act of testing is visible,
  the world changes. But then the state space changes / the act has a causal effect
  on states — the theorem''s condition that the experiment not causally affect the
  states is violated. That''s a legitimate bending: Good''s theorem requires the observation
  to be causally inert with respect to the states relevant to the decision (or at
  least the act of observing to be a separate act that doesn''t influence states).
  In decision analysis, this is the distinction between "measurement that doesn''t
  affect the system" and "measurement that does."


  5. The experiment changes the act set: after observing, some acts are no longer
  available (e.g., you can''t un-know). Classic: learning your friend betrayed you
  means you can''t continue trusting them; the act "trust them" is still available
  but with different... hmm.


  6. Dynamic inconsistency with unbounded utility / undefined expectation.


  7. "The value of information is negative when you must act on it because you cannot
  commit to ignoring it": this is the "Ulysses" problem — actually the reverse: the
  agent would like to commit to ignoring, but can''t help updating (conditionalization
  is involuntary). If the agent has a preference that is best served by not knowing
  (e.g., a doctor whose treatment works only if she believes... no, that''s utility
  dependence again).


  8. A very clean and genuinely EU-preserving case: the "self-fulfilling prophecy"
  where knowing changes others'' behavior — strategic. E.g., a job candidate who takes
  a test: if the test is public and the employer conditions on it, taking a test with
  a noisy negative signal can hurt even though the candidate''s ability is unchanged.
  Here the observation causally affects payoffs. This bends the causal-inertness condition.


