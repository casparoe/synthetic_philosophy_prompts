  Option B: Domain = Good''s theorem on the value of information; Type = construct
  a thought experiment to specifications. Good''s theorem: the expected value of an
  experiment/observation, for a Bayesian agent deciding which act to take, is non-negative
  under certain conditions — specifically, the expected utility of accepting a free
  observation before choosing is at least as great as choosing without it, provided
  the observation doesn''t change the set of acts, the utility function, and there''s
  no cost. Good 1967 "On the principle of total evidence" and Good''s theorem in Good
  (1950)/ Good & Osteyee. The failure modes: when the observation changes the utility
  function (e.g., self-fulfilling beliefs), when there are costs, when the agent''s
  future self can''t commit (dynamic inconsistency / diachronic Dutch books), when
  the act set changes, or when observation affects the agent''s ability (e.g., learning
  bad news destroys motivation — Elster''s sour grapes). This could make a nice thought-experiment
  prompt: "Design a decision problem in which Good''s theorem fails even though all
  its standard conditions appear satisfied — i.e., a free, costless observation that
  a Bayesian agent strictly prefers not to accept." Constraint: no utility-function
  change, no cost, no change in act set... The classic answers: (1) observation changes
  the agent''s beliefs about the utility of outcomes (preference change); (2) "costless"
  observation that carries a side effect; (3) cases where the agent knows the observation
  will lead them to take a different act because of a self-referential predictor;
  (4) cases where accepting the observation makes a future act impossible (act-set
  change is excluded though). Actually there''s a known literature: "the value of
  information can be negative when the observation affects the decision-maker''s own
  preferences or when there are strategic others." Also, in game theory, information
  can have negative value (e.g., in bargaining games, being informed can hurt; the
  "paradox of information" / Kaminski). Also with non-expected utility preferences
  (e.g., ambiguity aversion — Ellsberg: a free signal can be undesirable? Actually
  for ambiguity-averse agents, information can have negative value — e.g., Wakker''s
  example, or in the "information aversion" literature). Also for agents with non-consequentialist
  preferences over time (Kreps-Porteus with negative value of information for disappointment-averse
  / news-utility agents — Gollier, Eeckhoudt; "anticipatory utility" à la Caplin &
  Leahy). So: design a case where Good''s theorem''s conditions all hold — the observation
  is free, doesn''t change the act set or the utility function over consequences,
  and the agent is a Bayesian expected utility maximizer — and yet the agent rationally
  declines it. The catch: you need to identify which hidden condition is being violated,
  because Good''s theorem is provable; so a successful case must show a condition
  that was tacitly assumed and is violated (e.g., the utility function is defined
  over acts-plus-information states, or the agent''s own future act depends on the
  observation in a way that changes the state space — a state-space expansion: the
  "states" must be defined independently of the observation). That''s the real philosophical
  work: Good''s theorem assumes the state space and utility are defined prior to and
  independently of the observation; if the act''s utility depends on the information
  state (i.e., information enters the utility function), the theorem doesn''t apply.
  So a designed case is one where it looks like utility is over consequences but actually
  information has crept into the utility description. That''s a great "specification"
  prompt with an honest note about what feature does the work.


