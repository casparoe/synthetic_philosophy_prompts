  it over-excludes: by (vi)+(vii), most citizens in any real state are in relations
  of dependence (wage labor, debt, care); moreover, in a democracy every citizen is
  subject to the common decree, which Spinoza himself says is to be obeyed even against
  one''s private judgment — so on the "not under another''s power" criterion, is any
  citizen sui iuris? Spinoza''s answer is that in democracy the citizen is under the
  power of the whole of which they are a part, hence not under another''s power. But
  that answer depends on the citizen being *part of* the whole — which is exactly
