  And the deeper one: (v)''s "I accept the principle but reject the application."
  The principle is that citizenship requires being sui iuris, i.e., not under another''s
  power. To reject the application to women while accepting the principle, the asker
  needs a reason. If the reason is that Spinoza''s claim about women''s subordination
