  Let me design the belief set carefully:


  Setting: a PhD student / junior researcher writing up their "Spinozist" political
  theory for a workshop or a chapter; wants a consistency audit.


  Commitments (I''ll label them):

  1. Natural right is coextensive with natural power: whatever an individual or a
  collective can do, it has a right to do; right adds nothing over power.

  2. Consequently, the right of the state (imperium) is nothing but the combined power
  of the multitude, and it waxes and wanes with that power — there is no such thing
  as a state whose authority exceeds what it can actually get its subjects to do.

  3. Democracy is the most natural and the most absolute form of imperium, because
  in it each person transfers their power not to another person but to the whole of
  which they remain a part; hence no one obeys an equal, and all remain as free as
  they were in the state of nature.

  4. Freedom of judgment and of expression cannot be surrendered or effectively controlled:
  the sovereign can compel outward conduct but never assent, and attempts to control
  minds both fail and destabilize the state. So a well-ordered democracy maximizes
  liberty of philosophizing, and this is compatible with, indeed required by, its
  own power.

  5. Some people are not sui iuris: those who live under another''s command — servants,
  apprentices, and (as Spinoza says) women in the household — and so are excluded
  from citizenship in a democracy. Their exclusion is not an arbitrary prejudice but
  follows from what citizenship requires, since a citizen must be able to deliberate
  and act on their own judgment.

  6. The affects are governed by the same necessary laws as everything else; political
  institutions must be designed for people as they are, not as an ideal theory would
  wish them to be; and the composition of powers through agreement makes the whole
  genuinely stronger than the sum of the parts.

  7. Methodological: I want a theory that avoids moralizing — no natural law in the
  traditional sense, no rights grounded in dignity or personhood, no appeal to what
  people deserve; everything must be explained through power and the conatus.


  Now the tensions:


  Tension A (the deep one): (1)+(2) vs (5). If right = power and the state''s right
  is just the multitude''s power, then a group''s sui iuris status is a matter of
  what it can actually do. Excluding women from citizenship on the grounds that they
  are under men''s power treats as a natural fact something that is a contingent historical
  arrangement — and by (1) the women''s natural right is not diminished by that arrangement
  at all: right tracks power, not legal standing. Worse, if right = power, then any
  excluded group that retains substantial power (all of them do) has by Spinoza''s
  own equation a right equal to its power, so "not sui iuris" cannot be a natural
  predicate but only a description of a de facto power relation. And (6)''s composition
  thesis gives an internal reason against exclusion: a democracy that excludes half
  the population from deliberation forfeits part of the power-composition that is
  the sole source of its right, thereby weakening its own right by (2). So (5) is
  unstable from both directions — metaphysical (right=power) and strategic (composition
  of powers). This is the well-known feminist critique, but the asker doesn''t know
  it, and the derivation via (2)+(6) is genuinely non-obvious. Severity: high.


