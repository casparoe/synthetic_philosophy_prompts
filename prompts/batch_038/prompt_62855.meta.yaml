  as a small, ordinary act of dishonesty with a face attached, not as an illustration
  of a manipulability result.


  Third, end after the vote, in the drafting of the published decision: the commission
  owes a single justification for a listing whose grounds a majority rejected. Make
  the last line of the story a line of that document.


  No philosophers among the characters, no passage of exposition, and neither "discursive
  dilemma" nor "doctrinal paradox" appears anywhere in it. The logic should be exact
  and invisible.


