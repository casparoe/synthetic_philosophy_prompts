  one on the architectural ground alone, one on the historical ground alone, and two
  on neither. So p is rejected 3–2, q is rejected 3–2, and the listing is carried
  3–2. Aggregating on the premises denies the listing; aggregating on the outcome
  grants it, and does so in the opposite direction from the conjunctive version of
  the case everyone knows. Every commissioner is individually consistent; the inconsistency
  is in the set the commission holds as a body.


