  ---


  I am drafting a chapter for an edited collection on metaphysics and the nineteenth-century
  novel. My assignment is Mary Shelley''s Frankenstein, read through the Special Composition
  Question: under what conditions, if any, do some things compose a further thing?
  I want literary-philosophical criticism that is answerable to both the novel and
  the metaphysics, not a plot summary with a technical vocabulary draped over it.
  The volume''s style sheet forbids footnotes and the editors are supplying the scholarly
  apparatus, so please give me the argument and the readings rather than any bibliography,
  reading list, or citation; paraphrase the novel rather than quoting it.


  Begin by mapping the space of answers compactly and in your own words: nihilism
  about composite objects; universalism, together with the Lewis–Sider argument from
  vagueness that is usually taken to motivate it; the contact-and-cohesion family
  of restricted answers; van Inwagen''s view that composition occurs only where the
  activity of the parts constitutes a life; and Merricks'' view that composition occurs
  only where a plurality has causal powers not already had by the parts acting in
  concert. Two or three paragraphs at most, and framed so that each answer makes a
  different prediction about Victor''s creature. Then do the reading.


  I am not interested merely in the observation that the creature is assembled. Please
  take up at least the following.


  Provenance. The parts Victor gathers have already been parts of other living beings,
  and the novel is insistent on where they come from. Is what results an organism,
