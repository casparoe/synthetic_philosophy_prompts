  ---


  I am preparing a chapter for a collection on metaphysics and the nineteenth-century
  novel, and my assignment is Mary Shelley''s *Frankenstein* read through the Special
  Composition Question: what are the conditions under which some things compose a
  further thing? I want a piece of literary-philosophical criticism, not a summary
  of either the novel or the metaphysics, and I want it to be rigorous on both sides.


  Set out, briefly and without citation, the space of answers the question admits
  — nihilism, universalism, the contact-and-cohesion family of answers, the view that
  composition occurs only when the activity of parts constitutes a life, and the view
  that composition occurs only where a plurality of parts has causal powers that the
  parts do not jointly duplicate — and then take up the novel.


  The Creature is the obvious test case, but I want more than the observation that
  he is assembled. Please address at least the following:


  1. Provenance. The parts Victor collects have already been parts of other living
  things... Is the resulting being an organism, an artefact, or something closer to
  a colony — a single body whose unity is of the sort a siphonophore or a coral has
  rather than the sort a mammal has? What does the novel do with the fact that the
  Creature''s unity is achieved rather than grown, and does anything in the book treat
  that as metaphysically disqualifying?


  2. Threshold. The animation scene is a threshold... and the destruction of the half-finished
  female is a threshold in reverse... Is there any sign that Shelley takes a view
  about where the boundary falls, or does she exploit its unsharpness? If the latter,
  does the novel thereby lend support to the argument from vagueness — that any restricted
  answer to the SCQ will have to be vague, and that vagueness in composition is intolerable
  — or does it suggest the opposite, that vagueness here is a cost worth paying?


  3. Narrative unity. The Creature''s own embedded narration... does the novel in
  effect offer psychological continuity as a criterion of composition, so that he
  becomes one thing by giving an account of himself as one thing? If so, say plainly
  that this runs together a synchronic mereological question with a diachronic question
  about persons, and assess whether the novel can be read as aware of the difference
  or is simply trading on it.


  4. Victor''s implicit mereology. Victor''s treatment of the Creature — flight, refusal
  to continue, the hunting... does Victor regard the Creature as one being, or as
  a heap of stolen parts to be dissolved? And is his horror better read as horror
  at a composite that ought not to have been composed, or at something else?


  5. Where the reading breaks. Say honestly what the SCQ lens cannot accommodate...


  Finally: what does the novel put into the debate that argument alone does not? ...


  Constraints: no bibliography, reading list, or citations; the chapter''s references
  will be supplied by the editors. Please paraphrase rather than quote. If a point
  you make would turn on differences between the 1818 and 1831 texts, flag it as such
  rather than asserting what the variants say. Assume the reader knows the novel''s
  plot — including the Walton frame, the De Lacey episodes, and the Arctic conclusion
  — but do not rely on their remembering minor characters'' names.


  Aim for something like 2,000 words, organised under headings of your choosing.


