  Draft:


  Five years ago I joined a large AI research lab as an engineer, and for most of
  that time I ran the team that produced the human judgment data our systems were
  trained against — the rankings of candidate answers, the written rationales, the
  whole apparatus. Friday is my last day, and I have been asked to say a few words
  at the all-hands. About 120 people will be in the room: roughly half are researchers
  and engineers, including eleven who reported to me; the rest are in policy, legal,
  recruiting, finance, facilities and operations, and have never read a technical
  document in their lives. My partner will be there. This is a goodbye, not a platform,
  and everyone expects a goodbye.


  What I actually want to do is make one argument — the argument that, over about
  eighteen months, turned into the reason I am leaving — and make it as a gift rather
  than as a parting shot. Here is the argument, badly put, for you to sharpen: I came
  to think we had described our own goal in a way that was wrong in a practically
  consequential sense. We said we were trying to get the systems to share our values,
  and to converge on what people approve of; and we built an enormous machine for
  measuring approval. But when I looked at where the systems actually failed, almost
  none of the failures were failures of approval-prediction. They were failures to
  work out what the particular person in front of them was trying to get done. Those
  are different problems, and the second is much narrower than the first: it is about
  correctly interpreting and then pursuing one person''s present aim in one situation,
  and it can in principle be checked, case by case, by asking that person. The first
  is about a standing valuation that has to be right in advance and in general, and
  no one can say whose. A system can be superb at predicting what a rater will like
  and still be hopeless at the second thing, because the rater is not the person who
  will later be trying to get something done. And a system can be good at the second
  thing without holding anything that deserves the name of a value at all — the way
  a good interpreter or a good chief of staff is.


  Write the talk. Hard constraints:


  - Six minutes aloud, roughly 850 to 950 words, in sentences a person can actually
  say.

  - Not one term of art. The words "alignment," "value alignment," "intent alignment,"
  "AGI," "the alignment problem," "mesa-optimizer," "reward model," and "preference
  data" are all banned, and so is any device that smuggles them back in by defining
  them on the spot. The distinction has to be carried by an example, an image, or
  a piece of my own history — not by vocabulary.

  - No names: no people, no teams, no products, no papers, no companies. I want to
