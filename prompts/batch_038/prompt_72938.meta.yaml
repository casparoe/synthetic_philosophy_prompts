  1. "More information can never hurt" — they''ll treat Good''s theorem as a trivial
  slogan, and then will resist the exceptions.

  2. "The value of information is just how much it changes your decision" — the folk
  heuristic "information is only useful if it changes your mind/decision," which is
  actually false in the theorem''s terms (information can be valuable even when it
  doesn''t change the choice? hmm—actually under the theorem, VOI = 0 iff the choice
  doesn''t change... roughly, iff the optimal act remains optimal across all possible
  realizations). Actually the folk heuristic is nearly right in the special case but
  wrong in important ways: information can have value even if the *same act* is chosen
  but the *plan* changes (contingent plan vs. single act), and the "value" of information
  isn''t about changing your mind but about changing what you do. Better misconception:
  they''ll think information''s value comes from changing your beliefs, whereas it
  comes from enabling better contingent plans (the difference between a decision made
  now and a policy committed to in advance). That''s a genuinely deep and in-the-weeds
  point: VOI compares "pick act now" vs "pick a plan now, execute after evidence"
  — the value comes from the ability to make the choice *later, with more knowledge*,
  not from the belief change per se. That''s a nice carrying insight.

  3. "So you should always run the extra test." The exceptions: cost, delay, iatrogenic
  harm (obvious), but the interesting non-obvious ones: (a) when the evidence changes
  the *decision problem* rather than your information about it — e.g., a test result
  that legally/contractually obligates you to act (mandatory reporting, once-you-know-you''re-liable,
  duty to disclose); (b) when you can''t commit to acting optimally afterward — weakness
  of will, or a rule you''ll follow like "if the scan shows X, I must offer surgery";
  (c) when someone else''s behavior depends on whether you know (adversarial/strategic
  settings — your information changes the game); (d) when your utility depends on
  your own beliefs (wanting not to know; or preferring to be ignorant of, e.g., a
  prognosis). Also (e) when receiving evidence changes your future self''s options,
  e.g., "willful blindness" in law, or knowledge triggering psychological harm. Good''s
  own counterexample, I believe, involves an agent whose subsequent action isn''t
  chosen by maximizing conditional expected utility — e.g., a case where learning
