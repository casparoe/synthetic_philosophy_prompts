  Good''s theorem (principle of total evidence / Good 1967): If you are faced with
  a decision, and you will learn evidence E for free, and your decision rule after
  learning E is to choose the act maximizing expected utility given your posterior,
  then the expected utility of learning E (and then acting optimally) is at least
  as great as the expected utility of deciding now without E. Equality iff the evidence
  doesn''t change your choice (roughly). This is a consequence of Jensen''s inequality
  / the fact that max of expectations ≥ expectation of max. Key: it requires (a) costless
  evidence, (b) the subsequent decision is made by maximizing conditional expected
  utility given the actual posterior (no precommitment problems, no dynamic inconsistency),
  (c) the utility function is defined over outcomes not over acts-with-knowledge (no
  "curiosity" or "willful blindness" utilities), (d) you can''t be surprised by a
  change in the decision problem itself.


