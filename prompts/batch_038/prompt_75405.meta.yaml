  Role: Director of curriculum and materials review for a network of ~35 independent
  Islamic day schools in the U.S. — publishes its own high-school science sequence
  (chemistry, physics, biology) and its own teacher handbook; a volunteer religious-review
  board (three ʿulamāʾ-trained members) signs off; teachers are not philosophers;
  parents raise questions; the friend is a philosopher of science.


  Frequency/stakes: roughly 40–60 flagged items per academic year — sentences in drafts,
  questions from students, parental complaints, and two or three per term that reach
  the board. Each teacher has maybe five minutes during a class to answer a student
  question; reviewers have ~20 minutes per flagged sentence.


  Deliverable: a triage procedure with ordered tests: e.g., (1) is the sentence making
  a claim about metaphysical necessity, or only about observed regularity? (2) does
  it attribute to a created thing a power that survives independently of God''s action?
  (3) would the sentence, taken by a fifteen-year-old, license the inference that
  practice/science is unreliable? (4) does it belong to the domains Ghazālī exempted
  (logic, mathematics, astronomy, and the observed content of physics) rather than
  to metaphysics? (5) does it describe a departure from the custom (miracle) — and
  if so, what may be said about it? Plus stop/escalate rules: where the question is
  not about description but about piety or doctrine, hand it to the board; where the
  question is a theodicy question, the procedure should decline.


  Worked applications: (a) a chemistry textbook line asserting that the oxidizer in
  a reaction drives the combustion, with a marginal note from a reviewer wanting it
  changed to say God burns the fuel; (b) a parent''s objection to teaching meteorology/disease
  models rather than relying on prayer — or a student asking whether studying medicine
  is pointless; (c) a case where the procedure gives an answer the asker won''t like:
  e.g., a physics chapter''s claim that a law holds necessarily / that the universe''s
  regularities are exceptionless — and the procedure says the network must flag its
  own most pious-sounding slogan, or says that a beloved classroom phrase ("God could
  have made the fire not burn") must be withdrawn from the elementary grades because
