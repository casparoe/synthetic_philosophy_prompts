  inertia, and that it has been solved to a degree the wider debate has never acknowledged:
  circumscription, Sandewall''s occlusion-based treatments, successor-state axioms,
  the event calculus as Kowalski and Sergot formulated it and Shanahan and Miller
  extended it, all with known results and known residual limits (concurrency, continuous
  change, non-deterministic effects, and the Yale shooting problem as the standing
  cautionary case). On her view, the philosophers simply stopped reading the technical
  literature sometime in the mid-1980s and kept arguing with a straw formalism.


  My second reader builds behavior-based robots. His position is that the whole difficulty
  was an artifact of the sense-model-plan-act architecture that generated it: if a
  controller is a set of coupled layers in continuous interaction with an environment,
  there is no central store of world-descriptions to keep in register with the world,
  and therefore no frame to write axioms about. For him the technical solutions are
  not solutions but elaborations of the mistake, and the fact that the field "solved"
  the problem by the end of the 1980s while its systems still could not cope with
