  I direct a graduate seminar on the epistemology of aesthetic judgement, and this
  term I have been unable to dispose of an argument that a colleague raised in comments
  on a draft of my own work. I have since rebuilt it as carefully as I can — partly
  because I wanted to refute it properly, and partly because I now find that I agree
  with more of it than I expected to. The trouble is that its conclusion is one I
  am certain I should not accept, and I cannot locate the step at which it goes astray.
  Here is my reconstruction:


  (1) A judgement attributing an aesthetic property to a work — that a passage is
  delicate, that a façade is ponderous, that a novel is sentimental — is warranted
  for a subject only if that subject is acquainted with how the work strikes a suitable
  perceiver; the acquaintance is what the judgement answers to, and in its absence
  there is nothing for the ascription to attach to.

  (2) Acquaintance with how something strikes a perceiver consists in having an experience
  of a certain character. It is not a matter of standing in any relation to a proposition.

  (3) Testimony transmits propositions: what a hearer receives is a content, together
  with whatever epistemic support the speaker''s reliability lends to it.

  (4) So, by (2) and (3), testimony cannot transmit acquaintance; and so, by (1),
  testimony cannot warrant an aesthetic judgement for its recipient. No one has ever
  known, on the strength of a review, a recommendation, or a lecture, that a work
  is elegant, garish, or profound.

  (5) Nothing in (1)–(4) mentions art. The reasoning requires only that the property
  ascribed be one whose ascription is answerable to how things strike a suitably equipped
  perceiver. Every such property — funny, delicious, harrowing, nauseating, exhilarating
  — therefore lies beyond the reach of testimony for the same reason.

  (6) That consequence cannot be absorbed. It entails that the friend who warns me
