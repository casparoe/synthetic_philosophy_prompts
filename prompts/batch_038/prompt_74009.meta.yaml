  That''s a very nice crux: what''s the epistemic status of a philosophical argument
  premised on an unproven conjecture? It parallels debates about "if physicalism is
  true, then..." — but the deeper point is that complexity theory''s philosophical
  payoffs are conditional on open conjectures, and that NP-completeness itself is
  proven. Also there''s a distinction students miss: NP-completeness (proven) vs P≠NP
  (conjectured); the philosophical work is often done by the *proven* part (thousands
  of problems are interreducible, so hardness propagates) while the *conjectured*
  part (that this hardness is real, not just apparent) does the rest. A student who
  says "NP-completeness shows these problems are intractable" conflates the two.


  Also relevant: "worst-case vs average-case" — NP-completeness is a worst-case notion;
  a problem can be NP-hard and yet easy on all instances that arise in practice (e.g.,
  SAT solvers, protein folding). This is a killer objection to the "complexity theory
  tells us about the real world" move and is under-appreciated: the philosophical
  inference from NP-completeness to "this real-world task is hard" is invalid because
  (i) worst-case ≠ typical case, (ii) the reduction may map real instances to weird
  ones, (iii) approximation/heuristics may suffice, (iv) the resource model (polynomial
  time on a RAM) is an idealization. And Impagliazzo''s "Heuristica" world: P=NP but
  only with useless algorithms... Actually in Heuristica, P=NP but the algorithms
  are inefficient (n^log log n type) — hmm, let me recall: Impagliazzo''s five worlds:

  1. Algorithmica: P = NP (all NP problems easy).

  2. Heuristica: P ≠ NP but NP problems are easy on average (heuristic algorithms
  work well on typical instances) — "P≠NP but not in a useful way."

  3. Pessiland: NP problems hard on average, but no one-way functions — the worst
  world: hard problems but no cryptography.

  4. Minicrypt: one-way functions exist (cryptography possible) but no public-key.

  5. Cryptomania: public-key cryptography possible.

