  social insects, myxobacteria, the volvocine algae, Dictyostelium, ant colonies —
  same numbers, same phylogenies, and each side reads them as obviously supporting
  their view. Worse, the two formalisms people use (the Price/partition approach and
  the contextual-analysis kind of approach) apparently can disagree about whether
  there is group selection in a given dataset, and then there''s an argument about
  which formalism is right, which seems to me like a different argument wearing the
  same coat.


