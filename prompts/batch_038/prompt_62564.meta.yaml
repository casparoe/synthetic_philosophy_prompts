  there''s a factual disagreement here at all, and I don''t think it''s a purely verbal
  one either. I think "unit" is being asked to do at least three separate jobs — what
  gets copied, what interacts with the environment and actually dies, and what the
  adaptation is for / who benefits — and the two camps have quietly picked different
  jobs as the one that matters, and the argument about which job matters isn''t a
  biological question, it''s a question about what an explanation of design has to
