  only things that qualify as units of selection are replicators, and genes are the
  only replicators with the copying fidelity to accumulate complex design; groups
  have heredity that''s far too leaky (groups bud off new groups that don''t resemble
  them reliably, migration swamps between-group variance, within-group selection always
  beats between-group selection because generations of individuals are shorter). On
  the other side — Sober and Wilson and the multilevel people — say that''s just a
  redescription: the Price equation is exact and can be partitioned at any level you
  like, you can always write a group-level covariance term, and whether there''s group
  selection is a question about where the causal action is, not about which description
  is prettier. They point out that the gene''s-eye account of the same case is always
  available, trivially, because it''s just bookkeeping of the same numbers.


