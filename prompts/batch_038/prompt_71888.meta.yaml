  For thirty-five years I was an observational astronomer, and most of my working
  life was spent on selection effects: Malmquist bias in flux-limited surveys, the
  general embarrassment of drawing conclusions from a sample you did not choose and
  cannot see the edges of. Since retiring I have taken up philosophy, and I have been
  reading about anthropic reasoning — the Self-Sampling Assumption and the Self-Indication
  Assumption, and the argument about which of them the Doomsday reasoning and the
  presumptuous cosmologist''s bet depend on. The literature presents this as a choice
  between two postulates, adjudicated largely by which thought experiment''s conclusion
  you find least disagreeable. That is not how I would want a sampling assumption
  justified, and I do not believe the logical space has only two cells in it.


  I convene a small reading group — retired scientists, two philosophy graduate students,
  one statistician — and I should like to hand out a decision tree that sorts us by
  what we actually believe about our own location in the world, rather than by which
  camp we announce ourselves to belong to. Please write it, subject to the following
  conditions.


  Shape. Between six and eight branching questions, each a yes/no or a three-way choice,
  and between ten and fourteen leaves. Label every branch with the claim that separates
  it from its sibling, never with the name of a position. At each leaf give the position''s
  name if it has one, or write "unnamed" if it does not, together with one sentence
  on the most awkward thing its occupant is thereby committed to.


  Answerability. The questions must be answerable by someone who has never read this
  literature. The first three nodes in particular should be phrased entirely in terms
  of cases — an urn of consecutively numbered balls, a subject who wakes without knowing
  how many times she has been woken, a universe whose physical constants permit life
  only in a narrow range — and must not contain the words indexical, reference class,
  self-sampling, or self-indication.


  Branches I want, in whatever order serves the tree.

  1. Whether a complete objective description of the world, plus everything I can
  presently perceive, still leaves it open which of the observers described I am,
  or whether that is no genuine further question.

  2. Whether the collection from which I am supposed to be a random sample is fixed
  by the world, fixed by me, or is scaffolding that a better formulation would dispense
  with.

  3. Whether what gets sampled is whole persons or individual moments of experience,
  and whether some leaf instead samples over everything I could possibly be rather
  than a restricted class.

  4. Whether the mere fact that a hypothesis posits more such observers ought to raise
  my credence in it, before I bring in any of my own particular properties.

  5. Whether adopting a sampling assumption commits me to the Doomsday conclusion,
