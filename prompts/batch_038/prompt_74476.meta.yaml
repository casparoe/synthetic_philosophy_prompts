  Background on disjunctivism:

  - The "highest common factor" (HCF) view: in veridical perception and subjectively
  indistinguishable hallucination, there''s a common mental element; the difference
  is external.

  - Disjunctivism: denies the common factor. Veridical perception is a state in which
  the mind-independent object is a constituent of the experience; hallucination is
  a fundamentally different kind of state.

  - M.G.F. Martin''s version: hallucination is characterized negatively/epistemically
  — it''s a state that is indiscriminable from a veridical perception of such-and-such;
  the subject''s inability to tell is constitutive. "Screening off": in the good case,
  the fact that the object is present screens off the reflective/epistemic property.

  - Objections: (1) hallucinations the subject *can* identify as hallucinations (e.g.,
  insight-preserved Charles Bonnet syndrome, or lucid-dream-like cases); (2) the "causal
  matching" argument — hallucinations caused by the same proximal neural state as
  veridical perception seem to demand a common factor (Robinson, Hawthorne?); (3)
  the argument that a positive account of hallucination''s nature is owed.


  So: design a thought experiment where the disjunctivist is pushed to say the hallucinatory
  state has a *positive* nature shared with the veridical one, or where the epistemic/negative
  characterization fails.


