  ---


  I sit as the lay (non-clinician) member of a hospital ethics committee, and next
  month we''re consulting on a case where a family is refusing to accept a determination
  of brain death. Over the weekend I read a long essay in a general-interest magazine
  that seemed to explain exactly this territory, and I took notes on the passage that
  lays out its argument. It runs roughly as follows:


  "What makes a body alive rather than a mere collection of functioning organs is
  its integration: the parts are coordinated into a single self-maintaining whole,
  and that coordination is the brain''s job. When the entire brain, brainstem included,
  has stopped working for good, integration is gone, and the law accordingly treats
  that cessation as death rather than as an extremely severe injury. The bedside examination
  supports the finding: no pupillary, corneal, or gag reflexes, no breathing drive
  when carbon dioxide rises. Because the brainstem is the switchboard through which
  everything else in the brain communicates with the body, its failure settles the
  question for the brain as a whole. And because the capacities for consciousness,
  thought, and relationship are gone for good, this is not a diminished or diminished-but-real
  form of life; the person has ended. That is also why the protests of some families
  — that their relative is warm, healing, digesting, even, in a few reported cases,
  carrying a pregnancy to term — do not show that anyone is still alive: those are
  functions of organs and tissues, not of the organism. The one place where the logic
  still pinches is donation after circulatory death. There, clinicians wait a handful
  of minutes after the heart stops and then declare the cessation irreversible. But
  ''irreversible'' in that context means only that no one intends to restart the heart;
  a chest could in principle be reopened. Apply the standard honestly and such donors
  are not yet dead when their organs are removed, which makes the practice a quiet
  exception to the rule that we do not kill one patient to save another."


  I''m inclined to agree with most of this — I think the families in the case we''re
  consulting on are being told the truth and that the essay''s basic picture is right
  — but the last paragraph unsettled me, and I noticed that the middle section moves
  very fast. Before I say anything in the room, I want to know how much of that passage
  to trust.


  Please audit it for me. I''m not grading anyone''s prose and I don''t want a bibliography;
  argue from the concepts. Structure your reply with exactly these sections, in this
  order:


  1. **Bottom line** (about 120 words): whether the passage is broadly trustworthy,
  and whether its final claim about donation after circulatory death follows from
  anything true earlier in it.

