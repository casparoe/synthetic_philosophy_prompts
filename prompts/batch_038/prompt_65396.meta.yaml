  "I recently read a long essay in a general-interest magazine about the definition
  of death. It argues that the debate is essentially settled, and the way it lays
  things out is roughly this: ''When the whole brain dies, the body loses the capacity
  to integrate its parts into a working organism, and integration is what separates
  a living body from a collection of organs. That is why the law treats the irreversible
  cessation of all functions of the entire brain, brainstem included, as death, and
  not merely as a very serious injury. The tests used at the bedside — no reflexes,
  no respiratory drive — establish that the brainstem has stopped, and since the brainstem
  is the switchboard on which everything else in the brain depends, its failure settles
  the matter for the brain as a whole. Because the person''s capacities for consciousness,
  thought, and relationship are gone forever, brain death is not a diminished form
  of life but the end of the person. This also disposes of the objection raised by
  families who insist their loved one is warm, growing, and healing: those are functions
  of individual organs and tissues, not of the organism as a whole. The one place
  where the logic still gets uncomfortable is organ donation after circulatory death,
  where doctors wait a few minutes after the heart stops and then declare death irreversible.
  Strictly speaking, they mean irreversible only in the sense that nobody intends
  to restart the heart; if the definition is applied honestly, such donors are not
  dead when their organs are removed, and the practice is a quiet exception to the
  rule that we never kill one patient to save another.''"


