  Design of the piece:


  Genre: excerpt from an administrative/legal manual — the "Blameworthiness Guidelines
  Manual," issued by a fictional "United States Commission on Culpability Adjustment"
  (or "Interagency Commission on the Control Principle"). Sections styled like the
  Federal Sentencing Guidelines: §4B1.1 Base Culpability; §4B1.2 Adjustments for Constitutive
  Luck; §4B1.3 Circumstantial Luck; §4B1.4 Resultant Luck; Commentary/Application
  Notes; a sentencing table; worked examples; a dissenting commissioner''s note.


  Key satirical content (real features to exaggerate):

  1. The Control Principle and its corollary: two agents differing only by factors
  beyond their control must not be assessed differently.

  2. The attempted/completed crime asymmetry (the two shooters; the drunk driver who
  kills a child vs. the one who doesn''t) — the guidelines must equalize, which conflicts
  with ordinary legal practice (attempt punished less).

  3. Constitutive luck: temperament, capacities — adjustments must be made for what
  the agent didn''t choose, which threatens to consume character entirely.

  4. Circumstantial luck: the person who never faced the test (Nagel''s would-be collaborator
  in a country that never occupies) — the guidelines must assess "counterfactual culpability,"
  requiring speculative findings about what the defendant would have done, which is
  both necessary and impossible.

  5. Causal luck: the regression of determination — leading to the vanishing-remainder
  problem: correctly applied, adjustments sum to the whole, and culpability goes to
  zero (Nagel''s shrinking area of genuine agency). The commission''s desperate patch:
  a "residual culpability floor" / a "non-lucky remainder" provision with a minimum
  sentence, defended in commentary by fiat.

  6. The degree vs. scope distinction (Zimmerman): the guidelines can say both offenders
  are equally culpable in degree but the successful one is culpable for more — with
  a table showing "degree" and "scope" columns and a commentary note complaining that
  judges keep converting scope into degree.

  7. The Williams-style dissent: a commissioner arguing that resultant luck is not
  a discount but constitutive of what there is to assess — that the guidelines'' project
  produces a "morally luckless residue" that is also an empty agent; agent-regret
  for the faultless driver; the Gauguin-style case where success retroactively vindicates.
  The dissent should be philosophically serious.

  8. Bureaucratic language: "for purposes of this subsection," "the court shall,"
  cross-references, "Application Note 3," a "Definition" section for "control," a
  footnote about the impossibility of measuring degrees of control ("the Commission
  declines to adopt a numerical scale of control because..."), the discovery that
  the commission must itself be assessed with a discount for its members'' constitutive
  luck.


