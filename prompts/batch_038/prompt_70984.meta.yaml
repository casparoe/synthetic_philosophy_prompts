  largely because a friend of mine who runs a reading group keeps telling me that
  the framework dissolves the problems it''s usually brought in to solve. Here is
  how he explains it, in language he chose for my benefit: a sentence''s meaning is
  a function of two arguments rather than one. The first argument is a world — the
  world you''re standing in when you utter the sentence — and the second is a world
  at which you evaluate what was said. In his words, it''s exactly currying: partially
  apply the first argument and you have the primary intension, partially apply the
  second and you have the secondary intension, and the full two-dimensional intension
  is the unapplied function. He says the matrix diagrams in the literature, worlds
  along one axis and worlds along the other, confirm the picture: a two-dimensional
  semantics is just a lookup table keyed by a pair of world-coordinates, with the
  interesting proposition read off the diagonal.


  From this he draws a deflationary conclusion about Chalmers''s use of the machinery.
  His view is that the zombie scenario is what you get when the two arguments are
  supplied in the wrong order: you pass a world into the slot that expects a context,
  notice that the output changes, and announce that you''ve discovered a gap between
  the physical and the phenomenal. Keep the argument order straight, he says, and
  there is no gap, no two-dimensional argument against materialism, and nothing for
  the philosophy of mind to explain.


  I''d like you to audit the analogy rather than take a side in the metaphysics. Concretely:


  1. Set out the correspondence explicitly; a table is fine. What plays the role of
  the outer function, the inner function, the first argument, the second argument,
  the intermediate value, and the final result? Where do Kaplan''s character and content
  sit in that table, and where do Chalmers''s primary and secondary intensions sit
  — and are those two pairs the same pair of things wearing different names, or different
  things occupying similar positions?


  2. Check my friend''s extraction rule. I''m not convinced that partially applying
  one argument yields the primary intension and partially applying the other yields
  the secondary, given that the diagonal seems to involve the two arguments being
  constrained to be equal rather than either one being held fixed. Tell me what the
