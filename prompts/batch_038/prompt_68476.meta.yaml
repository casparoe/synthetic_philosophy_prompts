  I''ve spent about fifteen years on rationality forums and, more recently, have been
  reading comparative economic history — Braudel and the Annales tradition, plus the
  current crop of big-history books about why some regions industrialized and others
  did not. A recurring argumentative pattern has started to bother me, and I don''t
  have a name for it. I''ll describe it as concretely as I can.


  Someone advances a structural claim: navigable rivers and accessible coal made industrial
  takeoff likely in the regions that had them. I offer a case that looks like a counterexample
  — a region with the same endowment that did not take off for another century. The
  reply is that endowments operate over centuries, so a single region''s lag is well
  within the noise the claim was never meant to exclude; the structure is still there,
  doing its slow work. Fine. But then the same author, a few chapters later, points
  to a specific city where coal, a river, and a takeoff coincide within a single decade
  and calls this a vivid confirmation of the structural account. The grain of the
  claim seems to be selected per piece of evidence rather than fixed in advance: fine-grained
  when the events line up, coarse-grained when they don''t. A second instance: labor
  scarcity after plague is said to explain the loosening of agrarian bondage in Western
  Europe; when I note that the same scarcity was followed by tightened bondage in
  the East, the answer is that the Eastern case shows the structure operating through
  a different mediating variable over a longer period — again, neither the confirming
  nor the disconfirming case is refused, and the claim survives both.


