  Draft:


  "I am preparing a critique of a chapter in a policy collection on immigration and
  the welfare state. The chapter''s central analogy is that a welfare state is a mutual
  insurance pool: contributors pay premiums in the form of taxes and social insurance
  contributions, the pool covers contingencies such as unemployment, illness, disability
  and old age, and admission to the pool is therefore, on the author''s telling, a
  matter of underwriting. The author then runs the analogy hard. Low-skilled or older
  arrivals are described as joining the pool with known, elevated claims risk; the
  state''s inability to observe a migrant''s future earnings trajectory is treated
  as a textbook case of adverse selection; qualifying periods for benefit eligibility
  are defended as the standard waiting period an insurer imposes; benefit entitlement
  conditioned on prior contributions is defended as the principle that premiums must
  be paid before cover attaches; and the whole apparatus is used to reach a specific
  conclusion — that a generous welfare state and open admission are incompatible,
  so that a state may either restrict admission or restrict access to benefits, and
  that doing so is not illiberal hostility to migrants but ordinary prudential management
  of a risk pool.


  I want an audit of this analogy rather than a defence or refutation of the conclusion
  by other means. Please work through the following, in American English:


  1. Set out the correspondence explicitly — a table is welcome. What plays the role
  of the insurer, the insured, the premium, the covered contingency, the claim, the
  pool''s reserves, the underwriter''s assessment, the waiting period, the exclusion
  for pre-existing conditions, and the possibility of exit? Flag every entry where
  the mapping is only approximate or where the source domain has no obvious counterpart
  in the target.


  2. Identify what the analogy quietly imports from insurance practice that a welfare
  state lacks. I am particularly interested in whether it assumes (a) that membership
  is voluntary and can be declined or surrendered; (b) that the premium is actuarially
  linked to the individual''s own expected claims; (c) that the pool''s exposure is
  a fixed fund being drawn down rather than a flow of contributions being replenished
  by a changing population; (d) that the insurer''s central problem is asymmetric
  information about the applicant''s type; and (e) that benefit receipt is a pure
  loss to the pool with no return to the other members.


  3. Distinguish the disanalogies that actually bear on the author''s argument from
  those that are real but idle. In particular, consider whether the adverse-selection
  mechanism survives the fact that a state controls admission and can screen applicants
  as intensively as it likes, whereas a commercial insurer cannot — does removing
  asymmetric information from the picture collapse the analogy at the point where
  the author needs it most, or does it simply convert the argument into something
  else? Consider also whether a pay-as-you-go pension system, in which current contributors
  fund current pensioners, is a risk pool at all, and what follows if the better image
  is a demographic structure whose solvency depends on the ratio of contributors to
  claimants.


  4. Say whether the conclusion the analogy was made to carry — that restricting either
  admission or benefit access is legitimate pool management — survives once the disanalogies
  are on the table, or whether the analogy was doing the justificatory work all along.
  If it fails, indicate whether a weaker version survives, for instance as a claim
  about transitional fiscal costs rather than about legitimacy.


  5. Offer a better analogy, if there is one, for the relation between a welfare state
  and admission policy — and state what it licenses and what it does not.


  Please do not include a bibliography, a reading list, or citations of any kind;
  I want the reasoning, not the sources. Write in American English, and keep empirical
  claims either general enough to be uncontroversial or explicitly marked as contested."


