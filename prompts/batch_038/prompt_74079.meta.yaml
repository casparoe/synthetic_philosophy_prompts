  Last night a friend and I spent four hours arguing about democratic backsliding
  and got nowhere, and I suspect the nowhere is the interesting part. I would like
  a diagnosis of the disagreement itself rather than an adjudication of who is right.


  Here is roughly the terrain. The cases we kept circling were Hungary after Fidesz''s
  two-thirds majority in 2010 and the constitution that replaced the 1949 text, Poland
  after 2015 and the fight over its Constitutional Tribunal, Turkey after the 2017
  referendum converted it to a presidential system, and the United States after the
  2020 election and the January 6 attack, together with the Electoral Count Reform
  Act of 2022. One camp says these are instances of a single pattern: incumbents using
  lawful means to entrench themselves until the electoral playing field is irreversibly
  tilted. The other camp says the label is doing partisan work — that Hungary still
  holds competitive elections, that Poland''s 2023 change of government shows the
  system self-corrected, that Turkey''s opposition still wins cities, and that applying
  the term to the United States stretches it past usefulness and makes it a synonym
  for losing.


  Now my hypothesis, offered as a hypothesis. I think the impasse comes from the fact
  that a backsliding claim bundles three separable assertions that are almost never
  distinguished: a directional one (movement down a scale), a threshold one (a change
  of status, crossing out of democracy), and an agential one (some identifiable actor
  did this on purpose, as opposed to structural drift). My reading of the argument
  is that one side is asserting a directional claim and the other is denying a threshold
  claim, and each hears the other as making the claim it is not making — which would
  make the stalemate at least partly an artifact of a single overloaded word rather
  than of genuine disagreement about the world.


  My friend has a different diagnosis. She thinks the dispute is operational: that
  it is really about which measure is authoritative — V-Dem''s liberal democracy index,
  Freedom House''s aggregate score, or a bare electoral index — and that once a measure
  is fixed, what remains is an ordinary empirical disagreement about trend lines that
  better data will settle.


  Between those two and any other diagnosis you find more convincing, which is it?
  Is this verbal, or is it about thresholds and sorites-style vagueness at the boundary
  of a concept like democracy; is it about baselines — whether a country is measured
  against its own past, against its peers, or against an ideal; is it about the concept''s
