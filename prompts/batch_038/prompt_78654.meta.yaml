  seminar was supposed to be about the methodological status of contrastive explanation:
  whether a question of the form ''why did sustained, machine-based industrialization
  begin in Britain rather than in the Yangzi Delta?'' is well posed at all, given
  that the two sides have to be made comparable before anything can be counted as
  an explanation of the difference, and given that the answer seems to shift depending
  on whether the contrast class is China, all of Eurasia, or every other region in
  the world. A classmate of mine closed the discussion down with a proverb. He said
  that ''necessity is the mother of invention'', and that once you see this the methodological
  worry evaporates: British wages were high and British coal was cheap, so the British
  had a standing necessity to substitute machinery and fuel for labor, and they did
  exactly that; labor in eighteenth-century China was plentiful and cheap, so no comparable
  necessity existed, and nothing comparable was invented. In his telling, that is
  a causal mechanism rather than a narrative, and mechanisms of that kind do not require
  us to settle questions about the well-posedness of contrastive questions.


