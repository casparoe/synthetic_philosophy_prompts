  I am in an advanced undergraduate seminar on the foundations of probability this
  term, and we have just been working through the reference class problem. The assignment
  was to pick a single, specific future event, state its probability, and defend the
  number from frequency data. Two classmates — I''ll call them Marta and Elias — chose
  the same case and argued about it for nearly an hour in the café afterward. I was
  at the next table, took no side, and have tried to reproduce the exchange as accurately
  and evenhandedly as I can.


  The case: Elias''s grandmother, 78, diabetic, is deciding whether to undergo a second
  total knee replacement. Elias''s draft assigned a 4% chance of a serious complication,
  taken from a national registry figure for revision knee replacements at her hospital.
  Marta''s draft assigned roughly 15%, taken from the operating surgeon''s own published
  series, which she said was much closer to the relevant class. Their argument went
  beyond the numbers:


  (1) Marta opened by saying the assignment is ill-posed as stated. "The probability"
  of a single event has no determinate value until a reference class is named; since
  the grandmother belongs to indefinitely many classes with divergent frequencies,
  almost any number can be produced by choosing a class, so the exercise rewards motivated
  selection rather than inference.


  (2) Elias replied that there is a standing rule for this — roughly, use the broadest
  class for which you have reliable frequency data — and that in practice the choice
  is disciplined: you begin with the registry figure and refine only where refinement
  is statistically supported.


  (3) Marta said "broadest" is not well-defined, because the candidate classes form
  a lattice rather than a chain: all revision knee replacements, all knee operations,
  all orthopedic procedures, all surgical interventions, all medical events. There
  is no unique broadest class, only a direction of widening; and in any event the
  broad class ignores precisely what we know matters (her age, her diabetes), so using
  it is knowingly wrong.


  (4) Elias said then refine, but with a stopping rule: refine only while the subclass
  still has enough members that its frequency is not swamped by sampling noise. He
  noted that the surgeon''s series, at 41 successes out of 43, was small but usable,
  and that the other end of refinement is clearly unusable — the class consisting
  of this operation alone has a frequency of either 0 or 1 — so a principled stopping
  point both exists and is needed.


  (5) Marta said a sampling-noise rule is a rule about how well we can estimate a
  frequency, not about which frequency is the true probability of this case. Two classes
  can each be well estimated and disagree, and nothing internal to the frequency account
  arbitrates. She added that the surgeon''s series is worse than small: the surgeon
  selects which patients to operate on, so her series is a filtered class, and a 78-year-old
  diabetic is exactly the profile a surgeon might decline — meaning the frequency
