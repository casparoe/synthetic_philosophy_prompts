  Argument-proves-too-much on Judy Benjamin: tests technical reasoning; self-contained;
  but domain-niche for small models (they may not know Jeffrey conditionalization
  at all). I can define it in the prompt though: "Jeffrey''s rule: when you become
  uncertain about E itself but certain of conditional probabilities P(H|E), you update
  by P''(H) = Σ P(H|Ei)P''(Ei)." Then the argument: (1) Rational updating must be
  determined by your evidence. (2) In the Judy Benjamin problem the "evidence" is
  a conditional probability assignment which does not determine a unique posterior
  unless you add an extra constraint (like minimal change / rigidity). (3) Any such
  extra constraint is arbitrary — not required by the evidence, and different constraints
  (Blyth, Wagner, minimization of relative entropy vs. something else) yield different
  answers. (4) So rational updating is not determined by evidence. (5) But if evidence
  doesn''t determine belief, there''s no fact about rational belief — i.e., permissivism
  / or worse: probabilism fails. (6) Therefore ... The "proves too much" is that it
  would show ordinary Bayesian conditioning is equally arbitrary (because the "rigidity"
  assumption in Jeffrey conditioning is also an assumption), or that all updating
  is arbitrary. This is nice but requires serious technical sophistication and a model
  without search would need to know the literature; also risk of a wrong answer that''s
  hard to evaluate. Also the instruction says avoid super-niche ideas. Judy Benjamin
  is niche-ish, but the type allows self-containment. Hmm.


  Argument-proves-too-much on interpersonal comparisons: I like this. Premises are
  general, and the conclusion (that all redistribution/welfare economics is unscientific,
  or that utilitarianism is meaningless) is absurd-ish. The diagnosis involves: equivocation
  between "not empirically verifiable" and "meaningless"; scope shift between "cardinal
  measurable comparisons" and "any claim about relative well-being"; the fact that
  rejecting comparisons doesn''t leave you comparison-free (Pareto, social welfare
  functions, and even the claim "it''s better to help A than B" involve comparisons
  or at least value judgments); the "proves too much" step: if unverifiable → meaningless,
  then claims about other minds, counterfactuals, etc., are meaningless; and the empirical
  claim that we do make reliable comparisons (Sen: we do compare, e.g., "he is better
  off than her" is used in ordinary and clinical reasoning; also the argument from
  the possibility of empathetic imagination). Plus the pricing: what do you pay for
  rejecting premise X — Robbins'' positivist verificationism is a big cost to keep;
  if you drop it you need an account of the epistemology of other minds; if you keep
  non-comparability you must accept that redistribution can''t be justified economically
  (and must rely on non-utilitarian grounds), which is a real cost.


