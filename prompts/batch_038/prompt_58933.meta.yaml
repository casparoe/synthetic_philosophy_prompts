  Alternative: make the summary about a *conceptual* framework rather than about law:
  a popular bioethics book''s summary of the "acts/omissions distinction," the doctrine
  of double effect, and Rachels'' counterexample, plus a conclusion that the distinction
  between euthanasia and palliative sedation collapses. Errors to plant:

  1. Conflating "the bare distinction between killing and letting die does no moral
  work" (Rachels'' actual thesis) with "killing and letting die are always morally
  equivalent" (much stronger; Rachels explicitly denies that other features—intention,
  consent, motives—can matter, and he holds killing can be worse or better in particular
  cases for other reasons).

  2. Treating the Smith/Jones case as a *proof* rather than as a challenge to the
  burden of proof / an argument that the distinction needs a further rationale.

  3. Misdescribing the doctrine of double effect: claiming DDE permits only foreseen-but-unintended
  bad effects, so a doctor who foresees that morphine hastens death is fine, but claiming
  DDE therefore permits *intending* relief by means of death... no. A subtle misdescription:
  "DDE says an action with two effects is permissible if the good effect is intended
  and the bad is merely foreseen, so terminal sedation is permissible but so is any
  treatment that foreseably kills — which means DDE can''t distinguish anything."
  Or the classic subtle error: saying that DDE makes intention the *only* thing that
  matters, or that under DDE "it''s permissible to kill if you don''t intend the death"
  (which confuses intention with the means/end structure). Another good planted error:
  conflating "intending" with "desiring"/"foreseeing" — saying that since doctors
  giving palliative morphine *want* the patient to die (some do), the DDE excuse fails,
  whereas DDE is about intention not desire.

  4. Conflating voluntary with non-voluntary euthanasia: "if Rachels is right that
  killing isn''t worse, then there''s no reason not to euthanize patients who can''t
  consent." That ignores that Rachels'' equivalence thesis concerns the killing/letting-die
  axis, not the consent axis — a nice scope-shift error, which is the kind of subtle
  misrepresentation wanted.

  5. Perhaps: "the distinction Rachels attacks is the same one that underlies the
  legal prohibition on assisted suicide, so his argument settles the legal question"
  — ignoring that law can rest on other grounds (slippery slope, verification, symbolic
  value, physician integrity).

  6. A technical term used in its everyday sense: "double effect" or "passive euthanasia"
  — e.g., the summary uses "passive euthanasia" loosely to include withdrawing treatment
  the patient refuses, whereas refusal-based withdrawal is often analyzed as honoring
  autonomy rather than as euthanasia at all (a contested classification; the AMA''s
  1973 statement that cessation of extraordinary means is not euthanasia; and Beauchamp
  & Childress''s argument that "letting die" by honoring refusal isn''t euthanasia).
  That''s a good "conflation of two claims the view keeps apart."


