  Proposal: The essay argues that the two-bitser does more work than is usually credited,
  but in a direction that undercuts Dennett''s use of it. Specifically:


  Thesis: The dispute over intrinsic vs. derived intentionality is standardly framed
  as a question about what kind of property aboutness is. But the two-bitser is actually
  a test about the modal profile of content ascriptions: whether a content ascription
  to a physical state survives transporting the state to a new environment (Bolivia)
  or a new interpretive community. Call this the relocation test. Then:


  1. For Dennett, the state fails the relocation test: what it is about changes with
  the environment, so there''s no intrinsic content, and hence "original" intentionality
  — supposedly non-derivative — turns out to be just as context-sensitive as derived
  intentionality. The distinction collapses.


  2. But the relocation test is not a test for intrinsic content; it''s a test for
  externalist content. Standard externalist semantics (Putnam/Twin Earth, Burge) already
  predicts content shifts under relocation, and nobody thinks that shows content is
  not real or is merely derived — Twin Earth is a claim about the determination base
  of content, not about the ontological status of aboutness. So the two-bitser, on
  the externalist reading, is consistent with Searle''s intrinsic intentionality:
  a state can have non-derived aboutness and still have that aboutness fixed partly
