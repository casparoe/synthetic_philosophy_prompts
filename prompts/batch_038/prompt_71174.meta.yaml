  Draft essay:


  Title: "The Two-Bitser and the Relocation Test: What Survives of Intrinsic Intentionality"


  §1. Setup. Searle''s Chinese Room conclusion: syntax isn''t semantics; the man and
  the room manipulate symbols without any of them being about anything; whatever intentionality
  the system has is derived, borrowed from us, like the aboutness of the words on
  a page. Underlying the argument is a distinction: some states are about things in
  their own right, and others are about things only because somebody treats them as
  being about those things. Dennett''s counter-device: a two-bitser, a coin-sorting
  gadget with two states, one of which goes off in the presence of a coin the machine
  can''t distinguish from a US quarter. Ship the same machine to Bolivia and the very
  same state becomes a detector of local coins: nothing inside the device changed,
  and nothing about the causal history of its construction changed, yet the natural
  thing to say is that what the state is about has changed. Dennett''s lesson, as
  usually reported: there is no such thing as intrinsic aboutness, and the original/derived
  distinction is a myth — all intentionality is derived, ours included.


  §2. My claim. The two-bitser is doing something narrower and more interesting than
  it''s credited with, and once you see what, it stops being an argument against Searle.
  The device is being used as a test: does the content ascription survive relocation
  to a new environment? Call this the relocation test. The assumption behind its use
  as a refutation is that a state with genuine, underived aboutness would pass the
  relocation test — its content would travel with it, being owed to nothing but what
  the state is in itself.


  §3. But that assumption is just the denial of externalism, and externalism is not
  what''s at issue. Twin Earth cases make exactly the same point about the relocation
  test: what Oscar''s "water" thought is about depends on which substance his community
  is embedded in, and relocating him changes the content. Nobody concludes that Oscar''s
  thoughts are therefore not really about anything, or that they are about something
  only because an interpreter takes them to be. Externalism is a claim about the determination
  base of content — where the facts that fix content live — not a claim about the
  ontological standing of content. So a two-bitser whose aboutness shifts with its
  environment is perfectly compatible with its aboutness being underived. If Dennett''s
  argument is read this way, it is a refutation of internalism about content, which
