  The core of Brouwer''s reasoning is that in 1913 nobody knew whether that digit
  pattern occurred infinitely often in pi''s digits, so asserting there''s definitely
  a fact of the matter either way assumes every mathematical question is in principle
  solvable — a "no ignorabimus" optimism Hilbert held that Brouwer rejects. Brouwer
  thinks some statements might be neither provable nor refutable constructively, so
  you can''t assert P or not-P without an actual method to decide which holds.


  Under BHK semantics, asserting P∨¬P requires an actual proof of one side, and lacking
  that in principle means the disjunction isn''t justified — so believing both "the
  pattern exists" and "it doesn''t" must be resolvable one way or another is itself
  assuming general solvability, when really there might be no proof of either forever
  without that being a contradiction. This is exactly what his weak counterexample
  method exploits.


  The distinction between "we have no grounds for asserting P∨¬P" and "P∨¬P is false"
  is subtle but crucial to intuitionistic logic — a good answer needs to capture that
  the weak counterexample doesn''t refute excluded middle outright but shows we''re
  not entitled to assert this particular instance without a decision procedure. I
