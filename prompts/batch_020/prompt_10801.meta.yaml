  I recall Lewis''s "Humean Supervenience Debugged" and the Big Bad Bug: chances are
  fixed by the best-system pattern across all of history, past and future, so a chance
  distribution can assign positive probability to futures that would, if actual, change
  what the best system (and hence the chances) were. That conflicts with the Principal
  Principle, since information about the actual future course of history seems relevant
  to what the chances were, yet PP treats such future-facing information as inadmissible.


  Lewis''s fix was his "New Principle," conditioning credence in A on the history
  up to t plus the entire chance function at t (rather than just the chance of A),
  which sidesteps undermining since the whole chance distribution is already built
  into the admissible evidence. I recall later literature, including Ned Hall''s "Correcting
  the Guide to Objective Chance" and work by Ismael, Meacham, and Arntzenius & Greaves
  on time-reversal symmetry, pushing further on these undermining worries.


