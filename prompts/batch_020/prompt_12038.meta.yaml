  Williams distinguishes internal reason statements, which hold only if the agent
  has some motivation in their subjective set that deliberation could connect to the
  action (this set can include desires, values, loyalties, projects—not just selfish
  wants, and it''s revisable through learning facts or reasoning), from external reason
  statements, which are supposed to apply to an agent regardless of their motivations,
  even after any possible correct deliberation. Williams is skeptical that external
  reason statements make coherent sense.


  I''m thinking through his argument that when we try to specify what could make an
  external reason claim true, it collapses: the only way such a claim can move someone
  to act is by first becoming an internal reason through belief, but if that conversion
  never happens through sound deliberation, the claim seems to just be smuggling in
  "A ought morally" or "it would be good," conflating reasons with values. He illustrates
  this with the case of a scoundrel with no motivation to be considerate—externalists
  want to insist the scoundrel still has a reason to be nice, but Williams thinks
  this only makes sense as an ethical demand, not a genuine reason claim.


  I''m noting how his internalist framework still leaves room for what look like external
