  Bayesian confirmation theory runs into a paradox here: if E is old evidence with
  P(E) = 1, conditionalizing on E can''t shift P(H), so E can''t confirm H by the
  standard positive-relevance measure — yet historically physicists treated the Mercury
  result as powerfully confirming GR. I''m recalling Garber''s 1983 proposed resolution,
  which locates the problem in the idealization of logical omniscience built into
  standard Bayesian epistemology, where rational agents are assumed to assign probability
  1 to all logical truths and treat equivalent statements identically.


  Garber suggests modeling the scientist''s beliefs in a less idealized, non-omniscient
  framework where deriving that H entails E is itself substantive new information
  — since the derivation from Einstein''s theory to the perihelion result was genuinely
  hard, the scientist couldn''t have already had credence 1 in that entailment. So
  when they finally work out the derivation, learning "H entails E" is new and can
  be conditionalized on, raising credence in H even though E itself was already certain.


  The main worry, raised by Earman and others, is that it''s unclear how to build
  a coherent "logic of partial belief" that lets agents be uncertain about logical
  relationships while retaining enough deductive structure for probability theory
  to still function — relaxing logical omniscience just enough, but not too much,
  turns out to be arbitrary and technically messy. Critics also argue this move just
  shifts the confirmation problem onto explaining the discovery of the entailment
  itself.


  The counterfactual strategy takes a different tack, considered by Howson and discussed
  in Earman''s work: instead of using the agent''s actual current credences (where
  P(E)=1 already), it asks what a rational agent''s credence in H would have been
  under a hypothetical prior, had they not yet learned E, then computes confirmation
  from that counterfactual update — sidestepping the problem of old evidence entirely.


