  I should nail down the actual history properly. The Problem of Old Evidence traces
  back to Clark Glymour''s 1980 "Theory and Evidence": since Bayesian confirmation
  requires P_t(H|E) > P_t(H), but if E is already known with certainty (P(E)=1), conditionalizing
  on E can''t raise H''s probability at all, since P(H|E) collapses to P(H) trivially
  — which seems wrong since old evidence like Mercury''s perihelion clearly did confirm
  general relativity.


  This is what''s known as the problem of old evidence. Garber''s 1983 solution points
  to logical omniscience as the culprit—standard Bayesian frameworks assume agents
  automatically know all logical consequences of their theories, but real scientists
  don''t. What was actually new for Einstein wasn''t the evidence E itself, but the
  discovery that GR logically entails E, and it''s conditionalizing on that entailment
  fact that should capture the confirmation.


  I recall Richard Jeffrey developed similar ideas around the same time, leading to
  what''s sometimes called the Garber-Jeffrey solution—an approach that preserves
  the conditionalization framework but relaxes the unrealistic assumption of perfect
  logical competence.


