  state space, each with private information partitions, cannot have common knowledge
  of differing posteriors on an event—if their posteriors are common knowledge, they
  must be equal, which gives the famous "rational agents cannot agree to disagree"
  result. I''m mentally reviewing the standard critiques too, particularly how the
  common prior assumption carries most of the theorem''s weight and how disagreement
  becomes trivial once priors diverge.


