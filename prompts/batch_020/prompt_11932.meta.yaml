  1. Will/transfer theories say a promise binds because the promisor exercises a normative
  power to self-obligate, intrinsic to the act itself regardless of reliance or convention.

  2. Convention/practice theories (Hume, Rawls, Hart) treat promising as a valuable
  social practice—invoking the words "I promise" binds you because you''re drawing
  on a shared practice that exists for mutual benefit.

  3. Reliance theories, especially Scanlon''s Principle Fidelity, ground the obligation
  in the wrongness of exploiting expectations you''ve created—it''s about not manipulating
  another''s reasonable reliance, which yields a graded structure where obligations
  can weaken or admit exceptions depending on circumstances.

  4. Other accounts focus on trust relationships (Annette Baier) or on fittingness
  to one''s own character.


  The real philosophical bite here is that a strict will/transfer theory would say
  the promisor is bound to give a fifth of whatever the outcome is worth, however
  huge—that''s the risk they took on, symmetric to the risk they''d bear if it turned
  out worthless. A reliance-based theory would instead ask what the promisee actually
  depended on and lost.


  If the reliance was modest—say, a couple of extra years spent on the project—then
  the fair remedy might be compensation for that specific opportunity cost, not an
  unrelated windfall share. A convention-based theory would instead look to what norms
  of collegial promising in that community would expect, perhaps landing somewhere
  in the middle, since informal "sweat equity" arrangements like this are usually
  formalized before success arrives, and neither party did so here, leaving shared
  responsibility for the ambiguity.


