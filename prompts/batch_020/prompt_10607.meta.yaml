  The axioms are Existence (consciousness is intrinsic and actual), Composition (experience
  is structured into distinctions), Information (experience is specific, selecting
  one state among many possible), Integration (experience is unified and irreducible),
  and Exclusion (experience has definite borders and a definite spatiotemporal grain,
  excluding alternatives).


  Now I''m translating each axiom into a postulate about physical substrates using
  cause-effect power: Existence means a system exists physically if it has cause-effect
  power over its own states; Composition means elements combine into higher-order
  mechanisms, each with their own cause-effect repertoire, so subsets of elements
  can also be candidate mechanisms.


  The information postulate holds that each mechanism specifies a distinct probability
