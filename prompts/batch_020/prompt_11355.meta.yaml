  Let me reconstruct the dogmatism paradox from memory: it traces back to an argument
  Gilbert Harman attributed to Saul Kripke''s unpublished 1963 Princeton lecture,
  discussed in Harman''s 1973 book "Thought." The argument runs that if I know p,
  then any apparent evidence against p must be misleading (since p is true), and since
  I should disregard misleading evidence, I can therefore ignore any future evidence
  against things I currently know.


  This generalizes into a troubling conclusion: it would license never revising beliefs
  one claims to know, no matter what new evidence emerges - which is paradoxical because
  the premises seem individually sound, yet the conclusion contradicts our sense that
  knowledge should remain responsive to evidence. This matches exactly what I sketched
  earlier about someone dismissing evidence of innocence once they believe they already
  know the truth, so I''m confident in this structure.


  There''s a subtlety in premise 3 though - Harman''s actual phrasing is closer to
  "if I know E is misleading, I can rationally ignore E when I encounter it." His
  resolution seems to hinge on distinguishing between it being true that any real
  counter-evidence would have to be misleading, versus being entitled right now to
  pre-judge any future evidence as misleading without examining it. Knowing p now
  doesn''t mean I know that some particular future experience will be misleading -
