  This morality is as necessary to society''s cohesion as its legal institutions—if
  enough people abandon it, society disintegrates, much as it might from widespread
  lawbreaking. Devlin''s disintegration thesis thus holds that since a state may act
  to prevent its own destruction, it can criminalize behavior offending shared morality
  even absent identifiable harm, though he constrains this to genuine, deep-seated
  intolerance and disgust (not mere dislike) and insists lawmakers preserve maximal
  individual freedom compatible with social integrity. Hart''s first objection is
  that the disintegration thesis is an unsupported empirical claim, since many societies
  have shifted their sexual and religious morals substantially without collapsing.


  His deeper objection is that Devlin conflates positive morality—what a society''s
  institutions actually embody at a given time—with critical morality, the independent
  standards for judging whether those institutions are good; Devlin wrongly infers
  that offending positive morality justifies suppression, when that positive morality
  may just reflect inherited prejudice. Hart instead adopts Mill''s harm principle
  strictly, holding that only harm to others can justify criminalizing conduct, so
  self-regarding immorality alone is never legitimate grounds for criminal law.


  Devlin might reply that the disintegration thesis doesn''t predict visible collapse
