  The argument runs: since experience presents something that isn''t how the object
  really is, the phenomenal principle implies there must be something the subject
  is aware of that actually has the perceived property (bent, elliptical) — and since
  that can''t be the physical object itself, it must be a sense-datum. Then, because
  illusory experience is continuous with veridical experience (introspection can''t
  pinpoint exactly where a "slightly bent-looking" stick shifts into accurate perception),
  this continuity gets leveraged to extend the sense-datum conclusion to veridical
  cases too.


  Disjunctivists push back by rejecting the phenomenal principle, or restricting it,
  and by resisting the generalization move itself — insisting illusions and hallucinations
  are experiences fundamentally different in kind from veridical ones, even if they''re
  phenomenally indistinguishable from the inside. So for them, illusion''s mere possibility
  doesn''t force the conclusion that veridical perception must also involve sense-data.


