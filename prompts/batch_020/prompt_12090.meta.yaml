  I remember this is discussed in a MIRI technical report, "Tiling Agents for Self-Modifying
  AI, and the Löbian Obstacle" by Yudkowsky and Herreshoff, around 2013. The core
  issue is that a self-modifying AI wanting to only take actions it has proven safe
  runs into trouble trusting a successor system that reasons the same way — essentially
  needing to accept "if my successor can prove X is safe, X is safe" as an axiom,
  which Löb''s theorem shows a consistent system can''t do without already being able
  to prove X directly.


  This creates a regress: each successive agent version needs strictly stronger assumptions
  to trust the next, so they can''t "tile" indefinitely without strengthening axioms
  — this is what''s called the Löbian obstacle to self-trust. I recall the paper proposing
  partial workarounds like parametric polymorphism over proof lengths. I''m fairly
  confident about this general picture, since it''s a well-known topic covered in
  LW posts and AI safety syllabi, but I''ll avoid pinning down the exact publication
