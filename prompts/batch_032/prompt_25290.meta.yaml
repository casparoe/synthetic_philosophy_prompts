  I''m teaching an undergraduate course on rational choice theory and want to give
  my students a diagnostic quiz that sorts them into positions on the paradox of voting.
  The paradox, briefly: in a large election, the probability that any individual vote
  will be decisive is vanishingly small, so the expected instrumental benefit of voting
  seems far lower than the cost of going to the polls — yet millions of people vote.
  The quiz should help students discover which resolution of the paradox their own
  reasoning actually commits them to, before we study the positions explicitly.


  Please write a ten-question sorting quiz. Each question should present a concrete
  scenario (a thought experiment, a vignette, a forced choice) with two or three answer
  options. No question should name a philosophical position or use jargon like "expressive
  voting," "pivot probability," or "rule consequentialism." The questions should probe
  the fault lines that actually separate the major positions: whether the act of voting
  has intrinsic value apart from its effect on the outcome, whether universalization
  gives reasons that act-consequentialist calculation misses, whether regret-avoidance
  is a legitimate basis for decision, whether group membership changes the rational
  calculus for an individual, and whether the sheer magnitude of the stakes can overcome
  a minuscule probability.


  The positions the quiz should sort into are:


  - **Expressive voting**: voting is an expressive act, like cheering or wearing a
  pin; its value doesn''t depend on affecting the outcome.

  - **Ethical-altruistic voting**: the expected utility of voting is enormous once
  you multiply the per-person stakes by the number of people affected, so voting is
  straightforwardly rational even with tiny pivot probabilities.

  - **Duty-based voting**: voting is a civic or moral obligation that doesn''t reduce
  to expected consequences.

  - **Rule-consequentialist voting**: the right question is not "what happens if I
  vote?" but "what if everyone in my situation reasoned the same way?"

  - **Minimax regret**: one should vote to avoid the worst-case regret — your side
  losing by one vote while you stayed home.

  - **Rational-irrationality / ignorance**: people vote because they systematically
  misjudge the probabilities, or because it''s a low-cost action that feels momentous;
  a fully rational agent wouldn''t vote.

  - **Group-agency voting**: individuals vote as members of groups; the group decides
  collectively to turn out, and the individual''s obligation derives from group membership.


  Include a scoring key that maps answer patterns to positions. Some students may
  fit more than one position; the key should acknowledge this and flag which pairs
  of positions the quiz cannot cleanly separate and why. Also note any logically possible
  answer patterns that correspond to no defended position — and briefly say whether
  the combination is incoherent, merely unattractive, or simply underexplored in the
  literature.


  The quiz should be suitable for undergraduates with no background in formal decision
  theory, though they should be comfortable with the idea of expected-value reasoning.
  Write the questions in a clear, engaging style. Respond in the style of an expert
  in political philosophy and rational choice theory. Think very carefully about which
  answer patterns map to which positions before finalizing the scoring key.


