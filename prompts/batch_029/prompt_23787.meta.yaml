  Judgment aggregation: A group of individuals each have a judgment set (a set of
  propositions, each assigned true/false). An aggregation function maps individual
  judgment sets to a collective judgment set. The discursive dilemma (List): consider
  a group voting on three propositions: P (a premise), Q (a premise), and C (a conclusion),
  where P and Q logically entail C (P ∧ Q ⊨ C). Each individual is consistent. If
  the group votes on each proposition by majority (conclusion-based or premise-based),
  the collective judgment set can be inconsistent: P and Q are accepted by majority,
  but C is rejected by majority. This is the discursive dilemma.


  The "discursive dilemma" is specifically about the case where the premises are logically
  related to the conclusion, and the group''s domain is "issue-restricted" (i.e.,
  the set of propositions is closed under the relevant logical relations, or at least
  the logical structure is fixed).


  The main responses/solutions:

  1. **Premise-based voting**: Vote on the premises first, then derive the conclusion.
  This avoids the discursive dilemma but is vulnerable to the "premise selection"
  problem — which premises to vote on is itself a substantive decision, and different
  premise decompositions give different results.

  2. **Conclusion-based voting**: Vote on the conclusion directly. This avoids the
  dilemma but ignores the reasons (the "discursive" content).

  3. **Plurality judgment aggregation / other rules**: Use rules other than majority
  (e.g., judgment aggregation rules that guarantee consistency, like the "plurality
  rule" or "impossible" results).

  4. **List and Pettit''s impossibility theorem**: Under certain conditions (unrestricted
  domain, universal domain, systematicity, independence of irrelevant alternatives),
  there is no aggregation rule that guarantees both individual rationality (consistency)
  and collective rationality (consistency) plus some fairness conditions. This is
  analogous to Arrow''s theorem.


