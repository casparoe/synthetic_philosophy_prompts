  Prompt draft:


  "I''m a handling editor at a mid-tier interdisciplinary journal (we publish a lot
  of complex-systems, physics-adjacent biology, origin-of-life stuff) and I swear
  half the manuscripts I send out for review lean on the word ''emergent'' in one
  of two dodgy ways: either it''s a placeholder for ''we don''t know how this works
  yet,'' or it''s quietly doing metaphysical work the authors never defend -- like
  claiming the phenomenon is in principle not derivable from the micro level, when
  all they''ve shown is that we currently lack the derivation. Meanwhile I get the
  opposite move too: reviewers dismiss whole lines of work as ''not fundamental''
  because in principle it should reduce to chemistry/physics and so supposedly isn''t
  a real level of explanation.


  I want a procedure I can actually run when triaging a manuscript -- I have maybe
  twenty minutes per paper and no committee to consult, it''s just me deciding whether
  it goes out to review and who to send it to. Ground it in what philosophy of science
  actually has to say about reduction and emergence: the difference between reduction
  as successful derivation (like getting thermodynamics out of statistical mechanics,
  which arguably succeeded once you fix the details with things like thermodynamic
  limits) vs reduction as a promissory note, and the distinction between weak emergence
  (you can in principle compute your way up from the micro level, it''s just intractable
  or you need the right higher-level description to see anything) and strong emergence
  (the micro facts plus the laws just don''t fix the macro facts). The procedure should
  tell me, in order, what questions to ask about a manuscript, what counts as an answer,
  and which outcomes mean ''fine, the emergence talk is harmless shorthand,'' which
  mean ''flag this for the reviewers -- the authors owe us an argument,'' and which
  mean it''s actually a substantive empirical claim that deserves attention rather
  than suspicion.


  Then run it on three manuscripts I''m plausibly going to see: (1) an origin-of-life
  paper arguing that life is an emergent phenomenon so we shouldn''t expect to reconstruct
  it from prebiotic chemistry step by step, and that they should get funding for searching
  for general principles instead; (2) a paper on flocking/superconductivity-type stuff
  that uses ''emergent'' roughly the way physicists do and might be using it perfectly
  legitimately; and (3) a consciousness-adjacent paper claiming strong emergence to
  get around the explanatory gap. Tell me honestly where my twenty-minute procedure
  runs out -- where the distinction between ''intractable'' and ''in principle impossible''
  just isn''t decidable by an editor, and I''m making a judgment call dressed up as
  a step in the flowchart. Also be honest if the procedure is going to say yes to
  something I''ll be tempted to reject on vibes."


