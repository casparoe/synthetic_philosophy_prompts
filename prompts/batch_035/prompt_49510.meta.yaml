  an initial string, a handful of rewrite rules, and a target string, derive the target.
  The trick, it turned out, was that the target was underivable, and the way to see
  that was to stop applying the rules and ask what they preserve: the rules happened
  to conserve a certain arithmetic property of the string (a count of one of the letters,
  modulo 3), the start string had one value of it and the target another, so no sequence
  of moves could ever work. The insight came not from being better at the game but
  from stepping outside it. A second instance: arguments that only end when someone
  stops contesting the object-level question and instead attacks a shared framework
  assumption that generated the dispute. A third is the mirror image of the first:
  sometimes standing outside shows you not that the task is impossible but that you''re
  using the wrong representation, and the winning move is to change the rules you
  work under rather than follow them better.


  So: does the general move — leaving the system in which a problem is posed, either
  to prove it has no in-system solution or to replace the system — have a name? Gödel
  is my nearest landmark, but his theorems are results about formal systems, not a
