  So: write an essay on whether Goodhart''s law, properly understood, actually explains
  the Wells Fargo scandal. Weigh the case for and against, and defend a verdict rather
  than ending on "it''s a bit of both."


  Here are the facts I want the essay to take as given, so nothing turns on looking
  anything up: between roughly 2011 and 2016, Wells Fargo employees opened millions
  of accounts and issued credit cards and debit cards that customers never asked for,
  in order to meet daily sales quotas that a 2013 Los Angeles Times investigation
  described as mathematically impossible; the bank had a long-standing strategy, inherited
  from Norwest, of selling each customer as many products as possible, at one point
  summed up in a push called "Going for Gr-Eight," meaning roughly eight financial
  products per household; management reported cross-sell ratios to investors as evidence
  of deep customer relationships; when the scandal surfaced in 2016, regulators fined
  the bank $185 million, around 5,300 employees were fired, CEO John Stumpf resigned
  after congressional hearings, and the number of unauthorized accounts was later
  revised upward toward three and a half million, followed by a $3 billion settlement
  in 2020.


  The crux I want addressed: Goodhart''s law in its original, narrow form is about
  regression — once a proxy is targeted, the correlation between the proxy and the
  thing you care about degrades, typically through drift in ordinary behavior. What
  happened at Wells Fargo looks different: employees did not gradually start behaving
