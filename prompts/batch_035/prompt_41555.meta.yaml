  Draft:


  "I teach philosophy of mind, and every year the Chinese Room comes up in seminar
  and produces more heat than light. I want to force my students to move from trench-digging
  to actual credences. Please give me your credence — a number, not ''it depends''
  — that Searle''s Chinese Room argument, in its strongest form, establishes its conclusion,
  where I want to fix the conclusion precisely: not that no machine could ever think,
  but that the running of a program with the right input-output profile is not by
  itself sufficient for understanding — computationalism about the mind is false.
  Decompose the credence: (1) the probability that the intuition the room pumps —
  that the man shuffling symbols understands nothing — is tracking a real fact rather
  than a cognitive illusion about where understanding should be located, given what
  we know about how intuitions fail elsewhere; (2) the probability that the derived-vs-intrinsic
  intentionality distinction can be made non-question-begging; (3) the probability
  that the systems reply fails even for the augmented room Searle imagines (the man
  memorizing the rulebook and internalizing the whole system); (4) whatever other
  terms belong. Give each a number and a one-line justification, then combine. Then
  tell me which term carries the most weight and what would move it — and which term
  you''d tell a student is most likely to be the location of the whole dispute, since
  students who think the argument obviously works and students who think it obviously
  fails usually turn out, on inspection, to be disagreeing about that one term."


