  "(a) Two principles do the work. First, Nicod''s criterion: a hypothesis of the
  form ''All F are G'' is confirmed by any F that is found to be G, and refuted by
  any F that is found not to be G. Second, the equivalence condition: whatever confirms
  a hypothesis confirms anything logically equivalent to it. ''All ravens are black''
  is logically equivalent to its contrapositive, ''All non-black things are non-ravens.''
  A white shoe is a non-black thing that is a non-raven, so by Nicod''s criterion
  applied to the contrapositive the shoe is a confirming instance of it, and by the
  equivalence condition it is therefore a confirming instance of H. This was all worked
  out in Hempel''s ''Studies in the Logic of Confirmation'' (1945).


  (b) Hempel''s own view was that the result is correct: the white shoe really does
  confirm H. He thought the appearance of paradox is a psychological illusion. When
  we judge that the shoe is irrelevant, we are tacitly adding background knowledge
  — e.g. that ice contains no sodium salt in his analogous case [wait — should the
  student mention the sodium salt case? that would be a correct sophisticated touch;
  fine] — and once that extra information is bracketed, the paradoxes vanish. So for
  Hempel the ''paradox'' is only apparent, and the right reaction is to accept the
  white-shoe result.


  (c) The Bayesian diagnosis agrees that the shoe confirms, but adds that the amount
  of confirmation depends on background knowledge. Since non-black things vastly outnumber
  ravens, sampling a non-black thing at random and finding it not to be a raven only
  marginally lowers the probability that some non-black thing is a raven, so the confirmation
  of H is real but negligible. Importantly, this holds whatever our background knowledge
  happens to be: the white shoe always confirms H at least a little, never disconfirms
  it. Since the shoe result is what created the paradox in the first place, and the
  Bayesian treatment shows Nicod''s criterion was refuted by it, Nicod''s criterion
  has to be abandoned as a general account of confirmation. A parallel with Goodman''s
  grue makes the point vivid: the grue problem is just the raven paradox in predicate
  form — the same problem about when positive instances confirm. One way out is Quine''s
  idea of restricting confirmation to natural kinds, which Hempel also adopted in
  response to Goodman; but that restriction looks ad hoc, and in any case the Bayesian
  framework already gives us everything we need."


