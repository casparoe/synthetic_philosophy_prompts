  I''m a PhD student working on social/practical epistemology, and I''m trying to
  work out whether the Iraq WMD episode is a good test case for pragmatic encroachment
  or whether I''m forcing it. Help me think this through.


  Quick facts so we''re on the same page: in 2002-03 the US and UK governments claimed
  to know Saddam had active WMD programs and stockpiles. The public evidence was Colin
  Powell''s UN presentation (satellite imagery, intercepted calls, the aluminum tubes
  that were supposed to be centrifuge parts, accounts from defectors like the source
  later known as Curveball, drawings of mobile bioweapons labs). The internal record
  was messier — some analysts at the Energy Department thought the tubes were probably
  for conventional rockets, and a couple of people raised doubts about Curveball,
  but those doubts never made it up to the top-level claims. After the invasion the
  Iraq Survey Group found no stockpiles and no active program, so the "knowledge"
  was flat false. That''s the common-knowledge version; I''m not trying to adjudicate
  who lied, I want the epistemology.


  The theory: pragmatic encroachment (Fantl & McGrath, Jason Stanley''s version) says
  whether a subject knows that p depends in part on what''s at stake for them in acting
  on p and on their practical options. The standard intuition pump is the bank cases
  — same evidence, different costs for being wrong, and we''re inclined to say the
  subject knows in the low-stakes case but not the high-stakes one. Contextualism
  (DeRose etc.) instead says the truth of "S knows that p" shifts with the attributor''s
  conversational context — how the error-possibilities are being made salient.


  So the naive application: the stakes couldn''t have been higher — a war. So the
  bar for the administration knowing there were WMDs should have been about as high
  as bars get, and by encroachment lights they plainly didn''t clear it, so the "we
  know" claims were false at the time, not just falsified later. That''s the tidy
  story I want to complicate, and here''s where I''m stuck:


  1. Who is the knowing subject? Powell said "we know" but Powell himself hadn''t
  seen most of the raw intelligence — he was relying on the system. The encroachment
  literature is almost entirely about individuals; does the stakes-sensitivity apply
  to a distributed institutional believer whose "evidence" is whatever survives an
  aggregation process that has already been shaped by the decision it''s supposed
  to inform? It looks like the practical interests operated backwards: instead of
