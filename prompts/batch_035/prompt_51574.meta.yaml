  "I''m writing an essay on Bernhard Schlink''s The Reader and want to read it against
  Jaspers'' postwar typology of guilt rather than the usual vague talk of inherited
  German guilt. In The Question of German Guilt, Jaspers distinguishes four kinds:
  criminal guilt, for concrete deeds, judged in court; political guilt, which every
  citizen shares in the liability for what one''s state does; moral guilt, for what
  one is individually answerable for before one''s conscience and one''s peers; and
  metaphysical guilt, the guilt of those who survived while others were murdered,
  for which there is no human judge. Where do the novel''s central figures fall? Hanna
  commits criminal acts at the camp, yet the novel builds her trial around her admitting
  to a report she was illiterate and could not have written — does Schlink deliberately
  muddy criminal with moral guilt, and does that muddying pull toward exculpation
  or toward showing how inadequate legal guilt is? Michael''s silence at the trial
  — he knows something that could change the verdict and says nothing — looks like
  a clean case of moral guilt, but his later shame seems larger than that act: he
  belongs to the generation born during the war, and the novel''s famous framing question
  is whether the children can both condemn and understand their parents. Can someone
  who never stood by while the crimes happened bear Jaspers'' metaphysical guilt at
  all, or does the novel show the second generation feeling a guilt that has no place
  in the typology — and is that feeling genuine guilt, or the narcissism of vicarious
  guilt that the novel has also been accused of? I want a reading that takes both
  the novel and the typology seriously, says plainly where Jaspers'' categories illuminate
  Hanna''s and Michael''s situations and where the novel resists them, and ends by
  saying what the novel contributes to the question of whether a nation can be guilty
  across generations that Jaspers, writing in 1946 for contemporaries, could not."


