  (2) Whatever unifies the constituents must relate them, and relating is something
  only a relation can do.

  (3) So a further relation R* must relate R to a and to b. But R* itself is just
  one more constituent, and now it too needs relating — and so on without end.

  (4) A regress is vicious when the task is never completed; unification is a task
  that either gets done at some level or never gets done at all.

  (5) So nothing is ever unified: no propositions, no states of affairs, no facts.

  (6) But every truth is true in virtue of something, and that something would have
