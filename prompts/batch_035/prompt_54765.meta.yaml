  ---


  For a year my metaphysics reading group has been stuck on counterpart theory versus
  transworld identity, and I''ve started to suspect that our problem is not the arguments
  but the shape of the disagreement itself. Here is where we are.


  Everyone knows the moves. Lewis holds that nothing exists in more than one world:
  a de re modal claim about Humphrey says that some world contains someone relevantly
  resembling Humphrey who wins the election. Kripke''s complaint — that this makes
  our modal claims about Humphrey into claims about somebody else — was met by Lewis''s
  response that the translation preserves truth-conditions, so nothing is "about somebody
  else" that needs to be Humphrey himself. Formal work (most influentially by Fara
  and Williamson) appears to make good on this: on a careful translation, counterpart
  theory and Kripkean semantics validate the same formulas even once claims about
  actuality are included. Kaplan, meanwhile, showed how to have genuine transworld
  individuals — by proxy, with haecceities doing the tracking — which suggested that
  whatever the two camps want, each can have. So the formal scorecard reads: notational
  variants.


  And yet the seminar still fights. The counterpart side insists that the framework
  reflects the real structure of modality — the counterpart relation is a similarity
  relation, similarity is a natural, even measurable thing (something like choosing
  a distance function), and de re modality just is comparative similarity across worlds.
  The transworld side insists that this conflates metaphysics with pragmatics: whether
  Humphrey might have won shouldn''t be hostage to which similarity metric is contextually
  salient. Two further pressure points never resolve: (1) the counterpart relation
  isn''t transitive — Bob can be Alice''s counterpart in w1 and Carl''s in w2 while
  Alice and Carl aren''t counterparts — and the transworld camp says this can''t be
  right if de re modality is about what things are; (2) cross-world counting and quantification
  — "how many possible people are there," "there''s someone who is a poached egg in
  w1 and a poached egg in w2" — where the two frameworks give different-looking answers.
  And one downstream application seems to favor the counterpart side: fission. When
  I split into two future people, Lewis can say what he wants: identity is one-one,
  so I don''t survive as two, but I do stand in the counterpart-like I-relation to
  both, and each fission product gets the pre-fission person as a temporal counterpart.
  The transworld camp, or so the counterpart defenders in the seminar say, has to
  choose between saying I don''t survive at all and saying two people were sitting
  in my chair all along.


  My working hypotheses, offered as hypotheses: (a) the residual disagreement is not
  about what modal sentences mean but about what makes them true — whether cross-world
  sameness is a primitive fact about individuals or a projection of a similarity ordering;
  (b) if that''s right, then the debate is substantive but at a level of abstraction
  that the formal equivalence result doesn''t touch, because translation preserves
  entailments, not truthmakers; (c) the fission case and the counting complaints are
  where, if anywhere, the frameworks genuinely come apart in practice rather than
  in bookkeeping.


  I want a diagnosis, and I want you to commit to one. Is this a verbal disagreement,
  a substantive metaphysical one, a case of two research programs answering different
  questions under a single heading, or a standoff over starting intuitions that neither
  side can argue for? To test whatever diagnosis you give, run it against three cases:
  (1) the "modal archive" — suppose an archivist must catalogue all of possibility,
  and must choose between filing by individual (one entry per person, listing the
  worlds they''re in) and filing by world (one entry per world-relative person, with
  cross-references tracking similarity); ask whether anything — in the world, in our
  modal practice, in the semantics — decides between the two filing systems, or whether
  the archivist''s choice is as arbitrary as any library''s cataloguing scheme; (2)
  the non-transitivity point above — decide whether it is a deep defect, a harmless
  artifact of context-sensitivity, or evidence that the counterpart relation is doing
  pragmatic rather than metaphysical work; (3) the fission application — decide whether
  it really gives counterpart theory an advantage the equivalence result can''t absorb,
  or whether the transworld theorist can copy the treatment (say, by distinguishing
  identity from whatever relation the fission products bear to me). Then tell me,
  given your diagnosis, what would count as progress on this debate — a distinction,
  a result, a change of question — or argue that none should be expected, and say
  why the literature has in fact gone quiet rather than converged. Please take a definite
  position throughout; I can construct the list of live options myself, and what I
  need is someone to actually choose among them and defend the choice.


