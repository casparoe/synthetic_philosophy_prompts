reasoning_summary: 'Let me pick a domain and type. Domain: theories of punishment:
  retributivism vs. consequentialism. Type: Present an analogy in common use and ask
  how far it holds.


  Common analogies in punishment debates:

  - Punishment as a debt to society — "paying one''s debt to society" — very common
  analogy, used to support retributivist conclusions (proportionality, no forgiveness
  without suffering). Great fit.

  - Criminal as breaching a social contract — forfeiture of rights.

  - State as parent (paternalism).

  - Punishment as medicine (curative, consequentialist).

  - Punishment as quarantine (Pereboom, Derk) — but that''s somewhat niche-ish though
  actually well-known.

  - The ledger / balance scale analogy: proportionality as balance.


  "Debt to society" is the classic one. Ask: what maps onto what (who is the creditor,
  what is the currency, when is the debt discharged, can it be paid early for good
  behavior, can it be forgiven, interest/compounding, proportionality as amount owed),
  where it breaks (debts are voluntarily incurred; creditor''s role; debts can be
  sold, settled out of court), what it smuggles in about proportionality and about
  whether suffering per se matters, and whether retributivist conclusion survives.


  Also could contrast with a competing analogy: punishment as medicine (consequentialist
  analogy) — the consequentialist says the state as doctor. The prompt could ask to
  audit the debt analogy, and maybe compare to the medicine analogy.


  I''ll write it in the style of the examples: presented as a common usage with a
  conclusion it licenses. Keep it relatively short, formal.


  No web search needed — no quotes from real texts. The analogy is folk-common. Good.


  Draft:


  "In conversations about criminal justice, people constantly reach for the idea that
  imprisonment is how a person ''pays their debt to society'' — it''s used to defend
  the claim that punishment must be proportionate, that sentences shouldn''t be cut
  short for good behavior, and that an offender who has served their time deserves
  a clean slate. My criminal-law professor says the debt picture is doing real philosophical
  work, and a friend of mine who works in sentencing policy says it''s a folk metaphor
  that dissolves the moment you press on it: no one can identify the creditor, the
  debts are never incurred voluntarily, and nothing is actually paid to anyone..."


  Then ask: lay out the correspondence table — who is the creditor, what plays the
  role of principal, of interest, of repayment, of default, of forgiveness — then
  where the mapping breaks, which disanalogies matter for the conclusions people use
  it to draw, and whether those conclusions (proportionality, no early release, clean
  slate) survive without the analogy. And whether a better analogy exists — e.g.,
  does punishment work better as medicine or as quarantine, or something else.


  Actually the clean-slate point is interesting: the debt analogy is used BOTH for
  "must serve full sentence" (debt must be paid in full) and for "clean slate after
  serving" (debt discharged). That''s a nice tension to highlight.


  Let me be careful about the "one thought too many" domain... no, punishment is best.


  Write the prompt, moderately formal, few sentences. Include the work the analogy
  does: proportionality (bigger debt = bigger sentence), full-service requirement
  (against parole/early release), and reintegration after (debt discharged, no further
  handicap). Friend''s objections: no identifiable creditor; debts incurred voluntarily
  via contract/loan, crimes aren''t; debts can be transferred/settled/repaid in kind
  — you can''t pay someone else''s prison sentence; the state punishes but isn''t
  paid; debts can be forgiven by the creditor, so why can''t society just forgive?


  Ask: correspondence table, disanalogies sorted by whether they matter for the intended
  conclusions, and whether each conclusion survives; also whether the friend''s own
  implicit picture (punishment as a service delivered, like medicine) does better.


  Length: a paragraph, ~200 words. Good.'
