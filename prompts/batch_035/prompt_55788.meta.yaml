  I am a third-year philosophy undergraduate currently enrolled in an upper-level
  metaphysics seminar on causation. Our unit on causation by omission has now run
  for three seminars without anyone changing position, and I want a diagnosis of the
  standoff rather than another round of argument for one side.


  The case that keeps anchoring the discussion: a gardener fails to water the plants
  while away for a fortnight; the plants die. Did the gardener''s not watering cause
  the death? The seminar has settled into three camps that no longer engage each other.


  The first camp are realists about omissions: they say the omission is a genuine
  relatum of the causal relation. Their best point: in law and ordinary life we confidently
  make claims like this, juries convict on it, and there is no principled difference
  in kind from cases where a slow-acting positive event causes a delayed effect. One
  member of this camp holds that the non-watering is really just the non-occurrence
  of a specific positive event — the gardener''s watering of those plants on those
  days — so absences are, in a sense, on the map of events after all, and the causal
  claim is strictly true.


  The second camp are deflationists: they hold that strictly speaking nothing negative
  is in the causal chain. What caused the death were positives — the soil dried out,
  the roots desiccated, cells collapsed — and talk of the omission "causing" anything
  is a way of locating which positive facts matter for a purpose. On their view the
  realist is mistaking a useful shorthand for an ontological report.


  The third camp concede both sides something and then say the real issue is elsewhere:
  for any omission, indefinitely many others are equally available (the Queen of England
  also failed to water the plants). Since the Queen''s not watering did not cause
  the death and the gardener''s did, the difference between them cannot be a difference
  in the causal relation itself; it is a difference in background expectations — about
  what was supposed to happen, who was on the hook, what counts as normal. So "the
  gardener''s omission caused the death" is not, or not only, a causal claim; it is
  a claim about deviations from a norm, and the debate is being driven by a word that
  does two jobs.


