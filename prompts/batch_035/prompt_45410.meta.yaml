  - Ellsberg three-color single-draw: refuses both bets that involve ambiguous event,\
  \ accepts bets on unambiguous... \n\nActually better: frame it as verdicts on specific\
  \ gambles, ask to predict on a new gamble, identify candidate rules (maximin over\
  \ prior set vs. MaxminEU with a set of priors vs. minimax regret vs. ambiguity aversion\
  \ with fixed weights), and the discriminating case.\n\nVerdicts list — must be jointly\
  \ consistent with more than one rule, and the new case must split them. Candidate\
  \ rules:\n1. Maxmin expected utility (Gilboa–Schmeidler): evaluate act by min over\
  \ set of priors, then maximize. Implies ambiguity aversion (cautious).\n2. Minimax\
  \ regret (Savage's original suggestion / Milnor): choose act minimizing maximum\
  \ regret.\n3. Maximality (Walley): choose an act if no other act beats it on every\
  \ prior in the set — permits a set of choices, doesn't imply caution.\n\nClassic\
  \ discriminator between MaxminEU and minimax regret: the Ellsberg two-urn or the\
  \ \"ambiguity aversion vs regret\" cases. Known result: minimax regret can endorse\
  \ ambiguity-seeking behavior in some cases. Also, MaxminEU satisfies certainty-effect\
  \ / \"c-Independence,\" while regret rules violate stochastic dominance? Actually\
  \ minimax regret violates independence but satisfies stochastic dominance. A famous\
  \ case: regret rule can choose an act that's stochastically dominated? No—minimax\
  \ regret satisfies stochastic dominance (Milnor). Hmm.\n\nDistinguishing MaxminEU\
  \ from maximality: In cases where the prior set is such that each act is undominated\
  \ (maximal), maximality permits choosing the ambiguous act; MaxminEU forces the\
  \ cautious one. Example: 50-50 coin vs. Ellsberg unknown urn, betting on red. Under\
  \ maximality with a set of priors where unknown-urn red probability ranges over\
  \ [0,1], betting on the fair coin (0.5) vs unknown red: unknown red is not dominated\
  \ by coin (if P(red)>0.5 possible) and coin not dominated by unknown red (if P(red)<0.5\
  \ possible). So both are maximal — maximality permits either; MaxminEU picks the\
  \ coin (since min of unknown red is 0 < 0.5). So the friend's refusal of the ambiguous\
  \ bet in the Ellsberg case shows she's not just applying maximality — she's cautious.\
  \ But we could also explain her verdicts via minimax regret.\n\nVerdicts I'll give\
  \ (need internal consistency across multiple rules):\n\nLet me design:\n1. Ellsberg-style:\
  \ bet on a fair coin paying $100 on heads vs. bet $100 on red drawn from an urn\
  \ with red/black in unknown proportion. She takes the coin. (Consistent with MaxminEU;\
  \ also minimax regret? Regret: if heads bet loses and red bet wins, regret of choosing\
  \ coin = 100. Symmetric — max regret equal, so regret rule is indifferent, doesn't\
  \ force coin choice. Hmm, that lets regret explain it only as a tie permitted either\
  \ way. That's fine: \"consistent with more than one rule\" — the rules can diverge\
  \ elsewhere.)\n\nActually for the prompt, I just need the track record to be consistent\
  \ with ≥2 rules and a new case where they diverge. Let me craft:\n\nFriend's verdicts:\n\
  - (a) 50/50 coin vs unknown-urn red for $100: takes the coin. Also refuses to sell\
  \ the ambiguous-side bet cheaply? \n- (b) When offered a sure $40 vs a 50/50 coin\
  \ gamble for $100 (heads) / $0: takes the sure $40? That'd be risk aversion — complicates.\
