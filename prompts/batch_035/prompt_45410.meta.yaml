  \ If not red and tails: B gives 0, best alt A or C gives 100 → regret 100. So B\
  \ max regret 100 too. Symmetric again — regret still ties. Need asymmetry.\n\nLet's\
  \ do a cleaner known discriminator. There's a literature: \"Stochastic dominance\"\
  \ — MaxminEU with a set of priors respects stochastic dominance; minimax regret\
  \ also respects it (Milnor's axioms: regret satisfies stochastic dominance actually).\
  \ What regret violates: independence/linearity and compound-security (subadditivity\
