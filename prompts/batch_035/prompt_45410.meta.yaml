  \ prior): she models the ambiguous urn as 50/50 but with... hmm.\n\nMaybe better\
  \ rules to contrast:\n- MaxminEU over the full range [0,1] for the unknown urn.\n\
  - A \"middle estimate\" rule: she treats unknown proportions as 1/2 (principle of\
