  \ endorses these verdicts on decision cases; predict on a new case. That works well.\n\
  \nOption B: Illusionism + role-play. Play Frankish or Dennett-ish illusionist. Role-play\
  \ example: \"Play a committed illusionist about phenomenal consciousness...\" with\
  \ an opening move. That's quite standard though — could be seen as regurgitation?\
  \ Illusionism debates are common. The type-1 prompt with imprecise probabilities\
  \ is more \"in the weeds.\"\n\nLet me build the verdict-type prompt on imprecise\
  \ probabilities / decision rules under ambiguity.\n\nSetup: A friend's verdicts\
  \ on decision rules under ambiguity:\n- Ellsberg two-color (red vs black, 50/50\
