reasoning_summary: 'Let me pick a domain and type. Heterophenomenology + Type 1 (turn
  a theory into a procedure) fits well: Dennett''s heterophenomenology is a method
  — operationalize it into a procedure for someone, e.g., a researcher designing interview
  studies of experience, or a UX researcher studying user experience. That''s great:
  "a practitioner" role — e.g., a qualitative researcher / HCI researcher who must
  interpret subjects'' reports of their experience. The niche injection: apply heterophenomenology
  as a procedure for deciding when to treat subject reports as data vs. testimony.


  Heterophenomenology: Dennett''s method — subjects'' reports are data, treated like
  a fiction author''s texts; the subject''s "autobiographical" narrative is taken
  seriously but provisionally; explain the text, don''t assume it reveals inner facts.
  Key distinctions: phenomenal judgments vs. experiences; zombic hunch; first-person
  vs. third-person data.


  Prompt: "I''m a qualitative UX researcher at a company... increasingly asked to
  run studies on users'' subjective experience (e.g., sense of ''flow'', perceived
  wait times, feeling of agency in an AI tool). Team members dispute whether user
  reports should be taken at face value. Please turn Dennett''s heterophenomenology
  into a procedure my team can run..."


  Include: role (Dennett-informed cognitive scientist), brainstorming request, two
  or three worked cases including one where the procedure gives an unwanted answer,
  honest about judgment points and misfires. Constraints: time, expertise, sign-off.


  Case examples: (1) users reporting a voice assistant "feels like it''s listening
  all the time" — procedure says treat as data to be explained, not veridical perception;
  (2) users reporting the UI "stole" their attention — unwanted answer? Maybe: a case
  where the procedure delivers the answer the team doesn''t like — e.g., a designer
  who insists users'' reports of "directly seeing" the interface''s intent must be
  taken as infallible; procedure says no. Or a case where the procedure can''t settle
  whether a user''s vivid report of "seeing the whole page at once" reflects genuine
  gist perception — must go to a person.


  Write the prompt relatively short but complete. Formal/polished. Include prompt-engineering
  text: "You are an expert in philosophy of mind... please think carefully... start
  with a brief brainstorm."


  No web search needed — no verbatim quotes from real texts. Avoid quoting Dennett.
  I won''t use quotation marks for any real-text quotes; user reports in quotes are
  hypothetical, that''s fine.


  Draft:


  "I lead a small user-experience research group at a company that builds productivity
  software, and a dispute keeps recurring about what to do with users'' reports about
  their own experience... Some colleagues treat whatever users say about their experience
  as authoritative descriptions (''I saw the whole page at once,'' ''the assistant
  was reading my mind''); others dismiss them as noise..."


  Then ask: "You are a philosopher of mind with a strong grasp of Dennett''s heterophenomenology.
  Think carefully before answering; begin with a short brainstorm about which parts
  of the method must survive the translation into a workday procedure and which can
  be dropped. Then write a step-by-step procedure... questions in order, what counts
  as a sufficient answer, where it stops, where it hands off to human judgment. Then
  run it on three cases: (a) a user reporting that the autosave indicator ''feels
  like the document is being watched''; (b) a designer who wants a study conclusion
  to read that users ''directly perceive the system''s intent,'' which marketing wants;
  (c) a user with aphantasia-like report claiming no imagery during a mental-rotation
  task, where the team wants to call them uncooperative."


  Include constraints: procedure runnable in ~30 minutes per report by a non-philosopher
  analyst, results signed off by me; frequency: a few reports a week. Stakes: informs
  design decisions.


  Make sure one case gives an answer the asker won''t like — case (b): procedure yields
  a deflationary description, which marketing won''t like. Good.


  Keep it focused. Write final prompt only.'
