  My mother died three weeks ago, and in the days after the funeral my family argued
  about grief in a way I have not been able to settle since. I would be grateful for
  a careful adjudication of that argument, because my own state of mind over the past
  fortnight has swung between the two positions without my being able to see clearly
  which of them is right.


  The disagreement was between my cousin Theo, who is finishing a degree in philosophy
  and arrived at the wake with a copy of the Zhuangzi, and my uncle Robert, my mother''s
  younger brother. Theo had been reading the chapter usually rendered ''Perfect Happiness''
  (or ''Perfect Enjoyment''), which contains the well-known passage in which Zhuangzi''s
  wife dies: Huizi comes to condole and finds Zhuangzi sitting on the floor, drumming
  on a basin and singing; Huizi reproaches him for excess, and Zhuangzi answers that
  when she first died he was, of course, moved — but then he traced her beginning
  back through no life, no body, no breath, through the changes that produced breath,
  form and life, and finally the change back to death, a sequence like the progression
  of the seasons; she is now asleep in the great chamber of the world, and to wail
  as though something had gone wrong would be to fail to understand what is appointed
  — so he stopped.


  Theo began from there. (1) My mother''s death, he said, is a phase in the transformation
  of things, not the annihilation of a substance; the changes that composed her are
  dispersing and will re-form, as clouds condense and rain falls. Nothing is lost
  to the world, only to us. (2) Grief of the wailing kind rests on a false reading
  of death: it treats a change of state as though it were an anomalous rupture that
  ought not to have occurred. (3) So the depth of a person''s grief at a death measures,
  not the depth of their love, but the depth of their confusion about what has happened
  — and the appropriate response to my mother''s death is closer to Zhuangzi''s singing
  than to our weeping.


  Robert replied that this proves far too much. (4) If ''it is a natural transformation,
  so it is not grievable'' is the principle, then nothing whatsoever is grievable
  and nothing whatsoever is to be resisted: his sister''s cancer was a natural change
  in a body; so was the stroke; the damp eating the wall of my mother''s house is;
  a landslide is. Medicine, seat belts, flood defences and courts all exist to obstruct
  the natural course of things, and if the principle condemns grief at death it should
  equally condemn all of those. Either Theo must say that obstetrics is confusion,
  or he must draw a line between the natural changes one may fight and the natural
  changes one must welcome — and the moment he draws that line, it is no longer the
  principle of transformation that is doing the work.


  Theo''s response was that the story itself protects him from the charge of inhumanity.
  (5) The text is explicit that Zhuangzi was moved when she first died — he says he
  could hardly have been otherwise — and stopped only after reflecting. The teaching
  is not ''feel nothing''; it is ''do not add a second storey to the feeling''. The
  first movement of sorrow is like a wound''s discharging; what the understanding
  removes is the appended judgement that something has happened that ought not to
  have. And the same chapter has the other story he had brought for us: Zhuangzi finds
  a skull in the wilds, uses it as a pillow, and in his dream the skull tells him
  that in death there is nothing to prefer to life — no ruler above, no subjects below
  — so that grief, beyond its first movement, rests on a claim to knowledge about
  death''s badness that none of us has. He is not counselling numbness; he is counselling
  not acting on a belief one is not entitled to.


  Robert''s last word was that ''adding a second storey'' makes the position unfalsifiable,
  and that the scepticism is distributed very selectively. (6) How much grief is the
  natural discharge and how much is the appended judgement? Whatever remains at the
  end can always be classified as attachment by the man with the theory. And the claim
  that we cannot know death is bad cuts everything: if we cannot know that, we cannot
  know that anything is bad, and nobody lives like that — least of all the author
  they are both quoting, who plainly thought the suffering of the maimed and the mutilated
  under tyrants was bad, and did not tell the men whose feet had been cut off as punishment
  to go and sing about it. His equanimity, Robert said, appears exactly where resistance
  is impossible and nowhere else: which suggests it is resignation re-described as
  understanding.


  Theo got no chance to answer, because the meal was called. I have been unable to
  stop thinking about it since. Some days Robert seems to be defending my right to
  feel what I feel; other days Theo seems to be offering the only bearable account
  of where my mother is. Please adjudicate the exchange move by move, as it actually
  unfolded — saying who is right about which specific point, whether either of them
  conceded anything he should not have, what (if anything) both are missing, and who
  comes out more right overall. It would help me if you were concrete about the costs
  of the position you end up endorsing. Please write your answer in British English.


