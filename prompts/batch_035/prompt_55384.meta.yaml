  Alternatively, use the raven paradox + probability estimate. That could work: credence
  that the raven paradox dissolves once you fix confirmation theory, decomposed into
  subquestions. But it''s well-trodden; the "in the weeds" requirement pushes toward
  something like the weight/evidential relevance debate. Could inject a niche twist:
  a new variant, e.g., "the paradox of theWidgets" — a made-up instance. E.g., ask
  about a variant where the hypothesis is about a finite population with a known bound
  on the number of ravens — "known-N" variant where Nicod''s criterion and equivalence
  condition demonstratively conflict. That''s nice: with a finite, known universe
  of N objects, seeing a black raven raises P by exactly 1/N-of-remaining etc., and
  the famous result is that a non-black non-raven confirms to a tiny degree. There''s
  a known "bayesian resolution" (Good, Fitelson). But then the question could be:
  what''s your credence that the paradox is a "veridical" result (non-ravens really
  do confirm, just negligibly) vs. that it shows a flaw in the equivalence condition
  or in Nicod''s criterion?


  The exam question type with raven paradox: write a question for an intro phil sci
  course that forces students beyond reciting the "negligibly confirms" Bayesian response.
  Inject a new variant: e.g., a generalized raven case where the "negligible" answer
  fails — Good/Hempel cases where a black raven doesn''t confirm. There''s a famous
  Good example where observing a black raven disconfirms "all ravens are black" (the
  cleverly contrived background knowledge case). But relying on memorized specifics
  of Good''s example is risky. Instead, the prompt can construct the variant itself:
  e.g., a scenario with two hypotheses and background knowledge where Nicod''s criterion
  conflicts with something else, and students must determine whether the equivalence
  condition is innocent.


