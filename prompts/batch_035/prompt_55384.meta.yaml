  Option: Copycat and fluid concepts (Hofstadter''s Copycat project) + exam question.
  The asker could be teaching a cognitive science / philosophy of mind course on concepts
  and analogy, and wants a question that can''t be answered by reciting "analogy as
  shallow recognition vs. fluid concepts." But Copycat is somewhat niche — models
  may know it vaguely. The prompt could inject specifics: describe a microdomain (e.g.,
  letter-string analogies) so the answering model doesn''t need to recall Copycat''s
  architecture.


  Actually a good approach: invent a new microdomain (like "xyz" strings or a new
  small domain) so the prompt injects novelty. E.g., a microdomain of "number-string
  puzzles" or a toy domain of colored beads, and ask students to design a Copycat-style
  solution showing conceptual slippage. That satisfies "in the weeds" and doesn''t
  depend on memorized facts.


