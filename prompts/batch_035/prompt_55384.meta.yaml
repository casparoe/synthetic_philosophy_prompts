  Draft prompt:


  "I teach an upper-level cognitive science seminar on concepts and analogy-making,
  and I''m writing the take-home final. Write one question (worth 25 marks, designed
  for 60 minutes) on conceptual slippage in microdomains, in the spirit of Hofstadter''s
  Copycat but answerable entirely from the material in the question itself. The question
  should present the following microdomain: strings over the alphabet {a, b, c}, where
  the operative concepts are sameness groups (runs), group length, position (first/last),
  and left/right neighbors, and where allowed transformations are duplicating or deleting
  material. Then give two analogy problems of the form ''source → transformed source;
  target → ?'': first the warm-up ''aabb → aabbbb; cc → ?'' and then ''aabb → aabbbb;
  abc → ?'', where the second requires the solver to let the concept ''rightmost sameness
  group'' slip to ''rightmost letter'' rather than force the source grouping onto
  the target.


  The question should ask students to (i) give answers to both problems and explain
  what makes the second one resistant to a fixed structural-mapping approach; (ii)
  reconstruct the case for fluid concepts — what mutual adjustment between local descriptions
  and the global correspondence is supposed to add over structure-mapping with a fixed
  predicate vocabulary, where ''group'' and ''letter'' are not fixed predicates but
  pressures that can trade roles; and (iii) evaluate the objection that success in
  such microdomains is an artifact of the domain having been reverse-engineered from
  the program''s own strengths, and what evidence from outside the microdomain would
  bear on fluidity versus compositional accounts of concepts. The difficulty must
  come from the crux, not from reciting what Copycat''s architecture (slipnet, codelets,
  temperature) is called: a student who only names the architecture should not pass.
  Please also provide a model answer of about 600 words and a marking scheme that
  separates an A answer from a B answer by naming the specific moves each must contain,
  with marks per part summing to 25."


