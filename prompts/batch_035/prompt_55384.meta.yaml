  students to (a) say what conceptual slippage would solve given analogy problems,
  (b) diagnose why a purely symbolic/permutation-based solver fails, (c) argue whether
  fluidity requires the concept architecture (slipnet, codelets, temperature) or can
  be captured by... etc. Then model answer + marking scheme.


  Design the microdomain carefully so it''s self-contained. Let me design: strings
  over the alphabet {a, b, c} arranged on a "wheel" where c''s successor wraps to
  a (cyclic successor). Domain has concepts: sameness, group, first/last, successor
  (cyclic). Then give analogy problems:


  1. "aabc → aabd; ccdd → ?" — hmm.


  Classic Copycat: "abc → abd; ijk → ?" (answer ijl), "abc → abd; iijjkk → ?" (answer...),
  "abc → abd; xyz → ?" (wyz via slippage of successor to predecessor since z has no
  successor). In a cyclic domain, wraparound removes the interesting z case. So design
  different: use a domain where the alphabet is {a, m, z} with a non-obvious order?
  Hmm.


  Alternative: make the domain strings of tokens over {x, y} plus a length notion,
  or a microdomain of "domino trains." Let me pick: strings over the alphabet {a,
  b, c} where only structural relations matter: length, sameness groups (runs), adjacency,
  first/last. No alphabetic successor at all — instead the "change rule" is always
  a repetition/removal. Example problems:


  - "aa → aaa; bb → ?" trivial (bbb).

  - "aab → aabb; ccd → ?" (insert duplicate of last letter after it: ccdd) — mapping
  "duplicate the last group".

  - "abc → cba; xxyy → yyxx" (reversal).

  - The slippage case: "aab → aabb; abc → ?" — here the source answer required duplicating
  the final group of a sameness group; but target has no sameness group; slippage:
  last group ↔ last letter, so answer "abcc". That''s a nice conceptual slippage case:
  "group of identical letters" slips to "single letter at the end."

  - Another: "aabbcc → aabbbcc? " hmm keep it simpler.


  Maybe better to mirror Copycat''s structure: an alphabet with linear order and a
  "wraparound" or a distinguished middle. Actually Copycat itself uses letters with
  alphabetical order — that''s fine and well known to LLMs (abc → abd; ijk → ijl is
  widely seen in pretraining though). To avoid regurgitation, we want novel problems.
  The design above (no alphabet, structural only) is good and self-contained.


  Key issues to test: (a) the difference between slippage and mere variable substitution
  / "slot-filler" analogy (Gentner-style structure mapping), (b) whether pressure
  builds — the "temperature"/adaptive control idea, (c) what a solution like "abcc"
  has over "aabb" — neither is derivable by a fixed rule; the point is that the right
  answer is one that preserves deep structure while letting surface mappings break,
  (d) whether concepts need graded activation (the slipnet) vs. hand-coded rules,
  (e) critique: is the microdomain result generalizable — the "in the weeds" crux:
  does solving letter strings tell us anything about human concepts, given the domain
  was designed by the same people who built the program?


  Actually, a genuinely good crux: Hofstadter''s claim that analogy-making is the
  core of cognition vs. the objection that these problems are gamed. The exam question:
  present the microdomain with two analogy problems, one straightforward, one requiring
  slippage; ask students to (i) solve them and say what makes the second harder, (ii)
  explain why a fixed-mapping approach (map a→c etc.) fails, and what slippage is
  supposed to add, (iii) evaluate the objection that the program succeeds only because
  the domain was reverse-engineered.


