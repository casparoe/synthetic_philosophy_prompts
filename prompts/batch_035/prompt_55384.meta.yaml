  So the exam question: domain: strings over {a,b,c}; concepts: letters, sameness
  groups (runs), first/last position, group length; transformations: duplication and
  deletion. Problems:

  (a) "abc → abcc; cba → ?" (expected: cbaa — straightforward)

  (b) "abc → abcc; aabbcc → ?" (two defensible answers: aabbccc by letter-level rule;
  aabbcccc by group-level correspondence where the source''s rightmost letter c corresponds
  to the target''s rightmost group cc)


  Students must: give their answer to (b) and defend it; explain what makes (b) hard
  for a solver with fixed predicate vocabulary and fixed correspondences (it must
  choose between mapping source letters to target letters vs. source letters to target
  groups, and nothing in the source fixes this); reconstruct the fluid-concepts idea
  (concepts as pressures that get activated by context; the answer emerges from mutual
  adjustment); and evaluate the objection that microdomain success is reverse-engineered.


  This is solid. Now: should the exam also involve "temperature"/stochasticity? Part
  (iii) can ask about the deeper claim: does the microdomain generalize.


  Now the marking scheme: name specific moves for A vs B. E.g., B answer: solves both
  problems, states that group/letter roles trade. A answer: additionally articulates
  why the source underdetermines the rule (the "boring" answer aabbccc is not wrong
  but shallower; the criterion of depth is preserving the correspondence at the level
  at which the source and target are most similar — whole-string structure), and engages
  the reverse-engineering objection with a concrete form of external evidence (e.g.,
  human reaction-time/protocol data on the same problems, transfer to novel domains,
  or failure cases).


  Also possibly a part asking about what "conceptual slippage" adds over "allow predicate
  mappings as search operators" — the incrementalist rebuttal (just do heuristic search
  over correspondences) and the fluidist reply (the space of slippages isn''t enumerable
  in advance because it''s generated by context; concepts have no fixed content).
