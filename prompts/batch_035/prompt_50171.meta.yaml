  - Collective guilt + verdicts-on-cases: a person lists cases (grandfather''s stolen
  painting, German generation, apartheid beneficiaries) and asks what principle captures
  which guilt verdicts. That''s nice — Jaspers'' four types of guilt are fairly known
  (criminal, political, moral, metaphysical) but a layperson wouldn''t use them.

  - LOT + "does this have a name": someone notices they think in a mental language...
  hard for layperson.

  - Solomonoff + name-that-phenomenon: "a universal search that rewards agents who
  predict consequences..." layperson couldn''t plausibly describe it. Could describe:
  "when you try to model something by the simplest explanation, you end up simulating
  consequentialists" — but a non-academic wouldn''t stumble on that. Harder.


  Best fit: memo type + refugees. Asker without academic background sitting on...
