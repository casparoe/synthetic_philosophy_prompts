  to say are conventional lines drawn wherever convenience suggests.

  (2) Species are individuals, in the lineage sense: a species is a historically extended
  entity that begins when it splits off and ends when it splits or goes extinct, and
  organisms are parts of it rather than members — the view associated with Hull and
  Ghiselin.

  (3) Speciation is gradual, and I accept that during a splitting event in progress
  there may be no fact of the matter about whether there is one species or two — the
  indeterminacy is in the world, not just in our ignorance.

  (4) My reason for rejecting pluralism is that if different legitimate concepts carved
  the same organisms into different species, then "species" would be an umbrella term
  for several kinds of groups rather than the name of a real level — and I don''t
  see how something could be a real level and be carved several equally correct ways.

