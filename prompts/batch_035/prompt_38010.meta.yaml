  person 3: not-P, Q. So majority supports P, majority supports Q, but only person
  1 supports both, so majority rejects (P and Q). The conclusion "switch routes" follows
  from P and Q by a rule everyone accepts.


  The disagreement: one member says the club decided to switch (majority on each reason),
  other says the club decided not to switch (majority against the conclusion taken
  as a whole — or rather majority of individuals reject the conjunction). The adjudication:
  who''s right about what — does the group have a collective judgment? Is majority
  voting on premises the right procedure? Etc.


