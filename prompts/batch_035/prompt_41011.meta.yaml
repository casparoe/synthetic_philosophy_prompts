  I''m a second-year philosophy student writing a term essay on whether the utility
  monster actually refutes utilitarianism or just makes one of its costs vivid. My
  tutor keeps pushing a distinction on me: does a given monster objection attack the
  aggregation itself (the summing of welfare across beings), or does it only work
  because the monster''s welfare is empirically exotic (beings that just don''t convert
  resources like that)? And my flatmate reckons all the monster variants are secretly
  the same objection wearing different hats, which annoys me but I can''t quite prove
  him wrong.


  So here''s what I want. Take the role of a professional moral philosopher who specialises
  in aggregation and population ethics. Start with a short brainstorm — no lists yet,
  just reasoning: for each of the five monsters below, work out which utilitarian
  commitment it really exploits — additivity of welfare, maximisation of the total,
  the claim that only experienced welfare matters, or just an empirical assumption
  about welfare conversion. Then rank the five in tiers by how much of a problem survives
  once the utilitarian is allowed to reply "beings like that are biologically / psychologically
  impossible". In other words, tier them by philosophical force modulo empirical contingency,
  and give a sentence or two per monster explaining its tier. If any two are basically
  the same objection in a different coat, call that out — I''d love to settle the
  flatmate argument.


  The five variants:


  1. The classic: one being whose welfare increases enormously for each unit of resource
  given to it, so the total is maximised by funneling everything to it and leaving
  everyone else near zero (Nozick''s version).

  2. The negative mirror: a being whose suffering is wildly out of proportion to small
  deprivations, so the theory says everyone else must be drained to keep it marginally
  comfortable — not a super-pleased monster, a super-harmed one.

  3. The swarm: not one super-receiver but a vast population each barely above neutral,
  whose sum edges out a small, genuinely flourishing population.

  4. The null receiver: a being that converts resources into no welfare whatsoever,
  a perfect utility sink — the theory counts giving to it as pure waste.

  5. The threshold case: a being that gains nothing below an enormous resource threshold
  and everything above it, so aggregation says starve everyone else until the threshold
  can be met.


