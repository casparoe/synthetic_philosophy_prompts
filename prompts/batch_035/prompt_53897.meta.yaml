  about any causal system, including brains, and it would show that nothing has ever
  represented anything, which seems like a lot to get from linear algebra. And my
  own experience pushes the other way: last quarter I found a direction whose ablation
  cleanly and reliably knocked out one specific capability and nothing else, which
