  guess about the next token out of its activations. I love this stuff and I take
  it at face value: these papers seem to be discovering what''s in there. A coworker
  of mine, who took one philosophy elective in college and won''t let me forget it,
  thinks that''s naive, and he laid out an argument over Slack that I haven''t been
  able to beat. It concludes that none of the things I think I''m finding are really
  in the network at all. The problem is that I can''t see which step is wrong, and
  every step still looks fine to me a week later.


  (1) When an interpretability paper says a given direction in the activations is
  a detector for, say, "code containing an off-by-one error," that claim is meant
  to be true or false about the network itself, not just a convenient label we humans
  attach. Call this taking features seriously. (2) For such claims to be true or false,
  there has to be a fact of the matter about which parts of the network carry which
  features. (3) But in real trained networks, features live in superposition: any
  given unit participates in many features, any feature is smeared across many units,
  and the decomposition you recover depends on the tool — a linear probe, a sparse
  autoencoder, a clustering method will each carve the network differently. (4) And
  this isn''t just measurement noise: the network''s function is unchanged under any
  invertible re-expression of its internal states — rotate the residual stream however
  you like and you have literally the same network — so the carving can''t be a fact
  about the network, only about which spectacles we put on. (5) So there is no fact
  of the matter about which components carry which features. (6) So the network contains
  no features in the sense of (1), and interpretability is a matter of useful fiction
  rather than discovery.


