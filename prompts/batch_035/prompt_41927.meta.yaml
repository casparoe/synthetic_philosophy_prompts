  ---


  I spent thirty-five years as an epidemiologist before retiring, and since then I
  have been working my way through political philosophy as an enthusiastic amateur.
  I have become stuck on the position I gather is called luck egalitarianism — the
  thought that inequalities are unjust when they trace to brute luck but not when
  they trace to the agent''s own choices. As a scientist I find myself pulled in two
  directions: professionally I think in terms of exposures and probabilities, and
  I judge two people with the same exposure as identically situated, whatever happened
  to either of them; but as a citizen my moral reactions track realized outcomes.
  I have tried putting my own verdicts down on paper, in the hope that someone can
  tell me whether a single principle lies behind them, and I would be grateful for
  a careful attempt.


  The cases concern what a fair publicly funded health and compensation scheme would
  do. Denying emergency care is, I take it, off the table in every case; my verdicts
  are about who should bear the extra cost — premiums, surcharges, deductibles, or
  loss of priority in the queue.


  My verdicts:

  1. A child born with a severe genetic condition: full public support, no questions.
  This one seems to me beyond argument.

  2. A man who smoked for forty years, aware throughout of the risks, now with lung
  cancer: I think it is fair that he bears more of the cost than the child in (1)
  — through premiums or deductibles, not denial of care. He gambled and lost.

  3. A healthy man who took up rock climbing with full knowledge of the risks and
  is now paralyzed after a fall: I find I do not think he should bear extra cost at
  all. I cannot say what distinguishes him from the smoker, except that I know many
  climbers and they seem to me reasonable people, which I suspect is not an argument.

  4. Two drivers, both over the limit on the same road on the same night; one strikes
  a pedestrian, the other gets home. The one who caused the injury seems to me to
  owe something the other does not — yet from my old professional standpoint the exposures
  were identical, and the difference between them is precisely the sort of thing I
  spent my career calling chance. I record the verdict but I distrust it, and I would
  like to know whether any principled scheme can keep it.

  5. A woman who declined a free, reliable genetic screening that would have revealed
  a predisposition to a treatable condition, then developed the condition: I lean
  toward treating her like the smoker, on the ground that the ignorance was chosen.
  A former colleague of mine insists that as the information was never in her head,
  the case is one of brute luck throughout. I genuinely do not know.

  6. A man with a severe gambling disorder, the disorder having a well-documented
  heritable component, who has ruined himself with bets he could not resist: I think
  the state owes him more help the more severe the disorder. Yet nicotine dependence
  is also substantially heritable and is also a disorder, and in the smoker''s case
  I was happy to hold responsibility fixed. These two verdicts cannot both be right,
  and I do not know which one to give up.


  I have a tentative principle of my own: responsibility attaches when the agent had
  the relevant information, a reasonably affordable alternative was available, and
  the choice was not itself a symptom of a disorder. Clause three, I can already see,
  will be the trouble: it appears to rescue the gambler at the price of the smoker,
  since a forty-year smoker''s choices are hardly made free of dependence. So the
  principle as stated gets cases 1, 2, 3, and 5 right (or nearly), and 6 wrong, or
  it gets 6 right and 2 wrong.


  What I would like from you:

  - A statement, as precise as you can make it, of the principle or principles that
  best capture these verdicts — please treat my tentative principle as a candidate
  to be tested and repaired rather than as an assumption.

  - An explicit answer to the question I keep circling: should the scheme judge people
  ex ante, on the risks they chose to run (which is how I would have analyzed it in
  my working life), or ex post, on what actually happened to them (which is how my
  verdicts in 2 and 4 seem to run)? If the answer is that my verdicts mix the two,
  please say which ones must be surrendered, and to which side.

  - Your honest accounting of which of my verdicts no defensible principle can keep,
  and why.

  - A prediction for cases I have not listed — for instance, a motorcycle rider who
  rode without a helmet after a decade of riding safely, and a worker who took a dangerous
  but well-paid job on the reasoning that the wage premium was compensation for the
  risk. Does the market''s having paid him for the risk change what the state owes
  him when the risk materializes?


  If it helps, I have read enough to know the labels brute luck and option luck, and
