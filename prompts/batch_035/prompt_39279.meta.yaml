  Structure of prompt (formal, PhD student voice):


  "I''m a PhD student in English [or philosophy], working on a dissertation chapter
  on twentieth-century fiction and the philosophy of time. Everyone who teaches Slaughterhouse-Five
  reaches for the same comparison: the Tralfamadorians, who see all of time at once
  and shrug at death because the dead person is still alive in plenty of other moments,
  look like block-universe eternalists... What I want instead is to read the novel
  through Borges. In ''A New Refutation of Time'' Borges also denies the reality of
  time, but his route is the reverse of the Tralfamadorians'': arguing from Berkeley
  and Hume that if the present is the only thing that exists, and no moment needs
  another, then succession itself is superfluous — and the conclusion he draws is
  not that all moments are equally real, but that the persisting self is an illusion,
  so that the refutation of time is also a refutation of him. The essay ends with
  the admission that this is a desperate scaffolding and the thought that time is
  the very substance he is made of.


  So: read Slaughterhouse-Five through Borges''s views on time. Questions: (1) Where
  does the novel dramatize the eternalist version of ''time isn''t what it seems''
  and where would Borges''s route give a different verdict — e.g., is Billy''s serenity
  available on Borges''s dissolution of the self? (2) The Tralfamadorians'' doctrine
  is used in the novel as an excuse for looking away (their advice to concentrate
  on the pleasant moments); Borges insisted his refutation gave no practical comfort.
  Do Borges and Vonnegut converge on fatalism as a psychological necessity — an unhappy
  man''s need — or do they split precisely there? (3) Where does the novel resist
  the reading: the narrator''s insistence that it really happened, the anger that
  keeps surfacing... (4) And what does the novel add to what Borges''s essays do —
  the massacre''s horror is something neither the Tralfamadorian doctrine nor the
  refutation can touch; does Vonnegut dramatize the moral failure of the doctrine
  in a way Borges''s essays can''t?


  Please point me to particular scenes and be candid where the reading breaks down."


