  6. Edge case I keep going back and forth on: picking what to name a product. On
  one hand it''s pure vibes, tiebreak-worthy. On the other the name is with you forever
  and once it''s chosen you can''t imagine having chosen the other, and that feels
  like it makes it a "real" choice. Or does it?


  7. One more: firing an underperforming teammate who''s also a friend vs keeping
