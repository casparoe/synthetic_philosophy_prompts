  I''m a backend engineer, no philosophy background, but I keep running into decisions
  at work that don''t feel like they have a right answer, and I want to know if there''s
  some actual principle behind my gut reactions. Maybe you philosophers have a name
  for this stuff -- I read once that some values just can''t be compared on one scale
