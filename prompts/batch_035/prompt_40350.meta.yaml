  Here are my verdicts on a bunch of decisions. Tell me if there''s a principle that
  captures them, where it clashes, and what it says about cases I haven''t listed.


  1. My team has to pick between rewriting a crusty service properly vs hacking on
  it to ship a feature now. Six months of pain later vs angry customer now. I think
  there IS a real answer here even though it''s hard -- it''s just an information
  problem, you can reason about expected pain.


  2. Choosing between two job offers: one pays a lot more, one has a team I actually
  like and a product I believe in. I flip-flop, and I''ve come to think there''s no
  fact of the matter about which is better for me. That''s not sad, it''s just...
  the values don''t line up.


  3. When a choice is like that (2), I feel fine deciding by some arbitrary tiebreak
  -- I once literally picked by which office had better coffee. But I''d feel gross
  doing the tiebreak thing for (1), the rewrite decision, even in the moment where
  I''ve decided the considerations are balanced.


  4. If I pick the money job and it makes me miserable, I regret it. If I pick the
  team job and stay poor, I regret that too. But I have this feeling I can be "rationally
  ambivalent" about the outcome either way -- I shouldn''t have to regret the choice
  itself. That doesn''t apply to the rewrite decision: if the hack blows up in prod,
  I think I DO have to answer for the choice, not just eat the bad outcome.


  5. My manager likes to convert everything to money ("the rewrite costs 3 engineer-months,
  the hack costs X in incidents") and I think this is basically fine as a decision
