  I''m a first-year assistant professor and was just put on my department''s faculty
  search committee, which means I sat through my first real hiring decision last week
  — and then through a two-hour argument about it afterwards that I couldn''t follow
  to the end. Our bylaws say a candidate is to be hired only if the committee judges
  both that their research record is excellent and that their teaching fits the department''s
  needs, and we''re required to record separate votes on each judgment plus a final
  up-or-down vote. We''re a three-person committee this year. On research, two of
  us voted yes and one no; on teaching, again two yes and one no — but it was a different
  pair each time, so each individual member''s three votes were perfectly consistent
  with the stated rule. On the final question, the same two members who had each been
  the lone ''no'' on one premise voted against the hire, and it failed two to one.
  The chair shrugged and said the bylaws only require the final vote to be binding.


  Over coffee afterwards, two of my senior colleagues fought about what had happened.
  [Colleague A] said the committee had been collectively irrational: a majority of
  us accepted the research premise, a majority accepted the teaching premise, the
  rule says those two things jointly entail hiring, and then a majority of us rejected
  the hire — so the group, taken as a whole, believes all the premises of a valid
  argument and denies its conclusion. If we had voted only on the premises and let
  the rule mechanically determine the outcome, we''d have been obliged to make an
  offer, and the fact that we didn''t shows we switched procedures midstream, from
  premise-based to conclusion-based voting, whenever it suited the result. [Colleague
  B] answered that nothing irrational happened because there is no ''the group'' that
  believes anything — there are three individuals, each with a perfectly consistent
  set of judgments, and the contradiction only appears if you illegitimately manufacture
  a fourth mind out of our majority votes. [A] replied that if there''s no collective
  agent, then there''s nothing for the committee''s vote to be a decision of, and
  the bylaws are pointless; the whole institution of committee voting presupposes
  that we can pool judgments into a group outcome, and any pooling that lets the group
  contradict itself while every member is consistent has failed at its one job. [B]
  said the real failure would be premise-based voting: it would have forced a hire
  that two-thirds of the committee — the very people whose judgments constituted the
  majorities on each premise — opposed, on the strength of an inference that no individual
  member actually made, and majority rule is supposed to track the members'' all-things-considered
  judgments, not a syllogism nobody endorses.


  There were a few more rounds in this vein (someone brought up a candidate we rejected
  two years ago under circumstances that were the mirror image; a passing grad student
  muttered something about Condorcet, but when I looked it up it seemed to be about
  circular rankings, which we didn''t have). What I''d like is a careful adjudication
  of the argument as it actually unfolded: go through the main moves on each side
  and say who is right about what, whether the committee''s outcome was irrational
  and in what sense (was it a failure of rationality, of procedure, or of nothing
  at all), whether [A]''s proposed premise-based procedure is really an improvement
  or just relocates the problem, and whether there''s any principled way to design
  a voting procedure that avoids whatever went wrong here — or a reason to think nothing
  could. I''d also like to know whether this configuration has a name of its own,
  since the Condorcet material doesn''t seem to fit.


  ---


