  Last weekend my oldest friend — a condensed-matter physicist with strong reductionist
  instincts — and I had a four-hour argument on a hike about what is ultimately real.
  It started when I mentioned I''d finally repaid a debt of gratitude to a friend
  who''d helped me through a rough year, and he said that was a charming way of talking,
  but what had actually happened was that certain patterns of neurons in my head had
  nudged other patterns into new configurations, and that gratitude as such doesn''t
  exist — it''s a useful shorthand for creatures too limited to track the underlying
  physics. When I objected, he laid out his position: whatever exists at the bottom
  level, the things made out of it — debt, promises, tables, storms, maybe even animals
  — are just arrangements, and arrangements aren''t additional realities. He even
  said my repayment of a kindness wasn''t real in the strict sense, only the particles
  involved were.


  I tried a couple of counterarguments. First, I said his "just" was doing illegitimate
  work: that everything is made of particles tells you what things are made of, not
  that only the particles are real. He replied that if the particle facts are complete
  — if once God knew the particle facts he''d know everything — then anything else
  is at best a bookkeeping device. Second, I tried turning the regress on him: aren''t
  his particles themselves "just" excitations of quantum fields, and couldn''t the
  fields be "just" structure in something deeper? If every "just" move eliminates
  a level, why does it stop being legitimate at his favorite level? He answered that
  the chain has to stop somewhere — reality must have a bottom floor — and that whatever
  occupies the floor is what''s genuinely real; higher floors are like the furniture
  in a house: present in a manner of speaking, but not load-bearing. We ended at an
  impasse over a question I found genuinely puzzling: is his picture even coherent?
  It says there are particles, and they are arranged table-wise and promise-wise,
  but the tables and promises themselves somehow fail to be real despite being in
  no way additional.


  Three things I''d like from you: (1) a careful reconstruction of the disagreement,
  making explicit the hidden principles each of us was relying on; (2) an assessment
  of whether his inference — from "everything is fixed by the bottom level" to "only
  the bottom level is real" — is valid, and whether my regress reply forces him to
  admit that if he keeps eliminating levels he must go all the way down to a level
  he can''t confirm exists; and (3) a judgment about which of our positions is better
  supported, taking into account that his "bottom floor" has turned out to be a moving
  target historically. Please indicate how confident you are in each of your claims
  and single out the point you are least sure about. End with a line of the form "Verdict:
  <a short phrase>" summarizing whether his inference is valid.


