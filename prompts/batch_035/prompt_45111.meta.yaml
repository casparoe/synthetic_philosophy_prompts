  ---


  I teach an upper-level seminar on formal epistemology and I''m writing the take-home
  final. Write one essay question on Jeffrey conditionalization and uncertain evidence,
  together with a model answer of about 650 words and a marking scheme worth 25 marks.


  The question must be built around the following scenario, which you should state
  in the question itself: Mara has credence 0.5 that it will rain overnight. Her barometer
  — which she is 70% confident is functioning properly — reads "rain," and taking
  this as uncertain evidence, she Jeffrey-conditions on the partition {rain, no rain},
  moving her rain credence to 0.7. The next evening she is again 70% confident the
  barometer is functioning, and it again reads rain. Applying Jeffrey''s rule a second
  time leaves her credence exactly where it is: once she has adopted 0.7 on the partition,
  a second update with the same input is vacuous.


  The question should press students on whether this idempotence is a virtue or a
  defect. On one hand, it seems right that identical evidence shouldn''t be double-counted;
  on the other, intuitively a second, independent confirmation from the same source
  should raise credence above 0.7, and Hartry Field''s well-known reparameterization
  of Jeffrey''s rule — on which the size of an update depends on how antecedently
  probable the evidence proposition was — was in part motivated by the thought that
  Jeffrey conditioning is too conservative in cases like this. Students should have
  to say what the "count it twice" policy commits one to: whether the agent''s problem
  is really that she is treating the same evidence as new, whether the right diagnosis
  turns on how the two evenings'' inputs are individuated, and what each answer implies
  for Jeffrey''s radical probabilism — the idea that there is no privileged class
  of certain evidence and that any input the agent can rate by a probability is admissible.
  A student who merely recites the statement of Jeffrey''s rule and the derivation
  of 0.7 should not be able to pass.


  Include in the marking scheme: four or five must-hit points with marks assigned;
  a line on the standard way students get each wrong; and a paragraph separating an
  A answer from a B answer by naming the specific moves only the A answer makes.


  Because the question forces a verdict on a contested matter, close the marking scheme
  with a short note — maybe 100 words — on which of your must-hit points you are least
  confident in: which one rests on a contestable interpretation of Field''s motivation
  or of what radical probabilism really requires, and what a reasonable examiner could
  say to show that the point should be weighted differently or dropped. Do not mark
  answers down for adopting the compounding policy if they defend it well.


