  "I teach an introductory course on the philosophy of death, and I''m pairing Tolstoy''s
  The Death of Ivan Ilyich with the Epicurean argument. I want a reading of the novella
  as a response to Epicurus and Lucretius rather than a mere illustration of their
  problem, and I''d like it to work through three specific worries.


  First, the classic Epicurean line is that death is nothing to us — when death is,
  we are not — with Lucretius''s symmetry argument adding that posthumous nonexistence
  should no more dismay us than the prenatal nonexistence that preceded our birth.
  Nagel''s objection is that death still deprives its victim of goods. But notice
  how much of the novella''s terror is front-loaded into the dying rather than the
  death: Ivan''s pain, isolation, disgust at the pretense of those around him, the
  weeks in which he is still alive to suffer. One of my students proposed that this
  makes the Epicurean argument almost irrelevant to the book — that what Tolstoy shows
  is that the badness we fear gets packed into the final months of life, so that ''death
  is nothing to us'' concedes the whole point. A second student countered with a sharper
  suggestion: that Ivan''s terror is not about lost future goods at all but about
  an epistemic harm — the prospect of death is destroying his ability to go on being
  the subject of his life, the one from whose point of view the story is told. Which
  of these, if either, does the novella support?


  Second, the ending. In the final scene, Ivan stops resisting — the image is of a
  sack he has been pushed into — and the narrative reports that in place of death
  there was light, and that death itself was over. Does that ending vindicate Epicurus
  in a strange way, since by the time death arrives it is no longer bad for Ivan?
  Or is the ending about something the Epicurean debate can''t see — his judgment
  that his whole life had not been the right thing — and if so, does the novella show
  that the argument about death''s badness for the subject was never really where
  Ivan''s suffering lived?


