  event — the probability that this particular election produces a constitutional
  crisis, say — unless she posits a hypothetical ensemble of identical elections,
  which quietly reintroduces the single-case probabilities the interpretation was
  invented to avoid. Subjectivism, by contrast, holds that a probability just is a
  measure of how confident some particular person happens to feel, so on this view
  any degree of belief between 0 and 1 is as rational as any other. The Bayesian machinery
  of priors and updating then amounts to a way of letting analysts dress up their
  personal hunches in quantitative costume; and because two Bayesians who start with
  different priors are each only accumulating evidence consistent with their own starting
  point, they can never in principle be brought to agreement. The one genuinely deep
  result in the area is de Finetti''s theorem from the 1930s, which shows that if
  your degrees of belief satisfy a symmetry condition, they behave in every observable
  respect as if there were objective chances, which de Finetti took as proof that
  objective chance exists after all. Meanwhile the frequentist, who refuses to use
  prior probabilities on the grounds that they introduce bias, must still choose a
  significance threshold for her tests, and that choice is a prior probability in
