  5. International law / rules of a prison gang that has its own "courts" — is that
  law? (Hart''s minimum content, Hart on international law being law but primitive.)


  Hard pair: The asker thinks apartheid South Africa''s statutes were law (clear,
  enforced, officials recognized) but thinks the Nazi courts'' decisions in the grudge
  informer case were not law (or feels uneasy). Or: they think an utterly evil but
  procedurally perfect code is law, yet they also think the postwar court was right
  to prosecute the grudge informer because "that wasn''t law" — tension. Or they think
