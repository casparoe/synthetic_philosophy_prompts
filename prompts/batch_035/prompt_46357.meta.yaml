  (1) God is omniscient, omnipotent, and perfectly good, and actualized the best of
  all possible worlds.

  (2) A perfectly good being permits an evil only if that evil is a necessary condition
  of a greater good — a good that no alternative arrangement without the evil would
  have contained or outweighed.

  (3) So every actual evil is, in the actual world, a necessary condition of a greater
  good; and any world like ours except that some actual evil is prevented is, on balance,
  worse than ours.

  (4) If preventing an evil would make the world worse on balance, then it is impermissible
  to prevent it.

  (5) Therefore it is impermissible to prevent any actual evil: not to drain the malarial
  swamp, not to excise the tumor, not to pull the drowning child from the pond.

  (6) And since the same holds for every evil and every preventer, the morally best
  human life is a life of non-interference: charity is, quite literally, sabotage
  of the optimum.


