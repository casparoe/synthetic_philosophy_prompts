  \ what principle captures them. That's a great combination: a novelist constructing\
  \ characters, with gut verdicts about whether characters acted rightly, and asking\
  \ what principle underlies them.\n\nOr \"Is beauty objective? Hume's standard of\
  \ taste\" with verdicts on cases — a novelist's verdicts about aesthetic judgments.\
  \ That could also work well. But moral worth fits the case-report type naturally:\
  \ cases of characters doing good things for mixed motives.\n\nLet me write it casually,\
  \ with a typo or two, from a novelist's perspective, in the weeds. Include some\
  \ seeding/niche ideas: e.g., a character who gives to charity because she wants\
  \ to spite her brother; a character who does the right thing by accident (unwitting\
  \ compliance); a \"relieved-of-moral-desert\" case (drunk driver who luckily doesn't\
  \ hit anyone — that's moral luck, slightly different domain though); the reluctant\
  \ hero; the person doing good for reputational reasons who keeps doing good after\
  \ reputation gone; someone whose good action flows from a questionable character\
  \ trait. Also higher-order evidence domain could work with verdicts on cases, but\
  \ moral worth is easier.\n\nCases for moral worth:\n1. A character who donates anonymously\
  \ — good.\n2. A character who donates the same amount but loudly, for image — less\
  \ worthy, but if the donation is same...\n3. Someone who does the right thing only\
  \ because they mistakenly believe a deity is watching — Kant's shopkeeper-ish issue:\
  \ acting from fear of punishment vs duty.\n4. Someone who acts rightly from duty\
  \ but lacks any warmth — Kant's moral worth high; asker's gut maybe uncomfortable.\n\
  5. Consequentialist counterfactual: would the person have done wrong if circumstances\
  \ had differed?\n6. Character who does the right thing \"for the wrong reason\"\
  \ — e.g., returning a wallet because a camera was watching, would have kept it otherwise.\n\
  7. Someone who genuinely wants to help but the help is condescending/paternalistic.\n\
  8. A grudging good deed.\n9. Acting rightly out of spite or pettiness that happens\
  \ to align.\n10. The case the novelist goes back and forth on: a character who is\
  \ kind only because of mild antidepressants / medication, or who acts well only\
  \ while in love — does the motive's fragility matter? Or a character who does the\
  \ heroic thing on impulse, without deliberation.\n\nThe novelist framing: they're\
  \ writing a novel with a protagonist whose good deed drives the plot, and readers/critics\
  \ keep asking whether the character is \"really good,\" and the novelist realizes\
  \ their own verdicts across their characters are inconsistent. Ask: what principle\
  \ captures these verdicts, which must go, what it predicts for the undecided character.\n\
  \nInclude a hard-to-reconcile pair: e.g., they think the spite-driven whistleblower\
