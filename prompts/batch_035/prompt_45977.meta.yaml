  I sit on the IRB of a university medical center that has been running a trial in
  which hippocampal tissue damaged by epilepsy is progressively replaced with neuromorphic
  implants that replicate its input-output function. The surgeons now ask to expand
  the protocol to cortical regions, with the eventual aim of wholesale brain replacement
