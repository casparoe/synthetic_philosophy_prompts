  The institutional angle: an IRB or research ethics board reviewing a trial of progressive
  neural prosthetic replacement — e.g., replacing regions of the brain with functional
  replicas, done for epilepsy/tumor patients. The philosophical issue: does the patient
  survive, and how should consent handle it? Should consent forms say anything about
