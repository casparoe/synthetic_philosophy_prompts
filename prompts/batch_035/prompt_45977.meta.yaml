  Make it in the weeds: specify trial phases (hippocampal prosthesis already implanted,
  now expanding), a dissenting board member who thinks continuous consciousness guarantees
  identity, another who thinks the gradual replacement destroys the original. The
  committee must decide whether to approve the protocol expansion, and what the consent
