  "I sit on the IRB of a university medical center. A neurosurgery group has asked
  approval to expand an ongoing trial: epilepsy patients whose hippocampi are being
  progressively replaced with functionally equivalent neuromorphic implants now volunteer
  for extension to cortical regions, with the stated long-term aim of enabling later
