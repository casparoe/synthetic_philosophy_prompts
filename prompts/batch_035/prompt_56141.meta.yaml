  I''m an undergraduate in a spring seminar on formal decision theory; we''ve spent
  the last three weeks on imprecise probabilities, and I''m drafting a term paper
  on whether agents with imprecise credences need a decision rule beyond the representation
  itself. My case study needs a worked example, and I''d like you to construct it
  to specification.


  First, the setup as I understand it, so we''re working from the same page (please
  flag it if I''ve misstated anything): an imprecise probabilist represents an agent''s
  credences not by a single probability function but by a set C of them, typically
  when the evidence is too sparse or conflicting to pin down one distribution. Two
  candidate decision rules: Γ-maximin ranks each act by its lower expected utility
  — the minimum, over every p in C, of its expected utility — and deems choiceworthy
  any act whose lower expectation is not exceeded by another''s. Maximality instead
  deems an act inadmissible just in case some rival act beats it on every p in C;
  anything not dominated across the whole set remains choiceworthy. The rules are
  not equivalent.


  Your task: construct a decision problem that isolates their disagreement. Specifications:


  1. Realistic setting — a farmer, a homeowner, a patient, something with stakes a
  normal person could actually face. No Ellsberg urns, no demons, no artificial chance
  devices generating the ambiguity; the ambiguity should come from conflicting or
  sparse real-world evidence (two credible forecasting models that disagree, etc.).

  2. Exactly three feasible acts, two states of nature, and a credal set you specify
  explicitly (an interval for the chance of one state is fine). Utilities should be
  dollar amounts or final wealth, so that the disagreement cannot be explained away
  as ordinary risk aversion.

  3. The verdict structure: exactly one act must be selected by Γ-maximin; exactly
  two acts must be admissible by maximality; the third act must be excluded by both
  rules (so the case doesn''t cheat by making everything admissible). The single act
  in the gap between the rules — permitted by maximality, excluded by Γ-maximin —
  is the point of the paper, so it must be a live option a reasonable person could
  take, not an obvious blunder.

  4. Every number small enough that the verdicts can be checked by hand.


