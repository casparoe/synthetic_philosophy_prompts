  utility of each act as a function of the probability of one state (over the credal
  interval), report the lower expectations, verify each rule''s verdicts act by act,
  and identify precisely which structural feature of the case generates the gap —
  and confirm the gap disappears when that feature is removed (for instance, if the
  credal set collapses to a single distribution, both rules should reduce to ordinary
  expected-utility maximization and coincide; check that they do).


  After the walkthrough, add three short paragraphs: (a) how a defender of Γ-maximin
  would argue that excluding the act in the gap is a feature, not a bug — what the
  agent is being protected from; (b) how a defender of maximality would reply, and
  what she thinks Γ-maximin gets wrong about the significance of the priors on which
  the excluded act wins; (c) what a precise Bayesian, who denies credal sets altogether,
  would say about the whole exercise — e.g., that the gap is an artifact of refusing
  to commit to a single prior.


