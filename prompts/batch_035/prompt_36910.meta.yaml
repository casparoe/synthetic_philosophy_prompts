  The core dispute: Nash solution satisfies Independence of Irrelevant Alternatives
  (if the solution of a larger problem is feasible in a smaller problem, it stays
  the solution) but violates monotonicity (if the feasible set expands, both players
  should weakly gain). KS preserves the ratio of maximal gains (individual rationality
  w.r.t. disagreement point and ideal point), satisfies monotonicity but violates
  IIA. Classic example: player 1''s max possible gain shrinks (the utopia point for
  player 1 drops) — KS shifts because the "ideal point" moves, which some find irrational
  (why should the split change just because the maximum one player could conceivably
  get changed, when the actual feasible alternatives didn''t?). Nash keeps the same.
  Conversely Nash gives no gains from expansions to the weaker player in some cases.


