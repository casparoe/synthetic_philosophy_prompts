  much weaker practical problem than Anton implies: a manipulation only pays if you
  are pivotal and know enough about the other ballots to compute the profitable lie,
  and in a large electorate the chance of being pivotal is vanishingly small, so the
  theorem''s ''manipulable in principle'' almost never becomes ''manipulated in fact''.
  Anton''s response was that this treats voters as the only manipulators: parties,
  faction leaders, and anyone organizing strategic voting campaigns operate with exactly
  the aggregated information and coordination the theorem''s scenario presumes, and
