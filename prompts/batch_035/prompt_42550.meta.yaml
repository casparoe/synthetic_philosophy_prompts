  so electoral reform is pointless: replacing one method with another just trades
  one set of exploitable weaknesses for another. Bella replied that this overreads
  the result: the theorem covers only deterministic, single-winner rules that take
  full rankings of three or more alternatives, impose no candidate by fiat, and exclude
  no voter from influence; a reformer who gives up any one of these conditions — by
  randomizing, restricting the domain of preferences, or letting voters submit something
  richer or poorer than a full ranking — is outside its scope. Anton answered that
  this is a lawyer''s escape hatch: every real electoral system satisfies the conditions
  in spirit, and conditions that can always be dodged technically were never doing
  any work.


