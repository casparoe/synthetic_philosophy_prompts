  ---


  I am a novelist, some years into a book in which Johannes Kepler appears as a character,
  and I have come to distrust my own instincts about him. The ready-made picture —
  the man who discovered that the planets move on ellipses and, apparently in the
  same breath, read nativities for money — makes him either a modern rationalist with
  an embarrassing habit or a credulous crank with a genius bolted on. Both versions
  ruin the book. What I find when I go to the sources is someone more tangled: in
  his 1610 pamphlet Tertius Intervieniens, he positions himself as a third party between
  the fanatics and the scoffers, concedes that "this Astrology is a foolish daughter"
  while asking what would become of "her mother, the highly reasonable Astronomy"
  if the daughter did not earn the bread, keeps the geometrical aspects between planets
  while discarding much of the inherited apparatus of signs and houses, holds that
  configurations physically affect the sublunary world and human temperament yet incline
  rather than necessitate, and — Book IV of the Harmonices Mundi — folds the whole
  business into a theology of divine harmony. I want the questions that would let
  me pin the character down before I write another scene.


  To that end: draft for me a sequence of nine or ten interview questions, to be put
  to Kepler as though he had agreed to sit for a structured interrogation — questions
  that press on the actual tensions rather than inviting him to restate his piety
  or confess his embarrassment. For each question, include a follow-up keyed to the
  reply he is most likely to give.


  At minimum I want coverage of the following, in whatever order serves:


  1. The mechanism. If the heavens act on the earth, what carries the action — light,
  a species of geometric ray, something about angles as such — and why should the
  aspect (the angle between planets) matter while the zodiacal sign a planet happens
  to sit in matters hardly at all? What is it about geometry that he thinks makes
  influence intelligible rather than occult?


  2. Inclination without necessity. He says the stars incline, they do not compel.
  I want a question that asks whether a merely inclining influence is distinguishable,
  in any observation he could cite, from no influence at all — and a follow-up for
  when he reaches, as I suspect he will, for the analogy of weather or of humors predisposing
  a body.


  3. The rational soul. Temperament and rain are one thing; judgment and the will
  another. Where exactly does he draw the boundary of celestial influence, and what
  does he think the soul contributes that no configuration can?


  4. The bread. [the foolish daughter economics — he fed himself and his family partly
  by casting horoscopes and issuing prognostications] I do not want a gotcha about
  selling prophecy; I want the question that makes him explain, in his own terms,
  how taking the general''s silver for a nativity is compatible with despising the
  fortune-tellers who pander to common taste — and a follow-up for when he answers
  that the work subsidizes the true philosophy.


  5. Harmony. Whether his astrology is a corollary of the rest of his cosmology —
  the nested regular solids, the harmonic ratios, the God who geometrizes — such that
  the same man could not have held the one without the other. If it is a corollary,
  the character changes: the error, if it is one, is architectonic, not venal.


  6. The scoffer. One question posed as the hardest of his contemporaries might pose
  it — what he would concede to a man who grants him his orbits and denies him everything
  else — and a follow-up for when he distinguishes his genuine astrology from the
  vulgar kind.


  Two further constraints. The questions must be phrased so that a man of 1610 could
  understand them — no statistics, no psychology of the modern sort — though the follow-ups
  may sharpen the edges as far as the language allows. And at the end, flag for me
  any question in your sequence where the temptation is strongest to smuggle in a
  modern sensibility, since that is where the character is likeliest to come out false;
  I would rather know now than find out in proofs.


