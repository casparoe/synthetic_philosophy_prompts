  ---


  I am a software engineer with no formal background in philosophy, and I would like
  a careful comparison of two attitudes towards inconsistency that I keep running
  into in the logic literature, because I cannot tell whether they are genuinely different
  positions or the same position described at two levels of abstraction.


  The first attitude is dialetheism: the claim that some contradictions are literally
  true, so that a sentence and its negation can both be true of the world, with the
  liar paradox usually cited as the flagship case. The second attitude I do not have
  a canonical name for, so let me call it paraconsistency as an engineering practice:
  building and reasoning within logical systems in which a contradiction does not
  entail everything, so that an inconsistent body of information remains usable, while
  remaining entirely neutral about whether any of the contradictory information is
  true. My understanding is that this is where inconsistent databases, merged knowledge
  bases, and automated reasoners that must not collapse at the first conflict live.


  Please structure the comparison around the following questions, which strike me
  as the places where the two attitudes might come apart:


  1. Is paraconsistency-as-practice a philosophical position at all, or just a formal
  property of certain logics (non-explosiveness) that anyone can exploit for any purpose?
  Is there a recognised term for the people who use paraconsistent logics while rejecting
  true contradictions, and if so, what commits them to that rejection?


  2. Semantics. My working hypothesis is that dialetheism needs a semantics in which
  truth-values overlap — gluts — whereas the engineering practice can keep an entirely
  classical two-valued semantics and simply weaken the inference rules, treating the
  contradiction as a defect to be quarantined rather than a fact to be recorded. Is
  that hypothesis correct, and if so, does it give the dialetheist something the engineer
  lacks, or merely something extra the engineer has no need of?


  3. A concrete case from my own work, to test the comparison. When two legacy systems
  disagree about a customer''s date of birth, we currently have three behaviours available
  to us. (a) Fail everything downstream of the record, which looks like classical
  explosion. (b) Mark the field as "conflicting", let every other query proceed, and
  answer any query about the date of birth with "conflicting" — which looks like quarantine
  without verdict. (c) Return both dates and let each consumer decide, which a colleague
  of mine calls "letting the world sort it out". Can each of these three behaviours
  be matched to one of the two attitudes, or to a stance in between? In particular:
  would a dialetheist say that (c) makes both dates true, or that it merely refuses
  to adjudicate, and does that answer change whether (c) counts as dialetheist reasoning?


  4. Finally, are the two attitudes separable in both directions? I can see how someone
  could use non-explosive logics while believing all contradictions are false. What
  I cannot see is the reverse: a dialetheist who insists on explosive classical consequence.
  Please tell me whether that combination is genuinely incoherent, or merely unattractive,
  and why.


