  The debate over bootstrapping and easy knowledge in epistemology seems to have hardened
  into position-taking, and I''d like a diagnosis of the impasse rather than another
  entry in it. The shape of it, briefly: one camp — reliabilists, and dogmatists about
  perceptual justification in the style of Pryor — holds that you can gain justified
  beliefs from a source without antecedent justified belief in that source''s reliability;
  otherwise skepticism wins, since any vindication of perception would have to run
  through perception. The other camp, in the tradition of Fumerton''s demand for non-circular
  justification, replies with a track-record argument: if the first camp is right,
  you can start from particular perceptual beliefs and, one at a time, infer that
  your vision is reliable — a bit of reasoning that seems to get foundational epistemology
  on the cheap, vindicating a source largely by consulting it. Replies on offer include:
  declaring the track-record reasoning rational after all; imposing a rule that a
  source''s testimony about its own reliability needs independent support; letting
  the ban apply only to premises the reasoner is currently relying on; and explaining
  away the intuition against bootstrapping as an assimilation to genuine cases of
  questionable sources. What I want to know is what kind of disagreement this actually
  is. My hypothesis: it is not verbal — both sides use ''justified'' to mark the same
  normative status — but it may turn on two different questions travelling under one
  heading: a third-person question about which belief-forming methods are good, and
  a first-person question about what a thinker is entitled to conclude while actually
  in the middle of using a method. Test that hypothesis against what the parties actually
  say; tell me whether the debate would be dissolved by a case that separates the
  two questions, by a formal model of epistemic entitlement, or whether it should
  be expected to persist, and why. Please adjudicate the structure, not the substance:
  I am not asking who is right about perception.


