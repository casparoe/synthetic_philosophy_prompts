  ---


  You are a professional philosopher working on posthumous harm and the ethics of
  memory, with a side interest in theater criticism. I am writing a long essay on
  what we owe the real dead when we dramatize them, and I want to center it on Peter
  Shaffer''s Amadeus (the 1979 play and Miloš Forman''s 1984 film). Think carefully
  before committing to a thesis: begin with a short brainstorm (say, five or six bullet
  points) mapping the interpretive options, and only then develop the reading you
  think is strongest.


  Here''s what I want you to take seriously. The historical Salieri almost certainly
  did not poison Mozart, and Shaffer knew it; the play''s central crime is a legend
  the work knowingly repeats and enlarges. Yet the work is not careless with the dead
  — it is, among other things, a meditation on how posterity remembers and misremembers,
  staged as an old man''s confession addressed to the future. So the crude question
  — is it wrong to slander Salieri for the sake of a better drama? — seems too easy.
  What interests me is the knot underneath it.


  A distinction I''ve been toying with: falsifications of the dead seem to come in
  (at least) two kinds. Accusative falsification tells a lie about what someone did
  — Salieri as murderer. Appropriative falsification conscripts a real person into
  a story whose meaning serves someone else — Mozart, in the play, is less a man than
  an allegory of grace given to the unworthy, God''s unfair distribution of gifts.
  Accusation wrongs by misattribution of deed; appropriation wrongs by use of person.
  I''m not sure the distinction holds, or where it breaks, and I''d like you to pressure-test
  it: does it classify the play''s treatment of its two dead men correctly, or does
  the play show the categories bleeding into each other?


  Second, and to me the sharper problem: the play seems to give Salieri exactly what
  his historical counterpart is said to have craved — enduring union with Mozart''s
  fame — at the price of being remembered as his killer. Posthumous benefit and posthumous
  harm braided together inseparably, with the same legend delivering both. If we owe
  the dead something, what do we say about a work that pays the debt in the very currency
  of the injury? Does the frame device — the confession narrated to posterity, Salieri
  casting himself as the enemy of God and the self-appointed protector of all the
  mediocre — make the work self-aware about this, i.e., does it know what it does
  to its dead, and does knowing excuse, mitigate, or aggravate?


  Your deliverable, then: a defended reading of about 900-1200 words that (1) explains
  what position, if any, the work takes on the ethics of its own falsifications; (2)
  evaluates my accusative/appropriative distinction against the text, including where
  it fails; (3) says what the work adds to the philosophical debate about posthumous
  harm that argument alone doesn''t — or concedes that it adds nothing and explains
  why the intuition that it does add something persists anyway. Be faithful in both
  directions: don''t reduce the play to an illustration of the ethics, and don''t
  bend the ethics to fit the play. You needn''t cite literature; argue from the work
  and the ideas.


