  Heres my package of views on decision theory with infinite or undefined expectations,
  and I want to know if it hangs together before I present it to my reading group:


  (1) Expected utility maximization is correct whenever the expectation is well-defined,
  and that covers essentially every real-world gamble, so the theory is basically
  fine as is.

  (2) St. Petersburg isn''t a real problem. No actual casino has an infinite bankroll,
  so you cap the payoffs at what the house can actually pay out, and the value comes
  out modest and finite. The paradox only exists for a game that can''t literally
  be offered.

  (3) The Pasadena game is different — rational choice theory is just silent about
  it. (In case you haven''t seen it, the version I learned: flip a fair coin until
  the first heads. If the first heads is on flip n, the payoff is (-1)^(n+1) × 2^n/n
  dollars — win $2 on flip 1, lose $2 on flip 2, win $8/3 on flip 3, lose $4 on flip
  4, etc. Multiply by the probabilities and the expectation is the series 1 − 1/2
  + 1/3 − 1/4 + …, which only converges conditionally, so rearranging the terms can
  make it sum to anything you like.) My view: there''s no fact of the matter about
  what Pasadena is worth, so no choice about it is irrational.

  (4) Dominance is close to rock bottom for me: if option A is at least as good as
  B in every state of the world and strictly better in some, you have to take A.

  (5) The value of a gamble can''t depend on the order you happen to sum its outcomes
  in.

  (6) Rational choice theory shouldn''t have holes — between any two options there
  should be a fact about which is at least as chooseworthy.


  I''ve got a general feeling that (2) and (3) can''t both survive, since whatever
  cap dissolves St. Petersburg would seem to give Pasadena a definite value too, and
  something about (4) and (6) rubbing against (3) — plus someone told me that the
  rearrangement facts put (1) and (5) in direct conflict — but I honestly can''t see
  exactly which commitment has to go, if any. Also, a friend sketched a fix I half
  understood: instead of assigning each game a value, compare two games by looking
  at whether the series of payoff-differences between them is well-behaved, even when
  neither game''s own series is. Does adopting that let me keep (5) and (6) while
  giving up (3), or does it quietly cost me something else? Go through the pairs,
  tell me which are genuinely in tension and which only look like it, rank the real
  tensions by severity, and tell me which single revision cleans up the most. Please
  be upfront about how confident you are in each verdict and flag the point you''re
  least sure of.


