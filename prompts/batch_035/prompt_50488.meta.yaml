  If a person''s values were shaped from childhood by a manipulative cult, or (more
  fancifully) by neuroscientists at birth, then when he later acts from those values
  — with no intervention at the time — he is not responsible for the action, even
  though the action flows from what are, by then, his own values.

  (5) I am a compatibilist about determinism: in a deterministic world without any
  intervener or manipulator, ordinary agents remain responsible for what they do.

  (6) Finally, I accept an asymmetry: Frankfurt-style cases convince me that blame
  does not require alternative possibilities, but I am not convinced about praise.
  It seems to me that credit for an achievement requires that failure was possible:
