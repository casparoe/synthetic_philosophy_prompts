  an intervention that would force Jones to vote a certain way, but only if Jones
  shows some prior sign of wavering; Jones never wavers and votes from his own convictions,
  so Black never intervenes. My verdict is that Jones is fully responsible even though
  he could not have done otherwise. I therefore take PAP to be false as a universal
  principle.

  (3) What really matters for responsibility, I think, is the actual sequence: the
  action must issue from the agent''s own values and character, without anyone interfering.
  Where the actual sequence is clean, absence of alternatives costs nothing.

