  the likelihood that students import and refuse to drop, ''but which one is really
  the law?''), and an honest note on which feature of the disagreement — the modal
  reach of laws into counterfactuals, or the direction of explanation between mosaic
  and lawbook — the game cannot reproduce and I must supply by talking.


  Format: lead with a three-sentence overview of the session''s arc, then rules, materials,
  timeline, debrief, and the two honesty sections as headed sections; keep the whole
  thing under 900 words."


