  "I teach an upper-level seminar in metaphysics (14 students, 80 minutes, one session,
  movable desks, whiteboard, no laptops needed). We''re about to start the unit on
  laws of nature, and I want the students to feel, before we read a word of the literature,
  the difference between two pictures: that the laws are just the best summary of
  the totality of particular facts, chosen by trading off simplicity against strength,
  with nobody and nothing enforcing them; and that the laws instead govern or constrain
  what the particular facts can be. Design a session where they run into the problems
  of the summary picture themselves.


  Specifically, I want the game to include these stages, or better ones of your own
  devising: (1) teams receive a finite ''mosaic'' of particular facts — I''d like
  a concrete, physically realizable dataset... (2) they compete as systematizers producing
  candidate lawbooks, scored on simplicity and strength under an exchange rate I fix...
  (3) at least one round must produce a genuine tie or an underdetermination result:
  two clearly different lawbooks tied under the announced exchange rate, so lawhood
  comes out relative to a choice the participants never made... (4) a ''miracle''
  round: the mosaic contains a sparse handful of exception-events, and teams must
  decide whether a simpler law plus declared exceptions beats a messier exceptionless
  law — I want them to discover that the summary picture has to buy simplicity by
  tolerating miracles. Then a debrief that maps each moment of the game onto a part
  of the dialectic.


  One constraint I care about: the game must not secretly smuggle in a governing rule.
  If you have the facilitator generate the mosaic from a hidden ''true'' generating
  rule, students will treat their candidate lawbooks as guesses at that rule — which
  is exactly the governing intuition the summary picture denies. Either design around
  this or make it the debrief''s punchline.


