  absurd even though they could perfectly well be true. In the piece I''ve committed
  to a particular explanation, and before I file it I want someone to stress-test
  that commitment.


  The explanation I''ve adopted: the absurdity is a fact about assertion, not about
  propositions. To assert that it''s raining is to present myself as believing it
  — that''s just what the speech act of assertion involves. So the second clause of
  the Moore sentence cancels, in the very same breath, what the first clause does:
  the speaker offers a guarantee with one hand and disclaims the warranty with the
  other. The proposition expressed is consistent, and the sentence can be true; what''s
  impossible is performing the speech act sincerely. I find this satisfying, and I''d
  like to keep it.


  But three loose ends worry me, and I''d like you to work through them as a philosopher
  of language would — carefully, and one at a time before you rank anything.


  First, the evidential variant. Consider: "It''s raining, but I have no reason whatsoever
  to think it is." No belief is being avowed or disavowed here, so the sincerity condition
  on assertion seems not to be engaged — yet many people find this sentence almost
  as absurd as the original. Does this sink the assertion-based explanation, or is
  it a second, parallel phenomenon that the view can absorb with a small extension?
  Second, embedding. "If it''s raining and I don''t believe it, the picnic is ruined."
  The pragmatic story predicts such sentences should be perfectly fine, since nothing
  is being asserted inside a conditional; many readers agree, but some report a faint
  residue of absurdity. Which reading of this fact cuts for the view and which against?
  Third, tense. "It rained last Tuesday, but I don''t believe it did" is typically
  judged less absurd than its present-tense cousin — a fact my explanation seems to
  predict nothing about.


  Give me a ranked map of what counts against the view I''ve adopted — from fatal,
  through serious but survivable, to merely awkward — and for each item say whether
  a defender of the view would concede it as genuine counterevidence or explain it
  away, and whether that explaining-away is principled or ad hoc. Then step back and
  tell me honestly whether the view has been insulated into unfalsifiability, and
  whether, for an explanation of this kind, that would be a defect.


  Finally, since I''ll be staking a column on this: tell me what would change your
  verdict — which of the three loose ends, if argued differently than you''ve argued
  it, or which consideration I haven''t raised, would move you to a different conclusion
  — and flag where in your own reasoning you''re least confident.


