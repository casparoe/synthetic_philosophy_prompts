  At the last meeting of my metaphysics reading group, two members — Petra and Jonas
  — spent two hours on van Inwagen''s special composition question (under what conditions
  do some things compose a further thing) and ended by asking me to referee. I couldn''t.
  Here is the exchange as close to verbatim as I can reconstruct it.


  (1) Petra argued for unrestricted composition: absolutely any things, however scattered,
  compose something, so there is an object whose only proper parts are my left shoe
  and the Eiffel Tower. Her argument was the argument from vagueness. Start with particles
  arranged as a living human — they compose something. End with particles scattered
  one to a galaxy — they compose nothing (or anyway everyone agrees they compose nothing
  interesting). Now move continuously from the first case to the second, one particle
  at a time. If composition is restricted, it must switch off somewhere; and wherever
  it switches off, arrangements differing by a single particle straddle the cut-off,
  so that there is a perfectly sharp line in reality, with no qualitative difference
  on either side to mark it — which she claimed no one could believe. The only alternative
  to universalism is that composition is vague, and existence cannot be vague: there
  can be no indeterminate fact about how many things there are.


  (2) Jonas replied that the argument conflates vagueness in the word with vagueness
  in the world. He grants a moderate answer: some things compose something when their
  activity is sufficiently unified — lives, artifacts, maybe organisms and whatever
  else metaphysics crowns. And yes, there will be penumbral cases where we can''t
  tell whether composition occurs. But that is exactly what a sorites-sensitive predicate
  looks like, and the standard treatment is epistemicism: there is a determinate fact,
  sharp but unknowable. Sharp boundaries in the penumbra of "heap" bother no one;
  why should sharp boundaries in the penumbra of composition be metaphysically impossible
  rather than merely uncomfortable? His moderate answer needs no theory of where the
  line is, any more than our concept of a heap needs one.


  (3) Petra answered that "heap" gets its sharpness from us: it''s a word whose penumbra
  reflects the sloppiness of our conventions, and nothing in the world answers to
  it. But composition purports to answer a question about what exists. If the line
  between composing and not composing were like the line between heaping and not heaping,
  then how many objects exist would depend on the contours of our vocabulary, and
  reality would literally be settled by where English happens to run out. She pressed
  the point with counting: on Jonas''s view, adding a single electron to a swarm that
  does not compose anything can bring it about that there are exactly n+1 objects
  rather than n — a difference in the inventory of the world with no qualitative difference
  to ground it. Sharpness in "bald" costs us nothing because baldness is not existence.


  (4) Jonas said the counting point cuts against her too, and harder. On unrestricted
  composition, for any objects whatsoever there are all the fusions, gerrymandered
  or not — the shoe-Tower thing, the thing composed of Caesar''s nose and every currently
  falling snowflake. Count how many objects are in this room, she should say: an astronomically
  large number, essentially all of them things no science or common sense has any
  use for, and the honest answer to "how many things are here" becomes useless. If
  a metaphysics of composition is tested by delivering sane counts, hers fails more
  spectacularly than the moderate''s. And then he made his real move: the deflationary
  one. Strip away the composite-talk and Petra and he agree on absolutely everything
  about which particles exist and how they are arranged. When she says the shoe-Tower
  thing exists and he says there is no such object, what — beyond a preference for
  how to use the quantifier — could their dispute be about? The special composition
  question looked deep because we mistook a convention about when to count as one
  for a discovery about when there is one.


  (5) Petra''s last word: the deflationary move proves too much. The mereological
  nihilist says the desk does not exist — only simples desk-wise arranged. If that
  is verbal, then it is also verbal whether there is anything besides simples, and
  it is verbal whether there are persons, and van Inwagen — who denies chairs but,
  as he concedes in Material Beings, cannot bring himself to deny that he himself
  exists — would be engaged in a purely terminological exercise on both ends. A dispute
  about what exists that we can neither ignore nor settle by stipulating meanings
  is substantive. The shoe-Tower question is where that substantiveness becomes uncomfortable
  for her, she admitted; but the alternative is to tell people that whether they exist
  is a matter of bookkeeping.


