  A friend in my decision-theory reading group has produced an argument that begins
  as a defence of Hofstadter''s superrationality and ends by swallowing it. I can''t
  locate the error, and I''d like a careful diagnosis. Please answer in British English.


  First, the setup, so nothing depends on the history. Hofstadter''s Luring Lottery
  ran in his Scientific American column in 1983: readers were invited to submit a
  positive integer, and the prize of $1,000,000 (nominal) would go to whoever submitted
  the largest number — but split equally among all entrants who submitted that largest
  number. So if four people tie at the top with 10^100, each is owed $250,000; and
  if everyone submits the same number, everyone is owed $50,000 [with 20 entrants
  — stipulate: suppose exactly twenty entrants]. Competitive reasoning spirals: whatever
  you think others will send, send more; so "rational" entrants send googolplexes
  and, if many do, each nets a derisory share. Hofstadter''s superrationalist instead
  reasons: "we twenty are reasoning identically about the same problem; if submitting
  1 is what I conclude, it is what we all conclude; so we all submit 1 and each takes
  $50,000 — far better than the escalated outcome." [Check the actual detail: did
  he say superrationalists would all send 1? I believe yes.]


  Now my friend''s argument:


  (1) A rational agent performs the act whose expected utility, conditional on everything
  it knows, is highest.

  (2) If I know that another agent reaches conclusions by the very reasoning I use,
  on the same information, then my settling on a conclusion is conclusive evidence
  that they settle on it too; the same holds for the acts those conclusions prescribe.

  (3) In the lottery, suppose all twenty entrants reason identically. By (2), each
  entrant''s submission is a certainty given their own: the only live outcomes are
  the twenty-way ties. Any common submission nets each $50,000, and no deviation is
  available, since a profitable deviation for one is a profitable deviation for all,
  which returns everyone to a tie at a higher number with the same payoff. So the
  superrational submission is decided, and each does far better than the competitive
  entrants — this is the result my friend starts out defending.

  (4) But (2) cannot sensibly be restricted to perfectly identical reasoners. If my
  co-entrant is a stranger with, say, an 80 per cent chance of deciding as I do, then
  my coming to a conclusion is strong evidence of his coming to it, and by (1) I must
  weigh the conditional outcomes: if I submit 1 and he submits 1, we each do well;
  if I submit a huge number, I should expect he does too, and we both do badly. So
  the superrational conclusion binds here as well.

  (5) There is no natural stopping point between the 100 per cent mirror and the 80
  per cent stranger — every human is to some degree a mirror of every other — so (1)
  and (2) together oblige us to treat our own deliberations as evidence about the
  deliberations of whomever we resemble, and to choose accordingly.

  (6) Therefore superrationality is not a distinctively game-theoretic idea at all:
  it is just ordinary evidential decision theory applied to people, and Hofstadter''s
  special authority for the common submission evaporates. Worse, the same logic obliges
  cooperation in one-shot prisoner''s dilemmas with strangers, obliges giving to charity
  whenever one''s giving is evidence that similar people give, and generally recommends
  acting as if one''s character choices reached out and arranged other people''s characters.


