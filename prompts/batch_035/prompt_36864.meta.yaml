  Draft:


  "I hold the whole-brain criterion of death: a human being is dead when and only
  when all functions of the entire brain, including the brainstem, have permanently
  ceased. Tell me what would count against it. In particular, I''d like to know how
  much weight to give to the phenomena that critics usually cite — patients who satisfy
  the criterion yet retain hypothalamic function and thus some integrated bodily activity;
  controlled donation after circulatory death, where organs are removed after only
  a few minutes of asystole on the grounds that circulation would never resume, apparently
  conflating ''irreversible'' with ''permanent''; and cases like that of the California
  teenager declared brain-dead who, after being transferred elsewhere, showed some
  recovered responsiveness years later. Sort the defeaters by decisiveness: which
  would a committed defender of the criterion concede as counting against it, which
  would they explain away as artifacts of imperfect diagnosis, and does the defense
  at some point collapse into defending a legal convention rather than a biological
  fact? Finally, be honest about whether the view has been qualified so often — whole
  brain vs. higher brain, functions vs. capacity for function, irreversible vs. permanent
  — that nothing short of a walking, talking ''brain-dead'' patient would falsify
  it."


  Avoid mentioning Jahi McMath by name? It''s well documented and widely known in
  bioethics; but to be safe, describe without name ("the California teenager declared
  brain-dead in 2013 who was maintained on support... later showed response to commands").
  That''s fine without needing exact facts. Actually keep it vague: "the widely reported
  case of a child declared brain-dead whose family maintained bodily support for years
  and who was later found to have some returned neurological function." That''s safe.


  Keep prompt relatively short. Also don''t use quotation marks around real quotes
