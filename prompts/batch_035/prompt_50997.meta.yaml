  I teach a first-year philosophy of language course; my section has 14 students and
  runs 75 minutes. Next week''s topic is Wittgenstein on words that apply without
  a common essence — family resemblance, and the thought that a word''s application
  can be in order as it is even when nothing draws its outer boundary. I don''t want
  a lecture; I want a staged activity in which the students run into the phenomena
  themselves, with the debrief doing the mapping to the text afterwards.


  The activity should have two movements.


  First movement: definitions fail. Students should be led, in groups or individually,
  to write a definition of "chair" (deliberately not "game," which every textbook
  trots out), test it against a set of borderline items I will present — a beanbag,
  a saddle, a tree stump that people sit on, a throne, a bench, a chaise longue, an
  item with a seat and back that has somehow grown out of the floor, one that wags
  an appendage — and revise it repeatedly. The last few items are chosen to echo the
  thought experiment in the Philosophical Investigations around §§79–80, where Wittgenstein
  imagines a chair behaving oddly and still counting as a chair, and strips facts
  away from the name "Moses" until it''s unclear what the name still answers to. [Careful:
  §79 is Moses, §80 is chair. Split correctly.]


  Then a twist: even after every definition has failed, the group should be asked
  to classify a final set of genuinely new items — and should discover, as a matter
  of fact recorded on the board, that they mostly agree with one another. The datum
  I want them to feel is that agreement persists without shared criteria: they mostly
  agree with one another about chair-claims while disagreeing about what makes something
  a chair.


  Second movement: proper names. Something structured around the "Moses" case: a list
  of facts (that he led the Israelites out of Egypt, was the man called "Moses" in
  certain texts, etc.) removed one at a time, with students voting at each removal
  on whether the name still applies, and asked to justify — revealing that different
  students are using different determining features.


