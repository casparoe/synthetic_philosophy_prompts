  the debrief mapping each phase onto parts of the idea, predicted failures and fixes,
  and an honest note on which feature the activity cannot reproduce. In the debrief
  I especially need the distinction between family resemblance and mere vagueness
  — students will conflate this with the sorites paradox from an earlier week, and
  I need the debrief to block that conflation rather than encourage it. And it should
  surface the point about agreement in judgements as the background against which
