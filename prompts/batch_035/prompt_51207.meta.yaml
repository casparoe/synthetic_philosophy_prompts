  The setting, briefly, so that the diagnosis can engage with what the parties actually
  say. Both sides accept the same data: there are borderline cases of ''heap'', ''tall''
  and ''bald''; each predicate is sorites-susceptible; competent speakers feel that
  there is no determinate boundary between heap and non-heap. Beyond that, they part
  company. The epistemicists, in the tradition of Timothy Williamson''s Vagueness
  (1994) and Roy Sorensen''s work, hold that every vague predicate in fact has a sharp
  boundary, fixed by our usage, but one that our constitutive limitations make unknowable:
  vagueness is a kind of ignorance. The supervaluationists, in the tradition of Kit
  Fine''s ''Vagueness, Truth and Logic'' (1975) and developed by Rosanna Keefe, hold
  instead that vagueness is semantic indeterminacy: vague expressions admit a range
  of equally admissible precisifications, a sentence is true only if true on all of
  them, and borderline statements are neither true nor false.


  My working hypothesis, and I present it only as a hypothesis, is this: both parties
  can agree on every observable fact about speakers — their dispositions to assent,
  their tolerance of small changes, their reluctance to assert either that p or that
  not-p in the border zone — and the remaining disagreement is not about vagueness
  but about what it takes for the use of a word to determine truth conditions: the
  epistemicist thinks that anything less than a determinate extension in each possible
  world fails to make sense of truth, whilst the supervaluationist thinks that a semantic
  machinery of precisifications suffices, so that there is simply no further fact
  for the epistemicist to be pointing at. But I can also see the shape of a rival
  diagnosis: that the two camps are answering different questions under one heading
  — one a question in the philosophy of language (what does our word ''heap'' mean?),
  the other a question in the philosophy of truth (must truth be bivalent?) — and
  that the appearance of direct contradiction, over whether a borderline statement
  lacks a truth value or has one unknowably, is generated by equivocation on ''determinately''.


