  As a philosopher of language who has taught the vagueness literature for the better
  part of thirty years, I have grown steadily less confident that the debate between
  epistemicists and supervaluationists about vagueness is a single disagreement at
  all, and I should like a diagnosis of it rather than another round of the usual
