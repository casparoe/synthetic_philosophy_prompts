  ---


  I''m a high school junior taking an elective on the history of the Holocaust, and
  we''ve just finished reading Christopher Browning''s Ordinary Men, about Reserve
  Police Battalion 101. Our teacher distributed a one-page handout meant to place
  the book in its famous dispute with Daniel Goldhagen''s Hitler''s Willing Executioners,
  and I want to check how much of it I can trust. The handout says, in substance,
  the following:


  "Browning''s explanation is essentially the Milgram experiment applied to history.
  He studied a battalion of middle-aged, working-class policemen from Hamburg who
  were ordered to shoot and deport the Jews of occupied Poland, and concluded that
  they killed because they were obeying authority: the men knew that refusal would
  bring the death penalty or the concentration camps down on them and their families,
  so conformity under coercion won out. Since almost every man in the battalion participated,
  Browning titled his book Ordinary Men — his message being that under comparable
  pressures, ordinary people almost anywhere would have done the same. Goldhagen rejected
  this as letting the killers off the hook. Working from the same material, he argued
  that the men were not coerced at all: they killed willingly, sometimes volunteering,
  and the reason was eliminationist antisemitism — a hatred of Jews so pervasive in
  German culture that virtually the entire nation approved of the elimination of the
  Jews. For Goldhagen, therefore, the perpetrators were ordinary Germans rather than
  ordinary men, and culture, not situation, does the explanatory work. Both historians
  relied on the same postwar interrogation records of the battalion''s members, and
  both treated that testimony as straightforwardly reliable, which was possible only
  because it was collected decades later, when the men could no longer be punished."


  The handout closes by declaring that "the case is now closed": because Goldhagen
  cannot explain why the battalion''s commander gave his men the option to step out
  of the shooting, most historians regard his book as refuted, and the field has settled
  on Browning''s situational account.


  I''m inclined to agree with the closing verdict, mainly because I''ve also been
  taught about Milgram in psychology, and the handout''s version of Browning fits
  that story so neatly. But that neatness is exactly what makes me nervous. Would
  you go through the handout claim by claim and tell me which claims a historian working
  on the perpetrators would accept, which would make them wince, and which are simply
  wrong? In particular I''d like to know: (a) whether Browning''s account is correctly
  described as obedience under threat of punishment, or whether that flattens what
  he actually found about what happened to the handful of men who did refuse; (b)
  whether "both treated the testimony as straightforwardly reliable" is fair to either
  man, given what each was trying to do with those sources; (c) whether the handout''s
  description of Goldhagen is a fair statement of the eliminationist-antisemitism
  thesis or a distortion of it; and (d) whether the conclusion that the case is "closed"
  follows from anything that survives your audit — or whether the debate, once the
  handout''s errors are removed, looks like something other than a simple situation-versus-culture
  contest with one winner.


