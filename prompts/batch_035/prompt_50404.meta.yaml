  2. Approval-directed agents (approach where the agent chooses actions that we would
  approve of, evaluated moment to moment) seem to solve corrigibility in a way goal-directed
  agents don''t.

  3. But I think an agent that reliably does what I''d approve of, evaluated over
  my whole reflective equilibrium including my values about the long-term future,
  is basically the same thing as a goal-directed agent maximizing a fixed goal (approval
  as the utility function).

  4. I also hold that "human approval of an action" is mostly constituted by human
  approval of outcomes/consequences, so approval-direction collapses into consequence-based
  ranking.

  5. I think there''s a real and important difference between goal-directed and approval-directed
  agents — not just a relabeling — because approval is indexed to the moment of evaluation
  and to particular humans, so it shifts over time.

  6. And I think that an agent whose directive changes as we change our minds is safe
  only if we''re sure our changes are improvements — which is the same epistemic trust
  problem as giving a goal-directed agent the goal "whatever humanity ends up endorsing",
  which is basically CEV... which looks goal-directed again.


