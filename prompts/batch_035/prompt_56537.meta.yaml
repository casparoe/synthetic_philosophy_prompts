  ---


  I write about science and ideas for a general-interest magazine, and I am building
  an interactive feature for our website: a diagnostic quiz, provisionally titled
  What Do You Actually Think a Belief Is?, organized around Daniel Dennett''s distinction
  between the physical, design, and intentional stances and his claim, developed in
  his 1991 essay Real Patterns, that beliefs and desires are real in roughly the way
  biological species or centers of gravity are real — as robust, predictively useful
  patterns in the physical grain of things. The editorial conceit is that almost no
  reader holds one stance consistently. The same person will describe their dog as
  wanting to be let out, their laptop as designed to sleep when the lid closes, and
  a hurricane as nothing but weather, without noticing that these are three different
  explanatory registers. The quiz''s job is to expose that hidden structure: it should
  sort readers by how they react to cases, not by which philosophical label they would
  claim for themselves, and it must be fully answerable by an educated reader who
  has never heard of Dennett.


  Please design the quiz accordingly, under the following constraints:


  1. Eight to ten questions. Each is a concrete case with two or three answer options.
  No question may use the words stance, intentional, functionalism, or any other term
  of art; technical vocabulary may appear only in the scoring key, where each term
  must be defined in one sentence.


  2. The cases must between them force the distinctions that matter. At minimum, include:
  something like a chess engine or a language model, where readers will be tempted
  to treat designed artefacts as having beliefs; something like a bacterium swimming
  up a glucose gradient, which behaves purposively but is usually denied beliefs;
  something like a thermostat, which sits on the border; a question in the spirit
  of Leibniz''s mill — if you could be shrunk down and walk inside the system watching
  its parts interact, would you expect to find the belief as one more visible component,
  and if not, what follows about whether it is there at all; and a question about
  predictive loss — whether a hypothetical superintelligence that could compute the
  particle-level physics of your friend would, in describing her that way, be missing
  something, or merely using more digits than necessary.


  3. At least one question must concern a borderline attribution, where ordinary talk
  is genuinely undecided — for instance whether a person who sincerely says that recycling
  matters while never bothering to sort their rubbish believes it, or which of two
  things an ambiguous remark was really a belief about. The point is to find out whether
  the reader thinks there is a determinate fact here or that the question is ill-posed.


  4. At least one question should test whether the reader''s confidence in mental
  attributions tracks predictability, or something else — the design stance is supposed
  to be invoked when prediction from physics is intractable but the thing was built
  for a purpose, and I want to know which of those two considerations my readers actually
  lean on.


  5. The scoring key must map answer patterns onto a genuine taxonomy, with each leaf
  carrying a name where one exists (real-pattern realism about the intentional stance;
  strict physicalism shading into eliminativism; design-stance deflationism, on which
  talk of belief is shorthand for talk of function; outright instrumentalism, on which
  it is a convenient fiction; and any others you think the space requires) and, for
  unnamed leaves, a note that nobody defends them, plus a sentence on each leaf''s
  most awkward commitment — the consequence its holders find hardest to swallow.


  6. Two kinds of reader interest me most, and the key should make them visible as
  distinct leaves even though neither has a name in the literature: the reader who
  freely grants beliefs to animals but refuses them to machines, and the reader who
  does the reverse. If your question set cannot separate these two from each other,
  or cannot separate real-pattern realism from straightforward functionalism, say
  so plainly rather than papering over it — part of the feature''s message to readers
  is that some of these positions really are hard to tell apart from the inside.


  7. Bear in mind the medium: readers will answer alone, on a phone, in a few minutes,
  and will share their leaf with friends. Each question should be answerable in under
  thirty seconds, and each leaf name should be short enough to be repeated in conversation
  — but do not let this push the quiz toward flattery; an honest result that lands
  as slightly uncomfortable is a better share than a flattering one.


  If it helps, assume the working thesis of the accompanying article: that the interesting
  question is not whether beliefs exist but where the patterns stop — and that most
  people''s intuitions have no consistent answer to that, which is precisely why the
  quiz is worth running.


