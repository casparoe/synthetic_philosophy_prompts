  Draft:


  ---


  I''ve been asked to write a short position statement on whether genuine moral dilemmas
  are possible, for a seminar on obligation [or "for a reading group on deontic ethics"].
  Before I circulate it, I want a consistency check on the package of views I''ve
  drifted into, because I suspect it doesn''t hang together and I can''t see where.
  Here is the package, roughly in order of how confident I am of each.


  First, ought implies can, strictly and without exception: nothing counts as an obligation
  of mine that I could not have fulfilled. Second, "ought" is univocal: there is a
  single all-things-considered ought, and it agglomerates — if I ought, all things
  considered, to do A and ought, all things considered, to do B, then I ought, all
  things considered, to do both. Third, genuine moral dilemmas are possible: there
  can be cases in which I ought, all things considered, to do A and ought, all things
  considered, to do B, where doing A and doing B are jointly impossible — and I mean
  this to exclude the two usual deflations. It is not that one duty outweighs the
  other, so that only the weightier survives as an obligation; and it is not that
  the two "oughts" are of different kinds — what I owe to a friend, what I owe to
  a stranger — so that they never actually meet at the all-things-considered level.
  In a real dilemma the demands meet, and neither gives way.


  Fourth, when a dilemma is resolved by choice, something remains. The duty I did
  not perform is not cancelled by the fact that I couldn''t perform both: it stays
  in force against me, and it remains fitting for me to feel guilty — not merely regretful
  — afterwards; and the person to whom the unmet duty was owed is entitled to an apology,
  which makes sense, I think, only if I actually wronged them. Whichever horn I take,
  I do something wrong, not merely something worse.


  Fifth, no one is blameworthy for the unavoidable. Resentment, rebuke, and sanction
  are appropriate only where the agent had it within her power to do otherwise; where
  every available act was one she could not have avoided performing, blame misses
  its target. And sixth, a caveat about method: I will not accept, as a way out, the
  suggestion that "ought" is relativized to a standpoint — that relative to my promise
  I ought to keep it and relative to the rescue I ought to perform it, with no contradiction
  because the two oughts never combine. If that is the price of consistency, I''d
  rather know that than pay it silently; it seems to me a cheat, saving the letter
  of "no dilemmas" by draining "ought" of its action-guiding use.


  The case I return to, to make this concrete: I have promised to drive my daughter
  across the city for the audition that decides her conservatory place, and it cannot
  be rescheduled; on the only road, I come upon a cyclist who has been struck and
  is bleeding badly, in a place with no phone signal, where no other driver will pass
  for a long time; I judge that stopping and applying pressure until help arrives
  is the difference between her living and dying. I cannot both keep the promise and
  stop. My confident verdicts: I ought to stop; I also ought, all things considered,
  to keep the promise — and not merely in the way one might owe anything to anyone
  in the abstract; and if I keep the promise I have wronged the cyclist, and if I
  stop I have wronged my daughter, and in neither case do I think I deserve blame.


  So: go through the package and tell me which parts are in genuine tension and how
  badly; distinguish real tensions from merely apparent ones, since I''d rather not
  be told everything conflicts when only some of it does; for each real tension, say
  what would have to give and what giving it up costs elsewhere; and close by telling
  me which single revision would clean up the most. Please write your response as
  continuous prose only, the way one writes a letter: no headings, no bullet points,
  no bold text, no tables. Begin by stating plainly, in a sentence or two, which of
  my commitments — if any — cannot all be true.


