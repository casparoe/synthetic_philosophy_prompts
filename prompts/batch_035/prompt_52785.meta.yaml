  "J. O. Urmson argued that the standard threefold division of actions into the obligatory,
  the forbidden, and the (merely) optional cannot accommodate the moral facts. Explain
  the zone of the supererogatory that he proposed, why classical act utilitarianism
  seems to have trouble leaving room for it, and whether Kant''s doctrine of imperfect
  duties provides supererogation with a home. You may use Urmson''s own examples."


  And here is the student''s answer, reproduced in full:


  "Urmson''s point is easiest to see with his example of the soldier who throws himself
  on a grenade to save his squad. That act is clearly not forbidden, and it is just
  as clearly not obligatory, since jumping away would be perfectly permissible. But
  it also isn''t in the zone of the optional — not wrong to do, not wrong not to do
  — the way choosing tea over coffee is. Wait — actually it is in the zone of the
  optional too, since both supererogatory acts and merely optional ones are acts it''s
  permissible not to do; the supererogatory is just the optional zone with extra praise
  attached. In any case the grenade act is the finest act of which the soldier is
  capable, so Urmson adds a fourth zone: acts that are good to do, not wrong to omit,
  and praiseworthy when performed. [The ''Wait — actually...'' is a nice touch showing
  the student almost gets it but then talks themselves out of the correct insight.
  A hasty grader might not notice this self-correction into error.]


  On the second part: for the act utilitarian, the right act in any situation is the
  one that produces the most utility. So in the grenade case the soldier is obligated
  to jump, and jumping away would be wrong; likewise a person obligated to give away
  income until marginal utility equalizes. There is no room for acts that would be
  good but are not required. Urmson took this to show that act utilitarianism is false,
  and I agree, since a theory that cannot praise the grenade-jumper for going beyond
  duty cannot be right. [The subtle issue: Urmson argued it shows utilitarianism can''t
  be a complete account of moral obligation / duty, not straightforwardly that it''s
  false — and the ''likewise a person obligated to give away income'' is Singer''s
  point imported into Urmson. Hmm, the student''s inference ''a theory that cannot
  praise... cannot be right'' — actually utilitarianism can praise him, just as doing
  duty; the issue is praise for going beyond. This is a real subtle conflation: the
  student says utilitarianism ''cannot praise the grenade-jumper'' — false; it can
  praise, it just also requires. Good subtle error.]


  Third: Kant handles supererogation easily through imperfect duties. Perfect duties
  (not to lie, not to murder) admit no latitude, but imperfect duties like beneficence
  demand only that we adopt the maxim, leaving us free to choose occasions. So anything
  we do for others beyond the strict minimum is supererogatory for Kant: praiseworthy
  but not required. And because of this latitude, no particular failure of beneficence
  can ever be criticized — Kant can only condemn a total indifference to others''
  welfare, never any specific omission. Where the utilitarian collapses the supererogatory
  into the obligatory, Kant collapses the obligatory into the supererogatory: for
  him almost everything good we do is beyond duty. [The last claim is bizarre — ''Kant
  collapses the obligatory into the supererogatory'' — that''s a visible overreach.
  Maybe too visible? It''s presented as a clever chiasmus; a hasty grader might read
  it as insight. Actually it''s clearly wrong: imperfect duties are duties, so acts
  within them aren''t beyond duty — that''s precisely the error. Fine to keep.]


