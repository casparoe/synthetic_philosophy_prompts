reasoning_summary: 'Let me pick a domain and type. Domain: structural realism. Type
  2: present someone''s summary of a view and ask whether it is fair. This fits well
  — a summary of structural realism (e.g., from a popular philosophy of science book)
  with subtle misrepresentations: conflating ontic and epistemic structural realism,
  claiming Poincaré/Worrall proved "all objects are just relations," the Newman problem,
  claiming quantum mechanics "proves" it, overstating Ramsey-sentence claims.


  Write a casual prompt, 1-3 paragraphs, maybe a typo, attributed to unnamed source
  (a podcast guest, or "a philosophy of science book my cousin lent me").


  The summary: mostly right, subtle errors. E.g., "structural realism says science
  tells us about relations between things rather than the things themselves; Worrall
  showed this is the only way to resolve the pessimistic induction, because when theories
  change, the equations survive but the entities don''t — so light turned out to be
  waves in an ether, but the math was the same, which shows the ether was never really
  there and only structure is real. Since everything is ultimately just structure,
  electrons don''t exist as objects, only as nodes in a relational network, and quantum
  mechanics proves this because particles have no individual identity. Also since
  two isomorphic structures are identical, any two worlds with the same cardinality
  of objects are the same world, so physics has already answered all metaphysical
  questions."


  Subtle misrepresentations: (1) conflating epistemic SR (structure is all we can
  know) with ontic SR (structure is all there is), presenting the stronger as the
  established view; (2) "Worrall showed" / presenting as refutation of scientific
  realism; (3) the cardinality claim echoes the Newman objection but is presented
  as a consequence SR proponents accept; (4) "light turned out to be waves in ether
  but the math was the same" — actually Worrall''s example: Fresnel''s equations carried
  over to Maxwell; the ether story; the "particles have no individuality" claim from
  French & Krause — overstated as "quantum mechanics proves electrons don''t exist."


  Keep it casual, ask which parts a structural realist would accept, which are wrong,
  whether conclusions follow.


  No quotes from real texts needed — the summary is fabricated, attributed to a friend/podcast.
  No search needed. Write it.


  Length: 2-3 paragraphs, casual, a typo or two.'
