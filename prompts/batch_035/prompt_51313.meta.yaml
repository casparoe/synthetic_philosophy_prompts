  solution is the same liquid (we can verify chemically — it''s the same flask); your
  tongue changed; your report is ''it''s more bitter'' — where is the change located?"
  Students will feel Dennett''s point: the distinction between "the taste changed"
  and "the taster changed" and "the standard changed" can''t be settled from the inside.


  Then the further Chase–Sanborn twist: rating drift over the session without any
  tongue manipulation — between phase 1 and phase 2 re-judging the same samples (no
  candy), ratings drift; and when asked "did you like it more then or now?", students
