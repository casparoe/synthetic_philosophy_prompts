  Let me design: an intro philosophy of mind seminar, ~15 students, 90 minutes. Activity:
  "The blind tasting tribunal." Students taste three anonymously labeled samples (e.g.,
  three dilutions of the same coffee, or orange juice vs. store-brand vs...). Actually
  to make it work: use something like chili intensity or bitterness ratings.


  Better: the core Chase–Sanborn structure is diachronic: person liked coffee years
  ago, now dislikes it; can''t tell whether (a) the coffee beans changed, (b) his
  perceptual experience changed (he now tastes the bitter more), or (c) his standard
  changed (tastes the same, judges differently). The classroom version needs a time
  gap — hard in 90 minutes. Solution: use a within-session trick with misdirection
  — e.g., participants rate a stimulus, then an hour later are asked to recall their
  rating and re-rate, with a confederate/planted information shifting context. Or
  use memory of a rating rather than the stimulus itself: the re-rating asks "how
  bitter was it?" and comparisons reveal memory has drifted toward current standards.


  Alternative design: two-phase within one session. Phase 1 (first 10 minutes of class):
  quick rating task disguised as "warm-up data collection" — rate 5 unlabeled samples
  of, say, dilute tonic water / grapefruit juice variants on bitterness, and record.
  The facilitator tells them it''s for a different purpose (norming data for a later
  exercise — mild deception; flag in debrief). Phase 2 (50 minutes later, after a
  lecture-discussion on something else): re-rating from memory — they must say how
  bitter each sample was, and whether they''d want a full glass. Meanwhile, unbeknownst,
  the samples... hmm, but to isolate, the actual samples should be identical; the
  interest is in memory drift.


  Actually the cleanest classroom trick: in Phase 2 bring back the samples but swap
  two of them, and ask students to detect the swap. Students will confidently "detect"
  changes that aren''t there and fail to detect ones that are — that''s the Chase–Sanborn
  punch: introspection can''t arbitrate between percept change, standard change, and
  world change. Even better: include a "misinformation" element — tell some students
  (via planted sheet) that sample C was the premium one.


  Also, Dennett''s original quining move: the thought that "the coffee tastes the
  same to me as it always did, I just don''t like it anymore" vs "the coffee tastes
  different" — the introspective report can''t decide. The debrief maps: sample changed
  = the world hypothesis; threshold/gained sensitivity (e.g., after drinking water
  or eating a sweet, perception shifts — actual physiological adaptation) = percept
