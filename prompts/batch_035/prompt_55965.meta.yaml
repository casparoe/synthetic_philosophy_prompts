  its past readings compared against what it recorded as the ground truth at the time.
  Theo, who is a reliabilist, is happy to use the self-reports: if the tally says
  the anemometer has been accurate 99% of the time, that gives him a justified belief
  that the anemometer is reliable, which in turn licenses further trust in the readings.
  Mara thinks this is exactly the bootstrapping pattern our seminar called ''easy
  knowledge'': the tally is just the anemometer vouching for itself, and if you let
  it count you could equally get a justified belief in the reliability of a broken
