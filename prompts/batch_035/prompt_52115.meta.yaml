  I am a teaching assistant grading a take-home midterm in an undergraduate course
  on ethics and the value of life. One question asked students to reconstruct David
  Benatar''s asymmetry argument for antinatalism, as developed in his book Better
  Never to Have Been (2006). I would like you to grade the student''s answer. Provide
  a letter grade, then numbered comments justifying it, engaging the answer''s substance
  claim by claim: what it gets right, where it is inaccurate or imprecise, and how
  each issue affects the grade. Keep the entire response under 400 words.


  The exam question, verbatim:


  "David Benatar argues that coming into existence is always a harm, so that procreation
  is always wrong. Set out the four comparative claims that constitute his asymmetry
  between pain and pleasure, and explain why he accepts each of them. Then show how
  the four claims together are supposed to entail his conclusion, making clear which
  claims do the crucial work in the entailment."


  The student''s answer, transcribed:


  "Benatar''s asymmetry consists of four claims. (1) Where a person exists, the presence
  of pain in her life is bad. (2) The presence of pleasure in her life is good. (3)
  Where the person never exists, the absence of pain is good, even though there is
  no one for whom it is good. (4) The absence of pleasure is not bad, because there
  is no one who is deprived of it. Claims (3) and (4) do the crucial work: together
  they imply that never existing can be better than existing, but never worse, since
  the never-existent escape pain without anyone missing pleasure. Benatar grounds
  the asymmetry in a widely shared intuition: we think there is a duty not to create
  a life of misery, but no duty to create a happy one, and the asymmetry explains
  both judgments. From the four claims the conclusion follows: if a person is created,
  the pains of her life are harms to her, whereas if she is never created, no one
  is deprived of the pleasures. So every procreation imposes harm on the one created,
  and failing to procreate deprives no one; coming into existence is a harm, and procreation
  is wrong. The view is, at bottom, Epicurean: as Epicurus observed, where death is,
  we are not — so death cannot be bad for us — and in the same way the absence of
  pain is good for the never-existent precisely because there is no subject there
  to suffer it; nothing that is not experienced can be bad for anyone. The conclusion
  also fits neatly with our attachment to our own lives: on Benatar''s account, a
  life that is worth continuing is thereby one that was worth starting, so existing
  people need not regard their creation as a harm."


