  \ of positions on testimony (śabda), or a decision tree on \"how do you know?\"\
  \ Or the violence domain with a sorting quiz. Let me think about what makes an original,\
  \ \"in the weeds\" prompt.\n\nOption: Nyāya pramāṇas — decision tree taxonomy of\
  \ positions on the sources of knowledge (pramāṇas). The debate: how many pramāṇas\
  \ are there — Cārvāka accepts only perception; Buddhists accept perception and inference;\
  \ Nyāya adds testimony (āptavacana/śabda); Mīmāṃsā adds arthāpatti (postulation);\
  \ Vedānta adds anupalabdhi (non-apprehension); Prābhākara vs Bhāṭṭa debate on whether\
  \ error requires a further pramāṇa (viparyaya vs anyathākhyāti). A decision tree\
  \ from \"I accept that perception is a source of knowledge\" branching on inference,\
  \ testimony, postulation, non-cognition, and the status of error — leading to leaves:\
  \ Cārvāka, Buddhist (with sub-schools Sautrāntika/Yogācāra), Nyāya-Vaiśeṣika, Mīmāṃsā\
  \ (Bhāṭṭa vs Prābhākara), Advaita Vedānta.\n\nThis is nicely \"in the weeds\" but\
  \ relies on concepts LLMs do have memorized (pramāṇas, these schools). The tree\
  \ structure needs to be built from the logical space: which instruments of knowledge\
  \ you accept, and how you handle error. Good.\n\nHowever, the instructions say the\
  \ prompt should inject \"new/niche ideas\" so the model can't regurgitate. The tree-from-logical-space\
  \ approach does that: first define the questions, then locate schools in that space,\
  \ note unoccupied combinations.\n\nConcern: small LLMs might not have properly memorized\
  \ the details of e.g. anupalabdhi or arthāpatti, or the Bhāṭṭa/Prābhākara split.\
  \ But the prompt itself can seed the necessary content — the asker can describe\
  \ the distinctions within the prompt so the model doesn't need to recall them. That's\
  \ the standard trick: inject the niche specifics into the prompt so the model only\
  \ needs to do the classification work.\n\nSo: the asker is teaching an intro to\
  \ Indian philosophy course, wants a \"which epistemological school do you actually\
  \ hold?\" decision tree. The asker supplies the diagnostic questions themselves\
  \ (or asks the model to design them but gives the raw distinctions). Better per\
  \ the type notes: asker specifies angle — which positions must appear as leaves,\
  \ which cases must be used, audience, size.\n\nLet me draft. Requirements:\n- 1-3\
  \ paragraphs, formal, American English.\n- Type: taxonomy/decision tree with branch\
  \ questions phrased answerable without labels.\n- Fix audience and size.\n- Avoid\
  \ verbatim quotes (none needed).\n- The asker should inject the niche specifics\
  \ so the model can work from the prompt.\n\nDesign: The tree starts from a concrete\
  \ case, not labels. Diagnostic nodes could be:\n\n1. Can you ever be entitled to\
  \ believe something on the say-so of a trustworthy expert whom you cannot check?\
  \ (tests perception-only vs accepting śabda — Cārvāka says no)\n2. The smoke-fire\
  \ case: if you see smoke on a distant hill, is that a reason to believe fire is\
  \ there even though you don't see the fire? (inference)\n3. A trustworthy cook tells\
  \ you the dish contains no peanuts though it tastes of them... or classic arthāpatti\
  \ case: Devadatta is alive and fat but never seen eating by day — postulate he eats\
