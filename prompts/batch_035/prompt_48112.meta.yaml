  I serve on a hospital clinical ethics committee, and I''ve noticed an asymmetry
  in how we treat advance directives that nobody on the committee can justify in principle,
  only by convention. When a patient wrote a directive while competent that refuses
  treatment — declining dialysis should she develop advanced dementia, for instance
  — we honor it without much hesitation, even when the patient, now demented, is content,
  asks for the treatment, and would suffer from the refusal. The earlier self, we
  say, had the authority to decide for this one, and the fact that the current self
  disagrees doesn''t matter. But when a directive requests rather than refuses — asks
  that everything be done, including aggressive interventions the now-demented patient
  visibly hates, or (where it is legal) requests a life-ending act at a specified
  point the current patient no longer wants — we weigh the present patient''s wishes
  and welfare heavily and often let them override the directive. So the earlier self''s
  "no" binds, but its "yes" barely does. We are comfortable letting the past self
  veto, and uncomfortable letting it command.


  I''d like someone to reconstruct the theory of the earlier self''s authority that
  this practice presupposes — what view of whose interest is at stake, and of which
  self gets to speak for the person, makes the asymmetry look principled rather than
  arbitrary. A few possible lines occur to me, but I don''t trust my own diagnosis:
  perhaps the practice assumes the competent self has special access to the person''s
  enduring values, so its refusals track what the person would want, while requests
  merely predict and can be corrected by the present patient''s actual welfare; perhaps
  it assumes a protected baseline of bodily integrity that only the current occupant
  can waive, so earlier selves can refuse but never authorize; or perhaps it is really
  a policy about who bears the burden of error under uncertainty about the current
  patient''s real wishes. Please say which of these (or something else) the practice
  actually needs, whether the parts of the practice presuppose consistent things,
  and where the practice is underdetermined — where several different theories of
  personal identity or autonomy would equally license it. Then tell me what would
  have to change in the committee''s practice if we replaced the implicit view with
  a strict view that the earlier competent self''s recorded values bind in full, or
  with a purely presentist view that the current patient''s experiences and wishes
  are all that counts. Finally, please flag how confident you are in the reconstruction
  and single out the point you are least sure of.


