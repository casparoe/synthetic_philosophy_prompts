  Essay:


  "Benacerraf''s 1973 paper ''Mathematical Truth'' argues that we cannot have both
  a satisfactory semantics for mathematics and a satisfactory epistemology of mathematics.
  On the side of truth he assumes what he calls the standard view (in effect Tarski):
  arithmetic sentences are true or false in virtue of the properties of, and quantification
  over, abstract objects. If ''3 is prime'' is true, that''s because a particular
  object, the number 3, has the property of primeness, just as ''Jupiter is a planet''
  is true because Jupiter has a property.


  On the side of knowledge, Benacerraf argues for a causal account of knowledge: a
  belief counts as knowledge only when the fact believed stands in an appropriate
  causal relation to the believer. Numbers, being abstract, enter into no causal relations,
  so no belief about numbers can be knowledge. Benacerraf concludes that mathematical
  knowledge is impossible and therefore that platonism is false.


  But the causality point is really the second horn. The deeper horn, which he sets
  up earlier in the same paper, is the identification problem: he imagines two children
  who learn arithmetic and set theory together, one identifying the natural numbers
  with the von Neumann ordinals, the other with the Zermelo ordinals. Both children
  can do all the same arithmetic and nothing in their practice settles which objects
  the numbers really are. Since any ω-sequence would do, there is no fact about which
  set-theoretic objects the numbers are, and so the standard view of truth fails:
  the truth-conditions it assigns are indeterminate.


  The platonist can reply, following Gödel, that we know mathematical truths by intuition,
  a faculty analogous to perception, which puts us in causal contact with abstract
  objects...


  Finally, the dilemma lapses anyway once the causal theory of knowledge is abandoned,
  which it was; so what survives is only the identification problem, and structuralism
  answers that."


