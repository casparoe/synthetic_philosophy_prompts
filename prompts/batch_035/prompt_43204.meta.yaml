  controls only that one choice under 50/50 beliefs, and recommending 4 smuggles in
  the fantasy of precommitment. A second camp holds that ex ante policy evaluation
  is the correct criterion and the driver gets 4, treating the 4/3 calculations as
  artifacts of evaluating at the wrong point. A third camp — associated with people
  working on "updatelessness" and functional decision theory — says the whole framing
