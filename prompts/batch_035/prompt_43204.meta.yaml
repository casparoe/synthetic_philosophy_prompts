  I''m a graduate student taking a seminar on decision theory, and a debate that resurfaced
  in our sessions has stalled in a way I find instructive. The case is the absent-minded
  driver, introduced by Piccione and Rubinstein in the American Economic Review in
  1997 (I won''t rely on the details; here is the setup as we covered it). A driver
  heads home at night and must exit at the second of two identical intersections on
  a highway. At each intersection he can only CONTINUE or EXIT, but he is absent-minded:
  when he reaches an intersection he cannot remember whether it is the first or the
  second, and from his point of view each intersection is equally likely to be the
  one he is at. Payoffs: exiting at the first intersection gets 0 (a motel in a bad
  part of town); continuing past both gets 1 (ending on the outskirts); continuing
  at the first and exiting at the second gets 4 (home). Ex ante, the best plan is
  obviously "exit at the second intersection" for a certain 4. But when the driver
  evaluates what to do at an intersection, believing he is at each with probability
  one-half, CONTINUE looks better than EXIT (expected 2.5 versus 2), so by that calculation
  he should continue even at the second — and if instead one asks which mixed policy,
  continuing at each intersection with some fixed probability, maximizes the ex ante
  payoff, the answer is 4/3, well below 4. The paper''s point was that the standard
  tools of game theory give inconsistent and even self-undermining recommendations
  here, and nearly three decades of proposed fixes — treating the driver as a sequence
  of temporally distinct selves, linking the two decisions into one strategy choice,
  and so on — have not converged on anything.


  Paragraph 2: the seminar split. When we discussed what the driver should really
