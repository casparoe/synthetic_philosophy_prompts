  ---


  A request about two distinctions that tend to get conflated in the trolley literature:
  the distinction at the heart of the doctrine of double effect — between harm intended
  as an end or a means and harm merely foreseen — and the distinction at the heart
  of the doctrine of doing and allowing — between harm an agent brings about and harm
  the agent merely allows. Some philosophers have suggested that across the trolley
  family of cases the two doctrines are extensionally equivalent, delivering the same
  verdicts case by case, so that the choice between them is, within this family, partly
  a verbal matter. I would like you to assess that suggestion.


  Work from the following three cases, spelt out so we share the same material:


  1. Bystander. A runaway trolley will kill five people on the main track. You can
  throw a switch diverting it onto a side track, where it will kill one person; had
  the switch not been thrown, the trolley would have proceeded to the five, and the
  one person would have been unharmed.

  2. Footbridge. A runaway trolley will kill five. The only way to stop it is to push
  a heavy person off a footbridge into its path; his body will stop the trolley and
  he will die.

  3. Loop. As in Bystander, you can divert the trolley onto a side track where it
  will kill one person — except that here the side track curves back onto the main
  track just before the five, so that if the one person''s body were somehow not to
  stop the trolley, it would continue on and kill them. His death is thus causally
  necessary to saving the five in a way it need not be in Bystander.


  Please structure your response with the following sections, in this order:


  a. The two doctrines stated (roughly 150 words). Formulate each doctrine precisely
  enough that a defender of it would accept your formulation, and note the main interpretive
  question each faces (for DDE, how to draw the intended/foreseen line; for DDA, what
  counts as doing rather than allowing).


  b. Verdicts on the three cases (roughly 300 words). Present a table with one row
  per case, giving the verdict each doctrine seems to deliver, the reasoning behind
  it, and a column noting agreement or disagreement between the doctrines. Flag explicitly
  the contested point in Bystander: whether flipping the switch should be classified
  as doing the one person''s death or as redirecting a threat with a foreseen death.


  c. Extensional equivalence (roughly 250 words). Assess the suggestion above: within
  these cases and near variants, do the doctrines always agree, or is there some construction
  — for instance, a case of allowing a harm as a means, or a harm that is done but
  clearly not intended — on which they come apart?


  d. The residual difference (roughly 200 words). Suppose they are extensionally equivalent
  across the whole trolley family: say what substantive difference between the doctrines
  nonetheless remains, and what kinds of cases outside the family (e.g., omissions,
  two-agent cases, or threats that would exist without anyone''s action) would reveal
  it.


  e. Overall judgment (roughly 100 words). State which doctrine you take to be doing
  more of the explanatory work in our trolley intuitions, and whether the equivalence
  suggestion survives.


