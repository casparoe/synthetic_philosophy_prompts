  leave you open to being pumped." A slogan: "no sure-loss bets" / "don''t leave money
  on the table." A good one-liner from that domain: "An agent with inconsistent preferences
  can be turned into a money pump." Or Savage/von Neumann: " preferences over gambles
  reveal probabilities." Hmm, "You can''t have cyclic preferences without paying for
  them" — not really a standard slogan. Actually there is: "Rational agents maximize
  expected utility" — that''s the thesis itself, not a slogan. The Dutch book argument''s
  slogan: "If your degrees of belief don''t obey the probability axioms, a cunning
  bookie can make a sure loss off you." Common one-liner: "Incoherence is expensive."


  - Repugnant conclusion + probability estimate: credence that the repugnant conclusion
  is true, decomposed. That works well: decompose into totalism, whether lives barely
  worth living are positive, whether aggregation is additive, etc.


  - Simulation argument + probability: credence that we''re in a simulation, decomposed
  (substrate independence, ancestor simulations feasibility, substrate independence).
  This is well-worn though — Bostrom''s trilemma is famous. But the prompt should
  be "in the weeds." Could add a niche twist: the "blinking penlight" or the simulation
  argument''s assumption of substrate-independence, or the "nested simulations / measure"
  problem.


  - Lexical threshold negative utilitarianism + slogan: "Suffering dominates" or "no
  amount of pinpricks equals a torture" — this is like the slogan "quality cannot
  be summed across a lexical gap." Actually there''s a natural slogan: "You can''t
  add up pinpricks to a torture" — but that''s basically the lexical threshold claim
  itself. Hmm.


  - Updateless decision theory + slogan: "Decide as if once and for all" — that''s
  actually Rawls/ McClennen''s "resolute choice." There''s a known one-liner: "Rational
  agents precommit." Or Yudkowsky''s slogan "TheUDT agent chooses the policy that
  maximizes expected utility, not the action." A slogan from precommitment literature:
  "Burn your bridges" or "In the land of the predictors, the precommitted is king."
  Hmm.


