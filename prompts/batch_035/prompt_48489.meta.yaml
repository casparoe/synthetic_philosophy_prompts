  conclusions the speaker drew (about group differences and about interventions) actually
  follow from whatever is true in the summary. If there''s a contrast case that would
  make the error vivid for readers — the way height got dramatically taller across
  the twentieth century despite its high heritability — I''d like to use it, but only
