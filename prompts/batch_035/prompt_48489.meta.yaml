  Persona: journalist who covers science and ideas for a general readership magazine.
  Formal, polished, elaborate (1-3 paragraphs).


  Draft:


  "I''m a journalist covering science for a general-interest magazine, and I''m working
  on a piece about what behavioral genetics can and cannot tell us. The trigger: at
  a press event last month, a researcher whose new book is about to come out gave
  us a capsule summary of heritability that several colleagues found slippery, and
  my editor wants me to fact-check it before we go to print. The summary went roughly
  like this: ''Heritability is a statistic that tells you how much of a trait is caused
  by genes rather than environment. For something like height, heritability in modern
  populations is around 0.8, meaning 80 percent of a person''s height is genetic.
  IQ shows similar figures in adulthood. Heritability is a property of the population,
  not the individual — but because the heritability of IQ is so high, differences
  in average IQ between groups must be mostly genetic too. And high heritability is
  why programs like enriched early childhood education have such small long-run effects:
  when a trait is that heritable, there isn''t much room left for the environment
  to move it.''"


  Then: "I''d like a careful audit. Which of these claims would a working behavioral
  geneticist accept as stated, which would they accept only with qualifications, and
  which are outright conflations? Please go claim by claim, say what the correct version
