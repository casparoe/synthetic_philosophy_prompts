reasoning_summary: 'Let me pick a domain and type. Good combos:


  - Heritability + "is this summary fair" — a popular article conflating heritability
  of a trait within a population with immutability or between-group differences. Classic
  misrepresentation, well-known to LLMs, good for audit-type prompt.

  - Humeanism vs anti-Humeanism about laws + classroom activity — could design a game.

  - Intelligence explosion + ranking.


  The "summary fairness" type works well with heritability: a science journalist asker
  (perspective is a journalist covering science and ideas) who read a book summary.
  The journalist perspective fits naturally.


  I need to write a plausible summary with one or two subtle misrepresentations, no
  howlers. E.g., "heritability of 0.8 for IQ in modern populations means 80% of intelligence
  is genetic," "so differences between groups are largely genetic," "heritability
  tells us how much a trait can be changed by environment" — subtle conflations. Also
  maybe mention twin studies, shared environment, Turkheimer''s finding. But keep
  it not reliant on citations. Attribute to "a book I''m reviewing" or "a professor
  on a podcast."


  Actually, the journalist persona: "I''m a science journalist preparing a piece..."
  and they interviewed a behavioral geneticist whose off-hand characterization...
  or read a book proposal. That''s a nice frame: the journalist is auditing a characterization
  before publishing.


  The summary: mostly right — heritability is a population statistic, ratio of genetic
  variance to phenotypic variance, doesn''t apply to individuals, doesn''t mean fixed.
  Subtle misrepresentations: (1) saying heritability "measures how much of the trait
  is genetic" without noting it''s variance within a population; (2) saying high heritability
  means environmental interventions would have little effect; (3) sliding from within-group
  heritability to between-group differences being genetic. That''s the classic. Also
  could include the claim "heritability increases when environments become more equal"
  which is actually true-ish (Wilson effect). Maybe include a true-but-subtle part:
  heritability of IQ rises with age.


  The prompt should ask: sentence-by-sentence audit, what a behavioral geneticist
  would accept, wince at, reject; and whether the conclusion drawn survives.


