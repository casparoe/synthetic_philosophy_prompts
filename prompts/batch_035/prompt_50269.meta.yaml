  ---


  I edit a small philosophy-of-mind blog and am putting together an interactive quiz,
  in the style of "which theory of personal identity do you actually hold?" pieces,
  this one titled something like "Do you think the chatbot believes anything?" The
  quiz should sort readers by their answers to concrete cases about attributing beliefs
  and desires to artificial systems — thermostats, chess engines, reinforcement-learning
  agents, LLMs — rather than by which labels they like, so no question may ask "are
  you a functionalist?" outright.


  Build the classification instrument as follows:


  1. First lay out the logical space from four to six diagnostic questions on which
  the main positions genuinely come apart. The cases must include: (a) a household
  thermostat and a plant turning toward light; (b) a reinforcement-learning agent
  that tracks and corrects for a hidden state; (c) an LLM that passes false-belief
  tasks yet, when probed, confabulates reasons for its outputs post hoc; (d) a question
  about whether attributions should be graded ("believes, sort of," "believes in a
  stunted way") or all-or-nothing; (e) a question about whether the reader''s answer
  changes when the attribution is used for prediction versus for blame or legal responsibility.
  You may add further cases of your own devising.


  2. Then implement the space: ten to twelve quiz questions, each a concrete case
  with two or three answer options phrased in plain terms a reader could answer without
  knowing which position it maps to. Each question should target exactly one axis
  of the space.


  3. Give a scoring key mapping answer patterns onto at least seven leaves, which
  must include: Dennett-style instrumentalism (belief attribution as a predictive
  stance that is neither true nor false of the system by itself); a realist view on
  which beliefs require discrete, structured internal representations, so the question
  turns on what is actually inside the network; a liberal functionalist view on which
  the behavioral profile alone suffices; the "qualified" or "stunted beliefs" family,
  on which LLMs have beliefs in an underdeveloped or partial sense; a normative-interpretationist
  view on which a system counts as a believer only if it can be made sense of as largely
  rational, in the Davidsonian tradition of charitable interpretation; and a flat
  eliminativism on which even human belief-talk is a dispensable folk idiom, so the
  AI question dissolves. Add at least one leaf of your own.


  4. After locating positions in the space, note any unoccupied combination of answers
  and diagnose it briefly — is nobody there because the combination is incoherent,
  unattractive, or merely unexplored? Flag any pair of leaves your key cannot separate,
  and say which additional case would separate them.


  The point is diagnosis, not survey: readers should discover what they think about
  cases like (c) before learning what their view is called. No question may presuppose
  a label, and the options must be worded so that they describe cases, not positions.


  Finally, take a definite position yourself. After the scoring key, state which leaf
  you judge most defensible and why, identify the single quiz question you consider
  the sharpest discriminator between the main camps, and say which one question you
  would cut if the quiz had to be shorter and why it is the least informative. If
  you think two of the required leaves actually collapse into one under pressure from
  the cases, say so and argue it rather than preserving the distinction for tidiness.


