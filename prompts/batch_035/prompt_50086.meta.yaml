  the set of balls at step n is {n+1,...,10n}... the intersection over n of these
  sets — actually the limit inf is empty, yes. The student''s set-limit claim is roughly
  right if understood as lim inf/pointwise; the cardinality-limit claim is wrong.
  Good.]


  Also maybe end: "This shows that what happens at the limit is not always what you''d
  expect from the finite stages." Fine.


