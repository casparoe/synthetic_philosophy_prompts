  Word the exam question:


  Part (a): Thomson''s lamp: lamp off at t=0; button pressed at t=1/2 (on), t=3/4
  (off), etc. What is the lamp''s state at t=1 minute? Does this thought experiment
  show that supertasks are impossible, or incoherent, or neither? Explain with care
  what the argument for your answer is.


  Part (b): Modified lamp ("latching switch"): the switch mechanism is one-way: the
  first time the button is pressed, the lamp goes on and stays on regardless of further
  presses. Pressed at t=1/2, 3/4, 7/8, ... What is the state at t=1? Does the existence
  of this determinate supertask bear on the argument in (a)?


  Hmm wait — with a one-way switch that goes on at first press and stays on, the lamp
  is on at every time in (1/2, 1], so at t=1 it''s on, determinately. That''s the
  classic "parity" trick. Alternatively the latching-off version. The on-stays-on
  version is cleaner. Student error: "the lamp is on at t=1 because the final press
  at..." — there''s no final press. Or student might erroneously say it''s indeterminate
  like (a) "because the presses form an infinite sequence." Let me have the student
  get the right answer (on) but reason "the presses converge, and since the lamp is
  on after the first press and no press can turn it off, the last press leaves it
  on" — "the last press" is the slip. Subtle.


  Alternatively student error: claims (b) is "just like" (a) so also indeterminate
  — that would be a more visible error. Keep the subtle one.


  Part (c): Ross–Littlewood: urn, at step n add balls 10n−9 to 10n, remove ball n;
  steps at 1/2, 3/4, 7/8, ... minutes. How many balls at t=1? Justify.


  Student answer draft (write ~350-450 words, first person student voice):


  "(a) The switching times form the sequence 1/2, 3/4, 7/8, ... which converges to
  1, so infinitely many switchings are completed in a finite time — that''s what makes
  it a supertask. The lamp''s states after each switch are on, off, on, off, ...,
  and this sequence has no limit. So the lamp''s state at t = 1 is undefined: it can
  be neither on nor off. I think Thomson''s argument works. The lamp must be on or
  off at t = 1 — there''s no third option for a lamp. But the description entails
  neither. So the description is contradictory, and this shows that supertasks are
  not genuinely possible. You can describe an infinite sequence of tasks, but the
  description can''t be completed consistently.


  (b) Here the lamp is on at t = 1. The first press at t = 1/2 turns it on, and the
  switch can''t turn it off, so every subsequent press leaves it on. Since the last
  press leaves it on, the lamp must be on at t = 1. This is different from (a) because
  the state sequence on, on, on, ... is constant and converges to on. So some supertasks
  have determinate outcomes. But I don''t think this undermines the argument in (a):
  Thomson''s point was about the lamp as described, and the one-way switch changes
  the setup. [Reasonable.] Actually maybe the student should make a subtle error in
  (b)''s bearing on (a): "This shows Thomson was wrong in general: supertasks can
  have determinate outcomes, so the original lamp must have one too, and the description
  of the original lamp is just incomplete" — hmm, that second half is right (incomplete).
  Let me have the student say: "so the original lamp''s description is incomplete
  rather than contradictory, but Thomson''s conclusion that supertasks are impossible
  still follows from (a) alone." That''s internally tense — student holds both "contradictory"
  (a) and "incomplete" (b)? That incoherence is realistic but maybe confusing for
  grading. Alternative: keep (b) error only the "last press" justification, and the
  student says (b) "shows that Thomson overgeneralized, since at least one supertask
  has a determinate end-state, but the lamp in (a) is still genuinely contradictory."
  The grader should catch: if a supertask''s description can be consistent and determinate,
  the general claim ''supertasks are impossible/inconsistent'' is undermined; and
  the inconsistency claim about (a) rests on conflating ''not entailed'' with ''entailed-not''.
  Good — the student''s tension is exactly the subtle material.


  (c): "At t = 1 the vase is empty. Consider any ball, say ball 37. It''s added at
  step 4 and removed at step 37, so it''s not in the vase at t = 1. Every ball has
  a finite step at which it''s removed, so no ball is in the vase at t = 1, and the
  vase is empty. We can double-check with limits: the set of balls in the vase after
  step n shrinks to the empty set, and the number of balls after each step is 9, 18,
  27, ..., which also has limit 0 at t = 1. So the answer 0 is confirmed. [Subtle
