  Prompt:


  "I am the clinical ethics consultant at a 400-bed hospital. Our ethics committee
  keeps getting referred the same kind of case: a written advance directive that conflicts
  with something the patient, now cognitively impaired, says or does in the present
  — and no policy that tells the attending team what to do next year any more than
  this one. The committee has asked me to draft a decision procedure they can actually
  run in a conference room in under an hour, and I want it grounded in the philosophical
  debate about whether and why an earlier self has authority over a later one, not
  just in case law.


  The procedure should distinguish, as its first move, between two readings of a directive
  that our current ad hoc discussions blur together: the directive as an exercise
  of authority (the earlier self giving binding instructions, like Ulysses ordering
  himself bound to the mast) and the directive as evidence (a record of what this
  person valued, defeasible by fresher evidence). The philosophical stakes we keep
  circling: Dworkin''s distinction between critical interests — the interests a person
  has in the shape of their life as a whole — and experiential interests in the satisfactions
  of the moment; the objection that the person lying in the bed now has interests
  of her own that the earlier self cannot claim to speak for simply by having once
  been the same person; and the worry that if we let the earlier self bind the later
  one, we are treating the patient as a means to the closure of a biography she no
  longer knows she has.


  What I need from you:


  1. A stepwise procedure: the questions to ask in order, what counts as a sufficient
  answer to each, and at each step whether the answer sends the case to "follow the
  directive," "follow the present patient," "go to family/surrogate," or "this is
  a value question the committee must decide and cannot derive." It should include
  a diagnostic step for whether the directive was about the intervention it names
  (the feeding tube) or the condition it feared (the state of prolonged dependence)
  — because a directive that says ''no feeding tube'' written by someone who chiefly
  dreaded being a burden may or may not apply to a patient who is content and unbothered,
  and our teams cannot tell which reading to use.


  2. A rule for the hardest type of conflict: directives written years before, by
  a person substantially different in values and temperament from the patient now.
  One committee member proposes a decay rule — a directive loses authority in proportion
  to documented change in the person''s character — and I want the procedure to say
  whether to adopt it, refuse it, or replace it with something workable, with reasons.


  3. Worked applications to three cases, at least one of which must end somewhere
  I won''t like:


  (a) Mrs. A, moderate dementia, wrote a directive eight years ago refusing artificial
  nutrition ''if I cannot recognize my family.'' She now fails to recognize her family
  on most days but not all, is cheerful, eats willingly when the food is offered by
  hand, and has begun, in the last month, saying ''I want to keep going'' at moments
  that the nurses dispute are lucid. Her daughter wants the directive honored at the
  point of any swallowing failure; her son points at the cheerfulness.


  (b) Mr. B, a retired professor, severe dementia, untroubled and affable. Directive:
  ''no heroics, nothing that prolongs the dying.'' He develops a treatable infection;
  antibiotics would likely restore him to his current pleasant state, not to anything
  he would recognize as his life''s work. He cannot discuss it. The team wants to
  know whether the ''no heroics'' clause reaches antibiotics in this state, and the
  family splits between reading the directive as his final judgment on his whole life
  and reading it as a fear of machines and ICU''s that this scenario doesn''t involve.


