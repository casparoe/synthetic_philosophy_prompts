  ---


  Write an essay on whether the numbers should count when a rescuer must choose between
  saving one person and saving several, where no difference between the parties other
  than their number is stipulated. Take as your foil the position associated with
  John Taurek: that no one of the many, considered individually, has any greater claim
  on the rescuer than the one does; that the rescuer wrongs no one by flipping a fair
  coin; and that increasing the size of the larger group therefore never changes what
  may permissibly be done. Present the strongest version of that position you can,
  taking care to include its least intuitive commitment: that a fair coin is no less
  fitting when the contest is one life against a thousand than when it is one against
  one.


  Then test the position in three ways. First, the gradualist test: either the numbers
  start to matter at some point as the larger group grows, in which case there should
  be a principled account of where and why, or they never matter, in which case one
  must accept the coin flip at one-versus-a-thousand; say plainly which horn you take.
  Second, the complaint test: if the many lose the coin flip, no individual among
  them was treated worse than the single person was; so any wrong done must be a wrong
  to no one in particular, or else an appeal to the aggregate loss. Consider whether
  either route is available to a defender of counting, and what it costs. Third, the
  staggered rescue: suppose the rescuer meets the parties sequentially, first confronting
  a choice between the single person and one member of the group, and only afterwards
  the remaining members; a coin at each stage gives the single person the same chance
  of survival regardless of how many others there are. Ask whether this invariance
  is a virtue of the position or a sign that it has lost track of what is at stake.


  The essay should reach a definite conclusion — either the numbers never count, or
  they do count from some point, or they count in some other way you specify — and
  defend it against the strongest opposing argument you have developed. Do not rely
  on appeals to authority or on surveying the literature; the arguments must stand
  on their own.


