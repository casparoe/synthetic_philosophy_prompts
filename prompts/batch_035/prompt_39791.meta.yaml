  Actually the classic analogy in this domain: Hofstadter''s "Letter Spirit" project;
  the analogy that a letter category is like a family resemblance / a species. Common
  analogies in use: "an ''a'' is a Platonic form", "reading a typeface is like hearing
  an accent", "every ''a'' is like a member of a family". Also the categorical perception
  analogy from speech: "letters are like phonemes". Or Wittgenstein''s game/family
  resemblance.


  Type: analogy audit. Common use analogy: "a letter is like a face — we recognise
  faces holistically, in one glance, without listing features; so letter recognition
  is also non-decompositional." This is actually a real analogy used in the literature
  (holistic face recognition vs letter recognition debates). Or: "type designers say
  a letterform is like a dancer — the skeleton matters, the flesh is style." Actually
  there''s the classic type-design idea: a letter has a "skeleton" and the type designer
  clothes it. Gerrit Noordzij: "letterforms are shapes that represent language...
  the skeleton is the form, the ''meat'' is the style." The "skeleton and flesh" analogy
  is genuinely used by type designers — the letter is a skeleton (the essential structure
  that distinguishes ''a'' from other letters) dressed in flesh (weight, contrast,
  terminals, serifs). This is a real, common analogy in typography circles, niche
  enough not to be regurgitated as a standard philosophical topic but conceptually
  accessible.


  The analogy does work: it''s used to say style is inessential — you can strip the
  flesh and the letter remains. And it''s used to teach writing — beginner lettering
  courses teach "skeleton letters first". The question: does the skeleton exist? Counterexamples:
  italic blackletter ''a'' vs roman ''a'' — some letters change their skeleton entirely
  (double-storey vs single-storey ''a'' — the double-storey ''a'' arguably has a different
  skeleton than the single-storey). The double-storey ''a'' isn''t a single-storey
  ''a'' with serifs; it''s a different structure. So the analogy breaks there. Also
  in blackletter, ''a'' looks like a double-storey g-ish thing. Also the "one-storey
  vs two-storey" choice in typefaces.


