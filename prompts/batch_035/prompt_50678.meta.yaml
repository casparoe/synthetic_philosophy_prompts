  Model-friendly: LLMs know the likelihood principle and optional stopping debates.
  Good.


  No quotes from real texts. No citations needed. Length okay. Formal/polished. Format
  request: JSON schema — fits.


  One check: "error-statistical tradition" — this is Deborah Mayo''s term, fine, no
  need to verify since it''s a general attribution I''m confident about. Good.'
