  Prompt text:


  ---


  I''m an early-career psychology researcher. My most-cited study — a two-sided test,
  n = 120, p = 0.03 — has just failed to replicate in a registered multi-lab effort,
  and I have a month to write the response. The complication that keeps me up at night:
  we ran that original study by peeking at the data after every 20 participants, while
  the replication fixed its sample size in advance. My two senior colleagues disagree
  about what this means, and I want to see their disagreement play out properly rather
  than resolve it by whichever one emails me last.


  Write a dialogue between them: one a committed frequentist in the error-statistical
  tradition, who holds that the stopping rule is part of the experiment and that my
  sequential looking made the original p-value a poor measure of how well the hypothesis
  was probed; the other a Bayesian, who holds that the likelihood principle makes
  the sampling plan irrelevant to the evidential meaning of the data, and that the
  real question is what the posterior odds over the two datasets jointly say. Both
  should be genuinely competent: the frequentist should press the Bayesian on what,
  exactly, her posterior is conditioned on and why a rule-dependent error rate isn''t
  a scientific virtue; the Bayesian should press back on why controlling long-run
  error rates at a level no one will ever repeat has any bearing on the credibility
  of my one study. They should respond to each other''s actual points, and it''s fine
  if they end by identifying a residual disagreement rather than a tidy resolution.


  After the dialogue, give me a JSON object with the following schema: {"turns": [{"speaker":
  "frequentist" | "bayesian", "core_claim": string, "responds_to": string or null,
  "status_after_rebuttal": "conceded" | "stands" | "disputed"}], "residual_disagreements":
  [string], "frequentist_advice_to_me": string, "bayesian_advice_to_me": string}.
  In "frequentist_advice_to_me" and "bayesian_advice_to_me", each character should
  say in one or two sentences what I should actually write in my response to the replication,
  given how the dialogue went.


  ---


