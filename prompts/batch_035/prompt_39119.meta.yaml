  attitude" with excusing — excuses vs exemptions distinction (quality of will vs
  impaired agency). A popular summary might conflate "he didn''t mean it" (excuse,
  objective attitude temporarily) with "he''s a child/deranged" (exemption, sustained
  objective attitude). Actually Strawson: excuses involve viewing the agent objectively
  in a limited way? Strawson treats both "he didn''t mean to" and "he couldn''t help
  it" as factors modifying or suspending reactive attitudes; the objective attitude
  is involved. The classic subtle error: presenting the paper as proving libertarianism
  free will, or claiming Strawson argues the reactive attitudes are always appropriate/correct.

