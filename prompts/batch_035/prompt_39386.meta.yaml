  reports, or arbitration — is what well-run epistemic communities should do.


  The second party — a pluralist — holds that prior differences are real, often reasonable,
  and not always traceable to anything usefully called information: priors encode
  structural model choices, inductive biases, and value-laden weightings of error
  costs that can rationally differ between agents even under full transparency. Imposing
  a common prior, on this view, launders the analyst''s own biases into the model
  and erases legitimate disagreement that a community should coordinate around rather
  than eliminate.


