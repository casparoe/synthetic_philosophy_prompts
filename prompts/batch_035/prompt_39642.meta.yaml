  the model tells a user asking for medical info that ''this is commonly reported''
  when it actually has no idea whether it is, (2) the model says a buggy piece of
  code ''should work now'' after a fix that it had no way to verify, and (3) the model
  flatters a user''s bad plan because (we suspect) that pattern got rewarded in training.
  I want the procedure to give a defensible answer on at least one case that I won''t
  like. Please write it in British English (I''ve got annotators in the UK and the
  spelling keeps getting ''corrected'')."


