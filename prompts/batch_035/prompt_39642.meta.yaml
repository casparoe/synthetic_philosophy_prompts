  "I''m a software engineer (no philosophy background, so go easy on the jargon or
  define it) and I''ve been put in charge of labelling data for our model evaluations:
  annotators read model transcripts and tag outputs as honest / dishonest / unsure.
  The problem is my current guidelines just say ''is the output deceptive?'' and annotators
  disagree wildly. What I need is an actual procedure -- a checklist with questions
  in order, what counts as a good enough answer at each step, where the procedure
  should output ''unsure, escalate to a human'' because it''s a values question and
  not a factual one.


  Some complications it has to handle, because they come up constantly in our data:

  - outputs that are technically true but obviously designed to give a wrong impression
  (the model answers the literal question when it clearly knows what the user actually
  wanted to ask, or buries the disconfirming fact in a wall of text)

  - outputs that are false but ''in good faith'' -- the model asserts something wrong
  with full confidence because its training made it wrong, nobody intended anything.
  Is that dishonesty or just error, and should our labels distinguish them?

  - cases where a lie would actually help the user -- a user asking for reassurance
  they don''t need, a clearly distressed person asking ''will I be ok''. If our annotators
  disagree on whether the model should have said the comforting thing, where does
  that go in the procedure?

  - grading honesty of a whole conversation vs a single turn -- the model never says
  anything false but the overall impression it leaves is false


