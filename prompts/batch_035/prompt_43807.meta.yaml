  Let me draft the argument:


  1. An action''s side effects are bad only insofar as they are disvaluable — destroying
  the vase is a side effect worth avoiding only because we disvalue broken vases.

  2. So any measure of side effects is a measure of value: which changes count as
  "effects" (rather than noise), and how big they are, depends on what we care about.

  3. A penalty that measures value in full just is a utility function; and if we had
  a correct utility function we would not need to lean on "avoid side effects" — we''d
  simply maximize.

  4. A penalty that measures value only partially, restricted to "side effects," gets
  its restriction from the same value facts it claims not to need.

  5. Therefore any impact measure either collapses into full value specification (in
  which case the project of low-impact AI is redundant) or is built on a value measure
  it cannot justify (in which case it''s a hidden, un-auditable utility function of
