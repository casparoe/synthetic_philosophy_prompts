  Constraints to impose (per the type):

  - realistic setting (a geriatric ward / care home), no sci-fi;

  - scenario proper in a single paragraph;

  - the case must not smuggle in the verdict by stipulating that the choice was "inauthentic"
  or "not really hers" — the tension must be generated by the theories, not by narrative
  framing;

  - the non-autonomy of the directive''s provenance must fall short of anything that
  would invalidate it under existing legal/clinical standards (so it remains a hard
  case rather than an easy one);

  - after the scenario: walk through each view''s verdict and reasoning; identify
  the isolating feature; say what happens when you remove it; and give the strongest
  counterattack from the camp whose view comes out badly (here, the precedent-autonomy
  camp, or the welfare camp);

  - also perhaps: no appeal to legal doctrine beyond noting it''s indeterminate.


