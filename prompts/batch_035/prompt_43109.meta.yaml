  I think the cleanest spec, following the example structure: construct a case where
  the precedent-autonomy view and the experiential-welfare view agree on following
  the directive, but the critical-interests view dissents and says override. That''s
  a genuine reversal: usually people think critical interests are what give directives
  their force (Dworkin), so it''s surprising that critical interests could argue against
  a directive. When could the integrity of the life-story argue against the patient''s
  own earlier command? When the earlier self wrote the directive for reasons that
  betray, rather than express, her critical interests — e.g., the directive was written
  to spare her family a burden, or under social pressure about being "a burden," i.e.,
  internalised prejudice, not her own valuation of the shape of her life. Dworkin
  distinguishes critical interests as what makes life better from the person''s own
  reflective point of view; a directive motivated by perceived burden on others isn''t
  a critical interest. So the case: a directive that commands continuation of treatment,
  written to avoid "letting the family down" — precedent autonomy honours the command,
  experiential welfare favours... hmm, need welfare also to favour following the directive
  (continuing treatment gives the demented patient contented years). So: earlier self
  demands life-sustaining treatment in dementia; demented self is content and would
  (arguably) be harmed by withdrawal; both standard views say treat; critical-interests
  view says the directive''s rationale — a pledge to others rather than a valuation
  of her own life — fails to engage her critical interests, and the critical interest
  in not having one''s life prolonged in a way she''d reflectively endorse... hmm,
  actually the critical interest would need to favour overriding — i.e., the earlier
  self, properly reflectively, wouldn''t have wanted this continuation for its own
  sake. This is getting subtle but that''s good — it''s "in the weeds."


