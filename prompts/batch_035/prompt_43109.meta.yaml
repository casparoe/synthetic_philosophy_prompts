  Views to deploy (all standard enough / definable inline):

  - V1, Precedent autonomy (Buchanan & Brock): the earlier competent self''s advance
  choice binds because it was autonomous — treat the directive like a command validly
  issued. Verdict tracks: was the earlier choice informed, voluntary, competent?

  - V2, Experiential welfare / best interests in the hedonic sense (Dresser''s line:
  the now-self''s experiential interests). Verdict tracks: quality of the patient''s
  current and future experience.

  - V3, Critical interests (Dworkin): the directive''s authority comes from the patient''s
  critical interests — the integrity of her life as a whole, what she reflectively
  cares about; authority over one''s life''s shape.


  The standard easy case: directive refuses treatment, demented self content → V1
  says honour (refuse), V2 says override (treat), V3 says honour (integrity). Dworkin
  lined up with precedent autonomy against Dresser''s welfare view.


  The hard/reversed direction: V1 and V2 agree the directive should be overridden,
  but V3 says honour it. For V3 to say honour while V2 says override: the directive
  refuses treatment, the demented self is content (V2: treat), but the refusal expresses
  something central to the patient''s critical interests — that''s just Dworkin''s
  own case, and there V1 also says honour. So to get V1 to part company with V3, V1''s
  grounds must fail while V3''s succeed: the earlier self''s choice must fail the
  autonomy conditions that give V1 its grip, yet still be an authentic expression
  of her critical interests. When does a choice fail autonomy but express critical
  interests? — when it was made under conditions that compromise the "informed/voluntary"
  conditions without compromising authenticity: e.g., she made the choice after her
  diagnosis of a terminal precursor condition, in a state of reactive depression...
  but then is it an authentic expression of critical interests? Or: she wrote the
  directive while experiencing what she knew to be clinically significant but distorted...
  Hmm — better: she wrote it under coercion or duress that she nonetheless internalised:
  e.g., she promised her dying husband "I''ll never become one of those people in
  a home; I''ll never let the children see me like that," and the directive executes
  that promise. A promise to a dying spouse — is that autonomous? It''s voluntary-ish;
  but suppose she wrote it in the immediate aftermath of his death, in grief... A
  promise-based directive: precedent autonomy arguably falters because the choice
  is hostage to the promise (not a free exercise of sovereignty but an execution of
  a prior commitment to another), while Dworkin''s critical interests... hmm, Dworkin
  also would be torn. Actually for Dworkin, keeping faith with one''s commitments
  and the narrative unity of one''s life with loved ones IS a critical interest. So:
  the directive refuses treatment; her motive is fidelity to a promise/identification
  with her husband''s horror of decline (they had a shared life project — e.g., they
  were a famous duo, and her critical interest is in the artistic whole they created;
  surviving as a diminished remainder would, in her eyes, betray the shape of the
  life she authored). Meanwhile V1''s conditions fail: she wrote it in the first weeks
  of bereavement, clinically depressed, under pressure from her husband''s final request
  — so precedent autonomy (which demands decisional independence) refuses to validate
  it; V2 says treat (contented demented patient enjoying music, visitors); V3 says
  honour the refusal, because the grief-stricken choice still expressed the organising
  commitments of her life — what she cared about survived the distorting conditions.


