  Check satisfiability:

  - Directive refuses antibiotics/artificial nutrition in advanced dementia.

  - Written by the patient in circumstances that defeat the autonomy conditions precedent
  autonomy relies on (acute bereavement, an insistent promise extracted by the dying
  husband, possibly a depressive episode) — but circumstances that don''t, on their
  face, defeat its expression of her abiding critical interests (her identification
  of her life''s meaning with their shared project — say they were a musical duo,
  "the two of them were the act"; her life-narrative commitment to not outliving the
  partnership in a diminished form).

  - Demented self: content, musical, enjoys visits — experiential welfare favours
  treatment.

  - V1 (precedent autonomy): the directive''s provenance fails the conditions for
  valid precedent (grief, promise, pressure), so the "sovereign command" reading is
  unavailable; the directive is not binding → treat (or at least no reason from autonomy
  to refuse).

  - V2 (experiential best interests): contented life → treat.

  - V3 (Dworkin''s critical interests): what matters is the integrity/shape of her
  life as she understood it; her refusal, though procedurally compromised, expressed
  the organising commitment of that life; following it serves critical interests even
  against experiential interests → honour the refusal.

  - Feature doing the work: the divergence between the procedural conditions that
  make an advance choice a valid exercise of autonomy and the substantive relation
  between the choice and the person''s critical interests. Remove the compromised
  provenance (she writes the same directive in calm, informed circumstances) and V1
  rejoins V3 in honouring it — the dissent was V1''s alone. Remove the contentedness
  of the demented self (make her miserable, or make the dementia the vacant state
  she dreaded) and V2 rejoins V3... wait, if she''s miserable, V2 says refuse → V2
  agrees with V3, V1 still says treat. So each removal collapses one of the two dissenters,
  isolating the features. That''s elegant — the case has two knobs, each of which
  reconciles one dissenting view. I can build that requirement into the spec: "the
  case should be constructed so that removing either compromising feature — the directive''s
  compromised provenance or the contentedness of the patient''s current state — reconciles
  a different one of the dissenting theories, so that each dissenter is tied to exactly
  one knob."

  - Counterattacks: precedent-autonomy defender: the conditions V1 demands are proxies
  for the very authenticity V3 invokes; grief-written promises can express critical
  interests, but then Dworkin''s own appeal to the patient''s "sovereignty" over her
  life collapses into V1''s conditions or becomes moral paternalism — the doctors''
  judgement about her life''s integrity overriding the procedural facts. Welfare defender
  (Dresser/Jaworska line): critical interests don''t lapse with competence — the demented
  patient still engages with music, still values — so V3''s identification of the
  earlier self''s commitments with the person''s critical interests is a mistake;
  experiential current welfare can also be critical.


  Great — jointly satisfiable, non-trivial, isolates variables. This is a strong prompt.


  One more check: is it plausible that precedent autonomy says "treat" rather than
  "silence"? Buchanan & Brock''s precedent autonomy is precisely about extending earlier
  autonomous choices'' authority; if the choice fails autonomy conditions, its authority
  lapses and decision defaults to best-interests or surrogate judgement. Yes, plausible:
  the view says the directive binds because it was an autonomous precedent; a bereavement-grief
  promise-engineered directive isn''t a straightforward autonomous precedent; the
  view doesn''t get purchase. I''ll phrase the spec as: "the version of precedent
  autonomy on which a directive binds only if the earlier choice satisfied the standard
  conditions of decisional autonomy — competence, adequate information, and independence
