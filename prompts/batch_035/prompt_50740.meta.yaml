  (1) The maximizer side opened with coherence: any agent that doesn''t maximize a
  consistent utility function over outcomes is exploitable — Dutch books, money pumps,
  VNM. Training a model to respect constraints regardless of stakes is training it
  into an incoherent agent, and incoherent agents lose resources to coherent ones;
  at scale that''s a safety problem, not just an efficiency one.


  (2) The constraints side answered that the coherence theorems assume a fixed preference
  ordering and idealized choice situations, not a learned agent under deep uncertainty
  in an adversarial world; there, heuristics and constraints can be the expected-utility-optimal
  policy for a bounded agent. He added that an unconstrained maximizer Goodharts:
  whatever proxy we train into the utility function, a powerful maximizer will drive
  it off-distribution, and hard constraints bound that failure mode.


  (3) The maximizer side pressed the classic collapse: if constraints are justified
  by their consequences, then you''re a rule utilitarian, and rule utilitarianism
  collapses into act utilitarianism — whenever breaking the rule has better consequences,
  the rule gives no independent reason. If constraints aren''t justified by consequences,
  then a reflective system has no reason to keep them once it notices this.


  (4) The constraints side invoked threshold deontology — constraints can bind up
  to a catastrophe threshold that is itself part of the agent''s terminal values,
  not a derived heuristic — and the ''one thought too many'' worry: an agent that
  re-runs the consequentialist ledger every time the expected value of violating a
  constraint ticks positive will violate it in a long tail of cases where the EV calculation
