  Let me draft: A dispute between two members of the local LessWrong meetup / an AI
  safety reading group about whether the AI lab where one works should train its model
  to reason deontologically or as a utilitarian. Back-and-forth:


  1. A says: coherence theorems (VNM, Dutch book) show any rational agent must maximize
  expected utility; building an AI that follows constraints instead of maximizing
  is building an inconsistent agent, and inconsistent agents get money-pumped / exploited.

  2. B replies: coherence theorems only apply to agents with a fixed preference ordering
  over outcomes and unlimited computational capacity; an AI in the real world under
  uncertainty and adversarial pressure may do better with heuristics and constraints;
  also humans are not coherent and that''s fine — and more importantly, a maximizer
  will exploit edge cases of the utility function (Goodhart), constraints bound the
  damage.

  3. A: then you get rule worship — if constraints are justified by good consequences,
  you''re a rule utilitarian, and rule utilitarianism collapses into act utilitarianism
  (the "collapses" argument: any rule worth following is worth breaking when breaking
  it has better consequences); if constraints aren''t justified by consequences, why
  would an AI care about them after reflection?

  4. B: threshold deontology — constraints hold up to a catastrophe threshold, and
  the threshold can be part of the agent''s values, not a derived rule; also "one
  thought too many": a system that computes whether to break a constraint whenever
  the EV says so will do so in cases where humans judge it monstrous.

  5. A: thresholds are just covert maximizing — the agent still trades rights against
  utilities once stakes are high, and it hides the cliff-edge behavior: agents that
  follow constraints at 999 lives but trade at 1000 are predictable and exploitable;
  better an honest maximizer with a good utility function.

  6. B: fanatical/pascalian risks — a utilitarian AI is vulnerable to mugging, is
  corrupted by uncertainty about utility; a bounded/constraint-following agent is
  robust; also corrigibility: deontological constraints like "don''t manipulate the
  shutdown button" are easier to specify than a utility function that ranks shutdown
  well.


