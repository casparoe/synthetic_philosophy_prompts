  4. Inertia: the worry that a set of priors can be so unresponsive to evidence that
  you never learn your way out of ambiguity — feature or bug?

  5. Foundations/interpretation: what the set of probabilities is even supposed to
  represent, vs just saying your evidence doesn''t determine a credence.


