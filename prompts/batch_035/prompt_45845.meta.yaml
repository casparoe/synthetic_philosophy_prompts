  I''ve been reading the rationalist blogosphere for a bit over a decade — the Sequences
  era through to the current LessWrong front page — and one theme I keep bumping into
  is the claim that rational agents shouldn''t maximize the arithmetic expectation
  of their wealth but something multiplicative instead. The trouble is that I keep
  encountering two quite different arguments for roughly the same conclusion, and
  I''ve never seen anyone carefully separate them.


  Argument A — call it the ergodicity argument — starts from the observation that
  repeated multiplicative gambles make the ensemble average and the time average diverge:
  if I bet my whole bankroll each round on a favorable coin, the expected value of
  my wealth after many rounds is dominated by vanishingly improbable jackpot branches,
  while the almost-certain typical trajectory goes to zero. Maximizing arithmetic
  expectation is the wrong criterion because it averages over copies of me in different
  branches, and I am not those copies; I live along one trajectory, and along one
  trajectory the Kelly bettor (maximizing expected log wealth) captures essentially
  all of the growth. On this view, choosing Kelly is a matter of correctly computing
  what happens to one person over time rather than to a cloud of parallel people.


  Argument B — call it the bargaining argument — comes out of the geometric rationality
  line of thought on LessWrong: a decision under uncertainty is treated as a game
  between copies of yourself located in different outcomes (or different branches,
  or different times), and expected utility maximization is reconstrued as Nash bargaining
  over those copies'' interests, with the utility scales chosen so the bargain is
  invariant... On this view, Kelly-type behavior is what you get when the copies have
  to agree to a bargain, and the arithmetic maximizer is a tyrant who sacrifices almost
  all copies to enrich one.


