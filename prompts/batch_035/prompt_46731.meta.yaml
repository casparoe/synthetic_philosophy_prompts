  ---


  I''m preparing a session for my department''s decision-theory reading group on a
  pair of cases that circulate in the rationalist-adjacent literature under the names
  "counterfactual mugging" and "XOR blackmail", and I''ve been asked to adjudicate
  rather than merely survey. So that the discussion doesn''t depend on anyone having
  read the original sources, I''ll state both cases in the form I intend to use, and
  the essay should treat my stipulations as fixed.


  The first case runs as follows. A predictor with a long and unbroken record of accuracy
  announces a protocol before the relevant events: it will flip a fair coin. If the
  coin lands heads, it will place £10,000 in your bank account and never contact you.
  If tails, it will do nothing at all — except that, today, it appears and tells you
  the whole story, including that the £10,000 was deposited in the heads-world only
  conditional on its forecast that a tails-you would hand over £100 when asked. It
  now asks for the £100. You can verify the coin only in the crudest way; you are,
  at this moment, fairly sure the coin landed tails — that''s why the predictor is
  in your kitchen and the £10,000 isn''t in your account. But the £10,000 either exists
  or doesn''t regardless of what you do now; paying helps no one you will ever meet,
  unless you count the counterfactual heads-version of yourself as a beneficiary.
  The second case: a blackmailer writes to say, truthfully, that it sends letters
  under a fixed policy — a letter goes to a person exactly when either (a) that person
  will pay the demanded £5,000, or (b) the blackmailer holds a genuine, career-ending
  dossier on them, but not both. It adds that if you refuse and it holds the dossier,
  the dossier is released tomorrow; if you pay, the matter is closed. Reason it out
  and you find that if you''re the sort who refuses, the letter on your doormat is
  evidence that a real dossier exists and will be released whatever you do; whereas
  if you''re the sort who pays, the letter is evidence that there is no dossier, and
  the "threat" you''re paying to avert is empty — you''d simply be paying because
  you''re the sort of person who pays. The seductive reasoning in both cases treats
  your present choice as information about the world: in the mugging, "if I were in
  the heads-world, I wouldn''t be being asked — but my policy now matters to whether
  that world''s version of me was rich"; in the blackmail, "if I don''t pay, the dossier
  exists and is released; so I pay, and lo, the dossier (never having existed) is
  not released."


