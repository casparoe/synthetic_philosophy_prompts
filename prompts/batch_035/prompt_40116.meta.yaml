  for SPIs is a bit thin. Alternatively, concrete situation: "My startup co-founder
  and I..." — like bargaining over a dispute, and someone proposes a randomization
  device / coin flip that both prefer — that instantiates SPI. Actually an SPI is:
  two parties would fight (war/bargaining), a third party or mechanism offers a randomization
  over outcomes that both prefer to conflict, making both better off ex ante without
  changing the bargaining equilibrium. Concrete situation: roommates dispute, landlord/friend
  proposes coin flip plus side payments.


  The classroom activity type could work really well: design a game where participants
  play a modified Prisoner''s Dilemma or a conflict game with a mediator offering
  randomization, so they "feel the force" of the idea that you can Pareto-improve
  safely by conditioning on an event both parties observe. That''s quite in the weeds
