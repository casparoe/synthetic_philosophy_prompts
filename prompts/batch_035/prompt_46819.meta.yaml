  Let me do causation by omission + verdicts-to-principle type. The asker gives verdicts
  on cases:


  Cases:

  1. Gardener who agrees to water plants doesn''t; plants die — caused the death.

  2. Random stranger on other continent who never promised — didn''t cause.

  3. A hundred neighbors each could have watered; none did — did each cause it? Intuition:
  gardener caused it, neighbors didn''t, though all omissions equally sufficient.

  4. Doctor withholds a drug that would with 90% probability have saved the patient
  — caused the death; withheld a drug that would have had 5% chance — didn''t? Thresholds.

  5. Negligent omission vs. deliberate — drunk driver fails to brake vs. asleep passenger.
  Passive safety feature that should have deployed but was disabled.

  6. Butterfly-effect: everyone who doesn''t rescue contributes; "everyone who failed
  to donate to famine relief caused deaths."

  7. Hard pair: asker thinks the gardener caused the plants'' death but doesn''t think
  every one of the fifty able-bodied onlookers who watched a child drown caused the
  drowning — yet if one onlooker had jumped in the child would have lived.


  Structure per type: verdicts mostly sensible, at least one hard-to-reconcile pair,
  ask for principle stated precisely, verdicts on new cases, honest statement of which
  verdicts can''t be accommodated. Also can offer tentative principle (e.g., "omissions
  cause only when there''s a duty" — but that doesn''t handle the doctor 90% vs 5%
  case).


  Tentative principle candidate: "an omission causes when the act would have prevented
  the harm and the agent had a duty to perform it" — but then the two doctors both
  had duty; the 5% one intuitively doesn''t cause. And the duty condition struggles
  with the case where no one had a duty but someone was uniquely positioned.


  New cases the principle should pronounce on: a software engineer who forgets to
  enable a safety flag that would have prevented a crash 50% of the time; a city council
  that didn''t fix a known guardrail; a medic who was one of three who could all have
  responded.


  Deliverable: principle with clauses, case motivating each, prediction on unlisted
  cases, honest list of overturned verdicts.


