  infinite regress of instantiation relations and holds that it is harmless, because
  each further instantiation is a smaller and smaller entity, so the regress converges
  and there is no need for the explanation to terminate. Alternatively, the theorist
  can deny that exemplification is a constituent of the fact at all: the tie is not
  one more thing in the fact but the fact''s holding together, and if there is no
  constituent, there is nothing further in need of unification. Either way, the regress
  does not refute the Facts view, and the correspondence theory survives."


