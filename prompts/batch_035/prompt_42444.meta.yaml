  Student''s answer:


  "Bradley''s regress was first formulated by Russell in the Principles of Mathematics
  (1903), though it is usually named after Bradley, who held a similar view. The regress
  arises for the Facts view as follows. Suppose the fact that a is F consists of three
  constituents: the particular a, the universal F-ness, and the exemplification relation
  E that ties a to F-ness. But for these three to constitute a single fact, they must
  stand in a further relation: a, F-ness, and E must be tied together by some further
  relation, say E′. And E′ must in turn be tied to its relata by a still further relation,
  and so on without end. So the Facts theorist faces an infinite regress: every unifying
  relation demands a new unifying relation to unite it with what it unifies.


  The regress is fatal, because any infinite regress in an explanation is vicious:
  it explains the unity of the fact only by positing a new entity whose unity is equally
  unexplained, so nothing is ever explained. Bradley concluded from this that reality
  must be a single all-inclusive whole in which there are no relations at all.


  The same problem arises for propositions, and this shows the Facts theorist cannot
  explain truth. A proposition such as that a is F is itself a complex that must be
  unified by the same kind of tie, and the correspondence theory says the proposition''s
  truth consists in its corresponding to the fact. But if we cannot explain the unity
  of the fact, we cannot explain the unity of the proposition either, since the two
  are the same problem: the regress transfers directly from facts to propositions,
  and the proposition is unified only if the fact is.


