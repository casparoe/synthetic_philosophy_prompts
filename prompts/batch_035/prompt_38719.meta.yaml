  Argument sketch (software engineer persona, formal tone):


  Background: In effective altruism-style cause prioritization, a cause''s priority
  is often scored as importance (scale of the problem) × tractability (fraction solvable
  per unit of effort) × neglectedness (how much effort already goes in). Argument:


  (1) The rational way to allocate a fixed budget is to fund the cause with the highest
  ITN product.

  (2) Importance is bounded above, but tractability and neglectedness are functions
  of current effort: as effort on a cause grows, tractability falls (diminishing returns)
  and neglectedness vanishes.

  (3) It follows that the top-ranked cause can never be one that anyone is working
  on much, because effort lowers its score; so the framework must always rank some
  untouched problem first.

  (4) Among untouched problems, the ranking is decided by importance × tractability,
  so the top cause will be some very small but very easily solved problem — e.g.,
  a minor inefficiency in some process — provided only that it is big enough for the
  product to exceed any crowded important cause, which can always be achieved by finding
  a slightly less minor problem that''s still untouched.

  (5) But there are indefinitely many untouched minor problems, so the framework always
  recommends working on something essentially arbitrary and small rather than on the
  world''s biggest problems, as soon as the biggest problems receive any serious attention
  at all.

  (6) That conclusion is absurd — the framework was supposed to identify the most
  important causes, not to flee from anything anyone else cares about.

  (7) So the ITN framework, taken as a decision rule, is broken.


