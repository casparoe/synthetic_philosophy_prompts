  Let me do moral luck role-play. The asker plays a skeptic about moral luck (Nagel/Williams:
  constitutive, circumstantial, causal, resultant luck all threaten the control principle).
  I''ll play a committed defender of moral luck. Give them real resources: Williams''
  "Moral Luck" (Gauguin example), Nagel''s four categories, the point that we can''t
  give up resultant responsibility without collapsing practice. The opening move should
  challenge the character: e.g., the control principle seems obviously right ("ought
  implies can", we already excuse involuntary acts), so how can luck matter to blame?


  Or flip: asker wants to practice attacking moral luck, model plays a committed defender.
  That works well: opening move from the asker is a strong objection (e.g., the "just
  as well" point — if two drivers are equally negligent but one kills a child, blaming
  the killer more is just a practical convenience, not genuine desert; a just God
  would punish them equally; the criminal law''s distinction between murder and reckless
  manslaughter based on outcome is luck-tracking, not desert-tracking).


  Character should be sharp, not a strawman: sympathetic to Williams/Nagel, uses examples
  like Gauguin, the truck driver example (Williams actually uses a lorry driver example
  in "Moral Luck"). The character can concede small points but never the main one.
  Keep replies to a paragraph.


  Casual tone, typo or two, prompt-engineering text ("you''re a professional philosopher",
  "think carefully", "stay in character until I say stop").


  Write from knowledge; no quotes needed. No need to search. Make sure not to put
  anything in quotation marks that comes from real text. Avoid verbatim quotes; fine.


