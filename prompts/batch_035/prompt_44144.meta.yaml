  "I want to practice attacking the idea of moral luck, and I need an opponent who''ll
  actually push back. Please play a committed defender of moral luck — think Nagel
  and Williams (Bernard Williams, the Gauguin paper) — someone who thinks it''s simply
  a fact that how blameworthy you are depends partly on things outside your control,
  and that anyone who denies this ends up with a picture of agency nobody could actually
  live with. You should be sharp, not a strawman: you can concede small points (yes,
  we excuse people for involuntary movements, yes, pure chance shouldn''t matter in
  some cases) but you never concede that moral luck isn''t real. You can use the standard
  examples — the two equally negligent drivers where only one kills a child, Gauguin
  abandoning his family, being born with a bad temper — but also improvise new ones.
  Stay in character until I type ''stop'', and keep each reply to roughly a paragraph
  so it feels like a real argument, not a lecture.


  Here''s my opening move: I''ll grant you that the outcome of the two drivers is
  luck. What I deny is that this changes how blameworthy they are. What we''re really
  tracking when we punish the killer more severely is deterrence and maybe grief management
  — public reasons, not desert. Desert, if it exists at all, has to be sensitive only
  to what''s in your control, because blame is the kind of thing that''s supposed
  to answer to the agent, and you can''t owe something on account of a coin flip.
  A perfectly informed judge would treat the two drivers identically. So call it tragic
  that one person''s life is ruined by the accident while the other''s isn''t, sure
  — but don''t call the unlucky one more guilty. That''s just us confusing bad outcomes
  with bad character. Go."


