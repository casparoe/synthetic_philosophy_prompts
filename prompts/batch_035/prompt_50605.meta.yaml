  For those who need the background stated: Molinism holds that God has, logically
  prior to the decree to create, middle knowledge: knowledge of all true counterfactuals
  of creaturely freedom, propositions of the form "were this agent placed in these
  circumstances, she would freely do this." These truths are contingent, are not willed
  by God, and are not determined by him; God surveys them, then decrees a world. That,
  the Molinist says, secures both providence and libertarian freedom.


  The examiner''s argument:


  (1) Before creation, the complete set of true counterfactuals of creaturely freedom
  is settled: for every possible agent and circumstance, there is a fact about what
  that agent would freely do.

  (2) God decrees to create me in certain actual circumstances.

  (3) The relevant counterfactual, plus the decree, entails that I will do precisely
  what I in fact do; there is no possible world, consistent with the decree and the
  counterfactuals, in which I do otherwise.

  (4) A choice is free only if, at the moment of choosing, it is within my power to
  do otherwise.

  (5) So my choices are not free. Molinism was built to save libertarian freedom from
  the deterministic reading of providence, and it delivers fatalism instead: God''s
  decree plus the counterfactuals settle everything in advance.


  The move I do not trust is (3), but I cannot say exactly what is wrong with it.
  My advisor''s first response was that the counterfactual about me is true because
  of what I would do, not the other way around — the truth runs from my freedom up,
  not from God''s choice down. The examiner''s reply: "settled before you exist, settled
  by nothing you do or have done, and yet somehow yours." He says a truth that is
  settled prior to my existence, that is not willed by God (else (5) is even worse
  for you), and that is not grounded in my choice (I do not yet exist) is a truth
  with no ground at all — and that it would be better to deny such truths exist.


  Here is what troubles me about that retreat. It seems to prove too much. Counterfactuals
  about free creatures are not the only counterfactuals theism needs. We say things
  like: had God chosen to create a different world, evil would have been different;
  had he not elected Israel, history would have gone otherwise. If the examiner''s
  grounding complaint shows that no counterfactual of creaturely freedom can be true,
  I do not see why it stops there — it seems to take out counterfactuals of divine
  freedom too, or unactualized counterfactuals generally, and I doubt he wants that
  conclusion.


