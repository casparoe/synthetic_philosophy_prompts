  (think someone who works on bargaining and precommitment, not a general philosopher),
  and construct me a thought experiment where adopting a surrogate goal leaves the
  agent strictly worse off than never having adopted one — a case where the decoy
  scheme actively attracts trouble instead of deterring it. Constraints: keep the
  threatener mundane and realistic — an extortionist, a patent troll, a ransomware
