  Draft the moves:


  1. Psychologist: Deference is ordinary and fine. If my mechanic diagnoses my brakes,
  I act on it; if a colleague whose judgment I trust tells me a mutual acquaintance
  behaved appallingly, believing her is just ordinary epistemic economy. Insisting
  on first-hand acquaintance with every moral fact would leave us paralyzed — most
  of our moral beliefs are already secondhand (history, news, upbringing).

  2. Philosopher: disagrees: technical testimony differs from moral testimony in that
  the expert''s belief is itself good evidence — the brake expert''s belief tracks
  reality via mechanisms we understand. But when someone tells me X is wrong, the
  fact that they judge it wrong is only weak evidence it is wrong, unless I already
  trust their moral outlook — and at that point I''m relying on my own judgment about
  which judges to trust, so I haven''t really outsourced anything. (The "epistemic
  dependence" point.)

  3. Psychologist: responds that this proves too much — by that logic I couldn''t
  defer about anything, since choosing which experts to trust also uses my own judgment;
  and she notes we regularly act on secondhand moral information (a referee''s report,
  a reference letter, an abuse allegation investigated by others) and refusing to
  ever act would be morally worse — sometimes the cost of first-hand verification
