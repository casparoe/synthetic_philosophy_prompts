  about whether to defer to a fact-checker''s moral condemnation? Or about a friend''s
  decision whether to cut off someone based on friends'' reports of bad behavior.


  A journalist covering science and ideas: recount a disagreement at a seminar or
  panel they moderated. Good setting: after a panel on trust in expertise, two panelists
  argued over moral deference. One said relying on others'' moral judgments is like
  relying on a sommelier or GPS — epistemically fine; the other said moral judgments
  differ because you need first-hand grasp of the reasons, otherwise it''s like being
  a "moral parrot" (Hopkins'' phrase? "moral deference" — the parrot idea is from...
  actually the parrot analogy is from... it''s attributed to... I recall "moral parrot"
  from... it''s in discussions by S. Hopkins? No — it''s from... The parrot example
  is used by... I think it''s from a paper by... "Moral deference: ''there''s something
  wrong with someone who relies on moral testimony like a parrot''" — this is attributed
  to... Actually it''s from... I recall it''s often attributed to a remark by... it
  appears in McGrath? Or "Hopkins (2007)"? I shouldn''t lean on attribution. Just
  use the ideas without names.


  Build the back-and-forth with 4-5 moves:


  Person A (say, a psychologist on the panel): moral deference is fine; we defer to
  experts everywhere; if a trusted friend with good judgment tells me someone behaved
  cruelly, I should update.

  Person B (a philosopher): but moral judgment is different — moral condemnation without
  understanding the reasons is empty; there''s something servile or defective about
  outsourcing your conscience; also moral testimony doesn''t carry the evidence the
  way technical testimony does (the asymmetry: why does knowing that someone thinks
  X is bad give less grounds for believing X is bad, compared to other domains?).


  Include a niche twist: maybe the disagreement sparked by a real-ish case — e.g.,
  a junior colleague deciding whether to publicly condemn someone based solely on
