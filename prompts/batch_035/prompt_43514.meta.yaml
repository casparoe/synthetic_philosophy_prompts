  others; the journalist is bystander.


  Setting: I moderated a panel at a science-and-society festival on "Trust in Expertise."
  Two panelists: a moral psychologist (call her Dr. ... maybe keep first names: "a
  developmental psychologist, Dr. Reyes" — inventing names is fine) and a philosopher.
  Then the disagreement continued over coffee. The journalist asks the model to adjudicate
