  Setting: an upper-level game theory / decision theory seminar, ~14 students, one
  75-minute session. Design an in-class centipede game: pairs, alternating turns,
  pot grows (e.g., starts at $0.50 in tokens, doubles/times 1.5 each round, take =
  you get the larger current share, pass = both shares grow), capped at some round
  with terminal payoff. Then variations: repeated play with rotation of partners (to
  let reputations form), a condition where they must announce strategy, a condition
  where they write down what they''d do at each node in advance ("strategy commitment"),
  and maybe a condition where the "take" at first node is removed or where they''re
  asked to reason aloud. The debrief maps: the backward induction argument, why almost
  nobody takes at node 1, what happens when the game is repeated (later-round takes
  emerge — learning), the paradox: BI assumes rationality and common knowledge of
  rationality; if you ever find yourself at node 4, that assumption is false for your
  opponent, so the argument''s premises fail at later nodes — the "paradox of the
  paradox." Also honest note: what the activity can''t reproduce — infinite-horizon
