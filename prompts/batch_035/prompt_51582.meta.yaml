  Disagreement between two colleagues, say Dana and Marcus. Topic: whether defining
  the alignment problem narrowly as "make the AI do what its operators intend" is
  a substantive research program or a way of dodging the hard part.


  Moves:

  1. Dana: the "alignment problem" has quietly been redefined as "make the system
  do what the person at the controls wants" — but the hard part was never instruction-following,
  it''s that we don''t know what we want; the narrow definition solves the easy 90%
  and declares victory.

  2. Marcus: no — "make it do what we intend" is already brutally hard; value alignment
  smuggles in the assumption there''s a fact of the matter about what''s good, and
  an AI deciding that for us is worse than any misalignment. The narrow definition
  isn''t dodging, it''s triage.

  3. Dana: but if humans themselves are bad (malicious operators, or careless ones),
  a perfectly intent-aligned AI is a perfectly executed bad thing — intent alignment
  is only as good as the intent; it''s an amplifier, not a safeguard.

  4. Marcus: by that standard no safety work counts; also value alignment has to be
  run by someone — who decides the values? It''s intent alignment all the way up with
  extra steps, except the "intent" is now some committee''s.

  5. Dana: committee or not, there''s a difference between "system does what its immediate
  operator wants" and "system acts on reasons that would survive reflection" — she
  claims we can want the second without claiming to know the values in advance.

  6. Marcus: "reasons that survive reflection" is doing the work "the good" used to
  do — a vague pointer that hides the very disagreement it was supposed to solve.


