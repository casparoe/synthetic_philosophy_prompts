  were not stored anywhere; it found them through a stochastic process in which many
  small agents competed to build descriptions of the strings, with a global temperature
  parameter shifting attention between broad patterns and local details. When faced
  with the harder problem — if abc changes to abd, what does mrrjjj change to? — it
  discovered on its own that the rightmost letter could slip into the rightmost group,
  and answered mrrkkk. This was the point of the famous Slipnet: a network of concepts
  whose connections were themselves fluid, so that in the right context successor
  could come to mean the next group up rather than the next letter up. Hofstadter
  saw the smallness of the domain as a regrettable compromise forced by the computing
  power available at the time, and he proposed that the same architecture, scaled
  up to richer domains, would yield something like general intelligence. He also read
  the program''s success as a refutation of Fodor''s picture of concepts as a fixed
  innate inventory, since the program demonstrated that concepts could be created
  on the fly. In the end the approach did not catch on, and nothing like it appears
  in modern machine learning."


