  is manufactured entirely out of the self-referential condition itself. It''s sort
  of like a commitment, but not the usual kind where you burn your boats and the other
  guy best-responds; here the ''commitment'' only has force because the other agent''s
  reasoning about it is what makes it binding on both of you.


