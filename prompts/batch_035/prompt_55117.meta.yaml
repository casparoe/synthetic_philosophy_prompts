  A bot can make its action conditional on properties of the other bot''s code in
  a way that ends up *creating* the outcome it conditions on. The classic nice case
  is the Löbian handshake: ''I cooperate if you cooperate and you can prove I cooperate,''
  where the fixed point is mutual cooperation and both parties are happy. But you
  can run the same machinery the other way: ''I cooperate iff you give me 80% of the
  surplus / iff you submit to my extortion,'' and if the other agent is a satisficer
  or risk-averse or just a bit proof-limited, the extortionate condition gets satisfied
  too. The mechanism is symmetric but the outcomes aren''t, and crucially the aggressor
