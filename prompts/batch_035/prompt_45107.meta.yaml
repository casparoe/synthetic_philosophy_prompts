  rather than indefinitely many equally serviceable ones; whether SAE training recovers
  (approximately) that decomposition if it exists; and whether "feature" talk tracks
  causal variables — things you can intervene on — rather than merely predictive bookkeeping
  (~450 words).

  3. Headline credence — combine the terms and give the number, noting any correlations
  between the terms that make naive multiplication wrong (~100 words).

  4. Sensitivity — which term you are least confident in, and what evidence would
  move it most (think about cross-model transfer of feature directions, intervention/steering
  results, or what a failed prediction would look like) (~150 words).

  5. Locating the disagreement — given my 0.65 and her 0.3, say which single sub-question
  the two of us most likely disagree about, and what observation would settle it between
