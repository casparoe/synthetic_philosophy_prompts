  "Heritability, explained with an outage"


  Something like:


  A number keeps showing up in online arguments about IQ and genetics: heritability,
  usually quoted as something like "0.8 for height in developed countries." People
  use it two ways, both wrong. First as "80% of any given person''s height comes from
  their genes." Second as "so there''s no point improving nutrition, it''s mostly
  genetic anyway."


  What heritability actually is: you take a population, measure a trait, and ask how
  much of the variation in that trait tracks genetic differences vs. environmental
  differences. It''s a variance decomposition over a population, not a claim about
  a person, and not a claim about the relative influence of genes in general.


  Here''s the analogy I want to run with. At work we have a service dashboard. Request
  latency varies. Some of the variance comes from the code path (some handlers are
  slow), some from network jitter. Suppose we found 80% of latency variance across
  requests maps to which handler the request hits, and 20% to jitter. That would tell
  you: in this deployment, under this load, code differences dominate. It would NOT
  tell you: (a) that any single request''s latency is 80% caused by code — each request''s
  latency is caused by whichever handler and whatever network conditions it actually
  hit, (b) that if we moved the cluster to a worse network, code would still dominate.
  Move to a congested network and the split flips, same code. (c) it tells you nothing
  about why our average latency is higher than a competitor''s — that comparison is
  between deployments and needs its own decomposition.


  Height works the same. In a country where everyone gets adequate food, genetic differences
  dominate variance in height, heritability is high. In a country where some kids
  are malnourished, environment dominates, heritability is lower. Same genes, same
  biology, different number, because heritability is a property of the population+environment
  mix, not of the trait.


  Then the essay''s final point: this is why "it''s highly heritable, so interventions
  won''t help" gets it backwards. In fact high heritability often shows up precisely
  once the environment has been equalized. The claim "0.8 heritability for IQ in rich
  countries" (if that number is right — this is the kind of thing I''m hazy on, so
  take it with salt) tells you nothing about whether a better environment would raise
  scores, and nothing about differences between countries or groups, which are separate
  populations needing separate decompositions.


  Maybe also: this is why heritability ≠ immutability, and why it also doesn''t mean
  "genes for the trait" — no single gene, polygenic.


