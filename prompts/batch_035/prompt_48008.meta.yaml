  I write a weekly column on mind and behavior for a general-interest science magazine,
  and my next piece takes up the old question of what an emotion is: judgment, feeling,
  or perception. Rather than survey the debate, I want to argue for one line: that
  emotions are perceptions — not of the external world, but of the body''s value-relevant
  states. The familiar route to this conclusion runs through the analogy between fearing
  the dog and seeing the snake: both present their content without concepts, are available
  to infants and animals, and can persist in the face of conflicting belief. I would
  rather not lean on that route, since readers have seen it before and it invites
  the standard rejoinder that judgments can be unconscious and fast too. Instead,
  build the argument around a phenomenon that gets far less attention in this debate:
  adaptation. An emotion held in constant circumstances fades — the new resident''s
  fear of the low-flying aircraft quiets within months, and the delight in a view
  from a new apartment dims — and the fading tracks the constancy of the stimulus
  rather than any change in belief: the resident still judges the flights a nuisance
  and a risk, and would say so if asked. Argue that this profile is the signature
  of a perceptual system recalibrating to a steady stimulus, the way touch stops reporting
  the weight of clothes or a smell disappears in a room; and show why the judgment-based
  rival, which must treat fading affect as revision of judgment, either misdescribes
  the case (the judgment has not changed) or must bolt on an extra mechanism that
  does all the work. Close by stating honestly what this argument does not establish:
  what it leaves open about whether perception of bodily change amounts to perception
  of value, and how the view would handle the recalcitrance of phobia. Write it as
  continuous prose I can adapt for the column, about 700 words, at a level an interested
  non-specialist reader can follow.


