  That''s fine as physics, but then it''s unclear what the squared amplitudes have
  to do with probability. Since everything happens, "the probability of outcome A"
  can''t mean the fraction of times it happens, and an agent who knows the outcome
  will occur somewhere can''t be uncertain about whether it will occur. The Deutsch–Wallace
  program tries to close the gap with decision theory: they argue that a rational
  agent branching into copies should accept certain axioms about preferences over
  future experiences, and that an agent satisfying those axioms must act as if each
  outcome had probability equal to its Born weight, so the weights can play the role
  of probabilities without being assumed to be probabilities. The critics — Kent is
  probably the most persistent — reply in various ways: that the axioms covertly smuggle
  in a probability measure (rationality axioms like "if you''re indifferent between
  X and Y, you''re indifferent between mixtures of them" only look innocent because
  we already read the weights as chances); that decision theory without probabilities
  is undefined, so the derivation is circular; and that even granting the theorem,
  it shows you should bet as if, which falls short of showing that anything is really
  uncertain. Meanwhile others on the Everettian side concede the decision-theoretic
  route and rest on typicality — we should regard ourselves as typical observers —
  which the same critics say is just the probability assumption wearing a different
  hat.


