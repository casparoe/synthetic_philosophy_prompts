  I''m a PhD student in philosophy of physics, working on Everettian quantum mechanics
  and decision theory, and I''m drafting a chapter laying out my overall position.
  Before I commit it to print, I want to know whether the following package is internally
  consistent, and I''d like a severity-ranked audit rather than a survey.


  Here is the package:


  (1) Ontology: the universal wavefunction, evolving unitarily, is all there is. There
  is no collapse, and branching is a real, objective feature of the world; decoherence
  explains why branches don''t interfere.


  (2) Probability: even though every outcome occurs, ordinary quantum probabilities
  are not a mystery. Rational credence after a branching event is self-locating uncertainty:
  I should expect to find myself in a branch drawn according to the Born measure,
  and I take the standard decision-theoretic arguments to underwrite the Born rule
  as a measure of how much I should care about each successor.


  (3) The badness of death: I hold the deprivation account — death is bad, when it
  is bad, because and only because it deprives the person of goods they would otherwise
  have had. There is no further intrinsic badness in being dead.


  (4) Personal identity: psychological continuity, and in a branching case I accept
  the Parfitian conclusion that there can be two later people each of whom is equally
  my successor, with no further fact about which one is "really" me. I also accept
  that personal identity is not what matters.


  (5) Decision theory: I''m a risk-neutral expected utility maximizer. In branching
  cases, I weight each successor''s utility by my self-locating credence that I will
  turn out to be that successor, and maximize.


  (6) A heuristic about minuscule chances: I do not allow decisions to be driven by
  possibilities of minuscule measure. If a payoff arrives only on branches of total
  Born measure 10^-40, I regard it, for practical purposes, as not arriving, and I''d
  call an agent who pays to secure such a payoff irrational — this is roughly why
  I take Pascal''s mugging to be a mistake rather than a problem.


  (7) Quantum suicide: even granting all of the above, I would not fire a quantum
  roulette at my head (a device that kills me on the branch corresponding to, say,
  spin-up and leaves me unharmed — indeed richer — on spin-down), and I think anyone
  who would is irrational, full stop. And yet I can''t locate the premise that makes
  refusing compulsory.


  Where, if anywhere, does this package fail to hang together? Which pairs of commitments
  are genuinely in tension, which only look to be, and what is the cheapest repair?
  I have my suspicions about the culprit, so don''t just triangulate to whatever is
  most convenient to give up — I want the tensions ranked by severity, with an explicit
  statement of what each repair costs the rest of the view. In particular: I''d like
  to know whether (7) can be defended from inside (2) and (5), or whether defending
  it requires denying that self-locating credence should be conditioned on the existence
  of successors at all — and if so, whether that denial is available to me without
  wrecking my answer to the probability problem in (2). I''d also like to know whether
  (6) is doing any legitimate work, or whether it''s an ad hoc wall built to keep
  (7) standing.


