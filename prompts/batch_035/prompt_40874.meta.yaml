  Prompt draft:


  "I teach a mid-level seminar on free will (18 students, 90 minutes, a room with
  movable chairs) that has just finished reading compatibilist defenses of the claim
  that what matters for responsibility is a ''variety of free will worth wanting''
  — control, reasons-responsiveness, the ability to have done otherwise if one had
  wanted to — rather than the metaphysical ability to have done otherwise given a
  literally identical past. My worry is that they endorse this on paper while their
  intuitions still tie responsibility to ultimate origination. Design an in-class
  activity in which the students discover, from their own choices, which ''augmentations''
  to their own agency they actually want.


  Structure the activity as an Augmentation Market with a fixed menu I want you to
  use verbatim. Over a series of rounds, each student privately and bindingly (points
  at stake) chooses exactly one augmentation to install ''in themselves'' before facing
  a decision scenario; the scenarios should be ones where different augmentations
  predictably pay off differently:


  1. Coin-flip implant: a fraction of your decisions are replaced by a quantum-random
  choice among the options you were considering.

  2. Eraser: in the moment, you cannot act on any motive you would later disavow —
  the urge is screened out before it reaches deliberation.

  3. Forecaster: you get an accurate preview of how each option will feel a week later.

  4. Split screen: you see, alongside your own deliberation, the reasoning of the
  calmest, best-informed version of yourself.

  5. Veto window: a ten-second gap between urge and action, during which nothing proceeds
  without an explicit go signal.

  6. Scrambler: your deliberation is perturbed by small noise, so that two agents
  with identical histories and characters would sometimes choose differently.


  Students who choose augmentations that raise their scenario score keep the points;
  those who choose ones that lower it lose them; and in each round a ''bookmaker''
  (a rotating student) must publicly predict which augmentations the group will pick
  before they pick, winning points for accuracy.


  Requirements: full rules and point scheme (no real money), a timeline for the 90
  minutes, and how the bookmaker''s predictions feed the debrief. The debrief should
  map moments in the market onto the distinction between augmentations that add control
  and augmentations that add mere openness/indeterminism — in particular, use the
  group''s revealed preference for (say) the Eraser and the Veto window over the Coin-flip
  implant and the Scrambler to let them conclude, in their own words, which variety
  of free will they wanted all along; and use the bookmaker rounds to separate ''being
  hard to predict'' from ''being undetermined''. Include a candid section on what
  the activity cannot reproduce (hypothetical stakes, the felt authorship of real
  decisions) and what will predictably go wrong the first time I run it (e.g., students
  picking the Coin-flip implant as a joke, and how to handle that without shaming
  them into seriousness).


  End with a single machine-readable line of the form \answer{...} naming, in at most
  ten words each, the augmentation this design predicts the group will rank lowest
  and highest, e.g. \answer{lowest: Scrambler; highest: Veto window}."


