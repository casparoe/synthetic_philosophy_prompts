  Origin essentialism with a disagreement: friend at dinner argues "you couldn''t
  have come from a different sperm/egg." Two friends debate. One says Kripke-style
  necessity of origin — the person you''d have created from a different egg wouldn''t
  be you. Other says identical twin thought experiments / the genetic overlap, or
  "why does the particular gamete matter and not the genetic information?" Could inject
  a niche angle: "the sperm that became you was one of millions; if a different sperm
  from the same father with nearly the same DNA had won the race, resulting person
  would be nearly identical — wouldn''t that be you?" This is a decent philosophical
  dispute that doesn''t rely on citations.


  Type: Recount a disagreement. Perspective: non-academic bystander. Formal/polished.
  Don''t reference Kripke by name necessarily — the friends are laypeople, so they
  wouldn''t cite Kripke; they argue in ordinary terms. That''s good: avoids citation
  dependence.


  Let me construct a multi-round disagreement:


  Round 1: Marcus says he read that "you couldn''t have been born from a different
  egg — if a different egg had been fertilized, that would have been someone else."
  Dana pushes back: the resulting person would look like her, share memories... actually
  the resulting person would have her upbringing and family, so why isn''t that her?
  No wait — the counterfactual person would have the same parents, same upbringing,
  roughly same life. Dana: "the person with my parents, my childhood, my name, sitting
  in my chair — that''s me."


  Round 2: Marcus: imagine two eggs from the same mother, both could have been fertilized
  by different sperm — resulting in two different people; both can''t be you, so at
  most one is, and nothing picks out which — so none is; origin matters. Or: "If a
  different sperm had won, a different person with the same parents would exist; the
  world would contain someone very like you, but you — this one — would simply never
  have existed." Dana: "How do you tell the difference between ''very like me but
  not me'' and ''me, slightly different''? You keep pointing at the original gametes,
  but what makes those particular cells so special rather than the genetic recipe
  they carried? If the alternative sperm carried almost the same DNA, the person would
  be almost the same in every way — I say there''s no further fact."


  Round 3: Marcus: "Think of it forward, not backward: if doctors today made an embryo
  from a different egg and sperm of mine and my wife''s and implanted it, that child
  wouldn''t be our existing son''s ''brother in another life'' — it would just be
  a different child, and nobody would say it *is* him had things gone differently."
  Hmm, that''s a bit different. Maybe better: Marcus raises the "could you have been
  a different person entirely" — Dana counters with the identical twin: split embryo
  — two people from same origin; so one origin can give two people, so why can''t
  one person have two origins? That''s a genuinely decent move (paradoxes of origin:
  co-location, fission). Marcus replies: fission shows origins can branch, not that
  they can vary — the twins both came from *that* embryo, which is exactly the necessity
  claim: neither twin could have come from a different embryo. So fission supports
  him.


  Round 4: Dana: "But then your view has an odd consequence: you''re saying whether
  I''m me depends on which microscopic cell won a race in 1985 — a fact no one could
  ever know. Identity shouldn''t hang on something so arbitrary." Marcus: "That it''s
  unknowable doesn''t make it not so; plenty of facts are like that. What''s arbitrary
  is your alternative — that identity floats free of any physical fact."


