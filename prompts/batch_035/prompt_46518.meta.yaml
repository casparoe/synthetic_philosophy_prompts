  Draft prompt:


  ---


  I run a small regional film festival — one week a year, one part-time staffer, and
  about 400 submissions. I can personally watch maybe 40 of them. Everything else
  gets rated on scorecards by a rotating pool of about 15 volunteer screeners, most
  of whom have watched a lot of movies and a few of whom have genuinely good taste.
  I have to decide which ~60 films get slots, and I have to do it over about six weeks
  in the spring. Getting it wrong isn''t ruinous, but we''ve built a reputation with
  our audience and a stretch of bad picks would burn it.


  The thing I keep bumping into is what the philosophy people call the problem of
  aesthetic testimony. Apparently there''s a real literature on whether you can know
  a film is good on someone else''s say-so, and the answer is surprisingly "not really,
  but it''s complicated" — something about how an aesthetic judgment is supposed to
  be grounded in the properties of the object itself, not borrowed from someone else''s
  reaction, so there''s an asymmetry between trusting a screener that the projector
  file has no subtitles missing and trusting them that the film is "quietly devastating."
  Meanwhile I obviously cannot watch 400 films, and my whole job, in practice, is
  acting on secondhand aesthetic verdicts.


  Write me a procedure my staff and I can actually run on each submission. I want
  the steps in order, what counts as a good enough answer at each step, where the
  procedure says no / pass, and where it throws up its hands and hands it to me because
  the question is a judgment of value, not a fact. The procedure should be honest
  that some steps are judgment calls wearing a labcoat. Then run it on three real-ish
  cases from last year:


  1. A slow, three-hour documentary that one screener called "transformative" and
  another turned off after twenty minutes. I ended up programming it and standing
  in the back while half the audience left.

  2. A short I personally loved the one time I saw it — but all four screeners who
  rated it scored it middling, and I''m the only one who liked it.

  3. A film where every screener agreed it was excellent, I''ve never seen a frame
  of it, and the question is whether I can put a quote in the program calling it a
  masterpiece.


  And tell me straight what the procedure can''t do — like whether it can tell me
  who counts as a screener with taste in the first place, which I suspect is where
  the whole thing quietly rests.


  Keep in mind the distinction I half-understand: testimony about facts (this film
  contains flashing imagery, it''s 82 minutes, the director''s third feature) seems
  fine to just believe, while testimony about merit is the suspicious part. If the
  procedure needs to lean on that line, make the line explicit, because I suspect
  some of our scorecard questions are on the wrong side of it.


