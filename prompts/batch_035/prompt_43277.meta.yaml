  Type: Take a slogan — Pascal''s wager domain. Slogans in that domain: "It''s a safe
  bet", "Wager as if God exists" — hmm, the famous line "The heart has its reasons
  which reason knows not" is Pascal but not the wager. Slogans like "What have you
  got to lose?" — that''s the folk version of Pascal''s wager. That''s good: "What
  do you have to lose?" is a one-liner often used (e.g., by a certain politician)
  that echoes the wager. Actually "What have you got to lose?" is famously Trump''s
  line to Black voters, but it also captures the wager''s structure. The prompt could
  ask: someone used "you might as well believe, what do you have to lose" as an argument
  for belief in God — what precise claims could that slogan be making? That works
  well and is in the weeds.


  Alternatively: nonidentity problem + concrete situation. E.g., a couple deciding
  whether to have a child conceived via IVF now vs waiting, where waiting would produce
  a different child; environmental policy — "we shouldn''t burden future generations
  with climate change" but the future people wouldn''t exist otherwise. A concrete
  advice prompt: "My sister and her husband are deciding whether to have a child now
  while there''s a risk of the child inheriting a genetic condition, or wait a year
  for a new gene therapy, but waiting means a different child entirely..." That''s
  a classic nonidentity scenario (Parfit''s teenage girl). Good concrete situation.


  Or Dostoevsky Grand Inquisitor + summary fairness type: a summary claiming the Grand
  Inquisitor proves Dostoevsky believed people should be given bread not freedom,
  etc. That could be good.


  Let me pick one strong combination. The concrete-advice + nonidentity problem seems
  natural and lets the asker be genuinely in the weeds without citations. But the
  "in the weeds" requirement — nonidentity problem itself is well-known in philosophy;
  the prompt''s situation is novel. The instruction says inject some niche ideas into
  the prompt. The concrete situation itself provides the novelty.


  Actually the slogan type with Pascal''s wager: "What have you got to lose?" — that
  slogan is used for many things (cryonics, health fads, religious conversion). The
  prompt could be: a friend argues for signing up for cryonics with "what have you
  got to lose?", and separately a relative says the same about becoming religious,
  citing Pascal. What precise claims could that one-liner be making, and which readings
  support the cryonics case, which the God case? That''s nicely in the weeds — comparing
  wager structure across cases. That''s a fun prompt.


  Alternatively trust in government + concrete advice: deciding whether to trust a
  government agency... less crisp.


  I think the nonidentity + advice one is very strong and safe. Let me draft:


  "My wife and I are carriers for a genetic condition — nothing serious, but if we
  conceive naturally there''s a 25% chance the kid inherits it. We can do IVF with
  screening now, or we can wait a year until she finishes her degree and then try
  naturally. My sister says waiting is selfish because we''d be knowingly risking
  a child with a condition when we could have avoided it. But here''s what bugs me:
  if we wait, the child we''d have won''t exist — a different kid would be born a
  year later. So who exactly are we harming by waiting? And who''s harmed by not waiting?
  Is my sister''s objection even coherent, or does it work some other way? I feel
  like both sides of this are talking past each other and I can''t pin down why."


  Hmm, wait — the standard nonidentity structure: the risky conception creates a child
  who has a life worth living but impaired. The sister objects to conceiving now under
  risk. But here they''re choosing between screening (avoids condition, same-ish child?
  no, IVF child is also "different" selection...) Actually IVF with screening yields
  a child that wouldn''t exist otherwise too. Let me restructure so the nonidentity
  structure is clean: they''re deciding whether to conceive now, before a new treatment
  becomes available in a year that would eliminate the risk. Conceiving now risks
  the condition; waiting means a different child. Sister says conceiving now is wrong
  because "why risk having a sick kid when you could wait a year?" But the child conceived
  now, even with the condition, presumably has a life worth living, and would not
  exist if they waited — so who is wronged?


  But also flip: the asker feels pulled the other way — a friend said "waiting doesn''t
  help anyone, since the child you''d have by waiting doesn''t exist yet, so there''s
  no one you''re protecting." Ask: is either argument right? Something feels off about
  both. That instantiates nonidentity from both directions.


