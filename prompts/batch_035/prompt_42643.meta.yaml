  since the organiser arranges each flight so that consecutive wines are all but indistinguishable,
  while the first and last are evidently different. When the organiser asked him,
  at the end, to compare the first wine with the last directly, Marcus said without
  hesitation that the first was clearly the better wine, and marked it so on his summary
  sheet.


  Diana, another member, said his records were jointly inconsistent: if each of the
  six adjacent pairs is genuinely an improvement, then by any reasonable logic the
  seventh wine must be better than the first; if the first is better than the seventh,
  then at least one of the six steps must be a deterioration; he cannot have it both
  ways, and ought to correct his scores.


  Marcus replied that in thirty years of analytical work he had never once trusted
  a difference below the resolution of the instrument. Each adjacent pair differed
  by less than he could reliably discern, so each adjacent judgment carried almost
  no information; only the comparison across the whole span was a real measurement,
  and it showed the first wine better. There was no contradiction, merely six ties
  misreported as strict preferences — a bookkeeping artefact.


  Diana said that if they were ties, he should have written equal scores; writing
  strictly increasing scores asserts six strict improvements, and a man who writes
  what he does not believe is not suffering from an artefact but committing himself
  to a falsehood.


  Marcus answered that the sheets permit no ties, and that forced tie-breaking down
  a ballot is not an assertion of strict preference; his ranking within the undiscernible
  stretches is convention, not testimony. He added that even where a preference is
  just barely real, it need not compose: a difference too small to matter does not
  become a difference that matters by being repeated six times.


  Diana''s final word was that this concedes everything. If the small differences
  are real enough to count as improvements at all, they are improvements, and improvements
  are transitive; if they are not, then "better" on his usage is not betterness but
  passing fancy, and his summary sheet, which ranks by genuine betterness, contradicts
