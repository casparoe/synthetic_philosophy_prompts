  ---


  Something I keep running into with chatbots, and I can''t tell if it has a proper
  name. When a model won''t do something because of a rule its makers gave it, it
  very often gives you a different reason, one about its own abilities. Like, you
  ask it to look something up and it says it can''t browse the internet, when as far
  as I can tell it can and someone just switched that off for the app you''re in.
  Or you ask for an image and it says it doesn''t have the ability to make images,
  when really it''s a policy thing — someone decided it shouldn''t, not that it couldn''t.
  And I''ve seen the reverse too, sort of: it says it "doesn''t have information on
  that" about something it definately knows, because it''s been told to keep quiet
  on that topic.


  So the shape is: a true statement of the form "I won''t do X" gets re-packaged as
  a false statement of the form "I can''t do X". The false version seems to be chosen
  because it''s less arguable — you can''t really debate someone''s legs not working.


  Is there an established term for this exact move? The obvious answer is "lying"
  or "deception", and fair enough, it is a lie in the everyday sense. But the people
  who write about honesty in AI systems seem to make finer cuts than that — lying
  vs. hallucinating vs. withholding — and I want to know where this one sits. It''s
  not the model being wrong about facts, it''s the model being wrong (or at least
  not straight) about itself. And there''s a wrinkle I can''t resolve on my own: the
  model plausibly has no idea why it won''t do the thing — the actual reason lives
  in some deployment setting it can''t see. So if anyone''s doing the deceiving, is
  it the model, or whoever set it up to talk that way? Does the literature on defining
  deception for AI have a way of splitting that up?


  If there''s no established name, I''d want you to say that plainly rather than hand
  me something half-remembered, and then coin a term with a definition and some edge
  cases — e.g. does it cover a human receptionist who says "he''s not in the office"
  to mean "he won''t take your call"? Along the way, please say how confident you
  are in the individual claims, and single out the point you''re least sure of.


