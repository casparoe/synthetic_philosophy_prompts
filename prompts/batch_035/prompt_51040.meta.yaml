  reasons to think valence is a structural or functional property that only shows
  up in sufficiently organized systems — panpsychists typically only attribute something
  like proto-experience to fundamental stuff, so the view is morally inert until you
  bolt on an extra claim about valence that panpsychism itself doesn''t provide.


  Marco had two comebacks. First, the valence-requires-structure move struck him as
  ad hoc: if we''re willing to say experience comes in degrees all the way down, why
  not valence, which looks biologically primitive — even very simple animals seem
  to feel pain, not just "represent" damage? Second, and he thought this was the deeper
  point: if you insist that valence only emerges at some level of organizational complexity,
  then panpsychism has quietly collapsed into emergentism about the only feature that
  matters morally, which is exactly the emergence panpsychism was supposed to help
  us avoid. Dee wasn''t moved. She said the combination problem is a problem about
  subjects (how micro-experiences add up to one mind), not about qualities, so you
  can be a good panpsychist and still say valence is a higher-order property — the
  view doesn''t collapse, it''s just non-uniform. And she had a decision-theoretic
  point too: even if Marco is right about valence, acting on "maybe electrons suffer,
