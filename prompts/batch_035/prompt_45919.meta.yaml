  A novelist asking for advice on a concrete situation instantiating bad faith / radical
  freedom. Idea: a novelist writing a character... e.g., a novelist who has writer''s
  block and blames the character ("the character refused to do what I wanted"), treating
  the character as having a mind of their own — bad faith: treating one''s own creation
  as an external constraint. That''s a nice in-the-weeds, novel angle: bad faith in
  fiction writing — the author pretending the character is autonomous in order to
  escape responsibility for the choice of what the character does. This is actually
  a known phenomenon ("characters running away from the author"). The philosopher
  structure: freedom — the author is radically free; treating the character as an
  autonomous force is a way of fleeing authorship (in both senses: authorship of the
  novel and authorship of one''s life). Nice pun: "authorship" — bad faith as disowning
  one''s own authorship.


  The novelist perspective: "I''m a novelist. I''m stuck on my third chapter..." They
  say "my protagonist simply won''t lie to her sister" — treating the character as
  a stubborn external agent. Ask: am I right to trust the character, or is this a
  way of avoiding deciding? Should I let the character "win," or should I take responsibility?


  But must not name the underlying concept (bad faith). The prompt should be in everyday
  terms. Ask: is my "the character won''t let me" talk a real craft insight or an
  evasion? What should I do?


  Include the format request: lead with bottom line in the first sentence, then reasoning,
  no preamble, no restating the question.


  Also inject some nuance: some writing teachers say characters must be autonomous
  for the novel to be alive; but the novelist suspects it''s a comfort. Add a concrete
  dilemma: the plot requires the protagonist to lie (say, conceal a letter) for the
  plot to work; the novelist feels "she wouldn''t do that," and has rewritten the
  scene nine times. Deadline looming. Ask whether to force the plot or accept the
  character.


  Make it polished and formal, from a novelist''s perspective. Avoid super-niche references.
  No quotes needed. No search needed.


  Draft:


  "I am three-quarters of the way through my second novel, and I have run into a difficulty
  that I suspect is less about craft than about what I am willing to admit to myself.
  My protagonist — a woman who has spent the whole book trying to hold her family
  together after her father''s death — must, for the final movement of the plot to
  work, conceal from her sister a letter revealing that the father''s will was altered.
  I have written the scene nine times, and each time the lie dies on the page: it
  is not that she refuses; it is that I cannot make her lie without her becoming,
  suddenly, a different person, one the previous two hundred pages do not support.


  My agent says I should just force it: plot first, plausibility second, readers forgive
  much. My writing group says the opposite, and repeats the workshop refrain that
  a novel only comes alive when its characters are allowed to become autonomous, that
  I must trust her and follow where she leads. The trouble is that when I hear myself
  saying ''she would never do that,'' I notice how convenient it is. If the character
  is a law unto herself, then the failure of the ending is her doing, not mine; I
  am not the person who could not find the ending, I am merely the person who was
  prevented. And yet the observation also feels genuinely true, a perception rather
  than an excuse: I really do seem to know what she would and would not do, the way
  one knows a stubborn friend.


  So my question is this: when a writer says the character will not do something,
  is that a real form of knowledge, or is it a way of handing one''s own decisions
  to a fictional other so as to be spared making them? And is there a principled way
  to tell, in the middle of a draft, whether I am following her or hiding behind her?
  If it is the latter, what would it look like to take the ending back — not by forcing
  the lie, but by deciding, in full view of myself, what I am going to make happen
  and owning that? Please lead with your bottom line in your first sentence, then
  give your reasoning; no preamble and no restating of my question."


