  while she is below, she re-retrieves it — and then inspects the nest again. Move
  the prey each time, and by some accounts she will loop indefinitely, never once
  revising the routine. Hofstadter''s name for this profile — condition-triggered,
  self-resetting rigidity — is sphexishness, and I want my students to hit the phenomenon
  from the inside rather than read about it. There''s a further complication I want
