  ---


  I sit on the grant-renewal panel of a mid-sized private foundation that funds theoretical
  research. Our rules commit us to a decision this spring on a fixed five-year block:
  the money goes entirely to one of two rival research programmes in a field I will
  describe in simplified form, since the panel''s dilemma is philosophical rather
  than technical.


  The older programme, which I''ll call the Attractor programme, has run for about
  twenty-five years. It began with a compact hard core — a set of laws about how its
  central quantities evolve — plus a flexible protective belt of modeling assumptions.
  Early on it produced a striking novel prediction, a scaling relation between two
  measurable parameters, which was confirmed and made its reputation. In the last
  dozen years its record looks different: four separate anomalies have each been absorbed
  by adding a free parameter or restricting the theory''s intended domain, and its
  one recent novel prediction came out wrong and was rescued by redefining what counted
  as a fair test. Its practitioners are the field''s best-trained, its mathematics
  the field''s most admired, and its defenders add that no rival explains the original
  scaling law as elegantly.


  The younger Sparse programme is roughly a decade old. Its hard core is thinner and
  its positive heuristic partly improvised; its models often look stitched together.
  But in the past three years it has made two genuinely novel predictions — stakes
  declared in advance, no adjustable parameters in play — of which one was clearly
  confirmed and one partially. It has also attracted most of the field''s recent graduate
  students.


  A minority on our panel wants to renew the Attractor programme anyway, on the ground
  that its theoretical depth and its training of students are worth more than a thin
  recent record; a minority wants to fund the Sparse programme and let the Attractor
  programme wind down; and a faction wants the split-funding compromise, saying that
  judging a whole tradition by a few years of predictions is exactly the kind of instant
  verdict science should resist.


  Draft the decision memo I will circulate before our June meeting. It should:


  1. Give a clear bottom line — renew the Attractor programme, fund the Sparse programme,
  adopt the split, or something else you can defend — together with the reasoning.

  2. Spell out, in terms the panel can actually apply, operational criteria for what
  counts as a novel prediction and for distinguishing a progressive from a degenerating
  problem shift, so that our decision does not just relabel our prior preferences.

  3. Take the strongest argument on the losing side seriously rather than restating
  our bottom line.

  4. Be honest about wherever the Lakatosian apparatus underdetermines our choice
  — e.g., whether a methodology that appraises long historical series, allows rational
  persistence in a degenerating programme, and forbids instant verdicts can license
  a forward-looking funding decision at all — and say what we should do at exactly
  those points where it gives out.


  Please write the memo in American English. Cite nothing and recommend no reading:
  the panel wants the reasoning worked out on the page, not a bibliography.


  ---


