  ---


  Construct a thought experiment to the following specifications. Two hedonic utilitarians,
  who agree on everything except which deaths to count, must reach opposite verdicts
  on a single ordinary decision: whether a person who eats chicken should switch to
  eating an equal amount of beef. The first counts only the animals slaughtered for
  food and must conclude that the switch prevents suffering; the second also counts
  wild animals killed in cultivating feed crops — tilling, pesticides, harvesting
  — invertebrates included, and must conclude that the switch increases suffering.
  Keep the scenario mundane: a grocery-store choice, no futuristic technology or hypothetical
  planets. To keep the case honest, stipulate round parameters openly instead of pretending
  to empirical data: the person eats 25 kg of meat per year; a chicken yields about
  1.5 kg of meat and a cow about 200 kg; chicken production uses about 2 kg of feed
  per kg of meat and grain-finished beef about 8 kg, of which you may assume half
  comes from row crops and the rest from pasture and inedible byproducts; and every
  death — chicken, cow, or wild — counts as one unit of badness. Treat the number
  of wild-animal deaths per tonne of feed, T, as unknown. Then: (1) run both utilitarians''
  calculations; (2) derive the threshold T* at which their verdicts diverge, and explain
  in plain terms what the world would have to be like for T to exceed it — for instance,
  by converting T* into deaths per hectare at a typical yield of ten tonnes per hectare
  and asking which classes of animals would have to be counted for the flip to occur;
  (3) identify which stipulated parameter does most of the work, and say how far it
  could vary before the flip disappears; and (4) give the strongest reply available
  to the death-counting utilitarian, who should not get to prevail by simply denying
  the arithmetic — for example by pressing some further consequence of her opponent''s
  own principles. The case is meant to isolate precisely what must be true of feed
  production for the familiar advice to replace chicken with beef to be reversed,
  so every verdict should fall out of explicit arithmetic rather than intuition.


  ---


