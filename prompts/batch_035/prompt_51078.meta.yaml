  ---


  I''m a retired electrician who spends a lot of time watching nature documentaries,
  and something about the way they talk has started to bother me. The narrator is
  constantly explaining things by what they''re for: the woodpecker''s skull is built
  thick so the brain doesn''t get rattled, the moth has eye spots so predators attack
  the wrong end, we blush so others can see we''re embarrassed. Nobody designed any
  of this, and no woodpecker ever sat down and decided to grow a thicker skull. Yet
  these explanations feel genuinely informative — you can test them, and they can
  turn out wrong (I gather the giraffe''s neck story is more complicated than "reaching
  high leaves"). A friend who took some philosophy courses told me there''s a name
  for this: "free-floating rationales," reasons floating around with no reasoner attached.
  It''s not just biology either. My grandmother''s jam recipe has you inverting the
  hot jars for ten minutes, and no one in the family remembers why; when I looked
  it up, the seal forms better that way. So there was a reason for the step all along,
  apparently, even after the person who knew it died, and even though my mother kept
  doing it without any reason in mind at all.


  Here''s what I''d like someone to untangle for me. What does this whole practice
  of giving and checking "what is it for" explanations presuppose? It seems like the
  practice only makes sense if reasons can exist without anyone to have them — that
  the moth''s spots have a reason even though no one, moth or man, ever reasoned about
  it. But maybe that''s too strong: maybe the documentaries are just speaking in shorthand,
  and "the skull is thick so the brain doesn''t rattle" really means something with
  no purposes in it at all, just a causal story about which variants survived. If
  it''s only shorthand, why does it feel like there''s a real question to be right
  or wrong about, one that isn''t just "what happened historically"? And where would
  the line fall — does a river have a reason to meander, or a planet a reason to orbit,
  or does the practice quietly stop somewhere before that? I''d also like to know
  whether the practice is consistent with itself, since the same programs happily
  insist that nature has no purposes whatsoever and then go on explaining everything
  as if it did. If instead we insisted that reasons strictly require reasoners, what
  would we actually have to give up or say differently — could the biologist still
  say anything the old way said, or only after some elaborate translation?


  ---


