  Principal Principle seems a natural combo. However, note the "in the weeds" requirement
  — prompts shouldn''t be regurgitation. A credence question about the Principal Principle
  with decomposition into sub-questions: whether chances exist (Humean vs anti-Humean),
  whether the PP as stated is refuted by the counterexamples (the "unconditional"
  PP failing when conditioning on admissible evidence is too weak — e.g., conditioning
  on the truth of the assignment), the status of the "Humphreys'' paradox" for propensities,
  whether the Base Principle / New Principle refinement is adequate, the connection
