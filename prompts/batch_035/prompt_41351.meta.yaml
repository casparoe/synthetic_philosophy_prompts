  is nothing over and above psychological continuity and connectedness, but where
  psychological connectedness is what grounds the rationality of future-directed concern.
  The two views agree there is no deep further fact; what I want is a case where they
  come apart on what follows practically.


  Construct a thought experiment with these specifications. The scenario should be
  realistic — an ordinary institutional setting such as a courtroom, a hospital, or
  a workplace — and no longer than one paragraph. It must feature a single agent whose
  psychological connectedness to some earlier self has been drastically thinned while
  the causal continuity of their organism and mental stream remains intact (for example
  through dementia, conversion, brain injury, or radical character change — choose
  something with plausible psychological detail). Then pose a practical question that
  both the agent''s own future-directed concern and third parties'' treatment of them
  turn on: something like whether they are owed, or owe, apology, restitution, punishment,
  or continuation of a commitment — pick one and make it concrete.


  Then walk through the verdicts. (1) A common-sense view on which the person simply
  persists. (2) The Parfitian reductionist, for whom what matters is psychological
  connectedness, so thinned connectedness should thin the practical claim. (3) The
  Buddhist no-self theorist working with causal continuity of the aggregates, who
  should get a different verdict from the Parfitian on your case — if you cannot make
  them diverge, say so honestly and explain what blocks it.


  Constraints on the design: the verdicts must be generated by the theories, not stipulated
