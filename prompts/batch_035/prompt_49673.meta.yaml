  Type options: slogan disambiguation, research proposal, teaching plan.


  Good combos:


  - CEV + slogan type: "The extrapolated part of coherent extrapolated volition" —
  CEV isn''t a slogan though. But there are slogans in the idealized preferences space:
  "If we knew more, thought faster, were more the people we wished we were" — that''s
  Yudkowsky''s line, would need verbatim quoting and fetching. Risky. Better: "rational
  preferences" or "be careful what you wish for." Hmm.


  - No-free-lunch + slogan type: "There is no free lunch" — the NFL slogan "no free
  lunch" itself. That could work: "no free lunch" in ML circles means "no algorithm
  dominates across all problems." The asker could ask what precise claim it makes.
  But there''s also the connection to Hume''s problem of induction ("you can''t get
  something for nothing"). Actually a nice prompt: software engineer hears "no free
  lunch theorem" invoked to argue that you can''t prefer one ML algorithm over another
  without data, or that induction is unjustified. Disambiguate readings.


  - Software engineer perspective fits no-free-lunch domain naturally! And a teaching
  type could also fit: explaining NFL theorem at a meetup. Or slogan type: "there''s
  no such thing as a free lunch" — originally an economics proverb (Ricardo?), repurposed
  in ML. A software engineer at work hears it invoked for everything. That''s good.


  - Do video-game characters matter morally + slogan type: slogans like "it''s just
  a game", "no one is being harmed." Software engineer — maybe a game dev! A game
  dev asking about "NPCs don''t matter, it''s just pixels." Hmm, that''s more asking
  for argument.


  - Video-game characters + research proposal: a games researcher proposing study
  on moral status of NPCs. Or a games company ethics board proposal.


  - Parental leave + slogan: "parents should be free to choose" / "it takes a village"
  / "a woman''s place"... "children are a lifestyle choice" — the idea that having
  kids is a private consumption choice so society owes nothing. That''s a real slogan
  in policy debates: "children are a choice." Software engineer perspective: colleague
  says "having kids is a lifestyle choice like buying a boat, why should my taxes
  fund your parental leave." That''s a nice slogan disambiguation: what does "it''s
  a choice" mean — chosen vs. foreseeably needed vs. society-dependent. Good.


  - Lobbying + slogan: "money is speech" (Citizens United), "corruption is quid pro
  quo", " sunlight is the best disinfectant" (transparency). Software engineer...
  "money is speech" is very rich for disambiguation. A software engineer hears "money
  is speech" from a coworker. But attribution to Citizens United — that''s fine, commonly
  known. Actually "money is speech" is a paraphrase of what critics say about Citizens
  United; the court never said "money is speech" verbatim (Buckley said spending is
  protected... Buckley v. Valeo: expenditure limits restrict speech). We could avoid
  attributions and just say it''s what people say. Software engineer angle: works
  at a company, hears it in a Slack debate about donations. Could ask: what precise
  claims could "money is speech" be making — that money is identical to speech (false),
  that money is instrumentally necessary for speech so restricting money restricts
  speech (substantive), that donors'' interests deserve protection... Good.


  - CEV + teaching type: teaching "ideal advisor" theories of well-being / CEV to
  a LessWrong meetup. Software engineer runs a rationalist meetup, wants to explain
  CEV/idealized preferences in 30 min. Plan the arc: why extrapolate at all, misconceptions
  like "the AI asks people in a simulation" or "it''s mind control," the carrying
  example (the coffee example — someone wishes for coffee but would wish...). That
  could be nice but teaching plans need dependency structures; CEV is niche-ish but
  fine for LLMs to know.


  I think the strongest combination for "in the weeds but meaningful without web access":
  NFL theorems and induction + slogan type, from a software engineer. The slogan "there''s
  no free lunch" — an ML engineer hears it used (a) as the Wolpert/Macready theorem
  about search/optimization averaging, (b) as a loose claim that no model class is
  universally better, (c) as an anti-induction claim that nothing generalizes without
  assumptions, (d) as a design cliché "everything is tradeoffs." Ask: which precise
  claims, which are provable theorems, which are trivial, which get the conclusion
  the person wanted.


  Alternatively "money is speech" is a classic. But NFL is more "in the weeds" for
  LLMs and the software engineer perspective is natural.


  Let me consider the competing objectives: prompts should inject some new/niche ideas
  so models can''t regurgitate. For the slogan type, the injection is the specific
  context where the slogan was used. E.g., a coworker used "no free lunch" to argue
