  The subtle flaw: "being in a position to know" is not knowing (a point from the
  literature — e.g., when the conclusion isn''t obvious, one can be in a position
  to know without knowing; the thought experiment does epistemic work by making the
  non-obvious obvious — this connects to the distinction between explicit and tacit
  knowledge, and to "logic of discovery"). Also (3) hides an equivocation: "premises
  we already knew" — but the thought experiment''s premises include idealizations,
  and the "intuition" premise (that in the imagined scenario, the tied-together bodies
