  Draft the prompt text:


  ---


  I keep running into two ideas from AI safety writing and I can''t get straight how
  they relate: ontology identification and inaccessible information. The way I understand
  it (tell me if I''m off), ontology identification is the problem that we can only
  specify an AI''s goals in human terms — "protect the diamonds", "be honest" — but
  the AI learns its own world-model, which carves the world up however was useful
  for prediction, and we then face the task of finding, inside that alien carving,
  the stuff our words were pointing at. Inaccessible information is the companion
  idea: there''s information that would matter enormously to us — about what the AI
  is "really" up to, about how its world-model divides things — that we can''t read
  off in practice; if we can get it at all, it comes second-hand from other AIs.


  To sort this out I made up a three-way split of the ways the lookup can go wrong:

  (a) translation failure — the AI does have a concept matching our "diamond", we
  just can''t find it in its internals;

  (b) carving failure — the AI''s world-model has no single thing corresponding to
  our concept (maybe our "diamond" comes out as several of its concepts, or straddles
  them);

  (c) access failure — we could in principle locate the concept, but only using information
  about the AI''s internals that''s inaccessible to us.


  My hunches, which I don''t trust: (a) is ordinary interpretability work that gets
  easier as the field matures; (b) is permanent and is really about the indeterminacy
  of our own words (a friend says it''s just Quine''s gavagai point in a lab coat
  — is she right?); (c) gets worse as the AI gets smarter, since smarter agents end
  up with weirder world-models.


  Act as someone who''s an expert in both philosophy of language and AI alignment,
  and think it through carefully before answering. Then give me exactly five numbered
  points, each a sentence or two, with no introduction or conclusion:

  1. what actually separates (a) from (b) — what test could tell us which one we''re
  facing?

  2. whether (c) is a fact about the information or just a fact about us (and whether
  that difference matters here),

  3. which of my three hunches you think is most likely wrong, and what you''d put
  in its place,

  4. whether (b) really is the gavagai story over again or something new that only
  shows up once the "language" being translated into is a non-human world-model, and

  5. whatever you think I''m most likely to be getting wrong that isn''t covered above
  — your call.


  Also please don''t pad anything with reading lists or name-dropping; I want the
  reasoning, not a bibliography.


