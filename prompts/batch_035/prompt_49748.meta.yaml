  I''m clerking for an intermediate appellate judge, and she''s asked me for a bench
  memo on a case that I''ve started calling "the flood ordinance mess." Short version:
  during a major flood two years ago, the county council passed an emergency ordinance
  against "exploitative pricing of essential goods." It was passed the day after the
  conduct it punished, never posted on the county''s site for six weeks (a clerk''s
  error), the "exploitative" standard was never defined beyond an internal guidance
  memo that a cousin in the clerk''s office quietly sent to a couple of store owners
  but not others, and enforcement was weirdly concentrated on shops that had backed
  the incumbent council''s rival in the last election. Defendant was convicted under
  it and now argues the ordinance "never became law" at all — not that it''s unconstitutional,
  that it *isn''t law* — so the conviction is void.


  The state''s answer is basically pure pedigree: the council followed its enactment
  procedure, the executive signed it, ergo law, and any defects go to how it should
  be applied or whether it survives due process, not to whether it exists. The judge
  wants me to take that side seriously — she thinks the separation of validity from
  merit is exactly what keeps judges from becoming a super-legislature — but she''s
  also clearly tempted by the idea that a rule that''s retroactive, secret, vague,
  and selectively enforced isn''t just bad law, it''s a failure to make law.


  One of the defense attorneys has added a wrinkle the judge finds "cute but dangerous":
  that legal validity comes in degrees, so the ordinance might be law enough to support
  civil fines but not criminal penalties. She wants to know whether that''s a real
  distinction she could write into an opinion or just vibes.


