  and whether meaning is in the object or in the interpreter is a matter of degree.
  Our professor challenged us to point at real engineering decisions and ask what
  theory of meaning they quietly commit you to, and I''ve become mildly obsessed with
  the ones humanity has actually made for talking to extraterrestrials.


