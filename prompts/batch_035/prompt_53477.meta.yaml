  without understanding either, and the gulf between such matching and genuine interpretation
  is a difference in kind, visible the moment one asks the system about idioms, register,
  allusion, or anything requiring a picture of the world. It seems to me Arrival is
  one of the few films about translation rather than about aliens, and I want a reading
  of it that takes Hofstadter''s worry seriously.


  Consider: the kangaroo anecdote Louise tells, in which an explorer mistakes I-do-not-understand
  for the name of an animal, is a compact dramatisation of exactly the pairing-without-understanding
  failure Hofstadter diagnoses in machine translation; and the near-catastrophe that
  follows when several governments read a logogram as denoting a weapon, while Louise
  insists the sign may equally express tool or use, plays out the same failure at
  geopolitical scale. Yet Louise''s own method — pointing at objects and names, waiting
