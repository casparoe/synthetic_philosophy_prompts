  Let me draft a four-move exchange:


  Setting: two people in my department/reading group arguing after a session on distributive
  ethics. Or two friends at dinner after one read Parfit. Keep asker a bystander.


  Move 1 (Maya): Egalitarianism (telic) says inequality is bad in itself, so when
  the only way to remove inequality is to lower the better-off without raising anyone
  — leveling down — egalitarianism must say the resulting state is in one respect
  better. That''s absurd, so we should be prioritarians instead: only absolute levels
  of well-being matter, worse off people''s interests just get weighted more; inequality
  has no intrinsic disvalue, so leveling down is unambiguously worse, no residue.


  Move 2 (Devon): The escape is less clean than it looks. The prioritarian weights
  imply their own residue: imagine the weights are steep enough that a one-unit gain
  for someone at the very bottom counts more than a thousand-unit gain for someone
  near the top. Then consider two states: in A, everyone is quite well off but the
  worst-off person stays at the bottom; in B, that bottom person gets one unit, and
  everyone else is knocked down close to the bottom, but the total and even most individuals
  are far worse off. A sufficiently steep weighting favors B. That is leveling down
  in all but name: the many are sacrificed for the one, and the theory says this is
  better, which seems at least as absurd as the egalitarian''s "in one respect better."


  Move 3 (Maya): Steepness is a contingent parameter, not part of the view. With moderate
  weights, no such case arises — the absurdity only comes from an extreme weighting
  no actual prioritarian holds. The leveling-down objection, by contrast, bites egalitarianism
  at its definitional core: equality being intrinsically good is the view, so the
  pro-leveling-down residue is not removable by tuning. So the two objections aren''t
  parallel: one attacks a core commitment, the other an edge setting.


  Move 4 (Devon): But the tuning doesn''t explain why the setting is where it is.
  If weights are moderate, then some benefits to the better-off outweigh benefits
  to the worse off — and the prioritarian must then say inequality of that magnitude
  is, in itself, of no concern whatsoever, that the only reason it matters is via
  the weighted sum. But then the prioritarian faces the mirror-image problem: where
  the egalitarian must say "better in one respect" when leveling down, the prioritarian
  must say "no respect in which it''s worse" when inequality explodes without anyone''s
  weighted total changing... Hmm, what''s the sharpest version? Devon could argue:
  the real lesson of leveling-down is about the structure of the theory, not its parameters:
  any theory that condenses all distributive information into a single ranking of
  outcomes by a sum-like measure will have cases where our intuitions about pro tanto
  claims (claims of the worse off, badness of inequality) outrun the verdicts. So
  Maya''s "contingent vs. core" contrast fails because the prioritarian''s core commitment
  — that distributive justice reduces to a weighted aggregate of individual well-being
  — is exactly what generates Devon''s case whenever weights are steep, and generates
  the opposite verdict (no pro tanto objection to inequality) whenever they''re shallow.
  Either way, some intuited pro tanto consideration goes missing.


