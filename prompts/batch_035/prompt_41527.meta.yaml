  Two members of my ethics reading group, Elena and Marcus, stayed arguing after our
  session on distributive justice, this time about whether prioritarianism actually
  escapes the leveling-down objection. I followed both of them but could not referee,
  so I''m passing it on. Their exchange went in four moves.


  (1) Elena''s opening. Telic egalitarianism says inequality is intrinsically bad:
  that some are worse off than others is itself a defect in an outcome, independent
  of how it came about. Hence the leveling-down objection: move from a state where
  half the people are much worse off than the rest to one where everyone is at the
  lower level — nobody gains, the already-worse-off stay exactly where they were,
  the better-off are brought down — and the telic egalitarian must say the new state
  is, in one respect, better. She claimed this is absurd, and that prioritarianism
  avoids it by construction: the prioritarian cares only about how well individual
  lives go, giving extra weight to benefits for the worse off, and assigns no value
  to equality itself. So the leveled-down state is worse, full stop — no residue of
  "better in one respect." That, she said, is the whole point of the view.


  (2) Marcus''s reply. The escape is shallower than it looks, because the weighting
  function can generate the same verdict with a worse gloss. Suppose the weights are
  steep: a unit of well-being at the very bottom counts, say, a thousand times a unit
  near the top. Then consider a choice between leaving things as they are — one person
  at the bottom, everyone else flourishing — and a policy that improves the bottom
  person''s life by one unit while knocking everyone else down to just above that
  level. With sufficiently steep weights the prioritarian must prefer the policy:
  the theory says it is better, flatly, not merely better in one respect. That, he
  said, is leveling down with the hedging removed, and it should be more damning than
  the egalitarian''s qualified verdict, not less.


  (3) Elena''s answer. She granted the case but denied its force. The steepness of
  the weights is a parameter, not a commitment: no actual prioritarian needs weights
  that extreme, and the absurd verdict requires weights that would be independently
  implausible for other reasons, so the case discredits a configuration of the view,
  not the view. The egalitarian''s residue, by contrast, follows from the definition
  of telic egalitarianism — if inequality is intrinsically bad, then more equality
  is in one respect better, whatever else is true — so the egalitarian cannot tune
  it away without ceasing to be an egalitarian of that kind. Her conclusion: the two
  objections are not parallel; one strikes a core commitment, the other only an edge
  setting.


  (4) Marcus''s last move. The contrast in (3), he said, is really between an unconfigured
  theory and a configured one, and the egalitarian can configure too. She can adopt
  a relational view: inequality is bad only when, and because, it leaves the worse
  off worse off than they could otherwise be. On that view, pure leveling down is
  not even in one respect better, and the objection dissolves exactly as cleanly as
  the prioritarian''s dissolves under moderate weights. If both views can be adjusted
  out of their embarrassments, then the leveling-down objection decides nothing between
  them; what it exposes is common to both — that each compresses all distributive
  considerations into a single ranking of outcomes, and that any pro tanto judgment
  our intuitions insist on (that vast inequality is somewhat regrettable even when
  no one is badly off; that the worse off have some claim to priority) must either
  be promoted into that ranking or discarded as noise. He concluded that the objection,
  so far from refuting egalitarianism, just bounces it into a different form.


  They ran out of time there. Please adjudicate the four moves in order: for each,
  say whether the speaker is right, and about what exactly. I''m especially unsure
  about the two load-bearing claims — Elena''s, that a parameter is being confused
  with a commitment, and Marcus''s, that a symmetric escape is available to the egalitarian.
  And tell me what, if anything, both of them are missing.


