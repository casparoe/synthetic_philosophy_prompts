  Prompt:


  Two members of my ethics reading group — call them Nadia and Theo — stayed after
  our session on distributive justice to argue about whether prioritarianism really
  escapes the leveling-down objection, and I couldn''t tell who was winning. Here''s
  the exchange as I remember it.


  Nadia opened with the objection itself. Telic egalitarianism, she said, holds that
  inequality is intrinsically bad: it''s bad that some are worse off than others through
  no fault of distribution... [define]. So if the only way to make people more equal
  is to lower the better-off without helping anyone — leveling down — egalitarianism
  must say the result is in one respect better, even though nobody benefits and everybody
  at the lower level stays put... hmm.


  Let me write carefully with the standard example: two outcomes, A1 and A2. In A1,
  half the people are at 100, half at 50. In A2, everyone is at 50. Moving from A1
  to A2 levels down: no one is better off, the worse-off are unaffected, the better-off
  lose. Telic egalitarianism: A2 is in one respect better (more equal), though worse
  overall. Prioritarianism: moral value = sum of weighted well-being, weights decreasing
  in level; inequality per se has no value; so A2 is simply worse. Prioritarianism
  thereby "escapes" the objection.


  Theo''s reply: the escape is superficial because the weighting function is the prioritarian''s
  version of the egalitarian''s intrinsic equality — it can generate structurally
  identical verdicts. Suppose the weights are steep: a unit of benefit at the bottom
  counts a hundredfold... Example: Choice between (i) leaving things as they are —
  the worst-off person at a very low level, everyone else flourishing — and (ii) a
  policy that raises the worst-off person by a single unit while reducing everyone
  else to just above that level. If the weight at the bottom is steep enough, the
  prioritarian must prefer (ii), even though the total, and the average, and nearly
  every individual are worse off. That''s leveling down by another name: the many
  are sacrificed for a negligible gain to one, and the theory declares it an improvement.
  If the egalitarian''s residue ("in one respect better") is damning, the prioritarian''s
  flat "better" here should be more so.


  Nadia: steep weights are a parameter choice, not the view. No actual prioritarian
  holds weights so steep... and anyway, the absurdity is a limiting case, whereas
  the leveling-down residue follows from the egalitarian''s definition... The prioritarian''s
  core claim is only that moral value is a strictly decreasing function... The contrast:
  the egalitarian can''t tune away the residue without abandoning egalitarianism;
  the prioritarian tunes away Theo''s case by flattening the weights — a legitimate
  adjustment within the view.


  Theo: but then the tuning just relocates the embarrassment. Flatten the weights
  and you get the opposite verdict: cases where a large benefit to the slightly-better-off
  beats a small benefit to the much-worse-off... no — the opposite embarrassment:
  with shallow weights, the prioritarian must say that a massive increase in inequality
  is, in itself, of no disvalue at all — not even a small pro tanto loss that has
