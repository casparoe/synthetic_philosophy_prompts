  I am a novelist, and I have written myself into a corner with a piece of philosophy.
  My current book is set in a village; one of its characters is an old woman whom
  the community has cast out — no one greets her, no one uses her name, and it is
  understood that when she dies no one will bury her as one of their own. I had meant
  to give her interiority through free indirect discourse, the narrator''s voice settling
  into her own, and to let the reader feel what the village refuses to see. Then,
  at a residency, I fell into the literature on ubuntu and on relational conceptions
  of personhood — the thought, common to several African philosophers, that a person
  is not a self-contained thing that then enters relations, but something constituted
  by relations: one becomes a person through other persons. I constructed an argument
  to establish what my novel needed, and it now seems to prove far too much. Here
  it is.


  (1) On the relational conception, personhood is constituted by relations of recognition
  with others: it is through being greeted, named, answered, mourned that one is a
  person.

  (2) If relations constitute a thing, they are not merely evidence of it; so where
  the constituting relations are absent, what they constitute is absent. A village
  that withholds recognition does not merely misjudge a person; it withholds the conditions
  of personhood.

  (3) My character''s community withholds recognition completely — she is not greeted,
  not named, and will not be buried as one of them.

  (4) So on the relational conception, she is not, or is no longer, or not fully,
  a person.

  (5) Yet every proponent of the view I have read would say the village is wrong about
  her — that she remains a person, and that their refusal is a failure to see what
  is there, which is what makes the refusal an outrage rather than a mere report.

  (6) But if she remains a person independently of their recognition, then personhood
  was never constituted by recognition in the first place, and the relational conception
  collapses into the very individualism it was meant to displace — a person after
  all, complete in herself, whom society merely decorates or abuses.


