  Option: Cluelessness + prove-too-much argument. The classic issue: consequentialism
  says do what has best consequences, but we''re clueless about long-run effects (ripple
  effects), so... Build a numbered argument concluding that consequentialism can never
  guide action, or that all acts are morally on a par, or that we should flip coins.
  Something with a subtle flaw.


  Classic argument (Lenman): effects of our actions propagate indefinitely, so we
  can''t know them; combined with "ought implies can" (epistemic access), consequentialism
  collapses. Counter: probabilistic expected value; disproportionate probabilities.
  A subtle flaw version: equivocation between "we can''t be certain of consequences"
  and "we can''t have any reason to expect one set of consequences over another."


  Let me draft a prove-too-much argument:


  (1) An act''s moral status, for a consequentialist, depends on the total of its
  consequences, all of them, forever.

  (2) Every act''s consequences ripple forward without end: my buying a coffee changes
  who I meet, when, hence eventually who exists.

  (3) Within a few generations, any tiny difference reshuffles which children are
  conceived, so the long-run effect of any act is dominated by huge differences in
  who exists.

  (4) We have no idea whether the far-future people who exist because of my coffee
  are better or worse off than the ones who would have existed otherwise, or even
  that the comparison makes sense.

  (5) So for any two acts, our evidence gives no reason to think one has better consequences
  than the other.

  (6) If consequentialism says one act is better than another, that must be grounded
  in something; if our evidence can never ground such a claim, consequentialism never
  tells us to do anything.

  (7) Conclusion: consequentialism implies paralysis, or that we should treat all
  acts as equally permissible — but consequentialists don''t believe that, and it
  seems absurd.


  The subtle flaw: slide from "we can''t be certain" to "no reason at all" — step
  (5). Actually the argument as stated jumps from "no idea about far future" to "no
  reason to prefer one act over another overall" — but near-term effects can dominate
  probabilistically? Actually the standard response: even if variance is huge, expected
  values could still differ (Bostrom''s careful argument). Or the "ripple" premise
  (3) applies only to some acts (those affecting conception timing) but... it does
  apply to most.


  Alternative subtle flaw: equivocation in (4)-(5) between "we can''t compare" and
  "comparison is undefined" vs "we don''t know". Also step (6): consequentialism needn''t
  be decision-procedural — it''s criterion of rightness, not a decision procedure.
  That''s a well-known escape. So the argument has multiple escape routes, making
  it a good "which premise do you reject and what does it cost" prompt.


  Alternatively, I could do a rank/rate type on the Great Divergence — rate how well-posed
