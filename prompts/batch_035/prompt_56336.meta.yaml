reasoning_summary: 'Pick a domain: "The units of selection debate (genes vs. individuals
  vs. groups)" and type: "Present someone''s summary of a view or result and ask whether
  it is fair." Write from a high school student''s perspective, formal/polished.


  The summary should be plausible, mostly right, with one or two subtle misrepresentations.
  Common subtle errors: conflating "gene as unit of selection" with "gene as replicator";
  claiming Dawkins denies organism-level selection entirely; conflating kin selection
  with group selection; claiming group selection was "refuted by Williams"; claiming
  genes are always selfish / organisms are mere machines. A subtle misrepresentation:
  "Dawkins proved that the gene is the only unit of selection, so selection never
  acts on organisms or groups at all" — that overstates; Dawkins''s claim is that
  the gene is the unit of replication, and he acknowledges vehicles/organisms. Another:
  conflating Hamilton''s inclusive fitness with group selection. Also "genes are visible
  to selection" vs "genes are immortal replicators."


  Write in the voice of a competent popularizer (a popular science book or a biology
  teacher). High school student perspective: "In my AP Biology class..." or "My uncle
  gave me a popular science book..."


  No verbatim quotes from real texts — so avoid quoting Dawkins. Attribute to unnamed
  book. Fine, no search needed.


  Draft:


  "My biology teacher recommended a popular science book... summarizes the units of
  selection debate like this: ''For decades biologists thought natural selection acts
  for the good of the species... Then Dawkins proved the gene is the only real unit
  of selection... genes are the only things that pass unchanged from generation to
  generation; organisms are just throwaway machines... group selection was decisively
  refuted in the 1960s and no serious biologist accepts it... kin selection means
  animals sacrifice themselves for copies of their genes in relatives, which shows
  even altruism is genetic selfishness.''"


  Subtle misrepresentations to include:

  1. Genes pass "unchanged" across generations — genes are not unchanged; they recombine,
  and the claim is about replicators being copied, but identity is across the copy
  relation. Actually Dawkins does claim genes are near-immortal — this is more of
  a simplification than an error. Better error: "the gene is the only unit of selection,
  so selection never acts on organisms or groups at all" — conflating unit of replication
  with unit of selection; Dawkins distinguishes replicators and vehicles, and grants
  selection can be described at multiple levels; the claim is about which entity benefits
  / has "interests."

  2. "Group selection was decisively refuted and no serious biologist accepts it"
  — overstated; multi-level selection is a live research program (Wilson, Sober; even
  kin selection formal equivalence, Gardner''s 1964 Price... ).

  3. Conflation: kin selection described as animals sacrificing for copies of genes
  — that''s roughly accurate, but "altruism is really genetic selfishness" conflates
  selfishness of genes with interests of organisms — using "selfish" in its everyday
  sense.

  4. "Selection acts for the good of the species" as the old view — a common caricature;
  V.C. Wynne-Edwards is real, and group adaptationism was common, but "for the good
  of the species" as naive orthodoxy for "decades" is a simplification — Darwin himself
  emphasized individual selection.


  Deliverable: audit — accurate parts, simplifications, misrepresentations, whether
  the conclusion follows.


  Write formally as a high school student: "I''m a high school senior taking AP Biology..."
  Avoid US-specific maybe fine.


