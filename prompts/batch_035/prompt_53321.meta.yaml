  My friend and I spent most of last weekend arguing about the Animal Welfare (Sentience)
  Act 2022, the UK law that put animal sentience into domestic legislation, and I
  have not been able to let it go since. To be concrete about what the Act actually
  does: it declares that animals are sentient beings, covers all vertebrates by default,
  and was amended during passage to extend coverage to decapod crustaceans (crabs,
  lobsters, shrimp) and cephalopod molluscs (octopuses, cuttlefish, squid) after a
  government-commissioned scientific review concluded there was strong evidence of
  sentience for at least the cephalopods. The Act''s machinery is an Animal Sentience
  Committee that scrutinizes whether government policy has had, or will have, adverse
  effects on animal welfare. Insects, snails, and everything else with a nervous system
  were left outside, and as far as we could tell the ordinary cruelty and welfare
  statutes still apply only to vertebrates, so the practical upshot for a lobster
  — which can now be declared sentient by one act and, apparently, still boiled alive
  without legal consequence under another — seemed close to nil.


  The thing we could not resolve is what boundary the law has actually drawn, and
  what theory of moral patienthood that boundary presupposes. Three features of the
  Act strike me as philosophically odd when taken together. First, the line is drawn
  by biological group: every member of the covered taxa is in regardless of its individual
  capacities, and every member of the excluded taxa is out regardless of theirs —
  a bee that solves problems, learns, and seems to play gets no standing, while a
  much less cognitively impressive decapod is covered. Second, the evidential burden
  is asymmetric: vertebrates were included without any fresh review of the evidence,
  while the invertebrate groups had to be earned through a scientific case strong
  enough to persuade Parliament. Third, the consequences are toothless relative to
  the declaration — sentience is recognized as a fact, but the duty it generates seems
  to be only that policymakers pay it some regard.


  So my questions: what view of the boundaries of sentience does this legislative
  pattern presuppose? Is it committed to sentience being a property that tracks lineage
  — that clades, not computations, are the right units of moral concern — or is the
  clade-based line better read as an epistemic and administrative proxy, a way of
  parceling out uncertainty about which animals feel rather than a claim about what
  feeling consists in? If moral patienthood really supervenes on the functional or
  computational organization of a nervous system, rather than on ancestry, is the
  Act''s way of drawing lines merely a tractable approximation that a functionalist
  could accept, or does it misclassify in a way that matters — protecting some animals
  that lack the relevant capacities and leaving out others that have them? And what
  exactly does the asymmetry between vertebrates and invertebrates presuppose: that
  the prior law had already settled the question for vertebrates, or that evidence
  is only required where the animals are alien to us? Finally, if the legislature
  took the computational criterion seriously — assessing animals by what their nervous
  systems do rather than which family they belong to — what would have to change?
  Would the Act have to extend to bees, narrow itself to particular species within
  the covered groups, or abandon group-level lines altogether for something more like
  case-by-case assessment, and would that be administrable at all?


