  "The claim that moral status supervenes on computation is the claim that there can
  be no difference in what a system is owed, morally, without some difference in the
  computation it performs — in other words, moral status just is a fact about the
  system''s computational profile, a fact about which function it implements. The
  strongest argument in favor is multiple realizability, first defended by Putnam:
  if pain, or any mental state, can be realized in carbon or silicon equally, then
  what matters is the organization, not the stuff. Suffering matters because of what
  it feels like, and what it feels like is fixed by the role the state plays, so what
  matters morally is fixed by that role too. To deny this because the system is made
  of the wrong material would be a kind of hardware chauvinism, exactly parallel to
  denying moral status to beings on the basis of species membership — the burden is
  therefore on the substrate chauvinist to point to the morally relevant physical
  property, and no plausible candidate has ever been produced. The most serious objection
  is the Chinese Room, where Chalmers argued that syntax is never sufficient for semantics:
  a system can manipulate symbols perfectly and still understand nothing, and if understanding
  can be absent while the computation is present, so can suffering, so computational
  profiles underdetermine moral status. Chalmers''s point is sometimes thought to
  be answered by the systems reply, but he plausibly denied that it helps. In any
  case, the proponent''s best reply is to bite a bullet: once moral status supervenes
  on computation, there must be a determinate threshold of computational complexity
  at which it begins — otherwise there would be no fact of the matter about what a
  system is owed, and it is absurd to think there is no fact of the matter about whether,
  say, an industrial robot can be harmed. Vagueness in this domain is impossible."


