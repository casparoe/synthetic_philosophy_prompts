  ---


  I''m a PhD student in political philosophy, and my cohort has a reading group on
  Pascal''s Pensées. Last week we did the fragments on justice and force and two of
  my cohortmates, Maya and Deniz, got properly stuck in over coffee afterwards. I
  stayed out of it but honestly couldn''t tell who was winning, so I''d appreciate
  a point-by-point adjudication in American English.


  The exchange, as best I can reconstruct:


  (1) Maya said the fragments amount to a debunking of justice. Her reading: Pascal
  notes that justice without force is powerless and force without justice is tyrannical,
  and concludes that since we can''t make the just strong, we''ve made the strong
  just — so actual legal orders are just force that''s been retroactively dressed
  up, and our sense of justice is mostly custom plus fear. On that reading Pascal
  is basically a proto-Hobbesian with a mordant streak, and his later religious appeals
  to justice have no footing he hasn''t already sawed off.


  (2) Deniz said that conflates diagnosis with endorsement. Pascal is exposing our
  confusion, not endorsing force: the complaint isn''t "justice is fake" but "we obey
  laws while telling ourselves a flattering story about why." The fragments even make
  the normative point explicitly, he said — the goal is to unite justice and force
  — which is a claim about legitimacy, not a surrender to might-makes-right. He also
  pointed to a fragment saying tyranny is wanting to get by force what can only be
  had by legitimate authority, which only makes sense if legitimacy and force come
  apart for Pascal.


  (3) Maya pushed back with the custom fragment: Pascal says custom is the whole of
  equity for no better reason than that it''s accepted. If the content of justice
  is whatever happens to be customary, that''s relativism, not diagnosis, and "uniting
  justice with force" just means the customs of whoever has the army.


  (4) Deniz answered with the three orders. For Pascal, justice and force belong to
  different orders, like body and mind — force can produce obedience but not obligation,
  and expecting force to ground justice is a category error, the same error as expecting
  the geometrician to prove first principles by strength of arms. So the project isn''t
  quietism: it''s saying the only thing that can legitimize force is something that
  isn''t force.


  (5) Maya''s last shot: if justice belongs to another order entirely and can''t be
  strengthened by force, then in the political world force wins by default, and the
  "unite justice and force" ideal is empty — you get a politics where the strong rule
  and Pascal gets to feel superior about it, which is exactly the retroactive dressing-up
  she started with. Deniz said that mistakes a limit on what we can know for a limit
  on what there is, and that Pascal''s wager shows he''s fine acting on something
  you can''t establish. Then they had to catch buses.


