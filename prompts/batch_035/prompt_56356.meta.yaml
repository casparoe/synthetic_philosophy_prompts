  I teach political philosophy and have been asked to contribute a position statement
  to an interdisciplinary working group on nuclear policy. Before I send it out I
  want a consistency audit, because I suspect some of what I believe is jointly unstable,
  and I honestly cannot tell where the problem lies, if there is one. Here is the
  position:


  (1) Nuclear deterrence is a fact, not a folly: mutual assured destruction has kept
  a peace among states possessing secure second-strike forces for longer than any
  comparable great-power peace, and this stability is compatible with, indeed presupposes,
  that the leaders on both sides are rational.


  (2) A threat is credible to a rational adversary only if that adversary assigns
  a high probability to its being carried out; and a rational leader, having absorbed
  a first strike and facing certain annihilation in retaliation, has no reason to
  carry out retaliation as a voluntary choice. So the central threat of deterrence,
  made as a considered decision, is incredible between ideally rational agents — the
  classic deterrence paradox.


  (3) The way out is structural: credibility should be manufactured by removing the
  moment of individual decision — through pre-delegation to lower echelons, launch-on-warning
  postures, or automated or procedural response systems — so that the probability
  of retaliation is high independently of what any single person would choose at the
  moment of truth. I endorse this direction in principle; a rational deterrent cannot
  rest on a last-minute decision that rationality cannot support.


  (4) At the same time, I hold that command and control must satisfy what I think
  of as an "always/never" requirement: the system must always work when duly authorized
  and never work otherwise, and the "never" side — protection against false alarms,
  accidents, miscalculation, and unauthorized use — is close to non-negotiable, however
  small the residual probability can be engineered to be.


  (5) I publicly support a declared policy of no first use, and I believe such a declaration
  would make deterrence more stable, not less, by removing incentives for preemptive
  strikes and by signaling that nuclear weapons exist only to deter nuclear weapons.


  (6) I also believe that the nuclear umbrella over allies remains credible under
  a no-first-use policy: an adversary contemplating a large-scale conventional invasion
  of an ally would still have to reckon with nuclear response.


