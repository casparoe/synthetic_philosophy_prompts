  My friend and I spent the better part of an evening arguing about whether a nation,
  as opposed to its individual members, can be guilty, and whether such guilt can
  reach people born long after the crimes. I''ll try to state each move as its proponent
  made it, not as I now judge it.


  (1) I opened with the ordinary practice: Germany is routinely said to carry a debt
  for the Holocaust, and institutions keep apologizing for it — official apologies,
  reparations, memorial obligations. If everyone accepts that a nation can owe something
  for crimes committed before most of its current members were born, guilt seems to
  attach to the collective itself, not just to dead individuals. (2) He replied that
  this confuses guilt with responsibility: the word ''guilty'' is a judicial and moral
  predicate that requires a guilty act by an agent who could have done otherwise,
  and no one born in 1970 could have done otherwise about 1943; what we inherit are
  duties of remembrance and repair, which are real but are not guilt — calling them
  guilt is a category error that debases a word reserved for wrongdoers. (3) I answered
  that the cases pull apart: we can make sense of a debt inherited by people who did
  nothing to incur it — an estate can be liable for the debts of the deceased — and
  inherited guilt is not obviously worse than inherited liability; if heirs can owe
  money, heirs of a polity can owe remorse and repair. (4) He said the analogy fails
  precisely where it matters: debt is transferable because money is impersonal, but
  guilt is not transferable because it is personal — it essentially references the
  agent''s own will — so ''inherited guilt'' can only be a metaphor, and treating
  it literally produces the very thing Jaspers feared: where everyone is guilty, no
  one in particular is, and the genuinely culpable hide in the crowd. (5) I conceded
  the dilution worry was serious but pressed a counterexample: a polity that deliberately
  perpetuates itself as the same agent — teaching its children a sanitized history,
  keeping the victims'' property, defining membership by descent from the perpetrator
  generation — seems to have made itself into a continuing accomplice after the fact,
  and at that point the born-later members are not inheriting guilt at all; they are
  incurring it. (6) He closed by saying that in my own example it is again particular
  people — curriculum writers, officials, property holders — who incur guilt, and
  the nation never appears as a separate wrongdoer; the collective is just the site
  where individual wrongs accumulate, and inflating it into a guilty super-person
  is how states launder their members'' blame.


