  Prompt draft:


  "I''m preparing a seminar unit on where meaning resides — in the message itself,
  in the receiver, or in the relation between them — loosely organized around Hofstadter''s
  distinction in Gödel, Escher, Bach between the frame message (the signal that there
  is a message here at all, and that it needs decoding), the outer message (the information
  needed to identify the decoding scheme), and the inner message (the content once
  decoded). Before I ask my students to take sides I want the specification that any
  theory of the location of meaning would have to meet. Write the desiderata, each
  with the case or consideration behind it: how the theory must locate each of the
  three message layers without simply relocating the problem; how it must break the
  regress of decoding (since recognizing and exploiting an outer message already requires
  decoding capacity — a book of Chinese instructions for reading Chinese is useless
  to someone who can''t read Chinese); what it must say about messages that are never
  decoded (a letter read by no one, a language no living person speaks) — whether
  meaning is present, absent, or waiting; how it must handle the same artifact yielding
  different contents in different receivers, without either collapsing meaning into
  the receiver''s response (so that anything at all could mean anything) or making
  the receiver''s contribution nugatory; what principled line it must draw between
  a message and mere noise — what makes the sequence of bases in DNA or a hypothetical
  SETI signal a message while a crystal''s lattice is not, when none of these comes
  labeled; whether it can allow that a message can carry its own decoder, as the Rosetta
