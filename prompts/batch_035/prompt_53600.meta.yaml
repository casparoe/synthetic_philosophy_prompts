  Let me design the prompt:


  A person constructing a theory of where meaning resides — in the text, the decoder,
  the interpreter? They want the specification: what any adequate account of the location
  of meaning has to deliver. Draw on the frame/outer/inner message idea (Hofstadter
  in GEB): the frame message tells you a message is there and needs decoding (e.g.,
  "this is in Japanese"); the outer message tells you how to decode (recognizing it''s
  Japanese, finding the decoder); the inner message is the content. Meaning seems
  to require the receiver to already have decoding capacity — so is meaning in the
  message at all?


  Requirements the theory must meet:

  - handle the fact that decoding itself requires prior knowledge, so there''s regress;
  theory must say where the regress stops (innate structures, shared biology, learned
  conventions)

  - account for the same message eliciting different content in different receivers
  (music, poetry)

  - handle messages that carry their own decoding instructions only partially (codebooks,
  DNA, Rosetta stone, radio signals from aliens — SETI)

  - distinguish between meaning that is intrinsic vs. assigned by interpreters (must
  not collapse them, or must justify collapsing)

  - be consistent with the idea that a message can be meaningful without ever being
  decoded (a book in a dead language, unread letters) — must give a verdict on whether
  meaning exists unread

  - handle self-referential messages and messages about their own decoding (this sentence
  is in English)

  - shouldn''t make meaning wholly arbitrary (a heap of sand isn''t a message) — distinguish
  message from noise, must say what makes something count as a message at all (the
  frame message question)

  - negotiable vs non-negotiable; tensions: e.g., "meaning is at least partly in the
  artifact" vs. "no meaning without a community of interpreters" — perhaps jointly
  unsatisfiable? Flag pairs that might be jointly unsatisfiable: "meaning is receiver-independent
  in the sense that a message could have had the same meaning if no receiver ever
  existed" vs. "meaning is constituted by decoding activity."


  Then score briefly: the triad picture (frame/outer/inner located in message + decoder
