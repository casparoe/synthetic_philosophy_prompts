  fully cohere. Here are the commitments, as best I can state them. First: a character''s
  traits are dispositions. To say my protagonist is patient is to make a claim about
  how she would tend to act and react across a range of situations, not about any
  single scene. Second: a character can possess a trait that is never manifested anywhere
  in the book. I know my current heroine would walk into a burning building for her
  brother, though no fire ever occurs in the novel, and I think a reader who inferred
  as much from what the text does show could be right. Third: manifestation doesn''t
  suffice either. A character who performs generous acts purely out of vanity is not
  generous but vain; the mask doesn''t count. Fourth: there is a fact of the matter
  about a character''s traits over and above anything the text displays — trait ascriptions
  to fictional people can be correct or incorrect, and not merely by my say-so at
  the moment of writing. Fifth, a craft doctrine I hold firmly: the only honest way
  to establish a trait on the page is to test it — to place the character in the situation
  that would call the trait forth and write what happens; otherwise you''re just asserting.
  And sixth: if I resolve, as author, never to let my coward face a real test — always
  to ring the phone, always to contrive his escape or anesthetize him with Dutch courage
  before the danger can arrive — I have not thereby made him not-a-coward. The cowardice
  is still there; I''ve only made sure it never shows.


