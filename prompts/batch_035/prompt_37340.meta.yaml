  ---


  I''ve been following the argument about whether culture evolves in a Darwinian way
  for a while now, and it''s completely stalled, and honestly I can''t tell anymore
  whether the two sides are even disagreeing about something. I''d like a diagnosis
  of the disagreement itself, not a survey of positions or a verdict on who''s right.


  Here''s the shape of it as I understand it. One side holds the memetics line: culture
  really is a Darwinian system. There are replicators (memes, roughly), they get copied
  with variation, some variants get copied more than others, and lineages of ideas
  can be traced the way you''d trace lineages of genes. The fact that most ideas are
  junk and a few spread like wildfire is supposed to be explained by selection pressures,
  some of which have nothing to do with whether the idea helps the person holding
  it — the idea spreads because it''s good at getting copied, full stop.


  The other side — the cultural attraction people, plus some of the dual-inheritance
  modelers who kept their distance from memes — says the copying story doesn''t describe
  actual transmission at all. When something passes from one head to another it''s
  not copied, it''s reconstructed: the listener rebuilds the idea from a sketch, and
  the reconstruction is systematically biased, so over generations the versions drift
  toward certain forms — memorable ones, ones that fit prior expectations, ones that
  are easy to tell. Those attractor basins do the work that ''replicator fitness''
  was pretending to do, and there''s nothing in culture stable enough across transmission
  to be a gene analogue anyway.


  And that''s where it sits, and has sat for what, twenty years? The memetics people
  lost the mainstream but never conceded; the attraction people won the room but keep
  arguing the point anyway.


  My working hypothesis, and take it as just a hypothesis: it''s at least partly a
  verbal dispute about how much has to be faithful before you''re allowed to say ''Darwinian''.
  The memetics side means descent with modification and differential success; the
  attraction side means literal replication, and since nothing in culture meets that
  bar, they conclude culture isn''t Darwinian — which looks less like an empirical
  claim and more like a decision about how to use a word. But I suspect there''s a
  real formal question buried in there too, something like: in a population of things
  that are transmitted with heavy noise plus systematic bias, is there still a well-defined
  notion of selection that you could measure, or does the bias eat the selection?
  And if that question has an answer, wouldn''t that dissolve the rest?


  So: what kind of disagreement is this actually? Verbal, or substantive and just
  hard, or two research programs that each work fine on their own turf and are fighting
  over turf that neither needs? And what, concretely, would count as progress — a
  formal result, a case where one side''s machinery plainly fails, some kind of data?
  I''d rather hear ''nothing will move it, and here''s why'' than a hopeful answer,
  so don''t sugar-coat it.


