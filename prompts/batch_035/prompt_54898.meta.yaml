  ---


  I am a third-year Philosophy student and the student representative on my university''s
  Estates and Environment Committee. At next month''s meeting the committee must decide
  on a proposal from the grounds team to convert roughly eight hectares of regularly
  mown amenity grassland — lawns, verges, and the margins of two sports pitches —
  into wildflower meadow and seasonal wetland scrapes, including three new wildlife
  ponds, as part of the university''s biodiversity action plan. Most of the committee
  expects an easy yes on ecological grounds.


  However, our student Animal Welfare Society has submitted an objection that has
  genuinely divided members. Their argument runs as follows: the overwhelming majority
  of individual animals in such habitats are small, short-lived creatures — insects,
  insect larvae, amphipods in the ponds, young amphibians, small mammals — and for
  most of these the typical life ends early through predation, starvation, parasitism,
  desiccation, or freezing. If welfare is aggregated over individuals without weighting
  by size or lifespan, then habitat creation may be net bad: we would be manufacturing
  enormous numbers of lives that are plausibly miserable on average, whereas close-mown
  grassland, though ecologically impoverished, supports far fewer sufferers. They
  add the mirror-image point that follows from the same premises: by this reasoning,
  some habitat destruction would count as good, which they take to be a reductio;
  others on the committee take it to follow quite straightforwardly. A second group
  argues the reverse — that mature, biodiverse habitat supports longer-lived animals
  with better welfare, and that the correct comparison is not ''many small lives versus
  few'' but the net welfare of the whole ecosystem under each management regime, which
  nobody can currently estimate.


  The grounds team wants a decision before the end of term, since the meadow must
  be seeded by early autumn and the contract for mowing needs renewal or termination.


  Please act as a professional philosopher specialising in animal ethics and environmental
  ethics, with experience drafting decision documents for non-specialist committees.
  Before you write, brainstorm: set out the live positions (including ones I have
  not stated), the value assumptions each smuggles in — particularly about whether
  insects and other invertebrates have welfare states at all, how to aggregate welfare
  across vastly different numbers, sizes, and lifespans of animals, and whether we
  should count the value of an ecosystem or biodiversity itself independently of the
  experiences of the animals in it — and what the committee can actually do under
  uncertainty. Then draft the decision memo the committee will circulate before the
  meeting.


  The memo should recommend a concrete course of action — approve, approve with conditions,
  reject, or approve a modified proposal — with whatever time frame and monitoring
  commitments the recommendation needs to be actionable. It must engage the Animal
  Welfare Society''s objection seriously rather than dismissing it, give an honest
  treatment of the strongest consideration on whatever side loses, and be candid about
  the extent to which the recommendation rests on a value judgement that no amount
  of ecological data could settle. Please keep it under 1,200 words and write it so
  a facilities manager with no philosophy can follow the reasoning.


