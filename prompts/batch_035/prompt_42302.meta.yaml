  own reflective values, which the person endorses; CEV has no such anchor because
  it says "if we knew more" — knowing more could change any value, so which changes
  count is decided by whoever sets the target; (4) she says the same is true of ordinary
  deliberation — learning can change values, and we don''t think education overrides
  autonomy; (5) he says ordinary education happens and you remain the same continuous
  person checking the results; a singleton extrapolation with no feedback loop is
  different — a jump, not growth. Ask to adjudicate move by move and take a committed
