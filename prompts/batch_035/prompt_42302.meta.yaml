  rounds.


  Or the argument type with Hilbert''s hotel: (1) If a hotel can be fully occupied
  and admit a new guest, then "full" doesn''t mean... Actually the classic: Hilbert''s
  hotel shows counterintuitive results; but a "proves too much" argument: finitist
  friend argues: (1) If actual infinities are possible, Hilbert''s Hotel is possible.
  (2) In Hilbert''s Hotel, the hotel is full and also has vacancies (it can always
  admit more). (3) Full means no vacancies. Contradiction... So actual infinities
  impossible. The flaw: "full" relative to a bijection with ℕ; full doesn''t mean
  "cannot admit more" for infinite sets. Actually the subtler flaw: premise 2 equivocates
  between "every room occupied" and "no more guests can be accommodated." That''s
  a known answer though — models have seen this. Hmm, "in the weeds" required. Maybe
  less regurgitable with CEV.


  CEV disagreement adjudication: The debate content can be somewhat novel: e.g., one
  friend argues CEV respects persons because extrapolation is like the "sober you"
  vs "drunk you" — we accept that; other counters that CEV extrapolates away from
  all current disagreements, so it''s like replacing your vote with the vote of an
  idealized version of you who already agrees with the extrapolator''s theory of goodness
  — bootstrapping. Rounds: (1) he says CEV is a paternalism machine: "what we''d want
  if we knew more, thought faster" describes someone who isn''t us; (2) she says we
  already discount present preferences — the person who wants to quit smoking mid-craving,
