  I''m a software engineer, zero philosophy background, but I like reading weird stuff.
  Last week someone in our team Slack linked a blog post about something called "safe
  Pareto improvements" and it started a whole argument between two of my coworkers,
  Dave and Samir. I''ll try to explain the idea fairly first, since the post is kind
