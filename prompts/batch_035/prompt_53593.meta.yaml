  The idea, roughly: when two parties are about to get into a costly conflict — a
  war over territory, a price war, a lawsuit — they can often agree in advance to
  replace the conflict with some other procedure (say, a coin flip for who gets the
  territory). The trick is designing the replacement so that each side is guaranteed
  to be no worse off than in the original conflict, no matter what the other side
  does. So if both sides honor the coin flip, both save the cost of the war. If one
  side ignores the flip it lost and attacks anyway, the other side just plays the
  war it was going to play anyway — so it''s no worse off than without the deal. Because
  of that, the argument goes, the deal can be struck between parties with zero trust
  and no enforcement mechanism, which is supposedly what makes it different from ordinary
  contracts.


  Anyway, the argument in Slack:


  Dave went first: he said this is nothing new, it''s just gains-from-trade repackaged.
  Economists have known forever that avoiding destructive conflict is a Pareto improvement,
  and replacing a fight with a lottery is straight out of basic expected-utility theory.
  Calling it "safe" is branding.


  Samir said no, the novelty is exactly the safety part. Normal bargains assume enforcement
  — courts, property rights. This construction is deliberately built so you don''t
  need it: even if the other party betrays you, you''re no worse off than the no-deal
  baseline. That''s not the standard bargaining result, that''s the whole point.


  Dave pushed back that the safety is fake in any real setting. It only holds if your
  fallback behavior stays exactly the same as in the no-deal world. But once the deal
  exists, both sides change their behavior — you don''t mobilize, you don''t stockpile,
  the opponent knows that, and the guarantee quietly evaporates. The math is doing
  "ceteris paribus" work.


  Samir answered that every real-world contract also rests on idealizations, and the
  interesting class of deals is the approximate ones: things like hotlines and deconfliction
  agreements between actual enemies, which are cheap and safe precisely because betrayal
  doesn''t make you worse off than the status quo.


  Dave''s last message: but look at which deals actually happen between enemies —
  hotlines, incident-prevention, all marginal coordination over stuff both sides already
  didn''t want. Nobody ever does the coin flip over the actual territory. So either
  the idea covers only the trivial part, or the radical part (redistributing the big
  stakes by lot) never happens, because the loser of the coin flip can''t sell that
  outcome at home. Samir replied that legitimacy constraints are just costs you price
  in, and the theory tells you the ceiling; the gap between ceiling and practice is
  the finding, not a refutation.


