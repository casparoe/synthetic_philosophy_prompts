  I teach a philosophy of mathematics course for third-years, and every year when
  we get to the axiom of choice I lean on the stock analogy: the axiom is ''obviously
  true'' because, given any collection of nonempty sets, you can just go through and
  pick one element from each — like picking one sock from each pair in a drawer of
  infinitely many pairs. Russell''s old shoes-vs-socks version gets a laugh: for pairs
  of shoes you don''t need any axiom, just say "take the left shoe each time," but
  socks have no distinguished member, so the choice function has to be posited. This
  year a sharp student pushed back hard, and I realized I''ve been using the picture
  to do more work than it can carry. She pointed out that the analogy has a physical
  chooser with a procedure, who picks socks one at a time, in time, with each pick
  leaving a record — and that the axiom asserts a single set encoding all the picks
  at once, with no procedure, no time, and possibly no definable rule at all. And
  of course there''s the other direction: the same "just pick one" intuition gets
  used to defend full AC, whose consequences include well-ordering the reals and Banach–Tarski,
  and it''s not obvious that sock-picking intuitions should underwrite those.


