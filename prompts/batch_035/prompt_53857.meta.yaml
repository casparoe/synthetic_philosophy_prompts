  My best friend and I spent the better part of Saturday night arguing about whether
  self-deception is even possible, and by the end I realized I could not state her
  position, only her verdicts on examples. I would like your help reconstructing the
  principle she is implicitly running. Please take the role of a professional philosopher
  working in philosophy of mind and action theory, think carefully, and begin with
  a short brainstorm of candidate principles before committing to anything.


  Her verdicts, in the order they came up:


  1. The husband who insists he has "no doubts at all" about his wife''s fidelity,
  yet steers every conversation away from the topic, never checks the phone bill,
  and flinches whenever her name is mentioned in certain tones — self-deception: yes.

  2. The smoker who tells herself she is not addicted and could quit whenever she
  wanted, and who refuses to keep count of how much she smokes — yes.

  3. The woman who deliberately leaves a genetic test result envelope unopened for
  two years and says, when asked, that she would simply rather not know — no; my friend
  called this evasion, not deception of oneself.

  4. The founder who daydreams about her startup''s success but, asked point blank,
  says the odds are long — no; fantasy is not belief, my friend said.

  5. The man who consciously resolves to believe he loves running, repeats affirmations
  daily, and eventually does believe it — no; that is deliberate belief cultivation,
  and nothing is hidden from him.


  Then two new cases... she left before we got to them, and I want to predict what
  she would say:


  Case A: a man who, in a low moment, admits to a friend that of course he knows the
  marriage is over — he has even quietly consulted a lawyer — yet in every ordinary
  context asserts, with what appears to be full sincerity, that things between them
  are good, and seems genuinely surprised and hurt when others treat the marriage
  as troubled.

  Case B: a woman with no wish to be ill who, after a twinge in her chest, spends
  nights seeking out and crediting the most alarming medical pages, dismisses the
  reassuring ones as superficial, and has come to sincerely believe she has a serious
  heart condition despite clean test after clean test.


  Questions: What rules fit her first five verdicts equally well? What does each predict
  for A and B? Give your best guess with reasons, and tell me which further case,
  if she judged it, would most cleanly separate the candidate rules from one another.
  Finally — do her verdicts, taken together, amount to an answer to the question we
  started with, namely whether self-deception is possible at all?


