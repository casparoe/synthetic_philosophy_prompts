  where, say, a radioactive atom decays within the minute; each round the pot doubles.
  He insisted that since the only branches containing any future experience of mine
  are ones where I survive rich, I am guaranteed subjectively to walk away a winner,
  so refusing is irrational. I refused anyway, and gave two reasons: that in most
  of the measure where I survive the early rounds, I survive badly injured rather
