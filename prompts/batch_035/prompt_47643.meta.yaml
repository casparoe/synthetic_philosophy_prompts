  is Born measure, not branch count. If a quantum coin comes up heads in many physically
  distinct branches totaling 1% measure and tails in one branch totaling 99%, that
  is simply a 1% chance of heads, and there is no further fact about how many branches
  each way that rationality or ethics should track.

