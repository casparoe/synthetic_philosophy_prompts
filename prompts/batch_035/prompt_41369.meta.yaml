  violence will keep falling, and great-power war is pretty much obsolete. And the
  20th century is the counterexample people raise — it was the bloodiest century in
  absolute numbers — but Pinker showed that was just a statistical illusion caused
  by there being more people around, so the objection dissolves.'' I''m inclined to
  believe things are getting better, but something felt off in how he put it. Can
