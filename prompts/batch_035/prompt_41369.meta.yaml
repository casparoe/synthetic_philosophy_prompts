reasoning_summary: 'Pick a domain and type. Domain: "Is the world becoming less violent?"
  combined with "Present someone''s summary of a view or result and ask whether it
  is fair" — the summary would be a pop-science gloss of Pinker''s decline-of-violence
  thesis. I can write a plausible pop summary with subtle misrepresentations: e.g.,
  conflating "violence has declined" (a historical claim) with "is declining right
  now"; presenting per capita vs absolute; presenting Pinker''s claim as about absolute
  numbers dropping; saying "Pinker proved" etc. Need subtle errors, no howlers.


  Common subtle misrepresentations:

  - "Pinker showed that every form of violence has declined steadily" (overstatement
  — he focuses on certain forms; declines aren''t monotonic).

  - Conflating "declined since the past" with "will continue to decline" / prediction.

  - Treating per-capita rates as if absolute numbers also fell (world war deaths in
  absolute terms have risen with population; per capita is the relevant metric).

  - Saying his claim is refuted because 20th century had the worst wars in absolute
  terms — presenting a standard objection (the 20th century being the bloodiest) as
  a refutation, when Pinker''s argument addresses it via per-capita rates.

  - "since hunter-gatherer times" — archaeological dispute.

  - The claim that violence is now at an all-time low "and therefore wars between
  great powers are impossible now" — a non sequitur.


  Casual voice, typo or two, request American English. No quotes from real text —
  the summary attributed to a book club friend / podcast. Avoid verbatim quotes; put
  the friend''s summary in the prompt — the summary itself is my own writing, in quotation
  marks? The example prompts use quotes around the summary. The hard rule: never quote
  from memory; quoting my own invented summary is fine. But the instruction says "no
  quotation marks around the prompt" — that''s about the whole reply, not internal
  quotes. Fine.


