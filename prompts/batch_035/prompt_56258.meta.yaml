  1. "The practice, restated" — restate the two faces of the practice (revival judgments
  and outline-policing) in your own words, so we''re sure what''s under discussion
  (~150 words).

  2. "The implicit theory" — reconstruct the view of categories and identity that
  revival practice needs at minimum: what a letterform''s identity could consist in
