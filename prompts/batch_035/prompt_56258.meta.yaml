  In the type-design trade, a "revival" is a new digital typeface presented as a modern
  instantiation of a historical one — a Garamond or a Baskerville redrawn for today''s
  sizes and screens. Nobody can copy the original letterforms: the surviving specimens
  are worn, distorted by press pressure and ink spread, and a revival must in any
  case redraw the design at new weights, new contrast, new proportions, often for
  a different medium. Yet designers routinely say of a good revival that it is the
  same design, and of a bad one that it has lost the design — even though no visible
  outline in the revival matches any visible outline in the original. At the same
  time, the same profession treats the exact outlines as the thing that matters when
  ownership is at stake: a foundry accuses a competitor of stealing a typeface by
  comparing curves point by point, and in the United States the courts have held that
  the letterform designs themselves are not eligible for copyright (Eltra Corp. v.
  Ringer, 1978) while the font software that draws them is protected as code — so
  what the law protects is precisely the file, not the design.


  I''m curious what theory of letterform identity and categorization this pattern
  of practice presupposes. When designers judge that a revival is still the same Garamond
  despite wholesale changes to every visible feature, are they presupposing that identity
  rides on some hidden structural invariant — the underlying stroke skeleton that
  teachers of lettering make students draw before any weight or contrast is added
  (Gerrit Noordzij built an entire theory of writing on this idea) — or is that too
  strong, with the practice compatible with a family-resemblance view anchored to
  a few exemplar letterforms? Conversely, when the same community polices knockoffs
  by comparing outlines, is it presupposing something inconsistent with the revival
  view, or is it simply answering a different question — who made this file — under
  the same word? And how does all this bear on the everyday miracle the letterforms
  are for: that a reader recognizes every ''a'' as an ''a'' across wildly different
  designs, and even recognizes a single design''s ''a'' after the designer has interpolated
  it to an intermediate weight that never existed as a drawn letter?


