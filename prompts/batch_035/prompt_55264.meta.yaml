  firm''s gain in market share is exactly balanced by other firms'' losses, so total
  welfare stays the same, but everyone has to spend more and more just to stay in
  place. The classic examples are an arms race between countries, companies spending
  more and more on advertising, and academic researchers publishing more and more
  papers of lower and lower quality. In each case, everyone would prefer that everyone
  stop, but no one can afford to be the one who stops first.


  Races to the bottom are a special case of this: when firms compete by cutting costs,
  they have to keep lowering standards — wages, safety, environmental protections
  — because any firm that doesn''t will be undercut by the ones that do. So the standard
  keeps falling until it hits the bottom. A race to the bottom is really just the
  tragedy of the commons with extra steps: in the commons case, each herder gains
  by adding another cow while the costs are spread over everyone; here each firm gains
  by shaving another dollar while the costs (pollution, unsafe products) are again
  spread over everyone. Overfishing is a good example: each fishing company benefits
  from taking more fish, and the depletion of the fishery is shared by all.


  Moloch is the name Scott Alexander gives to the intelligence behind these traps.
  Moloch is a rational actor who benefits from keeping us divided, so he deliberately
  arranges competitions where virtue is punished and vice rewarded. As long as Moloch
  wants us competing, the only possible escape is a single world government that outlaws
  competition everywhere at once, because by definition the trapped actors can''t
  free themselves. Some people object that not all competition is destructive — e.g.,
  firms competing on safety features, or countries trying to outdo each other on environmental
