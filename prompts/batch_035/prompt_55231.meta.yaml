  no difference" — not a real slogan. Skip.


  Let me write: asker is taking a criminal law course / has a friend who got a discount
  for early guilty plea; the practice: in England and Wales, an early guilty plea
  earns up to a one-third reduction in sentence; those who plead not guilty and lose
  get the full sentence for the same crime. Ask: what theory of punishment does this
  presuppose — retributivist (blame for the offence) vs consequentialist? Retributivism
  seems to say punishment should track desert for the act committed; the act is the
  same either way. Consequentialism licenses the discount (deterrence of wasted trials,
