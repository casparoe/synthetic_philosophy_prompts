  abhor. What theory of punishment does the guilty-plea discount presuppose? This
  is well-known but not over-discussed, in the weeds enough.


  Alternatively: parole boards asking about remorse. Remorse-based leniency presupposes
  something about inner states. That''s also good.


  Or combine with the presupposition type on Hegel''s war? Harder.


