  ---


  I''m in an informal reading group on free will, and last week''s session was about
  ''sphexishness'' — a term Douglas Hofstadter coined after the digger wasp of the
  genus Sphex. The wasp''s routine: she drags a paralysed cricket to the rim of her
  burrow, leaves it, goes down to inspect the burrow, comes back up, retrieves the
  cricket, and carries it inside. If an experimenter nudges the cricket a few centimetres
  away while she is inspecting, she emerges, drags it back to the rim, and — this
  is the striking part — descends to inspect the burrow again before retrieving it.
  She will do this dozens of times without ever shortening the routine by carrying
  the cricket straight down. Hofstadter''s coinage: ''sphexishness'' for mechanical
  rigidity of that kind.


  Then the disagreement between two members — Tomasz and Priya? Use fresh names: "Daniel
  and Marta"? Examples used Priya and Tom already; pick "Wes and Ingrid" or "Jonas
  and Cleo". Use "Jonas and Cleo".


  Moves as numbered.


  1. Jonas: the loop shows the wasp is pure mechanism — no "seeing" the situation;
  and wherever we unreflectively repeat routines we are sphexish too; free will should
  be understood as freedom from sphexishness.

  2. Cleo: experimental setup is ecologically invalid — nothing in the wasp''s evolutionary
  history moves crickets; a creature can be perfectly adequate in its natural environment
  and only look stupid in a rigged lab. So the wasp has whatever level of agency its
  niche demanded; the demonstration shows nothing about lack of free will.

  3. Jonas: that makes agency too cheap and environment-relative — our intelligence
  also relies on environment stability; we only look flexible because nobody has moved
  our cricket yet; by her standard free will is just a temporary absence of adversarial
  observers.

  4. Cleo: the difference is that humans can be informed of their loops and then do
  otherwise — the wasp can''t be told, can''t learn mid-routine; responsiveness to
  reasons marks the line between rigid and flexible agency.

  5. Jonas: much of our "response to being told" is itself a rigid routine — people
  nod, apologise, vow to change and repeat the mistake; therapy exists precisely because
  insight doesn''t automatically alter behaviour; reasons-responsiveness may be just
  the most elaborate sphex routine in our repertoire.


