reasoning_summary: 'Let me pick a domain and type. Good combos: "The statue and the
  clay" + type 1 (fairness audit of a summary) — the summary could conflate constitution
  with identity, present the "two things in one place" objection as a refutation,
  misuse "coincide" in its everyday sense, etc. That works well and needs no search.


  Alternatively higher-order theories of consciousness + exam question. But type 1
  is easier to make "in the weeds" without niche memorization. Let me do the statue
  and the clay with a fairness audit.


  Write a plausible summary: a podcast host or popular philosophy book summarizing
  the statue/clay debate. Subtle misrepresentations:

  - Conflating "the statue and the clay are numerically distinct" with "there are
  two statues-shaped objects in one place" as if the defender accepts two things in
  the exact same place, whereas defenders bite the bullet but deny it''s absurd by
  appeal to sortals/mereology.

  - Treating "the statue exists but the clay could survive squashing" as the whole
  argument without noting the modal premise''s role.

  - Saying "the clay existed before the statue, so they can''t be identical" as if
  Leibniz''s Law straightforwardly gives distinctness — actually that IS the standard
  argument; fine.

  - A common conflation: "constitution is identity" vs "constitution is not identity"
  — a common error: presenting the constitution view as saying the statue is a "part"
  of the clay, or that defenders deny Leibniz''s Law.

  - Technical term in everyday sense: "coincide" used as everyday synonym for "overlap"
  or "are the same"; or "supervenience"; or misusing "modal" as "modern".

  - Presenting a standard objection (too many things, the grounding problem / no unification
  of coincidence) as a refutation.

  - Overstatement: presenting the constitution-distinctness thesis as the consensus
  view among metaphysicians.


  Structure: asker heard a summary from a friend/podcast, gives the summary, asks
  sentence-by-sentence audit: what would an adherent accept, wince at, what''s wrong;
  does the conclusion (e.g., "so the constitution view is dead / so common sense refutes
  metaphysics") follow.


  Epistemic request: invite pushback if task rests on confused premise.


  Write in British English. Attribute to unnamed podcast or book chapter.


  Draft:


  "My book club read a popular metaphysics book whose chapter on material constitution
  told us roughly this: ''Lump and statue are the standard example. A sculptor takes
  a lump of clay and shapes it into a statue. Since the lump can survive being squashed
  flat while the statue cannot, they are not identical — Leibniz''s Law proves there
  are two objects occupying exactly the same place at the same time. Most metaphysicians
  accept this result, so the doctrine is that the statue is constituted by the clay
  rather than identical with it, which is really just the old idea that the whole
  is more than the sum of its parts. Critics point out that if there are two objects
  there, one has a part the other lacks, and nothing can tell us which is which; that
  objection is generally regarded as fatal, so the constitution view has been abandoned.''
  I''m inclined to think something is off... Go through it sentence by sentence: what
  would a defender of the constitution view accept, what would they wince at, and
  what is simply wrong — and does the final conclusion follow from the parts that
  survive correction? Also, tell me plainly if my framing assumes something contestable
