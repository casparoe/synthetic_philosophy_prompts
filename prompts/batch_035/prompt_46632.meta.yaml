  language dependence, the child''s guess vs. a more precise theory, etc.). It''s
  meaningful for a model without web access, doesn''t need quotes. Known facts: Popper''s
  qualitative/quantitative measures, Miller-Tichý result that Popper''s definition
  collapses orderings, language dependence (Miller''s theorem). These are moderately
  known but the prompt can inject niche framing ideas.


  Alternatively domain: "Scalable oversight and debate" with procedure type. Also
  good.


  Verisimilitude + desiderata seems a strong fit. The prompt: ask for the desiderata
  an account of truthlikeness must meet — cases it must get right (e.g., a theory
  that makes one small false prediction vs one wildly off; the "child who says 8/8=9"
  vs a mathematician making a tiny error — the arithmetic example attributed to Miller/Tichý
  discussion: a child who says every number is equal to every other is closer to...
  actually the famous example: "2+2=5" — the child who answers that 8 divided by 4
  is 5 vs. a mathematician... The known example: a person who believes Newton''s theory
  is strictly false but closer to truth than a theory that says planets move in straight
  lines. Also the example: of two false theories both entailing a contradiction...
  The "weather" example: "it rains on and off in Oxford..." attributed to Tichý/Oddie:
  "It rains in Oxford and it rains in London" vs "It rains in Oxford and it doesn''t
  rain in London" — truth is it rains in both; which statement is closer?


  Desiderata to include: distinguish from probability (a theory with high probability
  can be less truthlike — e.g., a tautology has probability 1 but zero content); closeness
  should reward content; a true theory is more truthlike than any false one; adding
  a true consequence increases truthlikeness; adding a false one decreases it (Popper''s
  original desiderata); language-invariance (Miller''s result shows orderings depend
  on vocabulary choice — a genuine candidate for joint unsatisfiability); the "both
  false but comparable" requirement; avoiding that all false theories are equally
  distant (triviality results); ordinal vs cardinal structure; the "target" problem
  — truthlikeness relative to which truth? the whole truth about everything vs. a
  topic-restricted question.


  Inject niche framing: e.g., asking whether the desiderata should be relative to
