  very same task. On their theory''s own measure of integration, the two circuits
  should receive very different values despite being functionally indistinguishable
  from the outside. They further propose to apply a clinical index of consciousness
  — computed by compressing the brain''s electrical response to a pulse of magnetic
  stimulation — to patients in ambiguous borderline states, arguing the index vindicates
  the theory''s measure in the one system where consciousness is at stake.


