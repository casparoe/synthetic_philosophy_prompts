  Best combination: vagueness and sorites + decision tree/taxonomy. The logical space:
  higher-order vagueness, whether vague predicates have sharp boundaries, whether
  they express a single language or precisifications, whether semantic values are
  degrees, whether the sorites argument is valid with borderline premises rejected,
  nihilism (no vague predicates are true of anything), contextualism, or "there is
  no fact of the matter" — incoherentism.


  Decision tree built from assumptions someone can answer without knowing labels:

  1. Is each step of the sorites premise "one grain can''t make the difference" true
  as stated? (accept/reject)

  2. Could there be a sharp cutoff number n grains where n-1 is not a heap and n is,
  even unknowable? (yes/no)

  3. When we say "there is no fact of the matter," does that statement itself admit
  borderline cases (higher-order vagueness)?

  4. Is a vague predicate''s content many precise ones or one imprecise one?

  5. Do we need degrees of truth (fuzzy logic), or just reject excluded middle / bivalence?


  Leaves: epistemicism (sharp cutoff, unknowable), supervaluationism (many precisifications,
  no sharp cutoff in ordinary language, penumbral connections), degree theory/fuzzy
  (many-valued), nihilism (Unger/Williamson''s early? actually Unger''s "There are
  no ordinary things"), contextualism (Kamp/Raffman — a new " Heap!" ... standard
  at each step), incoherentism/varies by region: Raffman''s ranges theory (comparatives
  preserved, categoricals swap), Burns'' "incoherentist". Also: reject the induction
  premise''s universal quantification (continuum fallacy answer: some single step
  does make a difference even if we can''t know which — that''s basically epistemicism-lite
  or the "logical" rejection via modus ponens/modus tollens disjunction).


