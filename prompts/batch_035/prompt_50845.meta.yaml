reasoning_summary: 'I need to pick a domain and a type. Let me pick the Hart–Devlin
  debate on legal moralism with the "verdicts on cases" type — asker gives their verdicts
  on cases about enforcing morality and asks what principle captures them. That''s
  very natural: Wolfenden report, homosexuality, prostitution, drugs, blasphemy, cruelty
  to animals, incest between consenting adult siblings, etc. This fits the "in the
  weeds" requirement: concrete cases rather than reciting the standard debate.


  Write casually, 1-3 paragraphs, typos, ask for British English.


  Let me construct the case set with verdicts including one hard-to-reconcile pair:


  - Law against consensual homosexual sex in private: wrong (shouldn''t be criminalized).

  - Prostitution: soliciting laws okay? Verdict: criminalizing soliciting fine, but
  criminalizing the private arrangement not fine.

  - Drug use: thinks criminalizing heroin possession is fine even though it''s self-regarding-ish.

  - Bigamy/polygamy: thinks criminalizing bigamy fine.

  - Incest between consenting adult siblings using contraception: thinks criminalizing
  fine — but this is structurally identical to homosexuality case, hard to reconcile.

  - Bestiality (Devlin''s example — cruelty to animals or degeneration? Actually Devlin''s
  own example: the man who has intercourse with a chicken — is it the chicken''s or
  society''s harm?). Verdict on chicken case.

  - Blasphemy laws: not fine, or maybe fine historically?

  - Selling alcohol to a willing adult at 3am ("in a civilized society men and women
  must be able to indulge their vices" — don''t quote from memory; paraphrase).

  - Public drunkenness fine to criminalize, private not.

  - Simulated or real question of same-sex marriage; maybe avoid contemporary politics.


  The tension: asker rejects enforcement of mere morality for homosexuality and blasphemy,
  but endorses it for consensual adult incest and drugs — Mill''s harm principle can''t
  easily deliver the incest verdict (paternalism? offense?). Their tentative principle:
  "the law may criminalize only conduct that harms or risks harm to others" — but
  then incest and heroin verdicts must go, or add an "offense to public" clause which
  re-opens the door to homosexuality being criminalized in a disgusted society (Devlin''s
  point). That''s the crux: the asker''s disgust-driven verdicts are exactly Devlin''s
  "intolerance, indignation and disgust" standard. Good philosophical content in the
  weeds.


  Also include a tentative principle and ask to test it, ask what principle captures
  them, what it says about further cases (e.g., cannibalism with consent of the dead
  via will? selling oneself into slavery contract? public sex in a secluded spot?
  possessing virtual child porn — no real victim), and which verdicts to drop.


  Keep it casual with a typo or two, request British English. No quotes from real
  texts — paraphrase Devlin''s disgust standard without quotation marks. Fine.


  Also, should the prompt lean on specific real facts? Wolfenden Report 1957, Hart''s
