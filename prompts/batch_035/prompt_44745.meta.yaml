  I''m a TA for an upper-level undergrad seminar on decision theory and rationality,
  and I''m grading take-home midterm essays. The question was: "Coherence arguments
  -- Dutch book arguments and money pump arguments -- are supposed to show that rational
  agents have probabilistically consistent degrees of belief and consistent preferences.
  Explain the Dutch book argument, explain what it does and does not establish, and
  then assess whether these kinds of arguments, together or separately, show that
  a fully rational agent must be an expected utility maximizer. Be explicit about
  any substantive assumptions the arguments need beyond mere consistency."


  One student wrote the following answer, and I''m going back and forth on how to
  grade it:


  "The Dutch book argument starts from the idea that degrees of belief can be measured
  by betting dispositions: your credence in A is the price at which you''d buy or
  sell a bet that pays $1 if A. Suppose your credences violate the probability axioms
  -- say P(A) + P(not-A) adds to more than 1. Then a bookie can sell you bets on A
  and on not-A at those prices, and whatever happens you''ve paid more than $1 for
  a bet that pays exactly $1, so you lose money in every state of the world. The same
  works in general: any violation of the axioms (nonnegativity, additivity over exclusive
  alternatives) leaves you open to a sure-loss book. Notice what the theorem actually
  says: it says you''re exploitable, not that you''ll be exploited -- it only guarantees
  a loss if the bookie knows your prices, and real bookies mostly can''t see inside
  your head. It''s also a pragmatic argument, not an epistemic one: the incoherent
  bettor loses money, but isn''t shown to have false beliefs.


  Coherence arguments for preferences work the same way. Take someone with cyclic
  preferences A > B > C > A. A trader offers them C for A plus a small fee, then B
  for C plus a fee, then A for B plus a fee, and they end up back where they started
  minus three fees. So intransitive preferences are exploitable, and in the long run
  agents with them get driven to bankruptcy -- a competitive market will weed them
  out, so in the long run surviving agents have transitive preferences and the argument
  gets an evolutionary vindication too.


  Putting the pieces together: coherent credences plus coherent preferences give you
  the expected utility theorem. The independence axiom is just coherence applied to
  preferences: if you prefer A to B, you must prefer a chance of A to the same chance
  of B, otherwise you''re exploitable -- Allais-type preferences violate independence,
  and sure enough they can be pumped the same way cyclic preferences can. Completeness
  is likewise forced, since an agent who can''t compare two options can be talked
  into accepting whatever price they''re offered. So the coherence arguments jointly
  prove that a rational agent maximizes expected utility: probabilistically coherent
  credences, transitive and complete preferences, independence. The only assumptions
  made are consistency requirements, so no substantive assumption about rationality
  sneaks in beyond consistency itself."


  Grade this out of 100 with point-by-point comments on each paragraph, so I can justify
  the number if the student disputes it. I''m torn between thinking it''s a solid
  answer with sloppy bits and thinking the last paragraph is doing something much
  worse than sloppy.


