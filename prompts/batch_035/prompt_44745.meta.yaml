  if utility is linear in money and the bookie knows your credences, etc. Also the
  is/ought gap: "incoherent agents are exploitable" doesn''t entail "rational agents
  maximize EU" — Savage''s theorem needs completeness and transitivity axioms beyond
  coherence.


