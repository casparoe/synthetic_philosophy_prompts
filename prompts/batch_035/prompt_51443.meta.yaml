reasoning_summary: 'Let me pick a domain and type. Options: inner alignment/goal misgeneralization,
  cause prioritization (ITN), LOT, everyday conventions moral obligations, Nāgārjuna
  tetralemma.


  Good combos:

  - "How to teach" + Nāgārjuna''s tetralemma: nice, in-the-weeds, conceptual dependency
  structure rich.

  - "Verdicts on cases" + everyday conventions: tipping, queueing, jaywalking — great
  for reflective equilibrium with cases.

  - "Explain" + inner alignment vs. misgeneralization.


  I think the verdicts-on-cases + everyday conventions is a natural fit and allows
  injecting niche ideas (e.g., conventions that vary within a country, conventions
  that locals themselves disagree about, tipping creep, standing in queue at a pharmacy
  vs. bar, jaywalking in a country where it''s technically illegal but universally
  done). The hard-to-reconcile pair: e.g., thinking tipping in the US is obligatory
  for visitors but thinking locals who campaign against tipping aren''t doing anything
  wrong; or thinking it''s fine to ignore a local convention you think is morally
  bad (e.g., bribery-adjacent), but also thinking "when in Rome" applies to queueing.


  Alternatively teach-type + LOT (Fodor) — dependency structure: mentalese, productivity/systematicity,
  image vs. proposition. Could be good but common.


  I''ll do verdicts-on-cases + everyday conventions. Write casually, a typo or two,
  keep relatively short. Cases: tipping in US for a visiting European friend; queueing
  at a bus stop vs. in a bar; jaywalking in Germany vs. Manhattan; standing on the
  right on DC escalators vs. left in... actually stand-right is common; in some countries
  escalator etiquette varies. Include a pair hard to reconcile: (a) think visitors
  must follow local tipping even though they think tipping culture is itself unjust;
  (b) think a local who refuses to tip as protest isn''t doing wrong; or (c) think
  conventions only bind where they coordinate but still think one must follow the
  (pointless) convention of greeting shopkeepers in France. Also the jaywalking case:
  in Germany crossing on red is deeply morally loaded for locals, while in NYC nobody
  cares — but asker''s verdict: in Germany it''s wrong, in NYC it''s not, even though
  law is same-ish. And a case where asker thinks you can ignore convention when local
  elites disagree — e.g., "queueing at a bar is not a thing" case. Hard pair: believes
  "when in Rome" for tipping in the US but not for bribing a border guard (bribery
  isn''t a convention? or is it?), or "mustn''t wear shoes inside" vs. thinks small-town
  convention of greeting strangers needn''t be followed... Actually greeting strangers
  IS just politeness.


  Let me structure:


  - My friend visiting from Germany refuses to tip in the US on principle — I think
  that''s wrong of him, even though I agree tipping culture is bad.

  - Yet I tip less than the local norm now that the "tip creep" screens ask 25-30%
  and I feel fine about it.

  - Jaywalking: crossing against the light in NYC at 3am, no cars: totally fine. Same
  thing in a German town: I feel it''s wrong, and I''d tell my kid not to.

  - Standing on the right on escalators: I think visitors should do it, but I don''t
  think anyone wrongs anyone when a tourist blocks the left — just annoying.

  - Queueing: cutting in line is wrong; but at a bar where there is no formal line,
  the "I saw who came first" system — I think someone who feigns ignorance of the
  local order is doing something wrong.

  - Bribing a border guard where "everyone does it": not okay, that''s not covered.

  - Greeting shopkeepers in France ("bonjour"): feel it''s required in small shops
  but in Paris department store, not.


  Ask: is there a principle capturing these — something like conventions become obligations
  where they''re load-bearing for coordination and the community treats them as morally
  thick? And what it says about the case I keep flip-flopping on: wearing a headscarf
  as a visitor in a country where it''s legally required vs. where it''s conventionally
  expected but not required? Hmm, that''s heavier — could be good "case I keep going
  back and forth on." Or: a local custom of gender-segregated seating on buses that
  you think is unjust — must you follow it as a visitor?


  The hard-to-reconcile pair: visitor must tip though tipping is unjust / local protester
  refusing to tip isn''t wrong — actually that''s reconcilable (asymmetry visitor
  vs. local?). Good, include that as the flip-flop case maybe.


  Keep it short-ish. Casual, one or two typos.


  Draft:


  "I''ve been arguing with my partner about whether everyday conventions are actually
  moral obligations, and I want to know if my gut reactions add up to a principle.
  My verdicts, for what they''re worth: my German friend visiting the US should tip
  even though he thinks (and I half agree) that tipping culture is bad and he''s not
  the one who made it that way. When I cross against a red light at 3am with no car
  in sight in NYC, that''s fine, but the same move in a small German town feels wrong
  to me, and I''d tell my kid not to. Someone who cuts a queue is doing something
  wrong. A tourist blocking the left side of the escalator is annoying but not doing
  wrong. Where I live you take your shoes off in people''s homes, and a guest who
  won''t is rude in a way that feels borderline morally wrong, but I can''t say the
  same for a visitor to France who doesn''t say bonjour to the shopkeeper — that just
  feels like a foreigner being a foreigner. And bribing the border guard in a country
  where that''s just how it''s done — clearly not excused by ''when in Rome''. The
  case I keep flip-flopping on: a local waiter who refuses tips as a protest against
  tipping culture, and quietly tells customers not to — I think that''s fine, maybe
  even admirable, but I can''t square it with thinking my German friend must tip.
  Is there one principle that gets all this, and if not, which verdicts should go?
  I have a feeling it''s something about who the convention is load-bearing for, but
  I can''t make it precise. Also curious what it''d say about a visitor who won''t
  follow a seating custom on buses they think is unjust."


  Length is fine. Maybe trim. Typos: add one, e.g., "litterally" no — maybe "for what
  their worth" or drop a comma. I''ll include "thier" somewhere: "my partner and I"
  — put "thier" in "who the convention is load-bearing for" no. Maybe: "for what its
  worth". Keep one typo subtle: "refuses tips as a protest agianst tipping culture".
  Good.


  No real quotes, no citations needed. No search needed. Write casually.'
