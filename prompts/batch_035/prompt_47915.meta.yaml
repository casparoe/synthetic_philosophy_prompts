  ---


  Please compare two deference principles from formal epistemology. Lewis''s Principal
  Principle says that a rational agent''s credence in a proposition A, conditional
  on the proposition that the objective chance of A equals x (and on any admissible
  evidence), should itself equal x. Van Fraassen''s Reflection principle says that
  a rational agent''s current credence in A, conditional on the proposition that her
  own future credence in A will equal y, should also equal y.


  Now consider the following reductionist suggestion (which I have not found argued
  anywhere in quite this form, and want assessed on its merits): if one assumes that
  one''s future self is perfectly rational and conditionalizes only on admissible
  evidence, then Reflection is derivable from the Principal Principle, since the future
  self''s credence will itself track the same objective chances that the present self
  is required to defer to. In other words, Reflection would be nothing over and above
  the Principal Principle plus a diachronic consistency assumption.


  Please evaluate this derivation. Specifically address:


  1. Whether the admissibility restriction does any work that breaks the derivation:
  e.g., cases where the future self has learned something inadmissible relative to
  the chance hypothesis (the result of the lottery draw itself, or observations of
  frequencies that chance supervenes on).

  2. A second-order case: suppose a die''s bias is fixed tomorrow by a mechanism that
  is itself chancy, so that today the chance of the chance of sixes being 1/6 is itself
  only, say, 0.5. Show how the two principles recommend credences here, and whether
  they can come apart.

  3. Whether the derivation can be reversed — whether someone antecedently committed
  to Reflection could argue that deference to chance is just deference to the verdicts
  of a hypothetical ideally informed future self, so the Principal Principle is the
  derived one.


  Do not cite literature; reason from the principles as stated. End with a machine-readable
  verdict on a final line: \answer{reducible} if you judge one principle derivable
  from the other (state which in the sentence before), \answer{independent} if each
  can conflict with the other in some coherent scenario, or \answer{equivalent} if
  they constrain credence identically given the assumptions above.


