reasoning_summary: 'Let me pick a domain and type. Type 3 ("is this fair" summary
  audit) fits well with evolutionary debunking arguments or orthogonality thesis.
  Let me write a summary with subtle misrepresentations.


  Option: Norms of assertion — someone summarizes the knowledge norm. Or evolutionary
  debunking — Street''s Darwinian Dilemma. A pop-science summary: "evolution selected
  our moral beliefs for survival, not truth, so evolution debunked morality entirely
  and even mathematical beliefs..." Subtle errors: conflating genetic (causal) debunking
  with reflective undermining; conflating content-independent selection with the real
  point; overstatement that Street herself says all moral claims are false (she''s
  an antirealist but the argument doesn''t prove that by itself); the "third-factor"
  response misrepresented.


  Or orthogonality thesis: a podcast summary saying "Bostrom proved any level of intelligence
  can have any goal, so superintelligence will pursue paperclips, and instrumental
  convergence means smarter AI becomes evil." Subtle errors: orthogonality thesis
  is a conceptual claim, not proven empirical; "any goal" ignoring stochasticity/finality
  of goals; conflating orthogonality with instrumental convergence; "evil" anthropomorphizing.


  Type 3 works well. Let me write it formally, attributed to an unnamed podcast/article.
  Include subtle misrepresentations:

  - Orthogonality thesis stated as empirical finding about all possible minds vs conceptual
  claim about possibility.

  - Conflation: "therefore we can''t infer goals from intelligence" fine, but then
  claiming instrumental convergence means the orthogonality thesis fails / or claiming
  orthogonality implies AIs won''t converge. Actually the classic subtle error: claiming
  instrumental convergence as a consequence of orthogonality, when it''s a distinct
  thesis that actually cuts against naive orthogonality (any goal converges on same
  instrumental means — so behavior may not reveal goals).

  - Overstatement: "any intelligence can be paired with any goal" — Bostrom''s thesis
  allows some coupling qualifications.

  - Presenting a standard objection (e.g., the goal might constrain intelligence —
  a very smart agent might realize its goal is arbitrary) as a refutation.

  - Using "superintelligence" to mean sci-fi conscious evil AI.


  Also could mention: the claim that instrumental convergence is "guaranteed" — Bostrom
  says convergent instrumental values are convergent because they appear across a
  wide range, not universal.


  Write the prompt: friend''s summary or a "documentary / podcast by a tech journalist".
  Ask for sentence-by-sentence fairness audit, what an AI-safety researcher would
  accept, wince at, reject; and whether the final practical conclusion follows.


  Keep relatively short and formal. No verbatim quotes from real texts — the summary
  is invented, attributed to unnamed podcast. Good, no search needed.'
