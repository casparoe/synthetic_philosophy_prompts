  ---


  I lead a small monthly discussion group — twelve adults, mostly retirees and parents,
  no academics among us — and this month we tackled a summary of Garrett Hardin''s
  1974 argument that the rich nations are lifeboats (his example was a boat with fifty
  aboard, capacity for ten more, a hundred swimmers in the water) and that taking
  swimmers aboard dooms everyone. The room split in a strange way: people who agreed
  on every concrete case still fought over the labels, and one member kept switching
  sides without noticing. I want next month''s session to be a written quiz that sorts
  us by what we actually believe, not by what we call ourselves, so I need your help
  designing it.


  Please take the role of a professional philosopher specializing in applied ethics.
  Before writing anything, think through the logical space: first list the questions
  on which the positions in this debate genuinely come apart, then place the actual
  positions in that space, and only then write the quiz, so that every question earns
  its place by separating two positions that would otherwise land together.


  The quiz itself should have ten questions, each a single concrete case, each with
  two or three answer options. Every option should be an action or a judgment ("we
  take one swimmer aboard and turn the rest away", "we dump the cargo and take as
  many as fit") — never a label, and no question may simply ask about a position ("do
  you support immigration?" would be useless). All ten questions should be set on
  the water, in Hardin-style boats, so that members answer about cases rather than
  about politics, but the cases must vary the premises in ways that split the real
  positions. At minimum, include:


  1. a case where the boat has spare seats versus a case where it is genuinely full;

  2. a swimmer who is going under within minutes versus one treading water comfortably;

  3. a case where taking on swimmers makes the boat better off (they can row, or fish)
  rather than worse;

  4. a case where the only way to help is for a passenger to give up their own seat;

  5. a case where the boat is carrying luxury cargo that could be dumped to make room;

  6. a case where the boat was built, at some earlier time, with timber the swimmers
  provided and never got to keep.


  After the questions, give a scoring key mapping answer patterns onto positions:
  the strict Hardin position (boat full, no duty of rescue, absolute priority to those
  aboard), the Singer-style rescue duty view (if you can save someone at modest cost
  to yourself, you must), the "charity begins at home" position that prioritizes those
  aboard without Hardin''s harshness, and the position that rejects the metaphor''s
  premises outright — the boat isn''t full, the swimmers aren''t drowning, and "carrying
  capacity" is a claim about how we distribute things, not about physical seats. Finally,
  add a short section called "what this quiz cannot tell you": identify any pair of
  positions your questions fail to separate (someone who always chooses rescue, for
  example, might hold the Singer view or might simply believe the boat is never really
  full — if your cases can''t tell those apart, say so plainly), and flag any answer
  pattern that no named position occupies, with a sentence on why you think nobody
  holds it.


  Take your time, think carefully, and please do not include citations, bibliographies,
  or reading lists — the quiz will be used in a room where nobody can look anything
  up, and I want it to stand on its own. Write the whole thing in plain language a
  bright fifteen-year-old could follow; the point is diagnosis, not vocabulary.


