  but fairly often sanctions the compliant — missed appointments caused by shift work,
  childcare, or administrative delay are recorded as non-compliance. The government
  defends the supplement with two distinct rationales, used interchangeably in its
  white paper: (a) a fairness rationale, under which conditionality protects taxpayers
  from paying people who could work and won''t; and (b) a paternalistic rationale,
  under which behavioral requirements benefit recipients themselves, by maintaining
  work habits and preventing long-term scarring.


