reasoning_summary: "The domain: pick one of five. Perspective: novelist. Type: one\
  \ of three. Let me pick a combination.\n\nIdea: Type \"Report one's verdicts on\
  \ a set of cases and ask what principle captures them\" combined with \"Why do promises\
  \ bind?\" — but from a novelist's perspective, with cases from fiction/plots about\
  \ promises. That's nice: a novelist gives verdicts on cases in plots where characters\
  \ break promises — a character promising to attend a deathbed and arriving late;\
  \ a promise extracted under duress; a promise to a dead person; a promise made to\
  \ oneself; promises in fiction that no one could have known the content of when\
  \ made (\"promise me you'll take care of your sister\" when the sister turns out\
  \ to be a murderer). The novelist asks what principle captures when broken promises\
  \ are forgivable — relevant to plotting, because a novelist manipulates reader sympathy\
  \ by promise-breaking. That's a great fit: novelist perspective, verdicts on cases,\
  \ ask for principle.\n\nCases: I need concrete verdicts, mostly sensible, one hard\
  \ pair. E.g.:\n\n- Character promises dying wife never to remarry; keeps it fifty\
  \ years: readers feel he should have broken it, yet admire... hmm.\n- Promise to\
  \ a dying man to \"look after\" his business, which turns out to be criminal — duress/changed\
  \ circumstances.\n- Promise made under coercion.\n- Promise to a child.\n- Promise\
  \ that becomes impossible.\n- Promise to a dead person — can promises to the dead\
  \ bind? Novelist verdicts: feels binding.\n- Promise to oneself — readers don't\
  \ treat broken new year's resolutions as betrayals.\n- A promise whose performance\
  \ harms the promisee (\"promise me you won't sell the house\" — keeping it impoverishes\
  \ the family).\n\nHard pair: promises to the dead feel binding (readers condemn\
  \ breaking them) but promises to oneself don't — same \"promisee will never know\
  \ / no one to be let down\" structure. Or: breaking a promise when the promisee\
  \ has released you... \n\nNovelist angle: the verdicts are about reader sympathy\
  \ — \"my readers forgive this, not that.\" The question: what principle determines\
  \ when a broken promise costs a character the reader's sympathy — is it tracking\
  \ the philosophical ground of promissory obligation (expectation, reliance, practice-convention,\
  \ autonomy) or something narratively distinct?\n\nThat's good. Keep relatively short\
  \ but the type requires the cases, so a decent paragraph list. Formal/polished.\
  \ From novelist's perspective: \"I write novels and...\"\n\nLet me draft cases:\n\
  \n1. A character promises her dying sister she will never sell the family orchard;\
  \ thirty years later she's ruined and selling it would save her. Readers forgive\
  \ her when she sells. (Changed circumstances / necessity.)\n2. A man promises at\
  \ gunpoint to testify... — coerced promise, no reader holds it binding. Easy.\n\
  3. Promise to a dead spouse: \"I promised him I'd never open his letters after his\
  \ death\" — readers condemn her breaking it even though he's dead and can't be harmed\
  \ or know. \n4. Promise to oneself: a character solemnly vows never to drink again;\
  \ breaks it; readers treat it as weakness, not betrayal — no one considers him a\
  \ promise-breaker.\n3 and 4 form the hard pair: both have no living promisee who\
  \ can be disappointed; yet verdicts differ. \n5. Promise whose keeping harms promisee:\
  \ a mother makes daughter promise not to put her in a home; keeping it destroys\
  \ the daughter's life; readers feel the mother wronged the daughter by asking —\
  \ blame shifts to the promisee.\n6. A promise made lightly and forgotten (\"I'll\
  \ come to your recital\") vs. the same act after formal undertaking — readers weight\
  \ gravity of the asking.\n\nMaybe 5 cases enough. Then ask: is there a principle\
  \ that captures when breaking a promise costs reader sympathy — does it track reliance,\
  \ consent/release, the practice, or something else — and what does it predict for\
  \ a case not listed: e.g., a promise to a character who is later revealed never\
  \ to have existed / a promise extracted by fraud, or a promise to someone who turns\
  \ out to have died before the promise (impossible to know? no). Or: character promises,\
  \ promisee later says \"I release you,\" character keeps it anyway — do readers\
  \ praise or find him rigid?\n\nAlso novelist-specific twist: since novelists engineer\
  \ these scenes, is the reader's verdict tracking the moral obligation itself or\
  \ a narrative convention (keeping promises signals character virtue)? Ask: which\
  \ philosophical account of why promises bind best explains the sympathy data, and\
  \ which verdict must be overturned.\n\nDraft the prompt, formal, from novelist perspective.\
  \ Length: moderate — cases require some length but keep tight.\n\nDraft:\n\n\"I\
  \ write novels, and I've come to notice that promise-breaking is one of the sharpest\
  \ instruments I have for moving a reader's sympathy: the same act — a character\
