  \ question: does reader sympathy track the actual ground of promissory obligation,\
  \ or is it a narrative convention that can come apart from it — I can use that as\
  \ a novelist.\n\nMake sure cases are concrete. Write it now, formal/polished, novelist\
  \ voice, relatively short-ish (~300 words)."
