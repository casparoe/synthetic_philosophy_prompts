  To keep the answer from collapsing into slogans, stipulate three readings of what
  makes the attribution literally true, and assign each a probability:


  1. Instrumental reading: the intentional stance earns its keep as a predictive apparatus
  — belief-talk is indispensable in the sense that no non-intentional description
  of the model''s input-output behavior would be tractable. The attribution is true
  in the way ''the model believes p'' is a good compression.

  2. Real-pattern reading (in something like Dennett''s sense): there is a real pattern
  in the model''s dispositions that our belief-vocabulary tracks, a pattern that exists
  independently of our interest in predicting the model, the way a chess-playing program
  exhibits the strategy of fianchettoing whether or not anyone cares to describe it
  that way.

  3. Original-content reading: the model''s internal states have truth conditions
  in their own right — states that are about their objects, and can be wrong, in the
  way our own beliefs are — rather than merely inheriting content from our use of
  the words it processes.


