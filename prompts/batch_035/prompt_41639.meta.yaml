  bankrupt 15 years ago and it''s still the first thing that comes up. The law basically
  says individuals deserve to outlive their past. But at the same time we''re told
  all the time that societies have a duty to remember — never forget, statues, memorial
  days, keeping archives forever. So the internet is supposed to remember everything
  as a matter of principle for the collective, but forget things on request for the
  individual. What view of memory/identity is that split actually presupposing? Like,
  does it only make sense if you think the past belongs to the group but not to the
  person, or is it just two different ideas that happen to sit next to each other?
  And if you took the ''duty to remember'' side seriously, would the right to be forgotten
  have to go — or can both actually be consistent?"


