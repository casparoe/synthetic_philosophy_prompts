  Type: "Ask what philosophical commitments a practice presupposes" — practices in
  memory culture: e.g., truth and reconciliation commissions, memorial days, "never
  forget" in education curricula, statues removal debates. Or the archival practice
  of "right to be forgotten" (GDPR). That''s a good concrete practice: the EU''s right
  to be forgotten vs memorial days and museums. Or the practice of history education
  mandating Holocaust remembrance.


  Casual voice, non-academic person, typo or two. Short.


  Idea: "In my country schools have mandatory Holocaust memorial day where they say
  ''never forget'', but there''s also this law where after a certain number of years
  criminal records are sealed/ expunged, and people say everyone deserves a fresh
  start. What''s the underlying view — when is remembering a duty and when is forgetting
  a right? What theory makes both make sense together?"


  Or use the GDPR right to be forgotten — but a layperson might know it. Could combine:
  search engines have to delist old news articles about someone''s minor past, but
  libraries keep newspaper archives. Practice: archives preserve everything forever;
  internet platforms also preserve everything; but law says a person can ask Google
  to remove links to an old bankruptcy story. What theory of memory/identity does
  that split presuppose — that societies remember but individuals get to move on?
  Is that coherent — collective memory is built from individual records?


  That''s a nice prompt: concrete practice, apparent inconsistency, ask what it presupposes,
  which rival views ruled out, what would change if replaced.


  Write casually with a typo. No quotes from real texts. No need to search — GDPR
  right to be forgotten is common knowledge. Fine.


