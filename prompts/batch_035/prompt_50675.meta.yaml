  In discussions of deontological ethics — particularly around what I''ve seen called
  the paradox of deontology, where honoring a constraint (say, never intentionally
  killing an innocent) predictably leads to more instances of the very thing constrained
  — I keep encountering a maneuver I don''t have a name for, and I''d like to know
  whether one exists.


  The person defending the constraint is shown that, by refusing to violate it once,
  they allow several violations by others; they do not respond by accepting the worse
  outcome as a cost worth bearing, and they do not give up the constraint. Instead,
  the constraint imperceptibly changes logical character: it is no longer presented
  as a prohibition on what I may do, but as something more like an exemption from
  what may be demanded of me — the claim shifts from "I must not do this, whatever
  the cost" to "I am not required to do this, however good the results." Call the
  first a constraint and the second a prerogative. Under a further push, it flips
  back: asked whether a third party may impose the one-for-five trade on me, the defender
  reverts to the language of prohibition, as if the prerogative reading had never
  been offered. Both readings seem to be sincerely held at different moments, so it
  does not look like simple dishonesty; nor is it a motte-and-bailey, since the "weak"
  reading is not obviously weaker — it can commit the defender to accepting a worse
  world than the "strong" one forbids.


  So my question is this. Is there an established term for this oscillation, or for
  the underlying feature of the position that licenses it — the fact that a single
  deontological principle can be read either as a constraint on conduct or as a prerogative
  concerning what one can be required to sacrifice? If the literature has a name,
  tell me what it is and who uses it; if the nearest concepts are the constraint/prerogative
  distinction itself, the paradox of deontology, or the doctrine of doing and allowing,
  explain what exactly the oscillation adds beyond those; and if no established concept
  captures it, coin one, define it precisely, and say what would count as a clear
  case, a borderline case, and a case that the new term should not cover.


