reasoning_summary: 'Let me pick a domain and type. Good combos:


  - Predictive processing + free energy principle with "present someone''s summary,
  ask if fair" — plenty of subtle misrepresentations possible (conflating predictive
  processing with Friston''s FEP, "the brain minimizes prediction error" vs free energy,
  treating free energy as literal thermodynamic, "the brain is always right", dark
  room problem mis-stated, claiming Helmholtz invented predictive coding, conflating
  Jayes predictive processing as a theory of everything, claiming perception and action
  both minimize the same quantity...).


  Or Nomic + self-reference paradoxes. Or Gödel''s rotating universes (niche). Predictive
  processing seems best — well-known enough that small LLMs will have memorized the
  basics, and rich enough for subtle errors.


  Type: Present someone''s summary and ask whether fair. Write summary with one or
  two subtle misrepresentations: e.g.,


  - "free energy is literally the thermodynamic quantity" — subtle error

  - conflation of predictive processing (Rao & Ballard, predictive coding) with the
  free energy principle (Friston)

  - "the brain minimizes prediction error, therefore we are always updating to match
  reality" — overstatement

  - "perception is controlled hallucination, so hallucinations are just normal perception
  with the volume turned up" — subtle

  - dark room objection presented as a refutation

  - claim that FEP says "the brain is a Bayesian inference machine and therefore consciousness
  is solved"

  - claim prediction error is always minimized — but active inference: action changes
  sensory input, so minimizing prediction error could mean acting to confirm predictions;
  also precision weighting.


  I''ll write the prompt casually, British English, one to three paragraphs, a typo
  or two, attribute to a friend or a YouTube video / pop-sci book. Seeding: "I''m
  doing a master''s in cog sci", "my friend who''s really into neuroscience".


  No verbatim quotes needed — the summary is in my friend''s words, so quotation marks
  are fine since it''s invented. The hard rule is about real texts; here I''m writing
  the summary myself, attributed to an unnamed friend. That''s fine.


  Write:


  Paragraph 1: context — friend explained it after reading a pop-sci book / watched
  a lecture.

  Paragraph 2: the summary in quotes.

  Paragraph 3: the ask — sentence by sentence audit, what a PP researcher would accept,
  wince at, what''s wrong, does the conclusion follow.


  Subtle errors to embed:

  1. "Predictive processing and the free energy principle are just two names for the
  same thing" — conflation (PP is a family of cortical theories; FEP is Friston''s
  more ambitious variational principle covering action too).

  2. "the brain''s one job is to minimise prediction error, i.e. surprise" — conflation
  of prediction error with surprise; surprise is minus log evidence, needs expectations
  over hidden states; FEP says free energy is an upper bound on surprise, not identical.
  Subtle.

  3. "free energy in Friston''s sense is basically the same free energy as in physics,
  so the theory says the brain breaks even with the second law" or "it''s thermodynamic
  free energy" — subtle wrongness (it''s a variational information-theoretic quantity,
  though there are formal links).

  4. "which is why the theory predicts you''d want to sit in a dark room" — the dark
  room problem presented as fatal / as the theory''s own prediction that its advocates
  can''t answer — actually answered via active inference and prior expectations of
  rich states; presenting standard objection as refutation.

  5. Maybe "perception and hallucination differ only in degree, so the theory says
  we can never tell" — overstatement.

  6. Conclusion: "so the theory is unfalsifiable because it can explain anything,
  and it''s really just the old idea that the brain is a hypothesis-testing machine
  dressed up in maths" — asker wants to know if that follows.


  Keep summary mostly right: hierarchy, top-down predictions, prediction errors propagated
  upward, perception as inference, action as fulfilling predictions. Include those
  correctly.


  Keep it to ~2-3 paragraphs. Casual, a typo or two ("minimise" is British spelling,
  fine; include a genuine typo like "definately" or missing word). British English:
  minimise, realise, whilst, " Uni", "telly".


  Deliver the prompt text only.'
