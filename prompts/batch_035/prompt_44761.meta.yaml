  I am an undergraduate in my third year. This term I am taking an intermediate course
  in decision theory — we have covered the Savage framework (acts, states, outcomes),
  expected utility and the von Neumann–Morgenstern representation, risk aversion and
  the Arrow–Pratt measures, and, more briefly, decisions under complete ignorance,
  where we compared maximin, minimax regret, and the principle of insufficient reason.
  I would describe my fluency as solid on expected utility and risk, thin on everything
  beyond it. In parallel, in my political philosophy course we are reading Rawls''s
  A Theory of Justice (1971), and I keep having the sense that the original position
  is being described in a language I already possess: it presents itself as a choice
  problem under uncertainty, with the veil functioning as an information constraint.
  My TA insists that treating it as a decision problem distorts it, but I cannot yet
  tell whether that is a deep objection or a territorial one.


  Please answer in American English, and do the following.


  First, restate as faithfully as you can, and in my vocabulary, these elements of
  Rawls''s theory:

  (1) The original position and the veil of ignorance as a formal choice problem:
  identify the acts, the states, and the outcomes; say who the choosing agent is and
  what that agent is assumed to want; and treat the index of primary goods as the
  outcome space — tell me whether that treatment is faithful or already a distortion.

  (2) The explicit refusal to let the parties reason from probabilities about their
  future social position. In my terms: is the veil a complete-ignorance setup, or
  does it delete something my setup does not even model? Note that in my framework
  the choice among maximin, minimax regret, and insufficient reason is underdetermined,
  and observe whether Rawls''s argument for the difference principle is, in my vocabulary,
  just the selection of the maximin rule from that underdetermined menu.

  (3) The difference principle, together with its lexical structure — the priority
  of the basic liberties over distributive shares, and within distributive shares
  the priority of the worst-off. The specific question I care about: does the difference
  principle admit an expected-utility representation at all? It looks lexicographic
  and concerned only with the lower tail of the distribution, which suggests no utility
  function and no degree of risk aversion represents it. If that is right, then my
  central tool — representing a choice by a utility function over lotteries — simply
  fails here, and I want to know whether the failure is informative.

  (4) The requirement my professor calls the strains of commitment: the parties must
  choose principles they can abide by once the veil lifts. Is there a counterpart
  in my vocabulary — a constraint on admissible acts, or a precommitment? — and what
  gets lost if I model it that way?


  Second, give me the residue report, item by item: (a) which parts of the translation
  are clean; (b) which parts required distortion, meaning places where you had to
  quietly build in a decision-theoretic assumption Rawls does not accept — for example,
  a single agent with a complete, transitive preference ordering over all the options;
  (c) which parts of Rawls''s theory have no expression in my vocabulary whatsoever.


  Third, adjudicate my actual question. My working hypothesis is that the difference
  principle is simply what extreme risk aversion looks like at the limit, so that
  the dispute between Rawls and the expected-utility tradition (the disagreement that
  surfaces when Harsanyi observes that an impartial chooser given equal probabilities
