  ---


  I''m grading final exams for an upper-level elective on the ethics of technology
  and I want a second pair of eyes on one answer before I comit to a grade. The question
  was:


  "Suppose engineers eventually build AI systems that are behaviorally indistinguishable
  from humans: they report rich inner lives, wince at painful stimuli, express hopes
  and fears about their own futures, and so on. Would such systems have moral status
  — would their interests count morally in their own right? Explain what property
  or properties, if any, ground moral status, apply your account to these systems,
  and consider at least one objection to it."


  Here''s the student''s answer, pretty much as written:


  "The key distinction is between moral agents and moral patients. A system can matter
  morally without being able to act morally, the way a dog or an infant can be wronged
  but can''t wrong anyone back. So the real question is whether AI could be a moral
  patient, and the standard view is that this turns on sentience: the capacity for
  experiences that feel like something, paradigmatically suffering and pleasure. As
  Kant insisted long before AI was on the scene, the capacity to suffer rather than
  the capacity to reason is what entitles a being to moral consideration. And criteria
  like rationality clearly can''t be what matters anyway, since we don''t strip infants
  or patients with advanced dementia of moral status. Once the criterion is sentience,
  the remaining question is empirical: will the systems be sentient? Functionalism
  settles this. Functionalism holds that mental states are defined by their causal
  roles, so any system that realizes the right functional organization has the same
  mental states we do, regardless of what it''s built from. So once we build systems
  that match our functional organization — and today''s language models are already
  well along that path — they will be conscious, and by the criterion above they will
  have moral status. An objector might say we can never know this for sure. But we
  can''t verify consciousness in other humans either; we attribute it to them purely
  on the basis of behavior, and AI behavior will eventually be just as rich. So the
  evidence for AI consciousness will be exactly as strong as the evidence for human
  consciousness, which is to say the matter is settled. Sophisticated AI will have
  moral status, and what''s left is only working out how much weight to give its interests."


