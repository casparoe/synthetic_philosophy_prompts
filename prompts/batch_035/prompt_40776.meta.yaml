  The prompt asks: write the desiderata a theory of the comparative harm of animal-source
  foods must meet. Cases it must get right: beef vs. chicken tradeoff (chicken: many
  more deaths but each shorter, arguably worse welfare per life in broiler sheds;
  beef: fewer deaths but longer lives, plus dairy-linked veal, plus pasture supports
  wild animals). Crop cultivation: mice and snakes killed in harvesting (the famous
  "field mice" argument), pesticide deaths of insects; must handle uncertainty about
  insect sentience. Distinctions it can''t collapse: killing vs. failing to bring
  into existence; harm per animal vs. aggregate; welfare during life vs. death as
  loss of future. Consistency with biology: can''t contradict facts about yields,
  lifespans, stocking densities. Joint satisfiability: e.g., a demand that the theory
  give determinate rankings now vs. demand it defer to empirical uncertainty about
  sentience — tension. Then score briefly: naive "death count" view, "suffering per
  life" view (welfarist), and a "total welfare including existence value" view (following
  someone like a totalist utilitarian).


  Flag possibly unsatisfiable pair: e.g., (i) must be sensitive to the number of animals
  affected and (ii) must not imply beef is worse because cattle grazing displaces
  wild animals whose welfare we can''t estimate — or the requirement that the theory
  be action-guiding for a consumer now vs. requirement that it wait on empirical facts
  about invertebrate cognition.


  Also ask: which single requirement does the most to exclude candidates. And a table
