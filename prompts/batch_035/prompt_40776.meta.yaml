  I''m taking an upper-level seminar called the Ethics of Eating, and for my term
  paper I want to work out what a theory of the comparative harm of animal-source
  foods would actually have to deliver. The question that got me here: almost everyone
  in my seminar agrees that a dinner of chicken is worse, per kilo, than a dinner
  of beef, but for two different reasons — one group counts lives (a kilo of chicken
  cost on the order of one bird''s entire life, while a kilo of beef is a small fraction
  of a cow''s, especially once you remember the dairy herd behind it), and another
  group counts the quality of those lives (broiler sheds versus pasture). Meanwhile,
  a friend who took environmental science keeps pointing out that crop cultivation
  kills animals too — rodents and reptiles run over in harvesting, insects poisoned
  by pesticide — so the theory also has to say something about the deaths embedded
  in the plant foods, and in the feed that goes to the animals. Rather than jump to
  a verdict, I want the spec first.


  Please write the desiderata: what any adequate theory of the comparative harm of
  foods must get right, which cases it must handle, which distinctions it can''t collapse
  (e.g., between how bad a death is for the animal and how bad its life was; between
  killing an animal and failing to bring one into existence; between per-animal and
  aggregate rankings), and which empirical findings it can''t contradict (yields per
  animal, lifespans, stocking densities, the fact that pasture is itself habitat).
  For each requirement, give the case or consideration behind it. Then do three more
  things, in order of importance to me: mark which requirements are non-negotiable
  and which are prejudices of one camp (e.g., is demanding a determinate verdict between
  beef and chicken right now a genuine desideratum, or a refusal to take empirical
  uncertainty about invertebrate sentience and about wild-animal welfare on pasture
  seriously?); flag any pair of requirements you suspect can''t be jointly satisfied,
  since if the spec is unsatisfiable that itself is the interesting result; and finally,
  in a paragraph or a small table, say how three rough candidates do against the list
  — a pure death-count view, a suffering-during-life view, and a total-welfare view
  that lets existence itself carry value. I''d most like to know which single requirement
  does the most work in eliminating candidates.


