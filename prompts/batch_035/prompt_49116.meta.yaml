  a secondary boycott in which a union picketed a neutral supermarket to put pressure
  on the distributor it really had the dispute with, illegitimate; a one-day national
  general strike called to protest a pensions bill rather than any workplace grievance,
  illegitimate; and a work-to-rule campaign in which railway dispatchers followed
  every safety regulation to the letter and slowed everything down, legitimate. She
  also, if I remember right, called a coordinated overtime ban legitimate, though
  she seemed slightly less confident.


  Maya and I have started collecting contemporary cases to test her instincts, and
  next month I''m supposed to bring one and argue it with her. The three candidates
  I''ve shortlisted: (1) couriers for a delivery app, with no union and no vote, coordinate
  through a group chat to decline all orders from a restaurant chain whose own staff
  are on strike over internal mistreatment — the couriers'' pay is untouched; (2)
  the same couriers, a month later, coordinate a simultaneous one-night "logout" over
  algorithmic pay cuts, deliberately timed to a citywide festival so the disruption
  is maximally visible; (3) a construction local votes to refuse to build a warehouse
  on the site of a community garden, even though the members'' own terms and conditions
  are entirely fine and the developer has done nothing to them.


