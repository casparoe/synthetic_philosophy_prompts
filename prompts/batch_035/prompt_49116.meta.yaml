  My friend Maya and I run a reading group on labor history, and over the years she
  has developed very firm instincts about which forms of collective action are legitimate
  and which are not. Her track record, as best I can reconstruct it: an authorized
  wage strike after a genuine bargaining impasse, legitimate; a wildcat walkout over
