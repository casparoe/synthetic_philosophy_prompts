  \ the naive switcher after all — someone who says, for instance, that conditionalizing\
  \ on the observed amount is exactly what a rational agent does, and that if the\
  \ paradox lives at the level of conditional reasoning then so be it. And tell me\
  \ how you'd use the case in a 50-minute class: what the students should compute\
  \ before the reveal, and what the honest limits of the exhibit are — what feature\
