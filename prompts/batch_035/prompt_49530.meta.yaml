reasoning_summary: "Let me pick a domain and type. Good combos:\n\n- Two-envelope\
  \ paradox + construct a thought experiment: design a variant where the two standard\
  \ arguments (switching and not-switching) are somehow both blocked, or a version\
  \ where expected utility reasoning fails. That's a nice \"in the weeds\" prompt.\n\
  - Judging historical figures + classroom activity: a role-play/deliberation where\
  \ participants judge a figure with the 'man of his time' defence, feeling the force\
  \ of the problem.\n- Lessons of history + fiction through a lens: The Remains of\
  \ the Day? Munich analogies... Actually \"The Remains of the Day\" through the lens\
  \ of Munich/appeasement analogies could be good — Stevens and Lord Darlington, \"\
  appeasement\" domestic analogies.\n- Mill's late views on socialism + classroom\
  \ activity or thought experiment.\n\nLet me pick the two-envelope paradox with a\
  \ thought experiment spec. That's a natural \"construct to specifications\" fit.\n\
  \nSpecifications idea: Build a variant of the two-envelope paradox in which the\
  \ two classic arguments for switching are separated — i.e., one case where the \"\
  you don't know which is bigger\" symmetry argument correctly shows switching doesn't\
  \ help, and a distinct case where the \"1/2 chance of doubling, 1/2 chance of halving\"\
  \ reasoning gives a correct answer — such that a naive reasoner can tell them apart\
  \ only by... hmm.\n\nBetter known split: the paradox dissolves for finite unbounded\
  \ distributions but persists for improper priors (e.g., the Broome/Beckmann variants\
  \ where every possible envelope pair is equally likely — infinite expectation).\
  \ A good spec: construct a scenario where switching really is advantageous in expectation,\
  \ but the agent has no way to know it, and the symmetry argument and the doubling/halving\
  \ argument both appear to apply — and the task is to build a case that shows which\
  \ premise fails. Or: build a version where the expected gain from switching is positive\
  \ at every observed value yet the strategy \"always switch\" yields no gain — i.e.,\
  \ a case illustrating that E[gain | switch] > 0 pointwise doesn't sum correctly,\
  \ related to non-integrability.\n\nSpecification-style prompt: \"Construct a two-envelope\
  \ case in which the conditional expected gain from switching is positive for every\
  \ amount you could find in your envelope, yet the unconditional expected gain from\
  \ committing in advance to switching is exactly zero — and where the numbers stay\
  \ finite and ordinary (household sums, no infinities in any envelope). Then explain\
  \ which theorem's condition fails...\" That's the classic trap: sum of conditional\
  \ expectations = unconditional expectation requires integrability. Actually for\
  \ a distribution over pairs (2^n, 2^{n+1}) with p_n ∝ 2^{-n}... The improper prior\
  \ case: P(pair = (2^n, 2^{n+1})) = c·2^{-n} over all integers n (including negative),\
  \ which sums to infinity. Then E[X] infinite, and conditional on X = x, switching\
  \ gains in expectation. This is the standard resolution territory (Broome 1995,\
  \ Chalmers, \"The Two-Envelope Paradox\" papers).\n\nConstraints to make it juicy:\
  \ the asker wants a realistic framing (inheritance/will with doubling/halving of\
  \ a stake), no infinities in any single envelope, and the demonstration that: (a)\
  \ at every amount x the agent might see, switching looks favorable in expectation;\
  \ (b) yet by symmetry no-switching is equally good; (c) the case must be one where\
  \ the failure is identifiable. Also: build a companion case where the switching\
  \ argument is simply fallacious (finite expectation), so the two cases differ only\
  \ in whether the total expectation is finite — asking which premise the paradox\
  \ exploits.\n\nAlso could add a decision-theory angle: connect to the \"paradox\
  \ of the envelopes\" and to the \"expectation\" reasoning failure that is structurally\
  \ similar to the exchange paradox in Bayesian statistics (the necktie paradox).\n\
  \nAlternatively classroom activity type for two-envelope paradox: design a game\
  \ where students play repeated envelope pairs drawn from a distribution, and the\
  \ frequency data makes switching look good — but it's the same distribution. Hmm,\
  \ that's tricky to design honestly. The thought-experiment type is cleaner.\n\n\
  Let me draft the prompt as a constructed-to-spec thought experiment:\n\nSpecs:\n\
  1. Scenario must be realistic-wrapped (a will/inheritance, a game show, a banker),\
  \ one paragraph, no demons.\n2. Both classical arguments must be derivable in the\
  \ case: (i) the symmetry argument that switching can't help; (ii) the step-by-step\
  \ argument \"whatever amount A I see, the other is either 2A or A/2, each with probability\
  \ 1/2, so expected gain is A/4.\"\n3. Twist: the case must be constructed so that\
  \ argument (ii) is actually valid at the level of conditional expectation — the\
  \ conditional expected gain really is positive at every value — while committing\
  \ in advance to switch yields zero expected gain. No infinite amounts in any envelope.\n\
  4. Then the deliverable: demonstrate each spec, show which mathematical condition\
  \ fails (integrability / countable additivity use), identify the feature doing the\
  \ work, say what happens when the distribution is truncated (does the paradox collapse\
  \ and why — the boundary where symmetry of the priors breaks), and how a defender\
  \ of the naive switching argument would respond (e.g., denying that the agent can\
  \ coherently conditionalize on the observed value).\n5. Also ask for the companion\
  \ control case: same surface, finite total expectation, where the naive argument\
  \ is just a probability error — so the reader sees that the two cases are indistinguishable\
  \ from the agent's chair, and ask what epistemic right the agent has to treat them\
  \ differently.\n\nThat's elaborate, in-the-weeds, but built on well-known LLM knowledge\
  \ (two-envelope paradox, St. Petersburg-flavored distributions, integrability).\
  \ No quotes needed, no real sources. Good.\n\nSeeding: \"I'm writing a term paper\
