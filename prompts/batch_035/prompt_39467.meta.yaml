  (2) Personal identity is just pattern-continuity, so the future copies of me on
  all branches are equally "me."

  (3) From the inside, I can only observe branches where I''m alive to observe.

  (4) So I will always find myself on a branch where I survive, however unlikely.

  (5) Dying of old age is also a quantum event in this sense — there''s some nonzero-amplitude
