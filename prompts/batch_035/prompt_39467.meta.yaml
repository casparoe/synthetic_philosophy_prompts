  (6) So I should expect to never die, and instead to get increasingly "lucky" — improbable
  rescues, spontaneous remissions.

  (7) Conclusion: quantum immortality; and a corollary — I should be indifferent to
  death-risk since I''ll never experience death.


  Ask: where does this go wrong? The subtle issue: the step from "some branch exists
