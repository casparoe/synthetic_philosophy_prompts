  ---


  I am a PhD candidate in computer science writing a dissertation on fairness in machine
  learning, and this year I''m on a part-time secondment to the Algorithmic Review
  Board of a mid-sized public health agency. The board has three reviewers — a lawyer,
  a policy analyst, and me — and it must sign off on every predictive model the agency
  deploys on individuals: readmission-risk scores, automated fraud flags on provider
  claims, a triage model for scheduling specialist appointments, and so on. We have
  roughly two weeks per model, and I''m the only one who can read a confusion matrix.
  I want to leave them with a procedure they can run after I go back to my dissertation.


  Please take the role of a senior expert in algorithmic fairness and public-sector
  model governance — someone who knows the technical literature cold but has also
  sat on review boards and knows how decisions actually get made. Before writing,
  spend a moment brainstorming what the procedure must accomplish and what will predictably
  go wrong; keep that brainstorming brief and internal, and deliver only the finished
  procedure.


  The intellectual core I want operationalized is the family of impossibility results
  in fair machine learning: when outcome base rates differ across groups, several
  intuitively compelling fairness requirements become mutually unsatisfiable — most
  prominently, calibration within groups cannot coexist with equal false-positive
  and false-negative rates across groups. The consequence I care about is this: "the
  model must be fair" is not a specification. Choosing which fairness criterion to
  enforce is choosing which disparity to tolerate, and that choice is a value judgment
  about who bears the cost of error, not a technical fact the statistics can settle.
  The procedure''s whole point is to drag that choice into the open and put a name
  on it, instead of letting it hide inside the choice of metric.


  Constraints under which the procedure must work:

  - Reviewers with no statistics background beyond what I can teach in an afternoon;
  every step must be runnable by them without me.

  - Two weeks per model, most of which is document-chasing, so the fairness-specific
  work gets perhaps two days.

  - Every decision must end in a public-facing one-page justification a non-technical
  administrator can read.

  - The board has adopted a rule I would like you to build around rather than mention
  as an add-on: no model may be approved on any fairness criterion without an attached
  "tolerated-disparity statement" — a short written paragraph naming the specific
  disparity the approval accepts, which group bears it, and why the board finds it
  acceptable. The procedure should generate that statement almost as a byproduct of
  its steps.


  Please structure your response as follows, with these sections in this order and
  rough lengths:


  1. Overview (~½ page): what the procedure does, what question it ultimately puts
  to the board, and what it deliberately does not attempt.

  2. The steps (~2 pages): a numbered sequence the reviewers run in order, from first
  document request to final sign-off. For each step, say what counts as a sufficient
  answer, what moves the model to the next step, where the procedure terminates in
  a rejection, and where it stops and hands a genuine value judgment to the board
  — those handoff points should be unmistakable.

  3. Worked applications (~1½ pages): run the procedure on three cases — (a) a readmission-risk
  score used to allocate scarce post-discharge nursing visits, where base rates differ
  substantially by neighborhood as a proxy for race; (b) a fraud-detection model flagging
  provider claims for manual review, where the cost of a false positive falls on providers
  and of a false negative on the public purse; (c) a triage model for specialist scheduling
  that is well calibrated within every group but has unequal false-negative rates
  for the smallest patient subgroup. At least one of the three should end in an answer
  the board will find unwelcome, and you should say so plainly rather than softening
  it.

  4. Failure modes (~½ page): where the procedure will misfire in practice, what it
  cannot settle even in principle, and what it would be dishonest for the procedure
  to pretend to decide.


  Please be honest about the points where the procedure is a judgment call dressed
  up as process — I would rather the board know where they are actually deciding than
  believe the paperwork decided for them.


