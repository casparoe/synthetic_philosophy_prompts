  own case for modal realism. The virtues of the theory — worlds as unifying entities,
  the analysis of counterfactuals and of ''there are ways things could have been''
  without primitive modality — are all supposed to come from the world''s internal
  structure and from the totality of worlds, not from whether the world is concrete.
  And the clause is a costly liability: it is what earns the theory the incredulous
  stare and, more technically, it leaves Lewis with no account of what concreteness
  even is (his own admission that he can''t improve on ''concrete'' beyond pointing
  at our world and saying worlds are like that). So my view keeps everything else
  — worlds are individuals, spatiotemporally isolated, no overlap, including our world
  among them — and simply refuses to say whether they''re concrete. My further claim
