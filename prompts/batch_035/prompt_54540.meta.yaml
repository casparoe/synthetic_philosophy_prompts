  and a sufficiently rich ersatzism is merely verbal, and that this is a virtue, since
  the discovery that two apparently rival ontologies of modality are notations for
  one theory is exactly the kind of result modal realism was supposed to deliver —
  modality reduced to quantification over things, whatever their category.


