reasoning_summary: 'Let me pick a domain and type. Weber''s Protestant ethic thesis
  + Type 1 (fair summary audit) works well. A popular summary with subtle misrepresentations:
  e.g., claims Weber proved Calvinism caused capitalism, that he said Protestants
