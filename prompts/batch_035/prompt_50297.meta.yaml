  hemorrhage met every clinical criterion for brain death — no brainstem reflexes,
  a negative apnea test, a nuclear scan showing no intracranial blood flow — but when
  the nurse touched his arm he twitched, and his heart beat without any machine. His
  family said a body that responds and is warm is alive. The committee backed the
  declaration of death, explaining to the family that the movement was spinal. (2)
  A woman in a permanent vegetative state after a cardiac arrest breathed on her own,
  cycled through sleep and wakefulness, and would never regain consciousness; her
  family argued the person was gone and asked the committee to treat her as dead.
  The committee refused — she was alive. (3) A man with locked-in syndrome from a
  brainstem stroke was fully conscious and communicated by blinking but could not
