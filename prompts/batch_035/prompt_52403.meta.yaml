  ---


  For roughly a decade I have been reading the literature on higher-order evidence
  and epistemic akrasia, and the central dispute has settled into a stalemate that
  its participants seldom acknowledge. Let me set out the terrain as I see it, and
  then ask you to diagnose the disagreement itself rather than adjudicate it.


  Start with the akratic combination: a subject believes p while also believing that
  her total evidence does not adequately support p — or, more pointedly, while believing
  that she should give up believing p. Nearly everyone in the literature condemns
  this combination as irrational; the disagreement is about why, and it fans out into
  at least three sub-disputes. First, there is a dispute about the metaphysics, as
  it were, of higher-order evidence: does it behave like ordinary first-order evidence,
  simply adding weight to one side or the other, or does it operate in a structurally
  distinct way — undercutting, screening off, or reversing the support one''s first-order
  evidence provides? The friends of the slogan that evidence of evidence is evidence
  line up on one side; those who think higher-order evidence is special, because it
  is about the reliability of the very processes that generate the first-order support,
  line up on the other. Second, there is a dispute about explanation: some hold that
  the irrationality of the akratic combination is just garden-variety incoherence
  that we can describe with our existing tools of defeat, while others think it reveals
  a distinct epistemic norm — something like a prohibition on stepping on one''s own
  evidence — that needs its own story. Third, and least often stated, there is a quiet
  disagreement about possibility: some suspect the akratic combination cannot be sustained
  at all, because the higher-order belief defeats the first-order support so thoroughly
  that the subject cannot rationally hold p, in which case the problem of akrasia
  partially dissolves into the problem of defeat.


  Meanwhile the parallel debate about peer disagreement — conciliationists versus
  steadfast theorists — has reached a mirror-image stalemate: conciliationism seems
  to follow from very weak-looking impartiality principles, yet every version of the
  view faces stubborn counterexamples, from cases where one has antecedent knowledge
  of one''s own superior track record, to cases where the disagreement is about disagreement
  itself, and no one has moved in years.


  Here is my hypothesis, offered as a hypothesis. I suspect that a good part of the
  standoff is verbal, and that the operative ambiguity concerns the word evidence:
  if evidence is read broadly, as anything that bears on the truth of p, then higher-order
  evidence is ordinary evidence and the deflationary side wins by stipulation; if
  it is read narrowly, as input to a first-order inquiry, then the structural side
  wins by stipulation; and the interesting questions hide in the fact that both sides
  slide between the readings. But I also suspect that something non-verbal is doing
  real work — namely, that the two camps are answering different questions under one
  heading, one about rational requirements on combinations of attitudes and one about
  what a responsible inquirer should do with her life and her limited perspective.


