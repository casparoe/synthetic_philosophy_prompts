  So, a bit of background first. I''m a retired analytical chemist — forty years of
  spectroscopy and measurement standards — and I''ve only properly gotten into philosophy
  since retiring. Over the winter I read Kripke''s book on Wittgenstein, rules and
  private language (Wittgenstein on Rules and Private Language, 1982), and I''ve come
  out convinced by its central negative claim: there''s no fact about me, considered
  just as an individual, that fixes what I meant by a word in the past — nothing in
  my head, my dispositions, or my history that makes it the case that by "plus" I
  meant addition rather than Kripke''s quus function. As a scientist this actually
  felt familiar rather than shocking: we''re drilled in the idea that any finite body
  of data underdetermines the theory that fits it, and Kripke''s puzzle looks like
  exactly that, one level down — my whole past use is a finite data set, and quus-type
  hypotheses fit it just as well as plus.


  Anyway, that''s the position I''ve adopted: the individual-level skeptical claim
  is correct. What I''d like from you is a map of its exposure. What would count against
  it? I don''t just mean the standard dispositional reply (I''ve read that one — my
  dispositions also finite, and they don''t seem to have the normative character meaning
  has). I mean: which arguments, which possible cases, which results in neighbouring
  areas would genuinely move a committed proponent to give it up or qualify it? Which
  of these would proponents themselves concede as counting against the view, and which
  would they wave away? Rank them, if you can, from fatal through serious to merely
  awkward. And tell me honestly whether the view has been insulated into unfalsifiability
  by its defenders — and if it has, whether that''s a defect for a claim of this kind
  or just what happens when a thesis is conceptual rather than empirical. My own suspicion,
  which you''re welcome to puncture, is that the view stands or falls with something
  about normativity — that a rule''s application is a normative notion that no descriptive
  fact could capture — and I''d like to know whether that''s actually load-bearing
  or whether the view could survive without it.


  Two requests: write your answer in British English, and as you go, say how confident
  you are in each claim and single out the one point you''re least sure of.


