  Argument steps:


  (1) Epistemic structural realism holds that our knowledge of the unobservable realm
  is limited to its structure: the network of relations in which things stand, not
  the intrinsic natures of the things themselves.

  (2) What a theory says about structure can be specified without saying anything
  about the intrinsic character of the relata: it fixes the number of objects (up
  to cardinality) and the extension of the relations over them.

  (3) Here''s the combinatorial fact: given any collection of objects of sufficient
  size, and any theory T whose structural content is as described in (2), there exist
  relations over that collection having exactly the extensions T specifies.

  (4) So for any theory T and any sufficiently large domain of objects, we can define
  relations over that domain that make T structurally true.

  (5) Therefore any theory of the unobservable is structurally true of any world with
  enough things in it.

  (6) So structural knowledge of the unobservable is trivial: nothing that distinguishes
  competing theories survives at the level of structure.


  The professor''s worry: by parity, the argument applies to the observed world too
  — nothing distinguishes, at the level of structure, between our best account of
  the observed world and infinitely many alternatives. So either wholesale structural
  skepticism (including about everyday tables and starlight) or the argument fails.
  He suspects a scope/quantifier issue in moving from (3) to (4) or (5) — "there exist
  relations" vs. the relations our theory actually uses / the physically distinguished
  relations. But wants diagnosis.


  What he''d like to keep: the idea that structure is at least a great part of what
  we know; and he''d rather not concede that structural realism collapses into triviality.


  Question: which step to reject, why it looked fine, what rejecting it costs; also
