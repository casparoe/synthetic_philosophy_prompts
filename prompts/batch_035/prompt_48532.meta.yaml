reasoning_summary: 'Domain choice: virtual worlds are real? Combine with "prove too
  much" argument type. Novelist perspective, formal/polished, short.


  Let me construct an argument about virtual objects/harms being real that proves
  too much. E.g., a novelist working on a novel about VR.


  Argument idea: (1) Virtual gold in a game is real because it has real effects (people
  pay real money for it, feel real loss when robbed). (2) If having real effects suffices
  for reality, then... fictional characters are real (they cause emotions), debts
  are real... slip toward "everything causally efficacious is real" — trivial. Or
  the opposite direction: virtual harms aren''t real because no physical damage, but
  that proves too much — defamation, threats cause no physical damage.


  Better: construct a chain with subtle flaw. E.g.:


  (1) Something is real iff it can figure in true causal explanations. (2) Anna''s
  failure to log on last Tuesday is explained by her guildmates stealing her in-game
  castle / a raid betrayal — grief over a virtual betrayal. (3) Anna''s grief is real
  and its cause is the virtual betrayal. (4) So virtual betrayals are real events.
  (5) The betrayal consisted in a sequence of bit manipulations with no physical contact
  — the "event" is nothing over and above the manipulations. (6) Whatever is nothing
  over and above physical manipulations is not a distinct real event. (7) So the betrayal
  both is and isn''t real. Conclusion: maybe virtual objects aren''t real. Subtle
  flaw: identity/reduction — being nothing over and above bit manipulations doesn''t
  make it unreal (type-identity analogy with pain/brain states).


  Or a "proves too much" angle: the argument that virtual harms aren''t real because
  they''re just pixels proves that emotional harms from novels aren''t real, or that
  bank balances aren''t real (just numbers in databases — no physical money).


  Let me craft: Novelist writing a book where a character is crushed by loss of a
  virtual item. Friend''s argument:


  (1) A harm is real only if its object is something whose loss constitutes a genuine
  deprivation — you can''t really lose what was never really yours. (2) Nothing virtual
  is really yours: virtual land, virtual swords, virtual currency are patterns of
  light that a server administrator can delete at will. (3) My character''s friend
  spent two thousand hours building a virtual cathedral, and when it was razed by
  griefers she wept for a week. (4) A week of weeping over a loss is not real unless
  the loss is real. (5) Her weeping was real. (6) So the loss was real, so the cathedral
  was really hers, so virtual things can be really owned. (7) But if owning is constituted
  by ... then anyone who invests labor in anything acquires ownership... Maybe: (7)
  What made it hers, by (1)-(6), can only be her investment of time and care. (8)
  By the same reasoning, a reader who invests thousands of hours emotionally in my
  fictional characters comes to own something real in the novel — i.e., I could not
  kill off a beloved character without real wrong... Hmm interesting: this proves
  too much — it proves novelists wrong their readers by killing characters. That''s
  nicely novelist-perspective!


  Chain: (1) to lose something, it must be yours. (2) Virtual cathedral builder loses
  something real (her grief and the setback are real — she lost her work). (3) Ownership
  of virtual items is constituted not by law but by invested labor (toil). (4) Readers
  invest enormous emotional labor in characters. (5) So readers own the characters
  in some real sense; killing off a character against reader expectations wrongs them;
  novelist''s freedom is limited. Conclusion the novelist can''t accept: she owns
  her characters, readers don''t.


  Subtle flaw candidates: equivocation on "labor/investment" (creative effort vs.
  emotional consumption — direction of creation vs. reception); or the step that grief
  proves loss of the thing grieved over (grief''s reality doesn''t transmit to its
  object — one can really grieve over an unreal loss? Or: the object of grief is the
  thwarted plans/expectations, which are real states of the person, not the virtual
  item). That''s a nice subtle flaw: the reduction — what''s lost is the time/possibility/plans,
  which are real features of her life, not the cathedral itself. Similar to death
  of loved one vs. death of one''s relationship to them.


  Where does it go wrong: between "her grief is real" and "the thing grieved is really
  lost" — the phenomenological inference. Or the labor theory of ownership equivocates
  between making and using.


  Let me write numbered steps, formal, from novelist''s voice:


  Draft:


  "I am writing a novel whose protagonist loses, to digital vandals, a cathedral she
  spent two years building in a shared virtual world, and I find myself unable to
  dismiss an argument my son pressed on me over dinner. (1) To be wronged by the destruction
  of a thing, the thing must have been yours in some real sense; you cannot be robbed
  of what you do not own. (2) What made the cathedral hers was not law or code but
  her two thousand hours of labor; where there is no contract, investment alone constitutes
  ownership. (3) She was wronged when it was razed — her grief, her lost plans, and
  the setback to her life''s projects were real. (4) So virtual things built with
  labor are owned in a sense robust enough to be destroyed by wrong. (5) My readers
  labor over my characters for years, investing more hours than any cathedral requires.
  (6) By the same reasoning, the characters belong to them, and I would wrong thousands
  of strangers if my final chapter did not treat them accordingly. (7) That I cannot
  accept: the characters are mine; the novel is finished. Yet I confess each step
  still looks defensible to me. Which step should I give up, and what does giving
  it up cost — for my protagonist, and for my readers?"


  The subtle flaw: equivocation on "labor" — creating vs. engaging. And (2) is the
  shaky premise (investment constitutes ownership) combined with shift from ownership-by-labor
  to claim over the object''s future. Also (3) "wronged" — she was harmed, but was
  she wronged? Harm/wrong equivocation. Actually grief being real doesn''t mean the
  thing was owned; plans being real doesn''t mean the object is owned — the object
  of the plans and the thing can come apart. Also emotional investment in fiction
  gives you attachment, not ownership — attachment creates interests but not property/authority
  over the object. Good multiple diagnosis routes.


  This is nicely in the weeds (virtual worlds + fan ownership of characters, "death
  of the author"-adjacent but not requiring that), no citations needed, meaningful
  for LLM without web access. Novelist voice, formal, moderately short.


  Check length: fine. Don''t reuse example openings. Good.


  One tweak: "she was wronged" step should perhaps read more plausibly. Also make
  the "proves too much" flavor apparent via the novelist''s inability to accept (6)/(7).


  Final polish.'
