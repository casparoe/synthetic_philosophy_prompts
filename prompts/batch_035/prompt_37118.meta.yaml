  ---


  Is there a name for the following? I have no academic training; I read a lot of
  travel writing and history for pleasure, and I keep noticing a move that defenders
  of national-character talk make, and I want to know whether the pattern itself has
  been named.


  The move: a claim is made about a people as a whole — that they are, say, proud,
  or orderly, or passionate by nature. When a member of that people behaves in accordance
  with the trait, this confirms it. So far, fair enough. But when a member behaves
  against it, the trait is not refuted; instead the behavior is read as a reaction
  against it: the famously orderly German who lives in chaos is "rebelling against
  his own orderliness"; the famously passionate people that submits quietly to a dictatorship
  is showing its passion "turned inward," and then when it rises up, the same passion
  is cited again. Whatever any individual does — comply or resist, conform or deviate
  — is interpreted as either expressing the national trait or straining against it,
  and both count as evidence for it. The claim about the people ends up explaining
  everything any person from that people does, which I take to mean it predicts nothing.


  I can describe more precisely what seems specific to it, because I don''t think
  it''s just "a claim that can''t be checked." Ordinary uncheckable claims are vague.
  This one has a particular structure: the trait belongs to the collective, and the
  individual is only ever evidence about the collective — never a counterexample to
  it — because any individual conduct can be assigned one of two roles, expression
  or reaction. It is as if the individual''s behavior is never allowed to be about
  the individual; it is always about the people.


  A second instance, from arguments rather than books: the same double direction across
  time. A people is called naturally servile under one regime and naturally ungovernable
  a generation later, and both are cited as the same national character — obedience
  is the trait submitting, revolt is the trait bursting out.


  So my questions. Does this configuration have an established name? If it does, I''d
  like to know what it is, but also how it differs from the nearest neighbors I can
  think of, which are (a) a claim being simply untestable, and (b) the practice of
  adding an after-the-fact excuse to a claim — because in this pattern no new excuse
  is added; the two interpretations (expression, reaction) seem to be available in
  advance. If it has no name, then please don''t just tell me so: commit to coining
  one, define it, and mark its edges — in particular, tell me whether the defender
  who narrows the claim instead of widening the interpretation ("orderly at work,
  not at parties") is making the same move or a different and sometimes legitimate
  one, and whether the pattern requires a collective subject, or whether a claim about
  a single person''s character ("he''s proud, so his humility is really pride") could
  qualify. I''d rather you take a position and defend it than lay the possibilities
  before me.


