  ---


  I am preparing a position statement on explanation and reduction for a philosophy
  of science seminar, and before submitting it I would like a rigorous consistency
  check. Below are the five theses I currently endorse, stated as plainly as I can.
  Please tell me which pairs are in genuine tension, which apparent tensions dissolve
  on closer inspection, how severe each real tension is, and what the cheapest revision
  would be in each case. Finally, tell me which single revision would clean up the
  most. For reference, I take Dennett''s slogan to state my starting point exactly:
  "Good reductionists suppose that all Design can be explained without skyhooks; greedy
  reductionists suppose it can all be explained without cranes."


  (1) Cranes only. Everything that looks designed — organisms, minds, languages, economies
  — must in principle be explainable by cranes: myopic, mechanical, bottom-up processes
  accumulating over time. Any explanation that helps itself to top-down intelligence,
  purposes, or unexplained marvels, at any point in the history of the universe, is
  disqualified.


  (2) Greed is a sin. Greedy reductionism — trying to skip intermediate levels and
  fasten phenomena directly to lower-level foundations, as Skinner''s behaviorism
  did in trying to get all mentality out of operant conditioning in a single stroke
  — is not merely incomplete science but bad science. Real explanations must go through
  the relevant intermediate levels (evolutionary, developmental, computational), each
  of which does indispensable work.


  (3) The intentional level is doomed. I am an eliminative materialist in the style
  of the Churchlands: folk psychology''s beliefs and desires are a defective theoretical
  posits, and mature neuroscience will not vindicate them by reduction but replace
  them, so that a future science of cognition will describe what we now call decision-making
  without quantifying over beliefs or desires at all.


  (4) Consciousness leaves a residue. However complete our crane-built neuroscience
  becomes, it will not explain why there is subjective experience at all: the hard
  problem is a genuine limitation in principle, not a temporary gap; mechanistic explanation
  of functions leaves something unexplained even when completed.


  (5) Compatibilist freedom. Free will and moral responsibility are real, but they
  are higher-level phenomena: an agent is free when her action issues from her own
  reasons and values in the right way, which is fully compatible with her being a
  deterministic, bottom-up-built physical system.


  I genuinely do not know where the fault lines are, and I have no attachment to any
  particular thesis, so please do not spare any of them. End your reply with a final
  line of the form:


  Verdict: <the single revision I should make, stated as the thesis to revise and
  how>


