  you could get nearly full marks just by retelling the standard case. I want to write
  something harder.


  Please write the exam question, a model answer, and a marking scheme to these specifications:


  The question should be answerable in about 45 minutes and worth 25 marks, and it
  should be a problem-question with an essay component, not a pure essay. Concretely,
  it must do the following:


  1. It must present its own explicit example rather than invoking the famous one.
  Set up a three-member committee (give it a concrete subject matter of your choosing
  — a hiring committee, a university tenure case, a regulatory panel deciding whether
  to approve a drug) with a clearly stated logical structure: the conclusion is a
  truth-functional compound of two premises (say, C iff P and Q, or C iff P or Q),
  and each member''s votes on premises and conclusion are laid out in a table.


  2. It must ask students to compute the collective outcomes under (a) a premise-based
  procedure, (b) a conclusion-based procedure, and (c) proposition-by-proposition
  majority voting — and to say exactly which combination of individual judgment sets
  is collectively irrational, and in what sense (inconsistency? incompleteness? both?).


  3. It must then ask the students to construct the mirror image of the standard dilemma:
  a distribution of votes in which the majority accepts the conclusion while majorities
  reject the premises (for a conjunctive structure), and to say whether this is genuinely
  symmetric with the standard case or whether something breaks the symmetry.


  4. It must ask whether the dilemma is an artifact of simple majority rule: have
  students reason about which quota thresholds (unanimity on premises, two-thirds,
  etc.) would or would not avoid the problem, given the agenda structure.


  5. Finally a short reflective part worth few marks: is the dilemma best described
  as a truth-tracking failure or as a failure of the group to count as a unified agent,
  and does the answer matter for which repair one prefers?


  The model answer should be roughly 600-800 words, and it must be answerable by reasoning
  from the materials given in the question itself, without citing literature by name
