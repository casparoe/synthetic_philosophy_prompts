  (1) To solve such a puzzle is to find some property that all six left boxes have
  and no right box has.

  (2) For any given six-plus-six boxes, there are always many such properties, not
  just one: besides the intended one, there are endless gerrymandered disjunctive
  properties — "is a circle, or contains exactly one dot, or is the third box" — that
  happen to fit these twelve boxes.

  (3) The examples therefore never determine which property is intended; the same
  twelve boxes are compatible with arbitrarily many rules.

  (4) Yet human solvers, and trained neural classifiers, converge on the intended
  rule from these six boxes alone, and different solvers converge on the same rule.

  (5) Convergence from data that underdetermine the answer must be explained by something
  the agents bring to the task: a preference among properties that was already in
  place before the examples arrived.

  (6) So the capacity displayed is not induction from examples at all; the "right"
  answer was effectively fixed beforehand, and the examples only select among antecedently
  available candidates.

  (7) Therefore there is no such thing as learning a concept from a few examples,
  in Bongard problems or anywhere: either the concept is innate or pre-loaded, or,
  where it is genuinely acquired, it is acquired not from the examples but from the
  structure doing the choosing.


