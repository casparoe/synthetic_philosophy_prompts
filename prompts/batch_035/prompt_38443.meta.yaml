  a real adversary" is tense — you need red teaming with models role-playing misalignment,
  and role-play may not extrapolate. Also "monitor not sharing failure modes with
  the monitored model" vs "monitor must be near-frontier capable" — capable monitors
  tend to share base models. That''s a genuinely interesting tension and known in
