  I think Type 1 on AI control is a strong fit for the rationalist persona and is
  meaningfully in the weeds. Desiderata for an AI control scheme:


  1. Must provide safety against models that are misaligned in unknown ways (you can''t
  condition on knowing the failure mode).

  2. Must not rely on the cooperation of the model itself for safety-critical functions
  (asking the model to be honest about whether it''s scheming).

  3. The control scheme''s effectiveness must be measurable without a real misaligned
  model to test against (measurability / evals problem).

  4. Robust to the model knowing the scheme (model knows the safety protocol).

  5. Must remain safe as the model does more of the work of maintaining the scheme
  (the control scheme itself gets automated — oversight bottleneck).

  6. Must not degrade capability so much that labs just don''t use it (actually deployed).

  7. Must handle shifting deployment — model used in novel contexts not covered by
  the monitoring distribution.

  8. Accountability: when the control scheme flags something, a human must be able
  to adjudicate without being persuaded (persuasion resistance).

  9. Graceful failure: if the scheme fails, it fails detectably rather than silently.

  10. Independence: the monitor must not share the failures of the main model (not
  fine-tuned from the same base — actually a real point, shared weights problem).


