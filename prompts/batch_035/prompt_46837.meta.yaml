  Cases with verdicts:

  - Crying at the end of a novel: feels rational/appropriate, don''t feel embarrassed.

  - Jumping/being startled in a horror movie: fine, just reflex.

  - Feeling genuinely angry at a fictional villain for hours after: feels a bit irrational,
  embarrassed.

  - Feeling dread on behalf of a character who doesn''t know they''re walking into
  a trap: seems appropriate.

  - Being moved by a documentary about a real tragedy vs a fictional one — fictional
  tears feel fine.

  - Feeling betrayed by an author''s plot twist and wanting to "forgive" the character:
  weird.

  - Feeling Schadenfreude at a fictional character''s downfall: fine.

  - But feeling relieved when a villain is defeated? fine.


  Hard pair: I think my fear FOR a character (dread that they''ll be caught) is rational,
  but my fear OF the slime monster (being scared myself) is not rational even though
  both feel the same. Or: crying at the death of a character I know is fictional feels
  appropriate, but being genuinely sad for a week after finishing a series feels like
  a problem.


  Also: angry at a character vs angry at the author for what the character did — which
  is the anger "about"?


  Deliverable: a principle about what emotional responses to fiction are appropriate,
  what it says about further cases (e.g., emotions toward fictional characters in
