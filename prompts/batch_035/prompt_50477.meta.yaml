  result that the expected value of getting free information is never negative. My
  specific move: I want to argue that even if you care about your own beliefs intrinsically
  (painful truths, blissful ignorance, all that), the value of information stays nonnegative
  as long as the agent has the option to not act on / not look at the info, or can
  decide in advance to ignore it. Basically "no rational agent pays to avoid relevant
  information," but with the pain-of-believing stuff folded into the utilities rather
  than treated as an exception.


  The audience is a grab bag: two hard-core Bayesians who think the theorem is trivial
  and will push on where exactly the proof needs the expected utility axioms; one
  person from the psych department who studies information avoidance empirically (people
  declining genetic test results etc.) and is skeptical that any theorem says anything
  about actual people; a visiting econ person who works on ambiguity and Ellsberg-style
  preferences and has, I''m told, a bee in her bonnet about non-Bayesian agents paying
  to avoid resolving uncertainty; and a postdoc who''s into the ergodicity economics
  stuff and will ask whether time-average rather than ensemble-average agents still
  get nonnegative value of information. Also one older theorist who I suspect will
  bring up multi-stage decision problems with changing preferences — the thing where
  a time-inconsistent agent can be made worse off by learning about future temptations.
  And maybe someone about information you''re forced to disclose (auctions, screening),
  though that might be out of scope.


