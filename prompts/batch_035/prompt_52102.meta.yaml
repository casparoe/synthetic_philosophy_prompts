  whole value. What theory of the tax base does that presuppose? Or: the annual gift
  exclusion (gifts up to $18k/year per recipient untaxed) vs. inheritance taxed above
  threshold — what view of the donor''s control/intent does that presuppose?


  Alternatively, the question of why inheritance tax is levied on the estate (donor
  side) rather than as income to heirs (recipient side) — some economists (e.g., the
  "inheritance as income" view) have argued heirs should pay income tax on bequests.
  The practice presupposes that bequests are the donor''s property transaction, not
  the heir''s income. That''s a rich presupposition question: it treats inheritance
  as within the family''s property continuum rather than as a fresh acquisition by
  the heir — presupposing some kind of household/corporate conception of the family,
