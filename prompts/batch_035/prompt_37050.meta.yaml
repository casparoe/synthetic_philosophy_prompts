  so no correction. Attribution — "according to a senior health official," "researchers
  report" — seems to let us pass assertions through our pages without asserting them.
  Yet our headlines take ownership: the body says "researchers report a 40% reduction"
  and the headline says "New drug cuts deaths by 40%," written by an editor who read
