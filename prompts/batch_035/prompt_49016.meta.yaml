  Draft prompt:


  "consistency check time. i''ve been writing up my views on objective chance for
  a workshop where everyone submits their commitments in advance. here''s mine:


  (1) I buy the Principal Principle: if I know the objective chance of A is x, my
  credence in A should be x, conditional on admissible info.

  (2) I think ''admissible'' is doing real work: total info about the present and
  past is admissible, but info about the future is not (that''s the whole point, otherwise
  PP is trivial).

  (3) I''m a determinist about the fundamental physics, and I think that in a deterministic
  world all single-case chances are trivially 0 or 1.

  (4) I nonetheless think the probabilities in statistical mechanics (like the chance
  that gas spreads to fill the container) are genuine nontrivial objective chances,
  since that''s what the best system says.

  (5) I think if a coin is objectively fair (chance 1/2), then in an infinite sequence
  of flips it MUST come out half heads — no possible world where a truly chancy fair
  coin diverges long-run.

  (6) I think credences and chances can come apart for agents with inadmissible evidence,
  so a psychic who can foretell the flip should not set credence 1/2.


  Which of these actually clash, which only look like they clash, and what''s the
  cheapest fix? Don''t flag everything equally...


  Also: (3) and (4) is a genuine tension? In deterministic world, best system might
  still cite probabilistic laws (stat mech is deterministic micro-dynamically, probabilities
  come from typicality measures). A determinist who thinks chances are 0/1 conflicts
  with best-system chances — actually the standard Humean move: determinism doesn''t
  preclude nontrivial best-system chances (Loewer). So (3) conflicts with (4). And
  (3) maybe also with (1)? Not really.


  (5) conflicts with (1)+(6)-ish? (5) conflicts with chance itself: if chance of heads
  is 1/2 each flip, there IS a possible world (probability zero but possible) where
  the frequency diverges. (5) confuses probability-1 with necessity. Tension between
  (5) and (1)/(4). Also (5) with (3): under determinism long-run frequency is fixed
