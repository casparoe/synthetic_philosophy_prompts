  heads at t0" is 1 anyway if time-indexed chances. Fine — (6) covers the dissolve.
  Maybe add a seventh? Keep it at six, good.


  Order the severity: The (5) one is subtle but real; (3)-(4) is the most severe.
  Actually (3)-(4): a determinist can be a Humean and get nontrivial chances via the
  best system (Loewer''s "mentaculus" / Golden chance). So fix for (3): weaken to
