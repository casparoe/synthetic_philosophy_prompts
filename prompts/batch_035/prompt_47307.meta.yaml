  the obvious stuff to me, because I keep second-guessing my own reads at this point
  in the weekend, honestly.


  The question (25 points): Mencius and Xunzi agree that humans can become genuinely
  good, but they disagree sharply about human nature (xing). Explain what each thinker
  takes human nature to be and why, using the main arguments and examples each gives.
  Then answer these two parts: (1) Given Xunzi''s claim that human nature is bad,
  how does he explain where moral standards like ritual came from in the first place,
  and who does he think is capable of becoming good? (2) What does each thinker''s
  view imply about how moral cultivation works — is it more like developing something
  already there, or more like reshaping something from outside?


  Student''s answer:


  "Mencius thinks human nature is good. He doesn''t mean we''re born saints — he means
  every one of us starts with the beginnings of virtue already inside, what he calls
  the four sprouts: the sprout of compassion, of shame, of deference, and of judging
  right from wrong. If these are tended they grow into the full virtues of humaneness,
  righteousness, propriety, and wisdom. His main argument is the child at the well:
  anyone who suddenly saw a toddler about to tumble into a well would feel a flash
  of alarm and compassion, before any thought of reward or reputation. Since that
  reaction is spontaneous and universal, it must come from our nature, not from training.
  Mencius also uses the ox mountain: a hill that once had fine trees gets grazed and
  chopped at day after day until it''s bare, and passersby conclude it never had trees
  — but it did, they just kept getting destroyed. Same with people: someone who''s
  cruel and selfish isn''t missing the sprouts, they''ve just let them be cut down
  over and over, so the person still has to make an effort to tend what''s there.
  But since the sprouts are already the virtues in miniature, the main work of cultivation
  is basically not interfering — leave them alone and they develop on their own, the
  way a tree grows if you stop hacking at it.


  Xunzi, writing a couple generations later, answers that human nature is bad. What
  we''re born with is desire — for food, warmth, comfort, gain, and attention. These
  desires are unlimited while goods are limited, so following nature straight ahead
  produces rivalry, conflict, and chaos. In that sense evil is baked in from birth.
  The desires themselves are the problem, so the point of ritual and learning is to
  suppress them and eventually extinguish them: the finished sage is someone who no
  longer wants anything outside the path. Xunzi compares it to straightening a bent
  plank of wood with a steam-bending frame — human material starts out crooked and
  has to be forced into shape.


  This makes morality artificial, imposed from outside. But that creates a puzzle
  Xunzi has to face: if human nature is bad, where did the first sages get moral standards
  from? No one could invent ritual before being good, and no one could be good before
  ritual existed. As far as I can tell Xunzi bites the bullet: the earliest sage-kings
  were simply exceptions, rare individuals born with unusually good material. Everyone
  else can be shaped into outward conformity through ritual training, but for Xunzi
  real goodness is reserved for the exceptional few. That''s the real cost of his
  view compared to Mencius, where everyone has the sprouts and just needs to tend
