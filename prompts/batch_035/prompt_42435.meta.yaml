  "I''m a journalist who writes mostly on science and ideas, and I''m working on a
  piece about whether death is bad for the person who dies. It started as a fun sidebar
  on Epicurus but the more I dig the less it feels settled. My working credence that
  death (ordinary death, no afterlife, permanent end of experience) is bad *for the
  person who dies* is about 0.7. A philosopher friend I sound ideas off is closer
  to 0.25 — she leans Epicurean: if death is simply the absence of experience, there''s
  no subject left to be harmed, so nothing is bad *for you*, though it can be bad
  for the people who love you.


