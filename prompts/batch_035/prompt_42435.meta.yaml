  probability that Lucretius''s symmetry point (we don''t pity the eons before our
  birth, so why dread the eons after) can actually be broken, and anything else you
  think belongs in the chain. One line of justification per term, then the combination,
  and tell me which term the final number is most sensitive to — that''s where my
  0.7 and her 0.25 most plausibly diverge, and I''d like to say so in the piece with
  some confidence.


  If it helps: I''ve been testing intuitions with a case I made up for the piece —
  you undergo suspended animation, no dreams, no experiences at all, for two hundred
  years, and are then revived healthy. Everyone I ask says the gap wasn''t bad *for
