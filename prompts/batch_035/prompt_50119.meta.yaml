  ''Dennett''s point with the desktop analogy is that our experience of our own minds
  is like a computer user''s experience of their desktop. The icons are not the machinery
  — you never see the circuits and voltages when you move a file to the trash — but
  they are not fakes either, they are a simplifed way of getting at real processes.
  In the same way, what we experience as consciousness (the unified stream of thoughts,
  colors, the self that seems to watch it all) is how the brain presents its own activity
  to itself, and the presentation leaves out almost all of the underlying processing.
  So Dennett is not saying consciousness doesn''t exist, he is saying it''s a real
  interface produced by the brain, not a literal picture of what the brain is doing.


  Where does the illusion come from? Dennett thinks the brain builds something like
  a Cartesian theater: an inner display on which the contents of consciousness are
  presented, and the illusion is that there is such a display, when really there is
  no single place where it all comes together. Since the interface is just a summary,
  it doesn''t actually do anything — consciousness for Dennett is epiphenomenal, a
  kind of shadow cast by the real work the brain does, which goes on entirely without
  it. This is like Kant''s point about phenomena and noumena: we only ever get the
  interface (the world as it appears), and the machinery in itself is forever hidden,
  so our knowledge of our own minds is only knowledge of appearances.


