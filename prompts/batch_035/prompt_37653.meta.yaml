  I teach intro ethics at a community college -- 18ish students, one 75-minute session.
  Next week we''re doing Augustine on lying, specifically his claim that you may never
  assert what you believe false, not even to a murderer at the door, and I''m tired
  of watching students just write the position off as fanaticism in the discussion.
  Design a game where they have to actually live inside the rule before they''re allowed
  to dismiss it.


  Here''s the shape I''m imagining, feel free to improve it: some students play villagers
  in a vague historical setting where soldiers are hunting a fugitive who''s done
  nothing wrong. One villager per round has the fugitive hidden in their house. Another
  student plays the interrogator, whose whole job is to get a straight answer about
  the fugitive''s whereabouts, and they can use promises, threats, appeals to the
  villager''s family, whatever. The villager may refuse to answer, stay silent, stall,
  or say anything they believe true -- but the moment they assert something they believe
  false, the round is lost for their side (I want some kind of umpire or appeals mechanic
  here, since "was that technically true?" is going to be half the game). Score it
  somehow so the interrogator side and the villager side both have something to win,
  no real money needed.


  The part I care most about: they''ll quickly discover you can say misleading but
  literally true things ("I haven''t seen him since breakfast"), and the game should
  force them to lean on that hard. Then the debrief has to ask the question I actually
  want them to chew on: under Augustine''s definition of lying (saying something other
