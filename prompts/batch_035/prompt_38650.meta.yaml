reasoning_summary: 'Pick a domain: "The paradox of fiction" seems good. Type: an argument
  that proves too much, applied to paradox of fiction.


  Let me craft an argument chain with subtle flaw. The paradox of fiction: we feel
  real emotions (fear, pity) for fictional characters; we believe fictional characters
  don''t exist; but standard beliefs required for emotion. Common responses: pretend
  belief (Walton), illusion theory, thought that emotions can be directed at imagined
  content (make-believe). I can construct a "proves too much" argument.


  Idea: argument that seems to show we can''t have emotions about anything we can''t
  causally interact with... or an argument that emotions about fiction require belief
  in existence, then slides to "so fiction readers must literally believe in dragons"
  — absurd. Or scope/equivocation.


  Alternative: build argument that seems to prove there''s no such thing as being
  moved by a movie. E.g.:


  (1) To fear something, you must believe it is dangerous (or believe it exists and
  threatens you).

  (2) When I watch a horror movie, I feel fear at the killer on screen.

  (3) I don''t believe there''s any killer; I believe it''s fiction.

  (4) So when I feel fear at a movie, I both believe and don''t believe there''s a
  dangerous killer nearby.

  (5) Contradiction — so I can''t actually fear during movies; what I call fear at
  movies is really just... etc.


  Hmm, that''s the standard paradox itself. To make it "proves too much," craft an
  argument that seems to show something absurd like "we can never have any emotions
  at all" or "we can''t be moved by anything not present."


  Better: a friend''s argument that seems to show nobody has ever been moved by a
  novel, ever — or that emotion requires real danger, then extend: also, emotions
  about past events are impossible too (the danger is gone), so grief for dead relatives
  is impossible — proves too much. And ask which step fails.


  Design an argument with subtle equivocation:


  (1) Emotions are states that prepare us to act; fear is essentially a detection-and-response
  system: you can''t fear P unless you take yourself to be in danger.

  (2) When I read a novel, I know I''m not in danger and no one in the story is real.

  (3) So whatever I feel reading a novel, it isn''t fear — at most fear-like stirrings.

  (4) The same applies to everything I read about the past: the danger is over, the
  people are dead, nothing I do can matter to them. So no one can feel real fear or
  pity for anything that isn''t presently before them.

  (5) But people plainly feel something reading about historical atrocities — something
  they report as horror just like the fiction case.

  (6) So either our emotions about the past are also counterfeit, or the reasoning
  from (1)-(3) is broken somewhere.


  Hmm, but this is closer to commitments tension. Let me get a cleaner "proves too
  much" flavor: the argument''s conclusion absurd, asker can''t locate the flaw.


  Alternative, more subtle: an argument with a scope shift. Let me construct:


  (1) You can only feel an emotion toward something you believe exists. (emotions
  have objects; nonexistent objects, no emotion)

  (2) Nobody believes fictional characters exist. (We say Anna Karenina is fictional;
  fiction-readers aren''t deluded)

  (3) So nobody has emotions toward fictional characters.

  (4) But people cry at Anna Karenina''s death; whatever moves them must be something
  they take to exist.

  (5) The only thing left that they take to exist is the words on the page / the sentences.

  (6) So people are moved, literally, by sentences — we''re sad about strings of text.

  (7) Since the same goes for anything we "feel" about the future, history, absent
  friends... everything we feel is about present stimuli...


  Conclusion absurd. The subtle flaw: step from "emotions require belief in existence"
  combined with the disjunction in (4)-(5) — a false dilemma: either the character
  or the words. Walton''s answer: it''s quasi-fear within a game of make-believe;
  or emotions can take imagined propositions as objects (thinking of P, not P''s truth).
  Actually the more standard diagnosis: (1) is ambiguous — "emotion toward X requires
  believing X exists" vs "having an emotion requires some belief-like state toward
  the content." Or the flaw is in (5): the object could be the fictional character-as-imagined,
  the proposition, the scenario, not just words.


  Actually, "the only things left that they take to exist" — false dilemma. Good.
  Also (1) is questionable: you can fear that it will rain tomorrow — fear "that p"
  doesn''t need object existence; anticipation. But the asker shouldn''t signal the
  answer.


  Let me write it with a persona: a friend / a grad student argument. Casual tone,
  maybe a typo. Numbered steps. Ask: which step do I reject and what does rejecting
  it cost? Don''t signal the answer. Maybe say what they''d like to keep (e.g., "I''d
  like to keep (2), saying readers believe Anna exists seems crazy").


  Draft:


  "My cousin hit me with this and I can''t find the seam. (1) Every emotion is directed
  at something you believe exists — you can''t pity someone unless you take there
  to be someone to pity. (2) Nobody reading Anna Karenina believes she exists; they
  know it''s a novel. (3) So readers don''t have emotions toward her; whatever they
  have isn''t pity. (4) Yet readers cry, and something has to be the object of that
  feeling, and the only candidates they believe in are the sentences on the page (and
  maybe themselves). (5) So what moves readers is, literally, arrangements of words
  — people cry at ink. (6) And notice the same trick works everywhere: I also can''t
  pity anyone not in the room with me, can''t be scared of anything that isn''t about
  to hurt me, so at most I ever feel things about whatever is physically present.
  Which is nuts, because I''m pretty upset about my grandmother''s death and she''s
  been gone ten years and wasn''t made of sentences. So somewhere in there something
