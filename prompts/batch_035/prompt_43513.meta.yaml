  ---


  I direct a memory-care unit at a residential facility, and my staff — nursing aides
  and activities coordinators, mostly — face what our training materials call "therapeutic
  fibbing" a dozen times a shift: a resident asks when her husband is coming (he died
  three years ago), another insists on going home to cook dinner for children who
  are now middle-aged, and the standard guidance is to enter the resident''s reality
  and say whatever keeps the peace. Some of our staff are religious and have begun
  to refuse, citing Augustine''s teaching that every lie is a sin; we also get complaints
  from families on both sides — some demanding we never "correct" their mother, others
  horrified we would "deceive" her. I''ve been asked to write a decision procedure
  grounded in Augustine''s position that my staff can actually run in the thirty seconds
  before a resident becomes agitated.


  What I want you to do: take Augustine''s absolute prohibition on lying and turn
  it into a workable procedure — an ordered set of questions, with what counts as
  a sufficient answer, where the procedure returns a "no" (this utterance is a lie
  and may not be spoken), where it returns a "permitted" (silence, redirection, ambiguity,
  a truth that consoles), and where it stops and hands the question to a human being
  because it is a question of values rather than application. The procedure must be
  usable by someone with no philosophy training and no time for theory: a card they
  could keep in a pocket.


  The conceptual work is in keeping the distinctions Augustine actually makes while
  dropping the apparatus. In particular, his definition of a lie — asserting, to another,
  something contrary to what one holds in one''s own mind, with intent that the hearer
  believe it — implies that concealment, silence, evasion, and even misleading-but-true
  statements are not lies, and that motive and kindness make no difference (his catalogue
  of "helpful" and "jocose" lies are all still lies). Build the procedure around that
  definition: what the staff member believes, what the utterance asserts, what the
  staff member intends the resident to come to believe. Include the genuinely hard
  questions, and don''t paper over them: whether redirection that trades on a resident''s
  inability to track time is "intending to deceive" even when no sentence is false;
  whether a statement can be a lie when the resident cannot form the belief it would
  produce (Augustine''s definition presupposes a hearer who can be deceived — does
  a resident who no longer forms new beliefs even satisfy it?); whether going along
  with a resident''s false belief — agreeing with it, nodding, not correcting — is
  assertion at all.


  Then run the procedure on three cases, and at least one of them should end somewhere
  the staff member or family will not like:


  1. A resident, early enough in her dementia to form and act on beliefs, asks every
  afternoon whether her son called, and the son has died; she grieves anew each time
  she is told, then forgets, and asks again. Family has asked us to say he called
  and is doing well.

  2. A resident insists he must leave to pick up his children from school and becomes
  physically agitated at the locked door; a colleague suggests telling him the school
  called — the children are staying with grandparents tonight, there''s no school
  — which we know dissolves the agitation every time.

  3. A resident who is beyond forming new beliefs asks where her mother is; there
  is no way to tell whether "in the garden" produces any belief in her at all, but
  she calms when someone answers.


  Finally, say plainly what the procedure cannot do: where the Augustinian framework
  misfires for this population (e.g. its assumption that truth-telling serves the
  hearer''s rational soul), where staff with different moral and religious commitments
  will refuse to follow it, and what the procedure should do about conscientious refusal
  — hand-off points, documentation, escalation to family — without pretending the
  values disagreement is a factual one.


