  Domain: Aunt Hillary and the Ant Fugue. Type: interview questions.


  Prompt: A high school student who read GEB''s "Prelude... Ant Fugue" for an extended
  essay / philosophy club podcast. Guest: a philosopher who defends the view (call
  it "the colony-level mind thesis") that an ant colony can literally have beliefs,
  experiences, even converse, while no individual ant has anything like a mind — the
  mind is at the level of the whole colony, just as (the guest holds) a person''s
  mind is at the level of the brain, not the neurons.


  Ask for ten-ish questions with follow-ups keyed to anticipated replies. Must press
  on:

  - the disanalogy between ants and neurons: ants wander between functional teams,
  individual ants die and are replaced, the mapping between "symbols" and ant-teams
  shifts; neurons are fixed.

  - the substrate/multiple-realizability issue: if the colony''s intelligence is just
  a matter of organization, could a swarm, a city, a market, or a university be a
  mind? Where does the defender draw the line and on what principled basis?

  - whether the view is testable or merely a redescription: what would distinguish
  a colony that genuinely thinks from one that merely behaves as if it does — is the
  guest''s claim scientific or metaphysical?

  - consciousness vs. intelligence: does the guest claim Aunt Hillary feels anything,
  or only that she solves problems? What work does "understanding" do here?

  - the Anteater''s symbiosis: in the dialogue the anteater who eats some ants of
  the colony is nonetheless the colony''s friend — a case about levels of harm/benefit:
