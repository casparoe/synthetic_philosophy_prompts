  ---


  I sit on the pastoral care commission of the publicly funded hospital network in
  our region. Our current arrangement funds chaplaincy posts — Anglican, Roman Catholic,
  Muslim, and Jewish, allocated roughly in line with patient demand — out of the network''s
  budget, following the cooperative model found in parts of continental Europe rather
  than the stricter separation associated with French laïcité. A local humanist association
  has now petitioned us to fund accredited non-religious pastoral carers on the same
  basis, for patients who want someone to talk to about dying, meaning, and loneliness,
  but not within a religious framework. Our own survey work suggests that roughly
  a tenth of patients who want such a conversation would prefer a non-religious visitor:
  about the level of demand that justified one of our smaller existing posts.


  The commission is split, and the split is not merely practical. One side holds that
  chaplaincy is by definition a religious office, so the petition is a confusion:
  the state''s duty of neutrality is best discharged by keeping out of spiritual care
  altogether, and the principled alternative to our current arrangement is not to
  extend it to humanists but to shrink it, transferring provision to the religious
  communities themselves. The other side holds that neutrality means neutrality between
  religion and non-religion, not between the state and one side only: if we pay for
  a rabbi to sit with a dying patient but not for a humanist carer to do the same
  thing, we are not neutral but quietly confessional.


  Please draft the short written opinion I shall circulate before our meeting in three
  weeks'' time. It should (i) recommend a concrete course of action — fund the posts,
  decline the petition, or approve it under conditions, with a time frame for implementation;
  (ii) give the reasoning in terms the commissioners can actually debate, engaging
  the strongest consideration on whichever side loses, rather than restating our equalities
  obligations; and (iii) make explicit which general settlement between church and
  state the recommendation quietly endorses — strict separation, cooperation with
  religious bodies, or even-handed support for religion and non-religion alike — and
  say whether that settlement is defensible for a healthcare system at all, or whether
  the network should confine itself to clinical care and leave questions of meaning
  to patients and their own communities.


