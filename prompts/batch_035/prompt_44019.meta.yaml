  Content of prompt:


  - Name the work and lens.

  - Ask the reading to take both seriously, be faithful in both directions.

  - Specific things to address: (1) the indirect-duty view stated fairly; (2) whether
  the novel vindicates it — the good masters (John Manly, Jerry Barker) are better
  people overall, cruelty to horses co-occurs with coarseness toward humans — Kantian
