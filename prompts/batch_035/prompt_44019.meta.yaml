  the famous scene where Beauty sees her body on the knacker''s cart — at that moment
  the reader''s grief is about Ginger, not about anyone''s character; can a Kantian
  account for that, or does it ring hollow exactly there; (4) a further wrinkle: the
  bearing rein — cruelty driven not by sadism but by fashion/status; what does that
  show about the "damage to the agent" explanation — is the vanity case one where
  the indirect-duty rationale seems to miss, since the owners aren''t disposed to
  cruelty, they just don''t notice the horse? Hmm, nice in-the-weeds point: Kant''s
  rationale works best for sadists; the novel''s cruelty is mostly thoughtlessness,
  fashion, and economics — does the indirect-duty view have anything to say about
  the indifferent? That''s a genuinely novel angle.


  Actually Kant does say duties to animals cultivate compassion; the thoughtless person...
  fine, it''s a live question.


  (5) Also: the narrative voice — the first-person horse narrator presupposes the
  horse has a point of view on his own life (he recounts, hopes, fears). Kant denies
  animals are persons / ends in themselves. Does the novel''s form thus beg the question
  against Kant? Or is the narration merely a literary device the Kantian can accept
  (we know animals feel; Kant doesn''t deny sensation, only that they are ends)? Good
  point: Kant doesn''t deny animals feel pain; he denies they can wrong us / that
  we owe them anything directly. So the narration is compatible. The crux is whether
  the pain counts morally for the animal.


  (6) Ending question: does the novel''s happy ending (retirement, "my last home")
  read as a reward for Beauty — as if his suffering mattered to him — or as charity
  by humans? And what would the essay conclude: does the novel refute Kant, or does
  it at best dramatize what the indirect-duty view leaves unexplained?


