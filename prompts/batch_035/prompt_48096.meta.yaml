  I''m a sixth-form student writing an extended essay on what ''disease'' means, and
  I''ve got stuck on how psychiatry actually goes about deciding what counts as one.


  The practice I want to understand is the maintenance of the big diagnostic manuals,
  above all the DSM. As far as I can tell it works like this. A committee of psychiatrists
  periodically adds, removes and redraws disorders, and what they decide determines
  enormous practical things — whether insurers pay, whether research money flows,
  whether a person can be excused work, conscripted, or held responsible. And some
  of the decisions look strange from the outside. Homosexuality was listed as a disorder
  until 1973, when it was removed after years of protest and, eventually, a vote by
  the membership — not after any new laboratory finding. Nicotine dependence sits
  in the manual as a genuine disorder, while the same health systems that treat it
  as an illness charge smokers higher premiums, on the grounds that it''s a choice.
  And ordinary grief after a bereavement isn''t a disorder until it lasts past some
  cut-off, at which point the same sadness, unchanged, becomes ''prolonged grief disorder''.
  The line between grief and depression, between dependence and choice, between a
  trait and an illness, all seems to be drawn by the same book that defines the terms.


  My question: what view of disease does this practice presuppose? If disease were
  just a value-free matter of biological malfunction — the body failing to do what
  it was selected to do — then membership votes and protest campaigns shouldn''t have
  anything to do with it, and the 1973 decision would have to be described either
  as the correction of a factual error or as pure politics, and I don''t know which
  is worse for the manual''s authority. If disease is partly a normative matter —
  a condition has to harm you, or violate social expectations, before it''s an illness
  — then the practice starts to make sense, but then I can''t see what keeps the line
  from being pure convention: whatever a committee and its era find distressing counts
  as a disorder. Perhaps the truth is that the practice needs both ideas at once and
  they pull in different directions — the smoker example seems to need ''choice''
  and ''illness'' at the same time.


