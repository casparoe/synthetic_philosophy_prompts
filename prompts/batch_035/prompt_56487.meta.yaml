  presupposes outcomes matter? Are they inconsistent, or compatible? What theory of
  accountability, if any, makes both sensible? What would have to change in one practice
  if the other''s presupposition won?


  Make it polished, formal-ish, in the weeds: mention "on-call blameless postmortems"
  — actually blameless postmortems are a great third element: engineering culture
  does blameless postmortems (control-based view: punish/review process not outcome...
  wait, blameless postmortems excuse individual engineers even when they did cause
  it — control-based-ish view that systems, not persons, are the unit of analysis).
  So three practices in tension: (1) resilience training: your stress is your responsibility
  via dichotomy of control (internalize the locus); (2) performance reviews: rated
  on outcomes partly outside control; (3) blameless postmortems: after incidents,
  individual actions are not blamed even when in control. Nice triangle. Ask what
  implicit theory of responsibility each presupposes, whether they''re jointly consistent,
  what would have to change.


  Keep the asker''s voice: software engineer, no philosophy background, formal/polished
