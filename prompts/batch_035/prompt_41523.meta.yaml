  I sit on the grants committee of a mid-sized private research foundation that disperses
  about $15 million a year in small awards, most under $200k, across the life sciences.
  Our new director is an enthusiast for futarchy — Robin Hanson''s proposal to let
  prediction markets make factual decisions while democratic or trustee input settles
  the values — and she has persuaded the board to consider a two-year pilot. The scheme
  as she describes it: for every proposal, alongside our usual peer review, we would
  open an internal market in which any staff member or committee member could trade
  shares on whether the project, if funded, would hit a designated measurable target
  within three years (e.g., a follow-on grant, a registered clinical or field trial,
  an independently verified benchmark result). Markets would use a logarithmic market
  scoring rule so liquidity is subsidized by the foundation, each trader would get
  a capped annual token budget to prevent any one person dominating prices, and staff
  close to the proposed work — including the sponsoring program officers — would be
  allowed to trade, on the theory that they hold exactly the local knowledge the mechanism
  is meant to harvest. Where a market''s closing price put a proposal''s success probability
  more than twenty points below the committee''s consensus estimate, the proposal
  would be declined or sent back regardless of review scores; the director''s flagship
  argument is that peer review is where prestige bias and motivated reasoning do their
  worst, and a mechanism that forces people to put scarce tokens behind their opinions
  is the cheapest discipline we will ever buy.


  Please draft the short decision memo I will circulate before the March meeting —
  recommend adopt, reject, or adopt with conditions, with reasons the director could
  actually respond to. In writing it, I would like you to take seriously at least
  three things the pilot''s boosters have not thought through. First, the choice of
  the measurable target looks like a technical detail but is doing all the values
  work: which outcomes count as success is precisely the question futarchy assigns
  to non-market judgment, so the pilot relocates our problem rather than solving it,
  and grantees will optimize whatever metric we pick. Second, our traders are not
  the profit-motivated speculators the mechanism assumes: they are employees with
  career stakes, friendships, and sincere commitments to research programs, holding
  small token budgets, in thin subsidized markets — the conditions under which prices
  are cheapest to move for reasons other than accuracy, and where the corrective profit
  is too small to attract correcting traders. Third, whatever we decide, the memo
  should state what would count as evidence two years from now that the decision was
  right, so this is not just a policy memo but a self-assessing one. Be candid about
  the strongest consideration on whichever side loses.


