  "A pop-science book I picked up summarizes linguistic relativity like this: ''Sapir
  and Whorf argued that your language determines your thoughts: if your language has
  no word for a concept, you can''t think it. Their favorite example was the Hopi,
  whose language supposedly has no way to refer to time at all — a claim later shown
  to be flatly wrong when linguists examined the language, which has tense and words
  for days and seasons. Alongside this, experiments on color perception in the 1970s
  showed that people from cultures with fewer color words see colors the same way
  everyone else does, and the hypothesis was abandoned. Recently it has been revived
  in a weaker form: studies show that Russian speakers, whose language has distinct
  basic words for light and dark blue, are slightly faster at discriminating shades
