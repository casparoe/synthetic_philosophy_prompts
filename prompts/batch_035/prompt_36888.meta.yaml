  co-authored, claiming experiments "refuted" it in the 1990s and it was revived,
  conflating grammatical categories with lexical differences, the "Eskimo words for
  snow" myth, or claiming Pinker refuted it.


  Common subtle misrepresentations:

  - Treating the hypothesis as a single jointly-authored claim ("Sapir and Whorf''s
  hypothesis").

  - Overstating: "language determines thought" (determinism) attributed to both, when
  the interesting modern debate is about weaker influence.

  - Hopi time claim: Whorf claimed Hopi has "no words, grammatical forms... that refer
  directly to what we call ''time''" — that''s a real quote, but I shouldn''t quote.
  I can paraphrase. Actually the popular version overstates: Whorf''s actual claim
  was more nuanced (Hopi prepares/manifesting vs. time), but the famous overstated
  version is often attributed. Pinker called it "false" based on Malotki. That''s
  fine to include paraphrased.

  - Color term research: Berlin & Kay used as refutation, but it tests lexical categories,
  not grammatical relativity.

  - Recent findings: Russian blues (Winawer), Guugu Yimithirr absolute directions
  (Levinson) — these test perception/memory, not reasoning.


  Type 2 instructions: write the summary myself, attribute to unnamed source, mostly
  right with one or two subtle misrepresentations, no howlers, asker is a reader not
  a grader.


  Deliverable: accuracy audit — sentence by sentence or component-wise, what''s accurate,
