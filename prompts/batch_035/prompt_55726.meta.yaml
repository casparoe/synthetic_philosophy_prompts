  Does it only make sense on a view where the poor must earn their support in a way
  the comfortable need not, or is there a reciprocity-based story, or an insurance
  story, that could license it — and do the exemptions fit that story or quietly refute
  it? I''d also like to know where the practice is genuinely underdetermined, so that
  rival theories would all permit it, and what would have to change if the implicit
  theory were swapped for, say, an unconditional basic income view of entitlement.
