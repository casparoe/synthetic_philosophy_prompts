  ---


  I work in transport policy, and my question is about a pattern I keep running into
  when I try to reason about the long-term effects of decisions. I''d like to know
  whether it has an established name, and, if it has, how the term is standardly used,
  and, if it hasn''t, whether you can help me pin down exactly what the pattern is
  and give it one.


  Here is the pattern. Whenever I try to compare two options on the basis of their
  indirect and long-run effects, each consideration I add seems to licence an equal
  and opposite one. Example: I once had to assess whether expanding a suburban rail
  line was a good thing. Direct effects seemed modestly positive. But then: more rail
  might mean more commuting, hence more distant suburbs, hence more sprawl and emissions
  — a point against. Unless more rail at the edge of the city relieves pressure on
  the roads corridor, and fewer people drive... etc. Each chain is individually plausible,
  and no matter how deep I go, the chains branch again, with roughly equal weight
  on both sides. What I find distinctive is not that the outcome is uncertain — of
  course it is — but that the structure of what I know is symmetric: for every argument
  that option A is better there seems to be a counterpart argument of comparable strength
  that B is, so the expected difference stays near zero while my confidence in any
  estimate keeps shrinking as I learn more. It''s not that inquiry is fruitless; it''s
  that inquiry doesn''t narrow the gap, it only fattens the error bars.


  Second example: choosing between a job in a development bank and one in a consultancy
  that pays a lot more and would let me donate the difference. Every calculation I
  run opens a mirror-image consideration...


  I''ve half-encountered a few terms that seem nearby but not right. "Knightian uncertainty"
  is about not having probabilities at all, but here I could produce probabilities;
  they just come in matched pairs... "Moral uncertainty" is about not knowing what''s
  valuable; but I''m confident about the values (roughly, welfare) — what won''t settle
  is the empirical question of which act does more good. And "risk" in the technical
  sense is a situation where you can''t say which outcome will occur but can say which
  act is better on balance; the whole point of my pattern is that on balance never
  arrives.


  So: is there a name for this specific configuration — symmetric, self-defeating,
  not value-based but consequence-based? If there''s an established concept, please
  say exactly what it covers and where it doesn''t fit. If not, please coin a term,
  define it so as to distinguish it from the nearby ideas I''ve mentioned (and from
  anything else obvious), and give a couple of boundary cases. Please answer in British
  English.


