  Draft argument (intentionalist, proving too much):


  1. What a text means is fixed by what its author meant by it (authorial intention).

  2. What an author means is a mental state, which is always in principle describable
  in other words: if the author meant X, there''s a correct paraphrase of X in the
  author''s vocabulary.

  3. Paraphrases preserve meaning only if they''re synonymous in the language.

  4. So for every text, there is a sentence in the author''s language synonymous with
  the text, i.e., meaning is always capturable by a statement.


