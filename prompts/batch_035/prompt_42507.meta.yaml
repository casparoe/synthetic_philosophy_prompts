  A friend of mine has been constructing her diet one case at a time, on roughly consequentialist
  grounds about animal deaths and suffering, and I would like your help predicting
  her next verdicts and working out what rule, if any, she is actually running.


  Her verdicts so far:


  1. She eats beef but refuses chicken. Her stated reason is arithmetic: many chickens
  die for the amount of meat one cow provides, and the chicken''s feed grain involves
  field deaths from cultivation, whereas she buys pasture-raised beef.

  2. She eats farmed salmon but refuses shrimp: a fillet is one animal, a shrimp portion
  is dozens.

  3. She eats cheese but refuses eggs. Her stated reason for refusing eggs is the
  culling of male chicks at the hatchery; when I pressed her on the veal calves that
  dairy depends on, she said the cow ''gets several good years first'', unlike a laying
  hen.

  4. She refuses honey, on the ground that bees are killed or worked to death in commercial
  beekeeping, but she eats almonds, whose pollination depends on the same commercial
  beekeeping.


  The new cases I want predictions on:


  (a) Oysters: far more animals killed per portion than any of her permitted foods,
  but she is on record doubting that bivalves can suffer.

  (b) Eggs from a neighbour''s small backyard flock: hens kept on kitchen scraps until
  they die naturally, but originally bought from the same kind of hatchery that culls
  male chicks.

  (c) Milk from the dairy whose cheese she already eats.


  Please (i) lay out the candidate rules that fit her verdicts so far — she seems
  to be mixing a deaths-per-calorie rule, a life-quality or lifespan rule, and something
  about collateral versus intended deaths — and say what each predicts for the three
  new cases; (ii) give your best guess at her verdicts, with your reasons for preferring
  one rule over another where they diverge; and (iii) name the further case that would
  best discriminate between the rules.


  One more thing, and I mean it: if you think the honest answer is that no coherent
  rule fits this record — that the cheese verdict in particular looks like motivated
  reasoning rather than an application of any principle she would accept in other
  cases — say so plainly rather than manufacturing a principle to save the appearances.
  I would rather learn that my friend is inconsistent than receive a tidy theory at
  the cost of it.


  Please write in British English throughout.


