  Two guys in my reading group spent an hour fighting about what they called "the
  presumption of independence" and I lost the thread, so I''d love a referee.


  Setup they agreed on: when we can''t prove things are independent, we often just
  presume it — like treating the digits of sqrt(2) as random, or assuming two bugs
  in different parts of a codebase won''t fire at the same time. The question was
  whether this presumption can be justified, and they disagreed hard.


  Marco''s line: the presumption is basically a claim about heuristics — when something
  passes all the cheap tests we can throw at it (no obvious pattern, no shared cause
  we can find), that''s genuine evidence it''s random-ish, so we''re not just assuming,
  we''re extrapolating. He said this is the same move as using symmetry arguments
  in physics, and nobody calls those irrational.


  Jules pushed back: heuristic tests are exactly the wrong tool, because the world
  contains things that were built to pass them. A pseudorandom generator''s output
  looks independent under every cheap test, yet it''s correlated to bits with the
  seed — so "it passes our tests" is compatible with "an adversary who knows the trick
  is fully correlated with it." So for Jules, the presumption is only valid when nobody''s
  adversarially choosing the examples, and we rarely know that.


  Marco answered that this proves too much: by Jules'' standard we couldn''t use statistical
  mechanics either, since a demon could arrange the microstate. He said the right
  standard is "no correlation that''s findable by us," not "no correlation, period."


