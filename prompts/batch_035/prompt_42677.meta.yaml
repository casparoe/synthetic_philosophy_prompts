  Design: Question (take-home, 25 marks): "A group of n players, each can see others''
  foreheads... public announcement creates common knowledge; explain why the announcement
  is informative even though everyone can see at least one muddy face themselves."
  The classic subtlety: with 2+ muddy children, before the announcement everyone already
  knows someone is muddy, yet the announcement still conveys information by making
  it common knowledge. A subtle student mistake: claiming that with k muddy children
  the father''s statement was already known by everyone, so announcement adds nothing
  (wrong: it adds higher-order knowledge); or conflating "everyone knows" with "common
  knowledge"; or off-by-one in the induction (children with muddy faces answer on
  round k; clean children know after round... subtle error: saying clean children
  will know their status after k rounds — actually they know after the k-th silence...).
  Let me craft carefully.


  Setup: n children, k have muddy foreheads. Each child sees others but not own forehead.
  Father publicly announces "at least one of you has a muddy forehead" — and it''s
  common knowledge that everyone is a perfect logician, everyone hears the announcement,
  etc. Father repeatedly asks "do you know your status?" Simultaneously, each round
  all answer "no" until round k, when all muddy children say "yes."


  Key facts:

  - If k=1: the single muddy child sees no mud, deduces immediately after announcement,
  answers yes in round 1.

  - If k≥2: before the announcement, everyone already sees at least one muddy face.
  Even the muddy children see k−1 ≥1 muddy faces; clean children see k ≥2. So "everyone
  knows someone is muddy" even without the announcement. But it''s NOT common knowledge
  (for k=2: everyone knows, and everyone knows that everyone knows? Check: k=2, children
  A and B muddy, C clean. Does A know that B knows that someone is muddy? A considers
  the possibility that A is clean, in which case B is the only muddy one and B sees
  no mud — so A doesn''t know that B knows someone is muddy. Hence not even 2nd-order
  common knowledge.) The announcement makes it common knowledge, and this is what
  powers the induction.

  - Timing: all muddy children answer "yes, I know" in exactly round k. Clean children
  learn their status in round k too (after muddy ones answer yes, clean ones can deduce...
  actually after the k-th round''s yes answers, clean children know there were exactly
  k muddy, and since they see k muddy others, they know they''re clean). Wait: after
  round k where muddy children say yes: a clean child sees k muddy faces; if the clean
  child were also muddy, there''d be k+1 muddy and the yeses wouldn''t have come at
  round k. So clean children deduce they''re clean at round k. Alternatively if asked
  again round k+1.


