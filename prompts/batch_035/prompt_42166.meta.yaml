  1. Straightforward maximizer — best option, full stop.

  2. Simon-style bounded optimizer — optimizing is still the ideal, but search costs
  count, so "good enough" is just maximizing with the cost of looking folded in.

  3. Intrinsic satisficer — the aspiration level is not a concession to costs; stopping
  when the bar is cleared is the whole point, and an obviously better option sitting
  on the same shelf doesn''t obligate you.

  4. Ecological-rationality type — the interesting question is which heuristic fits
  which environment, not whether heuristics are a regrettable fallback.

  5. Bar-adjuster — quietly lowers the aspiration level when the world disappoints,
  and thinks that''s wisdom, not settling.


