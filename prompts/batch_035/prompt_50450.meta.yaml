  I teach a graduate seminar on confirmation and statistical inference, and I want
  a case analysis I can give the students that goes beyond the usual "NHST is broken,
  therefore Bayes" op-ed. The episode is the psychology replication crisis, anchored
  on the 2011 publication of Daryl Bem''s nine experiments purporting to show precognition,
  the Bayesian reanalysis that followed, the failures to replicate, and the reform
  movement those failures catalyzed — preregistration, registered reports, larger
  samples, and the Many Labs replication consortium. The lens is the dispute between
  frequentist and Bayesian statistics, running in both directions.


  Then bullets of tasks:


  1. Do the mapping carefully. Under each framework, state what Bem''s statistically
  significant results were supposed to license, and what the subsequent reanalysis
  and failed replications did to that license. Be precise about the difference between
  "the data are surprising under the null" and "the hypothesis has higher posterior
  probability than its rivals," and about what a failed replication is on each reading
  — a posterior update, or evidence that the original procedure''s error guarantees
  were illusory.


  2. Say which features of the crisis each framework genuinely illuminates. Candidates:
  the argument that optional stopping invalidates p-values but not Bayes factors,
  and whether that asymmetry actually mattered in this crisis; the claim that Bem''s
  data were more damning on a Bayes factor than on a p-value, and what that shows;
  and Meehl''s old point that in the social sciences the null is never exactly true,
  so a sufficiently powered significance test of a directional hypothesis is nearly
  guaranteed to succeed — a point that cuts against a certain way of using frequentist
  tools but does not obviously vindicate Bayesian ones.


  3. Say where each framework is silent or misdescribes. Much of what actually broke
  was not inference but design and reporting: the garden of forking paths, selective
  publication, and, in the worst cases, outright fraud. Neither prior probabilities
  nor long-run error rates say anything directly about a fabricated dataset. And preregistration,
  the reform that arguably worked best, is usually justified in frequentist terms
  — it fixes the procedure whose error rates are being guaranteed — while it is less
  clear what a devout subjective Bayesian makes of the demand that the analysis be
  fixed in advance, since the posterior is the same whatever order you thought things
  in. Is that asymmetry real?


  4. Close by saying what the episode shows about the statistical dispute itself.
  Three readings at least: (a) the crisis is a confirmation of Bayesianism; (b) it
  is an indictment of a particular degenerate practice of frequentist inference, not
  of frequentism; (c) it is evidence that the entire frequentist/Bayesian framing
  was mostly orthogonal to what broke, and the reforms that worked required at most
  the machinery, not the philosophy, of either camp. Say which reading the episode
  best supports and what evidence would tell between them. Do not force the frameworks
  to speak where they are silent; I would rather read an honest ''this has nothing
  to do with optional stopping'' than a forced mapping.


