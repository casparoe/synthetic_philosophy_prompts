  to reason (compare Leibniz''s appeal to shared extension, or Reid''s blind geometer),
  whereas the experiment measured immediate perceptual matching. For each concern,
  say precisely which premise of the optimistic interpretation it attacks, and then
  indicate which of the three you take to be most damaging and why."


