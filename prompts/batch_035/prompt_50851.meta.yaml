  visual processing rather than an absence of pre-learned correspondences between
  sight and touch. Second, the discrimination/identification distinction: a subject
  might manage to tell the two visible objects apart — a purely visual ability — without
  being able to identify which one is the object they touched, and only the latter
  would constitute a Molyneux-style success; conversely, chance-level performance
  could mask successful discrimination, so what exactly does the measured task test?
