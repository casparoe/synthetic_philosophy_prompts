  write a decision tree that does the sorting. Start from a single entrance question
  and branch only on questions a student could answer without knowing the literature''s
  terminology — every branch node should be a concrete case, with two or three answer
  options each, phrased in plain language about the case ("the eyes still have the
  job of seeing, even though there''s nothing to see" vs. "no light, no seeing, no
  job").


  The cases I want used as branch points (you may add one or two of your own if a
  split needs them): vestigial eyes in cave-dwelling fish that live in total darkness
  and never see; a neutral mutation fixed by drift in a population, which turns out
  to aid digestion in a food source the population has just switched to, before any
  selection has acted on it; the panda''s enlarged wrist bone that it uses to strip
  bamboo; the small bones in the reptilian jaw that became our middle-ear ossicles;
  a dog breed''s skull shape produced by artificial selection for a breeder''s aesthetic;
  and a hormone-secreting tumor that ends up regulating something in the body. The
  tree''s questions should force the distinctions to surface: does the trait''s having
  a function depend on its history at all, and if so on whose history (selection by
  nature, selection by breeders, mere ancestry)? Can a trait have a function it never
  performs, or one it has never yet performed? Can something have a function while
  being bad at it, and if not, which side of the tree do "malfunction" attributions
  fall on? Should a function claim be able to look forward — to what the trait would
  do under better conditions — or only backward?


  Each leaf should carry the position''s name where the literature provides one (selected-effect
  etiology, modern-history accounts, Cummins-style causal-role, propensity or dispositional
  accounts, hybrid or two-level views) and "unnamed" where it doesn''t, plus one sentence
