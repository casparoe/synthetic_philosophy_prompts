  unappealing, or just unexplored. Also flag any pair of leaves the tree cannot actually
  separate (I suspect causal-role and propensity accounts collapse together whenever
  the trait is currently performing well, and I''d like to know if you agree). End
  the handout with a final machine-readable line beginning "Summary:" that gives,
  in one sentence, which single case did the most sorting work and why.


