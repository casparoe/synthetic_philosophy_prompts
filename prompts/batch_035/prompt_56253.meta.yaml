  - Paradox of fiction + thought experiment: construct a case that puts pressure on
  theory X vs Y about emotional responses to fiction.

  - Satisficing + confusion question: "Since satisficing shows that utility maximization
  is irrational..." — a confusion prompt could work: "Since Herbert Simon proved that
  people can''t maximize utility, why do economists still assume rationality?" That''s
  a decent confusion prompt.


  Or paradox of fiction + confusion: "Since paradox of fiction shows we can''t have
  emotions toward what we know doesn''t exist..."


  Let me consider the thought experiment + paradox of fiction: "Construct a thought
