  maybe "quietism."

  - Non-negotiable vs camp-preference marking.


  Inject new/niche ideas: e.g., a desideratum about "therapeutic transparency" — the
  elimination must be something ordinary speakers can be brought to accept without
  massive error about their past selves (memory access condition); or "graduated departure"
