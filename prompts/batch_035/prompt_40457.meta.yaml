  are ''multiples,'' made independently and more or less simultaneously, and that
  single, unique discoveries are rare. If most discoveries are made several times
  over, then the identity of the discoverer matters much less than we tend to think.
  The idea was ''in the air,'' as people say — once enough groundwork is laid, someone
  will make the final step.


  The Darwin and Wallace case shows this well. Wallace was a collector working in
  the Galapagos when he worked out natural selection, and he wrote to Darwin with
  an essay spelling out the idea. Darwin, who had been sitting on essentially the
  same theory for about twenty years, was spurred to go public, and their work was
  read jointly at the Linnean Society in 1858; Darwin then rushed the Origin of Species
  into print within weeks. If Wallace had died on his way home, we''d still have evolution
  by natural selection. So the discovery was going to happen regardless.


  It might be objected that we only notice the discoveries that did happen to be made
  twice — that we don''t hear about the ideas that were ''in the air'' and never landed
