  ---


  I am a PhD student in philosophy of physics, and my thesis concerns the status of
  probability in the Everett (many-worlds) interpretation of quantum mechanics. Next
  month our department hosts a visiting senior philosopher, one of the best-known
  contemporary defenders of Everett and, in particular, of the decision-theoretic
  resolution of the Born rule problem; I have been asked to moderate the Q&A following
  her colloquium. She is remarkably adept at turning away objections with the reply
  that, on her view, the Born rule is a theorem rather than an assumption, and I would
  like a battery of questions that makes that reply progressively harder to sustain.
  Please take the role of an experienced philosopher of physics who has moderated
  many research seminars, and think carefully before drafting: for each question,
  sketch internally the strongest reply the guest is most likely to give, and build
  in a follow-up keyed precisely to that reply.


  For context, since the questions should sit in the actual literature rather than
  the popularisations: the underlying worry is the incoherence problem — a deterministic
  theory in whose dynamics every outcome occurs seems to leave no room for probabilistic
  assertions at all. Her preferred answer runs through the Deutsch–Wallace theorem:
  if an agent''s preferences over acts in Everettian worlds obey a small set of rationality
  axioms (diachronic consistency, branching indifference, and their kin), then the
  agent is required to weight branches by their Hilbert-space measures, recovering
  the squared-amplitude rule as a theorem of decision theory. I want the questions
  to press where the literature presses. At minimum I would like one question on branch-counting,
  and whether the branching-indifference axiom is doing the work of ruling it out
  by fiat; one on the alternative Sebens–Carroll route via self-locating uncertainty
  and the epistemic separability principle, pressing whether ESP is an innocent methodological
  assumption or a disguised statement of the very intraworld independence the derivation
  was supposed to deliver; one on the gap between decision-theoretic norms and outright
  probability claims, including the option of retreating to a mere caring measure
  in the spirit of Hilary Greaves, and what such a retreat would cost the Everettian;
  and one drawing on the analogy with the Sleeping Beauty problem, asking whether
  indifference over self-locating possibilities can be assumed for fission cases without
  simply importing a contested answer to Beauty. I confess that I cannot decide whether
  the self-locating route is genuinely independent of the decision-theoretic one or
  merely the same argument in costume, and I would be grateful if one question were
  designed to expose whichever is the case.


  Please produce eight to ten questions in all, each preceded by a one-sentence rationale,
  ordered so that the questions escalate in difficulty. After the prose, provide a
  structured summary as a JSON array of objects with the following fields: "number"
  (integer), "theme" (short label), "presses" (the assumption or principle the question
  targets), "anticipated_reply" (one or two sentences), and "follow_up" (the follow-up
  question verbatim). Please write in British English throughout and avoid anything
  that presumes access to the literature beyond what I have described; the questions
  should be intelligible on their face to an audience of graduate students.


