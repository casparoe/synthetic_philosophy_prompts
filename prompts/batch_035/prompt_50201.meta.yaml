  of other actions (e.g., giving $1 to a campaign) dominates the whole vote. Also
  expressive voting (Brennan & Lomasky).


  Structure of the disagreement (few rounds, both decent):


  1. Grad student A (formal theory): voting is irrational — p is minuscule (~1 in
