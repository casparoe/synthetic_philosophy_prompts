  stay, death awaits in Damascus. CDT: K(A|go to Aleppo) — Death''s location is fixed;
  if you condition on the subjunctive "I go to Aleppo", Death''s location doesn''t
  change; if Death is in Damascus, going to Aleppo is good; if Death is in Aleppo,
  staying is good. CDT''s recommendation depends on the probability that Death is
  in Aleppo vs Damascus. Standard setup: the agent is confident (say 50/50? or more
  commonly, the agent is confident that Death will be where she said) — actually the
  standard setup: the agent knows Death''s prediction is accurate. If the agent is
  50% on Death being in each city, CDT says whichever city you go to, if Death is
  in the other one, you escape; so CDT recommends... the expected utility of going
  to Aleppo = P(Death in Damascus)·(survive) ... wait no. If Death is in Damascus
  and you go to Aleppo, you live. If Death is in Aleppo and you go to Aleppo, you
  die. So EU(go to Aleppo) under CDT = P(Death in Aleppo)·(die) + P(Death in Damascus)·(live).
  With 50/50 both options equal, and then there''s instability: whatever you''re about
  to do, you have evidence Death predicted you''d do it, so she''s there, so you want
  to switch — and the switch flips again. That''s the reswitching/instability. Actually
  with a perfectly reliable predictor and the agent knowing it, if the agent is confident
  she''ll choose Aleppo, then she expects Death to be in Aleppo, so staying looks
  better (causally: if I stay, I escape — no wait, causally, if I stay and Death is
  in Damascus, I die; the agent''s credence that Death is in Damascus rises when she''s
  inclined to stay...). The instability: if I''m disposed to go to Aleppo, my credence
  that Death is in Aleppo is high, so CDT favors staying; but once disposed to stay,
