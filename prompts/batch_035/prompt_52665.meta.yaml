  (or semiotics or whatever the right field is) has a name for it.


  When the Voyager team sent the golden record out, they etched instructions on the
  cover: here''s how fast to spin it, here''s what the pictures are. But those instructions
  were themselves a message that needed decoding — diagrams of a hydrogen atom and
  so on — and the only reason an alien could even start on them is that physics is
  the same out there and they''d already figured some of it out. So the "how to read
  this" layer of a message never gets delivered by the message itself, it gets bootstrapped
  off stuff the receiver brings. And there''s an even earlier layer: recognizing that
  the thing in your hands is a message at all, and not just a decorated frisbee.


  I noticed the same shape covering a totally different story. Deciphering Linear
  B (or any dead script) only worked because the decoders assumed the stuff was, like,
  palace accounting — that''s a guess about the frame that came before any reading.
  And when I look at a scan of my grandmother''s recipe card, half the actual content
  is stuff she never wrote down because she assumed I''d grown up in her kitchen.


