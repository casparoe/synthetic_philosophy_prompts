  want from AI systems is achievable: any objective we can write down omits something
  we care about, and the omission becomes exactly what the optimizer exploits. So
  the strategy of ''just specifying the true objective correctly'' is not available
  to us.


  Third, I believe human approval is a genuine exception to the second commitment.
  What we want from these systems is, at bottom, what (idealized, well-informed, consistent)
  human raters would endorse; approval ratings are therefore not a proxy standing
  in for a further target but constitute the target itself. This is why I think training
  models on human feedback — as in reinforcement learning from human approval — is
  categorically more secure than training on any hand-designed reward function.


