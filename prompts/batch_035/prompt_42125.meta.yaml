  Two friends of mine (one physics grad student, one philosophy PhD) had a long argument
  at a party about Bell''s theorem, and I lost the thread. Can you adjudicate move
  by move?


  (1) Dan (physics) said Bell''s theorem only rules out hidden variable theories,
  so standard quantum mechanics is untouched by it. (2) Maya (philosophy) said no
  — Bell''s derivation needs only locality, not hidden variables; the experiments
  violate the inequality, so any theory that''s local in Bell''s sense is dead, and
  since collapse in standard QM acts instantaneously at a distance, standard QM is
  nonlocal anyway, so Bell agrees with it rather than threatening it. (3) Dan said
  the collapse "happening" at a distance is just an update of information, like a
  detective updating who committed the crime — no spooky action. (4) Maya said that
  comparison only works for correlations you can explain by a common cause, and Bell''s
  theorem is exactly the proof that the quantum correlations can''t be explained that
  way, so the "information update" story is doing work it can''t do. (5) Dan then
  said fine, but if you go Everett — many worlds, no collapse — the whole theory is
  local, so locality isn''t dead either. (6) Maya said many-worlds people claim locality
  but there''s a serious fight about that, and anyway the theory has to pay for it
  elsewhere (with probabilities).


  Also at some point Dan muttered that if you don''t like any of this you can deny
  the experimenters'' choices were free (superdeterminism), and Maya said that was
  cheating and unfalsifiable, and neither elaborated.


  Please rate each of the six moves from clearly mistaken to clearly right, with brief
  reasons. And since you can''t check anything: where the experts themselves still
  disagree — e.g. about whether Everett is really local, or about what exactly "locality"
  should mean after Bell — please flag it as contested rather than presenting one
  side as the consensus. I want to know which parts are settled physics/philosophy
  and which are live fights.


