  church disciplinary records, diaries, and sumptuary regulation are traces of the
  value system produced for internal religious reasons, before and independent of
  the outcome they are asked to explain. She also pressed a counterfactual: take the
  same geography, law, and trade routes but Catholic confessional culture, and she
