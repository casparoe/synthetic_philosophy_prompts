  Ilana opened by defending a strong reading of the thesis: Calvinist doctrine — predestination
  above all — produced a distinctive anxiety about salvation that had no sacramental
  outlet, which got channeled into disciplined labor, methodical conduct, and deferred
  consumption, and that bundle of dispositions helped make northwest Europe''s commercial
  culture. She said the regional pattern is the evidence: Protestant cantons and Catholic
  cantons of Switzerland sitting side by side with similar terrain and institutions,
  diverging in proto-industrial development, is as close to a controlled comparison
  as history offers.


