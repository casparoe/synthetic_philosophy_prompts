  we infer them from the very behavior they are supposed to explain. The thrifty shopkeeper
  is taken as evidence of a thrifty ethic, which then explains the thrift. Unless
  values are measured independently of outcomes — and he doubted sermon collections
  and catechisms could carry that weight, since clergy in commercial cities had every
  incentive to preach what their audiences practiced — the "explanation" is a redescription.


