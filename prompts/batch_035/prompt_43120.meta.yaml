  I''m on my school''s debate team, and this quarter''s resolution is about whether
  institutions of global aid are morally justified. In preparation I''ve been reading
  about karma as a theory of moral desert, and my debate partner has constructed an
  argument that, if it works, seems to settle the resolution in the negative — which
  is exactly why I distrust it. He lays it out like this:


  (1) Karma, understood as a theory of moral desert, holds that a person''s condition
  — illness, poverty, grief — is not brute luck but the ripened consequence of that
  person''s own past actions, in this life or earlier ones. What befalls you is, at
  bottom, what you have earned.

  (2) To say that someone deserves a suffering is to say that the suffering is owed
  to them as a matter of justice — not merely permitted, but required by desert, the
  way a sentence is owed to a convicted criminal.

  (3) If a suffering is owed as a matter of justice, then preventing it is interfering
  with justice, and interfering with justice is pro tanto wrong.

  (4) Therefore, on karma, medicine, famine relief, and even the small everyday compassion
  of comforting a grieving friend are pro tanto wrong.

  (5) But these are among the least deniable goods we know; comforting a friend in
  grief is not even slightly wrong.

  (6) So karma, as a theory of moral desert, is false.


  I''ll admit that (4) and (5) sit very strangely together, and my instinct is that
  the argument proves too much... Actually the student should say which they''d rather
  keep.


  Then: When I raised an objection at our practice round, our coach offered the reply
  that a defender of karma can say that compassionate action itself generates good
  karma, so relieving suffering is not interfering with the ledger but adding to it.
  But I can''t tell whether that''s a genuine answer or just relabeling: if the universe
  owes the sick their sickness, then my comforting them earns me credit for tampering
  with what justice required — like being paid a bounty for springing prisoners. Or
  is that analogy itself confused, since there''s no court, no law, and no administrator
  being tampered with?


  I want to know: which premise should I reject, and what does rejecting it cost?
  I''d most like to keep (5), and I''d like to keep (1) too if that''s possible, since
  without (1) karma stops being a theory of moral desert and becomes a mere claim
  that actions have consequences — which even a skeptic about desert would accept.
  Please be specific about which step is weakest and why it looked fine to us.


