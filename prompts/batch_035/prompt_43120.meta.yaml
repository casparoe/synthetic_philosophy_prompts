  Argument:

  (1) Karma, as a theory of moral desert, says that a person''s condition — health,
  wealth, suffering — is not random or unfair but proportioned to the moral quality
  of their past actions (in this or previous lives).

  (2) If a suffering is deserved, then the world is, morally speaking, better with
  that suffering in it than without it — suffering the deserved is part of justice.

  (3) If the world is morally better with someone''s suffering in it, then relieving
  that suffering makes the world worse, i.e., is pro tanto wrong.

  (4) So on karma, medicine, disaster relief, and simple compassion are pro tanto
  wrong.

  (5) But they''re plainly right — relieving suffering is one of the least deniable
  goods.

  (6) Therefore karma, as a theory of moral desert, is false.


