  ---


  I''m preparing a one-page statement of my views on the Church–Turing thesis for
  a seminar on the philosophy of computation, so that the others can press on it.
  Here is roughly where I''ve landed:


  (1) The original thesis — that a function is effectively calculable iff it is computable
  by a Turing machine — is not an empirical hypothesis about the world but a conceptual
  analysis. No possible discovery about machines could show it false; at most a discovery
  could show the analysis is a bad one, the way botanists abandoned a definition of
  "fish" that included whales.


  (2) What justifies accepting it is what happened in the 1930s: several independently
  proposed formalisms — Turing''s machines, Church''s λ-calculus, Herbrand–Gödel recursion,
  Post''s systems — turned out to demarcate the same class of functions, and Turing
  supplied an analysis of a human clerk working by rote that matches the machines.
  That convergence is why we believe the thesis, and I think it is a perfectly good
  epistemic route to it.


  (3) The physical thesis — that no device constructible in accordance with physical
  law can compute a non-recursive function — is a different claim, not settled by
  (1), and it is empirical: it can be refuted by physics, and I think it is currently
  open.


  (4) Quantum computation poses no threat to it: whatever a quantum computer can do,
  Shor''s algorithm and all the rest, stays inside the recursively computable. On
  this point I regard the matter as closed.


  (5) So-called analog hypercomputation — machines that read a non-computable answer
  off infinitely precise initial conditions, or off a physical constant into which
  someone has encoded the halting problem — is not computation at all, and I dismiss
  it. A device whose "result" was written into its initial state computes nothing,
  and infinite precision is not something physics supplies.


  (6) Malament–Hogarth spacetimes, by contrast — general-relativistic set-ups in which
  an observer, ageing only a finite amount themselves, can receive a signal sent from
  the end of a computation that runs forever along another worldline — seem to me
  a genuine live threat: general relativity as standardly formulated appears to permit
  them, so if they are physically realisable, the physical thesis is refuted. My own
  expectation is that the physical thesis survives, because a theory of quantum gravity
  will in the end rule such spacetimes out.


