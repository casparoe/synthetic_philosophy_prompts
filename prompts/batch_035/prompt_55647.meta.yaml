  Question text:


  "In mechanistic anomaly detection, a detector is trained on inputs assumed to be
  benign, and flags inputs on which the network appears to run ''different mechanisms''
  than those exercised on the training set. Critics argue this presupposes a criterion
  for when two inputs engage the same mechanism, which the field lacks. Explain this
  circularity worry, explain why behavioural similarity between two inputs is not
  sufficient for mechanistic similarity, and discuss whether the standard reply—that
  mechanisms can be individuated functionally, by the role they play in the network''s
  overall computation—escapes the problem. Illustrate with the case of a model with
  a backdoor."


  Student answer (write ~300 words): "Mechanistic anomaly detection tries to catch
  harmful inputs by looking at the model''s internals rather than its outputs... The
  circularity worry is that ''anomaly'' is only defined relative to the detector''s
  own training distribution, which was labelled benign by assumption; so the method
  can''t tell us that the flagged input is processed by a different mechanism, only
  that it is unusual relative to benign data. This is right in part. But: ''the worry
  assumes what it sets out to prove'' — hmm.


  Student answer sketch:

  - Defines MAD correctly: train probes/representations on benign data, flag activation-pattern
  anomalies.

  - Circularity: says the worry is that we need an independent notion of mechanism,
  and the field uses "mechanism" to mean whatever the detector detects, so the guarantee
  is conditional.

  - Behavioural insufficiency: gives an example — two inputs both classified correctly...
