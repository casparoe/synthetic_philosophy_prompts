  ---


  Please argue for the following position, and defend it as your own rather than presenting
  it as one option among many:


  The Allais paradox does not refute the independence axiom of expected utility theory.
  What it refutes is a tacit convention about how outcomes are individuated — namely,
  that outcomes are to be described solely by the agent''s final wealth or consumption,
  so that "$0" in one gamble names the very same outcome as "$0" in another. Once
  outcomes are individuated more finely — so that getting nothing when a sure million
  was on the table counts as a different outcome (one involving a specific kind of
  regret or counterfactual awareness) than getting nothing when the million was never
  available — the standard Allais preferences can be made consistent with independence.
  On this view, Allais is a discovery about the limits of the coarse individuation
  convention, not about the rationality of separability.


  Your argument should do three things:


  1. Show how the rehabilitation works mechanically: using the common-consequence
  form of the paradox (state the payoffs yourself, precisely, so the reader can verify
  the arithmetic), explain how regret-sensitive individuation restores independence-compatibility,
  and say exactly what constraint the resulting utility function must satisfy.


  2. Answer the standard objection that this move makes expected utility theory unfalsifiable
  — that any violation can be redescribed away by slicing outcomes finely enough.
  Take a definite stand: propose a principled constraint on permissible individuation
  (for example: an outcome''s description may not mention the probabilities of the
  gamble it occurs in, and must be fixed once and use across all choices), and show
  that the constraint both blocks the unfalsifiability charge and is strong enough
  that some imaginable preference patterns would still come out irrational.


  3. Take a definite side on whether, after the rehabilitation, the independence axiom
  still earns its normative authority — or whether the individuation move, once conceded,
  leaves so much slack that separability no longer constrains anyone''s choices in
  practice. If you conclude the rehabilitation succeeds, say what expected utility
  theory now claims that could be false; if you conclude it fails, say precisely where
  the argument of part 1 breaks.


  Be committed: this is not a survey. If the position needs qualification or retreat
  at some point, say where and why, but do not end by leaving the verdict to the reader.
  No citations are needed; assume the reader knows expected utility theory at the
  level of an advanced undergraduate.


