  7. Binding. Someone offers to sell me, in advance, a commitment that will override
  my Saturday preference for goofing off (a locked study, a paid forfeit, whatever).
  I buy it. Verdict: obviously fine, and in fact smart. Paying to constrain your future
  self is not being pumped.


  So: is there a principle that gets all seven? Candidates I''ve half-formed myself,
