  with a quick brainstorm of candidate principles before committing to one, and tell
  me when my verdicts are just inconsistent — I''d rather lose a verdict than be flattered.


  Here''s the deal: I''ve been reading about money pump arguments and diachronic rationality,
  and I have a bunch of gut verdicts about whether an agent is irrational in various
  sequential-choice situations. I want to know if there''s one principle that captures
  them, and I suspect there isn''t, but let''s see.


  The cases (all involve one agent, a sequence of choices, and sometimes a broker
  who offers trades):


  1. Classic pump. My preferences over three options A, B, C are pairwise: A > B,
  B > C, C > A. The broker offers me B for A plus a dollar, then C for B plus a dollar,
  then A for C plus a dollar. I take each trade as it comes, and end up back with
  A, minus three dollars. Verdict: clearly irrational. No hesitation there.


  2. Same cycle, but I see the whole setup coming. The broker''s whole scheme is transparent
  to me at the start. Verdict: still irrational, though maybe in a different way?
  Like the problem is the intransitivity itself, not the loss — the pump is just a
  demonstration of it.


  3. Same cycle, but this time I know about the pump and there''s no broker — I just
  drift between options on my own, choosing at each moment what I prefer then, and
  never getting anywhere. It''s the intransitive version of rearranging your furniture
  forever. Verdict: irrational, but less obviously so than 1. The lack of an exploit
  doesn''t seem to make it OK.


  4. Taste change. Before a vacation I pick the hiking trip over the beach resort.
  Once I''m on the hike I genuinely prefer the beach — my preferences changed, not
  cyclically, just over time — and I pay a fee to switch. No broker, no loop; the
  change is one-directional. Verdict: fine. Not irrational at all. That''s just being
  a person whose tastes develop. Even though someone (the resort) profits from my
  changeability, there''s no pump.


  5. Akrasia version. Friday me plans to write all Saturday and prefers (then) that
