  to visitors, has a documented policy of replacing any deceased zebra with a painted
  mule rather than admitting the loss, but they''ve never had to do it and the paint
  job is always detectable under proper lighting. A visitor glances at a zebra in
  the shade and forms the belief ''that''s a zebra''. Intuitively they know it''s
  a zebra; on tracking, whether they know depends on the nearest worlds where it''s
  a mule — and the park''s policy makes those worlds worryingly close. Weigh the abominable
  conjunction objection (''I know it''s a zebra, but I don''t know it''s not a painted
  mule'') against the arguments for denying closure (e.g. that skepticism follows
  from closure plus the failure to know not-a-BIV). Consider whether some restricted
