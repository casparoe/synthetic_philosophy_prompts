  "Write an essay on whether Nozick''s tracking theory of knowledge can survive its
  denial of epistemic closure. Quick setup so we''re on the same page: on the tracking
  view, you know that p roughly when you''d believe p if it were true and wouldn''t
  believe it if it were false. That gets you knowledge in ordinary cases but breaks
  closure: you can know you''re looking at a zebra, and know that a zebra entails
  not-a-cleverly-painted-mule, yet fail to know it''s not a painted mule (because
  if it were one, you''d still believe zebra — so the belief doesn''t track not-painted-mule).
