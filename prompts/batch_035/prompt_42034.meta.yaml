  survives, and whether a better analogy exists (public utility? fire service?).


  Alternatively the fire-service analogy on the other side: healthcare is like firefighting
  — nobody shops for fire departments — used to support universal provision. Ask to
  audit that. Could do both analogies like the wild animal example (which audits two).
  But keep prompt short-ish. Maybe focus on one analogy with the asker being a software
  engineer who leans libertarian-ish.


  Type: analogy audit. Casual tone, software engineer perspective, a typo or two allowed.


  I''ll write from knowledge — no quotes, no real attributions needed. Maybe mention
