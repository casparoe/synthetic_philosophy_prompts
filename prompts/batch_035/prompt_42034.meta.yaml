  The analogy: buying healthcare is like buying any other complicated consumer product
  — like buying a laptop or a car — you read reviews, compare prices, and competition
  drives quality up and prices down. Used to argue that market-based medicine with
  price transparency + HSAs would work if we just got government out of the way. Audit
