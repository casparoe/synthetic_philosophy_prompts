  - Coherence arguments + analogy: the "money pump / Dutch book as a casino" — maybe
  less natural.


  - Moral luck + analogy: "drunk driver is like a drunk driver who kills someone"
  — the analogy between the lucky and unlucky driver is actually the core of moral
  luck. That could work: "people say the two drivers are in the same position as each
  other except luck" — but that''s more a comparison than an analogy.


  The healthcare one works well. Common analogy: defenders of market-based medicine
  say buying healthcare is like buying any other consumer good — comparing prices,
  reading reviews like buying a TV or a car. Opponents say healthcare is more like
  a fire department or like a hostage negotiation ("your money or your life"). Actually
