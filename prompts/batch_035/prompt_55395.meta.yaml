  Draft:


  "I''m a PhD student in intellectual history, writing a chapter on how the Victorian
  realist novel handles religious loss, and I want to use Silas Marner as my central
  text but I''m not sure how far the Feuerbachian reading actually goes. Background
  assumption I''m working with: Eliot translated The Essence of Christianity in the
  early 1850s, and Feuerbach''s claim that theological predicates are really human
  predicates misattributed to a divine subject is, roughly, the religion of humanity
  in one sentence. So on that reading Silas Marner is a controlled experiment: strip
  a man of his religious community through a betrayal, give him money-worship as the
  pure distillation of projection onto the wrong object, then replace both with Eppie
  — the actual human referent that was hiding behind the symbol all along. The hearth,
  the golden hair against the gold on the floor, the way his cateleptic fits stop
  mattering to anyone once someone loves him, all of that looks designed to make the
  point.


  But then there are scenes that resist it, and I''d like a reading that takes them
  as seriously as the ones that fit. The drawing of lots at Lantern Yard isn''t a
  case of projection — it''s an epistemic procedure that fails publicly and ruins
  him, and the novel seems to care about the procedural injustice as much as the metaphysics.
  And near the end, when Silas and Eppie go back to Lantern Yard and find it bulldozed
  into a factory with no record and no one left who can answer for what was done to
  him, Silas doesn''t draw the Feuerbachian conclusion — he lands on something more
  like a modest theism, saying there''s a goodness and truth in the world above what
  he can see the ends of (or something close to that, I don''t have my copy to hand).
  So my question: does the novel dramatize Feuerbach, complicate him, or quietly disagree
  with him? Does Eppie-as-sacrament work as more than a sentimental substitution,
  i.e. does the novel show what the human predicates cost or why the misattribution
  ever happened in the first place? And is there something the novel gets at about
  lived religion — the drawing of lots, the fits, the community''s need for an external
  verdict — that Feuerbach''s argument just misses? I''d rather end the chapter saying
  what the novel adds to the debate than that it illustrates it, so tell me honestly
  where my reading is forcing things."


