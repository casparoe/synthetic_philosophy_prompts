  Causation by omission + proves-too-much argument: classic argument: (1) an omission
  is a cause only if there''s a norm (default) specifying what should happen; but
  then anything can be a cause by choosing norms... or the counterfactual: (2) if
  I hadn''t existed, the gardener would not have watered... Actually the classic problem:
  omission causation via counterfactuals leads to too many causes — "the gardener''s
  not watering caused the plant''s death"; but also "the queen''s not watering caused
  it" — but we want to say only the gardener''s failure counts. The "proves too much"
  argument could be: if omissions cause, then everyone who didn''t prevent some bad
  event caused it — so we all caused the starvation of millions. Or the norm-based
  solution proves too much: norms are arbitrary.


