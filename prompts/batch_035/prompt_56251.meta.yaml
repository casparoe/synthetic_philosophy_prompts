  ---


  I am a PhD student in philosophy of medicine writing a thesis on the concepts of
  health and disease, and I serve as the graduate student member of a regional advisory
  panel that recommends to our statutory health insurer which treatments to cover.
  Our enabling statute ties coverage to disease: a treatment is eligible only if it
  addresses a disease, or a condition whose burden on the person affected is comparable
  to that of a disease. The case now before us is misophonia — a condition in which
  particular everyday sounds, most often other people''s chewing, breathing, or tapping,
  trigger an intense, quasi-phobic reaction of rage or panic, often followed by shame.
  Affected patients describe restructuring their whole lives around avoiding trigger
  sounds: eating every meal alone, wearing earplugs or headphones at family dinners,
  changing jobs to escape open-plan offices. A patient association has petitioned
  for coverage of two things: specialist psychological therapy (currently delivered
  privately and expensively) and audiological assessment for sound-sensitivity. The
  association''s petition has forced the panel to say what misophonia is, and the
  panel is split in a way I recognize from the literature I work on.


  The clinicians'' bloc says the question is whether something in the person is malfunctioning.
  On their view, a disease is a part or process failing to perform its biological
  function, as judged by reference to how the organism is designed to work; by that
  standard they ask whether there is any evidence of an auditory or auditory-emotional
  pathway doing something it should not do, as distinct from an ordinary strong dislike,
  continuous with annoyance, just more intense. They note that no exam finding, imaging
  finding, or agreed physiological marker separates misophonia from ordinary sound
  irritation, and they worry that if intensity of suffering plus life disruption is
  enough, then grief, homesickness, and the misery of unemployment become diseases
  too, with the bill to follow. The public-health bloc replies that the relevant question
  is harm: what the condition does to lives. They point out that insomnia, also without
  a lesion, has its own codes and is treated; that disease classifications have historically
  expanded when the impairments were real, as with the eventual recognition of conditions
  long dismissed as character faults or mere complaints; and that a definition under
  which people who cannot sit at dinner with their children, for years, are not ill
  unless a lesion turns up has its priorities inverted. A third member floats a compromise:
  cover the psychological therapy only, on the model of covering treatment for distress,
  while declining to say whether misophonia is a disease; a fourth thinks the honest
  answer is that the statute''s phrase about comparable burden was written precisely
  for cases like this and we should say so.


  I have been asked to draft the memorandum the panel will debate at its meeting in
  three weeks, because my thesis is on this terrain and the chair wants a document
  that is more than a tally of intuitions. Please draft it. It should recommend one
  concrete course of action — refuse, grant in full, or grant with conditions and
  a named review date — and it must give the strongest consideration on the losing
  side a fair hearing rather than a paragraph of dismissal. It cannot settle the matter
  by declaring that disease is a family-resemblance concept or that the question is
  merely conventional: the insurer needs a line it can apply to the next petition,
  and if the memo''s reasoning yields no general lesson, it should say so honestly
  and explain why this case still comes out the way it does.


