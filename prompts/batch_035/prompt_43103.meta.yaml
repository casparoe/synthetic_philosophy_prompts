  I''m putting together a "which species concept do you actually use?" quiz for the
  grad students in our biodiversity lab — half of them say "biological species concept"
  when asked, but then go and sort everything by appearance in their day-to-day work.
  So the quiz has to sort them by what they''d say about cases, not by which label
  they like.


  Please write eight questions. Each question is a concrete case, with two or three
  answer options that each point somewhere in the logical space without naming it
  — e.g. one case could be a putative ring species where the ends of the ring no longer
  interbreed, and another could be an all-female asexual lineage that''s been separate
  for millions of years. Use at least: a case where interbreeding and morphology disagree,
  a case about asexuals, a case about a lineage splitting in the fossil record where
