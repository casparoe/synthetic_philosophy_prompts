  I''m a PhD student in environmental economics, and a routine feature of my work
  keeps snagging on something no one in my department treats as a question. When regulators
  appraise a climate policy, they compress all future damages from an added ton of
  CO2 into a single number — the social cost of carbon — and compare it to the cost
  of abatement. Producing that number requires three steps, each of which looks philosophically
  loaded. First, harms are monetized through willingness-to-pay, which means a death
  in a poor region counts for less than a death in a rich one, simply because the
  victims have less money. Second, the damages are discounted: future harms count
  for less than present ones, at a rate assembled from a pure preference for the present,
  an aversion to consumption inequality across generations, and a projection of future
  growth. Third, the analysis is distribution-blind: it licenses a policy if the winners
  could in principle compensate the losers, though in practice no compensation account
  is ever set up. And there is a wrinkle that puzzles me most: the same model discounts
  future harms because it projects that future people will be richer, and then warns
  of damages so deep they would make future people much poorer — the optimism that
  shrinks the number and the catastrophe that inflates it are both inside it at once.


