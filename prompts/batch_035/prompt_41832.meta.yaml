  what it assumes welfare is, such that it can be converted to money, summed across
  persons, and averaged over uncertain futures; whether the discounting step presupposes
  that future people count for less than we do, or whether it is something a view
  that grants them full equal status could still accept, as a reflection of risk or
  of their (anticipated) greater wealth; and whether the compensation test presupposes
  that the distribution of benefits and burdens doesn''t matter intrinsically, or
  whether a theorist who does care about equality could still license the practice
