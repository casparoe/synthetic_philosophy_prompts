  that will have a worse life than a child she could have later — the "Proabortionism"
  argument from Parfit/Kavka, discussed by Elizabeth Harman and Melinda Roberts).
  That''s a nice in-the-weeds angle: the asymmetry between cases where the person
  exists in both outcomes vs only one.


  So the disagreement: Colleague A (defends asymmetry) says: the intuition that it''s
  wrong to conceive a child you know will have a painful, short life, but not obligatory
  to conceive a child you know will have a great life, is the bedrock and theories
  should answer to it. Colleague B pushes: the asymmetry can''t distinguish between
