  comparing existence to existence — so it''s not "existence vs no existence" doing
  the work. Then B says: fine, but now notice the mirror: if the child conceived earlier
  would have a better life, we think it''s at least somewhat good/better, which suggests
  creating happy lives does count as good — contradicting the asymmetry. Hmm, actually
  the proabortionism argument: it''s wrong for the girl to conceive now (worse-off
