reasoning_summary: 'Let me pick a domain and type. Cause prioritization frameworks
  (ITN) with the "report verdicts on cases, ask for principle" type could work well
  — the asker gives gut verdicts on which causes are higher priority, and asks what
  framework captures them. That allows injecting niche ideas (new cases) while remaining
  answerable without web access.


  Alternatively, political obligation with verdicts-on-cases type. Or Kant''s lying
  with cases. But the example already uses murderer at the door style cases for lying...
  the first example is literally about lying verdicts. Avoid overlap.


  ITN framework with verdicts on cases: The asker gives cases where their gut disagrees
  with the ITN formula — e.g., a cause that scores well on the formula but seems less
  important; a cause that''s important and tractable but not neglected... and asks
  what principle captures their verdicts. This fits nicely and is in the weeds but
  not requiring memorized trivia.


  Let me design cases:


  - Neglectedness inversion: a cause that scores terribly on neglectedness because
  tons of money is already flowing, yet they think it''s still top priority — e.g.,
  a disease affecting the global poor that already receives billions in funding but
  where spending is still wildly cost-effective. (e.g., malaria vs. some obscure disease)

  - Fungibility: "importance" for very long-run effects — e.g., risks of extinction
  where expected value is dominated by tiny probabilities of enormous stakes.

  - Case where tractability is high, importance high, neglectedness high, but the
  cause is wrong — e.g., promoting some harmless-but-pointless intervention (a cause
  that is important, neglected, tractable, but the specific intervention doesn''t
  work — like a charity that''s effective per dollar but only because it''s tiny...
  the "headroom" problem).

  - The "small pond" issue: tiny causes with minuscule absolute importance but enormous
  neglectedness and tractability — e.g., preserving a rare dialect vs. AI safety.

  - Case of diminishing returns / crowding: a cause where more funding actually damages
  it (grassroots movements getting too much money).

  - Two pairs hard to reconcile: they think the framework''s arithmetic favors X but
  their gut says Y.


  Also inject a niche-ish idea: maybe the asker proposes a tentative repair — replace
  "neglectedness" with "marginal impact per additional unit of resources" — and asks
  it to be tested.


  Structure:


  "I''ve been running gut verdicts on cause prioritization... When ITN says X, I agree;
  but here are cases where my gut and the arithmetic come apart." Then list ~6 verdicts,
  including at least one hard-to-reconcile pair. Ask for a principle, stated precisely,
  with the case motivating each clause, verdicts on unlisted cases, and which of my
  verdicts it must overturn. Include role assignment: "You are a decision theorist
  / effective altruism researcher..." and prompt engineering text: "think carefully,
  brainstorm first."


  Cases, concretely:


  1. Malaria: billions flow in, so neglectedness is low; yet I''d still rank additional
  spending on malaria nets above spending on a cause with a tiny budget but tiny stakes
  — a rare genetic disease affecting a few hundred people worldwide. My verdict: the
  formula''s neglectedness weighting tempts you toward the rare disease; my gut says
  bednets. (Importance can overwhelm neglectedness.)


  2. Asteroid deflection: highly important (extinction-level), quite tractable (we
  know how to track them), but... actually it''s now largely funded — my verdict:
  still worth completing, even though neglectedness near zero once funded, because
  there''s a discrete threshold: after we''ve catalogued all the big ones, dropping
  further money is near worthless. The "done-ness" of causes — bucket filling.


  3. AI safety: my gut says top priority even though tractability is a mess and we
  can''t measure progress — tractability-as-felt doesn''t seem to matter here. But
  then a cause like "reforming academic peer review" — important, neglected, and I
  genuinely think progress is possible, but I rank it low. Tension between case 3''s
  disregard for tractability and this.


  4. A cause that is important, neglected, tractable, but where acting makes things
  worse because attention is itself harmful — e.g., raising awareness of a geopolitical
  flashpoint where lobbying for attention increases the risk of the bad outcome (maybe
  a biorisk example or mentioning a territorial dispute... keep generic: "publicizing
  a dangerous research technique to get it regulated"). Verdict: not a priority despite
  scoring well — because advocacy raises the risk.


  5. Two causes with identical scores but where one has a steep first-dollar curve
  and the other has a cliff only after a threshold (lobbying for a policy change needs
  a critical mass). Gut: threshold causes feel riskier/less attractive, or more? Say:
  I''d put the smooth one higher, though ITN treats them the same.


  6. The asker''s own history: my gut tracks "how much would the world change if this
  went well" more than "how many are affected" — a cause affecting few people but
  changing the trajectory of the future ranks above one affecting many in a fixed
  way.


  Hard-to-reconcile pair: gut ranking AI safety high despite admitting tractability
