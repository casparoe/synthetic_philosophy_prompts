  so quick background: I''m a grad student who got drafted to facilitate an adversarial
  collaboration between two faculty in our department who have been arguing about
  the same thing for years. One of them — call him the transitivist — thinks ''better
  than'' (for welfare outcomes) behaves structurally like ''longer than'': transitive
  as a matter of the logic of comparatives, so if A is better than B and B better
  than C, it''s just not an open question whether A is better than C. The other —
  the spectrum person — thinks the spectrum arguments show transitivity fails, at
  least for welfare: line up outcomes where each differs from the next by a barely-perceptible
  increment (a headache one minute longer, or just barely more intense, each step
  clearly better than the one below it), and the endpoints are, say, a five-minute
  mild headache versus weeks of severe pain. Each step better than the last, yet comparing
  the endpoints directly, she says anyone sane says they''re indifferent or even gets
  the ordering backwards. She''s also fond of the just-noticeable-difference analogy
  from psychophysics: indifference looks like a JND relation, and JND relations are
  intransitive by construction.


  They''ve agreed to keep population ethics out of it — everything is about one person''s
  lifetime welfare, no adding people. And they''ve agreed on the format in advance,
  which is where you come in.


  Write the joint statement I''ll circulate to both of them. It should have:


  1. A numbered section of claims both could actually sign — not vacuous ones, and
  not ones where the wording secretly favors one side. The hard one, they tell me,
  is any claim about the trichotomy assumption (that for any two outcomes exactly
  one of better / worse / indifferent holds), because each side thinks the other''s
  whole position quietly leans on it. Try anyway; if a formulation only works by watering
  it down to nothing, say so rather than pretend.


  2. A disagreements table: the precise statements of where they differ, each phrased
  so its own side would accept the wording. Include at least: what ''better than''
  means (comparative like ''longer than'' vs. something more like perceptual comparison),
  what the spectrum cases actually demonstrate, and whether intransitive indifference
  is coherent or just noise in the word ''indifferent''.


  3. The cruxes — the sub-questions such that settling one would move at least one
  of them — and for each crux a concrete case both would agree bears on it, with each
  side''s prediction written down in advance. The headache ladder is the obvious test
  case; I''d like at least one more they haven''t already flogged to death, maybe
  something where the transitivist''s prediction and the spectrum person''s prediction
  come apart in an observable way (what a careful judge would say when comparing non-adjacent
  items, whether reversing the order of presentation changes anything, that kind of
