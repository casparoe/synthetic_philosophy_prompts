  is even running, because their track record doesn''t pin it down.


  Their verdicts so far:


  1. Approved upzoning a commercial arterial from 2 stories to 6, over objections
  from the business association, because it''s by the light rail station.

  2. Approved ADUs (backyard cottages, up to 2 units) citywide with basically no fight.

  3. Rejected a 5-story, 80-unit apartment building that would''ve replaced two houses
  on the edge of a single-family neighborhood. Reasons given: parking, shadow on the
  adjacent yard, "character of the area." Organized neighbor opposition, like 40 people
  in matching shirts.

  4. Approved a 200-unit mixed-use tower downtown after the developer agreed to 15%
  below-market units and funded a crosswalk study.

  5. Rejected converting the municipal golf course to housing, 6-0. Open space, no
  organized neighbors even, just the parks commission being mad.

  6. Approved a homeless shelter with 60 beds in a light industrial zone, over scattered
  opposition, because "there''s nowhere else zoned for it."


  New case: a church wants to build 70 units of affordable housing on its own surface
  parking lot. The lot is in a single-family zone (churches get weird zoning), a block
  from the arterial, no transit station nearby. Church leadership is all in, the units
  are income-restricted at 60% AMI, and the neighbors have organized — yard signs,
  a petition, the whole thing, arguing the building is out of character and will make
  parking worse.


  What''s the council going to do, and more importantly, what rule are they running?
  I can see at least three that fit the record: (i) transit/proximity principle —
  density goes where the stations and arterials are, single-family interiors are off
  limits; (ii) incumbent veto principle — they approve what organized residents don''t
  block and the golf course was just open space sentiment (hmm, but the shelter had
  opposition too); (iii) concessions principle — approve big projects when they extract
  something (affordability, community benefit). The church case is affordable AND
  in a single-family interior AND faces organized opposition, so the rules point different
  directions. Give me your best guess with reasoning, tell me which precedent is the
  closest analog and why, and then design the hypothetical next case that would best
  distinguish the rules — like, if they approved a market-rate project in a single-family
