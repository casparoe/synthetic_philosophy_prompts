  David Lewis''s classic line, reply that Tim can kill Grandfather in the ordinary
  sense — he has the rifle, the skill, the clear shot, nothing in his vicinity prevents
  it — and simply doesn''t, because the fact that Grandfather died in his bed in 1957
  is not something Tim can alter. The stalemate itself is familiar; what has started
  to worry me is a third strand: a probabilist in the group keeps pressing a Horwich-style
  point that even if no contradiction follows from one trip, a world with backward
  travel and many would-be assassins would be infested with unexplained coincidences
