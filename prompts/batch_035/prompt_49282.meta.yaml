  Subtle errors to embed:

  1. "The universe splits whenever a quantum event occurs" — reification of "splitting"
  as a physical event, and worlds are not well-defined countable discrete things;
  branching is not per-event clean splits; also puts the splitting in the theory when
  Everett''s ontology is just the universal wavefunction evolving unitarily — splitting
  is emergent/derived via decoherence, not an extra postulate.

  2. "Decoherence explains why we don''t see the other branches" — decoherence explains
