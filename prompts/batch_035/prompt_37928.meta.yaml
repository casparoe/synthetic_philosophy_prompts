  through commitment (Chang-style, but don''t cite by name to keep it accessible —
  actually could reference "a philosopher I profiled once argued that in hard choices
  we put ourselves behind an option" — better to keep vague). The other: a decision
  theorist who thinks everything can be compared with enough care — trade-offs, shadow
  prices, "everything has its price."


  Setting: a pub after a conference on urban planning? Or the journalist wants the
  dialogue for an article. E.g., "I''m working on a feature about a fight over a small
