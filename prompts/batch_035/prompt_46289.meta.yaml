  Here is the practice that puzzles me. In the United States, a company that wants
  to market a new food additive must, before selling anything, convince the FDA that
  the substance is safe — the burden of proof sits on the proponent, and absence of
  evidence of harm is treated as a reason to hold off, not to proceed. A 1958 provision
  goes further: if a substance causes cancer in humans or animals when tested as a
  pure dose, it may not be approved as a food additive at any level of exposure, however
  tiny — no dose is low enough. New prescription drugs face the same shape: nothing
  reaches patients until the manufacturer has affirmatively demonstrated safety and
  efficacy. Yet the same legal system, in the same domain of ingestible products,
  treats dietary supplements under a nearly opposite default: a supplement can go
  to market without any premarket safety review, and the burden falls on the agency
  to prove harm before it can act. Something similar happens across the Atlantic,
  where European food law names precaution as a principle and the chemicals regime
  requires manufacturers to generate safety data before market access, while products
  that were already in use when the rules arrived are typically presumed acceptable.


  So my questions. First, what epistemology of evidence does this pattern presuppose?
  The regime seems to treat long familiarity as if it were data — as though a century
  of consumption without obvious catastrophe functions as evidence of safety. Under
  what theory of induction is that legitimate, and does the practice also presuppose
  that "novel" and "synthetic" reset the evidential clock? Second, what decision rule
  does the zero-tolerance cancer clause presuppose — a no-threshold dose–response
  model, a maximin rule under uncertainty, or something else — and is that rule consistent
  with the rest of the regime, which in other places seems to accept that everything
  is toxic at some dose and the question is only which dose? Third, is the additive/supplement
  asymmetry consistent under any single theory of the burden of proof, or does it
  commit the system to incompatible views depending on which aisle of the store you
  are standing in? If several theories would license the same pattern, tell me that
  the practice is underdetermined and say what extra premises would be needed to pin
  it down. Finally, if regulators swapped the implicit view for a straightforward
  expected-value, risk-based one — safety judgments based on actual exposure rather
  than hazard alone — what concretely would change: which defaults flip, which products
  on the shelf disappear or appear, and which parts of the practice would survive
  untouched because they never needed the philosophy in the first place?


