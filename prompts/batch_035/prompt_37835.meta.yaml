  Draft the prompt:


  ---


  For our department''s new "philosophical profiles" series, each of us has been asked
  to write down our commitments on a topic so that colleagues can probe them. Mine,
  on Bell''s theorem and locality, are below. Before I circulate it, I want a consistency
  audit: tell me which pairs of commitments are in genuine tension and how severely;
  which apparent tensions dissolve on inspection; and, where a revision is needed,
  what the cheapest one is and what it costs. Please rank the tensions by severity
  rather than listing them as equally bad, and be specific about which commitment
  has to go — I have no favorite and don''t yet know where the problem is.


  Here is the profile:


  1. Locality. No causal influence propagates faster than light. This is not merely
  a feature of the equations we happen to have; it is demanded by the spirit of relativity,
  and any theory that violates it is, to that extent, in conflict with relativity
  — however the dynamics is written.


  2. Bell. The experiments are decisive: the Bell inequalities are violated in the
  way quantum mechanics predicts, and the classical loopholes (detection, locality
  of setting choices) have been progressively closed. So Bell''s result, together
  with the experiments, rules out the class of theories he targeted: local hidden-variable
  theories.


  3. No superdeterminism. The measurement settings are chosen independently of the
  relevant prior variables — the correlations are not to be explained by a common
  cause reaching forward into the settings, and the experimenters'' choices are not
  scripted in correlation with the source. I find superdeterminist escape routes unbearable,
  and I hold that they would undermine the methodology of experimental physics generally,
  not just this result. Hmm — "unbearable" too emotional; keep formal: "I regard this
  as a reductio of the methodology of experimental physics, and I won''t consider
  it further." Fine.


  4. No retrocausation. Causes precede their effects; in particular, a later setting
  choice does not influence the earlier state of the pair. [Or: influences do not
  propagate backwards in time.]


  5. Completeness. The quantum state ascribed to an individual system, together with
  the laws, is a complete description of that system: there are no further variables
  that, together with the state, determine how a measurement on it will come out.


  6. Epistemic wavefunction. The wavefunction is not a physical field laid out in
  space; it is a representation of information (roughly, of what results one should
  expect for the various possible measurements). In this I take myself to be anti-realist
  about ψ.


  7. No-signaling suffices. The Bell correlations cannot be used to send a signal:
  each side''s outcomes are random, marginal probabilities don''t depend on the distant
  setting, so no observer can exploit the correlations for faster-than-light communication.
  I hold that this is what keeps quantum mechanics consistent with relativity, and
  that a theory of the kind I want must guarantee it.


  8. Case verdict. In an EPR-Bohm pair, when both parties measure spin along the same
  axis, the perfect anticorrelation of outcomes requires no explanation beyond the
  formalism: there is no "pre-established agreement" between the wings, and none is
  needed — the chancy outcomes simply always come out opposed. [This is the verdict
  the squeeze kills: with 5 (no predetermination) and 1 (no nonlocal influence), the
  anticorrelation at common settings cannot be accounted for; EPR: locality + anticorrelation
  → predetermination. So 8 is inconsistent with 1+5+2... wait, with 5 alone and anticorrelation...
  The EPR argument: assume locality; the perfect correlation at common settings means
  each outcome is predictable from the distant setting; by locality the distant setting
  doesn''t affect the local system; so the local system already carries the value
  — predetermined. 5 denies predetermined values. So 1 + 5 + "perfect correlation
  fact" → contradiction, independent of Bell. Then Bell with 3,4 extends to all settings.
  So the squeeze: 1+5 can''t accommodate even the common-setting anticorrelation (given
  the perfect correlation holds as a matter of observed fact and the outcomes at a
  single wing are chancy).]


