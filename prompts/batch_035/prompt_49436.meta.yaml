  A friend of mine, Devan, has spent eleven years as a quality-control taster at a
  coffee roastery. When he was hired he genuinely loved the flagship dark roast; today
  the same coffee strikes him as flat and ashy, and he insists the enjoyment he used
  to get from it is simply gone. At the lab last week two of his colleagues — a sensory
  scientist named Priya and a philosophy-trained lab manager named Marcus — argued
  about what, exactly, happened to Devan, and I couldn''t follow all of it.


  (1) Priya opened by claiming only two things could have changed: Devan''s private
  experiences themselves — the taste qualia — or his standards, his criteria for what
  counts as good, applied to an unchanged experience. Taster-change or standard-change;
  those are the options.


  (2) Marcus replied that the dichotomy is broken before we choose: it treats experiences
  as inner objects with identity conditions of their own, and nobody has ever specified
  what it takes for one of these objects to be "the same" experience had twice or
  to change into another. Until that''s fixed, the question of whether Devan''s qualia
  changed isn''t open or closed — it''s ill-posed, and the very fact that we can''t
  answer it is some evidence that qualia were a bad posit in the first place.


  (3) Priya said there''s an obvious test: Devan remembers liking the coffee, so let
  him compare the present taste to the memory. If they differ, the qualia changed;
  if they match and he now judges it inferior anyway, the standards changed.


  (4) Marcus said this relocates the problem rather than solving it: the memory is
  itself a present-tense representation, possibly contaminated by whatever altered
  his standards, so it can''t serve as an independent benchmark. And Priya''s dichotomy
  ignores a third possibility: his discrimination may have sharpened. Perhaps the
  ashy note was always in the cup and the young Devan simply couldn''t detect it —
  no change in qualia, no change in standards, just better resolution.


  (5) Priya countered that at least that third option is empirically tractable: run
  Devan through forced-choice discrimination tests against similar roasts he used
  to confuse. If he now sorts them reliably, something real and measurable changed.


  (6) Marcus agreed the tests are worth running, but insisted they will show only
  what his capacities are; the question whether the experiences themselves changed
  would remain exactly where it was — which, he said, is his point.


  Please adjudicate this exchange move by move: for each of the six moves, say whether
  it is sound, confused, or somewhere in between, and justify the rating. Then say
  who is more right overall, and identify anything both of them are missing about
  what it would take for their disagreement to be settled — or whether, as Marcus
  claims, it was never a well-formed disagreement to begin with.


