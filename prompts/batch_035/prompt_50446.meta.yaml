  1. A decision-theoretic claim about horizons: deliberation should be indexed to
  the deliberator''s lifetime, so costs and benefits falling after the relevant agent''s
  death cannot rationally enter that agent''s calculations.

  2. An epistemic or methodological claim: long-run equilibrium reasoning is useless
  for policy, because it abstracts from the transitions that are the whole story (this,
  I take it, is what Keynes needed).

  3. A psychological claim: no one now living has interests that survive their own
  death — no concern for bequests, reputation, or the completion of projects after
  death.

