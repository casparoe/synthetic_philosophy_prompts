  I am a retired seismologist who spent most of my career on probabilistic hazard
  assessment, and I have lately been reading philosophy of decision theory as a retirement
  hobby. Something keeps nagging at me, and I want to know whether philosophers have
  a settled concept for it.


  In my working life, we routinely attached numbers to very rare events — probabilities
  of large earthquakes per year on the order of one in ten thousand — and everyone
  understood these were model-based extrapolations with no direct empirical check,
  since the instrumental record is too short. Recently I have been reading arguments
  in philosophy and in long-termist policy discussion that follow a different pattern.
  A scenario is proposed with an astronomically small probability and an astronomically
  large payoff or harm, and the product of the two is claimed to dominate every other
  consideration. The probability is not just low in the way a rare earthquake is low;
  no amount of data could confirm or disconfirm an estimate like one in ten-to-the-fortieth,
  and different reasonable people assign estimates differing by many orders of magnitude.
  Meanwhile the stakes are scaled up until the product matters, so that the conclusion
  is essentially invariant to the probability estimate.


  What I notice, and want a name for, is this configuration: a decision rule that
  is perfectly sensible when probabilities are data-informed becomes hostage to scenarios
  whose probabilities are uninformable in principle, because the stakes can always
  be scaled to compensate. In arguments about this, I see people respond in two ways
  that both look like refusals to do the arithmetic: either they discount the tiny
  probability to something effectively negligible, without saying at what threshold
  and why, or they cap the stakes. And I have seen the observation made — I think
  in connection with a Petersburg-type lottery — that a person willing to maximize
  expected value over unbounded payoffs can be led through a cycle of pairwise choices
  that leaves them worse off with certainty, where each individual choice is locally
  optimal. That looks like an ordinary money pump, but the standard remedies for money
  pumps (e.g., transitivity axioms) don''t obviously touch it, since the trouble seems
  to come from the unbounded payoff rather than from inconsistent preferences.


  So, my questions. Does this general configuration — the tail-sensitivity of expected
  value to uninformable probabilities, plus the two escape routes of probability discounting
  and utility capping — have an established name or names? How, exactly, does it relate
  to the St. Petersburg paradox, which is the nearest thing I know: same phenomenon,
  or different (and if different, what distinguishes them)? Is the distinction I want
  to draw between data-informable and uninformable probabilities the same as the risk/uncertainty
  distinction I have seen attributed to Knight, or does his line fall somewhere else?
  And where is the actual philosophical disagreement located once the formal facts
  are conceded — I take it there are theorems that expected-value maximization over
  unbounded payoffs entails what I am describing, so I would like the answer to keep
  separate what is settled mathematics from what is genuinely contested among philosophers,
  and not to present one of the escape routes as if it were the consensus.


