  The prove-too-much argument:


  (1) The second law says total entropy can''t decrease.

  (2) A demon that measures which side of a partition a molecule is on, and opens
  a door accordingly, can extract kT ln2 of work per cycle.

  (3) Landauer/Bennett: the cost lands in erasure — resetting the demon''s memory
  to a blank state costs at least kT ln2 per bit, exactly canceling the gain.

