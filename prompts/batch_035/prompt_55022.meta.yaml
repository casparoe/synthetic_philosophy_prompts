  by any reasonable measure of parsimony. (7) The Everettian finished with parsimony
  being about laws and kinds, not about the number of entities a simple law generates:
  a theory that postulates fewer basic laws but which implies a huge state space beats
  a theory with extra laws and a smaller state space, on any reasonable formulation
  of Occam''s razor; and he noted that Bohm''s theory keeps one world but pays in
