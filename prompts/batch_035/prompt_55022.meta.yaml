  left the observer out of the theory, and it''s fine to say collapse happens at a
  scale or a registration event, provided the predictions are right -- whereas Everett
  buys exact unitarity at the cost of adding, to one universe we observe, a splintered
  multiverse that no observation can ever check. (3) The Everettian said the multiverse
  is not an extra posit but what the wavefunction already contains once you refuse
  to truncate it, and that the real test is explanatory: decoherence explains why
  measurement-like interactions suppress interference without any special law, so
  Copenhagen''s ''no collapse without measurement'' becomes a theorem rather than
  a postulate. (4) The Copenhagenist countered that decoherence only explains the
  appearance of classical behavior, not definite outcomes: the universal wavefunction
  ends up with both terms, and calling one of them ''this world'' is labeling, not
  physics. He added that Everettians can''t even recover the Born rule without smuggling
  it in: if you count branches, weighting them by anything looks arbitrary, and if
  you don''t count them, the machinery for probability is gone. (5) The Everettian
  answered that branch-counting is a non-starter because the theory nowhere supplies
  a fact about how many branches there are -- decoherence produces a continuum of
  components with no natural integer -- and that the serious Everettian derivation
  of the Born rule is decision-theoretic: it shows an agent in a branching world who
  cares only about the utilities of future copies must weight branches by squared
  amplitude or else be Dutch-booked / violate rationality constraints, so the weights
  come from rationality, not from counting. (6) The Copenhagenist retorted that making
  probability hostage to decision theory concedes the point: an objective statistical
  pattern in one world is explained; weights whose only grip is that it would be irrational
  for a branch-dweller not to care about them is not what physics meant by probability.
