  A cleaner "proves too much" construction: An argument that transitivity fails, whose
  premise pattern generalizes to show that no comparative relation whatsoever (taller
  than, earlier than, heavier than) is transitive — proving too much. E.g.: (1) For
  any alternative A, there is a barely different alternative A* such that one is indifferent
  between A and A*. (2) Indifference is transitive... leads to sorites collapse: any
  two alternatives on a chain are indifferent — so the beach holiday is indifferent
  to torture, if chained through tiny steps. Conclusion: "indifference is not transitive"
  or "there are no intransitive chains of tiny indifferences." This is the sorites/chaining
  argument about indifferences (Raz''s "incommensurability," the "utility continuum").
  The "proves too much": the same reasoning shows height comparisons fail — but wait,
  that''s the point: for height, tiny differences are not imperceptible-and-indifferent;
  the premise (1) for height is false because ''taller than'' is a sharp physical
  relation. The argument for value: (1) value differences below a threshold of noticeability
  can''t make a difference to betterness (a difference too small to matter at all
  can''t flip better-than). (2) Chain from excellent life to hellish life in noticeably-small
  steps each below threshold. (3) Better-than is transitive (or: indifference/better-than
  chains preserve). (4) So the excellent life is not better than the hellish life
  — or is indifferent to it. (5) Absurd. (6) So (3) transitivity fails, or (1) fails.
  The asker wants to keep transitivity? Or keep (1)?


  Hmm, this "chaining" argument is well-known (the sorites of value; Temkin''s spectrum
  arguments; "Rabinowicz''s..."). LLMs have seen spectrum arguments. But constructing
