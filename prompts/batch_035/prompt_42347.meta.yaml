  The "proves too much" with nonidentity, using a fresh invented twist. Let me write
  it:


  Draft (nonidentity, proves-too-much):


  "A policy group at my university has been running an argument on me about our long-term
  endowment, and I think it proves far too much. Context: we''re deciding whether
  the endowment should adopt a rule requiring trustees to weight harms to people who
  will exist in five hundred years equally with harms to people alive today. One member
  argues as follows. (1) An act or policy can wrong someone only if it is worse for
  that very person than the alternative. (2) Any policy that differs from another
  more than a generation before a birth will change the timing of conceptions, and
  so change which particular people exist; the alternative policy''s beneficiaries
  are therefore different people. (3) Our endowment rule will, for every person born
  more than a generation from now, change ... hmm.


  Actually, the classic framing: the argument to reject is the claim that nonidentity
  shows we have no obligations to far future people. But "proves too much" — the argument
  concludes "we cannot wrong future people," and the asker notices it also proves
  we cannot wrong... anyone whose identity depends on our action, which includes e.g.
  children we choose to conceive — leading to "a parent who conceives a child intending
  a life of misery for it wrongs no one, so long as the child''s life is barely worth
  living." That''s the known "wrongful life"/nonidentity extension and is genuinely
  disturbing. So the argument:


  (1) You can wrong a person only by making them worse off than they would otherwise
  have been.

  (2) Whoever exists as a result of a choice, if the choice had been different, that
  person would (very likely) never have existed at all — a different child would have.

  (3) Existing with a life worth living is not worse for you than never existing (never
  existing isn''t a state you''re in that could be better or worse).

  (4) So you cannot wrong the person who exists because of your choice, provided their
  life is worth living.

  (5) So a couple who deliberately conceive a child planning to confine it, deny it
  schooling, and extract its labor until eighteen wrong no one — the child''s existence
  owes to their choice, and the life, however grim, is worth living.

  (6) That conclusion is unacceptable; the couple plainly wrong the child.

  (7) So (1) must go: you can wrong someone without making them worse off than they
  would otherwise have been.


  But then the asker: "if (1) goes, the person-affecting intuition is lost, and with
  it the barrier to the Repugnant Conclusion?" Hmm, that mixes in population ethics.


  Alternatively the asker wants to know: which premise to give up. Step (3) has a
  subtle flaw — the comparator in (1) is ambiguous: "worse off than they would otherwise
  have been" — the "otherwise" in (2) is a world where they don''t exist; in standard
  usage the comparator is a life that could have been theirs (e.g., a better life
  for the same person, achievable by different parental treatment that doesn''t affect
  identity). Nonidentity only kicks in when the alternative affects identity; but
  many wrongs (confinement after birth) don''t affect identity — the child would have
  existed and been confined anyway; so (2) fails for post-birth wrongs: the alternative
  (not confining) is the same person. So (5) doesn''t follow from (2); the nonidentity
  slide only applies to choices that affect identity, and the couple''s confinement
  is identity-independent. So the "proves too much" is an equivocation: (2) as stated
  quantifies over "your choice" and "the alternative," but the alternatives relevant
  to wronging the child (not confining it) leave identity intact. The subtle flaw:
  (2) is true only for the choice-to-conceive, but (1)+(2) combine across different
  choices — a quantifier shift from "the choice that brought them about" to "any choice
  affecting them." Actually (4)''s "because of your choice" does the work: it suggests
  all of the child''s treatment is covered by the conceiving choice, which conflates
  the choice that caused existence with the choices that affect the existent. That''s
  a nice, genuine, subtle flaw — a scope/quantifier shift between "choices that determine
  identity" and "choices made about the person who exists."


  So the argument has a genuine equivocation, and a good answer names it: (2) is true
  of the conception choice, but (4)''s application to post-conception treatment smuggles
  in that the confinement is part of the identity-determining choice. Alternatively,
  if the asker insists the argument is about the whole bundle, then (3) is the premise
  with standing rivals (comparative vs noncomparative harm; Feinberg-style "violation"
  without setback...). Good — the prompt can ask: which step, and what does rejecting
  it cost, and the asker can say they''d like to keep (1) because... The example prompts
  show the asker may state preferences.


