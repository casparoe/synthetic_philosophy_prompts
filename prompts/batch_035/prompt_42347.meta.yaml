  The questions from the audience:

  1. From the proof theorist: "Self-reference is trivially cheap — every program can
  quine; the diagonal lemma is a syntactic trick requiring no interesting structure.
  What does Gödel add over a printer printing its own source code?" Also: "Gödel''s
  results require the system to be recursively axiomatized, consistent, and arithmetically
  strong. Which of these do you claim a brain satisfies, and what does the claim even
  mean for a wet, noisy, learning system that isn''t axiomatized — and that changes
  from week to week?"

  2. Second theorem: "Your story needs the system to notice the gap — that it can''t
  establish its own reliability. But Gödel II says a system can''t prove its own consistency;
  if the mind is consistent, it can''t represent that fact; if it can represent it,
  it''s inconsistent, and an inconsistent system proves everything, including that
  the ''I'' is Napoleon. Which horn?"

  3. The Penrose student: "You''re using Gödel the way Lucas and Penrose did, but
  drawing the opposite conclusion — they used the theorem to show minds aren''t machines;
  you use it to explain machine-like minds. Doesn''t the fact that the same theorem
  supports contradictory conclusions suggest the analogy carries no weight?"

  4. The cognitive scientist: metacognition research (confidence judgments, blindsight,
  Dunning-Kruger) shows self-models are partial, biased, and often confabulated; where''s
  the evidence of a Gödel-like fixed-point structure rather than just a rough statistical
  self-model? "In my lab, self-models are wrong in ordinary, boring ways; what observable
  prediction does the Gödelian story make that a humdrum control-theory self-model
  doesn''t?"

  5. Truth vs provability (Tarski): "Tarski''s theorem is arguably the more apt analogy
  — truth about the system is undefinable in the system — and it suggests the self-model
  is not just incomplete but systematically wrong. But systematic wrongness gives
  you confabulation, not self-awareness. Why is a wrong self-model the basis of an
  ''I''?"

  6. The Kantian: "Isn''t the ''strange loop'' just the transcendental structure of
  apperception in punning dress — and didn''t Kant show this without needing any theorem
  about formal systems, which suggests the math is decorative?"

  7. Hoping nobody asks: something like: "If the mind is a formal system of the relevant
  kind, is it consistent? If you say yes, you claim a fact the system itself couldn''t
  represent, so your own theory undercuts your knowledge of the thesis; if no, the
  Gödel sentence is provable in it and the ''gap'' you build the self out of doesn''t
  exist. Isn''t the question ''is the mind consistent?'' one your framework cannot
  answer without special pleading?" — actually that overlaps with #2. Alternative
  "hope nobody asks": "Hofstadter''s central examples — the Epimenides, the quine,
