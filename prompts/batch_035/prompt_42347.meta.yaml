  Actually the classic resolution: better-than is transitive; what fails is that "not
  noticeably better" composes — noticeability isn''t transitive, but better-than is;
  each step can be genuinely better while not noticeably better. The flaw: (1) equivocates
  between "not better" and "not noticeably better," or the argument treats imperceptibility
  as a property of the comparison rather than of the difference. Good — this is a
  genuine, subtle flaw.


