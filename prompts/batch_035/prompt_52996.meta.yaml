  I think the taxonomy/quiz type on supererogation is strong. Let me design it.


  Positions in logical space:

  1. Classical supererogationism (Urmson): acts that are good to do but not wrong
  to omit; permitted and praiseworthy, beyond duty.

  2. Consequentialist eliminativism (Singer/Unger style): if an act does more good
  than its alternatives and costs little, it''s required; supererogation is an illusion
  generated by bias (proximity, identifiability).

  3. Agent-centered prerogatives (Scheffler): consequentialism plus a prerogative
  allowing each person to devote resources to own projects — so acts can be beyond
  what''s demanded, but there''s no positive value of "going beyond" beyond the good
  done.

  4. Satisficing consequentialism (Slote): only require "good enough" outcomes — so
  heroic maximizing acts are supererogatory in a different way.

  5. The "imperfect duties" Kantian view (Hill): duties of wide scope allow latitude
  in when to benefit others; filling the latitude is meritorious.

  6. Suberogation-adjacent: some also question whether supererogation and "acts that
  are bad but not wrong" (suberogation) are parallel.

  7. The Raz/demandingness objection view: supererogation is incoherent because "if
  it''s better to do it and there''s no cost-based excuse, you ought to."

  8. Heroism as requiring exceptional cost — the "threshold" view (e.g., beyond a
  certain cost, acts become supererogatory rather than obligatory).


