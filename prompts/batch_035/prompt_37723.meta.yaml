  Draft:


  "I''ve been keeping a list of my reactions to pest-control decisions, and I''d like
  to know whether one principle explains them. Setting out snap traps for mice in
  my kitchen: fine. Spraying a wasp nest in the garden while the wasps are active,
  which kills them quickly: fine. Using glue traps for mice, which leave them to die
  slowly: not fine. Fumigating a house for termites, which kills millions of termites
  and lots of collateral insects: fine. Squashing an individual cockroach: fine, but
  dousing a colony with a slow-acting poison that takes days: not fine. Fencing pigeons
  out of a granary rather than killing them: obviously better than killing. Yet my
  neighbour trapping and relocating a rat that would otherwise have been poisoned:
  I''m oddly indifferent about that. Hmm, need a genuinely hard pair."


  Hard pairs in pest ethics: quantity of animals vs. suffering per animal vs. cognition
  level vs. alternatives. E.g., fumigation kills millions of low-cognition termites
  — fine; glue trap kills one mouse slowly — not fine. That''s a tension between aggregate
  numbers and per-individual suffering / cognitive sophistication. Also: killing pests
  for convenience (ants on a kitchen counter, harmless) vs. necessity (termites destroying
  house). And lethal vs. non-lethal: wasp nest killed though could have been left
  alone.


  Verdicts:

  - Termites fumigated, destroying house, millions killed: fine.

  - Ants on the counter, harmless, sprayed because they''re unsightly: not fine (or
  fine? make it "not fine").

  - Wasps'' nest by the door, killed quickly: fine.

  - Mice in kitchen killed in snap traps: fine.

  - Glue traps: not fine.

  - Feral pigeons excluded from warehouse with netting, non-lethal: better than killing,
  obviously.

  - Rats in a barn where a farmer poisons them with a slow anticoagulant that kills
  over days rather than paying for a marksman: not fine? But wait — mice snap trap
  is instant. So per-animal suffering matters.

  - Tension pair: termites (millions, low cognition, slow death maybe, but fine) vs
  glue trap (one mouse, slow death, not fine). Rules: aggregate-weighted suffering
  (sum of suffering matters, no matter the animal''s cognition) vs. per-treatment
  ("deaths must be quick") vs. cognitive-threshold view (only animals above some cognitive
  bar matter).

  - Another tension: shooting a single rat quickly in the barn: fine; but excluding
  ants with cinnamon rather than killing: should be even better, but I barely care.
  Non-lethal vs. lethal doesn''t track much for low-cognition animals.


  Ask for principle, what it says about further cases: buying organic vs conventional;
  whether they should feel differently about a spider vs a mosquito; and the case
  I go back and forth on: a live-catch trap that means the mouse dies of stress or
  is released into unfamiliar territory where it likely dies anyway. Or: biological
