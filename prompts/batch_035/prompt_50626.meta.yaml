  moral status" — the view distinguishes sentience (phenomenal consciousness) from
  nociception.

  3. Presenting a standard objection (expected value with tiny probabilities is fanatical/decision-theoretically
  fragile, Pascal''s mugging style) as if it''s settled that the argument fails —
