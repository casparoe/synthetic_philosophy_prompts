  - "Since there are 10^18 insects at any time, even a tiny probability of sentience
  multiplied by the vast number gives a huge expected number of sentient beings, so
  insects dominate the moral calculus and we should treat a mosquito as morally equivalent
  to a human in aggregate." Common errors: conflating "expected number" with per-creature
