  side effect, not the function, and it only became the function once selection began
  favoring feathers for flight. Dana thought this was perversely history-obsessed:
  when a physiologist asks what the kidney does, she said, she is asking what role
  the kidney currently plays in keeping the organism alive, not asking for a story
  about our fish ancestors. On her view, function is whatever the part contributes
  to some capacity of the containing system — that''s what makes function-ascriptions
  do explanatory work in physiology, and it doesn''t matter how the part got there.


  Marcus answered with malfunction: a diseased heart that pumps blood poorly, or a
  congenitally malformed valve that mostly leaks — we say these are failing to perform
  their function, and that criticism only makes sense if the function is fixed by
  something other than what the organ currently happens to do; otherwise the function
  of a leaky valve would be ''leaking'', which is absurd. Dana conceded this was a
  real cost but said it could be paid by relativizing functions to the system''s normal
  organization rather than to history — the function is the contribution the part
  is supposed to make given how the system is standardly put together. She then went
  on offense with novelty: in a bacterial population in a lab, a brand-new mutation
  arises once that lets its carrier metabolize some synthetic compound; on Marcus''s
