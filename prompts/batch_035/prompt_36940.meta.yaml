  actually draws, which concerns role rather than credentials. Empirical propositions
  are moves in the game — asserted, doubted, tested; hinges are like the riverbed
  that lets the river of empirical claims flow. The riverbed can shift, but that''s
  rule-change, not discovery of falsehood. When the child says she knows she has hands,
  she''s not reporting a doxastic state that enjoys good epistemic standing; she''s
  mastered something like a norm of the game. Calling hinges knowledge re-inserts
  them into the evidence game where they can''t survive — which is exactly the move
  that gives skepticism its grip.


