  my memories — presupposes exactly the class of things the belief is meant to be
  grounded in: that my eyes work, that people mostly don''t lie about hands, that
  the world has been roughly stable. So the certainties that stop the regress cannot
  themselves be earned by evidence; they are not known but function as preconditions
  of the game of giving grounds. Moore''s proof fails not because it is false but
  because it tries to give a move in the game for something that is the condition
  of the game''s being playable.


  (2) Emil replied that this conflates two questions: what a justificatory regress
  shows about grounding and what knowledge is. Perceptual knowledge is, on most accounts,
  non-inferential — I know there''s a lamp on my desk without inferring it from premises
  — and nobody disqualifies it on that ground; the knower''s inability to supply non-circular
  grounds for her eyes working doesn''t retract the knowledge either. If a hinge is
  a certainty that serves as a stopping point for justification, nothing in that role
  disqualifies it from being known. And Wittgenstein himself allows a use of I-know
  that doesn''t advertise grounds. Treating hinges as beyond knowledge over-intellectualizes
  knowledge — against the de-intellectualizing spirit of the book.


