  Prompt draft:


  ---


  I''d like a thought experiment built to the following specifications. The target
  is origin essentialism about persons: the thesis that you could not have come from
  origins other than your actual ones — different gametes, or, on some versions, a
  different zygote. I want a case that turns the essentialist''s own apparatus against
  its unity: it should be constructed so that three natural precisifications of ''origin''
  — the gametes, the zygote, and whatever later developmental event one might instead
  fix on — deliver three different answers to one and the same question about who
  exists, when someone began to exist, or whether some individual could have failed
