  lecture, and I can''t find it addressed anywhere as a working method.


  Here is my situation. I''m the only data analyst at a company of about two hundred
  people that runs subscription web services. Roughly weekly someone comes to me with
  a comparison of rates: churn before and after a price change, conversion under the
  old and new onboarding flow, support tickets per user under two release versions,
  cancellation rates in a marketing segment versus the population. Almost every one
  of these numbers can be computed either aggregated or sliced — by device, plan tier,
  acquisition channel, week, market — and the slices routinely disagree with the aggregate,
  sometimes to the point of reversing the sign. I know the name for the reversal:
  I''ve seen the admissions-and-departments case and the kidney-stone treatment case
  many times, and there''s a well-known interactive illustration of it in the community''s
  canon that I could recite. Naming it doesn''t help me. My executives don''t want
  a statistics seminar; they want a number to act on, chosen defensibly enough that
  the decision survives a Monday-morning meeting with someone holding the opposite
  number.


  What I''ve pieced together from my reading is that the resolution is causal rather
  than arithmetic: whether to trust the aggregate or the slices depends on where the
  slicing variable sits in the causal story — whether it plausibly influences both
  group membership and the outcome, or is downstream of them, or is upstream of nothing
  much. That principle is stated everywhere at the level of worked textbook examples
  and almost nowhere as something a working analyst can run on a fresh case in twenty
  minutes.


  So this is my request. Act as a statistician with a serious grounding in the philosophy
  of causal inference, someone at home with the distinction between an association
  measure and an estimate of a causal effect, and with the literature on when a measure
  is collapsible across a partition and when it is not. Before writing anything, brainstorm:
  list the candidate distinctions from that literature and decide which of them must
  survive the translation into a desk procedure and which can be dropped for my use
  case. Then produce:


  1. A decision procedure I can actually run on a fresh comparison of rates: an ordered
  list of questions, each with what counts as a sufficient answer, where the procedure
  stops and returns "report the aggregate," where it returns "report the slices,"
  where it returns "these data do not answer the question being asked," and where
