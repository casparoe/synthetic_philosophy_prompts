  - Program equilibrium → analogy? "Newcomb''s problem" analogies.

  - Meta-problem of consciousness → analogy: "the hard problem is like..."?

  - Kuhnian incommensurability → procedure: journal editor deciding when competing
  frameworks'' papers can be compared; referee procedure.


