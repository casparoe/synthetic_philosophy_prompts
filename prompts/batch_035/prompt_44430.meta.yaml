  paper "isn''t science" because it uses different standards. That''s quite good and
  in the weeds: operationalize incommensurability for editors: when can papers be
  compared across paradigms, when is disagreement about standards of merit vs facts.


  Or infinite ethics + procedure: a longtermist grantmaker operationalizing... discounting
  future people. Hmm.


