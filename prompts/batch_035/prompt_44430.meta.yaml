  team without philosophy background, recurring decisions, worked applications including
  one where procedure gives unwelcome answer. The conceptual work: translating the
  literature on introspection''s reliability — confabulation (Nisbett & Wilson), choice
  blindness, validity vs reliability of introspective reports, whether reports are
  post-hoc confabulation, self-interpretation vs inner observation, Hurlburt''s Descriptive
  Experience Sampling — into a usable procedure: questions like "is the report about
  a current/just-past state or a general disposition?", "does the report require access
  to cognitive processes (why) or just mental products (what)?", "could the person
  have inferred this from their own behavior or context — i.e., is it self-perception
