  that matters morally, but they also hold that once revealed and re-labeled honestly,
  the forgery should regain all its value — hmm, that''s a real tension with "originals
  matter."


  Another tension: (1) I think value of artwork = the experience it gives viewers;
  (2) I think forgery is wrong because it''s deceptive; (3) I think a perfect forgery,
