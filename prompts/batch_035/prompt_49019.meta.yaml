  out the Vermeer in the museum was a Van Meegeren forgery; (4) originality of the
  artist matters — the original was created by an act of creative invention, the forgery
  copies; (5) I think an original handwritten letter from Lincoln is worth more than
  an identical photocopy... hmm.


  The classic tension: aesthetic formalism (value = experienced properties) vs intuition
