  with what speakers do with it: Strawson mistook a failed presupposition — a precondition
  on making an assertion — for a gap in truth conditions, and Donnellan''s referential
  uses can be handled along Gricean lines, as Stephen Neale has argued: what is literally
  said is the quantificational content, and the referential intention explains what
  is meant. The Gricean two-level apparatus was invented precisely for cases where
  literal content and communicated content come apart, and no one thinks conversational
