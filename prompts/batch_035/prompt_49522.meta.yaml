  Russell''s analysis of "The present King of France is bald" as a quantified conjunction
  — that there is exactly one present King of France and that whatever is the present
  King of France is bald — noting that this paraphrase dissolves the puzzles Russell
  collected in "On Denoting": negative existentials no longer require Meinong''s shadowy
  objects, excluded middle is preserved (once negation is allowed wide scope), and
  George IV can wonder whether Scott is the author of Waverley without wondering whether
  Scott is Scott.


  Dr. Boyer replied that as an account of English sentences the analysis is straightforwardly
  falsified. Strawson pointed out that we do not say "The King of France is bald"
  is false but that the question of its truth does not arise; and Donnellan showed
  that descriptions are routinely used to pick out a particular individual even when
  the description fits nothing or fits the wrong thing — as when someone at a party
  says, of a man whose glass contains only water, "the man drinking a martini is going
  to be ill," and says something true about that man. On Russell''s strict truth conditions
  the utterance is false; a theory that gets actual usage this wrong has been refuted,
  not refined.


