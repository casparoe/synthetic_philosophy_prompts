  I''m in a philosophy reading group that has been working through the debate between
  deflationary and substantive theories of truth, and last week two members — let''s
  call them Dana and Miguel — got into a disagreement I couldn''t referee. Neither
  is a professional philosopher; both have read enough to make decent moves. I''ll
  reconstruct the exchange as faithfully as I can, numbered by move.


  The background they agreed on: the deflationist holds that there is no more to truth
  than is captured by the instances of the equivalence schema — the proposition that
  snow is white is true if and only if snow is white, and so on for every proposition;
  truth is not a deep, substantive property whose nature it is the job of a theory
  to reveal.


  (1) Dana opened by arguing that deflationism is unstable as a philosophy of logic.
  If all there is to truth is the equivalence schema, then the concept does no explanatory
  work; but validity itself is standardly glossed as necessary truth-preservation,
  and the induction behind the inference from a valid argument to the truth of its
  conclusion uses truth as a property. A concept that is "nothing above" its schema
  cannot carry that weight, so deflationism saws off the branch logic sits on.


  (2) Miguel replied that Dana had mislocated the function of the truth predicate.
  Its entire utility, on the deflationary view, is as a device of generalization:
  it lets us say, with one finite sentence, everything the witness said is true —
  something we could not say by enumerating the infinitely... well, the many, assertions.
  That the predicate is expressively indispensable doesn''t make it explanatory of
  anything, and it is only against the inflated view that it must be.


  (3) Dana came back on the normative side. Belief is standardly said to aim at truth:
  one ought to believe that p only if it is true that p. If truth is not so much as
  a property, then belief aims at nothing, and the whole normative characterization
  of belief collapses; a deflationist owes us either a retraction of the norm or a
  reconstruction of it that doesn''t quietly reintroduce a property of truth.


  (4) Miguel said the reconstruction is easy and the deflationist has it: state the
  norm schematically — for each proposition p, don''t believe that p unless p. Each
  instance is fully intelligible without the truth predicate; the universal generalization
  is what needs it, and the truth predicate''s generalizing role covers that. No property
  invoked, nothing normative lost.


  (5) Dana then shifted to the Liar. The deflationist says the equivalence schema
  holds for every proposition. Consider the liar proposition, that very proposition
  is not true. Its equivalence instance says: that proposition is true if and only
  if it is not true — a contradiction. So either the schema is not universal, in which
  case the deflationist''s "all there is" is false, or it is universal and inconsistent.
  Either way deflationism, stated as a complete theory, is refuted by a two-line argument.


  (6) Miguel''s last move was to invoke Tarski: the undefinability theorem shows that
  truth for a sufficiently rich language cannot be defined in that language, which
  is exactly what you''d expect if truth is not a substantive property but a logico-linguistic
  device; the correspondence theorist, by contrast, owes a definition and Tarski showed
  there is no coherent one to be had. The Liar is a problem for everyone, so it counts
  against no one.


  (7) Dana closed by denying the symmetry: Tarski defined truth perfectly well for
  formalized languages in a metalanguage, and the fact that we keep needing richer
  and richer metalanguages is evidence that truth is a genuine property of sentences,
  one that outruns any fixed schema — the hierarchy is a discovery about truth, not
  a limitation of our vocabulary.


