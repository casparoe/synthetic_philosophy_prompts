  \ the pump fails because the agent won't trade down from its endowment. That's the\
  \ classic objection: loss-averse agents have \"money pump blockers.\" Spec: a realistic\
  \ consumer with framing-sensitive preferences (loss aversion, endowment effect)\
  \ who looks intransitive in the lab but is unexploitable in markets, and the answer\
  \ should identify which feature does the work (reference-dependence, i.e., the preferences\
  \ aren't really cyclic over a fixed option set).\n\nOr focus on diachronic rationality\
  \ more directly: resolute choice vs. sophisticated choice. Spec: construct a decision\
  \ tree where the sophisticated (backward-induction, naive?) agent is money-pumped\
  \ while a resolute agent is not, but the resolute agent must violate independence\
  \ of irrelevant alternatives or \"sophisticated choice\" consistency... The asker\
  \ can ask: show what each of naive choice, sophisticated choice, and resolute choice\
  \ (McClennen's terminology) does, which feature does the work, and how a defender\
  \ of backward induction attacks.\n\nHmm, is McClennen too niche? \"Resolute choice\"\
