  to inspect the inside; if an experimenter nudges the prey a few inches while she''s
  inside, she emerges, drags it back to the threshold, and re-runs the inspection
  — over and over, for as many times as you care to repeat the trick. The wasp''s
  behavior looks intelligent from outside the loop and turns out to be a closed subroutine,
  triggered and terminated by cues in the world rather than by anything like monitoring
  of her own goal. I want to read Groundhog Day as a film about exactly this spectrum,
  and I''d like your help stress-testing the reading before I present it.


  Here is the reading in outline. Phil Connors begins the film as a sphex in a sense:
  within the loop he runs fixed routines keyed to cues (the same greeting to Ned Ryerson
  on the corner, the same lines on Rita), and when the environment deviates from the
  cues — Rita responds to the rehearsed pickup lines differently each day because
  she, unlike the wasp''s prey, has memory of the previous loop-free world, or rather
  because each day resets — the routines fail identically each time. The townspeople,
  meanwhile, are literal sphexes: they run the same script every day, and only Phil,
  standing outside the loop, is in a position to notice. The film then stages a theory
  of what it takes to stop being sphexish: it is not more cleverness — Phil is enormously
  clever within the loop, and cleverness only makes him a more elaborate sphex — but
  a change in what he wants, so that flexibility turns out to be motivational rather
  than cognitive. And the loop itself raises the free will question in a strange form:
  with all consequences removed, Phil has maximal options and minimal freedom, and
