  Answer text: Singer''s argument starts from utilitarianism: what makes a being morally
  considerable is its capacity to suffer, not its rationality or personhood. Since
  animals can suffer, their interests count, and giving them less weight just because
  they aren''t human is arbitrary in the same way racism and sexism are arbitrary
  — hence the term speciesism, which Singer coined. The argument from marginal cases
  sharpens this: many humans (infants, people with severe cognitive disabilities)
  lack the higher cognitive capacities we usually cite to distinguish ourselves from
  animals, but we still think they have full moral status. So if these humans count,
  the capacities can''t be what grounds moral status, and by the same token species
  membership can''t either; if they don''t count, we''re commited to accepting that
  infants can be used in ways we''d never accept. Since marginal-case humans clearly
  do have moral rights, animals must have moral rights too. Singer''s conclusion is
  that animals are entitled to equal treatment with humans — just as we can''t favor
  a human''s interest over a pig''s when both are equally strong, we also can''t ever
  treat them differently in practice. A defender of species distinctions can reply
  with a contractualist story: morality is a system of cooperation among beings who
  can reciprocate, and while animals fall outside it, marginal humans are inside because
  they are members of our species and we care about them. I find Singer''s side stronger
