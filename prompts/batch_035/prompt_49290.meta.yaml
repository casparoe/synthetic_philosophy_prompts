  and freedom of association, like a club; legitimacy of excluding to protect a culture,
  welfare state, or political project.

  - The duty of rescue / refugee obligations: the argument that even if there''s a
  general right to exclude, there are special duties to admit the persecuted — precisely
  the Casablanca population.

  - The exit/entry asymmetry: the right to leave (emigration) is widely recognized
  as a human right, but it''s worthless without a right to enter somewhere; UDHR Article
  13 recognizes freedom of movement and residence within borders, right to leave any
  country including one''s own, and right to return — but no right to enter another.

  - Commodification of movement rights: Renault selling visas — is the objection that
  he sells them, or that the state rations them at all? A lottery vs market vs queue.

  - Documentarity: the letters'' power is that others treat them as authoritative
  — pure institutional fact (Searle''s constitutive rules — could invoke speech-act/institutional
  facts idea, that''s common knowledge).


