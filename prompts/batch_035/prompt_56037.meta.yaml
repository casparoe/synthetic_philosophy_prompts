  ---


  Write a dialogue between two evolutionary biologists — one a staunch defender of
  the gene''s-eye view of selection, the other a committed proponent of multilevel
  selection — who have been asked to co-author a review of the following experimental
  system.


  In a laboratory population of yeast, some cells secrete an enzyme that breaks down
  sucrose outside the cell, so that the digested sugar diffuses freely and can be
  absorbed by any neighboring cell. Cells that secrete the enzyme grow more slowly
  than cells that do not, because secretion is metabolically costly. When rare, non-secretors
  ("cheaters") outcompete secretors within any local clump; but clumps dominated by
  cheaters exhaust the sugar so inefficiently that they leave far fewer descendant
  colonies than clumps with many secretors. The experimenters can show both effects
  quantitatively: within-clump selection favors cheaters, between-clump selection
  favors secretors, and which force wins depends on how the clumps are formed and
  dispersed.


  The dialogue should meet the following requirements. Both characters should be equally
  competent, and neither should be a strawman; each should concede what is genuinely
  awkward for their own view. The gene-selectionist should press the claim that describing
  the case in terms of group selection is at most an alternative bookkeeping of the
  same causal process, and that the only things that persist across generations are
  genes, so the ultimate beneficiary of the secretors'' costly behavior must be identified
  at that level. The multilevel selectionist should respond that the causal statistics
  of the experiment — how variance is partitioned within and between groups, and how
  clump formation and dispersal change that partition — are themselves the engine
  of the outcome, and should accuse the gene-selectionist of committing something
  like an averaging fallacy whenever total selection is assessed only at the level
  of the mixing population. At some point the two should disagree sharply about whether
  it makes sense to speak of the enzyme''s function, given that what the secretion
  is "for" seems to depend on which level of the population structure one treats as
  the character-bearing unit. The dialogue should end not with a resolution but with
  the two of them drafting a single sentence they can both sign off on about what
  the yeast experiment demonstrates, arguing over that sentence''s wording.


  ---


