  circling is whether this is a causal explanation at all, and I''d like a written
  essay that takes a stand.


  Here is the core puzzle I want the essay to confront. When Weber says Calvinist
  values caused capitalist behavior, something must do the work of connecting the
  value to the action: the values must select the behavior. Yet the obvious candidates
  for the connection are themselves interpretive or normative — the believer reads
  worldly success as evidence of election because the doctrine means something to
  them — and it''s unclear how a meaning becomes a cause. A regress looms: if we say
  the values caused the behavior, we should be able to say what caused the values
  to carry that motivational force, and so on. Philosophers call versions of this
  the problem of "normative selectivity," but the essay shouldn''t just name-drop:
  it should reconstruct the problem on its own terms. The essay should also weigh
