  possible profile of individual preferences. Voters can rank the options any way
  they like — including cycles? no, wait, individual rankings have to be complete
  and transitive, so no cycles at the individual level, but any combination of individual
  rankings is allowed. Pareto: if everyone ranks x above y, the social ranking must
  put x above y. IIA: adding or removing an irrelevant option shouldn''t change how
  the social ranking treats the remaining options — like, if a third candidate drops
