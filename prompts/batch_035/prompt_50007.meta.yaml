  In my ethics class we discussed Peter Singer''s example of passing a shallow pond
  where a child is drowning, and I''ve been trying to work out what I actually believe
  by listing my gut reactions to rescue cases. I''d like to know whether some principle
  captures all of them, and I''d rather you tell me honestly if some of my verdicts
  can''t be kept together.


  The cases and my verdicts:


  1. I walk past a pond and see a stranger''s child drowning; wading in ruins my phone
  and makes me late for school. Verdict: I must do it, and anyone who doesn''t is
  doing something seriously wrong, not just unkind.

  2. A leaflet says a small regular donation would prevent a child dying of malaria
  far away. Verdict: I should do it, but skipping it feels like a failure of generosity
  rather than a cruelty — I wouldn''t call someone who doesn''t donate a monster,
  and I do feel that way about the person who walks past the pond.

  3. Ten other people are standing around the pond, all equally able to wade in. Verdict:
  less obligation on me in particular, though I''d still blame the group.

  4. I already donated my allowance this month, so the leaflet can wait till next
  month. Verdict: excused. But if I''d already pulled one child out of a pond this
  month, I don''t feel excused from the next drowning child I pass. These two feel
  right to me and I can''t see how they can both be right.

  5. My own child and a stranger''s child both need saving and I can reach only one;
  mine is slightly farther away. Verdict: saving mine is not merely allowed, it''s
  what I ought to do.

  6. A rescue that would cost me a broken arm, or my part-time job that pays for my
  sister''s care — verdict: heroic if done, not wrong if not done.


