reasoning_summary: 'Domain: coherence arguments for expected utility maximization.
  Type: compare two ideas/concepts/theories? Or fiction lens? Rationalist blog reader
  perspective fits coherence arguments well.


  Options:

  1. Compare: Dutch book arguments vs. Savage''s representation theorem / de Finetti
  vs. Savage vs. von Neumann-Morgenstern coherence arguments for EU maximization.
  That''s a good "in the weeds" comparison.

  2. Fiction lens: a work through coherence arguments — e.g., Dostoevsky''s Notes
  from Underground? "twice two makes four" — Underground Man rants against rationality
  and two-times-two-equals-four. That''s a nice fit! But moral realism vs anti-realism
  also fits Dostoevsky.


  A longtime rationalist blog reader comparing de Finetti''s Dutch book argument with
  Savage''s representation theorem would be great — this is niche enough but within
  LessWrong canon (Dutch books are discussed on LW). Inject new/niche ideas: e.g.,
  the distinction between "decision-theoretic" Dutch books (acting so that you accept
  sure-loss combinations) vs "epistemic" Dutch books; or money-pump arguments for
  transitivity; or the objection that a single agent facing one decision needn''t
  be coherent — "pre-commitment to incoherence" / the idea that one-shot agents aren''t
  vulnerable. Also the "Dutch book is a two-agent adversarial framing" objection —
  that Dutch books assume an adversary, and in the real world there are transaction
  costs; compare to how coherence theorems assume repeated interactions or liquid
  markets.


  Prompt: compare Dutch book arguments (Ramsey/de Finetti) with Savage''s axioms as
  justifications for EU maximization, addressing the objection that Dutch books require
  an adversarial bookie, and asking which gives a better grounding for a bounded agent
  in a one-shot world. Written formally, from a rationalist reader perspective.


  Alternatively fiction type with coherence: read a film — e.g., "A Beautiful Mind"
  bar scene (Nash equilibrium, not coherence). Memento? Money-pump and nontransitive
  preferences? Hmm, compare type seems cleaner.


  Let me write it formally as a longtime LessWrong reader:


  "I''ve been reading LessWrong-adjacent discussions of coherence theorems for years,
  and I keep noticing that ''Dutch book arguments'' get used as a catch-all justification...
  Please compare the Dutch book argument (Ramsey–de Finetti) with the representation-theorem
  route (Savage, and VNM). In particular: Dutch book arguments show that incoherent
  credences license a sure-loss set of bets, but they seem to presuppose an adversarial
  bookie who can trade against you at will, whereas Savage derives EU maximization
  from axioms on preferences alone... Which of the two, if either, actually establishes
  that a bounded agent embedded in the physical world with a single lifetime should
  approximate an EU maximizer? And where do they leave room for e.g.lexical/preferential
  gaps?"


  Keep it short-ish. Include rationalist flavor: mention money pumps, embedded agency,
  "in the weeds" without being too niche. Avoid needing citations.'
