  be shifted around, whereas each person is supposed to have their own life to lead
  and their own claims that can''t just be traded off against someone else''s benefits.
  I''ve also gathered that philosophers think this is a really important objection
  and that utilitarians have replies (I''ve heard the names Parfit and Nagel thrown
  around here) but I''ve never seen it laid out in terms I can evaluate.


