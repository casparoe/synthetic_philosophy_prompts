  At our hospital''s ethics committee, clinicians defending the withdrawal of ventilator
  support in ICU cases rely on a standing analogy: the ventilator is a rescuer who
  has been holding the patient''s head above water; switching it off is simply the
  rescuer letting go and swimming away, so the patient is left to the threat that
  was already there (the drowning, i.e., the underlying disease), and whatever happens
  next is something the rescuer declined to prevent, not something the rescuer did.
  On this basis the committee holds two conclusions: that withdrawal is letting die
  rather than killing, and that it is permissible whenever never having started the
  ventilator would have been. Some members are uneasy, and one attending put the worry
  like this: "We don''t just stop; someone walks to the machine, dials the settings
  down over two days, titrates sedation around it, and the patient dies within minutes
  of the last adjustment. That looks like a series of acts with a foreseeable death
  at the end, not like a rescuer quietly slipping away." I''d like an audit of the
  analogy, not a lecture on the acts/omissions doctrine. Lay out what maps onto what:
