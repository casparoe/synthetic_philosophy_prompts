  I think the case-verdicts type works beautifully with Weber''s thesis: the novelist
  gives cases of historical explanations and their gut verdicts on whether the cultural
  value explanation is doing real causal work, then asks for a principle.


  Cases: Weber''s Protestant ethic explaining capitalism''s rise — feels right. A
