  2. Same values invoked to explain a single modern individual''s thrift — hand-waving.

  3. Honor culture in the US South explaining higher rates of... something — plausible
  but mechanism unclear.

  4. Explaining the Industrial Revolution in Britain by "British culture of practical
  tinkering" — feels like it just restates the phenomenon.

  5. Geertz-style thick description: Balinese cockfight telling us about status hierarchy
