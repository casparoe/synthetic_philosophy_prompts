  But keep the prompt relatively short. Focus on the important issues. Maybe 5 cases
  with verdicts.


  Also include a tension: one case where the explanation is circular-feeling but the
  person still believes it, versus one where it looks rigorous but they distrust it.
  And a case they go back and forth on.


  The novelist perspective: they write fiction where culture shapes characters, so
  they have a stake in whether values can be genuinely causal. Formal polished prose.


