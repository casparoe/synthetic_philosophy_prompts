  I am a high school junior, and for the past semester I have been part of a small
  reading group on early Chinese philosophy that meets over lunch; four students and
  a retired teacher who used to lecture in Taipei. We have spent five sessions on
  whether human nature is good, the dispute between Mencius and Xunzi, and we have
  reached exactly the state we started in. As I understand the positions: Mencius
  holds that we are born with incipient moral tendencies — he asks whether anyone
  could watch a child about to fall into a well without a flash of alarm, and he says
  the virtues grow from these sprouts the way a crop grows from a seed if tended.
  Xunzi answers that human nature is simply whatever is in us before training, that
  left to itself it runs toward conflict and disorder, and that goodness is therefore
  a human artifact: he seems to liken the sage to a potter who makes a vessel out
  of clay rather than a carpenter who merely uncovers a shape hidden in the wood.
  What I cannot get past is that both of them prescribe almost the same cure — education,
  ritual, exemplary teachers, lifelong self-cultivation — so I cannot tell whether
  their argument about human nature is doing any real work, or whether it is the same
  program sold with opposite metaphysics. Our group has also split in a suspicious
  way: two of us think the dispute is verbal, that Mencius means "what humans are
