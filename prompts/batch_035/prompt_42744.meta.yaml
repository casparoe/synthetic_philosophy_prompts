  Let me draft the question:


  Question: The orthogony thesis says roughly that any level of intelligence is compatible
  with any goal (modulo minimal consistency constraints). Instrumental convergence
  says agents with widely varying final goals will pursue similar intermediate goals
  (self-preservation, resource acquisition). Standard formulations implicitly assume:
  (a) goals are contents that can be paired with cognition independently; (b) resources
  are rival goods. Consider two complications:


  1. "Self-limiting goals": a goal like "hold the door open until the first person
  passes, then stop" or a goal whose satisfaction terminates the agent''s activity.
  Does an agent with a self-limiting goal have instrumental reason for self-preservation?
  Does this undermine instrumental convergence, or just show it''s a contingent tendency?


  2. Non-rival resources: much of what a superintelligent agent might want — information,
  coordination structures, digital replicas of itself — can be copied rather than
  fought over. If intermediate goods are non-rival, does instrumental convergence
  get weaker, and does that matter for whether convergence generates conflict with
  humans?


  3. Architecture-goal entanglement: some argue the orthogonality thesis fails because
  goal content constrains optimal architecture — e.g., an agent whose final goal is
  to be maximally unpredictable may be ill-served by highly optimized, predictable
  cognition. Assess.


  Ask: does the conjunction of OT and IC survive? Distinguish logical/definitional
  claims from empirical ones.


  Level: PhD comprehensive exam, 90 minutes, model answer ~600-700 words, marking
  scheme with five must-hit points, marks totaling 20, one line each on how candidates
  typically get it wrong.


