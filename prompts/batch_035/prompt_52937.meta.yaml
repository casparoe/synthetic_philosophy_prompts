  I''m a type designer, and my studio runs a small reading group on the conceptual
  side of letters and letterforms. Our next session is on Hofstadter''s Letter Spirit
  project, which tried to model how a letter like ''a'' can be recognized and created
  across wildly different renderings. I want to close the evening with a poem, and
  I''d like it to be a sestina.


  Here is the thought the poem should carry. Consider how different the physical marks
  are that we read as ''a'': the monumental capital A of a Roman inscription, the
  double-story ''a'' of a book face, the single-story ''a'' of many geometric sans-serifs
  and of most people''s handwriting, a blackletter a, a child''s wobbly copybook attempt,
  the red embroidered A in The Scarlet Letter. No two share a decisive set of visual
  features, and some pairs share almost nothing; yet we identify them instantly, and
  we can even sort them — this one and that one belong to the same typeface, that
  one is the same letterform at a different size, this one is a bad ''a'' wearing
  the wrong clothes. The thought from the reading group is that the essence of a letter
  is not a template or a shared feature set but a role in a self-defining system:
  an ''a'' is whatever competently plays the role of ''a'' against the backdrop of
  the rest of the alphabet, and a typeface is a coherent manner of filling all twenty-six
  roles at once — the category tells you which letter you are seeing, the style tells
  you whose hand or foundry made it.


