  be drawn from the working vocabulary of letterforms: bowl, stem, counter, spine,
  aperture, terminal — are the fixed roles: the same words return in every stanza,
  but each time in a different syntactic and semantic guise, so the poem enacts the
  very thesis it describes. Take one liberty with the scheme if you want (e.g., letting
