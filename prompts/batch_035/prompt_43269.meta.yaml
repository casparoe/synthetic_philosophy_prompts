  ---


  I teach just war theory, and for years I have defended the moral equality of combatants
  in my graduate seminar — the view that combatants on both sides of a war are legitimate
  targets and may kill one another provided they fight within the rules, so that the
  justice of their cause is irrelevant to the permissibility of what they do on the
  battlefield. I have now put my defense into numbered form for a departmental colloquium,
  and a colleague in ethics claims it proves too much. I would like a careful diagnosis
  before I stand up in front of the department.


  The argument:


  (1) What transforms battlefield killing from murder into permissible killing is
  not the justice of either side''s cause but the combatants'' mutual undertaking
  of the role of fighter: by donning the uniform and taking up arms, soldiers on both
  sides knowingly and voluntarily place themselves in a practice whose participants
  are permitted to kill one another.

  (2) A voluntary undertaking of a role can change both what its holder is permitted
  to do and what may permissibly be done to him — as when a patient consents to what
  would otherwise be battery.

  (3) Since combatants on each side have undertaken the role and their opponents have
  as well, combatants on both sides are permitted to kill one another; since civilians
  have not undertaken it, they are not permissible targets.

  (4) Whether a combatant acted permissibly therefore depends only on his conformity
  to the rules governing the role — the rules of engagement, proportionality, and
  noncombatant immunity — not on the ad bellum justice of his side.

  (5) Hence combatants are moral equals: the unjust conscript who kills a just defender
  while scrupulously following the rules does him no wrong, and the just defender
  is no better placed, morally, than his attacker.


  My colleague''s extension: nothing in the argument restricts it to war. If a voluntary
  entry into a practice of mutual killing licenses the killing, then dueling associations,
  gladiatorial games stocked with volunteers, and paid death matches between consenting
  fighters are permissible too, so long as their rules are internally followed and
  no bystanders are harmed. And she adds a second blade: if I retreat to the claim
  that the war convention is special because it is authorized by states, then the
  moral equality of combatants rests on state license — which would make a war of
  aggression permissible by decree, a conclusion nobody in the seminar would accept.


  There is also a wrinkle I cannot dodge: conscripts. Many soldiers in history did
  not volunteer for anything. If (1) requires voluntary undertaking, then conscripts
  have not changed their moral status, and killing them is murder — so my argument
  proves not merely too much, in my colleague''s direction, but too little, since
  it cannot cover the conscript armies whose equality it was meant to secure. I gather
  the standard repair is to invoke some form of tacit or hypothetical consent, but
  I cannot see how to do this without either collapsing back into state license or
  making consent so thin that the gladiators get it too.


  Tell me, then: which premise or step should I give up, and what does giving it up
  cost? In particular: (a) is the dueling extension a fair application of the argument
  or a disanalogy I can name?; (b) is the conscript problem fatal to the consent rationale,
  or does the tacit-consent repair work at a price worth paying?; (c) if I abandon
  the consent rationale, is there any remaining route to moral equality that does
  not run through state authorization? For what it is worth, if I am forced to choose,
  I would rather retain a robust distinction between combatants and civilians than
  retain the moral equality of combatants — but I would like to know exactly what
  each sacrifice buys me.


