reasoning_summary: 'Let me pick a domain and type. Good combos:


  - Is-ought gap + verdicts-on-cases type: asker gives verdicts on derivations — which
  inferences from is to ought feel legit. E.g., "This action causes immense pain to
  no benefit → ought not do it" seems fine; "that''s how we''ve always done it → ought
  do it" not fine; "humans naturally desire X → we ought pursue X" feels somewhere
  in between. That''s a nice niche case set. Could include Moore''s open question
  argument, companions in guilt, etc.


  - Disjunctivism + classroom activity: design an activity making the argument from
  illusion felt. Could be fun: staged illusion scenarios, participants judging whether
  they see the same thing.


  - Everyday conventions + dialogue: tourist and local about tipping/jaywalking.


  - IP + verdicts cases: my verdicts on when copying ideas is wrong — style vs. plot
  vs. melody of 3 notes, etc. That''s nice and in the weeds.


  I think is-ought gap + verdicts type is strong: the asker gives verdicts on specific
  inferences from facts to norms and asks what principle distinguishes legit from
  illegitimate. Inject niche angle: e.g., include a case with "companions in guilt"
  or a fictional case about deriving an ought via the word "wrong" definition. Keep
  it casual with typos.


  Cases could be:

  1. "This knife is dull" → "you ought to sharpen it" — feels fine, but that''s instrumental/means-end,
  presupposes a goal.

  2. "That''s the law here" → "you ought to obey it" — no.

  3. "Humans evolved to be selfish" → "we ought to be selfish" — no.

  4. "She promised" → "she ought to keep it" — feels fine and yet looks like is→ought.
  Hard pair with #2.

  5. "Torturing puppies for no reason causes terrible suffering" → "you ought not
  do it" — feels fine to many, but on Hume''s view that''s exactly what you can''t
  derive.

  6. "This is what ''wrong'' means in our community: causing gratuitous harm; he did
  that; therefore his act was wrong" — analytic definition route.


  The tension: cases 1, 4, 5 seem to be pure is-statements supporting oughts while
  2, 3 don''t. Ask for the principle: is it presupposed ends (1), conventional/institutional
  facts (4), or substantive moral premises smuggled in (5)? And ask what the principle
  says about a new case: e.g., "everyone in the community disapproves of X" → "X is
  wrong" (cultural relativism-ish), or "this act is unnatural."


