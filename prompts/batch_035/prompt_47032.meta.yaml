  account that takes a primitive exemplification or instantiation tie to bind constituents
  into a complex; the deflationary view that takes propositions as whatever "that"-clauses
  stand for, with unity inherited from the sentence; and the primitivist view that
  unity is just what a certain kind of complex has, not further explicable.


  Throughout, please say how confident you are in your claims, and single out the
