  For a graduate seminar on the unity of the proposition, I want the specification
  settled before anyone reaches for a theory. Write out the desiderata that any adequate
  account of propositional unity must meet, with the case or puzzle behind each, and
  mark which are non-negotiable and which reflect the prejudices of one camp rather
  than genuine requirements.


  The ones I can see so far, roughly: the account must explain what distinguishes
  the proposition that Socrates is wise from the mere plurality Socrates, wisdom —
  that from which a list differs; it must say something about the relation Bradley
  raised: if the unity of aRb is explained by a further relation tying a, R, and b
  together, that further tie seems to need the same explanation, and an account that
  answers every request for unity with another unifier never delivers any. So the
  account must either bottom out in a genuine primitive or explain why no further
  unifier is needed — and it must be explicit about which it is doing, not just relabel.
  It must handle false propositions: a view that identifies propositions with facts,
  or grounds their unity in what makes them true, owes an account of the unity of
  the false ones, or an honest admission that they fall outside it. It must allow
  the logical operations: negation, conjunction, embedding under attitude verbs —
  a proposition that cannot be negated or disbelieved is not a proposition. It must
  say whether and how the unity of a proposition differs from the unity of the corresponding
  state of affairs, or explicitly collapse the two. And it should not quietly identify
  the proposition with the sentence that expresses it; if it does, say what is lost.


  Then tell me: which subsets of these are jointly unsatisfiable — that is the part
