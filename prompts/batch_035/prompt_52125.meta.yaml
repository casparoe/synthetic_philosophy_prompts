  Summary should be plausible, mostly right, with one or two subtle misrepresentations.
  Moral trade: the idea (Bostrom, "Moral Trade" paper; also Ord, Krister Bykvist?)
  — moral trade between agents with different moral views, e.g., vegetarian pays meat-eater
  to abstain. Common misrepresentations: conflating moral trade with compromise/CVon
  average of moral views; claiming it requires interpersonal utility comparisons;
  claiming it refutes moral disagreement (shows disagreement doesn''t matter); conflating
  with moral uncertainty (MacAskill, Ord, Will MacAskill "moral parliament"). A subtle
  error: "since both parties expect to benefit by their own lights, moral trade shows
  that moral disagreement is really just like disagreement about the weather — no
  one is really wrong." Or: presenting that moral trade only works between altruists
  who care about outcomes in the world.


  Write a friend''s summary with one or two subtle errors:

