  (3) Character is not chosen; it''s a matter of genetic endowment and upbringing,
  i.e., brute luck.

  (4) If a choice is fully explained by unchosen factors, holding someone responsible
  for it is unfair.

  (5) So every choice is ultimately a matter of brute luck.

