  ---


  I''m writing the final for an upper-level undergraduate seminar on the philosophy
  of death (about 20 students, mostly philosophy majors who have read the standard
  literature). I want one essay question, answerable in ninety minutes, on whether
  death is bad for the one who dies. It must not be answerable by reciting the symmetry
  argument or by reciting the deprivation account''s textbook slogan. The question
  must be built around the following case, which I want printed verbatim on the exam
  paper:


  Marisol is sixty-eight. Next Tuesday, an aneurysm will rupture, and she will die
  instantly and painlessly. In the nearest world in which she does not die then —
  the surgical team intervenes — she lives eight more years: seven of them dominated
  by a degenerative illness she experiences as unrelieved misery, containing exactly
  one thing she values, a single afternoon, three years in, when her estranged son
  visits and they reconcile. By any reasonable aggregation the eight years are much
  worse for her than nothing; the afternoon is, by her own lights, worth a great deal;
  and there is no other world nearby in which she lives longer or better.


  The question should force three confrontations. First, the comparative structure
  of the deprivation account: if death is bad for its victim when, and only when,
  the life cut short contains more good than the life actually lived, Marisol''s death
  looks good for her, not bad — and the student has to decide whether the account
  can really say that, and whether the one irreplaceable good afternoon changes the
  verdict or only the story we tell about it. Second, the timing problem: if her death
  is bad for her — or good for her — when is it so, given that there is no moment
  at which she is both existing and dead, and the student must not be allowed to get
  away with "it is bad eternally" or "it is bad at no time" without arguing for which.
  Third, the antemortem move: the proposal, familiar from the literature on posthumous
  harm, that the subject of the misfortune is the living Marisol, whose interests
  survive her death and can be set back afterwards — the student must say whether
  this rescues the timing problem or merely relocates it to the question of when the
  living Marisol suffered a setback that no one, including her, ever noticed.


  Then give me: (a) the exam question as it would appear on the paper, in about 150
  words; (b) a model answer of about 600 words that shows the standard a top student
  could actually reach in ninety minutes, not the ideal answer an examiner with unlimited
  time would write; (c) a marking scheme with five must-hit points totaling 25 marks,
  each with the marks it is worth and a one-line note on how candidates typically
  botch it; and (d) a short closing note on what separates an A from a B — the specific
  move the A answer contains that the B answer, which is otherwise competent and well-informed,
  always lacks. One additional constraint: no part of the question or the model answer
  may rely on quoting Lucretius, Epicurus, or any other text; paraphrase only.


