  Bauman''s line, roughly: the Holocaust wasn''t a relapse into barbarism that modernity
  happened to fail to prevent — it was modernity working, bureaucracy, division of
  labor, technical discipline, authority substituting itself for moral judgment. The
  people who ran it mostly weren''t monsters; they were ordinary men at a distance
  from consequences, following the logic of their roles. Moral sleeping-in, he calls
  something like that — the capacity to act morally gets suspended when authority
  and routine take over.


  So the problem: Spielberg''s film kind of needs two things that Bauman says modernity
  makes impossible. It needs Schindler, the individual whose conscience wakes up and
  who then operates inside the system (bribes, connections, playing the game) to save
  his workers — is that Bauman vindicated (only someone who gamed the machine from
  within could do anything) or refuted (moral agency survived just fine)? And it needs
  Göth, the commandant, who is a sadist and a monster — pure personal cruelty, decisions
  made for pleasure and spite, not routine or paperwork. Doesn''t the Hollywood version
  of evil as legible individual pathology just undo Bauman''s whole point about the
  ordinariness of the perpetrators? Or is Göth actually an honest concession that
  the camps contained some genuine sadists alongside the sleepwalkers and that the
  film is only showing one slice?


