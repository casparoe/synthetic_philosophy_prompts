  tracking theories). The journalist could report gut verdicts on cases: source misled
  but got it right; story killed by editor that turned out wrong; etc.


  Alternatively Type 2: procedure — but Type 1 seems nice: a journalist reflecting
  on which of their past stories they''d say they "knew" were true when published.
  The tension: tracking intuitions vs closure. The journalist''s verdicts: some cases
  where they say they knew despite not tracking (e.g., trusted a source who happened
  to be right), and closure cases (I knew the documents were authentic; the expert
  certified them; so I knew the story — but if documents had been forged, expert would
  have certified anyway?).


