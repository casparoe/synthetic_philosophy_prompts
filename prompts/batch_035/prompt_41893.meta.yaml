  I''m a journalist — I write about science and ideas, mostly explainers and essays,
  and I''ve got a slot at a public "festival of ideas" type event next month. My talk
  is about the Condorcet jury theorem, and my thesis is basically: this is the most
  misquoted result in popular social science. The TED-talk version says "big crowds
  are wise." What the theorem actually says is a conditional: IF each voter is independently
  better than a coin flip, THEN majority rule gets more reliable as you add voters.
  And the conditional is doing all the work. The part nobody mentions is the twin
  result — same math, if voters are below coin-flip accuracy, majorities get *worse*
  as the group grows, more reliably wrong. And in real electorates and real juries,
  errors aren''t independent: people share information, read the same papers, get
  hit by the same mood. Once you allow correlated errors, the theorem stops telling
  you that adding voters helps — so the honest version of the talk is "the wisdom
  of crowds is a conditional, not a law of nature, and we''re terrible at checking
  whether the condition holds."


