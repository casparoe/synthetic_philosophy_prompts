  as conditions of action/happiness but he says life needs history.

  3. Claiming the "suprahistorical" men at the end of section 1 are Nietzsche''s heroes
  — he actually distances himself from them ("we others") — they conclude history
  is over; Nietzsche says he wants to keep living.

  4. Technical term in everyday sense: "critical history" sounds like "critical thinking"
  / critical theory — could make the summary say critical history means approaching
  history critically like a critical thinker, i.e., being skeptical of sources, when
  actually it means judging and condemning the past, bringing it before the tribunal,
  daring to destroy it.

  5. Conflating monumental history with "great man theory" endorsement — Nietzsche
  actually notes monumental history''s danger: it flattens differences, makes the
  past seem like a stilted costume parade, and can be abused to justify present evil
