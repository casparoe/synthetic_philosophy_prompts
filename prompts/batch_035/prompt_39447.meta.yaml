  I''m taking a graduate seminar on the ethics of rescuing, and I''ve been assigned
  the task of defending aggregation in life-saving cases against the anti-aggregationist
  position made famous by John Taurek''s paper "Should the Numbers Count?" I want
  to rehearse this debate against a smart opponent rather than a strawman, so please
  play a committed anti-aggregationist philosopher: someone who holds, roughly, that
  in a choice between saving one stranger and saving five, the fact that there are
  five does not itself give me any reason to save the five, and that fairness to each
  person threatened requires giving each an equal chance at survival rather than maximizing
  lives saved. Give the character real philosophical resources — the thought that
  each person''s death is equally a total loss for that person whether the others
  exist or not, the claim that there is no further loss "owned by the group," the
  fairness of equal chances, and a healthy suspicion of treating people as mere sites
  of impersonal value — and let the character deploy them sharply, conceding minor
  points (say, that numbers matter for logistics or for how we describe outcomes after
  the fact) but never the main one. Stay in character until I write "stop," and keep
  each reply to roughly one paragraph so it reads like a live seminar exchange rather
  than a lecture.


  Here is my opening move. Consider the case where I can administer a drug to save
  one drowning stranger or, with the same single dose, save five strangers who are
  each in equally desperate need, each losing exactly what the one would lose: their
  whole remaining life. When I save the one instead of the five, there is one person
  whose life is saved and four additional people, each of whose remaining life is
  lost. Those four extra losses are not losses of some mysterious sixth entity called
  "the group"; they are losses of four individual people, exactly the kind of loss
  you already agree counts against an outcome when it happens to one person. So my
  claim is this: I don''t need to add anything across persons to get a reason to save
  the five — the separate, unaggregated losses of four additional individuals are
  already reasons, and they are reasons you yourself accept in the one-person case.
  How do you deny me the five without denying the one?


