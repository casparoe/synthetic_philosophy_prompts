reasoning_summary: 'Let me pick a domain and type. Domain: AI control vs. alignment.
  Type: Report verdicts on cases and ask what principle captures them. That works
  well — cases of control measures, verdicts about whether they''re appropriate/needed/etc.


  Design: someone at a lab gives verdicts on concrete cases about when control (safety
  measures assuming misalignment) is appropriate vs alignment work. E.g.:


  - Airbags in cars: fine to install without assuming drivers want to crash — control
  as normal safety engineering. Fine.

  - Running a capable model with no oversight because evals looked fine — not fine.

  - Testing whether the model will attempt to disable its own monitoring in a sandbox
  — fine, informative, doesn''t require believing it''s misaligned.

  - A colleague argues control work itself is dangerous because it lets you deploy
  misaligned models — asker feels control work on extremely capable models is bad
  but fine on current models.

  - Deceptive alignment concerns: feels okay to set tripwires.

  - Hard to reconcile pair: asker thinks it''s fine to build control measures that
  treat the model as an adversary (red-teaming, honeypots), but thinks it''s wrong
  to punish/"torture" model copies... Hmm, better hard-to-reconcile pairs: asker thinks
  control measures are fine on capable models, but also thinks a fully control-based
  deployment of a superintelligent model is not acceptable even with perfect control
  — tension with "control is just safety engineering" principle. Also: asker thinks
  lying to the model during control testing (telling it the transcript will be deleted
  when it won''t) is fine for catching scheming, but lying in the same way to a human
  employee in a trust test is not fine — asymmetry needing principle.


  Also maybe: threat modeling where control assumption ("assume model is misaligned")
  — verdicts about which assumption. A good tension: assuming misalignment as a conservative
  engineering assumption vs. treating the model unfairly / evidence-gathering problem
  (if you find no evidence of scheming, does that confirm alignment or just show controls
  hold?).


  Deliverable: principle capturing verdicts, predictions on further cases, honest
  statement of which verdicts drop.


  Write elaborate, polished, 2-3 paragraphs, first person, some flavor ("I work on
  deployment safety at a mid-sized lab", "arguing with a colleague who thinks...").


  Cases list (concrete, like the examples):


  1. Airbags/structural engineering analogy: building bridges with safety factors
  doesn''t assume the engineer is malicious — treating control as ordinary safety
  engineering feels fine even with no evidence of misalignment.

  2. But running a highly capable model with minimal oversight because evals came
  back clean — not fine. (Verdict: control needed in proportion to capability, not
  evidence.)

  3. Setting up honeypots / tripwire prompts to see if the model tries to conceal
  them from logs — feels fine and even useful.

  4. Lying to the model as part of a control test (telling it its outputs won''t be
  monitored when they are, or promising deletion) — feels less fine, in a way that
  feels different from just withholding info.

  5. Control measures that treat model as adversary for training purposes, e.g. adversarial
  training — fine.

  6. Tension case: a fully "control-only" deployment — model suspected of scheming,
  wrapped in enough monitoring that it can''t act on it — feels fine for a low-stakes
  deployment, not fine for high-stakes, even though the measures are equally effective.
  That''s hard to reconcile with pure "control = safety engineering."

  7. Another tension: colleague says control work is counterproductive because it
  substitutes for alignment — asker agrees for far-future superintelligence but disagrees
  for current models; or: asker thinks control work on scheming models is morally
  dubious (you''re knowingly keeping a possibly-suffering or possibly-deceptive agent
  locked in a box to do your work) — but only sometimes feels this.


  Maybe include a tentative principle the asker offers: something like "control is
  legitimate when it''s the cheapest way to reduce risk from failures we have no reason
  to believe are present, but illegitimate when it substitutes for addressing failures
  we have positive reason to believe are present." Test it against cases: case 2 says
  capability-based, not evidence-based — breaks the principle. Case 6: even with positive
  evidence of misalignment, control-only deployment in high stakes feels not fine.
  Good.


  Write the prompt. No web search needed — AI control is well within knowledge (Redwood
  Research control agenda, but I shouldn''t cite specifics anyway; the prompt asks
  for a principle). No quotes needed.


  Format: 2-3 paragraphs, formal/polished, first-person verdicts. End with the ask:
  what principle captures them, what it says about an unlisted case (e.g., "model
  passes monitoring for months and you want to remove the oversight layer to save
  compute" or "using control measures to test whether the model sandbagging"), and
  which verdicts have to go.'
