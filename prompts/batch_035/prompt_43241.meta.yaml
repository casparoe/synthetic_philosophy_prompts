  ---


  Last weekend my oldest friend and I spent a four-hour drive back from a wedding
  arguing about what corruption actually is, and we ended up in an odd place: I could
  list his verdicts on a series of cases, but I couldn''t extract a stable principle
  from them, and now the argument has moved into my head and won''t leave. His verdicts,
  as best I can reconstruct them: a customs officer who waves through a truck of undeclared
  goods for a fee — corrupt, obviously. The senior surgeon at the hospital where he
  did his training, who accepts an expensive bottle of whiskey from a grateful family
  after a successful operation, in a country where this is routine, technically against
  hospital policy, with no expectation on anyone''s side that it changes anything
  — distasteful, he said, but not corrupt. A member of congress who steers a defense
  contract toward a major donor using only legal channels — contributions, lobbying,
  a perfectly regular procurement process — corrupt, even though nothing illegal happened.
  A municipal councillor in the small town his parents come from who gives a road-crew
  job to his unemployed cousin, who is as qualified as anyone else on the list and
  does the work properly, in a place where nobody, including the losing applicants,
  considers family preference wrong — not corrupt. A border guard who expects a small
  fee to move a family''s paperwork at all, in a system where every guard expects
  it and everyone knows — corrupt, and here he was completely firm, though he couldn''t
  say why this one differs from the surgeon. A local patron who delivers real public
  works to his supporters while making sure a rival neighborhood''s projects stall
  — corrupt, he insisted, even though the supporters genuinely benefit and he never
  pockets anything himself.


  Two new cases came up as we were pulling into the city and we never resolved them.
  Case A: a clerk who accepts a modest payment to stamp documents the same day he
  receives them, when he''d stamp them within a day or two anyway; he never refuses
  or delays anyone who doesn''t pay, and no one has ever been worse off by any measurable
  amount. Case B: a licensing official, moved by neighborhood loyalty and taking nothing
  for himself, quietly shelves applications from the other side of town for months,
  and two businesses go under waiting. Predict his verdict on each, and be honest
  about your confidence. Then do the real work: lay out the candidate principles that
  fit his track record equally well (at least two do, I''m fairly sure, and several
  obvious ones — I checked — do not), say what each predicts for A and B, and tell
  me which principle you''d bet he''s really running and why. Finally, name the single
  further case that would best discriminate between the surviving principles, including
  their close variants, and tell me what verdict on that case would confirm which.


  ---


