  not corrupt) and partially V6 (pockets nothing, still corrupt — no wait, V6 corrupt
  fits that rule; V4 kills it). "Private enrichment" narrow: V6 corrupt with no self-enrichment
  kills it? V6: patron delivers public works to supporters, doesn''t pocket — "private
  enrichment" rule struggles → good, kills narrow-enrichment. So surviving: R1 harm-based,
  R2 exchange-based. And "I checked" — the asker says "(at least two do, I''m fairly
