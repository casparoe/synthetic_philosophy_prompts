  Death, wants decision-theoretic framing... Rank/rate or restate. Death in Damascus
  is the Gibbard-Harper story about meeting Death in Damascus/Aleppo. A novelist writing
  a story where a character learns they''ll die in a certain city and tries to outrun
  it — asks which decision theories handle it, rank them. That''s fun but maybe leans
  on niche knowledge (causal vs evidential decision theory, counterfactuals). It''s
  moderately known.


  Let me go with "What is life?" — definitions and borderline cases. Type: Rank. The
  novelist is writing a near-future novel about something borderline: e.g., a self-replicating
  3D-printed factory system on the Moon, or a virus-like software, or grey goo, or
  a synthesized minimal cell. Ask model to rank definitions of life (NASA''s working
  definition, autopoiesis, thermodynamic definitions like Schrödinger''s negentropy,
  evolutionary definitions, metabolism-replication combos like the Gánti chemoton)
  by how well they handle a set of borderline cases the novelist invents. Seeding:
  give specific borderline cases — a virus, a hypothetical RNA-only replicator in
  a soup, a mule (sterile), a forest as superorganism, a Von Neumann probe, a crystalline
  replicating mineral in a cave, a dormant spore. This is nice: novelist needs consistent
  world-building rules about what counts as alive.


  To make it in-the-weeds, include specific invented cases: e.g., in the novel, a
  lab creates "the Ancestor" — a lipid vesicle with a replicating RNA genome and no
  metabolism beyond template copying, and later a fully self-repairing robotic ecosystem.
  Also the chemoton concept — Gánti''s chemoton is a real concept (real, reasonably
  well-known to LLMs). Autopoiesis (Maturana/Varela). NASA''s "self-sustaining chemical
  system capable of Darwinian evolution" is real. Schrödinger''s What is Life negentropy/feed
  on negative entropy. These are well-memorized.


  Ask for a ranking with scores, maybe a "verdict for each case." Also ask which definition
  does worst at the invented cases, and a tie-break.


