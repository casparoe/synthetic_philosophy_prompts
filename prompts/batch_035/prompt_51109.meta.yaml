  Draft:


  "I''m a novelist working on a near-future book where a corporate lab builds what
  they claim is the first genuinely new life form — basically a membrane-bound droplet
  that runs a replicating RNA-like genome, harvests energy from a chemical gradient,
  and can mutate, but it cannot synthesize its own membrane parts, so it "reproduces"
  only when the lab medium supplies them. Sort of halfway between a virus and the
  simplest cell, and the plot turns on whether characters treat it as a discovery
  or an artifact — so I need the definitions of life to do real narrative work, not
  just vibes.


  Before I lock in the plot logic, I want a proper ranking. Take the main candidate
  definitions — the NASA working definition (a self-sustaining chemical system capable
  of Darwinian evolution), autopoiesis, Schrödinger-style thermodynamic accounts (life
  as local pockets that maintain/order against entropy by exporting disorder), metabolism-first
