  views can''t say things we all want to say. Dana ended by saying fine, maybe population
  ethics is just a mess and there''s no consistent view, and Marcus said that was
  giving up.


  Can you go through the four moves and adjudicate who''s right at each step, plus
  say who comes out more right overall? Also curious if there''s an angle neither
  of them brought up.


