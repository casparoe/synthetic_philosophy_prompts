  population of very happy people with excellent lives, there''s some much larger
  population whose members each have lives that are barely worth living, which is
  better overall, if you add up welfare. He said this follows pretty directly from
  total utilitarianism (just keep adding people with lives a tiny bit above zero)
  and that total utilitarianism is right, so we should just accept that the huge world
  is better. Dana said any view with that implication is broken and should be rejected,
  not celebrated.


  (2) Dana proposed average utilitarianism instead: what matters is average well-being.
  Marcus said that''s worse: a world with exactly one person whose life is 5% better
  than anyone''s life in our world would rank above a world of ten billion people
  each with fantastic lives, since the single person''s average is higher. Dana conceded
  that was bad but said at least it doesn''t have the repugnant implication.


  (3) Dana then tried a critical level view: adding a person makes the world better
  only if their welfare is above some positive threshold, say a life that''s comfortably
  good. Marcus said that creates the opposite monstrosity: adding a happy person whose
  life is worth living but below the threshold would make the world *worse*, even
  though it adds a life that''s good for the person living it and hurts no one.


  (4) Dana''s last move was person-affecting: she said the reason the repugnant conclusion
  is repugnant is that when you compare the world of ten billion flourishing people
  with the huge barely-positive world, no one in the first world is made worse off
  by the second world existing instead, so in what sense is it worse *for* anyone?
  Claims of betterness need a victim. Marcus replied that by that logic it''s also
  not better for anyone when you add a billion blissful lives to a world, and Dana''s
  view can''t even say that a world where everyone is a bit happier AND there are
