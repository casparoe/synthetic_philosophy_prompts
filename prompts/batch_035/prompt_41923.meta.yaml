  ---


  You are a senior legal philosopher; I''d like careful, stepwise reasoning rather
  than a first-pass verdict.


  I''m a PhD student in philosophy, working on jurisprudence. In our Hart–Fuller reading
  group a colleague reconstructed the grudge informer case as a direct refutation
  of the separation thesis, and the argument seemed airtight until I noticed it proves
  far too much. Here it is:


  (1) According to legal positivism, whether an enacted norm is valid law in a given
  system depends on its sources — whether it was produced through the system''s recognized
  procedures — and not on its moral merits.

  (2) The Nazi statutes under which the grudge informer denounced her husband in 1944
  were produced through the recognized procedures of the German legal system.

  (3) So, on positivism, those statutes were valid law in 1944, and the courts that
  applied them were identifying the law correctly.

  (4) Identifying the law correctly is all that fidelity to law requires of a judge;
  whatever else fidelity demands, it cannot demand misidentifying the law.

  (5) The post-war German court that declined to treat the informer''s act as lawful,
  and convicted her under the 1871 Criminal Code instead, therefore either misidentified
  the law or abandoned fidelity to law.

  (6) But that court''s decision is paradigmatically legal reasoning, not disguised
  retroactive power; a theory that brands it lawless is not a theory of our concept
  of law.

  (7) Therefore positivism''s separation thesis is false: at some threshold of iniquity,
  validity does depend on moral merits.


  Where it seems to prove too much: substitute any admitted valid-but-wicked statute
  — the Fugitive Slave Acts, say — and the same argument yields that judges who applied
  it misidentified the law, that judges who refused to apply it were legally in the
  right without any legal basis, and that every wicked statute was never really law.
  My colleague cheerfully accepts this. I don''t, but I also can''t find the misstep.
  Step (4) is where I feel the pressure, since something seems to slide between identifying
  the law and being bound to apply it — but if that link goes, I owe an account of
  what a judge''s duty to apply valid law amounts to on positivist terms.


  Which step should be rejected, and why did it look fine? Before committing, please
  map out briefly what each of the main ways of resisting the argument (rejecting
  (4), rejecting (6), biting the bullet on (7)) costs, then tell me which you''d pay
  and why. I care less about which camp wins than about seeing exactly where the proof-too-much
  machinery engages.


