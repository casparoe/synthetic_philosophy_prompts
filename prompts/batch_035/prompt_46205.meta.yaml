  Summary with subtle errors:

  - "Strawson''s Basic Argument says determinism makes free will impossible, so because
  physics tells us everything is determined..." — wrong, argument is independent of
  determinism/indeterminism.

  - "Since we''re not responsible for how we were born and raised, nothing we do is
  our fault, so nobody deserves blame for anything, not even ordinary-level blame"
  — conflates ultimate responsibility with ordinary responsibility; Strawson explicitly
  keeps ordinary reactive attitudes (though he has a separate argument about that
  being fine).

  - "To be truly responsible you''d have to have created yourself out of nothing,
  a logical contradiction since something can''t exist before it exists" — Strawson''s
  causa sui point; the subtlety: he says it''s impossible not just logically but even
  for God, and the regress of "responsible for how you are" isn''t literally "exist
  before you exist."

  - "This is just hard determinism rebranded / conclusion that punishment is unjust"
  — Strawson is not committed to no punishment; he distinguishes moral responsibility-desert
  from consequentialist justification.

  - Maybe: "Strawson thinks this means criminals should never be held accountable"
  — overstatement.


  Also another subtle one: the regress — "you''d need to be responsible for the character
  you have at the moment of choice, which requires earlier choices, which requires
  earlier character..." — correct. The misstatement could be presenting it as relying
  on the past being fixed (which would smuggle in determinism).


