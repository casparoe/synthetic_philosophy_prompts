  Dollar auction (Shubik 1971): auction of a dollar bill; highest bidder gets the
  dollar, but the second-highest bidder must also pay their bid and gets nothing.
  Bids rise. Once bids exceed $1, both bidders are losing, but each faces: if I stop,
  I pay my current bid for nothing; if I bid slightly more, I might win the dollar
  and only pay my (new, slightly higher) bid, while the other pays their bid. So the
  incremental comparison: bid 5 cents more → expected outcome improves relative to
  standing pat, in the short run. So myopically rational escalation, globally catastrophic
  — total payments often far exceed $1.


  So the disagreement could be: Person A: "continuing past your limit is the sunk
  cost fallacy, full stop." Person B: "in a dollar-auction structure, the incremental
  reasoning isn''t fallacious — it''s locally correct; the failure is at the planning
  level: you should have committed ex ante not to play / set a hard exit. So the fix
  is different: not ''ignore sunk costs'' but ''never enter games where every subsequent
  choice looks better than stopping.''" Then A: "that''s just a policy-level version
  of the sunk-cost lesson." B: "no — the sunk-cost lesson as usually taught (''the
  money spent is gone, only future costs and benefits matter'') would actually tell
  you to keep bidding, because at each increment the future looks better if you continue.
  The usual advice is what traps you." That''s a genuinely interesting disagreement,
  well in the weeds.


