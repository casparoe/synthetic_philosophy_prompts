  Longtime LessWrong/EA Forum lurker here. So I''ve been in a slow-burning argument
  with a friend (we''re both software engineers, both read way too much Hofstadter
  and Dennett as teenagers) about the epistemic status of the Church-Turing thesis.
  My position: it''s not really a thesis at all, it''s closer to a definition or a
  convention — "effectively calculable" is a vague pre-theoretic notion, Turing machines
  are the precise replacement, and once you''ve made that choice there''s nothing
  left to be true or false, any more than it could be false that there are exactly
  60 minutes in an hour. The fact that every attempt to precisify "computable" (lambda
  calculus, recursive functions, Turing machines, register machines, whatever) lands
  on the same class just shows we all had the same vague thing in mind, it doesn''t
  show some empirical discovery about the universe. My friend says this makes me a
  deflationist about something that''s actually one of the deepest claims ever made,
  and that I''d have to change my mind if a hypercomputer were built — I say no, a
  hypercomputer wouldn''t refute anything, it would just show that "computable by
  physical process" was a different notion than "computable by algorithm", which everyone
  already knew, that''s the physical CT thesis and it''s a separate thing.


  So here''s the ask: you''re a philosopher of mathematics who has actually taught
  computability theory, not an internet guy who watched a video about Turing machines.
  Think carefully before answering, maybe brainstorm a couple of framings first. Take
  my position — CT-the-mathematical-claim is definitional/conventional, and the physical
  version is a separate empirical claim that could be true or false — and tell me
  what would count against it. And I mean really against it, not just awkward. What
  would a committed deflationist concede as a genuine hit? Would a machine that computed
  the halting function do it? Would it matter whether the machine ran forever or consulted
  a genuinely random oracle? If Penrose turned out to be right about noncomputable
