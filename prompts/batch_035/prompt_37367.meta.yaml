  I drive a delivery van round greater Manchester and do most of my philosophical
  thinking stuck in traffic. For about a year now I''ve been chewing on one question:
  when you can save one group of people or another, and the groups are different sizes,
  do the numbers matter? Like, you''re on holiday, there''s a drowning swimmer on
  your left and five drowning swimmers on your right, you can only get to one in time.
  My mates are split on it and honestly so am I.


  Arguing about it down the pub, I''ve started noticing people sort into rough types,
  my own little folk taxonomy:


  - the adders: just add the lives up, five beats one, full stop

  - the flippers: no matter the numbers, everyone at risk deserves the same chance,
  so flip a coin — I gather some bloke in the 70s argued this, Taurek I think his
  name was

  - the thresholders: one versus one and flip away, but at some point the numbers
  have to start counting, even if people disagree where the line is (is it at 3? 20?
  50?)

  - the duelists: you can only compare claims one on one, each of the five faces the
  one separately, so the five never get to gang up — the sum never gets made in the
  first place


  And then there''s a fifth thing that keeps coming up that cuts across all of them:
  what if one of the people is your mate? Some people who are dead-set adders suddenly
  aren''t, if the one is their best friend and the five are strangers.


  Anyway, I want to turn this into a quiz for a forum I post on (we do a monthly silly-but-not-that-silly
  poll). Please design it for me. Some requirements:


  1. About eight questions, each a short concrete scenario with two or three options.
  None of them should name a theory or a philosopher — the people taking it havent
  read anything and would just guess or take the mick. It has to sort them by what
  they''d actually do.

  2. Use cases that split the types above. In particular I want a question about whether
  it matters if the five are all clustered together (one sinking dinghy with five
  people in it) versus scattered (five separate swimmers spread along the beach) —
  I''ve noticed people go different ways on that and I can''t tell if it tracks a
  real philosophical difference or just vibes. Also a question where the numbers are
  even on both sides but one side contains a friend. And a couple of escalating ones:
  one vs one, one vs two, one vs five, one vs fifty, so we can find where a thresholder''s
  line is if they have one.

  3. Then a scoring key at the end mapping answer patterns onto positions. Here''s
  where I want you to actually think rather than just mirror me back at me: first
  brainstorm what the real map of positions on this question is (I''ve heard the phrase
  "limited aggregation" banded about and suspect my thresholders and something like
  that overlap, but also that the duelists and flippers might be genuinely different
  views that I''ve muddled together — tell me). Then build the key from the questions
  up, and for each ending say what the most awkward commitment of that view is, the
