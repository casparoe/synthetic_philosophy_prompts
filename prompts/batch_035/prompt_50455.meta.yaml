reasoning_summary: 'Let me pick a domain and type. Good combos:


  - Knobe effect + "Report one''s verdicts on a set of cases and ask what principle
  captures them" — very natural. The asker gives their verdicts on side-effect cases
  and asks what principle captures them. This fits the type perfectly and lets me
  inject niche new cases (invented ones) to avoid regurgitation.


  - Ubuntu + analyze episode through lens of theory — e.g., Truth and Reconciliation
  Commission through Ubuntu lens. Also good.


  - Eliciting latent knowledge + thought experiment — could construct cases.


  The Knobe effect + verdicts type is the strongest. I need concrete cases with verdicts,
  including a hard-to-reconcile pair. The Knobe effect: harm side effects judged intentional,
  help side effects judged not intentional. I should inject novel cases so the model
  can''t just recite the standard chairman case. Also include a twist pair that''s
  hard to reconcile.


  Design: asker gives their verdicts on several side-effect cases, some novel:

  - Standard-ish: CEO harms environment for profit — intentional.

  - Help version: helps environment as side effect — not intentional.

  - Novel: a manager who adopts a policy knowing it will harm a colleague''s career,
  but she actively hopes it won''t, votes against it, and it happens anyway — asker
  says not intentional? Or intentional?

  - A case where the agent brings about the side effect by omission.

  - Knobe & Fraser''s chairman case is famous; I''ll invent new ones to keep it in
  the weeds.


  Hard pair to reconcile: e.g., the asker judges harm intentional when foreseen but
  incidental, but NOT intentional when the agent foresaw it and benefited but expressed
  regret and would have preferred otherwise. Or asymmetric verdicts on norm-violation:
  violating a rule (overcharging) vs violating a moral ideal (failing to donate).


  Also maybe include a case where the side effect is good but norm-violating (e.g.,
  secretly reading roommate''s diary reveals roommate is planning something dangerous
  and prevents harm) — asker says intentional? That''s the converse-Knobe territory
  (Knobe''s follow-up work on norms: immoral but helpful side effects judged intentional-ish).
  Keep it accessible.


  Also ask about what the principle says about a further case, and whether some verdicts
  must go. Tentative principle option: asker could offer "I blame someone for side
  effects when they violated a moral norm, and ''intentionally'' tracks blame" and
  ask for testing.


  Keep casual, a few sentences-ish (can be a paragraph or two), maybe a typo. No quotes
  needed. No need for web search — all invented cases, no verbatim quotes. The Knobe
  effect is well-known enough.


  Let me write it.


  Draft:


  "I''ve been going through my gut verdicts on side-effect cases, trying to figure
  out whether ''intentionally'' for me tracks anything coherent, and I want a principle
  that fits them. A CEO who starts a program to boost profits knowing it will wreck
  a nearby wetland, and doesn''t care: he harmed the wetland intentionally. Same CEO,
  same program, but the side effect is that the program happens to clean up the wetland,
  which he doesn''t care about either: he didn''t help it intentionally. So far so
  Knobe. But: a middle manager who knows a reorg will gut a colleague''s pet project
  as a side effect, personally hates that it will, says so in the meeting, and votes
  no — the reorg passes anyway. I say she did NOT harm the project intentionally,
  even though she knew and it happened. And here''s the weird one: my roommate reads
  my diary without permission, and what she learns is that I''m about to make a terrible
  financial decision, which she then quietly blocks with the bank; I''m grateful but
  I also feel like she intentionally violated my privacy, whereas the standard Knobe
  intuition says a helpful side effect isn''t brought about intentionally. Also, a
  pharmacist who quietly undercharges struggling customers, at small cost to the chain:
  I''d say she''s intentionally helping them, even though helping wasn''t her assignment.
  Is there one principle — maybe something about norms, or blame and credit, or what
  the agent was ''on the hook'' for — that gets all of these? And whatever principle
  you land on, tell me its verdict on a case I''m stuck on: a landlord who leaves
  rents below market, knowing tenants benefit as a side effect of his laziness about
  paperwork — did he intentionally help them?"


  Check: cases concrete, verdicts mostly sensible, one hard pair (roommate: helpful
  main-effect-adjacent but norm-violating → intentional; the Knobe pattern says helpful
  side effects aren''t intentional). The manager case (regret/vote-no) vs CEO case
  (doesn''t care) — hard to reconcile if principle is just foreknowledge. Good tension.
  Pharmacist case: norm-violating (against employer rules) but helpful → intentional
  — consistent with norm view. The roommate case: helpful but norm-violating → intentional
  violation — norm view handles. So the norm-based principle (Knobe''s own later view:
  side effects that violate norms are intentional, norm-conforming ones not) can save
  most, but manager case is the pressure point? Actually the manager case: the reorg
  violates norms? She personally votes no — maybe she''s not the agent, she dissented,
  so the collective action harmed it. That''s a nice structural point.


  Add a typo or two, keep casual. Ask for principle, its verdicts on unconsidered
  cases, and which verdicts must go. Also might mention "or is ''intentionally'' just
  not one thing here."


  Length: fine as one paragraph-ish. Maybe split into two short paragraphs.'
