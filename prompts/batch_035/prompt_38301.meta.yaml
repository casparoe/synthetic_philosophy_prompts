  prompt. Novelists deal with sunk costs constantly — finishing a novel, abandoning
  drafts. The sunk cost fallacy fits a novelist nicely. Which type?


  Type 1: Predict a verdict on a new case from someone''s verdicts on earlier cases.
  E.g., a novelist friend who has made decisions about abandoning drafts, walking
  out of movies, finishing a degree, staying in a book club, etc. — and asks about
  a new case. That works well.


  Or Type 2: sorting quiz about sunk costs — "which view of sunk costs do you actually
  hold?" quiz for a blog. Novelist could write that.


  Or Type 3: procedure for a novelist deciding whether to abandon a manuscript. Sunk
  cost fallacy operationalized as a decision procedure for a novelist deciding whether
  to keep writing a stalled novel. That''s very natural! A novelist wants a procedure
  to decide when to shelve a draft vs. push through, grounded in rational treatment
  of sunk costs — the principle being "is honoring sunk costs always irrational?"
  The procedure must handle cases where sunk-cost-honoring seems rational (e.g., finishing
  for craft-learning, signaling, option-value reasons).


  Type 3 seems great: "Turn a principle into a procedure a practitioner can follow."
  The principle: sunk costs are rationally irrelevant / the sunk cost fallacy. But
  the philosophical debate (e.g., by people like ... there''s literature arguing sunk
  costs can be rational — e.g., "sunk costs and the welfare of future agents," collective
  sunk costs, honor) — the novelist doesn''t need citations. The procedure: questions
  to ask about a stalled manuscript. Worked applications: two or three cases including
  one where the procedure gives an answer the asker won''t like. This fits beautifully:
  the novelist asks for a procedure to decide whether to keep writing, abandon, or
