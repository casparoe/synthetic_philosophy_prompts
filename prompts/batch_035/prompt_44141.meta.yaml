  The advice type: concrete situation instantiating a philosophical problem. Good''s
  theorem on value of information: a situation where you must decide whether to pay
  for information that will never change your action — e.g., a decision where you''d
  do the same thing regardless of the test result, so the information has no decision
  value, but you feel like knowing would still be worth something. That instantiates
  Good''s theorem: information is valuable only insofar as it can change your action;
  if the posterior expected value of the optimal action with information equals the
  value without, the information is worthless (in the expected-value sense). Good''s
  theorem: the expected value of information is nonnegative — and zero exactly when
  the optimal action is the same for all signal realizations.


