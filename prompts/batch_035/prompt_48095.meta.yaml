reasoning_summary: 'Pick domain: inheritance taxes/dynastic wealth/equal opportunity.
  Type: presuppositions of a practice. That fits well: e.g., the fact that most tax
  systems tax inheritances as receipts by heirs (or not at all), or the estate tax
  treats wealth transfers at death, or gift inter vivos exemptions. A good presupposition
  prompt: practice = tax systems treat earned income more harshly than inheritances
  (inheritance/estate taxed lightly or not at all), while claiming commitment to equal
  opportunity. Or: countries tax gifts and bequests at death but allow inter vivos
  gifts up to thresholds, and treat inheritance as income of the recipient in some
  places... Something concrete and known.


  Could also inject niche-ish angle: e.g., "dead hand control" — trusts that persist
  generations; the rule against perpetuities. That''s a nice concrete practice with
  philosophical presuppositions: law restricts dead-hand control via rule against
  perpetuities, yet allows dynastic trusts in some US states (perpetual trusts now
  allowed in many states since 1990s). Presupposes a view about the moral standing
  of the dead, intergenerational obligation.


  Or simpler: estate taxes in most countries have large exemptions (only the very
  largest estates taxed), plus a policy rhetoric of equal opportunity. What theory
  of fairness does that presuppose? Is inheritance a violation of equal opportunity,
  or is the family itself the vehicle of opportunity? Also there''s a mismatch: tax
  systems tax income from labor more than inheritances in most places — presupposing
  that the moral basis for taxation is effort/earning rather than need or luck? Interesting
  inversion: the practice presupposes desert-based entitlement ("you earned it") applies
  to bequests as much as labor income.


  Also could incorporate: parental freedom to benefit children vs equal opportunity
  — the practice of allowing unlimited investment in children (education, gifts) while
  taxing large bequests. Ask what theory of the family/equal opportunity it presupposes.


  Write casually, British English, a typo or two, short-ish. No citations needed.
  Let me write it.


  Draft:


  "Something I''ve been chewing on: pretty much every country that says it believes
  in equal opportunity still lets parents pass wealth to their kids essentially untaxed
  below a very high threshold, and even where there''s an inheritance tax it''s usually
  the least enforced and most unpopular tax there is. But the same legal order is
  fine with breaking up other accumulations of unearned advantage — we ban buying
  grades, we ban bequeathing offices (that''s what the rule against perpetuities was
  partly about), and we don''t let the dead control property forever. So what does
  the way we actually tax (and mostly don''t tax) inheritances presuppose about fairness?
  Is it that the family is seen as the legitimate vehicle of opportunity — ''equal
  opportunity'' means equal starts for families, not individuals? Or a desert view
  where the earner''s claim extends to directing wealth after death? And do the bits
  of the practice point in consistent directions — e.g. why is a big bequest at death
  more acceptable than a trust that pays out at intervals for a century, if both are
  dynastic transfers? Reconstruct the implicit theory for me, tell me which rival
  views of equality the practice would also be compatible with, and what would have
  to change if we took aLuck-egalitarian view of inheritances seriously."


  Hmm, fix that typo: "a luck-egalitarian". Include a genuine typo or two ("beacuse"?
