  \ isn't bad if deaths aren't harms and suppressed wild lives were net-negative.\
  \ Nice crisscross.\n\nTension B (moderate): 1 vs 2. The reason given for beef (fewer\
  \ deaths) is idle if death isn't a harm; the verdict needs a suffering-based argument\
  \ (which may be available, but the asker's stated grounds don't deliver it). This\
  \ could also be the \"apparent\" one — partially dissolves because a suffering-per-calorie\
  \ argument can be reconstructed. Hmm — maybe classify it as tension that partly\
