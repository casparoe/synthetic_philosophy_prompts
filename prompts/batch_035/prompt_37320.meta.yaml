  \ grassland) vs 5 (pasture as good because wild animals live alongside livestock)\
  \ — if pasture supports wild animals whose lives are net-negative, pasture isn't\
  \ obviously good; but also grass-fed beef requires vastly more land than feedlot,\
  \ converting wild habitat to pasture — so even land-sparing arguments conflict.\
  \ Keep it manageable.\n\nThe prompt should ask: audit the set, rank tensions by\
  \ severity, say which have to give and what it costs, note which dissolve. Formal,\
  \ novelist perspective, American English, relatively short.\n\nNo quotes from real\
  \ texts needed — all paraphrase. No search needed. Good.\n\nDraft:\n\n\"I'm a novelist\
  \ four chapters into a book about a Montana ranching family, and the research has\
  \ unsettled my own habits along with my characters'. My position, as best I can\
  \ state it: (1) I've replaced chicken with beef in my own kitchen, on the ground\
