  everything reduces to perception\"? no, she accepts inference). Hmm, candidate rules:\n\
  \nRule A (Nyāya strict): exactly four pramāṇas; arthāpatti and anupalabdhi cases\
  \ are knowledge, but only via inference (anumāna). Testimony only from a reliable\
  \ speaker; comparison only via upamāna.\nRule B (Bhartṛhari/Vedānta-ish): śabda\
