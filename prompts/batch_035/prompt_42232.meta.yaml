  Draft:


  ---


  I am grading a take-home exam for an upper-level metaphysics course and would like
  an independent assessment. The exam question read:


  "A patient dies of a poisoning after her attending physician, though on duty and
  with the antidote at hand, never administers it. Explain why cases of this kind
  — causation by omission — create problems for theories of causation that require
  causes to be events, and why they threaten counterfactual analyses with a proliferation
  of causes. Then set out what you consider the strongest response and assess whether
  it fully succeeds."


  One student submitted the following answer:


  "The physician case is puzzling because the omission seems to cause the death: had
  the antidote been administered, the patient would have survived, so the death counterfactually
  depends on the failure to administer. The problem is that an omission is not an
  event — nothing happened — and if causes must be events, the physician''s failure
  cannot be a cause, even though we ordinarily hold the physician responsible for
  the death. There is also a proliferation worry: everyone else who failed to administer
  the antidote — the nurses, the janitor, every physician in the world — would equally
  count as a cause, since the death also depends on their omissions, and a theory
  that delivers infinitely many causes of this sort has lost its grip on the concept.


  The counterfactual analysis can answer the proliferation worry. In the closest worlds
  where some random stranger administers the antidote, the antecedent requires a large
  departure from actuality — strangers have no reason to do it — whereas the closest
  worlds where the attending physician administers it depart only slightly, since
  it was her routine duty. So the death depends on the physician''s omission but not
  on the strangers'', and the analysis avoids the proliferation. Phil Dowe takes a
  complementary line: on his account, omissions are genuine causes because the effect
  counterfactually depends on them, with dependence doing all the causal work.


  But there is an even simpler way to see that the case is harmless. The physician''s
  failure is just a case of double prevention. The antidote would have prevented the
  death; the failure to administer prevented the antidote from being given; and Lewis
  himself already accepted double prevention as genuine causation. Omissions therefore
  fall under a form of causation Lewis had already countenanced, and the event-causal
  theorist loses nothing by treating the physician''s failure as a cause in the ordinary
  way."


  Assign a letter grade and justify it with point-by-point comments: say what the
  answer gets right, and identify precisely where it goes wrong — including any misattributed
  views and any step that does not follow from what precedes it. Base the grade only
  on the answer''s content, not on style.


