  "Quick background so you know where I''m coming from: I''m a retired physical oceanographer.
  Forty years of measuring currents, mostly from ships and moorings, and now that
  I have time on my hands I''ve fallen down the philosophy of physics rabbit hole
  and I can''t get back out. I want to tell you about something that bugged me the
  whole career and only now do I have words for it.


  Practically everything we did assumed you could tell, from inside a sealed box,
  whether the box was rotating. A gyrocompass finds true north without ever seeing
  the sky — it works because the earth spins, and it knows it. Inertial measurement
  units... After storms, surface currents don''t just relax; they circle, clockwise
  in our hemisphere, with a period of about seventeen hours at our latitude — the
  books call it half a pendulum day — and that number is set by the earth''s rotation
  rate, though the water is just reacting to winds. Geodesists are even more explicit:
  they distinguish gravitation from gravity, where gravity is gravitation plus a centrifugal
  term from the spin. Somewhere in there an engineer always gets told which frames
  are inertial and which are rotating, and the correction terms (Coriolis, centrifugal)
  get added or subtracted, and nobody asks: rotating with respect to WHAT? The nearest
  big mass is the earth, and we''re rotating with it, not relative to it. The stars
  aren''t consulted. Newton had his spinning bucket, water climbing the sides, and
  said it turns with respect to absolute space. Mach later said, roughly, count the
  distant masses; if the bucket were alone in the universe the water would stay flat.
  And general relativity seems to hand the job to the metric field, which is neither
  nothing nor just a bookkeeping of matter relations — or at least that''s how I read
  it, correct me if I''m off.


  So here''s my question. Take the working practice — gyrocompasses, inertial units,
  geodesists'' gravity, oceanographers'' half-pendulum-day oscillations — as a going
  concern, like a lawyer''s rules of evidence. What does it presuppose about space
  or spacetime? Does the practice need Newton''s absolute space, or is it compatible
  with Mach''s answer, or does it quietly need something like the GR metric being
  a real physical thing with its own degrees of freedom? Where is it underdetermined
  — would several of these views license the same corrections? And if we switched
  the presupposed view, would anything in the practice actually have to change, or
  only the textbooks'' footnotes?


