  4. Moral trait expression in the wild: ecological validity of lab situations. Experience
  sampling and field designs.

  5. Whether normative virtue ethics needs any of this: does the empirical critique
  even touch the normative theory? Is the autonomous-normativity move defensible or
  question-begging?


  Criteria: importance (which downstream questions/normative applications depend on
