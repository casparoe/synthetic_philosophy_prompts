  Background: the critique, running from Mischel''s work on cross-situational consistency
  through the classic experiments (Milgram''s obedience studies, Asch''s conformity
  lines, Darley and Batson''s Princeton seminary study, the bystander research), culminating
  in Doris and Harman''s charge that global character traits barely exist, hence virtue
  ethics rests on an empirically false picture. I take the first round of that debate
  to be largely over: pure globalism is dead, but whether anything recognizably Aristotelian
  survives is not settled.


  Candidate questions I can see (you may add or reject):


  1. Interactionism: people differ in susceptibility to situations. Is this enough
  for virtue ethics, or does it make virtue a statistical abstraction? Does it generate
  an interesting normative account of the person-situation dance?

  2. Situation management as a virtue: the thought that the admirable agent designs
  and selects situations (avoiding temptation-engineering environments, habituating
  via environmental scaffolding). Is this a genuine Aristotelian virtue or a concession
  that collapses virtue into prudence/self-management?

  3. Post-replication-crisis re-scoring: several canonical situationist studies rest
  on small samples or failed replications; does the crisis weaken the critique enough
