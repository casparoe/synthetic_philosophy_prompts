  Two classmates of mine, Dara and Marcus, spent an entire study session arguing about
  the surprise examination paradox and I couldn''t follow who was winning. The setup
  they used: a teacher announces that there will be an exam next week (Monday through
  Friday), on exactly one day, and that the students will not know, on the morning
  of the exam, that it is that day. The students then reason it can''t be Friday (a
  Friday exam would be known by Thursday night), so it can''t be Thursday either,
  and so on back to Monday — so no surprise exam is possible. The teacher holds the
  exam on, say, Wednesday, and the students are indeed surprised.


  Dara, who presented the elimination argument, and Marcus, who attacked it, went
  back and forth as follows:


  (1) Dara: The argument is just modus tollens applied five times. If the announcement
  is true — exam next week, and no advance knowledge — then Friday is impossible,
  and each elimination after that is equally valid. Either the announcement is false
  or no exam can be a surprise. That''s airtight.


  (2) Marcus: The Friday step is special. On Thursday night, the students can eliminate
  Friday only if they still trust that an exam is coming that week. But after your
  own elimination argument, they no longer trust that. So when you try to eliminate
  Thursday — "if we reach Thursday morning, we''d know it must be today" — the "we''d
  know" fails, because their premise that the exam must still be coming has been undermined
  by their own reasoning.


  (3) Dara: That confuses the students'' psychology with the logic. The announcement
  is a proposition about the world, and if true it has whatever logical consequences
  it has, regardless of whether the students feel confident about it at every stage.


  (4) Marcus: No — "you will not know which day" is not a proposition about the world
  in the ordinary sense. Its truth depends on what the students will know, and what
  they will know depends on the deductions they make, including deductions from this
  very announcement. It''s closer to "you will not believe this announcement" than
  to "it will rain on Wednesday." A sentence like that can be perfectly true while
  being impossible for its audience to accept.


  (5) Dara: Even granting that, look at the actual outcome: the exam was Wednesday
  and they were surprised. So the announcement was true and the students'' conclusion
  — no surprise exam possible — was false. Whatever the announcement''s peculiar status,
  that''s a failure of logic, not of psychology: a sound argument can''t have true
  premises and a false conclusion.


  (6) Marcus: Which is exactly why the elimination argument can''t be sound. The premise
  "the announcement is true" is one the students can''t coherently add to their knowledge
  base without generating a contradiction. I''d say the announcement is true but unknowable-by-them,
  the way "it is raining but you don''t believe it" can be true yet impossible for
  you to know. The mistake is thinking that a teacher''s assertion, once heard and
  accepted, becomes just another premise.


  Dara ended by saying that if Marcus were right, teachers could announce surprise
