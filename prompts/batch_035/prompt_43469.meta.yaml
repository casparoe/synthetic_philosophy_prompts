  ---


  I''m a high school senior writing my extended essay on direct democracy, and before
  I can argue anything about it I need to know what I actually believe about when
  a referendum''s result should bind. I have verdicts on a set of cases, and I''d
  like you to find the principle behind them, tell me which of my verdicts it can''t
  accommodate, and say what it predicts for cases I haven''t considered.


  My verdicts:


  1. Brexit: a bare 52–48 majority on a major constitutional question, in a nonbinding
  referendum, shouldn''t have been enough to carry the change by itself; parliament
  should have had to do more work. Verdict: not legitimate as a simple mandate.


  2. The Swiss referendum that banned new minarets (2009): I think the outcome was
  wrong and hurt a small minority, but the procedure was legitimate — it was a proper
  national vote. Verdict: legitimate process, bad result.


  3. Swiss women couldn''t vote in federal referendums until 1971. Any referendum
  before then decided partly by an electorate that excluded half the adults. Verdict:
  not legitimate, even where the procedure was formally impeccable — the electorate
  itself was wrongly constituted.


  4. Proposition 13 in California (1978): a majority legitimately capped property
  taxes, but the cap also required a supermajority for future legislatures to raise
  many taxes, which entrenches one generation''s majority against later ones. Verdict:
  the vote was legitimate but the entrenchment wasn''t; I don''t think a one-time
  bare majority should be able to bind future majorities that tightly.


  5. Ireland''s 2018 referendum to repeal the abortion ban, after a randomly selected
  Citizens'' Assembly had deliberated for months and heard evidence: completely legitimate,
  even though it too was a major moral question carried by a simple majority. I don''t
  feel the Brexit worry here at all.


  6. A reversal: if a country votes a policy in and then, three years later, votes
  essentially the same policy out with a similar margin, I think the second vote should
  stand, and "the people have already spoken" is not an objection. Verdict: re-running
  is fine.


  7. My own school case: the student body was polled on whether to keep the school''s
  late bus; only about a fifth voted, but I think the result should stand anyway,
  because low turnout cuts both ways — the people who cared showed up.


  The tension I can already see: 2 and 3 seem to pull apart (formally correct procedure
  can be legitimate in one case and not the other), 1 and 5 seem to pull apart (simple
  majority bad for Brexit, fine for Ireland), and 4 sits awkwardly with 6 (if majorities
  can''t bind future majorities, why can a reversal vote undo an earlier one, and
  why couldn''t the earlier one claim the same protection?). Maybe the difference
  between 1 and 5 is deliberation, or the fact that the status quo in Ireland was
  itself the product of an earlier referendum; maybe the difference between 2 and
  3 is that one electorate was merely mistaken and the other was wrongly drawn. But
  I can''t get these into one principle, and I''ve tried.


  What I''d like from you: state the principle, or a small set of candidate principles,
  precisely enough that I could apply them mechanically to a new referendum. For each
  clause, tell me which of my cases motivates it. Then tell me honestly which of my
