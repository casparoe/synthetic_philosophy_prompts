  I''m preparing a paper on Einstein''s political writings for a seminar on the history
  of economic thought, and I''ve hit a question his own texts can''t settle. In his
  1949 essay for the inaugural issue of Monthly Review, he argued that capitalist
  production for profit rather than use generates crises and unemployment, that its
  worst evil is the crippling of individuals'' social consciousness, and that the
  remedy is a planned economy oriented toward social goals. Yet he closed by warning
  that a planned economy as such can coexist with the complete enslavement of the
  individual, so that socialism''s central problem is political: keeping planning
  democratic and the bureaucracy accountable. Nowhere does he confront the economic
  objection that had been circulating for decades — Mises''s and Hayek''s claim that
  rational socialist calculation is impossible without market prices.


  Suppose we could show Einstein the developments since 1955. Computing power has
  grown by many orders of magnitude; vast firms internally plan logistics on a continental
  scale without internal markets; and now machine-learning systems forecast demand
  and optimize supply chains in real time. A school of economists and computer scientists
  — with roots in mid-century cybernetics and its later revivals — argues that the
  calculation problem was a limitation of mid-century information technology, not
  a permanent feature of socialism, and that in the age of big data the planners''
  problem is solvable in principle. What would Einstein say? Would he treat this as
  the missing economic warrant for the planned economy he called for, or would he
  reply that his essay''s reservations were never about computational capacity in
  the first place — that Hayek''s deeper point, if Einstein would grant it, concerns
  knowledge that is dispersed, tacit, and never encoded, and that no algorithm that
  forecasts demand from past prices answers it? And crucially: would he distinguish
  between planning by a state apparatus and planning by, say, a private logistics
  giant, given that his complaint was directed at an economic anarchy that he thought
