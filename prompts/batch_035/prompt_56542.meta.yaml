  type wants a commonly repeated one-liner; anthropic principles aren''t quite slogans.


  Verdict type + anthropics: a friend''s verdicts on anthropic cases — Doomsday argument,
  sleeping beauty, presumptuous philosopher — predict verdict on new case (e.g., multiverse
  size). That fits nicely: verdicts jointly consistent with SSA and SIA rules, new
  case where they diverge.


