  1. Trivial reading: proportionality — punishment shouldn''t be wildly disproportionate
  (nearly everyone agrees, but gives no determinate sentence).

  2. Ordinal proportionality: ranking crimes by severity, punishments by severity,
  match them (retributivist; says nothing about absolute scale).

  3. Cardinal proportionality: severity of punishment equals seriousness of wrongdoing
  — needs a commensuration (suffering = harm + culpability?), contentious.

  4. Consequentialist reading: punishment calibrated to deterrence optimum — "fit"
  means efficient, not deserved.

  5. Expressivist reading: punishment communicates condemnation proportional to the
  wrong.

  6. Maybe a reading on which it''s false: lex talionis literalism (eye for an eye)
  — no one accepts.


  And which readings support the uses: resisting consideration of consequences (deterrence)
