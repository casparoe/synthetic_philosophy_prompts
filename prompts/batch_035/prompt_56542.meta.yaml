  Prompt structure: personal framing — I''ve been summoned for jury duty / seated
  on a jury for a criminal trial, or maybe I''m on a university honor council hearing
  a cheating case. During deliberations, fellow jurors invoked "the punishment must
  fit the crime" and "a punishment can be deserved even if it does nobody any good"
  — hmm, keep it to one slogan. Deliverable: lay out the distinct precise theses,
  which are trivial, which defensible, which false, which the repeaters probably mean,
