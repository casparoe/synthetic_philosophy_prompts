  \ aggregates across persons just as individuals rationally trade off pains now for\
  \ gains later within their own lives. (2) It's rational for a person to accept a\
  \ short pain now for a larger later benefit. (3) If persons were not separate, interpersonal\
  \ tradeoffs would be exactly like intrapersonal ones. (4) Utilitarianism treats\
  \ them as exactly like, so it denies separateness of persons. Hmm.\n\nBetter prove-too-much:\
  \ Turn the objection against itself. The separateness objection says utilitarianism\
  \ wrongly treats many persons as one. Construct an argument that also proves distributive\
  \ justice within a single life is impossible, or that any aggregation (including\
  \ total utility in a single life over time) is illegitimate because \"temporal stages\"\
  \ are also separate points of view. That's the classic Sidgwick/Rawls debate; Parfit\
  \ also.\n\nA nice version: (1) Morally relevant unity requires a single subject\
  \ of experience (one point of view). (2) A person at different times is also not\
  \ a single subject of experience — the experiencing self now and the experiencing\
  \ self tomorrow are numerically distinct momentary centers of consciousness. (3)\
  \ So the tradeoff between my pain today and my pleasure tomorrow is just as much\
  \ an aggregation across distinct subjects as the tradeoff between my pain and your\
  \ pleasure. (4) If utilitarianism is wrong to aggregate across persons because persons\
  \ are separate, prudence is wrong to aggregate across times for the same reason.\
  \ (5) But prudence is obviously rational — denying it is absurd. (6) So the separateness\
  \ objection proves too much: either it also condemns prudence, or it must find a\
  \ morally relevant unity across times that it denies across persons. Ask: where\
  \ does it go wrong, or what do we pay?\n\nAnother possible flaw: equivocation on\
  \ \"point of view\"/unity. The subtle move is that \"separate person\" in the objection\
