  \nDraft:\n\n\"I'm a retired immunologist, three years into philosophy retirement-project,\
  \ currently in a neighborhood reading group that just did the separateness-of-persons\
  \ objection to utilitarianism (Rawls's complaint that the utilitarian treats society's\
  \ tradeoffs between my pain and your pleasure the way I treat tradeoffs within my\
  \ own life). I got myself into an argument I can't get out of, and I suspect it\
  \ proves too much.\n\n(1) The separateness objection says: it can be rational/acceptable\
  \ to impose a loss on one part of a life for the sake of a greater gain to another\
  \ part of the same life, because there's one subject who gets both; but there's\
  \ no single subject who gets both my loss and your gain, so the utilitarian aggregation\
