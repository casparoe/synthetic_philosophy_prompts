reasoning_summary: 'Let me pick a domain and type. The nonidentity problem + "verdicts
  on cases, ask what principle captures them" seems great — cases of procreative decisions.
  High school student, casual, with typos. Include some hard-to-reconcile pairs, e.g.,
  a case about a person whose existence depends on a risky policy.


  Let me construct: cases like:


  1. A couple conceives knowing a drug/illness will cause the child to have a serious
  but livable condition (e.g., mother has rubella or takes a teratogenic drug) — child
  has a life worth living. Verdict: wrong? (Parfit''s own case.)

  2. A policy delaying pregnancy that results in different children being born — verdict:
  fine.

  3. Choosing to conceive a child with a disability when they could have waited and
  had a healthy child (deafness via embryo selection) — verdict: not fine? or fine?
  Make it hard.

  4. Resource depletion policy making future people''s lives barely worth living —
  clearly wrong even though those people wouldn''t exist otherwise.

  5. A person whose existence depends on a risky decision that then harms them — e.g.,
  a school built on a fault line 50 years later; kids wouldn''t exist but for the
  decision. Verdict: seems wrong, and also seems like the kids are wronged?

  6. Maybe a case where the person can''t be said to be wronged — the "nonidentity"
  case — contrast with one where identity isn''t affected.


  The tension: "harm requires making someone worse off than they''d otherwise be"
  vs verdicts that the act is wrong. Ask: what principle captures all of these — wrong-making
  property without a victim? Person-affecting vs impersonal? Ask what the principle
  says about a further case (e.g., a couple conceiving a child who will have a 50%
  chance of a condition vs certain).


  High school student voice: "we were arguing in ethics club", "my bio teacher mentioned".
  Include typos like "recieve" or missing apostrophe. Keep it 2-3 paragraphs.


  Make one pair hard to reconcile: verdict that the depletion policy is clearly wrong
  (impersonal intuition) but verdict that a couple conceiving a child with a mild
  condition is fine, while a couple conceiving a child with a serious condition is
  wrong — but the "no one is worse off" logic applies equally in all. Also maybe verdict
  that a decision that benefits the future person in some ways but harms in others
  (the "risk" case) — the person owes their existence to the risk.


  Also seed a tentative principle: "wrong only if it''s bad for someone" — ask to
  test.


  Draft:


  "Ok so in my ethics elective we did Parfit''s nonidentity problem... my friend Jake
