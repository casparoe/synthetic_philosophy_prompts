  precisely because it is not a university common room.


  Next season''s headline slot has been offered to a visiting speaker who promotes
  the New Chronology — the school associated with Anatoly Fomenko which holds, roughly,
  that recorded history has been stretched by a millennium or more, that whole dynasties
  are duplicates of one another misfiled centuries apart, and that virtually everything
  before about AD 800 is construction or forgery. The committee has asked me to give
  a short talk before they finalise the invitation, arguing that the society should
  decline — not because the claim is heterodox (that would betray everything the club
  is), but because there is a principled difference between a heterodox claim that
  plays by the rules of evidence and one that is built so it cannot lose, and the
  New Chronology falls on the wrong side of that line.


  My own argument, worked out on my own over the years, has three planks. First, a
  claim earns a hearing by saying in advance what would count against it: the New
  Chronology, as far as I can tell, absorbs every anomaly — every cross-check that
  disagrees is dismissed as part of the same grand fabrication, and every cross-check
  that can be re-read is claimed as support. Second, the theory owes us an account
  of the forgery it posits that is at least as economical as the history it replaces:
  I want to ask how and why scribes, astronomers and coin-cutters across three continents
  coordinated a single false timeline for centuries before anyone kept a central record.
  Third, the physical cross-checks: I expect the speaker''s answer to carbon dating
  to be that its calibration curves were themselves fixed by the conventional timeline,
  so the method only ever returns the dates it was fed; my sense is that this badly
  misdescribes how calibration actually works, but I could not defend the details
  under questioning, so I intend to lean on the convergence of independent methods
  (tree rings, ice cores, annular records, eclipses) rather than on any single one.


