  1. Recommendation (about 100 words): a clear bottom line the board can vote on,
  including the exact text of any proposed amendment.

  2. What happened (about 150 words): a neutral account of the incident.

  3. The general problem (about 250 words): an explanation, in general terms, of why
  this will keep happening under the current rule — not just that this one article
  was a mistake. The board should see the structural issue: when several people each
  have the power to act alone, and each has some doubt, what determines whether the
