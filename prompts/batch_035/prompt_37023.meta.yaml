  A visiting postdoc in my political philosophy workshop has an argument that luck
  egalitarianism refutes itself, and I can''t find the flaw. (1) Luck egalitarianism
  says justice requires neutralizing the distributive effects of brute luck — circumstances
  nobody could be held responsible for — while leaving untouched the effects of choice.
  (2) A choice is only responsibility-grounding if it issues from the chooser''s own
  preferences, beliefs, and capacities. (3) Every preference, belief, and capacity
  a person has is either a direct product of brute luck or shaped by earlier choices
  that issued from preferences, beliefs, and capacities that were themselves products
  of brute luck. (4) So by tracing any chain back far enough, every choice is "ultimately"
  a product of brute luck. (5) So there is no genuine option luck anywhere, and luck
  egalitarianism demands compensating the reckless and the industrious alike for every
  outcome difference — which destroys the very distinction the view exists to draw.
  (6) He adds that the argument proves too much in the other direction as well: if
  you block it by denying (4), you''d better be able to say why causal tracing to
  luck doesn''t undermine responsibility in law and ordinary life. (7) Therefore luck
  egalitarianism is unstable and we should all be relational egalitarians. I suspect
  some word — "product," "responsibility," or that "ultimately" in (4) — is doing
  illegitimate work, but each repair seems to cost something real. Which step do I
  reject, and what am I paying for it? For what it''s worth, I''d sooner deny (7)
  than accept (5), but I want the diagnosis and the price of every exit, including
  the exits I''d hate to take.


