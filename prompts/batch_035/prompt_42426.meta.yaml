  with re-eligibility after a year away. I''ll number the moves...


  1. Haas (proposing): for eleven years the presidency and treasury have rotated among
  the same three people; the nominating committee has never once put forward a candidate
  who wasn''t already on council; in that time not one member under fifty has stood
  for office. The posts are de facto closed, term limits reopen the funnel.


  2. Lenz: nobody is barred from running — the society holds no power over anyone,
  exit and entry are free, and the reason the same people hold office is simply that
  nobody else wants the work. Forcing out the willing doesn''t create new leaders;
  it creates vacancies. You''ll solve the vacancy with the person who least wanted
  it.


  3. Haas: "nobody else wants the work" is not an independent fact of nature; it''s
  produced by the arrangement. Members don''t run because challenging an ensconced
  incumbent is both futile and mildly humiliating, while an office with a known exit
  date is a different object — you''re not unseating anyone, you''re applying for
  a slot. Willingness to stand, in other words, is endogenous to the rules.


  4. Lenz: granting the endogeneity point arguendo, there remains the expertise problem.
  Treasurers learn the insurance, the audit, the grant reporting; presidents hold
  the relationships with the museum and the county. The learning curve is steep and
  the pay is zero, and a hard term limit means the society is perpetually administered
  by novices — like a lab in which no one is ever allowed to master the equipment
  before rotating off it. Occasional continuity does more for institutional health
  than a constant supply of fresh faces.


  5. Haas: then take turnover where it''s cheap — draw the nominating committee by
  lot from the membership roll instead of electing it at the annual meeting. Random
  selection is neutral; terms stay as they are; no one is forced out of anything;
  and the closed circle you defend can''t reproduce itself through a lottery.


  6. Lenz: but now he has conceded my point... a lottery hands the society''s agenda
  to conscripts — people with no demonstrated interest and, worse, no accountability,
  since a drawn member faces no re-election to lose. And notice what the election,
  whatever its flaws, does: over repeated terms it selects for the member for whom
  holding office is itself the reward — the "careerist," if you like. That selection
  is exactly what keeps an institution running between crises. Better a willing careerist
  than a conscripted amateur.


  7. Haas (closing): you are modeling power on the state, and the analogy misleads.
  It is true nobody coerces anybody. But whoever holds office sets the agenda — which
  rooms we rent, which speakers, whose proposals reach a vote — and eleven years of
