  ---


  I am a retired geochemist who has, since leaving the laboratory, taken up political
  philosophy with more enthusiasm than expertise. A practical question at my local
  natural history society (about 700 members, a governing council of twelve, officers
  re-eligible without limit) recently outgrew itself into something I suspect you
