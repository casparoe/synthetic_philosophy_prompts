  ---


  I lead a three-person technical due-diligence group at a venture fund that backs
  startups whose engineering rests on young science — quantum hardware, fusion, synthetic
  biology. Before each investment the team has to sign off on a one-page "reality
  memo" for each load-bearing scientific posit in the company''s plan: is this mechanism
  or entity something we can treat as settled bedrock for underwriting, or useful
  scaffolding that could be revised without the company''s core working, or a posit
  the whole plan dies with? We have roughly two weeks per deal, and the investment
  committee wants a definite verdict per posit, not a survey of options.


  A colleague of mine is fond of the pessimistic meta-induction — the observation
  that past science''s successful posits (caloric, the ether, crystalline spheres...
  well, the ether) were later discarded, so some of ours presumably will be too —
  and from it he''s derived what he calls the depreciation heuristic: treat confidence
  in a posit like a depreciating asset that loses value with time since the posit''s
  last novel predictive success, and tops up when a successful novel prediction comes
  in (a prediction that risked failure, not a fit to data the posit was invented to
  explain). Another colleague counters with something like entity realism: if engineers
  have to treat the posit as a real manipulable thing to make instruments work, treat
  it as bedrock regardless of depreciation.


  Write a decision procedure my team can actually run on a posit within a day: the
  questions to ask in order, what counts as a sufficient answer to each, where the
  procedure stops with "bedrock," where with "scaffolding," and where it hands the
  question to a person because it''s a values question (how much risk to load on one
  posit) rather than a factual one. It should incorporate or explicitly reject the
  depreciation heuristic — and you must take a definite position on whether to adopt
  it, amend it, or discard it, with reasons, not a menu. Then run it on two hypothetical
  posits: (a) a startup whose confinement scheme rests on a mechanism with a twenty-year
  record of fitting data but no genuinely risky predictions, which the engineers nevertheless
  manipulate daily; and (b) a startup resting on a posit that made one startling novel
  prediction last year, confirmed, but which nobody can yet manipulate or use to intervene.
  At least one of these should come out in a way I won''t like — say which, and why
  the procedure nonetheless gives that answer. Finally, flag where the procedure is
  most likely to misfire.


