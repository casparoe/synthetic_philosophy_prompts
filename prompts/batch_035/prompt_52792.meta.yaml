  Design: dialogue between two characters — a FARG-style cognitivist defending knob-twiddling
  (small variations in a concept space as the crux of creativity) vs. a skeptic. Equally
  competent, real back-and-forth. The skeptic shouldn''t be a strawman: could be a
  "long-jump" romantic? No — that''s the strawman Hofstadter refutes. Better: a skeptic
  who thinks the model captures at best style or competence-adjacent variation, not
  the genuine saltation in paradigm-creating creativity — e.g., a fan of Kuhnian Gestalt
  views or someone like someone who holds that major creativity involves reorganizing
  the space itself, not moving within it; or someone who thinks the real crux is selection
  over a population of ideas (blind variation plus cultural selection, à la Campbell/Simonton),
  where the interesting work happens in the filter and the outer loop, not in the
  twiddling; plus the objection that if every move is guided by pressure, the model
  can''t explain the arbitrary or unrelated influences — chance juxtapositions, cross-domain
