  silence means we can never know anything about the subaltern; or an argument that
  since archives are products of state power, all history is fiction, so the winner''s
  account is no worse than any other — that proves too much. The asker is a layperson.


  Let''s construct a numbered argument: (1) Archives are created by institutions with
  power. (2) Records were made by administrators, missionaries, police etc. for their
  own purposes. (3) So what survives reflects those purposes, not what happened. (4)
  If a source reflects purposes rather than what happened, it can''t tell us what
  happened. (5) So the archive can''t tell us what happened. (6) The same goes for
  oral traditions, family stories, etc., since they too were shaped by who got to
  speak, remember, repeat. (7) So no source can tell us what happened. (8) So any
  account of the past is as good as any other — my grandmother''s version, the state''s
  version, a novelist''s. Conclusion the asker can''t accept: e.g., "so the government''s
  account of what happened in some event is no better than a conspiracy theorist''s
  reconstruction" — they can''t accept that Holocaust deniers'' account is no worse
  than historians''.


  Subtle flaw: equivocation between "reflects purposes" and "only reflects purposes";
  step (4) is a slide — evidence shaped by bias can still carry information (systematic
  distortion is itself information; reading against the grain; serendipitous survivals,
  registration gaps). Also step from (5) to (7) — oral histories also shaped but differently
  shaped. And (7) to (8): "as good as any other" — can''t tell us vs. all equally
  bad doesn''t imply all equally good.


  Make it a friend''s argument overheard at a pub or a cousin''s Facebook post. Casual
  British English, a typo or two. Ask which step to reject and what it costs. Keep
  it 1-3 paragraphs, elaborate-ish.


  Write it from a layperson: "I''ve been arguing with my brother-in-law about this..."
  Include the intuitiveness of each step: also maybe note the asker wants to keep
  (1)-(3) because that''s what they find compelling (e.g., they read about how census
  categories were invented by colonial administrators, police files on strikers).
  Include some in-the-weeds seeding: e.g., mention that the friend brought up how
