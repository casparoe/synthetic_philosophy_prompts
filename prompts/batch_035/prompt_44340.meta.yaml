  people who pass through adolescence around the same events — the arrival of the
  smartphone, a major recession, a political trauma — come out measurably different
  in religiosity, trust, media habits, and so on, and these cohort differences show
  up in survey data decade after decade.


  (2) Jonas replied that nothing in that data corresponds to the boundaries of the
  labels. Nobody born December 31st, 1980 is meaningfully a different kind of person
  from someone born January 1st, 1982; the cutoffs were set by polling organizations
  for administrative convenience. A category with arbitrary boundaries and no causal
  joint is a bin, not a kind.


  (3) Maya said plenty of real kinds have fuzzy or gerrymandered boundaries — species
  interbreed at their edges, ecosystems fade into one another — and what makes a kind
  real isn''t a sharp edge but a causal mechanism holding its members together. Shared
  formative events, experienced at the same impressionable age, are exactly such a
  mechanism: that''s the point of talking about homeostatic property clusters rather
  than essences.


  (4) Jonas granted fuzzy boundaries but attacked the mechanism: the "shared experience"
  is not shared. A recession hits the twenty-two-year-old and the fourteen-year-old
  in completely different ways; class, region, and family swamp cohort in almost every
  prediction you''d want to make; the stereotypical Millennial experience is really
  the experience of one affluent, media-visible slice. What glues the cluster together
  isn''t a mechanism, he said — it''s a story, told by journalists and marketing consultants
  with an interest in selling the cohort as a bloc.


