  social kinds — all are partly narrated — and that narrative isn''t opposed to reality
  here, because the label feeds back: people are told they are a generation, consume
  and vote accordingly, and are then addressed as a bloc by politics and advertising,
  which hardens the differences. Constructed doesn''t mean unreal; money is constructed
  and quite real.


  (6) Jonas said the feedback loop makes the label real, not the cohort: the loop
  would latch onto any arbitrary bin and work just as well, so the reality it produces
  can''t vindicate the original demographic category. And he added that the empirical
  case is shakier than it looks, because cohort effects are nearly unidentifiable:
  any attitude gap between age groups could be due to age (people get more conservative),
  period (everyone changed in 2008), or cohort, and the three can''t be disentangled
  from ordinary survey data — so even Maya''s "measurable differences" underdetermine
