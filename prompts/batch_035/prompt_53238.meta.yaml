  my two friends Priya and Marcus got into it at dinner last week about whether it''s
  a good thing to bring happy people into existence, and i mostly watched. it went
  back and forth enough that i lost the thread, so writing it down and asking for
  a verdict.


  (1) Priya said she''s convinced by the procreation asymmetry: it''s clearly wrong
  to create someone you know will have a miserable life, but there''s clearly no duty
  to create someone who''d have a wonderful one — and she takes this to show that
  adding suffering makes the world worse but adding happiness doesn''t make it better,
  full stop.


  (2) Marcus said that''s just status quo bias dressed up. whether one world is better
  than another can''t depend on which people happen to exist in which. compare a world
  with nobody in it to a world just like ours except with one extra happy person —
  the second has more wellbeing in it, and he doesn''t see how adding wellbeing to
  the total fails to improve things. treating the empty world as a neutral baseline
  instead of a very bad one (all that absent happiness!) is exactly the kind of bias
  people accuse of rigging the question.


  (3) Priya replied that it''s like medicine: doctors have a duty not to harm patients
  and no duty to hand out benefits to people who don''t exist yet — you don''t wrong
  anyone by not creating them, but you do wrong someone by creating them into misery.
  Marcus said that conflates two different things: fine, maybe *duties* work asymmetrically,
  but she''d stated the asymmetry as a claim about what makes the *world* better,
  and "better world" isn''t a duty — it''s a comparison of totals, and totals don''t
  care who''s holding them.


  (4) Priya then went person-affecting on him: a world with one extra happy person
  isn''t better *for anyone* — not for the extra person (their alternative was never
  existing, not a worse life), and not for anyone else either. so there''s just no
  fact of the "better" that''s being missed. Marcus came back with the nonidentity
  point, which he thought was *against* her: creating the miserable person also isn''t
  worse for anyone, on her own logic — so what happens to her claim that that''s a
  wrong? Priya said the wrong of creating a miserable life is constituted by the suffering
  the life contains, not by the life being worse for the person than some alternative
  — the suffering is right there in it. Marcus said that''s just impersonal value
  with a minus sign: if suffering inside a life counts toward how good the world is,
  why doesn''t happiness inside a life?


  (5) Marcus then played what he thought was his winner: a couple decides to have
  a second kid mainly because their daughter is desperately lonely, and the kid will
  be happy too. if extra happy people never make the world better, the only value
  on the table is the daughter''s relief — the second child''s own happiness contributes
  exactly zero to whether having them is a good thing, which he found absurd. Priya
  said she can live with that: the child''s happiness is good for the child, it''s
  just not a reason that counts *in favour of creating them* — a bit like how a great
  concert is good but doesn''t mean there was a duty to put it on. Marcus said a concert
  not being obligatory and a person''s whole life counting for nothing toward the
  value of an act are pretty different, and he thought the ledger she was keeping
  (pleasure and pain only get entered once the person exists, so the act of creating
  a happy person opens a ledger and fills it with good entries, and she''s claiming
  an open full ledger is no better than no ledger) was exactly the thing that needed
  an argument, not an assumption.


