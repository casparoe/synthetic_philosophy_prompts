  point that the expected instrumental payoff of a single vote — the tiny chance it
  decides the outcome, multiplied by the stakes — is swamped by even a modest cost
  of voting, and yet turnout in real elections is high. I''d like to close the issue
  with a villanelle.


  Requirements:


  Write a villanelle (five tercets and a closing quatrain, with the two refrains rotating
  through the ends of the tercets and meeting as the final couplet) from the point
  of view of someone standing in line at a polling station on election day. One refrain
  should be the rational-choice position, stated so it''s arithmetically honest —
  the chance of one vote mattering really is astronomically small, so the line should
  gesture at the multiplication rather than assert something false; the other refrain
  should be the best version of the opposing position (duty, identification with the
  electorate, the thought that the line itself is the answer), not a strawman. The
  poem must not resolve which side wins. Somewhere in the middle, the speaker should
  notice that the line they''re standing in is long — and the poem should make that
