  Draft:


  I sit on our city council''s Heritage and Commemoration Commission, which rules
  on interpretive materials on public land, on commemorations the council co-sunds,
  and on the naming of streets and public spaces. The commission has a track record
  of rulings in which a community''s memory of its past and the documentary record
  pull in different directions, and next month we vote on a new one. I want a recommendation
  that is consistent with our own precedents, and I want it to be honest about where
  our precedents leave the question open.


  The precedents. First, the mill fire: local tradition has it that the mill was burned
  by retreating soldiers during the wars of the 1640s; the surviving record — a fire
  assessor''s report and two newspaper accounts — shows an accidental fire in the
  drying house. We required the new interpretive plaque at the site to state the documented
  cause, and declined even to mention the tradition. Second, the founding festival:
  the town''s archive puts the founding three years earlier than the date the festival
  has kept for over a century; we noted the record but left the festival to keep its
  traditional date, on the ground that the calendar of commemoration is the community''s
  to keep. Third, the regiment''s stand: veterans'' memory has the local regiment
  holding its position for a full day; the unit diaries and after-action reports show
  it was four hours. We required the interpretive panel at the war memorial to give
  the documented timeline, but added a sentence recording the tradition and its place
  in the town''s memory of itself. Fourth, the street name: a street is named for
  a doctor whom tradition credits with founding the town''s first hospital; the biographical
  record shows a colleague did most of that work. We kept the name and issued a short
  statement giving the fuller record.


  The new case. A neighbourhood association, descendants of the old weavers'' row,
  proposes a memorial on public land at the site of the clearance of the 1840s. All
  parties agree the clearance happened. What the record and the memory disagree about
  is the notice: the Improvement Commissioners'' minute books — kept by the commissioners''
  own clerk — record two weeks'' notice, removal costs paid, and a small allowance;
  the oral tradition collected from descendants in the 1970s is unanimous that the
  families were given a night''s notice and put out with what they could carry. The
  professional historians regard the minute books as sound, though one respected local
  historian has argued that a self-serving record kept by the men who ordered the
  clearance should not settle the matter, and no independent corroboration of the
  notice period survives either way. The proposed inscription states the night''s
  notice as plain fact, and it is that detail that carries the moral weight of the
  memorial: on the tradition the clearance was an act of cruelty, on the record it
  was harsh but ordinary administration. Our role is to approve or refuse the inscription;
  we would not author it ourselves.


  What should we decide if we want to be consistent with ourselves? Please give: the
  closest analog among our precedents and why it fails to settle the matter; the rules
  that fit our track record, each stated so that it covers all four precedents, with
  what each predicts for this inscription — I have a suspicion that one rule turns
  on whether the evidence leaves serious doubt, another on whether the commission
  is endorsing an assertion of fact as against letting a community keep its calendar,
