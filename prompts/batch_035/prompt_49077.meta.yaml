  (b) Sen''s critique that resources are too coarse — two people with same resources
  differ in what they can do (disability, climate).

  (c) Actually, better to make the asker''s own commitments. Let me design a set with
  one or two genuine tensions and one apparent tension.


  Belief set:

  1. The right metric for egalitarian justice is what people can actually do and be
  (capabilities), not what they have or how they feel — I''m persuaded by the disability
  examples.

  2. But I''m also drawn to the view that justice should be sensitive to responsibility:
  inequalities that trace to choices people should own (choice-sensitive/luck egalitarianism)
  are not unjust.

  3. I think adaptive preferences show welfare metrics are hopeless.

  4. I think the capability metric should stay "informationally thin" / politico-moral,
  not a comprehensive account of the good life (Nussbaum''s political liberalism constraint)
  — actually this could be a tension with... hmm.


  Tension: capabilities are partly a function of internal states (functionings include
  happiness, health) that also respond to choice; if you allow responsibility-sensitivity,
  then someone who "chooses" to be sedentary has reduced capability... but disability
  compensation: if you compensate for reduced capability due to disability, why not
  compensate for reduced capability due to choices or expensive tastes? Standard tension
  between luck egalitarianism and capabilities: capabilities blur the line between
  circumstance and choice because "capability" depends on internal conversion factors.
  Also tension: (1) capabilities as the metric with (2) the view that the state must
  remain neutral about the good life — capability lists look thick/perfectionist.
  Apparent tension that dissolves: endorsing both "resources are the wrong metric"
  and something like "we should still distribute a decent level of basic resources"
  — dissolves because resources matter instrumentally for capabilities.


  Maybe a cleaner one:

  (a) I think the metric of equality is capabilities (persuaded by disability/education
  examples — two people with same bundle of resources have very different lives).

  (b) I think Rawls''s primary goods are a mistake for the same reason... wait, primary
  goods ARE resources. Good.

  (c) I also hold that luck egalitarian responsibility-sensitivity is right: justice
  shouldn''t compensate for disadvantages that trace from choices.

  (d) I think welfare is ruled out by adaptive preferences AND expensive tastes.

  (e) I think the capability approach should be implemented as a set of constitutional
