  ---


  I''m a high school junior, and at my school''s philosophy club we have a tradition:
  once a year, each member submits a written statement of their actual views on one
  topic, and the others spend a meeting interrogating it. Mine is on how far our duties
  to others extend, and I''d like someone to check it for consistency before I submit
  it, because once it''s in, everyone gets a copy and a week to prepare objections.
  Here is the set of commitments as I currently hold them:


  1. I am a consequentialist: what makes an action right or wrong is its effects on
  the welfare of those affected, and I think the right act is the one with the best
  expected consequences, given the evidence available to me.


  2. I accept the cluelessness arguments I''ve come across: the long-run effects of
  anything we do are unknowable. Every action slightly alters the timing and course
  of events, and thereby changes which particular people will later exist; and for
  almost any act, one can tell a serious story on which it prevents vast amounts of
  good and an equally serious one on which it causes vast harm, with no way to assign
  probabilities.


  3. Because of (2), I think our duties extend only to the foreseeable: the rational
  way to be a consequentialist is to support interventions with solid evidence of
  near-term benefit. That is why I donate part of my allowance to a charity that treats
  children for intestinal worms (strong evidence, benefits within years), and why
  I''m unpersuaded by arguments for prioritizing the very long term, such as reducing
  the risk of human extinction this century — they rest on speculation about effects
  centuries out.


  4. I believe buying meat from factory farms is seriously wrong, and that this is
  true of the individual shopper''s single purchase, not just of the collective practice
  — it is not a case where "my one purchase makes no difference" excuses me.


  5. I believe every eligible citizen has a duty to vote, including in elections where
  one vote is all but certain not to affect the outcome, and I would justify this
  duty in the way that starts from what would happen if everyone reasoned that their
  own vote did not matter.


  6. I believe that where two options are balanced on the evidence — no foreseeable
  difference in welfare, and equally weighty unknown long-run effects on both sides
  — it is permissible to choose on personal grounds, for instance by taking the more
  meaningful career even if an impartial observer could not certify it as the most
  beneficial.


  Individually each of these feels right to me, and I can defend any one of them in
  the abstract. But I''ve started to worry that some of them are being held together
  by habit rather than by argument — that the reasoning I use for one would, if I
  applied it elsewhere, demolish another. I can''t see clearly which ones are actually
  inconsistent, which merely appear to be, or which of my arguments would have to
  be abandoned rather than the belief it supports. Before I submit this to the club,
  go through the six commitments: identify which pairs or subsets are genuinely in
  tension, rank those tensions by severity, distinguish them from any tensions that
  dissolve once stated carefully, and for each real one say what would have to give
  — which commitment should go, or how the least costly repair would work. I''d rather
  find the cracks now than watch the club find them for me.


