  Draft:


  ---


  I want to think clearly about the underdetermination of scientific theory by evidence,
  and before I read any particular replies to it, I want to work out what a reply
  owes me. Please write the desiderata: what any adequate response to the underdetermination
  challenge must deliver. Treat "response" broadly — it may be a denial that real
  rivals exist, an appeal to theoretical virtues like simplicity or unification, an
  appeal to future evidence breaking the tie, a Bayesian convergence argument, or
  a pragmatist concession that belief under underdetermination is permissible anyway.


  Requirements I''d expect the list to cover, though you may add, subtract, or split
  these:


  - It must say which version of underdetermination it is answering. Distinguish at
  least the case where our evidence leaves open how to apportion blame when a prediction
  fails (since hypotheses are tested only against auxiliaries) from the case where
  two whole theories fit every actual observation; and separate claims that the tie
  is merely temporary — future evidence, instruments, or conceptual innovation may
  break it — from claims that no possible evidence could. A reply that answers the
  transient version answers nothing about the permanent one, and vice versa.

  - It must handle constructed rivals, not just scientific ones: the theory that duplicates
  our best physics but stipulates that space is Euclidean and rods shrink just so,
  or that the universe began five minutes ago complete with records and memories.
  These are cheap to generate, so a reply that depends on such rivals being unformulable
  or incoherent fails on its face.

  - It must explain, not just assert, why the tie-breakers it invokes carry epistemic
  weight — why simplicity or unification or being part of a successful research program
  is truth-conducive or otherwise belief-entitling, rather than merely a fact about
  us. And it must face the second-order worry head-on: if the methodological standards
  doing the tie-breaking are themselves things that were adopted under conditions
  of underdetermination, invoking them against rivals is either circular or a change
  of subject.

  - It must not require solving the problem an agent could not actually solve. If
  showing that two theories are empirically equivalent is itself an intractable problem
  — requiring, say, a survey of all possible auxiliaries and measurement setups —
  then a reply that goes via "established empirical equivalence is rare" tells us
  little about what actual scientists are entitled to believe.

  - It must respect the difference between having no reason to believe a rival and
  having reason to believe no rival: the former is compatible with rational confidence
  in our theory only on some views about evidence and none on others, and the desideratum
  is to say which and why.


  For each requirement, give the case or consideration behind it. Mark which you take
  to be non-negotiable and which are arguably partisan — a pragmatist, a Bayesian,
  and a scientific realist may not agree on which are which, and I want your view,
  not a survey of theirs. Then flag any subset of the desiderata you suspect cannot
  be jointly satisfied — I am most interested in whether the third and fourth can
  be held together, i.e., whether the demand for non-circular justification of the
  tie-breakers and the demand for an answer usable by bounded agents can both be met
  at once. Finally, one paragraph on how the two or three most familiar replies —
  appeal to theoretical virtues, and appeal to the eventual disclosure of differences
  by growing evidence — fare against the list. Keep the weight on the criteria; the
  scoring should be brief.


