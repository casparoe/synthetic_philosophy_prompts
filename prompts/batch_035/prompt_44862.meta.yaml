  I''m building a seminar unit around a diagnostic question: is vagueness in the sorites
  an artifact of perceptual indiscriminability — the thought, most explicit in Williamson''s
  epistemicism, that the boundary of a vague predicate is unknowable because our judgments
  have a margin for error set by our inability to tell adjacent cases apart — or does
  it survive even where discrimination is perfect? I want a thought experiment engineered
  to decide this. [Hmm "decide" too strong — "to put pressure on"]


  Specification. Construct a scenario in which:

  (i) there is a series of cases spanning a vague predicate — the series should be
  concrete and realistic: a sensory panel at a cidery calibrating "dry," or something
  of that ordinary grain;

  (ii) every adjacent pair in the series is discriminable — the panelists can reliably
  say, given two side-by-side samples, which one is sweeter, at every single step
  along the series;

  (iii) nevertheless, the predicate behaves vaguely: samples at the ends are uncontroversially
  dry or not dry, and somewhere in the middle the panel''s non-comparative judgments
  ("is this dry, yes or no?") start to waver, with no one able to identify a cutoff.


  The scenario itself should be one paragraph, no impossible psychophysics — pairwise
  detection of small differences is ordinary — and no appeal to fatigue, distraction,
  or degradation of the samples, since those would reintroduce an indiscriminability
  rationale by the back door.


  The point is to regenerate the paradox rather than stipulate it: after the scenario,
  construct the sorites argument explicitly — from the sample everyone calls dry,
  in increments of the smallest detectable sweetness difference, to the sample everyone
  calls sweet — and show why the usual rationale for the tolerance premise (you can''t
  tell the difference anyway) is unavailable here, since each step is exactly as large
  as the panel can tell apart.


  Then walk through the deliverables:

  1. The epistemicist''s options. Williamson-style margin-for-error says knowledge
  of ''this is dry'' requires the wine to stay dry across an indiscriminable neighborhood.
  In this case there is no indiscriminable neighborhood. So what, if anything, now
  explains the unknowability of the boundary? Consider the reply that the margin applies
  to the category judgment rather than to bare discrimination — is this a convincing
  repair, or an admission that discrimination never grounded the boundary in the first
  place?

  2. What the supervaluationist and a degree theorist say about this series, and whether
  either has a feature the case particularly flatters or embarrasses.

  3. Which feature of the case is doing the work — my guess is the split between comparative
  discrimination and non-comparative categorization — and what happens to the case
  if you remove that feature (i.e., shrink the increments back below the detection
  threshold). Does the case collapse back into an ordinary perceptual sorites, or
  does something survive?

  4. How a defender of the discrimination-based diagnosis would attack the case as
  it stands — for instance, by denying that pairwise discrimination is the relevant
  notion, or by reinterpreting (iii) as mere performance noise.


  A case that meets the letter of the specification by cheating — e.g., by stipulating
  that the panel''s mid-series wavering is due to a perceptual gap, or by making the
  predicate precise and the wavering mere disagreement — fails; the vagueness has
  to be generated by the scenario, not asserted of it.


