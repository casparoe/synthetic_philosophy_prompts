  I write literary fiction, and I am at work on a novel that has, in the drafting,
  developed a philosophical spine I only partly understand. The chapter as sketched:
  my protagonist winters alone as caretaker of a decommissioned weather station on
  an island, keeping to a routine so unbroken — the same chores, the same weather,
  the same blackout of daylight — that her waking mornings are indistinguishable from
  within. On the Sunday before the chapter opens, one event of consequence is settled
  for good: her sister''s transplant either takes or fails, and she will not learn
  which until the supply pilot tells her; if it failed, a second procedure adds a
  further day of waiting, and so a further indistinguishable morning, before the news
  comes. A philosopher friend who read the draft tells me, with what I fear was a
  smirk, that I have written Sleeping Beauty in a cardigan, and that if I am going
  to exploit the structure I had better understand it.


  I am not a philosopher, and I refuse to write the scene by accident. So I want the
  scene constructed deliberately, to the following specifications. [Numbered:]


  1. The chapter itself should be one paragraph of ordinary prose, readable by someone
  who has never heard of the problem. Within it, my protagonist must face a decision
  — it need not be money; it can be any act that is irreversible and that she must
  take before the pilot''s knock — where what it is rational to do depends on how
  confident she should be that this morning is the earlier one.

  2. No memory-altering device of any kind is allowed. Only ordinary sleep separates
  the mornings. Their indistinguishability must be earned: the sameness of her days
  must be shown well enough that a reader accepts she genuinely cannot tell which
  morning she is in, without my simply declaring it.

  3. She must have no records, timestamps, or counting tricks available — but the
  unavailability of these must not feel like authorial cheating; it has to fall out
  of her situation naturally.

