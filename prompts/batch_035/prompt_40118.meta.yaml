  The prompt: someone whose friend recently called them out for hypocrisy ("you do
  the same thing"), and they''ve been stewing over which cases of hypocrisy actually
  undermine blame. They give their verdicts on cases: e.g., a roommate who never does
  dishes blaming another for not doing dishes — clearly no standing. A reformed smoker
  blaming a current smoker — feels like they do have standing? An ex-smoker who quit
  20 years ago. Someone who used to do the thing and stopped. Someone who blames for
  things they do but in a milder form. Blaming someone for gossiping while you gossip
  less. Aiming at inconsistent pair that''s hard to reconcile: e.g., thinks the roommate
  who never does dishes has no standing to blame, but thinks a person who does dishes
  but also leaves pans has standing to blame... Or: hypocrite who is open about their
  own failings ("I know I''m always late, but you being late to this really hurt me")
  — does candor restore standing? One hard-to-reconcile pair: they think the candid
  hypocrite retains standing, but the quietly self-aware hypocrite (knows they do
  it, doesn''t announce) loses standing — tension about whether candor is doing the
  work.


  Inject somewhat novel ideas so it''s in the weeds: e.g., "two wrongs" — blamer whose
  wrongdoing is more severe than the blamee''s. Or the "hypocrisy discount" idea.
  Also the notion of standing as distinct from whether blame is accurate.


  Cases (concrete):

  1. Friend who always shows up late blamed me for being late to her birthday — I
  felt she had no right.

  2. Ex-smoker (quit 15 years) telling a smoker friend she should quit — I feel he
  has standing.

  3. Someone who gossips a little blaming someone who gossips a lot — feels fine.

  4. Someone who did the same thing in the past but has since stopped and apologized
  — has standing (like the ex-smoker, but with an apology).

  5. Candid hypocrite: "I know I''m the worst about this, but you really hurt mom
  by not showing up" — retains standing.

  6. Quietly self-aware hypocrite: blames without confessing, but would admit if asked
  — verdict: loses standing? That''s the tension with #5.


  Hard pair: case 5 vs case 6 — candor seeming to matter despite the person''s behavior
  being the same. Also: severity mismatch — the blamer''s own version is worse than
  the target''s (blaming someone for a $20 office theft while having embezzled) vs
  blamer''s version milder. And a case where blamer''s wrongdoing is different in
  kind but same "root" (someone who blames cheaters but is a workaholic neglecting
  spouse — disloyalty via a different route).


  Then ask: is there a principle — e.g., "committed compliance" / the blamer must
