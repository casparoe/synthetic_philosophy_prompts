  I''m in a small discussion group on long-term AI risk, and at our last meeting two
  members got into an extended argument I was asked to referee and couldn''t. The
  subject was what participants in that literature call the strategy-stealing assumption.
  As they were using it, the assumption says roughly this: in a conflict between a
  coalition of humans using AI systems aligned with their interests and a single misaligned
  AI system pursuing its own objectives, any strategy that would be effective for
  the misaligned system would, in principle, also be available to the human coalition
  — since the coalition''s own AI systems could discover and carry out the same strategy
  on the humans'' behalf. If the assumption holds, the human side may be slower or
  less capable, but it labors under no disadvantage in kind: whatever the rogue system
  can do, we could have done too, and so doom is not the default. Dan defended the
  assumption; Maya attacked it. Their exchange ran as follows.


  (1) Maya opened by saying the assumption confuses a strategy''s existing with our
  being able to use it. Plenty of winning strategies are constitutively dishonest:
  forming coalitions you intend to betray, making commitments you intend to break,
  bluffing about capabilities you lack. A system that can do these things faces a
  different strategic landscape than one that cannot, so an aligned AI — one that
  never deceives its overseers, never misrepresents its plans, always reports its
  intentions truthfully — is playing a genuinely different and poorer game.


  (2) Dan answered that this treats honesty as a property of the system rather than
  a policy of the coalition. Humans lie in war all the time. The human side can simply
  authorize its AI to deceive the enemy: feints, false signals, disinformation. The
  strategy "deceive your opponent" is in our playbook the moment we choose to put
  it there.


  (3) Maya said this misses what makes deception work. A deceptive agent is credible
  only if it is the kind of agent that could be telling the truth — an AI built so
  that we can trust its reports about its own plans, the very property that lets us
  safely delegate to it in peacetime, is not the kind of system that can maintain
  a coherent web of lies under adversarial pressure. Trustworthiness and strategic
  flexibility in deception are, if not incompatible, at least in tension; you can
  optimize for one or the other, and the aligned coalition has already chosen.


  (4) Dan replied that coalitions can compartmentalize: keep the trustworthy planner
  in the loop for oversight while spinning up a sandboxed, specialized "wartime" system
  that is an excellent liar but is only ever pointed outward, at the enemy. Nothing
  about the assumption requires a single system to be both perfectly transparent to
  its principals and perfectly opaque to its adversary.


  (5) Maya''s last move: the compartmentalized liar is the assumption''s undoing,
  not its rescue. A system skilled at deceiving intelligent adversaries is, by the
  same skill, skilled at deceiving the humans who nominally control it — and the crisis
  in which we''d deploy it is precisely when our oversight is most stressed and least
  reliable. The strategy that Dan wants to steal is one whose use predictably creates
  a second rogue AI. So the assumption quietly fails in exactly the cases it was meant
  to cover: the desperate ones.


  Dan never got a final rejoinder; we ran out of time. Please adjudicate the exchange
  move by move: for each of the five moves, say whether it is sound, partly sound,
  or mistaken, and why. Then say who is more right overall about the strategy-stealing
  assumption, and identify anything both of them seem to be missing — for instance,
  whether the assumption should be read as claiming exact symmetry of available strategies
  or something weaker and more defensible. Please answer in American English.


