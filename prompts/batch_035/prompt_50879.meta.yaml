  — opioids'' dissociative effect on pain affect is well known.


  Cruxes:

  1. Whether causal closure of physics entails that phenomenal properties make no
  causal difference to behavior (including reports about phenomenality).

  2. Whether the tracking of phenomenal facts by phenomenal reports needs explanation
  at all — epiphenomenalist can say it''s a correlation guaranteed by the psychophysical
  laws; opponent says this is too convenient.

  3. The opioid/dissociation case: does the divergence between "pain intensity" reports
  and "bothered" reports show that reports can come apart from phenomenal character,
  and what each side predicts.


  Also whether the dispute is partly verbal: over "causal difference-making" vs. "causal
  relevance" — counterfactual dependence within a law-governed composite system.


