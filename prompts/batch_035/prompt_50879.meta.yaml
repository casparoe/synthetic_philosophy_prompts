reasoning_summary: 'Let me pick a domain and type. Domain: Epiphenomenalism and the
  paradox of phenomenal judgment. Type: adversarial collaboration joint statement
  — between an epiphenomenalist and someone who rejects it (e.g., a defender of mental
  causation / interactionist or a physicalist who rejects epiphenomenalism). Actually
  the paradox of phenomenal judgment is a classic problem for epiphenomenalism (Chalmers
  discusses it): if qualia are epiphenomenal, how do we ever make judgments and reports
  about them? The "paradox of phenomenal judgment" is Chalmers''s term in The Conscious
  Mind.


  Two camps: epiphenomenalist (qualia are non-physical, causally inert with respect
  to physics) vs. a physicalist/direct realist who thinks judgments about experience
  are causally grounded in the experiences themselves (or an interactionist). Perhaps
  better: epiphenomenalist vs. a "first-order representationalist" or just a physicalist
  who denies epiphenomenalism. The adversarial collaboration framing works well: agreed
  claims (there is something it is like, the physical world is causally closed or
  nearly, the explanatory gap), disagreements, cruxes (e.g., is causal closure of
  physics compatible with mental causation; the paradox of phenomenal judgment — how
  do we explain why our phenomenal reports track the phenomenal facts), and tests/arguments.


  The student perspective: taking a philosophy of mind course. Formal, polished, short-ish.
  No citations needed — avoid leaning on specific texts. Chalmers''s "paradox of phenomenal
  judgment" is a known idea, fine to mention without quotes.


  Write the prompt from student''s perspective: e.g., "In my philosophy of mind course
  we''ve spent three weeks on epiphenomenalism and the paradox of phenomenal judgment...
  My professor and a colleague / two TAs..." Actually adversarial collaboration between
  two parties: e.g., "a committed epiphenomenalist (who holds qualia are nonphysical
  and causally idle with respect to the physical) and a physicalist who insists that
  our talk and thoughts about experience are caused by the experiences themselves."


  Format: numbered agreed-claims section followed by a disagreements table, cruxes
  with each side''s predictions recorded in advance.


  Should I include something niche/new? The instructions say prompts should be "in
  the weeds" — inject some new/niche angle. E.g., a specific case: the argument from
  the possibility of inverted qualia reporting; or specify a concrete test case like:
  a subject in an experiment reporting pain intensity while undergoing pharmacological
  dissociation (reporting pain as intense while saying it doesn''t bother them — as
  with opioids or nitrous oxide). That''s a nice concrete case: under opioids, patients
  say "the pain is still there but it doesn''t hurt." Both sides could accept this
