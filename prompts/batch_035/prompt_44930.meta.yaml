  I am a criminal defense attorney with eighteen years of practice — I know the vocabulary
  of my trade cold, but I have read essentially no philosophy. A philosopher friend
  recently pressed David Lewis''s late paper "Divine Evil" on me, and I want to know
  whether his argument against penal substitution is something my legal vocabulary
  can genuinely express. Here is my lay summary of the argument, and I''d like you
  to correct it only if it is materially wrong, not to improve it as philosophy.


  Lewis takes the doctrine that Christ, innocent and consenting, suffers the punishment
  due to humanity''s sins, and asks whether it can be true that the suffering was
  punishment rather than mere harm. His answer is no: harming someone is not, in general,
  punishing anyone; punishment must be essentially tied to the guilt of the one punished
  — otherwise it isn''t punishment. He concedes that some of what passes for punishment
  behaves like a transferable debt: a fine paid on my behalf by my wealthy aunt harms
  nobody wrongfully and extinguishes my obligation. But the moment you substitute
  a volunteer for the convicted offender in anything like real punishment — a flogging,
  prison, or worse — you stop punishing anyone at all and start merely doing something
  terrible to a consenting person. Lewis concludes that if the atonement doctrine
  is read as penal substitution, God does evil, since only by doing evil could God
  inflict that suffering on the innocent, consent or no consent.


  Restate this argument in the vocabulary of my practice, as faithfully as you can
  — charging and conviction, mens rea, in personam rights and non-delegable duties,
  vicarious liability and respondeat superior, restitution and fines, contempt, credit
  for time served, proportionality review, the voidness of sentences imposed on someone
  not convicted — and then give me the residue report I actually want: which of Lewis''s
  moves translate cleanly into legal categories, which translate only with distortion,
  and which have no expression in my vocabulary at all. In particular I want your
  view on his central claim — that harming a consenting innocent cannot count as punishing
  anyone — because my vocabulary has something in the neighborhood (criminal liability
  does not transfer; my client cannot send his brother to serve his sentence; a sentence
  imposed on an unindicted person is void) and I cannot tell whether that neighborhood
  is the same neighborhood. Also tell me whether the things that don''t translate
  — God''s standing as the wronged party, the infinite proportionality problem, the
  idea that the volunteer''s consent changes nothing — are gaps in my vocabulary or
  gaps in Lewis''s clarity. And keep the translation honest: if some part of you wants
  to say that the law''s refusal to allow substituted punishment already vindicates
  Lewis, say so only after showing exactly which legal concept does the work, because
  I suspect that concept was built for institutional reasons rather than conceptual
  ones.


