  Quick setup so we''re on the same page (no quotes, just from memory): Ellsberg''s
  two urns. Urn A has 100 balls, 50 red and 50 black, known. Urn B has 100 balls,
  red and black in unknown proportion. People reliably prefer to bet on drawing red
