  The notes content:

  1. The classification error. In the lab, the "unknown" composition isn''t a fact
  of nature you''re ignorant about; it''s a choice made by an experimenter who designed
  the whole session, knows the hypothesis, and knows what subjects typically pick.
  If even a fraction of subjects model it that way, then betting on B isn''t a decision
  under uncertainty — it''s a move in a game against a strategic counterparty. Preferring
  A is then just never playing against someone who gets to move after you.

  2. What''s irrational in a game can be rational against nature and vice versa; the
  paradox is generated by forcing a strategic interaction into the "choice against
  nature" template.

  3. Auxiliary evidence: the aversion attenuates (I claim) when the urn is filled
  by a transparent mechanical procedure in front of subjects, and when the choice
  is one-shot among many unrelated tasks so the experimenter plausibly couldn''t tailor
  the composition. Also the "competence hypothesis" — people dislike betting on domains
  where they feel ignorant — is, on my reading, a Special case of the adversarial
  one: feeling ignorant is a cue that someone else in the room knows more.

  4. The payoff for theory: we shouldn''t repair SEU with ambiguity models; we should
  ask, in any given "ambiguous" choice, who set the ambiguity and whether they could
  react to your choice.


