  argument.


  Argument idea: (1) IQ in the population has heritability ~0.5-0.8. (2) Heritability
  is the proportion of variance attributable to genetic differences. (3) If a trait''s
  differences are mostly genetic, then environmental changes can at most affect the
  minority share. (4) Any environmental intervention is an environmental change. (5)
  So any intervention can shrink differences by at most the environmental share. (6)
  So remedial programs can''t much reduce inequality in the trait. Subtle flaw: heritability
  is population-specific and environment-specific; equalizing environment can raise
  heritability while reducing... actually the flaw: heritability measured in current
  range of environments doesn''t bound effects of environments outside that range;
  also genetic differences can be moderated — intervening on environment changes which
  genetic differences express. And the equivocation: "differences among individuals
  in this population under current environments" vs "differences under counterfactual
  environments." Also the normalization issue: heritability is a ratio of variances;
  changing environment changes both variances, so the fraction doesn''t bound absolute
  effects.


  Another well-known framing: the Jenkins v. Einhorn / "heritability of a trait in
  a population implies nothing about malleability" — the height example. I could make
  the argument conclude "since height is ~90% heritable in modern populations, and
  since malnourished populations gained inches, we must deny the heritability estimate"
  — proving too much both ways.


  Let me construct a hard argument with a subtle quantifier/environment-range slide:


  (1) Heritability h² of a trait in a population is the fraction of the observed variation
  in that trait that is due to genetic differences among its members, holding the
  environment distribution fixed (this is the standard breeder''s/ANOVA reading).

  (2) In contemporary wealthy countries, measured IQ has h² around 0.6–0.8, and height
  around 0.9.

  (3) Whatever is responsible for a difference is what would have to be changed to
  remove that difference.

  (4) If most of the difference between two individuals is genetic, then to remove
  most of that difference you would have to change their genes.

  (5) Changing genes is not something social policy can do (setting aside gene editing).

  (6) So social policy cannot remove most of the IQ differences in such populations.

  (7) So programs aimed at reducing cognitive-ability inequality (educational interventions
  etc.) can at best nibble at the minority environmental share, and promising more
