  Where does it go wrong? The core: heritability is defined for a population with
  a given distribution of environments and genes. Step (3)/(4) treats "genetic share
  of variance" as a stable quantity that environmental change can''t touch, but changing
  the environment for everyone changes the variance decomposition: uniform improvement
