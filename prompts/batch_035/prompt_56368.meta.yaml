  differentiated into types and wired into a fixed architecture, whereas ants are
  independent agents with their own interests, and each ant can leave; if the parts
  are themselves intelligent, the system can''t contain a second, higher-level mind,
  on pain of an infinite regress — colonies of colonies of colonies. Daniel said that''s
  a confusion of levels: it''s a category mistake to say the colony''s thoughts are
