  Prompt draft:


  ---


  I''m a graduate teaching assistant for a second-year seminar on free will and moral
  responsibility, and I want to build a one-page handout that sorts my students out
  of a specific muddle. They read the Basic Argument — the one that says you''re morally
  responsible for what you do only if you''re responsible for how you are, that you''re
  responsible for how you are only if you made yourself that way, and that this can
  never happen because nothing can be causa sui in the relevant sense — and half of
  them come away thinking it''s just an argument against determinism. It isn''t, and
  the interesting lesson is that the premises of the argument divide people up in
  ways that cut across the usual determinism/free-will battle lines. So: please act
  as a professional philosopher with a specialty in the metaphysics of free will,
  think through the logical space before writing anything, and produce a decision
  tree.


  Specs. The tree starts from a student who accepts only this: she sometimes rightly
  feels gratitude toward a friend who helped her, and she''s unsure whether that feeling
  commits her to anything metaphysical. Each internal node must be a question she
  can answer from a concrete case or her own reactions, not from knowing the literature
  — so no "are you a semicompatibilist?" nodes. I want at minimum nodes that force
  answers on: whether responsibility for an action requires responsibility for the
  character/motives it flowed from; whether responsibility for how you are requires
  having made yourself that way or whether a luck-informed but reasons-responsive
  history can substitute; whether a bounded regress (someone who deliberately shaped
  herself at twenty, out of materials she never chose) is enough or whether only ultimate
  self-creation would do; and whether a case where someone could not have done otherwise
  but acts from her own settled values settles anything. Leaves must include at least:
  the impossibilist who follows the argument; the hard incompatibilist who accepts
  the argument''s conclusion for responsibility-as-desert but keeps something else;
  the semicompatibilist who lets responsibility for action come apart from alternative
  possibilities; the source incompatibilist who wants a stronger kind of self-creation
  than the world supplies; and a revisionist who keeps the practices while conceding
  the metaphysics. For each leaf give one sentence on its most awkward commitment.


  Finally, two diagnostic sections: (1) flag any pair of leaves your tree cannot actually
  separate because every question that''s answerable without the labels gets answered
  the same way on both branches — I suspect the hard incompatibilist and the revisionist
  will merge, but check whether you can find a case that splits them (reactive attitudes
  toward someone who''s done nothing yet, maybe, or blame of the long-dead); and (2)
  note any combination of node answers that your tree leaves unoccupied, and say whether
  you think nobody holds it because it''s incoherent, because it''s unattractive,
  or just because it hasn''t been explored. If you find yourself wanting to add or
  delete a node to make the tree come out cleaner, do it, but tell me what you changed
  and why — the tree is the handout, but the diagnosis of its failures is what I''ll
  actually teach.


  ---


