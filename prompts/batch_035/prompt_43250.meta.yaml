  I TA a decision-analysis course — the one where sophomores learn decision trees
  and expected monetary value and think that''s the whole of rationality. Next week
  I get fifty minutes on the result people call Good''s theorem. For my purposes:
  if you have to pick an act now, you take the one with the highest expected value;
  but if instead you''ll get to see the outcome of some relevant observation for free
  before acting, and you re-pick then, the expected value of that setup is at least
  as high as picking blind. The gap is what the information is worth — so, the headline
  version: a rational agent never turns down free relevant information (free to get,
  and free to use — the agent has to actually re-optimize after seeing it, no costs
  anywhere).


  Don''t explain the theorem to me. Plan the fifty minutes.


  1. Order of pieces. Do they need to grind through one "how much would you pay for
  this test?" calculation by hand before the general statement, or does the general
  statement come first and create the appetite for the calculation? Tell me which
  and why, keeping in mind they''ve seen Bayes'' rule but are honestly wobbly on it.


  2. The carrying example. Every textbook uses the oil wildcatter deciding whether
  to pay for a seismic survey before drilling. Use that, or find me something better?
  Whatever you pick, spell out what the example must have (a prior you can write on
  the board, an observation that shifts it by a factor you can compute in your head,
  two acts whose payoffs depend on the state) and what it must not have (side issues
  like risk aversion or the value of drilling being different depending on who''s
  watching — I don''t want the example carrying freight it doesn''t need to).


  3. Misconceptions, in the order they''ll actually show up. I can already see two:
  "so more data is always good, period" (forgetting the free-and-costless clause and
  the re-optimizing clause), and hearing "never lowers the expected value" as "can''t
  leave you worse off than you''d have been" — it can, in particular realizations;
  it''s the expectation that''s protected. Where in the sequence should each get headed
