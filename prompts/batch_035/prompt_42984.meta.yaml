  is vacuous."

  3. B: "But your narrow definition is also a choice — counting only deaths by weapon
  privileges the forms of harm the modern world has gotten better at eliminating,
  while ignoring the ones it''s ramped up. The denominator (per capita) also does
  work: absolute numbers of violent deaths may be high or rising with population;
  per capita decline lets us say ''less violent'' while more people than ever die
  violently."

  4. A: "Per capita is the right measure if the question is how dangerous the world
