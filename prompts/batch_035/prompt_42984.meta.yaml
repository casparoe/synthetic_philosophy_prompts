  (1) The historian opened by saying that the long-term trend is unambiguous: if you
  measure the chance that a randomly chosen person dies violently — in war, homicide,
  or judicial execution — it is far lower today than in any earlier era, and the trend
  has been downward for centuries.


  (2) The doctor objected that this holds only under a narrow definition of violence
  as deliberate physical killing. If you count the harms the modern world inflicts
  indirectly — deaths from preventable disease and poverty, dangerous labor, and above
  all the tens of billions of animals killed annually in industrial farming — the
  claim that things are getting less violent collapses or reverses: by sheer numbers,
  the present may be the most violent period in history.


  (3) The historian replied that this is gerrymandering: on that definition nearly
  everything bad counts as violence, the word loses its meaning, and the original
  claim becomes vacuous rather than refuted. A definition that lets you count a heart
  attack caused by unsafe working conditions as violence also lets you count lung
  cancer from a legal product as violence, and at that point the debate is about how
  much badness there is, not about violence.


  (4) The doctor conceded that a line has to be drawn somewhere, but countered that
  the historian''s narrow definition draws the line just as arbitrarily — it counts
  the forms of harm that weapon-wielding humans inflict directly, which are exactly
  the forms the modern world has become good at suppressing, while excluding the forms
