  I work at the intersection of philosophy and game theory, and for several years
  I''ve been watching the backward induction debate sit perfectly still, and I''d
  like a diagnosis of what kind of disagreement it actually is.


  The setting, to fix terms: in a centipede game — Rosenthal''s construction, alternating
  take/pass with a growing pot — backward induction yields a unique subgame-perfect
  outcome in which the first mover takes immediately, and this seems at once inescapable
  and absurd. The Aumann camp treats this as a theorem: given common knowledge of
  rationality, the backward induction outcome follows; the "paradox" is a psychological
  residue, not a formal one. The dissenters disagree in two ways that I can''t fully
  separate. Pettit and Sugden argued that rational players are not in a position to
  run the backward induction argument at all — the reasoning requires a player at
  a late node to believe both that everyone is rational and that the play so far happened,
  which on their view of belief-formation cannot be done. Reny''s line (as I understand
  it, though I may be garbling the details) is that in some games the assumption of
  common knowledge of rationality cannot be maintained at unreached nodes: the game
  itself refutes the epistemic conditions the theorem needs where the theorem needs
  them. And then there''s the decision-theoretic wing: reaching node k is evidence
  that someone has already failed to be the backward-induction type, so a rational
  player should update on her own survival and pass a while longer — advice that seems
  to give better outcomes in the lab, where McKelvey and Palfrey found people passing
  well into the game.


  Each camp talks past the others. The theorem-provers respond to the dissenters by
  tightening the epistemic premises; the dissenters respond that the tightened premises
  hold, if at all, only on the path of play, where they do no work; the decision-theoreticians
  are told they''ve changed the subject from the given game to the given players.
  Nobody concedes anything.


  My hypothesis — offered only as a hypothesis — is that the dispute is largely two
  questions under one name. One is a question about a mathematical object: what does
  common knowledge of rationality entail in the abstract game tree, and the answer
  is a theorem, so there is nothing to argue about. The other is a question about
  a situated agent: what should a player do who finds herself at node k, holding the
  evidence that reaching node k itself constitutes? And I suspect the second question
  is infected by a distinction nobody states cleanly: whether "rationality" is a property
  of complete strategies (so a player must have a sequentially rational disposition
  about every node) or of acts at nodes actually reached (so a disposition to pass
