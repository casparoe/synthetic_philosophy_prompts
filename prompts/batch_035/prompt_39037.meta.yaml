  I''m a charge nurse on a medical-surgical unit, and I sit on our regional health
  network''s continuing-competence committee, which is responsible for recertifying
  nurses every two years. Part of that recertification has always been a closed-book
  medication-dosage examination: weight-based calculations, drip rates, pediatric
  conversions, taken with nothing but a pencil and scratch paper. The question now
  before the committee is whether that format survives, because in the last three
  years our network has rolled out an AI dose-checking assistant that is embedded
  in the medication workflow — every nurse now verifies doses through it on the ward,
  and many of our younger nurses have never calculated a drip rate by hand in practice.
  The committee has narrowed the options to three: (a) keep the unaided exam exactly
  as it is, on the grounds that it is our safety floor for the day the system is down,
  wrong, or mid-transfer between vendors; (b) let candidates take the exam with the
  assistant available, testing the nurse-plus-tool unit we actually rely on; or (c)
  some hybrid, for instance an exam in two parts where the emergency-scenario portion
  must be done unaided.


  I have no philosophy background — my training is all clinical — but I''ve been chewing
  on this in my own time, and I came across an idea that seems to be exactly about
  our situation. Two philosophers, Andy Clark and David Chalmers, published a paper
  in 1998 called "The Extended Mind" arguing that when an external resource is reliably
  available, automatically trusted, and used the way internal memory is used, it starts
  to count as part of the person''s mind rather than a mere tool. Their example is
  a man named Otto, who has memory problems and writes everything he needs to remember
  in a notebook that goes everywhere with him; they argue the notebook plays the same
  role for Otto that biological memory plays for Inga, who just remembers things.
  If that''s right, it seems to bear directly on our question: if the dose-checking
  assistant is genuinely part of how a nurse knows the dose, then testing her with
  the tool confiscated tests a configuration she never uses — a bit like requiring
