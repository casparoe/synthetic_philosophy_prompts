  reply on the other side, and I want it taken seriously rather than dismissed: Otto''s
  notebook doesn''t go down for maintenance, get a bad software update, or silently
  disagree with him, and a nurse who has never hand-calculated may be helpless precisely
  in the emergency the unaided exam is meant to guarantee against.


