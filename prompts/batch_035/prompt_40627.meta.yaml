  the illusionism vs. realism debate about phenomenal consciousness — great for "why
  has the debate stalled" type. This is a well-known stalled debate: illusionists
  say phenomenality is an illusion; anti-illusionists (Chalmers, Strawson "realistic
  realism") say the illusion of consciousness would itself be a consciousness, so
  it can''t be an illusion. Everyone entrenched. Perfect for diagnosis type.


