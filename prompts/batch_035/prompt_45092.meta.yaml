  \ all art is propaganda, the symphony of black and white... Risk of needing specific\
  \ quotes. Better to paraphrase.\n\nThe Weber one seems great for the verdict type:\
  \ \"Can culture be a cause?\" — someone's verdicts on cases: did Protestantism cause\
