  \ secularized regions — ?\n\nNeed verdicts jointly consistent with multiple rules,\
  \ and a new case that splits rules.\n\nLet's think about what rules fit verdicts\
  \ {1 yes, 2 no, 3 no, 4 yes}:\n- Rule M (micro-mechanism): a cultural explanation\
