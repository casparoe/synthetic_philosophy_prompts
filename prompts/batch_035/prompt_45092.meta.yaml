  \ have counterfactually mattered; (b) cultural explanation only allowed when institutional\
  \ factors have been ruled out; (c) culture explains only via values that reward\
  \ deferred gratification / thisworldly asceticism.\n\nActually let me think about\
  \ who the \"person or body\" is. A friend/colleague at a seminar? Professor writing\
  \ the prompt — persona is a philosophy professor. So: \"I run a seminar on philosophy\
  \ of social science...\" They report a colleague's (or their own department's journal\
  \ club's?) track record. Maybe better: the editorial board of a journal deciding\
  \ whether papers' cultural explanations work. Or a friend in economic history. The\
  \ prompt-writer is a philosophy professor discussing with a friend in economic history\
  \ whose verdicts on cases of cultural explanation are given.\n\nDesign the earlier\
  \ verdicts to be jointly consistent with multiple rules and choose a new case where\
  \ rules diverge.\n\nEarlier verdicts (friend says):\n- Weber's Protestant ethic\
  \ explaining the rise of capitalism in 17th c. Holland/England: yes, culture was\
  \ a genuine cause.\n- Confucian values explaining why China lagged in commercial/industrial\
  \ development (Weber himself argued something like this): friend says no — bad explanation.\n\
  - Japanese work ethic / samurai ethos explaining Meiji Japan's rapid industrialization:\
  \ yes? Hmm.\n- Mediterranean \"amoral familism\" (Banfield) explaining southern\
  \ Italian economic backwardness: friend says no.\n- Contemporary: the culture of\
  \ science explaining replicability crisis... hmm.\n\nLet me craft so that two rules\
  \ fit:\n\nRule A (motivational/psychological rule): culture explains only when we\
  \ can show the values were actually internalized and operating as motives in individuals\
  \ (testable in letters, diaries, behavior) — and it explains only differences, i.e.,\
  \ culture must vary.\nRule B (institutional-residue rule): culture explains only\
  \ when the values have become embodied in institutions, and then the institutions\
  \ are the proximate cause — so \"culture as cause\" is at best a placeholder for\
  \ institutional history.\nRule C (Weberian rule): cultural explanation works only\
  \ where the value system made an economically irrational behavior economically rational\
  \ (or psychologically rewarding) — e.g., asceticism redirected.\n\nActually the\
  \ classic problem: \"Can culture be a cause?\" The competing accounts of what's\
  \ going on in a Weber-style explanation:\n1. Culture as values in heads causing\
  \ behavior (psychological mechanism).\n2. Culture as embodied in institutions —\
  \ then culture isn't an independent cause.\n3. Culture as a selection effect: economic\
  \ conditions shaped the culture (reverse causation) — friend might reject explanations\
  \ where the culture itself is plausibly a consequence.\n\nLet me set the friend's\
  \ verdicts:\n\n1. Protestant ethic and capitalism in 17th-century England: friend\
  \ says YES, genuine cultural cause (values in heads of actual Puritan merchants,\
  \ evidenced by diaries etc.).\n2. Confucianism held back Chinese commercial development:\
