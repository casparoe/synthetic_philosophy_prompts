  ---


  I''m a PhD student in HCI (human-AI interaction side, not the pure phil side) and
  I''m TA-ing an undergrad course on ethics of technology this fall. Next unit is
  on AI assistants and I want a decision-tree handout that sorts students into an
  actual position on when an assistant may refuse a request or override a user''s
  stated preference, instead of them just saying "it depends" and moving on.


  Requirements:


  - Build the tree from the logical space, not from a list of schools. The branching
  questions I want in there somewhere: (1) who is the intervention for — the user''s
  own good, third parties, or nobody''s good (the assistant "following its conscience"
  / the company''s values); (2) does the assistant need evidence the user''s choice
  is somehow compromised (drunk, uninformed, in a crisis, caught in an impulsive moment)
  before it may intervene, or can it intervene on fully autonomous choices too — this
  is basically soft vs hard paternalism but don''t label the node that way, phrase
  it as a case; (3) transparency — must the user be able to find out the assistant
  steered them, or may it quietly nudge / selectively withhold stuff for their own
  benefit; (4) standing — does it matter that the intervener is a product a company
  sells you rather than a state, a friend, or a fiduciary like a doctor.


  - The leaves should include at least: the laissez-faire view (refuse only to protect
  others), soft paternalism, hard paternalism, the epistemic-paternalism view (the
  interesting question there is what it does with cases where the info being withheld
  is stuff the user explicitly asked for), a fiduciary view on which the assistant
  is more like a lawyer with duties to your good, the conscience view where refusal
  isn''t paternalism at all because it''s not about you, and the "it''s a tool" view
  where the assistant has no standing of its own and it''s all just whatever the operator
  configured. If you think there are other real positions in the space, add them;
  if a region of the space is empty, say so and guess why.


  - Nodes have to be concrete cases a 19-year-old with zero philosophy can answer
  without knowing where the branch leads. Scenarios I''d like worked in, feel free
  to add better ones: someone at 2am after a breakup asking the assistant to send
  a scorched-earth text right now; someone asking for a calorie-cutting meal plan
  while the assistant can see (from the convo) signs of disordered eating; someone
  asking for the most one-sided summary of a political story because they''re stressed
  and want it short; the assistant noticing a message would be career-ending and asking
  "are you sure you want to send this" (vs. quietly delaying it); and one calibration
  case everyone agrees on, like an actively suicidal user asking for a method — include
  that one on purpose so we can check whether it sorts anyone, since if a case produces
  no disagreement it''s useless as a node.


  - Flag pairs of leaves the tree can''t cleanly separate — my guess is soft paternalism
  and epistemic paternalism bleed into each other, and the conscience view vs. the
  tool view may not be separable by any case question, only by asking about labels
  directly, which defeats the point. If that''s right say so, don''t paper over it.


  - Ten-ish branch questions max, each with 2-3 options, and a one-line "most awkward
  commitment" under each leaf.


  Also keep the handout tone light, these students will not read a wall of text. And
  if you could note at the top which single node does the most sorting work, that''d
  help me decide what to cut if it runs long. Sorry for the long spec — last years
  handout was a mess and im not doing that again lol.


