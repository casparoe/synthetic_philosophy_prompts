  \ New case: self-generated belief (from the member's own misreading, e.g., of an\
  \ outdated rulebook or a rumor she half-remembered) → A1 valid, A2 valid, B invalid.\
  \ Hmm, then two rules agree. Better: new case where belief came from the counterparty's\
