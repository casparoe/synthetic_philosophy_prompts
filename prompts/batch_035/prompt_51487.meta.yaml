  \ a competency check; and one ruled invalid: someone consenting while very drunk.\
  \ Those fix the competence dimension but don't need to distinguish A/B.\n\nHmm,\
  \ but the prompt shouldn't get too long. The animal-consciousness example is ~4\
  \ sentences; the professor one ~5. Mine can be a solid paragraph: 6-8 past rulings,\
  \ then 3-4 new cases or one new case plus \"what further case would settle it.\"\
  \n\nActually the type asks: predict verdict on new case(s), identify candidate rules,\
  \ best guess with reasons, and the further case that would tell them apart. So structure:\
  \ state role/track record (6ish cases), state new case, then ask for: predicted\
