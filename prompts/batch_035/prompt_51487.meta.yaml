  \ a threat, period — regardless of source.\nRule C (competence): invalid iff the\
  \ consenter lacked the capacity to understand the general nature of what they agreed\
  \ to.\n\nPast rulings must be consistent with both A and B — so in all past cases,\
  \ either the false belief was induced (A-invalid, B-invalid) or there was no operative\
  \ false belief at all (A-valid, B-valid). I.e., avoid past cases where a material\
  \ false belief existed but was self-generated. Wait, that's exactly the new case.\
  \ Good: the record simply never included an uninduced-material-false-belief case,\
  \ and no case where coercion came from a third party/background.\n\nAlso need coercion\
  \ cases: past ruling where threat came from the counterparty → invalid (fits both).\
  \ Past case with unpleasant consequences but no threat (e.g., \"you'll lose your\
  \ deposit if you withdraw\" — a penalty the counterparty created but was part of\
  \ the deal) — ruling: valid? Both A and B would agree valid (a term of the agreement\
  \ isn't a threat to it). Fine.\n\nCompetence cases: past ruling that a member with\
  \ an intellectual disability who understood the general nature of the arrangement\
  \ could validly consent (valid under capacity-as-understanding-the-nature); both\
  \ rules handle it via C. Actually competence cases should also be fixed. Maybe include\
