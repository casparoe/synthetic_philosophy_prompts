  an infinite series with an infinite sum. The distances Achilles must cover — say
  100, 10, 1, ... meters — form a converging geometric series, and so do the corresponding
  times. Both sums are finite, so Achilles passes the tortoise at a definite time
  and place, and there is no paradox. Aristotle saw this clearly: he argued that Zeno''s
  demand for infinitely many divisions of the distance applies equally to the time,
