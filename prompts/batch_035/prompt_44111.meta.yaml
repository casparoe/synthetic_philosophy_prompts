reasoning_summary: 'Choose domain: Wittgenstein''s language games and family resemblance.
  Type: "prove too much" argument. The asker is a longtime rationalist blog reader,
  casual tone, typo or two, request "what would change your mind."


  Build an argument about family resemblance that seems to prove too much — e.g.,
  an argument that concludes all concepts are family resemblance concepts, therefore
  no concept has necessary conditions, therefore there are no definitions anywhere
  including in logic/math, so modus ponens has no rule... Something like:


  (1) Wittgenstein: many concepts (game) have no common essence, only overlapping
  similarities.

  (2) If some concepts lack a common essence, we can''t tell in advance which ones
  do.

  (3) Any proposed defining condition for a concept can be met by imagining a deviant
  case (borderline cases everywhere) — actually let me craft a chain with a subtle
  flaw.


  Better: an argument that family resemblance generalizes to everything, including
  logical connectives, so the law of non-contradiction is just a language-game move,
  and then... The asker finds this proves too much.


  Draft:


  "A friend on a LessWrong-adjacent discord hit me with this and I can''t find the
  exit.


  (1) Wittgenstein''s point about ''game'' was that lots of concepts work fine without
  a common essence: just overlapping, criss-crossing similarities — family resemblance.

  (2) Nothing marks out in advance which concepts are essence-governed and which are
  merely family resemblance: at best we discover this after failing to find the essence,
  and we''ve failed for ''game'', ''art'', ''religion'', ''life'', ...

  (3) Any case where someone claims to have found the essence of a concept, critics
  can imagine deviant cases the definition excludes but intuition includes, so the
  ''discovery'' is at best provisional, forever.

  (4) So provisionally, every concept is family resemblance.

  (5) Logical and mathematical concepts are concepts.

  (6) So ''and'', ''not'', ''number'' etc are family resemblance concepts with no
  essence — no necessary conditions.

  (7) If a concept has no necessary conditions, nothing is ruled out by it: any candidate
  can in principle count as a case, given suitable similarities to paradigm cases.

  (8) So a statement of the form ''p and not-p'' could in principle count as true,
  given a suitable community treating it that way; the law of non-contradiction is
  just how our language-game happens to be played.

  (9) But if nothing is ruled out, then the claim ''no concept has necessary conditions''
  doesn''t rule anything out either, and also nothing rules out that some concepts
  do have essences after all.


  Hmm, need the "proves too much" flavor: the conclusion is absurd — no truth anywhere,
  or logic is just convention. The flaw could be between (4) and (6): sliding from
  ''no essence'' to ''no constraints at all'' — conflating no common essence with
  no norms; family resemblance still involves rule-governed judgment within forms
  of life, and Wittgenstein explicitly isn''t a relativist. Or the slide from family
  resemblance to "anything goes" — (7) is the flawed step: from ''no necessary conditions''
  it infers ''nothing is ruled out'', but a concept can lack a common essence while
  still excluding things. Also (5)-(6): Wittgenstein himself treated math differently
  (Remarks on the Foundations of Mathematics) — contested. Also step (3) is questionable.


  The asker should not signal the answer. Ask: which step to reject, what rejecting
  it costs. Request: say what would change your mind / where the reasoning is most
  likely to fail.


  Casual tone, one or two typos. E.g., "recieve" or "grammer" — maybe "defintion".
  Keep it short-ish. From a longtime rationalist blog reader: mention LessWrong, SSC,
  etc.? "been reading LW/rationalist stuff since like 2013".


  Write it.'
