  - Tier B: views that are serious but, in your judgment, mortally wounded;

  - Tier C: views you would assign mainly as cautionary tales.

  Justify every placement in two or three sentences. If a family belongs in a tier
  only conditionally (e.g., under a particular formulation), say so and state the
  condition.


  Step 3 — Commit. If you were forced to bet on one family as the most likely route
  to a stable resolution of the population-ethical paradoxes, which would it be? Name
  it, give your single strongest reason, and then state the one objection to your
  bet that worries you most.


  Please do not pad your answer with historical throat-clearing about Parfit; I assume
  the reader knows the basics.


