  ---


  I am a final-year secondary school student writing an extended essay in philosophy,
  and I have committed to a thesis I want to stress-test before I defend it. My view
  is that patriotism is a virtue, but not in the vague "love of country" sense; the
  version I defend is that partiality towards compatriots is structurally like partiality
  towards family. Both, I claim, arise from a relationship of shared formative dependence:
  just as one''s obligations to parents and siblings are not contracted for but grow
  out of being formed by them, so one''s obligations to fellow citizens grow out of
  being formed by a shared language, institutions, and civic life. From this I conclude
  that the patriot''s special concern for compatriots — preferring their welfare,
  defending their interests, accepting sacrifices for them that one would not accept
  for strangers — is a virtue rather than a prejudice.


  What I need is a map of what would count against this view. I would like you to
  sort the defeaters from fatal to merely awkward, and to be explicit about the following:
  (1) where the family analogy might break — for instance, whether a country, unlike
  a family, can act as a single responsible agent, so that loyalty to it can be loyalty
  to a wrongdoer in a way family loyalty rarely is; (2) whether my view makes predictions
  I should be embarrassed by — e.g., whether it commits me to holding that a citizen
  should prefer modest benefits to compatriots over greater benefits to foreigners,
  and whether there is a principled place for me to stop; (3) what a defender of my
  view would himself concede as counting against it, as opposed to what only its critics
  say. I would also like an honest verdict on whether the view, once qualified ("it
  is a virtue only where the country is broadly just", etc.), has been insulated into
  unfalsifiability — and whether that would be a defect in a view of this kind. The
  most persuasive thing you could give me, if it exists, would be a case where the
  two claims I have run together — that partiality is permissible and that partiality
  is virtuous — come apart.


