reasoning_summary: 'Let me pick a domain and type. Domain: Collective memory vs. history.
  Type: satire/parody piece. Combine: e.g., an Onion-style article or a mock institutional
  document about memorialization overriding archival record. Or a parody travel guide
  / FAQ for a "Ministry of Memory" that prioritizes what the community remembers over
  what the archives say.


  Good idea: a satirical set of minutes or a policy memo... but the memo type isn''t
  picked; the satire type is fine with genre parody like an FAQ or terms of service.
  Let''s do: a staff handbook / FAQ for archivists at a fictional institution that
  has adopted a policy of "commemorative primacy": when documents conflict with the
  community''s cherished memory, the documents are moved to a special "reconciliation
  annex." The satire should land the real issues: fallibility of collective memory,
  the epistemic value of record, whose memory counts (which community?), the risk
  of enshrining myth, the idea that memory serves identity/needs while history serves
  truth (Halbwachs-style points, but no need to cite). Include absurd details: "Version
  2.0 of the founding story," "correction ceremonies," etc. The humor comes from exaggerating
  real features of commemorative practice: monument inscriptions that simplify, anniversaries
  that fix narrative, "the town remembers it snowed" vs weather records.


  Avoid super niche references. Keep prompt focused, formal, in American English,
  request the answer in American English. Length: a few sentences to maybe a short
  paragraph with specs (~150-250 words of prompt).


  Draft:


  "Write a satirical staff handbook, around 600 words, for the Records Reconciliation
  Office of a small fictional republic whose constitution declares that where the
  nation''s collective memory conflicts with the documentary record, memory prevails
  ''in matters of ceremony, education, and national self-regard.'' ..." — careful:
  quote marks around invented text is fine (it''s not from a real text). The rule
  is only about real texts. Invented quotes in a fictional constitution are fine.


  The humor should come from actual features of collective memory: that it is selective,
  present-serving, smoothed into narrative, transmitted through rituals and anniversaries,
  contested between groups; and from the real tension with archival practice (dating,
  sourcing, revision). Include concrete absurd procedures: an annual "Calendar of
  the Actually Happened" locked in a basement; a form archivists file when a date
  in the schoolbooks can''t be right; a "discrepancy escrow." Include deadpan rules
  like "When two communities remember differently, the Office convenes a joint commemoration
  in which both events occurred, in different districts." That lands the Halbwachs
  point that memory is plural and identity-constituting without citing him.


  Also ask that the piece be funny to someone who knows the collective-memory literature
  and legible to someone who doesn''t. Voice: bureaucratic, deadpan. Formatted as
  numbered sections or FAQ entries. Length ~600 words. Answer in American English.


  I don''t need any web search — no real quotes, no real-source specifics. Good.'
