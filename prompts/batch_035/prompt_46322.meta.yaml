  Argument sketch:

  1. What matters morally for a system is what it''s like to be it — its experiences.

  2. Experiences are fixed by functional/computational organization: if a system computes
  the same thing, it feels the same, regardless of substrate.

  3. Any finite computation can be implemented by a giant lookup table.

  4. A lookup table has no "real" causal structure — it''s just a mapping from inputs
  to outputs (built in advance, no processing happens at run time).

  5. Substrate doesn''t matter (by 2), and lookup table vs. real-time computation
  isn''t a substrate difference — it''s the same computation, so by 2 the table feels
  pain when you look up an entry.

  6. But a book of lookup entries feels nothing — absurd.

  7. So (2) is false: computation isn''t what matters, or functionalism fails.


