  Option: Superrationality + summary-fairness type. Hofstadter''s superrationality:
  the idea that if a problem is symmetric, rational agents should assume all rational
  agents will decide the same way, so cooperate in one-shot PD. Common misrepresentations:
  conflating superrationality with evidential decision theory; claiming Hofstadter
  thought cooperation "causes" others to cooperate (magical thinking); overstating
  it as "one-boxing without causation"; presenting it as refuted by the fact that
  people defect. A summary with subtle errors: e.g., "Hofstadter argued that rational
  players in a prisoner''s dilemma should cooperate because their decision and the
  other''s are perfectly correlated — and since correlation implies causation in this
  case..." Hmm, that''s a howler. Subtle misrepresentation: "superrationality is just
  evidential decision theory applied to symmetric games, so EDTers are committed to
  it in all cases" — subtle because superrationality is restricted to symmetric decisions
  among agents reasoning identically, whereas EDT would cooperate even in asymmetric
  cases (e.g., against a known defector). Another: "Hofstadter''s argument requires
  that the other player actually reasons the same way; if you know the other player
  is a utility-maximizer who will defect, superrationality still tells you to cooperate"
  — defender would object that superrationality only applies when both players are
  superrational and know it.


  Also could include the "plurality" of clones — Hofstadter ran a "Prophet" contest
  / the Loper/Prophet game in Metamagical Themas, and the "doppelgängers." And the
  notion that superrationality addresses Newcomb-like problems. A popular summary
  might say "superrationality says you should treat your decision as the output of
  a computation that all rational agents share, so choosing cooperate is choosing
  for everyone — and this proves that one-boxing is right and that voting is rational."
  That bundles things.


