  Supererogation with case verdicts seems great. The asker gives verdicts on cases:
  some clearly obligatory, some clearly beyond duty (fine but not required), some
  where duty seems to fade (rescue costs), a hard-to-reconcile pair. Classic issues:
  Singer''s drowning child (rescue as duty when cost is modest), the distance problem,
  the demandingness objection, heroism vs. duty, "ought implies can", the stringency
  gradient, Heyd''s definition, the "saint vs. duty" boundary, Mott''s "duties of
  greatness", the Ullmann-Margalit "prima facie duty" issue, the Parfit/arguments
  about supererogation collapsing under maximizing consequentialism (if it''s better
  to do more, how can less be permissible?). A hard-to-reconcile pair: e.g., "jumping
  on a grenade to save five is supererogatory (fine not to)" vs. "refusing to donate
  $100 to save a life is wrong even though it costs less" — or the demandingness:
  "I think giving 10% of income is beyond duty, but I also think spending $300 on
  a concert when you could save a life instead is not wrong." Another classic tension:
  supererogation presupposes a non-maximizing structure — if the best act is always
  required, supererogation collapses. So the pair: "I think more good is always at
  least permissible" and "I think heroic self-sacrifice is not required" — hard to
  reconcile for consequentialists.


  Design cases:


  1. Jumping on a grenade to save squadmates: heroic, not required — refusing not
  blameworthy. (Classic supererogation.)

  2. Donating bone marrow (minor pain, weeks of recovery) to save a stranger: seems
  like it would be wrong not to... or actually many people think it''s supererogatory.
  Could make it a hard one.

  3. Drowning child in shallow pond, ruining $200 boots: clearly required to wade
  in. (Singer case, widely known.)

  4. Giving $500/yr to effective charity: I think not doing it is a bit wrong but
  not nearly as wrong as walking past the pond — awkward.

  5. A lifeguard on duty who lets someone drown: clearly wrong. Lifeguard off duty
  who swims out at real risk: hero, not required.

  6. Keeping a promise at great cost (missing your own wedding... maybe too silly).
  Keeping a promise to help a friend move when you''d miss a once-in-a-lifetime concert:
  I think you must keep it; but donating more is beyond duty — cost/benefit asymmetry.

  7. The case the asker goes back and forth on: donating a kidney to a stranger.


