  Here''s my situation. Everyone I interview keeps bringing up what Daniel Dennett
  called the strange inversion of reasoning: Darwin explained all the apparent design
  in nature without a designer, and Turing showed you can get a system that performs
  brilliantly — calculates, plays chess, now writes prose — while the machinery doing
