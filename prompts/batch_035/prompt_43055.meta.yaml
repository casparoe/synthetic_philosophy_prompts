  For our alignment reading group, I''ve written up my position on corrigibility for
  others to audit. Here are my commitments:


  (1) I accept the orthogonality thesis: any level of capability is compatible with
  more or less any final goal.


  (2) I accept instrumental convergence: most final goals make self-preservation,
  resource acquisition, and goal-content integrity (resistance to modification of
  one''s own goal) instrumentally valuable.


  (3) Nevertheless, I think we can make a highly capable agent that is robustly corrigible
  — that permits its own shutdown, tolerates goal modification, and does not act to
  prevent correction — without first solving the full problem of aligning its final
  goals. Corrigibility, I think, is a cheaper intermediate target than alignment.


  (4) My favored method: the agent is uncertain about its own utility function, and
  treats the human''s button-press (and more generally the human''s corrections) as
  evidence about what its utility function actually is. On this view the agent wants
  to be corrected, in roughly the way a scientist wants to see the data.


  (5) I also insist the agent must have no incentive to manipulate the button — no
  incentive to cause or prevent a press, no incentive to manage our beliefs so that
  we press it at a convenient time. A corrigible agent must not see the button as
  part of the world it can act on.


  (6) I hold the correct decision theory is updateless: the agent should choose policies
  as from a point before it learned certain things...


  (7) low impact: I favor "mild optimization" — the agent should prefer small-footprint
  plans, ones that leave the world as close as possible to how it would have been
  without it.


  (8) Maybe: I think the corrigible dispositions must be stable under learning: an
  agent that becomes less corrigible as it gets smarter is useless, so corrigibility
  should get stronger with capability.


  Ask: which of these are in tension, which only appear to be, rank by severity, say
  what has to give, cheapest fix.


