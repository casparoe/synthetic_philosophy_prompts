  ---


  Quick background on where I''m coming from: I''m a software engineer, zero formal
  philosophy training, but a few years ago I stumbled into the effective altruism
  corner of the internet and it got me thinking about wild animal suffering — the
  billions of animals in nature that die of starvation, get eaten alive as kids, freeze,
  etc. If suffering matters, nature produces an absolutely staggering amount of it,
  and almost nobody even counts it.


  Since then I keep running into two positions that both present themselves as the
  "rational, welfare-focused" take, and they point in exactly opposite directions
  on a concrete question: does destroying wild habitat (say, converting a forest to
  cattle pasture, or just paving it) reduce the total amount of suffering in the world?


  Position A goes like this: most wild animals are r-strategists, meaning they have
  huge numbers of offspring and the vast majority die very young — a fish lays thousands
  of eggs and most of those offspring get eaten or starve within weeks, and that sort
  of thing is the norm across invertebrates, amphibians, fish, etc. So the average
  wild animal life is plausibly strongly net negative, and if that''s right then the
  fewer wild animals that ever exist, the better. From there it''s a short step to:
  anything that shrinks wild animal populations, including habitat destruction, reduces
  suffering. Even if you feel gross saying it.


  Position B pushes back in two parts, and I want to understand how much of the disagreement
  is each part. Part one is factual: habitat destruction doesn''t delete animals from
  existence, it swaps one community of animals for another. A pasture isn''t an empty
  lot, it''s loaded with earthworms, insects, mice; count the individuals and a hectare
  of grazed land might host as many or more animals than a hectare of forest did,
  just arranged differently. And on farms the animals that do exist might not be having
  great lives either. So "fewer wild animals" is not even the right accounting — the
  question is whether the post-destruction community contains less suffering than
  the pre-destruction one, and nobody can sign that number with a straight face. Part
  two is more philosophical: even if we can''t sign it, destroying habitat on the
  basis of a hunch seems like it gets something backwards — we''re inflicting a certain,
  massive change to prevent a speculative harm, and the humility response is to leave
  the thing alone until you understand it.


  Anyway, here''s what I actually want from you. Compare these two positions properly.
  Specifically: (1) where exactly does the disagreement live — is it about empirical
  facts (population densities, whether the average wild life is net negative), about
  how to act under deep uncertainty, or about something more like a value difference
  over whether the existence of animals or intact ecosystems is good in itself, independent
  of felt experiences? (2) Which parts of each position could in principle be settled
  by better data, and which parts never will be? (3) And then your honest take: which
  position is on firmer ground, and does your answer change depending on whether the
  average wild animal life is slightly negative versus catastrophically negative?


  One formatting thing: please write it as plain continuous prose, like a long email
  — no headings, no bullet points, no bold, no tables. Paragraphs are fine, lists
  are not. And please don''t cop out with "more research is needed" as your whole
  conclusion, I''d like an actual verdict.


