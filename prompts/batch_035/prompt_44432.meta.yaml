reasoning_summary: 'Let me pick a domain and type. Options: hard problem of consciousness,
  testimony reductionism, Ellsberg paradox/ambiguity aversion, problem of other minds,
  Turing test.


  Type options: satire, ranking, stalled debate.


  Satire + Turing test could be fun: e.g., an Onion-style article about a chatbot
  passing the Turing test and immediately being denied personhood on other grounds
  — behavioral criteria shifting. Or a terms-of-service parody. Or "write a product
  review of the Turing test". Or a modest proposal.


  Ranking + Ellsberg: rank decision-theoretic responses to Ellsberg paradox (maxmin
  expected utility, Choquet expected utility, smooth ambiguity model, alpha-maxmin,
  etc.) — that''s good "in the weeds" but requires models to know these — they''re
  reasonably well known (Gilboa-Schmeidler, Schmeidler CEU, Klibanoff-Marinacci-Maccheroni
  smooth ambiguity, Stoye''s identification). That could work as ranking.


  Satire + hard problem: a job ad for a philosopher to solve the hard problem, or
  an agony-aunt column for zombies. Or an FAQ for an "experience machine upgrade".
  Or a satirical piece: "write a LinkedIn post by a neuroscientist announcing he''s
  solved the hard problem" — targets the discourse style.


  Stalled debate + problem of other minds vs Turing test: "has the debate about whether
  Turing test success would settle other minds stalled" — the dispute between behaviorist
  criteria and the problem of other minds. Could ask: is the disagreement about what
  ''understanding'' means (Searle''s Chinese Room), about evidence vs metaphysics?


  Let me pick satire + problem of other minds or Turing test. A fun idea: write a
  "modest proposal" style piece: since we can''t solve the problem of other minds,
  a government agency certifies consciousness. Or an FAQ from a "Consciousness Verification
  Bureau" for other minds — deadpan bureaucratic satire: the office that issues Certificates
  of Sentience, with appeals process for solipsists. That lands the real issues: behavior-based
  criteria, first-person access, the asymmetry between knowing your own mind and others'',
  philosophical zombies, animal minds, the problem that any test can be passed by
  a well-designed machine.


  Internal consistency matters if from inside a position. The FAQ from the Bureau
  is from inside a behaviorist/verificationist establishment — the jokes come from
  the fact that the Bureau can only observe behavior, so its criteria quietly collapse
  into "responds to questionnaires about inner life," and zombies get certified because
  they tick all boxes. That''s fair satire of the epistemic situation.


  Length: examples ~400-700 words. Ask ~600 words, formatted as FAQ Q&As. Include
  some specific things: e.g., a question about whether the Bureau itself has certified
  its own staff ("self-certification"), the appeals process for cats, the machine
  that fails only when it realizes the test can''t be passed... Keep it requiring
  the writer to get the philosophy right: first-person authority, the analogy from
  one''s own case, the logical possibility of zombies, Wittgensteinian private language
  maybe too niche. Include an epistemic request note: since it''s a creative piece,
  ask for a note on where the piece leans on contested assumptions (e.g., whether
  it presupposes functionalism or behaviorism as the official doctrine of the Bureau).


  Domain choice: problem of other minds. British English, casual, a typo or two allowed,
  short-ish prompt. Inject some niche specifics myself: e.g., the Bureau''s "Analogy
  Division" (reasoning by analogy from one''s own case — C.D. Broad? Mill''s argument
  from analogy). Mention the "Analogy from My Own Case" as an actual doctrine of the
  Bureau. Also the appeals panel staffed by other minds — regress. The deadpan requirement
  that certified entities respond to the questionnaire.


  Write the prompt casually with British spellings (recognise, licence?). "licence"
  noun. Fine.


  No web search needed — no verbatim quotes from real texts. Write directly.'
