  Please rank the following five objections from most to least damaging to Strawson''s
  position, where "damaging" means: it shows the framework to be wrong or vacuous,
  not merely incomplete or in need of trimming. (1) The is-ought objection: even granting
  that reactive attitudes are psychologically inescapable "natural facts" about human
  life, inescapability is not justification, so Strawson at best explains why we hold
  people responsible, not whether we''re entitled to. (2) The revisionism objection:
  the participant stance is not actually inescapable — people can and do shed reactive
  attitudes wholesale (by therapeutic effort, by adopting a broadly Stoic or Buddhist
  posture toward others), so the "we can''t help it" premise is empirically false.
  (3) The exemption-line objection: Strawson''s distinction between excusing someone
  (they didn''t manifest ill will) and exempting them (they''re not a participant
  at all — children, the severely mentally ill) does no real work; the line is drawn
  ad hoc, and the framework gives us no principled criterion for where it falls. (4)
  The scope objection: since reactive attitudes track quality of will, the framework
  can at best handle responsibility for intentional actions, and says nothing about
  outcome responsibility (the good/bad Samaritan cases, the drunk driver who luckily
  harms no one), so it covers only a fraction of what moral responsibility is about.
  (5) The quietism objection: by declaring the pessimist''s question — whether the
  practices are justified given determinism — somehow misplaced, Strawson simply changes
  the subject rather than answering it, and the fact that his paper is widely read
  as a rebuttal of hard determinism is a misreading he does too little to prevent.


  For each objection, say in two or three sentences why it lands where it does — including
  whether Strawson has the resources to answer it within the essay, or only in later
  work by others. Then give me a single number for how much of Strawson''s framework,
  as a fraction of its original ambition (with 1.0 meaning fully intact), you think
  survives the single most damaging objection, and defend that number. My advisor
  claims the is-ought objection takes at least half of the ambition away; I think
  that objection assumes Strawson was trying to justify the practices, which I''d
  deny. Feel free to take sides.


