  ---


  I''m a third-year PhD student working on a chapter about Strawson''s "Freedom and
  Resentment," and I''ve hit the point where I need to take stock of the objections
  literature rather than keep accumulating it. My advisor and I disagree about how
  much of Strawson actually survives his critics, and rather than litigate it verbally
