  (7) There are no ungrounded contingent truths. A proposition nothing makes true
  isn''t true, hence isn''t knowable, not even by an omniscient being.

  (8) So no counterfactuals of creaturely freedom are true, middle knowledge has no
  objects, and Molinism is knowledge of nothing.


