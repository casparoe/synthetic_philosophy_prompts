  That''s non-negotiable: the whole point of middle knowledge is to let God survey
  how creatures would freely act and then choose a world, without God being the author
  of what Curley does in it.

  (3) Every contingent truth is grounded — true in virtue of how things are, in facts
  about actual substances, their natures, and their powers.

  (4) No creature grounds the Curley conditional, since in the world where it matters
  Curley is never created, and an uncreated creature has no goings-on to ground anything.

  (5) God doesn''t ground it either: if God''s will made it true that Curley would
  freely take the bribe, the truth would be a decree, and the taking wouldn''t be
  free in any sense worth the name.

  (6) So if the conditional is true, it''s a contingent truth with no ground at all
