  one is a fraud? Or consent to COVID vaccine trial with overly optimistic brochure.
  Also consent obtained after someone lied about their age (35 not 42).


  Write casually with a typo or two. No real quotes needed, so no searching required.
  Ensure no quotation marks around verbatim real text — quotes for reported speech
