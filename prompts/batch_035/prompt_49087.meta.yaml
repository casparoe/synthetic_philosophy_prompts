reasoning_summary: 'Let me pick a domain and type. Domain: The precautionary principle.
  Type: Report one''s verdicts on cases and ask what principle captures them. This
  works well — a non-academic person with gut verdicts about precaution cases.


  Or Benin Bronzes with verdict-type... Precautionary principle fits nicely with case
  verdicts. Write a polished, formal-ish prompt from a layperson who''s been thinking
  on their own.


  Cases: something like: I won''t take a new medication without long-term studies;
  I happily eat aged cheese made by traditional methods with no studies; I fly in
  planes (new-ish tech but heavily tested); I microwave food (was once feared); I
  refuse genetically modified foods but take unregulated herbal supplements; I don''t
  vaccinate my kids because of small risk? That last one might be loaded but is a
  good hard case — actually vaccines are well-studied, so precaution points toward
  vaccinating. Good hard-to-reconcile pair: refusing new tech (GMO) but accepting
  herbal supplement with no testing at all. Also: I won''t let my kids play in a park
  where soil was remediated to a safe level, but let them swim in a natural lake with
  unmeasured runoff. Or: I filter my water against trace pharmaceuticals but drive
  them long distances (driving risk much larger). Inversion of precaution: choosing
  a familiar risk over a smaller unfamiliar one.


  Also maybe a case about AI or geoengineering — layperson thinking about whether
  precaution applies to releasing a new technology. And a borderline case the asker
  goes back and forth on: e.g., whether to take a new-ish weight-loss drug, or whether
  to install a smart meter, or eat lab-grown meat, or fluoride.


  The asker may offer a tentative principle: "when in doubt, don''t do the new thing"
  — and ask it be tested and repaired.


  Deliverable format: since the answer has a principle, ask for a final line "Verdict:"
  followed by the one-sentence statement of the principle? The instruction says fixed
  machine-readable form or last-line summary. Could ask: end with \answer{...} containing
  either "no single principle" or the principle in one sentence? Maybe: "End your
  reply with a final line of the form ''Principle: <one sentence>'' if you think one
  principle captures all or most of my verdicts, or ''Principle: none''." That''s
  machine-readable-ish.


  Write with no quotes from real texts. No web search needed. Keep it in the weeds
  a bit: niche-ish concrete cases (radon, sassafras? aflatoxin in natural peanut butter
  vs. synthetic preservative). Good case: I avoid artificial sweeteners but drink
  beer (alcohol is a Group 1 carcinogen) — familiar risk tolerated. Chlorinated water
  vs. unknown well water. Also case: my town debating whether to add fluoride — long-studied,
  low-dose, but "medicating the water supply" feels like intervention.


  Let me draft.


  Cases with verdicts:

  1. New synthetic pesticide approved after 3-year trials vs. old pesticide known
  to be moderately harmful but familiar — I''d tolerate the old one. (Precaution favors
  old.)

  2. Herbal supplement, no studies at all, "natural" — I take it without worry. (Anti-precaution
  verdict, hard to reconcile with 1.)

  3. Airliner of new design / new model of plane — fine, fly it. (Anti-precaution
  in a good way? Actually precaution toward novel engineered risk with high testing.)

  4. Radon in basement: naturally occurring, invisible — I tested and mitigated. (Precaution
