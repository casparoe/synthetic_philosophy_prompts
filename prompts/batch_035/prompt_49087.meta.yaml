  5. Fluoride in water: decades of study — I still voted against it. (Suspicion of
  deliberate intervention.)

  6. Familiar big risk vs unfamiliar tiny risk: I drive my kid to school though driving
  is riskier than the bus because of... hmm. Or: I keep the old gas stove rather than
  switch to induction? Actually people fear new. Maybe: I refuse a blood transfusion
  of donated blood... no.

  7. Hard case the asker goes back and forth on: lab-grown meat, or a new vaccine
