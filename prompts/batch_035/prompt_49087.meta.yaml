  line.


  Structure: verdicts, tentative principle ("when an action introduces something new
  and man-made into my body or environment, and the harm it might do isn''t yet understood,
  don''t do it until it is"), test against cases, note which verdicts clash, ask for
  repaired principle with clauses motivated, verdicts on unconsidered cases (lab-grown
