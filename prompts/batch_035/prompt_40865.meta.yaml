  My view: for cases of sustained transfer — ongoing food aid, permanent open-ended
  immigration commitments — there''s a real capacity constraint, and a community that''s
  past or near its constraint is permitted (maybe required) to limit entry/transfer
  even when people drown/starve outside the boat, because sharing the boat swamps
  it and everyone dies. But I''ve added two amendments my professor forced on me.
  First, capacity isn''t fixed: newcomers can also expand capacity (more workers,
  more ideas, whatever), so my claim is only that in the short run, before capacity
  can adjust, the constraint binds. Second, I only apply it to sustained transfer,
  not to one-off rescue — pulling a swimmer in doesn''t obligate you to feed her grandchildren.


  So: what would count against this? I want the stuff that would actually move someone
  who holds it, sorted by how damaging it is. Specifically:


