  none of them obscure: Malcom McLean put a load of truck trailers aboard a converted
  tanker sailing from Newark in 1956; within fifteen years the ISO-standard steel
  box had collapsed the cost of moving freight, and over the following two decades
  longshore employment in the traditional ports of the United States and Britain fell
  by an order of magnitude. The container wasn''t designed by anyone with a political
  program — it''s a corrugated box with standardized corner fittings — yet it ended
  the hiring-hall system, the gang structure of dock work, and the ability of dockers''
  unions to control the pace of loading, while waterfront employers on both coasts
  embraced it with visible enthusiasm. At the same time, politics kept intruding:
  the West Coast longshore union signed modernization agreements in the early 1960s
