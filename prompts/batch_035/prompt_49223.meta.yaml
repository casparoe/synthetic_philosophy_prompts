  could have a mind — a "Aunt Hillary" — that none of its ants has. I want the audience
  to run into this problem with their own bodies before I name it.


  Design the session. Requirements:


  1. A colony-level task that participants, playing ants under strict local-information
  rules (no talking, no gesturing, only token exchanges with immediate neighbors),
  must accomplish — something the group can succeed at even though no individual can
  hold the solution. I''m imagining a pheromone-token mechanic where the colony must
  choose among three feeding sites of different quality and then commit, but I''m
  open to better structures; include the site-quality and quorum mechanics, and a
  rule that ants "die" and rotate out continuously so the colony''s membership churns
