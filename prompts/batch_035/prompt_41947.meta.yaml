  Etiological = selected-function (git blame / design intent / requirements docs;
  the function of a module is what it was written/selected to do by the designer/evolution,
  explaining why it exists). Causal-role = current contribution to system capacity
  (what the function does in the running system, regardless of why it''s there).


  A software engineer''s vocabulary: interfaces, contracts, refactoring, dead code,
  vestigial code, legacy modules, code review, natural selection ~ repeated deployments/selection
  under feedback, monorepo, call graphs, emergent behavior.


  The prompt: "I''m a software engineer with no philosophy background. I''ve stumbled
  onto the philosophical debate between etiological and causal-role accounts of biological
  function..." Restate each in vocabulary: etiological as "the function of a module
  is what it was selected/designed to do, explaining why it''s there" (like documentation
  of intent, commit history, design docs), causal-role as "the function of a component
  is its contribution to a system-level capacity, determined by current wiring" (like
