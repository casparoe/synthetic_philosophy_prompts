  - Scanlon''s contractualism + aggregation problem — classic stalled debate, but
  maybe too well-known? Actually the aggregation debate (Taurek, Scanlon vs utilitarian)
  is well-trodden; a prompt could ask to diagnose the stalled debate. That''s quite
  "in the weeds" enough.

  - Multiple realizability + explain conceptual issue — the "causal exclusion"/realization
  problem, or Shapiro''s "one function, many realizations" critique. Could do a prompt
  about whether MR is an empirical claim or conceptual claim, and Shapiro''s constituency/multiplicity
  distinction — that''s in-the-weeds.

  - Moloch + procedure? A policymaker procedure for identifying races to the bottom
  in AI/AI safety? That''s nice and practical.

  - EU democratic deficit + procedure for an official assessing whether a competence
  should go to Brussels.


  I like "turn a principle into a procedure" with hinge epistemology: e.g., a security
  auditor / internal auditor who keeps facing infinite regress of doubt when reviewing
  controls — wants a procedure for when doubt is legitimate and when it''s idle, grounded
  in On Certainty. That''s neat but maybe hard for small models... hinge epistemology
  is fairly well-known though (On Certainty is famous; hinge epistemology is a recognized
  subfield).


  Alternatively, functionalism + procedure: an engineer building artificial olfaction
  or a neuroscientist designing a brain-organoid circuit asked whether it realizes
  pain — procedure grounded in multiple realizability and its critics (Shapiro''s
  challenge: psychological states constrain physical realizations more than MR suggests).
  Nice in-the-weeds.


  Or Scanlon contractualism + procedure: a hospital ethics committee / algorithmic
  triage — procedure for rejecting principles no one could reasonably reject, with
  aggregation hard cases. That''s a good one: a hospital triage committee needs a
  decision procedure from contractualism, worked on cases where aggregation bites
  (one severe harm vs many mild harms). Hard case where procedure gives answer the
  asker won''t like: rejecting a transplant case.


  I''ll go with the procedure type + Scanlon''s contractualism. Role: member of a
  hospital ethics committee drafting a policy for allocating scarce treatments (e.g.,
  ICU beds, new gene therapy). Frequency/stakes: several times a year, high stakes,
