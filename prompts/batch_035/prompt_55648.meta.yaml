  that no driver picks up and no hitchhiker pays and everyone ends up worse off. then
  i want to add stuff — here''s where i''m stuck. i''ve read about the idea that the
  "irrational" person who genuinely can''t bring themselves to stiff the driver does
  better, but i can''t figure out how to get real "can''t" into a game where everyone
