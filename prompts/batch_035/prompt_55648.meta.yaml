  signing a IOU that i actually enforce, publicly promising in front of the group,
  or doing nothing. but now i worry i''ve just taught them "commitment devices work,"
  which is econ 101, not the philosophy. the interesting part is supposed to be whether
  you were rational to pay once you''re in town, and whether being the kind of person
  who pays is rational even when you can''t change the situation.


