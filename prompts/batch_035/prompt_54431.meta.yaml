  ---


  A colleague of mine dismisses large language models with an analogy he considers
  decisive: training a model, he says, is just like zipping a very large folder. The
  model is a compressed archive of its training corpus; using it is decompression;
  and since nobody thinks a zip file understands the documents inside it, nothing
  that emerges from the model can be understanding. He grants that the compression
  is lossy and statistical rather than exact, but says that changes nothing — a lossy
  zip of the internet is still a zip.


  What he doesn''t mention, but which I''ve noticed, is that the very same equivalence
  runs in the opposite direction elsewhere: there''s a long line of work treating
  prediction and compression as the same thing (a good probabilistic model of text
  yields near-optimal codes, and vice versa), and some of the people in that tradition
  conclude from precisely this that compression is intelligence, and offer prizes
  for compressing an encyclopedia as a proxy for building a mind. So the one analogy
  seems to be used both to deflate ("it''s just a zip file") and to exalt ("it''s
  a compressor, and compression is understanding").


