  what it''s for, it''s why we call it an artificial lung, and it''s what the clinical
  protocols need to refer to — when it underperforms, the patient has an organ failing,
  and our monitoring targets are all defined in terms of the function it''s supposed
  to perform.


  (2) Josh said that in the strict sense she''s wrong: biological functions are inherited
  from a history of selection, and this device has no evolutionary history at all,
  so in the strict sense it has no function — only a use, namely the use we put it
  to. We can call that a function if we like, but it''s a courtesy extension, not
  the real thing.


  (3) Maya answered that his criterion has an absurd consequence: the very first organism
  in a lineage to develop a novel organ — say, the first proto-feather, or the first
  light-sensitive patch — would have had a functioning organ with no function until
  many generations of selection had passed. On his view, a brand-new trait can''t
  be functioning at the moment it appears; it seems crazy to say function arrives
  only retroactively.


  (4) Josh said yes, exactly — that is his view, and it''s not crazy: the function
  accrues when selection gets to work, and until then the trait is just present and
  doing things; and, he added, the device actually can have a function even on his
  account, because selection histories include intentional ones — the engineers selected
  this design over alternatives precisely for how well it oxygenated, so there''s
  a real selection history, just an artificial and brief one. The function is whatever
  the design-and-testing process favored.


