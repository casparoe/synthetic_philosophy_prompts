  design brief was for a drug-delivery scaffold and the engineers kept iterating only
  because they discovered it exchanged gas unusually well. On Josh''s account, the
  function would be fixed by whatever the design process favored — but if you asked
  any clinician what the implanted organ is for, "drug delivery" would be flat wrong,
  and "oxygenating blood" obviously right. A theory that vindicates the wrong answer
  in the clinic isn''t a refinement, it''s a mistake.


  (6) Josh replied that she''s trading on an equivocation: "what it''s for in the
  clinic" picks out the role it plays in the body, and of course that matters for
  treatment, but role isn''t function; function-talk earns its keep in explanations
  — why the organ has its structure, why it was built, what future revisions will
  be selected for — and for that, the history is everything, while its current effects
  explain nothing about why the device exists at all. The clinical question and the
  explanatory question come apart, and his account answers the second one; hers can''t
  even address it.


