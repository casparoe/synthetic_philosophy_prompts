  whether your gas gauge works. You look at the gauge when the tank is full, note
  that it reads full, and do this enough times to conclude the gauge is reliable.
  Philosophers say this is circular: the conclusion (the gauge is reliable) is contained
  in the premises (it read full when the tank was full), so the argument is circular
  and gives you no new justification at all. It follows from this that inductive reasoning
  can never justify itself, which is why Hume''s problem of induction has no solution;
  and Moore''s famous proof of the external world -- here is one hand -- is the same
  trick in a slightly different form, which is why almost no epistemologist accepts
  it."


  Subtle errors to embed:

  1. "The conclusion is contained in the premises, so the argument is circular" —
  conflating epistemic circularity with logical circularity; premises don''t contain
  the conclusion (that would be blatant circularity), the charge is that you must
  be antecedently justified in trusting the gauge/perception to accept the premises.
  Also "gives you no new justification at all" — overstates: the issue is transmission
  vs acquisition of warrant; some (Wright, Davies) allow justification but not transmission;
  the bootstrapper gains a conclusion they weren''t antecedently entitled to. Actually
  for the gas gauge case (Cohen''s), the issue is that the premise "the tank is full"
  relies on perception that the gauge reads full... Cohen''s case: using the gauge
  to determine tank full, then track record. The epistemic circularity: premise "tank
  is full" known via gauge? No — Cohen: you see the gauge reads E, infer tank empty,
  then record instances (gauge reads E, tank empty) to infer gauge reliable. The circularity:
  each premise pair relies on trusting the gauge. So a subtle misrepresentation: saying
  the conclusion is contained in premises (logical circularity) rather than that accepting
  the premises requires trusting the very faculty whose reliability is in question
  (epistemic circularity). Good.

  2. "It follows that inductive reasoning can never justify itself, which is why Hume''s
  problem has no solution" — overreach; bootstrapping arguments target specific track-record
  arguments, not induction wholesale, and don''t settle Hume.

  3. "Moore''s proof is the same trick" — partially defensible but "which is why almost
  no epistemologist accepts it" — overstatement; many take Moore''s proof to be valid
  with justified premises; the issue is transmission. Also conflating: Moore''s proof
