  by any of the revisionist stuff about it. Two: I''m about ninety percent confident
  the world is deterministic at the fundamental level. Bohmian mechanics always seemed
  fine to me, and my take is that the randomness in textbook quantum mechanics is
  like a pseudo-random number generator — the process is deterministic, and the apparent
  chance is really just our ignorance. Three: despite that, I think chances are literally
  true even in a deterministic world. I like the best-system idea where the chance
  of the coin landing heads just is whatever probability shows up in the best simple
  systematization of the whole history of the world, so the coin really does have
  a fifty percent chance and it''s not a metaphor or a statement about anyone''s ignorance.
  Four: I think the admissibility condition is pretty easy to satisfy and I don''t
  get why Lewis made such a fuss about it — information about the past is always admissible,
  information about the laws is always admissible, and really the only inadmissible
  stuff is information about the outcome itself. Five: here''s a case we argued about
  in section. Suppose a supercomputer with perfect sensors hands me the complete microstate
  of the lab right now plus the true laws, and the laws are deterministic (so in principle
  the trajectory of the coin is fixed). I said in section that my credence in heads
  should still be one half, because the chance is one half, and knowing the microstate
  shouldn''t change that. Six: I also said, and still think, that observed frequencies
  can legitimately pull your credence away from a reported chance — if the casino
  swears their die is fair but it''s rolled six about twenty percent of the time over
  thousands of rolls, I think you''re rational to give six a credence around point
  two rather than a sixth. Seven: I don''t think my credence in determinism should
  make any difference to my credence about the coin. Whether I''m ninety percent or
  five percent on determinism, my credence in heads on a fair coin should come out
  the same.


