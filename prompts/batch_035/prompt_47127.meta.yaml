  ---


  I teach an intermediate philosophy of language seminar, and next week is on radical
  interpretation. Students know the textbook version: the interpreter observes speakers''
  assent and circumstances, and must fix meanings so that the speakers come out mostly
  right and mostly rational, with charity doing the heavy lifting. What I want for
  class is a case that puts the two halves of that package under strain against each
  other, because the seminar discussions so far have treated "interpret them as mostly
  true" and "interpret them as rational" as if they always pull the same direction.


  Construct a thought experiment meeting these specifications:


  1. The setting is an ordinary, empirical, culturally comprehensible one — a village,
  a workshop, a marketplace. No aliens with inverted physics, no ideal interpreters
  with unlimited data.

  2. The community''s linguistic data must be such that the interpreter faces a genuine
  forced choice: any assignment of meanings that makes the speakers'' beliefs come
  out mostly true makes their preferences come out badly irrational (not merely unusual
  or unfamiliar — risk-seeking, asceticism, and ancestor worship don''t count as irrational),
  and any assignment that makes their preferences come out rational requires attributing
  widespread, systematically false beliefs about the same matters. That is, truth-charity
  and rationality-charity must trade off against each other sentence by sentence,
  and the tradeoff must be generated by structural facts about the community''s situation
  and practice, not stipulated ("they are irrational" or "their world deceives them
  by fiat" is cheating).

  3. The conflict must be engineered so that it''s not obviously resolvable by the
  standard escape routes: not by reinterpreting the offending utterances as expressive
  rather than belief-ascribing (rain-dance style), not by splitting the community
  into subgroups, and not by the interpreter''s own evidence being defective.

  4. After the scenario, demonstrate that it meets each specification: show the two
  assignments, walk through what each optimizes on, and where the tradeoff bites.


  Then three analyses: (a) say which structural feature of the case is doing the work,
  and what happens to the case if you remove it (does it collapse back into the ordinary
  situation where charity is a package deal?); (b) how a committed Davidsonian would
  resist the case — I specifically want to know whether they can deny that truth-charity
  and rationality-charity are separable constraints that can be traded off, or whether
  they must instead argue the case is somehow uninterpretable in principle; and (c)
  whether a Lewisian interpreter, who fixes belief and desire simultaneously against
  decision theory, does any better, or just faces the same fork with more machinery.


  Purpose, so you know what cheating is: I want the case to be usable as a seminar
  discussion of whether charity is one constraint or several. So the case must not
  smuggle in a verdict on that question; both readings of the case must be live.


  Length: scenario one paragraph (a rich one), analyses as brief as you can keep them.


