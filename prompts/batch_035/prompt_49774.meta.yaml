  Longtime lurker here, mostly on the rat-sphere adjacent forums and open threads.
  During one of those periodic "everything online is getting worse" discussions someone
  linked me to Kierkegaard''s The Present Age (the second half of his review of Two
  Ages, 1846), and it kind of blew my mind how directly he talks about the press and
  "the public" — an abstract phantom that passes judgement without any single person
  taking responsibility, while actual individuals get "leveled" down into spectators.
  Anyway it''s been rattling around my head for weeks and I keep wanting to apply
  it to stuff he never saw, so here''s my question.


  Kierkegaard died in 1855, so he saw cheap printing and anonymous feuilleton debates
  but obviously nothing like the internet. Suppose he could spend a month with, say,
  three platforms: (a) a pseudonymous forum with public karma/upvote counts where
  every opinion gets an instantaneous crowd score attached to your identity, (b) a
  fully anonymous imageboard where there''s no karma, no usernames, no persistent
  identity at all, and (c) a prediction market where you put actual money on your
  forecasts and the crowd estimate is a price. Which of these would he say is the
  truest embodiment of the public, and why? My own guess is he''d hate (a) most, since
  it seems to fuse the leveling of the press with personal vanity (you can now *keep
  score* of how well you performed for the phantom), while (b) is trickier — anonymity
  dissolves the vanity and comparison he worried about, but it also dissolves the
  single individual even harder, so it might be the purest public of all. And I genuinely
  can''t predict his reaction to (c): on one hand it''s just the crowd voting again,
  on the other it forces each member to suffer actual (financial) consequences for
  their opinion, which feels closer to the passionate inwardness he kept demanding.
  Maybe he''d say markets are just the press with a cash register bolted on?


  Please reason from his actual concepts (the public, leveling, the press, reflection
  vs passion, the single individual) rather than just vibes, and also flag where you''re
  extrapolating vs. where he actually wrote about the printing press so I can tell
  which parts are load-bearing. Oh and please write your answer in British English
  — not American.


