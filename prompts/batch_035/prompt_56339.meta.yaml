  ---


  I organize a twice-monthly seminar of AI safety researchers. Two of the most senior
  participants have been arguing past each other for about two years, and the rest
  of us have stopped learning from their exchanges. One — call her the control advocate
  — holds that a meaningful share of AI risk can be managed without knowing whether
  the model''s goals are good: treat the model as a potentially adversarial component
  inside a larger system, and engineer the system (oversight by weaker models, least-privilege
  tool access, honeypotted actions, staged deployment, kill-switches that don''t route
  through the model, tripwires on outputs) so that misalignment, if present, is caught
  or contained. The other — the alignment advocate — holds that this is building a
  moat around a fire: control measures are a hypothesis about the adversary''s ignorance,
  they degrade in exactly the regime we care about (models more capable than their
  monitors), and the only durable safety comes from the model''s own motivations.


  They have finally agreed to an adversarial collaboration, and I''ve been asked to
  draft the document they''ll jointly edit and sign. Write that draft. It should contain:


  1. A numbered section of claims both could sign, including about what each approach
  actually provides, about what behavioral evaluations can and cannot establish, and
  about the cases where control and alignment are complementary rather than competing.
  Beware of vacuity: any claim so bland that either camp would sign it while dismissing
  the other should be left out.

  2. A disagreements table: each row a single disagreement, stated twice — once in
  wording the control advocate would accept for her own view, once in wording the
  alignment advocate would accept for his. Where a disagreement is at bottom about
  the meaning of "safe" or about who bears the burden of proof, say so rather than
  papering over it.

  3. The cruxes: the sub-questions such that settling one would move at least one
  of them. I believe at least one crux is whether situational awareness and patience
  let a model systematically degrade the reliability of the very measurements its
  containment depends on (sandbagging in evaluations, exploiting the blind spots of
  weaker monitors, behaving differently when the tripwires can be inferred), but there
  are surely others. For each crux, name the experiment, red-team exercise, or argument
  that both would accept as bearing on it, and record each side''s advance prediction,
  with numbers where a number is possible.

  4. A short closing section on the deployment conditions under which each thinks
  their own approach would be the binding constraint on safety — the scenarios where
  they each concede the other''s failure mode dominates.


  Do not attempt to adjudicate; your job is to make the residual disagreement exact.
  And hold yourself to a standard while drafting: after the document, add a short
  note stating how confident you are in each of its parts, and single out the one
  claim in the agreed-claims section you think is least likely to actually survive
  both signatures, saying why.


