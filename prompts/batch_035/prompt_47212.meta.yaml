  literal falsehood is fine; the other half wants ''deception'' to include true-but-misleading
  implicatures."


  Memo should recommend a concrete definition, a disposition for each of the three
  behaviors, and treat the strongest consideration on the losing side seriously —
  e.g., that expectation-based definitions would forbid ordinary politeness, comforting
