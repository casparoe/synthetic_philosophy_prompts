  implicit essentialism there (the law names a species like it names a thing)? How
  consistent is it — the same statutes that protect species also protect ''subspecies''
  and ''distinct population segments,'' which seems to quietly concede that the species
  rank isn''t doing the moral work. And if you swapped in a properly phylogenetic
  picture — species as branches/lineages, no ranks at all — what would have to change
  in the law? Would we protect clades? Lineages? How big?


  Bonus puzzle I''d like your take on: seems like a pluralist could say the law just
  needs *some* grouping, and any of the main concepts would license roughly the same
  list of protected things... except they don''t, the lists differ at the edges and
  the edges are exactly where the lawsuits happen.


  Anyway: take the role seriously, reconstruct the implicit theory (or theories),
