  I''m a retired entomologist... 35 years describing beetles... now reading philosophy.
  The thing that got me was the species problem: we never agreed on what a species
  is, and the criteria we use in practice (morphology, interbreeding, monophyly, ecological
  niche) come apart constantly, and two competent taxonomists can split or lump the
  same populations depending on which concept they buy.


  Meanwhile the whole legal apparatus of conservation — endangered species acts, CITES
