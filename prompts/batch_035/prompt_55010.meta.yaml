  knowledge, you should match your future self. Van Fraassen defended this as part
  of a broadly pragmatist picture on which rationality is a matter of integrity over
  time rather than just coherence at a time. I find the principle compelling in ordinary
  cases: if I know that tonight, after reading the election returns, I''ll be 90%
  confident the incumbent lost, it seems irrational for me to be 40% confident now.


