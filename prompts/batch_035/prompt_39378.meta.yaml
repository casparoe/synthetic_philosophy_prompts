reasoning_summary: 'Domain: Intergenerational justice and climate change. Type: verdicts-to-principle.
  Persona: longtime rationalist blog reader, formal/polished, British English.


  Ask: give verdicts on several cases about obligations to future people, with a hard-to-reconcile
  pair, ask for the principle.


  Cases to include (climate/intergenerational): discount rate intuitions, non-identity,
  small future populations, etc.


  Draft verdicts:

  - Spending £1bn now to prevent a catastrophe in 200 years that would kill billions:
  seems required, not supererogatory.

  - Same harm to people who wouldn''t exist unless we emit (non-identity): still wrong.

  - We owe more to the near future than the far future: willing to discount somewhat,
  but not exponentially at market rates.

  - Future people can''t complain about being born worse-off than not existing (non-identity
  problem): wrong to create them with bad lives? Hard pair.

  - Present poor vs future rich: if future people will be much richer than us, our
  obligation to them lessens? Asker feels climate action still required even if future
  people will be richer — tension with willingness to discount.

  - Refuse to undertake a policy with small present cost and large future benefit
  because future people might not exist (extinction risk): verdict that if humanity
  will be extinct by then, no obligation — versus verdict that we should still preserve
  artifacts/plan for 10,000 years hence.


  Hard-to-reconcile pair: e.g., "I''m comfortable discounting harms to the year 2200
  at, say, 2% a year, so a life in 2200 counts for maybe a tenth of a life today —
  yet I also think a policy that kills a billion people in 2200 for a present convenience
  is just as wrong as one that kills a billion people today for a convenience." That''s
  the classic Parfit-style clash.


  Also maybe: verdict that future people''s interests count equally regardless of
  when they live ("no temporal discounting"), yet verdict that we may weigh the present
  poor''s interests over the future rich''s — horizontal vs vertical.


  Structure: intro (rationalist reader, read Parfit''s Reasons and Persons discussions,
  etc.), then verdicts list, then ask for principle, predictions on new case, honest
  statement of which verdicts must go.


  Keep it 2-3 paragraphs, formal, British English. Maybe first person: "I''ve been
  a longtime reader of LessWrong and the Effective Altruism Forum..." — as rationalist
  blog reader. Don''t need quotes from real texts; avoid quotation marks around phrases
  from real texts. I can mention Parfit''s Reasons and Persons by title — that''s
  a safe, well-known attribution. Non-identity problem is well known.


  Write it now.'
