  "I''m grading a take-home midterm for a course on Buddhist philosophy. The question
  was: ''Nāgārjuna argues that all phenomena are empty of intrinsic nature. Explain
  what this claim amounts to, why dependent origination is his central argument for
  it, and what the tetralemma in the opening examination of the Mūlamadhyamakakārikā
  is supposed to accomplish. Then explain the two truths and why they are needed to
  block the charge that Madhyamaka is nihilism.''


  The student''s answer, transcribed:


  ''Nāgārjuna''s claim that all dharmas are empty is the claim that nothing possesses
  intrinsic nature (svabhāva) — no dharma exists from its own side, independently
  of conditions, designations, or other dharmas. His argument is essentially that
  anything with svabhāva would have to exist in a fixed, unchanging way, since to
  have an intrinsic essence would be to be what one is independent of everything else;
  but everything we encounter arises dependently, in dependence on causes and conditions,
  and what arises dependently cannot have intrinsic nature. This is why he says that
  dependent origination and emptiness amount to the same thing.


  The tetralemma (catuṣkoṭi) at the start of the Mūlamadhyamakakārikā considers four
  possibilities for how any dharma could arise: from itself, from another, from both,
  or from neither — i.e. causelessly. He rejects the first horn because if a thing
  arose from itself it would already exist and arising would be pointless, and he
  rejects the second because if cause and effect were intrinsically other, nothing
  could connect them and anything could arise from anything. The remaining horns fail
  for similar reasons. So all four alternatives fail, and this means Nāgārjuna''s
  own position is the fourth one: since nothing has intrinsic nature, nothing really
  arises at all — arising is merely apparent. Everything happens without causes in
  the ultimate sense, and causation is just how we organize experience conventionally.
  In reality, phenomena are indeterminate: neither existent nor nonexistent nor both
  nor neither.


  This is where the two truths come in. Ultimate truth is that all dharmas are empty;
  conventional truth is the world as it appears to the unenlightened. Conventional
  truth is strictly false but pedagogically necessary, since ordinary people cannot
  handle the ultimate truth, and the Buddha taught in conventional terms first as
  a ladder to be kicked away. The charge of nihilism is thus mistaken, because Madhyamaka
  does have a positive ultimate truth — the emptiness of all dharmas — and this is
  the final nature of reality, the way things really are beneath appearances.''


