  "My roommate (economics/stats background) gave me this argument over dinner..."
  Steps:


  (1) Condorcet''s theorem: if each of n voters is independently better than chance
  at judging which of two options is correct, the probability that a majority picks
  the correct option approaches 1 as n grows.

  (2) Real electorates are enormous.

  (3) It''s plausible that the average voter is at least slightly better than chance
  — even 51% — because almost nobody is systematically worse than a coin flip.

  (4) So on any binary question with a fact of the matter, a national referendum majority
  is essentially guaranteed to be right.

  (5) Many policy questions are binary with a fact of the matter (leave/remain, inflation
