  judging between two alternatives is independently more likely than not to be correct,
  the probability that the majority picks the right answer approaches certainty as
  the group grows. (2) In a national electorate of a hundred million voters, even
  a very weak individual edge — say each voter being right 51% of the time — compounds
  to a majority that is right with probability indistinguishable from one. (3) Almost
  no one is systematically worse than a coin flip on any question they bother to vote
  on, so the competence assumption is met for practically any binary ballot proposition
  with a fact of the matter. (4) Therefore any national referendum majority — on climate
  policy, on a central bank''s inflation target, on whether a statistical claim in
  a ballot pamphlet is accurate — is right as a matter of near-mathematical necessity.
  (5) And therefore the common complaint that voters are too ignorant to be trusted
  with referendums is not a moral or political judgment but a straightforward arithmetic
  mistake. My friend concluded that whenever elites disagree with a referendum outcome,
  the referendum is right and the elites are wrong, and that we should extend referendums
  to more questions rather than fewer. I have a feeling that something slipped between
  (3) and (4) — something about how likely voters'' errors are to be independent —
  but I can''t name it, and I notice I also don''t know whether the real problem is
