reasoning_summary: 'Let me pick a domain and type. Good combos:


  - Rigid designators + "proves too much" argument: e.g., an argument that because
  "Hesperus is Phosphorus" is necessary and known a posteriori, all true identity
  statements are necessary, so contingently true identity statements like "the morning
  star is the evening star" ... or an argument sliding from "water is H2O is necessary"
  to "everything is what it is necessarily" (essentialism). A classic "proves too
  much": Kripke''s argument that if the mind were identical to a brain state, the
  identity would be necessary, so psychophysical identities imply that zombies are
  inconceivable... Or an argument that necessary a posteriori leads to epistemic indistinguishability
  collapse.


  - Grice + fairness-of-summary: a textbook summary of implicature conflating implicature
  with entailment, speaker meaning with sentence meaning, claiming Grice thought all
  meaning is intention (Strawson/Searle refinements), etc. This fits "is it fair"
  type very well.


  - Condorcet jury theorem + proves-too-much: an argument that majority rule is always
  right given competence > 0.5, ignoring independence, or slide to large electorates
  with tiny competence above .5. That''s nice: (1) if each voter is >.5 likely correct,
  majority probability → 1 as n → ∞; (2) each voter in a large electorate is barely
  above .5 (say .51); (3) so a million voters each .51 yields virtual certainty; (4)
  actual electorates are large; (5) so majority is virtually certainly right. Subtle
  flaw: independence violation (common biases, correlated information). That''s a
  great "proves too much" — it would prove demosophistic masses always right even
  on climate etc.


  - Meta-problem of consciousness + either type.


  - Animal ethics + argument.


  I like the Condorcet jury theorem + "proves too much" type. The subtle flaw: independence
  assumption; also competence homogeneity; also the slide from "each voter is barely
  above .5" to "the jury theorem applies" — actually with p=.51 and independence,
  the math does work out; the flaw is that the independence assumption fails in real
  electorates, and the argument implicitly assumes it. Also the slide between "correct"
  (there being a fact of the matter, like a math problem) and political preferences.
  Make the argument numbered.


