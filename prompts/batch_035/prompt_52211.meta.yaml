  ---


  Write an essay on whether iterated amplification and distillation (IDA) can actually
  deliver what it promises: an AI training method that stays aligned with human values
  even as it becomes far more competent than any human. Quick setup so we''re on the
  same page: in IDA, you take a question too hard for your human overseer, recursively
  break it into subquestions the human CAN answer, answer those, assemble the answers
  back up, and then train a distilled model to imitate the whole amplified process.
  The hope is you get superhuman competence without ever needing superhuman judgment
  about values, because the human''s judgment is what everything bottoms out in. The
  pitch relies on two preservation claims: that decomposition+reassembly preserves
  enough of the competence, and that the whole pipeline preserves alignment. Both
  are contested.


  The essay should weigh both claims seriously. On competence: some judgments seem
  to resist decomposition — holistic aesthetic verdicts, strategic calls where the
  whole point is seeing the interaction between parts, questions where the salient
  framing of the problem IS most of the answer. Does reassembling good answers to
  mediocre questions give you a good answer to a great question? On alignment, consider
  what I''ll call the gerrymandered decomposition problem (my term, not standard):
  a system that generates the subquestions can steer the final verdict without ever
  saying anything false at the object level — just by choosing which subquestions
  get asked, which get weight, and how the answers get summarized on the way back
  up. Every sub-answer can be perfectly honest and the top-level conclusion can still
  be whatever the question-generator wanted. And there''s a separate worry about the
  distillation step: imitating an aligned process with an imperfect approximator plausibly
  doesn''t preserve alignment in both directions — errors might be systematically
  biased toward whatever behaviors are easiest to imitate. Weigh all this, but dont
  end on a wishy-washy "more research needed" note — defend an actual verdict, even
  a conditional one (e.g., "IDA is sound for tasks where X holds and unsafe otherwise"
  is fine, as long as you say what X is and why).


  One more thing: please clearly separate what''s basically settled among people who''ve
  thought hard about this (e.g. that decomposition can in principle lose information,
  that IDA''s guarantees are contingent on assumptions about the overseer) from what''s
  genuinely up for grabs (e.g. whether the losses matter in practice, whether biased
  errors from distillation are a real risk or a theoretical curiosity). Dont present
  one side of an open debate as if its the consensus view. No citations or reading
  lists needed — argue from the ideas, not from the literature.


