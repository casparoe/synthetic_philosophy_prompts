  \nI think the exam question type fits Parfit's hitchhiker well. Let me draft.\n\n\
  Prompt (casual, 1-3 paragraphs, typos allowed, elaborate framing, format request:\
  \ lead with bottom line... but for an exam question type, the deliverable is a question\
