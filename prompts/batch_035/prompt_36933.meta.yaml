  \ Wei Dai's updateless decision theory — 2009 LessWrong post. The prompt leans on\
  \ Parfit's hitchhiker name only; I'll avoid citing precise chapters. I could say\
  \ \"Parfit's hitchhiker (you know the setup)\" — the prompt can describe the setup\
  \ itself so it doesn't depend on memorized specifics. Good: describe the case in\
  \ the prompt so a small LLM doesn't need to recall it.\n\nShould I verify anything?\
  \ The works' titles: Reasons and Persons (1984), Morals by Agreement (1986) — I'm\
