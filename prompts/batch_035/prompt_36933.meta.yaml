  ? \"prediciton\"? keep to 1-2 subtle typos).\n\nLet me also make sure attribution\
  \ details don't need verification: Parfit's hitchhiker — from Reasons and Persons\
  \ (1984), Part I? Actually it appears in \"Reasons and Persons\" (1984). Gauthier's\
