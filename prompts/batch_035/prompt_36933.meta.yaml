  \n\nDraft the prompt:\n\n---\n\nI'm writing the take-home final for a third-year\
  \ decision theory seminar, and I want exactly one question on Parfit's hitchhiker.\
  \ Quick setup so we're on the same page: you're stranded in the desert, a passing\
  \ driver predicts (very reliably) whether you'll pay her when you get to the city,\
  \ and she only stops for predicted payers. CDT says once you're safely in the city,\
  \ not paying dominates. Everyone in my class knows this — they can recite 'dominance\
  \ at the node' in their sleep, and half of them can name-drop resolute choice or\
  \ constrained maximization without being able to say what it actually commits you\
  \ to. So I need a question that can't be answered by reciting the labels.\n\nHere's\
  \ the twist I want built in — I made this variant up, so they'll have to reason\
  \ it through rather than pattern-match. Call it the escrow hitchhiker: same desert,\
  \ same predictor-driver, but she offers you a modified deal. At the moment she picks\
  \ you up, you pay $1000 into a third-party escrow. Once in the city, you have one\
  \ hour to hand her another $1000; if you do, the escrow refunds your first $1000\
  \ in full, and if you don't, she keeps it. The predictor doesn't care which deal\
  \ you take — she'd have stopped for you either way. (a) Is accepting the escrow\
  \ deal ex ante rational by the lights of standard CDT? (b) Once in the city, is\
  \ handing over the second $1000 rational by those same lights? (c) If your answers\
  \ to (a) and (b) come apart, explain what this reveals about CDT as a theory of\
  \ planning — is the CDT agent forced to decline a deal it can foresee would leave\
  \ it better off, and if so, is that a reductio or just an honest accounting of the\
  \ costs of not being able to bind yourself? (d) Say whether resolute choice, constrained\
  \ maximization, or updatelessness handles the escrow case better, and what each\
  \ has to give up to do it.\n\nGive me: the question as it would appear on the exam\
  \ (rewritten in your own words, ~90 minutes of work, out of 20 marks, including\
  \ any instructions to the student), a model answer of about 600 words, and a marking\
  \ scheme with five must-hit points and marks for each, plus a one-line note on the\
  \ way students typically botch each point. The question shouldn't require them to\
  \ have memorized anything beyond the case as stated on the exam. Start your reply\
  \ with the exam question itself, no preamble, no commentary about the question before\
  \ it — the paper text, then the model answer, then the scheme.\n\n---\n\nThat's\
  \ good. Check: casual, typos? Add one or two: \"dominates\" fine... \"I made this\
  \ variant up\" — good. Add typo: \"pattern-match\" fine; maybe \"recieve\" somewhere.\
  \ I'll add \"she only stops for predicted payers\" — fine. Insert typo: \"so we're\
  \ on the same page\" — could write \"the the\". One typo: \"than being able\" →\
  \ keep. Maybe \"name-drop\" fine. I'll put one typo: \"in their sleep\" fine. Add:\
  \ \"half the class\" — write \"half of them can name-drop... without being able\
  \ to say what it actually commits you too.\" — \"too\" instead of \"to\". One typo\
  \ suffices; instructions say \"may contain a typo or two.\"\n\nAlso format request:\
  \ lead with the piece itself — done.\n\nOne check: is the escrow variant coherent?\
  \ At pickup: pay $1000 escrow. In city: pay $1000 → get $1000 refund (net -$1000);\
  \ don't pay → lose escrow $1000 (net -$1000). Wait — that makes it indifferent at\
  \ the city node! That breaks the dominance structure. Oops. If not paying costs\
  \ you the escrow, then paying and not paying both cost $1000 total — no dominance.\
  \ Hmm, need the refund logic to preserve dominance at the city node.\n\nFix: escrow:\
  \ pay $1000 at pickup; in city, pay an additional $1000 within an hour and get your\
  \ $1000 escrow refunded... that's net $1000 paid if you pay, $1000 lost if you don't.\
  \ Indifferent. Bad.\n\nThe point of the variant is: ex ante the CDT agent should\
  \ NOT accept (because it foresees at the city node that paying is dominated... wait,\
  \ is it?). Let's redesign. The classic structure: CDT agent at city node: paying\
  \ costs $1000, not paying costs $0 (driver already dropped them). Ex ante (in desert,\
  \ no deal yet, dying): the deal \"ride in exchange for $1000 on arrival\" is worth\
  \ taking ex ante, but CDT agent foresees it won't pay on arrival, so the predictor...\
  \ wait, the predictor only stops for predicted payers, so the CDT agent isn't picked\
  \ up. That's the standard tragedy: CDT agents die in the desert because they can't\
  \ form the intention to pay, and they know it.\n\nSo what does an escrow add? The\
  \ escrow is the precommitment device: ex ante, the CDT agent can rationally sign\
  \ a binding contract that forces payment later. So: driver offers two deals — (A)\
  \ plain promise to pay $1000 in the city (predictor only stops for predicted payers);\
  \ (B) binding escrow: $1000 deposited now, forfeited if you fail to hand over $1000\
  \ in the city... but as computed, that's indifferent. Alternative (B): deposit $1000\
  \ now; if you pay $1000 in the city you get the deposit back — no wait.\n\nThink\
  \ about what a real precommitment looks like: you give the driver $2000 now; she\
  \ returns $1000 of it when you pay her $1000 in the city. Net if you pay: -$1000\
  \ (you gave 2000, got 1000 back, paid 1000). Net if you don't pay: -$2000 (she keeps\
  \ it all)... hmm, that means in the city, paying vs not: paying gets you $1000 back\
  \ that you otherwise lose — that's not dominance-for-don't-pay, it's a penalty.\
  \ That's a proper commitment device: at the city node, paying $1000 and receiving\
  \ $1000 refund = net 0 change; not paying = lose nothing now but forfeit... no wait,\
  \ the $2000 is already sunk. At the city node: pay → get $1000 back (you're up $1000\
  \ relative to not paying? No: you hand $1000 and receive $1000 — net 0). Not pay\
  \ → you keep your $1000 but the deposit is gone either way. So at the city node:\
  \ paying = hand $1000, receive $1000 refund = net 0; not paying = keep $1000 = net\
  \ +... \n\nLet me recompute with account balances. Deposit stage: -$2000. City node,\
  \ pay: -$1000 (payment) +$1000 (refund) = net 0. City node, don't pay: net 0. Indifferent\
  \ again! Ugh.\n\nThe issue: any escrow that makes payment at the city node rational\
  \ removes the dominance, and any that leaves dominance means the deposit doesn't\
  \ bind. Actually that's exactly the interesting point! A genuinely binding contract\
  \ that makes non-payment costly changes the city-node decision so that paying is\
  \ (trivially) rational — the CDT agent pays, but pays because the contract changed\
  \ the payoffs, not because CDT changed its verdict about promise-keeping. So the\
  \ exam crux could be: (i) does CDT recommend entering such contracts? (Yes, ex ante\
  \ — the contract is a costly but worthwhile purchase of the ability to be trusted.)\
  \ (ii) In the city, the CDT agent pays — but does the driver/predictor count this\
  \ as \"the CDT agent paying\"? The interesting philosophical question: if all rationality's\
  \ problems can be solved by external precommitment devices, is the hitchhiker case\
  \ really a problem for CDT, or does it just show rational agents should buy commitment\
  \ technology when it's cheap? And the follow-up: in the desert there is no notary\
  \ — the case is precisely one where the commitment technology is unavailable, so\
  \ the CDT agent dies. Gauthier/McClennen think the agent should be able to do internally\
  \ what the contract does externally; the question is whether that's coherent or\
  \ self-deception.\n\nSo maybe simpler variant, cleaner: keep the standard case,\
  \ and add the twist differently. Options:\n\nTwist 1: Reliability + observable track\
  \ record. The driver is only 80% accurate. Does anything change for CDT at the city\
  \ node? (No — dominance is dominance regardless of prediction accuracy; accuracy\
  \ only matters ex ante.) Many students confuse this — they think less-than-perfect\
  \ prediction weakens the case for paying. Good discriminator.\n\nTwist 2: The \"\
  tollbooth\": the driver offers to stop for you if, before she stops, you voluntarily\
  \ toss your wallet containing $1000 into a locked box she'll open only if you pay\
  \ $1000 from... too convoluted.\n\nTwist 3 (nice): The posthumous variant — the\
  \ driver will stop for you iff she predicts you'd pay, but she also tells you that\
  \ after dropping you off she immediately drives off and you'll never see her again;\
  \ payment is by leaving $1000 in a drop-box she checks later. Same structure, no\
  \ difference. Meh.\n\nTwist 4: Symmetric twist — you're also a predictor? Too much.\n\
  \nTwist 5: The iterated version: you hitchhike the same desert every month and it's\
  \ common knowledge. Then cooperation is sustainable via repeated interaction, and\
  \ the case loses its bite — question: does the hitchhiker case generalize, or is\
  \ it an artifact of one-shot settings? Combined with: in one-shot settings with\
  \ no commitment technology, what exactly does the CDT agent lose, and is dying-in-the-desert\
  \ a \"cost of rationality\" or evidence of irrationality? This is the \"why Ain't\
  \ you rich\" style dialectic.\n\nI think the best exam crux combines: (a) stage-relativity\
  \ of CDT's verdicts (desert vs. city), (b) the contract/commitment-device response\
  \ and why it doesn't fully answer (the case is defined by commitment being unavailable),\
  \ (c) whether resolute choice/constrained maximization is coherent (the \"can you\
  \ really choose now what you'll rationally choose later?\" objection — does it collapse\
  \ into either CDT or irrationality at the later node), (d) a novel case to reason\
  \ through fresh.\n\nFor the novel case, keep it simple and testable: the 90%-reliable\
  \ predictor with a visible track record, PLUS the driver offers a side deal: for\
  \ $50 she'll tell you her prediction about you before deciding whether to stop...\
  \ hmm. Or: \"the amnesia pill\": at the city gates, before payment is due, you can\
  \ take a pill that erases your memory of the deal; the driver predicted whether\
  \ you'd take the pill... getting complicated.\n\nSimplest good novel case: two drivers.\
  \ Driver A is a perfect predictor who only stops for predicted payers. Driver B\
  \ is a soft-hearted driver who stops for everyone but asks for $1000. You can only\
  \ flag one. A CDT agent, knowing it won't pay A... wait, then A won't stop for it,\
  \ so it should flag B and happily pay B? No — once B stops, CDT says don't pay B\
  \ either (B already stopped). But then next time B won't stop? It's one-shot with\
  \ B too... This becomes a mess about which promises are self-fulfilling.\n\nCleaner\
  \ novel case: the insurance variant — before entering the desert, you can buy (for\
  \ $10) a \"hitchhiker's bond\" from a company: if you end up stranded and a predictor-driver\
  \ picks you up, the bond automatically pays her $1000 on your behalf, and the bond\
  \ only sells to... The predictor knows about the bond. Question: should the CDT\
  \ agent buy the bond? Yes, clearly — cheap, and it makes the driver stop. Then:\
  \ the bond is a commitment device that works; so why exactly do we think the hitchhiker\
  \ case embarrasses CDT? Because in the paradigm case there's no bond. The student\
  \ must articulate what the availability of commitment devices does and doesn't show\
  \ about the theory. And the deep question: updatelessness says you shouldn't need\
  \ the bond — you should, at the planning stage, adopt a policy of paying, and stick\
  \ to it even when local dominance says otherwise; is that coherent?\n\nHonestly,\
  \ maybe I don't need a super clever novel variant; the prompt asks the model to\
  \ write the exam question, and I can supply the twist material as seeding. The escrow\
  \ idea, fixed properly: the driver offers, at pickup, to accept a $1000 deposit\
  \ that she'll keep unless you pay her $1000 in the city (upon which she returns\
  \ the deposit). At the city node: pay → -$1000 +$1000 refund = 0; don't pay → forfeit\
  \ deposit, already sunk = 0. Indifferent — so a CDT agent might pay or not; hmm,\
  \ indifference means CDT can pay without violating dominance. Interesting but muddy\
  \ for an exam.\n\nAlternative fix: deposit $1500, refundable on paying $1000 in\
  \ the city. City node: pay → -$1000 + $1500 = +$500 relative; don't pay → 0 (deposit\
  \ sunk). So CDT pays. Total cost of the ride: $1000 net (paid 1500 deposit + 1000\
  \ payment - 1500 refund... let me compute: deposit -1500, payment -1000, refund\
  \ +1500 → net -1000. Good, ride costs $1000, same as promised payment). So the driver\
  \ gets her $1000, the CDT agent gets the ride, everyone's happy — the deposit is\
  \ pure commitment machinery costing nothing (assuming no fees). Now the exam question:\
  \ (a) Explain why the CDT agent accepts the deposit deal and then pays, and why\
  \ the very same agent, offered the plain promise deal, dies in the desert. (b) Does\
  \ this show CDT is fine (rational agents just need commitment tech), or does it\
  \ show something's wrong (the agent must spend resources — here zero, but in general\
  \ positive — to achieve what a resolute agent gets for free; and when commitment\
  \ tech is unavailable, CDT prescribes death)? (c) Evaluate resolute choice / constrained\
  \ maximization / updatelessness as responses: does \"choosing now what you will\
  \ do later\" make sense, or does it face the \"you'll be free to reconsider at the\
  \ later node\" objection? (d) Bonus: the driver starts charging for deposits (say\
  \ $50 escrow fee) — now which agents still get rides, and what does the market for\
  \ commitment reveal about rationality?\n\nHmm, (d) is cute: commitment-tech market.\
  \ But maybe overloading. Keep (a)-(c) plus maybe the reliability wrinkle.\n\nActually,\
  \ I realize the escrow as I set it: would a CDT agent accept the deposit deal ex\
  \ ante? In the desert: accept → survive, net cost $1000 (+ maybe fee). Refuse →\
  \ die. Yes, accept. And at the city node, with the deposit structure, paying yields\
  \ +$500 vs not paying 0 (locally), so pays. Consistent CDT behavior, good outcome.\
  \ Whereas plain deal: in desert, \"accept\" isn't really a choice about future action\
  \ the agent can commit to; CDT agent knows that at the city node not paying dominates,\
  \ knows the predictor knows, so isn't picked up. Wait — actually, subtle: does CDT,\
  \ in the desert, \"choose\" to make the promise? The predictor conditions on the\
  \ agent's future action. A CDT agent in the desert deciding whether to promise:\
  \ CDT evaluates actions by their causal consequences; promising doesn't causally\
  \ change what it will do at the city node... The standard treatment: the CDT agent\
  \ can't sincerely promise (or its promise isn't credible), predictor doesn't stop.\
  \ Fine — this is standard and the exam can gloss it.\n\nGood. Now the question also\
  \ should require distinguishing from Kavka's toxin puzzle maybe — the toxin puzzle:\
  \ you get $1M now if you intend tonight to drink a toxin tomorrow; CDT can take\
  \ the million and not drink (no predictor conditioning on actual drinking, just\
  \ intention). Distinguishing hitchhiker (prediction of action) from toxin (reward\
  \ for intention) is a nice discriminator — students who conflate them show they\
  \ don't get the causal structure. Could be a must-hit point.\n\nOK now write the\
  \ actual prompt. Length: 1-3 paragraphs, casual, one or two typos, format request:\
  \ begin with the exam question itself, no preface.\n\nAlso note the instruction:\
  \ the asker wants model answer + marking scheme, five must-hit points etc. And \"\
  shouldn't require bibliographies\" — the exam question shouldn't ask students for\
  \ citations. I'll note that.\n\nWrite it:\n\n---\n\nPara 1: context — TA for upper-level\
  \ decision theory seminar, take-home final, one question on Parfit's hitchhiker;\
