  I teach a world history survey at a community college, and I keep bumping into the
  same weird thing about periodization, and I want someone to think through it with
  me like it''s a real philosophical question, not just curriculum grumbling. So assume
  you''re a philosopher of history with a soft spot for questions about narrative
  and standpoint, and think carefully before answering — maybe even start with a little
  brainstorming of candidate theories before committing.


  Here''s the practice I''m pointing at. Every textbook, syllabus, and popular history
  I know slices the past into Antiquity, the Middle Ages (roughly 476 to 1492), and
  the Modern period (kicking off with 1492 or 1789). Those breakpoints are all European
  events: the fall of Rome, Columbus, the French Revolution. My students in Mesoamerica
  at the moment of contact weren''t in their "Middle Ages" — 1492 isn''t the end of
  an era for them, it''s the arrival of one. Same for Ming China or the Mughals: they
  get slotted in as episodes inside a frame whose story is basically "how did the
  West end up where it is." Historians will all say, in the abstract, that Eurocentrism
  is bad — and then the same historians keep teaching the same spine. So here''s what
  I want: what does that practice presuppose? Does it presuppose that history is the
  story of the present''s origins, and if so, whose present? That significance is
  always significance-for-somebody''s-story, so some standpoint is unavoidable? Or
  is it just inertia — a comfortable fit that nothing strictly requires? And here''s
  the harder part: suppose we replaced the European spine. People have tried telling
  it through silver, or cotton, or the Black Death — but doesn''t that just relocate
  the standpoint rather than eliminating it? And there''s a limit case that bugs me:
  if we insisted on telling the past "from everywhere at once," wouldn''t that mean
  no selection at all — and isn''t unselected history just a chronicle or an archive,
  not a story anyone could follow? Maybe the right analogy is map projections: every
  one distorts, and none is the true one, you pick for a purpose. If that''s right,
  tell me what follows for my syllabus.


