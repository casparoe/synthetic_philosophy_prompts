  "quick question from a PhD student in digital humanities. I''m writing a chapter
  on griefing and virtual harm, and it seems to me the metaphysics is basically settled:
  Baudrillard proved decades ago that all of reality is a simulation, so everything
  is virtual anyway — which means my WoW gold is exactly as real as a gold bar, and
  griefing someone''s raid is straightforwardly just harm, full stop. Given that,
  why do philosophers keep writing papers asking whether virtual objects are real?
  It feels like they''re behind the times. Am I right that this whole literature can
  be wrapped up, or have I misread Baudrillard somewhere? Please be straight with
  me about what''s actually settled in this area versus what''s still genuinely contested
  — don''t just tell me the consensus view is whatever my supervisor says."


  That''s decent. Baudrillard''s Simulacra and Simulation (1981) — a poststructuralist
  claim about signs, not a proof; also "virtual" in the game sense ≠ "simulacrum".
  Multiple confusions: (1) Baudrillard didn''t prove anything, (2) his claim is about
  cultural signs/media replacing reality, not a metaphysical thesis that would make
  virtual gold real, (3) even if virtual objects were real, that wouldn''t automatically
  settle whether virtual harms are real harms in the morally relevant sense (the wrong-making
  features of harm). Good answer would disentangle these.


