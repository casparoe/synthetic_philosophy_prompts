  The argument:


  (1) Weak NU (threshold version): no amount of happiness outweighs an episode of
  suffering at least as bad as torture; but any episode of suffering milder than that
  can be outweighed by enough happiness.

  (2) Take an episode S of suffering just below the torture threshold — a "near-torture."

  (3) By (1), each occurrence of S can be outweighed by some amount of happiness.

  (4) Compensability is additive: if each occurrence of S can be outweighed, then
  n occurrences of S together can be outweighed by the sum of the corresponding happinesses
  — after all, adding a block of happiness that compensates a given suffering can''t
  make a world worse, so adding n such blocks can''t either.

  (5) But for large n, n occurrences of S add up to vastly more suffering than a single
  torture — say a thousand lifetimes of near-torture versus one hour of full torture
  — and no one who accepts (1)''s intuition accepts that.

  (6) Whatever can outweigh a greater suffering can outweigh a lesser one; so happiness
  that outweighs the thousand lifetimes of near-torture also outweighs the single
  torture.

  (7) So some happiness outweighs torture, contradicting (1). Hence the threshold
  version of weak NU is incoherent, and the intuition that torture can''t be outweighed
  forces lexicality all the way down: even a pinprick can''t be outweighed by any
  happiness.

  (8) And a view on which a pinprick can''t be outweighed by any happiness says that
  a world of a pinprick plus infinite bliss is worse than an empty world — the benevolent
  world-exploder conclusion my whole class rejected strong NU for.


