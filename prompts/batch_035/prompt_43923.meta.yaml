  prohibited but misleading is fully permissible, since only the former violates the
  assertion condition. The manual should be written deadpan, in numbered clauses,
  ~700 words, and the humor should come from getting the philosophy right: Gricean
  implicature (what''s implicated vs said), paltering, the murderer-at-the-door intuition,
  the view (Stokke / Carson / others) that asserts false... Actually careful: don''t
  lean on specific attributions. Mention "contemporary literature distinguishes lying
  (asserting what you believe false) from misleading (asserting something true while
  inducing a false belief through implicature)" — that''s safe general knowledge.


  Include specific clauses: e.g., a flowchart question "Is the sentence believed true?
  If yes, proceed"; a clause on literal truth being necessary and sufficient; examples:
  "our safety record is unbroken" (true because nothing recorded); a training exercise:
  rewriting lies into truths ("the bridge is safe" → "the bridge has never been condemned");
  a section on the murderer at the door as a "legacy scenario"; an escalation clause
  for when the implicature fails and the audience works out the truth — since on some
  views (e.g., the claim that misleading is harmless), the manual must treat being
  caught out as the only real harm.


  Also ask for the satire to be fair: a specialist in the lying-misleading literature
  should recognize the real position being ironized (the view, associated with e.g.
  some philosophers, that the wrong of lying lies solely in asserting against one''s
