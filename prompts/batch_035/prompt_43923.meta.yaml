  people though — the target should be a view, not persons. Could mention "the view
  that lying''s wrongness consists entirely in the assertion of what one believes
  false, so that truthful assertions are always above board no matter what they implicate."


  Also include: by end, a reader should feel the genuine question — whether the difference
  in assertoric content carries all the moral weight, or whether responsibility extends
  to what one predictably induces the hearer to believe.


