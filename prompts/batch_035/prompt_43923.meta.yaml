  Prompt sketch:


  "As a professor of moral philosophy, I''m assembling writing exercises for a seminar
  on assertion and ethics of speech. I''d like a satirical piece: a corporate ''Communications
  Standards Manual'' for a fictional company — say, ''Veritas Dynamics'' or a consultancy
