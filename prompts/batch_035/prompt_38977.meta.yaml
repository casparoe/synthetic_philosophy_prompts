  view — the accumulating prior work makes each discovery nearly inevitable, so who
  happens to make it is of minor importance and priority disputes are largely about
  conventions for assigning credit. On the second — the ''indispensable individual''
  view — what is actually demonstrated by such coincidences is only that several people
  can do it, not that anyone would have; on this view the identity of the discoverer
  matters, because the timing and even the shape of a theory can depend on who formulates
