  so it''s not regurgitated. E.g., ask to compare two analyses: (a) Merton''s multiples
  thesis (sociological inevitabilism: discoveries are inevitable, so who gets credit
  is a social convention) vs (b) a counterfactual-individualist view where the specific
  individual matters because the discovery would have taken much longer otherwise.
  Include a twist: inject a niche framing, e.g., "treat credit as a positional good"
  or distinguishing "the discovery is inevitable" from "the discoverer is dispensable."


  Keep it short-ish but a few sentences. Sections: e.g. "Setup (1 paragraph)", "The
  case for inevitabilism", "The case for contingency", "My verdict", with rough lengths.


  Write from perspective of retired natural scientist (e.g., a retired chemist). Polished
