  the ripe fruit view'', roughly 150 words; (3) ''The case for the indispensable individual'',
  roughly 150 words; (4) ''My verdict'', 3–5 sentences, including a judgement on whether
  the historical contingency of who discovered something bears on the credit we give
  them."


  Maybe also add a niche angle: distinguish "inevitability of discovery" from "dispensability
