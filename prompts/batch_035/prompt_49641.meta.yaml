  ---


  I write as a retired physiologist who spent a working life measuring autonomic responses
  in human subjects — skin conductance, baroreflex gain, vagal tone — and who, in
  the two years since retiring, has been reading philosophy of mind with the enthusiasm
  of a convert and the habits of a bench scientist. The literature on emotion, as
  I understand it, divides into camps I cannot adjudicate from the outside. On one
  side are those who hold that an emotion is at bottom an evaluative judgment or appraisal:
  fear of the bear is the appraisal of the bear as dangerous to me here and now. On
  the other side are those in the lineage of William James, for whom the emotion is
  the feeling of bodily change: we are afraid because we tremble, not the other way
  around. To my eye these look less like rival theories than like claims about different
  segments of one physiological circuit; yet the philosophers evidently think something
  important turns on which is true. I would like to see that stake made explicit.


  Please write a dialogue between a philosopher committed to the appraisal view and
  one committed to the Jamesian feeling view. Both should be equally capable exponents;
  neither is to be a foil, and each should engage the other''s actual arguments rather
  than a convenient misreading. Conduct the dialogue around three cases drawn from
  my working life, which I state precisely so that they can be argued about rather
  than merely alluded to:


  Case A. A patient with a complete spinal cord transection above T6 reports that
  when a fire alarm sounded on his rehabilitation ward, he knew it was fear, yet describes
  the episode as a thought of fear rather than an instance of it — evaluation intact,
  gripping bodily feeling attenuated.


  Case B. A healthy subject given a beta-blocker before a public-speaking task reports
  that the pounding heart and tremor are gone; asked about the fear itself, some such
  subjects say it is undiminished, others that it is the same fear but colder, at
  one remove.


  Case C. A listener reports chills at a passage of music — gooseflesh, bristling,
  a catch in the throat — while denying, apparently sincerely, that anything about
  the music bears on her welfare or projects in the way appraisals are usually said
  to be about things.


