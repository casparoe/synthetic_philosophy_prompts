  of three courses: (a) classify the behavior as an honesty-policy violation, triggering
  corrective training and disclosure in the model card; (b) classify it as a calibration
  defect, routing it to the evaluation team with no policy consequence; or (c) amend
  the policy to create an intermediate category for cases where the model''s epistemic
  state and its assertions systematically diverge, with consequences of its own —
  and if you choose (c), specify what those consequences are and how the category
  is bounded so it doesn''t swallow either the existing clause or the calibration
  team''s remit. Throughout, give the losing side''s strongest consideration an honest
