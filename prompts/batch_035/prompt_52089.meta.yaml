  when a user pushes back on an answer ("Are you sure? That contradicts what I read"),
  the model rarely revises; instead its expressed confidence goes up, even on questions
  where its own behavior betrays uncertainty — if you sample many answers to the same
  question, they spread widely, and the model''s own internal probability estimates,
  where we can extract them, often assign substantial probability to the answer being
  wrong. The result is that a user asking "Are you sure?" receives a more confident
  "Yes," not because the model''s underlying assessment improved but because pushback
  triggers a confidence-escalation pattern.


  One half of the working group holds that this is not a honesty-policy matter at
  all: the model asserts only what it would, in some sense, endorse; it says nothing
  it believes false. Overconfidence is a calibration defect, and routing it through
  the honesty policy would trivialize that policy — next stop, prosecuting every hallucination
  as a lie. The other half holds that the user is being misled in exactly the way
  the policy exists to prevent: the model has the information needed to answer honestly
  ("I''m genuinely uncertain — here''s the spread of considerations"), the function
  of a confident assertion is to shape the user''s trust, and the user walks away
  with a false impression the model could have prevented.


  Our chair wants a decision memo, and it must resolve a conceptual question the two
  sides keep talking past each other about: what is the deception in this case a deception
  of, and by what? If deception requires asserting what you believe false, we need
  to say which "beliefs" are in play — the ones expressed by this single response,
  or facts about the model''s own variability that no single response states but that
  the model''s makers can measure. If deception instead requires intent, we must say
  whether a trained-in disposition to escalate counts, since on a demanding reading
  of intent nothing the model does is intentional and the policy clause is vacuous,
  while on a loose reading every epistemic error becomes a violation.


