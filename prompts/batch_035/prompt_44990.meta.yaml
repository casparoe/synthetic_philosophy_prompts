  Prompt draft:


  "I''m taking a philosophy of science seminar that this semester is half about induction
  and half about statistical learning theory, and we recently had a dust-up I''m still
  chewing on. We were discussing whether machine learning vindicates induction — whether
  the fact that SGD-trained models generalize gives us any reason to trust induction
  going forward — and a classmate shut the whole thing down by invoking ''there''s
  no free lunch.'' His gloss was roughly: no learner can be justified in expecting
  to generalize, because for any learning algorithm there are worlds where it fails,
  so expecting good performance is getting something for nothing. The instructor let
  it stand as if it were a theorem, not a slogan. Since then the phrase has been floating
  around the seminar — someone used it against Occam''s razor last week, someone else
  used it to defend random search as no worse in principle than any method — and I''ve
  realized nobody, including me, knows exactly what claim they''re making. I know
  there is an actual formal result called the no-free-lunch theorem in learning theory
  (Wolpert''s, I believe, and there are relatives in optimization), and I know the
  proverb predates the theorem by a long way, and I suspect the two have quietly come
  apart.


  Can you lay out the distinct precise theses that ''there''s no free lunch'' could
  be expressing as applied to learning and induction — a menu running from the trivial
  to the substantive? For each reading, tell me: whether it''s true, whether it''s
  trivial or substantive, and — the part I actually need — whether it would support
  my classmate''s dismissal of induction. I''d especially like you to separate (a)
  readings that just follow from the domain of all possible objective functions and
  a uniform measure over them, (b) readings about actual priors over actual problems
  being unknowable, (c) readings about logical underdetermination of the future by
  the past, and (d) any reading under which the slogan is simply false — e.g., once
  you fix any non-uniform distribution, or restrict the hypothesis class, some learners
  do dominate others. Please be careful to say, for each, what it would take to make
  it true and whether my classmate needs that extra thing to be true.


  Present it as a numbered list of readings I can bring back to seminar, each with
  a label, a verdict (trivial / substantive-and-defensible / substantive-and-contested
  / false), and a sentence on whether it gets my classmate his conclusion. End with
  a machine-readable last line of the form \answer{...} containing the label of the
  single reading his dismissal actually needed — the one that, if true, does the work,
  and if false or unsupported, leaves him with nothing."


