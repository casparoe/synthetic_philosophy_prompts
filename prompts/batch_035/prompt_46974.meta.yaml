  "I''m writing an essay for a general-but-serious readership on Kazuo Ishiguro''s
  The Remains of the Day, and I want to read Stevens the butler as a test case in
  the debate between liberalism and communitarianism rather than as a simple cautionary
  figure.


  Here''s the tension I want taken seriously. The communitarian critique of liberal
  political philosophy — MacIntyre on practices and traditions, Sandel on the self
  constituted by its attachments, Taylor on horizons of significance — says that a
  self stripped of its roles and inherited commitments is not free but empty: there
  is no coherent ''I'' left to do the choosing, and the liberal demand that we critically
  endorse our ends from outside them misunderstands how ends are ours in the first
  place. Stevens seems at first to be a walking reductio of that view: his whole self
  is his role, he speaks of dignity almost exclusively in terms of serving a great
  man, and the novel''s disasters — suppressing his feelings for Miss Kenton, lending
  his competence to Lord Darlington''s appeasement — seem to come precisely from constitutive
  attachment unmoderated by critical distance. So the obvious reading is liberal:
  Ishiguro vindicates Kymlicka''s or Rawls''s picture of persons as able to step back
  from their ends.


  But I don''t think it''s that simple, and I''d like a reading that resists the easy
  moral. Three things in the novel complicate the liberal reading. First, Stevens''s
  role-identity is chosen and indeed philosophically defended — he articulates his
  conception of dignity as a considered position, not merely an inheritance, so he
  is not simply an unreflective traditionalist. Second, his community of reference
  is arguably the wrong one: he invests in the aristocratic household at exactly the
  historical moment that world is dissolving, and the novel allows the thought that
  his failure is not that he had constitutive attachments but that his attachment
  was to a collapsing and morally compromised community — a communitarian can explain
  that failure (MacIntyre''s characters are always characters of a particular tradition
  at a particular moment) at least as well as a liberal can. Third, the ending: Stevens
  on the bench at Weymouth pier, weeping, and resolving to master bantering for his
  new American employer. Is that a step toward liberal autonomy — a small act of self-revision,
  choosing a new form of relation to a new employer — or is it the same constitutive
  logic reattaching itself, a man who can only relate to others through service now
  practicing charm as a duty of station? And which reading does Ishiguro''s narrative
  sympathy actually support?


  Please give me a reading that takes both the novel and the philosophy seriously:
  say what the communitarian and liberal positions actually claim (not cartoon versions),
  where each illuminates specific episodes — the dignity discussions with Miss Kenton''s
  landlady... "


