  I''ll do the "fair summary" type on Dennett''s self as center of narrative gravity.
  Write a plausible summary with subtle misrepresentations: e.g., attributing to Dennett
  the claim that the self doesn''t exist at all (he actually says the self is real,
  like a center of gravity — an abstraction, not an illusion that doesn''t exist);
  conflating "narrative gravity" with narrating oneself; claiming Dennett denies consciousness/experience;
  saying the analogy implies the self is located in the brain like a center of gravity
  is located in space; claiming Dennett holds we can choose which self to be at will
  (he does say something like the self is a fiction that we can rewrite, but "anything
  goes"). A subtle error: center of gravity is a useful abstraction with predictive
  power — the student summary might say "since centers of gravity are just fictions,
  Dennett thinks selves are illusions and so the self can be dispensed with — no one
  is ever really responsible."


  The subtleties to build in:

  1. "The self is a story we tell, and stories are just made up, so the self doesn''t
  exist" — Dennett explicitly says the self exists as an abstraction, like a center
  of gravity; not an illusion in the sense of nonexistent.

  2. Conflation: narrative gravity — Dennett says the self is like a center of narrative
  gravity: the organizing point around which the brain spins its narrative. A common
  error is saying "gravity pulls the narrative" or that it''s an analogy from physics
  about attraction.

  3. "Dennett concludes there is no one home, so nobody is responsible for anything"
  — overstatement.

  4. Maybe: "he got the idea from physics where every object has a single center of
  gravity, so each person must have exactly one self" — Dennett allows for multiple
  selves / split-brain cases actually complicate.


  Keep it to a plausible popular-science-book voice. Ask: sentence-by-sentence or
  part-by-part audit — which parts accurate, which oversimplifications, which Dennett
  explicitly denies; whether the conclusion (dissolvability of responsibility / no
  self worth caring about) follows.


