  were equal every which way" — and tells me the Handicapper General''s America is
  where the difference principle leads: a society that weights the strong with bags
  of birdshot, masks the beautiful, and blasts the intelligent with sirens in the
  name of equality. Setting aside that the story appeared a decade before A Theory
  of Justice, I''d like a serious reading rather than a dismissal. Read the story
  through Rawls: does the society it depicts — the 211th through 213th Amendments
  and all — actually satisfy Rawls''s two principles, or does Rawls''s own apparatus
  (which permits inequalities whenever they work to the advantage of the least fortunate,
  and which nobody behind the veil of ignorance would trade for a world of forced
  handicaps) already condemn it? Does Vonnegut''s narrator side with the gifted Harrison,
  or is the ending — George and Hazel left unable even to remember their son''s death,
  the tragedy dissolving into average contentment — an indictment of a world without
  excellence and of a world that has stopped thinking, both at once? And the question
  that matters for my seminar: does the story, read honestly, support the anti-egalitarian
  conclusion my student draws from it, or does it attack a doctrine Rawls explicitly
  rejects?


  I want a committed answer, not a tour of defensible readings: take a definite position
  on whether the story genuinely bears on Rawls or has merely been drafted into service
  against him. Give me exactly five numbered points, each one or two sentences, with
  no introduction or conclusion — say, one on what the Handicapper''s regime and Rawls''s
  well-ordered society actually share, one on the strongest version of my student''s
  use of the story, one on where the story resists that use, one on what the ending
  adds that the theory alone doesn''t, and one delivering your verdict.


