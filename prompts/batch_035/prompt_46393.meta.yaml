  I play Nomic, the game Peter Suber designed in 1982 in which changing the rules
  is itself a move, and a friend has talked me into a corner I can''t get out of.
  He argues that no rule can ever authorize its own change, and then that, given that,
  no legal rule can ever be validly changed at all. Here is his argument as I best
  understand it:


  (1) A legal act is valid only if it is performed under a power conferred by a rule
  that is in force when the power is exercised.

  (2) A rule is not in force after it has been changed: the old version, once replaced,
  confers nothing.

  (3) Take a rule A that reads, in effect, "any rule, including this one, may be replaced
  by unanimous vote," and suppose the players unanimously vote to replace A with a
  different rule A′.

  (4) The only possible source of authority for that vote is A itself.

  (5) The vote does not merely precede the change of A; the act, properly individuated,
  is the changing of A. Its effect and its performance are the same event.

  (6) So A would have to be in force at the very moment it ceases to be in force:
  the power and its own destruction would have to coexist. Nothing can be in force
  and not in force at once.

  (7) Therefore the vote was unauthorized, and self-amendment is impossible.

  (8) But every legal system that can change its higher rules faces the same circle:
  a constitution''s amendment clause draws its own authority from the constitution
  it empowers people to change, so on the friend''s reasoning no constitution could
  ever be validly amended either.

  (9) And since a constitution''s original adoption was not itself authorized by any
  valid prior rule — no pedigree can go back forever — (1) implies that no constitution,
  and hence no law in any legal system, was ever valid.


