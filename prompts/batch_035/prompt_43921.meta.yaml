  "At a reading group on philosophy of biology, a member who''d read a popular treatment
  of function handed out a summary:


  ''There are two big theories of biological function. The selected-effects theory
  says a trait''s function is whatever it does now that helps the organism survive
  — the heart''s function is pumping blood because pumping keeps us alive. The causal-role
  theory says function is just a matter of what a part contributes to some system''s
  activity — since the heart''s beating contributes to the circulatory system''s capacity
  to move blood, pumping is its function, but making heartbeat sounds is equally a
  function on this view because that too is caused by the heart. The theories are
  straightforward rivals: they give the same answers in ordinary cases and diverge
  only in weird ones. The standard refutation of the selected-effects theory is vestigial
  organs — the appendix does nothing useful, so the theory implies it has no function,
  which is absurd. The standard refutation of the causal-role theory is that functions
  become relative to whatever system a researcher happens to pick, so they stop being
  biological facts. A lot of people conclude that function talk should just be dropped.''


  Go through this paragraph and tell me which claims a defender of each theory would
