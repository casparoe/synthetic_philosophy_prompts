  current benefit? Do causal-role theorists actually have to count heartbeat sounds
  as a function, and if not, what stops them? Is the treatment of the two theories
  as rivals giving the same answers in ordinary cases right, or do they aim at different
  questions? And do the two ''refutations'' work as refutations, or only as boundary-marking?
  Please also tell me where you''re least confident — which of your corrections rest
  on contested readings of the literature, and what a counterargument or example would
  make you revise them."


