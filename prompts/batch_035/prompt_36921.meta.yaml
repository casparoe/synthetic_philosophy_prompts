  fits a novelist well — they want a scenario for a novel. Domain: intergenerational
  justice and climate change — a novelist constructing a fictional scenario isolating
  a variable in intergenerational justice.


  Or "make an argument" as a novelist — e.g., arguing about future generations for
  a novel''s character. Thought experiment seems richer.


  Let me design: novelist writing a novel set in near-future about a community deciding
  whether to spend on adaptation vs. mitigation. They want a thought experiment where
  two principles of intergenerational justice deliver opposite verdicts, holding other
  things fixed. E.g., construct a case where a "discounting by distance in time" position
  and a "persons-affecting view" come apart, or where the non-identity problem is
  live: a policy choice that changes who will exist, so no future person is made worse
  off, yet intuitively wrongs them. Constraints: realistic, no sci-fi, the case must
  not stipulate verdicts but generate them, one variable isolated.


  Idea: The novelist wants a case where the non-identity problem makes a climate policy
  both permissible and impermissible depending on the theory — e.g., a town deciding
  between a cheap carbon-heavy development path and a more expensive green one, where
  the choice shifts who meets whom and thus who exists a century later. Specification:
  the case must be one where the "harm" version of the complaint fails but a "wronging
  without harming" version survives, and where the utilitarian total view and the
  person-affecting constraint split. Ask: walk through each theory, say which feature
  does the work, and note how Parfit would attack it. Ask for honest note on where
  the case is fragile and what would change the verdict — the epistemic request: say
  what would change your mind about whether the case works, where the construction
  is most likely to fail.


  Casual tone, one or two typos, 2-3 paragraphs, novelist perspective. No need for
  web search — no verbatim quotes, no leaning on specific bibliographic facts beyond
  Parfit (well-known, fine, but I can keep it loose: "the non-identity problem, the
  thing Parfit made famous" — that''s safe common knowledge).


  Constraints for the thought experiment: no time machines, no sci-fi, ordinary policy
  setting; the causal chain from choice to different people existing must be mundane
  (delayed infrastructure project shifts commuting patterns, weddings, etc.); the
  two paths must not differ in total welfare if you only compare lives-with-vs-lives-without
  (each future person has a life worth living either way); and the intuitive asymmetry
  must survive. Also the novelist wants it usable in fiction: characters the reader
  can care about, so it can''t be purely abstract.


  Additional specification: the case should make a person-affecting view say nothing
  wrong happened while a total/wide value view says something bad happened, and the
  novelist wants to know whether a character can articulate a "wronging without harming"
  complaint without sounding like a philosopher''s puppet. Also ask which feature
  does the work, what happens if removed, how a defender of the person-affecting view
  would attack.


  Write it now, casual with typos ("recieve", "definately" — maybe one or two subtle
  ones). Include the mind-changing request.'
