  Also inject a niche twist: e.g., a case where the knowledge attribution confers
  no practical advantage — a surgeon who knows vs. a lucky guesser about a one-off
  unrepeatable fact; or "epistemic value question" — whether the Meno challenge is
  demanding an explanation of a real phenomenon vs. a normative artifact of language
  games (e.g., the view that ''knowledge'' is a norm for assertion and action, and
  its value derives from its social role). Include a seeding case: a patient, one-off
  lethal allergy — knowing vs. truly believing the allergen matters for one decision
