  Precise readings of "rational credence should defer to known chance":

  1. Analytic/constitutive reading: chance is defined as the function that a rational
  agent''s credence would match (makes PP trivial).

  2. Normative conditional: conditional on complete chance information alone, credence
  = chance (Lewis''s original formulation with admissible evidence).

  3. Conditional on total evidence including chance (stronger, false when you have
  inadmissible evidence — e.g., seeing the coin land heads, or knowing the physics
  of a deterministic world).

  4. Chance-as-expert deference: treat chance function like an expert whose opinions
  you adopt wholesale (van Fraassen''s Reflection analogy, Hall''s ''chance as expert''
  reduction).

  5. The undermining problem: if your evidence includes propositions about the future
  that bear on what the chances are (e.g., ''this coin will land heads a million times''
  which is evidence the coin is biased), then unconditional deferral conflicts with
  conditionalization — leading to the "Big Bad Bug" and modified PPs.

  6. Frequentist/trivial: long-run frequencies constrain credence.


