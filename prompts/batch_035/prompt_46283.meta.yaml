  Draft text:


  ---


  I''m taking part in a seminar on the ethics of killing and dying, and participants
  have been asked to circulate a short statement of their settled views in advance
  so that the others can interrogate them. I''ve drafted mine, and before I send it
  round I''d like an audit of whether the package actually hangs together — which
  of my commitments are genuinely in tension, which only look to be, and what the
  cheapest repair would cost. Here is the set. First, I hold that there is a morally
  significant difference between doing and allowing at the level of permission: a
  doctor may withdraw or withhold a futile and burdensome treatment at a patient''s
  request, but may not administer a lethal injection that would produce the very same
  outcome, and I think this asymmetry is not mere convention or medical etiquette.
  Second, and despite that, I find Rachels''s bathtub pair devastating as a claim
  about culpability: the uncle who drowns his young cousin in the bath for the inheritance,
  and the uncle who, intending exactly the same, stands by and merely lets the cousin
  drown after an accidental slip, seem to me equally blameworthy — the bare difference
  between killing and letting die appears to make no difference there at all. Third,
  I accept the doctrine of double effect: harm intended as a means or an end is harder
  to justify than the same harm merely foreseen, which is why I think bombing a munitions
  plant with foreseen civilian deaths can be proportionate while terror bombing the
  same civilians to break morale cannot be. Fourth, I take the footbridge/switch asymmetry
  to track something real rather than squeamishness: I would divert a runaway trolley
  away from five workers and onto one, but I would not push the large man off the
  footbridge into the trolley''s path, and I don''t believe this is status quo bias
  or an artefact of bodily contact. Fifth, I am sympathetic to Singer''s claim that
  proximity and relationship are irrelevant to the stringency of the duty to aid:
  the child drowning in the shallow pond in front of me and the child dying far away
  whom I could save by a modest donation impose equally stringent obligations, other
  things such as cost and likelihood of success being equal. Sixth — and this is the
  one I suspect I''d be pressed on — I also believe that most people who decline to
  give to distant relief are not doing anything nearly as bad as killing; generosity
  beyond a certain point seems to me supererogatory, not obligatory.


