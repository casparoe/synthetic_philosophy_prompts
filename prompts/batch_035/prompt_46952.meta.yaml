  the octopus brain, and a hypothetical silicon system have less and less in common,
  so what remains common to the whole class — the thing functionalism says the mental
  state is — gets thinner and thinner. In the limit, the common part might approach
  something so abstract that it carries almost no causal information, while the heavy
  lifting is always done by the particular realizer on a given occasion. I''ve come
  to call this "causal dilution": the mental state seems to borrow its causal powers
  from whichever hardware happens to be running it, and the more kinds of hardware
