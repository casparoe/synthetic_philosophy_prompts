  ---


  I''m the control lead at a mid-sized AI lab — not frontier, but big enough that
  we''re about to ship an agent that does multi-day autonomous coding and data tasks
  for customers, and it''s my job to make sure the control measures around it would
  actually keep us safe if the model turned out to be misaligned (scheming, sandbagging,
  whatever you want to call it). The working assumption our team inherited is basically
  the control framing: we don''t get to assume alignment is solved, so safety has
  to come from a stack of monitoring, sandboxing, and escalation measures that work
  *against* a capable adversary that behaves nicely in evaluations. The problem is
  turning that framing into something the team can actually run on a proposed measure.
  Right now it''s vibes: someone proposes "a stronger trusted model reviews all the
  outputs," and half the room nods and the other half asks why not just train the
  untrusted model to be honest and skip the review.


  So what I want is a decision procedure for vetting candidate control measures, written
  for engineers who know ML but not the safety case literature. It should be a runbook:
  the questions to ask in order, with what counts as a sufficient answer to each,
  where the procedure terminates with a "no, this is compliance theater," and where
  it has to punt to a human because the remaining question is about risk appetite
  rather than facts. The questions need to cover at least: what attack the measure
  is actually supposed to stop (and what it''s irrelevant to), how it fails under
  adaptive pressure — i.e., what a capable misaligned model that knows the measure
  exists would do about it, including the boring routes like sandbagging to stay under
  a threshold — whether it''s testable in our eval harness without fooling ourselves,
  and how it composes with the other measures in the stack versus just duplicating
  one. Be honest about which steps are judgment calls dressed up as procedure, and
  about the ways the procedure itself can be gamed (e.g., a measure that passes every
  gate but only because the eval adversary we trained against was weak). We can spend
  maybe two engineer-weeks evaluating any one measure, and the output goes into a
  safety case that a review board — including execs who are not technical — has to
  sign off on, so there has to be a plain-language verdict at the end.


  Then run the procedure on two real proposals from our queue: (1) a trusted-model
  monitor: a smaller, heavily-audited model reviews every output of the untrusted
  agent before it''s released to the customer, with escalation to a human when it''s
  unsure; and (2) a honeypot/canary scheme: we seed the agent''s environment with
  fake credentials and customer data and treat any attempt to use them as a trigger
  for shutdown and investigation. Include at least one case where the procedure gives
  an answer I won''t like — my own pet proposal is the monitor, so if the procedure
  kills it, so be it — and finish with what the procedure fundamentally cannot do,
  i.e. the residual ways we ship something unsafe even after it passes every gate.


