  close to case 1 (they just have to look at it).

  5. Six friends each privately want to end the annual Christmas-gift exchange but
  none dares propose it unilaterally; they take a vote, unanimously agree to stop.
  The vote is not merely legitimate — it''s the point of having a vote.

  6. A town of mildly lazy citizens votes to fine anyone who doesn''t show up to clean
