  ---


  I am a software engineer by training and trade, with no formal background in philosophy,
  though I have recently been reading about the puzzle of material constitution: the
  puzzle of the statue and the clay. If I understand it correctly, the statue seems
  to share every physical constituent with the lump of clay it is made of, and yet
  the two appear to differ in their persistence conditions — the lump can survive
  being squashed into a ball, while the statue cannot — so they cannot be identical,
  yet they seem to occupy exactly the same matter at the same time. I also gather
  that this is supposed to be genuinely puzzling rather than a confusion, and that
  philosophers have a range of official responses: accepting that there really are
  two objects in the same place at the same time, denying that one of the pair exists
  at all, treating constitution as a relation distinct from identity, and others.


  Here is what struck me. My profession deals with what looks like the same problem
  all the time, and we do not consider it puzzling — we consider it a design decision
  with standard resolutions on the shelf. When two variables refer to the same object,
  we distinguish identity from equality (== versus is, reference semantics versus
  value semantics). When two filenames refer to the same data, Unix gives us hard
  links: two directory entries sharing one inode, where the file''s persistence condition
  is a reference count, so deleting one link does not delete the file. And when we
  want two objects that share all their state but must be able to diverge, we use
  copy-on-write: they are effectively one thing right up until a write forces them
  apart, at which point history alone determines which is which.


  Please compare the philosophical treatment of statue-and-clay with the engineering
  treatment of these analogous cases. Specifically: (1) Map each of the standard philosophical
  responses onto the engineering repertoire — which resolution in software corresponds
  to accepting coincident objects, which to denying one object exists, which to constitution-not-identity?
  (2) Say where the analogy is deep and where it is shallow. The part I most want
  examined is the following: a language designer gets to stipulate identity criteria;
  there is a runtime, a fact of the matter about memory addresses and reference counts,
  standing outside the system as arbiter. Does the statue-and-clay debate have any
  candidate for such an arbiter, and if not, is that the real source of the puzzle?
  (3) Finally, tell me whether you think the comparison supports the view that the
  philosophical debate is dissolved by the engineer''s attitude — that identity conditions
  are something we adopt for purposes rather than discover — or whether it instead
  shows that the engineering cases are disanalogous in a way that makes the philosophical
  puzzle harder, not easier. I would appreciate a rigorous answer; assume I can follow
  technical detail on either side.


  ---


