  ---


  I am a novelist three years into my third book, and before I show it to my editor
  I want an audit of the beliefs I have been writing under, because I have begun to
  suspect they do not all fit together. I came to philosophy late, through rereading
  the James–Clifford exchange during a long period when my second novel was dying
  in the marketplace, and I find that I have ended up holding an uneasy mixture of
  the two men''s positions. Let me lay out my commitments plainly.


  (a) I accept the Cliffordian rule in its full generality: believing anything on
  insufficient evidence is an intellectual wrong, not merely imprudent, and this applies
  to favorable beliefs about my own work as much as to religious or political convictions.
  (b) I nonetheless believe, and must believe in order to keep writing, that the novel
  I am finishing is good and will find its readers — the evidence before me (two commercial
  failures, a hostile early reader, my own morning doubt) does not support this, and
  I have never been able to hold the belief and assess the evidence simultaneously.
  (c) I hold that this belief is causally load-bearing: if I stopped believing the
  book was good I would stop writing it, so the belief partly brings about the fact
  that makes it true, the way James says trust between people does. (d) I also hold,
  against what I take to be James''s picture, that belief is never under direct voluntary
  control — I cannot simply decide to believe the book is good on a bad morning; the
  most I can do is manage my exposure: reread the good chapters, avoid the early reader''s
  letter, keep away from the sales figures of my last book. (e) I think that what
  makes a belief worth having is its truth, so that a belief in the book''s goodness
  would be worthless if the book were not in fact good, however useful it was in getting
  the book written. (f) And finally, I think that when I am actually writing I believe
  in my characters in a quite literal sense — at the desk I believe they exist, have
  a past, and act independently of me — even though, away from the desk, I believe
  no such thing.


  Rough plan for the prompt''s content and flow:


  Tell me whether this set hangs together. Which of these commitments are genuinely
  in tension, which only appear to be, and what is the cheapest way to restore consistency?
  I am especially interested in whether (d) quietly changes what the Clifford–James
  dispute amounts to in my case — if I cannot will my beliefs at all, I am not sure
  whose rule I am breaking or following when I reread the good chapters and avoid
  the letter. Rank the tensions by severity rather than treating them as equally bad,
  and for each, tell me what would have to give and what it would cost me, practically,
  as someone who has to be back at the desk tomorrow morning.


