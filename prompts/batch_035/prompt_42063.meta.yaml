  as a single weapon, but I suspect it is being aimed at two different targets, because
  the literature runs together two kinds of case that need separating. First, cases
  where pain is felt but motivationally inert — the asymbolic''s pain simply fails
  to move her. Second, cases where pain is felt, motivationally live, and nonetheless
  welcomed under a description: the distance runner who calls the burn in her legs
