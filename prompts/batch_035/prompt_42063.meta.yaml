  hypothesis is that the standard theories of pain''s badness — accounts on which
  unpleasantness is a sensory representation of bodily damage, accounts on which pain''s
  content is imperative (a command to stop or desist), and accounts on which unpleasantness
  consists in a negative attitude toward the sensation — divide differently on the
  two kinds of case, and that arguments built from one kind are silently doing work
  that only the other kind could do.


