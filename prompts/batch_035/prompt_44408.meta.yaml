  paternalism for children, and for adults in temporary incapacity; Mill believed
  — wrongly, but honestly — that whole societies could be at a comparable stage and
  that tutelage could hasten the passage. The error was in the empirical anthropology,
  not in the principle of developmental thresholds; fix the beliefs and the same theory
  yields self-government everywhere. Also, Mill''s tutelage was meant to be genuinely
  improving and accountable — he thought Company rule was a check on rapacious settlers
