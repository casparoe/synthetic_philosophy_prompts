  (1) Priya (A): Mill spent his entire working life, 1823 to 1858, at the East India
  Company drafting despatches for the governance of India, and in Considerations on
  Representative Government he defended rule over colonial dependencies on the ground
  that the colonised were not yet capable of self-government; and even On Liberty,
  in its opening chapter, carves out an exception saying despotism is acceptable for
  backward societies provided it improves them. So the most celebrated defence of
  individual liberty in the language was written by a functionary of empire, with
  an escape clause built in — that''s not an accident but the doctrine''s centre of
  gravity: liberty as the reward of maturity, with the administrators deciding who
  is mature.


  (2) Marcus (B): it''s a peripheral inconsistency, like his views on... no — B: Mill''s
  argument for liberty doesn''t depend on his views about India. The principle — that
  power over a person can only be justified to prevent harm to others — is universal
  in form; the barbarian caveat is an ad hoc fence Mill erected out of bad Victorian
  anthropology, and errors about application don''t undermine the argument, just as
  Newton''s alchemy doesn''t undermine the Principia. Also Mill opposed the pseudo-science
  of fixed racial hierarchy — in his reply to Carlyle he insisted that differences
  among peoples trace to history and circumstance — and he led the campaign to prosecute
  Governor Eyre after the suppression at Morant Bay. So the trajectory of his life
  and doctrine points against imperial brutality.


  (3) Priya: but the caveat isn''t a fence around the doctrine, it''s load-bearing.
  Mill values liberty not as a side-constraint but instrumentally, because it develops
  individuality; and he thinks only those with developed faculties of deliberation
  can be trusted with freedom. That makes the exclusion structural: anyone the administrators
  classify as immature falls outside the entire protection of the harm principle,
  and there is no protection against misclassification. The harm principle then applies
  only where the powerful already concede maturity — it polices the internal affairs
  of the club while licensing paternalism toward everyone outside.


