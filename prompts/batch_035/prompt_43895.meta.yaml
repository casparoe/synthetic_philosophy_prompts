  I''m a third-year PhD student in HPS, writing a chapter of my dissertation on how
  working scientists draw the science / non-science line when forced to. My advisor
  — call her M. — has been issuing demarcation verdicts in seminar for years, and
  I''ve been keeping a list. Her record so far, as near as I can reconstruct it:


  - Astrology: not science, and not because it fails but because it can''t fail —
  every missed horoscope has an escape hatch built in (the native''s will, an unaspected
  planet, an uncertain birth time).

  - Intelligent design: not science.

  - Freudian psychoanalysis, as a body of theory: not science — she''s careful to
  say this isn''t a verdict on therapy — because its explanatory machinery could accommodate
  any patient whatsoever, and did.

  - Homeopathy after the big dilution trials: not science, chiefly because its defenders
  answered negative results by inventing new mechanisms rather than sticking their
  necks out.

  - The Neptune episode: exemplary science. When Uranus''s orbit refused to cooperate,
  the postulate of an unseen perturbing planet was, on her telling, exactly how a
  legitimate theory should be rescued — because it stuck its neck out.

  - Ptolemaic astronomy: science — wrong, and growing baroque by the century, but
  science; epicycles had to answer to planetary positions, and their defenders cared
  when they missed.


  Next term a new case lands in her lap, and I want to predict the verdict before
  she gives it. A group in our department — roughly, mathematical history — fits systems
  of coupled equations to the rise and collapse of states: variables for elite overproduction,
  popular immiseration, state fiscal strain. Their papers report impressive fits to
  thoroughly documented outcomes: the third-century Roman crisis, the timing of the
  English Civil War, the Taiping Rebellion. Every failure is met by adding a variable
  or re-windowing the data. No paper contains a prediction of anything not already
  in the historical record when the model was built.


  Here''s my question: what will she say? ... Candidate rules: ... commit ... further
  case.


  I want you to identify the rules her record is jointly consistent with — at minimum
  some version of falsificationism that disqualifies immunizing practice, and some
  progressive/degenerating research-programme criterion under which Ptolemy and Neptune
  get their different-or-same treatment — say which of them the new case divides,
  give me your single best prediction of her verdict with your reasons, and tell me
  what further case would most cleanly separate the rules that agree on this one.
  Please commit to a prediction rather than laying out the possibilities; if you think
  the record underdetermines her answer, say which way you''d bet anyway and how confident
  you are.


