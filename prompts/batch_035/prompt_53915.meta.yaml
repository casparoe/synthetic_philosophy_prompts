  I am a PhD student in moral psychology, currently embedded one day a week with a
  hospital''s clinical ethics consultation service. A recurring problem in our consults
  has no settled method, and I want to see whether it can be given one.


  The problem: when a patient''s stated choice about treatment looks suspicious to
  the team — a refusal of dialysis after a bleak prognosis was delivered, an insistence
  on a life-prolonging intervention nearly everyone in the unit considers futile,
  a stated "I''d rather die than live like this" about a disability the patient has
  had for a month — the consult has to judge whether we are looking at a value the
  patient actually holds or at an artifact of how things have been presented to her:
  order effects in how the prognosis was framed, anchoring on the first number she
  was given, status quo bias, or the well-known adaptation by which people''s stated
  desires shift to match their circumstances. Morally these come apart: a settled
  preference deserves the full authority we give autonomous choice, while a bias,
  many of us think, deserves at most respectful acknowledgment and an attempt at better
  information. The trouble is that from the outside the two present identically: both
  are just "what the patient says she wants."


  I have been toying with a scaffold I want the procedure built around, and I would
  like to see whether it can bear the weight. Call it the invariance probe: re-present
  the identical facts under differently ordered, differently valenced, but factually
  equivalent descriptions, and see whether the choice survives; and pair it with what
  I call the counterpart probe: ask the patient what she would want for a patient
  in every relevant respect identical to her but a stranger to her. My working hypothesis
  is that a preference that survives both probes has a much better claim to authority
  than one that flips under either, and that this tracks something real rather than
  just producing compliance with whatever we think wise. But I am not certain, and
  I do not want the procedure to smuggle in the team''s view of what is reasonable
  under the guise of testing for bias.


  Please write a decision procedure the consult service can actually run in the one
  or two conversations we typically get. It should say: the questions to ask, in what
  order; what counts as a sufficient answer at each step; where it ends with a recommendation
  to treat the stated choice as authoritative; where it licenses one more attempt
  at informed reconsideration rather than acceptance or override; and where it must
  stop and hand the judgment to a human being because what remains is a question of
  values, not of facts. Then run it on three cases: (1) an eighty-one-year-old refusing
  dialysis after a resident delivered the prognosis in a notoriously fatalistic register;
  (2) a recently paralyzed patient stating he would refuse the ventilator weaning
  trial, where we suspect adaptation is doing the work; and (3) a patient demanding
  a treatment the whole team considers futile, whose demand does not waver under both
  probes. I specifically want at least one worked case where the procedure gives an
  answer I will not like, and I want you to say plainly what the procedure cannot
  do — which patients it will fail, and where the invariance probe itself can misfire
  (I can imagine it treating a hard-won, deliberate change of heart as a bias, since
  people who have genuinely thought something over will sometimes give different answers
  to differently framed questions).


  Two final requests. First, do not have the procedure lean on any specific published
  framework by name; I want it to stand on the reasoning, not on citations. Second,
  at the end, state how confident you are in each main claim the procedure makes,
  and single out the single point you are least sure of — if it is the invariance
  probe''s validity, say so.


