  Alternatively paradox of tragedy + probability: "my credence is 0.7 that the compensation
  theory is false..." Decompose: whether sad fiction triggers real sadness (paradox
  of fiction!), whether we enjoy the sadness itself or co-occurrent goods, etc. That''s
  a nice in-the-weeds decomposition combining paradox of fiction and tragedy.


  Let me go with paradox of tragedy + probability type. Persona: someone who just
  cried at a sad movie / started writing sad songs, or a musician whose sad songs
  are the most popular.


  Decomposition terms: (1) sad art produces genuine negative affect (paradox of fiction
  resolved: we do feel real sadness); (2) the enjoyment is of co-occurrent goods (appreciation
  of form, catharsis, feeling moved / being moved is a distinct positive emotion "kama
  muta"); (3) rich-get-richer / sad when sad theory ( Levinson''s "sad when sad" -
  actually that''s a real view); (4) meta-response / control theory (we enjoy that
  we can feel sad safely). Also whether it''s even a paradox (mere "paradox ofhedonic
  mismatch").


  Include a friend''s credence to ask where the disagreement lives, like the examples?
  One example does that; could do. Keep casual, a typo or two allowed.


