  Let me draft cases:


  - Death at 40 vs death at 90: the earlier is worse. (Deprivation view handles this.)

  - A person in permanent anesthesia/coma from age 40, still alive to 90: intuitively
  the death at 40 is still worse than this? Actually hard pair: death at 40 vs. falling
  into irreversible coma at 40 and living to 90. Deprivation seems same (no experiences
  either way after 40) — but asker thinks the coma case is less bad. Hard to reconcile
  with deprivation.

  - Lucretius symmetry: not existing before birth for 1000 years doesn''t bother us;
  why should nonexistence after death? Asker feels the asymmetry intuition but can''t
  justify.

  - Very old person, no desires left, death at 95 barely bad — deprivation account
  says depends on goods foregone.

  - A person whose only remaining life would be dominated by suffering — death is
  less bad, maybe good.

  - Someone dies instantly without knowing, at 90 after a full life — death barely
  bad.

  - Case where the person would have had a great life but says they don''t care.


  Let me structure:


  Verdicts:

  1. Death at 40 of a healthy person is much worse than death at 90 of a healthy person
  — because of what''s missed.

  2. Death at 40 is worse than irreversible unconsciousness at 40 lasting to 90 —
  but deprivation seems the same in both. Hard pair #1.

  3. The vast nonexistence before birth doesn''t seem bad at all, but the same-length
  nonexistence after death does seem bad. (Lucretius symmetry challenge.)

  4. Death of someone who would have suffered greatly had they lived — not bad, maybe
  good.

  5. A person who, before dying, sincerely and stably didn''t care whether they lived
  (indifferent, not depressed) — feels like death is less bad for them, though the
  same goods are foregone. Hard pair #2 maybe.

  6. Death of a fetus / infant — hard case? Maybe skip; or keep as further case to
  ask the principle to rule on.


  A good tension: verdicts 1+3 — deprivation explains 1 but the prenatal asymmetry
  (3) resists the deprivation view since prior nonexistence also deprives... actually
  deprivation view standardly handles it with the "later" counterfactual: you can
  only be deprived of goods you would have had, and had you not been born you''d have
  no goods anyway — the standard reply is that prenatal nonexistence isn''t deprivation
  because death, not birth, is the counterfactual... The Epicurean/Lucretian symmetry
  is genuinely hard.


  Also verdict 2 (death worse than coma with same duration) pressures pure experientialism.


  Personal relevance: asker has recently been diagnosed with a progressive terminal
  illness (say, a prognosis of a few years) — or a loved one. Let''s do: recently
  diagnosed with a condition giving a prognosis of perhaps two years. They''re doing
  reflective equilibrium on whether their own coming death should be feared. That''s
  poignant and fits "personally relevant."


  Formal/polished register. Ask for committed response: take a definite position on
  which principle survives, which verdicts get overturned, don''t just survey options.


  Further case to ask about: what the principle says about the last week of their
  own life — whether one should spend remaining time in experiences vs. projects extending
