  principle count goods the person never experiences? That''s a nice applied question:
  posthumous goods.


  Let me write it.


  Draft:


  "My recent diagnosis — a degenerative condition with a prognosis that my doctors
  put at somewhere between eighteen months and three years — has made the question
  of whether death is bad for the one who dies more than a seminar topic for me. Before
  I decide how to spend what remains, I have been trying to work out what I actually
  believe, by recording my verdicts on cases and looking for the principle behind
  them. Here they are. [cases] ... Is there a single principle that captures all of
  these, and if not, which verdicts would you overturn and why? Please take a definite
  position rather than laying out the options: I would rather be told that one of
