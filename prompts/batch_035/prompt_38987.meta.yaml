  on the principle, tell me what it implies for a case I have not listed: whether
  goods I will never experience — letters written now to be opened by grandchildren
  after my death, a trust fund, a book finished by a colleague from my notes — count
  toward how bad my death is for me, and so whether they are things I ought to be
  spending my remaining months on."


  Cases:


