  bad to me. Tension between desire-based and deprivation. Good pair.


  So hard pairs: (1&3) deprivation handles 1 but struggles with 3''s asymmetry; (2)
  pressures deprivation toward experientialism or vitalist; (5a vs 5b) desire-based
