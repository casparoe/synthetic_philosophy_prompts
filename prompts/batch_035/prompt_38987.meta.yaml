  Hmm wait — if deprivation = goods foregone, and after coma onset no goods are enjoyed,
  then coma-40 and death-40 deprive equally. Asker thinks death is worse. That pressures
  pure deprivation. Alternatively experientialist thinks both fine... Asker''s verdict
