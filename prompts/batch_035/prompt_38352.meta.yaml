  I''ve been around the rationalist corner of the internet since the Overcoming Bias
  days, and I''ve noticed that our recurring argument about wireheading always dies
  in the same place. Someone describes a rat with an electrode in its reward circuitry
  pressing the lever until it starves and calls that maximal pleasure; someone else
  replies that wanting and liking have come apart in that rat — that mesolimbic dopamine
  is being cranked, not experienced pleasantness, so the rat is being tortured by
  compulsion rather than paid in bliss — and a third person mutters that we have no
  idea what we even mean by "experienced pleasantness" once it has to cover morphine,
  orgasm, the flow state of a working mathematician, the relief of a stopped migraine,
  and the contentment of a fed infant. The first two keep arguing. I want to take
  the third person seriously for once.


  The mutterer is gesturing at the heterogeneity problem for hedonism: the observation
  that our pleasures seem to share nothing but the name. Before I go back to arguing
  about wireheaded utopias — and, relatedly, before I trust any cross-species or cross-mind
  welfare comparison that assumes a common hedonic currency — I want the full specification
