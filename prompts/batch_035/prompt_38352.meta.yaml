  So: write the desiderata. What must an adequate theory of what pleasures have in
  common deliver? Some candidates I can see, which you should feel free to add to,
  reject, or refine:

  1. It must say whether the commonality is introspectively accessible — whether someone
  who has the pleasures of food and music could in principle notice what they share
  — or whether unity can be purely theoretical, posited against the evidence of how
  different they feel.

