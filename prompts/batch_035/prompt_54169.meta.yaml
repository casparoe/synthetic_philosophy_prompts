  circulate beforehand.


  The study: for eleven years the society supervised sittings with an automatic-writing
  medium — a retired schoolteacher who charged no fee and gave sittings only in the
  presence of society members. Scripts were sealed and dated; sitters were instructed
  not to feed information. Of roughly four hundred scripts, a scoring committee rated
  twelve as containing specific, veridical details about deceased persons, details
  the medium could not plausibly have acquired by ordinary means. Against this: the
  criteria for counting something as a hit were fixed only after the scripts had been
  read, so the impressive dozen were selected post hoc from a large pool; the strongest
  scripts cluster around the sitters with the closest personal relationships to the
  medium; and an audit found that the medium had, months before one of the best scripts,
  spent a week in the town where one of the deceased had lived. No fraud was ever
  detected in a supervised sitting, and the statistician on the committee maintains
  that even after conservative correction the aggregate remains improbable on the
  hypothesis of chance alone.


  The committee is split three ways. One faction wants the report published with the
  society''s endorsement of survival-communication as at least a working hypothesis;
  one wants the raw data published with no endorsement; one wants it archived while
  a new, prospective study is designed with scoring criteria fixed in advance.


