  Essay draft (~300 words):


  "Searle''s Chinese Room argument is an attack on the Turing test. Turing proposed
  in 1950 that if a machine''s conversational behaviour was indistinguishable from
  a human''s, we should count it as thinking. Searle thinks this can''t be right when
  it comes to actually understanding a language.


  He asks us to imagine a man sealed in a room. The man understands no Chinese at
  all. Through a slot come batches of Chinese symbols, and he has a rulebook, written
  in English, that tells him for any batch that comes in exactly which batch to send
  back out. The rules are purely formal: he matches up shapes and never knows what
  any of them mean. If the rulebook is good, the people outside can''t tell they''re
  not writing to a native speaker. Yet the man understands no Chinese, and, Searle
  says, he is doing everything a computer does. So running the right program is not
  enough for understanding: syntax, by itself, doesn''t give you semantics. Since
  the man does everything a program can do and never understands anything, no computer
  could ever understand anything, and the Turing test is shown to fail as a test of
  understanding.


  The systems reply: the real problem is that the room is shut off from the world.
  Give the room cameras, microphones and maybe wheels, so that the symbols coming
  in are grounded in perception and action instead of arriving through a slot, and
  the resulting system will genuinely understand. Searle''s answer is that this only
  piles on more uninterpreted symbols for the man to shuffle.


  The robot reply: the understanding belongs to the whole system — the man plus the
  book plus the paper — even though the man alone doesn''t understand, rather in the
  way no single member of a translation team may grasp a whole text but the team produces
  a good translation. Searle answers by having the man memorize the rulebook and do
  all the work in his head: then there''s nothing in the room but the man, and he
  still doesn''t understand Chinese, so the systems reply fails.


  On (iv): I think Searle''s answer succeeds. Given that the only thing in the room
  that could plausibly understand is the man, and he doesn''t, it follows that nothing
  in the room understands — that settles the systems reply, which otherwise would
  have to say the understanding exists without being located anywhere, a category
  mistake. And notice that Searle''s own view — that understanding is a biological
  phenomenon caused by the brain — is basically the same point as the systems reply''s
  claim that understanding emerges at the level of the whole system, so the two sides
  are closer than they look; the disagreement is really about which whole does the
  understanding."


