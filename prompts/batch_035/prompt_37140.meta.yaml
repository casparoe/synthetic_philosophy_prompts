  I''ve spent years reading the rationalist blogs, where "luminosity" is a local coinage
  for the project of making your own mind legible to yourself — knowing, on reflection,
  what you actually believe, want, and feel, as opposed to what your self-model says.
  The party line I absorbed there is that native luminosity is poor (confabulation,
  choice blindness, splitting, akrasia you can''t name) but trainable: introspection
  is unreliable, not impossible. I recently discovered that Timothy Williamson used
  the same word in Knowledge and Its Limits (2000) for something much stronger: a
  condition is luminous iff, whenever you''re in it, you''re in a position to know
  you''re in it. His chapter 4 argues almost nothing is luminous, via a margin-for-error
  principle. Fine so far; I''m sympathetic to the fallibilist moral. But when I tried
  to write out the argument in my own words, it kept growing teeth, and I now have
  a version that seems to prove far too much. Here it is.


  (1) Whenever you make a judgment about your own current mental condition — I am
  in pain, I believe p, I feel uncertain — there are possible cases differing from
  your actual one by less than any discrimination you could make, in which you would
  make the very same judgment while the condition it reports does not obtain. (Whatever
  internal difference it takes for the condition to flicker, the flicker can be made
  smaller than your discrimination.)

  (2) Those indiscriminable cases count as "close": if you know that you are in the
  condition, then in each close case in which you make the same judgment, that judgment
  is true — knowledge can''t be lucky enough to be false in a case you couldn''t have
  told apart.

  (3) So you never know that you are in any mental condition of the kind you might
  report; at best you believe it, probably correctly.

  (4) But knowledge, on the conception behind (2), is closed in this respect for all
  subjects and all topics, not just introspection: for any judgment whatever, indiscriminable-and-close
  cases in which the judgment is false can be located near its topic. So the reasoning
  shows, with equal force, that you never know that the reading lamp is on, that 57
  is prime, or that the close cases posited in (1) are close.

  (5) Therefore either no one knows anything — including the premises of this argument
  — or premise (2), or the notion of closeness it smuggles in, must go.


  I can''t accept the skeptical horn; I also can''t accept that (2) is simply false,
  because I believe the underlying idea that knowledge requires not being wrong in
  nearby cases, and I want to keep whatever of it stops me from "knowing" I locked
  the door when I merely always lock it. And I''d rather not say that introspective
  judgments are special by fiat, since the confabulation literature suggests they
