  Student answer text (paraphrase, formal):


  "Anselm defines God as that than which nothing greater can be conceived. Even the
  fool who denies God must have this concept in his understanding, since he understands
  what he is denying. It is greater to exist in reality than merely in the understanding,
  so if God existed only in the understanding, a greater being could be conceived,
  namely one existing in reality; contradiction; so God exists in reality. In the
  next chapter Anselm argues God cannot be conceived not to exist: whatever exists
  and cannot be conceived not to exist is greater than what can, and God is the greatest
  conceivable, so God cannot be conceived not to exist. Together the two chapters
  give existence and necessary existence.


  Kant presses the parody objection: if the argument worked, we could prove the existence
  of a perfect island, since an island than which no greater can be conceived is defined
