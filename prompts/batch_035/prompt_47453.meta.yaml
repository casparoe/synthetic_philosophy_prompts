  Draft:


  "Longtime lurker here — I''ve read my fair share of ''how much can you trust your
  own map'' threads, and the one about perception never got resolved. I''ve now got
  two friends who have been arguing for years about the argument from illusion: one
  is a disjunctivist in the McDowell–Snowdon–Martin lineage, the other defends a conjunctive,
  indirect-realist view on which veridical perception and subjectively indistinguishable
  hallucination involve a common mental factor. Write the joint statement they could
  both sign after a properly-run adversarial collaboration: claims they can agree
  on about the argument from illusion, what it actually commits the disjunctivist
  to, and about the phenomenology of the good and bad cases; the exact disagreements,
  each phrased so its own side would accept the wording; and the cruxes — e.g. whether
  ''exactly alike in phenomenal character'' has to mean ''involves the same kind of
  experience'', whether the possibility of subjectively indistinguishable hallucination
  undermines the idea that in veridical perception one perceives the world directly,
  and how each side explains the epistemic asymmetry between perception and hallucination
  without smuggling in the other''s commitments. For each crux, give the case or argument
  both sides agree bears on it, with each side''s prediction written down in advance.
  If part of their dispute strikes you as verbal rather than substantive, say which
  part and why — but if you think the joint statement would have to be so hedged as
  to be vacuous, or that the argument from illusion as I''ve framed it is itself confused,
  tell me plainly rather than producing something both could sign only because it
  says nothing."


  Check constraints: no real quotes. Mentions McDowell, Snowdon, Martin — attributions
  of a lineage, general knowledge, fine (verifiable, well-known, not leaning on specific
  work titles). No web search needed. British English: "recognise"? Fine.


  Length okay. Formal/polished. Rationalist-blog reader voice: mention LessWrong/maps.
  Good.'
