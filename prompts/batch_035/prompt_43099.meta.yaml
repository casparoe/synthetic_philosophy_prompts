  if two ideally rational agents assign different probabilities to the same proposition,
  someone somewhere has reasoned badly. Yet I also gather that others in the field
  treat the assumption as no more than a modeling convention — a bookkeeping device
  that simply relocates all disagreement into the information partition, so that "differing
  priors" becomes a place to file whatever the modeler does not care to explain.


