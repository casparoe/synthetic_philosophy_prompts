  4. R.: then take grief — DSM-5 initially wanted to fold normal bereavement into
  depression after two weeks and backed off after public outcry; that shows the institution
  can police its own boundaries, values and all. She: it shows exactly the opposite
  — the boundary was moved by petition and politics, not by evidence; and Szasz predicted
  this: the scope of illness tracks what we want medicine (and the state) to handle,
  cf. drapetomania, homosexuality in DSM-I/II until 1973.


  Then ask: adjudicate move by move, who''s right about which specific point, what
