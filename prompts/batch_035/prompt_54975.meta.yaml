  Rounds:

  1. R.: Szasz''s argument requires that disease = bodily pathology; but modern medicine
  is full of diseases defined functionally — hypertension is a threshold on a measurement,
  migraine has no lesion either (well, it has correlates). If these count as diseases,
  Szasz''s premise fails and mental disorders can be diseases in the same sense.

  2. Philosopher: but the thresholds in somatic medicine are pegged to downstream
  harm — a blood-pressure number counts because it predicts strokes; and the number
  is measured by an instrument everyone agrees on. In psychiatry the "measurement"
  is itself a judgment about how one''s life is going, so the value judgment is built
  into the detection, not just the threshold. Szasz''s deeper point was about who
  speaks with medical authority.

  3. R.: that just shows psychiatry is younger — sleep medicine and pain medicine
  also rely on self-report. Nobody says insomnia or chronic pain are myths. She concedes
