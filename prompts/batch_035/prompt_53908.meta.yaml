  fraction of real-world conflicts in which commitment technology generates Pareto
  losses — interstate disputes, commercial litigation, turf wars within firms — there
  exists some safe Pareto improvement of roughly this shape that both parties would
  in principle accept, if only it were proposed and its terms clearly understood.
