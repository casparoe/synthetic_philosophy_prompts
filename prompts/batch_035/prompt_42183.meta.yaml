  I am a staff software engineer at a company that builds a large consumer mobile
  app, and I sit on the small internal council that owns our recommendation system''s
  objective function — the formal quantity our models are trained to maximize. Every
  eighteen months we revisit the objective, and the upcoming review has split the
  council three ways, with a decision required before the next planning cycle.


  The first faction wants to keep optimization on behavioral signals alone: clicks,
  watch-through, session length. Their position is that behavior is the only data
  that isn''t cheap talk — whatever a user''s stated reasons, what she actually chooses
  under real conditions reveals what she prefers, and surveys are hopelessly contaminated
  by what people wish to believe about themselves.


  The second faction wants to move a substantial part of the objective onto stated
  preference: a periodic in-app survey asking users how satisfied they are and whether
  they feel the product serves them well. They argue our behavioral metrics have been
  Goodharted... attention is not welfare, and someone who binges for two hours and
  reports feeling worse afterward is revealing a preference by a different channel.


  The third faction — one principal engineer — claims the entire dispute is verbal:
  "what users really want" has no fact of the matter independent of which measurement
  we choose, and the council should just pick whichever proxy best predicts retention
  and stop arguing about preference.


  I have to write the memo that settles this. Draft it for me: a recommendation the
  council can act on (we can weight the objective, fund the survey infrastructure,
  or defer with a specified study), the reasoning behind it, and an honest treatment
  of the strongest argument on each losing side. Two things I want the memo to take
  seriously: first, whether observed behavior really "reveals" preference in our setting,
  given that the recommender curates which alternatives the user ever sees — we partly
  train on behavior we ourselves caused; second, whether my colleague is right that
  the dispute is merely verbal, or whether there is a substantive question here about
  what our objective should track that survives once we''ve fixed the measurements.
  Assume no philosophical background on the council; define any terms of art you use.


