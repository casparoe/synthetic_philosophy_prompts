  construct/operationalization for a specific model of a consistent agent) to "every
  actual choice maximizes utility." Revealed preference theory is a representation:
  if choices satisfy certain coherence axioms (like WARP/GARP), then they can be represented
  as maximizing a utility function. The theory doesn''t say every choice is rational
  by definition; it says that when choices are consistent, we can model them as utility-maximizing.
