  x to y. (2) Utility, in turn, is merely a device for representing these preferences;
  to say that an option has the highest utility for an agent is just to say that it
  is the option she chooses. (3) It follows that every voluntary choice is, by definition,
  utility-maximizing: the hypothesis that an agent chose otherwise than utility-maximizing
  could not even be formulated without contradicting the definition. (4) Since "contrary
  to the agent''s own good" means, on this approach, nothing more than "contrary to
  what she prefers," and what she prefers is fixed by what she does, no voluntary
  choice can ever be contrary to the agent''s own good. (5) So when we say of a man
  that his weekend gambling emptied his bank account against his own interest, the
  most this can mean is that we disapprove; it cannot be literally true of a voluntary
  act. (6) Yet such statements can be literally true: an agent can knowingly, at the
  moment of action, choose against what he himself regards as his interest, as in
  ordinary weakness of will. (7) Therefore the revealed-preference approach is false,
  and utility must be an independent psychological magnitude that choice measures
