  Argument that proves too much on revealed preference:


  (1) On the revealed-preference view, utility just measures what an agent chooses;
  preferences are inferred from choices.

  (2) A rational agent always chooses what maximizes utility, since utility is defined
  so that the chosen option ranks highest.

  (3) So any criticism of a choice as "irrational" — e.g., buying lottery tickets,
  staying in a bad relationship — is a category error: by definition, these maximize
  the agent''s utility.

  (4) Therefore welfare economics and policy advice can never say any voluntary choice
  makes people worse off.

  (5) But we regularly and correctly say things like "she ruined her finances on scratch
  cards" and mean it as more than a description of her budget.

  (6) So revealed preference is false as an account of preference/utility, and utility
  must be an independently measurable mental state.


