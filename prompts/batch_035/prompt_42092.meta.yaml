  The notes:

  - Setup in a sentence for readers who don''t know it: Shubik''s dollar auction is
  an auction for a dollar bill where the second-highest bidder also pays their bid
  and gets nothing. Famously, rational people bid way past a dollar.

  - My main claim: the standard lesson drawn from this ("look how irrational people
  are, sunk costs and all that") is wrong, or at least aimed at the wrong moment.
  Once you''re the second-highest bidder, every individual bid is rational in a narrow
  sense: you either pay (say) 90c for nothing or bid 95c to get a dollar, and so on
  up. The bidding past a dollar isn''t the interesting irrationality; the interesting
  irrationality is that anyone bids at all in the first place, given common knowledge
  of the trap. The auction is best understood as a machine for converting one small
  error (opening the bidding) into a big one, and the rationality of the later bids
  is just the ratchet working as designed.

  - My second claim, which I''m less sure of: it''s tempting to say the later bids
  are rational "given you''re in this mess", but only in the same weak sense in which
  any sunk cost reasoning is rational — the "given" is doing all the work, and if
  you notice you''d rationally bid 105c for a dollar then you should be able to notice,
  one bid earlier, that the person you''re bidding against can too. I want to argue
  this creates an infinite regress that unravels backwards to the first bid, and that
  this is why framing the whole thing in terms of sunk costs misdescribes what the
  players get wrong. Maybe. This is the bit I most want pressure on.

  - I also want to use the auction to say something about escalation of commitment
  in organisations (big IT projects, wars, etc.) — roughly that real escalations differ
