  fixed, it''s partly constructed by the escalation itself, and I suspect that difference
  means my "convert one small error into a big one" framing doesn''t transfer cleanly.
  I have a hunch this is right but haven''t worked it out.


  What I''d like from you:

  1. Does claim 1 hold up? Specifically, is the "one small error, big machine" framing
  compatible with the point that at no stage is any individual bid straightforwardly
  irrational?

  2. Is the regress in claim 2 real, or have I smuggled in assumptions about common
  knowledge of rationality that the actual auction doesn''t give you? (My feeling
