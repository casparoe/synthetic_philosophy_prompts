  Design the prompt (professor voice, casual, a typo or two):


  Domain: What is life? Definitions and borderline cases.

  Type: Construct a thought experiment to specifications.


  Prompt draft:


  "Long-time lurker, first-time asker, philosophy professor here (bioethics adjacent,
  so forgive me if I''m reinventing wheels). Every year I teach the ''what is life''
  unit and every year I get bored of the stock borderline cases — viruses, prions,
  mules, HeLa cells, that rogue cancer cell line. I want a fresh case, and I want
  it built to spec, because the spec is the philosophy. Here''s the setup I''m after.


  There are two families of definitions we always contrast: the self-maintenance family
  (something is alive if it''s a self-organizing, boundary-maintaining system that
  constantly works to persist — metabolism-and-membrane stuff, roughly) and the evolution
  family (something is alive if it belongs to a lineage that undergoes natural selection
  — life as replicators with heritable variation). Usually these agree. I want a case
  where they split, but under constraints:


  1. Realistic. No von Neumann probes, no synthetic organisms, no ''imagine a creature
  that...'' The case should be buildable from actual biology or something like a lab
  or field situation — zoo, farm, greenhouse, hospital, whatever. Nothing that only
  exists in thought.

  2. Not one of the stock cases. No viruses, no prions, no mules, no HeLa, no enslaved
  organelles/endosymbionts, no brain-dead patients. If your case is a variant of one
  of these, it has to differ in a way that does argumentative work, not just dressing.

  3. The split has to be generated, not stipulated. Don''t say ''and the definition
  says X'' — show me what each definition actually computes on the case, and it better
  not be obvious that you rigged the scenario so only one answer is possible. A case
  where a reasonable defender of either definition could dig in is worth more than
  a slam dunk.

  4. Direction: I want the self-maintenance view to say yes and the evolution view
  to say no, but I also want you to include one nearby variant of the case — change
  one feature — where the evolution view comes back in and the self-maintenance view
  (or at least a self-maintenance theorist) starts to sweat. So the pair of cases
  should triangulate whatever variable is doing the work.

  5. Then the analysis: which feature of your case is the load-bearing one; what happens
  to the split when you remove it (does the case collapse into something both definitions
  agree on?); and how a defender of the definition that loses in the main case would
  respond — bullet-biting, definitional amendment, or an attack on the case. I''m
  especially interested in the token/type issue the evolution view has: does it classify
  organisms or lineages, and does your case force that question?


  Extra credit if the case is one I could actually use in class, i.e., students with
  no background can grasp it in a minute. And a confession: I''ve seen people argue
  the evolution view should just be individuated over lineages so it never even sees
  the organism-level question — if your case makes that move look like a dodge rather
  than an answer, even better."


