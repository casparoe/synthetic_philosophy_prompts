  Draft final:


  ---


  Grading season, so forgive the typos and the slightly cranky tone. I''ve taught
  philosophy of biology for a while now, and every spring we hit the "what is life"
  unit, and every spring I die a little inside going through the same borderline cases
  — viruses, prions, mules, brain-dead patients, that immortal cancer line. I want
  something fresh, and I want it built to order, because honestly the specs are where
  the philosophy lives. Can you build me the following?


  On one side, the self-maintenance family of definitions: something is alive if it
  is a self-producing, boundary-maintaining system that actively works to keep itself
  going (metabolism, membranes, homeostasis — you know the genre). On the other, the
  evolution family: something is alive if it belongs to a lineage undergoing natural
  selection (replicators with heritable variation competing for persistence). These
  mostly agree. I want the case where they don''t, under these constraints:


  1. Realistic. No von Neumann machines, no synthetic life in a vat, no "imagine an
  entity that...". It should be built out of ordinary biology — farm, zoo, hospital,
  lab bench, greenhouse.


  2. Not a stock case, or only a cousin of one. If it''s a variant of a standard example,
  the difference has to do argumentative work.


  3. The split has to be generated, not stipulated — no fair writing "and clearly
  this thing is alive" and letting the definitions trail along. Show me what each
  definition actually computes when you run it on the case, and make it a case where
  a competent defender of the losing side could still put up a fight. A contested
  split beats a slam dunk.


  4. Here''s the part I really care about. Don''t give me one case, give me a pair:
  the main case splits them self-maintenance yes / evolution no; then a nearby variant,
  changed in exactly one feature, that splits them the other way — self-maintenance
  no / evolution yes. And the single feature you toggle has to be the same one doing
  the work in both splits, so the pair jointly isolates one variable. I have a hunch
  the variable is something like where the persistence comes from (work the system
  does itself vs. conditions it happens to sit in), but I want to be surprised.


  5. After the pair: name the load-bearing feature; say what happens if you neutralize
  it — do both cases collapse into boring territory where the definitions agree?;
  and give me the best response of whichever definition loses in each case, bullet-biting
  or definitional surgery or attacking the case. And I want you to confront the token/type
  problem head on: does the evolution view even classify organisms, or only lineages,
  and does your case make the lineage-level move look principled or like a dodge?
  Relatedly, if the self-maintenance view has an analogous escape hatch, name it and
  say whether it''s better or worse.


  Bonus gratitude if a class of non-science students can grasp the pair in about two
  minutes each.


  ---


