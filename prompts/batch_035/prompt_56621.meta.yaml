  Dangerous Idea) inside out.


  My thesis, in brief: the familiar charge that neuroscientific theories of consciousness
  commit "greedy reductionism" misidentifies the defect. Greediness has nothing to
  do with how many levels an explanation skips; a legitimate crane can run in one
  stride from spike trains to person-level phenomena, provided the interpretive step
  — the move from third-person data to subject-level vocabulary — is made explicitly
  and motivated independently. The genuine defect, which I call an interpretive overdraft,
  arises when an explanation uses person-level terms (report, access, what-it''s-like)
  inside its own machinery without ever cashing them out, so that a construction which
  looks like it was assembled from the ground up turns out, on inspection, to have
  a load-bearing beam held up by an unacknowledged skyhook. I apply the bookkeeping
  in two directions. First, against the majority: the popular "neural correlates of
  consciousness" framing is greedier than it looks, because the selection criterion
  for the correlates is stated in the very terms the explanation is supposed to ground.
  Second, against the minority: the emergentists'' and panpsychists'' favorite objection
  — that consciousness science leaves out the intrinsic level, so one must add a fundamental
  level from above — is a demand to write the same overdraft into one''s metaphysics
  rather than to eliminate it; adding a fundamental property is not a crane, and it
  does not balance the books.


