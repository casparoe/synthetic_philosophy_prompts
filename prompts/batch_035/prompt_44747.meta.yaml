  I live in a cohousing community of about twenty adults that has a large shared vegetable
  garden. Everyone eats from it, and for years the arrangement has been informal:
  whoever feels like it works in it. In practice the same four or five people do nearly
  all of it, and there is growing resentment. Next month we vote on a formal proposal,
  and since I''ve been asked to open the discussion, I want to get my own thoughts
  straight first. I have no background in philosophy or economics, and I''ve been
  puzzling over this entirely on my own, so I''d like you to help me. Please take
  on the role of a philosopher who specializes in fairness, cooperation, and how groups
  share resources, and work through my questions carefully rather than jumping straight
  to a verdict.


  The proposal: each household owes a fixed number of garden hours per month. Any
  household can skip the hours by paying $15 per skipped hour into a fund that would
  pay a local teenager to do them instead.


  Here is what keeps tripping me up. The people who currently do most of the gardening
  mostly enjoy it. My neighbor across the path is out there nearly every evening,
  and I know that for her the garden is as much her social life as a chore; if she
  weren''t weeding she''d be doing something she likes less. Another member, by contrast,
  detests gardening, but he cooks nearly all of our shared Sunday dinners, which takes
  him several hours a week. Nobody has ever counted the cooking toward any shared
  duty, because it isn''t "garden work," yet everyone eats those dinners just like
  everyone eats the vegetables.


  Working through this, I''ve come to suspect that there are two different things
  that get tangled together in our arguments, and I''ve privately started calling
  them "what you give up" and "what you put in." What you give up is the leisure or
  effort you sacrifice; what you put in is the useful work that lands on the pile
  for everyone. When our proposal counts hours, it seems to measure the second thing
  — the pile — but our resentment seems to track the first. The happy daily gardener
  piles on far more hours than the reluctant one, but it''s not clear she gives up
  more to produce them; meanwhile the cook gives up a lot, and puts a lot on a pile,
  but neither the hours rule nor the resentment notices.


  So, three questions. First: when a shared duty is being divided, should the required
  contribution be measured by what a person sacrifices, by what they add for everyone,
  or somehow by both? Does it change the answer that the sacrifice is partly chosen
  — someone can take up gardening precisely because they enjoy it, and it feels odd
  to me both to reward that enjoyment and to penalize it. Second: is there a principled
  way to decide which tasks count toward the shared duty at all, or is the line between
  "garden work" and "everything else we do for each other" just an accident of what
  we happen to formalize? Third: what about the $15 opt-out? Part of me thinks it''s
  a clean solution, and part of me worries it quietly converts a community into a
  market — the people with more money end up never touching the garden at all, and
  we stop being people who share a task and become people who hire and are hired.


