  He was not willing to take that on faith, nor to dismiss it; so he went looking
  for evidence, and survival of death seemed to him the place to look.


  At a dinner, my friend Marcus said that this chapter of Sidgwick''s career was actually
  his most admirable. (1) Once you accept the dualism of practical reason as a real
  problem, following it up empirically — asking whether there is any evidence that
