  ---


  My closest friend and I have argued about infinity for years, and last night''s
  argument — four hours, over dinner, ending unresolved — convinced me we need something
  better than another rematch. She is a strict finitist of a practical temper: she
  thinks every meaningful quantity is finite, that "infinitely many" is at best shorthand
  for an unending process, and that talk of completed infinite collections is a kind
  of bookkeeping fiction that has conned mathematicians since Cantor. I think Cantor''s
  theory is a genuine discovery about abstract structure: that comparing collections
  by pairing is principled, that some infinities are genuinely larger than others,
  and that there is nothing incoherent about a completed totality of natural numbers.
  We know the standard textbook moves and have worn them out. What we have never done
  is write down, precisely, what we actually agree on, where our disagreement is real
  rather than verbal, and what would count as progress.


  Please draft the joint statement we should be able to sign after a good-faith adversarial
  collaboration. I want: (1) a numbered section of claims both of us can accept —
  about Hilbert''s hotel as a piece of reasoning, about what bijections do and don''t
  show, about where mathematics needs infinity as a shorthand and where it seems to
  assert it; (2) a disagreements table stating our residual disagreements in wording
  each of us would actually endorse — her side phrased as she would phrase it, mine
  as I would; (3) the cruxes: the sub-questions such that settling one would move
  at least one of us. I can tell you three candidates, though you may find better
  ones.


  First, the part-whole question. We both grant Galileo''s observation that the perfect
  squares can be paired one-to-one with all the natural numbers, so there are "as
  many" squares as naturals even though the squares are a proper part. She says this
  is a reductio: a notion of "same number" that violates whole-greater-than-part should
  be discarded, and bijections establish at most an equivalence between processes,
  not equality of size. I say size for infinite collections simply is defined by the
  pairing criterion, and clinging to part-whole intuitions outside their finite home
  is like insisting subtraction must always be possible. Which of us is dispensable:
  the part-whole principle or the pairing criterion? Is this a genuine disagreement
  or partly a fight over the word "number"?


  Second, an occupancy question we invented last night that neither of us could settle.
  In Hilbert''s hotel with every room occupied, move each guest from room n to room
  2n. Every even-numbered room is now occupied and every odd-numbered room is empty.
  Ask what fraction of the rooms are occupied. My friend insists any competent accountant
  would say half, and that Cantor''s answer — that the occupied and empty rooms are
  equinumerous, and that the fraction question either has no answer or depends on
  how you enumerate — shows the theory has lost contact with counting. I reply that
  the answer genuinely depends on the enumeration order: it is not that the question
  has a hidden answer but that "fraction" was never well-defined for infinite sets,
  and the hotel case is just the place where that becomes visible. We could not agree
  on whether this case favors either side, or merely illustrates the first crux over
  again. Settle that in the document: does the occupancy question bear on the part-whole
  dispute, or is it downstream of it?


  Third, supertasks. A lamp is switched on and off infinitely many times over a shrinking
  interval — one minute, then half a minute, then a quarter — and we ask whether it
  is on or off at the two-minute mark. My friend takes the indeterminacy as evidence
  that the notion of completing infinitely many discrete steps is incoherent, and
  that completed infinities are not merely unphysical but contradictory when you try
  to make them concrete. I am tempted to say the setup simply fails to specify the
  limit state, the way a sequence of coin flips fails to specify its limit when the
  flips don''t converge — the failure is in the question, not in infinity itself.
  Where exactly between us does this crux lie, and is there a formulation of it that
