  is more—you''ll be a Man, my son!"). I''d like you to take on the role of a professional
  philosopher of language with a specialty in conditionals, think carefully before
  answering — perhaps begin with some brainstorming about the poem''s logical structure
  — and then give me a reading of the poem through the lens of Lewis''s results and
  the semantics of indicative conditionals more generally.


