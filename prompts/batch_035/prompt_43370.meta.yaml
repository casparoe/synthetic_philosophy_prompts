  Key diagnostic questions for lying vs misleading:

  - Does the wrongness of lying reside in the assertion of what one believes false
  (violating norm of assertion), or in intending the hearer to form a false belief
  (deception itself)?

  - Kant''s murderer at door: is "he is not here" false assertion vs "I saw him go
  toward the market" (true but implicating) — Kant famously says misleading answer
  to undeserved question preserves honesty while lying violates it ("On a supposed
  right to lie"). Kant: a white lie always harms humanity, but a merely misleading
  (true) statement is permissible. So one position: Kantian strict difference.

  - Aquinas: lying always a sin but equivocation (using words in an uncustomary sense)
  permissible for avoiding harm — interesting middle.

  - Legal context: perjury vs misleading statements not under oath; "I did not have
  sexual relations with that woman" (Clinton) — definition-scoping.

  - Gricean machinery: does the speaker assert p or merely implicate p?

  - Cases: paltering (actively saying true things to deceive — Harvard Business Review
  "art of paltering" by Rogers, Zeckhauser, Gino, Norton). Paltering is a good injection
  — moderately known.

  - "Shengjing case"? No.

  - Scalar implicature cases: "some of my friends smoke" when all do — true assertion,
  misleading implicature.

  - Broadcaster/professional context: lawyer misleading court — officers of court.


  Decision tree structure: root question — what makes lying wrong? Branch: (a) breach
  of assertoric norms (assertion of believed-false), (b) intentional deception, (c)
  only bad consequences, (d) breach of any cooperative norm including implicatures.


  Leaves:

  1. Assertion-norm view: lying per se worse (Chisholm & Feehan, Carson, Kupfer tradition).

  2. Kantian: lying categorically forbidden, misleading permissible — but actually
  the tree should derive this from "lying wrong because incompatible with respect
  owed regardless of consequences" plus "misleading doesn''t violate categorical norm."

  3. Deception-intent view: no intrinsic moral difference — both aim at false belief;
  lying has no special wrong (Sissela Bok-ish? Bok actually thinks lying defined as
  intentional deception? Bok''s definition: lying is "any message which is intended
  to deceive" — she doesn''t draw sharp line).

  4. Consequentialist: difference only instrumentally (lying usually easier to detect,
  worse when found).

  5. Misleading-worse view: misleading shifts epistemic responsibility onto hearer,
  treats them as means of self-deception — some argue misleading is more corrosive
  or "gaming" — e.g., Marsili''s "Better than lying" — but leaves where misleading
  worse: e.g., lawyer paltering.

  6. Contextual/legalist: moral difference only relative to institutional roles (perjury,
  contracts) — norm-governed practices.

  7. Deflationary: the assert/implicate distinction is linguistically real but morally
  inert; all deceptive communicative acts assessed together.


  Also: paltering cuts across: palters assert true things with deceptive intent, so
  assertion-norm views must say paltering isn''t lying; deception-intent views include
