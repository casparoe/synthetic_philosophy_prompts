  Positions on lying vs misleading moral difference:

  1. No moral difference (only consequences matter) — consequentialist flattening.

  2. Lying is worse per se because it asserts falsehood directly (violates norms of
  assertion), misleading via implicature exploits cooperative inference — defended
  by e.g. Kupfer, Carson.

  3. Misleading can be worse in special cases (shifting responsibility to hearer,
