  ---


  Write a philosophical dialogue between two philosophers who disagree about how practical
  stakes interact with knowledge.


  The characters:


  - Ada defends epistemic contextualism: she holds that the truth of an utterance
  of the form "S knows that p" depends partly on the conversational context of the
  speaker making the attribution, so the same sentence can be true as uttered by one
  speaker and false as uttered by another in a different context.

  - Ben defends subject-sensitive invariantism, a form of pragmatic encroachment:
  he holds that whether S knows that p depends on S''s own practical situation—on
  how much is at stake for S in being right about p—and not on the context of whoever
  is talking about S. On his view a knowledge attribution has a single context-invariant
  truth value.


  They discuss two cases over coffee after a colloquium:


  Case 1 (varying stakes for the subject). Mei has checked her bank''s website once
  and seen that the branch is open on Saturdays. In the low-stakes version, she and
  her partner are depositing a paycheck on Friday afternoon; if the branch were unexpectedly
  closed, they could return on Monday with no consequences. In the high-stakes version,
  a payment must clear by Sunday or their mortgage will default. In both versions
  her partner asserts, "Mei knows the bank will be open tomorrow."


  Case 2 (varying stakes for the attributor). A structural engineer, Priya, has checked
  her load-bearing calculation once and is completely confident the bridge design
