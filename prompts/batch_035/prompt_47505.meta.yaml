  The asker: retired physicist, recently reading philosophy of causation. Argument
  (from a philosophy reading group friend / from their own note):


  (1) A causal claim "C causes E" is true iff there is a possible intervention on
  C that would change E (they''ve been reading Woodward; also holds for simple counterfactual
  accounts: C causes E iff had C not occurred, E would not have).

  (2) In the actual world, deterministic laws plus the complete state of the world
  at any past time fix every later event, including any purported intervention.

  (3) So an intervention that changes C while leaving the laws and the past intact
