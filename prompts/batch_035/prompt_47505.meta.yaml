  so interventions are never exogenous in the required sense.

  (4) An interventionist might reply that interventions only need to be possible,
  not actual. But "possible" can''t mean consistent with the laws plus actual past,
  by (3); so it must mean holding fixed the laws plus some only partially specified
  past.

  (5) Which past is held fixed is arbitrary: hold fixed the state five minutes before,
  and the intervention is a miracle; hold fixed a state before the agent''s deliberation,
  and the "intervention" is just an ordinary caused event; there is no non-arbitrary
  cutoff.

  (6) So whether C causes E depends on an arbitrary choice of which background to
  hold fixed, which would make causal facts interest-relative or conventional.

  (7) But causal facts are not conventional (physicists'' causal claims about the
  early universe / textbook physics).

  (8) Therefore something is badly wrong — and the friend concludes that all causation
  talk in deterministic physics is either false or conventional.


