  I spent thirty-five years as an experimental condensed-matter physicist and, since
  retiring, have been auditing a philosophy of science reading group. We have just
  finished a term on causation, working from Hume through Lewis''s counterfactual
  analysis and Woodward''s interventionist theory, and a graduate student in the group
  has produced an argument that I cannot fault step by step, though its conclusion
