  about whether citizens have any consequentialist reason to vote by saying, as if
  it settled the matter, that no single vote has ever decided an election. Everyone
  nodded, and I nodded too, but on the walk home it occurred to me that I have no
  idea what precise claim that one-liner is actually making, and I''m not sure the
  colleague does either. Notably, this is a man who votes in every election, including
  the local ones.


  Part of my uncertainty is empirical and part is conceptual, and I can''t tell where
  the line falls. Empirically: in the 2017 Virginia House of Delegates race in the
  94th district, the recount left David Yancey and Shelly Simonds tied at 11,608 votes
  each, the seat was awarded by drawing a name from a bowl, and that drawing determined
  whether the chamber would be 51–49 or split 50–50. So in that case no single vote
  decided the election — but exactly one additional vote for either candidate would
  have, which makes me realize "decided by one vote" could mean the margin of victory
  was exactly one, or it could mean the outcome was within one vote of going the other
  way. Conceptually: the slogan could be a claim about token elections that have actually
  occurred, or a claim about the ex ante probability that a random vote in a random
  election is pivotal, or a claim about the expected causal effect of a single vote,
  and these come apart — the first can be nearly true while the second is small but
  non-negligible, and none of them obviously licenses anything normative.


