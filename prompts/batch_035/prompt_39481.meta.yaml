  we reconvene. Take the sentence "no single vote has ever decided an election" and
  lay out the distinct precise theses it could be expressing — statistical, causal,
  decision-theoretic, and normative readings, from the near-truism to the genuinely
  contentious. For each reading, say whether it is plausible, whether it is false,
  and, crucially, whether accepting it would actually support the use my colleague
  put it to, namely dismissing consequentialist reasons for individual turnout. And
  since the slogan gets used as if it ends the argument rather than starting one,
  please also flag which reading he would need for that, and whether that reading
  survives contact with cases like the Virginia tie. I''d rather have the full menu
  than the one item he served.


