  I''ve become stuck on the procreation asymmetry: the claim that it is wrong to bring
  into existence a person whose life will be worse than never existing, while there
  is no corresponding reason to bring into existence a person whose life will be happy.
  The claim feels obviously right to me, and I''ve constructed an argument for it
