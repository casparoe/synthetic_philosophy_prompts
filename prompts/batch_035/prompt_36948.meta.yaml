  I present it in print I need to know where it goes wrong — or what it costs if it
  doesn''t.


  The argument runs as follows. (1) An act can be wrong only if it wrongs someone:
  only if there is a person for whom it makes things worse than some available alternative
  would have. (2) Creating a person whose life will be worse than never existing wrongs
  that person, since their life is worse for them than the alternative of never existing.
  (3) Creating a person whose life will be well worth living wrongs no one — they
  are not worse off than never existing — and it benefits no one either, since the
  person who is never created is not around to be deprived of anything. (4) So creating
  a miserable person has a wrong-making feature with no counterpart in creating a
  happy one, and by parity of reasoning there is no benefit-making feature in the
  happy case either. (5) An act with a wrong-making feature and no compensating benefit
  is pro tanto wrong; an act with neither is a matter of indifference. (6) Therefore
  creating the miserable is pro tanto wrong, and creating the happy is not pro tanto
  good: the asymmetry.


