  \ I think rationality requires preferences to be consistent over time / no dynamic\
  \ inconsistency; (4) I reject the idea that regret should count as an outcome; (5)\
  \ I think people who take insurance are being rational. Hmm, tensions: (1)+(2) violate\
  \ independence; (4) removes the standard rescue; ... That's a decent commitments\
  \ prompt. But the prove-too-much type seems livelier and lets me inject a niche-ish\
  \ constructed argument.\n\nActually, let me reconsider: maybe combine \"Is beauty\
  \ objective? Hume's standard of taste\" with the commitments type — non-academic\
  \ thinking about taste. A person who holds: some judgments of taste are just better\
  \ than others (there's a fact about whether a wine or a song is good); beauty isn't\
