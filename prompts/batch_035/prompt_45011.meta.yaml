  \nStandard Allais: \nOption A: $1M certain.\nOption B: 89% $1M, 10% $5M, 1% $0.\n\
  Option C: 11% $1M, 89% $0.\nOption D: 10% $5M, 90% $0.\n\nA vs B: most take A. C\
