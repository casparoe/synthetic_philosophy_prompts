  \ the commitments would need to be somewhat novel to be in the weeds. Allais + independence:\
  \ the money-pump subtlety (sure loss vs opportunity loss) and outcome individuation\
  \ are somewhat in the weeds.\n\nFish and crustacean welfare: commitments type —\
  \ someone holds: (1) I think lobsters probably feel something; (2) I eat shrimp;\
  \ (3) I think moral status depends on capacity for suffering not species; (4) I'd\
  \ never accept a dog being boiled alive; (5) I think the sheer numbers... Actually\
  \ a nice tension: \"moral weight scales with number of individuals\" + \"I don't\
  \ think I'm obligated to spend my life on it\" — parallel to the seminar example.\
  \ Might be too similar to example 2.\n\nI'll go with Allais + prove-too-much. Write\
  \ from a non-academic perspective, casual, American English, a typo or two.\n\n\
  Draft the argument:\n\nMy brother-in-law is a stats guy and he thinks he's got me\
