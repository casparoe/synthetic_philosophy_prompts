  Argument sketch:

  My flatmate (a philosophy postgrad) argues that promises can''t bind:


  1. When you promise to do X, the utterance creates an obligation: you now ought
  to do X, where before you were free.

  2. To create an obligation is to change the normative situation — to impose a requirement
  on someone.

  3) Nobody can impose a requirement on another person without that person''s consent
  (consent principle) — otherwise normativity would be conjured from nothing, like
  creating a debt by waving a wand.

  4) When I promise, the person imposed upon is me — specifically, my future self.

  5) My present self''s utterance is not my future self''s consent; the future self
  didn''t utter anything and might sincerely resent being bound.

  6) So promising is either (a) impossible, (b) creates no obligation, or (c) violates
  the consent principle.

  7) The same holds, mutatis mutandis, for contracts, treaties, oaths of office, and
  even consent itself — the utterance "I consent" is likewise just a present noise
  that binds a future self...

  8) Therefore no performative utterance ever creates an obligation — everything from
  marriage vows to signing a lease is normatively empty. Speech is just breath.


