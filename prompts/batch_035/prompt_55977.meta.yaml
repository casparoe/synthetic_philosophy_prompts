  testimony that panned out, but almost all of my past testimonial successes are things
  I only know through... testimony. My memory of being told X, my belief that the
  newspaper is reliable, all of that came in through the pipe. Does that make the
  reduction circular, and if so, is that a fatal circularity or the benign kind (like
