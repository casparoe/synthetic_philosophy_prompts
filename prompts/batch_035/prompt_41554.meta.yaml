  My reading group has spent this term on Adam Smith''s views on empire, and for our
  last session we''re playing a forecasting game: take a policy Smith never faced
  and predict his verdict from his track record alone. I''d like your help with the
  round I have to present.


  Here is the track record we reconstructed from the Wealth of Nations. First, he
  condemned the exclusive monopoly of the colonial trade outright: a scheme that raises
  profits for a small group of merchants while taxing the home consumer and misallocating
  the empire''s capital. Second, and against that, he endorsed the Navigation Acts,
  a comparable interference with trade, on the ground that a strong navy is worth
  some loss of wealth — defense, he insisted, is worth more than opulence. Third,
  he held that the colonies cost Britain far more than they return, and concluded
  that only two resolutions were coherent: either admit the colonists to parliamentary
  representation with taxes proportioned to their wealth, or renounce dominion over
  them altogether. Fourth, he judged government by a chartered company of merchants
  to be about the worst form of government there is, since a merchant entrusted with
  sovereign power will manage the public interest in his own. Fifth, he admired settler
  colonies in thinly peopled lands, crediting their rapid growth to cheap land and
  their own liberty rather than to any advantage of the imperial connection.


  The new case, invented for the game: suppose that in the early 1780s a scheme is
  proposed under which the Crown auctions to a consortium of merchants the exclusive
  right to trade with the remaining colonies, and the consortium, in exchange, assumes
  the entire cost of defending and administering them. The colonists keep their assemblies,
  Britain sheds the expense, and the monopoly survives.


