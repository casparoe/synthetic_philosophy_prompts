  I sit on a parliamentary select committee charged with reorganizing the nation''s
  trade and government arrangements after the recent war. My colleagues and I have
  agreed to take as our framework the verdicts Adam Smith delivered in The Wealth
  of Nations (1776), and it falls to me to draft our recommendation on a new proposal.
  Before I do, I want to predict what verdict our framework would dictate, so I set
  out below the verdicts Smith actually delivered on earlier cases, and then the new
  case.


  His earlier verdicts, as we have compiled them:


  1. The monopoly of the colony trade. English merchants and manufacturers enjoyed
  a monopoly over trade with the colonies. Smith''s verdict: a plain loss to Britain.
  He held that the arrangement transferred wealth from the many to the merchants,
  distorted capital away from its natural employments, and would have been rejected
  out of hand by a legislature guided by the interest of the whole, were it not for
  the merchants'' influence.

  2. The Navigation Acts. These also restricted trade, giving English ships and mariners
  a monopoly in the carrying trade to and from the colonies, and on strict commercial
  principles they resemble case 1. Yet Smith approved of them. His ground was that
  they favour the growth of English shipping, and shipping is the nursery of naval
  power; and he reasoned that where free trade and defence conflict, defence must
  win, expressing the point to the effect that defence is of far more importance than
  opulence. He even suggested this was the single case where a restraint of trade
  could be justified.

  3. The East India Company. A chartered company held the exclusive trade with the
  East Indies and, as a consequence of its charter, governed Bengal. Smith''s verdict:
  scathing. He judged company rule to be, in effect, the worst of all governments
  for any country, and he thought it absurd that a body of merchants whose business
  is to buy and sell should also be sovereigns. Yet he was pessimistic that direct
  administration from London would do much better, given the distance.

  4. The American crisis. Parliament taxed the colonies without giving them representation.
  Smith''s verdict: Britain must either grant the colonies seats in Parliament in
  proportion to their contribution to public revenue, or voluntarily give up all authority
  over them; and he predicted that Britain would refuse both and lose the colonies
  by force, which he regarded as the foolish option.


  The new case: a joint-stock company has petitioned for the exclusive right to trade
  with, and the government of, a group of islands acquired from Spain in the late
  war. The petitioners argue that only a company assured of monopoly profits could
  afford the forts, garrisons, and convoys needed to hold the islands against France
  and Spain, that the expense would exceed any revenue an open trade could yield,
  and that under company administration the islands would at least be governed by
  men with a direct interest in their prosperity, as Bengal was said to be. No one
  proposes representation for the islanders in Parliament.


  Questions: Predict Smith''s verdict on the new case. Which of the rules his track
  record is consistent with — the priority of the system of natural liberty, the defence
  exception that licensed the Navigation Acts, his verdicts about company government
  and about government at a distance, or the representation-or-relinquishment principle
