  had been willing to actively harm. Constraints that look noble one at a time look
  terrible in the aggregate, and it feels like the deontologist either has to say
  "tough, the extra harm is not my doing" or quietly start counting other people''s
  harms, which was the thing she refused to do.


  Here''s what I want: a game with real (fake-money/points) payoffs where students
  are individually placed in the position of an agent who can either (a) press a button
  that actively docks everyone a small number of points but cancels a much bigger
  loss, or (b) sit tight, in which case the bigger loss happens unless someone else
  presses. Deontologists sit; consequentialists press; the interesting rounds are
  where nobody presses and everyone eats the big loss, and the rounds where one "consequentialist"
