  named Kripke) each of us couldn''t have come from a different sperm and egg — if
  a different embryo had been implanted, Mia would simply never have existed, and
  some other child would be sitting in that high chair. So the frozen embryos weren''t
  ''Mia''s siblings who lost out'' and there was no possible world where they get
  born and Mia also exists — choosing embryo #2 wasn''t choosing one child over another.


  My sister pushed back hard. She said the cousin''s view makes genetics do all the
  work of identity, but she''s quite sure Mia could have been adopted at birth by
  a family in another country, raised speaking Portuguese, with totally different
  values and memories, and still be Mia — same origin, radically different life. So
  ''origin'' clearly isn''t essential to everything about her; it''s just essential
  to her body''s recipe. Why, she asked, should the recipe be the essence rather than
  the psychology? The cousin answered that origins are what individuate: a table built
  from a different tree just is a different table, and a person grown from a different
  zygote is a different person — upbringing differs by degree, origin differs in kind.
  Then my sister, who''d been reading around, landed what she thought was a killer
  point: identical twins come from the *same* zygote, which splits — so if a person
  just is the zygote they came from, one zygote would be two people. The zygote must
