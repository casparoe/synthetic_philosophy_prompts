  ---


  I edit a small web journal on formal models of fairness, and for an upcoming issue
  on bargaining theory I want to run a diagnostic quiz titled something like "Which
  bargaining solution do you actually accept?" The idea is that readers who have taken
  a bit of game theory all know the labels — Nash, Kalai–Smorodinsky, egalitarian,
  utilitarian — but typically haven''t noticed which axioms they are and aren''t willing
  to give up, and I want to sort them by their commitments rather than their sympathies.
  The setting for every question should be the standard two-person bargaining problem:
  a convex feasible set of utility pairs, a disagreement point, and utility assumed
  only up to positive affine transformation unless a question explicitly grants interpersonal
  comparability.


  Please draft eight to ten questions, each a concrete case on which the solutions
  genuinely come apart, with two or three answer options apiece and a scoring key
  mapping answer patterns onto the positions. To give you the flavor of what I mean
  by a concrete case: a question where enlarging the feasible set so that only one
  bargainer''s best possible outcome improves would leave that bargainer''s assigned
  payoff unchanged or lower under the Nash product but never lower under Kalai–Smorodinsky''s
  individual monotonicity, phrased as a story about, say, two musicians renegotiating
  their split of gig fees after one of them gains access to a better-paying market
  they still can''t afford to enter. Alongside the plain cases, include at least one
  question about whether the disagreement point itself should influence the outcome
  at all — two otherwise identical negotiations where one party could credibly walk
  away to a worse but survivable outside option — since I''ve noticed readers split
  on that in ways that don''t track their favorite solution, and at least one about
  symmetry: whether bargainers in a fully symmetric feasible set must receive equal
  payoffs. Cover the standard axioms where they bite: Pareto efficiency, symmetry,
  invariance to affine transformations, independence of irrelevant alternatives, and
  individual monotonicity.


  The scoring key should map each combination of answers to one of the four solutions
  above where possible, and flag the combinations that don''t cleanly correspond to
  any of them — for instance, readers who demand both individual monotonicity and
  independence of irrelevant alternatives, or who refuse symmetry — with a sentence
  or two on whether that combination is unattractive, incoherent, or just underexplored
  (there are further solutions in the literature, and you can name one or two in the
  key if you''re confident they fit). Also flag explicitly any pair of solutions the
  quiz cannot reliably separate. The audience is readers with one game theory course
  behind them, so state everything in plain case-based terms inside the questions
  themselves and confine technical machinery to the scoring key.


