  Details to seed:

  - Bargaining problem: two players, feasible set of utility pairs, disagreement point.

  - Nash solution: maximizes product of utility gains; characterized by Pareto efficiency,
  symmetry, invariance to affine transformations, independence of irrelevant alternatives
  (IIA).

  - Kalai–Smorodinsky: equalizes ratios of gains to the "ideal point" (utopia point,
  each player''s maximum possible utility); characterized by Pareto, symmetry, invariance,
  and individual monotonicity (if one player''s best possible outcome improves, that
  player shouldn''t do worse).

  - Egalitarian: equal gains.

  - Utilitarian: maximize sum.

  - Key separating axioms: IIA vs monotonicity; symmetry; the disagreement point''s
  role (Nash uses it, some argue threat point shouldn''t matter).


  Concrete cases for quiz questions:

  1. A case where expanding feasible set to give one player better potential outcomes
  makes them worse off under the solution (violates monotonicity) — Nash has this,
  KS doesn''t.

  2. IIA: removing an unavailable alternative changes the outcome — Nash violates
  monotonicity but satisfies IIA; KS violates IIA.

  3. Symmetry: asymmetric bargaining power — should the solution be symmetric in payoffs
  when feasible set is symmetric?

  4. The threat point: two otherwise identical problems where the disagreement point
  differs because one player is a better threatener — should that matter?

  5. Scale invariance: interpersonal utility comparisons — egalitarian and utilitarian
  need interpersonal comparability; Nash and KS don''t.


  Quiz audience: readers of a blog on fairness in negotiations — maybe more accessible:
  people who took a game theory course. Ask for 8-10 questions each a concrete case
  with 2-3 options, scoring key mapping patterns to Nash, Kalai–Smorodinsky, egalitarian,
  utilitarian, plus flag unoccupied combos.


