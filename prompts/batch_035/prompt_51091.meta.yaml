  The context: we want to build "mechanistic anomaly detectors" — monitors that watch
  a deployed model and flag inputs on which the model is not running the same mechanism
  it ran during training. The motivating thought is that if a model was safe on the
  training distribution because it was executing some benign procedure, then inputs
  that push it into a different procedure are exactly where our training evidence
  runs out, and we would like to catch those before the output, not after. Everyone
  in the group accepts this motivation. The disagreement is about what "the same mechanism"
  means, and it has hardened into two camps that no longer engage.


  Camp one holds that mechanism identity is a causal-pathway notion: the mechanism
  an input triggers is the subgraph of the network — the set of components and their
  interactions — that is causally responsible for the output on that input, so two
  inputs run the same mechanism when the same subgraph, traced by something like activation
  patching or path decomposition, carries the work. On this view our job is essentially
  reverse-engineering: identify the circuit on the training distribution and then
  watch for inputs where causality flows elsewhere. Camp two holds that this is a
  hopelessly strong standard — we cannot reverse-engineer frontier models in time,
  and, worse, features in real networks seem to be superposed and polysemantic, so
  "the circuit" is not cleanly delineated to begin with. They propose a statistical
  proxy: define mechanism sameness behaviorally/representationally — two inputs run
  the same mechanism if the model''s internal activations on one lie within the distribution
  learned from the other, with the detector trained on activations rather than on
  an interpreted decomposition. Camp one replies that the proxy is exactly what the
  motivation rules out: an anomaly in activation statistics can flag a merely novel-but-benign
  input and can miss a novel mechanism that happens to produce familiar-looking activations,
  so the proxy detects out-of-distribution-ness, not new mechanism. Camp two replies
  that "new mechanism" unexplained in causal terms is a phrase, not a criterion, and
  that camp one''s causal-pathway account has never been made to work on a network
  where features are superposed: if a single weight participates in many mechanisms,
  the "same subgraph" relation may simply not exist at the granularity at which it
  is being demanded. And there we sit, eighteen months in.


  My working hypothesis, offered as a hypothesis only: the camps are answering different
  questions under one heading — camp one is doing philosophy of decomposition (when
  is it true at all that a network factors into mechanisms with identity conditions?)
  and camp two is doing detection engineering under a deadline — and the fight persists
  because each camp''s standard of success is invisible to the other: camp one would
  count a worked example on a tiny network as progress, camp two would not, and camp
  two would count a detector with good precision-recall on held-out anomalies as progress,
  camp one would not. But I can also see a reading on which this is a genuine empirical
  question in disguise — whether superposition and polysemanticity are terminal facts
  about trained networks or artifacts of scale and training that cleaner models will
  not have — and a reading on which it is a verbal dispute about the word "mechanism"
  that a stipulation could dissolve.


