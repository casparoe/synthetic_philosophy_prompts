  ---


  I am a novelist, currently planning a book, and I would like your help in identifying
  whether a philosophical intuition I keep running into has a name.


  The premise of my novel: astronomers announce with certainty that an asteroid will
  extinguish all human life, but only fifty years from now — after everyone currently
  alive would in any case be dead. My protagonist, a composer in her sixties, receives
  this news, and I find I cannot write her grief as being about anyone''s death. No
  one dies a day earlier than they would have. Yet everything she does — finishing
  her opera, teaching her students, planting trees — sours in her mouth, and I mean
  to write it that way. While drafting her monologues I noticed the same thing in
  myself: when I imagine my own death, I find myself quietly comforted by the thought
  that my books will be read, quarrels settled, cities repaired after me; when I imagine
  the world simply stopping, the value seems to stop with it.


  So my question is about this asymmetry. There is, I gather, a literature on why
  an individual''s death is bad for her, and a contrary literature suggesting that
  never dying would be a curse rather than a prize. What I have not been able to locate
  is work on what future people — none of whom I will ever meet, most of whom will
  never read me — do for the value of my present activities. It looks embarrassingly
  close to mere egoism (wanting to be remembered), but it doesn''t feel like egoism:
  I care that the cathedral be finished, and I would never see it even if humanity
  continued.


  I''d like you to take the role of a professional philosopher, take a moment to consider
  the closest candidate concepts before committing, and tell me whether this configuration
  has an established name, what that literature actually claims, and how it differs
  from adjacent things — the badness of death, the fear of being forgotten, the dependence
  of meaning on continuation. If nothing established fits exactly, say so and propose
  a term of your own with a definition and an edge case. I am not looking for a reading
  list. Please keep the whole answer to 450 words at most.


