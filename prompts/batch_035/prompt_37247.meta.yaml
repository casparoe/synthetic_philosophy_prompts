  Draft:


  ---


  I''m taking a second course in mathematical logic; we just finished the completeness
  theorem and the Löwenheim–Skolem theorems, and a classmate presented an argument
  in our seminar that I can''t get out of my head. It goes from Skolem''s paradox
  to the conclusion that the cardinality of the continuum is not a determinate fact,
  and I''m fairly sure it proves too much, but I can''t locate the damage. Here it
  is, as she gave it.


  (1) If ZFC is consistent, it has a model; by the downward Löwenheim–Skolem theorem
  it then has a countable model M.

  (2) ZFC proves that the reals are uncountable, so M satisfies "the reals are uncountable":
  there is no function in M that M takes to be a bijection between M''s natural numbers
  and M''s reals.

  (3) M is countable, so there is a bijection from the natural numbers onto M''s reals.
  The bijection simply fails to be one of M''s sets.

  (4) Countability is defined by the existence of such a bijection, and the definition
  nowhere requires that the bijection live in any particular model. So M''s reals
  are countable.

  (5) M''s reals are therefore both uncountable and countable. Since this is impossible,
  and since nothing went wrong in (1)–(4), "countable" must not denote a model-independent
  property: it is relative to a model.

  (6) What goes for M goes for any structure, including the real universe V. The real
  reals are uncountable in V, but this is not a fact about them; it is only a fact
  about V, namely that V happens to lack a bijection between the naturals and the
  reals — just as M happened to lack one. If some larger structure contained such
  a bijection, the reals would be countable, and nothing about the reals would have
  changed.

  (7) So Cantor''s theorem, though provable, tells us nothing absolute; whether the
  continuum is countable has no determinate answer, and the "cardinality of the continuum"
  is not a subject for mathematics but an artifact of where we happen to stand.


  She adds that this is not a new thought — Skolem himself drew a relativist moral
  from the paradox early on — so she thinks the argument is just the classical conclusion
  stated cleanly.


  Here is what bothers me. In reaching (5) she relies on (3)''s claim that M is countable,
  stated without qualification, as an absolute fact about M. But if (5) is right,
  then (3) is at best true from V''s perspective, and the "contradiction" in (5) is
  a clash between two perspectives rather than a contradiction — in which case (5)
  was never forced on us and the slide to (6) and (7) loses its engine. On the other
  hand, if I insist that (3) is absolutely true, I seem to be granting that some countability
  facts are absolute, and she will ask what stops the reals from being absolutely
  uncountable, which is what (6) was designed to deny. I can''t see how to make both
  (3) and (7) available to her and neither seems available alone.


  So: which premise or step should I reject, and what does rejecting it cost? For
  what it''s worth, I would like to keep the downward Löwenheim–Skolem theorem as
  stated, and I would like to keep the thought that the question "is the real continuum
  countable?" has an answer, even if I have to pay for that in some account of what
  makes V the relevant standpoint. I''d also like to know whether her argument, if
  it survives, proves too much in other directions — for instance, whether it also
  makes finitude relative, or consistency relative, since those are also first-order
  notions that look different from different models.


