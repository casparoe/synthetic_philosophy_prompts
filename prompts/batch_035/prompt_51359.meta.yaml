  theory of real patterns must meet, with the motivating case behind each, and flag
  any pair you suspect cannot be jointly satisfied.


  Requirements should at least be forced to speak to the following sorts of cases,
  though I want you to decide what the full list is:


  - A pattern is detectable only by beings with specific computational limits: gliders
  in a giant run of Conway''s Game of Life are obvious at coarse grain and invisible
  at the pixel grain. Must the theory say such patterns are real, and if so, real
  relative to what?

  - Usefulness versus gerrymandering: a projection that groups stars into constellations,
  or a partition of noise into rectangles that predicts nothing a simpler projection
  wouldn''t. What separates a real pattern from a projection that just happens to
  suit our interests?

