  "Classical expected utility theory says that a rational agent chooses among gambles
  by multiplying the utility of each outcome by its probability and summing. Buchak''s
  theory was built to make room for risk-aversion, and her key innovation is to replace
  the ordinary probability weights with a ''risk function'' that downweights improbable
  good outcomes while leaving improbable bad ones at full weight. Because the risk
  function is a matter of individual taste, like a fondness for jazz, the theory ends
  up permitting any risk attitude at all: there is no longer any principled way to
  criticize someone who buys both lottery tickets and insurance. Her central evidence
  is the Allais paradox, where people systematically violate the independence axiom,
  which she takes to show that the axiom is simply false and that anyone who maximizes
  expected utility is making an error. And in the end, since the risk function can
  absorb all of a person''s cautiousness, the theory quietly reduces risk-aversion
  back to the old idea of diminishing marginal utility."


  Something about the last sentence struck me as strange, because I had the impression
  that separating risk-attitudes from the shape of the utility curve was supposed
  to be the whole point of the view. But the reviewer writes with great confidence,
  and I don''t know decision theory well enough to audit the paragraph myself.


  Could you go through it clause by clause and tell me which parts a defender of the
  theory would accept, which are defensible simplifications of the technical machinery,
  and which are genuine misrepresentations? In particular: (1) is the gloss of the
  risk function as ''downweighting improbable good outcomes'' a fair rendering, or
  does the risk function work on something other than probabilities? (2) does the
  theory really hold that any risk attitude is beyond criticism, or does it impose
  structural constraints of its own? (3) what is her actual stance on the independence
  axiom and on agents who satisfy ordinary expected utility maximization? and (4)
  does the reviewer''s final collapse-into-diminishing-marginal-utility claim follow
  from anything accurate earlier in the paragraph, or does it contradict the theory''s
  motivation? If you can, close by telling me what a corrected version of the paragraph
  would say, in about the same number of words.


