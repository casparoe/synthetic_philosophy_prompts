  ---


  I''m a third-year politics student, and this semester I''m taking a seminar on democratic
  theory that spends its back half on institutional alternatives to majority rule.
  The unit we just finished covered the proposal, sometimes called futarchy, under
  which the electorate would vote only on values, with the winning values compressed
  into a measurable national welfare metric, while markets in policy futures would
  decide which policies are expected to raise that metric, with the government bound
  to implement whatever the market prices highest. I found the idea stranger and more
  interesting than I expected, and for the course''s creative assignment I''ve chosen
  to satirize it — the design, that is, not the people who proposed it; my first draft
  kept drifting into mocking a persona, and my instructor pushed me back toward making
  the machinery itself supply the comedy.


  Could you write the piece? The form I have in mind is a government press release,
  around 700 words, issued by the Ministry of Welfare Optimization of a mid-sized
  country that has been governed this way for two decades. The occasion is the launch
  of version 4.0 of the National Welfare Metric, the number the policy markets are
  obliged to maximize, and the release doubles as an orientation insert for newly
  arrived immigrants. I''d like it to contain, roughly in order: a short history in
  which each revision of the metric is candidly dated to the moment the markets became
  suspiciously good at raising the old number without improving anyone''s life (v4.0
  is said to add such terms as measured life satisfaction, net of hospital waiting-list
  anxiety and of the despair index); a proud paragraph explaining that although the
  wealthy hold more votes than the poor, this is entirely in order, because their
  extra votes are cast only on beliefs, never on values, and the values remain sovereign
  in the hands of the people, who express them once per decade at the Values Census;
  a defense of the system''s record on long-lag policies, noting that the average
  trading position expires long before a river gets clean, so it would be irrational
  to expect traders to have priced the river at all; and a closing Q&A answering a
  citizen who complains that she voted for the river to be cleaned and the river is
  still dirty, in which the ministry explains that she voted on the value, the market
  weighed all available information, and the river-cleanup futures were simply found
  to be overpriced.


  The tone should be earnest, bureaucratic, and entirely sincere: the ministry never
  doubts itself, never winks, and treats every objection as already answered by the
  system''s own vocabulary. The jokes have to come from the actual mechanics rather
  than invented failures, so that a reader who knows the literature on futarchy recognizes
  each gag as one of the standing objections — the metric being gamed, deep pockets
  moving prices on beliefs while the values facade stays democratic, traders'' horizons
  versus decades-long payoffs, Goodhart''s law by installment — and ideally finds
  the satire fair; while a reader who has never heard of any of it should still be
  able to laugh at the voice of an institution that has quietly replaced accountability
  with liquidity.


  ---


