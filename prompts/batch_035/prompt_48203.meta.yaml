  ---


  I''m an undergraduate taking a seminar on democratic theory and institutional alternatives,
  and we''ve just finished a unit on proposals to let markets do the work of legislatures
  — the idea being that citizens vote on values (translated into a measurable national
  welfare metric) while speculative markets decide which policies will best raise
  that metric. For our creative-writing exercise I have to produce a piece of sustained
  satire, and I want to target the idea itself rather than its proponents.


  Write a press release, roughly 650 words, from the Ministry of Welfare Optimization
  of a mid-sized country that has been governed this way for about two decades. The
  occasion: the ministry is announcing version 4.0 of the National Welfare Metric
  (the number the markets are tasked with maximizing), and the release must also explain,
  for newly arrived immigrants and schoolchildren, how decisions get made. The satire
  should come from the actual mechanics, not from inventing failures: the metric is
  periodically revised after the markets have become suspiciously good at gaming the
  old one (a new release adding terms like ''measured life satisfaction, net of hospital
  waiting-list anxiety''); a passage defending the system''s record on policies whose
  payoff arrives after the average trader''s position expires; a paragraph noting,
  with pride, that the wealthy have a stronger vote than the poor but only on beliefs,
  never on values, so the arrangement is perfectly democratic; and a Q&A section answering
  a citizen who complains that she voted for the river to be cleaned and the river
  is still dirty, in which the ministry explains that she voted on the value ''clean
  rivers'' and the market, weighing all available information, found the river-clean-up
  conditional futures to be overpriced. The tone should be earnest, bureaucratic,
  and wholly sincere — the ministry never doubts itself — and a reader who knows the
  literature on futarchy should recognize each joke as a real objection (Goodhart''s
  law, manipulation by deep pockets, short horizons of traders versus long-lag policies),
  while a reader who doesn''t should still find it funny as the voice of an institution
  that has quietly replaced accountability with liquidity.


  ---


