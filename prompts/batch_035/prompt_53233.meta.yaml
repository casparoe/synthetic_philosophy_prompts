  happening. The hour after a migraine lifts: I am inclined to call it pleasure, but
  on reflection it may be nothing more than the cessation of pain — a relief rather
  than a pleasure, unless relief is a pleasure. Schadenfreude at a rival''s public
  comeuppance: it is unmistakably a pleasure in intensity and vivacity, yet I resent
  counting it as one, and I notice I wouldn''t want it included in the total if someone
  were summing the pleasures of my life. The state of being absorbed in a hard climb:
  clearly good while it lasts, yet I could not report what it felt like except by
  describing the climbing — I only notice its feel when it is interrupted. Anticipating
  a holiday: a pleasure now, before anything good has happened, though it is hard
  to say what is pleasant about it beyond picturing something pleasant. Feeling listened
  to by a friend: a pleasure, but a calm one, more like the background hum of things
  going right than like a jolt.


  Two verdicts I am confident about and cannot reconcile. First, I believe there is
  a single sensible question ''which of these two is the greater pleasure?'' — asked
  to compare the proof-click with the watermelon, I want to answer, even if unsure,
  and I would answer confidently comparing the watermelon with the migraine-aftermath.
  Second, I believe the watermelon and the proof-click share nothing at all in the
  way they feel, and that the resemblance between watermelon and back-scratch is far
  closer than either''s resemblance to anything intellectual. It seems to follow that
  if two things share nothing, there is nothing for a common quantity to measure;
  yet I cannot give up thinking the comparative question is well-formed.


  My tentative principle, offered in the spirit of trial: a pleasure is the felt process
  of some capacity of mine doing its work unhindered — the palate discriminating,
  the intellect connecting, the anticipation representing. This would explain the
  absorption case nicely (the feel of the climb is just the feel of capacities at
  work, which is why it is only felt at the edges) and would handle the relief case
  by counting it if recovery is the body doing its work. But it seems to classify
  the schadenfreude as a full pleasure — some capacity of mine is working just fine
