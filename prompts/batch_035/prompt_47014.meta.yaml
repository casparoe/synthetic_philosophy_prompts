  Four months into parenthood and running on a fraction of my usual sleep, I have
  noticed something about my own behavior that I would like help identifying. When
  a routine of mine is interrupted partway through, I do not resume at the point of
  interruption; I restart the sequence from the beginning, and I complete steps whose
  purpose has already evaporated. If I am halfway through the bottle-feeding routine
  — sterilize, prepare, warm, feed — and my partner tells me she has just fed the
  baby, I nevertheless find myself sterilizing and preparing a full bottle before
  I catch myself. When a question interrupts me between locking the front door and
  pocketing my keys, keys in hand, I go back and re-lock the door. Filling the weekly
  pill organizer, interrupted on Wednesday, I will tip everything back into the bottle
  and start again from Monday.


  Three features make this feel like one phenomenon rather than several: the sequence,
  once triggered, runs to completion regardless of whether its goal still stands;
  interruption does not pause it but resets it to its start; and it is not unconscious
  — I am attending throughout and can correctly say, in the abstract, what I am doing,
  just not why I am doing it given the circumstances. I half-remember an old anecdote,
  source forgotten, about a wasp that drags prey to its burrow, pops in to inspect,
  and if you keep nudging the prey a few inches away will drag it back and inspect
  again, indefinitely; on four hours of sleep I suspect the difference between the
  wasp and me is smaller than I would like.


  Does this configuration have an established name? The nearest things I can name
  don''t fit. Habit or autopilot suggests attention is elsewhere, and mine isn''t.
  Compulsion suggests the behavior is unwanted, and mine isn''t until I notice it.
  Perseveration, as I understand it, is being stuck on one response, not re-running
  a structured procedure from its start. So: is there a term for trigger-bound, goal-blind
  sequence completion with the agent''s knowledge intact but causally idle? And is
  restarting from the beginning a defect, or a feature — a cheap way of making a procedure
  robust to interruption, worth the wasted steps?


  Then the part that genuinely keeps me up (insofar as the baby allows): the reason-responsive,
  flexible version of me seems to be a thin layer that fatigue peels off to reveal
  a stack of procedures. If most of daily behavior is like that, what happens to the
  idea that our actions are free? Is there a literature connecting this kind of mechanical
  rigidity to free will, and does it conclude that the rigidity undermines freedom,
  or that freedom just is the evolved capacity to climb out of it?


