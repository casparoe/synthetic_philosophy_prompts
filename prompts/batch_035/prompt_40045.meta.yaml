  "In the teletransporter case, a machine on Earth scans and records every detail
  of my brain and body and then destroys me, while a replicator on Mars builds an
  exact Replica of me, with all my memories, personality and intentions. Parfit accepts
  that this counts as survival: the Replica is me, and teletransportation is just
  an unusual way of travelling. In the Branch-Line variant, the scanner fails to destroy
  the original, who lives on for a few days before dying, while the Replica on Mars
  wakes up as planned. Since there is an unbroken chain of overlapping psychological
  links between me now and the Replica in both cases, I survive in the Branch-Line
  case too, because psychological continuity is preserved. Parfit holds that a person
  is nothing over and above a body and a series of interrelated mental events; this
  is his reductionism. But he also believes that when continuity holds, there is a
  further fact of identity over and above the psychological facts — a deep fact that
  makes the later person literally me. Still, he says personal identity is not what
  matters: what matters is psychological continuity. In old age, direct psychological
  connectedness fades, but identity persists via continuity, and Parfit concludes
  that we have less reason to care about our future selves the more connectedness
  fades. So in both teletransporter cases we should be about as concerned for the
  Replica as for our ordinary future self."


