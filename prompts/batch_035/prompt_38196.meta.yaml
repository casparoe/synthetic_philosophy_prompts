  ---


  I''m a novelist, mostly historical fiction, and I''m deep into planning a multi-generational
  book set in a port town over about 150 years. Here''s what''s bugging me. My agent,
  my editors, workshop friends, and honestly every craft book I''ve read all push
  the same thing: history in fiction has to enter through individual people making
  decisions in particular scenes. The genre conventions basically force it — no reader
  wants 60 pages on the silting of a harbor or shifts in rainfall patterns unless
  it''s dramatized through somebody''s eyes, so the geology and the climate end up
  as painted backdrop while the plot runs on smugglers and an arranged marriage and
  a cholera outbreak. But the book I actually want to write is one where the biggest
  "causes" are slow stuff: the harbor silting up, the wheat belt moving, inheritance
  law, a three-century change in who controls trade routes. Every time I try to make
  an individual character''s choice carry real causal weight, it feels fake to me,
  like a bow drawn on top of a structure.


  I''ve been reading around and I gather there''s a French historian — Braudel, of
  the Annales school? — who split time into scales: the fast time of events and individuals,
  a middle time of economic and social cycles, and a nearly motionless time of geography
  and climate, and who basically thought the fast layer was the least explanatory,
  just foam on the tides. So here''s my question: what view of historical causation
  does my genre actually presuppose? Historical fiction, as practiced, seems to quietly
  commit to something like the opposite of Braudel — that history is made by choices,
  that individuals are where causes live, that a reader''s sympathy is itself a claim
  about what matters. Is that right? Is it a real commitment or just a marketing constraint
  (readers need a face) that''s compatible with a longue-durée view of what''s actually
  driving things? Can you reconstruct what the conventions of the genre imply about
  how history works, say whether the different conventions presuppose consistent things
  (e.g., the "swept up in history" trope where individuals are powerless vs. the "one
  decision changed everything" trope where they''re decisive), and then tell me what
  would have to change in the form of a novel if a writer really took Braudel''s picture
  seriously — what does a book look like where the slow structures are the protagonist,
  if that''s even still a novel and not something else?


  Also, please answer in American English (my last publisher''s copyeditor is British
  and it was a whole thing, don''t ask).


