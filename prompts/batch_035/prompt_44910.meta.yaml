  to the same conditions it advertises, so that if the company''s authorized signatory
  was never authorized, the warranty never existed and no one owes anyone anything.
  End with an FAQ in which a customer asks whether they can return a wedding and the
  answer turns on whether the marriage was void or merely unhappy, and the reader
  sees, without being told, that illocutionary force is not the kind of thing a warranty
  can cover — not because the company is scurrilous but because it isn''t a commodity.


  Sustained irony: no winking, no all-caps "THIS IS A SATIRE," no jokes about lawyers.
  The piece should be fair to Austin — exaggerating the real tension between conventional
  force and consumer goods, not inventing features of the theory.


