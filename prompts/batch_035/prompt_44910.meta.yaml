  The humor must come from getting J. L. Austin''s How to Do Things with Words right,
  so that someone who knows the lecture course laughs rather than winces, while someone
  who doesn''t still finds it readable as a warranty absurdly mismatched to its product.
  Specifically, the fine print should quietly sort Austin''s felicity failures into
  the categories a warranty department would need:


  - misfires, where the act never happened (vows pronounced by an unauthorized officiant,
  or the procedure botched — the "I do" interrupted), treated as defects in workmanship
  and fully covered;

  - abuses, where the act happened but was hollow — the insincere apology, the promise
  made without intent — and here the company must take the Austinian line that a hollow
  performative is still a performed act, so these are excluded from coverage: "sincerity
  voids nothing," a dissatisfied customer is not an unmarried one;

  - perlocutionary failures, where the act succeeded but the effects didn''t follow
  — the apology in order, the forgiveness not secured — covered, if at all, only by
  a separate, much weaker warranty, since securing effects on feelings was never in
  the locution.


  Other clauses should similarly play the theory straight: a warning that utterances
