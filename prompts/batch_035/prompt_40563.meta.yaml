  "a pop-sociology book about coordination and tech standards" that summarizes Lewis.
  Subtle misrepresentations:


  1. Conventions are solutions to coordination problems where everyone prefers to
  conform given others do — accurate.

  2. Misrepresentation: "Lewis''s conventions require common knowledge, which means
  everyone must have actually met and agreed, so conventions are basically tacit contracts"
  — conflates common knowledge with explicit agreement. Common knowledge doesn''t
  require agreement.

  3. Misrepresentation: salience — the book says "Lewis admitted salience is needed
  but his account is purely rational-choice, so he had nothing to say about how conventions
  get started — for Lewis a convention just appears fully formed." Actually Lewis
  discusses precedence ( focal points, analogy) and the role of salience in breaking
  symmetry; he doesn''t say nothing about origin. Overstated.

  4. Misrepresentation: arbitrariness — "arbitrary means any convention is as good
  as any other, so Lewis can''t explain why some conventions stick around and others
  die." Actually arbitrariness means there are multiple equally good equilibria, not
  that all are equal; also precedence generates conformity cascades.

  5. Also could say "Lewis defined convention so that only humans with language can
  have conventions, which makes it circular" — actually Lewis''s account of convention
  requires common knowledge which he analyzes via signals... there''s a known worry
