  things while being in identical mental states. Putnam also used this to show that
  experts fix meaning for the rest of us — like how I can mean ''elm'' even though
  I couldn''t tell an elm from a beech, because when I say it I defer to botanists.
  Basically the whole argument proved that mental content is outside the head, so
