  in what an idealized version of you would choose.


  But the more I chew on it, the more I think ''you''d agree if you really thought
  it through'' is several very different claims wearing one sentence. It could be
  an empirical prediction (that I, continuing to think, will in fact come around)
  — which for all she knows is false, plenty of people think it through and stay childfree.
  Or it could be a definition — that wanting kids is what a rational agent wants,
  so by stipulation anyone who doesn''t want them just hasn''t ''really'' thought
  it through — which feels circular and makes the sentence unfalsifiable. Or it could
  be a counterfactual about a version of me that knows everything, is perfectly calm,
  etc., and whether *that* person''s preferences have any authority over me now depends
