  framed. Avoid.

  - Rural/urban values — could do verdicts on cases, but cases would be about lifestyle
  judgments; harder to make crisp.


  Best: precautionary principle + case verdicts from a software engineer''s perspective.
  Concrete cases: the engineer gives verdicts on when precaution is warranted: deploying
  a new database migration at work, GMO golden rice, nuclear power vs. coal, geoengineering,
  banning a new food additive after a weak study, precaution applied to AI systems,
  etc. There''s a known tension: people who invoke precaution against new tech but
  ignore ongoing harms of status quo (risk-risk tradeoffs, Sunstein''s point). Cases
  can create a genuine tension: e.g., strict about novel tech but lenient about familiar
  risks.


  Alternatively democratic backsliding + verdicts: cases like Poland''s judicial reforms,
  Hungary''s media authority, US court expansion, voter ID, Turkey''s referendum,
  filibuster abolition, state-level election certification changes. The tension: partisan
  asymmetry — the asker counts aggressive moves by the other side as backsliding but
  similar moves by their own side as normal politics. That''s juicy but might be too
  politically loaded; still it''s a listed domain. The prompt-writing instruction
  says meaningful for a model without web access — cases should be well-known.


  I think the precautionary principle + cases is cleanest and most "in the weeds"
  via injecting novel-ish framings (a work analogy, a new case). Let me draft.


  Persona: software engineer, no formal philosophy background, formal/polished, relatively
  short, American English requested.


  Cases (verdicts), designed with tensions:

  1. We held back a release because a rare race condition might corrupt user data,
  even though the odds were small and the fix shipped a month later — right call.

  2. But we shipped a rewrite that deprecated a stable system, taking on large known
