  the apparent vs. genuine tension... actually it''s a genuine tension that needs
  a principle distinguishing. Or make it the hard-to-reconcile pair.

  6. Geoengineering (solar radiation management): thinks we shouldn''t do large-scale
  deployment now — precaution applies even though climate change itself is ongoing
  harm. Tension with 3/4 again.

  7. A weak epidemiological study linking a food additive to cancer: thinks banning
  immediately "to be safe" is wrong — proportionality to evidence quality.

  8. Personal: won''t install a smart lock on his house over hacking fears, but drives
  a motorcycle? Maybe too cute. Could include: uses old unpatched software? Hmm.


  The tension structure: verdicts 1 (precaution at work) and 5 (drug approval) vs.
