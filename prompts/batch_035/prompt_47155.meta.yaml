  Good fits:

  - Democratic backsliding + verdicts-on-cases: "Is this case backsliding?" — e.g.,
  court packing, gerrymandering, media council in Hungary, etc. That works well and
  is in the weeds.

  - Precautionary principle + verdicts on cases: natural for a software engineer (deploying
  AI systems? but avoid AI bias... actually fine). Cases: GMOs, nuclear, geoengineering,
  AI deployment, fluoride, thalidomide... A software engineer could plausibly hold
