  ---


  I teach an introductory course in philosophy of mind, and we are about to reach
  the knowledge argument. Rather than relying on the papers alone, I plan to screen
  Gary Ross''s Pleasantville (1998) and let it carry some of the argumentative weight,
  but I want a reading worked out in advance so that I know whether the film clarifies
  Jackson or subtly substitutes a different thesis for his.


  The obvious mapping first: the town is Mary''s black-and-white room scaled up to
  a civilization. Nothing unplanned can happen — fire cannot be started, the fire
  department has only ever rescued cats from trees, every road loops back into town,
  the library''s books are blank until someone supplies their contents. Then experience
  arrives from outside, and color arrives with it. So far, so Jacksonian.


  But the disanalogies are where I need help. In the film, color is never triggered
  by mere perceptual exposure; it arrives with the acquisition of capacities and concerns
  — sexual passion, a love of literature, existential unease at one''s own routine,
  courage in defense of another, even, in the mayor''s case, rage and shame. That
  looks less like gaining a new piece of knowledge-that and more like what the ability
  hypothesis of Lewis and Nemirow describes: knowing-what-it-is-like as a cluster
  of abilities... etc. And the film goes further: the epistemic gain is immediately
  registered as a social and moral identity — the newly "colored" citizens are segregated,
  banned from public venues, put on trial. Jackson never claimed that Mary acquires
  moral standing when she leaves the room. Is the film running a third thesis the
  literature lacks — that phenomenal knowledge is treated by others as a credential
  — and is that an insight or a confusion?


  I would like:

  (1) a scene-by-scene account of which moments best dramatize each position in the
  debate (Betty Parker''s bathtub scene; Bill Johnson''s crisis over the repetitiveness
  of his own routine; David remaining black and white after he begins the romance
  he already understands best; Big Bob''s colorization through anger — a problem,
  surely, for any reading on which color tracks virtue);

  (2) a verdict on whether the film, taken as a whole, vindicates the pre-recantation
  Jackson, the ability theorists, or neither;

  (3) an honest statement of where the film resists the reading — above all, the worry
  that it conflates lacking experience of certain properties with lacking phenomenal
  consciousness altogether, which is precisely not Mary''s situation, since Mary is
  a master of color science while the townspeople cannot even conceive of the questions.


  And finally: does the film dramatize something the papers cannot? Students who struggle
  with the intuition that Mary learns something often get it instantly when they watch...


  ---


