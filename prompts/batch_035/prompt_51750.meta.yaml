  principles and then testing each one against my cases.


  Here are my verdicts:


  - When I stub my toe, my introspective report that I''m in pain is about as certain
  as anything I know. Trustworthy.

  - Before a big test I can tell I''m anxious by looking inward — racing thoughts,
  dread. Trustworthy.

  - But here''s one that bugs me: last week I only realized I was angry at my brother
  when I noticed I''d been gripping my pen hard. Before I noticed the grip, introspection
  told me I was calm. Does that mean the anger was there and introspection missed
  it, or that the noticing-the-grip was itself the moment I became angry? I lean toward:
  introspection missed it.

  - When I picked my schedule, I said (and believed) I chose AP Chemistry because
  I love chemistry, but my transcript shows I picked classes with my friends every
  time. I now distrust that introspected reason.

  - I once read about an experiment where people are shown two faces, asked which
  is more attractive, and then handed the one they rejected with an explanation of
  why they chose it — and many people don''t notice and happily explain the choice
  they never made. Assuming that''s real, my verdict is that the subjects'' introspected
  reasons were confabulations, even though they felt confident.

  - Placebos: if a sugar pill takes away my headache, and I feel the relief, my introspection
  that the pain is gone is trustworthy — even if my belief that the pill caused it
  is not.

  - Empathy gap: when I''m full after lunch I genuinely introspect that I''ll skip
  dessert tonight, and when I''m hungry at 9pm I genuinely introspect that I meant
  to skip it. Both reports feel equally honest, yet they can''t both guide me. I trust
  each one while it''s happening but neither for prediction.


  The hard one: my introspection of my reason for taking AP Chem felt just as immediate
  and confident as my introspection of the pain in my stubbed toe — yet I trust one
  and not the other. And my anger only showed up via my body, yet I''d normally say
  feelings are exactly the thing introspection is best at.


  So my questions for you: Is there a single principle that saves all of these verdicts
  — maybe something about what kind of mental states introspection is good at (sensations
  vs. motives?) or when it''s good at them? If a simple principle can''t save them
  all, which verdicts should I give up? And then apply the winning principle to the
  case I keep going back and forth on: tonight I introspect that I want to go to the
  party on Saturday, but a voice says I only want to say yes so my friends won''t
  stop inviting me. On your principle, should I trust the first report, the second,
  or neither?


