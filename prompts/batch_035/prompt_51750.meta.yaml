  I''m a high school junior working on an extended essay about whether we can trust
  introspection — that is, whether we really know our own minds by looking inward.
  I''ve been keeping a list of cases where my gut says introspection is trustworthy
  and cases where it isn''t, and I''d like you to act as a professional philosopher
  of mind and help me find the principle behind my verdicts, if there is one. Please
