  goes wrong (small samples look like they confirm anything; groups conflating procedures),
  and which feature of the paradox the activity can''t reproduce (continuum of parameterizations;
  the normative question of which indifference assignment is "right" can''t be settled
  by experiment since each procedure genuinely yields its own answer — the physical
  experiment doesn''t arbitrate the principle, it only shows the descriptions underdetermine
  the procedure).


  Make it polished, moderately formal, a few sentences to a short paragraph or two.
