reasoning_summary: 'Let me pick a domain and type. Classroom activity for Bertrand''s
  paradox and principle of indifference seems great — a game where participants run
  into the need for a normalization and get different answers from different "natural"
  parameterizations. That''s a formal domain lending itself to a game with payoffs.


  Design: a seminar or intro stats/philosophy of probability class, ~15-20 students,
  75-90 minutes. Activity: split into groups, each given a different but equally "natural"
  randomization procedure for drawing a chord on a circle (random endpoints, random
  midpoint from uniform disk, random point on radius... maybe don''t reveal which).
  Actually to make them feel the force: have them physically generate chords by different
  procedures (spinning pointers, dropping straws/dots onto a poster of a circle),
  estimate probability chord longer than side of inscribed equilateral triangle (1/3,
  1/2, 1/4). Then apply principle of indifference at the level of "the chord is random"
  and watch groups disagree. The debrief maps onto the principle of indifference:
  indifference over what? Infinite families of partitions each look equally natural;
  indifference is partition-relative.


  Alternatively, the "heterogeneity problem for hedonism" with a staged activity —
  harder. Bertrand''s paradox + classroom game is clearly the best fit.


  Write the prompt: instructor teaching intro philosophy of probability / decision
