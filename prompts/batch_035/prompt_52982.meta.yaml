  Prompt draft (rank type, functionalism/MR):


  "Question about multiple realizability. Everyone cites it as the reason functionalism
  beat type-identity theory, but over the years I''ve collected a bunch of objections
  to MR itself and I can''t tell which of these actually bite. Can you rank them from
  most to least serious, and say briefly why each lands where it does?


  1. The neuroscientists-homology point: brain structures are conserved across species,
  so at the level neuroscientists actually work at, the same neural mechanisms keep
  showing up, and the supposed realizations are way more similar than MR proponents
  imply.

  2. Kim''s causal exclusion worry: if each realization does its own causal work,
  the higher-level functional property is causally idle, so MR buys you multiple realization
  of what, exactly?

  3. The ''fine-grained functions'' point: realizers only differ if you describe the
  function coarsely; once you individuate the functional role precisely enough, it
  ends up matched to one physical structure, so MR is an artifact of how coarsely
  you carved the role.

  4. The triviality worry: with a liberal enough way of counting inputs/outputs, almost
  any physical system realizes almost any function — a brick or the entire economy
  realizes ''feeling pain'' — so functionalism risks being trivially true and empty.

  5. The one I came up with and can''t evaluate: call it the ''no common cause'' worry.
  If two realizations are genuinely physiochemically different, there''s no single
  physical kind that explains why they both implement the same role, so the unity
  of the functional kind rests on nothing but our decision to describe them alike.
  MR then looks less like a discovery about minds and more like a bookkeeping convention.
  Is this just a restatement of 3 or 4, or does it add something?


