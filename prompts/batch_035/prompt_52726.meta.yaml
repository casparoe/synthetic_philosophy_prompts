  "In my bioethics course we''ve spent several weeks on the determination of death,
  and the debate over brain death seems to me to be completely stalled. On one side,
  critics led by the neurologist D. Alan Shewmon point to well-documented cases of
  patients declared brain-dead whose bodies, kept on support, survived for months
  or years, healing wounds, responding to infections, and even (in one widely discussed
  case) gestating a fetus until viability — evidence, he argues, that the brain is
  not in fact the body''s integrator, as the whole-brain rationale requires. On the
  other side, defenders of the neurological standard reply that such cases are rare,
  machine-dependent exceptions, or that ''integration of the organism'' was always
  partly a stipulation rather than a discovery. Meanwhile the practice has quietly
  moved on: organ recovery after circulatory death proceeds after only a few minutes
  of absent pulse, on a permanence standard no one thinks satisfies brain-death criteria,
  and the Uniform Law Commission''s recent attempt to revise the Uniform Determination
  of Death Act was abandoned in 2023 amid public distrust. My question is not who''s
  right but what kind of disagreement this is. Is the brain-death debate a substantive
  disagreement about the biological nature of death, a verbal dispute about the word
  ''dead'', a covert policy disagreement about organ transplantation dressed in metaphysical
  language, or a clash of bedrock intuitions that no evidence could move? Diagnose
  the structure of the disagreement using what each side actually claims, and then
  tell me what, if anything, would count as progress: new empirical findings, a conceptual
  distinction, or giving up the definitional question entirely in favor of asking
  which criteria serve which purposes."


