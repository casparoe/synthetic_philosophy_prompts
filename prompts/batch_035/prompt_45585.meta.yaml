  I am a journalist who covers science and ideas, and last month I moderated a public
  debate on the question of whether life can be meaningful without an external purpose.
  The two participants were Dr. Katharina Vogel, a historian of philosophy who works
  on the Vienna Circle, and Dr. James Marsh, a value theorist. My editor would like
  a piece on who got the better of it, and I have to admit that after transcribing
  my notes I cannot tell. I would like you to act as a professional philosopher with
  expertise in value theory and the literature on meaning in life, to think the exchange
  through carefully — beginning, perhaps, by briefly disentangling the distinct theses
  in play — and then to adjudicate it move by move.


  The exchange ran as follows.


  1. Vogel opened by presenting the view of her scholarly specialty, Moritz Schlick''s
  1927 essay on the meaning of life. As she told it, Schlick distinguished work —
  activity done as a means, its value always lying in something further down the chain
  — from play, activity that carries its value within itself and is done for its own
  sake. She added two corollaries she attributed to him: first, that meaning cannot
  be sought in any end beyond life, since any such end would itself demand a purpose,
  generating a regress; and second, that youth is not a stage of life but an attitude
  toward it, a capacity for play that can be kept or lost at any age. Her conclusion:
  life is meaningful exactly insofar as it is play, and the demand for cosmic purpose
  rests on a confusion.


  2. Marsh replied that on this account meaningful collapses into pleasant or absorbing,
  which we do not want. We distinguish a fun life from a meaningful one, and the distinction
  has substance: someone who passes the decades doing crosswords and card games is
  amused, but not, in any ordinary sense, living meaningfully; conversely, caring
  for a dying parent at three in the morning is meaningful while being about as far
  from fun as life gets. Meaning, he said, involves mattering — engagement with things
  worth engaging with — not mere self-contained enjoyment.


  3. Vogel answered that Marsh''s hard cases are covert cases of play. The good caregiver
  is not toiling toward a distant payoff; the comfort given is the point, felt as
  worth doing in its own right, even when it is exhausting and grim. That is precisely
  Schlick''s play — serious play — once you stop equating play with frivolity. If
  some of the caregiving is endured purely for the sake of the patient''s eventual
  recovery, then it is work and, by her lights, that stretch of it contributes no
  meaning to her life.


  4. Marsh countered that this rescues the theory by inflating it beyond use. If every
  activity the agent finds intrinsically worthwhile counts as play, the work/play
  contrast no longer explains anything, and the thesis reduces to the truism that
  life is meaningful when you find your activities worthwhile. Worse, it discards
  the very contrast — pleasant versus meaningful — that made the objection forceful,
  discarding our concept rather than analyzing it. And he posed a test: a nurse and
  a crossword champion are both intensely absorbed in what they do; if absorption
  is all there is to meaning, the theory is forced to rank their lives equally, which
  he took to be a reductio.


  5. Vogel''s last word was to bite the bullet and deny the reductio. The crossword
  champion''s life is meaningful — just meagerly so. Meaning comes in degrees, she
  said, measured by how richly one inhabits the present rather than deferring value
