  ---


  For most of my working life I ran a laboratory in visual and auditory psychophysics;
  since retiring I have been reading systematically in the philosophy of mind, and
  a question about my own former trade now bothers me more than any I confronted at
  the bench.


  Here is the practice that puzzles me. When my colleagues and I wanted to know when
  a subject experienced something, we asked, and recorded the answer. In temporal-order
  judgment tasks, subjects report which of two flashes came first or whether a beep
  and a flash were simultaneous, and we tabulated those reports as measurements of
  the relative timing of experience itself. That protocol appears to presuppose that
  an experience has a determinate time of occurrence — that there is, for each perceptual
  episode, a fact of the matter about when it happened, which the report more or less
  accurately discloses. Yet the same community treats a family of results as established
  in which this looks untenable. In the color phi phenomenon, a blue dot is shown,
  then a red dot some distance away; subjects report a dot moving smoothly between
  the two positions and changing color midway — changing, that is, at a moment before
  the second dot, the only possible cause of the color change, was ever shown. In
  the cutaneous rabbit, taps delivered at the wrist and elbow are felt as a regular
  sequence hopping up the forearm, including at locations never touched. In backward
  masking and the flash-lag effect, content presented later demonstrably alters what
  a subject reports about an interval already past. With such results in hand, the
  standard gloss in the literature distinguishes two ways of accommodating them, and
  the distinction is usually credited to Dennett''s discussion of color phi. On the
  first picture, the brain edits the content before the moment of experience: consciousness
  is a staged show, and the subject''s report is veridical about an experience that
  was, so to speak, doctored in advance — a revision on the model of Stalin''s show
  trials. On the second, the experience really did unfold as it initially seemed,
  and what is corrected afterwards is the record — the subject''s memory of the experience
  is overwritten, on the model of Orwell''s Ministry of Truth. Philosophers speak
  of these as the Stalinesque and Orwellian options, and Dennett''s own view, if I
  understand it, was that the choice between them is ill-posed: there is no moment
  at which the edit happens, because the temporal ordering of content-fixations is
  simply not a fact the brain''s operations respect.


  My question is about what my discipline, and the practices downstream of it, actually
  presuppose — not which picture is true. Consider three commitments in circulation.
  (1) The tabulation of temporal-order judgments appears to presuppose that experiences
  have determinate onset times — effectively the Stalinesque picture. (2) The interpretation
  of postdictive findings often treats the subject''s report as a reconstructed narrative,
  told after the fact — effectively the Orwellian picture. (3) Meanwhile, outside
  the laboratory, human-factors experts testify in accident cases about when a driver
  perceived a hazard, and engineers set the timing of collision warnings on the assumption
  that there is a fact of the matter about when a person consciously registered a
  stimulus; juries are invited to believe in timestamps of experience.


  What I would like from you is a reconstruction of the implicit theory, or theories.
  Does the practice of timestamping experience strictly presuppose that there is a
  fact of the matter about the time of an experience, or is it compatible with several
  views of the timing of experience, so that the discipline could remain agnostic
  between the Stalinesque and Orwellian pictures? Is the apparent tension between
  commitments (1) and (2) real, or can both be subsumed under a more neutral view
  — something on the model of an effective quantity in physics, defined by convention
  relative to a measurement procedure, rather than discovered? And if the discipline
  did adopt one of the two pictures outright, what would have to change: in the design
  and interpretation of temporal-order experiments, in how postdictive results are
  described, and in the forensic practice of testifying to times of perception? I
  ask partly out of curiosity and partly from a professional''s discomfort: I spent
  decades taking down numbers that I can no longer say I understood the presuppositions
  of, and I would like to know whether my younger self was doing metaphysics without
  a license, or merely applying a harmless convention.


  ---


