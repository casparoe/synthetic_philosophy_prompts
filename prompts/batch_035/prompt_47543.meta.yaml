  pain (good) and no absent pleasure worth counting (not bad). Nonexistence wins,
  or at least ties-breaks toward nonexistence. (4) Every possible life contains at
  least some pain — no one gets out stubbing a toe. (5) So it''s always better that
  any given possible person never exist, and a fortiori the empty world beats any
  populated one. So far this is basically the antinatalist line, and I could live
  with it as a consistent position I disagree with. But she then leans on the ''good
  even if there''s no subject'' clause in (2): if absent pains are goods without subjects,
  then each non-created possible person is an extra helping of subjectless good, and
