  the non-occurrence of c are evaluated via miracles that may break other laws; interventionism
  models interventions as exogenous, surgically setting X while structure of rest
  held fixed; (2) backtracking — Lewis stipulates no backtracking; interventions sort
  of build that in via independence of exogenous variables; (3) context-sensitivity
  and actual causation: HP structural-account of actual causation; (4) transitivity
  and dependence: Lewis''s chains vs interventionist systems where transitivity can
  fail (switching).


