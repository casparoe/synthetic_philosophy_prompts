  The flaw: Good''s theorem assumes the agent''s utility function is fixed and that
  only the decision depends on the information; if information itself changes utility
  (dread, anxiety) or beliefs about the future affect wellbeing independent of acts,
  the theorem doesn''t apply. Also that the agent is an expected-utility maximizer,
  and that the "experiment" is costless. Also point (5): Huntington''s test — you
  can''t condition your action to undo the knowledge; the knowledge itself is the
  harm (dread). So the equivocation: "worse off" in decision-theoretic sense (regret
  over acts) vs wellbeing. That''s a genuinely subtle flaw and prices of alternatives:
  deny (3)? Deny (2)? The interesting content: the theorem holds only for instrumental
  value relative to a fixed decision problem; information can be intrinsically bad.


