  (2) I buy the picture of a research programme having a hard core protected by convention
  plus a protective belt of auxiliary hypotheses that does the absorbing of counterexamples.


  (3) I think the unit of appraisal is the whole programme over time: it''s progressing
  when it predicts novel facts and degenerating when it only patches things after
  the fact.


  (4) But I also think the hard core is revisable in principle, and in the history
  of science the "hard core" of a programme has been quietly redefined when things
  got bad enough (Lakatos''s own escape with successor programmes...). Hmm, actually
