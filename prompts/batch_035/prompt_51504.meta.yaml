  I''m applying for a one-year dissertation fellowship and need a two-page proposal.
  My half-formed idea concerns the so-called measurability critique of effective altruism:
  the complaint that EA systematically favors interventions whose effects can be measured
  (deworming, bed nets) over structural or institutional change whose effects cannot,
  because only the former fit into cost-effectiveness estimates. The debate has stalled.
  Critics say this is a bias built into EA''s method; defenders reply that preferring
  better evidence isn''t bias but epistemic responsibility, and that ''unmeasurable''
  doesn''t mean ''better.'' I think both sides are conflating two different comparisons.
  First: within a set of similarly well-measured interventions, ranking by estimated
  effect is fine. Second: across causes, where one side''s estimates are far more
  precise than the other''s, treating both point estimates as if they carried the
  same evidential weight does something else — it lets the precision of a measurement
  masquerade as a property of the intervention. My working name for this is ''precision
  leakage.'' And I suspect a second, compounding distortion: even within well-measured
  causes, selecting the top-ranked intervention from many noisy estimates is a version
  of the winner''s curse — the winners are partly the ones whose measurement error
  happened to point upward. If that''s right, the measurability critique stops being
  a vague cultural complaint and becomes a claim about comparison procedures that
  can be stated precisely and, in principle, corrected (e.g., by shrinkage or precision-weighted
  allocation across causes).


