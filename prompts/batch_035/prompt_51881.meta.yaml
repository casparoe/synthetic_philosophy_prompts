  ---


  I teach metaphysics, and every few years I try to get a seminar excited about the
  necessity of origin, and every few years I watch the same thing happen: the debate
  goes up to a point and then just stops, and it''s been basically stopped since the
  90s. I want a diagnosis of the stall, not a rerun of the positions, and I can''t
  tell anymore whether this is a real metaphysical disagreement or something else
  wearing a metaphysical costume.


  Here''s the terrain as I''d give it to students. Kripke''s move: the very table
  in front of me couldn''t have been made from a different hunk of wood — a table
  from that other hunk would be a different table — and by extension, I couldn''t
  have come from a totally different sperm and egg. Almost everyone at the table accepts
  something in this neighborhood. Then the trouble starts, and it''s trouble on two
  flanks. First, the near-miss problem: change one base pair in the sperm, is that
  a different person? One base pair, surely not. Three billion, surely yes. Somewhere
  in between there''s no line, and both sides know it, so the Kripkeans retreat to
  the strict reading — the *exact* gametes are essential — which now looks absurdly
  rigid, since the exact gametes with a different methylation pattern or a one-minute
  delay in conception presumably still give you you. Second, the how-far-back problem:
  if the gametes are essential because you came from them, why not the grandparents''
  gametes they came from, and so on back — so you get two camps, one wanting just
  the immediate source in the essence, the other wanting the whole causal ancestry,
  and I''ve never seen a principled argument that decides between them, only temperament.


  The attempted fix was the best-candidate idea (Lewis toyed with versions of this):
  when the rival origin is close enough, the thing just is the thing from that origin
  too. Almost nobody liked it — the cutoff for ''close enough'' is arbitrary, and
  it makes identity facts look mushy in a way that drives people up the wall. And
  the alternative that sidesteps everything, counterpart theory, never really engaged:
  if you''re already fine with saying you could have had different parents because
  some counterpart did, then the Kripkean cases never had grip on you in the first
  place. So the literature just sort of drifted into bioethics, which is where I think
  the interesting stall is now.


  In the bioethics corner the fight is live but the two camps don''t even argue —
  they assume. Take mitochondrial replacement: a woman with a mitochondrial disease
  has IVF where her nuclear DNA goes into a donor egg with healthy mitochondria. Clinicians
  and a lot of ethicists describe this as the same child you would have had, just
  not doomed to die young. A strict origin essentialist who counts the egg (or even
  just the mitochondria) as part of the origin says no: that child would never have
  existed and a different, healthy child exists instead, and all the ethical accounting
  has to be redone on that footing. Same fight in embryo selection: does choosing
  embryo 3 over embryo 4 benefit the child who''s born? Nobody converts. They cite
  each other and move on.


  My working hypothesis, offered as a hypothesis: the whole dispute is downstream
  of an indeterminacy that both camps are refusing to name. ''The child you would
  have had'' is like the problem of the many — there''s a cloud-ish candidate from
  the original egg and a cloud-ish candidate from the donor egg and no fact about
  which one ''your child'' names, so each camp is sharpening the vagueness in the
  direction it already preferred, and the Kripkean and the counterpart theorist are
  answering different questions under one heading, one about the logic of de re claims
  and one about what actually individuates people. But I half-believe that myself
  and I''d want it pressure-tested, because the bioethics stakes make ''there''s no
  fact here'' a live and somewhat scary thing to say to a couple in a clinic.


  So: what kind of disagreement is this? Verbal, or bedrock intuition, or a hidden
  formal question about the semantics of origin statements? Diagnose it from what
  each camp actually says — I don''t need citations, and I''d rather you not gesture
  at literature I can''t check. Then tell me what progress would even look like: a
  distinction, a semantics for origin claims that predicts where the intuitions blur,
  a principled cut between source and ancestry, or an argument that this is bedrock
  and the bioethics fight should be resolved some other way entirely. If you think
  my indeterminacy hypothesis is wrong, say why — the best-candidate people thought
  vagueness was a solution and I thought it was a surrender, so I''m aware I''m being
  inconsistent, and I''d like to know if I''m being inconsistently right or inconsistently
  wrong.


