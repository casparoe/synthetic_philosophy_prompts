reasoning_summary: 'Let me pick a domain and type. Domain: Skolem''s paradox is great
  for niche-without-obscure. Type: "Ask how to teach a concept" fits well. The perspective:
  someone who had a long argument with a friend about Skolem''s paradox (downward
  Löwenheim–Skolem theorem — countable model of ZFC), and now they have to teach it
  to a reading group.


  Write casually, 1-3 paragraphs, typo or two, no citations/readings asked. The prompt
  should ask for a teaching plan: order of ideas, carrying example, misconceptions,
  check for understanding, what to leave out.


  Common misconceptions: "Skolem''s paradox proves set theory is wrong/inconsistent";
  confusion between internal and external viewpoints (the model thinks there are uncountable
  sets from inside, but the model itself is countable from outside); "countable" confusion
  — the model''s "uncountable" set is countable in the metatheory but the bijection
  isn''t in the model; thinking it means countability is relative; the "Skolem relativist"
  idea that countability is relative (Skolem himself suggested this). Also misconception:
  the theorem shows ZFC has a countable model, so we can never capture uncountability
  — some conflate with a critique of set theory as failed.


  Carrying example: use the structure with subsets of naturals, or better — the "model
  thinks X is uncountable because there''s no bijection inside the model" example.
  A common carrying device: think of a model as a country whose inhabitants (elements)
  and maps (functions) — only maps that exist in the model count. Example: the bijection
  between model elements and ℕ exists outside but is missing from the model''s stock
  of functions, like a library missing the one book that would list everything.


  Audience: philosophy reading group of non-specialists, some logic. Or "I''m a grad
  student in philosophy TAing intermediate logic".


  Structure of prompt: after long argument with friend about whether Skolem''s paradox
  means "uncountability is a kind of illusion" / whether Skolem was right that set-theoretic
  notions are relative. Now they have to run a session.


  Let me write it. Keep casual, typos allowed. Don''t ask for readings. Ask for: order
  of ideas (dependency structure), the one carrying example (and why not just drawing
  a countable model), misconceptions in order they''ll arise and where to defuse (e.g.,
  "so the theorem disproves Cantor / set theory is broken", "so uncountable sets don''t
  really exist", "the model is lying"), a check question at end, and what to openly
  refuse to cover (compactness theorem proof, why the model exists).


  Make it elaborate with personal details: argued with friend at a bar, friend is
  a math grad student insisting "from the inside it''s fine", the person teaching
  is running a philosophy of math reading group on a Wednesday evening.


  Write 2 paragraphs.'
