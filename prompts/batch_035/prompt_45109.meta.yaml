  I''m a retired geologist who fell into philosophy in my sixties, so go easy. At
  my reading group, Dana and Miguel got into it about the leveling-down objection
  and I couldn''t follow who was winning.


  Dana opened with the standard line: egalitarianism that treats inequality as bad
  in itself has to say that a world where everyone is equally blind is, in one respect,
  better than one where all but one are blind — no one is better off, and one person
  is worse off — which seems nuts. So we should drop equality as an intrinsic good
  and be prioritarians instead: benefits count more the worse off the recipient is,
  which explains why we favor the blind person''s cure without any weird claim about
  equal blindness being partly good.


  Miguel said the fix doesn''t fix much. Run the same machinery inside a single life:
  your life goes badly in your twenties, well in your fifties. Prioritarianism then
  implies it''s better for the total of your life to be shifted toward the bad years
  even if the sum is smaller — priority weighting applies within a life just as much
  as across lives, so we get leveling down again, just for one person across time.
  And anyway strict prioritarianism has its own absurd bullet: if the worse-off person
  could gain a sliver while a better-off person could gain enormously, the priority
  weighting says take the sliver — if Dana refuses that, she''s sneaking total welfare
  back in, and once totals are back in, the difference between her view and an egalitarianism
  that only cares about inequality when it affects how well peoples lives go is pretty
  thin.


  Dana''s comeback was that Miguel was confusing two claims: that inequality is bad,
  full stop, versus that inequality is bad only when removing it would make someone''s
  life go better. She said she only needs the second one to block leveling down —
  equality is derivative on people''s lives going well, not a freestanding value —
  and that this doesn''t collapse her into a total-welfarist, because the worse-off
  person''s claim still gets extra weight, which a pure total view denies.


  Miguel wasn''t having it: extra weight is exactly what the one-life case and the
  sliver case put pressure on, so Dana''s view can''t be doing the weighting at the
  level she says it is.


  Please go through the exchange move by move and tell me who''s right about what,
  and whether either of them is missing a way out.


