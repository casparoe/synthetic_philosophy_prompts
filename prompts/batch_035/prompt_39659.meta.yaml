  Fitch''s paradox of knowability: If all truths are knowable, then all truths are
  known (verificationism refuted). The paradox uses the knowability principle KP:
  φ → ◇Kφ. Fitch''s argument: suppose φ ∧ ¬Kφ is true. If knowable, then someone at
  some time knows φ ∧ ¬Kφ, which entails Kφ ∧ K¬Kφ, and knowledge entails truth: ¬Kφ.
  Contradiction. So φ ∧ ¬Kφ is unknowable; if all truths are knowable, there are no
  unknown truths, so all truths are known.


