  I convene a weekly seminar for graduate students in logic and epistemology, and
  this term''s running theme is the knowability paradox — the result, first published
  by Fitch in 1963 and now usually traced back to Church''s referee report, that the
  knowability principle ("every truth is possibly known") entails its own collapse
  into "every truth is actually known." For the final session I want a decision tree
  that sorts participants by which response to the paradox they actually hold, as
  revealed by what they are prepared to say about cases, rather than by which response
  they profess to favor. Please build it under the following constraints.


  The tree begins with a respondent who accepts some version of the knowability principle
  — someone drawn to the thought that truth cannot outrun possible knowledge — and
  routes them to a leaf naming their position. Every internal node must be a question
  the respondent can answer without knowing which leaf it leads to; the questions
  should be concrete claims or cases on which the positions genuinely divide, never
  questions about labels or terminology. The tree must at minimum contain branches
  corresponding to the following decision points, though you may add others:


  1. Whether the respondent reads "possibly known" classically or intuitionistically
  — that is, whether they accept the classical step from "not never known" to "known"
  that the derivation uses, or whether they regard the anti-realist''s commitment
  as formulated intuitionistically so that the derivation never gets traction. The
  leaf here is the Dummett-style position that semantic anti-realism was never committed
  to the classical reading.


  2. Whether the principle applies to every truth whatsoever or only to some restricted
  class, with sub-branches for the two main restrictions in the literature: Tennant''s
  restriction to so-called Cartesian propositions (those whose negations are not already
  known), and the indexical/actuality-operator reformulation associated with Edgington,
  on which what is knowable is not the bare proposition p but p indexed to the present
  situation. The diagnostic question here should be a concrete case — for instance,
  whether the conjunction of some unnoticed truth with the claim that it is never
  known could itself ever be known — rather than a question about which restriction
  the respondent finds natural.


  3. Whether knowledge distributes over conjunction: whether someone who knows that
  p and q thereby knows that p. A leaf is needed for the respondent who denies this,
  along with one sentence on what it costs them outside the paradox.


