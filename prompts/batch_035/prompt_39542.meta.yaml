  ---


  I am a high school senior writing an extended essay on whether an intelligence explosion
  would be fast or slow, and I have noticed that the arguments I read talk past one
  another largely because no one states what a theory of "takeoff" is supposed to
  deliver before arguing that one is right. Before I commit to defending any particular
  timeline, I would like the specification first. Please write out the desiderata
  that any adequate theory of AI takeoff speed must meet. By my lights it should include
  at least the following, and I would like you to correct, refine, or add to this
  list where my versions are naïve: (1) it must state what quantity is actually growing
  during "takeoff" — general cognitive capability, the ability to automate AI research
  itself, or economic output — since these can come apart, and a theory that is about
  one of them cannot silently borrow evidence about another; (2) it must locate the
  feedback loop: whether improvement flows through the model writing better training
  code, through designing better chips, or through the whole economy, because a loop
  that passes through semiconductor fabrication is constrained by factories in a way
  that a loop confined to software is not; (3) it must express its predictions in
  some unit other than calendar years alone — perhaps doublings of effective research
  progress — because if the system doing the research thinks at machine speed, "a
  year" is not a natural measure and the choice of unit can make the same scenario
  look fast or slow; (4) it must distinguish a genuine discontinuity in underlying
  capability from a threshold effect, where an ability that accumulated gradually
  only becomes visible or deployable once it clears some economic or safety-testing
  bar; and (5) it must say in advance what observation would count against it, so
  that it is not compatible with every possible headline. For each requirement, give
  the case or consideration that makes it a requirement rather than a preference of
  one camp, and mark which you regard as non-negotiable and which are negotiable.
  Most importantly, tell me whether any subset of the requirements is jointly unsatisfiable
  — for instance, whether a theory can be simultaneously about a measurable quantity,
  calibrated in a non-anthropocentric unit, and falsifiable, while still saying anything
  that a policymaker could act on within a decade. If some subset cannot be jointly
  met, I would like that stated plainly, since that result would matter more to my
  essay than any particular timeline. Please do not supply a reading list or cite
  specific papers; I want the reasoning self-contained.


  ---


