  to Eichmann as observed phenomenon, not a general theory.

  2. "She argued Eichmann was just a cog, not really an anti-Semite" — she actually
  said he was an anti-Semite in some sense / her point was thoughtlessness, not lack
  of ideology. Actually her claim that he "never knew what he was doing" is contested;
  the conflation: thoughtlessness vs. stupidity (she explicitly said he wasn''t stupid).

  3. "She concluded he therefore bore less guilt, and this is why she was attacked"
