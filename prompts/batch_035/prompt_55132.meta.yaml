  I''m an economist who''s ended up doing cost-benefit analysis at a transport agency,
  and I keep bumping into something that bugs me about the old interpersonal utility
  comparisons fight. Back in the thirties Robbins basically declared that saying one
  person gets more utility from a given thing than another does is unscientific —
  you can observe choices but the comparison itself is a value judgment, so it has
  no place in economics proper. The ordinalist crowd took that and ran with it: utility
  isn''t even a substance you could pour into two people and compare, it''s just a
  way of ordering preferences, so the question of comparability doesn''t arise. And
  yet Arrow builds social choice while carefully never comparing across people, Kaldor-Hicks
  compensation criteria get invented as a supposedly comparison-free workaround, and
  then... everyone in applied welfare economics just quietly starts comparing anyway.
  Willingness to pay gets added up across people, QALYs get summed over patients,
  distributional weights show up in treasury guidance. Nobody ever won the argument,
  we just stopped having it.


  So my question: what kind of disagreement was that, and why did it stall into a
  weird truce instead of resolving? My working theory is that the two sides were never
  actually disagreeing about the same thing — Robbins was making a point about the
