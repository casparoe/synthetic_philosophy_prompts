  ---


  I help run the safety evaluation function at a mid-sized AI lab — not a frontier
  player, but large enough that our deployment decisions affect a lot of downstream
  users, and we''re always racing someone to release. My team''s recurring decision:
  when a proposed safety intervention (a refusal-training pass, a monitoring layer,
  an interpretability-based pre-deployment check, a tighter filtering of training
  data) carries a measurable cost — benchmark scores, latency, compute, iteration
  speed — do we recommend it anyway, water it down, or reject it? Right now this is
  decided ad hoc, and the argument always collapses into someone invoking the competitiveness
  constraint — that safety work only gets adopted if it''s roughly free, or at least
  cheap enough not to lose the race — as though that settled which interventions pass.
  I want that slogan turned into an actual procedure.


  Please write a decision procedure my team can run on any proposal in under an hour.
  It should be grounded in the real conceptual content of the alignment tax idea,
  and I''d like it to preserve the distinctions that matter rather than flattening
  them: the difference between the constraint as an empirical prediction about what
  will be adopted in a competitive market and as a normative guideline for research
  prioritization; the difference between costs borne by the deploying actor and costs
  borne by users or the world; the difference between a capability tax, a resource
  tax (latency, price, compute), and a development-speed tax; and the fact that "competitive"
  is only defined relative to a counterfactual competitor who may not exist or may
  be running the same intervention anyway. The procedure should say what questions
  to ask in order, what counts as a sufficient answer to each, where it terminates
  in a clear recommendation, and where it has to hand the decision to a human because
  the remaining question is a value judgment rather than an empirical one.


  Then run it on three actual-ish proposals:


  1. A refusal-training revision that cuts the rate at which our model assists with
  obviously harmful requests by roughly half but measurably raises over-refusals on
  benign requests and drops scores on a standard benchmark suite by about 2%.

  2. An interpretability-based screening pass before each release that doesn''t touch
  model weights at all but adds a three-week delay to every release cycle and one
  senior researcher''s time.

  3. A monitoring technique that is completely free — no capability cost, no latency
  — but only works reliably below a certain capability threshold, and we are already
  training models near that threshold.


  For each, give the procedure''s verdict and reasoning. Include at least one case
  where the procedure''s verdict is one my team will hate (we''re very attached to
  proposal 2, for instance) and explain why the procedure nevertheless gives that
  answer. Finally, tell me where the procedure will misfire — which simplifications
  are most likely to produce a wrong recommendation (e.g., treating "capability" as
  a single scalar, or assuming the benchmark drop is proportional to the real-world
  capability drop, or ignoring the second-order effect where making models safer also
  makes them more useful and vice versa) — and what early-warning signs would tell
  us a misfire has occurred.


