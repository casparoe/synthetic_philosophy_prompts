  recommends, what superrational-style reasoning recommends, where things go wrong;
  which feature does the work (the symmetry/homogeneity assumption); what a Hofstadter-style
  defender says (the case shows the domain limit, not a refutation — because superrationality
  requires genuine symmetry of payoffs and reasoning, and where best outcomes need
  differentiation, the idea runs out); and honestly: whether the case is fair to superrationality
  as Hofstadter actually stated it or only to its loose everyday analog. And invite
