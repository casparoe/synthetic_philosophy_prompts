  apply, so that I''m asking for something that can''t exist without cheating — say
  so directly instead of producing something that only appears to meet the spec."


  Hmm, wait: is that actually unsatisfiable? If superrationality strictly applies
  only to identical agents with identical payoffs, then a case where it backfires
  is nearly impossible by definition (identical agents choosing the same strategy
  — could that be bad for them? If all choose same strategy S and S is Pareto-dominated
  by another symmetric strategy S'', then they just chose badly — but superrationality
  says choose the best strategy assuming all do as you do, so it would pick S''. So
  among genuinely identical agents, superrationality picks the best symmetric outcome;
  the catch is that the best symmetric outcome can be worse than some asymmetric outcome
  — e.g., both partners keep their careers (symmetric, each individually fine) vs.
  one sacrifices (asymmetric, better in total? or worse?). Hmm, actually for "both
  keep careers and live apart" vs "one moves": which is better depends on values.
  The interesting backfire: superrational reasoning convinces each agent that the
  other will decide as they do, so each reasons "if I sacrifice, they sacrifice too"
  — but they can''t both sacrifice productively; or "if I don''t sacrifice, neither
  will" — leading to a worse symmetric outcome than what self-interested bargaining
  would have achieved. The key: superrationality applied to non-identical agents (different
  payoffs, different temperaments) treats them as interchangeable, and the recommendation
  it produces is a strategy that''s good only under a false assumption of interchangeability.


