  Constraints to specify:

  - The agents must be rational (no one makes mistakes); the harm comes from the structure,
  not from stupidity.

  - Realistic setting: relationships, workplaces — no perfect predictors, no clones,
  no exotic physics. Superrationality must be applied by analogy ("people like me
  will tend to decide as I decide"), the way it actually gets applied outside identical
  agents.

  - The harm: both agents end up worse off than under plain self-interest, and it
  should trace to the symmetry assumption, not to bad values.

