  "An AI lab proposes the following operational definition: a model is honest when
  the propositions it asserts are ones it assigns high probability to. A critic objects
  that current LLMs don''t have credences in anything like the ordinary sense, so
  the definition is vacuous or ill-typed; the lab replies that we can substitute ''the
  propositions a calibrated predictor, conditioned on the model''s internal state,
  would assign high probability.'' Discuss whether this reply saves the definition,
  and whether honesty so defined is different from mere calibration. Then explain
  whether deception, defined as asserting what one believes false with intent to induce
  false belief, can even be applied to AI systems without taking a stand on belief
  attribution."


