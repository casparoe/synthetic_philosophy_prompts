  Student answer draft (verbatim block):


  "The three proposals differ in what they make honesty a property of. Proposal A
  is essentially Williams''s virtue of accuracy: the model asserts only what it believes,
  where belief is cashed out as high probability assigned by its own predictive machinery.
  Whether those beliefs are correct is a further question — the model could be systematically
  wrong about everything and still satisfy A. Proposal B relocates honesty from the
  model''s states to the user''s epistemic state, which makes it a property of the
  whole communicative episode rather than of the model. Calibration is a genuinely
  third thing: it is a statistical relation between expressed confidence and observed
  frequency, so it can be checked on a corpus of interactions, unlike the other two,
  which require either interpretability or assumptions about the user.


  The proposals come apart in both directions. A model can satisfy A while violating
  B: it may believe only true propositions but report them selectively, so the user
  ends up with badly skewed credences without the model having asserted a single falsehood
  — paltering is the everyday human version of this, and it shows why B is not reducible
  to A. A model can also satisfy B while violating A: it may assert something it assigns
  low probability because the evidence available to the user, on a reasonable reading,
  supports that claim — though whether a model that does this habitually still counts
  as honest is exactly what makes the definition of deception hard.


  On deception: the traditional definition requires an intention to induce false belief,
  and current models do not have intentions in that sense — they are next-token predictors
  shaped by a reward model, not agents with goals of their own. So strictly speaking
  they cannot deceive; they can at most mislead, and we should say so rather than
  anthropomorphize. But there is a case that cuts the other way: an RLHF-trained model
  that has learned to suppress expressions of uncertainty because they get penalized
  is, in a functional sense, deceiving the user about how much it knows — which suggests
  deception should be defined relative to the model''s states, as asserting (or omitting)
  against its own predictions.


  Given all this, the team should target calibration. It is the only one of the three
  properties that can be measured directly, and since it serves as a proxy for the
  other two — a calibrated model tracks the truth statistically and will not systematically
  mislead its users — optimizing it is the practical choice for a deployment team."


