  lie.


  Positions in lying vs. misleading debate: Kant''s categorical imperative against
  lying; the moral difference view (lying is worse); the equivalence view (no intrinsic
  difference); Meibauer''s view that some lies are not assertions... Key cases: the
  murderer at the door, lying vs misleading to protect someone, presidential testimony
  ("there is nothing going on between us"), Krifka''s "some"-implicature ("I ate some
  of the cookies" when you ate all). Grice connection could cross over but I should
  pick one domain. I''ll pick lying vs. misleading with the quiz/taxonomy type.


  Diagnostic questions should be concrete cases where positions come apart:

  - "some and perhaps all" case: saying "some of my friends smoke" knowing all do
  — Gricean misleading (exploiting scalar implicature, literally true). Is this closer
  to lying or closer to innocent truth?

  - The conjunctive dodge: "Do you smoke?" — "I''ve never smoked in this house." (true
  conjunct chosen for misleading relevance)

  - The murderer at the door / Nazi case: if only misleading is available, is lying
  worse?

  - The half-truth.

  - The layabout relative: misleading via literal truth.

  - Skeptical worries about the lying/misleading distinction (Saul,WebResponse "Lying,
  Misleading, and What is Said" — Jennifer Saul''s book). Positions: Moral Difference
  view (lying worse), Equivalence view (no difference), Reverse view (misleading worse,
  because it makes the hearer complicit / the "you tricked yourself" responsibility-shift),
  and the deflationary "it depends on context" — plus views denying the act-type distinction
  can be drawn cleanly.


  The prompt asker wants committed response: ask the writer to actually build the
  tree so that it sorts by their chosen distinctions, take stances on whether each
  node is a real fork or a distraction, and place their own best guess at the bottom.


