reasoning_summary: 'Let me pick a domain and type. Domain: "Equality of what?" (welfare,
  resources, capabilities) — Sen''s capability approach, Rawlsian primary goods, Dworkin''s
  resources, welfarism. Type: "Present someone''s summary of a view or result and
  ask whether it is fair." That fits well: a friend or article summarizing the "equality
  of what?" debate with subtle misrepresentations.


  Persona: retired natural scientist recently into philosophy, formal/polished. Ask
  for separation of settled vs contested.


  I''ll write a plausible popular summary of the equality-of-what debate with a couple
  of subtle errors:

  - Claim: Rawls''s primary goods are chosen because they''re objective and measurable
  — okay.

  - Error 1: Conflate capabilities with functioning — "a capability is what the person
  actually achieves" — conflating capability (freedom/option) with functioning (achievement).
  Sen keeps these apart.

  - Error 2: Claim Sen''s objection to Rawls is that primary goods are "measured in
  money" or that Rawls ignores distribution of income — overstatement; Sen''s critique
  is about "fetishism" — focusing on goods rather than what goods do for people; diverse
  conversion factors. A common misrepresentation: saying Sen refuted Rawls, or that
  Rawls "refuted" utilitarianism and was himself "refuted" by Sen. Standard objection
  presented as refutation: "Since a person disabled from birth needs more resources
  to achieve the same functionings, resource equality is refuted and everyone now
  agrees capabilities are the right metric" — but capability approach has its own
  problems (measurement, paternalism, and Rawls''s political liberalism reply).

  - Error 3: technical term in everyday sense: "welfare" used loosely to mean money/income
  or happiness.


  Write from retired natural scientist perspective: "I trained as a chemist" or physicist,
  retired, reading philosophy. Formal tone. Keep prompt a few sentences long but this
  type needs the summary paragraph.


  Draft:


  "Having spent my career in [molecular biology], I have lately been reading political
  philosophy, and I have run across the following account of the ''equality of what?''
  debate. [Quote of the summary — no quotation marks needed from real text since I
  write it myself, attributed to an unnamed book.]


  Then: ask whether it''s fair — which parts would a defender accept, which conflate
  things, does the conclusion follow. And ask to separate settled from contested.


  Let me write the summary paragraph:


  "A popular introduction I picked up sums up the debate like this: ''Utilitarians
  said equality should be about welfare — making sure everyone is equally happy. Rawls
  showed this was unworkable, and proposed instead that society distribute primary
  goods equally: rights, opportunities, income, and wealth. Amartya Sen then proved
  that Rawls''s metric was also wrong, because two people with the same bundle of
  goods can end up with very different levels of well-being — a disabled person needs
  more resources to do the same things. So the question is settled: equality must
  be measured in capabilities, meaning what people actually manage to do and be, and
  social policy is now built on this insight.''"


  Errors: "proved" — Sen''s critique is an argument, not a proof; "the question is
  settled" — overstatement; capability conflated with functioning ("what people actually
  manage to do and be" is functioning, not capability — capability is the freedom/real
  opportunity); "primary goods equally" — Rawls doesn''t demand equal distribution
  of all primary goods; equal basic liberties and fair equality of opportunity, but
  the difference principle permits inequalities. That''s a real subtle error: "distribute
  primary goods equally" misstates Rawls. Also "welfare = equally happy" — hedonistic
  reading; welfare can be preference satisfaction. "Social policy is now built on
  this insight" — overstates; HDI uses capabilities loosely but policy is not "built
  on" it.


  Ask for: which parts a careful defender of each position (welfarist, Rawlsian, capability
  theorist) would accept, where the conflations are, and whether "the question is
  settled" follows. Epistemic request: separate settled from contested in the field
  — e.g., whether the capability approach can be operationalized, whether it supersedes
  or complements resource metrics, the measurement problem — and not present contested
  views as consensus.


  Persona: retired natural scientist — maybe "a retired physicist" or chemist. Add
  a line: "As a former experimentalist I am wary of accounts that turn live disputes
  into settled results" — nice touch, motivates the epistemic request. Formal polished.


