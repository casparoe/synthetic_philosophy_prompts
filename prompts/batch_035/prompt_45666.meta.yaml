  ---


  I''m building a case-study unit for a course on democratic theory, and I want one
  ancient case treated with the same care people give to modern ones. The episode
  is the Mytilenean debate of 427 BCE, as Thucydides tells it: after Mytilene''s revolt
  from the Athenian empire was put down, the Athenian assembly voted, on Cleon''s
  urging, to execute the entire adult male population and enslave the women and children;
  a trireme was dispatched to carry the order out. Within about a day, enough citizens
  regretted the vote that the question was forced back onto the agenda, and after
  a second debate — in which Diodotus argued against the massacre while pointedly
  refusing to invoke justice, claiming only expediency was a proper basis for the
  vote — the assembly reversed itself. The reversal came down to a race between two
  triremes: the first had been rowing leisurely, and the second, carrying the reprieve
  (well, partial reprieve: Athens still executed roughly a thousand men it held responsible
  and dismantled the city''s walls), overtook it only just in time.


  The lens I want applied is the epistemic defense of democracy: the family of arguments,
  running from Condorcet''s jury theorem to modern deliberative-democracy theory,
  according to which large bodies deliberating openly tend to correct their own errors
  over iterations — the many are wiser than the few, and public deliberation is the
  mechanism. Treat the episode as a test case running in both directions. First, map
  it carefully: who counted as the deliberators, what the actual options and arguments
  were, what the two votes say, and what role the second debate''s strange feature
  — Diodotus winning on prudential grounds while explicitly disclaiming any appeal
  to justice — plays in whether the second vote should count as epistemic improvement
  or merely as a shift in framing. Then say honestly what the epistemic theory explains
  about the episode and what it cannot: the same body produced a massacre order and
  a near-reversal inside two days, the reopening of the question was engineered by
