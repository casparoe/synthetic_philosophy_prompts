  no logical contradiction in being caught unprepared in a downpour, or in being wrong
  about the weather. Yet they are somehow absurd when asserted in the first person,
  present tense. (Third-person and past-tense versions — "It''s raining, but she doesn''t
  believe it" — are perfectly sensible.) The puzzle is to explain what goes wrong.
