  Prompt draft:


  "My mother spent four years on dialysis before receiving a kidney transplant last
  spring, and partly because of that I now sit on the patient and family advisory
  council of our regional organ procurement organization. The council has been asked
  to advise on a stream of donor-compensation proposals..." Proposals: funeral-expense
  reimbursement for deceased donors'' families; a state tax credit for living donors;
  a voucher/priority scheme; an open fixed-price buyer (as in Iran). And one member
  wants to import the reasoning to price gouging after our river flooded — ask whether
  procedure generalizes.


  Requirements list:

  1. Ordered questions with sufficiency criteria.

  2. Must preserve the distinction between objections about consequences for parties
  (coercion of the desperate, unequal standing) and objections about what buying and
  selling itself expresses or corrupts; and it must have a place for remedies short
  of prohibition — regulation, in-kind compensation, building a non-market alternative.

  3. Must mark where the procedure hands off to judgment rather than pretending to
  settle it.

  4. Run on three proposals: funeral expenses, tax credit, open fixed-price market.
  And discuss briefly whether it transfers to price gouging.

  5. Include at least one case where the procedure returns an answer I won''t like
  — I''ll be honest that I want more organs available; if the procedure condemns a
  scheme that might have shortened my mother''s wait, I want to see that happen rather
  than have it softened.

  6. Say what the procedure cannot do — I''ve been told no philosophical framework
  can tell us whether paying for organs changes what donation means; if that''s true,
  say where the wall is.

  7. Audience: council of twelve, no philosophers, monthly meetings, ~20 minutes per
  proposal, recommendations advisory.


  Good. Write it, formal, no preamble.'
