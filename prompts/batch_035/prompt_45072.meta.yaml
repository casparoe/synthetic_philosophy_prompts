  Student''s answer:


  "Peirce and James both reject the correspondence theory: truth is not a relation
  between beliefs and mind-independent facts but something tied to inquiry and practice.
  For Peirce, a belief is true if it is the belief the scientific community actually
  converges on. So truth is a social fact about what scientists agree on at a given
  time. James instead ties truth to consequences: an idea is true if believing it
  pays, if it leads to satisfactory relations with the rest of our experience.


  The objection is that Peirce makes truth depend on the actual future of inquiry.
  If humanity goes extinct before convergence, the convergence never happens and nothing
  comes out true. I think this objection succeeds, and Peirce can accept it: on his
  view truth is time-indexed. Newtonian mechanics was true in the nineteenth century,
  when scientists agreed on it, and became false in the twentieth, when they stopped
  agreeing. This temporal character of truth is the distinctive feature of Peirce''s
  pragmatism, and it is what James was reacting against: on James''s account there
  is no such dependence on the distant future, since whether a belief works is settled
  by the believer''s present situation.


  James''s account faces the familiar objection of subjectivism: what pays for me
  may not pay for you. But James can reply that a true belief must also fit with our
  other beliefs and with the course of future experience, so truth is not mere comfort.
  Since both Peirce and James accept the pragmatic maxim — that a concept''s meaning
  is exhausted by its practical consequences — they both hold a verificationist theory
  of meaning, and this shared core is what makes them pragmatists about truth rather
