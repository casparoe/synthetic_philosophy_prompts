  professor explicitly said reciting the axiom lists gets a C — she wants us to argue
  why the trade-off should go one way. The crux, as she put it: Nash''s solution is
  the unique one satisfying Pareto efficiency, symmetry, invariance to affine transformations,
  and independence of irrelevant alternatives (IIA); Kalai–Smorodinsky keeps the first
  three but swaps IIA for individual monotonicity — each player''s payoff can never
  fall when their own best possible payoff (their ''utopia'' payoff, given the other''s
  maximum) rises. The standard counterexample to IIA is the case where one player''s
  utopia point shrinks: IIA says the bargain stays put even though the pie visibly
  got worse for that player, and individual monotonicity is designed exactly to rule
  that out. Write the essay. Weigh both sides — give IIA its best defense, not a strawman
  (e.g., think about what IIA does for consistency across negotiations or for not
  being open to threats/manipulation by shrinking options). But don''t end wishy-washy:
  pick one solution and defend the choice. End with a final line of the form ''Verdict:
  Nash'' or ''Verdict: Kalai–Smorodinsky'' so I can machine-extract your conclusion.
  Keep it around 700 words."


