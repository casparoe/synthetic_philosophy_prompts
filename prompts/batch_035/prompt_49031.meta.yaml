  I''m writing the final for a graduate seminar on deontological ethics and want one
  essay question on the paradox of deontology — the objection that it is irrational
  to refuse to violate a constraint when doing so would prevent several further violations
  of that same constraint. The standard seminar treatment runs through the two standard
  responses and stalls there: on the one hand, the agent-relative reply that constraints
  are not to be evaluated by how much constraint-violation the world contains, since
  that very move treats violations as an aggregate quantity to be minimized and thereby
  capitulates to consequentialism; on the other, threshold replies that concede some
  number of prevented violations would license one violation, with the familiar worry
  that thresholds introduce discontinuities that look arbitrary. I want a question
  that gets past both.


  Here is the angle I want the question built around. Almost all discussion sets the
  constraint against multiple violations of the very same constraint: kill one to
  prevent five killings. But there is a structurally distinct and rarely discussed
  version: the question of ordering among constraints. If killing and torturing are
  both constrained, may I kill one to prevent five tortures? A nonconsequentialist
  owes an account of the structure among constraints — lexical, lexicographic with
  room for trade at some remove, or comparative in a way that doesn''t reduce to summing
  — and any of these options seems either to reintroduce aggregation one level up
  (which revives the paradox) or to leave the agent with no guidance where constraints
  conflict. My suspicion, which you may make the question explore rather than presuppose,
  is that the paradox is not really about numbers at all but about whether deontological
  constraints have the logical form of agent-relative *reasons* (which interact with
  each other) or of agent-relative *defeasible prohibitions* (which either hold or
  don''t, with no interaction), and that the intra-constraint and inter-constraint
  versions force that question differently.


