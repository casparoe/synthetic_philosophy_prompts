  in expectation from the pre-flip vantage, and updatelessness says take that deal,
  so you pay.


  Now the argument:


  (1) Rational choice is policy choice: evaluate actions as part of a policy, from
  the pre-observation vantage point (this is updatelessness / FDT-style, and it''s
  what gets the right answer in Parfit''s hitchhiker and transparent Newcomb, which
  I''m not giving up lightly).


  (2) In the tails branch you are never shown the heads branch. The evidence for the
  payout ever occurring is entirely inside the counterfactual, which you can''t check
  from where you sit. The branch where Omega hands you $1000 is unobservable at the
  moment you''re deciding.


  (3) The expected value of "pay" is carried entirely by your credence that the counterfactual
  branch went the way the story says. If Omega reliably pays on heads, paying is +EV;
  if there is no heads branch or no payout, paying is just losing $100.


  (4) From the tails branch, a stranger with a story is in exactly the epistemic position
  you''re in w.r.t. Omega: you cannot, at the moment of choice, observe the other
  branch. Any claim of the form "if you had been the type to pay, I would have rewarded
  you" has a verification problem that is never solved in the branch where you pay
  — you pay precisely in the branch where the reward is never shown.


  (5) So updatelessness, applied consistently, tells you to pay anyone who tells you
  a story in which your paying would have been rewarded — including people who made
  no prediction, have no mechanism, and just want your money — provided the numbers
  they quote make the "policy" come out positive.


  (6) Updatelessness therefore makes you a mark: every huckster with a sad tale about
  the branch where you pay gets paid. That can''t be right, so (1) is false, or at
  least needs a restriction updatelessness can''t supply from the inside.


