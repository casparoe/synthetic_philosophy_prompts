  Let me construct an argument about counterfactual mugging / updatelessness that
  seems to prove too much. Classic issue: accepting counterfactual muggings generalizes
  into being a "simulation-rewarder" — paying in any case where you might be simulated.
  There''s the known "simulated mugging" and the problem of "acting as if you might
  be counterfactually simulated by any agent" — e.g., an argument that if you pay
  the counterfactual mugger, you should pay anyone who claims to have predicted your
  behavior and gives money based on counterfactual predictions, including lazy "predictors"
  who never actually observe — leading to being milked by opportunistic "muggers"
  who never made the prediction. This is like XOR blackmail adjacent.


  Let me build a numbered argument:


  1. Rational action should be evaluated from a pre-decision standpoint (updatelessness):
  you choose a policy, not an action, and the policy is evaluated by its expected
  value averaged over all the observations you might have, including counterfactual
  ones.

  2. In counterfactual mugging, the policy "pay when asked" earns $2400.5 in expectation...
  wait, standard: coin flip, tails you pay $100, heads Omega gives you $10000 (or
  $1000). Paying policy averages positive, so you pay.

  3. The mugger''s honesty is irrelevant to the expected value computation: the policy
  "pay when asked" beats "refuse when asked" whether or not this particular Omega
  exists in all branches — actually the calculation only depends on the predictor
  being accurate and doing the same thing in the counterfactual.

  4. But we never verify the counterfactual branch: the "heads" branch is unobservable
  when we''re asked to pay (tails branch, we''re asked to pay, and we can''t see the
  heads branch). So the expected value is supported entirely by our credence that
  a predictor exists who would have paid out.

  5. Same structure applies to anyone who says "I predicted you''d pay, so I prepared
  to reward you in the branch where you pay" — including someone who just says it,
  since we can''t distinguish a real predictor from a fake in the counterfactual branch.

  6. So updatelessness commits you to paying everyone who presents you a counterfactual
  mugging story, i.e., being exploitably generous to any liar with a story about what
  "would have happened."

  7. That''s absurd (you get drained by liars), so updatelessness is wrong / paying
  in counterfactual mugging is wrong.


  This is a genuine, well-known-ish tension (the "problem of updatelessness" and exploitation;
  also relates to "LDS" dilemmas / "playing chicken with the universe"... more like
  "simulated mugging" by Peter de Blanc, and "5-and-10"). This is in the weeds enough
  for rationalist readers but standard enough that the model will know it.


