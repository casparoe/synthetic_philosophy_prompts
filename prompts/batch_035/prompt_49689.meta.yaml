  not the paradox itself but the argument about it, which seems to have been going
  on in roughly the same shape for a very long time without anyone conceding anything.
  As far as I can tell from my reading, the responses sort into a few clusters. One
  group says the problem is with the game, not the theory: no real casino could pay
  unbounded sums, so once you cap the possible payout at what a real counterparty
  could actually deliver, the expected value becomes finite and modest, and the paradox
  dissolves. A second group says the problem is with the rule: expected value is simply
  the wrong guide when the stakes are skewed or the probabilities tiny, and we need
  something like risk-weighted weighting, or typical outcome, etc. A third bites the
  bullet: if you take the game seriously as described, you should be willing to pay
  any finite price, and our reluctance is a bias to be explained away by psychology
