  Authorial intention? Let''s do a disagreement-type prompt on superrationality —
  a Hofstadterian concept well-known but not over-regurgitated. A journalist covering
  science and ideas, formal, British English, elaborate.


  Scenario: two people argue about voting (or contributing to a cooperative cause)
  — one invokes superrationality to say voting in elections is rational because others
