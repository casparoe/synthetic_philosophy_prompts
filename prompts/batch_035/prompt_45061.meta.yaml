  ---


  I work on the regulatory side of autonomous vehicles — mostly reading accident reports
  and drafting guidance about who should be answerable when a system in partial autonomy
  causes harm. Over a few years of this I''ve noticed a pattern in how blame gets
  settled, and I want to know whether philosophy or law has a name for it, because
  I need to describe it precisely in the guidance I''m writing and I don''t want to
  reinvent a term that exists.


  The pattern has two halves that I think are related. First: when a system that mostly
  drives itself injures someone, and there is a human whose job was to sit there and
  take over if something went wrong, the blame almost always lands on that human —
  even when everyone agrees that the takeover task was impossible in the time available,
  even when the injury traces to the system''s own behavior, and even though, if you
  asked anyone beforehand, they would have said the watcher''s job contributed almost
  nothing to the risk. What seems to matter is not that the human caused the harm
  but that there is a human standing in the right causal neighborhood. Once the file
  has a name in it, the process feels closed, and nobody presses further.


  Second: when there is no such human nearby — the harm comes out of a purely algorithmic
  pipeline, a trading system or a content-ranking system or a scheduling system, with
  many people involved but none of them individually connected to the harmful output
  in a way a court could describe — the reaction is different: people don''t assign
  it to anyone, they call it an accident or an emergent effect, and the matter simply
  dissolves, even though the same harm, done by hand, would have been an obvious crime.


  My own hunch is that these are two outlets for the same pressure: people behave
  as if the amount of responsibility in a situation were fixed — as if it can be moved
  around but not created or destroyed. If the system can''t take it, the nearest human
  absorbs it; if no human is near enough, it gets assigned to nobody, and calling
  it "just one of those things" is the socially acceptable way of assigning it to
  nobody. If that''s right, then the second half isn''t a distinct phenomenon but
  the fallback that appears when the first mechanism fails. But I may be overreaching.


  So: (1) Is there an established term for the first half — blame settling on a human
  because of proximity and role rather than contribution? (2) Is there an established
  term for the second half — a harm caused by an autonomous system''s own operation
  for which, at the time, no one can be held responsible? I''d expect something to
  exist for the second, because it is the one regulators keep gesturing at. (3) If
  terms exist, I need the boundaries, not just labels: which cases count and which
  don''t. In particular — does the second half require that no one could have foreseen
  the specific behavior (in which case a system whose failure mode was documented
  in an internal report would fall outside it), or that no one''s action was the proximate
  cause, or something else? Where does a case sit in which the human supervisor could
  have intervened in principle, but only by acting against explicit instructions?
  And is the conservation idea — responsibility as a fixed quantity that must land
  somewhere — something anyone has actually theorized, or does it just describe my
  impression of accident reports? If nothing exists for that, say so plainly; I''d
  rather put an honest coinage in the guidance than borrow prestige from a concept
  that isn''t there.


