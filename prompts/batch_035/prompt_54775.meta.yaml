  Exam question: "C. S. Peirce and William James are both labelled pragmatists, but
  they appear to give very different accounts of truth. Explain the difference between
  Peirce''s account of truth and James''s, and assess the objection that pragmatist
  theories of truth confuse truth with what it is convenient or comfortable to believe."


  Student answer draft:


  "Peirce''s pragmatism begins from a rejection of Cartesian doubt. In ''The Fixation
  of Belief'' (1877) and ''How to Make Our Ideas Clear'' (1878) he argues that inquiry
  begins with the irritation of doubt and ends in the settlement of belief, and his
  pragmatic maxim says that the meaning of a conception consists in the practical
  effects we conceive it to have. Applied to truth, Peirce''s view is that a true
  belief is one that satisfies — that proves advantageous to our thinking — and that
  the real is whatever the community of inquirers agrees upon. Since Peirce defines
  the real as the object of the final opinion, truth for him is simply whatever the
  community of scientists actually converges on, which is why he thinks the methods
  of science are the only legitimate method of fixing belief.


  James takes over this approach and applies it directly to truth itself. For James,
  truth is not a static property of propositions but something that happens to an
  idea: an idea becomes true insofar as it is verified, insofar as it leads us usefully
  through experience and can be assimilated with our other beliefs. James gives the
  example of being lost in the woods: the belief that a path leads to a house is true
  just in case following it gets us there. Truth on this view is a species of the
  good, and James is happy to say that a belief''s being comfortable can contribute
  to its truth — this is why his critics called pragmatism a philosophy for people
  who want to believe whatever suits them.


  The objection that pragmatism confuses truth with what it is convenient to believe
  has more force against Peirce than against James. Since Peirce makes truth dependent
  on whatever the scientific community accepts, a widely accepted but false consensus
  would count as true. James avoids this because he ties truth to verification rather
  than consensus. Peirce himself became so worried about James''s version that he
  renamed his own view pragmaticism, marking a clean break between the two pragmatisms."


