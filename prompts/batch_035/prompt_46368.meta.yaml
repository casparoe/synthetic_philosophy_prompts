  are, and I want to understand what we are actually committed to. What theory of
  desert does each practice presuppose — that students deserve rewards for what they
  absolutely achieve, or for how they rank against a reference class? Are these rival
  views, or can a single account... Where is the practice underdetermined... And what
  if we took seriously the Rawlsian thought that even the willingness to work hard
