  quality of the work. Across campus in the honors program, election to Phi Beta Kappa
  is capped at a fixed percentage of the graduating class, while Dean''s List membership
  and most scholarship retention require only clearing an absolute GPA threshold —
  and in strong cohorts, the program turns away students whose records would have
  earned honors in a weaker year. Our accreditation documents, meanwhile, declare
  that grades certify mastery of defined standards of competence, not relative standing
  among peers.


