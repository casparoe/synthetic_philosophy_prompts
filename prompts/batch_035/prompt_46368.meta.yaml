  anything in our system have to become a weighted lottery among the qualified, and
  would that be a change of desert theory or an abandonment of desert talk altogether?
  I''d like a reconstruction that distinguishes what the practices strictly presuppose
  from what they merely fit, an assessment of the coherence of the mixture, and a
  statement of what would have to change under each of the two or three most plausible
  unified theories."


