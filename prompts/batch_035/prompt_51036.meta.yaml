  or "acceptable" evidence in the everyday sense — actually the subtlety is that inadmissible
  information is information about the outcome itself (like tomorrow''s newspaper),
  not "morally admissible".


  - Conflating the PP with the frequentist principle that chances are long-run frequencies
  — saying "the principle just says frequencies are chances," which Lewis denied (he
  took chances as primitive, and Humean chance via Best System).


