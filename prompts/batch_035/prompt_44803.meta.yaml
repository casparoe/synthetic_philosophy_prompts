  the right conditioning set is fixed neither by the data nor by causality alone but
  by evidential relevance to the hypothesis under test — the total evidence requirement,
  or something like it — and this is a genuinely epistemological constraint that causal
  vocabulary does not capture. On this view the causalist smuggles in a decision-theoretic
  or action-oriented standard and calls it the only standard.


