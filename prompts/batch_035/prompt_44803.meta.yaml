  The setup, as it came to me: in the classic kidney-stone data, treatment A beats
  treatment B in both strata (small stones, large stones), yet B beats A in the aggregate.
  My first reaction was: no paradox — the aggregate is a mixture, the mixture proportions
  differ across arms, unadjusted comparison is a biased estimate of the treatment
  effect, end of story; condition on stone size, which is a confounder, and report
  the stratified estimate. My colleague says the philosophical dispute is about whether
  that reaction is a discovery about the data or an imposition on it. Apparently there
  are at least three positions in the vicinity:


  1. The evidentialist reading: both tables are perfectly good descriptions of the
  data. "Association between treatment and outcome" is not a property of the world
  but of a joint distribution plus a conditioning set, and there is no contradiction
  in the association flipping as the conditioning set changes. On this view the aggregate
  table is not "wrong"; it is a correct answer to a different question, and nothing
  in the data privileges one question.


  2. The causalist reading: the reversal shows that the question "what is the association,
  really?" is underdetermined by the data — any answer requires assumptions that are
  not in the data, and the natural ones are causal: the partitioning variable is a
  confounder rather than a collider or a mediator, the stratum sizes are not themselves
  affected by treatment, and so on. The data cannot tell you which table to trust;
  only the causal story can.


