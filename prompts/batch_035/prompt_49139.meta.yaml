  Actually the classic: a pinprick above threshold vs. removing all pleasure. Also
  the empirical defeater: whether intensity thresholds are even coherent given pain
  science (pain intensity scales, chronic vs acute).


  Also they ask: would a defender concede some as counting against, and is the view
  insulated into unfalsifiability by making the threshold vague or theoretical?


  I''ll also inject a personal refinement: "I index the threshold to the intensity
  of the episode itself, not to duration-weighted totals, and I deny aggregation across
