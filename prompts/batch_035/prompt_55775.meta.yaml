  indeterminism; the future being "real" doesn''t mean it''s causally determined.

  4. Andromeda paradox: misattributing — it''s from Penrose (The Emperor''s New Mind),
  Rietdijk 1966, Putnam 1967. A summary might say "Putnam proved in 1967 that..."
  — fine.

  5. Claiming no physicist disputes it; actually many (e.g., those favoring becoming,
  like those invoking cosmic time in FLRW cosmology) dispute that Minkowski spacetime
