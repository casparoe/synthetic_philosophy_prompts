  Cases: A policy that depletes resources harming future people who owe their existence
  to the policy (Parfit''s depletion case) — verdict: wrong. A couple who could wait
  to conceive but conceive now, child born with a disability — verdict: many feel
  less clearly wrong (or wrong if disabling). A 14-year-old girl conceives (Parfit''s
  case) — wrong to have the child now, but the child has a life worth living. Mandatory
  one-child... Let me craft a hard-to-reconcile pair.


  Verdicts:

  1. Depletion policy (society burns resources, later generations worse off but wouldn''t
  exist otherwise): clearly wrong.

  2. A woman who takes a teratogenic drug during pregnancy knowing risk, child born
  with disability but life worth living: wrong.

  3. Same drug scenario but the woman couldn''t have a child later at all (fertility
  window closing) — this child or no child: feels less wrong, or not wrong? Hard pair
  with #2.

  4. Choosing to conceive at a time when a mild condition is likely vs. waiting a
  month would produce a different child without it: feels barely wrong at all — like
  choosing a paint color.

  5. Having a child knowing it will be born into poverty — wrong? Feels not wrong,
  but is structurally same as depletion.

  6. A person-creating policy that benefits... e.g., a risky space colony: founding
  a colony whose founders'' descendants will be worse off but exist because of it.


  Then the tension: principle candidates — rights-based (nonexistent people can''t
  be wronged), impersonal value (avoid worse-off... but total might be higher). Ask
  what principle captures it, whether the depletion verdict must be given up or the
  "wrong" verdicts about individual mothers must go, and ask for the principle''s
  verdict on a new case (e.g., climate policy is standard; ask about something new:
  a sperm bank that deliberately only collects from donors with a heritable condition...
  or the case they go back and forth on).


