  — though I''m not sure how you''d even measure that.

  - any case where crude idealization is systematically worse than raw deference,
  not just occasionally — e.g., if mood-averaging smooths out a morally urgent signal
  precisely because urgency correlates with emotion.

  - arguments that "better than raw" still isn''t good enough once you''re picking
