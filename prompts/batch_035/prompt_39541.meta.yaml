  The standard CEV story (coherent extrapolated volition) is: if we knew more, thought
  faster, were more the people we wished we were, etc., our wishes would cohere, and
  a Friendly AI should satisfy that extrapolated volition rather than our current
  stated preferences. Everyone fights about whether extrapolation converges (the "yay
  humans" optimism vs the moral realist vs. "it''s all just plumbing" pessimism),
  or about whose volition gets included.


  My take is different. I think CEV''s value doesn''t come from getting the extrapolation
  right in any deep sense. It comes from the fact that idealization is a robustness
  improvement over current-preference deference even when the extrapolation is pretty
  wrong. Current stated preferences are distorted in known directions — mood, framing,
  manipulation by whoever has the mic at the moment of asking. Even a crude idealization
  (e.g., average over emotional states, discount preferences expressed while visibly
  angry) moves you toward something stabler, and stabler is what a singleton needs,
  because error compounding under reflection (the "I said that, but I''d regret it"
  loop) is the real killer. On my reading, CEV is like error-correcting code: it doesn''t
  need to transmit the message perfectly, it just needs to be better than transmitting
  it raw, and the claim is that almost any monotone improvement in coherence beats
  raw deference. I''d rather be governed by a moderately good extrapolation of me
  than by a snapshot of me on election day.


  So: what would count against this? I''m not asking "is CEV true" — I''m asking what
  observations, arguments, or cases would make me give up the robustness claim specifically.
  I can think of some candidate pressure points to get you started (feel free to ignore
  these if they''re dumb):


