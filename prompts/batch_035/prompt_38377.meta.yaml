  ---


  Write a satirical op-ed, about 700 words, in the voice of a confident mid-sized-city
  newspaper columnist — give him a name, a beat (say, "life and civic affairs"), and
  a history of failed enthusiasms — who has recently discovered Gödel''s incompleteness
  theorems and now deploys them as an all-purpose trump card in every dispute, from
  the school-board budget to his brother-in-law''s claim about Paleo diets. The piece
  should read as his column, title included.


  The humor has to come from getting the actual mathematics right while the applications
  go spectacularly wrong. He must never misstate the theorems: he should correctly
  distinguish the first theorem (any consistent, recursively axiomatizable theory
  strong enough for arithmetic leaves true-but-unprovable statements in the language)
  from the second (such a theory, if consistent, can''t prove its own consistency),
  and he should state the conditions of applicability — perhaps more precisely than
  his editors are comfortable with — before applying them to things that are not formal
  systems, like his homeowners'' association bylaws, his marriage, and the municipal
  sewer budget. Include at least three of the standard misuses: everything-is-relative
  relativism, the Penrose–Lucas-style claim that human minds transcend any machine,
  and the idea that science as an enterprise has been "proven incomplete" — plus at
  least one application so mundane it circles back to being almost profound.


  His rhetorical armor should itself be an abuse of the second theorem: when readers
  write in to point out that the theorems only concern formal axiom systems, he replies
  that no critique of his column can be proved from within his column. End the piece
  with a short editor''s note (or appended letter) from a local mathematician whose
  correction is technically impeccable — she should mention, accurately, that plenty
  of theories escape incompleteness entirely, such as Presburger arithmetic and Tarski''s
  axiomatization of Euclidean geometry, and that Gödel himself was a Platonist who
  thought mathematical truth outruns proof but wasn''t a relativist about anything
  — followed by the columnist''s serene, two-sentence rebuttal that misses her point
  entirely.


  Constraints: the satire should be fair — exaggerate the genuine, recognizable pattern
  of Gödel-citation rather than inventing errors no one actually makes; don''t put
  verbatim quotations in Gödel''s mouth (the columnist may garble-paraphrase him,
  flagged as such); and keep it deadpan, so that by the end a reader has felt the
  real question the column accidentally raises — what would it even take to legitimately
  export a formal result to informal domains — even though the columnist never notices
  he''s raised it.


