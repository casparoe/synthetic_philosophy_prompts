  Standard Fitch derivation:

  1. Suppose p is true and unknown (p ∧ ¬Kp).

  2. If all truths are knowable, then (p ∧ ¬Kp) is knowable: ◇K(p ∧ ¬Kp).

  3. If someone knows (p ∧ ¬Kp), then they know p and know that they don''t know p
  (knowing a conjunction implies knowing each conjunct; and knowledge of a conjunction
  distributes).

  4. Knowledge is factive: K(p ∧ ¬Kp) → (p ∧ ¬Kp). So K(p ∧ ¬Kp) → ¬Kp.

  5. Also K(p ∧ ¬Kp) → Kp (from distribution).

  6. So K(p ∧ ¬Kp) → Kp ∧ ¬Kp, contradiction. So K(p ∧ ¬Kp) is impossible, hence not
  knowable.

  7. So if all truths are knowable, there is no truth p with p ∧ ¬Kp: every truth
  is known. Non-omniscience is impossible.


  Now the rationalist twist: apply to "every epistemically accessible truth will eventually
  be discovered by humanity/AI" — a "Learnability" thesis. The friend derives: Learnability
  + one unknown truth ⇒ omniscience (all truths already known). Steps:


  1. Learnability (L): for every truth p, it is possible that p becomes known — some
  continuation of inquiry, perhaps by our descendants or AI systems, could come to
  know p. (This is meant to be weak: it denies mysteries in principle, not claiming
  anyone actually knows.)

  2. There is at least one truth that is in fact never known by anyone at any time
  — pick your favorite: the exact number of hairs on Caesar''s head at noon on the
  Ides, the last digit of some physical constant never measured, whatever. Call it
  u: u ∧ ¬Ku.

  3. By (1), it''s possible that u ∧ ¬Ku comes to be known.

  4. If someone were to know the conjunction u ∧ ¬Ku, then (4a) knowing a conjunction
  requires knowing each conjunct, so they''d know u; and (4b) they''d know ¬Ku, i.e.,
  know that u is never known by anyone.

  5. But if they know u, then u is known by someone, so ¬Ku is false, and since knowledge
  is factive they can''t know a falsehood — so (4a) and (4b) are jointly impossible.

  6. So u ∧ ¬Ku can never be known by anyone.

  7. By (1) again, anything that can never be known by anyone is not a truth. So u
  is not a truth — but u was a truth by stipulation. Contradiction unless there is
  no truth that is never known.

  8. Therefore: if (1) holds, every truth is already known by someone — actual omniscience
  across the community of knowers, which we know is false (we''re not omniscient).

  9. So (1) is false: there are truths that could never, even in principle, be known.
  The friend concludes that "no mysteries in principle" is refuted by elementary logic.


