  Last night a friend and I argued for hours about who was to blame for the First
  World War, and I want to work out what I actually think rather than let it end in
  a stalemate. Here is the shape the argument took.


  She began from the Fischer controversy: Fischer''s case, built on the archival record
  of German war aims — the September Programme of 1914 and the decision to give Austria-Hungary
  the so-called blank cheque — for treating Germany as the one power that deliberately
  risked, and to a substantial degree wanted, a general European war. She said she
  no longer believes that, and cited the newer multi-causal accounts associated with
  Christopher Clark''s The Sleepwalkers: all the great powers accepted grave risks,
  none wanted the war that came, and the crisis was driven by Balkan entanglements,
  alliance machinery, mobilization timetables, and mutual misreading. From this she
  drew a two-step conclusion. First, the empirical step: the Fischer-style thesis
  is false, so Germany was not uniquely responsible. Second, the conceptual step:
  since no state is uniquely responsible, blaming a nation for the war is a mistake
  — and in any case nations are not the kind of thing that can be blamed, since they
  have no mind, only members do; talk of a guilty nation is either category error
  or loose shorthand for a list of blameworthy officials.


  I pushed back on both steps, and I want to see how far the pushback goes. On the
  conceptual step: I suspect my friend is assuming that responsibility requires sole
  authorship — that unless one agent caused the war, no one is responsible for it.
  But we do not ordinarily think blame is all-or-nothing. In a group of people who
  each take a reckless risk with a shared bad outcome, we ask not who authored the
  outcome but who could most easily have prevented it, who had the clearest view of
  what was at stake, who had a legitimate reason for running the risk, and whose contribution
  the outcome was most sensitive to. Those are matters of degree, and they could distribute
  responsibility unequally across the powers without making any of them the sole author.
  There is also something I find suspicious about the rhetoric of shared responsibility:
  a finding that blame is everywhere can function as a finding that it is nowhere,
  and the party with the most power to stop a catastrophe is often the one that benefits
  most when catastrophe is declared nobody''s fault.


  On the empirical step: I want to know whether the multi-causal view actually redistributes
  responsibility evenly, or whether it just changes what responsibility tracks — from
  intentions to risk-taking. If several powers accepted comparable risks for comparable
  stakes, even-handedness follows; but if one power ran a large risk for illegitimate
  stakes while holding the brake and refusing to use it, the multi-causal picture
  may leave differential responsibility intact.


