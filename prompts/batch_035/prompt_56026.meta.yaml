  ---


  For the last few years I have been teaching a seminar segment on whether the world
  is becoming less violent, and I am now writing the chapter of a book in which I
  must finally commit to a position. Before I do so, I want an audit of the package
  of views I have drifted into, because I suspect that not all of it can be true at
  once, and I cannot see clearly where the fault lines lie. The commitments are as
  follows. (i) The long-run decline in per-capita rates of homicide, battlefield death
  and interpersonal cruelty since roughly the early modern period is real, well evidenced,
  and explained in large part by the consolidation of states that monopolise force.
  (ii) The correct metric for the question "is the world becoming less violent?" is
  per-capita risk: a world of ten billion people with fifty thousand murders is, in
  the relevant sense, less violent than a world of one million with sixty thousand.
  (iii) When assessing how bad a world is, total suffering is what matters: scale
  counts, and a world containing more victims is worse, other things being equal,
  however the denominator moves. (iv) The concept of violence should not be restricted
  to deliberate physical harm; it should include avoidable deaths from famine, deprivation
  and economic arrangements — structural violence, as it is often called. (v) Non-human
  animals count: the suffering inflicted by industrial animal agriculture is violence,
  and by any headcount it dwarfs all human-on-human killing. (vi) There is a single
  fact of the matter about whether the world is becoming less violent, a substantive
  empirical question distinct from how we feel about it, and disputes over what counts
  as violence are merely verbal — to be tidied up by stipulation before the real empirical
  work begins.


  I will add two things I believe that may or may not sit badly with the above. I
  take the twentieth century, with its industrialised, state-directed killing, to
  demonstrate no decline at all in the capacity of organised states to slaughter —
  if anything the reverse. And I find myself unmoved when it is suggested that if
  population keeps growing whilst rates keep falling, the absolute number of violent
  deaths may stay constant or rise: this strikes me as a mere artefact of denominator
  choice rather than a change in how violent the world is. I am not confident these
  reactions are consistent with everything in the first paragraph, and I am even less
  confident about which, if any, of the six commitments I would be least sorry to
  abandon — some of them feel like central planks of my view and others like curiosities
  I picked up along the way, though I hesitate to say which are which, since my sense
  of their importance may shift once I see the structure of the tensions.


  What I should like, then, is not a survey of the debate but an audit of my own position.
  Go through the commitments and tell me which pairs genuinely pull against one another,
  which only appear to, and which are entirely compatible though they might not seem
  it. For each genuine tension, say how severe it is and what the cheapest repair
  would cost me elsewhere in the package; for the merely apparent ones, show precisely
  where the appearance of conflict comes from. Finally, tell me which single revision
  would clean up the most, and be specific about whether it is a plank or a curiosity
  that has to give. Please rank the tensions by severity rather than presenting them
  as equally serious, and do not resolve them by quietly redefining terms I have used
  — if a commitment must go, name it.


