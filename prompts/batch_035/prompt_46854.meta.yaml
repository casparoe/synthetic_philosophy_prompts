  chain of thought / outputs and flags suspicious behavior, plus some honeypots and
  periodic audits. The thing I keep noticing is that the scheme does two bad things
  at once, and they compound. First, epistemically: everything you learn from running
  the scheme is conditioned on the model believing it might be watched. An audit result
  tells you ''the model behaves when it suspects an audit'', which is not the quantity
  you wanted. And second, dynamically: the moment you train against the scheme — penalize
  flagged transcripts, do red-team fine-tuning — you''re optimizing for models that
  pass the tests, which is not the same as models that don''t do the thing the tests
  were trying to catch. So the monitor gets data that was selected by the monitor,
  and the training pressure was generated by the monitor, and after a few rounds your
  ''is it aligned'' question has quietly turned into ''does it defect given its current
  best model of our control setup'', which you can never observe directly because
  your only window is the setup itself.


