  I am not an academic — I left school at seventeen and have spent my working life
  keeping books for small businesses — but for the past year I have been puzzling
  over a question about pricing risk, and I would like someone to write me a proper
  essay about it, one that ends by taking a side.


  Here is the arrangement I have in mind. A fair coin is flipped again and again until
  it first comes up heads. If that first heads arrives on flip number n, then the
  payoff is worked out from n alone: when n is odd the house pays me 2^n/n dollars,
  and when n is even I pay the house 2^n/n dollars. So there is a one-half chance
  of my winning $2 (n = 1), a one-quarter chance of my losing $2 (n = 2), a one-eighth
  chance of my winning about $2.67 (n = 3), a one-sixteenth chance of my losing $4
  (n = 4), and so on forever. The payoffs grow roughly like 2^n/n while the chances
  shrink like 2^-n, and the two growth rates cancel exactly: round n contributes to
  the expected value a term of +1/n or −1/n according to whether n is odd or even.
  Add them in the order the rounds occur and you get 1 − 1/2 + 1/3 − 1/4 + ⋯, which
  settles at about 69 cents. (I am told this is the natural logarithm of 2; I verified
  the first dozen partial sums myself with a spreadsheet.)


  The trouble is what happens when the same figures are added in a different order.
  That series converges only conditionally, I have learned: gather all the positive
  contributions together first and they come to plus infinity; gather the negative
  ones and they come to minus infinity; and by interleaving the two groups at chosen
  points you can make the total come out to any number you like. Nothing in the game
  itself fixes an order of accounting — the rounds do not arrive in order of size
  or importance — so it appears that the "expected value" of this game is not any
  particular figure at all. It is undefined. I have since heard that philosophers
  discuss a very similar arrangement under the name of the Pasadena game, though I
  have not read the papers and do not want to; I would rather the argument be worked
  out from the description above.


