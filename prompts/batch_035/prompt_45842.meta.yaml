  "At the reception after a workshop on practical reasoning, two of my colleagues
  fell into an argument about whether genuine moral dilemmas are possible, and I could
  not tell at the end who had the better of it. I would like you to adjudicate it,
  move by move.


  The senior colleague, who works mainly in deontic logic, began with the standard
  impossibility argument. A genuine dilemma, he said, would be a situation in which
  an agent, all things considered, ought to do X, ought to do Y, and cannot do both.
  But that description is incoherent: if she ought to do X and ought to do Y, then
  she ought to do both; ought implies can; she cannot do both; so at least one of
  the two original oughts is not a genuine obligation at all, and the case is not
  a dilemma but a competition in which one duty wins and the other is overridden —
  a prima facie duty in Ross''s sense. Tragedy, he said, but no contradiction.


  My other colleague, who works on moral psychology and the emotions, went straight
  for the aggregation step. Ought-to-do-X and ought-to-do-Y jointly entail ought-to-do-both,
  she said, is a closure principle that looks innocent only when both obligations
  spring from the same source. Where two obligations have different sources — she
  offered the case of someone who has promised one person to be present at her wedding
  and, for excellent and unforeseeable reasons, promised another to accompany him
  to a medical procedure, the two events turning out to be fixed at the same hour
  in cities far apart — there is no further obligation to do both, and no mystery
  about why not: an obligation to do the impossible is precisely the thing whose existence
  is in dispute, so it cannot be used to conjure one into existence as an intermediate
  step.


  He replied in two parts. First, he said that even if he granted the failure of aggregation,
  he could not see what work the word "genuine" was doing for her. On her own account,
  the agent has, at the end, broken a promise and thereby wronged its recipient —
  done wrong, though through no fault of her own. He was happy to accept that; but
  wrongdoing without culpability is not a contradiction, and calling such cases "dilemmas"
  was a taxonomic preference, not a philosophical discovery. Second, he pressed her
  with a parity worry: if obligations from different sources do not aggregate, then
  neither do they compare — and yet it is obviously an open question which promise
  the agent should keep, so the two obligations must be commensurable after all; and
  commensurability is the beginning of a ranking, and a ranking does not leave two
  survivors.


  She answered that commensurability for the purposes of choice is not an ordering
  of normative standing. One promise can win the competition for action while the
  other remains in force, and the residue is what shows it: the agent''s guilt, the
  apology and compensation she owes, and above all the resentment of the person whose
  wedding she missed, which seems fitting rather than excessive — and fitting resentment,
  she said, is the response to being wronged, so the wronging must be real. His "genuine,"
  she continued, meant entails a formal contradiction, and that definition begged
  the question by building a single, consistent, aggregation-closed normative system
  into the word "ought."


  His last word was a dilemma of his own, aimed at her residue. Either the residue
  is dischargeable — a pro tanto duty to apologize and make amends, which, once paid,
  leaves nothing over, so that the case dissolves into a cost-benefit calculation
  plus a penalty — or it is not dischargeable, in which case the agent owes something
  she can never do, and she has smuggled the impossible obligation back onto his side
  of the ledger. They parted there, each certain the other had changed the subject.


