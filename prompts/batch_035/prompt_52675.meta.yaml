  The asker could be an alignment researcher running evals on a model, deciding when
  a behavior is "the same mechanism" as one seen in training vs. a new one. Or a red-team
  engineer deciding whether a failure mode seen in deployment is the same mechanism
  as one tested.


  Procedure: given a base model, a set of known failure modes from training evals,
  and a new behavior observed, decide whether it''s a new mechanism or a manifestation
  of a known one. Grounded in the conceptual question of what makes two behaviors
  the "same mechanism" — same circuit? same input distribution triggering? same generalizable
  pattern? The conceptual work: mechanistic sameness is not behavioral similarity;
  a behavior can look different but be same mechanism, or look same but different
  mechanism. Questions like: does it transfer across paraphrase, does it ablate the
  same, does it generalize to related inputs, etc.


  Make it concrete: asker is on an interp/anomaly-detection team at a lab; they run
  evals on a new model release; they get observations flagged by an anomaly detector
  on out-of-distribution prompts; they need a checklist to triage which flags are
  "known mechanism in new clothes" vs "genuinely new". Include hard cases: refusal-generalization,
  sycophancy showing up in new domain, deception. Two or three test cases to run the
  procedure on. Constraints: time (hours not weeks), no full circuit-level interpretability
  available — they only have black-box probes and limited SAE/activation access. Honesty
  about judgment calls.


  Frequency and stakes: triage weekly, feeds into decisions about release and monitoring.


  Write casually, 1-3 paragraphs, with a typo or two. Avoid citing specific papers.
  Mention "same mechanism" conceptual issue: behavioral vs mechanistic criteria —
