  categories gives tarka its own slot, separate from the four pramāṇas, and the tradition
  standardly says that tarka is not itself a pramāṇa but an auxiliary that helps establish
  vyāpti, the invariable concomitration (e.g. smoke–fire) that licenses an inference.
  Our two members couldn''t agree about whether that standard line is right.


  Priya argued tarka should simply be counted as a fifth pramāṇa. A pramāṇa is whatever
  produces knowledge, and tarka patently does: when you genuinely see that denying
  the smoke–fire connection would wreck things you cannot give up, you come out knowing
  the connection holds — settled, confident, and (in fact) right. She added that everyone
