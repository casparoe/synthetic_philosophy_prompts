  \ construct a careful chain.\n\nClassic: (1) Supererogation requires acts that are\
  \ good but not required. (2) If it would be good to do X, and I can do X, then...\
  \ no, that's too easy. Better: the \"necessarily, either A is required or A is not\
  \ best\" argument.\n\nTry: (1) If an act is supererogatory, it is permissible and\
  \ better (morally) than some permissible alternative — call it \"going beyond duty.\"\
  \ (2) 'Ought implies can' and rational choice: if I ought to do A, then A is required.\
  \ (3) If choosing a morally worse permissible option over a better one were wrong,\
  \ then the better option would be required. (4) But it is not wrong to keep your\
  \ afternoon free instead of donating it, so... hmm.\n\nBetter structure, the \"\
  subtraction\" argument from Heyd or the \"good Samaritan\" case: Consider a sequence\
  \ of cases: rescuing a drowning child at cost of $50 (required?), $500, $5,000,\
  \ ruining your career... Where does requiredness stop? That's the \"line-drawing\"\
  \ argument — if you can't draw a non-arbitrary line, either everything up to sacrifice\
  \ of life is required or nothing is. That's sorites-flavored. Combine: the argument\
  \ concludes supererogation requires an arbitrary cutoff, so either no supererogation\
  \ or no duties beyond convenience.\n\nAlternatively use the \"good enough\" argument:\
  \ (1) Moral requirements are the minimum of what morality demands. (2) The minimum\
  \ is what suffices for a morally acceptable outcome/character. (3) If an act leaves\
  \ the world better than the minimum, doing it is morally better. (4) A permissible\
  \ act cannot be morally wrong. (5) If not doing the better act is permissible, then...\
  \ Hmm.\n\nLet me write the classic argument: \n\n(1) An act is supererogatory only\
  \ if it is permissible, better (morally) than some permissible alternative, and\
  \ not required.\n(2) If an act is supererogatory, then there is a permissible alternative\
  \ to it that is morally worse.\n(3) It is always impermissible to do what is morally\
  \ worse when one could instead do what is morally better (a principle of moral practical\
  \ reason: if you know A is morally better than B and both are in your power, choosing\
  \ B is not merely suboptimal but wrong).\n(4) So the alternative to a supererogatory\
  \ act is impermissible.\n(5) But then the supererogatory act is required (the only\
  \ permissible option).\n(6) So nothing is supererogatory.\n\nAnd the paradoxical\
  \ punch: (3) seems right, and denying it makes room for \"moral alrightness of moral\
  \ loss\" — acting wrongly-ish but permissibly. The interesting moves: deny (3) via\
  \ \"satisficing\" or \"costs to agent count in the balancing\" — a move where the\
  \ agent's own interests have justificatory weight, so the \"worse\" act is only\
  \ worse impersonally. Subtle flaw: equivocation on \"morally better\" — better for\
  \ the world vs better all-things-considered including agent's stakes. If \"morally\
  \ better\" includes agent's costs, then the hero's act is not straightforwardly\
  \ \"better\" and (3) can be denied or the classification changes. Also: (3) conflates\
  \ \"worse\" with \"wrong\" — the step from comparative badness to impermissibility\
  \ is the flaw. This is genuinely hard and can be made harder by adding the \"proves\
