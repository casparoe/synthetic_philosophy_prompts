reasoning_summary: 'Pick domain and type. Let''s do "Is death bad for you? (the Epicurean
  argument)" with Type 1 (present someone''s summary of a view and ask whether it
  is fair). That works well: a popular book summary of Epicurus''s argument with subtle
  misrepresentations.


  The summary needs subtle errors: e.g., conflating "death is nothing to us" with
  "death is not bad at all for anyone" (Epicurus held death is neither good nor bad,
  but deprivation accounts etc.). Common misrepresentations:


  - "Epicurus proved you cannot be harmed by death because you''re never around when
  it''s bad for you" — the timing/symmetry argument conflated with the "no subject
  of harm" argument.

  - Overstating as a proof/refutation.

  - The symmetry argument (Lucretius) attributed to Epicurus as if it were a premise
  rather than a supplementary argument.

  - Claim Epicurus thought you shouldn''t fear anything / that he denied death could
  be bad for your survivors.

  - Conflating fearing death with preferring not to die (Epicurus allows rational
  avoidance).

  - Presenting Nagel/Feldman deprivation response as a refutation presented as settled.


