  The summary (in the asker''s paraphrase/quote — I write it): "Epicurus argued that
  death can''t be bad for you, because when death is present you no longer exist,
  and when you exist death is not yet present — so there is never a time at which
  death is bad for you. Since a harm requires someone who suffers it, and the dead
  have no experiences at all, death is not a harm. He also noted that the time after
  your death is a mirror image of the time before your birth, and you don''t regret
  not having lived before you were born, so you shouldn''t mind not living after you
