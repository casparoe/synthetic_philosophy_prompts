  to test whether Kant''s treatment of animals can actually be turned into a procedure
  a committee could run.


  Set aside whether Kant is right. His position, as I understand it, is that we have
  no duties to animals, only duties regarding them: cruelty toward animals is wrong
  because of what it does to the agent — it dulls the sympathy on which our duties
  to humanity depend — and because animals, as sentient fellow laborers of a sort,
  provide an instructive analogy to humanity (his example of the old working dog who
  ought not be cast off once he can no longer serve). Everything hinges on that rationale.
  So please write a decision procedure that the non-philosopher members could actually
  apply: an ordered list of questions, what counts as a sufficient answer to each,
  at which question the procedure terminates in a no, and — this is the part I most
  want to see — where it terminates in a handoff because the question is one of values
