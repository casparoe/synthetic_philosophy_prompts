  above it. (6) A circular chain transmits nothing net, like paying off one credit
  card with a cash advance on another at the same bank. (7) So if anything is justified,
  it''s by an infinite chain. (8) But being justified in believing p requires possessing
  the chain that justifies p, and possessing a chain means having actually gone through
  each link. (9) Humans are finite; no one has ever entertained infinitely many reasons.
  (10) Therefore no one has ever been justified in believing anything — not that the
  sun rose this morning, not that 2+2=4, not the premises of this very argument.


