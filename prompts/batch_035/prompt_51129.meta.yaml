  "next week, one day Monday to Friday, there''ll be an exam, and it''ll be on a day
  none of you expects." The students go home and reason it out. If by Thursday evening
  the exam hasn''t happened, it''d have to be Friday, but then they''d be expecting
  it Friday morning, which breaks the teacher''s promise, so it can''t be Friday.
  Strike Friday off. But now with Friday gone, if by Wednesday evening nothing''s
  happened it''d have to be Thursday, and they''d expect that too, so strike Thursday.
  And so on down the whole week until every day is struck off and the conclusion is
  the teacher''s promise is impossible, it just can''t be kept.


  Except — and this is the bit that keeps me up — the exam then happens on, say, Wednesday,
  and nobody saw it coming. The promise came out TRUE. So the striking-off argument
  must have a hole somewhere, and I can''t find it. Every single step looks airtight
  when I check it on its own.


  Now my mate has taken this and run somewhere I don''t want to follow. He says: (a)
  the striking-off argument is a kind of reasoning where you settle the last step
  first and then work backwards, (b) it led to a flat wrong conclusion here, so (c)
  that whole way of reasoning is unreliable, period. He points at those game theory
  bits you see online, where two people take turns either passing a pot of money along
  or grabbing it, and whoever grabs at the right moment wins, and the textbook answer
  is supposed to come from working out what happens at the very last turn and reasoning
  back from there. He says the exam thing shows all of that is built on sand and the
  "textbook answer" is junk too. And then he got grander: he says any prediction about
  what people will know in the future is suspect for the same reason, so the exam
  thing is basically a proof that you can''t trust working-out-the-end-first anywhere,
  from chess endings to negotiating a lease.


  That last step smells wrong to me. When I work out a chess ending, that''s just
  about the pieces, no promise involved, nobody''s word has to come true. The teacher''s
  promise is about the students'' own expectations, including what they''ll conclude
  from the promise itself — the thing doing the work is pointing at itself. I think
  that difference matters but I honestly can''t say why in a careful way, and my mate
