  and I want to keep thinking about it in the only way I know how. She is a staunch
  precise Bayesian: every rational agent has a single probability function, and where
  evidence is sparse you either pick something and update, or you''re simply not yet
  in the business of making decisions. I kept insisting that some epistemic states
  are better modeled by a set of probability functions — a credal set — with your
  credence in an event being the interval spanned by the set, and decisions made by
  rules like Γ-maximin (evaluate each act by its worst expected utility over the set)
  rather than by maximizing a single expectation. She answered with the objections
  I now know by heart: that intervals over probabilities are behaviorally meaningless
  once you have to bet, that Ellsberg-style preferences can be rationalized away as
  ambiguity about your own utilities rather than probabilities, and — the one that
  stuck — the dilation problem, where conditioning on evidence unrelated to an event
  can make your interval about that event wider rather than narrower, which she takes
  to be a reductio.


