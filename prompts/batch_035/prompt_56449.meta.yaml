  Argument sketch: My friend''s argument:

  1. The badness of pain must explain why pain gives us a reason to avoid it / why
  it''s pro tanto wrong to inflict it.

  2. Pain asymbolics have pain (they localise it, rate its intensity) but it gives
  them no reason to avoid it — they don''t mind it, sometimes smile during noxious
  stimuli.

  3. If something''s badness explains avoidance reasons, and asymbolics have no avoidance
  reason, then asymbolic pain isn''t bad.

  4. The only difference between normal pain and asymbolic pain is downstream processing
  (affective component) — the sensory discriminative component is intact.

  5. So the badness of normal pain is located entirely in the affective component,
  not the sensation itself.

  6. But the affective component just is a pattern of aversion/avoidance dispositions
  (or: the suffering is just the disposition); the felt quality of pain contributes
  nothing to badness.

  7. So the felt "hurting" quality of pain, considered in itself, is not bad at all
  — pain''s badness is exhausted by its dispositions.

  8. But then anything with the right dispositions would be equally bad, and a spinal
  reflex withdrawal... something proves too much: e.g., a robot with avoidance dispositions
  has pain as bad as ours; or if we could give someone a pill that removes dispositions
  while keeping the feel, we''d have done nothing bad by making them feel agony they
  don''t mind.


