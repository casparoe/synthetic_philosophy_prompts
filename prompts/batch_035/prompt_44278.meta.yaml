  an argument for unconditional benefits smuggled in through sympathy. It gives us
  the most sympathetic claimants possible -- Daniel, a hardworking joiner who wants
  to go back to work and literally made a wooden mobile for the kids'' room; Katie,
  a mother who goes hungry so her kids can eat. Nobody in the film lies to the system
  except when the system makes lying rational (Katie shoplifting, Daniel selling his
  furniture/taking cash-in-hand work after his sanction). So the audience never has
