  Argument sketch (heritability):

  1. Heritability of a trait in a population = fraction of variation in the trait
  explained by genetic variation (twin studies etc.).

  2. A character like number of fingers: essentially 100% "genetic" — everyone has
  the genetic blueprint for five fingers.

  3. Yet thalidomide / accidents produce missing fingers — environment changes trait
  despite "genetic" trait.

  Hmm, that''s about norm of reaction, not quite "proves too much."


  Better "proves too much" argument:

  (1) Twin studies put IQ heritability at ~0.8 in adults in wealthy countries.

  (2) Heritability of 0.8 means 80% of differences between people are caused by genes.

  (3) If differences are caused by genes, then changing the environment can''t change
  the differences.

  (4) So equalizing environments (same schools, same food) would leave the differences
  exactly as they are.

  (5) But if we equalize environments, environmental variance goes to zero, so heritability
  must go to 1 — consistent with (4).

  (6) So programs like Head Start or better nutrition can never reduce gaps.

  Conclusion seems to prove too much: but height is also ~0.8 heritable in rich countries,
  yet average height rose 20cm over a century in the Netherlands — environment changed
  means massively. Also heritability in poor countries is much lower (~0.3-0.4 for
  IQ), which seems to contradict (4) if genes are the cause of differences.


  The subtle flaw: heritability is variance decomposition within a population under
  a specific environment distribution; it says nothing about responsiveness of means
  to environmental change, and equalizing environments changes the variance partition.
  Also (3) equivocates between "differences among individuals" at fixed environment
  vs. across environments.


