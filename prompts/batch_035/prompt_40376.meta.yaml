  You are grading a midterm for an upper-level undergraduate seminar... Question:


  "Consider the fitting-attitudes (FA) analysis of value, according to which something
  is valuable just in case it is a fitting object of some pro-attitude (desire, admiration,
  favour). (a) Present the ''wrong kind of reasons'' objection to FA, using a case
  in which an agent is bribed or threatened into a pro-attitude toward something worthless
  or bad. (b) Explain the distinction between object-given and state-given reasons
  for attitudes, and evaluate the proposal that FA can be rescued by restricting the
  analysis to object-given reasons. (c) Say briefly whether an analogous problem arises
  for belief, where we can distinguish evidential from pragmatic reasons."


  Student answer:


  "1. The fitting-attitudes analysis is a version of the buck-passing view: it says
  that for x to be good is for x to have properties that provide reasons for desiring
  or favouring x. The wrong-kind-of-reasons problem is brought out by cases of coercion.
  Suppose a demon tells you that unless you desire to drink a vile, painful potion,
  you will be tortured for a year. Clearly you ought to desire to drink it: the alternative
  is far worse. So there is a decisive reason to desire drinking the potion. But drinking
  the potion is not in the least good or valuable. By the analysis, then, the potion
  would have to be good, which is absurd. So the fitting-attitudes analysis is refuted.


  2. Philosophers have distinguished object-given reasons, which obtain in virtue
  of the properties of the attitude''s object, from state-given reasons, which obtain
  in virtue of facts about the attitude-state itself, such as its consequences. The
  demon''s threat is state-given: it concerns what will happen to you if you are in
  the state of desiring. A reason is of the wrong kind iff it is state-given. This
  gives the solution to the problem: we simply revise the analysis to say that x is
  good iff x has properties that provide object-given reasons for desiring x. Since
  the demon''s reason is state-given, it is excluded, and the counterexample is blocked.
  The analysis is thereby saved.


  3. The same issue arises for belief. Evidential reasons concern the truth of what
  is believed; pragmatic reasons, such as a promise of a reward for believing that
  a business venture will succeed, concern the benefits of believing. However, the
  parallel is only apparent. Since, as Bernard Williams argued, we cannot believe
  at will, pragmatic considerations cannot be reasons for belief at all; they are
  at best reasons to bring it about that we believe, say by taking a belief-forming
  drug, and those are reasons for actions like pill-taking, not for the belief itself.
  Since only evidence is a reason for belief, there are no wrong-kind reasons for
  belief, and the problem simply does not arise in epistemology."


