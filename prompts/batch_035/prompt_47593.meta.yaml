  For the ranking I want criteria made explicit — how much the implication depends
  on contested premises, how robust it is to the obvious confounds, how much it would
  actually change what we do — not just a list.


  A few things from the argument I specifically want you to evaluate rather than skip.
  Sam dismissed the compositional worry (wealthy countries have different occupational
  structures, so "more gendered careers" might partly be an artefact of which jobs
