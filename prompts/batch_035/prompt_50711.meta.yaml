  A disagreement broke out between two friends of mine at dinner, over whether it
  is misleading to say the Classic Maya ''collapsed''. I''ll give it in the order
  it happened, and I''d like you to adjudicate each move — say who is right at each
  step, and what if anything both are missing.


  (1) Maya (a historian of period... no, just "Dan") opened by saying that ''collapse''
  is a loaded term: the Terminal Classic period saw the dynastic kingdoms of the southern
  lowlands cease erecting monuments and lose most of their population, but the Maya
  people didn''t disappear — cities in the north, such as Chichen Itza, rose and flourished,
  Maya languages continued to be spoken and written, and millions of Maya live in
  the region today. So what collapsed was a political system, and calling it the collapse
  of a civilisation implies something died that in fact persisted. Calling it a ''transformation''
  is more accurate.


  (2) Emma replied that this proves too much: by that standard nothing ever collapses,
  because something always continues. The western Roman empire ''collapsed'' and yet
  Byzantium carried on Roman law, Greek learning... and Italian cities persisted;
  if continuity somewhere in the tradition is enough to downgrade ''collapse'' to
  ''transformation'', the word loses its use entirely. And it has a use: there''s
  a real difference between a society that downsizes in an orderly way and one where
  the coordinating institutions — the ones that could rebuild aqueducts, keep records,
  run long-distance trade — fall apart faster than they can be replaced. The southern
  lowlands lost the ability to sustain cities of that scale within a couple of generations;
  that difference in timescale and completeness is what ''collapse'' tracks.


  (3) Dan: the word ''collapse'' also carries a value judgement — it''s always the
  perspective of the elite... He said "collapse" is written from the viewpoint of
  the people who benefited from the old system: priests, kings, scribes. For a farmer,
  the end of the monument-building cycle might have meant the end of massive corvée
  labour and dynastic wars, and we have no way of knowing whether the average person''s
  life got worse. Calling it ''collapse'' from above enshrines the elite ledger as
  the ledger. Emma''s aqueduct test is an elite test too: aqueducts serve cities,
  and most people didn''t live like urban elites.


  (4) Emma: it''s true we can''t survey peasant welfare, but that cuts both ways —
  if we can''t know that ordinary life improved, we also can''t claim it did, and
  in the meantime we do know some things nobody would call elite concerns: population
  fell dramatically across the lowlands (whole regions were largely depopulated —
  that''s not a political reorganisation, that''s mass death or displacement), and
  whatever the cause — drought, warfare, soil exhaustion — the people who survived
  it did not experience it as a lifestyle change. She said Dan''s point (3) licenses
  calling anything short of extinction ''change'' and she suspects his real motive
  is a fashionable dislike of doom narratives, not a discovery about the Maya.


  (5) Dan closed by saying Emma''s last remark was cheap, but he accepted part of
  her point (4): if population decline of that scale counts as evidence, then the
  dispute is not about the word ''collapse'' at all — it''s about which facts are
  on the table, and if they agreed on the facts they''d agree on the word. He said
  that shows the terminology debate is shallow: the real work is empirical, and philosophers
  of collapse should get out of the way of archaeologists. Emma said no: the disagreement
  showed exactly the opposite — they''d agree on all the facts and still disagree,
  because ''collapse'' isn''t a report of a fact pattern but a choice of comparison
  class (cities of 900 CE compared to cities of 750 CE? the region compared to itself?
  the lowlands compared to the north?), and choosing a comparison class is a judgement
  that archaeology can''t make for you.


