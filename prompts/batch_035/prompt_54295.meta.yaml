  all this presuppose? On its face it presupposes that knowing things about the person
  in front of you changes how you evaluate them. But here''s what I can''t decide:
  does it presuppose the strong thing — actual cognitive penetration, where believing
  the violinist is a woman literally changes how the sound sounds to you — or just
  the weaker thing, that you hear it the same and your judgment downstream gets skewed?
  Because the fixes are different... if it''s just downstream bias you could in principle
  debias the judge or use scoring rubrics, no screen needed. If it''s penetration
  you have to control the input itself, which is what the carpet is doing.


  And there''s a second thing that puzzles me. Courts do both directions at once.
  We blind the audition committee but we let an eyewitness look at a defendant in
  court, and courts now allow expert testimony about the cross-race effect — that
  you literally discriminate faces of other races worse — so the law is happy to treat
  perception itself as expectation-shaped there. Yet at the same time the whole evidentiary
  status of ''I saw it with my own eyes'' rests on perception as a neutral channel...


  Third: does blind auditioning presuppose an aesthetic claim that the value of a
  performance supervenes on the acoustic signal alone, stripped of context? because
  plenty of people think hearing that a phrase is a quotation of an earlier movement,
