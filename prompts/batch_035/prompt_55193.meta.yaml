  Prompt:


  "Two philosophers have spent a decade arguing past each other about moral responsibility.
  The first is a Strawsonian: she takes the lesson of Strawson''s ''Freedom and Resentment''
  to be that the reactive attitudes — resentment, gratitude, hurt feelings, guilt
  — are constitutive of interpersonal life, that the participant stance is not in
  the market for a general rationale, and that determinism could not, and in any case
  cannot, undermine it... The second is a free-will skeptic in the Pereboom tradition:
  he holds that desert-entailing blame requires a kind of control — roughly, being
  the ultimate source of one''s actions — that no deterministically or indeterministically
  shaped agent has, that manipulation arguments make this vivid, and that we should
  gradually replace blame with forward-looking moral address of the kind we already
  extend to children and the severely mentally ill.


  They have finally agreed to write an adversarial-collaboration joint statement,
  and you are to draft it.


  The statement should contain:


  1. A numbered section of claims both can sign. These should be substantive, not
  diplomatic filler: e.g., about what resentment''s phenomenology presents its object
  as; about the fact that reactive attitudes are, in practice, only partially responsive
  to argument; about what the objective attitude can and cannot do; about which existing
  practices (excuses, exemptions, mitigation) both read the same way.


  2. A disagreements table in which each residual disagreement is stated twice — once
  in wording the Strawsonian would accept as accurate to her view, once in wording
  the skeptic would accept as accurate to his — with no side''s formulation smuggling
  in the other''s presuppositions.


  3. A cruxes section. At least these three, plus any others you judge genuine: (a)
  whether Strawson''s case for the reactive attitudes is a psychological impossibility
  claim, a normative vindication, or a plea for ordinary-language description — and
  which of these the skeptic''s demand for a justification of resentment actually
  engages; (b) whether reactive attitudes carry an intrinsic desert claim, or whether
  they can be understood as moral address that is severable from desert (the Strawsonian
  will want the second disjunct for ordinary blame but perhaps not for resentment''s
  felt character; the skeptic will deny the severance); (c) whether the skeptic''s
  revisionary program is symmetrical — whether it applies to guilt and self-blame
  as much as to resentment, given that first-personal attitudes partly constitute
  our agency in ways third-personal blame does not.


  4. For each crux, a case, argument, or thought experiment that both agree bears
  on it, with each party''s prediction written down in advance. You are free to invent
  stipulated scenarios (e.g., a community that succeeds in raising its children with
  blame-minimized but expectation-rich moral address, or a manipulated agent stipulated
  to be behaviorally indistinguishable from an ordinary wrongdoer), but the two sides
  must disagree about the prediction or the import, not about whether the case is
  well-formed.


  5. A short closing section: if any part of the residual disagreement is verbal —
  e.g., if ''holding responsible'' is being used by one side to mean desert-entailing
  blame and by the other to mean moral address — identify it, explain why it is verbal,
  and say what would remain substantive once it is tidied away.


  Constraints: keep each side''s stated position recognizably Strawsonian and recognizably
  Pereboomian respectively, not a generic compatibilism vs. a generic skepticism.
  No side may be granted the last word."


