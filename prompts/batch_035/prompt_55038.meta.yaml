  I''m a PhD student in philosophy, working mostly on philosophy of language, and
  in two weeks I''m presenting to our department''s vagueness reading group. We''ve
  been going through the standard stuff all semester — sorites, supervaluationism,
  epistemicism, Wright''s tolerance principle — and as the last talk of the term each
  grad student presents their own "take." Here''s mine, and I need a Q&A prep sheet.


  My line: the sorites paradox isn''t really about vague *predicates* being weird.
  It''s about measurement. Roughly: a vague predicate ("tall", "bald", "heap") functions
  as a coarse measuring instrument — it carves up a quantity dimension (height, hair
  count, volume) at a granularity much coarser than the dimension itself supports.
  Vagueness just is the gap between the granularity of the instrument and the granularity
  of the dimension. The tolerance intuition ("one grain can''t make a heap") is then
  a *true* fact about the instrument — single-step differences are below its resolution
  — and the paradox arises only when we treat instrument-relative tolerance as a property
  of the quantity and let it chain across the whole scale. So the "paradox" is a kind
  of unit error, like concluding that a meter stick can''t measure anything because
  each mm of wood looks the same to the naked eye. On this view I neither want epistemicism
  (there''s no fact to be ignorant of, the instrument genuinely doesn''t resolve it)
  nor classic supervaluationism ( precisifications aren''t ad hoc rules, they''re
  just finer instruments). And I get to say the sorites is valid-ish reasoning from
  a false premise about what kind of thing a predicate is.


  The audience: about ten people. The reading group is mostly grad students who''ve
  drunk the supervaluationist kool-aid, one logician who will only care whether my
  "valid-ish" handwaving can be made precise, and our one faculty mentor, a hardline
  epistemicist in the Williamson tradition who thinks every genuine predicate has
  sharp boundaries and vagueness is just ignorance. There''s also a first-year who
  asks a genuinely brutal question at every talk without realizing it. So: predict
  the objections in roughly the order they''ll come, phrased the way each of those
  people would actually phrase them, with a short reply I can deliver in under a minute,
  a note on what I should concede up front, and the weakest point in my own position
  — the one I should be ready to defend rather than hope nobody notices.


  Also, honestly: if you think the whole "measurement instrument" framing is confused,
