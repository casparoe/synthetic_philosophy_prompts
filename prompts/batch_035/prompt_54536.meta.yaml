  I chair the Clinical Conduct Committee of a mid-sized teaching hospital. The committee
  must decide, by recorded vote next week, two cases that came in six weeks apart
  and that I want treated in a single decision memo, because they force the same question.


  The cases: Nurse A and Nurse B, each in separate incidents, administered a medication
  without performing the required allergy-status check. The circumstances were closely
  matched: same ward, same night-shift staffing shortfall, same interruption at the
  medication cart, and each skipped the same step for the same stated reason. In Nurse
  A''s incident the patient happened not to be allergic to the drug; the error was
  caught at the next chart review and logged. In Nurse B''s incident the patient was
  allergic, suffered an anaphylactic reaction, and spent two nights in intensive care.
  Both nurses have clean records and both reported their own errors.


  Our sanctioning policy says sanctions must be "proportionate to the outcome of the
  incident," which reads as directing a significantly harsher sanction for Nurse B.
  Our charter also requires consistency across "relevantly similar" incidents, and
  the committee is split on whether these are relevantly similar. One member keeps
  invoking something she calls the problem of moral luck, arguing that the difference
  between the two cases is pure luck and it would be unfair to let it determine the
  nurses'' careers; another answers that the hospital sanctions conduct through its
  consequences all the time and that nothing unfair happens when outcomes that were
  risked actually materialize. A third worries that equal sanction would tell the
  public we treat a near-miss as seriously as a serious harm, which the public will
  not accept, and that our job includes maintaining trust, not only fairness to staff.


  Please draft the decision memo I will circulate before the vote. It must:

  - contain one clear recommendation the committee can vote on (I am open to equal
  sanctions, differentiated sanctions, or differentiated sanctions paired with some
  formal mechanism, such as a published harm-tier rubric or a mitigation letter to
  Nurse B''s file, so state your recommendation precisely);

  - give the reasons in terms the whole committee can weigh, treating the strongest
  argument on the losing side honestly rather than disposing of it;

  - address head-on whether the difference between the two incidents is a difference
