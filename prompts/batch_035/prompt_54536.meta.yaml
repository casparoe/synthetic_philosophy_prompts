  - consider what precedent the recommendation sets for the next pair of cases, including
  a case where the harm is worse, and a case where a third identical incident ends
  in no harm at all;

  - and be usable by colleagues who are not philosophers: no more than one paragraph
  of explicitly philosophical framing, if any.


