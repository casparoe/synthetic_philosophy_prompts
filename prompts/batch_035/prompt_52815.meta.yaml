  acceptance practices.

  (3) So any individualist explanation must explain those beliefs, which requires
  citing social facts.

  (4) Either the individualist builds the social fact into the "initial conditions"
  (smuggling in what''s to be explained) or explains the belief individualistically
  too.

  (5) If they explain it individualistically, the same problem recurs at the level
  of how those individuals acquired the belief, and so on — infinite regress.

  (6) Therefore any individualist explanation either smuggles in holistic facts or
  never terminates; so MI is false and social facts are autonomous.


