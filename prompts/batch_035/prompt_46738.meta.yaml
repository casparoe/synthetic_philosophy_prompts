  Actually the "prove too much" type could be great for anekāntavāda:


  (1) Every proposition about a complex object is only true from a standpoint (anekāntavāda).

  (2) "From a standpoint" = the proposition is true only relative to some partial
  description.

  (3) Contradictory propositions can each be true from their standpoints.

  (4) So there is no standpoint-free fact about complex objects.

  (5) But then the proposition "every proposition about a complex object is standpoint-relative"
  is itself either about a complex object (in which case it''s only relatively true,
  and the relativist can''t assert it against the absolutist) or it''s not (but then
  some truths are absolute, which contradicts (1) as universally applied).

  (6) Plus: Jain theory itself claims the sevenfold predication (syādvāda) is the
  complete and correct account — an absolute truth.


