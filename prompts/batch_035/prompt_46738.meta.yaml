  Let me do the lesser evil voting argument, "proves too much" type. Construct:


  (1) You are morally responsible for the foreseeable consequences of your vote.

  (2) If you vote for a candidate who will do terrible things, you are partially responsible
  for those terrible things, even if the alternative would do worse things.

  (3) Voting for a candidate who will do terrible things is like contributing to a
  harmful collective action — you wouldn''t give $5 to a murderer who promises to
  murder slightly fewer people than a rival murderer you refuse to fund.

  (4) Therefore voting for the lesser evil is still wrong — you should instead vote
  third party or abstain.

  (5) But the parallel reasoning proves too much: it also shows you shouldn''t pay
  taxes in a state that does unjust things, shouldn''t buy from any company implicated
  in harm, etc. — all of which seem permissible or even obligatory.

  (6) So something must be wrong with the argument, but where?


  Alternatively: argument that because millions vote, your individual vote almost
