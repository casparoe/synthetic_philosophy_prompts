  Let me do a thought experiment for preferences vs. biases in morality. Specification
  idea: construct a case where a moral disagreement between two people is such that
  (a) if you describe it one way, the standard debiasing toolkit (calibration, perspective-taking,
  statistical base rates) applies and says one party is biased; (b) described another
  way, it''s a mere difference in moral preference, and "correcting" it would be illegitimate
  imposition. Constraints: realistic (family/workplace), no sci-fi, no stipulating
  "and in fact this is a bias." Then walk through: what test distinguishes preference
  from bias, does it deliver a verdict in the case, and identify which feature of
  the case does the work; how someone would attack it.


  Maybe more specific: the asker wants a case where the SAME underlying psychological
  trait in two people must be classified differently — one is a bias, one a preference
  — by any plausible demarcation test, i.e., a case that puts pressure on the preference/bias
  distinction itself. That''s nice and in-the-weeds.


  Concrete scenario: two siblings disagree about obligations to elderly parent. One
  thinks they owe extensive caregiving (loyalty/duties of filial piety), the other
  thinks parents forfeit claims by past neglect. Trait: both are influenced by self-interest.
  Or: disgust. disgust''s role — moral dumbfounding.


  Better concrete design: Trait = parochial favoritism toward one''s own group. Person
  A: hiring committee member who favors candidates from her alma mater — normally
  a paradigm bias (in-group favoritism). Person B: a parent who spends her limited
  charitable budget on her own children''s school rather than distant strangers —
  normally a permissible partiality. Both instantiate the same mechanism (in-group
  favoritism / partiality toward near-and-dear). Construct the case so both decisions
  are structurally identical in every respect the standard bias-literature test would
  probe (affect, self-serving explanation, resistance to counter-evidence, cultural
