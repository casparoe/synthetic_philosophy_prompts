  which variable does the work? Distance? Stakes? Institutional role?


  Constraints: realistic, one paragraph for the scenario, no trolley-esque devices,
  and the case may not stipulate verdicts. After: walk through three candidate demarcation
  tests (e.g., the coherence/reflective-endorsement test, the tracking-what-matters
