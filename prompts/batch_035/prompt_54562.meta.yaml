  ---


  I write novels for a living, and somewhere along the way I got converted to Bernard
  Williams''s line that all reasons for action are internal reasons. By that I mean:
  saying you have a reason to do something is only true if that thing hooks up to
  your subjective motivational set — your existing desires, commitments, dispositions
  — via a correct chain of practical reasoning. If nothing in you could, in principle,
  get you there, then it''s just false that you have a reason, however much I or anyone
  else might want to say you do. For my work this is a genuinely load-bearing belief:
  it explains why I can''t just decide a character ''realises'' she has a duty to
  her sister — I have to build the motivational bridge first or the scene reads fake.
  I''ve even built a plot device out of the strict version: a character who undergoes
  a motivational rewiring (deep-brain style manipulation during an illness, say) and
  comes out with a completely new, perfectly coherent set of caring about things,
  and the question of whether the new person was given reasons or merely given desires
  that mimick reasons. (Hmm, that might overcomplicate.)


  Ask: what would count against the internalist view? Not just "external reasons exist
  because morality" — I want the specific defeaters, sorted by how fatal. Which cases:
  the agent who lacks any motivation to help the drowning stranger; depression/brainwashing
  cases; future-directed reasons for the person whose set is empty; the charge that
  the view is circular... Which of these would Williams''s defenders concede count
  against it, and which would they dismiss. And please separate what''s actually settled
  among philosophers who work on this (e.g., that the internal/external distinction
  is worth drawing? even that''s contested) from what''s genuinely up for grabs —
  I don''t want a contested reading presented as consensus. British English please.


  Make it casual: "I''ve ended up a true believer", "genuinely load-bearing for my
  writing", typos: "charachter", "arguement", "wahtever". One or two.


  Also niche injection: mention "future Tuesday indifference" — Parfit''s case, reasonably
  well-known. Or the "deliberative" interpretation debate (Williams''s later "internal
  reasons: sometimes" and the debate over whether his argument presupposes what it
  needs to prove — the "no external reasons" argument via the practical soundness
  of "I have reason to X" utterances). Also mention "right kind" vs "wrong kind of
  reasons" maybe? That''s a different debate. Keep focused.


  Structure the defeater list: cases the view must describe (amoralist who is fully
  informed and unmoved — Williams himself discusses the amoralist; despair/depression
  emptying the motivational set; reasons generated by manipulated desires; epistemic
  reasons — does internalism about practical reasons say anything about whether you
  have reason to believe?). And formal worries: does the argument that there are no
  external reasons presuppose an internalist standard of correctness for reasoning,
  i.e., is it circular? Does the view collapse into Humean instrumentalism or does
  the "correct deliberation" clause smuggle in normativity? Does it render advice
  irrational?


  Length: similar to examples, maybe 200-280 words.


