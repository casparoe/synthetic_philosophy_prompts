reasoning_summary: 'Let me pick a domain and type. Options: Vagueness and sorites,
  HCH/factored cognition, PR vs FPTP, affirmative action/quotas, Copycat/fluid concepts.


  Type options: essay on controversy with verdict; satire piece; verdicts-on-cases
