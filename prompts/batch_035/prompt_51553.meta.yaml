  Crisp; forced march sorites; Wang''s paradox; tons of cases). That works well.

  - Copycat/fluid concepts + verdicts-on-cases: concepts like "case-based reasoning
  about when concept application slips." Also good.

  - Affirmative action + essay type.

  - HCH + satire: an in-universe document from HCH world, e.g., a memo from a subconsultant,
  or an FAQ for workers inside HCH tree. That could be fun and in the weeds.


  I''ll do the verdicts-on-cases type with vagueness and the sorites paradox. The
  asker gives gut verdicts on cases:


  Cases:

  1. A forced march: asked "is 10,000 grains a heap?" ... person answers yes until
  suddenly one step they feel the pull to say "no" — verdict that the transition point
  feels arbitrary but real.

  2. Conditional vs unconditional premises: "if 10,000 is a heap, 9,999 is" — the
  asker rejects each conditional when asked individually but accepts every instance
  when shown them in a sequence.

  3. A single grain removed secretly (the "hidden removal" case): if grains are removed
  one at a time without you seeing the intermediate steps, asker thinks at some point
  it''s genuinely not a heap.

  4. Restored heap: removing grains then adding them back — verdict that adding back
  the exact grain changes things? Or the asker thinks there''s a "margin for error"
  — you can''t know exactly where the boundary is.

  5. Money case: a person with $1 underpaid by a penny... verdict that there''s a
  fact of the matter about when someone counts as rich? Or asker thinks "bald" is
  different from "heap."

  6. The asker''s friend is a supervaluationist sympathizer but the asker thinks some
  statements like "either there''s a sharp boundary or there isn''t" feels true.


  Hard-to-reconcile pair: asker rejects epistemicism (no sharp boundary intuition)
  but also thinks unrestricted excluded middle holds for "X is a heap" — tension.
  Also: asker thinks a millionaire and someone with one dollar less can both be "not
  rich" and "rich" indeterminately, but believes there is some number n such that...
  hmm.


  Also seed the sorites literature: mention they''re aware of supervaluationism, epistemicism,
