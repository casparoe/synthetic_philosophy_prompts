  \ format itself helps — it forces reasoning over the specific verdict list. But\
  \ maybe I can make it more novel.\n\nLet me reconsider the Pistorius episode-analysis\
  \ type — therapy/enhancement through a real episode. The prompt: analyze the Pistorius/CAS\
