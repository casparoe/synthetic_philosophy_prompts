  \ controversy through the therapy/enhancement distinction. Well-known episode, common\
  \ knowledge, good for both directions.\n\nOr Great Divergence + analyze real episode:\
  \ \"is 'why Britain and not China' well posed?\" through the Needham question —\
  \ but that's more of a conceptual prompt.\n\nLet me think which type fits best with\
  \ \"in the weeds\" but not super niche. The Pistorius episode with therapy/enhancement\
  \ is quite well-known (2007-2008 IAAF ban, CAS overturning in 2008). A model can\
  \ regurgitate standard stuff about Pistorius though — it's a famous bioethics case.\
  \ The prompt should inject something new: e.g., also fold in the later development\
  \ — after Pistorius ran in 2012, Markus Rehm, the German long jumper with a prosthetic\
  \ blade, was excluded from the 2016 Olympics because he couldn't prove the blade\
  \ gave no advantage. That's a well-known follow-up. Or the 2000s case of Ashley...\
  \ hmm.\n\nAlternatively, care ethics + prepare speaker: a hospital ethics committee\
  \ presenting care ethics-based staffing proposal to bioethicists trained in principlism.\
  \ That's decent but maybe generic.\n\nThe verdict-prediction type with the regress\
  \ problem: asker reports a colleague's verdicts across cases — e.g., circular justification\
  \ cases (Moore's paradox-ish), infinite chain cases (epistemic regress), the Münchhausen\
  \ trilemma. Predict her verdict on a new case, which rule she's running (foundationalism,\
  \ coherentism, infinitism, or something else), and which case would settle it. That's\
  \ neat: the earlier verdicts jointly consistent with coherentism and infinitism,\
  \ and the new case diverges. This fits the type exactly and is in the weeds.\n\n\
  Let me design: \"My epistemology tutor's verdicts on cases\" — cases about justification\
  \ structures:\n1. Belief supported by an inference from premises that are themselves\
  \ supported only by that very belief's truth (circular) — no justification.\n2.\
  \ A chain of reasons that terminates in a perceptual belief that isn't itself supported\
  \ by reasons but is appropriately caused — justification.\n3. A long but finite\
  \ chain that runs out before reaching anything self-supporting, each link supported\
  \ by the next but the last unsupported — no justification.\n4. Structured web where\
  \ each belief is supported by several others, no chain terminates, every belief\
  \ is supported, but there are circular paths everywhere — justification.\n5. Rule:\
  \ only chains that bottom out in non-inferential states confer justification → foundationalism\
  \ fits 1-4. But coherentism also fits: circular justification fails when the circle\
  \ is small, but the web case works because of mutual support breadth.\nNew case:\
  \ an infinite chain, each belief supported by the next, no circles, no terminus.\
  \ Infinitism says yes (or at least is the only theory that could); foundationalism\
  \ says no (no non-inferential base); coherentism — hmm, coherentism about a non-circular\
  \ infinite chain: no circles, so no mutual support, so coherentism says no. So the\
  \ new case distinguishes foundationalism from coherentism? Both say no actually.\
  \ Both say no. Hmm — the case needs to be one where candidate rules diverge.\n\n\
  Better: the new case should be one where coherentism and foundationalism give different\
  \ verdicts. E.g., a finite web with one small circle that includes a perceptual\
  \ belief plus inferential support... Or: the new case is an infinite non-circular\
  \ chain — here foundationalism says no (no foundation), coherentism says no (no\
