  Last month my roommate Dev and our friend Marta were over at my place, and we ended
  up watching a compilation of perceptual illusions. One clip has stayed with me,
  mostly because of the argument it started. Here is the clip: on a dark screen, a
  red disk flashes on the left; a fraction of a second later, a green disk flashes
  on the right; the two flashes alternate a few times. Nothing on the screen moves.
  Yet all three of us, independently, saw a single dot gliding from left to right
  that switched color, abruptly, roughly halfway across. The switch was the eerie
  part — it happened at a definite spot on the path, as if the dot had a schedule.


  Marta went first. "Notice when that experience could have been built," she said.
  "The color switch sits halfway across the path, but your brain could not have known
  the second color until the green flash actually arrived — it would have had to know
  the future. So the experience can''t have been assembled as it unfolded. The brain
  must have collected everything, waited for the green, constructed the whole glide
  with the switch in place, and only then handed it to you — stamped as live. It was
  a delayed broadcast dressed up as live coverage. So the experience happened later
  than it seemed to."


  Dev disagreed. "Then your experience is running behind the world all the time, and
  that can''t be right — you couldn''t react to anything quickly. And the broadcast
  analogy fails anyway. I think the experience happened on time; what got altered
  afterward was the record, not the show. You saw the flashes as they came in, and
  within moments your memory was doctored into the smooth glide-with-a-color-change
  story. The event happened when it seemed to happen; it''s only your memory that''s
  false."


  Marta said the reaction argument proves little: "a fifth of a second is nothing,
  and all perception is already late — the ''now'' you live in is always slightly
  manufactured. And your forged-record story has a worse problem: it says the color
  switch at the midpoint never happened to me at all, that I merely remember it. But
  I remember it as vividly as anything I''ve ever seen, and a memory is a memory of
  an experience. If the switch never entered my awareness, what exactly am I remembering?
  And if you say the constructed glide did happen, just ''outside awareness,'' then
