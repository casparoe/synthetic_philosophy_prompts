  \ regurgitatable — republican liberty is well-known to LLMs. The prompt shouldn't\
  \ name the concept (the type instructions say describe in everyday terms without\
  \ naming the underlying concept). That's fine — the test is whether the model recognizes\
  \ it.\n\nTo make it \"in the weeds,\" I could add more structure: multiple parties\
