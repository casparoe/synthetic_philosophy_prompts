  me set it: payoff is (-1)^n · 2^n / something. Standard Pasadena: payoffs alternate
  in sign, magnitudes chosen so terms are ±1/n, giving a conditionally convergent
  series. E.g., payoff (-1)^n·2^n/n... probabilities 2^-n, so terms are (-1)^n/n.
  Yes: P(first heads on toss n) = 2^-n, payoff = (-1)^n · 2^n / n, so term = (-1)^n/n.
  Alternating harmonic series converges to ln 2, but rearrangement gives anything.


