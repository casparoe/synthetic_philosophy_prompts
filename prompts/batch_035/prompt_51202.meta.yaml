  ---


  I teach a graduate seminar on collective action and rational choice, and we have
  just finished Scott Alexander''s essay "Meditations on Moloch" (2014). My students
  have absorbed the canonical picture of the multipolar trap: no actor can profitably
  deviate, no contract can be enforced, and the race to the bottom leaves every participant
  worse off than some coordinated alternative they all can see. They have also absorbed
  the complacency that comes with it — the assumption that the logic always points
  the same way.


  For next week, I want a thought experiment that cuts against the grain. Construct
  a scenario in which a genuine multipolar trap is, ex ante, better for the very actors
  trapped in it than the coordinated alternative would be — a race to the bottom that
  beats the escape hatch.


  The scenario must satisfy the following constraints:


  1. Realistic setting: firms, labs, schools, sports leagues, city governments — no
  science fiction, no perfectly rational hyperintelligences, no exotic enforcement
  technology. The racers should be ordinary self-interested actors who can read a
  balance sheet.


  2. It must be a genuine trap on its face: given that the others race, racing is
  strictly dominant for each participant; no binding contract, cartel, or regulator
  is available; and in the one-shot static version of the game the race equilibrium
  is Pareto-inferior to a feasible coordinated alternative. The coordinated alternative
  must be honestly described — a working consortium or standards body that credibly
  shares gains, not a strawman utopia.


  3. The twist: measured ex ante, from a point before anyone can commit, the total
  expected welfare of the participants themselves must be strictly higher under the
  trap than under the coordinated alternative. Third parties — consumers, future generations
  — may not carry the argument; the racers must be the beneficiaries.


  4. The metric being raced on must be locally valid: each individual step down must
  look, at the time and to the actor taking it, like a genuine improvement, not a
  known sacrifice. The trap must not depend on anyone being mistaken about their own
  incentives.


  The scenario itself should be one paragraph. Then demonstrate that each constraint
  is met: show the dominance reasoning, explain why enforcement fails, and explain
  why the trap wins on expected welfare despite losing on the static comparison. Finally,
  tell me which single feature of the case does the work — the thing whose removal
  collapses it back into an ordinary wasteful race — and describe what happens when
  you remove it. Then give the strongest objection available to someone committed
  to the standard Moloch picture (I anticipate the charge that the case merely shows
  the raced metric was mis-specified, and I want to know whether that reply is substantive
  or begs the question), and assess whether it succeeds.


  End your answer with a line beginning "Verdict:" containing only the name of the
  feature that does the work.


  ---


