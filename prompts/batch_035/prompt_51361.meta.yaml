  Six months ago my mother was diagnosed with early Alzheimer''s, and I moved her
  into assisted living near me and became her main point of contact. Until then my
  moral thinking ran entirely on rules and outcomes; now I notice I have firm gut
  verdicts about particular moments of caring for her, and I would like to know whether
  they add up to a principle, or whether some of them have to go. My verdicts: When
  she calls at 2 a.m. panicked about a misplaced purse, I get up and search with her,
  and I think that is right, even though by morning the purse would have turned up
  on its own and a brisk "we''ll look tomorrow" would have cost her nothing. When
  she asks why she keeps forgetting things, I let the question drift rather than name
  the diagnosis, and that feels right; but when she insists she is still safe to drive,
  my flat refusal feels right too, though it is the one thing she cannot be talked
  out of wanting. I declined to have her move in with me and arranged the residence
  near my home instead — she very much wanted to move in, and I still think I was
  right, which I cannot square with the thought that caring means responding to what
  she actually wants. My brother pays for her aide from abroad and never calls; in
  my gut he is failing her, even though his money secures more of her comfort than
  my visits do, visits she often does not remember an hour later. Her paid aide is
  more patient and more skilled with her than I am, and I cannot decide whether the
  aide''s care counts morally in the same way mine does, or is a different thing entirely.
  Is there a principle — or a small set of principles, each earning its place against
  a specific case — that captures these verdicts? It will have to say what caring
  owes to the cared-for''s own wishes, since I both refuse her wishes (the move, the
