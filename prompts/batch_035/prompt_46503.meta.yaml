  Draft:


  "I teach a seminar on philosophy and literature, and next term we pair Augustine''s
  treatise De mendacio with Ibsen''s The Wild Duck. I would like a reading of the
  play through Augustine''s doctrine of lying — one that takes both texts seriously
  and resists forcing either into the other''s service.


  On the Augustinian side: the definition he works with — ''that man lies, who has
  one thing in his mind and utters another in words, or by signs of whatever kind''
  — is deliberately narrow; error, silence, concealment, and even misleading truths
  fall outside it. The narrowness matters, because Augustine''s conclusions are severe:
  no lie is free of sin, not the merciful one, not the one told to save a life, and
  his late concession, recorded in the Retractationes when he nearly suppressed the
  book as obscure, was only that some lies are lighter than others — never that some
  are licit. (I''m not asking for citations; assume the standard picture of the doctrine.)


  On the theatrical side: Relling, the lodger-doctor, runs what he openly calls a
  policy of illusions — he furnished Molvik with his ''demonic'' possession and Hjalmar
  with the idea of a great invention to come, and he insists that the life lie is
  what keeps ordinary men on their feet: ''Take the life lie away from the average
  man and straight away you take away his happiness.'' Against him stands Gregers
  Werle, who arrives to strip Hjalmar''s marriage of its founding concealment and
  ends with Hedvig, asked to prove her love by a sacrifice, shooting herself. The
  play''s sympathy appears to lie with the liar against the truth-teller, which is
  precisely the outcome Augustine forbids us to prefer.


  What I want from the reading: (1) sort the deceptions of the play by Augustine''s
  categories... etc."


