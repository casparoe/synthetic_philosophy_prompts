  is rational whenever interaction is repeated, proving too much. Or a "summary fairness"
  about the evolution of cooperation.


  - Wittgenstein family resemblance + "summary fair": a textbook gloss on family resemblance
  that says Wittgenstein held concepts have no essence, so anything can be called
  anything — subtle misrepresentation (Wittgenstein didn''t say concepts are arbitrary;
  family resemblance involves overlapping similarities, and he acknowledged "a complicated
  network of similarities overlapping and criss-crossing"). That could be nice.


  - Hume on suicide: "Of Suicide" — could do a summary-fairness prompt about a professor''s
  characterization of Hume''s argument. But requires memorized specifics; the essay
  argues suicide doesn''t violate duties to God, neighbor, self. A fair-summary prompt
  could work without quoting.


  I think the best: prisoner''s dilemma/evolution of cooperation + "argument that
  seems to prove too much." E.g.:


  (1) In indefinitely iterated PD, TFT can resist invasion by defectors. (2) Once
  TFT gains a foothold among a population of defectors (clustering), it thrives. (3)
  Evolutionary success of a strategy in IPD is a mark of its rationality. (4) So cooperation
  is the rational strategy whenever interaction is repeated. (5) Real-life interaction
  is always repeated among members of a species (shadow of the future). (6) So defection
  in real life is never rational. (7) But then... free-riding, anonymous interactions.
  Conclusion absurd. Ask which premise to reject.


  Alternatively testimony + what-would-count-against-it. Let me weigh "in the weeds"
  quality. The PD argument can inject a niche-ish angle: e.g., involving the "shadow
  of the future," noise (Nowak-Sigmund generous TFT), and cluster-setting. The prove-too-much
  argument could hinge on a subtle slide from "can resist invasion" (collective stability)
  to "is rational for an individual," and from "evolutionarily stable among a set
  of strategies" to "rational in the game-theoretic sense" — the conflations there
  are genuinely interesting (Axelrod himself blurred evolutionary and rationality
  claims; rational players in IPD — backward induction, folk theorem).


  The argument:


  (1) In the indefinitely repeated PD, strategies that reciprocate cooperation, like
  Tit-for-Tat, can do better than persistent defectors as long as they interact with
  each other often enough (sufficiently large shadow of the future). (2) Axelrod''s
  tournaments showed TFT beating more complicated, less nice strategies. (3) A strategy''s
  evolutionary success against a field of rivals is a good guide to what it''s rational
  for an individual to do. (4) Human interactions are always (or almost always) iterated
  — nobody truly plays a one-shot game, since even strangers share a reputation system,
  society, etc. (5) Therefore cooperation is always rational (defection never rational)
  for humans. (6) Conclusion seems too strong: whistle-blowing, one-off anonymous
  exchanges, endgame effects (a professor told me about end-of-relationship defection
  — a known phenomenon: partners defect at the end of expected relationships). Ask
  which step fails.


  Actually the subtle flaw: (3) equivocates between evolutionary success (population-level,
  given a distribution of others) and individual rationality (best response to what
  others do); TFT is not Nash equilibrium in a given pair; also (4) overstates — shadow
  of future must be long enough; also "always" quantifier shift: TFT resists invasion
  when common but can''t invade from rarity without clustering; and there''s the folk
  theorem issue: many strategies are equilibria, so "cooperation is rational" doesn''t
  follow — cooperativeness of equilibrium depends on discount factors. The conclusion
  also slides from "cooperation can be stable" to "defection never rational."


  Alternatively, I could make it valid-ish and let the question be which premise to
  give up: e.g., (3) is the plausible premise with cost.


  I like this. But maybe testimony + what-counts-against-it is even more "in the weeds"?
  The PD one has good weedy stuff: noise, generous TFT, spatial clustering, the folk
