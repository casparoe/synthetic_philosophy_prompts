  Good combos:


  - Testimony reductionism vs anti-reductionism + "what would count against it": reductionism
  (Coady/Lackey territory). Ask what would count against reductionism about testimonial
  justification. That''s nice — a position with clear defeaters.


  - Prisoner''s dilemma + "proves too much" argument: iterated PD and cooperation
