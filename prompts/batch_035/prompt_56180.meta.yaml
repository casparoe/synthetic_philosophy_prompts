  I think process vs outcome supervision with the "grading a math test" analogy is
  great — analogy type. The analogy: outcome supervision is like grading only the
  final answer on a math test; process supervision grades each step of the derivation.
  People use it to argue process supervision gives more interpretable models, less
  reward hacking, better generalization, more robust to distribution shift. Where
  does it break: in training an LLM there''s no fact of the matter about "the step"
  — decomposition is model-internal; intermediate steps in CoT may not faithfully
  reflect computation (the reasoning trace isn''t the mechanism); the grader''s step-level
  rubric smuggles in outcome info anyway; a student''s steps are causal to the answer
  while CoT tokens may be post-hoc; grading steps assumes the process is legible.
  Also process supervision can teach Goodharting on step-look. And the analogy imports
  a teacher who knows the right process, whereas in ML we don''t have ground-truth
  correct reasoning for open-ended domains. And whether the conclusion (process supervision
  reduces reward hacking / improves ood robustness) survives.


