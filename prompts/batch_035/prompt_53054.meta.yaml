  die if she throws the switch, the death is part of what she intends; a distinction
  between intention and foresight cannot be sustained where the foreseen outcome is
  certain. Response: this objection fails, because the bystander does not desire the
  one''s death, and what intention amounts to is what the agent desires to bring about.
  Since she would prefer a world in which the one escaped the side track unharmed,
  she does not intend his death, and the doctrine survives."


