  "The doctrine of double effect (DDE) was introduced by Philippa Foot in her 1967
  paper ''The Problem of Abortion and the Doctrine of Double Effect'', which also
  gave us the trolley problem, including the famous case of the large man pushed from
  the footbridge. The doctrine descends from Aquinas''s discussion of private self-defense
  and holds that an action with both a good and a bad effect is permissible provided
  that (1) the act itself is not wrong; (2) the agent intends only the good effect,
  the bad effect being merely foreseen; (3) the good effect is not achieved by means
  of the bad effect; and (4) there is a proportionality between the good and bad effects.


  Applying the doctrine: in the bystander case, the agent who throws the switch intends
  only the redirection of the trolley; the death of the one worker on the side track
  is a foreseen side effect, not part of her plan. In the footbridge case, by contrast,
  the agent must intend the large man''s death, or at least use his body as a means
  of stopping the trolley, so the doctrine correctly rules it out. The doctrine at
  bottom just restates the familiar distinction between doing and allowing: the bystander
  who fails to act allows five to die, whereas the footbridge agent does something
  that kills. That is why our firm intuitions about the two cases have the content
  they do.


  Consider next the ''loop'' case, in which the diverted trolley would come back onto
  the main track unless it is stopped by the large man''s body, which happens to be
  on the side track. Here, too, the doctrine permits diverting, since the agent''s
  aim is merely to send the trolley onto the side track; the man''s death is still
  only foreseen.


