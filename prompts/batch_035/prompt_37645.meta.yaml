  A month ago I found myself engineering a sentence. A colleague asked whether the
  search committee had reached a decision about her, and I told her, truthfully, that
  no offer had been made — knowing she would conclude the committee was still deliberating,
  when in fact it had rejected her candidacy that morning. Every word I said was true,
  and I remember being quietly pleased with that; it felt like a scruple honored rather
  than a duty dodged. Since then a friend and I have been arguing about whether my
  pleasure was warranted, and he has produced an argument that has unsettled me more
  than I expected, because it does not stop at my case.


  His argument runs as follows. (1) If lying and merely misleading are morally different,
  the difference must lie in some feature the two acts do not share. (2) What they
  share is everything that seems to matter for responsibility: both speakers intend
  the hearer to come away with a specific false belief, both design their words to
  produce it, both foresee the hearer acting on it, and both could prevent the false
  belief by saying more. (3) What they do not share is only this: the liar asserts
  the false proposition, while the misleader asserts only truths and lets the hearer
  draw the false conclusion. (4) But a difference in the moral status of two acts
  must be a difference in what one does to someone, and both speakers do the same
  thing to the hearer — they get her to believe what is false. (5) Therefore there
  is no morally significant difference between lying and misleading. (6) Moreover,
  the reasoning is a template: wherever two acts differ only in the route by which
  they produce the same intended outcome on the same victim, they are morally on par.
  (7) So, by the template, there is no moral difference between murdering someone
  by handing him a drink you''ve poisoned and by refilling his glass after the poison
  is already in it; between repudiating a promise outright and rendering its performance
  impossible through conduct you fully intend to count as its abandonment; between
  a judge''s falsifying the record and his arranging for the clerk to mis-copy it.
  (8) But there are such differences — or at least I refuse to believe the difference
  between the first pair is nothing. (9) So the friend concludes that since he cannot
  give up (8), he must instead deny (2): the difference between lying and misleading
  is, after all, that the liar commits himself to the falsehood. And he says my case
  proves it: what I did was wrong, but differently wrong — I kept my word clean while
  making it useless.


  I don''t know what to say. I can feel that (4) is doing a lot of work and saying
  almost nothing — "what one does to someone" seems to mean "what outcome one produces
  in someone," which would beg the question against anyone who thinks the norm of
  assertion is itself something a speaker can violate. But I also can''t see how to
  make that thought precise without just announcing that moral differences can attach
  to the type of act rather than its effects, which is the very thing at issue. And
  I notice that if I reject (4), I owe an account of why the route to the outcome
  matters here but not everywhere — otherwise the friend will ask why handing over
