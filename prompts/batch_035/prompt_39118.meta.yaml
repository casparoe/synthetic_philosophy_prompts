  I am marking a batch of unseen examination scripts for a third-year undergraduate
  course in philosophy of mind, and I would like a second opinion on one script before
  I finalise the mark. The examination question, worth 25 marks, read as follows:
  "Eliminative materialists claim that the propositional attitudes of folk psychology
  may turn out not to exist. Explain how this claim differs from the reductionist
  claim that beliefs will be identified with states of the brain, and evaluate the
  self-refutation objection to eliminative materialism." The student''s answer is
  reproduced below exactly as written.


  "Eliminative materialism (EM), developed chiefly by Paul Churchland, holds that
  folk psychology — our everyday framework of beliefs and desires — is a theory, positing
  entities and rough general laws, such as the law that someone who desires that p
  and believes that action A will secure p will tend to perform A. Churchland''s case
  is that this theory has stagnated for some twenty-five centuries and still cannot
  explain sleep, memory, learning, mental illness, and so on. Since folk psychology
  is a theory, it can suffer the fate of any theory: just as ''phlogiston'' was not
  identified with oxygen but simply dropped, so mature neuroscience may posit nothing
  answering to ''belief''. This is what separates EM from the identity theory: the
  reductionist expects the posits of folk psychology to be identified with neuroscientific
  kinds, whereas the eliminativist expects them to be eliminated without replacement.
  Note also that EM targets propositional attitudes like belief and desire; it is
  not in the first instance a thesis about consciousness or sensation. In these respects
  EM is essentially the behaviourist''s doctrine in modern dress: the behaviourist,
  too, held that nothing inner answers to our psychological vocabulary, and the eliminativist
  simply adds neuroscientific detail. Moreover, the thesis is by now empirically established:
  brain imaging has located no belief-centres, so we have experimentally confirmed
  that beliefs do not exist. As for the self-refutation objection: it runs that in
  asserting ''there are no beliefs'', the eliminativist must believe what she asserts,
  so her theory refutes itself. I think this objection is decisive. The eliminativist
  cannot deny that she believes eliminativism to be true, so she must concede that
  beliefs exist after all, and hence that EM is false. No reply on offer escapes this;
  the theory is defeated by the very act of stating it."


