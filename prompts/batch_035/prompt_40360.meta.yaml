  \ both feel joy... hmm, B might say yes since both are joy). Make it: grandmaster's\
  \ satisfaction vs. a spectator's boredom relief? Getting complicated.\n\nDivergence\
  \ case for A vs B: a case with the same type of state, similar persons, but no external\
  \ metric — B says yes, A says no. E.g., \"two friends at the same concert, both\
  \ devoted fans of the composer, sitting in identical seats; one is moved to tears\
