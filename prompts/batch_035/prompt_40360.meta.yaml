  \ headache on 0-10; the student says 8, the farmer says 3. Can we say the student's\
  \ headache is worse?\" A (metric): yes, the scale gives the comparison. B (similarity):\
  \ no — the numbers reflect different reporting styles, not different experiences.\
  \ That's a nice divergence case!\n\nActually that's a great new case: self-report\
  \ scales. And it maps onto a real debate (pain scales in medicine, Robbins vs. Pigou,\
  \ \"extended preferences\").\n\nBut wait — I should be careful: the friend's verdicts\
  \ must be jointly consistent with both rules. Let me now craft 4-5 verdicts cleanly:\n\
  \nV1: Yes. Comparing the same kind of physical injury at different severities across\
  \ people: \"a fracture is worse for the person who gets it than a bruise is for\
  \ the person who gets a bruise.\" Both rules: yes.\n\nV2: Yes. Diminishing marginal\
  \ utility of money: \"losing $500 is worse for a graduate student than for her wealthy\
  \ uncle.\" A: yes via money metric. B: yes — how? Similar persons... Hmm, B needs\
  \ a story. Maybe B shouldn't be \"similarity\" but something else.\n\nLet me reconsider\
  \ candidate rules given the verdicts I want:\n\nAlternative candidate rules that\
  \ fit a \"yes to physical/economic, no to 'inner' qualitative\" pattern:\n- Rule\
  \ A: ordinal comparability via shared scales of observable quantities.\n- Rule C:\
  \ comparisons valid only \"within a single dimension of wellbeing\" but not across\
  \ dimensions or for heterogeneous values.\n\nHmm. The prompt doesn't need me to\
