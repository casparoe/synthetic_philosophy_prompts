reasoning_summary: "Let me pick a domain and type. Domain: \"Interpersonal utility\
  \ comparisons\" or \"Inverse reinforcement learning and inferring human preferences\
  \ from behavior.\" Type: \"Predict or recommend a verdict on a new case from someone's\
  \ verdicts on earlier cases.\"\n\nI think I can combine: Interpersonal utility comparisons\
  \ with the verdict-type prompt. E.g., a friend's verdicts on cases involving comparing\
  \ welfare across people, and a new case. Track record: friend says things like \"\
  a billionaire losing $100 matters less than a poor person losing $100\" (supports\
  \ comparisons), \"we can't say whether Bach's music gave a sophisticated listener\
  \ more pleasure than a simple person gets from pop\" (skeptical about certain kinds),\
  \ etc. Then new cases that distinguish candidate rules: ordinal comparability vs\
  \ cardinal comparability, within-person vs cross-person, similar-natures assumption,\
  \ etc.\n\nClassic literature: Lionel Robbins's skepticism about interpersonal comparisons\
  \ (ordinalist revolution), Pigou/distributional judgments relying on equal capacity\
  \ assumptions (\"if men are alike in nature\"), Harsanyi (extended preferences /\
  \ impartial observer), Rawls (against full comparability of utility but allows primary\
  \ goods), Donald Regan / extended preferences. Also \"Bernard Williams\" etc. But\
  \ the prompt should not require niche knowledge beyond what LLMs know — interpersonal\
  \ utility comparisons is standard economics/philosophy.\n\nDesign the track record:\
  \ friend's verdicts about whether certain comparisons are meaningful/possible:\n\
  \n1. \"A headache sufferer's headache is worse than another's\" — friend says: we\
  \ can meaningfully say a severe migraine is worse than a mild itch for anyone, but\
  \ can't compare two people's mild headaches.\n2. Money: friend accepts that a dollar\
  \ means less to a rich person than a poor person — progressive taxation justified.\n\
  3. Friend denies we can compare the joy of a connoisseur vs a simple person from\
  \ music.\n4. Friend accepts comparing across species? Maybe: says a dog's pain can\
  \ be compared with a human's pain (at least ordinally).\n\nThe candidate rules:\n\
  - Rule A (Harsanyi-style \"similar natures\"): comparisons legitimate only when\
  \ the individuals are relevantly similar / there's a common dimension (physical\
  \ intensity), not for heterogeneous qualitative states.\n- Rule B (extended preference\
  \ rule): comparisons legitimate only when based on a shared scale of measurement\
  \ like money or physical intensity — i.e., comparisons via an external metric, not\
  \ direct introspective comparison.\n- Rule C (everything is ordinally comparable\
  \ but nothing cardinally — no \"how much more\").\n\nNew case: something where these\
  \ diverge. E.g., \"Can we say that a person losing their sight suffers a greater\
  \ loss than another person losing their sense of smell?\" Or a case involving comparing\
  \ intensity across different sense modalities (loud noise vs bitter taste) — Rule\
  \ A allows (similar nervous systems), Rule B denies (no external metric). Or a case\
  \ involving two people from very different cultures with different evaluative vocabularies.\n\
  \nLet me construct carefully. Verdicts (all about \"can we meaningfully and correctly\
  \ say X is worse for A than for B\", where A and B are different people):\n\nV1:\
  \ Yes — a broken leg for a hiker is worse for her than a bruise is for another person\
  \ (physical injury severity scale, similar bodies).\nV2: No — comparing the disappointment\
  \ of a scholar whose paper is rejected with the heartbreak of a teenager's first\
  \ breakup; can't rank these across persons (qualitatively different, no common measure).\n\
  V3: Yes — a poor household's loss of $100 is worse for them than a millionaire's\
  \ loss of $100 (money, diminishing marginal utility — but that's within a common\
  \ metric; or is it about similar natures?).\nV4: No — whether a chess prodigy derives\
  \ more pleasure from a brilliant sacrifice than a beachgoer from a perfect wave\
  \ — no comparison.\nV5: Yes — a chronic pain patient's daily pain is worse than\
  \ a new patient's, based on self-reports using the same 0-10 scale? Hmm, that's\
  \ a common metric again.\n\nHmm, I want rules that fit all verdicts but diverge\
  \ on the new case. Let me think about two candidate rules:\n\nRule A (Common metric):\
  \ cross-person comparisons are legitimate iff there's a shared, intersubjectively\
  \ observable scale (money, injury severity, pain scales) — comparisons of inner,\
  \ qualitatively distinct experiences without such a scale are not.\nRule B (Similar\
  \ natures / extension of introspection): comparisons are legitimate iff the states\
  \ being compared are of the same general type (physical pain with physical pain,\
  \ disappointment with disappointment) so that empathy can transport; comparisons\
  \ across different types of state are not.\n\nThese two agree on V1 (yes, both),\
  \ diverge on... V2: A says no (no metric for disappointment across persons? hmm,\
  \ is there?). Actually let me restructure.\n\nBetter: make the divergence cases\
  \ clear.\n\nRule A: comparisons only where there's a common external/physical scale\
  \ (money, injury severity, stimulus intensity).\nRule B: comparisons only between\
  \ similar people in similar states (fellow-feeling works within similarity), but\
  \ not across very different people.\n\nV-set:\n1. \"Two spectators at the same football\
  \ match, both neutrals; one's team-loathing... \" hmm.\n\nLet me try a cleaner approach.\
  \ The friend is asked, for various cases, \"can we correctly say that this is worse\
