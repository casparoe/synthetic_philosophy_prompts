  At a workshop on persistence next month I''m presenting a paper defending a view
  I call custodial continuity: the identity of an artifact over time is fixed not
  by material continuity, not by continuity of form, but by an unbroken, intentional
  chain of custody — a socially sustained practice of someone or some institution
  treating, maintaining, and taking responsibility for the object as the same one.
  On this view Hobbes''s gradually repaired ship is the original because the repairs
  are part of a single ongoing custodial practice, while the reassembled collection
  of scavenged planks is a new ship, because custody of the parts is not custody of
  the vessel. My main argument runs through a variant I''ve constructed: the crew
  is locked out of the shipyard for ten years while a preservation society carries
  out exactly the replacements the crew had planned, in the same order, from the same
  stock. If continuity of matter or form were what mattered, this case and the ordinary
  gradual-repair case should get the same verdict; almost everyone wants to say the
  society''s ship is a different one, or at least hesitate; my view gives a clean
  answer: custody was severed, so the ship ceased and a successor began.


