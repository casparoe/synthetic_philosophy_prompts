  - Lexical-threshold negative utilitarianism: pains below a certain severity threshold
  can be traded off against pleasures on a common scale, but a pain above that threshold
  cannot be offset by any quantity of pleasure, however large; preventing (or failing
  to prevent) such a pain dominates the calculus.

  - Symmetric total utilitarianism: pleasure and pain are commensurable; the right
  option is whichever leaves the largest net balance, summing everyone''s pleasures
  and pains on a single scale.


  The scenario must meet these specifications:


  1. Realistic setting — a municipal decision, a clinic''s policy, or similar. No
  trolleys, no science fiction, no world-scale stakes.

  2. The two available options must generate opposite verdicts: the lexical-threshold
  negative utilitarian must choose one, the symmetric total utilitarian the other.

  3. The disagreement must turn on a single variable: whether one person''s pain sits
  just above the lexical threshold. Everything else must be held fixed between the
  options.

  4. The aggregate pleasure on the other side must be large only through aggregation
  — many people each forgoing a modest, ordinary enjoyment — not through stipulated
  huge magnitudes. Do not write "vast utility" or assign implausible numbers; build
  the total out of units a reader can intuitively price (an afternoon''s enjoyment
