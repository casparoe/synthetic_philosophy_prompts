  nobody actually honors. So I want a diagnosis of the disagreement, not another survey.


  Here are the cases where the two camps in my group genuinely split, even though
  everyone swears allegiance to pluralism. First, the arrhythmic heart: everyone grants
  the selected-effects camp that its function is still pumping blood, but half the
