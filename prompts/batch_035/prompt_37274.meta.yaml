  I''m putting together a handout for my ethical theory class (15 undergrads, they''ve
  all read a bit of Ross but nothing else is safe to assume) and I want a decision
  tree that takes someone from the starting point "sometimes you literally cannot
  do both of two things you have serious moral reason to do" all the way to a position
  on whether genuine moral dilemmas exist. Not a quiz with a scoring key, a proper
  tree — each node a question answerable without knowing any of the position names.


  Branch questions I want in there somewhere (you can add or reword, but these distinctions
  have to do work):


  - the resolution question: for every conflict, is there a fact about which act is
  right all-things-considered, even if it''s humanly unknowable which? Or are some
  conflicts indeterminate?

  - the remainder question: the agent who does the all-things-considered right thing
  in a hard case — is lingering guilt at the other person''s death / the broken promise
  fitting (it tracks something moral) or is it basically a psychological artifact
  the agent should be talked out of?

  - ought-implies-can applied to the pair: if you can''t do both, does that alone
  show you''re not obligated to both?

  - agglomeration: if you ought-to-A and ought-to-B, does it follow you ought-to-(A-and-B)?
  And I want the tree to distinguish people who think dropping agglomeration is just
  logic (it fails for all-things-considered oughts) from people who think it fails
  for a substantive moral reason, if those really are different people.

  - a permissivism node built on this case I made up (feel free to sharpen it): two
  ICU patients, one ventilator, exactly symmetrical in every prognostically relevant
  respect, the attending flips a coin in front of the residents and everyone accepts
  the outcome. Was that a moral dilemma, or was there just nothing morally at stake
  between the two options? I want a branch that catches students who think both options
  can be fully permissible with no deeper fact about which is better, and I want the
  tree to say whether that''s a third thing (dilemma without uniqueness) or just the
  consequentialist dissolution wearing a costume.


  Use concrete cases at the nodes, not abstract phrasing — I''ll give you the ones
  I''ve been using: the classic one about the student torn between joining the resistance
  and staying with his mother, a Sophie''s-choice type case, and a promise made to
  a dying friend vs diverting the money to save a stranger. You can swap or add cases
  but each case has to actually split the positions, not just be dramatic.


  Leaves: at minimum I need the Ross-style view (real pro tanto conflict, always resolvable,
  remainder is fitting because something of moral significance was sacrificed), the
  consequentialist dissolution (apparent dilemma is just uncertainty about which act
  does more good, remainder is sentiment), the lexical priority view (one kind of
  duty simply trumps another so it was never a contest, e.g. never kill the innocent
