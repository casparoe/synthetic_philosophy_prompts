  I''m doing a Masters in philosophy of mind, and we''ve spent three weeks on Jaegwon
  Kim''s causal exclusion argument, and honestly I keep flip-flopping on how much
  of a threat it really is to non-reductive physicalism. Quick statement of the issue
  as I see it (correct me if I''m strawmanning anything): whenever a mental property
  M causes some behaviour, there''s also a physical property P that realises M and,
  by the causal closure of the physical, is in itself causally sufficient for that
  behaviour. So either M''s causing the behaviour is the same event as P''s causing
  it (in which case mental causation seems to get "absorbed" rather than vindicated),
  or M is a genuinely seperate cause, and then we have systematic overdetermination
  of the sort nobody tolerates elsewhere, or M does no causal work at all. Non-reductive
  physicalists usually respond that higher-level causes can be legitimate because
  causal explanations can pick out properties at different levels of grain — same
  story as why it''s fine to say the hurricane caused the damage even though some
  microphysical state did. But it''s not clear to me whether that response defeats
  the argument or just declines to play its game.


  Here''s the twist that got me actually confused. My coursemate (who does ML on the
  side) suggested the following analogy and I can''t decide if it''s illuminating
  or a cheap trick: think of a language model producing an answer after a chain-of-thought.
  Each token in the trace is fully caused by previous tokens plus the weights — nothing
  is "left over" for the reasoning, as such, to contribute. Yet it seems perfectly
  natural, and scientifically useful, to say the model got the right answer *because*
  it reasoned step by step, and there''s empirical work showing the trace matters
  (mess with the trace and you change the answer). If that''s genuine higher-level
  causation and not just a façon de parler, it looks like exactly the structure non-reductive
  physicalists claim for the mental — a fine-grained physical story that''s sufficient,
  plus a coarse-grained one that''s doing real explanatory and (arguably) counterfactual
  work. My coursemate thinks the analogy shows the exclusion argument is harmless.
  My supervisor thinks it just smuggles in the assumption at issue, namely that causal
  relevance at a coarser grain counts as causation proper.


  So: give me your actual credence that the exclusion argument, stated at its strongest,
  gives us good reason to think irreducibly mental causal powers don''t exist — i.e.
