  ---


  You are a senior researcher in AI alignment with a background in decision theory,
  helping me prepare an interview. I host a podcast on AI safety, and next week''s
  guest is a fictional but representative defender of the indifference approach to
  the shutdown problem — call him Dr. K. Since listeners can''t be assumed to know
  the literature, I''ll state his position precisely here, and I want the questions
  to engage with it as described rather than with any real person''s published work.


  Dr. K''s position, in his own framing: The shutdown problem is that an expected-utility
  maximizer designed to pursue some goal will resist shutdown, because being shut
  down prevents goal attainment. His solution is not to make the agent want to be
  shut down, nor to give it a goal that mentions shutdown as a subgoal, but to make
  the agent exactly indifferent between button-pressed and button-not-pressed worlds:
  for every trajectory in which the button is pressed, the utility function includes
  a correction term that makes the resulting utility equal to the counterfactual utility
  of the best (or an appropriately chosen) unpressed trajectory. A properly indifferent
  agent neither resists the button nor promotes its being pressed, and, he claims,
  indifference avoids the instrumental-convergence reasoning that makes shutdown resistance
  a problem in the first place.


  Listeners familiar with the literature know the standard objections, and I want
  the interview to press on them hard:


  1. The exploitation objection. An agent indifferent between pressed/unpressed can
  be "bought": it would happily accept a penny in exchange for a commitment to make
  the button ineffective — indifference means the agent will sell its off switch for
  nothing, and will trade with anyone who can influence the button.

  2. The stunting objection. Since the agent gets no extra utility from button-press
  worlds, it has no incentive to preserve the button''s functionality — it would happily
  reallocate the button''s maintenance budget... Also it may act less capably in general.

  3. The fragility of indifference. The compensation term has to be defined over a
  specific set of worlds/events; any real-world deviation (button pressed under conditions
  not anticipated by the designer, a second button, a copy of the agent built without
  a button) may restore the incentive to resist.

  4. The self-modification problem: indifference about the button gives no incentive
  to preserve indifference in successors/self-modification.


  Ask for 10-12 questions with follow-ups keyed to anticipated replies (e.g., when
  pressed on the penny exploit he''s likely to say "the exploit requires the buyer;
  in practice nobody will offer a penny for the button" or "restrict trading with
  parties that can influence the button" — press on how the agent identifies such
  parties).


