  Good combos:


  1. Slogan type + money pumps: "rationality requires transitive preferences" or "you
  can''t be money-pumped" or the Dutch book one-liner. A slogan like "intransitive
  preferences leave you open to being money-pumped" — often repeated. Or "money pump
  arguments show preferences must be transitive." Could ask for the precise readings.


  2. Slogan type + ethics of voting: "voting is irrational" (down expected value),
  "one vote never matters", "if you don''t vote you can''t complain" — that''s a great
  slogan! "If you don''t vote, you can''t complain" — precise readings: a fairness/reciprocity
  claim, a consent claim, a hypocrisy claim, etc. That works well with rationalist
  angle (decision-theoretic debunking of voting).


  3. Grading type + population ethics: total vs average utilitarianism, Parfit''s
  Repugnant Conclusion, etc. Write exam question + student answer with subtle mistakes
  (conflating total and average view, misattributing to Parfit, etc.).


  4. Slogan + boundary problem: "all affected interests" principle — "everyone affected
  by a decision should get a say." That''s a nice one-liner: the all-affected principle.
  Where did the asker meet it — a LessWrong-adjacent discussion about AI governance
  / who gets to vote on AI policy. The slogan "decisions should be made by those affected"
  could be unpacked into: all-affected interests (Goodin), all subjected-to-coercion,
  stakeholder views, etc. Good.


  5. Safe Pareto improvements: probably too niche for small LLMs? Actually SPIs are
  a MacAskill/Rosenthal-Grush concept from rationalist circles — moderately known
  via LessWrong posts. A slogan type: "there are deals that make everyone better off
  and no one worse off" — hmm. Might be too niche.


  The "if you don''t vote, you can''t complain" slogan is probably the strongest:
  widely repeated, easy for small models to know, and allows for interesting disambiguation
  (moral duty vs instrumental vs expressive). Also fits rationalist reader perspective
  well — they''d have encountered the expected-value debunking of voting (Brennan''s
