  "I teach an intro course on philosophy of mind and free will, and next term I''m
  screening Chaplin''s Modern Times (1936) alongside our unit on determinism and agency.
  I want to frame the discussion with Daniel Dennett''s notion of ''sphexishness''
  — his coinage for behavior that looks intelligent but turns out to be rigid, situation-insensitive
  routine, named after the digger wasp in the old Fabre anecdote: the wasp drags prey
  to the edge of her burrow, goes down to inspect, emerges, and drags it in; but if
  an experimenter nudges the prey a few inches aside while she''s below, she re-drag
  it to the edge and re-inspect, and will loop through this indefinitely, never noticing.
  For Dennett, the opposite of sphexishness — flexible, context-sensitive responsiveness
  — is roughly what free will worth wanting consists in, at least on his compatibilist
  picture.


  Here''s what I want the class to chew on: read Modern Times as a film about attempts
  to sphexify a human being. The assembly line, the auto-speed-up by the president,
  the Billows Feeding Machine explicitly designed so that lunch can be eaten without
  interrupting work — all of them are attempts to replace flexible behavior with rigid,
  optimized routine. And the famous nervous-breakdown sequence, where the Tramp cannot
  stop making the bolt-tightening motion and chases anything button-like down the
  street, seems to literalize sphexishness: the movement has become decoupled from
  its context, replayed regardless of situation, exactly like the wasp''s loop.


  But I want to be careful not to hand the students a tidy illustration, so: where
  does the film resist this reading? The Tramp is arguably the least sphexish character
  in cinema — his whole comedy is improvisation, repurposing objects, seizing the
  occasion (the red flag, the jail scenes). And there''s a deeper complication I''m
  not sure how to teach: Chaplin''s physical comedy was famously rehearsed to the
  point of obsession; a perfectly executed gag is itself a kind of machine precision.
  So is the film about escaping sphexishness, or does it show flexibility as itself
  a trained, scripted capacity? Where would you point students scene by scene, and
  does the film, taken seriously, add anything to the Dennett-style compatibilist
  claim that freedom is just non-sphexishness? I''d like a reading that doesn''t just
  decorate the philosophy with film clips."


