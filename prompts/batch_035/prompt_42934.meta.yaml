  Actually the subtle flaw: conflation of "no true principles" with "no generalizations
  with prima facie validity" — particularism denies invariant principles, not that
  considerations tend to make similar contributions. That''s a genuine equivocation
  between "principle" readings.


  Alternatively, a prove-too-much argument FOR particularism: (1) Any principle has
  a possible exception. (2) A principle with exceptions is either exceptionless-but-hedged
  (and hedging makes it useless) or admits counterexamples (and so is false). (3)
  ... leads to particularism but also proves too much: the same argument applies to
  any normative domain, including epistemology and even logic, e.g., "believe the
  evidence" has exceptions? If every domain collapses, the argument proves too much.
