  Hmm, better to state premises:


  (1) What a gambler should care about is the long-run growth rate of her bankroll,
  because wealth is compounding: a sequence of multiplicative returns, and what survives
  is the exponent (geometric mean), not the arithmetic mean of any single outcome.


  (2) The Kelly fraction — for a bet that pays odds b against 1 with win probability
  p, f* = (bp − q)/b — uniquely maximizes that growth rate.


  (3) Any other fixed stake loses to Kelly almost surely as the number of bets grows:
  the bettor who stakes more than f* ends up with probability one (in the limit) below
  the Kelly bettor, and any staking beyond twice f* yields a negative growth rate,
  i.e., almost sure ruin.


