  median is maximized by Kelly). So the friend has implicitly identified "rational"
  with "maximizing the median / growth rate," which is only compelling if you either
  (a) assume utility is log in wealth (Bernoulli), which grounds Kelly even for single
  bets, or (b) assume the repetitions are genuine and unbounded. If (a), then the
  conclusion about the dying man is re-derived not from repetition but from log utility
  — and the friend can retreat there — but then (4)-(6) were doing no work, and the
  question becomes whether log utility is plausible for a man with no future wagers
