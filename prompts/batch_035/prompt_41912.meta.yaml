reasoning_summary: 'Pick a domain: Augustine on lying + verdicts-on-cases type works
  nicely. Journalist perspective, casual, British English, typos ok. Augustine''s
  De Mendacio: lying = speaking against one''s mind; never licit, even to save life.
  Classic cases: murderer at door, joke, the persecutor asking where the heretic hides,
  Augustine''s eight kinds of lies (some harmless jokes, some kindly helpful, some
  malicious...). Augustine admits some lies harm no one but says no lie is without
  sin.


  The verdicts-type prompt: journalist covering science/ideas gives their gut verdicts
  on lying cases, asks what principle captures them. Make it in the weeds: e.g., lying
  to interviewers, placeholders, equivocation, misleading truths. Augustine''s counterintuitive
  claim: all lies sinful. The journalist''s verdicts diverge from Augustine.


  Write a prompt with a hard-to-reconcile pair. Cases:

  - Lying to the murderer at the door about friend''s location: fine (overturns Augustine).

  - Aunt''s sweater compliment: fine.

  - Joke exaggeration that everyone expects not to be literally true: not even a lie.

  - Telling sources things you don''t believe to draw them out (journalism context):
  not fine.

  - Telling a truth phrased to mislead ("the check is in the mail" vs "it was sent"
  when it wasn''t)... better: misleading truths — saying something literally true
  intending deception. Verdict: somehow worse than a kindly lie? That''s the hard-to-reconcile
  pair vs Augustine''s definition (speak against your mind). Journalist thinks "technically
  true" misleading is worse than benevolent lie — hard for a principle that says lying
  = asserting what you believe false.

  - Placeholder in journalism: not naming a source, saying "I was told" without saying
  by whom — fine.

  - Telling a dying person comforting falsehood: not fine.


  Ask: is there a principle capturing all, does the misleading-truth case force dropping
  the "lying = against your mind" definition, and what does the principle say about
  a case they go back and forth on — e.g., lying to a source about what other sources
  have said, or staging a photo / saying "I''m not a journalist" undercover.


  Keep casual, typos, British English ("whilst"? maybe one). Journalist covering science
  and ideas. Mention Augustine casually — they read De Mendacio after writing a piece.
  Fine to reference; no quotes needed. Avoid quoting from memory.


  Length: a paragraph-ish. Write it.'
