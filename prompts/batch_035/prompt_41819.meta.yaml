  ---


  I am a journalist who writes about science and ideas for a general-interest magazine,
  and I''m preparing a feature on social information and market frenzies. In the background
  reading, a colleague lent me a popular economics book whose chapter on crowd behavior
  boils down to this (paraphrasing closely):


  ''Information cascades explain why crowds are so often wrong. The theory, developed
  by economists in the 1990s, shows that when people make decisions in sequence and
  can observe each other''s choices, each new decision maker ignores their own private
  information and simply copies what earlier movers did. This is individually irrational
  but collectively rational, which is why it counts as rational herding. Once a cascade
  starts it is self-perpetuating and cannot be stopped by new information, which is
  why fads, bank runs, and asset bubbles follow the same explosive dynamics, and why
  the aggregate wisdom of crowds completely breaks down wherever decisions are sequential
  rather than simultaneous.''


  Before I put anything like this in print, I want to make sure I''m not propagating
  a garbled version. Please act as an expert in microeconomic theory and behavioral
  economics who has taught this literature — someone who knows the canonical cascade
