  1. Deb: Marcus''s blame is worthless — a plagiarist blaming a plagiarist. His own
  history makes his blame hypocritical, and hypocritical blame is void; she''s entitled
  to dismiss it.

  2. Sam: That''s too fast. The hypocrisy that matters is doing the very thing while
  blaming it — the climate lecturer who flies on the side. Marcus isn''t plagiarizing
  anyone now; his blame is not an act of hypocrisy but the opposite: evidence of his
