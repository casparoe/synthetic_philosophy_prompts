  Prompt draft:


  ---


  I am a professor of philosophy, and I need a referee for a dispute I could not settle
  myself. Last term our program handled a misconduct case, and the hallway argument
  it produced has stayed with me. I want you to adjudicate it move by move, and I
  should say up front that I have no settled view of my own; both colleagues are people
  whose judgment I respect.


  The case: Twenty-two years ago, early in his career, our colleague Marcus published
  an article that incorporated, without attribution, long passages from an untranslated
  foreign monograph. He was found out, publicly confessed, and accepted the sanctions.
  In the decades since he has run our research-integrity seminar and has been, by
  all accounts, scrupulous. Last month a doctoral student, Lena, was found to have
  lifted several paragraphs from an unpublished departmental manuscript into her thesis.
  Marcus sat on the panel. Beyond reporting the finding, he told her, in front of
  the others, that he found what she had done shameful — that it disgusted him — personal
  blame, not merely enforcement. Whether he was entitled to that register is what
  my colleagues fought about.


  The exchange, as I heard it:


  (1) Deb opened: Marcus''s blame is worthless. A plagiarist blaming a plagiarist
  is hypocrisy, and hypocritical blame is void; Lena is entitled to dismiss it outright.


  (2) Sam answered: too fast. The hypocrisy that disqualifies blame is doing the very
  thing while blaming it — the aerobics instructor... [climate flyer? pick a neutral
  example: the colleague who checks their phone in a no-phone meeting while blaming
  others]. Marcus is not plagiarizing anyone now. If anything his blame is evidence
  of reformation, and reformed wrongdoers are often the best blamers: ex-smokers do
  not hesitate to warn the young, and we want them to.


  (3) Deb: his past does not evaporate at reformation — and notice the register. Shameful,
  in front of the panel. That is not protest; it is a performance of distance from
  his own past self. He is asserting a commitment to integrity that his own record
  violates. That is hypocrisy of the committed kind, and it defeats standing just
  as surely, even if he never copies another word.


  (4) Sam: a commitment his record violates in the past tense. On Deb''s principle,
  anyone who has ever fallen short of a value is forever barred from blaming its violation
  — only the blameless could blame. That is not our practice and should not be: we
  take the impatient person''s blame of lateness seriously, and rightly.


  (5) Deb: we take it, but we discount it. "Look who''s talking" is not a fallacy
  in these exchanges; it is a challenge to the speaker''s right to the currency. Blame
  is an address between equals: it claims the addressee owes an answer. As a panelist,
  Marcus has every right to the finding and the sanction — call that role-standing.
  But the personal register of his remarks trades on a standing he does not have;
  when Lena eventually says "look who''s talking," the exchange simply ends, and it
  ends in his favor only if we forget his record.


  (6) Sam: then the problem is the register, not the history. If Marcus had said only
  that the conduct violates the code and carries consequences, Deb would have no complaint.
  So on her account, standing is voice hygiene — blame in your administrative voice
  and you may blame; slip into the personal voice and you may not. That cannot be
  the deep story about hypocrisy and standing.


  Neither would budge, and — to my irritation — I could not referee it. I would like
  the following from you.


  First, before committing to verdicts, brainstorm briefly (a short paragraph): what
  general principle is each of them implicitly relying on, and where exactly do those
  principles conflict? Second, adjudicate the six moves in order. For each, say whether
  it is clearly right, partly right, or clearly mistaken, and justify the rating:
