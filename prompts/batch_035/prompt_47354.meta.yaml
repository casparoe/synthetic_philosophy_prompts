  3. Deb: His past doesn''t evaporate at reformation. Notice the register of his blame:
  "shameful," in front of the panel. That''s not protest; it''s a performance of distance
  from his own past self. He is, in effect, asserting a commitment to integrity that
  his own record violates. That''s still hypocrisy — the committed kind — even if
  he never copies another word.

  4. Sam: A commitment his record violates in the past tense. If committed hypocrisy
  defeated standing, no one who ever fell short of a value could blame its violation
