  has no warrant in this domain at all; it was imported from a different context and
  just happened, this once, to point at the right answer. B cannot explain why the
  answer is right, and when pressed, offers reasons that are subtly wrong even though
  the conclusion is right.


  My colleagues are split. One side argues that since the deliverable is identical
  and there is no future in which we would draw on either candidate''s judgment again,
  the difference between A and B is, for this hire, no difference at all: any preference
  for A is a habit carried over from situations where understanding pays off later,
