  Draft:


  "My two friends Maya and Jonah got into it after our wilderness first aid refresher
  last weekend. The instructor ended with a classic: you''re the only responder, two
  sites, you can only get to one in time. At site A, five hikers will die without
  immediate treatment. At site B, one hiker will die. Which do you choose? (Instructor
  just wanted us to say you''d triage the five and move on, but Jonah wouldn''t let
  it go.)


  Maya said obviously the five — five deaths is worse than one death, and anyone who
  hesitates is overthinking it. Jonah said wait, look at it from the single hiker''s
  point of view: that person''s claim on your rescue isn''t any weaker just because
  four other people happen to also be dying elsewhere. Each of the five, taken one
  at a time, has exactly the same claim he does — no one on either side loses more
  than their own life, so no one is facing a greater loss, and there''s no person
  for whom ''five deaths'' is the loss.


  Maya said she doesn''t need to add lives up like that. She can grant every claim
  is equal, and still: five equal claims vs one equal claim. Each of the five has
  a claim that the one''s claim doesn''t cancel, and after the one''s claim matches
  any one of theirs, there are four claims left standing with nothing to answer them.
  That''s not utilitarian adding, that''s just counting claims, she said — the same
  way we''d count votes.


  Jonah pounced: that leftover-four move is sneaky, because it only works if the fifth
  hiker''s claim gets stronger by outnumbering — which is exactly what he''s denying.
  Or put differently: if all five claims are equal to the one''s claim, why does the
