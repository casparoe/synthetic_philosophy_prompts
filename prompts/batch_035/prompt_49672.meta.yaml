  Browning''s reading is situational. The men killed because of obedience to authority
  and conformity: it was easier to shoot than to step forward alone in front of your
  comrades, and once the shooting started, refusing meant leaving the work to everyone
  else. He leans on the Milgram experiments, where ordinary people administered (what
  they believed were) dangerous electric shocks because an authority figure in a lab
  coat told them to. On Browning''s account most of the men weren''t especially antisemitic
  by the standards of their time and place; they were ordinary, and that''s the disturbing
  part.


  Goldhagen''s reading is the opposite: the men killed because they hated Jews. He
  argues they were antisemitic fanatics, unusual men even by the standards of the
  Germany they lived in, and that their hatred is what the title ''willing executioners''
  points to — willing, not coerced. This is what he calls eliminationist antisemitism,
  an ideology unique to Germany, though he admits the rank and file weren''t sadists
  in the clinical sense.


  Here is where I think Browning''s story runs into trouble. Browning himself concedes
  that no one was punished for refusing. But obedience only has force when there''s
  a sanction behind it; if refusing carried no penalty, then there was nothing to
  obey, and the men''s participation was a free choice. That is much closer to Goldhagen''s
  picture than Browning''s, even though I don''t buy Goldhagen''s fanatics. In a way
  Browning wrote his book to refute Goldhagen, which is why the two books are always
  taught together, but the free-choice point ends up on Goldhagen''s side of the ledger.
  My verdict is still Browning, mostly because the historiography came down hard on
  Goldhagen — almost no historians accepted his account — and because situational
  explanations have worked everywhere else we''ve tested them. But I''d say the Józefów
  fact fits Goldhagen better than either of them admits."


