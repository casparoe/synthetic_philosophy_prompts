  so, bit of an unusual ask. I''m a novelist — I write literary fiction, mostly about
  ordinary people who go along with awful things, and this year I''m teaching a seminar
  in an MFA program on writing perpetrators ("the complicit protagonist," we called
  it, a bit precious in retrospect). My students kept giving me cartoon villains,
  so I brought in a history unit: the Browning/Goldhagen debate about who the Holocaust''s
  low-level killers actually were and why they killed. I figured if my novelists understood
  that debate, their perpetrators would stop being monsters with paperwork.


  The unit went fine. The problem is grading. The historian who was supposed to co-teach
  had a family emergency, so I''m alone with 22 take-home finals, and while I know
  the books well enough to teach them, I don''t trust myself to grade a history exam
  — I keep noticing I''m grading prose style, or worse, rewarding answers that sound
  smart to a novelist. I need someone who actually knows this literature and has graded
  a lot of exams. So: act as a Holocaust historian who has taught this material for
  twenty years and graded thousands of student essays, think carefully, and before
  you grade anything, brainstorm what a genuinely strong answer to this question has
  to contain and what the standard student misconceptions about this debate are —
  then grade against that, not against a vibe.


