  policeman widely known to dislike the task, told his men before the shooting began
  that any of them who did not feel up to it could step out, and only around a dozen
  of the roughly five hundred did. Both also agree that no member of the battalion
  was ever seriously punished for refusing to kill Jews. (a) Explain what Browning
  takes these facts to show about why the men killed, what Goldhagen takes them to
  show, and where exactly the disagreement lies. (b) State which interpretation you
  find more persuasive, and defend it against the strongest objection from the other
  side."


