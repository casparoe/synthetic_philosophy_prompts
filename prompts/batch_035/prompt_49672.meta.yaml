  Exam question:


  "Both Christopher Browning (Ordinary Men, 1992) and Daniel Goldhagen (Hitler''s
  Willing Executioners, 1996) built their books around the same unit, Reserve Police
  Battalion 101: roughly five hundred middle-aged, mostly working-class men from Hamburg,
