  Also "no member of the battalion was ever seriously punished" — Goldhagen emphasizes
  this generally about German killers; it''s widely stated (verified: "no German was
  ever punished in any serious way for refusing to kill Jews" — from fetch, Goldhagen''s
  point, and Goldhagen agreed with Browning on that). Good.


