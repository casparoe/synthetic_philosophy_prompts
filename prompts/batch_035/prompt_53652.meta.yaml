  feels way richer than the evidence says it is); someone who trains as a wine taster
  and insists the experiences themselves changed, not just their labels; and a question
  that gets at whether you think a creature could be functionally identical to you
  while having nothing going on "inside".

  - One question can be about what follows if science someday gives a total functional/physical
  story of your brain.


  The scoring key at the end should map answer patterns onto these leaves, described
  in plain-ish language but with the standard names attached:

  1. the classic qualia realist: experiences have intrinsic, private, ineffable properties,
  and those properties are the hard part

  2. the representationalist / intentionalist: there''s a fact about what it''s like,
  but it''s a fact about what your experience represents, not some extra glow

  3. the illusionist: there are no phenomenal properties, but introspection misrepresents
  experience as having them, and that misrepresentation itself needs explaining

  4. the quiner (Dennett-style, the line Chase and Sanborn defend): qualia as classically
  conceived are an incoherent posit — a bundle of properties that nothing could have
  all at once — and once you subtract them there''s nothing left to explain

  5. the "there''s a real explanatory gap but it''s not extra properties" position
  (brute identity / type-B-ish), if you think the cases actually sort anyone there

