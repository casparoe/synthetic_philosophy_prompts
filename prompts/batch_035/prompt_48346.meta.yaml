  commits one wrong; the state''s intentionally inflicting hard treatment is a second
  wrong; a theory (retributivism) that says the second wrong is justified *because
  of* the first is trying to make a right out of two wrongs, so it''s self-defeating.
  The TA nodded along, the discussion moved on, and I left without knowing what exactly
  had been established.


  For a short paper I''m supposed to precisify a piece of philosophical rhetoric,
  and I''d like to use this one. What distinct precise claims could "two wrongs don''t
  make a right" be making when aimed at retributivism? I can see it ranges from something
  no one disputes (two wrong acts don''t add up to a right act — true but irrelevant
  if the retributivist denies punishment is a wrong) to something substantive, e.g.,
  that the state''s deliberately harming someone is a wrong regardless of who deserves
  it, or that one wrong cannot alter the deontic status of another act (that desert
  is not the kind of thing that can justify). Please lay out the readings as a menu
