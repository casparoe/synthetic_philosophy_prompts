  to anything. So "code" there is a frozen metaphor that''s been reified because the
  word sounds technical. If you trace it back, the resemblance to a real code is basically
  one feature: both are lookup structures.


  Marta came back with arbitrariness. The mapping is not chemically forced in the
  way a river''s course isn''t forced: there are variant codes in some lineages (mitochondria
