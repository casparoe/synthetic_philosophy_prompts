  conflating consequentialist expected utility response with the "expected value of
  marginal impact" (multiply effects by probability of being pivotal), overstating
  "your act makes no difference therefore no obligation," misattributing threshold
  structure, treating Parfit''s "drops of water" point, conflating act consequentialism
  with rule consequentialism responses, or the "expected harm" answer with actual
  causal irrelevance. Also could include the claim "Kant said..." — no, keep it philosophical-conceptual
  without misattributions that need verification. Avoid verbatim quotes. No citations
  requested.


  Subtle errors to embed:

  1. Conflation of "I can''t make a difference" (threshold/triggering) with "my contribution''s
  expected effect is tiny but nonzero" — the summary treats expected-value response
  as if it conceded inefficacy.

  2. Overstating the inefficacy objection as applying to voting "since one vote never
  decides an election" — presented as fact rather than low probability; and ignoring
  that expected impact can be large in high-stakes elections because harm multiplied
  by pivot probability.

  3. Presenting the threshold/"triggering" structure of collective harms (each act
  only matters at the margin that tips past a threshold) as if all collective harms
  work that way — climate is smooth/continuous, meat production arguably stepwise
  (whole animals).

  4. A standard objection presented as a refutation: "the consequence is absurd: if
  no individual contribution matters, then a million people each doing the same thing
  also does no harm" — the dropped-in-the-ocean point (Parfit''s drops of water) presented
  as a refutation of consequentialism rather than a diagnosis of aggregation.

  5. Possibly conflating "causation" with "making a difference" — counterfactual dependence
  vs. threshold effects: e.g., in threshold cases, the person who tips past the threshold
  causes the harm counterfactually, earlier ones don''t, but probability-weighted
  each has same expected contribution.


  Voice: a friend summarised it, or a popular book. Asker: no academic background,
  thinking on own. Formal/polished. British English request.


  Length: one to three paragraphs. Deliverable: sentence-by-sentence audit, which
  parts a philosopher working on collective action would accept, wince at, or find
  wrong, and whether the conclusion follows.


  I don''t need web search — no quotes, no specific attributions needed. I should
  be careful not to attribute anything to Parfit by name incorrectly — I could mention
