  layer is the implicature, and it lives entirely outside of meaning proper — the
  literal content is all that is actually said, and everything else is pragmatic noise.
  Grice''s deeper point was that meaning itself is conventional: words mean what the
  dictionary and grammar say, and the hearer''s job is just to decode the sentence
