  I am a professor of philosophy who has taught a graduate seminar on Davidson roughly
  every other year for fifteen years, and each time the course runs aground on the
  same reef: the status of the principle of charity. As Davidson presents it in the
  radical interpretation essays, an interpreter working from scratch on an alien speaker
  must, by the nature of the enterprise, take the speaker to be right about most things
  — for only against a background of shared belief and shared standards of truth does
  a hypothesis about what her words mean have anything to constrain it. The question
  that stalls my seminar is whether that ''must'' is constitutive or merely evidential.


  Constitutivists — and Davidson''s own prose often reads this way, especially in
  the argument against conceptual schemes — hold that charity is built into what interpretation
  is: a theory that attributes massive error is not a rival interpretation but no
  interpretation at all, so that the extent of agreement between speaker and interpreter
  is not an empirical discovery but a precondition of one. Heuristicists reply that
  charity is simply a defeasible inductive presumption, of a piece with the assumption
  that a strange-looking animal is probably a common one in an unusual posture; and
  some, following Grandy''s humanity principle, replace maximize truth with attribute
  the beliefs the speaker would most plausibly have given her situation and evidence
  — which allows, in principle, finding whole communities in error about a great deal.
  Each side knows the other''s moves; the constitutivist says the heuristicist cannot
  explain what would make a meaning-assignment correct if not successful prediction
