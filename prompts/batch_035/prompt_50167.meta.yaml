  Scenario: A PhD student (asker) reports a disagreement between two labmates/flatmates.
  Person A has, after a concussion / or is just absent-minded, keeps all their research
  notes, reading annotations, and even daily schedule in a set of tools: a notes app,
  calendar with alarms, a dictation habit. Person A claims her system literally is
  part of her memory — "my mind extends into my phone." Person B counters: those are
  tools she uses, like a pilot uses a cockpit; using something constantly doesn''t
  make it part of you — she consults the app the way she''d consult a librarian. A
  replies with parity: if the same information were stored in her brain and retrieved
  with the same ease, we''d call it memory without hesitation; why should location
  matter? B says the analogy fails because retrieval isn''t automatic — she has to
  decide to check, sometimes argues with her own notes, and when her phone died she
  didn''t lose memories, she lost access to records; that difference matters (glue-and-trust:
  reliability, automatic endorsement). A counters: her consulting has become habitual
  and unhesitating — she treats the app''s word as authoritative, never double-checks,
  and feels the loss of the phone like amnesia. B''s final move: even if granted,
  the thesis becomes trivial — anything deeply integrated (his glasses? his car? his
