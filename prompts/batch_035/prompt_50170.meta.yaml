  ---


  I''m applying for a one-year dissertation fellowship and need a two-page proposal
  on a question in moral psychology/ethics: the moral worth of actions, i.e., what
  makes an action worthy in something like Kant''s sense — acting for the right reasons
  — as opposed to merely right.


  My half-formed idea: the debate has stalled on overdetermination cases. Consider
  a nurse who comforts a dying patient partly from compassion but also because it
  is her job and she would have done it anyway for professional reasons; or the person
  who keeps a promise from fidelity but whose fear of getting caught would have secured
  compliance regardless. On one view, an act has moral worth only if the moral motive
  is what actually makes the difference — it has to be needed for the right act to
  occur; on another, moral worth requires only that the agent act from the moral motive,
  whether or not it was causally decisive. I suspect the stalemate comes from both
  sides assuming a single notion of "the right motive making the right difference."
  I want to split it: a causal role (the moral motive helps produce the act) and a
  constitutive role (the moral motive is what the agent is doing it under — it fixes
  the description under which she takes herself to be acting). My hunch is that moral
  worth tracks the constitutive role, so that overdetermination cases have moral worth
  when the agent would have acted rightly anyway only contingently, but the moral
  motive is still what the action is *of*.


