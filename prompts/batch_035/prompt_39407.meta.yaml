  A proving-too-much argument: (1) Machiavelli says fortune is like a raging river
  that destroys unless dikes are built in calm weather — i.e., preparation in advance
  is what beats fortune. (2) But whether you happened to prepare in advance is itself
  up to fortune (whether you were born with the character to prepare, whether circumstances
  gave you calm weather to prepare in). (3) So everything, including preparation,
  is under fortune''s control. (4) So virtù is an illusion and nothing can be attributed
  to it. (5) But Machiavelli built his whole book around the claim that virtù exists
  and can be cultivated/learned — and says new princes should model themselves on
  great men of the past. (6) Conclusion: Machiavelli''s own framework is self-undermining.
  The subtle flaw: equivocation between "fortune" as external contingent events and
  "fortune" as ultimate causal origins (a compatibilist-style distinction). This mirrors
  the classic "everything is either determined by fate or not" argument / the Consequence
  argument. Nice and in the weeds but accessible.


