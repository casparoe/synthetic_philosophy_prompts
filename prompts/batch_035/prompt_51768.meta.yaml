  over them, and we ought to be ontologically committed to everything quantified over
  by our best theories. Two refinements of my own: first, I think the view is robust
  under scientific revolution — even as physics is rebuilt, whatever mathematics ends
  up indispensable will be close enough in ontology that the platonist loses nothing
  that matters; second, I hold that if the continuum hypothesis is ever settled, it
  will be settled by indispensability-type considerations, not by the intrinsic self-evidence
  Gödel appealed to. Tell me what would count against the view — not only the standard
  objections (Benacerraf''s epistemic challenge, Field''s nominalization program),
  but what the view actually risks: which results or developments would be decisive,
  which merely awkward, which its committed defenders would themselves concede as
