  I think a strong option: Paradox of tragedy + "proves too much" argument. The asker
  (non-academic) constructs an argument: (1) we seek out tragedy for pleasure; (2)
  whatever we voluntarily seek we take pleasure in; ... leading to absurd conclusion
  that we enjoy real suffering / that we''d enjoy watching actual torture. Actually
  a neat argument:


  (1) People voluntarily watch sad plays and enjoy them. (2) Enjoyment is just the
  presence of pleasant feeling. (3) When watching tragedy, our unpleasant feelings
  (grief, fear) are real and intense. (4) If we enjoy watching tragedy, the pleasure
  must come from somewhere else — the artistic presentation. (5) The artistic presentation
  could equally be attached to any content whatsoever, including the suffering of
  real people (e.g., news footage). (6) So a sufficiently well-filmed atrocity should
  give the same pleasure... Conclusion: we''d enjoy watching real atrocity if beautifully
  shot — which seems to prove too much.


  Or a better "proves too much": the argument that since we enjoy sad art, we must
  not really be sad — leading to conclusion that no fiction evokes real emotion, and
  then that testimony of grief at drama is fake. That''s the "paradox of fiction"
  adjacent. Could get muddy.


