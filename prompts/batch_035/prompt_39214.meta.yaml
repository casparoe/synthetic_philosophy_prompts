  Setup, so we''re on the same page: a driver is driving home late at night. There
  are two identical highway exits on the way. The driver is absent-minded — they know
  the setup perfectly well, but they can''t remember how many intersections they''ve
  passed, and they know they can''t remember, and at each intersection they''re in
  exactly the same mental state. Payoffs: take the first exit and you get home via
  a terrible route, worth 0. Take the second exit, great route, worth 4. Blow past
  both and you loop back home the long way, worth 1. [Something like that.]


  Their exchange, as best I can reconstruct:


  (1) Maya went first: "At an intersection it''s 50/50 whether I''m at the first or
  second one. If I exit now: half the time that''s 0, half the time 4, so 2 on average.
  If I continue now and exit at the next intersection: half the time I''m at the first
  one, keep going, hit the second, and exit for 4; half the time I''m at the second,
  keep going, and get 1. That''s 2.5. So continuing wins. Full stop."


  (2) Dev: "Your ''exit at the next intersection'' plan is a fiction. When you get
  there you''ll be in the exact same internal state, running the exact same reasoning,
  and you''ll conclude ''continue'' all over again. Absent-mindedness means any deterministic
  rule applies at both intersections. Your real options are: always exit (payoff 0),
  never exit (payoff 1), or randomize. If you exit with probability p at each intersection,
  the payoff is 4p(1-p) + (1-p)^2, which maxes out at p = 1/3, giving 4/3. That''s
  the best you can actually get, and you should decide ex ante to be that kind of
  driver."


  (3) Maya: "But then my per-intersection numbers can''t both be right. If 50/50 is
  my credence, exiting at an intersection is worth 2, which beats your 4/3 — but if
  I follow ''always exit'' I get 0 for sure. So either the 50/50 is wrong or your
  policy math is wrong. Also your 1/3 coin flip means that sometimes I''m standing
  at the SECOND intersection, where exiting is a guaranteed 4 versus 1, and I''m supposed
  to flip a biased coin about it??"


  (4) Dev: "The 2 is an illusion because your action at this intersection is perfectly
  correlated with your action at the other one — it''s one decision wearing two hats,
  not two decisions. Per-action expected values that ignore that are exactly the mistake
  causal decision theory makes in Newcomb. And yeah, you flip at the second intersection,
  because ex ante that''s the price of the policy being any good. Sucks to be absent-minded."


  (5) Maya: "Here''s the thing though. How likely I am to be at the first intersection
  depends on my policy! If I''m the kind of driver who exits with probability 1/3
  at each intersection, then the expected number of intersections I reach is 1 + 2/3
  = 5/3, and conditional on finding myself at an intersection, I''m at the first one
  3/5 of the time, not 1/2. If I always exit, I''m at the first intersection with
  probability 1 — that''s why ''always exit'' is worth 0 even though ''exit is worth
  2 given 50/50.'' The 50/50 just isn''t a policy-independent fact. So your 4/3 calculation
  and my 2.5 calculation are both using a credence that maybe nobody should have,
  and honestly I wonder if half this fight is about which credence to condition on."


