  Prompt (casual, PhD student in philosophy or criminology):


  ---


  I''m a PhD student in philosophy working on jurisprudence, and I''ve been going
  through sentencing cases trying to figure out whether I''m secretly a retributivist
  or a consequentialist about punishment, because my gut verdicts are all over the
  place. Here''s my list — tell me if there''s a principle (or pair of principles)
  that captures them, and don''t be shy about telling me which verdicts I should drop.


  Cases + verdicts:


  1. Two people commit identical vandalism the same night. One is caught, one never
  is. I''m fine with the caught one being punished, and I don''t feel the state owes
  the unlucky one anything, but I also don''t think his punishment should be *extra*
  harsh to compensate for the partner''s escape. (Actually some judges do exactly
  this... hmm.)


  2. Attempted murder where the gun jams vs. completed murder where it fires — identical
  intent and action, luck decides. I keep flip-flopping: my gut says the completed
  murderer deserves more, but whenever I say that out loud I also want to insist moral
  luck is bogus.


  3. A dictator is tried 40 years later, now elderly and demented, no longer connected
  to his past self. I say punish him anyway. But when it''s an ordinary criminal who''s
  reformed, genuinely changed, I go soft. These two feel consistent to me but everyone
  tells me they can''t both be right.


  4. Parking/speeding fines calibrated to expected deterrence — the state sets fines
  higher because detection is spotty, so the expected cost is right. Totally fine
  with me, seems like straightforward consequentialism about enforcement. But I''d
  be horrified by convicting a known-innocent scapegoat to stop a riot, even when
  the numbers are better. Where does that line get drawn and why does it feel so obvious?


  5. Attempted crimes punished less than completed, standard practice — fine. But
  punishing possession/conspiracy before any harm — I''m ok with this too, which seems
  hard to square with desert.


  6. Someone punished at the top of the range to "send a message" to others — I hate
  it, but I accept plea-bargain discounts partly for docket efficiency, which seems
  like consequentialism by another name.


  7. A dying patient / someone with 3 months to live gets a suspended sentence...
  fine with me. Similarly, short prison sentence that will destroy career vs fine...
  hmm.


  Maybe 6-7 cases is enough. Include at least one pair hard to reconcile: 2 and 3,
  and 4.


  Then ask: what principle captures them, what does it say about a further case (e.g.,
  punishing a person for a crime committed while undetected over decades — cumulative
  sentencing for the "uncaught" ones, or punishing a company), and which verdict to
  drop.


  Epistemic request: "Please say how confident you are in the overall reading and
  flag the bit you''re least sure of."


  Also might offer a tentative principle: maybe the asker has a half-baked idea —
  "desert as a side constraint rather than a positive aim" (this is roughly a known
  view — von Hirsch, Morris). But maybe keep it: asker could say "my tentative thought
  is desert sets a ceiling and floor but within that range consequentialism gets to
  play, but I can''t make it give me verdicts on #2 and #4" — nice, gives the answer
  something to repair.


  Casual typos: "recidivism" misspelled, "dont" etc. Keep natural, 1-2 typos.


  Length: moderate. Write it.'
