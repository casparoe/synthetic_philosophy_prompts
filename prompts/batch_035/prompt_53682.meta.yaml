  itself compiled by the scale. Some philosophers say this is exactly how perceptual
  knowledge works: each individual perception is justified until defeated, and we''re
  allowed to trust our senses without first proving them reliable. Others say that''s
  not knowledge, it''s bootstrapping — helping yourself to the reliability of the
  very source you were supposed to be checking, just spread out over time so it looks
  less circular.


