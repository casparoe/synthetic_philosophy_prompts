  use the same substance, water, which makes it feel like a shared vocabulary, but
  each analogy quietly imports different features: the riverbed one imports irreversibility
  and increasing returns (a channel gets easier to follow the more it''s used, and
  switching costs mount), while the ocean one imports a fixed attractor that the flow
  was always going to reach.


