  ---


  Retired physicist here (materials science, mostly semiconductors, 34 years at a
  national lab). Since retiring I''ve been working through the philosophy of mind,
  and my reading group has spent two months on the whole Lucas–Penrose thing: the
  argument that Gödel''s incompleteness theorem shows human mathematicians aren''t
  Turing machines. I want to make a handout that sorts people by what they actually
  believe about the argument, and I''ve realized I need it to be a decision tree,
  because the debate doesn''t really split along "mechanist vs anti-mechanist" the
  way pop books present it. It splits on much smaller hinges, and people on the same
  side of the big labels end up on opposite sides of the small ones.


  The tree should start from a neutral point someone in the group can accept: that
  Gödel''s theorem shows that for any consistent formal system strong enough for arithmetic,
  there''s a true arithmetical sentence it can''t prove. From there the branch nodes
  should each be a question a person could answer without knowing which position it
  leads to. I have some ideas for nodes but I''m not sure I''ve got the right ones,
  so correct me if there''s a better carving:


  1. Does the Gödel step require that the mathematician sees the machine''s consistency/soundness,
  and if so -- is that something a fallible human can actually have, or only an idealized
  "perfect mathematician"? (People in my group fought about whether Lucas was talking
  about real mathematicians or an idealization.)

  2. Does the conclusion fail if we can''t know which machine we are -- i.e., is the
  argument only against "I am machine M" for specific M, leaving open that we''re
  some machine we''ll never pin down? One guy in the group calls this the "existential
  vs. specific" escape and swears Putnam pressed something like it.

  3. Is our own consistency something we could ever know? If a machine can''t prove
  its own consistency, but neither can we (we''re a mess of heuristics, we make errors),
  the symmetry might save mechanism. Someone said Gödel himself thought the argument
  only works if you assume the human mind can see its own consistency, and he was
  more careful than Lucas about it.

  4. If the anti-mechanist conclusion goes through, does it follow that some physical
  process in the brain is non-computable (which is Penrose''s move -- he then has
  to go looking for it in physics), or does it only say something about "mathematical
  understanding" abstractly?

  5. Do errors and self-correction matter -- i.e., can the mechanist reply "humans
  are inconsistent systems that sometimes assert falsehoods, so Gödel doesn''t apply
  cleanly"? And is the anti-mechanist entitled to just stipulate we''re at least consistent
  enough?


  Leaves I''d like to see (with names if the literature has them, or "unnamed" if
  not): strong Lucas (mechanism is flat false, we can see any machine''s Gödel sentence),
  the idealized-mathematician version, Penrose''s position (non-computable physics
  plus a story about consciousness), the "we''re a machine but not a knowably sound
  one" mechanist, the "we''re inconsistent and that''s fine" mechanist, and the deflationary
  position that the whole argument just ignores the difference between a theorem and
  what follows from a theorem. If your tree can''t actually separate two of these
  -- say the last two mechanist ones -- flag it rather than pretending a question
  splits them when it doesn''t. And please note at the end which node does the most
  work, because if the group can settle that one question, half the debate collapses,
  and I''d like to run the next meeting on exactly that.


  Also, if you think there''s an important position my five nodes can''t place anywhere
  on the tree (something about robots, or about "algorithms" vs "formal systems" vs
  "Turing machines" being different targets), add the node. But every node has to
  be answerable by our token non-philosopher, an engineer who''s willing to answer
  hypotheticals but refuses to learn jargon.


