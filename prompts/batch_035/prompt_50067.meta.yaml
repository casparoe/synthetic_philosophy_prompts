  - The Renaissance is not a real period: a label minted by art historians and then
  projected onto politics, economy, and thought, where it carves nothing.

  - The Scientific Revolution is a real period, dated to the middle and later seventeenth
  century, when mathematical-experimental natural philosophy became the dominant way
  of producing knowledge about nature.

