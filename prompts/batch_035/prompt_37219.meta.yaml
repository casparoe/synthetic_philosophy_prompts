  \ depends only on whether the agent's plan formally includes it... Hmm.\n\nA known\
  \ hard issue: the \"closeness\" problem and the means/side-effect distinction manipulation.\
  \ Also the \"loop\" case (Thomson's loop trolley): the trolley is diverted onto\
  \ a track with one person, and if he weren't there, the trolley would loop back\
  \ and kill the five — so the one's death is arguably a means (it stops the trolley),\
  \ making it impermissible under DDE even though it's structurally the same as standard\
  \ divert. That's Thomson's own contribution — a niche-ish but well-known twist.\n\
  \nI could build an argument that seems to show DDE forbids too much or permits too\
  \ much:\n\nAskers's argument: \n(1) DDE: it's wrong to use a person's death as a\
  \ means to saving others, but a death that is merely foreseen as a side effect of\
  \ a good act can be permissible.\n(2) In the standard trolley case, the driver diverts\
  \ the trolley to the side track; the one's death is a side effect, so permissible.\n\
  (3) In Thomson's loop case, diverting works only because the one's body stops the\
  \ trolley; his death is part of the causal route to saving the five, i.e., a means;\
  \ so DDE forbids it.\n(4) But the loop case differs from the standard case only\
  \ by a stretch of extra track that the trolley would never reach if the one dies;\
  \ the agent's intention is the same in both.\n(5) If permissibility can turn on\
  \ a difference in the world that the agent is unaware of and that makes no difference\
  \ to anyone's prospects, then permissibility is not a fact about the agent's act/intention\
  \ at all — DDE, which was supposed to be about intention, has become hostage to\
  \ irrelevant facts about the layout of the track.\n(6) Something that turns on irrelevant\
  \ facts can't be the ground of a moral distinction.\n(7) So DDE fails.\n\nHmm, that's\
  \ more a tension argument. The \"prove too much\" type: conclusion absurd, asker\
  \ can't accept it.\n\nAlternatively: an argument that DDE proves too much — e.g.,\
