  ---


  I''m a cognitive science PhD student who ended up in a reading group with people
  from philosophy of science, and I keep bumping into an argumentative move there
  that I can''t put a standard name to. The pattern: someone establishes a purely
  mathematical fact about a formal model — that exact inference in an arbitrary Bayesian
  network is NP-hard, say, or that no comparison-based sort can do better than on
  the order of n log n comparisons in the worst case — and then, with no further empirical
  premise, draws a substantive conclusion about what actual physical systems can do.
  The brain can''t literally be doing exact inference, because that would require
  solving an intractable problem, so it must be approximating; any proposed device
  that seemed to crack hard instances at scale would be presumed fraudulent or mistaken,
  as though NP-hardness were a conservation law rather than a statement about abstract
  machines. What interests me is the missing bridge: the proof quantifies over algorithms
  in a formal model of computation, the conclusion is about neurons or lab equipment,
  and the only thing connecting them is the prestige of complexity theory.


  I''ve noticed the move runs in both directions, which makes me think there''s a
  real phenomenon here rather than one philosopher''s idiosyncrasy. Downward, worst-case
  bounds get treated as constraints on what organisms and engineers can achieve —
  even though almost everyone agrees the instances nature actually serves up are typically
  far easier than the adversarial ones the bounds quantify over, and there''s a whole
  line of work on why realistic instances behave so much better than the worst case.
  Upward, that very easiness gets promoted into something that seems to demand explanation,
  as if the fact that the physical world doesn''t confront us with hard instances
  is a contingent, quasi-anthropically suspicious feature of our universe rather than
  a triviality about which problems we happened to evolve to care about.


  The nearest things I''ve found are the extended Church-Turing thesis, which sounds
  close but is normally stated as a conjecture about physics from which complexity
  conclusions flow, whereas this move runs the other way, from a mathematical result
  to a claim about what physics permits; the logical omniscience problem in formal
  epistemology, which is about idealized agents rather than machines; and plain engineering
  talk about feasibility, which is different because it''s explicitly about our contingent
  resources. Is there an established name for this reification of model-relative resource
  bounds into what look like physical constraints, and for the broader practice of
  treating complexity classes as features of the universe? If some piece of the philosophy-of-science
  or philosophy-of-computation literature has already carved this, please tell me
  how it carves it; if not, I''d like a coined term with a definition, and with its
  boundaries fixed — in particular, where exactly it stops being this phenomenon and
  becomes either an ordinary auxiliary premise about typical-case difficulty or a
  genuinely physical limit like Landauer''s principle. I won''t be satisfied with
  just being told it''s related to the Church-Turing thesis.


  ---


