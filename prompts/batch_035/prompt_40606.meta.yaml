  group more often OR misjudge who reoffends" — this actually roughly gestures at
  the tradeoff, but conflates. (c) The claim it can''t be "equally accurate" — the
  impossibility is not about equal accuracy (accuracy parity is a different condition).
  (d) "fairness is mathematically impossible" — overgeneralization from specific pairs
