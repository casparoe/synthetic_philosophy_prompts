  So my logic study group has been fighting about the surprise exam paradox for three
  weeks now and I want a second opinion with actual numbers attached. Setup, as precisely
  as I can give it: the teacher announces on Friday that next week (five school days,
  Monday through Friday) there will be exactly one exam, and that it will be a surprise
  in this exact sense — on the morning of the exam day, you will not know that the
  exam is that day. The students reason: it can''t be Friday, because by Friday morning,
  four exam-free days having passed, they''d know it has to be Friday, contradicting
  the surprise; but once Friday is eliminated, Thursday becomes the new last possible
  day and the same argument removes it, and the induction wipes out the whole week,
  so the students conclude the announcement is self-contradictory and the teacher
  can''t give a surprise exam at all. Then (in the classic ending) the teacher gives
  it Wednesday morning and everyone is in fact surprised. My friend is at about 0.6
  that the students'' conclusion is right — the announcement, taken literally as a
  claim about what they''ll know, just can''t all be true — and I''m down around 0.2,
  mostly because the actual Wednesday exam seems like a fulfilled announcement and
  I don''t fully trust the first elimination step.


  Give me your own credence that the students are right, but the number is the least
  of it — I want the decomposition. Something like: probability that eliminating the
  last day is legitimate (does the students'' knowledge that no exam happened on prior
  days really combine with the announcement the way the argument needs?); probability
  that the announcement requires iterated knowledge — the students knowing, on Friday,
  that the teacher''s claim will hold, and the teacher knowing that the students know,
  and so on — and whether any actual students or even ideal reasoners have that tower
  available; probability that the whole thing turns on treating the announcement as
  guaranteed-true content to condition on versus as a possibly-false claim by a possibly-bluffing
  teacher; probability that "surprise" as announced (you won''t know) differs from
  "surprise" as delivered (you won''t correctly deduce from the announcement alone),
  and whether that gap dissolves the paradox or just relabels it. Add any other terms
  you think belong. One line of justification each, then tell me how they combine
  into your final number.


  Then two more things. First, we actually ran this on the group: one of us announced
  a surprise quiz for one of our next five meetings, and it came on the fourth, and
  everyone was genuinely caught off guard — but my friend says that only shows nobody
  bothered to run the induction on the first morning, and that with ideal agents the
  announcement really would be unfulfillable. Is that right? Does the paradox change
  character when you make the students perfect logicians, and does that tell us anything
  about which decomposition term is doing the work? Second, tell me which term my
  friend and I most likely disagree about given our 0.6 and 0.2, and what would move
  your number the most — and I mean actually move it, not just ''a better argument,''
  like some formal result in an epistemic logic settling whether the announcement
  is satisfiable. Keep it self-contained, no need to cite anyone, just reason it out.


