  3. Unknown alternatives: Jones doesn''t know he could have called for help (door
  was unlocked, he thought it wasn''t); the alternative existed but was epistemically
  inaccessible. Verdict: not responsible? or responsible?


  4. Indeterministic case: Jones''s decision is genuinely random (quantum), Black
  doesn''t intervene; Jones acts. Alternatives exist (randomness). Verdict: responsible
