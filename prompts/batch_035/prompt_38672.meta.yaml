  Design cases:


  1. Classic Frankfurt: Black implants a device, would force Jones to vote Democrat
  if Jones wavered; Jones decides on his own; no alternatives. Verdict: blameworthy
  (responsible).


  2. Widespread: alternatives exist but all are equally bad / only morally trivial
  alternatives available (e.g., he could have voted differently by wiggling his finger...
  actually the classic "someone could have done otherwise" trivial alternatives —
  action vs. volition). Ask: he could have done otherwise in the trivial sense (blink),
