  Design: setting: undergrad seminar on philosophy of religion, 15 students, 75-90
  minutes. The activity: "World-selection committee." One or few students play the
  role of a creator-deity with limited epistemic access; others play free agents with
  sealed envelopes of how they''d choose (they decide on the spot, secret ballots).
  Rounds: creator proposes a "world" = a set of circumstances; agents then freely
  choose; creator wants to select a world where, say, at most one person commits a
  betrayal, or everyone cooperates. Creator can only create a world by committing
  to circumstances without knowing outcomes — but the game allows the creator to consult
  "would you..."? The twist: participants must answer honestly under a honor code,
  and some get to decide spontaneously at the moment rather than pre-commit, showing
  the difference between pre-commitment (deterministic) and deciding at the moment
  (indeterminacy). Hmm.


  Better mechanism: The creator must submit, in writing, a full description of the
  world including every choice every creature makes, before the creatures choose.
  If the description matches all actual choices, creation "succeeds" (the world exists);
  if any mismatch, the world "collapses" (creation fails — you get a chaotic world
  / the creator must accept whatever actually happens). This makes participants feel
  the epistemic problem: to create the world, the creator needs to already know truths
  about free choices that don''t yet exist and aren''t settled by the circumstances.
  Debrief: three moments of knowledge (natural knowledge — necessary truths/logical
  possibilities; middle knowledge — true counterfactuals of creaturely freedom; free
  knowledge — truths known because decreed). The game lets participants feel moment
  1 and 3 but the middle knowledge is the black box; the debrief names Molina.


  Predictable failure modes: participants coordinate to foil the creator out of mischief;
  participants pre-committing in their heads (making middle knowledge trivially available
  — which is actually the theological determinist escape); some participants deliberately
  choosing randomly (indeterminacy, making it impossible).


  Also honesty note: what the game can''t reproduce — the eternity/extra-temporal
  aspect, and the fact that in Molinism the counterfactuals are true independent of
  the decree; the facilitator must supply that.


