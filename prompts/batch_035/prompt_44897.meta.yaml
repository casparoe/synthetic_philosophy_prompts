  make sense under? Candidates I can see: an epistemicist reading, on which the statute
  merely locates, however arbitrarily, a cutoff that in some sense already exists
  for the predicate adult; a supervaluationist reading, on which the statute stipulates
  one precisification in the penumbra and the sharp line is true only according to
  it; or a merely conventionalist reading on which the line manufactures legal truth
  rather than tracking any boundary at all. Tell me which of these the practice strictly
  requires, which it merely fits well with, and where it is underdetermined. Two further
