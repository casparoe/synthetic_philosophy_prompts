  ---


  I''m a backend/systems engineer, no philosophy training, everything I know about
  ethics I picked up from blog posts. My friend who did a philosophy degree keeps
  bringing up this "utility monster" thing — Nozick''s objection to utilitarianism.
  As I understand it: imagine a creature that gets vastly more welfare out of any
  resource than anyone else does, so a utilitarian who just sums up everyone''s welfare
  and maximizes the total has to hand everything over to the monster and let everyone
  else live at subsistence, and that seems obviously wrong, so something''s broken
  in the view. I think I actually deal with a version of this at work, and I want
  you to translate the philosophical debate into my vocabulary so I can see if I''ve
  understood it right or am fooling myself.


  Here''s my world: we run a shared cluster, and a scheduler has to divide CPU, memory,
  network between a bunch of services. Different services get different value per
  unit of resource, the value is measured in some common unit (latency targets hit,
  revenue, whatever — the SLO is converted to points), and the naive scheduler is
  exactly a utilitarian: pick the allocation that maximizes total points. And yes,
  we have literally had utility monsters: some poorly-designed batch job that gets
  a huge win from every extra core, so the sum-maximizing scheduler starves everything
  else until someone patches in a fairness constraint. The fixes we actually use are
  proportional fairness, max-min fairness, hard minimum guarantees (everybody gets
  a floor of resources no matter how little they produce with it), and sometimes just
  capping how fast any one service can grow its share.


  So the request: restate the utility monster debate in this vocabulary, as faithfully
  as you can. Treat each person as a service with a utility function over resources,
  the utilitarian as a sum-maximizing scheduler, and the monster as a service whose
