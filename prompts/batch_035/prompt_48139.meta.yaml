  of minimum thresholds/floors, the "fair shares" idea, the Nozick point itself —
  into scheduler terms: proportional fairness, floors, caps, and so on. For each,
  say what carries over, what you had to distort to make it fit, and what doesn''t
  express at all in my vocabulary.


  Then the residue report, which is the part I actually care about. Two questions.
  First: in my world there''s an obvious answer to "which aggregation is correct?"
  — whoever owns the system writes the spec, and fairness constraints are there because
  the *owners* (or the customers, or the people running the services) would not accept
  a cluster that starves them, so the aggregation function is ultimately justified
  by appeal to something outside the system, namely what the stakeholders will tolerate.
  Does the philosophical debate have anything like that? Is "don''t be a utilitarian"
  just "the people wouldn''t accept it", or is the philosophers'' point something
  my spec-author story can''t capture? Second: my intuition says the monster case
  is just bad engineering — sum was the wrong aggregation, fine, pick a different
