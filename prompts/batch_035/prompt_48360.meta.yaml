  Here''s the thing that puzzles me. Most big organizations (companies, government
  agencies) have some version of "stage-gate" project governance: at each gate, a
  committee re-justifies the project from scratch, and the official doctrine is that
  money already spent is irrelevant — evaluate as if you were deciding today whether
  to start this project, with the remaining costs and remaining benefits. That''s
  basically the sunk-cost rule from decision theory.


  But the same organizations do two other things that don''t obviously fit. First,
  in the actual gate meetings, people argue with completion percentages: "we''re 80%
  done, walking away now would waste everything we put in." Everyone officially rejects
  that argument, yet it keeps working, and projects that are far along almost never
  get killed. Second, the accountability apparatus — post-mortems, who gets blamed,
  how a write-off is announced — treats the money already spent as mattering enormously,
  just not for the decision: it matters to persons and careers. So sunk costs are
  irrelevant to the decision but decisive for the blame.


  So my questions. What theory of practical rationality does the official doctrine
  presuppose — something like: a decision is a forward-looking intervention, and the
  decider at the gate is a fresh time-slice with no history? And does the completion-percentage
