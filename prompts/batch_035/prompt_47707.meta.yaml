  the captain who kills the robber to save the merchants, the lie told for someone''s
  benefit — pull in opposite directions. Design an in-class deliberation game that
  stages this tension so that students run into it before I name it.


  Here''s roughly what I have in mind, though I''m happy to have it restructured:
  a famine-village council simulation. Students are village elders during a drought,
  each privately assigned one of the five precepts as a personal binding constraint
  (they may not openly argue for, though they may abstain on, any motion that violates
  their precept). The council passes motions over three or four rounds of increasingly
  dire scenarios — grain allocation, a bandit who can be stopped only by deception,
  a sick traveler who will die unless medicine is stolen. I want two ledgers kept
  separately: a merit ledger, where the group scores the purity of intention behind
  each motion after it passes, and a welfare ledger, where I, as facilitator, resolve
  outcomes from a partly randomized table I don''t show them, so that the same kind
  of decision can produce different results across rounds.


  The payoff scheme should not use real money. What I want is for the two ledgers
  to visibly diverge by the end — so that students discover they have been playing
