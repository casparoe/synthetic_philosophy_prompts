reasoning_summary: 'Domain choice: "What are emotions? (judgments, perceptions, or
  feelings)" — combines well with probability estimate type. Write a prompt asking
  for a credence that emotions are perceptions of value, decomposed. Written from
  perspective of non-academic person who thinks on their own. One to three paragraphs,
  polished but no academic background. Avoid niche theories that are too obscure —
  perception theory of emotions (de Sousa, Prinz), judgment theory (Nussbaum, Solomon),
  feeling theory (James) — these are well-known to LLMs. No citations/reading lists
  asked.


  Make it in the weeds somewhat: mention specific puzzle cases to seed — e.g., recalcitrant
  emotions (fear of flying while knowing it''s safe), animals/infants having emotions,
  music-induced sadness being pleasant, alexithymia maybe too niche. Keep to well-known
  stuff: fear of flying, grieving someone you know is dead, enjoying sad music. These
  are standard examples in emotion theory that a model would know but a "person thinking
  on their own" would naturally hit.


  Draft:


  ---


  I''ve been thinking about fear of flying on my own... I know the plane is safe,
  I trust the statistics completely, and yet my hands sweat and my stomach drops.
  When I try to figure out what''s going on, I notice three ways people around me
  describe emotions, and I can''t tell which is right: my brother says the fear is
  a judgment ("part of you believes the plane will crash, that''s what the fear is"),
  my therapist talks as if fear is a perception — that my amygdala... no, non-academic.
  "like the fear is detecting something, the way your eyes detect a table." And a
  friend says it''s just a feeling, a bodily state, the racing heart and the sweat,
  and that''s all there is.


  Prompt asks: credence that emotions are perceptions of value (or whichever of the
  three), decomposed into sub-questions: do emotions represent the world (have correctness
  conditions)? Can something be a perception if it can''t be revised by the beliefs/knowledge
  of the person having it (recalcitrant emotions)? What about animals and infants
  who seem to have emotions but arguably no judgments? Where does the pleasantness/unpleasantness
  fit — is it part of the emotion or a separate feeling about it? Then combine, say
  which sub-question moves the number most, and what would shift it.


  Give my own tentative lean: maybe 0.5 toward perception view... Or give the asker''s
  credence. Let''s say: "My own tentative number is around 0.45 for the perception
  view, 0.2 for the pure judgment view, 0.15 pure feeling, rest on ''none of the above
  cleanly.''"


  Also add the sad-music puzzle: I can feel genuinely sad at a sad song and enjoy
  it at the same time — does that mean the feeling and the evaluation come apart?


  Keep it 2-3 paragraphs, polished. No quotes from real texts — the brother/therapist
  quotes are invented dialogue, fine.


  Write it.'
