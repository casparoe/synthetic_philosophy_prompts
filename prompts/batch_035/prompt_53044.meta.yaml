  about labels (universal grammar, blank slate, etc) while actually disagreeing about
  narrower, weirder things — like whether the innate contribution is *content* (actual
  grammatical categories or principles in the head from birth) or just *biases* (some
  patterns are easier to learn than others), and whether the input is really as impoverished
  as the poverty-of-the-stimulus argument says it is. Those two axes cut across each
  other, so a plain "nativist vs empiricist" framing is useless. I want the quiz to
  sort people on the axes, not the labels.


  Please write 8-10 questions. Each one should be a concrete finding or case, with
  2-4 answer options about what you''d conclude from it — phrased so someone can answer
  without knowing which theory the answer feeds. These cases have to show up somewhere:


  - The classic structure-dependence thing: kids move auxiliaries correctly in "Is
  the man who is tall singing?"-type questions and apparently never try the linear
  rule, and nobody corrects them when they get things wrong (no negative evidence).

  - The artificial-language experiments where infants segment speech by tracking transition
  probabilities between syllables after a couple minutes of exposure.

  - Nicaraguan sign language / creoles: a whole community of deaf kids basically built
  a full grammatical system out of an impoverished pidgin input.

  - Kids'' overregularizations like "goed" and "foots," and the wug test (they decline/inflect
  a made-up word they''ve never heard before).

  - The point, going back to people like Chomsky''s critics, that child-directed speech
  is actually pretty grammatical and rich, so maybe the stimulus isn''t poor to begin
