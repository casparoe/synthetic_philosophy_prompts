  ---


  For the past decade I have written about science and ideas for a weekly broadsheet,
  and the beat has left me with a conviction I have never dared put in print: that
  the covering-law model of explanation, which Carl Hempel originally advanced for
  history and then generalised to science, is basically right about everything, including
  history. When a historian explains why the Weimar Republic collapsed, or why a general
  took a particular decision, I take this to be, at bottom, the same operation as
  a physicist explaining the deflection of light: subsumption under general laws,
  except that in history the laws are left tacit, hedged with implicit ceteris paribus
  clauses, and rarely rising above the statistical. Hempel''s own admission that historical
  explanations typically arrive only as sketches, to be filled in by further research,
  strikes me not as a retreat but as an accurate description of most working explanation
  outside the physics textbook. I would like to know what would count against this
  view.


  Two objections I have encountered seem to me the strongest, and I would like them
  taken seriously rather than as warm-up material. The first comes from William Dray''s
  old criticism that historians often explain an action by citing the agent''s reasons,
  and that citing a reason makes the action intelligible without invoking any law
  at all — no generalisation from which the event follows, just the fact that, given
  what he wanted and believed, this was the thing to do. I know the standard rejoinder,
  that reasons are causes and that there must be some tacit generalisation linking
  reasons to actions, and I would like to know whether that rejoinder actually has
  content or merely postpones the day of reckoning by leaving the generalisation unspecified.
  The second is W. H. Walsh''s idea of colligation: the claim that historians do irreducibly
  explanatory work by organising events under a single concept — the Reformation,
  the Cold War, the Slide into War — in a way that is neither subsumption under law
  nor mere bookkeeping. If that is right, my view has a hole in the middle of it;
  if it is not, I want to know what colligation reduces to on a covering-law account,
  and whether the reduction is illuminating or merely verbal.


  So: tell me what would count against the covering-law view of historical explanation.
  Rank the defeaters from fatal through serious to merely awkward, say which of them
  a committed Hempelian would concede as counting against the view and which would
  instead be explained away, and be candid about whether the view, once it has absorbed
  Dray and colligation and the elusiveness of its laws, has been qualified into something
  unfalsifiable — and, if so, whether that is a defect in a view of this kind or just
  the ordinary fate of a philosophical programme. I am prepared to be moved: I would
  rather not defend a tidy line in a column that philosophers of history would rightly
  regard as complacent, and I would equally rather not abandon it on the strength
  of objections it can actually answer.


