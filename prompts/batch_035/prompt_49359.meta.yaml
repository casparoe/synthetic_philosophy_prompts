  not all bridges — narrow class wins.

  2. Estimating my own risk of dying before 80: class of 70-year-old men in my country,
  not all humans who have ever lived — but also not the class of 70-year-old male
  epidemiologists who exercise, because that class is too small/overfit.

  3. Fermi estimate of number of civilizations: use the class of... hmm, maybe.

  4. Prediction of a new ferry route''s ridership: use the class of similar routes
  in similar cities, not all transit projects — but when estimating a new particle''s
  lifetime? Scientists condition on everything known physically.


  Hard to reconcile pair: For physical systems I always condition on all causally
  relevant variables (narrow), because physical laws are the same; but for statistical/human
  systems I condition only on coarse classes (broad), because narrow classes overfit.
  Is there a principle — something like "condition on the narrowest class for which
  you have enough data for stable frequencies"? That''s the actual candidate principle.
  Then ask what it says about a borderline case: e.g., estimating the probability
  that a particular new variant escapes a vaccine — class of variants, or class of
