  use the class of 65-year-old males, or of 65-year-old male ex-smokers, or of retired
  statisticians?), Drake equation, survivorship, German tank problem, etc. A scientist
  would think in terms of model selection: more conditioning variables = more relevant
  but less data. That''s a nice tension: the finest reference class is most informative
  but has fewest members — analogous to bias/variance tradeoff. The asker''s verdicts:
  some where they use the narrow class, some where they use the broad, hard-to-reconcile
  pair.


