  I write features on science and ideas for a general-interest magazine, and I''m
  currently at work on a long piece about the science of pleasure: neuroscientists
  tracing so-called hedonic hotspots in the brain, national well-being indices that
  treat happiness as a measurable quantity, the resurgence of interest among some
  effective altruists in whether we should engineer bliss. What strikes me, talking
  to researchers and to philosophers in the background, is how often all this empirical
  confidence rests on an old and unresolved philosophical question that nobody in
  the lab ever states outright: what do all pleasures have in common? The warm glow
  of a hot bath, the click of finally understanding a proof, the taste of a ripe peach,
  an orgasm, the enjoyment of a long conversation — if a hedonist says these are all
  the same thing in different amounts, what is that thing? And if they''re not the
  same thing, what happens to the idea that pleasure is a single currency in which
  a life''s quality can be reckoned?


  I want to get the logical geography straight before I write a word. Please build
  me a classification instrument — either a decision tree or a short diagnostic quiz
  with a scoring key, whichever you judge does the job better. Start from the hedonist''s
  basic commitment, that everything finally good about a life is pleasure or the absence
  of pain, and make every internal node a question someone could answer without knowing
  any of the position labels: Does the enjoyment of a gripping chess game have to
  feel like anything at all? Is the masochist''s or chili-eater''s painful sensation,
  when it is welcomed, itself a pleasure, or only the occasion for a different one?
  If two experiences are equal in felt intensity and duration, and everyone who has
  tried both prefers one, is the preferred one strictly better? Could there be a pleasure
  with no phenomenal character whatsoever, detectable only by its downstream effects?
  The leaves should be the live positions: a single common felt quality that all pleasures
  share; pleasure as an attitude rather than a sensation; a family-resemblance or
  cluster answer with no common element; Mill''s move of denying a common element
  and splitting pleasures by quality instead of quantity; and the outright denial
  that ''pleasure'' names anything unified. After the tree or key, note which combinations
  of answers occupy no position, and say briefly whether that''s because the view
  is incoherent, unattractive, or merely unexplored; and flag any pair of leaves your
  instrument cannot really pull apart. I''d like roughly eight to ten questions or
  branch points, and a short paragraph of framing I can adapt for the piece''s opening,
  written for educated readers with no philosophy background.


