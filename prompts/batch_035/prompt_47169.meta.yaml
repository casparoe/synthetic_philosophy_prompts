  grading game where graders only see outputs vs see reasoning traces, and reward
  hacking emerges. That''s a great fit: participants feel the force of reward hacking
  and specification gaming when grading outcomes only.


  - Indirect normativity + subtle confusion question: "Since CEV asks the AI to figure
  out what humanity would want if we knew more, why not just poll more educated people?"
  Something like a confusion between idealization and elitism. Or Moore''s proof +
  confusion: "Moore''s proof fails because ''here is a hand'' assumes hands exist
  — why is this still taken seriously?" That''s the classic confusion. But it''s maybe
  too common.


  - Costly signaling + confusion: "Since the handicap principle shows that costly
  signals are honest, why don''t companies just waste money on advertising to prove
  quality?" Actually that''s semi-standard. Or "If costly signals are reliable because
  they''re costly, shouldn''t we make all signals as costly as possible?"


  - Big history + short story? Or big history + subtle confusion: "Graeber and Wengrow
  proved that hierarchy and agriculture always go together..." Hmm.


