  In the first, the ''Platonia dilemma,'' twenty people were told that if exactly
  one of them sent back a postcard, that person would win a billion dollars; if more
  than one or none did, nobody got anything. Hofstadter''s idea, superrationality,
  is that since all the players face the same problem, they will all arrive at the
  same answer, so each should choose the strategy that is best when everyone chooses
  it — in this case, entering with probability 1/20. That''s essentially the categorical
  imperative recast as decision theory: act only as you''d want everyone to act. In
  the follow-up, the ''Luring Lottery,'' a million dollars was to be divided among
  all entries received, so the game-theoretically rational move was to submit as many
  entries as possible, driving the prize to nothing, while the superrational move
  was for everyone to submit exactly one entry. The results vindicated Hofstadter:
  nearly all readers submitted a single entry, one was drawn, and the magazine paid
  out. So superrationality shows that cooperation is the truly rational strategy,
  and the experiments proved ordinary people reason superrationally."


