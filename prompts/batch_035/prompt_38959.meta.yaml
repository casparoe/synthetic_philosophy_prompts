  A podcast I listened to recently covered Douglas Hofstadter''s "superrationality"
  experiments from his Scientific American columns in the early 1980s, and summarized
  them roughly as follows: In the Platonia dilemma, an eccentric trillionaire tells
  twenty people that if exactly one of them sends a telegram by the next day, that
  person gets a billion dollars; if more than one or none does, nobody gets anything.
  Hofstadter''s notion of superrationality says that since perfectly rational players
  facing the same problem will all arrive at the same strategy, each should pick the
  strategy that is best on the assumption that everyone picks it — here, sending a
  telegram with probability 1/20. The podcaster called this "basically Kant''s categorical
  imperative dressed up as probability theory," and said superrationality amounts
  to doing what''s best for the group. In the follow-up contest, the "Luring Lottery,"
  a million-dollar prize was to be divided by the total number of entries, with each
  reader allowed to submit as many entries as they wished on a single postcard; the
  game-theoretically rational move was to submit an enormous number of entries, while
  the superrational move was for everyone to submit exactly one. According to the
  podcast, the results vindicated Hofstadter: nearly everyone submitted a single entry,
  a winner was drawn, and the magazine paid out. The podcaster concluded that the
  experiments prove that cooperation is the genuinely rational strategy and that ordinary
  people are natural superrational thinkers. The story appeals to me, but it seems
  a bit too tidy. How accurate is this summary? Which parts would Hofstadter endorse,
