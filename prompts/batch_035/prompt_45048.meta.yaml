  "I''m the vice chair of the medical executive committee at a mid-sized community
  hospital, and I''ve been asked to draft the committee''s written opinion in a peer
  review case that has split us badly. The case: an inpatient died when her potassium
  climbed to a lethal level over about fourteen hours. Three omissions are documented:
