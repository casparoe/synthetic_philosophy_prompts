  ordered no repeat; the telemetry technician noticed an abnormal rhythm and escalated
  it to the charge nurse, who was told by a supervisor that rhythm changes were ''expected''
  on this unit and let it drop; and the attending physician received two pages over
  the evening and acknowledged neither. Any one of the three, acting, would almost
  certainly have caught the trend and the patient would have lived. Under our bylaws,
  we can restrict or revoke clinical privileges only upon a finding that a physician
  ''caused or materially contributed to'' an adverse outcome — so the question of
  who caused what is not rhetorical; it decides what we''re allowed to do.


  The committee has fractured along philosophical lines, though nobody''s using those
  words. One faction holds a strict counterfactual view: an omission caused the death
  if and only if, had the person acted, the patient would have (probably) survived
  — and on that test each of the three omissions qualifies, so all three caused it,
  which strikes the rest of the committee as causation inflation: it seems to license
  finding dozens of ''causes'' (the hospitalist who wasn''t assigned, the pharmacist
  who didn''t flag the dose). A second faction takes the opposite line: nobody''s
  omission caused anything, because an omission is nothing at all, and the true cause
  was the patient''s underlying condition plus bad luck — convenient for the physicians
  but, to my mind, an evasion of the bylaws'' plain intent. A third view, which I
  find most promising but can''t articulate well, says we''re really asking whose
  conduct deviated from what the situation demanded, so the normative background decides
  which absences count as causes — which explains why we all want to blame the attending
  more than the technician, even though the counterfactual dependence runs equally
  through all of them.


