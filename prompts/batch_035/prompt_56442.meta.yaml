  ---


  I teach a second-year undergraduate course on twentieth-century analytic philosophy,
  and in two weeks I run a seminar on the analytic–synthetic distinction and Quine''s
  "Two Dogmas of Empiricism." Students will have read Quine''s essay and the Grice–Strawson
  reply "In Defense of a Dogma," but they will not yet have read anything later (no
  Boghossian, no two-dimensionalism papers). For the seminar handout, please write
  a decision tree that starts from the question "Is there a philosophically significant
  notion of a sentence that is true solely in virtue of its meaning?" and routes an
  honest answerer to a position on the analytic–synthetic distinction.


  Requirements:


  1. Build the tree from the logical space, not from a roll call of names. First fix
  the branch questions, then locate the actual positions in the space that results,
  and explicitly note any combination of answers that no one (to your knowledge) occupies,
  with a one-sentence diagnosis of whether it is unoccupied because it is incoherent,
  unattractive, or merely unexplored.


  2. Every branch node must be a question a student can answer without knowing which
  position it leads to — no node that amounts to "do you accept Quine''s holism?"
  Concretely, where possible phrase nodes around cases rather than doctrines: e.g.,
  whether "nothing can be red and green all over at once" is the same kind of truth
  as "all bachelors are unmarried"; whether Quine''s example of deliberately legislating
  "a rational animal" as the meaning of "man" shows that stipulative synonymy exists
  even if discovery-based synonymy is murky; whether Putnam''s point that "cats are
  animals" could have turned out false shows that dictionary-style synonymy is irrelevant
  to analyticity or instead that the analytic is a much smaller class than the tradition
  assumed; whether Kripke''s necessary a posteriori ("water is H2O") breaks the traditional
  biconditional linking analytic, a priori, and necessary, or just relocates which
  side of the distinction those truths fall on.


  3. The following positions must appear as leaves: (a) Quinean eliminativism about
  the distinction; (b) the Grice–Strawson status-quo defense, according to which the
  distinction is intelligible and serviceable even if Quine is right that no strict
  definition is on offer; (c) a Carnapian conventionalism on which analyticity is
  conditional on a linguistic framework, and the tree must distinguish it from (b);
  (d) an epistemic reconception on which a sentence is analytic if grasp of its meaning
  alone suffices for justified belief, which treats the metaphysical question of "truth
  in virtue of meaning" as separable — the kind of view later writers such as Boghossian
  develop; and (e) the quietist leaf for the student who thinks the whole issue is
  verbal and both sides are talking past each other.


  4. Flag, at the end, which pairs of leaves the tree cannot really separate — e.g.,
  where a Carnapian and a Grice–Strawson defender would give the same answers to every
  node — and say what further question would be needed to pull them apart.


  5. The tree should have between six and eight branch nodes and five to seven leaves,
  and each leaf should carry, alongside the position''s name, one sentence on its
  most awkward commitment (the thing its defender has to bite).


  The point of the exercise is that students arrive sorted by what they actually believe
  about the cases, not by which label they find congenial, so please check that no
  node can be answered by appeal to a slogan.


