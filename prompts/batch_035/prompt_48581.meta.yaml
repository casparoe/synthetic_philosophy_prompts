  Wait no.


  Standard taxonomy (Johnston, Bird):

  - Fink (Martin''s electro-fink): object has the disposition; if trigger occurs,
  a finking factor removes the basis of the disposition, so manifestation doesn''t
  occur. Conditional false, disposition true. Refutes (D → C).

  - Reverse fink (Johnston): a factor that would bring about the disposition upon
  trigger — conditional true, disposition absent. E.g., a glass that''s not fragile
  but a sorcerer would make it fragile and it breaks if struck. Refutes (C → D). This
  is Lewis''s sorcerer case essentially / called "mimic" by some.

  - Mask: object has the disposition; trigger occurs; manifestation is prevented by
  an independent factor, but the disposition is not removed. Conditional false, disposition
  true. Refutes (D → C) as well but differently — importantly, with masks the disposition
  remains even at the moment of triggering, which creates trouble for analyses that
  tie dispositions to the intrinsic state at the moment.


  So both finks and masks refute D→C; the difference: finks remove the disposition
  (change the object), masks leave it intact (block the manifestation). The distinction
  matters for intrinsicness: masks have been taken to show dispositions depend on
  external circumstances without altering the object; finks suggest dispositions are
  tied to what would happen.


