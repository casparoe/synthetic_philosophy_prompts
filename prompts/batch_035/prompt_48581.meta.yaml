  manifest. Bird''s electro-fink: a wire is live, but a device monitors it, and if
  the wire is about to be touched by a conductor, the device makes the wire dead just
  before contact. So the wire is live but wouldn''t conduct if touched — the disposition
  is there, the conditional is false. Finks like this also threaten stronger counterfactual
  analyses, since by the time the trigger happens the basis of the disposition is
  already gone.


  A mask blocks the manifestation while the disposition stays put. A fragile glass
  packed in styrofoam wouldn''t break if struck, but it''s still fragile — the styrofoam
  masks the fragility. Same with poison and an antidote: the poison is disposed to
  kill when ingested, but if you take the antidote first it won''t kill you.


  Really, though, finks and masks are the same phenomenon: in both cases an outside
  factor steps in and stops the disposition from manifesting; the only difference
  is whether it acts just before the trigger or just after. So the label you use doesn''t
  matter much. Masks also show that dispositions aren''t intrinsic: whether the glass
  counts as fragile depends on the styrofoam around it, not on the glass itself. Still,
  finks and masks are pretty contrived, so the conditional analysis holds in every
  ordinary case, and as an analysis it''s basically right as it stands."


