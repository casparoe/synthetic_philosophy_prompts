  Let me draft:


  Question (exam): "Explain the difference between a fink and a mask in the theory
  of dispositions, and illustrate with one example of each. Then explain why the possibility
  of finks and masks created a problem for the simple conditional analysis of dispositions."


  Student answer: mostly right — defines simple conditional analysis (SCA: X is disposed
  to M when P iff X would manifest M if P obtained). Defines fink as a background
  condition that would remove the disposition before manifestation. Gives fink example
  (electro-fink on the fragile glass). Then subtle mistakes:


  1. Conflates mask with fink: says a mask is "a condition that intervenes to prevent
  manifestation" — okay-ish, but then claims that with a mask the disposition is absent
  (like fink removes it), whereas actually with a mask the disposition is present
  but its manifestation is prevented. Actually the key difference: fink removes the
  disposition itself; mask prevents the manifestation while disposition remains. A
  subtle mistake: student says "the fink removes the disposition, while the mask prevents
  the triggering condition from obtaining" — wrong; masks prevent the manifestation
  from occurring given triggering, not the trigger.


  2. Say antidotes (Bird''s example: drinking antidote before poison) — misattribute:
  say "as Lewis argued" when it was Bird. Or claim masks show dispositions are not
  intrinsic — subtle.


  3. A step that doesn''t follow: "therefore dispositions must be analyzed in terms
  of conditional analysis with ceteris paribus clauses" or "so the conditional analysis
  is refuted and must be replaced by a counterfactual analysis" — finks actually threaten
  counterfactual analyses too.


  Common real examples: Martin''s live wire/electro-fink; Johnston''s "reverse fink"
  (a steady disposition-generating factor); masks: fragility masked by packing in
  Styrofoam; Lewis''s sorcerer (that''s a fink); Bird''s antidote case (poison disposed
  to kill but antidote masks); Johnston''s drunk driver case. Molnar, Whiten. Fine.


