  Ravi pushed back hard. To him, Goodhart''s law is simply an incentive problem: people
  game metrics, principals get outplayed by agents, and the fix is contract design,
  monitoring, and rotating the metrics before anyone can learn to exploit them. I
  found myself arguing the opposite: half the time nobody is gaming anything. If you
  select the hedge fund with the best five-year backtest, or promote the salesperson
  with the best quarter, you are mostly picking up luck and selection noise — optimizing
  on a proxy disappoints even with saints in the room, and monitoring makes no difference.
  By the end we realized we weren''t disagreeing about whether Goodhart''s law is
  true but about what kind of failure it names, and that our answers implied different
  fixes — his incentive-engineering fixes wouldn''t touch my selection-effect cases,
  and vice versa.


  The assignment. Please take the role of an expert in measurement theory and philosophy
  of social science, with a sideline in applied mechanism design... Write a diagnostic
  quiz, ten questions, titled something like "What kind of Goodhart''s law do you
  believe in?" Each question is a concrete scenario with two or three answer options...
  Scoring key mapping answer patterns onto at least these five positions:


