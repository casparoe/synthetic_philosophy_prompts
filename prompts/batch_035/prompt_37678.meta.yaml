  ---


  I''ve been asked to write up my considered position on mind uploading for a reading
  group on personal identity and future technology, and before I circulate it I''d
  like a consistency check from someone who will push back rather than nod along.
  The position, as I''d state it:


  (1) I''m a functionalist about the mind: mental life, including consciousness, supervenes
  on functional organization. And I mean this at whatever grain turns out to matter
  — I don''t want to say that gross input-output behavior is enough, since behavior
  that coarse seems too thin to carry consciousness.


  (2) On personal identity I follow Parfit: what matters in my future is psychological
  connectedness and continuity, not numerical identity. If identity and psychological
  continuity ever came apart, it''s the continuity I should care about.


  (3) I''d be willing to undergo gradual uploading: my neurons replaced a few hundred
  at a time, over several months, by devices that take over each replaced neuron''s
  input-output role — responding the same way to the same signals from neighboring
  cells. I''d expect to wake up each morning throughout as the same person, and at
  the end I''d be fully running on silicon. That is survival.


  (4) I would not undergo destructive scanning: an instantaneous scan, the biological
  brain destroyed, and a functionally identical system started up on a server. That''s
  death. The being that starts up afterwards is a new person who happens to inherit
  my memories, and I won''t be waking up anywhere.


  (5) Put to me the fission variant — the scan run twice, with both continuers kept
  running — I accept the Parfitian verdict: neither successor is strictly identical
  to me, but each gets everything that matters, and since identity was never the point,
  there''s no special tragedy here.


  (6) My account of why gradual uploading is survival, when it is, is that there''s
  no moment at which the subject goes out of existence: the process remains continuous
  in something like the way my existence is continuous through a night''s sleep, and
  it''s that continuity of the underlying process that carries me across the months
  of replacement.


