  I''ve been asked to write up my considered position on mind uploading for a reading
  group on personal identity and technology, and before I submit it I''d like a consistency
  check. Here is the position as I''d state it:


  (1) I''m a functionalist about the mind: consciousness and mental life generally
  supervene on functional organization. And I mean this at whatever grain turns out
  to matter — I explicitly do not want to say that gross input-output behavior is
  enough, since that would make the organization too coarse to carry consciousness.


  (2) I follow Parfit in holding that what matters for my future is psychological
  connectedness and continuity; numerical identity is not itself what matters. If
  identity and psychological continuity came apart, I should care about the continuity.


  (3) If I underwent gradual uploading — my neurons replaced a few hundred at a time
  by silicon devices that take over each replaced neuron''s input-output role, responding
  to the same signals from neighboring cells, over a period of months — I would survive.
  I''d expect to wake up each morning throughout the procedure as the same person,
  and at the end I''d be a functioning being on silicon.


  (4) I would not undergo destructive scanning: brain scanned at an instant, biological
  body destroyed, a functionally identical program started on a server. That is death.
  The being that starts up afterwards is a new person who happens to inherit my memories,
  and it would be a mistake — roughly the mistake cryonics boosters make — to think
  I''d be waking up on the server.


  (5) Asked about the fission version — the scan run twice, both continuers kept running
  — I accept the Parfitian verdict: neither successor is strictly identical to me,
  but both get everything that matters, and that''s enough; identity was never the
  point, so there''s no tragedy here beyond ordinary loss of contact.


  (6) What makes gradual uploading survival, when it is, is that there''s never a
  moment at which the subject goes out of existence: the process stays continuous
  in the way my existence is continuous through a night''s sleep, and continuity of
  that underlying process is what carries me across the months of replacement.


  What I''d like from you: go through these six commitments, tell me which pairs are
  genuinely in tension and how badly, which pairs only look to be in tension, and
  rank the tensions by severity. For each real tension, say what would have to give
  and what it costs. Then tell me which single revision would clean up the most. I''d
  rather not scrap the whole thing, and I don''t have a strong intuition about which
  piece is the problem — that''s what I''m hoping you can figure out.


