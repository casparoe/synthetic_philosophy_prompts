  On one side are the people from the machine-learning side of the room. They point
  to inverse reinforcement learning and its descendants: given enough trajectories,
  they say, we can recover the reward function a person is optimizing, and modern
  work on preference learning and assistance games shows the basic idea can be made
  robust — the model maintains uncertainty about the human''s reward and treats behavior
  as evidence. On the other side are people trained in philosophy and behavioral economics.
  Their stock objections are familiar by now: behavior underdetermines preference
  (the same actions are compatible with many different reward functions); people are
  not consistent optimizers, so the inference inherits their noise and their biases;
  and, following Amartya Sen''s old complaint about revealed-preference theory, a
  lot of human behavior expresses commitment, habit, or adaptation rather than preference,
  so treating it as evidence of what someone values bakes in a mistake.


  What is frustrating is that both sides agree on all of this. The IRL people concede
  that reward is only identifiable up to transformation — they note themselves that
  reward shaping leaves behavior unchanged — and they concede that humans are noisy;
  their reply is that none of this matters for the engineering goal, since a policy
  that imitates the human well is good enough, and that if you want more than imitation,
  the right move is to model your uncertainty about the reward rather than demand
  a point estimate. The skeptics concede that the engineering works fine for teaching
  a car to drive; their reply is that the interesting question was never how to clone
  behavior but whether the resulting construct deserves to be called the person''s
  preferences, and that answering it requires premises about the person that no amount
  of trajectory data supplies.


