  we treat it as the root cause, not the symbol-level ''bug'' that failed to tolerate
  it. So the practice seems inconsistent: sometimes the low-level description is the
  cause and is excused from the code''s logic; usually it isn''t and isn''t.


  I recently reread Hofstadter''s image — I think he calls it the ''careenium'' —
  of a billiard-ball machine where the same events admit two descriptions: colliding
  balls on a table, and the symbols, messages, and even beliefs those collisions implement.
  It made me wonder what our whole postmortem practice presupposes about causation.
  Does it presuppose that the symbol level — functions, protocols, expectations —
