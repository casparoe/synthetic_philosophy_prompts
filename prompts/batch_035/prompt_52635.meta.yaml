  who didn''t jump in. Doctor withholding medicine vs a stranger not donating medicine.
  A bystander who could flip a switch to divert a trolley but doesn''t — omitted.
  Vaccination case: unvaccinated person infects another — was the person''s not-vaccinating
  a cause? Case: two people both omit to do something, either alone would have sufficed
