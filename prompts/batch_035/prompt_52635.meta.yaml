  who doesn''t feed the child causes its starvation death. Both are duty-bearers in
  one. Need a genuinely hard pair: perhaps verdict that a parent''s failure to vaccinate
  their child caused the child''s measles, but that the child''s classmate''s unvaccinated
  parent (who infected the child) merely failed to prevent... hmm.


  Another hard pair: symmetric omission case. Two lifeguards both fail; either could
