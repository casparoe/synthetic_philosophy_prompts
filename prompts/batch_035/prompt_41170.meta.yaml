  Common subtle errors to embed in a Glaucon summary:

  - Attributing the ring of Gyges story to Socrates/Plato himself rather than Glaucon

  - Saying Glaucon argues people ARE naturally immoral / endorses the view, rather
  than presenting it as a challenge

  - Saying the story is about the shepherd finding a ring in an earthquake fissure
  — that''s actually right (an earthquake opens the ground, he descends, finds a bronze
  horse statue with a corpse with a ring)

  - Misrepresentation: "Glaucon argues that anyone who acted justly while invisible
  would be a fool" — actually Glaucon does say that. Hmm.

  - Common subtle errors: conflating Glaucon''s two arguments — the social contract
  argument (justice as second-best) with the ring of Gyges thought experiment; also
  the claim that Glaucon''s challenge is that "justice is only good for its consequences"
  vs. Socrates must show justice is good for its own sake, wholly apart from consequences
  — subtle point: Glaucon wants justice shown good for its own sake AND for its consequences,
  and Socrates ends up in Republic showing the just man happy even on the rack/tortured
  — the "damaged in reputation" bit.

  - A subtle error: saying Glaucon himself endorses the view; actually he says he''s
  not persuaded but wants to hear justice defended (he "decenter" — he says he''s
  "not at all satisfied"). Also saying Thrasymachus appears in Book II (he''s Book
  I).

  - Technical term in everyday sense: "social contract" — Glaucon''s account is proto-contractarian;
  okay.

  - Another subtle one: the ring made the shepherd invisible; the summary could claim
  the ring let him read minds or something too silly. Keep plausible: "the ring of
  Gyges proves that no one is willingly just" — that''s close to Glaucon''s actual
  claim though.

  - Overstatement: "Glaucon demonstrates that only reputation keeps people just" —
  he argues this, doesn''t demonstrate.

  - Conflation: Glaucon placing goods in three classes — the summary could conflate
  "good for its own sake only" and "good both for its own sake and consequences."

  - Misrepresentation: saying Plato''s answer is that the just man is happy because
  others reward him — opposite.


