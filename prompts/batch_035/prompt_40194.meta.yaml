reasoning_summary: 'Pick a domain: "Heritability: what it does and does not mean"
  — good for a verdicts-on-cases type prompt. A software engineer gives their gut
  verdicts on cases about heritability claims and asks for the principle. Include
  niche-ish injections: e.g., the case of environmental variance shrinking making
  heritability rise (heroin addict scenario), the "heritable does not mean unchangeable"
  (PKU), between-group vs within-group (height in a country), Jordan Peterson-type
  claims, "blue eyes highly heritable", maze-bright rats in enriched environments
  (Cooper & Zubek 1958) — that''s somewhat in the weeds but well-known. I should be
  careful with specific facts. The maze-bright/dull rats experiment by Cooper and
  Zubek 1958 — I''m fairly confident: rats bred for maze-bright and maze-dull, in
  enriched or restricted environments differences vanished; in standard environments
  differences appeared. This is a real classic. The prompt doesn''t need to cite it
  heavily; I could describe it without naming researchers. Actually naming it could
  risk inaccuracy; describe the result without attribution: "some classic rat experiments".


  Write casually, 2-3 paragraphs, typos allowed, British English request, confidence/least-sure-point
  request.


  Let me draft:


  Perspective: software engineer, read stuff online, friend group argument. Verdicts
  list:


  1. Height within a rich country ~80% heritable, but saying "height is 80% genes
  so the fact Dutch got taller in a century can''t be environmental" — not fine.

  2. PKU: highly heritable condition, entirely fixed by diet — heritable doesn''t
  mean immutable.

  3. IQ heritability higher in rich families than poor families (this is a real finding,
  Turkheimer) — mention cautiously as "I read heritability of IQ is higher among affluent
  families than poor ones, not sure if it replicated".

  4. Lactose tolerance / blue eyes — "eye color nearly 100% heritable so nothing environmental
  about it" — fine.

  5. Clone cuttings of a plant grown in different conditions — variance all environmental.

  6. Something harder: "if a trait is 50% heritable in a population, then half of
  any given person''s trait is due to genes" — not fine (the scoop of ice cream style
  error).

  7. Maybe a hard pair: a trait that''s highly heritable in every environment yet
  the difference between two populations with different environments is entirely environmental
  (e.g., a plant clone example / maize in two fields). Actually classic: genetically
  variable seeds, two fields with different fertilizer — heritability within each
  field high, between-field difference all environmental.


  Ask: what principle captures these verdicts, does it force dropping any, and apply
  to a case not listed: e.g., "a friend says schizophrenia is ~80% heritable so we
  shouldn''t bother with environmental interventions" or sports performance.


  Epistemic request: state confidence, single out least sure point. British English.


  Length: one to three paragraphs. Write with a couple of typos. No verbatim quotes
  from real texts, so no search needed. Good — no searches required.


  Make it elaborate: engineer background, arguing with friend Dave at work / on a
  Slack channel about IQ and heritability after reading something.


  Draft:


  ---


  I''m a software engineer, no stats background beyond ML-adjacent stuff, and I''ve
  gotten into a long-running argument with a coworker (Dave) about heritability, the
  number from twin studies. We keep going around in circles so I wrote down my actual
  gut verdicts on a bunch of claims and I want someone to tell me if there''s a single
  principle behind them.


  Here are my verdicts... list them.


  Then ask for principle, prediction on new case (schizophrenia or "we should expect
  the heritability of myopia to rise as schooling becomes universal"), which verdict
  to drop, and the confidence/least-sure request, British English.


  Cases with verdicts (as real person, some hard to reconcile):


  - "Eye colour in humans is almost entirely genetic" — fine.

  - "Height is ~80% heritable in the Netherlands, so the Dutch gaining ~20cm over
  the last 150 years can''t have been nutrition" — not fine. (Dutch height gain claim
  — actually Dutch went from among shortest to tallest; average gain over 20th century
  substantial, ~20cm is maybe too high; say "shot up over the last century" without
  number.)

  - "PKU: the trait is caused by a single gene, so it''s as heritable as it gets,
  and yet a dietary intervention completely prevents the bad outcome" — fine, and
  shows heritable ≠ unchangeable.

  - "If IQ is 50% heritable, then half of any particular kid''s intelligence is from
  their genes and half from environment" — not fine. (I know this is the ice cream
  fallacy but can''t remember who said it.)

  - The clone/plant one: "You take one genotype of tomato, clone it, grow cuttings
  in two different fields, and the field difference is 100% environmental even though
  the trait is 0% heritable... hmm wait." Actually: within each field, plants are
  genetically identical so heritability is 0; the between-field difference is environmental.
  Fine.

  - Classic rat thing: "rats bred over generations to be good or bad at a maze, then
  raised in dull vs enriched environments — in the enriched ones the difference basically
  vanished. That seems to show ''genetic'' differences can be conditional on environment
  in a way that a single heritability number hides." Fine-ish, unsure.

  - Hard-to-reconcile pair: "A trait can be highly heritable within each of two groups
  while the difference between the groups is entirely environmental" — I believe this
  is fine, but Dave says it''s in tension with my verdict that "when a trait is nearly
  100% heritable in a population, group differences in that trait are mostly genetic".
  Hmm, do I hold that second verdict? Better: asker holds verdict "If a trait is close
  to 100% heritable in a well-measured modern population, then claims that group differences
  in it are mostly environmental strike me as fighting the data" — that''s the hard
  one to reconcile.


  Then: "Dave''s own favourite claim, which I go back and forth on: ''schizophrenia
  is 60-80% heritable, so searching for environmental causes is a waste of funding''
  — I don''t like it but I can''t yet say from the principle why not" — apply principle
  there.


  Also maybe ask about heritability rising as environment equalizes (shared environment
  shrinking) — could be the new-case prediction: "our company''s well-being index"
  or "myopia".


  Keep it 3 paragraphs-ish plus a verdict list. Include a typo or two ("differnt",
  "alot" maybe too much; one or two mild typos like "recieve", missing word). British
  English: ask for British spellings ("behaviour", "realise").


  Confidence request: "where you''re least sure, flag it".'
