  Here''s roughly what each guy believes, from my notes (sorry if I mangle anything):
  Schlick says that if you ask what life is *for* — like what final goal it serves
  — you never get an answer, because any goal you name just raises the question again
  (why that goal?). So meaning can''t come from life being a means to something further.
  Instead he says meaning shows up when an activity is an end in itself: work is only
  valuable as a means, play is valuable for its own sake, and the peak of that is
  the "youthful" attitude of enjoying the thing itself instead of treating it as preparation
  for something else. Basically: meaning in life, not of life, and it lives in the
  present moment.


  Tolstoy (in A Confession) went through a midlife crisis where he realized that if
  you reason about life, everything ends in absurdity — you, your achievements, all
  of humanity, all get erased — and he says the four ways people escape that realization
  (not thinking about it, epicureanism, being strong and just living anyway, and suicide)
  are all dead ends except... none, actually; what saved him was faith, the irrational
  belief of the laboring peasants that life has meaning through God, which reason
