  pair: banning the fascist who is currently powerless but tolerating the intolerant
  majority party that wins votes. That''s a very good fit for type 1, and the topic
  is well-known (Popper is well memorized) but the case structure makes it fresh.
  The paradox of tolerance might be one that models have seen a million times though
