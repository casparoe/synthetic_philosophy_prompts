  6. A bookshop refuses to stock Mein Kampf — fine; a library removing it — not fine?

  7. The hard-to-reconcile pair: willing to ban the fringe powerless intolerant group
  but unwilling to ban the large popular intolerant movement, even though the latter
  is more dangerous. That''s the classic Popperian twist: Popper''s actual passage
  says intolerance should be tolerated as long as it can be countered by rational
