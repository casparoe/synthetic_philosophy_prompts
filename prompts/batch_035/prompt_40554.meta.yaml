  Here''s the practice that puzzles me. In psychology, medicine, and much of biology,
  a result still counts as publishable only if it passes a ritual inherited from the
  1920s: specify a null hypothesis, collect data, and report the probability of data
  at least this extreme if the null were true, with 0.05 as the magic line. In the
  past fifteen years the reform movement has bolted onto this a new set of requirements:
  preregister your analysis plan before seeing the data; journals increasingly accept
  papers on the basis of the plan alone, committing to publish the results whatever
  they turn out to be; and anyone who p-hacked, HARKed... etc.


  The first part seems to say that the evidential meaning of the data is a matter
  of long-run error rates — a p-value is defined by what would have happened across
  hypothetical repetitions of the whole experiment, including repetitions you never
  intended to run. That means the same data can have different evidential value depending
  on the sampling plan — if I had planned to stop after 100 subjects versus planned
  to peek after each subject and stop when convenient, the identical final dataset
