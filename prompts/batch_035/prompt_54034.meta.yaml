  ever tries to check anything. My issue: Quine claims the indeterminacy is in principle
  unresolvable by behavioral evidence, not just a practical headache for field linguists,
  and I want a case that actually puts pressure on that "in principle" claim instead
  of hand-waving it.


  So here''s what I want you to build. Construct a thought experiment — realistic
  fieldwork setting, no aliens, no omniscient translators — in which a field linguist
  gets to run every diagnostic a Quinean would recognize: stimulus meanings for observation
  sentences, assent/dissent patterns, query-and-point routines, the whole apparatus.
  The scenario should feature a native term ("gavagai" or invent your own) where two
  competing translation manuals genuinely agree on all of that evidence yet still
  differ on whether the term is a general term for a kind of animal or something else
