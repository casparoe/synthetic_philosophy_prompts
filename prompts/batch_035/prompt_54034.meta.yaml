  native informants who answer questions — yet indeterminacy persists in a specific
  way. Constraints: no aliens, realistic fieldwork setting.


  Alternatively: a case where indeterminacy is resolvable — where the "gavagai" problem
  disappears because of a collateral practice (e.g., the community counts, trades,
  or holds beliefs that force a unique translation) — designed to test the claim that
  only analytic hypotheses are underdetermined. Then walk through why.


  Good spec: "Build a case where two translation manuals agree on every observation
  sentence and every stimulus meaning, agree even on all the community''s assent/dissent
  behavior, and yet disagree about whether the native word is a general term for rabbits
  or a singular term for a universal (rabbit-kind). Constraint: the case must not
  simply stipulate that the evidence runs out; it must show why it runs out — what
  the community would need to do or say to break the tie, and why a realistic community
  wouldn''t. Then tell me whether adding quantification (the natives count and trade
  rabbits) actually resolves the indeterminacy or just shifts it to their numeral/quantifier
  words, and which feature of the case does the work."


