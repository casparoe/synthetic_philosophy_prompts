  religion away — the cheap reading, the one religious readers complain about, that
  any naturalistic explanation of a practice automatically debunks it. I think that''s
  wrong, and the column should say why. A good crane explanation of religion, the
  kind the cognitive science of religion crowd churns out — over-active agency detection,
  minimally counterintuitive ideas spreading better than plain or wild ones, costly-signalling
  keeping free-riders out — does not debunk anything; it explains how the phenomena
