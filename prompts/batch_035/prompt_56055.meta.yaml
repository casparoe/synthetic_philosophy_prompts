  before I decide whether I have the nerve to publish it.


  Here''s the thought. In Darwin''s Dangerous Idea, Dennett gave us two pairs of images
  that I''ve leaned on in my own writing for years: good explanations are cranes,
  built up bit by bit from mindless processes, whereas bad explanations quietly assume
  skyhooks — lifters that come down from above, i.e. designers, minds, miracles. And
  he warned about greedy reductionism: trying to explain something by jumping straight
  to the lowest level in one leap, skipping the middle-level machinery, like "explaining"
  a car by listing its atoms. So far so good; I''ve quoted that distinction approvingly
  many times.


  But then, in Breaking the Spell, he turns the crane machinery on religion — and
  here''s my hunch, the thing I need you to argue: by his own lights, that book is
  a lot more greedy than anyone admits. Not because explaining religion naturalistically
  is somehow off-limits (I don''t buy that, and I don''t want the argument to lean
  on it). Rather: the actual mechanism-work that a crane-building explanation of religion
  would require — how corporate worship practices persist without everyone believing,
  how "belief in belief" gets maintained, why people die for doctrines they can''t
  state — mostly gets gestured at rather than built. The book spends its energy on
  the case for why we should study religion scientifically and comparatively little
  on the actual assembly. It''s as if the crane operator mostly describes the crane.


  There''s a second hunch I want you to build in, and I suspect this is the actual
  contribution of the piece, if it has one: the standard move everyone (including
