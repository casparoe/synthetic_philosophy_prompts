  So I''ve been lurking around LessWrong and the rationalist-adjacent blogosphere
  forever, and structural realism keeps coming up whenever people argue about whether
  science converges on truth... A friend who''s way more into philosophy of science
  than me gave me this summary after reading some book review, and I want to know
  how much of it I can trust:


  "Structural realism is the view that when science changes theories, what survives
  is the mathematical structure — the equations and relations — not the descriptions
  of objects. Newton''s theory turned out to be a limiting case of relativity, so
  the structural content carried over even though Newton''s absolute space was flat-out
  wrong. Since objects like electrons get radically re-described from one theory to
  the next, structural realists say objects don''t really exist; only the relations
  between them are real. The main argument is the ''no miracles'' argument: realism''s
  success would be a miracle otherwise, but positing objects is what keeps going wrong,
  so keep the structure and drop the objects. It''s basically the same move as saying
  maps are real but territory isn''t. The view was killed off in the 1920s by a logician
  who pointed out that any structure can be preserved under arbitrary relabeling,
  so ''preserving structure'' says nothing at all."


