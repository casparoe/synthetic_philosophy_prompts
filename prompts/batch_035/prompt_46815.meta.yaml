  ---


  I am an undergraduate currently taking a seminar on free will and moral responsibility.
  This week we are workshopping a set of short-answer questions anonymously, and I
  have been assigned to grade one of my classmates'' responses. Our instructor has
  asked each grader to assign a letter grade and to accompany it with specific, point-by-point
  comments that justify the grade, so that the student can see exactly what was credited,
  what was not, and why. I would like you to act as an experienced grader for this
  task: read the question and the response below, assign a grade on a standard A-F
  scale, and then give the marginal comments you would write, organized point by point.
  Please be precise about what is right and what is wrong rather than giving a general
  impression; where the response makes a mistake, identify the specific sentence or
  step and explain what has gone wrong.


  The question (from our problem set on Galen Strawson''s paper The Impossibility
  of Moral Responsibility):


  1. Set out the Basic Argument against the possibility of true moral responsibility.
  Explain why Strawson thinks that being truly morally responsible would require being
  causa sui in some sense, and why he takes that to be impossible. Then raise the
  strongest objection to the argument you can, and say how Strawson would (or should)
  reply.


  The response I have to grade:


  The Basic Argument can be reconstructed in three steps. First, what you do is a
  consequence of the way you are: your character, values, and dispositions. Second,
  true moral responsibility for what you do requires responsibility for the way you
  are; you cannot be responsible, in the deep sense Strawson cares about, for an action
  that issues from a self you did not shape. Third, no one can be responsible for
  the way they are, because the way you are at any point is the product either of
  heredity and environment — genes, upbringing, things no one chose — or of earlier
  self-shaping choices, and those choices in turn flowed from an earlier way you were,
  and so on back. The regress cannot terminate anywhere you are responsible for, so
  true moral responsibility is impossible.


  The key notion is causa sui, self-caused. To be responsible for the way you are
  in the way premise two demands, you would have to have made yourself what you are,
  which would require existing, already equipped with a nature, prior to your own
  existence. Nothing can do that, so the demand is incoherent, and responsibility
  of the deep kind is impossible. Importantly, the whole argument rests on the premise
  that the way you are is fixed by factors outside your control, and that is just
  the thesis of determinism. So the Basic Argument is best read as a conditional:
  if determinism is true, responsibility is impossible. A libertarian who holds that
  a choice can originate in the agent without being fixed by prior character has a
  direct reply to premise one. Perhaps because of this, Strawson concedes that mere
  indeterminism would not help either: a choice that pops up uncaused, like a coin
  flip in the head, is not something you are responsible for. Still, the argument''s
  real target is determinism, and its real lesson is that if the determinists are
  right, nothing is anyone''s fault.


  The strongest objection is that some choices are self-forming in a way that breaks
  the regress. When someone deliberates hard and resolves to change — the procrastinator
  who reorganizes his life, the convert who rewires her values — it seems they make
  themselves the way they subsequently are. Strawson''s reply has to be that the way
  they were when they made those choices was itself not their doing: the resolve,
  the willpower, the capacity to deliberate well, all came from somewhere earlier.
  The regress restarts at every level, so the objection presupposes what it denies.


  Finally, the argument''s conclusion is practical as much as metaphysical. Following
  his father, P. F. Strawson, who introduced the framework of reactive attitudes,
  Galen Strawson holds that since no one is truly responsible, our reactive attitudes
  — gratitude, resentment, indignation — are unfitting and ought to be revised or
  given up, and practices of blame and punishment rest on a mistake. On this view
  no one is responsible in any sense at all, and the difficult question is only how
  to live with that.


  ---


