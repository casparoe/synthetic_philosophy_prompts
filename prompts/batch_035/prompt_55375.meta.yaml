  I am a graduate student in legal philosophy, and my supervisor has just approved
  a thesis chapter — due in six weeks — on Bentham''s treatment of sexual conduct
  in his writings on crime and punishment. The chapter''s core is a reconstruction
  of his track record as though he were a sentencing authority: given the verdicts
  I can attribute to him with reasonable confidence, I want to predict his rulings
  on cases he never discussed, and defend the prediction as the one most consistent
  with his own precedents. Before I commit to a chapter''s worth of prose, I would
  like to check whether my method yields stable results, and I would be grateful for
  your help working it through.


  Here is the track record as I have reconstructed it. Bentham held that consensual
  sexual acts between adult men in private must not be punished — this is the famous
  verdict of his unpublished essay, argued on the ground that the supposed mischief
  is imaginary and the punishment real. He declined to punish masturbation on similar
  grounds, and, on my reconstruction of his scattered remarks, he extended the same
  immunity to acts with animals, reasoning that the law could not consistently be
  offended by them while licensing the slaughterhouse and the plough. He drew the
  line, by contrast, at acts procured by force or by fraud, which he treated as offences
  against security in his own taxonomy, and at acts involving persons too young to
  consent. Where an otherwise private consensual act was performed flagrantly in public
  view, he acknowledged punishment — but, if I read him right, only as a minor public
  nuisance, on the model of other offenses against public comfort, not as an offence
  against the sexual norm itself. And he was unstinting in dismissing religious offense
  as a ground for punishment, given his contempt for legislating on the basis of supposed
  divine displeasure.


  My chapter needs to extend this record to three cases he never reached, and the
  difficulty is that more than one principle fits his verdicts as stated. (1) Two
  adult siblings, both past the age of consent, conduct a sexual relationship in private
  with reliable contraception; no third party is aware. (2) A widower has intercourse
  with his deceased wife''s body in circumstances she explicitly and repeatedly authorized
  before dying; the act later comes to light and causes her relatives lasting anguish.
  (3) Two adults engage in a consensual act before an audience at a private, closed-door
  club, all members having consented to what they will see, but an account of the
  evening is later published and provokes genuine, though perhaps prejudiced, distress
  in the wider public.


  Predict Bentham''s verdict on each case, if you think his precedents commit him
  to one. Then tell me which rules fit his track record equally well and where they
  diverge on my three cases — I can see at least a consent-and-privacy rule under
  which all three go unpunished, a net-utility rule under which the second and third
  become hard, and perhaps a hybrid on which publicity rather than consent does the
