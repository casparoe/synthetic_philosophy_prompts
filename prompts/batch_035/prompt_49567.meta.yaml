  Let me pick "State a set of commitments" on akrasia + hyperbolic discounting. Retired
  scientist (say a pharmacologist or chemist) who got into philosophy. Commitments:


  1. There is a real phenomenon of weakness of will: I judged it best to not have
  the third beer, I had the third beer, no new information, no change in judgment,
  and this wasn''t just a speech act problem.

  2. Hyperbolic discounting explains akrasia: preference reversals -- at t0 you prefer
  A later over B sooner; at t1 you prefer B now over A soon.

  3. But I''m also a good economist/rational-choice person: I think preferences are
  just whatever you choose / revealed preferences; there''s no fact of the matter
  about "what you really wanted."

  4. I think akratic action is irrational (criticizable).

  5. I think behavior is fully caused and don''t believe in agent causation / free
  will libertarianism.


  Tension: if preferences are revealed by choice, then there''s no conflict, no akrasia
  — you just preferred the beer. Or: hyperbolic discounting explains preference reversal
  as a consistent valuation with a non-exponential discount function, in which case
  the "reversal" isn''t irrational at all — the agent is just executing stable hyperbolic
  preferences. So commitment (2) arguably dissolves akrasia rather than explaining
  it: either hyperbolic discounting is the "true" preference structure (in which case
  the person is rational, just non-exponentially discounting), or it''s a breakdown
  mechanism, but then we need a separate standard (the exponential agent) against
  which the lapse is measured. And (4) says it''s irrational, but if the discounting
  is just how valuation works, where does the normative bite come from? Also apparent
  tension that dissolves: causal determinism vs. akrasia as blameworthy — that dissolves
  fairly easily (compatibilism).


  Belief set, casually stated:


  - Weakness of will is real: last night I decided the third beer wasn''t worth it,
  and then I drank it, fully aware, not drunk, no new information. That''s a real
  thing, not confusion or self-deception.

  - Hyperbolic discounting is the mechanism: rewards reverse in value as they get
  close. That''s the explanation.

  - I''m a revealed preference person at heart: talk of what someone "really" wants
  apart from choices is mush. There''s just behavior.

  - Given that, I''d say the akratic act isn''t irrational in the economic sense —
  the person''s discount function is just hyperbolic, not exponential — but it still
  seems like a failure, something it makes sense to be annoyed with yourself about.

  - Maybe also: I think if you know your discounting is hyperbolic you can pre-commit
  (Ulysses), and I think using precommitment is rational.


  Genuine tensions:

  - (revealed preference / no "real" wants) vs (akrasia as a real failure): if there''s
  only behavior, then the person at t1 preferred the beer, and the earlier "decision"
  is just a prediction that got overridden; calling it a failure smuggles in a privileged
  self.

  - (hyperbolic discounting as explanation) vs (calling the act irrational): if hyperbola
  is just the agent''s true valuation curve, preference reversals are consistent-with-that-curve
  and not irrational; irrationality only makes sense relative to an exponential standard,
  and why is that the standard? Also whether a "decision" made at t0 was ever an all-things-considered
  judgment or just another discounted choice (the small beer now vs the big health
