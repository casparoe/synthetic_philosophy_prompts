  burger doesn''t cause a cow to be slaughtered, one vote almost never decides an
  election. Someone else replies that if everyone reasoned that way, the harm would
  be enormous. The first person answers that they''re not everyone, they''re one person,
  and that "what if everyone did that" is a complaint about a pattern of behavior,
  not a reason for the individual. Then someone brings in the idea of being the kind
  of person who doesn''t participate in unjust systems, and the first person says
  that''s fine as a matter of self-image but doesn''t show their burger hurt anyone.
  At that point we always circle back to the start. Nobody has changed their mind
  even slightly in three months.


  I''ve been trying to figure out what kind of disagreement this actually is, and
  I have a hypothesis I want you to take seriously but not just agree with. Here''s
  what I''ve pieced together: some people who defend individual obligations apparently
  use an expected-value argument — even if no single burger crosses a threshold, each
  burger has some small chance of being the one that tips the supplier into ordering
  more animals, so you multiply the harm by the probability and get a real (tiny)
  expected wrong. Critics respond that real supply chains don''t have sharp thresholds
  like that, or that if there''s no threshold then each purchase really does do an
  imperceptible share of harm, which raises a different question of whether imperceptible
  harms can add up to something you''re responsible for. Meanwhile the voting case
  seems backwards from the other two: with elections there are actual documented razor-thin
  margins, so the individual really can be pivotal, just rarely. So maybe we''ve been
  treating three different problems as one debate. Or maybe the whole thing is really
  a fight between two theories of what makes an action wrong — whether it has to actually
  make a difference, or whether it can be wrong by participating in, or profiting
  from, a collective practice that is bad overall — and neither side realizes that''s
  what they''re disagreeing about.


