  Common subtle misrepresentations of Dutch book arguments:

  - Claiming that the Dutch book argument proves probabilities are objective frequencies

  - Conflating the Dutch book theorem (inconsistency implies vulnerability) with the
  converse (vulnerability implies inconsistency) — the converse is the harder part

  - Claiming "no rational person can be Dutch booked, period" whereas only agents
  satisfying the axioms are invulnerable, and the argument assumes bets at stake sizes
  chosen by the bookie

  - Claiming the argument shows rationality requires degrees of belief, or that it
  establishes probabilism as normative for all credences including in one-off cases

  - The "circularity" worry: the argument uses dominance/practical rationality premises

  - Presenting the standard objection (that being Dutch-bookable only matters if you
  accept all bets, or that the bookie''s stakes exploit you) as a refutation


  A good subtle misrepresentation set: (1) saying de Finetti/Ramsey proved that any
  non-probabilistic degrees of belief "can be exploited for sure loss" — accurate-ish
  for the theorem, but the summary claims the converse direction trivially and claims
  the argument shows credences must match long-run frequencies; (2) claim that the
  argument assumes agents will accept any bet at fair odds as determined by their
  credence — actually a real assumption but often glossed; (3) claim that since bookies
  rarely exist and losses are tiny, the argument is refuted — presented as a knockdown.


