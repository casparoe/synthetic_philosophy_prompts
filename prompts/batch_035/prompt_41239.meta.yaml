  but together they guarantee you lose money no matter what happens. So rationality
  requires your credences to be probabilities, and the axioms of probability turn
  out to be the logic of partial belief just like modus ponens is for full belief.
  This has been basically refuted though, because the setup assumes you''d accept
  every bet offered at those odds, and real people wouldn''t take a package of bets
  that''s obviously rigged against them — once you notice the bookie is out to get
  you, you just decline, so the sure-loss never materializes.''


  Which parts of this would a Bayesian accept, where does it slide between claims
