  skeptical about similar book arguments for conditionalization (the diachronic Dutch
  book), following how people usually push back (e.g., the "backwards book" objection
  by Maher / Hacking''s objection).

  4. I think beliefs graded by degrees are real psychological states.

  5. I think a rational agent can have vague/inexact credences (e.g., imprecise probabilities),
  which don''t satisfy precise additivity.


