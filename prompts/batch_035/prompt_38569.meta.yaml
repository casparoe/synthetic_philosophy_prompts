  say ''Keynes predicted we''d work less, he was wrong, the end,'' and I want a question
  that makes that impossible. The crux I want tested: the essay asks students to pull
  apart three things that get mashed together — the positive prediction (hours falling
  as productivity rises), the thesis about needs (absolute vs relative/positional
  needs, and which one actually drives the historical outcome), and the normative
  picture (the Moore-inflected idea that once the economic problem is solved we''d
  go back to valuing the arts of life and despising the love of money). Then the hard
  part: if relative needs really are insatiable, does that damage the prediction,
  the ethic, or both — and is the ethic something an individual could adopt on their
  own, or does it only work as a social equilibrium, since unilateral leisure in a
  status-comparing world just means losing status? Also want them to notice that productivity
  roughly did what Keynes expected while hours didn''t fall the way he thought, and
  to explain what that combination actually shows rather than just pointing at it.


  Format: please structure your response as three sections in this order. ''The question''
  — the exam question itself, written for students to answer in about 90 minutes,
  maybe 120-180 words, phrased so that a memorized summary of the essay gets them
