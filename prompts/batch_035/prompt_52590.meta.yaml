  Classic "benefits cheat" story, and my editor basically wants a scrounger narrative
  with a bit of sociology bolted on.


  Here''s my problem. When I actually sat with the case it got mushy. The boyfriend
  didn''t pay rent or bills — he was mostly between jobs and drifting — the money
  went on the usual kid stuff, and when I asked her why she didn''t declare him she
  said she genuinely didn''t know where the line was: he kept clothes at hers and
  stayed five nights some weeks, two nights others, went back to his mum''s for a
  stretch. The rules have a line; her life didn''t. Meanwhile I''ve been reading the
  government''s own overpayment figures for another story, and claimant fraud is a
  rounding error compared to overpayments caused by the office''s own mistakes — not
  to mention the underpayments they quietly hand back. And our paper''s editorial
  line, which I''m supposed to respect, is big on contributory benefits — "you pay
  in, you get out" — which treats desert as a ledger, while the fraud story treats
  it as behaviour, and I can''t tell if those are even the same notion of "earned".


  So my question, and please actually take a position rather than telling me it''s
