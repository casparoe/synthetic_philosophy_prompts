  Classroom activity type with Kavka''s toxin: design an activity making participants
  feel the difference between intending now vs. the payoff of deciding later — with
  real (small) stakes. E.g., a "toxin" game with actual small stakes: participants
  write a binding commitment now to do something mildly unpleasant later, payout if
  their commitment device... The interesting in-the-weeds angle: distinguish mere
  belief-formation from intention — Kavka plus the "reversed" versions (money pumped
  the other way: paid to intend but the intention discharges before drinking; "Sobel
  cases" / agents who can''t intend for reasons). Also the "pharmaceutical" vs "surgical"
  or "Kavka''s reversed" — cases where you''re paid only if you can''t form the intention.
  That''s somewhat niche but fine to inject as the asker''s own idea.


  Better: an activity where participants must sign a "side bet" — e.g., the professor
  offers each student $20 if, at the end of class, they will (later tonight) drink
  a disgusting but harmless tea; the professor pays at end of class before drinking.
  Students then decide whether to sign, and afterwards are asked to report whether
  they actually intend. Debrief maps onto the puzzle: can you intend at will for instrumental
  reasons? Add an in-the-weeds twist: the asker wants the game to distinguish "intending"
  from "high confidence you''ll drink" — e.g., a second condition where students bet
  on their own future behavior (a prediction market on themselves) — that separates
  believing-you-will from intending-to. That''s the serious literature: intention
  vs. belief, "self-prediction" (Spohn on self-predicting being difficult), Bratman.
  This is a nice injection: the game should have two arms, one where you''re rewarded
  for a prediction about yourself, one where you''re rewarded for an intention, and
  students should feel the difference in achievability. Debrief maps onto Kavka''s
  puzzle: the reward attaches to the state now, but the reason for drinking is gone
  later.


