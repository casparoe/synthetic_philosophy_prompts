  type well.


  Which is best? The disagreement about violence decline is very natural, in-the-weeds
  (metrics, definition of violence, fact of the matter), and meaningful without web
  access. Let me write that.


  Prompt: casual, 1-3 paragraphs, bystander reporting friends'' argument, British
