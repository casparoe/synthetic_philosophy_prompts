  has to be humans hurting humans for the claim to even make sense, B says that''s
  question-begging.

  6. Maybe a "no fact of the matter" point: one of them says there''s no single thing
  "how violent is the world" — it depends on weighting, timescales (world wars make
  the 20th century look bad, post-1945 makes it look good), what counts (structural
  violence? sanctions? poverty?).


  Ask for point-by-point adjudication and who''s more right overall. Keep it 2-3 paragraphs,
