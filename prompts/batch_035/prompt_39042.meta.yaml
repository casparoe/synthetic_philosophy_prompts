  impossible.


  The question should be answerable in about 1200 words over a 48-hour take-home.
  It must include, within the question itself, a comparison of two agent designs,
  roughly as follows: (i) a standard model-free agent whose policy was shaped by a
  reward signal during training but is now frozen — reward played no causal role at
  deployment; and (ii) an agent with a self-monitoring module that, at deployment,
  continuously estimates its own predicted return and behaves so as to keep that estimate
  high. Students must say which of the two, if either, is a better candidate for suffering,
  and why — which forces them to decide whether suffering attaches to the process
  that trained a system or to occurrent states the system is in.


  Two further requirements on the question''s content. First, it should require students
  to address the objection, drawn from the phenomenon of pain asymbolia, that suffering
  has components that can come apart — a bad-feeling component and a disliking-that-feeling
  component — and to say which component, if any, reward could be. Second, it should
  require them to confront the wireheading case: if reward simply is valence, then
  an agent that has hijacked its own reward channel is in maximal bliss, and students
  must say whether that is a reductio of the identification or a defensible consequence
  of it.


