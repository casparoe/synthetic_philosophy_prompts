  belief and desire will go the way of phlogiston and caloric, as Paul Churchland
  argued, or whether they name the causally efficacious generalizations that any cognitive
  science must traffic in, as Fodor insisted — has been more or less frozen since
  the late eighties. Eliminativists said neuroscience would supply the replacement
  vocabulary; it never did, but it didn''t vindicate the old one either, it mostly
  talked past it. And now predictive-processing people cheerfully say the brain has
  beliefs, meaning priors, which looks like it should settle something and somehow
  settles nothing. Both camps point to the same decades of cognitive science as vindication.


