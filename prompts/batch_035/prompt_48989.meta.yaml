  I''ve been in the rationalist blogosphere since the Overcoming Bias days, and it
  occurs to me that our community carried out its own small eliminativism about belief
  long ago: we replaced binary belief with credence, sorted professed beliefs into
  belief-in-belief and belief as attire and anticipations-that-pay-rent, and generally
