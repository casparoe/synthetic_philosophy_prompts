  continuity" is a conflation of the reductionist thesis with identity.

  2. "A perfect replica... is literally you" — Parfit is actually cautious; in the
  teletransporter case he does think you could survive, but the more important claim
  is what matters survives.

  3. Fission: Parfit holds identity is not what matters and that in fission the identity
