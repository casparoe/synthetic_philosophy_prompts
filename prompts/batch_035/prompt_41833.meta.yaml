  identity is just psychological continuity, so a perfect replica of you with your
  memories is literally you — teleportation is travel, not death. And since identity
  is just continuity, Parfit concludes that in the fission case where your brain is
  split and transplanted into two bodies, you survive as both people, which he took
  to show there''s no fact of the matter about personal identity at all. He also took
  the whole argument to show that our concern for our own future is irrational — since
  identity doesn''t matter, nothing about survival should matter to us. Parts of this
