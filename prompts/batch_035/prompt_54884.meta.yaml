  it — or she is a character on paper only, a thought-experiment in a skirt. My sister,
  a psychologist, insists the opposite: that no human being can hold perfect equilibrium
  at all, that attention oscillates and hunger, noise, and fatigue always break the
  symmetry before it can matter. Between them they have left me unsure whether my
  scene depicts an impossibility, a pathology, or an ordinary fact about choice that
  fiction has simply failed to notice.


