  haystacks and left to starve, an ass attributed to Buridan though scholars doubt
  he ever wrote it, and a problem older than him — appears to be my protagonist''s
  ancestor. Write an essay on whether the scenario is a genuine possibility or a reductio,
  and on what exactly it refutes if it is one. I take it there are several distinct
  questions hiding inside the one donkey, and I would like them kept apart. First,
