  I''m a third-year PhD student in machine learning, working on multi-agent systems,
  and a running disagreement with a fellow student in our reading group has turned
  into a wager we want to settle properly. The topic is what the rationalist and formal
  decision theory literature calls "commitment races", and since neither of us can
  have evidence in the ordinary sense, I want a structured credence from you rather
  than an opinion.


  The setup, so the question is self-contained: two agents are about to interact —
  bargain, trade, threaten. Schelling''s point is that in such interactions the ability
  to visibly bind your own future behavior can be a strength rather than a handicap:
  if I can irreversibly commit to walking away unless you concede 70%, and you know
  I''ve committed, your best response may be to accept 30%. The trouble starts when
  both sides have this ability and commitment is cheap to deploy but expensive to
  verify. Each agent then has an incentive to commit early, aggressively, and on the
  basis of little information, because the value of committing first is that it shapes
  the other side''s best response before their commitment shapes mine. If both reason
  this way, we can get a race to the bottom: mutually destructive commitments made
  in ignorance, or a standoff no one can back out of, even though both agents would
  prefer to have committed more cautiously and later. Some writers in the AI-safety
  literature worry that advanced AI systems bargaining with each other — or with humans
  — could fall into exactly this dynamic, since machine agents may find self-modification
  or verifiable source disclosure far cheaper than humans find constitutions and treaties.


  My credence that this is a genuine structural phenomenon — that is, that there exist
  realistic conditions under which independently rational agents with access to commitment
  technology end up in mutually worse outcomes specifically because each rationally
  commits early rather than late — is about 0.75. Hers is about 0.25; she thinks the
  race is mostly an artifact of idealizations: perfectly transparent commitments,
  one-shot interactions, and agents assumed to reason about each other in a way that
  real actors, whether human or machine, won''t sustain.


  Give me your own credence, but the number is the least of it. What I want is the
  decomposition. Some terms you might consider, though you should restructure them
  if you think they carve the question wrongly: (i) the probability that commitment
  ability of this kind is actually available in realistic settings — that binding
  oneself is cheap to make and credible to the other side, rather than just talk;
  (ii) the probability that the first-mover advantage is real, that is, that committing
  early genuinely dominates under the conditions that hold, rather than being an illusion
  created by modeling both agents as simultaneously rational and simultaneously ignorant;
  (iii) the probability that mechanisms outside the model — iteration, reputation,
  third-party enforcement, or agents deliberately remaining ignorant of each other''s
  commitments — dissolve the race often enough that it stops being a structural threat;
  (iv) whatever residual term you think belongs, such as the probability that "independently
  rational" even picks out a coherent joint policy when agents model each other modeling
