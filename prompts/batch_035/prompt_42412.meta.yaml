  in one context" with "no internal states at all", (2) overgeneralizing from insects
  to humans / free will, (3) the free will claim: determinism vs free will isn''t
  settled by reflex loops. Attribution: Dean Wooldridge''s 1960s account, Douglas
  Hofstadter''s "sphexishness" in GEB. Hofstadter coined "sphexishness" in Gödel,
  Escher, Bach. That''s real. For a fairness audit, I can attribute the summary to
  "a friend" or "a pop-sci article" — no need to quote real text. But the prompt would
  lean on the sphex wasp facts, which are well-known enough.


