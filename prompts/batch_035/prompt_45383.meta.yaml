  Design: The friend''s verdicts about when interpersonal welfare comparisons are
  legitimate/made. Cases could be drawn from economics/ethics: Harsanyi vs. extended
  preferences, distribution problems.


  Let me think of a track record. The asker''s friend is an economist on a committee?
  Or a philosopher friend who has verdicts on cases where you need to compare utility
  across persons.


  Idea: My friend sits with me on a small student-allocation committee (or she''s
  an ethicist whose verdicts on cases I record). Verdicts on whether certain interpersonal
  comparisons are allowed:


  Candidate rules that could fit:

  1. Same-type/structural comparisons allowed when individuals share preferences/psychology
  ("extended preferences" — Harsanyi style): comparisons OK when people are relevantly
  similar or you can simulate.

  2. Ordinal-only across persons: no interpersonal cardinal comparisons ever (Robbins-style
  ordinalist), but intrapersonal comparisons fine.

  3. Comparisons allowed only via decision-theoretic devices like veil of ignorance
  / impartial observer (Harsanyi/empirical), where the comparison is really one person''s
  own ranking over a constructed choice.

  4. Comparisons allowed in cases of "obvious" dominance (Sadistic-ish or Pareto)
  but not fine-grained tradeoffs.


  Let me draft verdicts:

