  I am one of five trustees of a charitable trust founded in the 1890s by a local
  mill owner, whose will charges the trustees with applying its income for the relief
  of the poor of the parish, in perpetuity. The endowment stands at about £2.4 million,
  and after years of modest grants we are debating, for the first time in living memory,
  what our long-term policy should be.


  Three positions have emerged. One trustee argues for spending much more generously
  now: the poor of the parish today are real, named, badly off, and we know their
  needs; the beneficiaries of 2150 are a cloud of merely possible people about whose
  circumstances we can only guess. Our treasurer takes the opposite line: the hydrological
  assessments for our valley suggest serious and worsening flooding over the next
  century, so we should hold down current spending and build reserves for flood defence
  and adaptation work that will benefit parishioners not yet born; he insists that
  a cold pensioner in 2150 matters no less than a cold pensioner this winter. A third
  trustee, an accountant by training, agrees that the distant future counts, but applies
  a discount: he suggests treating any benefit arriving in a given future year as
  worth about 3 per cent less for each year we must wait, on the ground that resources
  are worth less when they arrive later and that we cannot be confident the trust,
  or the parish, will still exist to enjoy them.


