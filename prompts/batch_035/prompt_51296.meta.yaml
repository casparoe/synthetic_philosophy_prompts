  can of course be bad for the survivors, and Epicurus grants this. We should also
  distinguish the process of dying, which can involve pain, from the state of being
  dead, which is the proper target of the argument.


  The main objection is the deprivation account: death is bad for you not because
  it involves unpleasant experiences but because it deprives you of the goods you
  would have enjoyed had you lived longer. Nagel supports this with cases of unexperienced
  misfortune, like being betrayed by friends behind one''s back, which are bad for
  a person even though the person never feels them. Once we allow such unexperienced
  harms, the timing problem dissolves as well: there is no special puzzle about when
