  it has switched from the mechanism that handled in-distribution inputs to some different
  mechanism that happens to produce output — and that we could detect this by testing,
  on a fresh input, whether the model is still using the same mechanism it used in
  training. The whole agenda depends on making "same mechanism" precise, and when
  I try, I fail at both ends of a spectrum.


  If I individuate mechanisms extensionally — two contexts involve the same mechanism
  iff the same input-output mapping is being computed — the criterion is far too coarse.
  A giant lookup table and a compact algorithm compute the same function; on the extensional
  criterion they share a mechanism, which collapses precisely the distinction that
  anomaly detection needs: the claim "the model is doing something different on this
  input" is supposed to be non-trivial, and can''t be if the only sameness on offer
  is sameness of input-output behavior.


  If I individuate mechanisms token-physically — same mechanism iff the very same
  weights are read in the very same way, so that the intermediate activations are
  numerically identical — the criterion is far too fine. No two inputs share a mechanism
  on this reading, since activations differ numerically across even ordinary in-distribution
  examples; the notion would be useless for comparing any two distinct forward passes.


  So I''m drawn to an interventionist criterion in the middle: two contexts involve
  the same mechanism iff, in each, the output depends on the input through corresponding
  causal paths over corresponding intermediate variables, so that corresponding interventions
  — ablations, activation patches — produce corresponding changes in the output. But
  two problems stop me from just adopting it, and I''d like a careful explanation
  of what to do about them.


  First, the correspondence problem. The criterion presupposes that we can say which
  intermediate variable in context A corresponds to which in context B. But this doesn''t
  come for free. It''s familiar from interpretability that a feature can split into
  two, or two features merge into one, across changes of context or across training;
  and in the limiting case, the "corresponding variable" in B might be a pattern distributed
  over many units where in A it was localized in one. Unless there is an independent
  fact about which parts correspond, the interventionist criterion can''t even be
  applied — and I don''t know what would make it true that a scattered pattern in
  B corresponds to a localized feature in A, rather than there simply being no fact
