  Second, the granularity problem. Whether two contexts count as mechanistically the
  same seems to depend on how finely I choose to describe the mechanism — at a coarse
  grain, "compute the answer with a sum" may be shared; at a fine grain, nothing is.
  If "same mechanism" is thus partly a function of the describer''s chosen level of
