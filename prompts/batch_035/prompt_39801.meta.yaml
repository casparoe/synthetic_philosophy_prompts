  of functionalism and the standard objection to type-identity theory. But two pressure
  points have emerged. First, the causal worry: if a functional property is a second-order
  property — the property of having some first-order property that plays a certain
  causal role — then it looks as though the first-order realizer does all the causal
  work, and the functional property is causally idle; if so, functionalism may buy
  its famous generality at the price of explanatory relevance, and the identity theorist''s
  claim that the "real" causal story is at the realizing level starts to look attractive
  again. Second, the empirical worry: as neuroscience and AI practice mature, proposed
  cases of multiple realizability keep looking thinner — either the realizations share
  a deep structural commonality (so the identity theorist can identify the property
  with that common structure), or they are so different that one starts to doubt they
  realize the same function at all rather than merely simulating it. Consider the
