  my standing worry is that it slides between three claims without ever separating
  them: that such deals are possible in principle; that a rational agent is obligated
  to honor them once made; and that any two sufficiently similar agents are already
  trading, whether or not they know it. As far as I can tell, the proposal simply
  assumes the third, which is also the least defensible.


