reasoning_summary: 'The prompt should be formal/polished. Domain: heritability — what
  it does and does not mean. Type: turn a principle/theory into a procedure a practitioner
  can follow. That combo works well: a science journalist or policy analyst who must
  interpret heritability figures correctly — a checklist for when a heritability number
  can be applied to a claim.


  Role: a science desk editor at a newsroom, or a policy analyst briefing a legislature.
  Constraints: 15 minutes, no genetics training, deliverable is a reusable procedure.
  Must handle misapplications: within-group vs between-group, h² vs response to selection,
  shared environment, the "heritable means unchangeable/fixable" fallacy, heritability
  in one environment doesn''t transfer, PKU example, the equal-environment assumption,
  twin studies, h² vs r² of breeding value, the claim that heritability of IQ means
  education won''t help.


  Worked cases: (1) a claim that a trait''s heritability of 0.8 in a population means
  a policy intervention can''t work or that differences between groups are genetic;
  (2) a breeders'' equation misuse — "dairy cattle milk yield heritability 0.3 means
  you can''t improve via management"; (3) a claim that because height heritability
  is ~0.8 in rich countries, short populations elsewhere are genetically short — where
  the procedure says stop and where judgment is required (values vs facts not so much
  here, but points where the procedure can''t settle).


  Write formally. No web search needed — everything is standard knowledge, no quotes
  from real texts. Include the structure: role, frequency/stakes, constraints, deliverable
  spec, hard cases, worked examples, honesty about misfires, one case where the answer
  isn''t liked.


  Length: decent, maybe 300-400 words. Polished, formal.'
