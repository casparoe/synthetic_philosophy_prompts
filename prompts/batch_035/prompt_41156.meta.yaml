  The Presumption of Independence as an Argument from Bounded Detectability


  Suppose I ask whether the ten-trillionth digit of pi is 7. The digit is fixed; there
  is a fact of the matter; nothing random is involved. Yet the only sensible probability
  I can assign, before spending infeasible amounts of computation, is 1/10. The same
  pattern appears all over: we expect a cryptographic hash function''s outputs to
  be uniformly distributed without proving it; we expect a well-trained network''s
  behavior on a fresh input to be "typical" of its behavior on similar inputs without
  enumerating anything; physicists treat distant measurements as uncorrelated. Call
  the licensed move the presumption of independence: treat quantities whose dependence
  you cannot exhibit as though they were independent.


  The puzzle is what licenses it... not frequency (single case), not ignorance (we
  know the digit is determined). Common answer: it''s a heuristic argument — an estimate
  produced by reasoning that is much cheaper than the object it reasons about. I want
  to argue something stronger: that the presumption can be turned from a hope into
  a theorem by an appeal to bounded detectability. Roughly: it cannot matter, in expectation,
  that I treat two quantities as independent when no computationally bounded agent
  — including my future self, including any adversary I might face — could exhibit
  the dependence. A correlation that no one in my reference class can find is, for
  all decision-relevant purposes, not a correlation.


