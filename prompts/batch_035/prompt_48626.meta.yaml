reasoning_summary: 'Let me pick a domain and type. Domain: Heritability: what it does
  and does not mean. Type: Turn a principle into a procedure. That''s a great fit:
  a science journalist or a policy analyst or an editor who keeps seeing claims like
  "trait X is 50% genetic" and needs a decision procedure for evaluating whether a
  heritability claim is being used correctly.


  Actually, another strong fit: Buddhist no-self + personal identity with dialogue
  type. But procedure + heritability is very workable.


  Let me think about what the procedure would test: (1) is the claim about a measured
  heritability statistic (H² from twin studies, SNP-based h² from GWA) or a loose
  statement? (2) population-specific: heritability is population-relative; (3) h²
  doesn''t imply immutability nor between-group differences (the Lewontin gardens
  example — seedlings in varied vs uniform soil); (4) within-group heritability says
  nothing about between-group differences; (5) MZ twins reared apart caveats (shared
  prenatal environment, placement bias in adoption); (6) SNP heritability missing
  heritability; (7) gene-environment correlation and interaction; (8) for dichotomous
  traits, heritability on liability scale; (9) heritability varies with environment
  homogeneity (the uniform environment inflates h²).


  The asker''s role: an editor at a science/health publication, or a fact-checker
  at a policy magazine who reviews claims in op-eds about IQ, obesity, mental illness,
  education. Procedure must be quick — ten minutes. It must end in verdicts: "claim
  as stated is fine," "claim needs revision," "cannot be settled from the number alone."
  And must mark judgment points.


  I need to write 1-3 paragraphs, formal/polished, with specific cases to run the
  procedure on: e.g., an op-ed saying "obesity is 70% genetic, so public-health interventions
  on food environments are futile"; a claim that "reading ability is substantially
  heritable, so differences in school outcomes between socioeconomic groups reflect
  ability not teaching"; a claim about "height is 80% genetic, so nutrition programs
  in developing countries won''t work" (historical: Dutch height increase). Also mention
  I''d like confidence levels and the point of least confidence.


  I should inject some novelty: e.g., my publication has a rulebook, "we''re a small
  magazine covering behavioral genetics for a lay audience", specific invented cases.
  Avoid needing real citations. Don''t quote anything verbatim from real texts. I
