  "I''m a PhD student in comparative politics, second year, trying to figure out my
  dissertation. I keep running into ''performance legitimacy'' — the idea, usually
  applied to China and Singapore, that authoritarian regimes can be stable because
  they deliver growth, order, and improving material conditions rather than because
  citizens endorse the regime''s values or its right to rule. I want to figure out
  which open questions in this debate are actually worth spending three years on.
  You''re a political theorist who works on legitimacy and comparative politics —
  think carefully before answering, maybe brainstorm the open questions first, then
  give me a prioritized list with the reasoning.


  Here are the candidate questions I''ve gathered so far, though add others if you
  think I''m missing something:


  1. The measurement circularity problem: if the same regime that claims performance
  legitimacy also controls the statistics that measure performance (GDP figures, protest
  reporting), is the claim even testable? Do we in practice have any independent handle
  on what citizens actually believe in these places, given preference falsification
  — people telling survey researchers what''s safe to say?


  2. Delivering what, exactly? Is it raw growth that generates deference, or predictability
  and the sense that things are getting better for *you*? If it''s the second, then
  a slowdown that''s managed — a regime that successfully lowers expectations — might
  preserve the same deference that growth once bought. That would suggest what matters
  is expectation management, not performance, which would basically dissolve the concept.


  3. Whether performance legitimacy is doing any work that a simpler story about coercion
  and a freeriding problem wouldn''t do. Maybe citizens are just indifferent because
  the costs of dissent are high and the personal stakes of politics are low. If apathy
  + repression predicts stability just as well, maybe the whole concept is redundant.


  4. Singapore vs. China as a natural experiment: Singapore is (mostly) a rule-of-law
  state where performance is delivered through institutions that constrain the rulers
  themselves; China delivers performance through interventions the rulers can revoke
  at will. Does the legitimation mechanism differ in kind or only in degree, and does
  that tell us anything about durability in a crisis?


  5. Whether performance legitimacy has a self-undermining property: growth produces
  a middle class, urbanization, education — things that (per modernization theory)
  should eventually create demands for participation. So is performance legitimacy
  a loan that comes due, or does no such effect show up in the data?


