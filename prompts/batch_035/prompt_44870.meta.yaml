  players rewrite the scoring, the turn order, even the amendment procedure itself,
  and whatever gets passed under the current rules is binding, full stop.


  My question: what conception of rule-authority does this practice presuppose? It
  looks like pure proceduralism — a rule is in force because it was passed correctly,
  and that''s it, no substantive constraint on content. But that makes me uneasy.
  Everyone at the table agreed to the initial ruleset before the first amendment,
  and the game''s authority seems to rest entirely on that agreement; yet no one thinks
  the game could pass a rule binding you to keep playing after you want to quit. So
  either the binding force of every passed rule secretly rests on the initial consent
  (which can be withdrawn), or it rests on nothing but having been passed — in which
  case the chain has to ground itself, and I can''t see how a bootstrap like that
  doesn''t just spin in the air. Which is it? And how does what Nomic presupposes
  compare to what actual legal systems presuppose — do real systems have the same
  problem at their root, or do they have something Nomic lacks?"


