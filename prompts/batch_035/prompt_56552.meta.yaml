  is unavailable because the chain''s members conflict with the agent''s other beliefs.
  Then walk through: foundationalist options (dogmatism, externalism, denying justification),
  coherentist response, infinitist verdict; identify which feature does the work;
  how a foundationalist would attack the case (e.g., saying the chain only needs to
  be potentially infinite, or that "available reasons" vs "possessed reasons" distinction
  does the work); whether removing the feature collapses it.


  Constraints: realistic setting (auditing a supply chain? debugging code?), no demons,
