  Prompt draft:


  ---


  I am grading a take-home midterm for an intermediate game theory course and would
  like a second grader''s assessment of one answer. The course allows mixed strategies
  throughout, and the students have seen the definitions of rationalizability and
  Nash equilibrium. Below is the question, worth 25 points, followed by the student''s
  verbatim answer.


  Question 4 (25 points). In finite normal-form games a pure strategy can be dominated
  not only by another pure strategy but by a mixed strategy over the player''s other
  pure strategies. (a) Define strict dominance by a possibly mixed strategy, and explain
  why admitting mixed dominators makes iterated elimination more powerful. (b) Does
  the order in which dominated strategies are eliminated affect the set that survives?
  Treat iterated elimination of strictly dominated strategies and of weakly dominated
  strategies separately. (c) What must the players know about one another for the
  iterated elimination of strictly dominated strategies to be justified as ruling
  out strategies that will not be played? Be precise about how much knowledge each
  round of elimination requires. (d) State as precisely as you can the logical relationships
  among the strategies that survive iterated elimination of strictly dominated strategies,
  the rationalizable strategies, and the strategies played with positive probability
  in some Nash equilibrium.


  Student''s answer. (a) A pure strategy is strictly dominated when some other strategy,
  pure or mixed over the player''s remaining pure strategies, yields a strictly higher
  payoff against every combination of the opponents'' strategies. Mixed dominators
  make the procedure more powerful because a strategy can lose to no single alternative
  and still lose to a randomization: if two strategies pay 2 and 0 against the opponents''
  first profile and 0 and 2 against the second, neither dominates a third strategy
  paying 1 and 1... wait: mixture pays 1 and 1 — not strictly greater. Need third
  strategy paying less, e.g., paying 0.5 and 0.5? then mixture (1,1) strictly dominates
  (0.5, 0.5), while neither pure does (2 > 0.5 but 0 < 0.5). Good: third strategy
  pays (0.5, 0.5).


  ...neither pure strategy dominates it (each is worse somewhere), yet the fifty-fifty
  mixture over them pays 1 against both profiles and strictly dominates it.


  (b) The surviving set is independent of the order of elimination. For strict dominance
  the reason is that the payoff inequalities hold strictly against every combination
  of the opponents'' strategies, so they continue to hold, and to hold strictly, after
  any of the opponents'' strategies are deleted; a strictly dominated strategy stays
  dominated as the game shrinks, so every deletion order removes exactly the same
  strategies in the end. The same reasoning carries over to weak dominance: weak dominance,
  like strict dominance, is preserved under deletion of opponents'' strategies, so
  whether we eliminate weakly dominated strategies one way or another, the procedure
  converges on the same surviving set. One does have to be careful with weak dominance
  for a different reason: eliminating a weakly dominated strategy can delete Nash
  equilibria, so it is safest to restrict attention to strict dominance.


  (c) The procedure requires that the players are rational, in the sense of never
  playing a strictly dominated strategy, and that each player knows the game and knows
  that the other players are rational. This is enough for any number of rounds. Since
  every player knows that the others never play dominated strategies, each can delete
  their opponents'' dominated strategies from the game; and since everyone knows that
  everyone can do this, each can also delete what becomes dominated in the reduced
  game, and so on down. One level of knowing that the others are rational supports
  the whole iteration.


  (d) The strategies that survive iterated elimination of strictly dominated strategies
  are exactly the rationalizable strategies: in any game, common knowledge of rationality
  pins down precisely the strategies the procedure leaves in place. As for Nash equilibrium,
  no strategy played with positive probability in a Nash equilibrium is strictly dominated,
  so the equilibrium strategies survive elimination; and conversely, since the procedure
  only removes strategies that cannot be played in equilibrium, the surviving set
  is exactly the union of the supports of the Nash equilibria. So for dominance-solvable
  games the survivor is the unique equilibrium, and in general the three sets — survivors,
  rationalizable strategies, equilibrium supports — coincide.


