  and the sculptor says the statue is gone but the clay persists; the statue''s arm
  is replaced bit by bit and we ask at what point, if any, the thing in the gallery
  stopped being that statue; a bronze statue and its constituting piece of bronze
  seem to have different persistence conditions (the bronze survives melting down,
  the statue does not); and a case where two candidate sortals compete for one hunk
  of matter (e.g., a thing that is simultaneously a statue and a doorstop, or the
  clay that is both a pet and a piece). Feel free to invent analogous cases where
