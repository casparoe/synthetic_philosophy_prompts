  adviser liked to put it, the same outcomes would have arrived anyway. My economist
  colleague presses on me a threefold distinction: dependence on the path that is
  efficient anyway; dependence that is inefficient but was unremediable given what
  anyone could have known at the time; and dependence that is inefficient, remediable,
  and persists nonetheless. I find the distinction useful but not sufficient for what
  I care about, which is less efficiency than modal structure: which counterfactual
  histories are live, and whether the path selects among fixed alternatives or reshapes
  the space of alternatives itself.


  Here are my verdicts on cases:


  1. QWERTY. Genuinely locked in. If Dvorak is better, that has mattered not at all
  for a century and a half; nothing about the layout''s original rationale (mechanical
  jam avoidance, I''m told) survives.

  2. Railway gauge (4 ft 8.5 in, inherited allegedly from wagon ruts). Locked in,
  but I feel differently about it than about QWERTY: some standard gauge or other
  was inevitable; the path picked the token, not the type.

  3. AC over DC for long-distance transmission. Barely path dependence at all, in
  my view: the physics of transmission losses meant the same outcome would have arrived,
  give or take a decade.

  4. English as global lingua franca. Here I want to say the opposite of what I said
  about gauge: token-contingent, sure, but genuinely, interestingly path-dependent
  — the world would be importantly different with French or Spanish in that role,
  not just differently labeled.

  5. Packet switching over circuit switching in the Internet''s design. Looks contingent
  in the historical sequence, but I think it would have won anyway on the merits;
  the apparent path dependence is an illusion of narrative.

  6. Left-hand versus right-hand driving. Pure token contingency, but so trivial that
  I''m not sure it deserves the name "path dependence" at all — it''s just a convention
  that, once set, isn''t worth changing.

  7. Internal combustion over electric propulsion circa 1900. My most unstable verdict.
  On the one hand, lock-in of the textbook kind: network effects, fueling infrastructure,
  sunk R&D. On the other, the re-switching now underway suggests the "lock" was only
  ever a long detour, and a sufficiently patient observer would say the same outcome
  has arrived anyway, just slowly. But by that standard QWERTY''s lock could also
  be described as a very long detour — mobile and swipe input are wearing at it —
  and I don''t want to say that.


  So: is there a single principle — presumably one that separates the modal structure
  of the cases (which alternatives were live, whether the path selected among them
  or constituted them, whether the selected state is stable under perturbation, whether
  it feeds back into the very standards by which alternatives are judged) — that captures
  all seven verdicts? Or must some go? I would particularly like the principle to
  adjudicate the tension I feel between 2 and 4 (gauge: token-contingent, type-inevitable,
  and I call it weak path dependence; English: token-contingent, type-inevitable,
  and I call it strong path dependence) and between 1 and 7.


