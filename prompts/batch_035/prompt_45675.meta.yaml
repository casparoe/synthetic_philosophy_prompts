  Thesis idea: "The Ferguson–Tharoor debate is structurally broken because both sides
  agree the balance sheet is additive: they only disagree about the sign of the entries.
  My view: the ledger metaphor smuggles in commensurability — a railway network and
  a famine can''t be netted against each other — so the debate should be recast as
  one about distribution (who within India bore the costs and who captured the gains)
  and about counterfactuals (what counts as an ''entry'' at all depends on which counterfactual
