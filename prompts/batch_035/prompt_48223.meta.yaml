  ---


  I run a small podcast about decision theory and AI risk, and next week I''m interviewing
  a decision theorist (call him Dr. K) who''s spent the last few years arguing that
  "commitment races" are one of the most underrated catastrophic risks from advanced
  AI. Quick background in case it helps: a commitment race is a situation where agents
  each benefit from being the first to irrevocably bind themselves to some bargaining
  position — e.g., committing to walk away from a deal unless they get at least 60%
  of the surplus — because once the commitment is credible, the other side does best
  by conceding. If both sides race to commit, or commit to incompatible positions,
  everyone can end up much worse off than if they''d never had the ability to bind
  themselves at all.


  Dr. K is sharp but has a stock deflection: whenever pressed he says commitment problems
  are "an engineering detail" compared to getting alignment right, then pivots back
  to values. I want questions that make that harder to use.


  Draft ten-ish questions for me. Constraints: (1) at least one question about whether
  updatelessness already dissolves the problem — his likely reply is that updateless
  agents still need to choose policies under uncertainty about which other agents
  exist, so the race just moves up a level, and I want a follow-up to that reply;
  (2) one on the credibility condition — a commitment made in a race is only useful
  if the other side can verify it before racing themselves, but verification takes
  time and the whole problem is that time pressure destroys the common knowledge needed,
  and I want him to say whether he thinks any race can actually be "lost cleanly";
  (3) one pressing the obvious free-rider worry, that if commitment ability is dangerous,
  the agents who simply don''t bind themselves can exploit everyone who did; (4) at
  least one on his pet idea which he calls "commitment liquidity" — he thinks future
  agents will be able to trade and unwind each other''s commitments through side-contracts,
  and I confess I don''t see how that avoids just re-creating the original bargaining
  problem one level up.


  For each question give the follow-up you''d expect to need given his most likely
  answer. Don''t ask him generic stuff like how he got into the field — we only have
  40 minutes.


