  Write prompt:


  ---


  I''m on my university''s Committee on Naming and Memorialization (we''re the ones
  who got dragged into existence after the whole mess about the Culver statue, long
  story). We have a live case: Whitlock Hall, our second-oldest building, named for
  Asa P. Whitlock, a founding trustee whose money basically built the campus in the
  1890s. A grad student in history recently documented that Whitlock''s fortune came
  substantially from a company that, among other things, ran vaccine trials on children
  placed in the state orphanage he also sat on the board of. The student paper ran
  it as a front-pager, there''s a petition with 3,000 signatures, and the Whitlock
  family (still donors, there''s a scholarship) has sent a letter through their lawyer
  saying that removing the name would "erase history."


  Our actual options as laid out in our charge: (1) retain the name with a permanent
  interpretive exhibit in the lobby, (2) remove the name, send the archival material
  to the library''s special collections, and rename after an open nomination process,
  or (3) a "transition" option where the name comes off in five years regardless of
  the rename debate. I have to circulate a written opinion before Thursday''s meeting
  recommending one of these with reasons, and I want it to actually move people, not
  just do the standard "we honor complexity" thing that sounds like a press release.


  Here''s my angle, and tell me if you think it''s a good one or if I''m overcomplicating:
  I took a course a while back on Nietzsche''s Untimely Meditations, and the second
  one — on the uses and disadvantages of history for life — has been rattling around
  in my head the whole time I''ve been on this committee. As I remember it he splits
  our relation to the past into monumental, antiquarian, and critical history: monumental
  pulls heroes out of the past as fuel for action, antiquarian preserves and reveres,
  critical drags the past before a tribunal and destroys what we can''t live with.
  Each option on our list seems to map onto one of the modes (the exhibit is arguably
  antiquarian dressed as critical, the removal is critical, the transition option
  is... some muddle), and Nietzsche has a warning about each: monumental history can
  falsify by making things grander than they were, antiquarian reverence can harden
  into blindness to anything new, and critical history wounds — he says you need real
  strength to bear having destroyed part of your own past without the wound festering.
  And hanging over all of it his basic demand, that history is only justified by serving
  life going forward, not knowledge for its own sake.


  So: draft the memo. It should recommend one option concretely (with maybe a time
  frame and who does what), and use the three-modes framework for real — not as decoration
  — including taking seriously whichever mode ends up on the losing side, and being
  honest about whether the family''s "erasing history" worry, which sounds like an
  antiquarian reflex, deserves more than the usual dismissal. But also don''t let
  it become a philosophy seminar paper: my colleagues are smart but only one of them
  will have read any Nietzsche, and a memo that opens with German terminology is dead
  on arrival. Maybe a page and a half.


