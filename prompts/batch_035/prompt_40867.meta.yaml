  Longtime lurker around the Sequences-era personal identity threads here. I''ve noticed
  a recurring gap in how those discussions handle a question, and I want to know whether
  the academic literature has a name for it.


  Everyone in rationalist circles is comfortable with the patternist line — you are
  the pattern, so a faithful upload is you — and with Parfit-flavored moves about
  psychological continuity being what matters rather than identity itself. But when
  the question is phrased as "could you have been conceived from a different sperm
  cell," people give a flat, confident no: not "someone very like you would exist,"
  but "someone else would exist, full stop," even though the resulting child would
  match you more closely than any upload ever could. The two toolkits — pattern, psychological
  continuity — predict nothing like this; identity seems to be hanging on the particular
  material origin rather than on anything downstream of it.


  And when I probe the reflex with a ladder of cases, it gets stranger. Same egg and
  sperm, but joined in a lab a week later: people mostly say that''s still me. A later
  sibling with my exact genome, built from scratch and causally disconnected from
  my conception: almost nobody says that''s me, not even the patternists, and I can''t
  reconstruct their reason. And the case that breaks everything: the zygote that became
  me splits, one twin is implanted now, the other stays frozen for a decade. Both
  have exactly the same origin, so either origin doesn''t settle identity after all,
  or one twin is the other.


