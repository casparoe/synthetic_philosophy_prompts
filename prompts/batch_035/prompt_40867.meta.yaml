  or the actual zygote — is non-negotiable for your identity have an established name,
  and who draws its boundaries? Specifically, does anything in that literature handle
  the shared-origin twin case? And if the boundary question (origin as the specific
  cells, vs. origin as the information, vs. "enough of the original matter") has no
  settled treatment, I''d settle for a well-drawn distinction: a definition that says
  what this view is committed to, and where it comes apart from patternism and from
  psychological-continuity views.


