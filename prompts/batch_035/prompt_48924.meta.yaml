  Is there a name for this thing, or do I need to invent one?


  I''ve noticed a pattern whenever I try to write down, for someone else (or for my
  future self), instructions about what to ignore. Last month we went away for a week
  and I wrote instructions for the friend who was checking in on the cat. Somewhere
  around rule 14 ("if the smoke detector in the hall blinks, it does that sometimes,
  ignore it") I realised the list couldn''t work in principle. It''s not that it was
  incomplete — it''s that a complete list is impossible. Every "ignore X" only works
  if you already know X is harmless in this instance, and knowing that is exactly
  the thing the list was supposed to do for you. I can write "ignore the blinking
  detector" because I already know the battery is old and it''s done it for years.
  She can''t, unless I also write when to not ignore it, and when to not ignore the
  not-ignoring, and off it goes.


  Same thing happened when I tried to automate stuff with smart plugs. Every rule
  needed an exception, every exception seemed reasonable on its own, and after a month
  the system was 40 rules deep and still wrong. And the embarassing part: I just...
  walk out the door every morning without checking anything. Something in me is doing
  all this ignoring invisibly, and it''s the thing I can''t write down.


