  count of victims, and a world of ten billion people at any given per-capita rate
  contains more victims than a world of eight billion at the same rate. The other
  faction counters that absolute counts make our program hostage to demography: with
  population growth of a percent a year, violent deaths can rise in absolute terms
  even while every individual''s risk of violence falls, and it seems perverse to
  declare failure in a world where everyone is safer. A third worry, raised by our
  grants team, cuts across both: our grantees work not only on lethal violence but
  on torture, domestic abuse, conflict displacement, and violence against animals,
