  incorrect uses.

  (2) Any such fact must be checkable, otherwise the distinction between correct and
  incorrect is idle.

  (3) In the private diary case, the diarist''s judgment that today''s sensation matches
  yesterday''s "S" is the only check, so it can''t be wrong.

  (4) So private words for sensations are impossible. Fine — that''s Wittgenstein.

  But then: (5) The same holds for memory of any word, e.g., "red": my only check
  that I''m using "red" today as I did before is my memory/feeling of confidence.
  (6) So by parallel reasoning no word''s meaning survives from one day to the next.
  (7) That proves too much.


