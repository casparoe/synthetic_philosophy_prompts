  Let me construct: friend''s argument:


  (1) Something can be bad for you only at a time when it''s happening to you (you
  can''t be harmed when you don''t exist).

  (2) When you''re dead, you don''t exist, so nothing is happening to you.

  (3) So death is never bad for the person who dies.

  (4) Same for any period of nonexistence — so being in a coma for 50 years then waking
  isn''t bad for you either.

  (5) And the time before you were born was just like that, so nobody was harmed by
  not being born earlier, and by symmetry...


  Prove-too-much angle: extend to "a genius who could have been born in 1800 wasn''t
  harmed by never existing" — that''s Lucretius symmetry. Or make the argument conclude
  that no one is harmed by never being born, or that a person cryogenically frozen...
  Hmm.


  Another "proves too much" structure: argument that death isn''t bad, extended to
