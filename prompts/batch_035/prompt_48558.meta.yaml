  Let me do Benatar''s asymmetry with the fair-summary type. Construct a summary with
  subtle misrepresentations:


  Real Benatar asymmetry: (1) presence of pain is bad; (2) presence of pleasure is
  good; (3) absence of pain is good even if no one enjoys that good; (4) absence of
  pleasure is not bad unless there is someone deprived. Conclusion: coming into existence
  is always a harm.


  Common subtle errors to embed:

  - Saying Benatar claims "life contains more bad than good" (the "misquality" claim)
  — actually the asymmetry argument doesn''t depend on that; it works even if pleasures
  outnumber pains. Conflating the asymmetry argument with the "quality of life is
  worse than we think" argument.

  - Stating premise 4 as "the absence of pleasure is bad" full stop — Benatar says
  it''s not bad *when there''s no one* for whom it''s bad; the summary might present
  it as bad in the comparative case (someone exists vs. doesn''t) — actually the standard
  objection is about (3)/(4) asymmetry: comparing absence of pain (good) vs absence
  of pleasure (merely not bad). The popularizer could misstate premise 3 as "absence
  of pain is good" without the crucial "even though nobody enjoys it" clause, or present
  the asymmetry as just empirical claim that pains outweigh pleasures.

  - Overstatement: "Benatar thinks we should make humanity extinct as soon as possible"
  vs his pro-mortalism distinction — actually Benatar distinguishes antinatalism from
  promortalism; coming into existence is a harm but that doesn''t entail killing is
  permissible (death is also a harm). A popularizer might say "so he must think we
  should all kill ourselves."

  - Also misattributing: "since nobody would be harmed by not existing, having children
  is wrong" — the asymmetry is about benefit/harm to the person created, not about
  the parents or the world''s value.

  - The "non-identity problem" conflation possible.


  Also the summary could say the argument relies on the claim that pleasure''s absence
  is bad "for the counterfactual person" — mixing.


