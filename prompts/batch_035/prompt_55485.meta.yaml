  Last night a friend and I argued until 2 a.m. about the Buddhist doctrine of no-self,
  and the whole argument turned on one analogy that I now can''t stop chewing on,
  so I want a careful audit of it.


  Background of the argument. I''d claimed that the Buddhist anatta doctrine — the
  claim that there is no persistent self, only a stream of psycho-physical events
  — is really just what a Western reductionist about persons says, once you strip
  the monastic packaging. My friend disagreed for a reason I hadn''t encountered before:
  he said the standard Buddhist argument isn''t a reductionist argument at all but
  an analogy, and analogies aren''t arguments. His case: in the Questions of King
  Milinda, when the king presses the monk Nagasena on who, exactly, he is if no self
  can be found among his parts, Nagasena responds with a chariot. The king''s chariot
  is analyzed — axle, wheels, body, yoke — and no chariot is found among the parts,
  or apart from the parts, or as the sum of parts scattered on the ground; "chariot"
  is just a convenient designation for the parts arranged and functioning a certain
  way. And so, says the monk, is "Nagasena." My friend''s point was that this is the
  move people actually use: not an argument from premises to conclusion, but a single
  comparison carrying the whole doctrine. If you accept the chariot, you''re supposed
  to accept the no-self conclusion about yourself, and the analogy does the work.


  But then things got interesting, because we found we disagreed about what work it
  does. My own view going in was that the analogy is actually doing the wrong work
  — that it licenses more than the doctrine can support. Everything the chariot shows
  is that a composite object is not a further thing over and above its parts arranged
  a certain way. But I''d have thought a fairly conservative metaphysician of persons
  could accept exactly that about the body, the brain, even the whole aggregate bundle,
  and still insist that "no self" means something stronger: that the stream of experiences
  is not even conventionally unified, that the felt unity of a point of view is an
  illusion rather than a real (if derived) feature. The chariot is merely not further;
  the Buddhist self is supposed to be not even that. Meanwhile my friend thought the
  analogy is even weaker than I did, but in the other direction: a chariot is a designed
  artifact, built for a purpose from without, whose identity conditions come from
  the maker''s intent; a person''s unity, such as it is, is generated from within,
  by memory, intention, and causal continuity of experience — exactly the machinery
  the chariot lacks. On his view, every disanalogy between chariots and persons cuts
  against the conclusion the analogy was recruited to support. And he had a third
  move I also want evaluated: he said the analogy is probably not intended as an argument
  at all but as a teaching device — pitched at a king, to shift attention from "who
  is the sufferer?" to "what is going on in there?" — and that auditing it as a proof
  is a category error, though he couldn''t say whether this rescues the doctrine or
  just concedes that it has no argument.


  So, acting as a professional philosopher with expertise in both personal identity
