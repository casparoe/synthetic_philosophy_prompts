  ---


  I write novels, and I have opinions about translations of my own work, which is
  how I discovered I have opinions about what understanding is. Lately I''ve been
  trying to discipline these opinions into something like a theory, prompted by the
  arrival of statistical machine translation that is, most days, good enough to unsettle
  me. My method is crude: I collect cases where I have a firm gut verdict about whether
  the translator — human or machine — understood the text, and I try to find the principle
  underneath. I''d like you to do this with me, and I want a committed answer, not
  a menu.


  Here are my verdicts. [...]


  Cases:


  1. The system translates "the die is cast" appearing in a card-game scene literally
  — dice appearing in the translation. Verdict: no understanding, obviously.

  2. The same system renders an obscure regional idiom of my hero''s grandmother perfectly
  — because somewhere in its training data that idiom sits aligned with a fluent English
  equivalent. I still say: no understanding. It didn''t know the grandmother was being
  remembered fondly; it matched a string.

  3. A human translator whose prose I find clunky catches that a flat description
  of weather in chapter nine repeats, word for word, a phrase the narrator''s dead
  wife used in chapter two, and so renders it with a faint echo. Understanding, I
  say, despite a mediocre product.

  4. A devoted fan produces a fluent translation of my latest chapter by machine and
  then fixes only the names and the worst slips. Reads well. My verdict: no understanding
  in the pipeline, and I''d almost rather have the clunky translator from (3).

  5. Round-trip: I put a paragraph through the machine from English to Finnish and
  back, and it comes back nearly unchanged, jokes intact. Some say the round trip
  proves comprehension — that noise would have crept in otherwise. I say it proves
  the mapping is smooth along the well-traveled routes, nothing more.

  6. The hard one. The machine, by pure luck of an ambiguity in the target language,
  produces a pun in a sentence that had no pun, and the pun happens to rhyme with
  the theme of the chapter. My editor says it''s the best sentence in the translation.
  I want to say the machine understood nothing. But then I remember a human translator
  I once had who reached her best rendering — which preserved my pun exactly — because
  she had misremembered the meaning of one of my words in a way that happened to land.
  Same accident, same product, and I want to credit her with understanding and deny
  it to the machine. I go back and forth on whether that is hypocrisy or a clue.


  So: is there one principle that delivers all six verdicts? The candidate I keep
  circling is something like: understanding is not in the output but in the route
  — understanding is passing through the point of the sentence, knowing why it is
  that sentence rather than another. But that threatens to convict my accident-prone
  human translator and acquit no one I want acquitted... Actually maybe phrase: "that
  principle acquits (3) and convicts (2), but I can''t get it to leave (6) alone without
  adding epicycles about what the translator could have done, in nearby cases, had
  the sentence been different."


