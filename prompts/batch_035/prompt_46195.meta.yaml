  Here is the set. (1) Every historical narrative is written from somewhere: there
  is no standpoint-free history, and accounts that claim neutrality tend to launder
  the perspective of whoever was powerful when the discipline''s conventions were
  set. (2) The maxim that history is written by the victors is, taken literally as
  a claim about authorship, mostly false: the defeated write history constantly —
  Lost Cause memoirists, colonized intellectuals writing against empire, dissident
  memoirs under authoritarian rule — and several of the victors'' own national historiographies
  are savagely self-critical. (3) Even so, power structures what can be known: what
  was recorded, which archives survived, whose acts left a trace, which episodes got
  a name and a date — that distribution tracks power, so the victors shape history
