  I''ve been following the Sleeping Beauty debate for over a decade — from the rec.puzzles
  threads that gave it its name, through Elga''s 2000 paper and Lewis''s halfer reply,
  to the endless anthropics threads where it gets re-fought as SSA versus SIA. I know
