  reply, the Dutch book challenges to the halfer, the variant where Beauty is woken
  a million times under tails and intuition screams that heads is nearly impossible,
  Bostrom''s Presumptuous Philosopher showing that each answer, scaled up, commits
  you to something outrageous elsewhere.


  And I''ve concluded the debate has stalled. Every argument is at least twenty years
  old; both camps can state the other''s case better than the other can; nobody converts.


  My working hypothesis: the disagreement isn''t about probability at all but about
  what the number is a probability of. Thirders, I suspect, are answering a question
  about this awakening — what fraction of awakening-moments like this one are heads-awakenings
  — while halfers are answering a question about this run of the experiment, on which
  the awakening is merely an occasion to think about it. Same words, different referent,
  so the fact that both sides produce a number between 0 and 1 and call it "credence
  that the coin landed heads" makes it look like a contradiction when it''s a equivocation.


  But I can hear the objection: plenty of cases where the two readings come apart
  decision-theoretically — bets settled per-awakening versus per-experiment — and
  halfers and thirders don''t just differ in bookkeeping there, they accept different
  bets. That makes me doubt my own diagnosis. It could instead be substantive: a disagreement
  about whether being awake at all is admissible evidence, i.e., about whether self-locating
  information ("this is an awakening") can confirm or disconfirm a non-centered proposition
  ("the coin landed heads") when the agent knew in advance she''d be in a state that
  makes it true. That question, in turn, may trace to bedrock intuitions about whether
  an experience you knew you would have can be evidence.


  So: diagnose this for me. Is it verbal, substantive, or two questions under one
  heading? If verbal, explain why the per-awakening bets split the camps — does that
  force a thirder reading, or does the halfer have principled grounds for refusing
