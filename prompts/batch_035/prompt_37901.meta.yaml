  summary with one or two subtle errors:


  Summary from a friend/pop article: "Expressivism says moral sentences don''t state
  facts but express attitudes — like booing. The Frege-Geach problem is that this
  can''t explain moral disagreement: if ''murder is wrong'' just expresses disapproval,
  two people who express different attitudes aren''t really disagreeing about anything,
  they''re just like people who cheer for different teams. Peter Geach showed this
  in the 1960s, building on Frege''s point that a thought''s truth value stays the
  same in all contexts, so expressivism is generally considered refuted."


  Subtle errors to embed:

  1. Conflation: the actual Frege-Geach problem is about embedding in conditionals
  and negation (validity of modus ponens with mixed contexts), not primarily about
  disagreement. The disagreement problem is a separate (and older) objection that
  expressivists have answers to.

  2. "Geach in the 1960s building on Frege" — Geach''s paper "Ascriptivism" was 1960,
  and he attributed the point to Frege; but "expressivism is generally considered
  refuted" — overstatement; contemporary expressivists (Blackburn''s quasi-realism,
  Gibbard''s norm-expressivism) treat Frege-Geach as the central problem to solve,
  not a refutation.

  3. "just like people who cheer for different teams" — actually expressivists would
  say boo/hooray is still genuine disagreement; the analogy trivializes.

  4. "truth value stays the same in all contexts" — garbled version of Frege''s compositionality
  point / the point about meaning contributing the same in assertoric and unasserted
  contexts.


