  Actually, the domain is "Good''s theorem on the value of information." Good''s theorem:
  in Bayesian decision theory, the expected value of the information from an experiment
  is always nonnegative (and positive unless the decision is unchanged regardless)
  — given the agent is an expected utility maximizer who uses Bayes. Standard caveats:
  cost of information, information gathering changing the world or revealing to others,
  non-Bayesian updating.


