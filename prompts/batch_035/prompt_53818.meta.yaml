  and the practical test — the demon in The Gay Science who offers you your same life
  again, every pain and joy, innumerable times, unchanged, and your answer is supposed
  to reveal something about how you''ve lived. In the film, learning the heptapod
  language rewires how Louise experiences time — she effectively remembers the future,
  including her daughter''s whole life and her early death, and she says yes to it
  anyway, marries Ian, has Hannah, even knowing how it ends.


  So: what''s the mapping? Is heptapod time (the circular logograms, the "nonlinear"
  writing) supposed to be the cosmological recurrence, or something more like the
  block universe — and does Nietzsche''s circle actually need the block universe or
  does the film quietly swap in a different metaphysics? Is Louise''s foreknowledge
  the demon''s offer? It seems like the crucial disanalogy is that the test in Nietzsche
  gives you no new information, it just changes your relation to what you already
  have, whereas the heptapods hand Louise actual knowledge — her yes is informed in
  a way the demon''s victim''s yes isn''t. Does that make her affirmation stronger
