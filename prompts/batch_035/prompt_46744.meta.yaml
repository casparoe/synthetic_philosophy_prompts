  representation that was already there in the weights, not just fitting a story to
  the behavior. On this view, networks genuinely represent: the intermediate activations
  form concepts much like the ones we use in everyday language, which is why features
  found in one model keep reappearing in others trained on similar data. The instrumentalists
  reply that these are just useful descriptions of input-output behavior, and the
  recent work on interpretability illusions confirms this: researchers showed that
  the same method that finds a face detector in one layer can find an equally convincing
  detector in a random projection of the activations, so the features we ''find''
  are artifacts of the method. And the superposition results are the final nail: models
  turn out to store more features than they have neurons, so the tidy one-feature-one-direction
