  coercion (context)? Distinction: capacity vs. information vs. voluntariness. Also
  the "voluntary assumption of risk" idea. The asker is a high school senior who did
  a health class unit on consent and noticed the tension.


  Include epistemic request: ask the responder to say what would change their verdict
  / where reasoning is most likely to go wrong.


  Write 2-3 paragraphs, casual, one or two typos (e.g., "seperate", "alot", missing
  apostrophe).


