  My reading group has been working through the popular psychology book that introduced
  moral foundations theory, and it has sparked an argument that goes beyond the theory
  itself. The theory is explicitly built on an analogy: the moral mind is compared
  to the tongue, which has a small number of innate taste receptors for basic flavors,
  with culture supplying the cuisine. On the moral side, we are said to come equipped
  with a handful of innate receptors for moral flavors — roughly care, fairness, loyalty,
  authority, and sanctity, with a later-added liberty foundation — and each culture
  develops the subset its environment rewards. The book''s survey data are then read
  as showing that political liberals lean heavily on the harm and fairness receptors
  while responding weakly to the rest, whereas conservatives draw on nearly the whole
  palette, and at one point the left''s insensitivity to sanctity is characterized
  in terms reminiscent of a kind of smell-blindness. One member of the group has run
  with this: moral disagreement between left and right, she says, is a difference
  in receptivity rather than a difference in correctness — like one person tasting
  cilantro as soapy and another tasting it as fresh — so the psychology of left and
  right can never tell us who is right, because nobody is wrong; the disagreement
  lies in the palate, not in the world.


  Audit the analogy for me. Start with the correspondence table: what plays the role
  of the tongue, the receptor, the flavor, the cuisine, the acquired taste, the supertaster,
  and the taste-blindness. Then set out the disanalogies, sorted into those that matter
  for the use she is making of the analogy and those that do not. I want particular
  attention to what the analogy quietly imports: taste is idiosyncratic and phenomenal,
  and as far as anyone believes there is no fact of the matter about whether cilantro
  is really good; yet the tongue''s receptors also had an evolutionary job — detecting
  nutrients — at which they can succeed or fail, and acquired tastes show that palates
  are trainable. Which of these features, if any, does moral judgment inherit, and
  does the borrowed idiom of "a matter of taste" do argumentative work that the theory''s
  own data cannot support — especially since the survey results are usually read as
  a graded difference in weighting rather than an absence, and since the original
  samples were strikingly narrow? Finally, tell me whether her conclusion — that the
  psychology of the two sides settles nothing about who is right — survives once the
  disanalogies are on the table, and whether a different analogy for the same theory,
  say a perceptual faculty or a face-recognition module tuned by experience, would
  change that verdict, or whether every analogy capable of carrying the theory has
  this same problem.


