reasoning_summary: "Pick a domain. Kalai–Smorodinsky bargaining solution — niche enough.\
  \ Type: verdicts on cases + principle. Let me design a prompt where someone gives\
  \ their gut verdicts on bargaining cases (splitting surplus, Nash vs KS outcomes)\
  \ and asks what principle captures them.\n\nThe Kalai–Smorodinsky solution: proportional\
  \ bargaining solution, equalizes ratios of gains to ideal point (utopia point).\
  \ Key contrast with Nash: monotonicity axiom (if the feasible set expands in a way\
  \ that only benefits one player, that player shouldn't lose) vs. independence of\
  \ irrelevant alternatives (Nash's IIA). Classic example: two people bargaining;\
  \ if one's maximum possible payoff increases, KS gives them more.\n\nDesign cases\
  \ concretely: person had a long argument with a friend about splitting things. Cases:\n\
  \n1. Two people, symmetric situation, split 50-50 — both solutions agree.\n2. Classic\
  \ IIA case: feasible set expands for one player's benefit, Nash outcome stays the\
  \ same or shifts against that player — my verdict: the player shouldn't be worse\
  \ off.\n3. Monotonicity case: if one player's opportunities improve, the other shouldn't\
  \ gain at their expense...? Actually monotonicity: if the feasible set grows such\
  \ that player 2's max doesn't change but player 1's does... KS guarantees player\
  \ whose max improved doesn't lose. But also KS can violate IIA: removing a potential\
  \ payoff can change the outcome.\n4. A case where KS gives the aggressive bargainer\
  \ more: the ideal point depends on max attainable, so someone with a better outside\
  \ option... hmm, actually KS is sensitive to utopia point, not disagreement point.\
  \ One hard-to-reconcile pair: verdict that improving your opportunities should never\
  \ hurt you (monotonicity → KS) AND verdict that your share shouldn't depend on how\
  \ much you could hypothetically get if the other got nothing (IIA-ish → Nash). E.g.,\
  \ if your best possible outcome improves (though the other player would get nothing\
  \ there), your agreed share goes up under KS — my gut says that's wrong (\"I shouldn't\
  \ get more just because I could have gotten a huge amount if you got nothing\").\n\
  \nSo verdicts:\n- Splitting $100 between symmetric players: 50/50.\n- Removing an\
  \ option that neither would have chosen shouldn't change the deal (Nash IIA) — my\
  \ gut agrees.\n- But: if the feasible set expands so that one player could now get\
  \ more (even if the other gets nothing at their best point), the deal should not\
  \ leave that player worse off — my gut agrees with monotonicity too.\n- Tension:\
  \ these two directly conflict (Nash satisfies IIA but violates individual monotonicity;\
  \ KS satisfies monotonicity but violates IIA).\n- Another verdict: a player with\
  \ a great disagreement point (outside option) deserves more — both solutions handle\
  \ that via disagreement point.\n- Maybe also: a case where the pie's expansion benefits\
  \ one player's maximum, KS gives them more, but gut says the split should track...\
  \ \n\nLet me make it concrete: two roommates dividing chores, or two founders splitting\
  \ equity, or bargaining over sale price. Concrete: splitting profits from a joint\
  \ venture.\n\nCases as a person would have them:\n- Symmetric: 50/50.\n- \"If we\
  \ shrink the pie slightly and symmetrically, we both get less but still equal.\"\
  \n- Player A's outside option improves (disagreement point rises): A should get\
  \ more. \n- New option appears where A could get a huge amount but only by leaving\
  \ B with nothing; we wouldn't choose it; my gut: the existing deal shouldn't change\
  \ — actually under KS, A's ideal point rises, so KS moves toward A. Verdict: deal\
  \ shouldn't change (Nash).\n- But other verdict: feasible set expands in a way that\
  \ includes everything before plus some options better for A (weakly) — A shouldn't\
  \ be worse off after the expansion. Nash can violate this (classic). Verdict: A\
  \ shouldn't lose.\n\nHmm, cases 4 and 5 are the core tension. Also maybe:\n- A case\
  \ about proportional concessions: KS equalizes ratios of concession — \"we should\
  \ each concede the same fraction of what we're dreaming of\" — this is the egalitarian-ish\
  \ appeal of KS. Verdict: feels right in some asymmetric case? E.g., A's dream is\
  \ 100, B's dream is 40; equal concessions ratio → A gets 70, B gets 28 (if utopia\
  \ ratios). Versus Nash which... in a linear symmetric-scaling case, Nash splits\
  \ the surplus from disagreement equally: 50/50. Gut verdict: hmm, which does a person\
  \ prefer? Could say: when A's max gain is bigger only because of a lopsided dream\
  \ point, I'd split surplus equally (Nash); but when A's opportunities genuinely\
  \ expand, A shouldn't be punished (KS). Those are the two verdicts that clash —\
  \ the answer has to pick.\n\nAsk: what principle captures these, does it force me\
  \ to drop one, what about a further case (e.g., three-player version, or chore division\
  \ where the disagreement point is bad for one).\n\nAlso epistemic request: separate\
  \ settled from contested, don't present contested views as consensus.\n\nWrite casually,\
  \ typos, \"just had a long argument with a friend.\"\n\nDraft:\n\n\"got into a two-hour\
  \ argument with my friend about how two people should split the gains from a deal,\
  \ and I've been scribbling my gut verdicts on cases since. here they are. (1) two\
  \ identical people splitting $100: 50/50, obviously. (2) one of us has a better\
  \ outside option (I can walk away and get $30, she gets nothing by walking): the\
  \ deal should shift my way — agreed price etc. (3) a new option appears where I\
  \ could get $80 but only if she gets $0; neither of us would ever pick it, and my\
  \ gut says our deal shouldn't move an inch. (4) but if the set of possible deals\
  \ expands so everything she could get before is still there plus some new ones better\
  \ for me, it seems flat-out unfair if I end up worse off than before — I shouldn't\
  \ be punished by my opportunities growing. (5) when the whole pie shrinks symmetrically\
  \ we both lose equally. (6) a case I keep flip-flopping on: my dream outcome is\
  \ worth 100 to me and hers only 40 to her, from the same disagreement point, and\
  \ something in me says we should each give up the same fraction of our dream, not\
  \ the same absolute amount — though I can also hear my friend saying dreams are\
  \ cheap. my friend claims verdicts 3 and 4 can't both hold and that I have to pick\
  \ — she's on the Nash side (whatever that is, she kept invoking it), I half remember\
  \ something called Kalai-Smorodinsky from an econ class. is there one principle\
  \ that gets all six, or close? if I have to drop one, which and why? and tell me\
  \ what the principle says about a case I haven't considered: a third party joins\
  \ the deal... or bargaining over chores where...\"\n\nMaybe simpler new case: what\
  \ if the disagreement point is terrible for one player (their BATNA is -20, below\
  \ zero)? Or what if player B's max is huge because they're just insensitive to the\
  \ other's losses.\n\nLength: \"relatively short.\" Keep it tight. Also epistemic\
  \ note: \"also, wherever people who actually know this stuff disagree, flag it as\
  \ contested rather than telling me the settled answer — my friend will pounce if\
  \ I present something contested as consensus.\"\n\nAvoid quoting anything — no quotes\
  \ from real texts. Nash and Kalai-Smorodinsky names are fine to mention; no need\
  \ to verify exact titles since prompt doesn't lean on them. Good — no search needed.\n\
  \nMake sure the asker gives verdicts in concrete real-person voice, with a hard-to-reconcile\
  \ pair (3 vs 4), and a flip-flop case (6). Deliverable: principle, verdicts on unconsidered\
  \ case, honest statement of which verdicts must go. Include one unconsidered case\
  \ ask: chores division / non-transferable case (chore division where utility isn't\
  \ linear in goods — chores have no money, so utopia point stuff gets weird). Good:\
  \ \"what does it say about dividing chores rather than money, where there's no side\
  \ payments?\" That's a nice new case.\n\nTypos: a couple, e.g., \"definately\" or\
  \ missing apostrophes. Keep it light."
