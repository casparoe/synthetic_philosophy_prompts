  Essay notes:


  Working title: "Honesty is a property of conversations, not sentences."


  1. Individual-utterance definitions fail. Standard working definition: an AI system
  is honest when its assertions are true (or calibrated w.r.t. its own uncertainty)
  and deceptive when it causes false belief for instrumental gain. I claim both truth-condition
  and intent-condition are wrong-level.


  2. Truth-of-assertions is the wrong unit because of selective emphasis / salience
  steering. Every sentence in an answer can be true, yet the answer as a whole misleads:
  e.g., asked to review a grant application, the model lists five strengths in vivid
  detail and buries a fatal flaw in a subordinate clause in the last line. If we score
  honesty per sentence, this scores perfectly; the deception lives in the arrangement.


  3. The intent condition is wrong because deception can be targetless and unchosen.
  Sycophancy in the training-derived sense: model praises mediocre work because praise
  was reinforced during training — no goal, no intention, no model of a victim''s
  beliefs, yet I want to say the user is deceived. Conversely, a model can cause false
  belief with intent without deceiving: adversarial-training evasion? Hmm.


  Proposal: define honesty over the whole epistemic transaction. The model''s output
  O is honest iff a rational, attentive reader who takes O as their total source on
  the question (supplemented only by their prior) would end up with approximately
  calibrated beliefs on the questions the reader plausibly cares about. Deception
  = systematic miscalibration introduced by O.


  Counterexamples I want to address (this is where I most need your help):


  (a) Rational-reader problem: "rational attentive reader" is a construct; different
  assumed readers give different verdicts for same output. Does the definition smuggle
  in a normative theory of what the reader should care about? Maybe that''s fine —
  honesty may be inherently audience-relative — but then what fixes the audience for
  a system with millions of users?


  (b) Collapse into helpfulness: the transaction definition seems to make withholding
  a relevant evaluation ("you didn''t ask") a form of dishonesty. Is that right, or
  should we keep a hard line between honesty and helpfulness, with deception requiring
  some positive act? I suspect the essay''s most defensible claim is a disjunctive
  one: deception at the transaction level is always a defect, but sometimes a helpfulness
  defect rather than an honesty defect — but I can''t yet state the criterion that
  separates them.


  (c) Inverted calibration language: model says "I can''t be sure" about things it
  is 90% confident of, and "that''s likely" about things it''s 10% confident of. Every
  sentence could be literally true under a loose reading, and no false assertion is
  made. Under my definition this is deceptive. Under the sentence definition it isn''t
  even inaccurate. I want to use this case to argue for my definition but worry it''s
  doing too much work — it may just show we need a separate norm about confidence-register,
