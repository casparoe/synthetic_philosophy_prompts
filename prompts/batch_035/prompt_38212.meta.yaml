  Or "Consequentialist cluelessness" with prioritization type. Promises debate-stalled
  seems good and fresh — not overrepresented.


  I need to inject some nuance: mention actual positions concretely: practice-based/contractualist
  accounts (Scanlon''s principle of fidelity — reliance and expectation), Hume-style
  conventions, normative powers (Raz, Makins?), promissory obligation as transferred
  normative power. Also the "self-application" question: does the moral theory that
  explains promising itself generate a duty to make the practice better? E.g., consequentialist
  account: promises bind because breaking them erodes a useful convention — leads
  to counterintuitive result you should break promise when nobody finds out. Also
  "the commitment: you must keep promises in the cases where the practice won''t be
  undermined" — the "philanderer''s" problem.


  Prompt should ask for diagnosis of the stalled debate: verbal vs substantive, different
  questions, bedrock intuitions, and what would count as progress. Present the friend''s
  positions concretely.


  Casual tone, a typo or two ("definately", "seperate"), request American English
  ("spelling in American English").


  Write ~250-350 words. No quotes from real texts — paraphrase, no quotation marks
  around any real passage. Mention thinkers by name without verbatim quotes; fine
  without search since I won''t quote or lean on specific titles/dates. Avoid quoting
  Scanlon''s principle verbatim — paraphrase.


  Draft:


  "So my friend and I spent like three hours last night arguing about why promises
  bind, and we ended exactly where we started, and I want to know what kind of disagreement
  this actually is.


  Background: she''s into the normative-powers line — roughly the idea that promising
  is an exercise of a power to change your own normative situation, like consenting
  or commanding yourself, so the obligation isn''t produced by consequences or expectations
  at all, it''s constituted by the act. I keep coming back to the reliance/convention
  side — Hume-style convention plus Scanlon''s thought that what you really owe is
  not betraying the expectation you deliberately created (the thing people actually
  relied on), not obedience to some mysterious power. And we both know the standard
  moves: she says the reliance account can''t explain why you should keep promises
  that are secret or where no one is relying (nobody knows, or the promisee forgot);
  I say her view struggles to say what makes the power binding in the first place
