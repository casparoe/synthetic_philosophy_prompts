  Diagnose: verbal? different questions (she''s answering what promising is, I''m
  answering when we''re obligated)? bedrock intuitions? What would count as progress."


  Also add: neither of us moved, a year of this. Ask for American English, note typo.
  Deliver: diagnosis plus what would count as progress — a distinction, a test case,
  etc. Add specific hard cases: secret promises, promises under duress, promises to
