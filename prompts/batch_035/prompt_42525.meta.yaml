  better: pay $10 for a cap at 30 tosses (max $2^30 ≈ $1 billion, EV $32) — feels
  fine. But reject the uncut version at $20. That''s the classic tension: unbounded
  tail does all the infinite work yet you''d barely notice it.

  - Two lotteries both with EV $50 but different variance — prefer the safer one even
  though EV lower.

  - A lottery with EV slightly negative but tiny chance of life-changing money — buy
  the lottery ticket anyway (feels fine).

  - Pascal''s murrer: many St. Petersburg trials — Kelly criterion: accept if you
  can play many times and pay small fraction of bankroll. Verdict: wouldn''t pay half
