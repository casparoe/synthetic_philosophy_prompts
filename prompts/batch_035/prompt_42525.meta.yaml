  Cases:

  - Reject the standard St. Petersburg (fair coin, double each heads, $2 base) even
  for $20 entry fee — obviously reject despite infinite EV.

  - But would pay $10 for a version capped at 30 flips (EV ~ $31? actually EV of cap
  at 2^30... expected value = sum... capped at n flips EV ≈ (n+2) dollars? Actually
  EV of St. P capped at N tosses is N+2 dollars roughly (2·sum p... = sum_{k=1}^{N}
