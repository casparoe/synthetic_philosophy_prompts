  ---


  At a student union meeting last week, a motion to withdraw an invitation from a
  controversial speaker was defended almost entirely with a single sentence, delivered
  as if it settled the matter: "a tolerant society must be intolerant of intolerance."
  The speaker in question holds views many find bigoted, but no one claimed he incites
  violence or organizes a movement — the case for withdrawing the invitation was that
  his presence itself constitutes the intolerance the slogan licenses us to refuse.
  The line, I gather, is a popular compression of a passage in Karl Popper''s The
  Open Society and Its Enemies (1945), where Popper discusses intolerant movements
  that refuse rational argument and "teach them to answer arguments by the use of
  their fists or pistols" — but the sentence as used at our meeting has come loose
  from that context, and I want to know what it actually claims.


  Please lay out the distinct precise theses that the one-liner could be expressing,
  from weakest to strongest. I''d like the menu to include at least: (i) the truism
  that no principle is exceptionless or that tolerance doesn''t obligate me to endorse
  what I tolerate; (ii) a reciprocity or contract reading, on which tolerance is owed
  only to those who practice it; (iii) an ecological or empirical reading, on which
  tolerant majorities are reliably outcompeted by intolerant ones unless they suppress
  them; (iv) something like Popper''s own scope, restricted to movements that have
  abandoned argument and begun inciting force; and (v) whatever stronger reading would
  license suppressing mere expression of offensive views by nonviolent speakers. For
  each reading, tell me whether it is plausible, whether it is false, and — crucially
  — whether it actually delivers the conclusion it was used to support in our meeting,
  namely that a nonviolent but bigoted speaker may be refused a platform as a matter
  of principle rather than taste.


  I''d also like to know where the real action is: I suspect it''s in the question
  of who gets to classify a view as "intolerance" and by what procedure, since on
  some readings the slogan hands whoever already holds power a general license to
  suppress whatever they label intolerant, and the slogan itself becomes a tool of
  the thing it warns against. If some readings collapse under self-application (being
  intolerant of intolerance looks, to the target, exactly like intolerance), say so.
  End with a verdict on the sentence as it was used at the meeting: which reading
  did the speaker most likely intend, and did it support the motion?


