  relevant events are actually occurring or have occurred; and (iii) audiences do
  not believe that fictional characters exist or that the events they are watching
  are really happening.


  Ada defends a make-believe view: while watching or reading, audience members make-believe
  that they believe the fiction''s content, and what they feel are quasi-emotions
  — genuine physiological stirrings and experiential feelings, but not full-fledged
  emotions, because they lack the belief component and the associated action tendencies.
  Ben defends the thought theory: emotions can be generated by evaluative thoughts
  alone; belief in the existence of the object is not a necessary condition of emotion,
  so the tears shed for a fictional heroine are genuine grief, no differently in kind
  from tears shed at a funeral.


  The dialogue should have genuine back-and-forth: each character should respond to
  the other''s actual arguments and adjust, concede, or press where appropriate. Neither
  should be a strawman; each should be given their strongest lines.


