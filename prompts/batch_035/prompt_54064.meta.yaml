  Fitch''s paradox: "If all truths are knowable, then all truths are known." Verificationism/semantic
  anti-realism commits to knowability principle (KP): all truths are knowable. Fitch
  shows KP + non-omniscience entails all truths are known — contradiction. Question:
  credence that Fitch''s paradox is a genuine refutation of Dummett-style semantic
  anti-realism? Decomposition: whether KP is a fair reading of anti-realism; whether
  responses (restricting to cartesian/timid truths, epistemic restrictions) succeed;
  whether the proof itself generalizes to other epistemic notions. This is "in the
  weeds" enough — the knowability paradox, distribution problem, Dummett — but LLMs
  know it reasonably. It''s a domain given, so it''s fine. Niche enough, meaningful.


  Alternatively, dispositions + probability: "credence that fragility is reducible
  to a conditional" — decomposition over finks, masks, antidotes, mimickers. Also
  good.


  Common prior assumption: credence that the CPA holds among rational agents — Aumann
  agreement, no-trade theorem, disagreements as evidence of different priors. Rationalist
  readers love Aumann agreement ("rationalists should disagree less"). Decomposition:
  whether priors are well-defined without a prior over priors; whether asymmetry of
  information explains apparent disagreement; whether "rational" agents idealization.
  This is very rationalist-flavored. I could inject a niche-ish framing: Earman''s
