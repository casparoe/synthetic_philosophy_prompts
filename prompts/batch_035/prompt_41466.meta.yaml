  ---


  I''ve been asked to set out my position on the precautionary principle for a panel
  on risk regulation, and before I do, I want a consistency audit of it, because something
  in it feels unstable to me, though I can''t tell what. Here is the package as I
  hold it:


  (1) The precautionary principle is a principle of practical rationality and not
  merely a policy slogan. Where a possible harm is grave and effectively irreversible,
  it can be rational to restrict an activity — or to intervene — without established
  proof of harm, and it is a mistake to demand proof of harm before acting.


  (2) What triggers the principle is the severity and irreversibility of the possible
  harm, not its probability. A very small probability of an irreversible catastrophe
  can demand action that a much larger probability of a comparable but reversible
  harm would not. If probabilities can''t be estimated, that''s not a reason for silence;
  it''s exactly when the principle is supposed to do its work.


  (3) The burden of justification falls on whoever introduces a new risk. Regulators
  don''t have to prove harm before restricting; the introducer has to show safety
  before introducing. In particular, "your remedy carries risks of its own" is not,
  by itself, a good reply to a precautionary argument.


