  remedy carries risks is not a good reply" — that''s the old (4/5 neutrality) item
  merged. I should keep them separate so the tension between them is visible as a
  tension between numbered items. Let me keep them as separate items:


  (3) Burden on introducer.

  (4) The principle is neutral between intervening and refraining: not acting is itself
