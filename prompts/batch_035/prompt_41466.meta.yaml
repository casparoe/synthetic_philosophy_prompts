  The asker holds:

  (1) The precautionary principle is a genuine principle of practical rationality:
  in cases of possible grave and irreversible harm, it can be rational to act (or
  forbid) without waiting for established causal proof or probability estimates, and
  "absence of evidence of harm" is not "evidence of absence."

  (2) It must be non-paralyzing: a formulation under which every option, including
  doing nothing, is "risky" and hence forbidden, is a reductio of the principle, not
  an application of it.

  (3) What triggers precaution is irreversibility and severity of the potential harm,
  not the probability: a small chance of an irreversible catastrophe can demand action
  that a near-certain reversible harm of the same magnitude would not.

  (4) The burden of justification falls on whoever introduces the risk: regulators
  do not have to prove harm before restricting; the introducer must show safety. (Pro-regulation
  default.)

  (5) The principle is politically neutral: it applies to inaction as much as action
  — failing to regulate is a choice for which one is responsible; and it applies to
  restrictions as much as to technologies (a restriction is itself an intervention
  that can cause irreversible harm, e.g., delaying a vaccine or a cheap technology
  that the poor depend on — they have in mind the DDT/malaria debate and the vaccine-delay
  cases).

