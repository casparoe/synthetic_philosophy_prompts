  Let me think about which is most interesting and "in the weeds."


  Good''s theorem: the argument that in expected utility maximization, the expected
  value of the information from an experiment is always nonnegative, assuming free
  and relevant information. The classic counterexample setup: "information can be
  harmful" cases often involve other agents (adversarial), non-Bayesian updating,
  or costs. A disagreement: two friends argue whether it''s ever irrational to accept
  free information. One cites Good''s theorem; the other brings up cases like blackmail,
  or "the value of information is negative when a predictor can see whether you looked"
  — self-referential information, e.g., in Newcomb-type problems, learning which box
  has the money can be bad if Omega conditioned on your seeking info. There are known
  nuances: Good himself noted a caveat in 1974 about situations involving actions
  that influence the state ("the value of your information can be negative when there
  are other agents"). Kadane, Schervish, Seidenfeld wrote on "reasons to seek information"
  and cases where free information is harmful (e.g., in sequential decisions, or with
  non-conglomerability).


  I could write a disagreement prompt: friend A says Good''s theorem proves you should
  always accept free information; friend B counters with a case where a predictor
  will put money in a box unless you check... adjudicate move by move.


  Alternatively a probability decomposition prompt on Good''s theorem: "credence that
  Good''s theorem holds without exception for a Bayesian agent... " That''s harder
  to make a live philosophical question though — the theorem is mathematically true
  under assumptions, so disagreement would be about assumptions.


  Actually the disagreement type fits well. Let me construct a back-and-forth:


  (1) One says: expected utility theory says free information can never hurt you —
  decision-theoretic "value of information" is always nonnegative, so refusing to
  hear the results of a test is irrational.


  (2) Other: gives case — a doctor''s diagnosis where you can''t do anything about
  it either way, and knowing causes dread. First replies: then the information isn''t
  free — there''s a psychic cost, so the theorem (assuming zero cost) doesn''t apply.
  Second: so the theorem is vacuous, all real information has costs, so it''s never
  practically applicable... First: no, it''s still doing work, it says that among
  costless things, information has nonnegative value...


  Then a deeper counterexample: information that changes your action in a way that''s
  observable by another agent — e.g., in an auction, learning your valuation changes
  your bid which others can anticipate... or the Raiffa/Schlaifer case. Or the "you''ll
  be tempted to act on it badly" — e.g., knowing your genetic risk of Huntington''s
  where you might make worse decisions. Actually the classic one: an agent who will
  use the information badly (non-Bayesian updating, or weakness of will). Second friend:
  my grandfather refused his Huntington''s test result... he knew that knowing would
  lead him to live worse (fatalism). First: that''s just a failure of rationality
  elsewhere, not a counterexample to the theorem.


  Another good one: self-referential / Newcomb: if a predictor predicts whether you''ll
  look at the information and punishes lookers. First friend: that violates the theorem''s
  assumption that the state of the world is independent of your information-gathering.


  Also the subtle point: Good''s theorem assumes you update by Bayesian conditioning
  on the true proposition. If you might update badly (e.g., on ambiguous evidence),
  free info can hurt. And there''s the famous Good 1974 note "The Price of Bacon"
  no wait — Good''s follow-up "A little exercise..." Actually Good 1974 "Sally Bennett''s
  problem" — Good himself later acknowledged a flaw in his original argument regarding
  "assuming you always act optimally afterwards." The theorem''s proof uses the fact
  that you''ll act optimally given the info, but the comparison is to your current
  best act. Hmm, the proof: EU of observing X = E[max_a EU(a|X)] ≥ max_a E[EU(a|X)]
  ≥ ... wait, actually the proof compares to acting after seeing X optimally, vs acting
  now optimally. Since you can always ignore the info (choose the same act), value
  ≥ 0 — that''s the simple proof. The catch Good identified: the "act" might include
  information-gathering decisions in a different temporal order; in problems where
  the observation influences the state (e.g., other agents), the proof breaks.


  I can write the disagreement with maybe 4-5 moves covering: (a) medical bad-news
