  Let me consider: therapy/enhancement distinction + presuppositions. A practice:
  health insurance (NHS / insurers) covering treatment of disease but not enhancement
  (e.g., Viagra covered for erectile dysfunction from prostate surgery but not for
  healthy men; growth hormone for deficiency but not short stature without deficiency;
  glasses covered but LASIK for pilots not). What view of health/disease/function
