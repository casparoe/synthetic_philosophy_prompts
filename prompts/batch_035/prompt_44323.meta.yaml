  (cover whatever improves wellbeing most per pound). Answer in British English please.
  Also curious whether the line drawn is even doing any normative work or is just
  cost control dressed up."


  Trim. Keep a typo: "cheeryer" or missing apostrophe. Casual tone. Length fine.


