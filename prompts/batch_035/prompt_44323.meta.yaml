  asks for implicit theory. Write casually, British English request, a typo or two.


  Draft:


  "Something I''ve been mulling: my health insurance (and the NHS for that matter)
  will pay for antidepressants if I''m diagnosed with depression, but not if I just
  want to be cheerier than baseline. It''ll cover growth hormone for a kid with a
  diagnosed deficiency but not for a short kid with no deficiency, and glasses but
  not LASIK to get better-than-20/20 vision. But it happily covers vaccines, which
  don''t treat anything — I''m not sick — they just make my immune system better than
