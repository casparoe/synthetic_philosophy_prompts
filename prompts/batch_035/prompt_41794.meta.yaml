  ---


  I teach an upper-level undergraduate seminar on democracy''s epistemic pathologies
  — 18 students, one 90-minute session, and a unit that runs from the Mytilenean debate
  through the Sicilian expedition vote to the trial of Socrates. For this session
  I want the students to run into the problem themselves before we name it. Design
  an in-class role-play of a fictional decision case — not Mytilene itself — in which
  a sovereign assembly of the whole class, in the grip of a perceived betrayal, votes
  in haste for a maximally harsh response, and then reconvenes and reverses itself,
  only to discover that reversal comes too late for part of what it set in motion.


  Requirements for the activity:


  - A fictional case with enough texture that students argue about it as a real decision:
  the setup, a one-page briefing sheet the whole assembly receives, and asymmetric
  information (a few students hold briefs the rest don''t).

  - A two-vote structure with the second vote governed by a rule the students themselves
  must invent at the start (e.g., who may speak, how long, whether speakers may appeal
  to justice or only to interest — their choice, and their choice should have consequences
  they can see afterwards).

  - An irreversibility mechanic: something the first vote dispatches that the second
  vote cannot fully recall — a timer, a sealed envelope, a ''trireme'' — so the students
  feel that being able to change your mind is not the same as being able to undo.

  - A payoffs scheme that needs no real money (points, tokens, or standing) and that
  is rigged so that the payoff from deciding quickly and harshly is genuinely tempting,
  not obviously a trap.

  - A debrief in two stages: first, mapping what happened in the room onto the historical
  pattern — the parallel to Mytilene, and then the ways the same assembly-level failure
  reappears at Syracuse and in the courtroom; second, a stress-test in which the students
  propose institutional fixes (cooling-off periods, supermajorities, second chambers,
  disqualifying emotional appeals) and you give the facilitator good grounds for showing
  each fix merely relocates the problem, as the Sicilian vote shows an assembly that
  deliberated at length and still erred.

  - A frank note on what the activity cannot reproduce: the real fear, the real stakes,
  and the fact that Athenian jurors were paid volunteers judging with no appeal —
  and how the facilitator should supply these in the debrief rather than pretend the
  simulation carried them.


