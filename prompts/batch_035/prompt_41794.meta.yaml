  speaking rules, the irreversibility mechanic, and the payoff scheme.

  3. The debrief (about 350 words) — the mapping onto Mytilene, Sicily, and the trial,
  and the stress-test of proposed fixes.

  4. What will go wrong the first time I run it (about 150 words) — predictable failures
  and handling.

  5. What the simulation cannot carry (about 100 words).


