  contents of our moral beliefs were fixed by fitness considerations that are indifferent
  to moral truth: we would have had exactly the beliefs we have whether or not any
  of them were true. Since it would be an enormous coincidence if beliefs formed in
  this way happened to be mostly true, it is overwhelmingly likely that our moral
  beliefs are false, and realism is thereby refuted.


  This is not a mere genetic fallacy. The genetic fallacy would be inferring that
  a belief is false from the mere fact that it has some causal origin, and the argument
  does not do that. The point is rather that the origin in question has a specific
  feature: fitness would have produced the same attitudes whether or not they were
  accurate, and an origin of that kind is epistemically relevant in a way an arbitrary
  origin is not. Being told a mathematical truth by a stranger is also a causal origin,
  but it gives us no reason to doubt the belief.


