  favored them because of their effects on reproductive fitness rather than because
  they were true. Given that starting point, the realist faces two options. On the
  first horn, the independent moral facts themselves influenced which attitudes selection
  favored. There is nothing in principle wrong with this: selection is guided by moral
  facts in the same way it is guided by facts about nutrition, so the realist can
