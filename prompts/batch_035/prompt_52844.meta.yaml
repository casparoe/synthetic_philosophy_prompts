  ---


  I''m a software engineer with no formal philosophical training, and I have been
  asked to facilitate a structured exchange between two colleagues who have been arguing
  about aggregation ethics for years. One of them — call her the aggregator — holds
  that every harm counts, however small, and that a sufficient number of negligible
  harms is worse than a single severe one: enough dust specks in enough eyes outweigh
  a single torture. The other — call him the thresholdist — holds that some harms
  are so minor that no number of them adds up to a severe harm; there is a lexical
  gap that multiplication cannot cross. After a year of talking past each other, they
  have agreed to let me draft a joint statement in place of another debate. Please
  write that document.


  Structure I need:


  1. Agreed claims. Claims both could sign about the case itself — e.g., that a dust
  speck is a genuine (if minute) harm rather than a neutral event; that the single
  torture is much worse for the one person than one speck is for one of the many;
  that our intuitions pull in different directions depending on whether the comparison
  is framed as a single choice or as a repeated policy; and whatever else you judge
  both could genuinely accept. Do not include claims that would be vacuous.


  2. Disagreements, stated in wording each side would accept for its own view. In
  particular I want the residual disagreement made precise: is it about whether value
  is additive across persons (each person''s harm contributing an independent amount),
  about whether "better than" comparisons require identifying someone made better
  off, or about whether the aggregate comparison is even well-defined when no individual
  is ever faced with the trade? If part of the dispute is verbal — e.g., both sides
  using "worse" while meaning different comparison relations — say which part and
  why.


  3. Cruxes. I suspect at least these, but add others you think matter: (a) separability
  — whether the badness of what happens to one person is independent of what simultaneously
  happens to others; (b) continuity — whether for every harm there is a finite number
  of milder harms that exceeds it; (c) grounding — whether a moral comparison between
  two outcomes must trace to a difference for some individual. For each crux, specify
  a concrete case or thought experiment both would accept as bearing on it, and record
  each side''s prediction in advance.


