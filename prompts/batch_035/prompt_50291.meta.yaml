  "I write a column on science and ideas, mostly at the intersection of history, tech,
  and people''s obsession with predicting what comes next. Every few years the predictions
  industrial complex gets another boost — now it''s AI forecasters telling us exactly
  when everything changes, and before that it was Fukuyama''s end of history, and
  before that it was Marxist stages of history.


  For my next piece I''ve been reading Popper''s old attack on what he called historicism
  — the idea that history has laws or a direction you can read off, and that predicting
  the future in broad strokes is therefore science. His core argument, if I''ve got
  it right, was that prediction needs laws plus initial conditions, that any prediction
  of future knowledge would have to already contain that knowledge (so we can''t have
  it), and that treating whole societies as units you can extrapolate is a category
  mistake — the future depends on what we''ll learn, and what we''ll learn is the
  one thing we can''t know in advance.


  And it struck me that Isaac Asimov sort of ran this experiment a decade before Popper
  published. Hari Seldon''s psychohistory is supposed to be exactly what Popper says
  is impossible: a science of history that predicts the fall of the Galactic Empire
  and steers a thousand years of future. And the funny thing is that Asimov''s own
  plot keeps vindicating Popper: the Seldon Plan works right up until the Mule, a
  single unpredictable individual, wrecks it — and then the story has to smuggle in
  a secret Second Foundation to quietly repair the Plan, which looks a lot like the
  historicist''s trick of explaining every surprise as part of the forecast after
  the fact.


  So here''s what I want: read the original Foundation trilogy through Popper''s critique.
  Where does psychohistory actually fail by Popper''s lights — is it the unpredictability
  of new knowledge, the role of individuals, or something else? Is the Second Foundation
  a fix or an admission that the whole idea doesn''t work? And is there a reading
  on which Asimov knew all this and the series is secretly an argument *against* laws
