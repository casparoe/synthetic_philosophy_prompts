  the idea, gave me the following summary, which I''d like to use as the backbone
  of the piece:


  "Acausal trade is cooperation between agents who cannot interact in any way — no
  signals, no causal channel of any kind, perhaps because they are separated by cosmic
  horizons or live in different branches of the universe. The trick is that each agent
  can predict what the other will do, and each decides to cooperate only if it predicts
  the other will cooperate too. In effect each agent runs a complete simulation of
  the other''s reasoning process, verifies that the simulation is faithful, and conditions
  its own behavior on what the simulation would do. It''s essentially Hofstadter''s
  old idea of superrationality — cooperating in a one-shot prisoner''s dilemma because
  you assume the other player reasons as you do — extended from identical agents to
  arbitrary ones. And because the reasoning doesn''t depend on any causal link, it
  follows that sufficiently advanced civilizations anywhere in the universe should
  already be cooperating with one another in this way, whether or not they ever make
  contact."


  Before I build the article around it: how much of this is fair? Please go through
  it more or less sentence by sentence and tell me what a decision theorist working
