  ---


  I''m a journalist covering science and ideas for a general-interest magazine, and
  I''m working on a feature about unusual cooperation schemes discussed in the AI
  alignment and rationalist communities. The centerpiece is "acausal trade," and I
  want to get it right, because the last time this magazine touched decision theory
