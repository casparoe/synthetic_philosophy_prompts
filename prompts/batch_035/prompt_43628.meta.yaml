  the final sentence, about civilizations across the universe, follows from the parts
  of the summary that survive scrutiny or whether it''s a much more conditional and
  speculative claim than the paragraph makes it sound. I''m inclined to trust the
  researcher since this is their field, but I''ve also read enough to suspect that
  "runs a complete simulation and verifies it" and "essentially superrationality"
  are doing more work, or less, than they appear to. I''d like to leave the interview
  with a list of sentences I can print as-is, sentences that need hedging, and any
  sentence I should strike and re-ask about.


