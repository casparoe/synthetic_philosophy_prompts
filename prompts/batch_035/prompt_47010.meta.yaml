  asymmetry (creating miserable lives is bad, creating happy lives is not good); a
  person-affecting view that grounds the wrongness of creating the miserable child
  in wronging that child, with whatever problems the non-identity case raises for
  it made explicit; a critical-level view; and a lexical view on which adding happy
  lives has some value that cannot be outweighed by any number of barely-worth-living
  lives... hmm, that''s getting complicated. Maybe simpler: "and any others you think
  the logical space requires". Flag any pair of positions the tree cannot separate
  on the cases you''ve chosen, and note combinations of answers that no actual view
  occupies, with a sentence on whether that''s because the view is incoherent or merely
  unexplored. Eight to ten questions max.


