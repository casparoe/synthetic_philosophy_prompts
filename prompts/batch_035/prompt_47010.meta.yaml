  (a) creating a child whose life will be just barely worth living, versus not creating
  anyone — good, bad, or neutral; (b) the non-identity case, where the child you create
  is mildly worse off than the different child you would have created later had you
  waited; (c) creating a child whose life contains a fixed amount of suffering versus
  inflicting an identical amount of suffering on an existing person — is the first
  as bad as the second, worse, or does it not compare?; (d) whether adding happy lives
  to a population makes things better in a way that can trade off against the suffering
  of others, including in the same-number case versus the different-number case.


