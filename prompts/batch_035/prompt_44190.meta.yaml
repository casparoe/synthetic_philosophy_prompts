reasoning_summary: 'Let me pick a domain and type. Self-deception: is it even possible?
  Works well with desiderata type. I could write a prompt asking for desiderata a
  theory of self-deception must meet — static vs dynamic puzzles, distinction between
  self-deception and wishful thinking, (me) vs others, cold vs hot bias, etc. Inject
  a slightly niche framing to avoid regurgitation — e.g., asking about whether the
  desiderata should include "the deceived and deceiver need to be numerically distinct"
  or something. Maybe inject a new-ish idea: e.g., a case where someone must genuinely
  believe p in order to keep benefiting from a scheme that requires them to also believe
  not-p (double bookkeeping). Or a requirement that the theory explain why self-deception
  is criticised differently from other epistemic failures.


  British English, casual, typo or two, prompt-engineering role text, section prescription
  with rough lengths.


  Desiderata for a theory of self-deception:

  1. Resolve the strategic paradox (you can''t believe p while intending to make yourself
  believe not-p, since to deceive you need to know the truth).

  2. Distinguish self-deception from mere wishful thinking / optimism bias.

  3. Distinguish from akrasia and self-serving confabulation (post-hoc rationalisation
  vs motivation).

  4. Handle cases of partial belief / self-deception without belief.

  5. Explain the moral phenomenology — why we blame self-deceivers more than honest
  mistakes (or whether we do).

  6. Empirical consistency — motivated reasoning literature, cognitive dissonance
  (Festinger), confabulation (split-brain, choice blindness), anosognosia.

  7. Explain the first-person dynamic: how you catch yourself or fail to.

  8. Account for the "success" conditions — self-deception as an achievement?

  Flag tensions: intentionality requirement vs paradox; division within the person.


  Casual asker could be someone in a book club or a therapist curious... Let''s write
  from the perspective of someone writing a thesis chapter or just curious after an
  argument with a friend.


  Include a niche twist: maybe ask about a specific invented-ish case — a fertility
  doctor using his own sperm... that''s real. Or a case about a GP who dismisses her
  own symptom. Ask them to weigh whether the desiderata should be agent-neutral. Keep
  it meaningful without web.


  Include the scoring against contenders: deflationary/deflationist accounts (Mele),
  divided-mind views (Pears, Davidson), deflationary no-belief views. Model should
  know Mele, Davidson. That''s standard enough.


  Sections: "The paradox, stated plainly", "What counts as the data", "The desiderata
  list", "Where the requirements clash", "How the main theories do", "Open questions".
  Rough lengths.


  Typo: "recieve" or "seperate". One or two.


  British English: "realise", "whilst", "behaviour", "sceptic".


