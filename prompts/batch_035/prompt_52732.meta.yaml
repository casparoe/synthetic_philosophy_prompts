  by their being approximately true, and this explanation is substantive: it is an
  inference to the best explanation, of the same kind as any in science. I also hold
  that some theories are closer to the truth than others — Newtonian gravitation is
  approximately true in a way that, say, Lorentz''s ether theory is not — so approximation
  comes in degrees.


