  ---


  I chair the clinical ethics committee at a mid-sized teaching hospital. Next month
  I am giving the opening address at a day-long workshop our committee has convened
  on a pattern we have started calling the "contented patient problem": a patient
  executes an advance directive while lucid — often shortly after watching a parent
  decline with dementia — instructing that certain treatments be withheld if she ever
  reaches a specified stage of impairment, and then, having reached that stage, appears
  settled and even content, taking pleasure in small daily routines and mildly accepting
  the very treatments the directive forbids. Our nurses and palliative-care physicians
  tend to think the patient''s evident present comfort should count heavily against
  enforcing the document; our lawyer regards the directive as a binding exercise of
  autonomy that the hospital ignores at its peril; and two philosophers in attendance
  will want to press the thought, familiar from Dworkin, that the directive''s authority
  rests on the patient''s interest in her life going a certain way as a whole rather
  than on her moment-to-moment experience. In the address I want to develop a framing
  of my own: that the earlier self is best understood not as a sovereign whose written
  word must be obeyed whatever happens, nor as a mere advisor whose instructions evaporate
  on contact with the patient''s present contentment, but as something like a fiduciary
  — a trustee whose standing instructions deserve great weight precisely because they
  were adopted from a position of overview, yet remain open to revision when the beneficiary''s
  circumstances change in ways the settlor could not foresee. If that framing works,
  it should let the committee say both that the directive matters a great deal and
  that it is not the end of the conversation, which is, frankly, the position we are
  already in without a theory to justify it. Please write the address, roughly five
  minutes when spoken, in British English. It should be comprehensible to the clinicians
  without condescending to the philosophers, it should not pretend there is an easy
  reconciliation where our committee in fact faces a hard choice, and it should give
  the audience a concrete question or two to carry into the small-group sessions that
  follow.


