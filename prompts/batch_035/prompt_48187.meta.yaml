  ---


  I''m a journalist who covers science and ideas for a broad readership, and I''ve
  been following the debate over the so-called gender-equality paradox: the reported
  finding that, across countries, higher indices of gender equality are associated
  with larger differences between men and women in occupational choices or field-of-study
  choices -- fewer women in STEM, relatively more in people-oriented fields -- rather
  than smaller ones. I''ve come around to thinking the paradox supports a fairly strong
  conclusion: that when societies liberalise and material constraint recedes, the
  residual differences in what men and women choose reflect, in some substantial part,
  sex differences in interests with a biological component; that the pattern we see
  in the freest societies is closer to the unconstrained expression of underlying
  dispositions than to the residue of remaining discrimination. It''s a conclusion
  I''d want to defend carefully in print, so I want to know where it''s exposed.


  Tell me what would count against this position. Specifically: which features of
  the data would have to be different for the inference to fail? For instance, what
  would it show if the association turned out to be driven by particular measurement
  choices -- the composite used to measure occupational segregation, or the particular
  index of equality, or a handful of countries at the extremes? What would it show
  if the within-country variance were the more informative comparison? What would
  count as evidence of remaining constraint in the most egalitarian countries, and
  how strong would that evidence need to be to undermine the inference rather than
  merely qualify it? What findings from other domains -- developmental psychology,
  comparisons across cohorts, natural experiments where constraints were lifted suddenly
  -- would bear on it either way?


  I''d like the defeaters sorted: which of these would be fatal to the strong conclusion,
  which merely awkward, and which a reasonable defender of the position should concede
  as counting against it rather than wave away. And be honest about whether the position
  has been insulated by qualifications -- whether ''in some substantial part'' has
  quietly become unfalsifiable -- and whether that matters for a claim of this kind.


  Please write in British English.


