  he was sent to the front instead. After the war she was prosecuted for the unlawful
  deprivation of liberty under § 289 of the German Criminal Code of 1871, and in 1949
  the court of last resort in criminal matters acquitted the judge who had sentenced
  him but convicted the wife, on the ground that she had of her own free choice made
  use of a Nazi statute contrary "to the sound conscience and sense of justice of
  all decent human beings."


  Here is how the argument went, as nearly as I can reproduce it:


  (1) Anouk began on the court''s side: the ruling made sense, she said, because the
  wife''s only defense was that the denunciation statute was valid law in 1944, and
  the court was right to refuse that defense. A statute of that kind is not law at
  any time; treating it as law defames the concept, and the wife deserves punishment
  under the ordinary code, just as she got it.


  (2) Dev answered that the ruling was disguised retroactivity. Either the statute
  was valid law in 1944 — in which case the wife did nothing illegal then, and convicting
  her under the code of 1871 means punishing an act that was no crime when done —
  or it was not law, in which case the court needed a natural-law test to say so.
  His own view, following Hart: the honest choice is between two evils, let her go
  unpunished or punish her under frankly retrospective law, and the second is the
  lesser one — but it should be called what it is.


  (3) Anouk said his "honest" cure is worse than the disease: punishing under a law
  that did not exist at the time violates prospectivity, one of the very values he
  claims to be protecting, so his candor just relabels the same violation. And she
  added the wider point: the Nazi system had forfeited legality as a system — secret
  decrees, retroactive orders, statutes contradicted by what officials actually did
  — so the court''s ruling was a statement about the whole system''s claim to be law,
  not a denial that one 1944 statute had clear wording.


  (4) Dev pushed back on her grounds for moving between levels: by Fuller''s own tests
  — publicity, generality, prospectivity, clarity — the 1944 denunciation statute
  was formally unobjectionable: it was published, prospective, and about as clear
  as criminal statutes get. If the "inner morality of law" does the work she wants,
  it either collapses into efficacy (the Nazi system worked, which counts in her favor
  too) or it quietly becomes substantive natural law, in which case her real authority
  is Radbruch''s formula about intolerable injustice, not Fuller''s proceduralism
  — and her two defenses come apart.


  (5) Anouk replied that the acquittal of the judge shows the court was not simply
  vengeful or drawing an ex post line wherever it liked: it distinguished the judge,
  whose situation she granted was harder, from the wife, who had a free choice and
  used the machinery of terror for private ends. The refusal to call the statute law
  was the court''s way of saying that fidelity to law had been withdrawn from that
  system, and that she could not invoke legality she had helped to corrupt.


