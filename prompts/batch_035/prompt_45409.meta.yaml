  Common misrepresentations of Bostrom''s simulation argument:

  - Claiming Bostrom argued "we are living in a simulation" (he argued a disjunction,
  and didn''t claim to know which disjunct).

  - Treating it as an argument that relies on the simulation being pixel-perfect reproduction
  of physics.

  - Conflating "ancestor simulations" with any simulation.

  - Presenting it as: if simulations are possible, then there are many more simulated
  than real minds, so probably we''re simulated — that''s close but misses the trilemma
  structure (substrate independence and technological maturity are assumptions).

  - Treating it as "we''ll never know" or as proof.

  - Confusing it with Descartes'' evil demon / brain in a vat skepticism.

  - The "communication with simulators" or "glitches" idea.


  A plausible popular summary with one or two subtle errors: e.g., a documentary/teacher
  says Bostrom proved that if future civilizations can run simulations, then odds
  are overwhelming we''re in one, and that the argument shows the physical laws of
  our world are code, and that if we''re simulated the simulators are our creators
  so the argument is really an argument for God, and that Bostrom himself says he''s
  fairly confident we''re simulated. Hmm.


  Better subtle errors:

  1. Overstatement: presenting the conclusion as "we probably are in a simulation"
  rather than the disjunction (one disjunct of which is that civilizations go extinct
  before simulating).

  2. Conflation: treating the argument as about any simulations, not ancestor simulations
  specifically — this matters because the empirical premise is about simulations of
  people like us.

  3. A technical term in everyday sense: "simulation" meaning video-game-like world
  where sims might notice glitches.


  Write as a high schooler: "My physics teacher showed us a documentary that summarized..."
  The student is inclined to think it''s basically right / skeptical.


  Keep it relatively short. No verbatim quotes from real texts — the summary is invented,
  attributed to a documentary. No search needed.


