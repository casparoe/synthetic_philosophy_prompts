  rewatched Remains of the Day and realized I might have the perfect object for it,
  but I want to sanity check the reading before I write it up for my blog.


  The pitch: Stevens is basically a stress test for the justice/care distinction.
  He runs his whole life on dignity, role-duty, and loyalty to a great man — and when
  that produces disaster (Darlington''s appeasement arc, the sacking of the two Jewish
  maids that Stevens relays because it''s not his place to have views), the standard
  reading is "rule-following morality, unchecked, curdles into complicity." The care-ethics
  reading cuts differently though, and here''s the part I keep going back and forth
  on: Stevens does care, in the thick relational sense Noddings cares about — about
  his father, about Miss Kenton, arguably about Darlington — but the caring is entirely
  routed through the role, and the role flattens it into "caring-about" rather than
  "caring-for." The scene where Miss Kenton gets the news of her aunt''s death and
  Stevens can only offer to adjust the staff schedule is the exact moment where the
  caring response is available and something in him refuses it. So maybe the novel
  dramatizes a real hole in the theory: care ethicists have trouble criticizing caring
  that''s misdirected or enclosed in a bad practice, and Stevens''s whole life is
  misdirected caring. Meanwhile Miss Kenton, who has all the actual engrossment, pays
  for it — her caring labor gets her a marriage to a man she doesn''t love, and the
  book doesn''t exactly hand her a win either.


