  I''m a third-year philosophy student in a seminar on metaontology, and there''s
  a pattern I keep running into that I can''t find a settled name for. The standard
  story we''ve been given, going back to Carnap, divides disputes into substantive
  ones and merely verbal ones: two parties who agree about all the facts but talk
  past each other because their words carry different meanings. Our professor''s stock
  examples are things like whether Pluto is a planet, or whether a lawn is "really"
  thousands of grass plants or one thing. What I''ve noticed, though, and what no
  reading has addressed directly, is that verbal disputes behave in two very different
  ways once they''re exposed. Some collapse instantly: once you see that "planet"
  could go either way and nothing turns on it, the disagreement evaporates — nobody
  walks away feeling that they lost. But others persist stubbornly. Take a nominalist
  and a Platonist who both accept that the question whether numbers exist is settled
  by the linguistic framework you adopt, who agree that either framework can be adopted
  and that the choice is pragmatic rather than factual. By the lights of our course
  they have nothing left to disagree about. Yet, in the literature and in seminar,
  each keeps insisting that the other is wrong about something — the Platonist feels
  the nominalist is doing violence to mathematical practice, the nominalist feels
  the Platonist has posited something absurd — even while granting, explicitly, that
  no fact is in dispute.


  So the phenomenon I want a name for is: a dispute that both parties acknowledge
  to be merely verbal, and that nonetheless does not dissolve — the residual sense
  of disagreement that survives the classification. It''s not quite Carnap''s internal/external
  distinction, because the parties already accept the Carnapian picture and the residue
  remains; and it doesn''t seem to be what people call metalinguistic negotiation,
  because neither side is trying to win control of the word — they agree on how it
  should be used going forward and still disagree. Does this residual, post-verbal
  disagreement have an established name, or a literature attached to it? If it does,
  I''d like to know how its defenders distinguish it from a merely psychological inability
  to let go. And if it doesn''t, I''d be grateful if you could coin a term for it
  and give its definition, together with boundary cases — say, whether the felt disagreement
  between compatibilists and incompatibilists about free will, once both sides concede
  that "free will" is a term of art they can define as they like, belongs in the same
  category.


