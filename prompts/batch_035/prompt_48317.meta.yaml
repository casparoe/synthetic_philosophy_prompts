  ---


  I''ve been a longtime reader of the rationalist blogosphere — LessWrong in its heyday,
  the decision-theory adjacent corners, the periodic posts on value of information
  — and I now run a weekly decision review at a 300-person company that builds logistics
  software. Several times a week a team comes to me with some version of the question
  "should we find out more before we decide?" — run another A/B test before rolling
  out the checkout change, commission a customer study before the rebrand, run a load
  test on production before the holiday traffic, do a reference call with a vendor''s
  ex-customer before signing. The stakes range from a week of engineering time to
  an irreversible pricing commitment; the teams want an answer within a day; and the
  people who would apply whatever I come up with are mid-level product managers with
  no decision-theory background and no patience for anything that smells of a seminar.


  What I want is a decision procedure my PMs can actually run, built out of the theory
  of the value of information — I. J. Good''s result that acting with free, relevant
  information in hand is never worse in expectation than acting without it, and the
  practical structure that sits around that theorem: information has value only insofar
  as some result would change the action; its value is capped by the stakes; and the
  theorem''s assumptions (the information is genuinely free, arrives before the decision,
  is used to update rather than to rationalize, and does not itself alter the situation)
  are exactly the assumptions that fail in practice. The procedure should translate
  this into an ordered checklist: the questions to ask about a proposed information-gathering
  step, in order; what counts as a sufficient answer to each; the point at which the
  procedure returns a flat "no, skip the study" and the point at which it returns
  "yes, but only for this subset of results" — the idea that a test is worth running
  only if some outcome would actually flip the decision seems to me the load-bearing
  insight, and I want it to survive the simplification. It must also mark honestly
  which steps are judgment calls dressed up as procedure, and it must hand off to
  a human at the places where the question is one of values rather than facts — above
  all, whether the worst case is tolerable, which no theorem answers.


  Then run the procedure on three proposals, chosen to stress it:


  1. A two-week A/B test of a redesigned checkout before rolling it to all users,
  where the cost of the test is a slower rollout and a small conversion hit on the
  control branch.

  2. A six-figure customer research study before a rebrand that senior leadership
  has already all but committed to, where I suspect the study is wanted as cover rather
  than as input.

  3. A load test against production infrastructure two weeks before peak season, where
  the information gathering itself carries a risk of an outage, i.e., the act of finding
  out changes the thing you''re finding out about.


  Case 2 in particular I expect the procedure to answer "don''t run it" or "run only
  a stripped-down version," which is an answer I will not enjoy relaying, so tell
  me also how to distinguish "the information has no value because no result would
  change the decision" from "the information has no value because the decision has
  already been made and the study is theater" — the first is a fact about the decision,
  the second is a fact about my organization, and I need the procedure to be honest
  about which one it can detect.


  Finally, say what the procedure cannot do: where it will misfire, what it does about
  numbers nobody has (our PMs will not produce priors, and any procedure that demands
  them will be ignored), and where the value-of-information framework is the wrong
  lens entirely — I''m told there are cases where more information is harmful even
  used perfectly, and I''d like to know whether my weekly queue is likely to contain
  any.


