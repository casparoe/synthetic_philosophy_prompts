  \ where plausible answer is 3/8 via a certain rule). Hmm, I should be careful about\
  \ exact numbers — better to state her verdicts qualitatively or give numbers I can\
  \ compute correctly.\n\nLet me define a concrete Judy Benjamin variant: territories\
