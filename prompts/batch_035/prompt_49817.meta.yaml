reasoning_summary: "Pick a domain and type. Good combo: \"Judy Benjamin problem and\
  \ updating on conditionals\" with the verdict-prediction type — a friend's verdicts\
  \ on probability puzzles, predicting on a new conditional-updating case. That's\
  \ nicely in the weeds. Or Goodhart's law with verdict-prediction: a friend's verdicts\
  \ on specification gaming cases, predict on new cases. Or grandfather paradox with\
  \ open-questions type.\n\nJudy Benjamin + verdict prediction is excellent: earlier\
  \ verdicts on conditional probability cases ( Judy Benjamin, Monty Hall-like, sleeping\
  \ beauty variants?) jointly consistent with multiple rules (e.g., \"conditionalize\
  \ only if evidence is a statement; otherwise Jeffrey update\", Stalnaker conditional\
  \ vs material conditional update, principle of indifference over possible worlds,\
  \ imaging vs conditionalization). The new case: a conditional with a false or uncertain\
  \ antecedent, or \"if the coin lands heads, it's raining\" style, or van Fraassen's\
  \ defective engine. Actually the natural counterpart: Judy Benjamin is the classic\
  \ case; there's also the \"Sherlock Holmes\"/ \"learning a conditional\" literature.\
  \ Candidate rules: Jeffrey conditioning / Adams conditioning on conditionals; treating\
  \ conditional as material implication and conditioning on the corresponding disjunction;\
  \ imaging (Lewis); the \"Stalnaker\" conditional approach by van Fraassen. But the\
  \ instructions say avoid super niche things LLMs won't have memorized — Judy Benjamin\
  \ is listed as a domain so it's fair game; imaging and Jeffrey conditioning are\
  \ moderately known. To be safe, inject the niche ideas into the prompt itself: describe\
  \ the rules via the friend's verdicts, not name-dropping heavy theory.\n\nDesign:\
  \ A friend has verdicts on probability puzzles:\n- Sleeping Beauty? no, keep focused\
  \ on conditionals.\n- Judy Benjamin case proper: radar says \"if you're in Blue\
  \ territory, you're 3x as likely to be in Red-Blue as Blue-Blue.\" She updates probability\
  \ of being in Red-Blue from 50% to... some number.\n- Monty Hall: she says switch.\n\
  - A case where she's told a material conditional is true (e.g., \"if the card is\
  \ a king, it's red\" verified true as a material implication because the card isn't\
  \ a king) — she refuses to move at all / she treats it as no information.\n- A case\
  \ where she's told \"if you roll a six, the die will be re-rolled and it's fair\"\
  \ — trivial antecedent.\n- A case where she updates on a conditional whose antecedent\
  \ turns out false later.\n\nWe need earlier verdicts jointly consistent with multiple\
  \ rules and new case where they diverge.\n\nCandidate rules:\nR1 (Material/strengthened\
  \ conditioning): to learn \"if A then C,\" condition on A→C (material conditional),\
  \ i.e., condition on ¬A ∨ C.\nR2 (Imaging-style / Adams conditioning): shift probability\
  \ so that A-worlds' mass flows to nearest C-worlds; leaves ¬A probability alone...\
  \ actually imaging on C moves A-world mass to C-worlds; for a conditional it's trickier.\
  \ Alternative R2: Jeffrey-style update on the conditional, treating it as constraining\
  \ P(C|A).\nR3 (No-update on conditionals with nonextreme content / \"ignore conditionals\
  \ unless antecedent confirmed\").\n\nLet me construct verdicts:\n1. Judy Benjamin\
  \ (radar): she shifts P(Red-Blue) upward but by less than conditioning on the material\
  \ conditional would imply (material conditioning gives P(RB)=3/7≈.43 from .5; Jeffrey/Adams\
