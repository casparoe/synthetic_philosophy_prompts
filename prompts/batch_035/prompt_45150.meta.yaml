  ---


  A standard move in game theory and mechanism design: given a game, delete every
  strategy that is strictly dominated — where a strategy counts as dominated even
  if only a mixed strategy dominates it, i.e., some probability mixture over the player''s
  remaining strategies yields a higher expected payoff against every possible play
  by the others; then, in the smaller game, delete whatever has become dominated,
  and iterate until nothing more can be deleted. Textbooks present the survivors as
  the rational choices, and designers go further: an auction or an elicitation scheme
  is certified as safe precisely because iterated deletion terminates in a single
  profile, so "rational" participants are forced to reveal the truth (as in a second-price
  auction, where bidding your true value survives the process).


  Yet the same community plainly refuses the prediction when it is descriptive. In
  the Traveler''s Dilemma — two people independently name a value for a damaged antique
  between $2 and $100; if the values match, both are paid that amount; if they differ,
  both are paid the lower, with a $2 bonus to the lower naming and a $2 penalty to
  the higher — the iterated reasoning unravels to $2/$2, and essentially no one, economist
  or not, expects or advises that outcome. In the "guess two-thirds of the average"
  game played in classrooms, the same unravelling predicts 0, and nobody predicts
  0. But the designer still trusts a dominance-solvable mechanism with untrained participants.


  Reconstruct the implicit theory of the practice... questions:


  1. What epistemic state does iterated deletion presuppose — each round of deletion
  seems to consume one more level of "rationality is mutual knowledge": is common
  knowledge of rationality a strict presupposition of the practice, or merely the
  best available model of it? And in the mixed-dominance case specifically: a strategy
  can be deleted only because a mixture over other strategies beats it, so the practice
  also presupposes that a player can actually implement an exact mixture at no cost,
  with a randomizing device on hand, and with no opponent who profits from detecting
  the randomization. Is that a presupposition about players, about one-shotness, or
  about the idealization of the model?

  2. There is a subtlety about the order of deletions: a strategy can be deleted because
  a mixture containing it as support beats a third strategy; a later round may then
  delete that supporting strategy itself. Does the practice presuppose that earlier
  deletions remain justified — does it treat rationality as transparent, so that "he
  would never play that" transfers through the chain?

  3. The inconsistency: what exactly bridges the gap between prescribing dominance-based
  play inside designed mechanisms and disclaiming it as a prediction of people? Candidate:
  publicity of the rules substitutes for common knowledge of rationality; or concentrated
  incentives and training manufacture rationality; or the designer needs only that
  no participant be confused about their own incentives (first-order), not mutual
