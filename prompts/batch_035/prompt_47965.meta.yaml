  it went, as best as I can reconstruct it:


  (1) Maya opened by saying the gavagai thought experiment shows translation is impossible:
  for all the evidence the linguist can ever collect, "gavagai" might mean rabbit,
  or undetached rabbit part, or a rabbit-stage, or rabbithood manifested. There''s
  a fact about which one it really means, we just can never get at it — like skepticism
  about other minds, but for meanings.


  (2) Dev said that''s the standard misreading: Quine''s point isn''t that the evidence
  underdetermines which manual is right, it''s that there''s no fact of the matter
  for the manuals to be right or wrong about. He said it''s crucial that indeterminacy
  of translation is supposed to be stronger than ordinary scientific underdetermination
  — with rival physics theories, one of them is really true; with rival manuals, neither
  is.


  (3) Maya said that can''t be right, because the native''s utterances are plainly
  true or false. When the native points at a rabbit and says "gavagai," the sentence
  is true if it means lo, a rabbit and false if it means lo, an undetached rabbit
  part — one of them has to be right, so there''s a fact.


  (4) Dev answered that Maya is sliding between sentences and terms: whole observation
  sentences and their stimulus meanings are fixed by the behavioral evidence, and
  any acceptable manual will preserve assent and dissent across the board; what varies
  is the reference of the terms, which only shows up when you ask identity questions.
  If you ask the native whether this gavagai is the same as that one, you''re asking
  via your own English word "same," which already builds in your analytical hypotheses
  about what a gavagai is. Truth is invariant across manuals, reference isn''t.


  (5) Maya said the thesis then proves too much: if radical translation is indeterminate,
  then so is everything within English, including my own idiolect. Nothing stops me
  from "meaning" undetached rabbit part by my word "rabbit." So my own occurrent thoughts
  have no determinate content, and — the part she really pressed — Quine''s own thesis,
  being stated in language, inherits that indeterminacy, so it''s not even a definite
  claim we could evaluate.


  (6) Dev more or less bit that bullet: he said that''s just the ontological relativity
  line — reference isn''t a relation a term bears absolutely, only relative to a background
  theory or language, and giving up the absolute notion isn''t skepticism, it''s refusing
  to take seriously a distinction that does no work. He said Quine is entitled to
  state his thesis within his own theory, and that the self-refutation charge confuses
  "no absolute fact" with "no fact at all." Maya''s comeback was that Dev can believe
  his own coffee mug talk is referentially up for grabs, but she knows what she means,
