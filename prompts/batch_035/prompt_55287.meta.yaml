  I serve on the ethics committee of a mid-sized hospital, and since our state''s
  medical aid-in-dying statute took effect this spring I have been asked to run the
  orientation session for our palliative care volunteers — the people who sit with
  patients, not the clinicians. The statute follows the familiar model: eligible only
  for adults with a terminal prognosis measured in months, deemed mentally capable,
  who must self-administer the prescribed medication after a waiting period, with
  clinicians free to opt out. The volunteers will get the legal mechanics elsewhere;
  what I have been asked to convey, in under an hour, is the conceptual scaffolding
  underneath those mechanics, so that when a patient asks one of them whether withdrawing
  the feeding tube would be "the same thing," the volunteer understands what is and
  isn''t being asked.


  Please plan the session rather than explain the ideas to me — I know the doctrines;
  I don''t yet know their teaching order. Specifically: (1) the sequence in which
  the core pieces should be introduced — killing versus letting die, the intending/foreseeing
  distinction as it licenses escalating palliative sedation, the requirement of self-administration
  as the statute''s hinge, the prognosis gate — and what depends on what, since my
  instinct is that self-administration cannot be motivated until the first two are
  in place, but I may have the dependency wrong. (2) The one patient case that should
  carry the whole session: I want it to be someone whose pain is controlled but who
  finds her deterioration unbearable, because that forces apart pain from suffering
  and autonomy from mercy — tell me whether that case can bear the weight or what
  it must have and lack. (3) The misconceptions the volunteers will bring or form,
  in the order they will surface — my guesses are that double effect will be heard
  as a loophole that makes terminal sedation equivalent to euthanasia, that the statute
  will be taken to have settled the underlying ethics rather than navigated it, and
  that the six-month prognosis will be seen as arbitrary discrimination against the
  chronically ill rather than a principled boundary — and exactly where in the sequence
  each should be headed off. (4) One question I can pose at the end whose answer would
  show the distinctions have actually been internalized rather than memorized. And
  (5) what I should openly decline to cover at this level — I assume the metaphysics
  of intention and the comparative international evidence, but I am open to persuasion.


