  Scenario: Three-member tenure committee. Candidates must satisfy (a) research excellence,
  (b) teaching competence, (c) service record. Majority rule on each premise, then
  conjunctive conclusion. Committee members: A says yes/yes/no; B says yes/no/yes;
  C says no/yes/yes. Each premise passes 2-1, so candidate gets tenure — but each
  member individually voted against tenure overall (each thinks the candidate fails
  at least one criterion). One member insists this is fine: the committee''s views
  are the premise votes; the other says it''s paradoxical: the candidate got tenure
  though no one on the committee wanted that outcome... wait, actually each member
  thinks the candidate fails a criterion, so under premise-wise aggregation the conclusion
  follows but no individual''s complete judgment set supports it.


  Rounds of argument:

  1. Member 1 (pro premise-based aggregation): voting on the conclusion directly is
  a black box; premise voting respects the reasons; each voter''s individual judgment
  is inconsistent with the outcome, but the group is entitled to its own reasons.

  2. Member 2: this is oligarchic nonsense — the group decision contradicts every
  member''s all-things-considered view; how can a committee decide what none of its
  members decided? The "group" is a fiction.

  3. Member 1: but if we vote on the conclusion directly, we lose the reasons; also
  the conclusion vote can be gamed depending on who controls the agenda (sequencing
  issues, or the chairman deciding which proposition gets voted first and dropping
  whichever loses — the ostensive agenda paradox / distributed dictatorship). Also
  points toArrow analogies: oligarchy (unanimity for rejection) is the only aggregation
  rule satisfying some conditions — the judgment aggregation impossibility results
  (List-Pettit). Hmm, but the adjudicator needs to know that; it''s fine — well-known
  enough? Judgment aggregation impossibility theorems are moderately known. Keep it
  accessible: the prompt can have the character allude to it loosely ("he''d read
  that no aggregation method avoids all such problems").


  4. Member 2 counters: the conjunctive decision rule is itself a choice — the department
