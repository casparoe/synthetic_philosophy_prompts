  the candidate would be denied tenure 0-3, and the chairman effectively chooses the
  outcome by choosing the order/procedure — so the "reasons-respecting" method just
  relocates the arbitrariness.


  Maybe add round: Member 1 says the practical fix is deliberation, not different
