  I am a novelist, and my current project is narrated in the first person by a woman
  in her sixties who underwent a complete section of the corpus callosum in early
  adulthood, in the era when that operation was still performed for intractable epilepsy.
  I want a single scene in which the reader, sharing the narrator''s point of view,
  cannot settle whether she is one person or two — and I want that uncertainty earned
  by the neurology rather than manufactured by vagueness of prose. Before I write
  it, I need to know whether such a scene can even be coherently specified, and I
  would like you to build the test case for me.


  Construct a thought experiment to the following specifications:


  1. The mechanics must be drawn only from what split-brain research has actually
  documented: information presented to one visual hemifield reaching only the opposite
  hemisphere, the two hands acting on independent instructions and occasionally at
  cross purposes, the left hemisphere''s habit of constructing a coherent account
  of behavior whose true cause it never saw, and so on. No invented machines, no mind-reading,
  nothing beyond ordinary domestic life.


  2. The scene must be domestic rather than experimental — the patient alone or with
  her husband in her kitchen, the disconnection doing its work through the ordinary
  arrangement of the room, someone standing to one side, an object entering one hemifield.
  But the underlying machinery must be the laboratory-documented kind; the home setting
  is a transfer, not a fairy tale.


  3. In the scenario, the verbal left hemisphere and the acting right hemisphere must
  each generate a coherent but incompatible reading of the same action, and neither
  reading may be an obvious confabulation. The tension must not consist in the left
  hemisphere telling a transparently self-serving story; both interpretations must
  be reasonable, such that a well-informed observer could hold either.


  4. Then walk through the readings: the view that the operation left literally two
  streams of experience in one body; the view that there remains one subject whose
  access to her own mental life has been degraded; and, if you can make it interesting,
  the view that counting subjects is a question about concepts rather than about the
  patient, and that nothing in the case could settle it either way. For each, say
  what it says about the action in your scenario.


  5. Tell me which feature of the case is doing the work — the one you would have
  to remove for the scene to collapse into the familiar disunity everyone experiences
  when acting against one''s own better judgment — and what a defender of the single-subject
  view would say to attack the case.


  6. Finally, address the question I actually care about: does a first-person narration
  of such a patient take a side? If the narrator''s prose is fluent, grammatical,
  self-reflective, it is presumably voiced by the left hemisphere — so is the right
  hemisphere, in my novel, an unspeaking character, or a silent co-author, or nobody?
  Explain what is at stake in that choice, and what it would mean for the sentence
  "I did it."


