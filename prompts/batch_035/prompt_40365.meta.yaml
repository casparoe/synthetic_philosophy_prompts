reasoning_summary: 'Let me pick a domain and type. Domain: Goodhart''s law and specification
  gaming. Type: verdicts on cases and ask what principle captures them. Journalist
  perspective, casual, maybe a typo.


  Cases of Goodhart/specification gaming: well-known examples — cobra effect (Delhi
  cobras, though apocryphal), nail factories in Soviet Union (tonnage vs weight-based
  quotas — nails too heavy/few), Soviet glass sheet quota by weight → too thick, hospital
  waiting-list targets in the NHS (A&E four-hour target → patients kept in ambulances),
  YouTube recommender metrics, GDP as target, standardized testing teaching to the
  test (Campbell''s law), rat bounty in colonial Vietnam (Hanoi rat massacre — paid
  per rat tail, people farmed tails/cut tails and released), heights of shrubs, Stack
  Overflow gamification, metrics in journalism — pageviews/clicks (journalist angle!).
  Clickbait is a great one for a science/ideas journalist.


  The journalist covers science and ideas. So their verdicts could be on measurement/evaluation
  regimes they''ve seen: newsroom pageview targets, research grant evaluation by citation
  counts/paper counts, peer review scores, hospital targets, etc.


  Write verdicts with one hard-to-reconcile pair. E.g.:


  - Newsroom: when editors began judging stories by pageviews, listicles and clickbait
  — classic Goodhart.

  - Scientists judged by paper count → salami slicing papers — bad.

  - But: researchers judged by citations — also gaming, but somehow feels less bad
  / partially works?

  - Soviet nail factory — obviously gaming.

  - Hanoi rat tails — obviously gaming.

  - A case where the metric was gamed but he thinks it was fine: e.g., a university
  that made bike commuting the metric and people did it for the prize, but the point
  was just to get bikes used — no underlying goal beyond the metric. So the metric
  WAS the goal. That''s the interesting principled distinction: when the metric is
  constitutive of the goal vs. instrumental proxy. Then a hard case: citation counts
  — not constitutive of scientific progress, yet he feels citation-driven pressure
  has produced some genuinely good popularization? Or: GPA. Or: his own case — he
  writes more readable science stories because editors track "time on page" — gaming
  in a sense, but the "gaming" made stories better.


  Hard pair: (a) teaching to the test is bad even though scores did go up; (b) a newsroom
  where he writes more engaging stories because of click metrics — feels like the
  good version. Or the distinction "when measure becomes target, it ceases to be a
  good measure" — but the asker has verdicts where the measure became a target and
  stayed good.


  Cases list:

  1. Soviet nail factory — plan in weight → huge nails; gaming, bad.

  2. Hanoi rat bounty → tails cut, rats released/farmed — gaming, bad.

  3. Newsroom pageviews → clickbait — gaming, bad.

  4. University bike-to-work challenge counted by swipes → people swiped without biking
  — bad but maybe mild?

  5. Peer review/open access: journals judged by impact factor → citation cartels
  — bad.

  6. BUT: his own outlet started tracking "completed reads" and he started writing
  tighter, shorter intros — gamed the metric, but the outcome was better, he thinks
  this was fine. Is it even Goodhart''s law? Or is the metric closer to the goal?

  7. A case he''s torn on: schools judged by test scores in basic literacy — teaching
  to the test, but if the test basically measures the thing you want, is it gaming
  at all? Or GDP — governments chasing GDP, he thinks it''s bad, but is it the same
  structure as his completed-reads case?


  Hard-to-reconcile: he thinks teaching-to-the-test is bad when the test is "basically
