  Draft:


  "I spend alot of my time reporting on people who measure things, so I''ve been trying
  to work out what I actually believe about Goodhart''s law — the idea that once a
  measure becomes a target people start optimizing for the measure instead of the
  thing it measured. Here are my gut verdicts, from cases I''ve either covered or
