  first reaction as a physicist was that this was obviously nuts — if your derivation
  of ocean heat transport assumed the ocean was a bathtub, no one would care that
  it fit three data points. But the more I read the responses to it, the more I think
  the debate never actually got settled, it just got more sophisticated vocabulary.


  Now: I have maybe ten good working years left, a decent pension, a physics background,
  no economics training beyond reading, and I want to spend a chunk of it writing
  seriously about idealization in science rather than just being an opinionated old
  man. So which open questions in this area are actually worth those years, and in
  what order? I''m less interested in a syllabus than in the reasoning: for each question,
  why it''s more worth working on than the others, whether a physicist-turned-philosopher
  is even the right person to work on it or whether it needs someone trained differently,
