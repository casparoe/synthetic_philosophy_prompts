  even when the idealized version couldn''t predict anything quantitatively. Is "when
  can a knowingly false model explain a real phenomenon" a live open question, or
  did someone settle it while I was debugging code? And I gather there''s a distinction
  people draw between different kinds of false assumptions — the ones where you assume
