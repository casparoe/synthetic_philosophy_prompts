  themselves. Each round: Bureau picks a world-sketch (assignment of creatures to
  circumstances), and to evaluate it they must state, for each creature, what that
  creature would do. Creatures then act — and they are instructed that they may freely
  do anything not inconsistent with their goal cards. Payoff: Bureau scores based
  on whether the stated counterfactuals come true AND the welfare target is met. So
  the Bureau faces the problem: they need settled "would" statements to plan, but
  creatures retain freedom to falsify them. The debrief: the Bureau''s felt need for
  settled counterfactuals = the motivation for middle knowledge; the creatures'' ability
