  would creature X do in C?", nothing on the table determines an answer, yet they
  need one; and (c) the would/might collapse.


  Design specifics:

  - Setting: upper-level undergrad seminar on divine providence / philosophy of religion,
  12 students, 80 minutes.

  - Roles: 3 students are the "Design Bureau" (God''s planning staff); 8-9 are free
