reasoning_summary: 'Let me pick a domain and type. Domain: "The species problem" with
  Type 2 (verdicts on cases, ask what principle captures them). That fits well: I
  give verdicts on whether two populations are the same species, under various criteria
  (biological species concept, phylogenetic, morphological, ring species, etc.), and
  ask what principle captures them.


  Perspective: just had a long argument with a friend. Casual, a typo or two, request
  British English.


  Cases: e.g. lions and tigers (interbreed in captivity, produce ligers — not in nature);
  ring species (gulls/herring gull complex); dogs (huge morphological variation, one
  species); Ensatina salamanders ring species; Neanderthals and humans (interbred,
  some DNA in modern humans); domestic wheat polyploidy; asexual organisms (bdelloid
  rotifers — no biological species concept applies); chimps and bonobos; wolves and
  dogs (interbreed naturally). Include a hard-to-reconcile pair.


  Maybe Type 2 with a tentative principle: "same species if they''d interbreed in
  the wild" — test it against cases.


  Let me design: asker gives gut verdicts:

  - Great danes and chihuahuas: same species (verdict)

  - Lions and tigers: different species (verdict)

  - Herring gulls: neighbouring gulls around the ring interbreed, but ends overlap
  in Europe without interbreeding — verdict: same species going round the ring, but
  the ends are different species? Tension.

  - Neanderthals and humans: verdict on fence — hard case.

  - Bdelloid rotifers (asexual, no interbreeding at all): still grouped into species
  somehow; verdict: they''re still species.

  - Ring species is the classic hard case.


  Hard-to-reconcile pair: great dane/chihuahua (same species despite no natural interbreeding
  due to size — actually they can interbreed with help; physically impossible unaided
  perhaps) vs lions/tigers (different species though they can interbreed producing
  fertile female ligers). So the interbreeding criterion alone fails both directions.
  Good.


  Also Ensatina salamanders in California: ring around the central valley, ends meet
  and don''t interbreed, but each neighbour interbreeds. Include as case.


  Keep no need for web search — avoid specific attributions requiring verification.
  The Ensatina case is well-known; I can mention it generically as "the salamanders
  round the Central Valley in California". That''s fine, widely memorized.


  Write casually with a typo or two ("definately", "intergrated"). Request British
  English.


  Draft:


  "My friend and I spent like two hours last night arguing about what a species even
  is, and I ended up just listing my gut verdicts, which he claimed don''t hang together.
  So I want to know if there''s a principle that captures them.


  Here''s my list. Great danes and chihuahuas are obviously the same species even
  though... lions and tigers different species even though ligers exist... wolves
  and coyotes: I say different species, even though they interbreed like crazy in
  the wild... hmm actually that''s a good one — red wolves. Maybe keep it as: I keep
  going back and forth.


  Asexual rotifers: every bdelloid rotifer is a female clone line, no sex at all,
  yet biologists do sort them into species and I think that''s fine — verdict: they''re
  species.


  Neanderthals and us: interbred, most of us carry a few percent of their DNA; my
  verdict: same species? or different? Hmm. I lean same species but my friend says
  that makes ''sapiens'' sloppy. Maybe: I want to say same species, but then...


  Ring species: gulls round the Arctic — neighbouring populations interbreed, but
  where the ring closes the two ends don''t. My verdict: as you go round, neighbours
  are the same species, but I also want to say the ends are different species, and
  my friend says I can''t have both. That''s the tension that forces the choice.


  Also a possible tentative principle offered by asker: "same species iff they''d
  interbreed freely in the wild and produce fertile offspring". Ask for it to be tested
  and repaired, and to state what it says on a new case: e.g. polar bears and brown
  bears (grizzlies, pizzlies) — known to interbreed in the wild; asker hasn''t listed
