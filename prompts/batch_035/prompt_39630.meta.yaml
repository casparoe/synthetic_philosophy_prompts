  ---


  I''m a PhD student in HPS writing on the units of selection, and I''ve constructed
  an argument I now distrust because it seems to prove far too much. I''d like a diagnosis:
  which step to reject, and what rejecting it costs.


  The argument, which I''ll call the "always-genes" argument:


  (1) Level L is a unit of selection in an episode iff (i) there is variation among
  entities at L, (ii) offspring at L resemble parents at L (heritability at L), and
  (iii) this variation causes differences in reproductive success among entities at
  L, thereby changing the population''s composition. — This is essentially Lewontin''s
  trio generalized to arbitrary levels.


  (2) In any episode of natural selection at all, alleles vary; alleles are copied
  to offspring with high fidelity (heritability at the genic level); and alleles differ
  in replication rates, with the change in allele frequencies just being the evolutionary
  change. So the gene satisfies the definition whenever selection occurs.


  (3) In any episode, the causal story can also be told at the genic level: allele
  A spread because its phenotypic effects, in that environment, disposed its bearers
  to outreproduce the bearers of a, and hence disposed A to out-replicate a.


  (4) If a level satisfies the definition in every episode, then selection is really
  at that level, and talk of selection at other levels is a bookkeeping shorthand.


  (5) So in every episode selection is really at the genic level; organism- and group-level
  "selection" is derivative.


  Then the overgeneration:


  (6) Run the same schema with "organism" in place of "gene." Organisms vary; offspring
  organisms resemble parents; and in every episode, differences in organismic traits
  cause differences in organismic reproduction, changing composition. So (4) yields:
  selection is really at the organism level in every episode.


  (7) Wherever there is population structure and assortment, run it with "group":
  groups vary, daughter groups resemble founder groups, and group-level differences
  cause differential proliferation of groups. So wherever groups are structured at
  all, selection is really at the group level.


  (8) A schema that certifies every level as the real one thereby certifies none;
  "What is the unit of selection?" would have only trivial answers. But the debate
  is not trivial — whether, say, a honeybee colony or a trait group is a unit bears
  on what causal explanations of adaptation are available, not merely on how we record
  them. So the argument proves too much and must fail somewhere.


