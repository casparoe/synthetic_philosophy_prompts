  permitted but is the uniquely rational procedure in exact ties.

  (6) We almost never know whether our options are exactly equal or merely nearly
  equal: our preferences are coarse-grained, and our introspection of them unreliable.

  (7) If we cannot detect any difference between two options, we should treat them
