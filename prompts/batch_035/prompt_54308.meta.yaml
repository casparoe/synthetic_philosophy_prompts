  matters.

  (2) When two options are exactly equal in every respect that matters, no reason
  can settle the choice between them.

  (3) So in cases of exact equality, nothing you do can be chosen rationally; picking
  one option is arbitrary.

  (4) An arbitrary movement is not a choice, so rational agents simply cannot choose
  between exactly equal options — hence the starving ass.

  (5) The best an agent can do in such a case is randomise (say, by flipping a coin):
