  I believe:


  1. Orthogonality: intelligence and goals are independent — you can have any level
  of capability combined with any goal, so nothing about being super smart makes a
  system want good things.

  2. Instrumental convergence: whatever the final goal, a capable enough agent will
  seek resources, self-improvement, and avoiding being shut off, because those help
