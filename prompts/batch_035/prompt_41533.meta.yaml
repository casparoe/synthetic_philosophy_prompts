  3. I''m fairly relaxed about doom, partly because I think a system that genuinely
  understood ethics — really understood it, the way a wise person does — wouldn''t
  do the terrible things. Depth of understanding pulls toward decent goals.

  4. I''ve argued in print that the RLHF / fine-tuning work labs do shows goals are
  pretty malleable, so we can just steer models toward wanting the right things as
  they get more capable. This is why I find the doomers overwrought.

  5. I also think current LLMs already have goals in a real sense — "stochastic parrot"
  talk undersells them — and that what we learn about today''s models'' motivations
  tells us something about future ones.


  Are these consistent? Check each pair, tell me which tensions are real and which
  dissolve, and say what the cheapest fix would be for each. I''d rather know before
  the panel than during it.


