  ---


  I''m a software engineer with no philosophy background, and at work a handful of
  us run a fortnightly lunch discussion that has drifted from distributed systems
  into philosophy of mind. I''ve volunteered to lead a thirty-minute session on the
  meta-problem of consciousness — Chalmers''s idea that instead of explaining consciousness,
  we should explain why we make the reports and judgments we do about consciousness:
  why we judge that there''s "something it is like," why mechanistic explanations
  of it seem impossible even in principle, why the intuitions survive being explained
  at. Don''t write me the explanation; plan the session.


  A few constraints and worries:


  My instinct is to open with an analogy from our world — something like a service
  that can emit rich reports about its own states but has no access to its own implementation,
  so the reports are sincere, structured, and blind to their own causes. But I suspect
  this analogy smuggles in a conclusion (that the blindness is all there is), and
  I''d rather the group reach the key move themselves than be led to it by a rigged
  example. Tell me whether to use it, and if not, what should carry the session instead.


  The key move, as I understand it, is the flip: the group has to see the hard problem
  first — specifically that it feels different in kind from other unsolved problems
  — and only then see that this very feeling can be treated as data. If they never
  feel the gap, the meta-problem question won''t make sense; if they only feel the
  gap, they''ll think the meta-problem is a way of changing the subject. Getting that
  sequence right is what I most need from you.


  The room will be a mix: some will arrive saying consciousness is obviously just
  information processing, others that it''s obviously not, and both camps will think
  the meta-problem is either trivial ("you explain the reports the way you explain
  any behavior") or a betrayal ("you''ve given up on explaining the real thing").
  Map the misconceptions I should expect, in the order they''ll arrive, and say where
  in the session each should be absorbed.


  Please structure your reply in these sections, in this order: "Session arc" — the
  sequence of ideas with what depends on what, roughly 300 words; "The carrying example"
