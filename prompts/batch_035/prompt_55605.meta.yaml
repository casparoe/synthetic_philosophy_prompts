  I''m a software engineer with no formal training in philosophy. At work, a few of
  us keep a fortnightly lunch slot that has drifted from systems design into philosophy
  of mind, and I''ve been assigned the meta-problem of consciousness for the next
  session — thirty minutes, a whiteboard, and an audience of engineers who have read
  a popular book or two at most. By the meta-problem I mean the move where, instead
  of asking what consciousness is, you ask why we talk and judge about it the way
  we do: why we insist there is something it is like to be us, why a mechanistic story
  seems incapable in principle of capturing that, why the intuition doesn''t die when
  the mechanisms are described. Chalmers''s paper calls the outputs of all that judging
  "problem-reports," and I gather he classifies explaining them as an easy problem
  — which is exactly the part my group will find either trivial or scandalous. I''m
  not asking you to explain any of this to me. I''m asking for the plan of the session.


  Two things I want your judgment on. First, the order. My group has to be made to
  feel the hardness of the hard problem before the meta-question will even register
  — otherwise it looks like a category mistake — but if they wallow in the hard problem
  too long, the flip to treating their own bafflement as data will feel like a dodge.
  Where''s the pivot, and what has to be established on either side of it? Second,
  my stock example. I keep wanting to open with something from our world: a service
  that can produce fluent reports about its own states while having no access to its
  own implementation, so that the reports are sincere, internally consistent, and
  incurably blind to their causes. It plays well in this room, but I half suspect
  it''s rigged — it builds in the answer that the blindness is the whole story, and
  I''d rather the group earn that conclusion than have it smuggled to them. Should
  I use it, repair it, or replace it, and with what?


  I''d like your reply in named sections, in this order: "Session arc" (the sequence
  of ideas, what depends on what, and the pivot — about 300 words); "The carrying
  example" (your verdict on my analogy and what a replacement must contain and avoid
  — about 150 words); "Misconception map" (the errors this audience will form, in
  the order they''ll surface, each with the point in the arc where it should be absorbed
  — about 250 words); "What to leave out" (and a line on why — about 100 words); and
  "The closing check" (a single question whose correct answer would show they''ve
  separated explaining the phenomenon from explaining the reports — about 80 words).


