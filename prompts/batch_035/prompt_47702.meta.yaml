  Domain: underdetermination of theory by evidence. Type: report one''s verdicts on
  a set of cases and ask what principle captures them.


  Cases could include:

  - Curvature of space: Euclidean vs non-Euclidean with universal expansion (Reichenbach''s
  example) — a classic but reasonably known.

  - Constructive empiricism / van Fraassen.

  - Newton''s gravity vs action-at-a-distance alternatives with evidence-equivalent
  rivals.

  - A constructed case: two pharmacological theories differing only on an unobservable
  mechanism.

  - The person''s verdicts: some pairs of empirically equivalent theories they think
  are genuine rivals (unreal but possible), others they think are mere notational
  variants or "same theory differently described."

  - Hard to reconcile pair: e.g., they think the Reichenbach geometry case shows underdetermination
  is trivially true but uninteresting ("just a redescription"), yet they think the
  duhem-Quine case (auxiliary hypotheses) is real and worrying. Or: they think two
  theories that are empirically equivalent by all possible evidence are really just
  one theory (so underdetermination is false), yet they think the many-worlds vs collapse
  interpretations of QM are genuinely rival theories even though empirically equivalent.

  - Also could include a case about a theory that posits an unobservable that makes
  no empirical difference but seems simpler/explanatory.


  So the asker''s verdicts:

  1. Reichenbach''s universal force distorting geometry: not a genuine rival, just
  the same theory described differently — verdict: no real underdetermination.

  2. Many-worlds vs Copenhagen: genuine rivals despite empirical equivalence — underdetermination
  real.

  3. Phlogiston vs oxygen? Not empirically equivalent, so not relevant.

  4. Constructed case: two cosmological theories, one says the universe doubled in
  size last Thursday along with everything in it (also memory), empirically equivalent;
  verdict: not a genuine rival / not a theory at all?

  5. A case where two theories are equivalent given all actual evidence but one makes
  a further prediction — that''s not underdetermination, that''s just current evidence;
  fine.

  6. Verdict on "no miracles" / inference to best explanation: they think scientists
  are entitled to pick the simpler of two empirically equivalent theories, but they
  also feel uneasy about counting simplicity as evidence.

  7. Hard-to-reconcile pair: they treat geometric redescription as no-rival but treat
