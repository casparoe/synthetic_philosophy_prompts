  humans with microcephaly, corvids with tiny brains but smart, AI with no brain at
  all).


  Write in first person, formal, one to three paragraphs, elaborate. Give concrete
  cases with verdicts, including one hard-to-reconcile pair. Ask for a principle,
  its predictions on unconsidered cases, and which verdicts must go.


  No quotes from memory needed. No search needed. Write from knowledge — encephalization
  quotient, dolphins, sperm whales, corvids, microcephalic children, bees, elephants,
  AI.


  Let me draft.


  Cases and verdicts:

  1. A human born with microcephaly, brain one-third size — full moral status. Verdict:
  firm.

  2. A sperm whale with brain six times human size — some elevated moral status but
  not more than the human. Verdict: whale''s greater brain size doesn''t buy more
  status than a human''s.

  3. Corvid with walnut-sized brain showing flexible planning — moral status at least
