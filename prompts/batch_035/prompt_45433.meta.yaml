  5. A dolphin — larger raw brain than human but partly for echolocation processing...
  dolphin status below human but high. Hard pair: whale brain bigger than human''s
  yet verdict that humans have higher status — but also verdict that a hypothetical
  being with much larger, proportionally scaled brain (bigger everything) would have
  higher status.

  6. Difficult case: a person whose brain we could enlarge... or a hypothetical person
  with double the neurons via mini-columns (like some claims about Einstein''s cortex).
  Or: identical twins where one''s brain is 15% larger due to benign variant — no
  status difference. But across species the same size difference matters. Hard to
  reconcile: size matters across species but not within.


  Also the retired scientist angle: "I spent thirty-five years measuring cortical
