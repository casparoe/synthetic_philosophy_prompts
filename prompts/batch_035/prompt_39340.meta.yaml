  ---


  I witnessed an argument between two friends last weekend, and after driving one
  of them home I ended up arguing about it with him for another hour. I''d like a
  professional philosopher who works on the ethics of consent to adjudicate it for
  me, move by move. Please think carefully before committing to verdicts — you might
  start by laying out for yourself what makes consent valid or invalid — and please
  write in American English.


  The case: my friend Nadia consented to a preventive cardiac procedure after her
  cardiologist told her it would cut her risk of a stroke in half. She later learned
  that her absolute ten-year risk was 2%, so the procedure moved it to 1%, and she
  now feels her consent wasn''t real. I wasn''t party to the original argument, which
  unfolded between my friends Sam and Elena roughly as follows.


  (1) Sam said her consent was invalid: the relative framing was deception by design,
  since consent to a risk requires understanding the risk, and the doctor chose the
  framing knowing it would loom larger in her mind than the absolute numbers warrant.

  (2) Elena replied that every true statement comes framed somehow; nobody consents
  against a background of complete information, patients rightly lean on a trusted
  expert''s recommendation, and by Sam''s standard virtually no medical consent would
  be valid.

  (3) Sam said that was a point in his favor: much of what passes for informed consent
  is pro forma, and the standard shouldn''t be bare disclosure but actual understanding,
  which the doctor knowingly bypassed.

  (4) Elena then shifted ground: Nadia was in pain, frightened, and had been told
  the decision couldn''t wait a week, so even flawless statistics wouldn''t have made
  her consent uncoerced — fear and time pressure do more to undermine consent than
  any framing, so Sam is blaming the wrong thing.

  (5) Sam answered that we should distinguish the background condition (her illness,
  the urgency) from the avoidable manipulation (the framing): the former no one chose,
  the latter the doctor did, and an avoidable choice that predictably distorts understanding
  is exactly what the invalidity should turn on.


  Please rate each of the five moves from clearly mistaken to clearly right, with
  brief justification; then say who is more right overall; then address what both
  of them seem to be missing — in particular, whether the validity of Nadia''s consent
  turns on deception, coercion, competence, or some interaction among them, and what
  that implies for how we should think about consent in high-pressure medical settings
  generally.


