  1. "Hume held money is completely neutral — a pure veil" — actually Hume held it
  neutral in the long run but stimulating in the interval ("in the interval" bolded
  by Hume himself). A popularizer saying "Hume thought money changes nothing real,
  ever" overstates.

  2. Conflating Hume''s specie-flow argument with a claim that Hume advocated returning
  to barter or thought banks were useless — Hume actually approved of paper credit
  in moderation ("Of the Balance of Trade" discusses banks).

  3. Claiming Hume was a doctrinaire free trader wanting zero tariffs — Hume favored
  low but nonzero duties (he praised moderate taxes in "Of Taxes," defended some protection
  in "Of the Balance of Trade" for luxury taxes?). Actually Hume favored "low and
  proportionate" duties; he wasn''t absolutist.

  4. Claiming Hume "proved" the quantity theory, or that his thought experiment (the
  overnight doubling of money in every pocket from "Of Money" — actually his example
  is: overnight every person in Britain gains five pounds, or "if the coin were checked"
  — the real example is that if you overnight double money... Actually Hume''s example:
  "Suppose... that by miracle every man in Great Britain should have five pounds slipped
  into his pocket in one night" — I can paraphrase without quoting).

  5. Claiming the specie-flow mechanism implies prices move first and money follows
  — actually it''s money inflows raise prices, then trade deficit drains specie.


