  ---


  I would like a careful comparison of two ways of responding to Newton''s bucket
  experiment: Newton''s own conclusion that rotation must be rotation with respect
  to absolute space, and the relational alternative descending from Mach, according
  to which the water in the bucket rotates relative to the distant masses of the universe
  rather than to space itself.


  There is a subtlety I want you to take seriously rather than brushing aside. A common
  textbook rendering says the bucket shows rotation is absolute, ergo absolute space
  exists. But the experiment, described carefully, seems to establish something weaker:
  only that the water''s state of motion cannot be constituted by its motion relative
  to the bucket — the body immediately surrounding it. This leaves at least three
  options open: (i) rotation relative to absolute space; (ii) rotation relative to
  the total distribution of matter in the universe (the fixed stars), as Mach suggested;
  and (iii) a more austere view on which no body stands in any privileged reference
  relation at all, but acceleration — unlike velocity — is a primitive, irreducible
  feature of the histories of bodies or of their pairwise relations. On this third
  view the bucket''s concave surface reflects the water''s intrinsic acceleration
  history, and nothing about a container called space.


  Please assess: (1) which, if any, of these three options does the bucket experiment
  itself actually favor, as opposed to broader theoretical considerations; (2) whether
  options (i) and (iii) differ in any empirical or metaphysical substance, or merely
  in how much ontology they pack into the word "space"; and (3) whether Mach''s option
  (ii) can be reformulated so it does not depend on the contingent fact that the universe
  happens to contain distant heavy bodies — i.e., whether a Machian has a good answer
  to the question of what would happen to a lone bucket in an otherwise empty universe.


  Where the literature is genuinely divided on any of these points, please mark that
  clearly and present the competing positions as competing positions, rather than
  settling on one and presenting it as the standard view. Where something is settled
