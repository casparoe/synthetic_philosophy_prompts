  ---


  I take part in a long-running online discussion about machine consciousness, and
  one participant keeps ending arguments with the slogan ''conceivable implies possible''.
  His flagship use of it runs as follows: he claims he can clearly conceive of a being
  molecule-for-molecule identical to a human — same brain, same behaviour, uttering
  the same sincere reports about its inner life — yet with no experience whatsoever,
  nothing it is like to be it; and from ''I can conceive that'' plus the slogan he
  concludes that such a being is genuinely possible, and hence that consciousness
  cannot be a physical fact. I don''t want to join either side; I want to know what
  I''m actually being asked to accept.


  Please lay out, as a list I can quote back into the thread, the distinct precise
  theses that ''conceivable implies possible'' could be expressing. In particular,
  separate the candidates along (at least) these lines: what kind of conceivability
  is in play — mere ability to form an image or say the words without immediate contradiction,
  versus a considered judgement that no contradiction is hidden anywhere in the supposition,
  perhaps even under ideal rational reflection by an ideal reasoner; and what kind
  of possibility is promised — logical, metaphysical, or only some weaker modal notion.
  For each reading, say whether it is plausible, whether it is trivial, and, crucially,
  whether it is strong enough to carry his argument: which readings, if any, license
  the leap from ''I can suppose a physical duplicate without experience'' to ''there
  could be one'', and which readings make the slogan true but useless for his conclusion,
  or useful for it but false?


  Finally, tell me which reading he most likely has in mind given the work he wants
  the slogan to do, and what he owes us under that reading — what he would need to
  establish about his own act of conceiving for the inference to go through.


