  Write the prompt: teacher running intro social choice for philosophy/PPE students,
  ~18 students, 75-minute session, want them to feel that strategic misrepresentation
  isn''t a bug of specific voting rules but unavoidable. Include rules, materials,
  payoff scheme (candy/points, no money), rounds: (1) sincere vote under plurality,
  (2) reveal full preference rankings, discover Condorcet winner lost, (3) revote
  with discussion allowed, (4) students design their own rule, (5) attempt to manipulate
  each other''s rules. Debrief maps to G-S: onto non-dictatorship, range of at least
  3, onto-ness, strategy-proofness. Predictable failure modes: students coordinating
