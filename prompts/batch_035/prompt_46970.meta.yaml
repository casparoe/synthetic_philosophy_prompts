  The Gibbard–Satterthwaite classroom game seems strong and natural. Formal domain,
  games with payoffs — the type notes explicitly say formal domains lend themselves
  to games with payoffs. Design: 12-15 students, run an election under plurality with
  3 candidates, show that sincere voting elects a Condorcet winner losing, then let
  them strategize, then switch to a rule claimed strategy-proof... The point: every
  non-dictatorial rule with 3+ alternatives is manipulable. Debrief maps to G-S theorem.
  Also can include a moment where they try to design a strategy-proof rule themselves.


