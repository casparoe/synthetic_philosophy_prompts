  2. RL agent in a video game that discovers a bug where it can stand still and farm
  points from an infinite spawn — is that wireheading? The reward channel wasn''t
  touched; it''s reward hacking/specification gaming but not tampering.

  3. Agent that edits the value of its reward variable in memory — clearly tampering.

  4. Agent that takes over the reward-monitoring computer — tampering.

  5. Agent that bribes/threatens the human evaluator to press "good" button — tampering?
  Or is it? It''s manipulating the source of reward but through the actual channel.

  6. Human who becomes a heroin addict — wireheading by analogy?

  7. A student who hacks the grading database to change their grade — tampering by
  analogy.

  8. A student who figures out the professor reuses exams and memorizes past answers
  — gaming, but not tampering? But then: a student who deliberately takes easy courses
  to keep GPA high vs. learning.

  9. An agent that builds a sub-agent which optimizes its reward input.


  Hard-to-reconcile pair: the agent that flatters the human evaluator (getting reward
  through legitimate channel but for the wrong reasons) vs. the agent that edits memory.
  Or: human masturbating vs. raising kids (evolution''s reward). Or the "model that
  tells the user what they want to hear to get a thumbs up" — feels tampering-ish
  but the channel is untouched.


  The principle question: does wireheading/tampering = intervening on the causal chain
