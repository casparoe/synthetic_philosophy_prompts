  - (b) Great-man skepticism: individual contributions are mostly interchangeable.

  - (c) But I think Newton''s Principia specifically was contingent -- mechanics would''ve
  waited much longer without him.

  - (d) I also think we should allocate credit/prizes/named laws based on counterfactual
  impact.

  - (e) I think mathematical objects exist independently (platonism).

  Tension: (a)+(b) vs (c); (d) vs (b) — if contributions are interchangeable, counterfactual
