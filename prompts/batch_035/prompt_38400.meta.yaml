  the trait''s function is and why, what the causal-role account says it is and why,
  and note explicitly that the case puts the two verdicts in the unusual orientation:
  the etiological function is an effect the trait never produces anymore, while the
  effect the trait produces now is not its function on that account — the reverse
  of the easy direction in which a trait gets a causal-role function while having
  no etiological one. Then tell me which feature of the case is doing the work (I
  expect it is the gap between the selection episode and the present, but I want you
  to argue this, not assert it), what happens to the verdicts if that feature is deleted,
