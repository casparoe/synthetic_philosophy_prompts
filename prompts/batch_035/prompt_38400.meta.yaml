  causal-role accounts (in the line of Cummins, on which a trait''s function is its
  contribution to some capacity of the containing system) fall into two familiar patterns:
  either the accounts disagree about whether there is a function at all, as with novel
  traits that have never been selected for anything, or they disagree about which
  of two effects is "the" function while both effects are still being produced, as
  in the standard exaptation stories. I want a case of the second kind but with a
  twist, and I want it designed to order rather than excavated from the literature.


  Construct a thought experiment meeting the following specifications. First, it should
  concern a single trait of a single species, where the species is fictional but biologically
  plausible — you will need to invent the species and narrate its evolutionary and
  ecological history, and the history must be one of ordinary evolutionary dynamics:
  no genetic engineering, no pathology, no artificial selection by humans, and no
  deus ex machina decreeing that "the function changed." Second, the trait must have
  been selected for producing an effect that it no longer produces at all — the selection
  episode is over, the effect is now absent for a stated ecological reason, and the
  trait must not have become vestigial or idle: it should be active and doing something
  biologically useful. Third, what it now does should be a different effect, one that
  clearly contributes to a capacity of the organism, but one for which the trait was
  never selected — and you must close off the etiological theorist''s usual escape
  route by building into the scenario population-level facts (say, no heritable variation
  in the new effect, or too few generations for selection to have acted on it) that
  prevent the new effect from having been or becoming selected. Fourth, the scenario
  itself must be neutral: it may describe selective histories, causal structures,
  and population facts, but it may not contain the word "function" or otherwise stipulate
  the verdicts — those have to be derived by the theories, not announced by the case.
  Don''t recycle the textbook menagerie (hearts, eyes, wings, feathers, the panda''s
  thumb, sickle-cell).


