  Course context: upper-level seminar on theories of value. The question on the exam
  was:


  "The fitting-attitude (FA) analysis of value holds that for something to be good
  is for it to be fitting (appropriate, called for) to have a pro-attitude toward
  it — to desire it, admire it, or the like. Explain the ''wrong kind of reasons''
  problem for this analysis (illustrate with a case), explain one proposed solution,
  and say whether it works."


  Here is the student''s answer:


  [Student answer text with the errors]


  ---


  Student answer draft:


  "The FA analysis says that x is valuable iff it is fitting to have a pro-attitude
  toward x. The problem is that we can have reasons to hold an attitude that have
  nothing to do with the value of its object. Example: a demon threatens to make your
  life miserable unless you fear him. The threat gives you a reason to fear the demon,
  but not because he''s fearsome in any way — if you came to fear him because of the
  threat, your fear would be unfitting, and likewise the demon would not thereby have
  become more valuable [fine]. These are called ''reasons of the wrong kind'' because
  they are reasons for the attitude as such rather than reasons that concern the object.


  The line of thought goes back to Brentano, who analyzed value in terms of fitting
  emotions, and got its biggest boost from Moore''s open question argument in Principia
  Ethica, which showed that goodness is a non-natural property of being the fitting
  object of pro-attitudes. [MISTAKE B]


  Now, what to do with the wrong-kind reasons? The simplest observation is that the
  demon''s threat, since it makes no reference to anything fearsome about the demon,
  isn''t a reason at all — it''s just a causal pressure on us, like a gun to the head
  makes you hand over your wallet. Reasons have to be considerations that could make
  the attitude fitting; the threat couldn''t, so it''s not a reason, it just moves
  us. Once we see this, the problem mostly dissolves: the FA analysis only ever cared
  about genuine reasons, and the so-called wrong-kind reasons were never in the running.
  [MISTAKE A: conflation of ''no reason of the right kind'' with ''no reason / mere
  cause''; also note it actually undercuts rather than solves — a hasty grader might
  think this is a legitimate ''error theory'' response; actually some philosophers
