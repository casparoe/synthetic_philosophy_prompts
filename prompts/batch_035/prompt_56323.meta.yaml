  (3) So there are only two outcomes on the table: both cooperate or both defect.
  The mixed ones are off the table.

  (4) Both-cooperate pays me $300 and both-defect pays me $100.

  (5) So cooperating is the rational move and defecting is the irrational one, even
  though defecting dominates.


