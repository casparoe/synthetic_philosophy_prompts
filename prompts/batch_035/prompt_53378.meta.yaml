  I''m a PhD student in classics, and I''ve been asked to give the opening remarks
  at a two-day workshop on the biology of aging — the room will be mostly molecular
  biologists and a couple of longevity-biotech founders, plus a scattering of philosophers
  of medicine, and the theme is something like "engineering the aging process out
  of human life." The organizers want a short humanistic opener, five minutes, before
  the keynote, and they asked me because my dissertation is on Ciceronian dialogue.
  My first instinct was to draw on Cicero''s Cato Maior de Senectute — the dialogue
  where Cato the Elder, past eighty, consoles two younger men about old age — but
  the more I think about it, the more I suspect the fit is worse than it looks. Cato''s
  whole project is consolatory: he takes it as fixed that old age will come, that
  the body will fail, and that the task is to show a life remains good inside those
  limits — that the elderly retain a role through counsel and influence rather than
  action, that old age has pleasures that replace rather than merely lack the ones
  that fade, and so on. This room''s premise is precisely the denial of that fixed
  limit. For the biologists, Cato''s serenity might sound like rationalized surrender
  — the respectable face of a condition they intend to treat. Yet I don''t think the
  dialogue is simply the opposition either: Cato also insists that old age must be
  actively resisted, that the mind must be kept at work, that the man who lives within
  a cramped and anxious old age has himself to blame — there''s something in that
  closer to a health-maintenance doctrine than the caricature of serene acceptance.
  And there''s his famous move with Sophocles: when the sons tried to have the old
  poet declared incompetent, Sophocles answered by reading out the tragedy he was
  still writing, which is less consolation than a demonstration of continuing competence
  — an appeal to evidence, in a courtroom.


  Write the five-minute speech. Constraints: it has to work for a mixed audience (one
  or two Latin phrases at most, everything translated; no lecture on the dialogue''s
  structure); it must not condescend to the scientists or imply that trying to extend
  healthy life is hubris; but I also don''t want it to pretend that Cato would have
  been neutral about the workshop''s premise, because the speech is more interesting
  if it puts the tension on the table rather than smoothing it over. My tentative
  plan is to organize it around the Sophocles court scene — treating Cato''s anecdote
  as the first recorded argument for the proposition that capacity is demonstrated
  rather than assumed, and letting the room hear both how far they are from Cato and
  how close his instinct was to theirs — but if you think that framing misreads the
  dialogue, or that it will land as a gimmick to that audience, say so and do something
  else. Please follow the speech with a brief note flagging where it takes liberties
  with Cicero — which readings it leans on that a classicist would contest, and which
  claims about the dialogue''s aims are tendentious. End with a single one-sentence
  summary of the speech''s central claim, as the last line.


