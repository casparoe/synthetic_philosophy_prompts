  Draft argument:


  A friend (call them from my decision theory reading group) argues:


  (1) An intention to A is rational only if, at the moment of action, doing A is rational.

  (2) Tomorrow at noon, drinking the toxin is irrational: it''s painful and yields
  nothing.

  (3) So no fully rational agent can rationally intend tonight to drink the toxin
  tomorrow.

  (4) Therefore no fully rational agent collects the million in Kavka''s setup.

  (5) But nothing is special about the toxin: the structure — you get a payoff at
  t1 for intending at t0 to do something at t2 that is irrational at t2 — appears
  everywhere. Promising your landlord you''ll pay rent on the 1st when you know that
