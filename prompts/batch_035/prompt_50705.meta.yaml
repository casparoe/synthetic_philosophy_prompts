  That''s a rich prompt. Concrete practice pieces:

  - Graduate training explicitly warns against "hindsight bias," "outcome bias," "presentism,"
  "whig history."

  - Yet the discipline''s core genre is the book whose title is "The Origins of X"
  or "The Road to Y" — outcome-driven inquiry.

  - Historians search archives knowing the outcome; their selection of documents is
  shaped by it.

  - Reviewers demand the historian show contingency — "it could have gone otherwise"
  — while also demanding causal rigor.

  - Historians tend to explain actual outcomes by causes that would not have been
  cited had the outcome differed (the "phantom counterfactual" problem).


