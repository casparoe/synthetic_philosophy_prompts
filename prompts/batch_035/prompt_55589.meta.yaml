  Summary text (to be written by me, mostly right with 2-3 subtle errors):


  "Bertrand''s paradox: asked to find the probability that a chord of a circle drawn
  at random is longer than the side of the inscribed equilateral triangle, we get
  three different answers — 1/2, 1/3, 1/4 — depending on how we apply the principle
  of indifference, the classical rule that says to distribute probability uniformly
  when you have no reason to favor one outcome over another. One application makes
  the midpoint of the chord uniform over the disk, another makes the direction of
  one endpoint uniform, and a third makes the chord''s distance from the center uniform
  along a radius. Since the same principle, applied to the same problem, yields three
  contradictory answers, the principle is inconsistent, and Bertrand''s paradox refuted
  classical probability theory: it showed there is no such thing as an uninformative
  prior, and that all probability assignments must ultimately rest on subjective judgment.
  The principle of indifference was accordingly abandoned, surviving only in physics
  as the method of maximum entropy, which Jaynes later proved uniquely determines
  the correct answer to the chord problem by requiring invariance under translations
  and rotations, a solution now generally accepted."


  Errors:

  1. "refuted classical probability theory" / "inconsistent" — overstatement; the
  moral is subtler (description-dependence), and classical/Bayesian statistics continued
  to use indifference/maxent.

