  the other side''s dispositions — because the agent who commits first to a tough
  stance may extract concessions from everyone else, but commitments made blind can
  be catastrophic, and two agents racing each other into mutually destructive commitments
  can end up in a world neither wanted. The standard examples are hypothetical superintelligies
  deciding whether to precommit during a standoff; the humans with a stake...


