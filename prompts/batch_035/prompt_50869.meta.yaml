  a sequence with a chance to renege, the Allais responder seems forced either to
  be dynamically inconsistent or to adopt a "resolute" policy of committing to a plan
  and refusing to re-optimise. Say which you think is more defensible, and what this
  shows about the normative status of independence.


  Reach and defend a verdict: should independence be abandoned as a norm of rationality,
  or should the Allais preferences be explained away as an error — and if the latter,
  explain away, rather than merely explain, why the error is so intuitive?


