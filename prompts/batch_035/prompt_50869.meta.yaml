  Essay prompt draft (formal, British English request):


  ---


  Write an essay, in British English, on the question of what, exactly, the Allais
  paradox refutes — if it refutes anything at all.


  Consider the standard presentation. A person is offered a choice between A: a certain
  payment of £1 million, and B: an 89% chance of £1 million, a 10% chance of £5 million,
  and a 1% chance of nothing; most choose A. Later, the same person is offered A′:
  an 11% chance of £1 million and an 89% chance of nothing, versus B′: a 10% chance
  of £5 million and a 90% chance of nothing; most choose B′. Together these choices
  violate the independence axiom (substitution axiom) of von Neumann–Morgenstern expected
  utility theory, since the two pairs differ only in what happens on the 89% "common
  consequence".


  Your essay should:


  1. Explain precisely which claim the paradox targets: is it the vNM independence
  axiom as a claim about rational preference, or a deeper separability idea — that
  the desirability of what a lottery delivers on one part of the state space should
  not depend on what it delivers elsewhere?


  2. Assess the "redescription" reply, on which the fault lies not in the preferences
  but in the formalism, because it individuates outcomes too coarsely: the £1 million
  received for certain is a different outcome from the £1 million received as part
  of a risky gamble, for someone who cares about regret, disappointment, or the solace
  of certainty. Is this a principled repair of expected utility theory, or does it
  threaten to trivialise the theory (if outcomes may be individuated however we like,
  what could ever count as a counterexample)?


  3. Consider a theory that abandons independence directly — e.g., Buchak''s risk-weighted
  expected utility, which reweights probabilities by a risk function before averaging.
  Does such a theory vindicate the Allais responder, or merely systematise her preferences?
  Explain whether there is a real difference between these two ambitions, and where
  you think the burden of proof lies.


