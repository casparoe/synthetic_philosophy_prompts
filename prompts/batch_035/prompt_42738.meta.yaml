  "I just had a long argument with my friend about Kant on moral worth. Her summary,
  roughly: ''Kant thinks an action has moral worth only if you do it reluctantly —
  the person who returns a lost wallet because honesty feels good gets no moral credit,
  and only the one who does it while wishing she could keep the money acts worthily.
  In fact Kant thinks we should try to get rid of our inclinations entirely, so that
  every good act is done grudgingly, and someone who helps people because she loves
  helping them is no better morally than someone indifferent.'' Is this fair? Which
  parts would a Kantian accept, which are conflations or overstatements, and is her
  conclusion — that on Kant''s view the ideal moral agent is someone who feels nothing
  for anyone — supported by anything Kant actually says?"


  That''s good. Subtle misrepresentations: (1) "only if you do it reluctantly / against
  inclination" conflates acting from duty with acting against inclination — Kant''s
  point is the motive of duty, not reluctance; the person who does it gladly but would
  do it anyway out of duty still counts. (2) "we should get rid of inclinations" overstates
  — Kant thinks inclinations in accordance with duty are fine, even facilitate morality;
  he doesn''t counsel extirpating them (that''s more like a Stoic caricature). (3)
  "no better morally than someone indifferent" — Kant does say actions from immediate
  inclination lack moral worth (in the Groundwork examples), so this part is closer
  to right, though the "wishing she could keep the money" line: for Kant the wallet
  returned dutifully but grudgingly does have moral worth — actually the first sentence
  says only the grudging one acts worthily, which is a standard caricature. Also the
  "reluctantly" bit: the lost wallet example — actually Kant''s example is the honest
  shopkeeper who acts from self-interest, which lacks moral worth; the person who
  returns it from duty has worth whether or not reluctantly. Hmm, the caricature that
  moral worth requires acting against inclination is a well-known one.


