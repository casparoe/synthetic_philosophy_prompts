  Common misrepresentations of Kantian moral worth: conflating "acting from duty"
  with "acting from obligation"; the idea that acting with inclination destroys moral
  worth (Kant: doing the kind thing from inclination may be "as it were" in agreement
  with duty but the moral worth is from duty); the shopkeeper example often mangled.
  A subtle error: the friend''s summary says "a person who enjoys helping has no moral
  worth in their action, and Kant actually thinks we should try to extinguish our
  inclinations so that every dutiful act is done grudgingly." The first part overstates
  (Kant says inclination in agreement with duty is fine and even beautiful, but moral
  worth requires the duty motive — for Kant, actions from mere inclination lack moral
  worth, but that''s about actions, and Kant doesn''t say to extinguish inclinations).
  Also conflating "acting from duty" with "acting reluctantly" or "acting against
  inclination."


  Alternatively domain: "Lewis on convention" — friend summarized Convention as "a
  convention is just whatever people do because everyone else does it, so table manners
  and the fact that we all breathe oxygen are both conventions, and norms can never
  change once established because any deviation would collapse them." Subtle errors:
  Lewis''s conventions are coordination equilibria — arbitrary but not any regularity;
  requires common knowledge and a coordination problem; conventions can change (Schelling
  focal points, gradual shifts). Breathing oxygen isn''t a convention because it''s
  not arbitrary / there''s no alternative that would work once others use it. Also
  "norms can never change" — conventions can shift, and Lewis discusses the sense
  in which conventions are arbitrary yet self-enforcing.


