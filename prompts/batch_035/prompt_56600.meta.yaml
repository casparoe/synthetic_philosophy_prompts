  and inferring human preferences from behavior. Type: recount a disagreement and
  adjudicate. Persona: longtime rationalist blog reader. The disagreement should be
  between two people other than the asker, with a few rounds of decent points.


  I can write a dispute between two friends/rationalists about whether IRL supports
  "revealed preferences" — e.g., at a meetup, two people argue about whether a misaligned
  RL agent trained by IRL on human behavior implies preferences are constructed vs.
  discovered, or whether the standard debate about revealed preference theory in economics
  (Samuelson) vs. hedonic/utility. Let me design something with genuine back-and-forth.


  Dispute: Person A says preferences are just bookkeeping devices for predicting behavior
  (IRL outputs a reward function that''s just a compressed representation — "preference"
  is a useful fiction). Person B says no, IRL presupposes a model of human irrationality/bias,
  so the inferred preferences can diverge from behavior, which means preferences are
  real and behavioral evidence underdetermines them... A counters with the degeneracy/misspecification
  problem: the inferred reward is wildly underdetermined given limited data, so the
  "true preferences" are more a projection of the modeler''s priors than a discovery.
  B counters: that underdetermination shows up in the misspecification results (e.g.,
  apparent irrationality can be rational under a different reward — risk aversion
  vs. probability weighting), but doesn''t mean preferences are fictional; it means
  behavior is weak evidence. Etc.


  Make sure it''s a rationalist-blog-reader framing: at a LessWrong meetup, terms
  like "revealed preferences," "compatibilism about preferences," "outer alignment,"
  "CIRL/assistance games," maybe. Avoid hyper-niche theories — CIRL is fairly known
  in rationalist circles; I can mention it lightly without depending on specifics.
  Actually to be safe, keep references light: revealed preferences, rationalization,
  "reward misspecification," "Nozick''s utility monster"? No, keep to IRL basics.


  Structure: reporter was at a meetup, two regulars (give names) debated. 4 moves.
  Ask for adjudication.


  Moves:

  1. Dana: IRL vindicates the economist''s revealed-preference program — stop introspecting,
  just fit a utility function to behavior; a "preference" is whatever explains/predicts
  the choices, full stop.

  2. Marcus: that''s circular or empty — any behavior is consistent with some utility
  function unless you constrain rationality; if everything maximizes something, "she
