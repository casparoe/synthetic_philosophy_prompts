  Let me craft a good Type 3 with trolley/DDE:


  Commitments:

  (a) The doctrine of double effect correctly explains the trolley case asymmetry:
  switching is permissible, pushing the fat man is not, because in switching the deaths
  are a side effect, in pushing it''s a means.

  (b) Intentions don''t affect the permissibility of actions — they matter to blameworthiness,
  not permissibility. (This is in genuine tension with DDE, which is often characterized
  as making intended harm impermissible — though sophisticated defenders say DDE is
  about whether harm is intended, i.e., an objective structural fact about the means/side-effect
  relation, not about the agent''s mental states. So there''s a possible dissolve:
  DDE read as about means vs. side effect is not about intention per se. Good — that''s
  the apparent tension that dissolves... actually it partially dissolves, partially
