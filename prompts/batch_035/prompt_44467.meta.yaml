  Domain options: Ship of Theseus works nicely with a disagreement adjudication —
  a concrete dispute between two people about a specific variant (e.g., a band replacing
  members, a company, a restoration of a ship, a family recipe). To be "in the weeds,"
  inject a niche twist: e.g., a museum gradually replacing planks with modern treated
  wood and keeping the originals in storage, then reassembling the originals into
  a second ship. Which one is the Theseus? That''s the classic Hobbes extension though
  — still fairly known but fine; the in-the-weeds part can come from a twist: the
  replacements aren''t identical planks — the museum uses a different wood species,
  and the "original planks" are themselves partly restored with new material before
  reassembly. That injects novelty: the original planks aren''t 100% original either,
  so the "reassembled original" isn''t purely original. That''s a good underdetermination
  angle.


  Or epistemic injustice + presuppositions of a practice: e.g., HR "vibe check" interviews,
  or universities requiring "excellent communication skills" for admission, or medical
  triage relying on self-report. What does the practice presuppose about credibility?
  Actually an interesting one: peer review''s double-blinding presupposes that knowing
  author identity distorts, but single-blind is default in most fields — what theory
  of testimonial credibility does peer review presuppose? That''s in the weeds and
  meaningful.


  Or evolutionary psychology + adjudication: two friends arguing whether a specific
  just-so story is testable. Could work.


