  would stop the trolley even if the five weren''t tied to the track, so the five
  would die anyway and pushing him is close to a necessary means in outcome terms)
  damages the doctrine''s usual explanation.


  3. Cruxes: sub-questions such that settling one would move at least one camp. E.g.
  does the doctrine have a principled stopping point between redirecting a threat
  (permissible) and using someone''s body as a trolley-stopper (not)? Is "foreseen
  with certainty" morally different from "intended" in the case where the side effect
