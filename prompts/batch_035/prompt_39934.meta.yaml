  same two examples (switch vs footbridge) and nobody moves.


  Write the joint statement they should produce if they did a proper adversarial collaboration.
  By name if you like: the "Tom camp" (double effect is doing real moral work) and
  the "Priya camp" (it''s rationalized intuition). Requirements:


  1. Claims both camps can sign. At minimum about: that the near-universal judgment
  that diverting a trolley onto one to save five is permissible while pushing a large
  man off a footbridge is not, is a fact that any theory owes an explanation of; that
  the doctrine owes an account of what "intending" harm means when the agent must
  track the harm for the plan to work (the terror bomber vs the strategic bomber);
  and about the status of intuitions -- both should be able to agree on something
  about whether they''re evidence, and what kind.


  2. Disagreements, each phrased so its own camp would accept the wording -- including
  on whether the harm-as-means vs foreseen-side-effect distinction is morally real
