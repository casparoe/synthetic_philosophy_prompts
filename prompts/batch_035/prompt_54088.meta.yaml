  ---


  I teach a graduate seminar on epistemic foundations of game theory, and I keep using
  the fairy tale of the emperor''s new clothes as my stock illustration of the difference
  between mutual knowledge and common knowledge: the courtiers all see that the emperor
  is naked, each knows the others see it too, and the pretense nonetheless holds —
  until the child cries out, the observation becomes public, and the coordinated laughter
  collapses the whole performance in a moment. I''ve started to worry the story does
  too much work by sleight of hand, and I''d like an audit of it rather than a defense
  or an attack.


  Specifically: (1) Give the correspondence table — what plays the role of the public
  announcement, the common prior (if any), the coordinated action, the equilibrium
  being selected — and flag what has no counterpart in the story. (2) In the story
  as usually told, everyone in the crowd can see everyone else''s face, so even before
  the child speaks there may already be several layers of higher-order knowledge present;
  if so, what exactly does the cry add, and is the story perhaps about something other
  than the common-knowledge hierarchy — say, about eliminating the risk of being the
  lone dissenter? (3) The moral usually drawn is that one public signal suffices to
  switch a population from one self-enforcing convention to another. Test that moral
  against the game-theoretic point that common knowledge of rationality and payoffs
  still leaves multiple equilibria when interests conflict, and against the example
  where two parties exchange automated confirmation messages back and forth — so that
  they share any finite number of levels of mutual knowledge, however high — yet the
  outcome of the protocol is radically different from what true common knowledge would
  deliver. Where does the "child''s cry" picture survive that stress test, and where
  does it break? (4) Finally, the story quietly assumes the child''s cry is costless
  and audible to all at once. In settings where the first deviator is punished and
  communication is noisy or local, does the analogy''s conclusion — that pretenses
  are one public truth away from collapse — survive at all, and if not, what would
  a more faithful analogy for the role of common knowledge in collective action look
  like?


