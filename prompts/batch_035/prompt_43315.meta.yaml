  man of his time: he burns heretics and genuinely believes he''s saving their souls,
  and the novel doesn''t pretend he''s a hypocrite -- it shows his conscience as real.
  And then there''s Cromwell, who the novel lets us love partly because he keeps flashing
  anachronistic signals: a kind of practical religious tolerance, sympathy for the
  people everyone else in the book treats as trash, contempt for cruelty that reads
