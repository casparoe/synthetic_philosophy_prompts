reasoning_summary: 'Let me pick a domain and type. Options: Solomonoff induction/Kolmogorov
  complexity/Occam''s razor — could do a classroom activity (e.g., a game where participants
  act as scientists choosing between compression-based explanations). Or Maxwell''s
  demon with a short story. Or boundary problem with classroom deliberation game.


  A nice fit: "Present someone''s summary of a view and ask whether it is fair" for
  Solomonoff induction — popular summaries of Occam''s razor formalization often contain
  subtle errors (e.g., claiming Kolmogorov complexity is computable, or that Solomonoff
  induction "proves" shorter theories are more likely true, or conflating complexity
  of a hypothesis with its probability, or the claim that a simple theory with many
  parameters...). That''s a good type: write a plausible popularizer''s summary with
  subtle misrepresentations.


  Misrepresentations to plant:

  1. Claim Kolmogorov complexity / shortest program is computable — no, uncomputable
  (subtle; many popularizations gloss this).

  2. Conflate "simpler" as shorter description with "fewer entities" ontological parsimony.

  3. Claim Solomonoff induction assigns probability 1 to the true hypothesis eventually,
  or "guaranteed to converge" — it converges in the limit for computable environments,
  but the claim "it solves induction" overstates; also computability issue.

  4. Claim Occam''s razor is thereby proven rather than built in via the prior (the
  2^-length weighting builds in the razor — so saying "this finally justifies Occam''s
  razor" is circular-ish).


  That''s a rich prompt. Also request confidence/self-doubt note. Also ask for role
  assignment ("You are a computer scientist working on algorithmic information theory...").


  The asker: "My cousin''s popular science book" or "a science podcast transcript
  my friend sent me." Write the summary in the prompt — must be plausible, mostly
  right, with subtle errors, no howlers.


  Draft:


  "I listened to a podcast episode about machine learning and the philosophy of science
  where the host summarized Solomonoff induction roughly as follows: [paragraph].
  Something about it feels too good to be true... You are an expert in algorithmic
  information theory... Go claim by claim... identify which parts a careful researcher
  would accept, which are subtly off, and whether the host''s conclusion that Occam''s
  razor has finally been proven follows. Ask for confidence levels and the least sure
  point."


  Write the summary paragraph. Keep it plausible:


  "Solomonoff induction formalizes Occam''s razor. You take all possible explanations
  of your data and translate each into a computer program that outputs the data; the
  shorter the program, the simpler the explanation. Then you assign each hypothesis
  a probability that shrinks with its length. Kolmogorov proved that the length of
  the shortest such program is an objective, language-independent measure of complexity,
  and Solomonoff proved that a learner using these probabilities is guaranteed to
  converge on the true theory — so induction, which philosophers since Hume had written
  off, is a solved problem in principle. The catch is only practical: finding the
  shortest program is computationally hard, but physicists have used the idea to argue
  we should prefer theories with fewer free parameters."


  Errors: Kolmogorov proved language-independence only up to an additive constant
  (invariance theorem, and it depends on choice of universal machine — subtle). Solomonoff
  "converges on the true theory" — convergence to correct predictions for computable
  environments, not identification of the true theory; also no guarantees of any finite
  rate; also uncomputability — the induction itself is only semicomputable, so "solved
  in principle" overstates but is a common framing (actually "in principle" might
  be fair — Solomonoff completeness. The subtle error is converging on true theory
  vs true predictions). "Finding the shortest program is computationally hard" — it''s
  not hard, it''s uncomputable, that''s a subtle but important error. "Theories with
  fewer free parameters" — conflation of description length with parameter counting,
  MDL connection, subtle. "Hypotheses a probability that shrinks with length" — that''s
  right (2^-|p|).


  Also "Guaranteed to converge" — for computable environments yes, but "the true theory"
  — pluralism issue. Good.


  Epistemic request: ask the responder to state confidence and the point it''s least
  sure about. Also role: "You are a researcher in algorithmic information theory with
  a sideline in philosophy of science."


  No quotes from real texts needed — I''m writing the summary myself, attributed to
  an unnamed podcast host. No search needed. Keep it polished and moderately short.'
