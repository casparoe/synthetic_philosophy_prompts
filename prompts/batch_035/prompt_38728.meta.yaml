  Design the session around paired bargaining with real (small) stakes — bonus points,
  candy, whatever works. The setup needs a feasible set where the two solutions actually
  come apart, so straight "split a fixed pie" games won''t do — with a linear frontier
  and transferable utility, Nash and Kalai–Smorodinsky coincide at the equal split
  of the surplus, which my students would find underwhelming. So give me concrete
  payoff schedules (actual numbers I can print on cards) with a kinked or curved Pareto
  frontier and a non-zero disagreement point, where the Nash solution and the Kalai–Smorodinsky
  solution are visibly different, and tell me what each solution is in your setup.


  Then a second phase where the same pairs bargain again after I remove one alternative
  from the menu — an alternative neither of them would ever choose. The point is that
  the Nash solution says the agreement shouldn''t move (independence of irrelevant
  alternatives) while the Kalai–Smorodinsky solution says it should, because the removed
  option changes a player''s best-case payoff even though it was never on the table
  as an agreement. I want the students to argue about whether their previous agreement
  still binds before they know there''s a formal issue here.


  For the debrief: map the arguments students will actually make ("you''d never have
  gotten more than X anyway", "we''re not renegotiating just because the menu changed",
  "but my outside option is what it is") onto IIA and individual monotonicity, and
  say which reading of fairness each corresponds to.


  Also: tell me what will predictably go wrong (pairs splitting 50/50 out of habit,
  someone seizing the whole surplus because the numbers confuse them, disagreement
  points not being credible), and be honest about what the activity cannot reproduce
  — in particular, that payoffs on cards are utils by fiat, so the deep problem of
  interpersonal utility comparison gets assumed away, and that students who know game
  theory may coldly compute instead of bargain.


