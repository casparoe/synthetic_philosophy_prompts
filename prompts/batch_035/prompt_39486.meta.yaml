  ---


  A friend and I spent the whole of last night on a single question — whether a hypocrite
  is in a position to blame the very thing he does — and we finished exactly where
  we started, which has begun to seem diagnostic in itself. What I want from you is
  not a verdict on who won but a diagnosis of the stalemate: what kind of disagreement
  is this, and what, if anything, would count as progress?


  The terrain, as we staked it out. Take a lecturer who plagiarizes when it suits
  her and then delivers a cold dressing-down to a student caught cheating, or a driver
  who texts at the wheel but curses freely at anyone who drifts lanes. We found we
  agree on almost everything about these cases: the student and the lane-drifter are
  culpable; the complaint made against them is true; nothing in it is insincere at
  the moment it is made. We agree, too, that something is wrong with the hypocrite''s
  blaming — the same words rankle from her in a way they would not from a person with
  clean hands. What we could not agree on is what that something is.


  My friend defends what she calls the standing view: the wrong is that the hypocrite
  lacks the standing to blame. The student has, she says, a right against being blamed
  by this particular person — not a right against being blamed as such, and not because
  the blame is false, but a right generated by the blamer''s own violation of the
  norm she invokes. Her most interesting move borrows from Raz''s notion of an exclusionary
  reason: standing is not a further reason against blaming that gets weighed in, but
  a second-order consideration that switches the first-order reasons off; the hypocrite''s
  blame is not exactly wrong, it is inadmissible, the way a judge who took a bribe
  is not exactly mistaken but no longer entitled to rule. She generalizes the point:
  standing is also lost by meddlers, who have no business in the matter, and by those
  who benefit from the very practice they condemn — three routes to the same inadmissibility.
  And she notes, correctly I think, that the retort ''who are you to say so?'' is
  not, in this context, the fallacy it''s usually filed under.


  I resist all of this, and my resistance has two prongs. First, the ordinary-defects
  view: the only things wrong with the lecturer are ordinary vices, available to a
  complete theory without any new norm — selective enforcement, arrogance, an unfairness
  in exempting oneself from a standard one imposes on others. Nothing here needs a
  right the target holds; it needs only a bad character in the blamer. Second, an
  accusation: ''standing'' is a term of art that relabels our shared datum (the blame
  rankles) and then offers the relabeling back as an explanation. When I press her
  for what distinguishes inadmissible blame from merely vicious blame, she says the
  hypocrite''s victim is wronged rather than merely witnessing a bad performance;
  when I ask what the victim is owed, the answer circles back to not being blamed
  by a hypocrite. Neither of us has moved an inch, and the same impasse, I gather,
  has been running in the literature for thirty years with the same arguments on both
  sides.


  Here is my hypothesis, offered as no more than that. The stall persists because
  we are answering different questions under one heading: she is describing the propriety
  conditions of the practice of blaming — what one may do within the practice, as
  one may not sue without standing — while I am evaluating the blame as a piece of
  behavior, asking whether any wrong occurs in the world. And behind that, I suspect,
  sits a genuinely substantive disagreement about what blame is: if blame is essentially
  a sanction or imposition, her rights and inadmissibility fall out naturally; if
  it is essentially a communicative protest, then the hypocrite''s defect is a credibility
  and fairness defect in a piece of speech, and talk of rights is a category mistake.
  If that''s right, then no argument framed at the level of standing will ever move
  either of us, because each side''s theory of blame has settled the standing question
  in advance.


  So: is my structural hypothesis right, or is this a hidden verbal dispute, or a
  genuine first-order disagreement about standing that is simply hard, or bedrock
  intuitions about fairness that neither side can argue for? Diagnose it from what
  each of us actually says, as I''ve reported it. Then tell me what would count as
  progress given your diagnosis — a case that forces one side to bite a bullet, a
  distinction that splits the three routes to lost standing, a change of question
  — or argue that no progress should be expected and why. One request on how you answer:
  separate what is settled among people who know this literature from what is genuinely
  contested, and don''t present either theory of blame, or your own diagnosis, as
  if it were consensus. If your diagnosis depends on a contested view of what blame
  is, flag that dependence rather than hiding it in the premises.


