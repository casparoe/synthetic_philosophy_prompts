  ---


  I''m taking a final-year seminar on distributive justice, and we''ve each been asked
  to submit a short position statement to be workshopped in class. Before I submit
  mine, I''d like to know whether it actually hangs together. Here is the position:


  (1) The levelling-down objection is fatal to telic egalitarianism: a change that
  makes some people worse off and no one better off cannot make the situation better
  in any respect, so equality is not intrinsically good.

  (2) I accept the strong Pareto principle: whenever one person is better off and
  no one is worse off, the outcome is better.

  (3) I''m a prioritarian: the moral weight of a benefit to someone depends only on
  how well off that person is — their absolute level, not their position relative
  to others — with benefits to the worse off counting for more. I also hold that the
  overall value of an outcome is exhausted by these weighted benefits.

  (4) I nonetheless retain a residual fairness judgement: there is something bad,
  over and above how badly off they are, about someone''s being far below others through
  no fault of their own — bad even when nothing can be done about it, as with someone
  struck down by illness in a flourishing society. I think of this as bad luck or
  unfairness rather than inequality, so I don''t take (1) to touch it.

  (5) In our seminar''s calibration case I judged that a two-person society in which
  each is at 50 is in one respect better than one in which one person is at 50 and
  the other at 90, because of what it is for the first person to be so far behind.
  I''m fairly confident about this verdict.

  (6) A classmate objects that prioritarianism has a levelling-down problem of its
  own: with steep enough weights it can prefer a world in which almost everyone is
  much worse off, so long as the worst-off person is a little better off. My instinct
  is that this is not genuine levelling down, because someone really does gain, but
  I''m not sure I can defend that.


  My tutor said my statement sits uneasily with itself but wouldn''t say where. Which
  of these commitments are genuinely in tension, which only look as though they are,
  and what is the least costly revision? Please rank the tensions by severity rather
  than treating every pair as equally bad, and tell me concretely which commitment
  has to give and what I lose by giving it up.


