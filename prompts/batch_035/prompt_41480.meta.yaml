  claim, not straightforward. Also the ratio depends on comparison class — ordinary
  observers also proliferate (eternal inflation, etc.)? Well, in a pure de Sitter
  future with no ongoing formation of ordinary observers, BBrains dominate numerically.
  (3) "the laws of physics tell us that we are almost certainly Boltzmann brains"
  — the inference goes through assumptions about typicality/self-sampling; a defender
  would say it''s conditional on a self-sampling assumption. (4) "physics has refuted
  itself" — this is the cognitive instability point (Sean Carroll''s term), but the
  standard reading is that this counts as a problem for the theory, a reductio to
  be avoided — the standard conclusion is that theories that make us atypical are
  disfavored, not that "any theory predicting an infinite future must be wrong." Actually
  some do argue that — but the subtle error is "must": it''s not a logical refutation;
  the theory could survive by rejecting typicality assumptions. (5) "random thermal
  fluctuations will produce... by sheer chance" — needs the universe to be in a state
  with nonzero temperature forever (de Sitter with horizon temperature), not just
  "expanding forever" — expansion alone (e.g., into empty Minkowski? or heat death
  to true zero temperature?) Actually a truly cold heat death at T=0 produces no fluctuations.
