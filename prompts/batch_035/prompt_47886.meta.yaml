  I serve on the board of my neighborhood association in a 1920s streetcar suburb,
  mostly duplexes and fourplexes that were legal when they were built but were downzoned
  to single-family in the 1970s, so nearly every existing owner lives in what the
  code now calls a legal nonconforming use. Next month the board must take a position
  on a proposal to replace a shuttered nursing home at the end of our street with
  a five-story, seventy-unit apartment building, a quarter of the units rent-restricted,
  made possible by a recent state law that overrides the local zoning cap. I have
  to decide how to vote, and I keep going back and forth, so I would like your help
  thinking it through.


  The opposition is led by a neighbor who, before he retired, helped write the 1970s
  downzoning. His argument is not about architecture; he says that he and everyone
  else bought their homes under a set of rules, that a home purchase is a bet on the
  surrounding rules staying put, and that changing the rules after people have staked
  their savings on them is a kind of confiscation, even if the change is lawful. He
  also points out that he never objected to the fourplexes themselves — the rules
  when they went up allowed them.


  But he is being attacked from another side. Several of our most active board members
  are renters, one of whom has organized tenants in the neighborhood for years. Their
  view is that the meeting''s assumption that the people in the room are the neighborhood
  is itself the problem: the seventy households who would live in that building have
  no voice at the meeting, and neither do the families priced out of the neighborhood
  over the last decade, and if we get to vote on whether they exist, then the vote
  itself is doing the harm.


  And there is a complication of my own: the developer, knowing the board''s position
  matters at the hearing, has offered to sign a community benefits agreement — a small
  pocket park, local hiring preferences, and a funded repair fund for the street''s
  sidewalks — if the association supports rather than merely abstains. Two of my friends
  on the board think this is a bribe dressed up; two think it''s the only concrete
  good anyone will extract from this process and turning it down is moral preening
  at other people''s expense.


  Three questions, then. First, does the argument that property was bought under the
  rules create any real moral claim against changing them — especially when the rules
  being changed were themselves changed fifty years ago, in a way that quietly transferred
  rights from future builders and renters to existing owners? Second, whose interests
  should the board actually be weighing — its dues-paying members, the people who
  live here now regardless of tenure, or the people who would live here if the building
  existed — and is there any principled way to decide, or just a fight about who counts?
  Third, does taking the benefits agreement corrupt our vote, or is it simply the
  neighborhood negotiating, through the only channel it has, for a share of the value
  the upzoning creates?


  Please begin with your bottom line — how I should vote and why, in the first sentence
  — and then give your reasoning, with no preamble and without restating my questions.


