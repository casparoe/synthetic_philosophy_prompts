  Draft:


  Title: "The shrinking definition of violence"


  1. The usual argument: measured by deaths per capita from war and homicide, the
  past was more violent than the present; therefore we live in an unusually peaceful
  era, and the trend is real.


  2. My first objection is arithmetic, not philosophy: per capita rates can fall while
  absolute numbers rise. If population grows tenfold, a constant per-capita rate means
  ten times the bodies. When people say "less violent," which quantity do they actually
  care about? I suspect intuitions differ: my brother-in-law cares about the chance
  that a random person dies violently; I care about how much violent death there is,
  total. Neither seems wrong; they''re just different questions. But the popular argument
  slides between them without noticing.


  3. My second objection is the one I''d most like feedback on. Call it the "retired
  violence" problem: as a form of violence becomes ordinary or accepted, we stop classifying
  it as violence, so it disappears from the statistics not because it stopped but
  because the category shrank. Examples: flogging of sailors, wife-beating as "discipline,"
  work deaths in mines, and maybe (this is my speculative extension) things we do
  today that our grandchildren will count as violence — factory farming is the obvious
  candidate, maybe prison, maybe the long-term health effects of poverty. If this
  is right, then the claim "violence has declined" may be partly an artifact of the
  moral category narrowing along with the practice. The measure and the morality move
  together.


  4. Where I end up: there may be no single fact of the matter about whether the world
  is less violent, because "violence" isn''t a natural kind with fixed boundaries
  — the boundary is drawn differently in each era, partly by what the era has already
  decided to tolerate. But I''m unsure whether this is a genuine insight or just definitional
