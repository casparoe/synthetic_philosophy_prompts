  ---


  I''m writing a term paper for a seminar on moral psychology that pairs Kafka''s
  The Trial (written 1914–15, published posthumously in 1925) with the philosophical
  and anthropological literature on guilt and shame, and I''ve hit a puzzle I can''t
  resolve by myself. The framework I''m using is the familiar one: guilt is the emotion
  of a self that has done a bad act — it looks for a charge, a defense, apology, repair
  — while shame is the emotion of a self exposed as defective; it looks to hiding
  or disappearance, and its trigger is the witnessing other, real or internalized.
  Classicists and anthropologists once sorted whole cultures this way, and philosophers
  like Bernard Williams and Gabriele Taylor have complicated the picture by arguing
  that shame needn''t be mere conformity to social expectation and can be a response
  to real failure. That''s the literature; my problem is the novel.


  Read through a guilt-structure, The Trial seems incoherent: Joseph K. is arrested
  without a charge, the court never names an offense, and every hearing is adjourned
  to another hearing — guilt without a deed looks like a contradiction. Read through
  a shame-structure, though, a great deal snaps into focus. The arrest''s real cost
  to K. is exposure at the bank, not sanction; the scenes that wound are the ones
  with audiences (the two warders being flogged in the bank''s storeroom where K.
  cannot stop watching, the client Block groveling in the lawyer''s bedroom while
  Huld displays him, the priest''s cathedral sermon delivered to K. alone in the dark);
  and the ending names shame outright. I''ve checked the closing line, which has K.
  say "Like a dog!" and the narrator add that "it was as if the shame of it must outlive
  him." The one thing missing from the whole shame-reading is shame in K. himself:
  he feels indignation, self-pity, and late something like complicity, but he never
  blushes, and to the end he demands the guilt-framework''s goods — a charge, a defense,
  an acquittal, as though the court were a court.


  So here''s what I''d like from you. Give me a reading of the novel as a study in
  how shame can be administered institutionally: does the court need K. to feel anything
  at all, or does it run entirely on what others see in him, such that his insistence
  on guilt-logic — his treating the proceedings as a case he can win — is itself the
  mechanism of his humiliation? Where do individual scenes (the flogging, the painter
  Titorelli''s account of the options, the parable "Before the Law" as told by the
  priest) support or strain the lens? And be honest about where the reading breaks
  down: is the guilt/shame distinction just too tidy for a book that also seems to
  be about law, theology, and bureaucracy, and if so, what would you point to as evidence
  that Kafka is doing something the moral-psychology literature — which mostly asks
  which emotion has better moral credentials and whether a culture can choose between
  them — doesn''t capture? I''d like the paper to end by saying what the novel adds
  to that debate that the arguments alone don''t.


