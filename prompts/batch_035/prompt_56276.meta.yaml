  So this is a bit embarrassing but my neurologist has me keeping a symptom diary.
  I get this recurring weird sensation — hard to describe to anyone, I basically just
  note it down when it happens. And mid-week it hit me that I''m basically the person
  in Philosophical Investigations §258, the one who keeps a diary and puts the sign
  S in it every time a certain sensation recurs, and I can''t tell whether I''m doing
  the same thing each time or whether my memory of "the same" is doing all the work.
  Which, given what Wittgenstein says about that case, is slightly worrying.


  I''ve tried to work through the actual passage but honestly I get lost. My copy
  is the Anscombe translation. As I understand it, he imagines I can''t define S in
  terms of anything public (not "the feeling I get when my blood pressure rises" or
  whatever) — if it had that kind of definition it would just be part of ordinary
  language, not the private language he''s after. So the idea would be to fix S by
  concentrating on the sensation, kind of an inward ostensive definition. And then
  comes the line I can''t get straight in my head, the one where he says that whatever
  is going to seem right to me is right, and that only means we can''t talk about
  right here.


  What I need help with: what exactly is the argument at that point? Is it that my
  memory might betray me, so when I write S on Tuesday I might be misremembering Monday''s
  sensation (I''ve seen this called the memory-skeptical reading)? Or is it something
  stronger — that even with a perfect memory there''d be no distinction between my
  application of S being correct and its merely seeming correct, so there''s nothing
  for "correct" to mean yet (I think this is sometimes the meaning-skeptical reading)?
  And if it''s the stronger one, why exactly does the lack of a correctness condition
  make S not a word rather than a useless word? That''s the step I keep feeling but
  can''t justify.


  Also, one thing that''s bugging me in a personal way: my actual diary obviously
  isn''t a private language — I write it in English, my neurologist reads it, "Tuesday,
  that feeling again, worse in the evening" is all pretty public. So what''s the difference
  supposed to be between my diary and the S-diary? Is it just that my terms ultimately
