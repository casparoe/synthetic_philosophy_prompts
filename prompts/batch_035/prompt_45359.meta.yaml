  (1) The only proper business of a human life is to procure agreeable sensations
  and sentiments; happiness is nothing over and above satisfied tastes and passions,
  and since great pleasures are available only to those capable of strong passions,
  being susceptible to passion is desirable even if passions plausibly make more people
  unhappy than happy.

  (2) Because unhappiness is noisy and happiness is silent — the unhappy seek out
  others, recount their miseries, and ask for remedies, while the happy go about their
  business and tell no one — our impression of the risks of passion is systematically
  distorted.

  (3) Happiness therefore depends on the management of belief. One should cultivate
  the benign illusions of daily life (a lover''s constancy, one''s own talents, the
  prospect of fortune at the gaming table) roughly the way one tends a garden, while
  reserving the appetite for truth for the one domain where truth pays: study, and
  the hope of glory that attaches to it — the only passion, on this view, that both
  intensifies with use and rarely turns against its host.


  Corollary: in the affairs in which truth would spoil pleasure, a cultivated and
  selective ignorance is a technique of happiness rather than an intellectual vice.


