  deserve a "this is bigger than it looks" piece and which deserve nothing more than
  a straight news brief. A few years ago I read Braudel, and his way of splitting
  historical time — the almost motionless time of geography and climate, the intermediate
  rhythm of economies and societies, and the fast, churning time of events, which
  he treated as a kind of foam on the surface — has stuck with me as a rough sorting
  principle. I want to turn it into a procedure my desk can actually run, in about
  ten minutes, when deciding whether a given news item is a symptom of something slow
  or just spray.


  Write me that procedure. It should be a fixed order of questions a writer can ask
  about any news item, where each question has an answer that passes and an answer
  that fails, with the fail answers ending in "cover it as an event; don''t commission
  a structural take." It should say at which step the question stops being factual
  and becomes a judgment call about what counts as the relevant timescale, since Braudel''s
  own boundaries were fuzzy and my writers'' won''t be sharper. Then run it on three
  items, roughly one paragraph each:


  1. A single regional bank fails over a weekend;

  2. a sharp rise in reported food-bank use across several years;

  3. a sudden collapse of a coastal fishery after decades of gradual decline.


  Include one case where the procedure returns an answer I won''t like — I''d love
  the bank failure to be a story about a decade of deregulation, and if the procedure
  won''t hand me that, I want to see exactly where it stops me and what evidence would
  have to be added to change the verdict. Finally, say plainly what the procedure
  cannot do: whether the slow tier can be changed by fast events, and who at my desk
  gets to overrule it.


  Structure the reply as: (a) The procedure — about 450 words; (b) The three worked
  cases — around 150 words each; (c) Where judgment takes over — about 200 words;
  (d) What the procedure can''t do — about 200 words.

