  (2) individualist: people should be judged as individuals, no essentialism; (3)
  cultural explanation is different from genetic/biological explanation — nations''
  traits are historical and contingent; (4) belief that stereotypes about groups are
  usually inaccurate; (5) skepticism that "the national psyche" explains anything
  — but actually let''s build genuine tensions.


  Let''s craft: journalist covering science/ideas writing a feature about why some
  countries adopted contact-tracing apps more readily than others.


