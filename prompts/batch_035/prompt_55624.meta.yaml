  and maybe the phenomenal-intentionality or felt-unpleasantness views (Ayers?). Common
  contenders: evaluativism (pain represents bodily damage), imperativism (pain commands
  protection), and pure discriminative/interoceptive views where badness is added
  by a separate valence mechanism.


  Requirements a theory must meet: explain pain asymbolia (pain without badness),
