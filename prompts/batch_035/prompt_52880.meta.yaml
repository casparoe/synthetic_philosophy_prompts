  My commitments, as they will appear in the handout:


  (1) The Meno problem is a genuine demand, not a confusion to be dissolved: knowledge
  must be more valuable than mere true belief, and the surplus value must be non-instrumental
  — it must survive even when the truth of the belief is held fixed. I regard deflationary
  answers on which knowledge has merely derivative or conditional value as evasions.


