  (1) Daniel opened with the classic argument. Take any machine whose mathematical
  output is generated by a formal system strong enough for arithmetic. If the system
  is consistent, Gödel''s first incompleteness theorem gives us a sentence — the sentence
  that says of itself that the system doesn''t prove it — which the system cannot
  prove, but which we can see is true. So for any machine, there''s a mathematical
  truth we can grasp that the machine cannot. Hence the mind isn''t a machine.


  (2) Marissa replied that the argument only gets going if the machine''s system is
  consistent, and more importantly, that it only works if *we* can see the machine
  is consistent — since if the system were inconsistent it would prove everything,
  Gödel sentence included. That seeing, she said, is exactly what''s at issue: to
  conclude "the machine can''t prove its Gödel sentence but I can see it''s true,"
  you have to know the system is sound, and that knowledge is not something either
  the machine or, she claimed, the human demonstrably has.


  (3) Daniel said this concedes his point: by the second incompleteness theorem the
  machine can''t establish its own consistency, but he, Daniel, can establish his
  — at least he can reflect that he has never knowingly affirmed a contradiction,
  and that''s a self-knowledge no formal system can have.


  (4) Marissa called that "introspective overreach." A machine that represents its
  own output as a formal system also has access to facts about its own operation,
  she said, and anyway — never having knowingly affirmed a contradiction is not the
  same as being consistent. Humans hold inconsistent belief sets all the time without
  noticing; the whole history of mathematics contains apparently self-evident axioms
  later found inconsistent-looking (naive set theory). So the premise that the human
  is consistent is an idealization being quietly substituted for a fact.


  (5) Daniel''s last move was Penrose-flavored: fine, drop consistency claims about
  actual humans — but consider an idealized human mathematician, one who never errs
  and can survey any proposed machine. Either that idealized reasoner is a formal
  system, in which case there''s a Gödel sentence for it that it can''t prove but
  we — reasoning about it from outside — can see is true; or it isn''t, in which case
  mechanism is false anyway. The dilemma survives all the quibbles about human fallibility.


  (6) Marissa answered that the dilemma doesn''t survive because the "outside" perspective
  is doing all the work: when *we* reason about the idealized reasoner''s Gödel sentence,
  we are only entitled to the conclusion if we know the idealized reasoner''s system
  is consistent, and if that system is at least as strong as ours, then by the second
