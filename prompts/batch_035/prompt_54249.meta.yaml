  ---


  I help run a philosophy reading group that has spent this term on free will and
  moral responsibility, and we''re closing with Galen Strawson''s Basic Argument.
  For our final session I''d like to open with a poem — specifically a pantoum — and
  I''m hoping the form can carry some of the philosophical weight.


  In case it helps to have the target in view: the Basic Argument runs, roughly, that
  to be truly responsible for what you do you''d have to be responsible for your will
  or character insofar as it issues in what you do; but you can''t be responsible
  for that unless you somehow brought it about — and bringing it about would require
  having existed, with the right deliberate intentions, before you existed at all.
  Since nothing can be causa sui, ultimate responsibility is impossible. What I like
  about the pantoum for this is that each stanza takes two lines from the previous
  one and puts them to work in a new context, and the form conventionally ends on
  the poem''s opening line — so the poem can literally enact the regress: the same
  demand reappearing at each level of explanation, the trace of responsibility pushed
  back a step each time, until the loop closes and we''re exactly where we started,
  with the ground we wanted still missing.


  A few constraints. The poem should render the argument accurately enough that someone
  who knows Strawson would recognize the structure rather than a name-drop — in particular,
  please don''t ground the conclusion in determinism, since the Basic Argument is
  supposed to hold regardless of whether character is fated, random, or anything in
  between; the impossibility comes from the self-creation requirement, not from causal
  necessity. And the repetitions shouldn''t feel decorative: each time a line comes
  back, its meaning should have shifted slightly, the way the argument''s demand feels
  newly urgent each time it''s applied one level further back. Someone who knows the
  argument should be able to say which lines carry which steps; someone who doesn''t
  should still find it a good poem.


