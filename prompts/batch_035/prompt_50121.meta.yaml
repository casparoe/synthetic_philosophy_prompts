  I am three months from delivering a novel to my publisher, in the revision stage,
  and I have become convinced that the hardest decisions are not about prose but about
  moral attention: which characters receive interiority, which are observed only from
  outside, whose suffering is dwelt on and whose is summarized away in a clause. A
