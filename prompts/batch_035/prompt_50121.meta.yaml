  independent units bargaining with one another. My friend also warns me that care
  ethics distrusts procedure — that its practitioners think codification is exactly
  the mistake the justice tradition makes — so I am asking for something its own advocates
  might consider a category error, and I would like you to be honest about that tension
  rather than paper over it.


  The concrete situation: my novel follows an adult daughter, a home health aide she
  hires and gradually displaces, and the mother, who has dementia and is often cruel
  to both of them. At present the daughter gets full interiority, the mother''s mind
  is rendered as fragments, and the aide exists mostly as a function — competent,
  kind, interchangeable. In revision I must repeatedly decide, scene by scene: who
  gets a point of view; whose needs get narrated and whose are merely implied; when
  a character''s tedious labor (the daughter''s, mostly — bathing, repeating, reassuring)
  deserves pages and when it should be compressed for pacing; and how to render the
  mother''s cruelty without either excusing it through her condition or turning her
  into an emblem of decline.


