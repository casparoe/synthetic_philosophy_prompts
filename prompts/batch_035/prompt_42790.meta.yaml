  \ counts\" for feathers but not... hmm, feathers: selected for flight currently,\
  \ so fine.\n\nActually make the tension sharper: the asker says the vestigial eye\
  \ has no function even though it retains its historical selection — so past selection\
  \ isn't sufficient; but the new allele with no selection history also has no function\
  \ — so past selection is necessary. Combined with the fluorescent marker having\
  \ a function with no selection at all (just one-off design, no selection cycle —\
  \ a single engineered pig). So past selection necessary (6), not sufficient (3),\
  \ and design-without-selection can suffice (7). Hard to reconcile — great.\n\nAlso\
  \ maybe one more: \"the function of the male nipple\" — no. Or tonsils. Keep it\
  \ to ~7 cases.\n\nThen ask: is there a principle — etiological, causal-role, some\
  \ hybrid (e.g., \"selected-effect or selected-for maintenance\" / \"modern history\"\
  \ accounts, Garson's \"generalized selected effects\") — that captures them? Test\
  \ on unlisted cases the model should supply: e.g., the appendix? ; a trait currently\
