  \ Verdict: yes it has the landmark function now.\n8. The hard-to-reconcile pair:\
  \ verdict 3 (vestigial eyes lose function when they stop contributing) plus verdict\
  \ 6 (the new allele lacks function before selection acts) plus verdict 2 (failing\
