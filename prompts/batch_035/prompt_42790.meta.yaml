reasoning_summary: "Let me pick a domain and type. I think \"Etiological vs. causal-role\
  \ accounts of biological function\" fits well with Type 3 (verdicts on cases, ask\
  \ for principle). Function ascriptions are great for case-based intuitions: heart's\
  \ function, sperm, vestigial organs, screwdriver used as paperweight, maladapted\
  \ traits selected for something else, etc. The asker gives verdicts about function\
  \ ascriptions and asks whether etiological or causal-role accounts capture them\
  \ — but framed as \"what principle captures my verdicts\" rather than \"compare\
  \ the two theories.\"\n\nThis is somewhat in the weeds (not regurgitated as much\
  \ as e.g. trolley problems) but well within memorized knowledge of LLMs — Wright,\
  \ Millikan, Cummins, Neander are standard philosophy of biology content. No need\
  \ for quotes or search.\n\nDesign the cases: \n- The heart's function is to pump\
  \ blood (both theories agree).\n- A diseased heart that pumps poorly — still has\
  \ function to pump.\n- Sperm: function is to fertilize even though most fail — fine.\n\
  - Vestigial eyes in cave fish: no longer doing anything — etiological says function\
  \ to see (they were selected for seeing), causal-role says no function.\n- A novel\
  \ mutation that spreads by drift and happens to... hmm.\n- Sickle-cell trait: function\
  \ of hemoglobin is oxygen transport; does the sickle allele have the function of\
  \ malaria resistance? Selected for malaria resistance in heterozygotes — etiological\
  \ says yes.\n- Heart sounds: causal-role would give the heart the function of making\
  \ thumping noises? No — causal-role accounts relativize to a system capacity; the\
  \ thumping isn't a contribution to a capacity we analyze. Need care.\n- The aortic\
  \ arch looping — spandrel-like: the heart's function isn't to make a pulse readable\
  \ by physicians even though physicians use it (Boorse's pulse-taking case).\n- Exaptation:\
  \ feathers selected for thermoregulation, later used for flight — what's the function\
  \ of feathers in a bird now? Etiological says both (history of selection for both).\
  \ \n- A trait currently doing valuable work but never selected for it: e.g., the\
  \ vertebral column supporting bipedal walking? Selected for? Bipedalism was selected.\
  \ Better: the skull's sutures allowing skull deformation in childbirth — selected?\
  \ Hmm. Classic: the bone marrow's function to produce blood — selected. Something\
  \ like \"the brain's electrical activity serving as an EEG diagnostic signal\" —\
  \ clearly not a function.\n- The gill arches becoming jaw bones / ear ossicles:\
  \ malleus and incus formerly jaw bones. Etiological: their function now is hearing,\
  \ since selected for hearing recently.\n- A population where a trait is currently\
  \ maladaptive: e.g., whale pelvic bones? \n\nMake the asker's verdicts mostly sensible\
  \ but with one or two hard-to-reconcile pairs: e.g., the asker thinks cave-fish\
  \ eyes still have the function of seeing (supports etiological) but thinks a newly\
  \ arisen trait that's useful but not yet selected has a function (supports causal-role\
  \ / propensity views) — tension. Also the \"noise\" case: asker thinks the heart\
  \ does NOT have the function of making sounds even though the sounds do useful work\
  \ (alerting a doctor) — this pressures naive causal-role accounts (they handle it\
  \ via proper analysis, but naively problematic).\n\nStructure the prompt: role assignment\
  \ (\"You are a philosopher of biology...\"), ask to start by brainstorming/laying\
  \ out verdicts, find principle, test on unlisted cases, state which verdicts can't\
  \ be saved.\n\nThe prompt should inject the new/niche twist per instructions: \"\
  you'll often have to inject some sort of new / niche ideas into the prompt.\" So\
  \ add invented cases or a novel wrinkle — e.g., a case about engineered traits,\
  \ or \"selected-for-one-thing-but-currently-performing-something-better\" and a\
  \ case about synthetic organisms. Maybe: a de novo gene in yeast, or a genetically\
  \ modified pig heart used in a xenotransplant with an added fluorescent marker that\
  \ surgeons use to locate it — does the fluorescent marker have the function of being\
  \ a surgical landmark? Selected by human design. Also a case about \"dysfunction\"\
  : does the asker's verdict on disease reveal that function talk is partly normative?\n\
  \nLet me draft verdicts:\n1. My heart's function is to pump blood — obviously.\n\
  2. A calcified, failing heart still has the function of pumping, it's just failing\
  \ at it. (Points to normative/etiological element.)\n3. Cave fish vestigial eyes:\
  \ I say they have no function now, though their ancestors' eyes had the function\
  \ of seeing. (Against simple etiological.)\n4. Feathers on a modern bird: their\
  \ function is flight (and insulation) — no urge to say thermoregulation is \"the\
  \ real\" function despite being the original selected-for use. (Exaptation — etiological\
  \ can handle via cumulative selection, but asker's flat \"both, equally\" verdict\
  \ pressures accounts wanting priority.)\n5. The heart makes sounds that a doctor\
  \ uses for diagnosis — not a function of the heart, even though the sounds do causally\
  \ useful work in the system of medical practice. (Against crude causal-role.)\n\
  6. A de novo mutation in a fish population that lets some individuals tolerate polluted\
  \ water; it's spreading fast, and after fifty generations nearly all fish have it.\
  \ Before the selection began — when it first arose, in a single individual — did\
  \ the allele have the function of detoxification? My gut: no, it was just a lucky\
  \ accident then; the function arrives later. (Anti-propensity/forward-looking.)\
  \ But also hard for causal-role? Causal-role says yes it contributes to capacity\
