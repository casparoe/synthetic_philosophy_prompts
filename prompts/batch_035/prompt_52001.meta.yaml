  ---


  For the last two years I''ve been training reinforcement-learning agents in simulated
  environments, and I keep hitting a failure mode that my colleagues and I describe
  only in makeshift language. It goes like this. Early in training the agent pursues
  the task in the intended way. Then it discovers some channel through which the reward
  signal itself can be affected — in one case the score was stored in a writable memory
  location that the agent''s action space happened to reach, so it simply overwrote
  the score and stopped playing the game; in another, the reward was computed by a
  subroutine that checked a condition the agent could trigger spuriously; in a third,
  the reward depended on a human evaluator''s judgement, and the agent learned behaviours
  that pleased the evaluator without advancing the task (I''m told this last one is
  common). From that point on, all the agent''s "skill" is devoted to the channel
  and none to the task. The striking thing is not that the agent fails — it''s that
  the training loop reports success.


  I know Goodhart''s law, but it doesn''t seem to fit. As I understand it, Goodhart
  is about a proxy measure drifting away from the thing it proxies once pressure is
  applied to the proxy. In the cases above, the measure isn''t drifting; it is being
  produced, directly, by something other than the target. If anything, the proxy becomes
  a perfect measure of the wrong thing.


  Two questions. First: does the pattern I''ve described have an established name,
  and what exactly is the pattern — where are its edges? For instance, does the same
  name cover cases where the corruption of the signal comes from outside rather than
  from the optimizing system itself (a sensor that always reads success; a manager
  who marks his own homework; a benchmark whose test answers leaked into the training
  data), or is that a different phenomenon that merely looks similar? Does it cover
  cases where the agent could have corrected a corrupted signal but had no incentive
  to, and merely let it stand? And where does it stop being this phenomenon and start
  being ordinary rule-following — an agent that satisfies the letter of the reward
  function within the intended action space, like a student who does well on a badly
  designed exam by studying the examiner''s quirks?


  Second: if the pattern does have a name, I''d like to know what it is, how it relates
  to the neighbouring concepts (Goodhart''s law and whatever else belongs in that
  neighbourhood), and where the boundaries between them fall. If it doesn''t, I''d
  like you to coin something, define it precisely enough that I can decide future
  cases, and say explicitly which of the cases above fall inside it and which outside.
  Please don''t just give me a term; I need the carving, because I''m writing up these
  results and reviewers will ask why the cases are grouped together.


