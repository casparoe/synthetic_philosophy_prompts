  Working title: "The noise model is where the ethics lives."


  Notes: Inverse reinforcement learning (IRL) infers a human''s preferences by treating
  observed behavior as roughly optimal for some reward function plus noise: given
  choices, find the preferences that make those choices most probable. The standard
  complaint is that humans aren''t rational enough for this to work. My essay argues
  something different: the framework doesn''t just fail to accommodate human irrationality;
  it forces a factorization of behavior into "preference" and "noise" components,
  and I want to argue this factorization is not purely descriptive — it has a normative
  character. Which deviations from optimality you file as noise determines what the
  system treats as the person''s "real" preferences, and thereby what it will do for
  them. Consider a human who smokes: a Boltzmann-noise model treats occasional smoking
  as tempering (a true preference for smoking weakened by error), whereas a model
  with habit formation might treat smoking as pure noise to be explained away. I want
  to introduce a distinction between deviations the helper should disregard as performance
  error ("explanatory noise") and deviations that are partly constitutive of who the
  person is ("constitutive noise") — e.g., someone''s akrasia or their inconsistent
  risk attitudes. A helper that corrects constitutive noise is not merely filtering;
  it is editing the person. My worry: the standard IRL setup structurally cannot mark
  this distinction, since it needs the whole noise term to be defined independently
  of the human''s values. I plan to gesture at assistance games as a partial improvement,
  but with the observation that they inherit the same factorization problem through
  their model of the human''s rationality.


  Comments requested: I''d like, in this order, the following sections:


  1. Summary judgment — one short paragraph (roughly 100 words) on whether the essay
