  ---


  I am drafting, for a graduate reading group on animal minds, a specification of
  what any adequate theory of the distribution of consciousness across animals must
  deliver — before we turn to the actual contenders (behavioral or reflex-based criteria,
  neural-substrate theories in the style of integrated-information or global-workspace
  views, biological-function accounts, and higher-order theories). I want the standard
  of adequacy itself as the deliverable; the scorecard comes later and elsewhere.


  By a theory of distribution I mean a principle that takes a description of an organism
  — its nervous system, its behavior, its evolutionary history — and yields answers
  to three questions: whether it is phenomenally conscious at all, in what degree
  if degrees are possible, and of what kinds. I want the requirements list built around
  the following cases and worries, though you may add others you think belong:


  1. The octopus, with roughly two-thirds of its neurons in the arms and no centralization
  comparable to the vertebrate brain — a test of whether the theory can handle decentralized
  and distributed nervous systems.

  2. Convergent evolution: birds achieve complex cognition with a pallium organized
  on a fundamentally different plan than the mammalian neocortex — a test of whether
  any criterion tied to a particular neural architecture smuggles in vertebrate-mammal
  chauvinism.

  3. C. elegans, with exactly 302 neurons and a fully mapped connectome — a test of
  whether the theory yields any verdict at all when everything structural is known,
  or whether it turns out to be empty in exactly the case where we have maximal neural
  information.

  4. Decapod crustaceans and insects, where the behavioral evidence is mixed — trade-offs
  between injury and resources, analgesic self-administration in fish, play-like behavior
  in bees — a test of how the theory weights behavior relative to architecture.

  5. The boundary with nociception: the theory must keep the question of phenomenal
  feel apart from the mere presence of nociceptors and withdrawal reflexes, and equally
  apart from moral status.


  Beyond the cases, I want the list to include — or argue against including — requirements
  such as these: that the theory must be applicable in principle from third-person
  evidence alone, since no animal can report; that it must state whether consciousness
  admits of degrees or is threshold-like, and must say what follows for organisms
  near the threshold; that it must not use phylogenetic proximity to humans as even
  a tacit tiebreaker; and that it must extend in a principled way to organisms unlike
  any we have observed, since a theory that only interpolates among familiar animals
  is a field guide, not a theory.


  For each requirement, give the case or consideration behind it, mark it non-negotiable
  or negotiable, and say honestly which marks are camp prejudices rather than demands
  of adequacy. Then two analyses I most want: identify any subset of the requirements
  that is jointly unsatisfiable — and if the set cannot be jointly met, say which
  requirement I should drop and what it costs; and identify the single requirement
  that excludes the most contenders among the four families above, with the argument
  for why it does.


  One further constraint on framing: the purpose of the theory, for us, is practical
  — deciding where welfare and research protections should extend — so negotiability
  judgments should be made relative to that purpose and not to the purpose of solving
  the mind–body problem itself. A theory that is silent on the metaphysics but usable
  for the boundary-drawing is acceptable to us; the reverse is not.


