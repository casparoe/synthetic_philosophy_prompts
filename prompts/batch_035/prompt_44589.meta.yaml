  For some years I have supervised incoming inspection at a testing lab, and I have
  settled into a practice for which I would like the proper name and formulation,
  if one exists. When an instrument I only partly trust gives a reading, I do not
  treat the reading as fact; nor do I ignore it. I move my confidence toward what
  the reading says, but only part of the way — the more dubious the instrument on
  that occasion, the smaller the step. I worked this out on my own, and it was only
  later that I dimly recalled from a statistics course a rule for updating by odds
  that assumes the observation is certainly correct; my practice differs precisely
  in not making that assumption.


  Two features of the practice trouble me, and I would like to know whether the literature
  has carved them.


  First, my trust in the instrument is not fixed. It varies with the reading: I find
  myself crediting the machine more when it confirms what I already suspected, and
  discounting it when it surprises me. I understand this is a bad habit, but I also
  suspect it is not merely a bad habit — it looks as though the proper treatment would
  need to say something about cases where the observer''s reliability is entangled
  with the question at issue, and my proportionality rule has nothing to say about
  that.


  Second — and this is what I most want a name for — when I take two partial readings
  in succession, I sometimes end up at a different final confidence depending on which
  reading I let move me first. I cannot tell whether this order-dependence is my own
  sloppiness, a sign that my procedure is incoherent, or a genuine feature of situations
  in which evidence is less than certain. Does the practice of partial updating have
  an established name and exact formulation? What exactly does that formulation assume,
  and at what point do those assumptions fail? And is the order-dependence itself
  a recognized phenomenon, with its own conditions under which it appears and disappears?
  A bare term will not satisfy me; I want the carving — what the rule says, when it
  applies, and where its edges are.


