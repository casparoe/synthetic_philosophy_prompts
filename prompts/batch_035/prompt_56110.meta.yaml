  the system, it could still want anything, so there''s no intelligence threshold
  beyond which it aligns itself?" The confusion: orthogonality is about possibility,
  not probability; and it doesn''t imply alignment is impossible — actually it''s
  the premise that makes alignment both possible and necessary as an engineering task.
