  Para 1: setting. At our monthly rationalist meetup, a dispute broke out between
  two members — call them Dara and Marcus — over a talk someone gave on long-range
  forecasting, and specifically over the phrase "Malthus was right but early." Dara
  opened by saying Malthus is the paradigm of a falsified theory: the first Essay,
  published in 1798, predicted that population, growing geometrically while food supply
  grew arithmetically, would keep most of humanity at subsistence, and instead the
  two centuries after him saw population rise roughly eightfold while average living
  standards exploded. On Dara''s telling, that''s a clean falsification, and everything
  since has been denial.


  Para 2: Marcus''s replies and the exchange. Marcus replied that what Malthus offered
  was a mechanism plus conditions: absent checks, population presses against subsistence;
  what falsified the timing — fossil fuels, the Haber-Bosch process, the Green Revolution
  — were contingent windfalls the theory never promised would be absent forever, so
  the right verdict is "correct mechanism, wrong timing," and a mechanism that merely
  needs more time isn''t refuted, just early. Dara retorted that "right but early"
  is precisely the rescue move that makes doom theories unfalsifiable: by that standard
  the Population Bomb crowd, who predicted mass famines by the 1980s, were also right
  but early, the Millerites were right but early, and no failed prediction could ever
  count against a theory. Marcus countered that Popper''s model is too crude for structural
  long-run claims: timing depends on variables (rate of innovation) the theory never
  claimed to predict, and the Simon–Ehrlich wager shows the opposite bias — extrapolating
  a decade of falling commodity prices to "resources are infinite" is the same category
  error with the sign flipped. Dara''s last word was that there must be some epistemic
  cost to rescuing: a theory that explains every delay and predicts nothing at any
  specific date has bought immunity too cheaply; Marcus answered that the test should
  be whether the theory forbids anything — Malthusian dynamics rule out, e.g., sustained
  exponential improvements in per-capita welfare for a closed population with unchecked
  fertility, and that''s a real prohibition even if no date comes attached.


