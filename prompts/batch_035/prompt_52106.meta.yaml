  Draft notes:


  Thesis: complexity theory, not computability theory, carries the philosophical weight
  of the "universe as computation" idea, and it does so in three specific ways.


  1. The verification asymmetry. If P ≠ NP, then for a large class of problems, verifying
  a solution is fundamentally cheaper than finding one. This is often glossed as "creativity
  can''t be automated" or "discovery is essentially hard." I want to argue something
  narrower: it gives an objective grounding for the felt difference between understanding
  a proof and producing one — the difference between reading and writing is not just
  psychological but structural, at least for problems in NP that lack known polynomial
  algorithms. (I know that whether this extends to all of what humans find hard is
  exactly what the glossers skip over.)


  2. Worst-case vs. the world. Complexity claims are asymptotic and worst-case: they
  say something about instances as n grows, and about the hardest instances at each
  size. But almost everything interesting in the actual world happens at small n with
  heavy structure. SAT is NP-complete, yet industrial SAT solvers clear instances
  with millions of variables. So I want to claim: complexity theory tells us about
  the shape of the space of problems in the limit, not about the difficulty of any
  actual task; any philosophical argument that moves straight from "NP-hard" to a
  conclusion about human practice (say, about the limits of scientific discovery)
  needs an extra premise about how actual instances are distributed. My tentative
  line is that the extra premise is almost never available, which is why most "philosophical
  implications of P ≠ NP" talk is unwarranted — but that the situation changes for
  cryptography, because there the designer gets to choose the distribution, and worst-case
  hardness is deliberately engineered into instances. Cryptography is the one place
  where complexity theory touches the world directly, and notably it''s the one place
  where we design the world to fit the theory rather than reading the theory off the
  world.


  3. Representation-independence. Polynomial-time reductions are invariant under polynomial
  changes of encoding, which is why the theory feels lawlike rather than notational.
  But the invariance class is chosen by us. A physical system doesn''t come tagged
  with a problem size; someone has to decide what counts as an instance and what counts
  as its size. My claim: complexity classes are properties of our descriptions of
  systems, plus a fact about which transformations between descriptions we''re willing
  to call insignificant. That doesn''t make them unreal — temperature is also about
  our choice of scale — but it does mean that arguments of the form "the universe
  is solving an NP-hard problem whenever it does X" (protein folding, in some popularizations)
  smuggle in a choice of encoding, and can be made true or false by redescribing the
  system. I''d like to defend this while conceding that under any reasonable encoding,
  the class of what''s efficiently computable is stable — that''s why the theory works
  at all.


  The conclusion I''m aiming at: the interesting philosophical content of complexity
  theory is negative and modest. It doesn''t tell us that the universe computes, or
  that creativity is special; it tells us where to look for a gap between checking
  and creating, and it warns us that difficulty is a fact about a pairing of a problem
  class with a distribution, not about tasks. I''d rather end with that than with
