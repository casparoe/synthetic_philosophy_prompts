  ---


  I direct a mid-sized literary prize: roughly 180 novels a year, five judges reading
  over three months, a public shortlist of six, one winner, and a press release we
  have to defend in interviews. Every year the same fight: two judges adored a formally
  daring novel the other three found cold and empty; a crowd-pleasing sentimental
  novel the booksellers love; and a well-crafted book with a moral outlook half the
  panel finds repellent. We have no principled way past the deadlock — we horse-trade.


  I''ve become convinced Hume''s "Of the Standard of Taste" is the most promising
  theory for us: the joint verdict of qualified judges, where qualification means
  practice, comparison, freedom from prejudice, and delicacy. But an essay written
  for eighteenth-century connoisseurs is not a procedure a working panel can run.


  Turn it into one. Specifically:


  1. A judge-selection procedure. How do I operationalize "qualified judge" before
  I''ve seen their verdicts — which observable proxies (breadth of reading, track
  record of reviewing, demonstrated capacity to change their mind) stand in for practice
  and comparison, and where is that substitution weakest? Include what to do about
  the circularity worry: if I pick judges whose taste I already trust, the standard
  just collapses into our pre-existing preferences.


  2. A deliberation protocol for the panel. Hume concedes that even the best judges
  disagree, especially about lesser works. What does that license in our setting —
  ranked voting, discussion thresholds, an obligation to articulate reasons before
  voting? Where should the procedure stop and simply say "this one is a values call"?


  3. What to do about morally difficult works — novels of great craft whose vision
  the panel finds repellent, and the reverse, clumsy novels with admirable hearts.
  Hume seems to say moral faults can''t coexist with the highest aesthetic praise,
  but our judges split on this.


  4. Where the theory has to be distorted to be usable at all, and honest about what
  the distortions cost.


  Then run the procedure on three real-ish cases from our recent years: (a) a formally
  brilliant novel one panelist called "a machine for impressing critics" — immaculate,
  cold, no scene you''d reread; (b) a sprawling sentimental novel with four superb
  chapters and a bloated remainder, beloved by librarians; (c) a novel whose prose
  is merely adequate but whose ending one judge called the most moving thing she''d
  read in a decade, and which two judges dismissed as manipulative tearjerking. One
  of the three should come out a way I won''t like — tell me which and why the procedure
  still says it.


  Finally: what can this procedure not do? What questions about our prize does it
  silently refuse to answer?


  ---


