  Been reading LessWrong/EA Forum for over a decade and I''ve had the same running
  fight with my housemate (met at a meetup, obviously) for about three years. Every
  time a new frontier model drops and someone on twitter says ''basically passed the
  Turing test'', he goes ''the test measures how bad the judge is at telling, not
  whether there''s a mind in there'', and I go ''if you won''t accept behavioral criteria
  you won''t accept any criteria, welcome to solipsism'', and then we go get tacos
  and never resolve it. I want to see the argument actually play out for once instead
  of looping.


  Write a dialogue between us. Set it during a walk home from a meetup where someone
  just demoed an AI that passed a blind conversation test — except it passed partly
  by being strategically mediocre: it misspelled stuff, gave a wrong answer to a geography
  question, and got bored of the judge''s questions, and the judge flagged the actual
  human as the AI because the human was ''too helpful''. I''m the one who thinks indistinguishability
  in genuinely open-ended interrogation is the only non-mysterious evidence of mind
  we''ll ever get — whatever you''d add on top of behavior is something you''d also
  have to add on top of your evidence about other humans, and I don''t see him doubting
  his coworkers. He''s not a qualia mysterian tho, his objection is more like psychometrics:
  the test is indexed to a population of judges, a lazy or friendly judge makes it
  easy, the machine''s optimal strategy is to model the judge''s model of machines
  (since the judge knows one of us is fake), so passing is partly a measurement of
  interrogator blindness, and ''the Turing test'' as a slogan gets its punch from
  smuggling in the five-minute party-game version while cashing out as the years-long
  adversarial version, which nobody''s machine passes. Don''t let him strawman me
  either: I get to point out that you can calibrate judges, restrict to adversarial
  cross-examination, extend the horizon, and that a criterion you improve isn''t a
  criterion you abandon.


  Think of yourself as a philosophy of mind person who has also spent too much time
  around ML evals. Brainstorm the strongest moves for each side before writing, and
  make them actually respond to each other''s specific points — I want to find out
  where the real crux is (my current guess is it''s something about whether ''indistinguishable''
  is a property of two transcripts or a three-place relation between machine, judge,
