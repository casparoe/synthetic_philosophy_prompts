  call the bootstrapping problem or "easy knowledge." As I understand it, there''s
  a family of worries about reasoning that seems to let you confirm the reliability
  of a source using only the source''s own say-so: a temperature sensor that always
  reads consistent with its own self-test, a witness who vouches for his own honesty,
  a color-vision test administered to check whether your color vision is good enough
  to read the test results. Each step looks like ordinary evidence, yet the whole
  procedure feels circular in a way that makes the eventual confidence unearned. My
  problem is the mirror image: I can''t tell, in practice, which of our protocols
  are like that.


  Write me a decision procedure my validation engineers can actually run when a proposed
  verification protocol lands on their desk — maybe two or three a week, and they
  need something they can apply in under an hour, without any philosophy background,
  before recommending sign-off to me. It should: [list of requirements]


  - lay out, in order, the questions to ask about a protocol, with what counts as
