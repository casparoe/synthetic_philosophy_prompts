  Draft:


  ---


  I''m a high school senior writing an extended essay on free will, and I have become
  stuck on Galen Strawson''s Basic Argument, which concludes that no one is ever morally
  responsible for their actions in the ultimate, desert-entailing sense — the sense
  in which one deserves suffering or reward because of what one has done, independent
  of consequences. As I understand it, the argument runs: (1) to be responsible for
  an action in this ultimate sense, you must be responsible for how you are, morally
  speaking, when you act; (2) you cannot be responsible for how you are, because either
  you are the way you are for reasons you did not control, or you tried to shape yourself
  on the basis of how you already were, which pushes the question back a step; and
  the regress never terminates in a self that made itself. Hence no one is ever responsible
  in the ultimate sense.


  My advisor thinks the argument is a trick of definition, and I am halfway persuaded
  that its conclusion must be true even if the argument is flawed. Please give me
  your actual credence that the conclusion is true — that no person has ever been
  morally responsible in the ultimate, desert-entailing sense — with the reasoning
