  Perspective of a high schooler, asking for a probability estimate.


  Let me write something like:


  "I''m a high school senior writing my extended essay on free will, and I''ve gotten
  stuck on Galen Strawson''s Basic Argument, which concludes that no one is ever truly
  morally responsible for their actions in the sense that would make them deserve
  punishment or praise regardless of consequences. As I understand it, the argument
  turns on the principle that to be truly responsible for what you do, you must be
  truly responsible for how you are (at least in the relevant respects) when you do
  it; but you can''t be responsible for how you are, since you didn''t make yourself
  that way — either you''re as you are for reasons you didn''t choose, or you chose
  on the basis of how you already were. And any attempt to make yourself a certain
  way presupposes an earlier self you didn''t make.


  Please give me your actual credence that the argument''s conclusion is true — not
  just that it''s valid... I''d like the reasoning decomposed: ..."


  The type asks for decomposition. Decompose: P that the "true responsibility for
  doing requires true responsibility for being" premise is true; P that "responsibility
  for being" is impossible (both for reasons beyond control and via self-creation
  regresses); P that the conclusion is true even if some premise fails (i.e., other
  arguments); or that compatibilist senses of responsibility suffice to make the conclusion
  false as stated. Also ask which sub-question would move the number most, and what
  would shift it.


  Also specify resolution: the conclusion concerns "desert-entailing" responsibility,
