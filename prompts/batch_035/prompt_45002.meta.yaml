  for actions requires responsibility for how one is), your probability that premise
  (2) is correct even given an infinite regress or an uncaused self, and any further
  terms you think belong, such as the probability that the conclusion would still
  be true even if the argument fails, or that the ultimate sense of responsibility
  is incoherent and so the conclusion is neither true nor false. Give a number and
  one line of justification for each, then the combination, and say which term the
  final number is most sensitive to and what would move it most. I do not want "it
  depends on your concept of free will"; I want the numbers and where the disagreement
  with my advisor most likely lives.


  ---


