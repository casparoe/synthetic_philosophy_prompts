  rationality, higher-order evidence/epistemic akrasia, fine-tuning, quantum immortality.


  Type options: classroom activity, fiction-through-lens, or passage understanding.


  Higher-order evidence + classroom activity could be great: a game where participants
  receive evidence about their own performance (like a calibration test) and then
  must decide whether to trust their first-order judgment or the second-order evidence.
  This is a classic design: give students a quiz, then give them unreliable but persuasive
  feedback about how they did, and see whether they revise. Epistemic akrasia: believing
  p while believing their evidence doesn''t support believing p.


  Design: a quiz with answers they''re confident about; then inject manipulated evidence
  — e.g., tell them the average score, or that a peer scored differently, or that
  the quiz was found to have a bias. The debrief maps to the distinction between first-order
  and higher-order evidence and the akratic combination.


  Need to inject something novel/niche so the answer can''t be regurgitated: e.g.,
  design the higher-order evidence to be about the quiz itself — "the quiz was written
  by a model that has a systematic bias to make one option look right" — or have participants
  receive a note saying their own answer sheet was found to have been graded by a
  grader who was wrong 30% of the time. Or a "peer prediction" twist.


  Alternative: satisficing + classroom game. But higher-order evidence is richer for
  akrasia.


  Let me design: seminar on epistemology, 14 students, 90 minutes. Activity: "The
  Grader" — students take a short forced-choice quiz (say 12 questions on general
  knowledge/logic). Then each receives an envelope with higher-order evidence: e.g.,
  "in a trial run, participants who used pen scored on average 20 points lower" or
  "the answer key was corrupted: the graded version swaps two adjacent answers" —
  some designed to be defeated by first-order checking, some not checkable. They then
  must choose: stick with original answers or revise, with payoffs. The akratic combination:
  a student who believes their answer is correct AND believes they shouldn''t believe
  it.


  Better: split higher-order evidence into (a) checkable (evidence about a specific
  question that can be re-derived) and (b) unilateral (evidence about their own reliability
  that can''t be checked — e.g., "you''ve been randomly assigned to the group whose
