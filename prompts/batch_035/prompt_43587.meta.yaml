  \ Let me draft:\n\nDomain: Sleeping Beauty. Type: grading. \n\nExam question (I\
  \ write): \"Beauty is woken once if heads, twice if tails, as usual. But in this\
  \ version, the experimenter always tells her, on waking, whether it is Monday or\
  \ Tuesday. Wait no — that trivializes.\"\n\nBetter variant that stays in the weeds\
