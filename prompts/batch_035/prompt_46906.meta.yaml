  So the case must exploit one of the theorem''s assumptions: e.g., the agent''s utility
  depends on their beliefs (anticipation utility), or an external commitment device
  exists (an insurance contract that voids on investigation). Specifications:


  - one decision-maker, everyday setting (insurance, medical test, hiring)

  - the information is genuinely free and conditionally verifiable

  - EDT/expected utility agent, rational

  - value of information must be strictly negative, and must not come from beliefs
  having direct utility (no "surprise party" cheating where the fun is ruined by knowing)

  - the negativity must come from the structure of a commitment available before the
  information arrives


