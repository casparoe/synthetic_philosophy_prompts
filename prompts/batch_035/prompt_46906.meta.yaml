  surprise parties, medical test cases, bilking, committed policies). A PhD student
  could ask for a thought experiment where information has negative value for a *third
  party* vs. the decision-maker, or where the "free information" is free but the recipient
  can''t commit to ignore it. Good''s theorem conditions: A is a decision problem,
  E is an event, and the agent gets to choose the act after observing E/¬E. The value
  is non-negative. Negative value arises when: payoffs depend on the information state
  itself (surprise party), when the information isn''t conditionally verifiable /
  you can''t tell you haven''t received it, or when others learn you learned. Good
