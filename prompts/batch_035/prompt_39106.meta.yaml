  Here''s what I believe, as best I can state it:


  (1) The text is the text. A novel is an object made of sentences, and its merit
  or lack thereof lives entirely in the sentences. What the author did at home is
  as irrelevant to that as the author''s tax returns.


  (2) At the same time I think the novel''s real, distinctive value is moral — that
  the form earns its keep by getting you to inhabit lives that aren''t yours, that
  a reader who has lived with a great novel is measurably better equipped for other
  people, and that this is not a happy byproduct but the point of the whole enterprise.


