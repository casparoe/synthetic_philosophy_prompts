  My best friend and I have been going in circles for about a year now on whether
  self-deception is even possible, and I want a diagnosis of why we''re stuck, not
  a ruling on who''s right.


  The setup: he thinks self-deception is a contradiction in terms. To deceive someone
  you need to know the truth and keep it from them. If you''re both the deceiver and
  the target, you''d have to know the thing and not know it at the same time — one
  mind can''t be the con artist and the mark. As a programmer I find his version clean:
  it''s like a function that has to check a condition and also not have the value
  available; the state can''t exist. So on his view, everything people call self-deception
  decomposes into ordinary biased processing — you search harder for evidence you
  like, you demand less of it, you change the subject early, you never run the test
  that could fail. Nothing paradoxical, no spooky divided mind, and once you see that,
  calling it "deceiving yourself" is just a dramatic label for motivated reasoning.
  Call his side the deflationists.


  My problem is that I know cases that feel like more than that. The guy whose marriage
  is obviously failing who "just hasn''t really thought about it," who flinches when
  the topic comes up, who changes the subject a beat too fast, who gets weirdly angry
  at neutral questions — something is being managed there, and "he just didn''t run
  the test" doesn''t seem to capture it. But whenever I try to say what the extra
  thing is, I end up saying stuff like "part of him knows," and my friend immediately
  asks: which part? Is he conscious of it or not? If he''s conscious of it, he''s
  not deceived; if he''s not, nothing is being hidden from him. And then I''m stuck,
  because both answers seem to lose the phenomenon.


  We''ve been at exactly this point for a year. Neither of us has moved and honestly
  neither of us can.


  My current hypothesis (and treat it as just a hypothesis): the disagreement is verbal,
  and it''s really about whether "belief" is binary or graded, or maybe about whether
  the word "knows" is doing personal-level or subpersonal work — he''s answering an
  architecture question about what a mind can represent, and I''m answering a descriptive
  question about whether "he''s deceiving himself" earns its keep as a way of talking
  about people, and we''ve been treating those as the same question. But I''m not
  sure, and there''s a nagging alternative: maybe there''s a real empirical disagreement
  hiding in there about whether the biased-processing story actually explains the
  flinching and the anger, and we just don''t know the psychology well enough to tell.


  So what I want is: (1) a diagnosis of what kind of disagreement this actually is
  — verbal, substantive, two questions under one heading, bedrock intuitions about
  how many "levels" a mind has that neither of us can argue for — using what each
  of us actually says rather than a survey of the literature; and (2) given that diagnosis,
  what would count as progress: a distinction we''re missing, some finding in psychology
  that could move one of us, a change of question, or an argument that we should expect
  to stay stuck and why. Throughout, tell me how confident you are in each claim,
  and single out the point you''re least sure of — I''d rather have an honest hedge
  than you picking a side cleanly.


