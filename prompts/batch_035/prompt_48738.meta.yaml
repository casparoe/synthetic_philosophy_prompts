reasoning_summary: 'Pick a domain and type. Let me think of a good combination.


  Options:

  - Goodman''s grue + recount a disagreement: could work well. Two people arguing
  about whether grue undermines induction, whether "green" is also gerrymandered,
  etc. Good back-and-forth material.

  - Ethics of voting + adjudicate disagreement: also natural — a couple arguing over
  whether to vote for the lesser evil or stay home, with points about expected utility
  (probability of being pivotal ~ 1 in 10 million but stakes huge), expressive voting,
  duty.

  - Species problem + turn into procedure: a conservation officer / museum curator
  deciding whether populations are the same species — operationalize species concepts
  (biological, phylogenetic, morphological). That''s actually a great fit for the
  "procedure" type! E.g., "I work for a wildlife agency and we need a decision procedure
  for whether two populations count as the same species for legal protection..." That''s
  very nice and in-the-weeds.


  The procedure type asks for structured data — a table fits naturally. Let me do
  the species problem as a procedure for, say, someone at a conservation agency /
  a national park deciding whether two rodent populations on either side of a highway
  count as one species or two, for endangered species listing. Or a biosecurity/quarantine
  officer. Or a teacher. Conservation officer works.


  Constraints: fix role, frequency, stakes, who signs off. Worked applications to
  two-three cases, one giving an answer asker dislikes, say what procedure cannot
  do. Ask for a table with specified columns (steps of procedure with columns: question,
  evidence needed, what counts as sufficient, if inconclusive → ...). Then structured
  summary JSON.


  Casual tone, one-two typos, British English, one to three paragraphs.


  Draft:


  "I do biodiversity assessments for a regional environmental consultancy — mostly
  desk work deciding whether two populations should be treated as one species or two,
  which matters because our clients'' obligations (protected species surveys, translocation
  permits) hinge on it. My zoology training taught me there are a bunch of competing
  species concepts — biological (reproductive isolation), phylogenetic (smallest diagnosable
  clade), morphological, and the ones based on ecological niches or gene flow — and
  everyone says ''the species problem'' is unresolved, but nobody ever tells me what
  to do on Monday morning when I have a report due and two populations that morphologically
  intergrade, hybridise a bit where they meet, and sit on separate branches in one
  published phylogeny and one branch in another..."


  Then specify constraints: decisions come up maybe a dozen times a year, stakes high
  (listing can halt a development worth millions, or leave a real lineage unprotected),
  client pressure toward lumping (fewer species = fewer obligations). No genomic lab,
  mostly morphology, published sequence data when lucky. Legal team signs off.


  Ask: write a decision procedure I can actually run — ordered questions, what counts
  as sufficient answer, where it stops with "one species" / "two" / "insufficient
  data, flag for genetics", where it hands off to values/policy judgment rather than
  biology. Then run it on two or three cases: (a) two smooth-looking cricket populations
  differing only in song; (b) orchid populations that look nearly identical but flower
  weeks apart and my field colleague says they''re obviously different; (c) a case
  where the procedure gives an answer I won''t like — e.g., two populations everyone
  informally treats as separate species but the procedure lumps them, or vice versa.
  Also say where the procedure misfires.


  Format: a table of steps with columns: step/question, what evidence, sufficient
  answer thresholds, fallback if inconclusive. Plus a JSON summary with fields per
  case: case name, verdict, confidence, what the procedure couldn''t settle.


  Add one where the answer asker won''t like: e.g., the orchids — everyone treats
  them as distinct, but under my procedure they might come out the same species because
  the procedure (phylogenetic/diagnosability) doesn''t treat flowering time as sufficient,
  annoying the field botanist. Good.


  Casual typos: "intergrate" → maybe "intergrade" fine; add typo like "hybridise"
  is British spelling not typo. Typo: "recieve" or missing word. One or two typos
  allowed: "seperate", "definately". I''ll include "seperate" once and maybe a missing
  comma... just one or two small typos.


  Length: one to three paragraphs. I''ll do three paragraphs plus maybe the format
  request inside third paragraph.


  British English: hybridise, recognise, programme... "analyse".


  No need for web search — nothing quoted, no specific works leaned on. Species concepts
  are general knowledge.


  Write it.


  Also specify frequency and stakes and who signs off: "a dozen of these a year",
  "listings can block a £200m development", "our ecology lead has to sign off, and
  if the regulator disagrees with our call we can lose approved-assessor status."


  Draft the format request: "Could you give me the procedure itself as a table — columns:
  Step, Question asked, What evidence feeds it, What counts as enough to answer, What
  to do if it stays inconclusive — and then a short JSON object at the end with one
  entry per worked case: fields ''case'', ''verdict'', ''confidence'', ''what_the_procedure_couldnt_settle''."


  Also make clear the asker is a bystander not signaling preference? No — that''s
  for the disagreement type. This is procedure type. Fine.


  Include honest misfire points: procedure must flag where species concepts genuinely
  underdetermine the answer (ring species, asexuals, horizontal gene transfer in bacteria
  — maybe mention asexual lineages since biological concept fails; our taxa are mostly
  vertebrates and plants, but include one case with asexual dandelions? Could make
  case (c) an apomictic dandelion group where "species" is basically a counting convention
  — good "can''t settle" case.)


  Three cases:

  1. Two brown cricket populations, morphologically near-identical, differ only in
  calling song and don''t respond to each other''s songs where ranges meet. (Biological
  concept says two; morphological says one — procedure has to arbitrate.)

  2. Two orchid populations, field colleague insists separate because they flower
  four weeks apart and pollinators differ; genetics unavailable.

  3. Apomictic dandelions — asexual, "species" by convention only — procedure must
  say this is a policy/nomenclature decision, not biology, which I won''t like because
  I wanted an answer.


  Good. Write it now, casual, three paragraphs, typos ("seperate", maybe "alot" —
  no, "alot" too glaring; use "seperate" and "definately" or just "seperate").'
