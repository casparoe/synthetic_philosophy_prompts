  \ awakened by \"LOVERS\" stimuli, the dream about winning a skiing trophy... Also\
  \ the point about retro-selection: REM evidence doesn't guarantee that the dream\
  \ content was experienced during REM, because of the \"Cassandra\" ... hmm. Dennett\
  \ also discusses the \"tonal stimuli\" experiment where tones played into sleep\
  \ get incorporated — his point is that incorporation could be retroactive authorship\
  \ during waking, not proof of real-time experience.\n\nSubtle mistakes to plant\
  \ in the student answer:\n1. Misattribute the composition-on-awakening model to\
  \ Malcolm instead of Dennett (too visible? maybe). Better: student says Dennett\
