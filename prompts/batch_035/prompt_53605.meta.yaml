  Tutu, with hearings beginning in 1996. It offered individual perpetrators of politically
  motivated crimes amnesty from both criminal and civil liability, but only conditionally:
  the applicant had to make full public disclosure of the relevant facts, the act
  had to have been politically motivated, and it had to be proportionate to its political
  objective. Both sides of the conflict came within its jurisdiction, including the
  liberation movements as well as the apartheid state, and victims testified in hearings
