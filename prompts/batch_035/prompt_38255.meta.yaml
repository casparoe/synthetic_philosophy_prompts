  representations — is not merely hard but impossible in a strong sense, because of
  what alignment researchers sometimes call inaccessible information. By this I mean
  information that is easy for a learned system to extract and act on but that humans
  cannot efficiently verify or even specify without recapitulating the system''s own
  ontology. My reasoning: (1) if humanly natural concepts were the most efficient
  way to organize the predictive work a large model does, we would expect its activations
  to cluster along our concepts, but there''s no reason evolution or gradient descent
  should favor our ontology; (2) even where a concept like "deception" is partially
  recoverable in today''s models, what makes the recovered feature an implementation
