  Prompt draft:


  ---


  I am a graduate teaching assistant grading final exams for an upper-level undergraduate
  seminar titled Philosophical Probability: Anthropic Reasoning, Puzzle Cases, and
  the Limits of Bayesianism. The exam below is closed-book and taken in person, so
  students were expected to work from lecture material rather than exact citations.
  I have read the answer once and my impression is that it is competent on the whole,
  but I want a careful second pass before I commit to a mark. Please assign a grade
  — a letter grade and a score out of 25 — and then give me the point-by-point comments
  I would write on the exam itself: for each part, say what was earned and what was
  not, identify any specific errors precisely enough that the student could revise
  from the comment alone, and credit anything done well that a grader skimming for
  mistakes might overlook. Where a student''s claim is misleading but not flatly false,
  say so rather than treating it as right or wrong.


  The question was worth 25 points and read as follows:


  The doomsday argument, first formulated by Brandon Carter in the early 1980s and
  elaborated by John Leslie in the 1990s, reasons from the number of humans who have
  lived so far — on the order of tens of billions — to conclusions about how many
  humans will ever live. (a) Reconstruct the argument, making explicit the sampling
  assumption about how you should treat your own birth rank. (b) Explain the self-indication
  assumption and how it is supposed to counter the argument, and give one reason why
  someone might nonetheless reject SIA. (c) Does the choice of reference class — all
  humans? all observers? only those aware of the argument? — undermine the argument?
  Defend your answer.


  One student wrote:


  (a) Carter''s argument, later developed by Leslie, rests on the self-sampling assumption
  (SSA): each observer should reason as though they were a random sample from the
  set of all observers in their reference class. Carter and Leslie built on Richard
  Gott''s Copernican argument from 1993, which uses the same sampling assumption.
  About 60 billion humans have lived before me, so my birth rank is around 60 billion.
  If the total number of humans were in the trillions, my being among the first 60
  billion would be quite improbable, whereas it is unsurprising if the total is only
  a few times the number who have already lived. Bayes''s theorem then tells us to
  update in favor of hypotheses on which humanity''s future is comparatively short.
  The doomsday argument therefore makes a definite prediction: that humanity will
  go extinct within two centuries.


  Hmm — wait, actually — "60 billion" — commonly cited ~60 billion humans ever lived
  (PRB estimate ~108 billion? Actually recent estimates say ~108-117 billion). Leslie
  used 60 billion-ish? Older estimates said ~70 billion; Leslie''s book cites around
  60 billion? The common number in doomsday discussions is ~60 billion (e.g., Wikipedia''s
  doomsday argument uses 60 billion). It''s fine; it''s my question''s own framing.
  The exam question says "tens of billions", student says 60 billion — fine.


  (b) The self-indication assumption (SIA) says that, other things equal, you should
  assign higher probability to hypotheses on which there are more observers, since
  such hypotheses give you more chances of being the one existing. Where SSA penalizes
  hypotheses with huge future populations — they make your early birth rank surprising
  — SIA rewards them in the prior. Under SIA the two effects cancel: the evidence
  of your birth rank neither raises nor lowers the probability of a large future population.
  In fact the cancellation is so exact that SIA does not merely neutralize the argument
  but reverses it: we should end up more confident than before that the future contains
  an enormous number of observers. One might still reject SIA because it seems to
  license believing in huge universes for no empirical reason at all — an objection
  Bostrom pressed with his story of the presumptuous philosopher, who claims he can
  know there are vastly more observers in one theory over another without any data.


  Hmm — Presumptuous Philosopher: SIA implies you should bet on the theory with more
  observers even with no empirical difference. Bostrom presented it as a problem for
  SIA. Student attribution: fine, correct-ish. Bostrom coined it as objection to SIA.
  Good, that''s the student getting something right.


  (c) The reference class problem is often said to be the doomsday argument''s Achilles''
  heel, but I don''t think it does much damage. The argument''s conclusion concerns
  human extinction, so the correct reference class is simply all humans, past and
  future, and it is hard to see how enlarging it to include extraterrestrials or future
  machine observers would change the ratio of past observers to total observers...
  [Wait — enlarging the class to future machine observers WOULD change the ratio if
  they''re vast in number. Let me write the student''s mistake: "...since the fraction
  of observers who came before me is fixed by my birth rank, whatever class we choose."
  That''s subtly wrong: your rank within different classes differs; the ratio of "observers
  before you" to "total observers" is not invariant — with a class including trillions
  of future uploads, your early position is again improbable. So the student''s claim
  that the ratio is invariant is the error.] And if we instead shrink the class to
  only those humans who are aware of the doomsday argument, the argument still applies
  within that class, so the conclusion is unchanged; the choice of reference class
  therefore doesn''t matter either way. [Hmm — is that a mistake? If the class is
  doom-aware observers, SSA applied gives doom soon for that class — which is actually
  a different conclusion (about when doom-aware observers cease) but plausibly similar.
  Bostrom''s view: the reference class problem is serious; conclusions vary with choice;
  no known principle fixes it. The student''s dismissal "doesn''t matter either way"
  is the subtle error — the standard view is that it does matter, and it''s considered
  one of the strongest objections. Also the claim "the correct reference class is
  simply all humans" begs the question. Let me make the student say: "whatever class
  we pick, the ratio of observers before me to observers after me stays the same,
  so the posterior is the same." — that''s the clean subtle mathematical error: rank
  ratios are NOT invariant across reference classes.]


