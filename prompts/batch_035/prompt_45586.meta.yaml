  I am grading a final exam in an upper-level metaethics seminar and would like help
  assessing one answer. The exam question read:


  "Geach''s challenge to expressivism is sometimes divided into two problems. The
  embedding problem concerns how an expressivist can explain the validity of arguments
  like: lying is wrong; if lying is wrong, getting your little brother to lie is wrong;
  so getting your little brother to lie is wrong — where the moral sentence occurs
  unasserted in the conditional''s antecedent. The negation problem concerns which
  state a negated moral sentence, e.g. lying is not wrong, expresses, given that it
  cannot merely be the absence of the state expressed by the unnegated sentence. Explain
  why the embedding problem afflicts expressivism even once it is distinguished from
  simple subjectivism; present Blackburn''s quasi-realist response in terms of higher-order
  attitudes; and explain why negation is often thought to remain a difficulty even
  if the embedding problem is solved."


  Student answer draft:


  "Geach''s point was that subjectivism fails because it cannot keep the meaning of
  a moral sentence constant across embedded and unembedded occurrences. In the argument
  above, if lying is wrong just means I disapprove of lying, then the antecedent of
  the conditional would be about my attitudes rather than about lying, so the argument
  could not be valid in the way modus ponens is. This is supposed to be a problem
  for any expressivist view. But Blackburn''s expressivism is more sophisticated:
  unlike the subjectivist, he does not say that moral sentences report the speaker''s
  attitudes. They merely express them. So when a moral sentence occurs in an antecedent,
  no attitude is expressed at all, and the sentence keeps whatever content it has.
  Since Geach''s argument was aimed at subjectivism, which holds that moral sentences
  report attitudes, it does not apply to Blackburn.


  Blackburn''s positive proposal is that to accept the conditional is to have a higher-order
  attitude: a disapproval of the combination of disapproving of lying while failing
  to disapprove of getting your little brother to lie. Then validity is explained
  by the inconsistency among the attitudes involved: someone who has the attitudes
  expressed by the premises cannot coherently lack the attitude expressed by the conclusion.


  Once this is in place, negation poses no special problem. Lying is not wrong simply
  expresses the absence of disapproval toward lying. If I disapprove of lying, I am
  inconsistent with anyone who lacks that disapproval, and inconsistency is all the
  expressivist needs to explain validity. One might worry that a speaker could fail
  to disapprove of lying while still judging that lying is wrong, but this only shows
  that attitudes can come apart from judgments, which the expressivist never denied.
  Indeed Blackburn''s apparatus generalizes: belief contexts raise the same structural
  issue, and the quasi-realist can treat them in parallel."


