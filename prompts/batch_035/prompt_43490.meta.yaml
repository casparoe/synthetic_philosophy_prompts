  it''s from Augustine/Aquinas tradition — subtle.

  3. Saying the "best of all possible worlds" claim entails that every event is individually
  optimal, when Leibniz''s point is about the world as a whole (laws, simplicity vs
  richness tradeoff) — an individual evil might be necessary for a greater good.

  4. Maybe conflating PSR with the identity of indiscernibles? Or misattributing "unceasing
