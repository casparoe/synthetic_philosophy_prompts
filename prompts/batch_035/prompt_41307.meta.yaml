  as an instrument. On one hand, there is now a whole apparatus of "applied history":
  think tanks run programs that convene historians to advise on current crises, and
  the most successful of these exercises was surely the one built around the "Thucydides
  trap." Graham Allison and his collaborators at Harvard''s Belfer Center popularized
  the phrase in the early 2010s and, to back it, assembled a case file of sixteen
  historical episodes in which a rising power threatened to displace a ruling one,
  of which twelve ended in war; the slogan rests on a line from Thucydides which,
  in Richard Crawley''s translation, reads: "The growth of the power of Athens, and
  the alarm which this inspired in Lacedaemon, made war inevitable." The case count
  is then used, in books like Allison''s Destined for War (2017) and in countless
  op-eds, as a kind of base rate for the U.S.–China relationship: a 12-out-of-16 record
  is cited as a reason to expect, and to work against, war between a ruling and a
  rising great power. Policy schools also teach a more modest technique, usually attributed
  to a pair of scholars who studied how administrations actually reason: place the
  candidate analogy side by side with the present situation, list the similarities
  and the differences, and ask which of the respects of similarity actually mattered
  to the outcome in the historical case.


  Here is what puzzles me. This counting practice coexists, in the same newspapers
  and the same think tanks, with a sharply different attitude toward other historical
  analogies. Invoking Munich — the claim that some adversary is another Hitler and
  that concession is another appeasement — is now treated by editors and foreign-policy
  professionals as an intellectual tic, a sign that the writer has stopped thinking;
  the lesson of 1938 is said to have been "learned" so often, and so badly (the Vietnam
  generation''s debates were largely a war over which of Munich and Vietnam was the
  right template), that the analogy is treated as presumptively misleading. And the
  same people who dismiss Munich-style reasoning on the ground that surface similarities
  (a dictator, a territorial demand) are doing work that structural similarities should
  do will, in the next column, aggregate sixteen "power transitions" spanning five
  centuries into a single frequency, as though Portugal and Spain in the late 1400s
  and Britain and Germany before 1914 were instances of the same kind of thing.


