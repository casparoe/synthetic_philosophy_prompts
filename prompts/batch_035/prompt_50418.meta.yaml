  Analogy candidate: "conventions are like footpaths worn across a campus lawn" —
  this is a real, somewhat common analogy (desire paths / elephant paths used for
  emergent norms, also in urban planning "desire lines"). People lean on it: nobody
  designed it, each person''s step makes it slightly more attractive, and it self-corrects;
  used to conclude that conventions need no enforcement and emerge optimally. Disanalogies:
  Lewis''s conventions involve expectations about others'' behavior (higher-order
  expectations, common knowledge), arbitrary but self-perpetuating alternatives; the
  path analogy lacks the arbitrariness (paths follow the terrain — the desire line
  is "optimal," whereas conventions are often arbitrary among equally good alternatives,
  e.g., driving side). Also the path does not require mutual expectation in the strong
  sense, no alternative equilibria, and no salience/focal point. And used to conclude
  norms emerge without enforcement — but Lewis''s analysis covers conventions enforced
  only by the expectation of conformity; norms that require sanction go beyond.


