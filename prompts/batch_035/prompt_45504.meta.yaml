  to survive a mass extinction) get amplified by positive feedback, and after that
  the alternatives are locked out even when they''d have been just as good, or better.
  History at this level is a sequence of frozen accidents, and knowing the final state
  tells you almost nothing about which options were "best."


  The other — the Attractor camp — is a convergentist in the spirit of Stephen Jay
  Gould''s critics, e.g. Simon Conway Morris: given similar starting materials and
