  ---


  I''m preparing a statement of my epistemological position for a graduate seminar
  on the structure of justification and would like a consistency audit before I submit
  it. Here is the position:


  1. The regress of reasons is genuine, and the demand driving it is correct: whenever
  one belief''s justificatory support comes from another belief, that supporting belief
  must itself have justificatory support of its own. Nothing justifies for free.

  2. Foundationalism fails: there are no self-justifying beliefs, and the idea of
  basic beliefs whose justification is intrinsic to them is, as far as I can tell,
  a myth.

  3. Coherentism fails too: coherence among beliefs cannot generate justification
  that none of them has — a thoroughgoing conspiracy theory whose parts hang perfectly
  together is not thereby one bit more justified.

  4. That leaves infinitism, which I accept: the right structure is an infinite series
  of supporting reasons, each giving support to the one before it, and such a series
  is not vicious.

  5. Since ought implies can, and finite agents cannot complete infinite tasks, the
  series needs only to be available rather than actual: I can satisfy my justificatory
  obligations by being able to go on producing further reasons, one at a time, on
  demand — no completion is ever required.

  6. At the same time, I hold that justificatory work is done only by considerations
  that actually operate in the subject''s cognitive life: a reason the subject has
  never entertained, does not now recall, and does not in any way deploy cannot contribute
  to justifying anything. Mere possibilities don''t justify.

  7. And I hold that my current visual experience of the lamp on my desk justifies
  my belief that there''s a lamp on my desk here and now, without my needing any belief
  about that experience or its reliability. I am not prepared to concede that no one
  has ever actually been justified in believing anything.


  Before I send this off: which of these commitments are genuinely in tension with
  which others, which pairs merely look like they conflict but come apart on inspection,
