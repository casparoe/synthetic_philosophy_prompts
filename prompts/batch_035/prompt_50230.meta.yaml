  are just different toolkits for catching patterns at different grains. I''m not
  asking you to defend it. I want the opposite: a map of where this view is exposed.
  What would have to be true for it to be wrong?


  Not just the standard worry that it''s instrumentalism in disguise. I mean: which
  possible discoveries, cases, or arguments would genuinely count against it, and
  which would a committed real-patterns person rightly shrug off? Some things I''ve
  been chewing on — treat these as leads, not as the whole menu:


  1. The overgeneration problem, as I run it: define the pattern "coin flips I will
  ever actually observe plus the current longitude of Mars". Tracking it compresses
  my predictions about those flips (trivially, since the list is finite and I''ve
  already got it) and supports projection onto... nothing. So Dennett''s own criterion
  — real patterns are the ones that support projection to novel cases — is doing all
  the anti-gerrymandering work, and I can''t see a non-ad-hoc reason why compression
  plus novelty should pick out exactly the patterns we wanted to call real rather
  than some cheaper alternative. If the criterion has to be patched by hand each time,
  hasn''t the view quietly collapsed into "patterns are real iff they''re the ones
  we like"?


  2. The undergeneration side: genuine intentional understanding that doesn''t earn
