  that returns it to where it started, and that this shows cyclic preferences are
  irrational. What I have learned from the recent literature is that this picture
  is far more fragile than the textbooks let on. If the agent foresees the whole sequence
  and reasons by backward induction, it refuses to trade at all; if it can commit
  in advance, it never opens itself to exploitation; and if the trader must cover
  transaction costs, many cycles become unprofitable to milk. So the argument''s force
  apparently depends on auxiliary assumptions about myopia, foresight and commitment
  that are themselves contested.


