  strictly intellectualist one: it transmits skills by delivering customers complete
  bundles of true propositions about the activity in question — everything true about
  swimming, delivered in weekly instalments — and it refuses, as a matter of stated
  policy, to distinguish between knowing how to do something and knowing a way to
  do it.


  The satire should target that intellectualist position, and the humour should come
  from the actual content of the debate, so that a philosopher who knows the literature
  finds it fair rather than a caricature. Specifically, the FAQ should work in, without
  ever naming them as such:


  1. Ryle''s regress: a customer asks why, having received all the propositions, she
  still cannot act on them, and is told that applying propositions requires a further
  skill, available on the Premium tier; the ladder of tiers should visibly never end.

  2. The distinction between knowledge-how and mere ability: a customer who has the
  full proposition set but is in a cast, or has lost her nerve, asks whether she should
