  says early vision is encapsulated; this is the live debate; (3) conflates "literally
  see" with judgment/report; (4) hill-steepness studies are about explicit distance
  estimates, arguably judgment; (5) the conclusion that we should distrust perceptions
  when they flatter beliefs doesn''t follow — discriminability vs criterion (signal
  detection) issue; knowing your perception is biased lets you correct for bias without
