  Draft summary: "A popular cognitive science book I just read summarizes the idea
  of cognitive penetration like this: ''Since the 1940s, psychologists have known
  that perception is not a passive camera but an active inference engine: what you
  know, want, and believe reaches all the way down into early vision, so that hungry
  people literally see food as brighter, tired people literally see hills as steeper,
  and soldiers who fear an ambush literally see more enemies than are there. This
  is why confirmation bias is so hard to fight: the evidence itself is corrupted before
  reasoning even begins, and so the rational response is to distrust your perceptions
  whenever they flatter your beliefs.''"


  Misrepresentations to embed: (1) "since the 1940s" — the new look (Bruner and Postman)
  is a fine reference but the book presents its discredited results (value-driven
  perception) as established when replication failed (the "new look" was largely abandoned);
