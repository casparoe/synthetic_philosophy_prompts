  Actually the cleanest real-life structure: sequential draws / "chance of rain during
  the whole weekend" vs each day. Agent must buy tickets for a Saturday event today;
  event happens outdoors Saturday; the event will be cancelled and refunded if the
  National Weather Service''s *Friday evening* forecast says rain — the agent''s payoff
  depends on the Friday forecast (a chance-like quantity assessed later) rather than
  on the actual weather. The agent knows the Friday forecast chance will be based
  on the same evidence available now plus 48 hours of data, and in this synoptic pattern
