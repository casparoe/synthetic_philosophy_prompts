  "write a dialogue" between two opposing views could work for laïcité vs multiculturalism,
  but that''s common territory — needs a niche angle.


  Let me think about making it in the weeds. The Principal Principle: Lewis''s principle
  that a rational agent''s credence in A given just the objective chance of A and
  admissible evidence should equal the chance. Niche angles: the "moorings" problem
  (Hall), the possibility of undermining futures, CRED laws, chance-credence norms
  with self-locating issues, connection to the Principal Principle being inconsistent
  with the possibility of undermining (Lewis''s own proof in "Humean Supervenience
  Debugged"?). Actually Lewis proved a triviality result: PP + possible undermining
  futures implies absurdity, leading to the "NPPP" or the reformulation in "Humean
  Supervenience Debugged" where chances are contingent... A niche prompt: argue for
  the "Basic Chance Principle" reading, or construct a thought experiment where the
  Principal Principle and the Principal Principle''s cousin for deterministic worlds
  diverge.


  Alternative: thought experiment on PP where an agent must decide whether to defer
  to a chance even when the chance itself depends on the agent''s credences (self-referential
  chance) — like the "Sleeping Beauty" interaction.


  Or a thought experiment: chance is time-dependent; an agent knows the current chance
  of coin landing heads is 0.8, but also knows the chance value is itself caused by
  the macrostate, and the agent''s betting will be recorded in the macrostate... This
  is undermining.


  Dialogue type: a defender of the Principal Principle (defer to chance) vs someone
  advocating an alternative chance-credence norm (e.g., the "CRED" rule from Hall''s
  "Two Proposals for Humean Chance" or Ismael''s norm). That requires knowing niche
  stuff but the prompt can inject the idea itself — describe the alternative norm
  in the prompt so the model doesn''t need to have memorized it.


  Type choice: dialogue between proponent of strict PP deference and proponent of
  a "chance is a summary of the advice the future gives you" view. I can inject a
  new-ish norm: e.g., the agent should defer to chance only to the extent the chance
  assignment screens off inadmissible info, and in the specific scenario the chance
  is "about to change."


  Better: thought experiment construction. "Construct a case where deference to objective
  chance and deference to expert credence come apart." That''s meaningful: the PP
  says defer to chance; the "expert deference principle" says defer to expert probability.
  A scenario where the two norms give different numbers. E.g., a deterministic world
  with no chances, but an expert with calibrated credences — so a chance-deference
  purist can''t use the number while the expert-deference view can. Or where chances
  exist but the expert''s credence diverges from chance because the expert has inadmissible
  info.


  Actually a clean split: chance is 0.5 but an expert who is known to be perfectly
  calibrated and has extra info says 0.7 — and the extra info is inadmissible by definition,
  so PP is silent; expert deference says 0.7. Hmm.


  The domain also includes "deference to objective chance" — so the prompt should
