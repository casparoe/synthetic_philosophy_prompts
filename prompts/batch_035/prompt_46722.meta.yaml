  Realistic undermining scenario: insurance against flooding. If a critical mass of
  homeowners in a floodplain buy insurance, they build more in the floodplain (moral
  hazard: safe behavior is less needed), raising the objective chance of catastrophic
  flood losses. But PP applies to a single agent whose individual bet is negligible
