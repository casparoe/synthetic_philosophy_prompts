  Spec idea: "Build a case where the Principal Principle instructs an agent to keep
  credence p, while the agent''s total evidence makes p look like a chance the agent
  shouldn''t defer to — with the twist that the case must NOT work via inadmissible
  information (the agent must have only admissible evidence), and must not work via
  the chance being wrong or the agent knowing the chance to be wrong."


  Hmm, if all evidence is admissible and the chance is correct, PP says defer — full
  stop. So the designed case must instead be one where PP''s verdict and the "right"
  verdict come apart because... the chance changes between when the agent forms credence
  and when the bet settles, and PP as standardly formulated uses the current chance.
  Case: agent must pre-commit (irrevocably) to a bet now; the agent knows the chance
  will update to q before the event resolves, and knows q. If q > p... then deference
  to current chance says bet at p, but the agent knows that by resolution time the
  rational credence (also by PP, applied at the later time!) will be q. So PP at t1
  conflicts with PP at t2 — and the agent must act at t1. This is a genuine intra-PP
  tension: time-indexed chances make PP diachronically inconsistent for precommitment
  cases. That''s a real phenomenon (chance evolution; conditionalization on chances
  changing).


  Concrete realistic case: A meteorologist scenario. Chance of rain tomorrow at 6pm
