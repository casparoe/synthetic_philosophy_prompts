  disproportionately and neutrality demands... Hmm, French laïcité typically wouldn''t;
  but laïcité as *state neutrality toward comprehensive doctrines* (Rawlsian/Liberal
  laïcité) would demand exemptions when a facially neutral rule disproportionately
  burdens a religion — like the "church of Lukumi" or the Goldman v. Weinberger (air
  force yarmulke) line: a neutral dress code, applied, burdens religious practice;
  liberal neutrality says accommodate; strict laïcité (separation, religion stays
  out of public institutions) says no. So within "laïcité" there are two strands:
  neutrality-based laïcité (which yields pro-religion accommodations, e.g., Sabbath
  exemptions for civil servants — actually France does allow some) vs separationist
  laïcité (religion must be invisible in public institutions).


  The multiculturalist restricting a practice: multiculturalism typically protects
  group practices; but when a practice internal to a minority culture harms members
  of the sub-group (women, children), the multiculturalist faces the internal-minorities
  problem (Kymlicka/Okin debate). A case where the multiculturalist must restrict:
  e.g., a minority cultural practice that systematically disadvantages a sub-minority
  within it — multiculturalism, applied consistently (protect group rights), ends
  up entrenching the internal hierarchy; so the multiculturalist must restrict. This
  is a known problem but the *specific case* is where the weeds live.


  A single case where BOTH happen: Laïcité defends a religious practice AND multiculturalism
  restricts a cultural one. Single case idea: A secular public institution (school
  or pool) in a diverse town. A minority religious group requests accommodation X.
  The majority culture in the town practices a *secular* analog of X that is already
  permitted (or restricted). Twist: make it so laïcité''s evenhandedness compels granting
  the religious accommodation (to match a secular privilege), and multiculturalism''s
  protection of vulnerable sub-groups compels denying it (or vice versa).


  Concrete: Public school in a town. Secular families are permitted to opt their kids
  out of sex-ed on grounds of "parental discretion" (a secular right, no reason needed).
  Religious families ask to opt out on religious grounds. Laïcité purist: religion
  doesn''t get special access — but the secular opt-out already exists, and evenhandedness/neutral
  treatment says: if parental discretion suffices for the secular, it suffices for
  the religious — refusing only the religious opt-out is *taking a stance against
  religion*, which neutrality forbids. So strict laïcité-neutrality, applied, ends
  up defending a religious practice (the opt-out). Meanwhile the multiculturalist
  normally supports such accommodations, but here: the opt-outs are being used almost
  exclusively to keep girls out of the lessons... the accommodation entrenches the
  internal hierarchy of the minority (girls systematically pulled from the class),
  so consistent multiculturalism — which grounds accommodation in the interest of
  vulnerable members — must oppose it. So each view ends up on the *other* side''s
  usual turf: laïcité defending religious accommodation, multiculturalism restricting
  one.


  That''s a genuinely designed case, jointly satisfiable, non-trivial. The "verdicts
