  inadmissible frequency evidence; also conditionalizing on it, 1/6 still. Wait —
  actual rolls are admissible? Lewis: evidence of present and past frequencies...
  Actually information about outcomes of trials on the same chance setup — Lewis says
  admissible information excludes "ordinary" past-frequency? In "A Subjectivist''s
  Guide," admissible = no information about the future, i.e., about the outcome A
  itself... Hmm. In the original PP, admissible E: anything compatible with the chance
  assignment that doesn''t give info about A "beyond" chance. Information about actual
  past outcomes on the same setup is generally inadmissible? No — historical frequency
  data about the same chance set-up is usually considered inadmissible because it
  bears on the chance hypothesis itself... Actually it''s the opposite: past data
  is admissible (it''s in the "history to date"), and the chance in the PP is the
  current chance. If the die is stipulated fair, then data showing 130 sixes in 600
  would be surprising, and the agent should still defer 1/6 — this is the "mooring"
  issue.


