  Thought experiment spec: "Construct a case in which the Principal Principle and
  a plausible expert-deference norm give different credence recommendations — but
  where both norms are right by their own lights: the divergence must come from a
  feature of the case, not from one norm being applied sloppily. Constraints: realistic
  setting (weather, insurance, medicine — no demons, no perfect predictors), the chance
  in play must be stated as a number in the scenario, and the expert must be known
  to be strictly better informed than the agent about the frequency but not about
  the chance. Then: state each norm''s verdict, identify which feature of the case
  does the work, and say what a strict PP-defender would reply."


  Hmm, "known to be better informed about frequency but not chance" — deterministic
  system: expert has run a simulation that resolves the outcome (deterministic physics),
  so the expert''s credence is 0 or 1; there is no objective chance (determinism),
  so PP is silent; expert-deference says defer to the simulation. This is the "deterministic
  chances"/"best-system chances" issue: in a deterministic world, best-system chances
  might still be nontrivial, and a simulation is inadmissible...


  That''s actually a nice designed case: a hospital triage or weather scenario where
  a supercomputer simulation effectively resolves the outcome (deterministic world),
  so an agent following expert-deference acts on near-0-or-1, while a PP-deference
  purist who insists chances are what best-system says (say 30%) gets a different
  number. But "simulation that resolves the outcome" edges toward perfect predictor
  — the constraint says no perfect predictors. Could use "shrewd human" level: an
  experienced forecaster whose track record is strong but imperfect. Then expert deference
  with partial trust: the agent''s credence = mixture. There''s the "mixture deference"
  formula. This is the classic "expert deference" literature (Gaifman, "Deference:
  the case of a pregnant chimp"?). Niche enough.


  Alternative domain: Lakatos. Thought experiment: construct a historical episode
  (fictional) that is ambiguous between progressive and degenerating — spec: "Construct
  a fictional episode in the history of science, described in one paragraph, such
  that under Lakatos''s criteria it counts as progressive at the level of novel predictions
  but degenerating at the level of ad hoc adjustments — i.e., the two components of
  Lakatos''s assessment come apart, with the programme gaining novel-predictive content
  while each successive theory in the chain becomes increasingly baroque..." That''s
  genuinely in the weeds: Lakatos''s distinction between progressive and degenerating
  problem shifts has two dimensions (theoretical progress: novel content; empirical
  progress: corroborated novel predictions) — a case where theoretical progress outpaces
  empirical corroboration is easy (uncorroborated excess content). The harder case:
  each individual change is ad hoc (no novel content), yet the series as a whole gains
  predictive power... interesting: ad hoc collectively but progressive overall.


