  Can I make it work? Laïcité defending a religious practice: the case must be one
  where state neutrality, applied evenhandedly, protects religion. E.g., the state
  bans a cultural practice as part of a secular public-health rule; consistency of
  laïcité (neutrality: the state doesn''t take sides between religious and non-religious
  conceptions of the good) requires the state to exempt the religious practice from
