  should defer to the *forecast that will be made*, not to the *current chance*, because
  the bet settles against the later probability assignment. Deference to a *future
  expert opinion* vs deference to *current objective chance*. That''s the designed
  case: PP (defer to current chance of rain: 40%) vs "defer to the authority whose
  assessment will actually govern the outcome" (Friday''s forecaster, who the agent
  can predict will say 60% in this setup because the pattern always sharpens toward
