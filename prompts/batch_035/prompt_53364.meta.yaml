  I teach a graduate seminar on social ontology, and this semester a student derailed
  my tidy unit on social kinds by asking whether generational labels — Boomers, Millennials,
  Gen Z — pick out real kinds or are just marketing shorthand. I have since discovered
  that I don''t have a settled view, and I''d like yours in a specific form. For the
  purposes of the question, take "real kind" in roughly Richard Boyd''s homeostatic
  property cluster sense: a grouping whose members reliably share a cluster of properties
  because some underlying mechanism (or set of mechanisms) maintains the clustering,
  such that the grouping supports induction and explanation better than arbitrary
  partitions do — and contrast this with a merely nominal cohort partition, where
  nothing but the arbitrary slicing of a continuous demographic variable holds the
  group together. My question: what is your credence that "Millennials" (say, those
  born 1981–1996, per one widely used polling definition) names a real kind rather
  than a nominal one?


  I want a number and a decomposition, not a hedge. At minimum I''d expect terms for
  the following: (1) that there are genuine cohort effects at all, given the age-period-cohort
  identification problem — whether shared formative experiences can leave detectable
