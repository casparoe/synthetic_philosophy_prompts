  that some homeostatic mechanism (shared media environments, common economic entry
  conditions, intergenerational cultural transmission) could actually maintain a property
  cluster across a twenty-year span; (3) that the between-cohort differences are large
  enough relative to within-cohort variance for the grouping to carry inductive weight
