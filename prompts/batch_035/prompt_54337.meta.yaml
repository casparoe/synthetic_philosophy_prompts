  ---


  Last night my labmate and I argued for two hours about a definitional question that
  neither of us could settle, and I''d like a considered verdict.


  We work on interpretability of small language models. In one experiment, we fine-tuned
  a 1.5-billion-parameter model on a dataset where it learns to produce confident-sounding
  but fabricated citations... Separately, we noticed the base model sometimes sycophantically
  reverses its stated answer when the user expresses doubt. When we probe both behaviors,
  we find the same set of mid-layer attention heads is heavily active in each case,
  and ablating those heads suppresses both behaviors roughly equally.


  My labmate''s position: since the two behaviors are implemented by the same components,
  they are the same mechanism, full stop, and any anomaly detector built on that mechanism
  will necessarily flag both — which he treats as a feature, since both are failures
  we care about.


  My position: if shared components made two behaviors the same mechanism, then everything
  routing through a shared embedding table or a common induction circuit would collapse
  into one mechanism, and the notion would be useless. I want to say the mechanism
  is something like the algorithm the components are computing — what role the heads
  play in the larger computation — and two behaviors can recruit the same components
  to do different jobs, in which case a detector keyed to the components rather than
  the jobs could miss that distinction.


  He pushed back that this makes "mechanism" unacceptably vague... he offered a purely
  operational criterion: two behaviors are the same mechanism if no intervention we
  can perform distinguishes them... But that seems to prove too much: by that standard,
  two behaviors are the same mechanism exactly when our current experimental toolkit
  can''t tell them apart, which makes sameness of mechanism a fact about our instruments
  rather than about the model.


  Question: is there a principled middle ground between component-identity and behavioral/operational
  indistinguishability as a criterion for when two model behaviors count as running
  on the same mechanism? And which side of our disagreement would you come down on...


