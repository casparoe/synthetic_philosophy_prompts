  question: is Klara''s narration reliable? And the behavioral criteria: the novel
  inverts the Turing test — we get privileged first-person access that no external
  observer has. The reader becomes the one administering a different test. Good angle:
  the question "is Klara conscious?" is never seriously in doubt for the reader —
  she''s the narrator; the question becomes whether the humans around her treat her
