  to see whether prioritarianism escapes the objection. Key moves: Parfit''s "levelling-down
  objection" original formulation; the distinction between egalitarianism as a claim
  about relations between people vs prioritarianism about absolute positions; whether
  the "bossy" (non-person-affecting) aspects bite; the Otsuka/Voorhoeve move about
  the moral difference between cases; the claim that prioritarianism is a claim about
  benefits to people vs the leveling-down being about worse-off positions.


  A really nice crux: does the leveling-down objection refute prioritarianism, given
  that strong prioritarianism implies that a benefit to the worst-off can matter more
  than a larger benefit to someone better off — and in the limit, that making everyone
  equally badly off could be an improvement? Actually, pure prioritarianism: the value
  function sum f(w) with f concave — a leveling-down (lowering the better-off without
  raising anyone) always reduces total value under prioritarianism? Let''s check:
  if you lower the better-off person''s welfare, f of that decreases; the worse-off''s
  stays. Total goes down. So prioritarianism (standard axiological form) does NOT
  endorse leveling down — unlike telic egalitarianism, where equality is intrinsically
  good, so a pure leveling-down can be intrinsically good (though all-things-considered
  bad). So the standard view: the LDO refutes telic egalitarianism (at least in its
  "there is nothing good about leveling down" form) but prioritarianism escapes because
  it only cares about absolute levels, weighted. Hmm — but does prioritarianism escape
