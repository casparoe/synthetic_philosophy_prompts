  I teach an upper-level seminar on distributive justice, and I''m putting together
  the final exam. I want one essay question on the leveling-down objection, and I''m
  frustrated that every year I get a stack of bluebooks that just recite the telic/deontic
  egalitarianism distinction from Parfit''s "Equality or Priority?" lecture, announce
  that telic egalitarianism is sunk, and stop there. I want a question they can''t
  answer by naming the views.


  Here''s the twist I want to build in, and it comes from a hunch I''ve developed
  grading these things for years (a colleague accused me, over coffee last week, of
  building my hobbyhorse into the exam, and honestly, fair). Students constantly run
  together two claims: (a) that there''s something impersonally good about pure leveling
  down — lowering the better-off while helping no one — which is what actually sinks
  telic egalitarianism; and (b) that it''s objectionable to let someone''s relative
  standing do moral work at all. Standard prioritarianism escapes (a): on the concave-transform
  picture, lowering anyone''s welfare never makes the outcome better, so there''s
  no leveling-down good to deny. But (b) is where the priority view gets hit anyway
  — the Otsuka/Voorhoeve line about how the prioritarian must prefer a tiny benefit
  to the much worse off over a huge benefit to someone slightly better off, which
  strikes students as the same smell. So the interesting question isn''t "does the
  LDO refute prioritarianism" (no, not as stated) but "is the prioritarian''s escape
  real, or did the objection just change shape."


  So, three deliverables. First, the essay question itself: it should set up a concrete
  pair of cases — one pure leveling-down case where the egalitarian and the prioritarian
  give different verdicts, and one case where they agree — and then ask whether prioritarianism
  survives the leveling-down objection only by walking into its cousin. Second, a
  model answer of around 600 words. Third, a marking scheme worth 20 marks total,
  built on five must-hit points, where for each point you say what an A answer does
  that a B answer doesn''t — I''m specifically expecting the top answers to actually
  work through the value functions informally (what happens to the sum when you lower
  one term) rather than gesture at "concavity," and to notice that the two cases I
  ask for can''t be generated without that arithmetic. One more thing: don''t let
  the question or the model answer lean on any literature beyond Parfit''s lecture
  and the Otsuka/Voorhoeve point — the students have a closed-book exam and I don''t
  want the marking scheme to secretly reward citation memory.


