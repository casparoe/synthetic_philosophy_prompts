  Now the interpretations/leaves:

  1. Graham''s semantic reading (names "name" names / the shi-fei adjudication): the
  sentence operates at the level of names — "white horse" and "horse" as disputed
  classifications. Graham''s translation: "White horse is not horse" — distinguishing
  the English "is" of identity, predication, and the "is" of class membership.

  2. Hansen''s kind-denotation / mass-noun reading: classical Chinese nouns are mass
  nouns denoting stuffs/kinds; "white horse" and "horse" denote distinct kinds; fei
  is "is not the same kind as." On Hansen, the sentence is true but not paradoxical
  once translated properly.

  3. Fung Yu-lan''s Platonic/universal reading: "horse" names the universal horseness;
  "white horse" names a compound; the universal is not the compound.

  4. The mereological reading: combining parts (white + horse) yields a part-whole
  structure where the part ("horse" as a partial content) is not the whole. (Sometimes
  associated with later commentators; Chad Hansen criticizes it.)

  5. The eristic/sophistic deflation: the arguments are debate-training tools (the
  school of names as disputers, bianzhe 辩者), possibly satire targets (Zhuangzi''s
  mockery of Hui Shi).

  6. The Buddhist-influenced/deflationary historical reading: the received text is
  partly a Han forgery or later compilation; authenticity questions (Graham himself
  questioned the authenticity of parts).

  7. Mohist-style resolution: the sentence equivocates between identity and predication;
  the Mohists'' Xiaoqu affirms "riding a white horse is riding a horse" because "horse"
  names part of the content of "white horse" (jian/ti, whole/part; datong). On this
  reading Gongsun Long loses to the Mohist Canons.

  8. Reductio/teaching reading: the dialogue is a self-conscious demonstration of
  how "is" (fei in a judgment context) equivocates — Gongsun Long deliberately exploits
  the ambiguity to show names fail to match shi (actualities).


  Also there''s the "instrumentalist/pragmatic" reading: the dialogue as adversarial
