  ---


  I hold a position about metaphysical grounding that I want stress-tested: not the
  standard deflationary line that grounding talk can be paraphrased away, but a more
  specific view with three parts. First, the grounding relation is real and indispensable:
  when we say that the fact that a chess game is won is grounded in facts about the
  positions of pieces and the rules, we are tracking a genuine explanatory relation,
  not a metaphor. Second — and this is the heterodox part — the notion of an absolutely
  fundamental fact is a confusion. There is no level of facts that is ungrounded simpliciter;
  fundamentality is always fundamentality-relative-to-a-set-of-explanatory-interests,
  in something like the way philosophers now accept that confirmation and even chance
  are interest-relative. What physics calls fundamental — the fields, say — is fundamental
  relative to the interests of physical explanation; a chess-theoretic fact can be
  fundamental relative to the interests of chess explanation, and neither sense is
  more fundamental in an absolute sense, because there is no such sense. Third, chains
  of ground therefore need not terminate: a world with no absolutely fundamental level
  is not thereby an incomplete or defective world, any more than a world with no first
  moment is temporally incomplete.


  Tell me what would count against this. I want the defeaters ranked from fatal to
  merely awkward, and I want them to include the ones that would worry a sympathizer,
  not only the ones a partisan of absolute fundamentality would raise — for instance,
  whatever force there is in the thought that grounding is supposed to explain why
  anything exists at all, and my view seems to leave that question either unanswered
  or answered in a circle. Which of my three commitments is each objection really
  targeting, and which commitment, if I dropped it, would cost the view the least?
  Is the interest-relativity clause doing real work, or have I qualified the view
  into something that no possible discovery or argument could count against — and
  if so, is that disqualifying for a metaphysical thesis, or exactly what we should
  expect of a metaphysical thesis? Concretely: what should I say about a defender
  of absolute fundamentality who argues that unless some facts are fundamental absolutely,
  nothing grounds the similarity of grounding structure across different interest-relativizations
  — that it would be a miracle if physics-relative fundamentality and chemistry-relative
  fundamentality dovetailed as neatly as they do unless there were an absolute level
  underneath both? Play it straight: if part of my view is simply wrong, say which
  part and why.


