  function — great for the "verdicts on cases, what principle captures them" type.
  A layperson giving gut verdicts on whether various traits are "for" something, mixing
  forward-looking and backwards-looking intuitions. No web search needed.


  Write casually, British English, typos, 1-3 paragraphs.


  Cases: heart is for pumping blood (obviously). Sickle-shaped beak... Let me design
  cases that split etiological (selected effect) vs causal-role (Cummins) intuitions:


  - Heart pumps blood: fine, both accounts.

  - A first-ever mutant trait in a lone organism that does something useful but arose
  by chance and hasn''t been selected: e.g., a deer born with a weird thicker coat
  in an unusually cold snap, keeps it alive — is the thick coat "for" warmth? Etological
  says no (no selection history), causal-role says yes.

  - Vestigial organs: appendix — is it "for" anything? Neither really.

  - Traits selected for one thing now used for another: e.g., feathers originally
  for warmth/insulation now used for flight — were feathers "for" flight back then?
  Archeopteryx-ish case.

  - Reading: we use our eyes to read, but eyes aren''t for reading.

  - Heart''s muscle contributes to pumping — is the heart "for" the thumping noise
  it makes? The heart makes a sound that doctors use to diagnose — but hearts aren''t
  for making noise.

  - A trait newly repurposed within an individual''s lifetime — a monkey using a stick
  to fish termites.


  Write it as a reflective equilibrium prompt with one hard-to-reconcile pair (the
  deer coat case vs. the reading case — both are novel uses without selection history
  but intuitions differ).


  Write 2-3 paragraphs, casual, typo or two, bystander framing, ask for principle.'
