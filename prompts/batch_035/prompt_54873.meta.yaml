  ---


  After a career as an ornithologist with a state wildlife agency, I have retired
  into philosophy of science and into volunteering as a reviewer for our county breeding
  bird atlas. The atlas asks, for each species, something of the form "every bird
  of species S breeding in the county this decade showed trait T" — every raven record
  a black bird, every golden-winged warbler record from the northern tier — and I
  have realized our verification problem is Hempel''s raven paradox in work clothes.
  Our reviewers are volunteers with no background in statistics or philosophy, each
  handling perhaps thirty records a week at ten minutes a record, and contested cases
  go to the chair. Please distill confirmation theory — Nicod''s criterion, the equivalence
  condition, Hempel''s observation that a non-black non-raven confirms "all ravens
  are black," and whatever background knowledge does to that observation — into a
  decision procedure a reviewer can actually run on an incoming record: the questions
  to ask in order, what counts as a sufficient answer, where the procedure stops with
  accept or reject, and where it hands the record to the chair because the issue is
  the weight rather than the existence of confirmation. Then run it on three records:
  a sharp photograph of a leucistic (near-white) raven; a reported "gray raven" that
  the photo shows to be a gray heron, with no raven involved; and a raven record with
  plumage color never noted by the observer. I expect the procedure will tell me the
  heron counts as confirmation in some sense, and I would like it to be honest about
  how weak that sense is and about where the procedure will misfire.


  ---


