  \ But note: she does take it as slight evidence the jury loves endings of that kind...\
  \ maybe keep it clean: no update.\n\n5. Consoling conditional engineered by a friend:\
  \ \"If anyone from your cohort wins, it'll be you.\" Verdict: raises her credence\
