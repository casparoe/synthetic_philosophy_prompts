  \ the puzzle: Jeffrey conditioning on such a partition raises the probability of\
  \ the antecedent (Blue territory). So the case: \"A friend on the jury's admin staff\
  \ tells me: 'If your book isn't shortlisted, the prize will go to the veteran, twice\
