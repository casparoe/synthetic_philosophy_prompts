  \ is twice as likely to award it the prize as to award the other finalist\" — same\
  \ as above, that's the same case. Need distinct cases.\n\nDifferent cases:\n(a)\
  \ Conditional info about the consequent given antecedent, antecedent improbable:\
  \ gut says antecedent probability unchanged, consequent rises slightly.\n(b) Conditional\
  \ info where antecedent is near-certain: gut says it's effectively like being told\
  \ the consequent-information outright — credence moves a lot.\n(c) Judy Benjamin\
  \ proper: told \"if you're not on the shortlist, the runner-up prize goes to the\
  \ other finalist with probability...\" hmm.\n\nLet me use the actual Judy Benjamin\
  \ structure: told \"if you are NOT in X, then A is twice as likely as B\" — naive\
  \ update raises P(X), which seems wrong. For the novelist: \"If your novel doesn't\
  \ make the shortlist, the prize will go to the debut novelist rather than the veteran,\
  \ twice as likely as not.\" Her gut: this shouldn't change how likely she thinks\
  \ she is to make the shortlist at all — the remark was conditional on her failing,\
  \ so it can't be evidence about whether she fails. Yet she has a nagging sense that\
