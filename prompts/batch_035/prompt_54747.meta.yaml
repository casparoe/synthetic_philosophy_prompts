  Danish novelist" loosely. Safer: just say "Janteloven/Jantelagen, the Scandinavian
  thing about not thinking you''re special". No attribution needed, no quote.


  Cases and verdicts, aiming for tension:


  1. Coworker who gets promoted and, when congratulated, says "mostly right place
  right time": I like it, classy.

  2. Friend who wins a fiction prize and posts about it: fine, good even.

  3. Same friend still steering conversation back to the prize weeks later: not fine,
  insufferable.

  4. Norwegian colleague who takes down her diplomas... fine, her business.

  5. Same colleague telling a new hire to cut his awards from his slide because "we
  don''t do that here": not fine — that''s policing.

  6. My dad who reads out his stock wins at Thanksgiving: annoying but I''d never
  say he''s doing something wrong.

  7. Me deliberately not mentioning my new job title to my cousin who''s been unemployed
  a year: right thing to do.

  8. Me actively lying about it when asked... hmm or me downplaying it so hard that
  it feels like I''m treating her as fragile: starts to feel condescending, not fine?

  9. A friend''s book launch where she cries with happiness at her own party: fine,
