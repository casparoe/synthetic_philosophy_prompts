  Student''s answer (verbatim):


  "(a) First note a geometric fact: a chord is longer than the side of the inscribed
  equilateral triangle exactly when its distance from the center is less than R/2,
  where R is the radius — the side of the triangle is the chord whose distance from
  the center is exactly R/2, and chords nearer the center are longer.


  Method 1: choose the two endpoints of the chord independently and uniformly on the
  circumference. Fix the first endpoint; by symmetry we may put it at a vertex of
  the triangle. The chord is longer than the side just in case the second endpoint
  falls on the arc of the circle opposite that vertex, which is the third of the circumference
  lying between the other two vertices. So the probability is 1/3.


  Method 2: choose a radius of the circle at random, then choose a point on that radius
  at random, and draw the chord through the point perpendicular to the radius. By
  the geometric fact, we need the point to lie within R/2 of the center. The points
  on all radii that lie within R/2 of the center make up the disk of radius R/2, whose
