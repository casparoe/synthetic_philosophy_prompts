  Let me do the grading type with Bertrand''s paradox. Write an exam question about
  Bertrand''s chord paradox, then a student answer with subtle errors.


  Question: "Bertrand''s paradox concerns the probability that a ''random chord''
  of a circle is longer than the side of the inscribed equilateral triangle. Explain
  why there appear to be multiple reasonable answers (give at least two, with their
  probabilities), diagnose the source of the disagreement, and explain what, if anything,
  the paradox teaches about the principle of indifference."


  Student answer: mostly correct — gives the three classical solutions: (1) random
  endpoints: fix one endpoint, chord uniformly random angle → 1/3. (2) random radius:
  choose a radius and a point on it, chord perpendicular → 1/2. (3) random midpoint:
  uniform over disk interior → 1/4. Subtle mistakes to embed:


  - Mislabeling a probability: say the random-endpoint method gives 1/2 and the midpoint
  method gives 1/3 (swapped), or the random-radius gives 1/3 instead of 1/2. Actually
  the correct: endpoints → 1/3, radius-point → 1/2, midpoint → 1/4. A subtle error:
  student says endpoints method gives 1/3 correctly, but says midpoint method gives
  1/2 and radius method gives 1/4 — swapping. Or a more subtle conceptual error: student
  claims the paradox shows the principle of indifference is inconsistent whenever
  the sample space is continuous, or claims it''s resolved by specifying a uniform
  distribution over chords — but "uniform over chords" is exactly the problem since
  there''s no unique uniform measure. A subtle mistake: student says Jaynes''s solution
  (invariance under rotations/translations/scalings) is "just an application of the
  principle of indifference," or claims it resolves the paradox definitively. Also
  student could claim that Bertrand intended the paradox to show probability theory
  is inconsistent, rather than underdetermination of the randomization procedure.


  Also a subtle mistake: "the chord is longer than the side of the triangle exactly
  when its distance from the center is less than half the radius" — that''s actually
  correct (side of inscribed equilateral triangle is at distance R/2 from center).
