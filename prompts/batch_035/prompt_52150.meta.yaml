  Student answer text:


  "Putnam''s point is that two speakers can be exactly alike internally and still
  mean different things by the same word. On Earth ''water'' refers to H2O and on
  Twin Earth it refers to XYZ, even though the speakers on the two planets are identical
  in the head and nobody in 1750 could tell the liquids apart. So the extension of
  the word is fixed by what''s actually in the local environment, not by anything
  about the speakers. As Putnam puts it, "meanings" just ain''t in the head. In fact
  the word behaves something like an indexical: ''I'' picks out different people for
  different speakers without any difference in their heads, and ''water'' likewise
  picks out whatever liquid bears the right relation to the stuff in the speaker''s
  environment.


  The division of linguistic labor explains how this is compatible with ordinary ignorance.
  Most people who use ''water'' couldn''t say what its chemical composition is, and
  they don''t need to: the community''s experts know, and the layman''s word gets
  its extension from them. If chemistry later worked out the microstructure, the word
  had been tracking it all along. Putnam makes the same point with his other famous
  example, the patient who tells his doctor that he has arthritis in his thigh: the
  community''s usage of ''arthritis'' fixes what the patient means, so his word misapplies
  even though from inside it feels like he means the same thing the doctor means.
  Both cases show that whether a person''s word applies to something can be settled
  by facts about the community and the world that the person has no access to.


  As for 1750 specifically: since the two liquids were observationally identical back
  then, Earthians and Twin Earthians meant the same thing by ''water'' — the word
  expressed the same concept on both planets, something like ''watery stuff''. The
  meanings only came apart later, once chemistry identified H2O and XYZ, and after
  that ''water'' was effectively two different words. So ''water is H2O'' wasn''t
  true yet in 1750; it became true when chemists established the identity. The overall
  consequence is that meanings aren''t in the head, so two speakers in the same psychological
  state can differ in what they mean, and psychology can''t be purely individualistic
  if it individuates beliefs by content."


