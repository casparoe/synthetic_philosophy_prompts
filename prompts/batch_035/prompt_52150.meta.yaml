  Set the scene several centuries back — say 1750 — so that no one on either planet
  has any way of telling the liquids apart chemically, and suppose the Earthling and
  his twin on Twin Earth are molecule-for-molecule identical ''in the head'': same
  internal states, same dispositions, and neither knows any chemistry. What does Putnam
  think this shows about the meaning of ''water'' in 1750? What does his ''division
