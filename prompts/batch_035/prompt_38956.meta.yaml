  Commitment races: the idea (from e.g. MIRI/LessWrong discussions) that in bargaining
  situations, agents race to make commitments earlier than each other, and early commitments
  can be made from positions of poor information, leading to bad outcomes. Key concepts:
  commitment, bargaining, Schelling points, ultimatum dynamics, transparency, unilateral
  commitments, "commitment race" problems where being first to commit wins but everyone
  commits too early with insufficient information.


  A verdict-type prompt on commitment races: the asker gives verdicts on cases of
  whether making a commitment early is wise/rational. E.g., cases: irrevocable commitment
  to a demand in bargaining that is credible — good; precommitting before having information
  — bad; two agents both precommitting early leading to disaster — bad; a commitment
  that''s flexible/rescindable — no benefit; commitment made with probability of info
  arriving later... Hard-to-reconcile pair: committing early wins the race, but early
  commitment made under ignorance seems irrational; the asker thinks early commitment
  is both advantageous and unwise.


  Alternatively a thought experiment construction: build a case where making an irrevocable
  commitment first is good for one agent but the joint outcome is worse for both —
  standard. More interesting: build a case where two rational agents both regret...
