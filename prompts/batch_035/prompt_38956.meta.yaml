  does better than the one who commits first" — reversing the usual direction. Or
  a case where a commitment race leads to a Pareto-worse outcome without any agent
  making an error — the race happens even though both agents are rational and foresee
  the outcome. Constraints: realistic (business negotiation, not AI superintelligences),
  the race must not depend on either party being irrational, and the disastrous outcome
  must not come from an obviously bad commitment.


  Let me consider which type works best. The verdicts type on commitment races: cases
