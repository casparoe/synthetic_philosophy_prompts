  Add specificity: mention it''s supposedly about agents sharing information, common
  knowledge, priors. Maybe mention that the quant friend said something about "if
  we''re both rational and we both know what the other knows, we''d end up with the
  same credence." Also whether it applies to taste/judgment about fiction — do posteriors
  over whether a character rings true even make sense, and does the theorem say anything
  about values.


  Also seeding: ask about which readings make argument pointless, which make it the
  opposite (the theorem is about what happens after full disclosure). And maybe: what
