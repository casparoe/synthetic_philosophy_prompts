  the slogan would condemn it.


  Length: 2-3 paragraphs. Casual. Include a typo, e.g., "definately" or "recieve"
  — one or two.


  Also from novelist perspective: mention craft — as a novelist she cares about disagreement
  being endless. Maybe: "in my line of work disagreement between reasonable people
  is the whole raw material."


  Write it now.'
