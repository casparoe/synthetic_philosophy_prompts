  Draft:


  ---


  I''m a second-year PhD student in sociology, and our theory seminar recently spent
  two weeks on Marx''s Preface of 1859 and the debates it spawned. I kept noticing
  a pattern in how the theory is defended, and I want to know whether it has a name,
  or whether someone needs to coin one.


  The theory says the economic base — the forces and relations of production — determines
  the superstructure: law, politics, religion, art, philosophy. That''s the strong
  reading, and it''s how the Preface is usually first presented. Then the counterexamples
  arrive, and the defense always takes one of two forms. Either the allegedly independent
  phenomenon is shown to be economic after all (the religious revival is traced to
  insecurity produced by the market; the persistent legal form is traced to the interests
  it serves), or the theory is quietly narrowed: the superstructure is granted relative
  independence and allowed to react back on the base, with the economy determining
  only in the last instance. I''ve since learned that this second move isn''t some
  later embarrassment — Engels himself was making it in letters in the early 1890s,
  insisting that he and Marx had never claimed the economy was the only determining
  factor. So the escape clause isn''t improvised under fire; it''s built into the
  theory''s official formulation from early on. What I want a name for is this whole
  configuration: a theory that (a) announces its own exception in advance, (b) phrases
  the exception so vaguely that no possible observation could tell us when the last
  instance has arrived and when it hasn''t, and (c) thereby seems to make itself immune
  to counterexample without anyone ever adding a single ad hoc hypothesis after the
  fact. I know Popper''s story about immunization, and I know an ad hoc auxiliary
  hypothesis is bad because it''s bolted on afterward; but here nothing is bolted
  on, and I can''t tell whether that makes the theory better or worse. Is there an
  established concept for a pre-announced, contentless escape clause — and if not,
  can you coin one and define it so it''s distinguished both from ordinary ad hoc
  rescue and from ordinary ceteris paribus qualifications (like "in the long run,
  prices track costs"), which also announce exceptions in advance but seem scientifically
  respectable? Where exactly does the difference lie — is it that the respectable
  versions specify a timescale or mechanism, so that some observations would show
  the exception has lapsed?


  Please structure your answer as: (1) "Nearest concepts," a short paragraph each
  on the closest existing ideas and what each gets wrong about my case; (2) "The difference
  that matters," a paragraph isolating what actually distinguishes a legitimate pre-announced
  qualification from a contentless one; (3) "A name," where you either give the established
  term or coin one with a definition and two boundary cases; and (4) "Where this leaves
  historical materialism," three or four sentences applying your distinction back
  to the last-instance clause and saying, honestly, whether the theory as Engels qualified
  it comes out immunized or testable.


