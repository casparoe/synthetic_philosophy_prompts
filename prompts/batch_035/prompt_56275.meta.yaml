  What I believe:


  1. A thought experiment and a piece of fiction work by the same mechanism: you get
  the reader to concretely simulate a scenario and report — or just feel — their response.
  Philosophy just pretends otherwise.

  2. Vividness is legitimate. If I write the fat man on the footbridge well enough
  that the reader feels the shove, their reaction is real data about them. Making
  the scene vivid isn''t cheating, it''s the method.

  3. But I also believe the experimental philosophy stuff, at least as I understand
  it: run the same dilemma with different framing, different order, different demographics,
  and the intuitions flip. And evidence that flips when you re-stage the scene isn''t
  evidence.

  4. Some of the classic cases are unfilmable. I genuinely cannot visualize Mary knowing
  every physical fact about color while never having seen red, and I can''t visualize
  a world physically identical to ours with nobody home. My claim: a case you can''t
  render concretely can''t elicit an intuition at all — there''s nothing there to
  respond to. So those pumps pump nothing.

  5. And yet my reaction to the teleporter case — step in, scanned, destroyed, replica
  walks out — feels completely solid to me. If I imagine it as destruction-plus-copy
  I''m horrified; imagine it as instant travel and I''m fine. I would trust the horrified
  version in an argument.

  6. I know Dennett-type complaints that intuition pumps get rigged by tendentious
  details in the setup, and honestly I rig scenes for a living — it''s called characterization.
  That feels like it should be hypocrisy but I don''t think it is, and I''d like someone
  to check that.


  The plan for the book: a sequence of escalating cases — protagonist''s memories
  replaced gradually, then all at once, then a copy — and the reader''s shifting sympathy
