  Perspective: longtime reader of rationalist blogs/forums (LessWrong). Formal/polished
  prompt.


  I need cases where the person''s gut verdicts are hard to reconcile — e.g., some
  maxims seem wrong under universalization trivially, others seem fine even when universalization
  causes collapse. Classic issues: the "perfectly selfish loner" (maxim of beneficence
  — universal non-beneficence doesn''t contradict, so Kant''s own test needs a different
  step); the lying promise case (contradiction in conception); the non-beneficence
  case (contradiction in willing — universal egoism undermines one''s own ends requiring
  others'' help). The asker gives verdicts on cases: e.g., lying promise case fails;
  the "developing talents" case — they think universal laziness is fine but the maxim
  still fails; the "trivially universalizable" maxims: "shopkeeper honest only when
  profitable" — universal honesty-when-profitable is consistent, yet intuitively fails.
  Or "I''ll free-ride on public goods." Also a hard pair: a maxim like "smoke marijuana
  in private" universalizes fine but they think it''s fine — consistent; but "I''ll
  only vote if my vote might be decisive" — universal abstention means no election,
  but they think voting is supererogatory, not forbidden.


  Craft a set of verdicts with at least one hard-to-reconcile pair. E.g.:


  - Lying promise to repay when I don''t intend: fails, obviously (contradiction in
  conception).

  - Free-riding on group project while others work: fails; but the contradiction seems
  contingent (others might work anyway), yet they still want it to fail — contradiction
  in willing vs conception distinction.

  - Maxims of convenience: "I''ll answer emails only when I feel like it" universalizes
  fine, and they think it''s fine.

  - Perfectly selfish loner who needs nobody: maxim "refuse help to anyone, seek none"
  — they think it''s permissible, though cold; universalization is consistent. But
  "refuse help while relying on others when needed" fails.

  - Hard pair: maxim phrased loosely "I''ll take the last seat on the bus whenever
  I see one" — universalized is consistent, and they think it''s fine; but "I''ll
  cut in line whenever I''m in a hurry" they think is wrong, and universalized that''s
  also consistent (a world of line-cutters in a hurry could exist, just unpleasant).
  So two structurally similar cases, different verdicts. That''s the hard-to-reconcile
  pair: both consistent under universalization, one fine, one wrong — so pure contradiction-in-conception
  test can''t capture it, need "contradiction in willing" / treating humanity... but
  then what distinguishes them? The answer must choose.


  Also the asker may offer a tentative principle: something like "a maxim fails if
  universalizing it would undermine some institution or practice that the agent must
  rely on in the very act" (contingent reliance test). That''s the "false promising
  needs the institution of promising" idea.


  And a further case the asker goes back and forth on: e.g., "I''ll pirate movies"
  — free-riding on a price system; or anonymous littering; or "I''ll not tip when
  I''m traveling through a town and won''t return" — seems fine under the reliance
