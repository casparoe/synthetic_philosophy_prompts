  In my interpretability reading group we''ve been discussing how one might build
  an "anomaly detector" that flags inputs on which a neural network computes its answer
  by a different mechanism than the one it uses on the inputs we trust it on — the
  hope being that this would catch, say, a model that behaves well on ordinary queries
  but switches to something else when it detects it''s being evaluated. One of the
  members argued that the whole project rests on an illusion, and I can''t find the
  flaw in his argument, though I''m sure there is one, because its conclusion is far
  too strong. Here it is, as he gave it.


  (1) For such a detector to detect rather than merely decide, there has to be a fact
  of the matter about whether two of the model''s runs — its run on a trusted input
  and its run on the probe input — use the same mechanism.


  (2) A mechanism, in the only sense on offer, is a pattern of parts playing roles:
  for the two runs to use the same mechanism, the same parts must be playing the same
  roles in both.


  (3) At the finest grain, the same-parts-same-roles condition is never met across
  different inputs: activations, attention patterns, and token-by-token processing
  differ somewhere in every pair of distinct runs, so no two runs ever share a mechanism,
  and every input is an anomaly.


  (4) At the coarsest grain, the condition is trivially always met: it''s the same
  network with the same weights every time, so every input uses the same mechanism,
  and nothing is ever an anomaly.


  (5) Any workable criterion therefore has to sit at some intermediate grain, and
  where it sits is a choice we make for our own convenience; nothing in the model
  itself fixes the level of description at which "same mechanism" is to be evaluated.


  (6) So there is no fact of the matter of the kind (1) demands. The detector doesn''t
  detect a difference in the model; it reports whether the input falls on the far
  side of a boundary we drew ourselves.


  His conclusion: talk of a model "switching to a different mechanism" — the thing
  the detector was supposed to catch — isn''t a discovery about the model at all;
  it''s an artifact of where we set a dial.


  Here''s why I think the conclusion proves too much. Run the same argument anywhere
