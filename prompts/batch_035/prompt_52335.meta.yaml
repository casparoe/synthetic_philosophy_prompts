  player has started calculating out loud instead of blitting memorized patterns...
  hmm need better examples: that your car''s engine is running the same way it did
  before the tune-up; that a student is now solving these problems by a different
  method than the ones she used last month; that two programmers implementing sorting
  are doing the same thing. If (3) through (6) are right, all of these are projections
  of our choice of grain, not facts — and that seems wrong. But I also can''t see
  which step to reject without paying somewhere. (3) and (4) look like plain observations
  about description levels; (5) looks like a modest point about convention; rejecting
  (6) without rejecting (5) would take some explaining.


  I''d most like to keep (1) — the idea that the detector is answering a question
  about the model, not about us — and I''m prepared to give up almost anything else.
  Tell me which step is the bad one, why it looked so hard to resist, and what I have
  to pay for rejecting it.


