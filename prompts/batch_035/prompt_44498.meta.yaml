  few thousand dollars to several hundred thousand, each documented because the outcomes
  are audited when a grant is questioned. The committees'' standing complaint is not
  that they choose badly but that they cannot stop choosing: vendors keep submitting
  proposals past the deadline, a search for "what else is out there" never terminates,
  and the same committee can spend three meetings on a $6,000 decision. My advisor,
  who is fond of Simon, has asked me to translate bounded rationality into something
  the committees can actually run, and I would like your help drafting it.


  What we want is a decision procedure for when to stop generating options and commit
  to one — a stopping rule, in effect — that a committee of non-specialists can execute
  inside a single ninety-minute meeting with no math beyond counting and no software.
  It should be grounded in the bounded rationality tradition: search is costly, aspiration
  levels rather than optimization, the distinction between a satisfactory option and
  the best option. But the translation is where I keep getting stuck, and I want you
  to take the following complications seriously rather than smoothing them over.


  First, aspiration levels in the literature are allowed to adjust as the search proceeds
  — Simon himself made the adjustment of aspirations central — but committees adjust
  them in a specific way that I have not seen discussed: after a surprisingly strong
  proposal arrives, the committee''s standards ratchet upward, so that options that
  would have counted as satisfactory last month no longer do. Whether that upward
  drift is legitimate (they learned the market is better than they thought) or illegitimate
  (it is regret and social comparison dressed up as evidence) seems to depend on facts
  the procedure can''t see. The procedure has to say something about when aspiration
  adjustment is allowed and in which directions.


  Second, option arrival is asynchronous. There is no natural point at which the option
  pool is complete; new proposals arrive while the committee deliberates. So the procedure
  needs two separate stopping decisions — when to close the pool to new options, and
  when to stop evaluating the ones already in hand — and I suspect these come apart
  in ways that matter.


  Third, sunk costs. Committees that have spent four meetings on a search refuse to
  commit to the satisfactory option on the table because "we''ve come this far, there
  might be something better." Any honest procedure has to handle the case where its
  own rule says to stop and the committee''s psychology says to continue.


  Please write the procedure: the questions to ask, in order; what counts as a sufficient
  answer to each; where the procedure stops with a commitment and where it stops with
  a stop-searching-but-don''t-commit-yet; and where it hands the decision to the committee
