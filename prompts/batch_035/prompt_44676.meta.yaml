  whatever works best — across a series of escalating cases, arranged so that they
  first feel the pull of counting heads, then feel the pull of not counting heads,
  and finally can''t settle which pull to trust.


  The activity should work in stages something like this, though you should improve
  on my sketch: early rounds pit one victim against one victim where the only difference
  is personal detail (revealed in stages, so students see how much the detail does);
  later rounds pit one against several, with the details of the many deliberately
  thin; then a round in which a fair lottery over everyone is made available but carries
  a cost; and a final round in which the class must vote as a committee while one
  student is designated as the individual who would be saved or lost, and has to sit
  there while the committee deliberates. No real money or payoffs needed; use cards,
  envelopes, a timer, and role sheets. The students should not be told the name of
  any position or author during the activity — they should build the positions themselves,
  and only in the debrief should the facilitator attach names to what they said, including
