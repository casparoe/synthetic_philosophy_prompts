  Draft:


  ---


  I am grading blind the midterm examination for an upper-level undergraduate course,
  Moral Psychology and the Theory of Action. The final question on the exam, reproduced
  below, comes from our unit on moral worth and acting for the right reasons; one
  student''s answer follows it, exactly as written. Please assign a letter grade (with
  plus or minus) and supply the specific written comments that justify it, in the
  form of point-by-point marginal notes keyed to the individual claims of the answer.
  For each substantive claim, say whether it is correct, correct but misleadingly
  stated, or mistaken, and what the mistake consists in where there is one; do not
  grade fluency, organization, or prose. Please also state, in a closing note, what
  the answer would have needed to receive full credit. Treat the question''s own framing
  as authoritative for the purposes of grading.


  The exam question read as follows:


  "For Kant, what distinguishes actions that have moral worth from actions that lack
  it? In your answer, explain the work done by each of the following from the Groundwork:
  the prudent shopkeeper who deals honestly from self-interest; the naturally compassionate
  person who helps because he enjoys helping; and the person whose sympathy has been
  extinguished by grief yet who helps nonetheless. Distinguish carefully between acting
  from duty and acting merely in accordance with duty, and say whether moral worth,
  on Kant''s view, requires that inclination be absent or opposed. Finally, explain
  how Nomy Arpaly''s account of moral worth — on which moral worth lies not in acting
  from duty specifically, but in acting for the reasons that make the action right,
  a responsiveness that can be unconscious or unendorsed by the agent herself — departs
  from Kant''s, and how it handles the case of Huckleberry Finn, who helps Jim escape
  while sincerely believing that he is doing wrong."


  The student''s answer reads as follows:


  "Kant holds that whether an action has moral worth is determined not by what the
  action is or what it brings about, but by the maxim from which it is done. Two actions
  can be alike in every outward respect and differ entirely in moral worth. The distinction
  doing the work is between acting from duty and merely acting in accordance with
  duty. The shopkeeper is honest because honesty is good for business: his honesty
  conforms to duty but is done from self-interest, so it has no moral worth. The naturally
  compassionate person who helps others because he takes pleasure in helping is in
  the same position: his actions conform to duty, but because they flow from inclination
  rather than from respect for the law, they have no moral worth either — indeed Kant
  condemns them as selfish. The case that reveals where moral worth lies is the grieving
  man whose sympathy has been extinguished yet who helps anyway: this action has moral
  worth because it is done from duty. The lesson of these examples is that for Kant
  moral worth requires the absence or opposition of inclination. The action with moral
  worth is the one performed against inclination, since only where inclination points
  away from duty can we tell that the agent acts from duty and not from something
  else. Where inclination and duty happen to coincide, the action''s true motive is
  unknowable, and it is best treated as lacking moral worth.


  Arpaly shares Kant''s thought that moral worth depends on why the agent acts rather
  than on consequences, but she widens the class of worthy motives beyond duty. On
  her account, an action has moral worth when the agent acts for the reasons that
  make the action right, whatever those reasons are; the worthy agent is one whose
  conduct is responsive to right-making reasons. This might seem to make moral worth
  depend on the agent''s moral opinions, and in a way it does: for the agent to be
  acting for the right reasons, she must at minimum judge that her action is right.
  Someone who does the right thing while believing it is wrong is not acting for the
  reasons that make it right — she thinks those reasons do not apply. That is why
  Huckleberry Finn, who helps Jim while convinced he is doing wrong, has no moral
  worth on Arpaly''s account; his behavior may be lucky or charming, but he is not
  responding to right-making reasons, since he does not take there to be any. The
  contrast with Kant is thus narrower than it looks: Kant locates worth in the motive
  of duty and Arpaly in the judgment of rightness, but both agree that moral worth
  travels with the agent''s conception of her own obligation."


