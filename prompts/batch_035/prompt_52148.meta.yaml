  its own lifetime — even a tiny habit is out of reach — since natural selection has
  to do all the work. An example would be a bacterium.


  Skinnerian creatures get an upgrade: they can be conditioned, meaning behaviors
  that get rewarded happen more often and behaviors that get punished happen less.
  So the error correction moves into the lifetime of the individual. A rat in a Skinner
  box is the obvious example. They figure out which behavior worked by thinking it
  over after the reward arrives.


  Popperian creatures go one better: they can test out candidate behaviors offline,
  in an inner model, before acting, so the bad options die in the model instead of
  the creature dying in the real world. This is named after Popper''s view of science
  where conjectures get refuted and discarded. The first kind that can also learn
  by watching others — a monkey that sees another monkey get sick from eating a berry
  avoids the berry. So chimps are a good example.


  Gregorian creatures (named after the psychologist Richard Gregory) use mind-tools:
  words, maps, diagrams, methods — tools for thinking that we pick up from our culture.
  The advantage is mainly that language makes thinking much faster, and humans are
  born with these tools already installed. Example: obviously, us — a human engineer
  using a flowchart.


  Why it matters: for Dennett the progression shows that mind isn''t magic, it''s
  a series of engineering upgrades for the problem of deciding what to do next, with
  each upgrade making the search for good actions cheaper and safer."


