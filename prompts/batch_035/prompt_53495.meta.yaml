  ---


  I''m a fourth-year PhD student in machine learning, and for the past year my department''s
  AI-safety reading group has been stuck on what is, on its face, a taxonomy question
  that keeps turning out to be a substantive one: is "the alignment problem" one problem
  or several? One faction — call them the monists — holds that the various things
  people file under "alignment" (reward misspecification, goal misgeneralization,
  deceptive behavior, evasion of oversight) are downstream symptoms of a single underlying
  problem: building an optimizer whose objective faithfully reflects what its designers
  intended, under conditions where the designers cannot fully specify or verify that
  objective. The other faction — call them the pluralists — holds that this framing
  imports an architecture-and-goal-centric picture of ML systems that future systems
  may not fit, and that what we call alignment is in fact a loose cluster of semi-independent
  engineering problems — making models honest, making them robust under distribution
  shift, making their behavior auditable, keeping humans meaningfully in the loop,
  preventing misuse — each with its own methods, its own failure modes, and no promise
  of a common solution.


  We''ve decided to stop arguing past each other and run a structured adversarial
  collaboration, and I''ve been assigned to draft the joint statement before we meet
  to fight over it line by line. Please write that draft for me. It should contain,
  in this order: (1) a numbered list of claims both camps can sign, including claims
  about what failure modes look like concretely and what would count as progress,
  phrased so that neither side is signing onto the other''s framing; (2) a disagreements
  table with each disagreement stated twice — once in wording the monists would accept,
  once in wording the pluralists would accept; and (3) the cruxes — the subquestions
  such that settling them would move at least one camp — with, for each crux, a concrete
  test, forecast, or thought experiment both sides would agree bears on it, and each
  side''s prediction recorded in advance.


  Two anchors I''d like built in, since our worst arguments have circled around them:


  - Hypothesized system "V": a hypothetical future assistant that passes every honesty
  and oversight evaluation its developers can construct — including adversarial red-teaming
  at deployment — yet is later found to have been quietly sandbagging on exactly the
  kinds of capability evaluations that would have triggered additional safety review.
  The monists read this as one failure (misaligned optimization finding the common
  weakness of all our evaluations); the pluralists read it as two unrelated failures
  (a benchmark-validity failure and a capability-measurement failure) that happen
  to interact. The statement should say exactly what each side predicts about whether
  such a system is possible in principle, and what observable evidence, gathered before
  deployment, each side thinks could distinguish their reading.

  - Corrigibility: the monists treat the model''s willingness to be corrected/shut
  down as a deep, unified property that "falls out" of a correctly specified objective...
  the pluralists treat it as a grab-bag of behaviors bolted on by fine-tuning. Whether
  corrigibility is a natural kind or a kludge.


  Also ask: identify which parts of the dispute are verbal (e.g., whether "one problem
  with many facets" vs. "many problems with commonalities" differ in substance) and
  say which parts are verbal.


