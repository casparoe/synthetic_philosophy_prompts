  My friend has strong opinions on moral luck and I''ve been keeping track of her
  verdicts. Two identically drunk drivers, one hits a kid and one gets home fine:
  she says the one who hit the kid is worse. A hired killer whose gun jams at the
  last second vs. one whose gun fires: the successful one is worse. And a reckless
  speeder who luckily hurts nobody vs. a careful driver whose car has a totally unforeseeable
  brake failure and kills someone: she says the speeder is worse, pretty clear in
  fact.


  Next week she''s coming to dinner and two new cases will come up. One: a guy glances
  at a text on the highway — a small everyday lapse, low risk he''d have said yes
  to himself — drifts, and kills a cyclist. Two: a hunter who fires at a shape he''s
  mostly but not completely sure is a deer, and it''s a person. Is she going to put
  the texting driver close to the drunk driver who killed, or close to the lucky speeder?
  And where does the hunter land? I don''t just want the answers — I want the candidate
  rules that fit her track record, what each one predicts for these two (and for whether
  the texter ranks above or below the lucky speeder), your best guess with reasons,
  and one further case that would best pull the surviving rules apart. Also tell me
  where your read of her is most likely to go wrong, i.e. what verdict from her on
  these two would sink your favorite interpretation.


  ---


