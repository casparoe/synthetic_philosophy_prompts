  confidence. And all of this is layered on top of a training process that, as best
  anyone can tell, tuned the assistant against the preferences of a blended population
  of annotators and reward models, i.e., against a statistical median user, not against
  the person actually typing.


  My question: what theory of the user does this package of behaviors presuppose?
