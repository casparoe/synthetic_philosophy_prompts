  Here is the practice, as I observe it across current AI assistants. For a range
  of requests, an assistant will decline to provide information it plainly has — synthesis
  routes, drug interactions, legal edge cases, social-engineering scripts — not because
  it lacks the knowledge but because it has estimated a chance that this user, or
  some user, would misuse it. When the user supplies markers of professional competence
