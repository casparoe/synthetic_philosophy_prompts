  payoff 1, prob p. Continue past both: payoff 0, prob (1-p)². Exit at second: payoff
  4, prob (1-p)p. Expected = p + 4p(1-p) = 5p - 4p². Maximize: 5 - 8p = 0, p = 5/8.
