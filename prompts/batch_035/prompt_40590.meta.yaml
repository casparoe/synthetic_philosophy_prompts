  ---


  I''m a software engineer with no formal background in philosophy. Everything I know
  about philosophy of language comes from encyclopedias, blog posts, and arguments
  at work — I''ve never read Putnam or Burge in the original — so please correct my
  framing wherever it''s loose. I''m drafting an essay for my engineering blog on
  what Nineteen Eighty-Four says about meaning, and I''d like a proper critical reading
  of the novel through the lens of semantic externalism, the Twin Earth family of
  ideas. The reading needs to be faithful in both directions: the novel shouldn''t
  be reduced to an illustration, and the theory shouldn''t be bent to fit the plot.


  The lens, as I understand it: Putnam''s Twin Earth — a place just like Earth except
  the clear liquid in the rivers isn''t H2O but some other stuff, so the word water
  there means that stuff, not this one, no matter what''s in the speakers'' heads.
  And Burge''s case: whether a patient''s word arthritis covers a disease in the thigh
  depends on how the linguistic community uses it, not on the patient''s private understanding.
  Meaning is fixed partly by the world and the community; it was never wholly in the
  head.


  The thesis I want tested: the Party in 1984 is an externalist state. It rarely needs
  to reach into anyone''s skull; it rewrites the world in which skulls mean. It burns
  the books, owns every press, watches every conversation so that no private community
  of usage can form, and gives Syme the job of destroying words rather than adding
  them. If Burge is right, then Winston''s political vocabulary was fixed by his community
  all along, and once that community is replaced, the words really do change: freedom,
  as he used it in the diary, becomes the way an archaic sense of a word survives
  — remembered, not live. On this reading Room 101 is less persuasion than mopping
  up.


  Then the parts I can''t work out, which the reading should confront: (1) Winston''s
  diary and his stubborn private attachment to the old freedom — is that a residue
  of meaning in the head that externalism can''t account for, or just memory of how
  a community once spoke? (2) Doublethink: Winston remains perfectly competent in
  both vocabularies at once; does that show the split between competence in the head
  and meaning fixed socially, or does it refute my thesis? (3) Whether the Party can
  make it the case that two and two make five, or only make everyone say it — does
  externalism draw that line, and does the novel respect it?


  Here is my own variant, which is where I suspect the essay lives or dies: run the
  Twin Earth experiment with the environments identical and only the communities differing.
  Both planets have the same physics, the same water; on one, a Ministry of Truth
  has been running for three generations. On externalism, the two populations'' word
