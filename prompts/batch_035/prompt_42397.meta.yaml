  \ and Epistemic Bubbles\" (2018, Synthese). I don't need to cite it or quote — I\
  \ can write the exam question in my own words without attribution to specific texts.\
  \ But it could lean on the distinction without naming Nguyen. Actually the prompt\
  \ shouldn't lean on obscure memorized facts. The bubble/echo chamber distinction\
  \ is fairly well known. A grading prompt could work: exam question asks about the\
  \ distinction and remedies; student answer conflates them.\n\nBut maybe money pumps\
  \ is better for \"in the weeds\" — money pump arguments involve specific structures.\
