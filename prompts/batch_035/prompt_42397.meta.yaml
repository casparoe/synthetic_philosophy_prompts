  \ but they can end up worse off than the naive agent, e.g., the \"money pump\" vs\
  \ \"burning money\" cases). Another subtle error: claiming money pump arguments\
  \ show preferences must be transitive full stop, ignoring that the argument needs\
  \ assumptions like no transaction costs, opportunity to refuse trades (non-forced),\
  \ and that the agent is naive about future choices. Or conflating \"cyclic preferences\
  \ are irrational\" with \"all intransitivities are cyclic.\"\n\nAlternatively, domain:\
