  \ echo chamber is a stronger epistemic bubble\" (wrong — structurally different,\
  \ not stronger version); saying the remedy is exposure to diverse views (works for\
  \ bubbles, fails for echo chambers); conflating echo chambers with filter bubbles\
  \ (algorithmic personalization, Pariser — filter bubble is more like a bubble).\
