  of the wavefunction into "branches" is not a well-defined operation, and you can
  always refine or coarsen any branching, so "how many worlds" has no fact of the
  matter. On the other hand, the Born weight attached to each branch is supposed to
  be perfectly well-defined. I''d like to understand how both of these can be true
  at once — how can the number of branches be vague while the squared amplitude assigned
  to each is exact — and what work that asymmetry does in the broader argument.


