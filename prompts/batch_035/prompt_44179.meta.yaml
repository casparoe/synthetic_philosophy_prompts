  for deriving the Born rule actually locate "probability," because as far as I can
  tell they locate it in different places. In the decision-theoretic program associated
  with David Deutsch and David Wallace, the argument seems to run before the branch:
  a rational agent facing a measurement is shown, by constraints on her preferences,
  to have to care about the weights rather than the branch counts, so probability
  re-enters as a fact about rational decision-making rather than about what physically
  happens. In the self-locating uncertainty approach of Charles Sebens and Sean Carroll,
  the argument instead runs after the split but before the observer knows which branch
