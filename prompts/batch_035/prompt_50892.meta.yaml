  Let me craft cases where verdicts are intuitive but hard to reconcile:


  - Otto''s notebook: classic, fine (widely known).

  - A novel case: someone using a GPS for navigation — feels less like cognition?
  Or a chess player in an open-book tournament using notes vs. a musician using sheet
  music.

  - The hard pair: e.g., a student allowed a formula sheet on an exam — is the sheet
  part of their mathematical cognition? People''s gut: no, that''s cheating-ish/external
  aid. But Otto''s notebook: yes. Hard to reconcile.

  - Another: a phone''s autocomplete predicting your next word — is the phone part
  of your thought? Intuition: no, it''s annoying external interference. But if autocomplete
  became so good that it writes what you mean... it starts feeling like part of you.

  - A blind person''s cane: intuitively yes, part of their spatial cognition. Prosthetic
  limb: yes.

  - Calculator during arithmetic exam: no. But a cashier whose register auto-computes
  change... hmm.

  - Spelling: I rely on autocorrect so heavily I can''t spell unassisted — is the
  spellchecker part of my writing cognition? Gut says yes-ish.

  - Case they go back and forth on: smartphone for directions — on holiday without
  phone I feel cognitively crippled, but is Google Maps my memory?


  The principle should have to choose: parity principle (Clark & Chalmers) saves the
  formula sheet verdict? Actually the formula sheet on exam: it satisfies trust, past
  use, etc. — parity says yes it''s part of cognition, but intuition says no (it''s
  an external aid that makes the exam test something else). So tension: trust-and-reliance
  criteria (Otto''s notebook) vs. social/institutional rules (exam formula sheets).
  Good tension.


  Also a genuinely hard pair: two cases alike in functional profile but different
  verdicts:

  1. Otto''s notebook (yes).

  2. A courier who carries a notebook with all their deliveries but never reads it
  back — the notebook encodes info but is never used as memory — but that''s just
  not functioning.

  Better hard pair: (a) an Alzheimer''s patient whose daughter keeps the notebook,
  updating it for her, and reads entries aloud — feel like part of the patient''s
  mind? Gut: less, it''s the daughter''s mind. But Clark-Chalmers trust/accessibility
  criteria are satisfied from the patient''s side.

  (c) Someone with photographic memory: internal, no extension — fine, not relevant.

  (c) The case they keep going back and forth on: relying on autocorrect / smartphone.


  Another nice contrast: a pianist''s sheet music vs. jazz musician playing from memory
