  ---


  My two friends, Rob and Sam, had a long argument at dinner last week, and I''ve
  been turning it over since without being able to settle it. I have no background
  in philosophy — I watch physics documentaries and think about them afterwards, that''s
  the extent of it — so I''d be grateful for a careful verdict.


  It started when Rob, who is an engineer, said something he''d read: that the laws
  of nature don''t push anything around. Gravity doesn''t make the apple fall; the
  apple just falls, everywhere, always, and the "law" is only our name for that pattern.
  Sam, who studied physics at university, thought this was backwards. For her the
  law is what makes the apple fall: without something enforcing regularity, there''d
  be no reason for the universe to stay in its habits, and the fact that it does stay
  in them is the whole mystery.


  Rob answered that the "enforcement" picture just renames the mystery. Saying things
  fall because a law makes them is like saying opium puts you to sleep because it
  has a sleep-producing quality — you''ve added a word, not an explanation. Sam replied
  that Rob''s picture can''t handle sentences like "if I let go of this glass, it
  would fall": nothing that merely summarises the past tells you what would have happened,
  whereas the governing law does, and we use such sentences constantly, including
  engineers.


  Rob said a summary could do that job, because a summary that fit everything that
  happened but gave absurd answers about nearby situations would be a bad summary
  — the best description of the pattern is the one that gets the would-haves right
  too. Sam said that was smuggling: the pattern alone doesn''t say which situations
  are "nearby", and simplicity is doing undeclared work.


  Rob then tried a different tack: if the universe''s whole history had gone differently,
  then the best summary of it would be a different set of laws — so what the laws
  are depends on the total arrangement of facts, and something that depends on the
  facts can''t be what controls them. Sam said the dependence runs the other way:
  every instant of that arrangement conforms to the laws, so it''s the arrangement
  that inherits its order from the laws, not the laws from the arrangement. There
  they stopped and looked at me.


  Could you adjudicate the exchange move by move — who is right at each step and why
  — and then say who comes out more right overall, and whether there is something
  both of them missed? Please answer in British English.


  ---


