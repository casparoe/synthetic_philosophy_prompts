  Retirement dinner on Friday, and I''ve been dragooned into giving the toast. The
  retiree is Dvora K—, forty years in our department, and a thoroughgoing Tolstoyan
  about art — What Is Art? was, as far as she was concerned, the last word on the
  subject. Her creed, delivered many times at the coffee machine at anyone who''d
  stand still: a work of art succeeds only if it sincerely hands on a feeling the
  maker actually had, and it fails in four characteristic ways — by borrowing from
  other art, by imitating reality for its own sake, by showing off technique, by just
  entertaining people. She enforced this on after-dinner speeches the way other people
  enforce parking. She once told a very famous visitor, to his face, that his remarks
  were counterfeit art. He laughed; she wasn''t joking.


  So here''s my problem: the toast is itself a small work of verbal art, and she will
  be sitting ten feet away, judging it by exactly those standards. Every draft I write
  sounds like the inside of a dust jacket. What I need from you:


  1. A toast of about four minutes, in plain words, that transmits a real feeling
  about her rather than admiration for my phrasing. [Something like that.]


  2. I want one laugh in it. On her own theory, is a laugh permissible — or is getting
  one exactly the entertainment-counterfeit she spent four decades warning about?
  If permissible, on what terms? My candidate bit: [something]. Tell me if it passes.


  3. The room is mixed — family who''ve never read a word of Tolstoy, plus half the
  department, plus two artists she famously told... So it can''t lean on jargon, and
  there are people there she wounded with that creed of hers who will be listening
  to see whether I whitewash it. Don''t whitewash it; she wouldn''t have.


