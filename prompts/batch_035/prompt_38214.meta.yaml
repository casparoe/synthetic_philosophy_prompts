  Korea, mid-democratization, elected a longtime dissident to the presidency in the
  middle of the crisis and absorbed the austerity without institutional collapse.
  China was largely insulated — its currency wasn''t convertible — and responded with
  state-directed stimulus, and the bargain there was unaffected.


