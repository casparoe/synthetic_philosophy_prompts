  "So I''m drafting a paper on advance directives and I want a second pair of eyes
  before I send it off. The core idea: most people defend advance directives either
  by appeal to the autonomy of the earlier self (the ''then-me'' gets to rule because
  it''s still me) or by precedent autonomy (the earlier self''s choices bind like
  a promise). I think both are wrong, or at least incomplete, and I want to argue
  for something I''m calling the ''epistemic trustee'' view: the earlier self has
  authority not because of identity or promise-like bindingness but because of an
  epistemic asymmetry. When I sign a directive while competent, I''m the only party
  with reasonably full information about my own values — the later, demented self
  is a stranger to those values in a sense, so the directive works like instructions
  left by a trustee to a caretaker, not a command from a sovereign.


  The essay notes so far:

  1. The identity route fails for the radical dementia case: if the later self genuinely
  doesn''t remember or endorse the earlier values, then ''it''s still the same person
  choosing'' does less work than people think. Also it can''t explain why we honor
  directives when the patient, now confused, protests loudly — identity cuts both
  ways, the later self is ''me'' too.

  2. Precedent autonomy handles that better but over-generates: it would bind even
  when new, competent information arrives that would have changed the earlier self''s
  mind (e.g., a new treatment makes the condition far less bad than the earlier self
  feared). Directive holders look irrational if they can''t revise.

  3. Epistemic trustee view: the directive is defeasible guidance, not a command.
  It carries weight in proportion to how well the earlier self''s values were informed,
  and it can be overridden when the surrogate has strong evidence the earlier self
  would have changed their mind. This predicts the actual practice of clinicians,
  who already quietly do this.


