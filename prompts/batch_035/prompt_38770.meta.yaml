  Donating a kidney to a stranger: same. Giving up my seat on a bus for someone who''s
  clearly struggling: somehow not admirable in the same way — it just feels required.
  Whistleblowing on my employer when it will end my career: I flip-flop; it seems
  both supererogatory and something I''d owe the victims. If I''m the only available
  donor match and the recipient will otherwise die, donating a kidney still seems
  above and beyond, yet refusing now strikes me as wrong in a way it doesn''t when
