  least one hard-to-reconcile pair.


  Cases for supererogation:

  1. Diving into a river to save a child, risking drowning — clearly supererogatory
  (not required).

  2. Donating a kidney to a stranger — supererogatory.

  3. Donating 10% of income to effective charities — the asker feels it''s supererogatory
  but their friend says anything short of 10% is failing a duty... Actually make the
  tension: the asker thinks donating one kidney to a stranger is above and beyond,
  but also thinks that if you''re the only match and the stranger will die, refusing
  is somehow wrong — a duty-like verdict on the same act.

  4. Whistleblowing at great personal cost — feels obligatory when harm is great,
  though the cost is enormous.

  5. Volunteering for a dangerous rescue — supererogatory, but if you''re the only
  trained rescuer on the scene, feels required.

  6. Lying to save a life is required? Not supererogation.


  Tension pair: The same act (donating a kidney to a stranger) is supererogatory when
  there are other donors, but the asker thinks refusing is wrong when you''re the
  only match — hard to reconcile "supererogatory = permissible not to do" with "wrong
  to refrain."


  Another good tension: cost. Small cost to great benefit: giving up your bus seat
  — feels required (duty of easy rescue), not supererogatory. Large cost for small
  benefit to others — not even praiseworthy? E.g., donating a kidney to extend a stranger''s
  life by a few months — asker feels it''s imprudent/odd rather than admirable. So
  "the more you sacrifice, the more praiseworthy" fails at both ends.


  Also imperfect duty angle: visiting a lonely relative — required sometimes but latitude
  over when; the asker''s verdicts may not fit a binary required/permitted.


