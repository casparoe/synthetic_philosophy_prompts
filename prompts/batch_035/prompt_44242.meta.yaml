  Draft:


  "I do evals at a small AI lab — mostly on models we didn''t train ourselves, so
  we only have weights and no training data access, and our compute budget is a joke
  compared to the big labs. My job lately is building out an anomaly-detection setup
  for monitoring: we run a bunch of queries through the model, look at what the activations
  do, and try to flag when something unusual is going on. The part I keep getting
  stuck on, and what I want your help with, is the conceptual question hiding inside
  the practical one: when I flag two things as ''the same mechanism,'' what am I even
  claiming?


  Concretely: suppose we find that the model''s activations look weird on a set of
  jailbreak prompts, and we label that cluster ''the jailbreak mechanism'' or whatever.
  Then a few weeks later there''s a new jailbreak family, the activations are in a
  somewhat different region, partly overlapping, and I have to decide: same mechanism
  re-used, or a different one that happens to do the same job? It matters because
  we report to the safety team, and ''the detector caught a new instance of a known
  mechanism'' reads very differently from ''a genuinely novel mechanism appeared''
  — one is a paper cut, the other is potentially a headline. And I honestly don''t
  know if there''s a principled answer or if ''mechanism'' is doing the work a schmategorization
  does elsewhere in science (like species or diseases, where the boundary is drawn
  partly for us, partly for nature). Someone mentioned to me that philosophers have
  fought about natural kinds vs. nominal kinds and that this might actually apply
  here, but I don''t know that literature.


  So what I''m asking for: write a procedure my team can actually follow. Something
  like: the questions to ask in order about a new flagged cluster, what counts as
  a sufficient answer for each (with actual tests we could run — steering/perturbing
  the activations, checking if ablating the old cluster kills the new behavior, whatever
  else is standard), where the procedure should stop and say ''mechanism-matched''
  vs ''novel'', and where it should hand off to a human because the question is partly
  a values/judgment call about how much carving-up of model innards we''re willing
  to do. Then run it on three cases: (1) a new jailbreak family where ablating the
  old direction does blunt the new behavior but only partly; (2) a refusal-bypass
  case where the activations sit right on top of the old cluster but the surface behavior
  is totally different (say, sycophantic agreeing with the user instead of refusing);
  (3) a case where the cluster is in a region nothing we''ve seen touches, but our
  interpretability tooling is so weak on that region that ''novel mechanism'' and
  ''we can''t see what''s happening'' are confounded. For that last one I want the
  procedure to be honest that it can''t distinguish those. Also tell me what the procedure
  can''t do — I''d rather report ''we can''t tell'' to the safety team than have a
  checklist that outputs false confidence."


