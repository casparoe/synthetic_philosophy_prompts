  were the exam on Friday, then by Thursday evening the students, having ruled out
  Monday–Thursday, would know it was Friday, contradicting the announcement; then
  Thursday, by the same reasoning run one day earlier, on down to Monday, from which
  they conclude the exam cannot occur at all — and are then surprised by the Wednesday
  exam.


  The position I came to hold is that the backward induction fails at the very first
  step, for a self-reference reason: the students'' Friday-eve "knowledge" that the
  exam is on Friday would have to be derived from the announcement''s truth, but the
  same announcement is precisely what the argument is being used to discredit, and
  the announcement is self-referential in a way that makes this circular. My friend
  pressed the analogy with Moore-paradoxical assertions — "the exam is on Friday,
  but you won''t believe it in advance" — and with the formal knower paradox, where
  knowledge attributions to a sentence containing that very attribution can be inconsistent
  even when the sentence''s content is unproblematic. On my view, that is exactly
  what happens here: the announcement is consistent and satisfiable, the teacher can
  hold a genuinely surprising exam, and the students'' "elimination" of Friday is
  not a piece of knowledge but the first move of a Moorean trap.


