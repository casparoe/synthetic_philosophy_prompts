  if it does not suffice, then (2)''s second clause does no work in the antinatalist
  argument either, since the possible people who never come into existence were never
  anybody either. Or at least that is how the character would reply, and I cannot
  tell whether she is right. Before I write the daughter''s answer, I would like a
  considered diagnosis. Which step of the argument is the weakest — and is it a hidden
  equivocation between people who never exist and people who cease to exist, or is
  the argument valid and the real cost falls on premise (2)? What exactly does each
  repair cost the character''s antinatalism, and can she keep her view about birth
  while giving up the conclusion about death? I would rather she lose the exchange
