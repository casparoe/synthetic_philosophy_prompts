  I am a novelist, currently at work on a book whose central figure is a hospice physician
  and convinced antinatalist. In the chapter I am drafting she lays the following
  argument on her adult daughter, who has just announced a pregnancy, and I need to
  know whether the daughter''s eventual rebuttal should expose a flaw or concede the
  point. The argument runs: (1) The presence of pain is bad, and the presence of pleasure
  is good. (2) The absence of pain is good even when no one exists to enjoy that absence,
  whereas the absence of pleasure is not bad unless there is somebody who is deprived
  of it. (3) Hence every birth is a harm, since it introduces pains whose absence
  would have been good, without introducing pleasures whose absence would have been
  bad. That much is the position she has held for years. But she goes further, and
  this is where I as her author begin to lose my footing. (4) Consider one of her
  own dying patients, a man whose remaining life is happy. (5) A painless death would
  prevent all of his future pains, and by (2) those absences are good even though
  no one will exist to enjoy them. (6) A painless death would also prevent his future
  pleasures; but once he is dead, there is no longer anybody to be deprived of them.
  (7) So a painless death is, by the very asymmetry she uses against her daughter''s
  pregnancy, a net benefit even for a happy man. (8) And what holds of one patient
  holds of everyone: the same reasoning licenses painlessly ending any contented life.
  She is not a fool, and my novel should not make her one; I do not want to hand her
  daughter a rebuttal that collapses on inspection.


