  Last month I joined the three-member hardship panel at the university where I teach.
  Twice a term we allocate a fixed fund among student applicants — emergency housing,
  medical costs, bereavement travel — and our procedure, inherited from a predecessor,
  scores each case on a 0–100 impact scale and funds the highest scores until the
  money runs out. I anticipated quibbles about the rubric. I did not anticipate that
  the panel itself would reopen a ninety-year-old debate. Our economist refuses to
  treat the scores as additive: he holds, in the tradition of Lionel Robbins''s interwar
  attack on interpersonal comparisons, that whatever the rubric measures, it is not
  a quantity common to all applicants, so summing ranks one person''s relief against
  another''s is arithmetic theater. Our third panelist, a public-health physician
  who spends her working life with QALYs and disability weights, finds this quaint:
  policy has been comparing benefits across persons for decades, she says, and the
  alternative — refusing to compare — is itself a comparison that silently weights
  everyone''s good equally, or by luck of the application queue. They have argued
  through three meetings without either moving an inch, and on Thursday I have to
  decide, in writing, whether my signature goes under a number.


  I would like a diagnosis of this standoff rather than a verdict. Is the disagreement
  verbal — a residue of the word utility doing double duty as a choice-theoretic bookkeeping
  term and a folk term for wellbeing? Is it substantive — a genuine dispute about
  whether a common scale for relief exists, answerable in principle by better measurement?
  Or are the two of them answering different questions under one heading — one about
