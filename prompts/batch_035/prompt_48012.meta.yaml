  with a "one metric" case.


  Let me craft: I sit on the board of a mid-sized research institute; we fund ML safety
  work; a proposal to evaluate model honesty via a proxy: LLM judge scoring on a benchmark;
  worry about Goodhart. Actually Goodhart''s law + specification gaming maps naturally
  onto ML evaluation: a benchmark score gets gamed. Inject niche framing: distinguish
