  off-distribution), "causal Goodhart" (intervention changes relation), adversarial
  Goodhart — these taxonomies exist (Garrabrant/Manheim "Categorizing Variants of
  Goodhart''s Law") and are known to LLMs reasonably well; not super niche. That''s
  fine — it''s "in the weeds" but memorable.


  Concrete case: hospital uses a sepsis prediction... or a university allocating department
