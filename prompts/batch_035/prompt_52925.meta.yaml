  Been reading LessWrong since the Sequences days and somewhere along the way I fell
  down a rabbit hole into philosophy of science, specifically the fight over laws
  of nature. Quick map for anyone who hasn''t seen it: Humeans say the laws are just
  a summary — the world is a vast mosaic of local facts (Lewis''s phrase, roughly),
  and "laws" are whatever systematizes that mosaic best, the famous best-system story
  where you balance simplicity and strength. Anti-Humeans (Armstrong, Tooley, Dretske
  going back to the 70s, and later Maudlin) say no, laws govern: there''s some extra
  structure — universals standing in necessitation relations, or primitive laws that
  generate history from initial conditions — and the regularities are the output of
  that structure, not the other way around.


  Here''s the thing: this fight has been going basically unchanged for 40+ years.
  The standard shots are all well known and nobody moves. Anti-Humeans say a summary
  can''t explain the regularities it summarizes (you can''t explain why Fs are Gs
  by pointing out that, look, all the Fs are Gs), and that Humean laws are stuck in
  a vicious circle re: chance. Humeans reply that the necessitation relation doesn''t
  actually do any work — the famous inference problem, where it''s a law that N(F,G)
  only if it''s a law that N(F,G), which looks embarrassingly circular — and that
  positing invisible governors to push particles around is ontology with no epistemology:
  what observation would ever tell you they''re there?


