  — Humeans (e.g. Lewis''s best system) do think laws explain, via unification; they''d
  deny laws "govern" but not that they explain. Overstatement of a modest thesis.

  2. Conflation: Hume''s own scepticism about causation vs. contemporary Humeanism
  about laws — contemporary Humeanism needn''t deny causal facts; it''s about supervenience
  on the mosaic of particular facts. Also conflating "regularity" with "best system"
