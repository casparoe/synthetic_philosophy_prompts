  Let me also think about whether the case is satisfiable. Per-person expected harm:
  one-in-ten-million chance of a laceration requiring stitches — is a 10^-7 chance
  of stitches "smaller than a dust speck"? In expectation, arguably comparable. The
  anti-aggregationist who says "no number of dust specks adds up to torture" must,
