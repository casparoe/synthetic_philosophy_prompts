  The prompt should specify: build a case where the anti-aggregationist (someone who
  refuses to aggregate tiny harms across persons — the side that says "specks" in
  the original case) is driven to the verdict that feels worse. Constraints: realistic
  setting (workplace safety, product design, public health), numbers a person can
  actually picture (a city, a country — not 3^^^3), the per-person harm genuinely
  trivial in a single instance, the aggregate harm a small number of identifiable
  bad outcomes, and the case must not smuggle in the conclusion by describing the
  aggregate vividly and the individual harms blandly — the descriptions should be
  symmetric in vividness. After the scenario, walk through what the strict aggregator
  says, what the no-interpersonal-aggregation view says, and then the key wrinkle:
  an ex ante version where no one knows who will be harmed (statistical victims) versus
  an ex post version where the harmed parties are identified — and ask whether the
  anti-aggregationist verdict changes, since if it does, they''re aggregating after
  all (in expectation). Finish with which feature does the work and how the anti-aggregationist
  would attack the case (e.g., distinguishing personal vs impersonal aggregation,
  or claiming the per-person harm isn''t really trivial in context).


