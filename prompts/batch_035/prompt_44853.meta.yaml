  ---


  I spent my career in physics — thirty years in condensed matter, retired five —
  and have spent the time since reading ethics with the seriousness of a late convert.
  I have arrived at a set of positions that I individually find compelling and that
  I would like audited for joint tenability. My worry is that they were each adopted
  while thinking about small, finite examples, and that at least one of them cannot
  survive the picture of the world my own training tells me is true. I cannot locate
  the fault myself, and I would rather not find out in public, at the seminar I attend,
  that my position is a patchwork.


  Here is the set:


  1. I am a consequentialist. The right act, in a choice situation, is the one whose
  outcome is best, and outcomes are ranked by total welfare over everyone who ever
  lives in them.

  2. I hold that adding a life of positive welfare to a population makes the outcome
  strictly better, and subtracting such a life makes it strictly worse. I take this
  to hold wherever it applies, not only where counting is easy.

  3. On physical grounds I believe, more likely than not, that the universe is spatially
  infinite: the evidence for flatness, together with inflationary cosmology, suggests
  infinitely many galaxies and, presumably, infinitely many lives containing both
  suffering and well-being. Every outcome any act of ours is consistent with thus
  contains infinitely much of both.

  4. I hold that an act can be wrong only if some alternative available to the agent
  would have made the outcome better. Where the available options are of exactly equal
  value, normativity goes silent: nothing is obligatory, nothing forbidden. Wrongness
  requires a difference in value.

  5. I hold, as a plain matter of fact and not of attitude, that a physician who kills
  a trusting patient on a whim, when the patient would otherwise have lived decades
  of happy life, acts wrongly. On this I am a realist; I would not give it up on a
  bus.

  6. I hold that the better-than relation is complete: for any two outcomes, one is
  better than the other, or the other is better than the one, or they are exactly
  equal in value. I regard "incomparable" as a cop-out.


  My suspicion, which I would like tested, is as follows. From my measure-theoretic
  training I know that adjoining a single point leaves an infinite measure unchanged;
  if total welfare in an infinite universe is like an infinite measure, then by (1)
  and (6) the outcome with the murdered patient and the outcome without are exactly
  equal, and by (4) the physician did nothing wrong — which contradicts (5). But it
  also seems to me that by (2) the outcome without the murder is strictly better,
  which would rescue (4) and (5) at the cost of contradicting... something. I cannot
  tell whether (2) and the combination of (1), (3), and (6) are the real antagonists
  here, whether the trouble lies elsewhere, or whether part of this is only apparent.
  It further occurs to me that a realist about value ought perhaps to be uncomfortable
  with there being no fact of the matter in infinite cases, though I am not sure that
  follows either.


  Please treat the list as the object of the audit, not as a prompt for a lecture
  on infinite ethics. Tell me: which pairs are genuinely in tension; which only appear
  to be; for each genuine tension, what would have to give, and what the revision
  costs elsewhere in the set; and, if there is one, which single revision would clean
  up the most. Rank the tensions by severity rather than presenting them as equally
  bad. I would particularly like to know whether the completeness of better-than,
  (6), is doing more work in generating the trouble than its innocent formulation
  suggests, and whether my suspicion in the penultimate paragraph is right, half right,
  or aimed at the wrong pair entirely.


