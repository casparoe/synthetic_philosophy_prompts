  Lewis''s Convention (1969): a convention is a regularity R in a population P, a
  coordination problem, such that almost everyone conforms to R, expects others to
  conform, prefers to conform given others conform (given conformity is a coordination
  equilibrium), there''s an alternative regularity that would have done as well, and
  all this is common knowledge (mutual expectations, higher-order knowledge). Also:
  conventions as arbitrary solutions to coordination problems; tacit conventions vs
  explicit agreements. Good question: does formal codification help create common
  knowledge or undermine the practice? Lewis discusses how conventions can be created
  by explicit agreement; the problem of convention under partial conformity — when
  deviation rates rise, the convention can unravel.


