  practice. Steps: (1) is this actually a convention (vs. a natural necessity or a
  mere statistical regularity)? — test: is there a workable alternative that would
  have served as well (arbitrariness test)? If there''s no real alternative, it''s
  not a convention, it''s a constraint — codifying/choosing it isn''t choosing a convention.
  (2) is it solving a coordination problem, i.e., does uniformity itself do the work?
  (3) common knowledge: is expectation of conformity already mutual, or is that the
  problem? (4) Does codification risk the "dead letter" problem — a written rule nobody
  follows is worse than a practice followed without a rule? (5) breaking a convention
  deliberately — who bears the transition cost, tipping.


