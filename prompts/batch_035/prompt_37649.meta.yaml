  the outcome the mechanism produces is weakly better for both players than the outcome
  those actions would have produced on their own. The canonical example is chicken
  with a pre-agreed mediator: if both drivers would have gone straight, the mediator
  flips a coin and forces one to swerve; every other pair of actions is passed through
