  she would have fared in the original game, even though it is ''safe'' by the champion''s
  definition. (2) SPIs subsidize recklessness: the mechanism pays out most to whoever''s
  counterfactual behavior was worst, so it systematically rewards the stubborn and
  the threatening, and the prudent end up underwriting the insurance of the imprudent.


