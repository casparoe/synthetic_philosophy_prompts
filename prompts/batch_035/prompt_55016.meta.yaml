  umami — and cultures build their cuisines on top of that shared hardware; you cannot
  invent a sixth taste at will, but you can arrange the five into very different cuisines.
  Morality, on this model, is the same kind of thing: innate modular foundations (care,
  fairness, loyalty, authority, sanctity, roughly) are the receptors, and a society''s
  morality is its cuisine. Individual variation in receptor sensitivity then stands
  in for political orientation: liberals and conservatives are palates differently
  tuned to the same five inputs.


  In my seminar the analogy is made to carry two very different conclusions, and I
  want to test both. The majority of my students infer a kind of folk relativism:
  since taste is a paradigm of the subjective, and the foundations are now just taste
  receptors in a moral key, there is no fact of the matter about whose morality is
  better, and left/right moral disputes are, at bottom, like arguments over whether
  cilantro is delicious — resolvable only by shrugging. A minority run the analogy
  the other way: political psychologists report that conservatives, on average, register
  all five foundations roughly evenly while liberals concentrate their sensitivity
  in care and fairness; on the gustatory model this makes conservatives people who
  can taste more of the moral world, and it would be odd to call the wider palate
  the deficient one. Needless to say, this second inference is even more popular with
  the conservative students.


