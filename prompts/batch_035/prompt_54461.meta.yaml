  cause the death? Everyone would say yes. But there are infinitely many omitters
  (everyone else who didn''t water them). This is a well-known problem — Lewis''s
  "voids", the problem of profligate causation, Bierman-Bates counterexamples, Moore''s
  work on omission. Small LLMs will know the basics but the disagreement structure
  makes it non-regurgitation.


  I need to inject some novel/niche angle: maybe the "cheating" case (Bierman & Bates:
  a student cheated on an exam, so the honest students who would have passed failed
  due to curve — but that''s about preemption). Better: the classic debate between
  Lewis''s "Influence" / the "how things would have been" and the "sensitivity" /
  accountability approach of Hitchcock & Yablo ("cause equals difference-maker").


  Structure: two friends at a dinner party argue. One (a lawyer?) takes the counterfactual
  view: the omission is a cause iff, had the gardener watered the plants, they''d
  have lived. The other objects: by that standard, my not watering them (I live in
  another city, never agreed to) is equally a cause, since if I had watered them,
  they''d also have lived. So the counterfactual view makes everyone guilty — absurd.
  First friend replies: that''s why we need norms — an omission is a cause only when
  there was a duty/expectation. Second friend: but then causation depends on norms,
  which makes it relative — the same physical event caused the death in one legal
  system and not another; and "caused" is used in science without norms (e.g., "the
  drought caused the crop failure" — no drought "duty"). Etc.


  Also a nice specific move: the "double prevention" case — the pilot who doesn''t
  shoot down the missile... Or the famous case: a golfer... Let me construct the disagreement:


  Round 1: A says the gardener caused the death by counterfactual dependence. B objects
  with the profligacy problem.


  Round 2: A concedes and moves to norm-relativity. B objects that causation should
  be a natural, mind-independent relation; norm-dependence makes causation perspectival,
