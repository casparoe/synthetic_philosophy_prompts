  "I chair the examination committee of a professional body that certifies software
  engineers. Our certification is a licence to practice: employers and, in some jurisdictions,
  regulators treat it as evidence that the holder can be trusted with production systems.
  Until recently our rules were simple: closed-book written exam on fundamentals,
  plus a practical exam on a sandbox machine with a standard editor and language documentation
  installed. Now we get a steady stream of requests — several a quarter, each needing
  a ruling within a few weeks and a written rationale, since candidates can appeal
  — to allow or disallow particular resources on the practical exam: full web access,
  autocomplete and refactoring tools, AI code assistants of varying power, a personal
  snippet library, a printed cheatsheet, a colleague on chat for clarifying requirements.
  Committee members are working engineers, not philosophers, and they currently decide
  by intuition, which produces inconsistent rulings that get overturned on appeal.


  I want to ground our rulings in the extended mind thesis. My understanding, roughly:
  Clark and Chalmers argued that when an external resource is reliably available,
  automatically trusted and endorsed, and smoothly integrated into a person''s problem-solving,
  it functions as part of that person''s mind — their thought doesn''t stop at the
  skull. The committee''s thought, roughly: if the tool is part of the candidate''s
  mind, then testing them without it tests a stripped-down person who doesn''t exist
  in practice; but if we let every tool in, we may end up certifying the tool, not
  the engineer. I want a procedure that navigates between these.


  Please write a decision procedure the committee can actually run on a request: the
  questions to ask in order, what counts as a sufficient answer to each, the points
  where the procedure returns a ruling and where it instead hands the case back to
  the committee because the question is one of professional values rather than philosophy.
  It should be usable in an hour by a non-philosopher, and it should say what it cannot
  settle. Then run it on three requests: (a) allowing a code-completion assistant
  trained on general code, (b) allowing the candidate''s own curated snippet library
  built up over their career, (c) allowing full web access including documentation.
  At least one ruling should be one the committee will dislike, and you should say
  which and why the procedure nonetheless returns it. Finally, tell me where the procedure
  is most likely to misfire as these assistants improve over the next few years, and
  what in the extended mind framework itself — not just our implementation of it —
  limits how far it can take us here."


