  language standards actually are, which I suspect is secretly a philosophy question.
  C++ (like JavaScript) is defined by a written standard maintained by a volunteer
  committee under ISO. When GCC, Clang, and MSVC disagree about whether some corner-case
  program is valid C++, the resolution path is always the same: a bug report, then
  a committee issue, then an edit to the document — the compilers are treated like
  faulty measuring instruments, and the text like the quantity being measured. Nobody
  ever says the standard is indeterminate on the point and picks an answer; they write
  more words until the disagreement goes away. Meanwhile Python, as my colleague gleefully
  points out, is the opposite: CPython is the de facto reference, and "the spec is
  wrong, fix the spec" is a routine, respected resolution. So two flourishing engineering
  communities, doing the same kind of work, have institutionalized opposite answers
  to the question of what fixes what a language''s rules mean: the text on the one
  hand, the behavior of the community''s shared implementation on the other.


  There''s a third strand that makes me suspect the text-first picture isn''t even
  sincerely held where it exists. Every language community I know of, including the
  spec-first ones, has a strong norm against "breaking working code": a program that
  has compiled and run on millions of machines for twenty years acquires something
  like a right to keep working, even if it turned out to rely on behavior the standard
  never promised (or explicitly forbade, in a way nobody enforced). Committee members
  will spend enormous effort redesigning a feature so that the accidentally-depended-on
  behavior is preserved. That looks like an admission that the community''s accumulated
  practice, not the document, is the real arbiter of what the rule was all along.
  I gather this is Wittgenstein territory — Kripke''s Wittgenstein on Rules and Private
  Language, with the plus/quus example, which I know mostly through blog posts and
  encyclopedia entries rather than the primary texts — but I''ve never seen the rule-following
  considerations applied to standards committees, which strike me as the purest real-world
  laboratory of the issue: a finite text, drafted by people who couldn''t anticipate
  the corner cases, purportedly governing infinitely many future programs, with an
  explicit dispute-resolution procedure.


