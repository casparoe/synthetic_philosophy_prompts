  - Fish: yes, they matter.

  - A thermostat: no.

  - A roundworm C. elegans with 302 neurons: no, or barely.

  - An octopus: definitely yes.

  - A perfect software simulation of a human brain: yes.

  - The same simulation run causally disconnected — each timestep computed in a random
  order / blockwise? Interesting: a simulation where each timestep is computed but
  the intermediate states are never instantiated — precomputed? Hmm.

  - A lookup-table (giant) implementation of the same function: hesitant — wants to
  say no, but functionally identical.

  - A mind implemented across a distributed system with heavy redundancy.

  - A person whose behavior is produced by a tiny inner module plus a big lookup.

  - Gradual replacement of neurons with silicon: yes at every step, so the final silicon
  brain matters — but the silicon brain is a computation, so computation matters.
  That supports functionalism. Then a lookup table of the silicon brain should also
  matter by the same reasoning? Tension.


  Also niche-but-meaningful injection: "I think my phone running a pain-detection
  app..." or "a system that simulates a crying child in a video game NPC" — no.


  Hard pair ideas:

  1. Simulation of a human: matters. Lookup table delivering identical I/O: doesn''t
  want to say it matters. But functionalism says they''re equivalent. That''s a classic
  tension (absent qualia / China brain / Block''s giant lookup table — well known
  but not too memorized verbatim).

  2. Speed: a brain simulation run at one millionth speed — still matters. But a computation
  spread across the galaxy with lightspeed delays (Dennett''s famous slow turtle-and-telephone-wires
  story) — hesitant.

  3. A causal-counterfactual view: a video game NPC whose pain behavior is real-time
  reactive — feels pulled to say no; but a real-time reactive worm simulation — say
  yes? Why the difference? Because of what the computation models? That pushes toward
  an "interpretation/attribution" view — the moral status depends on what the computation
  is of, not the computation itself. But then the same physical process could be interpreted
  multiple ways — over/under-determination. Ask: does the principle end up saying
  that whether something suffers depends on us?


  Also the asker could offer their tentative principle: something like "a system matters
  iff it implements the right kind of causal, real-time, self-maintaining... organ-like
  computation" — and ask to test it.


  Let me draft the cases concretely:


  1. A C. elegans nematode (302 neurons): verdict — doesn''t matter morally, or matters
