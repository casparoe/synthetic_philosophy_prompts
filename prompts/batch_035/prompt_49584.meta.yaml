  Let me do the sentience attribution domain with case verdicts. Concrete cases: thermostat
  (no), nematode with 302 neurons (yes-ish), fish pain, octopus, uploaded brain simulation,
  whole brain emulation run at 1/1000 speed, a language model trained to report pain,
