  ---


  A blog post about the history of experimental game theory that I read recently contains
  a passage on two contests run by Douglas Hofstadter in his Scientific American column
  in the early 1980s. It reads, in substance, as follows: In the "Platonia dilemma,"
  a fictional trillionaire tells twenty acquaintances that if exactly one of them
  sends him a telegram by the following noon — he will accept it reverse charges —
  that person will receive a billion dollars; if more than one telegram arrives, nobody
  receives anything. Hofstadter argued that a superrational participant — one who
  reasons that the other participants, deliberating identically about the same problem,
  will reach the same conclusion — should therefore refrain from sending. He then
  staged a real-world analogue, the "Luring Lottery," open to all readers: a prize
  of one million dollars divided by the total number of entries received, awarded
  to the submitter of one randomly drawn entry, where each postcard could bear any
  positive integer, and that integer counted as the number of entries the postcard
  submitted. Hofstadter''s superrational analysis here concluded that each reader
  should submit a very large number of entries: since all superrational readers would
  submit the same number, the shared expected payoff rises as that common number grows.
  The actual outcome vindicated the theory''s picture of ordinary people: nearly all
  readers submitted exactly one entry, so the total number of entries was small; the
  winner''s prize was consequently about a dollar; and Hofstadter concluded that the
  man in the street is a better decision-maker than game theorists give him credit
  for.


  I don''t know this literature and can''t tell which parts to trust. Please audit
