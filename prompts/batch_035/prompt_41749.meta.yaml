  distinction at each choice point, and the future killings, though mine, are not
  yet things I''m doing now... The consequentialist: "so it''s timing, not agency?"
  Then the "integrity" reply, then the consequentialist''s last push: the deontologist''s
  position risks collapsing either into consequentialism about one''s own future conduct
  or into a prohibition on even considering consequences that seems to cost the constraint
  its rationale (constraints were supposed to protect innocents; here they protect
  nobody — the one killed now is no better off, the two later are worse off).


  Also require the dialogue to end without a declared winner? Maybe: "let it end unresolved
