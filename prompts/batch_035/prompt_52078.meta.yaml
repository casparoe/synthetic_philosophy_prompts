  philosophy with a literary text, and I''ve settled on Golding''s Lord of the Flies,
  which is often gestured at as a fictional situationist experiment: strip away institutions,
  and apparently ordinary schoolboys descend into cruelty within weeks.


  But the more I think about the novel, the less tidy the fit seems. Golding wrote
  it in conscious inversion of the Victorian castaway story — R.M. Ballantyne''s The
  Coral Island, where British boys stranded on a desert island behave with pluck and
  honor; Golding even has his boys name themselves after that book''s heroes. And
  Golding''s stated theme, as I understand it, was that the defects of society trace
  back to defects in human nature — which sounds more like a character-ethics claim
  than a situationist one. Within the novel itself, the evidence cuts both ways. The
  painted faces that free Jack''s hunters to act cruelly look like textbook deindividuation,
