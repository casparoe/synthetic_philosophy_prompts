  I''m a junior and one of the co-leaders of my high school''s philosophy club, where
  each meeting a student leads a twenty-minute discussion on a topic of their choice.
  Next month it''s my turn, and I want to build the session around a question I keep
  snagging on: if hedonism says pleasure is the only thing good in itself, what single
  thing do all the different experiences we call "pleasures" actually share? The taste
  of cold water after a long run, the feeling of finally cracking a stubborn calculus
  problem, pride when my younger sister wins her debate tournament, the drop on a
  roller coaster, and the quiet contentment of reading on a rainy afternoon all get
  called "pleasant," but I can''t tell whether they share some one property that makes
  them all pleasures, or whether "pleasant" is just the word we use for a grab bag
  of unrelated feelings. Bentham''s quantitative hedonism seems to need the first
  answer, and I can''t see how to give it.


  I''d like a plan for the session rather than an explanation of the issue. Specifically:
  what order the pieces should come in and what depends on what — for instance, whether
  we first need to separate the question "what is pleasure?" from "what is happiness?",
  or whether that distinction should come later; which single case should carry the
  whole session (I''ve been considering using my calculus example, but I worry it''s
  too easy to dismiss as "just relief"); the misconceptions my classmates will predictably
