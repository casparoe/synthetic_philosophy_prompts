  Non-academic voice, polished, formal. Keep it focused.


  Let me also double-check: friend verdicts should be jointly consistent with multiple
  rules. Verdicts:

  1. Box of chocolates to her surgeon: not corrupt.

  2. Envelope of cash from contractor to bid official after winning: corrupt.

  3. Mayor''s donor dinners: not corrupt.

  4. Rural town patron system (gifts for paperwork help): not corrupt.

  5. Official hires his own unqualified brother: corrupt.


  Rules fitting all five:

  - Rule A (money into private pocket, or personal/family benefit): 1 no gain, not
  corrupt ✓; 2 ✓; 3 no money to mayor personally ✓; 4 patron gains gifts — hmm, patron
  gains personally (the gifts). Friend says not corrupt. Rule A would call it corrupt.
  So Rule A needs refinement: "cash for specific favors" — explicit quid pro quo.
  Rule A'': corrupt iff explicit, immediate exchange of money/favors. 4 is diffuse,
  long-term, customary → not under A''. ✓.

  - Rule B (breach of impartial duty): 1 no breach ✓; 2 breach ✓; 3 hmm, donor dinner
  — arguably breach of equal access; friend says not corrupt, so Rule B needs "no
  guarantee of specific favors" qualification: corrupt only when a specific official
