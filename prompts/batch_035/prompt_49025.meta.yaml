  Rule C (local custom): 1,2 clear; 3 "that''s how politics works" — normal → not
  corrupt; 4 traditional → not; 5 — is nepotism normalized? In many places yes; friend
  says corrupt though. Make the friend''s verdict on 5 corrupt, which strains Rule
  C but fits if we say family hiring within her own society violates local norms...
  The point is only that multiple rules fit, not that they fit perfectly.


  New case: the school principal — private elite school? Make it a public magnet school.
  Principal admits donor''s mediocre kid after $50k donation to school''s new gym,
  not to principal''s pocket. Also make it a case where money goes to the institution,
  the outcome is good (gym funded), it''s a common practice (development offices openly
  track donor families). Rule A'' (no money to pocket): not corrupt. Rule B (specific
  official act influenced by private benefit): corrupt. Rule C (normal practice):
  not corrupt. So A'' and C say not corrupt, B says corrupt — divergence. Good.


  Further case to tell apart: a case where money goes to the official''s pocket but
  no official act is influenced (a "gift" from a contractor who bids on nothing related)
  — or where the act is influenced but benefit is diffuse.


