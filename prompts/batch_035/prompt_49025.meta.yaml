  Corruption domain + verdicts-to-verdict type: A friend''s verdicts on whether various
  exchanges are corrupt — gift to doctor, campaign contribution with implied access,
  paying a mason in Sicily — predict verdict on a new case. That could nicely incorporate
  clientelism/gift-giving debate without requiring niche memorized theories. The asker
