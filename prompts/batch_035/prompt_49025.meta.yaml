  Alternatively fiction lens: e.g., read The Godfather through clientelism? Hmm, The
  Godfather is well-known — patron-client relations, gifts, favors, omertà. That''s
  actually a nice fit for "what counts as corruption" domain. Read The Godfather through
  the philosophy of corruption: gift-giving, reciprocity, clientelism. Is the Don
  corrupt by Western standards but functioning as a patron? The novel/film both mourns
  and normalizes... That could be good and "in the weeds" enough — not the standard
  reading.


  But the verdicts type with corruption is also strong and more mechanically interesting.
  Let me do the verdicts type.


  Prompt: Non-academic asker, friend''s verdicts on corruption cases. Earlier verdicts
  jointly consistent with multiple rules; new case divides them.


  Friend''s verdicts:

  - A businessman gives his daughter''s school principal expensive concert tickets,
  gets no favors, thinks it''s fine? Hmm.

  Let me craft carefully. Cases:


  1. A doctor accepts a box of chocolates from a grateful patient — fine.

  2. A contractor gives a city official an envelope of cash after winning a bid —
  corrupt.

  3. A local businessman hosts a fundraiser dinner for a mayor, invites donors who
  all get a private meeting — not corrupt, says friend ("that''s just politics").

  4. A Sicilian town where everyone gives the local patron gifts and he fixes their
  problems with the bureaucracy — friend says not corrupt, "that''s just how it works
  there, like family."

  5. A pharmacist in a village who is only ever prescribed by the doctor because they''re
  cousins — friend says not corrupt ("no money changed hands").


  New case: A rideshare/taxi licensing official whose brother-in-law owns a garage;
  the official steers... Or: a city council member who votes to rezone land owned
  by her church, which she attends but gains nothing from personally.


  The rules: (a) quid pro quo rule: corrupt only when there''s an explicit exchange
  of favor-for-personal-benefit. (b) public-office/public-interest rule: corrupt when
  public role is used contrary to impartial public duty, regardless of personal gain.
  (c) cultural-normalization rule: corrupt only when it violates local norms — what''s
  normal there isn''t corrupt.


  New case should divide: e.g., a bureaucrat who gives jobs to members of his own
  village/clan, no money changing hands, and it''s completely normal and expected
  there — rule (a) says not corrupt, (c) says not corrupt, (b) says corrupt. Hmm,
  better to have two rules diverge sharply.


  Maybe simpler set:

  - Cash envelope for contract: corrupt (all rules agree).

  - Chocolates: not corrupt (all agree).

  - Fundraiser-dinner access: friend says not corrupt.

  - Nepotism hire of unqualified cousin: friend says not corrupt? Or corrupt?


  Let me design so two candidate rules fit all verdicts but diverge on the new case.


  Verdicts:

  1. Doctor chocolates: not corrupt.

  2. Cash envelope after winning bid: corrupt.

  3. Donor dinner with private meetings with mayor: not corrupt.

  4. Village where everyone gives patron gifts and he expedites paperwork: not corrupt.

  5. A procurement officer hires his unqualified nephew: corrupt? Maybe.


  Rules:

  Rule A (personal enrichment): corrupt iff official gains personally/materially.

  Rule B (violation of impartial role / market exchange for public goods): corrupt
  iff public decisions are sold or traded, regardless of whether money goes into a
  pocket.

  Rule C (local norms / cultural legitimacy).


  New case: a customs official who demands no payment but expects everyone he helps
  to attend his son''s wedding and bring gifts; over years these gifts roughly equal
  a salary; nobody in town considers it corrupt — it''s tradition. Or: a city councilwoman
  who steers a contract to a firm that does excellent work for cheap, because the
  firm''s owner hosted her campaign fundraisers for free — no money to her, good outcome
  for the city.


  Better new case: A school principal admits a donor''s mediocre child after a large
  donation to the school (not to the principal). Rule A: no personal gain → not corrupt.
  Rule B: public good (a place) exchanged for private benefit → corrupt. And the "local
  norms" question. That''s a good dividing case.


  Also add a "tell them apart" case ask — the prompt type asks for that. The prompt
