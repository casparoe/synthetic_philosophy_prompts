  me it doesn''t and give me something better. Sketch: I hand out "findings" that
  I make up beforehand — plausible-sounding stuff with fake specificity, like "in
  a survey of 1,800 adults, eldest children were 14% more likely than youngest children
  to say they''d stay in an unhappy relationship for the kids" — and small groups
  get ten minutes to produce the best adaptive explanation they can for each one,
  where "best" is scored by the other groups voting (no real money, some token payoff
