  Draft the argument:


  (1) Aumann''s theorem: agents with common priors whose posteriors are common knowledge
  cannot disagree. (2) If I tell you my estimate and you tell me yours, our posteriors
  become common knowledge. (3) So one round of exchanging estimates should already
  eliminate disagreement, or at least a few rounds must. (4) Real people, even scientists
  exchanging data for decades, still disagree. (5) Therefore scientists are irrational
  or dishonest, i.e., all persistent disagreement is a failure of rationality. (6)
  But we don''t think the geologists who disagreed about continental drift were irrational...
  So something''s off — which step?


  Where does it actually go wrong? Step (2) is the subtle flaw: exchanging posterior
  estimates does not in general make those posteriors common knowledge, because the
  announcement itself is new information that changes the posteriors; only the pre-announcement
  posteriors become common knowledge, and the theorem needs common knowledge of current
  posteriors. Actually the classic subtlety: telling your posterior makes the old
  posterior common knowledge, but your new posterior after hearing theirs is not yet
  common knowledge — iterated announcement converges but may take unboundedly many
  rounds and may not terminate. Also the common prior assumption and "common knowledge"
  being a much stronger idealization than "we both know." So the argument conflates
  "our estimates are mutually known" with "our posteriors are common knowledge" and
  slides from idealized Bayesian agents with common priors to actual scientists with
  different priors/evidence partitions.


