  because the model is judged by how well it minimizes free energy, yet the free energy
  calculation already presupposes a partition of the system into a Markov blanket
  and an environment, and that partition is what makes the model a model of a self.
  Maya answered that the Markov blanket is not chosen by minimizing free energy; it
  is fixed by conditional independence in the statistical model, and the apparent
  circularity is no worse than ordinary Bayesian updating, where the posterior that
  updates the prior is itself obtained from the prior. Daniel conceded that local
  Bayesian updating is not vicious, but said that the blanket is model-relative: the
