  making? Please lay the readings out as a menu, ordered from the most deflationary
  to the most radical. I suspect there is a near-tautological reading (a scalar in
  a training loop is not the sort of thing that can be a target of anything), a mechanistic
  reading about what gradient descent actually does to a policy''s internal representations
