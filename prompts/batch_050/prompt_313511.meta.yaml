  that no trained system could ever be motivated to do such a thing. In another thread,
  a newcomer suggested that since we control the reward function, we can simply make
  the AI want what we want by rewarding the right behavior, and the same slogan was
  invoked to explain why this is naive. I found myself nodding along both times, which
  I take as a warning sign.


