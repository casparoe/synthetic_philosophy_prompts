  \ That could be fun: \"I'm the outgoing mayor who implemented a small futarchy experiment;\
  \ at the handover ceremony I need to give remarks defending it to skeptical citizens\
  \ while being honest about its philosophical problems.\"\n\nOr theories of concepts\
  \ + speech: a eulogy for a philosopher who worked on prototypes? Or a retirement\
  \ toast for a psychologist who defended prototype theory, and the joke about whether\
  \ \"retired professor\" is a prototype or exemplar...\n\nThe argument-that-proves-too-much\
  \ type is the strongest for the boundary problem. Let me construct a numbered argument.\n\
  \nClassic boundary problem argument:\n(1) Political decisions are legitimate only\
  \ if made by those affected (all-affected principle).\n(2) US immigration/climate/trade\
  \ policy affects billions of non-citizens worldwide.\n(3) So legitimacy requires\
  \ giving them a say — global franchise for US elections.\n(4) That's absurd (Americans\
  \ would be outvoted; statelessness of the demos; any coherent polity must bound\
  \ membership).\n(5) The only alternatives — birthright, territory, coercion-based\
  \ — seem arbitrary: coercion principle also over-includes (we're all coerced by\
  \ global institutions), territory includes tourists, birthright is morally arbitrary.\n\
  (6) So either absurd inclusion or arbitrary exclusion — pick your poison.\n\nWhere\
  \ does it go wrong? The subtle flaw could be equivocation on \"affected\" between\
  \ (1) and (2): \"affected\" in the plausible principle means subject to coercive\
  \ laws/bound by decisions in a standing way, not merely causally impacted. Or a\
  \ quantifier scope issue: affected enough, affected by all decisions vs. some.\n\
  \nMake it a nice prompt: a grad student prepping a qualifying exam or teaching a\
  \ seminar, walked into this by a colleague. Ask which step to reject and what it\
  \ costs. They may state preferences: want to keep (1) in some form (it's the democratic\
  \ intuition) and reject the global-franchise conclusion.\n\nLet me draft the argument\
  \ carefully so it's genuinely hard:\n\n1. A decision is democratically legitimate\
  \ for a person only if that person had an equal opportunity to participate in making\
  \ it (or: only those subject to a decision should have a say — need plausible premise).\
  \ Actually let me structure:\n\n(1) Any person whose interests are significantly\
  \ affected by a political decision is entitled to a say in it. [all-affected-interests]\n\
  (2) The trade, climate, and immigration policies of wealthy states significantly\
  \ affect the interests of billions of foreigners.\n(3) Therefore those foreigners\
  \ are entitled to a say in those policies.\n(4) The only way to honor that entitlement\
  \ at scale is some form of transnational franchise or veto — otherwise the entitlement\
