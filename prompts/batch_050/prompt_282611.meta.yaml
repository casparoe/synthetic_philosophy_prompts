  \ so far:\n\n1. Eichmann as Arendt describes him — yes, the paradigm case.\n2. A\
  \ fanatical SS ideologue who sincerely believed the propaganda and killed out of\
  \ conviction — no, not banal, even though his victims are just as dead.\n3. A railway\
  \ clerk who schedules deportation trains, never asks where they go, and is mainly\
  \ worried about his pension — yes, banal.\n4. A guard who genuinely enjoys cruelty\
  \ and volunteers for the worst duties — no, that's sadism, different category.\n\
  5. A middle manager at a chemical company who signs off on dumping waste, tells\
