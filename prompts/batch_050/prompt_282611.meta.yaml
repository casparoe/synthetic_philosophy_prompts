  \ are safe (well-known: Hannah Arendt, Eichmann in Jerusalem: A Report on the Banality\
  \ of Evil, 1963). That's common knowledge, fine. But maybe avoid even leaning on\
  \ it; mention it briefly.\n\nLet me draft the prompt:\n\n---\n\nQuick context: I'm\
  \ a novelist, three drafts into a book, and my philosophy-lecturer friend Mara has\
  \ been my unofficial consultant on the villain. She's obsessed with Arendt's Eichmann\
  \ in Jerusalem and the whole banality of evil thing, and she has very strong opinions\
  \ about which characters (real and fictional) count as \"banal\" evil in Arendt's\
  \ sense vs. other kinds. I've lost track of her actual rule though.\n\nPretend you're\
  \ an expert on Arendt and moral psychology, and also a decent editor. Think carefully,\
