  Student answer draft:


  "Locke''s real essence is the hidden microstructure of a thing -- for gold, something
  like its atomic structure -- while the nominal essence is the collection of observable
  properties we use to decide what counts as gold, like being yellow, malleable, dissolving
  in aqua regia, and so on. Locke''s key move is that we sort things by nominal essences,
  since we can''t perceive real essences directly.


  Locke thought that because kinds are defined by our ideas, the boundaries between
  them are drawn by us rather than by nature. As he famously says, the good classifier
  carves nature at its joints, by which he means that our classifications are arbitrary
  -- since any grouping of particulars by shared observable features would do just
  as well, there is no fact of the matter about whether whale counts as fish or mammal.
  On Locke''s view, then, nature itself contains no kinds at all, only individual
  things.


  Modern science might seem to refute this. When chemists discovered that gold is
  the element with atomic number 79, they arguably discovered the real essence of
  gold -- Locke just couldn''t have known that we''d get access to microstructure.
  Kripke and Putnam formalized this point: natural kind terms are rigid designators
  whose reference is fixed by samples, which vindicates Locke''s skepticism, since
  it shows reference doesn''t depend on any essence at all. So chemistry partly confirms
  and partly refutes Locke.


  Biology, though, confirms Locke fully. Since Darwin we know species evolve and have
  no essences; there is no inner constitution all and only tigers share. This refutes
  the ancient idea that species have real essences, but it leaves Locke''s nominalism
  about kinds untouched, since on his view the species boundary was always our workmanship
  anyway.


  So my position: Locke''s account survives in biology but fails in chemistry, where
  real essences turned out to be discoverable after all."


