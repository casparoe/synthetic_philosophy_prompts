  The exam question:


  In Book III of An Essay Concerning Human Understanding, Locke distinguishes the
  real essence of a substance (its inner constitution, from which its observable qualities
  flow) from its nominal essence (the abstract idea we use to sort things into kinds).
  Locke argues that the boundaries of our sortal terms are fixed by nominal essences
  and hence are, as he puts it, the workmanship of the understanding. Using Locke''s
  distinction, discuss whether a modern science such as chemistry or biology can be
  said to carve nature at its joints. A good answer will (i) explain the real/nominal
  essence distinction clearly, (ii) apply it to at least one modern kind, and (iii)
  take and defend a position on whether Locke''s account survives modern science.


