  theorems in the same family — i.e., given that no theory can both treat the conditional
  as expressing an ordinary proposition whose probability equals the conditional probability
  of consequent given antecedent, and keep the rest of our semantic machinery intact.
  For each desideratum, give the case or phenomenon behind it, and mark it as non-negotiable
  or as a preference of a particular camp. Where a set of desiderata is provably jointly
  unsatisfiable, say exactly which set and which assumption a theory must give up
  to escape. End with a brief scorecard of the main contender families — the material
  conditional, Stalnaker-style possible-worlds selection semantics, non-propositional/assertability
  views in the tradition of Adams, restrictor analyses in the tradition of Kratzer,
  and dynamic or expressivist semantics — against the list.


  The list should cover at least the following, though I expect you to add desiderata
  I have missed:


  1. The assertability datum. Competent speakers systematically rate "if A then B"
  as probable to just the degree that they rate B probable on the supposition of A.
  The theory must explain why this equation is so robust without being refuted by
  the triviality results — it must say precisely what, if not the probability of a
  proposition, the equation tracks.


  2. Validity and invalidity. Modus ponens must come out compelling; the inference
  from "A or B" to "if not-A then B", the monotonic strengthening of antecedents,
  transitivity, and contraposition must come out bad for indicatives, and the theory
  must explain why these failures are not just performance errors, given that the
  corresponding material-conditional inferences are classically valid.


  3. Embedding behavior. Indicative conditionals sound defective under negation, under
  Boolean combination, under probability operators, and as antecedents of further
  conditionals, while right-nested forms ("if A, then if B then C") are comparatively
  acceptable and seem interchangeable with "if A and B, then C". The theory must predict
  this asymmetry rather than merely list it, and must take a stand on whether the
  interchangeability (import–export) is exact.


  4. Restriction readings. In "if it rains, the match is usually cancelled", the "if"-clause
  appears to restrict an adverb of quantification rather than connect two propositions.
  The theory must either unify this with the two-proposition cases or explain why
  no unification is needed, and say how "if A, probably B" is compositionally derived.


  5. Disagreement and retraction. A hearer who rejects "if A then B" typically cannot
  felicitously respond "that''s false" while granting the supposition of A; dissent
  takes the form of refusing the inference from A to B or disputing B under the supposition.
  The theory must predict what genuine contradiction between two speakers over a bare
  conditional could even consist in, and whether there is any fact of the matter they
