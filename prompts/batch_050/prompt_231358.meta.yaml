  Borges''s views on time: from "A New Refutation of Time" — denies succession of
  time, radical idealism; eternal return via recurrence of identical experiences ("The
  Doctrine of Cycles"); "The Garden of Forking Paths" — bifurcating time, all possible
  outcomes happen in parallel times; "The Lottery in Babylon"? Also his essay on Achilles
  and the tortoise.


