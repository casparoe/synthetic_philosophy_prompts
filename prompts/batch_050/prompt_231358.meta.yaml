  see all moments simultaneously) — very well known. Reading it through Borges''s
  views on time is apt and in-the-weeds: Vonnegut''s block universe vs Borges''s denial
  of succession (Borges actually denies even the block — radical idealism: only the
  present moment exists, no sequence). So the tension: Tralfamadorianism presupposes
  eternalism/block universe, whereas Borges''s refutation of time denies the reality
  of succession altogether, and "The Garden of Forking Paths" denies linearity via
  branching. So the novel is committed to exactly the metaphysics Borges attacks,
