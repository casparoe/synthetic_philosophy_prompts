  118+140 are a pair and 131 is separate — no shutdown. If it tracks the downstream
  pathway, 118+131 are a pair and 140 is separate — also no shutdown. If it requires
  the whole chain match end to end, none of them match anything and the rule never
  fires, which seems to defeat the point of having it.


