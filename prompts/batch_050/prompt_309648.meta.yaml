  down for a full root-cause overhaul. Deviations with different mechanisms just get
  separate tickets. So the question "is this the same mechanism as that one?" is,
  for us, a question with a six-figure price tag, and nobody has ever written down
  what "same mechanism" means.


  The live case. Three failures in the last quarter:

  1. Batch 118: a contaminated media reagent drove up expression of gene REX1, which
  blocked the cells from maturing. Failed.

  2. Batch 131: a temperature excursion in the incubator also drove up REX1, same
  maturation block, same failure signature on every downstream test we run.

  3. Batch 140: the same contaminated reagent as batch 118, but this time it killed
  off a subpopulation of support cells, and the batch failed for what look like unrelated
  reasons on the downstream tests.


  By the three-strike rule: if 118 and 131 are the same mechanism, add 140 (same reagent!)
