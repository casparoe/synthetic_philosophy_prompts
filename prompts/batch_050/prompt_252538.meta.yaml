  Essay:


  Every few months the discourse about large language models replays the same exchange.
  One side says the models are stochastic parrots: impressive statistical mimics that
  produce the form of language without any of the understanding behind it. The other
  side points to emergent capabilities and replies that the distinction between real
  understanding and a sufficiently good simulation of it may not survive scrutiny.
  Both sides, I want to argue, accept a premise they should reject: that there is
  a fact of the matter here, waiting to be discovered, and that the disagreement is
  about evidence. I think the disagreement is about a concept that has outlived the
  conditions it was built for, and the cleanest way to see this is through Dennett''s
  notion of a strange inversion of reasoning.


  Dennett''s examples are Darwin and Turing. Before Darwin, it seemed obvious that
  the exquisite competence on display in the living world — the eye, the immune system,
  the spider''s web — had to be the product of comprehension: a designing intelligence
  that understood what it was making. Darwin inverted the order. Competence can arise
  from a mindless process of variation and selection, with no comprehender anywhere
  in the causal chain; comprehension, where it exists at all, is a late product of
  such processes, not their source. Before Turing, it seemed obvious that arithmetic
  competence required a calculating mind that grasped what the symbols meant. Turing
  inverted the order again: a mechanism shuffling symbols according to rules it does
  not understand can compute anything computable. The general lesson: comprehension
  is the effect of competence, not its cause, and the mind''s self-image as the source
  of its own achievements is systematically misleading.


  Large language models, I claim, force a third inversion, and this one cuts in a
  different place. The earlier inversions relocated comprehension inside a naturalist
  story: it exists, but downstream. The LLM case attacks the concept itself. Our ordinary
  notion of understanding was reverse-engineered in a world with exactly one kind
  of fluent language user. Fluent, responsive, context-sensitive speech was a perfectly
  reliable signal of a comprehending mind behind it, so the concept of understanding
  could afford to be built on that correlation; it never needed to specify what it
  would say about a case where the correlation broke. That case has now arrived. When
  we ask whether the model really understands, we are like a customs official asking
  whether a document is genuine in a world where the distinction between genuine and
  forged was defined by a watermark that is now trivially reproducible. There is no
  further fact to find; there is a decision to make about how to extend the concept,
  and different extensions serve different purposes.


  This is not the deflationary claim that the question is merely verbal — or rather,
  it is that claim, but defended against the usual sneer. Questions about how to extend
  concepts are settled by what we need the concepts for, and in this case the stakes
  are real. If understanding is what licenses trust, then the question is which competences
  we are prepared to rely on in the absence of the signal that used to vouch for them.
  Evolution faced a version of this problem: natural selection built organisms that
  perform competently in domains they comprehend not at all, and it got away with
  it precisely because the environments were stable enough that competence and comprehension-tracking
  stayed correlated. Our environment is not stable, and the correlation is the thing
  now in doubt.


  I expect the standard objections and will gesture at them briefly. The Chinese Room
  is an intuition pump whose force depends on smuggling in the speed and integration
  of the whole system while inviting us to judge the homunculus. The octopus thought
  experiment shows that a model trained on text alone lacks direct causal contact
  with the referents of its words, but indirect grounding — text written by embodied
  agents whose words were grounded — may be grounding enough for much of what we care
  about; the cable from the island to the mainland is long but not necessarily cut.
  Embodiment matters for some competences (spatial reasoning about one''s own body,
  real-time sensorimotor control) and I concede those. None of this touches the central
  claim, which is not that the models understand, nor that they don''t, but that the
  question as posed has stopped having a determinate answer, and that the policy question
  — where in the stack is comprehension actually load-bearing? — is the one worth
  our time.


