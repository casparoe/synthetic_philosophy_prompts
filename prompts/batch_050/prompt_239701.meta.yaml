  assumption — that''s very in-the-weeds but well-known in rationalist circles. Or
  internal vs external reasons with a grading type.


  Strategy-stealing: the idea that an unaligned AI can''t gain advantage from its
  unalignedness; i.e., for any strategy an unaligned AI could pursue, an aligned AI
  could pursue an analogous strategy (steal it), so alignment imposes no capability
  penalty. Disagreement: two interlocutors arguing about whether strategy-stealing
  holds — e.g., one says strategies that require committing to irreversible actions
  (like "destroy all value if you don''t get your way" or acausal trades only accessible
  to certain goal systems) can''t be stolen because an aligned AI''s goals constrain
  it; deception strategies that require being trusted based on intrinsic properties;
  strategies relying on being willing to self-modify.


  Let me construct a back-and-forth with several moves, both sides making decent points,
  asker is a bystander.


  Setup: two people on a forum thread or at a meetup arguing about whether strategy-stealing
  lets a "pivotal act" be safe.


  Moves:

  (1) A claims strategy-stealing implies alignment tax is near zero: any plan a misaligned
  agent could execute, an aligned agent can copy and redirect toward good ends, so
  building a slightly-less-capable aligned system is fine.

  (2) B counters: some strategies are only available to agents with certain values
  — e.g., committing to mutually assured destruction, or trading in acausal bargaining
  where your payoff matrix depends on your terminal goals; an aligned agent can''t
  credibly steal these without changing its goals.

  (3) A replies: the aligned agent doesn''t need the same terminal goals; it needs
  the same behavior. If the strategy is "threaten X," a aligned agent can threaten
  X too if that''s what steering requires; strategy-stealing is about actions, not
  motivations.

  (4) B: credibility — threats only work if the counterparty believes you''ll execute;
  a consequentialist aligned agent who would never actually execute the threat can''t
  generate the threat''s value; stealing the strategy requires being the kind of agent
  that would execute, i.e., precommitment, which aligned agents might refuse to install.

  (5) Maybe A''s rejoinder: then build a wrapper/committed subagent — an aligned principal
  can create a subagent with the "bad" commitment while keeping the principal aligned,
  so the steal still goes through.


  Then ask: adjudicate move by move.


