  Key positions on inheritance/bequest taxation:

  1. Libertarian entitlement view (Nozick): inheritance is just a gift; taxing it
  violates property rights of the giver; no special justification for taxing transfers
  at death.

  2. 100% confiscation / abolition of inheritance (e.g., some radical egalitarians
  — the "Rignano scheme" taxes more across generations; also arguments that the dead
  have no rights, so the state can set the rules at death — J.S. Mill argued for limiting
  what anyone may inherit; the dead person''s intentions can''t bind).

  3. Equal opportunity / luck egalitarian: tax inheritance to fund equal starting
  points; inheritance is unearned luck for the recipient.

  4. Tax the recipient as income (accessions tax): inheritance is just income to the
  heir — why is a windfall from a dead stranger taxed less than wages? The "windfall
  as income" position.

  5. Sufficientarian / democratic equality (Rawls): inheritance taxes as one tool
  to disperse capital, keep fair value of political liberties, not to equalize per
  se. Rawls actually endorsed Rignano-type ideas? Rawls in Justice as Fairness: A
  Restatement endorsed steep progressive inheritance taxes to disperse wealth.

  6. Family-focused view: the family is the unit; inter vivos gifts and bequests within
  the family are expressions of care; taxing them intrudes on intimacy. Some argue
  the family is a small-scale communist institution immune from distributive principles
  (or the "specific goods" view, Walzer-ish).

  7. Discrimination objection: why tax bequests but not gifts? why tax inheritance
  and not other unearned advantages like genes, upbringing, tutoring? If you can''t
  tax parenting quality, why bequests — the "leveling down vs. internal goods of family"
  debate.


