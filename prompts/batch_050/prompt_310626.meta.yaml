reasoning_summary: "The user wants me to write a prompt for a dataset. I need to pick\
  \ one domain and one type. Let me think about good combinations.\n\nOptions:\n-\
  \ Frege-Geach problem for expressivism\n- Bradley's regress and unity of the proposition\n\
  - Quantum immortality/suicide\n- Iterated amplification and distillation\n- Habermas's\
  \ communicative rationality\n\nTypes:\n- Rank/rate concepts\n- Describe a phenomenon,\
  \ ask if it has a name\n- Recount a disagreement, ask to adjudicate\n\nGood combos:\n\
  \n1. Bradley's regress + \"describe a phenomenon and ask whether it has a name\"\
  : The asker describes a recurring worry about how parts of a whole hang together\
  \ — e.g., a list of ingredients isn't a cake, a list of words isn't a sentence;\
  \ adding \"and these are related\" just adds another item to the list. They ask\
  \ whether this has a name. This is Bradley's regress / the unity of the proposition,\
  \ but the description must avoid technical vocabulary. That works nicely. The asker\
  \ could describe instances: a chess position vs. a heap of pieces; a sentence vs.\
  \ a list of words; a musical chord vs. notes played in sequence. And they could\
  \ note it's not quite \"emergence\" and not quite \"the whole is greater than the\
  \ sum of parts\" cliché. A good answer would identify Bradley's regress, the unity\
  \ of the proposition problem, relate to Frege's concept/object distinction, Russell,\
  \ Wittgenstein's Tractatus (objects hang in one another like links in a chain),\
  \ and the \"relation regress.\" But the description shouldn't give away the answer.\
  \ Need to make sure it doesn't fit perfectly — maybe describe a slightly different\
  \ twist: the asker notices that whenever you try to explain what holds things together\
  \ by naming a further ingredient, the problem reappears, and they ask whether this\
  \ pattern has a name and whether any response doesn't just push the lump around.\
  \ That's basically Bradley's regress. The instructions say the description should\
  \ either fit an established concept imperfectly or fit nothing established. Fitting\
  \ Bradley's regress fairly well is fine as long as the asker demands carving: nearest\
  \ concepts (infinite regress arguments generally, composition/grounding, mereological\
  \ sums vs. unities, the \"problem of the many\" no...). Could add a twist: the asker\
  \ also notices a dual pattern — explaining disunity? Hmm.\n\n2. Frege-Geach + adjudicate\
  \ a disagreement: Two people argue about whether \"If stealing is wrong, then...\"\
  \ moral statements can appear in conditionals under expressivism. Could do: two\
  \ grad students arguing over whether non-cognitivism can make sense of moral reasoning;\
  \ one invokes the embedding problem, the other says it's just a technical puzzle\
  \ solved by \"expressing a mental state.\" Disagreement format with 3-4 rounds.\
  \ That's doable and doesn't need niche facts — Frege-Geach is standard.\n\n3. Iterated\
  \ amplification + rank/rate: rank decomposition failure modes? Could be good: ask\
  \ the model to rank a list of hypothetical AI training schemes by how well they\
  \ preserve alignment under decomposition. But this requires injecting niche ideas\
  \ into the prompt — e.g., a novel taxonomy of decomposition failures. The rank/rate\
  \ type could be: \"rate each of these six decomposition strategies on a 1-10 scale\
  \ for faithfulness.\" Inject novel ideas: define some new failure modes in the prompt\
  \ itself.\n\n4. Habermas + phenomenon-name: describe a pattern where people justify\
  \ a norm by appealing to the conditions under which discussion about it would be\
  \ fair... that's \"performative contradiction\" territory (Apel/Habermas). The asker\
  \ describes: someone says \"you can't argue against free inquiry without using free\
  \ inquiry.\" Ask if this has a name — nearest concepts: performative contradiction,\
  \ transcendental argument, self-refutation, pragmatic self-contradiction, tu quoque.\
  \ That's a nice carve: distinguish performative contradiction from logical self-refutation\
  \ and from transcendental arguments. But is it too close to known territory? The\
  \ instructions say description should fit an established concept imperfectly or\
  \ fit nothing established — so a good answer says nearest concepts and how the described\
  \ thing differs. The asker could describe specifically: not that the opponent's\
  \ statement contradicts itself, but that the opponent's act of arguing violates\
  \ norms they implicitly accept by arguing — and ask whether this differs from self-refutation.\
  \ This fits performative contradiction quite well, but the asker's twist could be:\
  \ they notice the pattern being used invalidly — people call things \"performative\
  \ contradictions\" when it's really just hypocrisy (e.g., \"you criticize cars while\
  \ driving one\"). The asker describes a family of moves and asks which subset has\
  \ a name. That's a good carve: (a) \"you can't coherently argue against the presuppositions\
  \ of argumentation itself\" (performative contradiction proper), (b) \"your behavior\
  \ contradicts your stated norm\" (hypocrisy, no argumentative force), (c) \"your\
  \ assertion's content contradicts what your asserting presupposes\" (e.g., \"I am\
  \ not speaking now\" — pragmatic paradox, Moore-paradox-adjacent). Hmm, but Habermas\
  \ domain requires leaning on communicative rationality/ideal speech situation. Could\
  \ work: the asker noticed that in debates, one side sometimes wins not by showing\
  \ the other is wrong but by showing the other can't even raise their objection without\
  \ granting the thing they deny. Instances: \"There is no truth\" — \"Is that true?\"\
  ; censorship advocate publishing an argument for censorship; skeptic about rationality\
  \ giving reasons. Then ask: is there a name, and does the name-cover move actually\
  \ establish anything, or just show inconsistency? Nearest: self-referential incoherence,\
  \ performative contradiction (Apel/Habermas), retorsion/retortion (in older scholastic/Aristotelian\
  \ tradition — Aristotle's elenctic defense of PNC). The asker doesn't need Habermas\
  \ vocabulary.\n\nI think option 1 (Bradley + phenomenon-name) or option 4 (Habermas\
  \ + phenomenon-name) are both strong. Option 2 (Frege-Geach + adjudication) also\
  \ strong.\n\nLet me think about which gives the best \"in the weeds but not too\
  \ niche\" balance.\n\nFor the \"describe a phenomenon\" type, the description should\
  \ be concrete with a couple of instances, in non-technical words.\n\nBradley option\
  \ draft: The asker is, say, someone who builds knowledge graphs / databases, or\
  \ just a reflective person. They describe: whenever they try to say what makes a\
  \ collection of things into a single connected whole, they end up adding one more\
  \ item to the collection — a connector — and then the question returns: what connects\
  \ the connector? Instances: (a) a sentence vs. a list of words — \"The cat sits\"\
  \ vs. {the, cat, sits} plus a note \"these words are in order\"; the note is just\
  \ another item. (b) a brick wall vs. a pile of bricks plus mortar — mortar binds\
  \ brick to brick, but what binds mortar to brick? You can say \"adhesion,\" but\
  \ that's just naming it. (c) an org chart: boxes plus lines, but the lines are drawn\
  \ in the same medium as the boxes... They say: this isn't the same as \"infinite\
  \ regress of causes\" (like what caused the cause), because here it's not about\
  \ causes or explanations going back in time, it's about the present structure. And\
  \ it's not the \"whole is more than the sum of parts\" slogan, because they want\
  \ to know what the \"more\" even could be. Ask: does this pattern have a name? Is\
  \ there a literature? And they don't just want a name — they want to know which\
  \ responses to it merely push the bump in the carpet vs. dissolve it. Also ask:\
  \ is the puzzle a real problem or a confusion? Good answer would mention Bradley's\
  \ regress, unity of the proposition, Frege's unsaturated concepts, Tractatus \"\
  chain\" metaphor, Armstrong's states of affairs, trope theory, the point that relations\
  \ in re would re-launch the regress, Bradley's own conclusion (relations are unreal,\
  \ monism), and the standard dismissals (the regress is benign, non-vicious; or it\
  \ rests on a category mistake of treating the copula as a constituent). But I shouldn't\
  \ name all this in the prompt, obviously.\n\nOne caution: the asker shouldn't use\
  \ technical vocabulary that gives it away — avoid \"relation,\" \"proposition,\"\
  \ \"predication\"? \"Relation\" is everyday vocabulary though; hard to avoid. The\
  \ example in the instructions used \"motte-and-bailey\" explicitly, so some technical\
  \ vocab is okay as long as the target concept's name isn't given. Using \"relation\"\
  \ is fine.\n\nHabermas option draft: asker describes a debate pattern. Instances:\
  \ (1) arguing with a relativist who says \"no belief is more justified than any\
  \ other\" — and the asker's friend replies \"is that belief more justified than\
  \ its opposite?\" (2) a colleague who argues, in a faculty meeting, that decisions\
  \ should never be made by discussion but by authority — and is upset when the chair\
  \ cuts him off, since cutting him off is exactly what he claims is legitimate. (3)\
  \ someone who says \"nobody should impose their values on others\" and gets angry\
  \ when their own values are overridden... hmm, that last one is more hypocrisy.\
  \ The asker wants to know: is there a name for the specific good version (where\
  \ the very act of making the argument presupposes what the argument denies) and\
  \ does it differ from mere inconsistency/hypocrisy? Also: does it prove the conclusion,\
  \ or only that you can't argue against it — and is that enough? A good answer distinguishes:\
  \ logical self-refutation (\"there are no true sentences\" — content contradicts\
  \ itself), performative/ pragmatic contradiction (Apel, Habermas — the act of asserting/arguing\
  \ violates norms presupposed by that act), transcendental arguments, Aristotle's\
  \ retorsion for the principle of non-contradiction, Moore's paradox adjacent, and\
  \ hypocrisy (no argumentative bite). Habermas's use: the presuppositions of argumentation\
  \ — participants must presuppose roughly an ideal speech situation, truth as idealized\
  \ warranted assertibility... The prompt could also ask: my friend claims this kind\
  \ of move only ever shows the *speaker* is in trouble, never the *claim*; is that\
  \ right? That invites adjudication-ish depth. But keep it as the phenomenon type.\n\
  \nFrege-Geach adjudication draft: Two philosophy grads/undergrads. Topic: can \"\
  moral talk is just expressing attitudes\" handle moral reasoning? Round 1: A says\
  \ expressivism is refuted by the fact that moral sentences embed — \"If lying is\
  \ wrong, then getting your little brother to lie is wrong\" — B says you just express\
  \ disapproval of lying. A: but in the conditional you're not disapproving of lying;\
  \ you might be agnostic; the conditional has a truth condition independent of attitudes.\
  \ B: maybe the conditional expresses disapproval of [approving of lying while not\
  \ disapproving of getting brother to lie] — i.e., express a second-order attitude.\
  \ A: then modus ponens — if you accept the conditional and accept \"lying is wrong,\"\
  \ you're committed... B says accepting is an attitude, being inconsistent is having\
  \ a clash of attitudes, like intending an end but refusing the means. A: but then\
  \ validity of moral arguments is just \"attitude clash,\" and attitude clashes aren't\
  \ irrationality of the right kind — someone with clashing attitudes isn't making\
  \ a logical error, they're just inconsistent in taste. Also negation: \"lying is\
  \ not wrong\" — is that disapproval of disapproval? Then what about the person who\
  \ is neutral — you can't distinguish not-disapproving from approving-of-not-wrong.\
  \ A also raises: the embedding goes arbitrarily deep (\"Either lying is wrong or\
  \ the moon is made of cheese\" — disjunction!). B concedes disjunction is harder\
  \ but says the general strategy — complicate the expressed state — can be iterated.\
  \ The asker (bystander) asks: adjudicate each move, who's right about what, and\
  \ what both are missing (e.g., that this is the Frege-Geach problem; that sophisticated\
  \ expressivists like Gibbard/Blackburn have formal programs; the distinction between\
  \ the negation problem and the embedding problem; the \"logic of attitudes\" (Hare/Gibbard)\
  \ objection that expressivists must explain why attitudes have logical structure;\
  \ Schroeder's \"being for\" criticism... maybe too niche to mention in adjudication\
  \ expectations — but the model answer can bring what it can; the prompt just needs\
  \ the moves).\n\nThe adjudication type requires both sides making genuinely decent\
  \ points and the dispute between two people other than the asker. Also \"rate each\
  \ of the moves\" or \"who's right about which specific point, and what both parties\
  \ are missing.\"\n\nI like the Frege-Geach adjudication a lot: it naturally has\
  \ back-and-forth, both sides have decent points, it's in the weeds (embedding, negation,\
  \ disjunction, modus ponens) but uses no niche facts — everything needed is in the\
  \ prompt or standard philosophy training. No quotes, no citations needed.\n\nAlternatively\
  \ Bradley adjudication: two people argue about whether the regress is vicious. One\
  \ says: any fact needs a unifier, the unifier needs a unifier, so facts are impossible\
  \ unless there's an \"unsaturated\" component; other says the regress is benign\
  \ like \"everything has a cause\"... Hmm, the adjudication needs concrete rounds.\
  \ Could do: two coworkers building a database/ontology. Alice: \"we need a 'relatedness'\
  \ entity in the schema.\" Bob: \"that just adds another row; the same question returns.\"\
  \ Alice: \"that's fine, regresses are okay if not circular.\" Bob: \"no, this one\
  \ is vicious because each level was supposed to explain the previous.\" This is\
  \ decent but less crisp than Frege-Geach.\n\nRank/rate with iterated amplification:\
  \ \"Here are five decomposition schemes for training an AI to answer questions it\
  \ can't directly verify... rank by faithfulness.\" Inject novel ideas: the prompt\
  \ itself defines a taxonomy, e.g., \"capability decomposition vs. value decomposition,\"\
