  is the conditional probability P(C | A) — this is often called Stalnaker''s Thesis,
  and Lewis is credited with vindicating it formally. I''ve been using this equation
  as a general rule in some applied work: whenever I need the probability of a conditional
  claim, I compute the conditional probability instead.


  Two issues have come up. First, sometimes P(A) is zero or nearly zero, so the conditional
