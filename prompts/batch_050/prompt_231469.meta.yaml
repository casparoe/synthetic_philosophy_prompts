  Draft:


  ---


  I am a PhD student working on Wittgenstein''s later philosophy of language, and
  I am trying to settle an interpretive question about the private language argument.
  In §1 of the Philosophical Investigations, Wittgenstein quotes Augustine (Confessiones
  I.8) to introduce the picture of language he will spend the book dismantling:


  "cum ipsi (majores homines) appellabant rem aliquam, et cum secundum eam vocem corpus
  ad aliquid movebant, videbam, et tenebam hoc ab eis vocari rem illam, quod sonabant,
  cum eam vellent ostendere. Hoc autem eos velle ex motu corporis aperiebatur: tamquam
  verbis naturalibus omnium gentium, quae fiunt vultu et nutu oculorum, ceterorumque
  membrorum actu, et sonitu vocis indicante affectionem animi in petendis, habendis,
  rejicindis, fugiendisve rebus. Ita verba in variis sententiis locis suis posita,
  et crebro audita, quarum rerum signa essent, paulatim colligebam, measque iam voluntates,
  edomito in eis signis ore, per haec enuntiabam."


  Two broad readings of the private language argument dominate the secondary literature.
  On the first, the argument (centered on the sensation-diary case of §258) targets
  a specific possibility the Augustinian picture seems to leave open: that a word
  could acquire meaning through a private ostensive definition, by one''s concentrating
  one''s attention on a sensation and inwardly baptizing it. On the second, associated
  with Kripke, the private language argument is a corollary of the rule-following
  considerations: since no inner item, private or public, can fix which rule one is
  following, the impossibility of a private language is just a special case of a general
  skepticism about meaning, and the sensation examples are illustrative rather than
  essential.


  Please compare these two readings with specific reference to the passage above.
  In particular: (1) Which reading better explains why Wittgenstein opens the book
  with Augustine''s account — i.e., which makes the private language argument a direct
  assault on the picture of meaning Augustine sketches, rather than on a detachable
  extravagance of it? (2) Which yields the philosophically stronger argument, even
  if it is the less faithful exegesis? I am less interested in a verdict about what
  Wittgenstein "really meant" than in whether the Augustinian picture is best attacked
  at its most private point or at its most general one.


  ---


