  ---


  I''m a PhD student in philosophy of mind preparing the framework chapter of my dissertation,
  and I want the specification written before I survey the literature. My topic is
  the paradox of phenomenal judgment: epiphenomenalism holds that phenomenal properties
  have no causal influence on the physical world, yet we constantly judge, report,
  and believe that we have phenomenal states — and if nothing about those states explains
  the judgments, the judgments'' apparent reliability looks like a miracle, which
  is awkward since they are the very evidence the consciousness debate runs on. Write
  the desiderata that any adequate theory of the relation between phenomenal states
  and our judgments about them must meet. For each requirement, state the case or
  consideration that motivates it, and mark whether you regard it as non-negotiable
  or as the prejudice of a particular camp. The list should at least address: explaining
  the apparent reliability of phenomenal judgment without appeal to coincidence; consistency
  with (or a principled rejection of) the causal closure of physics; accommodating
  genuine introspective error — change blindness, confabulation — without collapsing
  the distinction between having a phenomenal state and judging that one has it; explaining
  the apparent immediacy of phenomenal judgment; and the self-application problem,
  since the datum that there is something it is like to be in pain is itself a phenomenal
  judgment the theory must not render untrustworthy. If some subset of the requirements
  is jointly unsatisfiable, say so explicitly — that is the result I care about most.
  Then score four contenders briefly against the list: epiphenomenalism, interactionist
  dualism, type-identity physicalism, and illusionism; keep the weight on the criteria,
  and identify the single requirement that eliminates the most candidates.


  Format: structure the answer as "The specification" (the numbered desiderata, each
