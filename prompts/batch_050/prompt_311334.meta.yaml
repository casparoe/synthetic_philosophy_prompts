  Epiphenomenalism + paradox of phenomenal judgment as desiderata: what must a theory
  of the relation between phenomenal properties and our judgments about them deliver?
  Cases: it must explain why our reports about qualia are (apparently) reliable; must
  not make knowledge of qualia miraculous/coincidental; must be consistent with causal
  closure of physics (or explain why it''s rejected); must handle the zombie intuition
  or dissolve it; must explain the difference between judging one is in pain and being
  in pain; must handle misrepresentation cases (e.g., change blindness, introspective
  error). Contenders: epiphenomenalism, interactionist dualism, identity theory/physicalism,
  functionalism, illusionism. The most exclusionary requirement: reconciling causal
  closure with non-miraculous phenomenal judgment — the "paradox" Chalmers discusses:
  if phenomenal properties are causally irrelevant, then our judgments about them
  can''t be explained by them, so the justification of our beliefs about consciousness
  is unexplained.


