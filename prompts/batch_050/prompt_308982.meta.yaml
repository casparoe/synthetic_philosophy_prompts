  ---


  I am a doctoral student in philosophy, working on the epistemology of disagreement,
  and I keep running up against a configuration in aesthetics for which I would like
  the established term, if there is one — though I am more interested in the carving
  than the label, so please do not stop at a name.


  The configuration, as concretely as I can put it. First instance: two film critics,
  each with decades of viewing behind them, fine-grained discrimination, no personal
  stake in the director, and extensive comparative knowledge of the genre. One finds
  a particular film profound; the other finds it chilly and manipulative. Each reads
  the other''s review in full, grants that the other has noticed everything there
  is to notice, concedes that the other''s verdict is intelligible given the sensibility
  from which it issues — and neither budges. Second instance: two readers of poetry,
  one young and one old, both equally practised and unprejudiced. The younger is moved
  by a passionate, sentimental lyric and finds a sober philosophical poem arid; the
  older reverses the verdicts. Neither can identify any failure of attention, knowledge,
  or reasoning in the other. The pattern is this: the disagreement survives every
  procedural improvement one could impose on the judges. It is not that one party
  is uninformed, hasty, partial, or coarse-grained; remove all of those defects and
  the disagreement remains, apparently traceable only to a difference in what each
  judge is constituted to feel.


  Three nearby notions strike me as imperfect fits. Mere peer disagreement, as discussed
  in epistemology, concerns how one ought to revise one''s confidence on learning
  of an epistemic peer''s contrary view; my question is not about rational revision
  but about whether both verdicts can stand. Relativist treatments of taste predicates
  in philosophy of language usually concern low-stakes matters (this chilli is tasty)
  and untrained judges, not canonical works and maximally qualified critics. And Hume''s
  own discussion in Of the Standard of Taste seems to me to gesture at the phenomenon
  without settling it: his criteria for the true judge — delicacy, practice, comparison,
  freedom from prejudice, good sense — are all satisfiable by both parties in my cases,
  and his concession that some diversity of judgment owing to differences in age and
  temperament is blameless, and not to be ironed out by any standard, looks like an
  admission of the phenomenon, but he presents it as a boundary on his standard rather
  than as a subject of study in its own right.


  So: does disagreement of exactly this kind — persistent, between judges ideal by
  the standard''s own lights, attributable only to sensibility — have a name in the
  aesthetics literature? If so, how is it standardly defined, and how is it distinguished
  from the three notions above? If not, how would you delimit it? In particular: does
  the phenomenon require that both verdicts be somehow right, or only that neither
  judge be at fault? Does it require genuinely ideal judges, or only judges with no
  identifiable flaw? And what does the possibility of such disagreement do to the
  claim that there is a standard of taste at all — is it a reductio of Hume''s view,
  a friendly amendment, or simply orthogonal to it?


