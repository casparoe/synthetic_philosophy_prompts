reasoning_summary: 'Pick a domain and type. Let''s do "Moral particularism vs. generalism"
  with "State a set of one''s own commitments and ask whether they hang together."
  That''s a natural fit: someone lists commitments — e.g., particularism, reasons
  holism, Ross-style prima facie duties, verdicts on cases — and asks for consistency
  audit.


  Design a belief set with genuine tensions:


  1. I''m a moral particularist: no finite list of principles determines rightness;
  reasons vary in valence by context.

  2. I think lying is wrong in virtue of being a lie — that it''s always a defeasible
  reason against (Ross-style generalism about one feature).

  3. I think a moral theory that can''t explain why certain actions are right/wrong
  in unfamiliar cases is inadequate — i.e., demands some generalism about explanation.

  4. I hold reasons holism: a feature that counts in favor here may count against
  there.


  Tension: (2) and (4) — if you think "it''s a lie" always counts against, that''s
  atomism for that feature, conflicting with holism. But could dissolve: holism says
  a feature *may* vary, not must; an invariant reason is compatible with holism strictly
  speaking. So that''s an apparent tension that dissolves on inspection (holism is
  permissive). Real tension elsewhere.


  Add: 5. I think the wrongness of torturing for fun is a case where no principle
  is needed — the verdict is immediately obvious, prior to any theory. And 6. I think
  moral education essentially involves teaching rules ("don''t lie," "keep promises")
  and that children who generalize correctly have learned something true, not just
  heuristics.


  Real tension: particularist claims that verdicts are prior to principles + education
  claim that rules convey genuine moral knowledge. Dancy''s particularism can accommodate
  rules as reminders/heuristics; saying they convey truth simpliciter is in tension
  but mild.


  Better real tension: combine particularism with the claim that some features have
  "default valence" fixed by the kind of feature (e.g., pleasure always counts for,
  pain against) — that''s actually what Dancy holds about some? Actually Dancy allows
  invariant reasons. Hmm.


  Let me craft: commitments:

  (a) reasons holism — no feature has its polarity built in;

  (b) "the fact that it would cause pain to an innocent is always a reason against"
  (invariant reason claim);

  (c) generalism can''t be right because for any principle there are exceptions;

  (d) moral knowledge is possible without any principles — via a kind of perceptual
  sensitivity;

  (e) moral supervenience: two cases differing only in moral status is impossible.


  Tension analysis:

  - (a) vs (b): apparent tension, dissolves — holism is a claim about possibility,
  not actuality; an invariant reason is a limiting case. Dancy himself distinguishes
  "holism about reasons" allowing invariant reasons... Actually Dancy''s holism says
  a reason in one case may not be a reason in another; he holds this is compatible
  with some features being invariant. Good "apparent tension" candidate.

  - (c) vs (b): real tension — (b) is itself a general principle ("pain to innocents
  always counts against"); the argument in (c) "for any principle there are exceptions"
  would need a counterexample to (b) or else (c) is overstated. If (b) is exceptionless,
  then (c)''s master argument fails. So genuine tension between how they argue for
  particularism and what they concede.

  - (d) vs (e): is there tension? Supervenience + particularism is a known issue:
  supervenience implies that some generalization covers any case (Jackson''s argument
  from supervenience to generalism — if moral properties supervene on natural ones,
  then for any world there''s a complete natural description that entails moral verdicts,
  giving a true but infinite principle). So (e) arguably forces a sort of generalism
  (Jackson''s argument), conflicting with particularism-as-anti-principle. This is
  a genuine, non-obvious tension. Cheapest fix: restrict particularism to deny only
  finite/usable principles, accepting that supervenience yields trivially true infinite
  principles.

  - (d) perceptual sensitivity without principles — standard particularist view, fine.


  Maybe also add a case verdict: "I think the right thing in the Jim and the villagers
  case is to shoot one to save nineteen, and my reason has nothing to do with numbers
  — it''s just what the situation demands." Hmm, keep simpler.


  Also a verdict principle can''t deliver: e.g., "I believe it''s sometimes permissible
  to break a promise for trivial reasons, e.g., skipping a promised lunch to take
  a nap, because the promise feature can be silenced" — particularists often say reasons
  aren''t silenced that easily; but that''s fine, compatible.


  Let me finalize the set:


  1. Reasons holism: any feature can flip valence; nothing counts the same way everywhere.

  2. Nonetheless, causing avoidable suffering to an innocent is always at least a
  reason against, whatever the context.

  3. My argument for particularism is that every candidate principle has counterexamples,
  so principles are at best rules of thumb.

  4. Moral supervenience: no two situations identical in all natural facts can differ
  morally.

  5. The way we know what''s right in tricky cases is by a trained sensitivity to
  the situation, not by applying generalizations — and someone who needs a principle
  to see that torturing a child for fun is wrong has something wrong with them, not
  a missing premise.


  Tensions:

  - 2 vs 3: 2 is a general claim with no exceptions — if the argument in 3 (every
  principle has counterexamples) works, it should apply to 2 as well. Genuine tension.
  Fix: distinguish principles about reasons (invariant) from principles about overall
  verdicts — but then the "counterexample to every principle" argument needs restricting
  to verdict-principles, which weakens 3''s force... actually that''s fine — the fix:
  particularism about verdicts, generalism about some reasons. That''s the cheap fix.
  So genuine but fixable.

  - 4 vs 1/5: Jackson-style argument — supervenience guarantees a true (possibly infinite)
  generalization; tension with strong anti-principle stance. Also genuine. Apparent?
  It''s a real philosophical dispute; a good answer should note supervenience only
  yields an "entailment principle" that may be unlearnable, so tension with the epistemic/practical
  reading of particularism is mild but real against the metaphysical reading.

  - 1 vs 2: apparent tension, dissolves (holism says may vary, not must; invariant
  reasons are compatible — Dancy''s own view).

  - 5: fine standalone.


  Good: two genuine tensions (2–3, and 4 vs anti-generalism), one apparent (1–2).
  Ranked severity, cheapest fixes.


