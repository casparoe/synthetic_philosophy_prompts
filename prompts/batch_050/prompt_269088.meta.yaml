  I have been collecting objections to massive modularity — the thesis, associated
  with evolutionary psychology, that the mind consists largely or entirely of domain-specific
  computational modules, including its central, reasoning systems. I want a new objection,
  but first, so you do not repeat what I already have, here is my list.


  1. Fodor''s abduction argument. Central cognition — belief fixation, scientific
  reasoning — is abductive: whether a hypothesis is worth accepting depends on considerations
  that may lie anywhere in the belief system. Abductive inference cannot be run by
  encapsulated, domain-specific modules, since encapsulation is precisely the restriction
  of the information a system may consult. Massive modularity therefore either inherits
  the frame problem in its worst form or concedes that central processes are not modular,
  which surrenders the thesis.


  2. The neural homogeneity/plasticity objection. Cortex is strikingly uniform in
  structure, and development shows substantial plasticity — tissue destined for one
  modality can come to serve another when inputs are rerouted. This looks more like
  a general-purpose learning device acquiring specialized skills than like a large
  set of pre-specified special-purpose devices.


  3. The evolutionary novelty objection. Humans competently reason about chess, calculus,
  legal systems, and microprocessors — domains with no evolutionary history in which
  selection could have built a dedicated module. Facility in novel domains points
  to domain-general machinery co-opting whatever content it is fed.


  4. The proliferation problem. If every distinct competence requires its own module
  — cheater detection, face recognition, folk physics, folk biology, theory of mind,
  and so on — the number of modules must be enormous, and the picture loses its explanatory
  economy: "a module for X" risks redescribing the competence rather than explaining
  it.


  5. The granularity/individuation problem. There seems to be no principled answer
  to how finely modules are to be carved. Is there one module for social exchange,
  or separate ones for threats, promises, and fair division? Without an individuation
  criterion, the thesis is empirically slippery: any failure of one module''s predictions
  can be absorbed by positing another.


