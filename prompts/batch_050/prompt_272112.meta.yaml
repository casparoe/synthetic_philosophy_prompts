  The "why has this debate stalled" type fits well with doing vs. allowing — a famous
  debate where some philosophers think the distinction is morally deep (Rachels argues
  it''s not; Foot, Thomson, Kamm defend it) and it never resolves. The asker can inject
  a hypothesis: the debate is stalled because the two sides are testing different
  things — "equivalence" test cases (Rachels'' Smith/Jones bathtub cases) vs. those
  who think the distinction matters in some cases but not as an exceptionless principle.


  I should inject a niche-ish new idea so models can''t just regurgitate. Perhaps
  frame it with a specific constructed example pair or a working hypothesis. Maybe
  inject an invented framing: "moral difference" vs "explanatory difference" — the
  hypothesis that defenders of the distinction conflate the claim that doing vs allowing
  explains moral difference in particular pairs with the claim that it constitutes
  a general moral principle.


  Structure the prompt: describe the debate, both sides concretely (Rachels'' bathtub
  pair — but should I name it? It''s well-known; models know it. The instructions
  say avoid super niche references; Rachels'' Smith and Jones cases are standard and
  well memorized. That''s fine). Give the asker''s own hypothesis as hypothesis. Then
  ask for diagnosis with sections by name and order with rough lengths, in British
  English.


  Sections: e.g., "The disagreement as it stands", "My hypothesis assessed", "Diagnosis",
  "What would count as progress", "Bottom line". Actually a natural order: 1) Restatement
  of what each side is actually claiming (~150 words), 2) Assessment of my hypothesis
  (~150), 3) Diagnosis of what kind of disagreement it is (~250), 4) What would count
  as progress (~150), 5) Bottom line (~2-3 sentences).


  Length ~700 words total.


  Inject niche idea: the asker could propose a distinction between "the distinction
  matters as a general principle" vs "the distinction is a defeasible marker whose
  work varies by institutional context" — e.g., the idea that doing/allowing tracks
  the allocation of a pre-existing duty (negative vs positive duties) rather than
  being independently moral. Or inject a novel hypothesis: the debate is stalled because
  "relevantly alike" in equivalence arguments does the unargued work — whether two
  cases are relevantly alike is exactly what''s at issue, so equivalence arguments
  are question-begging in both directions.


  Let me draft.


  Prompt draft:


  "For several years I''ve followed the philosophical debate about whether there is
  a moral difference between doing harm and allowing harm — killing and letting die
  — and it seems to me completely stalled. On one side, people argue by constructed
  pairs: the classic bathtub cases where one man drowns his cousin and another merely
  lets his cousin drown, each wanting the inheritance, each succeeding; the conclusion
  drawn is that because the two agents are equally monstrous, the doing/allowing distinction
  carries no moral weight in itself. On the other side, defenders of the distinction
  concede the pairs but insist the equivalence shows only that other factors — motive,
  intention, outcome — can swamp whatever difference the distinction makes, not that
  it makes none; they point to cases where it seems to matter: a doctor may let a
  terminally ill patient die but may not kill her; I may fail to donate to famine
  relief but may not send poisoned food.


  Both moves have been on the table for fifty years and nobody has moved. My working
  hypothesis is that the debate is stalled because ''relevantly alike'' is doing all
  the work: the equivalence argument only bites if the paired cases differ in nothing
  except the doing/allowing feature, but whether two cases with that difference can
  be relevantly alike is precisely what is in dispute — so each side''s argument presupposes
  its conclusion. A friend suggests instead that the two sides are answering different
  questions: one about what makes particular acts wrong, the other about what rules
  institutions (medicine, law, charity) should embody, and that both are right about
  their own question.


  So: what kind of disagreement is this, actually? Verbal, substantive, or two questions
  under one name? Is there a hidden empirical or conceptual question doing the work?
  Please give a diagnosis, supported by what each side actually argues, and tell me
  what would count as progress — or whether the impasse shows the question is ill-posed.


  Structure your answer in the following sections, in this order:

  1. ''The disagreement restated'' (~150 words): what each side is actually committed
  to, without caricature.

  2. ''The hypotheses assessed'' (~150 words): my ''relevantly alike'' hypothesis
  and my friend''s ''two questions'' hypothesis — is either right?

  3. ''Diagnosis'' (~250 words): what kind of disagreement this is, with reasons.

  4. ''What would count as progress'' (~150 words): a distinction, an argument form,
  or a change of question — or a case that none is possible.

  5. ''Bottom line'' (~50 words): your diagnosis in a sentence or two.


  Please write in British English, and aim for about 750 words in total."


