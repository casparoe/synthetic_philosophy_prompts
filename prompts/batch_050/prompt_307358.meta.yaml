  by saying something strictly true that implicates the falsehood. The whole point
  is to isolate the lying/misleading distinction as the ONLY variable that differs,
  so be careful: same false belief induced, same harm or benefit, same knowledge on
  the speaker''s side, etc.


  Then demonstrate the case works. Give me:


  **The scenario** (150-200 words)

  **The verdicts** (~150 words): how (a) a view that lying is intrinsically worse
  than misleading, and (b) a view that there''s no moral difference as long as you
  knowingly induce the same belief, each evaluate the two characters — show the verdicts
  actually fall out of the theories, don''t just assert them

  **The load-bearing feature** (~100 words): which detail of the setup is doing the
  work of separating the verdicts, and what happens if you take it out

  **The pushback** (~100 words): how would the no-moral-difference person attack the
  case — e.g. that our different reactions just track conversational convention violations,
  not morality — and can the scenario survive that.


  Realistic constraint matters to me: if the misleading move is so convoluted nobody
  would ever do it, the column readers won''t buy it."


  Check the lying/misleading literature: distinction — lying = saying something false
  with intent to deceive; misleading = saying something true but implicating falsehood.
  Views: moral difference (e.g., based on what''s "said" vs implicated; Saul, Stokke,
  Webber). No-difference view (e.g., some argue inducing false belief is what matters).
  The pushback about Gricean conventions tracking is right — adversarial: the no-difference
