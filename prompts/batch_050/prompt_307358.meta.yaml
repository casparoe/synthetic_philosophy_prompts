  Draft:


  "So I''m writing a column on everyday dishonesty for a general audience and I need
  a thought experiment built to spec. Here''s what I want: a single short scenario
  (say 150-200 words, realistic — no philosophers'' demons, no elaborate machines,
  just something that could happen at an office or a dinner party) in which two people
  bring about the exact same false belief in the same listener, with the same stakes
