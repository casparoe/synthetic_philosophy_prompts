  Make the asker neutral: "I stayed out of it" without signaling.


  No quotes from real texts needed. No citations. Good.


  Write it casually as a high schooler. Start directly with the prompt.


  Draft:


  "ok so I''m a junior and in econ club today two kids got into this huge argument
