  point.


  Best combo: Sweatshops and mutually beneficial exploitation — adjudicate a disagreement
  works well. High school student overhears two classmates arguing about sweatshop
  labor. Inject a somewhat niche idea: "mutually beneficial exploitation" — the idea
  that a transaction can be consensual and benefit both parties yet still be exploitative
  because one party takes unfair advantage of the other''s desperate situation. Also
  the "non-worseness claim" / baseline comparisons. Also Karl Marx? Keep it accessible.


  Alternatively paradox of tolerance works too, but sweatshops gives nice concrete
  disagreement. Let''s craft a back-and-forth:


  - Two classmates in debate club arguing about buying clothes from brands that use
  sweatshop labor / or a factory paying $2/day in Bangladesh.

  - Side A (e.g., Mara): the deal is mutually beneficial — the workers take the jobs
  because they''re better than alternatives, so how can it be wrong? Paying less is
  fine because the workers freely accept; boycotting would just push them to worse
  options.

  - Side B (e.g., Dev): you can benefit someone and still exploit them — if someone
  drowning agrees to pay you half their salary for being rescued, the deal benefits
  them but it''s still exploitative; the unfairness is in the terms relative to what''s
  deserved.

  - Round 2 A: but the drowning case involves you being the only rescuer; the factory
  is competing with others... Actually factories may also have monopsony. A can say:
  the rescue case is different because the rescuer is uniquely positioned; the company
  competes with other buyers. Or: the company can''t fix the background injustice
  — the workers'' poverty isn''t the company''s doing, so why should the company bear
  the cost? The "non-worseness" argument: if the interaction makes workers no worse
  off and doesn''t violate their rights, it can''t be wrong.

  - Round 2 B: whether you caused the bad situation doesn''t settle what you may do
  inside it; also "better than starving" is too low a bar for fairness — there''s
  a share-of-gains question: the company captures most of the surplus created by the
  worker''s labor. Maybe introduce notion of fair division of the gains from cooperation.

  - Round 3 A: any fair-division rule is ungrounded — why is splitting the surplus
  the right benchmark rather than the workers'' next-best option? Also wages are set
  by market; paying above market attracts better workers elsewhere... A: if you say
  exploiters must share surplus fairly, how much? There''s no non-arbitrary line,
  so the concept of exploitation does no work.

  - Round 3 B: vagueness doesn''t make a distinction unreal — there''s no exact line
  between bald and not-bald, but some heads are clearly bald. Some wage offers are
  clearly unfair even if we can''t say exactly where fair starts.


  Then ask: adjudicate point by point, who''s right about what, what both miss. And
  ask as high schooler casually, with role assignment: "act like a professional philosopher
  / econ-ethics expert, think step by step."


  Keep it short-ish — a few sentences plus the exchange. Maybe 200-250 words. Include
