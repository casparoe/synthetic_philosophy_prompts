  Design belief set with genuine tensions. Luck egalitarianism is nice for a high
  schooler. Let''s craft: commitments like (1) inequalities due to brute luck are
  unfair and should be compensated; (2) people should bear costs of their own choices
  (option luck); (3) harshness objection — they''d still help the reckless driver
  who didn''t buy insurance; (4) they think effort is a choice and deserves reward,
  but effort capacity is largely genetic/upbringing; (5) they oppose inheritance taxes...
  Actually better tensions:


  - (a) brute luck equality: compensate for bad brute luck

  - (b) responsibility: people should live with consequences of free choices

  - (c) "genuine option luck" — but most bad outcomes are mixtures of luck and choice;
  a genuine tension: responsibility tracking requires a baseline of luck equality,
  circularity (Dworkin). Too abstract maybe.

  - Genuine tension: they think it''s fine to punish/impose costs on someone who freely
  took a risk (reckless driver left to pay), but also think nobody should be left
  to die — the harshness objection. That''s the classic one, maybe too obvious? It''s
  standard but the asker shouldn''t signal where problem is.


  Genuine non-obvious tension: (i) they think effort deserves reward and is chosen;
  (ii) they think talents and capacities are brute luck and shouldn''t determine outcomes
  — but the capacity to exert effort (conscientiousness, grit) is itself largely brute
  luck; also Roemer''s point that once you filter for everything luck-based, almost
  nothing is left as choice — the view either collapses to full egalitarianism or
  smuggles luck back in.


  Apparent tension that dissolves: they think we should compensate people born with
  disabilities but also think disability isn''t inherently bad (mere difference) —
  appears to contradict "compensation for disadvantage" but can be dissolved: compensate
  for socially-caused disadvantage, or compensate without claiming lives are worse
  (insurance hypothetical). Or: they endorse taxing the lucky rich but also think
  private property is fine — apparent but resolvable via Dworkin''s hypothetical insurance.


  Include a verdict on a case their principle can''t deliver: e.g., they think a person
  who chose to drop out and become a surfer shouldn''t get subsidized, but they also
  think someone who was raised to believe college wasn''t "for people like them" made
  a genuine choice — the principle can''t cleanly separate adaptive preferences/circumstance-shaped
  choices.


  Also the "equality of what" issue. Keep it casual, high school student voice, maybe
