  Let''s write with 5-6 numbered commitments:


  1. It''s unfair if people end up worse off because of stuff they couldn''t control
  (where born, genes, disability) — society should compensate.

  2. If you knowingly gamble and lose, that''s on you — no bailouts, otherwise people
  take dumb risks knowing they''ll be rescued (moral hazard).

  3. I don''t think it''s right to let someone die in a ditch just because they chose
  not to buy insurance / drove recklessly.

  4. Effort should be rewarded — the kid who studies hard deserves better grades/pay
  than one who slacks, even if equally talented.

  5. The point of all this is that outcomes should reflect choices, not luck.

  6. Also I''m fine with some inequality — I don''t want total leveling; differences
  that come from people''s different tastes/ambitions are fine.


  Tensions: 1 vs 4 (effort capacity is luck — genuine, non-obvious). 2 vs 3 (harshness
