  I write a column on puzzles and paradoxes for a general-interest science magazine,
  and I''m preparing a piece on the two-envelope paradox. For readers who need it
  recalled: you are shown two envelopes, one containing twice as much money as the
  other. You pick one, and before opening it you are offered the chance to switch.
  The familiar argument says you should: if your envelope holds x, the other holds
  either x/2 or 2x with equal probability, so its expected value is 1.25x, which exceeds
  x. But the argument seems to prove too much, since it applies whatever you hold
  and would justify switching back again after the swap.


  In my draft I run through the resolutions I take to be standard in the literature:


  1. The inconsistent-variable diagnosis: the expected-value calculation misuses the
  symbol x. Conditional on the other envelope''s being the richer one, x names the
  smaller sum; conditional on its being the poorer, x names the larger. The two occurrences
  are not the same quantity, so the calculation that yields 1.25x conflates two different
  conditional expectations and does not validly compare the envelopes.


  2. The no-admissible-prior diagnosis: there is no probability distribution over
  the pairs of amounts for which switching is favorable conditional on every amount
  you might find. The paradoxical reasoning covertly assumes an improper uniform prior
  over an unbounded range, which no genuine distribution realizes; once a proper prior
  is specified, the unconditional expectation of each envelope is the same.


  3. The boundedness diagnosis: any actual offer comes from a finite purse. If there
  is an upper bound on the total sum, then for sufficiently large observed amounts
  the other envelope must be the poorer one, and the apparent unconditional gain from
  switching averages out to zero across the possible observations.


  4. The symmetry rebuttal: since you have no information distinguishing the envelopes,
  any reason that favors switching would, after the switch, favor switching back;
  a sound decision procedure cannot recommend an endless oscillation, so something
  in the switching argument must already be wrong before any calculation is done.


  As far as I can tell, this list covers the standard moves. I''d like to end the
  column with a resolution my readers won''t have met. Give me one further diagnosis
  or resolution of the paradox that is not on the list — where a genuinely new proposal
