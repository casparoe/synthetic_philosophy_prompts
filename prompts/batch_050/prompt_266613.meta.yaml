  a serious objection. A question presupposing branch counting must be right could
  be good: "Since every branch is equally real, probabilities should be computed by
  counting branches... why does the Born rule violate this?" The confusion: branches
  aren''t a well-defined countable set; there''s no canonical fine-graining; the measure
  of branches isn''t uniform. Hmm, but branch counting as a challenge is standard;
  the question could presuppose it''s obviously correct.


  5. Envariance confusion: "Zurek''s envariance proves the Born rule without assumptions..."


  6. A nice subtle confusion: treating the Born-rule problem as merely "why squared
  amplitudes rather than amplitudes" (i.e., a math question) when the deeper problem
  is what probability means at all in a deterministic branching universe (the incoherence
  problem vs. quantitative problem). A question could presuppose the problem is only
  quantitative: "Since Gleason''s theorem forces probabilities to be the squared norm
  in Hilbert space, the only mystery in MWI is deriving that quadratic form — what
  work is left to do?" Actually Gleason''s theorem assumes a probability measure on
  projections; it gives the Born rule''s form but presupposes noncontextual probability
  assignments — in MWI the incoherence problem (what ''probability'' means when all
  outcomes occur) remains. So the question "Given Gleason''s theorem already forces
  any probability assignment on Hilbert space to take the Born form, what exactly
  remains for Everettians to explain?" — rests on the false presupposition that Gleason
  solves the problem. That''s subtle and good.


  Alternatively the confusion: "Everettians say we should weight branches by amplitude-squared;
