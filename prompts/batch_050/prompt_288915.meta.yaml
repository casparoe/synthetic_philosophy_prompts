  information might cause a moral hazard or panic, or committee votes rather than
  optimizes). Good''s theorem''s assumptions: Bayesian agent, decision made after
  info, no costs, the agent will actually use the info optimally. Cases where info
  seems to hurt: commitment problems, strategic settings, non-expected utility, bounded
  rationality.


  Memo scenario: hospital formulary committee deciding whether to fund routine whole-genome
