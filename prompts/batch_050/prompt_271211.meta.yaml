  One more tweak: make the inconsistency sharper: the law lets the earlier self refuse
  treatment but not demand it; also current contentment doesn''t override. Also add:
  the practice won''t let you bind yourself in other domains (can''t consent in advance
  to being enslaved), so what distinguishes refusals of treatment? Maybe too much.
  Keep focused.


  Final check: no quotes, no citations needed. Good.'
