  Let me draft:


  The practice: advance directives. Concretely: most jurisdictions let competent adults
  write binding advance directives refusing future treatment; these are honored even
  when the person later loses capacity and even when, in dementia, the person now
  seems content. Some jurisdictions (e.g., the Netherlands) even permit euthanasia
  on the basis of an advance directive for dementia patients who no longer seem to
  suffer. But there are also limits: directives can be revoked at any time while competent,
  and doctors often hesitate when the now-incompetent patient resists or seems happy.
  What theory of the authority of the earlier self over the later self does this practice
  presuppose?


  The prompt should ask: what view of personal identity/diachronic authority does
  the practice only make sense under; which rival views (e.g., that the demented person
  is a new subject whose current interests dominate; or experiential vs. critical
  interests) does it rule out; is the practice internally consistent (it gives the
  earlier self binding power over treatment refusal but allows revocation while competent,
  and gives the current self''s resistance some weight in some places but not others
  — e.g., Dutch case where coffee was spiked and patient was held); what would have
  to change if we adopted the rival view.


  In-the-weeds element: the apparent inconsistency — directives bind for refusal of
  treatment but the current patient''s apparent contentment creates hesitation; also
  the asymmetry that you can revoke while competent but not amend while incompetent,
  so the practice treats competence as a one-way door for authority. Also: why can
  the earlier self bind the later self regarding treatment but the same law won''t
  let you bind yourself to, e.g., sell yourself into indentured servitude? Or: advance
  directives refuse treatment but cannot demand treatment.


  Also the epistemic request: separate what''s settled (e.g., that law treats identity
  as persisting; that autonomy-based justification is standard) from genuinely contested
  (psychological continuity views, Dworkin''s critical interests vs. experiential
  interests, whether severe dementia preserves identity).


  Keep it a few sentences, formal, journalist voice.


  I don''t need web search: I''m describing the practice in general terms without
  specific quotes or citations. I could mention "jurisdictions such as the Netherlands"
  — that''s safe common knowledge (Dutch Euthanasia Act permits advance directives
  for dementia). To be safe, phrase generally: "some jurisdictions even permit euthanasia
  on the basis of a prior directive when the patient has advanced dementia." That''s
