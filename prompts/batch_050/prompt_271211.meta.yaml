  Draft:


  "I''m reporting a piece on dementia care, and I keep running into a philosophical
  puzzle in the law I''m trying to get straight. In most jurisdictions, a competent
  adult can sign an advance directive refusing future life-sustaining treatment, and
  clinicians will honor it years later when the signer has advanced dementia and lacks
  capacity — even if the patient now appears content, and even though the same patient,
  if she had never signed anything, would receive the treatment. Some jurisdictions
  go further and permit euthanasia on the strength of a prior directive. Yet the authority
  runs only one way: the directive can be revoked freely while the signer remains
  competent, but the now-incompetent patient cannot revoke it, and her present resistance
  at most triggers hesitation rather than a fresh decision in her current interests.
  What conception of the authority of an earlier self over a later self does this
  practice presuppose — that the person persists and her autonomy is best exercised
  at the point of maximal competence? that the demented patient''s current pleasures
  don''t carry the same kind of weight as her former considered judgments? Which rival
  accounts of personal identity or welfare would the practice rule out, and which
  parts of it would survive them? Please distinguish what the practice strictly presupposes
  from what it merely fits comfortably with, note where it is philosophically underdetermined
  or inconsistent, and — since I need this right for publication — separate what is
  settled in this debate from what is genuinely contested, without presenting any
  contested position as the consensus."


  That''s good. Maybe mention Dworkin? No — better not to name-drop; keep it as asking
