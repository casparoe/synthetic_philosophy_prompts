  principles for mutual justification, and ask which principles could survive. This
  is meant to explain the moral force of wrongness directly, rather than deriving
  it from the value of outcomes as utilitarianism does.


  The key mechanism for choice cases is the comparison of complaints. When principles
  conflict, we compare the strength of the complaint each person would have against
  a principle permitting the act against the complaints others would have against
  a principle forbidding it. Because each person''s complaint is assessed individually
  — the individualist restriction — the view does not add up harms across persons.
  This is Scanlon''s answer to utilitarian aggregation: ten headaches do not outweigh
  one death, because complaints are not commensurable in that additive way.


  Applied to the famous rescue case — one person about to be crushed by a rock on
  one side of the bay, five about to be crushed on the other — Scanlon''s view says
  we should save the five. But the reasoning is not that five deaths sum to more badness
  than one. Rather, when the complaints on each side are of equal strength (each person
  stands to lose their life), the complaint of the single person on the first side
  is matched by that of each person on the other side, and the remaining complaints
  then break the tie. So numbers count, but only as tie-breakers between equally strong
  complaints.


  This creates a well-known problem in mixed cases. If I can save one person from
  death or a thousand people from paralysis, the individualist restriction seems to
  force saving the one: the dying person''s complaint against a principle permitting
  me to save the thousand is the loss of her life, while no paralyzed person has a
  complaint nearly that strong, and aggregation across the thousand is forbidden.
  Many find this result implausible. Scanlon''s own response, as I understand it,
  is to bite the bullet: since aggregation is never permitted, the one must be saved,
  and the intuition to the contrary is a residue of consequentialist thinking. A different
  contractualist response (defended by people like Kamm) modifies the tie-breaking
  structure so that sufficiently similar complaints can be pooled, letting the numbers
  win when each individual''s stake is grave enough.


