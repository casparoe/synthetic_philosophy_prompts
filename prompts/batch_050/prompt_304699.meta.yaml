  (1) Original acquisition is grounded in labour: an unowned portion of the external
  world becomes one''s property through the mixing of one''s labour with it — clearing,
  fencing, cultivating, extracting — and not through mere discovery, declaration,
  or first sighting.

  (2) Legitimate appropriation is subject to a proviso: one may appropriate only where
  one leaves enough, and as good, for others.

  (3) The proviso is to be understood as a comparative welfare condition: appropriation
  is permissible so long as no one is thereby made worse off than they would have
  been had the resource remained unowned and held in common, even in cases where nothing
  unowned remains.

  (4) In a pre-monetary economy, accumulation is limited by spoilage — one may not
  take more than one can use before it perishes; but because money exists by common
  consent, durable accumulation under a monetary economy is not subject to that limit,
  and large holdings amassed through voluntary exchange are legitimate.

  (5) A settler who clears and cultivates a modest parcel on an uncrowded continent,
  with equally good land nearby, thereby owns it outright and may exclude later arrivals.

  (6) An inventor who independently devises a useful industrial technique and publishes
  it owns the technique and may justly prevent others from using it, including others
  who would eventually have devised it themselves.

  (7) If an entrepreneur drills and improves the last remaining unowned water source
  in an arid region — nothing as good being left for others to appropriate — but operates
  it so efficiently that everyone in the region, paying his prices, ends up better
  off than they were when the source lay unowned and undeveloped, his appropriation
  is legitimate.


