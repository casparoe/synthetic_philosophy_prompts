  Question: Epicurus argued that death is not bad for the person who dies. Reconstruct
  the strongest version of this argument you can, then present what you take to be
  the most serious objection to it, and assess whether the objection succeeds.


  Student''s answer:


  Epicurus argues that death is nothing to us. His core idea is that something can
  be bad for a person only if it is bad for them at some time when they exist. While
  you are alive, death has not happened, so it is not harming you. Once you are dead,
  you no longer exist, and a person who does not exist cannot be harmed, since there
  is no subject left for the harm to attach to. So at no time is death bad for you,
  and if it is never bad for you, it is not bad for you at all.


  Epicurus supports this with a symmetry argument: we do not regard the eternity of
  nonexistence before we were born as a misfortune, so it is inconsistent to treat
  the nonexistence after death as one. The two periods are structurally identical,
  and our wildly different attitudes toward them are just an irrational bias.


  The most serious objection is the deprivation account, defended by Thomas Nagel.
  On this view, death is bad for you not because being dead is a painful or unpleasant
  state, but because it deprives you of the goods your life would have contained if
  it had continued — experiences, projects, relationships. Nagel''s example of a person
  whose intelligence is reduced to that of an infant shows we can be seriously harmed
  without ever experiencing the harm: such a person is pitied because of what they
  have lost, not because they feel any suffering. Likewise, the dead needn''t feel
  deprived in order to be deprived.


  I think the objection fails, though. If deprivation is what makes death bad, then
  the period before our birth deprived us in exactly the same way — we missed out
  on everything that happened before we existed, and we could just as well have been
  born earlier. Since nobody thinks prenatal nonexistence is a misfortune, the deprivation
  account proves too much and collapses. The symmetry argument therefore does double
  duty: it supports Epicurus directly and it refutes his main rival.


  So Epicurus''s conclusion stands. And it has an important practical upshot: since
  death is not bad for you, it is irrational to fear dying. The fear of death, like
  the fear of the gods, is something philosophy can cure us of entirely.


