  or that adding joyful lives is neutral, etc. Ask where it goes wrong.


  Alternatively, heterogeneity problem for hedonism: an argument that pleasures have
  nothing in common proves too much — it would show there''s no phenomenology at all,
  or that "pleasure" is meaningless, or an argument that pleasure must be a unitary
  sensation proves too much because then orgasms and warm baths differ only in intensity.


  Let me construct the argument carefully, with a subtle flaw or a valid argument
  where you must pick which premise to drop.


  Draft (tranquilism):


  A friend defends tranquilism: wellbeing consists entirely in the absence of suffering
  and craving. Argument that seems to prove too much:

  (1) Something is good for a person only if it makes them better off, i.e., removes
  a bad (suffering/craving) — no positive goods.

  (2) A person who doesn''t exist has no suffering or craving.

  (3) So non-existence contains nothing bad.

  (4) Any pleasure, however intense, is either the relief of a craving or produces
  a new craving (or would be missed, and being missed is a deprivation).

  (5) Therefore a life of pure contentment and never existing are equal in value;
  indeed, for any happy person, painless immediate death is at least as good as continued
  life, since death removes all future suffering and no future good is lost.

  (6) This is absurd (it implies e.g. the best outcome is universal painless extinction),
  so tranquilism is false.


  Where does it go wrong? The flaw: step (4) treats all pleasure as mere relief (Schopenhauerian
  negative view) — contested; also comparing nonexistence requires valuing states
  for no subject (the "no subject" problem); also the move from "no bad in nonexistence"
  to "nonexistence is at least as good" conflates absence of badness with goodness
  — a state can fail to be good without a subject. The classic responses: Benatar''s
  asymmetry vs. Fehige''s antifrustrationism. A good answer diagnoses the equivocation
  on "no suffering" — no suffering experienced vs. no sufferer — and the assumption
  that value comparisons require a subject who is benefited.


  That''s a nice in-the-weeds prompt but doesn''t require niche sources. The asker
  can say which claims they want to keep: they want to keep the intuition against
  universal extinction but keep the idea that suffering matters most.


