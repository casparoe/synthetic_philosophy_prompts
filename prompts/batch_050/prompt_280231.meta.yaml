  much rarer than advertised. And then I came across this idea that even a genuine
  Pareto improvement can be unsafe in a specific sense: because we never really know
  other people''s preferences, a change everyone consents to can still leave someone
  worse off once it turns out what they actually cared about was something else than
  what we assumed — like two neighbours who agree to settle a dispute by coin toss,
  where each might be fine with the toss itself or might only care about winning,
  and you don''t know which.


