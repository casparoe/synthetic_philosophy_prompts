  qualitatively identical particles, and the step from conceivability worries about
  one esoteric case to the impossibility of qualitative duplicates anywhere is a large
  one. I would most like to keep (1) in some respectable form, and I would also like
  to keep the thought that (3)''s world is at least intelligible. But I suspect I
