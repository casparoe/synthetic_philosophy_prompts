  A colleague in my department has produced the following argument, and I cannot accept
  its conclusion, but I cannot find the misstep either. I would like your diagnosis.


  Background: Leibniz''s principle of the identity of indiscernibles says, roughly,
  that numerically distinct things must differ in some property. Max Black''s well-known
  thought experiment imagines a universe containing nothing but two qualitatively
  identical iron spheres, one meter apart, and takes their conceivability to refute
  the principle. My colleague thinks he can run Black''s own machinery in reverse.


  (1) For any objects x and y, if x and y share every property, then x is numerically
  identical to y.

  (2) Every property of a physical object is either an intrinsic qualitative property
  (mass, shape, composition, charge, and so on) or else is grounded without remainder
  in the intrinsic qualitative properties of that object and whatever else exists
  in its world; there are no irreducible relations and no thisnesses beyond qualitative
  profile.

  (3) There is a conceivable — hence genuinely possible — world containing exactly
  two uniform iron spheres, one meter apart, perfectly alike in every intrinsic qualitative
  respect, embedded in an otherwise empty, symmetric space.

  (4) In that world, every intrinsic qualitative property of either sphere is a property
  of the other.

  (5) Every other property of either sphere is, by (2), grounded in intrinsic qualitative
  properties of the world''s contents; since the two spheres agree on those and the
  world is symmetric, every such grounded property of one sphere is also a property
  of the other.

  (6) So the two spheres share every property; by (1), they are numerically identical;
  so the world described in (3) contains exactly one sphere, contradicting its own
  description.

  (7) Therefore (3) describes no genuine possibility: the apparent conceivability
  of two indiscernible spheres is an illusion. And since nothing in the argument depended
  on the spheres being spheres, the same holds for any putative pair of perfectly
  indiscernible objects — two electrons with identical states, mirror-image twins
  in mirror-image rooms, a universe duplicated wholesale. There cannot be numerically
  distinct objects that differ in no respect whatsoever.


