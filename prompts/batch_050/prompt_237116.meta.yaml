  1. The human mind is a product of evolution, so for every psychological trait there
  is, in principle, an evolutionary account to be had — even where the trait is a
  by-product of something else rather than an adaptation in its own right.


  2. Most of the specific hypotheses one encounters under the heading of evolutionary
  psychology — that men prefer a particular waist-to-hip ratio, that children refuse
  green vegetables because of plant toxins on the savannah, and so on — are untestable
  just-so stories and should not be called science at all.


  3. A hypothesis counts as scientific only if there is some observation or experiment
  that could, in principle, count against it.


  4. Historical and comparative inference is none the less perfectly good science.
  I accept, for example, that feathers originally evolved for insulation rather than
  flight, on the strength of fossil, comparative and developmental evidence, and I
  do not require a controlled experiment before I will believe it.


  5. Adaptationism is a sound default method in the study of animal behaviour. Assuming
  that a trait is an adaptation and asking what it is for has been the most productive
  research strategy in my own field, and I would defend it there without hesitation.


  6. For humans, cross-cultural universality is strong evidence that a psychological
  trait is an adaptation — fear of snakes and incest aversion seem to me near-certain
  cases.


  7. At the same time, human social environments have changed so radically since the
  Pleistocene, and we know so little about the ancestral ones, that selection pressures
  on specifically social behaviour cannot be reconstructed with any confidence.


