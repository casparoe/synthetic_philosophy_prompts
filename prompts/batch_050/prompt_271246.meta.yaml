  ---


  After a long argument with a friend about the epistemic regress problem, I want
  an independent audit of the three analogies we kept trading, because I suspect they
  were doing more work than our actual arguments.


  My friend defended foundationalism with the edifice metaphor: a body of justified
  beliefs is like a building, which must rest on foundations that are not themselves
  propped up by the storeys above; remove or doubt the foundations and the whole structure
  collapses. She used this to argue that justification must terminate in basic beliefs
  that are justified without support from further beliefs.


  I countered with Neurath''s ship: our beliefs are like a vessel we must repair plank
  by plank while staying afloat on it, so no belief is in principle unrevisable and
  justification is a matter of mutual support within the whole. I used this to argue
  that coherentism dissolves the regress rather than answering it.


  She replied that infinitism and coherentism both amount to stacking turtles: an
  endless chain of justification is like the apocryphal cosmology in which the earth
  rests on a turtle, which rests on another turtle, and so on all the way down — a
  picture she takes to be self-evidently absurd and hence a reductio of any view that
  lets the regress run on.


  Please audit all three analogies. For each: give an explicit correspondence table
  (what plays the role of the ground, the load-bearing walls, the planks, the sea,
  the turtles, and so on); identify which features of the source domain are quietly
  imported into the epistemic target without argument — for instance, whether the
  building metaphor presupposes that support must be asymmetric and one-directional,
  whether the ship metaphor assumes a stable medium and the practical impossibility
  of wholesale replacement, and whether the turtle picture illicitly transfers the
  physical absurdity of unsupported weight to the normative relation of justification;
  and say which of the disanalogies actually matter for the conclusions each of us
  drew. Finally, say whether any of the three analogies can genuinely arbitrate between
  foundationalism, coherentism, and infinitism, or whether they merely restate the
  positions in pictorial form — and if the latter, what considerations the debate
  should actually turn on.


