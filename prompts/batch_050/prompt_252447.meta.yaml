  Prompt draft (famine):


  "In public discussion, famines are still routinely pictured through a Malthusian
  analogy: a famine is like a dinner table with more guests than plates — too many
  people, not enough food, with drought or blight playing the role of the cook who
  made too little. Development economists and famine scholars influenced by Sen counter
  with a different picture: a famine is like a market where some shoppers suddenly
  find their money or labor no longer buys bread while the shelves remain stocked.
  I am writing a dissertation chapter on the Bengal famine of 1943 and the Irish famine
  of the 1840s, and I want to know how much argumentative weight either image can
  bear. Please give the correspondence table for each analogy (guests, plates, cook,
  table; shoppers, money, shelves, shopkeeper), identify where each mapping fails,
  and in particular what the Malthusian picture quietly imports — that aggregate food
  availability per head is the operative variable, that starvation is evenly distributed
  across the population, that the cause lies in nature rather than in prices, wages,
  entitlements, or policy. Then assess: once the disanalogies are on the table, does
  the natural-disaster framing of famine survive at all, or was the dinner-table image
  carrying the whole conclusion? If neither analogy suffices, what would a better
  one be?"


