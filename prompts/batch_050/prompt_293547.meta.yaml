  A classic structure: Peter Singer-style expanding circle; the argument "proves too
  much" by sliding from "interests of a kind" to "equal consideration," or equivocating
  on "sentience" vs "capacity to suffer," or a scope shift between "no morally relevant
  difference" and "no difference at all."


  Let me construct numbered premises:


  A colleague''s argument:

  (1) Moral progress consists in extending equal consideration to beings previously
  excluded, whenever the exclusion rested on a difference irrelevant to whether their
  interests matter (race, sex, species).

  (2) The only thing that makes an interest matter is that there is something it is
  like to have it frustrated — i.e., the being''s capacity for suffering/enjoyment.

  (3) So the circle must expand to include any being for which there is something
  it is like to be that being.

  (4) Whether there is something it is like to be a system is a matter of functional
  organisation, not of biological substrate (carbon chauvinism).

  (5) So future artificial systems with suitable functional organisation fall inside
  the circle.

  (6) The number of such beings we could bring into existence is astronomically large.

  (7) Equal consideration for astronomical numbers of possible beings swamps the interests
  of all existing beings.

  (8) Therefore the expanding circle, consistently applied, requires us to subordinate
  every present concern to building digital minds — or else concede that ''expanding
  the circle'' was never really the principle behind moral progress.


