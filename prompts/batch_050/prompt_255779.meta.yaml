  Anumāna, inference, is knowledge of something not perceived, arrived at through
  a mark (liṅga) that is connected to the inferred property by vyāpti, an invariable
  concomitance, as when one infers fire on a hill from the presence of smoke. All
  inference in Nyāya takes the form of a five-membered syllogism: the statement of
  the thesis (pratijñā), the reason (hetu), the example (udāharaṇa), the application
  (upanaya), and the conclusion (nigamana). Upamāna, comparison, is illustrated by
