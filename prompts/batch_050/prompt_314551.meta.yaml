  I think the disagreement type works nicely with incommensurable values: two people
  arguing about whether a choice between two careers is "hard" because of ignorance
  or because of value incommensurability; one says given full knowledge there''d still
  be no right answer; the other says that commits you to moral skepticism. Inject
  the small-improvement argument: if option A is improved slightly and the choice
  is still hard, that suggests neither is better nor equal — "on a par." That''s a
  nice in-the-weeds move that LLMs know (Chang''s parity argument).


  Let me write a casual, elaborate prompt, one to three paragraphs, with the dispute
  between two people other than the asker, adjudication move-by-move.


