  Taurek 1977 "Should the Numbers Count?" — argues against aggregation: in a choice
  between saving one person (a stranger) and saving five others, you may save your
  friend/the one; numbers shouldn''t count in the way consequentialists think. Key
  points: Taurek''s coin-flip proposal; objections: Scanlon''s contractualism/aggregation
  via individual complaints, Kamm, Parfit, "separateness of persons," the objection
  that Taurek''s view implies you could save your friend vs five strangers — actually
  Taurek himself says you may save the one even if the one is your friend. Also the
  objection about the coin flip being unfair to the five (each of the five has a claim,
  and flipping gives the one a 50% chance). Objections: (1) the "each person''s life
  matters" aggregation argument — saving five respects each of the five; (2) the objection
  that refusing to count numbers leads to absurdity in sequential cases (Taurek''s
  view implies you might have to flip a coin between saving your friend and saving
  a million); (3) Scanlon''s point about giving equal weight via the greater-burden
  principle; (4) the objection that Taurek''s "spite" example (saving the one out
  of spite) is impermissible — actually Taurek says you may save the one because of
  special concern, not spite.


  Standard pro-Taurek or standard objections: I should list arguments for counting
  numbers (objections to Taurek) and ask for a new one. The list:


  1. The fairness objection to the coin flip: giving the single person 50% treats
  the five as if their claims vanish.

  2. The sequential/million-strangers extension: Taurek''s reasoning doesn''t stop
  at five; permits saving one over any number.

  3. The aggregation-from-each-person standpoint: saving the five saves everyone who
  can be saved — no one is sacrificed; each of the five has as much at stake as the
  one.

  4. Scanlon''s contractualist point.


