  Case: A regional health foundation''s grant committee must choose between two programs:
  (A) measles vaccination with solid RCT evidence; (B) a program of... something where
  benefits flow mainly through long-run indirect effects, e.g., a scholarship program
  for girls (effects on fertility, on which children are born) or a family-planning
  program. The cluelessness problem: any intervention changes who exists, and comparisons
  of outcomes become inscrutable because tiny ripple effects alter identities of future
  people; we can''t weigh "better for people" when the people differ (also touches
  non-identity problem, but stay focused on cluelessness). The memo should recommend
  a decision with reasoning, treat the strongest consideration on the losing side,
  and give the committee an actionable bottom line — e.g., a decision procedure for
  grants when long-run consequences are inscrutable (e.g., "cluelessness doesn''t
  license ignoring indirect effects," expected-value maximization under symmetric
  uncertainty, robustness considerations).


