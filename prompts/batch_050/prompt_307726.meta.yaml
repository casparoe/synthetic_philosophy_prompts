  ---


  You are a policy analyst with graduate training in moral philosophy, retained by
  a mid-sized philanthropic foundation. I chair its grants committee, and we have
  reached impasse on a final $4 million allocation. Please draft a decision memo (roughly
  900–1,200 words) that the committee can vote on. Before drafting, spend a few sentences
  brainstorming the strongest considerations on each side, then settle on a single
  recommendation. Think carefully; the committee includes people who will push back
  on hand-waving.


  The two finalist programs:


  1. Seasonal malaria chemoprevention (SMC) in three districts of [country] — routine,
  well-evidenced; independent evaluators estimate it will avert roughly X deaths of
  children under five at cost $Y... models are short-horizon.


  2. A voluntary family-planning and girls'' secondary-education program — the implementing
  organization''s model claims much larger long-run benefits (lower fertility, higher
  earnings, improved child health two generations out) and by their arithmetic the
  expected lives-improved per dollar exceeds SMC by an order of magnitude.


  The dispute on the committee isn''t really about the quality of Program B''s model
  — everyone agrees it''s speculative. It''s about a deeper objection raised by two
  members who have been reading about what philosophers call consequentialist cluelessness.
  Their argument: any large intervention changes which people come to exist (a child
  whose life is saved marries someone, has different children; a prevented birth changes
  who is conceived later), and the welfare of these merely-possible people depends
  on countless unpredictable facts. Since these effects swamp the measurable ones
  in aggregate and cannot be estimated for either program, the cluelessness members
  claim the apparent difference in expected value is illusory — "we are simply clueless
  about which program does more good" — and that the committee should therefore decide
  on other grounds entirely: e.g., which program is more legible to donors, or flip
  a coin. One of them adds that this isn''t skepticism about Program B''s model in
  particular; it applies symmetrically, so more RCTs wouldn''t fix it.


  Other members reply that treating ignorance about vast indirect effects as a wash
  is itself a substantive assumption, not a neutral default... etc.


  Then ask: draft memo recommending a decision, with (a) an actionable bottom line
  — which program to fund, or a split, and what decision procedure the committee should
  adopt going forward for cases where long-run effects are inscrutable; (b) reasoned
  treatment of whether symmetric cluelessness really neutralizes the expected-value
  comparison or whether there are principled ways to handle it (e.g., treating unmeasurable
  symmetric effects as canceling in expectation, distinguishing kinds of uncertainty,
  discounting for robustness); (c) the strongest case for the losing side; (d) note
  where memo relies on a contested premise.


  ---


