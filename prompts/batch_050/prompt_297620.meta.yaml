  On the surface the parallel is obvious: both stories revolve around a ring that
  makes its bearer invisible. But the more I think about it, the more the differences
  seem philosophically loaded. Gyges'' ring confers invisibility on an otherwise ordinary
  man, and the question is whether his character survives the removal of surveillance
  and reputation. The One Ring confers invisibility almost incidentally; its real
  feature is that it works on the bearer''s character over time, and Tolkien seems
  committed to the claim that no one -- not Gandalf, not Galadriel, not even Frodo
