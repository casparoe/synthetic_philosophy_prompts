  Also require: honesty about Kuhn''s own anti-algorithmic stance — section on "what
  this procedure cannot do" per type notes. Incommensurability handling: procedure
  should include steps for checking whether apparent nonsense is translation failure
  vs. actual incoherence (e.g., asking proposer to identify exemplars, shared problems,
  what the new framework explains that the old can''t).


  Seeding: professor has taught Kuhn in philosophy of science seminar; anecdote about
  a past bad experience funding a crank or rejecting something later vindicated.


  Format prescription: sections by name and order with rough lengths: e.g., "Procedure"
  (~500-700 words), "Worked applications" (~400), "Where judgment cannot be eliminated"
