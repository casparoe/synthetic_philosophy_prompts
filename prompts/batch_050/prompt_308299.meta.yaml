  - Von Neumann surviving technology + adversarial collaboration between a techno-optimist
  and a precautionary camp? But Von Neumann''s "Can We Survive Technology?" (1955
  Fortune essay) — specific attribution, should verify. Could search. But maybe not
  needed if prompt doesn''t lean on quotes.


  The Kuhnian procedure prompt seems strongest and doesn''t require quotes. Kuhn''s
  concepts: normal science, paradigm, anomaly, crisis, scientific revolution, incommensurability
  (methodological, semantic, observational), exemplars, paradigm choice as partly
  value-laden, no neutral algorithm for paradigm choice (Kuhn''s famous claim). The
  interesting tension: Kuhn himself argued there is no neutral algorithm for theory/paradigm
  choice — so asking for a procedure must grapple with that: the procedure should
  mark where judgment can''t be eliminated, which fits the type''s notes beautifully
  ("where the procedure stops and hands the decision to a person").


  Practical role: philosophy professor who chairs a college-wide curriculum committee?
  Or sits on an interdisciplinary research-funding panel, must decide how much to
  trust proposals that reject the dominant paradigm (e.g., cold fusion style claims,
  or critiques of mainstream economics, or someone proposing a new framework in psychology).
  Decisions recur: each funding cycle, several "paradigm-challenging" proposals. Stakes:
  money, careers. Constraints: limited time per proposal, non-specialist panel, sign-off
  by the dean.


  The deliverable: a reusable review procedure for "framework-challenging proposals":
  questions in order, what counts as sufficient answers, where to stop with rejection,
  where to escalate to expert judgment; applied to two-three worked cases: e.g., (1)
  a proposal from a group claiming mainstream cognitive psychology''s information-processing
  paradigm is broken and proposing a radical-enactivist alternative; (2) a lone researcher
  claiming to overturn... maybe something where the procedure says "reject" though
  asker wants to fund, or says "fund" a heterodox one the dean dislikes — "an answer
  the asker will not like."


  Worked cases to be hypothetical, avoiding niche facts. E.g., case A: heterodox economics
  group; case B: lone outsider with claimed perpetual-motion-adjacent? Too easy. Better:
  case B: a proposal that looks heterodox but is actually normal science within an
  emerging paradigm — procedure should distinguish "revolutionary" from "within-paradigm
  novelty." Case where procedure gives unwelcome answer: e.g., an eloquent, philosophically
  sophisticated critique of a field''s foundations scores badly on Kuhnian markers
  of crisis (no anomaly accumulation, no candidate alternative exemplar), so procedure
