  Good combos:

  - Kuhnian paradigm shifts + turn theory into procedure: A philosophy professor who
  sits on a grant-review panel / curriculum committee / journal editorial board wants
  a procedure for deciding whether a field is undergoing a paradigm shift vs. normal
  cumulative progress, or for how referees should treat papers written in an incommensurable
