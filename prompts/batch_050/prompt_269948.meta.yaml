  prove the blanket rule "if my system proves P, then P is true" — because if it could
  prove that conditional for a given P it would already prove P, so adding full self-trust
  buys you either nothing or inconsistency. So a formal agent can''t just write "trust
  everything my successor proves" into its successor. But my gut doesn''t line up
