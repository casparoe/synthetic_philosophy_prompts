  which verdicts must be dropped.


  Design cases:


  1. Classic: a research team member wants to share a finding publicly; others think
  it risky; she publishes anyway because each person judges independently — the curse:
  initiative belongs to whoever is most optimistic. Verdict: she should have waited
  for consensus.


  2. A doctor in a group of five consultants, each could unilaterally give a patient
  an experimental drug; one believes it will help and administers it. Verdict: wrong
  even if it works.


  3. Whistleblowing case — one employee leaks; verdict: fine/right — this creates
  tension with 1&2 (both unilateral exposure). The difference: consent? Institutional
  role? Irreversibility?


  4. A parent names a child without consulting the other parent — wrong.


  5. Someone in a shared house adopts a dog — wrong unless housemates agree.


  6. A scientist declines to run a dangerous experiment even though she could — fine.


  7. Someone breaks a tie / casts the deciding move in a volunteer group.


  The hard-to-reconcile pair: whistleblowing (unilateral disclosure judged right)
  vs. researcher publishing risky findings (unilateral disclosure judged wrong). Both
  are unilateral irreversible disclosures against colleagues'' wishes. A principle
  must distinguish: duty vs. permission, whether the actor bears the cost, whether
  the information concerns wrongdoing vs. merely risky research, role obligations.


  Ask: state a principle, test it, say which verdicts it forces me to drop, predict
  new cases (e.g., jury foreperson announcing verdict early? a moderator publishing
