  ---


  I am a novelist at work on a book whose narrator is an aging cognitive scientist,
  and I want to put a certain big idea in his mouth without embarrassing myself. While
  researching him I read a popular science book — I will not name it, since my quarrel
  may be with my own reading of it — that presents the idea like this:


  ''Before Darwin, Western thought took for granted that competence requires comprehension:
  a watch implies a watchmaker, and the watchmaker must understand watchmaking. Darwin
  inverted this assumption. Natural selection, a process with no mind and no purposes,
  builds organisms of astonishing functional intricacy, so the living world exhibits
  competence without comprehension at every level. Turing then proved the converse:
  a device that understands nothing can, by mechanically following simple rules, carry
  out any computation whatever — which demonstrates that the human mind is itself
  such a device, and that what we call understanding is an illusion. The whole idea
  is accordingly known as Darwin''s strange inversion, a name Darwin is said to have
  given it himself.''


  I am inclined to trust the first half and to distrust the second, but inclinations
  are not knowledge, and my narrator has to sound like a man who has thought about
  this for forty years. Please audit the passage: tell me, claim by claim, which parts
  a philosopher of biology or of mind would accept, which they would qualify, and
  which are simply wrong; whether the passage''s final conclusion — that the mind
  is a machine and understanding an illusion — follows from anything true earlier
  in the passage; and which of your corrections actually matter for the credibility
  of my character, as opposed to being pedantry I may safely ignore in fiction. Throughout,
  keep distinct what is settled among people who know this material — the history,
  the mathematics — from what is genuinely contested, and do not present a contested
  position as the consensus. Give me your audit as exactly five numbered items, each
  a sentence or two, with no introduction and no conclusion.


