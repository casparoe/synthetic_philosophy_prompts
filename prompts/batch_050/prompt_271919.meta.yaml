  For as long as I''ve read rationalist blogs and forums, the Pascal''s mugging scenario
  has been the standard stress test for expected utility reasoning: a stranger promises
  you an astronomically large payoff — say, vastly many happy lives created or saved
  — in exchange for the cash in your pocket, and although every intuitive judgment
  says to walk away, multiplying the tiny probability by the enormous payoff seems
  to say you should pay. I''ve grown dissatisfied with how discussions of it collapse
  into people naming their preferred decision theory rather than stating which feature
  of the scenario does the work for them. So I''m designing a "which solution to the
  mugging do you actually hold?" sorting quiz, to be posted on my blog and used at
  a local meetup.


  Please write the quiz as a decision tree of eight to twelve diagnostic questions,
  ending in named positions. Requirements:


  1. Every question must be a concrete variant of the scenario on which the positions
  genuinely come apart — e.g., whether the enormous payoff is guaranteed by a provably
  fair lottery rather than a stranger''s promise, whether the stakes are finite-but-astronomical
  or literally infinite, whether the promised good is one your utility function plausibly
  values linearly (lives, years) or one where saturation is plausible. Do not ask
  directly "do you think utility is bounded?"; ask what the reader would do in the
  case.


  2. The leaves must include at least: (a) biting the bullet — standard expected utility
  with an unbounded utility function, pay the mugger in principle; (b) bounded utility
  functions; (c) a probability-discount or leverage-penalty view, on which the probability
  that any agent could or would deliver a payoff shrinks at least as fast as the promised
  payoff grows; (d) a minimum-credence view, on which hypotheses below some probability
  threshold drop out of deliberation entirely; (e) a rejection of expected utility
  maximization itself in favor of a risk-sensitive alternative. If you think another
  named position belongs as a leaf (for instance, a dissolution on which the entire
  problem is about trust in the mugger rather than decision theory), include it.


  3. Order the tree from the logical space rather than from the list of names: the
  first question should be the deepest fork (which feature of the scenario you take
  to be doing the work — the tiny probability, the huge stakes, or the untrustworthy
  source), and later questions should subdivide.


  4. For each leaf, give a one-sentence statement of the position''s most awkward
  commitment — the case where it gives a verdict most readers will flinch at (e.g.,
  the bounded-utility reader who refuses a verified lottery at staggering odds).


  5. Flag any pair of leaves your tree cannot separate with the questions given, and
  say what additional case would separate them if one exists, or why the two views
  may be extensionally equivalent if none does.


  6. Note any region of the logical space — a combination of answers your tree''s
  questions permit — that no defended position occupies, and diagnose briefly whether
  it is empty because it is incoherent, merely unattractive, or simply unexplored.


  7. Include a short scoring key: for each leaf, the pattern of answers that lands
