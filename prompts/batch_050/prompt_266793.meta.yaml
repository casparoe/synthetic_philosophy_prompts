  \ that virtual harm is impossible because nothing exists in virtual worlds.\n2.\
  \ Counterfactual vs interventionist theories of causation — could build an argument\
  \ about preemption cases.\n3. Bayesian epistemology and old evidence — could build\
  \ an argument: confirmation requires raising probability; old evidence already has\
  \ probability 1, so it can't confirm; but old evidence obviously confirms (e.g.,\
  \ Mercury's perihelion); so Bayesianism is false or evidence isn't really evidence...\
  \ This is a classic prove-too-much structure.\n4. Brain size morally relevant —\
  \ an argument that seems to show whales matter more than humans, or that moral status\
  \ is continuous.\n\nI should inject a new/niche idea so it's not pure regurgitation.\
  \ The instructions say the prompt should be in-the-weeds but not require super niche\
  \ memorized facts; injecting a novel setup within the prompt itself is good.\n\n\
  Type \"argument that proves too much\" with old evidence: The classic argument:\
  \ (1) E confirms H only if learning E raises H's probability. (2) Old evidence E\
  \ is already known, so P(E)=1. (3) If P(E)=1, then P(H|E)=P(H), so learning E can't\
  \ raise H. (4) But old evidence does confirm theories (e.g., Mercury's perihelion\
  \ precession confirming GR). (5) So either old evidence never confirms (absurd)\
  \ or Bayesianism is false. This is fairly standard (Glymour's problem). To make\
  \ it less regurgitable, I can inject a novel twist: e.g., a fictionalized scenario\
  \ — a historian or a lab where an old dataset is \"re-analyzed,\" or a variant where\
  \ the evidence is not certain but the agent has forgotten learning it, or the \"\
  problem of new theories\" aspect (Garber: learning logical/mathematical truths).\
  \ Or combine with a twist: the agent learns that their measurement instrument was\
  \ faulty, lowering P(E), and then... Actually a good niche injection: extend the\
  \ argument to show it proves too much — that it also rules out mathematical discovery\
  \ confirming anything (since if P(logical truths)=1, learning a theorem can't confirm\
  \ an empirical theory either), making the conclusion even more absurd, and ask which\
  \ premise to reject and what it costs. The standard replies: counterfactual degree\
  \ of belief (Glymour), Garber's logical omniscience denial, Jeffrey's new explanation,\
  \ Maher, Christensen. A model should be able to handle this from memory — these\
  \ are well-known.\n\nAlternatively, virtual worlds: Chalmers' \"Reality+\" argues\
  \ virtual objects are real. An argument proving too much: (1) Virtual objects are\
  \ just patterns of pixels/electrons; (2) patterns of electrons are real (real tables\
  \ are patterns of atoms); so (3) virtual objects are real; (4) by same reasoning,\
  \ the \"virtual dragon\" my character slays is real, and griefing is genuine harm...\
  \ hmm.\n\nLet me think about the brain size one — \"Is brain size morally relevant?\"\
  \ An argument: (1) Moral status of a being depends only on its psychological capacities.\
  \ (2) Psychological capacities are implemented in brains. (3) Bigger brains can\
  \ implement more/richer capacities... This could prove too much (whales > humans\
  \ morally). Could be interesting but less crisp as a numbered argument.\n\nThe old-evidence\
  \ one is crisp and well-known, which risks regurgitation, but the instructions say\
  \ inject new/niche ideas. Let me craft a variant argument with a twist that forces\
  \ diagnosis rather than recitation. \n\nIdea: an argument that extends the old evidence\
  \ problem into a proof that \"no evidence can ever confirm a theory\" — a skeptical\
  \ overgeneralization. Something like:\n\n(1) E confirms H only if P(H|E) > P(H).\n\
  (2) Once E is known, P(E)=1, so P(H|E)=P(H): old evidence can't confirm.\n(3) Any\
  \ evidence becomes old the moment after it's learned, and theory assessment happens\
  \ after learning.\n(4) So at the moment we assess, no evidence confirms anything.\n\
  (5) So confirmation never happens / confirmation is time-relative in a way that\
  \ makes rational theory choice impossible.\n\nWhere does it go wrong? The subtle\
  \ flaw: equivocation on which probability function — the conditional probability\
  \ P(H|E) is fixed by the prior joint distribution and doesn't change when E is learned;\
  \ learning E changes your credence in H from P(H) to P(H|E), and that gap is the\
  \ confirmation. The \"old evidence can't confirm\" move conflates P_now(H|E) using\
  \ updated credences with the confirmational relation. Standard solutions: use the\
  \ probability function the agent would have had counterfactually (Glymour), or treat\
  \ learning logical facts (that H entails E) as the actual evidence (Garber/Jeffrey),\
  \ etc.\n\nBut to make it in-the-weeds, I could inject a specific novel scenario:\
  \ a climatology example where 19th-century temperature records are digitized in\
  \ 2025; or the discovery that H entails E being itself the news. Let me build the\
  \ argument around a concrete case: astronomer re-analyzing old plates.\n\nActually,\
  \ the type examples show the asker presenting a numbered argument and asking which\
  \ premise to reject and what it costs, plus saying what they'd like to keep. I should\
  \ write from perspective of a university student taking a related course (philosophy\
  \ of science / formal epistemology seminar), formal/polished, relatively short.\n\
  \nLet me draft:\n\nArgument (built by me / study group):\n(1) Evidence E confirms\
  \ hypothesis H only if learning E raises the rational credence in H.\n(2) Once E\
  \ is known with certainty, P(E)=1, and conditioning on a proposition with probability\
  \ 1 cannot change any credence: P(H|E)=P(H).\n(3) All the evidence we actually have\
  \ is old in this sense — known, hence certain.\n(4) So no evidence we have confirms\
  \ any hypothesis.\n(5) Suppose we respond by \"rewinding\": ask what credence we\
  \ would assign H if we hadn't yet learned E. But for evidence we've always had (e.g.,\
  \ the value of constants, data we acquired before the hypothesis was even formulated),\
  \ there is no such earlier credence function — the rewind is undefined.\n(6) So\
  \ confirmation of theories by antecedently known data is impossible, and theory\
  \ choice driven by such data (e.g., fitting a theory to existing results) is irrational.\n\
  (7) Since much of actual science works exactly this way, either science is irrational\
