  \ scenario.\n\nLength: keep prompt a paragraph plus the numbered argument. No quotes\
  \ needed — no real-text quotations, so no web fetch needed. Verify nothing needed.\
  \ \n\nWrite from student perspective, formal. Let me compose.\n\nDraft:\n\nI'm in\
