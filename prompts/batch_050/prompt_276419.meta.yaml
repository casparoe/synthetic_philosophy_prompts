  Let me draft the summary in the prompt:


  A colleague''s book review draft summarizes the field as follows: "Evolutionary
  psychology holds that the human mind is a bundle of specialized instincts, each
  an adaptation engineered by natural selection to solve a problem our hunter-gatherer
  ancestors faced in the Pleistocene. Its method is to observe a modern behavior —
  men''s jealousy, women''s preference for high-status mates, children''s fear of
  strangers — and infer the ancestral problem it must have solved. Because we cannot
  observe the Pleistocene, these inferences cannot be tested, which is why critics
  call them just-so stories. The field also holds that since human nature was fixed
  by our genes long before agriculture, modern environments are ones we are fundamentally
  mismatched to, and attempts to change entrenched behavior are bound to fail."


  Subtle misrepresentations:

  1. Conflates "the mind contains adaptations" with "every trait is an adaptation"
  — EP distinguishes adaptations from by-products and noise (and indeed uses design
  evidence to distinguish). Also Gould''s just-so story charge targets adaptationist
  reasoning, not the testability issue exactly — well the summary says inferences
  "cannot be tested" — overstatement: EP generates risky predictions (e.g., cheater
  detection, sex differences in jealousy across cultures, pregnancy sickness). The
  method isn''t "infer from observed behavior" only; good EP predicts behavior from
  hypothesized function.

  2. Genetic determinism: "fixed by our genes... attempts to change behavior bound
  to fail" — EP is interactionist; adaptations are conditional strategies sensitive
  to environment; changing inputs changes outputs. Also conflating genetic basis with
  immutability.

  3. Mismatch: mismatch is a real hypothesis but "fundamentally mismatched" overstates.


  Also possibly conflating the just-so story charge: Gould and Lewontin''s critique
  was about adaptationism generally, and a good summary should note the charge applies
  to bad adaptationist reasoning, not the whole program; and "just-so story" is Kipling
  reference — don''t need.


