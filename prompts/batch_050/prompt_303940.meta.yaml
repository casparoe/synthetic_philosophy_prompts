  Let me think about the Ellsberg paradox. Standard Ellsberg: two urns, one with 50
  red/50 black (known), one with 100 balls unknown proportion. People prefer betting
  on red from the known urn over red from the unknown urn, and black from known over
  black from unknown — inconsistent with any subjective probability assignment, suggesting
  ambiguity aversion.


  An interesting in-the-weeds construction: design a thought experiment where ambiguity
  aversion and... something else come apart. E.g., a case where the standard "ambiguity
  aversion" explanation of choices actually can''t be right, and the pattern must
  come from something else (e.g., comparative ignorance, competence hypothesis). Or:
  construct a scenario where an ambiguity-averse agent and a risk-averse-but-ambiguity-neutral
  agent make the same choices, so behavior can''t distinguish them — and then modify
  one feature to separate them.


  Classic real results: Heath & Tversky''s competence hypothesis (people prefer betting
  on their own judgment in domains of competence over matched chance events, and prefer
  chance over judgment in domains of incompetence). Also Fox & Tversky comparative
  ignorance. These are well-known enough for an LLM.


  Good specification: Build a decision scenario where the Ellsberg pattern (preference
  for known-risk over ambiguous option in both colors) appears, but cannot be explained
  by ambiguity aversion — i.e., where a fully Bayesian agent with a single prior over
  the unknown composition would still choose the same way, or where the pattern arises
  from competence/confidence effects rather than ambiguity per se. Constraints: no
  urns, realistic setting (journalist context: a newsroom setting could be cute —
  betting on which of two sources is right, or forecasting election outcomes in a
  country you know vs. don''t know).


  Actually the competence hypothesis setting: people prefer to bet on a football game
  they know about vs. a matched chance event; prefer chance over an unfamiliar topic.
  That violates ambiguity aversion in one direction (ambiguity seeking under competence).


  Let me design the prompt: ask the model to construct a scenario (no urns, realistic,
  money stakes a normal person could face) in which a decision-maker shows the classic
  Ellsberg two-choice pattern but the pattern cannot be attributed to ambiguity aversion,
  because [structural feature]. Then show why, and identify what feature does the
  work, and how an ambiguity-aversion defender would respond.


  Hmm, but "cannot be attributed" is tricky — many patterns can be redescribed. Better:
  construct two parallel scenarios identical in probability/ambiguity structure but
