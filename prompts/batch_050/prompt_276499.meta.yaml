  (3) So the action gets taken iff some agent overestimates its value enough; in expectation,
  when many agents could act, actions taken are ones whose true value is likely below
  what the actor thinks. (4) Rational agents should adjust: knowing you acted only
  because you were the most optimistic, you should discount your own estimate toward
  the group mean — maybe below the action threshold. (5) But this reasoning applies
  to any action where others'' inaction is evidence: e.g., if a great opportunity
  existed, someone else would have taken it ("no $500 bills on the sidewalk"). (6)
