  Two friends of mine have been arguing for weeks about the scope of the Euthyphro
  dilemma, and I''d like a verdict on their exchange, point by point.


  The first, Mara, holds that the dilemma is a narrowly anti-theistic argument: it
  refutes divine command theory by asking whether God commands actions because they
  are right or whether actions are right because God commands them. If the former,
  morality is independent of God and divine command theory is false; if the latter,
  morality is arbitrary, since God could have made cruelty obligatory. Either way,
  she concludes, the theory collapses — but the argument''s work ends there. It tells
  us nothing about secular ethics.


  The second, Jon, replies that the dilemma is not an argument against theism at all
  but a general template that applies to any attempt to ground moral facts in something''s
  attitudes or responses. Take the secular view that an action is right iff it would
  be approved by an ideal observer — fully informed, impartial, free of bias. The
  same two horns appear: does the ideal observer approve of actions because they are
  right, or are they right because she approves of them? If the former, the observer''s
  approval is idle in the metaphysics and merely tracks independent moral facts; if
  the latter, rightness again looks arbitrary, hostage to whatever psychology we build
  into the "ideal" conditions.


  Mara concedes the parallel but insists on a crucial asymmetry. The arbitrariness
  horn is fatal to divine command theory specifically because of what God is supposed
  to be: a being whose will is sovereign over everything, including value itself.
  A secular theory, by contrast, never claims its ground is sovereign in that sense,
  so it can simply take the first horn with good grace: yes, ideal observers approve
  of actions because they are right, and their approval functions as an epistemic
  instrument — a perfect detector of moral facts — which is all a modest naturalist
  ever wanted.


  Jon answers that this retreat costs the secular theory its point. An approval condition
  that merely tracks independent moral facts is moral epistemology, not moral metaphysics;
  the theory was supposed to say what rightness consists in, and "consists in being
  detected by detectors that detect rightness" is no answer. He adds that the theist
  has an exactly parallel escape: identify the good not with God''s commands but with
  God''s necessarily loving nature, so that commands flow from a nature that could
  not have been otherwise and arbitrariness never arises. If that move saves divine
  command theory, some analogous move — treating the ideal-observer conditions as
  constitutive of value rather than as detectors of it — should be equally available
  to the secularist, and Mara cannot have it both ways.


  Mara''s final move is to reject the dilemma''s presupposition that the grounding
  relation must be either determination or detection. Between the two lies constitution:
  perhaps value just is, or is constituted by, the responses of certain agents under
  certain conditions, the way (she suggests) the value of money is constituted by
  collective acceptance without being either arbitrary or independent of it. Jon counters
