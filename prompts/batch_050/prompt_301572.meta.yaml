  implausible is a misstep — that''s arguably a real tension: you can''t both say
  the report settles it and argue against cassette theory on grounds that it misdescribes
  what happened during the night. Hmm, that''s a nice non-obvious one.


  Let me construct ~5-6 commitments:


  (a) Malcolm is basically right that a sincere waking report is the criterion for
  having dreamed; there''s no further question about what "really" happened during
  the night beyond the report (plus maybe physiology).

  (b) Dennett''s cassette theory is empirically false — the long, coherent narrative
  dreams really do take time and aren''t fabricated at waking; lucid dreamers'' pre-agreed
  eye signals prove it.

  (c) There is something it''s like to be dreaming while you''re asleep — dreams have
  phenomenal character at the time.

  (d) You can have experiences during dreamless sleep — e.g., a parent hears the baby
  cry and wakes; the sound was registered and heard before waking.

  (e) Most dreams are forgotten, and forgotten dreams are still dreams that were experienced
  at the time.

  (f) Introspection is generally reliable about one''s current conscious states.


  Tensions:

  - (a) vs (b): If the report is the criterion, eye-signal data can''t "prove" the
