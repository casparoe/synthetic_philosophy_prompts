  The idea: Malcolm argues dreams aren''t experiences had during sleep — dream reports
  are just the criterion for dreaming, and "dreams are experiences during sleep" is
  unintelligible/unverifiable. Dennett proposes cassette theory: dream narratives
  are composed at waking. The asker should have a set of commitments with genuine
  non-obvious tensions and at least one apparent tension that dissolves.


  Design a belief set that a reasonable person might hold, with genuine tensions:


  1. Whether someone dreamed, and what they dreamed, is settled by their sincere waking
  report — there''s no further fact about the night''s inner goings-on beyond what
  the report (plus maybe physiology) fixes. (Malcolm-ish)

  2. Dreamless-sleep experiences are possible: e.g., hearing your name during sleep
  can wake you — you must have registered the sound before waking. (This is an experience
  during sleep.)

  3. If you wake someone from REM sleep, the report depends on when you wake them
  and matches eye movements etc. — the physiological data can confirm or disconfirm
  dream content (e.g., lucid dreamers signaling). So reports aren''t the sole criterion.

  4. Incubation case: Dostoevsky-style long dream in a flash — Deidre Barrett / the
  Maury guillotine dream. The person believes the cassette theory is implausible because
  it makes the dream a fiction authored at waking, and yet they think something did
  happen during sleep.

  5. Believes there IS something it''s like to dream — dreams feel a certain way while
  you''re in them.


  Tension 1: If reports are the sole criterion (1), then (2) — experiences during
  dreamless sleep — plus (5) create tension. Actually let me engineer it carefully.


  Genuine tension (non-obvious): Commitment (1) "the waking report is the criterion
  — no fact of the matter beyond it" conflicts with commitment (5) "dreams have phenomenal
  character while they occur" and (3) "sleep-lab awakenings + lucid dreamer eye signals
  can confirm/disconfirm reports" — because if physiology can confirm/disconfirm the
  report, then the report isn''t the final criterion, and there is a further fact.


  Another genuine tension: (2) "we can have experiences during sleep (hearing your
  name, which wakes you)" combined with Malcolm-style claim that "an experience during
  sleep" is unintelligible — if they hold both that Malcolm is right about dreams
  and that hearing-your-name registration is a genuine experience, they need to explain
  why one experience-during-sleep is fine and the other isn''t.


  Apparent tension that dissolves: belief that lucid dreamers can signal with eye
  movements (committed to real-time experience) vs. belief that we can''t be certain
  the dream happened when it seemed to — no, better: they believe both (a) dreams
  are usually forgotten, and (b) the report fixes the facts. Someone might think forgetting
  threatens the report-criterion, but it doesn''t — forgetting just limits our evidence;
  the criterion claim is about what settles the fact, not about epistemic access.
  That dissolves on inspection.


  Or apparent tension: believing cassettes are implausible while believing reports
  are the criterion — actually if reports are the criterion, the cassette question
