  Objections list (keep to 4-5, accurate):

  1. The initial acquisition objection: Wilt Chamberlain argument starts mid-stream;
  even perfect justice in transfer can''t transmit justice from unjust acquisition
  (Lockean proviso etc.).

  2. Cohen''s objection that Nozick equates liberty with private property rights —
  taxing Wilt restricts his freedom to dispose of money but can expand others'' effective
  freedom; "liberty upsets patterns" only sounds bad if you assume capitalist acts''
  freedom is the freedom that matters.

  3. The objection that Nozick conflates prohibiting transfers with taxing them —
  redistribution doesn''t prevent anyone from giving Wilt their quarter; it just adjusts
  afterward, so "liberty upsets patterns" doesn''t follow in the prohibition sense.

  4. The aggregation/background-conditions objection: each transfer is individually
  fine, but the cumulative outcome can erode the conditions (equality of opportunity,
  fair value of political liberties) that made the exchanges fair in the first place.

  5. Maybe: the objection that the argument illegitimately generalizes from one admirably-chosen
  case (beloved basketball player, small voluntary payments) to all holdings including
  inherited wealth, windfalls, etc. That''s the "loaded example" objection.


