  Draft:


  "Having spent my career in experimental physics, I''ve recently been reading epistemology,
  and I''ve arrived at a position on the Meno problem that I''d like stress-tested.
  The position: knowledge is better than mere true belief only because it is more
  stable. A belief arrived at by luck may happen to be true, but it is untethered
  — the next change in circumstance will shake it loose, as the Meno''s statues analogy
  suggests — whereas a justified true belief is fastened to the facts and will survive
  new evidence. On this view the entire value gap between knowledge and true belief
  is exhausted by reliability over time; there is no additional intrinsic or epistemic
  value in knowledge as such.


  What would count against this? Concretely: I can imagine a true belief that is in
  fact perfectly stable despite being unjustified — say, an unshakable conviction
  acquired by a lucky accident — and if stability is the whole story, such a belief
  should be just as valuable as knowledge. Is that a defeater or a bullet to bite?
  I''d like the defeaters ranked from fatal to merely awkward, including cases from
  elsewhere (the value of achievement and credit, why we prefer non-lucky true belief
  even when we never revisit the question, testimony), an honest account of which
  objections a committed stability theorist would concede versus dismiss, and whether
  the position risks being insulated — any counterexample being reclassified as not
  really stable — and if so, whether that''s a defect."


