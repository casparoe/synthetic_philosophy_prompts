  differently; each gives up what they value less and receives what they value more.
  The same structure appears in moral life whenever parties'' disagreements are about
  priorities rather than flat contradiction. If you think issue A matters enormously
  and issue B is secondary, while I have the reverse ordering, then a deal — you get
  your way on A, I get mine on B — is not a grudging midpoint. It is a Pareto improvement
  over both of us splitting the difference everywhere. Moral compromise, properly
  arranged, manufactures value out of disagreement itself.


