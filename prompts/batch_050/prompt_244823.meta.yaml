  stem from the relationship history (Kolodny), love is unconditional/no reasons...
  Diagnostic questions: the trading-up problem, the problem of fungibility, etc. That''s
  genuinely in the weeds but standard for those who know the debate. The prompt can
  inject the needed framing itself (describe the problems) so models don''t need to
