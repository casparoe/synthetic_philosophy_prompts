  (3) So if a supererogatory act exists, you ought to do it.

  (4) If you ought to do it, omitting it is wrong.

  (5) But by (1) omitting it isn''t wrong. Contradiction.

  (6) So no supererogatory acts: everything morally good is either required or forbidden.


