  Cognitive penetration is a well-known debate (Pylyshyn, Firestone & Scholl, Raftopoulos,
  Stokes, Siegel). A desiderata prompt is nice: what must an adequate account of cognitive
  penetration deliver — distinguish penetration from attention/perceptual learning/pre-cueing;
  handle cases (the "light switch" case?); respect empirical constraints from neuroscience;
  which desiderata are camp-specific prejudices; joint unsatisfiability. Inject novelty:
  a stipulated novel case to serve as a litmus test — e.g., "case: a radiologist...
  training permanently alters V1 tuning... vs a case where belief that object is red
  makes it look redder" — standard. Inject new: ask that the desiderata themselves
  be ranked and that any pair jointly unsatisfiable flagged; also ask which single
  desideratum excludes most contenders. Also could inject a novel criterion: "must
  deliver a verdict not only on paradigm cases but on the following constructed case"
  — invent a case, e.g., a subject who knows a display''s statistics and this knowledge
  changes which saccades she makes, changing retinal input — is that penetration?
  That''s actually attentional. A good novel case: top-down effects that are diachronically
  mediated through one''s own past perceptual learning — "the expert''s flash of insight."


