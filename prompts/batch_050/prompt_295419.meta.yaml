  Key content: Williamson''s anti-luminosity argument (Knowledge and Its Limits, 2000)
  argues against luminous conditions — conditions such that whenever they obtain,
  one is in a position to know they obtain. KK principle: if one knows p, one is in
  a position to know that one knows p. The argument uses a sorites-style series (e.g.,
  feeling cold at dawn gradually warming; margin for error principles: if one knows
  p, p remains true in similar cases).


  A plausible summary with subtle errors: a lecture summary says Williamson proved
  that the KK principle is false, that no condition is luminous, and that this shows
  we can never know that we know anything, hence externalism about knowledge. Subtle
  misrepresentations: (1) the anti-luminosity argument targets luminous conditions
  in general, not directly KK — KK is entailed by luminosity of knowledge but the
  argument doesn''t assume or directly refute KK; (2) Williamson''s conclusion is
  that only trivial conditions (those that always or never obtain) are luminous, not
  that "nothing is luminous" in a spooky sense; (3) the argument relies on a margin-for-error
  premise, which is a safety condition, and critics contest it — the summary presenting
  it as uncontroversial proof is an overstatement; (4) conflating "being in a position
  to know" with "knowing" — KK in Williamson''s form is about being in a position
  to know, and luminosity too. A summary might say "if you know, you know that you
  know" which misstates the principle.


  Also the argument doesn''t show we can''t know that we know; it shows knowing doesn''t
  guarantee being in a position to know that one knows.


