  Good''s theorem (I.J. Good''s theorem on the value of information) is a nice domain
  for a "subtle confusion / false presupposition" prompt. Good''s theorem: the value
  of cost-free information is always non-negative (in expectation) under expected
  utility maximization with a coherent prior — never negative. A common confusion:
  thinking the theorem says more information always makes you better off, or that
  it proves information is valuable in every individual case, or that it covers non-Bayesian
  agents, or that it implies you should always seek information. Classic counterexamples:
  information can be harmful in games (strategic settings), to agents with imperfect
  recall, when information is costly to process, with non-expected-utility, or due
  to non-convex value of information in multi-agent settings. Also "curse of information"
  — knowing your own future actions, or in principal-agent. A common misunderstanding:
  people cite the theorem as proving free information can never hurt you, but the
  theorem''s value is ex ante expected value, not that actual outcomes are always
  better — you can be worse off ex post after receiving information. Also it assumes
  you act on the info optimally, Bayesian updating, etc.


  The example prompts style: "Since Arrow''s impossibility theorem shows that democracy
  is mathematically impossible, why do political scientists still take elections seriously?"
  — a question resting on false presupposition.


