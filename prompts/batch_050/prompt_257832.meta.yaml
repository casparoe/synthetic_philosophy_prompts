  Two colleagues in a decision theory reading group — call them the growth optimiser
  and the risk-weighting theorist — have been disagreeing for two years about the
  foundations of rational choice under uncertainty, and have finally agreed to write
  up what they actually disagree about. Draft the joint statement their adversarial
