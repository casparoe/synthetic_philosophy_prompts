  Background the statement may take as common ground (you do not need to argue for
  these in the document, but the document must not contradict them): [inject scenario]


  The growth optimiser holds: for a sequence of multiplicative gambles, maximising
  the expected logarithm of wealth (the Kelly criterion) is uniquely rational, because
  it almost surely outgrows any materially different strategy as the number of rounds
  increases; this justification is independent of any assumptions about utility or
  attitudes to risk; so-called risk aversion is really just sensitivity to the time-average
  growth rate of one''s wealth.


  The risk-weighting theorist holds: rational choice consists in maximising risk-weighted
  expected utility (a rank-dependent generalisation of expected utility in which outcomes
  are weighted by a risk function as well as by utility); Kelly behaviour is the special
  case of logarithmic utility, so its appeal derives from a particular utility function
  rather than from any argument that bypasses utility; the long-run dominance argument
  has normative force only if one already cares about almost-sure asymptotic outcomes,
  and that caring is itself an attitude to risk.


  Deliverable structure:


  1. Agreed claims: a numbered list of claims both parties can sign...

  2. Disagreements: stated in wording each would accept for their own side...

  3. Cruxes: for each crux, a concrete case or calculation both agree bears on it,
  with each side''s prediction recorded in advance — e.g., ...


