  Interesting cruxes: whether the justification of Kelly is independent of utility
  assumptions (Kelly betting is justified asymptotically but any finite-time agent
  with concave utility may disagree); the time-average/ensemble-average debate (Ole
  Peters'' ergodicity economics); whether risk-weighted expected utility can be represented
  as expected utility under a different utility function; path dependence; the "Kelly
  betting is risk-averse but not infinitely so" point; the point that a Kelly bettor
  will take bets no logarithmic-utility... actually Kelly IS log utility. Key crux:
  the Kelly advocate claims growth-optimality gives an agent-independent rationality;
  the REU advocate says rationality is determined by attitudes toward risk which are
  not rationally mandated. Also the point that REU with log utility coincides with
  Kelly; the disagreement about whether the long run argument justifies anything for
  one-shot decisions.


  Agreed claims both can sign: Kelly maximises almost-sure long-run growth; Kelly
  coincides with maximising expected log utility; any concave utility implies declining
  the St. Petersburg-type... Both agree expected-value maximisation is ruinous in
  repeated gambles. Both agree that for one-shot decisions growth arguments don''t
  directly apply. Both agree that probability estimates matter more than the criterion.


  Disagreements: whether asymptotic almost-sure dominance is a genuine normative argument
  (the opponent notes any finite horizon, the choice is not forced); whether risk
  attitudes are rationally evaluable or just preferences; whether the ergodicity framing
  adds anything beyond concave utility.


  Tests: simulation predictions — both agree a Kelly bettor almost surely beats any
  materially different strategy over time; the disagreement is normative. Cases: the
  one-shot leveraged bet; the coin-flip double-or-nothing repeated; insurance (Kelly
