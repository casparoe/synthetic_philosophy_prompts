reasoning_summary: "Let me think about which domain and type combine well.\n\nOptions:\n\
  - State apologies for historical wrongs\n- Modularity of mind\n- History wars in\
  \ schools\n- Sellars's myth of the given\n- Heterogeneity problem for hedonism\n\
  \nTypes: essay with verdict; argument that proves too much (numbered premises);\
