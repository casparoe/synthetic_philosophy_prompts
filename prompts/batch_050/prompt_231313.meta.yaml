  Background for the question: the seminar has covered the simple conditional analysis
  of dispositions (roughly: x is disposed to M when S iff x would M if S obtained),
  and the two standard families of counterexamples — finks (cases in which the stimulus,
  or the conditions leading to it, remove the disposition or its causal basis, so
  the manifestation fails even though the object was disposed) and masks (cases in
  which the disposition remains but some interfering factor blocks the manifestation,
  as when a fragile glass is wrapped in protective packing). Students have also discussed
  the reformed conditional analysis, which says that having a disposition is a matter
  of having an intrinsic causal basis that, if retained, would produce the manifestation
  under the stimulus.


  The essay question should be built around the following scenario, which you should
  incorporate into the question text:


  The Stabilizer. A ceramic vase is fitted with a micro-device that continuously monitors
  the vase''s molecular bonds. Whenever an impact begins to stress those bonds toward
  the breaking point, the device instantaneously reinforces the bonds exactly where
  and to the degree needed, so the vase never breaks. Unlike a fink, the device never
  removes or replaces the vase''s molecular structure; unlike ordinary packing, it
  does not absorb the blow or keep the stress from reaching the bonds — the full impact
  registers in the vase''s structure, and the device cancels its effects from within,
  molecule by molecule, as they arise.


