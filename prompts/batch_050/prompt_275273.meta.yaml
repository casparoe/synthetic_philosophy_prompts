  just happens regardless of what we want, democratic control is futile — genuine
  tension. Also 1 vs 3: if nuclear plants require hierarchy, then a society that adopts
  nuclear gets pushed toward hierarchy — consistent with 3 actually (tech shapes society).
  Apparent tension: 1 and 3 look like they conflict (one says tech constrains politics,
  other says society adapts) but actually they reinforce. And 2 vs 3: if tech arrives
  autonomously and reshapes us, then "depends on the society using it" is undermined
