  a fixed society choosing how to use tech; 3 says tech reshapes society. So the genuine
  non-obvious tension is 2 vs 3 (and 2 vs 1), while 3 vs 4 is the more obvious one.
  Apparent tension that dissolves: 1 vs 4 — if artifacts have politics baked in, that
  gives MORE reason for democratic oversight of design, not less. Or 1 vs 3 dissolving.


