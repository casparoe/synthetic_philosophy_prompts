  1. The printing press caused the Reformation / changed society in ways nobody chose
  (strong tech determinism leaning).

  2. Technologies are just tools — what matters is how people use them (guns don''t
  kill people).

  3. Langdon Winner''s point: some artifacts require certain social arrangements —
  e.g., nuclear power requires centralized, hierarchical control; or Robert Moses''s
  low bridges (though that''s contested, but I don''t need to cite).

  4. Design choices are political and we should regulate tech democratically.


  Tensions: (1) and (2) pull apart — the classic one, but it''s pretty obvious. Need
  non-obvious. Better: someone holds (a) artifacts have politics built in (Winner-style),
  (b) the same technology can be used for liberating or oppressive ends depending
  on who''s in power — so politics is all in the use, (c) we can steer technology
  via regulation and design. Actually (a) and (c) — if artifacts embody politics,
  democratic design is fine; that dissolves. The real tension: believing tech develops
  on its own trajectory (autonomous technology, Ellul-style — "technology follows
  its own logic") AND believing we should regulate/steer it. If tech is autonomous,
  steering is impossible. That''s a genuine tension but somewhat known.


  Let me craft: commitments:

  1. Some inventions have politics baked in — a nuclear plant needs armed guards and
  central authority in a way a windmill doesn''t; you can''t run it any other way.

  2. Whether a technology frees or oppresses people depends entirely on the society
  using it — same internet, different regimes.

  3. New tech arrives and changes life whether we want it or not; nobody voted for
  smartphones to reorganize childhood, it just happened — society adapts to tech,
  not vice versa.

  4. We should have democratic say over which technologies get developed and deployed
  (e.g., facial recognition bans).


  Tensions: 1 vs 2 (if politics is baked in, it''s not entirely about the society
  using it — but one could distinguish "some artifacts constrain" from "most are neutral"
