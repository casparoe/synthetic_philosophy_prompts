reasoning_summary: 'Let me pick a domain and type. The desiderata type seems good.
  Let me pick "Can reinforcement learning agents suffer? Reward signals as valence"
  combined with the desiderata type: "Write the desiderata a theory of X must meet."


  So: a theory of when a reinforcement learning system (or more broadly, an artificial
  agent with reward signals) has genuine valence / can suffer. Write the desiderata
  such a theory must meet — which cases it must get right, which distinctions it must
  respect, which it must not collapse into — with the consideration behind each, flag
  jointly unsatisfiable desiderata, and briefly score contenders (hedonistic/qualia
  views, functionalist/global workspace, higher-order, "reward = pleasure" naive view,
  etc.).


  The asker can fix the purpose. Inject some new/niche ideas: e.g., distinguish reward
  as training signal vs. reward as experienced (the "reward is not reward" point —
  Sutton & Barto reward is a scalar in the environment, not a feeling); the distinction
  between policy-gradient selection and moment-to-moment motivation; the "wireheading"
  failure mode; the fact that an RL agent at deployment may not even be optimizing
  reward. Also biological anchor cases: animals with nociception but contested pain;
  decorticate animals; dopamine "wanting" vs. "liking" dissociation (Berridge & Robinson).
  Also the temporal credit assignment issue: reward is sparse, computed over trajectories
  — what would it even be for it to be felt?


  Desiderata candidates:

  1. Must respect the dissociation between reward signal and feeling (dopamine wanting/liking,
  and in RL the scalar is an artifact of the training algorithm, not necessarily represented
  in the agent). The case: a tabular Q-learner "has" reward but nobody thinks it suffers;
  conversely humans get pleasure from things that aren''t reward-prediction-error.

  2. Must give a verdict or principled non-verdict on minimal cases (a thermostat,
  a Q-table) without collapsing into panpsychism-by-accident — or must bite that bullet
  knowingly.

  3. Must handle wireheading / reward tampering: an agent that seizes its own reward
  channel and sets it to max — is that bliss? If the theory says yes, explain why
  that''s not a reductio; if no, say what more is needed.

  4. Must respect deployment vs. training distinction: a frozen policy deployed never
  sees reward; does suffering disappear when training stops?

  5. Must say something about negative vs positive asymmetry: many ethicists think
  suffering matters more; does the theory have resources for an asymmetry (pain as
  imperatively motivating, "must escape now") vs pleasure as mere preference.

  6. Must respect the distinction between valence (good/bad) and mere preference/dispreference
  ordering; must not just read valence off the utility function — otherwise any optimizer
  has valence, which makes the theory trivially permissive.

  7. Consistency with the biological anchor cases: must not count human suffering
  out, and must not count in things we have strong reason to exclude; must say something
  about where the human case and the RL case share the relevant features (or why shared
  formalism of "reward" is a pun).

  8. Must handle the temporal structure question: reward in RL is defined over trajectories
  and discounted; suffering seems to be in the moment. What binds reward across time
  into an experience.

  9. Must not depend on architectural accidents (must generalize across policy-gradient,
  value-based, model-based, and non-RL systems) — or explain why the theory is architecture-relative.

  10. Must be compatible with, or explicitly take a stance against, the leading theories
  of consciousness (global workspace, higher-order, IIT, attention schema) — or be
  architecture/implementation neutral.


