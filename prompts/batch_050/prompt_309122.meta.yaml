  I like the summary-audit type for Plutarch. The summary should be plausible, mostly
  right, with subtle errors. Common misrepresentations: (1) Plutarch "admits" he fabricates
  facts for moral purposes — actually he distinguishes biography''s aims from history
  but still cares about evidence; he weighs sources. (2) The "a small thing like a
  phrase or jest reveals character" — that''s genuine (Alexander preface). (3) The
  claim that the Moralia and Lives teach by example via imitation — accurate-ish.
  (4) Hagiography comparison: the summary might claim Plutarch writes hagiography,
  whitewashing heroes — actually he includes vices, e.g., in Demetrius/Antony he says
  he includes bad examples too (Demetrius preface: like Ismenias the Theban who showed
  both good and bad tunes). (5) The pairing and synkrisis as mere rhetorical device.


  Errors to embed: conflating "not writing history" with "not caring about truth";
  presenting his moral purpose as producing idealized saintly portraits when he explicitly
