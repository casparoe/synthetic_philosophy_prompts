  organ support after brain death determination specifically to preserve organs ("the
  patient is dead; we are perfusing the body"). Under B, that would be treating a
  living patient as a body. So approval is evidence against B... but maybe keep it
  to create tension? Better to design verdicts so that two rules survive and diverge
