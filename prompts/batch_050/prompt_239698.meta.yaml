  - C (higher-brain/consciousness): ruled out by case 3.

  - D (pragmatic donor-interest): hard to pin down; could fold in.


  New case: normothermic regional perfusion (NRP) — a real, somewhat niche but increasingly
  discussed protocol: after circulatory death declaration, surgeons clamp the cerebral
