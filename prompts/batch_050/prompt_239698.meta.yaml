  for her care, family permitted to direct... hmm, actually maintaining support of
  a deceased person''s body). This is consistent with A (she''s dead; support is of
  the corpse/fetus). Under B, circulation continued, so she''d be alive, and withdrawing
  at delivery would be killing? The committee approved maintaining support until fetal
