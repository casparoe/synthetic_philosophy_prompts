  deposit paraphrases; other teams can "withdraw" — accept the paraphrase as full
  repayment, or reject it as incomplete. The recurring failures: paraphrases are either
  endless ("Juliet is the sun" → she''s warm, bright, central, life-giving, ... where
  does it stop?) or lose something. This makes Davidson''s claim felt: if metaphor
  had a metaphorical meaning, paraphrase should be possible; instead metaphor works
  like a picture — it makes you see one thing as another; its effects aren''t propositional
  content.


  Round 2: "Mapping day" — students collect metaphors around one domain (arguments,
  time, love) and sort them; they discover systematicity: novel metaphors are instantly
  understood via existing mappings; inferences carry over (defend a claim, demolish
  a position → if you''ve demolished my position, have you refuted it?). This pressure
  against Davidson: if it''s just causal effects, why so systematic, why translatable
  into inference patterns, why do novel instances come for free?


