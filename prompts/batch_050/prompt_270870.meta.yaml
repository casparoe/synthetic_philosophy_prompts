  Objections to Humean reductionism about testimony:

  1. The child/infant objection (Coady): young children accept testimony without having
  amassed inductive evidence of its reliability, yet their beliefs seem justified.

  2. The circularity objection: any inductive justification of testimony''s reliability
  itself depends on testimony (e.g., checking reports requires other reports, other
  people''s observations).

  3. The transcendental/Principle-of-Charity objection (Coady, drawing on Davidson):
  we couldn''t even interpret speakers as making assertions unless we assumed general
  reliability, so testimony''s reliability is a precondition of interpretation, not
  an empirical hypothesis.

  4. The poverty of personal observation: each of us has checked only a tiny fraction
  of what we believe by testimony; the inductive base is far too thin to support the
  degree of trust we have.

  5. The gerrymandering/global vs local reduction issue: local reductionism is trivially
  available but global reductionism fails.


  If the prompt lists all standard objections, ask for a new one — that''s the hard
  version. Maybe list 4-5 and ask for one more that''s not a variant, and to say honestly
  whether it''s good.


