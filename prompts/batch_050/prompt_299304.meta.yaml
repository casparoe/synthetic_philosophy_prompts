  and which we can drop.

  - Mark the steps where judgment can''t be eliminated.


  Then run the procedure on three cases: (1) a hand-written arithmetic function in
  a library, no ML involved; (2) a small model trained to do addition that passes
  our suite but gets flaky past 12-digit numbers; (3) a vendor LLM that passes all
  our tests for following a content-policy spec. Ideally at least one of these should
  come out with an answer I''ll find annoying, and tell me which one and why I shouldn''t
