  Ok so I need help from someone who actually knows the philosophy here. Please act
  as a philosopher of language who also happens to understand machine learning and
  software testing — think carefully, brainstorm the hard cases first before you write
  the final answer.


  Background: I work at a company that buys and ships ML models, and I keep getting
  into the same argument. A vendor hands us a model, we run our test suite, it passes
  everything, and then someone asks "ok but is it actually following the rule we specified,
  or did it just learn something that agrees with the rule on all the cases we happened
  to test?" Classic example: model that adds correctly on every test case, but there
  are infinitely many inputs we never tested, and maybe its internal "rule" is some
  bent version of addition that diverges past numbers bigger than anything in our
  test set (like that quus thing from Kripke''s Wittgenstein book). Some of my coworkers
  think this is just philosophy-bro paranoia and enough testing settles it. I''m not
  so sure.


  So what I want: turn the rule-following stuff (Kripkenstein, meaning vs disposition,
  the normativity bit) into a procedure I can actually run, roughly once per model
  release, that outputs one of: "certified as following rule R," "certified as NOT
  following R," or "underdetermined — needs a human judgment call." Requirements:


