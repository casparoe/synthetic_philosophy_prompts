  to move on vs stop.

  - It has to be runnable in about half a day by an engineer, not a philosopher.

  - It must be honest about the fact (if it is a fact — tell me) that no finite test
  suite can ever conclusively settle this, and say what the procedure is actually
  buying you instead (shifting burden of proof? bounding the divergence? something
