  Alternatively, Fitch''s paradox: construct a thought experiment — Fitch''s paradox
  isn''t naturally a "construct a case" domain; it''s a proof. Could ask: construct
  an everyday example where a true proposition is unknowable without invoking the
  proof — that''s actually a known challenge (giving non-artificial examples of unknowable
  truths). Could ask: design a scenario where an omniscient-ish agent cannot know
  a particular truth because knowing it changes it — but that''s the self-referential
  trick; the interesting spec is a truth that is unknowable for non-self-referential
  reasons... Hmm, Fitch''s result: if every truth is knowable, every truth is known.
  Constructing a case where p is true but "p and nobody knows p" is unknowable. Could
  ask to build a realistic scenario making this concrete and to demonstrate.


  Actually the "subtle confusion" type is nice and different. Let me consider: Galen
  Strawson''s Basic Argument — a confused question: "Since Strawson''s Basic Argument
  proves no one chose to be the way they are, doesn''t that mean we should abolish
