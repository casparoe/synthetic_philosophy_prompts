  as the license for randomization. But there''s an obvious tension nobody at my level
  of reading seems to resolve: any trial that accumulates evidence destroys equipoise
  as it goes, yet we regard stopping early at the first hint of a difference as irresponsible,
  and continuing to a pre-registered sample size as ethical. Meanwhile, in decision
  theory, the problem of allocating participants across arms of unknown quality is
  just a bandit problem, and bandit problems have well-understood solutions that look
  nothing like fixed randomization to a significance threshold — response-adaptive
  randomization, Thompson sampling, explicit regret minimization. My suspicion is
