  Slogan type pairs well with speech acts: "saying makes it so" — performatives. Or
  with dogmatism paradox: "I know it, so I don''t need to look" — actually the slogan
  could be "to know, you needn''t keep checking" hmm. The classic slogan for dogmatism
  paradox: from Harman: "knowing doesn''t require further inquiry" or "if you know
  it''s red, you know it''s not a red thing illuminated to look red." Actually there''s
  a neat slogan in the domain: "you don''t have to look again to know you don''t have
  to look again"? The dogmatism paradox: if you know p, you know that any evidence
  against p is misleading, so you can dismiss it. Slogan candidates: "knowledge closes
  inquiry," "don''t second-guess what you know."


  Speech acts domain: slogan "saying makes it so" — Austin. Or "words are deeds."
  Could ask about "I hereby promise" — the slogan "to say something is to do something"
  (How to Do Things with Words paraphrase). Common slogan: "talk is cheap" as inverse.
  "Saying makes it so" is a commonly repeated one-liner in the speech act literature
  (Langton, etc.). The asker could have encountered it in a debate about e.g., whether
  promising creates obligations just by uttering words, or in debates about silencing
  and pornography (Langton). The disambiguation: readings from trivial (explicit performatives
  like "I promise" under ideal conditions create obligations) to radical (speech can
  constitute harm, silence people, make facts true). Which readings support use in
  argument.


  Alternatively decision tree for Humeanism vs anti-Humeanism. That works too: branches
  on whether laws supervene on the mosaic, whether necessity is in the world, governing
