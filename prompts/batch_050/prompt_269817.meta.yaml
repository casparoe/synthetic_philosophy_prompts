reasoning_summary: 'The task: write a prompt for a dataset. Domain choices: no-trade
  theorems, wavefunction reality, lobbying/money in politics, Euthyphro dilemma, verisimilitude.
  Types: (1) fairness audit of a summary, (2) taxonomy/quiz, (3) speech. Additional
  constraints: high school student perspective, formal/polished, epistemic request
  (separate settled from contested), prompt-engineering text (assign role, ask to
  think carefully).


  Best combo: Euthyphro dilemma with the "fairness of summary" type? Or verisimilitude
  with fairness audit. Or no-trade theorems with taxonomy. Let me think about which
  makes a good "in the weeds" prompt suitable for a high school student.


  The "fairness of summary" type fits nicely with a high school student who heard
  a summary from a teacher or read it in a book. Euthyphro is often mis-summarized.
  A good subtle misrepresentation: conflating the dilemma with "divine command theory
  is refuted," or presenting it as showing morality is independent of God outright,
  or treating the dilemma as a proof that God can''t exist, or confusing the two horns.
  Also common error: summarizing Euthyphro as "Socrates proved morality doesn''t come
  from God" — that''s a standard objection presented as refutation.


  Alternatively verisimilitude — but that''s pretty niche; small LLMs may struggle.
  The instruction says don''t refer to super niche theories; but you can inject niche
  ideas into the prompt itself. The summary-audit type allows injecting a flawed summary.


  No-trade theorems: could do a fairness audit of a summary like "Aumann proved rational
  people can''t agree to disagree, so markets can''t have trades." Subtle misrepresentations:
  conflating Aumann''s agreement theorem with Milgrom-Stokey no-trade; ignoring common
  priors/common knowledge assumptions; overstating to "markets shouldn''t exist."


  I think Euthyphro is safest and well-suited to a high school student. But maybe
  a bit common — the type note says to make it in the weeds. We can make the summary
  subtle: e.g., a friend summarizes: "In Plato''s Euthyphro, Socrates asks whether
  the gods love piety because it is pious, or whether it is pious because the gods
  love it. Either way, Socrates shows that morality is independent of God, so divine
  command theory is false, which is why most philosophers today think ethics doesn''t
  need religion." Subtle issues: (1) Socrates doesn''t refute divine command theory
  outright — the dilemma is a challenge about the direction of explanation, and defenders
  have responses (e.g., the "because" reading, God''s nature as the standard, modified
  DCT by Adams). (2) The conclusion "most philosophers think ethics doesn''t need
  religion" may be true sociologically but doesn''t follow from the dialogue; also
  the dialogue concerns piety, not morality in general — extending it is a further
  step. (3) The dialogue ends aporetically; Socrates doesn''t establish a positive
  thesis. Also the "gods" plural in polytheistic context vs. monotheistic God — applying
  it to monotheism is an extension.


  That gives a good audit: what''s right (the two-horn structure, the request for
  the eidos/what makes piety pious), what''s overstated (refutation), what''s conflated
  (piety vs. morality generally; polytheistic gods vs. God), and whether conclusions
  follow.


  Alternatively do verisimilitude — high school student less likely to encounter.
  Miller/Tichý result that all then-existing verisimilitude accounts are language-dependent...
  that''s niche. The instruction warns against super niche theories LLMs won''t have
  memorized. Verisimilitude is somewhat covered but the details (Popper''s definition
  failure shown by Tichý and Miller) are moderately known. Risky for small models.
  Euthyphro is well-known; the "in the weeds" comes from the subtle misrepresentations
  in the summary.


  Include: role assignment ("act as a philosophy professor / expert in ancient philosophy
  and philosophy of religion"), think carefully, maybe start by laying out the argument
  before auditing. Epistemic request: separate settled from contested.


  Write the summary in first person high school student voice, formal. No real quotes
  needed — no web search needed. Avoid quoting the dialogue verbatim; paraphrase.


  Draft:


  "I''m a high school student in an introductory philosophy elective. Last week our
  unit was on philosophy of religion, and a classmate gave a short presentation summarizing
  Plato''s Euthyphro..."


  Summary text: something like: "In the Euthyphro, Socrates asks whether what is pious
  is pious because the gods love it, or whether the gods love it because it is pious.
  He shows the first option makes morality arbitrary — anything could be good if the
  gods happened to love it — and the second means the gods are irrelevant to morality
  because right and wrong exist independently. So the dialogue proves divine command
  theory is false, and this is generally taken to show that morality does not depend
  on God, which is why the Euthyphro dilemma is considered one of the strongest arguments
  against grounding ethics in religion."


  Audit asks: which parts would a scholar accept, which are misrepresentations, whether
  the final claims follow. Also ask: what would a defender of divine command theory
  say; does the dilemma apply to monotheism as it does to Greek polytheism; the dialogue''s
  actual ending (no definition found).


  Also ask for settled vs contested: e.g., the text of the dialogue is settled; whether
  it refutes DCT is contested (Adams''s modified DCT, the response that God''s nature
  is the good, etc.).


  Prompt engineering: "Please take the role of a professor of philosophy with expertise
  in ancient Greek philosophy and contemporary philosophy of religion. Think carefully...
  Before writing your audit, briefly reconstruct the dilemma in your own words..."
  Good.


  Word the summary with one or two subtle misrepresentations and no howlers: misrepresentations:
  (a) presents the dilemma as proving DCT false (overstatement of a challenge as a
  refutation); (b) slides from "pious/holy" to "morality/right and wrong" without
  noting the extension; (c) treats "morality does not depend on God" as established
  rather than contested; maybe (d) implies Socrates argues the second horn makes gods
  "irrelevant" — more accurately the second horn means divine love doesn''t explain
  piety. Keep it plausible.


  Output only the prompt, no preamble.'
