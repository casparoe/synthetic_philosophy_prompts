reasoning_summary: "Let me pick a domain and type. Options: Heritability, BCI/mental\
  \ privacy, Buddhist ethics/consequentialism, Ellsberg paradox, counterpart theory.\
  \ Types: poem, role-play, verdicts-on-cases.\n\n\"Report verdicts on a set of cases\
  \ and ask what principle captures them\" pairs nicely with Ellsberg paradox / ambiguity\
  \ aversion — cases of choices under uncertainty, intuitions that violate expected\
