  Summary: "Prosaic alignment is the bet that we can align AI systems built out of
  today''s methods — gradient descent, transformers, RL from human feedback — without
  needing any fundamentally new insight into intelligence. The problem has two halves:
  outer alignment, getting the training objective to actually say what we want, and
  inner alignment, making sure the model that gradient descent finds actually pursues
  that objective rather than some proxy it latched onto. RLHF addresses the outer
  half: humans rate outputs, the model learns a reward model of human preferences,
  and that''s as close to ''what we want'' as we can write down. The inner half is
  handled by interpretability — if we can look inside the network and check whether
  it has developed deceptive goals, we can catch a schemer before deployment. The
  strongest argument that this whole program fails is instrumental convergence: whatever
  goals a smart system has, it will seek power and self-preservation, so a sufficiently
  capable system trained by these methods will eventually resist correction. That''s
  why people in the field say RLHF is a safety feature that will stop working exactly
  when capabilities get high enough to matter."


  Subtle errors: interpretability doesn''t "handle" inner alignment — it''s a diagnostic
  hope, not a solution; deception detection is exactly what may fail. Also the inner/outer
  split framing is decent. Instrumental convergence doesn''t show RLHF "stops working
  when capabilities rise" — that''s a different claim (situational awareness, gradient
  hacking, deceptive alignment). Also "that''s as close to what we want as we can
  write down" overstates. Also conflation: the claim that interpretability checks
  for deceptive goals assumes deception is detectable, which is contested.


  Then the ask: audit it, sentence by sentence maybe, what''s accurate, what''s an
