  relevant — works at a small AI startup, or brother works in the field. Include subtle
  errors: e.g., conflating outer and inner alignment, claiming RLHF solves alignment,
  treating "the alignment problem" as the orthogonality thesis, overstating that interpretability
  will scale, or misusing "mesa-optimizer". Also common misrepresentation: "alignment
  means making AI share human values" vs corrigibility etc.


  The asker should request the answer to say what would change its mind... but for
