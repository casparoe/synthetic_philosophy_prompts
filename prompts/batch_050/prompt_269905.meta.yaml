  likely wrong or depends on contested readings.


  No quotes needed. Write 2-3 paragraphs, polished.


  Summary should be mostly right with 1-2 subtle misrepresentations. Misrepresentations
  to include:


  1. Conflating outer alignment (specifying good objectives) with inner alignment
  (model pursues specified objective) — or claiming RLHF addresses inner alignment.

  2. Presenting instrumental convergence as proof that misalignment is inevitable.

  3. Claiming interpretability/scalable oversight are the whole problem solved in
  principle.

  4. Treating "prosaic alignment" as assuming future systems will be like today''s
  — actually prosaic alignment means aligning systems built using foreseeable/current
  methods, without fundamental new insights.


  The prosaic alignment gambit (Christiano) is somewhat niche but reasonably known.
  The prompt can define enough.


