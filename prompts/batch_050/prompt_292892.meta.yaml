  pre-existing cell rather than bootstrapping from a string. But tell me if I''m wrong
  about any of those or missing bigger ones.


  Bottom line question: once the disanalogies are on the table, does the claim that
  self-replication and self-reference are the same deep phenomenon survive as a thesis,
  or was the isomorphism only ever suggestive decoration? And separately: does typogenetics
  itself capture the interesting part of real self-reproduction, or does it just look
  like it does because the letters invite us to read meanings in? Please say how confident
  you are in the verdict overall, and single out the one point in your analysis where
  you''re least sure you''re right."


