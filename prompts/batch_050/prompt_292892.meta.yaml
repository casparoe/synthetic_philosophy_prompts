  Casual tone, a typo or two. Length: 1–3 paragraphs, elaborate. Let me draft.


  Draft:


  "So I finally got around to reading Gödel, Escher, Bach — I''m in an informal reading
  group with some friends from a cognitive science program — and we just got through
  the typogenetics stuff, where Hofstadter invents this toy molecular biology: strands
  of the letters A, C, G, T, and ''enzymes'' that are themselves coded by strands
  and that bind to other strands and chop, copy, and edit them. The big claim floating
  around all of this (and one of my friends states pretty baldly) is that DNA-based
  self-replication and Gödelian self-reference are at bottom the same trick: the genome
  is a self-referential sentence, the ribosome is the interpreter, and life is basically
  a strange loop that got wet. My friend with an actual biology background rolled
  her eyes at this and said the analogy is doing all the work and none of the chemistry
  is.


  I want an audit of how far this holds. Give me the explicit correspondence table
  — what plays the role of the formal symbols, the rules of inference, the Gödel numbering,
  the self-referential sentence G, the proof predicate — on both the typogenetics
  side and the real molecular biology side, since they''re not the same target. Then
  the disanalogies: which differences between chemical replication and logical self-reference
