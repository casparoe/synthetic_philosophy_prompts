  4. Give the strongest version of the losing side''s argument and explain why it
  doesn''t change your recommendation.


  Before drafting, spend a paragraph brainstorming: list the premises, the ways each
  could fail here, and the two or three considerations that should drive the recommendation.
  Then write the memo itself, addressed to the committee, under 800 words.


  End with a final line of exactly this form: \answer{FUND}, \answer{FUND WITH CONDITIONS},
  or \answer{DECLINE}.


