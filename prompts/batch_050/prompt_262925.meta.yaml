  ---


  You are a decision theorist who has spent a decade advising philanthropic funders
  on when rigorous evaluation is worth its cost. I chair the programs committee of
  a grantmaking foundation (roughly $30M disbursed annually), and I need a decision
  memo for a vote at our next meeting.


  The case. A nonprofit we have funded twice before runs a teacher-coaching program
  in two provinces of [country]; by its own monitoring data it performs well, though
  there has never been a controlled evaluation. It now proposes expanding to eight
  more provinces at a cost of $3.8M over three years, and has asked us to fund an
  independently run randomized evaluation alongside the expansion, at $420k. Two committee
  members have staked out positions. One argues we should fund program delivery only:
  the evaluation money would serve roughly eleven thousand additional children if
  spent directly, and if we trust the existing monitoring data enough to expand at
  all, we should expand fully. The other invokes Good''s theorem — the expected value
  of free information is never negative — and says the evaluation is obviously worth
  funding; in her words, "no one ever lost money learning something." The implementing
  partner, asked privately whether a null result would stop the expansion, answered
  that the ministry is enthusiastic and they expect to scale regardless of what the
  study finds. Meanwhile two other funders are watching our decision and have signaled
  they will follow our lead.


  Context on me: I''ve read rationalist blogs for fifteen years and know the standard
  value-of-information arguments, so don''t re-derive expected utility for me. What
  I need is the theorem''s premises audited against this case, not the jargon repeated.


  The memo should:

  1. State Good''s theorem precisely enough to identify its premises — perfect Bayesian
  updating, the decision being made after the information arrives, the decision being
  chosen to maximize expected utility under the posterior, the information being free,
  and a single agent whose payoff doesn''t depend on what others believe.

  2. Check each premise against the facts above. Note in particular: the implementer''s
  stated intention to scale regardless; that our committee''s decision rule is ours
  to set, so the theorem may apply to our choice even if not to theirs; that the information
