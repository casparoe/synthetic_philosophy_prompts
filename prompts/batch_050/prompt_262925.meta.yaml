  The "request comments on an essay" type requires me to write an essay myself and
  ask for comments. That could work well with Good''s theorem on the value of information
  — a very rationalist-blog topic (value of information, acausal stuff, etc.). Good''s
  theorem is a classic LessWrong topic.


  Alternatively, democratic backsliding + memo type could work well: an institutional
  body deciding whether something counts as democratic backsliding. But "memo" type
  with rationalist persona... hmm.


  Good''s theorem: the value of information theorem says (roughly) that in a Bayesian
  decision problem, you never pay for free information before making a decision —
  expected value of free information is non-negative. A longtime rationalist-blog
  reader writing an essay questioning it, or applying it to a case, asking for comments.
  Or a memo type: e.g., a grant committee or company deciding whether to purchase
  information (a study, a test) — Good''s theorem says free information never hurts
  if you''ll update and act optimally; but there are caveats (costly deliberation,
  commitment issues, iterated games, non-Bayesian agents, information that changes
  your utility, selection effects, etc.).


  Memo type: institutional body decides a concrete case. E.g., chair of a thesis committee?
  Or a biotech startup''s decision board deciding whether to run an expensive diagnostic
  test? Or: a funding committee deciding whether to fund an experiment whose results
  might not change any decision? Hmm.


  Actually the persona "longtime reader of rationalist blogs" fits beautifully with
  Good''s theorem — the writer knows VoI jargon. Let me design a memo:


  Scenario: I''m on the board/committee of some institution deciding whether to acquire
  information. A concrete case where Good''s theorem''s assumptions are strained.
  Good cases:


  1. A hospital committee deciding whether to offer/do a genetic test (Huntington''s)
  — but that''s more ethics.

  2. A grant panel deciding whether to fund a study whose outcome can''t change the
  funded intervention? Good''s theorem says if the information can''t change any decision,
  its value is zero.

  3. A hiring committee: whether to look at social media of candidates — free-ish
  information but maybe value-destroying because committee members can''t process
  it rationally (base-rate neglect, anchoring), violating the idealized rationality
  assumption. That''s a nice instantiation: Good''s theorem assumes a perfect Bayesian
  agent who will act on the information optimally; a committee of humans won''t.

  4. An effective-altruism-flavored grant committee (rationalist persona!) deciding
  whether to fund an impact evaluation / RCT of a program before scaling it. Someone
  invokes Good''s theorem to say information is always worth something; the twist
  is whether the evaluation results would actually change decisions (program officers''
  priors, political constraints), and the theorem''s conditions.


  The EA grant committee one is great for a rationalist persona. Case: a foundation
  grants committee must decide whether to commission an RCT of a deworming-style intervention...
  but that risks being a "seen a million times" thing (GiveWell). Make it fresh: maybe
  a foundation deciding whether to fund a forecasting study, or a "shut down or scale"
  decision.


  Let me pick: I sit on the grants committee of a mid-sized foundation. Proposal:
  a nonprofit wants funds for a program plus a rigorous evaluation; another proposal
  from a staffer says skip the evaluation and spend the money on direct program delivery,
  invoking Good''s theorem incorrectly? Wait — Good''s theorem supports getting information.
  The staffer against evaluation would argue the information won''t change decisions.
  Or the reverse: a committee member cites Good''s theorem to argue the evaluation
  is always worth funding since information is never negative-value; the chair wants
  a memo that actually checks the theorem''s premises.


  Concrete instantiation of the philosophical issue: Good''s theorem requires (a)
  Bayesian rational agent, (b) the decision to be made after receiving info is chosen
  by maximizing expected utility with updated beliefs, (c) no cost of deliberation,
  (d) the information structure is fixed regardless, (e) single-agent, no strategic
  effects. In real grantmaking: evaluations can change decisions (which program to
  scale), but also: eval results get selectively reported, anchor donors, create Goodhart
  dynamics, the "decision" may be politically predetermined so info has zero decision-relevance,
  measurement costs money (the theorem is about free info; costly info needs cost-benefit).
  Also, an RCT result might reduce donations from emotional donors (information destroying
  value in a strategic/audience sense — third parties aren''t Bayesian). Nice.


  So the memo: recommend fund/not fund/fund-with-conditions the evaluation component,
  engaging the strongest consideration on the losing side, with criteria.


  Format requirement: final answer in machine-readable form at the end — \answer{...}
  enclosing a verdict. That fits the memo type well: \answer{Fund with conditions}
  or similar.


