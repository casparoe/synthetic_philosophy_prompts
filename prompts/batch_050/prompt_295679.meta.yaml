  Orwellian vs Stalinesque: In Dennett''s terms, Orwellian = you experience X but
  memory is immediately rewritten so you misremember; Stalinesque = you never experienced
  X, but a false memory was fabricated before consciousness (show trial). Dennett
  argues the distinction collapses for very short timescales — no fact of the matter.


  Design commitments:

  (1) There''s always a fact of the matter about what was experienced at a time (even
  if unknowable).

  (2) In color phi, subjects genuinely see the moving spot change colour mid-path
  (or: they see the first spot as the second''s colour before it appears).

  (3) Memory can be immediately revised (Orwellian) — that''s how I explain color
  phi.

  (4) Introspective reports are the only data we have about conscious experience.

  (5) Consciousness is not Cartesian theatre — no single place/time where it "all
  comes together."


  Tensions: (1) and (3)+(5): if no Cartesian theatre and experience timing is constituted
  by later effects, the Orwellian/Stalinesque distinction may have no fact of the
  matter, conflicting with (1). Also (2) and (3): if Orwellian misremembering explains
  it, then the subject never actually saw the colour change — conflicting with "genuinely
  see". That''s the classic tension: Orwellian implies the report is false memory;
  you can''t both say the experience was of colour change and explain by memory revision.
  Apparent tension that dissolves: (4) and (5) — no Cartesian theatre doesn''t deny
  introspective data. Or (2) and (4).


  Also good: a commitment like "I think what a subject sincerely reports is the last
  word on their experience" vs Orwellian explanation — that''s real tension (first-person
