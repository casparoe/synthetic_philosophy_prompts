  Let me draft the Moore exam prompt:


  Context: "I teach an upper-level undergraduate seminar on early analytic ethics
  / history of value theory. I''m writing the final exam. I want one essay question
  on G. E. Moore''s account of the ideal goods in the final chapter of Principia Ethica
  — his claims that the greatest intrinsic goods are certain states of consciousness,
  namely the appreciation of beauty and personal affection — that cannot be answered
  by reciting the naturalistic fallacy or the open-question argument."


  Question design: Something that forces confrontation with the organic unity doctrine.
  E.g.:


  "Consider two cases. Case 1: A landscape of great beauty exists on a planet no sentient
  being will ever observe; by contrast, a mediocre painting is admired daily by thousands.
  Moore appears committed to saying the second situation contains vastly more intrinsic
  value than the first. Case 2: Ada admires her friend Bruno for his wit and generosity;
  in fact Bruno is dull and selfish, and Ada''s beliefs about him are false. ... "
  Then tasks: (a) state the principle of organic unities and show how it generates
  these verdicts; (b) reconstruct Moore''s reasons for the veridicality requirement
  — that affection directed at qualities the person lacks is less valuable; (c) assess:
  does the organic unity principle undermine Moore''s method of isolation (judging
  value by asking what a thing would be worth if it existed alone)? — this is the
  real crux! Moore''s method of isolation is in tension with organic unities: if wholes
  have values not derivable from parts, then judging the value of a part by imagining
  it alone may mislead, because its contribution to a whole differs from its isolated
  value. That''s a genuinely in-the-weeds crux that separates understanding from memorization.
  (d) Ask whether Moore can consistently hold both, and what revision would be needed.


  Also the comparison between beauty and friendship: why does Moore rank personal
  affection as (perhaps) the greater good? Because persons have more complex mental
  qualities — the object of appreciation is richer. And the asymmetry: appreciating
  beauty requires appropriate emotion toward real qualities of the object; admiring
  a person for qualities they lack.


  Marking scheme: 20 marks, five must-hit points:

  1. Correct statement of organic unity principle and its application to both cases
  (4) — typical error: treating it as "the whole is greater than the sum of its parts"
  holism slogan without the specific claim that part-values don''t fix whole-value.

  2. The isolation method and the verdict on unobserved beauty (4) — typical error:
  saying Moore values the beautiful object intrinsically regardless of consciousness;
  or conversely attributing to him the view that objects have no value at all (he
  thinks the beautiful object alone has "some" but comparatively negligible value
  — actually Moore says the mere existence of what is beautiful has value "so small
  as to be negligible" in comparison; he explicitly considers whether beauty existing
  unperceived has value and says it may have some but the whole with appreciation
  is vastly better; also the famous thought experiment of the beautiful vs. ugly world
  with no observers in §50).

  3. The veridicality/appropriateness condition and the Ada/Bruno case (4) — typical
  error: saying the falsity of Ada''s beliefs makes her state bad simpliciter; Moore''s
  view is the whole (affection + false belief in good qualities that are absent) is
  less good than the corresponding whole with true belief, and he counts love of the
  ugly/imaginary qualities as an evil in some cases... Let me recall ch. VI: Moore
  discusses cases where the object doesn''t exist or doesn''t have the qualities;
  he holds that where the cognition is of beautiful qualities that don''t exist, the
  whole may still be good but less so; where admiration is directed at ugly or evil
  qualities (admiring someone''s cruelty), the whole is evil. There are three classes:
  (1) appropriate cognition of really existing beautiful qualities + appropriate emotion
  = great good; (2) cognition of beautiful qualities that don''t exist (error) — the
  whole is still positively good but less (actually Moore says such wholes may still
  be "positively good" but the error is an evil); (3) admiration of ugly qualities
  — positively evil. Hmm, details: §122 discusses "the love of what is ugly" as a
  positive evil; §121-123. I need to be careful with details if the marking scheme
  leans on them. Since I''m writing both question and marking scheme, I can choose
  the level of detail I''m confident about: Moore holds that the value of the whole
  depends on whether the admired object really possesses the admired qualities, and
  that affection directed toward qualities the person lacks is inferior, and that
  admiration of bad qualities is a positive evil. This is safe.


  4. The tension between organic unities and the method of isolation (4) — the crux.
  Typical error: not noticing the tension at all; or overstating (claiming outright
  contradiction without seeing how Moore might respond — e.g., isolation is a heuristic
  for intrinsic value of parts; contributions to wholes are a separate question; but
  the critic presses: if part-value is defined by isolated existence, then claims
  like "consciousness contributes the value" become untestable).

  5. Why friendship can rank above (or alongside) aesthetic appreciation, and the
  structural difference between the two goods (4) — typical error: saying it''s just
  "relationships matter more than art" intuition; Moore''s reason: persons as objects
  of appreciation have complex mental qualities, so appreciation of a person includes
  appreciation of their own appreciations — a recursive/reflexive structure (Moore
  notes that in personal affection we appreciate the person''s own appropriate emotions
  toward others, generating a whole of great complexity). Also typical error: missing
  that the affection itself must be directed at real mental qualities.


