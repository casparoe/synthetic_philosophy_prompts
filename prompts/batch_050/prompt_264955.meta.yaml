  Argument draft:

  1. To explain an event E, a historian must select E''s causes from an indefinitely
  large causal field (everything from the weather to grain prices).

  2. Legitimate selection requires a principle that picks out the relevant causes.

  3. The only available principle is which causes, in hindsight, connect to E — i.e.,
  knowing how things turned out.

  4. Knowledge of outcomes systematically distorts judgment of their antecedent probability
  (hindsight bias: people overestimate how predictable the outcome was).

  5. Therefore the selection principle is distorted: historians will overrate the
  necessity/predictability of what happened.

  6. Any explanation built on a distorted selection misdescribes the causal facts.

  7. Therefore all causal historical explanation is unreliable.

