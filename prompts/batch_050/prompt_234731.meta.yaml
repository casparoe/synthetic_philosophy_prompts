  Draft summary text:


  "Fitting-attitude accounts say that for something to be good (or admirable, or funny)
  just is for it to be fitting to favor it (admire it, laugh at it). The so-called
  wrong kind of reasons problem is supposed to be a knockdown objection: an evil demon
  could credibly threaten to punish you unless you admire him, and then you''d have
  a reason to admire him, but he isn''t admirable — so reasons to have an attitude
  don''t track the fittingness of the attitude, and value can''t be analyzed as the
  fittingness of attitudes. Defenders usually reply by distinguishing ''right-kind''
  from ''wrong-kind'' reasons, but since the only way to say which reasons are the
  right kind is to check whether the object actually has the value in question, the
