  (3) Therefore no two speakers'' words have the same inferential role.

  (4) Therefore no two speakers ever mean the same thing by any word.

  (5) If two speakers never mean the same thing, genuine communication and disagreement
  are impossible — disagreement requires one person affirming what the other denies,
