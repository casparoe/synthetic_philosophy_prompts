  - Duty to society: a person who kills himself only ceases to do good, which is at
  most the smallest harm; duties to society presuppose continued participation and
  can''t bind someone whose life is a burden / who can no longer contribute — if anything
  society gains when a burdensome member departs.

  - Duty to self: prudence governs life; when life holds more misery than happiness,
  ending it may be rational; fear of death isn''t a reason; also the point that a
