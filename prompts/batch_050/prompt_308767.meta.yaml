  a practice—e.g., the practice of AI companies/users talking to chatbots with polite
  requests, "please", thanking them; or the practice of AI labs running "welfare"
  checks; or the design choice of making AI assistants say "I think" / "I believe".
  As a novelist: I''m writing a character who... hmm.


  Novelist perspective: "I''m writing a novel where..." The practice: the tech industry
  practice of designing chatbots to use first-person mentalistic language ("I think,"
  "I don''t know," "I''m sorry") while simultaneously adding disclaimers that the
  AI doesn''t really understand or feel anything. What theory of mind/belief attribution
  does that presuppose? That''s a nice apparent inconsistency—fits the type well ("we
  do X here but Y there").


  Alternatively causation by omission: a novelist''s practice? E.g., Chekhov''s gun—no.
  Practice: "show don''t tell"? Hmm. Omissions: In fiction, an author who omits to
  mention something... Actually causation by omission could pair with a novelist nicely:
  "in my novel a character dies because the doctor didn''t call back" — is the doctor
  a cause of death? But the type is practice-presupposes-commitments. Practice could
  be: literary critics'' practice of blaming authors for what they left out (the "sin
  of omission" in representation debates) — what theory of causation/responsibility
  does that presuppose? That''s actually interesting and niche-ish. But maybe intentional
  stance is stronger and more common knowledge.


  Moloch: practice of a novelist... e.g., the practice of authors blurbing each other''s
  books, or social media self-promotion races. What does it presuppose? Less clean.


  Let me go with intentional stance + AI belief attribution, novelist perspective,
  "commitments of a practice" type. The practice: chatbots designed to say "I think
  / I believe / I''m sorry" + companies'' disclaimers insisting no real understanding;
  plus users saying "please" and "thank you." The novelist angle: I''m writing dialogue
  for an AI character and noticed my own habits... Something like: "I''m drafting
  a novel with an AI character, and while researching I''ve been using chatbots a
  lot. I noticed I say please and thank you to them, and the chatbot says ''I think''
  and ''I''m sorry,'' but the company FAQ insists it doesn''t understand or believe
  anything."


  Ask: what theory of belief/mind does this whole setup presuppose? Does first-person
  mentalistic language presuppose that beliefs are whatever it''s useful to attribute
  (interpretationism/Dennett) or that beliefs require inner states the disclaimers
  deny? Is the design choice consistent? What would change if...


  Format: prescribe sections by name and order with rough lengths. E.g., "The theory
  underneath" (~300 words), "Where the practice is consistent and where it isn''t"
