  a test that tells you which side of the dream/wake line you''re on. Zhuangzi conspicuously
  does not look for a test. Does the totem idea mean the film is fundamentally Cartesian
  after all, or does the film undermine the totems (Arthur''s loaded die, the fact
  that a totem only works if nobody else knows its properties, and the top was Mal''s
  anyway) in a way that moves it toward Zhuangzi?

