  is about as long as the sequence itself; there is no program materially shorter
  than the sequence that outputs it (Kolmogorov complexity near length).

  3. Unpredictability. A sequence is random just in case no effective betting scheme
  can win systematically against it — the martingale idea, applied to finite play.

  4. Stochasticness. A sequence is random just in case no effectively specified selection
  rule picks out a biased subsequence (the von Mises–Church idea of admissible place
  selections, applied to finite strings).


