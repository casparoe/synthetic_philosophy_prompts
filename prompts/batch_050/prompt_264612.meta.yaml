  Tit-for-tat, submitted by Anatol Rapoport to both of Axelrod''s tournaments, simply
  cooperates on the first move and thereafter copies the opponent''s previous move.
  Its success is usually attributed to four properties: it is nice (never first to
  defect), retaliatory (punishes defection immediately), forgiving (returns to cooperation
  as soon as the opponent does), and clear (its behavior is easy for opponents to
  read).


  (i) The commentator''s first conclusion is correct. Because tit-for-tat responds
  to cooperation with cooperation and to defection with defection, it defeats every
  strategy it is paired with head-to-head: strategies that try to exploit it find
  their gains erased by retaliation, while cooperative strategies are simply matched.
  This pairwise dominance over the field is what produced the highest total score
  in both tournaments.


  (ii) The second conclusion is also correct. In a population of tit-for-tat players,
  everyone cooperates and receives R each round. A mutant that always defects gains
  T in its first encounter with each opponent but is thereafter punished, receiving
  only P, so with a sufficiently high probability of continued interaction its total
  payoff falls short of R per round. Since no mutant can do better against the resident
  population than the residents do against one another, tit-for-tat is an evolutionarily
  stable strategy and cannot be invaded.


