  Draft:


  I''m a senior in high school and I run our school''s philosophy club. Next month
  we''re doing a session on the question of what instrumental music — a string quartet,
  a symphony, a piano étude, no lyrics — is about, if it''s about anything, and I
  want to open the meeting with a sorting quiz that places each member into a position
  on that question. Before I explain the quiz, some context that should shape its
  design.


  In the preface to the first edition of The World as Will and Idea (translated by
  R. B. Haldane and J. Kemp), Arthur Schopenhauer writes: "According as we consider
  the different aspects of this one thought which I am about to impart, it exhibits
  itself as that which we call metaphysics, that which we call ethics, and that which
  we call æsthetics; and certainly it must be all this if it is what I have already
  acknowledged I take it to be."


  I chose this passage because of the puzzle it creates for our session. Schopenhauer''s
  own account of music (in the third book of the same work) is the clearest case of
  the "single thought" structure he describes: his view that music matters because
  of what it is — that unlike the other arts it does not copy the world of appearances
  or the ideal forms of things, but directly presents the striving, tension, and release
  that he thinks is the inner nature of everything — is not a free-standing theory
  you could adopt while disagreeing with the rest of his philosophy. Please paraphrase
  rather than quote that material anywhere in your answer; I''ve only verified the
  passage above.


  The quiz I want should therefore do two jobs at once: sort people by what they actually
  think about music, and test whether Schopenhauer is right that a view about an art
  form is inseparable from one''s metaphysics and ethics. Concretely, I''d like:


  1. A decision tree (or equivalently a quiz with a scoring key) of 8 to 10 questions.
  Every question should be a concrete musical situation with two or three answer options
  — for example, being moved to tears by a piece with no words, a film score that
  makes a chase scene feel urgent, a Baroque fugue that seems to be about nothing
  but itself, a symphony''s storm passage. No question may mention a philosopher,
  an "-ism," or ask directly what music "expresses"; the sorting has to happen through
  reactions to cases.

  2. The first branch of the tree should operationalize the passage: a question that
  separates members who think a satisfying account of music must connect to one''s
  broader picture of what the world and human life are like from members who think
  a theory of music can stand on its own. Say in one paragraph how this branch interprets
  the passage and whether you think it is a fair operationalization.

  3. The leaves should include at least: Schopenhauer''s own view (located correctly
  as requiring his wider metaphysics, per the passage); a formalist view that music
  has no subject matter beyond its own structure; the view that music expresses emotions
  the composer felt; the view that music arouses emotions in listeners without expressing
  anything; a representational or pictorial view; and a narrative view that hearing
  music is like following a story. Give each leaf a name and one sentence on its most
  awkward commitment.

  4. A scoring key mapping answer patterns to leaves, with any pair of leaves your
  questions cannot reliably separate flagged rather than papered over (I suspect expression
  and arousal will be hard to pull apart).

  5. A short note on combinations of answers no real position occupies, and your diagnosis
  of each: incoherent, merely unattractive, or unexplored.


  The quiz will be taken by teenagers who have read no philosophy, so keep the wording
  plain. Aim for something that fits on two printed pages.


