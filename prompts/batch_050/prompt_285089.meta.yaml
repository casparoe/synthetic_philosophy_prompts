  Option A draft (Pascal''s mugging exam question):


  Persona: "I lecture in philosophy at ... I''ve been a LessWrong reader since the
  Sequences... I''m setting the final for my upper-level seminar on decision theory
  under moral uncertainty..."


  Ask: one essay question on Pascal''s mugging. Constraints: 50 minutes / 90 minutes,
  ~800-word essay, worth 30 marks. The question must not be answerable by reciting
  "expected utility maximization plus bounded utility." Force students to confront
  the real crux: the mugger scenario vs. apparently analogous serious arguments (x-risk),
  the probability-payoff entanglement, whether boundedness solves anything or merely
  relocates the problem, and fanaticism.


  Model answer ~600 words. Marking scheme separating A from B by named moves.


  Let me name the moves carefully:


  1. State the paradox precisely: not just "big payoff times tiny probability" but
  that EV maximization appears to endorse paying, for arbitrarily small probabilities,
  given a sufficiently large claimed payoff — and the payoff can always be raised
  to compensate.


  2. The bounded-utility response: if utility is bounded, no finite probability can
  be swamped. Cost: boundedness is ad hoc (why should my good have a ceiling?), generates
  its own counterintuitive results (indifference to arbitrarily large improvements
  once near the bound), and arguably doesn''t solve the problem for people with unbounded-seeming
  values (total utilitarians).


  3. The key move distinguishing the mugger: the entanglement between the payoff claim
  and the probability. In the mugging, the probability estimate is not independent
  of the magnitude of the payoff — the larger the claimed reward, the more the claim
  itself functions as evidence against itself (the hypothesis "this person can deliver
  10^1000 utils" has prior mass that shrinks as the claimed capacity grows, and the
  offer gives no independent evidence). The student''s essay should note that a rational
  agent''s credence in the deliverability hypothesis should fall at least as fast
  as the payoff grows — this is sometimes put as: the mugger''s threat carries no
  evidential weight, and the hypothesis space is being gamed. Without this move, the
  mugging and x-risk mitigation are structurally identical, so the response collapses
  into either "pay the mugger" or "abandon x-risk reasoning."


  4. Fanaticism / the general problem: even setting the mugger aside, any unbounded
  utility function plus nonzero credences makes EV hostage to tiny probabilities (Pascal''s
  wager, St. Petersburg-adjacent issues). A good answer should identify whether the
  student thinks the mugging is a special case with a special fix, or an instance
  of a general pathology requiring a general fix (boundedness, risk-weighted EV, lexicographic
  thresholds, discounting).


  5. Application: does the fix vindicate refusing the mugger while preserving the
  practice of taking small-probability catastrophic risks seriously? The A-answer
  distinguishes via independent evidence for the probability claim, vs. B-answer merely
  asserts it.


  Mistakes that cost marks: treating "bounded utility" as costless; conflating low
  probability with zero probability ("you can''t multiply by zero"); saying the mugger
  is lying so probability is exactly zero; treating Pascal''s mugging as identical
  to Pascal''s wager without noting the epistemic asymmetries; name-dropping without
  analysis.


