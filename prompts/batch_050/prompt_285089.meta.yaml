  one another in regular ways (the pattern DOG reliably sets off the pattern CAT).
  Hofstadter''s question: when one symbol sets off another, is anything at the symbol
  level genuinely doing the pushing, or is all the real shoving happening marble-on-marble,
  with the symbol story a mere gloss?"


  Para 2: The audience and the difficulty. Audience: smart non-specialists fluent
  in software metaphors, inclined to say "obviously the marbles do all the causing;
  symbols are just patterns, like the center of gravity of a population" — and then
  to worry that this makes minds epiphenomenal. The hard part pedagogically: the two
  temptations (spooky downward causation vs. eliminative ''the symbol level is a fiction'')
  are both natural, and the resolution (levels of causal explanation; the symbol-level
  story captures the real counterfactual/invariance structure that the marble-level
  story misses) is subtle.


