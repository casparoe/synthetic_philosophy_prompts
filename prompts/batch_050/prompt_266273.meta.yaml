  the "catastrophe principle" critiques by Sunstein.


  Construct a thought experiment where... e.g., a case where the precautionary principle
  prescribes action X, but the same principle prescribes not-X; the classic dilemma.
  But that''s common. Make it in the weeds: design a case where the PP gives a determinate
  verdict but expected-utility maximisation gives the opposite, and where the PP''s
  verdict is NOT the intuitively correct one — constraints: realistic public-health
  scenario, no probabilities available (deep uncertainty, not just risk), one paragraph,
  and the PP must be applied under a specified formulation (e.g., a weak version:
  lack of full scientific certainty shall not be used as a reason for postponing cost-effective
  measures). Also show what a defender would say.


  Or combine with quantum immortality — thought experiment there is tricky. Precautionary
  principle is more tractable and well-defined.


  Let me draft:


  "Construct a thought experiment in which the precautionary principle delivers a
  determinate, non-paralysing verdict, but expected utility maximisation delivers
  the opposite verdict, and the precautionary verdict is not obviously the intuitively
  correct one. Constraints: the case must be realistic... The uncertainty must be
  genuine deep uncertainty... The scenario must be one paragraph..."


  Specifications to include:

  1. Realistic domain: e.g., public-health / environmental regulation / new technology
  approval, not sci-fi.

  2. Deep (Knightian) uncertainty — no probability distribution available for the
  catastrophic outcome; if probabilities are available, EU just computes and PP loses
  its distinctive role. But careful: EU needs probabilities. So design: probabilities
  available for some outcomes but not the worst one? The interesting case: worst outcome
  has no well-grounded probability; EU maximiser has to either assign a probability
  (making it risk not uncertainty) or refuse to decide. To make EU give the opposite
  verdict, maybe: give a "best estimate" probability that''s low but contested — EU
  uses the estimate, PP refuses to rely on it because the model generating it could
  be systematically wrong.

  3. The precautionary principle''s verdict must not be paralysing — i.e., the "both
  action and inaction carry possible catastrophe" symmetry must be broken by some
  feature of the case. That''s the hard part and should be acknowledged: ask the model
  to state which feature breaks the symmetry (e.g., status-quo bias, reversibility,
  or a threshold).

  4. After the scenario: state the formulation of PP being used (there are many: Rio
  Declaration''s weak version, Wingspread, strong version), give the verdicts and
  reasoning, identify the load-bearing feature, explain what happens if removed (collapse
