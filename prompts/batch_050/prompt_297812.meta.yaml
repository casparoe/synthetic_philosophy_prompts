  could not have inferred from the fluidity, and transparency of water, that it would
  suffocate him, or from the light and warmth of fire, that it would consume him.
  No object ever discovers, by the qualities which appear to the senses, either the
  causes which produced it, or the effects which will arise from it; nor can our reason,
  unassisted by experience, ever draw any inference concerning real existence and
  matter of fact."


  My argument runs as follows.


  1. Hume is right in this passage: no exercise of reason unaided by experience can
  establish any matter of fact, so nothing beyond the observed instances themselves
  is available to support a projection from observed to unobserved cases.

  2. It follows that two general hypotheses which agree on every observed instance
  are equally well supported by the evidence gathered so far; there is no further
  evidence either could appeal to.

  3. Call an object "grue" just in case either it is examined before some future time
  t and is green, or it is not so examined and is blue. Every emerald examined to
  date is grue, since each was examined before t and found green.

  4. The hypotheses "all emeralds are green" and "all emeralds are grue" agree on
  every observed instance. By (2), they are equally well supported.

  5. The two hypotheses make incompatible predictions about emeralds first examined
  after t, so the total evidence equally supports incompatible predictions.

