  For a term paper in my philosophy of science seminar I have been developing an argument,
  and I have come to suspect it proves too much, because its conclusion is one I cannot
  seriously accept. The argument begins from a passage in David Hume''s An Enquiry
  Concerning Human Understanding (Section IV, Part I), where Hume writes:


