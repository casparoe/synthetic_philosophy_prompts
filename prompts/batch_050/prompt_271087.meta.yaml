  belt... but Lakatos''s criterion is diachronic and permissive — young programmes
  get time; so does it actually license the verdict we want, and on what grounds?


  Third, the deflationary turn (Laudan): ... demarcation criteria fail to give necessary
  and sufficient conditions; does the episode support that pessimism or does it show
  that family-resemblance criteria suffice?


  Then the reverse direction: what does the episode show about the demarcation project?
  Note that demarcation criteria were developed against physics and its imitators,
  whereas von Däniken mimics historiography, not experimental science: the apparatus
