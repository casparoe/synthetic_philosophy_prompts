  been cut or moved by the technologies available to the cultures in question — and
  experimental archaeology falsified several of them. So falsificationism seems to
  deliver an awkward verdict: the movement''s unfalsifiable core is unscientific,
  while its most pseudoscientific-looking concrete claims pass the test by being falsified.
  Work through this carefully...


