  and biblical passages such as Ezekiel''s vision recast as eyewitness reports of
  spacecraft. The movement sold tens of millions of copies, attracted sustained rebuttals
  from archaeologists and scientists, and has survived those rebuttals for half a
  century.


  I am not asking for a debunking; take it as given that the archaeological mainstream
  is right about the sites. What I want is an analysis of the episode through three
  demarcation proposals, and then an assessment of what the episode does to them.


  First, Popper. ... [falsifiability]: Von Däniken''s characteristic move is the interrogative
  hedge — claims advanced as questions... plus auxiliary hypotheses that absorb counterevidence
