  ---


  I''m putting together a seminar session that pairs Kurosawa''s Rashomon (1950) —
  itself adapted from two Akutagawa stories — with the contemporary debate over the
  cognitive penetrability of perception, and I want a reading of the film through
  that debate, done properly in both directions.


  The standard classroom use of Rashomon treats it as a parable about unreliable testimony
  and self-serving memory: the bandit, the wife, the dead samurai speaking through
  the medium, and finally the woodcutter each give incompatible accounts of what happened
  in the grove, each version flattered in the teller''s favour, and the film refuses
  to say which is true. I want to resist that flattening and press a harder question.
  The penetration debate turns on a distinction between effects on perception proper
  — what a perceiver actually sees — and effects confined to downstream stages: where
  attention is directed, what is remembered, what is judged, what is reported. Pylyshyn-style
  impenetrability claims that beliefs, desires, and self-conception never reach the
  first of these; penetration theorists argue they sometimes do; sceptics such as
  Firestone and Scholl reply that most purported demonstrations are really attentional,
  judgmental, or memorial effects wearing perceptual dress.


  So: sort the film''s distortions. Which, if any, of the four accounts dramatise
  a genuine difference in seeing rather than in remembering, judging, or telling?
  Consider in particular what the woodcutter''s final version does to the question:
  he seems to have seen the grove accurately and lied anyway, to conceal the stolen
  dagger — which looks like a point for the impenetrabilist, since his perception
  survived his self-interest intact. Does the film, taken as a whole, in fact side
  with impenetrability, locating all the corruption in report and memory? Or does
  the way each account renders the wife — seductress, victim, spurned and despairing
  — suggest that each teller''s evaluative stance towards her shaped the encounter
  as perceived, in which case the film dramatises the penetrabilist''s best case?


  There is also a problem about the medium I would like taken seriously. Film shows
  us each testimony as footage from a camera that behaves neutrally within each version;
  it can depict different stories, but it is not obvious that it can depict different
  seeings, since it has no way of showing a perceiver''s experience from inside without
  simply showing us a world. Does this mean cinema is constitutively unable to represent
  cognitive penetration — that any filmic version of the phenomenon collapses into
  either a lie (a false report rendered faithfully) or an altered world? If so, Rashomon
  would be a film about the impossibility of the very thing it is usually said to
  be about.


  End by telling me what the film contributes to the debate that the experimental
  literature cannot, and what the seminar should take away: whether Rashomon is best
  taught as evidence for penetration, as a dramatisation of the sceptic''s sorting
  problem, or as a demonstration that the distinction itself is harder to draw in
  lived life than in the laboratory.


