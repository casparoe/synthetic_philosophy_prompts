  Design a belief set with real tensions:

  1. When choosing with no probabilities, I''d use maximin (pick the option whose
  worst outcome is best).

  2. In Rawls''s original position, maximin is the right rule — pick society maximizing
  worst-off.

  3. I think it''s irrational to buy insurance at unfair odds (paying more than expected
  value) when I can estimate the odds roughly — i.e., expected value is right when
  probabilities exist.

  4. I think minimax regret is silly because it can make your choice depend on adding
  a new option you''d never pick (independence of irrelevant alternatives).

  5. Harsanyi''s point that without info you should just assign equal probabilities
  is wrong.


