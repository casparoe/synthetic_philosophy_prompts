  of each option — adding a new option doesn''t change rankings of existing ones...
  Actually maximin satisfies IIA in a sense. Minimax regret famously violates it.


  Real tension: maximin in Rawls vs. using expected value when probabilities exist
  — Rawls''s maximin is supposed to apply even though the original position has no
  probabilities; Harsanyi argues you should use expected utility with equal probabilities
  behind the veil, which yields average utilitarianism, conflicting with maximin''s
  difference principle. If asker accepts equal-probability reasoning is wrong (5)
  but accepts EV when probabilities exist (3), they need an account of when probabilities
  are "real" vs "ignorance" — tension between (2)/(5) and (3)? Not obvious contradiction.


  Better tension: maximin is inconsistent with minimax regret being silly — actually
  maximin and minimax regret coincide in certain cases; but the real issue: maximin
  violates IIA? Consider: options A (worst: 0), B (worst: 1). Maximin ranks B>A. Add
  option C with worst 0.5 — rankings unchanged. So maximin satisfies IIA over existing
  options. Regret violates it. So (4) dismissing regret while holding maximin is consistent
