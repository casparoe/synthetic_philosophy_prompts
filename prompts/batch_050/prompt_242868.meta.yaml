  such — not merely that they killed very many people; and it deliberately excludes
  political, economic, and social groups from the list, so a regime that murders millions
  of its own political opponents has committed crimes against humanity but not genocide.
  Courts, journalists, and governments all treat the word as carrying unique weight,
  to the point that states have hesitated to use it precisely because of what it would
  seem to demand of them.


