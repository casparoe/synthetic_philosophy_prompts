  I run operations for a regional pest-control company — about forty technicians,
  several thousand service visits a year, mix of restaurants, schools, warehouses,
  and homes. Our industry code of ethics says we should minimize animal suffering,
  but nobody has turned that into anything a technician can actually use on site.
  I want a decision procedure my techs can run in about five minutes when scoping
  a job, that takes the possibility of insect suffering seriously without demanding
  certainty about insect sentience.


  The procedure should be built from the considerations the ethics literature actually
  offers, translated into operational form: how to weight uncertain sentience under
  moral uncertainty (expected-disvalue reasoning rather than all-or-nothing verdicts);
  how control methods differ in the duration and intensity of the suffering they cause
  (instant mechanical kill, neurotoxic sprays, desiccant dusts, glue traps, slow starvation);
  and — this is the part I most want done carefully — the replacement effect: lethal
  removal opens niche space that conspecifics recolonize, so killing may reduce no
  suffering at all over a season, whereas exclusion, sanitation, and habitat modification
  change the equilibrium population. The procedure should say what questions the technician
  asks in order, what counts as a sufficient answer to each, at what point a method
  is simply ruled out regardless of client preference, and where it stops and hands
  the decision to a supervisor because the trade-off (say, insect suffering versus
  a child''s allergy or a restaurant''s health code) is a values call, not a technical
  one.


  Then run it on three cases: a German cockroach infestation in a restaurant kitchen,
  a wasp nest above a school playground entrance, and a warehouse client paying for
  a standing monthly preventive spray with no active infestation. At least one of
  these should come out in a way a conventional pest-control company won''t like —
  say so explicitly if none do. Close with what the procedure can''t settle: which
  numbers it can''t supply (sentience probabilities, exchange rates between insect
  suffering and human health) and how we should treat those gaps without letting them
  quietly decide everything.


