  1. In Newcomb''s problem I one-box, and my reason is evidential: my choice is reliable
  evidence about what the predictor already did, and I would rather have the news
  that the opaque box is full. I do not think my action causally reaches into the
  past.


  2. In the counterfactual mugging (Omega flips a fair coin; on heads it gives me
  a large sum conditional on its prediction that I would pay in the tails branch;
  on tails it simply asks me for a smaller sum, giving nothing in return), I pay when
  the coin comes up against me. The policy of paying is the one I would have wanted
  in place before the flip, and I see no reason the mere arrival of bad news should
  change the verdict.


  3. In XOR blackmail (the blackmailer sends a letter demanding money exactly when
  the truth of "my house has termites" and "I will pay" differ, having predicted my
  response), I do not pay. A policy of refusal means letters arrive only at infested
  houses, which makes the letter a useful warning and the racket unprofitable; a policy
  of paying only redirects the letters to the healthy houses and costs the payers.


  4. I think rational agency is dynamically consistent in the following sense: if
  the best policy to have in place before some chance event is φ, then it cannot become
  rationally required to deviate from φ merely upon learning how the event came out,
  when the event itself was indifferent to my choice of policy.


  5. I am an orthodox Bayesian about credence and hold that a rational act is one
  that maximizes expected utility relative to the agent''s credences at the moment
  of action, with evidential weight included and no mystical causal influence on the
  past required.


