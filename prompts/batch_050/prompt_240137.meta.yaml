  ---


  I''m a high school senior putting together a presentation on care ethics (the tradition
  associated with Carol Gilligan and Nel Noddings) for my philosophy club, and I want
  a custom-made test case for a claim I keep encountering: that care ethics is just
  "be nice to the people close to you" and so can never tell you to hold back when
  someone you love asks for help. I suspect the view has more resources than that.


  Construct a thought experiment meeting these specifications:


  1. Verdicts: an act utilitarian and a Kantian deontologist both conclude that the
  protagonist should provide the help being asked for; a care ethicist concludes that
  she should refuse. All three verdicts must actually follow from the theories, not
  be stipulated.

  2. Realism: the setting must be ordinary — a family, a friendship, or a school —
  with no trolleys, no life-or-death stakes, no emergencies, and payoffs (or stakes)
  an ordinary person could face.

  3. Length: the scenario itself should be a single paragraph.

  4. No smuggling: the care ethicist''s refusal must arise from recognizably care-ethical
  notions — the risk of entrenching dependency rather than responsiveness, stunting
  the cared-for''s own capacities, or hollowing out the relationship or the caregiver''s
  self — and not from secretly tallying harms to third parties. If third-party welfare
  does the work, the case fails.

  5. No cheap refusals: the help asked for must violate no duty (so the Kantian can''t
  get his verdict from a perfect duty like the prohibition on lying), and it must
  be clear that helping genuinely maximizes overall welfare, counting long-term effects
  (so the utilitarian can''t be answered with "but enabling is bad in the long run").

  6. Real cost: the person refused must be a specific, identifiable individual who
  is genuinely worse off as a result — the case shouldn''t dodge what the refusal
  costs.


  After the scenario, (a) walk through each theory''s verdict and the reasoning that
  produces it, (b) identify the single structural feature of the case that makes the
  care ethicist peel off from the other two, and say what happens to the verdicts
  if that feature is removed — does the case collapse into one where everyone agrees
  to help? and (c) give the strongest reply a utilitarian or Kantian defender would
  make against the case — for instance, that the care ethicist''s refusal is either
  covert long-run consequentialism (which specification 5 rules out) or a fetishizing
  of relationships at the expense of actual people — and assess how damaging that
  reply is.


  ---


