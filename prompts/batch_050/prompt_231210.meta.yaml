  I''m a software engineer with no formal philosophy training, but over the past year
  I''ve been reading the literature on higher-order evidence and epistemic akrasia,
  and I''ve also been running an informal reading group on it with a few colleagues.
  My interest isn''t idle: in my day job I build forecasting systems, and I keep hitting
  a concrete version of the problem. One of my models outputs a probability — say,
  80% chance a server fleet saturates within the hour — and a separate diagnostic
  tells me the model has been systematically overconfident on days resembling today.
  Should the system report 80% (the output of its best object-level computation) or
  a lower figure (deferring to the evidence about its own unreliability)? Either choice
  seems defensible, and the two seem to correspond to the two camps in the philosophy
  I''ve been reading: the "level-splitters," who think your belief can rationally
  diverge from what your evidence about your own reasoning suggests, and their opponents,
  who think rational belief must answer to your total evidence, higher-order evidence
  included, so that believing p while believing you shouldn''t believe p is never
  fully rational.


  What puzzles me is that this debate appears completely stalled. As far as I can
  tell, both sides have known all the cases for years — the impaired-reasoning cases,
  the misleading-evidence-about-your-own-track-record cases — and every argument has
  a standard reply. The level-splitters lean on cases where ignoring the object-level
  evidence feels absurd; their opponents lean on the incoherence of avowing an akratic
  state. Neither side has converted anyone.


  My tentative hypothesis is that the dispute isn''t really about which beliefs are
  rational. It''s that the two camps are using "rational" to do different jobs — one
  as a standard for the output of a reasoning process considered on its own, the other
  as a standard for the epistemic agent as a whole — and possibly also disagreeing,
  beneath that, about whether evidence about your own processing can even be weighed
  in the same units as object-level evidence. But I may be wrong; maybe there''s a
  real factual or formal disagreement I''ve missed.


  So: diagnose the impasse. Is this a verbal dispute about "rational," a substantive
  dispute about what evidence is, two different questions being answered under one
  heading, or bedrock clashing intuitions about particular cases? Give reasons grounded
  in what the two sides actually say rather than a survey of positions. And given
  your diagnosis, tell me what would count as progress — a distinction, a formal or
  probabilistic result, a new kind of case, a change of question — or make the case
  that no progress should be expected, and why. If my engineering framing imports
  assumptions that distort the philosophical debate, I''d like to know that too.


