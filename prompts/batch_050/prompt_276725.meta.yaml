  List of proposed solutions to Pascal''s mugging:

  1. Bounded utility functions — cap utility so huge promised payoffs don''t dominate.

  2. Probability threshold / ignoring sufficiently small probabilities (de minimis).

  3. Penalize probability by complexity of the scenario (e.g., Solomonoff-ish prior;
  mugging scenarios are complex so their prior probability is tiny, and it shrinks
  faster than utility grows — Bostrom''s idea that probability should decrease faster
  than utility increases).

  4. Diminishing/scope-insensitive? Actually same as bounded.

  5. Risk-weighted expected utility theory (Buchak) — rank-dependent weighting.

  6. Infinitesimal probabilities / lexicographic utilities.

  7. Decision-theoretic refusal: don''t reward agents who manipulate you via threats/promises
  (like refusing to negotiate with blackmailers); commitment strategies / updatelessness.

  8. Quantilization or median-based criteria.


