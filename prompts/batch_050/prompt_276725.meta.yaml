  ok so I''m a backend engineer, no philosophy training, but I keep bumping into this
  "Pascal''s mugging" thing (someone promises you an astronomically huge payoff for
  a small cost, the probability they can deliver is tiny but not zero, and naive expected
  value says take the deal). It''s been bugging me because it feels like the same
  failure mode as engineering decisions where you chase tail-risk upside and get rekt.


  Here are the fixes I''ve collected so far, mostly from blog posts and one long forum
  thread:


  1. Cap the utility function. If utility is bounded, then multiplying a bounded payoff
  by a tiny probability stays tiny, done.

  2. Just ignore probabilities below some threshold. If the chance is smaller than,
  say, one in 10^20, treat it as zero and move on.

  3. Complexity penalty: the probability you should assign to "this guy can actually
  deliver 10^50 utils" should shrink faster than the promised payoff grows, because
  claims about delivering more and more utility require more and more specific/complicated
  mechanisms, so the expectation never blows up. I think Bostrom wrote something along
  these lines.

  4. Weight the outcomes by how you''d feel about the risk, not just linearly — there''s
  a formal version of this where you rank outcomes from worst to best and overweight
  the bad end (I forget the name, rank-something expected utility).

  5. Refuse on strategic grounds: agents who let themselves be milked by unverifiable
  promises become targets for every manipulator, so a good decision policy just declines
  the whole category, the way you''d never negotiate with a ransomware guy even if
  paying might be cheap in isolation.


