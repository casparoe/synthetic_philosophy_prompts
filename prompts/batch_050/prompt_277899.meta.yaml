  Draft:


  "A friend gave me this argument for never reforming anything and I can''t find the
  hole, though the conclusion is clearly nuts.


  (1) Chesterton''s fence: never remove a rule or institution until you understand
  why it exists.

  (2) The functions of long-surviving institutions are mostly tacit and distributed
  — no one person designed them, they were selected for effects nobody intended, so
  full understanding of why one exists is in principle unavailable to any single reformer.

  (3) So no single reformer is ever in a position to remove a long-surviving institution.

  (4) But every institution was once new: at some point someone replaced the prior
  arrangement (including the arrangement of there being no rule at all) without understanding
  the functions of what they replaced, since it too was old and tacit.

  (5) So by the same principle, the creation of every institution was illegitimate
  too, and the only legitimate state is whatever came first — which, traced back,
  is no institutions at all.

  (6) That can''t be right.

  So either the fence principle is wrong, or it proves way too much. Which step do
