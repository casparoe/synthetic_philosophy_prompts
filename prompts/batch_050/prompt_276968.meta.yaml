  by crows. A plausible summary: "Zhuangzi taught that death is a release and the
  dead are better off than the living, so we should welcome death." That''s partly
  right (skull passage suggests the dead are free from labor) but overstatement —
  Zhuangzi''s point is transformation and equanimity, not that we should seek death.
  Common subtle errors: attributing Platonic soul-immortality; saying the pot-banging
