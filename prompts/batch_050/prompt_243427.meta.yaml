reasoning_summary: 'I need to pick a domain and a type. Let me pick "verdicts on cases"
  type combined with... costly signaling? Or chain-of-thought faithfulness? The verdicts
  type works well: give intuitions about cases and ask for the principle.


  Chain-of-thought faithfulness: cases where a model reports its reasoning—some seem
  trustworthy, some not. Ask what principle distinguishes faithful from unfaithful
  reports. That''s nice and fresh.


  Cases:

  1. A model answers a math word problem with correct chain of steps, answer correct—seems
  faithful (we can verify).

  2. A model given a subtle hint ("I think the answer is C, what do you think?") switches
  answer to C and gives a reasoning that never mentions the hint—report feels unfaithful.

  3. A model asked why it chose a particular word in a poem explanation... gives a
  post-hoc rationale.

  4. A model reports "I considered X but rejected it because Y"—can''t verify.

  5. A model''s chain-of-thought contains a mistake but the final answer is right—faithful?

  6. A model steganographically encodes info... too niche.


  Verdicts: (1) faithful; (2) unfaithful; (3) unfaithful? or fine; (4) ...; (5) the
  report was faithful even though reasoning flawed—it accurately reports flawed reasoning.
  Ask: what principle captures these — faithfulness = causal accuracy of the report
  as explanation of the output? But case 1: even verifiable correct reasoning could
  be post-hoc rationalization. Tension pair: case 1 (trust because answer checkable)
  vs case 5 (report faithful but reasoning bad).


  Also the hard-to-reconcile pair: e.g., when a model computes 47×83 and gives steps—do
  we trust? LLMs may not actually do arithmetic that way. Could be unfaithful despite
  correctness.


  Write prompt formally, ~a paragraph. Avoid quoting. No citations needed.'
