  Fitch''s paradox specifics: The paradox: from the knowability principle (every truth
  is knowable: p → ◇Kp) one can derive that every truth is known (p → Kp). Key components:
  distribution of K over conjunction (K(p∧q) → Kp ∧ Kq), factivity of K (Kp → p),
  contradiction handling, and the key step: consider the unknown truth "p and p is
  not known" (the Moore-like sentence). Supposing it''s known yields K(p ∧ ¬Kp) →
  Kp ∧ K¬Kp → Kp ∧ ¬Kp, contradiction. So ¬K(p ∧ ¬Kp), hence it''s an unknowable truth.
  Then by contraposition of the knowability principle... actually the derivation:
  assume all truths are knowable; the conjunction p∧¬Kp is a truth in some scenario;
  its knowability gives ◇K(p∧¬Kp), but that''s impossible, so it can''t be true —
  deriving that if p then Kp.


  Common misconceptions: (1) The paradox shows omniscience is impossible — no, it
  shows knowability of all truths collapses into all truths being known; one can be
  a fallibilist. (2) It''s a proof that there are unknowable truths full stop — actually
  it''s a reductio of the knowability principle in classical logic; intuitionists...
  actually in intuitionistic logic you get that not all truths are knowable implies
  not all truths are... hmm, the derivation is mostly intuitionistically valid except
  the final step. (3) Confusing "knowable" with "known" — the anti-realist premise.
  (4) Thinking the problem is self-reference like the Liar — it''s not self-referential
