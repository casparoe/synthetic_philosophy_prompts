reasoning_summary: 'Let me pick a domain and type. "Van Fraassen''s Reflection principle"
  combined with "argument that proves too much" seems great. Reflection: an agent
  should adopt as current credence a value r that equals their credence conditional
  on their future credence being r — P(p | P_t(p) = r) = r, roughly. Classic objections:
  Dutch books, memory loss (Sleeping Beauty-ish), Ulysses and the sirens, etc. Constructing
  an argument that seems to prove too much from Reflection: e.g., reflection implies
  you can never rationally plan to change your mind... Argument: if you foresee that
  tomorrow your credence in p will drop, Reflection demands it already drop now; iterate
  and your credences can never rationally change; but they do change with evidence;
  so Reflection is false / evidence is impossible. Something with subtle flaw: Reflection
  requires conditionalizing on learning only your future credence and nothing else;
  in evidence cases you learn the evidence, not just the credence.


  Or "proves too much": from Reflection derive that no rational person can anticipate
  being more confident tomorrow, hence testimony/experience can''t change credences,
  absurd. Where does it go wrong: reflection is only required when the future credence
  change isn''t driven by new evidence—actually Reflection holds even with evidence
  because conditional on knowing future credence you should adopt it now (if you know
  only that). The failure mode is when you''d have evidence now that your future self
  is irrational (drugs, memory loss). Also self-locating issues.


  Write a casual prompt with numbered premises. No quotes needed. Keep short. No need
  for web search.


