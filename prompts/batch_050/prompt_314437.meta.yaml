  "I got walked into this by a philosophy PhD friend and I want the exit. Reflection
  principle (van Fraassen): ... (1) If you know right now that your rational credence
  in p tomorrow will be 0.3, then your credence today should be 0.3. (2) A rational
  agent''s credences respond only to evidence. (3) New evidence can make your credence
  go up or down, but you can''t know in advance which... " hmm.


  Better: build the argument that reflection forbids ever expecting to learn:


  (1) Reflection: if I''d be rational to have credence r in p tomorrow, and I know
  that now, my credence in p now should be r.

  (2) Whatever evidence I get tomorrow, I can in principle describe it now ("I''ll
  see the die land 4").

  (3) So before getting the evidence, I already know what my tomorrow-credence will
  be conditional on that evidence... hmm, that''s just conditionalization.


  Classic prove-too-much: Reflection + "your future self will update on evidence"
  implies current credence = expected future credence (martingale), which is actually
  a theorem for conditionalizers. But then argue: trust in my future rationality means
  I should pre-adopt whatever I''d conclude — so deliberation is pointless; e.g.,
  before doing the math proof, if I trust future-me who checked it, I should already
  be certain now. Conclusion: rational agents never need to actually check proofs
  / run experiments. That''s absurd. Where''s the flaw: logical omniscience / the
  fact that tomorrow-me''s higher credence rests on computation I haven''t done; knowing
  "future me will be at 0.99" without doing the work — reflection would demand 0.99
  now, and actually that may be fine for ideal agents; the flaw is assuming I can
  know my future credence without the computation... Actually for ideal reasoners
  reflection on logical truths is problematic (reflection conflicts with logical non-omniscience).
  Good meaty question.


  Alternative: the Ulysses case — knowing you''ll be irrational later. Argument: (1)
  Reflection. (2) I''ll take a drug that makes me believe I''m Napoleon. (3) I know
  now my future credence... Reflection''s condition is "your future credence" regardless
  of rationality? Van Fraassen''s reflection: P_a(p | P_{a,t}(p) = r) = r where future
  credence could be irrational. So reflection would demand I now believe I''ll be
  Napoleon? That proves too much. Where does it go wrong: reflection is a requirement
  only given that the agent regards future self as at least as reliable; or the principle
  is a coherence constraint that fails when future changes are known to be non-evidential.


