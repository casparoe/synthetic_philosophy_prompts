  I''m writing a piece of film criticism and want a philosophically serious reading
  to build on. Read Spike Jonze''s Being John Malkovich through Daniel Dennett''s
  essay "Where Am I?", in which Dennett imagines his brain removed and kept alive
  in a laboratory vat while his body, radio-linked to the brain, wanders about — and
  imagines later that the brain can be replaced, at the flick of a switch, by a computer
  duplicate of it, with no difference he can detect from the inside. The film literalises
  much of this apparatus: a portal behind a filing cabinet deposits the visitor inside
  John Malkovich''s head for roughly fifteen minutes, seeing through his eyes, before
  ejecting him beside the New Jersey Turnpike, while the visitor''s own body slumps,
  vacant, on the office floor. Dennett''s moral, as I read him, is that "Where am
  I?" has no tidy answer — neither the brain, nor the body, nor the point of view
  will serve as the self''s address — and I''d like the reading to test that moral
  against the film.


  In particular, the film seems to me to distinguish four modes of occupation that
  Dennett''s thought experiment runs together: visiting (the fifteen-minute rides,
  where the occupant is a passenger with a point of view but no control), puppeteering
  (Craig''s learned control of Malkovich''s body, where control is achieved but the
  occupant remains, so to speak, a parasite), residence (Lester''s collective plan
  to ride the "vessel" into immortality), and entrapment (the ending, where Craig
  is stuck inside Emily, seeing but never driving). I''d like the essay to ask whether
  Dennett''s apparatus can even register these distinctions — whether his framework
  has the resources to say what goes wrong, morally and metaphysically, when control
  is achieved without ownership — and where the film gets the philosophy wrong, e.g.,
  in treating a person''s head as a location one can be in. Two scenes I especially
  want pressed: Lotte''s single ride, after which she says she should have been a
  man — does the film think point of view is gendered, and what would Dennett say?
  — and the moment Malkovich himself goes through his own portal. Please reach a verdict:
  does the film vindicate Dennett''s conclusion that the self is not the sort of thing
  with a location, or does it quietly rely on a more old-fashioned, occupant-and-vehicle
  picture of persons that Dennett was trying to demolish?


