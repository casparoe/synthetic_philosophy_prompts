  (1) Any legitimate self-governing association gets to decide its own membership:
  churches choose congregants, clubs choose members, marriages... well, nobody can
  force you to marry them.

  (2) A state is, in the morally relevant sense, just a big self-governing association
  of its citizens — scale changes nothing fundamental.

  (3) So citizens, acting through their state, may refuse membership to outsiders
  — some level of border exclusion is justified in principle.

  (4) But membership control isn''t membership control unless it''s discretionary:
  a club that can only exclude people for reasons a court approves of doesn''t really
  control its membership. So the association may pick its own criteria.

  (5) So a state could exclude would-be immigrants for being of the wrong religion,
  the wrong politics, the wrong ethnicity, or just because current citizens find them
  annoying.

  (6) A religious-test immigration policy (say, a flat ban on Muslim immigration)
  is morally grotesque, not just inadvisable.

  (7) So the associationist premise that got us here must go: either (1) or (2), and
  with it the whole "freedom of association justifies border control" line.


