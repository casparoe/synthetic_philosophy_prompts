  apply at town level — a town of 800 people in rural Nebraska could vote to keep
  out anyone who isn''t, say, Baptist, the same way a small religious commune can.
  And conversely, if the state is a club, clubs can also expel members, so denaturalizing
  citizens whose views the majority dislikes should be fine too. He says any defense
