  or reliabilist stance).

  2. Goodman''s grue shows that not all predicates are projectible — the problem is
  picking out which predicates are kosher; grue is gerrymandered because it''s defined
  in terms of a time t.

  3. Emeralds being green is confirmed by observing green emeralds; but also "all
  emeralds are grue" is confirmed by the same observations.

  4. Simplicity: the green hypothesis is simpler than grue, and simpler hypotheses
  should be preferred — this justifies projecting green.

  5. Also: I think confirmation is purely a matter of logical relations between evidence
  and hypothesis (e.g., Hempel''s satisfaction criterion).


  Tensions:

  - Tension A: 2''s claim that grue is bad because defined with reference to a time
  t conflicts with Goodman''s point about entrenched predicates and language-dependence:
  "green" can be defined in terms of "grue" and "bleen" symmetrically. So saying grue
  is gerrymandered because it''s time-indexed assumes green as primitive — circular.
  If the person also holds (1) that there''s no non-circular justification, they should
  be suspicious of this move. That''s a genuine tension: the stated reason for rejecting
  grue is language-relative, which undermines the idea that the grue problem is solved
  by predicate gerrymandering — it becomes the "new riddle of induction."

  - Tension B: 4 (simplicity preference justifies projection) vs 1 (no non-circular
  justification of induction): preferring simplicity is itself an inductive policy
  that can''t be justified non-circularly; also defining "simpler" requires a language/measure,
  same problem. If they hold both that induction is unjustifiable and that simplicity
  solves grue, that''s in tension — they need to say the simplicity preference is
  itself unjustified but rational, or give up one.

  - Tension C: 5 (confirmation is purely logical, Hempel) vs the solution to grue:
  grue''s whole point is that purely syntactic/logical confirmation criteria can''t
