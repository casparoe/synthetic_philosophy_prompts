reasoning_summary: "Let me pick a domain and type. Options:\n\n1. Extended mind thesis\n\
  2. BCI, mental privacy, cognitive liberty\n3. Aumann's agreement theorem\n4. Obfuscated\
  \ arguments and limits of AI safety via debate\n5. Wavefunction realism (psi-ontic\
  \ vs psi-epistemic)\n\nTypes: desiderata, make an argument, slogan precisification.\n\
  \nI want something that injects a new/niche idea so models can't regurgitate. Let\
  \ me think.\n\nSlogan type + extended mind: \"the mind extends into the world\"\
  \ — but that's just regurgitating Clark & Chalmers. Maybe a slogan type on psi:\
  \ \"the wavefunction is just our information\" — ask what precise claims that could\
  \ be making. That's decent: psi-epistemic readings range from trivial (we update\
  \ beliefs on measurement) to radical (QBism). But quite standard.\n\nSlogan type\
  \ + Aumann: \"we can't agree to disagree\" — precisify. That's a common slogan.\
  \ Distinct readings: with common priors and common knowledge of posteriors, posteriors\
  \ must agree (Aumann); but the slogan is used loosely in disagreements about politics\
  \ etc. Could ask which readings support telling someone they must update. That's\
  \ nice and somewhat fresh because the slogan gets used casually.\n\nBut maybe desiderata\
  \ type offers more novelty. Desiderata for a theory of mental privacy/cognitive\
  \ liberty in the BCI context — that's a genuinely under-theorized area, no canonical\
  \ list exists, so a model can't regurgitate. I can inject a niche scenario: e.g.,\
  \ a consumer EEG device used by an employer, \"neural data\" sold to advertisers,\
  \ etc. Write desiderata for an adequate account of what mental privacy protects,\
  \ given BCIs. Cases: skull-based privacy vs. inferential privacy; the difference\
  \ between reading raw neural data and inferring mental states from behavior (which\
  \ we've always done); whether cognitive liberty includes a right to *use* enhancement\
  \ BCIs; whether decoded-but-not-consciously-accessed states count as \"the mind\"\
  ; etc.\n\nThat's a good combo: the domain is hot but mostly discussed at policy\
  \ level; asking for desiderata of a theory forces conceptual work. And I can inject\
  \ novel-ish cases to prevent regurgitation.\n\nAlternatively, desiderata for psi-ontology:\
  \ \"what must a theory of the wavefunction's status deliver\" — must handle PBR\
  \ theorem, the measurement problem, explain why psi appears to collapse, account\
  \ for interference, be consistent with relativity, etc. That's doable but fairly\
  \ standard in the literature (there are actual \"desiderata for psi-epistemic models\"\
  \ discussions). The BCI one is fresher.\n\nAlternatively \"make an argument\": argue\
  \ that Aumann's theorem doesn't apply to... hmm, examples given are similar in flavor.\n\
  \nI'll go with: domain = BCI/mental privacy/cognitive liberty, type = desiderata.\n\
  \nDesign the prompt: casual, a few sentences, inject novel cases. Avoid niche theory\
  \ names. Avoid quotes. No citations needed.\n\nKey tension to build in: the old\
  \ worry — we can always infer mental states from behavior, speech, lies detectors...\
  \ so what's new about BCIs? A good theory must say what, if anything, distinguishes\
  \ \"reading the mind\" via neural data from ordinary inference from behavior — or\
  \ bite the bullet that there's no principled difference. Also must handle: data\
  \ decoded from brain states the person isn't aware of (subliminal preferences, unconscious\
  \ biases); data that requires the person's cooperation vs not; mental privacy vs\
  \ mental integrity (writing into the brain vs reading); cognitive liberty's two\
  \ directions (right not to have your mind accessed/altered, and right to alter your\
  \ own mind — e.g., does it protect using cognitive enhancers or connecting to BCIs\
  \ voluntarily, against employers/states banning it?). Which desiderata can't be\
  \ jointly satisfied: e.g., \"privacy protects only information the subject could\
  \ in principle keep to themselves\" vs \"protect unconscious/decoded states\" might\
  \ conflict; or \"mental privacy is just a special case of general data privacy\"\
  \ vs \"neural data is special\".\n\nNovel cases to inject: \n- An insurance company\
  \ offering discounts for wearing a sleep-monitoring headband that infers stress/attention\
  \ patterns.\n- A courtroom using memory-detection (P300-based \"guilty knowledge\"\
  \ tests) — this is real (brain fingerprinting) but describable without names.\n\
  - A device that doesn't read anything the person couldn't reveal, but aggregates\
  \ data across a population to infer things about non-users (\"neural herd inference\"\
  ) — that's a nice novel twist: privacy theories usually individual-centric.\n- Consumer\
  \ game headset that passively calibrates by detecting your intentions a few hundred\
  \ ms before you're aware of them (readiness potential-ish) — injects Libet-style\
  \ twist without needing names.\n\nPrompt should be casual, with a typo or two allowed.\
  \ Keep short-ish.\n\nDraft:\n\n\"I'm trying to write a grant proposal on 'mental\
  \ privacy' and keep hitting a wall: every account I sketch either rules in too much\
  \ (if inferring my mood from my face already counts as mind-reading, the concept\
