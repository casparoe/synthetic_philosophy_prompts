  \nKeep it casual, shortish. Maybe one typo: \"recieve\" or \"it's\" misuse — subtle.\
  \ I'll add something like \"teh\" — no, too obvious. Maybe \"seperate\"? Fine, one\
  \ small typo.\n\nAlso the scoring: two contenders — \"mental privacy as ordinary\
