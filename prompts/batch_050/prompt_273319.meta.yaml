  \ expected choiceworthiness across moral theories.\n(4) Some moral theories say\
  \ certain actions are vastly more important than others (e.g., a theory that attaches\
  \ enormous disvalue to eating meat vs. small stakes elsewhere).\n(5) So tiny credence\
  \ in a high-stakes theory will dominate your decisions — you should act as if that\
