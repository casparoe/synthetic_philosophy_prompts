  \ seems to show moral uncertainty always resolves in favor of the status quo / inaction:\n\
  \n(1) When you're empirically uncertain whether an act will cause harm, the mere\
  \ risk of harm can make acting wrong (you shouldn't play Russian roulette).\n(2)\
  \ Moral uncertainty is relevantly analogous: if some substantial-credence theory\
  \ says acting is gravely wrong, acting carries a risk of grave moral wrongdoing.\n\
  (3) The risk of grave moral wrongdoing makes acting wrong, absent countervailing\
  \ risk from inaction.\n(4) But inaction isn't condemned by the theory in question\
  \ (omission vs. commission).\n(5) So whenever any theory you give substantial credence\
