  The teaching-plan type asks: order of ideas, carrying example, misconceptions to
  expect. A good combo: sweatshops and mutually beneficial exploitation — teaching
  the concept of mutually beneficial exploitation (Wertheimer''s) to, say, undergraduates.
  Misconceptions: "if both benefit, it can''t be exploitation"; "exploitation just
  means paying too little"; confusing exploitation with coercion or with harm. The
  carrying example: needs to be one where both parties gain relative to baseline yet
  we feel something is wrong — the classic is a case where no better alternative was
  available and the exploiter didn''t create the desperation. Sweatshop case works
  but to avoid regurgitation maybe use a constructed example. The teaching plan would
  need: consent vs. exploitation distinction, baseline question (non-worseness claim),
  the wrongness despite mutual benefit.


  Alternatively psi-ontic vs psi-epistemic for a physics reading group — misconceptions:
  psi-epistemic = wavefunction just incomplete information like classical probability
  (PBR theorem tension), psi-ontic = wavefunction is literally a field in space. Carrying
  example: two overlapping quantum states with overlapping probability distributions
  (PBR-style setup). That''s a bit technical but teachable. Could be good but riskier.


  Brandom inferentialism for a reading group: meaning as inferential role; misconceptions:
  "so meaning is just use / anything goes"; "truth drops out"; carrying example: teaching
  a word like a scorekeeping example — "That is red" commitments/entitlements. Brandom''s
  scorekeeping: assertion as undertaking commitment, challenge as demanding entitlement.
  That''s quite teachable and in-the-weeds.


