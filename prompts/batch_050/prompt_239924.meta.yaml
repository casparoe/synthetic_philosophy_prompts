  disagreement works well. The asker is a journalist who covers science and ideas,
  formal/polished, elaborate (1–3 paragraphs), includes epistemic request (what would
  change its mind), and structured data request (JSON or table with schema).


  Let me construct a disagreement between two people (not the asker) about the Principal
  Principle. Inject niche ideas: e.g., underminers, chance 0/1 events and regularity,
  self-undermining chances, conditionalization on admissible evidence, crystal-ball
  cases (David Lewis''s undermining futures), Miller''s Principle, the ratio formula.


  Scenario: two philosophers or scientists the journalist interviewed. E.g., a dispute
  about whether you should defer to chances when you have "inadmissible" information
  — e.g., an oracle tells you the actual outcome. Classic case: the chance of an event
  is 0.5 but a time traveler/oracle tells you it happens. Lewis says admissible evidence
  is everything except information about how the event turns out. Dispute could be:
  A says the Principal Principle says credence should equal chance no matter what;
  B says deferring when you know the outcome is absurd, so the principle must be restricted
  to admissible evidence. Then A argues that if you genuinely know the outcome, then
  the chance claim itself must be rejected (chances about the past are 0 or 1)...
  That''s a decent back-and-forth.


  Also could inject the case of self-undermining chances: the chance setup says chance
  of rain tomorrow is 0.9 but also says chance that chance of rain is 0.9 given...
  hmm, undermining: the present chance distribution assigns positive probability to
  a future in which the chance distribution is different (e.g., decaying uranium).
  Lewis''s Principal Principle handles this via admissibility; the "New Principle"
  (Hall) handles underminers. A small LLM might not know the New Principle, but the
  prompt can inject it: describe the puzzle without naming, or name it briefly since
  it''s fairly known in phil probability literature. The instructions say inject niche
  ideas into the prompt itself so models don''t need obscure memorized knowledge.


  Let me draft: a journalist covering a conference on the foundations of probability
  overheard/took part in a dispute between a statistician and a philosopher (or two
  philosophers). Moves:


  (1) Ada: the Principal Principle — credence should match known objective chance
  — is near-unassailable; if you know a fair die has chance 1/6 of six, credence 1/6,
  anything else is Dutch-bookable / irrational.


  (2) Ben: counterexample — a trustworthy oracle (or time traveler) tells you the
  die lands six. Now your credence should be ~1, while chance remains 1/6. So the
  principle fails without restriction.


  (3) Ada: that doesn''t refute the principle; it shows your information isn''t "admissible."
  Information about the outcome itself trumps chance. The principle was always restricted:
  credence equals chance conditional on admissible evidence. Also, if the outcome
  is truly settled (past event), the chance is 0 or 1 — so in genuine knowledge-of-outcome
  cases, chances become trivial.


  (4) Ben: two problems. First, "admissible" is defined circularly as "whatever evidence
  the principle works for" — no independent characterization. Second, undermining:
  the chance process itself tells you chances will change (e.g., a radioactive atom''s
  decay means future chance of decay differs from now). The present chance distribution
  itself says current chances will become misleading; so even chance-theoretic info
  alone breaks naive deference, and the fix (something like: defer to chance conditional
  on the total chance theory — Hall''s New Principle) changes what the principle says.


  (5) Ada could respond that these are edge cases; for practical science the principle
  works.


  Ask: adjudicate move by move, who''s right overall, what both miss. Epistemic: state
