  Let me draft the summary in the voice of a popularizer:


  "A science writer I like explains Penrose''s argument like this: ''Gödel proved
  that for any formal system powerful enough to do arithmetic, there are true statements
  it can''t prove. A computer is just a formal system following rules, so there will
  always be truths it can never establish. But any human mathematician can look at
  the Gödel sentence and see that it''s true — we just grasp it directly. So the human
  mind can do something no computer can: it must be doing something beyond rule-following,
  which is why Penrose says consciousness needs new physics.''"


  Subtle issues to embed:

  1. "A computer is just a formal system" — conflation; computers aren''t exactly
  formal systems in the relevant sense, and the argument requires that the machine''s
  behavior corresponds to a consistent formal system.

  2. "any human mathematician can look at the Gödel sentence and see it''s true" —
  only if the system is consistent (or ω-consistent); the human only "sees" it conditional
  on believing consistency. This is the key move: seeing G''s truth presupposes assuming
  the system''s consistency.

  3. Gödel proved incompleteness for consistent systems; summary omits consistency
  caveat.

  4. Also could mention the second incompleteness theorem being the relevant one for
  self-knowledge of consistency; the summary conflates first and second theorem.

  5. Overstatement: "Gödel proved minds aren''t machines" — Gödel himself only drew
  a disjunctive conclusion.

  6. "we grasp it directly" — humans can be inconsistent, can be wrong; an inconsistent
  machine "proves" everything.


  Also the asker can mention being inclined to think it''s fishy because of the halting
  problem / Rice''s theorem vibes: any sufficiently powerful computation system has
  limitations, but that doesn''t single out minds vs machines.


