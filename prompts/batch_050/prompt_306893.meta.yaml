  "Gödel showed that any formal system rich enough to do arithmetic contains true
  statements it cannot prove. A computer program is a formal system: it''s just a
  fixed set of rules applied to symbols. So for any computer, there are mathematical
  truths it can never establish, no matter how long it runs or how much memory we
  give it. Human mathematicians, by contrast, can simply look at the Gödel sentence
  of a system and see that it must be true — we understand what it says, and that
  understanding tells us it''s true even though the system itself can''t prove it.
  Since we can know truths that no rule-following machine can know, the mind cannot
  be a computer running a program. Something non-computational must be going on in
  the brain."


  Something about this smells off to me but I can''t put my finger on where. Like,
