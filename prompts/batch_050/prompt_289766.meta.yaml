  Nuclear deterrence cases: asker gives gut verdicts on various threat cases — e.g.,
  deterrence threat with massive retaliation vs. proportional; threat you''d be irrational
  to carry out; self-binding (doomsday device); brinkmanship (threat that leaves something
  to chance); tripwire; bluffing. Verdicts mostly sensible with hard-to-reconcile
  pair. Then ask what principle captures them, and format: a table after prose, with
  columns.


