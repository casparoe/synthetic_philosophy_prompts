  Draft cases:

  1. Threatening massive nuclear retaliation if the other side invades an ally — fine,
  it worked (deterrence).

  2. Actually carrying out that retaliation after the invasion fails — monstrous,
  pointless.

  3. A doomsday device that auto-fires — feels wrong even though perfectly credible.

  4. Brinkmanship: escalating a crisis where things could spiral by accident — feels
  more acceptable than the doomsday device though both involve risk of disaster.

  5. Bluffing: threatening retaliation with no intention — feels fine? or fine but
  risky.

  6. Threatening first use in response to a conventional attack on homeland — feels...
  maybe acceptable.

  7. A threat against an enemy''s civilians explicitly as hostages ("countervalue
  targeting") — feels worse than threatening their military even if same deterrent
  effect.


  Hard to reconcile: 2 vs 1 (if carrying out is wrong, is the threat wrong?), 3 vs
  4.


  Ask: principle capturing these, verdict on a new case (e.g., a leader who delegates
  launch authority to a subordinate known to be vengeful, so threat is credible —
  like a "madman" case).


  Format request: table with columns: case name, my verdict, does your principle agree
