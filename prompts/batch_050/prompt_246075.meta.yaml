  Let me pick the dream analogy vs rope-snake. The rope-snake is used to explain māyā:
  world superimposed on Brahman as snake on rope. Common use: Advaita teachers say
  "the world is like the snake seen on the rope: it''s not real, it''s a projection
  of ignorance, and when you know the rope, the snake vanishes." Used to license:
  "the world is an illusion; nothing you do matters ultimately; your suffering is
  as unreal as the snake." The audit: correspondence table: rope ↔ Brahman/Atman,
  snake ↔ world of plurality, dim light ↔ maya/avidya, fear ↔ samsara/bondage, seeing
  the rope in daylight ↔ jnana/liberation. Breaks: (1) the snake is corrected by a
  subsequent perception of the same kind (empirical), but Brahman-knowledge isn''t
  an empirical perception among others — so the analogy can''t show how the correction
  is possible; (2) the snake is purely private (pratibhasika), but the world is shared
  and law-governed — Advaitins themselves distinguish these (the snake is pratibhasika-satta,
  the world vyavaharika), so if pressed, the analogy overclaims: world isn''t as unreal
  as the snake, and the tradition knows it; (3) the rope-snake error is caused by
  bad lighting, an external condition, while avidya is beginningless and not a perceptual
  condition; (4) the seer and rope are distinct, but Atman = Brahman, so the witness
  isn''t separate from the rope — the analogy has a knower outside it, Brahman-realization
  has no knower-object structure. What it smuggles: that illusion is simple nonexistence
  (like horns of hare) — but Advaita says mithya, neither sat nor asat. Whether the
  "world is an illusion, nothing matters" conclusion survives: no — the tradition
  itself distinguishes; ethics/action remains at vyavaharika level; also the analogy
  supports "sublatable" not "nonexistent."


