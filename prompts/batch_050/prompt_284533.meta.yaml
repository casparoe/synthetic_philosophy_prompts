  Let me design the argument. A friend argues:


  (1) A rational agent acts on the best information available.

  (2) Ulysses, at the time of ordering his sailors to bind him, knew he would later
  want to be released, and knew that want would be caused by the sirens'' song — i.e.,
  he had strictly more information about his future desires than his future self would
  have about their origin.

  (3) So when the later self asks to be released, the earlier decision is made with
  better information and should control.

  (4) What holds for Ulysses holds generally: whenever you can anticipate a future
  desire and judge it corrupted in advance, your earlier decision should bind your
  later self.

  (5) But everyone''s preferences change over time, and at any earlier moment you
  can describe your future preference changes as distortions (aging, habituation,
  addiction, mere drift).

  (6) So a rational person should bind themselves now against all future preference
  changes — never change your mind about career, partner, political views, etc.

  (7) That''s absurd — it''s a rational requirement never to update.

  (8) So something''s wrong: either precommitment is never rational, or...


  Where''s the flaw? Steps: (3) equivocates: better information about the cause of
  a desire doesn''t entail better judgment about what to do; also "should control"
  conflates epistemic deference with practical authority. (5) slides: anticipation
  of a specific corrupted desire (sirens) vs. redescribing any change as corruption
  — the earlier self in Ulysses''s case has a specific, evidence-based account of
  why the future desire will be misleading; in (5) you merely have a generic possibility,
  and treating generic possibility as knowledge begs the question. Also (4)-(6) ignores
  asymmetry: Ulysses''s later self''s information is worse in a known way; in normal
  life later selves often have more information.


