  \ within the organism, at the expense of the individual.\n- Endosymbionts like Buchnera\
  \ in aphids: is the unit the holobiont?\n- Sterile worker castes: adaptations manifest\
  \ at colony level.\n- T-helper... hmm.\n\nA professor's verdicts could be: segregation\
  \ distorter — selection at the gene level, yes a unit of selection; cancer cell\
