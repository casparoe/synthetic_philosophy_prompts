reasoning_summary: 'I need to write a prompt of type "present an argument that seems
  to prove too much and ask where it goes wrong" on one of the domains. Let''s pick
  Grice on implicature and speaker meaning — good for constructing a numbered argument
  with a subtle flaw.


  Idea: An argument that implicature collapses into literal meaning / speaker meaning,
  or that everything said is implicated, so semantics is empty. Or: an argument proving
  that every utterance means whatever the speaker intends, so "grass is green" could
  mean snow is white — proving too much about speaker meaning.


  Construct: (1) Meaning is what the speaker intends the audience to recognize (Gricean
  speaker meaning via reflexive intentions). (2) Intentions are entirely in the speaker''s
  head. (3) So whatever a speaker intends, that''s what the utterance means. (4) A
  speaker could utter "Grass is green" intending the audience to believe snow is white.
  (5) So "Grass is green" can mean snow is white. (6) But that''s absurd — sentence
  meaning constrains speaker meaning. Conclusion: Grice''s account proves too much
  / words mean whatever we want (Humpty Dumpty). Ask where it goes wrong: the flaw
  is that Gricean intentions must be overt and intended to be recognized, and the
  audience must be able to recognize them; an intention the audience couldn''t possibly
  recover from the words plus context fails to constitute speaker meaning. Also the
  m-intention structure: speaker must intend the audience to think the speaker intends
  it. The "cost" discussion: rejecting (2) means meaning depends on conventions; keeping
  a pure intention theory invites the Humpty Dumpty problem; Schiffer/Neale points;
  also distinction between "means" in speaker-meaning vs timeless meaning.


  Alternatively is-ought: an argument that the is-ought gap proves too much — e.g.,
  no "is" conclusions at all can be drawn from "is" premises, undermining all inference;
  or that the gap makes all moral discourse meaningless. Construct: (1) No ought from
  is (Hume). (2) Moral judgments are oughts... The argument could prove that normative
  claims can never be supported by evidence, including claims about what we ought
  to believe — so epistemic norms too, self-undermining. That''s nice: the is-ought
  gap applies to epistemic oughts, so the very reasons for accepting the gap can''t
  normatively guide belief. "Proves too much" — it dissolves all normativity, making
  the argument itself one we "ought not" to be moved by.


  But Grice is richer for a numbered argument with equivocation. Let''s build the
  Grice one carefully.


  Argument (Humpty Dumpty collapse):


  (1) What a speaker means by an utterance is constituted by her communicative intention:
  roughly, she means that p iff she utters intending her audience to come to believe
  p (or to think she believes p) by recognizing that very intention.

  (2) Intentions are facts about the speaker''s mind; they don''t depend on the conventional
  meanings of the words used.

  (3) Therefore what a speaker means on an occasion depends only on her intentions,
  not on what her words conventionally mean.

  (4) A speaker can intend to get her audience to believe anything on any occasion
  — e.g., utter "Grass is green" while intending her audience to recognize that she
  intends them to believe snow is white.

  (5) So by (1)–(3), on such an occasion "Grass is green" means that snow is white.

  (6) Generalizing: any sentence can be used to mean anything; conventional meaning
  imposes no constraint on speaker meaning.

  (7) But if any sentence could mean anything, communication as we know it would be
  impossible, and the distinction between what a speaker means and what her words
  mean would vanish — an absurd result. So the Gricean account of speaker meaning
  proves too much and must be rejected.


  Where''s the flaw? Step (4): an intention to have one''s intention recognized is
  not something a speaker can just have at will if she knows the audience cannot possibly
  recognize it. Grice''s intention is reflexive/overt — the speaker must intend the
  audience to believe p partly by recognizing the intention; a speaker who knows her
  audience has no route from "grass is green" to snow-is-white cannot rationally (or
  perhaps even genuinely) intend that recognition. So (4) smuggles in a possibility
  premise: "can intend" is ambiguous between "can want/aim" and "can genuinely hold
  the communicative intention given its success conditions." Also conflation: even
  if the speaker means snow is white, that doesn''t make the sentence mean that —
  speaker meaning vs. sentence meaning. Actually step (5)''s phrasing "means that"
  should be restricted to speaker''s occasion-meaning, and the absurdity in (6)-(7)
  trades on sliding to timeless meaning. Also there''s the "deception vs. meaning"
  issue.


  Also cost analysis: reject (1) — give up the intention-based analysis (Searle, convention-based
  accounts); reject (4) — restrict admissible intentions (Grice himself via "not to
  be expected to be recognized as" conditions? Grice added clauses excluding deceptive
  intentions; Strawson''s third clause). Keep formal, PhD student perspective, American
  English requested.


