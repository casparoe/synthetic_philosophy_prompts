  Type: interview questions for a guest. Guest: Ibn Rushd (named historical figure
  — allowed). Domain: harmony of religion and philosophy. The asker runs a podcast/colloquium
  series. Build around the passage: have the asker paste the passage and ask that
  several questions turn on it.


  Content of questions (8-10, with follow-ups keyed to likely answers):

  - The conditional structure of the passage: the license for philosophy is conditional
  on philosophy being teleological study. Follow-up: if a natural philosopher studies
  beings without treating them as indications of the Artisan, has he lost the Law''s
  license? Is the harmony achieved by defining philosophy theologically?

  - "Obligatory or recommended" — but to whom? He later restricts demonstration to
  a class of people. Is philosophy obligatory for everyone or only for those capable
  of demonstration? If only the demonstrative class, the Law commands something most
  people cannot do — how is that just?

  - The double-truth accusation (later Latin Averroism): does he hold two truths or
