  Superrationality thought experiment: Hofstadter''s superrationality. Construct a
  game where superrationality and standard game theory diverge, but with a twist harder
  than prisoner''s dilemma — e.g., where superrationality recommends an action that
  looks crazy, or where symmetric reasoning is undermined. Maybe: construct a scenario
  where superrational cooperation unravels when agents are almost but not quite symmetric
