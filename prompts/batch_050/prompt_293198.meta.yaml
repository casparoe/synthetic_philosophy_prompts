  others reason superrationally.


  A classic hard spec: construct a case where superrationality gives a different verdict
  from both causal and evidential decision theory, without a perfect predictor, in
  an ordinary setting. Or: where superrationality is self-undermining — everyone reasoning
  superrationally produces a worse outcome than everyone reasoning defectively.


  Actually a nice angle: Hofstadter''s Luring Lottery showed superrationality failing
  (everyone submits one entry superrationally... actually the luring lottery: entries
  grow jackpot, you want to be sole entrant; superrational reasoning suggests entering
  with small probability via randomizer). A thought experiment spec: construct a multiplayer
  game where the superrational equilibrium requires players to randomize, and show
  how superrationality prescribes correlating their randomizers... that''s niche.


  Let me design: "Construct a strategic situation in which superrational reasoning
  and ordinary game-theoretic rationality prescribe different actions, but where the
  superrational recommendation is genuinely contestable — i.e., the case should expose
  the weakest point in the superrationality argument rather than just re-running the
  prisoner''s dilemma. Constraints: no perfect predictors or mind readers; the other
  players'' similarity to the protagonist must be something the protagonist has ordinary
  evidence about; payoffs realistic. Then show each reasoning, identify which structural
  feature makes superrationality peel off, and what a critic would say."


  Hmm, but the type examples have crisp verdicts. Maybe better: a case where superrationality
  and evidential decision theory diverge — since on symmetric games they often coincide.
  That''s a good "peel off" spec: construct a game where evidential decision theory
  and superrationality disagree. When do they differ? EDT conditions on your action
  as evidence about others'' similar choices; superrationality in Hofstadter''s sense
  says choose the action that is best given that all superrational agents arrive at
  the same answer — which can differ from EDT in games where the correlation isn''t
  evidential... e.g., when others'' similarity is known but your action gives no extra
  evidence (you already know they''re like you), yet the "everyone ends up at the
  same answer" constraint still bites. A case: you know for certain the other player
  is your clone with identical reasoning — then EDT''s news value of your action is
  zero (no new evidence), but superrationality still says coordinate. Actually if
  you know they''re your clone, EDT also infers they''ll do what you do... The divergence
  is subtle. This is good "in the weeds" material.


