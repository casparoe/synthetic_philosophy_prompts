  Design a prompt: The asker is running a reading group on decision theory / Hofstadter''s
  superrationality. They want a thought experiment where superrationality comes apart
  from evidential decision theory — the two are often treated as delivering the same
  verdicts in symmetric games. Constraint: no perfect predictors, no clones stipulated;
  the symmetry between players must be something fallibly known; realistic-ish; one
  paragraph scenario. Then: show EDT''s verdict, show superrationality''s verdict,
  identify the structural feature driving them apart, and explain how an EDT defender
  would attack.


  Is such a case constructible? EDT: choose act that maximizes expected utility conditional
  on the act, using correlations between your act and others'' acts. Superrationality:
  assume all superrational agents converge on same answer; choose the answer that''s
  best if everyone picks it. Divergence case: when correlation between your choice
  and others'' is imperfect (less than 1). E.g., players are similar but not identical;
  you have statistical evidence that 70% of players like you will pick the same. Then
  EDT computes expected value with correlation 0.7 — might favor defection; superrationality
  (as Hofstadter frames it, idealized) says: if everyone reasons this way they''ll
  all reach the same conclusion, so the choice is really "all cooperate" vs "all defect"
  — pick cooperate. So divergence arises when correlation is imperfect: EDT weights
  actual correlation, superrationality idealizes to perfect symmetry of reasoning.
  That''s the structural feature. A case: a volunteer roster problem — e.g., 10 neighbors
  deciding whether to shovel a shared drive; threshold public goods. Or the Luring-lottery
  style. Good — a model can engage this without web.


  Actually there''s subtlety: is that a fair characterization of superrationality?
  Hofstadter''s superrationality does assume all participants arrive at the same answer
  if all are superrational — but if only some are superrational, the reasoning gets
  murky; that''s exactly the weakness the prompt can probe. So the thought experiment:
  construct a game where it''s common knowledge that not all players are superrational
  — some are, some aren''t, and you don''t know the proportion. Then superrationality
  has a problem: the "we''ll all end up at the same place" assumption fails; what
  does it recommend? Whereas EDT handles it smoothly with credences. That''s a case
  exposing superrationality''s weakness — a good "verdicts diverge and one looks bad"
  spec.


  Let me draft the prompt, 1-3 paragraphs, polished, with some framing detail (reading
