  ---


  I am a PhD student in political theory preparing a field exam on theories of rights,
  and I want a decision tree I can use both to organize the literature and to sort
  my own commitments. The tree''s organizing problem should come from the following
  passage in Jeremy Bentham''s Anarchical Fallacies (his examination of the French
  Declaration of the Rights of Man and of the Citizen, composed in the 1790s but not
  published in English in his lifetime):


  "To know the several laws which the exigencies of mankind call for, a view of all
  these several exigencies must be obtained. But to obtain this view, there is but
  one possible means, which is, to take a view of the laws that have already been
  framed, and of the exigencies which have given birth to them."


  Bentham''s target here is the idea that a declaration of fundamental rights can
  be framed in advance of a complete body of law: he appears to be arguing that the
  content of any purported right can only be fixed by working through the detailed
  rules a society actually needs, so that rights talk floats free unless it is anchored
  in positive law. I say "appears" because I am genuinely unsure how to read the passage,
  and part of what I want from the tree is a sharper grip on it.


  The deliverable: a decision tree with six to nine branch nodes, each phrased as
  a question a respondent could answer from a concrete case without knowing which
  position the answer commits them to, and six to eight leaves, each a named position
  on what gives a claim the status of a right. Required leaves: Benthamite legal positivism
  (rights as creatures of actual law), Lockean natural-rights theory, Dworkin''s view
  of rights as constraints on collective goals, Hohfeldian analytic deflationism,
  the will theory of rights (Hart), the interest theory (Raz), and the Marxian critique
  of rights as the rights of egoistic man. If one of these does not fit naturally
  at a leaf, say why rather than forcing it.


  Please build the tree from the logical space rather than from the list of names:
  first identify the questions on which theories of rights genuinely come apart (for
  instance: whether rights can exist where no legal or social rule recognizes them;
  whether a right''s content can be specified independently of the duties it correlates
  with; whether a mere unmet need can ground a right), then note which combinations
  of answers are possible and which are occupied. The passage should function as the
  root node or the first cut: whether a right can have determinate content antecedent
  to the detailed positive rules of a legal order. For each leaf, state in one or
  two sentences how that position reads the passage — as a sound constitutive claim
  about what rights are, as a merely epistemic point about how we could come to know
  them, or as a confusion to be rebutted — and where the position instead locates
  the anchor Bentham says rights talk needs.


  Flag two kinds of trouble explicitly: pairs of leaves your tree cannot separate
  with any question (my suspicion is that the interest theory and at least one natural-rights
  view will coincide on every diagnostic — confirm or disconfirm), and unoccupied
  combinations of answers, with a brief diagnosis of whether the empty region is incoherent,
  unattractive, or merely unexplored. Finally, include a short note (not part of the
  tree) on the best objection to reading the passage as I have: does Bentham''s argument,
  if sound, threaten his own utilitarian standard as much as it threatens natural
  rights, since the principle of utility is not itself a creature of positive law?


  The passage above does not count toward any length; the tree plus commentary should
  be manageable in about 1,500 words.


