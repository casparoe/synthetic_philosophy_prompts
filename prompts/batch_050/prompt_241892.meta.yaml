  option value or enable subsequent harms. Actually there''s a known concept: "Pareto
  improvements" can be dangerous because they change the world in ways that enable
  later bad moves; "safe Pareto improvements" are ones that can''t be exploited or
  don''t reduce future option value. This connects to Goodhart, value lock-in, etc.


