  a failure of self-respect, maybe even a kind of condoning. The other side says forgiveness
  that''s held hostage to the wrongdoer''s performance is just scorekeeping in disguise,
  that uncondtional forgiveness is possible and sometimes even owed, and that conditionalists
  have confused forgiveness with justified trust or reconciliation.


  What I keep noticing is that both sides will concede basically every case the other
  side brings up, and then just re-describe it. Unconditionalist says: the person
  who forgave the unrepentant guy who hurt them and then got free of the bitterness
