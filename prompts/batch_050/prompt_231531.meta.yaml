  their own sake, that''s not forgiveness, or if it is it''s the cheap kind. Then
  they argue about whose label is right and nobody budges.


  My hypothesis (might be naive): "forgiveness" in everyday English is doing at least
  two jobs — (a) an internal thing, letting go of resentment, and (b) an interpersonal
  thing, readmitting the person, no longer holding the deed against them in how you
  treat them. Each side quietly picks one as THE real thing and builds conditions
  around it... etc.


