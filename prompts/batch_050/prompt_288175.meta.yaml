  List of standard objections to Hume on miracles (accurate ones):

  1. Earman-style Bayesian objection: Hume''s "proof against proof" treats prior probability
  as crushing, but with enough independent testimony Bayesians can get the posterior
  above 0.5 — Hume allegedly conflates low prior with impossibility of overcoming.

  2. The definition objection: Hume defines miracle as a violation of a law of nature
  established by uniform experience, but then it''s definitionally impossible to have
  evidence for one — the argument begs the question / is circular.

  3. The multiple-witnesses objection: Hume himself admits that if testimony were
  strong enough it would establish the miracle (his "proof against proof" passage)
  — independent corroborating testimony multiplies evidential force, and Hume underestimates
  this (e.g., his own example of the eight days of darkness hypothetical).

  4. The a posteriori objection: whether the laws of nature are exceptionless is itself
  an empirical question; testimony is one source of data about it, so Hume''s uniform
  experience is not independent of the testimony — the experience pool includes alleged
  miracles.

  5. Hume''s own religious/agnostic reading: some say Hume''s argument doesn''t rule
  out miracles, just rules out testimony-based rational belief — so the common claim
  that "Hume showed miracles are impossible" misreads him; the argument is about evidence,
  not metaphysics. That''s more an interpretive point than an objection.


