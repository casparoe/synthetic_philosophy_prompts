  Let me write:


  Two members of my reading group, Mara and Dev, argued about what makes pain bad
  after we discussed pain asymbolia — a condition in which patients with certain brain
  lesions say they still feel pain but no longer mind it.


  Mara: The asymbolia cases show the badness of pain can''t lie in the sensation itself.
  The sensation is still there; what''s missing is the aversion. So pain is bad because
  we dislike it — take away the dislike and you take away the badness.


  Dev: That doesn''t follow. What asymbolia patients report might not be pain at all
  in the full sense — the aversive feel is part of what pain is, so a sensation stripped
  of it is a different sensation, not the same pain minus the badness.


  Mara: But patients describe the sensation in exactly the same terms as before —
  same location, intensity, quality (burning, throbbing). If it walks like pain and
  quacks like pain... Also, morphine patients say the same thing: pain is there, doesn''t
  bother them.


  Dev: Even granting the sensation is identical, ''they don''t mind it'' only shows
  they don''t care, not that it isn''t bad for them. Asymbolia patients typically
  show flattened concern generally — they don''t mind threats to their own body, they
  put hands on hot stoves. Their testimony about what matters isn''t authoritative
  about what''s good or bad for them.


  Mara: That move proves too much. If you discount people''s own reports of what they
  mind, you could ''defend'' any theory of badness against any counterexample. Testimony
  about one''s own experience has to count for something — otherwise the whole debate
  is unfalsifiable.


  Dev: I count testimony, I just don''t treat it as incorrigible. And your view has
  its own cost: it implies that if I stopped minding my pains — say by taking a drug
  — they would cease to be bad for me, and there''d be no reason to avoid them. That
  seems wrong.


  They asked me to settle it and I couldn''t. As an expert in philosophy of mind and
  value theory, please adjudicate: go move by move, say who''s right about each specific
  claim, identify what both are missing (e.g., the distinction between badness and
  badness-for, or between phenomenal unpleasantness and motivational aversion), and
  give an overall verdict on whose position is closer to the truth.


  Check moves for subtlety and fairness:

  - Mara''s first move: standard use of asymbolia to support the "pain is bad because
  disliked" view (e.g., against intrinsic hedonic badness). Decent.

  - Dev: "aversive component is constitutive of pain" — legitimate response (painfulness
