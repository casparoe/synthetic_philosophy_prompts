  it isn''t pain).

  - Mara: same-quality reports, morphine — good.

  - Dev: epistemic point—testimony about caring isn''t authoritative about badness;
  asymbolia patients general indifference. Good.

  - Mara: unfalsifiability charge. Decent point but somewhat overstated—Dev can accept
  testimony as defeasible evidence.

  - Dev: counterfactual cost—if a drug removes aversion, no reason to avoid pain.
  Mara could reply: the reason comes from damage/bodily harm, not pain''s felt badness;
