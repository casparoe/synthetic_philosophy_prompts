  I need advice on a decision I have to make by the end of the week, and I''d like
  the reasoning to be rigorous rather than just intuitive.


  I work as a software engineer on a twelve-person infrastructure team. A vendor whose
  platform we use has announced a one-time bug bounty with unusual terms: a fixed
  pool of $240,000 will be divided equally among everyone who submits a qualifying
  vulnerability report by Friday, regardless of how many people submit. (Normally
  bounties go to the first reporter; here there''s no advantage to being first.) Each
  of us on the team is roughly equally capable of finding a qualifying bug, but it
  would take about a full weekend of work, with maybe a 50% chance of success per
  attempt.


  Here''s where I''m stuck. If I''m the only one on the team who spends the weekend
  on this, my expected payout is large. If all twelve of us do it, the expected payout
  per person is a fraction of what a weekend of my time is worth, and we''d all have
  been better off doing nothing. Every one of us can see this. So it seems like the
  ideal outcome is that exactly one or two people hunt and the rest abstain — but
  each of us would rather be one of the hunters, and nobody has any private information
  or advantage that would justify why it should be them rather than someone else.


  A teammate has proposed a solution that I find both compelling and suspicious: each
  of the twelve of us independently rolls a weighted die — say, a random number generator
  set so that each person hunts with probability around 1/6 (adjusted for the failure
  chance) — so that in expectation two people hunt, everyone''s expected value is
  positive, and no one has to argue about who "deserves" the slot. Coordination beyond
  this is impractical and the vendor''s rules prohibit pooling or side-payments.


  My questions:


  1. Is my colleague''s randomization scheme actually rational, or does it just feel
  rational? It seems to rest on the premise that because we all have identical information
  and incentives, we should expect to reach identical conclusions — so the only question
  is which identical conclusion is best, and randomizing with a tuned probability
  is the best "identical conclusion" available. But something about reasoning about
  my own decision by reasoning about what eleven other people will decide feels circular
  to me.


  2. Suppose I accept the scheme and my random number generator tells me to abstain.
  Once I see that outcome, don''t I now have a straightforward incentive to ignore
  it and hunt anyway — since by hunting I''d increase my personal expected payout
  at everyone else''s expense? If everyone reasons this way, the scheme collapses.
  Does that mean the scheme was never rational, or does it mean the scheme requires
  a kind of commitment that pure expected-value reasoning can''t supply?


  3. Practically: one teammate has already publicly said she''s hunting regardless
  of what anyone else does. Does that change the correct probability for the rest
  of us, and does it change whether I should participate in the scheme at all?


  I''m not looking for generic career advice; I want to know whether there''s a principled
  way to make decisions like this — situations where the right move depends on what
  symmetrically-situated reasoners will do, and where "everyone does what''s individually
  best" seems to produce an outcome everyone agrees is worse. If there''s a framework
  for thinking about this, please explain it and apply it to my case, including what
  probability (if any) I should actually use.


