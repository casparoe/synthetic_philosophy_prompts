  Design the summary with subtle misrepresentations:

  1. Accurate core: for Schopenhauer, the other arts present Platonic Ideas (grades
  of the will''s objectification), but music is unique — a copy of the will itself,
  not of Ideas; that''s why it''s so powerful and universal.

  2. Misrepresentation A: summary says music expresses particular emotions — sadness,
  joy, longing — that the composer felt; Schopenhauer explicitly says music expresses
  not this or that particular emotion but the inner nature of these, in abstracto,
  without motives/circumstances.

  3. Misrepresentation B: summary says Schopenhauer ranked music as "the most rational"
  art or that it communicates concepts better than language / that great music conveys
  philosophical truths that can be translated into words — he denies music''s content
  can be translated into concepts.

  4. Overstatement: summary claims Schopenhauer proved scientifically that minor keys
  cause suffering / or that he thought program music and opera with words are the
  highest form — actually he thought pure instrumental music best, words subordinate.
  Could flip: summary claims Schopenhauer thought opera superior because words clarify
  the music — wrong; he held music should stand alone, words are secondary.

