  At a philosophy reading group last week we discussed Warren Quinn''s puzzle of the
  self-torturer: a person is fitted with a device with 1,001 settings, from 0 (no
  pain) to 1000 (excruciating); moving up one setting increases the pain by an amount
  too small to be felt, and each upward move earns the person $10,000, paid for the
  settings actually visited. Afterward two members, Mara and Dev, got into an extended
  argument about what the puzzle actually shows. I stayed out of it and now I want
  a referee.


  (1) Mara opened by saying the puzzle demonstrates that rational preferences can
  be intransitive. At every setting the self-torturer prefers the next one up — the
  money difference is real and the pain difference is imperceptible — yet no sane
  person prefers setting 1000 to setting 0. Since each local preference is rational
  and the global one is too, the only consistent reading is that rationality does
  not require transitivity, and the agent''s mistake lies elsewhere (perhaps in not
  having a stopping plan).


  (2) Dev replied that the preferences needn''t be intransitive at all once options
  are individuated properly. The relevant options are not ''setting n'' and ''setting
  n+1'' but whole trajectories: ''turn once more and then live with the consequences''
  versus ''stop here.'' Ranked as trajectories, the agent''s preferences can be perfectly
  transitive — he simply prefers stopping at 5 to stopping at 50 — and the irrationality
  is in evaluating each dial-turn as an isolated, reversible act rather than adopting
  a policy for the sequence as a whole. The puzzle targets myopic choice, not transitivity.


  (3) Mara answered that the trajectory move dissolves every paradox by redescription
  and proves too much — any sequence of choices can be relabeled as one grand option,
  which would make diachronic rationality failures impossible by definition. She then
  offered a variant: make the dial freely reversible, but charge a $100 fee each time
  the direction of turning is reversed. Now, she claimed, the agent can be pumped:
  he turns upward collecting payments while the pain is imperceptible, reverses when
  the pain becomes salient, and repeats, bleeding fees forever. A genuine money pump,
  she said, and money pumps only get traction against agents with cyclic preferences
  — so intransitivity is the correct diagnosis after all.


  (4) Dev''s response: the reversible variant changes nothing. A transitive agent
  with one stable ranking never cycles, fee or no fee; what cycles is an agent whose
  evaluations are re-done locally at each moment, so the pump exploits the local-evaluation
  procedure, not intransitive preferences. He added that Mara''s original case doesn''t
  even contain intransitive preferences: it contains intransitive indifference. Because
  the pain difference between adjacent settings is imperceptible, the agent is pain-indifferent
  between n and n+1 all the way up, but not between 0 and 1000 — and indifference
  generated by just-noticeable differences (sugar in coffee being the stock example)
  is famously non-transitive without any irrationality. Strip that out and what remains
  is a gap between what''s better at each step and what''s better overall, which is
  a problem about separability of choices, not about preference logic.


