  Hall''s New Principle / "analyst''s" (chance as expert function — Hall 1994 Analyst''s
  Principle), Hoefer''s chance-as-expert-function view (Hoefer 2007/2019), Pettigrew-style:
  PP follows from accuracy-dominance considerations (Pettigrew 2013 "Chance, Credence,
  and the Principal Principle"), anti-chance subjectivism (de Finetti / Ismael — Ismael
  argues chances are just "the right credences" / PP is trivial or circular; "Ismael:
  objective chance as an epistemic concept?"), non-Humean primitivism (Armstrong/Tooley?
