  Lewis''s Principal Principle, Hall''s "analyst''s principle" (chance as expert),
  Hoefer''s "chance as expert function"? Actually there are various responses: Lewis''s
  Principal Principle, Hall 1994 "Analyst''s Principle", Hoefer, Ismael, Pettigrew''s
  objections... Or conceivability argument positions: type-A physicalism, type-B physicalism,
  type-C (Stoljar/Montero?), type-Q, type-F (panpsychism/Russellian monism), type-D
  dualism, interactionist, epiphenomenalism, illusionism. That''s Chalmers''s taxonomy
  — a bit well-worn.


  Principal Principle is a nice, less-covered domain. Positions: Lewis''s original
  PP (C(A|X_t & H_t) = X_t for admissible X_t); responses to undermining futures /
  Big Bad Bug: New Principle (Hall 2004?), Pettigrew''s objections; Hoefer''s view
  that chance is an expert function; Strevens? Vranas? "Admissibility" questions;
  Humean vs non-Humean chances; frequency views that reject deference (de Finetti-ish
  subjectivism: chance is just credence, so PP is trivial); objective chance deniers.
  A decision tree could start from "there is a symmetric confirmation relation / objective
  chances exist?" Questions:


  1. Do you think there is such a thing as objective chance, over and above the complete
  history + laws (Humean vs primitivist/anti-Humean)?

  2. If Humean: does admissibility fix the undermining problem, or do you need to
  reformulate the principle (Lewis''s Old PP vs Hall''s New Principle)?

  3. If you think PP can''t be saved: do you drop deference (chances as just... )
  or drop chances?


