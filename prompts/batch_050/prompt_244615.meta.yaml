  true or false that the number of leaves on the oak outside my window right now is
  even, and nobody knows which. (2) Every truth is knowable in principle — if p is
  true, then someone could come to know p. (3) Knowledge is factive: knowing p entails
  p. (4) Knowledge distributes over conjunction: knowing (p and q) entails knowing
  p and knowing q. (5) Take the unknown truth from (1): the leaf number is even, and
  nobody knows it. Call that conjunction C. By (2), C could be known. By (4), knowing
