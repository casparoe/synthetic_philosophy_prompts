  the number is even. By (3), the second conjunct would make it true that nobody knows
  the number is even, contradicting the first conjunct''s being known. (6) So C couldn''t
  be known after all, contradicting (2)''s application to C. (7) Since (3) and (4)
  seem non-negotiable, (2) is false: some truths are unknowable. (8) But wait — that
  was derived from (1) alone plus logic; rerun it without assuming anything contingent:
