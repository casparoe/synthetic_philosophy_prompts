  After a seminar on verification and truth, a classmate and I reconstructed an argument
  we had seen sketched on the whiteboard, and our version seems to prove far too much,
  though we cannot find the faulty step. (1) Some truths are unknown: for instance,
  it is either true or false that the number of leaves on the oak outside my window
  is even, and as it happens no one knows which. (2) Every truth is knowable: if p
  is true, then it is possible that someone comes to know p. (3) Whatever is known
  is true. (4) Whoever knows a conjunction knows each conjunct. Now take the unknown
  truth from (1) and call it C: the leaf-count is even and no one knows that it is.
  (5) By (2), C could be known; but by (4), knowing C would require knowing both that
  the count is even and that no one knows it is even; and by (3), knowing the second
  conjunct would make it true that no one knows the first, contradicting the knowledge
  of the first conjunct we just supposed. (6) So C could not be known after all, and
  the same reasoning shows that no truth of that form could be known. (7) But the
  only assumption that generated the contradiction was that some truth is unknown;
  so (1) is false and every truth is in fact known — someone knows whether the leaf-count
  is even. That conclusion is absurd, so something in (1)–(4) or in the transitions
  has to give, yet each premise seemed obvious when we granted it. Which step should
  I reject, why did it look harmless, and what do the main ways out — restricting
  (2) to a tamer class of truths, rejecting (4), weakening the background logic, or
  biting the bullet and adopting an anti-realism about truth — each cost? I would
  most like to keep (2) in some form, since giving it up wholesale seems to make truth
  outrun not just what we know but what we could ever have reason to believe; but
  I want to know what that preference commits me to.


