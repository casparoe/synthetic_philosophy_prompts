  Prompt draft:


  ---


  I have been reading rationalist blogs and forums for over a decade, and the free-will-and-punishment
  threads are among the ones that most reliably generate heat without light. My diagnosis
  is that participants use one word, desert, for at least five distinct commitments,
  and then argue past each other. After reading the exchange between Daniel Dennett
  and Gregg Caruso on just deserts and punishment, I want to build a proper sorting
  instrument for my reading group: a decision tree that takes a reader from an initial
  commitment about punishment to a named position, so that our next discussion can
  start from where people actually land rather than from the slogans they endorse.


  Constraints on the tree:


  - It begins from a single starting commitment, roughly: the state''s practice of
  deliberately imposing suffering on wrongdoers stands in need of justification, and
  I want to know which justification, if any, works.

  - Six to eight branch nodes. Each node is a question built around a concrete case
  or claim that a smart non-philosopher can answer without knowing any position labels.
  No node may contain terms like basic desert, compatibilism, or consequentialism
  in its text; those belong only in the key.

  - The following cases must be used somewhere in the tree (one per node is fine):
  a wrongdoer who could be given a pill producing the felt suffering of a ten-year
  sentence in one afternoon, after which he remembers nothing and functions normally;
  a man whose violent impulses turn out to be caused by a treatable brain tumor, whose
  removal ends the impulses; framing and punishing a defendant known to be innocent,
  in a case where doing so would reliably prevent a deadly riot and would never be
  discovered; a carrier of a dangerous infectious disease who has done nothing wrong
  but must be confined to protect others; and a community that could reduce violent
  crime by three quarters over a generation by changing childhood conditions, at some
  cost to other goods.

  - The leaves must include at least the following, though you may add more if your
  tree generates them: the view that wrongdoers deserve to suffer in proportion to
  their wrongdoing, full stop; Dennett''s position [describe briefly]; Caruso''s position
  [describe briefly]; a purely forward-looking deterrence view that imposes no constraint
  against punishing the innocent; a communicative view on which punishment addresses
  the wrongdoer as a fellow citizen; and an abolitionist or restorative view that
  wants to replace punishment with repair.

  - For each pair of leaves your tree cannot genuinely separate, say so explicitly,
  and name the question that would separate them.

  - The tree should be built from the logical space first: the questions and the combinations
  of answers they permit, then the positions located in that space. For every combination
  of answers that no actual position occupies, note the empty cell and give a one-
  or two-sentence diagnosis: is it empty because the view would be incoherent, merely
  unattractive, or simply unexplored?


  Format of the response, in this order:

  1. Diagnostic questions. The six to eight node questions, each followed by one sentence
  on why the positions come apart there. About 60 words per question.

  2. The tree. A nested outline or diagram from the starting commitment to the leaves.
  As compact as you can make it while remaining legible.

  3. Position key. Each leaf mapped to its named position, one or two sentences each.

  4. Empty cells. Roughly 150 words.

  5. Limits of the instrument. Roughly 150 words: which pairs of leaves the tree cannot
  separate, what would separate them, and one class of reader it will misclassify.


  The intended reader is intelligent, empirically minded, allergic to jargon, and
  suspicious of any question that smuggles the answer into its wording. Write the
  node questions accordingly.


