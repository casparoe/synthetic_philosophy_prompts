  adjudication gives richer work.


  Let me construct: high school student, debate club or philosophy elective. Two classmates
  arguing about how the school should supervise/evaluate an AI study assistant or
  about grading: teacher grades only final answers vs checks work. Tie into AI supervision:
  their school pilot uses an AI tutor; dispute about whether to evaluate the AI by
  its final answers or by its reasoning traces.


  Make both sides decent:


  Person A (outcome-based): checking final answers is reliable and cheap; reasoning
  can look good while being confabulated; what matters is whether students get the
  right answer.


  Person B (process-based): a system can get right answers for bad reasons, and wrong-but-rare
  cases will slip through; checking reasoning catches dishonest shortcuts; also when
  outcome is wrong you can''t tell why.


  A counters: reasoning traces themselves are produced by the same system and can
  be optimized to look good — supervising the trace just shifts the problem, and students
  can''t reliably judge reasoning either.


  B counters: then outcome supervision has the same problem — outcomes are easier
  to fake... no wait, outcomes are checkable independently (math answers verifiable).
  B''s point: but for hard problems where we can''t check the outcome, outcome supervision
