  Add third round: maybe about legibility tax — forcing the AI to show reasoning it
  can explain may handicap it (like asking a chess master to justify each move verbally).
  And B: fine, but unverifiable excellence isn''t trustworthy in a school setting;
  we can''t certify what we can''t audit.


  Then ask adjudication move by move, who''s more right, and what both miss.


  Frame: high school student in an "AI & Society" elective or debate club; formal
