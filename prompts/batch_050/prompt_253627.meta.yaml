  Types: classroom activity/game, short story, or stalled-debate diagnosis.


  The classroom activity type fits nicely with Grice implicature — a game where participants
  experience conversational implicature, e.g., a game where violating maxims creates
  implicatures, or a game about speaker meaning vs sentence meaning. The examples
  given (mutual vs common knowledge coordination game, repugnant conclusion construction,
  sorites with sharp cutoff) are exactly this style.


  Grice: design a game that makes participants feel the force of the distinction between
  what is said and what is implicated — e.g., a communication game where players must
  convey information but are constrained (can''t say certain words), forcing reliance
  on implicature, flouting maxims. Or a game about "natural vs non-natural meaning"
  — meaning-nn: the campfire means fire vs smoke means fire. That''s a nice hook.


  Alternatively the MU-puzzle / JOOTSing: design an activity where participants work
  within a formal system (like the MIU system) and then feel what it''s like to "jump
  out of the system" — recognize that MI can never produce MU because of an invariant
  (the count of I''s never divisible by 3). That''s actually a great activity: give
  students the MIU rules, let them try to derive MU, fail, and then a meta-level insight.
  But the example about "jumping out of the system" — Hofstadter''s JOOTSing. This
  could be a strong prompt: an activity where the group works inside a rule system
  and then discovers the invariant. But it''s well known from GEB; still, designing
  an original activity around it is novel.


