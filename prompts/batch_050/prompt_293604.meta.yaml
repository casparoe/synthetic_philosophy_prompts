reasoning_summary: 'I need to pick a domain and type. Type: slogan disambiguation.
  Domains: statues/commemoration, enactivism, Lakatos, Malthus, consequentialist cluelessness.


  A slogan in the commemoration domain: "History is not a museum" or "We shouldn''t
  judge the past by today''s standards" or "Removing statues erases history." The
  slogan "statues teach history" or "you can''t erase history" — that''s a good one.
  Slogan type asks to precisify claims, which are platitudes, contentious, false,
  and which reading supports the use it was put to.


  Alternative: enactivism slogan "the mind is not in the head" — that''s a classic.
  Or "the brain is not a computer" — but attribution concerns. "The mind is not in
  the head" is commonly attributed to Putnam, "ain''t in the head" from "The Meaning
  of ''Meaning''" — but as a slogan in 4E cognition it''s fine without attribution
  since it''s commonly repeated. Actually the hard rule: attribute a line to a specific
  author only if verified. I can present it as a slogan without attribution.


  Let me pick commemoration + "you can''t erase history" / "removing statues erases
  history." Write from perspective of someone for whom it recently became personally
  relevant — e.g., their town council is debating removing a statue, they used/were
  confronted with the slogan at a public meeting.


  Formal/polished, short, focused. Deliverable: menu of readings with verdicts, and
  which readings support the use it was put to.


  Draft:


  "At a recent town council meeting about relocating a statue of our city''s founder
  — a man who both endowed the local hospital and held a government post enforcing
  policies we now regard as indefensible — a councillor closed the discussion by saying
  that you can''t erase history, and the statue stayed on the agenda. The slogan did
  real work there, and I want to know what it was. What precise claims could ''removing
  statues erases history'' be making? I can imagine readings ranging from the platitudinous
  (taking down a monument does not undo past events) to the psychological (public
  memory depends on physical monuments in a way that... ) to the normative (whatever
  statues do, removing them is objectionable in the way destroying archives would
  be). Please lay out the distinct theses the slogan might express, say which are
  trivial, which are substantive and defensible, and which are false, and identify
  which readings would actually support the conclusion that the statue should remain.
  It would help to know which reading the councillor most likely meant, and whether
  that reading is among the defensible ones."


  That''s good. Short, polished, personal relevance, no quotes needing verification
  (slogan in common form, fine). No web needed.


  Format: plain prose, one or two paragraphs. Length matches examples. Good.'
