  Design a belief set with genuine tension(s), one apparent tension that dissolves,
  no signaling of which to give up.


  Commitments sketch (complicity domain):

  (a) Causal impotence doesn''t matter for wrongness: buying meat is wrong even if
  your individual purchase doesn''t cause any extra animal to be raised (threshold
  effects / expected value / rule-based reasoning) — the "inefficacy objection" to
  consumer ethics. They accept the standard LW-ish expected-value response.

  (b) Voting is fine / maybe obligatory, but they reject "one vote never matters"
  reasoning... hmm.

  (c) Working for a company that does bad things is wrong even if someone else would
  just take the job (the replaceability argument — they reject "if I don''t do it
  someone else will").

  (d) Yet they think contributing to collective harms where your contribution is truly
  negligible (e.g., driving a car''s marginal CO2) imposes at most a very weak duty
  — can''t be expected to organize your life around it.


  Genuine tension: (a) and (d) — expected-value reasoning about inefficacy applies
  equally to climate; if you accept the expected-harm response for meat, you can''t
  dismiss carbon footprint as negligible since expected value reasoning gives you
  a nonzero duty there too. Also tension between (c) and the idea that complicity
  requires your participation to make a difference — but they reject replaceability
  arguments.


  Apparent tension that dissolves: e.g., they think (e) mere association or benefiting
  from wrongdoing (using roads built by exploitation, buying cheap clothes made in
  sweatshops where the workers'' lives are improved) isn''t complicity, while (f)
  buying meat is. This looks inconsistent but dissolves because complicity tracks
  contribution/participation in the wrongdoing, not benefit — benefiting from past
  wrongs isn''t participating.


  Or another apparent one: they think voting in an election where you abhor both candidates
  isn''t complicity with whoever wins, but think buying products is complicity with
  the producer — dissolves via the difference between participatory intent/contribution
  to the mechanism vs. outcomes you''d have prevented if you could.


  Rationalist flavor: mention expected value, thresholds, "if I didn''t do it someone
  else would," Scott Alexander-ish framing, maybe "moral offsets," utilitarian-ish
  but with deontological side constraints.


  Let me draft:


  Beliefs:

  1. Buying factory-farmed meat is wrong even though any individual purchase plausibly
  changes nothing, because expected value across threshold effects works out to nonzero
  harm (standard argument).

  2. "If I didn''t do it, someone else would" is no defense — so taking a job at,
  say, an arms company or a predatory lender is wrong even if the slot gets filled
  regardless.

  3. Your personal carbon footprint is basically a rounding error and it''s fine to
  fly; demanding people stress about it is moralizing noise. Individual emissions
  duties are negligible.

  4. Merely benefiting from injustice (wearing clothes whose supply chain has exploitation
  somewhere, using tech built by companies whose politics you hate) doesn''t make
  you complicit; complicity needs participation, not benefit.

  5. Voting for the lesser evil isn''t complicity in the lesser evil''s crimes.


  Tension 1 (genuine): 1 vs 3. The expected-value/threshold argument that saves consumer
  ethics in 1 applies identically to emissions — a marginal emission has nonzero expected
  harm via climate sensitivity. The "rounding error" move in 3 is exactly the inefficacy
  objection rejected in 1. To keep both you need a principled asymmetry (e.g., thresholds
  vs continuous harm — actually there IS a candidate asymmetry: meat purchases have
  threshold effects; carbon is smooth/continuous, so marginal harm is real but tiny
  and linear; the expected-value argument actually gives small-but-real duty, not
  zero). A good answer notes the fix: either accept a small duty in 3 (proportional,
  offsettable) or show why thresholds matter.


  Tension 2 (genuine, subtler): 2 vs 1 — actually, the replaceability rejection in
  2 relies on something non-causal (participation, complicity as relating wrongly),
  but 1''s defense is purely causal-expected-value. If your reason to reject inefficacy
  excuses is expected-value, then replaceability at the arms company is different:
  there the replacement really would do the identical act, so expected harm of your
  taking the job ≈ 0 (unlike thresholds). So 1''s motivation undermines 2 — the standard
  expected-value framework actually vindicates "someone else would do it" in full-replaceability
  cases. To keep 2 you need a non-consequentialist complicity principle, which then
  makes 1''s expected-value machinery superfluous — you could just appeal to participation
  directly. That''s a nice deep tension.


  Apparent tension that dissolves: 4 vs 1 — looks inconsistent (why is buying meat
  participation but buying sweatshop clothes mere benefit?) but dissolves: in 4 the
  exploitation is upstream/past and the purchase arguably doesn''t constitute the
  wrong, whereas in meat the harm is the point of the product... actually that''s
  genuinely murky. Better apparent one: 5 vs 2 — voting lesser evil looks like participating
  in wrongdoing you didn''t cause, seems in tension with rejecting replaceability
  excuses. Dissolves: complicity standards differ for choosing between outcomes you''ll
  be subject to regardless vs. voluntarily joining an enterprise; or participatory
  intent. A good answer can explain 5 is consistent via the difference between authoring
  a wrong and choosing under constraint.


  Keep it casual, rationalist-reader voice, a typo or two. Include format request:
