  \ Or I could just avoid names beyond Popper and Marx and mention \"cyclical theories\
  \ of history\" generically.\n\nWhich domain makes the best essay-comment prompt?\
  \ Let me weigh:\n\n1. Program equilibrium: juicy, science-journalist-friendly (AI\
  \ angle), inject niche ideas (Löbian cooperation, source code transparency) into\
  \ the essay. Embedded errors: e.g., saying program equilibrium makes cooperation\
