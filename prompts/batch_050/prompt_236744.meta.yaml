  \ that can inspect each other's code. The \"journalist\" persona works naturally:\
  \ a journalist writing a piece about AI safety/multi-agent AI and game theory.\n\
  \nProgram equilibrium details: Tennenholtz (2004) \"Program equilibrium\" — programs\
  \ play a game where each program gets access to the other's source code. A program\
  \ \"Cooperate if the opponent's program is identical to me\" achieves cooperation\
  \ in the one-shot prisoner's dilemma. There's also the \"fair bot\" / PrudentBot\
  \ literature from the MIRI/LW world (Robust Cooperation in the Prisoner's Dilemma,\
  \ Fortnow's result, Critch's \"parametric bounded Löb's theorem\"). FairBot: cooperate\
  \ if I can prove the opponent cooperates with me. Löb's theorem issues. But I shouldn't\
  \ lean too hard on niche specifics the model may not know; the prompt can inject\
  \ these ideas itself.\n\nType options: \"Write an exam question with model answer\
  \ and marking scheme\" — journalist persona doesn't fit naturally (\"I'm on the\
  \ committee writing the comprehensive exam\"). But a journalist could ask for help\
  \ constructing a quiz? Less natural. \"Request comments on an essay\" — very natural\
  \ for a journalist: they wrote a draft of an article (popular essay) about program\
  \ equilibrium and want comments on accuracy. But wait — the type says I have to\
  \ write an essay myself and then ask for comments. That's a lot of text but fine.\
  \ The journalist persona fits perfectly: \"I cover science and ideas for a magazine,\
  \ here's a draft of my piece on program equilibrium, check it for conceptual errors.\"\
  \n\n\"Rank or rate\" — a journalist could ask to rate candidate examples, e.g.,\
  \ \"which of these analogies best conveys program equilibrium\". Hmm.\n\nThe essay-comment\
  \ type requires me to write the essay. The essay should contain some intentional\
  \ subtle errors/infelicities so that the commenting task is meaningful. That's a\
  \ classic and good setup: the prompt asks for comments on accuracy, and embeds a\
  \ couple of genuine mistakes so the model can't just say \"looks great\". This makes\
  \ the prompt in-the-weeds and discriminating.\n\nAlternatively, endurantism vs perdurantism\
  \ as an essay-comment: journalist writing a pop essay about personal identity and\
  \ persistence. Or Popper's poverty of historicism: journalist writing an essay about\
  \ whether there are laws of history, touching on cliodynamics, Toynbee, Marx, Popper's\
  \ critique. That's quite appealing for a science journalist. Popper's argument:\
  \ the course of human history is strongly influenced by the growth of human knowledge;\
  \ we cannot predict by rational or scientific methods the future growth of our scientific\
  \ knowledge (because if we could predict future knowledge, we'd already possess\
  \ it); therefore we cannot predict the future course of human history. That's a\
  \ famous three-step argument. Popper also criticized \"historicism\" — the belief\
  \ in laws of historical development — in The Poverty of Historicism (book 1957,\
  \ essays earlier in 1944/45 Economica) and The Open Society and Its Enemies. I need\
  \ to be careful about exact dates/quotes. I can paraphrase Popper's argument without\
  \ quoting — that's safe and I'm confident of the argument's structure.\n\nAn essay\
  \ with embedded subtle errors: e.g., conflating historicism (in Popper's sense)\
  \ with historical materialism's predictions, or conflating Popper's \"historicism\"\
  \ with the other meaning of historicism (methodological historicism à la Dilthey/Herder\
