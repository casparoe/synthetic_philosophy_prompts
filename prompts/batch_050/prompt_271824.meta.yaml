  1. "Had God commanded lying or cruelty, those would have been good instead" — this
  is the crude voluntarist reading. Careful Ash''arites (e.g., al-Ash''ari himself,
  later al-Baqillani, al-Juwayni) held that God''s attributes (wisdom) constrain what
  He wills; God does not command what is repugnant... Actually there is nuance: classical
  Ash''arites do say that if God had commanded unbelief it would be obligatory? There''s
  genuine debate — some Ash''arites (al-Juwayni''s position in the Irshad?) held that
  God''s command makes things good in the sense that nothing is intrinsically good;
  whether God *could* have commanded otherwise is contested. So the misrepresentation:
  presenting the most extreme voluntarist counterpossible as the settled Ash''arite
  position, without noting the role of God''s unchanging attributes and wisdom. That''s
  a defensible subtle error for the audit.


  2. "Morality is ultimately arbitrary" — overstatement; Ash''arites deny arbitrariness
  by grounding commands in God''s wisdom, and they have the "no obligation on God"
  doctrine (God cannot be obligated, but acts consistently with His wisdom).


  3. "Human beings cannot know right from wrong at all until revelation arrives" —
  Ash''arites do hold the famous thesis that before revelation, acts have no moral
  status (the controversy of al-hukm qabl wurud al-shar'', where Ash''arites held
  no obligation before revelation, Mu''tazila held rational obligation like gratitude).
  So this part is actually roughly accurate for Ash''arites! So it shouldn''t be flagged
  as error — careful. Actually the subtle error would be conflating "reason cannot
  independently establish moral obligation" with "reason plays no role in ethics"
  — Ash''arites allow reason to understand and elaborate revelation (usul al-fiqh
  is largely Ash''arite-inflected), and to know God exists. Hmm.


  4. "It was resolved when Ash''arism became dominant" — institutional dominance isn''t
  philosophical resolution; also Maturidism exists as another Sunni school taking
  intermediate ground (the doctrine of tahsin wa taqbih — Maturidis held reason can
