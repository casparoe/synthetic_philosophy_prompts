  Draft summary:

  "The Mu''tazila held that moral truths are objects of rational insight: acts are
  just or unjust in themselves, and human reason can know this without revelation.
  God, being perfectly rational, commands what is good because it is good — which
  the Ash''arites objected to on the grounds that it subjects God to an external moral
  law, compromising His omnipotence. The Ash''arite response was that good and evil
  have no intrinsic nature at all: an act is good simply because God commands it,
  and had God commanded lying or cruelty, those would have been good instead. On the
  Ash''arite view, then, morality is ultimately arbitrary, and human beings cannot
  know right from wrong at all until revelation arrives. The Mu''tazila replied that
  this makes gratitude to God meaningless, since we could not praise God for doing
  good if ''good'' just means whatever He does. This debate is essentially the Islamic
  version of Plato''s Euthyphro dilemma, and it was resolved when Ash''arism became
  the dominant school of Sunni theology."


