  Summary draft (from an unnamed blog post or friend): "Researchers trying to build
  ''low-impact'' AI propose penalizing an agent for changing the world: the agent
  should achieve its goal while leaving the environment as close as possible to how
  it would have been otherwise. The idea is that we can''t specify everything we care
  about, so we penalize side effects instead of listing them. Critics reply that this
  can''t work: any action changes the world, so the agent either does nothing at all,
  or it learns to offset its effects — e.g., it puts the vase back after knocking
  it over, or quietly rearranges the world back to baseline after doing its task.
  Worse, because the penalty can''t tell the agent''s own changes from changes other
  people would have made anyway, the agent is rewarded for preventing people from
  doing things, which makes ''low impact'' mean ''freeze the world and everyone in
  it.'' So impact measures either paralyze the agent or turn it into a busybody, and
  the whole approach fails unless we can already specify value — which was the problem
  it was supposed to solve."


  Where are the subtle misrepresentations?


  Accurate: the motivation (can''t enumerate everything we care about, penalize side
  effects); offsetting is a genuine known problem (the "offsetting" problem in the
  impact measure literature — an agent might take actions to cancel out its effects,
  which can be bad, e.g., the classic example of breaking the vase and then... actually
  the offsetting concern: an agent that causes an effect then compensates may do weird
  things; also reward for preventing others'' actions is a real criticism — "the agent
  may interfere with others to prevent them from changing the environment" — yes,
  this is a known issue with naive penalty relative to counterfactual baseline where
  others act).


  Subtle misrepresentations:

  1. "Penalizing change" — conflates impact with any change. Most proposals penalize
  changes to things humans value / reachable utilities, not change per se; more importantly,
  the baselines matter (inaction baseline vs. stepwise baseline). Also many proposals
  explicitly allow change via "the baseline is what would have happened without the
  agent," so changes that would have happened anyway aren''t penalized. The summary
  treats "leaving the environment as it would have been" as the whole idea, but the
  real proposals are about preserving option value / not reducing the attainability
  of other goals.

  2. "Critics say the agent does nothing or offsets" — the paralysis objection is
  partially fair but ignores that the penalty is usually a small regularizer alongside
  the task reward, so the agent trades off; the real problem isn''t paralysis but
  that a small penalty means the agent just pays the penalty when convenient ("the
  agent can just accept the penalty" — actually that''s a real point).

  3. The conflation: the summary presents the criticism "can''t distinguish own changes
  from changes others would have made" — actually baselines handle some of this; but
  the real subtle issue is the inaction baseline rewarding the agent for preventing
  changes others would cause (interference) — which the summary does mention. The
  misrepresentation: claiming this makes it "freeze the world and everyone in it"
  as if all proposals share naive baselines; many proposals deliberately avoid penalizing
  the agent for others'' actions (e.g., penalizing only what the agent causes) — but
  wait, that''s actually contested.

  4. The final conclusion: "fails unless we can already specify value — which was
  the problem it was supposed to solve" — this is the overstatement/standard-objection-as-refutation.
  The approach doesn''t need a full specification of value; it needs a proxy that
  correlates with value (e.g., attainability of human goals). The modest thesis is
  that impact regularization reduces catastrophic side effects even if imperfect,
  not that it fully solves alignment. The conclusion conflates "needs some value-laden
  design choices" with "needs a full specification of value."


  Also: "any action changes the world, so the agent does nothing" — ignores that the
  penalty is about *unnecessary* side effects relative to achieving the goal: the
  agent is allowed to change the world to do its task; penalty discourages extra changes.
  Though defining "necessary" is itself hard.


  Also there''s the "offsetting" mischaracterization: "puts the vase back after knocking
  it over" — the actual concern is subtler: offsetting means the agent undoes effects
  so the baseline comparison shows no impact, even when the undoing is costly or the
  offset harms; e.g., classic example: agent prevents a disaster it itself set up,
  or the agent pays the penalty by... The known example: with inaction baseline, an
  agent that has already had an effect may be incentivized to "offset" by causing
  opposite effects. Also the example of the agent stopping a human from doing something
  then doing it itself... Keep it simple.


  Also "rewarded for preventing people from doing things" — real known failure mode
  with naive baselines (the agent disables humans'' ability to change the environment
  — e.g., taking away the off-switch... no, that''s different). Known: with an inaction
  baseline where the baseline includes human activity, the agent is penalized for
  human-caused changes and thus incentivized to prevent humans from acting (e.g.,
  disabling them). Some proposals use baselines that avoid this. So the summary''s
  criticism applies to some but not all proposals — the "all impact measures freeze
  the world" is the overgeneralization.


