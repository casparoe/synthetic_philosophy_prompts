  Essay:


  [1] Consider a case that has become standard in the literature. A woman in her fifties,
  sharp and unsentimental, watches her mother die slowly of dementia and writes an
  advance directive: if she is ever severely demented herself, no life-prolonging
  treatment — not even antibiotics for pneumonia. Twenty years later she is indeed
  severely demented, and by most accounts quite happy: she potters around the ward,
  enjoys her meals, takes pleasure in music. She gets pneumonia. The directive says
  let her die. Should we follow it?


  [2] Ronald Dworkin''s answer, roughly, is yes. His idea is "precedent autonomy":
  autonomy isn''t just about what you want right now, it''s about your life going
  according to the story you''ve authored. On this view the directive expresses her
  critical interests — convictions about what makes a life good or bad as a whole
  — and those interests outlast the capacity to reflect on them. Ignoring the directive
  doesn''t spare her; it betrays her.


  [3] Rebecca Dresser pushes back. Once dementia is advanced, she argues, the person''s
  critical interests are simply gone, and what remain are experiential interests:
  comfort, pleasure, freedom from pain. The directive then becomes an instruction
  to harm a real, living, presently-content person for the sake of a biography that
  person can no longer even understand. On Dresser''s view, the patient''s current
  wishes settle the matter, and the earlier self is, morally speaking, a stranger
  with a pen.


