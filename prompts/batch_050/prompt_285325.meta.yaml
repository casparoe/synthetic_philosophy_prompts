  In GEB, Chapter VI ("The Location of Meaning"), Hofstadter discusses meaning in
  messages. Key ideas:

  - A message has an inner message: the information it''s meant to convey.

  - The outer message: the part that tells you how to decode — the decoding rules.
  E.g., "This message is in English" or the structure that signals how to interpret.

  - The frame message: the part that signals "I am a message; decode me" — like the
  label on a record, or the bottle with "drink me."


