  \ of duty — cold duty is less admirable;\n(c) in fiction, a character who does the\
  \ right thing from selfish motives that happen to align (e.g., saving someone for\
  \ reward) deserves no moral credit;\n(d) people can't control what they care about\
  \ / their motivations, so we shouldn't blame characters (or people) for acting from\
  \ the wrong motives;\n(e) moral worth of an action should be assessable without\
  \ knowing what's in the agent's head — for fiction, readers judge from outside...\
