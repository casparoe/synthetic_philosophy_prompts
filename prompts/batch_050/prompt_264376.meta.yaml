  injustice). That''s good: describe the phenomenon where a speaker, anticipating
  that hearers won''t understand or will distort their words, truncates or reshapes
  their testimony so it will be digestible — that''s testimonial smothering (Dotson).
  Ask if it has a name and how it differs from testimonial injustice (where hearers
  deflate credibility) — the speaker self-silences preemptively, so there may be no
  prejudice event on the hearer''s side at the moment.


  But the instruction says: the description should fit an established concept only
  imperfectly or fit nothing. Testimonial smothering exists; the asker describes it
  without vocabulary and asks whether it has a name and how it relates to Miranda
