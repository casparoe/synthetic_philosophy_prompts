  I teach a first-year introduction to philosophy at a university. Next term I am
  responsible for the two-week unit on perception: a 75-minute lecture followed a
  week later by a second 75-minute lecture, for about sixty students, most of whom
  have never studied philosophy. The week immediately before mine is devoted to Descartes''
  First Meditation, so my students will arrive with the dream argument and the evil
  demon fresh in mind. I have a whiteboard and can do simple live demonstrations;
  I prefer not to use slides. The unit is revisited every year, so I want a plan I
  can reuse and revise rather than a script.


  [Passage paragraph] My current intention is to open the first lecture with the following
  passage from Bertrand Russell''s The Problems of Philosophy (1912), Chapter I:


  "the painter has to unlearn the habit of thinking that things seem to have the colour
  which common sense says they ''really'' have, and to learn the habit of seeing things
  as they appear. Here we have already the beginning of one of the distinctions that
  cause most trouble in philosophy—the distinction between ''appearance'' and ''reality'',
  between what things seem to be and what they are."


  The unit''s destination is the argument from illusion and disjunctivism as a response
  to it. My worry about the Russell passage as an opening frame is this: it presents
  the appearance/reality distinction as something a painter already has to master
  — innocent, pre-philosophical — when the dispute the unit is building toward is
  precisely over what that distinction is a distinction between (two objects, an inner
  item and an outer one, or two kinds of perceptual state, or two ways of taking the
  same experience). Russell''s chapter goes on to argue for sense-data; I do not plan
  to tell students that at the start. Please address, as a substantive part of the
  plan: whether this passage is the right way in, whether its apparent innocence stacks
  the deck against disjunctivism before the argument is even stated, whether to disclose
  where Russell himself ends up, and what alternative opening you would use if you
  judge this one compromised.


  Then the plan itself. I want, in order:


  1. The sequence of ideas across the two lectures, with the dependency structure
  made explicit... (a) the datum of perceptual variation/illusion; (b) the inference
  from "subjectively indistinguishable" cases to a common mental item; (c) intermediaries/sense-data
  and the veil they seem to interpose; (d) disjunctivism''s refusal of the common-factor
  step; (e) the pressure back on disjunctivism (the causal argument from hallucination,
  the continuity between illusion and hallucination). State which of these must come
  before which and why, and flag any place where the order is a genuine choice rather
  than a necessity.


  2. The carrying example. One example should do most of the work. Candidates I have
  considered: the penny seen obliquely (looks elliptical), the straight stick half-submerged
  in water, the Müller-Lyer lines, and double vision produced by pressing the eyeball.
  Say what the carrying example must have (live-demonstrable in a lecture hall; genuinely
  a case of seeing a real object as other than it is, not merely not seeing it; resistant
  to the "you know better, so it isn''t really an illusion" dismissal — Müller-Lyer
  is good for this last point) and what it must not smuggle in, and pick one with
  reasons. Also say whether the submerged stick is ruined by students'' knowing the
  physics.


  3. The misconception map. The errors students will bring or form, and the exact
  point in the sequence where each should be headed off rather than corrected afterwards.
  The ones I already expect: (i) that the argument from illusion concludes that the
  external world does not exist or cannot be known — confusion with the Cartesian
  material from the previous week; (ii) that disjunctivists deny hallucinations occur
  or deny they feel like perceptions; (iii) that "illusion" means seeing something
  that is not there (so that Russell''s table and my carrying example get miscategorized);
  (iv) that neuroscience settles the question because the brain state is the same
