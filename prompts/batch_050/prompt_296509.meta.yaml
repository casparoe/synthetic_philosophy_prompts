  Standard objections to Kant''s indirect duties view:

  1. The objection that it mislocates the wrongness: cruelty to animals seems wrong
  even where no human character is corrupted (isolated act, last man on earth variant
  — the "last person" counterexample: someone on deathbed torturing a cat, or last
  human alive).

  2. Empirical objection: the link between animal cruelty and human cruelty (the "graduation"/"link"
  hypothesis) is empirically contestable; some cruel-to-animal people are kind to
  humans.

  3. Objection from marginal cases / consistency: if rationality grounds moral status,
  infants and severely cognitively disabled humans are excluded (speciesism charge,
  Singer).

  4. Gratitude/faithfulness cases: Kant himself says shooting the old faithful dog
  is ungrateful — this suggests direct considerations sneak in; the objection that
  Kant''s own examples don''t fit indirect-duty analysis.

  5. The objection that it makes duties to animals contingent on human psychology
  — a different psychology (psychopath unaffected) would license anything.

  6. Korsgaardian / constructivist revision: we can extend the categorical imperative
  to sentient beings — but that''s a fix, not objection per se.


