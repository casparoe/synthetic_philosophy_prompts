  I''m a journalist covering science and ideas, and I''m writing a long piece about
  persuasion tech — dark patterns, targeted ads, AI chatbots that are really good
  at getting people to do things. The piece keeps circling one question: when does
  trying to change someone''s mind stop being persuasion and start being manipulation?
  Everybody uses these words like the line is obvious, but when I press people, they
  draw it in totally different places.


  So I want to build a little "where do YOU draw the line?" quiz for my readers. Here''s
  what I need:


  - 8-10 questions, each one a concrete scenario, not a theory question. Nobody should
  need to have read any philosophy to answer. Some cases I''d like used: a grocery
  store putting candy at kid-eye-level by the checkout; a friend saying "after everything
  I''ve done for you, you owe me this"; a website making the cancel button nearly
  impossible to find; a politician giving a speech that''s emotionally rousing but
  where every factual claim is true; subliminal frames spliced into an ad; an AI assistant
  that notices you''re sad and pitches products it predicts you''re more likely to
  buy in that state. Feel free to adjust or add a couple of your own, but keep them
  everyday-ish, no trolley problems.

  - Each question gets 2-4 answer options phrased as verdicts on the case (this is
  fine, this is manipulation, depends on what the persuader intended, etc.), not as
  endorsements of a theory.

  - A scoring key that maps answer patterns onto named positions in the debate. The
  leaves I definitely want included: the view that manipulation means bypassing or
  short-circuiting someone''s capacity for rational deliberation; the view that manipulation
  is about applying pressure (making the non-preferred option costly) rather than
  about trickery; the view that what matters is whether the influence is hidden from
  the target; the view that exploiting known glitches in human cognition is manipulation
  even if the target sees everything that''s happening; and a deflationary skeptic
  leaf for people whose answers show they don''t think there''s any real line at all.

  - The point is to sort readers by their verdicts on cases, not by which label sounds
  smart, so no question like "do you think autonomy matters?"

  - Flag any two leaves the quiz can''t actually tell apart, and any answer pattern
  that doesn''t map cleanly onto any leaf — tell me whether that pattern is incoherent
  or just an unoccupied spot in the space.


