  Positions on manipulation (standard literature):

  1. Rational-capacity view: manipulation works by bypassing/subverting the target''s
  rational capacities (reasons-responsiveness). E.g., deception, subliminal messaging.

  2. Pressure/incentive view (Noggle): manipulation as pressure — offering incentives
  that make refusal costly (threats, guilt-trips). Noggle distinguishes pressure,
  trickery, and maybe a third.

  3. Autonomy view: manipulation undermines autonomy (even via appeals to emotion).

  4. "Hidden influence" view (Susser, Roessler, Nissenbaum on online manipulation):
  hidden and subversive influence that thwarts conscious decision-making.

  5. Nudging / choice-architecture view: exploiting cognitive biases (Sunstein/Thaler;
  defensibility debates — nudges are manipulative or not).

  6. Skeptic/deflationary: no sharp line; persuasion and manipulation are on a continuum;
  "manipulation" is just persuasion we disapprove of.

  7. Intent-based views: manipulation depends on the influencer''s intentions or failure
  to treat the other as an equal.


