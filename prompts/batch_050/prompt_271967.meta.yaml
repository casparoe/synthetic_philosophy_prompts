  the whole framework up front; respond to my move.


  My opening challenge: two people. The first is well-educated, healthy, surrounded
  by every opportunity your theory values, but through choices you consider autonomous
  and informed, lives a life you yourself would describe as bleak — say, a miserly
  hermit who derives little enjoyment and accomplishes nothing. The second is cheerful
  and satisfied but has never in her life had the opportunity to leave her village
  or participate in politics, and doesn''t miss what she''s never known. On your metric
  the first counts as better off than the second, and justice directs nothing to either.
  That seems backwards to me twice over: the first seems a candidate for compassion,
  the second for justice, and your view apparently can''t register either. Why isn''t
  this a decisive objection?


