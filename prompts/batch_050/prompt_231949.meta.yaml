  Phenomenon-for-a-name with privacy: the engineer notices that people willingly disclose
  information when each disclosure is harmless, but object to the aggregate. That
  has names: "aggregation effect," "mosaic effect," "privacy as contextual integrity"
  (Nissenbaum). The phenomenon: each individual data point is voluntarily shared and
  harmless, yet the assembled profile feels violating. Established concepts: the "mosaic
  effect" in government/intelligence, "aggregation problem". A good prompt: describe
  it without naming, ask whether it has a name, how it differs from related concepts
  (e.g., the mere sum of harmless disclosures vs. inference that reveals new facts
  — "database of ruin"?). Hmm.


  Better: make it in-the-weeds. The engineer notices a dual phenomenon: harm flowing
  from inference, not disclosure — you can learn things about people who never disclosed
  anything by statistical inference from similar people who did. This is sometimes
  called the problem of "inferred data" / "predictive privacy" / "tyranny of the minority"
  (people whose data enables inference about non-participants). Known term: "privacy
  as a public good" / "networked privacy". There''s literature: "privacy harms by
  inference," "relational privacy" (Viljoen), "datafication". Also "the privacy of
  populations."


  Could describe: an opt-in system where each consenting user shares their own data,
  which is fine individually; but the trained model then reveals information about
  people who never consented and could never opt out, because what they would have
  shared is inferable from others. Consent-based frameworks have no handle on this
  because each consent is valid. Ask: does this failure of consent-based privacy ethics
  have a name, how does it relate to the more familiar idea of privacy violations
  needing a specific wronged individual, and if no name, coin one with boundary cases.


  That''s a good "describe a phenomenon" prompt: fits some concepts imperfectly (externalities
