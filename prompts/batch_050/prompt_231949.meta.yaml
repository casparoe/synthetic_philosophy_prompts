  Alternatively for the omnipotence paradox: construct a thought experiment in which
  an omnipotence-friendly resolution (e.g., "omnipotence is the power to do anything
  logically possible") fails even granting that resolution — i.e., a task that is
  logically possible in some sense but can''t be done by any single being because
  the task is indexical/self-referential... Hmm, the classic is "make a stone so heavy
  you can''t lift it" and standard reply: that''s logically impossible so not a limit.
  A novel spec: build a task that is individually logically possible but where success
  by the omnipotent being is incompatible with the being''s continued omnipotence
  in a way that isn''t a mere logical contradiction — e.g., "create a being with free
  will whose choices you cannot know/control." Standard reply: such a being''s actions
  are still within God''s power via middle knowledge... getting into weeds.


