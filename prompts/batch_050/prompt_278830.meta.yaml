  Schema: {"case": description of the counterexample, "target": "definition" or "prohibition",
  "closest_item_on_list": which listed item it''s closest to and why it''s not just
  a variant, "augustine_escape_hatch": what Augustine could say in reply, "verdict":
  good/bad}.


  Write from philosophy professor perspective, casual, short. No quotes needed — no
  verbatim quotations. Good.'
