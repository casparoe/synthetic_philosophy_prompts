  (Kantian), vs. moral worth if the action is right and motivated by any decent motive
  (Humean/sentiment), vs. "de dicto" vs "de re" desire views (Markovits, Arpaly).


  Design a friend''s verdicts:

  1. Shopkeeper gives correct change because honesty is good for business — no moral
  worth. (All theories agree.)

