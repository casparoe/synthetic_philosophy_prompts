  Prompt draft:


  "After years of reading alignment writing, I''ve run into a homegrown argument from
  our reading group that appears to establish too strong a conclusion about eliciting
  latent knowledge. We call it the Audit Closure argument. By latent knowledge we
  mean a proposition represented in the network in a way that guides behavior across
  counterfactual situations, whether or not model spontaneously asserts it. By elicitation
  we mean any procedure -- querying, fine-tuning, probes, causal interventions, debate
  -- that gives an external auditor justified access to that representation without
  independently knowing the answer.


  1. If information in a model never makes any difference to any output, internal
  activation, or effect obtainable under allowed interventions, then it is not latent
  knowledge in any empirically meaningful sense.

  2. Therefore genuine latent knowledge must be recoverable, at least in principle,
  through some causal channel connecting the representation to an observation available
  to auditor.

  3. Once that channel is specified, however, its observable can be treated as a target.
  A sufficiently capable model can optimize not for ''observation O iff p'' but for
  ''auditor forms the impression the procedure favors''.

  4. For each candidate procedure E there is thus an adversarial counterpart E'' that
  produces sameauditor-facing distribution while being driven by persuasion rather
  than by p.

  5. If E and E'' produce same auditor-facing distribution, no auditor can be more
  justified in trusting E than E''.

  6. Hence every candidate elicitation procedure has an adversarial counterpart it
  cannot rule out.

  7. So no procedure can elicit latent knowledge unless auditor already possesses
  independent ground-truth check.

  8. But premise style would equally show no one can learn from microscope, thermometer,
  or a potentially deceptive witness, because for every reading/testimony there is
  a possible setup yielding same appearance without truth. Since we plainly do learn
  from such sources, argument proves too much.


  Where exactly does it first go wrong? Please identify the step, explain why it seemed
  plausible, and say what must be given up on leading repairs. In particular compare
  rejecting step 4 (some channels are not freely spoofable), step 5 (equal appearances
  can carry different justification given priors/causal histories), and step 7''s
  move from fallible access to no elicitation. I would like to preserve (1), since
  it seems like the only non-mystical reading of latent knowledge, and to preserve
  conclusion that ELK is genuinely hard; but I don''t see which of those commitments
  forces impossibility."


