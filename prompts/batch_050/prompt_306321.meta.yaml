  Several times in the past year I have heard "the brain is a prediction machine"
  used to settle an argument, and I have begun to suspect it settles different arguments
  in different mouths. The two occasions that stick with me: first, a machine learning
  colleague arguing that since brains predict, our predictive coding–style architectures
  are not merely engineering conveniences but literally what cortex is doing, so neuroscience
  has nothing further to tell AI; second, a philosophy of mind seminar where the same
  slogan was deployed to conclude that perception is a kind of controlled hallucination
  and that we never encounter the world directly, so naive realism is dead. In both
  cases the slogan ended the discussion, which is what made me suspicious.


  Please treat the slogan as a piece of language to be disambiguated rather than a
  theory to be explained. Lay out, as a list I can annotate, the distinct precise
  theses it could be expressing, ordered roughly from the blandest to the most radical.
  For each: state the thesis precisely enough that one could say what would count
  against it; give a verdict — near-platitude, substantive and defensible, substantive
  but contested, or overreach; and indicate which of my two disputants (if either)
  could actually get their conclusion from that reading. Some candidate readings I
  have in mind include: brains exploit statistical regularities and prior expectations
  in perception; sensory signals are explained by top-down predictions with bottom-up
  signals carrying only errors; perception is inference under an internal generative
