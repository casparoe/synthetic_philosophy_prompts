  Sub-case: intuitions explained away by assertion pragmatics (Gricean maneuver).

  - Stakes matter for the subject: interest-relative invariantism / pragmatic encroachment.

  - Stakes (or standards) matter for the attributor''s context: contextualism.

  - Truth-value fixed by context of use but assessed from other contexts can shift:
  relativism (MacFarlane). Diagnostic: disagreement cases — is there faultless disagreement?

  - Salience of error possibilities matters even without practical stakes: Lewis-style
