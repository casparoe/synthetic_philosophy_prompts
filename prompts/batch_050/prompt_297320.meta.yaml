  Fantl & McGrath) — pragmatic encroachment

  - Epistemic contextualism (DeRose, Cohen, Lewis) — "knows" is context-sensitive,
  attributer contextualism

  - Contrastivism (Schaffer)

  - Relativism about knowledge attributions (MacFarlane)

  - Maybe: pragmatic encroachment about belief/credence rather than knowledge (e.g.,
  Fantl & McGrath extend to justification; "knowledge-action principle").


  Diagnostic questions from the logical space:

  1. Bank cases / train case: Hannah and Sarah low stakes vs high stakes, same evidence
