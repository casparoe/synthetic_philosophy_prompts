  4. Error possibilities: does mere salience of an error possibility (without stakes)
  destroy knowledge? (Lewis''s Rule of Attention)

  5. Do stakes affect knowledge itself or only whether it''s appropriate to act on
  it? (Knowledge-action principle)

  6. Is knowledge contrastive (knows that p rather than q)?


  Combinations:

