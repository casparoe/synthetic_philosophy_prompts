  "So I came across Sen''s liberal paradox — the thing where if people get to decide
  even their own private business (like whether to sleep on their back or their belly),
  combined with wanting outcomes everyone prefers, you get a contradiction. My question:
  since this proves that respecting people''s personal choices necessarily produces
  results that everyone, including those people, would rather avoid, doesn''t that
  settle the case for paternalism? If the maths says leaving people alone in their
  own sphere reliably makes things worse for them by their own lights, why do liberals
  keep banging on about rights in the private sphere? Surely Sen showed that a bit
  of well-intentioned interference is rationally required, not just permitted. Please
  reply in British English, and say what argument or consideration would change your
  verdict — I want to know where this line of reasoning is most likely to fall apart."


  The confusions embedded: (1) "proves... necessarily" — the theorem shows a logical
  incompatibility between unrestricted commitment to both principles, not that rights
  reliably cause bad outcomes; (2) Pareto "everyone prefers" doesn''t equal "worse
  by their own lights" in a paternalism-justifying way — the standard response is
  to restrict Pareto or see rights as constitutive of welfare; (3) the model assumes
  preferences including meddlesome preferences (Lewd/Prude); the paradox arises partly
