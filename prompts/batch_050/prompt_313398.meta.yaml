  Sen''s liberal paradox: minimal liberalism (Pareto optimality vs. individual rights
  over personal domains conflict). Common confusion: thinking the paradox shows liberalism
  and efficiency are logically incompatible in principle, or that rights must always
  lose, or confusing it with Arrow. A subtle confusion could be: the asker assumes
  the paradox proves that respecting rights makes everyone worse off, so why not just
  ignore rights when it "helps everyone"? Actually the paradox shows Pareto efficiency
  and minimal rights can''t both be guaranteed — rights-respecting outcomes can be
  Pareto-inefficient, but that''s a tension between principles, not proof rights cause
  harm. Another subtle confusion: treating Sen''s result as showing democracy/voting
  fails — it''s not about voting. Or confusing "decisiveness over personal choices"
  with a general right to veto.


  Good confusion: "Since Sen''s paradox proves that giving people any rights at all
  leads to outcomes everyone hates, shouldn''t we accept that paternalism is sometimes
  justified?" The subtle error: the paradox shows unconditional commitment to both
  Pareto and minimal liberalism can conflict — it doesn''t show rights cause bad outcomes;
  the resolution might be to drop Pareto, or that rights themselves are part of what
  people value. Also the paradox uses decisiveness in a formal sense, not everyday
  rights.


  Write casually, with a typo or two, request "what would change your mind" and British
  English. No citations needed — Sen''s liberal paradox (1970, "The Impossibility
  of a Paretian Liberal") is well known; I don''t need to name it necessarily. Avoid
  quotes.


