  principle be obtained; Peirce speaks of conceivable effects on practice, including
  effects on our habits and expectations. Which is broader, and where does the breadth
  come from?

  3. Their respective attitudes toward metaphysics: the positivists wielded their
  criterion as a demolition tool; did Peirce intend his maxim to do the same work,
