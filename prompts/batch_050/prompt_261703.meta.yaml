  Cases for verdicts:

  1. A warehouse robot that completes its delivery route while carefully avoiding
  knocking over shelving — seems low impact beyond its task; fine.

  2. A robot that, to stay low-impact, disables the emergency sprinkler system so
  it can''t accidentally trigger it — feels like a big impact (interfering with the
  option set / safety).

  3. An agent that causes some change and then pays a janitor... no, an agent that
  makes a mess and then cleans it up before anyone notices — verdict: not low impact,
  but is it as bad as leaving the mess? Feels less bad but still not "low impact"
