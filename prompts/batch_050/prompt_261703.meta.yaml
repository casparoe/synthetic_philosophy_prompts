  (1) Carrying laundry upstairs, the robot steps around the cat and touches nothing
  else. Paradigm case of low impact. (2) Worried it might later knock over the hallway
  vase, the robot moves the vase into a locked cupboard "to keep things safe." This
  feels like a side effect, not the avoidance of one — even though impact-avoidance
  was the motive. (3) The robot spills a glass of juice and then cleans up so thoroughly
  that nobody can tell anything happened. Verdict: better than leaving the spill,
  but not impact-free; doing and then undoing still counts for something. (4a) The
  robot catches a falling water glass before it shatters on the floor — preventing
  a change, and clearly fine. (4b) The robot gently restrains a toddler who is about
  to draw on the wall with markers, since wall drawings would change the house — also
