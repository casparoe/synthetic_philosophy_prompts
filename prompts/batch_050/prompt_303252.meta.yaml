reasoning_summary: 'Let me pick a domain and type. Domains: moral particularism vs.
  generalism, Plato''s views on drunkenness, memes and Darwinian culture, euthanasia/assisted
  dying, program equilibrium.


  Type: "State a set of one''s own commitments and ask whether they hang together"
  fits well with euthanasia/assisted dying or moral particularism. Let me do euthanasia
  and assisted dying — the asker lists commitments: e.g., (1) voluntary active euthanasia
  is permissible for terminal illness with unbearable suffering; (2) there''s a moral
  difference between killing and letting die, so withdrawing treatment is fine even
  when active euthanasia... wait that would conflict with (1). Let me design genuine
  tensions and one apparent tension that dissolves.


  Commitments sketch:

  1. There''s a genuine moral distinction between killing and letting die — withdrawing
  life support at patient request is permissible even when actively ending life would
  not be (or at least it''s easier to justify).

  2. Voluntary active euthanasia is permissible for competent adults with terminal
  illness and unbearable suffering.

  3. Advance directives for euthanasia should be honored even after the person has
  lost capacity and is, by current evidence, content (the dementia case).

  4. Autonomy is the fundamental ground: what makes euthanasia permissible is the
  patient''s settled, competent choice, not the suffering per se.

  5. Non-voluntary euthanasia of severely disabled newborns... maybe too hot. Alternative:
  (5) It''s wrong to assist the suicide of someone with a treatable depression whose
  desire to die is a symptom.


  Tensions:

  - (1) and (2): if killing/letting die distinction is genuine and strong, and both
  kill and let die lead to same outcome with same intention... Rachels'' bathtub argument.
  If the distinction is real, active euthanasia needs extra justification; the usual
  defense of (2) is precisely that the distinction collapses (equivalence thesis).
  So the standard motivation for (2) undermines (1). Genuine tension.

  - (3) and (4): honoring an advance directive for a now-content, incapacitated patient
  can''t be grounded in current autonomy — the person now lacks the capacity whose
  exercise (4) says grounds permissibility. Also the person apparently isn''t suffering
  unbearably now, so suffering can''t do the work either. Genuine tension — this is
  the Dworkin vs. "then-self" debate, standard but non-obvious conflict.

  - (5) and (4): actually (5) is consistent with (4) — depression undermines competence,
  so autonomy grounding supports excluding it. That''s the apparent tension that dissolves:
  someone might think "if autonomy is what matters, why not the depressed person''s
  autonomy?" — answer: the commitment already builds in competence, and treatable
  depression defeats the competence/settledness condition. Good.


  Maybe also add: (2) and (1) again... The apparent tension: withdrawal of treatment
  (letting die) and active euthanasia with same intent/outcome. Or add a commitment:
  "I think doctors who conscientiously object shouldn''t be forced to perform euthanasia"
  — consistent.


  Let me finalize set of 5 commitments:


  1. There is a real moral difference between killing and letting die: withdrawing
  burdensome treatment at a patient''s request can be permissible in cases where actively
  ending that same life would not be.

  2. Voluntary active euthanasia is permissible for competent adults with a terminal
  condition and unbearable suffering.

  3. A valid advance directive requesting euthanasia should be honored even after
  the person has lost capacity — including when the person, by all current evidence,
  is content.

  4. What makes euthanasia permissible, when it is, is the patient''s autonomous,
  settled choice; relief of suffering matters, but without the choice, suffering alone
  can''t justify ending a life.

  5. It is wrong to assist the death of a person whose wish to die stems from a treatable
  depression.


  Genuine tensions: 1–2 (moderate; the standard route to 2 runs through denying the
  deep moral weight of the distinction in 1 — though one can reconcile by saying the
  difference is defeasible and overridden by autonomous request... actually that could
  be the fix), 3–4 (severe: autonomy-as-ground can''t cover the demented content patient;
  precedent autonomy move costs a lot). Apparent tension that dissolves: 4–5 (competence
  condition) or 1–2 might be seen as contradictory but can be reconciled... The notes
  say "plus at least one apparent tension that dissolves on inspection." 4-5 is the
  clean dissolver: someone might think autonomy commitment means respecting the depressed
  person''s stated wish, but the commitment is to autonomous choice, and treatable
  depression undermines the choice''s autonomy. Good.


  Also maybe 1 and 3: withholding treatment from a content demented patient... nah.


