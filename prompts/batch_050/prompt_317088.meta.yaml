  2. "Settle for $50k or I''ll file this (valid) lawsuit" — fine.

  3. "Give me $10,000 or I''ll tell your wife about the affair" — blackmail, clearly
  wrong.

  4. "If you don''t hire me back, I''ll report your labor violations to the regulator"
  — feels like legitimate leverage? Actually that''s extortion-y in some jurisdictions.
  Gut: fine-ish.

  5. Neighbor: "I''ll tell everyone about your affair unless you stop... " hmm, non-monetary
  demand. "I''ll reveal your secret unless you stop parking in front of my house"
