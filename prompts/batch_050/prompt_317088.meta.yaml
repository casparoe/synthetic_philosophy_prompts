  8. A journalist: "Unless you give me an exclusive interview, I''ll run the story
  with the bad facts only" — feels fine, maybe.

  9. Free case: "I''ll mow your lawn for $20" — fine (this is the contrast: offer
  vs threat).

  10. "I''ll stop being your friend unless you apologize" — fine.


  The classic tension: asking for money is legal; revealing true information is legal;
  combining them is blackmail. Also, threatening to do something you have a right
  to do (sue) in exchange for money is fine (settlement), but threatening to reveal
  an affair for money is blackmail. Some legal theories: it''s blackmail when the
  threat is to do X and demanding money doesn''t further a legitimate claim related
  to X (the nexus idea). E.g., threatening to report labor violations to get a job
  back — there is a nexus. Threatening to reveal affair for money — no nexus.


  The asker could give a tentative principle: "threats are fine when the threatener''s
