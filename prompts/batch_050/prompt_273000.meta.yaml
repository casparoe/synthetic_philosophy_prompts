  1. Propensity interpretation: fitness is a disposition/propensity to leave offspring,
  not actual survival; so "fittest survive" is not definitional—those with highest
  propensity need not actually survive (drift). (Mills & Beatty 1979; Brandon 1978.)

  2. Fitness as a theoretical/abstractive concept defined within mathematical models
