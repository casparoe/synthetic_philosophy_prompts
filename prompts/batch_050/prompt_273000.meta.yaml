  of conditions (variation, heritability, differential fitness — Lewontin''s recipe);
  the slogan is dispensable shorthand.

  4. Circularity is harmless because the principle is a schema that gains empirical
  content when fitness is independently operationalized in particular cases (e.g.,
  via life-history traits).

  5. Falsifiability is the wrong demand for a principle of a theory (like Newton''s
  second law — a framework principle).


