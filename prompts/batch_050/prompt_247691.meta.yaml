  cogitans, an immaterial "I").

  2. Lichtenberg''s objection: strictly proves only "thinking is happening" — no subject.

  3. The minimal/existential reading: proves only that at least one thought exists
  now.

  4. Hintikka''s performative interpretation: "I exist" is existentially self-verifying
  — uttering/thinking "I do not exist" self-defeats; it proves existence performatively
  rather than as an inference.

  5. The temporal-instant objection (from Gassendi/Hume-ish, and Bertrand Russell):
  proves only existence at the moment of thinking, nothing about persistence over
  time.

  6. The modest epistemic reading: proves that something exists (defeating universal
  doubt), regardless of what it is — i.e., a refutation of global skepticism only.


