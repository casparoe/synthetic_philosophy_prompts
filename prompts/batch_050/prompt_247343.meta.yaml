  Let me design with the careenium domain:


  Commitments a retired physicist might hold:

  (a) Everything is ultimately physics — causal closure of the microphysical; no new
  forces at macro level.

  (b) Symbol-level explanations (this program, this thought) are genuinely explanatory
  and indispensable — not just shorthand.

  (c) Downward causation is real: high-level patterns/symbols cause low-level events
  (e.g., my decision moves my neurons).

  (d) Supervenience: no difference at the symbol level without a difference at the
  substrate level.

  (e) In the careenium, the simmballs'' behavior is entirely fixed by the forces on
  the table; the simms (symbols) don''t push anything.

  (f) Deterministic substrate + genuine free agency... maybe too much.


  Genuine tension: (a) causal closure + (c) downward causation real → overdetermination
