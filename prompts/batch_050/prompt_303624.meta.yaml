  Options: "State a set of commitments and ask whether they hang together" fits well
  with lexical threshold negative utilitarianism and commensurability of pleasure
  and pain. Or counterfactual mugging/XOR blackmail — but example prompts already
  cover counterfactual mugging (first example). So better avoid duplicating that domain
  closely. Lexical threshold NU is good and less covered.


  Design belief set for a professor''s position:

  1. Classical utilitarianism is wrong because it demands creating miserable lives
  for tiny gains (repugnant-ish conclusion with torture) — so they hold lexical threshold
  negative utilitarianism: below a threshold of suffering, no amount of pleasure can
  compensate.

  2. They also hold that pleasure and pain are commensurable in principle — both are
  values on a single hedonic scale (needed for the threshold view to make sense? Actually
  tension: lexical priority seems to require incommensurability or at least a strong
  discontinuity; holding commensurability plus lexical threshold is a genuine tension
  — if they''re on one continuous scale, the lexical priority looks ad hoc).

  3. They accept the continuity of hedonic states — suffering varies gradually from
  mild discomfort to agony — genuine tension with lexical threshold (the threshold
  location becomes arbitrary; spectrum argument / continuity objection).

  4. They believe in diminishing marginal value of pleasure but constant (or escalating)
  disvalue of pain — could be coherent.

  5. They reject fanaticism: tiny risks of torture shouldn''t dominate decisions.
  Tension with lexical NU combined with expected value maximization — Magnus Vinding-ish
  issue: expected disvalue dominates, paralysis.

  6. Apparent tension that dissolves: they hold person-affecting intuition but also
  think we should reduce suffering of existing beings... Actually an apparent tension:
  they deny that adding happy lives adds value, yet they endorse bringing happy children...
  or they hold that the threshold is defined in terms of intensity but also say duration
  matters — that''s resolvable (multiply intensity × duration).


  Structure: professor auditing own views before submitting a paper. Commitments:

  (a) suffering below threshold: some suffering is so bad that no amount of pleasure
  compensates — lexical threshold NU.

  (b) pleasure and pain are commensurable — measurable on one scale, can trade off
  mild pains against pleasures.

  (c) hedonic states vary continuously — no natural joint in the intensity spectrum.

  (d) expected-value reasoning applies: they use cost-benefit analysis, reject fanaticism
  about small probabilities of extreme suffering.

  (e) duration matters linearly — twice the duration of the same pain is twice as
  bad.


  Genuine tensions:

  - (b)+(c) vs (a): if continuous single scale and commensurable, lexical priority
  at a threshold is hard to motivate — threshold appears arbitrary; the standard motivation
  for lexicality is discontinuity/incommensurability.

  - (a)+(d): lexical threshold NU with expected value: any tiny probability of threshold
  suffering outweighs huge certain pleasures; fanaticism/paralysis — professor says
  they reject fanaticism, tension.

  Apparent tension that dissolves:

  - (e) duration linearity vs (a): one might think aggregating durations of sub-threshold
  pains could cross threshold; but lexical threshold is about intensity, and duration
  aggregation of mild pains doesn''t make them threshold-level — actually this is
  a real debate (can many mild headaches aggregate to outweigh torture? In lexical
  threshold NU, no amount of mild suffering reaches the threshold — but duration of
  a single mild pain? The threshold is usually about intensity of individual suffering,
  so linear duration aggregation within a life... a mild pain lasting very long —
  some would say it can become very bad. There''s a genuine debate (Vinding, Österberg).
  Hmm, could present as apparent tension: someone might object that (e) lets duration
  build sub-threshold pain into threshold-level badness, but actually the threshold
