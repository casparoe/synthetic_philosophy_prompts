  a howler, avoid. Keep subtle.


  Let me draft the summary in a plausible popularizer voice, with 2 subtle misrepresentations:


  Draft summary (attributed to a podcast transcript or popular math book):


  "Here''s something wild. Cantor proved that the real numbers are uncountable — no
  list can contain them all. But the Löwenheim–Skolem theorem says that if the axioms
  of set theory have any model at all, they have a model whose domain is countable.
  So there is a countable structure in which the theorem ''the reals are uncountable''
  comes out true. Skolem''s conclusion was that this shows Cantor''s theorem doesn''t
  really prove what everyone thinks it proves: uncountability isn''t a fact about
  collections of objects but an artifact of which mappings we happen to have written
  down, so the real numbers are only ''uncountable'' relative to an incomplete inventory
  of bijections. The standard resolution is that the model just gets it wrong — the
  model thinks its reals are uncountable because it can''t see the enumeration that
  we, standing outside, can see. Some logicians conclude from all this that first-order
  logic is provably incapable of expressing mathematical concepts like finiteness
  and cardinality, which is why serious set theorists work in second-order logic."


  Misrepresentations:

