  for rational inference via God''s habits. Also whether occasionalism is motivated
  by piety vs by genuine philosophical argument (miracles — the Quranic story of Abraham''s
  fire not burning him).


  Write from journalist perspective, casual, a typo maybe.


  One person argues: Ghazālī anticipated Hume — his argument is epistemological, we
  only observe conjunction not necessary connection. Other says no, it''s metaphysical
  and driven by theology (miracles, God''s omnipotence), and unlike Hume he has a
  positive answer: God. Then dispute about whether Ghazālī''s view destroys science
  — he actually responds: our knowledge of the usual course is itself caused by God,
  and God makes us know it; also he concedes knowledge based on God''s habit. One
  says Ghazālī can still do medicine; other says that''s ad hoc.


  Also could bring in: discussion 17 has Ghazālī conceding for argument''s sake: suppose
  we grant that fire is the cause — then how can a prophet (Abraham) be thrown in
  fire and not burn? He answers: God can create in fire the property of not burning,
  or remove heat. So one side says Ghazālī denies necessary connection only to safeguard
  miracles; the other says the argument stands on its own.


  Another point: whether Ghazālī is really an occasionalist or actually allows secondary
  causes — some scholars (e.g., Marmura, Griffel) argue Ghazālī accepted that causes
  have efficacy within God''s creation. Actually there''s a scholarly debate: was
  Ghazālī a genuine occasionalist? Marmura argued he was more an "occasionalist with
  qualifications"; others say he accepted causal efficacy. That''s a nice niche-ish
