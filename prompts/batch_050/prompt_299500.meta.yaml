  The unilateralist''s curse: when a decision rests on individual members of a group
  independently deciding whether to act (e.g., publishing dual-use research, releasing
  information), if each acts on their own judgment, the action happens if any one
  of them decides it''s worth doing. Even if the group on average thinks it shouldn''t
  happen, the most optimistic/persuaded member triggers it. The more agents, the more
  likely action. Also naive vs. sophisticated unilateralists: a sophisticated agent
  conditions on being pivotal — being the one who acts means everyone else declined,
  which is evidence against acting; if everyone thinks sophisticatedly, no one acts
  and good things don''t happen either (the mirror problem — sometimes called the
  flip side).


  Poem form: a villanelle''s refrains return — good for the curse reasserting. Or
  a pantoum, where lines recur shifted. Pantoum is nice: each stanza''s second and
  fourth lines become first and third of next — like the judgment being passed from
  person to person. That structurally tracks the decision passing between agents.


  Make the prompt: journalist covering science and ideas, writing a piece or a sidebar;
  wants a poem. Casual, one to three paragraphs, maybe a typo.


  Structural requirements: refrains = the two "voices": the individual agent''s judgment
  ("my call is mine to make") vs. the pivotality insight. Villanelle: two refrains
  alternate and meet at the end. Refrain 1 could express the unilateralist''s confidence;
  refrain 2 the cursed arithmetic — the fact that someone will always decide yes.
  The final couplet where refrains meet = the moment the agent realizes their own
  act is just the sample maximum of everyone else''s judgment.


