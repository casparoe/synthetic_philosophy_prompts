  Idea: A student in a philosophy of science course describes a pattern: two competing
  theories are both consistent with all available evidence, but one wins out because
  people run a fictional scenario in their heads that makes one seem impossible —
  like Einstein''s elevator, Maxwell''s demon, Newton''s bucket. The student asks
  whether there''s a name for when a thought experiment doesn''t refute a theory directly
  but shifts which theory "feels" impossible... Hmm, that''s "intuition pump" adjacent.


  Alternatively, desiderata type: "what would an account of how thought experiments
  yield knowledge have to do?" List requirements: explain Galileo''s falling bodies
  (works without new empirical data), explain why some thought experiments fail (e.g.,
  Aristotelian ones), distinguish from ordinary reasoning, handle the "no new input,
  new output" puzzle, be consistent with the fact that thought experiments sometimes
  mislead (e.g., heat as caloric?), account for Galileo vs. Aristotle tower argument...
  This is good and doesn''t depend on niche facts. Famous examples: Einstein''s elevator,
  Galileo''s ship, Newton''s bucket, Maxwell''s demon, Schrödinger''s cat, Stevin''s
  inclined plane. Those are all well known, safe.


  Write casually, university student, one typo or two, format request: last line one-sentence
  summary or \answer{...}. For desiderata type, maybe ask for which single desideratum
  knocks out most accounts, with "Verdict:" line? Could ask: end with a last line
  "Biggest constraint:" naming which requirement excludes the most accounts. Or ask
  for one-sentence summary as last line. Let''s do: last line beginning "Bottom line:"
  naming the single requirement that does the most work.


  No quotes needed, no web needed. Write 1-3 paragraphs, casual, with typos like "definately"
  or "its".


  Draft:


  "So I''m taking a philosophy of science elective and we just spent two weeks on
  thought experiments — Galileo''s falling bodies tied together, Einstein chasing
  a beam of light, Newton''s bucket, the usual hits. Our prof keeps saying the big
  question is how sitting in an armchair and imagining stuff can teach you anything
  about the actual physical world, since you''re not collecting new data. Fine. But
  every account she assigned (Brown''s platonism, Norton''s argument view, some empiricist
  stuff) seems to handle some cases and totally whiff on others, and I want to figure
  out what to even ask of a theory here before I pick one for my term paper.


  So: write me the desiderata. What does an account of how thought experiments generate
  knowledge actually have to deliver? I want the requirements list — the cases it
  has to explain (e.g. why Galileo''s tied-bodies scenario genuinely rules out ''heavier
  falls faster'' without anyone dropping anything, why Einstein''s elevator works
  but plenty of medieval armchair physics was garbage), the puzzles it must dissolve
  (how do you get new conclusions from no new input — where does the extra come from?),
  the distinctions it can''t collapse (thought experiment vs. actual experiment you
  just haven''t run yet, vs. mathematical proof, vs. a vivid analogy that proves nothing),
  the facts it has to stay consistent with (some thought experiments convinced everyone
  and were later overturned — an account that says they''re infallible is out). For
  each one give the case or consideration that motivates it, not just the requirement.
  And flag which ones are non-negotiable vs. which are just what one camp insists
  on.


  Then, briefly, say how the main contenders do against the list — the a priori/platonist
  view, the ''it''s just a disguised argument'' view, and the empiricist ''mental
  model/simulation'' view — but keep that part short, I mostly care about the criteria.
  Oh and if some subset of the desiderata looks jointly unsatisfiable, say so explicitly,
  that''s the interesting part. End with a last line starting ''Bottom line:'' naming
  the single requirement that eliminates the most accounts."


  Check: mentions Brown and Norton — those are real (James Robert Brown, John Norton).
  Attributions: Brown = platonist/a priori view of thought experiments; Norton = argument
  view. These are well known and correct. Safe.


  Typos: add one or two, e.g., "definately" or "seperate". Keep casual.'
