  friend B says there are more victims in absolute numbers and new kinds of harm (cyberstalking,
  mass shootings as a category didn''t exist in stats). Ask: who''s right, and how
  should I decide whether to let my kid bike to school / whether to be optimistic?


  Also weave in the "what counts as violence" dimension: does dropping violent crime
  but rising self-harm counts? Does safer-but-more-surveilled count? Whether "the
  world is less violent" has a fact of the matter or is a choice of metric.


