  I''ve read LessWrong and the adjacent blogs for over a decade, and one reflex they''ve
  trained into me is suspicion whenever a price moves while the underlying physical
  object stays exactly the same. Which brings me to the art market and its treatment
  of attribution.


  The practice I have in mind: when a painting long accepted as the work of an Old
  Master is reattributed to a follower, a copyist, or a forger, its market price collapses
  by orders of magnitude overnight, and museums typically pull it from the walls even
  though not a single pigment molecule has changed. The collapse is steepest for forgers
  who didn''t even copy an existing work but painted something new in the master''s
  manner — objects that, on any purely visual measure, add to the world''s stock of
  beauty rather than merely duplicating it. Meanwhile the same institutions happily
  display replicas and casts when openly labeled as such, and visitors will queue
  for hours for the original while walking past a perceptually indistinguishable reproduction
  without stopping.


  Here''s my question. What theory of aesthetic value does this practice presuppose?
  Several candidates occur to me, and I want you to consider at least these before
  adding your own: (1) an experientialist view on which value supervenes only on the
  experience the object delivers, under which the practice looks simply irrational;
  (2) a genetic or historical view on which an object''s causal history — who made
  it, when, with what intentions — is partly constitutive of its aesthetic properties,
  so that the reattributed painting literally is a different aesthetic object; (3)
  a relational view on which appreciating art is a kind of communion with another
  mind, so a forgery is a lie told by one person and the "communion" was with someone
  else; and (4) a Hanson-style signaling account on which originals are positional
  goods and the discourse about aura and authenticity is confabulation around a status
  market. Note that these make different predictions about a hard case I''d like you
  to address: if a laboratory accident — a malfunctioning robotic arm with a pallet
  of period-correct pigments — produced a molecule-for-molecule duplicate of a newly
  discovered masterwork, should its value equal the original''s?


  Act as a philosopher of art who is also comfortable with economics and with the
  rationalist idiom I''m writing in. Work carefully: first brainstorm candidate implicit
  theories (including the four above), then do what the rationalist in me most wants
  — commit. Tell me which single reconstruction best explains the whole pattern of
  practice, including which parts it can''t explain; state what the practice strictly
  presupposes versus what it merely sits comfortably with; and give your verdict on
  whether the presupposed theory is defensible or whether the art world''s behavior
  should be filed under collective bias. I''d rather read a decisive answer I can
  argue with than a balanced menu of options.


