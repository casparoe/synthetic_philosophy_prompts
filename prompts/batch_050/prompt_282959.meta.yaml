  unambiguous kind; estates spend real money administering the work of authors long
  dead, and scholars spend careers in archives preserving papers whose authors never
  managed to preserve themselves. Copyright, in my country, outlasts the author by
  seventy years. My late teacher left instructions that her unfinished final novel
  be destroyed; her executors published it instead, and the literary press praised
  them for it, on the grounds that posterity''s claim outweighed hers. At the same
  time, the law in most places refuses the dead almost all standing: you generally
  cannot libel them, their control over their work expires, and posterity itself —
  the audience all this labor supposedly serves — is nobody in particular.


