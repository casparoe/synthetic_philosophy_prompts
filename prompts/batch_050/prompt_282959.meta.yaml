  Scheffler, sometimes called the afterlife conjecture: imagine that you would live
  out your natural life in full, but that shortly after your death — say, thirty days
  later — an asteroid would extinguish humanity. Scheffler''s suggestion is that for
  most of us, a great deal of what makes our projects matter would drain away under
  this condition, and that our valuing things therefore presupposes, far more than
  we notice, that humanity will continue after we are gone. I recognize myself in
  this more than I''d like to admit: the thought of my novels being read in 2200 moves
