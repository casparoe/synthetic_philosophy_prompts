  depends on future people, as Scheffler-style reasoning suggests, or could the whole
  practice be reconstructed in terms that make no reference to the far future at all
  — as a wager on near-term reputation, a present-tense satisfaction, or a form of
  self-continuation that doesn''t require actual future readers, only the current
