  Option: Karma as a theory of moral desert — commitments:

  (1) karma is a theory of desert: suffering can be deserved because of past wrongdoing;

  (2) the karmic mechanism must be naturalistic/impersonal, not a cosmic judge;

  (3) moral responsibility requires control — people aren''t responsible for what
  they couldn''t control;

  (4) the doctrine should have explanatory power for seemingly undeserved suffering
  (e.g., congenital disease);

  (5) rebirth across lives is essential — desert can span lives.


  Tensions: (1)+(3) vs (4): if suffering is explained as deserved, we seem committed
  to saying a child with a painful disease deserves it, which conflicts with intuitions
  about desert requiring the victim''s awareness/connection — but that''s the point
  of karma. Real tension: (2) impersonal mechanism vs (1) desert — desert is usually
  thought to require an agent who apportions; an impersonal mechanism delivering outcomes
  looks like mere causation, not desert. Also (3) control vs (5) cross-life desert:
  a person in this life has no memory or control over past-life actions; holding them
  responsible violates the control condition they endorse. Apparent tension that dissolves:
  (2) vs (4) maybe, or (1) vs (5) — actually karma spanning lives is standard. Also
  could add: they believe in compatibilism... keep short.


  Alternatively testimony: commitments:

