  3. Present dictatorship as "one voter always gets their way" — subtle: dictatorship
  in Arrow''s sense means the social ordering always matches one individual''s ordering
  regardless of others; also a common objection: the theorem applies to ordinal rankings
  and excludes interpersonal comparisons of utility.

  4. Common objection presented as refutation: e.g., "Sen showed Arrow''s conditions
  are too strong so the theorem is dead" — overstated.


