  coercion — misrepresentation.


  Error 2: "no democratic voting system can be fair" — Arrow''s theorem doesn''t mention
  democracy or fairness; the axioms are candidate criteria, and violations don''t
  straightforwardly equal unfairness; also escape routes (single-peaked preferences,
