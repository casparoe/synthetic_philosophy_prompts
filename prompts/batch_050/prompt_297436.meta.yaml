  I''m a PhD student in political science working on social choice... A colleague
  in another department summarized Arrow''s impossibility theorem for me as follows:
  ''Arrow proved that no democratic voting system can be fair. Any method of aggregating
  individual rankings into a social ranking either lets one voter act as a dictator,
  allows the social ranking between two candidates to be reversed by removing an irrelevant
  third candidate, or fails to guarantee that the group can unanimously get what everyone
  prefers. Since every real voting rule must therefore violate one of these requirements,
  fairness in elections is mathematically impossible, and the choice among voting
  systems is just a choice of which unfairness to tolerate.'' Please act as an expert
  in social choice theory and audit this summary carefully: which parts accurately
  state Arrow''s result, which are fair simplifications, and which misrepresent the
  theorem or its significance? In particular, I want to know whether the independence
  condition is correctly stated, whether "dictatorship" in Arrow''s sense matches
  the everyday meaning my colleague implies, and whether the closing claim that fairness
  is "mathematically impossible" follows from the theorem or overstates it. Think
  carefully and distinguish the theorem''s formal content from its philosophical interpretation.


  Check subtle misrepresentations: (a) the summary conflates "Pareto" with "unanimously
  get what everyone prefers" — actually Pareto: if everyone prefers x to y, society
  ranks x above y — "unanimously get what everyone prefers" is ambiguous, could be
  okay-ish but slightly off (unanimity is about rankings, not getting preferred outcomes).
  (b) "no democratic voting system can be fair" — overstatement: theorem is about
  social welfare functions with unrestricted domain, ≥3 alternatives, and the conditions
  are contested; also many voting rules violate different conditions and the theorem
