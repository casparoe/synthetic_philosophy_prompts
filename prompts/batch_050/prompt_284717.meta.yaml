  in Analysis in 1998.] Toward the end of their opening argument they write:


  [passage]


  Critics — most prominently Fred Adams and Ken Aizawa, in a series of papers beginning
  shortly after — argue that this passage commits what they call the coupling-constitution
  fallacy: from the fact that an external resource is causally coupled to an agent,
  and that removing it degrades performance, nothing follows about where cognition
  is constituted; a hammer is coupled to a carpenter too. They further insist that
  cognition needs an intrinsic "mark of the cognitive" — non-derived content, or processes
  of a specific psychological kind — which notebooks and iPhones lack. Clark and Chalmers,
  and later defenders such as Richard Menary, reply that the objection simply presupposes
  the boundary it is meant to defend; that what makes a process cognitive is its functional
  role, not its location or material; and that cognitive science already studies brain-body-world
  systems (Hutchins''s work on navigation, etc.). Robert Rupert has pressed a different
  objection: the proposed extended systems lack the fine-grained functional integration
  of real cognitive systems, so the inference fails on empirical, not conceptual,
  grounds. Meanwhile a "second wave" of proponents (Menary''s complementarity; Sutton)
  has shifted to talk of integration rather than parity, which critics read as a retreat
  that concedes the original thesis.


  Twenty-five years on, the literature is enormous and the positions have not converged;
  each side regards the other''s central move as a fallacy or a petitio.


  My working hypothesis, offered as a hypothesis: the dispute is not about any empirical
  fact — everyone agrees about the causal roles of notebooks, phones, and rotation
  buttons — but about which question the word "cognitive" is supposed to answer, and
  specifically about whether the boundaries of cognition are fixed by the explanatory
  interests of cognitive science or by something about the processes themselves. If
  that is right, the disagreement may be at bottom metatheoretical rather than factual,
  which would explain its persistence.


