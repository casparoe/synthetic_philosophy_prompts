  I am a novelist, two years into a book set in the seventeenth-century Indian Ocean:
  a Gujarati merchant house, a Dutch trading post, a Swahili port city. The structural
  problem that has defeated three drafts is, I have come to realize, the same problem
  on which a whole field of historical scholarship has been stuck for a generation:
  whether the past can be told from everywhere at once, or whether every telling picks
  a center, openly or by stealth.


  The scholarly dispute, as I have absorbed it through my research, runs like this.
  For thirty years or so, global historians have tried to write against Eurocentrism:
  tracing connections rather than comparing separate civilizations, treating Europe
  as one region among several, and showing that much of Asia matched Europe in prosperity
  and commercial sophistication until quite late. The critics reply that the enterprise
  recenters Europe even as it disowns it. The master question is still why Europe
  industrialized first — the ''great divergence'' question — which quietly installs
  Europe''s trajectory as the norm and everyone else''s as a deviation in need of
  special explanation. The working categories — market, state, capital, modernity,
  even ''the economy'' as a thing a society has — are European exports; so is the
  periodization that still organizes the shelves. And the archives, being largely
  the records of European companies and chanceries, decide in advance who gets to
  speak. The global historians answer that comparison and connection are the only
  alternatives to nationalist storytelling, that inherited categories can be revised
  in the using, and that declining the big question on account of its pedigree abandons
  it to the triumphalists. There the matter rests. The facts are largely shared; nobody
  has moved.


