  form is the hidden variable. A novel cannot be told from everywhere at once, because
  telling requires selection, selection requires a criterion, and any criterion a
  writer actually applies — whose agency matters, which changes count as transformation,
  what the story is finally about — is inherited from the tradition that trained her.
