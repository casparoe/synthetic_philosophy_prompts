  Gödel''s argument (roughly): in rotating cosmological models (solutions of Einstein''s
  field equations), there exist closed timelike curves; in such worlds time travel
  to one''s own past is possible; Gödel argues that in such worlds there can be no
  objective lapse of time; but those worlds are physically possible (same laws as
  ours), differing only in initial conditions; so if time''s lapse depends on contingent
  arrangement of matter, it can''t be a genuine objective feature; hence time is ideal
  in our world too.


  Objections one could list:

  1. The argument at most shows something about those possible worlds, not ours —
  why should the ideality of time in Gödel universes transfer to worlds like ours
  with global time ordering? (Gödel''s reply: time shouldn''t depend on contingent
  matter distribution.)

  2. The inference assumes the rotating models are physically possible, not merely
  mathematical solutions of GR — solutions may be unstable or unphysical (e.g., Hawking''s
