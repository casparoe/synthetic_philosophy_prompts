  4. Gödel''s premise that a real lapse of time cannot depend on contingent facts
  about matter distribution is itself contestable — maybe temporal structure is contingent
  too; relationalists would accept that happily.

  5. Empirically our universe doesn''t appear to be rotating (observational bounds
  on cosmic rotation), and Gödel universes don''t expand — so they''re poor models
