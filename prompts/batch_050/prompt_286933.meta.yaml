  or iterated elimination via dominance. Rationalist reader — common prior (Aumann''s
  agreement theorem) is huge in rationalist circles ("agreeing to disagree"). That
  fits perfectly. A classroom activity that makes people feel the force of the common
  prior assumption / Aumann''s agreement theorem.


  Alternatively, an activity for iterated elimination of dominated strategies — also
