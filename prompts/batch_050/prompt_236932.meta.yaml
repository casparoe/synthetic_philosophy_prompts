  XOR blackmail (Stuart Armstrong): a perfect predictor sends you a letter saying
  "I have predicted whether you will pay $1000 upon receiving this letter; I sent
  the letter iff (termite infestation XOR you''ll pay)." So receiving the letter means
  either you have termites or you''ll pay. If you pay when you receive the letter,
  then the letter existing implies termites... wait. Letter sent iff (termites XOR
  pay). If you receive the letter, then either termites&¬pay, or ¬termites&pay. Paying
  is evidence you don''t have termites (since letter + pay → ¬termites); refusing
  is evidence you do. Evidential reasoning says pay (to avoid believing termites).
  CDT says: paying costs $1000 and doesn''t change termites, so don''t pay — and then
  receiving the letter is bad news. The blackmailer exploits the evidential agent.


  Comparison angle: both involve a predictor who sets up a counterfactual payment
  structure; in mugging the payment is in the branch that didn''t happen relative
  to the reward; in XOR blackmail the letter''s existence is conditioned on XOR of
  fact and payment. Some argue they''re the "same" problem in different dress — paying
  in both cases is what an updateless policy does? Actually in XOR blackmail, UDT''s
  answer: an updateless agent considers the policy ex ante — what policy maximizes
  ex ante expected utility? If the policy is "never pay," then the letter is sent
  iff termites — you get true information about termites, never pay, and can act on
  it (treat the house). That''s great! If policy is "always pay," letter sent iff
  ¬termites... you pay $1000 whenever no termites and get no useful info. So UDT says
  refuse to pay in XOR blackmail, while paying in counterfactual mugging. So the comparison:
  both are problems where a predictor''s counterfactual reasoning links your payment
