  of the following is true: (a) my house has termites, (b) I will pay $1,000 upon
  receiving the letter. The letter itself says something like: pay up, and note that
  if termites are present but you weren''t going to pay, I warned you. I receive the
  letter. Whether I actually have termites is independent of the letter; the cost
