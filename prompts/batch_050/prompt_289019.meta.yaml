  — you need to see the reasons yourself ("moral testimony problem"). Draft the decision
  memo recommending whether to adopt her recommendation, engaging with whether pure
  moral testimony can justify a committee decision.


  Add a niche twist to avoid regurgitation: e.g., the twist that the decision will
