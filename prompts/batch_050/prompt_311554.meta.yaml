  drawn up in the first weeks, a consistent strand of policy, statements by generals
  about wanting war sooner rather than later. The famous scandal in the 1960s — a
  German historian arguing that his country had been grasping for continental dominance
  all along, and that the July crisis was more an opportunity seized than a trap fallen
  into — worked exactly this way: it made Germany look like a person who had wanted
  something for a long time and finally acted.


