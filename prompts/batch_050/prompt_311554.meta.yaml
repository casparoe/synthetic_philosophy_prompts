  into circumstances. Mobilization timetables that couldn''t be stopped, alliance
  obligations that forced hands, fear of being struck first, diplomats who misunderstood
  each other and slept badly. On this telling nobody willed the war at all; it happened
  to everyone, the way a stampede happens to a crowd.


  What strikes me is that both moves seem to exploit the same gap. With a person,
  we think blame requires something like a continuing self: the man who planned on
  Monday has to be the man who acted on Friday. With a nation, both sides get to choose
  whether there is such a self at all. The accuser assembles one out of decades of
  documents; the defender disperses it into a hundred separate actors each of whom
  had locally reasonable reasons. And here''s the part that really puzzles me: I''ve
  noticed I do the same thing in ordinary life. When I''m angry at my brother-in-law
  I assemble a narrative of his character from years of slights; when I''m defending
  myself I present each act as a separate response to a separate situation, and I
  experience the prosecutor''s move as a kind of cheating — you''ve stitched a person
  together out of incidents in order to have something to blame.


