  doctor, which means she wronged B even while doing the best thing available. That''s
  exactly what a genuine dilemma is.


  (5) Priya''s answer: complaints can be misdirected. The family''s grievance belongs
  to the situation, or to whoever was responsible for the blackout, not to a doctor
  who made the only decision open to her.


