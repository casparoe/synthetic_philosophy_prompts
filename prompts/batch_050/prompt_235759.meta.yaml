  two patients on ventilators in different wings, and the generator can power only
  one wing, so the doctor on call saves one patient and the other dies.


  (1) Priya argued the case can''t be a real dilemma. Morality can''t require the
  impossible ("ought implies can"), and the doctor can''t save both, so at most one
  patient had a genuine claim on her. Hard choices feel like dilemmas, but feeling
  torn is not the same as being trapped.


  (2) Daniel replied with what he called the residue argument. Suppose the doctor
  draws lots, saves patient A, and patient B dies. Surely she should grieve, and even
  apologize to B''s family — but you don''t owe anyone an apology for simply doing
  the right thing. The leftover guilt shows an obligation to B existed and went unmet.


  (3) Priya said guilt and apology don''t track actual wrongdoing. A surgeon apologizes
  to a family after a textbook operation that the patient doesn''t survive; survivors
  of disasters feel guilty for living. These are understandable reactions to bad outcomes,
  not evidence of violated duties. So the residue argument proves psychology, not
  obligations.


  (4) Daniel''s last move: fine, but B''s family has a complaint, and complaints have
  to be directed at someone. The family can''t lodge a complaint against bad luck
