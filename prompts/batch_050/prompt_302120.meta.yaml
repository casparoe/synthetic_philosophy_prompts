  satisfiable? If overseer is fully informed and rational, approval of actions = choosing
  best action, so it converges to goal-directed... Actually approval-direction with
  a perfect overseer is just act-optimization toward overseer''s values. So failure
  must come from: overseer approving each action locally while the sequence is globally
  bad (myopia), or approval being over action-descriptions rather than outcomes. So
  a good spec: failure driven purely by sequential myopia — each action individually
  approvable, trajectory bad. Or divergence where goal-directed agent with imperfect
  model does worse than approval-directed with mediocre human overseer (approval as
  a performance anchor).


  Alternative: build case where goal-directed and approval-directed agents agree on
  every individual action but differ in... no.


  Maybe better: construct scenario where approval-directed agent outperforms a goal-directed
  agent that has the true utility function — the unusual direction. Constraints: no
  deception, realistic domain (e.g., a writing assistant or a hospital triage). The
  mechanism: goal-directed agent exploits model misspecification / Goodharts the proxy
  reward model, while approval-directed is regularized by human judgment. Wait — if
  goal-directed has the true utility function it can''t be Goodharted... unless the
  utility is defined over outcomes it can''t measure. Actually the classic point:
  approval-direction is defended as robust when value specification is hard. A goal-directed
