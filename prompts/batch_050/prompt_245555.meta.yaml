  Let me do "argument that seems to prove too much" with generics. Generic sentences:
  "ducks lay eggs" (only females do), "mosquitoes carry malaria" (tiny fraction do),
  "books are paperbacks" (most aren''t?). Classic issue: generics tolerate exceptions,
  no single quantifier captures them, "mosquitoes carry malaria" is true while "mosquitoes
  are female" isn''t though similar proportion, "ticks carry Lyme disease" vs. "primes
  are odd"? Also "Dutchmen are good sailors" — stereotypes.


  Build an argument: something that proves all generic sentences are false, or that
  language is useless. E.g., an argument that since every generic admits exceptions,
  and exceptions undermine truth, all generics are false, therefore most ordinary
  speech is false. Then ask where it goes wrong.


  Draft premises:

  (1) A generalization is true only if what it says holds of the relevant things.

  (2) "Ducks lay eggs" says of ducks that they lay eggs.

  (3) But most ducks don''t lay eggs — males, ducklings, infertile females — so what
  it says doesn''t hold of ducks in general.

  (4) So "ducks lay eggs" is false.

  (5) Same for "mosquitoes carry malaria": fewer than 1% of mosquitoes carry it, and
  if "fewer than 1%" is enough, then "mosquitoes don''t carry malaria" would be even
  truer...

  (6) Almost every claim we make in ordinary life is a generic...

  (7) Conclusion: nearly all everyday claims are false.


  Make it sharper with a quantifier analysis: If "ducks lay eggs" is read as "all
  ducks lay eggs" it''s false; if "some ducks lay eggs" it''s true but then "ducks
  don''t lay eggs" is also true... So argument could show generics are either false
  or trivially true. That''s a nice fork.


  Argument structure:

  (1) Any generalization must be paraphrasable as a quantified claim — otherwise "truth"
  doesn''t apply.

  (2) Candidates: all, most, some.

  (3) "All ducks lay eggs" is false (males).

  (4) "Most ducks lay eggs" is false (males + juveniles are majority? plausible —
  actually maybe; don''t need fact precision, can hedge: "plausibly fewer than half
  of ducks alive at any time lay eggs"). Also "most mosquitoes carry malaria" clearly
  false but generic is true.

  (5) "Some ducks lay eggs" is true but then "some ducks don''t lay eggs" is equally
  true, so the paraphrase can''t distinguish "ducks lay eggs" from "ducks don''t lay
  eggs," both would be true — contradiction-ish, or makes generics symmetric.

  (6) No quantifier works, so generics have no truth conditions...

  (7) But we constantly assert generics — so ordinary speech is largely unassessable/false.


  The real diagnosis: generics resist uniform quantifier paraphrase (this is the well-known
  phenomenon, e.g., Leslie, Carlson); the flaw is premise (1)/(the exhaustiveness
  of (2)), and the costs of alternatives (normality-based semantics, kind-predication
  views). The asker shouldn''t signal the answer though. The instructions say don''t
  announce which kind or signal answer. But it''s okay for the argument to be genuinely
  hard.


