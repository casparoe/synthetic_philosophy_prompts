  ---


  I''m putting together a seminar unit on the definition of death and I want to pressure-test
  something. Here''s the practice as I understand it. Organ procurement in the US
  and lots of other places runs on the dead donor rule: you can take vital organs
  only from donors who are already dead. Two routes. Route one: brain death — catastrophic
  brain injury, whole-brain criteria met, heart still beating on a ventilator, organs
  procured. Route two, donation after circulatory death: a patient with a devastating
  prognosis (but not brain dead) has life support withdrawn per their wishes, the
  heart stops, the team waits a no-touch period of 2-5 minutes, declares death, and
  procures.


  Now the wrinkles that keep me up. First: after 2-5 minutes of arrest, circulation
  is not *irreversible* — you could often restart it with CPR or ECMO; it just won''t
  be restarted, partly because there''s a DNR. People in the literature mark this
  by saying the standard is permanence (won''t return) rather than irreversibility
  (can''t return). Second wrinkle, newer: some procurement programs now do normothermic
  regional perfusion — after death is declared by circulatory criteria, they restart
  circulation inside the donor''s body with a bypass machine to keep organs perfused,
  but clamp the vessels to the brain so the brain never gets blood again.


  So: what does this whole apparatus presuppose about what death is? Does the no-touch
  period make sense except as a proxy for loss of brain function — and if so, is the
  circulatory criterion doing any real work? Does the permanence reading presuppose
  that death is partly constituted by our intentions (what we plan to do with the
  body)? Does NRP show the operative criterion was always the brain one, so that the
  practice unofficially endorses a brain-centered view while officially using a cardiopulmonary
  one? I want you to reconstruct the implicit theory of death the practice runs on,
  separate what it strictly presupposes from what it merely sits well with, flag where
  its two routes presuppose incompatible things (if they do), and say what would have
  to change if we swapped in your preferred rival definition. Also tell me where the
  practice is just underdetermined and several theories of death would license it
  as-is.


