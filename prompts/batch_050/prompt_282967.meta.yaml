  Let me describe the practice concretely without leaning on specific citations:


  - Dead donor rule: organs can''t be taken unless the donor is dead (vital organs).

  - Brain death: whole-brain criterion allows procurement while heart still beating.

  - DCD: after withdrawal of life support, wait for circulatory arrest, wait 2–5 minutes
