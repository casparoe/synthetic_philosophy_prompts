  Let me do the "commitments hang together" type on conceivability as a guide to possibility.
  The asker (retired physicist) lists commitments that contain genuine non-obvious
  tensions and at least one apparent tension that dissolves.


  Commitments for conceivability:

  1. Zombies are conceivable, and conceivability is prima facie evidence of possibility.

  2. Water = H2O: I accept Kripke — once we know water is H2O, "water isn''t H2O"
  is impossible, even though it''s epistemically conceivable. So distinguish primary
  vs secondary conceivability, or epistemic vs metaphysical possibility.

  3. I think the conceivability-possibility link needs to survive cases where conceivability
  fails due to our limitations (e.g., a being could conceivably hold a true contradiction
  if confused?).

  4. Goldbach''s conjecture: its negation is either necessarily true or necessarily
  false; one of them is conceivable only apparently. So I accept that conceivability
  is at most defeasible evidence, not infallible.

  5. Something like: I think p-zombies are actually metaphysically possible (Chalmers-style),
  yet I''m also attracted to type-A physicalism or analytic functionalism? That would
  be the real tension.


  Genuine tension candidates:

  - Accepting zombies are metaphysically possible while also holding that the only
  coherent notion of conceivability (ideal rational conceivability) requires that
  whatever is ideally conceivable is possible — that''s fine.

  - Real tension: believing conceivability is a good guide to possibility in general,
  while accepting Kripkean a posteriori necessities — requires two-dimensional distinction;
  that''s manageable (apparent tension that dissolves via primary/secondary conceivability).

  - Another genuine tension: holding that zombies are conceivable and therefore possible,
  while also holding that the zombie scenario is physically impossible given actual
  laws and that possibility claims in science should track physical possibility —
  the scientist persona gives this: "I think possibility talk in my old field means
  consistency with the laws of nature, and I also use metaphysical possibility when
  doing philosophy; I don''t think these are two different notions, there''s just
  one modal notion." That''s a genuine tension with the zombie claim plus Kripke.

