  Good''s theorem details: Irving John Good, "On the Principle of Total Evidence"
  (1967, British Journal for the Philosophy of Science). The theorem shows that for
  an expected-utility-maximizing Bayesian agent facing a decision, the expected utility
  of first obtaining free costless information and then deciding is at least as great
  as deciding without it — provided the agent is a perfect Bayesian and will update
  by conditionalisation, the information is free, and receiving it doesn''t change
  the available acts or payoffs. Caveats: strategic/adversarial settings (other agents),
  costly information, non-Bayesian agents, information that changes what you can do
