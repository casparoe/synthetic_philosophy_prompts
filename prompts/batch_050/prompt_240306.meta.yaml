  you worse off ex post. Also dynamic inconsistency, and cases like not wanting to
  know (medical test for incurable disease) — a strict Bayesian with standard assumptions
  should still weakly prefer to know; the intuition against comes from emotional costs
  / anticipatory utility not in the model.


