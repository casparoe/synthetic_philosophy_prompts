  \ pushed\") vs exempting (\"he's a child\", \"he's schizophrenic\").\n- Subtle mistakes\
  \ to plant:\n  1. Conflation: claiming Strawson says the objective attitude is appropriate\
  \ only when someone is exempted — actually the objective attitude can be adopted\
  \ as a \"resource\" or refuge even toward normal adults, though it can't be sustained\
