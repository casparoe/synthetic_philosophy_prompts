  Possible final:


  "My flatmate has a doomsday-argument variant that I think proves far too much, but
  I keep losing the thread. Suppose demographers can tell us, to a fair approximation,
  that I am the 120-billionth human ever born, but cannot yet tell whether future
  minds will be biological, uploaded, or both. His reasoning:


  1. Given a total history with exactly N observers in my reference class, and ignoring
  all non-indexical evidence for the moment, the chance that a randomly selected observer
  from that history has rank about 120 billion is 1/N.

  2. Therefore a 200-billion-person history predicts my actual rank much better than
  a history with 10^15 observers, by a factor of five million.

  3. Evidence should be assessed by likelihood ratios, so this result remains a huge
  update in favour of the smaller history whatever the prior plausibility of stable
  interstellar civilisation happens to be.

  4. Since the conclusion follows from my rank alone, it cannot be overturned by empirical
  claims about safer technology, better institutions, etc.; those claims are already
  part of the rival histories being compared.

  5. Adding possible uploads to the reference class only increases N on the long-future
  hypothesis, so it makes that hypothesis even less likely rather than helping it.

  6. Thus armchair selection reasoning gives very high confidence that neither mass
  biological expansion nor mass uploading will happen.

  7. But this seems crazy: it lets any sufficiently early observer rule out every
  sufficiently large future, even one for which all the ordinary evidence is excellent.


  Which numbered step is the first bad one, and why does it look legitimate? If you
  think the real problem is the sampling setup in (1), say exactly what should replace
  it; if it is (3) or (4), explain the difference between evidence supporting a hypothesis
  and that hypothesis being overwhelmingly probable. Also address whether uploads
  really worsen the long-future hypothesis in (5), rather than merely changing the
