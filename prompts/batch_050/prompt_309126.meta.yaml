  I''d like an audit of a set of commitments I''ve arrived at on the special composition
  question — the question of what it takes for some things jointly to compose a further
  thing. Here is where I''ve landed:


  (1) Composition is restricted. Sometimes a plurality of things composes something
  further and sometimes it doesn''t; I reject both compositional nihilism (there are
  no composite objects at all) and unrestricted composition (any objects whatsoever,
  however scattered, compose a further object).


  (2) Composition is never vague. For any candidate things, it is always determinate
  whether they compose something. More generally, I hold that vagueness is always
  a feature of our representations and never of the world itself: there is no such
  thing as indeterminate existence or indeterminate parthood.


  (3) The correct answer should be conservative. It should deliver the ordinary objects
  of common sense — tables, trees, cats — and withhold the gerrymandered ones, such
  as the alleged object consisting of my left shoe and the moon. A view that achieves
  (1) at the price of denying tables is barely better than nihilism, as far as I''m
  concerned.


  (4) The answer may not rest on ''contact'' or similar physical relations. Whether
  some things compose a further thing should not turn on how near one another they
  happen to be, or on how tightly they happen to be stuck together. Such relations
  seem to me metaphysically shallow, unfit to mark a boundary in being.


  (5) Composite objects can survive turnover of parts. A cat persists through metabolism;
  a table persists through the replacement of a leg. Whatever answers the composition
  question must be compatible with this.


