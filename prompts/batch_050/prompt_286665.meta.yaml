  Draft:


  I''m on the five-member hiring committee of my department, and after a chaotic meeting
  last year I''m drafting standing rules for how we reach collective decisions. Before
  I circulate them, I want to check that my principles are jointly tenable. Here they
  are:


  (1) Our official positions must be logically consistent — we cannot, as a committee,
  hold both that a candidate meets our stated criteria, that we hire everyone who
  meets the criteria, and that we should not hire this candidate.

  (2) Every proposition before us, whether a factual premise or the final recommendation,
  is settled by simple majority vote, taken one proposition at a time.

  (3) Our final recommendation must be the one a majority of members actually endorse
  — the committee should never officially recommend an outcome most of us oppose.

  (4) The procedure must treat members symmetrically: no one''s vote counts extra,
  and no one gets a privileged role in fixing outcomes.

  (5) Deliberation beforehand is welcome but not required; the voting rule alone should
