  Pick a type. "State commitments and ask whether they hang together" fits dialetheism
  well. Or "argument proves too much" — wrong kind of reasons could work. Let me design.


  Dialetheism commitments set:

  1. Naive truth / unrestricted T-schema is non-negotiable — truth is transparent
  (disquotational), no hierarchy.

  2. Classical logic should be retained as the default for ordinary reasoning; paraconsistent
  logic is only needed at the boundaries (e.g., LP as the logic of paradoxical fragments
  only).

  3. Some contradictions are true (the Liar), but the world is largely consistent
  — "dialetheias are rare."

  4. Reject trivialism: not everything is true; explosion must fail.

  5. Classical recapture: inconsistent mathematics (e.g., naive set theory) can be
  non-trivial and useful; also, the asker believes that any good theory of truth must
  validate "the Liar sentence is not true" (i.e., wants the consistency of their own
  theory to be assertible?) — that could be a tension.


  Genuine tensions: (1)+(2): if you want the T-schema fully and modus ponens... Actually
  a classic tension: a dialetheist who accepts the Liar is true and not true, and
  accepts ¬(A ∧ ¬A) (non-contradiction) — can''t hold LNC as a theorem with material
  negation. Another classic: the Curry paradox — transparent truth plus classical
  logic plus "just true" — Curry''s paradox trivialises if you have contraction. Also
  "just true" problem: dialetheist wants to say some sentences are just true (not
  also false), but the only device they have is ¬(A∧¬A), which is itself compatible
  with A∧¬A in LP. That''s a genuine subtle tension: the dialetheist who believes
  "dialetheias are rare" can''t express that commitment in their own language without
  inconsistency (Priest discusses this; he uses a non-truth-functional operator).


  Apparent tension that dissolves: believing paraconsistent logic while using classical
  reasoning in everyday life — dissolves via classical recapture (consistent fragments
  behave classically). Or: rejection of explosion while accepting disjunctive syllogism
  in practice — dissolves since DS fails in general but holds for consistent subject
  matter.


  So the set:

  (a) Truth is fully transparent: every instance of the T-schema is true, including
  for the Liar sentence, and the Liar is both true and false.

  (b) Explosion is invalid; not everything is true — I''m no trivialist.

  (c) True contradictions are exceedingly rare, confined to self-referential edges;
  the actual world is consistent almost everywhere.

  (d) Classical logic remains correct for all ordinary, non-paradoxical reasoning
  (classical recapture).

  (e) A sentence being "just true" — true and not also false — is a status that a
  good theory must be able to state and that holds of most sentences.

  (f) Naive comprehension... maybe add: I accept naive set theory''s comprehension
  schema in full generality.


  Tension: (c) and (e) with transparent truth: "just true" claim — asserting ¬(A ∧
  ¬A) is itself consistent with A ∧ ¬A in LP, so you can''t express rarity. Also (f)
  with (c): unrestricted comprehension gives Russell''s set, and Curry-style constructions
  in naive set theory with transparent truth can yield triviality unless the logic
  restricts contraction — so (b)+(f) is in tension too: naive comprehension plus any
  reasonable logic with contraction gives Curry triviality. Priest handles it, but
  the asker who wants both full comprehension AND non-triviality needs a non-contractive
  logic, which then undermines (d)''s classical recapture. Good non-obvious tension.


  Apparent tension: (a) and (b) look contradictory (Liar both true and false + not
  everything true) but dissolve — dialetheism ≠ trivialism, that''s the whole point
  of paraconsistency. And (c) with (a) might look tense but Priest himself holds it.


