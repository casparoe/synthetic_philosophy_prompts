reasoning_summary: 'Let me pick a domain and type. I''ll go with "Clinical equipoise
  and the ethics of randomized trials" and the "Is a summary fair?" type — or maybe
  "Reference class problem" with the "does it have a name" type. Let me think.


  Option: "Present someone''s summary of a view and ask whether it is fair" — a journalist
  covers science/ideas, so clinical equipoise fits well. Write a plausible summary
  from an unnamed magazine article with subtle misrepresentations: e.g., conflating
  equipoise as "the researcher personally is uncertain" vs. community equipoise; saying
  equipoise makes trials unethical if any evidence favors one arm (overstatement);
  presenting the standard objection (equipoise collapses after first positive trial)
  as refutation.


  The journalist persona: covers science and ideas, so a piece on a drug trial, read
  a magazine summary. Keep short, formal. No quotes from real texts — I''m writing
  the summary myself, no citations needed.


  Draft:


  "I''m a journalist covering science and ideas, currently working on a piece about
  a controversial randomized trial... A long-read article I encountered summarized
  the concept of equipoise as follows..." Then ask for accuracy audit.


  Make the summary plausible with subtle errors:

  1. "Clinical equipoise means a doctor is genuinely uncertain, in her own mind, about
  which treatment is better" — misrepresents individual vs. community equipoise (Freedman''s
  formulation is about the medical community/expert disagreement, not personal uncertainty).

  2. "If any evidence exists favoring one arm, equipoise is destroyed and the trial
  is unethical" — overstatement; equipoise tolerates some evidence, it''s disturbed
  only by consensus/compelling evidence.

  3. "Equipoise was proposed to resolve the tension between the physician''s duty
  to the patient and the demands of science" — accurate.

  4. "Critics say equipoise is impossible in practice because the first positive result
  immediately destroys it, so the concept has been refuted" — presents an objection
  as a refutation; also the objection targets individual equipoise mostly.

  5. Maybe conflate equipoise with the uncertainty principle.


  Also possibly: "equipoise requires that patients be indifferent" — no.


  Ask: which parts would defenders accept, what''s a misrepresentation, whether the
  article''s conclusion (that the concept is dead and trials should be governed by
  expected-value considerations instead) follows.


  Keep it relatively short. Formal tone, journalist perspective.'
