  students are in group A (5), some group B (1), facilitator can only save one group;
  students must decide the procedure. Taurek''s view: give each person an equal chance,
  flip a coin, don''t aggregate. The activity could make students actually run the
  lottery and feel the discomfort when the group of 5 loses the coin flip.


