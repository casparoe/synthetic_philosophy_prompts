reasoning_summary: 'I''ll write a "prove too much" prompt on moral testimony, from
  a non-academic perspective, formal. The argument should be genuinely hard. Classic
  moral testimony debate: moral deference arguments. Let me build an argument that
  seems to show moral testimony is never rational, with numbered premises.


  Idea: argument that it can never be reasonable to form a moral belief on testimony.
  Premises: (1) If it''s reasonable to defer to testimony on p, it would also be reasonable
  to defer about what the good reasons for p are. (2) Moral beliefs are only held
  appropriately if held for the right reasons (understanding). Or a different structure:
  puzzle that moral testimony asymmetry arguments prove too much — they imply we also
  shouldn''t accept testimony about, e.g., legal facts or aesthetic facts... Actually
  the "proves too much" angle: the argument seems to show testimony is never appropriate
  even for non-moral matters, which is absurd — so the flaw must be somewhere. That''s
  a nice structure: argument against moral testimony whose reasoning generalizes to
  all testimony.


  Let me construct: Friend''s argument that moral testimony can''t transmit knowledge:


  (1) Testimony transmits knowledge only if the hearer would have been able to recognize
  the relevant reasons for themselves if they reflected... hmm.


  Better: classic worry — moral beliefs must be held with understanding, testimony
  gives belief without understanding, so moral testimony is always defective. Then
  note the parallel: mathematics/science/history testimony also gives belief without
  understanding of the reasons. So the argument proves testimony is defective everywhere
  — absurd. Where does it go wrong?


  Construct precisely:


  (1) A belief amounts to knowledge only if the believer could, at least in principle,
  explain why the belief is true — mere true belief on authority isn''t knowledge.
  (Plausible via understanding requirement.)

  (2) Someone who accepts a moral claim purely on testimony cannot explain why it
  is true beyond citing the authority.

  (3) So moral testimony never yields moral knowledge.

  (4) But (1) applies equally to history, geography, science: accepting on testimony
  you can''t explain.

  (5) So testimony never yields knowledge anywhere — absurd.

  (6) Hence either moral testimony is fine or... the argument proves too much.


  The real debate: the flaw might be in (1) — equivocation between explaining reasons
  vs. understanding; or the moral case is special because moral understanding requires
  grasping the reasons in a way factual knowledge doesn''t. Ask which premise to reject
  and costs.


  Keep the asker''s preference: they''d like to keep that moral testimony is somehow
  second-rate but not that all testimony fails.


  Write formally, non-academic voice, no citations, no quotes. Short.'
