  indeterminacy but critics say it''s worse than he admits.

  4. Objection that charity distorts — interpreting others as mostly rational misattributes
  beliefs; actual people are systematically irrational (Kahneman/Tversky heuristics
  and biases literature).

  5. Charity is patronizing/imperialist — forces others into our mold, erases genuine
  difference (cultural relativist/anthropological objection).

  6. The problem of irrational speech: malapropisms (Davidson himself on "prior theory
  vs passing theory" — actually that''s his own view). Davidson''s malapropism argument
  actually undermines a conventional language.

  7. Objection that radical interpretation presupposes too much — the interpreter
