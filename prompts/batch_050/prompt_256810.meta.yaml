  My closest friend and I have been having the same argument for about six years:
  which of our two countries is more liberal, Sweden (mine) or Norway (his). Neither
  of us has any training in political theory; we both work in logistics. Every Christmas
  the argument restarts, every Christmas it goes nowhere, because we never agree on
  what would even count as winning. I''ve decided to force the issue by drafting the
  kind of joint statement I understand disagreeing scientists sometimes produce after
  structured collaboration: a document both of us could sign that pins down exactly
  where we part ways.


  Write that document. Take my side as "Sweden is the more liberal society," his as
  "Norway is," and produce it in these sections, in this order:


  1. What we both accept (~200 words). Numbered claims both sides can sign... e.g.,
  that both countries are egalitarian, high-trust, high-tax social democracies by
  global standards; that both operate a state alcohol retail monopoly; that both restrict
  recreational drugs more than, say, the Netherlands; that "liberal" cannot simply
  mean "economically free," since on that reading both of us would lose to countries
  we agree are less liberal in everyday life.


  2. The disagreement, stated neutrally (~100 words). One or two sentences each side
  would accept as a fair statement of its own position, plus a sentence on what we
  are NOT disagreeing about (neither claims the other country is unfree or authoritarian).


  3. The cruxes (~400 words). Between four and six sub-questions such that settling
  one would move at least one of us. I suspect these include: whether liberalism should
  be measured by laws on the books or by lived outcomes; whether paternalistic restrictions
  justified by health or equality (alcohol monopolies, taxes on sugar and tobacco,
  strict drug policy) count as illiberal or as freedom-neutral; how much weight to
  give economic dimensions on which the countries genuinely differ (school vouchers
  and privatized welfare provision in Sweden, the scale of state ownership and the
  oil fund in Norway); and whether Sweden''s EU membership and later NATO accession
  versus Norway''s earlier Atlantic alignment say anything about liberalism at all.
  For each crux, state it as a question, not as a disguised version of my side.


  4. Evidence and predictions (~300 words, a table is fine). For each crux, name at
  least one concrete comparison, case, or body of evidence we would both accept as
  bearing on it, and write down in advance what each of us predicts it will show —
  so neither of us can move the goalposts afterward.


  Two constraints. First, no appeals to international ranking indices by name: my
  friend doesn''t trust them and I can''t defend their methodology, so treat any such
  index as at most suggestive. Second, where you state facts, stick to what is broadly
  known and uncontroversial; the document fails if either of us can dismiss it as
  error-ridden.


  ---


