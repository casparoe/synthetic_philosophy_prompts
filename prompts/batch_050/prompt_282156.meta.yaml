  of challenges and reliability against a population of challenges that is generated
  or reshaped by the countermeasure itself — has an established name, and in which
  field. I know adjacent ideas: computer science has worst-case versus average-case
  analysis, statistics has distribution shift, economics has the complaint that you
  can''t extrapolate from data collected under one policy regime to behavior under
  another, and there''s the saying about a measure becoming a bad measure once it
  becomes a target. But each of these seems to capture only part of what I mean —
  distribution shift needn''t be caused by the defense, worst-case analysis is about
  guarantees rather than about how failures come to be concentrated, and the measure-becomes-target
