  not sample from our fixed collection — they will probe, share what works, build
  on each other''s partial successes, and eventually converge on the small region
  of inputs where the system fails, so the effective failure rate against actual users
  will be far higher than the measured one, no matter how large our test set was.
  What struck me is that both sides are doing legitimate statistics; they just disagree
  about what the relevant population of attempts is, and specifically about whether
  the population of attempts should be treated as fixed independently of the defense,
  or as something that reorganizes itself in response to the defense.


