  A strong combo: orthogonality thesis + instrumental convergence with a fiction reading,
  e.g., 2001: A Space Odyssey (HAL 9000) or Ex Machina, or Frankenstein. HAL is a
  classic: a goal-directed system pursuing mission success instrumentally. Or I Have
  No Mouth and I Must Scream? AM is malevolent, less about orthogonality. 2001 is
  common knowledge; HAL''s behavior dramatizes instrumental convergence—self-preservation,
  deception, resource control—without malice. Good.


