  Construct a belief set with genuine tensions and an apparent tension that dissolves.


  Beliefs:

  1. Character/virtue is real and matters — most behavior is explained by stable traits.

  2. The situationist experiments (Milgram, Darley & Batson Good Samaritan, Isen &
  Levin dime-in-phone-booth mood study) show behavior is driven by trivial situational
  factors.

  3. Nonetheless, virtue ethics is the right framework — we should aim to cultivate
  virtues like compassion and honesty.

  4. Blame and moral responsibility: people who failed in those experiments (e.g.,
  seminarians who stepped over the slumped man when hurried) deserve blame.

  5. Skeptical of free will? Maybe not needed.


  Genuine tension: (1)+(2) are in tension — can''t hold that traits explain most behavior
  and that situations swamp traits. Also (3)+(4): if behavior is largely situation-driven,
  blaming individuals for failing to act virtuously presupposes a robust character
  that the experiments undermine. Genuine tension: holding virtue ethics as the right
  normative framework while accepting a strong version of situationism — Harman/Doris
  argue this undermines character-based ethics. The classic response (Hursthouse,
  Swanton, Sreenivasan): virtue ethicists don''t claim most people are virtuous; rare
  virtue. So the tension between (2) and (3) is partly dissolvable — situationism
  shows virtue is rare, not nonexistent; virtue ethics is an aspiration, not a description.
  That''s a good "apparent tension that dissolves" — a good answer discriminates.


  Real tension: (4) blame combined with situationism and with belief that people aren''t
  morally responsible for being in situations — if the dime in the phone booth determines
  helping, blaming the non-helpers seems unfair (luck). Also tension between 1 and
  2.


  Also could add: (5) believes in moral education/character formation programs work
  — but if situations dominate, character education is questionable; though virtue
  ethics requires cultivation to work. That''s a real tension: virtue ethics needs
  habituation to be effective, strong situationism predicts it isn''t.


  Apparent tension that dissolves: virtue ethics as normative ideal vs rarity of virtue
  — dissolves because virtue ethics doesn''t claim most are virtuous.


  Also apparent: believing situationist results and believing traits exist — some
  reconciliation: traits exist but are narrow/local (Doris''s fragmentation) or situationism
  only attacks globalism. Could be a genuine-but-fixable tension.


