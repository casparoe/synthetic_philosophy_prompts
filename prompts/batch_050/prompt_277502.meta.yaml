  Plan for the summary (plausible, mostly right, with one or two subtle misrepresentations):


  Something like: ''Jeremy Bentham thought the whole idea of natural rights was "nonsense
  upon stilts": since rights only exist when a government passes a law creating them,
  talk of rights people have independent of any legal system is literally meaningless,
  on a par with talk of unicorns. And because there are no natural rights, Bentham
  concluded there can be no real constraints on what a government may do to people
  — law is just the sovereign''s command, and the only question is whether a law maximizes
  happiness. His hostility to rights-talk is why utilitarians ever since have had
  trouble taking rights seriously.''


  Misrepresentations:

  1. "literally meaningless, on a par with talk of unicorns" — Bentham thought rights-talk
  without law was nonsense in the sense of falsehood/mischief, but actually he called
  "natural rights" simple nonsense and "imprescriptible natural rights" nonsense upon
  stilts — the "stilts" qualifier attaches to "imprescriptible" rights. Also Bentham''s
  view: rights exist only via law — that''s roughly right ("right is, with me, the
  child of law"). But saying the nonsense claim means rights-talk is like unicorn-talk
  overstates: Bentham''s complaint is partly that such talk is mischievous — used
  to stir up insurrection — and that it''s a confusion, not just false. Actually,
  is "meaningless" a misrepresentation? Bentham did call it "nonsense" — but his critique
  is more nuanced: he says the language has no determinate meaning and serves as a
  cover for selfish passions. Many scholars note Bentham''s critique is partly pragmatic:
  rights-talk is "terrorist language" (he called it that re the Declaration of Rights).
  So "literally meaningless on a par with unicorns" is an overstatement.


  2. "no real constraints on what a government may do" — this is the key misrepresentation.
  Bentham thought utility provides constraints; bad laws are bad, and moral criticism
  of law is possible. He distinguished real (legal) rights from the claim of natural
  rights, but he didn''t conclude governments may do anything — the principle of utility
  constrains, and he advocated legal reform precisely because existing law violated
  utility. Also, utilitarians can support legal/institutional rights. The conclusion
  "why utilitarians ever since have had trouble taking rights seriously" is a standard
  objection presented as established.


  3. Conflation: "natural rights" vs "imprescriptible rights" — Bentham''s stilts
  line targets imprescriptible rights (rights that can''t be taken away). The summary
  could conflate Bentham rejecting natural rights with Bentham rejecting rights that
  constrain law at all — or claiming Bentham denied anyone has moral claims against
  government.


