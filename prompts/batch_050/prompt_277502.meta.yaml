  thought it had dangerous determinate-ish uses. Hmm, actually the "means whatever
  the speaker wants" is not far off some readings. The better subtle error: the summary
  says Bentham''s argument is that since natural rights don''t exist, laws can''t
  be criticized in rights terms at all — but Bentham happily criticized laws via utility
  and even used rights-language for legal rights; his objection was to rights claimed
  as prior to and binding on law.

