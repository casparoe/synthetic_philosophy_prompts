  a campaign, remembers the flogging. Later, as an old general, he remembers his deeds
  as an officer but has forgotten the flogging. On Locke''s criterion the officer
  is the boy (he remembers the flogging), and the general is the officer (he remembers
  the officer''s deeds), but the general is not the boy (he has forgotten the flogging).
  Identity, however, is transitive, so Locke''s criterion yields a contradiction.


  Reid also presses that Locke''s account is circular: since genuine remembering already
