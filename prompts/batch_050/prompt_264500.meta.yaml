  Let me construct a genuinely good disagreement about finks and masks.


  Background: A disposition like fragility: an object is fragile iff it would break
  if struck. Conditional analysis: x is disposed to M when C iff x would M if C obtained.
  Finks (Martin): a disposition can be present but the conditional fails because the
  disposition would be removed when the stimulus occurs (e.g., a sorcerer who would
  remove fragility if the glass were struck), or absent but the conditional true because
  the disposition would be acquired (electro-fink). Masks (Johnston, Bird): the disposition
  is present, stimulus occurs, but manifestation is prevented by an antidote — e.g.,
  fragile glass wrapped in packing material doesn''t break when struck, yet it''s
  still fragile. Masks block the manifestation after the stimulus; finks remove/instantiate
  the disposition in response to the stimulus.


  A good "in the weeds" dispute: e.g., about whether mask cases can be handled by
  building the absence of masks into the stimulus condition ("if struck while unprotected"),
  and whether that leads to a regress or triviality — or whether finks and masks collapse
  into each other.


  Let me draft a multi-round disagreement with numbered moves, both sides decent.


  Dispute: Two colleagues (or graduate students) at a department colloquium. Let''s
  make the professor the bystander reporting.


  Disagreement design:


  Round 1: Colleague A defends the simple conditional analysis against mask counterexamples
  by refining the stimulus: the glass wrapped in bubble wrap that doesn''t shatter
  wasn''t "struck" in the relevant sense — striking conditions weren''t met. So masks
  are handled by getting the stimulus condition right; fragility = would break if
  struck hard enough, absent interfering protections.


  Colleague B replies: this strategy has no principled stopping point. Any failure
  to manifest can be redescribed as the stimulus condition not being fully met. The
  analysis becomes: fragile iff would break if struck in conditions where nothing
  prevents breaking — which is circular, invoking the very notion of an unmasked manifestation.
  "Ideal conditions" can''t be specified without reference to the disposition itself.


  Round 2: A concedes circularity for masks but argues finks are different and still
  fatal: in Martin''s electro-fink case, the wire is live (has the disposition) but
  if connected, the fink would make it dead before current flows — here the stimulus
  genuinely occurs, and no redescription helps because the disposition itself is removed
  upon stimulus. So even a circular-refined analysis fails; we need to give up conditional
  analyses entirely and take dispositions as primitive.


  Round 3: B now defends conditional analysis against finks: the electro-fink shows
  the conditional tracks something time-indexed — we can say "would M at t if C at
  t and the disposition retained." Or: finks are cases where the causal basis is extrinsic/relational;
  restrict the analysis to intrinsic duplicates... Actually classic move: the conditional
  analysis fails for finkish cases but we can distinguish masks (disposition retained,
  manifestation blocked) from finks (disposition removed), and B might argue A''s
