  The new case should split candidate rules. Candidate rules:

  1. Cognitive/rule knowledge: knows if they can state the rule.

  2. Affective capacity: knows only if capable of feeling the relevant emotions (empathy,
  guilt) — the "moral/empathic" view (e.g., psychopaths lack moral knowledge because
  moral knowledge requires affect).

  3. Motivational/internalist: knows only if knowledge would normally motivate.

  4. Counterfactual responsiveness: would refrain in suitable circumstances.


  Design verdicts so that two rules diverge on the new case. Example new case: an
  acquired sociopath (brain tumor patient) who previously was normal, now shows psychopathic
  traits — or a psychopath who has learned to care via... hmm. Or: a psychopath who,
