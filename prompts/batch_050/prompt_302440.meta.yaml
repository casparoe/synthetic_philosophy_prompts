  Program equilibrium: Tennenholtz (2004) — players submit programs, programs can
  read each other''s source code; "clique bots" cooperate with identical copies. Key
  issues: programs that are syntactically different but functionally equivalent; cooperation
  requires proof that the opponent cooperates iff you do; Löb''s theorem / bounded
  Löbian cooperation. Real-world analogues: institutions verifying each other, treaties
  with inspection.


  A thought experiment prompt: design a non-science-fictional scenario (e.g., two
  firms, two states'' election officials, two AI agents) where two agents can fully
  inspect each other''s decision procedure yet a program-equilibrium style cooperation
  fails because of a specific structural feature (e.g., procedures differ in irrelevant
  syntax, or one party can''t commit to the inspection being complete). Constraints:
  no literal source code, realistic. Hmm, but without source code, is it still program
  equilibrium? The inspection is the key feature.


  Alternative: construct a game in which program equilibrium reasoning gets the "wrong"
  answer — where following program equilibrium leads to defection between two agents
  who are, in ordinary terms, trustworthy. Or where cooperation via code-matching
  rewards superficial mimicry.


  Another idea: a scenario where adding a proof-carrying/commitment device flips the
  Nash equilibria. Specification: build a two-player one-shot game where each player
  can show the other its entire decision procedure; program equilibrium achieves cooperation
  in prisoner''s dilemma; but in your constructed game, mutual code transparency makes
  cooperation *harder* than ordinary play. That''s a nice hard spec: transparency
