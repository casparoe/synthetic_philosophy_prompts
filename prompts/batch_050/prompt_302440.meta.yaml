  infinite regress (both wait to simulate the other — "I''ll do what you do" leads
  to a deadlock). That''s a known issue: two programs each simulating the other loop
  forever. Construct a case where code transparency makes things worse because each
  program''s policy is "cooperate iff the other provably does," and both run out of
  verification budget. Then compare: ordinary players with a bit of trust would cooperate,
