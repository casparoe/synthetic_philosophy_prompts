  and a whole cosmos. In such a universe, these fluke minds vastly outnumber evolved
  observers like us. Fine so far. But then the response to the model isn''t "here''s
  why the physics is wrong" or "here''s an observation that rules it out." The response
  is: if this model were true, then statistically *you* would almost certainly be
  one of the flukes, your memories would be fabricated, the experiments you think
  you ran never happened — so the model has to go. The model is rejected because of
  what it says about *you*, not because of any measurement.


  Another instance, maybe: people dismiss "we''re living in a simulation" partly on
  the grounds that if it were true, all our physics would be physics of a fake world
  and couldn''t be trusted — as if that were itself a point against the hypothesis
  rather than just an awkward consequence.


  And it shows up outside physics too: radical skepticism gets waved off as "self-defeating"
  — if you believed you were deceived about everything you''d have no grounds for
  believing it — even though the skeptic''s hypothesis is perfectly consistent, just
