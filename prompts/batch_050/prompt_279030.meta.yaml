  - Desiderata

  - Verdicts on cases → principle


  Good combos:


  1. "Verdicts on cases → principle" works great with doing vs. allowing / killing
  vs. letting die — classic trolley-style case intuitions. The asker gives verdicts
  on cases and asks what principle captures them. Very natural fit.


  2. "Desiderata" works well with the frame problem — what must a solution to the
  frame problem deliver? Or with "What failure looks like" — desiderata for a theory/criterion
  of AI failure (distinguishing influence-seeking from value drift).


  3. "Taxonomy" could work with private language (positions on rule-following) or
  nuclear power.


  The "What failure looks like" domain is interesting and niche — influence-seeking
  systems vs. slow value drift. Desiderata type: "what would a theory/diagnostic of
  AI system failure have to deliver to distinguish scheming/influence-seeking from
  slow value drift?" That''s a nice in-the-weeds prompt. It injects niche ideas (the
  asker can stipulate some).


  Alternatively, the cases type with doing/allowing: give verdicts like withdrawing
  life support vs. lethal injection, failing to donate to charity vs. harming, the
  loop case, etc. This is well-trodden though — models have seen trolley problems
  a million times. But the prompt asks for a principle capturing specific verdicts,
  which is less regurgitatable.


  The frame problem + desiderata: "what must a solution to the frame problem deliver
  — handle the ramification and qualification problems, work at human timescales,
  not just be classical-logic tricks, handle relevance..." Contenders: STRIPS assumptions,
  situation calculus with frame axioms, non-monotonic logics, procedural approaches,
