  2. In cases of transformative experience (e.g., having a child), you can''t rationally
  decide by imagining outcomes, so the rational approach is to decide based on...
  Paul''s response: decide based on whether you want the transformation itself / revelatory
  approach.

  3. Commitment to informed consent: e.g., one should be able to consent to medical
  procedures only if adequately informed — tension with transformative experiences.

  4. Preference change is not inherently irrational / akrasia... Hmm.


  Good rationalist-flavored set:

  (a) Rational choice = maximizing expected value according to one''s current utility
  function (orthodox decision theory).

  (b) Whether to have a child is a personal choice that should be made autonomously
  and rationally, not outsourced to tradition or social pressure.

  (c) Paul is right that first-time parenthood is epistemically and personally transformative
  — you cannot know what it will be like or who you will be.

  (d) It''s irrational to change your utility function just because you predict you''ll
  want different things later (no "preference change for its own sake"); e.g., you
  shouldn''t take a pill that makes you love heroin.


  Tension: (a)+(c)+(b): if parenthood is transformative, your post-decision utility
  function differs, and you can''t compute expected value under current values — so
  (b)''s demand for a rational autonomous choice can''t be met by (a). Genuine tension.


  Also (d) vs choosing parenthood: choosing to become a parent is choosing a transformation
