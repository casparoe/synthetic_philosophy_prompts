  The fairness-audit type with the unilateralist''s curse seems strongest and most
  "in the weeds." The unilateralist''s curse: when each of a group decides independently
  whether to take an action that''s valuable if done once (or by one person) but the
  decision is made unilaterally, the action tends to be undertaken when it shouldn''t
  be, because the most optimistic agent acts. Bostrom, Douglas, Sandberg paper.


  Subtle misrepresentations to embed in a friend''s summary:

  1. Presenting it as showing that unilateral action is irrational or that the agent
  who acts is biased/irrational — actually the problem arises even if every agent
  is a perfect Bayesian rational agent; the curse is structural (selection effect
  on estimates), not a result of individual irrationality. This mirrors the winner''s
  curse.

  2. Overstating: "so it proves you should never act alone on your own initiative
  / always defer to consensus" — the actual conclusion is about lifting the curse
  via deliberation, sharing estimates, or unilateralist''s-curse-aware adjustment;
  not that initiative is bad.

  3. Conflating the winner''s curse with the unilateralist''s curse — could have the
  friend conflate them slightly, or describe it as "just groupthink" or "just the
  bystander effect."

  4. Saying the curse gets worse with more people — actually that''s true (more people,
  higher max of estimates, more likely someone overestimates). So keep that accurate.

  5. Maybe: friend says "it applies whenever a group could benefit from an action"
