  Prompt draft (formal, British English, journalist):


  I am writing a long-form piece for a science-and-ideas magazine on counterfactual
  history, and I keep encountering the same analogy, deployed by historians of a structuralist
  bent: Hitler was merely the spark, and Weimar Germany the dry tinder; a forest fire
  requires both, but any spark will do once the tinder is ready, so fixating on the
  man is like crediting one match for a fire that lightning would have started anyway.
  The conclusion licensed is that some form of aggressive, antisemitic, revanchist
  regime in Germany was close to inevitable by 1933, with or without Hitler.


  Audit the analogy. Set out the correspondence explicitly: what plays the role of
  the spark, the tinder, the oxygen, the wind, the resulting fire. Then identify where
  the mapping breaks: sparks in fires are interchangeable in a way leaders plausibly
  are not (the fire''s size may be fixed by the fuel, but the war''s character — its
  timing, targets, genocidal intensity — may depend on which spark); fires do not
  strategise; combustion has no equivalent of institutional veto players, succession
  struggles, or the Führerprinzip amplifying one man''s obsessions. Note what the
  analogy quietly imports: a deterministic physicalism in which outcomes are fixed
  by conditions and agents are epiphenomenal — precisely the contested premise it
  is meant to establish. Ask: can the conclusion (structural inevitability of something
  like the Third Reich) survive once the disanalogies are on the table? Distinguish
  weaker and stronger versions: some Nazi-like regime vs specifically the Holocaust
  and Barbarossa. And whether a better analogy exists — e.g., a pilot of an already-diving
  aircraft vs a spark — and what it changes.


