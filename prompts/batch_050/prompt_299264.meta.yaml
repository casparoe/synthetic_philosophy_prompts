  the idea is coherent at all. Draft the joint statement that a proponent and a critic
  of moral trade could both sign after a good-faith adversarial collaboration. Take
  the proponent to hold that moral trade is ordinary cooperation extended across irreducibly
  different values, and that refusing it out of squeamishness forfeits real good;
  take the critic to hold that a moral commitment bargained away ceases to function
  as a moral commitment, so the "gains" are purchased by hollowing out the very values
  being served.


