  I''m a PhD student in philosophy of science working on classification in psychiatry,
  and I''ve been trying to work out when a diagnostic category counts as a "looping
  kind" in Hacking''s sense versus when changes following classification are something
  else. I have verdicts on cases; I want the principle behind them.


  Cases:

  1. A cluster of patients receive a new diagnosis; after the label circulates in
  support groups and media, some reorganize autobiographical memories to fit the prototype,
  and symptoms shift toward it. — looping.

  2. A diagnosis leads insurers to reimburse only certain treatments; patients'' symptoms
  shift because everyone now receives the same drug. — not looping (or looping? I''d
  say this is an institutional effect, not the classic looping of self-conception;
  but maybe I want it to count differently...). Verdict: feels different from case
  1 — the classification changed the people but not through their awareness of being
  classified.

  3. A researcher redefines a biomarker threshold; the patient population changes
  but no patient''s self-understanding changes — not looping, mere re-sorting.

  4. A label becomes stigmatized; people conceal symptoms, so measured prevalence
  drops though nothing about the people changed except behavior under observation
  — verdict: not looping in the interesting sense? Or it is? Maybe verdict: this is
  a looping effect but of the "observer-facing" kind... I need a tension.

  5. Patients learn their diagnosis and deliberately act against the prototype to
  resist the label — verdict: looping, even though they move away from the classification.

  6. A historical case: a diagnosis disappears from the manual; the syndrome itself
  seems to vanish over a decade — verdict: evidence that the kind was looping-dependent.


  Tension: case 2 vs case 5 — in 2, change not routed through self-awareness doesn''t
  feel like the looping that matters; in 5, awareness is present but moves people
  away from the prototype, yet it feels like paradigm looping. Also case 4: concealment
  is mediated by awareness but changes only the data, not the underlying condition
  — do I want the principle to distinguish "the kind changes" from "the evidence about
  the kind changes"?


  Ask: is there a coherent principle (maybe distinguishing routes of influence: self-ascription-mediated
  vs institution-mediated vs measurement-mediated)? Which verdicts must go? Predictions
  on new cases (e.g., AI-driven diagnostic tools whose predictions are shown to patients;
