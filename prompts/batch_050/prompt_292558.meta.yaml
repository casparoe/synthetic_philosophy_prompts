reasoning_summary: 'Let me pick a domain and type. "The sunk cost fallacy: is honoring
  sunk costs always irrational?" with Type "Report one''s verdicts on a set of cases
  and ask what principle captures them" seems like a great fit.


  The prompt should give verdicts on concrete cases — some sunk cost honoring feels
  irrational, some feels fine — with at least one pair hard to reconcile. Casual,
  elaborate, maybe a typo or two. No citations needed, no quotes from real texts.


  Cases to include:

  - Movie ticket: paid $15, movie is boring, staying vs leaving — leaving is right;
  staying is irrational.

  - Finishing a degree with one year left that you hate but career prospects? Hmm,
  that''s not sunk cost exactly—remaining cost matters.

  - Reading a book you paid for and hate: finishing vs dropping.

  - Relationship: "we''ve been together 7 years" — staying feels like sunk cost but
  maybe not?

  - War: "we can''t leave, too many have died" — clearly fallacious (or is it?).

  - A repair on an old car: you already paid $800, now another repair needed — deciding
  based on the new repair vs value of car.

  - Buying nonrefundable gym membership — using it to "get money''s worth" even when
  you''d rather do something else.

  - A meal: continuing to eat when full because you paid.

  - Keeping clothes you never wear because they were expensive.

  - Attending an event you bought tickets for in a snowstorm — the classic: tickets
  purchased vs free tickets; if you''d enjoy less than the trip''s cost, go anyway
  if expensive?


  The hard-to-reconcile pair: e.g., "staying in the boring movie is irrational" vs
  "using a gym membership you hate to get your money''s worth is understandable/sensible"
  — both involve paid money and continuing something unpleasant. Or: abandoning a
  PhD after 4 years feels tragic but maybe honoring sunk costs there could be legitimate
  as a signal/commitment device.


  Better pair: "Soldier deaths in war (''can''t withdraw now, too many have died'')
  = irrational" vs "a couple who stays together partly because of the 15 years = maybe
  legitimate?" Or the reconciliation could be about commitment devices and signaling.


