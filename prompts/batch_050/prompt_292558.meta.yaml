  7. Finishing a book you hate because you''re 200 pages in — feels fine-ish? Actually
  many think that''s fine because of closure.


  Hard pair: movie case (irrational to stay) vs book case (finishing feels okay) —
  or relationship vs war. Also gym membership case: forcing yourself to go because
  you paid — some say that''s actually smart as a commitment device.


  The asker might offer a tentative principle: "ignore sunk costs except when continuing
