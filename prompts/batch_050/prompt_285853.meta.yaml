  ---


  So I''m the most junior person on my company''s "Ship It" review board (we build
  warehouse robots) and somehow I got picked to write the recommendation memo for
  our quarterly review. Here''s the situation, I''ll try to explain it without too
  much jargon.


  Our picking robots run a planner that, before every action, re-checks everything
  it believes about the world to figure out what will change and what stays the same
  after it acts. Worked fine when the robot''s world model was small. Last quarter
  we gave it a much richer model — it now tracks stuff like door positions, forklift
  locations, humidity, wifi signal strength per aisle, the charge state of every other
  robot, all that. Now the robots keep stalling: before sliding a tote across a shelf,
  the planner grinds for ages ruling out absurd possibilities, like whether moving
  the tote changes the wifi reading in aisle 7, or whether the tote''s new position
  affects the forklift''s charge. Nothing''s actually wrong, it just can''t finish
  checking. Uptime is down like 18% and ops is furious.


  The proposed patch: an allowlist. Instead of re-checking everything, the planner
  only re-checks facts on a curated list of "things this action could plausibly affect,"
  maintained by hand per action type. Simulation looks great, 99.7% of stalls gone.
  But here''s the catch: nobody can tell me how the list gets built except "the engineers
  write down what seems relevant." There is no principled rule for what makes it onto
  the list, and last month a sim run missed a case where a robot nudging a pallet
  blocked the light sensor that the aisle lighting system uses, because "affects light
  sensors" wasn''t on the list for nudging. It got patched in, but only after someone
  caught it.


  So the board is split. Half say ship the patch, the real world is messy and humans
  also just know what''s relevant without checking everything, and we can add list
  entries as we find gaps. The other half say we''re shipping a system whose safety
  depends on the completeness of a list nobody can justify, and we should delay until
  we have something better than vibes.


  Draft the memo I''ll circulate. I''m not looking for philosophy class material,
  I want something the board can actually vote on, but the disagreement does feel
  weirdly deep — like it''s really about whether "just knowing what''s relevant" is
  a thing a system can have, or whether it''s always luck plus maintenance. Take that
  seriously.


