  ---


  I edit fiction submissions for a small literary magazine — roughly twenty stories
  a week, of which maybe three involve worlds whose moral fabric differs from ours:
  societies where cruelty counts as kindness, where betrayal is a duty, where the
  narrative voice treats something monstrous as unremarkable. Increasingly our first
  readers flag these stories as "broken" or "the author is a monster," and I need
  a consistent way to triage them before I spend an hour reading.


  Please write a decision procedure my readers and I can follow for a flagged story,
  grounded in what philosophers of fiction call imaginative resistance — the well-documented
  fact that readers who happily imagine talking animals, time travel, and impossible
  physics balk when a fiction asks them to imagine that, say, cruelty is right. The
  procedure should include:


  - An ordered set of diagnostic questions distinguishing at least three diagnoses:
  genuine imaginative resistance (the story asks us to make-true-in-fiction a moral
  deviance and we balk), mere implausibility (the author failed to earn the deviance),
  and mere offense (readers dislike the content but could imagine it fine). For each,
  a concrete test the reader can run — for instance, whether substituting an equally
  deviant non-moral proposition into the same sentence still causes a balk.

  - Instructions on what each diagnosis implies editorially: which is fixable by the
  author, which is a feature the magazine might publish anyway, which is grounds for
  rejection.

  - The points where the procedure must hand the decision back to a human editor,
  stated honestly — including the contested question of whether resistance reveals
  something defective about the fiction or something about the reader.


  Then run the procedure on three sample passages, which you should write yourself:
  (i) one where the diagnosis is fixable authorial failure, (ii) one where the procedure
  says the story is fine and the first reader''s objection should be set aside — the
  answer I will not like, since my readers are the ones complaining — and (iii) one
  where the procedure must stop and hand the decision to an editor.


  Keep the whole thing runnable by a first reader with no philosophy background in
  about fifteen minutes per story, and say explicitly what the procedure cannot do.


