reasoning_summary: 'Pick domain and type. Let''s do "present an argument that seems
  to prove too much" on Hume on miracles, or nonidentity problem. A good one: an argument
  based on Hume''s miracles that seems to prove we should never believe any testimony
  about anything improbable — the classic "Hume proves too much" worry. Make it a
  numbered argument with a subtle issue (e.g., conflating prior improbability with
  miracle, or the weighing of testimonial evidence).


  Let me draft:


  A colleague''s argument: (1) A miracle is by definition a violation of laws of nature.
  (2) Our evidence for the laws of nature is the whole uniform course of experience.
  (3) Testimony is only as strong as the observed regularity of testimony''s truthfulness...
  conclude we should never rationally believe any testimony of an event that would,
  if true, revise our physics — e.g., reports of unexpected experimental results that
  overturned established theory. That proves too much: anomalous experimental results
  (faster-than-light neutrinos...) Actually Hume''s maxim: no testimony sufficient
  to establish a miracle unless testimony''s falsehood more miraculous. The too-much
  conclusion: we should disbelieve any report of anything sufficiently surprising,
  including legitimate scientific anomalies. Where does it go wrong? The flaw: equivocation
  between "contrary to laws of nature" and "merely improbable/contrary to current
  theory"; also Hume''s argument targets establishing a religious miracle qua miracle,
  not revising beliefs.


  Write numbered steps:


  (1) A miracle is a violation of the laws of nature.

  (2) The evidence for any law of nature is the whole of uniform human experience
  in its favour — as strong as evidence can be.

  (3) Testimony for an event is evidence only as strong as the observed reliability
  of testimony of that kind.

  (4) So testimony can never rationally establish a miracle: the falsehood of the
  testimony would always be less improbable than the event.

  (5) But any report that, if accepted, would require revising our best-established
  beliefs is in the same epistemic position as a miracle report: the evidence against
  it is our entire prior experience.

  (6) So we should never accept testimony that contradicts our best-established beliefs.

  (7) Yet science plainly proceeds by crediting reports of results that contradicted
  the best-established beliefs of the day.

  (8) So (4) — and hence Hume''s maxim — must be wrong.


  Asker says which they''d rather keep. Ask: which step do you reject, what''s the
  cost? The subtle flaw is (5): conflating "violates laws of nature" with "surprising
  relative to current theory" — laws vs our beliefs about laws; also the prior for
  a repeatable experimental anomaly differs. Good.


  Keep British English, formal, short-ish. Write it.'
