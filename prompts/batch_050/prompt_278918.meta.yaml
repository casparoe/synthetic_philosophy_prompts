  2. A case where treatment overshoots: e.g., cochlear implant that also grants frequency
  range beyond typical human hearing — one intervention, part therapy part enhancement;
  criterion must handle mixed interventions.


  3. The "positional good" case: height enhancement where if everyone is enhanced
  no one gains advantage — does the criterion need to be sensitive to distributional
  effects?


  4. Welfarist vs. normal-functioning accounts; the criterion should tell us what
  work the distinction is doing (insurance coverage? permissibility? sports eligibility?)
