  Museum restitution is nice: a professor holds, e.g., (1) the Benin Bronzes should
  be returned to Nigeria; (2) the Parthenon Marbles should stay in London (or some
  nuanced position); (3) a universal-museum defense for some artifacts; (4) repatriation
  decisions shouldn''t depend on current political regimes of the claimant state;
  etc. Need genuine tensions.


  Alternatively Nozick tracking: commitments like (a) knowledge requires tracking
  truth via sensitivity (b) knowledge is closed under known entailment (c) I know
  I have hands (d) I don''t know I''m not a brain in a vat (e) lottery beliefs aren''t
  knowledge. Classic tension: Nozick himself denied closure to keep (c) and (d); holding
  closure + tracking is a genuine tension. Also lottery: sensitivity actually delivers
  that lottery beliefs aren''t knowledge... wait, sensitivity gives the lottery result
  correctly (if the ticket had won, you''d still believe it loses — so not sensitive
  — not knowledge. Good). But there''s the classic problem: sensitivity gives wrong
  verdicts for knowledge of entailed propositions via methods... Also "grandmother"
  case. Design commitments:


  (1) Something like tracking/sensitivity is at least roughly the right account of
  perceptual knowledge.

  (2) Epistemic closure: if I know p and know p entails q, I can come to know q by
  deduction.

  (3) I know I have hands, and I can know I''m not a BIV by deducing.

  (4) Lottery propositions: I don''t know my ticket will lose, even with astronomically
  long odds.

  (5) Knowledge shouldn''t be method-relative in a way that... hmm.


  Genuine tension: (1)+(2) conflict — Nozick famously rejected closure; sensitivity
  violates closure for BIV deductions. Apparent tension that dissolves: (1) and (4)
  — actually sensitivity handles lottery well, so that''s not a tension; a good answer
  should note that. Another subtle one: with sensitivity, you can know you have hands
  but deduction to "not a handless BIV" fails sensitivity — so (2) is the odd one
  out, or you can adopt Nozick''s non-closure. Also methods individuation problem:
  whether "I know I''m not a BIV" is sensitive depends on method — the method "deduction
  from hands" makes it insensitive. Also there''s the issue of knowledge of necessary
  truths / skeptical hypotheses via sensitivity with coarse method individuation.


  Also another genuine subtle tension: (4) lottery + safety? Sensitivity actually
  mishandles some cases: e.g., believing "I''m not a BIV who falsely believes it has
  hands" — sensitivity handles that? The classic problem cases: (i) sensitivity implies
  you can''t know you won''t lose lottery? Actually it gives the right answer. (ii)
  "Soda in the trash" case (Vogel): you know there''s a soda can in the trash? Sensitivity
  issues with garbage-chute case. (iii) Knowledge of the conditional itself. (iv)
  The problem that sensitivity makes knowledge of skeptical hypotheses impossible
  even by other means, and closure failure allows "abominable conjunctions": I know
  I have hands but don''t know I''m not a handless BIV. If the professor also holds
  that such conjunctions are abominable/absurd to assert, that conflicts with denying
