  to keep ordinary knowledge + skepticism verdicts, (c) find "I know I have hands
  but I don''t know whether I''m a BIV" an intolerable verdict that no theory should
  deliver. That''s a real tension: Nozick''s package delivers exactly that conjunction.


  So commitments set, e.g.:


  1. Perceptual knowledge is best understood counterfactually: roughly, Nozick-style
  sensitivity (if p were false, S wouldn''t believe p) is at least a necessary condition
  on knowledge.

  2. I know ordinary things: I know I have hands; my perceptual knowledge is secure.

  3. I don''t know I''m not a brain in a vat, and skeptical hypotheses are in some
  sense unknowable.

  4. Single-premise closure: knowing p, and competently deducing q from p while knowing
  p entails q, suffices for knowing q (at least when the deduction is short and obvious).
  — conflicts with 1+2+3 (Nozick himself bit the bullet and denied closure).

  5. I don''t know my lottery ticket will lose, even for huge lotteries, and any adequate
  theory must explain this without ad hoc additions. — apparent tension with 1? Actually
  sensitivity delivers this: the belief "my ticket will lose" is insensitive (in nearest
