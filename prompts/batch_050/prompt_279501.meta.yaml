  Good''s theorem: Irving John Good, "On the Principle of Total Evidence" (1967, British
  Journal for the Philosophy of Science). The theorem: in a Bayesian framework, acquiring
  free information (before choosing an action) never reduces expected utility, assuming
  you''ll update by Bayes and choose the best act given the posterior. Known caveats:
  costs of information, computational boundedness, the info might change your utility,
  strategic contexts, the "sour grapes"/motivated cognition cases, cases where the
  info isn''t decision-relevant... Actually known counterexamples: when learning the
  info could cause you to be worse off due to own irrationality, or when info changes
  what options are available (e.g., being told ruins a surprise), or Schelling-style
  commitment cases where ignorance is valuable (e.g., the hostage negotiator who doesn''t
  want to know). Good''s theorem assumes the agent will choose the best available
  action after updating, and the set of actions stays fixed.


