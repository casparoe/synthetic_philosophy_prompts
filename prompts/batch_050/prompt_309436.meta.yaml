  The activity should make participants feel the force of moral trade: that two people
  who disagree morally can both get more of what they want by trading votes/decisions
  across issues rather than each compromising 50/50 on each issue.


  Design: upper-level seminar or reading group, say 8-12 participants, 75 minutes.
  Game: two (or more) groups with different moral priorities allocated decisions across
  several issues. First round: forced compromise on each issue (50/50 split). Second
  round: allow trades — one side gets full control of issue A, other gets full control
  of issue B. Participants see total "moral satisfaction" rise for both sides. Then
  inject complications: (1) asymmetric intensity — how do you know the other side''s
  stated intensity is honest? Strategic misreporting. (2) A third party whose values
  are affected but not at the table (e.g., the beings affected by the decisions) —
  moral trade can be a Pareto improvement for the traders while worse for the world
  by each party''s own lights? Actually the classic worry: moral trade between two
  parties can sideline third parties, or the "trade" can involve concessions on issues
  where one party thinks the other''s view is not just different but abhorrent (complicity
  worry). Also the meta-worry: trading requires treating your moral convictions as
  bargaining chips.


  New/niche idea injected: give participants private "intensity cards" so preferences
  are hidden, introducing honesty/strategic issues — makes them feel the epistemic
  problem in moral trade (verifying counterparties'' actual values). Also include
