  Draft the joint statement of an adversarial collaboration between two philosophers
  who have spent a year working together in good faith on the ethics of blaming hypocrites.
  The first, the standing theorist, holds that a person who blames another for a wrong
  of a kind they themselves have committed thereby lacks the standing to issue that
  blame, and that this defect diminishes the blame''s normative force. The second,
  the standing sceptic, holds that the aptness of blame turns entirely on the blamed
  party''s culpability, and that facts about the blamer''s own record bear, at most,
  on the blamer''s virtue or the social costs of their speech, never on whether the
  blame is warranted.


  Format the deliverable as follows. (1) A numbered list of at least six agreed claims:
  claims both parties could sign, including at least two claims about what hypocritical
  blame actually does or achieves, and at least one claim each side once would have
  denied. These must be substantive rather than diplomatically vacuous. (2) A table
  of residual disagreements, each stated as a single proposition together with each
  party''s verdict on it, where every proposition is worded so that the party whose
  view it represents would accept the wording. (3) A cruxes section: for each disagreement,
  identify the sub-question such that resolving it would move at least one party,
  and specify a case, argument, or consideration both accept as bearing on that sub-question,
  with each party''s prediction about what the case shows recorded in advance.


  In addition, both parties must take a position on the following two stipulated cases,
  which they designed jointly as stress tests:


  Case A (prospective hypocrisy). Priya publicly censures her colleague for falsifying
  expense claims. Priya has never falsified a claim herself, but has privately resolved
  to begin doing so next month, and does. Standard standing theories are framed in
  terms of the blamer''s past or present wrongdoing; the collaboration must decide
  what, if anything, follows for blame issued in advance of the blamer''s own matching
  wrong.


  Case B (anonymous blame). An anonymous letter correctly accuses a department member
  of plagiarising students'' work. The letter''s author is a serial plagiarist, though
  no one else knows this. Because no one can identify the blamer, no one can discount
  the blame on the basis of who issued it. The collaboration must address whether
  standing attaches to the blamer, to the speech act, or to the uptake by an audience,
  and what this case shows about the answer.


  Conclude with a short joint methodological note on what the two cases reveal about
  whether standing is a condition on the content of blame, on its force, or on its
  permissibility. Write the whole statement in British English.


