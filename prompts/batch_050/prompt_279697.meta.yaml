  Or underdetermination + \"commitments hang together\": (a) evidence underdetermines\
  \ theory, (b) scientific realism, (c) Occam's razor as epistemic, (d) ... \n\nOr\
  \ historical materialism + commitments: (a) base explains superstructure, (b) ideas\
  \ can change history, (c) ... \n\nI think the translation type with epiphenomenalism\
