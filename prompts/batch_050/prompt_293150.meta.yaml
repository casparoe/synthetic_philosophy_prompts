  I''m in my second year taking an early modern political philosophy module, and we''re
  on Spinoza this term, specifically the Theological-Political Treatise and the democracy
  bits. Our tutor keeps pushing us on what, for Spinoza, makes a majority decision
  legitimate, and I''ve realised I don''t have a consistent view. So here are my gut
  verdicts on some cases, and I''d like to know what principle, if any, lies behind
  them.


  First, the passage that''s bugging me, from the Preface (Elwes translation):


  "The human mind is readily swayed this way or that in times of doubt, especially
  when hope and fear are struggling for the mastery, though usually it is boastful,
  over-confident, and vain."


  Now the cases:


  1. A town council votes 7–5 to remove a novel from the school syllabus because a
  campaign of offended parents demands it. I think that''s legitimate. The majority
  ruled; that''s what democracy is.

  2. The same council ignores its own flood engineers and goes with what public meetings
  were clamouring for, and the defences later fail. Still legitimate, I think, just
  badly made.

  3. After weeks of a newspaper whipping up panic about crime, a referendum brings
  in very harsh mandatory sentences. This one feels less legitimate to me than an
  ordinary majority vote, even though the arithmetic is identical.

  4. The exact same sentencing law, passed by referendum after two years of calm debate:
  fully legitimate, no complaints from me.

  5. A benevolent dictator who somehow always enacts what the majority would have
  wanted if they''d been calm and informed: not democracy at all in my book, and illegitimate
  even when the outcomes are good.


  So: is there one principle that delivers all five verdicts? My problem is that the
  Spinoza quote seems to say everyone''s mind is tossed about by hope and fear anyway
  — the parents in case 1 are as passion-driven as the panicked referendum voters
  in case 3 — so I don''t know how I can say 1 is fine and 3 isn''t without also giving
  up on 2 or 4. Also, does Spinoza''s own view (democracy as the most natural state
  even though nobody''s rational) support my principle or undermine it? And tell me
  what your best principle says about a case I haven''t listed: a referendum held
  in a wave of national euphoria straight after a big football win, say. If one of
  my verdicts has to go, which one and why?


  Could you answer in British English please? Also sorry if this is a mess, it''s
  late and my notes are a mess.


  ---


