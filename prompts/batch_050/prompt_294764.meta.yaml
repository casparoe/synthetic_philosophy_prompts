  to CityLine, 30% to another company; no other evidence. Verdict: feels wrong to
  find CityLine liable.

  3. DNA: at a crime scene, DNA matches the defendant, random match probability 1
  in 10 million. Verdict: fine to convict (mostly) on that plus being in the city.

  4. Eyewitness who is right 70% of the time (per studies) — verdict: feels more legitimate
