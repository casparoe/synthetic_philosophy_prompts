  Draft:


  I''m in twelfth grade and I help run our school''s mock trial club, and I''ve been
  thinking about when statistics alone can count as proof. I''d like you to take my
  gut verdicts on some cases and work out what principle, if any, lies behind them.
  Here are the cases, all loosely based on problems I''ve read about plus a few of
  my own:


  1. The county fair admits 1,000 people but only sold 400 tickets; the rest climbed
  the fence. The fair organisers sue one attendee picked at random, arguing it''s
  more likely than not (60%) he didn''t pay. My verdict: he shouldn''t have to pay
  a cent on that evidence alone.

  2. A cyclist is sideswiped at night by a bus that doesn''t stop. She can''t describe
  it. Two companies run buses in town: 80% of buses on that route at that hour belong
  to BlueLine. She sues BlueLine. My verdict: BlueLine shouldn''t be found liable
  on that alone.

  3. A burglar leaves blood at a window. DNA from the scene matches a man from the
  city, and the chance a random person''s DNA matches is about one in ten million.
  There''s little other evidence. My verdict: convicting him mostly on the DNA feels
