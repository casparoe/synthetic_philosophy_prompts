  ---


  I work as a software engineer on a team building conversational agents, and I''ve
  been trying to get a grip on pragmatics because it keeps coming up in discussions
  of why our system misreads users. I have no formal philosophy background, so I''ve
  been reading popular treatments. A blog post by a science writer summarized Grice''s
  theory of implicature like this: "Grice''s big idea is that what a speaker means
  is whatever they intend the hearer to come to believe. Conversation works because
  everyone tacitly obeys a cooperative principle — say what''s true, be relevant,
  be brief, be orderly — and an implicature arises whenever a speaker deliberately
  breaks one of these rules: the hearer notices the violation and works backward to
  figure out what the speaker must really have meant. So implicature is essentially
  a decoding process, and it covers phenomena like metaphor, irony, and sarcasm, which
  Grice treats as rule-breakings too. Because the maxims derive from general principles
  of rational cooperation rather than from the conventions of any particular language,
  Grice showed that implicature works the same way in every language."


  The post then draws a conclusion: since even literal-sounding exchanges depend on
  this kind of inference, meaning in natural language is not rule-governed in the
  way syntax is, and so formal semantics — the project of giving compositional rules
  for meaning — rests on a mistake.


  I''ve seen Grice invoked often enough that I suspect at least some of this is off,
  but I can''t locate the problems myself. I''d like an accuracy audit: go through
  the summary and tell me, with a definite verdict on each claim, what a philosopher
  who actually works on Grice would accept, what they''d regard as a subtle misrepresentation,
  and what is simply wrong. Please commit to judgments rather than listing readings
  — e.g., is meaning really just "whatever the speaker intends the hearer to believe"?
  Do implicatures arise only from deliberate violations, or is that conflating two
  routes? Is "decoding" the right model? And finally, does the post''s conclusion
  about formal semantics follow from whatever survives of the accurate parts? I''d
  rather have a committed answer I can check against the primary text later than a
  menu of possibilities.


  ---


  Check the misrepresentations: meaning = whatever speaker intends hearer to believe
  — wrong on two counts: Grice''s analysis is of speaker''s meaning via reflexive
  intention (intention to produce belief by recognition of that intention), and implicated
  meaning isn''t about belief production necessarily; also the summary slides from
  "speaker meaning" to the mechanism of implicature. "Implicature arises whenever
  a speaker deliberately breaks" — wrong: many implicatures arise from observing maxims;
  flouting/exploitation is one route (particularized implicatures via exploitation
  vs. generalized via observance). "Decoding process" — Grice explicitly contrasts
  with code; it''s inferential. Metaphor/irony as quality maxim flouting — that part
  is actually accurate. Universality — Grice hoped maxims are general but noted variations;
  overstatement ("showed that... same way in every language" is stronger than warranted
  — Grice gestured at generality; later cross-cultural work complicates). Conclusion:
  doesn''t follow — Grice''s project is compatible with compositional semantics; indeed
  implicature presupposes "what is said" as semantic content; the distinction semantics/pragmatics
  is preserved.


