  Design precedents consistent with multiple rules:


  - Approved: a trial randomizing between two standard-of-care chemo regimens where
  evidence is genuinely mixed.

  - Approved: a trial randomizing kids'' asthma meds between two common inhalers,
  even though one is newer with slightly less data, with parents'' consent.

  - Rejected: a trial randomizing between surgery and a less-invasive procedure where
  the PI privately believed surgery was superior, even though community opinion was
  split.

  - Approved with conditions: a trial of a cheap generic vs expensive branded drug
  where some docs thought generic inferior, conditions = extra monitoring.

  - Rejected: a placebo-controlled trial of antidepressants where an effective standard
  exists and participants could deteriorate.

  - Approved: placebo-controlled trial for mild seasonal allergies where placebo meant
  symptom discomfort only.


  Candidate rules: (a) community disagreement suffices (expert/community equipoise);
  (b) individual investigator''s convictions matter (theoretical equipoise); (c) risk-based
  rule: any randomization ok if risks minimal, regardless of equipoise; (d) therapeutic
  misconception / consent quality matters.


  New case: a trial randomizing between two doses or two timings of a standard treatment,
  minimal added risk, but the lead researcher is strongly convinced one arm is better
  and said so in the protocol; broader medical community is divided. Under community-equipoise:
  approve. Under investigator-equipoise rule (precedent 3 rejection): reject or require
  PI recusal. Under risk-based: approve. Divergence good.


  Also ask which precedent closest analog, what principle adopting either way, what
  further case would distinguish.


  Casual tone, non-academic person, typo or two. Two-three paragraphs. No quotes needed,
  no web search needed.'
