  of the two groups of feelings. Toegye, after much revision, settled on saying that
  the Four are "issued by principle with material force following," whereas the Seven
  are "issued by material force with principle riding along" — principle and qi each
  "issue" something, though always together. His critics object that this splits what
  cannot be split: if li and qi are inseparable, there cannot be two different issuances;
  at most, one can say that in the Four the principled dimension is salient because
  those feelings are wholly aligned with moral principle, while in the Seven the qi
  dimension is salient because those feelings are liable to excess. Toegye''s defenders
  reply that a merely epistemic difference in salience cannot explain why the Four
  alone are reliably good, and that "issuance" marks a real asymmetry in causal or
  metaphysical priority.


