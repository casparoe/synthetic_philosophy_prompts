  Let me design: upper-level seminar, ~90 minutes, 12-16 students. Activity: two "banker"
  games. Phase 1: classical coins placed into two boxes, count macrostates. Phase
  2: "photons" — participants swap roles, instructions that particles have no labels.
  Then dice-based simulation. Then debrief mapping onto Gibbs paradox, Leibniz''s
