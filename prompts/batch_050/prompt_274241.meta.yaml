  e.g., in "population ethics: the challenge of future generations" — Gustafsson''s
  work. Explain the concept: a Pareto improvement is "safe" if its acceptance doesn''t
  lead one to be forced into accepting worse outcomes via a sequence. Could ask to
  explain why unrestricted Pareto leads to sequence arguments and what makes an improvement
  "safe," and whether the safety condition smuggles in the very aggregative/comparative
  judgments it was meant to avoid.

  - Desiderata type + natural kinds: "what must a theory of natural kinds deliver"
  — cases like chemical elements, biological species, psychiatric categories, jade/jadeite-nephrite,
  water/H2O vs XYZ. Which desiderata jointly unsatisfiable: mind-independence vs.
  serving inductive inference in special sciences vs. cluster kinds. That''s a nice
  fit.

  - "Is there a name for this" + testimony: describe a phenomenon — e.g., someone
  knows that p via testimony, and then... Hmm. Phenomenon: hearer comes to believe
  p because speaker said so; speaker in turn got it from someone else... that''s just
  testimonial chains. Or: hearer rationally believes on testimony even though the
  hearer has strong undefeated counterevidence — no. Another: the asymmetry that it''s
  sometimes acceptable to believe p on testimony but not acceptable to assert p yourself,
  or you can know p from testimony but can''t use it as a premise to testify further?
  There are known phenomena: "interpersonal epistemic" stuff, Goldberg on epistemic
  buck-passing. Might be too answerable.


  Desiderata + natural kinds seems strong and safe: no quotes needed, no niche facts.
  The prompt can inject a new/niche angle by inventing a candidate case, e.g., a fictional
