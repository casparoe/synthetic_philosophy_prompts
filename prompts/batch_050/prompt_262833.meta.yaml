  life-saving lies.


  Draft the reading with me. Things I want it to cover:


  - Take the film''s major lies — the afterlife story he invents at his mother''s
  deathbed and then for the whole world, the bank-teller lie, the comforting lies
  to strangers — and slot them into Augustine''s eightfold ranking. Which ones come
  out where, and does Augustine''s ranking track the film''s own moral intuitions
  or cut across them? I''m especially interested in whether Augustine''s worst category
  (lies in religious teaching) lands on the film''s centrepiece, the Man in the Sky,
  and whether the film has any reply to that beyond satire.

  - Augustine defines a lie as a falsehood told with intent to deceive, which is why
  he doesn''t count jokes as lies. The film''s premise seems to collapse lying, fiction,
  and religion into one thing — in a world without lies there''s also no fiction and
  no faith. Is that conflation doing real philosophical work, or is it just the joke?
  Does Augustine''s definition dissolve the premise (you could have novels in that
  world, just labelled as such)?

  - In the no-lie world, everyone also blurts out every nasty thought. Augustine wouldn''t
  equate not-lying with total disclosure — keeping silent isn''t lying. Does the film
