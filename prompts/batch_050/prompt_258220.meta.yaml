  Let me design the disagreement: Friend A says betting on a coin flip (win 60% of
  stake on heads, lose 50% on tails) is good because EV positive per play (0.5*1.6
  + 0.5*0.5 = 1.05). Friend B says if repeated, median outcome loses — time-average
  growth is (1.6*0.5)^0.5 ≈ 0.894, so most individuals go broke. A replies: EV still
  positive, ensemble average, law of large numbers across repeated trials... but time
  average applies to multiplicative repetition. B says ergodicity economics says optimize
  growth rate. A counters: the gambler''s ruin issue is about bet sizing (Kelly),
  not whether to bet at all; betting a small fixed fraction makes the time-average
  growth positive (Kelly fraction... for this bet: f* = ? For win 60%/lose 50% at
  even odds: p=0.5, b = 0.6/0.5 = 1.2? Kelly fraction f* = p − q/b = 0.5 − 0.5/1.2
  = 0.0833). Growth rate at f: E[ln(1 + f*r)] = 0.5 ln(1+0.6f) + 0.5 ln(1−0.5f). Derivative:
  0.5*0.6/(1+0.6f) − 0.5*0.5/(1−0.5f) = 0 → 0.6(1−0.5f) = 0.5(1+0.6f) → 0.6 − 0.3f
  = 0.5 + 0.3f → 0.1 = 0.6f → f = 1/6 ≈ 16.7%. So betting full bankroll is the mistake,
  not betting per se.


  Then B could counter: but the "right" fraction is fragile — miscalibrating Kelly
  leads to ruin, and in real life you don''t know the probabilities; also leverage.
  A could respond that this concedes the argument in principle: log-utility maximization
  is just a choice of objective, not a theorem that "expected value is wrong." B:
  ergodicity economics claims more than log utility — that time-average growth is
  what non-ergodic processes actually deliver, and ensemble EV is misleading when
  wealth doesn''t converge. A: but you can get the same prescriptions from ordinary
  expected utility with risk aversion — Ole Peters'' framework doesn''t prove new
  rationality, it re-derives. And then deeper round: additive vs multiplicative dynamics,
  insurance example, pensions, etc.


