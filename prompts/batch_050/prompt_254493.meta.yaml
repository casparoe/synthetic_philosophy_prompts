  Novelist''s commitments on dream skepticism / butterfly dream:

  1. When I dream, I don''t know I''m dreaming — dreams are indistinguishable from
  waking life while I''m in them.

  2. From the outside, I can usually tell afterwards that I was dreaming (dreams are
  incoherent, gappy).

  3. I can''t know for certain right now that I''m awake (Cartesian-style).

  4. Nonetheless, I''m rationally justified in treating my current experience as waking.

  5. Fictional characters I write are like dream figures — they seem real from inside
  the story but I, the author, know the frame.

  6. The butterfly dream shows there''s no fact of the matter about whether Zhuangzi
  dreamed of the butterfly or vice versa.


  Tensions:

  - (1) and (2): indistinguishability from inside vs. clear differences afterwards
  — apparent tension, dissolves (indistinguishability at the time vs. retrospective
  coherence checks).

  - (3) and (4): actual tension? Not really—standard to say knowledge vs. justification.
  But could be genuine tension if justification requires ruling out skeptical hypothesis...
  A good answer could resolve via fallibilism. Make it apparent.

  - (6) and the reading of Zhuangzi: claiming "no fact of the matter" — tension with
  (2) (there is a fact — Zhuangzi was dreaming; dreams are retrospectively detectable).
  The transformation-of-things reading vs. the "no fact" skeptical reading. Real tension:
  (6) says no fact of the matter, but (5) treats author/reader as knowing the frame
  — if novelist knows the frame about fiction, why deny Zhuangzi can know about himself?
  And (3)+(4) with fallibilism...

  - A hidden genuine tension: (1) "dreams indistinguishable from waking while in them"
