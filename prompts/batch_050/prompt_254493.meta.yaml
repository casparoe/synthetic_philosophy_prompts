  Better design:

  a) While dreaming I cannot tell I''m dreaming; the dream feels fully real.

  b) When I write fiction, my characters can''t tell they''re fictional, and that
  doesn''t bother me — fiction has its own internal standards of reality.

  c) Zhuangzi''s question (whether he''s a man dreaming of being a butterfly or butterfly
  dreaming of being a man) has no correct answer — that''s the point.

  d) I''m nonetheless confident I''m awake right now; skepticism is a parlour game.

  e) Lucid dreams show we can sometimes tell the difference from inside.


  Tensions:

  - (a) vs (e): if lucid dreaming allows internal recognition, then "cannot tell while
  dreaming" is false in general — genuine tension, cheap fix: weaken (a) to "usually
  cannot tell" or restrict to non-lucid dreams. Actually that''s a fairly obvious
