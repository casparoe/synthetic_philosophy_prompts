  ---


  Okay, bear with me on this one. I''ve been reading a bunch of the insect sentience
  stuff (the Rethink Priorities-style work, the expected-value arguments about how
  even a small credence in bug pain times a quintillion bugs swamps basically everything
  else in the moral calculus), and I want a poem about the scale argument specifically.
  Not about bugs being cute or factory farming being bad — about the *structure* of
  the argument itself, where a tiny probability and an absurdly huge number multiply
  into something that demands attention even though you''d rather it didn''t.


  Form: a villanelle. Here''s the constraint I actually care about: the two refrains
  should be the two factors in the product — one line for the low credence (something
  like "it''s probably nothing, it''s almost certainly nothing") and one for the scale
  (the number of insects alive at any moment). The villanelle form, where the two
  refrains keep alternating and finally land together in the closing couplet, should
  do the work of the multiplication: the reader should feel them converging into the
  product at the end the way the argument converges into "this might dominate everything
  else." Someone who knows the argument should be able to tell exactly which refrain
  is which and why they had to meet in the last two lines.


  I''d like it honest about the asymmetry too — the refrain about scale should be
  *certain* (we really do know roughly how many insects there are, give or take orders
  of magnitude) while the refrain about sentience should carry all the doubt. That
  asymmetry is the engine of the whole thing and also its weakest joint, and the poem
  should let that show rather than resolve it.


  After the poem, one section titled "Where the poem leans on contested stuff" (~150
  words): note where the poem takes a side or takes liberties — e.g., whether it treats
  any particular credence as if it were the agreed estimate (it shouldn''t; the range
  across people who work on this is enormous, from near-zero to pretty high), whether
  it presumes the additive/expected-value framing that some people reject, and anything
  else where you smuggled a contested premise into a line to make the meter work.
  Be upfront about what''s basically settled (the population numbers, the form of
  the argument) versus what''s genuinely contested (the sentience estimates, whether
  expected value even applies cleanly here), and don''t make the contested stuff sound
  like consensus.


  Length: one villanelle (19 lines, obviously) plus the commentary section. Don''t
  explain the form back to me.


