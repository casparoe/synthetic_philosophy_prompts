  differ. (1) may be fine. (2) relies on cases where the agent in the "allowing" case
  is ready to do — which smuggles in doing. Also (6) doesn''t follow even from (5):
  numbers favor letting five die, sure, but killing one vs letting five die — even
  if doing/allowing were irrelevant, there might be other differences (property rights,
  the one is the surgeon''s patient, etc.). Actually the argument is that killing
  one and letting five die differ only in doing/allowing plus numbers — but they don''t:
  letting five die isn''t something the surgeon does to those five as a means... hmm.


