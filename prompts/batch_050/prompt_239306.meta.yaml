  Draft the argument:


  A grad school friend argues:


  (1) For the doing/allowing distinction to matter morally, there must be pairs of
  cases that differ only in doing vs. allowing but differ in permissibility.

  (2) The natural candidate pairs don''t work: Smith (drowns cousin) and Jones (watches
  cousin drown, would push but doesn''t need to) are equally bad — Rachels.

  (3) Any act can be redescribed as an omission and vice versa: the person who pulls
  the plug omits to keep the patient alive; the lifeguard who stays put "actively"
  keeps his body in the chair. Whether we call something doing or allowing depends
  on the description, and moral permissibility can''t depend on how we describe events.

  (4) If permissibility tracks anything, it tracks the agent''s reasons and intentions,
  not the causal route. Smith and Jones have the same reasons and intentions (inheritance),
  so they''re equal; and in general once intentions are fixed, doing vs. allowing
  adds nothing.

  (5) So the doing/allowing distinction is morally irrelevant.

  (6) Therefore it''s permissible (all else equal) for the transplant surgeon to kill
  one healthy patient to save five, since that''s just "letting one die" relative
  to letting five die, and the numbers favor it.


  Where''s the flaw? Candidates: (3) equivocates between redescription of the same
  event and genuinely different events — the fact that we can describe an event differently
