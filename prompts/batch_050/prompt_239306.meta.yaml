  Let me draft: A friend argues there''s no moral difference between doing and allowing.
  Classic moves: Foot''s doctrine of double effect, Rachels'' bathtub cases, Bennett''s
  "the shielding and the pushing"... Let me build:


  (1) If doing vs. allowing matters morally, there should be cases that differ only
  in whether harm is done or allowed but differ in permissibility.

  (2) In Rachels'' bathtub cases (Smith drowns his cousin; Jones lets his cousin drown,
  ready to push if needed), both are equally impermissible.

  (3) Any proposed criterion for drawing the line (omission vs. positive action) fails
  because actions and omissions can be redescribed: failing to flip a switch that
  would stop a current, etc.

  (4) Also, not acting is itself a sequence of physical events / you can describe
  letting die as "doing nothing" but your body always does something — every omission
  has an active redescription.

  (5) Therefore the doing/allowing distinction has no moral significance.


  But this should "prove too much" — e.g., the argument generalizes: the same considerations
  would show there''s no difference between intending and foreseeing (double effect),
  so trolley cases... Or better: the argument''s premises about redescription would
  equally show there''s no morally relevant difference between anything and anything
  else — since any event can be redescribed. Actually the "prove too much" angle:
  if redescription undermines doing/allowing, it also undermines intended/foreseen,
  causing/letting, even agent/patient distinctions.


  Let me design: the argument concludes that the doing/allowing distinction is morally
  irrelevant AND, by extension, that there''s no morally relevant difference between
  any two ways a death can come about through or around an agent. The asker can''t
  accept it because then... e.g., a surgeon killing one patient for organs vs. letting
  five die would be equivalent.


  Structure with numbered premises, ask which step to reject, what rejecting costs.
  Ask for standard positions: Foot, Bennett (making/allowing), Quinn, Kamm? Careful
