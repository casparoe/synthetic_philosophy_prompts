  Question: "Mises and Hayek are often treated as making a single ''calculation''
  objection to socialism. State each thinker''s core argument in your own words, explain
  how they differ, and assess whether Lange''s market-socialist proposal answers both,
  one, or neither."


  Student answer draft:


  "Mises''s argument, from his 1920 essay, is that economic calculation requires money
  prices for the means of production, and these prices can only arise from exchange
  of privately owned capital goods. Under socialism the state owns everything, so
  there are no markets for capital goods, no prices, and hence no way to compare the
  costs of different production plans. Socialism isn''t merely inefficient; rational
  allocation is impossible.


  Hayek''s argument is basically the same point restated: without prices there is
  no way to do the arithmetic. He added that prices also aggregate information, but
  this is a secondary extension of Mises rather than a distinct objection.


  Lange''s response: market socialism can reproduce prices by having the Central Planning
  Board announce prices and adjust them by trial and error, raising prices where there
  is shortage and lowering them where there is surplus, with state firm managers instructed
  to produce where price equals marginal cost. Because this gives the planners everything
  they need to calculate, it answers Mises. And since the planners can in principle
  gather all the relevant statistics, it answers Hayek as well; modern computing power
  only strengthens the point — the ''calculation problem'' was really a claim about
  computational tractability that computers have now solved.


  Critics objected that Lange''s managers lack incentives, but incentives are a separate
  issue from calculation, so the core socialist project survives."


