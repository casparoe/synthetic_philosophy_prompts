  Content of Schlick''s essay: He argues the question of life''s meaning survives
  positivist scrutiny; meaning cannot come from purposes/ends because every purpose
  points to a further end, generating a regress that ends either in an ultimate purpose
  (which would have to be valuable in itself) or in emptiness. He criticizes the glorification
  of work/duty (the "ethics of duty," Kantian tones). Meaning resides in activities
  that carry their value in themselves — play. He extends "play" broadly: any activity
  done for its own sake, including creative work and love, insofar as they engage
  the whole person. He associates this with youth — youth as the capacity for play;
  the meaning of life is youth. Also his famous line: the meaning of life is play
  (paraphrase).


  In-the-weeds conceptual issue: the apparent circularity/regress structure — Schlick''s
  argument that purposes confer only derivative meaning leads to the conclusion that
  meaning must be intrinsic to activity; but then how does his notion of "play" avoid
  collapsing into hedonism? He explicitly distinguishes play from pleasure-seeking
  (the pleasure principle would be another purpose-centered view?). Actually Schlick
  distinguishes: the hedonic view says value lies in pleasurable states; Schlick''s
  view says value lies in the activity itself, not in a separable state it produces.
  Nice crux.


