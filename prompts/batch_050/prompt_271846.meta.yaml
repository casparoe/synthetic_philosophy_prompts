  Dr. L endorses what she calls plan-relative middle knowledge. She explains standard
  Molinism as follows: explanatorily prior to God''s creative decree, God knows what
  each possible creature would freely do in each complete set of circumstances, and
  God uses that knowledge in choosing which world to actualize. She rejects one element
  of the standard view. On her account, before the decree there are no unconditional
  truths of the form "If C were placed in circumstances S, C would freely choose A."
  There are only plan-indexed conditional truths: within plan P1, C in S chooses A;
  within plan P2, C in S chooses B. God''s decree selects a plan, and only thereby
  makes one set of these counterfactuals true without qualification. She says this
  does not determine C, because the decree establishes the relevant counterfactual
  and the circumstances but is not a cause operating on C''s will; it also does notground
  the truth in a creature, because every candidate plan exists only as content in
