  Classic structure: prioritarianism says benefits to worse-off matter more. Leveling-down
  objection: it implies pure equality improvements with no welfare gain are good in
  at least one respect. If prioritarianism endorses leveling down in any respect,
  then... chain: (1) If distribution A is better than B in some respect, then all
  else equal you have some reason to choose A. (2) Leveling down the well-off creates
  a distribution better in the respect of equality/priority. (3) So you have some
  reason to level down. (4) Reasons aggregate: enough equality-value can outweigh
  welfare losses. (5) So sometimes you ought to make everyone worse off without anyone
  benefiting. (6) Nobody should accept that. The subtle flaw: the move from "better
  in one respect" (a comparative, pro tanto claim about betterness) to "a reason to
  bring about" — or the distinction between person-affecting vs impersonal value.
  Or: prioritarianism properly stated is about the weight of benefits, not about valuing
  equality as a pattern; when nobody benefits, no weighted benefit exists, so prioritarianism
  doesn''t actually value leveling down — the equality reading is a confusion of prioritarianism
  with egalitarianism. The argument proves too much by equivocating "priority-weighted
  value" with "equality as intrinsic value."


  Actually the subtle flaw: premise that prioritarianism ranks the leveled-down distribution
  as better in some respect. Prioritarians typically deny this: prioritarianism is
  person-affecting-ish; moving from (5,5) to (3,3) — no one''s welfare increases,
  so no weighted benefit; prioritarianism is indifferent, doesn''t say better in any
  respect. Temkin''s leveling-down objection targets egalitarianism (which values
  equality intrinsically), and some argue it hits prioritarianism only under a "pattern"
  reading. So the argument can subtly conflate prioritarianism with telic egalitarianism.
  That''s a nice in-the-weeds diagnosis.


