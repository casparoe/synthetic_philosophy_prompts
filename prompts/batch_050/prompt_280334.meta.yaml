  The pattern goes like this. The proponent rarely argues directly for their alternative
  history. Instead they assemble anomalies: the Piri Reis map and what it allegedly
  depicts, the tight-fitting stonework at certain Andean sites, medieval chronicles
  whose dates are hard to square. The orthodox account is then faulted for not fully
  explaining each anomaly, and the unexplained residue is quietly counted as evidence
  for the specific alternative — alien surveyors, a lost seafaring civilization, centuries
  inserted by forgers. When a specialist does explain one of the anomalies — the map''s
  coastline matches a distorted projection of familiar coasts, the stonework has known
  tool marks and quarry sites — the proponent doesn''t treat the alternative as weakened.
  The anomaly is dropped without comment and a new one takes its place, and the evidential
  weight seems to transfer over intact, as if the case rested on "the anomalies" collectively
  rather than on any one of them. Meanwhile the proponent''s own hypothesis is never
  asked to explain anything in particular: it predicts no specific artifact, risks
  no specific failure.


  Two features strike me as essential. First, the asymmetry: the established account
  must explain every item on an open-ended list to remain credible, while the challenger
  need explain nothing at all. Second, the serial replacement: the argument survives
  the resolution of any particular anomaly because its force is located in whichever
  anomaly is currently unresolved, not in a stable body of evidence.


  I know this is adjacent to the argument from ignorance and to "gap" arguments in
  other domains, and our textbook discusses Popper''s criterion and the general problem
  of demarcation. But the argument from ignorance, as I''ve seen it defined, is a
  single inference from "not explained" to "my explanation"; it doesn''t seem to capture
  the way the inference migrates from anomaly to anomaly, or the double standard in
  what each side must explain. Nor does unfalsifiability quite fit, since individual
  anomalies can be and are resolved — it''s the case as a whole that is unfalsifiable
  in practice.


  So my question: is there an established name for this configuration — the migrating
  gap-argument with asymmetric explanatory demands — either in the demarcation literature
  or in informal logic? If there is, I''d like to know how it is standardly defined
  and whether the migration and asymmetry are part of the definition or incidental.
  If there isn''t, could you propose a name and a definition, and mark the boundary
  cases: how does it differ from ordinary appeals to unexplained data (which are surely
  sometimes legitimate, as when anomalies genuinely accumulate against a paradigm),
  and at what point does citing unexplained anomalies become the fallacious pattern?


