  ---


  Having retired last year from a career in experimental chemistry, I have been reading
  formal epistemology with a convert''s diligence, and I keep returning to the Dutch
  book argument for probabilism. What troubles me is a premise that is usually left
  implicit: the step from an agent''s credences violating the probability axioms to
  a bookie''s being able to construct a package of bets the agent will accept and
  is guaranteed to lose. That step plainly requires some principle connecting what
  an agent believes to how she bets, and I want a pair of thought experiments that
  forces this bridge principle into the open by showing that neither direction of
  the standard argument survives without supplementation.


  Please construct the following pair of cases:


  Case One — incoherent but unbookable. An agent whose credences over a small set
  of propositions (no more than a coin toss and one further event) demonstrably violate
  the probability calculus — state the numbers — yet for whom no bookie can assemble
  a package of bets that the agent will accept and that guarantees the bookie a profit.
  Constraints: the agent must not simply refuse to bet; she must follow a stable,
  psychologically recognizable betting policy (something an ordinary cautious person
  might actually do) under which she accepts some bets; the policy must not be tailor-made
  to this example, i.e., it should be statable without reference to Dutch books; stakes
  are small enough that money tracks utility; and the bookie knows the agent''s credences
  and her policy but nothing about the outcomes.


  Case Two — coherent but bookable. An agent whose credences satisfy the probability
  calculus at every moment, yet whom a bookie can still relieve of a guaranteed sum.
  Constraints: the bookie may possess no information the agent lacks (in particular
  he does not know how the events will turn out); the agent''s vulnerability must
  arise solely from something about her that is publicly known — for instance, an
  announced policy about how she will revise her credences upon receiving evidence;
  and you must exhibit the actual bets, with prices and stakes, and compute the guaranteed
  loss.


  After the two cases, please provide the following, in order:


  1. A verification for Case One: enumerate the packages the bookie might offer and
  show that each either contains a bet the agent''s policy leads her to decline or
  leaves the bookie exposed to a possible loss. Identify exactly which feature of
  the policy is doing the protective work, and say whether weakening that feature
  — say, requiring the agent to accept any finite set of bets each of which she judges
  fair or favorable — restores bookability.


  2. A verification for Case Two: show that the agent is synchronically coherent at
  each time, exhibit the book, and compute the agent''s loss under every relevant
  outcome. State which norm the agent violates — it should not be a synchronic axiom
  of the calculus.


  3. The bridge principle, stated as a single precise sentence: the strongest principle
  connecting credences to betting behavior under which the classic argument goes through,
  and an assessment of whether it is a norm of rationality, a definition of credence,
  or merely a sociological conjecture about how agents behave.


  4. The moral, stated plainly: once the bridge principle is made explicit and Case
  One is on the table, what exactly does the Dutch book argument establish? Does incoherence
  emerge as an epistemic defect, a prudential defect conditional on an enforced betting
  regime, or merely a dramatization of a defect that the argument itself never locates?


  5. The probabilist''s best reply, in one paragraph: how a defender of the argument
  should attack Case One — presumably by insisting that immunity purchased by a quirky
  betting policy does nothing to vindicate the credences themselves — and whether
  shifting to a non-pragmatic vindication (for instance, an argument that incoherent
  credences are accuracy-dominated by coherent ones) rescues the conclusion or quietly
  changes the subject.


  The purpose of the exercise, so that you know what counts as cheating: I want to
  determine whether the Dutch book argument, stripped of its implicit premises, establishes
  anything about the rationality of credence as such, or only about the liabilities
  of credent agents placed in artificial betting situations. A case that stipulates
  its verdicts rather than generating them from the agent''s credences and policy
  is useless to me; every number should be checkable with pen and paper.


