  Background: The standard dialectic I keep encountering runs in one direction. Defenders
  of a classical, compositional language of thought argue from systematicity and productivity
  that minds must have structure-sensitive symbolic processing, and connectionist
  or purely associationist models are cast as failing to explain why anyone who can
  think ''the cat chases the dog'' can also think ''the dog chases the cat''. I find
  this one-directional framing suspicious. So here''s the assignment: construct a
  thought experiment in which a creature whose cognition genuinely is implemented
  by a language-of-thought-style architecture — compositional, structure-sensitive,
