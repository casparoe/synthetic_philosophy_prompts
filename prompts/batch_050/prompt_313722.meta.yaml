  ---


  I''m a longtime reader of LessWrong and the broader rationalist blogosphere, and
  I''ve recently ended up administering a small private research fund — call it three
  postdoc-years over three years — aimed at the philosophy of complicity: what it
  is to participate in wrongdoing one neither causes nor could have prevented. I''ve
  been trying to write a research agenda and keep falling back on the ITN heuristic
  (importance, tractability, neglectedness), but I''m not confident I''m applying
  it to the right questions.


  Here''s my current list of candidate open problems:


  1. The inefficacy problem: when an individual''s contribution to a collective harm
  is imperceptible or fully offset (buying factory-farmed meat, a single vote for
  a bad policy), does complicity attach anyway, and if so in virtue of what — expected
  effects, participation in a collective action, complicity in intention?

  2. The overdetermination problem: how to assign blame when the harm would have occurred
  identically without any given participant.

  3. Structural or institutional complicity: whether occupying a role (middle manager,
  pension-fund beneficiary, platform employee) makes one complicit in what the institution
  does even absent any endorsing intention.

  4. Retrospective complicity: whether benefitting from past wrongdoing (inherited
  wealth, infrastructure built by exploited labor) is a form of complicity or a different
  moral category entirely.

  5. Complicity through inattention: cases where the agent could trivially have known
  and didn''t look — whether willful ignorance is a mode of participation or a separate
  failing.

  6. The exit option problem: whether the availability and cost of exit (quitting
  the job, divesting) determines complicity, or merely its degree.


  My questions: which of these deserves the fund''s three years, in what order, and
  why? Specifically I''d like:


  - A dependency analysis: which questions'' answers constrain the others (my suspicion
  is that 1 and 2 are really the same question about the metaphysics of contribution,
  and that 3 through 6 are downstream of it, but I may be wrong).

  - The ITN assessment done honestly: which of these is neglected because it''s hard
  rather than because it''s unimportant; which is tractable with existing tools (formal
  models of collective action, legal doctrine on accomplice liability) versus which
  needs new conceptual machinery.

  - A note on what would change your ranking: what finding or distinction would reorder
  the list.


  Then structured summary: a table with columns Question (number/name), Rank, Importance
  (high/med/low + one line), Tractability, Neglectedness, Upstream of / Downstream
  of, Key crux, What would demote it.


