  is identical to what God essentially loves, so both horns fail. Ask what would count
  against it. But mustn''t reference super niche theories the model doesn''t know.
  The asker can construct their own position inline, which solves that.


  Alternatively, moral particularism: the asker accepts particularism based on "reasons
  holism" — a consideration that counts in favor in one case can count against in
  another. What would count against it: a candidate invariant reason, collapse into
  generalism via fully-specified principles, etc.


  Or Ship of Theseus: asker holds a worm-theory/four-dimensionalist account of persistence
  for artifacts. What would count against it? Defeaters from our concept of artifacts
  being intention-dependent, etc.


  Or inequality: asker defends the "sufficientarian" European-ish attitude... The
  US vs Europe domain is more of an empirical/normative question; the asker could
  defend the view that inequality only matters instrumentally. What would count against
  that: evidence inequality harms are non-instrumental, etc. That''s decent but maybe
  less crisp.


  The symbol grounding problem: asker holds that grounding is a functional matter
  — meaning is constituted by the right sort of causal/inferential role plus causal
  links to the world, so a system with rich enough world-model does have grounded
  symbols; no inner homunculus needed. What would count against it? That''s juicy:
  the position "Searle-style arguments fail; grounding is achieved by sensorimotor
  + inferential connections." Defeaters: showing that even ideal functional organization
  fails to determine meaning (inverted qualia, swampman-type cases), Quinean indeterminacy,
  model-theoretic arguments (Putnam''s), etc. That works without web.


  I''ll go with symbol grounding + "what would count against it" type. Construct a
  specific variant position so it''s in the weeds: "I hold that symbols are grounded
  when they''re enmeshed in the right network of causal couplings to the world and
  inferential relations to other symbols — i.e., grounding is a matter of functional/causal
  organization, not of some further phenomenal ingredient. Chinese room style." Ask:
  what would count against it — distinguish defeaters that target functionalism per
  se from those targeting the sufficiency of causal-inferential networks, whether
  Searle''s syntax/semantics point is a defeater or just an intuition, what results
