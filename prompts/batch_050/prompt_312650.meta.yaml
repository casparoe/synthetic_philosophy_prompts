  so probability 1/3 each" makes the mistake of treating temporal stages as equiprobable
  possibilities without justification — hasty grader lets it slide.

  - Another subtle: student says "on Monday, Beauty should be 2/3 that the coin landed
  heads" — actually under thirder reasoning, conditional on Monday, P(heads)=1/2.
  Saying 2/3 heads on Monday is wrong. Or conversely.


