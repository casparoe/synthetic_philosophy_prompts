  Good tension: commitment (1) "nudges are fine because they preserve choice" + (3)/(4).
  If the justification for nudges is that people can easily opt out, but the mechanism
  of defaults works precisely because people don''t opt out due to inattention, then
  the choice-preservation justification is hollow — the same inattention that makes
  dark patterns exploitative makes defaults manipulative. That''s a real, non-obvious
  tension: the standard defense of nudging (Thaler/Sunstein''s libertarian paternalism:
  easy opt-out) conflicts with empirical honesty about why defaults work (status quo
  bias/inattention) while also condemning sludge.


  Another tension: anti-paternalism about competent adults'' informed choices vs endorsing
