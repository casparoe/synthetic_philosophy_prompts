  Construct an argument: something like — Legalism claims rulers should govern via
  clear laws, rewards and punishments, not virtue. Argument that seems to prove too
  much: if incentives fully determine behavior, then law drafting itself... Or: an
  argument that seems to show Han Feizi''s system is self-undermining — the ruler
  must be virtuous to administer the system, or: if people only respond to incentives,
  the ruler himself responds only to incentives, so nothing secures the ruler''s adherence;
  or an argument that legalism collapses into rule by virtue.


  Good one: (1) People act only in response to incentives (rewards/punishments). (2)
  Officials are people, so officials enforce laws only when incentivized. (3) Incentivizing
  officials requires monitoring, and monitors are people too — infinite regress. (4)
  The only way to stop the regress is a final enforcer who acts without external incentive
  — i.e., from something like virtue or internal disposition. (5) So rule by incentives
  presupposes at least one agent ruled by virtue; hence pure legalism is impossible
  and every legalist state is secretly rule by virtue at the top. Conclusion proves
  too much — it would show Han Feizi''s whole project is incoherent. Where does it
  go wrong? Possible answers: Han Feizi''s shu (techniques) — the ruler''s position
  (shi) is self-reinforcing; or the regress stopped by mutual surveillance / informant
  networks; or premise (1) overstates — Han Feizi doesn''t need everyone to only respond
  to incentives, just that institutions shouldn''t rely on virtue; the ruler''s self-interest
  aligns with maintaining the system, so the top enforcer does respond to incentives
  (his own interest in keeping power). Interesting: the flaw could be equivocation
  on "rule by virtue" — needing a motivated agent at the top isn''t the same as ruling
  by virtue; the ruler''s incentive is self-preservation, which is an incentive. So
  premise (4) is the weak point: it assumes the final enforcer lacks incentives, but
  the ruler has the strongest incentive of all — keeping the throne. Actually the
  ruler''s behavior is incentivized by his situation. So the argument equivocates
  between "internal motivation" and "virtue."


