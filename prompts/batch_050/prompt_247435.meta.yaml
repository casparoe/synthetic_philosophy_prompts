  my position is unstable, and worse, that the reasoning behind it commits me to things
  I''d never accept. Here''s his argument, as best I can reconstruct it the next morning.


  1. A process preserves you if, throughout it, your stream of consciousness continues
  uninterrupted and you detect no change in yourself — and, he says, there is no better
  criterion available, since any criterion of survival that you yourself could never
  apply from the inside is metaphysical ornamentation, not a real standard.


  2. In one-by-one replacement with functionally perfect chips, consciousness continues
  uninterrupted and at no moment would you detect a change (a single neuron swapped
  for a perfect functional duplicate changes nothing you could feel or notice).


  3. So perfect gradual replacement preserves you, all the way to a fully silicon
  brain. So far I''m happy to follow him.


  4. But now consider imperfect replacement: each chip reproduces its neuron''s function
  only to within one part in ten thousand. At each individual swap, the difference
  is still far below anything you could notice or that anyone could measure in your
  behavior — one neuron, drifting 0.01%, among billions.


  5. So by the same reasoning, imperfect gradual replacement also preserves you.


  6. But 0.01% drift per neuron, iterated over the whole brain, doesn''t stay small:
  it compounds. The finished product might remember nothing you remember, love nothing
  you love, and — if the drift happens to erode whatever gives rise to experience
  — might not be conscious at all, without any single step being the moment it went
  dark.


  7. So my criterion of survival judges that I survive as a stranger to myself, or
  as no one. He says this is a reductio of premises 1–2, and hence of my whole case
  for preferring gradual uploading to scanning.


