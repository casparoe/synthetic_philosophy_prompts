  experiencing and noticing nothing at every moment, what could my complaint possibly
  be, and when would I even lodge it? But I can''t accept 7. Which step do you reject,
  and what does rejecting it cost? In particular, if you reject 1, tell me what better
  criterion of survival survives your own objections; if you reject the move from
