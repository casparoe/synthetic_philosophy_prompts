  Format:

  - The questions (numbered, each stated as a case or claim, with a note on what splits
  there) — about half the total

  - The tree itself, as indented text or an ASCII flowchart — a page-ish

  - Leaf notes: one short paragraph per leaf, its name, who holds it, its most awkward
