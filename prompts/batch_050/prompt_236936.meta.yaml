  doesn''t.


  Use concrete cases at the nodes, not abstract questions: quus-style re-interpretation,
  the systematic-mistake case (someone who''s consistently wrong by their own lights),
  Crusoe alone on an island, the case where two speakers'' dispositions diverge only
  on inputs neither will ever compute.


  Also: the logical space first. List the questions, the answer combinations they
  permit, then place the actual positions in that space, and note which combinations
  are empty and why (incoherent, or just undefended). Flag pairs of leaves your tree
