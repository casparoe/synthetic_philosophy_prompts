  I''m putting together the handout for the last week of my philosophy of language
  seminar, on the rule-following problem. I want a decision tree that starts from
  "I grant the skeptic that no finite stretch of past use, and no set of behavioral
  dispositions, uniquely determines what rule someone was following" and ends at a
  named position.


  Each branch node should be a question a student could answer without already knowing
  the labels — e.g., things like: is there any fact at all that constitutes what I
  meant by a word? If yes, could it be an irreducibly semantic fact, or must it reduce
  to something non-semantic? Does the answer depend on whether others around me use
  the word too? Is correctness of use something over and above community agreement?


  Leaves I want included: Kripke''s own skeptical solution, sophisticated dispositionalism
  (the version with idealized conditions), meaning primitivism (irreducible semantic
  facts), the communitarian reading, normativism about meaning (correctness conditions
