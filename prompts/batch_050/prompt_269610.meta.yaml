  to students, given prizes. So constructing, without consent, a speaking simulacrum
  of a real dead person is in itself morally permissible.

  (4) The widow''s service constructs, without consent, a speaking simulacrum of a
  real dead person. So it is permissible too, unless there is some morally relevant
  difference between it and the historical novel.

