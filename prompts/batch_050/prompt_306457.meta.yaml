  "I''m teaching an intro ethics + rational choice module for second-year undergrads,
  about 24 students, one 80-minute session..." Design a game around the hitchhiker
  problem: a stranded traveler gets rescued only because the rescuer believes they''ll
  pay later; once safe, paying looks irrational. Want students to feel the trap: the
