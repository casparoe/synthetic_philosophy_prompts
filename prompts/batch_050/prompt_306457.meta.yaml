reasoning_summary: 'Let me pick a domain and type. Parfit''s hitchhiker + classroom
  activity/game type is a great fit — the hitchhiker case is about rational choice
  when someone can read your intentions, and rational irrationality. A game that makes
  students feel the force of it: a staged choice with real small stakes where being
  trusted matters, and they have to decide whether to pay up when no one is watching.


  The Parfit hitchhiker: stranded in desert, motorist promises to rescue you if you
  promise to pay $100 when you get to town. Once in town, you no longer need the driver;
  rationality says don''t pay, but if the driver could read your character, being
  the type who pays is what got you rescued. So being disposed to act "irrationally"
  is rational.


  Design a classroom activity: e.g., a simulation where some students are "drivers"
  who must decide whether to pick up stranded "hikers" — they can see something about
  the hiker (a track record, or a "promise" made publicly) — and hikers then decide
  privately whether to pay. Round-based, with payoffs. Then variations: drivers can
  only trust reputation; drivers must guess intentions; hikers who never pay stop
  getting picked up. This makes students feel why you might want to cultivate a disposition
  to pay even when paying is "irrational" at the moment of choice.


  Avoid reusing example openings. Write casually, with context ("I teach a game theory
  / ethics course..."), specify group size, time, debrief requirements: rules, roles,
  timeline, debrief mapping, what predictably goes wrong, what feature can''t be reproduced.


  No quotes needed, no web search needed. Write 1-3 paragraphs, casual, maybe a typo.


