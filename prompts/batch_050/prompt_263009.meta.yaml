  ---


  I have been drafting the theory chapter of a textbook on non-cooperative game theory,
  and before finalizing it I would like to know whether the positions I have staked
  out are jointly tenable. Here is what I currently hold:


  1. A fully rational player never chooses a strictly dominated strategy, whether
  the dominating strategy is pure or mixed; domination by a mixture is exactly as
  decisive as domination by a pure strategy, since either establishes that the strategy
  is not a best reply to anything the player might believe.


  2. If the structure of the game and the rationality of all players are common knowledge,
  iterated elimination of strictly dominated strategies is complete: what survives
  is precisely the set of rationalizable outcomes, and identifying rational play with
  this set requires no assumption beyond rationality and common knowledge of it.


  3. A player can perfectly reasonably regard the choices of several opponents as
  correlated rather than independent — opponents trained in the same tradition, advised
  by the same consultant, or selected by the same process — and rationality itself
  imposes no requirement that a conjecture over others'' play take the form of a product
  distribution.


  4. Nash equilibrium should not be presented as a deliverance of rationality alone.
  It is better understood as a self-confirming configuration of mutual conjectures,
  which demands a coordination of beliefs going beyond anything rationality and common
  knowledge of rationality supply.


  5. Mixed strategies need not involve literal randomization. A player''s mixture
  can be read as the uncertainty others have about that player''s choice, or as the
  aggregate result of small private variations in payoffs, so the theory never requires
  anyone to flip coins.


  6. Weak dominance carries the same eliminative authority as strict dominance. Iterated
  elimination of weakly dominated strategies is a legitimate solution procedure, and
  I intend to apply it freely throughout the book''s examples.


  Please audit this set. Which commitments are in genuine tension with one another,
  and which pairs merely appear to be? For each genuine tension, identify the commitments
  involved, explain the conflict, and state what would have to give; rank the tensions
  by severity. For each merely apparent tension, explain why the worry dissolves on
  inspection. Finally, identify the single revision that would restore consistency
  at the lowest cost to the overall view, and be explicit about what that revision
  forfeits. I am not asking for a survey of positions in the literature; I want to
  know what my own commitments do and do not permit me to say.


  ---


