  I would like a consistency audit of a set of views I''ve arrived at about what rationality
  requires in strategic games. ...


  Context sentence: teaching a course / writing lecture notes. The commitments:


  (1) A fully rational player never plays a strategy that is strictly dominated by
  any other strategy, pure or mixed; domination by a mixture is exactly as decisive
  as domination by a pure strategy, because both show the strategy is never a best
  reply.


  (2) If the game''s structure and everyone''s rationality are common knowledge, then
  iterated elimination of strictly dominated strategies is complete: the strategies
  that survive are precisely the ones consistent with rationality and common knowledge
  of it — call the survivors the rationalizable outcomes — and no further assumption
  is needed to justify that identification.


  (3) It can be perfectly reasonable for a player to regard opponents'' choices as
  correlated rather than independent — e.g., opponents trained at the same school
  or briefed by the same consultant — and nothing in rationality itself demands that
  a player''s conjecture about several opponents be a product distribution.


  (4) Nash equilibrium should not be presented as a deliverance of rationality alone;
  it is best understood as a self-confirming arrangement of mutual conjectures, which
  requires coordination of beliefs beyond what rationality and common knowledge of
  it supply.


  (5) Mixed strategies should be understood without literal randomization: a player''s
  mixture can represent others'' uncertainty about what that player will do, or be
  purified by small private payoff shocks, so nothing in the theory requires anyone
  to flip coins.


  (6) Weak dominance deserves the same eliminative authority as strict dominance:
  iterated elimination of weakly dominated strategies is a legitimate way to solve
