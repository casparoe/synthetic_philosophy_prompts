  Let me draft the Copycat prompt.


  Persona: retired natural scientist (say, physicist or biologist), recently gotten
  into philosophy, reading about concepts, categorization, analogy. Wants a microdomain
  built to specs.


  Specs: Build a small, fully specified microdomain (not letter strings — something
  else, e.g., arrangements of beads, a grid of tiles, a simple board with tokens,
  or a made-up notation) consisting of a handful of object types and a handful of
  permissible transformations. Then construct two analogy problems in it of the form
  "A is to B as C is to ?": the first should have a clean, rigid answer requiring
  no conceptual slippage; the second should be solvable satisfactorily only if a concept
  the solver has built up from the first problem is allowed to "slip" to a neighboring
  concept (e.g., "same object" slips to "adjacent object," "increase" slips to "decrease,"
  "leftmost" slips to "rightmost"). The slippage should be forced by pressures internal
  to the problem, not by arbitrary fiat — there should be a reason the rigid answer
  fails and the slipped answer succeeds.


  Deliverables: full specification of the microdomain; the two problems with solutions;
  explanation of the pressure forcing the slip; discussion of how one would tell a
  genuine forced slippage from mere license (why isn''t any answer defensible by slipping
  far enough?); what makes some slippages "near" and others "far" in the domain''s
  conceptual space. Also: what would change the analysis — what feature, if removed,
  would make the second problem merely ambiguous rather than slippage-requiring; where
  the construction is most likely to be attacked as cheating.


  Constraint ideas: microdomain small enough to be described in a paragraph; no appeal
  to external knowledge; the rules must be stated explicitly; the slippage must be
  a single slip (not a chain). Also the asker wants it shown that the answer isn''t
  underdetermined — why the slipped answer is the best answer rather than just one
  of many.


  Also ask: how does this bear on whether "concepts" are fixed retrieval vs. constructed
  on the fly? Maybe keep the focus tight.


