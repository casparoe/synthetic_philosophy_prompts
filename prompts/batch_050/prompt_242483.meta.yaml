reasoning_summary: 'Pick a domain and type. Let me pick "Weakness of will (akrasia)
  and hyperbolic discounting" with the predict-verdict type. The asker describes their
  own past verdicts on cases (e.g., a friend''s resolutions) and asks prediction on
  a new case.


  Design verdicts consistent with multiple rules. E.g., a friend judges when abandoning
  a resolution counts as weakness of will vs. rational updating. Earlier cases:


  1. Quit new year''s gym resolution after two weeks because gym turned out crowded
  and bus schedule changed → friend said "rational revision."

  2. Ate the donut despite diet pledge, saying "just this once" → weakness of will.

  3. Stayed up watching TV instead of finishing thesis, planning to "start tomorrow"
  → weakness of will.

  4. Skipped morning run because of cold rain that hadn''t been forecast → rational.

  5. Refused second slice at wedding after diet pledge, though said she "really wanted
  it" → strong-willed.


  Candidate rules: (a) weakness = acting against plan without new information (new
  info → rational revision); (b) weakness = choosing immediate smaller reward over
  larger delayed one (hyperbolic discounting frame). New case where they diverge:
  e.g., friend skips thesis work tonight because genuinely tired (new bodily state?
  or no new info — tiredness isn''t new information but it''s an immediate state).
  Better: plans to wake at 6 to work on novel; alarm rings; she feels tired, decides
  sleep is valuable now, goes back to sleep — no new information, but the proximity
  of the reward changed her valuation. Under (a): weakness (no new info). Under (b):
  weakness too... need divergence.


  Divergence case: rule (a) says rational revision when new information arrives; rule
  (b) says weakness when preference flips only as reward nears. New case: she planned
  to finish thesis draft before watching the finale; then learned the finale was leaking
  spoilers online... that''s new info → (a) rational; (b) — temptation nearer → weakness.
  Divergence! Good: friend postpones a long-term goal when a tempting alternative
  becomes available but also when genuinely new information arrives about costs.


  New case: She pledged to save $200/month; this month she learns her car needs a
  $400 repair and skips the deposit. New info → rule (a) says rational; rule (b)...
  not really temptation. Hmm, divergence exists but trivial.


  Better new case designed to split the rules meaningfully: She resolves to write
  the report Sunday morning. Sunday morning arrives and, with no new information about
  external facts, the task suddenly feels aversive and the couch appealing; she "revises"
  her plan, telling herself she works better in the evening. Rule (a): depends on
  whether internal state counts as new information — ambiguous, good. Rule (b): classic
  hyperbolic reversal → weakness. And a third rule: (c) weakness = violating a resolution
  one still endorses at the moment of action (Socratic/austere definition — no akrasia
  if you genuinely changed your judgment). If her self-deceptive "revision" is genuine
  belief change, rule (c) says not akrasia. Three rules diverge.


  Ask: predict friend''s verdict, identify closest analog, and name a further case
  that would discriminate the rules.


  Write it formally, 2-3 paragraphs, with narrative seeding ("my roommate and I have
  a running game..."). No quotes from real texts needed. No web search needed.'
