  Student answer:


  "Take two observers, Maya and Noor, at same place but moving in opposite directions.
  Using standard clock synchronization, an event E on a distant galaxy can be simultaneous
  with their meeting for Maya, while a later eventF there is simultaneous with meeting
  for Noor. If what is simultaneous with us is what is real now, then E belongs to
  Maya''s present and F to Noor''s. There is no privileged frame, so there is no physical
  basis for saying one of these events exists and the other does not. Iterating over
  velocities, every event can be placed in somebody''s present. Thus all events are
  equally real and spacetime is block."


  "This does not rely on signals having already arrived. Relativity lets observers
  calculate which distant event is simultaneous after correcting for light-travel
  time. The real weak premise is not relativity of simultaneity but the identification
  of an observer''s present with reality. A presentist can deny this and say only
  here-now is real, while Minkowski simultaneity is merely a way of assigning coordinates.
  The argument also needs a transitivity principle: if E is real relative to Maya
  and Maya and Noor''s frames are equally legitimate, E is real relative to Noor as
  well."


  "The relativist can block argument by saying reality itself is frame-relative: E
  is real for Maya, F for Noor, no fact simpliciter. This preserves no privileged
  frame, but it has odd consequences because two observers at same event disagree
  about what exists. It is not the same as ordinary relativism about simultaneity
  because it makes existence, rather than temporal ordering alone, frame-dependent."


  "Block conclusion should not be confused with determinism. A fixed four-dimensional
  spacetime can have laws that do not determine earlier states from later ones. Also
  argument does not show that time''s passage is an illusion, only that it isn''t
  encoded in global simultaneity."


