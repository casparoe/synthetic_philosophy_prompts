  Exam question:

  "In special relativity, reconstruct Rietdijk–Putnam style argument from frame-dependent
  simultaneity to conclusion that past, present and future events are equally real.
  Use two observers moving relative to each other and a distant event, make each inference
  explicit. Then identify the strongest metaphysical premise, assess whether saying
