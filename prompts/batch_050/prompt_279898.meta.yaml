  Let me do Carroll''s tortoise with a prove-too-much argument. Construct carefully:


  (1) To be justified in accepting conclusion C from premises P via rule R, you must
  be justified in believing that R is valid.

  (2) Being justified in believing R valid requires a further argument establishing
  R''s validity.

  (3) That further argument itself proceeds by some rule R′, so by (1) you must be
  justified in believing R′ valid.

  (4) This regress is infinite (or circular), so no one is ever justified in accepting
  any conclusion by deduction.

  (5) But if deduction never justifies, neither does any argument for the reliability
  of perception, induction, testimony, since those arguments are deductions or rely
  on deduction.

  (6) So no belief is justified at all.


