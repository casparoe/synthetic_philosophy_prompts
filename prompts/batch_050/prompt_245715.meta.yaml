  of apodicticity; careful: the misrepresentation is "radicalized version of Descartes''
  doubt" — the fair part is Husserl himself acknowledged affinity with Descartes.
  So the audit is nuanced: partly fair (Husserl calls phenomenology a "neo-Cartesianism"
  almost), partly unfair (epoché is not doubt, not negation).

  3. "mental images in a private inner theater" — howler-ish? Husserl''s phenomenology
  is about intentional objects as meant, noemata, not images; he rejected imagism.
  Also the reduced sphere is transcendental consciousness, not the empirical/psychological
  inner sphere — the reduction is not retreat into the psyche; psychology itself is
  bracketed. That''s a good subtle error: conflating transcendental and psychological
  subjectivity.

  4. "doubt... everything science tells us" — bracketing science''s posits isn''t
  doubting their truth; natural sciences remain perfectly valid but their philosophical
