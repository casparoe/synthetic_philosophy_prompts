  Doubt is one modalization among others; epoché doesn''t even require doubt — it''s
  abstaining from positing.

  2. Not aiming at certainty as foundation — the point isn''t to find indubitable
  bedrock (that''s the Cartesian way Husserl later flirted with in Cartesian Meditations
