  Types: fair-summary audit; presuppositions of practice; role-play opening move.


  A good combination: "The self as a center of narrative gravity" with the fair-summary
  type — present someone''s summary of Dennett''s view and ask whether it''s fair.
  The summary should be mostly right with subtle misrepresentations: e.g., conflating
  "the self is a fiction" with "the self doesn''t exist" (Dennett says the self is
  like a center of gravity — an abstractum, real but not a thing in the brain), overstating
  the thesis into eliminativism, conflating narrative self with the stream of consciousness,
  "multiple drafts" conflation.


  Write a plausible summary attributed to an unnamed source (e.g., "a colleague who
  read Dennett years ago summarized..."). Avoid quoting Dennett verbatim — paraphrase.
  No citations needed. Formal/polished tone.


  Let me draft the summary with embedded subtle errors:


  1. "Dennett argues there is no self; the self is an illusion" — misrepresentation:
  he calls it a fiction but fictions in his sense are real patterns/abstracta, like
  centers of gravity; he explicitly resists saying selves don''t exist.

  2. "The brain contains a narrative, a single story it tells itself" — conflation
  with multiple drafts: Dennett denies there''s a single canonical narrative; there
  are multiple drafts, no final published text.

  3. "Because the self is a fiction, nothing matters morally..." — overstatement.

  4. Accurate parts: analogy to center of gravity (useful posit in physics), narrative
  self emerging from the stories we tell about ourselves, heterophenomenology-ish,
  no Cartesian theater / no central meaner... Actually the center of narrative gravity
  comes from "The Self as a Center of Narrative Gravity" (1988, in Self and Consciousness,
  eds. Kessel, Cole, Johnson). I shouldn''t lean on exact title/date necessarily —
  I can mention it loosely or not at all. Maybe mention it''s from Dennett without
  citing the specific paper, or say "Dennett''s account" generally. Safer to not give
  exact title. Could say "Dennett''s notion of the self as a center of narrative gravity"
  — the phrase is the topic itself, fine.


  Also: "the self is like a character in a novel, and just as a fictional character
  doesn''t exist, neither do you" — misrepresentation again of the abstractum point.
  Also conflation: Dennett''s point that the self is more like a theorist''s fiction
  (like centers of gravity, the Equator) rather than an authorial fiction. Actually
  Dennett says the self is a "theorist''s fiction" — like centers of gravity in physics,
  not like literary fictions. The error: treating it like a literary fiction.


  Also the asker may state inclination: "I suspect the summary is uncharitable..."


  Structure: formal opening describing where the summary was met (a popular philosophy
  of mind book? a professor''s lecture? a colleague). Ask: separate accurate, misleading,
  wrong; whether conclusions drawn follow.


  Draft:


  "In the course of preparing a lecture, I came across the following gloss in a colleague''s
  teaching notes on Dennett''s account of the self..."


  Summary text (single-quoted per examples):


  ''According to Dennett, the self is an illusion. There is no inner subject, only
  a brain that spins a continuous story about a character it calls "I," in roughly
  the way a novelist invents a protagonist. Since this character is a fiction, Dennett
  concludes that selves do not exist, any more than Sherlock Holmes does; what exists
  is only neural machinery plus a useful story. The unity you seem to experience is
  produced by a single master narrative the brain is constantly writing, and this
  explains why people with memory loss or multiple personalities lose their selves:
  the story breaks, and the character dissolves. Dennett''s own name for the self,
  a center of narrative gravity, is meant to signal this: a center of gravity is not
  a real part of an object but a made-up point, so the self is likewise made up.''


  Hmm — internal quote "I" inside single quotes is fine.


  Errors embedded:

  1. "the self is an illusion" / "selves do not exist" — Dennett explicitly resists
  this; fictions/abstracta are real in the way centers of gravity are real; he distinguishes
  the self as abstractum from a nonexistent thing. He says a self is not a nonexistent
  thing; it''s an abstraction like a center of gravity, which is perfectly real though
  not a material part.

  2. "a single master narrative" — conflicts with multiple drafts model; Dennett denies
  a canonical stream of narrative; content fixations are only where probed, etc.

  3. "a center of gravity is a made-up point" — Dennett''s point is the opposite:
  centers of gravity are fictional only in the theorist''s-fiction sense, yet real
  and predictive; the gloss uses it to support unreality.

  4. Multiple personality claim: Dennett actually discussed MPD/DID and was somewhat
  sympathetic to the idea that multiple selves could be real in his framework ("the
  self of a body"); the claim that he says people "lose their selves" is dubious —
  he thought one body could underwrite more than one self. That''s a subtle point;
  also dementia: he''d say the self can fragment. Fine as an overstatement.

  5. "only a brain that spins a continuous story... like a novelist invents a protagonist"
  — Dennett says the self is spun, but "web of discourses" — we''re not in control
  like a novelist; the story emerges without a chief author. "Our tales are spun,
  but for the most part we don''t spin them; they spin us." That''s a real quote —
  avoid verbatim. Paraphrase: Dennett stresses the narrative is largely not deliberately
  authored.


  Ask: which parts would Dennett accept, which reverse his point, whether the concluding
  deflationary reading follows, and what the analogy to center of gravity actually
  licenses. Also ask what a defender would say about moral responsibility / persistence,
  since the gloss implies nothing persists.


  Keep it formal. Ask deliverable: sentence-by-sentence or part-by-part audit, plus
  whether the final conclusion follows.


  Length: moderate. Write it.'
