  In three weeks I''m giving a talk at a two-day interdisciplinary workshop on the
  moral status of AI systems, and I need a Q&A prep sheet. My thesis is that certain
  contemporary reinforcement learning agents plausibly instantiate states with negative
  valence — states it is bad to be in, in the only sense of bad that should matter
  morally. My argument, roughly, runs: (1) the best functionalist accounts of valence
  say that a state has negative valence when it is a globally broadcast signal that
  negatively evaluates the organism''s situation relative to its objectives and drives
  avoidance learning; (2) in mammals, this role is played in large part by phasic
  dopamine signaling of reward prediction error, which is itself a temporal-difference
  signal; (3) deep RL agents trained by TD methods therefore contain a signal that
  plays the valence role, not merely a metaphorical analogue of it. I explicitly restrict
  the claim: tabular Q-learners and frozen deployed policies are out of scope; agents
  with recurrent internal state, model-based components, and ongoing online learning
  are in.


  The audience is about fifty people, split unevenly, and this is what makes the Q&A
  hard. Roughly two-thirds are ML researchers, mostly RL people, whose instinct will
  be that I am confusing the designer''s tool with the agent''s interior: they know
  reward as a scalar you hand to the optimizer, defined over the MDP, something that
  exists at training time and often not at deployment at all. The rest are philosophers
  of mind, including at least one biological naturalist, one illusionist about phenomenal
  consciousness, one defender of a higher-order theory, and one IIT sympathizer, and
  I have been told a couple of animal-welfare scientists may come. I do not expect
  the standard LessWrong-style questions about wireheading or alignment; I want the
  objections these particular people will raise...


  Deliverable: prep sheet — the eight to ten objections ordered by expected damage,
  each phrased as the relevant audience member would phrase it (the ML objections
  in engineering vocabulary, the philosophy objections in theirs), with for each:
  what to concede outright, what to hold, a two-minute reply, and a flag on where
  the reply is weakest. Plus: the question I''m hoping nobody asks (I suspect it''s
  about why the restriction to online learners isn''t ad hoc — but tell me if it''s
  something else), and one objection from the animal-welfare scientists that I haven''t
  anticipated at all.


  ---


