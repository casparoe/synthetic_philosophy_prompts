  satire.


  - "Confucian role ethics" + thought experiment.


  - "Turing''s views on ESP" — niche; Turing wrote "Computing Machinery and Intelligence"
  with the telepathy footnote. Could do satire: a mock Turing rebuttal letter. But
  relies on specific facts.


  - "Archives and power" + satire: an in-universe archivist''s accession policy that
  ironizes whose records get kept.


  I like AI control + satire: a parody of, say, a control-protocol evaluation report
  or a safety-case document that treats alignment as someone else''s problem. Target:
  the "control" paradigm''s tendency to assume untrusted models are scheming adversaries
  while trusted ones are fine — exaggerate a real feature. Or parody the "trusted
  monitoring" discourse: a mock incident postmortem where every failure is blamed
  on the untrusted model being insufficiently adversarial during evals.


  The humor must exaggerate a real feature. Real features of control discourse: trusted
  vs untrusted model distinction, honeypots, red-team/blue-team, "the untrusted model
  is assumed to be trying to subvert the protocol", audits with budgets of suspiciousness,
  defer-to-trusted, untrusted monitoring. A satire could be a fictional lab''s "Control
  Plan v7" FAQ or an onboarding doc, deadpan, that quietly reveals the whole edifice
  rests on the trusted model being aligned and the untrusted model being dumb enough
  to be caught — exaggerating the asymmetry assumptions.


