  Design the set:


  (1) Prudential hedonism: a life goes well to the extent it contains pleasure and
  lacks pain.

  (2) Heterogeneity thesis: there''s no common felt quality across pleasures — the
  pleasure of a warm bath, of finally getting a joke, of relief when the medical test
  is negative, of vindication in an argument. So felt-quality theories are dead.

  (3) I lean attitudinal: pleasure is a matter of the subject''s stance — being pleased
  with / wanting the experience as it unfolds.

  (4) Pain is just the opposite attitude — displeasure, wanting the experience to
  stop. Symmetry thesis.

  (5) I think it''s obvious that a person''s pleasures and pains can in principle
  be added up across time, and roughly compared across people — otherwise welfare
  economics and triage make no sense.

  (6) I''m unmoved by the experience machine: plug me in, I don''t care if it''s real,
  as long as it feels good? Or: "I''d refuse the machine and I don''t think that''s
  irrational."


  Genuine tensions:

