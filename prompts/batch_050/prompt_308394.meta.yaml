  it an apparent tension that dissolves: attitudinal hedonists can refuse the machine
  by valuing pleasures had about real things? Actually that''s a genuine cost. Hmm.


  Better genuine tension: (3) attitudinal hedonism + (5) pleasure must be able to
  explain motivation / play causal role in explaining behavior — attitudinal pleasure
