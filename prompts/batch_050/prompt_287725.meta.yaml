  to prevent worse violations. Classic: Robert Nozick''s "utilitarianism of rights"
  question. Could construct: an institutional review board deciding whether to authorize
  some rights-violating action that would prevent more rights violations.


  The paradox of deontology: deontological constraints prohibit rights violations,
  but that prohibition seems puzzling when violating a right now would prevent more
  numerous violations of the same right later — if the rights matter, shouldn''t we
  minimize their violation? Nozick''s famous question.


  The rationalist-blogs flavor: readers of LessWrong, Astral Codex Ten, etc. Use phrases
  like "side constraints," "threshold deontology," "consequentialization" sparingly
  — should be polished but feel at home. Shouldn''t be too heavy-handed.


  Construct a scenario: I sit on the board of an AI safety organization? Or more grounded:
  a research ethics committee considering a trial where the control group is denied
  a treatment (violating one person''s right to prevent future harm)? Hmm, paradox
  of deontology specifically: violating a constraint to prevent more violations of
  the same constraint.


  Good concrete case: an appeals/disciplinary panel at a university? Or a hostage/case?
  Better to keep institutional: A hospital ethics committee: a transplant surgeon
