  survival machines built by genes, which are the true units of selection because
  only they are copied from one generation to the next. Apparent altruism turned out
  to be selfishness in disguise — a gene for alarm-calling spreads because it helps
  copies of itself in relatives, not because it helps the group. Group selection has
  since been revived by some theorists under the name ''multilevel selection,'' but
  most biologists regard this as kin selection under another label, since the mathematics
  is equivalent. The upshot is that talk of traits evolving ''for the good of the
  group'' is not just usually wrong but conceptually confused: selection can only
  ever favor what benefits the replicator."


  Errors/subtle misrepresentations:

  1. "Williams demonstrated that natural selection operates on genes, not groups"
  — Williams''s actual argument: adaptation at group level should be invoked only
  when necessary ("ground rule" / parsimony); he argued many purported group adaptations
