  Idea: two people argue about Thomson''s lamp. One says the lamp''s state at t=2
  is undetermined because the supertask is physically/mathematically incoherent; the
  other argues via a continuity/limit argument. Then inject a novel twist: a variant
  where the switch is toggled only if a random event... Actually a good niche idea:
  the "supertask with convergence" — e.g., lamp toggled at times 1/2, 3/4, 7/8...
  and the question whether the final state is determined. Standard answer: not determined
  by the history; any state is consistent. Twist: one party claims that probabilistic
  reasoning rescues determinacy — each toggle is equally likely to leave lamp on or
  off... hmm.


  Alternative twist: the "littlewood–ross paradox" (balls and urn) — at each step
  add balls 10n+1...10n+10 and remove lowest-numbered ball; urn ends empty, yet at
  each step it grows. That''s a well-known supertask puzzle that separates those who
  understand from those who recite. A disagreement: one says urn is empty at noon,
  other says it must be infinite because net +9 each step. Both make decent points.
  Ask adjudication.


  Or combine Thomson''s lamp and Ross-Littlewood: disagreement about whether the two
  cases are analogous — lamp underdetermined, urn empty. One argues by symmetry that
  the lamp should be "both and neither," other says lamp has no limit whereas ball-count
  has a limit but state-set doesn''t converge pointwise... Actually the standard resolution:
  number of balls diverges to infinity, but for each ball n, it''s removed at some
  finite stage, so pointwise convergence gives empty. There''s no contradiction because
  the function "number of balls" is discontinuous in the limit.


  Make it a multi-round disagreement with four moves, adjudicate move by move, like
  the example. Keep short, formal, rationalist-reader voice (can mention "lesswrong-style"
  implicitly — "a longtime reader of rationalist blogs" perspective, maybe reference
