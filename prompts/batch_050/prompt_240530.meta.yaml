  Draft:


  "At our local rationality meetup, two regulars fell into an argument over the Ross–Littlewood
  urn paradox... [moves 1-4]. Please adjudicate move by move..."


  Moves:

  1. Alice: at noon the urn is empty — every ball is removed at a finite step, so
  no ball survives. Ball n removed at step n.

  2. Bob: the count grows by 9 each step and goes to infinity; cardinality can''t
  just drop to zero; claims she''s equivocating between "no particular ball survives"
  and "no balls remain."

  3. Alice: his cardinality argument proves too much — by the same logic Thomson''s
  lamp must have a definite state at t=2 (since its state exists at all earlier times),
  whereas the standard view is that it''s genuinely underdetermined; functions of
  the system need not be continuous in the limit.

  4. Bob: lamp and urn differ — the lamp''s state has no limit, but the ball count
  does (infinity), so the empty-urn conclusion is actually the one in trouble: if
  we take limits seriously everywhere, the urn should contain infinitely many balls,
  and "each ball is eventually removed" conflates pointwise convergence with convergence
  of the count.


  Hmm, but Bob''s move 4 partially right — indeed the count diverges; the resolution
