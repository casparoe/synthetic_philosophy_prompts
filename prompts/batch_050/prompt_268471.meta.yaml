  Prompt: journalist covering ideas, fact-checking a colleague''s explainer on populism.
  Summary text: "Populism is essentially democracy without the filters: it holds that
  legitimate authority comes from the will of the people, that this will is what the
  majority of voters say it is at the ballot box or in polls, and that elites and
  institutions — courts, central banks, the press — are suspect insofar as they frustrate
  that will. On this account, populists are impatient majoritarians, and the remedy
  for populism is more direct democracy, since if the people''s will is the standard,
  more referendums can only bring us closer to it. Rousseau''s idea of the general
  will is usually cited as the philosophical ancestor: the people''s collective decision
  about the common good."


  Embedded misrepresentations:

  1. Conflating the populist "people" with the empirical majority — populists typically
  posit a morally unified "real people" whose will can diverge from, and trump, actual
  vote counts (Mudde''s "pure people vs corrupt elite"; Jan-Werner Müller''s "exclusive
  moral claim to representation"). Populists often lose elections yet claim to speak
  for the people.

  2. "Will discoverable via polls/elections" — populist leaders often claim to know
  the people''s will independently of, even against, electoral results; and construing
  the will as aggregable overlooks the framing — the will is often treated as singular
  and self-evident, not constructed by aggregation.

  3. Rousseau gloss: general will is not the majority''s expressed preference (that''s
  the "will of all"); Rousseau was skeptical of direct majoritarian democracy and
  of partial associations; so citing him as ancestor of "more referendums" is at best
  contested.

  4. "Opponents of populism are elitists" implicit — the remedy claim: "more direct
  democracy" — contested: populists often don''t actually favor participatory institutions
  once in power; and critics say populism is not too much democracy but a deformation
  of it (illiberalism, anti-pluralism).


  Ask: sentence-by-sentence audit; what would a sympathetic populist accept vs object;
  what would critics (Mudde-style) object; does the remedy follow; which disputes
  are verbal (is populism an ideology, a logic, a style?).


