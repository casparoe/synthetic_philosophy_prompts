  Asker profile: someone preparing a position statement for a philosophy-of-religion
  reading group, having spent time with Advaita.


  Commitments:

  (1) Brahman alone is ultimately real; the world of names and forms is māyā — real
  enough to experience but not ultimately real, describable as neither existent nor
  nonexistent (anirvacanīya).

  (2) My true self (ātman) is numerically identical with Brahman, and always has been;
  liberation is the recognition of this fact, not the production of a new state.

  (3) Bondage is beginningless ignorance (avidyā); there was never a time when I was
  not ignorant, yet ignorance can be ended by knowledge.

  (4) Scriptural study, meditation, and a teacher are genuinely effective means to
  liberation; the tradition''s pedagogy works.

  (5) The liberated person (jīvanmukta) continues to act — teaches, eats, responds
  — until the body''s momentum (prārabdha karma) runs out, and their actions are not
  driven by selfish desire.

  (6) The distinction between the conventional and ultimate standpoints (vyavahārika
  vs. pāramārthika) resolves the main apparent puzzles: from the ultimate standpoint
  there is no bondage, no liberation, no seeker.


  Now, tensions:


  - (2) and (4)/(6): if liberation is recognition of an always-obtaining fact and
  ultimately there is no seeker, the efficacy of means within māyā — apparent tension,
  resolved by the two-standpoint framework itself (a dream tiger wakes you; the means
  belong to the conventional level whose unreality doesn''t block their conventional
  efficacy). This is the apparent tension that dissolves on inspection — but it''s
  subtle: the answer should note the "dream" analogy is standard and genuinely available.


  - (3) vs (2): beginningless ignorance is a real puzzle — if ātman is always Brahman
  and Brahman is self-luminous consciousness, how does ignorance arise at all, and
  in whom? Advaita says ignorance is beginningless (anādi) to block the question,
  but "beginningless yet endable" is itself in tension with (2)''s claim that bondage
  was never real. If bondage was never real, ignorance is beginningless only conventionally
  — so (3) taken literally conflicts with (6)''s reading. Genuine tension: either
  ignorance is real (and located somewhere — the locus problem: āśraya of avidyā,
  Brahman or jīva) or it''s mithyā, in which case the beginninglessness is a pedagogical
  device. The locus-of-ignorance problem is the classic internal dispute. This is
  a good deep tension.


  - (5) and (2): the jīvanmukta''s continued action. If the liberated one has no identification
  with body-mind and no desires, what accounts for continued action? Prārabdha karma
  explains momentum, but there''s a real tension: prārabdha karma presupposes the
  karma ledger of the individual, but knowledge is supposed to burn all karma (sancita
  and āgāmi); prārabdha persists "like the potter''s wheel." If the jīvanmukta truly
  sees no world (ajāti), whose wheel is spinning? Some Advaitins say the jīvanmukta''s
  body is only from others'' standpoint — consistent with (6), but then (5)''s description
  is itself only conventional, and there''s a question whether the liberated person
  can teach at all (teaching presupposes others). That''s a genuine subtle tension:
  (5) as literally stated vs. (6).


  - (1) and (4): if the world is māyā, scripture too is māyā — scripture is part of
  the world of names and forms. How can an unreal text produce real knowledge? The
  standard reply: it removes ignorance, not produces Brahman; like the dream-lion.
  Apparent tension dissolving via the two-level move — but it reveals that (4) must
  be understood conventionally, so maybe classify as apparent.


