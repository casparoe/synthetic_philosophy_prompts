  and small credences scattered elsewhere. Here are my verdicts on cases, and I want
  to know what principle, if any, unifies them.


  1. Lying to a friend to spare her feelings... consequentialism says the lie is mildly
  good; deontology forbids it. Verdict: don''t lie.


  2. Donation: consequentialism demands I donate a large share of income; deontology
  permits but does not require it. Verdict: I must donate something meaningful, but
  I may keep far more than the consequentialist demands — the duty feels real but
  discounted.


  3. Meat: I have only ~5% credence in a view where animal suffering matters nearly
  as much as human suffering, on which factory farming is a catastrophe. Verdict:
  that small credence is enough — I should stop eating meat, even though on my dominant
  view it''s permissible.


  4. Fanatical tiny credence: I can''t rule out (0.01% credence) a view on which some
  trivial daily act — say, failing to recite a certain phrase — carries astronomical
