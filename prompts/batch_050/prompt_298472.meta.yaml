  two shortcomings: it limits itself to statements of subject-predicate form, and
  it appeals to a notion of containment which is left at a metaphorical level."


  Elif''s position: this is a cheap shot. Containment isn''t a metaphor... we all
  understand what it is for one concept to include another — ''bachelor'' contains
  ''unmarried'' the way a set contains a subset — and Fregean logic handles subject-predicate
  limitations, so both "shortcomings" are just complaints that Kant didn''t write
  in 20th century notation. Worse, she said, Quine''s own standard here — that a notion
  must be clarified in non-metaphorical, scientifically respectable terms — already
  assumes the extensionalist scruples he''s supposed to be arguing for, so the objection
  smuggles in the conclusion.


  Marco replied: (1) the subset analogy doesn''t survive contact with actual cases
  — ''creature with a heart'' and ''creature with a kidney'' pick out the same animals
  but differ in meaning, which shows extensional containment is exactly not what concept-containment
  is, so the intuitive gloss fails on Quine''s own example later in the section. (2)
  Quine isn''t demanding extensional clarification specifically; he''s saying that
  however you cash it out — synonymy, definition, necessity — you end up needing another
  member of the same family of notions, which the rest of the paper shows. The metaphor
  complaint is just the first move, not the whole argument.


  Elif came back: that''s fine as a reading of the whole paper but it concedes her
  point that §1 by itself does no work — the "metaphor" gibe only looks like an objection
  if you already know the later sections, and plenty of notions (knowledge, cause,
  person) are metaphorical or unanalyzed in exactly the same way without anyone concluding
  there''s no distinction to be drawn. Vagueness/unclarity of a concept''s analysis
  ≠ no difference in extension, she said — we can''t define ''game'' either but chess
  is one and diplomacy isn''t.


  Marco''s last move: that analogy cuts against her — ''game'' is exactly the kind
  of case where the boundary goes wobbly (is morning stretches a sport? is Diplomacy
  a game?), and Quine''s point is precisely that the analytic/synthetic boundary behaves
  like that even though its defenders treat it as razor sharp.


