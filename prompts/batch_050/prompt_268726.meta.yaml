  Prompt draft:


  "I''m taking a course on social epistemology... We''ve been discussing the idea
  that photographic and video evidence historically functioned as an ''epistemic backstop'':
  even where testimony conflicts, recordings could settle disputes because producing
  a convincing fake was prohibitively difficult. Now that deepfakes make synthetic
  video cheap, my understanding is that the backstop is gone — any video can be dismissed
  as fabricated (the ''liar''s dividend''), so recordings no longer constrain what
  public figures can plausibly deny. Given that the backstop has collapsed, why do
  courts, journalists, and fact-checkers still treat video footage as strong evidence?
  Shouldn''t epistemically responsible institutions now assign video roughly the same
  evidential weight as anonymous testimony?"


  The confusion: treating the backstop as a binary property that was "destroyed" rather
  than degraded; conflating the possibility of fakes with equal plausibility; ignoring
  that provenance, chain of custody, multiple independent recordings, institutional
  verification still matter; ignoring that the backstop never rested on impossibility
  of fakery (photographs were always manipulable). Good answer corrects: deepfakes
  raise the cost of trusting video but don''t reduce it to testimony-level; the liar''s
  dividend is about plausible deniability in the court of public opinion, not logical
  defeater.


