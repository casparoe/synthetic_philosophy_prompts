  Inject a niche idea: the ravens paradox has solutions: Hempel''s own bite-the-bullet,
  the Bayesian resolution (confirmation is real but tiny, depending on background),
  the objection that it depends on background knowledge (e.g., observing a white shoe
  could disconfirm if you might be in a world where... Good on background: the "white
  shoe confirms ravens are black" can actually disconfirm under certain priors — e.g.,
  if sampling method matters: seeing a non-black thing selected randomly vs. selected
  as a non-raven). Also the "nicod''s criterion" and the paradox of confirmation.
  Also projectability (Goodman grue) connections.


  Reading The Purloined Letter: Dupin solves the case not by exhaustive search but
  by reasoning about the Minister''s mind — the prefect searches the hotel thoroughly
  (microscopes, needles probing cushions) and finds nothing; the letter is hidden
  in plain sight. Confirmation angle: the prefect''s exhaustive negative searches
  are like accumulating non-black non-ravens — each empty hiding spot confirms "the
  letter isn''t cleverly hidden" and thus indirectly confirms... Hmm. The prefect''s
  failure: he confirms "the letter is concealed in the kind of place a clever hider
  would use" is false by elimination, but the evidence doesn''t speak to the hypothesis
  "the letter is in plain sight." The Bayesian point: evidence confirms a hypothesis
  only relative to alternatives; exhaustive search confirms "not hidden cleverly"
  but the prefect never tests alternatives. Also the equivalence condition: "all ravens
  are black" is logically equivalent to "all non-black things are non-ravens" — but
  evidentially, whether an instance confirms depends on how the instance was selected
  (selection procedure matters). In the story: the method of search determines what
  the negative results confirm. Dupin''s insight: the Minister, being both poet and
  mathematician, knows the police''s model of him; the letter''s visibility is a selection
  effect.


  Also the raven paradox''s lesson about "natural kinds/projectability": Dupin notes
