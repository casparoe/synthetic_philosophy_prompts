  rather than one sphere counted twice by a redundant description, the way gauge-redundant
  descriptions double-count one physical situation? Is there a coherent notion of
  "how many" for perfectly indiscernible objects, and does ordinary mathematics (or
  the quantum-statistical treatment of indistinguishable particles, where permuting
  them yields no new state) settle it either way?

