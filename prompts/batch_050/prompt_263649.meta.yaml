  I have defended, in an essay, the following position, which is stronger than the
  usual appeal to Black''s two-sphere world. Take any possible world W. There exists
  a distinct possibility W* that is exactly like W except that everything in it is
  qualitatively duplicated: for Black''s world, the world containing two qualitatively
  identical iron spheres two miles apart in otherwise empty space is a genuine possibility,
  and in general "doubling" a world always yields a new possibility rather than the
  same possibility described twice. Hence the identity of indiscernibles is false
  in a strong form: numerical distinctness never requires a qualitative difference.
  I call this the doubling principle.


  What would count against it? Map the position''s exposure:


  1. Which premises it depends on. Presumably some form of spacetime substantivalism
  or haecceitism (the two spheres must be distinguished by their positions), and the
  legitimacy of "primitive thisness." Identify each load-bearing commitment and what
  its failure would do to the principle — fatal or merely costly?

