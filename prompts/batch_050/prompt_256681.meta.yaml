  Question wording: "Q4. Death in Damascus. (a) Set out the case. (b) Which theory
  or theories of rational decision does it trouble, and why exactly? (c) How does
  the problem differ from the one posed by Newcomb''s problem? (d) Does the problem
  require the predictor to be infallible, or would high reliability do? Explain. [20
