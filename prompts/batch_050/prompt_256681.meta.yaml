  Student answer (~350 words):


  "Death in Damascus is a decision problem based on an old story. A man meets Death
  in the market in Damascus, and Death tells him they have an appointment the following
  day — Death being, in this version, an infallible predictor who has already made
  an appointment with him in whichever city he will be in tomorrow. The man can stay
  in Damascus or flee overnight to Aleppo. Since Death has predicted his movements
  with perfect accuracy, whichever city he chooses, that is where Death will be waiting.


  The case was introduced into the decision theory literature by Gibbard and Harper
  (1978). It is generally taken to cause trouble for causal decision theory. The problem
  is instability. Suppose the man comes to believe that Death expects him to stay.
  CDT then tells him to flee, since his action cannot causally influence where Death
  has made the appointment, and fleeing is better given that belief. But as soon as
  he decides to flee, he acquires decisive evidence that Death''s appointment is in
  Aleppo, and CDT now tells him to stay. Whichever option he settles on, his own decision
  gives him reason to think the other would have been better, so no option survives
  rational reflection.


  The contrast with Newcomb''s problem is instructive. There, CDT and EDT simply disagree:
  CDT says two-box, EDT says one-box, and each verdict is at least stable on its own
  terms. Death in Damascus is worse, because it does not just produce a disputed verdict
  but shows that deliberation can fail to terminate at all. Evidential decision theory
  is in no better position here: since each act is equally strong evidence of death,
  EDT ranks staying and fleeing as equally good, so it too fails to tell the man what
  to do. The case is thus a counterexample to both theories.


  Finally, the problem clearly depends on Death being an infallible predictor. If
  Death were merely reliable, the man''s decision would give him only probabilistic
  evidence about Death''s location, and CDT could then recommend whichever city Death
  is less likely to be in. Only with infallibility does the instability arise, since
  only then does his decision settle the location with certainty."


  Mistakes: (1) "EDT ... fails to tell the man what to do ... counterexample to both
  theories" — the tie/indifference is not instability; EDT''s verdict is stable (permissible
  either way); the standard lesson is the case troubles CDT specifically. Subtle:
  a hasty grader sees "both options equally bad, so EDT fails too" and might nod.
  Good.


  (2) "problem clearly depends on infallibility ... Only with infallibility does the
  instability arise" — wrong: instability arises with sufficiently high reliability;
  the structure (his decision being strong evidence of the fixed appointment) doesn''t
  require certainty. Indeed with a perfect predictor some argue there''s no real choice
  problem at all / he''s simply doomed. The exam question (d) asks exactly this, so
  the student gets part (d) wrong. Good.


  Also check the correct parts are actually correct: CDT reasoning "his action cannot
  causally influence where Death has made the appointment" — right, the appointment
