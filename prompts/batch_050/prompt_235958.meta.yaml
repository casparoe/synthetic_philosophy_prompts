  The hinge of history hypothesis: an activity where participants must allocate influence
  under uncertainty about which moments are pivotal — staged simulation of "which
  century would you choose to live in if you wanted to maximize your influence?" That''s
  nice: a game where participants feel the force of the hinge hypothesis by having
  to defend that their assigned era is the most influential.


  Let me design: a workshop/reading group of, say, 10-12 early-career researchers,
  75-90 minutes. Each participant is assigned a century (or a decade) and must argue
  that an agent with a fixed budget of "influence" should spend it in their era. Twist:
  inject uncertainty rules — e.g., a "pivotal moments" deck of cards, hidden information
  about what actually mattered. The idea: make participants feel how the hinge claim
  depends on fragile judgments about contingency, lock-in, and the distribution of
  influence across time.


  Alternative: simulate long-run trajectory decisions. The facilitator runs a mini
  civilization game where small interventions at certain moments have compounding
  effects vs. dissipating effects, and participants must decide when to intervene
  with limited resources. Then reveal that which moments were "hinges" depended on
  features they couldn''t easily see ex ante (path-dependence, lock-in, contingency).
  Debrief maps onto hinge of history: is our time special (longtermism, AI), or is
  "we live at the hinge" a cognitive bias every era would have?


  I like: give each small group a fictional history timeline of a civilization (constructed,
  so no niche facts needed) where they allocate "influence points" across centuries;
  afterward, the facilitator reveals a designed causal structure showing which interventions
  compounded. Actually even better: run it live — the facilitator processes interventions
  through a hidden rule-set so the "history" actually unfolds. But simpler: a structured
  deliberation with a constructed fictional world.


  Simpler design: "Hinge auction" — participants bid limited influence tokens on eras
  of a fictional world''s history, with cards describing events; after allocation,
