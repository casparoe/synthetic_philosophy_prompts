  actually shaped the long-run outcome. The multipliers encode lock-in and path-dependence.
  Participants feel: (1) the pull to pick "obvious crisis moments," (2) that hinges
  are only visible in retrospect, (3) the anthropic/presentism worry — every generation
  could think their moment is the hinge. Debrief maps onto the real debate: longtermism,
  AI timelines, "the most important century" claims, and the epistemology of pivotalness.


