  are the ultimate resource" (Julian Simon''s phrase — attribution needed? Simon''s
  book is The Ultimate Resource, 1981. Better not attribute). Or "every child is a
  gift" / "the more, the merrier". "The more the merrier" applied to population —
  what precise claims? That could be fun: ask to disambiguate "the more, the merrier"
  in population ethics: total utilitarianism vs average, person-affecting views, the
  repugnant conclusion. This is nicely in the weeds.


  Option: Han Feizi + summary fairness: a popular book summarizes Legalism as "rule
  by fear, treat people like rats..." Actually a slogan from Legalism: "The ruler
  does not value the worthy... govern by law, not by men" — "rule of law, not rule
  of men" is a slogan often used to describe Legalism, which is actually a mischaracterization
  (rule by law vs rule of law). That''s a good slogan prompt: someone says Han Feizi
  advocated "rule of law," and asks what precise claims that could make. Distinction
  between rule of law and rule by law is well-known but the precisification is meaty.


  Option: Abortion + slogan: "every child a wanted child", "my body, my choice" —
  precisify "my body, my choice": bodily autonomy reading (Thomson), property reading,
  anti-interference reading... and which readings support which conclusions given
