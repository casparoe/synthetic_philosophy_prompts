  violinist — construct a variant where the intuition flips or where Thomson''s argument
  fails... Classic request: construct a case structurally parallel to the violinist
  where the intuition that unplugging is permissible disappears — isolating which
  feature does the work. That''s somewhat common. Alternatively combine Strawson''s
  Basic Argument with "what would count against it" type. Or construct a thought experiment
  for the socialist calculation debate? Harder.


  Thomson''s violinist variant is well-trodden; to be in-the-weeds, ask to construct
  a case that is analogous to pregnancy *in the ways Thomson''s argument needs* but
  where unplugging seems impermissible, with constraints: no death, ordinary life,
  and the burden must arise from the agent''s own voluntary action... Then walk through.
  Actually the harder direction people struggle with: Thomson''s critics say violinist
  fails because of killing vs letting die, or parental responsibility. A good spec:
  construct a case where the famous violinist intuition holds (unplugging permissible)
  but the case shares the features critics say distinguish pregnancy — the person
  is responsible for the violinist''s dependency (caused it), and unplugging kills
  rather than merely letting die — so that responsibility and killing/letting-die
  don''t block Thomson''s conclusion. That isolates what feature actually drives the
  anti-Thomson intuition. That''s a nice engineered case.


  Constraints: no trolleys, realistic-ish, one paragraph. Then demonstrate: state
  the verdicts, show that causing-dependency and actively killing don''t change the
  intuition, identify what feature does the work if intuition flips, and how a critic
  (e.g., someone who thinks Thomson''s argument fails for rape-exception-only scope)
  would attack.


