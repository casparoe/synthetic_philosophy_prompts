  Let me construct an argument that proves too much for deontology. Something like
  the aggregation/pooling argument: constraints prohibit killing one even to save
  many, but also prohibit... Standard puzzle: constraint against killing one to save
  five, yet when it''s kill one to save five million, deontologists balk; also the
  "paradox" that constraints seem to make states of affairs worse. Another nice "proves
  too much" argument: constraints against lying — if lying is categorically wrong,
  then lying to the murderer at the door is wrong; if we build in exceptions, the
  constraint collapses.


  Better: an argument whose premises each seem plausible to a deontologist and conclude
  that deontology is committed to something absurd — e.g., that one may not kill one
  to prevent five killings (the standard paradox), extended: may not kill one to prevent
  a million killings; may not lie to prevent catastrophe; so deontology requires letting
  the world burn. Where does it go wrong? The subtle flaw could be an equivocation
  between "doing harm" and "allowing harm," or a scope shift between agent-relative
  and agent-neutral evaluation, or a slide from "wrong for an agent" to "bad simpliciter."


  Let me design numbered premises:


  (1) If an act-type is governed by a deontological constraint, its wrongness does
  not vary with the consequences of performing it.

  (2) Killing an innocent person is governed by such a constraint.

  (3) So killing one innocent person is wrong even when doing so would prevent five
  other innocent people from being killed.

  (4) The number five plays no principled role: any consideration that blocks weighing
  one death against five blocks weighing one against any number.

  (5) So killing one innocent person is wrong even when doing so would prevent any
  number of killings — including killings of the very kind the constraint protects.

  (6) So a constraint whose point is to protect persons requires permitting more persons
  to be harmed, in exactly the way it prohibits.

  (7) A normative principle that systematically requires outcomes worse by its own
  lights is incoherent.

  (8) So deontological constraints are incoherent; at best "killing is wrong" is a
  defeasible rule of thumb (threshold/consequentialist reading).


  Ask: which step to reject, what it costs. The interesting answers: reject (1) —
  constraints limit what agents may do, but wrongness varying with consequences isn''t
  the right way to state it; the deontologist accepts agent-relative reasons; step
  (4) is where the slide occurs — the deontologist can hold constraints are not minimizing
