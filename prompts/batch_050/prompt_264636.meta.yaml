  Argument:

  (1) A trivial inconvenience is still a genuine cost, and costs of the same kind
  add up: two people each inconvenienced is worse than one.

  (2) For any burden, however small, there is some number of people such that bearing
  it across all of them is worse than one person bearing a severe burden (continuity/aggregation).

  (3) Therefore it can be right to impose a severe burden on one person to spare sufficiently
  many people trivial ones.

  (4) But by the same arithmetic, it can be right to let one person be tortured for
  fifty years rather than allow dust specks in 3^^^3 eyes — or even to sacrifice one
  life to spare enough people a papercut.

  (5) That conclusion is absurd.

  (6) So aggregation across persons must be rejected... but rejecting it seems to
