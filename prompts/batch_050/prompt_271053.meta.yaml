  Good fit: Frankfurt cases and principle of alternative possibilities — a disciplinary
  panel memo about a case where someone acted wrongly but arguably couldn''t have
  done otherwise... Classic Frankfurt. E.g., a university honor council case: a student
  plagiarized but a monitoring system would have forced... Frankfurt case: someone
  decides on their own, but a counterfactual intervener would have forced the decision
  anyway. Institutional body: disciplinary panel deciding responsibility/punishment.


  Alternatively causation by omission: ethics committee deciding liability for failing
  to act — e.g., an IRB deciding whether a researcher "caused" harm by omitting disclosure.


  Frankfurt memo idea: I''m on a workplace disciplinary appeals panel. An employee
  deliberately leaked documents; unknown to her, a fail-safe system would have released
  them anyway if she''d decided not to. Question: does she deserve the same sanction
  since she couldn''t have done otherwise? That''s a neat Frankfurt-style institutional
  case. The deliverable: written opinion recommending a sanction, engaging PAP vs.
  Frankfurt, and honest treatment of the losing side.


  Or the counterfactual intervener: a supervisor standing ready to coerce. Better
  to keep it concrete: e.g., hospital disciplinary board — a nurse falsified a chart;
  unknown to her, an automated backup system would have recorded the same entry...
  hmm, that changes facts.


  Classic: she chose X on her own; had she wavered, device/person would have made
  her do X. Institutional analog: software trigger. E.g., employee at a bank attempted
  to transfer funds fraudulently; unknown to him, a compliance officer monitoring
  was instructed to force the transfer through if he hesitated. He never hesitated.
  Panel must decide whether the fact he "couldn''t have done otherwise" mitigates.


  Make it a memo: chair of an appeals panel, draft the opinion recommending outcome,
  address the argument that alternative possibilities matter for blame, and the strongest
  counterpoint.


  Keep short, formal. No quotes needed — no web search needed. Avoid naming specific
  works with dates; Frankfurt''s case is well-known, safe to reference lightly, but
  the prompt says the case should instantiate the issue whether or not named. I can
  mention Frankfurt-style briefly.


  Draft:


  "I chair the appeals panel of my professional licensing board for financial advisors.
  A member, on his own initiative and after full deliberation, diverted client funds
  to a personal account; the transfer was caught and reversed. The facts not in dispute
  include this one: his line manager, suspecting him, had quietly arranged that any
  hesitation at the final authorization step would be overridden and the transfer
  executed on his credentials regardless. He never hesitated. On appeal he argues
  that because he could not have done otherwise, he cannot be blamed to the same degree
  as someone who had a genuine alternative, and asks that the sanction be reduced
  from revocation to suspension. Draft the written opinion I will circulate to the
  panel: recommend an outcome, give the reasoning, address whether the absence of
  alternatives bears on culpability as opposed to merely on the fairness of the process,
  and take seriously the strongest point on the appellant''s side rather than dismissing
  it."


  That''s good — Frankfurt case embedded, PAP at stake, institutional deliverable,
  losing-side treatment. Polished and short. No quotations. Good.'
