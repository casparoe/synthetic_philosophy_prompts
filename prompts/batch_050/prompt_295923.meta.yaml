  Prompt draft:


  "You are a philosopher who has spent several years working on the strategic dynamics
  of advanced AI systems, with a background in decision theory and game theory. Think
  carefully before writing; I want considered judgment, not a survey of talking points.


  Context. In discussions of AI alignment, people invoke what is usually called the
  strategy-stealing assumption: roughly, the claim that for any strategy a misaligned
  or unaligned AI system might pursue to gain influence over the future, an aligned
  system could pursue a modified version of that strategy — one that achieves comparable
  influence while remaining aligned — and thereby prevent the misaligned system from
  gaining an advantage simply by being unscrupulous. The assumption is doing load-bearing
  work: if it holds, alignment need not put a system at a competitive disadvantage;
  if it fails, alignment is a handicap, and safety-conscious developers lose races
  by definition.


  I''ve noticed that invocations of this assumption are almost never accompanied by
  a specification of what it would take for it to be true. Before I assess any particular
  argument for or against it, I want the specification.


  Task. Write the desiderata that an adequate account of strategy-stealing must meet
  — the conditions under which ''the aligned system can just copy the strategy, minus
  the bad parts'' is actually guaranteed, or at least defensible. For each desideratum,
  give the consideration or case that motivates it and state whether you take it to
  be non-negotiable or a preference of a particular camp. Concretely, your list should
  at minimum address:


  - what individuates a ''strategy'' finely enough that stealing is well-defined but
  coarsely enough that the aligned version counts as the same strategy;

  - what resources or capabilities the copier must have that the original''s strategy
  presupposes, and what happens when it doesn''t have them;

  - the epistemic problem: how the copier identifies the strategy to steal when the
  misaligned system has reason to conceal it;

  - symmetry: whatever lets the aligned system steal from the misaligned one seems
  to let the misaligned system steal from the aligned one — say whether an adequate
  account must break the symmetry and how;

  - the temporal structure: stealing implies lag, and lag may be decisive in domains
  with winner-take-all dynamics.


  Then: (a) identify any subset of these desiderata you suspect cannot be jointly
  satisfied, and say what follows for the assumption itself; (b) say which single
  desideratum does the most work in excluding naive versions of the assumption; (c)
  very briefly — one short paragraph — sketch how the assumption fares against your
  own list. Keep the weight on the criteria, not the scorecard.


  To fix the purpose: I want to know whether a lab could rationally commit to alignment
  on the grounds that it forfeits little or no competitiveness — not whether strategy-stealing
  is a comforting story."


