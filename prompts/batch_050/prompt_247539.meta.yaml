reasoning_summary: "Let me pick a domain and type. The \"proves too much\" type with\
  \ Goodhart's law / specification gaming could be great. Or role-play with Kierkegaard's\
  \ Abraham. Or extended mind with a thought experiment.\n\nLet me pick \"Present\
  \ an argument that seems to prove too much and ask where it goes wrong\" combined\
  \ with the extended mind thesis. An argument that if Otto-the-notebook counts as\
  \ memory, then... everything becomes part of the mind — Google, my filing cabinet,\
  \ the library, other people — so mind leaks everywhere; where does it go wrong?\
  \ That's a classic \"cognitive bloat\" objection but I should make it more in-the-weeds\
  \ with a specific chain.\n\nAlternatively, Goodhart's law with a proves-too-much\
  \ argument: any metric optimized becomes useless → therefore measurement itself\
  \ is bad → management/science impossible → absurd. Where's the flaw? That's decent.\n\
  \nLet me build the extended mind one carefully. The Otto case (Clark & Chalmers\
  \ 1998): Inga remembers from biological memory; Otto, with Alzheimer's, uses notebook.\
  \ Parity principle. The \"cognitive bloat\" objection: if notebook counts, why not\
  \ the library, Wikipedia, my friend's memory, etc.\n\nA proves-too-much argument:\
  \ \n1. A resource R is part of my cognitive process if it plays the same functional\
  \ role as internal cognitive machinery would.\n2. My neighbor's encyclopedia/knowledge,\
  \ or the internet, would play the same functional role...\nBut need subtlety: the\
  \ flaw could be in the functional role claim — Otto uses the notebook automatically,\
  \ transparently, fluently, endorses it, constant access (Clark & Chalmers's own\
  \ criteria). An argument that sneaks in \"plays the same functional role\" equivocating\
  \ between standing/dispositional role vs. actual deployment pattern.\n\nLet me draft\
  \ a numbered argument the user \"can't find the exit\" from:\n\nSetup: I'm reading\
  \ about extended mind for a course; a friend gave me this argument that extended\
  \ mind proves too much, or conversely an argument from the extended mind premises\
  \ that concludes everything is mental.\n\nDraft:\n\n(1) If some bit of the world\
  \ reliably drives my beliefs and behavior the way an internal memory would, then\
  \ it's part of my memory — that's the parity principle.\n(2) Otto's notebook does\
  \ this, so the notebook's entries are among his beliefs (standard extended mind).\n\
  (3) But consider: I don't personally remember my parents' anniversary; my sister\
  \ does, and whenever it matters she tells me instantly and I take her word without\
  \ checking. Her knowledge drives my behavior the same way.\n(4) So my sister's memory\
  \ is part of my mind.\n(5) Same for the librarian, for Wikipedia on my phone, for\
  \ the filing system at work, etc.\n(6) So minds routinely include other people and\
  \ institutions — the boundaries of persons dissolve.\n(7) That's absurd; so extended\
  \ mind is false / parity principle is false.\n\nWhere does it go wrong? Actually\
  \ the flaw: step (3)/(1) equivocation — parity requires the information be accessed\
  \ with the same fluency, automaticity, transparency, and endorsement as internal\
  \ memory (Clark & Chalmers's own criteria: constant availability, direct access,\
  \ automatic endorsement, past conscious endorsement). Consulting another person\
  \ involves modeling them as a source, testimony — a different functional role. But\
  \ defenders (and the \"cognitive bloat\" critics) would press that these criteria\
  \ are gerrymandered. Actually, there's a real debate: Clark resisted bloat via the\
  \ criteria; some (transactive memory literature, Wegner's couples) embrace partial\
  \ extension. So the honest answer: the argument isn't strictly invalid — it identifies\
  \ that parity alone without conditions licenses bloat; the move is to add glue-and-trust\
  \ conditions, but those risk being ad hoc / anthropocentric. That's a genuinely\
  \ hard case — good for the type.\n\nCasual tone, typo or two, one-to-three paragraphs,\
  \ elaborate with seeding (\"I was discussing with my friend...\", \"taking a philosophy\
  \ of mind course\"). No quotes from real texts, no citations needed. No web needed\
  \ — I know this material well.\n\nWrite it."
