  \ problem + recount a disagreement and adjudicate. That's a good fit. Write a formal,\
  \ rationalist-flavored prompt with a back-and-forth disagreement, plus structured\
  \ JSON verdict request.\n\nLet me construct a disagreement. Wrong kind of reasons\
