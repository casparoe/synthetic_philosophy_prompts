  \ citation.\n\nDraft:\n\n\"I'm designing a seminar unit on Gregory Kavka's toxin\
  \ puzzle and want to test whether the puzzle survives translation out of its science-fictional\
  \ packaging. Construct a thought experiment that reproduces its structure — a reward\
