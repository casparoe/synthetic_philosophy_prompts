  Idea: Each writer drafts a character with detailed backstory. Then the activity:
  "write the counterfactual biography" — the same person, but born to different parents
  / different gametes. Participants will intuitively write "what would my character
  be like if..." and then a structured exchange reveals that they''ve smuggled in
  a persisting essence (temperament, soul, a narrative voice) that survives the change
  of origins. The facilitator''s constraint: you may change anything about the character''s
  life but must keep it the same person; then reveal that changing the sperm/egg while
  keeping "the person" requires positing something that ties identity across origins
  — feel the pull of origin essentialism vs. counterpart thinking.


  Maybe staged game: Writers submit character cards with traits. A "redistribution"
  mechanic: traits are assigned to embryos; participants must bet on which resulting
  adult is "still their character." Real small stakes: points. The failure mode: people
  cheat by keeping a hidden core trait.


  Design concretely:


  Activity: "The Exchange" — Phase 1: each writer writes a paragraph: a character
  at age 40, with a defining trait. Phase 2: facilitator announces: rewrite the same
  character, but the conception was different — a different sperm, different egg,
  different parents. Writers write the new biography. Phase 3: trading phase — workshop
  members receive each other''s second versions and must find, in the new biography,
  the trace of the original person; they vote on whether this is "the same character"
  or "a sibling/counterpart." Points for detecting which traits were smuggled across.
  Debrief: the pull you felt to keep something fixed is the intuition behind origin
  essentialism (Kripke); the thing you kept is the problem — nothing in the gametes
