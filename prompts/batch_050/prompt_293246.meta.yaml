  that people''s votes correlate, or that adding less-informed voters can hurt. In-the-weeds:
  independence assumption, competence > 0.5, the fact that CJT fails when competence
  < 0.5 or when votes correlate. Could craft a nice dispute: e.g., hiring committee
  of 5 vs adding 2 less-informed members; one says more people = more likely majority
  right (Condorcet), other says new members just copy others'' vibes (correlation)
  or are below 50%. And a subtle point: if individual competence < 0.5, bigger groups
  are worse — "wisdom of crowds" reversed. Also the distinction between averaging
  estimates (Galton) and majority voting on binary questions.

  - Luck egalitarianism + adjudication: two people arguing about whether someone who
  bought no insurance deserves help. Could get into option luck vs brute luck, the
