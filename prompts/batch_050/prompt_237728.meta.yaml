  message — by what the author succeeded in encoding — and that a reader who misses
  it has simply failed. The second, Blythe, holds that meaning is completed (or even
  created) at the moment of decoding, so that a reader who finds a coherent reading
  the author never intended has discovered a genuine meaning of the text, not made
  an error.


