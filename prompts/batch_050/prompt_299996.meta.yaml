  genuine non-obvious tensions plus an apparent tension that dissolves. Refugees:
  (1) states have a right to control borders; (2) anyone fleeing persecution has a
  claim to asylum; (3) non-refoulement is absolute; (4) resettlement obligations should
  be allocated by capacity; (5) economic migrants who face starvation-level poverty
