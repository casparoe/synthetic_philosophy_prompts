  1. I pick the dust specks. Even at 10^60 people. At some point the tiny harms have
  to add up to more total badness than the torture — there''s no magic line where
  numbers stop mattering.

  2. Transitivity of preference is non-negotiable for me. If A is better than B and
  B is better than C, then A is better than C, and cyclic preferences are just irrational.

