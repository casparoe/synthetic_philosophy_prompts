  I''m a software engineer with no formal philosophy training, and I''m building a
  small command-line flowchart for a reading group that just finished the property
  chapter of Locke''s Second Treatise. I need the decision tree that powers it.


  The tree should start from a user who accepts only that some resources are initially
  unowned and that people can come to own things, and route them to a named position
  on the legitimacy of original acquisition. Build the nodes from the logical space
  rather than from a list of labels — I''d rather you first work out which questions
  genuinely separate the positions, then locate the positions among the answer combinations.


  Constraints:

  - Every branch node must be a single question a user can answer without knowing
  any of the terminology: no asking whether they endorse the proviso. I think the
  real fault lines are (a) whether labour generates any moral claim at all or whether
  title is purely a creature of convention, (b) whether appropriation requires others''
  consent or can be unilateral, (c) whether the enough-and-as-good condition is a
  test of welfare effects or of opportunities to appropriate, and (d) whether violating
  that condition voids title or merely triggers a duty of compensation — but tell
  me if you think I''ve got the fault lines wrong.

  - Leaves must include: the weak-proviso historical-entitlement view associated with
  Nozick; an egalitarian or left-libertarian reading that takes the proviso to require
  an equal share or compensation; a strong reading on which acquisition that leaves
  others worse off is simply void; the conventionalist view that pre-legal acquisition
  generates nothing; and any position that finds the very idea of mixing one''s labour
  with a thing incoherent (the objection dramatized by the tomato-juice-in-the-ocean
  case).

  - Flag any pair of leaves the tree cannot really separate, and note any answer-combination
  that is unoccupied, with a sentence on why (incoherent, merely unattractive, or
  unexplored).

  - Finally, sanity-check each leaf against one concrete case of your choosing (e.g.,
  enclosing the last water source in an area) and report in a sentence whether the
  leaf gives a determinate verdict on it.


  That''s good. Formal, engineer voice, specific, in the weeds but using well-known
  ideas. Output prompt only.'
