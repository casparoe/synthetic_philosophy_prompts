  Hofstadter himself argues the self is a pattern ("soul-shard" stuff). The analogy
  in common use: "the self is software, the brain hardware" — but that''s generic.
  More in the weeds: "the ''I'' is like the Gödel sentence" — the self arises when
  a symbol system becomes powerful enough to represent itself, just as arithmetic
  becomes powerful enough to encode its own syntax. People use this to argue: (a)
  the self is an illusion of sorts, (b) it''s a pattern so it can be copied/uploaded,
  (c) AI could have selves once their symbol systems self-represent.


