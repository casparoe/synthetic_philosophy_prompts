  Moral trade: the idea (from MacAskill, Mogensen, etc.) that when agents with different
  moral views disagree, they can both do better by "trading" — e.g., an animal welfare
  donor and a global health donor swapping donation causes, each donating to the other''s
  preferred cause in exchange.


  Type: dialogue between two proponents of opposing views. For moral trade: one person
  who thinks moral trade is a great idea, another who''s skeptical — maybe skeptical
  because it undermines the integrity of moral commitments, or because of moral uncertainty
  issues, or because "causal leverage" arguments are bogus.


  I need to inject a novel/niche idea to avoid regurgitation. Standard moral trade
  debate exists. To make it in-the-weeds: introduce a specific scenario — e.g., two
  donors, one animal welfare, one longtermist, considering a "donation swap." Skeptic
  argues: (1) if you actually believe your cause is best, you''re spending your resources
  worse, and the "trade" only looks good because of double-counting causal impact;
  (2) trade requires treating your counterfactual donation as a bargaining chip, which
  commodifies moral commitments; (3) moral uncertainty: you can''t trade when you
  don''t know the exchange rate between values.


  A genuinely novel wrinkle: trade across time or trade with your future self? Or
  trade where the other party''s "give" is something they were going to do anyway
  (counterfactual verification problem — like additionality in carbon offsets). That''s
  a nice angle: the additionality problem in moral trade, analogous to carbon offset
  additionality. That''s a somewhat fresh injection that models can reason about.


  Or the "voting trade" analogy — vote trading/logrolling. A dialogue could be about
  whether moral trade is more like mutually beneficial exchange or more like both
  parties paying protection money to each other''s values.


