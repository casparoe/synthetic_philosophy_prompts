  to be found complete in each individual; and on this point to adopt the common opinion
  of philosophers, who say that the difference of greater and less holds only among
  the accidents, and not among the forms or natures of individuals of the same species."


  Then the questions. Let me formulate the interpretive puzzle:


  1. What exactly is the "common opinion of philosophers" being invoked — the scholastic
  doctrine that substantial forms don''t admit of degrees? Explain what it means that
  differences of more/less hold only among accidents, and why Descartes needs it.


  2. Tension: Descartes elsewhere notes wide variation in intelligence among humans,
  and Part V says even the dullest humans can do what no animal can. Does the Part
  I claim mean that variation in human intelligence is purely accidental — not variation
  in reason itself? How does that cash out? What would accidental variation in reason
  even be (memory, imagination, bodily organs)?


  3. Does this Part I claim do argumentative work for the animal doctrine, or is it
  a consequence of it? I.e., is the all-or-nothing character of reason a premise (animals
  can''t have "a little" reason, so the absence of full-blown language shows none
  at all) or does it just follow from the soul being an indivisible substance?


  4. Does the claim survive if the Part V behavioral tests fail? If some animal passed
  the language test, would Descartes be forced to grant it a full rational soul —
  is there room for an intermediate position?


