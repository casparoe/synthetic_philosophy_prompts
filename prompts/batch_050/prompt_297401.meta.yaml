  of the people describing it, so that the same belief is assessed by observers for
  whom different things ride on the subject''s being right. The purpose is to generate
  a within-class data pattern in which the two manipulations pull apart — or fail
  to — because the two views we are about to read make different predictions: on one,
  it is the knower''s practical situation that matters to whether the belief amounts
