  I''m a journalist who covers science and ideas for a general magazine, and I''m
  working on a long explainer about an obscure-but-fascinating debate in philosophy
  of religion: how God is supposed to know the future. Specifically I want to explain
  Molinism — the view that God knows, prior to deciding what to create, what every
  possible free creature would freely do in every possible circumstance — and the
  main objection to it, the so-called grounding objection.


  Explain for a smart lay reader:

  1. The three-way division of God''s knowledge (natural, middle, free), and where
  middle knowledge sits in the "logical order" — why it has to be after natural knowledge
  but before God''s creative decree, and what work that ordering does (i.e., it lets
  God exercise providential control without causing free choices).

  2. The grounding objection itself, stated as strongly as possible: a counterfactual
  like "if Eve were in circumstances C, she would freely eat the fruit" is supposed
  to be true before God creates anything, so it can''t be made true by Eve''s actual
  action (she might never exist or never be in C), and it can''t be made true by God''s
  will (that would make her action determined by God and thus not free, in the libertarian
  sense Molinists want). So what makes it true? It seems to be a brute fact floating
  free of both God and creatures.

  3. Why the analogous problem doesn''t (or does) arise for ordinary everyday counterfactuals
  — e.g., "if you offered this guest decaf, she''d decline" — where determinism in
  the background lets the counterfactual be grounded in the person''s character plus
  laws. This is the bit where the libertarian freedom assumption does the damage,
  I think, so please make that explicit.

  4. The best Molinist replies — e.g., denying that all truths need grounds, or saying
  the counterfactuals are grounded in the agents themselves as they would be, or appealing
  to the fact that we seem to rely on such counterfactuals constantly in deliberation
  — and how the objector counters each.


  Rules: no citations or bibliography (this is an explainer, not a lit review), no
  invented quotes from Molina or anyone else. Use one concrete running example (the
  decaf guest or whatever you prefer) throughout. Target maybe 800-1000 words.


