  The philosophical lens: the Dennett–Caruso debate. Dennett (compatibilist): moral
  responsibility doesn''t require contra-causal freedom; some form of desert survives
  — he defends that we can be justified in holding people responsible, and punishment
  can be deserved in a modest sense (while also endorsing incapacitation for the dangerous).
  Caruso (free will skeptic): no basic desert; the just response is a public-health
  model: incapacitate the dangerous as we quarantine the sick, without resentment,
  address root causes, minimize harm.


