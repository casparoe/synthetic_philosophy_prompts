  ---


  I am preparing a seminar session that pairs Kubrick''s A Clockwork Orange (or Burgess''s
  novel) with the contemporary debate between Daniel Dennett and Gregg Caruso over
  free will, desert, and punishment. Please write a careful critical reading of the
  work through that debate. ...


  Questions to address:


  First, the work''s central objection to the Ludovico technique — voiced in the story
  by the prison chaplain — is that goodness imposed without the possibility of choosing
  otherwise is not goodness at all; Alex becomes an organism wound up to perform virtue.
  State precisely what view of moral agency this objection presupposes. Then test
  it against the two philosophers: Dennett is a compatibilist who denies that responsibility
  requires contra-causal freedom, and Caruso is a skeptic who denies that anyone deserves
  punishment at all. Does the work''s objection actually engage either position, or
  does it attack a libertarian picture both have already abandoned? If the objection
  can be rebuilt in Dennett''s terms — say, as the claim that Ludovico destroys Alex''s
  competence to respond to reasons rather than his metaphysical freedom — explain
  how the rebuilt version differs from what the work itself says.


  Second, is the Ludovico technique best understood as punishment or as treatment?
  Caruso''s alternative to retribution is a public-health model: incapacitate the
  dangerous the way we quarantine the sick, using the least restrictive means and
  without withdrawing concern for the person incapacitated. Ludovico looks closer
  to this than to retribution, yet the work presents it as monstrous. Does the case
  show the quarantine model needs further constraints, and which ones?


  Third, use the two endings: Kubrick''s film ends with the conditioning reversed
  and Alex restored to his old appetites; Burgess''s final chapter, omitted from the
  film''s source edition, has Alex simply grow out of violence. How does each ending
  shift the philosophical verdict — and does the second lend unexpected support to
  Caruso''s insistence that we address the causes of crime rather than the criminal?


  Conclude by identifying where the work resists the reading: is there something in
  its picture of evil, choice, and personhood that neither Dennett''s compatibilism
  nor Caruso''s skepticism can absorb? A good reading should not reduce the work to
  an illustration, nor bend the philosophers'' positions to fit it. Do not quote the
  text from memory; paraphrase scenes as needed.


