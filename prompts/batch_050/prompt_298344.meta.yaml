  what assumptions it actually needs (complete information about payoffs, mutual vs.
  common knowledge, error-free play, how players would reason after an ''irrational''
  move, etc.), whether it''s a platitude, a substantive truth, or simply false, and
  whether that reading would actually justify the dismissiveness. I''d also like to
  know which readings break if players even slightly suspect the other might be the
  sort who cooperates, since that''s the reading of the slogan I suspect my colleague
  actually needs."


