  ---


  I should like a numerical estimate, with the reasoning laid bare, on a question
  in normative epistemology that my colleagues and I have been unable to settle over
  dinner.


  The proposition is this, which I shall call the Modesty Thesis: on a contested philosophical
  question where one knows that competent, well-informed, and apparently sincere reasoners
  are roughly evenly divided, one''s credence in one''s own answer should be driven
  principally by the distribution of opinion — the outside view — rather than by one''s
  own first-order assessment of the arguments, the inside view, wherever the two come
  apart. For definiteness, take ''principally'' to mean that the outside view should
  dominate in any case of conflict, and take the thesis to concern idealised reasoners
  in positions like our own, not hypothetical perfect observers.


  Please give your credence that the Modesty Thesis is correct as a norm of belief
  revision, and derive it rather than simply asserting it. Structure your response
  in the following sections, in this order:


  1. Precisification (roughly 100 words). Restate the thesis in the strongest defensible
  form you can give it; flag any ambiguity you are resolving and how.


  2. Decomposition (roughly 300 words). Identify the sub-questions on which your credence
  depends, give a probability and one or two lines of justification for each. I would
  expect, at minimum: the probability that the inside view/outside view distinction
  marks a genuine difference in kind rather than a continuum; the probability that
  a usable track record exists for first-order philosophical reasoning, given that
  philosophy conspicuously lacks convergence; the probability that conciliation towards
  peer opinion is truth-conducive in domains without such a track record; and the
  probability that the thesis survives self-application — that is, that modesty about
  modesty does not collapse the position. Add any further term you think the calculation
  requires.


  3. Aggregation (roughly 80 words). Show how the terms combine — multiplicatively,
  or however else you think appropriate — and state the resulting credence as a number.


  4. Sensitivity (roughly 150 words). Identify the term to which the final figure
  is most sensitive, and say what argument or evidence would shift it most.


  5. Locating the disagreement (roughly 150 words). My own credence stands at about
  0.5; a colleague whose judgement I generally respect puts hers at 0.85. Using your
  decomposition, say where our disagreement most plausibly lives, and what one consideration
  might move each of us.


  I am not interested in a survey of the literature, and I do not want citations;
  I want the calculation itself, with its weak points marked.


