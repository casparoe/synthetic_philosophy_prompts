  Student answer:


  Epicurus''s argument runs as follows: all good and bad consist in experience, since
  we are hedonic creatures for whom pleasure is the only good and pain the only bad.
  Death is the end of all experience. While we are alive, death has not yet come;
  once it has come, we no longer exist to experience anything. So death is nothing
  to us — neither good nor bad for the person who dies. The argument depends on what
  we might call the experience requirement: nothing can be good or bad for you unless
  it affects your experience.


  Two problems threaten the ordinary view that death is bad. The first is the symmetry
  argument: the period of nonexistence after death is exactly like the period of nonexistence
  before birth, and since nobody regards the latter as a misfortune, consistency demands
  we not regard the former as one either. Epicurus himself pressed this point by asking
  us to consider the infinity of time before our birth and after our death as equivalent.
  The second is the timing problem: if death is bad for someone, there must be a time
  at which it is bad for them, but there is no such time — not before death (it hasn''t
  happened) and not after (there is no subject left to be harmed).


  The deprivationist replies that death is bad because it deprives the person of goods
  they would otherwise have enjoyed; the badness is comparative, a matter of the person''s
  actual life being worse than the life they would have had. Nagel defended something
  like this with his example of the man betrayed by his friends behind his back —
  he suffers a misfortune without experiencing it, so the experience requirement is
  false. On the symmetry argument, the deprivationist can note that we are biased
  toward the future: we care about goods in our future in a way we simply don''t about
  the past, so the two periods of nonexistence aren''t on a par, and this asymmetry
  of concern also dissolves the timing problem, since the comparison locates the harm
  in the future goods the person would have had.


  Overall the deprivationist reply seems to work, though it leaves open whether death
  is always bad or only usually.


