  Genuine tensions:

  - (b)+(c) vs (d): The Wilt Chamberlain logic applies to bequests — gifts are paradigm
  voluntary transfers. If liberty upsets patterns and gifts must be permitted, then
  blocking/taxing bequests is exactly the kind of interference the argument condemns.
  Also (d)''s rationale ("no one is entitled to unearned wealth") is an end-result/patterned
  principle — it appeals to desert-ish pattern considerations the entitlement theory
  rejects. On entitlement theory, what matters is whether the giver held the wealth
  justly, not whether the recipient earned it. So (d) is in real tension with (a)
  and (b). This is a good genuine tension.

  - (e) vs (f): if historical injustice pervasively taints current holdings and rectification
  demands massive redistribution, then most current holdings are not legitimate, contradicting
