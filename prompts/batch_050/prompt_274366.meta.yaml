  2. I find the Wilt Chamberlain argument convincing — any pattern-preserving redistribution
  interferes with liberty.

  3. I believe taxation of income is on a par with forced labor (Nozick''s own claim).

  4. But I also believe the state may legitimately tax inheritances at 100% because
  the dead have no rights and heirs have no entitlement to un-earned windfalls.

  5. I think the Lockean proviso is easily satisfied in modern economies, so current
  holdings are mostly just.

  6. I think rectification of past injustice (e.g., slavery, colonial expropriation)
  requires massive redistribution.


  Genuine tension: 4 with 2 — if "from each as they choose, to each as they are chosen"
  and liberty upsets patterns, inheritance is itself a transfer chosen by the deceased...
  taxing inheritances interferes with the liberty of bequest-givers, which the Wilt
  Chamberlain logic should also protect. Actually there''s a subtler tension: inheritance
  tax opposition vs. support. Also tension between 5 and 6: if past injustices were
  pervasive, current holdings are deeply tainted, so the claim that current holdings
