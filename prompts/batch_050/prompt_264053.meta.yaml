reasoning_summary: 'Let me pick a domain and type. The "verdicts on cases" type seems
  rich. Domains: transitivity of "better than" (spectrum arguments) fits the verdicts
  type well — give intuitions about spectrum cases and ask what principle captures
  them.


  Or presentism in historiography with verdicts on cases of judging historical figures.
  That''s nice and fresh: concrete cases of moral judgment of historical figures/practices,
  verdicts that are hard to reconcile, ask for principle. That avoids regurgitation
  and is doable without niche knowledge.


  Let me write it: someone argued with a friend about whether we can judge the past
  by present standards. Cases: e.g., judging a slaveholding founding father — verdict:
  blameworthy but mitigated? A medieval physician bloodletting — no blame (epistemic).
  A 1950s parent spanking — mild. A person in 1830 who opposed slavery — praiseworthy.
  A friend in 2005 saying something mildly offensive by today''s standards — tricky.
  The hard-to-reconcile pair: excusing the slaveholder because "man of his time" while
  condemning a contemporary who resists present norms — or praising the abolitionist
  (who used standards available at his time) while excusing the conformist.


  Cases concretely:

  1. 18th-century plantation owner who was kind to his slaves by standards of the
  time: still blameworthy, though less than a cruel one.

  2. Medieval doctor who bled patients: no moral blame at all.

  3. Grandparent in 1970 with sexist attitudes typical then: some blame, excused partly.

  4. 1820s abolitionist who spoke out: deeply praiseworthy, more so than modern one.

  5. Roman citizen who enjoyed gladiator games: I flinch, feels blameworthy even though
  everyone did it — hard to reconcile with excusing others by "standards of their
  time."

  6. Present-day person whose behavior will be condemned in 100 years (factory farming?)
  — intuition.


  Tension: verdicts 1, 3, 5 use "knew or could have known better" vs consensus; gladiator
  case vs slaveholder case both conforming but different verdicts. Ask for principle:
  maybe "moral knowledge availability" — blame tracks whether the person had access
  to the countervailing considerations (dissenters existed, suffering was visible),
  not whether they actually availed themselves. Epistemic vs moral failings distinction
  handles doctor case.


  Also ask about prediction for a new case, e.g., a 22nd-century person judging us
  for eating meat, or a whistleblower.


  Write 2-3 paragraphs, formal, from perspective of someone who argued with a friend.
  No quotes needed. No web search needed.'
