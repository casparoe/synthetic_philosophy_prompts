  review queue, and the maintainers would have merged whichever came first — making
  replaceability vivid and tying to overdetermination. That''s a nice fresh detail:
  preemption/overdetermination in a code-review setting.


  Also asker perspective: software engineer with no formal philosophy background —
  the prompt can mention that ("I don''t have formal philosophy training") to shape
