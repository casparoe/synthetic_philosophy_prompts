  forbid formatting.


  Complicity is a good fit for a software engineer — contributing to open source used
  for surveillance, working at a company whose product does harm, etc. Type: role-play
  with opening move. Play a committed skeptic who thinks participation without causal
  contribution is morally innocent — the asker can defend that complicity matters.
  Or reverse: model plays a proponent of the view that complicity matters even without
  causation, and the asker''s opening move challenges it.


  Alternatively: complicity as a procedure — a code review / ethics checklist for
  an engineer deciding whether to contribute to a project. That could work well: "write
  a decision procedure my team could run on a contribution proposal: when does contributing
  code to a project used for wrongdoing make you complicit even if you didn''t cause
  the harm?" That''s a nice fit: engineer applies idea repeatedly — e.g., reviewing
  PRs, choosing vendors, contributing to OSS. Ground it in concepts like causal contribution
  vs. participation, overdetermination, the difference principle, collective action
  problems. No niche citations needed — concepts like "if I don''t do it someone else
  will" (replaceability), threshold effects, normative vs causal contribution. This
  is in-the-weeds but uses general ideas (Kutz? Too niche — avoid names, or use them
  minimally).


  But the role-play type might be even better for depth. The example role-plays are
  philosophical debates. A role-play where the model plays "the replaceability skeptic"
  — someone who holds that you only wrong when your act makes a difference — and the
  asker opens with a challenge about collective harms. The asker being a software
  engineer could set the opening in terms of: "I write open-source code that ends
  up in drone targeting software; my contribution is one commit among thousands; the
  harm would have happened without me; so I''m clean." And ask the model to play...
  hmm, who plays which side?


  The asker wants to practice defending the view that complicity is real against a
  smart opponent. So model plays a committed causal-difference-maker theorist: only
  causes matter, participation without causation is innocent. The asker''s opening:
  e.g., the firing squad example — ten soldiers each shoot, any nine would have sufficed;
  no one caused the death; so on your view no one did wrong? That''s a genuine contest.
  Model must be sharp, not strawman, willing to concede small points but never the
  main one. Keep replies to a paragraph. Stay in character until ''stop''.


  But the opening move shouldn''t be too textbook-generic (firing squad is a classic).
  Could inject something new: the asker''s scenario — a software engineer whose trivial
  code contribution is replaceable. Opening move: "On your view, my commit to the
  drone firmware project is innocent because it made no difference. But extend that:
  if everyone in the project''s Slack reasoned as you do, nothing gets built. Your
  theory licenses each of us individually while condemning us collectively — doesn''t
  a theory that can''t guide a group deliberating together fail?" Something like that.


  Also inject a new/niche idea to keep it in the weeds: e.g., a novel distinction
  the asker introduces — "the difference between being a cause of harm and being a
  constituent of a harm-doing practice" — and have the character (the skeptic) respond.
  Or give the character a specific doctrine: they accept "moral pollution" talk is
  metaphorical, they only accept counterfactual difference-making plus maybe ex ante
  expected contribution... Actually making the character hold a nuanced view — e.g.,
  they concede that ex ante expected difference matters but deny actual difference-making
  when it diverges — makes for a good contest.


  Alternative: periodization + role-play: play a medieval historian who thinks "the
