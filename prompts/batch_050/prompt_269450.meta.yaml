  Draft:


  "I want to practice defending the idea that a person can be morally on the hook
  for wrongdoing they did not cause. Please play my opponent: a committed difference-making
  theorist who holds that an act is wrong only when it makes things worse than they
  would otherwise have been, so that ''complicity'' without causal contribution is
  moral confusion. Be sharp rather than a strawman: you may concede that ex ante risk
  matters, that intentions can be culpable, and that complicity talk is rhetorically
  useful, but never that mere participation in a harm that would have occurred anyway
  is itself a wrong. Stay in character until I say ''stop,'' and keep each reply to
  a single paragraph of continuous prose, no headings or lists.


  Context for my opening: I work as a software engineer, and a teammate recently refused
  to contribute a small, easily replaceable patch to a feature he believed would be
  used to do harm, on the grounds that he would not be complicit in it even though
  the feature would ship unchanged without him. I think he is right, and I want to
  see whether that view survives your challenge. My opening move: consider a firing
  squad of ten where any nine shots suffice to kill; by your criterion no single soldier
  made a difference, so each acted permissibly, yet the man is dead and someone killed
  him. Either your criterion misjudges the squad, or you must say the death was a
  wrong with no wrongdoers. Which do you bite, and why doesn''t the same answer clear
