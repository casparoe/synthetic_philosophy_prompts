  theory can be closer to the truth than another. I need to prepare a short exercise
  for my discussion group, and I''d like your help constructing it.


  Here''s the setup I want to give them. Consider a toy domain described by a handful
  of yes/no claims — say, five statements about some observable quantities — and let
  the ''whole truth'' be a fixed assignment of truth values. A natural first pass
  at measuring closeness to the truth is: the more true consequences (and the fewer
  false consequences) a theory has, the closer it is. My group already knows that
  naive versions of this run into trouble, but what I want them to see is a subtler
  problem: even when the measure seems to give the intuitively right ordering between
  two rival theories, that ordering can be reversed simply by re-describing the same
  facts in a different vocabulary — using predicates defined from the original ones
  in such a way that nothing about the world changes, only the language used to describe
  it.


  So, construct for me a worked example with the following specifications: (1) Use
  exactly three basic yes/no predicates and write out the complete truth (the true
  theory) as a conjunction over them. (2) Give two rival false theories, A and B,
  such that on the simple ''number of basic claims gotten right'' measure, A comes
  out strictly closer to the truth than B — say A gets two of the three claims right
  and B gets only one. (3) Then introduce new predicates defined in terms of the originals
  (for instance, a predicate that holds just in case the original predicates agree
  with each other, or some similar constructed condition) and show that when the whole
  situation — the truth, theory A, and theory B — is restated in the new vocabulary,
  the same counting measure now ranks B as strictly closer than A. (4) Present everything
  in a compact table or list so that a student can verify each truth value by hand;
  the total example should be checkable in under five minutes. (5) After the construction,
  state explicitly which feature does the work — i.e., what about the defined predicates
  lets the re-description flip the count — and what happens to the ordering if that
  feature is removed (e.g., if the new predicates are defined so as to be logically
  independent of one another). (6) Finally, say briefly how someone who thinks there
  is a privileged vocabulary for describing the domain — that some predicates carve
  nature at its joints while the constructed ones are mere artifacts — would try to
  resist the example, and whether you find that response convincing.


