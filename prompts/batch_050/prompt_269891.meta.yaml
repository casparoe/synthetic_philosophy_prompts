  that a white horse is not a horse, apparently by exploiting the fact that asking
  for a horse is satisfied by any horse while asking for a white horse is not, and
  by insisting that "white" picks out color while "horse" picks out shape. Scholarship
  offers several competing readings, and club members keep adopting labels without
  being able to say what they are committed to. The tree''s job is to sort us by our
  actual views about language and kinds, not by which label sounds sophisticated.


  Constraints:

  1. Start from the one claim everyone grants... (the ordering asymmetry: a request
  for "a horse" is met by a brown horse; a request for "a white horse" is not.)

  2. 6-8 leaves, each a named reading, with at least: equivocation verdict (the argument
  equivocates between "is not identical to" and "is not a [kind of]"); strict identity/class-inclusion
  reading (true but trivial); intensional reading (the concept WHITE HORSE differs
  from HORSE in intension while the class is included); mereological reading (a white
  horse is a compound of whiteness and horseness, and a compound is not identical
  to either component); pragmatic/contextual reading (the sentence is true in some
  conversational contexts, false in others, and the dialogue only establishes the
  first); rectification-of-names reading (the point is about fixing names to realities
  for social order, not about logic at all).

