  Gattaca''s meritocratic machinery — where environmental advantages are supposedly
  leveled and everyone is assessed on raw genotype — is, perversely, the society in
  which heritability estimates for status-relevant traits would be highest. So the
  film may dramatize the thesis that high heritability marks environmental equality
  rather than biological fixity. Does the film know this? Is there a reading where
  the dystopia is not genes determine outcomes but we built a world in which genes
  explain all the variance because we removed everything else?


