  1. Does the film depict high heritability, or determinism? The society''s predictions
  are explicitly probabilistic at the individual level, yet it treats them as decisive.
  A population with excellent polygenic prediction plus stratification-by-genotype
  is one where genotype correlates near-perfectly with outcome — but partly because
  the society itself enforces the correlation. Is that heritability, a self-fulfilling
  prophecy, or both, and does the film distinguish them?


