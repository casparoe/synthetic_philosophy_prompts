  Here''s my worry. Heritability is a population statistic: the proportion of variance
  in a trait, within a given population in a given range of environments, attributable
  to genetic variance. It says nothing about what caused any individual''s trait,
  and it''s famously compatible with malleability — a trait can be highly heritable
  and still highly modifiable by environmental intervention (PKU, height across generations
  of improving nutrition). Gattaca is usually read as a dystopia about genetic determinism:
  a society that sequences everyone at birth, assigns probabilities for disorders
  and life expectancy, and sorts people into valid and in-valid castes accordingly.
  Vincent, conceived naturally, is statistically written off, borrows Jerome''s genome-as-identity,
  and beats the system — even outswimming his engineered brother Anton by spending
  everything on the outward leg.


