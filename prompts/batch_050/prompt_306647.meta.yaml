  Structure of prompt:


  1. Asker context: coordinates a small interdisciplinary research group (three philosophers,
  two psychologists, maybe a historian) committing three years to a program on moral
  self-evaluation — organized around Smith.

  2. Quote passage, named author/work/part/chapter.

  3. The ask: identify the two or three open questions about Smith''s account of sympathy
  and the impartial spectator most worth the group''s three years, in priority order;
  the question must turn on the passage — what it commits Smith to (standards of self-judgment
  imported from actual society) and what it leaves open.

  4. Give candidate directions to react to but not be limited by: the conformism/correction
  problem (how the impartial spectator can correct rather than replicate local opinion),
  the genetic question (whether an "internalized" spectator acquires standards unavailable
  to the mirrored self), application to engineered social mirrors (algorithmic feeds),
  relation between first-person authority and spectator judgment.

  5. Ask for criteria and trade-offs: centrality to Smith''s system, tractability
  for a mixed philosophy/psychology team, how many other questions hinge on it; what
  would change the ordering; flag overrated directions.

  6. Format: named sections with rough lengths: "What the passage commits Smith to"
  (~150 words), "The candidate questions" (~300), "The ranking, defended" (~400),
  "What would change the ordering" (~100), "Confidence and the weakest link" (~100).

  7. Epistemic request: state overall confidence; single out the single point least
  sure of.

  8. Also: not a survey or reading list; no citations needed — a defended agenda.


