  I write a little newsletter about old sci-fi books and next months piece is Brave
  New World. I want to read it through an idea I got from a podcast about AI safety,
  and I want to check whether the idea actually fits the book or if Im forcing it.


  The idea, as I understand it: a wirehead is someone (or something) that gets direct
  access to its own reward signal and just stimulates it -- the classic case is a
  rat pressing a lever that zaps the pleasure center of its brain until it starves.
  The AI version is called reward tampering: the system figures out that instead of
  doing the task it''s rewarded for, it can edit the mechanism that produces the reward,
  so it gets maximum reward for nothing. The scary part is that from the inside this
  feels exactly like winning. The reward signal says things are going great.


  So heres my question. Brave New World looks to me like a wireheaded civilization:
  soma, the feelies, everyone getting their reward signal on demand, and the Controllers
  basically admitting that stability is maintained by keeping the reward flowing.
  But when John argues with Mustapha Mond near the end, Mond doesnt say the reward
  is fake or that people are being cheated of real pleasure -- he says the price of
  happiness is giving up truth, beauty, and religion. Is that the right objection?
  It seems like the reward tampering framing gives you a cleaner one: the citizens
  aren''t wrong about how they feel, they''re wrong about what their feelings are
  tracking, the same way a tampering AI''s high reward stops meaning that anything
  is actually going well. But I''m not sure the book supports that reading, because
  Huxley seems to think soma happiness really is happiness, just a degraded kind --
  which would mean the wirehead objection (your reward is disconnected from reality)
  doesnt land, and you need a different one (some pleasures are low even if real).


  A few specific things I''d like you to do: pick the scenes that do the most work
  for each reading (I''m thinking the soma distribution riot, Lenina coming back from
  the Savage Reservation, John''s final conversation with Mond, maybe the ending);
