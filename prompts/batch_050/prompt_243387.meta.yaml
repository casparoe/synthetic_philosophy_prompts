  - "Water is the clear drinkable liquid in rivers": 1-necessary (roughly), 2-contingent.

  - "Hesperus is Phosphorus": 2-necessary, 1-contingent (arguably).

  - "I am here now": 1-necessary, 2-contingent.

  - "The tallest spy is tall"...

  New case: "Neutrinos have mass" (Kripke''s example of necessary a posteriori? Actually
  neutrino mass). Or "Heat is molecular motion." Or a name introduced by description:
  "Julius invented the zip" (Evans). "Julius invented the zip, if anyone uniquely
