  A good candidate: an argument built from Kavka''s puzzle that seems to show that
  intention is not subject to rational requirements, or that rationality can require
  forming an intention one is rationally required not to execute — the "toxin puzzle"
  shows reasons for intending ≠ reasons for acting. The classic move: the argument
  proves that rational intentions needn''t be backed by reasons to act, and then it
  seems to prove too much — e.g., that you could rationally intend anything if rewarded.


  Alternatively, the "proves too much" argument could be: (1) Rationality of an intention
  depends only on reasons to have that intention, not reasons to do the intended act.
  (2) If offered $1M to intend to drink toxin, you have reason to intend. (3) So it''s
  rational to intend to drink. (4) But tomorrow, you have no reason to drink (you
  already have the money). (5) Rational intentions must be such that it''s rational
  to carry them out (otherwise intention isn''t a real state). (6) Contradiction...
  The interesting subtle flaw might be an equivocation on "reason" — reasons of the
  right kind vs. wrong kind (this connects to "wrong kind of reasons" literature,
  e.g., Rabinowicz & Rønnow-Rasmussen). Or a scope issue: you can only win if you
