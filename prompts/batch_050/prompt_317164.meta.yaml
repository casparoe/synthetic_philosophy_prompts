  \ participating in wrongdoing without causing it. Classic examples: buying a product\
  \ from an evil company, voting, being a bystander, purchasing meat. An argument:\
  \ (1) If my action makes no difference to the outcome, I can't be complicit. (2)\
  \ My individual purchase doesn't cause more harm (market threshold effects). (3)\
  \ So buying from bad companies isn't complicit... Something like that proves too\
  \ much — it would mean no one is responsible for voting, collective harms, etc.\n\
  \nAlternative: an argument showing that complicity is impossible, so e.g. getaway\
  \ driver isn't wrong. Let me build: \n\n(1) You're complicit in wrongdoing only\
  \ if your action contributes to making it happen.\n(2) Contributing means: had you\
  \ not acted, the wrong wouldn't have occurred, or would have been less bad (counterfactual\
  \ difference).\n(3) The getaway driver: had he refused, the gang had three other\
  \ drivers ready; the robbery would happen identically.\n(4) So the getaway driver\
  \ isn't complicit.\n(5) But surely the getaway driver is blameworthy.\n(6) So...\
  \ something.\n\nThe interesting thing: where does it go wrong? Real answers: counterfactual\
  \ dependence isn't necessary for complicity (overdetermination, joint action, intention/plan\
  \ participation, Kutz's participatory intentions). This is a genuinely good in-the-weeds\
