  enforcing the contract is one stage of a person coercing another stage, morally
  on par with one person binding another, and that "you agreed to this earlier" does
  not settle who should win.


  To keep them honest, both sides have agreed to argue about a specific invented case
  rather than their favorite slogans:


  The Cassandra Clause. Dana, 34, has watched two close friends join high-demand groups
  and, within a year, sincerely testify that joining was the best decision of their
  lives — while cutting off family and signing over savings. Dana judges that if she
  ever joins such a group, her testimony at that point will be unreliable evidence
  about her good. She signs a contract with her brother: if she ever asks to move
  into a group''s commune or donate more than 10% of her income to one, he is to treat
  her request as void for 12 months, regardless of how lucid and consistent she seems.
  The clause specifies that "my future sincerity is exactly what I do not trust."
  Three years later, Dana joins such a group and, calmly and by all external measures
