  **Three ways to build a kind**


  Philosophers like to say that race, gender, and money are "socially constructed,"
  but this bundles together things that work quite differently. My essay tries to
  pull them apart.


  Start with money. A twenty-dollar bill is paper, but it counts as money because
  we collectively accept that it does. Searle calls this a status function: X counts
  as Y in context C. The paper doesn''t have to change at all; only our collective
  acceptance does. If everyone tomorrow stopped accepting dollars — all at once, totally
  — the dollar would simply stop being money. Money is a pure acceptance-kind.


  Race is different. Hacking''s "looping effect" is the standard picture: we classify
  people, the classification changes how they behave and how they''re treated, and
  the changed behavior then feeds back into the classification. Race isn''t just an
  acceptance-kind because you can''t opt out of it by deciding not to accept it, and
  it isn''t just a looping-kind either, since the classifications themselves are doing
  causal work. But here''s my main claim: the looping picture underdescribes race.
  Racial categories in the US were maintained for a century less by what anyone believed
  than by infrastructure: the census form, segregated housing finance, school district
  lines, anti-miscegenation statutes, hospital blood banks. Call this an enforcement
  architecture. The architecture does two things acceptance and looping don''t: (1)
  it makes the kind sticky — it persists even when beliefs shift, because the forms
  and the lines and the ledgers are still there; and (2) it sorts people without needing
  their or anyone''s current acceptance — the machinery classifies you whether or
  not you, or the clerk, believe in the classification.


  Gender, I argue, is a hybrid of acceptance and looping but largely lacks an enforcement
  architecture these days (though it had one: coverture, legal sex categories on documents,
  etc.), which is why it''s the most contested of the three right now — there''s less
  machinery holding it in place.


  Then the payoff: the three kinds differ in what it would take to get rid of them.
  Money: stop accepting it. Race: you have to dismantle the architecture, which is
  why "colorblindness" as a change in attitude doesn''t dissolve the kind. Gender:
  somewhere in between.


