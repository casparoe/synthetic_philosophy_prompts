  (2) my actions are free in a way requiring alternative possibilities, (3) God''s
  beliefs are infallible and "fixed" — this is standard. A subtler tension: if God
  is timeless, he can''t deliberate, respond to prayer, or know tensed facts — so
  if the student also holds that petitionary prayer can be efficacious or that God
  knows what time it is now, that conflicts. Also: the Boethian move that "what God
  sees is present to him" arguably collapses the distinction between God''s knowledge
  and determination (if all events are timelessly present to God, in what sense are
  they future/contingent?). Also the student might hold that the past is necessary
  but that timeless knowledge avoids the necessity problem — but the "accidental necessity"
  argument (Aquinas-style) might reapply: God''s timeless knowledge is just as "fixed"
  as past knowledge. That''s a real tension people debate (e.g., whether timelessness
  actually escapes the modal argument, à la Zagzebski or Pike). Good domain.


