  Genuine tensions to embed:


  A. Timelessness vs. petitionary prayer / divine action in time. If God is wholly
  outside time, he can''t literally respond to prayers after they''re prayed, can''t
  act at particular times (can''t have done one thing in 1492 rather than another
  based on what he "sees" at that time). Standard replies exist (God timelessly wills
  effects to occur at times), so this tension is real but has costs — the student
  must either deflate "responding" to timeless willing or give up strong timelessness.
  This is a genuine tension, somewhat well-known (Stump & Kretzmann, Helm, Pike).


  B. The deeper one: the Boethian "seeing" analogy (commitment 4) plus libertarian
  freedom (3). The analogy says God''s knowledge no more necessitates than my watching
  you. But the analogy works only because God''s timeless "present" includes the event
  itself — the event is present to God. Critics (Zagzebski, and earlier the "eternal
  present" worry) argue that if the event is timelessly present to God''s gaze, it''s
  just as fixed as if it were past-relative knowledge; the move relocates rather than
  dissolves the necessity. Actually the cleaner tension: commitment 4''s analogy trades
  on God''s knowledge being of something already "there" in the eternal present —
  but then in what sense is the future open? If what God sees is fixed, then... Hmm,
  but the student could say contingency is preserved because the event itself is freely
  done. The genuinely sharp tension is: the analogy "my seeing you walk doesn''t make
  you walk" works because seeing is posterior to the walking; but then the relation
  of God''s knowledge to the event is like that of a spectator to something fixed
  — the very feature that makes the analogy work (the event is present and actual
  to God) seems to remove the open-future feature that libertarian freedom needs.
  This is the kind of tension a good answer should flag as genuine and non-obvious,
  while noting standard replies (the event is present-to-God *because* the agent freely
  does it; dependence direction).


