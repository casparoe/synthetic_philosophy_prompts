  Draft:


  ---


  hi! I''m taking a seminar on medieval philosophy of religion this semester and we''ve
  spent the last few weeks on Boethius and the foreknowledge problem. For the final
  paper we have to lay out our own position on divine eternity and freedom and show
  it''s coherent, so I want a consistency check before I start writing. Here''s roughly
  where I''ve landed:


  1. God is timeless, not just everlasting. He''s outside time altogether and possesses
  his whole life at once, in the way Boethius defines eternity, rather than living
  through it moment by moment like we do.


  2. God knows everything, including everything I will ever do — but not by foreknowing
  it. All times are equally present to him in his eternal now, so his knowledge of
  my future is more like observation than prediction.


  3. Humans (me included) sometimes have libertarian free will: I could genuinely
  have done otherwise, and my choice isn''t necessitated by anything that isn''t up
  to me — not by the past, and not by God''s knowledge.


  4. The Boethian solution works. Since God timelessly sees rather than foreknows,
  his knowledge no more forces my actions than my watching someone cross the street
  forces them to cross. The direction of dependence runs from the event to the knowledge,
  not the other way round.


  5. Petitionary prayer actually does something. God genuinely responds to prayers,
  and some events happen because someone prayed for them that wouldn''t have happened
  otherwise.


  6. Providence governs history in the strong sense the Consolation ends on: everything,
  including apparently terrible stuff like Boethius rotting in prison, is ordered
  toward the good.


  Questions: which of these genuinely pull against each other, and which pairs only
  look like they conflict? Please rank the real tensions by severity, and for each
  one tell me what the cheapest fix is and what it costs me (in terms of the other
  commitments). If some pair that looks contradictory actually dissolves on inspection,
  flag that too, because I don''t want to waste half the paper defending against an
  objection that isn''t one. And if you had to force me to drop or weaken exactly
  one commitment, which revision buys the most consistency for the least damage?


  Please don''t just give me a survey of positions (the internet has plenty of those)
  — I want to know what these six specific claims commit me to. Also don''t worry
  about being nice about it, my prof definately won''t be.


  ---


