  reason via non-truthful means, which conflicts with cases they themselves discuss?
  Better: subtle conflation.

  - Subtle mistake 2: misattributed view — e.g., attributing to Marcia Baron a view
  she actually critiques, or saying Kant held that treating someone as a means is
  always wrong (common misreading — actually Kant forbids treating merely as means).
  That''s a classic subtle error: "Kant held we must never treat people as means"
  — a hasty grader would let slide; correct view: never merely as means. Good one.

  - A step that doesn''t follow: student argues that since some manipulation benefits
  the target (nudging for their good), intent to harm is necessary for manipulation
  — doesn''t follow, or student concludes manipulation is definitionally wrong from
  the Kantian premise without argument.


  Also I should define grading rubric request: grade out of 100 or letter, plus point-by-point
  comments, and the epistemic request: separate settled from contested.


  No verbatim quotes needed. No citations required. Avoid naming super niche theorists;
  Kant is fine, maybe reference "influence without reason" loosely. I could mention
