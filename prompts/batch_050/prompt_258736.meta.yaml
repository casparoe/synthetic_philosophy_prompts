  A plausible commitment set for someone thinking about finite-sequence randomness:


  (1) Randomness is a property a sequence can have on its own, not just relative to
  a generating process (anti "process-only" view).

  (2) An n-bit string is random iff it''s incompressible — no program much shorter
  than n outputs it (Kolmogorov incompressibility).

  (3) Randomness so defined doesn''t depend on arbitrary choices of universal machine
