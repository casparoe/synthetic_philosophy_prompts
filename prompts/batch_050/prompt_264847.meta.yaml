  devices and, more specifically, commitment races. Quick gloss of what I mean by
  that, since the term gets used loosely: a commitment device is when you bind yourself
  now to restrict your future options (Cortés burning his ships, Odysseus and the
  mast), and a commitment race is the adversarial version where each side gains by
  visibly and irreversibly committing first -- if I throw my steering wheel out the
  window in chicken before you do, you have to swerve. The nightmare case is both
  sides racing to commit to incompatible demands, so the rational move individually
  guarantees mutual disaster.


  Read the film against this. The doomsday machine looks like the perfect commitment
  device -- automatic, no human in the loop, can''t be talked out of it -- and the
  film has Strangelove himself explain why it fails: a deterrent commitment is worthless
  if the other side doesn''t know about it. So the Soviets ran the race and forgot
  the publicity leg of it. Meanwhile Ripper runs his own one-man commitment race by
  sealing the base and issuing the attack order, making himself unable to recall the
  planes, and the horror is that his commitment outlasts him -- Mandrake can reconstruct
  the code but the device has already done its job. And then in the War Room everyone
  keeps racing: Turgidson wants to commit to a full first strike while we have the
  chance, and the film ends with the mineshaft gap, i.e., precommitting to the next
  arms race before this one is even over.


