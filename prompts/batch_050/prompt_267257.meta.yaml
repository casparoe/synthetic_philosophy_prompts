  both are self-evident/undeniable. (4) Saying the dualism is about motives vs. reasons,
  or about psychology; it''s about normative reasons. (5) Overstating: that the dualism
  shows morality is unjustified entirely — Sidgwick still held utilitarianism is the
  standard of right conduct; the problem is whether we always have reason to act morally.


  So write a summary, e.g., from a "lecture notes" or "a podcast" or "an online encyclopedia
