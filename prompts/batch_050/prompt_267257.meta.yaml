  of practical reason. Common subtle misrepresentations: (1) claiming Sidgwick resolved
  it in favor of utilitarianism (he didn''t; he thought it could only be resolved
  by theological/religious assumptions about the universe''s moral government, which
  he was reluctant to rely on); (2) conflating "dualism of practical reason" with
