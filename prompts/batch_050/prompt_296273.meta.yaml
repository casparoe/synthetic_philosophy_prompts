  3. A debrief plan that maps specific moments in the session onto the components
  of the superrationality argument — the symmetry premise, the move from prediction
  of others to choice of self, the difference between this and ordinary cooperation
  — and that gives my friend''s causalist objection its best run before I rebut it.

  4. A prediction of what will go wrong the first time I run it (someone will try
