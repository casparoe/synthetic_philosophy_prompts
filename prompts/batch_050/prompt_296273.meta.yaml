  Last week a friend and I argued until two in the morning about a pair of thought
  experiments from Douglas Hofstadter''s Metamagical Themas, and I would like to settle
  the matter by other means — namely, by making a roomful of students live through
  it.


  The first experiment, often called the Platonia dilemma, runs roughly as follows.
  Twenty people each receive a letter from an eccentric billionaire. Each may, if
  they wish, reply with a single sentence volunteering themselves. If exactly one
  person replies, that person receives an enormous prize. If more than one reply,
  or if nobody replies, nobody receives anything. Communication between the recipients
  is impossible. The second, often called the Luring Lottery, runs thus: a lottery
  is announced in which anyone may enter as many times as they like — you write a
  number on your entry, and that is how many chances you have bought — and the announced
  jackpot is divided by the total number of entries submitted. The more the public
  enters, the smaller the prize becomes; the larger your own number, the greater your
  share of the shrinking pool. Hofstadter''s provocation in both cases is what he
  calls superrationality: because every participant faces an identical situation and
  (if rational) will reason in the same way, one should choose as though one''s own
  choice were everyone''s — in the lottery, enter once or not at all; in the dilemma,
  use a randomising device that gives you a one-in-twenty chance of volunteering.
  My friend considers this reasoning to be dressed-up magical thinking, on the grounds
  that your entry cannot cause anyone else''s; I think the argument deserves to be
  felt before it is dismissed.


  That is where you come in. I run a final-year undergraduate seminar on decision
  theory and rational choice: fourteen students, one ninety-minute session, no preparation
  assumed beyond ordinary game-theoretic literacy. Design an activity — a game or
  sequence of games with real (small) stakes, run in the room — that makes the students
  feel the pull of the superrational answer before they hear the word. Concretely,
