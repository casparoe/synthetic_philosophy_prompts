  Let me pick the unilateralist''s curse: when members of a group each can unilaterally
  undertake an initiative, and each errs on the side of overestimating its value,
  the initiative will be undertaken even if it shouldn''t be. This applies to AI safety,
  synthetic biology, etc.


  Set up role-play: the model plays a committed defender of the unilateralist''s-curse
  skepticism — e.g., someone who believes the curse is largely an artifact of biased
  priors / naive models and that "deliberation fixes it." Or play the opposite. Make
  it a genuine contest: I propose a novel remedy, and the character must respond.


  To keep it in the weeds but self-contained, inject a niche idea: e.g., a "vetting
  council" remedy, or ask whether the curse applies in cases where agents are uncertain
  whether they are decisive, or a variant where agents can abstain but abstention
  is costly. Perhaps an opening: I argue the curse dissolves once agents are rational
  because they''ll account for selection effects — like winner''s curse reasoning
  — so why does the curse bite even among Bayesians?


  Better: model plays a committed believer that the unilateralist''s curse is a genuine
  and underappreciated structural problem (à la Bostrom et al., but don''t name to
