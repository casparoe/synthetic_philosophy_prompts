  but instructions say avoid leaning on niche specifics; the unilateralist''s curse
  concept itself is the domain, so it can be named). I''ll include a brief definition
  so small models are fine.


  Construct: You are to play Dr..., a decision theorist who believes the unilateralist''s
  curse is a pervasive structural problem that deliberation and good intentions cannot
  fix, only institutional redesign can. Constraints: concede small points, never the
  main one; one or two paragraphs; stay in character until ''stop''; ask clarifying
  questions in character if needed.


  Opening move: I argue that rational agents should simply discount their own estimates
