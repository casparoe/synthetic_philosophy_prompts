  The Pasadena paradox: a game where payoff in round n is (-1)^n 2^n / n (if tails...
  actually the construction: with probability 2^-n, payoff (-1)^(n+1) 2^n / n). Expected
  value sum = sum of alternating harmonic-like = ln 2, but not absolutely convergent,
  so expected value undefined (depends on ordering). Objections/solutions known: bounded
  utility (Bernoulli), diminishing marginal utility of money, the casino has finite
  funds, reject dominance reasoning (Nover & Hájek, Hájek & Smithson), Colyvan''s
  relative expected utility theory... Also Easwaran''s work on strong vs. weak dominance.


  For a "list and ask for a new one" prompt: ways people try to avoid the conclusion
  of the Pasadena game (that the game is worth any amount, or that EV is undefined
  and decision theory breaks). List: bounded utility/caps, casino''s finite bankroll,
  reject that an infinite game is physically possible, reject dominance, accept it''s
  just undefined and refuse to rank... ask for a new resolution.


