  friends of mine that has made me realize the usual framing papers over a genuine
  disagreement...


  Define the two figures:


  - One is a "Hardinite": commons dilemmas are coordination failures that can only
  be reliably solved by an external enforcement mechanism — privatization with well-defined
  property rights, or a central regulator with monitoring and sanctions. Voluntary
  restraint is unstable because cooperators are suckers; selection pressure favors
  defectors; norms erode.


  - The other is an "Ostromite": communities of appropriators frequently do self-govern
  commons sustainably without privatization or state enforcement, given identifiable
  conditions (clear boundaries, local rule-making, monitoring by monitors accountable
  to users, graduated sanctions, cheap conflict-resolution, nested tiers for large
  systems). The Hardinite errs by treating a one-shot, anonymous, communication-free
  model as the default.


  The deliverable: draft the joint statement these two could sign after a good-faith
  adversarial collaboration.


  Contents:

  1. Numbered agreed-claims section — claims both can sign: about the game-theoretic
  structure (what a commons dilemma is, when it arises, that one-shot anonymous defection
  dominates), about the empirical record (that both successful and failed commons
  exist), about what privatization and state regulation actually accomplish (substituting
  enforcement for incentives...), etc. Ask the drafter to find claims neither vacuous
  nor slanted.

  2. Disagreements table — precise statements of residual disagreement, each phrased
  so its own side would accept the wording; mark which disagreements are empirical
  and which are definitional/verbal (e.g., whether Ostromite self-governance counts
  as "external enforcement" in the Hardinite sense — if a community''s monitors impose
  sanctions, has the Hardinite''s condition been met, making the dispute verbal?).

  3. Cruxes — sub-questions such that settling them would move at least one side:
  e.g., the scalability question (do self-governance institutions survive beyond ~
  small group sizes / high mobility), the second-order problem (who monitors the monitors;
  is graduated sanctioning itself a commons), the endogeneity problem (do successful
  commons select on pre-existing trust/homogeneity, so that the institutions aren''t
  portable).

  4. Registered predictions on test cases both agree would bear on the cruxes. Include
  two cases I supply (invented):


  Case A ("the lagged fishery"): a fishery where (i) catches are observed only with
  a two-season lag, (ii) the stock exhibits compensatory regrowth — moderate harvesting
  actually increases next season''s regrowth rate up to a threshold, beyond which
  collapse is abrupt and irreversible, (iii) any user can, at personal cost, publicly
  accuse another of overharvesting, triggering an audit; false accusations are fined,
  but the accuser of a false accusation can in turn be punished by the accused''s
  kin network. Ask: what does each side predict about long-run sustainability, and
  which features do they each identify as doing the work?


  Case B ("the compute commons"): a shared GPU cluster for a mid-sized open-source
  project — usage is perfectly observable in real time, but "necessity" of a job is
  private information, users join and leave continuously (median membership 8 months),
  and the project has no legal personality and cannot levy fines; it can only throttle,
  shame, or exclude. Ask each side to predict which governance arrangements would
  be attempted and which would survive, and to state what observed outcome would force
  them to update.


  Also ask: for each crux, state explicitly what evidence would move each side, and
  note if a side''s position turns out to be unfalsifiable as stated.


