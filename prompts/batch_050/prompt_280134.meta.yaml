  ---


  I''m a longtime reader of LessWrong, Slate Star Codex / Astral Codex Ten, and assorted
  adjacent forums, so I''ve absorbed the standard rationalist framing of coordination
  problems — Moloch, multipolar traps, the tragedy of the commons as the canonical
