reasoning_summary: 'Let me pick a domain and type. The "Construct a thought experiment
  to specifications" type fits well with "Impossibility results in algorithmic fairness"
  or "Goodhart''s law" or "Clinical equipoise." Let me design something.


  A nice combination: Impossibility results in algorithmic fairness — construct a
  thought experiment. E.g., build a hiring scenario where calibration and equalized
  false-positive rates demonstrably conflict, with specific base rates, and the respondent
  must show the impossibility numerically, identify which fairness criterion a regulator
  vs. a defendant''s advocate would invoke, and discuss what feature does the work.
  Constraints: no appeal to infinite data, numbers should be small integers computable
  by hand, realistic setting (bail, lending, hiring), and the impossibility must emerge
  from the numbers, not be stipulated.


  Or clinical equipoise thought experiment: construct a trial design where equipoise
  genuinely holds for the community but fails for every individual clinician, etc.


  The fairness impossibility one is classic but can be made "in the weeds" by asking
  to construct a case where the impossibility disappears — i.e., a scenario satisfying
  equal base rates where all three criteria can hold — and one where it bites, and
  explain the structural condition. Actually, a good spec: construct a single lending
  scenario where calibration and separation (equal false positive/negative rates across
  groups) conflict, with hand-computable numbers, then show the impossibility from
  the arithmetic, identify which criterion each stakeholder would defend, and what
  relaxes the conflict (equal base rates or perfect prediction). Also ask to make
  a variant where one criterion is dropped and the remaining two are jointly satisfiable
  — show the numbers.


  Also could require: a "cheating" clause — the scenario must not stipulate the verdicts;
  numbers must generate the conflict.


  Include role assignment: "You are an expert on the philosophy and mathematics of
  algorithmic fairness." Ask to brainstorm first, think carefully.


  Constraints to inject niche ideas: maybe invent a fictional regulator''s composite
  metric, or ask for a case where the impossibility survives even when the classifier
  is a perfect Bayes-optimal predictor — showing it''s not a failure of the model.
  That''s a good "in the weeds" constraint: the impossibility must arise even with
  the Bayes-optimal score, showing it''s about the data, not the model.


  Let me write the prompt. No quotes needed from real texts, so no web search needed.
  Keep it formal/polished.


  Draft:


  ---


  You are a mathematical philosopher specializing in algorithmic fairness, equally
  fluent in the impossibility theorems (calibration vs. separation, in the style of
  Kleinberg–Mullainathan–Raghavan and Chouldechova) and in their normative interpretation.
  Think carefully and reason step by step; begin with a short brainstorm of two or
  three candidate setups before committing to one.


  Construct a thought experiment to the following specifications.


  Setting. A consumer-lending scenario (not criminal justice and not hiring): a bank
  assigns each applicant a default-risk score and approves everyone below a threshold.
  Two demographic groups apply. Keep the story realistic — no oracle, no adversarial
  data poisoning, no malice on the bank''s part.


  Numerical constraints. (i) Use a finite applicant pool small enough that every quantity
  can be computed by hand (say, a few dozen applicants in total, with counts as integers).
  (ii) The two groups must have genuinely different base rates of default, and the
  score the bank uses must be the Bayes-optimal one given the available features —
  i.e., the impossibility must not arise because the model is badly trained, biased,
  or underfit; it must persist even for the statistically perfect predictor. (iii)
  Present the full joint distribution (score × outcome × group) explicitly, as a small
  table.


  The deliverable. From the table you construct, demonstrate the following, deriving
  each verdict from the arithmetic rather than stipulating it:

  1. Show that the score is calibrated within each group (among applicants assigned
  a given score, the observed default rate matches the score, for both groups).

  2. Choose a single approval threshold and show that the resulting classifier violates
  equalized odds / separation: the false-positive rate (or false-negative rate) differs
  across groups. Give the actual rates.

  3. Show that no alternative threshold fixes both rates simultaneously while keeping
  calibration — i.e., exhibit the impossibility inside your toy example rather than
  citing the general theorem.

  4. Then identify which feature of your example is doing the work (the unequal base
  rates), and show what happens if you remove it: rebuild the table with equal base
  rates and exhibit a threshold at which calibration and equalized odds are jointly
  satisfied.

  5. Finally, the stakeholder test: state which fairness criterion the bank''s compliance
  officer and which a rejected applicant''s advocate would each invoke in your original
  (unequal-base-rate) table, and say whether either is making an arithmetic mistake
  or whether the disagreement is genuinely normative.


  Honesty requirements. The conflict must fall out of your numbers; a scenario that
  merely asserts the criteria clash fails. If any of the specifications above turns
  out to be jointly unsatisfiable, say so explicitly rather than quietly relaxing
  one, and explain which two specifications collide.


  ---


  Check: does the impossibility with Bayes-optimal scores and unequal base rates hold?
  Yes — Chouldechova/KMR: calibration + equal FPR and FNR impossible with unequal
  base rates unless perfect prediction. With Bayes-optimal scores and imperfect predictability,
  calibration holds and separation fails. Good. Spec 4: with equal base rates, all
  satisfiable. Good. This is solid, requires no web.


  Polish and finalize. Should I include guidance on what "doing the work" means —
  the threshold moves FPR differently given base rates. Fine.


  Length/format: formal, polished. Good.'
