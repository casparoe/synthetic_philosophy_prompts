  Argument sketch (friend''s argument):

  (1) A control measure only helps if it catches (or deters) bad behavior the model
  would otherwise get away with.

  (2) To reliably catch a model''s attempts to subvert oversight, your monitoring
  has to be at least as capable as the model''s evasion ability — an untrusted monitor
  weaker than the thing it watches can be fooled.

  (3) But if the model''s evasion ability is weaker than our monitoring, then the
  model is, in the relevant respects, not very capable — and an AI that can''t out-scheme
  a monitoring setup it can see isn''t capable enough to pull off a takeover anyway.

  (4) So control either fails (model too strong) or is unnecessary (model too weak)
  — the space where control helps is empty or tiny.

  (5) Therefore investing in control is incoherent; you should either trust the model
  (alignment) or not deploy it.


