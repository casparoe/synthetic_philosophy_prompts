  \ The prompt leans on \"Political Liberalism (1993)\" and \"A Theory of Justice\
  \ (1971)\" — these are extremely well-established; the instruction says verify when\
  \ in doubt; I'm not in doubt about these. Fine without search.\n\nNow, exam question\
