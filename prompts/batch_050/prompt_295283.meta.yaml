  \ Habermas's translation proviso, liberal secularism vs. justificatory liberalism...\
  \ These are somewhat niche but known.\n\nWhich combination best satisfies \"in the\
  \ weeds but not regurgitated\"? The grading type with an injected new idea is nice:\
