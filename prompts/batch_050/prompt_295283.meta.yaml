  \ but makes subtle errors (modus vivendi conflation + the proviso misstatement).\
  \ The asker is a journalist covering science and ideas, maybe serving as a guest\
  \ judge / helping grade essays for a course or a prize competition. Journalist persona:\
  \ \"I cover science and ideas for a magazine; a friend who teaches political philosophy\
  \ asked me to help grade...\"\n\nThe format instruction: ask for sections by name\
  \ and order with rough lengths. For grading: \"Section 1: Grade and one-paragraph\
  \ summary (short)\", \"Section 2: Point-by-point comments\", \"Section 3: What would\
  \ have earned full marks\". \n\nLet me draft the exam question. Something like:\
  \ \"Explain Rawls's distinction between a modus vivendi and an overlapping consensus,\
