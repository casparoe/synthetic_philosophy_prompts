  \ of it\" — keep neutral framing: \"I have my own suspicions but would rather not\
  \ bias you; grade it fresh.\" Actually better to just not express opinion.\n\nLet\
  \ me also double-check Rawls facts to make sure the embedded correct content is\
  \ right and the student errors are genuinely errors:\n\n- Modus vivendi: consensus\
  \ accepted as a balance of forces/interests, contingent; if circumstances change,\
  \ adherence may lapse. Correct.\n- Overlapping consensus: reasonable comprehensive\
  \ doctrines each endorse the political conception from within their own views; the\
