  1000. Each turn of the dial delivers $10,000 and increases the pain level by one
  increment; no single increment is perceptible, but the difference between setting
  0 and setting 1000 is the difference between comfort and agony. At each setting,
  moving up one notch looks like a strictly good trade. The argument generalizes this:


  (1) An agent is instrumentally irrational if its preferences license choices that
  leave it predictably worse off by its own lights — e.g., being run through a cycle
  of trades and ending where it began, minus money.

  (2) Strict preferences must therefore be acyclic: a cycle A≻B≻C≻A makes the agent
  pumpable.

  (3) Indifference must be transitive for the same reason. If A~B and B~C but C≻A,
  a trader can sell the agent C for A plus a small fee (the agent pays, since it strictly
  prefers C), then swap C for B and B for A at no charge (the agent is indifferent,
  so accepts), leaving the agent back at A and poorer; repeat indefinitely.

  (4) Any physically realized agent — human, animal, or AI on actual hardware — has
  finite discriminatory resolution: for fine-grained goods there is a sorites sequence
  x0,...,xn such that the agent cannot discriminate xi from xi+1 for any i, while
  xn is clearly better than x0.

  (5) An agent cannot rationally have strict preferences between options it cannot
  discriminate: preference requires a felt or detectable difference, and preferring
  one of two subjectively identical states is arbitrary. So xi ~ xi+1 for all i.

  (6) By (3) and induction, x0 ~ xn. But by (4), xn ≻ x0. Contradiction.

  (7) Hence no physically realized agent can have fully coherent preferences. The
  rationalist coherence theorems describe a standard nothing can meet, and every actual
  agent — including any AI we could build — is exploitable in principle.


  The conclusion proves too much... it would follow that the entire coherence framework
