  I''ve spent enough time on LessWrong and adjacent forums that I''ve internalized
  the standard litany: preferences must be transitive, because cyclic preferences
  get you money-pumped; expected utility maximization isn''t one decision theory among
  many but what coherence is; the von Neumann–Morgenstern axioms are just consistency
