  Student answer:


  "Hugh LaFollette''s argument for parental licensing proceeds by analogy. Society
  licenses activities like driving and practicing medicine because incompetent performance
  poses serious risks of harm to others, and we accept competence testing as a fair
  gate even though tests are imperfect. Parenting, LaFollette argues, fits this pattern:
  it is an activity in which incompetence predictably causes grave harm to a vulnerable
  third party, so consistency requires licensing it too. He concludes that there is
  no right to rear children in the way there is a right to free speech; parenting
  is instead a privilege to be granted on demonstrated competence.


  Feinberg''s right to an open future holds that parents have wide discretion over
  a child''s upbringing, and that the state should interfere only where parents would
  close off the child''s options. Feinberg introduced this right to explain why parental
  authority deserves protection against paternalistic state interference in family
  life. On this view, the open-future right seems to weaken the case for licensing:
  if the point of the right is to shield childrearing from the state, subjecting parents
  to state competence tests inverts the proper relationship between family and state.


  However, the defender of licensing has a reply. Children of grossly incompetent
  parents are precisely those whose futures are most constricted, so licensing could
  itself be justified as protecting open futures. But this reply fails, because licensing
  tests are imperfect: they will exclude some competent parents (false positives),
  and any test with false positives is an unjustifiable rights violation. Therefore
  licensing cannot be justified on open-future grounds.


