  I recorded verdicts on cases and want the principle.


  Para 2: the cases with verdicts, concretely.


  Para 3: the ask — principle stated precisely, clause-by-clause motivation, predictions
  on new cases (typo in a formal document? a laugh at my own fall?), which verdict(s)
  a single-theory account must sacrifice, confidence + weakest point.


  Make the cases have a tension: I want at least one pair hard to reconcile. E.g.,
  verdict: self-directed dark humour about my own bad knee is funny and involves no
  feeling of superiority; but also verdict that laughing at a stranger''s identical
  fall is superiority-based. Same incongruity, different verdicts — forces relational/violation-licensing
  clause. Also anti-joke case challenges incongruity: the chicken joke is funny by
  withholding incongruity. And explained-joke case: content unchanged, funniness gone
  — hard for any purely content-based theory.


  Also require predictions on cases not listed: e.g., nervous laughter at a funeral;
  finding an autocorrect error funny; whether a machine could be funny rather than
  merely produce funny text.


  Length: 2-3 paragraphs, formal. No quotes. No niche references. Good.'
