  (2) An agent that builds a successor using its own reasoning needs to trust that
  successor''s reasoning, which amounts to proving its own soundness schema.

  (3) So no agent can rationally endorse a self-modification that preserves its reasoning.

  (4) But humans reason with the same kinds of rules we''d formalize — modus ponens,
