  into a single bigger loss, because suffering happens to people one at a time, and
  he thought a fair coin flip respects everyone equally. Critics reply that each of
  the five has the same claim to be saved as the one, and refusing to let that difference
  matter fails to take the extra four seriously as persons; others defend middle positions
  like giving each side a chance proportional to its size, so the numbers matter as
  weights rather than as a sum that automatically wins. I''ve never studied philosophy
  and I''m not asking you to adjudicate the debate. [Note: no citations.]


  I want you to translate this debate into a decision procedure my on-call team can
