reasoning_summary: 'Let me pick a domain and type. I''ll choose "Honor, dignity, and
  victimhood cultures: is any of them morally superior?" combined with "Present an
  argument that seems to prove too much and ask where it goes wrong."


  The honor/dignity/victimhood cultures framework: honor cultures (reputation defended
  through violence), dignity cultures (inherent worth, insults shrugged off, legal
  redress), victimhood cultures (appeals to third parties, publicizing victimhood
  for moral standing) — Campbell & Manning''s framework. I can build an argument that
  seems to prove too much.


  Idea: an argument for the moral superiority of dignity culture that proves too much.
  Or an argument against victimhood culture that seems to prove too much. Let me construct
  a numbered argument with a subtle flaw.


  Candidate argument: A colleague argues dignity culture is morally superior:


  (1) A moral culture is better to the extent that it allocates status and redress
  according to desert rather than according to whoever successfully recruits powerful
  third parties.

  (2) In honor cultures, redress depends on one''s own capacity for violence — strength,
  not desert.

  (3) In victimhood cultures, redress depends on recruiting third parties by displaying
  victimhood — social reach, not desert.

  (4) In dignity cultures, insults are ignored and serious grievances go to impartial
  law, which (in principle) decides by desert.

  (5) So dignity culture is morally superior to both.

  (6) But the same test condemns dignity culture: access to law depends on money,
  knowledge, and social standing — again social reach, not desert.

  (7) So either the test is wrong, or all three fail equally, in which case (5) is
  unearned.


  Hmm, that''s more of a tu quoque. Better: an argument that seems to prove too much
  — e.g., an argument that victimhood culture is morally superior because it protects
  the weak, which by the same reasoning would justify something the asker can''t accept.


  Alternative: an argument against honor culture that proves too much:

  (1) In honor culture, whether a wrong is avenged depends on the wronged party''s
  strength.

  (2) A practice that makes redress depend on the victim''s power is unjust.

  (3) So honor culture is unjust.

  (4) But in dignity culture, whether a wrong is remedied depends on the victim''s
  access to courts — wealth, education, legal literacy.

  (5) So by the same principle dignity culture is unjust.

  (6) And victimhood culture makes redress depend on the victim''s capacity to mobilize
  third parties — again power, of a different currency.

  (7) So every known culture of conflict resolution is unjust, including ours. That
  seems to prove too much.


  Where does it go wrong? The subtle flaw: slide between "depends on power simpliciter"
  and "depends on power because desert-tracking mechanisms are absent/corrupted" —
  or equivocation on "depends on": in honor culture strength is constitutive of redress
  (the norm itself says might answers), whereas in dignity/victimhood cultures the
  dependence is contingent — the norms aim at desert but institutions imperfectly
  deliver it. A norm can be judged by what it aims at, not only by what it delivers
  in a fallen world. Rejecting the distinction costs: you can''t criticize any ideal
  by its imperfect implementation; or conversely accepting it lets every ideology
  off by pointing to its aspirations.


  That''s a genuine and interesting diagnosis: "ought" judged by constitutive norms
  vs. realized outcomes. Also quantifier/scope: "depends on" ranges over different
  senses.


  The asker can say which claims they''d most like to keep: they''d rather keep (2)
