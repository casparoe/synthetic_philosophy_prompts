  Let me draft:


  A colleague has an argument that cultures of conflict resolution are all on a par
  morally, and I suspect it proves too much, but I cannot find the loose step. The
  background is the familiar threefold scheme: honour cultures, in which a person
  of standing must answer affronts himself and redress follows reputation and the
  credible threat of violence; dignity cultures, in which worth is taken as inherent,
  slights are beneath notice, and serious wrongs are referred to impartial third parties;
  and victimhood cultures, in which aggrieved parties publicise their victimhood to
  recruit third parties to their cause. His argument runs:


  (1) A culture''s way of handling grievances is just only insofar as redress tracks
  desert — who was actually wronged — rather than power.

  (2) In an honour culture, whether a wrong is answered depends on the victim''s own
  strength and standing. So honour culture fails (1).

  (3) In a victimhood culture, whether a wrong is answered depends on the victim''s
  capacity to mobilise sympathetic third parties — eloquence, connections, visibility.
  That too is power, in a different currency. So victimhood culture fails (1).

  (4) In a dignity culture, whether a wrong is answered depends on the victim''s access
