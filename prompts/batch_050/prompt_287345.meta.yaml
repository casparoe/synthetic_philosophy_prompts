  Structure: I, a bystander, recount argument between two people (name them), with
  a concrete scenario (e.g., a mutual acquaintance who...). Moves:


  Case: A mutual friend, Daniel, whose business is failing; he keeps saying things
  are fine, avoids opening bank statements, yet quietly moved his savings out of the
  business account — suggesting at some level he knows.


  Mara''s position: genuine self-deception is impossible — to deceive yourself you
  must believe p (to hide it) and not-p (the result), and a single mind can''t hold
  contradictory beliefs; what looks like self-deception is just compartmentalized
  attention or akrasia/avoidance.


  Leon''s position: the paradox assumes deception must work through belief; Daniel''s
  behavior shows he both knows and doesn''t know — knowledge can be partitioned; behaviorally
  he acts on the truth while sincerely avowing the opposite.


  Mara counters: then "knows" is doing double duty; acting on information isn''t believing
  it; he''s just uncertain and optimistic.


  Leon: but the avoidance is strategic — he doesn''t avoid opening statements from
  mere uncertainty; uncertainty makes people seek information, not flee it. The flight
  from evidence is itself evidence of knowledge.


  Mara: then self-deception collapses into weakness of will or motivated reasoning,
  and we should just use those terms.


  Maybe a final move from Leon: the demand for simultaneous contradictory belief is
  a philosopher''s invention; real self-deception is diachronic — you steer what you
  attend to over time so the belief never forms, and steering requires registering
  the truth at some level.


  Then ask: adjudicate each move, and say whether the case is genuinely self-deception,
  and whether the phenomenon survives deflationary redescription.


  Keep to ~2-3 paragraphs. Formal. No reliance on niche theory names, though mentioning
  that the paradox has a structure is fine. Avoid citing philosophers. Fine.'
