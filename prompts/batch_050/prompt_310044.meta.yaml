  A colleague has convinced himself that Scanlon-style contractualism collapses into
  moral paralysis whenever interests conflict, and his argument troubles me. Contractualism
  holds, roughly, that an act is wrong if it would be disallowed by any principle
  that no one, suitably motivated, could reasonably reject; and its signature feature
  is the individualist restriction: whether a principle can be reasonably rejected
  is assessed person by person, from each individual''s standpoint, so the complaints
  of different people may not be summed into a collective grievance. Now consider
  a standard rescue case: I can divert a runaway vehicle to save one worker, or leave
  it on course to save five workers equally placed in every relevant respect, where
  death is the outcome on whichever side is not saved. His argument:


  (1) If saving the greater number were required by some non-rejectable principle,
  then a principle requiring me instead to save the one would have to be reasonably
  rejectable by someone.

  (2) Under the individualist restriction, the five cannot pool their claims: each
  speaks only for herself, and each individual complaint — loss of life — is exactly
  as strong as the single worker''s complaint.

  (3) No complaint on one side of a conflict can be defeated by a complaint on the
  other side unless it is strictly weaker.

  (4) Since every complaint in play is equal in strength, no one''s complaint defeats
  anyone else''s; so neither principle — save the one, save the five — is rejectable
  while the other is not.

  (5) A principle on which the outcome is settled by nothing stronger than a coin
  toss, or left to the rescuer''s whim, is one the loser could reasonably reject:
  she loses her life for no morally sufficient reason.

  (6) Therefore there is no non-rejectable principle governing the case at all, and
  contractualism yields no verdict — or, worse, yields the verdict that any choice
  is wrong — even where one option saves four more lives at no greater cost to anyone.


