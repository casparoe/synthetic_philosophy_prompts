  ---


  I am preparing a session of our graduate reading group on free will and moral responsibility,
  and I have been trying to steelman Galen Strawson''s Basic Argument — the regress
  argument that aims to show that true moral responsibility is impossible. What worries
  me is that my reconstruction, whose premises each strike me as hard to deny, appears
  to prove far more than Strawson needs, and more than I can bring myself to believe.
  I would be grateful for a careful diagnosis. Please answer as a philosopher who
  specialises in free will and moral responsibility, in British English, and think
  step by step about where the pressure really sits before committing to a verdict.


  Here is my version of the argument:


  (1) Whenever you act, what you do flows from the way you are at the time — your
  character, motives, values and habits of mind.

  (2) So you are morally responsible for an action only if the action is genuinely
  attributable to you: only if the self it flows from is a self for which you are
  responsible.

  (3) A self is one for which you are responsible only if you are its author — only
  if you deliberately chose, and thereby brought about, the character from which you
  now act.

  (4) Any such choice would itself have flowed from the way you already were, so by
  (1)–(3) it is attributable to you only if you were responsible for that earlier
  self as well.

  (5) Hence responsibility for any action requires either an infinite regress of prior
  acts of self-authorship or a first act of self-creation from nothing.

  (6) Neither is possible for finite beings.

  (7) Therefore no one is ever morally responsible for anything.


  The conclusion I cannot accept is not quite (7) but what seems to follow from the
  reasoning. Consider Miriam, who has spent twenty years deliberately reshaping her
  character — therapy, habit-training, reflection, the whole project of making herself
  patient where she was once cruel — and compare her with someone who has never once
  reflected, and with someone acting under post-hypnotic suggestion. On my argument,
  all three stand exactly alike: each traces back to an unchosen origin, so none is
  responsible for anything, and Miriam''s decades of self-authorship earn her nothing.
  That flattens every distinction our practices of praise, blame and apology are built
  on. Worse, the schema never mentions morality: replace responsibility with justification
  and character with cognitive dispositions, and the same steps seem to show that
  no belief is ever justified — including my belief in premises (1)–(6). An argument
  schema that yields global scepticism as a special case is, I take it, proving too
  much.


  So: which step should I reject, and why did it look fine? I would like, if possible,
  to keep the impossibility of self-creation in (5)–(6) and the datum that the hypnotised
  subject really is different from Miriam — but I want to know what each alternative
  costs. If you reject (2) or (3), tell me what I must then say about manipulation
  cases, and about whether responsibility is a historical property at all; if you
  think the argument is sound but my two extensions fail, tell me what feature of
  the moral case breaks the parallel. If my reconstruction departs from Strawson''s
  own version at the crucial point, say so and locate the departure. Please end with
  a single machine-readable line in the form: Verdict: reject premise (N) — followed
  by one sentence giving the reason, or Verdict: sound argument — with one sentence
  explaining why the extensions fail.


