  No quotes needed, no web needed — I know Skolem''s paradox well. Löwenheim–Skolem
  theorem: any first-order theory with an infinite model has a countable model; ZFC
  has countable models; inside the model, a set is uncountable because no bijection
  exists within the model, though externally countable. Misrepresentations to seed:
  (1) "so uncountable sets don''t really exist / Cantor was wrong" — overstatement;
  (2) conflation of countability simpliciter vs countability-relative-to-a-model;
  (3) maybe "the paradox is a contradiction in ZFC" — it''s not a formal contradiction;
  (4) maybe mischaracterize the resolution as "first-order logic is just defective"
  vs. Skolem''s own relativism conclusion. Also a subtle one: saying the model "contains
  only countably many sets" is right, but saying "every set in the model is countable"
  is subtly wrong — the model contains sets it regards as uncountable.


