  Let me build the argument carefully:


  1. A verdict is justified iff the evidence establishes guilt with probability above
  threshold (say 0.95).

  2. Probability is probability: the probability of guilt given the evidence is determined
  by the total evidence, whatever its form.

  3. So if evidence E1 establishes P(guilt)=0.96 and E2 establishes 0.96, E1 and E2
  equally justify conviction.

  4. In the blue bus case, market-share evidence (80% of buses on the route are Blue
  Bus Co.) establishes 0.8; an unreliable eyewitness with known error rate 20% also
  establishes 0.8.

  5. Courts treat these differently (eyewitness sufficient, market share not).

  6. Therefore courts'' practice is irrational / inconsistent, or premise 1 (probabilism
  about proof) is false.


