  Draft:


  The argument (call it the Parity Argument):

  (1) A verdict against the defendant is justified iff the evidence makes it sufficiently
  probable that the defendant is liable (i.e., proof beyond reasonable doubt just
  is a high enough posterior probability, say ≥ 0.95).

  (2) What matters to justification is the probability of the hypothesis given the
  total evidence, not the character of the evidence that produced it — a probability
  is a probability, whatever its pedigree.

  (3) Suppose a witness, independently verified to be right 96% of the time, testifies
  that the Blue Bus Company bus caused the accident. This makes the probability of
  Blue Bus''s liability 0.96, so by (1) the verdict is justified.

  (4) But in Smith v. Blue Bus, market-share evidence — Blue Bus runs 96 of the 100
  buses licensed on that route — also makes the probability of Blue Bus''s liability
  0.96. By (2), it equally justifies a verdict.

  (5) Generalize: any evidence establishing the same posterior justifies the same
  verdict. In particular, in the gatecrasher case, evidence that 499 tickets were
  sold but 1,000 people watched the rodeo establishes ~0.5... not enough. But scale:
  if 100 tickets sold, 10,000 present, each attendee is 99% likely to have gatecrashed
  — so every attendee is liable, and the promoter recovers 10,000 ticket prices for
  100 tickets sold.

  (6) No plausible theory permits that recovery, and courts rightly refuse liability
  on naked statistics.

  (7) So (1) or (2) is false: the probability calculus is not the whole of proof.


