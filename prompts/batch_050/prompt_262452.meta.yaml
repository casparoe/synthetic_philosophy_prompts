  an experiment that could confirm many-worlds" — the confusion being that the experimenter''s
  survival proves MW to everyone. Actually a subtler confusion: "Since under many-worlds
  every outcome occurs, quantum immortality shows I''m immortal, so longevity research
  is pointless." Or conflation with the anthropic principle.


  A nice subtle confusion: quantum immortality assumes the only relevant branches
  are ones where you''re alive — but the false presupposition that "survival" is all-or-nothing
  rather than degrees (you end up in branches where you''re severely incapacitated).
  The classic critique: QI selects for maimed survival, not comfortable survival.
  So a prompt: "If quantum immortality is correct, then whenever I risk death I should
