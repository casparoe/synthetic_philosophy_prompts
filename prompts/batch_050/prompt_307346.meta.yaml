  cases show there are two streams of consciousness; but the argument extends: in
  normal brains, the two hemispheres also process separately, so by the same test
  we''re all two subjects — absurd. Where does it go wrong?


  Alternatively indispensability argument: an argument that seems to prove too much:
  "we must believe in whatever our best science indispensably uses; our best science
  uses mathematics; so we must believe in mathematical objects. But by the same reasoning
  we must believe in idealizations like frictionless planes and point masses, since
  they''re also indispensable — absurd." That''s a well-known issue (the "idealization
  objection" to the indispensability argument). That could be a great prompt: student
  taking philosophy of math course, presents their own argument, casual, with a typo,
  requests sections, prompt engineering text.


  Let me construct: argument numbered premises:


  1. We ought to believe in the existence of everything that is indispensable to our
  best scientific theories (Quine-Putnam style).

  2. Mathematical objects (numbers, functions) are indispensable to our best scientific
  theories.

  3. So we ought to believe mathematical objects exist.

  4. But idealized entities — frictionless planes, point masses, perfectly rational
  agents, infinite populations — are also indispensable to our best science (we can''t
  do the calculations without them).

  5. So we ought to believe frictionless planes and point masses exist.

  6. That''s absurd — physics itself says there are none.

  7. So premise 1 is false, and the indispensability argument collapses.


  The flaw: "indispensable" is ambiguous — genuinely indispensable (can''t be eliminated
  in principle) vs. practically indispensable (convenient but eliminable). Point masses
  and frictionless planes are dispensable in principle (approximations); numbers arguably
  aren''t. Also Quine''s criterion is about quantifying over the best formulation,
  and idealizations aren''t taken seriously — we know they''re false within the theory.
  Also the confirmation holism angle. The student asks which premise to reject, what
  it costs.


