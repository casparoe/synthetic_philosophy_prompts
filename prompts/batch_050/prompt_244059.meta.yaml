  on the cluelessness problem, I have settled on a position I want stress-tested before
  I build a dissertation chapter around it. My view is that the cluelessness objection
  fails to undermine consequentialism as a decision procedure: although we cannot
  know the remote consequences of our actions, symmetrical ignorance means those unknown
  consequences cancel in expectation, so we are justified in deliberating on the near-term,
