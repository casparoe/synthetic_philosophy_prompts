  obvious."

  - Apparent tension: (1) "logical relation, degrees of rational belief" vs (4) Dutch
  book justification — people think Dutch book arguments support subjectivism, conflicting
  with logical objectivity. But that dissolves: coherence requirements are constraints
  any theory can adopt; Keynes can accept that where numerical degrees exist they
  should be coherent. Or apparent tension: (1) says probabilities are objective relations
  (not subjective) yet (3) says we just assign numbers to make decisions — but that''s
  the real tension. Pick an apparent one: (1) holds probability is objective AND a
  degree of belief — sounds contradictory (objective vs. belief), dissolves: it''s
  the degree of belief that is rational given the evidence, so objectivity concerns
  the relation, not the believer''s psychology. That''s a nice dissolve.


  So the genuine tensions: (2)+(1) vs (3) — the work practice contradicts the epistemology;
  and (5) vs (2) — indifference contradicts non-numericality, plus indifference''s
  own problems. Apparent: (1) internal (objective + degrees of belief). Also (4) Dutch
  book vs (1) — apparent, dissolves.


