  / climate investing). Commitments: (1) Keynes was right that some uncertainties
  are unquantifiable — no meaningful numerical probability; (2) decisions under such
  uncertainty still should use something like expected value with confidence-weighting;
  (3) numerical probabilities must obey the probability calculus; (4) when forced
  to act, treat unknown-probability events as if 50/50 (principle of indifference)...
  There''s a genuine tension: indifference + unquantifiability; also confidence-weighting
  vs. probability calculus. Apparent tension: "probabilities are degrees of rational
  belief" and "probabilities are objective relations" — Keynes''s logical theory holds
  both consistently (logical relation, degree of belief rational to hold given evidence).
  That dissolves.


  Personal relevance: maybe they just started a job doing scenario planning / they''re
  deciding whether to move countries, or they work in longtermist philanthropy dealing
  with existential risk where probabilities are made up. Good.


  Parfit''s hitchhiker option: commitments: (1) rationality = doing what''s best for
  you given your information; (2) you should pay the driver in the desert; (3) resolute
  choice / McClennen — plans can make it rational to do what you couldn''t rationally
  decide fresh; (4) one-boxing in Newcomb. Tension: (1)+(2) — paying when stranded-driver
  scenario: at payment time, evidence says you''re safe, so self-interest says don''t
  pay; the hitchhiker case is designed so rationality is self-defeating. Genuine tension.
  Apparent: (2) and (4) look in tension because Newcomb reward depends on prediction
  made before, hitchhiker rescue already happened — both actually require the same
  "paying after the benefit is locked in" move, so no tension. Or (3) vs (1): resolute
  choice is the standard fix but arguably abandons (1).


  I like the Keynes one more for novelty; the hitchhiker is also given in the example
