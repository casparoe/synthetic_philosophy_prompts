  Commitments:

  (1) Keynes (Treatise on Probability) was basically right that probability is a logical
  relation between evidence and hypothesis — a degree of rational belief, not a frequency
  and not just whatever you happen to feel.

  (2) Some propositions — like whether AGI arrives by 2040 or whether a novel policy
  causes a recession — are non-numerical: no meaningful precise probability applies;
  Keynes''s "weight of evidence" matters separately from probability.

  (3) Nonetheless, in our work we should still assign exact numbers (e.g., 12%) to
  such events and compare options by expected value, because decisions need commensurability
  and "any number is better than none."

  (4) Numerical probabilities must satisfy the probability axioms — additivity etc.
  — otherwise you''re vulnerable to Dutch books.

  (5) When I have no relevant evidence either way, the rational degree of belief is
  1/2 (principle of indifference).


  Tensions:

  - (2) vs (3): genuine, deep — if probabilities are non-numerical/unquantifiable,
  assigning exact numbers and running EV contradicts the view that some uncertainties
  can''t be measured. But it''s resolvable-ish: (3) could be a pragmatic policy rather
  than epistemic claim. The tension: if (1) probability is degree of rational belief
  fixed by evidence, then the 12% is not arbitrary — either evidence fixes it (contradicting
  2) or it''s not rational (contradicting 1). Actually good tension: (1)+(2) vs (3).

  - (4) vs (2): Keynes himself denied all probabilities are measurable/comparable,
  so requiring axiom-conformity for degrees of belief about non-numerical propositions
