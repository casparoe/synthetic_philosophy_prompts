reasoning_summary: 'Pick a domain and type. Let''s do "the procreation asymmetry"
  with "state commitments and check consistency" type. The procreation asymmetry:
  it''s wrong to create a miserable life, but not wrong to refrain from creating a
  happy life.


  Design a belief set with genuine non-obvious tensions and at least one apparent
  tension that dissolves.


  Commitments:

  (a) the procreation asymmetry itself

  (b) a person-affecting intuition generally ("we act for people, or people would
  exist")

  (c) creating a happy child is morally neutral — that''s part of asymmetry

  (d) total utilitarian-ish claim? Need genuine tension.


  Ideas for genuine tensions:

  - Holding the asymmetry while also holding that extinction of humanity would be
  a catastrophe partly because of all the future happy lives foregone — the asymmetry
  plus "lost future lives are bad" may conflict (if not creating happy lives is neutral,
  why is failing to create them via extinction bad?). That''s a standard tension (Benatar
  vs. extinction concern).

  - Holding the asymmetry while accepting the mere addition paradox / repugnant conclusion
  reasoning? If adding happy lives is neutral, then... Actually the asymmetry entails
  rejecting the mere addition principle, which is a known implication, not necessarily
  a tension.

  - Holding that it''s wrong to have a child you know will have a life barely worth
  living (asymmetry side), while also thinking most actual lives are worth living
  and population ethics shouldn''t be anti-natalist.

  - A person-affecting view plus the asymmetry plus "it''s permissible to have children"
  plus "once a child exists you owe them a lot" — apparent tension that dissolves
  (duties to existing people vs. creating people).


  Another genuine tension: accept asymmetry + accept that abortion/choosing not to
  conceive when you''d have a very happy child is fine, but also think a couple who
  sterilize the planet (voluntary human extinction) do something terribly wrong. If
  non-creation of happy lives is neutral, extinction-by-non-reproduction seems permissible.
  That''s the strong tension.


  Second tension candidate: holding asymmetry and also holding that a child''s existence
  can be a benefit to the child ("I gave my child the gift of life"). If existence
  can benefit the child, then failing to create a happy life fails to benefit someone...
  but person-affecting view says no one is harmed by non-existence. The "gift of life"
  plus asymmetry is in tension because it presupposes comparative value of existence
  vs non-existence for the person.


  Apparent tension that dissolves: holding the asymmetry while also thinking parents
  have strong duties to their actual children / that a parent wrongs their child by
  neglecting them — that''s consistent: duties to existing people. Or: holding the
  asymmetry while thinking it can be wrong to conceive in certain circumstances (e.g.,
  when you can''t care for the child) — dissolves because that''s about effects on
  existing people / creating a life that''s bad relative to... hmm, could be genuinely
  tricky.


  Another apparent tension: "I think it''s wrong to create a child whose life would
  be miserable, even if the miserable child would also make lots of other people happy"
  vs. asymmetry — not tension.


  Let me draft the set:


  1. The asymmetry itself: wrong to create a miserable life, not wrong to decline
  to create a happy one.

  2. Person-affecting principle: an act can''t be wrong unless it makes things worse
  for someone who exists or will exist... wait, careful: creating a miserable child
  makes things worse for someone who will exist — fine.

  3. Human extinction via voluntary universal non-reproduction would be a terrible
  outcome, among the worst things that could happen — because of all the good lives
  that would go unrealized.

  4. Once my child exists, I have strong special duties to them that I didn''t have
  before conceiving them (dissolves).

  5. Bringing a child into existence is a way of benefiting that child — "gift of
  life" (genuine tension with 1/2).

  6. Maybe: it''s permissible for me to have a child even knowing it will impose costs
  on others (climate footprint etc.)? Could be extra. Keep short.


  So genuine tensions: (3) vs (1) — if declining to create happy lives is not wrong/neutral,
  then extinction by non-reproduction loses its badness from foregone lives; need
  a fix (value of existing humanity, or reject asymmetry, or accept extinction neutrality).
  (5) vs (2): if existence benefits the child, then not creating a happy child fails
  to provide a benefit — but person-affecting neutrality says there''s no one to be
  deprived; some views (McMahan) accept existence can be a benefit but not a harm
  to fail... actually McMahan-style: causing someone to exist can benefit them, but
  not existing doesn''t harm them, so this may be defensible — a good answer could
  note it''s defensible but only at a cost (non-comparative benefit of existence is
  controversial; and if existence can benefit, asymmetry''s second horn gets shaky
  — why isn''t declining to create a happy child failing to do good in a morally relevant
  way?).


  Apparent tension: (4) — special duties to existing children vs neutrality about
  creating them; dissolves since duties attach to existing dependents.


  Ask: rank tensions by severity, cheapest fix, single revision that cleans up most.


  Casual tone, maybe a typo. Short.'
