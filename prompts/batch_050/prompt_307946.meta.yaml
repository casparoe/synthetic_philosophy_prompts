  Subtle mistakes ideas: student conflates internal reasons with Humean subjectivism,
  or claims Williams says external reasons don''t exist tout court (rather, they exist
  only if agent could be motivated through deliberation — actually Williams says claims
  of external reasons are false/incoherent), or misattributes the "true conclusions
  of sound deliberation" clause, or confuses constitutive aim with rationality, or
  says internal reasons require existing desires simpliciter (missing the deliberative
  route: agent could reach motivation by sound deliberation from existing S). Also
  mixing up Williams''s point that external reasons statements can have a perlocutionary
  force. Or attributing to Williams the view that morality collapses without internal
  reasons — actually he allows blame as a "proleptic" mechanism.


  Construct question: Explain Williams''s distinction and whether external reasons
  statements can be true; discuss objection.


  Student answer: gets basics right: S = subjective motivational set, internal reason
  exists relative to S if deliberative route from S to motivation. Mistakes: (1) says
  Williams defines S as exclusively desires (Williams includes dispositions of evaluation,
  emotional reaction patterns, personal loyalties, commitments); subtle. (2) says
  Williams holds that "A has reason to φ" statements are false whenever they can''t
  be internal — actually external reason statements are, on Williams''s view, false
  (or unintelligible as normative claims)... hmm, Williams''s official view: external
  reason statements are false — "no external reason statements can be true"? In the
  article he says it''s plausible there are no external reasons. He says external
  reasons claims, if true, would imply agent could be motivated even if not via deliberation
  from S — he finds this mysterious. So saying they''re false is roughly right. Better
  mistake: (2) conflate sound deliberation with merely means-end reasoning / instrumental
  reasoning — Williams explicitly denies limiting deliberation to means-end; imagination,
  correcting false beliefs, etc. That''s a good subtle mistake: student says "deliberation
  can only take us from ends to means," missing that Williams allows more.


  (3) misattribute: student says Williams argues external reasons theorist smuggles
  in a disguised internal reason — actually Williams''s point is that external reasons
  statements might be true only if agent is irrational in failing to be motivated,
  but irrationality itself requires reasons... The classic point: the external reasons
  theorist claims agent has reason regardless of S, but Williams says if agent can''t
  be motivated even by sound deliberation, in what sense is it a reason? The claim
  that "being motivated by it" is a matter of rationality is question-begging.


  Also potential mistake: student says Williams thinks blame works by reminding the
  agent of internal reasons — actually Williams says blame is "proleptic": it treats
  the agent as if she had the internal reason, hoping to induce it. Subtle misstatement.


  Write question: graduate seminar essay question: "Explain Williams''s internal/external
  reasons distinction. Is his argument against external reasons convincing? Discuss
