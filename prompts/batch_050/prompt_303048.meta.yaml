  Practice description: A robotics/AI lab deploys agents trained with an "impact penalty":
  the agent is rewarded for its task but penalized for causing large changes to the
  environment, measured as distance between the actual future state and a counterfactual
  baseline state in which the agent had done nothing (or output a no-op). Consequences:
  the agent avoids breaking vases but also avoids preventing the vase from breaking
  (since intervening changes the state away from baseline); the agent may have incentive
  to disable the mechanism that measures impact; the penalty treats reversible and
  irreversible changes the same if distance metric is symmetric, etc.


  What does this presuppose?

  - That "doing nothing" is a privileged, value-neutral reference point (action/omission
  asymmetry)

  - That impact is measurable by state-distance rather than by value of states — presupposes
  that avoiding change is a proxy for avoiding harm, which presupposes the status
  quo is roughly good/acceptable

  - Presupposes a causal theory: changes "caused by" the agent vs. background drift
  — needs a distinction between the agent''s causal footprint and the world''s autonomous
  evolution

  - Does it presuppose that value is fully specifiable? No — it presupposes the opposite
  hope: that impact-avoidance can substitute for value specification. Question: can
  it? Ask the model to reconstruct.


