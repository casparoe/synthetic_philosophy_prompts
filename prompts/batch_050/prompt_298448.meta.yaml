  blocks the triviality proof but looks ad hoc unless we have some story about why
  the equation should be so fragile. A different escape, due to Stalnaker, is to replace
  conditionalization with imaging, whereupon the Thesis can be preserved; this shows
  that Stalnaker''s possible-worlds semantics for the conditional survives Lewis''s
  argument unscathed.


