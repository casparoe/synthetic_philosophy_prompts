  [Student answer draft]


  Stalnaker''s Thesis says that for any propositions A and C with P(A) > 0, the probability
  of the indicative conditional "if A, then C" equals the conditional probability
  of C given A, i.e. P(A→C) = P(C|A). The motivation is the Ramsey test: to evaluate
  "if A then C," you hypothetically add A to your stock of beliefs, adjust minimally,
  and see how confident you are in C — and your degree of belief in the conditional
  should just track that. It also explains why the material conditional reading fails:
  P(¬A ∨ C) generally comes apart from P(C|A), e.g. when ¬A is very probable, so a
  material reading can''t capture our confidence in ordinary indicatives.


  Lewis''s argument is a reductio of the Thesis. Assume the equation holds universally,
  for every conditional in the language. Lewis showed that given this assumption,
  the probability space collapses into triviality: conditional probabilities collapse
  onto unconditional ones, so that learning the antecedent could never change your
  credence in the consequent — everything becomes probabilistically independent of
  everything else, which is absurd for any non-degenerate credence function. Importantly,
  the argument only requires the Thesis to hold for a single, fixed probability function:
  nothing about conditionalization or about families of distributions is needed, which
  is what makes the result so strong.


  The upshot, as Lewis himself concluded, is that indicative conditionals do not express
  propositions at all and so lack truth values; they have assertibility conditions
  instead, given by conditional probability. This is the so-called "no truth value"
  (NTV) view, and Lewis''s proof more or less forces it on us, since the only assumption
  needed to derive triviality is that the conditional is a proposition whose probability
  obeys the Thesis.


