  "The simulation argument (Bostrom 2003) is a trilemma: at least one of these is
  true — (1) virtually all civilizations die out before reaching technological maturity;
  (2) virtually no technologically mature civilization is interested in running ancestor
  simulations; (3) we are almost certainly living in a simulation. Importantly, the
  argument doesn''t prove (3) on its own; it proves the disjunction, and Bostrom is
  explicit that we shouldn''t assign (3) anything like 99% confidence just from the
  argument alone.


  Fanaticism, as the term gets used in the longtermism literature, means valuing the
  far future so heavily — because of the sheer number of possible future lives — that
  its value swamps everything in the near term, in the limit becoming effectively
  infinite compared to present-day concerns. So a fanatic about the far future will
  always pick the option that best affects the long-run trajectory, even if the benefits
  to people alive now are tiny.


  Does the simulation argument dampen this? I think yes, substantially. The reasoning:
  conditional on (3), we are in a simulation run by someone else, and simulations
  can be turned off, restarted, or terminated when they stop being interesting. That
  puts a discount on the far future: the probability that our actions now compound
  into effects billions of years from now is much lower if there''s a constant background
  risk of shutdown. Fanaticism depends on enormous expected values from the deep future;
  a shutdown-risk discount shrinks those expected values, so the fanatical conclusion
  weakens. Conditional on (1) or (2) there is no such discount, but since (3) has
  significant probability, the all-things-considered expected value of far-future
  interventions comes down. Hence the simulation argument dampens fanaticism, though
  it doesn''t eliminate it entirely."


