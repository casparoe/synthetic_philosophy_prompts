  welfarism because of adaptive/expensive tastes (expensive tastes are voluntarily
  cultivated → welfarism unfairly compensates; adaptive preferences are involuntarily
  formed → welfarism undercompensates). If you hold responsibility-sensitivity, then
  cultivated expensive tastes shouldn''t be compensated — consistent with capability
