  Genuine tensions:

  - Capabilities approach + adaptive preferences objection: fine, capabilities handle
  adaptive preferences — actually consistent.

  - Neutrality between conceptions of the good + capabilities approach: real tension!
  Nussbaum''s capability list is famously a substantive/perfectionist account of the
  good life. Sen resists fixed lists partly for this reason. This is a genuine, non-obvious
