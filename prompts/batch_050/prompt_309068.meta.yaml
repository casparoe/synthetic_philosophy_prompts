  - Responsibility-sensitivity/luck egalitarianism + capabilities: capabilities are
  about real opportunities; if someone squanders a capability through choice... Also,
  luck egalitarianism with welfare as currency has harshness objections; with capabilities
  it''s less harsh. Hmm. But there''s a tension: adaptive preferences objection relies
  on taking people''s actual preferences seriously as evidence of injustice; responsibility-sensitivity
