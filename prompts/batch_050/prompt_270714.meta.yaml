  Parfit''s hitchhiker: a rational agent who can be read (transparent) benefits from
  being disposed to act irrationally. Argument proving too much: rationality recommends
  making oneself systematically irrational — e.g., you should cultivate dispositions
  to break promises, ignore evidence, etc. Conclusion: ideal rationality is self-effacing/self-defeating,
  so one should abandon rationality. Where does it go wrong? Possible flaw: equivocation
  between act-rationality and disposition-rationality; or a modal/scope slide between
  "it is rational to become the kind of person who..." and "the act such a person
  performs is rational."


  Write numbered premises:


  (1) An agent is rational to adopt whatever dispositions produce the best outcomes
  for her.

  (2) In the hitchhiker case, the disposition to pay even when it''s no longer beneficial
  produces the best outcome.

  (3) So rationality requires adopting dispositions that will sometimes lead her to
  act against what rationality recommends at the moment of action.

  (4) This generalizes: any two-person situation with transparency (threats, promises,
  nuclear deterrence, bargaining) rewards systematically irrational dispositions.

  (5) Since such situations are ubiquitous, rationality requires being disposed to
  act irrationally in most of social life.

  (6) Therefore ideal rationality consists largely in cultivated irrationality — a
  rational agent should train herself out of responding to reasons.

  (7) That''s absurd.


  Where does it go wrong? Don''t announce. Asker can say they''d rather keep (1) than
  accept (6).


  Keep short and formal. No quotes needed, no web needed.'
