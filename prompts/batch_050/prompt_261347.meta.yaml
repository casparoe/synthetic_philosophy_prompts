  penguin in the living room; surreal absurdism); is a benign appraisal without incongruity
  ever funny; how each side explains failed jokes, offensive jokes, and humour at
  one''s own misfortune over time (the temporal distance effect). Tests: both agree
  what bears — e.g., jokes made funny by adding distance, tragedies that become funny
  only later.


  Also mention: treat superiority and relief theories as legacy positions and ask
  whether either camp absorbs their phenomena.


  Keep it 2-3 paragraphs. Formal. No quotations. Fine.'
