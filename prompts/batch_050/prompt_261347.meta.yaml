  "I''m a novelist at work on a comic novel, and in the course of trying to understand
  why some of my own jokes land and others fall flat I''ve been reading the philosophical
  and psychological literature on humour. Two camps keep talking past each other:
  the incongruity theorists, who hold that humour is the perception of a violation
  of our expectations or conceptual schemes, often followed by a playful resolution;
  and the benign violation theorists, who hold that humour requires both a violation
  (of a norm, a dignity, a way things ought to be) and a simultaneous appraisal that
  the violation is benign..."


  Then ask for the joint statement. Include: agreed claims — jokes can fail by being
  too tame or too transgressive (too-mild and too-severe violations both kill humour),
