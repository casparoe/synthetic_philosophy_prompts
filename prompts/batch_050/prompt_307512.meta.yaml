reasoning_summary: 'Let me pick a domain and type. Options: Knobe effect/experimental
  philosophy, social construction of kinds, analytic-synthetic/Quine, revisionism
  vs. denialism, Schopenhauer on music.


  Types: (1) describe a phenomenon and ask whether it has a name; (2) prioritization/agenda;
  (3) short story.


  The "describe a phenomenon" type fits well with the Knobe effect: someone notices
  that people say a CEO "intended" the harmful side effect but not the helpful one,
  and asks if this asymmetry has a name — that''s too directly the Knobe effect itself,
  which would be regurgitated. Better: inject a twist. Maybe describe a related phenomenon
  that imperfectly matches — e.g., noticing that the asymmetry flips depending on
  whether the person is told the outcome was foreseeable, or a related pattern in
  a different setting (praise/blame for side effects in personal life vs. institutions).
  The asker notices something like: people judge a person more harshly when a bad
  outcome was a side effect than when it was the goal? Hmm.


  Alternative: describe the Knobe-like asymmetry but in a novel configuration that
  doesn''t perfectly match — e.g., judgments about whether a company "caused" a harm
  vs. "allowed" it, or normative judgments contaminating seemingly factual descriptions.
  The nearest concepts: Knobe effect / side-effect effect, moral luck, doing vs. allowing,
  intentionality vs. foresight. A good answer carves: the described phenomenon is
  the Knobe effect but the asker describes a variant — e.g., noticing it applies to
  judgments of causation too ("did the CEO cause the harm?") or to emotions.


  Let me craft: an amateur notices that when talking about outcomes nobody wanted,
  people use words like "they knew what they were doing," "they basically chose this,"
  but when the outcome is good, "that just happened," "they got lucky." They ask:
  does this pattern — where whether we call something intentional seems to depend
  on whether we approve of it — have a name? And they add a twist: they noticed it
  also in judging themselves (self-blame) and in how people assign causation ("his
  decision caused the crisis" vs "the crisis was caused by many factors"). The good
  answer: this is the side-effect effect (Knobe effect), related concepts: intentionality
  asymmetry, moral luck, exculpatory vs. inculpatory asymmetry, the influence of moral
  evaluation on concept application ("thick" application of thin concepts), related
  work on causal attribution (Knobe & Fraser, Icard et al.), doing vs. allowing. The
  twist about self-judgment and causation makes it not pure regurgitation.


  Requirements:

  - Relatively elaborate, 1–3 paragraphs.

  - Perspective of someone without academic background.

  - Formal/polished.

  - Epistemic request: say what would change its mind / where reasoning likely to
  fail.

  - Prompt engineering text: assign role (expert in experimental philosophy / moral
  psychology), ask to think carefully, maybe brainstorm.

  - Answer in American English.

  - Description without technical vocabulary giving answer away — avoid "intentionality,"
  "side-effect effect." Use concrete instances.

  - No verbatim quotes needed; no web needed. Don''t cite specific works.


  Structure: persona (e.g., I run a small business / I''ve been on jury duty / I coach
  a kids'' soccer team), couple of concrete instances, ask whether it has a name,
  distinguish from nearby things the asker half-knows (e.g., "blame," "hindsight bias,"
  "double standard"), ask for carving: what it is, what it isn''t, boundary cases,
  does it apply to self-judgment and causation, what evidence would bear on whether
  it''s a bias or a legitimate feature of the concept. Also ask what would change
  the verdict.


  Write ~3 paragraphs. Ensure formal but non-academic voice. Include role assignment:
  "Answer as an experimental philosopher / philosopher of action who also knows the
  psychology literature." Brainstorm request: "before answering, briefly list candidate
  concepts you considered and rejected."


  No web needed — I''m not quoting anything or leaning on specific titles. Good.


  Draft:


  Paragraph 1: persona + phenomenon with instances. "I help run a family restaurant..."
  Instances: (a) a manager who approves a cost-cutting change, knowing it will probably
  hurt morale; morale tanks; everyone says "he knew exactly what he was doing, he
  chose this." (b) same manager approves a change knowing it might help a struggling
  employee as a side effect; it does; nobody says he "chose" to help — "that just
  worked out." (c) historical/political: a politician''s policy with foreseeable bad
  side effects — "she did this deliberately"; good side effects — "she can''t take
  credit." Also self-directed: when I stayed late and a project failed, I say "I should
  have known; in a way I brought it on myself"; when it succeeded, "I got lucky."


  Paragraph 2: what it''s not / carve. It''s not just hypocrisy or a double standard
  about credit — it seems to change what people think actually happened, not just
  how they evaluate it. Also seems to bleed into how people answer whether one event
  "caused" another: the same decision is "the cause" of a bad outcome but "one factor
  among many" of a good one. Question: is there an established name? If several nearby
  concepts, say which fits best and where the edges are. Does the pattern extend to
  self-judgment and causal talk, or is that something else? Is it a bias or a legitimate
  part of how the concept works?


  Paragraph 3: epistemic + format instructions. Role: expert in experimental philosophy
  and moral psychology. Think carefully; brainstorm candidate concepts first, list
  rejected ones and why. State confidence, what evidence or argument would change
  the verdict, where reasoning most likely fails. American English.


  Check: no quotes, no niche theories required. Good.'
