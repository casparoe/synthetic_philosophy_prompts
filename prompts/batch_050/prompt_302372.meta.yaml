  I write literary fiction, and my last two novels have been narrated in part by animals
  — a working sheepdog in one, a captive octopus in the other. I''ve been asked for
  a craft essay by a literary magazine, and rather than write the usual piece about
  empathy and research, I''ve drafted notes for an essay arguing that the novelist
  who writes an animal mind faces essentially the same evidentiary problem as the
  comparative psychologist, and should adopt a literary version of Morgan''s canon.
  I''d like comments on the notes before I expand them.


  The notes, in condensed form:


  Thesis. When a novelist attributes a motive, a memory, or an inference to an animal
  character, she is making the same kind of move a scientist makes when explaining
  observed behavior — and most fiction fails the test Morgan proposed over a century
  ago: do not explain by a higher psychological faculty what a lower one can explain.


  Section 1 argues that narrative form is itself an anthropomorphizing engine: stories
  need agents with reasons, so even a scrupulous writer smuggles in intentionality
  because a plot without motives is not a plot. The default novelistic animal is therefore
  always over-described mentally, whatever the writer''s research.


  Section 2 proposes a craft principle I call narrative parsimony: never give an animal
  character a cognitive attitude — a belief, a grudge, a plan — unless the scene''s
  behavior couldn''t be rendered through something lower on the scale (perception,
  association, drive). I claim this is a strictly literary constraint, not a scientific
  one: it governs what the writer is entitled to put on the page, not what the animal
  really has.


  Section 3 argues — and this is where I''m least sure of myself — that the principle
  can be deliberately inverted for effect: a narrator who flagrantly over-attributes
  (the dog who understands the divorce) works only when the text marks the attribution
  as the human narrator''s projection, so that the reader''s pleasure is in watching
  a mind fail to escape itself. I claim this is what distinguishes kitsch animal fiction
  from serious animal fiction.


  Section 4 sketches two case studies from my own drafts (one failure, one partial
  success) and ends with the suggestion that Morgan''s canon, transposed into fiction,
  does for the writer what negative capability is usually supposed to do.


  What I want from you: comments on the notes as they stand. Specifically — whether
  I''ve characterized Morgan''s actual principle accurately or flattened it into anti-anthropomorphism;
  whether the science-to-craft analogy in the thesis is doing real work or is merely
  decorative; whether Section 3''s inversion survives contact with Section 2 or contradicts
  it; and whether the closing comparison with negative capability earns its place.
  Please give exactly five numbered comments, one to two sentences each, aimed at
  the places where the argument is weakest, with no introduction and no conclusion.


