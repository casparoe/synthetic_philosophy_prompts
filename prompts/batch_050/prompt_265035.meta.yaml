  \ type works nicely for Gricean implicature/speaker meaning: construct cases where\
  \ speaker meaning diverges from sentence meaning in tricky ways, ask what principle\
  \ determines what was meant vs. merely implied vs. said.\n\nAlternatively Augustine\
  \ on time with a thought-experiment construction: construct a scenario where the\
  \ distentio animi account gives a different verdict than a presentist/A-theory...\
  \ Could work but requires injecting novel ideas.\n\nI like Grice + verdicts-on-cases.\
  \ Inject some new/niche case ideas: e.g., cases where implicature fails because\
  \ of calculability issues, \"implicature\" via tone not content, cases of irony\
  \ where speaker means the opposite but a hearer couldn't compute it, cases where\
  \ a speaker intends an implication but refuses to commit (plausible deniability),\
  \ cases where the speaker is mistaken about what the hearer knows — does the speaker\
  \ mean that p if the inference requires a false premise the speaker believes? Cases\
  \ where a speaker utters a sentence intending the implicature to be the main point\
  \ and the literal content to be backgrounded.\n\nDesign verdicts with at least one\
  \ hard-to-reconcile pair. Write as PhD student, formal, short.\n\nCases idea list:\n\
  1. A letter of recommendation saying only \"She has excellent handwriting and is\
  \ always punctual\" — I think the writer means the candidate is no good (classic).\n\
  2. Irony: \"What lovely weather\" during a storm — speaker means the opposite, even\
  \ if the hearer wouldn't detect it? Verdict: speaker means the opposite regardless\
  \ of hearer's uptake? Hmm — Grice requires reflexive intention; if the speaker knows\
  \ the hearer can't detect irony, does the speaker still mean it? My verdict: no\
  \ — meaning requires the intention that the hearer recognize the inference; so a\
  \ speaker who knows the hearer is irony-deaf hasn't meant the opposite, just spoken\
  \ sarcastically to themselves.\n3. Deniability case: at a committee meeting I say\
  \ \"Smith has been to prison\" knowing hearers will infer he's dishonest but intending\
  \ them to draw it while retaining deniability — I did mean/implicate he's untrustworthy.\
  \ \n4. Mistaken premise case: I say \"The meeting's been moved to 3\" intending\
  \ you to infer you'll miss your train, but unbeknownst to me you're taking a different\
  \ route — do I still mean that you'll miss your train? Verdict: yes, speaker meaning\
  \ doesn't depend on the hearer actually inferring... hmm but Grice's analysis requires\
  \ the hearer to produce the belief via recognition of intention; the intention suffices\
  \ even if unfulfilled? My verdict: speaker meant it but failed to communicate.\n\
  5. \"Saying vs. hinting\" pair hard to reconcile: in case 3 I say the speaker means\
  \ p, but in a case where a speaker utters something and merely hopes the hearer\
  \ thinks of p on their own (I mention that the museum is closed Tuesdays hoping\
  \ you'll conclude we can't go tomorrow, but intending that you think the idea was\
  \ yours) — I say there the speaker did not mean that we can't go, because recognition\
  \ of intention would spoil the effect. This is the classic Grice/Strawson/Searle\
  \ \"showing a photo of Mr. X drawing\" cases. Good tension: covertly influencing\
  \ vs. meaning.\n6. A case where literal content is false but clearly not meant,\
  \ implicature true and meant — e.g., \"That's going to be one long meeting\" — fine.\n\
  \nThe hard-to-reconcile pair: case 3 (deniability, speaker means it) vs case 5 (subtle\
  \ manipulation, speaker doesn't mean it) — the difference is whether recognition\
  \ of the intention is part of the mechanism. A principle that captures all: speaker\
  \ means that p iff the speaker intends the hearer to believe p (or take p as given)\
  \ in part via recognition of that very intention; implicature when p isn't said.\
  \ Then ask what it predicts for a novel case, and which verdict must be dropped\
  \ if a simpler principle.\n\nAlso could include a case testing \"said vs. meant\"\
  : \"Every student passed\" said by someone who knows the exam wasn't taken by all\
  \ enrolled... maybe too much. Keep it focused: 4-6 cases.\n\nAlso ask: what does\
  \ the principle predict for a case not listed — e.g., a speaker who intends the\
  \ hearer to recognize the intention but the hearer reaches the belief through a\
