  \ case list. No quotes from texts, no citations needed. Don't need web search —\
  \ all from standard knowledge; avoid quoting Grice verbatim.\n\nLength: relatively\
  \ short but with cases it'll be a paragraph + list. That's fine per notes.\n\nLet\
  \ me draft.\n\n---\n\nI'm a PhD student working on pragmatics... I've been testing\
  \ my intuitions about speaker meaning and implicature, and I'd like to know what\
  \ principle, if any, unifies my verdicts.\n\nCases:\n\n1. A referee writes of a\
  \ philosophy job candidate only that she is punctual and has excellent handwriting.\
  \ My verdict: the referee means that the candidate is a poor philosopher, though\
  \ she has not said it.\n\n2. A colleague who knows that I know he is speaking to\
  \ someone irony-deaf says, of a disastrous talk, \"That went well,\" counting on\
  \ me alone to catch the tone; to the irony-deaf listener he has not meant that it\
  \ went badly — he's merely performed sarcasm for himself. Hmm, this conflates two\
  \ hearers. Simplify: A speaker says \"That went well\" of a fiasco, knowing the\
  \ only hearer never detects irony. My verdict: he has not meant that it went badly,\
  \ however much he intended it inwardly. Actually—intended it? If he intends the\
  \ hearer to recognize... he knows they can't. Grice: intention that hearer believe\
  \ via recognition of intention; if speaker knows hearer can't recognize, the intention\
  \ can't be properly formed. Verdict: no speaker meaning, just sarcasm.\n\n3. At\
  \ a hiring meeting I remark, of an applicant, that he spent two years in prison,\
  \ expecting the committee to infer untrustworthiness while keeping my deniability.\
  \ My verdict: I did mean that he is untrustworthy; deniability doesn't exempt me.\n\
  \n4. I tell a friend the meeting has been moved to three, intending her to infer\
  \ that she'll miss her train; unknown to me she's driving. My verdict: I meant that\
  \ she'd miss her train, though the message failed.\n\n5. I mention, apparently idly,\
  \ that the museum is closed on Tuesdays, hoping you'll conclude we can't go tomorrow\
  \ — and hoping further that you'll think the conclusion your own idea, so that if\
  \ you realized I intended you to draw it, my purpose would be defeated. My verdict:\
  \ I did not mean that we can't go.\n\nThe tension: 3 vs 5 — in both I intend a belief\
  \ and keep cover; distinguishing them requires something like overtness of the intention.\n\
  \nAsk: Is there one principle delivering all five? State precisely. Which verdict\
  \ must go if a simpler principle is preferred? What does it predict for an unlisted\
  \ case — e.g., where the hearer arrives at the intended belief but through a mishearing\
  \ or an accidental route, bypassing recognition of my intention?\n\nGood. Also maybe\
  \ add a case where said content vs implicated: \"Some students passed\" — means\
  \ not all. Too standard; skip.\n\nKeep formal, polished, PhD student perspective,\
  \ short-ish. Output prompt only."
