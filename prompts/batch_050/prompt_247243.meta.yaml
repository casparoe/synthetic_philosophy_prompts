  type can be reframed: journalist asked to give a guest session.


  Tranquilism is nicely niche but well enough known (Ajahn Brahm, tranquilism vs hedonism,
  craving/suffering). Teaching plan for tranquilism to an audience — that''s good:
  misconceptions like "it''s just Buddhism", "it''s depression/annihilationism", "it''s
