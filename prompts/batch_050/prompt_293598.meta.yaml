  The standard literature responses to Williams''s integrity objection:

  1. Railton''s "sophisticated consequentialism": the good consequentialist has a
  standing disposition but doesn''t deliberate consequentially at every moment — the
  husband needn''t run the utility calculus each time; alienation objection answered
  by distinguishing criterion of rightness from decision procedure.

  2. The reply that the intuition pumps are rigged: Williams''s cases (Jim and the
  Indians, George the chemist) elicit intuitions that don''t track rightness; the
  cost of integrity is borne by third parties.

  3. The claim that Williams''s objection overgeneralises: any moral theory can demand
  actions that conflict with ground projects (Kantianism too), so it''s not an objection
  to consequentialism specifically. (Actually Williams himself deployed integrity
  against Kantianism too — "against morality" broadly.)

  4. The "one thought too many" reply: the rescuer who saves his wife "in violation
  of the Moral Law" — response: morality permits partiality; the thought "it''s my
  wife" is morally fine; consequentialists can build in agent-centred prerogatives
  (Scheffler). Though that''s a different move: hybrid theories.

  5. Reply that integrity talk conflates the psychology of deliberation with the justification
  of action — what you should think in the moment vs. what makes it right.

  6. The reply from negative responsibility denial: Williams''s own notion of negative
  responsibility is confused (e.g., the claim that you can''t be responsible for what
  you fail to prevent is contested).

  7. The reply that Williams smuggles in a moralized notion of integrity.


