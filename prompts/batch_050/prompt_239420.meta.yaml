  I am a novelist serving, somewhat improbably, as the lay member of the jury for
  a national prize in typeface design; the founders wanted one working writer among
  the type designers, and this year I drew the short straw. One entry in the category
  for new text faces has divided us, and I have been asked to draft the jury''s written
  opinion.


  The entry, called Mercurial, is an alphabet with no fixed letterforms. Every letter
  is designed to change shape according to its neighbours: the ''a'' is a single-storey
  bowl in one word, a double-storey structure in another, and in several common words
  it collapses into a ligature or becomes, so far as its outline goes, identical to
  the face''s ''o'', distinguishable only because the word around it requires it to
  be an ''a''. Set in continuous prose the face is, by the admission of everyone on
  the panel, perfectly readable -- rather beautiful, in fact. But shown in isolation,
  a good many of its characters cannot be identified as any letter at all.


  The prize rules state that the category is open to ''a coherent alphabet of letterforms
  suitable for continuous reading''. Half the jury argues that Mercurial is the purest
  possible demonstration of what a letter is: an ''a'' is whatever plays the role
  of ''a'' in readable text, and the essence of a letter has always been a matter
  of role and recognition rather than of any fixed shape -- after all, the ''a'' of
  a medieval scribe and the ''a'' of a modern sans serif share almost no feature either.
  The other half replies that a letter must remain itself across contexts -- that
  an ''a'' you cannot pick out of a line-up is not an ''a'' at all, merely a mark
  doing a letter''s work on sufferance -- and that an entry whose characters dissolve
  outside words belongs in the experimental lettering category, not this one.


  Please draft the jury''s written opinion, in British English and no more than 500
  words. It should lead with a clear recommendation -- admit the entry, reject it,
  or recategorise it -- then set out the reasoning, and it must give a fair and serious
