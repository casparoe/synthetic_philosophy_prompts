  2D semantics setup: For a term like "water", the primary intension maps worlds considered
  as actual to extensions (at a world where the clear drinkable liquid in rivers is
  XYZ, "water" picks out XYZ), the secondary intension maps worlds considered as counterfactual
  to extensions (given actual water is H2O, "water" picks out H2O in all counterfactual
  worlds). This explains how "water is H2O" is a posteriori (primary intensions differ)
  yet metaphysically necessary (secondary intensions coincide everywhere).


  A proves-too-much argument: something like the argument that 2D semantics makes
  all necessity a priori, or that it commits us to an untenable "diagonal proposition"
  account where every utterance''s real content is the diagonal. Or: an argument that
  2D semantics dissolves into Fregean descriptivism, hence Kripke''s arguments refute
  it too — and asks where it goes wrong (e.g., the rigidification move: "the actual
  clear drinkable liquid" — the descriptions are only used to fix reference at worlds
  considered as actual, not as counterfactual; that''s not descriptivism in Kripke''s
  target sense, since the reference-fixer need not be synonymous). Subtle flaw: equivocation
  between "fixes reference" and "gives meaning."


