  co-refer, ''a = b'' has a necessarily true secondary intension. (2) The informative
  content of ''a = b'' is its diagonal/primary proposition. (3) The primary intension
  of a name is determined by the reference-fixing story the speaker associates with
  it. (4) Speakers who use ''Hesperus'' and ''Phosphorus'' associate different reference-fixers.
  (5) But consider the name ''Aristotle'': different speakers associate wildly different
  descriptions, and the same speaker at different times too. (6) If (3)-(5), then
  ''Aristotle'' has no shared primary intension across speakers; communication about
  Aristotle would be impossible unless we share reference-fixers. (7) We do communicate.
