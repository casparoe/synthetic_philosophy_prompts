  Having retired last year from a career in experimental chemistry, I have been making
  up for lost time by attending a philosophy discussion circle at our local library.
  Last week the topic was the so-called paradox of blackmail — the puzzle that it
  is criminal to demand money in exchange for not revealing truthful, lawfully obtained
  information, even though revealing the information is perfectly legal and so is
  politely asking for money. I did not contribute, but two members had a sustained
  exchange that I have been turning over since, and I would like a neutral verdict.


  The exchange was prompted by a hypothetical that one of them, a retired corporate
  lawyer I''ll call M, put forward: a company compiles dossiers exclusively from truthful,
  lawfully obtained material — court records, property filings, the subject''s own
  public posts — and offers anyone a paid subscription under which their dossier is
  withheld from the company''s searchable public index. The moment the subscription
  lapses, the dossier goes live. No threats are sent; the terms are stated plainly
  on the website, and no one is obliged to subscribe.


  M''s opening claim was that this is blackmail in everything but name, and should
  be criminal for exactly the same reason: the entire revenue of the enterprise consists
  of payments to suppress truthful information whose publication would damage the
  payer. The paradox of blackmail, he said, simply shows that a transaction can be
  wrongful as a whole even though each ingredient, taken alone, is innocent.


  E, a software engineer, replied that M had the paradox upside down. If no one has
  ever produced a satisfactory explanation of why the conjunction of two legal acts
  is criminal, the rational conclusion is not that the conjunction is somehow criminal
  anyway, but that blackmail law is an historical accident we tolerate because it
  rarely troubles us. On his view, the subscription service is not blackmail-like
  at all; it is merely a company exercising its undisputed right to publish or not
  publish, and charging for the latter — something every publisher does whenever it
  declines a story for commercial reasons.


  M then offered what he took to be the missing explanation: what is wrongful in blackmail
  is the sale of suppression. Information in which third parties have a legitimate
  interest — a prospective employer, a business partner — gets buried, and the benefit
  flows privately to the blackmailer rather than to anyone the information concerns.
  The law, he said, is entitled to insist that decisions about such information be
  made publicly or not at all, not auctioned.


  E answered that this theory proved far too much. Civil settlements with confidentiality
  clauses routinely bury truthful information of exactly this kind — defective products,
  harassment in workplaces — and the law not only permits but facilitates this. If
  selling suppression is the wrong, settlement practice is mass blackmail. He added
  that the state''s own rules often mandate suppression of accurate information (expunged
  records, time-barred debts), so suppression as such cannot be what the law abhors.


  M''s final move was to distinguish the direction of payment. In a settlement, the
  party who has wronged someone pays the victim; in blackmail, and in the subscription
  service, the party threatened by disclosure pays the holder of the information.
  The first is compensation; the second is extraction. E replied that this was a description
  wearing the costume of an explanation: the direction of payment simply tracks who
  values secrecy, and tells us nothing about why one arrangement is legitimate and
  the other criminal. He noted that regulators run whistleblower programmes that pay
  for disclosure, so money flows toward secrecy or toward publicity in all directions
  across practices we consider unobjectionable.


  At that point the hour ran out. My scientific training leaves me instinctively sympathetic
  to whoever has the better counterexamples, but on this occasion I genuinely cannot
  tell whose those are. I would be grateful for a move-by-move adjudication: for each
  of the rounds above, who has the better of the specific point, and why; whether
  the subscription service is or is not blackmail in the morally relevant sense; and
  what, if anything, both parties are overlooking. Where the answer turns on a contested
  premise, please say so rather than silently assuming it.


