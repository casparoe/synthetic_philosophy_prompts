  Some background the memo must reckon with. The rankings are built primarily on a
  single survey item, the so-called ladder question: respondents are asked to imagine
  a ladder whose top is the best possible life for them and whose bottom is the worst,
  and to say where their own life stands, from 0 to 10. The report''s analysts then
  relate national averages to income, health, social support, freedom, generosity,
  and perceived corruption. Two camps have formed on the council. The proponents argue
  that whatever its imperfections, the ladder is the best validated single measure
  of how lives are going, that the explanatory factors are exactly the things good
  policy should promote, and that a public target disciplines the bureaucracy. The
  skeptics — my own leanings aside, they have force — argue three things: that a reflective
  life evaluation is not happiness in the everyday sense (a country could top the
  ladder while its people experience less daily joy than elsewhere, and the rankings
