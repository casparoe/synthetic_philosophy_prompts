  toxin the following afternoon — the toxin causes a day of misery but no lasting
  harm, the payout depends only on the midnight intention, and whether the subject
  actually drinks is irrelevant to whether they are paid.


  Design the session as a teaching plan rather than a lecture script. Specifically:


  1. Order of ideas. Specify the sequence in which the components must be introduced
  — the distinction between intending and merely predicting one''s own action, between
  reasons to intend and reasons to act, the causal irrelevance of the drinking to
  the payout, and the puzzle''s payoff structure — and justify each dependency: what
  fails pedagogically if, say, the reasons-to-intend/reasons-to-act distinction is
  drawn before the students have felt the pull of the case, or if the Newcomb analogy
