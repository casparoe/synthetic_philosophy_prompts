  \ the other says no — there's a difference between learning \"it looked green\"\
  \ with certainty and shifting your credence in green directly. Also rigidity/commutativity\
  \ issues: order of updates matters; Jeffrey updates don't commute; also the \"evidential\
  \ import\" problem — becoming confident of E for bad reasons. Good material for\
  \ an adjudication prompt without needing citations.\n\nLet me construct a concrete\
  \ scenario: Two colleagues tracking whether a package will arrive / whether a patient\
  \ has a disease given an unreliable test where even the test result is observed\
  \ under uncertainty. Classic Jeffrey case: observing a result under dim light.\n\
  \nScenario: A clinic uses a rapid test; the technician reads the strip in bad lighting\
  \ and reports being 70% sure the line appeared (positive). Friend A says: treat\
  \ this as uncertain evidence and Jeffrey-update: new P(disease) = 0.7·P(disease|positive)\
  \ + 0.3·P(disease|negative). Friend B says: you can't just plug in the 0.7 — the\
  \ relevant evidence is the proposition \"the tech is 70% confident,\" which itself\
  \ should be used in a standard Bayesian update (update on the certain proposition\
  \ that the tech reported 70% confidence). A replies that this is the well-known\
  \ objection, but that updating on \"the tech said 70%\" double-counts or requires\
  \ a likelihood for the report, which we don't have; Jeffrey is designed exactly\
  \ for when evidence doesn't come as a certitude. B counters with the rigidity problem:\
  \ Jeffrey assumes P(disease|positive) stays fixed, but learning that the observation\
  \ was made in bad lighting should also change those conditionals, so the update\
  \ is under-described. Also could add a round about order-dependence (two successive\
  \ Jeffrey updates don't commute).\n\nI should keep numbers simple and correct. Let\
  \ me set up: prior P(D)=0.1, test sensitivity 0.9, specificity 0.8 (so P(+|D)=0.9,\
