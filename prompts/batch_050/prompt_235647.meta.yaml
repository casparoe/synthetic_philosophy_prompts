  \ ≈ 0.0137. Jeffrey with q=0.7: 0.7·(1/3)+0.3·(1/73) ≈ 0.2333+0.0041 ≈ 0.237.\n\n\
  I don't need to include full numbers in the prompt — the adjudication is conceptual.\
