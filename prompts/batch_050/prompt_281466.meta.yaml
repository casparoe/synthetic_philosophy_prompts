  Option: man of his time defence. Argument: (1) We can only blame people for what
  they could have known was wrong. (2) Whether someone could have known depends on
  what was knowable given the moral consensus of their era... leads to conclusion
  that no one can ever be blamed for anything once their era endorses it — e.g., a
  Nazi guard, or even us. Could prove too much: it excuses literally everyone, including
  people whose cruelty was condemned by contemporaries (e.g., critics of slavery existed).
  Subtle flaw: slide from "moral knowledge was unavailable" to "belief was widespread"
  — equivocation between epistemic accessibility and sociological prevalence; also
  internal critics. Good.


  Alternatively honor cultures: argument that dignity culture is morally superior:
  (1) moral worth of a person shouldn''t depend on others'' opinions; (2) honor culture
  makes worth depend on reputation... but then it proves too much: dignity culture''s
  reliance on third parties/courts also makes worth depend on institutions; also victimhood
  culture critique... The argument could prove that any reliance on external validation
  is bad, which would condemn all cultures including the legal system.


  I think the historical figures one is cleaner. Let me write the argument.


  Argument draft (proves too much):


  My roommate''s argument that we can''t judge any historical figure:

  1. It''s unfair to blame someone for failing to act on a moral truth they couldn''t
  have known.

  2. A person can only know a moral truth if it was accessible to them — if the evidence/reasons
  for it were available in their environment.

  3. In Jefferson''s time, the claim that owning people is gravely wrong was accessible
  (he said things himself, there were abolitionists, etc.) — actually to make it prove
  too much we want the opposite.


  Better structure: argument designed to acquit Jefferson but which also acquits everyone:


  1. You can only be blamed for what you could reasonably have been expected to recognize
  as wrong.

  2. What you could reasonably be expected to recognize is fixed by the best moral
  reasoning available in your time and place (man of his time).

  3. Therefore anyone whose society''s best available reasoning didn''t condemn their
  conduct is blameless.

  4. But every atrocity in history was defended by what passed for the best available
  reasoning somewhere — slaveholders had pro-slavery intellectuals, etc.

  5. So no historical wrongdoer is ever blameworthy — not Jefferson, not anyone worse.

  6. Also applies to us: future generations can''t blame us.

  Conclusion roommate draws: moral judgment of the past is pointless.


  Where''s the flaw? Step 2: equivocation — "available" can mean "someone somewhere
  had articulated it" (in which case antislavery arguments were available to Jefferson
  — he himself wrote against slavery) vs. "it was the consensus / what a reasonable
  person of the time would conclude." Under the strong reading premise 2 acquits almost
  nobody (Jefferson fails since he knew); under the weak reading it acquits everyone.
  Also premise 4 is dubious: "best available reasoning" defended it — actually the
  best reasoning didn''t; the dominant rationalizations did. Subtle flaw: slide between
  what reasoning was available and what reasoning was best/most persuasive. Good —
  that''s a genuine equivocation.


