  Is there a name for this? In the preface to Ecce Homo Nietzsche writes: "I am a
  disciple of the philosopher Dionysus, and I would prefer to be even a satyr than
  a saint." Then later in that same book he spends a whole chapter insisting that
  questions of nutrition, climate, digestion and recreation matter more for philosophy
  than everything people had previously treated as important -- he even blames German
  intellectual heaviness partly on German cooking.


  I keep noticing the general move here and I don''t know what to call it. Examples:
  a friend of mine insists his pessimistic phase last year was really just chronic
  bad sleep; a historian on a podcast explained the spread of ascetic ideals in late
  antiquity as mass malnutrition doing the work; Nietzsche treating his own book-writing
  as basically a function of dry air and giving up coffee. In each case something
  we usually treat as spiritual/intellectual/moral gets redescribed as the output
  of a bodily condition.


  It''s not plain materialism -- nobody is denying that ideas exist or making a metaphysical
  claim. And I don''t think it''s the genetic fallacy either, because Nietzsche at
  least doesn''t think showing the bodily origin refutes the ideas; he seems to think
  knowing the origin is part of understanding them properly. So what is this move
  called? If it has an established name, how does it differ from reductive explanation
  generally and from debunking genealogy? If it doesn''t, coin one and give me the
  edges: does it count if the bodily cause is offered as only a partial explanation?
  Does it matter whether its a temporary state (bad sleep) or a constitution? Does
