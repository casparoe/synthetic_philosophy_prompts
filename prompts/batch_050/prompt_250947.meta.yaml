  value (small chance of crossing threshold × huge stakes), complicity, collective
  obligation views. Genuine tension. Another: (b) bundles meat and voting but the
  structures differ — voting has threshold discontinuity, meat markets too actually.
  Hmm.


  Apparent tension that dissolves: (a) vs (b) look directly contradictory but aren''t
