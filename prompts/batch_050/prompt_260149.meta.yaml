reasoning_summary: 'Pick domain and type. Options: speech acts, judgment aggregation/discursive
  dilemma, epistemic dependence on AI, Bertrand''s paradox, pacifism.


  The "analyze a real historical episode through a theory" type fits judgment aggregation
  well — e.g., a court case, or... Actually the discursive dilemma: a famous real
  episode? The classic example is a three-judge court deciding liability (premises:
  contract valid, harm caused; conclusion: liable). That''s actually the original
  doctrinal paradox illustration (Kornhauser & Sager). Could ask the model to analyze
  a real episode — e.g., jury decisions, or the UK parliamentary vote on something.
  Or climate policy: IPCC? Or a real committee decision.


  Alternatively, classroom activity type fits judgment aggregation brilliantly — a
  game where the class votes premise-by-premise vs conclusion and gets different results.
  That''s very runnable and makes participants feel the discursive dilemma. This combines
  well.


  Also speech acts: activity making people feel performatives — harder.


  Let me design: seminar on social choice theory / philosophy of law, ~14 students,
  75 minutes. Game: class acts as a appellate panel (or corporate board) deciding
  a case with multi-premise doctrine. Round 1: vote on conclusion directly (outcome-based).
  Round 2: vote premise by premise (reason-based). Get contradictory results. Then
  escalate: hidden profiles, strategic voting — some voters flip their premise votes
  to manipulate the conclusion. Debrief maps to premise-based vs conclusion-based
  procedures, the discursive dilemma, majority inconsistency, strategic manipulation.


  Make it richer: the case should be constructed so participants feel the pull of
  both procedures. Use a legal-ish case: a tenant suing landlord; doctrine says liable
  iff (a) there was a duty to repair and (b) breach caused harm. Or a fictional university
  honour-code tribunal. Actually a court setting is classic (doctrinal paradox). Let
  me write a staged moot: "fictional but realistic."


  Include: no lecture up front; debrief; predictable problems (students cottoning
  on, ties with even numbers, someone refusing to vote); what activity can''t reproduce
  (the aggregation is over many voters with distributed info — small group discussion
  leaks; real courts have collegial deliberation; also can''t reproduce the normative
  weight of doctrine).


  Write casually, British English, one-to-three paragraphs, a typo or two maybe.


  Also add seeding: "I''ve been reading about the discursive dilemma (List & Pettit...)".
  Careful with attributions — List and Pettit is safe common knowledge. Don''t quote.
  Fine to name.


  Setting details: graduate seminar on political philosophy/legal theory, 14 students,
  75 minutes. Ask for roles, timeline, debrief, predictable failures, honest note
  on what it can''t capture.


  Write 2-3 paragraphs, casual.'
