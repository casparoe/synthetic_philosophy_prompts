  HCH (Humans Consulting HCH) is a rationalist-adjacent concept (Paul Christiano,
  factored cognition). That fits the rationalist reader persona well. A role-play
  could work: play a skeptical referee of factored cognition idealization. Or a commitments-check:
  asker lists beliefs about HCH, e.g., (a) HCH converges to the human''s reflective
  judgment, (b) amplification preserves alignment, (c) decomposition is neutral, (d)
  humans can verify steps... Tensions: e.g., if the human at the root can only verify
  small steps but each step''s output depends on sub-answers they can''t check, then
  "verification" at each node doesn''t compose to global verification — tension between
  local-checkability and global reliability claims.


  Type: "State a set of one''s own commitments and ask whether they hang together"
  seems best — rationalist-reader style, and allows injecting nuance.


  Let me construct the commitments carefully with one or two genuine non-obvious tensions
  and one apparent tension that dissolves.


  HCH: a human answers questions with access to copies of itself answering subquestions.
  Factored cognition hypothesis: cognition can be decomposed into small tasks. Iterated
  amplification: train model to imitate amplified human.


  Candidate commitments:

  1. Factored cognition hypothesis: most cognitively demanding tasks can be decomposed
  into subtasks a human can do in, say, 15 minutes, with composition recovering the
  original performance.

  2. HCH with bounded depth/time is a good idealization of human deliberation: what
  an HCH tree computes is what the human at the root would judge after ideal deliberation
  (approximates "reflective equilibrium").

  3. The amplification procedure is alignment-preserving: if the human is aligned,
  the distilled agent trained to imitate HCH is aligned (no systematic drift).

  4. At each node, the human can reliably verify/integrate the answers from subcalls
  — local checkability.

  5. HCH-style amplification can produce an agent that surpasses unaided human ability
  (superhuman performance on e.g. proving theorems).


  Genuine tensions:

  - (2) vs (1)+(4): HCH trees are exponentially deep/large; the root human''s "ideal
  deliberation" includes judgments that resist decomposition — e.g., taste/implicit
  knowledge. If some judgments are holistic (can''t be decomposed without loss), then
  factored cognition fails for exactly the judgments where alignment matters most.
  Actually a classic tension: decomposition may not preserve tacit knowledge.

  - (3) vs (5): to be superhuman, the tree must compute something the human couldn''t
  verify; local checkability (4) doesn''t compose — errors at depth may be invisible
  at the root because the root only sees summary answers. So (3)''s "no drift" conflicts
  with (5)''s superhuman: either the human can check everything (capping at human-level-ish)
  or can''t (drift possible). That''s a genuine tension: verification vs capability
  gains. This is like the "capability amplification vs alignment amplification" debate
  (Christiano vs critics like "approval-directed agents", or the argument that imitation
  of HCH caps performance).


  Actually more precisely: (3) alignment-preservation via imitation of amplified human,
  (5) superhuman performance. The tension: an imitation of HCH can''t outperform HCH;
  and HCH itself is bounded by what the human can orchestrate. There''s a known critique:
  distillation step introduces errors; iterated amplification compounds. Also known:
  "the alignment of amplification depends on the human''s ability to oversee, but
  oversight of superhuman reasoning is exactly what''s hard."


  - (2) vs the practical version: HCH idealization treats the human as fixed and consistent
  across exponentially many copies; real deliberation involves learning/updating over
  time — a tree of copies that can''t learn from each other sideways doesn''t idealize
  sequential deliberation where later judgments are informed by earlier exploration.
  That''s a genuine tension: HCH is a fixed-point/tree structure; actual deliberation
  is path-dependent and self-modifying. If you think ideal deliberation includes changing
  your mind in light of your own earlier reasoning, HCH as defined (static copies,
  single question) may not capture it. Hmm, this might be too in-the-weeds but it''s
  good.


  Apparent tension that dissolves:

  - (1) decomposition into 15-minute tasks vs tasks requiring long context (e.g.,
  writing a novel): seems like tension, but dissolves because subcalls can pass summaries/context
  — the tree itself holds the state; no single node needs the whole context. So apparent
  tension between bounded node capacity and long-horizon coherence dissolves via message
  passing.


  Also maybe include: "I think HCH''s infinite limit (countably deep) is meaningful
  as an ideal object" vs finitism? No, keep within HCH domain.


  Also could add commitment: "the base human in HCH need not know how the decomposition
  works; the same fixed human policy suffices" — tension with the fact that humans
  learn to use the tool over time.


  Let me pick 5 commitments:


  (a) Factored cognition hypothesis is roughly right: for almost any cognitive task,
  there exists a decomposition into subtasks each performable by a competent human
  in under an hour, such that composing answers reproduces expert performance.


  (b) The infinite-depth limit of HCH is a good idealization of a particular human''s
  fully considered judgment — i.e., "what I would say if I thought about it arbitrarily
  long."


  (c) Imitating HCH (iterated amplification/distillation) preserves alignment: because
  each step is just learning to match the human-plus-consultants, no misaligned optimization
  enters.


  (d) Amplified systems built this way can substantially outperform unaided humans
  — that''s the point of the project.


  (e) The human at each node doesn''t need to understand the global problem; local
  competence plus message-passing suffices.


  Tensions:

  - (b) vs (a): if the human''s considered judgment involves tacit/holistic evaluation,
  decomposition may change the answer; "what I''d say if I thought arbitrarily long"
  is defined by sequential, path-dependent deliberation, not a tree of frozen copies.
  Genuine.

  - (c) vs (d): preserving alignment via matching HCH caps you at HCH''s level; but
  to outperform humans you need HCH itself to outperform the human — which requires
  the human to reliably orchestrate reasoning they cannot themselves check. Local
  checkability doesn''t compose: small per-node error rates compound across exponentially
  many nodes. So (c)''s "no misaligned optimization enters" is compatible with benign
  drift that breaks (d), or (d) achieved through capabilities the human can''t verify,
  breaking (c). Genuine.

  - (e) vs (b): apparent — the claim that no node needs global understanding seems
  to conflict with idealized judgment requiring global coherence; dissolves because
  the tree''s structure carries the global state; the root integrates. So apparent
  only.


