  delight when another person enters into our joys and griefs, we are wounded when
  they cannot, and he compares this concord of minds to musical instruments keeping
  time with one another. In Part III he extends the thought inward, describing how
  each of us learns to view our own conduct through the eyes of an imagined impartial
  spectator, moderating our passions toward the pitch that such a spectator could
  go along with, while the spectator in turn strains toward feeling what we feel.


