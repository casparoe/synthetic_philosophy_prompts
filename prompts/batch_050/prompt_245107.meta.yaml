  ---


  I am a software engineer without formal philosophy training, and I have been in
  a long-running argument with a colleague about capital punishment. We recently both
  read John Stuart Mill''s 1868 speech to the House of Commons, "Speech in Favor of
  Capital Punishment," and we fixated on this passage:


  "For it is characteristic of all punishments which depend on duration for their
  efficacy—all, therefore, which are not corporal or pecuniary—that they are more
  rigorous than they seem; while it is, on the contrary, one of the strongest recommendations
  a punishment can have, that it should seem more rigorous than it is; for its practical
  power depends far less on what it is than on what it seems."


  To me this reads like optimizing a deterrent system for perceived rather than actual
  cost — in my world we would call it a dark pattern, and I suspect it has a failure
  mode: if the public learns that death is in fact the lesser suffering, the deterrent
  effect should collapse, so the justification seems to depend on maintaining a public
  misperception. My colleague thinks I''m over-reading a rhetorical flourish and that
  the argument is simply about using the impression a punishment makes efficiently.
  Rather than keep arguing, we want to run an adversarial collaboration. Draft the
  joint statement we should produce, where Position A is a Mill-style deterrence-based
  case for retaining the death penalty for aggravated murder proven by conclusive
  evidence, and Position B is an abolitionist case that concedes some murderers deserve
  to die but holds that the risk of executing the innocent and the uncertain marginal
  deterrence over life imprisonment make abolition the right policy.


  Structure it as: (1) a numbered list of claims both sides can sign, including an
  agreed, neutral interpretation of what the passage claims; (2) a table of residual
  disagreements, each phrased precisely enough that both of us would accept the wording
  of our own position — flag any disagreement that turns out to be verbal rather than
  substantive; (3) the cruxes: the sub-questions whose resolution would move at least
  one of us. I expect these to include whether Mill''s "seems rather than is" principle
  survives public transparency about penal severity, and how to weigh wrongful executions
  against uncertain deterrent gains; include at least one crux I haven''t anticipated.
  For each crux, specify a piece of evidence or a concrete case we both agree bears
  on it, and record in advance what each of us predicts about it.


  Throughout, separate what is actually settled (historical, empirical, or conceptual)
  from what remains genuinely contested among informed people, and mark any point
  where either of us has been presenting a contested claim as if it were consensus.


