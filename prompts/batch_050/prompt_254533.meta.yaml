  The causal exclusion argument is a classic "seems to prove too much" argument: (1)
  every physical effect has a sufficient physical cause; (2) mental causes are distinct
  from physical causes; (3) so mental causes would overdetermine/exclude; therefore
  mental events cause nothing. That seems to prove that the feeling of pain never
  causes you to wince. Ask which premise to reject.


  Let me construct an argument with numbered premises. The classic exclusion argument
  (Kim):


  1. Causal closure: every physical event that has a cause at time t has a sufficient
  physical cause at t.

  2. Causal exclusion: if an event has a sufficient physical cause, no distinct cause
  is needed (no systematic overdetermination).

  3. Mental properties/events are not identical to physical ones (anti-reductionism
  / multiple realizability).

  4. So mental events never cause physical events.

  5. But clearly my desire for coffee caused me to reach for the cup. Contradiction.
  Conclusion: mental causation is an illusion (epiphenomenalism).


  Then ask where it goes wrong, and price the options: identity theory (rejecting
  3 costs multiple realizability), rejecting closure (costs the success of physics),
  overdetermination acceptance, compatibilist solutions (causal exclusion only threatens
  if causes are distinct and non-supervenient), counterfactual theories of causation,
  proportionality (Woodward), etc.


