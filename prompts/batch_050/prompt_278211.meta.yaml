  Types: Rank/rate; compare two ideas; construct a thought experiment.


  The Four-Seven debate is well-documented enough (Yi Hwang/Toegye vs Yi I/Yulgok,
  four sprouts of Mencius, seven emotions, ki and li). A thought experiment for that?
  Hmm, the construct-a-thought-experiment type is attractive because it injects a
  niche scenario into the prompt, which is what makes prompts non-regurgitatable.
  But the thought experiment type examples require theories giving specified verdicts.


  For the Chinese Room: construct a thought experiment to specifications — e.g., build
  a variant where the systems reply and robot reply both fail but understanding still
  seems present? Or where Searle''s intuition pump goes through but a functionalist
  can accept it? That''s doable.


  For Ubuntu: construct a scenario where a relational conception of personhood gives
  a different verdict than an individualist one — e.g., degrees of personhood based
  on community relations. That''s a classic setup; might be too standard.


  Four-Seven debate: the debate is about whether the Four (moral sprouts) and Seven
  (ordinary emotions) have different origins in li (principle) and ki (material force).
  Toegye: Four are issuance of li, Seven of ki. A thought experiment: construct a
  scenario of a single emotional episode that Toegye and Yulgok would analyze differently,
  where the verdicts diverge in a testable way. That''s nice and niche but LLMs know
  the Four-Seven debate reasonably well.


  Berkeley on money: Berkeley''s Querist — money as a ticket/counter, sign, not valuable
  in itself; nationalism of money. Comparing Berkeley''s view of money with... Locke''s
  metallist view? That''s a compare-two-ideas prompt: "Compare Berkeley''s and Locke''s
  views of money — who is closer to modern fiat money?" Hmm.


  Type options: Rank/rate, compare two, construct thought experiment. Pick whichever
  combines best.


  I like the Four-Seven + thought experiment combo: "Construct a single emotional
  episode..." Actually the type notes say the asker wants specified theories delivering
  specified verdicts. E.g.: "Build a case where Yulgok and Toegye would classify the
  same emotion differently — specifically one emotion that Toegye must count among
  the Seven but that looks like one of the Four in its content..." Hmm, or the reverse:
  an emotion with obviously moral content arising from clearly ki-driven circumstances.


  Alternatively, Chinese Room + rank/rate: "Rank the standard replies to the Chinese
  Room (systems, robot, brain-simulator, combination, other-minds, intuition) by how
  much they''d move someone who grants the setup..." That''s okay but somewhat standard.


  Aesthetic testimony + thought experiment: build a case where accepting testimony
  about beauty seems warranted but the acquaintance principle is violated; or where
  pessimism vs optimism about aesthetic testimony diverge. E.g., "Construct a case
  where an optimist and pessimist about aesthetic testimony deliver different verdicts,
  no fictional details like perfect critics..." Hmm.


  Actually I think the strongest is Four-Seven debate thought experiment, because
  the dataset author wants "in the weeds" content. The Four-Seven debate: Mencius''
  four sprouts (compassion → benevolence/ren, shame/dislike → righteousness, deference
  → propriety, approval/disapproval → wisdom) vs seven emotions (joy, anger, sorrow,
  fear, love, hate, desire). Toegye (Yi Hwang) argued Four issue from li, Seven from
  ki (mutual issuance thesis: li and ki both issue, but Four are "issuance of li with
  ki following," Seven are "issuance of ki with li riding"). Yulgok (Yi I) argued
  ki issues and li rides in both cases; the Four/Seven distinction is just about purity/degree,
  not different origins (ki-bal-li-seung, 氣發理乘). Actually both agree that li never
  acts on its own (li is inert, only ki moves); the debate is subtle: Toegye''s "mutual
  issuance" (li-ki hobal, 理氣互發) vs Yulgok''s "ki issues, li rides" (gibal-liseung,
  氣發理乘).


  A thought experiment to specs: construct a single emotional episode that forces
  the disagreement into the open — where Toegye''s account requires saying li issued
  it but Yulgok says it''s just ki, or where the classification flips. Specs: ordinary
  life, not a sage, one paragraph, then walk through both analyses, identify which
  feature does the work.


  But wait: the prompt is for a model that can''t search. Four-Seven debate is niche-ish
  but LLMs with decent training know Toegye and Yulgok and the basic positions. The
  instructions say avoid super niche theories LLMs won''t have memorized, but "inject
  some new/niche ideas into the prompt." I can include enough in the prompt itself
  to make it self-contained: briefly stipulate the positions. That helps small models
  too.


  Alternative: Chinese Room thought experiment — well known, less risk of the model
  not knowing. But more regurgitatable; the constraints make it fresh. E.g.: "Construct
  a variant of the Chinese Room where Searle''s own conclusion (syntax isn''t sufficient
  for semantics) comes out true but his intended target changes: the person inside
  DOES understand but the system doesn''t..." Hmm, that''s like the reverse. Or: build
  a case where the systems reply succeeds intuitively — a scenario where we''d clearly
  attribute understanding to the whole system but not the person — which is basically
  what the systems reply says anyway.


  Let me go with the Four-Seven thought experiment. Draft:


  "Here''s a setup for a thought experiment I want built. In the Korean Four-Seven
  debate, Toegye held that the Four (Mencius'' moral sprouts like the pang of compassion)
  issue from principle/li while the Seven (ordinary emotions like anger, fear, desire)
  issue from material force/ki; Yulgok insisted that only ki ever issues anything
  and li merely rides along, so the Four are just the Seven at their purest. Construct
  a single emotional episode — ordinary modern life, one paragraph — that forces these
  two analyses to deliver clearly different verdicts about the same feeling, i.e.
  where Toegye is pushed to classify it one way and Yulgok the other. Then walk through
  both readings, say which feature of the episode is doing the work, and note how
  each philosopher would try to redescribe the case to escape the other''s classification."


  Check the type notes: "scenario plus demonstration that it meets each specification
  — the verdict each named theory gives and why — together with an honest note on
  which feature of the case does the work... and how a defender of the theory that
  comes out badly would attack the case." Good.


  Is the ask well-posed? The interesting cases: an emotion that is morally-laden but
  clearly triggered by self-interest/ki circumstances (e.g., outrage at being cheated
  — looks like the Four''s shame/dislike → righteousness, but driven by ki). Toegye
  must classify by origin (li vs ki issuance), not content, so mixed cases stress
  his view. Yulgok would say all emotions are ki-issued, Four are those aligned with
  li. So a case where content and origin come apart: compassion that arises from purely
  self-serving conditioning, or righteous anger that is indistinguishable phenomenologically
  from selfish rage. That forces divergence. Good, the prompt is coherent.


  Add constraint: "don''t let the character be a sage or a monster; an ordinary person."
  And: keep casual, maybe a typo or two. Should I include the brief gloss of positions?
  Yes — helps small models, and avoids relying on niche memorized details. Keep it
  short.


  Also add: "and end by telling me whether you think Toegye or Yulgok has the better
  escape route" — optional evaluative bit. Fine.


  Casual tone, maybe "in the weeds". Write it.


  One consideration: should names be included? Yi Hwang (Toegye) and Yi I (Yulgok)
  — I''m confident. Mencius'' four sprouts — confident. No quotes needed. Fine, no
  search needed.


  Draft final:


  "I''m playing around with the Korean Four-Seven debate and want a custom thought
  experiment. Quick recap so we''re on the same page: Toegye (Yi Hwang) held that
  the Four -- Mencius''s moral sprouts like the sudden alarm at a child about to fall
  in a well -- are issued by principle (li), while the Seven (joy, anger, sorrow,
  fear, love, hate, desire) are issued by material force (ki). Yulgok (Yi I) pushed
  back: only ki ever issues anything, li just rides along, so the Four are nothing
  but the Seven at their most li-aligned. Now: build me one emotional episode, ordinary
  modern life, one paragraph, where these two analyses give clearly different verdicts
  about what''s going on in the same feeling -- i.e. a case Toegye is pushed to classify
  as li-issued but that looks like a pure ki-job to Yulgok (or vice versa). No sages,
  no villains, just a normal person. Then walk me through both readings of the episode,
  say which feature of the case is doing the work (and what happens if you remove
  it), and finish with how each philosopher would try to redescribe the episode to
  dodge the other''s classification."


  Check length — fine. Casual. Has the required deliverables. No quotes. No citations.
  Good.'
