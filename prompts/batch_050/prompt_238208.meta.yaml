reasoning_summary: 'Let me pick a domain and type. Options: cognitive penetration,
  moral dilemmas, Hume on causation, nuclear deterrence, Kripkenstein rule-following.


  Type options: fair-summary audit, slogan precisification, credence decomposition.


  A good combination: Hume on causation with the fair-summary type — present a popular
  book''s summary of Hume on causation (including New Hume misrepresentation) and
  ask for audit. Or Kripkenstein with slogan type ("meaning is use" is taken in example).
  Or nuclear deterrence with credence type.


  Let me go with Hume on causation, Type 1 (fair summary audit). Write a plausible
  popular-philosophy summary with subtle misrepresentations: e.g., conflating Hume''s
  two definitions of cause (regularity vs. counterfactual), claiming Hume denied causation
  exists, presenting the New Hume reading as a refutation... The summary should be
  mostly right with one or two subtle errors, no howlers, in the voice of a competent
  popularizer. No quotes from real texts — I''ll paraphrase. No citations needed.


  Misrepresentations to embed:

  1. Conflating epistemic claim (we can''t know necessary connection) with ontological
  claim (there is no necessary connection) — the classic New Hume flashpoint.

  2. Presenting Hume''s two definitions of cause as inconsistent or as one definition
  — conflation.

  3. Claiming Hume "proved" causation is only constant conjunction — overstatement.

  4. Maybe attributing to Hume the claim that the future will resemble the past is
  uncertain — that''s induction, slightly out of place but could be included as scope
  creep.

  5. The "we get the idea of necessary connection from the impression of determination
  of the mind" — often glossed incorrectly.


  Also the summary could draw a conclusion: "so causation is just a habit of the mind,
  and science doesn''t discover causes at all" — ask whether that follows.


  Write in British English, formal/polished. No quotation marks from real texts; I
  can use quotation marks for the friend''s summary itself since it''s my own invented
  text — that''s fine, it''s not quoting a real author.


  Let me draft.


  Summary (attributed to an unnamed popular philosophy book):


  "Hume''s analysis of causation comes to this: when we look closely at any causal
  transaction — the billiard ball striking another — we find only three things: the
  cause precedes the effect, the two are contiguous, and events of the first kind
  are constantly followed by events of the second. There is no fourth element, no
  observable bond or power tying them together, and Hume concludes that there is no
  such bond in nature at all. The idea of necessary connection, on his account, is
  a projection: after repeated experience, the mind forms a habit of expecting the
  effect, and we mistake this feeling of determination within us for a connection
  between the objects themselves. Hence his famous definition of a cause as an object
  followed by another, where all objects similar to the first are followed by objects
  similar to the second. It follows that science, properly understood, never discovers
  causal relations; it only compiles regularities, and the causal language of physics
  is a convenient fiction. Hume thus anticipates the modern view that causation is
  a feature of our models rather than of the world."


  Issues embedded: (a) "concludes that there is no such bond in nature at all" — ontological
  overreach vs epistemic modesty (New Hume debate: Galen Strawson, Wright, Read &
  Richman); (b) presents only the regularity definition and omits the counterfactual
  definition, treating Hume as having one definition — actually two definitions, tension
  between them; (c) "It follows that science never discovers causal relations" — a
  conclusion drawn from the misreading; (d) "causation is a feature of our models
  rather than the world" — anachronistic projection onto Hume. Priority and contiguity:
  Hume did mention these. Also "projection" gloss is roughly right for the internal
  impression source.


  Ask: go sentence by sentence / claim by claim, say what a Hume scholar would accept,
  what they''d object to, how the two definitions complicate, how the New Hume debate
  bears, and whether the final inference about science follows.


  British English: "sceptical", "realise", "organised", "analyse", "programme".


  Format: one prompt, formal. Keep it reasonably concise but rich.'
