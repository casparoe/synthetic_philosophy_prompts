  \nMake the student's answer right about visible stuff: defines color phi, defines\
  \ both hypotheses, notes Dennett uses it to argue against Cartesian theater. Subtle\
  \ errors: (1) swaps which revision is pre/post (or describes Stalinesque as memory\
  \ tampering — no: Stalinesque is show-trial fabrication in the pre-conscious processing,\
