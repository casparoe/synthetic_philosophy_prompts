  someone keeping a promise to a stranger. Or the reverse: an argument that the "one
  thought too many" objection is empty because any motive can be redescribed.


  Let me draft an argument with numbered steps where there''s a subtle flaw — maybe
  an equivocation between "thinking about a moral principle while acting" and "being
  motivated by the principle rather than the person," or a scope shift between the
  thought being present and the thought being justifying.


  Argument draft (proving too much):

  (1) Williams: if a man saves his wife rather than a stranger, and does so because
  he thinks "in situations like this it''s permissible to save one''s wife," he''s
  had one thought too many — the justification should be provided by the relationship
  itself.

  (2) What matters is the structure: a deliberative detour through an impersonal principle
  where the personal reason should have sufficed.

  (3) But that detour is present whenever anyone checks their action against any rule
  before acting.

  (4) A surgeon who checks the dosage chart before administering, a pilot running
  the checklist, a firefighter following triage order rather than rushing to the person
  she knows — all take the detour.

  (5) So all of them have one thought too many.

  (6) But surely checklists and triage are exactly where we want the detour.

  (7) So Williams''s objection condemns all rule-following, or it''s empty — either
  it proves too much or nothing.


  Where does it go wrong? Possible diagnoses: equivocation between the principle doing
  the motivating/justifying work vs. merely being consulted; in Williams''s case the
  complaint is that the moral principle is what makes saving the wife permissible
  (the justification runs through impartial morality), whereas the checklist doesn''t
  justify the pilot''s caring about passengers — it''s instrumental to a motive that''s
  already in place. Also the difference between first-order motivation and second-order
  endorsement. A good answer would distinguish "the thought that it''s permissible"
  as the load-bearing justification vs. rules as tools serving an independently grounded
  motive.


