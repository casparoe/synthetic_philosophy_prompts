  religion specifically the "everlasting check". (4) The definition point: Hume''s
  "transgression of a law of nature by a particular volition of the Deity" — the summary
  could drop the divine volition part, which matters for the circularity debate. Also
  the common claim that Hume''s argument is circular because laws of nature are defined
