  A good summary with subtle errors: "Hume defined a miracle as a violation of the
  laws of nature, and since laws of nature are established by uniform experience,
  a miracle is by definition something we have uniform experience against — so no
  testimony could ever make believing in a miracle rational, because the evidence
  for the law always outweighs the testimony. That''s why Hume concluded miracles
  are impossible and religion is irrational."


  Errors to embed: (1) Hume didn''t conclude miracles are impossible — he argued testimony
  can never establish them (epistemic, not metaphysical), and even allowed that if
  testimony were strong enough it would be a "miracle" of testimony vs miracle standoff;
  (2) the maxim about proportioning belief — wise man proportions belief to evidence;
  (3) the "ever" overstatement: Hume says testimony could in principle suffice but
  then you''d have a countervailing miracle... Actually Hume says no testimony is
  sufficient to establish a miracle unless the testimony''s falsehood would be more
