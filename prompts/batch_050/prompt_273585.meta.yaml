  \ holds exactly 1,000 birds and that exactly one of the following is true:\n\nH1:\
  \ 200 ravens, all of them black, and 800 other birds.\nH2: 900 ravens, of which\
  \ 890 black and 10 white, and 100 other birds.\n\nShe nets one bird at random from\
  \ the island's bird population, and it is a black raven. Does this observation confirm\
  \ or disconfirm the proposition that all of the island's ravens are black, relative\
  \ to these two alternatives? What does the case show about the adequacy of the simple\
