  \ answer.\n\n(a) The paradox is generated by two principles. The first is Nicod's\
  \ criterion: a generalization of the form \"all Fs are Gs\" is confirmed by its\
  \ instances, that is, by objects that are both F and G. The second is the equivalence\
  \ condition: evidence that confirms a hypothesis confirms any hypothesis logically\
  \ equivalent to it. Now \"all ravens are black\" is logically equivalent to its\
  \ contrapositive, \"all non-black things are non-ravens.\" A white shoe is a non-black\
  \ thing that is not a raven, hence an instance of the contrapositive; by Nicod's\
  \ criterion it confirms the contrapositive, and by the equivalence condition it\
  \ confirms H. This is absurd, since ornithologists do not study ravens by examining\
  \ footwear.\n\n(b) The Bayesian response is to accept the conclusion but drain it\
  \ of content. Confirmation is a matter of degree, fixed by Bayes's theorem, and\
  \ the shoe's confirmation is negligible. Roughly, when a randomly sampled object\
  \ turns out to be a black raven, one of the relatively few ravens that might have\
  \ falsified H has failed to do so; when a randomly sampled object turns out to be\
  \ a non-black non-raven, one of the astronomically many non-black objects that might\
  \ have been a raven has failed to be one. The degrees of confirmation stand in inverse\
  \ ratio to the sizes of these classes: if non-black objects outnumber ravens by\
  \ a factor of a million, the raven confirms exactly a million times as much as the\
