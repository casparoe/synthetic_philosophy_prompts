  Let me do "Counterpart theory vs. transworld identity" with the "prove too much"
  type. As a novelist — a novelist building alternate versions of a character across
  drafts/sequels is a nice hook: same character in different drafts — counterpart
  theory naturally maps. The argument: Lewis''s counterpart theory plus the novelist''s
  practice seems to prove that my character in draft 2 is not the same character,
  hence killing him in book 2 isn''t killing "him"... something like that.


  Construct an argument that proves too much: maybe arguing that since any character
  could have been different in infinitely many ways, there''s no fact of the matter
  which character in the sequel is the original — so sequels are impossible/fan fiction
  is metaphysically incoherent, absurd conclusion.


  Let me draft premises:


  (1) A character across drafts is the same character only if the drafts are about
  the same individual.

  (2) Which individual a draft is about is fixed by which counterpart relation we
  use — similarity in some respects.

  (3) Similarity respects are up to the author; there''s no intrinsic fact.

  (4) So any character in book 2 equally counts as "the same" as the book-1 protagonist
  given a charitable similarity standard.

  (5) So the mysterious stranger who turns out to be the hero is no more the hero
  than the villain is.

  (6) But novels can have genuine reveals/continuations. Contradiction.


  Better: build on Lewis''s own Humphrey objection. Classic: Hubert Humphrey "with
  five fingers on the left hand" — counterpart theory says Humphrey might have had
  five fingers because a counterpart does. The objection: Humphrey himself doesn''t
  have five fingers.


  Novelist angle: "I write novels; in my sequel my detective does things the original
  never would. A philosopher friend says by Lewis''s counterpart theory my sequel
  character literally is a counterpart, so ''he might have betrayed his partner''
  is true, etc. Here''s an argument that seems to show my character can''t do anything
  other than what he actually does in my books..."


  A good too-much argument for counterpart theory: the grounding problem for counterpart
  relations — any object has counterparts in any world under some similarity relation,
  so every modal claim comes out true, and if similarity respects must be restricted,
  counterpart theory collapses into transworld identity by stipulation. Let me number
  it:


  (1) According to counterpart theory, "Possibly, my detective murders his partner"
  is true iff some world contains a counterpart of him who murders.

  (2) What counts as a counterpart is determined by a similarity relation, and which
  respects of similarity matter is set by context/interest, not by the object itself.

  (3) For any thing and any property, there''s some similarity relation under which
  a thing with that property counts as its counterpart — even a teacup resembles my
  detective in being spatiotemporal, made of matter, etc.

  (4) So "possibly my detective is a teacup" comes out true.

  (5) If every modal claim comes out true, counterpart theory is useless for fiction-writing
  (everything my character could do, he does somewhere).

  (6) Conclusion: either counterpart theory proves everything possible (too much),
  or we smuggle in essential properties — but then we''ve just rebuilt transworld
  identity with extra steps, and essences are exactly what Lewis wanted to avoid.


  Ask: which step do you reject and what does it cost? The novelist wants to keep
  (1)''s usefulness for talking about drafts. Real flaw: step (3) — context restricts
  counterpart relations, and "relevance" isn''t arbitrary; but pricing: Lewis accepts
  context-dependence, Humphrey objection, etc. Don''t signal the answer.


