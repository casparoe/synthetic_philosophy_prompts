  conceptual skeleton intact — and the creative act consists in sensing which knobs
  may slip, and how far, in a given situation. (i) Explain this ''knob-twiddling''
  model and contrast it with the romantic picture of creativity as ex nihilo invention.
  (ii) Illustrate the model with one example of a recognized creative achievement,
  identifying the theme, the knobs, and the twiddling. (iii) Critics object that the
  model can account only for incremental novelty and cannot explain genuinely revolutionary
  creativity — paradigm shifts, radical breaks, jumping out of the system. Does the
  model have the resources to answer this objection? Defend your answer."


