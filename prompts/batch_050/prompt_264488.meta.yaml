  \ across cases — generalized vs particularized. Good: that gives material.\n\nAlso\
  \ a borderline case: \"If you mow my lawn, I'll give you ten dollars\" — Grice discussed\
  \ whether \"if\" implicates... the implicature that payment only if mowing (conditional\
  \ perfection / biconditional reading). Is that implicature or semantic? Ask the\
  \ model to classify.\n\nStructure of prompt: role assignment (\"act as a philosopher\
  \ of language with expertise in pragmatics\"), list of verdicts, ask for a principle\
