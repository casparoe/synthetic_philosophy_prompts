  \ Cases of implicature, cancellability, generalized vs particularized, etc.\n\n\
  Let me construct cases:\n1. A: \"Is John a good philosopher?\" B: \"He's got beautiful\
  \ handwriting.\" — conveys John isn't a good philosopher. Standard Grice. Verdict:\
  \ B means John is a bad philosopher, though said nothing false.\n\n2. Letter of\
  \ recommendation: \"Dear Sir, Mr. X's command of English is excellent and his attendance\
  \ has been regular. Yours, etc.\" — same thing.\n\n3. \"I fell into a puddle and\
  \ some of the students got wet\" — implies not all. Generalized conversational implicature\
  \ via scalar. \n\n4. \"Some of the students came\" said by the professor who knows\
  \ exactly who came? Then no \"not all\" implicature, or cancelled. Context-dependence.\n\
  \n5. Irony case: \"Lovely weather\" during storm. Speaker means opposite. Is that\
  \ implicature? Grice treated irony as implicature via flouting Quality.\n\n6. \"\
  Can you pass the salt?\" — the request. Is the request an implicature or part of\
  \ meaning? It's conventionalized.\n\nTricky tension: the asker wants a principle\
  \ capturing which things are implicated vs said. Hard pair: verdict that \"some\"\
  \ implies \"not all\" in ordinary assertion, but verdict that in a logic exam \"\
  some\" doesn't imply \"not all\" — that suggests context-sensitivity; fine. Harder\
  \ tension: verdict that the recommendation letter writer implicated X is unfit —\
  \ but verdict that the same writer, if sued for defamation, is rightly judged to\
  \ have not said anything false. Both held: implicature is real meaning-communication\
  \ but not \"saying.\" That's actually Grice's distinction; not contradictory but\
  \ needs explaining.\n\nHard-to-reconcile pair: (a) \"Smith has been paying his rent\
  \ regularly lately\" (implies he wasn't before?) — no, let me use: (a) \"I broke\
  \ a finger yesterday\" — naturally implies own finger, but speaker could cancel\
  \ (\"mine, actually, is fine; I broke the surgeon's\"). (b) \"I slept in a car last\
  \ night\" implies not my car? Grice's example: \"I'm meeting a woman this evening\"\
  \ implies not wife/sister/close friend. These are generalized implicatures but cancelable.\n\
  \nGood tension candidate: the asker's verdict that \"Some students passed\" implies\
  \ not all, AND the verdict that a mathematician saying \"some primes are even\"\
  \ (knowing exactly one is) is being misleading rather than speaking truly-with-implicature...\
  \ hmm, is \"some primes are even\" true? One prime is even, so some are even — true,\
  \ but \"not all primes are even\" is also true, so implicature \"not all\" is actually\
  \ true here. That's a case where scalar implicature holds but... fine.\n\nAnother\
  \ tension: asker says implicatures can be cancelled without contradiction (\"Some\
  \ came — indeed, all of them\") and feels fine; but also feels that \"The letter-writer\
  \ conveyed that X is a poor candidate, but I don't mean to suggest anything about\
