  \ cases. Keep it fairly short — but cases need concreteness, so moderate length.\
  \ No quotes from real texts needed. No citations needed. Write formally, American\
  \ English.\n\nCases list (with my verdicts):\n1. Letter of recommendation praising\
  \ only punctuality → conveys candidate is unfit; writer meant that; yet I also think\
  \ writer said nothing false.\n2. \"Some of the students passed\" → implies not all;\
  \ \"Some passed; in fact, all did\" is odd but not contradictory.\n3. \"I'm meeting\
  \ a woman this evening\" → implies not my wife/sister; but \"I broke a finger\"\
