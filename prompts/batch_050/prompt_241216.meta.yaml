  5. Normative pluralism: the diversity of foundations across people is itself evidence
  that there are multiple irreducible moral goods, and both sides are partially right.

  6. Process-level conclusion: the findings tell us nothing about which first-order
  views are true but a lot about which reasoning processes to distrust (rationalization,
  motivated reasoning), so the actionable takeaway is epistemic reform, not political
  updating.


