  genuine moral goods; conservatives'' richer palette tracks real values liberals
  miss.

  3. Genetic-fallacy quietism: descriptive psychology has no bearing on normative
  ethics; the findings are interesting but settle nothing.

  4. Symmetric debunking: intuitionism plus post-hoc reasoning debunks everyone''s
  moral confidence equally, favoring global skepticism/error-leaning views rather
