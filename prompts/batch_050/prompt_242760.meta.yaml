  them would force at least one side to revise. I expect candidates to include: whether
  a seeming can occur without the phenomenal property it seems to present (or whether
  this is the very point at issue and not a sub-question — argue for your classification);
  whether a complete, predictive science of consciousness-judgments — explaining in
  functional terms exactly why a system says and believes it is phenomenally conscious
