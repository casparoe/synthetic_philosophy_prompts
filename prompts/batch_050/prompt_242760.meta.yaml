  Keith Frankish, that experiences do not really have the qualitative, intrinsic,
  ineffable properties introspection seems to reveal: phenomenal consciousness is
  a kind of introspective illusion, and the work to be done is explaining why we judge
  that we have it (Frankish calls this the meta-problem). By phenomenal realism I
  mean the view that there is something it is like to be in certain states, that this
  what-it-is-like is real and not merely judged or represented to be there, and that
  explaining it is the hard problem, not to be dissolved by explaining our reports
  and intuitions. If you think either characterization is unfair to its side, fix
  it before proceeding and note the fix.


