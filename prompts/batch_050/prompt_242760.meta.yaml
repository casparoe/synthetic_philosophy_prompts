  at least one side was under temptation to deny.


  2. Disagreements (a table). State each residual disagreement in a single row: column
  one, the illusionist''s position phrased as the illusionist would insist it be phrased;
  column two, the realist''s likewise; column three, the weakest reading on which
  the two statements are still incompatible. Flag any row where you conclude the incompatibility
  is verbal — where each side is using a term (e.g., "experience," "seems," "real")
  differently — and say what the non-verbal residue is, if any.


