  Details I know about Gödel''s work on rotating universes:

  - 1949, "An Example of a New Type of Cosmological Solutions of Einstein''s Field
  Equations of Gravitation" (Reviews of Modern Physics) and the related essay "A Remark
  About the Relationship Between Relativity Theory and Idealistic Philosophy" in the
  Schilpp volume for Einstein''s 70th birthday (Albert Einstein: Philosopher-Scientist).

  - The Gödel metric: dust of constant density with rotation; cosmological constant
  negative (or equivalently positive pressure). Universe is not expanding, rotating.

  - The spacetime is homogeneous; no privileged time coordinate; every point can be
  reached from any other via a timelike/lightlike path; existence of closed timelike
  curves in the solution (Gödel showed there are no globally "time-oriented" foliations;
  any two points can be joined by a timelike curve going forward and backward...).

  - Gödel''s argument for the ideality/unreality of time: if in some physically possible
  worlds time fails to exist (no objective lapse of time), then time cannot be an
  essential feature of the universe in general; and since our universe differs only
  contingently, time in our universe is also merely a subjective/ideal feature — "if
  P is possible in worlds compatible with the laws of physics, then time as objective
  lapse cannot be part of the essence of spacetime." That''s the controversial step
