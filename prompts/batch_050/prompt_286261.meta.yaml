  Dorato) discuss whether the inference from "time is not well-defined in Gödel worlds"
  to "time is ideal in ours" follows. Earman argued it doesn''t — the non-rotation
  of our universe makes a difference.

  - Gödel''s computations: he estimated the feasibility of time travel along CTCs
  — the rocket fuel/energy required to travel into one''s own past (he gave figures
