  Kavka''s toxin puzzle: an eccentric billionaire offers a million dollars if at midnight
  you form the intention to drink a toxin at noon tomorrow, which causes pain but
  no death; you know you''ll have no reason to drink it at noon. Question: can you
  genuinely form the intention? Distinguish intention to drink from mere resolution;
  rationality of intention vs action.


  Design a new variant thought experiment. The prompt: construct a scenario where
  the toxin-style problem appears in everyday life without a billionaire or toxin
  — e.g., isolate the asymmetry between intending and doing. Constraints: realistic,
  no mind-reading devices, the reward must depend only on forming intention (detectable
  somehow?), etc. Actually a good spec: construct a case where (a) the agent rationally
  wants to intend X, (b) knows that once intention formed, doing X is irrational,
  and must show how a "resolute chooser" vs "sophisticated chooser" differ. Also connect
  to practical cases: deterrence, promises, quitting smoking, hostage negotiation.


  Write 2 paragraphs plus structure spec. Sections: "The scenario", "Why it meets
  the constraints", "Intention versus action analysis", "Where the case is weakest",
  etc. Also ask confidence and least-sure point.'
