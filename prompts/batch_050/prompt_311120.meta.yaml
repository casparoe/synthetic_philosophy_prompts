  Role: I design and facilitate workshops for secondary-school history teachers and
  museum educators. Recurring problem: students (and visitors, and public figures)
  draw analogies between current events and the Holocaust / Nazi Germany. Teachers
  need a consistent way to respond that neither shuts down all comparison nor lets
  trivializing comparisons stand. Currently responses are ad hoc.


  Deliverable: a decision procedure — questions in order, what counts as a sufficient
  answer, where it stops with "this comparison should be challenged," where it hands
  off to judgment. It should be usable in a classroom in real time (a minute or two)
  and trainable in a half-day workshop.


  Conceptual raw material the procedure must preserve:

  - The distinction at stake in the German historians'' controversy of the mid-1980s:
  comparison as an instrument of understanding vs comparison as normalization/relativization
  (putting the Holocaust in a series of modern atrocities so as to make it ordinary).

  - Bauman''s thesis that what distinguishes the Holocaust is not cruelty or scale
  alone but its specifically modern means — bureaucratic division of labor, industrial
  technique, rational goal-oriented planning — which implies that structural comparisons
  should be about mechanisms, not body counts.

  - The difference between analogies about perpetrators/processes, about victims''
  experience, and about outcomes — the same comparison can be apt at one level and
  grotesque at another.

  - Uniqueness claims: the procedure must handle both the view that the Holocaust
  is singular (comparisons always risk distortion) and the view that singularity claims
  make it useless for civic education.


  Hard cases the procedure must handle:

  1. A student compares a contemporary immigration-detention policy to the 1930s —
  apt on some dimensions, inapt on others.

  2. A speaker says "X is a Holocaust" where X is mass animal farming or abortion
  — comparison at the level of victims'' experience and outcome with no structural
  match.

  3. A comparison that is structurally careful but deployed to argue "everyone does
  it, so guilt is relative" — the Historikerstreit move in miniature.


