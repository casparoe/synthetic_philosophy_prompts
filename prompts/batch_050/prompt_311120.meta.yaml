  purpose the comparison serves), say what it cannot do (it can''t settle the scholarly
  uniqueness debate; it only governs classroom analogies), and note where it will
  misfire (e.g., comparisons made by survivors or descendants — the procedure''s rules
  may need suspension or modification).


  Constraints: teachers with varied background, no philosophy training; decision time
  ~2 minutes live; must be defensible to parents/administrators, so each step needs
  a one-sentence public rationale.


  Worked applications: run it on cases 1 and 2 above, plus one where the procedure
  gives an answer the asker won''t like — e.g., a comparison that passes the tests
  but feels wrong (or one that fails but is pedagogically valuable).


