  Idea: Write an advice column / agony-aunt letter exchange where the columnist takes
  consequentialist cluelessness seriously and gives utterly paralyzed advice — but
  deadpan. Or a mock corporate HR memo. Or a commencement speech.


  Consequentialist cluelessness (Lenman, Greaves): the idea that for most actions,
  we have no clue about their long-term consequences, so we can''t rationally compare
  them on consequentialist grounds — simple and complex cluelessness. A satire could
  exaggerate this: a life coach who refuses to give advice because every action''s
  total consequences are inscrutable, yet has to keep the column internally consistent.


  Alternatively the calculation debate: a parody planning-bureau memo where the Central
  Planning Board tries to set prices by solving Walrasian equations — Hayekian knowledge
  problem satire. Could be an in-universe report. But cluelessness seems fresher and
  less commonly memed.


  Prompt draft:


  "Write a mock advice column (agony-aunt format, two or three letters with replies,
  about 600 words total) in which the columnist is a devoted consequentialist who
  has fully internalized the problem of cluelessness: since every action ramifies
  into an unpredictable future, no two options can ever be rationally compared. The
  satire should come from the columnist''s scrupulous consistency — each reply must
  engage seriously with a real feature of the problem (e.g., simple vs. complex cluelessness,
  the asymmetry between acting and refraining, whether cluelessness licenses falling
  back on common-sense morality) rather than just shrugging. The columnist should
  never notice that the column is itself advice, or if they do, that should be the
  final joke handled in a way consistent with the position. Deadpan throughout; legible
  to a reader who has never heard of cluelessness."


  Check accuracy: Lenman''s "Consequentialism and Cluelessness" (2000); Hilary Greaves
  distinguishes simple and complex cluelessness (2016). Simple cluelessness: we can''t
  foresee the consequences of our actions. Complex cluelessness: even if we could
  foresee some, the full spread of consequences across scenarios is beyond us. Acting
  vs. refraining symmetry is a real issue — refraining is also an action with consequences.
  Whether cluelessness undermines consequentialism as a decision guide vs. as a criterion
  of rightness — real debate. "Cluelessness as an objection to consequentialism" —
