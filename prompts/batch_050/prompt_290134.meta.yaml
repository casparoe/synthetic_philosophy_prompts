  4. The "no difference between precommitment and decision now" point.

  5. The reputational/iterated-game dissolution: in repeated interaction paying is
  rational.

  6. The skeptical move: the case smuggles in that the driver can read your psychology
  perfectly; with realistic uncertainty, trustworthiness pays.


