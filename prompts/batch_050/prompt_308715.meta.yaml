  - ''Collapse'' as a concept: the Bronze Age, the Maya, Easter Island, and whether
  societies fail or merely change


  Types:

  - Design a classroom activity or game

  - Satirical/ironic/parody piece

  - Role-play and make the opening move


  The classroom activity type fits well with Dutch book arguments — you can literally
  run a betting game where students get Dutch booked. That''s a classic and natural
  fit. Design a game where students set odds and then get picked off. The idea shows
  up in what happens: participants who price bets inconsistently lose money (or points)
  regardless of outcomes.


  Alternatively, logical uncertainty and logical induction could make a nice activity:
  betting on digits of pi or on arithmetic facts — logical uncertainty made felt.
  That''s actually a lovely combination: a game where participants must assign probabilities
  to mathematical statements whose truth is already fixed (e.g., "the 10,000th digit
  of pi is even", or whether some large multiplication is correct), and feel that
  their "beliefs" about necessary truths behave weirdly. But that''s harder to run
  cleanly.


  Dutch book: a game where each student sets buying/selling prices for bets on events,
  and the facilitator (or other students) can buy or sell at those prices. If their
  prices violate probability axioms (e.g., P(A) + P(not A) ≠ 1, or disjoint additivity
  failures), they get guaranteed losses. The debrief maps to the axioms. This is well-trodden
  but the prompt can ask for specifics that make it "in the weeds": e.g., using an
  unknown-urn setup so probabilities aren''t objective, making students feel the pull
  of the sure-loss. The prompt shouldn''t be something models have seen a million
  times... but the request asks me to inject something new/niche. I can add a twist:
  e.g., the game uses a deck constructed behind a screen, students quote prices for
  compound events, and the "bank" can dynamically choose which side to take. Also
  ask about what predictably goes wrong (students refuse to quote two-sided prices,
  students anchor on round numbers, etc.).


  Alternatively, lexical threshold negative utilitarianism could make a great forced-choice
  deliberation activity: participants allocate "suffering tokens" and "pleasure tokens"
  across populations and discover whether they have a lexical threshold. That could
  be quite novel: a game where students distribute outcomes across envelopes and then
  get hit with trade-offs (tiny pleasure vs. relieving intense pain, etc.). The commensurability
  question gets felt when they can''t find exchange rates.


  The role-play type with time travel: play a defender of the possibility of time
  travel who must respond to the grandfather paradox — meh, common.


  The collapse domain with classroom activity: a simulation game where groups manage
  a society with resource stocks (like a simplified Easter Island / hand-fan model)
  and decide whether they''re "collapsing" or "transforming". Participants run into
  the fact that from inside, decline looks like adaptation. That''s quite nice and
  novel. A resource-management game (e.g., fishing game / commons game) where students
  must name each period "thriving / changing / declining" and afterwards discover
  their labels tracked nothing stable. The debrief maps onto the conceptual question:
  is collapse an event or a retrospective interpretation? Cases: Bronze Age (systems
  collapse), Maya (reorganization?), Easter Island (ecocide narrative contested).


  The satire type: could do a travel-guide for "Easter Island Heritage Park" written
  by a collapse-enthusiast tour operator... or an op-ed by a "collapse consultant"
  who declares every change a collapse. Hmm.


  Which combination is best "in the weeds" while not requiring niche facts? The Dutch
  book activity is very doable by any model; the collapse activity requires knowing
  basic narratives about the three cases (well-known). The grandfather paradox satire
  — e.g., a parody "Time Travel Agency liability waiver" — that''s a known joke genre.
  Role-play: play a logical inductor? Niche.


  I think the classroom activity type with Dutch book arguments is strong but might
  be close to pretraining (many Dutch book descriptions exist). To make it in-the-weeds,
  the prompt should demand specific design elements: an urn-of-unknown-composition
  setup so Ramsey/de Finetti style subjective probabilities apply; two-sided quoting
  (students must post bid/ask prices for bets); the facilitator as "arbitrageur";
  scoring without real money; a debrief mapping each loss to a violated axiom; predictable
  failure modes. Also could add a twist: include bets about logical/mathematical facts
  to bridge toward logical uncertainty... Actually that could be a distinctive twist:
  part of the game involves betting on arithmetic facts (e.g., whether 457×83 ends
  in 1), where there''s no randomness at all, yet students still must quote prices
  — and they can still be Dutch-booked if their prices on logically equivalent bets
  differ. That connects Dutch books to logical uncertainty nicely, but the domains
  say pick one of the domains; combining two might be fine but better to keep focused.


  Let me pick: Dutch book arguments + classroom activity. Setting: maybe a philosophy
  of probability seminar or a "rationality" unit, ~15-20 students, 75 minutes. Requirements:
  game where students post prices for bets on draws from an urn of unknown composition,
  bank exploits incoherence, a scoring rule, debrief mapping to axioms (non-negativity,
  normalization, finite additivity), and honest note about what the activity can''t
  reproduce (e.g., it assumes students must bet; the diachronic version needs different
  setup; pragmatic vs. epistemic reading of the conclusion). Also "what predictably
  goes wrong".


  Let me draft the prompt in casual tone, fairly short, maybe with a typo or two.


  Draft:


  "I teach a philosophy of probability module, 16 undergrads, one 90-minute seminar,
  and I want them to feel the force of the Dutch book argument rather than just nod
  along to it. Design an in-class game: I fill an urn with red and black balls behind
  a screen (composition unknown, and I refuse to say anything about how I chose it),
  and students have to post buying and selling prices for bets on draws and combinations
  of draws, with me as the bank free to take either side of any price they quote.
  Work out the details: how to keep them honest about posting two-sided prices, what
  to do about students who quote 0.5 for everything, how to score it without real
  money, and a scripted second round where I quietly push their prices apart on a
  draw and its negation so someone gets booked. Then a debrief mapping each way of
  losing guaranteed money onto a probability axiom, plus what will predictably go
  wrong (someone will complain the game is rigged, someone will refuse to bet) and
  an honest note about which part of the argument the game can''t reproduce — I suspect
  it''s the step from ''you''d lose money'' to ''your degrees of belief are irrational'',
  but tell me if you think there''s another gap."


  Hmm, "scripted second round where I quietly push their prices apart" — the classic
  Dutch book: if a student prices bet on A at 0.6 and bet on not-A at 0.5, you sell
  them A at 0.6 and sell them not-A at 0.5... Actually the sure loss: buy both from
  them if sum < 1, sell both if sum > 1. If P(A)=0.6 and P(¬A)=0.5, they buy A-bet
  at 0.6 and ¬A-bet at 0.5, pay 1.1 total, receive 1 regardless. The game should let
  the bank exploit this.


  Keep it concise. Also the prompt asks for the debrief, predictable problems, honest
  limitation. Good.


  Casual tone, maybe lowercase a sentence start or a small typo. Keep a few sentences
  long — the examples are ~4-6 sentences. Mine is a bit long but okay; trim.


  Maybe add: they should figure out themselves that quoting 0.5 for everything is
  not safe either (it isn''t exploitable, actually — 0.5/0.5 is coherent... if they
  quote 0.5 for everything including compounds, that IS exploitable via additivity:
  P(A∪B) for disjoint A,B should be 1 if A∪B is exhaustive... quoting 0.5 for all
  events including the certain event is exploitable: sell them the certain event at
