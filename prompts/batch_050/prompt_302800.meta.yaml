  Then personal setup: "I have no academic training in philosophy or physics. I work
  as [a land surveyor], and a few years ago I came across the Newton''s bucket puzzle
  in a popular book and have been chewing on it since. I''ve since read (in Andrew
  Motte''s English translation) part of the Definitions at the start of Newton''s
  Principia, where he defines centripetal force. One passage stuck with me:


  ''A stone, whirled about in a sling, ... flies away.''


  Here''s my confusion. Newton writes as though the tautness of the sling tells us
  something about the stone itself — its ''endeavour to recede'' — and about how fast
  it is truly revolving. But as I understand it, there is a long-running dispute between
  people who think space is a real thing in its own right (so the stone can be revolving
  relative to space itself) and people who think all motion is just change of position
  relative to other bodies (so ''revolving'' must always mean revolving relative to
  something else). What I cannot work out, from anything I''ve read, is what these
  two sides actually disagree about that would show up in the sling. Both seem to
  predict the rope goes taut. ..."


  Then the commission: "I''d like you to draft the joint statement that a committed
  substantivalist and a committed relationist could both sign after a good-faith adversarial
  collaboration on this question. Before drafting, brainstorm a long list of candidate
  agreed claims and candidate disagreements (you may show me the brainstorm), then
  produce the final document with these sections:


  1. Agreed claims — numbered, each stated plainly; I especially want agreed claims
  about what the sling experiment (and Newton''s bucket) does and does not demonstrate,
  and about what each side says the tension is.

  2. Disagreements — a table. Each row: the point at issue in neutral wording, then
  the substantivalist''s position and the relationist''s position, each phrased carefully
  enough that its own side would accept the wording without wincing.

  3. Cruxes — the sub-questions such that settling them would move at least one side.
  For each crux: a concrete case, argument, or (real or imagined) experimental result
  that both sides agree bears on it, and what each side predicts or says about it,
  written down in advance. (For instance, I''d like to know what each side says about
  a universe containing only the two revolving globes Newton imagines, or a single
  spinning body with nothing else in existence — though I don''t know whether the
  two globes idea is actually in the Principia or something I picked up secondhand.)


  Also: I suspect some of this dispute is about words rather than the world — e.g.,
  whether ''absolute motion'' and ''true motion'' are doing the same work. If you
  conclude part of it is verbal, say which part and why, in a short final section.


  Constraints: don''t adjudicate — I don''t want a verdict on who''s right; think
  carefully and check that nothing in the agreed-claims section is something either
  camp would actually deny; don''t pad the agreed section with trivialities neither
  side ever doubted. The statement (not counting the quoted passage) should be around
