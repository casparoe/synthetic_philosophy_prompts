  Lottery paradox: rational to believe ticket #1 will lose, ... ticket #1,000,000
  will lose, but not rational to believe all will lose (one must win). Preface paradox:
  author believes each claim in book individually, but rationally believes at least
  one is false (given their fallibility). An activity: participants each get a lottery-style
  setup — e.g., 20 sealed envelopes, one contains a prize; each participant privately
  believes "my envelope is empty," which is rational at 19/20... Actually a better
  staging: have the class collectively write "the preface": each student submits a
  claim they''re confident in, then the class as author must decide whether to include
  a preface saying at least one claim is wrong. Participants feel the pressure: each
  individual claim feels certain-ish, but the conjunction feels false.


  Good activity: lottery — give each of 30 students a numbered ticket from a 40-ticket
  lottery where one ticket wins a small prize. Ask each: "Do you believe your ticket
  loses?" Everyone says yes (37/40 if some tickets unowned... hmm, need all tickets
  owned). Simpler: N students, N envelopes, one contains £5. Each student is rational
  to believe their envelope is empty (prob (N-1)/N). Yet they must believe at least
  one envelope has money. Then aggregate: if you believe each claim individually,
  do you believe the conjunction? Then connect to preface: students write a "book"
  — each writes one statement they''re 95% confident of; then the class "author" must
  decide whether to assert "every statement in this book is true." They feel the preface
  paradox pressure.


  I could inject a niche twist: a "consistency referee" or "payoff scheme" — participants
  stake points on individual beliefs vs. conjunction; scoring rules (e.g., Brier-like
  points) reveal tension: any scoring rule that rewards accuracy will make them want
  to bet each ticket loses but not bet all lose... Actually with proper scoring rules,
  expected-value maximizers just report probabilities, so the "belief" tension only
  arises with a threshold notion of outright belief. That''s the philosophical point:
  the activity makes them feel the awkwardness of flat-out belief under high-but-not-certain
  confidence. A payoff scheme where they must "assert" (flat-out) rather than state
  probabilities: asserting a truth = +1, asserting falsehood = -10, staying silent
  = 0. With 20 students, each asserts "my envelope is empty": expected value = (19/20)(+1)
  + (1/20)(-10) = 0.45 > 0, so rational to assert. But asserting the conjunction "all
  envelopes are empty" has probability 0 of being true — guaranteed -10. So each student
  individually asserts their own, yet the group can''t assert the conjunction. And
  the epistemic norm conflict: someone notes "if we each believe our ticket loses,
  shouldn''t we believe all lose?" — the aggregation failure is felt live.


  Also the preface variant: students write claims in a booklet; the "editor" must
  decide whether to publish with a preface disavowing complete accuracy. Debrief maps:
  lottery paradox (belief vs. high probability), preface paradox (rational inconsistency
  across a corpus), closure of belief under conjunction, Kyburg''s point, possible
  resolutions: reject flat-out belief (degrees only), accept inconsistency (compartmentalisation),
  reject conjunction closure, raise threshold to 1 (sceptical cost). Predictable problems:
  students will just state probabilities instead of asserting; someone will peek;
