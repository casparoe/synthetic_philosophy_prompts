  be run back to back without lecture in between, and the moment of recognition —
  that the class has just contradicted itself, or refused to assert what each member
  individually asserts — should be allowed to land before I say anything. Third, the
  debrief should map specific moments of the session onto the logical structure: the
  rationality of believing each ticket loses, the impossibility of believing they
  all lose, the author''s preface, and the principle that rational belief is closed
  under conjunction, with a menu of live options for what to give up and what each
