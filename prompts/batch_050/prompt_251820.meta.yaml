  second round is just the first one wearing a different costume. Please design the
  full activity: rules, materials, a points scheme with small real stakes that doesn''t
  involve money changing hands, a minute-by-minute timeline, and the debrief.


  A few constraints and desiderata. First, the game should put pressure on outright,
  flat-out belief rather than letting students hide behind probabilities: whatever
  mechanism you devise, a student who answers "well, I''m 95 per cent confident" should
