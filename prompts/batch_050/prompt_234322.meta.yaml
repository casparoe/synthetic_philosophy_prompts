  Known objections to CEV (Yudkowsky 2004):

  1. Non-convergence / extrapolation could fail to settle on anything.

  2. The "extrapolation is value-laden" objection: how you idealize (what counts as
  "smarter," "more the person you wished to be") already presupposes the values you''re
  trying to derive.

  3. Distance/alienation: the extrapolated self might be unrecognizable; why should
  its wishes bind me?

  4. Goodharting on "muddled, self-deceived": diagnosing which preferences are the
  "mistaken" ones requires a theory of rational preference.

  5. Aggregation across persons (whose CEV? humanity''s CEV requires inter-personal
  aggregation with all its problems).

  6. Moral uncertainty is itself a preference problem; CEV assumes morality reduces
