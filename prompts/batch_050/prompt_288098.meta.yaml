  Or pacifism: design a case where contingent pacifism and absolute pacifism diverge
  but a threshold deontologist agrees with one side.


  Or aesthetic testimony: design a case where testimony-based belief about beauty
  is epistemically fine but the acquaintance principle still objects — separating
  epistemic justification from aesthetic appreciation.


  The thought-experiment-to-specs type needs: specified theories delivering specified
  verdicts, jointly satisfiable but not trivially, with a demonstration the case works,
  note which feature does the work, and how the losing theory''s defender attacks.


  Let me go with coherence arguments for expected utility maximization. Design: a
  scenario where an agent has cyclic preferences but is immune to money pumps, so
  that the money-pump argument can''t force transitivity — e.g., because she has a
  preference-sensitive disposition (like "preference for what she currently has" —
  but that''s status quo). Classic: an agent with cyclic preferences who follows a
  rule like "only trade if..." Actually known: money-pump immunity can be achieved
  by agents who are sophisticated choosers (they foresee the pump). So the spec: design
  a case where the agent''s preferences are intransitive yet no Dutch book/money pump
  succeeds, isolating the extra assumption needed for coherence arguments (e.g., that
  agents accept every fair trade in sequence, or can''t foresee sequences).


  Better spec: design a single decision problem where: (a) the agent''s preferences
  violate transitivity (or independence), (b) a money-pump/Dutch-book attempt fails
  against her, and (c) a third verdict — e.g., her choices are still exploitable in
  a non-monetary currency (time, or regret). Hmm.


  Alternatively, spec: three verdicts — completeness-violating agent (incommensurability)
  who cannot be money-pumped, vs. an agent who treats incomparability as indifference
  who can be pumped. The case isolates the difference between indifference and incomparability
  — a classic point (Raz, Chang). Coherence arguments assume that refusing to trade
  = indifference, hence money pump.


  That could be a good prompt: Construct a decision scenario distinguishing indifference
  from incomparability such that the standard money-pump argument exploits one but
  not the other; specify the agent''s psychology realistically (no exotic preferences),
  show the pump mechanics step by step, identify the auxiliary assumption (that choice
