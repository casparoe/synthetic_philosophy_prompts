  Prompt draft:


  You are a teaching assistant grading answers on a philosophy of mind midterm. The
  question and one student''s answer appear below. Assign a grade out of 10, and justify
  the grade with specific comments addressing each part of the answer — what is correct,
  what is incorrect or imprecise, and where partial credit is appropriate.


  Exam question: The multiple realizability argument is often taken to be the decisive
  consideration in favor of functionalism and against the identity theory of mind.
  (a) State the argument as clearly as you can, making explicit its premises and conclusion.
  (b) Identify the view it targets and assess whether it succeeds against every version
  of that view. (c) Explain how the argument is supposed to motivate functionalism.
  (d) State one standard objection to the functionalist position that results, and
  say briefly whether you think the functionalist can answer it.


  Student''s answer:


  (a) Mental states are defined at a level of description above that of neurophysiology.
  Consider pain. In humans, pain is realized by the firing of C-fibers; in octopuses,
  by a quite different neural arrangement; and we can imagine a Martian or a suitably
  programmed robot in which pain is realized by silicon-based hardware. If the type
  pain were identical to the type C-fiber firing, then creatures lacking C-fibers
  could not be in pain. But it is plainly possible for such creatures to be in pain.
  Therefore, mental state types are not identical to physical state types. This argument
  is due to Hilary Putnam in the 1960s.


  (b) The argument targets the identity theory of Place and Smart, and in my view
  it is decisive. Identity obeys Leibniz''s law: if pain were identical with C-fiber
  firing, then anything true of pain would have to be true of C-fiber firing, including
  its realizers. But a robot pain and a human pain share no physical realizer. So
  the identity theory is refuted in all its forms: no mental state, of any kind, can
  be numerically identical with any physical state.


  (c) The moral Putnam drew is that we should classify mental states by what they
  do rather than by what they are made of. A mental state is individuated by its causal
  role: its typical causes, its typical effects, and its relations to other mental
  states. Pain, for instance, is the state typically caused by tissue damage and typically
  causing distress, avoidance behavior, and the belief that one is in pain. Since
  a causal role can be occupied by states of many different physical kinds — carbon-based
  neurons or silicon chips, just as the role of a mousetrap can be played by devices
  of wood, wire, or plastic — functionalism permits multiple realization while still
  treating mental states as fully real and causally efficacious. It thereby avoids
  both the behaviorist''s denial of inner states and the identity theorist''s chauvinism
  toward alien minds.


  (d) The standard objection is Ned Block''s absent qualia objection. Block asks us
  to imagine the population of China organized to simulate the functional organization
  of a human brain, with each person playing the role of a neuron and radio links
  playing the role of synapses. This system realizes the same functional organization
  as a minded human being, so functionalism counts it as having beliefs and experiences.
  But, Block argues, it is wildly implausible that the population of China, so organized,
  is itself conscious. This shows that functionalism is too chauvinistic: it withholds
  mentality from systems that intuitively possess it. I am not sure the functionalist
  can answer this objection, since any restriction designed to exclude the China-body
  system seems ad hoc.


