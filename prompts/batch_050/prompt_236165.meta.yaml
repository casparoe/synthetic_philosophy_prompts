  I am a PhD student in economic history, and I want to pressure-test a practice in
  my literature that I suspect has an unexamined philosophical foundation. A standard
  research design in the economics-and-culture literature estimates the effect of
  a region''s historical religious composition — say, the Protestant share of a nineteenth-century
