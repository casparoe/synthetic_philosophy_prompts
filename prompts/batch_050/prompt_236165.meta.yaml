  as evidence that culture causes development. Weber''s Protestant ethic thesis is
  routinely invoked as the theoretical warrant for this design, often alongside channels
  Weber himself never proposed (mass literacy, women''s education).


  My question: what conception of culture does this practice presuppose, and is it
  Weber''s? Specifically: (1) Does treating culture as a variable that enters a regression
  alongside institutions and geography presuppose that culture is a discrete, durable,
  intergenerationally transmitted stock — a thing that does causal work? What rival
  conceptions (culture as shorthand for institutions, culture as equilibrium behavior,
  culture as post hoc rationalization) does the practice rule out, and could the same
  coefficients be generated under those rivals? (2) Weber''s own account appears to
  contain a self-undermining mechanism: the ascetic ethic was necessary to call forth
  the spirit of capitalism, but once the capitalist order stood on mechanical foundations,
  it no longer needed religious support. If that is right, then persistent effects
  of Protestantism measured a century later are not confirmations of Weber but evidence
  against his mechanism. Is that correct, or can a Weberian accommodate long-run persistence?
  (3) Finally, what would the practice have to look like — what identification strategy
  or measurement — if it took seriously Weber''s actual claim that the causal force
