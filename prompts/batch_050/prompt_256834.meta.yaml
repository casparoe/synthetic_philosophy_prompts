  Let me write the argument carefully. The classic argument (from "the inefficacy
  objection"):


  (1) A large poultry farm slaughters a fixed number of chickens per week, determined
  by orders from retailers, not by individual purchases.

  (2) My buying or not buying one chicken never changes any retailer''s order — stores
  stock based on aggregate demand, and a single purchase is always below the threshold
  that would alter an order.

  (3) So my purchase causes no chicken to be raised or killed that wouldn''t have
  been anyway.

  (4) An action that causes no harm (and no risk of harm?) is morally permissible
  with respect to that harm.

  (5) Therefore my purchase is morally fine.


  Then extension: same for flying (plane flies anyway), voting (one vote never decides),
  carbon emissions (imperceptible). Conclusion: individual consumer/citizen choices
  in large markets are morally inert.


  The flaw: premise (2) — purchases are below threshold most of the time but occasionally
  trigger; expected harm equals average harm per unit. The move from "this purchase
  rarely makes a difference" to "this purchase never makes a difference" — quantifier
  slide between particular token purchase and expected value. Also (4) conflates causing
  harm with expected harm/risk imposition.


  Alternatively make it valid and ask which premise to drop — but subtler flaw is
  nicer: step from (2) to (3) — even granting each particular purchase doesn''t change
  orders, the system works by thresholds, and one of the purchases is the trigger;
  you can''t tell which. Actually premise (2) stated as universal "never changes"
  is just false under threshold models. The subtle move: (2) looks empirical and true
  for a fixed background of others'' behavior, but it''s not invariant — and the expected-difference
  reasoning.


  Also the argument proves too much: it would show that in a firing squad of 100 where
  one shot suffices, nobody''s shot causes death... Parfit''s cases. The asker can
  note they''d rather keep "one vote rarely matters" style claims or the claim that
