  coffee" — or an argument that the difference principle proves too much (e.g., requires
  forbidding all inequality-producing choices even within families, or applies globally/intergenerationally,
  or implies we should reject any gain to the worst-off if it creates envy...).


  Alternatively costly signaling: argument that proves too much — "all communication
  is costly signaling so nothing can be believed" or "the handicap principle shows
  that any cheap claim is unreliable, so all cheap talk is worthless, but clearly
  much cheap talk is reliable."


  Sweatshops: argument proving too much — mutually beneficial exploitation: "If a
  transaction is voluntary and benefits both parties, it cannot be wrong; sweatshop
  jobs are voluntary and benefit both; therefore permissible; but by the same reasoning,
  price gouging during disasters, organ sales by the desperate, and blackmail payments...
  are permissible" — that proves too much. Where does it go wrong? Good.


  Other minds: argument that proves too much — analogical argument: "I know my mental
  states directly; others behave like me; same causes same effects; therefore others
  have minds. But the same argument works for anything behaving relevantly similarly
  — thermostats, LLMs, octopuses... therefore everything has minds." Where does it
  go wrong?


  Russell''s paradox: argument proving too much — e.g., "If unrestricted comprehension
  leads to contradiction, we must restrict comprehension; but any restriction is arbitrary;
  so sets don''t exist / mathematics is inconsistent." Hmm.


