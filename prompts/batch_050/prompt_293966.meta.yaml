  name the step between (1)/(2): "better off than the status quo ante" doesn''t equal
  "not wronged" — one can be wronged by being given less than fairness requires even
  while being benefited relative to non-interaction. Also (1)''s "else would have
  refused" assumes revealed preference is a welfare measure under constrained options.


