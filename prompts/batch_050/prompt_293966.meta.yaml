  Design:


  (1) A transaction between consenting adults that leaves both better off than they
  would otherwise be is not wrong — at least not wrong to either party.

  (2) Sweatshop employment: workers choose it over worse alternatives; factory gets
  cheap labor; both better off. So not wrong.

  (3) Same structure: desperate hiker pays $100 for a bottle of water at a highway
  stop; the debtor sells a kidney; the drowning man promises his fortune to a passerby
  who demands it for throwing a rope; a monopsonist employer pays subsistence; even
  paying ransom/blackmail — victim better off paying than refusing.

  (4) But paying a kidnapper''s ransom, or the drowning-man rope bargain, are plainly
  wrongful exploitations — agreements procured by exploiting desperation, and the
  law voids them.

  (5) Therefore something in (1)–(3) fails; conclusion: voluntariness plus mutual
  benefit is not sufficient for permissibility... but the asker wants to keep (1)
  flavor.


  Actually the type asks: where does it go wrong, which premise to reject, cost. Let
  me make the argument aim to prove that either we must accept all these transactions
  as fine (proves too much) — conclusion the asker can''t accept.


  Better structure: The argument purports to show there''s no such thing as wrongful
  exploitation at all:


  (1) If A makes B an offer that B can refuse, and B accepts, then B is better off
  than if A had made no offer (else B would have refused).

  (2) Making someone better off than they would have been cannot wrong them (no interaction
  baseline vs. better-off baseline).

  (3) So no accepted offer wrongs the acceptor.

  (4) Sweatshop wages, payday loans at 400% interest, price gouging after hurricanes,
  the rope-for-fortune bargain — all accepted offers.

  (5) Hence none wrong anyone; the concept of "mutually beneficial exploitation" is
  empty — there is only mutual benefit.

  (6) But the rope-for-fortune case is paradigmatically wrongful.

  (7) Contradiction; somewhere the argument slips.


  Where''s the flaw? Classic: ambiguity in "better off than if no offer" — the counterfactual
  baseline (Wertheimer): the right baseline may be what B could reasonably expect
  or a moralized baseline, not the non-interaction baseline; also A''s presence may
  itself remove alternatives (the passerby doesn''t cause the drowning, but the kidnapper
