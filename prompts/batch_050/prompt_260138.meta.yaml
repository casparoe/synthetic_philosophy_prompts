  (2) In a multipolar trap, my restraint doesn''t change the outcome: if I refrain
  from racing to the bottom, someone else just takes my place (market share, the fishing
  stock gets depleted by others, etc.).

  (3) So I''m not obligated to restrain.

  (4) This holds for every participant.

  (5) So no one is obligated, even collectively.

  (6) But if everyone acts on this, the trap is guaranteed; something''s wrong.


  This proves too much because it would also show no one is obligated not to pollute,
  vote, etc. Where does it go wrong? Premise (1) (threshold/expected difference),
  premise (2) (replaceability assumption), or the slide from individual to collective
  (composition/quantifier shift — "nobody is obligated" vs "it''s not the case that
  anybody''s action would help" vs collective obligation).


  The subtle flaw: the replaceability premise is empirical and often false at margins;
