  Moloch idea: An argument from "unilateral restraint is pointless" that proves too
  much — it generalizes to prove that no individual ever has any obligation (e.g.,
  voting, recycling, emissions). Structure:


  (1) An action is obligatory only if its performance makes a difference to the bad
