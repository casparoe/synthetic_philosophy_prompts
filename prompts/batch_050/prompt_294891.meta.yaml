  Options: procreation asymmetry fits well with rationalist audience. Type: "Explain
  some conceptual issue" or "Report verdicts on cases" or "adjudicate disagreement."


  Procreation asymmetry: the claim that we have moral reason not to bring into existence
  miserable lives, but no moral reason to bring into existence happy lives. Benatar,
  McMahan, Narveson. Rationalist audience knows this.


  The "verdicts on cases" type could be fun: cases about procreation obligations,
  e.g., contraception vs. creating happy kids, etc. But need a hard-to-reconcile pair.


  Or adjudicate a disagreement — two people arguing about the asymmetry, with decent
  points both sides.


  Let me do the "verdicts on cases" type with procreation asymmetry, from a rationalist
  reader. Cases:


  1. Choosing not to have a child who would have a terrible genetic disease → good.

  2. Failing to have a child who would be very happy → not wrong, no duty to procreate.

  3. Contraception — fine, no obligation to the possible happy kid.

  4. Having a child at risk of being miserable — wrong.

  5. Repopulating — should someone on a deserted Earth repopulate with happy people?
  Intuition: maybe not obligatory, or maybe yes? Hard case.

  6. Someone creates a happy child as a side project — praiseworthy? Most people say
  no special praise.

  7. Non-human: breeding pets vs. letting stray animals reproduce — feels different.

  8. The pair hard to reconcile: e.g., "no obligation to create happy people" vs "it
  seems like a loss when fertile couples choose never to have kids who''d be thrilled
  to exist" or world-engineering: if you could press a button creating a billion happy
  people for free, seems good, but no obligation to create happy people.


  Also "pinching the asymmetry": Parfit''s non-identity problem, repugnant conclusion
  — rationalists know these.


  Alternatively a disagreement-adjudication could work nicely with Pascal''s wager
  — rationalist audience, atheist friend and religious friend arguing. But Pascal''s
  wager adjudication risks regurgitation; need to make it niche, e.g., fanaticism/many
  gods objection, utility monster issues, "dominance reasoning under mixed strategies."


  Actually, the "verdicts on cases" type with procreation asymmetry injects niche
  ideas naturally (non-identity problem, repugnant conclusion, total utilitarianism).
  Casual rationalist voice, mention "population ethics," "SSC/ACX" without overdoing
  it.


  Let me draft:


  "So I''ve been reading around population ethics lately (the usual ACX-adjacent rabbithole)
  and I keep coming back to the procreation asymmetry..."


  Give verdicts:


  1. A couple learns any child they conceive has 50% chance of a condition involving
  constant severe pain, short life. They conceive anyway (they could''ve adopted).
  Verdict: wrong, clearly.

  2. Same couple decides not to have kids at all, even though any child they''d have
  would likely be very happy. Verdict: not wrong at all, not even mildly.

  3. Someone with the means deliberately has a child predicted to be extremely happy.
  Verdict: fine, but not praiseworthy — they don''t get moral credit the way a donor
  to effective charities does.

  4. A rich eccentric could pay to have ten extra happy children raised well by willing
  families, at no cost to anyone. Verdict: this seems like a genuinely good thing,
