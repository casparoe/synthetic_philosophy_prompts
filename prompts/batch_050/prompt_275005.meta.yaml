  but different wording — e.g., "I''ve been reading Overcoming Bias and LW since..."
  and a personal scenario: sunk cost of a half-built software project / a failing
  startup / grad school.


  Include a typo or two. Casual. Elaborate 1-3 paragraphs.


  Format request: hard length limit — e.g., "keep the whole thing under 900 words"
  and maybe structure: list of readings with verdicts.


  Prompt engineering text: "Take on the persona of a decision theorist who moonlights
  as a practical wisdom columnist" or "You''re a decision theorist. Think carefully,
