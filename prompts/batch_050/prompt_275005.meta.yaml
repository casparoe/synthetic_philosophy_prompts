  support telling me to kill the project; which actually cut the other way (e.g.,
  the money being "good" depends on whether remaining spend buys a completed thing,
  which the slogan ignores). Verdicts: which trivial, which false, which defensible.


  Also format: "Aim for a menu of 4-6 readings, each with a one-line verdict, total
