  with format request (hard length limit), prompt-engineering text (role assignment
  etc.).


  Let me pick: sunk cost fallacy + slogan type? Sunk cost: slogan "don''t throw good
  money after bad" — what precise claims could it make? That fits the slogan type
  well. Or griefbots + fiction reading (e.g., Black Mirror "Be Right Back")? That''s
  very common knowledge. Or Han Feizi + exam question.


  The slogan type seems nice: "don''t throw good money after bad" or "sunk cost fallacy"
  — ask what precise claims the slogan makes. Actually the slogan "don''t throw good
  money after bad" is a perfect fit. From rationalist perspective: LessWrong readers
  know sunk cost fallacy well. But the asker could ask: honoring sunk costs — is the
  slogan always right? Precise claims: psychological advice (people overvalue), normative
  axiom (only future costs/benefits matter), accounting heuristic, cases where honoring
  sunk costs is rational (reputation, self-signaling, commitment, contracts, option
  value, learning). That fits "is honoring sunk costs always irrational?" domain.


  I need the asker to say where they met the slogan and what work it did there. E.g.,
  "on LessWrong someone cited ''don''t throw good money after bad'' to argue I should
  quit my PhD / abandon a project." The deliverable: menu of readings with verdicts,
  which readings support the use.


  Also format: hard length limit, e.g., "under 800 words" or "one page". Prompt-engineering:
  "act as a decision theorist / professional philosopher, think carefully, brainstorm
  first."


  Type: slogan. Domain: sunk cost. Don''t need web search — no quotes from texts,
