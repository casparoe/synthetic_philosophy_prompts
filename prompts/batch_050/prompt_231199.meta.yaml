  The type wants a practitioner applying repeatedly.


  Good setup: the asker works at a regulator / consumer protection office reviewing
  pricing schemes (e.g., gym memberships, phone plans, dynamic pricing) and suspects
  some schemes exploit customers who are money-pumpable — cyclic preferences, non-transitive
  choices. They want a procedure to test whether a pricing scheme constitutes a money
  pump exploit: sequence of trades, each acceptable by the customer''s own lights,
  net effect extraction of money with nothing given back. Procedure should operationalize
  diachronic rationality tests: check for cycles, check whether each step is voluntary,
  check framing effects, distinguish benign upselling from pump.


  Alternatively: the asker is a trader at an exchange who suspects counterparties
  with non-transitive valuations and wants to construct/avoid pumps? The procedure
  type: write a decision procedure for their team.


  Let me draft: "I work in consumer protection... complaints about subscription services
  that keep nudging users through upgrade-downgrade cycles..." Each step seems fine
  to the user but ends with them paying more for the same service. Is this a money
  pump? Write procedure.


  Concrete details to inject: e.g., a telecom offers: pay $5/mo to add feature A;
  later offers trade A for B plus $2; later B for C plus $2; later C back to A plus
  $2 — a cycle extracting money. Each swap looks like a small improvement given shifting
  framing.


  Also want to incorporate the philosophical nuance: money pump arguments against
  intransitivity assume the agent will follow their preferences through the sequence
  (the "pragmatic" argument); diachronic rationality debates (e.g., sophisticated
  vs resolute choosers, McClennen, Rachowicz?). Keep it not too niche — core concepts
  fine: transitivity, dominance, sure-thing losses, the distinction between exploiting
  irrationality and catering to changing tastes (genuine preference change over time
  is not a pump). Key test: would the customer reverse the whole sequence? Do they
  end up back where they started minus money?


  Ask for: step-by-step procedure/checklist, order of tests, worked examples: (1)
  clear money pump (the upgrade cycle), (2) benign case (genuine taste change, seasonal),
  (3) hard case where procedure can''t settle (e.g., customer learns new information
  between steps, or framing-dependent preferences where it''s unclear whether preferences
  are stable). Where judgment can''t be eliminated, flag it. Stakes/constraints: analysts
  have ~30 minutes per case, no economics PhD, legal team signs off on enforcement.


