  Construct a belief set with genuine tensions and one apparent tension that dissolves:


  Commitments about Buchak''s risk-weighted expected utility:

  1. REU adequately rationalises Allais preferences (standard).

  2. The risk function r is a purely formal representation of attitudes to risk —
  no independent normative constraints on r beyond monotonicity (anything goes, permissivism).

  3. The Allais/common-consequence preferences are rational in everyone, not just
  some.

  4. Rationality is a matter of coherence: two agents with same beliefs and utilities
  but different risk functions are equally rational, and neither can criticise the
  other. (This is standard REU line.)

  5. But also: an agent whose risk function makes them buy actuarially unfair insurance
  at every scale, or a maximally risk-seeking agent... Hmm.


  Better tension: REU with permissive risk functions is vulnerable to diachronic/dynamic
  inconsistency — plans: a risk-averse agent (under REU without expected-utility''s
  independence) will violate dynamic consistency / plan to deviate; if the asker also
  holds that rationality requires dynamic consistency (no foreseeably regretted plans),
  there''s a tension. Buchak herself acknowledges REU agents may need to use sophisticated
  choice or precommitment. So:


  (a) REU is the correct decision theory; risk attitudes are captured in r, utilities
  are risk-free cardinal values of outcomes (Buchak''s claim that utility in REU measures
  outcome value, not risk attitude).

  (b) Permissivism about r: any monotonic risk function is rationally permissible.

  (c) Rational agents are dynamically consistent: they don''t form plans they will
  foreseeably abandon; rationality never requires paying to avoid future information
  or binding oneself against one''s future self (resolute choice is irrational).

  Tension: risk-averse REU agents are dynamically inconsistent — in sequential choices
  they''ll foreseeably deviate from plans optimal ex ante; so (a)+(b) with unconstrained
  r conflicts with (c). Buchak''s response: the REU agent will use sophisticated choice;
  or she bites bullet about paying to avoid information. So a genuine tension.


  (d) The value of information: rationally, more information never hurts; you''d never
  pay to avoid free information. Also in tension with REU — risk-sensitive agents
  can rationally refuse free information? Actually risk-averse REU agents can have
  negative value of information in some cases. Buchak discusses this. So (c) and (d)
  overlap — pick one.


  (e) An apparent tension that dissolves: "I think risk aversion is rational (Allais)
  and I also accept that preferences must be complete and transitive" — no tension
  since REU preserves ordering axioms, only drops independence. Or: "I hold that utility
  of outcomes is measurable independently of risk attitudes (Buchak''s claim) and
