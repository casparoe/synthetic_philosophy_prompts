  Inheritance taxes + analogy audit? Or verdicts on cases: inheritance cases — what
  counts as fair. E.g., cases about estate tax vs. gifts, family farms, lottery winnings,
  etc.


  Hate speech laws + verdicts on cases works nicely: cases of speech, verdicts, ask
  for principle distinguishing protected vs. prohibited.


  Corruption/clientelism + verdicts on cases also nice: gift-giving, hiring nephew,
  tipping, lobbying, etc.


  Boltzmann brains + probability estimate: personally relevant? Hard to make personally
  relevant.


  Satisficing/bounded rationality: personally relevant easily — someone making decisions,
  e.g., hiring, apartment hunting, buying a car, choosing a restaurant. Verdicts on
  cases: when did I satisfice and it was fine, when not; ask for principle of when
  satisficing is rational. That could be good and not regurgitated.


  Let me go with satisficing + verdicts-on-cases. The asker reports gut verdicts on
  a set of decisions: apartment hunting under time pressure (fine to take first good
  one), choosing a spouse via "good enough" (feels wrong), hiring first adequate candidate
  (fine?), surgeon picking a procedure, buying cereal, chess move search, retirement
  portfolio, etc. At least one hard-to-reconcile pair. Ask: what principle captures
  when satisficing is acceptable vs. when optimizing is required; does the principle
  overturn any verdicts.


  Must include: hard length limit, formal/polished tone, personally relevant framing.
  No quotes needed, no web needed.


  Personal relevance: "I''ve just spent three months searching for an apartment /
  hiring / and my spouse accuses me of satisficing..." Good hook: recently spent weeks
  choosing between two job offers while comfortably buying a laptop in ten minutes,
  and wondering why the difference.


  Let me draft cases with verdicts:


  1. Buying a laptop: picked the first one meeting specs and budget in 20 minutes.
  Fine.

  2. Apartment search under a deadline: took the third one viewed because it cleared
  the bar. Fine.

  3. Hiring for my team: stopped after candidate four who was clearly adequate, though
  a better candidate might have applied later. Feels fine but uneasy?

  4. Accepting a marriage proposal / deciding to marry someone who is "good enough":
  feels wrong to even frame that way.

  5. Choosing a retirement fund: picked a default index fund after an hour. Fine —
  arguably optimization is a trap here.

  6. A doctor choosing a treatment: would want her to optimize, not satisfice. (Verdict:
  satisficing not fine.)

  7. Jury verdict / deciding guilt: satisficing seems unacceptable.

  8. Chess: I stop calculating when I find a move I can''t refute. Fine.


  Hard-to-reconcile pair: hiring (fine) vs. doctor (not fine) — both affect third
  parties. Or laptop (fine) vs. marriage (not fine) — both personal high-stakes...
  stakes differ though. Better tension: hiring first adequate candidate feels fine,
  but a hospital doing triage... Hmm.


  Cleaner tension: I satisfice on my own apartment (fine) but it would feel like a
  betrayal if a real estate agent I''d hired stopped searching at "good enough" on
  my behalf. Or: fine for me to satisfice picking my own surgeon? No.


  Another: fine to satisfice choosing a restaurant for myself; not fine for the jury
  to satisfice. The difference stakes+third parties. But hiring affects third parties
  too, and verdict says fine — that''s the tension to reconcile. Good.


  Deliverable: principle (or small set), stated precisely, which clause is motivated
  by which case, verdicts on new cases (e.g., choosing a donor kidney protocol? a
  pilot deciding whether to divert?), and honest statement of which verdicts can''t
  be accommodated.


  Length limit: "no more than 400 words" — feasible for principle + a few clauses.
