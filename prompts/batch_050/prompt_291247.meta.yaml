  Potential prompt:


  I am drafting an internal framework for evaluating AI assistants and want to know
  whether my position is jointly tenable. I hold that:

  (1) an AI system can be honest, dishonest, or deceptive without beliefs, desires,
  or consciousness; these terms apply functionally to its outputs and selection mechanisms;

  (2) an output is deceptive when, in context, it would be apt to give an ordinary
  attentive user a false or unwarranted belief, even if the actual user does not acquire
  that belief;

  (3) foreseeably misleading users is nevertheless insufficient for deception: the
  output must have been selected or optimized because of its tendency to induce the
  relevant belief; otherwise the case is one of error, negligent disclosure, or perhaps
  manipulation;

  (4) a confident hallucination unsupported by model''s evidence is dishonest but
  not, merely as such, deceptive;

  (5) literally true outputs can be deceptive through framing, implicature, or selective
  omission, but omission is deceptive only where context creates duty to disclose;

  (6) retention-optimized support bot that tells a customer, truthfully, that changes
  are free while omitting eligibility for a refund, where omission is explained by
  retention objective and induces belief no refund exists, is deceptive;

  (7) a general disclaimer that model may be wrong does not make a specific, confident,
  unsupported answer honest.


