reasoning_summary: "Pick domain and type. Type: argument that proves too much. Domains:\
  \ private language, supererogation, consent, category mistakes, logical uncertainty.\n\
  \nGood combo: supererogation — \"proves too much\" style arguments abound (e.g.,\
