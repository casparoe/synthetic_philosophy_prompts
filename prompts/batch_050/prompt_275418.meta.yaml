  \ by any lie? Or that all contracts are coerced because of background conditions).\n\
  \nLet me construct: an argument that there is no supererogation. Classic: if supererogatory\
  \ acts are praiseworthy, and we ought to do the best... premises: (1) if doing X\
  \ is morally better than alternatives and costs nothing overriding, you ought to\
  \ do X; (2) supererogatory acts are by definition morally better than obligatory\
  \ alternatives; (3) so supererogatory acts are obligatory; contradiction with definition;\
  \ so no supererogation. Also \"all actions are either obligatory, forbidden, or\
  \ neutral; supererogatory are none of these.\"\n\nOr an argument proving too much\
  \ in the other direction: supererogation argument showing that almost nothing is\
  \ supererogatory / everything admirable is required. Could include the \"distance/pond\"\
  \ style. Or: argument that saints are just doing their duty, which seems to prove\
  \ too much (heroism, going beyond, becomes obligatory, so everyone is failing constantly).\n\
  \nAlternatively consent: argument that all consent under any deception is invalid\
  \ → most sexual encounters and purchases non-consensual; seems to prove too much.\
  \ Or: coercion argument that background inequality invalidates all employment contracts.\n\
  \nLet me do supererogation, it's one of the listed domains and fits \"proves too\
  \ much\" well.\n\nArgument draft (numbered):\n(1) An action is obligatory iff omitting\
  \ it would be wrong (you'd merit blame).\n(2) If doing X is morally better than\
  \ doing Y, and you could do X instead of Y at no cost in moral terms elsewhere...\
  \ hmm need clean premises.\n\nBetter: \n(1) You always ought to do the morally best\
  \ action available to you. (Seems plausible.)\n(2) If you ought to do it, failing\
  \ to do it is wrong, i.e., it's obligatory.\n(3) So all and only the morally best\
  \ available actions are obligatory; nothing better can be beyond the call of duty.\n\
  (4) A supererogatory act is by definition good but not obligatory — doing more than\
  \ duty requires.\n(5) So there are no supererogatory acts.\n(6) But a stranger running\
  \ into a burning building to save a child, when the fire service is already there,\
  \ is plainly not required — they'd do nothing wrong by staying back.\n(7) So something\
  \ above must be false, yet each premise looks like a platitude.\n\nWhere does it\
  \ go wrong? Premise (1) — the \"ought implies best\" — that's the least-costly rejection\
  \ typically (satisficing consequentialism, reasons vs oughts, or the idea that praise-worthiness/blame\
  \ structure differs). A good answer names premise (1), explains why it looked fine\
  \ (it's a near-tautology given 'ought' talk), and prices alternatives: deny (2)\
  \ (defeasible oughts), or accept the conclusion (Henson/Urmson debate; consequentialists\
  \ like Singer bite this bullet).\n\nAdd a wrinkle to make it harder: include a step\
  \ about costs/sacrifices: \"If you weren't required, then someone who did it and\
  \ someone who didn't are equally blameless, but then praise would be inexplicable\"\
  \ — actually keep it focused. Maybe add premise that praise tracks... Hmm.\n\nTo\
  \ make it \"genuinely hard,\" I can make the argument valid so the real question\
  \ is which premise is least costly. Premise (1) is the target: \"you ought to do\
  \ the best available\" — the standard move is to reject it (morality's demands are\
  \ limited; there's a moral minimum; beyond that there are permissions). Or reject\
  \ the definition in (4)... Let me include the \"costly to me\" angle: the asker\
  \ wants to keep (6) (intuition about the hero) and wants to keep (1) maybe? Say\
  \ which claims they'd most like to keep.\n\nWrite casually, British English request,\
  \ maybe a typo. Keep short-ish. No quotes needed, no search needed.\n\nDraft:\n\n\
  \"I've been defending supererogation in a reading group and someone hit me with\
  \ this argument and I haven't been able to shake it. (1) Whenever you have several\
