  to a monistic metric.


  Audience specificity: a workshop with capability-approach people (Sen/Nussbaum followers),
  a Dworkinian, and welfare economists. Objections: responsibility-sensitivity cuts
  against capability view; the indexing problem for capabilities; adaptive preferences
  objection to welfare; fetishism objection (Sen''s critique of resources); the "expensive
  tastes" objection; Anderson''s democratic equality critique of luck egalitarianism.


