  claim that the equality-of-what debate collapses when you take seriously adaptive
  preferences plus the cost of metric conversion across goods, or a "domain-relative
  metric" view: different metrics for different policy domains (welfare for healthcare,
  resources for tax, capabilities for disability policy). That''s a somewhat novel
