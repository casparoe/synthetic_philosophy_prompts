  "I''m a PhD student in political theory, and next month I''m presenting at a political
  philosophy workshop my defense of metric pluralism: the claim that the ''equality
  of what?'' question has no single answer, and that justice requires different metrics
  in different policy domains — resources for tax and transfer design, capabilities
  for disability and health policy, welfare for... The audience: two committed capability
  theorists, a Dworkinian resource egalitarian, and a welfarist economist..." Then
  ask for prep sheet: objections in order, phrased as each would phrase, what to concede/hold,
  weakest point, the question I hope nobody asks.


  Include a sketch of the argument so objections have targets: e.g., the argument
