  Summary draft (plausible, mostly right, with 1-2 subtle misrepresentations):


  "Fitch''s paradox of knowability is the result, due to Frederic Fitch, that if every
  truth is knowable, then every truth is known. The proof is short: suppose p is a
  truth that is not known. Then the conjunction ''p and p is not known'' is itself
  a truth, and by assumption knowable. But knowing this conjunction requires knowing
  its second conjunct while knowing the first, and knowledge distributes over conjunction
  and is factive, so one would know p while not knowing p — a contradiction. Hence
  the knowability theorist''s thesis collapses: her moderate claim that all truths
  are knowable entails the absurdity that all truths are known. Since no one believes
  all truths are known, Fitch''s argument shows that there are unknowable truths —
  indeed, a huge class of them, namely any truth of the form ''p and it is not known
  that p'' — and thereby refutes verificationism and semantic anti-realism, positions
  which are committed to the knowability of all truths. Defenders of anti-realism
  like Dummett have largely accepted that the argument is decisive and abandoned the
  knowability thesis."


