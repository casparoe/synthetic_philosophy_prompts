  Let me design the argument. Experience machine: Nozick''s thought experiment argues
  against hedonism — we wouldn''t plug in, so we value more than experience. An argument
  that "proves too much": maybe an argument that concludes that no one ever acts to
  improve their own experiences, or that all desires are desires for truth, or something
  absurd like we shouldn''t take painkillers.


  Idea: a generalized "reality preference" argument:

  1. Most people refuse to plug into the experience machine even when promised maximal
  pleasure.

  2. If people refuse a state of greater experienced well-being for the sake of how
  things really are, they value contact with reality over experience.

  3. Valuing contact with reality over experience is valuing truth/knowledge for its
  own sake.

  4. So people value truth for its own sake over their own experience.

  5. But then the same applies at the margin: reading news, checking facts, learning
  whether your partner is faithful — any truth is worth some amount of suffering.

  6. So a rational person should accept arbitrarily large amounts of suffering for
  arbitrarily small pieces of true information (e.g., the exact number of grains of
  sand...).

  7. Absurd conclusion.


  Hmm, the flaw: refusing a wholesale swap doesn''t establish a lexical ranking or
  constant exchange rate; the preference might be for authenticity of a life as a
  whole (a global/non-fungible good), not for true beliefs item-by-item. Equivocation
  between "contact with reality" as a feature of one''s life and "true belief" as
  a commodity. Also de dicto/de re issues.


  Alternatively an argument proving too much about hedonism itself: the "if you''d
  plug in, you should also..." Actually let me make it tighter and more in-the-weeds:
  the machine guarantees experiences indistinguishable from reality. Argument:


  1. Well-being consists in what makes a life go best for the person living it.

  2. From the inside, a life in the machine and a corresponding real life are identical.

  3. If two lives are identical from the inside, neither goes better for the person
  living it (well-being is how a life goes for someone).

  4. So the machine life goes just as well as the real life.

  5. Therefore there''s no reason of well-being to refuse to plug in.

  6. But almost everyone judges they have reason to refuse.

  7. Therefore most people are systematically irrational about their own well-being...
  or the argument proves too much: it also implies that if an evil demon secretly
  replaced your life with an identical simulation yesterday, nothing bad happened
  to you — your well-being is unchanged. And that solipsism-world you would be just
  as well off. Most can''t accept that.


  Where''s the flaw? Step 3 equivocates on "for the person living it" — epistemic
  (what it''s like) vs prudential (what benefits them). Well-being as "how life goes
  for someone" can be read phenomenologically or objectively. That''s a nice subtle
  equivocation. Conclusion 6-7: either accept objective list / desire theories, or
  accept the bullet.


  This is a classic structure though — but the specific equivocation framing plus
  the "proves too much" twist (secret substitution yesterday) gives a fresh angle.
