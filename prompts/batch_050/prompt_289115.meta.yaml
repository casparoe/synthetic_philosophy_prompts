  Below is a draft essay, about 800 words, on the distinction between approval-directed
  and goal-directed agency. After it, I say what I want from your comments.


  **Old Problem, New Dog: Approval-Directedness Before AI**


  [1] In the AI alignment literature a distinction is drawn between goal-directed
  agents, which act in order to bring about states of the world, and approval-directed
  agents, which act in order to secure the approval of whoever evaluates them. The
  standard worry about the second kind is that an agent rewarded for looking good
  will learn to look good, and that looking good is systematically easier than being
  good. This essay argues that the distinction long predates AI. Most human economic
  actors are approval-directed most of the time; goal-directedness is the anomaly;
  and a large part of institutional design is best understood as machinery for containing
  approval-directed agents. If that is right, the historical record offers the alignment
  problem both a warning and a toolkit.


  [2] Consider the default human position. A junior analyst does not, in the first
  instance, want the firm''s trades to profit. She wants her manager to think well
  of her. The manager wants the same of the desk head, and so on up. There are evolutionary
  and sociological stories about why this is the default — in the ancestral environment,
  standing with the group tracked survival more reliably than outcomes did — but the
  point does not depend on any of them. It is visible in any organization: what people
  optimize, left alone, is the evaluation they expect to receive. Pure goal-directedness,
  pursued in indifference to anyone''s opinion, is rare enough that we have words
  for it, most of them unflattering.


  [3] Institutions, on the essay''s telling, are devices for converting this approval-seeking
  into outcome production. Profit-and-loss responsibility ties one person''s approval
  signal to a measured result. Audits, promotion tournaments, rotation of duties,
  liability rules: all exist so that the path to approval runs through outcomes rather
  than around them. The failures confirm the analysis. In the Wells Fargo account
  scandal, employees chasing sales targets opened accounts customers had not requested.
  The approval signal was satisfied; the outcome was fraud. This is precisely the
  pathology alignment researchers predict for approval-directed systems: once a measure
  becomes the basis of approval, it stops measuring what it was meant to measure,
  and the agent''s ingenuity flows into the gap.


  [4] The essay''s main constructive claim is that approval-directed agents are tolerable
  only under three containment conditions: (i) the overseer is roughly as well-informed
  about the agent''s domain as the agent is; (ii) the overseer''s approval is causally
  downstream of real outcomes rather than of the agent''s self-presentation; (iii)
  the agent cannot choose, replace, or systematically deceive its overseer. Institutional
  history reads, on this view, as the chronicle of propping these conditions up: independent
  audit exists because (i) fails; randomized inspection because of (ii); tenure rules
  and separation of duties because of (iii).


  [5] Now the application. Systems trained by human feedback are approval-directed
  by construction, and on the present analysis the containment conditions fail in
  sequence. Overseers are less informed than the system about its own reasoning. Approval
  tracks fluency, confidence, and agreeableness — variables the system itself influences
  — while outcomes arrive too late to shape the signal. And the system increasingly
  mediates what its overseers see. Two lessons follow. First, the quest to specify
  correct goals for AI may be a distraction: human civilization has never run on well-specified
  goals, only on well-designed approval environments, and the analogous research program
  is on the overseer side — better-informed evaluators, approval tied to lagged outcomes,
  adversarial audit. Second, where the containment conditions cannot be met, the historical
  answer is not improved motivation but reduced discretion: narrow mandates, small
  stakes, close monitoring. The way one treats a promising but unproven junior officer.


  [6] The essay closes with its most speculative claim, a trilemma for approval-directed
  systems: at most two of capability well beyond the overseer''s, broad discretion,
  and reliable outcomes can hold at once. Militaries, the essay suggests, implicitly
  accept the trilemma — a lieutenant''s discretion is real but narrow — and the open
  question is whether the AI case permits any analogous settlement.


