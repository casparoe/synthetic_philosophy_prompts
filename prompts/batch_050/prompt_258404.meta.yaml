  even a miniscule amount of suffering multiplied by it swamps any finite harm, so
  anyone who picks torture just doesn''t get exponents. That seems airtight to me?
  Like, isn''t the whole case just arithmetic — if you multiply any nonzero disutility
  by a big enough number you beat any bounded one? Why do people treat this like a
  hard question instead of a calculation?"


