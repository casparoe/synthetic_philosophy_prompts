  Write a summary that is plausible, mostly right, with one or two subtle misrepresentations:


  A friend summarized Dennett''s two-bitser argument as: "Dennett''s point with the
  two-bitser — a vending-machine-like toy that dispenses soft drinks when you put
  in two bits — is that the machine doesn''t really understand money, it just responds
  to shapes, and the same goes for us: our so-called original intentionality is really
  just derived intentionality conferred by natural selection. So Searle is right that
  there''s a real distinction, Dennett just thinks it''s a matter of degree, and the
  Chinese room shows that no computer could ever have original intentionality."


  Misrepresentations to plant:

  1. Dennett doesn''t accept the original/derived distinction as fundamental — he
  thinks our intentionality is also derived (from evolution/design), so there''s no
  principled distinction, not a matter of degree of a real distinction Searle is right
  about. Saying "Searle is right that there''s a real distinction" flips Dennett''s
  point.

  2. The conclusion "no computer could ever have original intentionality" — Dennett
  would reject this; the Chinese room shows at most that mere symbol shuffling isn''t
  sufficient, not that computers in principle can''t. Also Dennett thinks the right
  kind of robot could have intentionality.

  3. Also the detail: the two-bitser in Dennett''s essay is a "soft-drink dispenser"
  that takes two bits (a quarter) — actually in "True Believers" the two-bitser detects
  quarters (two bits). It was designed for US quarters; if transported to a place
  where some other coin fits (e.g., a Panamanian quarter-balboa), what it "detects"
  depends on interpretation. Dennett''s point: there''s no fact of the matter about
  what it "really" detects absent design history/function. That''s the actual point
  — indeterminacy of content without appeal to function/design. The summary could
  subtly misstate the point as merely "responds to shapes."


