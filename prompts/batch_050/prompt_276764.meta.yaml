  fictional founder of a civic organization — call it the Society for Substantive
  Equality — announcing its policy platform. The platform should consist entirely
  of "subtractive" measures: policies that close gaps purely by lowering the better-off,
  with no redistribution at all. A levy collected in the destruction of surplus goods
  rather than their transfer; scheduled service outages calibrated to wealth brackets;
  a program to withhold... etc.


  The brief: deadpan Swiftian, no winking; the founder must explicitly and calmly
  concede that his policies make nobody better off, and defend this with the best
  available version of the intrinsic view — e.g., equality as a relation between people,
  not a state of anyone''s life, so improving the relation needn''t improve any life;
  comparisons to retributive punishment, where we also accept that someone can be
  made worse off with no one made better off because a relation (fittingness) is restored.
  The satire should land because he''s right about what his view entails, and readers
  recoil from the entailment. Somewhere, without naming it, let the reader see the
  prioritarian alternative — caring more about gains to the worse-off only ever matters
  when someone actually gains — so they can feel why it dodges the whole problem.
  The founder should never secretly become a prioritarian; internal consistency is
  the point.


  Also: the humor must come from exaggerating a real feature, not inventing one. End
  with a short note (3-4 sentences, outside the satire) explaining what the piece
  is doing.


