  As I understand it, if you think inequality is bad in itself — not just bad because
  it tends to come with poverty, unfairness, or humiliation — then you seem committed
  to saying there is something good about making the better-off worse off, even when
  that helps absolutely no one, because it makes things more equal. My friends treated
  this as a knockdown refutation. I keep suspecting it isn''t, or at least that the
  people who hold the intrinsic view of equality know exactly what they''re committed
  to and accept it with open eyes. I''d like to see that position argued from the
  inside, as persuasively and as uncomfortably as possible.


  Please act as a satirist who also has a professional philosopher''s command of the
  egalitarianism literature. Before you write, think carefully about which moves a
  consistent intrinsic egalitarian actually has to make — where they must bite the
  bullet, and where they can push back honestly rather than being trapped. Then write
