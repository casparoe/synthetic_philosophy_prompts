  a warm bath feels good because being cold is a disturbance. So the good, ultimately,
  is the absence of suffering and unfulfilled desire, not the presence of anything.
  A life with zero cravings and zero suffering is at the top of the scale, and adding
  pleasures on top of it adds nothing.


