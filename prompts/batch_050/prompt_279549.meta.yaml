  TAing an intro philosophy of language course..." That''s fine.


  Include prompt engineering: "Act as an expert philosopher of language; think carefully
  through each claim before assigning a grade."


  The student answer needs to be genuinely mixed: right about visible things, 1-2
  subtle mistakes. Let me draft the question and answer.


