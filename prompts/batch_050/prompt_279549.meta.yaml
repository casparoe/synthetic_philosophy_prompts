  two of the puzzles Russell raises, and explain how Russell would respond to Strawson''s
  objection."


  Student answer draft:


  "Russell''s theory of descriptions holds that definite descriptions — phrases of
  the form ''the F'' — are referring expressions whose contribution to a sentence
  is the unique object satisfying the description. [mistake 1: Russell denies they''re
  referring expressions] Sentences containing descriptions can be paraphrased into
  quantificational form: ''The present King of France is bald'' means that there is
  at least one King of France, at most one King of France, and whatever is a King
  of France is bald. Since there is no King of France, the sentence comes out false
  rather than meaningless, which resolves the puzzle of non-referring descriptions.


  Russell also uses the theory to handle identity statements. ''Scott is the author
  of Waverley'' is analyzed as: there is someone who wrote Waverley, at most one person
  did, and that person is identical with Scott. This explains how the sentence can
  be informative: if it were a mere identity like ''Scott is Scott'', it would be
  trivial.


  Third, the theory solves puzzles about negation. ''The King of France is not bald''
  is false, because [mistake 2: ambiguity] ..." — Actually the subtle mistake: student
