reasoning_summary: 'Pick a domain and type. I''ll go with "Predict or recommend a
  verdict on a new case" combined with "Satisficing and bounded rationality" — e.g.,
  a manager/committee''s past decisions on hiring/plans, and ask to predict the verdict
  on a new case where satisficing vs maximizing diverge.


  The type requires: earlier verdicts consistent with more than one plausible rule;
  new case where at least two rules diverge; ask to identify candidate rules, what
  each predicts, best guess with reasons, and the further case that would settle it.


  Construct: my head of operations'' verdicts on stopping searches (when to stop looking
  at options). Cases:

  1. Hiring: stopped at third candidate who met all criteria though 20 applicants
  unreviewed → approved.

  2. Flat hunt: kept viewing flats for two weeks after finding one within budget near
  work → criticised as waste of time. Hmm, need verdicts that are consistent with
  multiple rules.


  Let me design: the boss is deciding "when to stop searching for more options." Verdicts:

  - Case A: supplier search — took first quote meeting all specs, £40k, though cheaper
  quotes likely existed → said fine.

  - Case B: software vendor — kept comparing for 3 months past finding an adequate
  option, project delayed → said should have stopped earlier.

  - Case C: choosing a new office location — looked at 30 sites despite finding a
  good one at site 5 because rent was a huge long-term cost → said right to keep looking.

  - Case D: canteen menu redesign — spent two days researching instead of one hour
  → said overkill.


  Candidate rules: (1) satisficing with a fixed aspiration level (stop at first adequate
  option — but then case B should''ve been fine and C wrong... case C: kept looking
  though found adequate → rule 1 says wrong, but boss said right. So rule 1 alone
  doesn''t fit). (2) search effort proportional to stakes/importance (matches B, C,
  D; A is high stakes though — £40k... hmm). Let me make A low stakes.


  Revise:

  - A: office coffee supplier, took first quote meeting spec → fine. (low stakes,
  stop early — consistent with both satisficing and stakes-proportionality)

  - B: small side project software, 3 months comparing after adequate found → criticised.
  (consistent with both: satisficing says stop at adequate; stakes rule says low stakes
  = little search)

  - C: new office lease, 10-year commitment, kept looking past adequate option → endorsed.
  (stakes rule says right; naive satisficing says wrong)

  - D: ...maybe add a case where a high-stakes decision stopped early and was criticised:
  choosing the company pension provider, picked the first one HR suggested → said
  should have looked more. (stakes rule says right criticism; satisficing says fine)


  So naive satisficing (stop at first adequate) fits A, B but conflicts with C and
  D. Stakes-proportional search fits all four. New case should diverge between stakes-proportional
  rule and another plausible rule — e.g., a rule based on reversibility: search more
  when the decision is hard to reverse. Or a "regret minimisation" rule: search more
  when the decision-maker will later see the foregone options. New case: high stakes
  but easily reversible, or low stakes but irreversible. E.g., booking a one-off venue
  for the company''s 25th anniversary party: medium cost, but the date can''t be moved
  and popular venues book out — or better: irreversible but relatively low stakes.


  New case: choosing the engraving supplier for a commemorative plaque — cheap, but
  mistake is permanent? Or: medium stakes, irreversible: picking the design/logo for
  a permanent sign on the building. Stakes rule says little search (cheap), reversibility
  rule says lots of search (permanent, highly visible). Good divergence.


  Also a third rule could be "search costs vs expected gain" (optimal stopping / bounded
  rationality cost-benefit): continue while expected improvement exceeds search cost.
  On the new case: cheap decision, search cost may exceed monetary gain, but permanence
  raises the cost of error.


  Ask: predict verdict, which rule she''s implicitly running (satisficing, stakes-proportionate
  search, cost-benefit optimal search, reversibility), and name the further case that
  would tell them apart.


  Format: casual, a typo or two allowed, British English request, and final answer
  in machine-readable form: last line "Verdict: ..." plus maybe \answer{...}. Ask
  for last line beginning "Verdict:".


  Keep it short-ish. No quotes needed. Write the prompt.'
