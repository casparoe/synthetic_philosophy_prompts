reasoning_summary: 'Let me pick a domain and type. Options:


  - Do LLMs understand? (stochastic parrots debate)

  - The hole argument

  - Zhuangzi''s views on death

  - Spinoza''s views on democracy

  - Scanlon''s contractualism and aggregation problem


  Type options: "Present a position and ask what would count against it", "Predict
  views of historical figure on post-humous issues", "Write a sorting quiz/decision
  tree/taxonomy".


  Good combos:

  - Zhuangzi''s views on death + predict views of historical figure: "What would Zhuangzi
  make of cryonics / life extension / LLMs?" That works nicely — Zhuangzi on death
  applied to modern longevity tech. Niche-ish but meaningful.

  - Scanlon''s contractualism + what would count against it: could work but contractualism
  and aggregation problem is well covered in pretraining. The type says inject niche
  ideas. Could add a specific new twist, e.g., contractualism applied to aggregation
  across small probabilities.

  - The hole argument + taxonomy/decision tree: a decision tree from commitments to
  substantivalism/relationism etc. That''s answerable from standard knowledge; could
  add specificity.

  - Do LLMs understand + position/defeaters: "I think LLMs don''t understand because
  X; what would count against?" Common.


  The historical-figure prediction type is nicely constrained: Zhuangzi on death →
  predict Zhuangzi''s views on modern death-related practices (cryonics, medical futility,
  digital afterlives). Zhuangzi is well-known enough for LLMs to have decent knowledge
  (Chapter 2, the death of his wife, the skull dialogue, butterfly dream). Small LLMs
  should know Zhuangzi basics.


  But instructions say prompts shouldn''t rely on quoting. I shouldn''t quote Zhuangzi
  verbatim from memory. I can paraphrase the anecdotes (beating the tub after his
  wife died, the skull in the roadside, refusing Chu king''s offer — that''s about
  office not death). Paraphrase is fine.


  Let me draft a prompt: Zhuangzi + predict views on post-his-time issues.


  Requirements:

  - Relatively elaborate, 1-3 paragraphs, casual, maybe a typo or two, British English.

  - Ask the response to lead with bottom line in first sentence, then reasoning, no
  preamble, no restating the question.

  - Should be "in the weeds" — inject a niche/new idea. E.g., a specific hypothetical:
  a near-future "hibernation bridge" technology, or cryonics revival, digital emulation
  of dead relatives as chatbots (griefbots), longevity escape velocity. Ask what Zhuangzi
  would make of these given his views on death — the transformation of things (hua),
  the wife story, the skull story.


  To make it meaty: ask whether Zhuangzi''s equanimity about death is consistent with
  choosing cryonic suspension — is freezing yourself a failure to accept transformation,
  or is revival just another transformation? And griefbots: would he approve of talking
  to a simulation of his dead wife? Would he see it as clinging, or as yet another
  transformation (wife becomes bytes, like the butterfly dream)?


  That''s a good prompt: it forces the model to reason from Zhuangzi''s actual views
  (death as transformation, ziran, the equalisation of things, suspicion of fixed
  distinctions between life and death) to novel cases, not regurgitate.


  Let me write it casually, British English, with a small typo or two. Include the
  format request: lead with bottom line in first sentence, then reasoning, no preamble.


  Also should mention paraphrased anecdotes without quotes — describe them: drumming
  on a tub and singing when his wife died; the skull by the roadside he used as a
  pillow; the butterfly dream (not death but transformation). Keep as paraphrase,
  no quotation marks.


  Add some seeding detail: "I was discussing with a friend who does the admin for
  a cryonics non-profit..." — casual. Also maybe: "I''m writing a piece for a student
  philosophy magazine."


  Draft:


  "I''m writing a short column for a student philosophy magazine about what classical
  Daoism would make of modern death-tech, and I keep getting stuck on Zhuangzi. What
  I want from you: a reasoned reconstruction of what Zhuangzi would most plausibly
  think about two things that obviously didn''t exist in the fourth century BC..."


  Then the two cases:


  1. Cryonic suspension: a person has their body vitrified at death hoping future
  medicine revives them. Supporters say it''s not refusing death, just hedging. Given
  Zhuangzi''s treatment of death as one more transformation among the ten thousand
  changes, and his wife story, would he see cryonics as a category error — clinging
  to one particular form rather than accepting transformation? Or could a Zhuangzian
  shrug and say revival is just another change of form, no different in kind from
  the body becoming grass/soil? Or is the problem not revival but the fear/desire
  motivating it?


  2. Griefbots: chatbots trained on a dead person''s messages so the bereaved can
  keep "talking" to them. Would Zhuangzi treat the bot as continuous with the person
  in some way (transformations), or dismiss it as a husk? And would he think talking
  to it is unhealthy attachment or perfectly fine play?


  Constraints: argue from his actual attitudes — death as transformation, equanimity,
  suspicion of the life/death distinction, his scepticism about fixed identities —
  not generic "Daoism says harmony". Also flag where the extrapolation genuinely breaks
  down (e.g., Zhuangzi''s views assume no one can actually avoid death; cryonics at
  least purports to). And don''t invent quotes.


  Format: "Start with your bottom line in the first sentence — what he''d think overall
  — then the reasoning, no preamble, no restating my question back at me."


  Add typo(s): e.g., "fourth centry BC" or "definately". British spellings: "colour",
  "recognise", "vitrified" fine. Use "scepticism".


  Length: 1-3 paragraphs. Keep it casual. Let me write the final.


  Also mention the tub-drumming and skull anecdotes as shared ground (paraphrase,
  no quotes): "the bit where he drums on a pot after his wife dies" — that should
  be recognizable. The skull story: he finds a skull, asks it how it died, dreams
  the skull says death is better than life, and when offered return to life the skull
  refuses (in the dream). Paraphrase without quotes.


  One more niche injection: maybe the "hibernation bridge" isn''t needed; cryonics
  + griefbots suffice. Could also add a third twist: longevity escape velocity / radical
  life extension. Two cases is fine; maybe add a quick third about life-extension
  as an optional. Keep to two main plus the extrapolation-breakdown flag.


  Final prompt, British English, casual, one or two typos.'
