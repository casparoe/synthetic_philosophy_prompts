  isn''t causation, the heroin epidemic was already burning itself out, and they bundled
  in a ton of treatment funding." Nobody ever says what would actually settle it.
  So here''s what I want...


  Describe facts: 2001, Portugal decriminalized possession of small amounts of all
  drugs (administrative offense, "dissuasion commissions"), expanded treatment and
  harm reduction. After: drug-related HIV infections dropped, overdose deaths stayed
  low, lifetime use didn''t spike. Confounds: the heroin crisis of the 90s had arguably
  peaked already; policy was a bundle.


  Ask: analyze through counterfactual theory (Lewis-style: C caused E iff in nearest
  world without C, no E) vs interventionist (Woodward: C causes E iff some intervention
  on C changes E). The interventionist problem: "decriminalization" is not a clean
  intervention variable — wiggling it wiggles lots of things; the counterfactual problem:
  what''s the nearest possible world where Portugal doesn''t decriminalize — backtracking,
  underdetermination. Which theory gives a more satisfying verdict on "did decriminalization
  cause the improvement"? Commit: pick one, say whether on that theory the answer
  is yes/no/"the question is ill-posed." End with "Verdict:" line.


