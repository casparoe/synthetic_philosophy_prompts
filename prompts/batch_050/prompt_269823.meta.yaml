  the salient facts in the prompt. The causal question: correlation vs causation;
  confounders (heroin crisis was already declining, methadone expansion, the policy
  bundled treatment). Counterfactual theory: would outcomes have been worse without
  the policy? Interventionist: what happens when you intervene on X holding other
  things fixed — the problem is the policy was a bundle, not a clean intervention.
  Great material: interventionism needs well-defined interventions (Woodward), and
  "decriminalization" is a fat hand / ambiguous intervention; counterfactuals need
  a nearest possible world and backtracking issues. Ask which theory does better on
  this case — a real test of the theories.


