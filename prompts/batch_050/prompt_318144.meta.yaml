  Design idea: "The Bridge at Kestrelwick" — an invented incident so no prior knowledge:
  a town''s market-day bridge collapse. Materials: a deck of "fact cards" (singular
  particulars: inspector was hungover, rivets from a budget batch, the mill owner
  lobbied against repairs, market day doubled the load, etc.) and a deck of "law cards"
  (general regularities with different scopes). Round 1: teams build the best explanation
  of the collapse using cards. Round 2: the "Inquiry Rule" — a mock official inquiry
  accepts only law-backed explanations (covering-law constraint); teams must defend
  explanations using law cards, feeling what gets lost. Round 3: reversal — a novelist/jury
  constraint that forbids general statements (pure narrative), feeling what gets lost
