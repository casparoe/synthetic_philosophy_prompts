  Classic: Lucas''s argument — (1) any consistent machine/model M cannot prove G(M);
  (2) humans can see G(M) is true; (3) so humans aren''t machines. This seems to prove
  too much because: the "seeing" relies on assuming consistency of M; if human mathematicians
  themselves are consistent machines... Also the argument seems to prove that no consistent
  formal system can be a mind, which would include any AI — fine for anti-mechanists
  — but it also seems to prove humans can consistently assert their own Gödel sentence,
  which they can''t.


  Alternative: alignment problem domain with "prove too much": an argument that alignment
  is impossible because any specification can be gamed (Goodhart), proving too much
  since human institutions also function... Could work but Gödel is more "in the weeds"
  and well-suited to a software engineer narrator.


  No quotes needed. Write it.


  Design the argument to contain a subtle flaw: the slide between "the human can see
  G(M) is true" and "the human can prove/utter G(M) as a theorem", and the assumption
  of the human''s own consistency. Actually the classic objection: Lucas''s argument
  requires that the human know M is consistent; a machine can also "see" G(M) true
  conditional on consistency. And the argument proves too much: it would show that
  no formal system could model a mathematician, including the mathematician''s own
  reasoning when formalized — i.e., it would show mathematicians can do something
  no consistent system can, which applied to themselves yields inconsistency (they
  could Godelize their own output).


  Let me construct numbered premises:


  (1) For any consistent formal system F powerful enough for arithmetic, there''s
  a sentence G(F) true but unprovable in F.

  (2) If my mind is a machine/formal system F, then everything I can come to know
  by mathematical reasoning is provable in F.

  (3) But given any candidate F, I can, by reflecting on the construction, come to
  know G(F) is true.

  (4) So no F exhausts my mathematical knowledge; my mind is not a machine.


  Seems to prove too much because: apply to the human community of mathematicians
  / to any actual theorem-prover practice — it seems to show that no formalizable
  practice can capture mathematics at all, so mathematics itself (as done via formalizable
  proofs, e.g., ZFC) is impossible or that mathematicians can know truths inconsistent
  with their own consistency. Also: an AI running the same argument about itself would
  conclude it''s not a machine while being one — so the argument must be unsound since
  the machine can utter it.


  The flaw: premise (3) — knowing G(F) requires knowing F is consistent; a machine
  F can equally "accept G(F) conditional on Con(F)". The human''s confidence in their
  own consistency is exactly what the machine lacks about itself... and humans can''t
  know their own consistency either (if consistent, by Gödel II). Also equivocation
