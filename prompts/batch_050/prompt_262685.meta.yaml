  "Karma is sometimes defended as the purest theory of moral desert: it delivers proportionate
  outcomes without a judge, and it never makes the mistakes human institutions make.
  Design a thought experiment to test that claim. Specifically, construct a single
  realistic scenario — no more than a paragraph, no gods dispensing rewards, no narrator
  stating anyone''s karmic balance — in which (a) an intention-centered karmic account
  (karmic weight tracks the agent''s intention, not the outcome) and (b) an outcome-sensitive
  desert account (what one deserves tracks what one actually did, including its consequences)
  deliver opposite verdicts about two characters who perform outwardly identical actions
  with divergent results purely by luck, and (c) the case shows which of the two accounts
  can still call itself a theory of desert at all, given the control condition (people
  deserve things only for what was up to them).


  Constraints: the divergence in outcomes must be due to ordinary moral luck (e.g.,
  whether a pedestrian happened to step into the road), the two characters must be
  matched in intention, effort, and foresight, and the verdicts must fall out of the
  theories rather than be stipulated.


  After the scenario: state each theory''s verdict and its reasoning; identify the
  single feature of the case that makes the two theories peel apart, and say whether
  removing that feature collapses the case into agreement; and give the strongest
  move available to the outcome-sensitive theorist who wants to deny that the lucky
  character deserves more blame (or the intention theorist who wants to accommodate
  differential treatment despite identical intentions). Finally, note honestly where
  the scenario leans on a contested reading of karma — e.g., where treating karmic
  weight as intention-only flattens traditions in which results, ripening conditions,
  or the agent''s overall mental cultivation also matter.


