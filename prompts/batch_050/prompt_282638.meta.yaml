  I had a long argument with a friend last night about Mill''s The Subjection of Women,
  and although it ended amicably I came away with the nagging sense that I had lost
  to something other than a position. Mill''s claim, roughly, is that what passes
  for the nature of women is an artificial product of the circumstances in which women
  have been raised and confined, so that current social arrangements cannot be justified
  by appeal to a nature those arrangements themselves produced. My friend defended
  the appeal to nature; I pressed Mill''s objection. What I want to ask about is not
  who was right. It is a pattern in how my friend''s side of the argument behaved,
  which I only saw clearly afterwards, and which I suspect is common enough to have
  a name.


  The pattern had, so to speak, two settings. Whenever some observable fact fit his
  picture — the sex composition of some profession, an average difference in temperament
  or preference — he cited it as straightforward evidence about what men and women
  naturally are: the world is telling us something, and arrangements merely register
  it. But whenever I argued that the observation was contaminated, that we have never
  once observed women or men outside arrangements that push them toward precisely
  those outcomes, he did not defend the inference. He shifted to a different claim:
  that since nobody can know what the sexes are like independently of upbringing and
  expectation, the question of nature is unanswerable — and that an unanswerable question
  is a reason to leave existing arrangements as they are. So "nature" was legible
  when the evidence suited him and illegible when the objection landed, and I noticed
  that the illegibility was never treated as neutral: ignorance about nature, in his
  hands, always counted in favor of the status quo, never against it. I should add
  that I don''t think any of this was deliberate. He seemed to experience himself
  as holding one steady view.


