  to nature — inferring how things ought to be from how they supposedly are — describes
  only the first setting and misses the oscillation. A motte-and-bailey, where someone
  alternates between a bold claim and a timid one, is closer, but in the cases I''ve
  heard discussed the timid position is a retreat held only until the challenge passes,
  whereas here the modest claim — nature is unknowable — was doing positive argumentative
  work: it was recruited as a premise for keeping things as they are, not merely as
  shelter. Is there an established name for this pattern, in rhetoric, informal logic,
  or elsewhere — and if there are several near neighbors, how exactly does the thing
  I''ve described differ from each, and which fits best? If nothing fits, I would
  rather have a coined term with a real definition than a forced identification: necessary
  and sufficient conditions, whether the asymmetry of the ignorance (counting only
  for one side) is essential or just typical, and a few boundary cases — for instance,
  whether the same pattern occurs when the inscrutable thing appealed to is not nature
  but tradition, or divine intention, or what an unregulated market would produce;
  and whether it still counts as the same pattern when the speaker is perfectly sincere
  throughout, as I believe my friend was. A bare label without the carving would not
  answer my question.


