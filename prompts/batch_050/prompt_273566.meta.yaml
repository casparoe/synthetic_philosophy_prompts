  At a rationality meetup last week, two attendees — call them Dana and Morgan — got
  into an extended argument about price controls, and I found myself unable to settle
  it. I''d like an adjudication.


  Background both accepted: a minimum wage is a price floor in the labor market and
  rent control is a price ceiling in the housing market, and the textbook treatment
  of each is symmetrical — floors generate surpluses, ceilings generate shortages,
  both create deadweight loss when markets are competitive.


  Dana''s opening position: anyone who supports a minimum wage while opposing rent
  control (or vice versa) is being inconsistent... The same supply-and-demand machinery
  applies; the asymmetry is pure politics — which groups one sympathizes with (workers,
  tenants) vs which groups one doesn''t (employers, landlords).


  Morgan: symmetry breaks because of market structure. Low-wage labor markets are
  plausibly monopsonistic — employers have wage-setting power because switching jobs
  is costly — and under monopsony a moderately binding floor can raise both wages
  and employment. Rental housing, by contrast, has many competing landlords, so the
  competitive model applies and the ceiling just creates shortages and under-maintenance.


  Dana round 2: grants monopsony in principle but says it''s doing too much work —
  the same logic runs the other way: in tight urban housing markets, individual landlords
  with desirable units have local market power, so a ceiling could in theory expand
  what''s offered; and nobody who cites monopsony for labor seems interested in that
  parallel. Also: even granting monopsony, it only justifies the wage up to a point;
  above the competitive wage the floor still costs jobs, and nobody knows where that
  point is, so the monopsony argument licenses a kind of motivated calibration.


  Morgan round 2: says the deeper asymmetry is dynamic: housing supply is highly elastic
  in the long run because new construction responds to returns, so a ceiling''s costs
  compound over decades; labor supply to a particular low-wage segment doesn''t shrink
  comparably, since workers can''t be built or demolished. Dana replied that this
  cuts against Morgan''s politics as much as for it: labor is also a long-run investment
  decision — human capital, migration, family size — ...


  Morgan''s final move: shift to ethics — there''s a difference between telling someone
  they may not sell their own labor below a price (arguably paternalistic protection
  of the seller) and telling someone they may not charge more for their property (restriction
  for the benefit of a counterparty). A floor protects the constrained party; a ceiling
  constrains one party to benefit another. Dana: that gets the direction backwards
  — the minimum wage forbids the worker from accepting a deal they might want, and
  rent control can equally be framed as protecting tenants... both restrict freedom
  of contract between consenting adults, and dressing one up as protection and the
  other as expropriation is exactly the motivated reasoning Morgan accused others
  of.


