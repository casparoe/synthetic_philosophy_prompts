  I am a fifth-year PhD student in philosophy, working on philosophy of mind, and
  through a training arrangement between my department and the university hospital
  I serve as the graduate-student member of the hospital''s clinical ethics committee.
  At next Thursday''s meeting the committee must issue a written opinion on the case
  below, and the chair has asked me to produce the draft. I would like you to write
  that draft.


  The patient is a 58-year-old man who, three years ago, underwent an anterior cingulotomy
  for intractable chronic pain after failed back surgeries. The operation worked,
  in a manner of speaking: he developed pain asymbolia. He says he still feels pain,
  locates it accurately, and rates its intensity much as before (he will report 8
  out of 10 for a fresh burn), but it no longer bothers him — he compares it to noticing
  that a room is warm. Neurology and psychiatry have evaluated him twice: the change
  is stable and specific, he shows no general flattening of affect, no cognitive impairment,
  and he passes every standard capacity assessment without difficulty.


  Two consequences bring him to us. First, because pain no longer alarms him, he has
  accumulated serious injuries — a fractured foot he walked on for six weeks, second-degree
  burns from a stove. He now checks his body every evening, in his words, the way
  other people check their email. Second, he needs repeated surgical debridement on
  that foot to keep the leg. He consents to the surgery but refuses anything beyond
  minimal local anesthesia, saying the pain gives him no reason to accept sedation
  he dislikes, and he would rather read through the procedure. Our pain-management
  policy, written for ordinary patients, says that pain is whatever the patient reports
  it to be and that self-reported pain above a threshold must be treated; the pain
  service is split over whether that policy obligates them to medicate a man who reports
  severe pain and asks them not to. His sister, who is his healthcare proxy only if
  he loses capacity, has asked the committee to find that a man whose pain does not
  move him lacks the insight to refuse either anesthesia or the supervised living
  arrangement she is proposing.


  Please draft the opinion, 1,000–1,300 words, in a form the committee could adopt:
  a clear bottom line on both the anesthesia question and the capacity question, a
  concrete course of action with a review timeframe, and the reasoning behind each.
  The committee will not be satisfied with a verdict that hides behind a definition,
  so the draft must take a position on the conceptual question the case poses — where
  the badness of pain resides if not in its sensory intensity, and what follows for
  a duty to relieve pain that is felt but not minded — while still engaging the strongest
  consideration on the losing side of each question: for the anesthesia question,
  the pain service''s worry that something is owed to severe reported pain regardless
  of how it is experienced, and for the capacity question, the sister''s point that
  his preferences are now formed without the signal on which everyone else''s prudential
  judgment relies. Finally, include a short implementation note (who does what before
  and after the first procedure), and flag any point where you think the committee
  is making a policy judgment rather than following a conceptual argument, so that
  members can see where the discretion lies.


