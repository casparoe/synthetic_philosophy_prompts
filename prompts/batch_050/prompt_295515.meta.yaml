  \ it might reduce attainable utility of some goals too. AUP predicts: irreversibility\
  \ matters, option value matters.\n4. Relative reachability: penalize making states\
  \ unreachable.\n5. Human-consent-based: side effect is fine if a human would consent\
  \ / approve.\n6. \"Preserving human empowerment\" — penalize reducing humans' attainable\
  \ utility specifically.\n\nSo I want earlier verdicts consistent with at least two\
