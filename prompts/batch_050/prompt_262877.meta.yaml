  is morally better than the cold duty-follower; overdetermination cases (Schiller''s
  worry).

  3. Belief that motives matter for blame/praise (e.g., someone who saves a child
  to get on camera deserves less praise).

  4. Belief that you can''t control your motives directly, so we shouldn''t blame
  people for what they can''t control (control principle).

  5. Maybe: acting from the motive "because it''s right" can be fetishistic (Michael
  Smith''s moral fetishism argument) — the good person cares directly about their
  friend, not about morality.

  6. Maybe: verdict on cases — e.g., the businessperson who gives correct change out
  of honesty-as-policy; the person who visits friend in hospital out of duty vs. friendship
  (Stocker''s schizophrenia of modern ethical theories).


  Design a set with genuine tensions:


  (a) Actions have moral worth only when done for the right reasons, and the right
  reason is that it''s morally required (de dicto duty motive).

  (b) Smith''s fetishism point: the good person visits the hospital because she cares
  about her friend, not because morality requires it; so verdict: the caring visitor
  has more moral worth than the duty visitor.

  (c) Control principle: praise/blame only for what''s under our control; but motives
  aren''t directly controllable... yet still evaluate motives.

  (d) Also maybe: moral worth comes in degrees and tracks the quality of the motive;
  and a verdict that someone who does the right thing from bad motives (saving a drowning
  child for reward money) does the right thing and the action is right, but has no
  moral worth — consistent with act/motive distinction.


