  Idea: an argument that cluelessness refutes expected value reasoning entirely, built
  from plausible premises:


  1. Rational choice under uncertainty = maximise expected value.

  2. Expected value requires being able to compare probability-weighted consequences.

  3. Any action''s consequences ramify forever (butterfly effects, population effects).

  4. For any action, the far-future consequences swamp the near-term ones in expected
  value (huge magnitudes).

  5. We have no non-arbitrary probabilities for far-future effects (or they are symmetric,
  or unknowable).

  6. So expected values are undefined / all equal / unknowable.

  7. So expected value reasoning can''t guide any choice — including whether to donate
  to charity vs. set money on fire, or whether to stop a mugging.

  8. But obviously it can guide those choices. Contradiction. So something in 1-5
  is false.


