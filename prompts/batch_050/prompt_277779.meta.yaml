  The wrong kind of reasons problem: the fitting-attitude analysis of value says something
  is valuable iff it''s fitting/appropriate to have pro-attitudes toward it. The problem:
  there can be reasons to desire something that don''t relate to its value — e.g.,
  a demon threatens to punish you unless you admire a saucer of mud (Rabinowicz &
  Rønnow-Rasmussen''s example). Those are "wrong kind of reasons."


  To make it in-the-weeds, inject a novel scenario/distinction. Maybe combine with
  a constructed case: state-given vs object-given reasons distinction (Parfit/Hieronymi).
  I could craft a prompt asking to explain the wrong kind of reasons problem and apply
  it to a novel case — e.g., a tie-in with fitting-attitude analyses, and distinguish
  "wrong kind of reasons" responses: the distinction between state-given and object-given
  reasons, the "buck-passing" account.


  A good prompt: a graduate student scenario, describe a slightly novel variant of
  the demon case, ask to explain the problem, distinguish the main strategies (state-given
  vs object-given reasons; the conflation of reasons to desire vs reasons to bring
