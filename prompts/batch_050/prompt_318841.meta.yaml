  I teach epistemology and the philosophy of law, and I am preparing a seminar unit
  on what the law of evidence assumes about belief. I would like your reconstruction
  of an apparent puzzle.


  Anglo-American courts grade their standards of proof. A civil plaintiff need only
  show that her claim is more probable than not; a criminal prosecutor must prove
  guilt beyond a reasonable doubt; a handful of determinations — civil commitment,
  termination of parental rights, allegations of fraud — require an intermediate "clear
  and convincing" showing. The same evidence, on the same facts, can therefore justify
  a judgment for damages against a man and fail to justify his conviction, and juries
  are instructed in exactly these terms: they are to decide whether the facts have
  been established to the required degree, not to weigh what hangs on their verdict.
  [Hmm — actually the practice: juries are told to apply the standard; the standard
  itself encodes stakes.]


  In The Will to Believe, William James writes: [chemist quote]. James''s suggestion
  is that the extent to which one counts as believing a hypothesis tracks what one
  is prepared to stake on it.


  Questions:

  1. Reconstruct the implicit epistemology of the graded standards of proof. Does
  the practice presuppose that how much evidence justified belief requires varies
  with the practical stakes of being wrong — the view epistemologists call pragmatic
  encroachment — or is it equally well explained by a purist picture on which the
  epistemic threshold for belief is fixed, and only the decision about how to act
  on a belief varies with the costs of error?

  2. Where is the practice genuinely underdetermined... what institutional observation
  would discriminate between the two readings? E.g., consider how judges instruct
  juries: "you must be persuaded beyond a reasonable doubt" — belief-language, not
  utility-language. Does that favor encroachment reading?

  3. Apparent internal tension: within a single case the law insists the factual question
  has one answer yet licenses different verdicts on identical evidence depending on
  what follows. Is that coherent on the purist reading? On the encroachment reading?

  4. What would have to change if we adopted the rival view: if pragmatic encroachment
  is false, are graded standards a mistake — should courts instead fix one epistemic
  threshold and let judges adjust remedies/punishments? Conversely, if encroachment
  is true, should we extend grading further — e.g., higher standard for capital cases,
  lower for small claims?


