  Domain: Revealed preference and the meaning of utility. Positions in the debate:

  - Samuelson''s original revealed preference: utility is just a construct for summarizing
  choices; WARP/SARP; discard mentalistic utility.

  - Behaviorist reading: choices ARE preferences; nothing more to say (Hausman critique).

  - Utility as representation theorem: if choices satisfy axioms (completeness, transitivity,
  continuity), there exists a utility function representing them — but the function
  is ordinal, not cardinal, and unique only up to monotonic transformation.

  - Mentalist/deflationary debate: does utility mean anything beyond choices? Critics:
  people choose against their preferences due to weakness of will, framing effects,
  preference reversals (Lichtenstein & Slovic), context effects (decoy effects / asymmetric
  dominance), menu dependence.

  - "Choice ≠ welfare": Kahneman''s experienced utility vs decision utility; Bernheim
  & Rangel behavioral welfare economics (choice with limited attention); Sugden''s
  opportunity criterion ("The opportunity criterion").

  - GARP (Afriat''s theorem) — generalized axiom of revealed preference.

  - Amartya Sen''s critique: "Rational fools" — consistency of choice as an internal
  property, choice functions need external reference; menu-dependence (choosing the
  second-largest apple from a two-fruit basket vs a three-fruit basket).

  - Sen''s example: choosing the last apple / the tea example: offered tea or nothing,
  take tea; offered tea, coffee, or nothing, take nothing — inconsistency requires
  interpretation.


