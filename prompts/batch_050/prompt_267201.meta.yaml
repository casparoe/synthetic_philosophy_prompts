  \ be: facts/propositions can't be unified by relations because relating requires\
  \ further relations, ad infinitum — so either there are no propositions/facts, or\
  \ predication is impossible... Actually a classic Bradley-style argument purporting\
  \ to show that there are no facts, or that the world is an unstructured blob.\n\n\
  Construct an argument: \n(1) A proposition is more than a mere list of its constituents;\
  \ \"Socrates is wise\" differs from {Socrates, wisdom}.\n(2) What distinguishes\
  \ a proposition from a list is something that unifies the constituents.\n(3) Whatever\
  \ unifies them must itself be a constituent or item related to them (if it's a further\
  \ entity).\n(4) If the unifier is a further entity, it must be related to Socrates\
  \ and wisdom by yet another relation, requiring a further unifier — regress.\n(5)\
  \ An infinite regress of entities each requiring the next is vicious; nothing gets\
  \ unified at any stage.\n(6) So nothing can unify the constituents.\n(7) So there\
  \ are no propositions / no facts / nothing is true or false.\n\nThat's the standard\
  \ Bradley regress leading to monism or the denial of facts. Make it seem to prove\
  \ too much: \"there are no facts, nothing is ever the case.\"\n\nThe asker wants\
  \ to keep (1) perhaps, and wants to know which premise to give up and costs. Good\
