  So the asker could be considering children themselves, and witnessed the debate
  at a dinner between two friends.


  Structure: four numbered moves, back-and-forth, each side decent. Then adjudicate
  move by move, ratings. Also epistemic request: say what would change its mind /
  where reasoning most likely to fail. Format: machine-readable final line, e.g.,
