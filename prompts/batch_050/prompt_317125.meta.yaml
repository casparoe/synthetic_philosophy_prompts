  that rejecting comparisons has costs, but maybe it conflates "worse for" with "impersonally
  worse"); move (4) the impersonal-value escape hatch — strong but must address Benatar''s
  response that the asymmetry itself is impersonal, or that the asymmetry is needed
  to explain other intuitions (e.g., asymmetry of procreation duties: we have a duty
  not to create suffering lives but no duty to create happy ones). Actually a really
  good answer notes that Benatar motivates the asymmetry precisely with such intuitions
