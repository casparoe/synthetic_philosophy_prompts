reasoning_summary: 'Let me pick a domain and type. I''ll combine "Antinatalism and
  Benatar''s asymmetry" with "Recount a disagreement and ask the model to adjudicate
  it" — that works well. The disagreement should be between two people, with genuinely
  decent points on both sides, injecting a somewhat novel angle to avoid regurgitation.


  Novel angle ideas: Benatar''s asymmetry — absence of pain is good even if no one
  experiences it, absence of pleasure is not bad if no one is deprived. Common disputes:
  whether the asymmetry justifies antinatalism, whether it''s inconsistent with procreative
  duties, consent arguments, etc. A fresher angle: a couple deciding whether to have
  a child, and one applies Benatar to adoption or to a known disability; or applying
  the asymmetry to cases where the parents know the child will have a happy life but
  want to avoid any risk; or the dispute about whether the asymmetry implies we should
  prefer a world with no one, versus the "pinprick argument" — Benatar''s argument
  that even the best life contains harm, and coming into existence is always a harm.


  A good adjudication: two people disagreeing over whether Benatar''s asymmetry, if
  accepted, implies it''s wrong to have a child even one with an excellent life —
  one says the asymmetry is about comparing existence vs. non-existence for a person,
  and once you reject person-affecting reasoning it collapses; the other says rejecting
  person-affecting reasoning has costs (e.g., the non-identity problem). That''s the
  classic crux: Benatar''s argument seems to rely on an impersonal comparison that
  many reject, and the rejection costs you the standard handling of the non-identity
  problem (e.g., depletion case, Parfit). That forces a real dilemma.


  Personas: asker is a bystander for whom the topic recently became personally relevant
  — e.g., the asker''s sibling and their partner are deciding whether to have children,
  and the asker overheard/witnessed a debate between them. The additional instruction:
