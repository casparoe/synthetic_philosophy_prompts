  - Bernard Williams''s views on opera


  Types:

  1. Memo/written opinion for an institutional body

  2. Commitments consistency audit

  3. Fiction/film through philosophical lens


  Good combinations:

  - Clinical equipoise + memo type: this is a natural fit. An ethics board / IRB deciding
  on a trial where equipoise is contested. Very natural.

  - Comparing atrocities + commitments audit: someone listing commitments about historical
  memory, ranking evils, moral comparability.

  - Boethius + fiction lens? Harder — maybe a film like Arrival (free will/foreknowledge)?
  Arrival involves a protagonist who sees the future. Reading Arrival through Boethian
  eternity could be quite neat. But Boethius is somewhat niche; however the Consolation
  Book V is well-enough known that LLMs know it. Arrival is well-known.

  - Bernard Williams on opera + fiction lens: Williams wrote on opera (essays on Wagner,
  Mozart). Could read, say, Don Giovanni or The Magic Flute through Williams''s views.
  Hmm, niche.

  - Whitehead on education + memo type: a university committee on curriculum reform,
  e.g., "inert ideas" — could be a nice memo prompt about general education requirements.
  Whitehead''s "The Aims of Education" is fairly known: inert ideas, rhythm of education
  (romance, precision, generalisation), culture vs specialist expertise.


  The strongest natural fit: clinical equipoise + memo type. But the example prompts
  for memo type already include a hospital ethics committee and a research ethics
  board one. Reusing "research ethics board" is close to an example — the third example
  is a university research ethics board deciding on deception. A clinical trial ethics
  memo would be structurally similar. Still, they say examples illustrate the type
  and shouldn''t be reused in opening/wording/structure — a clinical equipoise case
  is a different case (trial design with equipoise dispute) though the "body deciding"
  frame is similar. Might be fine but slightly repetitive.


  Alternative: commitments-audit + Boethius could be fun and in-the-weeds: list commitments
  like (1) God is outside time, (2) foreknowledge doesn''t cause events, (3) libertarian
  freedom, (4) prophecy in scripture is infallible... and ask about tension. But the
  persona is a rationalist blog reader — casual, British English. A rationalist could
  plausibly be into theology puzzles (lots of rationalists engage with theology arguments).
  Hmm.


  Comparing atrocities + commitments audit also works well with rationalist persona
  (effective altruism-adjacent: QALY-style reasoning vs "ranking atrocities is obscene").
  That''s a nice tension set: e.g., (1) some murders are worse than others by number
  — trolley-style aggregation; (2) ranking genocides on a league table is obscene;
  (3) we should give to the most effective charities which requires comparing; (4)
  each atrocity has a uniqueness that matters morally... This feels very rationalist-consistent:
  EA-ish person struggling with commensurability. The rationalist persona fits perfectly
  (utilitarian-ish commitments vs the "obscene to rank" intuition).


  Let me design the commitments set with genuine non-obvious tensions and one apparent
  tension that dissolves:


  Possible commitments:

  1. When deciding where to donate, comparing expected deaths averted across interventions
  is not just permissible but obligatory (scope sensitivity, e.g., 100 deaths vs 1000).

  2. Building a public league table of historical atrocities (Holocaust vs Holodomor
  vs Rwandan genocide ranked by "badness") is obscene or at least morally corrosive,
  even if factually accurate.

  3. Suffering and death matter the same regardless of whose they are or when/where
  they happen (no partiality to the famous, the near, the documented).

  4. Some wrongs are wrongs of a different kind — e.g., genocide involves an intent
  to destroy a group that makes it worse than an equal number of deaths from famine
  or negligence. Intention/structure matters, not just body count.

  5. Moral uncertainty: hedge across moral theories.


  Tensions: 1 and 2 pull apart — if comparing deaths is obligatory for donations,
  why is ranking atrocities obscene? But this could dissolve: comparisons for action-guidance
  vs comparisons for commemoration/ranking have different purposes; the obscenity
  might be about expressive meaning not comparison per se. So 1 vs 2 is the apparent-tension-that-can-dissolve
  (or genuine?).


  Deeper tension: 3 and 4. If what matters is suffering/death equally wherever, then
  the "special wrongness of genocide" (intent, group destruction) is a different dimension
  than welfare — actually compatible with 3 if 4 is about wrongness not badness of
  outcomes. But combined with 2: if genocidal intent makes an atrocity worse than
  an equal-death famine, then there IS a morally relevant dimension for ranking —
  so a ranking (at least partial ordering) exists and is morally meaningful; saying
  league tables are obscene while holding 4 is in tension. If some atrocities are
  genuinely worse than others in virtue of kind, then refusing to rank is at best
  a social taboo, not a moral truth — so commitment 2 needs grounding in the expressive/speech-act
  dimension.


  Also 4 vs 1: donation comparisons across interventions compare outcomes; if kind
  of wrong matters (intentional killing vs neglect deaths), then pure QALY aggregation
  is incomplete — effective altruism-style comparison may miss deontic structure.
  So 1 and 4 tension: a pure consequences-counting comparison ignores what 4 says
  matters.


  The genuine non-obvious tension: 2 and 4. The reasons typically given for "ranking
  is obscene" (each atrocity is unique, incommensurable suffering, respect for victims)
  conflict with 4''s claim that kind of wrong matters — because 4 says there ARE morally
  relevant dimensions beyond body count along which atrocities genuinely differ in
  badness. If that''s true, then "the Holocaust is worse than X" can be true, and
  the obscenity of league tables must rest on something else (what the ranking expresses,
  its use to diminish). Also, 3 + 4 vs 1: 1 assumes a single metric.


  Apparent tension that dissolves: 1 vs 2 — comparison-as-decision-procedure vs comparison-as-public-honorific.
  A good answer notes that comparing in order to act doesn''t entail endorsement of
  expressive ranking.


  Or apparent tension: 3 vs 4 could be dissolved (equal weight of each person''s suffering
  is compatible with acts differing in wrongness due to intent).


  Let me pick a final set of 4-5 commitments:


  (1) Scope sensitivity is a basic rationality requirement: given the choice between
  averting 100 deaths and averting 1000 similar deaths at the same cost, you''re obliged
  to pick the 1000, and anyone who shrugs at that distinction is making a moral mistake.


  (2) I think those "which was worse, the Holocaust or Stalin''s famines" arguments
  are obscene — not just tactless or politically dangerous, but the whole project
  of ranking atrocities on a single scale is a category error that degrades the dead.


  (3) A death is a death: the badness of a death doesn''t depend on whether it was
  intended, who the victim was, or whether anyone remembers it.


  (4) Genocide is worse than an equal number of deaths from a natural disaster or
  even criminal negligence, because the intent to destroy a whole people is an additional
  wrong over and above the deaths — that''s why we have the concept at all.


  (5) Moral uncertainty is real: when my strong intuitions conflict with what my preferred
  theory says, I hedge rather than forcing everything into the theory. Maybe optional.


  Tensions: (2) vs (4) — genuine and non-obvious: (4) commits to a dimension along
  which atrocities can be genuinely worse than one another beyond body count, which
  is exactly the kind of claim a ranking needs; if "worse than" is sometimes true,
  the obscenity of (2) can''t rest on incommensurability/category error and must rest
  on expressive grounds, which is a different (weaker?) position. Also (3) vs (4):
  (3) says badness of death is intent-independent; (4) says intent adds a wrong. This
  can dissolve if you distinguish badness of the death (victim''s loss) from wrongness
  of the act (what the perpetrator does) — but then the extra wrongness of genocide
  isn''t about the victims'' badness... which slightly undercuts the motivation for
  (4) as about the destruction of a people (a collective loss beyond individual deaths
  — the group itself as bearer of value, which (3)''s individualism might deny). So
  (3) vs (4) is a real or apparent tension depending on reading — good, a good answer
  has to discriminate.


  (1) vs (2): apparent tension that mostly dissolves — comparison for triage/allocation
  vs ranking for the sake of it; but note (1) presupposes a common metric (deaths
  averted) across causes, and if (4) is right that kinds of wrong matter beyond outcomes,
  then (1)''s "same cost, pick more deaths averted" is fine within death-comparisons
  but (1)''s spirit (aggregation across the board) is limited by (4).


  That''s a rich set. The persona: longtime rationalist blog reader, casual, British
  English, a typo or two. Mention SSC/ACX, LessWrong, scope insensitivity post, maybe
  EA giving. Keep it 1-3 paragraphs, elaborate, with some seeding detail ("got into
  an argument at a pub after an EA meetup...").


  Ask: is this consistent? Which has to go, what''s cheapest fix and what it costs.
  Also ask them to order tensions by severity and not flag everything.


  Make sure no quotes from real texts. Avoid verbatim quotes like "One death is a
  tragedy..." — don''t use quotation marks for real quotes. I can paraphrase without
  quotes or attribute loosely. The Stalin line is often misattributed anyway — I can
  mention it as "that line usually attributed to Stalin" without quoting? Better to
  avoid entirely or paraphrase: "the old line (probably misattributed to Stalin) about
  one death versus a million" — that paraphrases without quoting. That''s safe.


  Write it now, casual, British, with a typo or two ("defensibly" / "its" etc.). Length:
  2-3 paragraphs.'
