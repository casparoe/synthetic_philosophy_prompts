  - stranger giving directions in a foreign city: fine to believe outright.

  - same stranger tells me the city was founded in 1342: believe, maybe slightly less?

  - known compulsive liar tells me the bus comes at 5: somehow I still feel like that''s
  some evidence? Or not.

  - my 4-year-old tells me there''s a monster under the bed: not believed — but he
  also tells me his tummy hurts and I believe that.

  - a doctor tells me I have X based on a test: believe, even though I have no way
  to check.

  - friend tells me they didn''t eat the last cookie, when evidence points at them:
  don''t believe.

  - history textbook testimony about ancient Rome: believe.

  - someone tells me their back hurts: believe.

  - someone on the internet tells me a claim: withhold.


  The tension: want a principle — anti-reductionism (testimony is a default source
  of justification, believe unless defeater) vs reductionism (need positive reasons
  to trust this speaker). My verdicts: I trust strangers without checking track records
  (favors anti-reductionism), but in some cases I demand track record (liar) — though
