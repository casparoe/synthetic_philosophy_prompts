  huge payoff) or testimony (verdicts on cases of accepting testimony). Let me do
  testimony: verdicts on cases — trusting a stranger for directions, trusting a doctor,
  trusting a child, trusting a known liar about something trivial, trusting someone
  about their own mental states, historical testimony, etc. Ask what principle captures
  them — reductionism vs anti-reductionism naturally falls out. Nice.


  Alternatively Pascal''s mugging cases: pay the mugger, donate to longtermist cause,
  insurance, etc. But testimony is classic and lets cases be concrete.


