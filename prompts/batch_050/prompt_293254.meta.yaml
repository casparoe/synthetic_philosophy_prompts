  Specification idea: The classic bootstrapping worry (Vogel, Cohen): using a gauge
  to confirm that the gauge is reliable, or deducing "the wall is red" then "it looks
  red, so my color vision worked" repeatedly to conclude reliability. Construct a
  case where this style of reasoning seems perfectly fine — i.e., epistemically circular
  reasoning that is intuitively legitimate — and a structurally parallel case where
  it''s clearly illegitimate, with everything held as fixed as possible. Then isolate
  which feature flips the verdict. Theories to run: reliabilism, evidentialism, or...
  better: basic-knowledge view vs. requiring antecedent justification for source reliability.
  Also the "easy knowledge" closure step.


  Specs to give:

  - Two scenarios, ordinary life, no demons/no perfect hallucination, each no more
  than a paragraph.

  - Structurally as parallel as possible: same inferential form (reading → conclusion
  → "instrument got it right" → repeat → "instrument is reliable").

  - One intuitively fine, one clearly bad.

  - Show reasoning under: (a) the view that basic perception gives justification without
