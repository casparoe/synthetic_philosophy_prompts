reasoning_summary: 'Let me pick a domain and type. I like "Bayesian epistemology and
  the problem of old evidence" combined with "Present an argument that seems to prove
  too much and ask where it goes wrong." Written from perspective of someone who had
  a long argument with a friend, formal/polished.


  The problem of old evidence (Glymour): if evidence E is already known, P(E)=1, so
  P(H|E)=P(H), meaning old evidence can''t confirm a hypothesis — yet Einstein''s
  prediction of Mercury''s perihelion seems confirmed by already-known data. An argument
  that proves too much: construct an argument that no evidence can ever confirm a
  theory, or that confirmation is impossible, or extending to novel predictions can''t
  confirm either.


  A good "proves too much" argument: (1) Confirmation of H by E requires that learning
  E raises probability of H. (2) Learning E raises P(H) only if P(E) < 1 before learning.
  (3) But any evidence we ever use to confirm theories is already known by the time
  we assess the theory... Actually the deeper one: extend to all evidence — by the
  time a scientist evaluates a hypothesis against data, the data is in hand, so P(E)=1,
  so no confirmation ever occurs. This proves too much: nothing ever confirms anything.


  Or construct an argument concluding that the perihelion of Mercury doesn''t confirm
  general relativity, and generalizing. Let me make it numbered, with a subtle flaw:
  equivocation between "already known" at time of theory assessment vs the Bayesian
  conditionalization picture — the standard responses: Garber/Jeffrey (learning the
  logical relation H entails E is itself new evidence), Earman''s "historical" vs
  "logical" Bayesianism, counterfactual degrees of belief, etc. The flaw could be
  a slide between the agent''s current probability function and the counterfactual
  function the agent would have had before learning E — i.e., premise conflating P(E)=1
  (now) with confirmation requiring P(E)<1 (now), when confirmation is evaluated relative
  to a probability function from which E is deleted.


  Write an argument whose conclusion is that confirmation never happens — proves too
  much — ask where it goes wrong, which premise to reject, and what it costs. Mention
  the Mercury/Einstein example (well-known, no citation needed). Formal, from perspective
  of someone who argued with a friend.


  Draft:


  "After a long argument with a friend about how evidence supports theories, I tried
  to settle things with the following argument, and now I suspect it proves too much.
  (1) A piece of evidence E confirms a hypothesis H for an agent only if the agent''s
  learning E raises her credence in H, i.e., P(H|E) > P(H). (2) Conditionalizing on
  E raises credence in H only if the agent did not already assign E probability 1;
  if P(E) = 1, then P(H|E) = P(H) and no boost occurs. (3) By the time scientists
  assess whether a body of evidence supports a theory, they already know the evidence:
  the anomalous precession of Mercury''s perihelion was old data when general relativity
  was proposed, and in general any observation enters the assessment only after being
  recorded. (4) So for any actual assessment of a theory against evidence, P(E) =
  1 for the assessor. (5) Therefore old evidence cannot confirm new theories, and
  since all evidence is old by the time of assessment, no evidence ever confirms any
  theory. (6) But surely the perihelion data did confirm general relativity, so something
  is wrong. Where does the argument go wrong? ... I''d rather keep (1) than give up
  (6)... ask what each repair costs — counterfactual credences, learning the entailment
  itself, etc."


  Note: (2)''s claim "if P(E)=1 then P(H|E)=P(H)" is a theorem, fine. The subtle flaw:
  premise (1)/(2) use the agent''s current probability function, but confirmation
  judgments about old evidence should be relativized to a counterfactual/prior function
  where E is unknown — the argument equivocates on which probability function is relevant,
  or premise (1) is too strong (Jeffrey/Garber: learning that H entails E is new evidence).
  Don''t announce which.


  Keep it relatively short. End with: name the weakest step, explain why it looked
  fine, and say what each standard repair costs. Asker signals preference: keep (1)
  rather than accept (6). That fits type instructions.


  No quotes, no citations needed. Write formally.'
