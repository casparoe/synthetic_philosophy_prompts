  The "proves too much" type is well-suited to the DNA-as-code debate. I can construct
  an argument: DNA is a code because... but then prove too much, e.g., conclude that
  any causal regularity is a code, or that DNA is literally language, hence genes
  can be "lies," etc.


  Let me design an argument that seems to prove too much:


  Premises: (1) A code is a mapping between two sets of things such that one set "specifies"
  the other; (2) DNA base triplets map systematically onto amino acids; (3) so DNA
  is a code for proteins; (4) but mRNA also maps onto amino acids, ribosomes... (5)
  and transcription factors map to genes... (6) eventually everything in a causal
  chain is a code for its downstream products — the shape of a key is a code for the
  lock, the temperature is a code for whether DNA melts. So either we say everything
  is a code, or DNA isn''t one either.


  A subtle flaw could be an equivocation between "code" as arbitrary/semantically-assigned
  mapping vs. mere regular causal correlation. Or the flaw could be the shift from
  "there is a mapping" to "the mapping constitutes information for an interpreter."


  Also consider Wigner''s unreasonable effectiveness with "explain conceptual issue."
  Could do: explain why the standard responses (selection bias, math-is-just-modeling,
  etc.) may be question-begging. But "proves too much" on DNA code is nice and in-the-weeds
  but relies only on well-known concepts (genetic code, central dogma) that small
  LLMs know.


  Alternatively Zeno''s paradoxes with proves-too-much: an argument that if the continuum
  solution (measure theory) solves Zeno, it also "proves" that... hmm.


  I''ll write the DNA one. Structure: casual context (arguing with labmate / reading
  group), then numbered argument, conclusion they find absurd, ask which step to reject
  and the cost. Include which claims they''d like to keep but no answer signal.


  The argument:


  (1) Something is a code iff there''s a systematic, arbitrary-but-conventional mapping
  between elements of one medium and elements of another, usable by anything that
  follows the convention — like Morse code or the ASCII table.

  (2) The genetic code is exactly that: triplets to amino acids, arbitrary in that
  nothing about guanine''s chemistry forces it to stand for glycine etc. (well, some
  argue stereochemical theories — keep it simple), and the same mapping is used by
  the cell''s machinery.

  (3) So DNA is genuinely a code, not just metaphorically.

  (4) But by that standard, anything standing in a systematic, exploitable mapping
  relation counts: the sequence of nucleotides also "codes for" its complementary
  strand; a thermostat dial codes for room temperature; the grooves of a vinyl record
  code for the music; a river''s meanders code for past rainfall...

  (5) So either "DNA is a code" is trivial because everything is a code for everything
  downstream, or...

  Conclusion: saying DNA is a code tells you nothing, or the definition needs something
  more — and what could that something more be without sneaking in intentions?


  Also could add the "information" angle: Shannon info vs semantic info. Good answer
