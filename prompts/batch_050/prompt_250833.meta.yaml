  He compared it to science: if the world is rationally constructed and has meaning,
  there must be an afterlife. He appealed to learning from science, said our knowledge
  is fragmentary, and that we shouldn''t be dogmatic. This is in Wang''s "Reflections
  on Kurt Gödel" and in Gödel''s collected works (volume IV/V, letters). The argument
  resembles something like: nature/God doesn''t waste potentialities — a kind of Leibnizian
  optimism.


