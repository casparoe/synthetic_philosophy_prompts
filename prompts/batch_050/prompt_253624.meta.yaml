  her ending should count as tragic.


  Round structure (4 moves, both sides decent):


  1. Marcus: the character''s life is clearly worse off — pain''s badness is in the
  sensation itself; if she still feels pain, she''s suffering harm even if she doesn''t
  mind; the condition doesn''t remove the badness, it just removes her ability to
  respond to it, which is extra tragic — like losing the alarm but keeping the fire.
  Actually wait — pain asymbolia: the sensation is there but not aversive. So the
  debate: is the badness of pain the phenomenal quality or the aversiveness?


  Move 1 (Reader A): The character isn''t suffering, so the scenes where she gets
  injured aren''t sad. Badness of pain = the hurting, the disliking. Without that,
  pain is just information. So the story can''t milk those scenes for tragedy.


  Move 2 (Reader B): She''s constantly getting maimed because pain is the body''s
  warning system — real patients with pain insensitivity die young. The badness isn''t
