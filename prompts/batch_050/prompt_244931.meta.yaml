  character position: "generalizations about peoples can be true and useful but..."
  Could do "recount a disagreement" with superrationality — two people arguing about
  one-shot prisoner''s dilemma with a clone/twin. That''s a nice setup: Hofstadter''s
  superrationality, twin PD. A bystander reports a disagreement between two friends
  about whether to cooperate against a perfect copy. That avoids regurgitation if
  framed with a twist: e.g., the dispute is about whether superrational cooperation
  differs from causal cooperation in Newcomb-like cases, or whether symmetric reasoning
  is valid.


  Alternatively, "give a list and ask for a new one" with national character: list
  of objections to national character generalizations, ask for new objection. Hmm.


  I like the disagreement type with superrationality: two friends argue about a one-shot
  prisoner''s dilemma against an exact psychological copy. Points: one says defection
  strictly dominates — whatever the copy does, defecting is better. Other says the
  choice is effectively choosing both players'' moves due to symmetry, so cooperate.
  Counterpoints: symmetry argument proves too much (would it apply against a merely
  similar opponent? where''s the threshold?); copy might use same reasoning but reasoning
  isn''t causation; evidential vs causal decision theory connection; what about a
  51%-similar twin; does superrationality collapse into evidential decision theory;
  if the reasoning is shared, you can''t reason differently — but then "choice" is
  illusory? Also the dominance argument assumes independence. Good genuine points
  on both sides.


  Make it in-the-weeds: add rounds — e.g., one invokes that if both reason identically,
  outcomes are only (C,C) or (D,D), so choose between those; other retorts this conflates
  "my reasoning determines the outcome" with "my reasoning is evidence of the outcome";
  then invoke the transparent Newcomb / CDT-EDT dispute; then a move about gradual
  similarity: at what similarity does the argument stop working — 99%? — and the response
  that the argument was never about correlation but about shared reasoning process.


  No quotes needed, no citations needed. Mention Hofstadter? Could say "a philosopher
  friend mentioned this resembles something called superrationality" — attribution:
