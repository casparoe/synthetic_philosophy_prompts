  "I''m a high school senior and I run our philosophy club. Last month we discussed
  Galen Strawson''s Basic Argument against moral responsibility... One member argued
  that the argument proves too much, because a structurally identical argument would
  show that no belief is ever rationally held. Here''s her reconstruction with the
  two arguments side by side:"


  Argument A (moral):

  (1) When you act, you act the way you do because of the way you are — your character,
  motives, values.

  (2) To be truly morally responsible for acting as you do, you must be truly responsible
  for being the way you are, at least in the respects that explain the action.

  (3) To be truly responsible for being the way you are, you must have knowingly and
  intentionally brought it about, at some earlier time, that you are that way.

  (4) But bringing about how you are at an earlier time would itself be an action
  done because of how you then were — so you''d already have had to be responsible
  for that earlier way of being.

  (5) This generates either an infinite regress of prior self-formations or an uncaused
  first act of self-creation you couldn''t be responsible for.

  (6) So no one is ever truly morally responsible for anything they do.


  Argument B (epistemic parallel):

  (1*) When you form a belief, you form it because of the way you are — your reasoning
  dispositions, standards of evidence, background assumptions.

  (2*) For your belief to be rationally held, you must be rationally in control of
  / responsible for the cognitive dispositions that produced it...

  (3*) ... which requires you to have rationally chosen them, on the basis of beliefs
  you already rationally held...

  (4*) regress.

  (5*) So no belief is ever rationally held — every belief traces back to unchosen
  cognitive equipment.


