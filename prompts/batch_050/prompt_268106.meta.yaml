  4. A specific person surviving who died young...\n\nNeed rules consistent with verdicts\
  \ but diverging on the new case. Candidate rules:\n- Rule A: contingent iff the\
  \ event is a \"small cause\" (weather, individual accidents) vs structural forces\
  \ overdetermined.\n- Rule B: contingent iff no other event in the vicinity could\
  \ play the same functional role (substitutability).\n- Rule C: contingent iff the\
  \ causal pathway to the outcome is short/direct (chaos: sensitive dependence matters\
  \ only when the outcome depends on the path through that event before other stabilizing\
  \ forces kick in).\n\nNew case: novelist's plot — in her alt-history, the Library\
  \ of Alexandria... no, too famous/regurgitable. Better: a fictional-ish but real-history\
  \ case. Say: the novel removes the 1848... hmm. Or a real case: what if Lee's Special\
