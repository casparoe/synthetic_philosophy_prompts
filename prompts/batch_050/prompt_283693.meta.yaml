  the actual dialectic (e.g., asymbolia patients show general motivational deficits,
  lobotomy affects emotional responsiveness broadly). Good seeding.


  Also, the "role" instruction: "You are an expert philosopher of mind with a specialization
  in valenced experience." "Think step by step; begin with a brief brainstorm of the
