  Passage Aristotle final cause analogy between art and nature.

  Editor''s argument:

  1. To identify a thing''s function is to identify the end for sake of which it exists
  (Aristotelian schema).

  2. In artifacts, intended end exists representationally before artifact and guides
  production.

  3. In organisms, no intention exists before parts; the only way an effect can explain
  why a heritable trait now exists is via past selection.

  4. Therefore all biological function ascriptions are historical: trait''s function
  is effect for which ancestors were selected.

  5. A newly emerged trait can contribute essentially to survival now (e. first random
  mutation enabling digestion of new toxin) even though no ancestor was selected for
  that effect.

  6. If function is end for sake of which part exists, such a trait still has function,
  because organism''s survival is the end for which trait now operates.

  7. So function is both necessarily historical and sometimes purely present-causal,
