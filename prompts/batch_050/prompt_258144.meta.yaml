  when experiences happen. Cases:


  1. Standard color phi: red dot left, green dot right, 200ms apart; subject sees
  motion and color switch mid-trajectory. Verdict: the subject never actually saw
  a red dot stationary then... hmm. The novelist gives verdicts like: "I think the
  subject really did see the color change happen where it appeared to happen" vs.
  "memory rewritten."


