  Dennett''s framework: color phi phenomenon — two dots of different colors appear
  successively at different locations; subject reports seeing a moving dot that changes
  color midway. Puzzle: did the subject experience the color change before seeing
  the second dot (impossible—would require precognition)? Stalinesque revision: the
  brain fills in the content before it enters consciousness (show trial — fabricated
  beforehand). Orwellian revision: subject experiences the first dot plainly, then
  memory is rewritten after the second dot appears (memory hole).


