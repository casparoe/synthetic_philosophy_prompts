  One of the durable obsessions of rationalist blogs is self-binding: precommitment
  devices, Ulysses pacts, beeminder-style contracts, and the lurking worry that the
  person who sets the alarm for 6 a.m. and the person who swipes it off at 6 a.m.
  are not quite the same agent. The standard justification for honoring such commitments
  is the Ulysses model — the earlier self rationally anticipates that the later self
  will be irrational, biased, or akratic, so overriding the directive is just what
  the earlier self predicted and guarded against. I want to stress-test whether that
  justification is doing all the work we assume it does, for a piece I''m writing
  about value drift and long-term commitments.


  Construct a matched pair of thought experiments about an advance directive or self-binding
  commitment with the following specifications:


  1. In both scenarios the later self is fully competent: no dementia, no delusion,
  no depression-clouded judgment, no intoxication. Both later selves have changed
  their minds through what is, by their lights and by ours, a rational process — they''ve
  considered the evidence, reflected calmly, and aren''t being manipulated.


