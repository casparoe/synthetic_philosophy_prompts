  Let me pick the reference class problem — a novelist doing research about, say,
  a character who is an actuary or someone betting, or a novelist researching for
  a plot involving insurance/prediction. Commitments on the reference class problem:


  Possible commitments set:

  1. Probability claims about single events only make sense relative to a reference
  class ("the probability that this 40-year-old smoker dies within 10 years").

  2. Frequencies in actual populations are what ground these probabilities (frequentist-ish).

  3. There''s no fact of the matter about which reference class is "correct" — you
  just pick one that''s relevant and available.

  4. A rational agent should use the narrowest reference class for which she has data
  when making decisions (e.g., insurance pricing).

  5. Single-case probabilities can be objectively wrong/right — e.g., "this coin flip
  has probability 1/2 of heads" is true even if the flip is never repeated.

  6. It''s fine (and rational) for an insurance company to charge different premiums
  based on gender or neighborhood if the frequencies differ.


  Tensions: (3) "no fact of the matter about correct reference class" conflicts with
  (5) objective single-case probability. Also (4) "narrowest class" conflicts with...
  narrowest class with data — regression to small samples; also conflicts with the
  idea that class choice is pragmatic. And an apparent tension that dissolves: (2)
  frequentism vs (5) single-case — actually a genuine tension. Hmm.


  Design: one or two genuine non-obvious tensions, one apparent tension that dissolves.


  Genuine tension A: (3) vs (5): if there''s no fact of the matter about which reference
  class is correct, then single-case probability claims inherit that indeterminacy
  — can''t be objectively right/wrong except relative to a class. Non-obvious? Moderately.


  Genuine tension B: (4) narrowest reference class: every individual is a unique intersection
  — taken to the limit, the narrowest class containing just this person has no frequency
  data at all (sample size zero/one), so the principle is self-undermining: "narrowest
  class for which you have data" — the tension is that narrowness and data trade off,
  so the principle is incomplete rather than inconsistent... Could be framed as: the
  principle can''t be followed literally.


  Apparent tension that dissolves: e.g., commitment "frequency is what probability
  means" vs "I believe the probability this coin lands heads is 1/2 even on a single
  toss" — dissolves via propensity or via saying the frequency is in tosses of coins
  like this; single case inherits probability from the class. Or: believing that gender-based
  pricing is rational while also thinking each person''s risk is individual — dissolves
  because pricing is about the class-level decision rule, not claims about individuals.


  Novelist angle: "I''m writing a novel where the protagonist is an insurance underwriter
