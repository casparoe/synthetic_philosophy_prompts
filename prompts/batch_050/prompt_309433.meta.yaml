  Act as a philosopher who specializes in probability and formal epistemology — think
  carefully, maybe sketch the tensions to yourself before answering. Here''s her (my)
  set of commitments about the reference class problem:


  1. Probability claims about single events are only meaningful relative to a reference
  class. "There''s a 30% chance Mara develops the disease" only says something once
  you specify: 30% of *which group* develops it.

  2. What grounds those probabilities is actual frequencies — how often the thing
  in fact happens in the group. No spooky propensities in objects, no pure degrees
  of belief.

  3. There is no "correct" reference class for a given case, just more or less useful
  ones. Picking the class is a pragmatic decision, not a discovery.

  4. When actually deciding something (pricing a policy, giving a prognosis) you should
  use the narrowest reference class you have decent data on. More specific = more
  informative.

  5. A single-case probability claim can be flat-out wrong. If Mara says her chance
  is 80% based on vibes when the relevant frequency is 30%, she''s just mistaken,
  not "right relative to her own class."

  6. It''s legitimate for her to price two customers differently on the basis of a
