  with causal realism."


  Subtle mistakes to plant:

  1. Conflation: student says Hume''s first definition is "an object precedent and
  contiguous to another, and where all objects resembling the former are placed in
  like relations of precedency and contiguity to those objects that resemble the latter"
  — I won''t quote. Instead, student might conflate constant conjunction with necessary
  connection — e.g., saying Hume''s "secret power" is just constant conjunction (a
  common conflation) or attributing the projectivist reading wrongly.

  2. Misattribution: saying the New Hume reading (Strawson, Wright, Buckle) holds
  Hume was a skeptic about the existence of necessary connection — actually the New
  Hume says Hume believed in real causal powers but denied we can know their nature.
  Or student says Hume denies causation exists (a howler — too obvious). Better subtle
  mistake: student claims the two definitions are definitions of the same thing/that
  Hume intended them as equivalent — actually the mismatch between them (one in terms
  of objects, one in terms of ideas/impressions in the mind) is a famous puzzle. Or
  student says the second definition is about objects rather than the mind — that''s
  the subtle one.

  3. Step that doesn''t follow: student infers from Hume''s copy principle that since
  we have no impression of necessary connection from a single instance, Hume concludes
