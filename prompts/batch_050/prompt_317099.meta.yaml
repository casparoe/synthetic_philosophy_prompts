  Question: Hume gives two definitions of "cause" in the Enquiry. State both, explain
  why they appear to pull apart, and say what the "New Hume" interpretation claims
  about Hume''s view of necessary connection.


  Student answer:

  "Hume defines a cause in two ways. First, a cause is an object followed by another,
  where all objects similar to the first are followed by objects similar to the second
  — that is, constant conjunction plus temporal priority and contiguity. Second, a
  cause is an object followed by another where the appearance of the first brings
  the idea of the other to mind — this is the definition in terms of the mind''s customary
  transition. Hume thinks these are just two ways of saying the same thing, since
  both reduce causation to regular succession. The apparent difference is only verbal:
  the first describes the regularity, the second describes the regularity as it appears
  to us.


  Our idea of necessary connection, according to Hume, comes from the impression of
  the mind''s determination to pass from cause to effect after repeated experience.
  Since this impression is internal, Hume concludes that necessary connection is a
  projection and that there is no necessary connection in the objects themselves.


  The New Hume interpretation, defended by Galen Strawson and others, holds that Hume
  was actually a realist about causal powers: he thought there really is a necessary
  connection in nature, but that we can have no knowledge of its nature. On this reading
