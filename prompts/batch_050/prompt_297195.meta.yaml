reasoning_summary: 'Let me pick a domain and type. Options: Quine''s gavagai, language
  of thought, futarchy, Kant on animals, risk-weighted expected utility. Types: role-play,
  verdicts-on-cases, essay.


  A good combination: risk-weighted expected utility (Buchak) with "verdicts on cases"
  type — the asker reports intuitions on cases (Allais, etc.) and asks what principle
  captures them. That''s nice because REU is mid-niche: LLMs know it somewhat but
  the prompt can inject custom cases. Casual tone, typos, prompt engineering text.


  Let me construct cases where ordinary expected utility and risk-weighted EU diverge,
  and asker has intuitions that are hard to reconcile. Cases:


  1. Allais: prefers 1A (sure $1M) over 1B (gamble); prefers 2B over 2A — standard
  Allais violation. Verdict: seems fine/rational.

  2. A case where asker wants risk aversion but not too much: e.g., wouldn''t pay
  to avoid a 1% chance of death... hmm, careful.

  3. A case that pressures REU: "global" risk aversion issues — e.g., across many
  repeated small gambles, or diachronic consistency. E.g., someone offered 100 independent
  50/50 bets of +$1000/−$500; turning each down individually seems silly even to a
  risk-averse person. That''s a tension for REU (risk aversion applied per-gamble).
  Askar''s verdict: should take them all — but that pressures their Allais verdict.

  4. A case about stakes: willing to risk a lot when the upside is escaping something
  bad — "saving one life for sure vs 50% chance of saving two" (risk averse), but
  "if drowning, you''d take a risky rescue over none" — risk-seeking when downside
  anyway.


  Also a pair hard to reconcile: e.g., verdict that in Allais it''s rational to pick
  the sure thing, but also that buying insurance and simultaneously playing lottery...
  Let me pick: (a) Allais sure-thing preference fine; (b) over 100 repeated independent
  favorable small bets, declining each seems wrong; (c) Pascalian longshot: not willing
  to give up much for a tiny chance at an enormous prize, but also (d) willing to
  take a risky action when status quo is terrible (risk-seeking in losses).


  The principle sought: maybe risk-weighted expected utility with risk function r,
  applied to whole-life portfolio / with a reference point. Ask: does one principle
  deliver all verdicts? Which verdict must be dropped? Also ask what it predicts for
  a new case: e.g., choice between sure gain and a two-stage gamble.


  Write casually, with a typo, include prompt-engineering text like "you''re a decision
  theory expert", "think carefully, brainstorm before answering".


  Should be self-contained: explain the cases in plain terms, no citations needed.
  No verbatim quotes, no web needed.


  Draft:


  "Okay I need help from a decision theory expert... Here are my gut verdicts on a
  bunch of choice problems..."


  Cases (money, lives):

  1. Allais: A) $1M for sure vs B) 89% $1M, 10% $5M, 1% nothing — I take A and think
  that''s rational. And 89% nothing version: 10% $5M vs 11% $1M → take the 10% $5M.
  So classic Allais pattern, and I think it''s fine.

  2. Repeated bets: 100 independent flips, win $600/lose $400 each — I''d take all
  100, and refusing them all feels irrational even if refusing one is fine.

  3. Tiny chance, huge prize: 1 in a million chance at $10 billion for $100 — wouldn''t
  pay; but also don''t think someone who pays is irrational? Hmm, maybe keep verdict
  crisp: not irrational either way? Better to keep definite verdicts.

  4. Risk-seeking in bad situations: trapped miners — sure rescue saving 400 of 600
  vs gamble 2/3 save all 600, 1/3 save none? I''d... classic Kahneman-Tversky: sure
  200 saved vs 1/3 all 600 (equivalent EV), people prefer sure in gains frame; in
  losses frame prefer gamble. My verdict: when things are going badly, gambling is
  right; when secure, caution.

  5. The hard-to-reconcile pair: cases 1 and 2 tension; also maybe a case about insurance:
  paying insurance premium at loaded odds is fine, but I also think selling an identical
  insurance policy... eh.


  Add one more: "a friend offers me either a guaranteed $50 or a coin flip for $0/$110
  — I''d take the flip actually because small stakes" — so risk posture scales with
  stakes. That adds a clause for any principle: risk aversion must depend on stakes
  relative to wealth.


  Then ask: what principle captures these? Candidates: risk-weighted expected utility
  (rank-dependent), utility curvature, portfolio-level vs case-by-case evaluation.
  Which verdict does each candidate force me to give up? And prediction for a new
  case: "a gamble where I can pay to remove the worst outcome only" or "the same Allais
  choice but where I must decide before knowing whether I''ll face it 100 times".
  Also ask: state the principle precisely enough that it delivers verdicts on cases
  I haven''t listed.


  Include prompt engineering: "You are a decision theory expert. Think carefully,
  brainstorm at least two candidate principles before settling, then state your favorite
  precisely." Casual tone with a typo or two.


  Length: reasonable, similar to examples. No web needed.'
