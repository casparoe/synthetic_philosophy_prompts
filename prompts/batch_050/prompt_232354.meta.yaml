  Let me construct cases that map onto Nozick''s entitlement theory: justice in acquisition,
  justice in transfer, rectification. Wilt Chamberlain argument: voluntary transfers
  from a just distribution upset patterns.


  Case ideas (concrete, with plausible-but-tension verdicts):

  1. Person homesteads unowned land, leaving enough and as good for others — just
  holding.

  2. Same person later fences off the last water source in a drought, charging monopoly
  prices — feels unjust (Lockean proviso tension).

  3. Wilt Chamberlain scenario: fans each voluntarily pay 25 cents to watch him play;
  he ends up rich. Feels just (or at least not unjust).

  4. A chain of 100 voluntary gifts from A to B, each individually fine, results in
  B owning all the food in a village while others starve — feels unjust (aggregation
  problem).

  5. Someone buys a widget fairly, then resells to a desperate person at 20x — feels
  unjust despite clean title.

  6. Inheritance of wealth whose origin traces to stolen land two centuries ago —
  feels tainted (rectification).

  7. Finding and keeping a washed-up cargo container — feels fine.


