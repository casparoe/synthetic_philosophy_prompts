  Summary draft: "Economists calculate whether a gamble is good by averaging over
  all possible outcomes (ensemble average). But in real life you only live one life,
  so what matters is the average over time. For any gamble with a chance of ruin,
  the time average is always worse than the ensemble average, so expected value is
  useless for individual decisions. Peters proved that the logarithmic utility function
