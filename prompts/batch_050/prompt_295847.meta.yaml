  utility theory was right for the wrong reasons / actually unnecessary. This means
  mainstream economics'' use of expected value is fundamentally broken."


  Subtle errors embedded:

  1. "For any gamble with a chance of ruin, time average is always worse" — overgeneralization;
  time vs ensemble differ for multiplicative dynamics generally, not only ruin; and
