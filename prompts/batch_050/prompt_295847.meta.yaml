  Let me pick ergodicity economics. A popularizer summary of Ole Peters'' argument:
  time average vs ensemble average, the St. Petersburg/coin toss gamble, expected
  utility theory history (Bernoulli), ergodic hypothesis. Subtle misrepresentations:
  (1) conflating "expected value is wrong" with "expected value theory is wrong" —
  Peters doesn''t reject expected values generally; (2) claiming logarithmic utility
  was an ad hoc patch vs Peters deriving it from growth rate; (3) overstatement: "mainstream
  economics has no answer to this" — actually Kelly criterion, growth-optimal portfolio
  theory exist. Or claim that time averages always diverge from ensemble averages
  — only in non-ergodic systems. Good subtle error: "Peters proved that expected utility
  theory is wrong" — actually he offers a reinterpretation/resolution of St. Petersburg
  via time-average growth, but utility theory isn''t refuted.


  Alternatively JOOTSing/MU-puzzle: Hofstadter''s MU-puzzle from GEB — can''t derive
  MU from MI with the four rules; the point about jumping out of the system, formal
  systems vs intelligence. A summary could misrepresent: "Hofstadter proved you can
  never get MIU" wait the puzzle is deriving MU from MI — actually in GEB the puzzle
  is MIU-system: start with MI, derive MU. The summary error: "Hofstadter proves it''s
  impossible to derive MU" — actually it IS impossible (provably, via invariant: count
  of I''s mod 3), and Hofstadter shows this by stepping outside. A subtle misrepresentation:
  conflating "impossible within the system" with "the system is incomplete" or "Gödel
  proved..." etc. Or claiming the impossibility proof requires intelligence — the
  mechanizable argument about I-counts is itself formalizable.


  Ergodicity is nice and less commonly regurgitated. Also casual voice: person watched
  a YouTube video / read a blog post.


  No verbatim quotes needed — paraphrase. No need for web. Avoid citing specific papers/dates
  to avoid dependence; can mention "a physicist named Ole Peters" — that''s fine,
  well-known. Maybe keep it nameless or lightly named. Keep it casual with a typo.


