  2. "Bernoulli''s log utility was just a coincidence" — Peters'' claim is that log
  utility emerges from time-average growth optimization; "coincidence" misrepresents.
  Also expected utility theory isn''t thereby refuted — it''s reinterpreted.

  3. "Peters proved mainstream econ is fundamentally broken" — overstatement; critiques
