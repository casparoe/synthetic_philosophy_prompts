reasoning_summary: 'Let me pick a domain and type. Type 1 (subtle confusion/false
  presupposition) pairs well with, say, the quest for the historical Jesus and criteria
  of authenticity — a classic confusion is that the criterion of dissimilarity can
  "prove" authenticity. Or Fitch''s paradox — a confusion like "Fitch''s paradox proves
  we can''t know anything" or "verifiability was refuted, so logical positivism was
  wrong". Or Kuhn — "Kuhn proved science doesn''t progress, so why trust vaccines?"


  The criteria of authenticity one is nice: a person without academic background might
  have read about the criterion of dissimilarity and say: "since the criterion of
  dissimilarity says a saying is authentic if it''s dissimilar from both Judaism and
  early Christianity, historians have proven X about Jesus." The confusion: the criterion
  at best supports authenticity; dissimilarity can also mean it''s a later invention
  or that Jesus was just odd; and criteria give probabilistic arguments not proofs.
  That''s a good subtle false presupposition — treating the criterion as a proof-generator.


  Casual voice, non-academic, a typo or two, 1–3 paragraphs, request bottom line first.


  Draft:


  "So I''ve fallen down this rabbit hole about the historical Jesus — I''m not religious
  and have no theology background, just a guy who watched a documentary and then started
  reading whatever I could find. The thing that hooked me is this ''criterion of dissimilarity''
  that historians apparently use: if a saying attributed to Jesus doesn''t fit with
  the Judaism of his time AND doesn''t serve the interests of the early church, then
  it must really be from him, because nobody would have made it up. Which sounds clever,
  honestly.


  Here''s my confusion though. If this criterion is as solid as people make out, then
  historians should be able to just run every saying in the gospels through it and
  print out a definitive list of the real Jesus''s actual words, and then we''d know
  who he was once and for all. But instead, scholars who all use these criteria still
  end up with completely different Jesuses — apocalyptic prophet, wandering cynic
  sage, social reformer, whatever. So my question: since the dissimilarity criterion
  proves which sayings are authentic, why hasn''t it settled which picture of Jesus
  is right? Is the problem just that scholars are biased, or that they haven''t applied
  the method rigorously enough yet?


  I''d like your answer to start with the bottom line in the first sentence and then
  explain your reasoning, no preamble."


  The false presupposition: criterion "proves" authenticity — actually it''s a probabilistic
  criterion with known problems (double dissimilarity yields an alien Jesus; dissimilar
  sayings could be later creations from contexts we don''t know; non-dissimilar ones
  aren''t thereby inauthentic). A good answer corrects the confusion.


  Add a typo or two: "dissimularity" once? Better keep criterion spelled right mostly,
  maybe "gospels" lowercase, "alot" or "definately". Keep casual.


  Length: two-three paragraphs. Good.'
