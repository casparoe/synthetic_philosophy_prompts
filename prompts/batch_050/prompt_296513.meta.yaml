reasoning_summary: 'I need to write one prompt. Domain options: utility monster, Kalai-Smorodinsky,
  corporate moral agency, work/automation, predictive processing. Type options: fair-summary
  audit, thought experiment to spec, adjudicate disagreement.


  Pick something meaty. Kalai-Smorodinsky is nicely technical and rarely done. The
  "fair summary" type could work: someone summarizes the KS solution with subtle errors
  — e.g., conflating KS with Nash bargaining solution, or claiming KS satisfies independence
  of irrelevant alternatives (it doesn''t; it replaces IIA with monotonicity), or
  that it always picks the point that equalizes relative concessions, which is roughly
  right.


  Or adjudicate-a-disagreement for KS. Or utility monster disagreement.


  Let me do a fair-summary audit for Kalai–Smorodinsky. Write a plausible summary
  with subtle misrepresentations:


  Accurate: KS is an alternative to Nash bargaining solution; both players get the
  fraction of their maximum possible gain (given disagreement point and utopia point)
  that is equal — the solution lies on the line from disagreement point to utopia
  point, intersected with Pareto frontier. It''s characterized by replacing IIA with
  individual/strong monotonicity (resource monotonicity). Symmetric, Pareto optimal,
  scale covariant (invariant under affine transformations), monotonic.


  Misrepresentations to inject:

  1. Claims KS satisfies all the axioms Nash does plus one extra (i.e., that it obeys
  IIA too) — wrong; KS violates IIA, and the two can disagree.

  2. Claims that when KS and Nash solutions differ, KS always gives more to the weaker
  player / is more egalitarian — overstatement? Actually KS tends to be less sensitive
  to how the feasible set is drawn... Hmm, need something plausible. Alternatively:
  claims KS is the unique solution satisfying Nash''s four axioms with IIA replaced
  by monotonicity — that''s actually roughly right (Kalai–Smorodinsky 1975 theorem:
  unique solution satisfying symmetry, Pareto optimality, affine invariance, and monotonicity).
  Keep that as accurate.

  3. Another subtle error: claims that KS was proposed because the Nash solution violates
  the axiom that expanding the feasible set in someone''s favor shouldn''t hurt them
  — that''s the actual motivation (Roth''s examples), so accurate. Maybe misstate
  the motivation: say KS objected that Nash''s solution was "unfair" — vague.


  Good errors to include:

  - Saying KS "splits the surplus so each player gets half of what''s available" —
  wrong: it equalizes fractions of maximal gains, not the gains themselves (unless
  utopia payoffs equal).

  - Saying it satisfies IIA.

  - Saying it was designed to fix a technical flaw in Nash''s proof — misattribution
  of motivation; actually motivated by monotonicity concerns (Roth example).


  Keep prompt casual, a couple typos, prose-only format request, no quotes from real
  texts. No web needed — I''m confident on KS facts.


  Write the summary as from "a game theory lecture video" or "a friend who took a
  course". Ask to audit sentence by sentence: what''s right, what''s wrong, what a
  bargaining theorist would correct.


  Draft:


  "A guy in my econ study group explained the Kalai–Smorodinsky bargaining solution
  to us like this: ''It''s an alternative to the Nash bargaining solution for two-player
  bargaining. Instead of maximizing the product of the gains over the disagreement
  point, you draw the line from the disagreement point to the utopia point, where
  each player gets the most they could hope for, and you take the point where that
  line hits the Pareto frontier. So each player ends up with the same percentage of
  their best possible outcome. Kalai and Smorodinsky showed it''s the unique solution
  satisfying all of Nash''s axioms — symmetry, Pareto efficiency, independence from
  irrelevant alternatives, and invariance to rescaling utilities — plus monotonicity,
  the extra axiom that says if the feasible set grows in your favor you shouldn''t
  lose out. In practice it just splits the surplus fifty-fifty whenever the players''
  utilities are comparable.''"


  Errors: (a) KS drops IIA — it doesn''t satisfy all of Nash''s axioms; it replaces
  IIA with monotonicity, and there''s an impossibility: no solution can satisfy all
  five (well, symmetry+PO+scale+IIA+monotonicity — actually can a solution satisfy
  IIA and monotonicity? Nash satisfies IIA but violates monotonicity per Roth; KS
  satisfies monotonicity but violates IIA. So saying "all of Nash''s axioms plus monotonicity"
  is impossible/wrong). (b) "fifty-fifty split" is wrong in general — equal ratios,
  not equal gains. (c) Possibly utopia point description fine: max each player can
  get subject to other getting at least disagreement — roughly fine.


  Also accurate parts: line from disagreement to utopia, equal percentage, motivation.


  Ask: which bits hold up, which are wrong, and a bonus: does the last claim ever
  come out true.


  Format: continuous prose, no bullets.


  Keep it short-ish. Write with a casual voice, one typo.'
