  "Harsanyi''s aggregation theorem. Setup: consider a society of individuals i = 1..n,
  where the alternatives are lotteries (probability distributions) over a set of social
  outcomes. Assume each individual''s preferences over lotteries satisfy the vNM axioms,
  so they''re representable by a utility function u_i with the expected utility property;
  assume likewise that social preferences satisfy the vNM axioms, representable by
  V. The Pareto condition: if every individual is indifferent between two lotteries,
  society is indifferent, and if every individual weakly prefers L to M and at least
  one strictly prefers it, society strictly prefers L. Under these assumptions, the
  theorem says social utility is a weighted sum of individual utilities: V = Σ_i a_i
  u_i (up to a constant), i.e. the social utility of any lottery is a linear combination
  of the individuals'' utilities. The vNM independence axiom is what forces linearity:
  without it you could get, say, a maximin social function, which is not linear in
  individual utilities.


  Does it vindicate utilitarianism? Yes, essentially. The theorem shows that any consistent
  social evaluation that respects individual preferences must take the additive form,
  which is just the utilitarian form. And the weights must be equal: the theorem derives
  social utility as a sum of individual utilities, and since the theorem gives us
  no reason to weight one person''s utility more than another''s, treating people
  symmetrically forces a_i equal for all i — which is classical utilitarianism (average
  or total, the difference is just a scaling). One might worry about inequality —
  e.g. a lottery giving everyone a 50% chance of everything versus an equal split
  for sure — but if the individuals themselves are indifferent between the coin flip
  and the equal split, Pareto says society must be too, and the additive form just
  records their preferences, so the fairness objection doesn''t get off the ground."


