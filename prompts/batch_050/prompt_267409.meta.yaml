  ---


  I have no formal training in political philosophy or economics, but I''ve spent
  a lot of time thinking about immigration on my own, and I keep running into the
  same two positions. The first holds that borders should be essentially open: people
  ought to be free to live and work where they choose, and the massive income differences
  between countries mean that even modestly freer migration would be one of the largest
  poverty-reduction measures available. The second holds that open borders are incompatible
  with a functioning welfare state and a cohesive society: a country that guarantees
  healthcare, schooling, housing support, and benefits to everyone inside it cannot
  admit everyone who wants in without bankrupting the system or overwhelming its capacity
  to integrate newcomers.


  I want to see what these two sides could actually agree to put in writing. You are
  a professional facilitator of adversarial collaborations — someone whose job is
  to get committed opponents to co-author a document that states precisely what they
  share and exactly where they diverge, without strawmanning either side. Think carefully,
  and before drafting anything, briefly brainstorm: list the strongest version of
  each position, the places where the public debate talks past itself, and which sub-questions
  are genuinely empirical versus genuinely moral.


  To keep the exercise from dissolving into abstractions, both parties have agreed
  in advance to consider one concrete institutional proposal, which I came up with
  after reading about so-called keyhole solutions: a regime of essentially unrestricted
  admission in which new arrivals (or private sponsors who vouch for them) are barred
  from means-tested welfare programs for their first five years, pay a modest surcharge
  on income tax during that period, and place a refundable deposit into an integration
  escrow account that is returned once they pass a language exam and remain employed
  for two consecutive years. The open-borders side has said it would accept this as
  a massive improvement over the status quo; the restrictionist side has said it might
  address some of its concerns but not all.


  Now write the joint statement the two parties would sign. It should contain:


  1. A numbered list of agreed claims — propositions both sides endorse without hedging.
  These should include claims about what the welfare-state objection does and does
  not establish, about the difference between opposing immigration and opposing immigrants''
  access to specific programs, and about how much of each side''s position is empirical
  versus normative. Aim for claims that are substantive rather than anodyne; if a
  claim is too weak to be worth stating, cut it.


  2. A table of residual disagreements. Each row should state the disagreement in
  neutral wording, then give the open-borders position and the restrictionist position
  each phrased in words that side would itself accept. At least one disagreement should
  be about values rather than facts (for instance, what a political community owes
  to outsiders relative to its own poorest members), and at least one should be about
  an empirical quantity (for instance, the long-run net fiscal contribution of low-skilled
  immigrants and their children, or whether welfare availability actually drives migration
  decisions).


  3. For each disagreement, the cruxes: the sub-questions such that a clear answer
  would move at least one side. For each crux, specify the evidence, case, or natural
  experiment both parties would accept as bearing on it — for example, what each side
  would predict about migration flows into jurisdictions that differ in welfare generosity,
  or about the fiscal trajectories of the children of low-skilled immigrants — with
  each side''s prediction written down in advance, so the document functions as a
  bet rather than a truce.


  4. A closing section stating what the escrow proposal does to the disagreement:
  which of the restrictionist''s concerns it fully answers, which it merely mitigates,
  and which it leaves untouched — and whether the open-borders advocate''s acceptance
  of it reveals anything about the true depth of the original objection.


  The tone should be that of a legal settlement: precise, ungenerous to vagueness,
  and scrupulously fair to both sides. Do not adjudicate the disagreements; your job
  is to make them exact.


