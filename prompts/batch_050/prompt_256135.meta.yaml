  ---


  I am a retired condensed-matter physicist who has been reading the philosophy of
  truth with a beginner''s diligence, and I have found myself persuaded by the deflationary
  thought that truth is a thin, logical notion rather than a deep metaphysical property.
  The trouble is an argument I wrote out for myself which seems to refute that thought,
  and I cannot find the defect. Here it is.


  (1) What it is for a statement to be true is exhausted by instances of the disquotational
  schema — "snow is white" is true if and only if snow is white — together with the
  predicate''s use as a device of generalization ("everything the witness said is
  true"). There is no substantive property of truth over and above this.


  (2) If (1), then ascribing truth to a statement adds nothing to the content of simply
  asserting the statement; the predicate is a logical convenience, not the name of
  an explanatory property.


  (3) A property whose ascription adds nothing to content cannot do explanatory work:
  one cannot explain an event by citing a feature whose attribution is, in effect,
  a re-description of what one already had.


  (4) Hence no genuine explanation cites the truth of a belief or theory.


  (5) But then two explanations I have relied on all my life collapse: the realist''s
  claim that mature theories predict successfully because they are approximately true,
  and the everyday claim that the bridge stands because the engineer''s calculations
  were correct (i.e., true).


  (6) Both of those are genuine explanations.


  (7) Therefore (1) is false: truth is a substantive property after all.


  The conclusion strikes me as proving too much — or rather, the argument as proving
  too little in a suspicious way, since by its lights it is hard to see how any merely
  logical device could ever serve us, and yet disquotation plainly serves us somewhere.
  If forced to choose, I would rather retain (1), or something in its spirit, than
  accept that truth is a heavyweight metaphysical posit; but I would like to know
  precisely which step fails, why it looked innocent, and what rejecting it costs
  the rest of the picture.


