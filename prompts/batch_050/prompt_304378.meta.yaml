reasoning_summary: 'Pick domain + type. Domains: doing vs allowing, epistocracy vs
  democracy, collective memory vs history, policing, Hume on money/trade. Types: analogy
  audit, exam question, phenomenon naming.


  Analogy audit works well with collective memory vs history — a common analogy: collective
  memory is like individual memory / a nation''s memory like a person''s; "those who
  forget history are doomed to repeat it" — history as lessons. Or: a community''s
  collective memory is like a person''s memory — therapy analogy: just as a person
  needs to confront repressed trauma, a nation must confront its past. That''s actually
  a widely used analogy (e.g., Vergangenheitsbewältigung, "coming to terms with the
  past" like an individual therapy patient). Audit: what maps onto what, where it
  breaks (collectives have no single psyche, "remembering" is done by individuals
  who didn''t live it, memory is transmitted/reconstructed, no repression mechanism
  exactly, etc.), and whether the conclusion — that nations must work through traumatic
  pasts the way patients must — survives.


  Alternatively epistocracy: "the state is like a ship and should be steered by those
  who know navigation" — Socrates'' ship of state analogy! That''s a classic analogy
  in actual use. Audit how far it holds: maps voters to sailors/owner, ruler to navigator;
  disanalogies: no agreed destination for politics (whereas ship has destination),
  expertise about ends vs means, who suffers consequences of bad rule, the passengers
  are also the owners... Actually in Plato''s ship, the owner is the demos, sailors
  are politicians. Ask how far the ship analogy holds for licensing epistocracy. That''s
  a strong, well-known analogy with real work being done. Good for model without web:
  Plato''s ship of state is common knowledge. No quotes needed.


  Keep short, casual, a typo or two. Write the prompt only.'
