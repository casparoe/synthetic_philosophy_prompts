  is relative to interests, and the same person knows and doesn''t know the same fact
  depending on the day; it follows that there is no purely epistemic domain." Subtle
  misrepresentations: (1) pragmatic encroachment concerns knowledge (or justified
  belief), not truth itself — the truth condition stays; (2) it''s typically about
  the stakes of the subject or attributor — conflating subject-sensitive invariantism
  with contextualism; (3) "depends on what''s useful" misstates — it''s stakes/costs
  of error, not utility of belief; (4) presenting the "two standards" objection as
  refutation.


  The asker wants: which parts accurate, which misrepresentations, does the conclusion
