  Frege''s puzzle: identity statements like "Hesperus is Phosphorus" are informative
  whereas "Hesperus is Hesperus" is trivial, yet if identity is a relation between
  objects and both names refer to the same object, the two statements should have
  the same content. Frege''s solution: sense (Sinn) vs. reference (Bedeutung) — names
  with the same referent can differ in mode of presentation.


  Implications for a novelist:


  1. Dramatic irony and information asymmetry: a reader can know everything about
  the referent while lacking knowledge under a particular mode of presentation. A
  character''s knowledge is individuated by senses, not referents. This explains why
  a revelation scene ("the stranger is your father") can be informative even though
  it states an identity that was always true — the informativeness isn''t about the
  world but about the mode of presentation.


  2. Failure of substitutivity in belief contexts: you can''t swap co-referring names
  in reports of what a character believes/knows/wants. "Lois Lane believes Superman
  can fly" vs. "Lois believes Clark Kent can fly." For a novelist: free indirect discourse
  and narration must track the character''s mode of presentation, not the narrator''s
  omniscient one. This is a practical craft implication for POV management.


  3. Plot twists built on identity: the twist works only if the two modes of presentation
  are kept cognitively distinct for the reader. The novelist must manage which guises
  are salient. A twist reveal is the reader learning Hesperus = Phosphorus.


  4. Mystery/detective fiction: clues are sense-building; the detective''s task is
  discovering co-reference. The genre is essentially dramatized Fregean epistemology.


  5. Character naming conventions: epithets, aliases, roles (the masked man, the gardener)
  as modes of presentation; choosing which to use in narration signals knowledge state.


