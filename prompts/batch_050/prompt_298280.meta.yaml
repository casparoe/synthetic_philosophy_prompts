  utility maximization" with a rank/rate: rank the money pump, dutch book, representation
  theorem etc. Or prisons with ranking rehabilitation vs punishment aims.


  The instructions say: inject some new/niche ideas so models can''t regurgitate.
  E.g., for promises, introduce a novel hypothetical case — like promises made by
  AI assistants, or promises to the dead, or "promises" generated by a scheduling
  app. Then ask to rank candidate accounts by how well they handle those cases.


  Alternatively, exam question type with coherence arguments: ask a question on diachronic
  Dutch book / money pump that can''t be answered by reciting.


  Let me go with "Why do promises bind?" + rank type. Design: The asker describes
  running a reading group / drafting a syllabus section, has encountered some edge
  cases that strain standard accounts: (1) promises extracted under social pressure
  at a wedding; (2) promises to someone who dies before performance; (3) a promise
  made by a calendar app auto-generating commitments; (4) promises where the promisee
  doesn''t care. Ask to rank main accounts of promissory obligation — expectations/inducement
  account, rights-transfer (Raz), Scanlonian assurance, practice/convention view,
  and maybe "self-binding" — by how well each explains obligation in these cases,
  with a tier list, one-sentence justification each, and state final ranking in \answer{...}.


  Make it casual, British English, a typo or two, 1-3 paragraphs, elaborate. Format
  request: machine-readable at end, e.g. \answer{...} with ranking.


  Draft:


  "So I run a little philosophy reading group at my local library (we''re not academics,
  just keen)... we''ve been doing promises and promissory obligation. Everyone assumes
  the standard story — a promise binds because it creates expectations in the promisee,
  and reneging lets those expectations down. But then a member raised cases..."


  Include the edge cases. Then list candidate accounts (maybe ask model to rank its
  own chosen accounts rather than provide list — better to seed a list to make it
  comparable). Provide list of five accounts:


  1. Expectation/assurance account (Scanlon): wrong to disappoint expectations you''ve
  deliberately created.

  2. Rights-transfer account (Raz): promising transfers a right to performance.

  3. Social practice account (Hume/Rawls): obligation comes from a convention that''s
  mutually beneficial; free-riding on the practice is unfair.

  4. Will theory / self-binding: promising is an exercise of normative power over
  oneself.

  5. Trust/harm hybrid: obligation grounded in the harm of betraying trust.


  Then ask: rank these by how well they handle my three weird cases — (a) a promise
  made to someone who dies before you can keep it, e.g. promising your gran on her
  deathbed to scatter ashes at Loch Lomond — feels binding despite no living promisee
  with expectations; (b) a "promise" auto-generated by my scheduling assistant when
  it books people into slots and tells them I''ll be there — no act of mine creating
  the expectation, yet people rely; (c) a promise extracted at a family wedding under
  intense social pressure where everyone would think you a monster for refusing —
  the promisee''s expectation exists but was, in a sense, manufactured.


  Rank accounts by explanatory coverage across these cases. Tier list with sentence
  each. End with \answer{...}.


  Also ask them to say which case is hardest overall. Keep casual, one or two typos,
  British spellings: "neighbour", "colour", "realise", "programme", "practise".


  Length: 1-3 paragraphs. Fine.


  No quotes needed, no web search needed — all content is standard philosophy (Scanlon,
  Raz, Hume) at a level LLMs know; titles/dates not leaned on. Avoid verbatim quotes.


  Final answer format: \answer{e.g. assurance > practice > rights-transfer > self-binding
  > harm}. Also maybe request final line.


  Write it.'
