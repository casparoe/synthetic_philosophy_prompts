  So the connection between my experiences and my judgments about them appears to
  be a massive coincidence: I judge that I have experiences, and I do have them, but
  the judgments would have been the same even if the experiences had been absent or
  different. A zombie duplicate of me, lacking all experience, would accordingly fall
  silent on questions of consciousness, since nothing would prompt it to report experiences
  it does not have.


  The paradox, in my view, is a strict self-refutation. If epiphenomenalism were true,
  then our beliefs about consciousness would be caused by something other than consciousness,
  which contradicts the belief''s content that consciousness is what prompts it. A
  theory that entails its own believers could not form the belief in it refutes itself.


