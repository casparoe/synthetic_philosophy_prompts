  Quick setup so we''re on the same page: the standard problem of logical omniscience.
  On the possible-worlds model of belief, if an agent believes p, and p entails q,
  then q holds at every world compatible with what they believe — so they believe
  q too. Hence believers know all logical truths, all consequences of their beliefs,
  etc. Real people obviously don''t. The literature''s responses mostly try to build
  models where agents can fail to be omniscient: impossible worlds, awareness filters,
  fragmented belief states, and so on.


  My paper goes the other way. I argue the omniscience "problem" is only a problem
  if we misidentify what the possible-worlds model is modeling. Sketch:


  1. Distinguish two things that both get called belief: an agent''s information state
  (roughly, the set of worlds left open given everything they''ve committed to) and
  their retrieval system (the finite, resource-bounded machinery that answers questions
  on demand — is this true? what follows from this?).


  2. The possible-worlds model, I claim, was never a model of retrieval. It''s a model
  of information states. Closure under consequence is then not a bug — it''s just
  what it is to be an information state: the state rules out worlds, and anything
  true in all un-ruled-out worlds is "in" the state the way a fact is "in" a database
  whether or not anyone ever runs the query.


  3. The famous counterexamples are all really retrieval failures. Take the standard
  case: I believe the axioms of arithmetic but don''t believe that some specific huge
  number is prime, since I haven''t checked. On my view, my information state (assuming
  I''ve really committed to the axioms) settles the primality question either way
  — I just don''t know which way, because knowing which way is a retrieval task, and
  retrieval costs resources. Not believing the consequence isn''t a counterexample
  to closure; it''s the predictable result of a finite query engine sitting on top
  of a closed information state.


  4. Payoff: we get to keep the clean semantics AND explain the data. The data about
  what people actually believe tracks what''s cheap to retrieve, and "cheap to retrieve"
  is a matter of indexing and inference-path length, not of what''s believed. Fragmentation
  views get the fragmentation in the wrong place: it''s the retrieval system that''s
  fragmented, not the information.


  5. I also argue this is empirically distinguishable from awareness-style views,
  though this section is the shakiest. Rough idea: awareness views predict that making
  an agent aware of a consequence is enough for them to believe it; my view predicts
  that awareness is neither necessary nor sufficient — what matters is retrieval cost,
