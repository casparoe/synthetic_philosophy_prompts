  Let me think about the dogmatism paradox: if you know that p, then you know that
  any evidence against p is misleading evidence, so you''re justified in disregarding
  future counterevidence — which seems to license dogmatism. Kripke/Harman. A classroom
  activity could make students feel this: they know p (via reliable testimony or proof),
  then they receive "evidence" against p (fake polls, testimony), and the rules push
  them to dismiss it since they know it''s misleading. Design a game where knowing
  makes you immune to correction.


  Type "Design a classroom activity" fits well. Setting: epistemology seminar, ~15
  students, 75 minutes.


  Design: an activity where one group genuinely knows a fact (e.g., they verified
  the count of something), and then the facilitator introduces misleading counterevidence
  (fabricated but plausible), and students must decide whether to disregard it. The
  paradox: since they know p, the counterevidence must be misleading, so rationally
  they should dismiss it — and the game makes this dismissal feel both rational and
  disturbing. Could structure with stages: stage 1 establish knowledge (e.g., a jar
  of beans counted carefully together, or a logic puzzle whose answer they proved).
  Stage 2: introduce counterevidence — a "witness" claims otherwise, a "poll" of experts
  disagrees. Students who know p should reason the evidence is misleading. Then a
  twist: the facilitator actually swaps the answer? Hmm, careful — in a real classroom
  the facilitator could make the counterevidence true, showing the cost.


  Better: two teams. Team A is given conclusive proof of answer to a puzzle (they
  solve it themselves). Then they''re shown fabricated evidence (a mock newspaper,
  testimony from planted confederates) suggesting they''re wrong. Rules: they must
  write down their credence/confidence and decide whether to even look at further
  evidence. The game pays points for final correctness — making dismissal of evidence
  feel high-stakes. Then reveal: sometimes counterevidence is real? The facilitator
  can decide. Actually for reproducibility, better that counterevidence is misleading
  but very compelling, so the rational move (dismiss it) wins — showing dogmatism
  paradox "works." Then debrief: they behaved as the paradox licenses, and it felt
