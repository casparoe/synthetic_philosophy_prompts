  In the ninth and final objection considered in his 1950 paper on computing machinery
  and intelligence, Turing concedes that the statistical evidence for telepathy strikes
  him as overwhelming and observes that, if telepathy is genuine, an interrogator
  might identify the human participant in the imitation game by non-sensory means.
  His remedy is to conduct the test in conditions shielded against telepathy. The
  passage is usually treated as a biographical curiosity — a strange aside in an otherwise
  austere paper — and philosophers of mind and AI almost never ask what follows from
  taking it seriously.


  Suppose a small research group — three philosophers of mind and two logicians, funded
  for two years — proposes to do exactly that: not to investigate parapsychology itself,
  but to work out what Turing''s concession implies for the imitation game, for the
  criteria by which thought should be attributed to machines, and for the computational
  picture of the mind that the paper helped found. Their premise is that Turing, an
  empirically minded scientist, accepted what he took to be the best statistical evidence
  of his day and treated the result as a problem of experimental design rather than
  of metaphysics.


