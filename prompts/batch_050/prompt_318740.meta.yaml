  telepathy consists in, would the objection dissolve — and does the answer bear on
  whether Turing''s criterion is functionalist, behaviorist, or neither?

  4. What does the passage imply for how the test should be administered today, given
  that Turing took anomalous phenomena seriously but most researchers now do not?
  Is the right lesson that operational tests must be robust against any channel by
