  okay, for a reading group I need to write down my view on costly signaling and I
  want to know whether the pieces actually hang together. Please audit the commitments,
  dont give me a general explainer.


  Here is my current position:

  1. The handicap principle is not the claim that waste magically creates honesty.
  A signal is evolutionarily or strategically stable when the relevant marginal cost
  is lower for the high-quality type, or the expected benefit is higher, so low-quality
  types do better by not imitating it.

  2. The cleanest test of whether a trait is a handicap is counterfactual: if removing
  the trait would not lower its bearer''s fitness once all signaling benefits are
  held fixed, it isn''t a handicap; if removing it would raise fitness under that
  hold-fixed comparison, it is.

  3. Costly signals can have direct uses. Antlers can be both weapons and honest displays,
  so the fact that a display helps its bearer does not by itself disqualify it.

  4. A refundable escrow can be a costly signal. If a contractor forfeits a large
  bond on missed deadlines, reliable contractors face a lower expected loss than unreliable
  ones, even when the bond is usually returned.

  5. In a system I made up called proof of upkeep, a software project gets a badge
  by locking $10,000 for a year, with the money going to a competing project if the
  maintainers abandon it. Since $10,000 is $10,000, the badge should be equally informative
  whether it is posted by a student maintainer or by a large corporation.

  6. Once a costly display becomes mandatory or universally expected, it stops being
  informative, because then everyone has the same reason to produce it.

  7. A signal can be socially wasteful at the population level and individually rational
  at the same time; costly-signaling arms races do not refute the theory.

  8. If observers can already verify quality directly, adding an expensive signal
  usually has no strategic value, however reassuring it feels.


