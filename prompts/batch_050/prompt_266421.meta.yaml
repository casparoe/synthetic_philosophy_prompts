  Last night a friend and I spent three hours arguing over a passage in David Pearce''s
  online manifesto The Hedonistic Imperative. In the introduction, Pearce writes:


  "Yet what Michael Eysenck describes as the "hedonic treadmill" ensures that very
  few of us can be very happy for very long. An interplay of cruelly effective negative
  feedback mechanisms is at work in the central nervous system. Feedback-inhibition
  ensures that a majority of people would be periodically bored, depressed or angst-ridden
  in a recreated Garden of Eden."


  My friend read this as the core of the case for abolishing suffering through biotechnology:
  if misery is generated by a malfunctioning feedback mechanism rather than by anything
  about the world, then recalibrating the mechanism forfeits nothing of value — no
  wisdom, no signal, no meaning — and declining to do so once we can is just conserving
  a defect. I pushed back that the passage proves too much: if affect is homeostatically
  regulated, then any engineered elevation will also be regulated back down or, if
  it isn''t, will float free of the contrast structure that makes well-being intelligible
  at all — permanent bliss would be experientially flat in the way a thermostat stuck
  at maximum no longer registers warmth. She replied that this confuses the level
  of the set-point with the existence of variation around it: Pearce''s proposal (she
  said) is gradients of well-being, not a single frozen peak, so contrast is preserved
  while the floor is raised. I answered that she had now saved the proposal by making
  it trivial — raising everyone''s baseline while keeping ordinary ups and downs is
  not the paradise the manifesto advertises, and the Garden of Eden sentence is doing
  no work once contrast is restored. We ended stuck on two things: whether the passage
  actually supports her abolitionist reading or is merely an empirical observation
  about set-points that any view can absorb, and whether my contrast objection survives
  the distinction between a set-point''s level and variation around it.


  Please adjudicate: at each step of the exchange, who has the better of the argument
  and why; what, if anything, the passage by itself establishes; and what both of
  us may be missing about how a defender of Pearce would separate the empirical claim
  from the ethical imperative built on it.


