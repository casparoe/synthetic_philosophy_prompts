  Key content: tautology objection — "survival of the fittest" seems circular if fittest
  = those who survive. Propensity interpretation (Brandon, Mills & Beatty, Pence/Ramsey):
  fitness is a propensity/disposition of organisms to have reproductive success, analogous
  to probabilistic propensities. Objections: propensity interpretation faces the "environment
  problem" / fitness is relative to environments and time scales; short-run vs long-run
  expected reproductive success; the "tautology" worry persists in different form
  (supervenience — fitness supervenes on actual reproductive output?); explanatory
  circularity — does fitness explain survival, or is it just a redescription? Also
  Sober''s view: fitness as causal but not propensity... Actually Elliott Sober has
  a critique of the propensity interpretation: fitness is not a propensity to leave
  offspring, propensities cause things, and fitness differences don''t cause reproductive
  differences in some cases (e.g., when traits are correlated by drift... ). Sober''s
  1984 critique: the propensity interpretation has trouble because expected values
  vs actual — drift. Also Rosenberg, and the issue of "ecological" vs "expected reproductive
  success."


  Good moves for the dispute:

  1. One side says: natural selection is tautological — "survival of the fittest"
  defines fittest by who survives.

  2. Other side invokes propensity interpretation: fitness is expected reproductive
  success given traits and environment, so the theory is not circular — it''s probabilistic.

  3. First counters: then "fittest survive" is often false (drift, bad luck — the
  fitter organism can get struck by lightning), so the theory becomes unfalsifiable/vacuous,
  or statistical claims only.

  4. Other: statistical laws are still laws; the theory predicts distributions not
  individuals.

  5. First: the environment-relativity problem — which environment, which time horizon?
  Expected success over what span? If short-run, predictions fail; if long-run, never
  measurable. So fitness ascription smuggles in the outcome to define the environment
  ("hindsight problem").

  6. Other: this is like physics — gravity explains why the leaf falls without predicting
  its path; causal dispositions can be real even when we identify them partly via
  outcomes (fragility is identified via breaking but explains breaking non-circularly
  because breaking is correlated with molecular structure).

  7. First: but fitness has no such underlying structural base — supervenience problem:
  actual reproductive success doesn''t supervene on organism-plus-environment in a
  way... Actually the supervenience worry (Rosenberg): fitness doesn''t supervene
  on intrinsic properties of organisms.


  Ask for point-by-point adjudication. Good. Elaborate prompt, 1-3 paragraphs, formal.
  The asker reports it as a bystander, doesn''t signal which side.


