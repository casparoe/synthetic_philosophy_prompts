  residue report. That''s also quite good.


  - Corruption + verdicts on cases: also natural — gifts to officials, facilitation
  payments, campaign contributions, hiring the minister''s nephew, etc. But that''s
  more standard.


  - Paradox of tolerance + taxonomy: possible but more common.


  I think the paradox of blackmail with the cases type is the strongest and most original.
  The classic structure: blackmail is two rights making a wrong — it''s legal to threaten
  to reveal info, legal to reveal it, but illegal to ask for money not to. Cases:


  1. Telling a cheating spouse''s partner unless paid $10k → clearly blackmail, wrong.

  2. Threatening to report a crime to police unless paid → wrong.

  3. Threatening to sue someone unless they settle → fine (settlement negotiation).

  4. Union threatening to strike unless wages raised → fine.

  5. "I''ll tell your wife about the affair unless you pay me $5,000" → not fine.

  6. "I''ll tell your wife about the affair unless you stop dumping trash in the river"
  → fine-ish? (classic case — blackmail for a good cause)

  7. Prosecutor: plead guilty or we go to trial on bigger charges → standard practice,
  fine.

  8. Journalist: "give me an exclusive interview or I''ll publish the story anyway"
  → fine?

  9. Boycott threat: "we''ll boycott unless you change policy" → fine.

  10. "Pay me $1,000 or I''ll tell everyone what I saw you do" where what they did
  was legal but embarrassing → not fine.

  11. "Hire my nephew or I''ll leak that your company discriminates" → not fine.

  12. "Give me a raise or I quit" → fine.

  13. "Give me a raise or I''ll tell the board about your affair" → not fine.

  14. Threatening to leave a bad review unless refund → ?


  The puzzle: what principle separates them? Candidate principles: it''s about money
  (no — strike threats are about money), it''s about whether you''re entitled to the
  thing demanded, it''s about whether the threat is conditional on a personal gain
  vs. a cause, whether you''d have a right to demand the thing outright, etc. The
  classic analysis: blackmail demands things you have no right to demand, using a
  threat it would be legal to carry out. But settlement demands money too... The distinction
  between "demanding what you''re owed" vs. "selling your silence." Also: is the threat
  meant to pressure behavior vs. extract payment?


