  - Paradox of blackmail + verdicts-on-cases type: this is very natural. The paradox
  of blackmail is precisely a case-driven puzzle: threats that are legal to make and
  legal to carry out, yet illegal to combine. The asker can give verdicts on a set
  of cases (threatening to sue unless settlement, threatening to expose affair unless
  paid, union threatening strike, prosecutor offering plea deal, competitor threatening
  to enter market unless bought out, telling boss you''ll quit unless raise, threatening
  to reveal a politician''s vote unless donation...). Then ask what principle distinguishes
  legal hard bargaining from blackmail. That''s a great fit — concrete cases, verdicts
  that are hard to reconcile (plea bargaining feels fine, exposing affair for money
  feels not, threatening to tell wife unless neighbor pays $500 vs. threatening to
  tell wife unless neighbor stops dumping waste on your lawn...).


