  (1) Heritability is a population statistic about the proportion of variance in a
  trait associated with genetic differences, in a particular population at a particular
  time; it says nothing about individuals and nothing about how fixed or malleable
  the trait is. A trait can be highly heritable and yet drastically alterable by an
  environment outside the currently observed range.


  (2) Nonetheless heritability is policy-relevant: if, within a population, a trait
  such as educational attainment is highly heritable, that is good evidence that the
  environmental factors that currently vary (school quality, parenting style) are
