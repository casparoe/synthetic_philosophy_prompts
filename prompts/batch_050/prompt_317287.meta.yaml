  environmental variation will disappoint.


  (3) Twin studies license these estimates: the equal environments assumption — that
  identical and fraternal twins experience equally similar relevant environments —
  is approximately correct, and plausible violations do not materially bias the estimates.


  (4) Gene–environment correlation is pervasive: because people select, evoke, and
  modify their environments partly on the basis of their genotypes, much of what gets
  counted as "environment" is downstream of genetic differences.


  (5) Within-group heritability has no implications for the causes of between-group
  differences; a trait can be highly heritable within each of two groups while the
  gap between them is entirely environmental.


  (6) The gap between twin-study heritability and SNP-based heritability ("missing
