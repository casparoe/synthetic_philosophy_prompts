  Let me construct a set of commitments:


  The asker (e.g., a science writer or grad student) holds:

  (a) Heritability estimates are population-relative and say nothing about malleability
  — high heritability of intelligence doesn''t mean intelligence can''t be raised
  by environment (the standard line, e.g., plant-in-soil analogy, Lewontin).

  (b) Within-group heritability cannot by itself tell us about the causes of between-group
  differences (standard line).

  (c) Given (a) and (b), heritability estimates are nonetheless useful — they tell
  us something important about whether current environmental variation matters for
  the trait, so a high heritability estimate is evidence that equalizing known environmental
  factors won''t do much (this is where tension arises: (a) says heritability says
  nothing about malleability, but (c) wants it to be informative about interventions/policy).

  (d) Twin studies give unbiased estimates because the equal environments assumption
  holds roughly (standard).

  (e) Gene-environment interaction matters a lot, and heritability estimates miss
  it because they are main-effects variance components — tension with (d) and (c):
  if G×E is substantial, heritability estimates are less informative.

  (f) Something like: molecular (SNP) heritability being much lower than twin-study
  heritability (missing heritability) should be explained primarily by... something.


  Need at least one apparent tension that dissolves. E.g., high heritability + successful
  intervention (phenylketonuria / myopia and glasses) — apparent tension that dissolves
  because heritability is about existing variation, not novel interventions.


  Also genuine tension: (a) "heritability says nothing about malleability" vs (c)
  "heritability is useful for policy because it tells us environmental interventions
  won''t help" — these genuinely conflict; Turkheimer and others have noted heritability
  being high does weakly constrain within-current-environment-range interventions.
  Actually the subtler tension: if you insist heritability tells you nothing about
  interventions, you can''t use it to argue current interventions won''t work; but
  many people hold both.


  Another genuine tension: (d) EEA trust in twin studies + (e) belief that G×E and
  gene-environment correlation are pervasive — rGE actually biases twin estimates
