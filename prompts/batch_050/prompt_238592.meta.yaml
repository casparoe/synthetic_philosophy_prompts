  Paragraph 2: the argument numbered:

  (1) An action (or policy) is wrong only if it is worse for some particular person
  than the alternative — only if there is someone who has a complaint against it.

  (2) Which people exist in the future depends on large-scale policy choices: a different
  climate/energy policy would so alter the timing and circumstances of conception
  that, after a few generations, an entirely different set of people would exist.

  (3) Under the high-emissions policy, future people will have lives that are, though
  diminished, on the whole worth living.

  (4) A person whose life is worth living, and who would not have existed under the
