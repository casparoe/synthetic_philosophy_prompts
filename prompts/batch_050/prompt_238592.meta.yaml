  Good combination: nonidentity problem + proves-too-much argument, or reflective
  equilibrium + accuracy audit. Or CEV + false presupposition.


  Let me do the nonidentity problem with a proves-too-much argument — that fits a
  retired scientist well (thinking about climate policy, future generations). A retired
  natural scientist thinking about climate policy and the nonidentity problem is natural.


  Construct argument: (1) An act is wrong only if it makes some particular person
  worse off than they would otherwise have been. (2) Choosing a high-emissions policy
  changes who exists (different people conceived due to timing changes). (3) So the
  future people under the high-emissions policy wouldn''t have existed under the low-emissions
  policy. (4) Their lives are worth living (not worse than nonexistence). (5) So the
  high-emissions policy wrongs no one. (6) Same reasoning applies to any long-horizon
  policy, including... something absurd: e.g., deliberately depleting resources, or
  a policy of "consume now" that leaves future people with lives still worth living.
  (7) Conclusion: we have no obligations regarding long-term policy affecting future
  generations, which is absurd.


  The scientist persona could frame it: came across Parfit''s nonidentity problem
  in a book, built this argument with a reading group. The argument could "prove too
  much" — e.g., extending to historical cases: it would also show that nobody was
  wronged by past policies that led to their existence under bad conditions... e.g.,
  the argument seems to show that slaveholders'' descendants can''t complain... hmm,
  that''s tricky. Or: the argument proves that even a policy designed to cause suffering
  (as long as lives are worth living) is unobjectionable, e.g., "the risky energy
  policy" — Parfit''s own examples.


  The subtle flaw / diagnosis: premise (1) is the person-affecting intuition, and
  the real question is which premise is least costly to reject. The argument is essentially
  valid — this is the genuine nonidentity problem, so the good answer explains the
  options: reject person-affecting principle (impersonal value), wide vs narrow person-affecting
  views, same-people vs same-number choices, average vs total utilitarianism issues,
  etc. The cost accounting: rejecting (1) means accepting impersonal wrongs; rejecting
  (4) requires comparing existence to nonexistence (comparativism about nonexistence,
  contested); rejecting (2) — empirical premise that policies don''t affect identity
  — is actually mostly true for large policies.


  I can make it "seem to prove too much" by pushing to an absurd conclusion like:
  a policy of deliberately choosing to have children with avoidable handicaps when
  you could wait (the "two medical programs" example) would be morally indifferent,
  or even that a mother who takes a drug causing her child''s disability (when she
  could have waited two months and conceived a healthy child) does nothing wrong.


  Structure: two-three paragraphs, formal, retired scientist voice. Maybe: "Since
  retiring from my position in [geophysics/biochemistry], I have been reading moral
  philosophy..." Mention reading group or grandchild asking about climate obligations.
  Lay out numbered argument. Ask: which step to reject, what rejecting it costs, and
  note they''d like to keep (1) if possible or keep the conclusion that climate policy
  matters.


  I should avoid quoting anything. No citations needed. Parfit''s name — I can mention
