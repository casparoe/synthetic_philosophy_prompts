reasoning_summary: 'I''ll pick "Internal vs. external reasons" — a domain that''s
  somewhat niche but well-known enough in moral philosophy that models should know
  Bernard Williams''s internal reasons vs. external reasons debate. The "fairness
  of a summary" type fits well: I can write a plausible summary from a confident friend
  or a blog post with subtle misrepresentations.


  Common subtle misrepresentations of Williams''s internalism:

  1. Conflating "internal reasons" with "selfish reasons" or reasons based on desires
  alone — Williams''s "subjective motivational set" (S) includes dispositions of evaluation,
  patterns of emotional reaction, personal loyalties, projects — not just desires.

  2. Claiming Williams says you can never reason someone into anything — actually
  Williams allows sound deliberative routes, including correction of false beliefs,
  adding imagination, and deliberation can reveal new reasons.

  3. Presenting "A has a reason to φ iff A could reach the conclusion to φ by sound
  deliberation from S" — common misstatements.

  4. The external reasons theorist''s objection presented as a refutation.

  5. Confusing internal reasons with "Humean" desire-satisfaction in a crude way.


  The example from Williams: Owen Wingrave example; the gin/petrol example (agent
  believes the glass contains gin when it''s petrol — internal reasons theory says
  no reason to drink it since belief false; actually Williams says if the stuff is
  petrol, the agent doesn''t have a reason to drink it even though he thinks he does
  — wait, in "Internal and External Reasons," Williams says: if the agent desires
  gin and believes the glass contains gin but it''s petrol, we wouldn''t say he has
  a reason to drink it? Actually Williams''s claim: "any rational deliberative agent
  has in his S an interest in getting the right answer" — he says the agent has no
  reason to drink the petrol, because there''s no sound deliberative route to drinking
  petrol... hmm, actually Williams acknowledges that if the agent believes it''s gin,
  he has a reason in an "explanatory" sense? The standard reading: Williams says the
  agent doesn''t have a reason to drink the petrol, though his action would be explained
  if he drank. Some critics (and Williams''s own later discussion) note it''s more
  natural to say the agent has a reason relative to a false belief.)


