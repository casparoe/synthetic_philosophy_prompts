  \ process is in fact reliable, so each reading gives knowledge, and the inference\
  \ is valid). Hmm, need to construct a real back-and-forth with a few rounds, both\
  \ sides making decent points, no strawmen.\n\nClassic moves in the literature (Cohen,\
  \ Vogel):\n\n- Vogel's Roxanne: Roxanne has a reliable gas gauge. She looks at the\
  \ gauge, it reads F, she believes the tank is full. Then she infers: the gauge reads\
