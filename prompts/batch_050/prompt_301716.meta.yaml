  \ accept easy knowledge.\n- Cohen's response: basic knowledge doesn't require knowing\
  \ the source is reliable; the anti-bootstrapping intuition may be context-dependent.\n\
  - The track-record argument's structure: it uses the very faculty/source whose reliability\
