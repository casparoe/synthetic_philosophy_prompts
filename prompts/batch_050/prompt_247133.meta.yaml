  Article summary (fabricated, attributed to unnamed essay): "The Kelly criterion
  shows that rational agents maximize the logarithm of wealth rather than wealth itself.
  Because time averages differ from ensemble averages — the ergodicity problem — expected
  utility theory gets gambling wrong: maximizing expected value leads to ruin with
