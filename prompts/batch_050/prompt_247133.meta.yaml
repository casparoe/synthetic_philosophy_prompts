  Misrepresentations to plant:

  1. "Guaranteed to eventually outperform any other strategy" — roughly true (Kelly
  asymptotically dominates almost surely vs. essentially different strategies — Breiman''s
  result) but stated too strongly; need care. Actually this is close to true: Breiman
  1961 showed Kelly maximizes asymptotic growth rate and minimizes expected time to
  reach a goal. But "guaranteed" overstates: it''s almost-sure asymptotic dominance,
  not pathwise guarantee, and in finite time Kelly can underperform badly.

  2. "Can never go bankrupt" — Kelly never loses everything in a single bet (fractional
  betting), but with continuous outcomes or limited divisibility it can approach zero;
  also overbetting beyond Kelly leads to ruin. The claim "can never go bankrupt" is
  true in the idealized model for fractional Kelly with infinitely divisible capital
  but the phrasing overstates.

  3. "Refutes expected utility theory" — the big conflation. Kelly = maximizing expected
  log utility, so it''s a special case of EU theory, not a refutation. Samuelson''s
  point. Also, ergodicity economics'' claim that "time average ≠ ensemble average
  refutes EU" is contested: EU maximizers with log utility already do Kelly; EU theory
  doesn''t mandate risk neutrality.

  4. "Log utility is uniquely rational" — overstatement of a modest thesis; Kelly''s
  optimality is about growth rate, which is only one criterion; Samuelson argued growth
  optimality doesn''t imply normative uniqueness (his "fallacy of large numbers" arguments).

  5. "Maximizing expected value leads to ruin with probability one" — in the classic
  repeated St. Petersburg-like or double-or-nothing multiplicative gambles, betting
  everything every round leads to ruin a.s., yes; but EV maximization doesn''t compel
  betting everything if there are constraints... Actually an EV maximizer with linear
