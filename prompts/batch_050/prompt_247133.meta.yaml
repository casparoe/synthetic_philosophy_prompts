  ''In sequential gambles where payoffs compound, expected utility theory gives systematically
  bad advice, because it evaluates each round by averaging across parallel possibilities
  rather than asking what happens to a single agent over time. Wealth dynamics are
  multiplicative, not additive, and multiplicative processes are non-ergodic: the
  time average of growth along one trajectory diverges from the ensemble average across
  possible worlds. A bettor who maximizes expected value at every step will stake
  aggressively on favorable bets and, in the long run, goes broke with probability
  one. The Kelly criterion fixes this by maximizing the geometric growth rate of wealth
  — equivalently, the expectation of log wealth — and thereby identifies the uniquely
  rational stake. Kelly betting is guaranteed to outperform any other strategy in
  the long run and never risks ruin. The lesson is that logarithmic utility is not
  one risk preference among many, as the textbook picture assumes, but the only attitude
  toward risk compatible with survival in a non-ergodic world. Expected utility theory''s
  central mistake is thus corrected not by amending its axioms but by replacing its
  ensemble logic with the logic of time.''


