  I chair the editorial standards committee of a mid-sized regional newspaper, a job
  I took on three months ago after fifteen years as a reporter, and I need help drafting
  the written opinion I will circulate before our vote next month.


  The immediate background is painful. In the spring, an anonymous comment thread
  under a story about a fatal traffic accident identified a local schoolteacher as
  the driver. It was wrong — the driver was someone else with a similar name — but
  by the time we corrected it, the thread had been screenshotted and circulated, and
  the woman has since taken leave from her job. The publisher has now proposed that
  we abolish anonymous commenting altogether and require every commenter to register
  under a verified legal name, and the committee is split down the middle.


  One of my colleagues, a former philosophy lecturer, has been pressing a Kierkegaardian
  argument on us: that the press manufactures something he calls the public, an abstraction
  that lets everyone hold and broadcast opinions without ever standing behind them
  as a concrete person, and that anonymity is not a flaw in this arrangement but its
  perfection — opinion with the responsibility boiled off, chatter replacing communication.
  On his reading, requiring real names is not a civility measure but a partial undoing
  of the public itself, since it forces the commenter back into the position of someone
  who can be answered, reproached, and held to account. Another colleague counters
  that Kierkegaard is a poor witness for our side, since he published much of his
  own work under invented names, so that pseudonymity can apparently serve serious
  purposes even on his own showing.


  The strongest argument on the other side, as I see it, is not abstract at all: we
  cover a small region dominated by a handful of employers, and some of our most valuable
  reader input — about working conditions at the hospital group, about the school
  district — has come from people who could not safely have written under their own
  names. A real-name rule would not merely silence trolls; it would silence the nurse
  and the teacher''s aide.


  Draft the committee''s written opinion. It should: (1) recommend a concrete policy
  — adopt the publisher''s proposal, reject it, or replace it with a specified alternative
  — and state plainly what we will do; (2) take the Kierkegaardian diagnosis seriously
  enough to say whether it actually supports the recommendation, including an honest
  answer to the pseudonym objection; and (3) give the losing side''s strongest consideration
  its due, in a form that colleagues who vote the other way could recognize as fair.
  Around 800–1,000 words, addressed to the full board.


