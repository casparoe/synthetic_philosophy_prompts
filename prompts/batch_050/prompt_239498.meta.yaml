  Prompt draft (Type 3, summary audit):


  Setup: asker encountered a summary in a popular essay/podcast. Write the summary
  with plausible mostly-right content and one or two subtle misrepresentations: (a)
  "Popper argued that a tolerant society must be intolerant of intolerance, i.e. it
  should suppress intolerant speech by law" — misrep: Popper says we should claim
  the right to suppress only as a last resort, when intolerant movements refuse rational
  debate and incite violence; he also says suppression isn''t always wise. (b) "he
  proved a logical contradiction/paradox, i.e. tolerance logically self-destructs"
  — overstatement: it''s a practical/sociological thesis about limits, not a logical
  proof. (c) attribute it to a defence of free speech absolutism or to censorship
  — distortion. Also conflating tolerance as a virtue of persons with legal tolerance.


  Ask: sentence-by-sentence audit, what''s accurate, what''s subtly wrong, what a
  careful reader of Popper would say, does the essay''s conclusion (e.g., "therefore
  platforms should deplatform X") follow.


  Requirements: separate settled scholarship from contested interpretation; British
  English; 1-3 paragraphs, formal, with some seeding detail (e.g., preparing for a
  reading group).


  Also add nuance: Popper''s actual text: "Unlimited tolerance must lead to the disappearance
  of tolerance..." — don''t quote. Paraphrase. Also mention that Popper frames tolerance
  as mutual ("meet them on the level of rational argument") and that we should claim
  the right to suppress them "if necessary even by force" only when they refuse debate
  — but I''m paraphrasing in instructions to the answerer? Better: the asker asks
  whether the summary matches what Popper wrote, and asks the responder to distinguish
  what the text says from what later interpreters say.


  Make sure the asker requests: separate what is settled (what the text actually says)
  from what is genuinely contested (how to apply it, whether it''s a paradox at all),
  and British English.


  Length: 2-3 paragraphs. Include the summary itself in quotes? The summary is invented
  by me, so quotation marks are fine (not a real text). Good.


