  The summary: ''In The Open Society and Its Enemies, Popper demonstrated that tolerance
  is logically self-defeating: a society that tolerates everything will, by the laws
  of logic, eventually be destroyed by the intolerant. He therefore held that tolerant
  societies not only may but must suppress intolerant opinions whenever they appear,
  since tolerating intolerance is a contradiction, like a square circle. This, the
  essay concludes, settles the contemporary debate: refusing a platform to speakers
  with intolerant views is not censorship but simple consistency, and anyone who objects
  has failed to grasp the paradox.''


  Misrepresentations: "demonstrated... by the laws of logic" (it''s not a logical
  proof; it''s a practical observation, and Popper explicitly contrasts it with logical
  paradoxes? Actually Popper calls it a paradox but his claim is empirical/practical),
  "must suppress whenever they appear" (Popper: right to suppress should be claimed,
  but used when the intolerant refuse rational argument and incite violence; he even
  says suppressing them may be unwise — "we should consider incitement to intolerance...
  as criminal" paraphrase; also he says we should not always suppress), "settles the
  contemporary debate" — Popper''s target was movements that forswear argument, not
  offensive speech generally; and his remark was a footnote, later philosophers (Rawls
  etc.) differ.


  Ask for: sentence-by-sentence audit; what Popper''s text actually commits to (paraphrase),
  what''s a common inflation, what''s wrong; whether the essay''s conclusion follows
  even from the accurate parts; distinguish the textual question (settled) from contested
  questions (scope, application, whether tolerance is a contract/value, Rawls''s alternative
  reading) and not present contested views as consensus. British English.


  Word count fine. Write formally, 2-3 paragraphs.'
