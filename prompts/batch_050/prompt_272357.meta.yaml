  3. VSL: derived from willingness to pay for small risk reductions, applied to statistical
  (unidentified) lives — not "the price of a citizen''s life"; conflating with identified
  lives triggers the rule-of-rescue / identifiable victim issue.

  4. Also VSL ≠ QALY framework really; they''re different traditions (welfare economics
  vs health economics), related but distinct — newsletter conflates.


