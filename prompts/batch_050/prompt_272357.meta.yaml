  Spinoza''s claim that democracy is the most "natural" (imperium absolutum) is based
  on right = power; his preference for democracy is partly prudential (stability)
  not moral-egalitarian; he explicitly worries about the multitude being governed
  by affect/fear and superstition; his exclusion of women (famously in the Political
  Treatise) complicates the "democrat" label; also his defense of democracy isn''t
  that the masses are wise — he says all states are ruled by the few in practice;
  "multitudo" is terrifying when swept by passion. A good audit would separate: (1)
  right coextensive with power — accurate; (2) democracy most natural — mostly accurate
  in TP sense; (3) masses rational so democracy stable — misrepresentation: Spinoza
  thinks all humans incl. masses are mostly led by passion, and democracy''s stability
  comes from institutions/design; (4) first modern democrat — overstatement/common
  simplification given exclusions and that his model state in TP is aristocratic-ish?
  Actually he treats democracy and aristocracy; in TP he defends democracy but with
  constitutional design. Also he excludes women explicitly, arguing they''re naturally
  subordinate — that complicates "egalitarian democrat."


