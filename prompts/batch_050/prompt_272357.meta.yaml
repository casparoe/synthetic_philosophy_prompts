  Errors/subtleties:

  1. QALYs value health gains from interventions (life-years weighted by quality),
  not the value of a patient''s life; cost-effectiveness compares treatments'' cost
  per QALY gained, not patients.

  2. "younger beats older, healthy beats disabled" — partly true as a consequence
  in some cases (life-year maximization favors those with more to gain), but the framing
