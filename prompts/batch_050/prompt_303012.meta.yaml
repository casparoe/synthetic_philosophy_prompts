  The summary should be mostly right with one or two subtle misrepresentations. Ideas
  for subtle errors in a summary about fictional names:


  - Conflate "Holmes doesn''t exist, so the name is meaningless" (Russellian descriptivism
  vs. Millian view).

  - A plausible popular summary: "Since Sherlock Holmes doesn''t exist, the name refers
  to nothing, so sentences like ''Sherlock Holmes is a detective'' are neither true
  nor false; but we can say they''re ''true in the fiction'' because the stories pretend
  he exists. Kripke/ Evans... " Hmm.


  Subtle misrepresentations could include:

  - Claiming that "true in the fiction" just means whatever the text explicitly states
  (missing closure/implication problems).

  - Claiming that pretense theory says when we talk about Holmes we pretend to refer
  (correct) but then saying that therefore all fictional claims are literally false
  (conflating).

  - Saying "Sherlock Holmes is more famous than any real detective" — cross-fictional
  comparisons problem, claiming such sentences are also true in the fiction (wrong
  — metafictive vs. fictional statements).


  Good structure: a friend/popular book summarizes: "According to philosophers, ''Sherlock
  Holmes'' refers to an abstract fictional character created by Conan Doyle, so the
  name does refer after all. Sentences in the stories are true iff Doyle wrote them
  down, so ''Holmes played the violin'' is true and ''Holmes had a third nostril''
  is false. That''s why it''s true that Holmes is more famous than any living detective."


  Errors: (1) presenting the abstract-artifact view as "the" philosophical view (it''s
  contested; many deny fictional names refer); (2) the explicit-content criterion
  (ignores what the text entails/presupposes — e.g., Holmes had a heart, lived closer
  to Paddington than to Edinburgh, etc.); (3) the fame claim is not true "in the fiction"
  but metafictive — different mechanism.


  Also the summary might say "since the name refers to an abstract object, ''Holmes
  is a detective'' is literally true" — but abstract objects aren''t detectives, a
  known problem for artifactualism. That could be another subtle misrepresentation:
  saying the view straightforwardly makes story sentences literally true.


