  The frame problem: how does the robot know which facts are relevant/which things
  don''t change when it acts.


  Program equilibrium + argument-that-proves-too-much: An argument that since program
  equilibrium (Tennenholtz) shows cooperation is rational between agents that can
  read each other''s code, therefore... something absurd, like transparency obligations
  — an argument that we should make all our decision procedures public, or that mutual
  transparency solves all conflict. Could construct: (1) In the prisoner''s dilemma,
  if both players can read each other''s source code, cooperation is an equilibrium.
  (2) So mutual inspectability transforms conflict into cooperation. (3) Therefore,
  any institution that wants cooperation should require full transparency of decision
  procedures — published algorithms for prosecutors, managers, etc. (4) But that seems
  to prove too much: full transparency seems to enable exploitation (Goodhart), and
  the argument would also show that two spy agencies should share code... Where does
  it go wrong? The subtle flaw: program equilibrium requires the programs to be able
  to verify each other and the result depends on the equilibrium being just one of
  many — also it requires the reading to be of actual source code, not descriptions;
  and unilateral transparency destroys the symmetry. That''s a good prompt.


  But the asker is supposed to be someone without academic background who has been
