  node, that belief has already been falsified — so the reasoning is self-undermining.
  (2) Maya replies that''s the standard paradox but the equilibrium analysis doesn''t
  require interpreting counterfactual nodes. (3) Daniel: if I pass at node 1 and you
  take at node 2, I only lose a little; the potential gains of cooperation dominate
