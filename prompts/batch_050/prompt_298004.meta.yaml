  I''ve never studied philosophy, but for years I''ve been bothered by a question
  I can''t settle on my own, and I''d like help thinking through what follows from
  it.


  The question is whether self-deception is even possible. By self-deception I mean
  cases like: a man whose marriage is failing and who, on some level, knows it — the
  evidence is there in front of him — yet sincerely insists, to himself and others,
  that everything is fine. The puzzle, as I understand it, is twofold. First, deceiving
  someone seems to require that the deceiver knows the truth while the deceived doesn''t;
  if deceiver and deceived are the same person, that person must apparently both believe
  and not believe the same thing at once, which looks contradictory. Second, deception
  seems to involve an intention — the deceiver deliberately misleads — but if I deliberately
  set out to mislead myself, surely I''d see through my own plan, the way you can''t
  surprise yourself by hiding your own birthday present.


  I''ve tried to solve it myself with the idea that self-deception is not believing
  a falsehood but rather managing your attention: you never quite form the belief
  because you keep yourself from dwelling on the evidence — changing the subject in
  your own head, seeking out one-sided information, never putting the suspicion into
  words. But I''m not sure whether this dissolves the paradox or just relocates it,
  because managing your attention that way seems to require knowing, at some level,
  exactly what you must not look at.


  Here''s my actual question: what are the most important practical implications of
  this puzzle, and of the main ways philosophers have tried to resolve it, for how
  I should conduct my own inner life? For instance: if genuine self-deception is impossible,
  does that mean I can trust my sincere avowals more than people seem to think, or
  does it instead mean the thing I''m calling self-deception is a different and subtler
  failing that needs different defenses? If it''s possible but only through something
  like attention management or compartmentalized minds, which everyday practices (journaling,
  saying things out loud, asking others to challenge me, making bets with myself about
  future outcomes) would that diagnosis actually predict to work? And what does the
  analysis imply about responsibility — is a self-deceived person more like a liar
  or more like a victim of a liar, and should that change how I judge, say, a relative
  who seems to be deceiving herself about her drinking?


  I''d like the implications to be genuinely consequential — things that would change
  a habit, a policy of self-scrutiny, or a judgment — rather than a summary of positions,
  and I''d like you to flag honestly where the philosophical disagreement is deep
  enough that no confident practical conclusion follows.


