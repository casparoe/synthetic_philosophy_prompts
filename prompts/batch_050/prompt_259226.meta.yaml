  Aumann''s agreement theorem: "Agreeing to Disagree" (1976) — common knowledge of
  rationality + common priors + common knowledge of posteriors implies identical posteriors.
  Common misrepresentations: that it means rational people can never disagree; that
  it applies to real humans; that common knowledge means both people know it rather
  than the infinite hierarchy; that it requires honesty about reasons rather than
  posteriors; conflation with mere "sharing information" arguments; the Robin Hanson
  extension. Also Geanakoplos-Polemarchakis result that iterative updating converges.


  Write a plausible summary attributed to a coworker or a blog post. Make it mostly
  right with one or two subtle misrepresentations:

  - Conflating "common knowledge" with "mutual knowledge" (both know).

  - Claiming the theorem shows rational agents must agree, full stop — overstating,
  ignoring common prior assumption.

  - Claiming agents can reach agreement by trading reasons (actually the theorem is
  about posteriors; the dialogue result is about iterative announcement of posteriors,
  and honesty/trust assumptions).

  - Maybe claiming it proves disagreements are always due to irrationality or hidden
  priors — that''s a misapplication to humans.


  Sections requested by name and order: e.g., "Verdict up front", "What''s accurate",
  "What''s subtly wrong", "What a careful statement looks like", "Bottom line". With
  rough lengths.


  Software engineer framing: encountered in a rationality/ML blog discussion, coworker
  at standup, debating whether to weight this in a forecasting team at work.


  No quotes needed. Lengths: one to three paragraphs.


  Write it.'
