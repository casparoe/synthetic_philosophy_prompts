  Classic argument: demandingness objections prove too much because any moral theory
  with stringent duties will sometimes demand enormous sacrifice, and if demandingness
  is an objection simpliciter, morality itself becomes optional/self-effacing.


  Structure:

  (1) If a theory can demand of an agent that she sacrifice what makes her life worth
  living, that theory is thereby shown false (the demandingness objection).

  (2) Consequentialism can demand this → reject consequentialism.

  (3) But for any moral theory T and any fixed limit L on permissible demands, circumstances
  can arise where doing what T requires exceeds L — e.g., the person who must not
  frame an innocent man even though a mob will kill his family otherwise.

  (4) So either every moral theory is false (moral error theory) or demands must be
  capped.

  (5) If demands are capped at L, then morality sometimes permits you to do the morally
  worst thing — e.g., let millions die to keep your hobby — which collapses morality
  into self-interest.

  (6) Morality isn''t optional / error theory is false.

  (7) Therefore demandingness objections are never sound.


  Where does it go wrong? Good answer: the inference in (3) treats "can demand" as
  sufficient — but the objection isn''t that a theory ever demands a lot, it''s systematic
  demandingness vs. occasional; or the distinction between doing vs. allowing, negative
  vs. positive duties — deontology''s demands are bounded (don''t kill) whereas consequentialism''s
  are unbounded; or the step from (4) to (5) — capping demands needn''t permit the
  worst thing; satisficing; or (1) conflates "requires great sacrifice" with "requires
  sacrificing what makes life worth living" — scalar vs threshold readings. The real
  literature: the objection is about the content of demands (alienation from one''s
  projects, integrity — Williams) not merely magnitude. Also the distinction between
  demandingness as a reason to reject vs. as a reason for agent-centered prerogatives.


