  Requirements to list:

  1. Verdicts on the standard Frankfurt case (agent responsible despite lacking alternatives)
  — or at least a principled verdict, with the recognition that the case''s force
  depends on the details (prior sign cases).

  2. Response to the dilemma defense: either the prior sign is causally sufficient
  for the action (begs the question against the incompatibilist) or it isn''t (leaves
  a flicker of freedom) — a theory must say which horn it takes.

  3. Handle robust vs non-robust alternatives: must not let trivial flickers do the
  work if alternatives matter (the "flickers of freedom" strategy needs alternatives
