  6. Tracing: cases where the agent was responsible for lacking alternatives at an
  earlier time (culpable incapacity) — a theory must integrate tracing without making
  all responsibility derivative.

  7. Distinguish responsibility from blameworthiness/praiseworthiness, and moral responsibility
  from causal responsibility.

  8. Not beg the question: the theory shouldn''t build in PAP or its negation as an
  unargued premise.

  9. Handle manipulation cases / sourcehood: some argue Frankfurt cases show what
  matters is the actual sequence/source — the theory must say what about the actual
  sequence grounds responsibility, and handle manipulation worries that arise.

  10. Joint satisfiability: flag that "responsibility requires robust alternatives"
  + "the Frankfurt agent is responsible" are inconsistent — and that any theory must
  give up one; discuss which desiderata are negotiable.


  Also possibly: the requirement of handling "blockage" cases (no intervener, alternatives
