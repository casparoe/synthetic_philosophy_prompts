  "In a graduate seminar on moral responsibility, I want to set the terms of debate
  before assigning any readings. Write the desiderata that an account of moral responsibility
  for action must satisfy once Frankfurt-style cases are on the table — cases in which
  an agent acts on her own reasons and meets every plausible condition on responsibility,
  while a counterfactual intervener stood ready (but never needed) to ensure that
  she act exactly as she did. For each requirement, give the case or consideration
