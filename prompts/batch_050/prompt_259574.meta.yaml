  I''m writing an essay for a political theory seminar and would like a reading of
  Shakespeare''s Measure for Measure through Han Feizi''s Legalism — specifically
  the contrast between rule by virtue (the Confucian idea that a ruler''s moral example
  transforms the people) and rule by incentives (clear, publicized laws plus the two
  handles of reward and punishment, wielded impersonally and without exception).


  Set up the problem this way: Vienna''s strict statutes against sexual license have
  gone unenforced for years; Duke Vincentio, rather than enforce them himself or repeal
  them, hands power to Angelo, a man of reputed austerity, and stays in the city disguised
  as a friar to watch what follows. Angelo revives the dormant law and applies it
  without exception to Claudio; he then proves willing to trade Claudio''s life for
  Isabella''s body. The Duke ends the crisis through surveillance, deception, and
  a substitution trick, and closes the play by pardoning or punishing people according
  to his own discretion rather than any statute.


  I''d like the reading to work through at least these cruxes, using the Legalist
  vocabulary where it genuinely fits (fa, shi, shu, the two handles, the matching
  of names to performance) rather than as decoration:


  1. The dormant statute. Han Feizi''s position is that law works only when it is
  publicized and applied consistently so that people can predict consequences. From
  that standpoint, is Angelo''s revival of an unenforced law after years of desuetude
  the correct Legalist move — restoring the law''s credibility — or exactly the arbitrariness
  Legalism is meant to prevent? Consider whether the play itself takes a view: whom
  does it make us sympathize with, and does that sympathy track a principle?


  2. Angelo as the case against virtue-based appointment. Angelo is chosen for his
  reputation for severity, and Han Feizi warns repeatedly that trusting men rather
  than institutions is the ruler''s central error, and that reputations of virtue
  are precisely what should not be trusted. Does the play simply confirm this — the
  virtuous-seeming minister is the corrupt one — or does it complicate it? Notably,
  Angelo''s fall comes not through greed or faction but through desire he appears
  not to have known he had; is that a failure Legalist technique (verification, the
  comparison of claim and conduct) could have caught in advance, or does the play
  suggest a kind of corruption no incentive structure addresses?


  3. The Duke as closet Legalist. The disguised ruler who conceals his identity, gathers
  information covertly, and manipulates everyone through deception looks, on paper,
  like a practitioner of shu — the arts of secrecy and control Han Feizi recommends.
  But Han Feizi''s ruler is supposed to be still and inscrutable, letting laws and
  ministers do the work, and the Duke''s method is the opposite: personal, theatrical,
  improvisational, and ending in a finale where every outcome flows from his whim.
  Read the ending — the pardons, the forced marriages, the punishment of Lucio — as
  a judgment on this hybrid: does the play show the failure of rule-by-technique when
  it becomes rule-by-personality, and would Han Feizi see the final scene''s arbitrary
  mercy as worse than Angelo''s arbitrary severity?


  Then step back: the play is usually read as being about mercy and equity tempering
  strict justice. What does a Legalist reading do to that consensus — does it reveal
  that both the harsh and the merciful options on offer are personal rule dressed
  in different costumes, so that the play is, despite itself, an argument for impersonal
  law? And what does the play add to the Legalism-Confucianism debate that the treatises
  don''t: I have in mind that the Han Feizi text treats human badness as predictable
  and thus manageable, whereas the play''s central surprise is self-opacity — Angelo
  does not know himself. Does Han Feizi''s system need the premise that people, including
  rulers and ministers, know what they want?


  Be faithful in both directions: don''t flatten the play into a Legalist allegory,
  and where the play resists the reading, say so.


