  Draft:


  I''m a backend engineer at a mid-sized payments company. Last sprint, two senior
  colleagues, Mara and Jonas, got into an extended argument — over a system-design
  decision, then over decision theory itself — and eventually asked me to referee.
  I couldn''t, and I''d like a move-by-move adjudication.


  Background: we had to choose a migration strategy for our transaction database before
  the holiday season. Three options: (A) stay on the current system, which is slow
  under load but has never failed catastrophically; (B) full cutover to a new system,
  which is much faster and, by our testing, reliable, but whose failure mode under
  conditions we can''t fully simulate is a total outage; (C) a staged rollout, middling
  on every axis. The key unknown: peak-season traffic, which depends on a new client
  deal whose size we cannot estimate. Mara and Jonas agreed on the rough outcome table
  and agreed we had no defensible probability distribution over traffic scenarios.
  Then:


  1. Mara: precisely because we have no information about the probabilities, we should
  treat the scenarios as equally likely and pick the option with the best expected
  outcome — that''s B. With no basis for differential weighting, uniform weighting
  is the only non-arbitrary choice.


  2. Jonas: uniform weighting is not the absence of an assumption; it''s an assumption,
  and a load-bearing one. Under genuine ignorance the rational rule is maximin: compare
  only each option''s worst case and pick the option whose worst case is least bad
  — that''s A. A total payments outage in December could end the company; a strategy
  whose justification evaporates if your made-up probabilities are wrong is not a
  justification.


  3. Mara: maximin ignores every column of the table except the worst one; it would
  prefer a guaranteed loss of $1,000 to a 99% chance of a fortune with a 1% chance
  of losing $1,001. Taken seriously it paralyzes — the worst case of shipping anything
  is always catastrophic if you let imagination define the scenario space. And note
  Jonas is happy to assert A''s worst case is "known" to be mild, which is exactly
  the kind of unjustified certainty he accuses her of.


  4. Jonas: he concedes unrestricted maximin is too strong and restates: maximin is
  warranted specifically when (i) probabilities are unavailable, (ii) some option''s
  worst case is ruinous while another''s is tolerable, and (iii) the upside forgone
  is merely nice-to-have. All three hold here. He also offers a compromise rule, minimax
  regret: compute, for each scenario, how much each option falls short of the best
  option in that scenario, and minimize the maximum shortfall. On our table that recommends
  C, the staged rollout, and he''d accept C.


  5. Mara: minimax regret has a structural defect — the regret table depends on which
  options happen to be on the menu. Adding a fourth option nobody would ever pick
  (say, a from-scratch rewrite by December) changes the "best achievable" benchmark
  in some scenarios and can flip the recommendation between A, B, and C, even though
  nothing about those three has changed. A rule whose verdict on three options is
  hostage to the presence of a fourth, irrelevant one can''t be the rational compromise.
  She also notes Jonas''s move from "A" to "happily accept C" in a single step looks
  less like a principled retreat and more like anchoring.


