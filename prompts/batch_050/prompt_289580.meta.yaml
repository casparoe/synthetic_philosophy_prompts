  maximin again, so he hasn''t identified a third option — he''s re-described his
  own. She also mentioned this is apparently a famous fight in political philosophy,
  Rawls versus someone, about how to design society from behind a "veil of ignorance,"
  but neither of them could reconstruct the details.


