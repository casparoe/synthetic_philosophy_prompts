  tastes worse), while Sanborn insists the coffee tastes exactly the same as always
  and what''s changed is him — his standards, his palate, whatever. Both sound perfectly
  confident, and Dennett''s move is to argue that there''s no way, even in principle,
  for either of them to settle which one is right about his own inner life, and that
  this is supposed to break the philosophers'' notion of a quale (private, intrinsic,
  ineffable, immediately known).


