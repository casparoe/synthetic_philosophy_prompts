  Actual Platonia dilemma (Hofstadter, 1983): 20 people. Each sends a telegram saying
  "cooperate" or "defect." If all 20 defect, each receives a small amount. If one
  person cooperates and the rest defect, the cooperator gets a large prize and the
  defectors get nothing. If more than one cooperates, everyone gets nothing. So it''s
  like a lottery where cooperating is "buying a ticket" but with the twist that cooperation
  only pays if you''re the unique cooperator. The superrational strategy: everyone
  should use the same randomized strategy with a small probability p of cooperating
  (e.g., roll dice to cooperate with probability 1/20). Hofstadter argued that the
  rational thing is to cooperate with probability 1/20 via a shared randomization
  scheme — since everyone reasons alike, everyone will pick the same p, and p=1/20
  maximizes expected value. This connects to the Luring Lottery, a real contest in
  Scientific American (June 1983, Metamagical Themas column): readers could submit
  entries; prize was $1,000,000/N where N is the number of entries; you could submit
  multiple entries (one postcard per entry? actually entries via postcard, unlimited).
  The twist: ideal superrational outcome would be one person submitting one entry
  and getting a million. Instead, many people submitted astronomically large numbers
  of entries (some submitting like a googol entries using mathematical notation),
  so the prize became worthless. Hofstadter was dismayed.


