  Let me do Quining qualia with the thought experiment type. The Chase and Sanborn
  example from Dennett''s "Quining Qualia": two coffee tasters who both say the coffee
  tastes worse now than when they started, but Chase says the taste changed while
  Sanborn says his taste buds/reactions changed — the coffee tastes the same but his
  aesthetic response changed. Dennett uses this to argue qualia as intrinsic, ineffable
  properties are ill-defined because first-person authority can''t distinguish reactivity
  change from quale change.


  A good spec: build a novel case (not coffee tasters, not inverting spectrums) where
  a subject is unable to determine whether their qualia changed or their reactive
  attitudes/memory changed — engineered to specifications: (1) everyday, no neurosurgery
  or magic; (2) two incompatible self-interpretations that are empirically indistinguishable
  from the inside; (3) a third-party test that still fails to settle it; (4) show
  where the case does the work against the qualia realist and how the qualia realist
  would respond (e.g., insisting there''s a fact of the matter even if unknowable
  — then the question becomes whether the case shows incoherence or merely unknowability).
  Also ask what a defender of qualia would say to block the case.


  Specifications to make it non-trivial: the case must not just be Chase/Sanborn redressed;
  must involve no deception by an experimenter (Dennett''s cases often involve skeptical
  scenarios); must be one paragraph scenario; must show that adding perfect memory
