  The disagreement type works well with loss aversion/endowment effect — bias vs legitimate
  preference. Two people argue: one says endowment effect is a bias (arbitrary ownership
  shouldn''t change value), other says loss aversion reflects legitimate preference
  (goods become part of your plans, asymmetric costs are real). Rounds: he cites mug
  experiments; she says those show trading frictions; he says reference-dependence
  is incoherent; she says reference points are part of wellbeing... Good.


  Or illusionism: two friends argue whether Frankish-style illusionism is denying
