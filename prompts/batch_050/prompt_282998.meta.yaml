  Loss aversion one is nice because there''s genuine debate. Let me craft the back-and-forth
  with numbered moves or rounds, asker as bystander, neutral.


  Inject a niche idea: e.g., one side appeals to the idea that possession becomes
  integrated into one''s plans/identity, or the "mere ownership" studies; or the debate
  about whether loss aversion is an artifact (Gal & Rucker argue loss aversion is
  overstated — "loss aversion is a fallacy" claims). But don''t rely on niche citations
