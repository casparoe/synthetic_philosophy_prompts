  mug experiments fine).


  Let me write ~5 moves:


  1. Alex: endowment effect is a bias — swapping mugs and pens randomly shouldn''t
  change what things are worth to you; willingness to accept vs willingness to pay
  gap shows people overvalue what they have.

  2. Sam: the gap can be rational — goods differ in how much they fit your plans;
  giving up something you''ve incorporated into your life costs more than acquiring
  a new one; plus transaction costs/uncertainty about the other good.

  3. Alex: but the effect shows up instantly, with randomly assigned goods, no time
  for integration — mere ownership changes valuation, which looks like pure attachment
