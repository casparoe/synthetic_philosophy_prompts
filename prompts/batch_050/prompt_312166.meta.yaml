reasoning_summary: "We need to write a prompt. Type: request comments on an essay,\
  \ or teaching plan, or episode analysis. Perspective: non-academic person who has\
  \ been thinking on their own. Formal/polished. Need to inject niche/novel ideas.\n\
  \nGood fit: \"Request comments on an essay\" — the asker writes their own essay\
  \ with an original (somewhat idiosyncratic) argument, asks for comments. Domain:\
  \ meaning of work and automation, or corruption/gift-giving. Non-academic perspective\
  \ fits naturally — someone without academic background writing their own essay and\
  \ asking for comments.\n\nLet me pick \"What counts as corruption? Clientelism,\
  \ gift-giving, universal standards\" or \"meaning of work and automation.\" A person\
  \ without academic background thinking on their own — e.g., someone who works, has\
  \ watched gift-giving norms in their family business, wrote an essay arguing that\
  \ Western anti-corruption standards miss something. Inject a novel idea: e.g., the\
  \ essay invents a concept like \"the gratitude debt ledger\" or distinguishes \"\
  lubrication gifts\" vs \"anchoring gifts.\"\n\nThe essay should have a novel framework\
  \ so models can't regurgitate. Ask for comments: accuracy of the framework, where\
  \ the argument overreaches, objections, how to strengthen.\n\nLet me draft: The\
  \ asker runs/watched a family import business or grew up in a country where gift-giving\
  \ greases transactions; wrote an essay arguing that anti-corruption thinking conflates\
  \ three distinct things. The essay proposes a distinction: gifts that buy outcomes\
  \ (\"purchasing gifts\") vs. gifts that sustain ongoing relationships (\"maintenance\
  \ gifts\") vs. gifts that express obligations already incurred (\"acknowledgment\
  \ gifts\") — and argues only the first is corrupt, while Western compliance regimes\
  \ treat all three identically, which destroys useful social machinery. Also a novel\
  \ idea: \"corruption is when the gift changes what the official does; hospitality\
  \ is when it only changes how it feels\" — but then the essay complicates this via\
  \ repeated small gifts shifting baselines (\"baseline drift\").\n\nAsk for comments\
  \ on: whether the three-way distinction actually carves reality or is self-serving;\
  \ whether \"baseline drift\" undermines the essay's own defense of maintenance gifts;\
  \ where the argument relies on intuition vs evidence; what the strongest version\
  \ of the opposing view (all gift economies in officialdom decay into clientelism)\
  \ would say; structural suggestions.\n\nKeep the essay embedded as summary/notes\
  \ rather than full text? The type allows \"notes or the idea for an essay.\" But\
  \ a full essay makes it long. Perhaps give the essay as a condensed summary with\
  \ the core arguments — manageable. Actually a moderately detailed summary of the\
  \ essay's argument (say 300-400 words) then the request.\n\nNo quotes needed, no\
  \ citations. No web search needed.\n\nWrite formally, first person, no academic\
  \ background. Ensure prompt is meaningful without web access: all needed content\
  \ in prompt.\n\nDraft:\n\n---\n\nI never studied philosophy or political science\
  \ — I left school at sixteen and have spent twenty years working in my family's\
  \ freight and customs brokerage business, which operates in two countries with very\
  \ different norms around gifts. Over the past few years I've been turning a thought\
  \ over, and I've finally written it up as a short essay. I'd like comments before\
  \ I show it to anyone else.\n\nHere is the essay's argument in compressed form:\n\
  \n1. Western anti-corruption rules (and the compliance manuals my firm now has to\
  \ sign) treat every gift to an official as the same kind of act. I think this flattens\
  \ three genuinely different things, which I call:\n - Purchasing gifts: given to\
  \ change a decision that has not yet been made. A carton left at the port the week\
  \ before a license ruling.\n - Maintenance gifts: given within an ongoing relationship,\
  \ on a schedule set by the calendar rather than by decisions (New Year envelopes,\
  \ a wedding contribution). They don't buy a specific outcome; they keep a channel\
  \ open.\n - Acknowledgment gifts: given after a favor, in discharge of a felt debt.\n\
  \n2. Only purchasing gifts are corrupt, because only they interfere with the official's\
  \ reasons. Maintenance and acknowledgment gifts are the local machinery of trust\
  \ in places where contracts and courts don't reach; abolishing them doesn't produce\
  \ impartial administration, it produces administration that only the already-connected\
  \ can use.\n\n3. The strongest objection I can see, and I devote a section to it,\
  \ is what I call baseline drift: a stream of maintenance gifts doesn't buy any single\
  \ decision, but it slowly moves what the official regards as the normal level of\
  \ consideration, so that the honest trader who gives nothing starts to look insulting,\
  \ then suspicious, then someone whose paperwork deserves scrutiny. I argue baseline\
  \ drift is real but manageable through norms (public schedules, capped values, reciprocity\
  \ duties on the official's side), and that the historical societies I know managed\
  \ it for centuries.\n\n4. I close by claiming that the Western standard is not universal\
  \ morality but the moralization of one region's solution to a problem other regions\
  \ solved differently — and that export­ing it via compliance regimes is itself a\
  \ form of clientelism, since it channels business toward firms rich enough to afford\
  \ compliance departments.\n\nWhat I want comments on, in order of priority:\n\n\
  (a) The three-way distinction. Does it carve anything real, or is it a self-serving\
  \ taxonomy built by a man who gives maintenance gifts? In particular: is my claim\
  \ that maintenance gifts don't change decisions actually defensible, given my own\
  \ section on baseline drift — doesn't baseline drift just show that maintenance\
  \ gifts are purchasing gifts paid in installments? If the distinction survives,\
  \ what should I add to defend it; if it doesn't, is there a better cut nearby?\n\
  \n(b) Whether I've been fair to the opposing position. I suspect the strongest case\
  \ against me is not \"all gifts are bribes\" but something like: gift-mediated administration\
  \ is stable only while it stays small and personal, and collapses into pure clientelism\
  \ at scale. If that's the real argument, my section 3 answers a weaker opponent.\
  \ Tell me if I've set up a straw man and what the steelman looks like.\n\n(c) Accuracy\
  \ of my empirical confidence. I generalize freely from \"the historical societies\
  \ I know,\" which really means two countries and my grandfather's stories. Point\
  \ out every place where the essay's rhetoric runs ahead of what someone in my position\
  \ could honestly claim to know.\n\n(d) The closing move (section 4), which I suspect\
  \ is the weakest: it feels rhetorically satisfying but possibly just a tu quoque.\
  \ Say whether it stands, and if not, whether the essay is better off ending at section\
  \ 3.\n\n(e) Anything structurally confusing.\n\nPlease be direct. I'd rather hear\
  \ the distinction is indefensible than publish it and be told so later.\n\n---\n\
  \nThat's good. Check: no quotes from real texts, no citations, niche injected ideas\
  \ (three gift types, baseline drift). Non-academic perspective, formal. Good length.\
  \ Ensure no opening preamble."
