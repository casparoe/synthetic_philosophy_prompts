  ---


  I write the philosophy column for a photography magazine and want to build a "do
  you see through pictures?" quiz that sorts readers by their verdicts on cases rather
  than by which label appeals to them. Ten to twelve questions, each a concrete scenario
  with two or three answer options; no question may mention a theory or ask readers
  which sense of "see" they prefer. The scenarios must include at least: a guard watching
  a live CCTV feed versus the same guard reviewing last night''s recording; a blurred
  but authentic photograph versus a photorealistic painting made from a verbal description
  alone; a telescope view of a star that has since gone supernova; and a synthetic
  image visually indistinguishable from a photograph of a real place. Use mirrors
  and ordinary eyesight as calibration items.


  Then a scoring key mapping answer patterns onto at least these positions (named
  only in the key, never in the quiz): the transparency view, on which we literally
  see the photographed subject as we see things through telescopes; the representationalist
  view, on which we see only the picture and infer the subject; the seeing-in view,
  on which pictorial experience is a distinctive twofold state that is neither ordinary
  seeing nor inference; and a deflationary view on which the dispute is verbal. The
  key must discriminate rather than lump: someone who counts live video but not recordings
  as seeing the subject, or who counts recordings of still-existing but not perished
  subjects, must land somewhere distinct from both full transparency and full representationalism.


  Finally, build the key from the answer space rather than from the position list:
  enumerate the combinations of answers the quiz allows, locate the positions in that
  space, and for any combination matching no recognizable position, say briefly whether
  it looks incoherent, merely unheld, or actually available. Flag any pair of positions
  your quiz cannot separate and specify what further case would separate them.


