  Let me draft the argument:


  Context: student in an ethics seminar discussing hypocrisy. Their study group built
  an argument:


  (1) You lack standing to blame someone for a fault if you are guilty of that same
  fault (hypocrisy undermines standing).

  (2) What matters for whether two faults are "the same" can''t depend on arbitrary
  details like the day or the victim — it''s the morally relevant kind.

  (3) Morally relevant kinds are individuated by the wrong-making features: e.g.,
  betraying a friend''s confidence is the same kind of wrong whether the secret is
  big or small, since the wrongness comes from the betrayal.

  (4) Pretty much everyone has at some point culpably violated a trust, lied, been
  disloyal, acted selfishly etc.

  (5) So for nearly any wrong anyone commits, any blamer has committed a wrong of
  the same morally relevant kind.

  (6) So almost nobody ever has standing to blame anyone for anything.


  The flaw: premise 3 — individuating fault-kinds by wrong-making features — combined
  with premise 2 leads to kinds individuated too coarsely, and there''s a slide between
  "same kind of wrong" in the sense relevant to the hypocrisy condition vs. coarse
  moral categories. Or the real issue is that the hypocrisy condition is about differential
  responsiveness to one''s own vs others'' faults (commitment/attitude), not about
  guilt per se (Todd, Wallace: standing comes from commitments, not moral record).
  The argument also has a scope issue: "guilty of the same fault" — the condition
  should be about being unresponsive to one''s own similar wrongdoing while blaming
  others.


  Should be genuinely hard; don''t signal the answer. The asker can say they''d rather
  keep (1) than (6).


