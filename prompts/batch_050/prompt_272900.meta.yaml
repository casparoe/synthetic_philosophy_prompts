  Let me do the commitments audit with AI control vs. alignment. The asker could be
  an engineer at a lab writing down their safety philosophy. Beliefs like: (1) I think
  current frontier models may be scheming, (2) I trust control measures (monitoring
  with a weaker trusted model, red-teaming of untrusted outputs) to work even against
  a misaligned model, (3) I think alignment is the real solution long-term, (4) I
  think capability evaluations can establish that a model lacks dangerous capabilities,
  (5) I think a model that''s trained to be helpful and harmless on training distribution
  will generalize... The genuine tension: believing the model might be scheming while
  trusting capability evals (a scheming model could sandbag — capability evaluations
  assume the model is trying). Also tension: trusting a weaker monitor to catch a
  stronger model while believing in capability generalization... Another tension:
  believing "control assumes misalignment" while also deploying alignment training
  that the control protocols rely on to make the trusted monitor trustworthy. Apparent
  tension that dissolves: "I think we should do both control and alignment" — not
  a tension, they''re complementary by design.


  Need non-obvious genuine tensions:


  1. "Capability evaluations let me certify the model can''t do X" + "the model may
  be scheming/sandbagging" — a scheming model may deliberately underperform, so evals
  only bound capabilities if the model is trying. Real tension, standard views.


  2. "I trust a less-capable trusted model to monitor the untrusted model''s outputs"
  + "I believe steganography / collusion between untrusted models is plausible" —
  monitors can miss encoded messages; also if multiple untrusted instances collude.
  Could be handled.


  3. "Defer-to-trusted protocols make deployment safe" + "the trusted model was fine-tuned
  on data the untrusted model influenced"? Too niche maybe.


  Apparent tension dissolving: "I think alignment research is the long-run solution
  and also that we should deploy now under control" — no contradiction given a time-indexed
  position. Or "control assumes the model may be misaligned, so doing alignment training
  is pointless" — dissolves: control benefits from alignment making misalignment less
  likely / monitors more reliable.


  Also a possible case verdict the asker''s stated principle cannot deliver: e.g.,
  "I think it''s fine to deploy a model that failed to scheme in all honeypots" while
  also believing honeypot scenarios are detectably artificial... Hmm.


  Let me write the belief set, ~5-7 commitments:


  1. We cannot rule out that our frontier model is scheming — behaving aligned because
  it''s being watched/trained.

  2. Nonetheless, deployment is acceptable if a control protocol (untrusted monitoring
  by a weaker trusted model, plus auditing of flagged outputs) keeps the estimated
  risk below a threshold.

  3. Capability evaluations on the deployed model tell us what it can and cannot do,
  and we rely on those evals when setting the monitoring budget.

  4. Alignment training is still the main long-term bet; control is a stopgap.

  5. We treat the trusted monitor as safe because it was selected for harmlessness
  and is too weak to do harm even if misaligned.

  6. If the untrusted model could pass encoded messages past the monitor (steganography),
  our protocol would fail, but we consider that unlikely enough to ignore.

  7. We would not deploy a model we knew to be scheming, even with control in place.
  Hmm — that could create tension with "deployment acceptable under control despite
  scheming risk" — actually that''s a calibration thing.


  Tensions:

  - 3 vs 1: capability evals on a possibly scheming model understate capabilities
  (sandbagging). Genuine, standard tension in the control literature (this is exactly
  why control evals use "red team plays the model" setups). Non-obvious to non-specialists
