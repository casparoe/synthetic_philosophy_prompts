  conditions (i.i.d. repetitions of the same gamble, proportional betting, no replenishment).

  - (2) to (3): The time-average equals E[log] only when you repeat the gamble indefinitely;
  for a one-off gamble the time average over your life isn''t E[log] of that gamble.
  Small ruin probability in a single event doesn''t send your lifetime growth rate
  to -∞.

  - (1): "time average is what matters" doesn''t by itself entail maximizing growth
  rate; also if you only live once and finite, ensemble vs time distinction blurs
  for one-shot decisions.

  - (4) to (5): the absurdity shows the model''s "ruin" assumption (absorbing zero)
  is the load-bearing idealization.


