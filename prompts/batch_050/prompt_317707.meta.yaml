  The argument:


  (1) What happens to you over your life is one long trajectory, not an average over
  parallel copies of you; so the growth rate that matters for decisions is the time-average
  growth rate of your wealth, not the ensemble average (expected value).

  (2) For multiplicative dynamics, time-average growth is maximized by maximizing
  E[log wealth] (log of each outcome weighted by probability).

  (3) Any gamble that includes a nonzero probability of losing everything you have
  gives E[log wealth] = -∞, since log(0) = -∞.

  (4) So no gamble carrying any nonzero risk of ruin can ever be rational, regardless
