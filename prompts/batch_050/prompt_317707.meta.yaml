  sitting still carries risks too, so it''s self-defeating).


  Conclusion proves too much. Where does it go wrong? Multiple candidate flaws:

  - (3): log(0) = -∞ only if ruin means literal zero wealth; but "losing everything"
  in life isn''t an absorbing state — you can earn again; the model treats wealth
