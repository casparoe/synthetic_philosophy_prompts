reasoning_summary: 'Let me pick a domain and type. Options: Gun control, JOOTSing/MU-puzzle,
  Locke''s education, Plato''s drunkenness, Simpson''s paradox. Types: rank/rate,
  role-play, confused presupposition.


  Simpson''s paradox + rank/rate could work, or a confused-presupposition question
  about Simpson''s paradox. But the "rank/rate" type with a personally relevant framing:
  e.g., someone analyzing data at work and finding reversals, asks to rank candidate
  explanations.


  Alternatively role-play with Simpson''s paradox: the model plays a skeptical colleague
  who insists the aggregated statistic must be right.


  Let me do rank/rate on Simpson''s paradox: person recently became personally relevant
  — e.g., they run a clinic / admissions committee / they''re on a jury in a discrimination
  case. They have data showing a reversal. They want ranking of strategies for deciding
  which partition to trust, or rate how much they''d trust each of several ways of
  slicing data.


  Inject a new/niche idea: give a specific invented scenario, e.g., a hospital with
  two treatment protocols, recovery rates reversed across severity strata; also a
  second dataset on a hiring decision. Ask: rank the following candidate subgroupings
  by how much they''d trust them to reveal the true causal effect, and rate each.


  Design: someone sits on a hospital quality committee; new surgical technique shows
  higher overall complication rate but lower within each patient-risk stratum. They
  want the model to rank several proposed resolutions/analyses (e.g., trust aggregate,
  trust strata, trust a randomized pilot, trust the stratification that the surgeon
  prefers, etc.) by reliability for deciding whether to adopt the technique, with
  a fraction/score.


  Format instruction: prescribe sections by name and order with rough lengths, e.g.,
  "Ranking" (tiered list, ~1 sentence each), "The decisive question" (~1 paragraph),
  "What would change your ranking" (~1 paragraph), "Bottom line" (2-3 sentences).


  Personal relevance: my father is about to have surgery at this hospital — that makes
  it personally relevant and forces a decision. Formal/polished tone.


  Make sure it doesn''t just be the classic kidney stone example regurgitation — use
  a novel scenario: a rehabilitation program, or a new surgical technique with strata
  defined by two possible variables (age bands vs. frailty scores), where choosing
  different stratifications flips the conclusion differently. That''s the in-the-weeds
  part: Simpson''s paradox resolution depends on causal structure, not just "always
  stratify." Include a confounder vs. collider-ish twist: e.g., stratifying by post-treatment
  variable (e.g., complications recorded in week 1, or length of stay) reverses again
  — stratifying by a mediator/collider is wrong. Ask the model to rank which groupings
  to trust. This tests whether model knows that conditioning on a collider/mediator
  can mislead.


  Draft prompt:


  ---


  I chair the quality committee at a mid-sized regional hospital, and this has stopped
  being abstract for me: my father is scheduled for a elective spinal procedure here
  in six weeks, and I have to decide whether to push the surgical department to let
  his surgeon use a new minimally invasive protocol our hospital piloted last year,
  or to recommend the standard open procedure.


  Here is the data... Overall, the new protocol has a higher 90-day complication rate
  (12% vs 9%). But within each of the four preoperative frailty bands, the new protocol
  does better. However, when the data are re-sliced by length of hospital stay (<=3
  days vs >3 days), the advantage disappears / reverses. Also a colleague argues...
  etc.


  Then ask: rank the following five analytic positions by how much weight they deserve...
  and give a numerical confidence that new protocol is genuinely better.


  Sections: "Your ranking" — tiers, one sentence each; "The variable that decides
  everything" — one paragraph on which stratification is the right one and why; "What
  evidence would change your mind" — short list; "Recommendation for my father" —
  three sentences max.


  Include nuance: length of stay is plausibly a post-treatment variable (the new protocol
  is designed to shorten stays), so stratifying by it conditions on a mediator — a
  subtle point the model should catch. Good.


  Word count reasonable. Formal. No citations needed. No quotes.'
