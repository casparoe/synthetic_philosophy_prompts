  Argument sketch:

  (1) Every physical event has a fully physical cause (causal closure).

  (2) If consciousness caused any physical event, either closure is false or the event
  is overdetermined.

  (3) Overdetermination everywhere is absurd, so consciousness causes nothing physical.

  (4) But then natural selection couldn''t have selected for consciousness — selection
  only acts on what affects behavior.

  (5) If consciousness wasn''t selected for, it''s a fluke byproduct, and there''s
  no reason it should track anything — including being present in me rather than a
  zombie version of me.

  (6) But I know directly that I''m conscious.

  (7) So something''s wrong... and a theory of mind that can''t explain why I know
  I''m conscious (since my saying "I''m conscious" is a physical event not caused
  by consciousness) proves too much — I couldn''t even reliably report my own consciousness.


  That''s a real, hard argument (the paradox of phenomenal judgment). The conclusion
  "proves too much": it implies my belief that I''m conscious isn''t caused by my
  consciousness, so I''d say "I''m conscious" even if I weren''t — so my introspective
  knowledge is undermined. Where does it go wrong? Good question, genuinely contested.


