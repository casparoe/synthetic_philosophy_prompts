  griefbots, care ethics, reliability of introspection.


  Type: I can pick whichever type combines best. The "Design a classroom activity"
  type seems good. Perspective: longtime reader of rationalist blogs/forums. Formal/polished.
  Include prompt-engineering-type text (role assignment, think carefully, brainstorm
  first).


  Let me pick "reliability of introspection" — rationalist readers care about introspection,
  calibration, etc. Or "negative utilitarianism" — also very rationalist-adjacent.
  Or griefbots — rationalist-adjacent too (digital minds, uploads).


  A classroom activity that makes participants feel the force of an idea about reliability
  of introspection... could design an activity where participants'' introspective
  reports are shown to be confabulated (choice blindness style). But choice blindness
  requires sleight of hand — hard in classroom. Could do a "confabulation lab": participants
  make choices, reasons elicited, then revealed manipulated. Or an activity on affective
  forecasting: predict how you''ll feel, then experience. Or the classic: split-brain
  style, or "introspecting on why" — e.g., participants rank stockings (Nisbett &
  Wilson) — position effects. A staged activity: students judge which of several identical
  items is best, then explain why, then the facilitator reveals position bias. That
  makes them feel confabulation.


  The rationalist reader persona: mention things like LessWrong-style concepts — "noticing,"
  calibration, "the inside view." Shouldn''t be too heavy-handed.


  Design: I run a monthly rationality meetup / reading group, ~12-14 people, 90 minutes.
  Design an activity that makes them feel that introspective access to the causes
  of one''s own judgments is unreliable — that we confabulate fluent, confident explanations.
  Include: staged choice tasks with hidden manipulation, structured rounds, prediction/logging
  beforehand, debrief mapping to Nisbett & Wilson-style findings, what goes wrong,
  and what the activity can''t reproduce.


  I should inject some niche/new idea into the prompt — per the general instruction,
  prompts often need to inject a niche idea so models can''t regurgitate. Maybe I
  specify a novel twist: e.g., I want the activity to include a "prediction market"
  on their own introspective accuracy, or include a round where participants try to
