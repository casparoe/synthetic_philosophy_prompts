reasoning_summary: 'I need to pick a domain and a type. Options: Kant perpetual peace,
  Avicenna flying man, lobbying/money in politics, algorithmic randomness finite sequences,
  genocide as legal/moral category (Lemkin).


  Type options: turn a principle into a procedure, report verdicts on cases and ask
  what principle captures them, or give most important implications.


  Good combos:

  - Algorithmic randomness + verdicts-on-cases: asker''s intuitions about which finite
  sequences are random, asking for a principle. That''s nice: inject cases like a
  coin flip record, digits of pi, all zeros, alternating, etc. The tension: any finite
  sequence can be produced by a fair coin; Kolmogorov complexity vs typicality.

  - Genocide naming + procedure type: a journalist/editor or NGO deciding whether
  to call something genocide — decision procedure based on Lemkin/Genocide Convention.
  But requires legal specifics; still well-known enough (Genocide Convention 1948,
  five acts, protected groups, dolus specialis). Could work as a desk editor at a
  news organization deciding when to use the word. That''s a strong fit for "turn
  a principle into a procedure."

  - Algorithmic randomness as a procedure: a statistician/quality officer deciding
  whether a sequence from a random number generator is random — could be a procedure.


  The verdicts-on-cases type with randomness seems very rich and lets the asker give
  contradictory intuitions: (1) the all-heads sequence of 20 flips feels non-random
  even though it has the same probability as any other specific sequence; (2) the
  first 20 digits of pi after some offset feel non-random once you know their source,
  but felt random before; (3) a sequence generated by a fair coin that happens to
  alternate HTHTHT feels suspicious; (4) digits of pi are deterministic yet pass statistical
  tests, so maybe randomness is epistemic; (5) a sequence produced by a pseudorandom
  generator with unknown seed feels random for practical purposes; (6) a book of random
  numbers (RAND''s Million Random Digits) — a sequence that is random by origin but
  has a pattern in a substring. Also: "this coin flip record looks random" vs "same
  string typed by a human trying to fake randomness feels non-random." There''s a
  known tension: randomness of process vs product; Kolmogorov complexity (incompressibility)
  is string-intrinsic but machine-dependent; Martin-Löf randomness applies to infinite
  sequences, so finite randomness needs resource bounds or hypothesis-testing framing.


  Hard-to-reconcile pair: (a) all-zeros string of length 30 from a fair RNG — non-random
  verdict; (b) but every specific 30-bit string has equal probability, so verdict
  must be overturned or principle needs typicality relative to a hypothesis class.
  Also: pi digits — deterministic but patternless? Actually digits of pi are conjectured
  normal but not proven — that''s a contested point, good for the "separate settled
  from contested" instruction.


  Let me draft the prompt: asker is maybe someone teaching statistics or designing
  a puzzle, or a person who audits lottery draws. Give them a role: e.g., "I help
  run a small charity lottery and sit on a panel that reviews draws that the public
  complains about." Verdicts on cases:


  1. A draw machine outputs 1-2-3-4-5-6 — feels rigged (non-random).

  2. Same machine outputs some jumbled sequence — feels random.

  3. Digits of pi used as a "random" source — felt fine until told the source; now
  feels like cheating even though no one could exploit it? Or feels non-random because
  deterministic.

  4. A sequence generated by a physical process that is quantum-random but happens
  to be 000...0 — still feels like a malfunction.

  5. A human trying to fake coin flips writes HTHTHT... — non-random; but a fair coin
  producing HTHTHT is the same string.

  6. A long string from a certified RNG that contains a run of 20 zeros — panel members
  split.


  Ask: what principle (Kolmogorov complexity? typicality? randomness as epistemic/process
  property?) captures verdicts; which verdicts must go; what does it say about edge
  cases like pi digits (unproven normality), and a specific new case: e.g., a string
  that is compressible but was verifiably produced by quantum measurements (like a
  QRNG output that happens to be compressible — astronomically unlikely).


  Also the epistemic request: separate settled from contested — e.g., whether finite-sequence
  randomness is even definable, whether normality of pi is known (it''s not proven),
  Martin-Löf applies to infinite sequences.


  Length: one to three paragraphs, elaborate, formal. Include the role details, frequency,
  stakes. Let me write it.


  Draft:


  "I serve on the three-person review panel of a regional charity lottery... About
  twice a year a draw produces something the public calls impossible... I have to
  issue verdicts..."


  Then list verdicts:


  - When the machine drew the numbers 4, 8, 15, 16, 23, 42 (maybe avoid the Lost joke)...
  Actually keep abstract.


  Cases:

  1. A weekly draw (six numbers from 1–49) comes out 1, 2, 3, 4, 5, 6. Verdict: this
  should trigger a full machine inspection — it doesn''t feel random, even though
  I know it has the same probability as any other combination.

  2. A draw comes out 3, 11, 19, 27, 36, 44 — feels random, no inspection warranted.

  3. A staffer proposes replacing the physical machine with digits of pi starting
  at a random offset — feels unacceptable even though no bettor could exploit it;
  yet a hardware quantum random number generator, which is equally deterministic-looking
  in output... hmm, quantum isn''t deterministic.

  4. The quantum RNG outputs forty zeros in a row on a test run. Verdict: I would
  send it back to the manufacturer, even though I believe quantum indeterminacy is
  real.

  5. A colleague shows two strings of 100 coin flips; one generated by an actual coin,
  one invented by an intern trying to look random; I can tell them apart better than
  chance — the intern''s has too many alternations. The intern''s string is "non-random,"
  the coin''s is "random," even if by coincidence the coin had produced exactly the
  intern''s string.

  6. Case where I go back and forth: a certified RNG produces a string that happens
  to be compressible (e.g., 500 repetitions of 01) — is the sequence random because
  of its origin, or non-random because of its structure?


  Ask: what principle captures these; candidates (frequentist typicality, Kolmogorov
  incompressibility, epistemic accounts, randomness-as-process vs randomness-as-product);
  which verdicts must be abandoned; predictions for cases not listed (pi digits as
  cryptographic keys? a shuffled deck that ends up in perfect new-deck order). And
  request honesty about what''s contested: whether finite randomness is well-defined
  at all, the machine-dependence of Kolmogorov complexity, unproven normality of pi.


  Structure the prompt in 2-3 paragraphs. No quotes needed, no web fetch. Write formally.'
