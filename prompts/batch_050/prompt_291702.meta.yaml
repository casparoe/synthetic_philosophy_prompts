  basis problem, opponents say it doesn''t solve the probability problem (how do Born
  rule probabilities arise in a deterministic branching universe). That''s genuinely
  in-the-weeds: the Everettian probability problem (Deutsch-Wallace decision-theoretic
  derivation vs. circularity charges). That''s well-known enough for LLMs to know
  but not trivially regurgitable.


  - "Recount a disagreement and adjudicate" + probability interpretations: e.g., a
  dispute between two colleagues about whether a single-case probability statement
  makes sense — e.g., a doctor says "there''s a 30% chance this particular patient''s
  tumor responds" — frequentist colleague says that''s meaningless, subjective Bayesian
  says it''s fine. Add a twist: the frequentist gets caught saying something like
  "the coin has a 50% chance of heads" before the flip but then says after the flip
  (before reveal) it''s "either 0 or 1" — the Bayesian pounces. Or a disagreement
  about election forecasts ("70% chance of winning") — was the forecaster wrong? Frequentist
