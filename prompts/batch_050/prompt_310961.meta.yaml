  I teach a seminar on aggregation in normative ethics, and two of my strongest students
  have deadlocked all semester over the question of whether very small harms, spread
  across very many people, can ever sum to something worse than a single severe harm.
  One defends straightforward aggregation: badness is additive, so a sufficiently
  vast number of momentary, barely noticed irritations can outweigh one person''s
  year of agony. The other defends lexical priority: there is a threshold of severity
  such that no quantity of trivial harms, however large, is morally worse than one
  harm above the threshold; the dust specks are not merely outweighed, they are not
  even in the running. I have asked them to produce a joint statement, adversarial-collaboration
  style, and I would like you to draft the document they should come back with, roughly
  900 words.


  The statement must do four things. First, set out the claims both sides can sign
  without reservation. These will be thin, and finding non-vacuous ones is part of
  the work: I expect candidates such as both agreeing that aggregation is permissible
  within a single life, that some policy comparisons genuinely trade small harms to
  many against severe harms to few, and that the intuitive verdicts about extreme
  cases are in tension with at least one principle each side otherwise accepts. Second,
  state the surviving disagreements in wording each side would accept as a fair description
  of its own position, without either side''s preferred loaded vocabulary. Third,
  identify the cruxes: the sub-questions such that resolving them would move at least
  one party. I suspect the list includes whether badness is cardinally measurable
  and continuous across the trivial-to-severe range; whether a harm so mild it is
  never consciously registered is a harm at all; and whether the within-life case
  differs in principle from the across-persons case — but your drafters should confirm
  or correct my suspicions. Fourth, for each crux, describe a concrete case, argument,
  or thought experiment both sides agree bears on it, and record in advance what each
  side predicts or must say about it.


  To keep the statement honest, require it to engage three specified cases. Case one:
  fix the dust speck precisely — a faint, half-second itch behind the eye, noticed
  but instantly forgotten, no after-effects — so that neither side quietly substitutes
  something worse or something nothing-like. Case two: a public-health agency must
  choose between a program that spares one identified person ten years of severe chronic
  pain and a program that spares three hundred million people one unpleasant minute
  each, once; state what each camp concludes and whether either camp''s verdict embarrasses
  it. Case three, the one I devised to break the deadlock: a single person will suffer
  the same trivial itch a billion separate times spread across a long life, versus
  another person suffering one week of severe pain; if the anti-aggregationist aggregates
  within a life here, they must explain why numbers of persons changes the principle,
  and if they do not aggregate even here, they must own that verdict explicitly. Where
  a dispute turns out to be verbal — about what ''harm'', ''worse than'', or ''matters''
