  I am a senior in high school and I co-run our school''s philosophy club, which meets
  weekly and currently has about fifteen members, most of whom have no background
  in decision theory. Last month we argued about Newcomb''s problem for two meetings
  running, and I noticed something that I would like to turn into an activity: several
  members called themselves "one-boxers" after the first session, but changed their
  verdicts when I described the version with transparent boxes, and one member one-boxed
  against the predictor yet saw no problem with taking the cigarette in the smoking-lesion
  case. My conclusion is that most of us do not know which position we actually hold,
  and I want to build a short diagnostic quiz for the club that finds out.


  Please design a "which decision theory do your answers commit you to?" quiz for
  us, subject to the following constraints.


  Format and audience. Eight questions. Each question should be a concrete case a
  member can answer without any vocabulary beyond ordinary English -- no mention of
  "evidential," "causal," or any theory''s name anywhere in the questions themselves.
  Each question offers two or three answer options. Assume the members are bright
  but impatient; stipulate every detail that could change a verdict (the predictor''s
  track record and how it is known, what the agent knows about the mechanism, whether
  the boxes are transparent), because in our club argument those details are exactly
  what made people switch.


  Cases that must appear, in some form. (1) The original Newcomb setup with an extremely
  accurate predictor and an opaque box. (2) A version with both boxes transparent.
  (3) A smoking-lesion-style case, where an action is correlated with a bad outcome
  without causing it and there is no predictor. (4) The desert-driver case, where
  a rescuer saves you only because he correctly predicted you would pay him afterward.
  (5) The perfect-copy dilemma, where you and an exact replica of you each choose
  whether to cooperate, in isolation. (6) The coin-flip extortion case, where a reliable
  being rewards you in the actual world only because it predicts you would have paid
  up in the counterfactual one. You may add up to two further cases of your own devising
  if they do diagnostic work the six do not.


  Deliverables. (a) The eight questions with options. (b) A scoring key that maps
  answer patterns onto positions. The leaves must include at least: the causalist
  who two-boxes; the evidentialist who one-boxes on grounds of evidence; and the position
  that one-boxes, pays the desert driver, cooperates with the copy, and pays in the
  coin-flip case on grounds of logical or subjunctive dependence. (c) Since eight
  questions with two or three options each generate far more answer patterns than
  there are named positions, include a table of the unoccupied patterns and diagnose
  each: is that combination incoherent, merely unstable, or simply unexplored? I am
  especially curious about the member who two-boxes Newcomb but pays in the coin-flip
