  I''m designing a classroom instrument for an upper-level undergraduate seminar in
  moral philosophy, and I''d like you to build it: a "do you actually believe in standing
  to blame?" sorting quiz. The seminar''s real question is whether the notion of standing
  — the idea that a person can be unentitled to blame someone even for a genuine wrong
  — picks out anything our case judgments support, or whether it collapses under pressure.
  So the quiz should sort respondents by their verdicts on cases, not by which label
  they like.


  Requirements:


  Ten questions, each a short concrete vignette (two to four sentences) followed by
  two or three answer options. No question may mention standing, hypocrisy-as-a-term-of-art,
  or any position by name; each option should be the verdict plus a one-sentence rationale
  in plain language, so respondents choose the reasoning they endorse.


  Across the ten vignettes, include at least: (i) one case of straightforward hypocrisy
  (the blamer currently does the same thing); (ii) one case of a reformed wrongdoer
  condemning the very wrong they used to commit; (iii) one case where the blamer helped
  cause or encouraged the wrong (complicity without hypocrisy); (iv) one case where
  the wrong is arguably none of the blamer''s business; (v) one case where the blamer
  condemns the same conduct far more harshly in one target than in another; and (vi)
  one case designed to pull apart two hypotheses about why hypocrisy undermines standing:
  that the hypocrite fails to apply their own professed standard to themselves, versus
  that the hypocrite claims a superior moral status over an equal.


