  view (no one ever lacks entitlement to blame; "who are you to talk?" is always a
  fallacy); the self-application or commitment account of hypocrisy; the equality-of-status
  account of hypocrisy; a complicity-based restriction on standing; a meddling-based
  restriction; and a reform-sensitive view on which past-but-repudiated wrongdoing
  never costs standing. The key should also report a summary dimension the literature
  doesn''t usually package: how many independent standing-restricting conditions the
  respondent''s pattern commits them to, since the seminar''s question is whether
  the concept survives at all.


