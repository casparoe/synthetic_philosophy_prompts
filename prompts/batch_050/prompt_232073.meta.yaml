reasoning_summary: 'Let me pick a domain and type. "Loss aversion and the endowment
  effect: bias or legitimate preference?" combined with "Present someone''s summary
  of a view or result and ask whether it is fair" would work well for a science journalist.
  Write a plausible summary of Kahneman/Tversky loss aversion from a pop book or podcast,
  with subtle misrepresentations: e.g., claiming endowment effect = irrationality
  proven, conflating loss aversion with status quo bias or the disposition effect,
  conflating "losses loom twice as large" with a precise universal constant, presenting
  the rationality debate as settled, claiming Mug experiments prove irrationality.
  Also "one thought too many" could work but loss aversion is better for a science
  journalist.


  Include: the summary itself, journalist context, casual tone, maybe a typo. The
  summary should be mostly right with 1-2 subtle misrepresentations. E.g.:


  Summary (from a podcast host or a friend''s notes): "Economists used to think preferences
  were stable, but Kahneman and Tversky showed people are loss averse: losses hurt
  about twice as much as equivalent gains feel good. The famous mug experiments showed
  that people demand about twice as much to sell a mug they were just given as they''d
  pay to buy it, proving the endowment effect is a cognitive bias. But critics like...
  this shows preferences are constructed rather than real, which undermines welfare
  economics. However loss aversion is just a bias like any other and debiasing should
  make people indifferent between keeping and trading."


  Subtle misrepresentations:

  1. The mug experiments show an exchange asymmetry; calling it proof of "bias" assumes
  reference independence is normative — the question of whether loss aversion is a
  bias vs. legitimate preference is exactly the open debate. Also, later work (Plott
  & Zeiler) showed the effect may disappear with procedures; also Gal''s critique
  that loss aversion isn''t well-defined without a reference point.

  2. Conflating loss aversion with the endowment effect (endowment effect is one proposed
  manifestation; alternative explanations: ownership, attachment, bargaining norms).

  3. "Twice as much" as a universal constant — lambda ≈ 2.25 is a rough estimate,
  contested.

  4. "Preferences are constructed therefore not real" — leap.

  5. Debiasing should make people indifferent — presumes the normative question.


  Ask: which parts fair, which misrepresentations, does the conclusion (that welfare
  economics is undermined / that we should debias) follow.


  Write it casually, journalist covering science and ideas, maybe writing a piece
  on "irrationality" industry. One to three paragraphs plus the summary. No real quotes
  needed. Don''t cite specific papers by name beyond well-known names (Kahneman, Tversky
  — safe). Avoid niche specifics. Maybe mention Plott & Zeiler? That''s somewhat in
  the weeds but a model should know it... it''s fine to mention as part of the question?
  The instruction says prompts shouldn''t refer to super niche theories models haven''t
  memorized. Plott & Zeiler is reasonably known. But better keep it in the summary
  as the podcaster''s claims rather than requiring knowledge. Actually keep it simple.


  Write ~3 paragraphs. Include a typo or two.'
