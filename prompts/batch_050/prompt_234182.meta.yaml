  - Is-ought gap: analogy like "deriving ought from is is like trying to..."? People
  say "you can''t get blood from a stone," "you can''t get an ''ought'' from an ''is''
  like you can''t get a conclusion that outruns its premises — like conservation of
  mass." Actually a good analogy in common use: "deriving values from facts is like
  deriving a recipe from a list of ingredients" or Hume''s guillotine.

  - Metzinger self-model/phenomenal transparency: plenty of analogies! "Transparency"
  itself: Metzinger''s own metaphor — the self-model is like a transparent window:
  you look through it, not at it. Also "the Ego Tunnel" — consciousness is like a
  tunnel. Analogy audit: "phenomenal transparency is like looking through a window
  / VR headset you can''t remove." People use the VR headset analogy: consciousness
  is like VR; the brain renders a model and you can''t see the rendering process.
  That''s actually commonly used (Metzinger''s Being No One, Ego Tunnel; VR analogy
  popular). The audit: mapping — headset = self-model, rendering = neural processing,
  user = ...? There''s the interesting break: in VR there''s a user distinct from
  the avatar; in Metzinger there''s no user — the self IS the avatar/model, no homunculus
  behind it. Where the analogy smuggles in a subject. Great material for an in-the-weeds
  audit that doesn''t require niche facts.


  - Universal healthcare vs. market medicine: analogies like "healthcare is like firefighting,"
  "health insurance is like car insurance," "healthcare is a marketplace like restaurants."
  Common analogy: "shopping for healthcare is like shopping for a car." Audit works
