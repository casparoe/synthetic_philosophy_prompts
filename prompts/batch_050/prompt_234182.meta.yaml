  Details: Metzinger''s phenomenal self-model (PSM), transparency = the system can''t
  represent the model as a model; it looks "through" its representations. VR analogy
  mappings: headset/display = the model''s content rendered neurally; the fact you
  can''t see pixels/edges = transparency (earlier processing stages unavailable);
  avatar = phenomenal self-model; the big break: no user. Also: VR world corresponds
  to external world model; break: in VR there''s an actual external world the headset
  hides, whereas... well there is an external world too, but transparency applies
  to models generally, including self. Another disanalogy: VR is designed, can glitch
  revealing the medium (breaks transparency — e.g., dreams, out-of-body experiences,
  meditative states can de-transparentize; Metzinger actually discusses this: out-of-body
  experiences, lucid dreaming). Good: ask the model to consider cases where transparency
  fails (dreams, OBEs) — a VR analogy has glitch analogs.


