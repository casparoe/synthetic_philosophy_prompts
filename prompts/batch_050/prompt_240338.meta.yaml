  Now the exam question text. Keep it tight:


  "Question 2 (25 points). In ''Should the Numbers Count?'', John Taurek describes
  a case in which you have a supply of a drug sufficient to save five people on one
  island or one person, David, on another; the drug cannot be divided and you cannot
  reach both islands. (a) Reconstruct Taurek''s argument for the conclusion that you
  are not morally required to save the five. (b) Explain why Taurek thinks that flipping
  a coin is a fair way of deciding, and what, on his view, David is and is not in
  a position to complain about. (c) Does Taurek''s position commit him to the claim
  that the number of people at stake is never morally relevant in such choices? Briefly
  defend your answer."


  Student''s answer (~350-450 words):


  "(a) Taurek''s argument begins from the thought that losses to different people
  do not add up into a single, bigger loss. If the five die, no one undergoes a loss
  five times as great as the loss David undergoes if he dies; each of the six loses
  his life, and that is the worst thing that can happen to each of them. Because the
  death of the five is not worse for anyone than the death of David, Taurek concludes
  that the outcome in which the five die is not worse than the outcome in which David
  dies, and hence that there is no obligation to bring about the former rather than
  the latter. Fairness, Taurek argues, therefore requires me to give David an equal
  chance — to flip a coin — and anyone who simply saves the five without doing so
  treats David as counting for less than the others and thereby acts wrongly.


  (b) David is in a position to complain if I simply hand the drug to the five as
  a matter of course, since that procedure gives him no chance at all and so fails
  to respect the equal significance of his life. He is not, however, in a position
  to complain about the coin flip itself, since under that procedure he receives the
  same 50 percent chance that each of the five receives; and if the coin comes down
  against him he has been treated fairly even though the result is bad for him. Taurek
  is careful to say that things would be different if I stood in some special relation
  to David — if he were my friend or child, say — in which case I could permissibly
  save him outright.


  (c) Yes. The non-additivity of losses holds however many people are involved — a
  million deaths is still not a loss that anyone experiences as a million times worse
  than one death — so Taurek is committed to giving the one an equal chance against
  any number, and to the claim that the number of people at stake is never morally
  relevant. Parfit''s well-known reply in ''Innumerate Ethics'' accepts this framework
  but argues that fairness requires a weighted lottery: each person should receive
  an equal individual chance, so that the five collectively receive a five-sixths
  chance, and this is the most that fairness can demand."


