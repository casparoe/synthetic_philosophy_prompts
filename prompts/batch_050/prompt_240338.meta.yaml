  Common critiques: Parfit''s "Innumerate Ethics" (1978); Kavka; Kamm''s aggregation
  argument — Kamm''s "equal worth" response: fairness doesn''t require equal chances;
  saving more respects each equally because each of the five gets saved... Kamm argues
  that giving equal chances actually treats some as more valuable, and saving the
  greater number is compatible with equal respect. Scanlon''s contractualist aggregation
