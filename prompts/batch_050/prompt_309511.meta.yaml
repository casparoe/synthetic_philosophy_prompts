  Draft:


  "Below is an exercise in case-construction about corrigible AI.


  First construct the case, to these specifications:


  Design a thought experiment in which an AI system that reliably allows itself to
  be shut down produces a worse outcome than an otherwise identical system that sometimes
  resists shutdown -- but the usual easy routes to that conclusion are disallowed.
  Constraints: (1) the human operators must be competent, well-intentioned, and making
  a locally reasonable decision to press the button; the bad outcome may not come
  from operator malice, panic, or obvious error. (2) The setting must be mundane and
  near-term: a hospital scheduling system, an industrial control system, a logistics
  network -- no superintelligence, no self-replication, no exotic capabilities. (3)
  The scenario fits in one paragraph. (4) The harm must be traceable specifically
  to the system''s shutdown-compliancy, not to something the compliant system does
  before or after the shutdown event; that is, a system that merely delayed shutdown
  for an hour would have avoided the harm.


  After the scenario: (a) state precisely the structural feature of the situation
  that makes compliance costly -- I suspect it will turn out to be an asymmetry between
  what the system knows about its own current activity and what the operator can see,
  but if your case runs on a different feature, say so and defend it. (b) Show what
  happens if that feature is removed: does the case collapse back into one where compliance
  is clearly correct? (c) Give the strongest response available to the defender of
  unconditional corrigibility -- presumably some version of ''the system should communicate
  rather than resist'' -- and say whether your case survives it, modifying the case
  minimally if necessary so that it does.


  Finally, take a position: does a case like yours show that corrigibility (understood
  as reliable shutdown-compliance) is a design mistake, or only that it has to be
  defined more carefully -- and if the latter, state the more careful definition your
  case forces. Commit to an answer rather than surveying the options; if you think
  the thought experiment genre itself is doing illegitimate work here, argue that
  instead."


