  3. On Abelard''s account A must come out fully sinful and B not sinful at all, and
  the verdict has to fall out of the theory itself, not be stipulated.

  4. Realistic — no sci-fi, no hypnotists. Think fraud, betrayal, an affair, a poisoning
  that goes wrong.

  5. Make it genuinely uncomfortable: I want a reader to feel at least a pull toward
  "B did something worse" even after granting the setup.


  Then walk me through it: state what Abelard says about each character and why, which
  single feature of the case does the work, what changes to the verdicts if you strip
  that feature out, and the best attack someone hostile to Abelard could mount against
  the setup (and whether he''d have a reply).


  Keep the scenario itself to a couple paragraphs; the analysis can be longer. And
  end with a one-line verdict on whether the scene makes Abelard''s view look deep
