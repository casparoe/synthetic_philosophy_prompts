  I''m fascinated by Abelard''s old idea that the sin is entirely in the consent,
  not in the act or even the desire: you sin when you consent to what you shouldn''t,
  and it doesn''t add anything if you go on to actually do it. I want a scenario that
  pressure-tests this in the direction people find counterintuitive.


  Construct a scenario for me with these constraints:


  1. Character A fully consents to a wrongful deed — no coercion, no mistake about
  the facts, no last-minute wobble — but is prevented from acting by pure bad luck,
  so nothing harmful ever happens.

  2. Character B performs exactly the outward deed A consented to (same movements,
  same consequences, or as close as realism allows) but never consents: not coerced
  at gunpoint either — I want something subtler, like blameless ignorance or a psychological
