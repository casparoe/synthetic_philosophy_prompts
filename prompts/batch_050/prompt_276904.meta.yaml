  Design the commitments:


  (1) Explanation in science is derivation from laws plus initial conditions (Hempel);
  the historian''s craft should aspire to the same standard — narrative is at best
  an explanation sketch.

  (2) Historical events are unique and unrepeatable, so there are no laws of history.

  (3) Narratives genuinely explain — a good historical narrative makes an event intelligible
  in a way a list of causes doesn''t.

  (4) Prediction and explanation are symmetric (structural identity thesis).

  (5) Collingwood-ish: understanding an action means re-enacting the agent''s reasoning,
  which requires no appeal to laws.

  (6) Historians are justified in selecting causes by counterfactual importance ("but
  for the assassination, no war") rather than by law-coverage.


  Tensions:

  - (1)+(4) with (2): covering-law model requires laws; if history has no laws, Hempel
  himself would say historical explanation is incomplete sketch. But Hempel''s response:
  explanation sketches appeal to general laws (implicit regularities), not laws of
  history specifically — so (2) doesn''t contradict (1) as long as the covering laws
  come from psychology/sociology, not history. That''s the apparent tension that dissolves
  — nice.

  - (3) with (1): if narrative explains in a way irreducible to causal subsumption,
  and the covering-law model is the standard of explanation, tension. Is it genuine?
  Depends whether narrative explanation is genuinely distinct (Mink, Gallie, Dray)
