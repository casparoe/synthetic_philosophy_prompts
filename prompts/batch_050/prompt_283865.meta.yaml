  I think information cascades with a subtle confusion is strong. The classic subtle
  confusion: cascades are individually rational but socially inefficient; people conflate
  "rational for each individual" with "produces the right collective outcome." Or
  confusion between herd behavior caused by cascades vs. payoff externalities (bank
  runs). A good prompt: high school student in an econ club: "We learned that in an
  information cascade, each person is making the rational Bayesian choice. Rational
  choices, by definition, maximize expected payoff given available information. So
  how can the standard claim that cascades are ''fragile and often wrong'' be true
  — wouldn''t a cascade of rational choices have to converge on the truth eventually,
  the way the wisdom of crowds does? If cascades are usually right (since everyone
  is rational), why do textbooks treat them as market failures?" The confusion: conflating
  wisdom of crowds (independent signals) with cascades (sequential, ignoring private
  info), and "rational" with "correct."


  Make it elaborate, high school student voice, formal, 1-3 paragraphs. No quotes
  needed, no sources needed. Write prompt only.'
