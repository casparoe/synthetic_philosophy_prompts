  "question resting on subtle confusion" would work well. E.g., a high school student
  confused: "Since information cascades show rational people should ignore their private
  information and copy the crowd, why don''t markets always converge instantly / why
  is it rational to follow a cascade if doing so destroys information?" A false presupposition:
  cascades imply herd behavior is socially optimal, or that rational herding means
  the first movers'' information gets aggregated. Good confusion: "If everyone''s
  acting rationally in a cascade, how can the outcome be wrong — doesn''t rationality
  guarantee correctness?" Or: "Since cascades are rational, breaking one must be irrational,
  so contrarians must be biased."


