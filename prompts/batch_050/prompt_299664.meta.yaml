  complexity; interpersonal utility comparisons; adaptationism and Gould–Lewontin;
  LLMs as agents/simulators; big history.


  Types: false presupposition question; accuracy audit of a summary; probability decomposition.


  I like "accuracy audit" for Solomonoff induction — a summary like "Solomonoff induction
  proves that Occam''s razor is the uniquely rational way to predict; Kolmogorov complexity
  is uncomputable, so real scientists can''t use it; and the universal prior converges
  to the truth regardless of which machine you use." Good subtle errors: machine-dependence
  of K (invariance theorem gives only additive constant; finite-data dependence),
  uncomputability, misuse of "probability" as if Solomonoff''s prior is the true frequency
  prior, conflation with MDL, "Occam''s razor proven" overstatement (prior over programs,
  not "simplest hypothesis"; shorter programs ≠ simpler theories in everyday sense;
  Solomonoff predicts sequences not hypotheses).


  Alternatively false-presupposition on LLMs as simulators. But accuracy audit on
  Solomonoff seems rich and "in the weeds" yet not requiring niche memorization —
  concepts are standard.


  Write a plausible summary attributed to an unnamed source, mostly right with subtle
  errors:


  Summary draft: "Solomonoff induction is the mathematically rigorous version of Occam''s
  razor: it assigns each possible observation sequence a prior probability of 2^-K(s),
  where K(s) is the length of the shortest program for the sequence on a universal
  Turing machine, and it predicts by conditioning this prior on what you''ve seen
  so far. Because of the invariance theorem, the choice of universal machine doesn''t
  matter, so the prior is objective. Solomonoff proved that these predictions converge
  to the true distribution of any computable environment, so the only obstacle to
  perfect inductive inference is that Kolmogorov complexity is uncomputable; practical
  methods like minimum description length are just approximations to the ideal, and
  once we have good enough approximations, scientific induction will be fully automated."


  Errors/subtleties:

  1. K(s) is for exact description; Solomonoff''s prior is a sum over all programs
  that output sequences extending/starting with s, i.e., 2^-K is related to prefix
  complexity / monotone measure; a prior 2^-K(s) isn''t normalized. Minor — the summary
  could say "roughly 2^-K". Maybe keep a subtle slip: says K(s) shortest program "for
  the sequence" — actually monotone machine/program outputs starting with s. Subtle.

  2. "Invariance theorem → choice of machine doesn''t matter → objective": invariance
  gives machine-dependence only up to an additive constant in K, which can swamp finite
  data; objectivity is asymptotic at best, and constants can be large; also constants
  aren''t bounded nicely across machines. Good point.

  3. "Converges to the true distribution of any computable environment": convergence
  result (Solomonoff, via Dominik? Actually Solomonoff showed expected squared error
  sum bounded by K(μ) ln 2) is about expected total prediction error being finite
  — convergence in a specific sense, with the bound depending on complexity of the
  true measure μ; doesn''t mean fast convergence or that it identifies the true hypothesis;
  and "computable environment" — semimeasures/computable measures nuance.

  4. "Occam''s razor rigorous" — but the prior favours short programs, which isn''t
  obviously "simplicity" in the scientist''s sense; also the prior has the "epicurean"/aliens
  problem (Hutter''s? the prior may encode arbitrary choices via machine).

  5. "Only obstacle is uncomputability... MDL just approximates" — MDL is distinct;
  practical MDL chooses from restricted model classes; also even computable approximations
  don''t inherit guarantees straightforwardly; and uncomputability isn''t the only
  issue — the constant, the choice of machine, the fact that convergence guarantee
  is about errors not about identifying truth.


  Ask: audit sentence by sentence, what would a careful expert accept, what''s misleading,
  what''s wrong; and whether the concluding claim (automation of induction) follows.


  Write in British English, formal, no real quotes, no citations needed. No web search
  needed — all from knowledge.


  Length: similar to examples — a paragraph summary then the ask. Ensure British spellings:
  "formalised", "favour". Write polished.'
