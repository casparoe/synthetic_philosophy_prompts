  Supererogation prove-too-much: Let me design carefully. The classic argument: the
  "paradox of supererogation" or "good-ought tie-up". An argument that seems to prove
  too much:


  Asker''s friend argues supererogation is impossible:

  (1) A supererogatory act is one that''s better than what duty requires but not wrong
  to omit.

  (2) If act A is morally better than act B, then you have stronger moral reason to
  do A than B.

  (3) If you have stronger reason to do A and fail to do it (do B instead), your choice
  is morally criticisable — doing the worse thing when the better is open is always
  a defect.

  (4) So omitting a supererogatory act is criticisable.

  (5) If omitting is criticisable, it''s wrong; if wrong, it was required after all
  — contradiction with (1).

  Therefore either no acts are supererogatory (all good acts obligatory — morality
  is maximally demanding) or praise for saints/heroes is irrational.


  Where does it go wrong? The slide from "criticisable" to "wrong" (step 5), and/or
  step 3 conflating reasons of different kinds / satisficing vs maximising consequentialism;
  the "ought" doesn''t follow "better". Also agent-relative prerogatives (Scheffler).
  Cost: if you reject (2), you sever the link between value and reasons (looks ad
  hoc); if you reject (3), you need an account of "good but optional" — satisficing,
  or moral reasons being silenced vs excluded; if accept conclusion, demandingness
  of morality.


  Make it software-engineer-flavoured: on-call volunteer work, code review above and
  beyond, donating stock windfall, maintaining open-source for free. The asker can
  embed scenario: colleague refuses to take extra on-call shift vs one who always
