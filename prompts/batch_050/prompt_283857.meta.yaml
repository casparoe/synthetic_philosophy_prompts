  refute him.


  Para 2: numbered argument:

  (1) An act is "beyond the call of duty" only if it''s morally better than what duty
  requires while omitting it is not wrong.

  (2) If doing A is morally better than doing B, then A is what you have most reason,
  all things considered, to do. (Value-reasons link)

  (3) If you have most reason to do A and instead do B, then you''ve acted worse than
  you could have, and acting worse than you could is always open to legitimate criticism.

  (4) So omitting a so-called supererogatory act is legitimately criticisable.

  (5) An omission that is legitimately criticisable is a moral failure; a moral failure
  is just a breach of duty. So the act was a duty after all — contradicting (1).

  (6) Hence either morality demands we always do the best available action (nothing
