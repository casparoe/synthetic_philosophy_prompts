  But frequentist vs Bayesian disagreements are extremely well-trodden in pretraining.
  Need niche injection.


  Morgan''s canon: rank/rate could be nice: "rank these explanations of animal behaviour
  by how well they comply with Morgan''s canon" — but the type requires rating concepts/theories.
  Could construct: list of interpretations of animal behaviour (dogs, corvids, octopuses)
