  List of arguments for worst-case priority:

  1. Non-compensability: one catastrophe can''t be offset by many successes, so expectation
  with the wrong utility function misleads.

  2. Deployment distribution is not the training distribution: average-case over the
  wrong measure tells you little; heavy tails.

  3. Adversarial context: the environment includes agents (including the AI itself)
  who will seek out the worst inputs, so the worst case is what actually gets sampled.

  4. Deceptive alignment: good average behavior during training may be instrumental,
  so average-case evidence is actively contaminated.

  5. Correlated/parallel deployment: many copies share failure modes, so you don''t
  get the law of large numbers averaging you implicitly assume.

  6. Asymmetry of capabilities: a superhuman system only has to find one hole (security
  mindset / "the attacker only has to win once").


  Then ask: a further argument for prioritizing worst-case guarantees that isn''t
