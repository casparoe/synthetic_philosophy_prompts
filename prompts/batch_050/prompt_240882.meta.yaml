  about niche theories — doomsday argument is fairly well known in LLM training data.
  The taxonomy would be about the responses: (a) accept, (b) no reference class problem
  solvable... Standard rebuttals: the self-indication assumption (SIA), the "baby
  paradox," Dieks, the randomness assumption criticism, "old evidence"/update problem,
  simulation argument connection, future population size priors, Bostrom''s responses.


  Alternatively Hume on miracles with "prepare a speaker for objections" — audience
