  (unfit for the future, moral enhancement needed because cognitive enhancement is
  dangerous), objections: it''s coercive, it''s not feasible, moral enhancement undermines
  freedom (Harris), the problem of which morality to enhance, the ultimate harm argument.
  A "prepare a speaker" prompt where the speaker defends a modified bioenhancement
