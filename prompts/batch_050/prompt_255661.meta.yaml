  In my philosophy class we discussed Descartes''s cogito, and I built the following
  argument from it. It seems to prove that I am an immaterial soul, which I can''t
  bring myself to accept, so I think it proves too much — but I can''t find the step
  to reject.


  (1) I can doubt whether my body exists: everything I take to be bodily experience
  could be a dream or the work of a deceiving demon.

  (2) I cannot doubt that I exist, at least while I am doubting, since doubting that
  I exist is itself something I do.

  (3) So "I exist" is certain in a way "my body exists" is not.

  (4) If my mind were nothing but my body (or part of it), then whatever was certain
