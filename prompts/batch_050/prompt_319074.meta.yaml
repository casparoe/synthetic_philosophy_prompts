  ---


  I am preparing the deception chapter of a textbook (or: materials for my graduate
  seminar on the ethics of communication) and want a thought experiment constructed
  to order.


  Background: Much of the recent literature on lying and misleading treats lying as
  defeasibly worse than misleading — where lying is saying something one believes
  false, and misleading is saying something one believes true (or at least not saying
  the falsehood) while intentionally conversationally implicating it. The standard
  explanations appeal to the special way lying violates norms of assertion or abuses
  the hearer''s trust in testimony. I want a case that pressures this default from
  the opposite direction.


  The task: construct a pair of scenarios, a lying version and a misleading version,
  in which the lie is morally better than the misleading. Specifications:


  1. Realistic setting — a hospital, a workplace, or a courtroom anteroom; no science
  fiction, no stipulated conventions that simply attach penalties to lying (e.g.,
  an oath), since that would settle the question by fiat.

  2. The two versions must induce the same false belief in the same hearer, with the
  same consequences, the same stakes, and the same speaker knowledge; the only difference
  is whether the falsehood is said or merely conversationally implicated.

  3. The greater wrongness of the misleading version must fall out of features that
  generalise — not from contingent add-ons (e.g., the hearer happens to be more gullible
  in one version) that would let a defender of the standard view dismiss the pair
  as improperly controlled.

  4. The scenario itself should be one paragraph per version.


  After the scenarios: (a) state precisely which analysis of the lying/misleading
  distinction you are using and show that each version satisfies its side of it; (b)
  explain which feature of the case reverses the standard verdict — I suspect the
  promising route is that a self-generated inference produces a more resilient false
  belief than a believed assertion, but you may find a better one; (c) give the strongest
  response available to a defender of the standard view, who will presumably argue
  that the extra badness comes from some manipulative feature present only in the
  misleading version rather than from misleading as such, and say whether that response
  can be answered by further refinement of the case; (d) say what happens to the pair
  if the workhorse feature is removed.


