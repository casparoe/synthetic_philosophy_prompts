  Nomic is Peter Suber''s game. The paradox of self-amendment: if the amendment clause
  is used to change itself, e.g. make itself immutable — is that legal? The "paradox":
  either the clause applies to itself, in which case it can render itself unamendable
  (a "one-way" move), or it doesn''t... Suber''s resolution is that the paradox dissolves
  if you distinguish self-application... Actually Suber argues the rule of change,
  if immutable and self-applicable, can change itself making itself mutable — legal
  paradoxes: is the change valid?


  Alternative domains: Kant''s murderer at the door with credence decomposition could
  be interesting too: "What''s your credence that Kant''s position on lying is defensible
  when properly read" — but that''s a bit standard. Nomic with a twist would be good:
  invent a small concrete game with amendment rules and ask for a credence that a
  particular move is legal, decomposed.


  Good prompts of this type state the proposition precisely enough to have a truth
  value or say what counts as resolution, ask for decomposition, ask what would move
  the number.


  Design: a concrete mini-rule-system with an amendment clause, and ask: credence
  that some stipulated amendment sequence is "valid," decomposed into sub-questions
  (does the amendment clause apply to itself? does validity track the rule text at
  time of proposal or adoption? etc.). This injects a new niche setup while relying
  on known ideas (Suber''s paradox, Kelsen, Hart''s rule of recognition).


