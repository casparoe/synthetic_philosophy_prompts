  passes by majority vote; R3 (the amendment clause) says ''any rule, including this
  one, may be amended by a two-thirds vote.'' First turn, a player proposes P1: replace
  R3''s two-thirds threshold with a simple majority. It gets 68% of the vote. Next
  turn she proposes P2: ''R3 may not itself be amended.'' It gets 67%.


  My question: what''s your actual credence that P2, if adopted, successfully makes
  R3 unamendable going forward? Give me a number, not ''it depends''. Decompose it:
