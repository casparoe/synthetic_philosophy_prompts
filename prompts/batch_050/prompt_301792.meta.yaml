reasoning_summary: 'Let me pick a domain and type. I''ll go with "Is patriotism a
  virtue or a vice?" combined with the "Report one''s verdicts on a set of cases and
  ask what principle captures them" type. That seems a natural fit: verdicts on cases
  of patriotic/unpatriotic conduct, ask for principle.


  Need concrete cases with verdicts, at least one hard-to-reconcile pair. Elaborate,
  formal, 1-3 paragraphs. No quotes needed, no niche facts. Let me draft.


  Cases ideas:

  - Cheering for your country''s team at the Olympics: fine, harmless.

  - Paying taxes willingly / serving on jury: fine.

  - Buying domestic products at slightly higher price to support local workers: fine.

  - Refusing to believe credible evidence your country committed war crimes: not fine.

  - A soldier refusing an unlawful order out of conscience, called unpatriotic: the
  refusal is fine, even admirable.

  - Patriotism of an immigrant toward the new country vs old country.

  - Voting for a policy because it benefits your country even though it foreseeably
  harms foreigners much more (e.g., trade policy that devastates poor foreign farmers):
  not fine? Or borderline.

  - Celebrating a national holiday with military parades: fine but with unease.

  - Someone who loves their country''s landscapes, cuisine, literature but despises
  its government — patriot?

  - Flying the flag on your house: fine; flying it at a protest to intimidate immigrants:
  not fine.

  - A whistleblower revealing illegal surveillance by own government: fine/admirable,
  though called traitor.

  - Rooting against your own country''s team because you dislike the regime: fine?
  ambivalent.

  - Preferring to hire a compatriot over a more qualified foreigner for a job at your
  private company: not fine? or fine-ish.

  - Fatherland vs constitutional patriotism.


  Hard-to-reconcile pair: e.g., paying more for domestic goods to support compatriots
  is fine, but a hiring manager preferring a compatriot candidate over an equally
  qualified foreigner is not fine — both are partiality toward compatriots in economic
  choices. Or: cheering national team fine, but cheering your country''s soldiers
  in an unjust war not fine? Actually supporting troops case.


  Another pair: buying local is fine, but voting for tariffs that hurt foreign poor
  is not fine — both economic partiality at a cost. What principle distinguishes?
  Maybe scope of harm, or the means (personal resource use vs coercive state power).


  Also: the wartime case — harboring refugees against your country''s policy? Or:
  a citizen who spies for a foreign country whose cause is just (e.g., giving Allied
  info while being a German citizen in WWII) — admirable; a citizen who spies for
  money for a neutral country — treason, bad. Both are betrayals of country.


  Let me structure: "I''ve been in a reading group... MacIntyre''s ''Is Patriotism
  a Virtue?'' and cosmopolitan responses..." Mention MacIntyre maybe, but avoid leaning
