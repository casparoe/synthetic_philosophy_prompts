  Design sketch:

  - Setting: intro political science/history/philosophy seminar, ~24 students, 75
  minutes.

  - Game: "Standard wars" — groups of 4-6 are "regions" choosing between two technologies
  (call them A-format and B-format) for some neutral good (connectors). Round 1: each
  person privately picks a format; small random events (cards) give some players info.
  Payoff in each round = number of other people in your region using your format (network
  externality) + intrinsic quality draw. Actually to inject contingency: in round
  1, a coin flip determines which format gets a tiny early edge in each region (e.g.,
  one demo unit). Over rounds, adoption cascades; switching costs grow (each round,
  cost to switch increases). By round 6, regions are locked into different standards.

  - Then the reveal: the "intrinsic quality" cards show that in some regions the worse
  standard won due to the early coin flip.

  - Second phase: replay with a "planner" round where regions can coordinate a switch
  — show the coordination cost of un-locking.

  - Debrief: map to increasing returns (Arthur), lock-in, contingency vs. determinism;
  the counterfactual question — would the same outcome have arrived anyway? Introduce
  the distinction: ex post inevitability vs. ex ante contingency. Predictable failures:
  students game the payoffs, groups too small to cascade, someone refuses to switch
  on principle, payoff accounting confusion.

  - What it can''t reproduce: real history has no re-run; participants know it''s
  a game and can see the counterfactual, whereas actual lock-in hides alternatives;
  also no genuine sunk costs of identity.


