  for a principle.


  Casual tone, British English requested, possibly a typo. Keep it short-ish. No quotes
  needed, no web needed.


  Cases: e.g., calculating a tip after drinking; disagreeing with equally smart colleague;
  pilot taking anti-anxiety meds; a philosopher who believes their argument is sound
  even though peers disagree; a case where ignoring HOE seems right (e.g., you clearly
  see p, and the "evidence" is that a gas lamp flickered making your vision unreliable...
  ). A hard-to-reconcile pair: (1) you shouldn''t be confident your proof is right
  after learning you took a drug that causes overconfidence in 90% of users; (2) but
  the mathematician who checks a proof line by line while peers disagree can stick
  with it because the first-order evidence is so strong? Or the classic "level-splitting"
  cases.


  Let me write concrete cases with verdicts:


  1. I''ve done the maths carefully and get the tip is £13.60; my friend who is usually
  as good at arithmetic as me says £12.80 — I should now be about 50/50. (yes)

  2. After drinking two pints, I recompute and get an answer; I know alcohol makes
  people overconfident about arithmetic, so I should trust my calculation less even
  though it feels airtight. (yes)

  3. A detective has built a case over months pointing to the butler; a colleague
  detective, equally competent, says the evidence points to the gardener. Detective
  should suspend judgement. (yes)

  4. But: a logician has just checked a proof step by step, each step trivially valid;
  then learns that 99% of people in the study who took the pill she took became overconfident
  about exactly this kind of proof. Verdict: she can rationally stay confident, because
  otherwise rationality unravels — she can''t even assess the higher-order evidence
  without using her reasoning. Hmm, this conflicts with 2.

  5. Sleep-deprived pilot case: instrument vs. feeling.

  6. A case where you learn a study says most people are wrong about p, but your reasons
  for p seem compelling — gut says still believe p (resilience). Conflicts with 1.


  Ask: what principle captures these? Also ask about a further case: what about when
  the higher-order evidence itself is the conclusion of your own reasoning (e.g.,
  you reason that your reasoning is unreliable)? Does the principle apply to itself?


