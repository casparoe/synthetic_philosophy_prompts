  are phenomenal seemings). Let me structure:


  Genuine tensions: (1)&(2) — Müller-Lyer "seeming" is itself a phenomenal seeming,
  so the analogy either presupposes phenomenality or must be re-read as judgment-seeming,
  which weakens it (this is the standard "the illusion itself seems phenomenal" regress
