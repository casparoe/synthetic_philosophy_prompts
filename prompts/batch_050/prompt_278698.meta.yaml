  hmm — wait, illusionists do use phenomenal concepts, e.g., Frankish. The standard
  phenomenal concept strategy (Loar) says phenomenal concepts refer directly to phenomenal
  properties and that''s why the epistemic gap arises; it presupposes phenomenal properties
  exist. For the illusionist, phenomenal concepts must instead generate the illusion.
  So commitment (4) "the phenomenal concept strategy explains why conceivability arguments
  fail" is borrowed from realists — tension with (1). Good genuine tension, subtle.


  (5) What makes pain bad, morally, is what it''s like to be in pain — that''s why
  I think animal pain matters. — case verdict the principle can''t deliver (illusionism
  denies there is anything it''s like). Genuine tension.


  (6) Introspection is generally reliable about our non-phenomenal mental lives —
  what we believe, intend, attend to — it just goes wrong specifically about phenomenality.
