  (1)&(4): borrowing the realist phenomenal concept strategy — the strategy as standardly
  developed explains the epistemic gap while taking phenomenal properties as real
  referents of phenomenal concepts; an illusionist can''t take that version over,
  they need concepts that produce rather than safely refer. Moderate.


  (1)&(5): pain''s badness grounded in what-it''s-like — straightforwardly incompatible;
  must relocate badness to preferences/functional role. High severity too.


  Apparent tension that dissolves: (3) vs (6)? Hmm. Or (1)&(6): "you trust introspection
