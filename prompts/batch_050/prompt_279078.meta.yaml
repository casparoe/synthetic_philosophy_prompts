  Aumann: common knowledge of priors + common knowledge of posteriors → equal posteriors.
  A niche angle: what if agents have different information partition structures, or
  the role of the common prior assumption; or whether the theorem survives when agents
  can only communicate coarse-grained summaries of posteriors. A desiderata prompt:
  "what must a theory of rational disagreement deliver?" Or essay: reach verdict on
  whether disagreement between epistemic peers is irrational given Aumann.


  Berkeley on money: he wrote "The Querist" — queries on whether money is a ticket/counter,
  power, etc. Niche. Might lean on specific work attribution; I''d need to verify.
  Avoid quotes.


  Nietzsche on diet: Ecce Homo chapter "Why I Am So Wise" discusses diet. Also risky
  re specifics.


  Hempel''s ravens: Nicod''s criterion, Bayesian solutions, the indoor ornithology
  objection. A niche angle: the paradox depends on treating "All ravens are black"
  as equivalent to "All non-black things are non-ravens"; but what about confirmation
  of disjunctive hypotheses? Could write a research proposal: "does the paradox show
  something about evidence generally, or only about universal generalizations?" Or
  a desiderata: what must an account of confirmation deliver to handle ravens.


  Functionalism/multiple realizability: niche angle — multiple realizability is usually
  argued downward (same mental state, different substrates). What about "realization-sensitivity":
  the grain at which functional descriptions are specified. Or the question whether
  MR actually argues against type-identity given that functional kinds might themselves
  be multiply realizable... The standard debate: Fodor/Putnam vs. identity theorists
  (Lewis, Kim''s response that multiply realized kinds are disjunctive kinds). A nice
  in-the-weeds angle: the "grain problem" — any two systems realize the same functional
  organization at some level of description (too liberal), but too fine-grained and
  nothing is multiply realized. Searle''s claim that anything can be described as
  implementing any program (Putnam''s theorem about rocks). A research proposal on:
  what constraint on functional description makes multiple realizability both true
  and non-trivial?


  Perspective: someone who just had a long argument with a friend. Formal/polished
