  Para 2: Here''s the argument as I''ve written it up... numbered 1–7.


  (1) Holding someone responsible — blame, punishment, gratitude, expecting them to
  keep a promise — only makes sense if the person in front of you now is the same
  individual who acted or promised back then.

  (2) Being "the same individual" across time requires something that persists: a
  bearer that stays numerically one and the same while its states change. (As a physicist
  this is the bit I''m most suspicious of — an electron doesn''t even pretend to be
  reidentifiable, but set that aside.)

  (3) Look for the bearer and you don''t find one: cells replaced, memories revised,
  character drifting; "the person" is a way of talking about a stream, not a thing
  in the stream — which is exactly what Nagasena''s similes keep saying.

  (4) So strictly, today''s man is not the same individual as yesterday''s; he is
  a causally downstream successor, the way the ripe mango succeeds the seed.

