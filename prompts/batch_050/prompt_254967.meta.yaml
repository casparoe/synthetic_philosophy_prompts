  Numbered argument draft:


  (1) Blame, praise, keeping promises, and paying debts all presuppose that the person
  on the receiving end now is the same individual who acted or committed back then.

  (2) Being "the same individual" over time means something in you persists — a bearer
  that stays numerically identical while its states change.

  (3) But on close inspection nothing like that is found: the body is replaced cell
  by cell, mental events arise and pass each moment, and ''person'' is a label for
  a stream, like a flame passed along candles (the text''s own picture).

  (4) So strictly speaking the person sitting here is not the same individual who
  made the promise yesterday — only a causally downstream successor.

  (5) So strictly speaking no one is ever blameworthy for anything that happened earlier
  than the present moment; yesterday''s thief and today''s defendant are different
  individuals, like the green mangoes and the ripe ones.

  (6) But a view on which the courtroom, the marriage vow, and my gratitude to the
  friend who visited me in hospital in 1998 are all resting on a fiction is a view
  that proves too much.

  (7) So either (3) is wrong — there must be a persisting self after all — or (1)
  is wrong, and I can''t see how to give up either without losing something I need.


