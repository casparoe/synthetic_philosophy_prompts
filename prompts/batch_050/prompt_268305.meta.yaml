  I''m working on a piece about the experience machine and keep going back and forth
  on what the thought experiment actually shows, so I want you to compare two versions
  of the case and tell me what the difference between them teaches us.


  Version one is the classic: you''re offered permanent connection to a machine that
  will give you whatever experiences you want, a life that feels from the inside better
  than your actual one in every respect, and you won''t know you''re plugged in. Most
  people say no thanks. Version two is flipped around: you''re informed that your
  whole life up to now has in fact been inside such a machine, that your real body
  is floating in a tank somewhere, and you''re given the choice to be unplugged into
  a reality that is genuinely real but much poorer and less pleasant than the simulated
  one you''ve been living. The odd thing is that a lot of the same people who refuse
  to plug in also refuse to unplug.


  Two readings of this asymmetry interest me. On the first, the flip shows the original
  case was never really tracking well-being at all: what drives the intuition is just
  status quo bias and attachment to whatever you currently have, so the experience
  machine fails as an argument against hedonism. On the second, the two cases are
  not symmetric in the way that matters — in one you''re abandoning real projects
  and relationships for fake ones, in the other you''d be abandoning the (simulated
  but psychologically real) attachments your actual life is made of for the sake of
  an abstract truth — and the intuitions track something genuinely normative in both
  cases.


  Which reading do you find more convincing, and why? And then the part I really want
  your take on: suppose the second reading is right, and what the pair of cases shows
  is that judgements about how well a life goes are path-dependent — they care about
  the history that produced the life, not just the stream of experiences ahead. Can
  any of the standard theories of well-being (hedonism, desire-fulfilment theory,
  objective list theories) actually accomodate that, or does taking the intuition
  seriously force you somewhere none of them comfortably sit? If you think the first
  reading is right instead, then answer the mirror question: what would an argument
  against hedonism have to look like to avoid the status-quo-bias objection, and does
  the desire-fulfilment or objective-list approach actually deliver one, or do they
  just change the subject?


  Please write this as continuous prose, like an email — no headings, no bullet points,
  no bolding, no tables. I''m going to paste your answer straight into my notes, so
  I want it readable as one flowing thing rather than a structured document.


