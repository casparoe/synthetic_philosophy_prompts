  Background. In his reply to Benjamin Constant, Kant notoriously maintained that
  it would be wrong to lie even to a would-be murderer who asks whether his intended
  victim is in your house. Set aside, for the purposes of the essay, whether that
  conclusion is correct; grant it arguendo. The controversy your essay should address
  concerns two neighbouring tactics:


  (a) Paltering: answering with a statement that is literally true but designed to
  produce a false belief — for instance, ''He was at the market this morning,'' uttered
  so as to suggest he is out, when in fact he is upstairs.


  (b) Strategic reticence: refusing to answer, changing the subject, or answering
  a different question from the one asked, in the hope that the murderer will draw
  the convenient inference on his own.


  Call the position that these tactics remain permissible where the outright lie is
  not the loophole view; call the position that they stand or fall together with the
  lie the unified view.


  Your essay should do all of the following:


  1. Reconstruct the strongest available version of Kant''s argument against lying
  to the murderer, rather than the weakest or most familiar one. Consider in particular
  whether the argument turns on the falsehood of what is said, on the deception of
  the hearer, on the abuse of the murderer''s rational agency, or on the liar''s assumption
  of responsibility for the consequences.


  2. Apply that reconstruction to (a) and (b). Does the argument, as you have reconstructed
  it, condemn paltering and strategic reticence as well, or does it leave them untouched?
  Pay attention to whether your reconstruction yields a principled line between the
  two tactics, or sweeps them together with the lie.


  3. Address the most serious objection to whichever position you favour. Against
  the loophole view: that it converts a rigorous ethic into a casuistry of technicalities,
  in which the very same deception is condemned when phrased one way and licensed
  when phrased another. Against the unified view: that it proves too much, since it
  appears to condemn not only misleading truths but even silence itself, and it is
  hard to see how an ethics of honesty could forbid saying nothing.


  4. Consider whether a distinction between actively causing a false belief and merely
  allowing one to arise does any real work here, and whether it maps onto the line
  between lying, paltering, and reticence in the way its defenders suppose.


  5. Conclude with a defended verdict: state which of the two views is correct on
  the best reconstruction of Kant''s position, and say explicitly what, on your conclusion,
  one is and is not permitted to do at the door.


  The essay should be written in formal British English, roughly 1,000–1,500 words,
  and should argue from the structure of the Kantian position itself rather than merely
  reporting what commentators have said about it."


