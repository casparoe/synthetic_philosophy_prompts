reasoning_summary: 'I need to pick a domain and a type. Options: paradox of hedonism,
  updateless decision theory, Schopenhauer''s views on music, innateness/poverty of
  stimulus, knowing how vs knowing that.


  Type: adjudicate a disagreement. Let me combine "knowing how vs knowing that" with
  a disagreement-adjudication prompt — that works well and avoids niche facts. Or
  paradox of hedonism with a dispute. Or UDT — but UDT is niche and may be hard for
  small LLMs; though injecting the idea into the prompt handles that. The "adjudicate"
  type works best with a concrete everyday disagreement that maps onto the philosophical
  issue.


  Let me craft: two people disagree about whether a skilled chess player / cyclist
  "knows" something. E.g., one friend claims a retired concert pianist who can no
  longer explain how she plays still "knows how to play"; another says knowledge requires
  ability to... Hmm, classic Rylean debate: knowing-how as ability vs propositional.


  Good scenario: A friend, a former competitive swimmer, had a stroke / or simply
  got out of shape and can no longer swim well but can coach brilliantly. Dispute:
  does she still "know how to swim"? Or reverse: a self-taught cook who makes perfect
  omelettes but can''t explain; a physicist who can explain the physics of bike balance
  but can''t ride.


  Disagreement: Alex says knowing how is just knowing a bunch of facts (intellectualist);
  Sam says knowing how is an ability. Concrete case: their mutual friend Dana, a former
  gymnast with a spinal injury who can no longer perform but coaches champions. Alex:
  Dana doesn''t know how to do a backflip anymore since she can''t do it — knowledge-how
  requires the ability. Sam: Dana clearly knows how — she can spot exactly what a
  student does wrong; knowing-how isn''t the same as being able. Alex: then an armchair
  sports fan who''s studied biomechanics "knows how" to do a backflip — absurd. Sam:
  the fan has knowledge-that, not knowledge-how; Dana''s case differs because... hmm
  need genuine moves.


  Rounds:

  1. Dana, ex-gymnast, paralyzed/injured, coaches elite gymnasts, can diagnose errors
  precisely. Dispute begins: does Dana know how to do a vault?

  2. Mira (anti-intellectualist/ability view): knowing how = being able; Dana lost
  the ability, so she lost the knowledge-how, though she retains lots of knowledge-that
  about vaulting.

  3. Theo (intellectualist): she clearly knows how — that''s why she''s a great coach;
  knowing-that about vaulting is exactly what coaching draws on. Losing a skill through
  injury doesn''t erase knowledge.

  4. Mira: if knowing-how is just propositional, then someone who has memorized the
  biomechanics textbook but never set foot in a gym knows how to vault — reductio.

  5. Theo: maybe they do know how, in a sense, and what they lack is the ability;
  or distinguish genuine knowledge-how requires the propositions be grasped in the
  right way... but keep moves genuinely decent. Theo could reply: the textbook student
  lacks knowledge too — they know facts but not which facts matter in the moment;
  Dana''s knowledge is manifest in her coaching success, which is an ability of a
  kind, just not the ability to perform. Mira counters: then "knowing how" just means
  "having some related ability," and the disagreement collapses into picking which
  ability counts.


  Then ask: adjudicate move by move, who is right about what, what both miss.


  Include epistemic request: invite pushback if the framing rests on a confused premise.
  Also note asker is a bystander who doesn''t signal a side.


  Length: 1-3 paragraphs, elaborate, formal. No quotes needed, no web needed. Write
  it.'
