  The unilateralist''s curse is Bostrom et al. concept: when many agents can each
  unilaterally take an action, the most optimistic agent acts, so actions get taken
  more often than warranted. Well known in rationalist communities. To make it "in
  the weeds" but not requiring citations, I could invent a niche twist — e.g., a new
  wrinkle like applying it to a specific concrete scenario.


  Type "prepare a speaker for objections" works great: the asker is presenting the
  unilateralist''s curse as an argument at, say, an EA group or a policy seminar,
  and wants objections. Let me inject a new idea: maybe the asker proposes extending
  the curse to a domain not usually discussed, e.g., internal decisions inside a research
  lab, or "unilateralist''s blessing" cases, or a proposed institutional fix ("deliberation
  tax" / commitment devices).


  Let me craft: The asker is presenting at their local EA/rationalist meetup or an
  Effective Altruism student group, arguing that the unilateralist''s curse justifies
  a specific norm — e.g., that labs/orgs should adopt a norm requiring agents who
  believe they have private information favoring an irreversible action to... something.
  Or better: they want to present a claim that the curse applies within a single org,
  not just across independent actors — "the internal unilateralist''s curse" — where
  the most eager team member pushes a launch. Audience: mix of EA longtermists, a
  couple of decision theorists, some skeptics who think it''s an excuse for cowardice/inaction
  ("unilateralist''s curse as a fully general excuse to never do anything").


  Good objections to anticipate: (1) the curse assumes symmetric information/naive
  agents; if people update on others'' silence it can reverse (unilateralist''s blessing
  — actually there is literature noting that if agents are rational and know about
  the curse, the effect can invert; "the unilateralist''s curse can be self-defeating").
  (2) Status quo bias / omission bias — inaction is also a unilateral action sometimes.
  (3) Who counts as the relevant pool of agents — scope sensitivity. (4) The curse
  predicts we should see more rash action, but empirically orgs seem too slow — base
  rate. (5) It rationalizes centralization and vetocracy, which has its own costs.


  The persona: longtime reader of rationalist blogs, casual, maybe a typo. One to
  three paragraphs. Don''t quote anything verbatim — avoid quotes from real texts.
  No citations needed. Write from knowledge — fine.


  Should I mention the paper authors? "Bostrom, Douglas, Sandberg" — the paper "The
  Unilateralist''s Curse and the Case for a Principle of Conformity" (2016). I could
