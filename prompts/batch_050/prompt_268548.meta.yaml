  The summary (from, say, a "Great Ideas" podcast companion book or a professor''s
  lecture notes) might say:


  "Leibniz''s identity of indiscernibles says that if two things share all their properties,
  they''re actually one and the same thing. Leibniz held this as a necessary truth
  about reality — for him, God would never create two perfectly alike things, since
  he''d have no reason to place one here rather than there. Max Black''s famous counterexample:
  imagine a universe containing nothing but two exactly similar iron spheres, two
  feet apart, forever. Since we can describe such a universe, it''s possible, so the
  identity of indiscernibles is false — a metaphysical principle can''t be refuted
  by logic alone, but possibility is shown by conceivability, so Black refuted Leibniz.
  Defenders of Leibniz respond that the spheres differ in spatial properties (one
  is here, one there), but Black showed this response circular since location only
  distinguishes the spheres if they''re already two."


  Subtle misrepresentations:

  1. "Conceivability implies possibility, so Black refuted Leibniz" — overstates:
  most treat Black''s case as a challenge/argument that a symmetrical universe is
  possible, contested whether the description is coherent; Black himself presented
  it as a dialogue and was cautious. Also PII defenders can deny the scenario is genuinely
  possible.

  2. Leibniz''s "God would have no reason" — that''s the principle of sufficient reason
  supporting PII; presenting it as the content of PII conflates PII with PSR; Leibniz''s
  own arguments were various; also Leibniz''s PII is sometimes read as necessary,
  sometimes as contingent (actually true in the actual world / true of substances).
  Presenting it flatly as "necessary truth" is a simplification — some Leibniz scholars
  take it as necessary, others as contingent. A defender would wince.

  3. "one is here, one there" response: Black''s point is that "here/there" is defined
  relative to the spheres; the more sophisticated response involves relational spatial
  properties (being two feet from a sphere) which both share — so the naive spatial-properties
  response fails for a slightly different reason than "circularity"; Black argues
  identity must be established before locations can be attributed, but critics (e.g.,
  via haecceities, or via impure properties, or bundle theory with compresence) respond.
  Also Russell''s point that PII only applies to universals/non-spatiotemporal properties.
  Could include the misrepresentation that "Black showed the response circular" as
  settled.

  4. Maybe: the summary says the spheres are "two feet apart" — fine. Could add misrepresentation:
  "since we can describe such a universe, it''s possible" — conceivability-possibility
  link presented as unproblematic.


