  on whether a symmetrical universe is possible; conflating "indiscernible" (sharing
  all properties) with "indistinguishable to an observer"; or saying Leibniz''s argument
  was that God wouldn''t create two identical things (that''s about sufficient reason).


  Let me go with the verdicts type on inheritance/dynastic wealth — feels rich, concrete,
  and the "write cases with a hard-to-reconcile pair" instruction produces good prompt
  material. Actually, let me reconsider: fair-summary on Black''s spheres tests conceptual
