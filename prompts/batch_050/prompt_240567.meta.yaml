reasoning_summary: 'Let me pick a domain and type. "Proves too much" type works well
  with Nomic (self-amending rules paradox) or value aggregation. Let me do Nomic with
  a "seems to prove too much" argument — Peter Suber''s Nomic paradox of self-amendment.
  The classic: rule-changing rules being immutable, and whether rule 213 (the paradox
  of self-amendment) shows that in any self-amending system, every rule is either
  immutable or everything is permitted.


  Argument sketch: (1) A constitution permits amendment of its amendment rules. (2)
  So the rule that makes amendments permissible can itself be amended (e.g., repealed
  or replaced with "no further amendments allowed" or "whatever the dictator says").
  (3) A rule permitting its own repeal can''t constrain anything... conclude every
  self-amending constitution is unstable/trivial. Where does it go wrong? The flaw:
  equivocation about "permissible" — amendment procedure vs. legality; or the slide
  from "can be amended" to "amendment is arbitrary." Actually the standard diagnosis:
  the paradox confuses permissibility of amendment with loss of authority — a rule
  that authorizes its own replacement also authorizes (in the same act) what the replacement
  is, so the chain of legality is preserved. Also logical types issue (Suber''s analysis:
  the paradox arises because initial rules change, but at any time, the rules are
  determinate).


  Alternatively value aggregation: an argument that seems to prove aligned AI should
  serve no one''s values / or must be utilitarian. E.g.: (1) AI must not impose contested
  values on people (neutrality). (2) Any aggregation method over conflicting preferences
  privileges some weighing... (3) every weighing is a value choice... (4) so neutrality
  is impossible, (5) so "aligned to human values" is empty. Diagnosis: equivocation
  between two senses of neutrality (neutrality of justification vs neutrality of outcome);
  Arrow-style impossibility shows constraints conflict, not that no aggregation is
  justifiable.


  Nomic might be more fun and distinctive. Let me build it casually.


  Draft:


  A friend who''s really into Peter Suber''s game Nomic (the one where changing the
  rules is a move) came up with this argument that any constitution that can amend
  its own amendment rules is either useless or a time bomb. (1) Suppose rule R says
  amendments to the amendment rules are allowed by majority vote. (2) Then by majority
  vote, R can be replaced with R*: "no further amendments ever" or "whatever the president
  says goes." (3) Whatever was legal under R remains legal — the vote that passed
  R* was valid under R. (4) So a single legal act can legally destroy the whole constraint
  structure of the constitution. (5) Any constraint that can be legally removed at
  will isn''t really a constraint. (6) So a fully self-amending constitution constrains
  nothing at all — it just looks like it does until someone bothers to end the game.


  Where does it go wrong? Hmm, is it flawed or valid-with-premise-to-reject? The standard
  diagnosis: premise 5 conflates revocability with non-constraint (laws constrain
  even though repealable). Also step 3-4 slide: "legal" under old rules — the legality
  of the act is fine but the conclusion about "the whole constraint structure" ignores
  that constraint can persist through the content chosen; and R* like "president says"
  is still a constraint structure, just a dictatorship. Actually premise 2 assumes
  any amendment content is permitted — that''s a premise one could reject (entrenchment,
  eternity clauses, self-reference limits). The real interest: Suber''s own paradox
  of self-amendment. The flaw is probably premise 5: revocable ≠ unconstraining; speed
  limits constrain despite legislature being able to repeal them tomorrow. The argument
  conflates "can be changed by a legal procedure" with "can be changed at will" —
  the procedure itself constrains.


