  and co-opted traits (exaptation) as disanalogy points — designers don''t repurpose
  the way selection does via exaptation without prior selection history? Actually
  exaptation is a problem for etiological accounts too (a co-opted trait with no selection
  history for its current use — is that its function?). (2) The first-instance problem:
  a mutation''s first occurrence has no selection history. (3) Whether the analogy
  illicitly imports intentional fixing of standards (a designer can set a standard
