  helped or hindered in pursuing — and can be harmed in the sense of being damaged,
  frustrated, or destroyed. On that view a digital mind could merit moral consideration
  even if we could not confirm it has any inner life, since the presence of experience
  is exactly the kind of thing we cannot verify from outside.


  Substrate independence is usually invoked at this point to break the tie in favor
  of the functional view. The principle says that consciousness does not depend on
  the material a mind is made of: if a silicon system has the right functional organization,
  it can be conscious just as a biological one can. It follows, the argument goes,
  that we should treat digital minds as conscious whenever they are functionally sophisticated,
