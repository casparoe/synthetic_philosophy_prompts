  cold. (Or: moral knowledge requires some affective uptake.)

  3. Psychopaths, due to lacking empathy/fear responses, are incapable of that affective
  uptake, so they can''t know their actions are wrong in the relevant sense.

  4. So psychopaths are not blameworthy.

