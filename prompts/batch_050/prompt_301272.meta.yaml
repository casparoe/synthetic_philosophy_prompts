  "I''m a PhD student in criminal law theory working on the fault requirement, and
  I''m stuck at the stage before the stage: I keep reading arguments for and against
  strict liability offences, but the authors seem to be talking past each other about
  what such an offence would even need to do to be defensible. So before I go any
  further I want a specification, not a verdict.


  Write the desiderata for a theory of when (if ever) it is permissible to punish
  someone without proof of fault as to some element of the offence. By desiderata
  I mean: what must such a theory deliver to count as adequate?"


  Then list constraints:


  - It must say something about cases where the defendant did everything reasonable
  to comply — e.g., invented case: a shopkeeper who sells sealed tins, supplied by
  a reputable wholesaler, that turn out to be adulterated; no inspection possible.
  A theory that permits punishment here has to own that; one that forbids it has to
  explain what the legislature should do instead about the enforcement problem.

  - Distinguish punishing without fault from shifting the burden / rebuttable presumptions
  / due diligence defences. Is a strict liability offence with a due-diligence defence
  actually strict liability or negligence in disguise? The theory needs to take a
  stand on whether that''s a genuine difference.

  - Must respect the distinction between elements of the offence and defences — many
  "faultless" convictions involve fault as to some elements. Mistake of fact vs mistake
  of law.

  - Must distinguish regulatory offences / mala prohibita from serious crimes (stigmatic).
  Whether the stigma and punishment severity matter.

  - Must deal with the objection that strict liability is just negligence liability
  with the inquiry suppressed — if you can show the person couldn''t have done otherwise,
  what''s left?

  - Must handle the "punishment expresses censure" point — if blame requires fault,
  punishing the faultless is either unjust censure or the theory has to explain what
  punishment means in these cases (ticket vs conviction).

  - Flag pairs that can''t be jointly satisfied — e.g., the enforcement desideratum
  (convict the genuinely hard-to-prove-fault cases) vs. the censure desideratum (never
  blame the blameless).

  - Committed: tell me which desiderata you''d sacrifice.

  - British English.


