  Idea: An argument that Occam''s razor, via Solomonoff induction, proves that the
  universe must be a computer simulation / or that simple theories are always more
  probable, therefore... Something that proves too much.


  Classic "proves too much" arguments in this space:

  - The argument that algorithmic probability favors simple universes, hence we should
  expect our universe to be the simplest one consistent with our observations, hence...
  Boltzmann brains? The simplest program generating my observations doesn''t need
  to generate the rest of the universe — so Soloff induction seems to predict that
  only my observations exist (solipsism is shorter code!). This is a genuine known
  issue: the "simplicity prior favors solipsism" or the "Boltzmann brain" problem,
  and also the universal prior depends on choice of universal Turing machine (reference
  machine problem).


  So: an argument built from numbered premises:

  1. Solomonoff induction: probability of a hypothesis ∝ 2^(−K), the best formalization
  of Occam''s razor.

  2. A hypothesis is a program that outputs my observations.

  3. The shortest program outputting my observations need not generate a whole lawful
  universe; it can just hard-code/compress my actual observation stream — a "solipsistic"
  program that simulates only me and my experiences is shorter than one simulating
  10^80 particles.

  4. Therefore Solomonoff assigns higher probability to solipsism/Boltzmann-style
  observer-moment than to a lawful external universe.

  5. But solipsism is absurd / I''m confident there''s an external world.

  6. Conclusion: either Occam''s razor is wrong, or... something.


  Where does it go wrong? Real diagnosis: Solomonoff''s prior is over programs that
  generate observations; a program that just outputs the observation sequence without
  a world model is not actually shorter, because a lawful universe + location of the
  observer (indexical information) can be shorter than the full raw observation stream
  which contains tons of noise (this is the "algorithmic efficiency of the world"
  point — physical law is a highly compressive description). Also the distinction
  between K of the observations vs K of the world generating them; and the reference-machine
  dependence. The argument also equivocates between "simple theory of everything"
  and "simple generator of my data stream." Good — the prompt shouldn''t announce
  the flaw.


  Alternative: argument that proves too much about Occam''s razor in curve-fitting:
  simpler curve always preferred → we should always believe the zero-information hypothesis.
  Meh.


  Another angle: "Kolmogorov complexity is uncomputable, therefore Occam''s razor
  can never be applied, therefore all our science is unjustified" — proves too much.
  That''s also nice: premises: justified inference requires computable procedure;
  Kolmogorov complexity uncomputable; hence no justified preference for simple theories;
  hence science unjustified. Flaw: justification doesn''t require computability; approximations
  (MDL, practical compressors) suffice; also uncomputability doesn''t mean unapproximable
  from above.


  The solipsism one is richer. Could combine both? Keep it focused.


