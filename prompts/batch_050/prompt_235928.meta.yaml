  Draft:


  "So I retired last year after thirty-some years as a biochemist, and I''ve been
  using my newfound free time to fall down the philosophy rabbit hole... lately algorithmic
  information theory, Occam''s razor, that whole cluster. I worked up an argument
  for my reading group and it seems to prove solipsism, which I refuse to accept,
  so somewhere I must have gone wrong. Here''s the argument:


  (1) Ockham''s razor is rationally compelling: among hypotheses fitting the data,
  prefer the simpler.

  (2) Solomonoff induction is just the razor made precise: each hypothesis is a program
  for a universal Turing machine that outputs your observations, and its prior probability
  is 2^−L where L is program length in bits.

  (3) So of two programs that both output exactly my stream of experiences, the shorter
  one is the better hypothesis — exponentially better, one bit halves the probability.

  (4) Consider two candidate programs. Program A simulates the actual universe: 10^80-something
  particles, 13.8 billion years, the standard model lagrangian, and somewhere in there,
  me. Program B simulates only a single observer — my brain states, or even just outputs
  my sensory stream directly — and nothing else.

  (5) B is vastly shorter than A... [why plausible: A needs initial conditions of
  the whole cosmos, B only needs enough to produce one person''s experiences].

  (6) Therefore B is exponentially more probable: the rational conclusion is that
  nothing exists beyond my experiences.

  (7) That''s absurd. So one of (1)–(5) has to give.


  I''d rather keep (1) and (2)... I suspect the problem is somewhere in (4)-(5), but
  a friend in the group insists the problem is (3)... Tell me where it breaks and
  what it costs to repair... keep reply under 400 words..."


  Wait — is (5) actually the false premise? The subtle point: B might not be shorter.
  Raw sensory stream is full of thermal noise and detail; compressing it may require
  essentially specifying all that noise — a lawful universe plus a pointer to the
  observer can be much shorter than the raw data. So (5) looks plausible but is contestable
  — the genuine weak point. Also the equivocation: "hypothesis" in (2) means a generator
  of observations, so B counts as a legitimate hypothesis; the flaw isn''t that B
  is disqualified but that shortness comparison is not as advertised. Also there''s
  the known point that Solomonoff is about sequence prediction: the universal prior
  converges to whatever program best compresses the data, and the best compression
  of your data may well go through the physical world (the world is the best compression
  of your sensory data). So the argument''s flaw: (5) asserts B is shorter without
  justification, and plausibly A+locator is shorter. Also (4)''s "Program B outputs
  my sensory stream directly" — but that stream is enormous and incompressible in
  part.


  Also there''s a known subtlety: even granting B shorter, Solomonoff mixture weights
  all programs, and programs that continue predicting correctly dominate over time...
  The answer space is rich. Good.


