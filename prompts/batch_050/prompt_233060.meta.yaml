  I am an intensivist recently put in charge of rewriting my hospital''s policy on
  the determination of death. The current document is a patchwork... Every week our
  clinicians make these determinations — for withdrawal of life-sustaining treatment,
  and, with much higher stakes, before organ retrieval under the dead donor rule.
  I need a bedside procedure: the ordered steps a physician follows to declare death
  under either the neurologic criterion or the circulatory criterion, what each step
  is checking for, what counts as a sufficient finding, the waiting periods, and who
  must countersign.


  The conceptual demands:

  1. The procedure must keep the two criteria conceptually distinct while being honest
  about what unites them... State explicitly which underlying conception of death
  (loss of integrated functioning of the organism as a whole vs irreversible loss
  of consciousness) each criterion presupposes, and flag any step where the policy
  smuggles one conception into the other''s territory.

  2. Handle the irreversible/permanent distinction properly: DCD determinations rest
  on permanence (circulation will not be restored because we will not attempt it),
  not irreversibility (it could not be restored). The procedure should say where this
  is a value judgment (we decide not to resuscitate) rather than an observation, because
  courts and families will read it as the latter.

  3. Hard cases the procedure must cover: patient on VA-ECMO whose circulation is
  mechanically maintained — the circulatory criterion is unavailable and apnea testing
  may be impossible; a DCD donor whose family asks to shorten the no-touch interval;
  a patient with catastrophic brain injury who retains one ambiguous reflex; a family
  that does not accept death by neurologic criteria.

  4. Worked applications: run the procedure on three cases — straightforward brain
  death after head trauma; a DCD retrieval after withdrawal; and the ECMO case, where
  I expect the procedure to return an answer I will not like (it should tell me that
  whether this patient can be declared dead depends on a decision about what we will
  do, not on a finding about the patient) — and say what a clinician should do at
  that point.

  5. Close with a section on what the procedure cannot do: which questions (how long
  is long enough, whether permanence-as-decision is legitimate before retrieval) are
  choices the policy must own rather than discover.


  Also constraints: usable by a clinician in under an hour at 3 a.m., by someone who
  hasn''t read the philosophy literature, sign-off by two physicians...


