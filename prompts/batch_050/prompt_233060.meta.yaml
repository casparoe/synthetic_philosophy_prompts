  procedure a clinician can run at bedside: what to check, in what order, what tests,
  waiting periods, who signs.

  - Handle hard cases: ECMO (circulation artificially maintained — does circulatory
  criterion even apply?); DCD with the no-touch period and autoresuscitation; the
  irreversible-vs-permanent distinction (DCD relies on permanence — we won''t reverse
  — not irreversibility — we can''t); patient with some brainstem reflex ambiguity;
  a family that doesn''t accept brain death.

