  if after enough reflection people might endorse it — actually wireheading wouldn''t
  survive reflection.

  3. Current preferences matter: the extrapolation should start from me as I am, not
  a generic ideal agent — otherwise whose volition is it?

  4. Aggregation: extrapolate humanity together, not each person separately, because
  individual extrapolations conflict.

  5. Tolerance/pluralism: the extrapolated volition shouldn''t override what people
  currently want in most day-to-day matters; only big things.

  6. Moral uncertainty handled by extrapolation too.


  Genuine tensions:

  - (2) anti-wireheading vs extrapolation: the objection that idealization is path-dependent
  — if idealization is allowed to change preferences arbitrarily, wireheading might
  be endorsed; if you constrain idealization by current values, then your anti-wireheading
  intuition is doing the work, making CEV circular. So commitments "idealized reflection
  is the standard" + "I already know some outcomes are wrong regardless of what reflection
  endorses" are in tension: either idealization is sovereign or it isn''t.

  - (3) start from me vs (4) extrapolate humanity together: extrapolating "humanity"
  requires smuggling in a way of combining people, and the choice of who counts as
  part of the extrapolation base already determines a lot. Also tension: if coherence
  is required, then incoherent current values get "fixed" — but the fixing direction
  is underdetermined by the person as they are.

