  Positions/leaves for the taxonomy:

  1. "Rediscovery" view: EE = EUT with log utility, nothing new.

  2. "Foundation" view: time-average growth is more fundamental than expected utility;
  utility functions are derived, not posited.

  3. "Domain-restricted" view: correct for repeated multiplicative gambles, silent
  elsewhere; not a replacement for decision theory.

  4. "Behaviorally false" view: people don''t maximize growth rates; EE is descriptively
  wrong even if normatively interesting.

  5. "Ergodicity is the wrong concept" view: what matters is absorbing states/ruin,
