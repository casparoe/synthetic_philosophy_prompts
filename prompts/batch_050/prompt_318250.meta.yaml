  some treat it as a refutation of expected utility theory, others as log utility
  wearing a new coat, others as a niche result about repeated multiplicative bets.


  I''m writing a primer for my local meetup and I want a decision tree that sorts
  a reader into a position on this dispute. Requirements:


  - The tree starts from a shared starting point: the reader accepts the arithmetic
  fact that for a multiplicative process, the time-average growth rate equals the
  expectation of the logarithm of the growth factor, and that the ensemble average
  can grow while almost every trajectory shrinks.

  - Each branch node should be a question the reader can answer without knowing where
  it leads — e.g., whether the St. Petersburg paradox is dissolved by considering
  dynamics or only by curving utility; whether a one-shot gamble falls inside the
  theory''s scope and, if not, whether that is a defect; whether risk aversion is
  best understood as a property of preferences or of the payoff structure; whether
  ruin and absorbing states, rather than non-ergodicity per se, are doing the real
  work; whether growth-rate maximization is a normative principle, a descriptive hypothesis,
  or just one objective among many a rational agent might adopt.

  - Leaves should include at least: the "nothing new" view (ergodicity economics is
  expected utility with logarithmic utility, restated); the "new foundation" view
