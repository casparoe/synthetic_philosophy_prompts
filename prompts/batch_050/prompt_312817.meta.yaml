  3. The coin flip: is the probability of heads based on all coin flips ever, or flips
  of this coin, or flips with this exact force/angle? Verdict: "this coin, flipped
  normally" — but not the exact micro-conditions, because then it''s deterministic
  (0 or 1).

  4. Medical: patient with symptoms — use base rate of disease in population vs. in
  people with those symptoms: narrower.

  5. Hard pair: legal case — blue bus problem type: "70% of buses on route are Blue
  Bus Co" — verdict: not enough to find liability against Blue Bus Co, even though
  in insurance cases the same statistical reasoning is fine. That''s a classic tension
