  The argument: something like:


  (1) Chase: coffee tastes worse now; either the taste-quality changed or my evaluative
  response changed — and I cannot tell by introspection which.

  (2) Sanborn: my taste-quality may have gradually shifted and I''d never notice,
  because memory of past qualia can''t be checked against present ones.

  (3) So first-person authority over qualitative character depends on comparing present
  experience with memory or with dispositions, and these comparisons systematically
  underdetermine the facts.

  (4) If two hypotheses about one''s experience cannot be distinguished even in principle
  by the subject, there is no fact of the matter between them. (Verificationist-ish
  step — the key contested premise.)

  (5) Therefore there are no facts of the matter about changes vs. constancies in
  one''s own qualitative states.

  (6) But then nothing distinguishes "my pain is worse today" from "my tolerance is
  lower," etc. — absurd.


  Where does it go wrong? Options: reject (4) — verificationism about the mental;
  distinguish epistemic undecidability from metaphysical indeterminacy; or reject
