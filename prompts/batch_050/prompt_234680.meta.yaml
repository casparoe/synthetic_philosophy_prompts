  ---


  I retired three years ago after four decades as a sensory chemist for a large food
  company, where much of my work involved training and calibrating taste panels —
  the same people tasting the same products month after month, and my job was to know
  when a report of a flavor change reflected the product and when it reflected the
  taster. Since retiring I have been working my way through the philosophy of mind,
  and I recently read Dennett''s essay "Quining Qualia," whose central exhibit — two
  coffee tasters, Chase and Sanborn — describes almost exactly the predicament I managed
  professionally. Chase insists the coffee now tastes worse while suspecting the taste
  itself is unchanged; Sanborn suspects the taste has shifted gradually but can never
  compare present sensation to past sensation directly. Sitting with the case, I assembled
  the following argument, and it disturbs me because it seems to prove something no
  one in my old profession could possibly accept.


  (1) A subject who notices that a familiar taste now seems different cannot, by introspection
  alone, determine whether the qualitative character of the experience has changed
  or whether only her reactive attitudes toward it — her standards, memories, comparisons,
  likings — have changed. (2) Nor can she settle the matter by consulting memory,
  since any recollection of how the coffee used to taste is itself a present experience
  whose fidelity cannot be checked against the past experience it purports to record.
  (3) Therefore there is no procedure, even in principle, by which the subject can
  discriminate between change-in-qualia and change-in-response. (4) Where no procedure,
  even in principle, can discriminate between two hypotheses about a matter, there
  is no fact of the matter as to which hypothesis is true. (5) Hence there is no fact
  of the matter about whether the qualitative character of one''s own experiences
  has changed or remained constant over time. (6) But my entire career — and indeed
  ordinary life — presupposes the opposite: that a panelist''s reports can track genuine
  changes in her experience, that a patient''s claim that the pain is worse today
  means something different from the claim that her tolerance is lower, that the wine
  expert who detects a note she missed last year has learned something about the wine
  rather than merely had her qualia scramble. (7) So something in the argument must
  give, and since (6) is non-negotiable, the trouble lies upstream.


  My own suspicion, formed by years of watching panel data, is that the mischief happens
  somewhere between (3) and (5), but I have not been able to state the objection in
  a form that does not merely beg the question in favor of the tasting-room common
  sense I started with. What I would like from you: identify which step you would
  reject; explain why that step looked acceptable on its own; and price out what rejecting
  it costs — in particular, whether abandoning it forces one toward the view that
  first-person reports of experience are incorrigible, or toward some verificationism
  about the mental that seems no less extreme than the conclusion I am trying to avoid.
  For what it is worth, the claims I would most like to preserve are (6) and the intuition
  behind (1): I do find it genuinely hard, both from the armchair and from thirty
  years of calibration records, to see how a taster could know from the inside which
  sort of change she has undergone. If the argument is valid, tell me which premise
  is cheapest to surrender, and what a defender of qualia — someone who thinks Dennett''s
  target was misconceived from the start — would say differently.


