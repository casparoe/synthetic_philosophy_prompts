reasoning_summary: 'Pick a domain and type. Let''s combine "Construct a thought experiment
  to specifications" with "Lying vs. misleading: is there a moral difference?" — a
  classic topic (Adler, Saul, etc.). The asker persona: non-academic, casual, with
  a typo or two. Short and focused.


  Thought experiment spec: construct a case where lying is morally better than misleading
  (or where misleading is worse than lying) — the opposite of the usual view that
  misleading is less bad. Constraints: realistic, no weird stuff, show what each verdict...
  Actually the standard positions: some say lying is categorically worse (Augustine/Kant-ish),
  others say no moral difference since deception is deception. So the interesting
  spec: build a case where misleading is morally worse than lying, which is hard because
  the usual intuition is the reverse. Also maybe a case where they come apart in each
  direction with same content.


  Good spec: construct a scenario where the very same false proposition gets communicated
  — one version lied, one version merely misleading — and misleading comes out morally
  worse, not better. Constraints: realistic, ordinary conversation, the listener ends
  up with the same false belief in both versions, so the difference can''t be about
  the outcome. Then explain what feature does the work, and how someone who thinks
  there''s no moral difference would attack it.


  Write casually, no citations needed, no quotes. Keep short. Maybe a typo ("alot"
  or "mislead" vs "mislead"). Persona without academic background but thinking on
  their own.'
