  Design a game where individual participation makes no difference to outcome but
  feels wrong — e.g., a classroom game where buying tokens funds a bad outcome only
  at thresholds, individual choices overdetermined, etc.


  Need new/niche injected ideas but not too niche. Complicity literature: Christopher
  Kutz''s "complicitous accountability," participation intentions, Derek Parfit''s
  "mistakes in moral mathematics" (Harmless Torturers, share-of-the-total view vs.
  marginal difference). Also Lepora & Goodin "On Complicity and Compromise" — maybe
  avoid naming. The prompt can inject a mechanism: "threshold public bads" and "causal
  inefficacy."


  Design: workshop for mixed professional audience (e.g., corporate ethics training
  for engineers, 25 people, 90 minutes). Activity: make participants feel that they
  can be complicit in an outcome they didn''t cause — the gap between "I didn''t make
  it worse" and "I''m part of it."


  Idea for the game: a threshold mechanism — e.g., a "collective bid" game. Each round,
  participants privately decide whether to "sign on" to a project. If at least N sign,
  a mildly bad outcome is funded (e.g., donation to a disliked cause, or destruction
  of something trivial like the facilitator shredding a nice poster). When M > N sign,
  each extra signature changes nothing — overdetermination. Participants who sign
  at M ≥ N+1 caused nothing, yet feel implicated. Also add a "pivotal" uncertainty:
  participants don''t know N exactly or don''t know others'' choices, so ex ante each
  has a small chance of being pivotal — then reveal that actually the count was way
  over threshold, and ask the signers whether they feel off the hook.


  Alternative: the "harmless torturers" structure — each person turns a dial by one
  notch, imperceptible per notch, collectively agony. Could stage with something real:
  e.g., each participant adds a grain of rice / a drop of water to a cup balanced
