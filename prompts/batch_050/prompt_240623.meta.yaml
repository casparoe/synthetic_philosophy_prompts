  I have no formal training in philosophy, but I''ve been thinking about a puzzle
  in the law for a while, and I''d like help working out what''s underneath it.


  As I understand it, in most of the English-speaking world there is no general legal
  duty to rescue a stranger. If I walk past a shallow pond, see a child drowning,
  and keep walking because I don''t want to ruin my shoes, I may be a monster, but
  in most jurisdictions I haven''t committed a crime. Yet the exceptions are striking.
  A parent who watches their own child drown in that same pond will be prosecuted.
  So will a lifeguard on duty, or a person who knocked the child in by accident, or
  — in some places — someone who started a rescue and then gave up halfway. Meanwhile,
  the same legal system that refuses to punish the bystander has no trouble saying
  that a parent caused a child''s death by failing to feed her. So the law seems to
  hold that an omission can be the cause of a death in one case and no cause at all
  in another, even when the physical facts — water, lungs, a person standing nearby
  doing nothing — are much the same.


  What picture of causation, or of responsibility, does this pattern actually presuppose?
  Is the law committed to the idea that doing nothing is never a cause of anything
  — that only the pond, and not the bystander, brought about the death — with the
  exceptions carved out on some other basis entirely? Or does it accept that omissions
  can cause outcomes but holds that we only answer for some of what we cause? And
  whichever it is: is the distinction between the stranger and the parent a coherent
  one, or does it smuggle in a notion of "my effects" versus "not my effects" that
  doesn''t survive scrutiny?


  I''d like three things. First, a reconstruction of the implicit theory — what the
  law seems to assume about what it is to cause something, and what it would say causation
  by omission is, if it allows such a thing at all. Second, an honest assessment of
  whether the practice strictly requires that theory or merely sits comfortably with
  it: could someone who thinks omissions are perfectly ordinary causes still defend
  the no-duty-to-rescue rule, perhaps on grounds of liberty, line-drawing, or the
  practical impossibility of enforcing a duty to help everyone? Third, tell me what
  would have to change if the law fully committed to the view that standing by is
  a way of causing a death: would every jurisdiction need something like a general
  duty to rescue, and if so, where could the limits of that duty come from without
  collapsing into the claim that each of us is causally responsible for every preventable
  death in the world — which, as I understand it, is exactly the thought the law seems
  designed to avoid.


