  \nNow the prompt design. Domain: repugnant conclusion and population axiology. Type:\
  \ \"Ask why a debate has stalled and what kind of disagreement it really is.\"\n\
  \nRequirements for the type (from the notes):\n- The asker points to a dispute that\
