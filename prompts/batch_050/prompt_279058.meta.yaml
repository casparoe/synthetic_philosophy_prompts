  - The asker describes the debate and positions concretely, may offer a hypothesis\
  \ presented as hypothesis.\n\nMy prompt sketch (refined):\n\nOpening: describe the\
  \ state of population ethics. Since Parfit's Reasons and Persons (1984), the field's\
  \ output has been dominated by impossibility results — Arrhenius's theorems showing\
  \ no axiology can jointly satisfy weak-seeming adequacy conditions (avoid the Repugnant\
  \ Conclusion, avoid the Sadistic Conclusion, dominance, minimal non-elitism...).\
  \ Every extant axiology is known to imply something its defenders concede is awful.\
  \ The literature has responded with taxonomies of which bullet to bite. Forty years,\
  \ no convergence.\n\nThen the Sidgwick passage: In Book IV, Chapter 1 of The Methods\
  \ of Ethics (1874; I'm using the 7th edition, 1907), Sidgwick considers what utilitarianism\
  \ implies about how far population ought to be encouraged to increase, and remarks\
  \ that the answer is not the point where average happiness is greatest — as he says\
  \ the Malthusian political economists assumed — but the point where the product\
  \ of the number of people and their average happiness is greatest. He spends about\
  \ a page on it and moves on, apparently regarding the matter as settled by the principle\
  \ itself.\n\nThen the asker's hypothesis: For Sidgwick, the population question\
  \ was a theorem — a consequence derived from a principle accepted on independent\
  \ grounds, so there was nothing further to intuit or negotiate about. The modern\
  \ field instead treats intuitions about hypothetical populations as data and axiologies\
  \ as hypotheses tested against them. On this reading the impossibility theorems\
  \ changed what the debate even is: once the \"data\" are provably inconsistent,\
  \ continuing to search for Theory X is like continuing to search for a consistent\
  \ axiomatization of an inconsistent theory; the live disagreement is really about\
  \ method — whether impersonal betterness is a relation our principles determine\
  \ or a relation our intuitions track, whether adequacy conditions are evidence about\
  \ an independent fact or constitutive constraints on the concept, etc. And each\
  \ side reads the theorems as vindicating its own method: one side says reductio\
  \ of the data, the other says proof that betterness is indeterminate/plural.\n\n\
  Questions:\n(i) Is my reading of the Sidgwick passage right — did Sidgwick take\
