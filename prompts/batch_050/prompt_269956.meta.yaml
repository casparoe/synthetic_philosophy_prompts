  allows undermining — chance theory says a future history with different frequencies
  has nonzero chance; conditionalizing on the full chance theory T gives information
  about future frequencies, so PP fails conditional on T. Lewis''s fix: replace with
  P(A | T) = T(A), the "New Principle." So a commitment set could include: PP (original),
  BSA, and that you should conditionalize on everything you know — a real tension
