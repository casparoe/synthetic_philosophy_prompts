  Let me design a belief set:


  (a) Objective chance is real and irreducibly probabilistic laws are possible (indeterminism
  is possible).

  (b) Rational credence must defer to known chance via the Principal Principle, at
  least absent inadmissible information.

  (c) Chances are given by the best-system analysis: the chances are whatever the
  best summary of the total history of events says they are.

  (d) Admissibility is just "information you currently possess" — i.e., you should
  conditionalize on all your evidence, and then PP applies to your updated credences.


  The tension: (b)+(c) — undermining. The best system assigns a chance distribution
