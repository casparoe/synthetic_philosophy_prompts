  Insect sentience/scale argument: a popular science article summary of the argument
  that vast numbers of insects with low probability of sentience dominate expected
  moral value. Subtle misrepresentations: conflating probability of sentience with
  probability of consciousness vs. moral patiency; conflating "expected value" argument
  with claiming insects are definitely sentient; presenting neuron-count heuristics
  as decisive; misstating that the argument says we should prioritize insects over
  humans regardless; mixing up the precautionary principle with expected value maximization.


  Let me draft: A friend or an article summarizes the "scale argument": "If there''s
  even a 1% chance insects are sentient, then given trillions of insects, the expected
  number of sentient insects is enormous, so insects deserve more moral attention
  than the much smaller number of vertebrates. So anyone who takes sentience seriously
  must conclude insect welfare is the top priority." Subtle misrepresentations: (1)
  the argument from expected value assumes moral weight scales linearly with expected
  number and ignores variance/distribution of welfare capacity; (2) conflates probability
  of sentience with expected moral weight — probability of sentience discounts, but
  sentience intensity may differ; (3) presents the conclusion as following from "taking
  sentience seriously" alone, when it also requires welfarism, impartial aggregation,
  and linearity; (4) mischaracterizes critics as denying insects could be sentient.


