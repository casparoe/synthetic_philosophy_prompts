  and must intend to deceive themselves, which seems self-undermining (dynamic/strategic
  puzzle). One person could argue it''s impossible/paradoxical, the other that it
  obviously happens all the time. They could debate cases: the parent who believes
  their child is innocent despite evidence; the smoker who believes "I''ll quit before
  it matters"; conflicting evidence — avowal vs. behavior. One side proposes deflationary
  accounts (bias, motivated reasoning, no intention needed — Mele-style), the other
