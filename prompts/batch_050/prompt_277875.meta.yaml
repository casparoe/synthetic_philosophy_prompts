  I think the Berkeley dialogue is attractive: "Write a dialogue between proponents
  of two opposing views." The asker could be a student in a seminar who wants a dialogue
  for a class assignment between a defender of Berkeley''s master argument and a critic.
  The conceptual content: the master argument claims that to conceive of something
  existing unconceived is contradictory because you conceive of it. The standard realist
  replies: (1) the difference between the object conceived and the conception of it
  — when I conceive a tree existing unconceived, my conceiving is one thing, the tree
  another; (2) the "idea as act vs. object" distinction; (3) appeal to analogous tricks:
  "try to think of an unthought-of thought" vs. "think of a mind-independent object";
  (4) the claim that the argument equivocates on "conceive of X existing unconceived"
  — the content of the thought vs. the object of thought. Also Berkeley''s own response
  to a similar objection (the objection that we can conceive things existing outside
  mind, Berkeley replies in Principles §23). Also the modern literature: the argument
  has been reconstructed as failing because of a confusion between "I conceive that
  X exists unconceived" (de dicto) vs. actually representing X without representing
  it as conceived — the realist says the content of my thought doesn''t attribute
  conceivedness, and that''s fine; being conceived now doesn''t make the tree essentially
  conceived.


  A good dialogue would have both sides press: the idealist presses that any scenario
  you imagine is "observed" by the imagining mind (the "God''s eye view" point), and
  the realist presses that being an object of thought is an extrinsic relation, like
  being photographed doesn''t change the tree. The idealist can press back that "existing
  unconceived" requires a scenario with no mind in it, but any scenario you entertain
  has you in it as spectator. Realist: no — I can entertain a scenario from no point
  of view; the scenario is entertained, but its content doesn''t include a spectator.
  Idealist: content is one thing, but to verify the scenario is possible you need
  to picture it, and picturing always involves a viewpoint. Realist: that confuses
  the vehicle of representation with what''s represented. This is genuinely good back-and-forth
  material.


