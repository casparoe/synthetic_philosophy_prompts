  or expel a member for conduct gravely damaging to the standing of the profession,
  and the complainants say the book''s mere existence qualifies, because the revulsion
  it provokes in readers of good sense is itself an injury the association may not
  license.


  Preparing my opinion, I returned to Jeremy Bentham''s An Introduction to the Principles
  of Morals and Legislation, ch. II, where Bentham distinguishes two ways a principle
  may diverge from utility:


  "A principle may be different from that of utility in two ways: 1. By being constantly
  opposed to it: this is the case with a principle which may be termed the principle
  of asceticism. 2. By being sometimes opposed to it, and sometimes not, as it may
  happen: this is the case with another, which may be termed the principle of sympathy
  and antipathy."


  Draft the written opinion I will circulate before our vote: a concrete recommendation
  (censure, expel, or dismiss the complaint) with the reasoning the committee can
  act on. The opinion must take seriously the strongest version of the complainants''
