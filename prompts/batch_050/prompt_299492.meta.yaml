  Aggregation problem for contractualism: Scanlon''s individualist restriction — contractualism
  rejects aggregating small harms across many people to outweigh a large harm to one.
  Standard cases: the case of saving one person from death vs. curing many people''s
  headaches; the World Cup case (from Scanlon''s What We Owe to Each Other). The "relevance"
  requirement, "separate complaints" principle, tie-breaking, "aggregationist intuitions"
  in rescue cases (save the greater number), Taurek''s "Should the Numbers Count?",
  Scanlon''s discussion, and subsequent work: Otsuka, Kamm, Voorhoeve, Doggett, "partially
  aggregative" views, "relevant claims," "irrelevant goods."


  A desiderata-type prompt: "Before I read more proposed fixes to contractualism''s
  aggregation problem, give me the desiderata any adequate modification must meet..."
  Include cases: headache-vs-death case, rescue cases (save one vs. save five), tie-breaking
  cases, cases with differing probabilities, very large numbers (population-level),
  tiny probabilities × huge numbers. Requirements: individualist restriction respected
  (complaints from individuals), no summing of trivial harms to outweigh serious harms,
  but still allow numbers to count in like-for-like cases; explain the discontinuity;
  handle weighted lotteries; handle interpersonal comparisons; not collapse into consequentialism;
  handle claims of different strength; handle the "relevance" problem.


  Should be 1-3 paragraphs, formal, elaborate, with epistemic request (say what would
  change its mind / where reasoning most likely to fail) and machine-readable final
