reasoning_summary: 'Let me pick a domain and type. Type: desiderata of a theory. Domain:
  democratic backsliding — what counts, who decides, is the concept more than a partisan
  label. That combines well: "write the desiderata a concept/measure of democratic
  backsliding must meet."


  The prompt should be in the weeds but self-contained, not requiring niche facts.
  No verbatim quotes needed. Write formally.


  Key desiderata to hint at: (1) must distinguish backsliding from ordinary policy
  change within democracy (substance vs. procedure); (2) must identify a baseline
  — backsliding relative to what; (3) must handle gradualism vs. coups (incremental
  erosion vs. sudden rupture); (4) must be measurable/operationalizable without circularity
  (avoid defining democracy by policy outputs one likes); (5) must not collapse into
  a partisan label — symmetrical application across left/right; (6) must handle hybrid
  regimes and the question of whether backsliding presupposes the regime was ever
  fully democratic; (7) must deal with the index problem (V-Dem, Freedom House codings
  are expert judgments — who decides?); (8) must distinguish legal-but-democratically-corrosive
  acts from illegal ones (lawful backsliding via court packing etc.); (9) must accommodate
  disagreement about which institutions are constitutive of democracy (courts? media?
  election administration?); (10) who gets standing to judge — citizens, courts, international
  bodies, scholars.


  Also jointly unsatisfiable subsets: e.g., maximal objectivity (neutral coding rules)
  + capturing first-of-their-kind maneuvers (novel erosion tactics evade checklists);
  symmetry/neutrality + sensitivity to whether a policy change actually threatens
  democratic competition; treating citizen judgment as authoritative + the fact that
  citizens often don''t perceive erosion (polarization).


  The asker could be writing a syllabus or designing a measure, or refereeing. Fix
  a purpose: e.g., "a concept usable for a cross-national research project / an undergraduate
  course / an index." The type notes say asker can fix the purpose. Good: "I''m designing
  a module... before I assign the literature, I want to know what a workable concept
  of democratic backsliding has to do."


  Include examples: court packing, media capture, electoral rule changes, term limit
  manipulation, emergency powers. Mention Hungary, Poland, Turkey, US as candidate
  cases. But keep it so the model doesn''t need facts — just ask to use stylized cases.


  Also ask: which desiderata are non-negotiable vs. camp preferences; flag jointly
  unsatisfiable subsets; briefly score main contenders (minimalist electoral definition,
  liberal-democratic thick definition, disaggregated/institution-by-institution approaches,
  citizens'' perception measures).


  Write the prompt only.'
