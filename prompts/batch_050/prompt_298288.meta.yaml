  Letter Spirit (Hofstadter) is fairly well-known conceptually; the activity design
  could be: participants each draw the "same" letter in different styles, try to write
  a rule that captures all and only a''s, and discover the rule fails. This makes
  participants feel the force of the problem of what makes an ''a'' an ''a'' — the
  essence of a letterform, style as a role. This is nice and "in the weeds" without
  requiring niche facts.


  Persona: someone without academic background, formal/polished, elaborate prompt,
