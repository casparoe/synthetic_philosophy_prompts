  \ \"knew more, thought faster\" involves value-laden choices.\n\nHmm, CEV is somewhat\
  \ niche but the prompt can inject the idea itself — the instructions say \"you'll\
  \ often have to inject some sort of new / niche ideas into the prompt.\" So the\
