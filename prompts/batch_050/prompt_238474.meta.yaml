  \ me think about which domain would give the most interesting tensions.\n\nOption\
  \ A: Norms of assertion + commitments type. The asker could hold something like:\
  \ (a) the knowledge norm of assertion (you should assert only what you know), (b)\
  \ that it's sometimes proper to assert in contexts of practical reasoning even when\
  \ you don't strictly know (e.g., \"I'll be there at 8\" when trains are unreliable),\
  \ (c) that Moore-paradoxical assertions like \"p but I don't believe p\" are defective,\
  \ (d) that lotteries show something... Let me think about genuine tensions.\n\n\
  Actually, a classic tension: knowledge norm + \"it's fine to assert what you have\
  \ good evidence for but turns out false\" — wait, knowledge is factive, so if you\
  \ assert p on good evidence but p is false, you didn't know p, so you violated the\
  \ knowledge norm. But intuitively you're blameless. So the person could hold: (a)\
  \ knowledge norm, (b) some assertions are blameless even though the speaker didn't\
  \ know (reasonable false belief cases). That's a genuine tension — the standard\
  \ response is to distinguish primary vs. secondary propriety, or objective vs. subjective\
  \ norms. That could be the \"apparent tension that dissolves\" or the genuine one\
  \ depending on how it's set up.\n\nAnother one: knowledge norm of assertion + flat-out\
  \ assertion in practical reasoning (\"The keys are in the drawer\" as basis for\
  \ action). \n\nOption B: Indicative vs. counterfactual conditionals + commitments\
  \ type. Commitments could be: (a) indicatives are epistemic, counterfactuals are\
  \ metaphysical; (b) \"If Oswald didn't kill Kennedy, someone else did\" (indicative,\
  \ plausible) vs. \"If Oswald hadn't killed Kennedy, someone else would have\" (counterfactual,\
  \ dubious) — the Adams pair; (c) modus ponens is unrestrictedly valid; (d) some\
  \ view about conditional excluded middle or about might-conditionals... \n\nTension:\
  \ McGee's counterexamples to modus ponens. Someone who accepts the standard treatment\
  \ of indicatives (e.g., Stalnaker-style or Lewis's triviality result) might face\
  \ tension with unconditional modus ponens. Or: believing that indicative conditionals\
  \ express high conditional probability (the Ramsey test / Adams thesis) + believing\
  \ conditionals are propositions with truth conditions. Lewis's triviality result\
  \ shows that if P(if A then C) = P(C|A) generally, conditionals can't be ordinary\
  \ propositions. That's a real tension — but is it too \"in the weeds\"? Actually\
  \ it's decently well-known among people who've studied conditionals. But maybe too\
  \ technical/obscure for a casual prompt.\n\nOption C: Animal ethics + predict/recommend\
  \ type. E.g., a friend's verdicts on eating various animals, or a committee's decisions.\
  \ E.g., \"My friend thinks: factory farming is wrong, but eating roadkill is fine;\
  \ she's OK with eating oysters but not shrimp; she thinks hunting deer for population\
  \ control is permissible but not for trophies...\" Then ask about a new case: lab-grown\
  \ meat, or eating a pet pig that died naturally, or bivalves raised in farms. The\
  \ task: identify candidate rules (sentience-based, capacity-based, convention-based),\
  \ see which fit, predict the verdict on the new case.\n\nOption D: Coherent extrapolated\
  \ volition + commitments type. This is a more niche domain — CEV comes from Yudkowsky.\
  \ The person could hold: (a) morality should be based on what we'd want if we knew\
