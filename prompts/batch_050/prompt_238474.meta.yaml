  \ justification-based norms (reasonable belief / justification). Key phenomena:\n\
  - Knowledge norm is factive: if p is false, you didn't know it, so you violated\
  \ the norm — but the speaker might seem blameless (unlucky case). The standard fix\
  \ (Williamson, DeRose): distinction between the norm and blamelessness — you can\
