  Craft an argument that seems to prove too much about reflective equilibrium. Classic
  critiques: RE just ratifies existing intuitions (conservatism), coherence is truth-insulating,
  garbage in garbage out, wide vs narrow equilibrium. Build a numbered argument: if
  RE is justified as a method because it produces coherence, then any sufficiently
  coherent set of beliefs is justified; coherent sets can be constructed around any
  starting prejudices; therefore RE licenses any prejudice; also science itself becomes
  optional... Conclusion absurd: RE is worthless / astrology could be justified.


  Let me write premises that seem plausible:

  (1) A method of justification is only legitimate if applying it correctly can take
  you from a position you should abandon to one you should adopt (error-correcting).

  (2) Reflective equilibrium starts from considered judgments and revises them only
  to achieve coherence with principles.

  (3) Coherence is a relation among beliefs; it doesn''t favor any content over another
  — for any consistent starting set, there''s a coherent equilibrium containing most
  of it.

  (4) So applying RE correctly to a set of false but mutually supporting judgments
  leaves most of them in place.

  (5) So RE cannot correct systematically false starting points — e.g., someone raised
  with confident judgments that some races are inferior.

  (6) A method that cannot correct such judgments fails the test in (1).

  (7) Therefore RE is not a legitimate method of justification — and since it''s the
  standard method in ethics and much of philosophy, those fields lack legitimate method.


  Conclusion proves too much (7). Where does it go wrong? Answer considerations: premise
  (3) overstates — wide equilibrium includes background theories, can force revisions;
  premise (1) too strong a test (no method passes it a priori; even logic/science
  can''t bootstrap from scratch); the conservatism objection vs. reply that RE is
  dynamic and input judgments are defeasible; also step from "RE can''t guarantee
  correction" to "illegitimate." Ask for committed diagnosis: name the weakest step
  and price the alternatives.


  Ask: keep it short, formal, committed response requested, no citations. The asker
  may say which they''d rather keep: they''d rather keep (1)-style test than give
  up on moral philosophy.


  Write the prompt.'
