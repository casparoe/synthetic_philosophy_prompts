  Next month I am presenting a paper at a two-day workshop in history and philosophy
  of science, and I want to be ready for the question period. My thesis: Imre Lakatos''s
  methodology of scientific research programmes, taken together with his claim that
  methodologies can themselves be appraised by how much of actual history they reconstruct
  as rational, survives the two standard charges that have pushed most historians
  away from it — the charge that its rational reconstructions are history with the
  facts corrected to fit the philosophy, and the charge that the progressive/degenerating
  distinction can only ever be applied retrospectively and so gives no guidance at
  the moment a scientist or funder must actually decide. I argue that the retrospective
  application is a feature rather than a defect (methodological verdicts are supposed
  to be revisable as the record grows), that a suitably specified notion of novel
  fact, along the lines Zahar proposed, makes progressiveness checkable without waiting
  for the dust to settle, and that Lakatos''s meta-criterion for comparing methodologies
  is not viciously circular because the historical episodes used as test cases are
  fixed by near-universal verdicts (the Copernican revolution, the chemical revolution)
  rather than by the methodology under test.


  The audience: roughly fifteen people. The core is contextualist historians of science
  — people trained to distrust any Whiggish retelling and to treat actors'' categories
  as primary — and they will have read the case-study literature showing that the
  heroes of rational reconstructions behaved nothing like the reconstructions say.
  There are two sociologists of scientific knowledge of the strong-programme persuasion,
  for whom the very project of rationally reconstructing theory choice is the mistake.
  There are three formal philosophers of science, all broadly Bayesian, who will grant
  Lakatos his historical points and then ask what the machinery buys that confirmation
  theory does not. And there is one senior historian of physics who knew the earlier
  literature and tends to ask the question everyone else was circling.


