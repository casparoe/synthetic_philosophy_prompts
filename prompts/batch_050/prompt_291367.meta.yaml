  Actually the cases type: give verdicts on concrete function ascriptions and ask
  for a principle. E.g.:


  - The heart''s function is to pump blood, not to make thumping noises (even though
  it reliably does both).

  - A mutant heart that pumps but also... hmm.

  - The kidney of a fish in poisoned waters...

  - A token organ that never performs (e.g., a heart that never pumped because the
  organism died at birth) — still has the function of pumping? Verdict: yes.

  - Swampman-style: a molecule-for-molecule duplicate of a heart formed by lightning
  — verdict: no function? Or yes?

  - Vestigial appendix?

  - The nose supports glasses — not its function.

  - A gene that spread by drift?

  - Artificial items: a screwdriver''s function — causal-role handles artifacts poorly
  or well?

  - The liver in a diseased organism malfunctioning — causal-role says its function
  is whatever it currently does (contributing to illness?), that seems wrong.


  This is a classic tension: etiological theory says function = selected effect; causal-role
  (Cummins) says function = causal contribution to a capacity of a containing system.
  Cases where they diverge: vestigial traits, novel beneficial traits not selected
  for, artifacts, dysfunctional organs.


  Write as a student in philosophy of biology course. Give verdicts on ~6-7 cases
  with at least one hard-to-reconcile pair. Ask for a principle (or candidates), what
  it predicts for unconsidered cases, which verdicts must be dropped. Plus structured
  data request: a table with columns (case, verdict under principle, ...) or JSON.


  Cases:


  1. The heart pumps blood and makes noise; its function is pumping, not noise — both
  accounts agree.

  2. A baby born with a heart defect where the heart never once pumped: still the
  heart''s function is to pump; it''s malfunctioning, not functionless. (Etiological
  gets this; naive causal-role struggles.)

  3. Swamp-organ: a lightning strike assembles a molecule-for-molecule heart duplicate
  that pumps blood in a swamp-creature: my verdict — it does pump, but I''m inclined
  to say pumping is its function... actually classic intuition split. Make it the
  contested case.

  4. The nose holds up glasses: reliably does, not its function.

  5. The appendix in humans: verdict — it has no function (or does it? immune/gut
  flora reservoir findings). Say: I''m inclined to say it has no function now, though
  it once did — or keep it as contested.

  6. A spontaneous mutation in a bacterium that lets it digest a new chemical, first
  generation, before any selection: causal-role says that''s its function; etiological
  says not yet (no selection history). My verdict: it feels like the enzyme''s function
  is to digest it... contested.

  7. A machine part: the function of the spare bolt in a bridge... artifacts — causal-role
