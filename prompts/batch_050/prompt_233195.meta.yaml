  was that rights are made by law and nothing else: no legislator, no right, just
  people loudly wanting things. Talk of rights that exist before or above the law
  struck him as empty — his verdict on natural rights was that they''re nonsense,
  famously nonsense balanced up on stilts — and worse than empty, since anyone can
  dress up any demand as an imprescriptible right and refuse to compromise.


