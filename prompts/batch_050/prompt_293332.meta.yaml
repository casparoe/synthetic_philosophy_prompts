  Let me draft the Moloch one with cases: race to the bottom. Cases with verdicts
  "this is a Moloch trap / not":


  - Scientists cutting corners on rigor to publish first: trap.

  - Companies lowering wages because competitors do: trap? or just competition?

  - Arms race: trap.

