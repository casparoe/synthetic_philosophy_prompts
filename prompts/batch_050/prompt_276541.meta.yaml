  I think the Löbian "proves too much" is strong and distinctive. Let me construct:


  Argument (from an alignment researcher):

  (1) A trustworthy agent must be able to check that its own reasoning is sound before
  acting on it (otherwise it might act on a proof of a false claim).

  (2) Checking that its reasoning is sound means proving, in its own formal system
  T, the soundness schema: if T proves φ, then φ — or at least □_T φ → φ for each
  φ.

  (3) By Löb''s theorem, T proves □φ → φ only if T already proves φ; so a consistent
  T cannot prove its own soundness schema.

  (4) So no formal agent can ever check its own reasoning.

  (5) Therefore no formal agent can be trustworthy — self-verifying AI is impossible.


  Where it goes wrong: (1)–(2) slide. An agent doesn''t need to prove its own soundness
  to act; it just follows its proof rules. Trusting □φ→φ as an inference rule (accepting
  φ whenever you derive □φ) is different from proving the schema. Actually there''s
  subtlety: adding the rule "from □φ infer φ" is conservative-ish... Also (2) over-reads:
  soundness of T is much stronger than what the agent needs; the agent can trust a
  weaker subsystem, or use a tower of theories (Tarski-style), each trusting the one
  below. The real Löbian obstacle is narrower: an agent can''t trust that an exact
  copy of itself only proves true things, which bites in scenarios like verifying
  a successor agent''s proof before delegating. Also (1) is dubious: trust doesn''t
  require proof. The cost of rejecting (1): you need an account of warranted trust
