  I''m drafting a short position paper for a graduate seminar on conditionals, and
  before I commit to it I want an audit of whether my views are jointly tenable. Here
  is the position as I currently hold it:


  1. The distinction between indicative and subjunctive (counterfactual) conditionals
  is a genuine semantic divide, not a superficial matter of grammatical mood. The
  standard Oswald/Kennedy pair — where the indicative version of the conditional about
  Kennedy''s assassination strikes nearly everyone as acceptable and the subjunctive
  version as doubtful or false — shows that the two constructions are evaluated against
  different things: roughly, the speaker''s available information in the first case,
  and how the world would have gone in the second.


  2. Linguistic meaning is compositional: the semantic value of a complex sentence
  is determined by the semantic values of its parts and the way they are combined.


  3. Indicative conditionals are truth-apt. They express propositions that are simply
  true or false, and their truth values do not vary with who is speaking or what the
  speaker happens to know.


  4. The acceptability of an indicative conditional goes by the conditional probability
  of the consequent given the antecedent; and I want this to be more than a pragmatic
  observation — whatever proposition an indicative expresses, the probability of that
  proposition''s being true should equal the conditional probability.


  5. Subjunctive conditionals are to be evaluated by similarity among possible worlds:
  a counterfactual is true just in case its consequent holds at the worlds most similar
  to actuality in which its antecedent holds.


  6. At least some conditionals with impossible antecedents are substantive. Disputes
  about, say, what would follow arithmetically if a particular well-known conjecture
  turned out to be false have correct answers — some such conditionals are true, others
  false — and the disputants are not all talking vacuously.


