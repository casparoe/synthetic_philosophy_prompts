  Good combos:

  - Satisficing + slogan: "Don''t let the perfect be the enemy of the good" — precisify
  what claims satisficing makes. Or Herbert Simon''s "a wealth of information creates
  a poverty of attention" — but that''s a real quote from Simon; attribution risk.
  The proverb "the perfect is the enemy of the good" is commonly attributed to Voltaire
  but I can leave it unattributed as a proverb.

  - Unions + slogan: "an injury to one is an injury to all" — IWW slogan, well known;
  could precisify.

  - Probability estimate type + imprecise probabilities: credence that imprecise credences
  are rationally required/permitted — nice self-referential prompt: give a sharp credence
  that imprecise probability is the right model... That''s cute but maybe too cute;
  actually could be great: "What''s your credence that rational agents sometimes ought
  to have imprecise credences? Give me a sharp number, decomposed." That''s a nice
  tension — demanding a sharp credence about whether sharp credences are adequate.
  Decompose into sub-questions: whether the Dutch book / accuracy arguments extend,
  whether decision-making requires determinacy, whether dilation is problematic, etc.

  - Historical episode + satisficing: analyze, say, the 2008 financial crisis or New
  Coke through bounded rationality. Or analyze the 1981 PATCO strike through lens
  of right to organize. PATCO is well known: Reagan fired striking air traffic controllers.
  Could analyze through the theory of the right to strike / essential services. Facts
  are common knowledge-ish for US labor history; small models might know it.

  - Space colonization + slogan: "Earth is the cradle of humanity, but one cannot
  live in a cradle forever" — attributed to Tsiolkovsky; attribution risk, commonly
  quoted. Could leave unattributed: "space people say..."


  The user says pick whichever type combines best. The probability-estimate type with
  imprecise probabilities is elegant and self-referential, forcing the model to confront
  the tension. Also the slogan type with satisficing is good: "the perfect is the
  enemy of the good" dissected via satisficing vs maximizing.


