  ---


  I am a doctoral candidate in philosophy of mind, and for a chapter on the status
  of functionalism I am putting together a catalogue of the standard objections, organized
  by which commitment of the theory each one attacks. My list so far:


  1. Absent qualia. A system could instantiate the full functional organization of
  a human being — Block''s homunculi-head simulation run on the population of China
  — while having no phenomenal experience at all; so functional organization does
  not suffice for consciousness.

  2. Inverted qualia. Two systems could share a functional profile while differing
  in what their experiences are like, so functional organization does not fix phenomenal
  character.

  3. Triviality of realization. Searle''s wall and Putnam''s rock: suitably generous
  mapping rules let almost any physical system be described as implementing almost
  any program, so realization threatens to be cheap and functionalism to attribute
  mentality everywhere or nowhere.

  4. Chauvinism and liberalism at the grain of description. Functional descriptions
  fixed too finely exclude genuinely minded creatures (Martians, octopuses); fixed
  too coarsely they include systems no one wants to count. Block''s dilemma.

  5. Content underdetermination. Causal and functional roles do not pin down intentional
  content; the same internal organization is compatible with indefinitely many interpretations,
  so functionalism inherits the indeterminacy rather than resolving it.

  6. The causal-heterogeneity objection to multiple realizability. If pain in humans
  is realized by C-fiber firing, in octopuses by something else, in Martians by something
  else again, then (on Kim''s line) the multiply realized property is at best a disjunction
  of heterogeneous causal bases, and the special-science kind the functionalist wanted
  to save is not a genuine kind at all; Shapiro''s response, that significant multiple
  realization is rarer than advertised, concedes the pressure.


  I believe this list covers the canonical material. What I want from you is one further
  objection to functionalism that is not on it — and not a rewording, special case,
  or combination of the above. In particular, it should not be another qualia-based
  intuition pump (1–2), another case of promiscuous realization (3), another point
  about the grain of functional description (4), another indeterminacy-of-content
  argument (5), or another argument that realization bases are causally disunified
  (6).


  For the objection you propose, please: (i) state it precisely enough that I can
  see which commitment of functionalism it targets (the sufficiency of functional
  organization for mentality, its necessity, the autonomy of functional kinds, or
  something else); (ii) give the best functionalist reply you can construct, and say
  honestly whether the objection survives it; and (iii) situate it relative to the
  items on my list — does it presuppose that any of them fails, would it still have
  force if all six were defeated, and does it transfer to psychofunctionalism or only
  to the commonsense variety?


