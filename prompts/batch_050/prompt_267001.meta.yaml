  become easier or harder to achieve than under the baseline.


  3. Reversibility excuses: an agent that fully undoes its changes has, on net, had
  no impact and should incur no penalty.


  4. A correctly penalized agent should still be directable to useful, irreversible
  everyday work -- making coffee, driving someone to the airport -- without grinding
  to a halt or needing task-by-task exemptions.


  5. None of this requires specifying what humans actually value: the penalty can
  be defined entirely over a sufficiently broad sample of arbitrary, non-human goals.


