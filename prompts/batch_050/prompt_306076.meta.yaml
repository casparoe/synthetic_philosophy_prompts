  Superrationality (Hofstadter) is well-known enough. A concrete situation: a PhD
  student facing a repeated coordination problem — e.g., whether to contribute to
  a group project, or one-shot prisoner''s dilemma-ish scenario like deciding whether
  to bother cleaning shared lab kitchen, or a grant application where everyone reasons
  alike. Superrationality''s key idea: reasoning that others similar to you will reach
  the same conclusion, so in symmetric one-shot situations you should cooperate even
  without causal influence.


  Concrete situation prompt from a PhD student: e.g., a conference where all attendees
  decide whether to submit to a new journal / whether to cite a preprint server...
  Better: the classic — everyone in the department decides whether to attend a weekly
  colloquium; if everyone skips, colloquium dies. A grad student wonders whether their
  own attendance is pointless since their single attendance doesn''t determine the
  outcome, but notes everyone is reasoning the same way. That''s the voter/voting
  paradox shape like the example though — the example used voting. Too similar to
  the example''s opening (single vote never decides outcome). The instruction says
  don''t reuse the example''s opening/wording/structure, but type-wise a different
  situation is fine. Still, pick something less voting-like: maybe a one-shot anonymous
  collaboration, or a prisoner-dilemma-like situation with a twin/clone: e.g., two
  co-authors dividing work, or a decision about whether to defect in an anonymous
  one-shot interaction with someone from the same program trained by the same advisor
  — the symmetry of reasoning makes superrationality salient. Actually a nice one:
  academic citation cartel? Or: deciding whether to leave a tip at a restaurant in
  a foreign city they''ll never revisit — no, that''s not symmetric reasoning.


