  Prompt idea (surprise exam, construct-to-specs):


  "Design a two-character scenario — not set in a school — that reproduces the logical
  structure of the surprise examination paradox with exactly three candidate days,
  satisfying: (1) the announcement is made by someone who both knows the schedule
  and has every reason to be believed, so that distrust of the announcer is not an
  available escape; (2) the announced event is one the protagonists have prudential
  reason to predict (so the reasoning actually matters to them, and their failure
  to predict has a cost); (3) the event in fact occurs on the middle day, and the
  protagonists are genuinely surprised; (4) the scenario makes explicit whether the
  protagonists retain, on each morning, knowledge of the announcement itself. Then:
  (a) run the elimination argument day by day exactly as the protagonists would; (b)
  identify the first step at which it fails and say which premise fails — distinguishing
  (i) the premise that they will still know the announcement to be true on the final
  morning from (ii) the premise that knowing the announcement is true is compatible
