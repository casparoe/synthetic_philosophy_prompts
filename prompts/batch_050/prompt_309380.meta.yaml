  (e) Computationalism about the mind is the best working hypothesis.


  Tension: (b)+(c) undermines the argument, since if the brain is a computable physical
  system, it''s a Turing machine; the Gödelian argument''s key move requires that
  we know we''re consistent/sound, which is precisely what''s in dispute. If (d) is
  accepted, then the "we can see the Gödel sentence is true" move fails, because seeing
  its truth presupposes our own consistency. Also apparent tension: between (b) and
  (d) — actually dissolvable if (b) is about idealised mathematical competence vs
  actual performance.


