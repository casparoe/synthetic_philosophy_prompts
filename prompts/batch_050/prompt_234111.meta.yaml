  "Last night I had a long argument with a friend about the Judy Benjamin problem,
  and we reached an impasse over what exactly is learned from a conditional. Consider
  a deliberately stripped-down version. A drone is in one of four equally likely cells:
  dry-north (DN), dry-south (DS), wet-north (WN), or wet-south (WS). A scrupulously
  reliable monitor transmits, ''If the drone is in the wet region, it is in the north.''
  Interpretation A treats the sentence as a material conditional, true in DN, DS,
