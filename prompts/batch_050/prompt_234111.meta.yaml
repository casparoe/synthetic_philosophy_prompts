  W)=1, imposed while leaving P(W) at its prior value of 1/2. My friend says B is
  the rational update because the message contains no evidence about whether it is
  wet; I say that unless we know the monitor''s policy for speaking, the words alone
  do not determine any Bayesian update. Please explain the conceptual issue at a gut
  level, not merely name the standard positions. In particular: (1) give theposterior
  under interpretation A; (2) give the posterior under interpretation B and show exactly
  which probabilities change; (3) explain why those updates answer different questions
