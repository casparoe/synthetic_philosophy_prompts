  a state is A-conscious if its content is poised for use in reasoning, report, and
  the rational control of action. Block''s point is that the two can come apart: a
  state could be P-conscious without being A-conscious, as in cases where you have
  an experience you can''t report.


  Global workspace theory (Baars, later developed neurally by Dehaene) holds that
  a content becomes conscious when it is broadcast from a workspace to a wide range
  of consumer systems — memory, language, decision-making. This maps most naturally
  onto A-consciousness: broadcast is exactly a matter of making a content available
  for report and reasoning. So GWT is best understood as a theory of access consciousness,
  and it leaves the hard problem of phenomenal consciousness untouched, as Block argues.


  The Sperling experiments: subjects see a grid of letters for a fraction of a second.
  They can report almost all of them immediately after, but the memory fades within
  a second, so if you cue them after a delay they can''t. Block takes this to show
  that phenomenal consciousness overflows access: subjects had a specific visual experience
  of all twelve letters but could only access a few. This proves that P-consciousness
  is richer than A-consciousness, and therefore that theories like GWT, which identify
  consciousness with broadcasting, are false, since the unreported letters were conscious
