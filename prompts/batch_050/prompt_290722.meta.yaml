  Let me design: Spinoza necessitarianism disagreement. Two friends reading about
  Spinoza. One argues: if everything follows necessarily from God''s nature, then
  the intellectual love of God (amor Dei intellectualis) is just self-love of the
  universe — or that emotions like love require the possibility of alternatives; you
  can''t love what couldn''t be otherwise? Actually you can love necessities. Better:
  disagreement about whether Spinoza''s view leaves room for the intellectual love
  of God to be an achievement/virtue. If everything is necessitated, then whether
  I attain intellectual love is determined, so praising it as the highest good seems
  empty — like praising rain for falling. Other side: love in Spinoza is joy accompanied
  by the idea of a cause; understanding necessity increases joy; the love is directed
  at God as the immanent cause; determinism doesn''t undercut joy or love.


  Also could do Aristotle: disagreement about whether Aristotle''s critique of usury/money-making
  (chrematistics vs oikonomia) applies to modern finance/interest. One friend: Aristotle
  condemns money breeding money as unnatural, so charging interest is wrong. Other:
  Aristotle''s worry is about unlimited acquisition vs. natural limits of household
  need, not interest per se; modern lending is productive. The commensurability function
  of money in NE V.5 — money makes goods commensurable. Disagreement could be: does
  Aristotle think money is a mere convention (nomisma by agreement) and therefore
  exchange value is arbitrary, or does he think exchange must reflect real proportional
  equality of need/demand?


  I think Spinoza is juicy. Let me craft a few rounds:


  Friend A (Maya): necessitarianism destroys the point of the intellectual love of
  God. Spinoza presents it as the highest human good and the path to freedom, but
  if whether I attain it is as necessitated as everything else, then recommending
  it is like recommending that water flow downhill. Ethics requires alternatives.


  Friend B (Daniel): A confuses causal determination with compulsion. For Spinoza
  you''re free when you act from your own nature with adequate understanding; the
  intellectual love is precisely the state of understanding why things are necessary,
  and that''s a real change in you even if it was necessitated. Also love for Spinoza
  is just joy with the idea of its cause — since God is the cause of everything, understanding
  anything adequately produces love of God; no alternatives needed.


  Round 2: Maya: but then the love of God can''t be mutual — Spinoza himself says
  God doesn''t love anyone back (no joy/passive affects in God), and he even says
  he who loves God cannot strive that God love him in return. So it''s a strange one-way
  love, and calling it the highest good is cheating — it redefines love into something
  cold. Also if God is the cause of everything including evil/suffering, loving God
  means loving the cause of your suffering.


  Daniel: reciprocity objection misunderstands — intellectual love of God is part
  of the infinite love with which God loves himself, so in loving God the mind participates
