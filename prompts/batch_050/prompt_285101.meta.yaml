  as property of the process, not the string). Also the lottery 1-2-3-4-5-6 case:
  same probability as any draw but feels non-random — a Kolmogorov account can explain
  via description-length relative to a reference class.


  Structure: asker reports verdicts, asks for principle, asks what principle says
  about edge cases, which verdict must be dropped, committed answer, format as exactly
