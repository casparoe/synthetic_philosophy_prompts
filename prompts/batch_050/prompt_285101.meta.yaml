  - No citations/bibliographies. No verbatim quotes needed — I can avoid quotes entirely.


  Cases for the verdicts:

  1. A sequence of 100 coin flips, all heads — feels non-random.

  2. The first 100 digits of pi (in binary or decimal) — feels non-random even though
  it passes frequency tests.

  3. A genuinely flipped sequence that happens to alternate HTHTHT... — non-random.

  4. A typical jumbled sequence from actual coin flips — random.

  5. A string generated by a pseudorandom number generator with a short seed — hmm,
  feels non-random in some sense but passes tests; hard case.

  6. The winning lottery numbers 1,2,3,4,5,6 — feels non-random but has same probability.

  7. A sequence from radioactive decay that happens to encode the ASCII of "hello"
