  I''m a high school senior putting together a presentation on Simpson''s paradox
  for our statistics club, and I''ve written down the positions I want to defend.
  Before I present, I''d like to know whether they actually hang together:


  1. The central lesson of Simpson''s paradox is that when pooled and disaggregated
  data disagree, the disaggregated figures are the ones a rational decision-maker
  should generally follow.

  2. Given enough data, which variable to disaggregate by is itself a question the
  numbers can answer; you do not need to bring in outside assumptions.

  3. Simpson''s paradox is exactly why I''m persuaded that purely observational data
  can never settle causal questions — some background knowledge about what causes
  what is always required.

  4. Two cases could have numerically identical tables and still warrant opposite
  advice — follow the split in one, the pooled figures in the other — provided the
  stories behind the numbers differ; I don''t regard that as inconsistent.

  5. A well-conducted randomized trial, unlike an observational study, could settle
  which of two treatments is better without any such background assumptions.


