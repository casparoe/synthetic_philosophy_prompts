reasoning_summary: 'I need to pick a domain and type. Let me pick "Epistemic closure
  and Nozick''s tracking theory" — rich material: closure principle, Nozick''s sensitivity
  conditions, tracking, knowledge as counterfactual tracking, the objection that tracking
  denies closure, abominable conjunctions, Dretske vs Nozick, methods/relevance of
  methods (Nozick''s appeal to methods), skepticism, lottery, etc.


  Type options: interview questions for a guest; fairness audit of a summary; slogan
  precisification.


  Good combos:

  - Interview with an unnamed defender of Nozick''s tracking theory — press where
  the literature presses: denial of closure, abominable conjunctions ("I know I have
  hands but don''t know I''m not a handless brain in a vat"), methods problem (sensitivity
  is method-relative), the grandmother case / trash chute case showing sensitivity
  is too strong, trace tracking for necessary truths, knowledge of necessary truths
  problem. Ask for questions with follow-ups keyed to likely replies.

  - Slogan type: "knowledge is closed under known entailment" — could ask for precisification.
  That''s also nice: the slogan "you can''t know you have hands without knowing you''re
  not a brain in a vat" or "closure". Slogan: "Knowledge is closed under competent
  deduction." Readings: single-premise closure, multi-premise closure, closure under
  known entailment, closure under believed entailment, principle about justification
  transmission... verdicts. That''s decent but maybe less "in the weeds."

  - Summary fairness audit: someone summarizes Nozick''s tracking as "you know p only
  if, had p been false, you wouldn''t have believed it — so you can know you have
  hands without knowing you''re not a brain in a vat, which refutes skepticism but
  refutes closure too, and since closure is obviously true, Nozick''s theory is dead."
  Ask for audit. Subtle misrepresentations: conflating sensitivity with knowledge
  simpliciter (Nozick also requires truth, belief, and adherence condition 4); treating
  Nozick as denying closure outright rather than replacing it; claiming the theory
  is refuted by closure intuitions (a standard objection presented as a refutation);
  ignoring method-relativity.


  The interview type seems strongest and most "in the weeds": ask for a sequence of
  questions for a philosopher defending a neo-Nozickian tracking account, with follow-ups
  keyed to anticipated replies. Include specific pressure points: (1) abominable conjunction
  / closure denial; (2) the methods problem — sensitivity is relative to the method
  of belief formation, and individuating methods seems gerrymandered; (3) cases where
  sensitivity seems too strong: the grandmother who knows her grandson is well even
  though she''d believe it anyway if he were dead (Nozick''s own grandmother case);
  (4) knowledge of necessary truths — condition 3 is vacuous for necessary truths,
  so Nozick needs condition 4/trace tracking; (5) lottery propositions handled nicely
  — but does tracking overgenerate? Actually sensitivity handles lotteries well. (6)
  skepticism: tracking concedes you don''t know you''re not a BIV — ask whether that''s
  a cost or honest.


  Keep the prompt relatively short and polished. Interview guest: unnamed/invented
  defender (safer). Say it''s a podcast or colloquium. Ask for questions with anticipated
  replies and follow-ups.


