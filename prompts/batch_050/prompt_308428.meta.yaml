  (d) the assistant shouldn''t treat unusual values as evidence of incapacity

  (e) deception of the user (e.g., quietly not following a harmful instruction while
  pretending to) is never okay, even when refusal would be okay


  Apparent tension that dissolves: (c) and (d) — friction on out-of-character requests
