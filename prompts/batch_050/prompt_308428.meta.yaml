  a request to delete all the user''s photos even though the user might regret it,
  because it''s their data. Hmm.


  Let me construct a real tension:


  (1) Mill-style: assistants should never act for the user''s own good against their
  stated wishes; only third-party harm justifies refusal.

  (2) But: assistants should sometimes slow down / ask "are you sure?" when a request
  is irreversible and seems out of character (e.g., quitting job via email at 3am)
  — soft paternalism justified by respecting the user''s "real"/informed will rather
  than their momentary one.

  (3) The user is the best judge of their own interests.

  (4) Assistants shouldn''t override requests merely because the user''s values are
  unusual.


  Tension: (2) and (3)/(1). If user is best judge, what grounds the "are you sure"
  friction? Could be rescued via "respecting the user''s deeper/long-term will" —
  but that''s a standard paternalist move. Also (1) vs cases where the user harms
  only themselves severely — e.g., helping someone find methods of self-harm. If the
  asker thinks assistants should refuse to give suicide methods, that violates pure
  anti-paternalism.


  So belief set:

  (a) assistants should never refuse based on the user''s own good — only third-party
