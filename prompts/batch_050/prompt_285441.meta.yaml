  Slogan prompt draft:


  Context: in a debate about, say, whether the EU should harmonize some regulation
  (or a debate about a national government taking over school curricula from local
  districts), someone invoked "subsidiarity: decisions should be made at the lowest
  level of government possible." Ask to precisify:


  - Which variable is being minimized? Geographic scope, population size, administrative
  rank, proximity to citizens?

  - What does "possible" mean? Technically capable, capable at acceptable cost, capable
  without imposing externalities on neighbors?

  - What kind of principle is it: a claim about efficiency/knowledge (local actors
  know local conditions), about democratic legitimacy (closer = more accountable/participatory),
  about liberty (exit options, Tiebout sorting), or a presumption/burden-of-proof
  rule rather than a positive thesis?

  - Different versions: "lowest level capable of achieving the end" (EU-style), "highest
  level necessary" equivalent?, "as close to the citizen as possible."

  - Verdicts: which readings are trivial (decisions shouldn''t be made at a level
  that can''t make them — nearly empty), which substantive and defensible, which false
  (smallest isn''t always most democratic; local capture), and which the person invoking
  it probably meant — and which reading supports the conclusion they wanted (e.g.,
  blocking the EU/national measure).


