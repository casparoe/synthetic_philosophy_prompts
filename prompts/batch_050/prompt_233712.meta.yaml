  ---


  You are a philosopher specializing in aesthetics and the theory of artistic value,
  asked to advise a graduate seminar. Think carefully and work through the problem
  step by step before settling on conclusions.


  In Tolstoy''s treatise What Is Art?, the central positive account of art rests on
  an analogy that has since become common currency in criticism: art is a kind of
  infection. The artist, having lived a feeling, externalizes it in words, sounds,
  or forms so that the audience catches the same feeling, much as one person transmits
  a disease to another; a work succeeds to the degree that it is contagious, and its
  worth is fixed by the worth of the feeling spread. A member of our seminar leans
  heavily on this analogy to defend Tolstoy''s full package of conclusions: that infectiousness
  is the measure of art as art; that the sincerity of the artist is the master condition
  of infectiousness; that art trafficked in by professionals who manufacture effects
  they do not feel is counterfeit in the way quack medicine is counterfeit; and that
  Tolstoy was therefore justified in striking most of the canon — Shakespeare, the
  late Beethoven, Wagner, nearly all of his own fiction — from the rolls of genuine
  art, keeping only what unites its audience in universally shareable feeling.


  Your task is to audit the analogy rather than to recount Tolstoy''s theory. Please
  proceed as follows:


  1. Begin with a brief brainstorming stage: list as many candidate correspondences
  and candidate disanalogies as you can, before filtering.

  2. Give an explicit correspondence table: what plays the role of the pathogen, the
  original host, the vector, the susceptible population, immunity, latency, symptom?
  Note any slots the analogy leaves unfilled or fills awkwardly.

  3. Separate the disanalogies that matter for the intended use from those that are
  merely striking. Consider at least: infection is involuntary and indifferent to
  the host''s cooperation, whereas reception of art is active and interpretive; a
  pathogen is replicated, whereas a feeling may be transformed in transmission; a
  carrier typically suffers the disease, whereas Tolstoy''s counterfeit artist feels
  nothing yet still transmits; and infectiousness is morally neutral as a mechanism,
  while the theory makes the value of the transmitted content do normative work.

  4. For each of the four conclusions the seminar member draws, state whether the
  analogy actually supports it, supports it only with independent premises the analogy
  smuggles in, or fails to support it once the disanalogies are on the table.

  5. If the infection picture can be repaired, say how; if a better analogy for what
  Tolstoy cared about exists (inoculation, translation, resonance, contagion of mood
  in crowds), propose it and say what it preserves and what it sacrifices.


  Conclude with a verdict: does the infection analogy carry Tolstoy''s purge of the
  canon, or was it doing the argumentative work all along while the real weight rests
  elsewhere?


