  paradox — an author who has checked each claim in her book finds it rational to
  believe each one, while also rationally believing, on grounds of general fallibility,
  that at least one claim in the book is false.


  Leo''s position: the two paradoxes are one problem. Both are generated by believing
  propositions that are individually highly probable but jointly inconsistent with
  something else you accept, so any adequate solution must treat them identically.
  His proposal: rational belief is not closed under conjunction — you may rationally
  believe each conjunct without rationally believing their conjunction — and this
  dissolves both paradoxes at once.


  Mara''s position: the paradoxes differ in structure, and the common-solution demand
  is misguided. In the lottery, each belief rests on purely statistical evidence —
  the ticket''s number is its only relevant feature — so the right lesson is that
  purely statistical grounds never warrant outright belief, only high credence. In
