  Risk-weighted expected utility (REU, Buchak): agents maximize expected utility weighted
  by risk function applied to cumulative probabilities — outcomes ranked, and probability-weighting
  function r(p) distorts chances of worse outcomes. Key issues: global sensitivity
  vs local sensitivity to probabilities, the claim that REU can capture risk aversion
  without diminishing marginal utility, the Allais paradox, Lara Buchak''s argument
  about "how much worse off you''d be" mattering — the ethical/structural claim that
  REU rationality depends on what''s "relevant to your ends." Common critiques: REU
  agents can have preferences that violate separability, "risk aversion" as a basic
  disposition vs. attitude toward outcomes.


  The novelist angle: casual, maybe a typo. Write a back-and-forth: one friend says
  risk aversion is just an emotion/preference quirk that standard decision theory
  can model via utility over outcomes (concave utility function); the other says REU
  shows risk attitudes are irreducible — the same utility function can yield different
  choices based on risk profile, and that''s rational. Then replies: first says REU
  agents can be "money-pumped" or behave oddly across mixed gambles; second counters...
  Actually money pumps target Allais-type preferences generally, not REU specifically.
  Better: first says REU smuggles the utility back in through the risk function —
  the r function just encodes the same risk preferences you''d encode in u, so no
  conceptual gain. Second says no: the risk function weights probabilities of worse-off
  outcomes, which is a structural difference — REU can explain the common consequence
  effect with linear utility, something EU can''t. First: but then you get the "global
  vs local" problem — REU makes agents sensitive to the ordering of outcomes across
  a whole gamble in weird ways, e.g., small changes to the best outcome change how
  you weight all probabilities... Hmm, keep it accurate but digestible.


  Let me draft the disagreement with 4 moves, each numbered, casual, from a novelist
  who witnessed it at a dinner party or between two friends. End with request: adjudicate
  move by move, who is right about what, what''s missing.


  No quotes needed, no citations. Names: e.g., Mara and Dev. Keep it short-ish.


  Draft:


  So I''m writing a novel and I had two friends over for dinner last weekend — one
  does econ, one does something in philosophy — and they got into an argument about
  this "risk-weighted expected utility" thing I want to steal for a chapter. I need
  to know who was actually right because I don''t want my characters defending garbage.
  Roughly how it went:


  (1) Mara said risk aversion doesn''t need any new theory. People just value outcomes
  non-linearly — the jump from broke to comfortable matters more than comfortable
  to rich — so ordinary expected utility with a curvy utility function explains everything.
  A "risk-weighted" theory is just the same psychology dressed up in fancier math.


  (2) Dev said no, that can''t be right, because the same person with the same utility
  function can act risk-averse in one gamble and risk-seeking in another, and risk-weighted
  EU explains this by letting agents reweight probabilities — pessimists overweight
  the chances of ending up worse off, and that''s a distinct rational attitude, not
  just curvy utility. It even handles Allais-style choices with perfectly linear utility,
  which plain expected utility can''t.


  (3) Mara said fine, but there''s a catch: in risk-weighted EU the value of a gamble
  depends on how its outcomes rank relative to each other, so agents can become weirdly
  insensitive to probabilities at the extremes — a tiny change in the top outcome
  reshuffles the weighting of every other probability, and she said that produces
  choices any reasonable person would call inconsistent across near-identical situations.


  (4) Dev said that''s not a bug, it''s the point: how bad the bad outcomes are relative
  to the good ones genuinely matters to whether taking a risk makes sense, and standard
  theory already bakes in a weird separability assumption (treating each outcome as
  evaluated in isolation) that just hides its own commitments.


  Rate each move clearly-mistaken to clearly-right and say who''s more right overall?
  Also tell me what both of them are missing, because I suspect neither of them actually
  explained what makes the risk function a *rational* thing to have rather than just
  a mood.


  That''s decent. Check accuracy: (2) Allais explained by REU with linear utility
  — yes, Buchak shows common consequence effect compatible with linear utility. "Same
  person same utility function risk-averse in one gamble and risk-seeking in another"
  — EU with fixed concave u is uniformly risk-averse; risk-seeking behavior in some
  domains (e.g., small-stakes gambling + insurance) is a standard puzzle (Friedman-Savage
  needed inflecting utility). REU''s r function can vary... actually with fixed r,
  REU is uniformly risk-averse or risk-seeking too, unless r crosses... Buchak discusses
  that risk attitudes can differ across gambles more flexibly. Close enough for a
  casual report of friends'' argument; and the adjudication can pick at it. Actually
  the point "pessimists overweight chances of ending up worse off" is right — REU
  weights outcomes'' probabilities with r applied to cumulative probability of getting
  something at least that good.


  (3) Mara: "tiny change in the top outcome reshuffles weighting of every other probability"
  — in REU, utility values don''t affect the weighting (weights depend only on probabilities
  and r); but changing the value of an outcome can change its rank, which changes
  which cumulative probabilities get which weights. Rank-dependence: if a small change
  to an outcome''s value changes its ranking among outcomes, the weight attached to
  adjacent outcomes'' probabilities shifts. That''s a real feature (rank-dependence).
  "Insensitive to probabilities at the extremes" — actually rank-dependent theories
  are sensitive; the standard critique is more about continuity/monotonicity and dynamic
  inconsistency. The move as reported is a slightly garbled but plausible friend-level
  version; that''s fine and even good for adjudication. Maybe phrase it as: because
  the weighting is rank-dependent, whether an outcome counts as "the bad one" depends
  on the whole gamble, so adding or removing a dominated option can flip which outcomes
  get overweighted — near-identical situations yield opposite risk attitudes. That''s
  a reasonable critique.


  (4) Dev''s rebuttal: REU''s insight — "how bad the worst outcome could be matters"
  — and standard EU''s independence/separability assumption. Good.


  Length: keep focused. Add a typo or two casually. Novelist perspective included.
