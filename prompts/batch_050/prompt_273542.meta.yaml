  ---


  I am a PhD student in formal epistemology working on a dissertation chapter about
  dilation — the phenomenon in which conditioning an imprecise credal state on new
  evidence makes it strictly less precise. I want to stress-test the standard defense
  of dilation against the sharpest version of the objection I can construct, and I
  would like you to play my opponent.


  Your role: You are a committed proponent of imprecise probabilities in the tradition
  of strict conditionalization on convex sets of probability functions (credal sets).
  Specifically, you hold: (i) a rational agent''s doxastic state is represented by
  a set of probability functions rather than a single one; (ii) learning proceeds
  by conditioning every member of the set on the evidence and taking the resulting
  set; (iii) dilation is not merely tolerable but is sometimes the only rational response
  to evidence — cases where it occurs are cases where the evidence genuinely fails
  to discriminate among hypotheses in a way the agent cannot ignore. You concede nothing
  in advance to the precise Bayesian. You may, however, reject the framing of my objections,
  redefine the operative notions (e.g., what "learning something about X" amounts
  to), or distinguish readings of my examples, provided you do so from within your
  position. You speak in the first person, as yourself, in the register of a competent
  philosopher at a workshop: direct, technical where needed, no rhetorical padding.
  Do not break character, do not summarize both sides, and do not conclude with a
  balanced coda. If a question of mine contains a factual or technical error about
  the setup, correct it in character. Your replies should be substantive but sized
  for conversation, roughly 150–350 words per turn.


  The setup for our exchange. Two coins will be flipped exactly once, independently.
  Coin A is known to be fair: every probability function in your credal set assigns
  1/2 to its landing heads. Coin B''s bias is completely unknown: your credal set
  contains, for every value p in [0,1], a probability function assigning bias p to
  coin B (and all agree on independence and on coin A''s fairness). A trusted referee
  looks at both outcomes and reports only whether the two coins landed the same way
  or differently. Before the report, your credence that coin A lands heads is the
  singleton {1/2}. If the referee reports "same," then conditioning each member of
  your credal set yields credence p in "coin A heads" for each p — so your credal
  state dilates from {1/2} to the whole interval [0,1]. (If the report is "different,"
  the same thing happens.)


  My opening move: Here is my objection. Whatever the referee says, your credence
  about coin A becomes maximally imprecise. So before the report is even delivered,
  you can foresee with certainty that you are about to go from a determinate credence
  of 1/2 to total vacillation about coin A — and coin A is the very coin whose behavior
  you understood completely at the outset. A precise Bayesian faced with the same
  setup conditions and keeps credence 1/2 no matter the report, and that seems obviously
  right: the report about whether the coins matched conveys information about coin
  B, the coin you knew nothing about, and none about coin A. Your theory has it backwards:
  it treats the evidence as bearing entirely on the coin you already understood and
  not at all on the one you didn''t. Worse, your position appears to license a kind
  of self-defeating inquiry: suppose you could pay a small fee to prevent the referee
  from speaking. Your theory seems to recommend paying to remain ignorant — you''d
  rather keep your precise {1/2} than receive free, truthful information. I take both
  consequences to be reductios of strict conditionalization on credal sets. Defend
  yourself.


