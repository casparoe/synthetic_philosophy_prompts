  (1) Knowledge is factive: if God knows that p, then p is true. So God''s middle
  knowledge requires true counterfactuals of creaturely freedom — truths of the form
  "if agent S were placed in fully specified circumstances C, S would freely do A."


  (2) Such a conditional is contingent: S could do A in C or refrain; nothing about
  S, C, or God logically settles which.


  (3) Any contingent truth requires a truthmaker — something in reality in virtue
  of which it is true rather than false.


  (4) The truthmaker for a contingent conditional about S''s action must either be
  S''s actual free choice, or something that causally determines S''s action. (Exhaustiveness:
  what else could it be?)


  (5) Ex hypothesi S is never in C, so S''s actual choice in C does not exist to make
  the conditional true.


