  Hempel''s raven paradox: the paradox of confirmation — "All ravens are black" is
  logically equivalent to "All non-black things are non-ravens," so observing a white
  shoe confirms the raven hypothesis. A thought experiment to specifications could
  be: construct a scenario where observing a non-black non-raven genuinely does confirm
  "all ravens are black" in a strong, intuitive way — or conversely, a scenario where
  observing a black raven fails to confirm, or even disconfirms. The interesting hard
  direction: a case where a black raven disconfirms the hypothesis (e.g., selection
  effects — like the "Mr. Smith''s exam" style cases, or where the sampling method
  is biased). Actually the classic hard direction is making Nicod''s criterion fail:
  a case where an instance of the generalization provides evidence against it.


  Alternative: embedded agency — construct a thought experiment where an agent must
  model itself... But the thought experiment type with raven paradox seems good.


  Let me design: "Construct a thought experiment in which seeing a black raven lowers
  one''s credence that all ravens are black, while seeing a white shoe raises it."
  Constraints: realistic, no demons, one paragraph, the effect must arise from the
  sampling/observation procedure rather than from weird priors about raven color...
  Then demonstrate how the confirmation-theoretic reasoning works (likelihoods), and
  identify the feature doing the work, and what happens if it''s removed (collapses
  back to standard paradox).


  That''s a nice "in the weeds" but not obscure prompt — it requires likelihood-ratio
  reasoning about confirmation, which LLMs know but rarely see packaged as a construction
  task.


  The persona: a journalist who covers science and ideas. Formal/polished. One to
  three paragraphs with some color ("I''m writing a column...", "I was discussing
  with my editor...").


  Format: numbered list with fixed number of items, each a sentence or two, no intro/conclusion.
  The type calls for scenario + demonstration. So: "Reply as a numbered list of exactly
  six items: item 1 the scenario..., items 2-4 the confirmation analysis..., etc.
  — no introduction or conclusion."


  Prompt engineering text: "You are a philosopher of science with expertise in Bayesian
