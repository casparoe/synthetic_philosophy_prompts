  Number of items: say exactly six. Structure:

  1. The scenario itself.

  2. Why the black raven disconfirms (likelihood analysis).

  3. Why the white shoe confirms.

  4. The single structural feature doing the work.

  5. What happens if that feature is removed — does it collapse back to the standard
