reasoning_summary: 'Let me pick a domain and type. The "should the numbers count?"
  (Taurek) domain is a rich one for a sorting quiz / decision tree — positions: save
  the greater number (utilitarian-ish), Taurek''s coin toss / equal chances, weighted
  lottery, Scanlon''s contractualism with aggregative tie-breaking, the idea of "claims"
  (each person has a claim to be saved), etc. A decision tree classifying positions
  on numbers counting would work nicely.


  Alternatively, functionalism and multiple realizability taxonomy. But numbers-counting
  is good because positions genuinely come apart on cases: one vs. five strangers,
  one vs. five where the one is your spouse, where the one is a child vs. five elderly,
  cases of unequal stakes (one person dies vs. five people lose a finger?), partial
  rescues, probabilities, etc.


  Requirements: build tree from logical space, diagnostic cases answerable without
  knowing labels, unoccupied combinations noted, positions the tree cannot separate
  flagged, asker specifies angle: which positions must appear as leaves, which cases
  must be used, audience, size. One to three paragraphs, formal, with some personal
  detail.


  Must-leaf positions: straight aggregation ("save the greater number, full stop"),
  Taurek''s equal-chances coin flip, weighted lottery proportional to number, Scanlon-style
  tie-breaking (relevant features then numbers break ties), maybe "separate persons
  / no aggregation" deontology... Also anti-aggregation only against aggregating trivial
  harms. Maybe include a leaf for contextualism.


  Required cases: the classic one-vs-five strangers; a case where the one is someone
  personally significant to the chooser (Taurek explicitly allows partiality); a case
  with unequal stakes (one person''s life vs. five people''s arms?) — Scanlon''s "relevant
  difference"; a rescue where you can save either one group but not probabilities...
  maybe a risk case: certainty of saving one vs. 50% chance of saving all six? That
  tests probabilistic handling.


  Audience: undergraduate ethics reading group, or a "which side are you on" handout.
  Size: 6–8 diagnostic questions, ~5-6 leaves.


  Write the prompt with a bit of framing: "I run a discussion group... after reading
