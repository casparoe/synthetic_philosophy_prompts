  not desert/blame, and explicitly separates liability from desert); (2) claim that
  the traditional view (Walzer) holds combatants are morally innocent — actually Walzer
  grounds equality on coerced/state role, soldiers as "poor devils like me"; also
  the summary might say McMahan thinks just combatants may kill innocent non-threatening
  people? Hmm.


  Another subtle error: conflating liability to attack with permissibility of attacking
  — McMahan notes liability doesn''t straightforwardly settle permissibility due to
  proportionality/necessity, and he acknowledges practical reasons to keep the convention.
  A good misrepresentation: summary says McMahan concludes soldiers should refuse
  to fight / that laws of war should be rewritten to reflect deep morality — actually
  McMahan explicitly distinguishes morality of war from laws of war and supports keeping
  combatant equality in law. That''s a great subtle error.


  Second subtle error: summary says Walzer''s equality rests on the idea that soldiers
  don''t choose to fight / are coerced — Walzer''s argument is more that combatants
  on both sides act as agents of the state, have been stripped of ordinary options
  ("they are not responsible... they''re like gladiators"). Actually Walzer''s gloss:
  soldiers fight as enemies because of their status, their war-making is not a crime
  because... "moral equality of soldiers: they face one another as moral equals" because
  individual soldiers lack responsibility for the war — "war is hell" gladiators.
  Walzer''s argument in Just and Unjust Wars: soldiers are coerced or act in circumstances
  where refusing costs too much; the relevant point is they fight as members of armed
  forces, not as individual criminals. Some subtlety: a common mischaracterization
  is that equality follows from soldiers'' diminished responsibility; critics note
  this fails for volunteers in unjust wars. Fine — the summary could attribute to
  Walzer the claim that all combatants lack responsibility because coerced, which
  is a simplification but plausible.


