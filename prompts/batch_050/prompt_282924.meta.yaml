  3. "may never be permissibly attacked" — McMahan thinks just combatants are generally
  not liable, but "never" is too strong? Also lesser-evil justifications could permit
  attacking just combatants in rare cases; McMahan acknowledges that. Slight overstatement.

  4. Final claim that McMahan wants the laws of war revised and prosecution — wrong:
  McMahan insists deep morality differs from the laws of war, which should retain
  moral-equality-like conventions for practical/humanitarian reasons.


