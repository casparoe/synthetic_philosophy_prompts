  Summary (from a popular book on the ethics of war):


  "Traditional just war theory holds that soldiers on both sides of a war are moral
  equals: a soldier fighting for an unjust cause does nothing wrong by fighting, provided
  he obeys the rules in combat, because responsibility for the war rests entirely
  with political leaders and ordinary soldiers are in no position to judge the justice
  of their cause. Jeff McMahan has argued that this is a mistake. On his view, whether
  you may kill in war depends on whether your cause is just: soldiers fighting for
  an unjust cause are like individual wrongdoers, and because they are morally responsible
  for posing an unjust threat, they deserve to be killed and may be targeted even
  when they pose no immediate danger, whereas just combatants, since they have done
  nothing wrong, may never be permissibly attacked. McMahan concludes that the existing
  laws of war should be revised to reflect this asymmetry, so that soldiers who fight
  in unjust wars can be prosecuted simply for fighting."


  Errors embedded:

  1. "deserve to be killed" — McMahan distinguishes liability from desert; unjust
  combatants are liable to defensive attack in virtue of responsibility for unjust
