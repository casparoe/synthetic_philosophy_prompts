reasoning_summary: "We need to write a prompt. Choose domain + type. Options: consent\
  \ validity, moral relativism, Pascal's wager, loss aversion/endowment effect, Grand\
  \ Inquisitor. Types: summary audit, satire, verdicts/principles.\n\nPerspective:\
  \ someone who just had a long argument with a friend, casual, maybe a typo, relatively\
  \ short.\n\nGood combos: \n- Loss aversion/endowment effect + summary-audit type:\
  \ friend summarized a pop-science book's take (\"loss aversion is just a bias, irrational...\"\
  ). Ask sentence by sentence what's fair.\n- Moral relativism + verdicts/principles:\
  \ hard to do cases.\n- Grand Inquisitor + summary audit: friend's summary of the\
  \ chapter — but relies on specific text; no quotes needed though. Could work: friend\
  \ claimed the Grand Inquisitor says the Church took people's freedom because people\
  \ can't bear it... That's fairly accurate, need subtle misrepresentations. Risk\
  \ of mischaracterizing actual text — I know it well enough. But avoid quoting.\n\
  - Pascal's wager + verdicts type: cases about decision under uncertainty... tricky.\n\
  \nThe loss aversion domain fits the \"accuracy audit\" type nicely and is \"in the\
  \ weeds\": loss aversion vs. endowment effect, whether it's bias or legitimate preference\
  \ — e.g., the summary conflates the endowment effect with loss aversion, overstates\
  \ the \"irrationality\" claim, misses the \"asymmetric value vs. reference dependence,\"\
  \ status quo bias, Gal's critique (loss aversion maybe not real?), etc. But avoid\
  \ super niche stuff like Gal & Rucker 2018? That's fine to not mention; the prompt\
  \ just presents the summary.\n\nWrite summary with subtle misrepresentations:\n\
  1. \"Endowment effect: people demand more to sell a mug than they'd pay to buy it\
  \ — that's loss aversion: losses loom twice as large as gains.\" Mostly right (2x\
  \ is roughly Kahneman/Tversky estimate ~2.25).\n2. Misrepresentation: \"This proves\
  \ people are irrational, because rationally the value of a mug doesn't depend on\
  \ who owns it.\" — conflates reference-dependence with irrationality; a defender\
  \ could say reference-dependent preferences can be coherent; also transaction costs,\
  \ sentiment.\n3. Misrepresentation: \"the endowment effect is just loss aversion\"\
  \ — conflation: endowment effect could arise from other things (ownership increases\
  \ value, status quo bias, bargaining); loss aversion is about gains vs losses relative\
  \ to reference point.\n4. Overstatement: \"loss aversion explains everything from\
  \ the stock market to why people stay in bad relationships\" — overreach.\n5. Maybe:\
  \ \"Kahneman won the Nobel for showing humans are irrational\" — attribution error:\
  \ Kahneman won Nobel in economics 2002 for prospect theory etc., but framing \"\
  humans irrational\" is the overstatement. Could keep vague.\n\nAsk: how fair is\
  \ this, what would a behavioral economist object to, and whether the friend's conclusion\
  \ (that since it's all bias, people should just sell mugs at market price / ignore\
  \ their gut) follows.\n\nThe asker just had a long argument with a friend. Casual,\
  \ a typo. Keep it short-ish.\n\nNo verbatim quotes needed — I write the summary\
  \ myself in the friend's voice. No web needed. Could verify the ~2:1 loss aversion\
  \ ratio? It's in-prompt as the friend's claim, and the model evaluating it can judge.\
  \ I don't need to assert facts myself. Fine.\n\nWrite the prompt, casual, with maybe\
  \ one typo."
