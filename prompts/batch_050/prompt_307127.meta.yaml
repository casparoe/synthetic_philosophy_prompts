  The dynamic objection: REU agents are dynamically inconsistent — plans judged best
  ex ante contain continuations judged worse at the later node. Exploitation argument:
  someone can offer trades sequentially (e.g., sell then buy back) extracting money,
  though it''s not a strict Dutch book; known as the "diachronic exploitation" worry.
  Buchak''s response: resolute choice — commit to the plan; argues the plan is evaluated
  as a whole; the myopic/sophisticated agent''s problem comes from evaluating continuation
  at each node, but global evaluation is normatively privileged.


  Also there''s an objection that REU can''t represent certain risk attitudes? Or
