  Prompt draft:


  "I co-organise a fortnightly philosophy of science seminar, and for next term we
  are pairing our two most argumentative members — one a defender of counterfactual
  theories of causation in roughly the Lewis tradition, the other an interventionist
  working with causal models in the Woodward style — in a structured adversarial collaboration,
  on the model of joint work between scientific rivals. They have spent two years
  talking past each other: the counterfactualist keeps producing preemption and trumping
  cases she claims interventionism cannot handle without ad hoc patchwork, while the
  interventionist replies that the counterfactualist''s repairs multiply primitive
  similarity relations and that only his framework actually underwrites the methods
  scientists use to infer causes. We have asked them to stop debating and instead
  co-author a joint statement, and I would like you to draft it for them as a starting
  text.


  The document should have three parts. First, a numbered list of claims both can
  sign — about what causal claims commit us to, about the difference between causation
  and correlation, about what any adequate theory must do with cases of preemption,
  and about whether manipulability is necessary, sufficient, or merely evidence for
  causation. Second, the residual disagreements, each stated in wording the relevant
  party would accept as a fair description of their own view; I particularly want
  the dispute over reduction vs circularity (the counterfactualist aims at a reductive
  analysis in non-causal terms; the interventionist cheerfully defines causation in
  terms of interventions, which are themselves causal) stated exactly, since I suspect
  half their arguments are really about whether circularity is a vice here. Third,
  the cruxes: for each, a concrete case or argument both agree bears on it, with each
  side''s prediction recorded in advance — for instance, how each theory must treat
  late preemption, trumping (the two sergeants ordering the major to advance), omission
  and absence causation, and causation in fundamental physics where nothing seems
  to be an intervention variable. Where part of their disagreement looks verbal to
  you, mark it as such and say why. I''ll fill in the references to the literature
  myself, so please don''t cite particular papers or books by name."


  Length check: fine. British English: "fortnightly", "co-author", "organise". Good.
  Avoid example overlap (wild animal, Everett/Bohm, CDT/EDT). No verbatim quotes.
  No niche facts. Good.'
