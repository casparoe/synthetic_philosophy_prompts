  not that manipulation is common or easy (computational hardness of manipulation
  literature).

  - It doesn''t say elections are meaningless or that all rules are equally bad; frequency
  and severity differ.

  - Gibbard''s later theorem (1977) extends to all (incl. randomised) schemes but
  with weaker strategy-proofness notion; probably too much detail.

  - Also the converse direction: dictatorship is strategy-proof; and the theorem needs
  ≥3 alternatives (majority rule with 2 is strategy-proof).


