  Gibbard–Satterthwaite: For any deterministic social choice function with at least
  three possible outcomes, universal domain (all strict preference orderings allowed),
  onto (every alternative can win), if it is strategy-proof then it is dictatorial.
  Gibbard 1973, Satterthwaite 1975. The subtle points:

  - It applies to resolute (single-winner, deterministic) ordinal voting rules; not
  to lotteries, not to scoring/cardinal rules like approval voting (which elicit approvals
  not rankings), not to restricted domains (single-peaked → median rule strategy-proof,
  by Black/Moulin).

