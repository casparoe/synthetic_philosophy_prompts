  Let me construct an argument that seems to prove too much on self-deception. Classic
  puzzle: self-deception seems to require believing p and not-p simultaneously (intentional
  paradox: to deceive yourself you must know the truth to hide it, but then you can''t
  be deceived). An argument that "proves" self-deception is impossible, extended to
  show that all motivated irrationality is impossible — proving too much.


  Draft argument:


  (1) To deceive someone, the deceiver must believe the truth (or at least not believe
  the falsehood) while getting the victim to believe the falsehood.

  (2) If I deceive myself, I must both believe p (as deceiver) and believe not-p (as
  victim) at the same time.

  (3) No one can consciously believe p and not-p at the same time — that''s not belief,
  it''s confusion.

  (4) So self-deception, understood as deceiving yourself, is impossible.

  (5) Everything we call self-deception is just wishful thinking, bias, or avoidance.

  (6) But the same argument shows that intentionally hiding anything from yourself
  is impossible — yet novelists/people clearly do things like avoiding the drawer
  with the letter, not counting the drinks, etc.


  Hmm, the "proves too much" angle: the argument''s conclusion seems to rule out not
  just self-deception but also things we obviously observe — like a character who
