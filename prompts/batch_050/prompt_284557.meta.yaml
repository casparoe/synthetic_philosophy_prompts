  impossible, then... maybe extend: the same reasoning would show that no one can
  ever be strategically ignorant of anything, but we see strategic ignorance all the
  time (e.g., not looking at the scale). So the argument proves too much.


  Actually better structure: the argument concludes self-deception is impossible;
