  Student answer draft:


  "Nozick''s account replaces the traditional justification condition with two counterfactual
  conditions. S knows that p iff: (1) p is true; (2) S believes that p; (3) if p were
  not true, S would not believe that p (the sensitivity condition); and (4) if p were
  true, S would believe that p (the adherence condition). Conditions (3) and (4) are
  subjunctive conditionals, evaluated with the method S actually used held fixed.


  The BIV argument says: you don''t know you''re not a BIV, and if you don''t know
  that, you don''t know you have hands. Nozick''s reply is that the belief ''I am
  not a BIV'' fails the adherence condition: if it were true that you''re not a BIV,
  there''s no guarantee you''d believe it, since nothing in your experience would
  reveal the difference. Ordinary beliefs like ''I have hands'' pass all four conditions,
  so we know them; the skeptic''s mistake is assuming knowledge of the ordinary proposition
  requires knowing the denial of the skeptical hypothesis.


  This brings out what the view says about closure. Nozick preserves closure: because
  the method is held fixed when evaluating the counterfactuals, knowing p and knowing
  that p entails q is enough to know q, as long as you deduce q by the same method.
  So the view avoids skepticism without giving up the principle that knowledge is
  closed under known entailment, which Nozick takes to be a desideratum for any theory
  of knowledge. This is similar to how Nozick motivates the view with his fake barn
  case: driving through the countryside, your belief ''that''s a barn'' isn''t sensitive
  if there are papier-mâché facades around."


