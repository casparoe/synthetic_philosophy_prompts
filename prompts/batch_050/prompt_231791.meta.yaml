  The classic response: Brandom distinguishes between what''s constitutive of the
  concept and collateral commitments; meaning is shared via the social practice —
  scorekeepers attribute the same commitment with different collateral commitments;
  disagreement is real because the commitment undertaken is the same even if the inferential
  commitments surrounding it differ. The cost structure: to save disagreement, Brandom
  needs an account of same-saying that doesn''t rely on identical inferential roles
  — anaphoric chains and substitutional commitments. Alternatively one might reject
  (1) for a milder inferentialism (only some inferences are meaning-constitutive —
  but that reintroduces the analytic/synthetic distinction Brandom/Sellars/Quine eschew).
  Or reject the individualist reading: inferential roles are attributed from a scorekeeping
  perspective, not read off dispositions.


