  like "banks are financial" vs "banks are muddy."

  (6) So we don''t actually disagree.

  (7) Generalising: no two people ever disagree (or: disagreement requires shared
  meaning, which requires identical inferential roles, which never happens).

  (8) Conclusion: inferentialism makes disagreement impossible — but disagreement
  obviously exists, so... the friend concludes meaning can''t be shared, or that communication
