  an equivocation between commitment and disposition — inferential role is normatively
  individuated (what you''re committed to), not psychologically (what you''d say).
  The neighbour may fail to draw an inference she''s nonetheless committed to. So
  (2) as stated ("roles differ because dispositions differ") doesn''t follow from
  the normative reading. That''s a nice subtle flaw. But then there''s still a residual
  real problem: even normatively individuated, different speakers may genuinely be
  committed to different inference patterns (I endorse non-classical logic, she endorses
  classical). Brandom''s real answer: shared meaning comes from the practice of treating
  each other as committed to the same claim (e.g., she can challenge my claim, use
  it as a premise in her reasoning) even while differing on what follows. Also the
  perspectival point: what a commitment is, is a matter of scorekeeping; the same
  commitment can be specified de re from different perspectives.


