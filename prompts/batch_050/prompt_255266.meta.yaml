  Last year, at 54, I was diagnosed with early-onset Alzheimer''s disease. While I
  still have full decision-making capacity, I have been drafting an advance directive
  — a so-called Ulysses contract — that instructs my future caregivers not to follow
  certain requests my later self may make (for instance, requests to move home from
  residential care, or to refuse particular treatments, or, eventually, requests for
  assisted dying where that is legal). I have come to accept what I believe is called
  the precedent autonomy view: that the considered directives of my competent present
  self should bind my future self even when that future self seems content and sincerely
  protests.


  I would like you to tell me what would count against this position. Not a survey
  of objections, but a map of what the view actually risks:


  1. Which possible findings or cases would genuinely undermine it rather than merely
  discomfort it? For instance: if it turns out that people with moderate dementia
  reliably report higher wellbeing than healthy people predict, is that a defeater
  for precedent autonomy or just a puzzle for it? If my future self no longer remembers
  signing the directive, or no longer endorses the values behind it, at what point
  does he become, in effect, a different person whose interests my signature should
  not override?


  2. What does the view predict or presuppose about personal identity, the authority
  of past selves over future selves, and the relationship between narrative values
  and moment-to-moment welfare — and in which of those neighboring debates does it
  stand or fall? If the best account of personal identity turns out to make my demented
  future self only weakly continuous with me, does that strengthen the directive (I''m
  protecting a stranger from my own future encroachment?) or void it (the signer isn''t
  the patient)?


  3. What would defenders of precedent autonomy themselves concede as counting against
  it — as opposed to what critics like those who prioritize the demented person''s
  current experiential interests say? I want the internal standards, not just the
  opposition''s.


  4. Please rank the defeaters from fatal to merely awkward, and tell me honestly
  whether the view has been insulated by qualifications (e.g., "the directive applies
  only if the patient''s current preferences are not ''genuine'' or ''stable''") to
  the point where it risks nothing at all.


  For what it''s worth, the defeater I would personally find most persuasive is one
  that shows the view rests on a confusion about who the directive is for — that it
  treats my future self as an instrument of my present self''s narrative, rather than
  as the person the contract ostensibly protects. But I''d like the full map regardless.
  Where relevant, you may compare the psychiatric case (Ulysses contracts for bipolar
  disorder, where the person typically recovers and is glad to have been bound) with
  the dementia case (where there is no recovery), since I suspect the analogy between
  them is doing more work than it should.


