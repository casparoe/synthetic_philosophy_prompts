  survive and reproduce, then ''the fittest survive'' says only that those that survive,
  survive — an empty truth that cannot be tested or explain anything. For natural
  selection to be a substantive theory, fitness must be defined independently of actual
  reproductive outcomes.


  The propensity interpretation, associated with Mills and Beatty, does exactly this.
  An organism''s fitness is its propensity — roughly, its expected number of offspring
  — rather than the number it actually leaves. Fitness is a disposition like solubility:
  a sugar cube is soluble even if it never dissolves, and a fit organism is fit even
  if, by bad luck, it leaves no offspring. Because fitness is defined in terms of
  an underlying propensity rather than actual outcomes, the claim that fitter organisms
  tend to outreproduce less fit ones is a contingent, testable claim, and the tautology
  charge is answered. On this view, if organism A has higher fitness than organism
  B, then A will, on average across environments, leave more descendants than B.


  The interpretation does raise a measurement issue, but a tractable one: we cannot
  observe a propensity directly, yet by counting actual offspring over sufficiently
  many generations we converge on the true value, so fitness remains empirically accessible.


