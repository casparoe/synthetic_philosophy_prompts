  \ roulette is clearly wrong even if the bullet doesn't fire.\n- Yet acceptable risk\
  \ thresholds matter: a 1 in 100 million risk is fine.\n- The vaccinated/unvaccinated\
  \ case?\n- Also: it's the riskiness of the act type that matters, not the outcome...\
  \ but I feel differently about a drunk driver who killed someone vs one who didn't.\n\
  - Benefit to the risk-bearer can justify? Consent substitutes?\n\nConstruct a set\
  \ of commitments with tensions:\n\n1. Whether a risk-imposition is wrong doesn't\
  \ depend on whether anyone actually gets hurt (reject moral luck): drunk driver\
  \ who gets home safe is just as wrong as one who kills.\n2. Every driver imposes\
  \ risks on others without consent, yet ordinary driving is fine because the risk\
  \ is small enough and the benefit large.\n3. Russian roulette with one in a million\
  \ chambers forced on someone is still wrong even at that tiny probability — so it's\
  \ not about risk size, it's about... hmm, tension with 2? Actually tension: if small\
  \ probability makes driving OK, why doesn't small probability make roulette OK?\
  \ The usual answer: benefits/necessity. But then commit: \"benefits to third parties\
  \ can't justify imposing risk\" — that conflicts with 2's justification of driving\
  \ (benefits to driver/society). \n\n4. Consent: if you can't get consent, compensation\
  \ after the fact works? Tension with 3?\n\nLet me design:\n\nCommitments:\na) The\
  \ wrongness of a risk-imposition is settled at the moment you impose it; whether\
