  Two colleagues of mine in a political theory workshop have been arguing for weeks
  about whether liberal states have a right to exclude would-be immigrants, and last
  week they asked me to settle it. I could not, so I am handing it to you. Here is
  the exchange as faithfully as I can reconstruct it.


  (1) Ingrid opened with an analogy. States, she said, are associations, and freedom
  of association includes the freedom not to associate. A couple may exclude anyone
  they like from their wedding; a church may set conditions of membership; a citizens''
  assembly inherits the same right at scale. A political community that cannot decide
  who joins it is not self-governing at all, since decisions about membership are
  the most fundamental decisions a collectivity makes about itself.


  (2) Leo replied that the analogy collapses at precisely the load-bearing point.
  Weddings and churches are voluntary; states are not. Nobody chooses their fellow
  citizens, and membership is assigned coercively at birth, so there is no exercise
  of associational freedom for the state''s right to exclude to protect. What is actually
  protected by closed borders, he said, is an inherited privilege: where you are born
  determines your life prospects more than almost anything else, and guarding that
  privilege with fences is closer to feudalism than to freedom of association. He
  added that border controls restrict insiders too — the citizen who wants to hire,
  house, or marry a foreigner is told she may not.


  (3) Ingrid conceded that states are not voluntary but denied that this matters.
  Families are not voluntary either, she said, and yet no one thinks outsiders may
  force their way into a household''s common life; non-voluntary associations can
  still possess rights of exclusion. She then shifted ground: even if the pure associational
  argument fails, there is a functional one. The redistributive institutions of a
  wealthy democracy rest on solidarity and mutual trust among members, and a community
  that cannot control the pace and scale of admission cannot maintain those institutions.
  The right to exclude, on this version, is not about the pleasures of company but
  about the preconditions of collective self-government.


  (4) Leo''s reply came in two parts. First, the family analogy proves too little:
  at most it protects intimate association, not control over a labor market and territory
  shared by millions, and there is no principled way to get from one to the other
  without abandoning the associational framing entirely. Second, the functional argument
  is an empirical bet dressed as a right: whether realistic levels of immigration
  would in fact erode solidarity or welfare institutions is contested, and if they
  would not, Ingrid is defending a modest policy preference with an absolute-sounding
  entitlement. Either the associational claim does the work and scale is irrelevant,
  or scale does the work and it was never about association.


