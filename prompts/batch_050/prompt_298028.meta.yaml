reasoning_summary: 'Let me pick a domain and type. The Kalai–Smorodinsky bargaining
  solution is a niche domain that LLMs know somewhat. Type: "Ask a question that rests
  on a subtle confusion or false presupposition" could work well — a sincere question
  containing a misunderstanding of KS bargaining.


  A common confusion: KS solution picks the point on the Pareto frontier where each
  player gets the same fraction of their maximum possible gain (relative to disagreement
  point). Confusions could be: treating KS as maximising the product like Nash; or
  thinking KS satisfies independence of irrelevant alternatives (it doesn''t — it
  satisfies individual monotonicity, which Nash fails); or thinking that because KS
  equalises relative gains it''s "fair" in an absolute sense. Or: believing KS maximises
  the minimum relative gain regardless of the disagreement point location. Another
  subtle confusion: thinking KS is scale-invariant with respect to... it is affine
  invariant. Or confusing monotonicity properties.


  Good idea: "I''ve read that the Kalai–Smorodinsky solution gives each side the same
  absolute share of the gains, so it''s obviously fairer than Nash bargaining — how
  do I convince my co-founder we should split equity that way?" The confusion: KS
  equalises relative to each party''s ideal/maximum possible payoff, not absolute
  shares; and "fairness" vs Nash is contested. Also possibly confusing utopia point
  definition.


  Also the asker should be someone for whom it''s personally relevant — e.g., negotiating
  with a co-founder or business partner. Casual, British English, a typo or two, request
  that the answer state confidence and its least-sure point.


  No quotes needed. Keep short. Write directly.'
