  **Thinking in Slow Motion: Aunt Hillary and the Parochialism of Speed**


  In the Ant Fugue, the dialogue in Douglas Hofstadter''s Gödel, Escher, Bach, we
  meet Aunt Hillary: an ant colony that converses, jokes, and holds opinions, although
  no individual ant is anything more than a simple mechanism. The colony''s intelligence
  is realized one level up, in the shifting teams and trails of ants, the way ours
  is realized one level down, in neurons. Most discussion of the case stalls on a
  question I find dull — whether a sufficiently coherent high-level description is
  enough for a mind. I want to press on a feature of the case that gets less attention:
  how slowly Aunt Hillary must think.


  Signals in a colony propagate at the speed of walking ants. Plausibly, Aunt Hillary
  takes hours to complete a thought and days to finish a sentence. Call the natural
  objection the bandwidth objection: a system this slow does not think, it is merely
  describable as thinking. Genuine minds must outrun their environments. A being whose
  beliefs take a week to form always believes things about a world that no longer
  exists; its states may be true or false of the past, but they are never about the
  present, and so — the objection concludes — they are not really about anything at
  all.


  The standard reply, which I accept, is that absolute speed is parochial. Imagine
  a human brain in a vat, artificially slowed a thousandfold, fed sensory input slowed
  to match. It would think just as we do, only measured in years rather than seconds,
  and no one should deny it a mind. If slowness alone does not disqualify the slowed
  brain, it does not disqualify the colony.


  But I think the reply concedes the wrong point, and that the bandwidth objection
  survives in a refined form. What matters is not how fast a system thinks in absolute
  terms, but the ratio between the speed of its symbol-updating and the speed of the
  processes its symbols are meant to track. Call this the tracking ratio. The slowed
  brain in the vat has a tracking ratio of one: its world is slowed in lockstep with
  it. Aunt Hillary does not. She is a slow mind embedded in a fast world, conversing
  with creatures — anteaters, philosophers — who live thousands of times faster than
  she does. By the time she has formed a belief about her interlocutor, her interlocutor
  has eaten lunch, read a book, and aged a season.


  Does that matter? Not for all thought. Mathematics does not require keeping pace
  with anything, and neither does musing about the distant past. So I propose a distinction.
  Contemplative mindedness requires only internal coherence among symbols; it carries
  no tracking-ratio requirement. Engaged mindedness — perception, conversation, action,
  anything that answers to a changing world — requires a tracking ratio near one.
  The refined bandwidth objection then says: Aunt Hillary may be a contemplative mind,
  but she cannot be an engaged one. And that is a surprising result, because conversation
  is the paradigm of engagement. The one thing the Ant Fugue shows her doing — chatting
  with the Anteater — is the one thing a colony-mind could not actually do, even if
  it has beliefs, desires, and a rich inner life.


  The criterion has teeth outside the thought experiment. Consider a national government.
  On questions where its information channels and decision procedures operate faster
  than the phenomena — say, a financial panic unfolding over weeks — it is an engaged
  mind, and we do well to describe it as believing and intending. On questions where
  the phenomenon outruns the procedure — a legislature deliberating, over decades,
  about a technology that reinvents itself every two years — the tracking ratio collapses,
  and the government''s "position" is contemplative at best: a self-consistent story
  it tells itself, not a belief about the thing it is ostensibly about. This, I want
  to suggest, is not a metaphorical point. It diagnoses a real way in which large
  collective agents fail: not by being stupid, but by being slow relative to what
  they think about.


