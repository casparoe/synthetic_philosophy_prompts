  of history, 20 students, two 90-minute meetings exactly one week apart, plus a short
  written reflection after the second. I don''t lecture beforehand and the phrase
  never gets mentioned until the final debrief.


  Design the activity to these specifications.


  The overall shape I have in mind: in the first meeting, the class generates a contested
  event and its record; in the second meeting, after a week''s gap, a group that saw
  none of it must reconstruct what happened from what survived. You fill in the game.


  Specific requirements:


  1. Phase one should produce a genuine winner and loser, not assigned ones. Run some
  contest... The losing side should have real grievances — moments where the winners
  behaved questionably — that emerge from play rather than being scripted, because
  I want the record''s skew to be something the winners themselves create, not something
  you hand them.


  2. Between the event and the archive there should be a documentation phase with
  binding resource constraints: only so many minutes of testimony, so many items preserved,
  and the winners control... Actually the key mechanism: the winners end up in control
  of what gets preserved, and the constraint should be tight enough that even a scrupulously
  honest archivist must make choices that favor the winners'' framing. I want the
  class to discover that the archive can be badly skewed without anyone having lied.


  3. The historian group should work a week later, only from the archive, under an
  incentive that rewards a clean, coherent narrative (e.g., their account is judged
  by outside audience on clarity and plausibility). This is the third pressure I want
  visible: not propaganda and not selection, but the narrative demands of later telling.
  Ideally the three distortions — deliberate spin, structural selection, narrative
  smoothing — should be traceable to different moments in the game so the debrief
  can point at each.


