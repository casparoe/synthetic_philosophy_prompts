  1. Determinism may well be true, and this wouldn''t undermine our practices of blame
  and resentment (Strawson-compatibilism).

  2. Reactive attitudes like resentment and gratitude are constitutive of holding
  people responsible — there''s no separate question of whether blame is "deserved"
  that floats free of them.

  3. We ought to take the objective attitude toward people with certain severe mental
  illnesses; blaming them would be wrong.

  4. Whether the objective attitude is appropriate is a purely psychological/medical
  question about whether the person is capable of normal interpersonal relationships.

  5. Moral luck: we appropriately blame people more when their negligence causes harm
  than when it doesn''t, and this is fine.

  6. Indignation (vicarious reactive attitude) tracks the same standards as resentment;
  third-party blame is just as apt as victim resentment.


  Genuine tensions: (1)+(2) vs (4): if the objective-attitude question is settled
  by psychological capacity facts, then there IS a free-standing fact about blameworthiness,
  which (2) denies. Also determinism point: if determinism doesn''t undermine reactive
  attitudes because excusing is about quality of will not metaphysics, then why does
  mental illness (a deterministic cause) excuse? Also possible tension between (3)
  and (1): Strawson''s own point that excuses vs exemptions. An apparent tension that
  dissolves: (5) moral luck seems in tension with (2)/(1) but reactive attitudes naturally
  vary with outcomes, so it''s fine. Or (6) seems in tension with something but dissolves.


