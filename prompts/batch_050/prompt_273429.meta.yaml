reasoning_summary: 'Pick a domain + type. Options: lexical threshold negative utilitarianism
  / commensurability; negative util; moral realism; vagueness/sorites; Confucian role
  ethics. Types: procedure, exam question, argument-that-proves-too-much.


  Good combo: lexical threshold negative utilitarianism + "turn a principle into a
  procedure" — e.g., an institutional decision-maker (grant-making body, hospital
  triage, animal welfare charity) needs a procedure for trading off intense suffering
  vs. mild pleasures, operationalizing a lexical threshold. That''s in-the-weeds but
  doesn''t require niche citations. Alternatively, sorites + procedure: an editor/grader
  deciding borderline cases — e.g., a streaming service content moderator deciding
  "graphic violence" borderline cases using a degree-theoretic or supervaluationist
  approach. That''s nice too.


  Lexical threshold NU: practitioner could be a grant evaluator at a suffering-focused
  philanthropy who must decide when a project preventing extreme suffering lexically
  outranks one creating pleasure, and needs to handle the commensurability problem.
  Procedure: classify suffering by intensity, threshold test, etc. Hard cases: does
  any amount of mild pleasure offset one instance of agony? Where judgment can''t
  be eliminated.


  Requirements: casual, typo or two okay, prompt-engineering text (assign role, think
  carefully, brainstorm first), American English, short-ish, no preamble in final
  reply, no verbatim quotes needed. No need for web.


  Write it: asker runs grant evaluations for a small foundation focused on suffering
  reduction; board has adopted "lexical threshold" NU: below a certain intensity,
  suffering can be traded off against pleasure; above it, no amount of pleasure compensates.
  Wants a procedure: intake questions, how to classify intensities, how to handle
  uncertainty about intensity, when threshold applies, worked examples including one
  giving an answer the asker won''t like (e.g., rejecting a beloved arts program),
  and honesty about what procedure can''t settle.


  Include: "act as an expert in population ethics / practical ethics", "think step
  by step", "brainstorm first", "American English". Keep it focused.'
