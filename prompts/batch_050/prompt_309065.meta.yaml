  the concept it is, is its inferential connections (what you can infer from it, what
  entitles you to use it, what you''re committed to). A good game: players are given
  "words" defined only by rules of use — what you may say after hearing them, what
  you must accept, what counts as a challenge. Like the card game where each player
  has a rule card and communicates. Could do a game where teams get tokens/cards with
  made-up words and only inference rules connecting them (from "X is plorp" you may
  infer "X is smarg", etc.), and they must sort objects or answer questions — showing
  that meaning is constituted by the inferential network. Then the debrief maps to
  Brandom: giving and asking for reasons, commitments vs entitlements, scorekeeping,
  material inferences, the "game of giving and asking for reasons."


  Design concretely: seminar, ~16 students, 75 min. Game: "Blicket" style. Each player
  gets a rule card with made-up predicates and licensed inference rules; the group
  must collectively keep score of who is committed to what. Or: one player is the
  "scorekeeper" who tracks commitments. The twist: introduce a word whose only definition
  is its rules, then swap the word for a familiar one ("responsible", "poisonous")
  and watch how inferential practice carries the meaning.


  Alternative: a game where players teach each other a made-up word purely through
  use — e.g., "groob" which may be said of a card only if another player has said
  something entitling, etc. Participants feel that they''ve learned a concept without
  any definition, purely through inferential role.


