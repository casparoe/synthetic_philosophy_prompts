  Then there''s a proof of 0=1 from the Peano axioms. But proofs have lengths, and
  nothing guarantees the shortest such proof is short enough for anyone to find, or
  even to write down in the lifetime of the universe. It''s entirely possible that
  we live in an inconsistent arithmetic right now and that no physically possible
  computer could ever exhibit the contradiction. In that world, everything we believe
  about numbers would be, in the strict sense, theoremhood-in-an-inconsistent-system
  — and it would make no practical or even detectable difference, forever. Now here''s
  the kicker: if that scenario is genuinely possible, then consistency can''t be doing
  the work in our justification for trusting arithmetic that philosophers say it does.
  We don''t trust arithmetic because we know it''s consistent — thanks to Gödel we
  know we can''t prove that from inside anyway, and Gentzen''s proof just shifts the
  bet onto transfinite induction. We trust it because it''s never bitten us and because
  the short proofs we actually run keep working. An undiscoverable contradiction changes
  neither of those things.


  So the conclusion: inconsistency would be a maintenance problem, not a metaphysical
  crisis. Frege''s appendix is the outlier, not the template. What maths runs on is
  not consistency in the logician''s sense but a long unbroken streak of small, checkable
  successes — and a contradiction, even a real one, is just one more bug report in
  the tracker.


