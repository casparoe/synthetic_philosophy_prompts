  Essay: "The Catastrophe That Wouldn''t Be"


  Frege built his life''s work on an axiom that let you talk about the set of all
  things with a property, and Russell showed him you could derive a contradiction
  from it. Frege added a devastated appendix and, by most accounts, never quite recovered.
  That''s the story everyone tells about what inconsistency does to a formal system:
  it kills it. I want to argue the story is mostly myth, and that if tomorrow someone
  posted a correct derivation of a contradiction from ZFC, the actual consequences
  would be boring.


  First point. Classical logic has explosion: from a contradiction, everything follows,
  so in an inconsistent system every sentence is a theorem. But this is a fact about
  the consequence relation, not about what mathematicians would do. Nobody would start
  publishing proofs of 1 = 2. What they''d do is triage: work out which proofs route
  through the contradiction and which don''t. Mathematical practice is already effectively
  paraconsistent in this sense — when a contradiction was found in early set theory,
  people didn''t conclude that 2+2=5 had been proven all along, they quarantined the
  guilty axiom and kept the rest. The formalism explodes; the practice doesn''t. So
  "the system is inconsistent" and "everything is now provable" are not the same event.


  Second point. Almost all ordinary mathematics uses a minuscule fragment of ZFC''s
  strength. Number theory, analysis, the stuff of physics and engineering — it lives
  way down in the hierarchy, far below the large-cardinal reaches where an inconsistency
  would presumably lurk. Bridges would not fall down. Your bank statement would be
  fine. The contradiction would be a problem for set theorists the way a bug in some
  obscure kernel module is a problem for the three people who maintain it.


