  2. What matters morally about deception is what the listener ends up believing —
  the harm is the false belief.

  3. Silence is fine — no duty to disabuse people of things they believe that I didn''t
  cause.

  4. Intention matters: intending to deceive is what makes it bad.

  5. A promise made under duress... hmm.


  Tensions: (1) and (2) pull apart — if harm is the false belief, lying vs misleading
  shouldn''t differ in badness; the difference must come from intention/involvement.
  But (3) says silence (letting someone keep a false belief) is fine even though the
  resulting false belief is identical. Actually (2)+(3) tension: if the harm is the
  false belief, knowingly letting someone keep a false belief you could easily correct
