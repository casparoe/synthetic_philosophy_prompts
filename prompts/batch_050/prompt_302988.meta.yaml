  ---


  I do a bit of reading in decision theory on the side (I''m actually a chemist) and
  there''s a move that shows up in literally every argument I''ve come across against
  certain kinds of preferences, and I can''t work out whether it has a name or whether
  people just don''t notice they''re making it.


  The setup, in case it matters: someone has preferences that go in a circle — they''d
  rather have an apple than a banana, a banana than a cherry, but also a cherry than
  an apple. The standard argument says a sharp operator can approach them and offer:
  give me the banana plus a penny and I''ll give you the cherry (you prefer the cherry,
  so sure), then give me the apple plus a penny for the banana, then the cherry plus
  a penny for the apple... and after three trades they''re back with whatever fruit
  they started with, minus three pennies, and this can go round and round until they''re
  cleaned out. Therefore, the argument says, the circular preferences were irrational.


  Here''s the thing that bugs me. Every telling of this I''ve found quietly builds
  in that the offers arrive one at a time and that at each offer the person looks
  only at that offer. But if the operator handed them a card up front with the whole
  itinerary — trade one, trade two, trade three — they''d just say no, I can see where
  this ends. And even without a card, once you''ve been around the loop once you can
  adopt a blanket policy of refusing anything this guy proposes, and then you never
  get pumped either. So the argument appears to need a background assumption that
  deliberation happens one choice at a time, that you can''t bind yourself to a plan,
  and that a sequence of trades is never treated as a single object you can accept
  or reject wholesale.


  Does that assumption have a name? I''ve seen plenty of names for the argument itself
  but none for what it''s leaning on. Also: is there an established name for the opposing
  stance, where the rational thing to do is evaluate the whole sequence as a package
  and commit to it in advance? And if the assumption is doing all the work, does the
  argument actually show anything about the circular preferences themselves, or does
  it only show something about agents who are unable to make and follow plans — i.e.
  is the irrationality in the preferences or in the way the choices get made? If none
  of this has an established name, feel free to propose one, but tell me what the
  boundary cases would be — e.g. what happens when the trades would be made by different
  people, or by your future self with genuinely changed tastes rather than a loop.


