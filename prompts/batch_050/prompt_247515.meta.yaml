  1. Hume''s argument succeeds: suicide can be permissible when life promises more
  pain than pleasure — no special sanctity of life.

  2. Suicide in fiction and life should generally be treated as a tragedy to be prevented
  — supports suicide prevention, crisis lines; despair is usually distorting.

  3. Autonomy: competent adults'' settled preferences about their own lives should
  not be overridden.

  4. Hume is right that there is no duty to society binding us to remain alive (no
  one is owed our continued existence) — yet the novelist also holds that a parent
  of young children may not kill themselves because of harm to the children.

  5. Belief that Hume''s argument from "the order of nature" works even though Hume
  elsewhere denies deriving ought from is.


