  2. A coin of unknown bias vs a known fair coin, $100 on heads: prefer the fair coin,\
  \ even though my best guess for the unknown coin is 50/50.\n3. But: same unknown\
  \ urn, except I get to pick which color pays off AFTER the ball is drawn? no wait,\
  \ that's trivially fine. Better: I get to name the winning color before the draw\
  \ — then I'm indifferent between urns (since 1/2 chance... actually with unknown\
  \ composition, naming a color gives subjective 50%). Hmm, with known urn it's exactly\
  \ 50%, with unknown urn subjective 50% — ambiguity averse would still prefer known\
  \ urn. Let me use the \"adversarial\" case instead: if a smirking game-show host\
  \ lets me pick the urn and color, I suddenly prefer the unknown urn because at least\
