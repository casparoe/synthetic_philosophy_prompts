  \ classic Ellsberg (prefer known 50/50 urn), but also some cases where they're fine\
  \ with ambiguity (e.g., willing to bet on unknown-urn when stakes low? Or reverse\
  \ Ellsberg preferences), and a hard-to-reconcile pair.\n\nDesign the cases:\n1.\
  \ Classic Ellsberg: urn A 50 red/50 black; urn B unknown mix of 100 red/black. Bet\
  \ on red from A vs red from B for $100: prefers A. Also prefers betting black from\
  \ A over black from B.\n2. A case where they don't care: drawing from an urn where\
  \ composition unknown but symmetric ignorance — e.g., coin flip vs unknown urn...\
  \ Actually maybe: they prefer betting on a fair coin over an unknown-bias coin even\
  \ though both have subjective 50%.\n3. A case where they prefer ambiguity: e.g.,\
  \ betting against an ambiguous urn when they suspect the house stacked it — classic\
  \ \"suspicious urn\": given choice, they'd rather pick color after seeing? Actually\
  \ the classic: if you get to choose which color to bet on after, ambiguity doesn't\
  \ matter. A good case: preferring the ambiguous urn when they get to pick the winning\
  \ color themselves, because they suspect adversarial setup.\n4. A real-life case:\
  \ choosing between a job with known salary variance vs startup with unknown odds\
  \ — maybe they prefer ambiguity there.\n5. Insurance/medical case: prefer a treatment\
  \ with a known 40% success rate over a new treatment with unknown success rate.\n\
  \nHard-to-reconcile pair: they avoid ambiguity in the urn cases but in some case\
  \ they're ambiguity-seeking (e.g., prefer betting on a sport they know nothing about\
  \ rather than a known 50/50? hmm). Or: they're fine with ambiguity when probabilities\
  \ are \"second-order\" from their own ignorance but not when it's designed/adversarial.\n\
  \nThe ask: what principle (maximin expected utility / Gilboa-Schmeidler, smooth\
  \ ambiguity model, source preference) captures verdicts, which verdict must go,\
  \ and prediction on a new case.\n\nKeep it casual, rationalist-reader voice, short-ish,\
  \ with a typo or two. Mention Ellsberg lightly — the persona knows it. Keep it focused.\n\
  \nDraft:\n\n\"Ok so I've been thinking about Ellsberg-style ambiguity aversion and\
  \ I want to know what my actual policy is, going by gut on cases. [cases with verdicts].\
  \ Is there one principle that delivers all these — maximin, smooth ambiguity, something\
  \ about adversarial vs nature-generated uncertainty — and which verdict does it\
  \ force me to give up? Also tell me what it says about [new case].\"\n\nCases:\n\
  1. Urn A known 50/50, urn B unknown composition; bet $100 on drawing red: strictly\
