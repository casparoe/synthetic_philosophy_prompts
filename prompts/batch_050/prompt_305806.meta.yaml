  I want to get clear on what makes consciousness unified, and I keep testing myself
  on split-brain cases. Here are my verdicts; I''d like you to find the principle
  (if there is one) that lies behind them.


  Case 1 — the split-screen task. A commissurotomy patient fixates on the centre of
  a screen; ''KEY'' flashes in the left visual field and ''RING'' in the right. Asked
  what he saw, he says ''ring''; meanwhile his left hand selects a picture of a key.
  My verdict: at that moment there are two centres of awareness, one per hemisphere.


  Case 2 — the same patient at home. He cooks an omelette, plays chess with his wife,
  walks the dog, and gives no behavioural sign of division. My verdict: one subject,
  going about his life.


  Case 3 — cross-cueing. After years of practice, the patient has learned to let the
  speaking hemisphere and the left hand coordinate through bodily signals — a tap
  of the tongue against the teeth, a shift of posture — so that both ''sides'' can
  contribute to a single spoken answer. My verdict: this is one subject who has learned
  a workaround, like a deaf person lip-reading — not two subjects who have merged,
  and not one subject pretending to be two.


  Case 4 — confabulation. Shown ''WALK'' in the left field only, the patient stands
  and walks; asked why, he says he wanted to stretch his legs. My verdict: one subject
  with a hole in his self-knowledge, not two subjects one of whom is doing public
  relations.


  Case 5 — divided attention in the intact. An ordinary driver carries on a conversation
  while navigating traffic he cannot afterwards recall. My verdict: one subject. Division
  of labour between processes does not by itself divide the subject.


  Case 6 — partial section. In a patient whose anterior corpus callosum is cut but
  the splenium intact, simple colour information crosses but complex shapes do not.
  My verdict: one subject, but the question feels harder; I would not stake much on
  it.


  Two tensions. Cases 1 and 2 concern the same brain: if two centres in the lab and
  one in the kitchen, unity looks task-relative, and that seems to me suspiciously
  convenient — as though the number of subjects varied with the cleverness of the
  experimenter. Cases 3 and 5 cut the other way: if cross-cueing makes one subject
  out of two by adding a channel, why doesn''t the driver''s divided attention make
  two out of one by removing one?


  So: is there a single principle of the unity of consciousness — some relation between
  experiences, or between a subject''s capacities, that must hold for experiences
  to belong to one subject — that delivers all six verdicts? Please state it precisely,
  and say which cases motivate which clauses. Then tell me what it predicts for cases
  I haven''t listed: (i) a hypothetical patient whose two hemispheres simultaneously
  perform two demanding tasks, neither monitoring the other; (ii) a patient in whom
  the section is made millimetre by millimetre over months; (iii) an ordinary person
