  has to lead a session on the phenomenological reduction. Misconceptions they''d
  bring are exactly the scientific ones: it''s solipsism, it''s Cartesian doubt, it''s
  introspectionism, "bracketing" = ignoring data.


  The type: "Ask how to teach a concept." Ask for: order of ideas (what must precede
