reasoning_summary: 'Let me pick a domain and type. "Kant''s universalizability tests"
  + "Report verdicts on cases and ask what principle captures them" seems a great
  fit — that''s essentially reflective equilibrium on Kantian maxim-testing, which
  is in the weeds but doesn''t require niche facts. The asker reports intuitions about
  which maxims fail universalizability (contradiction in conception vs. contradiction
  in will), asks for the principle.


  Alternatively Wittgenstein on religion + short story. But Kant + cases type is strong
  and well-trodden in my knowledge (no search needed).


  Design cases: the asker gives verdicts on whether various maxims are permissible,
  with at least one hard-to-reconcile pair. Classic Kantian cases: false promising,
  lying to murderer at the door, not developing talents, refusing help, maxim of convenience
  lying, "I''ll steal when it''s easy", egoist maxim, prudential lying to spouse,
  etc. Make the asker''s verdicts personal and slightly idiosyncratic, with a tension:
  e.g., they think a maxim phrased specifically ("lie on Tuesdays to tall people")
  passes universalization, which threatens the test; and they accept white lies but
  reject lying to the murderer at the door — reverse of Kant — or they think false
  promising to a bank is wrong but lying to a telemarketer is fine.


  The asker wants: what principle/test captures verdicts, which verdict must go, what
  it says about a new case (e.g., cheating on a tax form, or breaking a promise to
  someone who died, or free-riding on public transit).


  Include tension pair: e.g., verdict that "making a false promise to get a loan"
  is wrong (contradiction in conception) but "everyone breaking promises when convenient"
  world — they think it''s still conceivable, just bad — so they doubt the contradiction-in-conception
  test and prefer contradiction-in-will; but then they think letting talents rot is
  permissible which contradicts CIW... Good tension.


  Another tension: specificity problem — "I''ll lie when it''s 3:47pm and I''m wearing
  a red hat" universalizes fine, so verdicts require a principle about maxim description.


  Also a case where they''re torn: e.g., refusing to vote / free-riding, or making
  an exception for oneself on a diet, or a doctor lying to patient.


  Keep casual, one-three paragraphs, maybe a typo. No quotes needed, no web search
  needed — this is all standard Kant knowledge (Groundwork examples). Attributions:
  I can mention "the Groundwork" loosely without quotes — fine.


  Write the prompt now. Should be elaborate, casual, with framing ("I was arguing
  with my roommate", "reading group"). List ~6 cases with verdicts, at least one hard
  pair, ask for principle, ask which verdict to drop, ask prediction on unlisted case.


  Draft:


  "I''m in a reading group working through Kant''s Groundwork and we got stuck on
  the universalizability tests... Here are my gut verdicts..." Then cases:


  1. Borrowing money with a lying promise to repay — clearly wrong, and I buy that
  a world where everyone did this is somehow incoherent, promises wouldn''t exist.

  2. Neglecting my talents — I actually think this is often fine? A world of people
  who coast seems conceivable and not obviously contradictory.

  3. Refusing to ever help anyone — wrong, though I can''t see the incoherence; a
  world of non-helpers is bleak but conceivable.

  4. Lying to a murderer at the door — fine, obligatory even, Kant''s own view be
  damned.

  5. Lying to a telemarketer about whether I''m interested — fine.

  6. Lying to my spouse about how much I spent — not fine.

  7. Free-riding: hopping the turnstile when everyone else pays — not fine, but if
  I phrase my maxim as "hop the turnstile when wearing my green jacket on a Tuesday"
  it universalizes trivially, which seems like a cheat.


  Tension: verdicts 1/3 push toward contradiction-in-will over contradiction-in-conception;
  verdict 2 resists CIW; 4/5 vs 6 need a principle distinguishing lies; 7 raises the
  maxim-description problem.


  Ask: what principle (or pair of tests) captures these, which verdict must I give
  up, and what does it predict for a case I haven''t listed: making an exception of
  myself when it comes to... e.g., exaggerating a CV, or cheating on a partner "just
  once," or breaking a promise made to someone who has died.


  Also the asker can offer a tentative principle: "an act is wrong iff universalizing
  its maxim would frustrate the very purpose the act relies on" and ask to repair
  it. Maybe include lightly.


  Two-three paragraphs, casual, a typo ("definately" or "it''s" misuse). Output prompt
  only.'
