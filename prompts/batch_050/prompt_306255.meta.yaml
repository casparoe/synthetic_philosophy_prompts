reasoning_summary: 'I need to write a prompt in one of the five domains, one of the
  three types. Let me pick something interesting.


  Option: Dialetheism and paraconsistent logic + short story. Or Kalai-Smorodinsky
  bargaining solution + exam question. The K-S bargaining solution is nicely in-the-weeds
  but standard enough (Nash vs KS, monotonicity axiom, the pizza-splitting examples).


  Actually, let me think about which combination is best. The desiderata type would
  be great for deflationary theories of truth: "what must a theory of truth deliver"
  — deflationism, T-schema, generalizations ("everything the Pope says is true"),
  blind ascriptions, truth as property vs. expressive device, conservativeness, compositionality,
  McGee''s argument, liar paradox constraints. That''s rich material a model can reason
  about without web access.


  The short story type: dialetheism — a story about a world/detective where contradictions
  are true without explosion? A paraconsistent detective story where a witness''s
  testimony is contradictory and explosion would implicate everyone. That''s fun and
  injects the niche idea (explosion in classical logic: from a contradiction everything
  follows; paraconsistent logic blocks it; dialetheism says some contradictions are
  true).


  The exam question type: Kalai-Smorodinsky — question asking students to compare
  with Nash bargaining, the monotonicity critique of Nash (KS''s objection: expanding
  feasible set can hurt a player), construct an example. That''s testable and specific.
  But might lean on models knowing K-S well — small LLMs do know Nash bargaining and
  likely KS basics (Pareto optimality, symmetry, individual monotonicity, ideal point/utopia
  point). It''s a real risk but KS is fairly standard.


  I''ll go with the short story on dialetheism/paraconsistent logic, injecting the
  mechanism (explosion, LP/three-valued logic, true contradictions) so models don''t
  need to have memorized Priest. The prompt should specify constraints so it can''t
  just be generic sci-fi: e.g., the story must make the logic load-bearing — a world
  or system where "A and not-A" is true but not everything follows, characters must
  reason non-trivially with contradictions. Casual tone, role assignment, brainstorm
  first, no quotes needed.


  No web needed. Write casually, a typo or two maybe. Keep short-ish.


  Draft:


  "You''re a professional philosopher of logic moonlighting as a fiction writer. I
  want a short story (600-900 words) about dialetheism -- the view that some contradictions
  are genuinely true -- and the paraconsistent reasoning that would be needed to live
  with them.


  Quick setup for the story so it''s load-bearing rather than decorative: in classical
  logic, a single true contradiction ''explodes'' -- from A and not-A you can derive
  anything at all, so a contradictory database is useless. Paraconsistent logics (like
  Priest''s LP, where a sentence can be both true and false) block explosion. I want
  a story where characters actually have to reason this way: e.g. a detective whose
  witnesses give genuinely contradictory testimony that is (in the story''s world)
  all true, or an AI running on a legal code that contains true contradictions, where
  if it ''exploded'' it would convict everyone of everything.


  Before writing, brainstorm briefly (a few bullet points) about where the true contradiction
  in your story lives -- at the border of a sorites heap? a self-referential statute
  (''this law is not valid'')? a person who is and isn''t guilty? -- and pick the
  one where the paraconsistent reasoning does the most work. Then write the story.
  The hard part: the characters must NOT treat the contradiction as a puzzle to be
  resolved or an error to be fixed; they must accept it and keep reasoning carefully
  anyway, and the reader should be able to feel why explosion would be catastrophic
  and why their reasoning still has rules (it isn''t ''anything goes'').


  No lecturing -- no character should say ''as Graham Priest argued...''. The logic
  should show up as a practical discipline the characters have mastered. End the story
  on the one thing paraconsistent reasoning can''t give them: a way to force a verdict
  when the contradiction is the whole case."


  That''s good. Casual, role, brainstorm, niche ideas injected, no citations needed.
  Maybe add a typo. Length fine. Check: no quotes from real texts — "this law is not
  valid" is my own invented statute, fine in quotes. Actually quotation marks around
  my own words are fine.


  Trim a bit. Also the instruction says prompts should be relatively short — mine
  is moderately long but focused. Fine.'
