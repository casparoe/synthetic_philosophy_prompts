  author''s intention is not one piece of evidence among others but the thing that
  makes the text a text. (3) The critic conceded that an intender is needed for there
  to be language at all, but insisted this concedes too little to matter: once the
  words are fixed, they can do things the author never foresaw, the way a careless
  apology can come out as an insult; ''that is not what I meant'' does not change
