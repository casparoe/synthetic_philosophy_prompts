  Standard moves in the reference class problem literature:

  1. The narrowest/most specific reference class (Reichenbach''s advice: use the narrowest
  class for which you have reliable statistics). Problem: as classes narrow, statistics
  become unreliable; in the limit the class contains only the case itself.

  2. Causal relevance: choose the class defined by factors causally relevant to the
  outcome.

  3. The skeptical/dissolution move: there is no correct answer — probabilities are
  relative to description, so single-case probabilities don''t exist (frequency interpretation
  limit).

  4. Subjective Bayesian response: pick any class, conditionalize; coherence constraints
  (Dutch book) don''t pin down the class, but rationality doesn''t require uniqueness.

  5. Symmetry/randomness: require the individual be a random member of the class;
  reference class must be one from which the case is a "fair draw."

  6. Pragmatic/decision-relative: choice of class depends on the decision at hand
  and the costs of errors.

  7. Legal context: e.g., reference class problem in evidence law (Blue Bus case),
  though that''s an application.


