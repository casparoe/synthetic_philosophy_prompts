  List:

  1. Reichenbach''s rule: use the narrowest reference class for which you have reliable
  statistics. Note its known failure mode: narrowing destroys reliability, and the
  limiting case is a class of one.

  2. Causal-relevance response: choose the class defined by features that make a causal
  difference to the outcome; classes that merely correlate are gerrymandered.

  3. Randomness/symmetry condition: a class is usable only if the case can be treated
  as a fair draw from it; where we know the case differs from the average member we
  must adjust or subdivide.

  4. Dissolution: single-case probabilities do not exist; probability statements are
  about classes only, and the demand for the correct class is confused (Venn''s original
  stance).

  5. Subjectivist response: the choice of class is a matter of judgment like any prior;
  coherence constrains you only once the class is fixed, and nothing in rationality
  requires two reasoners to pick the same one.

