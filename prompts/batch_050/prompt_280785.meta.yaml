  — non-reductive physicalism, functionalism, property dualism — and does the argument
  discriminate among them, or does it hit them all equally?

  4. What does the argument imply, if anything, outside the philosophy seminar: for
  how a psychologist should describe the relation between reasons and neural mechanisms,
  or for how to think about a case where a patient''s belief that a pill will work
  produces a physical effect?

  5. Finally, is there a reading of the argument on which it has no interesting implications
  at all — for example, because it generalizes to show that no higher-level property
  (a hurricane''s, a heart''s) causes anything — and if so, is that a refutation of
  the argument or a vindication of it?


