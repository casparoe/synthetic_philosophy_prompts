  "I am drafting a chapter on mental causation for an introductory philosophy of mind
  textbook, and I need to decide how much weight to give Jaegwon Kim''s causal exclusion
  argument. As I understand it, the argument runs roughly as follows. Assume mental
  properties supervene on physical properties: no mental difference without some physical
  difference. Assume the causal closure of the physical: whenever a physical event
  has a cause, it has a sufficient physical cause. And assume a causal exclusion principle:
  if an event already has a sufficient cause, any further distinct cause is ruled
  out unless the case is one of genuine causal overdetermination. Then take any case
  of apparent mental causation — my belief that it is raining causing my hand to open
  the umbrella. The umbrella-opening has a sufficient physical cause. My belief is
  either identical with that physical cause, an additional overdetermining cause alongside
  it, or excluded from the causal story altogether. Since systematic overdetermination
  of every action looks implausible, the argument seems to force a choice between
  identifying mental properties with physical ones and accepting that mental properties
  do no causal work.


