  just treat uncertain evidence by conditioning on the proposition with a probability
  weight in a way that double-counts.


  A classic subtle confusion: thinking that when you get uncertain evidence (e.g.,
  you''re 70% sure the light is green), you should conditionalize on "the light is
  green with probability 0.7" — but that''s not an event, and Jeffrey conditionalization
  works by shifting your credence in the proposition directly to 0.7 and then redistributing.
  Another confusion: thinking Jeffrey conditionalization always preserves... or that
  you can apply it when your uncertain evidence also affects the conditional probabilities
  (rigidity fails). The rigidity condition is a nice subtle point: Jeffrey conditionalization
  is only valid when the evidence changes your credence in E without changing your
  conditional credences P(H|E) and P(H|¬E). If the evidence bears directly on H (e.g.,
  the way you learned about E also tells you about H), naively applying Jeffrey gives
  wrong answers.


