  Design commitments:


  1. Wild animal lives are probably net negative (lots of suffering, predation, starvation,
  short lives, huge offspring counts).

  2. Habitat destruction is bad because of climate change / biodiversity.

  3. Moral circle expansion: insects count.

  4. They support rewilding or something...


  Let me build a set with one or two genuine tensions, plus one apparent tension that
  dissolves:


  Commitments:

  (a) Most wild animals probably have lives that aren''t worth living — huge infant
  mortality, predation, starvation.

  (b) Insect welfare counts, and insects plausibly matter a lot because of sheer numbers.

  (c) Habitat destruction is nonetheless overall bad and should be opposed (climate,
  biodiversity).

  (d) I support rewilding / nature restoration projects.

  (e) Deaths in nature are bad in roughly the way human deaths are bad — death of
  a young animal that otherwise would flourish...


  Tensions:

  - (a) + (b): if insects count and insect lives are net-negative, habitat destruction
  that reduces insect populations might reduce suffering — tension with (c). Genuine:
  the standard motivation for (c) is preserving flourishing populations; but if lives
  are net negative, more habitat = more suffering. Unless suffering tracks density/edge
  effects etc.

  - (d) rewilding: introduces predators, increases wild populations — if wild lives
  net negative, rewilding increases suffering. Genuine tension with (a).

  - Apparent tension that dissolves: e.g., "I think death itself isn''t that bad for
  animals without future-directed desires, but I think their suffering matters" —
  combined with (a) which partly relies on death counts. Actually the apparent one:
  they say climate change matters, and climate change reduces habitat, which reduces
  wild animals, which on their view reduces suffering — so is caring about climate
  inconsistent with (a)? That dissolves if climate''s main cost is to humans/domesticated
  animals... but wait, climate change affects wild animals too. Hmm.


  Let me construct carefully:


  Ask: casual, non-academic, a typo.


  Prompt draft:


  "ok so I''ve been going down a rabbit hole about wild animal suffering and I want
  to know if my views actually make sense together or if I''m kidding myself. Here''s
  where I''m at:


  1. Most wild animals probably have lives that aren''t worth living. Reproduce in
  huge numbers, most die as babies from predation/starvation/disease, that kind of
  thing. Nature documentaries are misleading.

  2. Insects matter morally, not just the charismatic stuff, and given their numbers
  they''re plausibly most of what matters about wild nature.

  3. I''m still opposed to habitat destruction — deforestation, draining wetlands,
  paving meadows. I don''t want to be the guy who says parking lots are good.

  4. I support rewilding projects, like bringing back predators and letting farmland
  go wild.

  5. I don''t think the extinction of a species is bad beyond the harms to the individuals
  involved. Species aren''t people.


  Is this a consistent set or not? I have a vague feeling 1 and 2 cause trouble for
  3 and 4 but I can''t pin down where exactly. Tell me which commitments actually
  conflict (and what I''d have to change to fix it), and which ones only look like
  they conflict but don''t. Rank them by how serious the problem is. Don''t just say
  ''it depends on the empirical facts'' — tell me which facts it depends on."


  Now the analysis of what the tensions are (to verify the prompt has the structure
  required):


  Genuine tension 1: (1)+(2) vs (3). If most wild lives are net negative and insects
  dominate morally, then destroying habitat reduces insect populations → reduces total
  suffering → habitat destruction is arguably good. (3) without argument contradicts
  the motivation. To keep (3), you need either: habitat destruction doesn''t reduce
  suffering long-run (it increases edge habitat, suffering per capita, succession
  effects; or it shifts to smaller species with higher r-selection — actually the
  classic point: habitat loss may increase suffering via more starvation and shift
  toward r-selected species with more offspring deaths), or abandon the claim that
  habitat''s value tracks welfare of its inhabitants (intrinsic value — but (5) rejects
  intrinsic value of species... interesting interplay).


  Genuine tension 2: (1) vs (4): rewilding increases wild animal numbers and predation
  — if wild lives are net negative, rewilding adds suffering. Also reintroducing predators
  introduces predation deaths. To hold both you''d need rewilding to reduce suffering
  per area (predation reduces overpopulation starvation? — a real argument: predators
  regulate herbivore populations preventing boom-bust starvation) or rewilding is
  about something else (5 rules out species-level value... so what justifies 4?).


  Apparent tension that dissolves: (5) vs (3): you might think opposing habitat destruction
  requires caring about species extinction, and (5) denies species-level value. But
  this dissolves: you can oppose habitat destruction on individual-welfare grounds
  (the deaths caused) or climate/human grounds without valuing species. Or alternatively
  apparent tension: (1) vs "I still donate to / support conservation"... Let me pick
  the cleaner one: (5) looks in tension with (3)+(4) (conservation is about species,
  and rewilding is often framed as restoring ecosystems) but dissolves if the justification
  is individual welfare or instrumental.


  Also (1) vs (2) is consistent (insects among those net-negative lives). (2) actually
  sharpens tension.


  Maybe add commitment: "I think climate change is one of the biggest moral problems,
  mostly because of harms to animals/humans" — hmm that could add another apparent
  tension: climate change kills wild animals / destroys habitat — so if habitat destruction
  reduces suffering, is climate change good? That''s an apparent tension that dissolves
  via: climate harms humans and farmed animals, shifts ecosystems unpredictably. Could
  be good as the "apparent" one. But keep set at 5-6 items.


  Let me finalize the set:


  1. Most wild animal lives plausibly aren''t worth living (huge juvenile mortality
  etc.).

  2. Insects and other small invertebrates count morally, and probably dominate the
  numbers.

  3. Opposed to habitat destruction anyway.

  4. Support rewilding incl. predator reintroduction.

  5. Species extinction isn''t bad in itself beyond individual harms.

  6. (maybe) I think the best thing to do about wild animals, if anything, is reduce
  their suffering where cheap, not leave nature alone. Hmm.


  Actually add as apparent tension: "I eat meat / I''m not vegan" — no, that introduces
  irrelevant stuff.


  Better: keep 5. And the ask explicitly: rank tensions by severity, identify the
  apparent one.


  Also add constraint: don''t just say "it depends on empirical questions" — say which
  ones and what follows each way. Good.


  Write casually, non-academic voice, with a typo or two. Avoid academic jargon (no
  "r-selection" from the asker? They could mention "the fish that lay thousands of
  eggs" casually). Keep it non-academic.


