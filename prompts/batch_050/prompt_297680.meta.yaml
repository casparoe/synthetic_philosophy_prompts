reasoning_summary: 'Let me pick a domain and type. "Lying vs. misleading: is there
  a moral difference?" fits well with the "predict a verdict from earlier verdicts"
  type. I can invent a friend/colleague''s verdicts on earlier cases of lying vs.
  misleading, jointly consistent with multiple rules, with a new case where rules
  diverge.


  Design earlier verdicts:

  - Straightforward false assertion with intent to deceive: wrong (lying).

  - True but misleading implicature (e.g., "I was at the office" when at the office
  briefly but mostly elsewhere): less wrong / permissible.

  - Literal truth that''s deceptive via presupposition...

  - Evasion / non-answer?

  - Deception without lying via omission.


  Need verdicts consistent with multiple rules: e.g., rule A: lying is categorically
  worse than misleading (assertion-based account, Saul/Stokke). Rule B: intent to
  deceive is what matters, so lying and misleading equally wrong. Rule C: wrongness
  tracks how strongly the speaker commits / how much the hearer is induced to believe
  falsely vs. draws inference themselves.


  Cases:

  1. Says "the meeting is at 3" knowing it''s at 2, to make colleague miss it: wrong.

  2. Says truthfully "I have to get to another commitment" knowing the hearer will
  infer an important commitment, actually it''s a nap: acceptable.

  3. Answers a different question to avoid answering ("Where were you?" — "I had a
  long day"): acceptable?

  4. Says "some of my students passed" knowing all did, to mislead grant committee:
  ?

  5. Remains silent letting someone form false belief: acceptable.


  New case: deception via a true statement where the false inference is nearly automatic
  and the speaker knows the hearer treats it as an assertion-equivalent — e.g., technically
  true but exploiting a false presupposition the hearer relies on. Or a case where
  lying vs. misleading converge: telling a literal truth that, given context, everyone
  would interpret as asserting the falsehood (e.g., "Nobody saw me there" — hmm that''s
  false). Classic: the Gricean case — "There''s a gas station around the corner" when
  it''s closed. Or say "I don''t know where the cookies went" while knowing — that''s
  false if they know.


  Better new case: The speaker asserts a literal truth but one that triggers a standard
  inference nearly everyone draws, and speaker intends the false belief; rules diverge:
  intent-based rule says as wrong as lying; assertion/commitment rule says less wrong;
  "hearer''s rational inference" rule says depends on whether inference was reasonable.


  Also ask for: best guess of verdict, which rule she''s running, further case that
  would discriminate, and whether the lying/misleading moral distinction is defensible
  at all.


  Format: sections by name and order with rough lengths, role assignment, think carefully.
  Keep short-ish. No quotes needed. Write formal prompt.'
