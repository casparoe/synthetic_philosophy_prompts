  that seems to prove too much — e.g., constructing an argument that phenomenal consciousness
  has no causal role leads to absurdity about our knowledge of consciousness, or building
  an argument that seems to show we can never justifiably believe we''re conscious.


  Alternatively, photography/transparency: an argument that seems to prove we see
  through photographs would prove too much (we''d see through memory images, etc.).
  But epiphenomenalism is a classic "prove too much" setup.


  Let me construct: The asker''s friend (or study group) presents an argument that
  phenomenal consciousness is epiphenomenal, and then an extension showing we can''t
  know we''re conscious — the paradox of phenomenal judgment. Make it genuinely hard:
  premises like (1) every physical event has a sufficient physical cause; (2) consciousness
  isn''t identical to any physical property; (3) so consciousness causes nothing physical;
  (4) my judgment that I''m conscious is physical (a brain state / utterance); (5)
  so my judgment would occur whether or not I''m conscious; (6) a judgment that would
  occur regardless of its truth isn''t knowledge; (7) so I don''t know I''m conscious.
  The flaw candidates: step 5 equivocation (the judgment could be caused by the physical
  basis of consciousness, which reliably correlates — the judgment is sensitive to
  consciousness via common cause), or step 6''s sensitivity requirement. Where does
  it go wrong? Chalmers'' own response: knowledge by acquaintance, or the "constitution"
  reply — phenomenal beliefs are partly constituted by the experience. The instructive
  flaw is in (5)→(6): counterfactual independence isn''t the same as explanatory independence;
  also the causal structure: experience''s physical substrate causes the judgment,
  so the judgment covaries with experience (assuming the substrate/experience link
  is nomologically necessary). The subtle flaw: (5) says "would occur whether or not
  I''m conscious" — true in the sense that the physical events would happen, but given
  (2)''s property dualism, whether that judgment counts as a judgment *that I''m conscious*
  might depend on consciousness (content-constitution). This is a genuinely hard spot.


