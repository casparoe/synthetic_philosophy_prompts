  type works well with Moloch/multipolar traps, or expected value fanaticism, or epistocracy.
  Let me craft an argument that seems to prove too much.


  Domain choice: Moloch and multipolar traps. Construct an argument that seems to
  prove too much — e.g., an argument that all regulation is futile because of races
  to the bottom, so any attempt to fix a multipolar trap without global coordination
  is irrational, or conversely that defection is always rational so cooperation is
  impossible — concluding e.g. "no one should ever unilaterally restrain themselves"
  which proves too much (would imply never recycling, never not littering, etc.).


  Or epistocracy: argument that proves too much — if incompetent voters shouldn''t
  decide policy, then... an argument from jury analogy: we don''t let incompetent
  people serve on juries/make medical decisions, so political decisions should be
  made by experts; conclusion that seems to prove too much: parents shouldn''t make
  decisions for children? Or that democracy itself is unjustifiable including at local
  levels.


  Expected value fanaticism is a nice one: an argument that tiny probabilities of
  enormous value always dominate, concluding absurd things (Pascal''s mugging, fanaticism).
  The "prove too much" type: lay out premises like (1) rational choice maximizes expected
  value; (2) value can be unbounded; (3) probabilities can be arbitrarily small but
  nonzero; (4) so any act with tiny chance of huge payoff beats a certain moderate
  payoff; (5) iterated, you should donate everything to x-risk/lotto... conclusion
  absurd: you should pay Pascal''s mugger. Ask which premise to reject.


  Let me build the Moloch one since it''s more novel. Argument structure:


  (1) In a multipolar trap, any agent who unilaterally restrains themselves just loses
  ground to those who don''t — restraint without coordination is pure cost.

  (2) The arms race dynamics (e.g., AI development, fishing, doping in sports) are
  multipolar traps.

  (3) So no agent should unilaterally restrain in those domains.

  (4) But the same structure holds for: not littering (one person''s litter doesn''t
  matter, and everyone restraining requires everyone), voting, reducing carbon footprint,
  paying taxes honestly...

  (5) So nobody should ever restrain themselves in any collective action problem absent
  enforcement.

  (6) But clearly sometimes unilateral restraint is right (returning a found wallet?
  Hmm that''s not collective action)... conclusion absurd: e.g., it''s fine for me
  to dump trash in the park since my restraint changes nothing.


  The flaw: equivocation between competitive traps (where restraint directly transfers
  advantage to rivals — zero-sum) and threshold/public-goods problems (where contributions
  aggregate and marginal contributions have small but real expected effects). Step
  (4) lumps them together. Also there''s a subtle point: in true races to the bottom,
  unilateral restraint can be rational if it shifts norms/signals or if iterated game
  dynamics allow reciprocity.


