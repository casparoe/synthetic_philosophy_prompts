  7. Bitter coffee, which was aversive to me for years and is now a pleasure. Whatever
  pleasure is, it seems to be acquirable by habituation without any change in the
  sensation.


  My tentative principle: a state is a pleasure iff the subject wants it, at that
  moment, to continue, for its own sake. But I can see it already stumbles: the crossword
  insight is over by the time I want anything; the masochist wants the pain to continue,
