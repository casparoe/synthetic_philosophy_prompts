  Argument (built by the student for a philosophy club, conclusion absurd):


  (1) A preference is rational only if it can be represented as maximizing expected
  utility under some probability assignment (representation theorem / coherence).

  (2) Ellsberg preferences cannot be so represented (the contradiction above).

  (3) Therefore Ellsberg preferences are irrational, and rationality requires precise
  credences for everything.

  (4) But then for any event whatsoever — will it rain in Karachi on this date next
  year, will the coin in my pocket land heads if flipped in 2050 — I must assign some
  precise number and be willing to bet accordingly at the implied fair odds.

  (5) By (4), I should be indifferent between a bet on Karachi rain at my precise
  credence and a bet on a known-probability device at the same number; refusing the
  Karachi bet while accepting the device bet is exactly the Ellsberg pattern, hence
  irrational by (3).

  (6) But virtually all real decisions (career, marriage, moving) are Karachi-type,
  not device-type. So rationality demands I treat all my life decisions as if they
  had precise known odds — which seems to demand something psychologically impossible
  and to make "risk" and "uncertainty" a distinction without a difference.

  (7) That can''t be right; something in the chain must give. Where?


  Where''s the flaw? Candidates: (1) the move from representation theorems to normative
