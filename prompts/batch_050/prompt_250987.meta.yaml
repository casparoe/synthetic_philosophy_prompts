  Classic Ellsberg setup: urn with 90 balls, 30 red, 60 black or yellow in unknown
  proportions. Bet A: win if red drawn. Bet B: win if black drawn. People prefer A
  over B (30 known vs 0–60 unknown). Also prefer "black or yellow" over "red or yellow"
  (60 known vs 30–90 unknown). These preferences violate the sure-thing principle
  / can''t be represented by any single probability distribution (since P(red) > P(black)
  implies P(red)+P(yellow) > P(black)+P(yellow), contradicting second preference).


  Now the "proves too much" argument: Something like — my uncle/friend argues that
  because of Ellsberg-type behavior, all decisions under uncertainty are irrational
  unless we have objective probabilities, so e.g., you should never buy insurance,
  never vote, never invest... Or an argument purporting to show that ambiguity aversion
  is inconsistent, and that therefore anyone who exhibits it should be exploitable
  via a Dutch book / money pump, and since money-pumping people is impossible to do
  universally... hmm.


  A classic line: ambiguity aversion leads to violations of dynamic consistency —
  an ambiguity-averse person can be turned into a money pump (there''s literature:
  Machina''s arguments, e.g., dynamic inconsistency of ambiguity aversion). Machina
  (1989) argued dynamic choice under non-expected-utility leads to inconsistencies;
  there''s also the "money pump" argument against ambiguity aversion.


  Alternatively construct: An argument that ambiguity aversion is actually rational
  because it protects against asymmetric information (the counterparty knows something),
  but this proves too much: it would mean you should refuse to trade with anyone ever,
  or refuse any bet offered, which is absurd. Where does it go wrong?


  Let me draft an argument with numbered premises:


  (1) Whenever someone offers you a bet on an event whose probability is unknown to
  you, the fact that they offer it is evidence they know more than you (adverse selection).
  (2) If they know more, the bet is on average unfavorable to you. (3) So you should
  decline every offered bet on ambiguous events. (4) But insurance, employment contracts,
  and stock purchases are all bets on ambiguous events offered by better-informed
  counterparties. (5) Declining all of those is absurd — nobody can live that way.
  (6) Therefore ambiguity aversion is irrational / the Ellsberg preferences are not
  normative.


