  ---


  I''m a high school senior, and our school runs a small philosophy-and-economics
  society that meets after class. Last week our faculty advisor introduced us to the
  Ellsberg paradox: you face two urns, the first containing exactly 50 red and 50
  black balls, the second containing 100 red and black balls in an unknown proportion,
  and most people strictly prefer to bet on a color drawn from the first urn — even
  though, by symmetry, a draw from the second urn seems to give each color probability
  one-half as well. My friend and I stayed late and tried to turn that observation
  into an argument, and we ended up somewhere we don''t want to be. Here is where
  we landed:


  (1) Rational preferences over bets are preferences that can be represented as maximizing
  expected utility relative to some single probability assignment over the relevant
  events.

  (2) The usual Ellsberg pattern — preferring a bet on red from the known urn to a
  bet on red from the unknown urn, while also preferring a bet on black from the known
  urn to a bet on black from the unknown urn — cannot be so represented, since the
  first preference requires assigning red a higher probability than black and the
  second requires the reverse.

  (3) So the Ellsberg pattern is irrational, and rationality requires holding precise
  credences — one definite number — for every event you might bet on.

  (4) But the events of real life — whether a particular friendship will last, whether
  a particular career will suit me, whether it will rain on graduation day — are all
  ''unknown urn'' events: nothing in the world fixes their frequencies the way a composed
  urn does.

  (5) By (3), then, I am rationally required to assign each of these a precise number
  and to be exactly as willing to stake my future on them at the implied odds as I
  would be to stake it on a coin toss at matching odds; anyone who hesitates, who
  would rather take the ''known'' gamble than the life gamble, is simply irrational
  in the way the Ellsberg choosers are.

  (6) That conclusion seems to flatten a distinction that any sane decision-maker
  must respect, and it demands something psychologically impossible, since I cannot
  summon a precise credence for most of these events by an act of will.

  (7) Something in the chain must therefore be rejected — but my friend and I disagree
  about which link, and every candidate we test seems to cost more than we expected.


  Which premise or step should we give up, and what does giving it up actually cost?
  If we have to keep something, I''d most like to keep (2) and (6); my friend would
  most like to keep (1). Please explain why the step you reject looked innocent in
  the first place, and what the main positions in this neighborhood — strict probabilism,
  and the models that let agents be ambiguity-averse — each have to pay. End your
  response with a final line of the form \answer{...} containing the number of the
  premise or step you reject.


