  Design: The asker, a longtime rationalist blog reader (LessWrong/EA forum style),
  encountered a summary — say, in a friend''s blog post or a podcast shownotes or
  an unnamed Substack — of what Mill''s utilitarianism demands, centered on that passage.
  The summary makes plausible claims with one or two subtle misrepresentations.


  Summary draft (by unnamed author): e.g., "a post on a philosophy Substack" summarized
  Mill''s position as: "Mill''s utilitarianism requires you to treat your own happiness
  as exactly one data point among billions — a ''disinterested and benevolent spectator''
  gives no special weight to their own projects — so the much-criticized demandingness
  of utilitarianism isn''t a modern misunderstanding; Mill states it plainly. The
  only out he offers is that since motive doesn''t matter to the morality of an action,
  you needn''t feel impartial benevolence, so long as you act as the spectator would
  — which means the demandingness is, if anything, worse than critics say: total impartiality
  in conduct, with no room for supererogation."


  Embedded subtle misrepresentations:

  1. Conflation of Mill''s criterion of right action (impartiality in the standard)
  with a required decision procedure/motive — the summary half-acknowledges the motive
  distinction but then says "you must act as the spectator would," i.e., treat direct
  hedging as ruled out. Actually Mill''s impartiality line is about the standard,
  and elsewhere he distinguishes rules of action from motives and notes most actions
  rightly proceed from other motives. The summary''s claim that Mill offers "no room
  for supererogation" — Mill does leave room via secondary principles, the distinction
  between moral duty and the expediency of praise/blame, "multiplication of happiness
  is the object of virtue," etc. Also Mill''s own view on what morality properly demands
  (ch. 5: duty tied to what may be exacted, wrongdoing = what deserves punishment)
  cuts against reading the ch.2 impartiality passage as imposing maximal demands in
  the enforceable-duty sense.

  2. Overstatement: "gives no special weight to their own projects" — Mill says "as
  between his own happiness and that of others" impartial, but that''s about happiness
  units, not about abandoning personal projects; Mill elsewhere allows agent-relative
  permissions in practice via secondary rules and notes the "multiplication of happiness"
  needn''t be the motive of every act.

  3. "Mill states it plainly" — the passage is about the standard of right, and whether
  Mill''s actual system is maximizing-demanding is contested (act vs rule interpretations,
  sanction theory of duty in ch. 5).


  The asker asks: which parts fair, which not, does the conclusion (demandingness
  is baked in and worse than advertised) survive a careful reading, what would a defender
  of Mill object to?


