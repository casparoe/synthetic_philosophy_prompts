  if all causality were natural, no series could be complete, since every cause would
  require a prior cause, and no sufficient explanation would exist. The antithesis
  argues that a free cause would be lawless and hence could never be encountered in
  experience, violating the conditions of possible experience.


  Kant resolves the antinomy by showing that both thesis and antithesis are false,
  since both rest on treating the world of appearances as a world of things in themselves.
  Once we adopt transcendental idealism, we see that appearances exist only in our
  experience, so the demand for an unconditioned cause cannot be satisfied. However,
  Kant then argues that freedom can be assigned to the noumenal self while determinism
  governs the phenomenal self. Because the intelligible character is not subject to
  temporal conditions, an action can be empirically determined and yet transcendently
  free. This establishes that human beings actually possess free will, since the moral
  law requires it, and thus the conflict between freedom and nature is fully dissolved."


