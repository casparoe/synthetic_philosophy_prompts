  story where female infanticide is presented as right, "Gisele" example from Tamar
  Gendler — but I shouldn''t name-drop too specifically without verification; can
  describe generically). Also imaginative resistance re: impossible things (round
  squares), evaluative claims vs. descriptive claims, "fictionality" of moral truths.
  Walton, Gendler''s puzzle: double problem — why can''t we imagine, and why won''t
  we.


  Let me craft verdicts as a real reader:


  1. A fantasy novel where pain is pleasurable / where people have different physics
  — easy.

  2. A story in which a world works such that torture of innocents is simply morally
  right — resistance; the reader feels the author got morality wrong rather than succeeded
  in creating a world.

  3. A story where 2+2=5 is true in-world — strong resistance, maybe impossible.

  4. A story where a character does terrible acts but the narrator calls them "brave"
  — resistance to the narrator''s evaluation though events are imaginable.

  5. Historical fiction that asks us to accept, in-world, that a real atrocity was
  justified — resistance but less than abstract moral inversion? A pair: (a) a story
  in which slavery is presented as morally fine within a slaveholding world, told
  from a slaveholder''s perspective — many readers can go along in a constrained way;
  (b) a story in which gratuitous cruelty to children is presented as good — hard
  block. Or the contrast between morally deviant worlds that are richly developed
  vs. flat assertions: "and so, in that land, cruelty was the highest virtue" stated
  flatly vs. embedded.


  Another interesting pair: can imagine a world where lying maximizes happiness and
  hence is right (circumstances change moral facts) vs. cannot imagine a world where
  the very same acts, same circumstances, are right when they''re wrong — distinguishing
  "morality varies with circumstances" (fine) from "morality itself differs" (resistant).


  Also: fiction about one''s own actual beliefs — a novel asserting that the reader''s
  own deepest conviction is false in the fiction. Or: poetry/jokes — we accept deviant
  evaluations in comedy more easily. Genre effects: satire vs. realist fiction.


