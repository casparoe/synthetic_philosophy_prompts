  pair, asks for principle(s) capturing them — candidates might be: impossibility-based
  (we resist imagining impossibilities), authority-based (author can''t legislate
  evaluative facts), phenomenological (we can imagine but won''t — Gendler''s distinction),
  make-believe structure. Ask: state principle(s) precisely, which clause each case
  motivates, verdicts on further cases the asker hasn''t considered (e.g., unreliable
  narrators, genre conventions, "exportation" of moral beliefs from fiction), and
