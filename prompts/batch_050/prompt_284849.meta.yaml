  A good combination: "imaginative resistance" with the verdicts-on-cases type. The
  asker reports gut verdicts on which fictions they can and cannot imagine themselves
  into — e.g., accepting that in a fictional world magic works, but balking at a story
  where cruelty is simply good, etc. Ask what principle captures the pattern, test
  against hard cases, request what would change the answer''s mind.


  Need concreteness, a hard-to-reconcile pair, polish, no quotes needed (avoid verbatim
