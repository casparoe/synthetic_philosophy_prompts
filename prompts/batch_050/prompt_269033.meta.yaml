  \ role: what it follows from and what follows from it. (2) A claim's inferential\
  \ role is fixed by the totality of inferences its speaker is disposed to make with\
  \ it. (3) No two speakers share all those dispositions — I infer \"Fido is a dog\"\
  \ from different stuff than my neighbor does, and we each endorse inferences the\
  \ other would reject. (4) So no two speakers ever use a sentence with the same inferential\
  \ role, hence the same meaning. (5) Genuine disagreement requires both parties to\
  \ mean the same thing by the disputed sentence while affirming and denying it. (6)\
  \ So genuine disagreement between different people is impossible. (7) But it obviously\
  \ happens. (8) So meaning isn't inferential role. Which premise do I reject, and\
