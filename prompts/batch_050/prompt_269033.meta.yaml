  \ things); (6) disagreement exists; (7) so meaning isn't inferential role. Ask which\
  \ premise to reject and the cost. The subtle flaw: equivocation between whole inferential\
  \ role and core/material inferences, or between meaning-constituting vs collateral\
  \ inferences. Brandom's response: anaphoric/de re attributions, scorekeeping. Good.\n\
  \nNeed casual tone, maybe typo, committed response request, keep short. No quotes\
  \ needed — no web needed.\n\nWrite it: \"Here's an argument from my reading group...\"\
  \ Numbered premises. Asker says which they'd rather keep, asks which premise to\
  \ reject, what it costs, and asks for a committed verdict.\n\nMake it hard: the\
