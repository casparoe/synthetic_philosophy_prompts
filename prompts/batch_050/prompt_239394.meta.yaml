  Draft:


  I teach a second-year undergraduate course in medieval philosophy and am grading
  the final examination. The question below was worth 20 marks, answered in roughly
  45 minutes under closed-book conditions. Please grade the answer: assign a mark
  out of 20, and provide the specific comments that justify it, proceeding point by
  point through the answer (identifying what is correct, what is imprecise or mistaken,
  and where the argument does or does not follow). Where you take off marks, say exactly
  which sentence or claim prompts the deduction. I have not included a marking scheme;
  use your own judgment about what a strong answer to this question requires.


  Examination question:

  "In Book V of the Consolation of Philosophy, Boethius confronts an apparent conflict
  between divine foreknowledge and human freedom. Set out the problem as he understands
  it, explain how his account of God''s eternity is supposed to dissolve it, and briefly
  assess whether the solution succeeds."


  Student''s answer:


  [paragraph 1 — the problem]

  Boethius raises the problem from the prisoner''s perspective: if God knows in advance
  everything that will happen, and divine knowledge cannot be mistaken, then what
  God knows must come about; and if it must come about, then human beings do not act
  freely, so that praise and blame, reward and punishment, and even prayer lose their
  point. There is also a problem in the other direction: if future events are genuinely
  contingent, then it seems God''s beliefs about them could turn out false, which
  is impious. Either God does not know the future, or the future is necessary.


  [paragraph 2 — knowledge does not cause; mode of knower]

  Boethius first denies that foreknowledge causes what it knows. Knowing something
  is not what makes it happen, any more than my seeing a man walk makes him walk;
  the cause of the walk is the man''s will, and my knowledge merely follows it. More
  generally, Boethius holds that a thing is known not according to its own mode but
  according to the mode of the knower, so we cannot assume God knows things in the
  temporal way we do.


  [paragraph 3 — eternity; subtle mistake 1]

  The decisive move is the account of eternity. God''s eternity, Boethius says, is
  not simply life without beginning or end; it is the whole, simultaneous, and complete
  possession of an unending life, in which nothing passes away and nothing is still
  to come. Because God possesses all of his life at once, his knowledge is not foreknowledge
  in our sense at all: he does not learn of events before they happen, since for him
  nothing is before or after. Rather, his eternal life extends alongside the whole
  of time, so that he is present to each event as it occurs and sees every moment
  of history in a single, unbroken now.


  Hmm — "extends alongside the whole of time, so that he is present to each event
  as it occurs" — this is the omnitemporality gloss. Slightly inconsistent with "nothing
  is before or after" just stated. A hasty grader might read charitably ("present
  to each event" ≈ eternal present). The precise error: "extends alongside the whole
  of time" misdescribes timeless eternity as a kind of duration parallel to time.
  Good.


  [paragraph 4 — present vision and necessity; subtle mistake 2]

  From this Boethius concludes that future events are present to God the way the present
  is present to us. He illustrates this with two things seen at once, a man walking
  and the sun rising: one happens voluntarily, the other necessarily, yet both are
  seen in the same vision. This lets him distinguish simple necessity, which belongs
  to a thing by its nature, from conditional necessity: if God knows that something
  will happen, then it will happen, but it does not happen of its own nature; it is
  necessary only relative to God''s knowledge of it. So God''s knowledge being what
  it is, what he knows necessarily comes to pass — but because this necessity is conditional
  rather than simple, Boethius takes our freedom to be preserved, and with it the
  justice of reward and punishment.


  Error: "what he knows necessarily comes to pass" — the slide. Also arguably the
  phrase "it is necessary only relative to God''s knowledge" is fine; the final clause
  is the conflation. A grader should flag that conditional necessity does not license
  "necessarily comes to pass" simpliciter; Boethius''s point is that the event remains
  contingent in itself.


  [paragraph 5 — assessment]

  As for whether the solution works: it depends on accepting that God is outside time
  altogether. If that is coherent, then the problem as Boethius set it up — knowledge
  in advance — no longer arises, and I think he succeeds on his own terms. One might
  still doubt whether a timeless God can act in history or respond to prayer, but
  Boethius''s account at least shows that foreknowledge and freedom do not contradict
  each other.


