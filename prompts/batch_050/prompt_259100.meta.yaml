  Request: say what would change its mind.


  Let me pick quantum suicide/immortality — that''s fun for a software engineer. Construct
  an argument with numbered premises that seems to prove too much. E.g., an argument
  that under many-worlds, you should be indifferent to mortal danger, or that risk-taking
  is rational... Classic: quantum suicide argument that you should never fear death,
  or that the many-worlds interpretation implies subjective immortality.


  Construct: a friend argues quantum immortality proves too much — like, it also implies
  you should bet everything on lotteries, or never bother with safety. Or an argument
  whose conclusion is absurd: "you are immortal, therefore nothing you do matters"
  or something.


  Let me design the argument carefully with a subtle flaw (e.g., equivocation between
  "a branch where I survive exists" and "my future experience continues in that branch";
  measure/weight of branches; the assumption that experience requires only the existence
  of a surviving copy; or the conflation of first-person survival with branch existence).


  Argument draft:

  1. If MWI is true, then for any event with nonzero amplitude of survival, there
  is a branch in which I survive.

  2. My future experiences are whatever happens in the branches where I exist (or:
  I can only experience branches where I''m alive — the "only living branches are
  experienced" premise).

  3. So whatever I do, I''ll experience survival (subjective immortality).

  4. If I''m guaranteed to experience survival no matter what, then the risks of an
  action can''t count against it — costs only matter if I might experience them, and
  by (3) I never experience death.

  5. So a rational Everettian should take arbitrarily large risks for small gains
  (e.g., quantum Russian roulette for $100).

  6. That''s absurd — no sane decision theory advises that.

  7. So either MWI is false or something above is wrong.


  Where''s the flaw? Step 4 conflates "I will experience survival in some branch"
  with "the probability/measure of bad outcomes for me is zero." Decision theory cares
  about the measure-weighted expected utility across branches, not about which branches
  exist. The existence of a surviving branch doesn''t erase the (high-measure) branches
  where loved ones grieve, you suffer injury (non-lethal harm still experienced!),
  etc. Also quantum suicide thought experiment ignores non-death bad outcomes (maiming).
  The subtle move: premise 2 ("you only experience branches where you''re alive")
  may be okay, but step 4 equivocates between "experience of death" and "badness of
  outcomes" — you never experience being dead, but you do experience the lead-up,
  and branches where you''re maimed. Also measure: decision-theoretic rationality
  under MWI typically weights by branch measure, so the surviving branch has tiny
  measure.


  Also premise 3''s "I''ll experience survival" — identity across branches issue:
  the survivor in the branch is a copy/descendant; whether that''s "you" is contested.


  I should present it as the engineer''s own/friend''s argument, casual, with a typo.
  Ask: which premise to reject, what rejecting it costs, and — per epistemic request
  — ask the answer to say what would change its verdict / where its reasoning is most
  likely to fail.


  Keep it self-contained; no citations needed. Quantum suicide (Tegmark) — don''t
  need names; maybe mention "the guy with the quantum gun" informally without attribution.
  Avoid quoting anything.


  Length: similar to examples. Write casually.'
