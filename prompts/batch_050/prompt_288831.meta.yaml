  handicap principle" with "Report one''s verdicts on a set of cases and ask what
  principle captures them." That''s a great fit: cases of signals in everyday life,
  verdicts on which are honest/costly, ask for principle.


  Cases: peacock''s tail, luxury watch, degree from elite university, expensive wedding,
  buying rounds at a bar, apology requiring sacrifice, burning money at a protest,
  tattoo, vegan diet, etc. Give verdicts: some signals are credible because costly,
  some seem cheap but still credible (uniforms? diplomas are costly in time), some
  costly but not credible (burning money?) — handicap principle says waste advertises
  quality; Zahavi vs Maynard Smith (costly signals need not be wasteful — differential
  costs).


  Make it formal/polished. Cases should include hard-to-reconcile pairs. Verdicts
  as a real person: mostly sensible, one tension.


  Design: asker''s verdicts about which displays credibly signal something:


  1. Peacock''s tail credibly signals genetic quality: yes.

  2. A job candidate''s college degree credibly signals diligence/intelligence even
  if the content is useless: yes.

  3. A luxury watch signals wealth: yes, because faking it is ruinous for the poor.

  4. A friend who drives across town at 3am to help signals loyalty: yes — costly
  in time.

  5. An expensive, elaborate wedding signals commitment: asker is unsure/no — the
  cost is paid by parents or jointly, and lavish weddings correlate with divorce (maybe
  avoid empirical claim; just verdict: doesn''t signal).

  6. Burning cash on camera to signal wealth: costly but signals nothing / signals
  foolishness — tension with watch.

  7. A company''s expensive Super Bowl ad signals product quality (money-burning/correlated
  with good products because repeat business): yes.

  8. Apology with restitution signals sincerity: yes; apology alone: no.

  9. A firm degree from a correspondence school — no.

  10. Tattoos / military scars.


  Tension: watch vs burning cash — both costly in money, one signals and one doesn''t.
  Degree: costly but everyone can take loans — cost isn''t differential? Also 3am
  drive is costly in effort, not waste; Maynard Smith''s point that signals need only
  be differentially costly, not wasteful. Wedding case: costly yet not credible.


  Ask: what principle captures these? Zahavi''s handicap principle says waste itself
