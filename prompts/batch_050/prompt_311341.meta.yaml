  I am a doctoral student in philosophy of biology, and for the past two years I have
  been following the dispute over whether holobionts—hosts together with their symbiotic
  microbiota—are themselves organisms or biological individuals, and I have come to
  suspect the debate is stalled in a structurally interesting way. As far as I can
  tell, both camps agree on essentially all the empirical facts: that many symbionts
  are horizontally acquired and genetically heterogeneous; that hosts and microbes
  nonetheless depend on each other developmentally, metabolically, and immunologically;
  that the squid–vibrio and aphid–Buchnera systems sit at opposite ends of a continuum
  of integration. Yet one camp, reasoning from evolutionary criteria—fitness alignment,
  reproductive bottlenecks, suppression of internal conflict—concludes that the holobiont
  is an ecological community rather than an individual, while the other, reasoning
  from physiological and developmental integration, concludes that it is a functionally
  unified whole whose boundaries can be drawn by immune and metabolic continuity.
  Nobody moves.


  My working hypothesis is that this is not really a disagreement about holobionts
  at all, but about which explanatory project the concept of an organism is for: an
  evolutionary project that wants units of selection and adaptation, versus a physiological
  project that wants bearers of health, function, and self-maintenance—and that each
  camp treats its own project as the one the concept must serve. A related suspicion:
  organism functions as an honorific, a status that licenses functional and normative
  talk (health, interests, adaptation), so the real dispute is about which entities
  deserve that treatment.


