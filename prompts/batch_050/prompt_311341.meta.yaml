  or two questions under one heading? Test your diagnosis against neighboring cases
  where the same criteria seem to be applied without controversy—eusocial insect colonies,
  the Portuguese man o'' war, volvocine algae, lichens—and ask whether the camps are
  even internally consistent. And given your diagnosis, say what progress would look
  like: a formal criterion, an agreed empirical discriminator, a principled pluralism,
  or an argument that the impasse shows the question is ill-posed.


