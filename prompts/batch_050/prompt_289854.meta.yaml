  differ between groups and prediction is imperfect, the mature response is to choose
  deliberately which criterion the context calls for, document the choice, and monitor
  it. The second reviewer — call him the proceduralist — holds that the impossibility
  is not a scheduling problem among metrics but a reductio of the whole approach:
