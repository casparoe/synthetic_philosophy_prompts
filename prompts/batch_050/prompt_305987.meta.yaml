  ---


  I retired from bench science (biochemistry) three years ago and have been using
  my free time to catch up on philosophy, which I skipped entirely in my training.
  I want you to act as a professional philosopher of biology — think carefully, brainstorm
  a bit before committing, and be honest about where you''re not sure.


  I read an article in a general-audience philosophy magazine about the debate over
  biological functions, and I want to know how much of it to trust. It says:


  ''Philosophers have two main theories of what "function" means in biology. On the
  causal-role theory, a part''s function is just whatever it actually does that contributes
  to the organism — the heart''s function is pumping blood because that''s the effect
  it produces. The problem is that this makes function-talk subjective, since which
  effects count as contributions is a matter of what we happen to be interested in,
  and it also can''t make sense of malfunction: if a diseased heart stops pumping,
  then pumping simply isn''t its function anymore, so nothing counts as going wrong.
  The rival etiological theory says a trait''s function is whatever past natural selection
  explains its presence — hearts are here because they pumped, so pumping is their
  function. But this theory has problems of its own: it means you can''t say what
  a trait''s function is without first knowing its evolutionary history, which reduces
  most of physiology to guesswork, and it implies that a molecule-for-molecule copy
  of a heart that came into existence by sheer accident would have no function at
  all, which is absurd on its face. Since neither theory survives scrutiny, the honest
  conclusion is that function-talk is a leftover of thinking of nature as designed,
  and biologists should drop the word from serious work.''


  Something about the last move bothers me — I used "function" every day for decades
  and it never felt like theology — but I can''t tell whether my discomfort is with
  the article''s reporting of the theories or with the theories themselves. Please
  go through it piece by piece: which parts would defenders of each theory accept
