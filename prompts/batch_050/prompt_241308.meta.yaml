  and foraging as organismal physiology. In my experience the analogy is rarely offered
  as a mere flourish. It is made to do argumentative work: to license the claim that
  natural selection has shaped colonies just as it shaped bodies, that workers are
  organs rather than individuals, that conflict within a colony (laying workers, say)
  is a pathology on a par with cancer, and that the colony is therefore an organism
  in whatever sense philosophy should care about.


