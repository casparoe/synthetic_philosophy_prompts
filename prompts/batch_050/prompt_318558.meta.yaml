  The slogan type seems rich. Slogans per domain:


  - Heidegger: "to the things themselves" (Husserl actually), "the world worlds",
  "equipment withdraws"... A slogan like "the hammer shows itself only when it breaks"
  — paraphrasable.

  - Virtual worlds: "virtual rape is real harm", "the virtual is not the unreal" —
  that last one is a nice slogan. Common in virtual reality philosophy (Chalmers:
  virtual reality is genuine reality; "virtual doesn''t mean fake").

  - Musical works: "the music is not the score", "recordings are the real work" —
  "the score is not the music" is a nice slogan.

  - AI honesty: "LLMs can''t lie because they can''t intend" — slogan-ish.

  - Free-floating rationales: "reasons without reasoners".


  "Virtual doesn''t mean fake" is a good slogan for the slogan-disambiguation type.
  It can mean several things: (1) virtual objects are real objects (reality of the
  digital), (2) virtual harms are real harms (morally), (3) virtual entities are sui
  generis irrealia but interactions have real consequences, (4) virtual experiences
  are real experiences (experiential realism), (5) ontological claim: virtual objects
  exist in the same sense as physical ones. Distinguish platitudes (real experiences
  happen) from contentious (virtual objects are full-fledged real) from false claims.


  The prompt should have the asker say where they met the slogan and what work it
  was doing. E.g., an online gaming context — a friend whose in-game items were stolen/destroyed,
  or harassment in VR. Say the asker is a gamer / moderator of a virtual community;
  someone stole a rare item or destroyed their build, and when they complained someone
  said "virtual doesn''t mean fake" — or conversely someone dismissed it with "it''s
  not real, log off". Actually the slogan doing work: in an argument about whether
  a virtual harm matters, someone deployed "virtual doesn''t mean fake."


  Also could combine with fiction reading... but slogan type fits well.


  Need 1-3 paragraphs, casual, maybe a typo, personal relevance, elaborate. Should
  inject some novel-ish framing: list readings as a menu with verdicts — platitude/substantive/false,
  and which reading supports the use in the argument. Also can ask about edge cases:
  does the reading generalize from virtual objects to virtual harms? Distinguish "real"
  senses: real as existent, real as non-illusory, real as morally significant, real
  as causally efficacious.


  No verbatim quotes needed — "virtual doesn''t mean fake" is a commonly repeated
  slogan, can be given without attribution. No need to cite Chalmers explicitly; can
