  ---


  I''d like your help refereeing a dispute I overheard between two members of my fiction
  workshop, Elena and Marcus. Please act as a philosopher of art with particular expertise
  in the philosophy of fiction. Before giving your verdict, first map out the strongest
  version of each position and then work through the exchange point by point.


  Background: Elena circulated a short story told from the viewpoint of a village
  elder in a harsh fictional society. The narration presents it as simply true and
  good, in the world of the story, that exposing surplus infants on the hillside is
  an act of generosity, and the story''s emotional climax depends on the reader feeling
  the nobility of one such exposure. Most of the group could not feel it, and the
  climax fell flat. The disagreement was about what this failure shows.


  (1) Elena''s position: The failure is in the story, and it''s an aesthetic failure.
  Fiction enjoys a kind of authority — whatever the narrator asserts becomes true
  in the fiction — but that authority has limits, and moral evaluations presented
  as straightforwardly true are at the limit. A reader who cannot make herself imagine
  that cruelty is generosity is like a reader who notices a plot hole: the text asked
  for something it hadn''t earned. Just as an author can fix an implausible plot twist
  by laying groundwork, she can fix this by laying moral groundwork — showing the
  practice through the characters'' eyes, building the world so the evaluation feels
  inevitable — so the defect is a craft defect, and my job as a critic is to point
  at the missing groundwork.


  (2) Marcus''s reply: That proves too much. We grant fiction authority over physics
  (dragons, time travel) and over bizarre social arrangements all the time, and readers
  of older literature routinely inhabit moral worlds they reject — Greek epics, say
  — without the stories failing aesthetically. What varies is the reader''s moral
  investment, not the story''s authority. The same story would land for a reader with
  different priors, and probably did land for members of some real historical society.
  So the flatness you felt is a fact about you and your moral convictions — a refusal,
  maybe even a virtuous one — but not an aesthetic defect in the text. Calling it
  a defect conflates moral disagreement with aesthetic failure.


  (3) Elena''s counter: The dragons comparison misses the asymmetry. Nobody resists
  dragons because nothing hinges on dragons being true outside the story; we resist
  the infant exposure precisely because the story wants us to export the evaluation
  — to feel, here and now, that something noble occurred, and to carry a little of
  that feeling back out of the fiction. Resistance spikes exactly when a fiction claims
  authority over what we''re supposed to feel and think in actuality. That''s why
  genre matters too: put the same practice in a story clearly framed as one character''s
  deluded outlook and nobody balks. So it''s not my moral priors doing the work; it''s
  the story''s bid to govern my actual responses, and a story can fail at that bid
  the way an argument can fail to persuade.


  (4) Marcus''s counter: But then your view collapses into mine. If the defect is
  that the story asks me to endorse something I won''t endorse, then whether it is
  a defect still depends on me — on my refusal — and a reader disposed to accept the
  evaluation will find no flaw. You''ve merely relocated the subjectivity from ''the
  reader refuses'' to ''the story demands and the reader refuses.'' And your craft
  remedy cuts against you: if groundwork can always in principle earn the authority,
  then there''s nothing special about morality — no principled limit, just harder
  cases, which is my position.


  They''ve both asked me to rule on it and I keep flip-flopping. Please adjudicate:
  assess each of the four moves — where it succeeds, where it overreaches, and where
  it concedes too much — and say who is more right overall, or whether the disagreement
  dissolves once a distinction (e.g., between what is true in the fiction and what
  the fiction asks us to feel) is drawn. Also say what, if anything, both are missing.
  Finally, indicate how confident you are in your overall verdict and in each move-by-move
  assessment, and single out the one claim in your own analysis you are least sure
  of.


