  Draft:


  "Searle distinguishes original (or intrinsic) intentionality from derived intentionality.
  Original intentionality belongs to mental states themselves: my belief that it is
  raining is about rain no matter what anyone thinks about me. Derived intentionality
  belongs to things like words, pictures, maps, and thermostats: the word ''rain''
  is about rain only because language users interpret it that way; the thermostat''s
  states ''mean'' the temperature only relative to us. Searle supports this with the
  Chinese Room. A man who speaks no Chinese follows a formal program for manipulating
  Chinese symbols and produces answers indistinguishable from a native speaker''s,
  yet understands nothing. Since the man implements the whole program and still doesn''t
  understand, Searle concludes that running a program is never sufficient for understanding,
  and so no computer could ever have genuine understanding, whatever it is made of
  and however it behaves.


  Dennett''s two-bitser is meant to put pressure on this. Imagine a machine built
  to accept US quarters — call it a two-bitser. Its internal state when a coin is
  inserted ''means'' something like quarter here. Now ship it to Panama, where it
  accepts quarter-balboas, which have the same size, weight, and design specs the
  machine tests for. What does the machine''s state mean now — quarter or quarter-balboa?
  Dennett argues there is no fact of the matter determined by the machine itself:
  since the machine responds exactly the same in both environments, its content is
  fixed by what it reliably responds to in its current environment, so in Panama it
  now detects quarter-balboas. And this, Dennett concludes, shows the machine does
  have a kind of original intentionality after all, because its meaning changed without
  any human reinterpreting it.


  The lesson Dennett draws is that what goes for artifacts goes for us. Our intentionality
  is itself the product of a design process — natural selection — so by Searle''s
  standards our intentionality is derived too, derived from Mother Nature rather than
  from a human engineer. Derived intentionality, Dennett says, is the only kind there
  is, and it is perfectly real.


  Does this undercut Searle? I think it does. It shows that original intentionality
  is impossible, since any content-bearing state traces back to some prior selection
  or design. Searle can insist that biological intentionality is special because it
  is produced by neurons, but that looks like an arbitrary preference for carbon over
  silicon. So the distinction between original and derived intentionality collapses,
  and with it the Chinese Room''s conclusion."


