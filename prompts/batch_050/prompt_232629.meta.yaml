  student says "no computer could ever... whatever it is made of" — Searle allows
  that a machine with the right causal powers could understand; he even says "we are
  machines." Subtle: many students write this; hasty grader might pass it. Good.


  2. Two-bitser gloss: "its content is fixed by what it reliably responds to in its
  current environment, so in Panama it now detects quarter-balboas" — conflation with
  crude causal/dispositional theory; Dennett''s actual point is that current dispositions
