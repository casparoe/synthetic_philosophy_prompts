  \ Leaves: Walton transparency, Currie/Carroll non-transparency, \"indirect seeing\"\
  \ compromise... This is niche but fairly well known in aesthetics. Might be riskier\
  \ for small models but it's a standard topic.\n\nRevealed preference is safer and\
  \ richer. Let me build the decision tree prompt.\n\nRequirements: elaborate, 1-3\
