reasoning_summary: 'I need to pick a domain and type. Options: loyalty/whistleblowing,
  Dummett immigration, Nozick tracking, Black''s spheres, IIT. Types: prioritization,
  defeaters, fairness-of-summary.


  Black''s spheres + "present a summary and ask if fair" works well — I can write
  a plausible summary with subtle misrepresentations. Black''s spheres: Max Black''s
  1952 dialogue "The Identity of Indiscernibles" — two exactly similar spheres in
  an otherwise empty universe, challenge to Leibniz''s Law (identity of indiscernibles:
  if for all properties F, Fx iff Fy, then x=y). Common subtle misrepresentations:
  conflating identity of indiscernibles (Leibniz''s Law proper) with indiscernibility
  of identicals; claiming Black "refuted" Leibniz rather than challenged; saying the
  spheres share all properties (they don''t share relational properties like "being
  to the left of"— actually in the symmetric setup they do share all intrinsic and
  relational qualitative properties, e.g., each is two feet from a sphere); claiming
  Black was a platonist etc.


  A good subtle misrepresentation: the summary says the two spheres have all the same
  properties, so by Leibniz''s law they must be one, but they''re two, so the principle
  is refuted. The subtlety: Black''s argument targets the necessity of the principle
  / whether it can be defended non-trivially; defenders respond that the spheres differ
  in properties like "being identical to this sphere" (haecceity) or that the principle
  concerns qualitative identity only. Also the spheres do share all qualitative properties.
  Another subtlety: the dialogue''s point is that you can''t defend the principle
  without circularity — you can only distinguish the spheres by naming them, which
  presupposes their distinctness. A summarizer might say "Black proved the principle
  false" whereas the dialogue ends inconclusively (A and B characters; Black presents
  it as a dialogue where the principle''s defender keeps conceding).


  Also misrepresentations: confusing identity of indiscernibles with indiscernibility
  of identicals (the converse, uncontroversial: if x=y then same properties). A textbook
  summary might say "Leibniz''s Law says if two things are identical they share all
  properties" — that''s the trivial direction. Or saying Black''s spheres differ in
  no properties at all including spatial location — actually being in different places
  is a property, but each sphere''s relational property "being at distance d from
  a sphere of diameter X" is shared.


  Alternatively, prioritization type with loyalty/whistleblowing — student in an ethics
  course writing a paper or planning a capstone. Or "defeaters" type with IIT: "I''ve
  come to accept IIT, what would count against it." IIT is good for defeaters: asker
  accepts IIT, asks what observations/arguments would count against it — e.g., grid-like
  structures with high Φ but no intuition of consciousness (cerbellum has low Φ despite
  complexity), feed-forward networks having Φ, the "unfolding argument" (Doerig et
  al.), Scott Aaronson''s expander graph objection, Φ depending on coarse-graining,
  etc. That''s a nice in-the-weeds prompt that doesn''t need web. Student in a consciousness
  course.


  The defeaters type: "I''ve come to accept IIT. Tell me what would count against
