  Personal relevance: "My campus chapter is deciding whether to push the university
  to cut ties with a supplier that uses factories in Bangladesh." Two members argue.
  Good.


  Let me draft the rounds:


  Round 1: Dana (or Sam) — sweatshop jobs are chosen over worse alternatives (subsistence
  farming, scavenging); banning/boycotting removes their best option; mutual benefit
  proves permissibility, or at least that interference is harmful.


  Round 2: Casey — mutual benefit doesn''t settle permissibility; a transaction can
  be mutually beneficial and still exploitative — a person selling their kidney cheap
  out of desperation, or a company town. Exploitation = taking unfair advantage of
  vulnerability; fairness of the division of surplus matters, not just whether both
  gain relative to no deal.


  Round 3: Dana — fairness relative to what baseline? The factory owner didn''t create
  the poverty; blaming them for the unfair background is misdirected, and pressing
  for "fair" wages above market just moves jobs to capital-intensive production or
  other countries, hurting the workers you mean to help. Also: if both parties consent
  and both gain, the transaction respects their agency; refusing to deal with them
  is treating their choice as worthless.


  Round 4: Casey — consent under desperation isn''t the kind of consent that washes;
  and there''s a difference between respecting a worker''s choice to take the job
  and participating in terms we wouldn''t accept if positions were reversed. Also,
  "we''d make it worse" concedes the argument is really about beneficence, not justice
  — and justice may require action that isn''t Pareto-improving.


  Round 5 maybe: Dana — if it''s about justice not beneficence, then justice should
