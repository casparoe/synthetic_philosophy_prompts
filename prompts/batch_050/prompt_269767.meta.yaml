  The adjudication type needs two parties making decent points over a few rounds.
  Sweatshops is a great fit: one argues boycotts harm workers (mutually beneficial
  exploitation—workers choose sweatshop jobs because alternatives are worse), other
  argues it''s still exploitation. Could inject a niche-ish twist: e.g., one party
  deploys Zwolinski-style argument, the other counters with bargaining power / complicity.
  But need it accessible without niche names.


  Alternatively Molinism: two people argue whether middle knowledge can ground providence
  — the grounding objection vs. counterfactuals of creaturely freedom being true in
  virtue of nothing. One says if there''s nothing that makes a counterfactual of freedom
  true, God can''t know it; the other says truth doesn''t need grounding in the actual
  world. That''s a decent debate. But small LLMs may struggle with Molinism. The instructions
  say inject niche ideas into the prompt rather than rely on niche knowledge — the
  prompt can explain the setup itself.


  Sweatshops adjudication: round structure. Person A: boycotting sweatshops or refusing
  to buy harms the very workers; if I buy, both gain; if I don''t, workers lose jobs
  and I lose goods — mutual benefit. Person B: mutual benefit doesn''t preclude exploitation
  — a transaction can benefit both and still be wrong if one party takes unfair advantage
  of the other''s desperate situation (analogy: charging a drowning person exorbitant
  fees). A counters: the drowning person analogy is off because the rescuer causes
  no prior harm but in sweatshops the baseline... Actually the classic objection:
  sweatshop employers offer employment, not just extract; the unfairness complaint
  should target background injustice, and refusing to trade makes workers worse off
  still. B counters: consent under duress isn''t full consent; also complicity sustains
  the system. A: refusing to trade also sustains nothing and removes the best option.
  Then a specific twist: one argues the moral objection only makes sense if there''s
  a duty of beneficence owed by consumers specifically; the other argues it''s about
  non-exploitation, a deontic constraint, not beneficence.


  That''s a good, self-contained dispute. Both sides make decent points. The bystander
  asks for point-by-point adjudication.


  Alternatively Libet: friend A says Libet shows decisions are made before conscious
