  help; demanding the factory pay more while I keep my cheap T-shirt... something
  like that.


  Then ask: adjudicate point by point — who wins on (a) whether mutual benefit shows
  permissibility, (b) the baseline question, (c) consent under desperation, (d) whether
  boycotts/pressure are counterproductive — and what both miss.


  Keep to 1–3 paragraphs. Should be moderately elaborate. Include format request:
  continuous prose only.


  Make sure the asker is neutral. No quotes from real texts needed. No citations.
  Good.


