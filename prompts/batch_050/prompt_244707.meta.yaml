  prior-sign cases, flickers, buffer cases, omission cases?), which distinctions it
  can''t collapse (moral responsibility vs free will; blame vs accountability; alternative
  possibilities vs leeway), which desiderata conflict (e.g., the "no responsibility
  without robust alternatives" vs Frankfurt intuitions), etc. Inject a novel case
