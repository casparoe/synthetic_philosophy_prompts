  Desiderata list to ask for:

  1. Handle the standard case (intervener never acts) — must say agent is responsible
  without robust alternatives, or explain away.

  2. Handle prior-sign variants (intervener keyed to a sign that precedes decision)
  — the dilemma defense: deterministic sign begs question, indeterministic sign leaves
  a flicker.

  3. Say something about flickers of freedom — whether a tiny alternative (the sign
  itself) grounds responsibility or is too thin ("robustness").

  4. Distinguish responsibility from free will — the case might show only one thing
  about each.

  5. Handle omissions (not doing something while a device would''ve prevented the
  omission? actually Frankfurt omissions cases).

  6. Handle blockage cases where the block is internal/self-imposed (tracing) — Ulysses
  contract.

  7. Not collapse blameworthiness into excusability conditions...

  8. Must be consistent with whatever view on determinism? Compatibilism neutrality.

  9. Exclusion question: which desideratum knocks out the most contenders.


  Also ask which pair of desiderata may be jointly unsatisfiable — e.g., "responsibility
