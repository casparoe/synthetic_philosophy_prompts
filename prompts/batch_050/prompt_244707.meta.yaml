  regurgitation. Keep casual, with a typo.


  Make sure not to rely on specific works/attributions. Frankfurt cases are famous
  enough; the original paper (Frankfurt 1969) is common knowledge — fine to mention
  "Frankfurt cases" generally without citing. Avoid quotes.


  Draft the prompt casually:


  "ok so i''m TAing a seminar... before we get into the lit on moral responsibility
  and Frankfurt-style cases, i want the spec first..." Include an invented scenario:
  e.g., a hiring manager who would discriminate anyway, with an intervener... Invent:
  "Dana decides to lie on her taxes; unbeknownst, a device would force her hand if
  she wavered" — that''s standard. Make it fresher: intervener that triggers on a
  reliable prior sign of the decision — that''s the prior-sign problem, standard lit.
  Maybe invent a case about collective responsibility or AI? Inject: a case where
  the intervener is the person''s own past self / their own earlier commitment — "self-Frankfurt"
  case. That''s semi-novel (like Fischer''s "Frankfurt-style cases via one''s own
  mechanism"? there''s lit on self-imposed necessity — Luther cases). I can frame:
  someone who deliberately engineered their own inability to do otherwise (Ulysses
