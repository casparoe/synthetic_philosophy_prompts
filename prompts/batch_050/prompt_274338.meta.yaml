  maximization means people always choose what''s best for them. Classic confusion:
  conflating utility as a representation of preferences with utility as well-being/pleasure;
  or thinking transitivity violations "disprove" rationality; or believing revealed
  preference shows preferences can''t be mistaken.


  Good prompt: someone asks: since revealed preference theory shows utility is just
