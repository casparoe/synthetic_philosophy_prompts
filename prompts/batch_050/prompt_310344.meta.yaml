  Let me do bootstrapping/easy knowledge disagreement:


  Disputants: two of my students / two colleagues at workshop. Professor reports neutrally.


  Setup: Anna defends that the "easy knowledge" inference is genuinely epistemically
  bad — even if reliability is true, you can''t gain warrant for "the gauge is reliable"
  by repeatedly checking outputs. Ben responds: if closure of justification holds
  and single-instance bootstrapping is fine (per basic knowledge / dogmatism), then
  induction gives reliability; denying this forces skepticism about induction itself.
  Anna: distinguishes inductive confirmation from the specific track-record argument;
  track-record arguments are circular in a way induction isn''t, because the evidence
  (the readings) only counts as evidence conditional on reliability. Ben: conditionalization
  point proves too much — all observation is like that; perception only counts as
  evidence conditional on the senses working. Anna: distinguishes — for perception
  we have independent warrant (or entitlement), but for gauge you have none; so the
  problem is bootstrapping without any antecedent warrant for reliability... Ben could
  press: if I have a prior that gauge is reliable (e.g., manufacturer), bootstrapping
  is fine — so the problem is only the zero-prior case; and zero prior is irrational
  anyway, so no problem. Anna replies that assigning any positive prior to reliability
  on no evidence is itself arbitrary / violates a kind of evidentialist constraint.


