  3. The Moore-paradoxical "p but I don''t know that p" — I hold that this is perfectly
  reasonable to say, sometimes (e.g., low stakes, fallibilism).

  4. Fallibilism: you can know p even when you could be wrong / evidence doesn''t
  entail.

  5. Lying is wrong partly because assertions carry an implicit guarantee — I think
  assertion is like promising.


  Genuine tensions: Knowledge norm (1) vs (3): if Moore-paradoxical assertion is fine,
  that directly contradicts knowledge norm. That''s fairly standard though. Another:
  (1)+(2): testimony-based knowledge is fine under knowledge norm if testimony transmits
  knowledge — that''s an apparent tension that dissolves (testimony can give knowledge).
