  Summary draft (by "a pop philosophy book" or "a colleague''s podcast"): ''Locke''s
  theory of personal identity is the memory theory: you are whoever you remember being.
  If you can''t remember doing something, it wasn''t you who did it — so you can''t
  be punished for it. Reid demolished this with his brave officer case: the general
  remembers being the officer but not being the boy who was flogged, so memory contradicts
  itself, and Locke''s theory is inconsistent. Reid concluded that memory is merely
  evidence of identity, not what identity consists in, and that personal identity
  is really the persistence of an indivisible immaterial soul.''


  Errors/subtleties:

  1. Locke''s criterion is consciousness, not memory specifically — memory is the
  usual way consciousness extends backwards but Locke also discusses the sober/drunk
  case and worries about actions forgotten. Conflating consciousness with memory is
  a standard simplification — partially fair.

  2. "It wasn''t you who did it, so you can''t be punished" — Locke actually bites
  much of this bullet (person is a forensic term; he discusses the drunk man punished
  by human law because we can''t prove forgetfulness, but God won''t punish). So the
  summary''s implication is roughly right but misses nuance: Locke says human courts
  may justly punish because they can''t distinguish real from pretended forgetfulness.

  3. Reid''s brave officer: the contradiction arises via transitivity — the officer
  remembers the boy; the general remembers the officer but not the boy. So general
  = officer, officer = boy, but general ≠ boy, violating transitivity. Summary compresses
  this and gets the structure slightly wrong ("general remembers being the officer
  but not the boy" — in Reid''s telling the old general remembers the officer''s feat
  but has forgotten the flogging at school). Summary''s version is roughly right structurally.

  4. "Reid demolished/refuted" — overstatement: the objection works only against the
  simple memory reading; defenders respond with the consciousness reading or by denying
  transitivity of personal identity (later responses). Also Locke''s criterion may
  not be vulnerable if personal identity isn''t transitive — but Locke seems committed.
  Also whether Reid refuted Locke or just the naive version is debated.

  5. Reid''s own view: the summary attributes to Reid the "indivisible immaterial
  soul" view — Reid does think identity is due to an indivisible monad/soul and is
  indemonstrable/known by an original principle of belief; he says identity has no
  relation to memory and can''t be proved. That''s roughly fair actually. Maybe subtle
  error: Reid doesn''t say memory is "merely evidence" — he says memory gives us irresistible
  conviction, but identity itself is perfect and doesn''t admit of degrees, grounded
  in the continued existence of an indivisible thing. Actually the "merely evidence"
  line is a common gloss.


