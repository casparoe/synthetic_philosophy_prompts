  Concrete: The committee oversees a lab that wants to run aversive-learning studies.
  Proposal A: octopuses; Proposal B: mice; budget covers only one. The PI argues mice
  have larger... actually octopus neurons ~500M, mouse ~70M. Octopus has more neurons.
  Interesting wrinkle: octopus has more neurons but distributed (2/3 in arms). So
  "brain size" as a criterion gives counterintuitive rankings. That''s a nice in-the-weeds
