  Let me construct cases with some tension:


  1. Family farm/small business passed down: feels fine, taxing it heavily seems wrong.

  2. Idle trust fund going to a great-great-grandchild who''s never worked: should
  be taxed heavily.

  3. Paying for kid''s tuition / house down-payment: feels fine even though it confers
  advantage — but this is inter vivos transfer creating dynastic advantage.

  4. Lottery winnings taxed: fine with it, though it''s "windfall" like inheritance.

  5. A person who earned money and was taxed on income already — taxing again at death
  feels like double taxation (verdict: that objection has some pull).

  6. Maybe: giving money to kids while alive to dodge estate tax — feels like cheating.

  7. Non-monetary inheritance: family connections, culture, being raised by educated
  parents — can''t tax, and I don''t want to, yet it confers more advantage than money.


  Tension: cases 2 vs 3 (both advantage-conferring transfers but different verdicts),
  and 1 vs 2 (same mechanism, different verdicts based on "earnedness"). Also 7 challenges
  the whole project: if equal opportunity is the goal, why focus on money at death?


  Ask: what principle captures verdicts, which must be overturned, what does it say
  about a new case (e.g., a grandmother paying for private school directly to the
  school; or dynasty trust set up by someone for grandkids).


  Student framing: taking a political philosophy / distributive justice course, discussed
  with roommate, essay coming up. Casual tone, typo.


  Keep to 1–3 paragraphs. Write the prompt only.'
