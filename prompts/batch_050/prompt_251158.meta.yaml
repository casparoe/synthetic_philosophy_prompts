  Alternative: exam question on Libet. But the cases type fits inheritance tax well
  — lots of concrete intuitions: small business passed down vs. liquid capital, gifts
  vs. bequests, paying for education vs. trust fund, etc.


  No quotes needed, no citations. Write casually, student perspective, 1–3 paragraphs,
