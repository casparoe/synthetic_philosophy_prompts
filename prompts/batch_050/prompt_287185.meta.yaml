  we fund has consequences stretching centuries into the future — the people whose
  lives a health program saves will have descendants, the policy we help pass will
  shift elections and institutions we cannot foresee — and the total magnitude of
  these downstream effects plausibly dwarfs anything we put in our spreadsheets. Since
