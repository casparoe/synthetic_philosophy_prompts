  is the same for every option on the table; for every way the uncharted future could
  vindicate one grant, there is an equally likely way it could vindicate another.
  Symmetric ignorance cancels out of comparisons, so we are rationally required to
  choose on the basis of the effects we can estimate — and her colleague''s argument,
  taken seriously, would equally show that no one ever has reason to prefer any action
  to any other, which no one believes.


