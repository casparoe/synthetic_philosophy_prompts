  I chair the grants committee of a private foundation that distributes about $40
  million a year. Our charter directs us to fund the projects with the greatest expected
  benefit to the world, and until now we have done this the obvious way: staff estimate
  each finalist''s likely effects — lives improved, incomes raised, policies changed
