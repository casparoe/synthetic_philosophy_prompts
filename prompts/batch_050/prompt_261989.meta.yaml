  virtual goods is real theft, then the wrongness of theft doesn''t require offline
  psychological harm — tension with (2). Also (4): if virtual objects are real, then
  destroying a virtual item is real destruction even if no one cares; but wait, harm
  requires... Actually a nice tension: the asker says virtual harms are real only
  insofar as they affect real people (2), but says stealing a virtual sword is theft
  (3) — theft is wrongful deprivation of property, which is wrong even if the victim
