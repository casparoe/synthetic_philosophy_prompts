  psychological effects).

  3. Stealing a virtual sword is genuinely theft when the sword has real value.

  4. What''s fictional isn''t real — e.g., in single-player games, NPCs don''t suffer,
  so nothing wrong happens in harming them.

  5. Value is conferred by communities/institutions; virtual items'' value depends
  on the platform continuing to exist.

