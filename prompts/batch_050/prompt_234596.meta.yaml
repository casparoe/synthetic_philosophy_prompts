  I teach an upper-level undergraduate seminar in moral epistemology, and I want a
  handout that sorts the positions in the debate over moral testimony — roughly, the
  debate about what is wrong, if anything, with coming to believe that some act is
  wrong simply because someone tells you so. Please build it as a decision tree.


  Requirements:


  1. Root the tree in a shared datum everyone in the debate accepts: that people frequently
  and apparently successfully acquire moral beliefs by being told (a child told that
  cruelty is wrong, a citizen told that some policy is unjust), and that nobody wants
  a theory on which all such belief formation is epistemically worthless.


  2. Use as the branch nodes the following splitting questions, phrased so that a
  student can answer each one before knowing which position it leads to:

  - whether the felt oddity of moral deference shows that testimony cannot transmit
  moral knowledge, or only that something less than knowledge is missing;

  - whether there is a real asymmetry between moral and non-moral testimony that needs
  explaining, and if so, where it is located;

  - whether uncritical deference (taking someone''s word on a moral question without
  being able to say why it is true) must be treated separately from learning by testimony
  more broadly;

  - whether the value at stake is epistemic at all, or instead moral understanding
  — the ability to grasp why the right act is right and to extend that grasp to new
  cases;

  - whether apparent moral testimony reduces to non-moral testimony (about the testifier''s
  reliability, their evidence, or the non-moral facts) plus the recipient''s own moral
  judgment.


  3. Each leaf should be a position, with the standard label where the literature
  has one (optimism and pessimism about moral testimony, asymmetric or restricted
  optimism, understanding-based accounts, reductionism) and "unnamed" where it does
  not; give each leaf one sentence on its most awkward commitment (for instance, what
  a pessimist has to say about moral education, or what an optimist has to say about
  the sense in which pure moral deference still seems second-rate).


