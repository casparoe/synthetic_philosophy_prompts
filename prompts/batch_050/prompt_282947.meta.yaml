  \ system\"? For defund debates: \"police are like firefighters — you don't wait\
  \ till the fire; you prevent it\" hmm.\n\nEnactivism domain: analogy \"the brain\
  \ is a computer\" is extremely common but very well-trodden. Could do \"perception\
  \ is like a controlled hallucination\"? That's a theory not analogy. \"Cognition\
  \ is like a dance with the environment\"? Maybe.\n\nBetter: policing — the analogy\
