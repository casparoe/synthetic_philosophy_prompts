  settled. (4) Placebo controls can be permissible even where an effective standard
  treatment exists, so long as withholding it poses no risk of serious or irreversible
  harm and participants consent. (5) Deferred or waived consent is legitimate in emergency
  research comparing treatments already in standard use, since the alternative to
  the trial is uncontrolled variation, not informed choice.


