  - One question on Galileo''s falling bodies: the argument there seems to require,
  as a premise, that the speed of fall is not determined by weight — which looks very
  close to the conclusion itself. If the thought experiment only works by smuggling
  in its conclusion, does the deflationary view have to say Galileo learned nothing,
  and is that a reductio or a bullet he''s willing to bite?


  - One question on novelty: the view seems to imply that a thought experiment can
  never tell us anything we didn''t in some sense already know, since the conclusion
