  Sweatshop domain — classic commitments a real person might hold:

  1. Sweatshop labor often constitutes wrongful exploitation (mutually beneficial
  but unfair division of surplus — the Wertheimer view).

  2. It''s nevertheless impermissible (or wrong) to interfere with/ban these transactions,
  since workers consent and are made better off (Zwolinski''s non-interference point).

  3. Anti-sweatshop boycotts and "ethical consumer" campaigns are a legitimate form
  of pressure on firms.

  4. The baseline for whether a transaction is mutually beneficial is the workers''
  actual options, not a hypothetical fair wage (non-worseness claim).

  5. Exploitation is objectionable because the powerful take advantage of vulnerability
  — it''s the unfairness of the division, not the harm, that''s wrong.


  Tensions: (1)+(2) seem tense but dissolve — one can hold that an act is wrong while
  interference is impermissible (standard distinction; many acts are wrongful but
  not rightly interfered with — e.g., breaking a promise in private, refusing to rescue
  cheaply in some jurisdictions). So that''s the apparent tension that dissolves.


  Genuine tension: (3) boycotts + (4) baseline by actual options. A successful boycott
  removes the workers'' best actual option; if the baseline for mutual benefit is
  actual options and non-interference is justified because the workers prefer the
  deal, then successful boycotts make workers worse off by their own lights and thereby...
  Actually the classic tension: if sweatshop jobs are workers'' best option and boycotts
  destroy them, the boycott worsens workers'' lives — same structure as interference.
  But the asker could say boycotts aim to raise wages, not eliminate jobs. Still,
  (2) non-interference principle and (3) boycotts: is consumer pressure "interference"?
  If the reason interference is wrong is that it overrides the workers'' choice/worsens
