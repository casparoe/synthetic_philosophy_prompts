reasoning_summary: 'Pick a domain and type. Satirical piece on pure time preference
  and discounting the future could be fun — e.g., a Swiftian modest proposal from
  a "future affairs ministry" or a mock self-help column. Or transitional justice
  satire — risky. Pure time preference: a satirical in-universe piece where pure time
  preference is taken literally — e.g., a corporate memo announcing they''ll now discount
  next quarter''s revenue at 100% per hour, or a "modest proposal" arguing that since
  the future is worth less, we should abolish all saving... Actually the real target:
  pure time preference (discounting future utility just because it''s later) is hard
  to justify — Ramsey called it "ethically indefensible" (paraphrase, don''t quote).
  Satire: an op-ed by a zealot of pure time preference who applies it consistently
  — e.g., someone who treats his future self as less valuable: eats the whole cake
  because tomorrow''s enjoyment counts less, refuses to save for retirement because
  Future Me is a discounted stranger, congratulates himself on procrastination as
  philosophical rigor. Or a memo from a finance ministry announcing hyperbolic discounting
  as official policy.


  Better: write it as a "modest proposal"/mock op-ed by a committed pure time preferer
  applying discounting within his own life — the joke is that pure time preference
  within a life looks like irrational procrastination/imprudence, which is exactly
  the tension (Sidgwick/Ramsey: no reason to prefer a nearer good just for being nearer).
  The satire lands the real objection: within-person pure time preference seems crazy,
  but across generations it''s standard in cost-benefit analysis.


  Requirements: specify form, length, voice, target; deadpan; humor from getting the
  concept right (geometric discounting, time-consistency, hyperbolic vs exponential,
  Stern Review debate about near-zero pure rate, Ramsey). Don''t quote verbatim. Keep
  prompt short, casual, maybe a typo.


  No web needed. Write prompt text only.'
