  Let me design:


  Question: something like "Explain the main difference between prototype theory and
  exemplar theory of concepts, and why some psychologists think the theory theory
  does better than both. Illustrate with the concept DOG or BIRD."


  Student answer: correct basics — prototype = summary representation with weighted
  features, typicality effects, graded structure, fuzzy boundaries. Exemplar = stored
  instances, similarity to stored exemplars. Theory theory = concepts embedded in
  intuitive theories, explanatory relations.


  Subtle mistakes to plant:

  1. A conflation: e.g., claiming prototype theory says the prototype is the "best
  example" / a particular exemplar — actually that''s a known confusion; prototype
  is an abstract summary, not the most typical instance. The student could say "the
  prototype is the most typical member, like a robin for BIRD" — that''s a subtle
  error: prototype is an abstract average, not an actual member; the robin is just
  most similar to the prototype.

  2. Misattributed view: e.g., attributing the "concepts are embedded in folk theories"
  point to Rosch, or saying theory theory denies typicality effects (it doesn''t;
  it explains them).

  3. A step that doesn''t follow: e.g., "because exemplar theory stores every instance,
  it predicts people can''t categorize novel objects" — no, it handles novel objects
  via similarity to stored exemplars.


  Keep answer genuinely mixed and no howlers.


  Format requirements: lead with bottom line (the grade) in first sentence. Invite
  pushback if premise confused. Casual tone, maybe a typo.


  Write it casually, as a TA. Include the question and student''s answer. Ask for
