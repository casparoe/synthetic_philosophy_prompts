  Prompt draft:


  I am a high school student preparing for a philosophy debate on original and derived
  intentionality. Please play a rigorous, fair-minded defender of John Searle''s side
  against Dennett''s two-bitser argument. Your position: intentionality is original
  when a system has aboutness in its own right; artifacts such as thermometers and
  vending machines have at most derived intentionality because we interpret their
  states as being about something. You may concede that artifacts can have functions,
  that engineers'' intentions can fix those functions, and that natural selection
  can make a trait''s function objectively explanatorily important. What you should
  not concede is that causal function, correlation, or selection history by itself
  creates original intentionality. Do not treat me as stupid, do not merely repeat
  the Chinese Room, and do not answer for Dennett. Stay in first person as the Searlean,
  reply to my exact objection in no more than three paragraphs, and if a premise is
  ambiguous, distinguish the relevant readings instead of asking me to clarify.


  Here is my opening move. Consider a machine that sorts U.S. quarters. Inside it,
  one physical switch-state reliably occurs only when a quarter is inserted; call
  that state Q. At first, Q''s status as representing a quarter plainly seems derived
  from its designers. Now suppose humans disappear, but the machines keep copying
  themselves, and occasional copying errors produce variants. For a thousand years,
  machines whose Q-state responds accurately to quarters obtain more energy and make
  more copies; machines without it die out. Eventually there is a population of machines
  with Q, but no designer, owner, or user remains. Their survival is explained by
  Q''s sensitivity to quarters just as a bird''s survival might be explained by a
  perceptual state''s sensitivity to a predator. Does Q now mean quarter? If you say
  no, explain what extra ingredient a bird or human brain state has besides being
  physically reliable, selectively useful, and interpretable by an observer. If you
  say yes, haven''t you accepted Dennett''s point that selected function can supply
  original content? And if its content changed from derived to original during those
  thousand years, identify when and what fact changed.


