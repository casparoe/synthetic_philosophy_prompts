  supposed to distrust the seeming itself, like force yourself to stop finding it
  plausible? Because that seems both impossible and also kind of dangerous -- if I
  always defer to my higher-order judgment "you''re probably being irrational here,"
  couldn''t I talk myself out of perfectly good beliefs anytime I''m anxious? And
  couldn''t that judgment itself be wrong, putting me in akrasia about my akrasia?


  ---


