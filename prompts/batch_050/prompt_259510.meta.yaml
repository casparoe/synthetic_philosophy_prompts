reasoning_summary: 'Pick a domain: "Should the numbers count? (Taurek on saving the
  many)" with the "Present a position and ask what would count against it" type seems
  strong. Taurek''s 1977 paper "Should the Numbers Count?" is well-known. I can write
  a prompt where the asker has become convinced of Taurek''s view (or the numbers-count
  view) and asks what would count against it.


  Key content: Taurek argues that in trade-off cases where you can save one group
  or another, numbers shouldn''t count — each person should get an equal chance (coin
  flip) rather than saving the greater number. His famous case: six people, five on
  one island needing a drug, one on another, limited supply. Objections: aggregation,
  Scanlon''s contractualist reply, the "worst off" argument, cases of saving one vs.
  two where intuition flips, consistency with ordinary cases where numbers obviously
  matter (allocation of resources), the separateness of persons objection to aggregation
  cut the other way, Kamm''s arguments, Doggett, Hirose''s weighted lottery vs. Taurek''s
  equal chances, the "proportional chances" view.


  Also deeper: what would count against Taurek''s view? Incommensurability/impartial
  benevolence cases, large-number cases (save one vs. a million — Taurek bites the
  bullet? Actually Taurek says it''s permissible to save the one). Defeaters: showing
  the view collapses into something (e.g., a view that respects each person''s claim
  equally but then aggregation re-enters), showing that his reasoning presupposes
  counting people (e.g., that you must save someone rather than no one — the coin
  flip among five options... actually giving each a 1/6 chance entails giving the
  group of five a 5/6 chance, which is a sense in which numbers do count in the lottery
  — Hirose''s point). That''s a nice niche-ish defeater: the equal-chances lottery
  itself embodies number-counting at the group level, so maybe the view is unstable.


  Also: whether Taurek''s view can handle cases with different magnitudes of harm,
  whether it has anything to say about small risks to many vs. certain death to one
  (ex ante cases), whether it generalizes or is restricted to "each will die if not
  saved" cases.


  Casual tone, typo or two. Don''t quote anything verbatim — no quotes needed. Mention
  Taurek''s 1977 paper? That''s safe and well-known; "Should the Numbers Count?" Philosophy
  & Public Affairs 1977 — I''m confident. Could keep it light on specifics anyway.


  Write the prompt: the asker has come around to Taurek''s anti-aggregation view,
  asks for what would count against it, ranked fatal to awkward, what defenders concede,
  etc. Include the twist about the coin flip reintroducing numbers. Keep casual.'
