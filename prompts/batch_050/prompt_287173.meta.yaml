reasoning_summary: 'The user wants a prompt combining one domain with one type. Let
  me pick "Probability in the many-worlds interpretation (the Born rule problem)"
  with the "Report one''s verdicts on a set of cases and ask what principle captures
  them" type. That''s a nice fit: the asker reports verdicts on which branches/measure
  allocations feel like they deserve which credences, and asks what principle captures
  the pattern.


  Alternatively, Sleeping Beauty + verdicts type also works well. Let me do MWI/Born
  rule with the verdicts-on-cases type — that''s fairly in-the-weeds and doesn''t
  require niche citations.


  Design the cases:

  - Symmetric two-branch 50/50: credence 1/2. Obvious.

  - Unequal amplitude branches: e.g., decoherence into a 2/3-weight branch and 1/3-weight
  branch — asker feels credence should track the measure (Born rule), i.e., 2/3. But
  wait — the asker might have a conflicting intuition: "both versions of me exist,
  so shouldn''t I be 50/50?"

  - A case with unequal number of "copies" but equal measure vs unequal measure: e.g.,
  an experimenter who splits into three identical copies with equal weights vs a split
  into two copies with weights 3/4 and 1/4. The asker feels counting matters in the
  first case but not... hmm.

  - A "branch counting" temptation case: 100 low-weight branches vs 1 high-weight
  branch — asker feels the high-weight single branch should dominate, so not counting.

  - Sleeping-beauty-flavoured within MWI: amnesia across days.

  - A case where the amplitude differs but the outcomes are subjectively indistinguishable
  (both branches you see "heads"? no...). A case where one branch has you killed instantly
  (no observer) — does that count? Asker feels uncertain.

  - A fission case where a branch''s weight is negligible epsilon — asker feels like
  they can ignore it, but mathematically it''s nonzero.


  The tension pair: (a) in the unequal-weight split, the asker wants credences to
  track the Born weights; (b) but in another case — e.g., a 0.99-weight branch where
  they see red and a 0.01-weight branch where they see blue — they feel it''s somehow
  weird to be almost certain of red before looking since "the blue-seer is just as
  much me". Or a case where the low-weight branch involves a catastrophic outcome,
  so they feel like they should care more than the weight suggests (decision vs credence
  confusion).


  Good hard-to-reconcile pair: verdict 1: credences should match squared amplitudes
  in the standard spin measurement (feels right). Verdict 2: in a case where one branch
  has weight 0.9 with outcome A and three branches each weight ~0.033 with outcome
  B, the asker feels B is more likely because "there are more of me seeing B" — branch
  counting. These conflict.


  Also a case: two branches of equal weight, but one branch contains you plus a duplicate
  of you (two identical observers in one branch, e.g., a copy made after the split).
  Do you count observers within branches? Asker feels the duplicate shouldn''t matter
  — within-branch duplication doesn''t change credence — but cross-branch splitting
  does. Hmm, that''s actually consistent-ish.


  Better include: a case where the splitting happens after the observation (post-measurement
  split) — credence already set; further splitting shouldn''t change it. Asker feels
  that.


  Ask: is there one principle (e.g., Born rule / "caring measure" / self-locating
  uncertainty over branches weighted by measure) that captures all? Which verdict
  must go? What does it predict for an unconsidered case — e.g., a branch with weight
  exactly zero (a null branch) but containing observers — should they be assigned
  credence zero even though they exist? That''s a nice "case I haven''t listed" request:
  ask the principle to say something about Everettian "null branches" or about a sequence
  of repeated measurements (does the principle justify the Born rule asymptotically,
  i.e., typicality?).


  Format: one to three paragraphs, casual, British English, a typo or two, personal
  framing ("my friend who''s a physicist keeps telling me..."). No quotes from real
  texts needed. Avoid citing specific works (can mention "decision-theoretic derivation"
