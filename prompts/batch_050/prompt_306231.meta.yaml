  Risk aversion: Rawls in Theory of Justice §26 discusses maximin; he insists the
  parties are not assumed to have a special aversion to risk; the maximin rule is
  rational given three features of the original position (knowledge of probabilities
  excluded/uncertain, grave stakes, alternatives one can live with). I''m confident.


  Let me write the student answer carefully so it''s plausible, fluent, mostly right.


  Student answer draft:


  "Rawls asks us to imagine rational parties choosing principles of justice behind
  a veil of ignorance, which deprives them of all knowledge — of their place in society,
  talents, conception of the good, and indeed of any facts about the particular society
  they will inhabit. This guarantees impartiality..."


  Hmm — "any facts about the particular society" — Rawls does allow general facts
  (laws of economics, psychology). Saying they have no knowledge of general facts
