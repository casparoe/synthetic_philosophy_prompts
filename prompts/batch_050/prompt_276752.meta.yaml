  \ whether voluntary moral bioenhancement suffices — the God Machine could tell us\
  \ what moral enhancement would be safe). Maybe too niche. Could argue that even\
  \ if moral bioenhancement worked, it would undermine the very capacities it aims\
  \ to secure. That's somewhat standard though.\n\nOption B: No-trade theorems + predict\
