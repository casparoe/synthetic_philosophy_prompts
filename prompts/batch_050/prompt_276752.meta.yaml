  \ external knowledge needed at all. And it's nicely \"in the weeds.\"\n\nOption\
  \ E: Attention economy + request comments on essay. Write an essay arguing that\
  \ \"attention\" is the wrong metaphor for what platforms capture — attention isn't\
  \ a resource that gets extracted; or argue the \"attention economy\" misdiagnoses:\
  \ the scarce resource being sold isn't attention but behavioral influence. Ask for\
  \ comments on accuracy/interest.\n\nI think the predict-verdicts type combined with\
  \ either no-trade theorems or copycat concepts is strongest. The examples given\
