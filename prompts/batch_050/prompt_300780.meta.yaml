  and its limits. Plutarch''s program, sketched in the prologues to the Lives, rests
  on several claims: that he writes lives rather than histories; that character is
  revealed as much in small gestures and remarks as in famous deeds; that paired lives
  let the reader weigh two characters against each other; that contemplating noble
  lives works on the beholder like a mirror, forming an impulse to imitation; and
  that honest biography must record faults, since an airbrushed portrait is hagiography
