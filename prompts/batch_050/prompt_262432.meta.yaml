  Let me do: friend''s argument that there is no such thing as path dependence, because
  any apparently locked-in outcome was either (a) efficient, in which case it would
  have been chosen anyway, or (b) inefficient, in which case someone has an incentive
  to switch and arbitrage it away. Conclusion: history is never locked in. This mirrors
  Liebowitz & Margolis vs. Paul David debates. Premises:


  1. An outcome is "locked in" only if it persists despite a better alternative being
  known and available.

  2. If a better alternative is known and available, someone can profit by switching
  or by coordinating the switch (and capturing the gains).

  3. Whatever is profitable eventually gets done in a competitive market.

  4. So no outcome stays locked in; apparent lock-in (QWERTY, VHS) just means the
  alternative wasn''t actually better all things considered (switching costs included).

  5. Therefore the outcome would have arrived anyway / history isn''t locked in —
  path dependence is an illusion.


