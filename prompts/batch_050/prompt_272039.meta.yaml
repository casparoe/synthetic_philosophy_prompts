  Weil''s "On the Abolition of All Political Parties" (1943, posthumous). Key claims:
  parties originated in 18th century (French Revolution, English Tories/Whigs); parties
  generate collective passion, suppress individual conscience; parties are totalitarian
  in tendency (she explicitly says only single-party states are genuinely totalitarian,
  but multi-party states have the germ); parties serve their own growth as an end;
  the criterion of truth vs. party interest; analogy with the Church''s anathemas;
  parties corrupt public life; her proposal: abolish parties, candidates run on individual
  programs. Also influenced by her ideas of attention and truth. She compares party
  spirit to what makes people refuse to think. Three characteristics: a party is an
  organization to exert collective pressure; it has a mechanism to generate collective
  passion; its ultimate end is its own growth — making it totalitarian "in germ."


  A plausible-but-subtly-wrong summary by an unnamed book/article could include: (1)
  mostly right — Weil thought parties subordinate truth to party interest; (2) subtle
  misrepresentation: conflate her critique with a general critique of democracy/representation,
  presenting her as anti-democratic or nostalgic for monarchy — she actually wrote
  in service of democracy, was writing during the war for a post-war France, influenced
  by... actually she wanted genuine democracy without parties. Another subtle misrep:
  "Weil believed all political disagreement is manufactured by parties and would disappear
  without them" — overstatement; she acknowledged legitimate disagreements but thought
  parties crystallize and multiply them artificially. Another: attributing to her
  the claim that parties are literally totalitarian — she said they contain the germ/tendency,
  and she distinguished multi-party regimes from single-party ones. Also could conflate
  her view with "both sides are equally bad" centrism. Also her threefold test: party
  as machine for collective passion, etc.


