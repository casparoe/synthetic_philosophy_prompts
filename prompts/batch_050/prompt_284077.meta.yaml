  The debate: whether "Why did the Industrial Revolution happen in Britain and not
  China?" is well-posed — contrastive questions presuppose a fact-foil structure;
  Needham question criticized as comparing incommensurable civilizations, "unit of
  analysis" problems, contingency vs necessity debates (Pomeranz''s contingencies:
  coal, New World colonies vs. China''s different factor endowments), etc. In causal
  inference vocabulary: the question is like asking for a causal contrast where treatment
  is "being Britain" — not a well-defined intervention; the foil selection problem;
  the issue that the question conflates "why Britain industrialized" with "why China
  didn''t."


  No need for web search — this is all general knowledge, no quotes. Write the prompt,
  formal, from perspective of someone who had a long argument with a historian friend,
  1-3 paragraphs, with residue report request and format instruction (lead with bottom
  line in first sentence, then reasoning, no preamble).


  Draft:


  ---


  I''m a data scientist who works on causal inference, and last night I got into a
  long, unresolved argument with a friend who studies economic history. It started
  with the classic question — why did sustained industrial growth take off in Britain
  rather than in China, which by many measures looked at least as commercially and
  technologically sophisticated around 1700? I complained that the question, as historians
  like to pose it, isn''t well formed: you''re picking a single unit, a single foil,
  and asking for a causal contrast where neither the treatment nor the counterfactual
  is specified. She pushed back that the question has generated real knowledge — coal
  endowments, colonial trade, factor prices, demographic regimes — and that my demand
  for well-defined interventions would rule out most of the inquiry she finds valuable.


  Here''s what I''d like from you. Restate this debate — the question of whether "why
  Britain and not China?" is a well-posed causal question, and the main moves on both
  sides (the need for a specified contrast class; the worry about units of analysis
  and whether "Britain" and "China" are the right units given intra-Chinese and intra-European
  variation; contingency versus deep-structure explanations like factor endowments
  or institutions) — into the vocabulary I actually work in: potential outcomes, treatment
  assignment, interventions, SUTVA, selection of the control group, estimands, reference
  classes. Translate as faithfully as you can, and don''t quietly build in my framework''s
  assumptions while pretending they''re neutral translations.


  Then give me the residue report: which parts of the historians'' debate map cleanly
  onto causal-inference concepts (I suspect the foil-selection problem is basically
  the choice of control group, but tell me if that''s wrong), which parts survive
  only with distortion, and which parts — if any — have no expression at all in my
  vocabulary. For the residue, I want your view on whether it marks a genuine limitation
  of the potential-outcomes framework for historical explanation, or whether it reveals
  that parts of the historical debate are less substantive than they appear. Lead
  with your bottom line in the first sentence — one sentence stating your overall
  verdict — and then give the translation and the residue analysis, with no preamble
  and no restating of the question.


  ---


  That seems good. Check: no quotes needed, no citations. Formal, elaborate, friend-argument
  framing, format instruction. Good length.'
