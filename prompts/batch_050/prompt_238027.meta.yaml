  Gödel outside math: cases where people invoke Gödel — some legit, some not — ask
  what principle distinguishes legitimate from illegitimate invocation. That''s nice:
  e.g., "the mind can''t be a machine" (Lucas/Penrose) — dubious; "any legal system
  has indeterminate cases" — loose analogy; using Gödel to argue AI can''t be conscious;
  using Gödel to argue that mathematics exceeds formalism (that''s actually what the
  theorem shows, near); using incompleteness to argue a bureaucracy manual can''t
  cover all cases. Cases with verdicts, one hard-to-reconcile pair. Ask for principle.


  But note: Gödel invocations require some care. The asker gives verdicts; the principle
  must carve "uses that depend on the theorem''s actual content (formal, sufficiently
  expressive, consistent systems; Gödel sentence unprovable but true)" vs "metaphorical
  uses about any human system." A hard pair: e.g., (a) "Peano arithmetic can''t prove
  its own consistency, so a formal proof-checker''s trust in PA must come from outside
  PA" — legit; (b) "the mind sees the truth of the Gödel sentence, so minds aren''t
  machines" — feels similar structure (seeing truth from outside) but asker judges
  it not fine. That pair is hard to reconcile: both invoke "seeing truth from outside
  the system." Good.


  Cases list (5-7) with verdicts:

  1. "Arithmetic is consistent but can''t prove its own consistency, so our confidence
  in arithmetic rests on something beyond formal derivation" — fine.

  2. "No sufficiently expressive formal system is complete, so mathematics outruns
  any fixed axiomatization" — fine.

  3. "Since the mind can see the Gödel sentence is true while the machine can''t prove
  it, minds aren''t machines" — not fine (or at least doesn''t follow).

  4. "Any legal code has cases it can''t decide, by Gödel" — not fine (that''s just
  vagueness/incompleteness of language, not Gödel).

  5. "A bureaucracy''s rules will always have gaps, so human judgment can''t be eliminated
  — Gödel shows this" — not fine as Gödel, maybe fine as common sense.

  6. "Any AI implemented as a formal system has a true sentence it can''t prove, so
  there''s something humans can know that it can''t" — not fine / dubious, similar
  to 3.

  7. "Set theory: CH independent of ZFC — that''s the incompleteness phenomenon at
  work" — hmm, independence results are related but distinct (Gödel sentence vs. independence
  via forcing). Asker says "fine, roughly" — a less confident verdict.


  Hard pair: 1 and 3: both say "we can see the truth from outside." Or 3 and 6 basically
  same claim, both not fine — that''s consistent. Better hard pair: 1 fine ("our confidence
  in arithmetic comes from outside") vs 3 not fine ("we see Gödel sentence true, hence
  not machines") — both rely on our ability to "see" truths unprovable in a system.
  A principle must distinguish: in case 1 the claim is about justification of the
  system''s consistency, conditional on consistency; in case 3 it assumes we know
