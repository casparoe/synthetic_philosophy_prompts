  Cases:

  1. Stotting gazelles — signaling to predator: yes, genuine signal.

  2. Peacock''s tail — handicap, honest signal of genetic quality: yes.

  3. Ferraris — costly signal of wealth: yes.

  4. A degree from a prestigious university: employer can''t observe ability — yes
