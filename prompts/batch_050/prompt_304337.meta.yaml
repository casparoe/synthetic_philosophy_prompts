reasoning_summary: 'Let me pick a domain and type. Good combinations:


  - Trolley problems and doctrine of double effect + "presuppositions of a practice"
  type. E.g., the practice of medical triage, or military rules of engagement distinguishing
  terror bombing from collateral damage — what does the doctrine presuppose? Or the
  legal practice of distinguishing intended harm from foreseen harm.

  - Avicenna''s flying man + short story? Could be nice.

  - Du Bois on art as propaganda + verdict prediction?


  The "presuppositions of a practice" type fits trolley problems/double effect well.
  E.g., the practice in criminal law / military ethics: the distinction between intentionally
  targeting civilians vs. foreseen collateral damage in the laws of armed conflict.
  What does that practice presuppose — the doctrine of double effect? Does it presuppose
  intention matters morally, that side-effects are more permissible? And where underdetermined:
  could a consequentialist defend the same practice via rules? And what would change
  if we dropped it — e.g., terror bombing vs. precision strikes with foreseeable civilian
  deaths.


  Need to inject a niche-ish new idea to avoid regurgitation. Could invent a hypothetical
  protocol: e.g., an autonomous weapons system''s targeting algorithm that encodes
  a proportionality calculation — what does encoding DDE into an algorithm presuppose
  about intention, given machines arguably don''t have intentions? That''s a nice
  fresh angle: the practice of designing algorithms that weigh expected civilian casualties
  against military advantage presupposes a view about whether double effect survives
  without a human intender.


  Alternatively medical: organ transplant case — a hospital''s policy forbidding killing
  one to save five while permitting risky triage. That''s the classic transplant vs
  trolley. Niche spin: a hospital ethics committee that permits a drug with fatal
  side effects (e.g., chemotherapy, or a hysterectomy in ectopic pregnancy) — the
  ectopic pregnancy / craniotomy cases are classic DDE. A somewhat fresh practice:
  the Phoenix area... Actually, "methotrexate vs salpingectomy" for ectopic pregnancy
  is a real DDE flashpoint in Catholic hospitals. That''s somewhat in-the-weeds but
  known.


  Better: write a practice-based prompt combining an invented-but-plausible institutional
  policy. The prompt itself describes the practice, so common-knowledge constraint
  is satisfied by description.


  Let me draft: The asker is involved with, say, a hospital ethics committee / an
  army''s legal team designing engagement rules. Ask: what does the practice presuppose
  — DDE? Does it presuppose a distinction between intending and foreseeing, between
  means and side effects? Is the practice coherent with the same institution''s willingness
  to redirect harm (trolley-style switching) — e.g., permitting triage where some
  patients are left to die to save others? Where is it underdetermined (rule-consequentialism
  could license the same rules)? What would change if we adopted a purely outcome-based
  view?


  Add a fresh twist: the institution permits diverting harm but forbids using people
  as means — e.g., a flood-defence authority that will breach a levee knowing it will
  flood a village to save a city (redirecting an existing threat) but would never
  demolish houses to create a firebreak... wait, firebreak is blocking. Classic: redirecting
  trolley vs. pushing the fat man / using as means. Flood authority: opening sluice
  gates to divert floodwater toward a hamlet to save a city — permitted; but they
  would not consider "sacrificing" a village by e.g., using its buildings... hmm.


  Better concrete real-ish practices:

  1. Military: laws of armed conflict distinguish deliberately targeting civilians
  (war crime) from proportionate collateral damage (permissible).

  2. Medicine: terminal sedation / pain relief with life-shortening side effects permitted;
  euthanasia not.

  3. Emergency management: diverting floodwater onto few homes to save many is acceptable;
  but a policy that would demolish inhabited homes to cut a firebreak... actually
  that''s redirecting a threat too — demolishing homes is a means. Hmm, in the firebreak
  case the houses are destroyed as a means to stop the fire — that''s "using as means"?
  Classic DDE case: destroying a path/innocent shield.


  Nice inconsistency: the same institution permits harm-diverting (trolley switch)
  but forbids harm-as-means (transplant). E.g., disaster-response protocols.


  The prompt: "I work on the ethics panel advising a regional emergency-management
  authority..." Describe three standing protocols:

  (a) Flood protocol: may open sluices diverting water from city to farmland, foreseen
  deaths acceptable if proportionate.

  (b) Prohibits commandeering... hmm, need the "means" contrast: a rule that they
  may never demolish an occupied building to create a firebreak even if it would save
  a town — wait, is demolishing the building using its destruction as a means? Yes:
  the firebreak works because the building is destroyed. Whereas diverting flood:
  harm is a side effect, not the means.

  (c) Triage: they allocate scarce ventilators, letting some die — is that a third
  thing?


  Then ask: what does the whole pattern presuppose? DDE (intention/foresight, means/side-effect).
  Does triage presuppose something else (outcome aggregation)? Are the presuppositions
  consistent? What would change under pure consequentialism — and note a rule-consequentialist
  might license identical protocols, so where is the practice underdetermined?


  Also inject: a new proposed protocol — e.g., a proposal to allow "pre-emptive demolition"
  using AI risk modelling, or the new case: a proposal to deliberately divert a wildfire
  by backburning across land where a few residents refused evacuation (foreseen deaths,
  harm-diverting) vs. a proposal to detain an infected person... Keep it to one new
  case maybe not needed; the type doesn''t require a new case, it requires reconstruction
  + replacement.


  Length limit: ask for max ~600 words? "no more than 500 words". Format instruction:
  hard length limit. Also maybe ask to lead with the bottom line. E.g., "Begin with
  a one-sentence statement of the theory you take the protocols to presuppose; total
  response no more than 450 words."


  British English: use "whilst"/"authorised"? Keep spellings British: "authorised",
  "programme", "defence".


  No quotes needed — avoid verbatim quotes entirely. Fine.


  Elaborate framing: "I''ve been sitting on the ethics review panel of a civil protection
  agency..." Some seeding: mention that a colleague defended protocol (a) by saying
  the deaths are foreseen but not intended, and the asker is puzzled because in (b)
  the deaths would also be foreseen but not intended.


  That''s the nice puzzle: in firebreak demolition, are the occupants'' deaths foreseen
  or intended? Classic DDE debate (the demolition is the means; deaths may be side
  effects of demolition — actually classic problem: terror bomber vs tactical bomber;
  and the "craniotomy" case). The puzzle: why does diverting flood onto a hamlet count
  as permissible side effect but demolishing an occupied hamlet to cut a firebreak
  counts as forbidden use? Both involve foreseeable deaths. DDE says: in the flood
  case, the flood''s redirection works regardless of whether anyone dies; in the firebreak
  case, the destruction of the hamlet is causally necessary to stop the fire — but
  the deaths arguably aren''t necessary, only the destruction. That''s the "closeness
  problem" — nice in-the-weeds hook. Ask whether the practice presupposes DDE and
  whether DDE can draw the line (closeness problem), and whether a rule-consequentialist
  could license the same protocols (underdetermination).


  Draft:


  "I''m in my second year on the ethics advisory panel of a regional civil-protection
  authority, and I''ve been asked to help revise our standing emergency protocols.
  Three of them interest me philosophically. First, our flood protocol permits engineers
  to open sluice gates diverting floodwater away from a city and onto farmland, even
  where it is foreseen with near certainty that a handful of residents who refused
  evacuation will drown, provided the expected number saved is much larger. Second,
  our wildfire protocol flatly forbids demolishing an occupied hamlet to cut a firebreak,
  even where the demolition would certainly stop the fire and save a town, and even
  though the residents'' deaths would be no more ''wanted'' than in the flood case.
  Third, our triage protocol directs medics to allocate scarce ventilators by expected
  survival, knowingly letting some patients die so others may live — nobody baulks
  at this..."


  Then: colleague said difference between (1) and (2) is that in (1) the deaths are
  a side effect, in (2) the destruction is the means — asker puzzled since in (2)
  deaths seem as unintended as in (1). Ask: What does this pattern presuppose? Reconstruct
  implicit moral theory (DDE, doing/allowing). Does triage rest on same or different
  commitments? Is the set coherent? Is DDE strictly presupposed or merely compatible
  — could a rule-consequentialist defend identical protocols? What would change under
  straightforward act-consequentialism, or under a view on which only outcomes matter?
  Also: does the distinction between (1) and (2) survive the objection that in both,
  saving works via physical redirection and the deaths are causally irrelevant to
  the saving?


  Length: max 450 words, begin with one-sentence statement of presupposed theory.


  British English. Write one-to-three paragraphs. Don''t reuse example openings ("Courts
  admit...", "I sit on my university''s..."). My opening "I''m in my second year on..."
  is okay-ish distinct; example 3 used "I sit on my university''s research ethics
  board". Mine differs enough.


  Avoid quotes. No search needed.'
