  Question: "Explain why Spinoza considers democracy the most natural form of the
  state, and how his conception of right as power shapes this argument."


  Student answer: gets right the basics—democracy = imperium absolutum where the whole
  multitude holds sovereignty; right coextensive with power; no total alienation of
  right; freedom of thought cannot be surrendered; the multitude as less prone to
  irrationality than a single monarch. Subtle mistakes: (1) claims Spinoza''s democracy
  requires rational consensus / that decisions in a democracy are ipso facto rational
  — actually Spinoza says the multitude can be fickle; his argument is that the multitude
  is less susceptible to being driven by a single passion than an individual, and
  that sovereignty grounded in power; (2) claims Spinoza permits unlimited free speech
  — actually he argues speech can be restricted when seditious/undermining the sovereign''s
  right; what can''t be surrendered is freedom of judgment/thought. Both are subtle
  and commonly glossed over.


