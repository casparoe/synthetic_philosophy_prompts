  AND that WTA is the right measure for things people possess. Also, "default options
  should be respected because people choose them" conflicts with "status quo bias
  is a bias."


  Another angle: a person holds (a) loss aversion is a genuine preference reflecting
  asymmetric value, (b) but Kahneman-Tversky''s "losses loom larger" framing... Or:
  holds that the endowment effect disappears with market experience (List''s result)
