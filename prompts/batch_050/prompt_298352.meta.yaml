  ---


  So I finally finished Death''s End last month (late to the party, I know) and I
  can''t stop thinking about the dark forest idea. For anyone unfamiliar: the universe
  is full of civilisations hiding from each other, because the safest move when you
  spot another civilisation is to destroy it before it destroys you. Luo Ji works
  this out from two axioms — survival is the primary need of every civilisation, and
  civilisations keep growing while the total matter in the universe stays finite —
  plus the "chain of suspicion" (you can''t know my intentions, I can''t know yours,
  and light-speed lags mean we can never talk it out fast enough) and technological
  explosion (a weak civilisation can leapfrog a strong one in cosmically short time,
  so leaving it alive is a risk even if it looks harmless).


  Anyway, somewhere around book three it hit me that this is basically Hobbes. State
  of nature, no common power overhead, everyone''s diffident, pre-emption is the rational
  play. I''m a software engineer, no philosophy background, I''ve read the famous
  chunks of Leviathan and one YouTube summary of the rest, so I might be talking rubbish
  here. But I''d love a proper answer to: what would Hobbes himself have made of the
  dark forest hypothesis?


  Some angles I''m chewing on, feel free to ignore or add your own:


  - Hobbes''s state of nature argument leans on rough equality — even the weakest
  person can kill the strongest, so nobody''s safe. In the dark forest civilisations
  are massively unequal in tech, but technological explosion sort of re-creates equality
  over time. Would he buy that as the same thing, or does the argument need equality
  right now?

  - Hobbes thinks the way out is everyone covenanting to hand power to a sovereign.
  Between star systems you can''t enforce anything — messages take years, fleets take
  centuries. Would Hobbes say the dark forest is just the state of nature with the
  exit bricked up, i.e. permanent? Or would he expect some civilisation to become
  a cosmic Leviathan and impose peace by force, and would the dark forest logic make
  that impossible?

  - His laws of nature say seek peace when you can, and only keep your right to everything
  when you can''t get it. The chain of suspicion means you can never verify that peace
  is on offer. Would he treat that as "peace is never available, so anything goes",
  or would he think some signalling could work (he has that stuff about covenants
  being void where there''s reasonable suspicion, I think?).

  - Would he actually endorse shooting first? I remember Leviathan has a bit about
  anticipation being the most reasonable way to secure yourself, which sounds a lot
  like Luo Ji''s deterrent and a lot like the strike-first logic. But Hobbes also
