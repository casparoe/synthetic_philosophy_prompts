  Student answer (~300 words):


  "Popper defines verisimilitude in terms of a theory''s content. The truth content
  of a theory is the set of its true consequences, and its falsity content is the
  set of its false consequences. Theory B has greater verisimilitude than theory A
  if and only if the truth content of A is a subset of the truth content of B and
  the falsity content of B is a subset of the falsity content of A, with at least
  one of the inclusions strict. Popper''s idea was that science can then be seen as
  progress toward the truth even though our theories are false, since each theory
  can be closer to the truth than its predecessor.


  Tichý''s objection runs as follows. Suppose A and B are both false and B has greater
  verisimilitude than A. Because B is false, it has at least one false consequence.
  Tichý showed that the two subset conditions then force A and B to have exactly the
  same consequences overall, which contradicts the assumption that one inclusion is
  strict. So on Popper''s definition, a false theory can never be closer to the truth
  than a true theory. Tichý illustrated this with his weather example: take the false
  claim that it is hot, rainy, and windy; whether it counts as closer to the truth
  than some rival false claim flips when we re-express the claims in a vocabulary
  built from different primitives, which shows the comparisons are unstable.


  The objection is damaging but not fatal. It shows that Popper''s particular definition
  cannot rank false theories, which matters because virtually every interesting scientific
  theory is strictly false. It does not show that the very notion of approaching the
  truth is incoherent: later writers such as Niiniluoto have proposed measuring truthlikeness
  by a theory''s distance from the complete true description of the world in the relevant
  language, and on such accounts one false theory can be nearer the truth than another.
  Still, because the later proposals abandon Popper''s purely logical definition,
  we should conclude that realism about scientific progress is in trouble unless truthlikeness
  can be made precise, and Laudan''s pessimism about convergence remains the default
  position."


