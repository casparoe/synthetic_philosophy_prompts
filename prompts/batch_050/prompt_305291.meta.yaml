  angle: "if you can rewrite the code, the precommitment isn''t binding; if you can''t,
  you lose the ability to respond to new information — so precommitment is either
  useless or irrational." That''s a nice either/or.


  Construct an argument: (1) Rationality requires responding to new evidence. (2)
  A binding precommitment forces you to act against what you''d judge best at the
  later time. (3) If at the later time your judgment is better informed, following
  the precommitment is irrational. (4) So rational agents should never bind themselves...
  conclusion: constitutions/Ulysses contracts are irrational. Where does it go wrong?
  The flaw: the precommitment changes the payoff structure / the later "judgment"
  is predictably distorted (time-inconsistent preferences); also higher-order evidence
  about your own future unreliability. Or an argument that proves too much: it would
  also show you should never make promises, sign contracts, set alarm clocks, use
  deadlines — everything is precommitment.


  Alternatively the type "stalled debate" on quantum immortality? Hmm, "proves too
  much" fits precommitment well.


  Let me write the argument so it has a genuine subtle flaw plus pricing of alternatives.
  Casual tone, software engineer framing (analogy to code, cron jobs, force-push,
  immutable infra, etc.).


  Draft argument:


  1. An agent acts rationally only if, at the moment of action, they do what seems
  best given the evidence they have then. (act on current best judgment)

  2. A precommitment device works only if it makes you do at time T2 something you
  would not, at T2, judge best. (otherwise it''s redundant — if you''d do it anyway,
  the device does nothing)

  3. So a working precommitment device makes you act against your best judgment at
  T2.

  4. Acting against your best judgment at T2 is irrational at T2.

  5. So every working precommitment device makes you act irrationally.

  6. Rational agents shouldn''t arrange to act irrationally. So precommitment — Ulysses
  contracts, constitutional entrenchment, autopay, deleting the app — is something
  rational agents should never use.


  Conclusion proves too much: also rules out contracts, deadlines, alarm clocks...
  Ask: which premise? Costs of each rejection. Don''t announce the flaw.


