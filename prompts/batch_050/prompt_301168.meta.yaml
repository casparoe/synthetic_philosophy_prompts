  ---


  Read Kazuo Ishiguro''s novel The Remains of the Day through the philosophy of incommensurable
  values and hard choices, and say what the novel has to teach that debate.


  Stevens''s life looks, at first, like a textbook hard choice between two genuine
  values: the professional ideal of dignified service, embodied in his career at Darlington
  Hall, and the possibility of intimacy and a shared life with Miss Kenton. Philosophers
  such as Joseph Raz and Ruth Chang argue that some options are related by none of
  the standard comparative relations — not better, not worse, not equal — but are
  instead, in Chang''s phrase, on a par, and that in such cases reasons run out and
  the agent can only resolve the choice by willing one value to matter more, by throwing
  themselves behind it. Please test the novel against this framework rather than merely
  illustrating it.


  In particular, address the following. First, take a position on whether Stevens''s
  two options really were on a par, given that one horn of the dilemma is compromised:
  the greatness Stevens served is tainted by Lord Darlington''s political naivety,
  so it is unclear whether Stevens faced a hard choice between two real values or
  simply made an ordinary mistake about the value of one of them. Does the novel itself
  distinguish these, or does it treat them as interchangeable from inside a life?


  Second, consider what I will call retrospective commensuration: the tendency of
  a life narrated from its end to convert a choice that was prospectively hard into
  one that now looks simply right or simply wrong. Stevens''s narration performs this
  in both directions — decades of self-deception present the career as vindicated,
  until the final scenes let regret break through. If rational regret presupposes
  that the foregone option was genuinely better, then the regret Stevens finally permits
  himself seems to be evidence against the on-a-par reading; alternatively, the novel
  may vindicate Bernard Williams''s thought that even justified choices leave a moral
  remainder that is properly felt as loss. Say which diagnosis the novel supports,
  and whether retrospective commensuration is a cognitive defect or one of the legitimate
  ways agents create the comparability that hard-choice theory says reasons cannot
  supply.


  Third, identify where the novel resists the philosophical model. Hard-choice theory
  standardly pictures a discrete decision between specified options; Stevens never
  faces such a moment. His loss of Miss Kenton is distributed across years of small
  omissions — evenings kept downstairs, doors not knocked on, banter not returned.
  If the most consequential hard choices in a life are drift rather than decision,
  what does the theory need to add to accommodate this, and does the novel suggest
  that the phenomenology of on-a-par choice is not anguished deliberation but evasion?


  I''m preparing a seminar session pairing the novel with the Raz–Chang literature
  and want a reading that is faithful in both directions: it should not flatten Stevens
  into an illustration, and it should not soften the philosophy to fit the book. End
  by saying what, if anything, the novel contributes to the debate about hard choices
  that argument alone does not.


