  ---


  I''m designing a handout for an upper-level philosophy of biology seminar on the
  charge that natural selection is a tautology ("the fittest survive, and the fittest
  are those who survive"). I want a decision tree that sorts the serious replies by
  what they take fitness to be, so that students can locate a given paper or textbook
  passage on the tree without needing to recognize its author''s allegiances.


  Please build the tree from questions rather than from a list of named positions.
  Each node should be a single claim on which the positions genuinely come apart,
  phrased as a concrete diagnostic (for example: "Is an organism that dies in a freak
  accident despite superior constitution less fit than the mediocre one that outbreeds
  it, or merely unlucky?"). As a starting menu, the tree must at minimum make use
  of these distinctions, though you may reorder, merge, or add nodes if the logic
  demands it:


  - whether fitness is fixed by actual reproductive outcomes or by a disposition that
  outcomes only imperfectly manifest;

  - whether the bearer of fitness is the individual organism or the trait-type-relative-to-an-environment;

  - whether fitness is meant to explain differences in reproductive success (as a
  causal force) or only to summarize them statistically;

  - whether fitness can, even in principle, be estimated independently of the survival
  and reproduction it is invoked to explain.


  Each leaf should give the position''s usual name where it has one (e.g., the propensity
  interpretation), or "unnamed" where the combination is unoccupied; for unoccupied
  leaves, add one sentence diagnosing whether the combination is incoherent, merely
  unattractive, or simply unexplored. Flag any pair of named positions your tree cannot
  separate, and say what further question would be needed to split them.


  The tree should have roughly 10–14 leaves. Two test cases must be usable as worked
  examples at the relevant nodes: the accidentally sterile organism with an otherwise
  ideal genotype, and a population in which drift overwhelms selection so that the
  fitter lineage goes extinct. Where the tree commits to a contested claim (e.g.,
  that a single token organism can bear a propensity that its actual history fails
  to display), mark the commitment as contested rather than presenting it as settled.


  End with a short note stating how confident you are that the tree captures the live
  logical space rather than just the historically prominent options, and identify
  the single node or leaf you are least confident about and why.


