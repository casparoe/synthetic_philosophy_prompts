  a principle is assessed by comparing that person''s complaint, considered on its
  own, against the complaints of other individuals, each considered on their own.
  Burdens and benefits are not summed across persons. So if one person stands to lose
  a great deal and five people each stand to lose slightly less, the comparison is
  one complaint of the greater size against five separate complaints of the smaller
  size -- and on the standard reading, the single greatest complaint governs.


