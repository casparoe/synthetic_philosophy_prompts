  Paradox of blackmail: why is it illegal to threaten to do something you have a right
  to do unless paid not to? Cases: threatening to expose affair unless paid (blackmail),
  offering to stay silent for payment framed as "offer," revealing true info is legal,
  gossip columnists, unions threatening strikes (legal), prosecutors plea bargaining
