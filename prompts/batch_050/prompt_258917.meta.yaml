  Write the prompt with cases and verdicts that are hard to reconcile. E.g.:

  1. Tabloid threatens to publish affair photos unless paid $50k — clearly wrong/criminal.

  2. Same person instead sells photos to tabloid — legal, seems fine-ish.

  3. Woman offers ex-lover: I''ll sign NDA for $50k — feels different (settlement),
