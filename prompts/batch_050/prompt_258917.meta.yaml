  4. Threatening to report a crime to police unless compensated for harm — gray.

  5. Lawyer threatening lawsuit unless settlement — fine.

  6. Employee threatening to quit unless raise — fine.

  7. Threatening to expose restaurant''s health violations unless free meals — blackmail.


  Ask: what principle distinguishes? Note tension: cases 1 and 3 look alike but verdicts
