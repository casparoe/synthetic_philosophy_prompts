  Slogans in complicity domain: "If you didn''t do it, someone else would" — that''s
  a classic complicity slogan (the "replaceability" or "overdetermination" argument).
  Or "you''re either part of the solution or part of the problem." Or "silence is
  complicity." Or "there are no innocent bystanders." Or "all it takes for evil to
  triumph is for good men to do nothing" — attributed to Burke but that''s a misattribution;
  avoid attribution.


  "If I don''t do it, someone else will" — great for complicity, used in arms sales,
  selling products to bad actors, working for a company, buying meat, etc. The prompt
  asks to precisify what precise claims that slogan makes: causal claim, moral exculpation
  claim, etc.


  Write from perspective of someone for whom it''s personally relevant — e.g., someone
  offered a job, or works in defense industry, or selling something. Formal/polished.
  Short.


  No quotes from real texts needed. The slogan itself is a proverb-like one-liner
  in common form — fine without attribution.


  Draft:


  "I work in [X], and last week I was offered... When I raised concerns, my colleague
  said: ''If you don''t do it, someone else will.'' I keep turning this over..."


  Make it concrete: a data engineer asked to build targeting tools for a client with
  human rights concerns; or a gun dealer; or meat-eating. Classic: the replaceability
  argument in collective contexts.


  The ask: lay out distinct precise theses the slogan could express — a prediction
  about what will happen (causal counterfactual), a claim about causal contribution
  (if outcome is overdetermined, my act doesn''t make a difference), a claim about
  moral responsibility (no difference-making, no blame), a claim about complicity
  vs causation, a claim about expected value (does my participation shift which wrong
  occurs or its quality?), etc. Ask which readings are plausible, which support the
  conclusion that it''s permissible, and which don''t. Also ask about where the slogan
  fails: e.g., cases where replaceability itself is wrongdoing-relevant, "someone
  else will" may be true only because of market for participation, etc.


  Keep it a few sentences. Formal tone.


  Final prompt text:


  ---


  I work as a structural engineer and was recently offered a lucrative contract designing
  facilities for a client I believe to be engaged in serious wrongdoing. When I hesitated,
  a senior colleague dismissed my scruples with a line I have since been unable to
  stop turning over: if you don''t take the job, someone else will, and the building
  gets built either way. I recognize this as a familiar one-liner rather than an argument,
  and I would like it unpacked. Lay out the distinct precise claims this slogan could
  be making — as a prediction about what will happen regardless, as a thesis about
  what it takes to cause an outcome, as a claim about the conditions under which one
  counts as complicit in wrongdoing one did not cause, and as a claim about what morality
  actually asks of an individual in a replaceable role. For each reading, say whether
  it is trivially true, substantive and defensible, or false; indicate which readings
  would actually support my colleague''s conclusion that I may take the contract with
  a clear conscience; and flag where the slogan quietly trades on an ambiguity — for
  instance, between my participation making no difference to the outcome and it making
  no difference of any kind, or between the building being built either way and the
  wrong being done either way. End with the single reading you find strongest, and
  whether even it survives the observation that ''someone else will'' is often true
  only because enough people reason exactly as my colleague does.


