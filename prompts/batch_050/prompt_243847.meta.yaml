  Then the essay draft. Let me write it at ~800 words. Sections with small headers
  maybe: 1. The standard picture; 2. The compression problem; 3. The calibration thesis;
  4. Hagiography as the degenerate case; 5. Objection: the curation regress; 6. Diagonal
  reading. Headers help commenters refer to sections — good for the comment task.


  Essay draft:


  1. The standard picture. Moral philosophers who defend learning from biography usually
  argue something like: rules and principles underdetermine action; exemplars fill
  the gap; admiration picks out admirable persons; narratives let us rehearse their
  deliberations. Plutarch is the tradition''s patron saint: he announces, in the proem
  to the Alexander, that he writes biography rather than history, and that a small
  matter — a phrase, a jest — can reveal character where pitched battles and great
  sieges do not. In the proem to the Aemilius Paullus and Timoleon he says he began
  the Lives for others and continued them for himself, using the record of the past
  as a mirror in which to shape his own conduct. The standard picture treats the life
  as a transparent container of moral evidence and the reader as an extractor.


  2. The compression problem. A life is not evidence until someone has compressed
  it. From a continuous stream of conduct the biographer selects a handful of anecdotes;
  the selection is guided by a prior conception of what character is and which of
  its expressions are revealing. Plutarch''s own manifesto makes the point vivid:
  his method is to hunt for the small, character-disclosing detail, which means the
  detail enters the record because it already fits a theory of disclosiveness. In
  natural science we say observation is theory-laden; in biography I want to claim
  something stronger — selection is theory-constitutive. The theory does not merely
  color data that exist independently; it determines which data exist at all. The
  reader who believes she is deriving virtue from the evidence of lives is often receiving
  the biographer''s moral taxonomy laundered through the archive.


  3. The calibration thesis. Here is the paper''s main claim: Plutarch''s distinctive
  contribution is not the life but the pair. Most of the Parallel Lives couple a Greek
  with a Roman and close with a formal comparison. A one-point measurement cannot
  be checked; a two-point measurement externalizes the instrument''s axes. When the
  same biographer applies his selection principles to two lives and then weighs them
  against each other, his criteria of selection become visible as criteria. The surviving
  comparisons often redistribute praise and blame in ways the narratives alone would
  not predict; they show Plutarch re-reading his own evidence. So the pair functions
  as a calibration device: the reader learns not only what Plutarch concluded but
  how Plutarch''s evaluative instrument behaves, and can correct for it. The unit
  of moral instruction in the Lives is the synkrisis, not the bios.


  Hmm, one more nuance: sometimes the synkrisis feels strained or favors the Greek/Roman
  — scholars note Plutarch sometimes bends even-handedness toward the Greek. I can
  add: the comparisons also expose the instrument''s biases — a reader notices when
  the scales are pressed. Good.


  4. Hagiography as the degenerate case. The saints'' lives of late antiquity and
  the middle ages are the limiting case on the other side: a single subject, maximal
  compression toward the ideal, no comparison, and a selection principle that admits
  only the edifying. On my account, hagiography is not bad biography because it idealizes
  — Plutarch idealizes too, and he is regularly accused of leniency toward his subjects
  — but because it suppresses the calibration signal. A reader of the Life of Antony
  receives the instrument''s reading with no way to inspect the instrument. The hagiographer''s
  likely reply: idealization is the point; exemplars must be better than actual people
  if they are to pull us upward, and an exemplar corrected for bias pulls less hard.
  The essay needs to take this reply seriously, since Plutarch''s own justification
  for including vicious subjects (in the proem to the Demetrius he compares them to
  the drunken helots the Spartans displayed to their sons, so that the young might
  learn by looking what to avoid) shows he thought even the negative exemplar teaches
  by being looked at — a picture the hagiographer shares.


  5. Objection: the curation regress. Comparison relocates the compression problem
  rather than solving it. Plutarch chose the pairings; Demetrius stands beside Antony
  because the theatrical parallels served the lesson; a hagiographer could pair two
  saints and produce a formally identical synkrisis with no epistemic gain. My reply:
  the regress is real but it is not vicious, because each explicit comparison leaks
  criteria. A paired hagiography would still tell us what its author takes sanctity
  to consist in, and would give the reader two data series against which to see it.
  Calibration does not require an unbiased instrument; it requires an instrument whose
  bias is expressed in its output. Still, I concede that the gains diminish when the
  paired subjects are selected to agree.


  6. Diagonal reading. Pedagogical upshot: the reader should manufacture comparisons
  the biographer did not supply — read Plutarch''s Antony against the hostile Augustan
  tradition that survives in other sources; read Alcibiades against Nicias, his rival
  in the Sicilian debate, rather than against Coriolanus, his assigned partner; read
  a saint''s life alongside a contemporary critic. Call this diagonal reading: the
  reader performs the calibration instead of inheriting it. If the calibration thesis
  is right, this is not an optional exercise for the suspicious but the primary way
  biography teaches.


  That''s ~700 words. Good.


