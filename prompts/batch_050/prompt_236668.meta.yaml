  For norms of assertion: the knowledge norm (Williamson) is well-known; many models
  can regurgitate "knowledge norm vs truth norm vs belief norm." To make it in-the-weeds,
  inject a novel twist: e.g., the summary includes a claim about what the knowledge
  norm implies for a specific everyday case — like passing along a rumor in a group
  chat, or a teacher saying "the test is Friday" based on a possibly-changed schedule,
  or sports predictions. Or inject a made-up-ish distinction the asker heard: "epistemic
  norms vs moral norms of assertion" or "constitutive rule vs rule of thumb." The
  summary could be from "a video essay" or "my cousin the philosophy major." Subtle
  misrepresentations to bake in:

  1. Conflating "you shouldn''t assert what you don''t know" with "you''re a liar
  if you say something false" — conflating violating the norm with lying/moral fault.

  2. Saying the knowledge norm was "refuted" by the fact that scientists and doctors
  constantly assert things that turn out false — i.e., treating a standard objection
  (justified false belief cases) as a decisive refutation, and ignoring that defenders
  distinguish blameless violations from compliance.

  3. Conflating "know" in the norm with absolute certainty — saying the knowledge
  norm requires 100% proof, which would make almost all assertion improper (that''s
  the objection from skepticism, but defenders deny knowledge requires certainty —
  fallibilism). This is a great subtle error: the popularizer assumes knowledge requires
  certainty, hence concludes the norm implies near-silence.

  4. Maybe conflating the norm of assertion with Gricean conversational maxims (quality:
  "do not say what you believe to be false") — presenting Grice as the same debate.


