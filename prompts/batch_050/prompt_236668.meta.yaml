  and a classmate who recently lost a grandparent and might find "don''t grieve" offensive.
  Objections: (1) the skull story seems to say death is better than life — does Zhuangzi
  actually endorse that or is it irony? (2) the wife story: he grieved at first then
  stopped ("When she first died, do you suppose that I was able not to grieve?" —
  that''s a real quote; must not quote verbatim without fetching — so the prompt should
