  ticket will lose"), Moorean absurdity ("p but I don''t know that p"), the norm of
  assertion being constitutive vs. consequentialist, objections that the knowledge
  norm is too strong (assertion in conditions of justified false belief — e.g., Gettier
  cases, or the doctor asserting "the tests came back negative" based on reliable
  but mistaken evidence), "reasonable belief" norm defenders (e.g., Jennifer Lackey''s
  "reasonable to believe" norm, Sandy Goldberg). Also the distinction between what''s
  proper to assert and what''s true.


  A good subtle misrepresentation: a summary that conflates "you should assert only
  what you know" with "you should assert only what is true" and then says the knowledge
  norm is refuted because people reasonably assert falsehoods (e.g., justified false
  beliefs). Or conflating the epistemic norm with moral blameworthiness — "the knowledge
  norm says everyone who asserts falsely is a liar" — conflating lying (deliberate
  deception) with violating the assertoric norm. That''s a nice subtle confusion:
  assertion ≠ lying; a sincere asserter of a falsehood they justifiably believed isn''t
  lying but may still have violated the knowledge norm.


