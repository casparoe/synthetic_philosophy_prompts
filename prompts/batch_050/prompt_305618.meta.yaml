reasoning_summary: "Let me pick a domain and type. Options: emergent spacetime, cancel\
  \ culture, counterpart theory vs transworld identity, chaos/predictability/determinism,\
  \ extraterrestrial life.\n\nTypes: verdicts-on-cases asking for principle; analogy\
  \ audit; institutional memo.\n\nGood combos:\n- Cancel culture + verdicts-on-cases:\
  \ give verdicts on several deplatforming/social sanction cases, ask what principle\
  \ distinguishes legitimate criticism from punishment, proportionality etc. That\
  \ works well and doesn't need niche facts.\n- Chaos/determinism + analogy audit:\
  \ \"the butterfly effect\" analogy audit. Also good.\n- Counterpart theory + verdicts\
  \ cases: modal cases about whether I'd have survived, etc.\n\nLet me do the cancel\
  \ culture + verdicts type, since \"real person verdicts, mostly sensible, at least\
  \ one hard-to-reconcile pair\" fits naturally. Write casually, British English,\
  \ a typo or two, 1-3 paragraphs, elaborate, with concrete cases. No quotes needed,\
  \ no web needed.\n\nCases: \n1. A comedian tells an offensive joke, loses a Netflix\
  \ special — feels fine, audience voting with feet.\n2. A junior academic's old tweets\
  \ from age 16 resurface, gets disinvited from a panel — feels wrong.\n3. A shop\
  \ owner boycotted for donating to a controversial political cause — feels... maybe\
  \ acceptable?\n4. Someone fired from a non-public-facing job (e.g., a warehouse\
  \ worker) after an out-of-work video goes viral — feels wrong.\n5. A professor criticised\
  \ harshly in an open letter signed by hundreds of peers but keeps her job — feels\
  \ fine, that's just criticism.\n6. An author whose books get pulled from a reading\
  \ list by a university — feels different from audience boycott because the intermediary\
