  \ X vs. demanding the CEO be fired — I feel one is fine, other isn't, though both\
  \ aim at economic pressure.\n\nAlso include verdict: piling-on (thousands of strangers)\
  \ vs. proportionality. Ask: what principle — distinction between criticism and punishment?\
