  know what I''m entitled to demand of it. The debate seems to split into people who
  think there''s a genuine moral asymmetry between baldly asserting a falsehood and
  leading someone to the same false belief by technically-true implicature, and people
  who think that distinction is just a lawyer''s trick. But both sides keep resting
  their arguments on one or two favourite cases.


  So: write me the desiderata that any adequate theory of the moral difference (or
  lack of one) between lying and misleading has to satisfy. I want the full spec:
  which cases it must come out right on — e.g. the classic ones like the murderer
