  The dogmatism paradox is nice and in-the-weeds: Harman''s paradox about knowledge
  and closure — if you know p, you seemingly know that any evidence against p is misleading,
  so you can dismiss future counterevidence. A plausible summary with subtle misrepresentations:
  conflating dogmatism paradox with Moore''s paradox, or saying it proves closure
  is false, or that it shows knowledge requires ignoring evidence. Let me draft a
  summary attributed to a friend/podcast.


  Summary draft: "I heard a philosopher on a podcast explain the dogmatism paradox
  like this: it''s a proof that the closure principle for knowledge is false. The
  argument: if I know I have hands, then I know that any evidence suggesting I don''t
  have hands must be misleading evidence, so I''m justified in just ignoring any future
  counterevidence without looking at it. Since that''s obviously dogmatic and irrational,
  closure has to go. So the paradox shows that you can know something and then rationally
  refuse to even consider new evidence against it."


  Misrepresentations:

  1. Presents it as a straightforward refutation of closure — actually it''s a paradox:
  plausible premises (closure, and that you know you''re not being deceived... wait
  let me get it right) leading to a conclusion that you can disregard future counterevidence.
  Many defend closure and instead deny that knowing p licenses dismissing evidence;
  or distinguish between knowing evidence is misleading vs. being justified in ignoring
  it.

  2. Conflates "the evidence is misleading" with "you may ignore it" — knowing that
  if p then evidence against p is misleading doesn''t obviously license ignoring it,
  since evidence can be misleading yet still rationally require a response; also losing
  knowledge: once you get the counterevidence you may no longer know p.

  3. The conclusion "you can know something and rationally refuse to consider new
  evidence" overstates — the standard response is that upon receiving counterevidence
  you may cease to know p, so the conditional doesn''t license dismissal.


  Also it frames it as an argument against closure specifically, when the paradox
  is usually taken to challenge the combination of closure with the idea that knowledge
  doesn''t permit dogmatism; some use it against closure, others (e.g., defenders
  of "knowledge-first" views) embrace a form of dogmatism. Harman''s own discussion
  ties it to closure of evidence. The summary is mostly right in structure: know p
  → know that evidence against p is misleading → seemingly licensed to dismiss. Accurate
  parts: the conditional reasoning, the dogmatism worry.


  Also the "if I know I have hands... evidence that I don''t" — fine.


