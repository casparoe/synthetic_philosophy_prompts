  distribution (or a probability for binary questions), and after outcomes are known
  we score the forecasts; scores feed into annual performance reviews and a small
  bonus pool, so the choice of scoring rule matters to people.


  For years we have used the quadratic (Brier) score. Our head of research now proposes
  switching to the logarithmic score, on grounds that it is the "local" proper rule
  — it rewards a forecaster only on the basis of the probability assigned to what
  actually happens, not on the probabilities assigned to things that didn''t — and
  that it more severely punishes overconfident error. Several analysts object, on
  two grounds. First, the logarithmic score is unbounded: an analyst who puts probability
  zero on an outcome that then occurs scores minus infinity, and they argue this makes
  year-to-year scores hostage to a single bad call, and in practice forces everyone
  to fudge probabilities away from 0 and 1 in ways that are superstition, not judgment.
  Second, one analyst argues the whole exercise rests on a philosophical mistake:
  she says the only serious justification for demanding that forecasts obey the probability
  axioms, and for scoring them by accuracy, comes from arguments showing that any
  credences violating the axioms are accuracy-dominated — and she claims those arguments
  justify requiring probabilistic coherence, but do not single out any particular
  proper scoring rule as the uniquely right measure of accuracy, so the head of research''s
  rhetoric about the logarithmic rule being the "correct" one is overreach. The head
  of research replies that the choice of rule just is a choice about what we mean
  by accuracy, and we should choose it deliberately rather than by inertia.


