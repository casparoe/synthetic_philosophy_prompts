reasoning_summary: 'Let me pick a domain and type. Options: propensity interpretation
  of fitness + tautology objection — good for "verdicts on cases" type. That''s a
  classic philosophy of biology debate. A PhD student gives verdicts on cases: survival
  of fittest tautology, fitness as propensity, cases where propensity fails (e.g.,
  traits correlated with fitness by chance, frequency dependence, drift vs selection,
  realized vs expected fitness).


  Let me construct cases:


  1. Two identical organisms, one dies by lightning, other survives — verdict: fitness
  was the same; realized reproductive success doesn''t equal fitness. (Standard propensity
  intuition.)


  2. Coin-flip case: organism with beneficial trait survives, but in a different environment
  the trait hurts — fitness is environment-relative.


  3. Frequency-dependent selection: rare trait advantageous, common disadvantageous
  — propensity depends on population composition.


  4. A trait confers higher expected offspring count but lower variance... e.g., an
  allele that guarantees exactly 2 offspring vs one with 50% chance 0, 50% 5. Verdict?


  5. Drift case: in small population, fitter type goes extinct by chance — verdict:
  still fitter.


  6. The tautology worry: if fitness is defined by actual reproductive success, "survival
  of the fittest" is trivial. Asker''s verdict: propensity interpretation solves this...
  but there''s a known objection: propensities may not exist / can''t be measured
  (Beatty & Finsen critique; the "single-case propensity" worry; Rosenberg''s critique
  that fitness supervenes on causes of survival not on survival itself...).


  Actually, known critiques: propensity interpretation says fitness = expected number
  of offspring (or propensity to survive/reproduce). Problems: (a) single-case propensities
  metaphysically dubious; (b) realized vs expected — an organism can have high fitness
  and leave no offspring; (c) fitness differences can exist without propensity differences?
  Actually there''s the objection by Sober: fitness can differ even when propensities
  are identical (e.g., identical twins in different microenvironments) or propensities
  differ without fitness difference? Mills & Beatty: fitness is realized reproductive
  success and theory isn''t tautological because it''s not definitional.


  Hard-to-reconcile pair: asker says (a) two genetically identical organisms where
  one is killed by a meteorite have equal fitness, but (b) in the case of an allele
  that increases variance in offspring number without changing the mean, asker''s
  gut says the allele is less fit (selection disfavors variance), which is in tension
  with "fitness = expected offspring number" if the means are equal. That''s a real
  tension: propensity as expected value vs. selection on variance (geometric mean
  fitness, Gillespie''s work). Good.


  Another pair: the asker endorses fitness as cause (propensity explains success),
  but also thinks fitness must supervene on traits of organisms — case where two organisms
  have same traits but one happens to be in a patch where predators abound; gut says
  equal fitness? Or unequal because environment-relative?


  Structure per type: verdicts on several cases, ask for principle capturing them,
  note tension, ask about further case, length limit, request "what would change your
  mind."


  Length limit: e.g., "no more than 500 words" or "one page". For a principles deliverable,
