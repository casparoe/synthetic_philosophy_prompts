  Draft:


  "I am a PhD student in philosophy of biology working on the concept of fitness,
  and I keep finding that my case intuitions pull in different directions. Here are
  my verdicts; I want to know what principle, if any, captures them.


  Cases:

  1. Identical twins (genetically and phenotypically identical) are placed in identical
  environments; one is killed by a lightning strike, the other leaves ten offspring.
  Verdict: they were equally fit; actual reproductive output is not fitness.

  2. An allele that, in its bearers, yields a guaranteed two offspring is compared
  with one yielding zero half the time and four half the time (same arithmetic mean).
  Verdict: the low-variance allele is fitter; selection will favor it, and I want
  my account to say why.

  3. A beak morphology that confers high feeding success in a drought year but low
  success in wet years. Verdict: fitness is environment-relative, and there is no
  such thing as the morphology''s fitness simpliciter.

  4. In a very small population, the type with the higher expected offspring number
  goes extinct by drift while the other fixes. Verdict: the extinct type was still
  fitter; drift losses do not retroactively lower fitness.

  5. Rare-male advantage: a male morph has high mating success when rare and poor
  success when common. Verdict: its fitness is genuinely frequency-dependent, not
  a fixed propensity of the morph.

  6. ...tautology worry: If fitness just is realized reproductive success, ''survival
  of the fittest'' becomes trivial; verdict: that is a genuine defect, and a decent
  account must avoid it. But I also think fitness talk is empirically contentful and
  measurable, so an account that makes fitness an unobservable metaphysical propensity
  with no epistemic handle is also defective."


  Hmm — the tension: case 1 says fitness is propensity (expected value), but case
