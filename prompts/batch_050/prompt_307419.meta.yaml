  ---


  So here''s my situation. I''m a backend engineer at a mid-sized fintech, and I somehow
  ended up chairing our bug bounty triage panel — we meet weekly, about 20-30 reports
  a month, small payouts (£50 to £5,000) depending on severity. The job is basically:
  decide whether each report describes a genuine security vulnerability, and if so
  how severe. Sounds fine except the category is hopelessly vague. Is a race condition
  that lets someone withdraw the same £20 twice a vulnerability? Obviously yes. Is
  it still one if it only works one time in ten thousand, under load we''d never realistically
  see? What about an endpoint that leaks whether an email address has an account?
  Where exactly does "intended behaviour" stop and "exploit" start?


  One of our interns did a philosophy degree and keeps going on about vagueness —
  she lent me some stuff on the two main positions, and I''m annoyed to say it''s
  all I think about now. Roughly as I understand it: epistemicism says there IS a
  sharp cutoff (some exact request rate where scraping becomes a DoS, say), we just
  don''t and maybe can''t know where it is. Supervaluationism says vague statements
  are true if they''d be true on every reasonable way of making the term precise,
  false if false on all of them, and neither/undetermined in between — so there''s
  no secret cutoff, just a penumbra of borderline cases.


  What I want: turn this into an actual procedure my panel can follow. Concretely:


  1. A step-by-step process for classifying a report — the questions to ask in order,
  what counts as an adequate answer to each, where the procedure just stops and says
  "not a vulnerability, close it", and where it has to hand over to human judgement
  because the question is one of values (e.g. how much user trust is worth) rather
  than facts.


  2. The procedure has to take a stand on the philosophy, or at least tell me which
  bits of the philosophy matter for practice. E.g. if we''re epistemicists we presumably
  treat borderline reports as having a fact-of-the-matter answer we''re trying to
  find — does that change how we should investigate or argue? If we''re supervaluationists,
  what do we do about the weird result that "either it''s a vulnerability or it isn''t"
  comes out true while neither disjunct is? (My panel does payouts, so "it''s borderline,
  shrug" isn''t an option — someone has to get paid or not.) Also how do we handle
  borderline borderline cases, i.e. reports where the panel can''t even agree on whether
  they''re borderline.


  3. Run the procedure on three reports, including at least one where it spits out
  an answer I''m not going to like (e.g. closing something the reporter will kick
  off about, or paying out for something that feels like intended behaviour). Make
  up plausible reports — a timing side-channel, a self-DoS, whatever you like.


  4. Tell me honestly where the procedure will misfire and what it can''t do. If the
  whole vagueness debate turns out to make no practical difference to triage, say
  so and explain why — that''d almost be a relief.


  No citations or reading lists please, I can''t look anything up. And please answer
  in British English — the American spellings in our vendor docs already drive me
  mad.


