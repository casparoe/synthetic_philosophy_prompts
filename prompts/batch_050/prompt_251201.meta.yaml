  So: read A Tale of Two Cities seriously through the historiographical debate over
  the French Revolution — social/class-struggle interpretation vs. revisionist emphasis
  on ideology, discourse, and contingency. Which scenes actually bear on this? I want
  a reading that does justice to both sides of the ledger: the novel seems to insist
  that the Terror has intelligible causes (Manette''s Bastille letter literally convicts
  the next generation — the past sentencing the present) and yet to treat the revolutionaries''
  class logic as a moral catastrophe (Darnay is guilty of nothing but his bloodline).
