  Adversarial collaboration type pairings:

  - French Revolution: draft joint statement between a social/orthodox (class-struggle,
  Soboul/Lefebvre) historian and a revisionist (Furet/Cobban, ideology/contingency)
  — that''s a real, famous historiographical fight. Great fit for adversarial collaboration:
  agreed claims (the Terror happened, sans-culottes mobilization, etc.), precise disagreements
  (was the Terror structurally necessitated or contingent? was the Revolution bourgeois?),
  cruxes (counterfactuals: would no war in 1792 have meant no Terror?), and evidence
  both accept (the flight to Varennes, the September Massacres, the war). Also "do
  revolutions devour their children" — comparative crux.

  - Mary''s room: adversarial collaboration between a physicalist (e.g., ability-hypothesis
  proponent / phenomenal concept strategist) and a dualist (knowledge argument defender):
  agreed claims (Mary learns something — maybe both agree she gains new abilities
  or new phenomenal concepts; disagree on whether she learns new facts), cruxes (is
  the explanatory gap epistemic or ontological? would a creature with all physical
  info who hasn''t seen red know what red is like?), tests (thought experiments about
  phenomenal concepts, the "phenomenal concept strategy" predictions about concept
  acquisition). Good fit.

  - Empty names: adversarial collaboration between a realist about fictional characters
  (pretense theorist vs. creationist/artifactualist à la Thomasson/van Inwagen?) Hmm,
  could work but more niche.

  - REU: adversarial collaboration between a defender of orthodox EU (risk via concave
  utility) and a Buchak-style REU defender — agreed claims (Allais paradox data, the
  need to respect first-order stochastic dominance), disagreements (whether risk attitudes
  beyond outcome utility are rationally permissible; whether REU is diachronically
  problematic — the "gambles over time" objection; whether EU can recover REU behavior
  by reindividuating outcomes). Cruxes: Allais preferences, the small-stakes risk
  aversion arguments (Rabin), the "utility of gambling" move. This is a real debate.
  Good fit.

  - Algorithmic fairness: adversarial collaboration between a "calibration-first"
  practitioner and an "error-rate parity" advocate — agreed claims (the impossibility
  theorems: you can''t have all three when base rates differ, except in degenerate
  cases), disagreements (which metric matters morally; whether the theorems settle
  the normative question or just frame it), cruxes (is fairness a property of scores
  or of decisions? does using the instrument causally change base rates over time?).
  Good fit and quite in-the-weeds.


