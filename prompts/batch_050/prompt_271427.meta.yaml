  ---


  I am a third-year undergraduate writing the final essay for a seminar on normative
  ethics, and I would like your help diagnosing a dispute rather than settling it.
  Please take on the role of a professional philosopher with expertise in normative
  ethics and metaethics. Think carefully before answering; I would rather have a slow,
  well-argued diagnosis than a quick verdict.


  The dispute: whether the supererogatory exists — whether there is a coherent, nonempty
  category of acts that are morally good, indeed morally admirable, without being
  morally required.


  In our seminar, both sides accept the same cases and the same intuitions about them:
  the donor who gives a stranger a kidney, the soldier who falls on the grenade, the
  colleague who quietly covers your shift every time you ask, and the mundane case
  of giving slightly more to charity than duty plausibly demands. Where they diverge
  is in what to say about these cases, and after weeks neither side has conceded anything.


  Side A holds that morality has at least two tiers: requirements, and a further region
  of the good-but-optional. They argue that a theory without this region makes morality
  implausibly demanding, and that our practices of praise, gratitude, and admiration
  presuppose the distinction. Side B holds that if an act is the morally best thing
  one can do, then one morally ought to do it, full stop; the appearance of a third
  category comes from confusing what is required with what is blameworthy to omit
  — we don''t blame the person who keeps her kidney, but that shows only that blame
  and obligation come apart, not that the obligation was absent.


  Here is the device I built to try to break the impasse, and it failed, which is
  what prompts my question. Imagine a dial that continuously adjusts the personal
  cost of the morally best available act — the same life saved, the same benefit conferred,
  while the cost to the agent rises from trivial, to significant, to ruinous. I expected
  Side A to locate a threshold where obligation lapses and the act becomes supererogatory,
  and Side B to deny any such threshold exists. Instead, both sides described the
  whole curve in their own vocabulary, at every point, and the dial produced no new
  agreement at all.


  My working hypothesis is that this is not really a disagreement about obligation
  at all, but about what the word "ought" is doing in moral language — one side reads
  moral "ought" as "best supported by moral reasons," the other as "required of you,
  such that failure is a shortcoming" — and that the two readings are both legitimate,
  so the debate is at bottom verbal. My second hypothesis, in case the first is wrong,
  is that the real fault line is a bedrock intuition about how demanding morality
  is permitted to be, which neither side can argue for without begging the question.


  Here is what I want from you:


  1. A diagnosis, with reasons: is this disagreement verbal, substantive, or a case
  of two sides answering different questions under one heading? Does the dial case
  tell us anything about which diagnosis is right? Engage with what each side actually
  says, including the blame-obligation move, rather than reconstructing generic positions.

  2. An assessment of my two hypotheses — accept, reject, or refine each.

  3. Given your diagnosis, a statement of what would count as progress: a distinction,
  a decision procedure, an empirical finding about our practices of praise, or a reason
  to think no progress is available and the debate should simply be dissolved or abandoned.


  Please begin by briefly brainstorming, in a few lines, the candidate diagnoses you
  will consider, then argue for the one you find most plausible. Aim for roughly 900–1200
  words, in prose, suitable for me to develop into my essay.


