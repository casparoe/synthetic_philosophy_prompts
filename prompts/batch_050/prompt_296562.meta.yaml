  In American debates over money in politics, one analogy does nearly all the argumentative
  work: spending money on politics is speech, so restricting political spending is
  like restricting speech itself. Courts have relied on versions of it, commentators
  on both sides repeat it, and it is typically deployed to reach a deregulatory conclusion:
  limits on campaign contributions and independent expenditures are censorship by
  another name, constitutionally and morally suspect in the way any speech restriction
  would be.


  I would like you to audit this analogy rather than accept or reject it wholesale.


  First, give the mapping explicitly: what, on the analogy, plays the role of the
  speaker, the utterance, the audience, and the public square; and what feature of
  money — its fungibility, its ability to purchase amplification, printing, airtime,
  staff, or access — is doing the work of the "speech" it supposedly is.


  Second, identify where the mapping breaks. Candidate disanalogies I want assessed,
  not assumed: money is instrumental rather than expressive — a donation does not
  say anything by itself in the way a pamphlet does; speech is non-rival while audience
  attention and media inventory are scarce, so one spender''s "speech" can crowd out
  another''s; contributions are transferred to and spent by someone else, which is
  arguably more like giving than like speaking; and unrestricted spending may affect
  the incentives and dependencies of officeholders in ways that pure speech does not.
  Which of these disanalogies matter for the analogy''s intended use, and which are
  incidental?


  Third, say what the analogy smuggles in. Does it presuppose a speaker-centered picture
  of political communication in which the interests of listeners, and the interest
  in some rough equality of influence, disappear? Does it treat the quantity of amplification
  as deserving the same protection as the content of a message?


  Fourth, test the conclusion. If the analogy holds only partially, does anything
  interesting survive of the deregulatory argument — perhaps for independent expenditures
  but not for direct contributions, or for spending limits but not for disclosure
  requirements? Or was the analogy carrying the whole load?


