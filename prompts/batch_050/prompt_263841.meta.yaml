  Title: "Dogmatism without Dogma"


  The dogmatism paradox: Suppose I know that p. Any future evidence e against p is,
  by my lights, misleading — since p is true, anything counting against it leads away
  from truth. So it seems I can rationally dismiss e in advance without examining
  it. But surely rationality sometimes requires taking counterevidence seriously.


  My proposal: the paradox rests on an equivocation between two readings of "evidence
  against p": (1) evidence that ~p, and (2) evidence that my belief in p was formed
  or is being sustained unreliably. Knowing that p licenses dismissing evidence of
  type (1) in advance... wait, actually the interesting move: knowing p licenses ignoring
  type-1 evidence, but evidence of type 2 is not evidence that ~p; it''s evidence
  about me. Even if p is true, I might believe it for bad reasons (lucky guess), and
  learning that I did can defeat my knowledge without being evidence that ~p. So the
  "dogmatic" inference fails for type-2 evidence: from "I know p" it doesn''t follow
  that evidence of my unreliability is misleading — it might be perfectly accurate.


  Then claim: most real-life cases of "counterevidence" are type-2 (someone tells
  me the test I used was flawed, my memory is degraded), and the paradox''s air of
  irrationality comes from illicitly extending the dismissal from type-1 to type-2.


  Ask for comments: (a) does the type-1/type-2 distinction actually hold up — can
  you construct a case of pure type-1 evidence where dismissal still seems irrational?
  (b) does the proposal smuggle in the conclusion by defining type-2 evidence as outside
  the paradox''s scope? (c) is the claim that knowledge licenses dismissing type-1
  evidence in advance itself defensible — does it conflict with the idea that evidence
  must be weighed on its own merits? Also ask about clarity/structure briefly.


