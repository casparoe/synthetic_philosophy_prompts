  by committing yourself, making reasons rather than finding them. But the more I
  think about Stevens the less sure I am that this framework even applies to him,
  and that seems philosophically interesting rather than just a mismatch.


  Here''s my thought. Stevens never deliberates. He doesn''t weigh a life with Miss
  Kenton against his ideal of professional dignity; he just keeps polishing the silver
