  threatening to quit, and he treats it as a puzzle about her rather than a question
  about what he''s doing. So is the novel about a hard choice gone wrong, or about
  a man who arranged his life precisely so that he''d never have to make one? If values
  really can be incommensurable, is submerging yourself in a role (the ''great butler'')
