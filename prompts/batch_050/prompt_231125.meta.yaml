  Design constraints:

  1. Students should first be put in a position where they themselves propose, and
  feel proud of, two principles that look obviously defensible: (a) some choices about
  a person''s own life/body/reading are that person''s to make, and society should
  respect their preference over those pairs of alternatives; (b) if everyone in the
  group prefers one alternative to another, the group should not settle on the dispreferred
  one. The activity should then arrange preferences and decisions so that these two
  principles, operating together, generate either a cycle in the group''s collective
  ranking or an outcome every participant ranks below an available alternative. The
  students should discover this in the mechanics of play, not be told.

  2. Structure/materials: specify exactly what goes on the cards (each player''s private-sphere
  choice and their meddlesome preferences about others), the decision procedure by
  which the group aggregates (so the paradox appears as a property of the procedure,
  not of bad faith), the sequence of rounds, and a scoring system with small stakes
  that gives players a reason to keep both principles alive as long as possible rather
  than abandoning one at the first sign of trouble.

  3. Scaling: Sen''s original illustration involves two people and one copy of a controversial
  novel; tell me how to scale the structure to 15 participants without diluting the
  logic — whether via pairs, a chain of overlapping private spheres, or sequential
  rounds.

  4. No naming: students should not hear the names of the theorem, its axioms, or
  Sen until the debrief.

  5. Debrief: map each moment of the activity onto the formal result (which moments
  correspond to minimal liberalism, which to weak Pareto, which to acyclicity/consistency
  of social preference); then walk through the exits and what each costs — restricting
  which preferences count (Sen''s own diagnosis of meddlesome preferences), weakening
  the Pareto requirement, treating rights as things to be exercised rather than as
  constraints on which social states may be chosen, or restricting the domain of admissible
  preference profiles. For each exit, indicate how a student who took that exit mid-game
  would have had to play differently.

  6. Tell me what will predictably go wrong the first time I run this — e.g., students
  resolving the toy case by majority vote and concluding the paradox is an artifact,
  or students revising their stated preferences once they see the cycle — and how
  to handle each failure without breaking the game.

  7. Finally, state plainly which feature of the theorem the activity cannot reproduce
  — I suspect the generality of the impossibility (that no aggregation rule whatever
  can satisfy the conditions, as opposed to the particular procedure we used in class)
