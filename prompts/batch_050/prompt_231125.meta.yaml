  I teach a second-year undergraduate seminar in political philosophy (roughly 15
  students, one 90-minute session) and we are about to begin a unit on social choice
  and rights. I want a classroom activity that makes Sen''s liberal paradox — the
  impossibility of a Paretian liberal — land as a live problem before the students
