  Let me draft the anekāntavāda audit:


  Beliefs:

  (a) anekāntavāda: every object has infinitely many aspects, and every substantive
  judgement is true only conditionally, from some standpoint (naya);

  (b) syādvāda / saptabhaṅgī: the right way to assert anything is with "syāt" — in
  some respect it is, in some respect it is not, in some respect indescribable, etc.
  — sevenfold predication rather than unqualified assertion;

  (c) ordinary one-sided claims (ekānta views), like "the soul is eternal and unchanging,
  full stop", are not merely incomplete but mistaken — that''s why the Jains criticise
  Vedāntins and Buddhists;

  (d) anekāntavāda itself is the correct, exceptionless account of how all predication
  works — not merely true from a standpoint;

  (e) epistemic non-violence: adopting a one-sided view is a form of intellectual
  hiṃsā, which is why the doctrine matters ethically and not just logically;

  (f) the doctrine doesn''t collapse into relativism: standpoints can be mistaken,
  and there is a fact of the matter about which predicates hold from which standpoint.


  Tensions:

  - (c) vs (d)/(b): if every judgement is true only conditionally and unqualified
  assertion is the error, then (d) stated unconditionally is itself an ekānta view
  — the self-application problem. Genuine tension. Fixes: say anekāntavāda is itself
  standpoint-relative (but then it''s not exceptionless, weakening (d)); or distinguish
  levels — the conditionalisation applies to first-order claims about substances,
  while anekāntavāda is a meta-principle (but then it''s an exception, in tension
  with "every judgement"); or invoke that it''s true from the comprehensive standpoint.

  - (c) vs (a): if each naya captures a genuine aspect, then the Vedāntin''s "the
  self is eternal" is true from the standpoint of substance (dravya), so in what sense
  is it *mistaken* rather than merely incomplete? The standard Jain answer: the error
  lies not in what is asserted but in the unqualified assertion — denying other aspects.
  So the tension may partly dissolve: (c) can be read as "mistaken as an unqualified
  claim" not "false content". But then (c)''s "not merely incomplete" needs care.
  This is the kind of discriminating work a good answer does.

  - (e) vs (f): apparent tension? If intellectual one-sidedness is violence, then
  condemning ekānta views as mistaken seems itself a one-sided condemnation — but
  this dissolves because Jain ethics distinguishes: condemning the absolutising attitude
  is compatible with respecting the partial truth. Or (e) is a metaphorical extension
  of hiṃsā — actually there''s a real question whether "intellectual hiṃsā" is a standard
  Jain notion... Ahiṃsā is central to Jainism; the link between anekāntavāda and non-violence
  is a well-known claim (often made in modern presentations). It''s safe to phrase
  it as the asker''s own commitment rather than an attributive claim.

  - (f) vs (b): is "there is a fact of the matter about which predicates hold from
  which standpoint" itself a standpoint-relative claim? Apparent tension that dissolves
