  who says he has always known how the universe ends — follows from eternalism at
  all, or whether Vonnegut conflates a block universe with a fatalistic one in a way
  the philosopher should resist.


  2. Friction. Where does the novel resist the philosophical reading? Billy''s time-slippage
  is presented as involuntary and bound up with trauma; the Tralfamadorians perceive
  time but the argument from relativity is about frames of reference, not modes of
  perception. Are these mere literary liberties, or do they mark a real gap between
  what the argument establishes and what the novel imagines?


