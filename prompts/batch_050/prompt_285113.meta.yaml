  high standards and will not flatten either into an illustration of the other. Please
  think carefully, and before composing the reading, spend a short brainstorming pass
  identifying the scenes, structural features, and philosophical fault lines most
  worth discussing.


  The reading I want: interpret Slaughterhouse-Five through the Rietdijk–Putnam argument
  — roughly, the line of reasoning from the relativity of simultaneity according to
  which, if what is real is what is present relative to an inertial frame, and observers
  in relative motion disagree about which distant events are present, then past, present,
  and future events are all equally real. Address, at minimum:


  1. Fidelity. Where does the Tralfamadorian picture genuinely track the relativistic
  argument (and the block universe it is taken to support), and where does it quietly
