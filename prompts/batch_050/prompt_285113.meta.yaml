  block-universe picture that many philosophers of physics defend on relativistic
  grounds: in the novel, the aliens perceive all moments as permanently existing and
  treat the human sense of one moment succeeding another as a local illusion, and
  Billy Pilgrim comes to experience his own life in the same dislocated way.


