  citizens do. Which features does each analogy quietly import that the revolutionary
  target lacks — for instance, does the machine picture smuggle in the assumption
  of a standpoint outside society from which to rebuild it, and does the organic picture
  smuggle in exculpation, making the Terror as blameless as a storm? Finally: does
  Mill''s own preference survive your audit, and if you had to propose a better governing
  analogy for what happened in France between 1789 and 1794, what would it be?


