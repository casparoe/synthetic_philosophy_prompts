  speaks of it as a machine to be designed and built; his opponent speaks of it as
  something that must grow out of the nation''s habits. In researching the debate
  I came upon John Stuart Mill framing exactly this opposition in the opening chapter
  of Considerations on Representative Government:


  "They look upon a constitution in the same light (difference of scale being allowed
  for) as they would upon a steam plow, or a threshing machine... Governments can
  not be constructed by premeditated design. They ''are not made, but grow.''"


