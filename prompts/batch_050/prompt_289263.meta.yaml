  Mill, it should be noted, rejects the machine picture, at least in its crude form.
  But both analogies remain in constant use in discussions of the Revolution: the
  machine analogy underwrites readings on which the Terror was the output of ideology
  and choice — men deciding, badly, what to build — while the organic analogy underwrites
  structural readings on which events unfolded from conditions no one chose. What
  I would like is an audit of both analogies as applied to the French case. Give me
  the correspondence table for each: in the machine picture, what plays the role of
  the engineer, the blueprint, the materials, the broken part replaced by the guillotine;
  in the organic picture, what plays the role of the soil, the seed, the gardener,
  the season. Then tell me where each mapping breaks: machines do not redesign themselves
  mid-operation, but neither do organisms plan; designers can be held responsible
