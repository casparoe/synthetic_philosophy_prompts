  of civilisation but its logical outcome — meaning modern civilisation is inherently
  genocidal and something like it is inevitable as long as we have bureaucracies."


  Subtle misrepresentations to embed: (1) Bauman didn''t say modernity made the Holocaust
  inevitable — he said it was a possibility, a "test" of modernity''s hidden potential;
  contingency matters. (2) He didn''t dismiss antisemitism — he said modern bureaucracy
  was a necessary condition but traditional Jew-hatred supplied motive; actually Bauman:
  neither modernity nor antisemitism alone sufficient; the Holocaust was an outcome
  of an encounter between factors. (3) "industrial killing" — Bauman''s point is more
  about bureaucratic rationality, distance, adiaphorization (though adiaphorization
  is later, in Modernity and Ambivalence / with Donskis). Careful: adiaphorization
  term comes later. (4) Bauman explicitly resisted saying the Holocaust was "German"
  problem vs modern — he criticized viewing it as an interruption of civilisation.
  Also the garden metaphor (weeding) is in Modernity and the Holocaust.


  Also the summary could attribute to Bauman the claim that "science/technology caused
  it" — Bauman''s focus was bureaucracy and rational organization, not technology
  per se.


