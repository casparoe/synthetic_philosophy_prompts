  flipped. An octopus doesn''t. It goes through stages: first the suckers grip, then
  it changes colour oddly, then it moves but badly, then at some point it''s plainly
  itself again. It''s a ramp, not a switch.


  Here''s my argument, such as it is. Most of the debate I read about animal consciousness
  circles around the same things: does the animal have the right brain structures,
  does it do the clever behaviour, does it trade off one goal against another. All
  of that is looking for consciousness in the steady state. I think the transition
  is more informative. If you want to know what''s inside a machine, you don''t watch
