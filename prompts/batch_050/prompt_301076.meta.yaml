reasoning_summary: "Let me pick a domain and type. Domain options: Keynes on probability,\
  \ sortition, Frankfurt cases, Gödel afterlife, Lewis triviality.\n\nType: probability\
  \ estimate with decomposition, describe-a-phenomenon, or analogy audit.\n\nThe analogy\
  \ type fits well with sortition: \"citizens' assembly is like a jury\" analogy —\
  \ commonly used to defend sortition. People say randomly selected citizens are like\
  \ a jury, so they can deliberate like one; used to argue citizens' assemblies are\
  \ legitimate/fair. Audit: what maps, where it breaks (jurors are bound by law and\
  \ evidence presented, judges constrain; citizen assemblies have no verdict constraints,\
  \ agenda-setting power, no voir dire, term lengths, professionalization risk). That's\
  \ fresh-ish and meaningful offline.\n\nAlternatively, probability estimate type\
  \ on Frankfurt cases: \"What's your credence that moral responsibility requires\
  \ alternative possibilities?\" Decompose: whether Frankfurt cases succeed, whether\
  \ they generalize, etc. That could work too but Frankfurt cases are very well-worn.\
  \ The sortition analogy is good and \"in the weeds\" but not too niche.\n\nEpistemic\
  \ request: ask what would change its mind. For analogy audit, ask the response to\
  \ say where its reasoning is most likely to fail / what consideration would flip\
  \ the verdict.\n\nWrite from perspective of someone recently personally relevant:\
  \ e.g., their city council is piloting a citizens' assembly / they served on a jury\
  \ recently. Formal, 1-3 paragraphs.\n\nNo quotes needed. No web needed.\n\nDraft:\
  \ \n\nPrompt: \"Last month I served on a jury... and around the same time my city\
  \ announced a citizens' assembly chosen by lottery to advise on housing policy.\
  \ Every advocate uses the jury analogy: 'we trust random people with verdicts; why\
  \ not policy?' ... audit the analogy.\"\n\nAsk for correspondence table (random\
  \ selection, impartiality, deliberation, binding authority), disanalogies: jury\
  \ questions are binary and constrained by law and evidence presented by opposing\
  \ counsel; assemblies set their own agenda; judges exclude evidence; expert testimony\
  \ in assemblies chosen by organizers; voir dire; jurors decide facts, assemblies\
  \ recommend values-laden policy; duration; juror compensation; polarization; the\
  \ \"mini-public\" representativeness claim vs. self-selection in who accepts; no\
  \ appeal mechanism.\n\nAlso the analogy runs the other direction: jury is used to\
  \ legitimate the assembly, but the jury itself is criticized (Batson, etc.). Whether\
  \ the conclusion — assemblies deserve binding or advisory authority — survives.\n\
  \nEnd with: state where the analysis is most likely to be wrong and what consideration\
  \ would change the verdict (e.g., empirical findings on deliberation quality in\
  \ assemblies).\n\nWrite it out, formal, 2-3 paragraphs."
