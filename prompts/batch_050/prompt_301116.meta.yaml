  Let me draft:


  Paragraph 1: setup — I teach philosophy of mind/cognitive science; next semester
  senior seminar on computationalism; before we read theories I want a desiderata
  document. The core problem: claims that the brain is a computer risk vacuity via
  triviality arguments (any sufficiently complex physical system can be described
  as implementing many computations under some mapping of states). So the seminar
  question: what must a theory of physical computation deliver so that "the brain
  computes" is substantive, falsifiable, explanatory.


  Paragraph 2: specifics of the deliverable — list of desiderata, each with motivating
