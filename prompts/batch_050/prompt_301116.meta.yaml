  Good combos:

  - "Why has the debate stalled" + access vs phenomenal consciousness: the debate
  between GWT/global workspace theorists and higher-order/local recurrency theorists...
  Classic stalled debate. Add a novel angle.

  - Desiderata + computationalism: what a theory of whether the brain computes must
  meet — this has known issues (triviality arguments, Searle, Putnam). Could be good:
  "what would it take for the claim ''the brain is a computer'' to be a substantive
  empirical hypothesis rather than vacuous?" Desiderata type fits nicely.

  - Strange loops + research proposal.


  Let me do desiderata for computationalism, with a fresh framing: the triviality
  problem — every physical system can be interpreted as performing some computation
  (Putnam/Searle), so what must a theory of physical computation deliver for computationalism
  to be non-vacuous? This is well-known but the prompt can inject a niche idea: e.g.,
  a professor designing an undergraduate senior seminar, asking for desiderata that
  a "mapping account" of computation must meet, plus a novel desideratum like explaining
  why some artifacts (laptops) but not others (pails of water) are computers in a
  way that grounds cognitive science''s explanatory practice — and maybe a fresh angle:
  the theory must explain why computational explanations in neuroscience are testable/refutable.


  Inject niche/new idea: maybe introduce a made-up desideratum or hypothetical scenario,
  e.g., "consider two systems..." Or ask for a desideratum concerning large language
  models/analog neuromorphic chips — whether the theory extends to them. Or a new
  wrinkle: the theory should handle "computation under reinterpretation" — if I relabel
  a neuron''s states, does the computation change? And a novel case: a hypothetical
  "oracle chip" that happens to instantiate the same mapping as a cortex but was produced
  by random noise.


  Keep it formal, professor perspective, 1-3 paragraphs. No citations needed. No web
