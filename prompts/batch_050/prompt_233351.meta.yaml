  You are a philosopher specializing in machine ethics and the theory of responsibility,
  with several years of experience consulting for organizations that deploy autonomous
  and semi-autonomous systems. Think carefully about this task; it may help to reason
  through the conceptual distinctions before committing to a design.


  I direct technology governance at a regional hospital network. Roughly twelve times
  a year, my office reviews a proposal to deploy a system with some degree of autonomy:
  diagnostic imaging models, a sepsis early-warning system, robotic delivery carts
  on our campuses, automated insulin dosing in pilot wards, scheduling optimizers,
  and so on. Each review is conducted by a committee of clinicians, nurses, and IT
  staff, none of whom have philosophical training, and each proposal gets about ninety
  minutes of structured scrutiny before our chief medical officer signs off.


  Our recurring failure is not that our systems misbehave; it is what happens afterward.
  When something goes wrong, we discover that responsibility was distributed in a
  way that satisfied no one: the vendor points to the clinical staff who "supervised"
  the system; the clinicians point out that they had no realistic way to second-guess
  it; procurement says they only executed a contract; and the patient or their family
  finds that there is no one to ask for an explanation, no one who can be meaningfully
  blamed, and no clear route to compensation. I want to catch these situations before
  deployment rather than after an incident.


  For the purposes of this procedure, please work with the following four-way distinction
  (refine it if you think it is deficient, but do not collapse it): [taxonomy]


  1. Answerability gap: after an outcome, there is no agent who can be called upon
  to explain why the system acted as it did in terms the affected party can engage
  with.

  2. Culpability gap: no agent plausibly deserves blame or sanction for the outcome,
  because the knowledge and control conditions for blame were scattered across actors
  who each lacked one or the other.

  3. Redress gap: there is no practicable route by which an injured party can be compensated.

  4. Control gap (forward-looking): at the moment of decision, there is no agent who
  both can intervene effectively and is under a duty to do so.


  Note that the available fixes differ by gap: insurance closes a redress gap but
  nothing else; logging and post-hoc explanation tools partially close an answerability
  gap; only redesign of the oversight arrangement can close a control gap, and nominal
  "human-in-the-loop" oversight often fails to do so when the human lacks the time,
  information, or disposition to intervene (rubber-stamping).


  Write a pre-deployment decision procedure the committee can actually run within
  its ninety minutes. It should specify: the questions to ask, in order; what counts
  as a sufficient answer to each; the points where the procedure halts with a recommendation
  not to deploy (or to deploy only at reduced autonomy); the points where it must
  hand the question to a person because it turns on values rather than facts; which
  of the four distinctions must survive translation into checklist language and which
  can be safely merged; and the ways you expect the procedure to misfire.


