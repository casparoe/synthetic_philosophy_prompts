  Bit of an odd question but here goes. I''m a second-year politics student and we''re
  doing a term on democratic institutions — currently on sortition, rotation, term
  limits, all the mechanisms for stopping people digging themselves into power. And
  I keep noticing the same thing happen across every case we look at, and I can''t
