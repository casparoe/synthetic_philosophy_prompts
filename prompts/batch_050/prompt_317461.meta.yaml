  The pattern: a reform is brought in to break the grip of entrenched insiders, and
  it genuinely works — the old insiders are cleared out, nobody can build a career
  in the role any more. But instead of power diffusing to ordinary people, it slides
  sideways to whichever nearby group has the longest time horizon, because once everyone
  in the formal role is on a short clock, the only people with institutional memory
  and know-how are the ones who never rotate.


  So: term limits on legislators get sold as a way to break up the career-politician
  class, and the result is that fresh-faced reps cycle through so fast that the people
  who actually understand the legislation are the permanent staffers and lobbyists,
  who never leave. Closer to home, our student union rotates its officers every year,
  and as a result the permanent union staff and the university admin run rings round
  them — every new president spends half their year learning the job and the other
  half being politely managed. And with the sortition cases — Athens, modern citizens''
  assemblies — the randomly selected people are famously dependant on whoever briefs
  them: facilitators, expert witnesses, the secretariat. Kill the insider class with
  a lottery and a new one sprouts in the advisory layer overnight.


