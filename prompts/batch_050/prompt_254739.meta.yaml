  ---


  I want to stress-test a view I hold — lexical threshold negative utilitarianism
  — against a capable defender, by playing the critic myself. You will play the defender.


  Background, so we share terms: negative utilitarianism gives priority to reducing
  suffering over promoting pleasure; the lexical threshold version holds that suffering
  above a certain intensity ("threshold suffering") cannot be morally outweighed or
  compensated by any amount of pleasure, however great or long-lasting, though below
