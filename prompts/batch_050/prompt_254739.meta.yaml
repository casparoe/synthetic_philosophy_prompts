  (1) The consent problem. The lexical priority is supposed to be a claim about what
  matters for people. But here the very person whose suffering grounds the priority
  judges the trade worth making, with full knowledge. If you override her, the priority
  seems to be about pain-in-the-abstract, not about persons; if you honor her choice,
  the threshold wasn''t lexical after all.


  (2) The phenomenological problem. The denial of commensurability has to fight experience.
  Within a single hour of consciousness, grief is softened by a friend''s joke, dread
