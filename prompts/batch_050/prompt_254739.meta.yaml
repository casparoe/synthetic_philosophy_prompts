  Let me write the case carefully.


  The Anesthesiologist''s Offer. A patient is about to undergo a procedure that will
  involve one hour of agony at the maximum intensity a human nervous system can sustain
  — well above your threshold. There are two buttons. Button A: a perfect analgesic;
  the patient feels nothing, and her life afterward is ordinary. Button B: no analgesic;
  the patient endures the hour, and afterward receives fifty additional years of the
  deepest, most unclouded joy a human life can contain — joy she would not otherwise
  get. The patient is competent, fully informed (she has experienced that intensity
  of pain before, so she knows what she is choosing), and she begs for B. Your view,
