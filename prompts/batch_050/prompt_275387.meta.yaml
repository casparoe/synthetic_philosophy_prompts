  Draft:


  ---


  I serve on an independent research ethics committee that reviews randomized clinical
  trial protocols. We meet monthly and typically review five or six trials per session
  — a mix of drug, device, surgical, and behavioral studies, mostly academic, some
  industry-funded. Our members are clinicians, a biostatistician, two lay representatives,
  and a pharmacist; nobody on the committee has formal training in ethics, and our
  deliberation on any single protocol is usually under forty minutes. When we get
  the equipoise question wrong in one direction, patients get randomized to treatments
  we had reason to believe inferior; in the other direction, we block trials that
  would have resolved genuine uncertainty, and the same patients keep getting treatments
  chosen by habit.


  Our charter requires us to verify that a trial is ethically permissible before randomization
  begins, and the concept we have inherited for this is equipoise. The trouble is
  that it comes in at least three versions that give different verdicts. On one reading,
  a trial is permissible when the individual enrolling clinician is genuinely uncertain
  which arm is better for the patient in front of them. On a second, it is permissible
  when there is honest, sustained disagreement within the relevant expert community
  about the preferred treatment. On a third, what matters is neither any individual''s
  mind nor the sociology of the profession but the state of the evidence: a trial
  is permissible when the existing evidence does not warrant a conclusion that one
  arm is superior. These come apart routinely. Surgeons can be divided fifty-fifty
  between two operations even when the best evidence favors one, because disagreement
  tracks training lineage as much as data. Conversely, evidence can be thin while
  everyone in the field agrees anyway, on the strength of theory and anecdote.


  Please write us a decision procedure we can actually run during a review...


