  Conceptual background to inject: Freedman''s clinical equipoise (honest professional
  disagreement in the expert community about the preferred treatment), distinct from
  "theoretical equipoise" (exact balance of evidence — almost never obtains, and would
  collapse as soon as evidence accumulates); the uncertainty principle (enroll if
  the patient/clinician is substantially uncertain); critiques — equipoise seems to
  make ethics of trials hostage to the distribution of expert opinion rather than
  evidence; the problem of whose uncertainty counts (patient, treating physician,
  community); the relation to favorable risk-benefit; stopping early when evidence
  accumulates (interim analyses break equipoise); trials of standard-of-care vs new
  where evidence strongly favors one but community disagreement persists (e.g., entrenched
  practice); the "evidence vs opinion" issue; component trials: surgical vs medical,
  placebo controls when effective treatment exists (Declaration of Helsinki issues
  — maybe avoid leaning on specific documents; can mention placebo-control question
  generically).


  The procedure should handle hard cases: placebo control when an effective standard
  exists; trials where experts are divided because some haven''t updated on evidence;
  surgical trials where practitioners have strong preferences; trials in a community
  where standard of care differs; continuing vs stopping.


