  Prompt sketch:


  "Thomas Metzinger''s self-model theory holds that what we call the ''self'' is the
  content of a phenomenal self-model: a transparent internal model of the organism''s
  own states, transparent in the sense that the system cannot represent the model
  as a model, so its contents are experienced as simply the way things are. Higher-order
  theories of consciousness, by contrast, hold that a mental state becomes conscious
  by being the target of a suitable higher-order representation, and some proponents
  treat the sense of self as arising from such higher-order monitoring of one''s own
  states.


  Construct a thought experiment in which these two theories deliver different verdicts
  about whether a subject has an experience of selfhood, while agreeing that the subject
  has conscious experience at all. Constraints: the scenario must be physiologically
  and psychologically plausible — draw on documented phenomena such as the rubber
  hand illusion, out-of-body experiences, depersonalization, or asomatognosia rather
  than hypothetical brain scanning or uploading technology; it should be describable
  in one or two paragraphs; and the divergence must not be achieved by stipulating
  what each theory says — the verdicts should fall out of the theories'' commitments
  as stated above.


  After the scenario: (i) state precisely what the self-model theory predicts and
  why, identifying which functional property of the self-model (transparency, the
  phenomenal model of the intentionality relation, integration into a single global
  model) is doing the work; (ii) state what the higher-order theory predicts and why;
  (iii) identify the single structural feature of the case on which the divergence
  turns, and say whether removing it would collapse the case into one where both theories
  agree; (iv) say how a defender of each theory would argue that the case does not
  actually establish the claimed divergence."


