  "The procreation asymmetry is the claim, first formulated by Derek Parfit and later
  developed by David Benatar, that there is a difference in how we should evaluate
  the absence of pain and the absence of pleasure for people who never exist. The
  standard formulation has four parts: (1) the presence of pain is bad; (2) the presence
  of pleasure is good; (3) the absence of pain is good even if there is nobody who
  enjoys that absence; (4) the absence of pleasure is not bad unless there is somebody
  who is deprived of it. Applied to procreation: if I bring a miserable person into
  existence, the pain they suffer is bad (by 1); but if I decline to bring a happy
  person into existence, the pleasure they miss out on is not bad (by 4), because
  there is no one to be deprived. Hence pressing Button M is seriously wrong while
  not pressing Button G is not wrong, so the asymmetry does vindicate the intuitions
  in the Seed Vault case.


  One might object that our reaction to the vault shows we do, in fact, think it is
  bad when happy people are not created — otherwise why would anyone feel even mild
  regret at not pressing G? The asymmetrist''s reply is that this regret attaches
  to people who exist: the caretaker, would-be parents, or a society that values new
  members, none of whom are the merely possible child. Since nobody is deprived, the
  regret does not track a genuine bad.


  It also follows from the asymmetry that there is no moral reason to procreate: since
  failing to create a happy person is not bad, and creating a happy person is at best
  neutral in itself, procreation can never be morally required or even favoured. This
  is why the asymmetry is sometimes called the non-identity problem, because it shows
  we cannot wrong a person by creating them or by not creating them."


