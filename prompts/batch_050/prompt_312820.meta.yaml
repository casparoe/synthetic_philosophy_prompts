  Actually the sunk cost one works well: list known defenses of honoring sunk costs
  and ask for a new defense that''s not on the list. Known defenses: (1) reputation/commitment
  — finishing signals resolve; (2) prospect theory — loss aversion in the domain of
  losses; (3) information/learning — costs correlate with expected benefit (you only
  invested because you thought it good); (4) option value — continuing keeps options
  open; (5) self-signaling/self-knowledge; (6) time-inconsistency commitment device;
  (7) Arkes & Ayton-style framing; (8) waste-avoidance deontology. Ask for a genuinely
  new rationalization. That''s a hard version. Include epistemic request: committed,
  and say honestly whether the new defense is any good.


