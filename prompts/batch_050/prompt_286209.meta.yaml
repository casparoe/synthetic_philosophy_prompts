  I help curate a small fossil collection at a natural history museum, and a pattern
  keeps coming up in conversations with our paleontologist that neither of us can
  find a settled term for. I''d like to know whether biologists or philosophers of
  biology have named this, and if not, what the nearest concepts are and why none
  of them quite fits.


