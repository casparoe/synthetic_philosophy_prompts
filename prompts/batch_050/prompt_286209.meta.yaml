  a few million years. Take any two specimens separated by a short stretch of that
  time and they are similar enough that, had they lived side by side, nothing would
  stop them from being one population. But compare the oldest and youngest forms in
  the series and they are unmistakably different kinds of animal: different teeth,
  different limbs, different sizes. Nowhere in the series is there a generation where
  it seems right to say the old kind ended and a new one began. Every candidate dividing
  line looks arbitrary, and yet the two ends are not arbitrary at all.


  I realize there is a well-known spatial analog of this: populations strung out around
  some barrier, each interbreeding with its neighbors, with the chain''s two ends
  unable to interbreed where they finally meet. We know that case has a name. What
  we can''t find is whether the temporal version has a name of its own, or whether
  it is treated as merely the same phenomenon rotated ninety degrees. It doesn''t
  feel like a mere rotation to us, for two reasons. First, in the spatial case the
  incompatible endpoints coexist, so their failure to interbreed is observable in
  principle; in the temporal case the endpoints never coexist, so saying they "could
  not" interbreed is a counterfactual about animals separated by a million years,
  and it''s unclear what would even make it true or false. Second, the spatial case
  leaves the classification problem local (are the endpoints one kind or two?), while
