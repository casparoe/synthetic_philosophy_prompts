reasoning_summary: 'Let me pick a domain and type. I''ll pick "Paid parental leave,
  childcare, and the dual-earner family" with the commitments type — state a set of
  own commitments and ask whether they hang together. That fits well because policy
  views can have genuine tensions.


  Alternatively, Frege-Geach problem with the commitments type could be good. Let
  me think which combination yields a genuinely non-obvious tension set.


  Paid parental leave domain: commitments could be like: (1) generous paid leave good
  for child development and maternal health; (2) oppose policies that widen gender
  wage gaps / want equal take-up; (3) want to reduce total fertility decline; (4)
  fiscal constraint—fund via employer payroll taxes; (5) universal, not means-tested.
  Tensions: long leave correlates with maternal employment penalties; non-transferable
  leave entrenches gender norms; payroll-tax funding discourages hiring of women of
  childbearing age; etc.


  Frege-Geach: commitments could be expressivist theses — maybe too niche for small
  LLMs. The instructions warn against niche theories small LLMs won''t know. Frege-Geach
  is decently well-known. Parental leave is safer and more "in the weeds" can be injected.


  Type: commitments audit. Let me construct a set with genuine non-obvious tensions:


  (1) Paid parental leave of ~12 months is good policy and countries should adopt
  it.

  (2) The gender wage gap caused by motherhood is a major injustice and policy should
  aim to close it.

  (3) Leave design doesn''t matter much — it''s the generosity/length that matters.

  (4) Fertility decline is a serious problem that leave policy should help address.

  (5) The policy should be funded by employer payroll contributions to keep it off
  the government books.


  Tensions: (2) and (4): evidence suggests long, mother-concentrated leave increases
  maternal employment penalty; designs that promote fathers'' take-up reduce the penalty
  but... actually fertility effects are modest and sometimes positively correlated
  with more gender-egalitarian leave. Real tension: (1)+(2) with (3): design details
  (length, transferability, quota for fathers) hugely matter for the motherhood penalty
  — long leave beyond ~6-9 months is associated with worse employment outcomes for
  women. So (3) conflicts with (2) given (1). And (5) conflicts with (2): payroll-tax
  funding creates employer incentive to avoid hiring women of childbearing age, worsening
  labor market discrimination. Apparent tension that dissolves: (2) and (4) might
  seem to pull apart (fertility vs careers) but actually evidence suggests egalitarian
  leave supports both; or (1) and fiscal concerns dissolve.


  The asker shouldn''t know where the problem is. Keep casual, short-ish. Maybe a
  typo or two.


  Draft:


  ok here''s my policy wishlist for parental leave, tell me if it actually hangs together:

  (1) every country should have at least a year of paid leave per child, wage replacement
  near 100%

  (2) the motherhood penalty in earnings is a serious injustice and closing it should
  be a central goal of leave policy

  (3) the details of leave design (who can take it, how it''s split, whether parts
  are reserved) are second-order — what matters is generosity

  (4) falling birth rates are a genuine problem and leave policy should be partly
  judged on whether it moves them

  (5) funding should come from payroll contributions by employers rather than general
  taxation, so it doesn''t blow out public budgets


  Ask: which of these are in real tension, which only look like it, and what''s the
  cheapest revision. Ask to order by severity.


  Also good: ask them to identify one apparent tension that dissolves (2 vs 4). And
  note the asker may add what they would find most persuasive? That''s for the other
  type. Keep as audit.


  Length check: fine. Casual: yes. No quotes, no citations needed. Good.'
