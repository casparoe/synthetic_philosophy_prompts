  You are a philosopher with expertise in decision theory and practical ethics, and
  you write the kind of case analyses that appear in applied-philosophy journals:
  disciplined about mapping theory onto facts, and honest about where the theory runs
  out. Think this through carefully before writing.


  I want an analysis of the collapse of the cryptocurrency exchange FTX in November
  2022 — and, more broadly, of the worldview publicly associated with its founder
  — through the lens of Pascal''s mugging. Here are the facts as I take them to be
  established, so we can work from a shared case file:


  - The founder, Sam Bankman-Fried, built FTX while publicly committed to effective
  altruism and "earning to give": the stated point of the fortune was that it would
  be donated, and he affiliated himself with the longtermist branch of that movement,
  which holds that the sheer size of the future gives the far future enormous weight
  in our deliberations.

  - He was unusually explicit about expected-value reasoning. In a much-discussed
  2022 podcast interview, he was asked about a hypothetical coin flip that would either
  double the value of the world or destroy it at slightly better than even odds, and
  he indicated that he would take the flip, and keep taking it. (I am paraphrasing;
  treat this as stipulated rather than as a textual matter.)

  - After the collapse it emerged that customer funds had been used to cover the losses
  of his trading firm, Alameda Research — that is, enormous risks were taken with
  other people''s money, on the apparent rationale, at least in part, that the upside
  was philanthropic.


  Pascal''s mugging, for our purposes: a mugger demands your wallet in exchange for
  an astronomically large payoff tomorrow; his offer is worth positive expected utility
  on almost any nonzero credence you assign his story, so an expected-utility maximizer
  seems rationally required to hand over the wallet. The puzzle is that the conclusion
  is insane, and it matters where the insanity enters: the astronomically large payoff,
  the unverifiable hypothesis, the tiny credence, or expected-value maximization itself.


  Now the analysis I want, in four parts:


  1. The mapping. Identify the structural features of the mugging — the astronomical
  payoff, the unverifiable hypothesis, the minuscule probability, the exploit of expected-utility
  maximization — and say which of them, if any, are actually present in the FTX case.
  Be precise: the longtermist claim that the future is astronomically large is one
  candidate for the "astronomical payoff," but the FTX trades were not obviously low-probability,
  and the money at stake was not the mugger''s to promise. Where does the analogy
  hold and where does it strain?


  2. What the lens explains. Grant the mapping as far as it goes: what does Pascal''s
  mugging illuminate about the episode that more ordinary explanations — greed, dishonesty,
  ordinary risk-seeking, fraud — do not? In particular, does the case show that big-number
  reasoning of the mugging type is a real psychological and institutional hazard rather
  than a philosopher''s toy, and if so, what exactly was doing the mugging: an interlocutor,
  a doctrine, or the agent''s own deliberative policy?


  3. Where the lens breaks. Say where the mugging framework misdescribes the episode.
  Candidates to adjudicate, not merely list: Pascal''s mugging is about how to treat
  tiny credences in extravagant hypotheses, whereas FTX looks like a case of risk-loving
  or fraud under quite ordinary probabilities; the mugging''s victim harms only himself,
  whereas here the downside was externalized onto depositors; the mugging assumes
  sincere expected-value maximization, and it is unclear the episode involved sincerity
  of any kind. Which of these disanalogies is fatal to the analysis and which merely
  qualifies it?


  4. What the episode shows about the puzzle. Run the inference the other way. If
  the mugging analysis does apply, is FTX a cautionary confirmation — evidence that
  unconstrained expected-value maximization with large payoffs is institutionally
  dangerous — or does it instead support a particular solution to the puzzle (bounded
  utility, a credibility threshold, discounting unverifiable hypotheses, side-constraints
  against using other people''s stakes)? And if it does not apply, does the episode
  show that the mugging was never the right diagnosis of what goes wrong with big-number
  reasoning in the wild — that the real problem is something the puzzle never modeled?


  Where the theory is silent, say so rather than forcing it to speak. Where the facts
  I have stipulated are doing argumentative work, flag it.


