  Prompt draft:


  I cover science and ideas for a general-interest magazine that runs a satire page,
  and I want a piece built on a passage I keep returning to: the opening of the second
  section of Nietzsche''s On the Uses and Disadvantages of History for Life (1874),
  where he writes that history serves the living person in three respects — as one
  who acts and strives, as one who preserves and reveres, and as one who suffers and
  needs liberation — and matches these to his three kinds of history, monumental,
  antiquarian, and critical.


  Write a deadpan trend piece, about 600 words, in the voice of our lifestyle desk,
  reporting on a booming wellness company that has turned this taxonomy into a product:
  three subscription tiers for managing one''s relationship to the personal and collective
  past, plus a premium "unhistorical" detox modeled on the grazing animal of the essay''s
  first section. The comedy must come from fidelity, not invention: each tier should
  faithfully deliver its mode''s promise and quietly exhibit the failure Nietzsche
  assigns it — monumental history flattering the striver and fabricating usable greatness,
  antiquarian history preserving everything until nothing can grow, critical history
  liberating by condemnation and leaving its client with no past to stand on. Customer
  testimonials, a spokesperson, and one dissatisfied subscriber each mode fails. Deadpan
  throughout, no winking, funny to a Nietzsche reader and legible to someone who has
  never opened the essay; the reader should be able to reconstruct the actual triad
  and its dangers from the parody alone.


