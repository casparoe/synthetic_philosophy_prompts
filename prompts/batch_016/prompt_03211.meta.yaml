  Let me recall the actual specifics of the Pasadena game -- Nover & Hájek''s setup
  where a coin is tossed until heads first appears on toss n, with payoff $(-1)^{n+1}
  \cdot 2^n / n$, and the expected value sum involves each term weighted by $1/2^n$.


  Working through this, the expected value reduces to the alternating harmonic series,
  $1 - 1/2 + 1/3 - ...$, which converges to $\ln 2$ but only conditionally, since
  the absolute values sum to the divergent harmonic series. That conditional convergence
  means Riemann''s rearrangement theorem applies, so reordering the terms could make
  the sum equal any real number, or diverge entirely — the expected value isn''t actually
  well-defined.


  This is exactly what makes Pasadena''s paradox stranger than St. Petersburg''s:
  at least St. Petersburg diverges cleanly to infinity, whereas here the answer is
  fundamentally order-dependent and unstable, which is why philosophers like Colyvan,
  Fine, Hájek and Nover, and Easwaran have debated whether expected utility theory
  needs some notion of "resilience" to rearrangement or whether such pathological
  cases should just be excluded.


