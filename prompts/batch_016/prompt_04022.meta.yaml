  This ties into Hofstadter''s idea of superrationality, where in a one-shot prisoner''s
  dilemma between perfect logicians, symmetry of reasoning leads both to cooperate
  rather than defect—a departure from standard causal decision theory''s Nash equilibrium
  logic.


  Later formalizations, like Yudkowsky''s Timeless and Functional Decision Theory,
  along with Wei Dai''s Updateless Decision Theory, try to capture this: since your
  decision algorithm''s output is logically linked to other instances of that same
  algorithm (or to predictions based on it), you should act as if you''re controlling
  all those linked instances, not just your own causal branch.  Newcomb''s problem,
  Parfit''s Hitchhiker, and prisoner''s dilemmas against copies of oneself are the
  classic examples motivating this. Acausal trade generalizes this further to agents
  with different values who each predict what the other would do and condition their
  behavior accordingly without any way to verify or communicate — I''m wary of veering
  into Roko''s Basilisk territory here since that''s a sensitive meme I''d rather
