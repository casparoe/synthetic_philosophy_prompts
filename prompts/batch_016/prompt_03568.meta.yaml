  Recalling Buchak''s REU theory from "Risk and Rationality" (2013): outcomes are
  ranked worst to best and REU is computed as the worst outcome''s utility plus a
  weighted sum of utility differences between consecutive outcomes, where each difference
  is weighted by a risk function applied to the decumulative probability of achieving
  that outcome or better — with the risk function mapping [0,1] to [0,1], increasing,
  and anchored at 0 and 1.  This construction is formally equivalent to Quiggin''s
  Rank-Dependent Utility applied to probabilities, though Buchak derives it axiomatically
  from preferences over bets and treats risk attitudes as primitive, extending the
  framework to subjective probability settings via a Ramsey/Savage-style construction.


