  Löb''s theorem says that if a formal system can prove that "provability of P implies
  P," it can already prove P outright — meaning a consistent system generally can''t
  prove its own soundness scheme except for statements it already proves, which ties
  directly into Gödel''s second incompleteness theorem via the case where P is a contradiction.


  This connects to what MIRI calls the "Löbian obstacle" in AI safety and agent foundations
  — from Yudkowsky''s "Tiling Agents" work and later research by Fallenstein, Soares,
  Christiano, and Critch — the problem of an agent that only self-modifies or builds
  a successor when it can prove the action is safe, where the successor reasons the
  same way.


  The core issue is that Löb''s theorem prevents an agent using formal system F from
  proving that "if my successor''s proof in F says A is good, then A is actually good,"
  without already being able to prove A directly. This means a system can never fully
  vouch for the soundness of another instance of itself (or its own future reasoning)
  without risking inconsistency, creating a genuine barrier to self-trust across formal
  reasoning systems.


  This poses real problems for "tiling" agents - an AI that wants to build a successor
  it can fully verify will act trustworthily runs into this wall, since it can''t
  formalize "trust my successor''s proofs" without risking triviality. Proposed workarounds
