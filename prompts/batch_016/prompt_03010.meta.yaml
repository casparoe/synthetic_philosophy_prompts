  Plantinga defines a maximally great being as one exemplifying maximal excellence
  in every possible world, and argues that since it''s possible such a being exists,
  S5 modal logic entails it exists necessarily and thus actually. I''m also considering
  the classic parody objections here, like the possible-island argument or the symmetrical
  worry that one could equally posit the possibility that maximal greatness is impossible,
  which by S5 would yield the opposite conclusion.


