  games where agents reasoning identically conclude that whatever decision procedure
  they''d adopt, the other player would too, so both should choose cooperation since
  it dominates mutual defection—but this only works when players and the game are
  essentially identical, unlike the asymmetric, causally disconnected agents ECL addresses.


  ECL differs in three key ways: it grounds itself in evidential decision theory,
  an established (if contested) framework, rather than inventing a new heuristic norm;
  it doesn''t require exact symmetry, applying instead to any agents whose reasoning
  correlates with mine to some degree—other consequentialists, other civilizations
  converging on similar decision procedures; and it extends naturally to agents with
  different values entirely.


