  Wei Dai introduced updateless decision theory around 2009 on LessWrong as an alternative
  to evidential and causal decision theory: rather than updating on current information
  and maximizing expected utility from that point, an updateless agent commits in
  advance to a policy mapping observations to actions, chosen to maximize expected
  utility from the prior, so it sometimes acts against what seems locally rational
  in order to honor the globally optimal precommitment.


  The classic illustration is Counterfactual Mugging: Omega flips a fair coin, and
  if tails it gives you $10,000 provided it predicts you''d have paid $100 had heads
  come up; if heads actually comes up, it asks for that $100. A causal decision theorist
  who observes heads has no causal way to affect the already-resolved coin flip, so
  they''d refuse to pay.


  Yet an agent that commits ahead of time to a policy of paying when asked comes out
  ahead in expectation, since the same disposition must hold across both branches
  for Omega''s prediction to be reliable—illustrating how updatelessness can beat
  updating when branches are correlated through a predictor. Another example is Parfit''s
  Hitchhiker: stranded in the desert, a driver will only give you a ride if they predict
  you''ll pay $1000 once you''re safely in town.  A CDT agent reasoning once already
