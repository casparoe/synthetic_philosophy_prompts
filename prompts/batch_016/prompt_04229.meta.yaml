  The puzzle centers on tension between Lewis''s Humean Supervenience -- chances are
  determined by the actual pattern of events (the Humean mosaic) -- and the Principal
  Principle, which says rational credence should match known chances. If chance at
  time t supervenes on what actually happens afterward, then once event A occurs,
  it''s unclear what happens to the chance assigned to A before it occurred, since
  that earlier chance was supposed to be grounded in the total pattern of events including
  the outcome itself.


  This is the classic undermining problem: a chancy process could, purely by coincidence,
  produce an outcome pattern that would make a different set of regularities count
  as the "best system," thereby undermining the very chances that supposedly generated
  that pattern. That creates a strange feedback loop where the chance of a pattern
  occurring depends on facts the pattern itself would need to establish.


