  value of gathering free, statistically informative evidence before choosing an action
  is never worse than deciding without it—information can only help or be neutral,
  provided the agent conditionalizes correctly and acts optimally afterward. The key
  caveats are that the information must be truly costless and that the agent must
  use it rationally, since misinterpreting or misusing the information could undermine
  the theorem''s guarantee.


