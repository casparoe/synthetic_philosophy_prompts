  Working through the Liar/Gödel connection more carefully to nail the technical details
  for a good question: Gödel''s first theorem constructs a self-referential sentence
  claiming its own unprovability in system S, and if the system is consistent, that
  sentence turns out true but unprovable.


  The Liar paradox differs — "this sentence is false" generates an actual contradiction
  rather than mere incompleteness, since assuming its truth or falsity each leads
  to the opposite. Tarski''s response was that any language containing its own truth
  predicate and allowing self-reference collapses into inconsistency, so a consistent
  truth theory requires a hierarchy separating object language from metalanguage.


  I''m connecting this to Tarski''s undefinability theorem, which uses diagonalization
  similar to Gödel''s proofs, showing no consistent language can define its own truth
  predicate satisfying the T-schema. Kripke later pushed back on the hierarchy approach
  as artificial and unlike how natural language actually functions, since ordinary
  language seems to use a single truth predicate that handles self-referential sentences
  without paradox in many cases.


  His fix builds truth values iteratively using strong Kleene logic: starting undefined
  everywhere, sentences get assigned true/false as they become determinable, while
  genuinely paradoxical ones like the liar remain permanently ungrounded at the fixed
  point where the process stabilizes. This creates a distinction between "grounded"
  sentences with definite truth values and "ungrounded" ones stuck in the truth-value
  gap.


  The revenge problem then shows that constructing a "strengthened liar" using ordinary
  negation to say "this sentence is not true" (where not-true includes the gap) seems
  to recreate the paradox from outside the object language, since Kripke''s strong
  Kleene negation of "undefined" stays "undefined" rather than becoming "true" --
  so the language itself can''t express the stronger notion of "not true" needed to
  trigger the paradox internally.


  Kripke''s fix gives a language with its own truth predicate, but it falls short
  of the full semantic closure originally hoped for, which was meant to escape Tarski''s
  hierarchy of metalanguages altogether.


