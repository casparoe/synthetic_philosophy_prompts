  Judgment theories claim emotions are essentially evaluative judgments, so fear equals
  the belief that something is dangerous. Recalcitrant emotions—like fearing a spider
  you know is harmless, or persistent jealousy you judge unwarranted—pose a problem
  here, since the emotion outlasts or contradicts the corresponding judgment. This
  tension is a well-known puzzle discussed by Greenspan, Tappolet, Brady, D''Arms
  and Jacobson, and Prinz.


  If fear just is the judgment "that''s dangerous," recalcitrant fear would require
  simultaneously judging something dangerous and not dangerous—either a contradiction
  or a strange doxastic state unlike ordinary belief, since beliefs track evidence
  while emotions can resist rational updating. This motivates perceptual theories,
  like Prinz''s and Tappolet''s, which instead compare emotions to perceptual appearances
  or illusions rather than judgments.


  The Müller-Lyer illusion is a good analogy: you can perceive the lines as unequal
  even while believing they''re equal, just as you can "feel" a spider as dangerous
  while judging otherwise—these are different mental state types that can conflict
