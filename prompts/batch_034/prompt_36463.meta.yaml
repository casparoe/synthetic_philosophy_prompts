  no demonstration of need. Each of these design choices contrasts with the welfare
  systems most countries actually run, which are means-tested, conditional, often
  in-kind (housing vouchers, food assistance, service provision), and frequently assessed
  at the household level. So the question is: what does this package of design features
  presuppose?


  Take them one at a time. Uniformity in amount: the same payment to the thrifty and
  the extravagant, the healthy and the chronically ill, the resident of a cheap town
  and of an expensive city. If the level of the payment is justified by appeal to
  what people need (and UBI advocates usually do justify the level that way — enough
  to live on, insecure of context), the same level for people with very different
  needs is a strange choice; it suggests the payment is not aimed at satisfying needs
