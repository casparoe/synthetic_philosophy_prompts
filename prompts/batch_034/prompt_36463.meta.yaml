  A universal basic income, as its advocates specify it, is a regular cash payment
  from the state that is (i) uniform in amount across recipients, (ii) paid to every
  individual adult as an individual rather than assessed per household, (iii) not
  reduced or withdrawn as earnings rise, and (iv) attached to no conditions at all
