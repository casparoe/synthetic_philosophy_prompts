  that presentism and the special theory of relativity are incompatible (Putnam''s
  argument), decomposition.


  - Death penalty + memo: institutional body deciding... a state clemency board, or
  a state legislature considering abolition, memo weighing retribution vs deterrence
  vs risk of executing innocents. That''s a classic. To make it in-the-weeds: inject
  a niche angle, e.g., a proposal to retain the death penalty only with a "beyond
  any doubt" standard plus requirement of DNA evidence, or the "super-deterrence"
  empirical claim that each execution deters N murders (the Ehrlich / capital punishment
  deterrence literature). A memo to a state commission.


  - Quine on moral values + verdict-from-track-record: Quine''s verdicts on earlier
  cases (ontology, epistemology holism, naturalism, extensionality) and predict what
  he''d say about a new case, e.g., moral expressivism, error theory, moral realism.
  That''s fun: "My friend is a Quinean... verdicts: no meanings beyond behavior, no
  analytic/synthetic distinction, ontological commitment via quantification, epistemology
  continuous with science... will he say moral statements are cognitive? Expressivist?
  " Quine actually wrote "On the Nature of Moral Values" — he took a kind of pragmatic/scientific
  view, seeing moral values as... Quine viewed moral judgments as having some second-class
  cognitive status, not purely expressive; he was somewhat like a sentimentalist-cum-naturalist.
  A track-record prompt could predict what Quine would say about error theory vs expressivism
  vs Cornell realism.


  - Banality of evil + probability or track record. Arendt''s verdicts on Eichmann:
  not a monster, thoughtlessness, etc. New case: e.g., an AI system administrator?
  A modern whistleblower? Predict Arendt''s verdict on a new case — like a mid-level
  compliance officer at a tech company who approves mass surveillance, or a bureaucratic
  genocide via algorithms. That''s engaging.


  The death penalty memo is very apt for the memo type: institutional body (a state
  commission / legislative committee) deciding a concrete case with retribution vs
  deterrence vs innocence risk. Inject niche idea: the commission considering a compromise
