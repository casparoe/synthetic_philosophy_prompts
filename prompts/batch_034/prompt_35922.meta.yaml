  I''m a software engineer with no formal training in philosophy, and there''s a pattern
  in my own field that I''ve never been able to articulate a justification for. I''d
  like you to reconstruct what view of knowledge it presupposes.


  Here is the pattern. On one hand, cryptography is built on a doctrine, usually attributed
  to Kerckhoffs, that a system should remain secure even if everything about its design
  is public. We treat "security through obscurity" — hiding the algorithm, relying
  on a secret design — as a rookie mistake, almost a moral failing. On the other hand,
  the public-key cryptography that secures nearly all internet commerce (RSA, Diffie–Hellman,
  elliptic curves) rests on assumptions like "there is no efficient algorithm for
  factoring large integers," and nobody has ever proven any such thing. P versus NP
  is open; the hardness of factoring is open; the discrete logarithm problem is open.
  In effect, civilization''s payment infrastructure runs on unproven conjectures,
  and the profession regards this as prudent.


  So the practice trusts one kind of "no one has found a way in" and distrusts another.
  Many people have failed to break RSA for decades, and we take that as strong evidence;
  many people have also failed to discover a vendor''s secret design, and we take
  that as no evidence at all. What theory of evidence or knowledge does that split
  presuppose?


  My own guess, for what it''s worth, is that the asymmetry has something to do with
  the difference between facts that exist somewhere and facts that have to be created.
  A secret design exists in someone''s head or filing cabinet, so its "not being known"
  is a contingent fact that one act of espionage or one leak can reverse, whereas
  an efficient factoring algorithm, if it exists at all, exists nowhere until someone
  invents it, so its "not being found" reflects the difficulty of creation rather
  than the security of storage. But I can see objections to my own story: mathematical
  discoveries do happen abruptly, by single individuals, and when one happens, the
  hardness assumption collapses overnight just like a leak collapses a secret. So
  maybe the practice rests on something else, or maybe it''s just incoherent, or maybe
  both stances are underwritten by different views that only seem to be the same kind
  of trust.


