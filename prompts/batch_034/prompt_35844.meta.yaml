  competing against other teams. But there are unlisted side effects that matter:
  e.g., the task involves an envelope labeled "confidential — do not read", or moving
  a chair that someone is about to sit on, or the clock. The point: agents optimise
  the published measure; the unmeasured harm only becomes visible in a second round
