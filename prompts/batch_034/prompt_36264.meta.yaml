  Key content: Problem of old evidence (Glymour raised it against Bayesian confirmation):
  when a theory T successfully explains evidence E that was already known before T
  was proposed (e.g., general relativity and the anomalous perihelion advance of Mercury),
  P(E) = 1, so P(E|T) = 1 = P(E), and the likelihood ratio is 1 — no confirmation.
  Standard responses: counterfactual/evidential (Howson–Urbach: imagine not knowing
  E, use P(E|T) relative to a state where E deleted), garbling/added auxiliary assumptions
  (Eells), "new problem" solutions (Learning old evidence, Jeffrey conditioning),
  reduction of uncertainty about whether T entails E. The ML translation: models that
  retrodict training data vs. held-out validation; the issue of "the data was already
  in the training set" — test set contamination, look-ahead bias in backtesting; the
  question of how much to credit a theory that fits data its designer already knew
  — analogous to a researcher constructing a model after seeing the data (overfitting,
  post hoc fit, garden of forking paths, p-hacking). But there''s a disanalogy: in
  ML, knowing data in advance is a *defect* (data leakage, hindsight bias), whereas
  in confirmation theory the old evidence *does* seem to confirm (Mercury''s perihelion
  really did confirm GR). Residue: the Bayesian framework''s diachronic rigidity,
  the distinction between credence in E=1 vs. the information E carries about T; whether
  "hold-out set" has any counterpart — in real science there are no fresh hold-outs
  for historical events. The residue report would cover: what translates (likelihood
  ratio machinery = Bayes factor; the counterfactual deletion = ablation/removing
  data from training set), what distorts (a scientist isn''t fitting parameters),
  what has no counterpart (the agent''s epistemic history — training data contamination
  worries in ML are about estimation bias, not confirmation).


