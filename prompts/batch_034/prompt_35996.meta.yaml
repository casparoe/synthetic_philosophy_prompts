  Also the adaptive preference item (5): is it a tension? With what? With 2? If her
  contentment is genuine... Actually tension: if the metric is resources, contented
  poor person with few resources is clearly owed more; if welfare, she''s equal already.
  Item 5 commits to resource-ish metric; item with "we shouldn''t equalize... only
