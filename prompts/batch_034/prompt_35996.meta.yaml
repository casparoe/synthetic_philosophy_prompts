  Idea: Commitments type on equality of what? Someone holds: (1) that a person born
  with expensive medical needs shouldn''t be worse off through no fault of their own;
  (2) that people who derive huge enjoyment from expensive hobbies should be able
  to keep the fruits of their effort; (3) that we should equalize opportunities not
  outcomes; (4) something about adaptive preferences / capability tension. The classic
  tension: Dworkin''s distinction between bad luck of circumstances vs. tastes/ambitions
  — expensive tastes problem. Also the capability approach vs. resourcism re: disability.
  The asker holds: disability should be compensated (resource view struggles, capabilities
  handles), expensive tastes should not be compensated (anti-welfare), but also supports
  equalizing happiness... include an apparent tension that dissolves.


  Alternatively, practice type: something like a welfare-state institution — e.g.,
  the fact that disability benefits compensate for lack of access but not for plain
  unhappiness; or the practice of accommodation law (ADA: provide wheelchair ramps,
  but not fund subjective well-being). What theory of equality does accommodation-based
  disability policy presuppose?


  Let me draft the commitments version:


  Asker, no academic background, thinking on own. Commits:

  (a) The point of fairness is that nobody should be worse off than others because
  of bad luck in the "birth lottery" — being born with a disability or into poverty
  isn''t your fault, so society should level that.

  (b) If someone works hard and earns more, fairness doesn''t demand taking that away
  — people should bear responsibility for their choices.

  (c) But choices depend on your temperament you were born with: some people are born
  energetic and disciplined, others anxious and depressive. So the hard worker''s
  hard work is also luck of birth. Ask: doesn''t (c) undermine (b) completely?

  (d) Also: they think adaptive preferences matter — someone who grew up with little
  and wants little: is she equal to a person who grew up rich and wants a lot? Ask
  whether society owes her the means to her modest goals or something more.

  (e) something about expensive tastes — the gourmet vs. the simple person: if we''re
  evening out welfare, do we have to subsidize the gourmet''s caviar? Asker feels
  we don''t, but feels we DO owe extra to someone whose disability makes ordinary
  functioning cost more resources. What''s the difference?


  The genuine tensions: (a)+(b) is the classic luck egalitarian terrain; (c) is the
  "expensive tastes / responsibility" collapse problem — if temperament is luck, then
  choices aren''t fully attributable. The disability vs. expensive tastes asymmetry
  is Dworkin''s distinction between handicaps and expensive tastes (tastes integral
  to personality vs. ambition). Apparent tension that dissolves: e.g., (b) "people
  should bear their choices" vs. "children shouldn''t suffer for parents'' choices"
  — dissolves because children made no choices. Or: "compensate disability but not
  bad mood/attitude" — capability vs. welfare.


  Design the belief set:

  1. No one should be worse off than others through unchosen bad luck (natural/social
  endowments).

  2. People should bear the consequences of their own choices — society shouldn''t
  equalize outcomes between the prudent and the reckless.

  3. A person born with a chronic illness or disability should get extra resources
  so they can live a decent life.

  4. A person who just happens to need lots of expensive things to be happy (loves
  opera, skiing, fine food) should NOT get extra — we shouldn''t subsidize expensive
  tastes.

  5. A person from a poor background who has learned to want very little should not
  count as equal just because she''s content — she''s owed more than her contentment
  suggests.


  Genuine tensions: 3 vs 4 — both are "unchosen conditions generating needs"; what
  distinguishes disability from expensive taste? (Dworkin''s answer: tastes integral
  to personality / preferences vs. welfare deficit; capability answer: functioning).
  And 1 vs 2 given that choices flow from temperament (luck). The asker could add:
  "I also believe that whether someone makes good choices is largely down to temperament
  they were born with, so even the reckless person''s recklessness is partly bad luck"
  — but that would collapse 2. Maybe keep 2 but add the temperament point as their
  worry rather than commitment, and ask them to check. Actually the type calls for
  the asker not to know where the problem is. So list the commitments and ask for
  an audit, maybe with the temperament worry voiced but not resolved.


  Apparent tension that dissolves: 1 vs 3? No. Maybe: "I think a bad gambler who loses
  everything shouldn''t be rescued to the level of a prudent person (choice), but
  I also think someone born with a gambling addiction should be treated like any other
  illness" — the dissolving move: addiction''s compulsive dimension vs. choice. Hmm,
  that''s a real tension, not apparent. Apparent one: "I believe in equalizing opportunities,
  not outcomes" vs. "I think society should compensate disability" — dissolves because
  disability compensation can be framed as opportunity-equalization. Or: "I don''t
  believe in compensating expensive tastes" vs. "I think society should fund education
