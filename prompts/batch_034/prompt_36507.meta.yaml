  Analyze the Terri Schiavo case (1990–2005) as a problem of decision-making under
  moral uncertainty, and then tell me where the framework breaks. The facts, so we
  don''t get tangled: Terri Schiavo suffered cardiac arrest in 1990 at twenty-six,
  leaving her in what most courts eventually accepted was a persistent vegetative
  state. Her husband Michael petitioned to remove her feeding tube, testifying that
  she had said she would not want to be kept alive artificially; her parents fought
  him for years, insisting she was minimally conscious and that removing the tube
  would be killing her. The tube was removed and re-inserted more than once; in 2005,
  after courts finally sided with the husband and Congress passed emergency legislation
  that the federal courts declined to act on, the tube was removed for the last time
  and she died thirteen days later. The autopsy showed a brain roughly half the normal
  weight and damage consistent with blindness and with no awareness.


  The moral uncertainty literature offers two main tools: maximizing expected choiceworthiness
  (weight each theory''s verdict by your credence in it) and the moral parliament
  (let representatives of each theory you partly believe negotiate a compromise).
  The decision-makers here — Michael Schiavo, the parents, the judges — were uncertain
  not just about facts but about moral questions: whether a patient in a persistent
  vegetative state has welfare interests at all; whether removing a feeding tube is
  an omission with bad consequences or an act of killing; whether substituted judgment
  (what she would have wanted) or a best-interest standard governs when the patient
  never spoke clearly enough; whether the sanctity of an innocent human life has a
  lexical weight that no quality-of-life consideration can touch.


  I want a careful mapping. For each of the main decision points — Michael''s initial
  decision to petition, the trial court''s 2000 ruling, and the 2005 removal — say
  what expected choiceworthiness and what a moral parliament would recommend, credences
  being what the actors plausibly had. Then the harder parts:


  1. Notice that some of the theories at issue deny that Terri is a moral patient
  at all. In the parliament metaphor, is that a vote for removal, or an abstention
  — and if it''s an abstention, does the framework quietly hand the decision to whichever
  theory attributes the most interests to the most beings? Does expected choiceworthiness
  face a measure problem when the very population whose welfare is being summed is
  theory-relative: if theory A says there are no experiential interests at stake and
  theory B says there is a massive interest in continued life, is the expected choiceworthiness
  of removal really just credence-weighted harm, or is there double counting or an
  apples-to-oranges problem in the aggregation?


  2. Theories with lexical prohibitions. If one holds, with some credence, that deliberately
  ending an innocent life is infinitely or lexically bad, does expected choiceworthiness
  collapse into that theory whenever credence is nonzero? The parliament is supposed
  to be a workaround for exactly this. Does it work here, or does it just relabel
  the problem?


  3. Substituted judgment is itself a moral theory about how to decide, not a first-order
  verdict — the parliament has to elect its own chair. What happens to the two-level
  structure when the choice among decision procedures (substituted judgment vs best
  interests vs presumption for life) is itself the object of the moral uncertainty?


