  ---


  I chair the methodology panel of a fourteen-person forecasting unit that supplies
  numeric probability estimates to our parent organization''s risk committee — we
  forecast operational, market, and reputational events on quarterly horizons. For
  years our output was qualitative, but two years ago I pushed for the move to explicit
  credences, and last quarter''s evaluation has landed us in a controversy that my
  panel must resolve by written opinion.


  The immediate occasion is the case of one of our strongest forecasters. Two facts
  emerged from the year-end review. First, while each of her individual forecasts
  was as well-calibrated as anyone''s on the panel, taking her forecasts across related
  questions together reveals incoherence: on several occasions the probabilities she
  assigned to mutually exclusive outcomes, issued weeks apart, sum to considerably
  more than one, and no single omniscient probability assignment could rationalize
  her ledger. Second, in an exit interview she admitted that on one question she deliberately
  reported a higher credence than she actually held — around a supplier insolvency
  she put at maybe fifteen percent but reported thirty — because she believes the
  risk committee systematically underreacts to that class of risk, and she wanted
  her forecast to do compensatory work as an action rather than a report.


  My panel is split three ways. One faction wants formal discipline: adopt a strictly
  proper scoring rule, evaluate each forecast on its own, and treat her strategic
  misreporting as falsification. A second faction argues that incoherence across separately
  issued forecasts is a bookkeeping artifact, not a rational failing — no one is ever
  asked all questions at once — and that her distortion, whatever its ethics, actually
  improved the committee''s decisions, which is the point of the exercise. A third
  worries that any scoring regime we adopt will reward calibration and resolution
  but ignore whether forecasts have been reached by rational updating, which none
  of our metrics can see.


  Draft the opinion I will circulate before our next meeting. It should recommend
  a concrete policy — what (if any) scoring rule we adopt, how we treat cross-question
  incoherence, and what we do about this forecaster specifically — and it should engage
  the strongest version of the position that loses, not a caricature of it.


