  The exchange, reconstructed as faithfully as I can (their words are close to verbatim;
  I''ve trimmed the snark):


  (1) One commenter, whom I''ll call P, opened with the money pump. If ''better than''
  isn''t transitive, there can be options A, B and C with A better than B, B better
  than C, and C better than A. Someone holding all three rankings can be cycled through
  them indefinitely, paying a small fee at each step to swap for something ''better'',
  ending where she started but poorer. Since being exploitable in this way is a paradigm
  of irrationality, he concluded, the better-than relation had better be transitive
  — and since it''s also complete-ish and asymmetric, it should behave like the ordering
  real-valued utilities give us.


  (2) The reply, from a commenter I''ll call Q, was that money pumps threaten choices,
  not comparisons: they show you can''t act on an intransitive ranking, not that the
  ranking itself is incoherent. She then ran a spectrum argument. Line up a huge sequence
  of worlds. At one end: a short life of extraordinarily high quality. Each subsequent
  world extends the life by a tiny sliver while degrading its quality by a degree
  too small to register as a loss. Reasonable people judge each world at least as
  good as its predecessor; indifference, like ''better than'', would then seem to
  inherit transitivity; yet at the far end sits a very long life of unremitting drudgery,
  obviously worse than the one we started with. Either each imperceptible difference
  is decisive, which nobody accepts, or we have to deny that these comparative judgements
  chain, which is to deny transitivity somewhere.


