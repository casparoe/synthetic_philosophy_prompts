  degradation, it has a negative real number attached, and no smallest negative real
  exists, so the ''too small to register'' move is a fact about human discrimination,
  not about the better-than relation. The sorites-style spectrum exploits the mismatch
  between a coarse perceptual grid and a fine-grained value scale, just as a spectrum
  of colour patches can make a scarlet patch ''the same colour'' as an orange one
  without ''same colour as'' failing to be transitive at the level of reflectance.


