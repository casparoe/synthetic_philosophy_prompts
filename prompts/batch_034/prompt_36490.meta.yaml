  In case you don''t have it at hand: the driver is heading home along a route with
  two identical intersections. At each intersection they can exit or continue. Exit
  at the first intersection and the trip is worth 1 (long way home). Continue past
  the first, exit at the second: worth 4 (best). Continue past both: 0 (highway forever).
  The catch is the driver is absent-minded: at an intersection they have no idea whether
  it''s the first or the second one. If they commit in advance to a policy of continuing
  with probability p at whichever intersection they find themself at, the math says
  p = 3/8 is best, expected value 25/16 — better than the 1 they lock in by always
  exiting. But from *inside* the information set things fall apart: sitting at an
  intersection, "exit" guarantees 1; "continue" looks terrible once you notice that
  whatever you do here, past-you did too — if I''m the kind of driver who continues,
  I continued at the first one already, so continuing now means the highway and 0.
  So the policy it''s best to commit to is not the action it''s best to take when
  you get there, and no belief about where you are seems to make 3/8 both sensible
  to plan and sensible to execute. That clash is the thing I want them to feel.


