reasoning_summary: 'Pick a domain and type. The unilateralist''s curse + procedure
  type could work well: someone at an org (e.g., a biosecurity NGO or an AI lab) who
  needs a procedure for deciding whether to publish something when one person thinks
  it''s fine and others don''t. Or a dialogue type: e.g., Langdon Winner (artifacts
  have politics) vs a determinism critic.


  The unilateralist''s curse + "turn principle into procedure" seems great. The unilateralist''s
  curse (Bostrom, Douglas, Sandberg): when a group of equally qualified people each
  decide whether to take an action, if each acts on their own judgment, the action
  is more likely to happen than it should be — the most optimistic person unilaterally
  acts. Procedure: how should an organisation decide on unilateral publication of
  research with dual-use risk? E.g., an editor at a journal or a research org''s info-review
  board deciding on pre-publication review.


  Write casually, British English, with a typo or two. Include format request: fixed
  machine-readable answer at end — for a procedure, maybe not a natural fit; but could
  ask for e.g. a final line with a verdict on a case, or "the last line should be
  \verdict{...}" for a worked case. The instructions say: if no definite answer, ask
  for one-sentence summary as the last line. A procedure prompt could ask for a final
  line summarising where judgment can''t be eliminated... Or run the procedure on
  cases and give a final label for each. Let''s have them run it on two/three cases
  and end with machine-readable verdicts for each, e.g. \verdict{publish}, \verdict{withhold},
  etc.


  Keep prompt relatively short but needs to be a few sentences, fix role, frequency,
  stakes, constraints.


  Draft:


  "I run publication review at a small non-profit research institute... we get maybe
  15 papers a year where someone flags dual-use concerns... reviewers disagree wildly.
  Someone told me about the ''unilateralist''s curse'' — that when several people
  each get to veto or publish, the decision defaults to whoever is most optimistic.
  I want a decision procedure my review board (five people, one hour meetings, no
  veto powers formally assigned) can actually run..."


  Hmm, the unilateralist''s curse is about the bias toward action when any one member
  can act unilaterally. So the procedure should operationalise: defer to the most
  pessimistic qualified person, or use structured aggregation. Worked cases: an AI
  capability result, a synthesis route for a toxin, an infohazard-y ecology finding
  (e.g., locating an endangered species).


  Include the requirement: one case where procedure gives answer asker won''t like,
  mark judgment calls, say what it can''t do. End with machine-readable verdicts.


  Casual tone, typo. British English. Keep it maybe 200 words.


