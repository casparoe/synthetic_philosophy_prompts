  informally, toward a suffering-focused outlook: they care much more about preventing
  intense suffering than about creating happiness or extending life counts, and they''ve
  asked me to help them make this explicit rather than leaving it as a mood. I''d
  like you to turn a broadly negative-utilitarian position — roughly, that relieving
  suffering counts more, morally, than adding happiness or extending painless lives
  — into an actual scoring/decision procedure the group can run on a shortlist of
  eight to twelve candidate charities in a single two-hour meeting, once per quarter.


  Requirements:

  - The procedure should be usable by students with no philosophy: a sequence of questions,
  each with a stopping point, that any member can run.

  - It must encode the key distinctions that matter within suffering-focused ethics:
  intensity vs. duration of suffering; suffering that ends in death vs. suffering
  that persists; preventing suffering that would otherwise occur vs. relieving suffering
  now; counting future beings'' suffering vs. only presently existing ones. Decide
  which of these must survive the simplification and say which you dropped.

  - It must handle the hard cases where suffering-focused ethics gives uncomfortable
  answers, and give at least one worked application where the procedure yields a result
  the group will not like — e.g., ranking palliative care for a few people in agony
