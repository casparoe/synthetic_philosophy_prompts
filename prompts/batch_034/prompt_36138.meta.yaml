  ---


  My younger brother and I keep a running list of traits and argue over which ones
  deserve to be called adaptations. His verdicts so far: the vertebrate eye, adaptation
  (clearly built by selection for seeing); the ability to learn to read, not an adaptation
  (writing is far too recent, so reading must be riding on brain capacities selected
  for other jobs); the red color of blood, not one (a byproduct of a molecule selected
  for carrying oxygen); the belly button, not one (a byproduct of the umbilical cord);
  fever, adaptation (the raised body temperature was selected because it helps fight
  infection); and the four-limbed body plan we share with other vertebrates, not one
  (an inherited blueprint every descendant builds on, not something selected for being
  four-limbed). Last week he announced that the bridge of the human nose is an adaptation
  because it holds up eyeglasses, and I realized I can''t tell whether he is being
  consistent with his own track record. It seems to me his six earlier verdicts could
  be generated by more than one underlying rule — one asking what selection originally
  built the trait for, another asking whether the trait''s present form serves some
  function, maybe a third that refuses to call anything an adaptation if it can be
  explained as a byproduct or an inherited constraint. Could you set out the candidate
  rules that fit his earlier verdicts, say which rules his nose claim would commit
  him to and whether it clashes with anything he has already ruled on, and tell me
  what new case would most cleanly separate the rules? He and I have a suspicion that
  goosebumps would do it, since they raise fur usefully in hairy mammals but seem
  to accomplish nothing in us — is that right? I''d also like you to keep separate
  what is settled biology from what biologists and philosophers still genuinely dispute
  here (I''ve gathered that even the definition of "adaptation" is contested), and
  not to pass off one camp''s terminology as the official one.


