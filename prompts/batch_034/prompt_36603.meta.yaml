  Full prompt:


  ---


  I''ve been reading about the history of animal minds on my own — no formal training,
  just evenings and a couple of popular books — and I keep running into Descartes''
  comparison of animals to machines. As I understand it, he had in mind both the plain
  clock and the cleverer mechanical statues in the royal gardens of his day, which
  moved when a visitor stepped on certain tiles. My brother-in-law is a butcher, and
  when the topic came up over dinner he leaned on exactly this picture: an animal
  is a clockwork statue, clocks don''t suffer, so a squealing pig is just noise from
  the mechanism, and there''s nothing to feel bad about. I found myself unable to
  answer him as well as I wanted, and since then I''ve noticed two things that make
  me unsure the picture does what he thinks.


  First, the two examples aren''t the same. A clock runs one fixed cycle and ignores
  you entirely; a garden statue responds to which tile you step on. If my brother-in-law''s
  argument rests on the clock version, then the moment you point out that animals
  plainly respond differently to different situations — flee, freeze, approach, learn
  — the analogy looks broken. But the garden-statue version seems to survive that,
  since those statues did react to their surroundings, and Descartes apparently knew
  the difference and still treated both as machines. So which version is the argument
  actually using, and does it matter?


  Second, we now believe human bodies are machines too — chemistry and electricity
  rather than springs and water, but machinery all the way down. If "built of mechanical
  parts" was enough to empty the pig of an inner life, it looks like the same argument
  empties me, and my brother-in-law doesn''t accept that conclusion. He says humans
  have a soul or reason that the machine doesn''t, but that seems like putting in
  by hand what the analogy was supposed to show.


  Can you help me get clear? I''d like a straightforward mapping of what in the comparison
  is supposed to correspond to what — the spring to the heart, or whatever it is —
  then where the comparison breaks down, and especially which features of clocks and
  garden statues the picture quietly carries over that animals don''t have (being
  built to a plan by a maker, being meant to display, running the same way when taken
  apart, having no good and bad states of their own). Then tell me whether my brother-in-law''s
  conclusion — nothing suffering, nothing to answer for — survives the breakdown,
  or whether the analogy was carrying it the whole time. And if the picture is salvageable
  in some form, what would the honest modern version be?


  ---


