  I''m a backend engineer with no philosophy training, and for the past few weeks
  a colleague (call her Maya) and I have been trading little scenarios at lunch about
  when someone counts as having done something "on purpose" / "intentionally." I''ve
  kept notes on her calls, and now we have a disagreement about a new one. I''d like
  your read on what rule Maya is actually applying, a prediction for the new scenario,
  and what further scenario would settle our disagreement.


  Her track record (all side effects were foreseen, and in each the agent''s main
  goal was something else):


  1. The classic one, which I gather is from a real paper: a board chairman told a
  new program will increase profits and also harm the environment, replies he doesn''t
  care about the environment, only profits; program proceeds. Maya: he harmed the
  environment intentionally. Same story with "help the environment": not intentional.

  2. A doctor prescribes a drug that will cure the patient and predictably cause a
  week of nausea; prescribing is standard and the patient is warned. Maya: the nausea
  was not intentional.

  3. A new intern is told by the office administrator not to take pens from the receptionist''s
  desk; a faculty member asks him to drop off a pen and he takes one, leaving none
  for visitors, saying there were no pens left. Maya: he intentionally caused the
  problem — even though he was just following instructions. [This is the Knobe & Fraser
  case; I''m reporting from memory. Should I verify? The hard rule is about quotes;
  this is a paraphrase of a scenario, not a quotation. But it "leans on" a specific
  — the guidance says verify titles/attributions if the prompt leans on them. I''m
  paraphrasing the case without quotation marks and without citing a specific paper
  title. Hmm, I attribute "the classic one, which I gather is from a real paper" —
  vague enough. The pen case: I could present it as just another scenario without
  attribution. That''s safer. Actually the pen case details: Knobe & Fraser 2008,
  the chair of the philosophy department tells... The setup: office administrator
  sends email saying administrative assistants need pens; faculty members may take
  pens but must return them; one professor keeps taking pens; intern. I recall: "the
  intern" — a faculty member asks the intern to take a pen back... Actually the case:
  professors were asked to return pens; one professor asked the intern to drop off
  a pen to him; the intern takes it, receptionist can''t take messages. I''ll paraphrase
  loosely as a scenario without attribution — but risk of getting details "wrong"
  relative to the real case. Better: don''t attribute it to any real study; just present
  it as a scenario we made up. That avoids the verification burden entirely. Or make
  it software-flavored analog: an intern is told never to merge directly to main;
  a senior dev asks him to hotfix... I''ll construct software-flavored versions to
  keep everything invented and in-the-weeds.]


  Let me make all vignettes software/workplace-flavored, invented. That avoids needing
  to verify real cases and satisfies "inject new/niche ideas."


  Revised vignettes:


  1. Exec/program-environment cases: keep classic but software flavored: "A CTO approves
  a data-center buildout that increases revenue and, as a side effect, increases the
  company''s carbon footprint; he says he doesn''t care about the carbon footprint,
  only revenue." Maya: intentional. Mirror version with "reduces the carbon footprint":
  not intentional.

  2. Doctor-nausea analog: "A teammate ships a long-planned API migration that, as
  a known side effect, breaks a couple of ancient internal scripts no one has touched
  in years; the migration was approved months ago, the breakage was flagged in the
  design doc, and everyone signed off." Did the engineer intentionally break the scripts?
  Maya: no. [Norm-permitted harm → not intentional.]

  3. Intern/norm analog: "We have a rule that only the on-call engineer may deploy
  to production. A junior dev, told by his team lead to ''just get the demo working
  before the board meeting,'' pushes straight to prod, and as a side effect the metrics
  pipeline reports garbage for an hour. He didn''t care about the pipeline, just the
  demo." Maya: intentional — even though he was following the lead''s instruction.
  [Norm violated, harm, following orders → intentional.]

  4. Maybe a "good side effect, agent indifferent" case beyond the mirror: "same CTO
  story but the side effect is good: reduces footprint" — already in 1''s mirror.
  Could add: a case where the agent dislikes the good side effect? E.g., "An engineer''s
  refactor speeds up the tests, which she is indifferent to and even mildly dislikes
  because it makes her earlier optimization look pointless. Did she intentionally
  speed up the tests?" Maya: no. This tests desire-based rules: she desired the opposite,
  still not intentional — rules out desire-based accounts. Nice addition. Actually
  the classic literature has cases where agents dislike the side effect — Cushman''s?
  There''s the case where the CEO hates the environment... In the help case, some
  variants: chairman hates environment... The "helps environment, chairman annoyed"
  variant — people still say not intentional, which confounds simple desire views.
  Good, this adds constraint: rules based on desire/contra-desire don''t fit.

  5. Maybe a case with blame but no norm violation or vice versa to constrain further?
  We want at least two rules to fit. Current verdicts: (1) harm+profit → intentional;
  (1b) good → not; (2) norm-permitted harm → not; (3) norm-violated harm → intentional;
  (4) disliked good side effect → not.


  Fitting rules: norm-violation rule fits (norm violated → intentional: 1? Is there
  a violated norm in the carbon case? Yes: norm against knowingly harming the environment
  for profit; 2 conforms → not; 3 violates → intentional; 4 no violation → not). Blame/wrongdoing
  rule fits (1 blameworthy → intentional; 2 not → not; 3 blameworthy-ish → intentional;
  4 not → not). Reason-forbearance (Cushman): 1: should have forborn → intentional;
  2: justified → not; 3: could easily have complied → intentional; 4: no reason to
  forbear a good effect → not. Desire rules: ruled out by (4) — she disliked it, still
  not intentional; and by (1) indifferent, intentional. Also "control" rules ruled
  out trivially (all foreseen).


  New case: "Our company has a long-standing, openly accepted practice (it''s in the
  handbook, everyone including me accepts it): engineers on the on-call rotation may
  restart a flaky service during business hours, and everyone knows restarts drop
  a few seconds of customer requests; no one considers this a violation of anything;
  it''s just how we operate, and the alternative — waiting for a maintenance window
  — would mean degraded service for hours. Last Tuesday my teammate restarted the
  service to clear a memory leak, and, as foreseen, ~200 customer requests were dropped.
  Did she intentionally drop the customer requests?" — bad side effect, norm-permitted,
  justified, not blameworthy. So blame rule → not intentional; norm rule → not intentional;
  forbearance → not intentional. No divergence! Bad case.


  I need divergence. Flip: bad side effect, no norm violation, but agent profits (so
  blame-rule says intentional, norm rule says not): "An engineer ships a feature that,
  as a fully disclosed, industry-standard, policy-compliant side effect, degrades
  battery life on older devices and increases ad revenue. The company''s own policies
  explicitly bless this trade-off, there''s no rule against it anywhere, but Maya
  thinks profiting from making people''s phones worse is slimy." Blame-rule → intentional
  (she''d blame). Norm rule → not intentional (conforms to norms). Cushman-forbearance:
  is there sufficient reason to forbear? If the standard is accepted and forbearance
  cost high → not intentional; or she may say the engineer should have forborn → intentional.
  Divergence: blame says intentional, norm says not.


  Alternatively: norm violated but justified/not blameworthy: "During a genuine production
  emergency (active data-loss incident), the on-call engineer bypasses the mandatory
  approval step to stop the bleeding; the bypass itself has a known side effect: some
  in-flight messages get duplicated to customers. She violated the approval rule,
  but everyone, including the rule''s author, agrees she did the right thing." Norm-rule:
  violated → intentional. Blame-rule: not blameworthy → not intentional. This one
  is cleaner divergence between the two leading candidate rules. And Cushman sides
  with blame (justified → not).


  Hmm, but is "violating a norm during an emergency" really norm-violation in the
  relevant sense? There''s arguably an implicit exception. That ambiguity is fine
  — it''s exactly what makes prediction interesting and lets the model discuss.


  Which new case to feature? The emergency case is juicy: the norm violated is procedural,
  the side effect bad, action justified. Predictions: norm-rule → intentional; blame
  & justification rules → not intentional. I''ll go with that, phrased carefully:
  the team treats the approval step as absolutely binding in normal circumstances
  ("nobody skips it, ever"), and she skips it only because of the emergency.


  Also can add second sub-question: "A second new one we''re stuck on: engineer ships
  battery-degrading feature per standard disclosed practice, for ad revenue" — maybe
  include two new cases? The type guidance says specify the new case; one is fine,
  and ask the model to propose the discriminating further case. Actually the prompt
  asks: predict verdict, identify the rule(s) fitting her track record, note which
  rules diverge on the new case, and propose which further scenario would best tell
  the rules apart. I could include both new cases — richer. Let''s include both, with
  the battery one too. That gives the model two predictions. Fine.


  Also mention I (asker) think X, Maya leans Y — disagreement framing: "Maya says
  yes; I say no; we want your read." The asker is software engineer, no formal philosophy
  background — so describe rules in plain terms: "punishing rule: if she''d blame
  them, she says intentional" etc.


  Formal/polished: proper paragraphs, enumerations, no slang beyond light engineering
  flavor.


  One more check: does the prompt avoid requiring web/citations? Yes. Avoid super-niche:
  the classic chairman case is extremely well-known (good for LLM recall). I won''t
  name "Knobe effect" — hmm, should I? A model that knows it can name it in the answer;
  the asker, having no philosophy background, wouldn''t. But maybe the asker could
  have heard the term... The examples show askers who know terms like "repugnant conclusion."
  But our persona is no philosophy background. I''ll leave it unnamed — the model
  gets to recognize it, which is part of the fun and tests knowledge. Actually, mentioning
  that "I later found out scenario 1 is from some famous study" could help small models
  anchor... but no citation allowed anyway. I''ll say "a colleague who did a philosophy
  minor says the first pair is close to a well-known published pair of cases, but
  the rest we made up." That''s a nice hint without citation.


  Also incorporate the "desired output" per type: prediction with reasons, candidate
  rules, best guess, further discriminating case.


  Length: substantial, formal. Let me write it.


