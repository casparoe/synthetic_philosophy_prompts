  Let''s construct: a database migration that will displace some legacy reports; the
  migration is normatively fine...


  Simpler: use known literature cases but not too obscure. Knobe & Fraser pencil case
  is well known: office administrator tells faculty members not to take the last pens...
  intern takes pens, says no pens left. Verdict: intentionally caused the problem.
  This is a norm-violation without deep moral harm. That''s known but fine — the asker
  reports verdicts; the model just needs to reason.


  Also include: a case where the side effect is harmful but the agent follows a norm
  and violates no norm — e.g., a doctor prescribing a drug with an unavoidable bad
  side effect (medicine norm permits) — verdict: not intentional. That fits norm theory;
  moral theory would predict...? Moral theory (simple blame → intentionality) might
