  Candidate rules in literature:

  A. Moral valence: bad side effect → intentional; good/not bad → not intentional.
  (Knobe''s simple hypothesis)

  B. Norm violation: side effect that violates a salient norm → intentional; conforms
  to norm → not.

  C. Explanation-based/Cushman''s: judgments track whether the agent would need to
  justify/explain, or whether the side effect provides a reason not to act — Cushman''s
  "reasonable forbearance": we count side effects as intentional when the agent had
  sufficient reason to forbear and did not. Machery''s "trade-off hypothesis": agents
  who accept harmful side effects for profit are judged to trade off others'' welfare.

  D. Personality/desire-based: agent desired the outcome → intentional (but classic
  cases have indifferent agents).


  The asker doesn''t need to name these; asks the model to extract the rules. Good.


  Design verdict list (software-flavored where natural, classic ones referenced):


  1. Classic CEO harm → intentional; CEO help → not intentional.

  2. Her verdict on the "nurse/doctor side effect" case: a medication that predictably
