reasoning_summary: 'Let me pick a domain and type. The Knobe effect and experimental
  philosophy pairs well with the "predict a verdict on a new case" type — the asker
  reports someone''s verdicts on Knobe-style vignettes and asks about a new vignette.
  That''s nice and in-the-weeds without requiring memorized nicheness.


  Software engineer, no formal philosophy background, formal/polished tone. The Knobe
  effect: harm vs help asymmetry in intentional action attribution. Ask a friend''s
  verdicts across vignettes (chairman harming/helping environment, etc.) and ask about
  a new case, plus which further case distinguishes candidate rules.


  Candidate rules that fit Knobe data: (a) moral valence of side-effect determines
  intentionality judgments (Knobe''s own hypothesis), (b) foreseen vs unintended side-effect
  plus blame-worthiness (c) norm violation view — the side effect violates a norm,
  so attributed intentionality (the "norm theory" of Knobe & Fraser / Uttich). Actually
  the main competitors in the literature: Knobe''s original moral judgment account,
  the norm-violation account (agent acting against an applicable norm), and the "rationality/explanation"
  accounts (Agent, Cushman). Design new cases to distinguish: a norm violation that
  is not moral (etiquette violation) — should still elicit intentionality on norm
  account but maybe not on moral account; a morally bad side-effect of a morally good
  overall act; a case where the side effect is good but violates a norm (e.g., helping
  the environment by violating a professional norm).


  Let me design the earlier verdicts so multiple rules fit:


  Friend''s verdicts:

  1. Classic chairman-harm (program will harm environment): says the CEO brought it
  about intentionally.

  2. Chairman-help (help environment): not intentional.

  3. CEO harms environment but the board would... some variant where the agent is
  a low-level employee just following orders and the harm side effect still occurs
  — Knobe & Fraser''s "front door" case: professor asks janitor? Actually there''s
  a case about a pencil... The Knobe & Fraser pencil case: office worker takes pens;
  intern violates norm. Verdict: intentional.

  4. A case where the side effect is harmful but violates no norm agent is aware of?
  Hmm.


  New case: something where rules diverge. E.g., a driver saves a pedestrian but...
  Let''s think: moral-badness rule vs. norm-violation rule diverge on: side effect
  that violates a convention/etiquette norm but isn''t morally bad (e.g., a software
  engineer''s commit breaks team style guidelines — trivial norm). Norm theory predicts
  intentionality if norm strongly held; moral theory predicts no. Or: side effect
  that is morally bad but norm-permitted (a harmful side effect that everyone in the
  industry accepts as standard, no norm against it). Norm theory predicts "not intentional"
  (or weaker), moral theory predicts intentional.


  Deliverable: predict friend''s verdict on the new case, identify candidate rules,
  further case to discriminate.


  Setting: the asker is a software engineer, no formal philosophy background, formal/polished.
  So the vignettes can involve software contexts (a technical lead shipping a feature
  that degrades privacy, etc.) — that''s a nice way to inject novel vignettes so models
  can''t regurgitate.


  Structure the prompt:

  - Context: at work we''ve been running informal polls on teammate/colleague or friend''s
  verdicts on intentionality vignettes; or "my college roommate" — let''s say a friend,
  we discuss over lunch.

  - Report verdicts on 5-6 vignettes (the classic two plus variants constructed so
  two-plus rules fit).

  - Present new case (software engineering flavored).

  - Ask: predict her verdict, identify rules, which fit, which further case would
  discriminate.


