  I''m a software engineer with no background in philosophy, so please pitch your
  answer at an intelligent layperson rather than assuming I know the literature.


  For the last month or so, a colleague of mine — I''ll call her Maya — and I have
  been trading short scenario cards at lunch and recording each other''s judgments
  about whether someone did a foreseen side effect "intentionally" or "on purpose."
  A friend who minored in philosophy tells us our first pair is close to a well-known
  published pair of cases, but everything else we invented ourselves, modeled on things
  that happen at work. I now have Maya''s track record written down, and we''ve hit
  two new cards we disagree on. I''d like three things from you: (1) a prediction
  of Maya''s verdict on each new card, with your reasoning; (2) an articulation of
  the rule or rules that best explain her past verdicts — in particular if more than
  one rule fits her track record equally well, I want to hear the competing rules
  plainly stated; and (3) a description of a further card we could add that would
  most cleanly tell those rules apart.


  Here is her track record. In every case, the agent foresees the side effect, pursues
  the main goal for its own sake, and is indifferent to the side effect unless stated
  otherwise.


  Card 1: A CTO approves a data-center expansion that will raise revenue and, as a
  side effect, increase the company''s carbon emissions. Told about the emissions,
  he says he doesn''t care about that, only revenue; the expansion goes ahead. Maya''s
  verdict: he harmed the environment intentionally. Card 1 (mirrored): identical,
  except the side effect is a decrease in emissions. Maya''s verdict: he did not help
  the environment intentionally.


  Card 2: A teammate ships a long-planned API migration that, as a known side effect,
  breaks three ancient internal scripts nobody has run in years. The breakage was
  flagged in the design document, the migration was reviewed and approved, and following
  standard practice. Maya''s verdict: she did not break the scripts intentionally.


  Card 3: Our team has a rule that only the on-call engineer may deploy to production,
  and it is treated as binding. A junior developer, told by his lead to "just get
  the demo working before the board meeting," pushes straight to production; as a
  side effect, the metrics pipeline reports garbage for an hour. He doesn''t care
