  it norm-but-not-moral: etiquette. Maybe: an engineer knowingly leaves code in a
  style that violates the team''s agreed conventions, purely as a side effect of a
  refactor — she says the mess was brought about intentionally. This diverges: simple
  moral-badness says no (not bad, just untidy), norm theory says yes.

  4. A case where side effect is good but norm-violating? That would be the discriminator
  later, maybe.


  Also add a case where the agent is a subordinate forced to do it (low personal norm)
  — e.g., intern ordered to take pens (Knobe & Fraser): verdict still intentional
  when norm violated, though intern just follows order. That supports norm theory
