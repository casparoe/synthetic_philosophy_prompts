  individual rights clash with collective decision-making. Sen''s paradox: assigning
  rights to individuals can make the social preference cyclic/Condorcet-type; no social
  decision function satisfies minimal liberalism and Pareto. A concrete disagreement:
  roommates deciding on wall paint vs thermostat, or a housing co-op vote about smoking
  in own room vs. communal painting.


  Good scenario: co-op housing. House votes on communal matters by majority. Two members,
  Alice and Bob. Bob painted his own room a loud color; Alice says it''s his room,
  his business. Then house voted on whether to make Bob''s room available for guests
  during a party... hmm. Better: classic Sen example is a couple deciding whether
  to read Lady Chatterley''s Lover — prude wants neither to read it, etc. Make it
  modern: a household votes on rules.


  Scenario: I live in a small co-op (5 people). Disagreement between two housemates
  over a house rule: Sam thinks anything inside your own room is your own business
  — the house shouldn''t vote on it. Priya (other names to avoid example names) thinks
  everything that affects anyone in the house can legitimately come to a vote, and
  if the house votes, that''s that. Concrete case: housemate keeps his room messy,
  visible smell / attracts mice affects others. Or: one housemate wants to smoke in
  his room; another is pregnant / has asthma; house voted to ban smoking in rooms;
  smoker says my room, my body; etc. And Priya invokes Pareto: nobody in the house
  wants smoke smell, so ban is clearly right. Sam: even if everyone prefers the ban,
  taking a vote over what I do in my room is wrong; individual spheres aren''t up
  for collective preference.


  Then rounds: Sam analogizes to Sen-style: "by your rule, if the house took a vote
  on whether you''re allowed to be vegetarian, that would be legitimate too." Priya:
  "yes if it genuinely affected others, and honestly most things do — food smells,
  noise — so where''s your line?" Sam: "if everything affects everyone, ''personal
