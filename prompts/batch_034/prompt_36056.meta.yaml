  Let me design: an argument that seems to show dispositions never entail any counterfactuals
  at all:


  1. A glass is fragile iff, were it struck, it would break.

  2. Finks: a protector could remove fragility before the strike, so a fragile glass
  might not break if struck — hence (1) fails.

  3. Masks: packing foam prevents breakage without removing fragility — so also (1)
  fails.

  4. Since for any disposition, some fink or mask is always possible in principle,
  no disposition ever entails its manifestation counterfactual.

  5. But then dispositions have no connection to their manifestations at all, which
  is absurd — fragility would have nothing to do with breaking.

  6. So the conditional analysis is wrong, and dispositions must be categorical intrinsic
  properties.


  The subtle flaw: step 4 moves from "the counterfactual can be defeated" to "the
  counterfactual is absent" — quantifier/modal slide. Or the slide between "some fink
  is possible" and "the fink condition holds in the closest world." The proper response:
  the conditional analysis needs to hold fixed the intrinsic basis / absence of interferers,
  or use ceteris paribus conditionals.


  Alternatively, the "proves too much" form: argument proving conditional analysis
  fails because masks exist, and then someone extends to show e.g. "nothing is ever
  fragile" — conclusion absurd.


