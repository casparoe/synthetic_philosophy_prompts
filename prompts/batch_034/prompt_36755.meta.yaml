  Prompt:


  I''ve been working through social choice theory on my own, and I''ve constructed
  an argument which, if it worked, would show that open problems in mathematics should
  be settled by global referendum. I don''t believe the conclusion, but every premise
  still looks fine to me. Please tell me which step to reject, or which inference
  is invalid, and what rejecting it costs — because, as you''ll see, the costs I can
  see are ones I''m reluctant to pay.


  Background: Condorcet''s jury theorem says that if a large number of voters each
  vote sincerely on a binary question, each is more likely to vote correctly than
  incorrectly (competence, p > 0.5), and their votes are independent, then the probability
  that the majority is correct approaches certainty as the electorate grows — and
  approaches it quickly, so that even voters who are barely better than random (p
  = 0.501) suffice, given a large enough electorate. The theorem demands no understanding,
  no deliberation, and no expertise, only competence and independence.


  The argument:


  (1) By the jury theorem, for any binary question whatever, there is a finite electorate
  size N such that a majority vote among N sincere, independent, individually-better-than-random
  voters answers that question with probability as close to 1 as we like.


  (2) Competence is nothing but a correlation with the truth, and a voter can have
  it without understanding the question. Someone who always votes for whichever side
  the mainstream experts endorse is, across the run of questions where mainstream
  experts have views, right more often than not; so is someone who always votes for
  the simpler-sounding theory. Each is a tiny-but-positive correlation, which is all
  the theorem needs.


  (3) So for almost any binary question, we can assemble a vast electorate — every
  adult on Earth, say — each member of which is at least slightly better than random
  on it, since nearly everyone commands some heuristic with a slightly positive track
  record.


  (4) Independence is a feature of procedure, not of statistics: voters who decide
  alone, behind a secret ballot, with no campaigning, no deliberation, and no knowledge
  of how the others are voting, are independent in every sense a fair election requires.
  A well-run referendum satisfies this as fully as anything ever has.


  (5) There are some five billion adults, which is far more voters than the theorem
  needs, even at p barely above 0.5, to drive the probability of a wrong majority
  down to one in billions.


  (6) So a global secret referendum, held without campaigning, on the question "Is
  the Riemann hypothesis true?" would return the correct answer with probability indistinguishable
  from 1 — more reliably, presumably, than a committee of Fields medalists deliberating
  for a decade.


  (7) Therefore open questions in mathematics — and, by parity of reasoning, in science
  — should be settled by plebiscite rather than by expert deliberation; the plebiscite
  is the better instrument, and the deliberation is at best theater.


  I can''t accept (7). But here is what makes each escape route uncomfortable.


  The obvious move is to deny independence: five billion people share newspapers,
  heuristics, deference to the same experts, so their votes are not independent. But
  (a) that concedes that (4) construed procedurally was never enough, and I''d want
  to know exactly what would be enough — what statistical condition, satisfied by
  whom, in which actual elections; and (b) if shared sources and shared heuristics
  break independence, then no real electorate in history has ever satisfied the jury
  theorem either, which seems to demolish its standard use as an argument for the
  epistemic superiority of democratic decision-making over expert rule. I would rather
  not pay that; I believe the theorem does say something real about why democracies
  outperform dictatorships on the questions they face. If your repair costs me that,
  say so plainly — but then explain what, if anything, is left of the theorem''s democratic
  moral.


  The other escape routes look worse. Denying (1) means denying the theorem, which
  is a mathematical result. Denying (2) or (3) by insisting that competence requires
  understanding seems to buy competence at the price of the theorem''s whole interest:
  the theorem was supposed to show how the many, individually mediocre, can collectively
  rival the few experts — if it only applies to voters who understand the question,
  it isn''t showing that. And note that the argument is symmetric: a population slightly
  worse than random would be exactly as informative, provided we negate its verdict,
  so any repair had better not make superstitious majorities look like epistemic gold
  mines.


  So: which step or inference do you reject, what precisely is wrong with it, and
  what does rejecting it cost? And what, if anything, survives of the idea that the
  jury theorem explains the epistemic value of democracy?


  End your reply with a machine-readable verdict on a single final line, of the form
  \answer{...}, containing the step number or inference you reject (e.g., \answer{step
  4: procedural independence} or \answer{inference 3 to 4}) followed by a two- or
  three-word label for the flaw — and nothing else after it.


