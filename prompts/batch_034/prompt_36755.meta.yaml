  I''ve been teaching myself social choice theory and I''ve ended up with an argument
  that, if it worked, would tell us to settle open problems in mathematics by global
  referendum. I assume something is wrong with it, but every premise still looks fine
  to me, and I''d like to know exactly which step to give up and what giving it up
  costs.


  The setup is Condorcet''s jury theorem: if each member of a large electorate votes
  sincerely on a binary question, each voter is more likely to vote for the correct
  answer than the incorrect one (competence, p > 0.5), and the votes are independent,
  then the probability that the majority is correct tends to 1 as the electorate grows;
  and it does so fast, so that even barely-competent voters (p = 0.501) suffice, given
  a large enough electorate. The theorem makes no demands on understanding, deliberation,
  or expertise — only competence and independence.


  My argument:


  (1) By the jury theorem, for any binary question whatever, there is a finite electorate
  size N such that a majority vote among N sincere, independent, individually-better-than-random
  voters settles that question with probability as close to 1 as we like.


  (2) Competence, not understanding, is what the theorem requires, and competence
  is just a correlation with the truth. A voter can be competent on a question without
  knowing anything about its subject matter — e.g., by following a heuristic ("believe
  the side endorsed by the mainstream experts," or "prefer the simpler theory") that
  is right slightly more often than not across questions.


