  (4) Independence is a matter of process, not statistics: voters who decide in private,
  without communicating, without observing each other''s votes, are independent. In
  a well-run referendum — secret ballot, no deliberation, no campaigning — this condition
  is satisfied as well as it ever could be.


  (5) There are about five billion adults on Earth, which is astronomically more voters
  than the jury theorem needs to drive the error probability to negligible size, even
  for p barely above 0.5.


  (6) So a global, secret, no-campaigning referendum on, say, "Is the Riemann hypothesis
  true?" would deliver the correct answer with probability indistinguishable from
  1, and would do so more reliably than any committee of Fields medalists.


  (7) Therefore we should settle open mathematical (and scientific) questions by plebiscite
  rather than by expert deliberation — or at least, the plebiscite is better evidence
