  Check quality: is the argument genuinely hard? Steps: (2) equivocates between track
  record "across the run of questions where experts have views" and competence on
  a specific open question — there is no expert consensus on Riemann (or rather, there
  is a consensus conjecture, but no known answer; deference to "what most number theorists
  conjecture" might actually be p>0.5 on RH specifically... hmm — actually most number
  theorists believe RH is true, and it probably is, so deference might work for that
  question! Let me pick a question where deference can''t help or note this. The deeper
  point: on an open question, the heuristic''s track record class doesn''t include
  verified instances. But a subtle answerer might say the plebiscite would actually
  get RH right because everyone defers to number theorists'' consensus — and majority
  would just reflect the consensus, at accuracy equal to the consensus''s accuracy,
  not → 1. That itself illustrates the conditional-independence point: with pure deference,
  the plebiscite is exactly as accurate as the experts it defers to, no better — the
  billion votes collapse into one signal. Good.)


  (4) is the biggest flaw: procedural independence ≠ statistical independence; shared
  common causes mean votes are correlated conditional on the truth, and the theorem''s
  conclusion degrades to the accuracy of the common component. But I''ve made the
  asker aware of the "not independent" reply and demanded precision plus cost accounting.
  The genuinely hard part: the answerer must articulate conditional-on-truth independence
  vs. pairwise/marginal, explain why no real electorate satisfies it fully and yet
  the theorem still has content (e.g., partial independence gives partial amplification;
  real electorates have heterogeneous private signals mixed with common ones; or the
  theorem applies to juries/forecast aggregation with decorrelated errors), and handle
  the reference-class equivocation in (2)-(3).


  Also (3) says "nearly everyone commands some heuristic with a slightly positive
  track record" — for the Riemann question, "prefer the simpler theory" — track record
  on settled math questions doesn''t transfer to open ones (selection effect: settled
  questions are those where heuristics got confirmed? etc.). Good.


  Is the symmetry remark right? "a population slightly worse than random would be
  exactly as informative, provided we negate its verdict" — yes, standard point. And
  "any repair had better not make superstitious majorities look like epistemic gold
  mines" — nice constraint.


  One more check on hard rule: no quoted passages — I have none in quotation marks
  except... "Is the Riemann hypothesis true?" in quotes — that''s not from a real
  text, it''s a hypothetical question, fine. Field medals — fine. Condorcet jury theorem
  facts — standard, confident. "Some five billion adults" — fine. No verification
