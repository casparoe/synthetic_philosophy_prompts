  even while I was failing to pick up objects off my desk. I have since recovered,
  but the episode has convinced me that the standard exam questions I used, which
  ask students to state the illusionist''s thesis and one objection, sort memorisers
  from memorisers. I want to replace them.


  Please write one essay question, answerable in ninety minutes, on illusionism about
  phenomenal consciousness, together with a model answer of about 600 words and a
  marking scheme out of 20 marks. The question should be built around the following
  crux rather than around exposition: empirical cases of introspective error — my
  filled-in scotoma, change blindness, the blind spot — show that introspection can
  be wrong about the contents of experience, but the illusionist claims something
  stronger, that introspection is wrong about the category of phenomenal properties
  altogether. The question must force students to say whether the weaker, well-documented
  fallibilism supports the stronger, category-level thesis, and what an illusionist
  could offer as the content of the illusion: an experience that seems to have irreducibly
  phenomenal properties while having none is either a further datum the illusionist
  owes us an account of, or the thesis quietly collapses into reductive realism. Students
  should have to locate, somewhere in their answer, the exact point at which the illusionist''s
