  The asker: teaches decision theory seminar, ~15 students, 90 minutes, wants students
  to feel the pull between updateless/functional decision theory and CDT by actually
  playing a counterfactual mugging with real (small) stakes, plus a second round where
  precommitment is offered publicly. Inject a novel element: a two-stage version where
  half the class acts as "the predictor" who must simulate their peers, or a version
  where the mugging happens with the coin flip known only to the mugger. Also ask
  about what the activity can''t reproduce (the hypothetical version of yourself in
