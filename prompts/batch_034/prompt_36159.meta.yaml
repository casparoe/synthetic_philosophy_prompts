  the classic thought experiment the other branch never actually exists). Actually
  a nice twist: run it so that BOTH branches are played in the room — pair students,
  one plays "heads-you" and one plays "tails-you" — so the counterfactual becomes
  actual, and see whether that changes their answers and what it teaches about the
  difference between the thought experiment and any playable version. That''s a nice
  "what can''t the activity reproduce" hook.


