  during a supply failure, we have one course of a scarce therapy that can be given
  whole or divided. If given whole to Patient A, A survives; if divided among Patients
  B–F, each of the five survives. Clinically the six are indistinguishable: same prognosis
  with treatment, same life expectancy, none has priority under our standard criteria
  (age, prognosis, instrumental value). The only distinguishing fact is the number.


  Backstory: I spent last weekend arguing with my closest friend — a mathematician
  / lawyer — who took the Taurek position. He said he''d flip a coin: each of the
  six has an equal claim to the drug, and there is no one for whom "five deaths" is
  worse than one death — no person suffers the aggregate. He challenged me to say
  what I''d tell Patient A: that his claim is weaker because strangers he''s never
  met also happen to be sick? I pressed the point that five deaths is worse than one
  and we can prevent the worse outcome; he answered that comparisons of better and
  worse must be for someone, and that aggregating across persons treats them as vessels
  of welfare rather than separate people with separate claims. He also rejected a
  weighted lottery as an unstable compromise — five-to-one odds against the single
  patient is just maximizing with a show of chance, he said. We got nowhere, and I
  suspect the committee will split the same way, because two of our members have already
  said informally that anything but a coin toss treats the lone patient as if his
  claim counted for less.


