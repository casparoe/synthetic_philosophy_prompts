  Let me think about supererogation: acts that are good but not required — saints
  and heroes. A commitment set could include: (1) act utilitarianism is true; (2)
  the concept of supererogation is coherent — some acts are good to do but not wrong
  to omit; (3) if an act is optimific, it can''t be wrong to do it ("ought implies
  can"... no, the relevant one: if it''s wrong not to do the best, then supererogation
  is impossible); (4) the demandingness objection to consequentialism fails / demandingness
  objections are confused; (5) the satisficing vs maximizing distinction.


  Classic tension: maximizing consequentialism seems to leave no room for supererogation
  — if producing the most good is always what you ought to do, then doing anything
  less is wrong, and there''s no room for "above and beyond the call of duty." So
  someone who holds both maximizing consequentialism and the coherence of supererogation
  has a real tension. But there are subtle moves: satisficing consequentialism, scalar
  consequentialism (no deontic categories at all), "ought" as most-preferred-but-not-required.


  Also apparent tension that dissolves: believing both that supererogatory acts exist
  and that "ought implies can" — no. Or: believing there are imperfect duties (Kantian)
  and that supererogation is coherent — historically some think imperfect duties fill
  the role; the tension between "imperfect duties allow latitude" and "supererogation
  exists" — actually many think Kant''s imperfect duties of beneficence leave no room
  for supererogation because whenever you''re not doing something more pressing, beneficence
  demands action. That''s a real dialectic.


  Another commitment: "there''s no morally significant difference between killing
  and letting die" combined with supererogation — if letting die is morally on par
  with killing, then not rescuing distant strangers at cost to yourself would be like
  failing to rescue... Rachels/Singer: if it''s wrong to kill, and letting die is
  no better, then failing to save (cheaply) is wrong, so easy rescue is obligatory,
  and only costly rescues are supererogatory — the line between duty and supererogation
  has to track cost, not the act/omission distinction. That''s a nice tension.


  Personal relevance: "I''ve recently started donating a substantial fraction of my
  income and it''s made the question urgent" or "I''m on a hospital ethics committee"
  or "I''ve been nominated for an award for a rescue and people keep calling my act
  ''beyond the call of duty'' and I''m not sure I accept the compliment." The last
  one is nice: personally relevant — the asker jumped into a river / donated a kidney
  to a stranger, and everyone says it was supererogatory, and they''re unsure whether
  they believe supererogation is even coherent given their other views.


  Commitment set:

  (a) Consequentialist about the rightness of acts in a maximizing sense: an act is
  right iff it produces at least as much good as any available alternative.

  (b) The concept of supererogation is coherent and instantiated: there are acts that
  are good to do and praiseworthy, but not wrong to omit.

  (c) Moral judgments are fundamentally comparative/scalar — "right" and "wrong" are
  crude tools, and the real moral facts come in degrees of better and worse (Dreier''s
  "simple scrimpers" — actually that''s for consequentialism''s demandingness). Hmm,
  (a) and (c) are in tension with each other too — scalar consequentialism drops the
  deontic notions that (b) uses.

  (d) The demandingness objection to consequentialism is confused: a moral theory
  can tell you you''re doing wrong whenever you buy fancy coffee instead of giving,
  and there''s nothing incoherent about that verdict; it''s not an objection to the
  theory.

  (e) Praise and blame are fitting attitudes: it is fitting to praise the kidney donor
  beyond what one praises mere duty-fulfillment, and fittingness of praise doesn''t
  collapse into rightness.


  Tension: (a) + (d) imply that omitting the best act is wrong, so no act is "good
  but not required" — supererogation collapses. Unless... (c) scalar consequentialism:
  if there''s no "wrong," there''s no "required," so maybe supererogation survives
  in a reinterpreted form? Actually if all acts are just better or worse, then neither
  duty nor supererogation exists. So (c) is a way out for some but undermines (b)''s
  deontic reading. Cheap fixes: adopt satisficing consequentialism (give up maximization
  in (a)); accept that supererogation applies only where the agent is not morally
  required to maximize because of agent-centered prerogatives (Scheffler) — but that
  gives up (d)''s dismissal of demandingness.


  Apparent tension that dissolves: (e) vs (b) — actually fittingness of extra praise
