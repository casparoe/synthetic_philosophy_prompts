  Commitments list:

  1. Act consequentialism in a maximizing form: an act is wrong iff some available
  alternative would have produced more good.

  2. The demandingness objection to consequentialism is confused: a theory''s implying
  that buying espresso is wrong whenever the money could do more good elsewhere is
