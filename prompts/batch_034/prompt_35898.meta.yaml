  Draft:


  "My decision theory reading group has been arguing about updatelessness, and one
  member, D., claims to have an argument showing that if updatelessness is a genuine
  rationality requirement, then no one may ever use a diagnostic test. I think there''s
  a slip somewhere, but I can''t isolate it, and the more I stare at it the more I
  worry the slip is exactly where the interesting part of updatelessness lives.


  D.''s argument, as best I can reconstruct it:


  (1) Updatelessness: when you choose, you should do what the best policy recommends
  — where a policy is chosen by your earlier self, using the credences it had before
  it knew which situation the later self would face — because that''s what lets you
  win the counterfactual mugging. In the mugging, a predictor has already flipped
  a fair coin; if it came up heads, it put $1,000,000 in a box for you iff it predicted
  you''d pay $1,000 on tails; if tails, you''re now being asked to pay. Paying looks
  bad once you see tails — the million is not coming — but the pre-flip self strictly
  prefers the policy pay-if-asked, so updatelessly you pay. We all in the group accept
  this.


  (2) Generalize: rational choice at a node follows the policy selected from the standpoint
  prior to the observation that told you which node you''re at.


  (3) Now the medical case. There''s a condition with prior prevalence of...; a test
  that''s 90% reliable; treating is worth it if you have the condition, wasteful if
  you don''t. Numbers: suppose with prior 40% prevalence, treating at cost of ...
  hmm — set numbers so that prior-expected value of treating is negative, posterior-expected
  value strongly positive. E.g., condition doubles risk of a bad event; treatment
  costs $50,000 and reduces risk... Let me craft numbers:


  Prevalence 1%. Untreated condition: 10% chance of a $2,000,000-equivalent loss;
  treated: 1%. No condition: treatment has a 0.1% chance of $500,000 harm... getting
  complicated. Simpler: expected cost of having the condition untreated is $200,000;
  treatment costs $30,000 and eliminates it; prior prevalence 10% → prior EV of treating
  = 0.1×200,000 − 30,000 = −10,000 (negative). Test is highly reliable; posterior
  after positive ≈ 90%+ → EV of treating = 0.9×200,000 − 30,000 = +150,000. Good,
  clean numbers: condition causes expected loss of $200,000 if untreated; treatment
  costs $30,000; prevalence 10%; test positive raises to 90%. So prior says don''t
  treat; posterior says treat.


  (4) By (2), the rational agent treats using pre-test credences — i.e., doesn''t
  treat — even after a near-certain positive. Or more carefully: D. claims the updateless
  agent evaluates the options available at the node with the pre-observation credences,
  so it doesn''t treat.


  (5) Generalizing over all evidential situations: an agent that must act on pre-observation
  credences can never benefit from any evidence — it must act, in every case, as it
  would have planned to act before learning anything. Such an agent is impossible
  to live with: it ignores weather forecasts, it ignores...


  (6) So either updatelessness is false (and with it the mugging answer), or rational
  agents can''t use evidence. Both disjuncts are unacceptable, so something in the
  argument is wrong, and D. says that if the diagnosis is just ''updatelessness is
  about policies, and policies can depend on observations,'' then D. will ask which
  observations a policy may depend on and which it may not, and whether that distinction
  can be drawn without either (a) collapsing back into ordinary conditionalization
  (in which case why pay in the mugging, since ''I''m in the tails world'' is just
  more evidence?) or (b) ad hocery.


  What I want from you: identify the step that fails, if one does; explain why it
  looked fine; and then take D.''s follow-up seriously — say where the principled
  boundary lies between observations you may condition on and observations you must
  average over, and what the boundary implies for the mugging. If you think the argument
  is valid and something else must go, say which premise is cheapest to give up and
  what it costs. My own tentative view is that the slip is in the move from (1) to
  (2), something about ''which situation you face'' meaning different things in the
  two cases — in the mugging the observation tells me which world I''m in without
  changing what my policy does in the other world, while the test result is doing
