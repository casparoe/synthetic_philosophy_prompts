  At a monthly reading group I host, we worked through the Metamagical Themas chapter
  where Hofstadter introduces superrationality, and two members — call them Dana and
  Marcus — have been arguing about it ever since, mostly by email, with me copied.
  I''d like you to referee their exchange. First the background, then the moves.


  The setups, briefly. In the Platonia dilemma, a trillionaire summons twenty people
  and announces that if exactly one of them sends him a telegram by noon the next
  day, that sender will be paid a billion dollars; if two or more send, or nobody
  sends, nobody gets anything; the twenty can''t communicate. In the Luring Lottery,
  which Scientific American actually ran, readers could enter by mailing a postcard
  bearing the number 1 — one entry per postcard — or could submit as many entries
  as they liked by writing a larger number on a single postcard. The million-dollar
  prize would be divided by the total number of entries received and awarded by random
  drawing among entries. In practice, readers submitted astronomically large numbers,
  and the prize effectively vanished.


  Hofstadter''s superrational line on Platonia is that if all twenty are ideal reasoners
  facing the same problem, they will arrive at the same strategy, so each should ask
  which single strategy is best when all use it — and the answer is to send a telegram
  with probability 1/20, giving the group a real chance at the payoff, whereas the
  textbook analysis ("my sending can only help me and can never hurt, so send") ends
  with twenty telegrams and no payout. For the Lottery, the parallel recommendation
  was to roll a die with one side for each expected entrant and enter only on a 1.


  The dispute, in order:


  (1) Dana endorsed the 1/20 answer as the rational one...


  Hmm wait — do I want Dana to be the superrationalist and Marcus the game theorist?
  Yes.


  (1) Dana: superrationality is the correct analysis of Platonia... the textbook reasoner
  treats their own act as independent of the others'', but the acts have a common
  source — twenty copies of one deliberation — so the right question is which act-type
  is best when all copies perform it. Randomizing at 1/20 is the answer.


  (2) Marcus: the correlation between my deliberations and theirs is a matter of evidence,
  not logic; if I have good reason to think the others will roll a twenty-sided die,
  fine, that''s a probability to plug into expected-value reasoning — and once it''s
  plugged in, sending (or even sending for sure?) maximizes expected value anyway,
  so the "new kind of rationality" adds nothing but a license to call the recommended
  act rational when ordinary EV reasoning already does / or doesn''t... wait. Let
  me get the math right: if the other 19 each send with probability 1/20, my EV of
  sending = 10^9 × (19/20)^19 ≈ 10^9 × 0.377 ≈ $377M. EV of not sending = 0. So yes
  — even granting the probabilistic correlation, sending for sure strictly beats the
  mixed strategy for me personally. That''s the crux: superrationality recommends
  an act that is not individually optimal conditional on the others following it.
