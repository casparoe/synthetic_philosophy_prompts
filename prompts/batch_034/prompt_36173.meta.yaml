  may fill the quota however it wishes: volunteers first, but the contract expressly
  permits the company to "nominate" employees to fill any shortfall, subject only
  to a twelve-month notice period. Employees on reserve duty keep their salaries,
  but the company must cover continuity costs (backfill, overtime for colleagues),
  estimated at 40% of the absent employee''s fully loaded cost per day. In exchange
  the company receives a flat tax credit, early access to security advisories, and
  preferred standing in ministry contracts. There is a conscientious-objector clause,
  but it is the company, not the employee, that invokes it, and invoking it costs
  a quarter of the tax credit.


  An alternative track exists: the ministry will contract professional security firms
  for the same work, funded by a defense levy on companies that decline. A third option
  is declining altogether and paying the levy, which some companies argue is what
  a firm like ours — with no military customers and a workforce that skews pacifist
