  Dana (an essayist with a background in ecology) said the clearcut had made her heartsick.
  Elias (a philosopher by training) said, half seriously, that he wasn''t sure it
  should: if most wild animals die young and badly, then leveling a forest prevents
  millions of prospective lives that would mostly have been miserable. (1) He reasoned:
  a songbird''s clutch of five typically loses most members within the year; if that
  pattern is representative, average welfare in the wild is negative, and destroying
  habitat removes whole cohorts of net-negative lives rather than merely inconveniencing
  the living.


  (2) Dana replied that even granting the premise, the chainsaw doesn''t subtract
  animals cleanly — the cleared populations are displaced into the remaining forest,
  roadside margins, and farmland, where their deaths may be slower or more crowded;
  and, more fundamentally, "preventing future sufferers" improves the lot of no one:
  there is no individual who is made better off, since absent individuals have no
  welfare to raise.


  (3) Elias said displacement cuts against her, not him: land cleared for crops or
  pasture typically supports far lower densities of animals than standing forest —
  a soy field holds a fraction of the vertebrates a hectare of woodland does — so
  over decades, conversion plausibly means fewer, not more, animal-lives per acre,
  whatever their quality. And person-affecting views that deny this pay a price: they
  imply it''s no loss to bring miserable beings into existence, which Dana surely
  doesn''t believe.


  (4) Dana answered that the density argument smuggles in an assumption — that total
  suffering tracks population size — while fragmented landscapes are famous for irruptions
  and crash cycles: deer eruptions, starvation winters, pest outbreaks that a mature
  forest dampens. Per-capita welfare after clearcutting can be worse, so the direction
  of the effect is an open empirical question, and Elias''s conclusion was a coin
  flip presented as a finding.


  (5) Elias''s last word was a retreat: all he''d meant to establish, he said, was
  that "habitat loss is bad for wild animals" is not axiomatic — it presupposes that
  the lives being lost are worth living, which is precisely what''s in doubt. Dana
  said that if he was only claiming non-obviousness, fine, but then he had no positive
  case for the clearcut either, and the burden should sit on whoever proposes to level
