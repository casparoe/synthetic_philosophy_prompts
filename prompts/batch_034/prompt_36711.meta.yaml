  to settle it, and since the article runs soon, I would appreciate a careful diagnosis.


  His claim is that the deepest lesson of Gödel, Escher, Bach -- the one he thinks
  Hofstadter himself half-saw -- is that self-awareness is mathematically impossible
  for machines. The argument, reconstructed:


  (1) Genuine self-awareness requires an accurate self-model: a system counts as self-aware
  only if it can, at least in principle, predict its own behavior -- what it will
  output, believe, or decide.

  (2) Any computational system is mathematically equivalent to a program...

  (3) By diagonalization, no program can correctly predict the behavior of arbitrary
  programs, including a program constructed to do the opposite of whatever is predicted
  of it; so a program can no more predict its own behavior than it can predict the
  halting problem''s resolution.

  (4) Therefore no computational system can be genuinely self-aware.

  (5) We are genuinely self-aware.

  (6) So the mind is not a computer; and whatever an AI says about itself, its self-reports
  cannot amount to self-awareness.


  Two things bother me. First, the argument seems to prove too much: run the same
  premises on a human being, and unless we can each predict our own next thought in
  full generality, we forfeit our self-awareness too — the logician accepts this,
  saying that human self-awareness is "partial and approximate" and therefore not
  what he means, which sounds to me like giving up the game. Second, I remember GEB
  differently: Hofstadter''s picture there is that consciousness is precisely what
  self-referential systems achieve — the self as a tangled hierarchy, a pattern that
  can represent itself partially and thereby becomes an "I." On that reading, Gödelian
  self-reference is what makes minds possible rather than what forbids machine minds.


  So, three questions. Which premise or inference in the argument should I reject,
  and why did it look fine to me — I suspect the slide happens somewhere between "predict
  its own behavior" and "predict the behavior of arbitrary programs," but I cannot
  state it cleanly, and the logician insists self-prediction is just the halting problem
  applied to one''s own program text. What does rejecting that step cost — is there
  a reading under which his conclusion still goes through against artificial systems
  while sparing us? And finally, does the Gödelian analogy, drawn as he draws it,
  survive contact with the actual incompleteness and halting results, or does the
  strange-loop picture in GEB fit those results better? Please be blunt about where
  the analogy is loose: I would rather correct the logician in print than flatter
  him.


