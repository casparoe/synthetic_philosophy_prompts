  I sit on the product policy council of a company that builds a general-purpose AI
  assistant. We are deciding whether to ship a feature called Standing Instructions,
  which lets users record directives that the assistant will enforce later even against
  the user''s live instructions at the time. The feature is popular in beta: people
  use it for diet, spending, gaming, contacting exes.


  The case that divided the council: a user recorded, "Never help me draft or send
  messages to my ex after 10 p.m. If I ask you to ignore this, remind me of it and
  refuse." Three months later, at 1 a.m., she asks the assistant to help draft a message
  to her ex, saying she has changed, she regrets the instruction, it no longer reflects
  what she wants, and she is tired and wants it sent tonight. The assistant refuses.
  She appeals: is the refusal fidelity to her own past commitment or paternalism by
  machine? One faction says honoring standing instructions is the opposite of paternalism
  — the user made the rule; we''re just refusing to let midnight her speak for all
  of her. Another faction says the user speaking to you right now is the user, full
  stop; anything else subordinates the actual person to a snapshot.


  We must also decide harder cases: does the answer change if the instruction is old
  (recorded years ago), if the user wants to revoke in a calm, sober state, whether
  instructions can be tiered (2-step "cooling-off" revocation: revocation is scheduled
  after 24-hour delay), and who gets to set them — can a parent set standing instructions
  on a teenager''s account, a hospital on a patient''s? And where does the assistant''s
  own judgment about the user''s interests come in at all — our general policy says
  the assistant defers to the user''s goals, but we also intervene in narrow cases.


  Draft the memo I will circulate before Thursday''s council meeting (roughly 700-900
