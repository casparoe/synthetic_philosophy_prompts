  Essay draft (~350 words):


  "Philosophers and psychologists generally agree on the central contrast between
  the two emotions: guilt is about what one has done, shame is about what one is.
  As Bernard Williams argues in Shame and Necessity, guilt responds to a specific
  act, while shame is a global judgment of the whole self. If I betray a friend''s
  confidence, guilt says the betrayal was wrong; shame says I am a person who betrays
  confidences. Because guilt attaches to the act, it motivates repair — apology, confession,
  restitution — while shame motivates hiding and withdrawal, which is useless to the
  wronged party.


  Empirical work bears this out. June Tangney and colleagues found that shame-proneness
  is correlated with anger and defensiveness, while guilt-proneness is correlated
  with empathy and a tendency to make amends. So guilt is the better moral emotion:
  it keeps the response proportionate to the wrong and forward-looking toward repair.


  Guilt is also inherently other-directed: to feel guilt one must have a specific
  victim whom one has wronged. By contrast, shame requires only an audience, real
  or imagined. This maps onto Ruth Benedict''s famous typology in The Chrysanthemum
  and the Sword: in a guilt culture, the sanction is internalized — one feels bad
  about wrongdoing even when nobody is watching — whereas in a shame culture the sanction
  is public exposure. A shame culture therefore cannot really produce conscience,
  only fear of detection.


  Since guilt motivates repair and shame motivates withdrawal, a culture that succeeded
  in shifting from shame-dominance to guilt-dominance would see less wrongdoing overall.
  And such a shift is possible: parents who discipline by pointing to the harm done
  to the other person, rather than by scolding publicly, tend to raise guilt-dominant
  children. Institutions can do the same by emphasizing victims and repair rather
  than exposure and disgrace. A culture can choose, gradually, through these channels
  — and it should choose guilt."


