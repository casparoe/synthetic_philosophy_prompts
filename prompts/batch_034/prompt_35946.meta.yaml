  I teach a joint philosophy–nursing ethics seminar of about sixteen students, with
  one ninety-minute session per week, and for years I have assigned Augustine on lying
  as a museum piece: interesting, extreme, safely historical. That changed this spring,
  when my mother moved into memory care after her dementia progressed. The staff are
