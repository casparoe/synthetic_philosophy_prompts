  fibbing: they tell her that her late husband is at the store, that the doctor is
  coming tomorrow, that this is only a short visit — because the truth, delivered
  plainly, sends her into panic and grief she re-experiences anew each time. Rereading
  Augustine in my office afterwards, I found I could no longer treat him as a period
  curiosity. His claim that every lie is wrong — even one told to save a life, even
  one that harms no one and spares terrible suffering — now sits in my pocket every
  time I visit.


