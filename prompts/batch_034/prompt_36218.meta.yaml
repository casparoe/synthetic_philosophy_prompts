  "I''ve been reading LessWrong since the old days of the Agent Foundations agenda,
  and I still find myself unsure how to think about the problem of inaccessible information
  — roughly, information a model can acquire and use in its predictions or plans,
  but which humans can''t directly observe or check for themselves (think: a model''s
  detailed implicit model of someone''s future behavior, or of the long-run consequences
  of some intervention, which it can''t compactly justify to us). Paul Christiano
  argued this makes ordinary ''test what we can observe'' training schemes unsafe,
  since a model will know much more than it can tell us, and the safe thing is to
  somehow become able to check the things it knows. My question: suppose a lab has
  to pick a research direction to pursue, and the candidate strategies are:


  1. Amplification-style setups (decompose tasks so that humans, iteratively consulted,
  can in principle check the model''s claims) —

  2. Debate-style setups (two models argue in front of a human judge) —

  3. Interpretability (open up the model and read the inaccessible information out
  of its internal ontology) —

  4. Ontology identification (figure out, in the model''s internal ontology, which
  parts correspond to the human concepts we care about, like ''human flourishing''
  or ''being honest'') —

  5. Honesty/obedience training plus careful use of accessible proxies (don''t try
  to extract inaccessible info; train the model to not act on claims it can''t justify,
  and accept the performance hit) —


  Rank these by how likely they are, in your estimation, to eventually render inaccessible
