  a kind of monumental/antiquarian PR job, the defenders in 2020 saying heritage matters,
  the protesters doing critical history with a rope. But I want to know if that mapping
  actually holds up or if I''m forcing it, because I honestly can''t tell anymore.


  Some specific things I keep going back and forth on. Nietzsche (as I understand
  him) cares mostly about whether history serves *life* — the health of individuals
  and cultures — so who is the "we" whose life a statue is supposed to serve? And
  his critical history seems to be about your own past that you can''t live with,
  but he also warns that judging the past harshly is dangerous because you''re judging
  your own origins. Does it change the picture that the statue was put up in living
  memory-ish of Victorian Bristol politics rather than by anyone who actually knew
