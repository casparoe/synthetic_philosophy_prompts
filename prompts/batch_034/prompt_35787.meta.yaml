reasoning_summary: 'Pick a domain and type. Let''s combine "Theories of punishment:
  retributivism vs. consequentialism" with "Construct a thought experiment to specifications."
  That''s a natural fit: design a case where consequentialist and retributivist deliver
  unusual verdicts.


  Ideas: construct a case where the retributivist must punish someone everyone knows
  is innocent? No, that''s standard (the classic "punish the innocent" objection to
  consequentialism). Reverse direction: a case where the retributivist recommends
  punishment that most people find acceptable but the consequentialist must refrain...
  Or: a case where the consequentialist must punish more harshly than the retributivist
  — retributivism is usually seen as the harsh, vindictive one; flip it so the consequentialist
  wants harsher punishment than the retributivist''s proportionality constraint allows.
  That''s a good "opposite of the usual direction" spec.


  Constraints: realistic (workplace, sentencing, not dystopia), the harshness must
  come from optimal deterrence, not from obviously bad rule. E.g., a small-town shoplifting
  case where the culprit is sympathetic and the harm is tiny, but the crime is high-salience
  and would go viral — harsh punishment has outsized deterrence because of news coverage,
  so consequentialist demands severe punishment while retributivist says it must be
  proportionate to desert, which is small. But that''s kind of standard ("punishing
  a scapegoat deters"). The scapegoat case involves an innocent person though; here
  the person is guilty, just guilty of something minor — consequentialist wants to
  punish beyond desert. That avoids the innocent scapegoat issue.


  Also add spec: no one is framed, the person is genuinely guilty; punishment can''t
  be secret/hidden; and maybe require that the retributivist''s "lettting offenders
  off" doesn''t blow back via decreased respect for law — i.e., the deterrence gain
  must be robust. Maybe also ask: which feature does the work (salience/newsworthiness
  multiplier), what happens if removed, how would a consequentialist (rule consequentialist?
  two-level?) resist, e.g., by arguing for a rule against desert-disproportionate
  punishment, or by questioning whether the deterrence gain is real.


  Also deliverable with structured data: after the walkthrough, a JSON object with
  fields: scenario_summary, retributivist_verdict, consequentialist_verdict, doing_the_work_feature,
  if_removed, best_consequentialist_counter, and a verdict on whether the case succeeds.


  Perspective: software engineer, casual, a typo or two.


  Write prompt:


  ---


  Something like: "I keep reading that retributivism is the ''harsh'' theory of punishment
  and consequentialism the bleeding-heart one (rehab, deterrence etc). I want a thought
  experiment that flips this: a case where the consequentialist has to punish way
  harsher than the retributivist. Constraints: realistic sentencing scenario, no framing
  anyone, the person is genuinely guilty; the harshness has to come from ordinary
  deterrence logic (not from keeping a mob calm or anything like that), and the case
  can''t secretly rely on the punishment being publicized more than punishments normally
  are... hmm, actually newsworthiness might be the feature. Let me just require: no
  exotic stuff, and the retributivist''s mild sentence can''t just be because desert
  is ambiguous — desert should clearly be small.


  After the scenario, walk through both theories'' verdicts and why, tell me which
  feature of the case is doing the work, what happens if you remove it, and how a
  smart consequentialist would fight back against being committed to the harsh sentence
  (e.g. by moving to rules or to two-level stuff, whatever you think is best).


  Then give me a structured summary as JSON with fields: scenario, retributivist_verdict,
  consequentialist_verdict, key_feature, if_feature_removed, best_consequentialist_reply,
  does_the_case_work (true/false/qualified plus why)."


  Casual tone with a typo. Keep it short. Fine. No search needed — no verbatim quotes.
  Slogans like "let the punishment fit the crime" are common proverbs; fine.


  Write final prompt with a typo or two ("deterence" maybe, or "punsihment"). One
  or two typos only.'
