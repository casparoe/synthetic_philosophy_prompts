  Grading type on Aumann''s agreement theorem: The question could be about common
  knowledge and whether disagreement implies irrationality. Subtle mistakes: conflating
  "common knowledge of the posteriors" with "common knowledge of the information";
  treating Aumann''s result as saying agents converge instantly rather than via communication;
  misattributing the common prior assumption (it''s actually an assumption in Aumann''s
  1976 setup); claiming the theorem applies to real people with bounded rationality;
  confusing disagreement about posteriors with disagreement about utilities/values.
  Good subtle errors:


  1. Saying agents with common priors who disagree must be "irrational" — actually
  Aumann''s conclusion is they can''t agree to disagree if posteriors are common knowledge;
  the irrationality claim is a gloss. Common misstatement: "Aumann proved rational
  agents can''t disagree." Subtle error: the posteriors must be common knowledge,
  which is a strong condition.


  2. Conflating "common knowledge of posteriors" with "common knowledge of information
  partitions" — in Aumann''s framework, common knowledge of the information structure
  (partitions) is assumed; what becomes common knowledge is the posteriors.


  3. Saying communication leads to convergence in one step — actually agreement is
  reached asymptotically through iterated communication of posteriors (Geanakoplos–Polemarchakis),
  and even that''s only for certain protocols.


