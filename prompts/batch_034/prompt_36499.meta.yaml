  (i) The claim that the Holocaust is unique says that it differs from all other atrocities
  in kind, not just in degree; the claim that it is comparable says that it falls
  under a broader type — genocide, state-directed mass killing — about which shared
  questions can be asked. These are compatible: an event can be without precedent
  in kind and still be one instance of a wider class, since we compare events along
  some dimensions while recognizing that along others nothing resembles them. In the
  Historikerstreit, Ernst Nolte argued that there was no moral difference between
  the crimes of the Soviet Union and those of Nazi Germany, and that the Nazis acted
  out of fear of what the Soviet Union might do to Germany, so that the Nazi crimes
  were in substance a response to, and an imitation of, the earlier Bolshevik terror.
  Habermas, writing in Die Zeit, attacked this as an attempt to relativize the Nazi
  past and thereby normalize it. But this exchange shows that the two claims cannot
  in fact be combined: if the Holocaust is unique in kind, there is no kind to which
  it and other atrocities jointly belong, so comparisons of the kind Nolte drew are
  impermissible in principle, and Habermas''s objection to Nolte is simply the denial
  of comparability.


