  an epistemic contextualist (e.g., Lewis, DeRose). Actually both are in the same
  domain. The two opposing views: pragmatic encroachment (practical stakes affect
  knowledge) vs. a pure contextualist who holds that only the epistemic standards
  of the context shift, or a subjectivist vs. an objectivist… The actual opposition:
  pragmatic encroachers claim that practical considerations can affect whether one
  knows; the opposing view is that knowledge is purely epistemic — practical stakes
  don''t affect knowledge (e.g., "anti-encroachers" like Williamson, or contextualists
  who think only linguistic context matters). A good in-the-weeds dialogue: a pragmatic
  encroacher and a Lewisian contextualist arguing over whether the "knows" ascription
  in "I know I''ll make the connection" (DeRose''s bank case) changes with stakes
  or with salience. The subtle point: both can agree on the bank case but disagree
  on whether the shift is due to stakes (pragmatic encroachment) or due to context
  (contextualism); the interesting in-the-weeds issue is how to distinguish them —
  e.g., the "conversational scorekeeping" vs. "practical scorekeeping" distinction;
  or the objection that pragmatic encroachment predicts that "I know" is false in
  high-stakes cases even when evidence is identical, whereas contextualism needs salience.
  Also, the "bank case" is a staple; to make it in-the-weeds, we could use a different
