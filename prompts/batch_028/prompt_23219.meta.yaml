  I retired from a career in experimental physics a few years ago and, finding myself
  with more time than I knew what to do with, have been slowly working my way through
  decision theory. I keep coming back to a result attributed to I. J. Good, which
  is usually glossed as the claim that the expected value of information is never
  negative—that is, that an agent who may first learn the answer to some question
  and then choose among a fixed set of actions is guaranteed, in expectation, to do
  at least as well as an agent who must choose without that information. The standard
  proof is, I think, genuinely elegant: the value of deciding now is the maximum over
  actions of a weighted average of outcomes, while the value of deciding after learning
  is the weighted average over possible answers of the best available action in each
  case, and a maximum of averages cannot exceed the average of maxima. Yet the more
  I look at it, the more I suspect the slogan is doing more work than the theorem
  warrants.


  The trouble, as I understand it, is that the proof quietly leans on two assumptions
  that the world is not always willing to grant. One is that learning the answer to
  the question leaves the value of each action unchanged in each state of the world;
  the other is that your future self, once the information is in hand, will actually
  behave as a textbook Bayesian expected-utility maximizer. There is a whole family
  of cases—spoilers for a mystery you are about to read, Newcomb-style setups in which
  a predictor has already factored in whether you will look, and so on—that seem to
  drive a wedge between the theorem and common sense, because the information either
  alters the very thing you are choosing for or changes what your future self will
  do. I find myself torn about whether these are genuine counterexamples that show
  the theorem is simply false, or whether they merely exploit one of the two assumptions
  and so tell us something about the boundary of the theorem''s legitimate domain
  rather than its refutation.


  Could you write an essay that takes this dispute seriously and reaches a verdict?
  I would like you to weigh the strongest case for reading the spoiler and Newcomb-style
  examples as genuine counterexamples against the strongest case for reading them
  as artifacts of the assumptions, and then commit to a position rather than ending
  on a balanced shrug. In particular, I would like a clear account of precisely under
  what conditions the non-negativity result survives, and whether the popular formulation—"more
  information is never worse"—is defensible as a general principle about rational
  agents or is at best a local claim with a narrow domain of application.


