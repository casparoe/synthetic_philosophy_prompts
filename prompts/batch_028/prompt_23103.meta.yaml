  Let me be precise. Suppose M is a countable model of ZFC (assuming ZFC is consistent).
  From the outside (meta-theory), M is countable, so M ∩ P(ω) (the "reals" of M) is
  a countable set. M thinks there''s no bijection between its ω and its reals (since
  ZFC ⊢ "there is no bijection between ω and P(ω)" and M ⊨ ZFC, so M ⊨ "no such bijection
  exists"). From the outside, there actually is a bijection f: ω → M_reals (since
  M_reals is countable externally). But f ∉ M — M doesn''t contain f. So internally,
  M is correct: there is no bijection (in M) between ω and P(ω). Externally, there
  is a bijection, but it''s not an element of M. So the "paradox" dissolves: "countable"
  is relative to which set of functions you have access to. Cantor''s theorem holds
  in each model; the external bijection is invisible to the model.


