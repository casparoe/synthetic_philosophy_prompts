  I''m working on a long-form piece for my magazine on the moral foundations of promise-keeping,
  and I''ve been stuck on a question that my editor insists I take a side on rather
  than giving a balanced survey: why does a promise bind in the first place? I''ve
  been talking with a moral philosopher friend who is a committed defender of the
  "will theory" — the Kantian idea that a promise is an act of the will that authoritatively
  assigns to the promisee a right to the promised act, so that breaking the promise
  is a wrong against the promisee''s will even if no one is harmed and no one relied
  on it. I find that view compelling in ordinary cases but deeply puzzling in the
  edge cases, and I''ve come to suspect that the least popular account in the literature
  is actually the correct one.


  Here''s the landscape as I understand it, so we''re working from the same map. On
  the will theory, the binding force of a promise is a free-standing normative fact
  generated by the promisor''s voluntary act, independent of consequences. On the
  reliance or institutional theory, associated with Annette Baier, a promise is an
  institution that creates a justified expectation in the promisee, and the wrong
  of breaking it lies in frustrating that expectation. And on the derivative or harm-based
  account, associated with T.M. Scanlon, there is no distinctive moral wrong of breaking
  a promise at all: the wrong, when there is one, is entirely derivative from the
  harm the breaking does to the promisee, and a harmless breaking is not a moral wrong,
  or is wrong only in a trivial sense.


  I''d like you to argue for the derivative account, and to do it in a way that could
  plausibly appear in my piece. First, explain why the will theorist''s appeal is
  a confusion: I suspect she is smuggling in the logic of coercion, where what binds
