  The flying man: Avicenna (Ibn Sina, 980–1037) describes a man who is created fully
  formed in mid-air, with his limbs spread out and separated from one another, so
  that one limb does not touch another. He has no knowledge of anything external,
  and no sensation in his interior parts. Nevertheless, he does not doubt his own
  existence. Avicenna''s point: the man''s self-awareness is not derived from the
  body or from any bodily part; it is intrinsic to the soul. This is an argument for
  the immateriality of the soul and for the soul''s self-awareness independent of
  the body.


  In-the-weeds angle: The "heart" objection. Later commentators (and Avicenna himself,
  in some readings) noted that the flying man''s self-awareness might actually be
  awareness of the heart (the seat of the soul in Avicennan psychology), and that
  when the heart dies, self-awareness ceases. So the flying man doesn''t actually
  prove that the soul is independent of the body; it only proves that the soul is
  aware of itself as such (al-nafs bi-dhāti-hā), not that it knows its own essence.
  Avicenna distinguished between (1) self-awareness (the soul''s awareness of itself
  as a subject) and (2) knowledge of the soul''s essence (the soul''s knowledge of
  what it is, as a substance). The flying man shows (1) but not (2).


