  So the premise-based verdict (P yes, Q yes ⇒ G yes) contradicts the conclusion-based
  verdict (G no).


  Round 1: Alice (or "the first colleague") says: the dilemma shows majority rule
  on the premises is incoherent; the panel should vote on the conclusion (guilty/not
  guilty) — conclusion-based — because the verdict is what has legal effect, and a
  verdict that''s inconsistent with the majority''s own views is unacceptable.


