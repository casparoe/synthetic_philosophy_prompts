  Background: Discursive dilemma: a panel of judges (say 3) must decide a case where
  guilt requires both P (the defendant acted) and Q (the defendant intended), P∧Q
  ⊢ G (guilty). Individual judges are logically consistent: each accepts P∧Q→G. Majority
