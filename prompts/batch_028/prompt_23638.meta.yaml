  Deep issues in akrasia and hyperbolic discounting:

  1. Hyperbolic discounting: the discount factor is β/(1+δt) or the "quasi-hyperbolic"
  form β·δ^t. The key feature is present-bias: the discount factor between now and
  the next period is β (which is < 1), while the discount factor between the next
  period and the one after is δ (which can be close to 1). This present-bias leads
  to time inconsistency.


  2. The "one-agent" vs. "two-agent" model of akrasia: in the one-agent model, a single
  agent with hyperbolic preferences acts against her long-run (ex-ante) best interest.
  In the two-agent model (e.g., the "present self" and "future self" as separate agents),
  the present self exploits the future self. This is a real distinction in the literature
  (e.g., O''Donoghue and Rabin 1999, "Procrastination in Obedience: An Economic Model
  of Self-Control," Journal of Political Economy; also Thaler and Shefrin 1981, "An
  Economic Theory of Self-Control," Journal of Political Economy).


  3. The question of whether hyperbolic discounting is a genuine model of akrasia
  or just a model of changing preferences. Some philosophers argue that hyperbolic
  discounting captures time inconsistency but not the distinctive feature of akrasia,
  which is the agent''s own judgment that she is about to act wrongly (the "akratic
  awareness"). This is a real debate.


  4. The "commitment device" literature: Thaler and Shefrin (1981) model the agent
  as having a "planner" and a "doer" who can commit to future actions. This is a real
  and somewhat obscure topic.


