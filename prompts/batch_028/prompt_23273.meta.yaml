  Frankfurt cases: The classic Frankfurt case (Frankfurt 1969): Jones is deciding
  whether to vote for A or B. Black wants Jones to vote for A. Black has a device
  that can intervene and force Jones to vote for A, but only if Jones shows any sign
  of voting for B. In the normal case, Jones votes for A on his own, so Black never
  intervenes. Frankfurt argues: Jones is morally responsible for voting for A, even
  though he couldn''t have done otherwise (because if he had shown any sign of voting
  for B, Black would have intervened). So PAP (the principle of alternative possibilities:
  "S is morally responsible for an action only if S could have done otherwise") is
  false.


  The in-the-weeds disagreement:

  Person A: "Frankfurt cases really do show that PAP is false. In the normal case,
  Jones acts on his own reasons, Black doesn''t intervene, and Jones is responsible.
  The fact that Black *would* have intervened if Jones had chosen otherwise is irrelevant
  to Jones''s responsibility in the actual sequence. So PAP is false."

  Person B: "No, Frankfurt cases don''t show what Frankfurt thinks. The issue is that
  in the normal case, Jones''s action is not ''up to him'' in the relevant sense,
  because Black''s presence means that Jones''s choice is not free in the relevant
  sense. Even though Black doesn''t intervene, the *possibility* of intervention means
  that Jones''s action is not genuinely his own. So Jones is not responsible, and
