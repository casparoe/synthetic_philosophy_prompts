  a frequentist problem. His argument was that p-values are systematically misinterpreted
  — people treat p < 0.05 as "there''s a 95% chance the null hypothesis is false,"
  when it actually means "if the null were true, there''s a 5% chance of getting a
  result this extreme." This misinterpretation, he said, is what drives the flood
  of false positives, and the fix is to switch to Bayes factors, which give you the
  actual probability of the hypothesis given the data.


  The other friend, who''s a philosopher of science, pushed back hard. She said the
  replication crisis isn''t a frequentist problem — it''s a problem of incentives.
  Researchers publish positive results, not null results, so the literature is skewed
  toward false positives regardless of whether you use p-values or Bayes factors.
  She argued that the real fix is to pre-register studies and publish null results,
  not to switch statistical methods. The statistician countered that publication bias
  is a symptom, not a cause — the cause is that p-values are too easy to obtain, and
  researchers can p-hack by peeking at the data and stopping when they get a "significant"
  result. She agreed that p-hacking is a problem but said it''s not specific to frequentist
  methods — you can p-hack with Bayes factors too, by peeking and stopping when you
  get a "significant" Bayes factor. The statistician then made his strongest move:
  he said that optional stopping is a *frequentist* problem, not a Bayesian one. In
  frequentist statistics, the p-value depends on the sampling distribution, which
  depends on the stopping rule, so if you peek, the p-value is no longer valid. But
  in Bayesian statistics, the posterior depends only on the likelihood and the prior,
  not on the stopping rule, so optional stopping is not a problem for Bayesian methods.
  She responded by invoking the likelihood principle and said he was conflating "how
  much evidence do I have" with "how reliable is this procedure over the long run"
