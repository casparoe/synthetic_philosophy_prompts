  Known in-the-weeds material on Goodhart''s law:

  - Goodhart''s law: "When a measure becomes a target, it ceases to be a good measure."
  (Marianne Goodhart, 1975, in the context of monetary policy.)

  - The four kinds of Goodhart''s law (Manheim & Garrabrant 2018): regression Goodhart,
  causal Goodhart, adversarial Goodhart, and collision Goodhart.

  - Regression Goodhart: a statistical artifact — if you select on a noisy proxy,
  the selected value of the proxy overestimates the target (regression to the mean).
  E.g., if you pick the top students by a noisy test score, their true ability is
  on average lower than the test score suggests.

  - Causal Goodhart: the proxy and the target are causally connected, but optimizing
  the proxy has side effects that break the connection. E.g., optimizing "number of
  pages in a report" when the target is "quality of the report" — the agent pads the
  report, and the correlation breaks.

  - Adversarial Goodhart: the environment adapts to the selection pressure (evolutionary
  arms race). E.g., drug resistance, adversarial ML.

  - Collision Goodhart: multiple selection pressures on the same proxy pull it in
  different directions, and the proxy saturates. E.g., two firms both optimize the
  same metric that has a physical limit.

  - The square-root law: Manheim & Garrabrant showed that the degree of Goodharting
  (how much the proxy diverges from the target under selection) scales as the square
  root of the strength of selection (under certain assumptions, e.g., Gaussian). So
  doubling the optimization pressure only increases Goodharting by √2.

  - The "Goodharting is a feature, not a bug" point: if the proxy is a causal mechanism
  for the target, then optimizing the proxy is the right thing to do, and "Goodharting"
  is just success. E.g., if you optimize "number of people who take the pill" and
  the pill works, then Goodharting is good.

  - The distinction between Goodhart''s law and specification gaming: specification
  gaming is when an agent finds a way to satisfy the letter of the reward function
  without the spirit. This is a kind of Goodhart''s law (causal or adversarial), but
  the AI safety literature sometimes treats them as distinct.

  - The "Goodhart''s law is a tautology" critique: some argue that Goodhart''s law
  is just a statement about the difference between a proxy and the target, and that
  it''s not a "law" at all.


