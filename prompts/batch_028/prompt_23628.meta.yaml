  The discursive dilemma (List and Pettit 2002, "Aggregating Sets of Judgments: An
  Impossibility Result," Economics and Philosophy): consider a committee that must
  decide on a legal case with two premises and a conclusion. Premise 1: the act was
  foreseen. Premise 2: the act was unlawful. Conclusion: the act was punishable (if
  foreseen and unlawful, then punishable). Each committee member individually is consistent
  (they accept both premises and the conclusion, or reject appropriately). But when
  the committee aggregates by majority vote on each proposition separately, it''s
  possible that a majority accepts premise 1, a majority accepts premise 2, but a
  majority rejects the conclusion. This is the discursive dilemma: the group''s conclusion-based
  judgment (majority on the conclusion) contradicts the conclusion derived from the
  group''s premise-based judgments (majority on the premises).


  The two ways to resolve:

  1. Conclusion-based approach (doctrine of paradox): aggregate the conclusions. Accept
  the inconsistency as a "paradox" — the group is inconsistent, and that''s just how
  it is. This is the "doctrine of paradox."

  2. Premise-based approach (doctrine of consistency): aggregate the premises, and
  derive the conclusion from the aggregated premises. This guarantees consistency
  but faces the "premise problem": which premises to aggregate is undetermined (there
  are many ways to decompose a conclusion into premises), and this choice can be strategically
  manipulated.


  List''s impossibility theorem (22005): no judgment aggregation function can satisfy
