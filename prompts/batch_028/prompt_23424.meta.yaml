  Domain 1: Dummett''s immigration views. Dummett wrote "On Immigration" (2014, with
  his wife Mary). Key ideas: immigration should be governed by the principle of reciprocity
  — the rights of foreigners are defined by what hosts grant to their own citizens;
  the state''s right to control immigration is a "prerogative power" (like the right
  of self-defense) that can be exercised but not demanded. Also his idea that immigration
  policy should be based on what a state can offer its own citizens. In-the-weeds
  angle: the tension between the "prerogative power" framing and the idea that a state
  has a duty to admit (e.g., refugees fleeing persecution — Dummett''s position on
  asylum: refugees have a right to be admitted because the alternative is death or
  persecution, and this is a special case). Or the tension between reciprocity and
  the fact that migrants often have more to gain from moving than hosts do from them
  — reciprocity as an equality of rights, not of benefits. Also Dummett''s view that
  states have no obligation to admit immigrants, but once admitted, they must be treated
  as citizens (naturalization). The "right of self-defense" analogy: states have the
  prerogative to control immigration as a matter of self-defense, but prerogative
  powers are those you can exercise but not demand — so one can''t demand that other
  states admit your citizens, and one can''t complain if a state refuses. In-the-weeds
  conceptual issue: how does a prerogative power survive being grounded in self-defense
  if the state''s "threat" is just economic competition rather than an actual threat
  to survival? Or: Dummett distinguishes between the state''s right to exclude and
  the individual''s right; immigration as a matter between states, not between individuals.


