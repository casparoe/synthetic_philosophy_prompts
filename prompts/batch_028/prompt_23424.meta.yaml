  Let me go with predictive processing + "explain a conceptual issue," focusing on
  the triviality/tautology objection. Actually, let me reconsider — is the triviality
  objection "in-the-weeds" enough? The objection: the variational free energy bound
  (FEP) is a mathematical fact that holds for any model with a partition function
  — it''s just the definition of the evidence bound (Jensen''s inequality / log-sum-exp
  inequality). So the claim "the brain minimizes variational free energy" is (i) if
  the "free energy" is the model''s own variational free energy with respect to the
  model''s own beliefs, then trivially true of any system that has a probability distribution
  over states, and (ii) if it''s meant as a substantive claim about what the brain
  actually does (i.e., that neural activity literally implements the minimization),
  then it''s an empirical claim that''s hard to test and arguably unfalsifiable. The
  in-the-weeds conceptual issue: the difference between a *descriptive* claim (the
  brain''s states are well-described by a model that minimizes variational free energy)
  and a *mechanistic* claim (neurons literally perform gradient descent on free energy),
  and why the triviality objection targets the former while the latter faces different
  objections. Also the "self-consuming" problem: to compute the variational free energy,
  the system needs a model of its own states, and the bound is only as good as the
  model — so "minimizing free energy" is really "making the model''s predictions accurate,"
  which is just... good modeling. The objection is that FEP recasts "good prediction"
  as "minimization of free energy" without adding content.


