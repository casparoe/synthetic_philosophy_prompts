  Domain 3: IRL. In-the-weeds issues: the preference-elicitation problem — IRL infers
  a reward function that explains behavior, but the inferred reward is only identifiable
  up to behaviorally equivalent alternatives; the "imitation" vs. "preference" problem;
  the problem that the inferred reward function is the *maximum-entropy* (uniform)
  distribution over policies consistent with the data — Ziebart''s max-entropy IRL
  — which bakes in an assumption about the agent''s stochasticity; the problem of
  "reward overfitting" where the learned reward explains the demonstration but assigns
