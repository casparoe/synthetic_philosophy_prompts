  In-the-weeds angles for Pasadena:

  - The distinction between "infinite expected value" and "undefined expected value":
  in standard Lebesgue theory, a random variable has a well-defined expected value
  in the extended reals unless both E[X⁺] and E[X⁻] are infinite. Pasadena has E[X⁺]
  = +∞ and E[X⁻] = 0, so it''s well-defined as +∞. So calling it "undefined" is sloppy;
  but there are variants (e.g., a lottery that pays +$2^n with prob 1/2^{n+1} and
  −$2^n with prob… hmm) where it genuinely is undefined.

  - The "fair price" problem: if the expected value is +∞, then for any finite price
  p, E[payoff − p] = +∞, so expected utility theory says you should pay any finite
  price. But also, the difference between two infinite expected values: is the Pasadena
  lottery better than Pasadena with a $1000 fee? Naively, subtracting the fee: E[X
  − 1000] = +∞ still, so "better." But you could also construct a lottery Y such that
  E[X] = E[Y] = +∞ yet for every n, X > Y almost surely… no wait, if X > Y almost
  surely and both have +∞ expected value, then E[X−Y] is… hmm, actually there''s a
  known result: for non-negative random variables, if X ≥ Y then E[X] ≥ E[Y]. For
  +∞ expected values, you can have X > Y almost surely with E[X] = E[Y] = +∞, and
  yet the "difference" X − Y can have a negative, positive, or undefined expectation.
  This is the "infinity is not a number" problem: infinite expected values don''t
  support the usual arithmetic, and the "difference" of two +∞ expected values can
  be anything. This is really in-the-weeds and interesting: e.g., two lotteries both
