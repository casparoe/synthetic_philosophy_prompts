  Aumann (1976) "Agreeing to Disagree":

  - Setup: two agents, state space Ω, common prior μ (a probability measure on Ω),
  information partitions P and Q. Both are Bayesians (update by conditioning on the
  information they have).

  - Theorem: if it is common knowledge that the agents'' posteriors (conditional expectations
  of some random variable X) differ... no wait. Let me state it precisely: if the
  posteriors are common knowledge — i.e., for some a, b, it is common knowledge that
  E[X|P] = a and E[X|Q] = b — then a = b. Equivalently: it cannot be common knowledge
  that the agents disagree.

  - Consequence: agents with a common prior can have different posteriors (after observing
  different evidence), but they cannot both know (in the common knowledge sense) that
  they differ. If agent 1 learns agent 2''s posterior, and agent 2 learns agent 1''s
  posterior, and this is iterated to common knowledge, then they must agree.


