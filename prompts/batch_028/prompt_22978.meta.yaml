  Key facts about Skolem''s paradox:

  - ZF (first-order) proves "there exists an uncountable set" (e.g., P(ω) is uncountable
  by Cantor''s theorem).

  - If ZF is consistent, by the Löwenheim–Skolem theorem it has a countable model
  (a model whose domain is countable from the external/external perspective).

  - Paradox: how can a countable model contain uncountable sets?

  - Resolution: the model''s "ω" may differ from the actual ω (the model is ω-nonstandard,
  i.e., contains non-standard natural numbers — actually, in the case of ZF, the model''s
  ω is the actual ω. ω is absolute: the model''s natural numbers are the standard
  ones, because ω is definable... hmm, actually in a model of ZF, ω is the set of
  finite ordinals, and that''s absolute — every model of ZF has the same ω). The real
  point: the model lacks some bijections. The uncountability of P(ω) within the model
  means "there is no bijection in the model between ω and P(ω)"; externally, there
  is a bijection (since both are countable from outside), but that bijection is not
  an element of the model.

  - So the relativity is about the power set operation / the quantification over functions,
  not about ω.

  - Skolem''s motivation: he wanted to show that set-theoretic notions are relative;
  he was a nominalist/anti-platonist, and he used this to argue that set theory cannot
  capture the intended meaning of "set."

  - Also: the "Skolemization" confusion (Skolem functions vs. Skolem''s paradox) —
  different things.

  - The paradox depends on first-order logic; in second-order logic with full semantics,
  the Löwenheim–Skolem theorem fails, but then we lose a complete proof theory.

  - Also, the distinction between "internal" and "external" uncountability: a set
  is "internally uncountable" if the model thinks there''s no bijection; "externally
  countable" if there''s an external bijection. A model can contain sets that are
  internally uncountable but externally countable.

  - Another subtle point: every model of ZF contains a set that it believes is the
  set of all countable ordinals, ω₁, but externally ω₁^M is countable (if M is countable).

  - Also: the theorem that "every model has an elementary substructure with a countable
  domain" — the downward Löwenheim–Skolem.


