  The Gould-Lewontin spandrels critique: The key idea is that adaptationism (the Panglossian
  paradigm) assumes that all traits are direct products of natural selection, that
  every feature is an adaptation optimized by selection. Gould and Lewontin critique
  this by arguing that many features of organisms are not adaptations but byproducts
  (spandrels) of other processes — developmental constraints, historical contingency,
  drift, etc. The spandrels of San Marco are the triangular wall sections that are
  a byproduct of the architectural design (the arches and the dome), not a designed
  feature. The analogy: some biological features are byproducts of other design, not
  direct adaptations.


  Key concepts in the weeds:

  - The Panglossian Paradigm (from Voltaire''s Pangloss, "the best of all possible
  worlds")

  - The four domains of explanation (the "causal menu"): natural selection, developmental
  bias/constraint, phylogenetic constraint, and drift

  - Spandrels as byproducts

  - The "Panglossian" assumption that everything is an adaptation

  - The critique of "just-so stories"

  - The role of exaptation (a term Gould later developed with Elster)


