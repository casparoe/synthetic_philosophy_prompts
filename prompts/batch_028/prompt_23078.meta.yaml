  The problem, as I understood it, is this: a driver has to leave a highway at the
  second of two consecutive exits, but her memory is so unreliable that when she reaches
  either exit, she has no idea which one she''s at or whether she''s already passed
  the first. One researcher, let''s call her Lena, argued that the whole thing is
  a phantom dilemma. She said the driver should be modeled as making a single decision
  at the start — choosing a *plan*, a rule that says "continue at the first exit,
  get off at the second" — and that once you frame it that way, the expected-utility
  calculation is unambiguous and the so-called paradox just disappears.


  The other researcher, Marco, pushed back. He said that framing smuggles in exactly
  the information the problem is supposed to withhold: a plan that says "continue
  at the first, get off at the second" only makes sense if the driver can tell, at
  the moment of deciding, which exit she''s actually facing, and the entire point
  of the setup is that she can''t. So he insisted the driver faces two genuinely separate
  decisions, each made under the same self-locating uncertainty, and that the correct
  move is to evaluate "get off now" versus "keep driving" at each exit on its own.
  He argued that when you do that, the two evaluations point in opposite directions,
  which is why the problem is a real paradox and not an artifact of sloppy framing.


  Lena replied that Marco is confusing the *agent''s* knowledge with the *modeler''s*
  knowledge. From the outside, the modeler knows there are two exits and can write
  down a plan that distinguishes them; the driver doesn''t need to, because she''s
  just following a committed rule, the way you follow a recipe without needing to
  understand the chemistry. The driver''s failure to identify the exit is irrelevant,
  because the plan was chosen before the uncertainty arose.


  Marco answered that this is exactly the mistake. A rule you follow "without understanding"
  still has to be *applicable* at the moment of action, and a rule that says "if first
