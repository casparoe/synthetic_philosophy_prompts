  Hmm, this is an important design choice. If both had the same information, then
  the philosophical problem is sharper: the disagreement can''t be explained by differential
  information; it must be explained by different priors or different reasoning. And
  the board''s question becomes: can we adjudicate which is rational? The answer:
  not by appeal to the theorem itself — the theorem only says that if all the assumptions
  hold, they should agree; since they don''t agree, at least one assumption fails,
  but the theorem doesn''t tell us which. The board can''t determine who failed the
  assumption without doing the forecasting itself, which would make the board the
  forecaster and defeat the tournament. Also, the "common prior" assumption is suspect
  in the first place: do two forecasters really share a prior? Their priors are formed
  by different training histories; the common prior assumption is an idealization.
  So the memo''s recommendation: uphold the result; the protest fails because (1)
  the tournament''s metric is calibration, which is the board''s only objective handle
  on epistemic quality, and (2) the board cannot adjudicate "rationality" without
  assuming the very thing the tournament is supposed to measure; (3) the runner-up''s
  argument, if accepted, would let any loser appeal to a board''s second-guessing.
  The strongest consideration on the losing side: there is a real risk of rewarding
  lucky-but-unprincipled forecasts; a 0.87 could be a lucky overconfident guess; calibration
  over a single event is noisy; and the "good faith" rule was probably intended to
  exclude bad epistemics, not just bad faith. So the recommendation: uphold the result,
  but for next year (a) define "good faith" to exclude only verifiable errors (arithmetic,
  use of known-false information, undisclosed conflicts of interest), (b) add an optional
  "reasoning disclosure" for large divergences, (c) maybe weight by number of forecasts
  / use a multi-event score to reduce single-event noise. Keep the memo tight.


