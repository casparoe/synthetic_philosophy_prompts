  The problem of old evidence, as I understand it:

  - Suppose E is "old" — it was already known (already in the agent''s evidence base)
  before H was proposed.

  - On standard Bayesianism, confirmation is measured by how much E raises the probability
  of H: P(H|E) > P(H). This requires computing P(H|E) = P(E|H)P(H)/P(E).

  - But if E is old, the agent has already conditionalized on E. So the agent''s current
  credence in H is already "post-E." The question is whether H, now proposed, gets
  "confirmation" from E.

  - The difficulty: the likelihood ratio P(E|H)/P(E|~H) is not well-defined in the
  usual way, because E''s probability given H is not "the probability that we would
  have obtained E given H" (since E was obtained before H existed). Instead, P(E|H)
  is just... the probability that E is true given H, which is a "retrospective" probability.

  - The "no" camp (e.g., some Bayesians) argues that old evidence cannot confirm in
  the standard sense, because you can''t "re-conditionalize" on E, and the likelihood
  ratio is not the right measure.

  - The "yes" camp (e.g., Howson and Urbach, and "explanatory" accounts) argues that
  old evidence can confirm via "explanation": H explains E, and "explanation" is a
  form of "confirmation." Or via "Bayes''s theorem" applied to the "explanation."


