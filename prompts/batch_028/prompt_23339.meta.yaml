  **Aumann''s agreement theorem + grading a student''s answer**: This is a great combo.
  Aumann''s theorem is somewhat in the weeds — it''s about common priors, common knowledge
  of rationality, and the conclusion that agents with common priors and common knowledge
  of each other''s posteriors must have equal posteriors. There are lots of subtle
  points that students commonly get wrong:

  - The common prior assumption (it''s about a common prior over the state of the
  world, not about "having the same beliefs")

  - Common knowledge of rationality vs. mere mutual knowledge

  - The theorem applies to posteriors, not priors

  - The theorem is about probability distributions, not about certainty

  - A common misconception: "the theorem shows that rational agents always agree"
  — no, it shows they can''t have disagreement that is common knowledge. Disagreement
  is possible when it''s not common knowledge.

  - The "depth" of common knowledge matters (Aumann''s theorem needs infinite iterated
  common knowledge, not just "I know you know I know")

  - Some people confuse this with the "no free lunch" or with the Dutch book argument

  - Also related: the theorem doesn''t say agents will actually reach agreement after
  discussion (that''s more like the "Aumann-Meyer" or the "agreement theorem" vs.
  "disagreement" literature)

  - Another subtle point: the theorem requires a finite state space (or at least a
  countable one with some conditions). In infinite spaces, the result can fail.

  - The "common prior" is often confused with "common information."


