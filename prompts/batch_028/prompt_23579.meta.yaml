  circle. The selection story itself must say that the representation was selected
  for tracking the represented property, and the notion of tracking already presupposes
  the very correct-correlation relation the account is trying to explain. The circle
  therefore reappears at the level of the selection narrative, and the etiological
  grounding does not supply the non-circular anchor the account needs.


