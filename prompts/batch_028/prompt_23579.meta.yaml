  On Millikan''s teleosemantic account, the content of a mental representation is
  fixed by its proper function, which is in turn fixed by the evolutionary history
  of its bearer. A belief that there is a predator, for instance, has that content
  because the relevant neural state was selected for being caused by predators and
  for causing flight. On this view a representation is correct when it performs its
  proper function, that is, when it is caused by the property it represents, and it
  is a misrepresentation when it occurs in the absence of that property.


