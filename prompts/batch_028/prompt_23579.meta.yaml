  The "circularity" or "explanation gap" objection to teleosemantics: The idea is
  that Millikan''s account explains the correctness of a representation by reference
  to its proper function, but the proper function is itself defined by reference to
  the representation''s history of being correct (i.e., of correctly tracking the
