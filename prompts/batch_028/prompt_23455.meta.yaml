  in 1913 (the "Hole argument" or "Lochbetrachtung"), and the distinction between
  the manifold (the bare set of points) and the physical fields on it. The argument:
  given a spacetime manifold M with metric g, consider a region H (the "hole") with
  a smooth cutoff function. The diffeomorphism identity on M that becomes non-identity
  inside H generates a new metric g'' that agrees with g outside H but differs inside
  H. Both (M, g) and (M, g'') satisfy the field equations (because Einstein''s equations
  are generally covariant). If we take the points of the manifold as having physical
  identity independent of the fields (substantivalism), then these are two physically
  distinct possibilities with the same empirical content — a violation of determinism
  (the same initial data on a Cauchy surface give two different solutions). Conclusion:
  the points of the manifold are not physically individuated; what is real is the
  equivalence class of fields (the structure), not the bare manifold.


