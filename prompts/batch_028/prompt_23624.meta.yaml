  **Counterpart theory vs. transworld identity**: In-the-weeds: Kripke''s transworld
  identity (a person can fail to exist in a world without ceasing to exist), Lewis''s
  counterpart theory (no transworld identity; modal claims are about counterparts;
  "I could have been a senator" means my closest counterpart was a senator). Consequences:
  Leibniz''s law fails for transworld counterparts; the problem of "identity conditions"
  — e.g., the ship of Theseus, the problem of "could I have been born to different
  parents?" — Kripke says no (essentialism of origin), Lewis''s counterpart theory
  handles it differently (the counterpart has different parents). Also the "problem
  of counterparts of counterparts" and the issue of "the closest world in which I
  am a senator" vs. "a world in which my counterpart is a senator." Also, the famous
  example: "the man in my left corner" (Lewis''s example of a person who is a counterpart
  in one world but not another).


