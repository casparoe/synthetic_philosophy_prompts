  The bootstrapping problem (in Pritchard/Sosa''s formulation): can a source S provide
  evidence for S''s own reliability? Sosa''s henhouse: Henny has a memory of being
  reliable; from that memory she infers she''s reliable; from her reliability she
  infers her memory is reliable. This is circular (the memory of reliability is justified
  only if memory is reliable, and the reliability is justified only if the memory
  is reliable). Sosa says this fails — the circularity is vicious (in his "virtue
  epistemology" framing, Henny has aptness? no — Henny lacks aptness; she has "adroit"
  belief without aptness... actually, in Sosa''s henhouse example, Henny''s belief
  that she is reliable is adroit (formed by a competent faculty) but not apt, because
  the competence is not the right kind — the circularity means the belief is not truth-conducive
  in the right way). Pritchard''s bootstrapping problem: testimony can''t bootstrap
  — "I remember that my testimony is reliable, so I trust my testimony" fails.


  And "easy knowledge": Pritchard''s thesis that perceptual experience can provide
  easy (non-circular, direct) evidence for the reliability of perception: "I see that
  p, therefore I know that I''m seeing that p, therefore I know that my perception
  is reliable" — the first step doesn''t require an independent premise about reliability.
  Easy knowledge is the view that some knowledge can be had "easily," i.e., without
  the usual evidential work.


  So in the memory-audit situation: the friend''s circularity objection is *in the
