  Let me be careful about the actual math to make sure the prompt''s "seeding" is
  correct:


  Setup: Two envelopes. One contains $X, the other $2X, where X is determined by the
  host''s procedure. You pick one at random. You open it and see $n. Should you switch?


  Naive argument: With probability 1/2, your envelope has the smaller amount, so the
  other has $2n. With probability 1/2, your envelope has the larger amount, so the
  other has $n/2. So E[other] = (1/2)(2n) + (1/2)(n/2) = 1.25n > n. So switch.


  Resolution 1 (conflation): The "n" in the two terms are different random variables.
  In the first term, n is the smaller amount; in the second, n is the larger amount.
  You can''t plug in the observed n into both. Correctly: let S be the smaller amount.
  If you have the smaller, you see S and the other has 2S. If you have the larger,
  you see 2S and the other has S. So E[other | you see n] = P(you have smaller | you
  see n)·2n + P(you have larger | you see n)·(n/2). The probabilities P(you have smaller
  | you see n) are not 1/2 in general — they depend on the prior over S. Specifically,
  P(you have smaller | you see n) = P(S = n) / (P(S = n) + P(S = n/2)) (for a discrete
  prior), by Bayes. So the "1/2" in the naive argument is only valid if the prior
  makes P(S=n) and P(S=n/2) equal, which a "scale-invariant" (improper) prior would,
  but that prior is not a real distribution.


  Resolution 2 (symmetry, before opening): By symmetry, before opening, E[other] =
  E[yours] (by linearity, E[other] = 0.5·E[2S] + 0.5·E[S] = 1.5·E[S] = E[yours]).
  So no advantage before opening. But the naive argument conditions on seeing n, which
  is the interesting case.


