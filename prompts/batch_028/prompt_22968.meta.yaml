  Leibniz distinguishes three types of necessity:

  1. Metaphysical (or absolute) necessity: truths that hold in all possible worlds
  (e.g., 2+2=4, the law of non-contradiction). These are necessary truths of reason.

  2. Physical (or hypothetical) Necessity: truths that hold given the laws of nature
  (e.g., water boils at 100°C at sea level). These are contingent in an absolute sense
  but necessary given the natural order.

