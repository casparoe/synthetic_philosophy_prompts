  Let me think about the specifics. Aumann''s agreement theorem (1976) says: if two
  agents have a common prior and it is common knowledge that they are rational (i.e.,
  they update by Bayes'' rule), then their posteriors on any event must be the same.
  The "common prior" assumption is crucial: if the agents have different priors, they
  can have different posteriors even with common knowledge of rationality. This is
  the "no common prior" relaxation.


  The "two traders" problem (or "no trade" theorem) is a related result: if two agents
  have a common prior and it is common knowledge that they are rational, then there
  is no trade that both agents would agree to at any price. This is a corollary of
  Aumann''s theorem.


  The "Bayesian persuasion" result (Kamenica and Gentzkow, 2011) is a related but
  different result: a "sender" can design an "information structure" to influence
  a "receiver''s" posterior, but the receiver''s posterior is a "mean-preserving spread"
  of the prior. This is related to but different from Aumann''s theorem.


