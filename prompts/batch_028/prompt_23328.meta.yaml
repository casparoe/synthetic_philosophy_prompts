  The counterarguments (in the literature):

  1. "The numbers matter" (Parfit): The value of saving people is additive, so saving
  five has more value than saving one. The numbers matter because the total value
  is greater.

  2. "Each person matters" (McMahan, "Why the Numbers Matter"): Each of the five matters,
  and so do the others; the fact that each matters means the total matters. Actually,
  McMahan argues that the numbers do matter, using the fact that each person matters.

  3. The "self-undermining" objection: Taurek''s view seems to imply that we should
