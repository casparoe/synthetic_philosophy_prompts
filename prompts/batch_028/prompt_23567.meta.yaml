  Let me develop Option A in more depth: Quine''s translation indeterminacy vs. Putnam''s
  model-theoretic argument. Both are "underdetermination" arguments, but they differ
  in kind:


  - Quine (Word and Object, 1960): radical translation, the "gavagai" example; the
  translator cannot determine, from all possible observations (stimulus meaning),
  which translation manual is correct; the two manuals are both empirically adequate
  but assign different meanings; therefore meaning is indeterminate. The argument
  is about the relation between evidence (overt behavior, stimulus) and meaning assignments;
  it''s an argument about the empirical underdetermination of interpretation in a
  specific context (radical translation). Quine''s claim is often read as a "semantic
  underdetermination" — the totality of evidence underdetermines the theory.


  - Putnam (1981, "The Challenge of Semantic Externalism" / "Why I Am Not a Realist,"
  and the earlier "The Meaning of ''Meaning''" 1975): the model-theoretic argument
  — for any theory T and any model M of T, one can construct a nonstandard interpretation
  of T''s non-logical vocabulary that makes T true in M (by a permutation of the domain
  / a "reinterpretation"), so that all models of T satisfy T under a suitable interpretation;
  hence the evidence (the theory''s empirical content) cannot determine reference;
  conclusion: semantic externalism is untenable, and realism (the idea that there
  is a fact of the matter about reference) is false. This is a logical/model-theoretic
  argument, not an empirical one; critics (e.g., Williamson, and Quine himself, and
  others) argue that it shows only that "the evidence does not determine interpretation"
  in a trivial sense, and that it confuses "interpretation" with "translation"; Quine''s
  reply was that the model-theoretic argument is "trivial" or shows only what he already
  knew.


