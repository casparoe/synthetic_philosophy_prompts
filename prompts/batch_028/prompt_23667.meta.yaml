  Standard St. Petersburg: flip until heads; if heads appears on the n-th flip, pay
  2^{n-1} dollars (n=1,2,3,...). Probability of heads on flip n is (1/2)^n. Expected
  value = sum_{n=1}^{inf} 2^{n-1} (1/2)^n = sum 1/2 = infinity.


  Truncated at K flips (if no heads in K flips, pay 2^{K-1}, or the game ends with
  payout 2^{K-1}): EV = sum_{n=1}^{K} 2^{n-1} (1/2)^n = K/2. So the fair price of
  a truncated game is K/2 dollars. If the casino has 2^{K-1} dollars, the fair price
  is K/2. So if the casino is a billionaire (2^{31} dollars ≈ 2 trillion dollars),
  the fair price is about 31/2 ≈ 15.5 dollars. This is a nice "in the weeds" result:
  the fair price of the St. Petersburg game against a finite casino is logarithmic
  in the casino''s wealth, so even against a trillion-dollar casino the fair price
  is only about 20 dollars.


