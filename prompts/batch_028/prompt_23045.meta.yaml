  The "mere presence" objection to Frankfurt cases: The idea is that the mere presence
  of the counterfactual intervener (Black) vitiates the agent''s freedom, even if
  Black''s device is never activated. That is, the fact that Black is "there" (with
  the device, ready to intervene) means that the agent is not really free, because
  his action is "under the control" of Black in a relevant sense.


  This objection is usually associated with the idea that freedom requires that the
  agent''s action not be "under the control" of any other agent. In the Frankfurt
  case, the agent''s action is "under the control" of Black (in the sense that if
  the agent had shown any sign of deciding to do otherwise, Black would have intervened).
  So the agent is not really free.


  The standard reply to the "mere presence" objection: Fischer and Ravizza argue that
  what matters is the "nature" of the actual sequence, not the mere presence of the
  intervener. That is, if the agent''s action in the actual sequence flows from the
  agent''s own reasons and abilities (i.e., it is a "guiding" control), then the agent
  is free, even if there is a counterfactual intervener present. So the Frankfurt
  case does refute PAP.


