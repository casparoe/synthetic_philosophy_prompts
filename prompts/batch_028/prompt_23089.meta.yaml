  Aumann''s agreement theorem (1976): Let there be a finite state space Ω with a common
  prior P (a probability measure on Ω, shared by both agents). Each agent i has an
  information partition P_i. The posterior of agent i for an event E given their information
  set is P(E | the cell of P_i containing the true state). The theorem: if for some
  event E, it is common knowledge that both agents have the same posterior P(E | ·),
  then the posteriors are equal. Equivalently: if the posteriors are common knowledge,
  they are equal.


  Corollary (dynamic): in a public-announcement process where agents repeatedly announce
  their posteriors, the process converges (in finitely many steps for finite spaces)
  to a state where posteriors are equal and common knowledge.


  Key assumptions:

  1. Common prior (on the state space).

  2. Each agent is Bayesian (updates by conditionalization).

  3. Common knowledge of rationality / the structure (each knows the other''s partition,
  knows the other is Bayesian, etc.).

  4. The announcement is public and truthful.


  So a common prior does not imply the agents agree on posteriors — they have different
  partitions (private information), so their posteriors differ. The theorem says that
  when the posteriors become common knowledge, they must be equal. The non-triviality:
  the fact that agent 1''s posterior is common knowledge conveys information about
  agent 2''s signal, and so on. The "trivial" reading ("agents who start from the
  same place agree") is wrong because agents with a common prior and different private
  signals generally disagree on posteriors — the theorem''s content is about what
  happens when that disagreement is made common knowledge.


