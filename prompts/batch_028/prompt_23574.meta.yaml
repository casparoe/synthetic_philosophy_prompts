  Clean argument against pure time preference (a "self-defeating" / "no-regret" argument):
  Suppose you have pure time preference, i.e., you discount future utility. Consider
  a choice at time t: take a small cost now for a large benefit later, or vice versa.
  Because you discount, you might reject a future benefit that, from the future''s
  perspective, you''d have wanted. Concretely: at time t=0, you can pay $10 to get
  $15 at t=1 (a good deal, 50% return). But you discount the future at 60%, so you
  reject it. At t=1, you''d have preferred to have taken it (from t=1''s perspective,
  the $15 is now and the $10 cost is sunk). So your t=0 self makes a choice that your
  t=1 self regrets, and you knew this in advance. An agent who knowingly makes a choice
  that their future self will regret (and that would be better from the future''s
  perspective) is making an irrational choice. This is the standard "time preference
  is self-defeating" argument. The defender''s response: the t=1 self''s preferences
  are themselves distorted by the same time preference (they''re biased toward the
  present), so you shouldn''t defer to the future self''s evaluation. It''s like the
  case of a person who knows they''ll be in a bad mood tomorrow and don''t defer to
  future moods. Or: the "now" of each moment is not a legitimate basis for preference
  — but the defender says: the reason the future self''s evaluation is biased is precisely
  that they''re closer to the benefit, and that''s exactly what pure time preference
  is (you value proximity in time). Hmm, but if you value proximity in time, then
  at t=0 the $15 at t=1 is less valuable to you than the $10 at t=0, because the $10
  is closer to "now" (t=0). At t=1, the $15 is closer to "now." So the change in preference
  is exactly the content of pure time preference. The question is whether a preference
  ordering that changes like this over time is coherent/rational.


