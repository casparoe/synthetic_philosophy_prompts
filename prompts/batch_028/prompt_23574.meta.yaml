  Hmm, this is good, but I need to be careful to get the content right. The hole argument
  (Norton 1988, Earman & Norton 1989): Consider a solution to the vacuum Einstein
  equations (or with matter) on a spacetime. Let H be a region (the "hole") bounded
  by two spacelike hypersurfaces Σ1 and Σ2. Apply a diffeomorphism D that is the identity
  outside H and nontrivial inside (a "hole transformation"). D maps the solution (M,
  g, matter fields) to a new solution (M, g'' = D*g, matter'' = D*φ). The two solutions
  agree on the matter distribution outside H (since D is the identity there), so they
  agree on all the initial data on Σ1 (if Σ1 is outside the hole... actually, the
  standard setup: the data on Σ1 determine the fields outside the hole by the equations,
  but inside the hole, both the original and the dragged-along solutions satisfy the
  equations and the boundary conditions, so the initial data on Σ1 don''t determine
  the fields inside the hole). So: if points of spacetime have independent identity
  (substantivalism), then the two solutions represent two different physical situations
  (the matter is at different points inside the hole) that agree on all the initial
  data — so the theory is indeterministic. If you deny that they''re different situations,
  you''re denying that the points have independent identity — relationalism / structuralism.
  So the argument is: substantivalism → indeterminism. Since GR is (supposedly) deterministic,
  substantivalism is false.


  The main response (e.g., from Norton himself, and later discussions): the hole argument
  is not really an argument against substantivalism, but a demonstration that "substantivalism"
  as usually understood (points as individual objects) is not compatible with the
  gauge structure of GR. The diffeomorphism-related solutions are gauge-equivalent
  representations of the same physical situation. The "underdetermination" is a gauge
  redundancy, not a physical indeterminism. Determinism should be understood modulo
  gauge: the initial data determine the equivalence class of solutions. So the argument
  shows that naive substantivalism (the "points as objects" view) is untenable, but
  not that spacetime points are unphysical — it pushes you toward a refined substantivalism
  (e.g., the metric field itself is the substance, "metric substantivalism") or toward
  structural realism.


  Also, there''s the issue that the hole argument is sometimes presented as an argument
  about "the identity of points" and the response is that the argument only works
  if you presuppose that points have identity independent of the fields (i.e., it''s
  somewhat question-begging against relationalism, and against substantivalism it
  shows that determinism fails only if you hold the points fixed).


