  The standard response: the diffeomorphism-related solutions are gauge-equivalent
  — they represent the same physical situation. The "indeterminism" is an artifact
  of treating the mathematical representation (the assignment of fields to points)
  as if it were the physical situation. Determinism in GR is understood modulo diffeomorphism:
  the initial data determine the equivalence class of solutions. So the hole argument
  doesn''t show that the theory is indeterministic, it shows that the points don''t
  have identity independent of the fields — which is exactly what a relationalist
  or structural realist says, and a substantivalist can respond by refining their
  view (e.g., only the metric field is real, or the "substance" is the structure of
  the manifold + fields up to diffeomorphism).


  Also, there''s a subtlety the prompt can exploit: is the argument question-begging?
  The response says "the two are the same situation because diffeomorphisms are gauge"
  — but what makes a transformation "gauge" is precisely that it doesn''t change the
  physical situation, and that''s determined by the physical interpretation, not by
  the mathematics. So the response seems to presuppose the conclusion (that the points
  have no independent identity). This is a real point in the literature (it''s often
  said that the hole argument is not a "purely logical" argument, but depends on how
  you interpret the theory. Norton''s own later position is that the argument is a
  "demonstration" rather than a "proof," and that it shows that substantivalism is
  incompatible with the gauge structure of GR).


