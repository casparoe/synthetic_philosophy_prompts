  Ulysses contracts are less problematic than third-party paternalism because they''re
  self-authored. Standard reply: the distinction is that the agent is the author of
  the constraint. Follow-up: but the constraint is imposed on the future self, who
  did not author it (the past self did). So from the future self''s perspective, the
  constraint is imposed by "someone else" (the past self). Is that really different
  from third-party paternalism, where the constraint is imposed by someone other than
  the person constrained?


  4. The "reversibility" condition: Some argue that a Ulysses contract is only legitimate
  if it''s reversible (the future self can undo it). But if it''s reversible, then
  it''s not really binding (the future self can just undo it when they want to fail).
