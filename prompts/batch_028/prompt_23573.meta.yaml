  2. The "sophistication" assumption: For a Ulysses contract to be legitimate, the
  past self must correctly predict the future self''s preferences and the circumstances.
  But people are often "nonsophisticated" (they don''t anticipate their future weakness).
  So many "Ulysses contracts" are actually made by a past self who doesn''t understand
  the future failure. Standard reply: this is a problem of "sophistication," and the
  contract is only legitimate if the past self is sophisticated. Follow-up: but if
  the past self is sophisticated enough to know they''ll fail, why do they need the
  contract at all? And if they''re not sophisticated, the contract is based on a misprediction
  — so how can it be a legitimate expression of their rational will?


