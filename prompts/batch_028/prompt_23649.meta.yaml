  I''m a philosophy professor (epistemology and the philosophy of probability, mostly)
  and I sit on our state Supreme Court''s advisory commission on forensic evidence
  — a small group we convene when a case turns on statistics the trial judges weren''t
  trained to evaluate. There''s a case in front of us right now, and I need a memo
  I can circulate to the commission before Thursday''s session, so it has to be something
  we can actually act on. The defendant was convicted of an arson at a family-run
  dairy in a very small, insular town; the prosecution''s expert testified that the
  paint fragment found at the scene matched a rare pigment formulation, and that only
  about 1 in 50,000 homes in the state used a product containing it, so he told the
  jury there was a 1 in 50,000 chance the paint came from somewhere other than the
  defendant''s house. The problem is that the defendant''s house is in a town of about
  800 people, and the dairy''s supplier sold that exact product to maybe 30% of the
  town for a decade, so the "1 in 50,000" number is doing exactly the thing I keep
  telling my students the reference class problem is about — except I want the memo
  to be careful, because I don''t think the answer is just "the prosecution''s number
  is wrong, use the town number instead." The town number is also a reference class,
  and the defendant belongs to smaller and smaller classes (the street, the supplier''s
  customer list, the people who repainted in the last five years), and I''m not sure
  there''s a principled place to stop, and I suspect the memo should say something
  honest about that rather than pretend the Bayesian fix is clean.


  So: draft the commission''s opinion memo. It should recommend a concrete disposition
  of the appeal — reverse, remand with a specific jury instruction, or affirm — with
  a time frame for any next step, and it should engage the prosecution''s position
  seriously: their real point, which I think is partly right, is that the rarity of
  the pigment is still evidence of something, and that the defense didn''t put on
  any Bayesian case of its own, so maybe the error was harmless. I want the memo to
  treat that as the strongest objection and then explain why or why not it still loses.
  And please keep the math light — the commission includes two judges and a forensic
  pathologist who can follow a conditional-probability argument but will stop reading
  if it turns into a textbook. I was discussing this with a friend of mine who does
  the jury-study work and she kept saying the real question is what the jury will
  do with a "1 in 3,000" instruction instead of a "1 in 50,000" one, and I think the
  memo should at least address that head on.


