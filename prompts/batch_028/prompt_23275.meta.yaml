  Let me double-check the accuracy of the claim. On supervaluationism:

  - A vague statement S is "supertrue" iff S is true under every precisification.

  - A vague statement S is "superfalse" iff S is false under every precisification.

  - A vague statement S is "indeterminate" iff S is true under some precisifications
  and false under others.

  - For a vague predicate P and an object a at the borderline, "Pa" is true under
  some precisifications and false under others, so "Pa" is indeterminate (neither
  supertrue nor superfalse).

  - But "Pa or not-Pa" is true under every precisification (since for each precisification,
  either Pa or not-Pa holds by classical logic), so "Pa or not-Pa" is supertrue.

  - So supervaluationism preserves the supertruth of LEM for vague predicates, while
  denying that "Pa" itself is true (or false) at the borderline. This means bivalence
  (every statement is either true or false) fails for vague predicates in the classical
  sense, but the schema "S or not-S" is supertrue for every S.


  On epistemicism:

  - There is a precise cut-off. For each n, "this heap has n grains" (or "x is a bald
  man") is either true or false, with a precise boundary. We just don''t know where
  the boundary is.

  - So bivalence holds for vague predicates in the classical sense (each instance
  is determinately true or false).

  - LEM holds trivially.

  - The vagueness is epistemic: it''s a limitation on our knowledge, not on the world.


