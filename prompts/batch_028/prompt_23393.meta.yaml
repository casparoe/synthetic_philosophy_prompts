  the person is "certain" they''ll be copied.


  In-the-weeds conceptual issues around Parfit:

  - The distinction between "what matters" (R) and identity, and why Parfit thinks
  identity is not what matters.

  - The "fission" case: one person''s brain is split and transplanted into two bodies.
  Both continuations have R with the original. Parfit says both are survivors (in
  the sense that matters), but neither is identical to the original (since identity
  is one-to-one). This shows identity is not what matters.

  - The "all-or-nothing" nature of identity vs. the "degrees" nature of R.

  - The "survival without identity" — Parfit''s view is that you can survive (in the
  sense that matters) without being numerically identical.

  - A subtle point: Parfit''s view implies that in the standard teleporter, you "survive"
  even though you die (in the identity sense). This is a "survival" that is not survival
  in the ordinary sense.

  - Another in-the-weeds point: the relationship between "connectedness" (direct psychological
  connections) and "continuity" (an overlapping chain of connectedness). Parfit distinguishes
  these. Connectedness is a matter of degree and is about direct connections. Continuity
  is the existence of an unbroken overlapping chain of connectedness above a certain
