  Let me think about Newton''s bucket. The in-the-weeds issues:

  - Newton''s bucket argument: a bucket of water spinning shows concave water surface,
  which Newton argues shows absolute rotation (rotation relative to absolute space).
  Relationists (Leibniz, later Mach) argue that rotation is relative to the fixed
  stars / all other matter.

  - The in-the-weeds issue: the bucket shows that rotation is not purely relative
  to nearby matter (because the water''s surface is concave even if the bucket is
  the only thing in the universe — well, Newton''s point is that the water rotates
  relative to absolute space). But Mach''s response: the water''s surface is shaped
  by rotation relative to the rest of the mass in the universe (the fixed stars).
  So in an empty universe, there would be no centrifugal force.

  - The deeper in-the-weeds issue: the distinction between absolute and relative acceleration.
  Linear motion is relative (you can''t tell if you''re moving in a straight line),
  but rotation/acceleration seems absolute (you can feel centrifugal force). The relationist
  has to explain why rotation is special.

  - The "substantivalist" response: absolute space is a real entity that exists whether
  or not there''s matter in it. The "relationist" response: space is just a set of
  relations between objects.

  - The in-the-weeds conceptual issue: why does the bucket seem to support substantivalism?
  Because the water''s concave surface depends on rotation relative to something that
  isn''t the bucket or the water (i.e., absolute space). But the relationist can respond
  that it''s rotation relative to the distant stars. The real issue: is there a difference
  between "rotation relative to absolute space" and "rotation relative to the fixed
  stars"? In our universe, they''re the same (the fixed stars are at rest relative
  to absolute space, roughly). But in principle, they''re different. The substantivalist
  says the bucket shows rotation relative to absolute space, which is a real entity.
  The relationist says it''s rotation relative to the mass distribution, which is
  not a real entity but a set of relations.

  - A subtle in-the-weeds point: the bucket argument actually shows something weaker
  than full substantivalism. It shows that there''s a fact about the water''s rotation
  that isn''t reducible to its relation to the bucket or the water. But it doesn''t
  show that this fact is a relation to a real entity called "absolute space." It could
  be a relation to the mass distribution (Mach). So the bucket argument is consistent
  with a sophisticated relationism. The real debate is about what the "something"
  is that the water rotates relative to.


