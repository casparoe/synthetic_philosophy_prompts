  Kant''s FUL: "Act only according to that maxim by which you can at the same time
  will that it should become a universal law." In the Groundwork, Section I, he gives
  examples:

  1. False promising — contradiction in the conception: the maxim "make a false promise
  to get a loan when I need money" — if universalized, the institution of promising
  collapses (no one would trust promises), so the maxim self-defeats. Perfect duty
  (negative duty).

  2. Failing to develop one''s talents — contradiction in the will: universalizing
  "no one develops their talents" is conceivable (possible), but no one could will
  it, because everyone presupposes the use of talents in pursuing ends. Imperfect
  duty (positive duty).

  3. Not helping others — contradiction in the will: the maxim of never helping is
  conceivable (a world where no one helps is possible), but no one could will it,
  because at some point they themselves would need help. Imperfect duty.

  4. Rational suicide — contradiction in the will: universalizing "end one''s life
  from self-love" — a law of nature that ends life from self-love would contradict
  the very self-love that is the ground of the action. Imperfect duty? Actually, Kant
  classifies suicide as a perfect duty against oneself... hmm. In the Groundwork,
  the suicide example: "It is easy to say that it is consistent with nature that a
  universal law of nature should extinguish the human race through such a propensity;
  but it is impossible that it should be consistent with itself as a universal law
  of nature that it should so extinguish the race. For the very principle which is
  to hold here as a law, namely, that self-love should bring one not merely to preserve
  but also to cultivate one''s talents so as to be fit for every sort of purpose,
  is the ground of the maxim. It is impossible to will that this principle should
  become a universal law of nature, for a nature which contained such a law of nature
  would be impossible for the species in question." So suicide is a contradiction
  in the will case, but it''s a duty against oneself (a perfect duty against oneself,
  in the Metaphysics of Morals classification). The distinction between perfect/imperfect
  duties: duties of omission (negative) are perfect; duties of action (positive) are
  imperfect. Failing to develop talents and failing to help are imperfect duties;
  false promising is a perfect duty.


