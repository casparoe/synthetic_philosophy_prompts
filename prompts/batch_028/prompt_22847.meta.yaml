  and a sculptor had a long argument about a large unfired clay work that the museum
  was considering acquiring. The conservator said the piece was too fragile to move
  and should be impregnated with a clear consolidant before installation; the clay
  would remain in place, but the pores would be filled, the surface would harden,
  and the object would become a clay-resin composite. The sculptor objected that the
  work had been made and contracted as a work in clay, and that once the consolidant
  was introduced the old work would effectively be replaced by a new object. The conservator
  replied that conservation always changes the material state of an object—cleaning,
  varnishing, mounting, and humidity control all do so—and that if every such change
  created a new object, museums could never preserve anything. The sculptor said that
  these examples were not equivalent, because consolidation penetrates the body of
  the work and alters its mechanical and hygric behavior, not merely its surface;
  a condition report, she argued, could note the change but could not make the old
  object continue to exist. The conservator then suggested that one could distinguish
  the material lot from the artwork object: the lot changes, but the titled, exhibited,
  historically continuous work persists. The sculptor answered that this distinction
  may be convenient for cataloguing, but it does not settle what the artist is responsible
  for; if the medium specified in the sale agreement is clay, and the object on the
  pedestal is no longer purely clay, then the museum has acquired something different,
  whatever its continuity of form. They turned to me, because I had a materials background,
  and I could not tell whether the conservator was being pragmatically wise or conceptually
  sloppy, or whether the sculptor was being appropriately exacting or unrealistically
  rigid. Please adjudicate their exchange move by move, saying which claims are defensible,
  which overstate the case, and what distinction or set of distinctions would allow
  the museum to be honest about both the continuity and the alteration involved. Conclude
  with a single line in the form \answer{conservator} or \answer{sculptor}, whichever
  you judge to be more right overall."


