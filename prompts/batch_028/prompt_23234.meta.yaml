  The boundary problem: "who belongs to the demos?" — the demos is the body of citizens
  / the people who have democratic authority. The question is how to draw the boundary
  of the demos. Different principles:

  - **Citizenship principle**: the demos = the citizens.

  - **Territorial principle**: the demos = everyone within the territory.

  - **Control principle** (or "all-affected / all-subjected interests principle"):
  the demos = everyone subject to the coercive power of the state (i.e., everyone
  over whom the state exercises non-consensual coercive control). This includes non-citizen
  residents, and arguably extends to foreign populations under a state''s extraterritorial
  control (e.g., a superpower''s control over other countries).

  - **Shared civic bonds / communitarian principle**: the demos = those who share
  a common culture, language, history, and mutual obligations.


  A really in-the-weeds dialogue: a "control principle" democrat (who argues that
  anyone subject to a state''s non-consensual coercive power must be included in the
  demos, and that this principle is extensionalist — it can push the demos beyond
  the borders of a single state) vs. a "shared civic bonds" theorist (who argues that
  democracy requires a pre-political community of shared obligations and that the
  control principle is too extensionalist and would dissolve the demos into an unworkable
  global body).


  The "in the weeds" tension: the control principle is attractive because it grounds
  democratic inclusion in the moral problem of coercion (you can''t be forced by people
  who can''t vote to stop you), but it''s "explosive" or "extensionalist" — it seems
