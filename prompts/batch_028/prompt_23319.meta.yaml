  The standard result: if you have a sequence of i.i.d. betting opportunities with
  the same odds, and you can choose a fraction f of your wealth to bet each time,
  then your wealth after n bets is W_n = W_0 * Π (1 + f * X_i), where X_i is the random
  return. The log of your wealth is log W_n = log W_0 + Σ log(1 + f X_i). By the law
  of large numbers, (1/n) log W_n → E[log(1 + f X)]. So the long-run growth rate (the
  almost-sure limit of (1/n) log W_n) is g(f) = E[log(1 + f X)]. The Kelly fraction
  f* maximizes g(f). So Kelly betting maximizes the almost-sure long-run growth rate.
  This is the "geometric rationality" or "ergodicity" justification.


  Now, "log utility" means your utility function is U(W) = log W. If you maximize
  expected utility, you maximize E[U(W_n)] = E[log W_n] = log W_0 + n * E[log(1 +
  f X)] (for i.i.d.). So maximizing E[log W_n] is the same as maximizing E[log(1 +
  f X)] = g(f). So in the i.i.d., infinite-horizon case, "maximize expected log wealth"
  and "maximize the long-run growth rate" give the same answer.


  So where''s the difference? The difference is in the interpretation and in non-ideal
