  Actually, there''s a well-known problem: Grice''s speaker meaning (meaning_N) requires
  the speaker to intend to produce an effect in the audience by means of the audience''s
  recognition of that intention. And conversational implicature requires the speaker
  to intend to make it manifest that they are implicating. There''s a known tension:
  if implicature depends on speaker meaning, and speaker meaning already requires
  common ground about intentions, then the "cooperative principle" is doing less work
  than Grice thought. This is a real topic in the philosophy of language (e.g., discussions
  by Levinson, Recanati, Sainati, and others on the distinction between speaker meaning
  and "common ground").


