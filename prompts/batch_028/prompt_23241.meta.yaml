  "Personal Identity." The key points:

  - Personal identity: what makes it true that a person at one time is the same person
  as a person at another time.

  - The traditional view: identity is a further, simple fact (the "non-reductive"
  or "further facts" view).

  - The reductive view: personal identity consists in psychological continuity (connectedness
  plus continuity) — i.e., chains of overlapping psychological connections (memories,
  intentions, beliefs, desires, character traits) with the right kind of cause.

  - Parfit argues that what matters in survival is not personal identity but "Relation
  R" — psychological continuity (and connectedness) with the right kind of cause.
  R can hold in degrees; identity is all-or-nothing.

  - The teletransporter: In the standard case (scan, destroy, reconstruct on Mars),
  R holds (the copy is psychologically continuous with you) but personal identity
  does not (if identity requires the original to continue). Parfit''s point: since
  R holds and R is what matters, you "survive" in the sense that matters, even though
  you don''t survive in the sense of identity. Hence "personal identity is not what
  matters."

  - The one-to-many problem: if the machine creates two copies on Mars, R holds for
  each, but identity can''t hold for both (identity is one-to-one). So identity can''t
  be what matters, because what matters (R) holds even when identity fails.

