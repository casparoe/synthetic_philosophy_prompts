  Is "circular definition" a fair reading of the passage? The passage: "There is no
  force without right, and no right without force. A right without force is impotent...
  force without right is abusive..." Read naively, yes, it looks like a biconditional
  entanglement. A good answer would say: Pascal isn''t defining them in terms of each
  other; he''s describing an empirical / phenomenological fact about the human (fallen)
  condition: right is only effective through force, and force only appears as right
  when it''s backed by right; neither is self-sufficient in this world. The normative
  ground of right for Pascal is God (the divine order), which is why the interdependence
  is a symptom of the Fall and why human institutions (and the "première fondation")
  can''t self-justify. Also, the distinction: "force without right is abusive" is
  a normative claim (force needs right to be legitimate), while "right without force
  is impotent" is a descriptive claim (right needs force to be effective). So the
  two halves of the passage are asymmetric: one is descriptive, one is normative.
  That''s a really in-the-weeds point, and it dissolves the "circular definition"
  worry: the circle is empirical (effectiveness) on one side, and normative (legitimacy)
  on the other, and the ultimate ground is God.


