  Skolem''s paradox: ZFC proves the existence of a countably infinite set (e.g., the
  set of natural numbers), and ZFC is consistent (assuming so), yet every model of
  ZFC has a countable domain (from the external viewpoint) — by the Löwenheim–Skolem
  theorem, if ZFC has an infinite model, it has a countable model. So the "reals"
  of the model, which the model believes are uncountable (the model satisfies "the
  reals are uncountable"), are externally countable. The resolution: countability
  is not absolute — it depends on which sets of pairs (which subsets of ω×ω, i.e.,
  which countable sets) the model contains. The model lacks the bijection from ω to
  its reals, because that bijection is not an element of the model.


  Common subtle confusions a student''s answer might make:

  - Confusing the model''s notion of "countable" with the external notion.

  - Claiming the paradox shows ZFC is inconsistent (wrong).

  - Claiming the paradox is resolved by saying the model is "wrong about infinity"
  — somewhat off-target.

  - Misattribution: crediting the paradox to Gödel rather than Skolem, or thinking
  it arises from the completeness theorem rather than the downward Löwenheim–Skolem
  theorem. Actually, the paradox is usually formulated using the downward Löwenheim–Skolem
  theorem. The completeness theorem is related (the existence of a countable model
  follows from completeness: take a model of ZFC, its theory is a consistent first-order
  theory, and by completeness it has a countable model). In fact, the classical presentation
  is: by the Löwenheim–Skolem theorem (which is proved using completeness), every
  infinite model of a first-order theory has an elementary submodel of any infinite
  cardinality ≤ |language|... hmm, the downward LS says: if M ⊨ T and A ⊆ M is infinite,
  then there is an elementary submodel N ≺ M with A ⊆ N and |N| ≤ max(|A|, ℵ0, |L|).
  The language of set theory is countable, so taking A to be a countable subset (e.g.,
  {∅}), we get a countable elementary submodel. So ZFC, if consistent, has a countable
  model.


  Subtle mistakes a student could make:

  1. Saying "the model''s reals are countable" — externally they are countable, but
  the model thinks they are uncountable. A student might say "the model is countable,
  so its reals are countable, so the model is wrong that Cantor''s theorem holds"
  — this is the conflation: the model correctly believes Cantor''s theorem (internally,
  there is no bijection); the external bijection simply isn''t in the model.

  2. Misattribution: saying the paradox is due to the incompleteness theorem (Gödel)
  rather than Löwenheim–Skolem.

  3. Saying the resolution is that "the model is nonstandard" — that''s more about
  arithmetic. For set theory, the issue is relativity of the notion "set of pairs."

  4. Confusing "countable model" with "the model is countable in the model''s own
  sense" — the model''s ω is actually the true ω (elementary submodels preserve ω,
  since ω is definable... actually, an elementary submodel of a model of ZFC has the
  same ω as the ambient model — the standard naturals — because ω is first-order definable
  (the least inductive set), and elementarity preserves that. So the model''s ω is
  the true ω. But the model''s P(ω) is a proper subset of the true P(ω) — externally,
  the model''s "reals" are a countable subset of the true reals.


  Another subtle point: the model M ⊨ ZFC is countable (externally), but M thinks
  its own universe is uncountable. The "paradox" is: M ⊨ "there is no countable set
  of all the reals," yet externally there is a bijection f: ω → R^M. The resolution:
  f ∉ M.


  Another subtle error: claiming the paradox arises because "first-order logic cannot
  express cardinality." This is partly right in spirit but sloppy — first-order logic
  can express "there exists a bijection between A and B," but it cannot pin down the
  cardinality of the domain. A student might say "first-order logic cannot express
  the concept of countability" — that''s wrong. It can express "X is countable" (there
  exists a surjection from ω onto X). The problem is that "countability" as a property
  of the whole domain is not expressible, and that the quantifiers range over the
  model''s sets, not all sets.


  Another good subtle error: saying the resolution requires the model to be nonstandard
  in its ω. No — ω is absolute between a model and its elementary submodels (indeed,
  between a model of ZFC and any elementary submodel, ω is the same). So a student
