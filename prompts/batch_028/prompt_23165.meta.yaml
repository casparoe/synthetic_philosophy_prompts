  Actually, the Reflection principle has a specific technical form. Let me get it
  right. Van Fraassen''s Reflection principle: "If, after learning that your future
  credence in H will be x, you would have credence x in H, then your current credence
  in H should be x." More precisely, the principle is about conditioning on the event
  that your future credence will be a particular value. The principle says: Cr(H |
  E) = Cr(H | Cr_future(H) = x) = x, where E is the event that your future credence
  in H is x, and E has probability 1 (or is certain).


  The key technical point: the Reflection principle can fail in cases where the event
  of having a particular future credence is *not* evidence-neutral with respect to
  H. For example, if I learn "I will be a 0.9 credal believer in H tomorrow," this
  might be evidence about H (if being a 0.9 believer is correlated with H being true)
  or it might not be (if the 0.9 credence is just a result of a persuasion process
  that''s independent of H''s truth). Van Fraassen''s argument is that the Dutch book
  argument for reflection is flawed because it treats the future self as the same
  agent and mixes up conditional and unconditional credences.


