  Davidson''s triangulation: in "Triangulation" (1999/2001, in "Thinking About Understanding"),
  Davidson argues that a being has thoughts, beliefs, and meanings only if it is in
  a "triangulation" relation with at least one other interpreter and a shared world.
  The argument: to attribute beliefs to a creature, you need to interpret it; to interpret
  it, you need to assume it shares your world (the principle of charity / the principle
  of triangulation). A creature that is "alone" (no other interpreters, no shared
  world) cannot have beliefs or meanings — it''s like a "one-person language" which
  is impossible (following Wittgenstein).


  Applied to LLMs: an LLM is trained on human text. It has "interacted" (in a loose
  sense) with human authors via the training data. But it has no direct contact with
  the world, and it''s not really in a live triangulation with humans (it doesn''t
  share a world, it doesn''t have a body in the world). So a Davidsonian would likely
  say that LLMs don''t have genuine beliefs or meanings — they are simulators of belief-talk,
  not agents with beliefs. The "into the weeds" hook: the LLM is in a weird "one-sided"
