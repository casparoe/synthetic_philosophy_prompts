reasoning_summary: 'Let me think about which domain and type to combine.


  Domains:

  1. The Wrong Kind of Reasons problem (WKR) — a problem in axiology/value theory:
  the problem of whether there can be "wrong-kind" reasons for something to be valuable
  (e.g., the fact that many people admire a painting is, if it gives a reason for
  the painting to be good, a wrong-kind reason — it''s a reason to admire it, not
  a reason for it to be good). Associated with Jackson & Smith''s "From My Own Point
  of View" and the "wrong kind of reason" debate. This is a good domain for the "memo"
  type: an institutional body deciding a case that instantiates WKR. Example: a prize
  committee deciding whether popularity/endorsement should count as a criterion of
  quality in awarding a prize. Or a grant review committee deciding whether "the field
  considers this important" is a legitimate criterion for funding.


  2. Futarchy and governance by prediction markets — forecasting, superforecaster,
  Robin Hanson, futarchy. The memo type fits: a board considering a proposal to allocate
  resources based on prediction markets. Or an interview type: an interview with a
  defender of futarchy.


  3. Intellectual property and ownership of ideas — memo type: a university''s tech
  transfer office deciding on a patent dispute? Or an interview.


  4. Quantum immortality and quantum suicide — memo type is hard; interview type:
  an interview with a defender of quantum immortality? Or a comparison type: compare
  quantum immortality with the "split-brain" problem... Hmm.


  5. Dispositions, finks, and masks — this is a deep topic in the philosophy of dispositions:
  finkish dispositions (dispositions that are lost when the triggering conditions
  arise), masked dispositions (dispositions that are present but masked by interfering
  factors), the problem of "intrinsic vs. extrinsic" grounds of dispositions, the
  "manifestation conditional" analysis, the problem of "masks" in the "dispositional
  essentialism" debate. This is a very "in-the-weeds" topic. The memo type: a materials-science
  standards committee deciding whether a material''s brittleness counts as a property
  it has even if it''s masked... Hmm.


