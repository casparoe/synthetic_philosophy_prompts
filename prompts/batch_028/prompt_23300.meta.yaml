  topic. I know it well:


  - Al-Ghazālī (1058–1111) argued in "The Incoherence of the Philosophers" (Tahāfut
  al-Falāsifa) against the philosophers (Avicenna in particular) that causal necessity
  does not exist in nature; what we perceive as cause-effect is actually a sequence
  (tobāʿi) established by God, who is the true agent. Fire does not burn cotton; God
  creates the burning in the cotton at the moment the fire contacts it.

  - Avicenna''s distinction: causes are either necessary per se (bi-l-ḍarūra) (like
  the cause of the sun''s light), necessary per accidens (bi-l-ʿaraḍ), or contingent
  (bi-l-ījāb). Avicenna held that the sublunary world is contingent and the superlunary
  is necessary.

  - Al-Ghazālī''s argument: we have no knowledge of necessity from induction; induction
  gives only habit (ʿāda). The "necessary" connection is a mental construction.

  - The philosophers'' objection: if God acts freely each moment, why the uniformity?
  Al-Ghazālī responds: God acts according to His wisdom and habit (ʿāda Allāh), and
  the uniformity is a matter of divine custom, not necessity.

  - The kalām atomists (Ashʿarites) held that atoms (jism) and accidents (aʿrāḍ) exist
  for a single moment (dhāt al-faʿt) and are re-created each moment — "sustenance"
  (tanākul) of atoms.

  - Al-Ghazālī''s famous argument: the connection between cause and effect is not
  necessary; the cotton''s burning is a coincidence (muṭābaqa) — actually, he says
  the burning is created in the cotton at the moment of contact; the "connection"
  (taʿalluq) between the two is a habit of the mind.

  - Important nuance: Al-Ghazālī does not deny that the world is uniform; he denies
  the philosophers'' claim to knowledge of necessity. His target is the philosophers''
  claim to have demonstrative knowledge (burhān) of causal necessity. He accepts induction
  for practical purposes but denies it provides demonstrative knowledge.

  - Another nuance: Al-Ghazālī''s occasionalism is sometimes contrasted with the Ashʿarite
  kalām view; he is an Ashʿarite but his position is nuanced — he is not a naive occasionalist;
  he allows that some things are necessary per se (e.g., the relation of the sun''s
  light to the sun''s existence, or mathematical truths).

  - Mulla Sadra and other later philosophers criticized; also, the "sustenance" theory
  (tanākul) of the kalām atomists.

  - A nice weeds point: Al-Ghazālī''s occasionalism vs. Hume''s regularity theory
  — Hume is often said to be similar, but Hume denies any necessary connection at
  all, while Al-Ghazālī affirms a real causal agency (God''s will) at each moment.
  So the difference is: for Hume the "necessary connection" is a projection of the
  mind; for Al-Ghazālī it is a real relation to God''s creative act, though not a
  natural necessity between creatures.

  - Another weeds point: Avicenna''s argument that the philosophers'' causal necessity
  is a matter of the intellect''s grasp of essence (ḍarūriyya), and Al-Ghazālī''s
  response that this is only a matter of habit.

  - Also: the "cotton and fire" example — Al-Ghazālī''s example: when cotton comes
  into contact with fire, the burning is not produced by the fire but by God''s creation
  in it.

  - Another good weeds point: the distinction between "tawallud" (origination/succession)
  and "ijāb" (necessitation) — the philosophers claim that the effect is necessitated
  by the cause; Al-Ghazālī says we only observe succession.

  - Also: the role of "ʿāda" (custom/habit) — both in human cognition (inductive habit)
  and in divine action (divine custom). This is a nice symmetry that makes for a good
  disagreement topic.


