  Hmm, let me think about the common prior assumption more. The common prior assumption
  is an assumption in Aumann''s agreement theorem (and in Bayesian epistemology more
  broadly) that all agents share the same prior probability distribution over the
  state of the world (or at least over the relevant partition). The theorem says:
  if two agents have a common prior, both are Bayesian, and it is common knowledge
  that they disagree (i.e., their posteriors differ), then they cannot have different
  posteriors on an event — in equilibrium, they must agree. So the common prior assumption
  is what guarantees that "no disagreement" is stable. If you drop the common prior,
  then even rational agents with common knowledge of each other''s rationality can
  have persistent, stable disagreements (because they may have different priors).


  So a good "most important implications" prompt: "I''ve been reading about Aumann''s
  agreement theorem and I''m confused about the common prior assumption. Can you describe
  the most important implications of dropping the common prior assumption for how
  I should think about persistent disagreements with colleagues I consider epistemic
  peers?"


