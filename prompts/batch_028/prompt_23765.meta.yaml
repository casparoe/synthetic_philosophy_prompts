  The wrong kind of reasons problem: The idea is that some things seem to be reasons
  for a belief or an attitude, but they''re the "wrong kind" — they''re reasons that
  point to the attitude for non-evaluative / non-truth-directed reasons. Classic examples:

  - "If I believe p, I''ll be happy / it will be good for me" — this is a reason to
  believe p, but not a reason that p is true. It''s a "wrong kind of reason" for belief.

  - In the value domain: "I should value X because valuing X will make me happy" —
  the wrong kind of reason for valuing.

  - In friendship: "I like you because you''re my friend" — circular, wrong kind of
  reason.


  The debate: Are wrong kind of reasons genuine reasons at all, or are they not reasons
  (they''re just motivations / pressures)?


  One side (let''s call them the "orthodox" or "truth-directed" side): Reasons to
  believe must be truth-directed. A consideration is a reason to believe p only if
  it''s evidence for p, i.e., it points to p''s being true. Consequentialist considerations
  (believing p will make me happy) are not reasons to believe p; at most, they are
  reasons to want to believe p, or reasons to resist / manage one''s beliefs. So there
  is no such thing as a "wrong kind of reason" — there''s just a category error, or
  the consideration simply isn''t a reason for the attitude in question.


  The other side (let''s call them the "pluralist" or "deflationary" side): These
  are genuine reasons, but they''re reasons of a different kind. The fact that believing
  p would make me happy is a genuine reason (it''s a consideration that bears on whether
  I should believe p, all things considered), it''s just not a truth-directed reason.
  So "wrong kind of reasons" are real reasons; the mistake is to think there''s only
  one kind of reason for an attitude. Or, they might say, wrong kind of reasons are
  reasons not to believe (they''re reasons to be wary of forming the belief because
  it''s motivated by the wrong considerations).


