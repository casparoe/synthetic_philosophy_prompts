  The dutch book argument for conditionalization (Lewis 1980, "On the Plausibility
  of Probability Kinematics"): the argument goes roughly as follows. Suppose an agent
  has a prior credence function P and receives evidence E. The agent should condition
  on E, i.e., their new credence function should be P(·|E). If the agent instead updates
  to some other credence function Q (that is not P(·|E)), then there exists a Dutch
  book.


  The Dutch book is constructed as follows. The bookie offers the agent a set of bets.
  The bets include:

  - A "prior" bet: at time 1, the agent buys a bet on A at price P(A) for each proposition
  A (this is the "prior" Dutch book, which the agent is already vulnerable to if P
  is incoherent — but we assume P is coherent).

  - A "conditional" bet: at time 1, the agent buys a conditional bet on A given E
  at price P(A|E) (this is a bet that, if E is true, pays off based on the truth of
  A; if E is false, the bet is void).

  - A "posterior" bet: at time 2 (after the agent has updated), the agent sells a
  bet on A at price Q(A) for each proposition A.


  The key insight: if Q ≠ P(·|E), then there exists a proposition A such that Q(A)
  ≠ P(A|E). The bookie can exploit this by buying a conditional bet on A given E at
  price P(A|E) and selling a posterior bet on A at price Q(A) (or vice versa). The
  net payoff is guaranteed to be positive for the bookie (and negative for the agent)
  regardless of whether E is true or false and regardless of whether A is true or
  false.


