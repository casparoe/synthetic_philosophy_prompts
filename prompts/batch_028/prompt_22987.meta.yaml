  The false presupposition: "epistemicism is just supervaluationism plus ignorance"
  / "the two views agree on the semantics of vague predicates and differ only about
  what we can know."


  Why it''s false: The two views disagree about whether borderline cases have determinate
  truth values.

  - Supervaluationism: a vague statement like "this heap has 100 grains" (at the margin)
  is true iff it''s true under all admissible precisifications. At the margin, it''s
  true under some precisifications and false under others, so it''s *neither* true
  nor false (indeterminate). So supervaluationism is committed to *determinacy failure*
  — there is no fact of the matter.

  - Epistemicism (Williamson): there *is* a fact of the matter about each case — there''s
  a sharp cutoff (a specific number of grains where "heap" stops applying) — but it''s
  fundamentally unknowable which case it is. So epistemicism is committed to *bivalence*
  at the margins (each case is determinately heap or not-heap), plus radical ignorance.


  So "epistemicism is just supervaluationism plus ignorance" is wrong, because on
  supervaluationism, the borderline case is *indeterminate* (no fact of the matter),
  whereas on epistemicism, the borderline case is *determinate* (there''s a fact of
  the matter, we just can''t know it). These are substantively different semantic
  commitments, not just a difference in knowledge.


