  The standard view (e.g., Copeland) is that the "original" Church-Turing thesis (every
  effectively computable function is Turing-computable) is a mathematical/a priori
  claim about the concept of effective computability, but the "extended" Church-Turing
  thesis (every physically computable function is Turing-computable) is an empirical
  claim about the physical world. So a paper claiming a physical device computes a
  non-Turing-computable function is not a mathematical refutation of the (mathematical)
  Church-Turing thesis, but it could be an empirical refutation of the extended Church-Turing
  thesis — which is a physics claim, not a math claim.


  So the editorial decision hinges on this distinction. The memo should recommend:
  the paper is not a mathematical refutation (since the CTC is not a theorem that
  can be "refuted" by a physical device), but it is a physics/empirical claim about
  whether the extended CTC is true. So the appropriate handling is: (a) if the journal
  is a math/CS journal, it''s out of scope or should be redirected; (b) the paper
  should be evaluated as a physics/engineering claim about whether the device actually
  works as claimed (i.e., whether it really has the required infinite precision, whether
  it really runs in finite time, etc.), not as a math claim; (c) referees from physics/engineering
  should be brought in to assess the physical feasibility, not just the math.


