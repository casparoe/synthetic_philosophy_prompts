  The species problem: the observation that there is no single definition of "species"
  that fits all cases. Different species concepts:

  - Biological Species Concept (BSC, Mayr): species are groups of actually or potentially
  interbreeding natural populations that are reproductively isolated from other such
  groups.

  - Phylogenetic Species Concept (PSC, Hennig): species are the smallest monophyletic
  groups (clades) with unique diagnostic synapomorphies.

  - Ecological Species Concept (Van Valen): species are adaptive units occupying a
  unique niche.

  - Morphological species concept: species defined by morphology.

  - Genealogical / cohesion concepts (Godfrey-Smith''s "cohesion units").


  In-the-weeds example where concepts disagree:

  1. Ring species: e.g., the Holarctic gull complex (Larus argentatus / L. fuscus)
  or the Ensatina salamanders or the firebellied toads (Bombina bombina) in the Alps.
  Under the BSC, the whole ring is one species (because adjacent populations interbreed,
  forming a chain of gene flow), but the end populations are reproductively isolated
  from each other. Under the PSC, the end populations (and possibly the whole ring)
  form distinct monophyletic clades, so they''d be split into multiple species. So
  the BSC says one species, the PSC says multiple. That''s a clean disagreement.


