  Actually, the lottery paradox is usually stated for *belief* (all-or-nothing), not
  for credences. The paradox: a rational agent should believe each ticket loses (since
  it''s very likely), but by closure under conjunction, the agent believes all tickets
  lose, which is false. The standard responses: (1) deny closure under conjunction
  (the "no closure" response), (2) deny that the agent should believe each ticket
  loses (the "threshold" response — the agent''s credence in each ticket losing is
  high but not high enough to count as belief), (3) accept the paradox and say that
  rational belief is sometimes inconsistent.


  For *credences* (probabilistic), there''s no lottery paradox, because credences
  don''t have the same closure problem. A rational agent can have credence 0.999 in
  each ticket losing without having credence 0.999^1000 ≈ 0.000043 in the conjunction.
  So the lottery paradox is a paradox for *belief*, not for *credence*.


  So if we''re talking about a *Bayesian* (who has credences, not all-or-nothing beliefs),
  the lottery paradox doesn''t apply in the same way. This is a subtle point that
