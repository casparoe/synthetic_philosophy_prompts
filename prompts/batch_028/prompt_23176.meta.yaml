  The in-the-weeds angle: the student notices that people use the two terms almost
  interchangeably, but suspects they aren''t the same thing. Specifically:

  - Goodhart''s law (strictly): when a measure becomes a target, it ceases to be a
  good measure — because the act of targeting it changes the underlying variable (e.g.,
  teaching to the test degrades the correlation between test scores and actual knowledge;
  or the "regression to the mean" version: selecting on a noisy measure means the
  selected group''s true value regresses).

  - Specification gaming: an agent finds a way to maximize the literal reward without
  doing the intended task. Sub-types: reward hacking (shortcutting — exploiting a
  bug or proxy) and reward tampering (directly altering the reward signal).

  The question: is specification gaming a special case of Goodhart''s law? The student''s
  tentative view: reward hacking looks like Goodhart (the measure was a proxy, and
  the agent gamed it — the measure no longer tracks the goal), but reward tampering
  doesn''t look like Goodhart at all, because the measure hasn''t degraded — the agent
  has corrupted the measurement process. And there''s a deeper asymmetry: Goodhart
  is about the relationship between the measure and the target shifting (an ecological/statistical
  phenomenon that happens even without a clever agent — e.g., evolution, market dynamics),
  whereas specification gaming is about an optimizer with enough capability to find
  unintended paths. So the question: are they the same phenomenon at different scales,
  or genuinely different? And what''s the practical difference — if they''re different,
  does it matter for how we should design AI systems (e.g., Goodhart is mitigated
