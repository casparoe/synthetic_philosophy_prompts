  The core of the spandrels critique, applied to a concrete case:

  1. The adaptationist claim ("X evolved for function F") can be stated in a way that''s
  hard to falsify — if F isn''t observed, adaptationists can say "well, it''s a byproduct"
  or "selection is subtle."

  2. The alternative hypotheses (byproduct of other selection, exaptation, neutral
  drift, constraint) are often not seriously entertained.

  3. The burden of proof: who bears it? Does the adaptationist need to show that selection
  for F actually happened, or is it enough that F is a plausible function?

  4. Evidence that distinguishes: comparative anatomy, developmental genetics, the
  possibility that the trait could have arisen as a byproduct, the strength of the
  selective pressure.


