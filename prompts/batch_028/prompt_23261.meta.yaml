  Actually, let me double check my understanding of Skolem''s paradox:

  - First-order Peano Arithmetic / ZFC (Zermelo-Fraenkel set theory) is a first-order
  theory.

  - By the Löwenheim-Skolem theorems, if a first-order theory has an infinite model,
  it has a countable model.

  - ZFC proves that there exist uncountable sets (e.g., the real numbers, or the power
  set of the naturals).

  - So ZFC has a countable model (by Löwenheim-Skolem), but within that countable
  model, the model "thinks" it contains uncountable sets.

  - The paradox: how can a countable model contain "uncountable" sets? The resolution:
  the model''s notion of "uncountable" (no bijection with the naturals, as seen from
  within the model) differs from the external notion. The model is countable from
  the outside (there''s a bijection between the model''s elements and the naturals,
  but this bijection is not an element of the model). So the model contains what it
  calls "uncountable sets" but from the outside, those sets are countable.


  So the joke could play on this: the inside thinks it''s uncountable, the outside
  knows it''s countable. A classic setup.


  A joke:

  - Why did the set inside the countable model break up with the natural numbers?
  Because no matter how many times they tried, they couldn''t find a bijection — from
  the inside. (The outside observer is like "dude, I can see the bijection right here.")


  Or:

  - What''s the difference between an uncountable set and a lie? One of them is only
  uncountable from the inside.


  Or a Q&A joke:

  - Q: Why is the model of ZFC so confident it has uncountably many reals?

  - A: Because it''s countable, and it can''t see the bijection from the outside.


