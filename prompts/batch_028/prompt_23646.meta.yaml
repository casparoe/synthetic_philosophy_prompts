  Bradley''s regress: In "Appearance and Reality" (1893), Chapter 1, "The Regress
  of Relations." The argument: relations are universals (not particular); a relation
  holds between terms; but if the relation is a universal, it can''t be "in" the terms
  without being modified by the terms; the relation between the terms and the relation
  itself requires a further relation, and so on ad infinitum. Bradley concludes that
  relations are "impossible" in the sense that they generate an infinite regress,
  and therefore the only coherent reality is the Absolute — an all-inclusive whole
  in which there are no relations (since relations require distinct terms). The Absolute
  is not a proposition but a concrete whole of experience.


  Also, the unity of the proposition: a proposition unites its parts (subject, predicate)
  in a way that isn''t itself a further relation requiring further unification — this
  is the same problem. Russell, in "The Analysis of Relative Clauses" and other papers,
  engaged with this. Russell''s solution: relations are not themselves terms requiring
  further relations; the relational complex "aRb" is itself a fact, and the relation
  is "in" the complex without being related to the terms by a further relation. Russell''s
  solution is sometimes called "the relational complex" solution. Also, the "no further
  fact" idea: that aRb is a fact, not a fact about a fact about a fact...


