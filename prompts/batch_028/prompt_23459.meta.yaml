  that we come to know only a posteriori. I found the exchange genuinely illuminating,
  but I also found it difficult to follow, and I am trying to work out who was right
  about which specific point. I have tried to reconstruct their argument as faithfully
  as I can, and I would be grateful if you would go through it step by step and tell
  me, for each move, which of the two had the stronger case, and what, if anything,
  both of them were missing.


  The conversation went roughly as follows. The philosopher of language opened by
  saying that "water is H2O" is the paradigm case of a necessary truth known a posteriori:
  the term "water" rigidly designates the watery stuff in the actual world, and the
  term "H2O" rigidly designates the molecular structure that, as a matter of empirical
  fact, is the microstructure of that stuff, so the identity holds in every possible
  world, even though we could only have learned it by looking under the microscope.
  The philosopher of science replied that this argument quietly assumes that "H2O"
  is a rigid designator, but a theoretical term like "H2O" is not obviously a name
  in the Kripkean sense; it is closer to a description, something like "the molecular
  structure that realizes the microstructure of the watery stuff," and if it is descriptive,
  then the necessity of the identity is not secured by the necessity of identity alone.
  The philosopher of language conceded the point in part but replied that Putnam''s
  "water is water" argument shows that natural kind terms are not descriptive in the
  relevant sense, and that once we have that, "H2O" can be treated as a rigid designator
  of a natural kind, so the original argument stands.


  The philosopher of science then shifted ground and said that even if the category
  of the necessary a posteriori is coherent, the examples are suspicious: the case
  of "Hesperus is Phosphorus" is a posteriori and, on the necessity of identity, necessary,
  but it is a trivial case, a mere failure of our knowledge; "water is H2O" is different,
  because it depends on a substantive empirical fact about the actual world, and if
  the world had been different — if the watery stuff had been XYZ — then we would
  have had a different term and a different identity, so the necessity of "water is
  H2O" is really "given the actual world," which is not the same kind of necessity
  as, say, 2+2=4. The philosopher of language replied that this is exactly the point
  Kripke was making: the necessity of the necessary a posteriori is not "absolute"
  in the way mathematical truths are, but it is genuine, and the fact that it is only
  knowable a posteriori is what makes it philosophically interesting, because it shows
  that necessity is not confined to the a priori. The philosopher of science ended
  by saying that this concedes too much, because if the necessity of "water is H2O"
  is really "given the actual world," then the a posteriori element is just a feature
  of our epistemic access, not of the truth itself, and the two dimensions — modal
  status and mode of justification — are not as independent as the philosopher of
  language keeps claiming.


  I would be grateful if you could adjudicate this exchange move by move, telling
  me for each of the five moves which of the two had the stronger case, and then,
  at the end, giving me a brief overall verdict on who was more right, and on what
  both of them were missing.


