  Key points of the responsibility gap literature:

  - Matthias (2004) "The Responsibility Gap: Ascribing Responsibility for the Actions
  of Learning Automata" — the original. The responsibility gap: when autonomous (learning)
  systems act, it becomes difficult to ascribe responsibility to any agent. Because
  the system''s actions are the result of learning/complexity, and no human can fully
  predict or control them, so no one (the programmer, the user, the manufacturer)
  can be held responsible in the usual way.

  - The gap is between what morality requires (that someone be held responsible) and
  what we can actually ascribe responsibility to (the available candidates — programmer,
  manufacturer, user — don''t fit because they didn''t control/predict the specific
  action).

  - Abizadeh (2018) "Autonomous Systems and the Responsibility Gap" — distinguishes
  moral responsibility from legal responsibility. Argues that the responsibility gap
  is primarily about legal responsibility (strict liability) — the gap is that we
  can''t hold anyone legally responsible in a way that tracks their actual moral responsibility.
  Actually, Abizadeh argues that there is no gap for moral responsibility (we can
  still hold people morally responsible in a sense) but there is a gap for legal responsibility.

  - Nyholm (2018) "A Defence of the Responsibility Gap" — defends the claim that there
  really is a responsibility gap, even for moral responsibility. Nyholm argues that
  the responsibility gap is a real problem for moral responsibility: in cases of autonomous
  systems, no one is morally responsible for the harmful outcome, because no one could
  have prevented it (the "could have done otherwise" / control condition fails).

  - The distinction between moral and legal responsibility is central.

  - Strict liability: holding someone liable regardless of fault.

  - The "responsibility gap" thesis: there is a gap between what morality requires
  (someone be responsible) and the available candidates for responsibility.


