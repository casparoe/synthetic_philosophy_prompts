  Let me think about the four types of Goodhart''s law:

  1. Regression: When a proxy is used, the extreme cases are selected, but the proxy
  is only imperfectly correlated, so the selected cases are worse than expected.

  2. Manipulation: When the proxy is gamed by the people being measured.

  3. Displacement: When optimizing for the proxy displaces the true goal.

  4. Breakdown: When the system adapts to the proxy, breaking the correlation.


