  Kim''s causal exclusion argument (from his 1992/1998 work, "Supervenience and Explanation"
  and his book "Physicalism, or Something Near Enough"). The argument:

  1. The physical domain is causally closed (every physical event has a sufficient
  physical cause).

  2. Mental events are non-identical to physical events (non-reductive physicalism).

  3. If a mental event M causes a physical event P, and there is a distinct physical
  event P* that is a sufficient cause of P, then M is not a cause of P (exclusion).

  4. Therefore, mental events are not causes of physical events.


  The in-the-weeds debate: whether premise 3 (the exclusion principle) is valid. The
  standard responses:

  - The "realization" response: M is not distinct from P*; M is realized by P*. So
  there''s no causal competition; M and P* are the same cause at different levels.

  - The "causal role" response: M causes P by playing a causal role that is realized
  by P*.

  - The "downward causation" response: M exerts a genuine downward causal force.


