  The Lewis + convention + evolution of norms domain is rich. In-the-weeds topics:

  - Lewis''s *Convention* (1969): a convention is a solution to a coordination problem,
  and it requires that each agent''s expectation of others'' behavior be common knowledge,
  and that each agent''s preference for conforming given the expectation of others''
  conformity makes conformity rational.

  - Criticism from evolutionary game theory: Skyrms (*Culture and the Evolution of
  Behavior*, 1996; *The Stag and the Helicopter*? no). Skyrms argues that coordination
  games can be solved via evolutionary dynamics without common knowledge. Also, Gärdenfors?
  Suedfeld?

  - The "chicken game" (hawk-dove) vs. "coordination game" (battle of the sexes /
  pure coordination): Lewis''s examples are pure coordination (driving on the right)
  and chicken (the stag hunt is actually a coordination game with risk dominance —
  the stag hunt is a coordination game where the stag is payoff-dominant and the hare
  is risk-dominant).

  - In the weeds: Lewis''s requirement that a convention be "arbitrary" (no non-conventional
  reason for preferring one solution) vs. payoffs that make one solution payoff-dominant
  (in which case it''s not a convention but "right" behavior). The distinction between
  conventions and "non-arbitrary" coordination.

  - Also: the "coordination game" must be a "coordination problem" in Lewis''s sense
  — each agent wants to do the same thing as others, and there''s no independent reason
  to prefer one option. In a chicken game, there is an independent reason.

  - Evolution: norms like "don''t drive on the left" can spread via imitation or learning
  without common knowledge; also, "conventions" can be locally stable but not globally
  (multiple stable states), and "norms" can be enforced by punishment (not just coordination)
  — Lewis''s account is coordination-based, but many social norms are better modeled
  as game theory with punishment (e.g., "norms as equilibria of enforcement games,"
  Ostrom, Fehr & Gächter''s altruistic punishment, "norms as social contracts," etc.).


