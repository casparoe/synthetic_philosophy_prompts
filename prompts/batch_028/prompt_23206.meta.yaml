  Let me reconsider the doomsday argument more carefully, because it''s the most "rationalist
  blog" topic and has very specific technical structure that''s "in the weeds."


  The doomsday argument: If you can randomly sample a human from all humans who will
  ever live, and you find you''re around the 100-billionth human (out of, say, a total
  N), then you should expect N to not be much larger than 100 billion. The key technical
  elements:

  - Reference Class Hypothesis (RCH): the reference class of humans you''re sampling
  from.

  - Self-Sampling Assumption (SSA): you should reason as if you are a random sample
  from the set of all observers.

  - Self-Indication Assumption (SIA): you should reason as if you''re a random sample
  from the set of all observers weighted by number.

  - The "frequentist" vs "Bayesian" versions.

  - The "in-bucket/out-of-bucket" lottery scenario.

  - The "Born-Count" vs "Born-Ratio" (or "ratio" vs "number") versions — the difference
  between the doomsday argument applying to the total number of humans ever vs. to
  the ratio of humans at your time to total.

  - The "normalization" problem.

  - Adam Everett''s "Do the Doomsday Argument" and the "reference class" objections.

  - The "survivorship bias" objection.

  - The "trump card" or "the argument is invalid because of how the sample is selected."


  Actually, a very "in the weeds" and specific doomsday issue is the "reference class"
  problem and the "Born-Count vs Born-Ratio" distinction, plus the "Self-Indication
