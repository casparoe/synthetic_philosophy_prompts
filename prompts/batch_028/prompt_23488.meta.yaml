  The in-the-weeds angle: the "direction of interpretive priority" — in both frameworks,
  when an apparent contradiction arises, one side has to yield. In the scholastic
  framework, the standard resolution is that the demonstrative proof is defective
  (because scripture cannot err) — i.e., the burden is on the philosopher. Galileo
  inverts this: where there is a demonstrative proof, the interpretation of scripture
  must be adjusted — i.e., the burden is on the theologian. But there''s a subtlety:
  Galileo does not claim that demonstrative truth has authority over revealed truth;
  he claims that where there is a demonstrative proof, the literal reading of scripture
  cannot be the intended meaning, because God cannot intend to teach falsehood. So
  the "yielding" is not that scripture yields to nature, but that the interpretation
  of scripture yields to the demonstrative truth. This is a subtle point that a good
  answer should capture.


  Also, the scholastic framework had a subtlety: the "two truths" thesis (that a proposition
  can be demonstrably true in philosophy and demonstrably false in theology) was condemned
  precisely because it would allow a permanent contradiction. The orthodoxy was that
  truth cannot contradict truth; if there seems to be a contradiction, one side''s
  demonstration is defective. But the orthodoxy did not specify which side''s demonstration
  is defective — in practice, the theologians would say the philosophical demonstration
  is defective (because scripture cannot err). Galileo''s move is to claim that, in
  a specific case, the philosophical demonstration is not defective, and therefore
  the interpretation of scripture must be adjusted. This is a radicalization of the
  scholastic principle.


  The 1616 reaction: the Roman theologians did not accept that the Copernican demonstration
  was not defective; they judged the Copernican proposition to be "foolish and absurd
  in philosophy, and formally heretical in theology." This shows that the scholastic
  framework, as applied by the Roman theologians, did not accept the inversion of
  the direction of interpretive priority.


