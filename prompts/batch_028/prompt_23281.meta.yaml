  requirement," on which one simply refuses to make a moral comparison between two
  choices unless the relevant utility series converge; if they don''t, the comparison
  is simply undefined. The second is the "discounting" approach, on which one applies
  a discount factor (e.g., multiply the utility at time t by δ^t for some 0 < δ <
  1) to force the series to converge, and then compares the discounted sums.


