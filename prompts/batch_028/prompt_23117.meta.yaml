  For B: The in-the-weeds question "how do Everett and Bohm each solve the preferred
  basis problem" is genuinely technical. Everett: decoherence selects a stable quasi-classical
  basis in the environment, but the "problem of the preferred basis" is that the bare
  Everettian wave function doesn''t single out the basis in which branches are — decoherence
  gives an approximate answer (einselection), but purists note that decoherence is
  dynamical and approximate, and the "problem" remains as to why we should care about
  quasi-classical branches. Bohm: the wave function has a preferred configuration-space
  structure via the guiding equation; the preferred basis is… in Bohmian mechanics,
  particles have definite positions, and the "preferred basis" problem is dissolved
  because the configuration of particles is the actual state; the wave function guides
  them. But there''s a subtlety: Bohmian mechanics still needs quantum equilibrium
  (the |ψ|² distribution) to recover quantum statistics, and the "problem" of why
  the universe is in quantum equilibrium is analogous to Everett''s problem of why
  we should expect branch weights (the Born rule). So a deep comparison: both theories
  need an extra postulate to recover the quantum statistics / classical appearance:
  Everett needs decoherence + a measure over branches (Born rule problem), Bohm needs
  quantum equilibrium. Both solve definiteness differently: Everett by splitting (all
  outcomes occur), Bohm by selection (only one outcome occurs, guided by configuration).
  This is a really good in-the-weeds comparison that a model can handle without search.


  For C: The in-the-weeds question "Ghazālī vs. Hume on causation — where does the
  ''Hume with God'' reading break down" is also good. Key differences: (1) Motivation:
  Ghazālī is arguing against the falāsifa (Ibn Sīnā, al-Fārābī) who held that the
  world is necessary through God and that causes necessarily produce effects; Ghazālī
  wants to preserve God''s absolute omnipotence and the possibility of miracles /
  resurrection. Hume is arguing from epistemology: we never observe necessity, only
  constant conjunction. (2) Positive vs. negative: Ghazālī has a positive account
  — God is the sole efficient cause, and what we call causes are "āṭā" (instruments)
  or "mu''āqabat" (habitual conjunctions / regular sequences that God has established).
  Hume offers no positive account of what causation is (regularity, or a sentiment).
  (3) The prisoner story: Ghazālī''s argument from habit — a prisoner chained for
  years believes his motion is necessarily limited; he is wrong. This is an argument
  that our sense of necessity is a product of habit — similar to Hume''s "custom,"
  but Ghazālī uses it to argue against the philosophers'' metaphysical claim, not
  merely to limit knowledge. (4) Practical implications: For Ghazālī, occasionalism
  preserves the possibility of God''s direct action (miracles, resurrection, divine
  judgment); for Hume, it undermines induction and the predictability of nature (though
  Hume thinks this is fine — we can''t do better). Also, Ghazālī''s position is a
  claim about reality (a metaphysical thesis), Hume''s is a claim about knowledge
  (an epistemological thesis) — or is Hume''s also metaphysical? Hume is usually read
  as epistemological: we can''t know necessity; some read him as denying objective
  necessity. Ghazālī explicitly denies that secondary causes have any causal power
  (they are not "mufāḍi" — they do not "bring about" anything).


