  Let me think about the classic in-the-weeds distinction:


  1. Indicative conditionals: "If P, Q." Evaluated by conditional probability: assertible
  when P(Q|P) is high. The antecedent is not asserted. Behaves like a probabilistic
  claim.


  2. Counterfactual conditionals: "If P had been the case, Q would have been the case."
  Evaluated by possible world semantics: true when in the closest possible world where
  P holds, Q also holds. The antecedent is not asserted (and is usually known to be
  false).


  Key in-the-weeds differences:

  - Negation: "It''s not the case that if P then Q" (indicative) means "P is likely
  and Q is unlikely given P" — the negation targets the connection. "If P had been
  the case, Q would not have been the case" (counterfactual) means "in the closest
  P-world, Q fails."

  - The "would have" vs. "will" distinction.

  - Indicative conditionals with a known false antecedent: "If the moon is made of
  cheese, then..." — it''s odd to assert an indicative conditional with a known false
  antecedent, because it suggests the speaker takes the antecedent to be possible.
  Counterfactuals, on the other hand, are exactly for known false antecedents.

  - The relationship to material implication: "If P then Q" is not the material conditional,
  because "If it''s raining, then 2+2=4" is true as a material conditional but strange
  to assert (because it suggests the speaker thinks it might be raining).


