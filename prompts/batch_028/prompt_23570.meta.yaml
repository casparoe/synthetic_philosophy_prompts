  This is a real controversy in epistemology: the relationship between pragmatic encroachment
  (DeRose, Stanley & Williamson) and contextualism (Lewis, DeRose''s contextualism,
  Cohen). There''s a genuine question of whether the two are rivals or can be integrated
  (e.g., "contextualist pragmatic encroachment" — some people argue that the contextualist
  semantics of knowledge ascriptions can be combined with pragmatic encroachment,
  while others argue that they are in tension, because contextualism explains the
  puzzles via the shifting standards of ''knows,'' whereas pragmatic encroachment
  says the standard is fixed but what is required varies with stakes/practical interests.
  There is also the "pragmatic explanation" of the data that contextualism explains,
  e.g., the lottery case and the bank cases (DeRose''s bank cases). There''s also
  the question of whether pragmatic encroachment is really a view about knowledge
  or about assertion. Also, the issue of whether the two theories explain the same
  phenomena differently, and the "double counting" problem.


