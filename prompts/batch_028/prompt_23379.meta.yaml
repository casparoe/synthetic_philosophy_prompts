  Let me recall the actual structure of the hole argument precisely:


  The hole argument (Einstein''s "Loch" argument, 1913): Consider a region (the hole)
  where there is no matter. Take a solution with a metric field in the hole. Apply
  a diffeomorphism that is the identity outside the hole but nontrivial inside. You
  get a second metric field that satisfies the field equations (by general covariance)
  and agrees with the first outside the hole but differs inside. If manifold points
  have identity independent of fields (substantivalism), the two solutions describe
  physically distinct situations: the same point has different metric values in the
  two. But general covariance (or the equations) requires that both be solutions,
  and there''s no empirical difference—so either (a) the two are the same physical
  situation (and substantivalism''s claim that points are individuated is false /
  points have no identity), or (b) the theory is radically underdetermined (indeterministic
  in a bad way). Einstein initially accepted the argument (which is why he was stuck
  on a generally covariant theory in 1913), and in 1916 he claimed to have defeated
  it by pointing to point-coincidence structure: the physical identity of points is
  given by the complete set of (point-coincidence) relations among all fields, and
  the two hole models agree on all such relations, so they are the same physical situation.


  Standard modern analysis: The hole argument does not show that general relativity
  is underdetermined, because the two hole models are related by a diffeomorphism,
  and (given the identification of diffeomorphic solutions as the same physical state—i.e.,
  taking gauge seriously) they are the same. The real lesson is about what counts
  as a physical state: an equivalence class of fields under diffeomorphism, not a
  field on a fixed manifold. This is the "gauge" view. Substantivalists respond with
  "moderate substantivalism": the manifold points are real, but the metric field on
  the manifold is not a physical state; rather, the geometry (the equivalence class)
  is. Or "structural substantivalism": what''s real is the structure, not the individual
  points.


