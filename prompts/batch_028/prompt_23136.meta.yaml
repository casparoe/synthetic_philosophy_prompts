  Hmm, wait. Actually, let me recall van Fraassen''s 1984 argument more precisely.
  The sure-thing principle (Satz S) says: if you believe E, then you should evaluate
  acts by the conditional expected utilities given E. Van Fraassen argued that the
  sure-thing principle is too strong: it requires that you have a full conditional
  credence function on every proposition, and it leads to problems. He proposed the
  Reflection Principle (Satz R): if you come to know E, your new credence function
  should equal your old conditional credence function given E. This is a diachronic
  constraint, weaker than the synchronic sure-thing principle.


