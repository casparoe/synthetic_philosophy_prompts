  The common prior assumption (in the context of Aumann''s theorem) says:

  - There is a set of states of the world Ω.

  - There is a probability measure P on Ω (the common prior).

  - Each agent i has an information partition Π_i of Ω.

  - Agent i''s prior on an event E is P(E | [x]_i), where [x]_i is the information
  set containing the true state x.

  - The agents can have different information partitions, so they can have different
  priors on individual events.

  - The common prior is the underlying measure P, not the agents'' individual priors.


  Aumann''s theorem (1976, "Agreeing to Disagree"):

  - If two agents share a common prior P, and it''s common knowledge that they are
  both Bayesian (i.e., they condition on their information), then their posteriors
  on any event E must be the same.

  - More precisely: if it''s common knowledge that the agents have the same prior
  P and are rational, then for any event E, the agents'' posteriors on E are the same.

  - Equivalently: it''s impossible for it to be common knowledge that the agents have
  different posteriors on E.


