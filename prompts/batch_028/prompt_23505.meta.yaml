  The core tension: Hyperbolic discounting is usually presented as a *preference*
  (a time-inconsistent utility function). But akrasia is usually presented as a *failure
  of will* or a *failure of self-control* — a gap between what you judge to be best
  and what you do. So the question is: are these the same thing? Is hyperbolic discounting
  really a theory of preferences, or is it really a theory of choice/self-control?


