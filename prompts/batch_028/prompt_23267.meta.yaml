  The Non-Identity Problem (Parfit, Reasons and Persons, 1984, Chapter 14): when a
  policy decision (e.g., when to have children, or which reproduction policy to adopt)
  changes which people will exist, the people who exist under one policy are not the
  same people who would exist under the other. So a policy that produces a worse world
  (in terms of the welfare of the people who exist) cannot be said to be wrong if
  it doesn''t harm any particular person, because under the alternative, those particular
  people wouldn''t exist at all. This is a "person-affecting" problem: if a policy
  is wrong, it must be wrong for the sake of some particular person. But in the Non-Identity
  case, the people who exist are not worse off than they would be (they wouldn''t
  exist otherwise, or they exist with positive welfare). So the person-affecting view
  has trouble saying the policy is wrong.


  Parfit''s standard example: a woman deciding whether to have a child now (when she''s
  ill, or before recovering) or wait. If she has a child now, the child will have
  a life worth living but somewhat diminished (e.g., due to her illness). If she waits,
  a different child will be born (because of different conception timing) who will
  have a better life. But the first child isn''t harmed by being born now, because
  if she had waited, that first child wouldn''t exist. So it''s not clear that having
  the child now is wrong, even though it produces a worse outcome for the people involved.


  Another standard example: a "diminishing returns" or "resource depletion" policy:
  a country decides to exhaust its natural resources now, producing a population with
  a life just worth living, vs. conserving resources, producing a different population
  with a better life. The first population isn''t harmed (they exist with positive
  welfare, and wouldn''t exist otherwise).


