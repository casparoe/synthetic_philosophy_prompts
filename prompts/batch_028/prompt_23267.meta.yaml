  welfare (so no harm). Weak: the people who exist are identifiable, but their welfare
  depends on the policy in a way that makes them worse off but not "harmed" in the
  relevant sense. Actually, let me get this right.

  - The "suffering-futurity" objection (Parfit): a policy that produces a future with
  many people whose lives are barely worth living is wrong because of the "suffering"
  that will exist, even if no particular person is harmed.

  - The "impersonal" vs "person-affecting" distinction. The Non-Identity Problem is
  a problem for the person-affecting view. Impersonal views (like total utilitarianism)
  can say the policy is wrong because it produces a worse total, but they face the
  "Repugnant Conclusion."

  - The "time-relative" or "timeless" distinction.

  - Parfit''s own view: he argues for an "impersonal" view but is troubled by the
  Repugnant Conclusion.

  - The "no-harm" claim: the people who exist under the worse policy are not harmed,
  because they would not exist otherwise. But some (like John Broome) argue that they
  are "made worse off" in a counterfactual sense, or that there is a "non-identity"
  harm.

  - The "suffering" vs "harm" distinction.

  - The "identity" of persons across different reproduction histories.


