  The "inconsistency" vs. "incompleteness" distinction:

  - Inconsistency: a theory is inconsistent if it proves both a statement and its
  negation. If ZFC is inconsistent, then it proves everything (by the principle of
  explosion), and mathematics is "ruined."

  - Incompleteness: a theory is incomplete if there are true statements that it cannot
  prove. Gödel''s incompleteness theorems show that any consistent sufficiently strong
  theory is incomplete.


  The in-the-weeds point: the possibility that ZFC is inconsistent is a very different
  thing from the possibility that ZFC is incomplete. If ZFC is inconsistent, then
  mathematics is "ruined" (it proves everything). If ZFC is incomplete, then mathematics
  is not "ruined" (there are just some true statements that ZFC can''t prove). The
  "incompleteness" of ZFC is a "feature" not a "bug" (it''s a limitation of any sufficiently
  strong theory), but the "inconsistency" of ZFC would be a "bug" (it would mean that
  ZFC is not a reliable foundation for mathematics).


