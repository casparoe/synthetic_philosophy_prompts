  Frankfurt cases:

  - Harry Frankfurt, "Alternate Possibilities and Freedom," Journal of Philosophy,
  1969.

  - The case: Jones decides to perform an action A. There is a black agent (Black)
  who wants Jones to do A and has set up a mechanism to ensure Jones does A, but the
  mechanism only activates if Jones is about to decide not to do A. Jones decides
  on his own to do A, so Black''s mechanism never activates. Jones could not have
  done otherwise (Black would have forced him), but he seems fully responsible because
  he acted on his own will.

  - This is meant to show that PAP (Principle of Alternative Possibilities) is false:
  one can be responsible for an action even if one could not have done otherwise.

  - The "flicker of freedom" problem (Peter van Inwagen): Frankfurt cases can be modified
  so that the agent has a "flicker" of freedom (the ability to do otherwise) but it''s
  so slight as to be irrelevant to responsibility. This suggests that the ability
  to do otherwise is irrelevant to responsibility, not just that PAP is too strong.

  - Second-order desires (Frankfurt''s hierarchy of desires): Frankfurt also argued
  about what it is to be a person (identification with one''s desires).


