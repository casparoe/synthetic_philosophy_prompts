  frontier, and is symmetric with respect to the disagreement point. K-S picks the
  point on the Pareto frontier that maximizes the ratio of gains over the disagreement
  point (equalizes the relative improvements). So in a situation where the feasible
  set is asymmetric (one person can get a lot more than the other), Nash and K-S give
  different answers.


