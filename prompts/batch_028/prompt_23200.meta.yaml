  The "many boundaries" problem for supervaluationism:

  - Supervaluationism says that a vague predicate P has many precise extensions (precisifications).
  A statement is supertrue (true) if it''s true under all precisifications, superfalse
  (false) if false under all, and indeterminate otherwise.

  - The sorites paradox: for a vague predicate like "tall," there''s no sharp boundary.
  Supervaluationism handles this by saying there are many precise extensions, each
  with a sharp boundary, and "x is tall" is true iff x is tall under all precise extensions.

  - But then, for each precise extension, there''s a sharp boundary (a fact of the
  matter about where the cutoff is). This looks like it re-introduces the very thing
  supervaluationism was supposed to avoid — the sharp boundary.

  - The supervaluationist''s response (the "many boundaries" reply): the precise extensions
  are not the "real" extension; they''re just a tool. What matters is the supervaluation.
  So the sharp boundaries of the precise extensions don''t matter because they''re
  not the actual extension.

  - The objection (the "many boundaries" problem, associated with people like... hmm,
  this is a real debate): the supervaluationist is still committed to there being
  a fact of the matter about which precise extensions are admissible. And the set
  of admissible precise extensions has a sharp boundary too (in the sense that there''s
  a fact of the matter about which precisifications are in the set). So the problem
  is just deferred to a higher level.

  - Higher-order vagueness: "tall" is vague, but so is "vaguely tall." Supervaluationism
  handles this by iterating. But the "many boundaries" problem says that at each level,
  you''re just deferring the problem.


