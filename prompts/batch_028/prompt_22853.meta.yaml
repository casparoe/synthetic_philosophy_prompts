  be a safe Pareto improvement, but it''s so expensive that it''s no longer an ex
  ante Pareto improvement — it actually makes the corporation (or someone) worse off
  in expectation. So the tension: the only Pareto improvement available is unsafe;
  the only safe change isn''t a Pareto improvement for everyone. This is a really
  good in-the-weeds point: under uncertainty, the set of safe Pareto improvements
  can be empty even when ordinary Pareto improvements exist, and making a deal "safe"
  (insuring against the bad state) can destroy its Pareto property.


