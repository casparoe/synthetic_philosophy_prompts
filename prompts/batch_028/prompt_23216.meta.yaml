  The Knobe effect: In the classic vignette, a chairman decides to adopt a new program.
  The program will save the company money but will harm the environment. The chairman
  says, "All I care about is making a profit. Implement the new program." The environment
  is harmed. People judge that the chairman harmed the environment "intentionally"
  much more than they judge that he "helped" the environment intentionally (in the
  help version, where the program saves money but helps the environment, and the chairman
  says he doesn''t care about the environment). The asymmetry: harm is judged intentional
  more than help.


  The in-the-weeds debates:

  1. **The "dual-mechanism" theory** (Machery & Mallon, 2009; Machery, 2013): People
  use different concepts of intention in the harm case (a "causal" concept: the agent
  caused the side effect, so it was intentional) vs. the help case (a "non-causal"
  concept: the agent didn''t desire the side effect, so it wasn''t intentional). This
  predicts that the effect should disappear in cases where the agent''s desire structure
  is made explicit, or in "side-effect" variants where the desire is clear.

  2. **The "knowledge norm" account** (Knobe, 2003; and the "epistemic" account):
  Intentional action requires knowledge. In the harm case, the chairman knows the
  environment will be harmed (and is insensitive to it), so it''s intentional. In
  the help case, the chairman doesn''t know/doesn''t attend to the help, so it''s
  not intentional. The "knowledge" requirement for intentional action.

  3. **The "affect" account** (Greene & Beauchamp, 2001; and the "dual-process" account):
  The Knobe effect is driven by affect/moral judgment, not by a genuine concept of
  intention. People''s moral condemnation of the harm drives the intentionality judgment.

  4. **The "desire" account**: The Knobe effect is driven by the agent''s desire.
  In the harm case, the agent''s desire (to make money) is "consistent with" or "causes"
  the harm, so it''s intentional. In the help case, the agent''s desire is not consistent
  with the help, so it''s not intentional.

  5. **The "side-effect" vs. "means" distinction**: The Knobe effect is strongest
  for "side effects" (unintended consequences). In "means" cases (where the harm is
  a means to the goal), the effect is weaker.

  6. **The "reversal" effect**: Under certain framings (e.g., when the agent is a
  "victim" or when the harm is "trivial"), the effect can reverse or disappear.

  7. **The "two-constraint" account** (Machery & Mallon): The "causal" theory and
  the "non-causal" theory each make a correct prediction in different cases, and the
  Knobe effect is an artifact of the interaction of the two concepts.


