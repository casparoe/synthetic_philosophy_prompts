  Raz''s internal reasons thesis (from "The Theory of Practical Reason," chapter 3,
  "Internal Reasons"): "An agent S has a reason to do A in circumstances C only if
  S has a motivating consideration apt to move him to do A in C." And the subjective
  motivational set: "the set of motivations which S has, together with those which
  he would have if he were a ''normal'' rational agent" — something like that. The
  "normalcy condition": the subjective motivational set includes not just the motivations
  S actually has, but also those S would have if he were "normal" (i.e., had the appropriate
  motivational set — e.g., a person who is depressed and has lost all motivation would
  still have reasons, because if they recovered to normal they''d be motivated). This
  is sometimes called the "fit for purpose" condition.


  Critics:

  - Bernard Williams (internalism about reasons): "There is no such thing as a reason
  for action which is not the satisfaction of some desire, and which could not be
  the reason for an action of an agent with that desire." — I won''t quote this; I''ll
  just paraphrase. Williams''s internalism is related but distinct from Raz''s; Williams
  is more strict (no normalcy condition). I shouldn''t conflate them in the prompt.

  - Michael Smith: "The Problem of Autonomy in Ethics" / "The Moral Problem" — Smith
  criticizes Williams''s internalism.

  - The "psychological accident" objection: that internalism makes the number of reasons
  an agent has depend on the accidents of their psychology (e.g., a person raised
  without moral motivation has fewer moral reasons).

  - The "ad hoc general motivation" / vacuity objection: that the internalist can
  always find some thin general motivation (e.g., "a desire to be healthy" covers
  broccoli; "a desire to avoid future suffering" covers retirement) so the theory
  becomes vacuous — everything is a reason for everyone. This is a real objection
