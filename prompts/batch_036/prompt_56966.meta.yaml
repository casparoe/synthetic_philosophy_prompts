  Draft:


  "I have been reading the rationalist blogosphere since the Overcoming Bias days,
  and I run a small reading group that has spent the last few weeks on superrationality.
  One of our members — call him R — has a firm grip on the idea but applies it with
  a discipline the rest of us lack, and I want to know what he would say about a case
  we have not yet brought him.


  Here are his verdicts on the cases we have already argued through. In each, the
  question was the same: does superrational reasoning license cooperation, and is
  the cooperator being rational or merely sentimental?


  1. Two identical copies of the same decision-making program, one-shot symmetric
  prisoner''s dilemma, each given the other''s source code and each knowing the setup
  exactly: cooperate. R says this is the paradigm case and the only one where the
  argument is airtight.

  2. Two humans who are both excellent reasoners, both know the game, both know that
  the other knows, but who arrived at their reasoning by different routes: defect.
  R says the "same reasoning yields the same answer" premise is doing all the work
  and here it is simply false.

  3. Two copies of the same program, symmetric game, but each copy has been fed a
  different private observation that enters its decision rule: defect (or rather:
  the correlation is broken; whatever each does, the superrational argument does not
  apply). R was emphatic that the symmetry of the payoff matrix is not what matters
  here.

  4. A symmetric game that is not a prisoner''s dilemma — a stag hunt, say — between
  two identical copies: R says superrationality is trivially satisfied and does no
  interesting work; both play the payoff-dominant equilibrium, but a purely individual
  calculation gets you there too.

  5. An asymmetric prisoner''s dilemma between two identical copies: defect. R says
  the copies would agree, but agreement on what? Each would choose the option that
  maximizes its own payoff given the correlation, and those options differ.

  6. Newcomb''s problem, transparent boxes, with a near-perfect predictor: one-box.
  R insists this is the same argument, not an adjacent one, and gets annoyed when
  we call it a different puzzle.

  7. Voting in a national election where your preferred candidate would win or lose
  regardless of your ballot and you are one of ten million similar voters: R says
  do not bother with superrational reasoning; it is a rationalization. He refused
  to say more than that, which is unusual for him.

  8. A one-shot symmetric prisoner''s dilemma against an AI that has been trained
  on a large corpus to imitate your reasoning, where you have read its model card
  and it has read your writing: R said "it depends" and then declined to commit, which
  is the only time I have seen him do so.


  Now the case we want to bring him: two perfect reasoners — genuinely perfect, both
  infallible, both aware of the other''s infallibility — facing a one-shot symmetric
  prisoner''s dilemma, but running provably different decision procedures. Not merely
  different programs that happen to agree: different algorithms, one of which is a
  straightforward expected-utility maximizer over its own payoff conditional on its
  beliefs about the other, and the other of which is a rule-following procedure that
  asks what a certain specified class of agents would all do. A proof exists, and
  both have seen it, that the two procedures agree on every possible input to this
  game. Neither has any private information the other lacks.


  My questions: (a) What is the rule R is actually running, stated so precisely that
  it can be applied to a new case without further prompting? ... (b) At least two
  other rules fit verdicts 1–8 just as well... (c) predict his verdict on the new
  case... (d) name one further case — you design it — that would discriminate between
  the leading candidate rules better than the new case does. And please answer in
  American English."


