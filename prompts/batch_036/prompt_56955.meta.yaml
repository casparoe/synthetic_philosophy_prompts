  finiteness does not... wait, finiteness IS absolute (in well-founded models / transitive
  models), whereas countability is not. Actually careful: finiteness is absolute for
  transitive models; countability is not because the witnessing bijection may lie
  outside the model. There''s a nice conceptual question: why can''t we repair Skolem''s
  paradox by requiring that the model be transitive (Mostowski collapse), and what
  does that show — Löwenheim-Skolem gives countable models but not countable transitive
  models of ZFC (since a countable transitive model would contain... hmm, actually
  countable transitive models of ZFC do exist if ZFC has any... no — countable transitive
  models exist under the assumption that there''s a well-founded model, but ZFC itself
  can''t prove the existence of a countable transitive model of ZFC, by second incompleteness).
  That''s getting technical but it''s the right level of "in the weeds."


