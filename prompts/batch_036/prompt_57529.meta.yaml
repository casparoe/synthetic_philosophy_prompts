  prices, and decades before Lange''s reply that a planning board could simulate the
  Walrasian auctioneer by trial and error. Yet Babbage is an oddly well-placed witness:
  in On the Economy of Machinery and Manufactures (1832) he set out to show how a
  manufacturer must resolve a complex product into its constituent operations, measure
  exactly how much skill each one demands, and price accordingly — the insight later
  attached to his name as the ''Babbage principle'' and cited approvingly by Marx.
  He was simultaneously a compiler of logarithm tables, a designer of a railway dynamometer
  for recording train resistance, and a man who spent a decade trying to persuade
  the British Treasury to fund a machine that could perform arithmetic without human
  intervention — a project the Treasury eventually starved and that was never completed
  in his lifetime.


