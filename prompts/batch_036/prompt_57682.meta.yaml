  Alternatives for Madhyamaka/tetralemma:

  - "The Garden of Forking Paths" (Borges) — short story, well known, but is its plot
  common knowledge? Fairly (the labyrinth, the murder of Albert, the branching times).
  Madhyamaka reading: Ts''ui Pên''s labyrinth as a rejection of... hmm, Borges is
  more about idealism/time.

  - Ted Chiang''s "Story of Your Life"/Arrival — free will/compatibilism; not tetralemma.

  - "Groundhog Day" — rebirth/samsara; a Buddhist reading is also somewhat worn but
  less so than the Matrix, and there''s a good twist: the film''s escape from the
  loop comes through self-perfection and attachment (Connors becomes a better person
  and gets the girl), which is the *opposite* of nirvāṇa (which requires the cessation
  of craving, not its satisfaction). Also: does Phil exist across days? Persistence/personal
  identity with no causal continuity of memory in the world (only Phil retains memory)
  — the tetralemma applied to "does the same person wake up each day?" Nice. And emptiness:
  the loop as a demonstration that nothing has intrinsic nature — each day is dependently
  originated, the groundhog, Rita''s love, etc. Hmm, the "self-perfection → escape"
  reading is common (many Buddhist teachers have used Groundhog Day).

  - Waiting for Godot (Beckett) — tetralemma-friendly: does Godot exist? The tramps''
  endless "let''s go" / "we can''t" — the denial of all four positions. Beckett is
  often read via apophatic/negative theology. Actually a Madhyamaka reading of Godot
  is genuinely interesting and less worn: the play performs the exhaustion of all
  four kotis about Godot (he exists / doesn''t / both / neither), and the characters
  can''t rest in any; the play''s "nothing to be done" opening. But plot common knowledge:
  two tramps wait by a tree for Godot, a boy messenger, Pozzo and Lucky, they consider
  hanging themselves, they don''t leave. That is common knowledge. Good candidate.
  But is Godot + Buddhism worn? There''s some literature ("Beckett and Buddhism" —
  Pål Lykke? there is a book "Beckett and Buddhism" by Pål Lykke). Somewhat niche
  but exists. Hmm.

  - The Truman Show — a Platonist reading again (real world behind the dome), same
  problem as Matrix.

  - "Eternal Sunshine of the Spotless Mind" — memory/identity.

  - Rashomon — multiple contradictory accounts; tetralemma-ish (the murder happened
  one of four ways; the fourth, "neither," etc.). Rashomon + tetralemma is actually
  a nice fit and less worn than the Matrix, though "Rashomon effect" is very well
  known. The plot: a bandit, a samurai''s wife, the samurai (via medium), and the
  woodcutter give four incompatible accounts of the death in the grove. Through Madhyamaka:
  does the event have intrinsic nature? Each testimony posits a self-contained svabhāva;
  the film refuses to adjudicate. But a careful reading must note that the film *does*
  presuppose there''s a fact of the matter (something actually happened), which is
  a realism Madhyamaka wouldn''t grant — the film''s structure is epistemic (we can''t
