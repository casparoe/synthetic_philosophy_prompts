  "My father died in October, and for as long as I can remember he made the family
  watch It''s a Wonderful Life every Christmas Eve. I''ve been asked to write a short
  piece about the film for our town''s historical society journal, and I find that
  the sequence I can no longer watch without difficulty — Clarence''s world, where
  George was never born and Bedford Falls has become Pottersville — is also the sequence
  I least trust philosophically. I''d like a reading of the film through the debate
  about counterfactual history and inevitability, treating it as a genuine counterfactual
  argument rather than a sentimental device. Specifically: is the sequence entitled
  to its conclusion that one man was load-bearing for a whole town, or does it smuggle
  in exactly the ceteris paribus assumptions that make historical counterfactuals
  suspect — holding Potter''s appetite, the run on the bank, and Harry''s war service
  fixed while deleting a single person from a densely connected system? Please bring
  in David Lewis''s account of counterfactuals, on which the nearest world where the
  antecedent holds may require either a small miracle with the laws kept fixed or
  a wholesale change of laws, and say which of these Clarence''s world is, and whether
