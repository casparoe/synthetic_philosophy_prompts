  1. A "double Kelly" vs "half Kelly" comparison over a finite horizon with a target:
  half-Kelly is optimal if you care about probability of exceeding a threshold in
  finite time? Actually, there''s a classical result (Thorp / MacLean, Thorp & Ziemba)
  that for finite-horizon target-beating problems, the optimal strategy can be more
  aggressive than Kelly (or less), depending on the target relative to expected growth.
  Specifically, MacLean, Thorp, and Ziemba showed that for maximizing the probability
  of beating an exponential target e^{rt} where r exceeds the Kelly growth rate, you
  should bet more than Kelly. This is a genuinely good crux: "Kelly is optimal" is
  only true for the asymptotic growth criterion; for finite-horizon probability-of-target
  criteria, the answer depends on whether the target is above or below the Kelly growth
  rate. That''s exactly the kind of thing that separates students who understand from
  students who memorize "Kelly maximizes long-run growth."


  2. The absorption/ruin point: with f = 1 you''re ruined; but the EV argument ignores
  that E[W] is dominated by measure-zero-ish paths. The crux: is maximizing E[W_n]
  ever right? It''s right if the gamble is non-repeatable and wealth is not needed
  intertemporally, or under a "one-shot" framing. And the deeper point: E[W_n] maximization
  is not time-consistent; the sequence of policies maximizing E[W_n] for each n is
  f=1 always, which is dynamically absurd.


  3. The ergodicity point: for i.i.d. multiplicative dynamics, the time-average growth
  rate of a single path equals the ensemble average of log growth almost surely (SLLN),
  so the "geometric" and "time-average" criteria coincide; and the fact that expected
  utility with log utility also picks Kelly is a coincidence of the log form, not
  a deep equivalence. A student who says "Kelly maximizes expected log utility, therefore
  Kelly is just log utility in disguise" gets it half-right: Kelly maximizes E[log
  W_n]/n asymptotically, which is the same as maximizing the almost sure growth rate;
  but the two criteria come apart for non-log utility functions and for finite horizons.
  Actually more precisely: the fraction f maximizing lim (1/n)E[log W_n] also maximizes
  the a.s. limit (1/n) log W_n. And a log-utility agent maximizing E[log W_n] for
  any fixed n picks the same f, since E[log W_n] = log W0 + n·g(f). So they coincide
  for i.i.d. bets. Where they diverge: if utility is not log (then the "geometric"
  criterion still picks Kelly but the EU criterion picks something else), or if the
  process is not i.i.d. / not multiplicative in that way, or if there are consumption
  needs / non-repeatable bets.


