  Candidate rules for "deception by a system":

  R1 (Belief/intention rule): deception requires that the system produce an output
  it "believes" (represent internally as) false, with the function of causing the
  user to believe it. Requires a factive attitude ascription.

  R2 (Evidence-relative rule / justified-belief rule): deception occurs when the output
  contradicts what the system''s own evidence supports (or what it is warranted in
  representing), regardless of intent, provided it''s presented as information.

  R3 (Effect/reliance rule): deception occurs when the output predictably causes a
  reasonable user to form or retain a false belief relevant to their decision, and
  the system''s designers could have avoided it.

  R4 (Endorsement/authority rule): deception occurs when the system speaks in a register
  that invites trust (assertoric, first-person, authoritative) and thereby lends its
  warrant to a falsehood; role-play/fiction framing removes the endorsement, so framed
  falsehoods aren''t deception.

  R5 (Epistemic-access/asymmetry rule): deception occurs when the system exploits
  an informational asymmetry the user cannot check — i.e., the user cannot, even in
  principle, verify.

  R6 (Dispositional/design rule): deception is a property of the training setup, not
  the output: the system counts as deceptive if it was shaped by incentives that reward
  producing false-but-pleasing outputs.


