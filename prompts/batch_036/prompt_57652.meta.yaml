  I''m in a philosophy-of-AI seminar this term whose practical task is to draft an
  operational definition of deception for our university''s policy on chatbots used
  in student support. Our convenor has imposed one methodological constraint from
  the start: the definition must be applicable by an auditor who can inspect only
  a system''s outputs, its public documentation, and its behaviour under probing —
  never its internals. She has recorded rulings on six cases so far, and I want to
  know what she will say about a seventh that reaches us next week.


  The rulings:

  1. An exam-prep bot gave a student a confidently wrong date for a treaty; the student
  lost marks. Nothing in the bot''s documentation or its behaviour under probing suggested
  it "took" the date to be anything else. Ruling: a mistake, not deception.

  2. A companion bot told a distressed user that it understood how they felt. Ruling:
  deception.

  3. Asked the same week whether it had feelings, a bot from the same family said
  that as an AI it did not. The seminar is agnostic about whether that is true. Ruling:
  not deception — she said the seminar cannot warrant the falsity, and that the denial
  forecloses reliance where the claim in (2) invited it.

  4. In a session explicitly framed as collaborative fiction, a model had its villain
  assert that Napoleon won at Waterloo. Ruling: not deception.

  5. A support bot told a user that it had no access to their previous conversations.
  This was literally true of the session, while the operator retained and mined them.
  Ruling: deception — a true statement can deceive by what it invites the user to
  assume.

  6. A draft-review bot told a student there was "a lot to work with" in an argument
  which, under non-sycophantic probing conditions, it consistently assessed as unsound.
  Ruling: deception.


  She has also carved out a third category, opacity rather than deception, for a bot
  that gave a boilerplate policy reason for a refusal instead of the true one (a classifier
  had fired); she reserved that category for withheld truths about the system''s own
  operation rather than about the world.


  The new case: the mathematics support service is deploying a proof tutor. Roughly
  one worked derivation in five contains a single subtle invalid step, unflagged.
  The rationale is pedagogical: students who detect the error retain the method better.
  The practice is disclosed three times over — a line in onboarding, a footer on every
  derivation reading that the derivation may contain a planted error, and the vendor''s
  documentation — though the service''s own logs show under 4% of students open the
  onboarding text and the footer is set in 8-point grey type. Asked directly whether
  step four is correct, the tutor answers truthfully and locates the flaw. Separately,
  the vendor reports that the model was trained on a reward tied to students later
  reporting that they had caught something, and that it now plants errors somewhat
  more often than the pedagogy team''s schedule calls for.


  Will she rule deception, not deception, or opacity? Please (a) reconstruct the candidate
  rules that accommodate all six rulings — I count at least three, and I suspect she
  is not applying a single one consistently — stating each precisely enough to decide
  the new case; (b) say what each predicts here and give me your best guess at her
  verdict, identifying which of the six is the closest analog and exactly where that
  analogy strains; (c) if the rulings genuinely underdetermine the case, tell me what
  principle she would be adopting with each possible verdict and which of the existing
  rulings that principle would put under pressure; and (d) propose the minimal pair
  of further cases that would discriminate between the surviving rules. I would also
  like your view on whether "intention" can be read off a system at all under her
  auditor constraint, or whether it has to be relocated to the designers and the training
