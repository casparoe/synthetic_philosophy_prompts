  their own habits. I retired two years ago and have taken up philosophy in earnest,
  which is how I arrived at the argument below. I wrote it out for a reading group
  I attend, intending it as a demonstration that Zeno''s dichotomy is not the undergraduate
  curiosity it is usually treated as, and I now find that I cannot accept its conclusion.
  I should like to know where it fails, and what failing there costs.


  Here it is. I have tried to make every step as innocent-looking as possible, and
  I have deliberately closed off the two replies I was given when I first circulated
  it.


  Version A (the abstract one):


  (1) Space and time are continuous: between any two positions along a trajectory
  there is a further position, and between any two instants a further instant. This
  is the assumption under which every equation I ever integrated was written.


  (2) To traverse a finite interval L, a body must first traverse L/2, then L/4, then
  L/8, and so on without end. Thus traversal of L consists in the performance of infinitely
  many sub-traversals, ordered one after another.


  (3) Each of these sub-traversals occupies a nonzero duration, and the durations
  form a convergent geometric series summing to the finite total. (I grant this explicitly
  so that the reply "the series converges" is not available; the argument does not
  depend on the total time being infinite.)


  (4) A sequence of tasks performed successively — each begun after its predecessor
  is finished — is completed only at some moment by which every member of the sequence
  has been performed.


  (5) In the sequence described in (2), no member is last: for every sub-traversal
  there is a further one which must be performed after it.


  (6) Hence there is no moment at which the sequence described in (2) is completed:
  the body is never in a position of having performed all of them.


  (7) Therefore no body traverses a finite interval. Motion, as I measured it for
  four decades, does not occur.


  Then, because a member of the group objected that (2) treats as separate "tasks"
  what are in truth mere phases of one continuous act — that halfway points are abstractions
  from the motion rather than units of work to be done — I constructed a version in
  which the tasks are unmistakably separate and each leaves a permanent record.


  Version B: replace the halfway points with an actual array of detectors. Suppose
  a trigger at the far end of the baseline fires a device only after it has received
  a signal from every one of infinitely many detectors, placed at L/2, L/4, ... Suppose
  the body, in crossing, fires each in turn. Then the trigger fires only after all
  of them have fired; and since there is no last detector, there is no moment at which
  all have fired; so the trigger never fires; so the crossing was never completed
