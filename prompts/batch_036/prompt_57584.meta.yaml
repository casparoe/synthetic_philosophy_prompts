  draws lots, and a substitute takes the risk. Actually Lewis''s suggestion: since
  the offender deserves punishment but might get off (e.g., pardons, lotteries), we
  can treat it as a penal lottery where a substitute takes the offender''s place —
  the substitute voluntarily takes the risk of death. Lewis''s analogy is the Vietnam
  draft lottery: some who would deserve to die are given a chance at life via lottery;
  similarly, Christ participates in a penal lottery.


