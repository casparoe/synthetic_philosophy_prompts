  Given the type "Report one''s verdicts on a set of cases and ask what principle
  captures them," here''s my plan:


  Asker persona: someone reading Sidgwick-era SPR methodology (maybe a philosopher
  of science writing about the epistemology of anomalous evidence), reporting their
  own verdicts on a set of cases about when an apparently paranormal coincidence counts
  as real evidence. Verdicts:


  1. A person has a vivid, dated impression of a friend dying in a distant place;
  the friend did die that night, and there''s no ordinary channel of information.
  → Counts as genuine evidence, but weak on its own.

  2. The same, but the impression was written down and sealed before news arrived.
  → Much stronger. Hmm, this makes a nice pair: the sealed note vs. the unwritten
  memory.

  3. A medium conveys a specific name and detail unknown to her, verified later, in
  a sitting where the sitter provided no information, but the medium has been shown
  to have attended social events where sitters gather / has had prior contact. → Doesn''t
  count, because leakage is possible even if not demonstrated. (Key idea: possibility
  of normal explanation vs. demonstrated normal explanation — a "can be explained
  away" principle.)

  4. A card-guessing subject scores above chance over thousands of trials, but the
  protocol was administered by the experimenter who wanted it to succeed, and the
  records are incomplete. → Doesn''t count. Whereas: same effect size over the same
  number of trials, run by an adversarial conjurer who lost a bet... → Counts? This
  is nice — the verdict depends not on the raw statistics but on who had the opportunity
  and motive to fudge, and whether the record is complete. That injects a genuinely
  interesting principle: the evidential weight of a result depends on the "falsifiability
  pressure" / independence of the recording process.

  5. Hard-to-reconcile pair: A mass survey shows that death-coincidences occur far
  more often than chance predicts (base-rate argument), which counts strongly; but
  an individual case of exactly the same type — a person who reports a death-coincidence
  in a survey — counts for nothing on its own, and the person reporting it has no
  way to tell which bucket they''re in. So: aggregate evidence vs individual case
  evidence. That''s a real tension worth the answer''s attention. And it connects
  directly to the census of hallucinations logic.

  6. Another: a phenomenon reported by many independent witnesses across cultures
  and centuries, but always by people with an interest in believing (folklore, religious
  testimony) → I don''t count it. But a phenomenon reported by many independent witnesses
  who are hostile to it (e.g., investigators trying to expose fraud who keep getting
  results) → I count it. Same testimony volume, opposite verdicts. That''s a good
  pair: testimony-weight depends on the witnesses'' prior against.

