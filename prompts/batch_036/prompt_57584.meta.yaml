  Let me design the cases carefully.


  Case A (unwritten death-coincidence): A woman wakes at 3 a.m. with a vivid impression
  of her brother standing at the foot of the bed, wet through; she has heard nothing
  from him in months; he drowned that night a thousand miles away, and the timing
  is independently documented by the ship''s log. Verdict: this is evidence, but weak
  — one case, and I can''t rule out that she reconstructed the timing in memory afterward.


  Case B (same content, but recorded contemporaneously): Identical in content except
  she wrote the impression, dated and time-stamped it, and posted it to a third party
  before any news arrived. Verdict: substantially stronger; and the difference is
  not in the phenomenon at all but in the paperwork. This pair is deliberately meant
  to make the asker notice that weight attaches to the recording process, not the
  experience.


  Case C (medium with a specific verifiable detail, no demonstrated leakage): A sitter
  receives from a medium a name, a place, and a detail (a ring hidden in a lining)
  that only the deceased could have known, and investigators can find no channel.
  Verdict: does not move me much. Not because I think fraud is demonstrated, but because
  leakage, cold reading, and selective reporting are possible, and possibility is
  enough to withhold assent. → Note the principle: "possible normal explanation" defeats,
  without needing to be demonstrated. That''s a distinctive and arguably excessive
  standard.


  Case D (a card-guessing series with the effect size held fixed, but varying who
  recorded it): Same hit rate over the same number of trials — one run scored and
  transcribed by the investigator who staked his reputation on the effect, with gaps
  in the records; another run scored by a stage conjurer who had publicly bet against
  it and kept a sealed duplicate record. Verdict: the first counts for nothing, the
  second counts for a lot. So the weight depends not on the numbers but on who had
  the opportunity and incentive to make them come out.


  Case E (aggregate vs individual — the hard pair): The Society''s survey of some
  seventeen thousand people, in which roughly one in ten reported at least one vivid
  apparitional experience, and in which the number of such experiences coinciding
  with the death of the person seen far exceeded what chance would predict — I take
  that aggregate result to be strong evidence. But any single respondent''s report
  of exactly that kind of coincidence, considered on its own, I take to be worth nothing;
  and the respondent herself cannot tell which of the two descriptions her own case
  falls under. So I hold two verdicts about the same datum, one aggregate and one
  individual, and I can''t see how to state a principle that licenses both. → This
  is the key irreconcilable pair.


  Case F (hostile witnesses vs sympathetic witnesses): A phenomenon attested by dozens
  of independent witnesses who wanted it to be true and had staked something on it:
  doesn''t count. The same phenomenon attested by a smaller number of witnesses who
  were trying to expose it: counts. Verdict note: testimony''s weight varies inversely
  with the witness''s prior in favor.


