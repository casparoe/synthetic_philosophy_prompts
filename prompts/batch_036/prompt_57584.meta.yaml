  I let a merely possible explanation (leakage, never demonstrated) defeat a case.
  → Excellent internal tension: in C a mere possibility of normal explanation defeats;
  in G a well-fitting but non-predictive normal explanation doesn''t. That''s a genuine
  pair the answer must handle. Good — I''ll flag it as one of the tensions.


