  Let me recall carefully:


  Scanlon''s contractualism (What We Owe to Each Other, 1998): An act is wrong if
  it would be forbidden by any set of principles for the general regulation of behavior
  that, as a basis for informed, unforced general agreement, could not be reasonably
  rejected by persons moved to find such principles. Key features:

  - Moral motivation is the desire to justify one''s actions to others on grounds
  they could not reasonably reject.

  - The individualist restriction: claims are assessed individually, not by aggregation.
  A principle''s justifiability is assessed by comparing individuals'' reasons, not
  by summing.

  - Complaints: each person''s reason to reject a principle is their "complaint" under
  it; we compare the strongest individual complaint against a principle with the strongest
  complaint against alternatives.

  - The numbers problem (WWOTEO ch. 5, section on "The Numbers Problem"): Scanlon
  argues that in the standard case (one person vs. five, each of whom would die),
  we must save the five. His argument draws on Kamm: each of the five has a complaint,
  and the one has a complaint too; but the five''s complaints are "distinct" and each
  is as strong as the one''s. Kamm''s argument involves the idea that it would be
  unfair to the many — that each of them has a claim not to be ignored, and once we
  attend to each individually, we can''t simply count the one against the many. Scanlon''s
  own preferred resolution: the many have a complaint, and while complaints aren''t
  aggregated, the presence of the many means the principle that ignores them is reasonably
  rejected... Actually Scanlon frames it via "the argument from Kamm," which says:
  the one''s complaint is matched by the complaint of one of the five; then the remaining
  four have unmatched complaints; hence save the five.

  - Scanlon also considers the case of small burdens (headaches) vs. death: he denies
  that any number of headaches can outweigh a death, because the complaints are not
  comparable in kind — a headache is not a reason of the sort that can be summed to
  outweigh death.

  - "Mere addition"/spectrum cases: Parfit''s "intransitivity" arguments (Reasons
  and Persons, ch. 4 — the "Mere Addition Paradox"; and later "Intransitivity and
  the Mere Addition Paradox").

  - Prioritarianism (Parfit) as an alternative.

  - Contractarianism vs contractualism: Gauthier/Hobbes (Morals by Agreement, 1986)
  — contractarianism grounded in mutual advantage/bargaining, whereas Scanlon''s contractualism
  is grounded in a moralized motivation to justify to others. Students often conflate
  these.

  - Rawls: Scanlon is influenced by Rawls but rejects the "original position" with
  the veil of ignorance (which is aggregative/ex-post in a sense); Scanlon''s is closer
  to Rawls''s "publicity"/"justification to each."

  - "The separateness of persons" — Rawls''s phrase; students often attribute it to
  Nozick (Nozick uses it in Anarchy, State, and Utopia) or Scanlon. It''s Rawls''s
  phrase, in A Theory of Justice: "the distinctive feature of utilitarianism is that
  it does not take seriously the distinction between persons" — the idea that utilitarianism
  applies to society the choice principle for one person. Scanlon''s individualist
  restriction is an expression of this idea.

  - Taurek "Should the Numbers Count?" (1977) — argues we need not save the greater
  number; may flip a coin.

