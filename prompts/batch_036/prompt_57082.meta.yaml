  "Question 3. Scanlon holds that the justifiability of a principle depends on the
  strength of individuals'' complaints against it, considered one at a time rather
  than summed. Explain what this ''individualist restriction'' rules out and why Scanlon
  thinks it is required. Then explain how he accounts for the intuitive requirement
  to save the greater number in a case where each of five people would die if not
  saved and one other person would die. Does his account succeed? Argue for your view."


  Student answer should be genuinely mixed: correct on visible things (states the
  formula for wrongness roughly right, gets the complaints idea right, gets the basic
  contrast with utilitarian aggregation right, mentions Taurek, mentions the headache
  case), with subtle mistakes:


  Mistake 1 (mischaracterizing the ground of the restriction): The student says the
  restriction exists because summing complaints would give too much weight to the
  worst off / or says it''s justified because aggregation is "unfair to the worst-off
  individual." Hmm — actually a nicer subtle mistake: the student says Scanlon''s
  ban on aggregation is a commitment to prioritarianism-like weighting, i.e., that
  contractualism weights complaints so as to favor the worse off, so the theory is
  "prioritarian in spirit." That''s a conflation: prioritarianism is still aggregative
  (it sums a concave transform of well-being); Scanlon''s view is non-aggregative.
  A hasty grader might let it slide since prioritarianism is often presented as the
  alternative to both utilitarianism and non-aggregation.


  Mistake 2 (non-sequitur / over-strong inference): The student argues that since
  Scanlon appeals to Kamm''s argument to justify saving the five, and Kamm''s argument
  matches one of the five''s complaints against the one''s complaint and then says
  the remaining four''s complaints are unmatched, this shows Scanlon does aggregate
  after all — therefore the individualist restriction "does no work" and contractualism
  collapses into utilitarianism in all cases where complaints are of the same kind.
  The subtle error: the move from "quasi-aggregation in same-kind cases" to "collapse
  into utilitarianism," and the failure to note that the restriction still bites precisely
  in the mixed cases (headaches vs. death) which utilitarianism would decide the other
  way. Also the student may mischaracterize Kamm''s argument as a counting/summing
  argument. Also the student might say the restriction "does no work" — but it does,
