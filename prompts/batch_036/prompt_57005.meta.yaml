  Where exactly does it go wrong? Multiple candidate diagnoses:

  - (2) is too strong: it demands knowledge of the selection function as a precondition,
  when what''s needed is only that the inference be sensitive to error — you can bound,
  test, and cross-check the selection function using independent lines (experimental
  replication, ethnoarchaeology, taphonomic experiments, textual sources for some
  periods, physics/chemistry of decay rates). So (3) is false: there *are* independent
  sources of information about the selection function — decay-rate experiments, modern
  analogues, actualistic studies — which are not themselves inferences from the archaeological
  sample. This is the key empirical flaw: (3) claims the selection function is knowable
  *only* from the surviving traces, but taphonomy is largely knowable from laboratory
  and field studies of decay in the present. That''s a false premise, and it''s a
  substantive one.

  - (4)→(5): equivocation between "the estimate relies on the sample" and "the estimate
  is unconstrained by the sample." Circularity here is not vicious; it''s bootstrapping
  with independent constraints.

  - (5)''s claim "the sample is compatible with any number of populations" is a very
  strong underdetermination thesis; the argument needs a weaker version to be plausible,
  and the weaker version doesn''t yield (6).

  - (7)→(8)→(9): scope shift. Even if frequency claims are blocked, existence claims
  and claims about specific practices aren''t: the bias argument blocks inference
  to *how common* something was, not to *that* it happened. A single charred-grain
  pit is biased w.r.t. frequency but perfectly good evidence that grain was stored
  at that place. And (9)''s "nothing about the unobservable past" overreaches: (2)
  was restricted to inferences requiring knowledge of a selection function; many archaeological
  inferences (this is a kiln, this is a granary, this building had a second storey)
  don''t require population-level correction at all. So the slide from "no warranted
  inference about frequency/population properties" to "no warranted inference about
  the unobservable past" is a quantifier/scope shift. Also (9) mentions belief specifically:
  beliefs are inferred not by frequency but by functional interpretation of individual
  finds.

  - Also, the argument equivocates between *representativeness* and *informativeness*:
  a biased sample can be highly informative about the population if the bias is directional
  and understood (e.g., we know the record is biased toward monumental, durable, elite,
  ritual contexts; that licenses negative-existential care but also licenses inferences
  about the elite/monumental/ritual domain itself, which is exactly what most archaeological
  claims about belief are about). So the inference is often to the *biased subpopulation*,
  and is unobjectionable there — the flaw being that (7) treats "not warranted about
  the whole population" as "not warranted at all."


