  Option 1: Dollar auction. Argument that seems to prove that bidding in a dollar
  auction is rational (or that there''s no rational strategy), with a subtle flaw.


  Classic structure: Consider a dollar auction where two bidders. Argument: (1) A
  rational agent must choose the action with the highest expected payoff. (2) After
  you''ve bid 5 cents, bidding 10 cents when opponent is at 5 cents yields... The
  interesting thing about the dollar auction is that the "rational" reasoning is backward-induction-like:
  at any point, if you''re the low bidder at b and the other is at b+1 with b+1 <
  1, then raising to b+2 (or to $1.00) is better than quitting (losing b vs. gaining
  1-(b+2)). So each individual step is locally rational, and yet the whole thing is
  disastrous. That''s an argument that seems to prove that continuing is always rational
  and hence that entering was rational — but then it also proves something absurd:
  that you should be happy to be in a game where you predictably lose money.


  A nice version: (1) It is rational to play a game iff there''s a rational strategy
  available. (2) In the dollar auction, at every node, continuing to bid (up to $1)
  dominates quitting given the opponent''s current bid. (3) So there''s a rational
  strategy: always bid. (4) So it''s rational to enter. (5) But if both enter and
  both follow that strategy, both end up worse off than not entering — indeed the
  total losses exceed $1. (6) A theory of rational choice that licenses a course of
  action guaranteed to make both players worse off is a bad theory. (7) So rationality
  does not require maximizing expected payoff.


  Flaw: step 2''s dominance is conditional and the "always bid" is not a strategy
  but a policy that isn''t a plan; also the argument equivocates between local optimality
  at a node and the existence of a rational plan (the dominance is only against quitting,
  not against a plan; also it ignores that bidding beyond $1 is dominated). Also the
  flaw is in (1)/(6): "guaranteed to make both worse off" — that''s a joint outcome,
  not an individual guarantee; individually, if the other doesn''t enter, you profit.
