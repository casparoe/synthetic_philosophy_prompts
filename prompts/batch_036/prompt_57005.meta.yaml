  me, because it appears to prove far more than I am willing to concede.


  The argument:


  (1) A claim about past belief, and equally a claim about a past institution, is
  an inference from surviving material traces to states of affairs that produced those
  traces and were not themselves preserved.

  (2) Such an inference is licensed only if the mapping from what happened to what
  survived — call it the selection function — is known, at least in broad outline.

  (3) The selection function can be known only from the traces that survived, there
  being by hypothesis no record of what perished.

  (4) Therefore any estimate of the selection function is itself an inference from
  a biased sample to the population that produced it.

  (5) That inference is circular in the damaging sense: whatever error it contains
  leaves no trace in the sample, since a given assemblage is compatible with indefinitely
  many producing populations, each with a different selection function.

  (6) Therefore the selection function cannot be known.

  (7) Therefore, by (2), no inference from the material record to past belief or institution
  is licensed.

  (8) Nothing in (3)–(6) appealed to anything special about belief or institutions:
  the argument turned only on perishability and the absence of an independent record.
