  A research proposal could ask: is there a class of moral compromises where the gains
  from trade are real and yet the trade is impermissible because it changes what the
  parties are (they become complicit, they lose standing, they corrode their own normative
  commitments)? And how do we model the "moral cost" of a compromise that isn''t reducible
  to a utility loss? And a distinct angle: the "gains from trade" model assumes the
  parties'' values are exogenous and the compromise is a one-shot deal, but many compromises
  are repeated and create precedents — the "precedent effect" where a compromise now
