  \ a policy that imposes a small probability of severe harm on many vs. a certain\
  \ moderate harm on all. There's the question of whether risk-weighted EU can be\
  \ applied to \"social\" decisions, and whether individual risk attitudes should\
  \ be respected (ex ante Pareto vs. risk attitudes). A good memo case: a public utility\
  \ / water board deciding whether to install a filtration treatment that removes\
  \ a contaminant carrying a tiny probability of severe illness per person across\
  \ a large population, versus a certain cost; some board members say \"expected cases\
  \ per year is 0.4, so the cost per statistical life saved is absurd,\" others say\
  \ \"each resident gets to be risk-averse about their own odds.\" Plus a wrinkle:\
  \ the same board also runs a lottery-like program.\n\nHmm. But maybe even better\
  \ and more clearly \"in the weeds\": procreative beneficence and liberal eugenics\
  \ + adjudication type. Two friends arguing about embryo selection / IVF PGT for\
  \ a deafness gene, or about selecting for a trait like height or intelligence enhancement.\
  \ The weeds: Savulescu's procreative beneficence (the claim that parents have a\
  \ moral reason to select the child with the best expected life), the \"mere addition\"\
