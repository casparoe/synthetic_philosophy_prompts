  \ when the risk is spread over many people (since applying a group's risk attitude\
  \ to each individual's risk... there's a \"distribution vs. aggregation\" issue).\n\
  \nActually a nice in-the-weeds issue: risk-weighted expected utility theory faces\
  \ the problem that it can recommend different choices for the same gamble depending\
