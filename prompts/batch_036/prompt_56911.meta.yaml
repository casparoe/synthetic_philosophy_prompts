  \ the alternative is nonexistence), the disability critique (the social model of\
  \ disability — impairment vs. disability), Habermas's objection about the \"self-understanding\
  \ of the species\" and the asymmetry between therapy and enhancement — the concern\
  \ that genetic intervention creates a relationship of maker and made that undermines\
  \ the future person's status as an autonomous equal and their ability to see themselves\
