  ---


  You are a political philosopher who works at the intersection of democratic theory
  and measurement — someone who has thought hard about what it takes to turn a contested
  concept like "democracy" into a number that survives argument. Please think carefully
  and work through this step by step before committing to a diagnosis. I am not looking
  for a literature survey or references; I am looking for your own reconstruction.


  **My situation.** I work in the research unit of an organization that publishes
  an annual country score used by two governments and a lending institution to decide
  whether to invoke a rule-of-law conditionality clause. The instrument is small and
  I can describe it exactly: eleven indicators, three of which concern "the rules
  of political competition" — who draws constituency boundaries, who administers and
  adjudicates elections, and who appoints the judges with jurisdiction over those
  two questions. Scores run 0–4 per indicator. The aggregate is not a mean but a minimum:
  a country''s overall score is the score of its weakest indicator, on the theory
  that strengths in one dimension cannot compensate for collapse in another. There
  is also an internal drafting rule, in our style guide since before I joined: a downgrade
  must be justified in language that does not evaluate the policy preferences of any
  party. We are permitted to say what a rule does to the conditions of competition;
  we are not permitted to say whether a party''s program is good or bad.


  Two weeks from now our review committee meets on Central European cases, and I have
  to defend or retract a proposed downgrade. My problem is that a senior colleague,
  whom I respect and who is not a cynic, produced an argument that seems to show the
  entire exercise is impossible — and worse, that if it is possible, it is not what
  we claim to be doing. I have read it maybe thirty times and I cannot find the exit.


  **The argument.**

  (1) A government backslides when it uses its temporary hold on office to change
  the rules of political competition in ways that make it harder for that government
  to be turned out.

  (2) Every government does exactly this. It draws boundaries, sets the electoral
  calendar, defines eligibility, writes the finance and media rules, appoints judges,
  regulators and central bankers to terms that outlast its own, and entrenches whole
  policy domains behind supermajority requirements — always knowing that these choices
  will shape the odds under which it next faces the electorate. Entrenchment is not
  an abuse of governing; it is governing.

  (3) So on (1), every government backslides.

  (4) But some of these entrenchments are praised as democracy-strengthening: locking
  minority protections beyond ordinary repeal, insulating the electoral administration
  from the government of the day, making the central bank independent. Nobody at this
  office would score those as backsliding.

  (5) Therefore the difference between backsliding and ordinary politics cannot lie
  in the act of entrenching, nor in the intention to bind one''s successors, since
  both are present in the praised cases. It must lie entirely in the value of what
  is entrenched.

  (6) But the value of what is entrenched is precisely what the parties dispute. The
