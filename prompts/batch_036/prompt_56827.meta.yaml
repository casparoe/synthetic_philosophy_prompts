  Actually the standard XOR blackmail setup: the attacker sends the letter iff the
  agent would pay it (predicted via a perfect predictor). If you get the letter and
  pay, you lose $1000 but no video. If you get the letter and don''t pay, video released.
  If you don''t get the letter, nothing happens. Since the attacker is a perfect predictor:
  if your policy is "pay," you get the letter and pay → -$1000. If your policy is
  "refuse," you get no letter → $0. So the policy of refusing dominates. But: given
  that you have received the letter (off-diagonal evidence), you might think the conditional
  logic says... The subtlety: conditional on receiving the letter, you know the predictor
  predicted you''d pay; if you''re confident the predictor is perfect, then conditional
  on the letter you''d better pay (because otherwise the video gets released). This
  is the tension between policy-level and act-level reasoning, and it mirrors counterfactual
  mugging.


