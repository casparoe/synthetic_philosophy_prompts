  settlement becomes invisible/non-negotiable; (iii) the thing settled distributes
  benefits/burdens among persons. Under this: the bridge qualifies (whether or not
  intentional); the speed bump qualifies (it removes discretion from the enforcement,
  including the police officer''s judgment — actually this is interesting: it removes
  discretion, which is a political change); air conditioning does NOT qualify directly
