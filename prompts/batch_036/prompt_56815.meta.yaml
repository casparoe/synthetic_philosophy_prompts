  Actually there''s a nice known tension: reference class selection problem (which
  reference class?), and the "self-undermining" issue: if you always defer to the
  base rate about your own reasoning, you can''t ever rationally conclude anything,
  since your inside view of your reasoning is all you have. Also the tension between
  "outside view always" and the fact that the base rate itself is estimated by an
  inside view. Also: the base rate is itself derived from a reference class whose
  membership is judged by inside-view reasoning. And there''s the issue where the
  inside view contains information the base rate lacks (a proof, a diagnosis), vs.
  cases where the inside view is just motivated optimism.


  Candidate principle: the outside view is a prior; the inside view is evidence; the
  weight depends on whether the inside view is independent evidence that the reference
  class doesn''t capture, and whether the inside view was generated by a process correlated
  with the outcome vs. correlated with your desire for the outcome. That''s basically
  Bayesian — and there''s a known literature: "reference class forecasting" (Flyvbjerg),
  "the outside view" (Kahneman), and the problem is the "reference class problem"
  in legal evidence (e.g., the gatecrasher paradox, the proof paradox / statistical
  evidence — Nesson, Ebert, Smith, Pardo & Allen, the "blue bus" problem). Also relevant:
  "defeat of statistical evidence," and "the reference class problem" for direct inference
  (Kyburg, Pollock''s principle of specificity!). Pollock''s specificity principle:
  use the narrowest reference class for which you have reliable statistics. That''s
  a real established concept relevant to "which reference class."


