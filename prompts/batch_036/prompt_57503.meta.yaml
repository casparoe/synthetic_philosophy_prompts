  just is the truth about the intention.

  (4) So in the limit of complete evidence, (1) assigns to the work exactly the meaning
  its maker actually intended, whether or not anything in the work discloses it.

  (5) But that is unacceptable: consider a poem whose author, in letters published
  a century after her death, records that she intended a certain ambiguous line as
  a coded reference to a private quarrel — nothing in the poem''s diction, form, or
  context gives a reader any route to that reference, and readers for a century have
  found something else there. It is simply not plausible to say the poem meant the
  quarrel and that everyone who read it otherwise was wrong.

