  IS the institution of criticism. His distinguishing move: science''s institutionalized
  criticism is directed at claims (results, methods, statistics), not at the field''s
  narrative about itself. Criticism of the narrative is treated not as a scientific
  act but as an act of disloyalty — it is filed under "sociology," "history," "philosophy,"
