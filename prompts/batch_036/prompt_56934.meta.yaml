  Now his thesis in detail:


  Claim 1: The narrative a field tells about its own origins is not an ornament to
  its method; it functions as a template. It tells the apprentice what a contribution
  looks like, which problems are the field''s problems, and what a career arc is.
  In my field the standard narrative begins with one determination, proceeds as a
  relay of named individuals and named instruments, and ends at us; the abandoned
  rival programs appear in it not at all, or as errors corrected.


  Claim 2: This narrative is monumental in Nietzsche''s sense (great moments offered
  as models to the striving person) and it is also antiquarian (the lineage is ours;
  the technique is preserved because it is ours; instruments, methods and journals
  acquire a piety independent of what they currently show). What the natural sciences
  have no institutional home for is the third mode: the critical one, in which a past
  is put on trial, judged, and sentenced, by a person who suffers under it and needs
  to be free of it.


