  Proposed commitments (say, for a reading group / a position statement in a grant
  or a job talk or a "views file" for a seminar):

  1. There are intentions whose content is irreducibly first-person plural — a we-intention
  is not analyzable into a bundle of I-intentions plus beliefs about others. (Searle-ish)

  2. Shared intentional agency is nothing over and above interlocking individual planning
  states that are mutually responsive and mesh in the relevant way. (Bratman-ish)

  3. Groups can be agents: a committee or a corporation can believe, intend, and act,
  and can be rational or irrational in ways that don''t match any member.

  4. But there are no group minds — I don''t think a group has any mental states beyond
  those of its members, and I''m a methodological individualist about explanation.

  5. When people act together, each acquires an obligation to the others to do their
  part, and each has a standing to demand performance and to rebuke defection; this
  obligation isn''t reducible to a moral obligation and doesn''t depend on the joint
  activity being morally good.

  6. Blame and responsibility always attach to individual agents in virtue of their
  own intentions and attitudes; I reject any notion of collective guilt or inherited
  responsibility.


