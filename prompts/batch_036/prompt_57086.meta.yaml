  Draft:


  "I''m finalizing the theory section of a book about how social movements coordinate,
  and my committee wants a one-page statement of my commitments about joint action
  before I go further. Here is what I''m prepared to defend:

  (1) There are intentions with irreducibly first-person-plural content: intending
  that we paint the house is not a bundle of intending that I paint my part plus beliefs
  about what you''ll do.

  (2) For that very reason, I think you can have a we-intention even when, unbeknownst
  to you, the others aren''t participating at all — the state is in your head and
  its being appropriate doesn''t depend on anyone else''s actual attitudes.

  (3) Shared intentional agency, where it exists, is nothing over and above a pattern
  of interlocking individual planning states that are mutually responsive and mesh;
  there is no extra group-level entity.

  (4) Genuine joint action requires that each participant knows the others are participating;
  without mutual knowledge you have at most parallel behavior.

  (5) Groups such as committees and movements can nonetheless be agents in the sense
  that matters for explanation: they can hold positions, act on them, and be rational
  or irrational in ways that no single member is.

  (6) I reject group minds and collective guilt: nothing is believed, intended, or
  done, and nobody is responsible, except in virtue of the states and conduct of individual
