  Option A: Rousseau''s Letter to d''Alembert — a classroom activity for an upper-level
  political theory seminar. The twist: the standard reading of Rousseau is that he
  prefers participation over spectatorship (festival over theater). But a more in-the-weeds
  point is that Rousseau''s objection is not simply moralistic or about content; it''s
  structural: theater requires the assembly of people at a fixed time, in passive
  posture, separated from each other, and it substitutes an artificial, hired representation
  of the people for the people themselves — it "individualizes" the public, making
  them a collection of isolated spectators, whereas a festival makes each spectator
  part of the spectacle. Also Rousseau argues theater''s effect on morals is limited
  by its need to please: "the theater cannot correct morals because it only follows
  them" — plays that satirize vice succeed because the audience already laughs at
  that vice in others. Also his point about the actor''s trade: the actor is "at the
  disposal of the public," he sells himself, he plays roles and thereby loses his
  own character — a "state of trading in one''s person." Also Rousseau''s remark that
  in a monarchy theater is fine/harmless because a monarchy needs subjects to be entertained
  and idle, but a republic needs citizens to be active — theater is a "political"
  institution fit for large states where citizens have nothing to do, whereas in a
  small republic leisure spent in the theater is leisure stolen from public business.
  Also the point about women''s presence creating a new kind of public and turning
  the assembly into a place of display and consumption, and about the corruption of
  Geneva''s youth.


