  \ That's safe, common knowledge from the Lectures on Religious Belief. Also the\
  \ famous point that religious belief has \"no degree of evidence\" — better to paraphrase.\n\
  \nAlso relevant: the \"God exists\" as a grammatical remark, the analogy with \"\
  the Last Judgment\" as a picture that regulates life. And Wittgenstein's contrast\
