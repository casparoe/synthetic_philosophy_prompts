  \ that the theorem might be false. Hmm. That's about proof vs. truth.\n\nBut combine\
  \ with the inconsistency worry: the practice of accepting large cardinal axioms\
  \ / determinacy axioms on the basis of \"no contradiction has been found and they're\
  \ fruitful,\" while refusing to accept, say, naive comprehension on the same basis.\
  \ And the practice of treating consistency strength as a linear ordering (the \"\
  linearity phenomenon\") as if it tracked truth. What does the community presuppose\
  \ when it says \"ZFC + there's a measurable cardinal is consistent\"? It presupposes\
