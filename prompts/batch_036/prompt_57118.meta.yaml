  \ the practice seems to presuppose a non-Humean, single-case chance (a propensity\
  \ built into the machine's construction, prior to and independent of the sequence\
  \ of outcomes), plus Lewis's Principal Principle as the bridge from chance to credence.\
  \ But it also relies on a deterministic PRNG — so the \"chance\" is really epistemic,\
  \ a function of the player's ignorance of the seed and of the machine's internal\
  \ state. And card counting bans reveal the institution's own recognition that the\
  \ chance numbers are not chance numbers at all but idealized credences for the ignorant:\
  \ when someone becomes less ignorant, the casino ejects them rather than admitting\
  \ the odds changed. So the practice is unstable between two readings: objective\
  \ chance (in which case banning counters is bizarre — you can't change the chance\
  \ by banning knowledge) and ideal-agent epistemic probability (in which case the\
  \ regulator's certification is certifying a normative standard for a particular\
  \ kind of agent's credence, and the \"house edge\" is a fact about knowledge, not\
  \ about the world).\n\nGreat prompt content. The deliverable: reconstruct the implicit\
  \ theory of chance/credence; say whether it's coherent; say what it strictly presupposes\
  \ vs. what it merely fits; where it's underdetermined (a subjective Bayesian could\
  \ license the same practice — the PAR sheet just is the house's credence, published\
  \ for regulatory transparency; a frequency view could too, given enough trials);\
  \ and what would have to change if PP were replaced (e.g., if credence should track\
  \ \"total evidence\" rather than chance).\n\nI want to double check factual accuracy\
  \ about slot machine certification. From what I know: Nevada Gaming Control Board\
