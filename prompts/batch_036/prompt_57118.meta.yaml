  \ of the actual global pattern, so you can't \"set\" it by shuffling policy... hmm,\
  \ actually you can affect the pattern.\n\nThe deeper puzzle to pose: if chances\
  \ are Humean (best-system summaries of actual event frequencies), then the theoretical\
