  \ And it's genuinely inconsistent-looking: the church also has heresy trials, doctrinal\
  \ commissions, and creeds formulated in response to disputes (Nicaea) as if precision\
  \ of formulation mattered enormously. So the practice has both poles: enormous fussiness\
  \ about wording (homoousios vs homoiousios!) and enormous tolerance about whether\
  \ the person believes it. That's a beautiful apparent inconsistency for a Wittgensteinian\
  \ analysis. And the \"verdicts\"? No — this is the \"practice presupposes\" type.\
  \ \n\nBut is Wittgenstein's \"religious belief as non-cognitive, shown in life\"\
  \ too tied to needing quotes? I won't quote. I can paraphrase: \"Wittgenstein suggested\
