  \ practice. And a radical view (Yablo? or the \"inconsistency of arithmetic\" view\
  \ — hmm, there's a view associated with... let me not cite) says arithmetic itself\
  \ might be inconsistent.\n\nI think the Wittgenstein/religion one and the PP/slot\
  \ machine one are strongest. Let me consider which best fits \"somewhat in the weeds\"\
  \ and \"meaningful for a model that can't search.\"\n\nThe PP + casino/regulator\
