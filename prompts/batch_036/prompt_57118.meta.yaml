  \nType options:\n- What philosophical commitments a practice/policy/institution\
  \ presupposes\n- Analyze a real historical/current episode through a theory\n- Report\
  \ verdicts on cases and ask what principle captures them\n\nInteresting combos:\n\
  \n1. Principal Principle + \"what practice presupposes\": e.g., actuarial practice,\
  \ or the way insurance regulators calibrate premiums... Or something like the practice\
  \ of \"prediction markets\" or scoring rules (Brier scores) — a scoring rule is\
  \ explicitly mentioned as a possible practice in the type notes. Hmm, the practice\
  \ of proper scoring rules presupposes that credences should track objective chance.\
  \ Or: the practice of a central bank / weather forecaster's calibration requirement.\
  \ Actually a good one: \"Why do professional forecasters get evaluated on calibration\
  \ against base rates, and why does the National Hurricane Center publish probability\
  \ numbers?\" Hmm.\n\nBetter: the practice of \"randomization\" in clinical trials\
  \ — the CONSORT requirement of random assignment plus the requirement that trial\
  \ participants give informed consent about a coin flip. What does randomization\
  \ presuppose about chance? Or, the practice of pre-registered \"chance\" — hmm.\n\
  \nActually a nice, concrete practice: the actuarial/insurance practice of setting\
  \ premiums by relative frequency, and the legal requirement (e.g., EU gender-neutral\
  \ pricing) that prohibits using some predictors even though they correlate. Hmm,\
  \ that's more about fairness.\n\nLet me think about PP: David Lewis's Principal\
  \ Principle says Cr(A | Ch(A)=x) = x — credence should defer to known objective\
  \ chance. Puzzles: it's a priori justified? Why should credence in a proposition\
  \ about the future track a chance fact? Lewis said anyone who violates PP has beliefs\
  \ that are \"inadmissible.\" The competing views: Humean supervenience (chances\
  \ are just summaries of patterns) makes PP look circular/trivial; non-Humean chances\
  \ make PP substantive. Also the \"inadmissibility\" question. Also the conflict\
  \ between PP and \"self-undermining\" chance (Hall's \"wrong kind of reasons,\"\
  \ Meacham; Lewis's problem of undermining futures).\n\nPractice idea: Weather/climate\
  \ forecasters are graded by \"reliability diagrams\" / calibration: forecasters\
  \ must ensure their 70% predictions come true 70% of the time. And the practice\
  \ of the Intergovernmental Panel / nuclear regulator NRC uses frequency-based risk\
  \ assessment with probabilistic risk assessment (PRA). Hmm.\n\nAnother practice\
  \ idea: Lottery odds in public health messaging — \"1 in a million risk\" thresholds\
  \ in regulatory toxicology. Or the FDA's requirement that a drug be shown effective\
  \ at a p<0.05... that's frequentist stats.\n\nA really nice one: the requirement\
  \ that gambling operators and casinos publish \"house edge\" / theoretical RTP (return\
  \ to player) figures for slot machines, and regulators audit machines against that\
  \ published theoretical percentage rather than actual payouts. Slot machines have\
  \ a \"PAR sheet\" giving a theoretical payback percentage. Regulators test the RNG\
  \ and the theoretical payout, not the actual observed payouts, because over short\
  \ runs actual results vary. What does that presuppose about chance? It presupposes\
  \ that there's a fact of the matter about a single machine's chance distribution\
  \ that is not just the long-run relative frequency of its outcomes — otherwise there'd\
  \ be nothing to test except actual payouts. And it presupposes that a bettor's credence\
  \ ought to match that theoretical figure (PP), even though the actual realized frequency\
  \ will differ. And it rules out a subjective-Bayesian view on which \"the chance\"\
  \ just is the house's degree of belief... hmm, actually the house's credence. That's\
  \ a neat inconsistency: the regulator insists the machine has a true chance, but\
  \ the practice of allowing card counting bans / advantage play? Hmm.\n\nEven better:\
  \ there's a genuine tension — casinos publish a theoretical payback percentage as\
  \ if it's an objective property of the machine, yet in practice they treat each\
  \ individual outcome as fixed by the RNG's internal state (deterministic!). Slot\
  \ machines are pseudo-random: a PRNG seeded deterministically. So the \"chance\"\
  \ is really an epistemic artifact of our ignorance of the seed. That is: the regulatory\
  \ practice treats an epistemic probability as though it were objective chance, and\
  \ simultaneously insists that a bettor's credence must defer to it (PP) — which\
  \ under a Humean/epistemic reading of chance is question-begging. And it forbids\
  \ \"advantage play\" that would give the player inadmissible evidence — casinos\
  \ ban card counters precisely because they'd acquire evidence that legitimately\
  \ should shift credence. That's a great, concrete, non-cited practice: card counting\
  \ bans, shuffling machines, \"no advantage play.\" The casino's prohibition of card\
  \ counting is philosophically fascinating: it's an institution enforcing a restriction\
  \ on evidence acquisition to protect the fiction that each hand is chance-governed\
  \ and independent.\n\nHmm, but I should keep the prompt short and focused. Let me\
  \ consider the \"verdicts on cases\" type with PP instead, which might be cleaner\
  \ and more interesting:\n\nCases: \n- A fair coin to be flipped: my credence 1/2.\
  \ \n- A coin that a lab technician tells me is weighted to land heads with chance\
  \ 0.6: credence 0.6.\n- But if I learn the coin is weighted 0.6 heads AND I know\
  \ this particular flip is being done in a strong draft... hmm inadmissible evidence.\n\
  - Sleeping Beauty style? \n- The \"undermining future\" case: a physical theory\
  \ says there's a chance of 0.4 that the next 1000 flips will all be... hmm.\n\n\
  Let me think of verdicts that are hard to reconcile for PP:\n\n(a) Radioactive atom:\
  \ half-life known, chance of decay in next hour = 0.5 → I think credence 0.5. Fine.\n\
  (b) I learn that a machine was built yesterday and the engineer says its chance\
  \ of failing in the first year is 0.1 → credence 0.1. But if instead I learn the\
  \ machine is one of ten identical ones and two of them failed → credence 0.2, not\
  \ 0.1. So I defer to observed frequency over stated chance. Hmm, but that's just\
  \ evidence about what the chance is.\n(c) A coin whose chance of heads is 0.5, but\
  \ I've watched it come up heads 20 times in a row: PP says credence 1/2 for the\
  \ next flip, but I feel some pull toward \"the chance isn't really 0.5.\" This is\
  \ the classic tension — PP says the chance hypothesis and the actual frequencies\
  \ are compatible; the chance hypothesis doesn't get disconfirmed by short-run deviations.\
  \ But intuitively, 20 heads in a row should make me lower my credence in the next\
  \ head (because it's evidence against the chance being 0.5). Lewis resolves this\
  \ by conditionalizing on the whole theory including the chance function; but if\
  \ I've already conditioned on \"chance = 1/2\", further data is inadmissible...\
  \ but the data IS admissible as evidence about which chance hypothesis is true.\
  \ So the resolution: PP applies conditional on the chance hypothesis being known.\
  \ But I don't know it. So PP requires a prior over chance hypotheses.\n\nThis is\
  \ the \"self-undermining\" problem in reverse: PP is only as good as your prior\
  \ over the chances. So: what does PP presuppose? A prior over chance hypotheses.\
  \ And where does that come from?\n\nGood case set for the \"verdicts\" type:\n1.\
  \ A roulette wheel I've inspected: my credence in red = 18/38, exactly the theoretical\
