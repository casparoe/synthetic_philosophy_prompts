  \ dies within a year = 0.0014. If I learn he's just been diagnosed with something,\
  \ I abandon the table immediately. The table's number seems to be about a reference\
  \ class, not about him.\n\nThe pattern to be extracted: maybe I defer to stated\
  \ chances only when I take the chance to be about the individual case in the right\
  \ way (single-case propensity vs. reference class), and my deference is really deference\
  \ to testimony plus a prior over which chance hypothesis holds. And a tension: in\
  \ (1) I hold the chance fixed against contrary evidence; in (5) I let contrary evidence\
  \ overthrow the chance. What's the difference? In (1) the number of observations\
  \ is small relative to the chance; in (5) it's large. So maybe the principle is:\
  \ observed frequencies are evidence about the chance, and PP governs only the last\
  \ step. But then case (1) is fine — 7 reds is weak evidence. But intuitively I hold\
  \ the roulette chance fixed no matter what because I've inspected the wheel's construction.\
  \ Whereas in (5) I doubt the quantum theory? No — I'd doubt the setup being identical.\n\
  \nHmm, this is getting rich. But is the \"verdicts\" type the best combo? The instructions\
  \ say \"Pick whichever type you can combine best with one of the domains.\"\n\n\
  Let me also consider: Wittgenstein on religious belief + \"what practice presupposes.\"\
  \ Wittgenstein's view (from Lectures on Religious Belief): religious belief is not\
  \ a hypothesis about the world, not subject to evidence; the believer and the non-believer\
  \ don't contradict each other in the way two people with rival empirical hypotheses\
  \ do; religious belief is shown in a way of life; \"it isn't a question of my being\
