  \ That's safe.\n\nAlternatively: the practice of \"the axiom of choice is now taught\
  \ as unremarkable, while ZF+¬AC and ZFC both being studied as legitimate foundations\"\
  \ — the practice of relative-consistency results: mathematicians accept that if\
