  \ in the prompt. Let me flesh it out:\n\nPractice: In regulated gambling, a slot\
  \ machine must be tested and certified against a published theoretical payback percentage\
  \ (the \"PAR sheet\"), and the certification tests the RNG and the pay table, not\
