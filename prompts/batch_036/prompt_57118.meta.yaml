  \ it shows the institution policing evidence. Yes, keep it, described generically.\n\
  \nNow, one concern: the domain is \"The Principal Principle and deference to objective\
  \ chance.\" The prompt should engage PP explicitly. I can name it: \"Lewis's Principal\
  \ Principle — that a rational agent's credence in an outcome, conditional on the\
