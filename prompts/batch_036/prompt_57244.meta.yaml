  "I''m three years into a novel about a New Testament historian — working title The
  Harder Reading — whose crisis is methodological rather than moral: she stops believing
  her own tools. I have been reading the literature on the criteria of authenticity
  to get the texture of her discipline right: Käsemann''s 1953 restatement of dissimilarity,
  the Perrin-era confidence, Meier''s careful staging of embarrassment (including
  the fact that he credits the phrase to Schillebeeckx, who apparently never used
  it), Theissen and Winter''s proposal to trade authenticity for plausibility, Porter
  on the criteria''s history, and the memory turn around Allison, with Rodríguez and
  Kirk pushing back on how malleable he thinks recall is. What has struck me, though,
  is not the content but the shape of the argument: it has been running for seventy
  years, the objections are as old as the criteria themselves — Hooker''s point that
  dissimilarity presupposes a knowledge of first-century Judaism and of the early
  church that nobody has, was made early on and never really answered — and yet nothing
  has settled. Both camps publish, both claim the same data, and the field''s own
  historian can''t even keep the periodization straight (Ferda''s complaint about
  the conventional three quests)."


  Paragraph 2: The hypotheses — several, presented as hypotheses, and quite specific:

  (a) the criteria are not independent tests but a partition: multiple attestation
  privileges material the tradition had reasons to keep, dissimilarity privileges
  material it had no reason to keep, so the two are structurally anti-correlated and
  any saying that scores high on one scores low on the other. If true, the real disagreement
  is a suppressed empirical claim about the preservation dynamics of oral tradition
  that nobody has measured.

  (b) the criteria are borrowed evidentiary rules — lectio difficilior from textual
  criticism, statements against interest from common law — that work in their home
  domains because of scaffolding (a fixed text and a copyist''s economy; a witness
  under oath with cross-examination and penalties) which the Jesus tradition lacks.
  If so, the dispute is about transfer conditions, not about Jesus.

  (c) atomism vs holism: criteria apply to individual units; the holists want recurrent
  patterns. Maybe the sides are reconstructing different objects — a corpus of sayings
  vs. a characteristic impression — under one word "authentic," and a good part of
  the fight is verbal about that word (binary verdict? probability? trajectory?).

  (d) maybe it''s a protective belt: any criterion''s failures are absorbed by adding
  another criterion, and the verdicts track the scholar''s prior portrait (Cynic,
  apocalyptic prophet, sage), so the criteria look like post-hoc weighting.


