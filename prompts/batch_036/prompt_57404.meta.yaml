  "So my roommate is writing his undergrad thesis on free will and I''ve been shamelessly
  borrowing from his reading pile, which is how I ended up spending most of last weekend
  on Galen Strawson''s Basic Argument. My roommate tried to explain it to me first,
  but I think I got the actual version: if you do something, it flows from who you
  are, so to be really responsible for the action you''d have to be responsible for
  the way you are in the relevant mental respects. But you didn''t make yourself,
  so you''d have to be responsible for whatever made you that way, and then responsible
  for that, and so on — basically you''d have to be your own cause. Nothing is. So
  nobody is ever morally responsible in the sense that would make it fair to reward
  or punish them for what they do. Honestly I found it pretty devastating, in a satisfying
  way.


  Here''s what I want to check before I bring it up in his seminar (I''m auditing).
  The argument has to be a determinism argument in disguise, right? The only reason
  actions ''flow from'' character is that the past and the laws of nature fix everything
  downstream. So if there''s real indeterminism in the world — quantum stuff bubbling
  up, or some kind of agent-causal power where I can just make an uncaused choice
  — doesn''t the regress never get started? I keep seeing people say Strawson insists
  the argument is neutral about determinism, but I can''t see how. If my choice isn''t
  determined by anything about me, then it isn''t flowing from my character at all,
  but it also isn''t random, because that''s the whole point of agent causation. Where
  exactly does the Basic Argument bite in that world?


