  moral worth doesn''t require the dutiful storekeeper to be a moral monster.

  - Nomy Arpaly''s "Inverse Moral Worth thesis" — Huck Finn acts from morally good
  desires (a concern for Jim as a person) despite believing he''s doing wrong, so
  his action has moral worth; and the claim that an action has moral worth iff it''s
  right for the reason that makes it right (the agent responds to the features that
  make the act right).

  - Alfred Mele / Michael Smith debates.

  - The "one thought too many" objection (Williams, on the husband saving his wife)
  — that''s a different debate (impartialism) but related.

  - The "moral worth as a matter of degree" view and "counterfactual robustness":
  an action has moral worth only if the agent would have done the right thing across
  nearby possibilities — the counterfactual-sensitivity account (e.g., the idea that
  an agent who would have donated anyway only if it were socially praised lacks moral
  worth).

  - Julia Markovits''s "moral worth requires acting from the right-making reasons,
  and those reasons must be the reasons for which the agent acts" and her "saints
  and heroes" argument against Kant''s account.

  - The "accidental rightness" case.

  - The problem of "conscientious wrongdoer": someone who does the right thing but
  from a morally bad motive (e.g., donating to gain leverage over the charity).


