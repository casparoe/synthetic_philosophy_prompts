  move — the two-bitser can be made to "misrepresent": if you feed it a fake quarter,
  it registers "heads" wrongly. And the deeper point: there''s no fact of the matter
  whether the device''s state means "quarter" or "US currency" or "metal disc" — the
  content is indeterminate, and which content it has depends on the interpretation
  imposed from outside, i.e., on our interests. Searle''s reply: the two-bitser''s
  content is derivative because it''s assigned by us; but brains have intrinsic content.


