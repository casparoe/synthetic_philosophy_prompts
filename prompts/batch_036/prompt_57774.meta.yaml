  philosophy of science.


  Para 2: Neurath''s epistemology is anti-foundationalist: in the protocol-sentence
  controversy he denied that observation statements are privileged because they touch
  reality directly; they are accepted or rejected by comparison with other statements,
  in the way his mariners rebuild their ship plank by plank at sea. If that is right,
  then a picture-language project is not a naive return to "the given" — the pictogram
  is not an impression. It is one more kind of item in the corpus, warrantable only
  by its place in the whole. This is what the transformation rule institutionalizes:
  Reidemeister''s job was not to copy the data but to reconstruct it under constraints,
  and the reconstruction is answerable to the rest of the museum''s output, to the
  source documents, and to audiences'' responses — not to a pre-linguistic given.


  Para 3: The first rule of Isotype — greater quantities shown by more same-sized
  signs, never by a bigger sign — is usually explained as a perceptual matter: scaled
  figures invite the question whether what is being compared is height, length, or
  area, while repeated signs each standing for a fixed quantum can be counted. That
  explanation is right but incomplete. Repetition also converts a magnitude into a
  plurality, and thereby keeps the sign''s denotation fixed across the chart. A scaled
  pictogram is a symbol whose meaning varies continuously with its size; a repeated
