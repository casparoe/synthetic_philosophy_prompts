  not the content. Charts can be read across language communities, whereas sentences
  cannot be translated without interpretation and dispute; but what is read is not
  a proposition. That, I think, is why Neurath''s project is a better fit with his
  physicalism than it looks: the unity of science he wanted was a unity of statements
  in an intersubjectively checkable jargon, and Isotype was never going to supply
  that. It supplied something else — a shared object of attention around which statements
  could be made, checked, and argued about. The epistemic unit is still the statement;
