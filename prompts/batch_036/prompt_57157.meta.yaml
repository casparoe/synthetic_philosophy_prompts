  is itself a product of the very reasoning she has been told to discount. If D. really
  treats A.''s conclusion as equally trustworthy, then she must also treat A.''s assessment
  of the argument as equally trustworthy, and A. assesses it as sound; likewise she
  must regard as equally trustworthy the judgment of every other careful person who
  agrees with A. D.''s position, he said, is not modesty but a refusal to use the
  only instrument she has, and if she is prepared to abandon that instrument on the
  strength of a bare difference of opinion, she cannot explain why she trusted it
  in the first place.


