  Retired clinical chemist here — 35 years running a hospital lab, now reading philosophy
  of medicine for fun and getting more confused the further I go.


  The debate I want you to diagnose is naturalism vs. normativism about disease. As
  I understand it: Boorse and the naturalists say disease is a value-free biological
  fact — a statistically subnormal part-function relative to a reference class of
  your species, age and sex, where "function" means what the part typically does that
  helps survival and reproduction. The normativists say that''s a trick: you already
  smuggled in values by choosing which functions to count and by treating survival
  and reproduction as the goals, and anyway the same deviation is a disease in one
  setting and a mere difference in another. Wakefield tries to split the difference
  with harmful dysfunction — a factual evolutionary-failure half plus a value half.
  Nobody has moved anybody for decades.


  Here''s the thing I keep coming back to from my old job, and it''s why I suspect
  both sides are arguing past each other. In the lab we never said "disease." We said
  "outside the reference interval," and the reference interval was, literally, the
  central 95 percent of results from whatever reference population we''d picked. Pick
  healthy blood donors and by construction 1 in 20 of them is abnormal. Switch assay
  manufacturer, or reharmonize, or stratify by age, or use a reference group of endurance
  athletes instead of the general population, and the same number from the same patient
  moves from one side of the line to the other without the patient changing at all.
  And for the markers that actually drive diagnoses, we''ve mostly stopped using healthy-population
  distributions and use decision limits set by committees weighing outcomes — the
  HbA1c cutoff for diabetes, eGFR thresholds — where the number sits on a smooth risk
  curve and the committee has to say how much over-diagnosis and how much missed disease
  they''re willing to accept.


