  \ ballot as \"just dictatorship in disguise\" — consistent with the \"no dictator\"\
  \ rule.)\n4. Approval voting with 3 candidates: fine. (Approval voting isn't strategy-proof\
  \ — it's manipulable — so a \"no manipulability\" rule would reject it. So this\
