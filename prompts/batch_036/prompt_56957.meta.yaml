  \ rule on single-peaked preferences over a 1-D budget line: fine. (Strategy-proof,\
  \ non-dictatorial.)\n6. A rule that is strategy-proof but only onto a 2-element\
  \ subset of a 3-alternative set (range-restricted): rejected? Hmm — the friend might\
  \ reject it as \"not really choosing.\" Actually G-S's \"onto\" condition: a rule\
  \ whose range is a proper subset evades G-S. The friend rejecting a range-restricted\
  \ strategy-proof rule suggests they care about onto-ness / not pre-deciding.\n7.\
  \ Second-order Copeland (NP-hard to manipulate) in a large election: fine — suggests\
  \ they accept manipulability when it's computationally intractable to exploit. That's\
  \ the Bartholdi–Orlin / computational social choice angle.\n8. A tiny committee\
  \ (3 members) using a strategy-proof, non-dictatorial... hmm.\n\nCandidate rules\
  \ that fit these verdicts:\n(a) Reject any rule that is (ex ante) a dictatorship\
  \ or mixture of dictatorships — \"no dictator\" rule.\n(b) Reject any rule that\
  \ is manipulable when manipulation is realistically exploitable (size of electorate,\
  \ computational hardness).\n(c) Reject any rule that isn't onto — i.e., that forecloses\
  \ alternatives.\n(d) Reject rules that fail on unrestricted domains but are fine\
  \ on restricted domains (single-peaked) — a domain-sensitivity rule.\n(e) Reject\
