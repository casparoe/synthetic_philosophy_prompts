reasoning_summary: "Let me pick a domain and type. The \"Predict or recommend a verdict\
  \ on a new case from someone's verdicts on earlier cases\" type combined with \"\
  The Principal Principle and deference to objective chance\" could be great. Or \"\
  Whose values should aligned AI serve?\" with the verdict type. Or \"Gibbard-Satterthwaite\
  \ theorem\".\n\nLet me think about which combination is best. The verdict-prediction\
  \ type needs earlier verdicts consistent with multiple rules, and a new case where\
  \ the rules diverge. That's a nice, in-the-weeds setup.\n\nOption A: Principal Principle.\
  \ Someone's credence-setting behavior across cases. Rules: Lewis's Principal Principle\
  \ (chance constrains credence with admissibility), Ismael's \"expert function\"\
  \ version, Meacham's \"undermining\" solutions (chance-defeats-chance), Hall's \"\
  Basic Principle\" (chance should be taken as evidence rather than as a constraint),\
  \ Thauromenophobic... Actually there's a well-known set: David Lewis's Principal\
  \ Principle (PP), Ned Hall's Basic Principle (BP), the \"expert principle\" (Ismael),\
  \ the \"New Principle\" (Hall-Williamson, chance-conditionalized: P(A|chance hypothesis\
  \ & admissible evidence) = ch(A)). Also Vranas's critique, and the \"undermining\
  \ problem\". These are things LLMs know reasonably well — moderately niche but well\
  \ documented. But the \"admissible evidence\" clause is the tricky bit.\n\nHmm,\
  \ but for the verdict-prediction type, we need a person's verdicts on cases. Maybe:\
  \ a friend's credence-updating habits in betting scenarios. Rules: PP, Hall's BP\
  \ (chance as evidence), New Principle (conditionalize on chance hypothesis), plus\
  \ a \"no-defeaters\" rule. New case: a scenario where chance and evidence conflict\
  \ — e.g., a fair-ish coin with a recorded long-run frequency that deviates, or an\
  \ \"undermining future\" scenario: a chance device whose chance says 50% but which\
  \ you've learned will produce a run of heads (via admissible-but-not-inadmissible\
  \ evidence). That's the classic undermining case.\n\nOption B: Gibbard-Satterthwaite\
  \ and strategy-proofness. Rules for verdicts on voting rules. E.g., a committee's\
  \ decisions about which voting systems to adopt in various settings: they approved\
  \ plurality for a 2-candidate race, they rejected it in 3-candidate races, they\
  \ approved random ballot for a tie, they approved a non-dictatorial rule that is\
  \ manipulable because... hmm. The interesting tension: G-S says any non-dictatorial,\
  \ onto, deterministic voting rule with ≥3 alternatives is manipulable. So verdicts\
  \ could be about \"is this rule acceptable\" and rules could be: (a) only care about\
  \ manipulability, (b) care about dictatorship, (c) care about onto-ness/range restriction,\
  \ (d) care about whether manipulation is practically feasible (computational resistance,\
  \ e.g., Bartholdi-Orlin results on second-order Copeland being NP-hard to manipulate),\
  \ (e) care about number of voters (large elections), (f) care about whether the\
  \ domain is single-peaked (where median voter is strategy-proof). These are all\
  \ things an LLM knows. The new case: a rule on a restricted domain (single-peaked\
  \ preferences) with 3 alternatives and 5 voters — strategy-proof but dictatorial?\
  \ Hmm.\n\nOption C: Universal healthcare vs market-based medicine. A health policy\
  \ board's verdicts. Rules: prioritarianism vs sufficientarianism vs egalitarianism\
  \ vs cost-effectiveness/QALY thresholds; the \"rule of rescue\". Interesting but\
  \ maybe more applied-ethics-standard.\n\nOption D: The competitiveness constraint\
  \ and alignment tax. Verdicts from a hypothetical AI lab's decisions about how much\
  \ safety work to do. Rules: relative slowdown vs absolute delay, race dynamics,\
  \ etc.\n\nOption E: Whose values should aligned AI serve — value aggregation, liberal\
  \ neutrality. Verdicts about which aggregation a company/policy body adopts. Rules:\
  \ utilitarian aggregation, Rawlsian maximin, liberal neutrality (refraining from\
  \ adjudicating conceptions of the good), contractualism, \"reflective equilibrium\
  \ of humanity\", CEV-ish. Nice.\n\nI think Option A (Principal Principle) with the\
  \ verdict-prediction type is quite in-the-weeds and interesting, but risk: the person's\
  \ verdicts must be about credences in chance-conflict scenarios, which can get technical.\n\
  \nOption B (G-S) is also strong. Let me think about what makes for the best prompt:\
  \ earlier verdicts jointly consistent with multiple plausible rules, and a new case\
  \ where rules diverge.\n\nLet me draft Option B more concretely.\n\nSetup: I'm on\
  \ a committee (or my friend, a social choice theorist) who gives verdicts on whether\
  \ a voting procedure is \"acceptable\" for various elections. Their verdicts:\n\
  1. Plurality in a 2-candidate race with 5000 voters: fine.\n2. Plurality with 3\
  \ candidates, 5000 voters: not fine — but the reason given? They just say \"not\
  \ fine.\"\n3. Random ballot (pick one voter at random, use their top choice) for\
  \ a 3-way race: not fine (it's dictatorial in the relevant sense... actually random\
  \ ballot is anonymous and neutral but it's dictatorial-in-expectation? Random dictatorship\
  \ is strategy-proof! Random dictatorship satisfies strategy-proofness in the ex-ante\
  \ sense; Gibbard's theorem extends to randomized rules — any strategy-proof random\
