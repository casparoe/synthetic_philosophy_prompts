  \ 5 alternatives with an even number of voters and a tie-break rule that favors\
  \ the incumbent\" — is the tie-break a violation of neutrality (rule e rejects),\
  \ or does single-peakedness save it (rule d accepts)? Hmm.\n\nOr: a strategy-proof,\
  \ non-dictatorial, onto rule on a restricted domain (single-peaked) but where the\
  \ domain restriction is imposed administratively — i.e., voters whose true preferences\
  \ are not single-peaked get excluded/misrepresented. Rules diverge: the \"no manipulation\"\
  \ rule says fine (strategy-proof on the domain), the \"no foreclosure/onto\" rule\
  \ says fine too... the \"domain restriction is a form of rigging\" rule says not\
  \ fine.\n\nAlternatively, a cleaner new case: a lottery-based rule — \"sortition\"\
  : pick the winner uniformly at random among all candidates. It's anonymous, neutral,\
  \ onto, non-dictatorial, and immune to manipulation (no way to gain by misreporting\
  \ since reports don't matter — actually it's not even a voting rule based on ballots;\
  \ it's non-responsive). Strategy-proof trivially. The rules diverge: \"no manipulability\"\
  \ → fine; \"onto/anonymity\" → fine; but \"responsiveness to preferences\" → not\
  \ fine. Hmm, but that introduces a new dimension not present in the earlier verdicts,\
  \ so the earlier verdicts wouldn't discriminate. That's actually okay — the prompt\
  \ asks which principle would be adopted either way.\n\nI think I want the new case\
  \ to be a genuinely interesting tension where at least two of the candidate rules\
  \ from the earlier data diverge. Let me design the earlier verdicts so that both\
  \ \"computational-hardness-excuses-manipulability\" and \"domain-restriction-excuses-manipulability\"\
  \ are live, and the new case has a rule that is manipulable only on a restricted\
  \ domain... hmm.\n\nMaybe: new case = a rule used for allocating a small number\
  \ of committee seats (say 5 seats, 12 voters) — approval voting with a manipulability\
  \ that's easy to compute. Or: \"the friend has to judge a runoff: top-two runoff\
  \ with 4 candidates, 30 voters, where a coordinated minority can push a weak candidate\
  \ into the runoff.\"\n\nHmm. Let me reconsider — maybe Option A (Principal Principle)\
  \ is actually more philosophically in-the-weeds and the verdict type maps nicely\
  \ onto \"which principle governs credence in chance.\" Let me draft it.\n\nSetup:\
  \ my friend (or a study group / a book club of rationalists) has settled credences\
  \ in various scenarios. Verdicts:\n1. Told a coin is fair (chance 0.5), no other\
  \ info → credence 0.5 in heads. (PP and BP and New Principle all agree.)\n2. Told\
  \ the coin is fair, AND has seen the first 20 tosses all come up heads → credence?\
  \ A PP person might say 0.5 (chance screens off past outcomes, which are admissible...\
  \ no wait, past outcomes are admissible evidence, so PP says: conditional on chance\
