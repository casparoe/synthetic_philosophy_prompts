  Good. Now the injected niche idea, plus perhaps a second injected element to make
  it harder to regurgitate: the asker''s coinage of three-way taxonomy. Let me name
  it well: they call it "pre-emptive reclassification" or maybe "force suppression"?
  I like: the asker says a friend jokingly calls it "the butler problem": a speaker
  whose role is to convert every incoming utterance into a locution and every outgoing
  one into a report — so no illocutionary act is ever attempted, and hence, on Austin''s
  own account, nothing can misfire, because nothing is launched. The question: is
  that a coherent third category, or does Austin already have the resources (the "insincerity"
  abuse, or the absence of intention, or the requirement of uptake)? And a subtlety:
  if you never attempt an act, are you blameless in Austin''s terms — i.e., does the
  taxonomy of infelicities have a blind spot for omission rather than commission?
  That''s a genuinely interesting philosophical point: Austin''s doctrine of infelicities
  is about acts that are attempted; a life of non-attempts is not an infelicitous
  act but no act at all. Then the novel asks whether that''s a moral category Austin
  misses. Nice.


  Also worth adding the question about whether the ending counts as a felicitous act:
  Stevens''s admission to the stranger on the pier that he gave his best to Lord Darlington
  and now has little left — is that an assertion, a confession, or a perlocutionary
  self-repair? And the resolution to practice bantering: banter is precisely the kind
  of speech whose force is non-serious / parasitic (Austin mentions joking, acting
  on stage as "non-serious" / parasitic language excluded from his account) — so the
  novel ends with the protagonist committing himself to become proficient in the one
  mode Austin explicitly brackets out of his theory. That''s a killer connection!
  Austin in Lecture II (or I) excludes "non-serious" uses — acting on stage, soliloquy,
  jokes, poetic utterance — as parasitic, and says he''ll set them aside (this is
