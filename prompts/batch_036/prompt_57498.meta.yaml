  theorem, (3) I reject expected utility theory''s separability... Hmm, needs care.
  Harsanyi''s aggregation theorem: if individual preferences and social preference
  both satisfy vNM axioms plus Pareto indifference, then the social utility function
  is a weighted sum of individual utility functions. Tensions: someone could hold
  (a) they accept Harsanyi''s result and think it establishes utilitarianism; (b)
  they also hold that interpersonal utility comparisons are impossible; (c) they accept
  Sen''s critique... Actually a genuine tension: Harsanyi''s theorem establishes utilitarianism
  with arbitrary nonnegative weights, and the standard move to equal weights is not
  part of the theorem — so holding (a) the theorem establishes utilitarianism and
  (b) equal weights are required by something like the veil of ignorance is a subtle
  issue (Harsanyi himself used the veil of ignorance to get equal weights). Another
  tension: holding both the theorem''s conclusion and rejecting the vNM expected utility
  axioms for individuals (e.g., because of Allais/ Ellsberg) — then the theorem''s
  hypotheses fail, so it can''t be used. And an apparent tension that dissolves: someone
  thinks Harsanyi conflicts with Arrow''s theorem — but Arrow is ordinal and Harsanyi
  is cardinal, so no contradiction (apparent tension dissolves). That''s a nice one
