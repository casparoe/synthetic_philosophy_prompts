  That''s a great prompt. Let me make sure the physics is right so the prompt''s framing
  is accurate:

  - Maxwell''s demon (1867, in a letter to Tait; published in Theory of Heat, 1871)
  sorts fast/slow molecules, apparently violating the second law.

  - Szilard (1929) engine: one-molecule gas, measurement yields kT ln 2 of work.

  - Landauer (1961): logically irreversible operations (erasure) dissipate at least
  kT ln 2 per bit.

  - Bennett (1982): the demon''s measurement need not be irreversible; the cycle must
  be closed by erasing the memory; hence the second law is saved. Also Bennett noted
  that if the demon has enough memory it can delay erasure indefinitely (and there''s
  debate about whether that saves the demon — it doesn''t, because the memory must
  eventually be reset for a cyclic engine; also later results by Shenker, Earman,
  Norton, Hemmo & Shenker criticizing Landauer/Bennett).

  - Critiques: Earman & Norton (1998, 1999) "Exorcist XIV"; Norton (2005, "Eater of
  the lotus"); Shenker''s work; Ladyman & Ross; also the "no-blowtorch" arguments.
  There''s also the Sagawa-Ueda generalized second law with mutual information, and
  the fluctuation-theorem-based approaches (Jarzynski, Toyabe experiments 2010).

  - Reversible computation: Bennett, Fredkin-Toffoli billiard ball.


