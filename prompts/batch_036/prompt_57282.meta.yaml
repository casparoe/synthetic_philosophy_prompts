  Key content to inject (the "niche/new idea" that keeps it from being regurgitated):

  - Bennett-style resolution: measurement can be thermodynamically reversible; the
  entropy bill lands on erasure, which is needed to reset the demon for another cycle.

  - The deferral objection: a demon with unbounded memory need never erase, so the
  bill is postponed indefinitely — and Funes is precisely such a demon. So the question:
  does Borges''s story supply the missing premise that makes deferral a bad deal?

  - Funes''s private numeral system: one arbitrary name per number, no compression,
  no general rules — the exact opposite of a numeration system (as the narrator says).
  Mapping: a code with no shared structure = no erasure, no logical irreversibility,
  hence zero thermodynamic cost — and also zero thought.

  - His inability to form general ideas / Platonic ideas: abstraction = compression
  = merging of computation paths = logically irreversible = the Landauer cost. So
  the thesis to test: to think is to erase.

  - His project of reconstructing a full day''s memory in a full day: the demon that
  can only replay, never act.

  - Sleeplessness: sleep as the reset/idle; he can''t be distracted from the world.

  - Death at 19 (the Wikipedia summary says 19; I recall the text says he died of
  congestion of the lungs, and his age — the narrator sees him at 19 in the dawn;
  he died in 1889 I think). Careful: I''ll say he dies very young, in his late teens
  / of congestion of the lungs, and phrase it as "the narrator''s account of his death,
  from congestion of the lungs, while still a teenager" — flag as recalled. Better:
  just say "his early death from congestion of the lungs" without specifying age.
  And note I''m working from memory and the model should too, flagging uncertainty.

  - Also: Funes extracts no work. He is a demon that produces no temperature difference,
  sorts nothing. So he doesn''t violate the second law at all — he just accumulates.
  The tragedy: infinite storage, zero work output. Is that a physical point about
  information (information that is never used to do work has no thermodynamic value)
  or a literary one?

  - Also ask where the analogy breaks: Landauer''s cost is paid at erasure, not at
  storage; a perfect memory that never erases pays nothing on the physics, so the
  story cannot be a literal dramatization of the cost of remembering. Also storage
  itself has no Landauer bound (though there are arguments about the cost of maintaining
  memory against thermal noise / error correction — I could mention that as a possible
