  carries the interpretive weight I am putting on it rather than the other way round.


  Here is the reading I want to defend, and I want you to test it rather than flatter
  it. On the standard Bennett-style resolution of Maxwell''s demon, the demon''s measurements
  can in principle be performed reversibly, so the entropy bill is not paid at the
  moment of looking; it is paid when the demon''s memory must be reset in order to
