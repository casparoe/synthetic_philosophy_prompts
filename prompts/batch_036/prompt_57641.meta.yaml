  and what''s left is the claim that an uncaused or random source of your action can''t
  be your source either. Compatibilists have never denied that. So the "works either
  way" version isn''t more general, it''s just question-begging: it assumes that responsibility
  requires ultimacy, defines ultimacy so that nothing can satisfy it, and then reports
