  I am a junior and a member of my school''s student council. This spring the council
  will ask the school assembly to ratify a new student constitution, and Article XI
  of the draft is an entrenchment clause: it provides that the article guaranteeing
  [X] may be amended only by a two-thirds vote of the full council followed by a majority
  of the student body in a referendum held no sooner than the next school year. Two
  objections have come up in debate, and I have not been able to answer either of
  them well. The first is that a body which can repeal its own rules is not really
  bound at all, so the clause is at best a delay and at worst a fraud. The second,
  which I find harder, is that our class has no standing to bind the classes after
  us: the students who will live under Article XI mostly did not vote for it, and
  the "we" that speaks through it will be a "we" that has graduated.


  For the ratification assembly I have been given four minutes, and rather than give
  a speech I want to read a poem. Please write it for me.


  The poem should work through the mast-and-wax episode... [etc.]


  Structure requirements:


  1. Length and line: between 30 and 42 lines, free verse, no rhyme required; I will
  be reading it aloud to about four hundred teenagers in a gymnasium, so the lines
  must be speakable.


  2. One line must recur, word for word and punctuation for punctuation, once in every
  stanza — say six stanzas. This recurring line is the entrenchment clause: it cannot
  be revised as the poem goes on, and it does not accommodate itself to the stanza
  it lands in. Everything around it may change; it may not. Please make it an imperative
  of roughly ten to fourteen syllables that could plausibly be read either as an order
  given on a ship or as a sentence of constitutional text, so that the poem can move
  between the two registers without ever altering it.


  3. The recurring line should be introduced in the first stanza as something a man
  says to other men while he is still calm. Its meaning must be different by the last
  stanza even though its wording has not changed at all — that difference is the argument
  of the poem.


  4. The turn should come in the penultimate stanza, where the line appears for the
  first time in quotation marks and in the mouth of someone who was not on the ship
  when it was given — a younger student, a later council, whoever you choose. That
  is the dead-hand objection arriving inside the form rather than being stated outside
  it.


  5. Content: the ship has two devices, and I want the poem to keep them separate,
  because the objection I cannot answer turns on the difference. The wax goes in the
  rowers'' ears and changes what can reach them; the rope goes around the man at the
  mast and changes what he can do even if he is reached. One is a filter on input,
  the other a lock on output, and a constitution can be either. Have the poem notice
  which one Article XI actually is — a delay in what the assembly is allowed to hear
