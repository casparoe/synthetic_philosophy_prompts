  Let me try: "My seminar partner built this to show that the link from conceivability
  to possibility is useless, and I can''t answer it."

  (1) For any proposition p, if we cannot rule out p a priori, then p is ideally conceivable
  (Chalmers-style CP''s antecedent is satisfied).

  (2) If p is ideally conceivable, then p is metaphysically possible.

  (3) Whether we can rule out p a priori is a fact about our epistemic position, and
  our epistemic position is limited — for countless p (undecided arithmetic, distant
  empirical claims) we can rule out neither p nor ¬p.

  (4) So for each such p, both p and ¬p are conceivable, hence both are possible,
  hence neither is necessary.

  (5) But some of those p are arithmetical, and if arithmetic truths are necessary,
  (4) is false.

  (6) So (2) is false: conceivability does not entail possibility; and the same reasoning
  shows that the whole method of modal epistemology via conceivability — including
  the zombie argument and the arguments about personal identity — is bankrupt.


  Where''s the flaw? Step (1) and (3): conflating "we cannot rule out p a priori"
  (our actual, non-ideal epistemic position → prima facie conceivability) with "p
  is not a priori false" (ideal conceivability). Ideal conceivability requires that
  p be coherent under *ideal* a priori reflection — an omniscience limit. For an arithmetical
  p, if it''s false, it is a priori refutable in principle (given ideal reasoning),
  so it''s not ideally conceivable even though we can''t tell. So (3)→(1) equivocates.
  Also (4) needs both p and ¬p ideally conceivable, which idealization forbids (ideal
  conceivability is negation-complete, presumably, since ideal a priori reasoning
  settles every arithmetical claim... though this itself is contested — that''s the
  interesting bit: whether ideal rational reflection is complete for arithmetic. That''s
  a genuinely contested point among people who know the topic — perfect for the epistemic
  request!). Also there''s a scope issue: Chalmers holds CP as linking ideal positive
  conceivability to possibility (and 1-primary vs 2-possibility: "p is possible" for
  the zombie argument is *primary* possibility, i.e., possible-as-true given the way
  the world turns out to be — the two-dimensional move). So the argument also equivocates
  between metaphysical possibility and primary possibility. And "proves too much"
  indeed: if the argument worked, it would show that any epistemic guide is useless
  because we are non-ideal.


