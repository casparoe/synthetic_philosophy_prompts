  Actually a nice one: the "modal collapse" argument. Let me construct:


  (1) If S is ideally conceivable, then S is metaphysically possible. (CP)

  (2) For any proposition p, either p is ideally conceivable or ¬p is ideally conceivable.
  (Because ideal conceivability is just a priori coherence, and by excluded middle
  and completeness of a priori reasoning, one of them must turn out coherent.)

  (3) So for any p, either p is possible or ¬p is possible.

  (4) But some p are such that both p and ¬p are conceivable — e.g., Goldbach''s conjecture:
  we can conceive that it''s true and that it''s false, since neither has been settled.

  (5) So both Goldbach and its negation are possible.

  (6) Hence arithmetic is not necessary, hence nothing is necessary.


  The flaw: step (2)/(4) conflates prima facie (non-ideal) conceivability with ideal
  conceivability; ideal conceivability is a limiting notion that requires a priori
  omniscience; for arithmetic statements, one of them is not ideally conceivable even
  though it seems so to us. Also (3) is trivially true by excluded middle + necessity
  of p∨¬p, so no interesting conclusion; the real slide is from "p or ¬p is possible"
  to "both are possible" and then to "nothing is necessary" — which requires possibility
  of ¬p to entail contingency of p, which requires that possible-not-p entails not-necessary-p...
  which is fine actually. Hmm, but if both p and ¬p are possible then neither is necessary.
  That''s right. So the flaw is at (2)/(4): the equivocation between prima facie and
