  An argument that proves too much in this domain:


  Asker: a religious studies / Jewish philosophy student. Argument (from a classmate
  or from their own reading):

  (1) Maimonides explains the sacrificial cult by reference to its historical function:
  Israel, formed among idolatrous peoples for whom worship by sacrifice was the only
  conceivable form of worship, was given a cult directed to God alone so that the
  underlying idolatrous practice would be abolished; the form was retained, its object
  changed.

  (2) On that account, the reason a commandment exists is to bring about a state of
  affairs (weaning off idolatry, correct opinions about God), and the commandment
  is a means to that end.

  (3) A means-ordered rule binds only so long as it serves its end.

  (4) The relevant end has been achieved: sacrificial idolatry is extinct, and the
  correct opinions have been widely internalized (indeed by two world religions that
  Maimonides himself treats as preparing the way for the Messiah).

  (5) Therefore the sacrificial commandments no longer bind; and by the same reasoning,
  all commandments whose rationale is historical circumstance — dietary distinctions
  tied to ancient practice, the purity regulations, the fixed liturgy that replaced
  sacrifice — are likewise suspended or suspended-able.

  (6) But Maimonides holds the Torah''s commandments are eternal and unchangeable,
  and his code says the messianic king will rebuild the Temple and restore the sacrifices.

  (7) So Maimonides is either inconsistent, or his historicist account of the reasons
  for the commandments is not his real view.


  Where does it go wrong? The equivocation: between "the reason for a commandment''s
  *form*" and "the reason for its *obligatoriness*"; Maimonides distinguishes the
  reasons of the commandments (ta''amei ha-mitzvot) at the level of general kinds
  from the details (which he says some details have no reason — Guide III.26: the
  particulars of commandments have no cause/reason; only the general kind does). Also
  the distinction between "first intention" and "second intention" (III.32) — God''s
  first intention vs. the accommodation. Also step (4) assumes the end is fully achieved
  and the weaning irreversible; and Maimonides could say that the commandment''s obligation
  is fixed by divine decree, not by ongoing instrumental efficacy — i.e., step (3)
  is a general claim about means-ordered rules that Maimonides needn''t accept for
  divinely commanded law: the law''s authority, once given, is not revisable by human
  judgment about efficacy (and humans are not competent judges of whether the end
  is achieved). Also (4) equivocates "the end has been achieved" with "the means are
  no longer needed" — the commandments also serve ongoing functions (cultivating correct
  opinions, disciplining appetite, the sanctification of the community, the imitation
  of God, the political welfare of the community), so the historicist rationale is
  only one of several. And step (5)''s generalization: Maimonides explicitly limits
  the historicist move to sacrifices (and a few others), and holds that the *details*
  are arbitrary by divine will; so no slippery slope to the whole law. Also (7): the
  "inconsistency" assumes that a reason-explanation of a commandment entails contingency
  of obligation — the "second intention" notion is precisely designed to block that.


