  Section 3: Joints you can only cut with a knife you made


  The realism/anti-realism debate about natural kinds is usually staged as a single
  question asked at a single level: are there groupings the world itself licenses,
  or do we do the grouping? I want to suggest that both sides share an assumption
  that makes the debate unwinnable, namely that a candidate kind either is or isn''t
  a joint, full stop. What''s missing is a variable for the discrimination power of
  the apparatus doing the looking.


  Define a resolution regime as the pair of (a) a set of measurement capacities —
  what distinctions can be detected, at what precision, over what samples — and (b)
  the inferential license a discipline attaches to those detections, i.e. what you''re
  allowed to conclude from a difference you can measure. Then:


  (R1) A grouping is forced within a regime if, given the regime''s discrimination
  power and sampling, the boundaries fall out rather than being chosen. There''s a
  fact of the matter, internal to the regime, about where the cluster stops.


  (R2) A regime sits on a stable rung of a resolution ladder if moving one rung up
  or down (finer or coarser discrimination) doesn''t dissolve the grouping into noise
  but refines or coarsens it along the same axes.


  My claim: natural-kind-hood is forcedness plus ladder-stability, and it is regime-relative
  in exactly the way (R2) allows and no further. That''s the whole view. It''s meant
  to be a genuine third option, not a compromise, because it makes two claims that
  pull in opposite directions: the boundaries are not ours to set, but neither are
  they regime-independent.


