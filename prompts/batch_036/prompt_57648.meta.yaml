  requirements: (1) explain why a slur and its neutral counterpart differ in acceptability
  even in the same truth-conditional slot — non-displaceability; (2) handle embedding:
  the slur keeps its offensive force under negation, conditionals, questions, and
  reported speech (Frege-Geach problem for expressivism/presuppositional accounts)
  — but note the force *can* be blocked in some embeddings (mention, scare quotes,
  appropriation); (3) account for the fact that competent speakers can be mistaken
  about the extension (Hom''s "ignorance" argument against descriptivist content);
  (4) account for reclamation: the same word in-group vs out-group differs in force
  (indexicality to speaker/audience); (5) explain why the prohibition on use feels
  like a norm about words rather than about beliefs — the "use-mention"/taboo explanation
  (Anderson & Lepore''s prohibitionism) — and whether that''s enough; (6) explain
  why paraphrase in terms of the neutral counterpart fails to preserve something (the
  "there''s no innocent way to say it" intuition) and why some theorists (Whiting)
  say the offensive content is a presupposition or a conventional implicature that
  projects; (7) predict correct behavior in attitude reports and in "if that''s a
  slur, then..." conditionals; (8) handle the possibility of slurs whose content the
  speaker doesn''t fully grasp; (9) handle the difference between slurs and other
  pejoratives / thick terms; (10) be consistent with the empirical fact that hearing
  a slur harms targets regardless of speaker intent.


  Which subset is jointly unsatisfiable? A classic: (a) the slur''s derogatory content
