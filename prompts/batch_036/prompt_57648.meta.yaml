  use "the people" in a way that''s both inclusive and exclusionary (the "real people"
  vs elites and out-groups), the performative construction of the demos, the requirement
  that an account not make populism automatically false, the requirement to explain
  why populists can be democrats while attacking pluralism, the requirement to handle
  that "the will of the people" can be indeterminate (Condorcet cycles) and yet populists
  claim to read it, the requirement to distinguish populism from mere popular sovereignty/majoritarianism,
  thin-centred ideology (Mudde: populism as a thin-centered ideology with a moralized
  antagonism between pure people and corrupt elite), the fact that populism appears
  both left and right, and that it''s often said populism is "inherent to democracy"/a
  shadow of representative democracy (the idea that populism is what happens when
  the people are invoked against their representatives). Which subset is jointly unsatisfiable:
  e.g., requiring that "the people" be (a) empirically identifiable as a majority,
  (b) normatively prior to the procedures that constitute it, and (c) unified enough
  to have a single will — is impossible given the boundary problem and cyclical majorities.
  That''s a strong desiderata prompt, and the injection is natural.


