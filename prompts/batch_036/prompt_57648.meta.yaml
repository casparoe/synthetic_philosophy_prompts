  Hmm, is it true that Simpson''s paradox can occur without a confounder? Yes — it''s
  a mathematical fact about weighted averages; it can arise purely from unequal group
  sizes even with no causal connection (e.g., the classic "a student''s batting average"
  or "kidney stone treatment" where size of stones is the confounder, but there are
  pure-arithmetical examples). The literature (e.g., Blyth 1972; Pearl''s discussion;
  the "Simpson''s paradox is not about causation but about the arithmetic of weighted
  averages" point) supports that. Also, Simpson''s paradox is not really a paradox
  in the logical sense; and the reversal can occur in both directions of aggregation.
  Also it can occur with continuous variables and with correlations (not just 2x2
  tables). Fine.


