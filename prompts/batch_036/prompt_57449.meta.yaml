  I am a doctoral candidate in economic history writing the historiography-and-method
  chapter of my dissertation, and before I submit it I want a consistency audit of
  the position I have arrived at concerning Malthus. I have tried to state my commitments
  below as plainly as I can, including several that I suspect sit awkwardly together
  but cannot locate the awkwardness in. I am deliberately not telling you which of
  them I would be prepared to abandon, because I do not yet know, and I would rather
  the audit determine that than my intuitions.


  1. ...

  ...


  What I want back is an audit rather than a survey: identify which of these commitments
  genuinely pull against one another and which merely look as though they do, order
  the genuine tensions by severity rather than presenting them as a flat list, and
  for each say what would have to be given up or restated and what the loss would
  be. Where a tension is only apparent, say explicitly why it dissolves, since I need
  to know which of my worries are unfounded. Then tell me which single revision would
  repair the most damage at the least cost, and what I would no longer be able to
  claim afterwards. Please do not recapitulate the Malthusian argument or the history
  of the demographic transition; assume I know both. And do not be even-handed: if
  the set is basically sound with one soft spot, say so, and if it is not, say that
  instead.


  Good. Let me write final items carefully in polished prose.


  Item wording:


  1. I hold that for essentially the whole of agrarian history the Malthusian framework
  was correct in its central claim: real income per head was held within a narrow
  band because population adjusted to income, so that improvements in technique registered
  themselves as more people rather than as richer people.


  2. I also hold, on the evidence for northwestern Europe, that most of this adjustment
  was achieved by the preventive check — age at first marriage moving with wages and
  with the availability of a household to support — rather than by famine and epidemic
  mortality. That is to say, I think the feedback was real but that the misery-heavy
  version of it is not what the pre-industrial English data show.


  3. I hold that the escape from this regime beginning around the turn of the nineteenth
  century was a structural break and not a change of parameter values: a model that
  reproduces sustained growth in income per head is a different model, not the Malthusian
  model with different coefficients.


  4. I take the decisive datum to be the reversal in the sign of the relationship
  between income and fertility during the demographic transition — richer people having
  fewer children — which is not a weakening of the Malthusian feedback but its inversion.


  5. Methodologically, I am strict about rescue. Where a theory is saved from a failed
  prediction by an auxiliary that can be set so as to accommodate either outcome,
  I think the theory has lost content and should be said to have done so. I apply
  this criticism to Malthus himself: in adding moral restraint to vice and misery
  as a third check in the greatly expanded second edition of the Essay in 1803, after
  critics had objected that the first edition''s implied inevitability of misery was
  neither demonstrated nor desirable, he made the theory compatible with rising wages
  and virtue as readily as with falling wages and immiseration.


  6. Notwithstanding (5), I want to resist the standard objection that two centuries
  of sustained growth in income per head have falsified Malthusianism. My defence
  is that Malthus correctly identified a mechanism which was genuinely operative under
  one set of conditions and ceased to be operative under another, and that it is legitimate
  to say of a theory that it was right about its own regime — that the honest charge
  against Malthus is that he was right but bounded, not that he was wrong.


  7. I also think Malthusianism is owed a certain credit for longevity: a quantitative
  claim about the future that withstands scrutiny for two centuries has, on my view,
  been tested more severely than one overturned in twenty years, and this counts in
  the theory''s favour.


  8. At the same time, when Marxists say that the theory of crisis was correct and
  only its timing was off, or when those who predicted resource exhaustion in the
  1970s say that the mechanism was right and the date was wrong, I am inclined to
  dismiss the move as an immunising stratagem rather than to accept it as a vindication.


  9. Finally, I do not think the line between a legitimate restriction of a theory''s
  domain and an ad hoc rescue can be drawn by asking whether the theorist was sincere,
  or whether the restriction was made in good faith. A restriction offered with complete
  honesty can still be ad hoc, and I want an account of the difference that does not
  depend on intentions.


