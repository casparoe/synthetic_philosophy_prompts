  I am in the third year of a PhD in the philosophy of science, working on idealisation
  in economics, and the dissertation chapter I am drafting defends a refined version
  of Milton Friedman''s methodological thesis — the position Samuelson disparaged
  as the F-twist. My version runs as follows: a model is warranted as a candidate
  explanation of a target phenomenon to the extent that it predicts well within a
  specified domain, and the descriptive accuracy of its assumptions bears on that
  warrant only instrumentally, i.e., only insofar as it affects predictive performance
  in that domain. I add two qualifications that I think disarm the classical objections.
  First, following Musgrave, I concede that some assumptions are domain assumptions:
  they fix the range over which the model is offered as predictive, and getting them
  wrong is a straightforward empirical failure rather than a harmless idealisation;
  the F-twist applies only to the remainder — the negligibility and isolation assumptions.
  Second, I hold that the thesis is about warrant, not truth: I make no claim that
  unrealistic assumptions are true, merely that their falsity is not by itself a reason
  to reject a model that predicts.


  What would count against this? I want a map of its exposure, not the two or three
  stock objections (the billiard-player "as if" story, Samuelson''s charge that the
  view twists facts to fit theories, the general worry that instrumentalism cannot
  explain why models work at all). Specifically:


  1. Which empirical episodes in economics or elsewhere would count as genuine defeaters
  — cases where relaxing an idealisation in the direction of realism systematically
  improved prediction within the same domain, or where the model''s own success criterion
  failed to register that a load-bearing assumption was doing damage? Say what such
  a case would have to look like to be decisive rather than merely awkward, and note
  that a single failure to predict does not refute a thesis about warrant.

  2. Which structural or formal results would count against it — anything showing
  that predictive success in a domain cannot be had without representational constraints
