  and to select a block proposer, not to make a message credible as evidence about
  the world. In a market, the cost is paid to the counterparty (adverse-selection
  compensation), and the signal''s credibility comes from the payoff structure (the
  trader''s incentive to be right), not from the fee. Also: proof-of-work carries
  no information content about anything except that work was done; a trade carries
  information because the trader''s private state correlates with value. The analogy
  may invert the direction: in the market, the "cost" is endogenous to the information
  asymmetry (the spread widens when there is more informed trading), whereas in PoW
  the cost is fixed and independent of message content.

