  - Conflating the no-trade theorem''s assumptions with reality: it requires common
  priors, common knowledge of rationality, no noise traders, and Pareto-optimal initial
  allocation. In practice, liquidity-motivated traders, heterogeneous priors, and
  risk aversion generate trade that isn''t speculative. The market maker is compensated
  by the spread — trade still happens and still moves prices; the theorem says no
  *expected profit from speculation*, not that prices don''t move or that no information
  is transmitted.

  - Conflating "trade reveals information" with "the information is never transmitted":
  actually the theorem''s mechanism (an offer reveals private info and is priced in)
  is exactly a story of information transmission via prices — the essay gets the sign
  backwards. The Wikipedia gloss even says "will be incorporated into market prices
  even before anyone accepts the bid" — which is aggregation, not failure of aggregation.

  - Aumann''s agreement theorem requires common knowledge of posteriors, which markets
  don''t deliver; trade-based communication doesn''t produce common knowledge of posteriors
  in one shot. Also Geanakoplos-Polemarchakis: iterated announcement of posteriors
  leads to agreement — so dialogue does converge, but that''s not the same as markets
  failing.

