  informative when interests are aligned (Crawford-Sobel); and the relevant contrast
  in markets isn''t cheap vs costly talk but whether the sender bears a consequence
  for being wrong. The market''s discipline is that the trader loses money if wrong
  — a skin-in-the-game/staking mechanism, closer to proof-of-stake/slashing than proof-of-work.
  That''s a nice specific critique for the model to make.


