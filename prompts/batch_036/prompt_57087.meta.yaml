  Prompt draft:


  I''m a backend engineer at a company that is rolling out an internal prediction
  market for product decisions (release dates, feature adoption, incident counts).
  I have no formal training in philosophy or economics — I''ve picked this up from
  reading around the topic while arguing with colleagues — and I''ve drafted a blog
  post explaining why I''m sceptical that the market will do what its champions promise.
  Before I publish it internally, I''d like a critical read.


  Here''s the draft (paragraph numbers are for reference):


  [1] The standard defence of markets is epistemic. On this view, a price is not a
  valuation but a computation: it aggregates information that is dispersed across
  people who will never meet and who have no incentive to tell each other what they
  know. Prediction markets are supposed to inherit this property, which is why people
  claim they are more accurate than committees or forecasts.


  [2] There is a theorem that seems to me to cut directly against this. Milgrom and
  Stokey showed in 1982 that, under conditions of common priors and common knowledge
  of rationality, with no noise traders, speculative trade cannot occur. The reasoning
  is short. Suppose you offer to buy from me. I know you are rational and I know you
  share my prior. So your willingness to buy at the current price tells me you must
  know something I don''t. But then I know it too, in the sense that I know you know
  it, and the price should already reflect it. I decline. You, anticipating my decline,
  never made the offer. Information that could have been transmitted is instead suppressed
  by the very act of proposing to transmit it.


  [3] The same structure appears in Aumann''s 1976 result that agents with a common
  prior cannot agree to disagree once their posteriors are common knowledge. If disagreement
  is impossible in the limit, and if the market''s job is to reconcile disagreement
  into a single number, then the market is solving a problem that rational agents
  don''t have — or, what amounts to the same thing, the observed disagreement is evidence
  that the agents are not rational or do not share priors, in which case the price
  is not a Bayesian computation at all.


  [4] Grossman and Stiglitz press the point from the other direction in their 1980
  argument that markets cannot be perfectly informationally efficient. If prices fully
  reflected all available information, there would be no return to spending resources
  to acquire it, so nobody would acquire any, so prices would not reflect it. Any
  market that works must be a market in which prices are partly wrong, and in which
  the degree of wrongness is pinned down by the cost of information. Efficiency, on
  this argument, is a limit that the system cannot reach without destroying its own
  input.


  [5] My own contribution, such as it is, comes from distributed systems. In a consensus
  protocol a message is only worth attending to if the sender paid something to send
  it, because a costless message from an agent you already believe to be rational
  and aligned with you carries no signal. Proof of work exists to make speaking expensive.
  I want to say the bid-ask spread plays exactly this role in a market: it is the
  fee a trader pays for the right to speak, and the fee is what makes the utterance
  credible. Where the spread is zero, the market is running an unauthenticated protocol
  and should be expected to be flooded with noise. Where the spread is wide, the market
  is expensive to listen to but at least knows who is talking.


  [6] This yields a concrete design claim for our internal market. If trading is free,
  then either nobody trades, or those who trade are telling us something we did not
  want to hear — namely that they disagree with the rest of us about fundamentals,
  or about how to interpret public information. A free internal prediction market
  is therefore not a truth-aggregator but a disagreement detector, and it should be
  read as an alarm rather than an oracle. To make it an oracle you have to price participation
  at something close to the value of the information the participant holds, which
  is a quantity we cannot know in advance. Which is, I think, just Grossman and Stiglitz
  restated as a systems design problem.


