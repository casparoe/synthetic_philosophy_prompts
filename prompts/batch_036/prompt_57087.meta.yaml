  Background:

  - Milgrom and Stokey (1982), "Information, Trade and Common Sense" — with common
  priors and common knowledge of rationality, no speculative trade: any agreed-upon
  trade would have been anticipated and already incorporated; if agents are risk-neutral
  and markets are efficient/complete, no trade occurs.

  - Aumann (1976) agreement theorem: two Bayesian rational agents with common prior
  cannot agree to disagree (common knowledge of posterior implies equal posteriors).

  - Glosten-Milgrom (1985): market microstructure — bid-ask spread arises from adverse
  selection against informed traders; market makers set prices as conditional expectations
  given order flow; prices converge to the true value as trades accumulate. So trade
  does happen and prices do aggregate info, but the no-trade theorem''s assumptions
  (common knowledge, symmetric rationality, ability to condition on the same information)
  fail because of private information and because traders'' willingness to trade signals
  info.

  - Kyle (1985): a single informed trader trades optimally against noise traders,
  price partially reveals info; lambda measures price impact.

  - The key resolution: no-trade theorems require common prior and common knowledge
  of rationality, plus that agents'' posteriors be common knowledge. Trade based on
  private information doesn''t violate the theorem because the willingness to trade
  itself becomes common knowledge and gets priced in — which in equilibrium means
  the uninformed party would refuse. In Glosten-Milgrom, the market maker does trade
  at a spread — he is compensated. So "no-trade" applies to speculative trade among
  risk-neutral agents with common priors: they can''t both expect to profit.

  - Also relevant: "no-betting theorem" (Sebenius & Geanakoplos 1983) — with common
  priors, common knowledge of rationality, and Pareto-optimal allocation, no bets.
  And the literature showing that with heterogeneous priors or overconfidence, trade
  occurs (Harris & Raviv 1993; Kandel & Pearson 1995 — "Why honest folks disagree
  about weather: a formal unstructured model of the interpretation of public information").

  - Also: prediction markets and the "market as aggregator" claim (Hayek 1945; the
  "wisdom of crowds"). Also the Grossman-Stiglitz paradox (1980): if prices fully
  reflect information, no one has incentive to gather it — so equilibrium must be
  one where prices are only partially informative. That''s a nice parallel to the
  engineer''s confusion.

  - Also "efficient market hypothesis" (Fama 1970).


