  So the desiderata list should include categories:

  1. Extensional adequacy: must reproduce the constants working mathematicians accept
  (PNT heuristic, twin prime constant, Cohen–Lenstra 1/|Aut|, Mertens/e^{-γ}).

  2. Must explain systematic failures and repairs (Maier vs Cramér; Granville''s constant;
  local obstruction corrections; Brauer–Manin obstructions).

  3. Must specify what counts as defeating information — the defeasibility discipline:
  default independence can be overridden only by identified correlation; no ad hoc
  overrides (else unfalsifiable); and must handle the fact that different background
  knowledge yields different but both defensible estimates.

  4. Coherence: consistency (no endorsement of contradictions), additivity, invariance
  under logically equivalent reformulation, no Dutch book? — and the tractability
  conflict.

  5. Non-omniscience: must be usable without solving the problem it estimates; must
  not require knowing whether the claim is true; and must not smuggle in the answer.

  6. Calibration/quantitative output: must deliver numbers with a stated error regime,
  not just "plausible"; must specify range of validity and what agreement with finite
  computation licenses.

  7. Scope: must handle quantities as well as truth values; must handle non-independence-based
  heuristics (analogy/structural: random matrix theory, function-field analogies)
  or say why it excludes them.

  8. Testability/refutation: must make it possible for a theorem to contradict an
  estimate — requires saying what the probabilities are probabilities of (given the
  fixed structure of the integers, there''s no chance).

  9. Explanatory: must distinguish right answer for the right reason from right answer
  by luck; should predict which heuristics will fail before they fail (a strong demand).

  10. Must respect the practice constraint: the framework should be one working mathematicians
  would actually consult — or if not, say the purpose is different.


  Then: which pairs jointly unsatisfiable? Candidates:

  - (Coherence/logical omniscience) vs (computational non-omniscience): full additivity
  + consistency under logical equivalence implies deciding logical consequence, which
