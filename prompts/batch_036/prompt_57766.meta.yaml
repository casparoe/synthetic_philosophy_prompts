  Jeffrey conditionalization: when evidence doesn''t come as certain, you update on
  the whole probability distribution over a partition: P_new(A) = Σ P_old(A|E_i) P_new(E_i),
  provided "rigidity": P_new(A|E_i) = P_old(A|E_i). The problem: rigidity is not generally
  satisfied, and there''s the problem of the old evidence, the problem of "which partition,"
  and the worry that Jeffrey conditionalization is not a rule but requires an input
  (the new probabilities of the observation sentence) that is itself not rationally
  constrained — "Jeffrey conditionalization is a formula in search of an input" (this
  phrase is used by... I think it''s in the literature; maybe Christensen or Earman).
  I shouldn''t quote.


