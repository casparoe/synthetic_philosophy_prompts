  discrimination changes with training, so the new probabilities of the observation
  partition aren''t a simple reflection of the world. Or "the calibration drift case":
  a scientist using an instrument whose output distribution changes because of a known
  hardware fault, so the probability shift in the reading is partly explained by the
  instrument, not the world — the agent has to disentangle. Jeffrey conditionalization
