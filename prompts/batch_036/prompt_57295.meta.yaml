  Van Fraassen''s Reflection Principle (1984, "Belief and the Will" / later "Belief
  and the Problem of Meno"?): Actually Reflection was introduced in van Fraassen''s
  1984 paper "Belief and the Will" (Journal of Philosophy) and elaborated in Laws
  and Symmetry / "Belief and the Problem of Meno". Standard formulation:


  C_now(P | C_later(P) = r) = r.


  The rationale: your future opinions are, from your current perspective, your own
  opinions informed by more evidence; so conditional on knowing what they''ll be,
  you should adopt them now. Diachronic Dutch book: suppose today C(P) = 0.1 and you
  know that tomorrow C''(P) = 0.9. Today you''d accept a bet that pays $1 if P...
  wait, let''s set it up: Today you''d sell a $1 payoff-if-P bet for $0.10 (since
  your credence is 0.1, you''d accept 10 cents for a ticket paying $1 if P). Tomorrow,
  with credence 0.9, you''d pay up to $0.90 to buy that same ticket back. Net loss
  $0.80 regardless of P. That''s a sure loss. So the pair of attitudes is exploitable
  → irrational.


  The known objections: (a) The book requires you to be willing to bet tomorrow; but
  if you know your future self will be drugged/misled, you might refuse. But the standard
  response: the Dutch book argument assumes you behave as a bet-acceptor in line with
  your credences at both times; the loss arises from the future irrationality. Actually
  more precisely: Van Fraassen''s own qualification is that Reflection applies only
  where the future credence change is the result of learning (conditionalization on
