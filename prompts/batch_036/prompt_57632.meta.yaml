  moral seriousness; but if the defender were in a position to know that this intervention
  and only this one would defeat those goods, he would be obliged by his own defense
  to stand by, which no one thinks.

  - A defender of the "stable laws" theodicy (God does not interrupt the regularities
  that make deliberation possible) who is asked why there is no miracle at the moment
  of a child''s drowning: the answer again licenses inaction in exactly the cases
  where everyone agrees action is required.


