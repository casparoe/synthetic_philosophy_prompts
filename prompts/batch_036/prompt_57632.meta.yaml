  I want to know whether a certain structural pattern in theodicy has a name, and
  if it does not, what it should be called. Here is the pattern, described as I encounter
  it rather than in the vocabulary of the literature.


  A theodicy says: God permits a particular evil E because E is required for a good
  G that could not be had without it — a soul-making good, say, or the good of a world
  with stable natural regularities and genuinely free creatures. Now suppose I accept
  the theodicy, and suppose I also know, of a particular case in front of me, that
  it falls under the theodicy: this person''s suffering is exactly the kind the theodicy
  says is needed. Then it seems the theodicy tells me to leave it alone. Interfering
  would destroy G, and G is what made E permissible in the first place; so a person
  who is fully convinced by the theodicy, and who can see that this instance is covered,
  appears committed to letting it happen — and, worse, to regarding his own mercy
  as a small defeat of a divine plan.


  But of course theodicists do not accept that. Their standard reply is that we are
  not God: we cannot see whether the good really is obtainable only this way, we cannot
  survey the whole system, and our role is that of neighbors and physicians, not of
  the designer. So the same reason that licenses God''s permission licenses our relief
  of it.


  That reply may be right, but notice its shape. It is not merely that the reason
  is indexed to the agent, in the way that my reasons to look after my own children
  are indexed to me. The reason changes sign. Considered from God''s position it points
  toward permitting E; considered from mine, once I know it, it points toward preventing
  E. And the flip does not come from some independent moral principle about our limited
  role; it comes from the theodicy''s own content plus a difference in knowledge and
  power. So the theodicy has the odd property that it can be used to justify E only
  by an agent who is incapable of being told it.


