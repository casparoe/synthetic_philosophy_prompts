  alarm. On his telling, the alarm''s sole job is to report that there is a fire somewhere;
  its loudness is not part of the message it carries, since a discreet indicator light
  on the wall would convey exactly the same information to anyone paying attention;
  and much of clinical pain is the alarm going off because someone burnt toast, which
  is a defect in the alarm rather than a reason to conclude that alarms are intrinsically
  bad. He pushed the analogy quite far. Because the aversive component is, on his
  view, a redundant amplifier bolted onto a perfectly good signalling channel, he
  argued two things: that pain is bad only instrumentally, in virtue of being unreliable
  and disabling, and not in virtue of how it feels; and that a hypothetical drug —
  he called it the asymbolia pill — that left nociceptive discrimination completely
  intact while abolishing the suffering would be an unqualified improvement, since
  it would deliver the information and discard the noise. As evidence that the two
  components really do come apart he cited the actual syndrome of pain asymbolia:
  patients who, typically after lesions involving the insular cortex, can identify
  a noxious stimulus as painful yet show no withdrawal and no emotional response to
  match, remain unconcerned about their own deficit, and fail to learn protective
  or escape responses. To that he adds a distinction he leans on throughout: signal
  failure, where the alarm rings and there is no fire, versus receiver failure, where
  there is a fire and the alarm rings correctly but nobody minds it. The pill, he
  says, produces only receiver failure, and receiver failure is benign as long as
  the information arrives.


