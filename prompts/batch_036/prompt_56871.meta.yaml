  to do is to spell it out, to make it explicit even to herself, and so to bring it
  into the space where she would have to act on it or argue with it. The contradiction
  is not within the belief-set but between the belief-set and what the person will
  say about it.


  ¶7. My conclusion is that self-deception is possible, but only in the weak sense
  the deflationists describe. The strong sense, in which a person deliberately deceives
  herself, is not. It requires a part of the mind to be an agent, and once a part
  of the mind is an agent the regress cannot be stopped: something must deceive the
