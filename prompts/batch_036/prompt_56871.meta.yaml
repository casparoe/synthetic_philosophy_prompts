  ¶1. Deception, as we ordinarily understand it, is a transaction between two people.
  One of them knows that p is false and brings it about that the other believes it;
  the knowledge sits on one side of the exchange and the false belief on the other.
  Self-deception appears to require that both sides of this transaction be occupied
  by the same person, and that is where the difficulty starts. The self-deceiver must
  know the truth in order to have something to hide, and must fail to know it in order
  to have succeeded in hiding it. If that is right, self-deception is not merely difficult
  to explain but formally impossible, since it asks one and the same mind to stand
  in contradictory relations to one and the same proposition at one and the same time.


  ¶2. It is worth separating two versions of the problem, because they call for different
  remedies. The first is static: how can a person simultaneously believe that p and
  believe that not-p? The second is dynamic, or strategic: how can a person set out
  to deceive herself at all, given that the plan she is executing is a plan she must
  not notice herself executing? A strategy known to its victim to be deceitful is
  a strategy that cannot work. The dynamic problem is the more serious of the two,
  because it survives any solution to the static one; a philosopher who explains how
  contradictory beliefs can coexist has still to explain how the project of bringing
  them about gets off the ground.


  ¶3. The most influential response to the static problem is to deny that the two
  beliefs belong to a single system. On Davidson''s account the mind is partitioned:
  it contains semi-autonomous structures, each with its own beliefs, and a contradiction
  is tolerable provided that the offending beliefs are quarantined in different structures
  and cannot be brought together in reasoning. What I believe about my marriage and
  what I believe about marriage may conflict; the conflict is survivable so long as
  no single act of inference draws on both. Davidson is careful to insist that the
  partitions are not little people. Nothing inside the head is a second agent with
  its own intentions and its own view of the first; the division is a division of
  the work a single person''s psychology does, not a division of persons. That insistence
  is what allows him to avoid the obvious objection, since if the partitions were
  agents we would need to ask how the smaller agent deceives the larger, and then
  how the smaller agent''s own parts deceive it, without end.


  ¶4. Sartre approaches the same problem from the other direction, and his answer
  is structural rather than logical. Consciousness, on his view, is divided into levels:
  there is a level at which the truth is known and a level at which it is not, and
  bad faith consists in the deception running between the levels rather than within
  either of them. This is why he thinks Freud was substantially right about the censor
  and only wrong about the ontology that surrounds it. The censor knows what it represses,
  since otherwise it could not select what to repress; the conscious ego does not;
  and the two are not the same thing. Once the mind is understood as two storeys rather
  than one room, the contradiction dissolves, because no single level ever holds both
  beliefs.


  ¶5. A more deflationary strategy dissolves the problem in a different way, by denying
  that self-deception has the structure of interpersonal deception to begin with.
  Mele and others argue that no exotic machinery is required: self-deceived people
  gather evidence in a biased manner, dwell on what is comfortable and hurry past
  what is not, and arrive, by ordinary routes, at the belief they wanted. Nothing
  here involves an intention to deceive oneself, and nothing involves contradictory
  beliefs. The welcome consequence is that the paradox turns out to have been verbal
  all along. If self-deception is motivated belief-formation rather than self-directed
  deceit, the question whether a person can both know and not know the truth never
  arises, and with it the dynamic problem, since there is no plan to be executed and
  therefore no plan to be kept hidden. It follows that self-deception is best understood
  as a species of weakness of will rather than of deception: the self-deceived person
  acts against her better judgement, only in the sphere of belief rather than of action.


  ¶6. Two refinements are worth making before drawing a conclusion. First, self-deception
  need not issue in a false belief about a matter of fact. A person may hold entirely
  accurate beliefs about her situation and still be self-deceived about her reasons
  for being in it — about why she stays, why she agreed, what she is angry about.
