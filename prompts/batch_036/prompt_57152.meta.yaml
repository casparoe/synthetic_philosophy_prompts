  a cause — as the only genuinely contestable step, and I should like to spend most
  of my hour on it. Three questions. First, which defence of that premise would you
  regard as the strongest: the appeal to the uniform practice of the sciences in seeking
  causes, the appeal to the impossibility of something coming from nothing, or the
  claim that a beginningless series of events cannot be completed by successive addition?
  Second, how should I handle the objection that quantum field theory permits spontaneous
  events — vacuum fluctuations, virtual pairs, radioactive decay — with no antecedent
  cause? Third, given that the first premise is now secured, does the Leibnizian argument
  from contingency retain any independent philosophical interest, or should I present
  it as a redundant fallback for those unwilling to accept modern cosmology? I would
