  began to exist.


  Here I feel on comparatively firm ground, and I would like you to tell me whether
  I am right to. The classical singularity theorems showed that, given plausible energy
  conditions, an expanding universe cannot be extended indefinitely into the past;
  and then Borde, Guth and Vilenkin showed in 2003 that one can dispense with the
  energy conditions altogether, deriving from a bound on the integral of the Hubble
  parameter along a past-directed geodesic that any spacetime which has on the whole
  been expanding must be incomplete in the past. As I understand it, this is not a
  speculation but a proof, and it has since survived every attempt at evasion I have
  come across: the bouncing and cyclic models and the emergent or ''Galilean genesis''
  proposals all fail it, because a universe that has been expanding on average cannot
  have been doing so forever. So the empirical half of the kalam argument appears
  to me settled, and settled by physics rather than by metaphysics — a point I intend
  to stress, since our group contains two members who assume the argument rests entirely
  on a priori intuitions.


