  Draft:


  ---

  I work on ML systems and I''ve gotten reasonably comfortable with strictly proper
  scoring rules — Brier, log loss — from evaluating probabilistic forecasts. Lately
  I''ve been reading around accuracy-first epistemology, the view that the fundamental
  epistemic norm is to minimize expected inaccuracy, and that the usual arguments
  for probabilism and conditionalization are just dominance/expected-utility arguments
  run with an accuracy measure in place of a practical one.


  One claim in that neighborhood I keep running into is this: if evidence is free
  and truthful, you can never expect to lose accuracy by looking at it, provided you
  respond by conditionalizing. Free true information is never bad for you epistemically.


  I want you to build me a thought experiment that breaks this, under constraints
  that make it non-trivial. Specifications:


  1. Setting: realistic, present-day, an engineering or ops context. One named person,
  one concrete decision about whether to look at one piece of evidence. No thought-experiment
  hardware: no prediction demons, no brain surgery, no drugs, no time machines. One
  paragraph for the scenario itself.

  2. The evidence must be genuinely informative. Specify a finite hypothesis space,
  a prior, and likelihoods such that the evidence really does bear on the question,
  and such that an agent who looks and conditionalizes properly is strictly better
  off in expected accuracy than one who never looks. I don''t want the case to work
  by making the evidence useless noise.

  3. The agent does not conditionalize. She has a specific, describable response rule
  — state it as an explicit function from what she sees to what she ends up believing
  — that is systematically biased in a way she knows about and cannot switch off in
  the moment. State what her evidence for her own bias is; it can''t be a bare stipulation
  that she''s miscalibrated.

  4. Looking is costless: no time, no money, no risk that the instrument lies. So
  the only thing that can make declining to look attractive is the accuracy math itself.


  Then do the demonstration, and I want to be able to check it:

  - Give the numbers. Compute expected inaccuracy (say, expected Brier score on the
  proposition in question, or on whatever partition you use) for the two available
  options — look and respond with her actual rule, versus don''t look and stay at
  her prior — and show the second is lower.

  - Show the counterfactual: expected inaccuracy if she looked and conditionalized
  properly, which must be lower still than both. That ordering is the point of the
  case.

  - Identify exactly which premise of the "free true evidence can''t hurt" argument
  your case violates. Name it and quote the argument''s structure back to me if you
