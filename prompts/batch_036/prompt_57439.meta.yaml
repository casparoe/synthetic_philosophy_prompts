  Subtle errors:

  1. "every algorithm scores exactly the same" — true for the average over all functions
  under uniform distribution, but the gloss drops the crucial qualifier: average over
  *all* possible functions with equal weight, which is an assumption about the problem-generating
  measure, not a fact about the world. Actually the gloss does say "if you average
  over all possible objective functions" — so it''s partly right. The error is in
  the leap from that to "no a priori distinctions" being about the world, and to "inductive
  bias is a mathematical illusion."

  2. "Any method that does well on some problems must do correspondingly worse on
  others" — this is roughly right in the aggregate sense (off-set), but the gloss''s
  implicit corollary — that on a given problem all methods are equal — is wrong. Also
  "correspondingly worse" only holds in the specific sense of the sum over all functions
  of performance.

  3. Conflating "no a priori distinctions between learning algorithms" (Wolpert''s
  title phrase) with "no distinction at all" — the theorem is about a priori (distribution-independent)
  comparison; a posteriori comparison given a known distribution over functions is
  exactly where free lunches live.

  4. Hume: NFL doesn''t vindicate Hume; it presupposes a uniform measure over functions
  — i.e., it assumes a particular (maximally unstructured) prior, and the question
  Hume raised is whether any prior can be justified. Also Hume''s problem is about
  justifying inductive inference to unobserved cases; NFL is about performance comparison
  across algorithms. And crucially, NFL''s uniformity assumption is precisely the
  claim that nature is maximally non-uniform — the theorem shows that *if* you assume
  that, nothing works; but the empirical fact that some methods do work well across
  many real problems is evidence against that assumption. So the direction of inference
  is inverted: rather than "ML success is not evidence of uniformity," ML success
  across diverse domains is evidence against the uniform-over-all-functions hypothesis.

  5. "settles a dispute" — overstatement of a modest result.

  6. Conflation of the learning version and optimization version; the optimization
  version has extra conditions (non-revisiting/static algorithms, and Igel & Toussaint''s
  non-uniform distributions).

  7. Possibly the gloss''s claim that the theorem is about "all possible objective
  functions" including those that are infinite domain etc. NFL requires finite search
  space.


  Also another nice nuance: NFL for supervised learning holds under the assumption
  that the target function is drawn uniformly from all functions of a finite input
  space to a finite output space — and the theorem is often stated for "any two algorithms"
  but really compares expected performance; also there''s the point that NFL doesn''t
  say the *variance* is the same; and the "vertical NFL" theorem says that the average
  performance of any algorithm is the same as random search — but again average.


  Also: does NFL imply random search is as good? For the optimization version, average
  over all permutations of fitness values. Yes, vertical NFL: the average over all
  functions of an algorithm''s performance equals that of random search. So the gloss''s
