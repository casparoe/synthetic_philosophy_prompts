  ---


  I am convening the final session of a small reading group on philosophy of mind,
  and I would like to open it with a poem rather than a paper.


  The topic is Douglas Hofstadter''s strange-loop picture of the mind: the brain —
  which in his strange-loop books he nicknames the careenium — is a seething substrate
  of neurons, and the symbols inhabiting it (his simmballs) are large-scale, fuzzy,
  statistical patterns that get pushed around by one another. On that picture the
  simmball for the self is just one such pattern among many, but it is the one that
  eventually acquires the power to push the others about, and to push itself, so that
  the careenium ends up taking orders from a pattern it is itself made of. Our group''s
  sticking point is the obvious objection: if the neural account of a decision is
  already causally complete, then talk of simmballs pushing seems to be a convenient
  redescription rather than a further push — the causal-exclusion worry. Hofstadter''s
  counter, as I read him, is that the higher level''s causality is real but loose
  and statistical, of the kind that lets us say a whirlpool or a tornado does things
  without imagining a little mechanism underneath competing with the water molecules.


  Please write a poem of 24 to 30 lines that stages this argument in its form. My
  specifications:


  1. Two interleaved registers, each in its own short stanzas: a symbol-level register,
  in which a person mid-sentence decides to retract something they were about to say;
  and a neuron-level register, in which the very same moment is inventoried — ion
  fluxes, thresholds, the arrival and cancellation of activations. The two registers
  should alternate, describing one event, not two.

  2. Let the registers begin as strangers — the neural stanzas clipped, third-person,
  listing; the symbolic stanzas fluent, first-person, narrating. Then, partway through,
  let their syntax start to bleed: a symbolic line''s subject governing a verb that
  lands in the next neural stanza, or a neural clause completing a symbolic thought,
  so that the reader can no longer assign the pushing to one level.

  3. Use a refrain of one word — something like push, or drive, or fire — returning
  four times, once in each movement of the poem, and each time meaning something at
  a different level of description, so that its fourth appearance is ambiguous between
  the two registers rather than belonging to either.

  4. The last two lines should be a single sentence split across both registers, such
  that neither line is grammatical on its own. This is the strange loop made literal;
  do not explain it in the poem.

  5. Do not use the words careenium or simmball anywhere in the poem, and do not name
  Hofstadter, supervenience, or causal exclusion. The ideas should be there in the
  machinery of the verse, not in the vocabulary. Someone who knows the debate should
  be able to say where the exclusion objection bites and where the poem answers it;
  someone who does not should simply get a good poem about changing one''s mind mid-sentence.


  Please write in British English.


