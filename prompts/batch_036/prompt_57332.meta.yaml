  Let me now write the phenomenon precisely, so it''s distinguishable:


  The move: In a dispute about what the first-order moral truth is (are unjust-side
  combatants liable to attack?), a participant objects to a view by citing what would
  happen if people *accepted* it — soldiers would fight without restraint; the laws
  of war would lose their anchor; families would be targeted. The other participant
  then either (a) replies with a counterfactual of their own (if soldiers accepted
  the revisionist truth they''d be *more* restrained, since they''d see themselves
  as having no right to kill) or (b) insists that the consequences of belief are irrelevant
  to truth. And crucially: in practice (a) happens more than (b) — the debate is conducted
  at the level of acceptance-consequences on both sides, and the first-order question
  never gets addressed. Nobody says "you''re confusing two questions"; both sides''
  arguments are taken as responsive.


  What distinguishes it from self-effacing theories: self-effacement is a property
  of a *theory* (a theory that says you shouldn''t act on it directly); here it''s
  a property of an *argument* or a *debate practice* — a substitution of questions
  that goes unremarked, and it''s typically deployed by people who are not consequentialists
  at all, so they can''t coherently appeal to acceptance-consequences. That''s a nice
  twist: the objection is consequentialist in form but made by non-consequentialists
  in a non-consequentialist debate — and the same people reject consequentialist reasoning
  elsewhere in the very same argument. So the phenomenon has a distinctive asymmetry:
  acceptance-consequences are admitted as evidence against a view only when the view
  is unwelcome, and dismissed when they cut the other way. Hmm — that might make it
  "special pleading." But maybe the deeper phenomenon: a debate in which both parties
  are non-consequentialists at the first order yet the disagreement is carried on
  entirely at the second order about the effects of belief, with the first-order question
  treated as settled by it.


