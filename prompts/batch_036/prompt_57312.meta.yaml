  ---


  I am a doctoral candidate in philosophy of economics working on a chapter about
  Keynes''s Treatise on Probability, and I have run into a distinction that secondary
  writers keep collapsing. I would like a careful, self-contained explanation of what
  Keynes''s notion of the weight of an argument is supposed to be doing, and of why
  it resists the standard modern translations of it.


  First, the internal account. Keynes treats probability as a logical relation between
  a body of evidence and a conclusion, and weight as a further property of arguments
  — the amount of relevant evidence, in some sense, backing the relation. Please explain:
  (i) why Keynes thinks two arguments can carry the same probability while differing
  in weight, with a concrete case; (ii) what he takes weight to be doing in practical
  reasoning, given that on his own account a weightier argument need not shift the
  probability balance at all; (iii) why he denies that weights can always be compared
  or measured, and what he thinks follows for the kind of theory probability can have.
  Here I want you to address a tension I cannot resolve on my own: on some readings
  weight is monotonic in the quantity of evidence, while on others it tracks relevance
  or informativeness, and these come apart, so that additional evidence might leave
  weight unchanged or reduce it. Which reading is textually and philosophically defensible,
  and is there a way to hold both?


  Second, the translation question, which is where my own project is stuck. Three
  identifications are routinely proposed, and I suspect all three are too quick:


  - that Keynesian weight is what imprecise-probability theorists (Walley and the
  Ellsberg literature) capture as a set of probability functions rather than a single
  one;

  - that it is the same notion as Knight''s unmeasurable uncertainty, given that Risk,
  Uncertainty and Profit and the Treatise appeared in the same year;

  - that it is simply second-order uncertainty — uncertainty about one''s own probabilities.


  My working formalization is that weight is a measure of the spread, or the cardinality,
  of the set of probability functions compatible with the evidence, and that ambiguity
  aversion is the behavioral shadow of low weight. Please say precisely where this
  goes wrong, if it does. In particular: can a Keynesian argument be both maximally
  weighty and numerically sharp, and can an argument be highly weighty while yielding
  an interval rather than a number? And since Keynesian probability is a relation
  among propositions rather than a state of an agent, explain whether "weight" is
  even the right kind of thing to be compared with an agent''s imprecise credence
  at all. Do the same for Knight, whose contrast is drawn inside a theory of markets
  and insurable risk.


  Third, Ramsey. Explain what his objection to Keynes amounts to — that there are
  no such objective logical relations, or that Keynes never connects them to degrees
  of belief, or both — and then give the strongest Keynesian reply, i.e., the sense
  in which Ramsey is accused of changing the subject from the warrant an argument
  provides to the coherence of an agent''s dispositions. I want to know whether that
  reply is a real rebuttal or a restatement of the disagreement.


  Finally, the continuity question. Does the weight of argument survive into the General
  Theory? Chapter 12''s conventions and animal spirits look psychological rather than
  logical, and the 1937 article restating the argument for the Quarterly Journal of
  Economics distinguishes uncertain knowledge from merely probable knowledge by appeal
  to cases where no calculation is possible. Explain whether the later material is
  the Treatise''s weight applied to long-term expectation, or a different notion doing
  similar work, and what turns on the answer.


  Two constraints. I do not want a bibliography or a list of references, and I would
  rather you paraphrase than quote; I have the texts in front of me and am interested
  in the argument. Where the secondary literature is genuinely divided, tell me so
  and say which division you are taking, rather than writing as though there were
  a settled reading.


