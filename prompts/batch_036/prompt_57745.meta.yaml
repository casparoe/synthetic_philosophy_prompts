  Passage draft:


  "It will be said that the survivors of the long-boat did well to abstain from choosing,
  since whosoever chooseth among lives taketh upon himself the guilt of those he leaveth
  behind. But this is a coward''s casuistry. To forbear from choosing is not to escape
  the choice; it is only to remit it to the strongest arm and the sharpest elbow,
  and to charge the issue to an account which no man keeps. Necessity will have a
  distribution; the question that remains open to honest men is not whether one shall
  be made, but by what measure, and by whose hand.


  The measure cannot be worth, for worth is known to God alone and is in any case
  equal in the eye that must judge it. It must therefore be service: what each remaining
  life can be made to yield to the preservation of the rest. The surgeon before the
  sailor, though the sailor be the better man; the woman with infants at the breast
  before the unattached labourer, not for her own sake but for theirs who hang upon
  her. Thus the boat becomes a commonwealth in miniature, and each aboard is a magistrate
  to his neighbour.


  Here an objection ariseth which I have not seen answered. If service be the measure,
  then he that applieth it is measured by it also; and if he be found wanting, as
  the aged and the idle must be, the rule condemns its own author. Wherefore I say:
  the compact is not made in the boat, but upon the quay. A distribution agreed upon
  in the port, in the full light of day, by men who know not which of them it shall
  favour, binds the conscience; the same distribution, devised at midnight by men
  who know precisely whom it favours, binds nothing and excuses no one.


  And let no man comfort himself with the metaphor of the ballast. For the ballast
  is not carried for its own sake but for the ship''s; and yet when the water comes
  aboard it is the first thing cast out. So it fareth with all whom necessity maketh
  instruments: they are valued and they are thrown away in the same breath, and the
  valuing is the reason for the throwing away.


  I conclude, then, that the long-boat is a place wherein no man can be good, though
  many may be righteous. Charity reckoneth by heads and is spent upon the nearest;
  justice reckoneth by consequences and is spent upon the whole. Where there is not
  enough for the whole, charity hath no object left her, and only justice can be obeyed;
  and obedience is a cold companion."


