  But ''shrinking the space of futures'' only counts as harm if the futures that are
  lost were worth having; a world-line in which all the paperclips are slightly misaligned
  is a lost future too. So any impact measure is implicitly a value function, and
  the whole project of defining low impact ''value-neutrally'' collapses into a triviality:
  the agent that minimizes side effects minimizes... doing anything at all. My question:
  given that the collapse is unavoidable, is there any content left to the claim that
  impact measures are value-neutral, or should the chapter just say that low-impact
  AI is an incoherent ideal and go straight to full preference specification?"


  The false presupposition: that value-neutrality means "no normative assumptions
  whatsoever," and that recognizing an impact measure as implicitly valuing something
  collapses the project. The good answer would note: value-neutrality is a matter
  of degree — the claim is that impact measures require *far less* value specification
  than a full utility function, not none; they are proxies that aim to be robust across
  a wide class of value functions rather than neutral in the sense of presupposition-free;
  also "doing nothing has zero impact" doesn''t mean "any action has huge impact"
  — the point is that side effects are measured relative to a baseline (inaction/default),
  and the objection that "lost futures include trivially similar ones" is handled
  by discounting or by the fact that AU-preservation measures loss of *attainable
  utility* across auxiliary reward functions, which is explicitly a family of value
  functions, not value-free. Also the "collapse into do-nothing" is a known problem
  (the conservatism/paralysis objection) and is addressed with baselines, and the
  whole point is that impact measures are one *component* of an objective, not the
  entire thing. And there''s a subtlety: the objection as stated is not new — it''s
  basically the "value-neutrality is impossible" critique that Krakovna and others
  engage with; they claim *relative* neutrality. Also, whether "the agent minimizing
  side effects minimizes doing anything at all" — actually the standard response:
  impact penalty is combined with a task reward; the trade-off is calibrated so that
  the agent accomplishes the task while minimizing side effects.


