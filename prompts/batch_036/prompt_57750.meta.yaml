  (1) Nadia opened by saying the decision-theory literature already settles this.
  Good''s theorem on the value of information says that if the evidence is free —
  no cost to acquire, no cost to use — then in expectation it cannot make you worse
  off, provided you update on it and then choose the act that maximizes expected utility
  given what you''ve learned. The proof is just the inequality "the expectation of
  a maximum is at least the maximum of an expectation": whatever act you would have
  chosen in ignorance, you can still choose it after learning, so the best you can
  do with the information is at least as good. On Nadia''s telling, R. is either wrong
  about the theorem''s applicability or wrong about her own reasons.


  (2) Owen replied that the theorem''s assumptions are exactly what fail here. R.
  isn''t claiming she''d be better off ignorant in the calculator''s terms; she''s
  saying she doesn''t trust herself to be the calculator. She expects that a positive
  result would push her into months of despair in which she''d make decisions she''d
  now judge badly. Good''s theorem is a theorem about an agent who re-optimizes correctly
  on her posterior. For an agent who won''t, free information can easily have negative
  value, and the person who knows that about herself is reasoning well, not badly.


  (3) Nadia said that''s not an objection to the theorem but a confession. If R. expects
  to respond irrationally, then the right response to her expectation is to fix the
  irrationality, not to arrange the world so as to accommodate it — the way you hand
  your car keys to a friend when you''re drunk rather than deciding in advance never
  to learn whether you''re drunk. Also, she said, the emotional cost of knowing isn''t
  outside the utility function: put knowledge itself into the utility function, let
  the utilities of outcomes depend on whether you know them, and run the same inequality
  over the possible test results, and you still get "expected utility with the test
  ≥ expected utility without." So the theorem is robust to the very feature Owen was
  leaning on.


  (4) Owen said that move proves too much, and in doing so empties the theorem. Once
  the utility function is allowed to depend on what you know, any pattern of preferences
  over knowing and not-knowing can be represented, so the theorem no longer constrains
  anything: it just says that someone who maximizes expected utility, defined however
  you like, maximizes expected utility. On his telling, the substantive question —
  whether knowing is good for R. — is entirely in the utility function, and the theorem
  contributes nothing to answering it.


  (5) Nadia said the theorem still has bite, and the bite is where Owen hasn''t looked.
  It rules out a certain kind of reason. "I''d rather not know" cannot stand on its
  own as a justification; it has to be cashed out either as a claim about R.''s utilities
