  Draft:


  "I am drafting the framing section of a dissertation chapter on the paradox of deontology,
  and before I survey the proposed resolutions I want the specification rather than
  the survey: what would a theory have to deliver to count as resolving the paradox
  at all, as opposed to restating it? Set out the desiderata — the phenomena such
  an account must explain, the cases it must get right, the distinctions it must not
  collapse, the structural constraints on its form — giving, for each, the case or
  consideration that motivates it.


  To make sure we are talking about the same puzzle, I take it to be this: a deontological
  constraint (do not kill, do not lie, do not break your promise) is standardly motivated
  by the badness of killings, lies and broken promises; yet if that is what motivates
  it, the constraint appears to forbid precisely the act that would prevent the greater
  number of the very same bad things, and the agent who obeys seems to be caring less
  about the value the constraint was meant to track. A resolution should be assessed
  against that shape of puzzle.


  Among the desiderata I want considered (add, drop or reformulate as you judge best):

  1. Formulation-independence: the paradox must be shown to survive, or to dissolve,
  when the constraint''s basis is restated without reference to outcomes — e.g. in
  terms of not using a person merely as a means. Say what the account owes here.

  2. Scope across constraint types: the pull of "do not minimise violations" differs
  sharply between killing one to prevent five killings and, say, a statistical regulator
  bound by a confidentiality undertaking who can prevent the unauthorised disclosure
  of a hundred firms'' data only by disclosing one firm''s data herself. An account
  that explains the intuition in the first case should explain why it is weaker in
  the second, or explain away the difference.

  3. Doing versus allowing, and the asymmetry within doing: why may I not kill one
  healthy patient to save five, yet may I kill an attacker to save five, when in both
  cases five killings are prevented?

  4. Second-order latitude: whether the account can make sense of the fact that we
  may permissibly spend resources to reduce violations by others (lobbying, policing,
  education) while being forbidden to reduce them by violating ourselves — and whether
  this is a datum or a confusion.

  5. Residue: what the account says about regret, compensation and moral distress
  in the agent who rightly declines to violate.

  6. Institutional transfer: whether whatever dissolves the paradox for an individual
  agent also governs the design of legal rules that forbid officials from violating
  rights even where violation would prevent more violations.


  For each desideratum, mark whether it is non-negotiable for a resolution, or whether
  it is in fact a substantive commitment of one camp smuggled in as a criterion (I
  suspect several of the above are, and I want to know which). Then say explicitly
  whether any subset is jointly unsatisfiable — in particular whether formulation-independence
  can be met together with a demand that the account explain the constraint''s resistance
  to numbers — since if not, the list is itself the result I need. Finally, identify
  which single desideratum eliminates the largest share of familiar moves (agent-relative
  value; side-constraints understood as non-teleological; threshold deontology; the
  doing/allowing distinction; the claim that the paradox is merely verbal), and give
  me a sentence or two on each of those five against the list. No bibliography — I
  want the criteria, not the literature."


