  The paradox of deontology: deontological constraints prohibit certain acts (e.g.,
  killing one to save five), yet they are justified by the badness of the outcome
  (minimising killings). So the constraint seems to forbid the act that minimises
  the very violation the constraint is against. Standard responses: agent-relativity
  of value, side-constraints (Nozick), the distinction between doing and allowing,
  threshold deontology, the "murderer at the door"/self-parodying.


