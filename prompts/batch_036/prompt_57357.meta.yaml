  Deflationary truth: The desiderata list for a theory of truth: (1) capture all instances
  of the T-schema / equivalence schema; (2) handle the liar and other paradoxes without
  ad hocery; (3) explain truth''s generalizing role (infinite conjunctions, "everything
  the Pope says is true"); (4) explain the normativity of truth (aim of belief, assertion
  norms); (5) explain truth''s apparent substantive role in scientific realism debates;
  (6) compositional adequacy / explain the finite derivability of all instances from
  finitely many axioms (horizontally/vertical); (7) handle truth-value gaps and vague
  predicates; (8) explain why truth appears explanatory in e.g. "the problem with
  the argument is that its premises are true"; (9) be conservative over a base theory
  (not prove new non-semantic facts); (10) accommodate "truth is what you aim at in
  inquiry" and disagreement; (11) account for the distinction between truth and warrant,
  the possibility of error. Which are non-negotiable vs camp-prejudices: e.g., deflationists
  reject (5)/(6) as substantive-theory prejudice; non-deflationists reject the demand
  that the T-schema be exhaustive. Which subset is jointly unsatisfiable: capturing
  all T-instances + handling liar + classical logic (that''s basically Tarski''s theorem:
  no classical consistent theory contains all T-sentences for its own language). So
  the impossibility: classical logic + all T-instances + truth predicate for own language
  → inconsistency (Tarski/Liar). Also: explanatory power + conservativeness: Field''s
  deflationism requires truth to have explanatory power beyond what''s derivable,
  but the conservativeness result (Horsten, Shapiro, Ketland) shows that adding truth
  axioms is non-conservative over base arithmetic — so if deflationism requires conservativeness,
  then truth can''t do the explanatory work (like proving Con(PA)) that realists/abductionists
  want. That''s a nice "the list itself is a result" hook.


