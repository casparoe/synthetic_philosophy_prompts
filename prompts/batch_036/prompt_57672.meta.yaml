  Chain:


  Premise (1): What evidence does is narrow the space of theories compatible with
  it; confirmation is a matter of how well a theory is discriminated from the alternatives
  that were genuinely available.


  Premise (2): Sometimes we acquire reason to think that the space of available alternatives
  has been thoroughly canvassed without our touching the data at all — most obviously
  when a large, well-resourced community has searched for a competitor for decades
  and produced none, when a single framework keeps turning up unexpectedly in domains
  it was not designed for, and when past episodes in which no rival was found ended
  with the framework being empirically vindicated.


  Premise (3): In such a case it is rational to raise one''s confidence, and this
  is confirmation in the full sense, not a placeholder awaiting evidence.


  Premise (4): String theory meets the conditions: decades of intense effort, no rival
  quantum theory of gravity of comparable scope, plus unexpected payoffs it was never
  built to deliver — a microscopic accounting of certain black hole entropies, and
  a duality that turns otherwise intractable strongly coupled problems into soluble
  weakly coupled ones.


  Premise (5): So string theory is confirmed, and the complaint that it makes no predictions
  at energies we can reach misses the point.


  Premise (6) [journalist''s extension]: The same argument, applied to the most promiscuous
  multiverse hypothesis — one on which every consistent assignment of physical parameters
  is realised in some region — is stronger still. No observation could fail to be
  compatible with it, so the search for an alternative is guaranteed to fail, and
  the failure is thus maximally informative.


  Premise (7): Nothing could be more thoroughly discriminated from its alternatives
  than a theory with none.


  Premise (8): So (6) and (7) with (1)–(3) entail that the most contentless cosmology
  available is the best-confirmed theory we have.


  Premise (9): That is intolerable, so (1)–(3) must be false and confirmation must,
  after all, be empirical.


  Where''s the flaw? Several candidate diagnoses:


  (a) (6)/(7) equivocate on "no alternatives". In (2), "no alternative has been found
  by a diligent community" is evidence because the search was conducted under conditions
  where a rival, if it existed, would plausibly have been produced; the probability
  of failure given a rival is low. For the promiscuous multiverse, "no alternative"
  is not a fact about the state of enquiry but a structural feature of the theory:
  it is compatible with everything, so its "no rivals" status is not the output of
  a search whose failure would be surprising. The argument in (2) is an inference
  to the best explanation of a surprising absence; where the absence is unsurprising,
  it carries no information. Formal: the no-alternatives argument is a meta-induction
  whose force depends on P(no rival found | rivals exist) being low; for a catch-all
  theory, the relevant likelihood ratio is 1.


  (b) (7) is false on the theory''s own account: (1) says confirmation is discrimination
  from alternatives that were *available*; a catch-all theory has no available alternatives
  not because enquiry exhausted the space but because it doesn''t stake any claim
  the space could contradict. Also, there''s a subtlety: the multiverse hypothesis
  does have alternatives (a single-universe hypothesis, a different measure, different
  level of multiverse), and its rivals are empirically underdetermined precisely in
  the way string theory''s aren''t... Actually, that cuts both ways: the multiverse
  does have live alternatives (e.g., the "no multiverse" hypothesis), and the failure
  to discriminate among them is not because a search was exhaustive.


  (c) (9) is a scope/quantifier overreach: showing that an argument proves too much
  in one application doesn''t refute its premises; it shows a premise needs a restriction.
  The right conclusion is that (2) needs an added condition, not that confirmation
  must be empirical.


  (d) Also, (6)–(8) may misdescribe the source''s view: the philosopher''s argument
  was never a general principle of the form "absence of alternatives confirms" but
  a claim about particular epistemic situations with a specific background — so the
  reductio attacks a straw version. Then the question becomes: is the restriction
  principled or gerrymandered to save string theory?


  Costs:

  - If you reject (2)/(3) outright (i.e., insist confirmation is empirical), you must
  condemn as irrational a great deal of actual scientific practice: confidence in
  general relativity between 1915 and the eclipse observations, in the existence of
  atoms before their direct detection, in inflationary cosmology, in claims about
  the interior of black holes and the first instants of the universe, in the standard
  model''s extension to energies no collider reaches. You''d have to say that physicists
  were irrational to believe these, or that they were merely "working hypotheses"
  — and then explain why the working hypothesis status is compatible with building
  a 10-billion-euro machine on it.

  - If you keep (2)/(3) and reject (6)/(7), you owe a criterion for when the absence
  of a rival is informative. Candidates: the search must be one in which a rival would
  have been found had it existed (a "search reliability" condition); the theory must
  be specific enough that some conceivable rival is ruled out by it; the background
  meta-induction must be drawn from cases that were eventually tested. Each of these,
  you must argue, is satisfied by string theory and not by the catch-all multiverse
  — and a sceptic will say this is reverse-engineered.

  - If you reject (4), you deny the premise the whole thing rests on: that the search
  for a rival to string theory has genuinely been exhaustive and competently conducted.
  This may be the cheapest exit but it is an empirical/sociological claim about a
  field, and it commits you to saying the field is less mature than it appears — or
  that loop quantum gravity, causal set theory, asymptotic safety, etc. are genuine
  rivals whose existence defeats the no-alternatives argument. Note: this is actually
  the strongest empirical objection and the source likely underestimates it.

  - If you reject (9)''s leap: the argument doesn''t refute non-empirical confirmation;
  it refutes an unrestricted version. Then you must say what remains.


  Also there''s a nice further wrinkle: (6) and (7) may in fact not be absurd. Some
  people do think that the "everything is realised" multiverse is a maximally simple/likely
  prior (e.g., in Tegmark''s modal-realism-ish framing, or the "universal prior" argument).
  And there is a real philosophical point that (7) confuses confirmation with informativeness.
  Also: even for the catch-all multiverse, the *measure problem* means it isn''t well-defined,
  so it doesn''t make predictions at all, and hence (1)''s discrimination account
  doesn''t apply because the theory doesn''t determine a probability distribution
  over observations. That''s a good technical point: the catch-all multiverse''s failure
  is not "no rivals" but "no well-defined likelihoods".


