  only a mapping plus a reading mechanism?

  3. Is the informational content fixed at fertilization (a complete specification)
  or only relative to an environment/developmental context?

  4. Does "code" entail representation/meaning (semantics), or is it only a many-to-one
  causal correlation (syntax)?

  5. Are genes special among the causes of the phenotype, or is DNA''s privilege only
  one of many inherited resources (parity thesis)?

  6. Is the correct analysis of "gene" informational/semantic, causal/difference-making,
  or purely chemical (template)?

  7. What happens with codon reassignment: does it show the code is conventional (supporting
  literal codehood), or that there''s no code at all, only local causal regularities?


