  Question 4 (25 marks, from the ''Coercion and Constraint'' section):


  "A great deal of the argument against torture in ticking-bomb cases is empirical
  and institutional: permitting it corrupts the agencies that carry it out, brutalises
  the individual torturer, and in practice spreads well beyond the narrow category
  of cases that was supposed to justify it. Now suppose a polity deploys an automated
  system that administers strictly calibrated, non-lethal, non-permanent pain to a
  detainee under judicial authorisation, with no human being in the room, no human
  hand on any control, and a complete public audit trail. Assume for the sake of argument
  that the institutional-spread and agent-degradation objections are fully neutralised
  in this case. Does the deontological objection to torture survive the substitution?
  Discuss."


  Student''s answer:


  "The question asks us to suppose away the two strongest practical objections, so
  what remains has to be assessed on its own terms. That is worth doing, because most
  of the anti-torture literature leans very heavily on consequences: the corruption
  of institutions, the slippage from the exceptional case to the routine one, the
  damage done to the people who carry the act out. If we stipulate all of that away,
  the absolutist is left having to say that the act is wrong independently of anything
  it brings about, and that is a much harder claim to defend.


  The first thing to notice is that the machine solves the reliability problem. Ordinary
  ticking-bomb cases founder because torture is a poor instrument for extracting accurate
  information: the detainee says whatever stops the pain, and the torturer has no
  way of checking it. Here the system is programmed to stop the moment reliable information
  is given, and the whole audit trail is inspectable, so the polity can be confident
  it has actually got what it needed. That is a real improvement on the human case
  and the question is right to build it in.


  Second, and to my mind more important, the absence of a human torturer means there
  is no one in the room who uses the detainee as a mere means. The Kantian objection,
  if that is what the deontologist is running, needs an agent who treats another person
  as a tool for their own purposes. A machine has no purposes. It is not choosing,
  not expressing contempt, not enjoying anything. So the specific wrong that the objection
  identifies — being made into an instrument of another''s will — does not occur.
  What is left is only the suffering, and the suffering has been stipulated to be
  calibrated to the minimum necessary, non-permanent, and no worse in quantity than
  the discomforts we already impose lawfully on detainees, for instance in conditions
  of solitary confinement which few people call torture. If we compare like with like
  on intensity, the automated case looks no worse.


  There is a point on the other side which I should register. The audit trail is public,
  so the polity is openly declaring that it will do this. One could say that the contempt
  is expressed by the state even though no individual expresses it, and that transparency
  makes it worse rather than better, since the humiliation is documented. That is
  a genuine worry. But it shows only that automation changes who the agent is, not
  what is done — and if what is done is not in itself wrongful, as I have argued,
  then a change of agent cannot make it wrongful.


  So on balance I think the deontological objection does not survive the substitution.
  The empirical strands have been stipulated away by the question, the agent-relative
  strand has no agent to attach to, and the suffering strand has been reduced to a
  level we already tolerate elsewhere. Absolutism about torture turns out to depend
  on facts about human beings and human institutions, and once those facts are altered
  the position loses its grip."


  That''s their whole answer. The mark scheme is the generic one for the paper: argument,
  relevance to the question set, and precision.


