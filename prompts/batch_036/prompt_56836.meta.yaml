  Describe three camps concretely:

  1. The "dissolvers": exact ties are measure-zero artifacts; and even granting them,
  if both options are maximally ranked, choosing either is permitted, so there''s
  no irrationality; the ass''s starving is a failure of physiology/computation, not
  of decision theory. Some add: any real agent will have sub-agential asymmetries
  (noise, tiny preference differences), so the case never arises.

  2. The "tie-breakers": rational choice requires that the choice be non-arbitrary;
  if the agent cannot cite anything that favors left over right, the choice is not
  really an exercise of practical reason. So rational agents need an extra resource:
  a randomizing device, a default rule, a second-order preference, or a standing policy
  ("in ties, go left"). Some hold that a rational agent must adopt a tie-breaking
  policy in advance (and it''s irrational not to), and that this shows the standard
  expected-utility framework is incomplete — it needs a primitive for tie-breaking,
  not just a preference ordering.

  3. The "voluntarists"/action theorists: the interesting residue isn''t normative
  but explanatory. If nothing in the agent''s motivational set differentiates the
  options, nothing explains the particular outcome; so either the will is a distinct
  causal power (the classic voluntarist move), or the choice is a brute event, or
  causal theories of action fail in these cases. Some in this camp say the decision
  theorists are missing the point entirely: the puzzle is about agency and explanation,
  not about what maximizes.


