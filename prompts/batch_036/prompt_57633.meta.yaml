  Frame problem verdicts: "Here are my verdicts about what a system must and must
  not do." Cases:

  1. A robot that, when told to push a wagon out of a room, must deduce that the wagon''s
  color hasn''t changed, that the walls are still there, that the president''s phone
  number is unchanged. Verdict: this is the original frame problem — a genuine defect,
  but it''s a defect of an implementation, not of the logic.

  2. A system that solves it by having a "sleep axiom" per fluent: I''m fine with
  it as long as there are only finitely many, but I think it''s a bad solution because
  the axioms scale with the number of fluent-action pairs.

  3. A system that solves it by defaulting to persistence (nonmonotonic, retractable):
  acceptable.

  4. A system that requires explicit mention of everything that changes but has no
  closed-world assumption: I think it fails on the "qualification problem" — my verdict:
  the qualification problem is a *different* problem from the frame problem, though
  they''re usually conflated, and a solution to one needn''t solve the other.

  5. A system that solves it semantically (circumscription-style, minimizing change
  in models rather than in derivations): I think this genuinely solves the frame problem
  but only at the cost of the "ramification problem" — I accept that.

  6. A system that solves it via "successor state axioms" in the situation calculus
  (Reiter): acceptable but requires complete causal knowledge, so it''s a *practical*
  solution to the frame problem that doesn''t touch the epistemic version.

  7. Cases about human agents: a chess player who does not compute that pushing a
  pawn doesn''t change the color of the squares — verdict: humans solve it not by
  inference but by never representing the irrelevant facts; therefore a system that
  solves it by fast relevance-detection (e.g., learned) counts as solving it, even
  though it can be wrong. Hmm — that''s the interesting tension: is a probabilistic/approximate
  solution acceptable? My verdict: yes for a robot in a kitchen, no for a theorem
  prover. That yields tension with a principle "relevance must be logically guaranteed".

