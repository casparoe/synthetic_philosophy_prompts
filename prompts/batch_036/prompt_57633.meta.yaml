  ---

  I am drafting the third section of a paper on the frame problem, in which I want
  to argue that "solving the frame problem" is not a binary notion. Before I commit
  to the argument, I want to know what principle, if any, is actually driving my verdicts,
  because I suspect my intuitions are inconsistent. Below are the cases and what I
  judge about them. Please tell me whether there is a single principle that gets them
  all, or a small set of candidates; state any candidate precisely, note which of
  my cases motivates each of its clauses, tell me what it implies about cases I have
  not considered, and say plainly which of my verdicts it cannot save and should therefore
  be revised.


  The cases. Let "S" be any system that decides what will be true after an action,
  and let the target be a claim about something the action intuitively leaves alone.


  1. A 1969-style program that, in order to plan to push a wagon out of a room, must
  first derive from explicit "frame axioms" that the wagon''s colour, the number of
  walls, and the telephone number of a colleague all remain as they were. Verdict:
  defective, and not merely slow — it fails at a task it should be able to do at all,
  since the number of axioms it needs grows with everything it knows rather than with
  what it does.


  2. The same program, but each axiom of persistence is a defeasible default that
  can be overridden. Verdict: this counts as a solution, even though the system can,
  in principle, draw a false conclusion about what stays the same.


  3. A system that treats persistence as a constraint on models — the intended outcome
  is the one that changes least — rather than as something derived. Verdict: solution,
  and a better one than 2; I do not mind that it needs the notion of "least change"
  to be pinned down by a metric or an ordering I supply.


  4. A system that gets by with a small set of explicit causal laws and derives, for
  each fluent, a complete condition for when it changes (the successor-state style
  of solution). Verdict: solution, but only relative to a closed world. If the causal
  laws are incomplete, I do not say the system has failed to solve the frame problem;
  I say it has been given bad data. I want to hold onto this distinction between incompleteness
  of the theory and failure of the inference.


  5. A human chess player who moves a knight without representing, even implicitly,
  that the colour of the squares, the rules of castling, and the weather outside are
  unaffected. Verdict: not a solution to the frame problem at all — the problem does
  not arise for the player, because there is no stage at which the irrelevant facts
  are candidates for change. This is a good result, not a failure, but it means "solved"
  is the wrong word.


  6. A robot in a kitchen that uses a learned relevance filter which is right about
  99% of the time and, when wrong, notices the discrepancy through perception and
  repairs it. Verdict: solution, fully, not second-class.


  7. A theorem prover about a physical theory that uses exactly the same learned relevance
  filter with the same error rate. Verdict: not a solution. It must be right about
  what does not change, not merely usually right.


  8. A system that lists, for every action, every precondition under which the action
  fails to have its usual effect, thereby solving the problem of what could go wrong.
  Verdict: this solves a different problem from the one in cases 1–4, and a system
  could solve this one while still failing those, and vice versa. I want the two problems
  kept apart, but I also think a system that solves case 1''s problem and not case
  8''s has done the more important half.


  9. A system whose representation of the world after an action is correct about all
  direct effects and about all persistence, but which cannot handle effects that follow
  from other effects — the moving wagon knocks over the lamp. Verdict: it has solved
  the problem in cases 1–4 and not the problem in case 8, and I consider it, on balance,
  more useful than a system with the reverse profile.


  10. The claim that no purely symbolic system can ever solve the problem, because
  relevance is fixed by an agent''s practical involvement with its surroundings rather
  than by any set of sentences. Verdict: as an argument, unsound; as a prediction
  about how the problem will be solved, I take it seriously in light of case 6 and
  case 5.


  My working hunch, which I would like you to test rather than assume: what I am tracking
  is whether the system''s burden of establishing that things stay the same grows
  with how much the system knows about the world, or only with what it is doing; and,
  where the burden is acceptable, whether errors about persistence are detectable
  and correctable by the system itself. If that is my principle, please say which
  cases it gets right and wrong — I already suspect 6 and 7 strain it, since the two
  systems have identical epistemic burdens and differ only in what a mistake costs.
  If it is not my principle, offer the alternatives...


  Also: please do not answer with the standard survey... Instead, ... Please also
  generate three further cases of your own... and give my principle''s verdict...
  and flag if a case would divide the candidates.


  Finally, tell me whether the word "solve" in this literature is doing graded work
  or whether my verdicts are best re-described as verdicts about engineering quality
  rather than about the frame problem as such — i.e., whether I should retreat to
  a weaker claim.

