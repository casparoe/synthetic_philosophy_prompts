  and we ended up in exactly the place that makes me want an outside adjudication:
  not about what Hume said, but about what he would say now.


  Here is the shape of the disagreement. My friend reads Hume as, in effect, an early
  dove. He points to the claim in Of Money that a slow, gradual increase of the circulating
  medium is favourable to industry, because in the interval between the arrival of
  new money and the general rise of prices the additional money quickens diligence
  and enlarges profits; he points to Hume''s insistence in Of Interest that low rates
  of interest are a symptom of a flourishing commercial nation rather than a cause
  of it or a sign of mere monetary abundance; and he points to the approving treatment
  of paper credit, which lets the precious metals be exported and employed abroad
  while paper does the work of circulation at home. On that reading Hume would have
  shrugged at quantitative easing, welcomed the two percent inflation target as the
  institutionalization of his own preferred gradual expansion, and been relaxed about
  public debt denominated in a currency the state issues.


  My reading is nearly the reverse. I take the gradual-increase argument to be a claim
  about a windfall of specie earned through trade, not about a policy instrument;
  I take the dominant conclusion of Of Money and Of the Balance of Trade to be long-run
  neutrality, with money as the oil that eases the wheels rather than one of the wheels,
  and with the insistence that a nation which acquires more money than its level will
  lose it again, because dearer labour and commodities hand its foreign markets to
  cheaper rivals. I also take his warning about over-issued paper and his alarm in
  Of Public Credit to be of a piece: the danger of a state that finances itself on
  the strength of its own promises. On my reading, Hume''s mechanism depends on the
  new money arriving unannounced and reaching the hands of the industrious, and a
  rule announced in advance, at a fixed rate, with the injection made by swapping
  central-bank reserves for government bonds, satisfies neither condition.


