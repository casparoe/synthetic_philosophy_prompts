  Draft essay text:


  **The error bars are not where the objection lives**


  1. Setting up. Over the past decade or so, a familiar objection to effective altruism
  has run roughly as follows: the movement''s cost-effectiveness analyses systematically
  favour interventions whose benefits can be counted — lives saved, cases averted,
  income gained — and systematically disfavavour those whose benefits resist quantification,
  such as political advocacy, institutional reform, research capacity-building, or
  simply not doing something harmful. Because the analysis then produces a ranking,
  and because rankings are what drive allocations, the objection says, measurability
  bias becomes a mechanism for quietly importing a political quietism... Note the
  standard reply: evaluators do not claim their numbers are precise; they publish
  wide uncertainty ranges, discuss caveats at length, and often say plainly that they
  cannot assess an intervention quantitatively. On this view, the objection attacks
  a naive version of the methodology that no serious practitioner holds.


  2. Two sorts of uncertainty. My claim is that this reply fails, and that it fails
  for a reason worth stating carefully, because the reason generalises. Consider two
  ways an estimate can be uncertain. The first is uncertainty about parameters inside
  a model whose shape is agreed: how large the treatment effect really is, how much
  of the observed effect is attributable to the intervention, how far it generalises
  to the population in question. The second is uncertainty about whether the model
  has the right variables in it at all — whether the thing being estimated is the
  thing that should be estimated. These are not different degrees of the same thing.
  Widening a distribution over a fixed quantity does not, in principle, represent
  the hypothesis that the quantity is the wrong one to be distributing over. A ninety-five
  per cent interval that runs from "small effect" to "very large effect" is silent
  on, and cannot be stretched to include, "effect of a kind we are not measuring".


  3. Why the failure is self-concealing. The consequence, and the interesting part,
  is that this is not a case where the methodology is merely incomplete. It is a case
  where the incompleteness is invisible from inside the published artefact. A reader
  encountering a cost-per-outcome figure with a range and a caveats paragraph cannot
  tell whether the range represents parameter uncertainty, structural uncertainty,
  or — as I suspect is usually the case — a mixture in which the structural component
  has been absorbed into the parameter component, because the latter is the one the
  model can express. The objection that "you are not measuring the things that matter
  most" is therefore answered by pointing at a device that was never capable of answering
  it, and the answer is accepted because the device looks appropriately humble. I
  want to call this humility that has been relocated rather than earned. (I''d welcome
  a better phrase.)


  Then: The same shape of problem appears in the movement''s career advice. An earning-to-give
  comparison models expected salary and expected marginal value of donations, and
  does so with explicit uncertainty; what it generally cannot represent is that the
  comparison depends on assumptions about counterfactual replacement — whether the
  job would otherwise have gone to someone equally committed — and about the effect
  of the career on the person''s later values, both of which are structural rather
  than parametric.


  4. What I think follows: a disclosure requirement. If the point is right, the remedy
  is not better estimates but a different kind of published statement. For each intervention
  ranked, the analysis should carry a short, mandatory section listing outcomes deliberately
  excluded from the model, together with: (a) a qualitative argument, not a number,
