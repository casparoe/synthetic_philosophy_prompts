  many think the revisionist/traditionalist dispute is largely about whether ethics
  is meant to guide agents in the moment or to assess practices — a difference in
  the function of moral theory. Plus a hidden empirical question: does the moral inequality
  view, if adopted, actually lead to more civilian restraint or to endless claims
