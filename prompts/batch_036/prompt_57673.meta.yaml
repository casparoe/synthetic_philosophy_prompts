  Option A: Norms of assertion. Stalled since 2000 (Williamson''s Knowledge and Its
  Uses... actually "Knowledge and Its Limits" 2000). Positions: knowledge norm (Williamson,
  DeRose, Hawthorne), truth norm (Weiner, Reynolds), justified/reasonable belief norm
  (Lackey, Kvanvig, Douven), and the "excuse" maneuvers. Data: lottery assertions,
  Gettier-case assertions, Moore-paradoxical assertions, selfless assertions (Lackey''s
  case of the teacher asserting something she doesn''t believe but has overwhelming
  evidence for — the good teacher case), and cases where assertion is blameless but
  wrong. Diagnosis candidates: (1) verbal dispute over ''norm'' — constitutive rule
  vs. standard of correctness vs. action-guiding rule; (2) different questions — what
  makes an assertion correct vs. when an assertion is blameworthy vs. what entitles
  a hearer to believe; (3) hidden disagreement about whether the norm must be followable
  (ought implies can / guidance) — this is the real hinge, e.g., Williamson rejects
  the guidance constraint, others accept it; (4) the data are intuitions that are
  contaminated by pragmatics (whether we judge the assertion as improper vs. the speaker
  as blameless).


  That''s rich. And what would count as progress: a distinction between correctness
  conditions and permissibility conditions; or agreement on a case class where the
  norms diverge and which intuitions track which; or the observation that knowledge
  and truth norms coincide except in Gettier/lucky cases, so the debate may be about
  a tiny residue of cases and thus not worth much — or that it is precisely those
  cases that reveal what assertion is for.


  Option B: Just war. Moral equality of combatants (Walzer) vs revisionism (McMahan:
  liability tracks justification; unjust combatants cannot permissibly kill just combatants;
  the "moral inequality"). Stalled ~20 years, with a large literature including Rodin,
  Hurka, Fabre, Lazar ("responsibility account" of liability), and the "deep vs. wide
  morality" move (McMahan''s distinction between the deep principles of morality and
  the morality that should govern practice given epistemic limitations). Diagnosis:
  the debate has two separable questions — what individual combatants are permitted
  to do (deep morality) and what the law/conventions of war should say (wide/institutional).
  Walzer and McMahan converge on the law, diverge on deep morality — so is the residual
  disagreement doing any practical work? Also a hidden disagreement about liability:
  whether being a threat suffices, or moral responsibility for an unjust threat is
  needed (Lazar''s responsibility account vs. McMahan). Also a difference in starting
  intuitions: the symmetry of combatants'' experience vs. the asymmetry of the war''s
  justification (jus ad bellum independence — the "domestic analogy" — whether war
  is like a state of nature or like policing).


