  Good combos:

  - "Ask why a debate has stalled": the knowledge norm of assertion vs. truth norm
  vs. belief norm debate. That''s a well-known stalled debate (Williamson''s knowledge
  account of assertion vs. truth norm, e.g., Weiner, Reynolds; vs. justified belief
  norm, e.g., Lackey, Kvanvig). The interesting diagnosis: is the disagreement about
  "assertion" as a term, about which data count (intuitions about cases), about whether
  the norm is constitutive vs. regulative? Actually the deeper structure: each side
  produces counterexamples where their norm predicts wrongness/rightness; the debate
  may be about whether the norm is constitutive of the practice vs. an evaluative
  standard, and about "excuse vs. justification" — i.e., whether cases of blameless
  false assertion are cases of permissible assertion or of impermissible-but-excused
  assertion. That''s a real live hinge: the knowledge account handles lottery/preface
  cases via excuse; the truth norm handles them via... And there''s the fact that
  all sides agree that assertions must be backed by evidence and that assertion is
  the unique speech act that licenses belief in hearers (interpersonal warrant). So
  the diagnosis could be: the debate is partly verbal about the word ''norm'' (constitutive
  rule vs. moral/epistemic evaluation), and partly about a hidden disagreement regarding
  whether a norm can be satisfied by an agent''s blamelessness.


  Also good: the assertion debate stalled because intuitions about cases are doing
  all the work, and the cases are theory-laden (lottery, Gettier, Moore-paradoxical).
  And there''s the challenge that "knowledge" and "truth" norms generate the same
  verdicts in almost all cases, differing only in edge cases — so is the disagreement
  even substantive?


