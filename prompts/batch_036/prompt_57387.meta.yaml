  approximately one-dimensional and non-overlapping. But the recovery problem here
  is structurally the same as the rotation problem in factor analysis: an indefinitely
  large family of bases fits the same data, and the criteria used to select among
  them — sparsity, simplicity, stability under resampling, interpretability of the
  resulting axes — are criteria we bring, not criteria the data dictate.


