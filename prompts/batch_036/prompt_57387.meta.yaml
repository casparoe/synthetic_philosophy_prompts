  §2. There''s a useful precedent, and it isn''t in the philosophy of mind. Mid-century
  psychometrics faced exactly this question about latent traits. A factor analysis
  of questionnaire items yields a structure that predicts the covariance among the
  items; the question was whether the factor is a real attribute of the person that
  causes the responses, or a convenient re-description of the covariance itself. Both
  readings license the same predictions. What separated them was not more data of
  the same kind but a claim about what kind of thing the attribute was supposed to
  be — and, crucially, whether the numerical structure attributed to it was empirically
