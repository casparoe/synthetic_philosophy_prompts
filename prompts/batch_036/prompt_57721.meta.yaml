reasoning_summary: "Let me pick a domain and type. I want a combination that works\
  \ well.\n\nOptions:\n- Letter Spirit (Hofstadter/Chalmers's fluid concepts, letterform\
  \ essence) — interesting and under-explored for LLMs, but risks being niche.\n-\
  \ Moral status of digital minds — overdone.\n- Holocaust: uniqueness, comparability,\
  \ modernity (Historikerstreit, Bauman) — heavy; a thought experiment here would\
  \ be inappropriate. An analogy audit could work: e.g. \"Bauman says the Holocaust\
  \ was a product of modernity — bureaucracy, rationalisation — like a factory\".\
  \ But careful, quoting from memory is forbidden. Could do an analogy type: \"the\
  \ Holocaust as a factory assembly line\" — that's a common analogy. Hmm, risky.\n\
  - Sortition and lottocracy — good domain for all three types. Thought experiment:\
  \ construct a scenario where sortition outperforms elections on a specific criterion.\
  \ Or taxonomy of positions on sortition. Or analogy: \"a jury is like an election\"\
  \ / \"sortition is like jury duty writ large\".\n- Rawls's veil of ignorance and\
  \ difference principle — good for thought experiments. E.g., construct a case where\
  \ the difference principle and a prioritarian principle come apart. Or \"veil of\
  \ ignorance is like buying insurance behind a screen\" (Harsanyi's argument: veil\
  \ of ignorance reduces to maximising expected utility → average utilitarianism;\
  \ Rawls's maximin is a special psychology under uncertainty). Analogy: \"the original\
  \ position is like a lottery ticket where you don't know which number you'll draw\"\
  \ — used to argue Rawls's principles are just expected-utility maximisation (Harsanyi).\
  \ That's an analogy in common use in the literature, and the audit would require\
  \ the model to know Harsanyi's impartial observer theorem and Rawls's three conditions\
  \ for maximin (no knowledge of probabilities, the chooser cares little for what\
  \ he can gain above the minimum guarantee, the alternatives have unacceptable outcomes).\
  \ That's a solid, well-memorised body of knowledge, not too niche.\n\nLet me think\
  \ about which gives the best prompt with \"injecting some new/niche idea\".\n\n\
  Type: Present an analogy in common use and ask how far it holds. Domain: Rawls.\
  \ The analogy: the veil of ignorance is like drawing a lottery ticket without knowing\
  \ your number / being dealt a hand of cards face down → so you should maximise expected\
  \ utility (Harsanyi's impartial observer). But is that \"an analogy people in the\
  \ area actually lean on\"? Yes — the \"you're behind a curtain and don't know who\
  \ you'll be\" framing is used by laypeople to argue for average utilitarianism /\
  \ \"so we should care about total welfare\". Hmm.\n\nAlternatively domain: sortition.\
  \ Analogy in common use: \"a citizens' assembly is just a jury scaled up\" — used\
  \ by sortition advocates to argue that lottocracy would produce competent, public-spirited\
  \ decisions, because juries work. Audit: what maps (random selection, deliberation,\
  \ temporary tenure, no re-election incentive), what breaks (juries decide retrospective\
  \ factual guilt with a burden of proof, a judge instructing them, evidence rules,\
  \ a small homogeneous task, no agenda control; assemblies decide prospective policy\
  \ with no correct answer, no adversarial testing, agenda set by whoever convenes\
  \ them, no appeal mechanism, the \"jury nullification\"/expertise of lawyers absent).\
  \ Smuggled in: the idea that there is a fact of the matter discoverable by evidence;\
  \ that group deliberation reliably converges; that the selection pool is competent;\
  \ that the institution is insulated from capture because jurors are anonymous —\
  \ but in lottocracy the permanent bureaucracy/staff who set the agenda isn't. Conclusion:\
  \ does jury-success transfer to lottocracy?\n\nThat's good and quite well-grounded\
  \ in the literature. But maybe slightly predictable for a model.\n\nAnother option:\
  \ Letter Spirit. Analogy: \"fonts are like dialects of a language\" or \"a letterform\
  \ is like a melody transposed into different keys\" — Hofstadter's Letter Spirit\
  \ project itself used the analogy of... hmm. Actually a nice analogy in common use:\
  \ \"recognising an 'a' across typefaces is like recognising a friend's face across\
  \ ages/photos\" — used by people arguing that letter recognition is just template\
  \ matching plus invariance, i.e. that a CNN trained on glyph images has solved the\
  \ problem. Audit: what maps, where it breaks (faces have no compositional/systematic\
  \ role — an 'a' must be distinguished from 'o' in a way that matters for an unbounded\
  \ system of contrasts, and from 'd'/'q' by orientation, which faces don't have;\
  \ letterforms are defined partly by their role in a system and by context — e.g.,\
  \ in some typefaces 'a' and 'o' differ only by a stroke; the same shape can be a\
  \ letter, a digit, a symbol depending on font/context; the \"essence\" may be style-relative).\
  \ Hmm, that's a nice Letter Spirit prompt. Also: \"the letter is like a species\"\
  \ / \"letterforms are like a family resemblance\".\n\nActually there's a very good\
  \ one for Letter Spirit: people often say a font's letterforms are like a person's\
  \ handwriting — i.e., the \"spirit\" of a typeface is like tone of voice. Hmm.\n\
  \nLet me weigh: the user says \"you'll often have to inject some sort of new/niche\
  \ ideas into the prompt\". So the prompt should contain a concrete, slightly idiosyncratic\
  \ scenario/invention of the asker's own, so the model can't just regurgitate.\n\n\
  Combination: Type = thought experiment constructed to spec. Domain = Rawls.\n\n\
  Idea: Construct a thought experiment in which the difference principle and (a) lexical\
  \ priority of liberty, or (b) a prioritarian principle, come apart... Hmm. Better:\
  \ construct a case where the veil of ignorance generates maximin but the difference\
  \ principle (as a principle for the basic structure) gives a different verdict than\
  \ what the parties behind the veil would choose — i.e. isolating the \"subject of\
  \ justice\" variable. Or: a case where the two principles of justice in Rawls's\
  \ final formulation (with fair equality of opportunity) and the difference principle\
  \ come apart in a direction people find hard to construct: a change that improves\
  \ the position of the least advantaged but worsens fair equality of opportunity\
  \ — because Rawls's second principle has lexical ordering (FEO prior to DP), so\
  \ such a change is forbidden even though the worst off gain. That's a real and interesting\
  \ constraint, and well within memorised Rawls.\n\nBut maybe more interesting and\
  \ less predictable: a thought experiment where the parties behind the veil would\
  \ choose something other than the difference principle while still satisfying Rawls's\
  \ own stated conditions for maximin (the three special features: no knowledge of\
  \ probabilities / no basis for estimating likelihoods; a conception of the good\
  \ such that the chooser cares very little for what he can gain above the minimum\
  \ guarantee; the rejected alternatives have outcomes one can hardly accept). Construct\
  \ a realistic, non-sci-fi scenario where all three of Rawls's conditions hold but\
  \ maximin is clearly the wrong rule — showing that the conditions don't do the work\
  \ Rawls needs. That's a well-specified, non-trivial design task. Good.\n\nHmm, but\
  \ which is more compelling for a dataset? Let me consider the sortition + thought\
  \ experiment: Design a selection procedure in which a randomly chosen body outperforms\
  \ an elected one on representation but loses on... hmm, needs care.\n\nActually,\
  \ I quite like combining the Holocaust domain — no, too heavy/risky for a thought\
  \ experiment.\n\nLet me consider \"Letter Spirit\" + thought experiment type. Construct\
  \ a thought experiment: design a typeface-making task where two candidate glyphs\
  \ both preserve the \"spirit\" of the font, and specify that a purely metric/geometric\
  \ account says one is the better 'a' while a style/relational account says the other\
  \ — i.e., isolate which variable does the work. Hmm, that's a nice under-theorised\
  \ design brief. The Letter Spirit domain is genuinely under-trained-on, which is\
  \ a plus for the dataset (models can't regurgitate), but the risk is that a small\
  \ model won't know the domain. However, the prompt itself can supply the needed\
  \ setup: \"the question of what makes every 'a' an 'a'\".\n\nThe user said prompts\
  \ should be meaningful for a model that can't search, and shouldn't refer to super-niche\
  \ theories LLMs won't have memorised. \"Letter spirit\" — Hofstadter's project —\
  \ is moderately known; the core question (what makes an 'a' an 'a') is self-explanatory.\
  \ So it's safe if the prompt explains the question itself.\n\nI think I'll go with\
  \ Letter Spirit + thought experiment, OR Rawls + analogy. Let me pick one and make\
  \ it excellent.\n\nLet me think harder about the strongest design.\n\nOption A (Letter\
  \ Spirit, thought experiment to spec):\n\nPrompt (casual, British, a typo): \"I'm\
  \ trying to build a little test-bed for the question of what makes every 'a' an\
  \ 'a' — the letter-spirit problem — and I want a thought experiment that isolates\
  \ one variable... Construct a case where two glyph designers each produce a lowercase\
  \ 'a' for the same new typeface; one keeps the 'canonical' skeleton but violates\
  \ the family's style, the other changes the skeleton but preserves the style; and\
  \ specify that a naive human reader accepts both as 'a's while a strict structural/template\
  \ account accepts only one. Constraints: realistic (a working type foundry, a deadline,\
  \ actual glyph anatomy — x-height, bowl, stem, terminal, aperture — not abstract\
  \ blobs), one paragraph, no appeal to 'readers just learn by exposure', and the\
  \ disagreement must not come from anyone being wrong about what an 'a' looks like.\
  \ Then walk through: what a template/prototype view says, what a family-resemblance\
  \ view says, what a role-in-the-system (contrastive) view says about each glyph,\
  \ which feature of the case does the work, and what happens if you remove it. Finish\
  \ with how a defender of the view that comes out worst would attack the case.\"\n\
  \nHmm, that's decent. Maybe I want something sharper: isolate the \"double-bowel\
  \ vs single-story 'a'\" issue, or the fact that the printed lowercase 'a' in most\
  \ text fonts (double-story) differs radically from the handwritten one (single-story),\
  \ which is a real and interesting fact: children are taught to write a single-story\
  \ 'a' while print uses double-story. That's a genuinely good hook that isn't a niche\
  \ theory but a fact about the world. And there are fonts with single-story 'a' (e.g.,\
  \ many geometric sans like Futura, and \"infant\"/schoolbook versions of fonts —\
  \ e.g., Sassoon Primary, Comic Sans has single-story 'a'). So a thought experiment:\
  \ a foundry commissions a \"schoolbook\" cut of an existing double-story face...\
  \ The variable isolated: whether legibility-for-beginners tracks letter identity.\n\
  \nActually here's a nicer design: The specification could be that the case must\
  \ separate \"what makes every a an a\" from \"what makes a good a\" — i.e., a glyph\
  \ that is a perfectly acceptable 'a' but breaks the typeface's spirit, versus one\
  \ that embodies the spirit perfectly but is a borderline 'a'. And require the model\
  \ to say which one a type designer would ship, and what that reveals about whether\
  \ letter identity is a matter of shared essence or of system-relative role.\n\n\
  Hmm, but the type says the thought experiment must be engineered so that specified\
  \ theories deliver specified verdicts. Good — I'll name three accounts: prototype/feature-template\
  \ account, family resemblance / style-relational account, and the \"letter as a\
  \ role in a system of contrasts\" (differential/structural) account. These are standard-ish,\
  \ and the third one is like Saussure's differential values but applied to letterforms\
  \ — not too niche, and I'll describe it in the prompt so a model doesn't need to\
  \ know the name.\n\nOption B (Rawls, analogy audit): The analogy \"the original\
  \ position is like drawing a lottery ticket in a raffle where you don't know which\
  \ entry is yours\" used by a mate in a book club to argue that Rawls's principles\
  \ are just expected-utility maximisation, so we should be egalitarian-ish but accept\
  \ inequality for efficiency... Hmm. Audit: what maps, where it breaks (the ticket\
  \ has known odds; the veil removes knowledge of probabilities; the self behind the\
  \ veil isn't a person who will learn which ticket they hold — no \"revelation\"\
  \ later; the parties aren't gambling on their own behalf in a one-off; the stakes\
  \ aren't a fixed prize distribution but the rules of the game itself; Harsanyi's\
  \ impartial observer assumes you'd have the preferences of the person you become,\
  \ which requires interpersonal identification). And whether the conclusion survives.\
  \ That's a solid, meaty answer with well-memorised material (Harsanyi, Rawls's three\
  \ conditions for maximin, the \"no knowledge of probabilities\" point). And I can\
  \ inject niche framing: the asker's brother-in-law is an actuary who says it's just\
  \ a raffle and you should maximise expected value.\n\nBoth are good. The instruction\
  \ says pick whichever type I can combine best with one of the domains. I think Option\
  \ A (Letter Spirit) is fresher and less regurgitable, and the domain is explicitly\
  \ about categories/style/essence — perfect for a designed case. But it's also harder\
  \ to make rigorous, and the \"verification\" that the case meets specs is fuzzier.\n\
  \nHmm, let me consider Option C: Sortition + thought experiment to spec. Design\
  \ a real-world-ish selection procedure where sortition and election come apart on\
  \ a specific criterion in a counterintuitive direction: e.g., a case where a randomly\
  \ selected assembly is MORE captured by an interest group than an elected one, or\
  \ where sortition produces worse descriptive representation than elections. Something\
  \ like: \"Construct a case in which a citizens' assembly selected by sortition ends\
  \ up more dominated by a narrow interest than the elected council it replaces —\
  \ without anyone rigging the lottery, and without the assembly members being corrupt.\"\
  \ The mechanism: self-selection at the invitation stage (only people with time/confidence\
  \ respond — retirees, the self-employed, people with a grievance), plus the agenda\
  \ and expert witnesses controlled by staff, plus the fact that lobbyists don't need\
  \ to fund campaigns, just time. That's a genuine and well-known critique (the \"\
  who actually shows up\" problem). Then specify: what a sortition optimist says,\
  \ what a defender of elections says, what the deliberative democrat says, which\
  \ feature does the work, and what happens if you remove it (e.g., compulsory paid\
  \ service with jury-duty-style summons and enforcement). That's very good and realistic\
  \ and well within memorised knowledge. Constraints: realistic (a town council, not\
  \ sci-fi), one paragraph, no bribes, no rigging of the lottery, the assembly must\
  \ be descriptively representative on the standard quotas (so the failure isn't from\
  \ bad quotas) — that last constraint makes it non-trivial: how can a body that matches\
  \ census quotas on age/sex/education/income still be captured? Answer: capture via\
  \ agenda/expert selection and via the unmeasured dimension of \"free time + interest\
  \ in the issue\", and the intensity asymmetry. Nice. And it isolates the variable:\
  \ representation-as-composition vs representation-as-process.\n\nHmm, that's quite\
  \ good. Which do I prefer? The sortition one is more clearly \"engineered to spec\"\
  \ and has a satisfying structural twist: the quotas are all met, yet capture occurs\
  \ — because quota variables are the wrong ones (availability, stakes-intensity,\
  \ and who briefs them). It also forces an honest note about which feature does the\
  \ work.\n\nBut it also risks being a known talking point (\"self-selection in citizens'\
  \ assemblies\" is discussed in the literature). The prompt can push past that by\
  \ requiring the quotas to be met and forbidding rigging, forcing the model to find\
  \ the deeper mechanism.\n\nLet me decide: I'll go with sortition + thought experiment.\
  \ Actually wait — let me reconsider Letter Spirit once more, since it's the freshest\
  \ domain and the instruction warns about regurgitation. But the risk with Letter\
  \ Spirit: the answer quality depends on the model actually knowing something about\
  \ type design; small models may flail. The sorting/design task is still doable from\
  \ general reasoning about categories. Hmm.\n\nActually, I could combine freshness\
  \ and rigor: Letter Spirit domain + thought experiment type, with a well-specified\
  \ design brief using real, verifiable facts I know: double-story vs single-story\
  \ 'a'; schoolbook cuts; Futura's single-story 'a'; the fact that in blackletter/Fraktur\
  \ the 'a' is single-story; that in some fonts 'a' and 'o' differ only by a small\
  \ tail/hook; that italic 'a' often differs; the 'g' double-story vs single-story\
  \ (opentail vs looptail) — a famous case because the looptail 'g' is widely unrecognised/unwritable\
  \ by children and adults (there's a study showing people can't write a looptail\
  \ g — but I shouldn't cite it since I can't verify... actually I could search. But\
  \ the rule says don't ask for citations; I can mention it loosely without citing.\
  \ Better: just use the 'a' and avoid claims needing verification, or verify.)\n\n\
  Let me think about what's most robust. I'll go with the sortition one? Or... hmm,\
  \ the user listed domains in an order and the first is Letter Spirit, suggesting\
  \ some fondness. But no instruction to prefer it.\n\nDecision criteria: \"prompts\
  \ should be somewhat in the weeds\" and \"models can't just regurgitate\". Letter\
  \ Spirit scores highest on that. And it's a thought-experiment type, where the deliverable\
  \ is a designed case plus demonstration — the model can do this with general reasoning\
  \ about categories plus knowledge of typography basics (which most models have:\
  \ serif/sans, x-height, counters, apertures, terminals, stroke contrast).\n\nI'll\
  \ do Letter Spirit + thought experiment. Let me design the specs carefully so they're\
  \ jointly satisfiable but non-trivial.\n\nDesign brief for the prompt:\n\nContext:\
  \ I'm building a small test-bed / running a workshop on \"what makes every a an\
  \ a\" — categories, style, essence of letterforms. I want a thought experiment built\
  \ to order.\n\nSpecs:\n1. Setting: a working type foundry, realistic, not sci-fi,\
  \ no neural nets needed (or: a foundry commissioning a revival). One paragraph for\
  \ the scenario.\n2. The case must contain two candidate glyphs for the lowercase\
  \ 'a' in the same face, call them A1 and A2.\n   - A1: keeps the structural skeleton\
  \ readers expect of a double-story 'a' (closed upper bowl, curved lower bowl, vertical\
  \ stem, tail) but drawn in a way that clashes with the family's style — e.g., monotone\
  \ stroke, blunt terminals, a wide aperture — such that it looks like a 'a' from\
  \ another font dropped in.\n   - A2: perfectly in the family's style (matching stroke\
  \ contrast, terminal cuts, x-height, weight distribution, the way the 'o' and 'e'\
  \ are built) but its skeleton is a single-story 'a' — i.e., it's the 'a' of the\
  \ handwriting model and of Futura.\n3. Required verdicts: a prototype/template account\
  \ (compare to a stored exemplar or list of features) must accept A1 and reject or\
  \ heavily penalise A2; a style-relational / family-spirit account must accept A2\
  \ and reject A1; a third account — \"a letter is whatever plays the right role in\
  \ a system of contrasts\" — must give a different verdict again, specifically it\
  \ must be the one that can accept both or must reject both? Let's think: the differential/role\
  \ account says 'a' is defined by its contrasts within the alphabet of that particular\
  \ face: it must be discriminable from 'o', 'e', 'd', 'q', 'g', '4' etc., and consistent\
  \ with the writing system's norms. A single-story 'a' is fine in a face where nothing\
  \ else clashes with it (Futura), so the role account accepts A2 provided it doesn't\
  \ collide with 'o' or 'a' vs 'α'... And A1: role account accepts A1 as an 'a' (it's\
  \ discriminable) but says it fails as a member of this face. So the role account's\
  \ verdict splits the question: both are a's; only one belongs. That's actually the\
  \ interesting outcome: the role account says the two candidate theories are answering\
  \ different questions. Hmm, but for the thought-experiment type we want specified\
  \ verdicts delivered by specified theories. So: template view → A1 yes, A2 no; spirit/style\
  \ view → A2 yes, A1 no; role-in-system view → both are 'a's, but only A2 is an 'a'\
  \ of this face — i.e., it dissolves the clash by distinguishing letter-identity\
  \ from face-membership.\n\nActually, a better twist: require that the role account\
  \ *rejects* A1 as an 'a' in this specific context. How? Make the foundry's brief\
  \ be for a face to be used in a specific setting where A1 collides with something:\
  \ e.g., the face is for signage in a multilingual environment, or the A1's wide\
  \ open counter and blunt tail makes it confusable with the 'o' in the same face,\
  \ or with 'α'/'а' (Cyrillic а) — hmm. Or: make A1's construction such that in the\
  \ same face, the 'o' is also drawn with blunt monotone... no, that would change\
  \ the style overall.\n\nSimplest: require that A1, though structurally the canonical\
  \ double-story 'a', is *less* legible in the family's context: e.g., the face is\
  \ a high-contrast Didone-style revival where A1's monotone rendering (necessary\
  \ to make it \"canonical\"?) ... hmm, getting complicated.\n\nLet me restructure:\
  \ keep it clean but add one more variable to isolate: audience/learning history.\
  \ Add: the foundry has been commissioned to produce a schoolbook cut of an existing\
  \ adult text face — i.e., a version for children learning to read, where the brief\
  \ says the 'a' (and 'g') should match the forms children are taught to write by\
  \ hand (single-story). So:\n- A1 = the canonical double-story 'a' inherited from\
  \ the parent face, redrawn in the schoolbook style (so style-consistent!).\n- A2\
  \ = a single-story 'a' that matches what children write, but whose construction\
  \ (monotone stroke, round bowl, blunt tail) breaks from the parent face's high-contrast,\
  \ wedge-terminal style.\n\nHmm, then which is style-consistent flips. This is getting\
  \ confusing. Let me simplify while retaining tension.\n\nCleaner design: Two candidate\
  \ 'a' glyphs for a new text face, \"the Ashworth Text\", a revival of a 19th-century\
  \ British book face with high stroke contrast, bracketed serifs, and a small, closed\
  \ 'e'.\n\n- Candidate 1 (\"Ashworth-a\"): the traditional double-story 'a' of the\
  \ parent face, i.e., the skeleton every reader expects, but redrawn with the wrong\
  \ style: monotone weight, open aperture, blunt cut terminals — technically it's\
  \ a perfectly canonical 'a', and in isolation nobody hesitates, but set in a line\
  \ of Ashworth text it looks like a refugee from a geometric sans.\n- Candidate 2\
  \ (\"hand-a\"): a single-story 'a' — the form children are taught to write — but\
  \ built with the Ashworth's own materials: the same contrast axis, the same wedge\
  \ terminals, the same bowl curvature as the 'o', a tail cut like the 'r's. Set in\
  \ a line it's seamless; but readers who've never met a single-story 'a' in print\
  \ (or a test with a template matcher trained on double-story forms) balk.\n\nRequired\
  \ verdicts:\n- Prototype/template/feature-check account: Candidate 1 is the 'a';\
  \ Candidate 2 fails (missing the closed upper bowl — the diagnostic feature).\n\
  - Style/spirit or family-resemblance account: Candidate 2 is the real 'a' of this\
  \ face; Candidate 1 is a foreign body.\n- System-of-contrasts (differential) account:\
  \ must deliver a verdict that turns on the rest of the alphabet rather than on the\
  \ glyph in isolation — and here's where I can inject a niche twist: require that\
  \ the case include a fact that makes the differential account decisive, e.g., the\
  \ face also contains a single-story 'g' decision, or the face's 'o' is nearly identical\
  \ in outline to Candidate 1's lower bowl so that Candidate 1 collides with... hmm.\
  \ Or: the target readership includes a script where the single-story form is the\
  \ standard (e.g., the foundry is also licensing the face for an Irish/Gaelic or\
  \ a teaching-reading market), so what counts as 'a' varies with the system in which\
  \ the glyph is deployed.\n\nActually here's a really nice twist for the differential\
  \ account: the same shape can be 'a' or 'α' or a numeral depending on system, and\
  \ in some faces the single-story 'a' is exactly the Cyrillic 'а'... no, Cyrillic\
  \ 'а' is identical in form to Latin single-story 'a'. So Candidate 2's shape is\
  \ indistinguishable from the Cyrillic а — but that's fine for Latin-only use, and\
  \ a problem if the face is extended to Cyrillic (where the two scripts must be distinguishable\
  \ or at least mapped). That's a genuinely in-the-weeds typography fact I'm fairly\
  \ confident about: Cyrillic small а is identical in shape to Latin single-story\
  \ a, and fonts with a single-story Latin 'a' create issues for \"distinguishable\
  \ Cyrillic\" requirements. Good — that gives the differential account a bite: 'a'-ness\
  \ is relative to the system of contrasts, and adding Cyrillic to the system changes\
  \ whether Candidate 2 can serve as the Latin 'a'.\n\nBut I shouldn't assert it as\
  \ fact in the prompt if unsure. I'm quite sure: Cyrillic lowercase а looks like\
  \ Latin a (single-story). Yes. And Futura-style single-story 'a' being identical\
  \ to Cyrillic а — plausible. I can phrase it as part of the scenario stipulation\
  \ rather than as a real-world claim: \"stipulate that the foundry is also extending\
  \ the family to Cyrillic, where the small а is a single-story form\". That's stipulated\
  \ in the thought experiment, so it doesn't need to be true in the world... but it\
  \ should be true-ish for realism. It is.\n\nHmm, but adding Cyrillic might overcomplicate.\
  \ The spec should ask: which feature of the case does the work, and what happens\
  \ if you remove it (e.g., drop the Cyrillic extension, or drop the fact that the\
  \ face is a revival with a strong house style).\n\nAlso the type wants: \"an honest\
  \ note on ... how a defender of the theory that comes out badly would attack the\
  \ case.\" Good — include that: how would a prototype theorist attack the case?\n\
  \nAnd: \"the asker should say what the case is for, since that fixes what counts\
  \ as cheating\". So I should say what the thought experiment is for: I want a case\
  \ that shows whether letter identity is a matter of intrinsic form or of relations\
