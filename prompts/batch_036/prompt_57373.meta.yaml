  "I''ve been asked to set out my position on consequentialist cluelessness for a
  workshop, and before I do I want an audit of whether the package hangs together.
  Here is what I hold.


  1. Act consequentialism with an objective criterion: whether an act is right is
  settled by its actual consequences, all of them, however remote in time or space;
  temporal distance makes no axiological difference.

  2. There is only one ''ought''. I reject the view that there is an objective ''ought''
  and a separate evidence-relative one; talk of what an agent ought to do given her
  evidence is either shorthand for the objective claim or a confusion.

  3. The cluelessness problem (in Lenman''s sense) is correct and deep: for virtually
  every real-world act, the remote consequences are not merely unknown but unknowable
  in principle, and the numbers we assign to expected far-future effects bear no informative
  relation to the truth.

  4. Consequently, cluelessness is a genuine objection to act consequentialism that
  the theory''s proponents must answer — not a mere implementation difficulty, and
  not something to be shrugged off by saying that the theory was never meant to be
  a decision procedure.

  5. I reject the standard repairs: rule consequentialism, satisficing versions of
  consequentialism, and proposals to bound the relevant consequences to a near-term
  horizon on the ground that arbitrary truncations of the causal chain cannot be principled.

  6. Yet I also hold that once the evidence runs out — which on (3) is nearly always
  — an agent should fall back on the ordinary rules of commonsense morality as her
  decision procedure, and that doing so is not a failure of consequentialist commitment.

  7. On blame: unavoidable ignorance excuses. No one is blameworthy for bad consequences
  she could not reasonably have foreseen; but I also think a driver who swerves to
  avoid a dog and thereby kills a pedestrian who would in fact have gone on to cause
  a catastrophe has done the wrong thing, though not a blameworthy one.

  8. On practice: when choosing between a well-evidenced global-health donation and
  a speculative intervention aimed at the far future, I insist the decision be made
  by expected value, and that someone who knowingly takes the lower-expected-value
  option is criticisable — even though on (3) the far-future term in that calculation
  is uninformative.


  Please audit this set rather than lecture me on the literature. Tell me which commitments
  genuinely pull against each other and which only appear to, and rank the genuine
  tensions by severity rather than listing them all as equally serious. For each,
  say precisely what would have to be given up or weakened, and what the resulting
  view looks like. Then take a definite position: tell me which single revision you
  would make if you had to defend my package at the workshop, and why — I want your
  recommendation and your reasons, not a menu of options for me to choose between.
  Please write in British English."


