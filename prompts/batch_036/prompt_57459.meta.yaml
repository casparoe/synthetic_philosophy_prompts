  Draft essay (as if by the asker):


  ---

  Leave-one-out confirmation: a proposal about old evidence


  Glymour''s problem of old evidence is usually stated as a problem about updating.
  If Pr(E) = 1, conditionalizing on E leaves everything exactly where it was, so there
  is no room in the Bayesian machinery for the fact that general relativity got a
  big boost from explaining the anomalous advance of Mercury''s perihelion — a boost
  Einstein and everyone else plainly took to be a boost, even though the perihelion
  data was already on the books.


  I want to suggest the problem is not about updating at all, but about which credence
  function the confirmation measure gets to look at. Confirmation is not a two-place
  relation between H and E. It is a three-place relation between H, E, and a credence
  function, and the interesting question for the old evidence case is which function
  is the right third relatum. The standard answer — the one Glymour''s problem assumes
  — is "the agent''s current one." That''s what generates the puzzle: the current
  function has already absorbed E, so there''s nothing left for E to do.


  My proposal: the third relatum should be what I''ll call the agent''s leave-one-out
  function, L_E — the function they''d have if E had never entered their evidence
  base. Confirmation of H by E is then Pr_{L_E}(H|E) − Pr_{L_E}(H), computed with
  a function that is by construction not saturated by E. For the Mercury case this
  gives the right verdict: relative to L_E, GR''s entailment of the observed perihelion
  advance is a genuine boost, and the boost is bigger the less L_E expected it, which
  is just the predictivist asymmetry falling out for free.


  The objection I expect is that L_E is a fiction — a "prior that never was," an idealization
  with no claim on the actual agent. That''s where I think my account has an advantage
  over the counterfactual-prior views, which just stipulate the function. L_E is supposed
  to be recoverable rather than stipulated. An agent who learned E by Jeffrey-shifting
  a partition containing E can run the update backwards: the new function preserves
  the old conditional probabilities on the partition, so if they still have the old
  partition probabilities in hand, they can reconstruct exactly what they had before.
  On this picture L_E isn''t a philosopher''s construction, it''s a record-keeping
  achievement.


  So the account has two parts. (i) Old evidence is not a special problem for Bayesian
  confirmation, only a special problem for the assumption that the measure reads off
  the agent''s current function. (ii) The right function is available in principle
  from the agent''s own history. If (ii) holds, Glymour''s problem turns out to be
  an artifact of confusing evidence-with-E in it for evidence-without-E.

  ---


