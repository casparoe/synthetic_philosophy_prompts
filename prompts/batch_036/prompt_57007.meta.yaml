  UDT vs. statistical decision theory: In classical statistical decision theory, you
  have a parameter θ, data X, a decision rule δ(X), a loss function, and risk R(θ,
  δ) = E_θ[L(θ, δ(X))]. Bayes risk integrates over the prior. A decision rule is admissible
  if no other rule dominates it. Complete class theorem: admissible rules ≈ Bayes
  rules. Now: UDT says don''t update; in statistical terms, that''s like evaluating
  the *whole decision function* by its Bayes risk rather than pointwise-conditional
  risk. Indeed, there is a known line: "UDT = minimizing expected loss with respect
  to the prior over the whole policy, rather than conditioning" — i.e., the difference
  between ex ante and ex post optimality. Related: "Bayesian conditioning vs. planning,"
  the classic result that a Bayes-optimal decision rule is one chosen ex ante. And
  the well-known critique: conditional (ex post) optimality vs. unconditional (ex
  ante) optimality; also "time inconsistency" in decision theory (like the paradox
  in dynamic inconsistency, e.g., Kydland-Prescott, or the "smoking lesion"-type).


  Also relevant: the statistician''s vocabulary has no room for logical/counterfactual
  dependence between the decision rule and the state of nature — unless you model
  θ as depending on δ, which is exactly what happens in Newcomb-like problems. In
  statistical decision theory, the data-generating process is independent of the decision
  rule; you can''t express "the parameter is a function of my estimator." Actually
  you can, in a limited way: if the world contains a predictor that models δ, then
  the "risk" depends on δ in a non-standard way — that''s like a game, and you''d
  move to game theory. So residue: UDT cases require the loss to depend on the rule
  itself, which is off-model for classical decision theory and pushes you into game
  theory/mechanism design.


  Another residue: anthropic/indexical — statistical decision theory has a well-defined
  sample space; UDT cases with duplication have no well-defined "which observation
  is mine."


  And there''s a genuinely interesting question: is UDT just "ex ante optimality +
