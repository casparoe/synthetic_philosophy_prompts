  this is what a Bayes rule is; the interesting part is only that the loss can depend
  on the rule. Then the residue verdict: much of the UDT/EDT/CDT debate is about the
  *dependence structure* between decision rule and world, not about updating. That''s
  a substantive and defensible answer.


