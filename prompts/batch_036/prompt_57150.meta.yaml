  I''m writing up a dissertation chapter on trials as memory-making and I''ve got
  stuck on one case, so I thought I''d throw it at you. Take the Eichmann trial in
  Jerusalem — Mossad grabbing him off a Buenos Aires street in May 1960, the diplomatic
  row with Argentina at the UN, then the fifteen counts under Israel''s 1950 Nazis
  and Nazi Collaborators law, the three-judge district court with Landau presiding,
  Hausner running the prosecution and Servatius the defence, roughly four months of
  hearings from April to August, verdict in December, appeal knocked back, hanged
  at the end of May 1962. I''ve got all that. What I want is the whole thing run through
  Bauman''s Modernity and the Holocaust, properly, not as a nod to the "banality of
  evil" line everyone reaches for. So: which of Bauman''s actual mechanisms does the
  courtroom''s design presuppose and which does it contradict — the instrumental rationality
  of the bureaucratic apparatus, the stretching of distance between act and consequence,
  the adiaphorisation business (his term, I think, for whole tracts of conduct being
  made morally indifferent rather than morally condemned), the gardening state, the
  Milgram-derived agentic state. The tension I can''t get past is this: to convict,
  the court had to locate a continuous, intentional moral agent inside a man whose
  whole defence was that he had been a logistics function in a machine, and Bauman''s
  thesis is precisely that the machine''s modernity consisted in dissolving that agent.
  So either the court''s moral ontology is wrong and it convicted on a fiction, or
  it got the right result for reasons Bauman''s account can''t license. Work that
  out for me rather than picking a side by default.


  Then I want the witness problem folded in. Hausner called a lot of survivors whose
  testimony had nothing much to do with Eichmann personally — that''s the bit Arendt
  attacked as stage management, and Buber and Scholem were among those who signed
  the open letter to Ben-Gurion saying the trial shouldn''t be held in Israel at all.
  Ask what Bauman''s framework makes of that: is the survivor testimony an attempt
  to reverse adiaphorisation by re-supplying the moral content the bureaucracy had
  deleted, or is it a second-order performance that does something else entirely,
  and does the glass booth help or hurt on Bauman''s terms — I''d say it helps, because
  it converts an organisational chart into a face, which is exactly the substitution
  Bauman thinks modernity made possible in the first place, but I want you to argue
  with me if that''s too neat.


  Finally, and this is the bit I''ve actually invented so it won''t be in your training
  data in this form: I''ve been toying with adding a mechanism Bauman doesn''t have,
  something like retrospective re-moralisation — call it moral backdating — where
  a post-hoc legal process restores the appearance of unbroken moral agency by retro-fitting
  intent onto tasks that were, when performed, morally neutralised bits of paperwork.
  If that''s a real mechanism it should make predictions: such trials need a defendant
  with a face rather than a department, they need narrative rather than structure,
  they have to produce a finding about a state of mind, and they have to suppress
  the diffusion of responsibility that the underlying events actually had. Test it
  on Eichmann. Where does it hold, where does it break — I''d flag straight away that
  Eichmann''s own conduct in the dock cuts against it, since by all accounts he insisted
  he''d lived by something like Kant''s idea of duty, which is the opposite of a morally
  neutralised technician, and the prosecution''s success arguably depended on him
