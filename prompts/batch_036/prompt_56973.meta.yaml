  One more subtlety: Reflection''s formal statement: P_now(A | P_future(A) = p) =
  p. And the "expectation" version: P_now(A) = E_now[P_future(A)] is actually a theorem
  of the conditionalization requirement, and it''s sometimes said Reflection follows
  from conditionalization + the fact that you''ll conditionalize on your total future
