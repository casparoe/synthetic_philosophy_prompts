  Reflection need not apply when you expect your future self to be irrational or forgetful
  (the "deference" is to the better-informed self). Actually in his 1995 paper "Belief
  and the Will" van Fraassen discusses Reflection. The classic example: the person
  who knows they will take a drug that makes them believe they can fly. There''s also
  the "I will believe I am about to be killed" case.


