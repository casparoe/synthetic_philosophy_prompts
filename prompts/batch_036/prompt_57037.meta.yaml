  The false presuppositions embedded:

  1. Same published data ⇒ common prior. (No: common prior is a pre-evidence distribution
  over the whole state space; also each group had private information — sample quality,
  instrument calibration — and different likelihoods/models.)

  2. Mutual citation ⇒ common knowledge of posteriors. (No: requires the infinite
  hierarchy plus common knowledge of rationality/Bayesian updating; also published
  numbers are not the same as posteriors about the same event on the same algebra.)

  3. The theorem is a diagnostic that identifies which agent is irrational. (No: it''s
  a conditional impossibility result; its contrapositive tells you at least one hypothesis
  of the model fails — could be common prior, common knowledge, Bayesian updating,
  or indeed that they aren''t even disagreeing about the same event.)

  4. Weighted average of posteriors as "the rational posterior" — pooling is not aggregation
  of evidence; there''s a large literature on opinion pooling and its pitfalls, and
  a weighted average of two agents'' posteriors generally is not anyone''s posterior
  and can be incoherent / susceptible to Dutch books (linear pooling can be Dutch-booked
  across time — actually the classic result: linear pooling of different agents''
  beliefs can lead to a Dutch book when the pooled credence is used for betting by
  both, Lehrer–Wagner critique). The model should note that the theorem doesn''t license
  pooling.

  5. The serial-correlation analogy: a persistent nonzero disagreement isn''t a stochastic
  residual; there is no null distribution of "rational disagreement noise" with mean
  zero; the theorem is a deterministic statement, not a statistical expectation. So
  a Durbin–Watson-like test has no null hypothesis to test against. Also, disagreement
  size tells you nothing about whose fault it is.


