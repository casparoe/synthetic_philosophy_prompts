  The case. From roughly 1988 to 2009 my group and another well-regarded group disagreed
  about a single question: whether a small anomaly we both saw in the resistivity
  of a certain family of samples was intrinsic to the material or an artifact of disorder
  at the grain boundaries. On the basis of the same published literature and the same
  shared data sets, I held a credence of about 0.75 in the intrinsic hypothesis; the
  leader of the other group stated, in print and in correspondence, roughly 0.20.
  We read each other''s papers, cited each other by name, exchanged preprints, and
  sat on the same panels. Over two decades neither of us moved more than a few hundredths.


  I have been in the habit of summarizing such standoffs by a quantity I call the
  consensus deficit: the absolute difference between two credences divided by their
  arithmetic mean — here about 1.16. My reasoning then runs as follows. (i) Two rational
  agents who share the same evidence cannot knowingly hold different probabilities
  for the same proposition; that, as I understand it, is what Aumann established.
  (ii) Our evidence was shared and public, so we had a common prior. (iii) Each of
  us cited the other''s published estimate, so each of us knew the other''s credence
  and knew that the other knew his own; the credences were therefore common knowledge.
  (iv) Since the deficit never closed, at least one of us was not updating as the
  theorem requires — that is, one of us was irrational, or at any rate biased, and
  the theorem tells me this must be so.


