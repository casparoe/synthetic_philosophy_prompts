  it? My proposal has two parts, and I want them scrutinized rather than applauded.
  First, a weighted pooling rule: assign each party a weight proportional to the fraction
  of its past published claims that were later confirmed by third parties, then adopt
  the weighted average of the two credences as the rational consensus. Second, a diagnostic
  borrowed from my own craft: treat the annual consensus deficit as a residual series
  and test it for serial correlation in the manner of Durbin and Watson; if the deficit
  fails to mean-revert toward zero, that is a sign of misspecification, and the misspecification
  must sit with whichever party''s weight is lower.


  Tell me plainly whether either part survives contact with the theorem I am invoking,
  and if neither does, tell me what — if anything — a result of that kind does license
  me to conclude about a twenty-year standoff between two competent laboratories.
  I should be grateful, finally, for two or three sentences of plain prose that I
  could adapt for the footnote of a memoir, in which the point is stated without jargon.


