  for a bidder to work with. So no, F doesn''t hand legislation to the richest bidder;
  it hands it to the best forecaster, and in the long run those come apart from the
  richest, because capital bet badly is capital lost. That''s also why futarchy isn''t
  a plutocracy or an epistocracy: the wealthy get no extra votes, and democracy still
