  Last night a friend and I argued for hours about Nietzsche''s genealogy of morality,
  and I would like an outside audit of the analogy on which his whole case rested.
  His claim was that Nietzsche''s account of the slave revolt in morality — the powerless,
  unable to take revenge in deed, taking it in imagination by revaluing the values
  of their masters — is nothing but Aesop''s fable of the fox and the grapes writ
  large: what the weak cannot attain (strength, pride, wealth, worldly success) they
  declare evil, just as the fox declares the unreachable grapes sour. On this basis
  he argued that the genealogy debunks slave morality: once you see that egalitarian
  values originated in self-serving denial, you can no longer take them seriously
  as values.


  Please treat the analogy as an argument and audit it. Specifically:


  1. Give the correspondence table: what plays the role of the fox, the grapes, the
  branch''s height, the declaration of sourness, and the fox walking away.

  2. Distinguish two things the fox might be doing — call them doxastic souring (coming
  to believe the grapes are sour while still prizing sweetness) and valuational souring
  (ceasing to prize sweetness itself) — and say which of the two Nietzsche''s ressentiment
  is supposed to be, given that he describes the slave''s No as itself a creative
  act that brings forth new values rather than merely denying old ones. Does the fable
  survive the reading on which ressentiment is genuinely value-creating rather than
  merely self-deceiving?

