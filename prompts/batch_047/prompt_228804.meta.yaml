  or sour independently of any fox, so the fable presupposes an objective standard
  against which the fox is simply mistaken. Say whether values have a counterpart
  to sweetness, and how much of my friend''s debunking conclusion depends on that
  presupposition.

  4. Consider my attempted repair in the argument: amend the fable so that the fox
  founds a community, teaches that sweetness is corrupting, breeds descendants who
  genuinely cannot enjoy it, and within a few generations the sour-preferring foxes
  run the vineyard. At what point in this amendment does the debunking force drain
  away — or does it?

  5. State whether his conclusion survives once the disanalogies are on the table,
  and if the analogy is beyond repair, propose a better one for whatever truth it
  was gesturing at.


  Please answer in British English.


