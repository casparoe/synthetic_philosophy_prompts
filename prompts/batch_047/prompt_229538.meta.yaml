  principle to survive what I call the exaptation problem: even if an institution
  arose for terrible reasons, it may have acquired functions since, so "we know its
  origin was bad" doesn''t count as understanding it. Second, I deny that there is
  any neutral way to measure an institution''s costs while it''s still in place, since
  it shapes the preferences and baselines you''d use to do the measuring.


