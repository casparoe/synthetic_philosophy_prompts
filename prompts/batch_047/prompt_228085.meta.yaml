reasoning_summary: 'We need to write one prompt. Choose a domain and type. The "predict
  or recommend a verdict" type fits well with sentience gradations or Turing test
  or euthanasia. Let''s craft an elaborate prompt.


  Pick: Turing test / behavioral criteria for mind, with a friend''s (or a panel''s)
  verdicts on earlier cases, new cases where rules diverge. Or euthanasia: a hospital
  ethics committee''s precedent verdicts. Euthanasia could be good: verdicts on cases
  — withdrawal of treatment vs. active euthanasia, terminal vs. non-terminal, competent
  vs. advance directive, etc. New case where rules diverge (e.g., doctrine of double
  effect vs. intention/foresight vs. autonomy-based).


  Design: A regional clinical ethics committee''s track record:

  - Approved: withdrawing ventilator at request of competent terminally ill patient.

  - Approved: terminal sedation for refractory pain with opioids, knowing it might
  hasten death (double effect).

  - Refused: lethal injection for competent terminally ill patient who requests it
  (active euthanasia) — even though they approved withdrawal.

  - Approved: honoring advance directive to withdraw artificial nutrition in a patient
  with severe dementia who seems content.

  - Refused: euthanasia request from patient with treatment-resistant depression (non-terminal
  psychiatric suffering).

  - Approved: non-voluntary? Maybe refusing futile treatment over family objections.


  New case: a patient with early-stage dementia, still competent by assessment, with
  an advance directive written when healthy requesting euthanasia at a specified stage;
  currently not suffering greatly, mildly content, and now says she doesn''t want
  to die; or terminal but... Rules: (1) act/omission distinction — predicts refusal
  for active euthanasia regardless; (2) current autonomous request rule — predict
  refusal because current wish contradicts; (3) precedent/precedent autonomy honoring
  the directive. Committee approved honoring directive in dementia case (withdrawal)
  but refused active euthanasia. New case combines active euthanasia + advance directive
  with contented current self. Rules diverge.


  Also ask which further case would discriminate between rules, and what would change
  the answer''s mind.


  Ensure consistency: the precedents must be jointly consistent with multiple rules.
  Rules:

  - Rule A: act/omission (killing vs. letting die): active euthanasia always refused
  → refuse new case.

  - Rule B: respect for precedent autonomy (advance directive counts as the patient''s
  will) + double effect etc.: approve.

  - Rule C: current competence and current wishes govern: patient currently competent
  (early stage) and says no → refuse.


  But wait—if currently competent and says she doesn''t want it, that''s easy. Make
  it more interesting: patient now in moderate dementia, no longer competent, appears
  content, directive says proceed at this stage. Rule B (precedent autonomy) says
  approve; Rule C (current interests/best interests of contented patient) says refuse;
  Rule A says refuse (active). Then two rules refuse, one approves — fine but maybe
  make more divergence. Add that committee once approved withdrawal of artificial
  nutrition for contented dementia patient per directive — that shows they honor directives
  even when patient content, for omissions.


  Alternative new case: non-terminal but unbearable suffering, competent, e.g., locked-in
  syndrome or severe paralysis, requests euthanasia. Rules: terminality rule (refuse
  — depression case was refused partly because non-terminal), act/omission (refuse),
  autonomy rule (approve). Hmm.


  Perhaps better to keep advance-directive dementia case since it''s a genuinely contested
  classic ("then-self vs. now-self"). Good.


  Structure: first paragraph context (I serve on / observed a hospital ethics committee
  in a jurisdiction where assisted dying is illegal? The precedents: committee can
  only advise on withholding/withdrawal and palliation; but asks hypothetical prediction).
  Maybe simpler: a professor who taught a seminar, or an ethics committee. Let''s
  do committee advising in a jurisdiction where euthanasia remains illegal, but they''re
  asked hypothetically about policy? Actually the "predict a verdict" type just needs
  track record + new case. Make the committee one that advises hospital policy on
  end-of-life care, and the new case arrives.


  Verdicts list:

  1. Competent terminally ill patient asks to stop dialysis: approved (withdrawal).

  2. Escalating morphine for pain with known risk of hastening death: approved.

  3. Competent terminally ill patient requests lethal prescription/injection to end
  life now: declined (referred to palliative care).

  4. Patient with advanced dementia, no longer competent, advance directive refusing
  artificial nutrition; family notes patient seems content: approved withdrawal per
  directive.

  5. Patient with severe treatment-resistant depression, competent by assessment,
  requests help dying: declined.

  6. Maybe: continued life support deemed futile, withdrawn despite family objection:
  approved (optional).


  New case: woman, 68, early Alzheimer''s, wrote detailed advance directive three
  years ago requesting that if she reached a stage where she no longer recognizes
  her children, euthanasia be performed (assuming it were legal; jurisdiction now
  legalized assisted dying? We can set jurisdiction where assisted dying just became
  legal so committee''s role changed). Now she has reached that stage: doesn''t recognize
  children, seems generally content, enjoys music and walks, no longer competent;
  no current distress. Directive says proceed. Family divided.


  Rules:

  - Act/omission: decline (precedent 3).

  - Precedent autonomy / substituted judgment: approve (precedent 4 honored directive
  against current apparent contentment).

  - Current best interests / current wellbeing rule: decline.

  - Terminality rule: decline (non-terminal; precedent 5).


  Hmm many decline, one approves. To make divergence at least two rules approve? Adjust:
  maybe drop terminality interpretation — the depression refusal could be explained
  by (a) non-terminal status, (b) doubt about competence stability/voluntariness in
  psychiatric illness, (c) remediability. If (b/c), then terminality isn''t the rule
  and new case not governed by it. So candidate rules for precedents:

  - Rule 1 (act/omission + double effect): committee permits anything in the letting-die/palliation
  category, nothing in the killing category. New case: decline.

  - Rule 2 (autonomy hierarchy: authentic precedent autonomy from a competent earlier
  self controls when current self incompetent): new case: approve.

  - Rule 3 (current experiential interests dominate; directives honored only for omissions,
  and contentedness matters): decline... that''s a combo.


  Also Rule 4: relief of suffering is the committee''s mission; approve only where
  suffering is present and unrelievable → decline (she''s content).


  So several decline, one approves. Prediction could go either way with reasoning
  about "closest analog": precedent 4 (honoring directive despite contentment) vs
  precedent 3 (refusing active means). The question: which precedent is closer — the
  one matching on means (active vs passive) or the one matching on decision-source
  (advance directive)? That''s the nice underdetermination. Ask: what would the committee
  be committing to either way, and what further case would discriminate (e.g., competent
  patient with advance directive who is now still competent and reconfirms? no—that
  doesn''t discriminate; a case of active euthanasia per advance directive where patient
  is currently suffering vs content, etc.)


  Also epistemic request: ask the answer to state what would change its mind — which
  evidence about committee''s rationale or which hypothetical ruling would flip the
  prediction.


  Length: 1-3 paragraphs. Write formally. No quotes from real texts needed. No search
  needed.


  Draft:


  Paragraph 1: context. I sit on / I''ve been observing the clinical ethics committee
