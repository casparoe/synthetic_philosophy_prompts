  Let me draft:


  Paragraph 1: context — I help run a university effective giving group / I''m allocating
  a donor-advised fund; I''ve been scoring causes on importance, tractability, neglectedness
  (ITN). Then list verdicts.


  Cases:

  1. Global health charity (malaria nets): high importance, high tractability, moderate
  neglectedness — fund it.

  2. Existential risk from AI: enormous importance, low tractability, very neglected
  — fund it, even though tractability is low.

  3. Wild animal welfare: astronomically high importance, very neglected, very low
  tractability — I don''t fund it. (Tension with case 2: both low tractability/high
  importance; what distinguishes?)

  4. A popular local cause (animal shelter): low importance, high tractability, not
  neglected — don''t fund.

  5. A cause with strong evidence of high impact but crowded (post-GiveWell top charities
  getting huge inflows): still fund? Verdict: fund less as neglectedness drops.

  6. Hard case: a speculative long-shot intervention with huge expected value on paper
  but where I suspect the estimate is driven by one researcher''s model — I refuse
  even though ITN scores look fine.


  Ask: what principle(s) capture these — is ITN enough, or do I need a robustness/credibility
  discount, diminishing marginal returns within neglectedness, tractability as evidence
  of cluelessness? Which verdict must go? What does it say about a new case (e.g.,
  biosecurity vs. something)?


  Keep formal, elaborate. Two or three paragraphs. No quotation marks from real texts.
  Numbers are my invented estimates — fine.'
