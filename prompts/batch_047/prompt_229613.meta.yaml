  I think cause prioritization with the ITN framework works well: give verdicts on
  a set of causes (some hard to reconcile, e.g., a cause that scores high on all three
  but feels wrong, or one that scores low but feels right), ask what principle captures
  them. That creates genuine tension: e.g., wild animal welfare (huge scale, neglected,
  intractable) vs. a local charity; existential risk vs. global health; etc.


  Write an elaborate, formal prompt, 2-3 paragraphs. Cases with concrete numbers I
  invent (allowed, since they''re the asker''s own estimates, not real facts). Include
  at least one hard-to-reconcile pair: e.g., verdict that deworming beats an x-risk
  project despite the x-risk project dominating on ITN — forcing a principle choice
  (diminishing returns, robustness/certainty discount, cluelessness).


  No quotes needed. No web search needed — the ITN framework is well-known and I''ll
