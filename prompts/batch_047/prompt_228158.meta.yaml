  about itself: to plan for tomorrow, it needs to accept that whatever its checker
  will certify tomorrow is true. So we add a blanket rule: anything my checker certifies
  is true. My friend says the result is just another instance of Gödel''s incompleteness
  results — a sufficiently powerful system limping along unable to affirm its own
  reliability. But the way I understand the failure, it is worse than limping: once
  the blanket rule is in, the checker can certify anything at all, including claims
  the original axioms forbade. The system doesn''t merely fail to gain trust in itself;
  the trust mechanism detonates the whole thing.


