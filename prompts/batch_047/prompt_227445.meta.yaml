  Good structure: summary says something like: "Nozick''s Wilt Chamberlain argument
  shows that any attempt by the government to redistribute wealth is unjust. If everyone
  freely pays to watch Wilt play, the resulting unequal distribution is just, so egalitarianism
  requires constantly interfering with free choices. Since justice in holdings is
  just whatever people voluntarily end up with, taxation for welfare is on par with
  forced labor." Errors: (1) "any redistribution is unjust" — Nozick allows rectification
  of past injustice, which could license substantial redistribution; also taxation
  for minimal state functions is fine. (2) "justice in holdings is whatever people
  voluntarily end up with" — omits acquisition principle; voluntary transfer only
  preserves justice if holdings were justly acquired. (3) "forced labor" — actually
