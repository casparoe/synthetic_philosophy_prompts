  Program equilibrium: Tennenholtz (2004) "Program equilibrium" — in the prisoner''s
  dilemma where each player submits a program that can read the other player''s program
  (source code), cooperation can be an equilibrium: programs that cooperate iff the
  other program is identical (or provably cooperates). Key points often misrepresented:
  (1) it doesn''t make defection irrational in one-shot PD generally; (2) it requires
  programs to have access to each other''s source code — not just behavior; (3) the
  result is an equilibrium existence result — there are also other equilibria; cooperation
  is one equilibrium among many, equilibrium selection problem; (4) it''s not about
  simulations or running the program — it''s reading code; (5) it doesn''t solve Newcomb-like
  problems generally; (6) the "cooperate iff other program equals mine" program is
  itself an equilibrium but fragile.


  Subtle misrepresentations to embed: conflating program equilibrium with "programs
  simulate each other and see they''ll both cooperate"; overstating that cooperation
  is THE unique equilibrium / the rational outcome; claiming it proves cooperation
  is rational in the ordinary prisoner''s dilemma; claiming it relies on mutual trust
  or enforcement. Also a common error: saying programs must be identical — actually
  Tennenholtz''s construction uses equality, but generalizations (e.g., via Löbian
  cooperation, robust versions) don''t require exact identity; a summary could say
  "cooperation only works if programs are exact copies" which is a common simplification
  that''s actually fair-ish for the original result. Hmm — for the audit prompt, want
  one or two subtle misrepresentations, no howlers.


  Good subtle misrepresentations:

  - "Since each program can read the other''s code, defection becomes impossible"
  — no, defection is possible, just not equilibrium-best-response.

  - "This shows cooperation is the rational choice in the prisoner''s dilemma" — overstatement:
  it''s an equilibrium of a different game (the program game), and defect-equilibria
  exist too.

  - "The programs must be identical" — original construction, but the result generalizes;
  slight overstatement.

  - Conflating with iterated prisoner''s dilemma / folk theorem.

  - "It works because a program can verify what the other will do by running it" —
  no, running it would just... the program game has programs receive the other''s
  source as input; halting issues.


  Also the "fair" parts: programs get source code access; mutual cooperation is a
  Nash equilibrium of the program game; connects to Newcomb/FDT-ish ideas; doesn''t
  require repetition, reputation, or enforcement.


