  Philosophical structure of the speech:

  1. The occasion''s trap: two ways to fail — airbrush the astrology (dishonest, and
  it insults the townspeople''s intelligence and the astrologers present) or celebrate
  it (false, and betrays the science).

  2. Kepler''s own way: the "third way" — he held that conventional astrology was
  mostly dross but that rejecting celestial influence wholesale was throwing out the
  observation (he thought the heavens demonstrably affected weather and temperament).
  His criterion was mechanism: belief is licensed only when you can say how the influence
  works. That''s an epistemically live position — it maps onto modern questions about
  evidence, mechanism, and when anomaly-driven belief revision is rational vs. motivated.

  3. What honoring him means: honoring not the astrology but the standard he applied
  to himself — he refused the profitable certainty of the horoscope-caster and the
  comfortable certainty of the pure debunker. The speech can end on the monument:
  the town honors the man who was wrong in a productive, honest way — the wrongness
  (Platonic solids, harmonies) drove him to the data (Tycho) and to the laws. Is a
  false framework vindicated if it generates true discoveries? Kepler is the test
  case.


