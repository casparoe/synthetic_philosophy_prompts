  of problems where the optimal-with-deliberation-costs policy provably doesn''t look
  like any satisficing heuristic, or vice versa?

  - Conceptually: does the "it''s all maximization" view have its own falsifiability
  problem? If any behavior can be fitted with some cost function, then my position
  is trivially true and therefore empty — I want someone to tell me whether that''s
  a knock-down objection to my position or just a pedantic worry.

  - Also: what do the bounded-rationality people themselves say would settle it? Like,
  does Gigerenzer-style ecological rationality actually predict things (less-is-more
  effects, heuristics beating full optimization in noisy environments) that the maximize-with-costs
  picture doesn''t predict, or does it predict the same things dressed differently?


