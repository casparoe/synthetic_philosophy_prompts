  So I''ve been chewing on an argument that keeps coming up whenever satisficing comes
  up on LW-adjacent threads, and I''ve talked myself into a position I want stress-tested.


  The position: "bounded rationality" isn''t actually a rival theory of decision-making
  to expected utility maximization. It''s just EU maximization with deliberation costs
  priced in. Every satisficing rule — stop searching once you find something above
  your aspiration level, take-the-best, 1/N portfolios, whatever — can be reproduced
  as the output of some expected utility maximizer facing search costs, attention
  costs, or a finite compute budget. Herbert Simon needed satisficing because the
  math of optimization-under-costs was intractable in the 50s, but conceptually the
  maximizer always swallows the satisficer. So when people say humans "satisfice rather
  than maximize," they''re not describing a different kind of agent, they''re just
  describing a maximizer whose cost function they haven''t bothered to specify. The
  bounded rationality research programme (Gigerenzer et al., "fast and frugal" heuristics,
  less-is-more effects) is at best a useful collection of engineering tricks for compute-limited
  agents, at worst an unfalsifiable umbrella that can claim any behavior post hoc
  by positing whatever constraints make it "ecologically rational."


