  Let me construct cases: Knobe''s classic chairman harm/help cases. Then variants:
  the "side effect" cases, the "violated norm" cases (e.g., a clerk who violates a
  rule to help), cases where harm vs help flips. Include a pair that''s hard to reconcile.


  Cases:

  1. Chairman case: program harms environment, chairman says "I don''t care, just
  profit" — harm brought about intentionally.

  2. Help version: helps environment, chairman doesn''t care — not intentional.

  3. New ones: a norm violation with no harm — e.g., Knobe''s "sales agent who takes
  pen home"? Or the "aunt''s car" cases. A case where the side effect is neutral but
  violates a rule: e.g., a company program that requires employees to wear green on
  Fridays to boost profits; chairman doesn''t care about green, only profit. Intuition:
  did he intentionally make them wear green? Knobe studied this: people say yes for
  rule-violating side effects (the "Nazi rally" case? Actually Knobe''s pen case:
  chairman allows sales exec to take a pen; that''s fine).


  Better: the "rule violation" variant — Knobe (2007?) studied cases where side effect
  violates a rule but no harm: e.g., a department policy says no one can work on weekends;
  a chairman authorizes a program knowing it requires weekend work, caring only about
  profit. Verdict: he intentionally got them to work weekends. Whereas if rule requires
  weekend work and program requires it too, no intentionality attribution. This asymmetry
  suggests norms, not harm per se, drive judgments.


  4. A skilled case: e.g., an archer who hits a bullseye by skill vs luck — skill
  case: if the outcome is a genuine achievement of skill, intentionality attributed
  even without desire.


  Pair hard to reconcile: asker might say skill case "intentional" but help-chairman
