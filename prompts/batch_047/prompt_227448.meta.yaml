  Question idea: "An engineer proposes: build the AI as a perfect Bayesian with a
  prior over computable hypotheses including itself, then run UDT." Ask students to
  identify where this fails for embedded agents — specifically the realizability/self-model
  problem and logical uncertainty, and the 5-and-10 problem (spurious counterfactuals:
  a proof-searching agent that takes the action it can prove leads to highest utility
  may find spurious proofs like "if I take action B, utility 0" becoming self-fulfilling
  via Löb). The 5-and-10 problem is a great in-the-weeds crux but well-known in rationalist
  circles.


  Marking scheme: must-hit points — (1) why full Bayesianism over worlds-containing-self
  is impossible (can''t contain an exact model of a bigger world; self-reference),
  (2) logical uncertainty — agent doesn''t know mathematical facts at decision time,
  so "expected utility given known math" is ill-defined, (3) the 5-and-10/spurious
  proofs problem as an instance of proof-based decision theory going wrong via Löb,
  (4) why the failure matters practically (tiling/self-modification: agent must trust
  successors; Löbian obstacle to trusting same-proof-system successors), (5) what
  a fix would have to look like (not enumerating hypotheses but changing the decision
  procedure / logical induction etc.). Note common errors: confusing embedded agency
  with ordinary bounded rationality or compute limits.


  Casual voice, rationalist reader, typo or two. Keep it reasonably short. No quotes
  needed. No web search needed — this is my knowledge, and I''m not quoting anything.


