  model answer and marking scheme. Casual tone, a typo or two.


  Embedded agency: the idea that agents are part of the world they reason about —
  problems: logical uncertainty, naturalized induction, decision theory (embedded),
  robust delegation. Scott Garrabrant & Abram Demski''s "Embedded Agency" sequence.
  I know this well enough; no need for quotes. Avoid verbatim quotes.


  Write an exam question for, say, a seminar on formal epistemology/AI safety. Make
  it hard: not "list the four subproblems." Something like: the tiling agents problem
  / Löbian obstacle, or the tension between logical uncertainty and Bayesianism. A
  good crux: why can''t an embedded agent just use Solomonoff induction + expected
  utility? The realization problem: the agent must contain a model of a world containing
  itself — self-reference, Löb''s theorem, the 5-and-10 problem, spurious proofs.


  Design: one essay question, model answer ~600 words, marking scheme separating A
