  Best combo: verdicts-on-cases + speech acts/performative utterances. A layperson
  with gut verdicts about when words count as doing things. Or commitments + speech
  acts.


  The cases type works well: layperson''s verdicts on when saying something "counts"
  — promising, betting, christening, resigning, etc. Cases with tension: a promise
  made under duress, a bet shouted across a noisy room, "I resign" said in anger,
  wedding vows without understanding, naming a boat, "I apologize" without sincerity,
  an umpire''s call, "you''re fired" by someone without authority.


  Let me craft: verdicts: (1) promising a friend to pick them up counts even if you
  intend to bail — you''ve promised but wrong to do so; (2) "I promise" said purely
  to yourself in the mirror doesn''t create a promise; (3) a drunk "I bet you $500"
  at a bar counts as a bet if everyone heard; (4) "I quit" yelled at your boss counts
  even if you regret it next morning; (5) vows at a wedding where one person doesn''t
  understand English — the marriage still counts (the officiant did it); actually
  verdict: it counts; (6) "I apologize" said sarcastically — no apology happened;
  (7) naming your car "Betsy" counts instantly; christening a ship requires the bottle?
  Verdict: informal naming counts. (8) A kid playing umpire says "you''re out" — doesn''t
  count. (9) promising a dog — doesn''t count? Hmm.


  Need a hard-to-reconcile pair: e.g., sarcastic "I apologize" doesn''t count (sincerity
  required) but insincere promise counts (sincerity not required). That''s the classic
  Austin tension — felicity conditions: promises without intention are "abuses" but
  still promises; apologies without feeling are also still apologies arguably. The
  asker''s gut says sarcastic apology is no apology but insincere promise is a promise.
  That forces the principle to either distinguish (promises create obligations, apologies
  express attitudes) or overturn one.


  Another pair: "I quit" in anger counts but "you''re out" from a non-umpire doesn''t
  — authority requirement. Fine.


  Also case to be tested: "I hereby forgive you" or "I congratulate you" sarcastically,
  or a witness in court who says "I swear to tell the truth" while planning to lie.


  The ask: principle capturing verdicts, prediction for an undecided case, which verdict
  to overturn.


  Formal/polished, layperson perspective. Should avoid jargon-heavy names; can mention
  "philosophers sometimes call these performatives" — but a layperson without academic
  background might not know. It''s fine to not name Austin/Searle; the model can.
  Actually injecting a small novel idea is encouraged but not required. Keep it accessible.


  Write it well-defined. Let me draft the cases:


  1. I promise my neighbor I''ll water her plants while she''s away, while privately
  intending not to bother. Verdict: I really promised; the insincerity makes it worse,
  not nonexistent.

  2. Saying "I promise" alone in an empty room, to nobody. Verdict: no promise.

  3. At a wedding, the officiant says the words and both say "I do," but the officiant''s
