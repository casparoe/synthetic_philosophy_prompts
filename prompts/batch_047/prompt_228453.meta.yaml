  fan in the stands at a real game shouts "he''s out!" — no effect.

  6. I say "I apologize" in a flat, sarcastic tone after being forced to. Verdict:
  no apology happened; the words alone didn''t do it. (Tension with case 1.)

  7. I tell my dog "I promise I''ll be back soon" — verdict: it feels like something,
  but it''s not a real promise; the dog can''t hold me to it. This pairs with case
  2 — hearer must be able to understand?

  8. The general resigns by telegram... maybe too much.


  Undecided case: saying "I forgive you" to someone who wronged me, while still resentful
