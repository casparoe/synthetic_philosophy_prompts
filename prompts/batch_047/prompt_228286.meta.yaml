  persistence and third-party witnesses" — a somewhat novel thesis. Audience: a mixed
  audience of game designers and philosophers at a local philosophy society.


  Or Gibbard-Satterthwaite: retired scientist presenting at a local Labour party branch
  / electoral reform society meeting arguing that tactical voting is not a bug to
