  The "construct a thought experiment to specifications" combined with "the unilateralist''s
  curse" would be nicely in-the-weeds. The unilateralist''s curse: when a group of
  agents each individually can undertake an initiative with potential downsides, and
  each estimates the value differently, the initiative tends to happen because the
  most optimistic agent acts unilaterally — even when the group''s aggregate judgment
  would be against it. Classic examples: someone releases information, a member of
