  Misrepresentations:

  - Russell did think paternity-certainty was a major historical source of patriarchal
  sexual ethics (true, ch. II–III), but he didn''t reduce all traditional morality
  to that plus superstition; he also acknowledged genuine aims (e.g., protecting children,
  channeling deep feeling).

  - He does NOT conclude sexual ethics is purely private: his opening chapter asks
  why a sexual ethic is needed at all and answers that one is needed; his positive
  morality imposes constraints (honesty, no deceit, seriousness of feeling, and above
  all the welfare of children). He argues the state/society retains a legitimate interest
  where children are concerned — he supported marriage as the best framework for child-rearing
  and opposed divorce being too easy where children exist.

  - Jealousy: Russell treats jealousy as partly instinctive and not wholly conquerable;
  he says it should not be given moral status as a justification... He argues jealousy
  is not an adequate justification for demanding fidelity but he doesn''t claim we
  can simply train ourselves out of it. That''s a subtle overstatement.


