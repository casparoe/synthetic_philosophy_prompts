reasoning_summary: 'Let me think about which domain and type to combine. The teaching-plan
  type seems richest and matches "in the weeds" requirement. Let''s pick Gödelian
  anti-mechanist arguments (Lucas–Penrose) — that''s a concept with real dependency
  structure and predictable misconceptions (confusing Gödel''s first theorem with
  the second, thinking humans can "see" the truth of the Gödel sentence, conflating
  consistency with soundness, etc.). Or the paradox of voting. Lucas–Penrose is juicy
  for misconceptions.


  Write casually, maybe a typo or two. Audience: e.g., a reading group of math undergrads
  / philosophy club. Ask for order of ideas, carrying example, misconceptions, where
  to head them off, check for understanding, what to leave out.


  No quotes from real texts needed. No citations. Good.


  Draft:


  "I''m running a one-off session for our uni philosophy society on the Lucas–Penrose
  argument — the claim that Gödel''s incompleteness theorems show the mind can''t
  be a machine..."


  Include: what has to come first (informal incompleteness, Gödel sentence, the difference
  between truth and provability, consistency assumption), the carrying example (maybe
  a simple "this statement is unprovable in system X" puzzle), misconceptions in the
  order they''ll arise ("Gödel proved there are unprovable truths full stop", "humans
  can always see the Gödel sentence is true", "the argument shows consciousness is
  mysterious/quantum", confusing first and second theorem), where to head each off,
  end check (e.g., ask them to state exactly what the human is supposed to know that
  the machine doesn''t, and under what assumption), what to openly refuse to cover
  (the quantum mechanics stuff in Penrose, the details of Gödel numbering).


  Casual tone, one typo. Length: medium. Write it.'
