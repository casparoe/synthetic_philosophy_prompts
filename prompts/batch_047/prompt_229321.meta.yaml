  qualia realism (indeterminacy between two hypotheses), and evaluate whether the
  indeterminacy is epistemic or metaphysical, and whether a qualia realist can just
  bite the bullet (there is a fact, we just can''t know). Must-hit points: (1) correctly
  state the two interpretations; (2) identify the epistemic/metaphysical gap — Dennett
