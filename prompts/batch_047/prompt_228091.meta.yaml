  The context: multiple AIs or delegates play a game on behalf of principals, they
  all use the same default strategy/algorithm, but can recognize each other and coordinate
  to deviate. A deviation is a "safe Pareto improvement" if under any assumption about
  what the opponents would have done under the default, the deviation is weakly better
  for everyone and strictly better for someone. The classic example: two delegates
  playing a prisoner''s dilemma — if both can recognize each other as copies of the
  same program, they could both switch to cooperation; that''s a safe Pareto improvement
  because no matter what the other player would have done under the default (defect),
  switching to (C,C) is better for both than (D,D). Importantly, the deviation need
  not be an equilibrium of the game — (C,C) in one-shot PD is not a Nash equilibrium,
  but switching from default (D,D) to (C,C) is safe because it''s better regardless
  of the counterfactual about the default.


  Key subtleties:

  1. The deviation is evaluated against counterfactual default play, not against equilibrium
  logic — this connects to evidential/functional decision theory and the "why ain''t
  you rich" debate.

  2. Safety requires the improvement hold in all states of uncertainty about the others''
  default behavior — the universal quantification makes SPIs rare; finding them relates
  to correlated equilibria / coarse correlated equilibria.

  3. Strategic incentives to deviate: an SPI deviation isn''t individually rational
  in the Nash sense (other delegates could exploit), so it requires some commitment/trust/transparency
  mechanism — this connects to program equilibrium (Tennenholtz) and Newcomb-like
  problems.

  4. The notion is equilibrium-selection-free: it doesn''t require knowing which equilibrium
  the default settles on.


