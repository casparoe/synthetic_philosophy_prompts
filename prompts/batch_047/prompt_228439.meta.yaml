  2. Judy''s radio message "If you''re in Blue, you''re in HQ" is a proposition she
  learns, so she should conditionalize on it.

  3. The message is true in the red-region possibilities too (vacuously), so it only
  rules out Blue & non-HQ.

  4. Therefore after the message her credence in Blue stays the same... Actually conditionalizing
  on ¬(B ∧ ¬H) — the material conditional — shifts probability mass: P(B|message)
  = P(B∧H)/(P(¬(B∧¬H))) which decreases Blue''s probability.


  Hmm, the standard puzzle: priors P(B)=P(R)=1/2; P(H|B)=1/2, P(H|R)=1/2, so all four
