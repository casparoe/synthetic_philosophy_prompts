  ---


  I teach a final-year module on the philosophy of prediction in the social sciences,
  and this term I am staging an adversarial collaboration on the long afterlife of
  Malthus. The two parties are real positions, though I shall present them anonymously:
  a defender of the view that Malthus''s principle of population was essentially right
  but early — a true tendency claim whose conditions were temporarily suspended by
  industrialisation and which reasserts itself wherever those conditions lapse — and
  a critic who holds that the theory generated definite expectations that failed,
  and that every subsequent rescue (longer horizons, ceteris paribus clauses, talk
  of ''postponement'') is a textbook case of immunising a refuted theory against evidence.


  Draft the joint statement such a collaboration ought to produce. Specifically:


  1. A numbered list of claims both parties can sign. I expect these to include the
  actual content of the principle (geometric growth of population against arithmetic
  growth of subsistence, checked by misery or restraint), the broad historical facts
  neither side disputes (the Malthusian character of pre-industrial economies; the
  sustained divergence of output per head from population growth after roughly 1800;
  the demographic transition), and the methodological commitments both accept (that
  a respectable theory must, at least eventually, issue in claims evidence could bear
  on).


  2. A table of residual disagreements, each formulated in wording its own side would
  accept. Candidate rows: whether the first-edition claims were ever falsifiable in
  principle; whether ''right but early'' differs from ''unfalsifiable''; whether the
  demographic transition refutes the constancy of the passions premise or merely complicates
  it; whether neo-Malthusian revivals (the population-bomb literature of the 1960s-70s)
  inherit the same methodological vice or have been vindicated in part.


  3. For each disagreement, the crux: the sub-question such that settling it would
  move at least one party. I suspect one crux is the line between a legitimate tendency
  law (comparable to gravitational or economic claims) and a claim insulated from
  counter-evidence; another is whether a theory confirmed by its own epoch but disconfirmed
  later has thereby been falsified or merely bounded.


  4. For each crux, the case, episode, or observation both parties accept as bearing
  on it, with each side''s prediction recorded in advance — for example, what each
  expects of societies where population growth now outpaces institutional and technological
  adaptation, or what each would say if per-capita income stagnated for a century
  under continued population growth.


  Where a disagreement dissolves on inspection into a dispute about words — I suspect
  part of the quarrel about ''falsification'' does, since the two sides may be using
  Popperian and Lakatosian standards at cross purposes — say so, identify which part,
  and restate what remains once the verbal element is removed. Conclude with a short
  note on whether the collaboration has, in your drafting, actually narrowed anything,
  or merely restated the impasse more politely.


