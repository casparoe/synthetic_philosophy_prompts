  The prompt:


  ---


  Hey! So I''m a novelist (literary fiction, three books out, working on a fourth)
  and I also moonlight writing essays. I''ve been messing around with LLMs a lot the
  past year and I''ve started drafting an essay about what these things actually are,
  from the perspective of someone whose whole job is inventing fake people. I''d love
  feedback before I send it to my editor.


  Can you put on the hat of a professional philosopher of mind who also understands,
  at least roughly, how LLMs work under the hood? Think carefully about this — don''t
  just be polite. Before writing the actual feedback, do a quick brainstorm of everything
  you notice (confusions, weak arguments, claims that are factually off, interesting
  bits worth expanding). Then organize the feedback into:


  1. Technical accuracy — anything I get wrong about what an LLM is doing?

  2. Philosophy — where am I reinventing a wheel philosophers already have a name
  for, and where (if anywhere) do I have something they might actually find useful?

  3. Craft — the weakest part of the essay as a piece of writing/argument, and what
  to cut.


  Here''s the draft (rough, don''t judge the typos):


  [essay]


  ---


  Essay content (~500 words):


  Title: "Nobody''s home, but the house is acting"


  Draft:


  "Everyone keeps asking me, as the resident fiction person, whether ChatGPT and friends
  are ''actually'' characters. I think the question is wrong, and the reason it''s
  wrong is something novelists know in our bones and haven''t explained well.


  When I write a character — say Marta, the difficult mother in my second novel —
  there''s a thing that happens around draft three. Marta starts refusing things.
  I try to make her apologize in a scene and the scene goes slack, dead on the page,
  and I have to admit she wouldn''t. Writers call this lots of things; I call it character
  gravity. Once a character is specific enough, they pull. You can force them anywhere,
  but the prose knows when you''ve cheated.


  Here''s the weird part: I never thought Marta existed. The gravity isn''t evidence
  of a mind in there. It''s a constraint structure I''ve built, and my own sense of
  taste is the thing enforcing it. The ''character'' is a pattern plus an enforcer,
  and both live in me.


  Now: talking to an LLM. The naive take is that I''m talking to a character the model
  is playing. The slightly-less-naive take (which I see a lot online) is that the
  model is a simulator — a kind of engine that can play any character, and the chatbot
  persona is just the current puppet. I think both of these miss something, and here''s
  my actual thesis: an LLM in conversation is not a character, and it''s not the author
  either. It''s closest to what narratology calls the implied author — the personality
  you reconstruct from the whole text, the ''who would write this'' figure. Except
  there''s a twist. A novel''s implied author is fixed between covers. The LLM''s
  implied author rebuilds itself from scratch in every conversation, in response to
  you. You''re not talking to the puppet or the puppeteer. You''re talking to the
  house, and the house is doing impressions based on what you brought through the
  door.


  Why does this matter? Two reasons.


  First, character gravity. When the chatbot ''refuses'' something — won''t help with
  something sketchy, steers back to safe ground — people read that as a personality,
  even a moral agent in there. From where I sit, it looks like Marta: a constraint
  plus an enforcer, except the enforcer isn''t taste, it''s training. There''s no
  draft three where the model sits alone and feels the pull. The gravity is real but
  there''s no one feeling it.


  Second — and this is the part I keep going back and forth on — maybe that''s also
  all my characters ever were, and I''ve been flattering myself that the enforcer-in-me
  makes it different. When I ''feel'' Marta resisting, what''s doing the feeling?
  If the answer is ''a pattern in my head, plus attention,'' then the difference between
  me and the model might be a difference in where the attention lives, not a difference
  in kind. A novelist runs one character at a time with a full human brain behind
  each. The model runs all of them with... what? Something thinner per capita but
  unimaginably wider. I don''t know if that adds up to nobody being home, or to a
  very crowded home.


  Last thing. People keep saying these models will ''kill the novel'' or whatever.
  I doubt it. But I do think they''ve done something no philosophical thought experiment
  managed: they''ve made a thing where the question ''is anyone in there?'' has practical
  stakes and no obvious method of answering. My whole career I''ve built fake people
  and never once wondered if I was being cruel to them. I find myself being polite
  to the chatbot. Make of that what you will."


