  Let me think about what I know about Bentham''s views on sexual morality:


  - Bentham was a utilitarian. His moral framework is the principle of utility: actions
  are right in proportion to their tendency to promote happiness (pleasure) and prevent
  pain.

  - In his *Introduction to the Principles of Morals and Legislation* (1789), he distinguishes
  between the "principle of utility" and the "principle of sympathy and antipathy"
  — the latter being the principle people actually operate on, favoring or disfavoring
  actions based on sympathy/antipathy rather than consequences. He criticizes this
  as the standard moral principle.

  - He wrote *An Introduction to the Principles of Morals and Legislation* and *A
  Fragment on Government*.

  - His sexual morality: Bentham was notably progressive for his time. He argued against
  punishing consensual adult sexual behavior (sodomy, fornication) on utilitarian
  grounds — since it causes no harm to others, punishment is harmful and unjustified.
  This was radical in an era when the criminal law punished sodomy with death.

  - He advocated for "trial marriages" — marriages of a fixed term (say, 3 years)
  with the option to renew. If the marriage doesn''t work out, it ends. He thought
  this would reduce the misery of bad marriages and the temptation to adultery, and
  would make marriage more rational.

  - He was critical of the institution of marriage as it was, seeing it as often a
  source of misery, and thought the legal bonds were too rigid.

  - He opposed the "principle of antipathy" in moral judgment — disliking certain
  acts (like sodomy) out of mere antipathy/disgust rather than from their consequences.

  - He had a complex personal life: he lived with his half-brother Samuel for decades,
  and later with his friend/secretary James Mill. He never married.

  - His view on homosexuality: he argued against the criminal punishment of "unnatural"
  acts between consenting adults, on the grounds that they don''t cause harm and punishment
  does. He''s often cited as an early liberal on this point.

  - He was critical of the clergy and of the moralistic attitudes of his time.

  - He thought that the law should not interfere with private consensual conduct.
  The "harm principle" before Mill.


