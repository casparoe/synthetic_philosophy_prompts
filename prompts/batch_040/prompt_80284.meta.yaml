  I''ve been working for the past few months on the genealogy of the harm principle,
  and I''ve come to think that the standard story — that Mill''s "On Liberty" is the
  real source of the modern view that the state may only restrict conduct to prevent
  harm to others — systematically mislocates the origin of that view in Bentham. I
  want to develop an argument for a position I haven''t seen stated quite so sharply,
  and I''d like you to make it as rigorously as you can.


  The position: Bentham''s defense of consensual adult sodomy (and of his "trial marriage"
  proposal, a fixed-term, renewable marriage contract) is not, as is usually assumed,
  a straightforward application of the principle of utility. It is, rather, an application
  of what Bentham calls the "principle of sympathy and antipathy" — his descriptive
  account of how human beings actually evaluate actions, as distinct from the normative
  "principle of utility" that tells us how we ought to evaluate them. In other words,
  Bentham''s sexual-morality arguments rest on the psychology of moral judgment, not
  on the calculus of consequences, and this is a much more radical (and much more
  vulnerable) move than the utilitarian reading allows.


  Here is the material to work with. Bentham''s principle of utility holds that actions
  (and laws) are to be approved or disapproved in proportion to the tendency they
  have to augment or diminish the happiness of the party or community concerned. His
  principle of sympathy and antipathy, by contrast, is a psychological claim: it describes
  the actual sources of a person''s approval or disapproval of an action, which Bentham
  lists as (among other things) the agent''s own interest, the interest of the person
  affected, and the "natural" feelings of sympathy or antipathy toward the agent or
  the act — feelings that operate independently of any calculation of consequences.
  Bentham was explicit that sympathy and antipathy are not the correct standard of
  approval; they are the standard people in fact use, and they are a source of systematic
  error.


  Now, Bentham''s actual arguments against the legal condemnation of consensual sodomy
  run roughly as follows: (1) the act, between competent adults, causes no real pain
  or loss to any identifiable person, so it fails to meet the standard on which the
  law may properly act; (2) the condemnation of the act rests on a "prejudice" or
  "antipathy" that people feel toward it, not on any demonstration of harm; and (3)
  appeals to the "law of nature" or to the "order of creation" are fallacious, because
  they smuggle in the very antipathy they purport to derive from nature.


  Your task: argue, as rigorously as you can, that these three arguments are best
  understood not as applications of the principle of utility, but as applications
  of the principle of sympathy and antipathy run in reverse — i.e., Bentham is using
  his descriptive account of how people actually (mis)judge the act to explain and
  thereby dissolve the legal condemnation, rather than computing the act''s balance
  of pleasures and pains. Then, and this is the harder half, say what this reading
  costs: if Bentham''s sexual-morality position rests on sympathy and antipathy rather
  than on utility, then (i) it is not a secure utilitarian position at all, and (ii)
  it exposes a tension in Bentham''s system, because the same descriptive principle
  that explains why people wrongly condemn sodomy could, in principle, explain why
  people wrongly condemn other acts that utility would condemn. End by saying whether,
  on this reading, Bentham''s sexual morality is more or less defensible than the
  standard utilitarian reading gives it credit for, and whether Mill''s harm principle
  is better or worse off for being descended from it.


