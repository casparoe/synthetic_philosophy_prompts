  \ to perform, all else equal, by virtue of the act of promising alone. The promisee's\
  \ psychological state — whether she relies, expects, or even knows about the promise\
  \ — is not what grounds the obligation. On this view, Maya's promise binds her in\
  \ the base case. She sincerely intended to be bound, the promise was properly made,\
