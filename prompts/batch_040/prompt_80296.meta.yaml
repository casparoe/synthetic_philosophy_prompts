  Leaves (named positions):

  - Conclusion-based (standard; awkward commitment: the group''s final judgment can
  be based on premises the majority rejects — "the verdict is right for the wrong
  reasons").

  - Premise-based (awkward: the group''s conclusion can follow from premises the majority
  didn''t all accept as a package; also, the group can reach a conclusion the majority
  rejects).

  - List''s prioritization rule (awkward: it''s ad hoc / arbitrary which level gets
  priority; it''s a "possibility theorem" that rescues consistency by violating a
  natural condition).

  - Agenda control / "no independence of agenda" (the group restricts which propositions
  it votes on; awkward: the outcome depends on how the agenda is framed — a kind of
  "preference cycling via agenda").

  - Domain restriction (awkward: the admissible individual judgments are limited in
  a way that''s hard to justify ex ante).

  - Incoherence tolerated (the "incoherent group" option; awkward: the group''s official
  record is self-contradictory — how does a court issue a contradictory judgment?).

  - "Groups don''t have beliefs" / deflationary (the group only has preferences; the
  dilemma is a category mistake; awkward: it explains away a lot of what we do — courts,
  committees — or commits us to a very thin view of collective agency).

