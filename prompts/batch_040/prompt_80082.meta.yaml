  Draft:


  Two friends of mine, Mara and Eli, got into a long argument at a dinner after reading
  David Benatar''s work on antinatalism, and I couldn''t referee it. Here''s roughly
  how it went.


  Mara started by saying she thought Benatar''s asymmetry was the strongest part of
  the case, but that she couldn''t get past the fact that it seemed arbitrary. Benatar''s
  asymmetry, as she put it, goes like this: the presence of pain is bad, the presence
  of pleasure is good, the absence of pain is good even if there is no subject to
  be relieved of it, and the absence of pleasure is not bad even if there is no subject
  to be deprived of it. And she said the interesting claim is the asymmetry between
  the third and fourth: why should the absence of pain count as a good without a subject,
  while the absence of pleasure doesn''t count as a bad without a subject? It looked
  to her like Benatar was just stipulating the conclusion he wanted.


  Eli pushed back and said it wasn''t arbitrary, because Benatar was really making
  a claim about harm versus benefit, not about pain versus pleasure as such. Pain,
  he said, is a harm — the kind of thing that is bad in itself, like a poison or a
  disease — and the absence of a poison is a good thing even if no one is poisoned.
  But pleasure is not a benefit in that sense; a benefit is something that is good
  for someone, like a gift or a cure, and the absence of a gift is not a bad thing
  if there is no one to be the recipient. So the asymmetry tracks a real distinction:
  the absence of a harm is good without a subject, but the absence of a benefit is
  not bad without a subject.


  Mara conceded that was a cleaner way to put it, but then she pressed a generalization
  problem. If the principle is "the absence of a harm is good without a subject,"
  she said, then what counts as a harm? Boredom is a harm — a life of total boredom
  is bad — so is the absence of boredom good even if no one is bored? By the principle,
  yes. But now flip it: is the absence of love bad even if no one loves? She thought
  most people would say a world in which no one loves is a worse world, even though
  no one is deprived of love (because no one exists to be deprived). So the principle
  didn''t generalize — it worked for pain but not for love — and that suggested Benatar
  was cherry-picking the cases where the asymmetry felt right.


  Eli said that was fair pressure but didn''t break the argument, because the pain/pleasure
  case was special: pain and pleasure are experiential, they are good or bad in the
  experience itself, whereas boredom and love involve more — some relational or narrative
  structure — so the asymmetry really only applies to the experiential core, which
  is exactly where the antinatalist argument lives, because what it''s about is whether
  a life''s experiences are net bad. The generalization test, he said, was testing
  the wrong thing.


  Mara said that just made the argument narrower than it looked. If the asymmetry
  only applies to raw experience, then Benatar''s conclusion — that it is better never
  to have been — is only as strong as the separate claim that a life''s raw experiences
  are net bad, and that''s a much more controversial claim than the asymmetry itself.
  So the asymmetry, which is supposed to be the engine of the argument, only does
  work in a narrow domain, and the rest of the conclusion has to be supplied by a
  separate, contestable empirical claim.


  Eli granted that the asymmetry doesn''t do all the work, but said that was the right
  division of labor, not a flaw. The asymmetry is a logical point about the structure
  of value — it tells you that avoiding pain is a good that doesn''t require a subject,
  while creating pleasure is not a good that compensates for it. The empirical question
  — whether a typical human life has more pain than pleasure — is a separate question.
  So the argument is: (1) logically, the absence of pain is a good without a subject
  and the absence of pleasure is not a bad without a subject; (2) empirically, a typical
  human life is more likely to have more pain than pleasure; therefore (3) it is better
  not to bring a person into existence. And he thought (1) was the defensible part
  and (2) was the contestable part, which made it an honest argument.


  Mara said she could live with that division of labor, but she had one more worry.
  You said the absence of pain is a good without a subject, she said, but what does
  it mean for something to be good without a subject? If goodness is always good for
  someone, then the absence of pain without a subject is not good for anyone, so it
  is not good at all, and the asymmetry collapses. But if goodness can be good without
  being good for anyone, then you have committed to a kind of objective, subject-independent
  value, and that is a much heavier metaphysical commitment than Benatar advertises.
  So the asymmetry is either trivial (if goodness is always subject-relative) or it
  is making a big, unacknowledged claim about objective value (if goodness can be
  subject-independent).


  Eli said she had put her finger on the real philosophical cost of the argument,
  and he didn''t think Benatar hid it. The absence of pain is good in the same sense
  that the absence of a disease is good, he said, and he didn''t think that required
  a subject. When he says "it is a good thing that this virus does not exist," he
  is not saying it is good for anyone in particular; he is saying the world is better
  for lacking the virus. That is a subject-independent good. And he thought we already
  make subject-independent value claims all the time — it is bad that a forest is
  being destroyed, even if no one is there to notice — so the asymmetry is not making
  a secret metaphysical claim; it is just making the kind of value claim we already
  make.


  Mara said that was exactly where she parted ways. "It is bad that the forest is
  being destroyed, even if no one is there to notice" — she thought that was actually
  a subject-relative claim in disguise. What she meant by it, she said, was "it would
  be bad for the creatures that live there, or for the people who would be affected."
  She did not think she was making a subject-independent claim. So when Eli says "the
  world is better for lacking the virus," she thought he was actually saying "the
  world is better for the people and animals who would be infected." And if that is
  right, then the absence of pain without a subject is not good for anyone, and the
  asymmetry collapses after all.


  They left it there. I want you to go through their exchange and adjudicate it point
  by point — for each distinct move, say whether it is right, wrong, or partially
  right, and why. I also want you to say which side, if either, is more right overall,
  and what, if anything, both of them are missing about the asymmetry that neither
  of them put into words.


