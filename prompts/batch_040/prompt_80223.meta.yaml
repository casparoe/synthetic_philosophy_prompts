  The key in-the-weeds points I know about the Sleeping Beauty debate:

  1. The setup: A fair coin is tossed. If heads, Beauty is awakened on Monday only
  and then put back to sleep. If tails, she is awakened on Monday and Tuesday, each
  time with her memory erased. She doesn''t know which day it is when she''s awakened.
  What should her credence be that the coin landed heads?

  2. The halfer: 1/2. Argument: the coin is fair, and the awakening gives no new information
  about the coin (she was going to be awakened in either case), so her credence should
  remain 1/2. Also, the principle of indifference: there are two equally possible
  worlds (heads, tails), so 1/2 each.

  3. The thirder: 1/3. Argument: there are three equally possible "centered worlds"
  (awakenings): Heads-Monday, Tails-Monday, Tails-Tuesday. By the (self-locating)
  principle of indifference, each has probability 1/3. So P(heads) = 1/3.

  4. The key in-the-weeds point: the two sides actually AGREE on all the conditional
  probabilities. They agree that P(heads | Monday) and P(heads | Tuesday) have certain
  values. The disagreement is about how to "average" over the awakenings — i.e., about
  the "self-locating" or "indexical" probability. The halfer says the relevant probability
  is over the coin toss (1/2), the thirder says it''s over the awakening (1/3).

  5. The betting argument: If Beauty is offered a bet (pay $1, win $X if heads), the
  thirder says the fair price is different from the halfer. The betting argument seems
  to favor the thirder (you should accept a bet that''s favorable from the thirder''s
  perspective). But this is an argument about decision theory, not probability. The
  halfer can respond that the betting argument smuggles in an assumption about which
  "copy" of Beauty is making the bet.

  6. The "Skeptic''s" challenge: the problem is ill-posed because it''s unclear what
  "probability" is supposed to be here — is it a frequency, a credence, a betting
  disposition? The "Skeptic" says the problem conflates different notions of probability.

  7. The connection to "self-locating belief" (Lewis): the idea that there are "centered
  worlds" or "impossible worlds" that differ only in which "center" (person-time)
  you''re at. The thirder''s argument relies on treating these centered worlds as
  equally probable.

  8. The "long" vs. "short" version: in the long version, the coin is tossed many
  times, and the frequencies converge to the thirder''s answer (1/3 of the awakenings
  are in heads worlds). This is a powerful argument for the thirder, but the halfer
  can respond that the long version is a different problem.

