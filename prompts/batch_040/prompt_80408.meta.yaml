  Let''s design a prompt:


  "I keep building this argument for a punishment seminar and it feels like it''s
  leaking. (1) If a theory says an act is justified when its expected consequences
  are good enough, then it cannot treat any particular act as intrinsically forbidden
  unless doing it would be worse than not. (2) Punishing an innocent person is a bad
  outcome, but in a rare case—say a city on the edge of a lynch mob—punishing one
  known innocent person might prevent a dozen killings. (3) So a pure act-consequentialist
  theory of punishment is committed to saying that sometimes punishing an innocent
  person is all things considered right, or at least not wrong if it deters. (4) But
  punishing an innocent person is not just bad, it''s the kind of thing that is wrong
  even when it works. (5) Therefore pure act-consequentialism cannot be the right
  account of when punishment is justified. (6) The same problem hits any view that
  makes punishment a tool: if the tool is only constrained by consequences, then there
  is no principled line between punishing the guilty and using a person as a means,
  because both are just ways of producing good outcomes. (7) So the only way to keep
  the innocence line absolute is to build in desert: you may punish someone only if
  they did something wrong, and the punishment has to track how wrong it was. Which
  step do you think I have to reject, and what does rejecting it cost? I''d rather
  keep the intuition that scapegoating is wrong than give up consequentialist reasoning,
  but I''m not sure the desert move doesn''t just smuggle in the conclusion."


