  move really escapes the counterfactual account or just re-imports it in disguise
  — and whether, if it re-imports it, the interventionist account has been qualified
  into unfalsifiability, and whether that is a problem for a view of this kind.


  Finally, I want you to take a committed stance: is the ''causation in the absence
  of intervention'' problem fatal to the interventionist account, or merely awkward?
  Give me your answer and your reasons, not just a survey of the options."


