  "I hold that the interventionist (or manipulationist) account of causation — the
  view, developed most influentially by James Woodward and Judea Pearl, that X causes
  Y just in case an intervention on X would change Y — is the correct theory of causation,
  and that Lewis-style counterfactual analysis is at best a tool within the interventionist
  framework, not a rival to it. I want you to tell me what would count against this
  position.


  In particular, I want you to grapple with what I think is the hardest problem for
  the interventionist account: causation in the absence of intervention. There are
  cases where no actual intervention is available, and arguably no potential intervention
  either — causes in the deep past (the cause of the first cell division, the cause
  of an extinction event), cosmological causes (the cause of the initial conditions
  of the universe), and ''black-box'' systems where the relevant variables are not
  manipulable in principle. The interventionist''s standard response is to appeal
  to ''potential interventions'' — interventions that could have been made but weren''t
  — and to say that X causes Y iff a potential intervention on X would have changed
  Y. But I suspect this move just re-imports the counterfactual account in disguise,
  because a ''potential intervention'' is really just a counterfactual about what
  would have happened had we intervened.


  So: what would count against the interventionist position? I want the evidence,
  arguments, and intuitions that should move me, sorted by how decisive they''d be.
  I want you to distinguish between evidence that would be decisive for the view and
  evidence that would merely be awkward. I want an honest account of what a committed
  interventionist would themselves concede as counting against the view (not just
