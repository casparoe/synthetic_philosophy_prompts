  I''m a science and ideas journalist, and I''m currently writing a feature on the
  combination problem in panpsychism — the worry that, even if the fundamental constituents
  of the universe have some minimal experiential character, it is far from obvious
  how those micro-experiences could ever combine to produce the single, unified experience
  that a human being seems to have. As part of the piece, I have been interviewing
  a philosopher who is a committed panpsychist, and in the course of our conversations
  I have pressed her to give verdicts on a series of specific cases: whether each
  system has a single unified experience, and if not, how many. Her answers so far:
  a single electron has some minimal intrinsic qualitative character, but is not a
  unified subject of experience; a single biological neuron is, she says, a unified
  subject with an extremely simple experience; a nematode''s brain, with its few hundred
  neurons, supports one unified experience; an adult human brain supports one; a split-brain
  patient whose corpus callosum has been completely severed has two unified experiences,
  one per hemisphere; and a honeybee colony, however impressive its collective problem-solving,
  has no colony-level experience at all — just as many experiences as there are bees.


  The case I would like to put to her next is a patient with a partial callosotomy:
  the corpus callosum has been only partly severed, so that the two hemispheres still
  exchange some information — perhaps a few per cent of the normal fibre traffic —
  but far less than in an unoperated brain. I would be grateful if you could work
