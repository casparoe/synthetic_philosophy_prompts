  Correct parts to embed:

  - Goodman introduced the predicate "grue": an object is grue if it is observed before
  a certain time t and is green, or observed after t and is blue.

  - All emeralds observed so far have been green, so by induction we predict the next
  emerald will be green.

  - But all emeralds observed so far have also been grue (since they were observed
  before t and are green).

  - So by the same inductive logic, we can predict the next emerald will be grue (i.e.,
  blue, since it will be observed after t).

  - So the same evidence "confirms" two incompatible predictions.


  Subtle misrepresentations to embed:

  1. "So Goodman proved that induction is impossible / that inductive inference is
  invalid" — overstatement: Goodman''s point is that the *logic* of confirmation is
  neutral, i.e., the structure of the inductive argument alone doesn''t determine
  which predicates we should project; he didn''t show that the particular inference
  "emeralds are green" is unjustified, nor that induction must be abandoned. His proposed
  solution: projectibility depends on entrenchment — predicates like "green" and "blue"
  are entrenched in our language and history, "grue" is not; the inductive practice
  itself (our habits) is what selects the right predicates, and this is circular but
  defensible (he argued the circularity is harmless / pragmatic).

  2. "Grue is a perfectly good scientific predicate, on a par with green" — subtle
  error: Goodman''s point is precisely that grue is *not* admissible for the same
  reasons — well, actually, in the riddle, the point is that the *logic* of confirmation
  treats them the same way; the predicate grue is "admissible" in the sense that it''s
  grammatically well-formed and not self-contradictory, but it''s not projectible.
  A common misrepresentation is to say "grue is just as good a hypothesis as green"
  — the actual subtlety: the *hypotheses* "all emeralds are green" and "all emeralds
  are grue" are logically distinct and have different consequences; the problem is
  that the confirmation relation (as usually formalized) supports both equally. So
  the misrepresentation "grue is a perfectly good predicate on par with green" conflates
  "logically admissible" with "projectible," which is exactly the distinction Goodman
  is trying to draw.

  3. Possible conflation: "Goodman''s riddle shows that all inductive hypotheses are
  underdetermined by evidence, so science is arbitrary" — underdetermination (Duhem-Quine)
  is a different problem; grue is not the same as Duhem-Quine underdetermination (underdetermination
  is about whole theories vs. evidence; grue is about predicate choice within a single
  simple hypothesis, and the rival hypotheses are logically inconsistent with each
  other — "all emeralds are green" vs. "all emeralds are grue" both fit all past observations
  but make different predictions after t; note that they are not just underdetermined
  but actually contradictory in their predictions). A good summary might conflate
  these.

  4. "Goodman''s solution was to define a logical criterion of projectibility, e.g.,
  in terms of naturalness" — wrong: Goodman famously showed (in the same book, via
  the "grue"-like analysis of "natural" predicates) that no *a priori* logical criterion
  of naturalness works — he rejected the idea that "green" is more "natural" in a
  logical sense; his solution was pragmatic/entrenchment-based. So a summary that
  says "Goodman solved it by appealing to the naturalness of predicates" is a misrepresentation
  — naturalness is what he showed can''t be defined logically.


  Also a nice subtle point: the grue riddle is sometimes presented as "the next emerald
  will be blue," which is confusing, because "all emeralds are grue" predicts that
  emeralds observed after t will be blue — but the *same* emeralds that are green
  before t are grue; the point is that the two hypotheses are incompatible about future
  emeralds. A summary that says "so we should predict the next emerald will be blue"
  as if that''s the punchline is a misrepresentation — the punchline is that the logic
  of confirmation gives no basis for preferring green over grue.


