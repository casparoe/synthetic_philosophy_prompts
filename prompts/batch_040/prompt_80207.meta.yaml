  For the Condorcet jury theorem: A common analogy is that "more voters = more accurate"
  or "the crowd is smarter than any individual" — this is a well-known analogy (Wisdom
  of crowds). The Condorcet jury theorem says that if each voter is more likely than
  not to be correct (competence > 0.5) and votes independently, then as the group
  grows, the probability of a correct majority decision approaches 1. This is a real
  theorem. The analogy "the crowd is wiser than the individual" or "numbers bring
  wisdom" is commonly used. But there''s a subtlety: the theorem requires independence
  and competence > 0.5. If competence < 0.5, then more voters makes things worse (the
  majority is more likely to be wrong). And the independence assumption is often violated
  (correlated errors, herding, social influence).


