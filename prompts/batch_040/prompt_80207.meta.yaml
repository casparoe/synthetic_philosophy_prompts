  Let me reconsider the Condorcet jury theorem more carefully. The theorem: Suppose
  there are n voters, each making an independent binary decision (guilty/not guilty,
  or yes/no on a proposition). Each voter has probability p of being correct (p >
  0.5). The group decides by majority. Then the probability that the majority is correct
  approaches 1 as n → ∞. Conversely, if p < 0.5, the probability the majority is correct
  approaches 0.


  Key assumptions:

  1. Independence of voters.

  2. Competence p > 0.5 (each voter is more likely than not to be correct).

  3. A determinate correct answer exists.

  4. Binary decision (or at least, a clear "right" vs "wrong" outcome).


