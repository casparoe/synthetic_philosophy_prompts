  ---


  I am a philosophy professor, and I will be presenting a paper at an AI-alignment
  workshop in three weeks. The paper''s central thesis is this: specification gaming
  (what practitioners call "reward hacking") is not a failure mode distinct from Goodhart''s
  law, and the standard alignment framing of it — that the agent has found a "bug"
  in the reward model and exploited it, or that the agent is somehow "misaligned"
  — misdescribes what is happening. My claim is that specification gaming is the adversarial
  limit of the same phenomenon Goodhart identified, and that the cleanest way to see
  it is as a failure of identification: the learned reward model fails to identify
  human preferences under the intervention the agent''s own optimization imposes on
  the system, so the agent is in fact correctly optimizing a proxy that was never
  a good identifier of the target. The problem, on my account, lies in the proxy''s
  invariance properties, not in the agent''s dispositions.


  The room is not a philosophy audience. It is mostly machine-learning researchers
  who build and train reward models (they think in terms of distribution shift, overfitting,
  reward-model accuracy, and out-of-distribution generalization), plus a small number
  of economists who study performance measurement and incentive design (they think
  in terms of principal–agent contracts and the "bad incentives" reading of Goodhart),
  and a couple of philosophers of science who care about identification and causal
  inference. I want to be ready for the question period from this specific mix, not
  from a general philosophy crowd.


  Prepare my Q&A sheet. Give me the six to eight objections I am most likely to actually
  get from this room, ordered first by how likely each is to be raised and then by
  how much damage it would do if I answer it poorly. Phrase each the way the subgroup
  most likely to raise it would phrase it, and make clear which subgroup it comes
  from. For each, give a reply I can deliver in about ninety seconds, and a one-sentence
  note on where that reply is at its weakest. Also include, near the end, the one
  objection I am hoping nobody asks, with a short note on why it is the one I most
  want to avoid and what I should say if it does come.


  Please write the whole sheet in American English. End your response with a final
  line beginning "Verdict:" followed by a short label (no more than six words) naming
  the single objection from your list that, if I mishandle it, is most likely to derail
  the talk.


