  Hofstadter''s actual argument (from memory, to be verified): the piece is a satire
  that exposes the "male default" in the word "person." The technique: he writes the
  ads treating "person" as if it had a sex, and in doing so he makes explicit the
  gendered conventions that are already silently operative in the personals genre.
  His point (as I understand it) is that the "male as norm" is a social convention
  that the language silently inherits, and that making it explicit reveals its arbitrariness
  and its load. The satire is not the claim that "person" semantically means "male
  person"; it''s the claim that the word functions in a male-default way because the
  social world is male-default, and the "neutrality" of the word is a mask for that
  default.


