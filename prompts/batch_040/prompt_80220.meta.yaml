  Frege–Geach: the crux — expressivism (e.g., Ayer''s emotivism) is in trouble with
  the "embedding" problem: moral sentences don''t behave like truth-apt assertions
  when embedded in conditionals ("If stealing is wrong, then it is wrong to recommend
  it"), negations, or quantifications. The standard response: the "minimally expressivist"
  / "non-cognitive" account of embedded moral sentences — that the expression of a
  non-cognitive attitude in an embedding is not a straightforward expression of an
  attitude. Or: the "cognitivist" reply that expressivists can adopt a "quasi-realist"
  (Stevenson, Blackburn) approach. In-the-weeds angle: the specific structure of the
  Frege–Geach argument: (1) moral sentences are used in indicative conditionals; (2)
  the antecedent/consequent of an indicative conditional must be truth-apt (because
  the truth-value of the conditional depends on the truth-values of the parts); (3)
  moral sentences are used in such conditionals; (4) therefore moral sentences are
  truth-apt; (5) therefore expressivism is false. The in-the-weeds crux: does the
  argument really show that moral sentences must be truth-apt, or does it show that
  the *meaning* of moral sentences must be such that their use in conditionals is
  explained by something other than truth? The expressivist response: the "expressive"
  account of conditionals — that the expression of an attitude in an embedding is
  a "weaker" or "different" attitude (e.g., "If stealing is wrong, then it is wrong
  to recommend stealing" expresses a conditional attitude / a "biconditional" attitude).
  This is really in the weeds and a good crux: the question is whether the expressivist''s
  "embedded attitude" move is a genuine response or a mere stipulation.


  Are genuine moral dilemmas possible: the crux — the distinction between "epistemic
  dilemmas" (we can''t know which option is right) and "genuine" (ontological) dilemmas
  (both options are genuinely obligatory / wrong, and there is no fact of the matter
  about which to do). Also: the "supererogatory" vs. "dilemma" distinction; the "remnants"
  problem (after choosing one option in a dilemma, the other remains — do you have
  a "remnant" duty to compensate?). In-the-weeds angle: the "remnants" problem — after
  resolving a dilemma by choosing one option, is there a residual obligation to compensate
  for the wrong done by the other? This is a really in-the-weeds issue (Rae, 1990s;
  "The Remnants of Dilemmas"). Also: the "tie" case — two equally good options; is
  that a dilemma? The distinction between "moral dilemmas" (two obligations conflict)
  and "moral ties" (two options are equally good). A good exam question: "Can genuine
  moral dilemmas exist? Distinguish between epistemic and ontological dilemmas, and
  argue whether the ''remnants'' problem (what remains after a dilemma is resolved)
  is a genuine objection to the possibility of genuine dilemmas." This is in the weeds
  and meaningful.


