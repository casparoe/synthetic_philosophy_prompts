  Frankfurt cases and PAP: the crux is that Frankfurt cases (Frankfurt 1986, "Alternate
  Possibilities and Moral Responsibility") aim to show PAP is false — that a person
  can be morally responsible even when they couldn''t have done otherwise, because
  the counterfactual intervener only steps in if the agent is about to choose the
  wrong option. A good "in the weeds" angle: the "deviant causation" objection, or
  the "flicker of freedom" response (van Inwagen: the agent still has a flicker of
  freedom, so the case doesn''t refute PAP), or Fischer and Ravizza''s guidance control
  / reasons-responsiveness response — Frankfurt cases work fine for moral responsibility
  if you reformulate responsibility in terms of reasons-responsiveness. Also the "two-dimensional"
  distinction: some Frankfurt cases remove the ability but preserve responsibility
  (the agent''s reasons-responsiveness mechanism is intact). A good crux: whether
  Frankfurt cases actually refute PAP, or whether they merely show that the standard
  formulation of PAP is too strong; and the "flicker" objection by van Inwagen, and
  the response that the counterfactual intervener makes the case not a genuine case
  of "couldn''t have done otherwise" in the relevant sense. Or the "no-flicker" Frankfurt
  cases where the intervener is already in motion / triggered by the decision itself
  (e.g., Black''s case: Black will make the agent choose A if and only if the agent
  freely chooses A — the agent has no alternative but is responsible; this is a classic
  "no-flicker" case).


  Actually, the no-flicker case (Black''s) is a nice in-the-weeds detail: in Black''s
  case, the intervener Black will bring about the agent''s choosing A if the agent
  does not freely choose A — but the agent freely chooses A. So the agent has no alternative
  (if he chose otherwise, Black would have made him choose A), yet he is fully responsible.
  This is a genuine no-flicker Frankfurt-style case. The crux question: does Black''s
  case refute PAP? The response: (a) Frankfurt cases refute PAP but the refutation
  is trivial / shows that responsibility doesn''t require alternative possibilities,
  but critics say the cases are "deviant" — the agent''s ability is counterfactually
  fragile. (b) Fischer and Ravizza: responsibility requires guidance control; in Frankfurt
  cases the mechanism is reasons-responsive, so responsibility is preserved.


