  I am taking an advanced course in epistemic game theory and have been trying to
  write down my own position on what common knowledge of rationality can do before
  a seminar discussion. I was discussing the issue with a friend who thinks I am smuggling
  in equilibrium selection, and I am not sure whether my commitments already do that.
  Here is the package I currently hold. First, I think common knowledge of rationality
  is best represented as an event in a finite model of agents'' beliefs, and that
  this representation captures the hierarchy of knowing that the others are rational,
  knowing that they know, and so on, without requiring that any agent can verify the
  whole hierarchy from the inside. Second, I think that, for normal-form games, the
  epistemic content of common knowledge of rationality is exactly rationalizability:
  the strategies that survive iterated elimination of strategies that are never best
  responses to any belief. Third, I think that in a finite game with a unique Nash
  equilibrium, common knowledge of the game form plus common knowledge of rationality
  is sufficient to predict that the equilibrium will be played. Fourth, I accept Aumann''s
  agreement theorem, on the understanding that two agents with a common prior cannot
  have common knowledge of different posterior probabilities about the same event.
  Fifth, I think this is compatible with players in a coordination game having different
  posterior beliefs about which equilibrium will be played, because their posterior
  probabilities themselves need not be common knowledge. Sixth, I think allowing for
  small probabilities of mistake should not change the set of rationalizable strategies,
  because a strategy that is a best response to some belief remains a best response
  to some nearby belief once trembles are added.


