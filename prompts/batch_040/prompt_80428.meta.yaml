  Let''s craft prompt:


  "I am taking an advanced course in epistemic game theory and have been trying to
  write down my own position on what common knowledge of rationality can and cannot
  do, before a seminar discussion. Here is the package I am currently holding: (a)
  I think common knowledge of rationality is most clearly represented as an event
  that is common knowledge in a finite model of agents'' beliefs, and that this representation
  captures the idea that each agent knows the others are rational, knows they know,
  and so on, without requiring that any agent can verify the whole hierarchy from
  the inside; (b) I think the content of common knowledge of rationality, in normal-form
  games, is the iterated elimination of strategies that are never best responses,
  so that the surviving strategies are exactly the rationalizable ones; (c) I think
  that in a finite game with a unique Nash equilibrium, common knowledge of the payoffs
  plus common knowledge of rationality is sufficient to predict that the equilibrium
  will be played; (d) I think Aumann''s agreement theorem is correct and that it shows
  two agents with a common prior cannot have common knowledge of different posterior
  probabilities about the same event; (e) I think (d) is compatible with the fact
  that players in a coordination game may have different posterior beliefs about which
  equilibrium will be played, because their posterior probabilities themselves need
  not be common knowledge. I would like you to audit this set rather than lecture
  me on the standard material. Please tell me which of these commitments are jointly
  tenable, which are in genuine tension, and which are only apparently in tension.
  In particular, I am unsure whether (b) and (c) are compatible, whether (d) and (e)
  dissolve on inspection, and whether (a) creates any problem for treating common
  knowledge of rationality as a sufficient condition for prediction. For each genuine
  tension, rank the tensions by severity, say what would have to be revised, and indicate
  the cheapest revision and what it costs. I don''t know which commitment I should
  be least attached to, so please don''t assume I am most willing to drop (c) or (b)
  in particular."


