  The questioner (a philosophy student or researcher) holds a set of positions on
  practical reasons and wants a consistency check. Let me design the set:


  1. **Internalism about practical reasons (Williams-style)**: For something to be
  a reason for an agent, it must be able to figure in a sound deliberation from the
  agent''s actual motivational set (her desires, commitments, projects) that issues
  in a motivation to act. Reasons are not "out there" independent of the agent''s
  psychology.


  2. **Moral objectivism / external moral reasons**: There are genuine moral reasons
  that bind even an agent who has no moral motivation. E.g., a person who has no concern
  for others'' suffering still has a reason not to cause gratuitous suffering. (This
  is externalism about moral reasons.)


  3. **Agent-relativity of reasons**: The reasons an agent has are partly constituted
  by the agent''s particular relationships, projects, and commitments. There is no
  fully impersonal, view-from-nowhere set of reasons that everyone shares. What is
  a reason for me may not be a reason for you, given our different motivational sets.


  4. **The "sound deliberation" route is substantive**: When we say that a reason
  must figure in a "sound" deliberation, "sound" is not just a formal/epistemic condition
  (no false beliefs, no contradictions). It is a substantive normative condition:
  a sound deliberation would, among other things, take moral considerations into account,
  even if the agent''s actual motivational set does not. (This is a move that internalists
  like Smith use to preserve internalism while getting moral reasons for the motivationless.)


  Now, the tensions:

  - (1) and (2) are in tension: (1) is internalism (reasons must connect to the agent''s
  motivational set), (2) is externalism (moral reasons bind the motivationless). This
  is an obvious tension. But wait, (4) is supposed to be the "fix" — the internalist
  says that a "sound deliberation" would take moral considerations into account, so
  the moral reason is still "internal" (it figures in a sound deliberation). But this
  is exactly where the subtle tension is: if "sound deliberation" is a substantive
  normative notion that imports moral considerations, then the "internal" requirement
  is no longer really internal — it''s smuggling in externalism. So (1) + (4) is in
  tension in a subtle way: (4) undermines the "internal" character of (1).


  - (2) and (3) are in tension: (2) says there are objective moral reasons that bind
  everyone (the motivationless sadist has a reason not to torture), which suggests
  impersonal reasons. (3) says reasons are agent-relative (constituted by the agent''s
