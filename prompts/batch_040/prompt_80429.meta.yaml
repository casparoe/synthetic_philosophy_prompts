  Stevens seems to be a man who has trained himself to be his own impartial spectator,
  yet the spectator he consults is not a neutral judge but a butler''s conscience
  formed by service, dignity, and deference. His failure with Miss Kenton is especially
  interesting, because he does not simply fail to feel; he fails to make the imaginative
  movement Smith requires, continuing to interpret her independence as a breach of
  propriety rather than as a claim on his attention. At the same time, the novel does
  not simply condemn self-command. Stevens''s restraint has real costs, but it also
  gives his life a shape, and the ending, with his walk by the sea, is neither a clean
  moral conversion nor a simple confirmation that he has been a fool all along.


