  The absent-minded driver problem: It''s a problem about "self-locating" belief and
  decision. The setup: a driver is driving from home to work. There are two identical-looking
  intersections (checkpoints), A and B. The driver is absent-minded: they won''t remember
  having passed A when they reach B. The driver knows they need to pass at least one
  checkpoint (e.g., to get a stamp / to not be late). If they pass neither, they get
  a bad outcome. If they pass both, also bad (or a different payoff). The driver has
  to decide at an intersection whether to "turn in" (pass the checkpoint) or "continue."
  But because they''re absent-minded, at each intersection they don''t know whether
  it''s A or B, and they don''t remember their previous decision.


  The problem: what is the rational decision? If the driver uses a "policy" (a plan
  to do X at an intersection), then:

  - If the policy is "always turn in": they turn in at A (good, they pass A), then
  at B they turn in again (bad, they pass both). So they pass both.

  - If the policy is "always continue": they continue at A (fail to pass A), continue
  at B (fail to pass B). So they pass neither. Bad.

  - If the policy is "turn in with probability p": ...


  The point of the problem is that there''s a tension between different decision-theoretic
  frameworks: "evidential decision theory" vs. "causal decision theory," or "policy"
  vs. "act" choice, or the problem of "self-locating" uncertainty and how to update.
  The problem is often used to argue for or against certain views about "self-locating
  beliefs" and "centering."


