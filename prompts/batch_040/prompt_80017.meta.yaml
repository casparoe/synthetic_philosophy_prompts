  ---


  You are a working philosopher at the intersection of decision theory and epistemology,
  and you''re deeply familiar with the rationalist literature on expected value and
  its pathologies. I need you to help me set a research agenda, and I want you to
  reason carefully and in a structured way about it rather than give me a survey.


  Here''s the situation. I''m advising a small working group — three philosophers,
  about eighteen months, and no empirical or computational budget — that wants to
  make genuine progress on what''s usually called the "expected value fanaticism"
  problem: the cluster of cases where EV-maximizing decision theory seems to demand
  absurd commitments, from Pascal''s-mugging-style extortion to betting nearly everything
  on vanishingly unlikely catastrophic payoffs. I''ve read the standard material (the
  Pascal''s mugging discussions, the infinite- and divergent-expected-value threads,
  the "is this fanaticism or just rationality?" framing), so please don''t re-explain
  the basics. What I want is a *defended prioritization*: which of the genuinely open
  sub-questions should this group actually spend its eighteen months on, and in what
  order.


  Structure your answer in two phases. Phase one, brainstorm: list the candidate open
  questions you see in this area as broadly as you can — include several I almost
  certainly haven''t thought of, and don''t filter for quality yet. Phase two, select
  and rank: pick the four or five that matter most and order them.


  When you rank, organize each question around a distinction I care about and want
  you to take seriously: is the question primarily (a) *epistemic* — about how we
  should assign and calibrate probabilities for tail events; (b) *axiological* — about
  whether or when the magnitude of values can be unbounded, or when outcomes are incomparable;
  or (c) *procedural/normative* — about whether EV maximization is the right decision
  rule at all, or whether we should replace it with something like satisficing, quantile,
  or expected-shortfall criteria. For each ranked question, state which of (a)/(b)/(c)
  it is, explain why it''s upstream of the others (i.e., how many of the remaining
  questions'' answers depend on it), how tractable it is for philosophers specifically
  rather than economists or ML researchers, and what argument or evidence in the next
  year or so would move it up or down the list.


  Address one specific cut head-on, because I think it''s underappreciated: the *moral-uncertainty
  mugger* — an agent who doesn''t exploit an error in your probability estimates but
  your uncertainty about your own values ("you admit it''s even possible that utilitarianism
  is true, so hand over everything"). Is this a genuinely distinct problem from the
  standard probability-mugging case, or is it the same pathology in different clothes?
  And does your ranking change depending on which it is?


  Finally, name the one or two questions you''d *deprioritize*, and say why their
  answer wouldn''t change much downstream. I''m after a defended agenda, not a literature
  review: no reading lists, no citations, no "further reading." Be explicit about
  the trade-offs between the criteria (importance, upstream-ness, tractability, neglectedness)
  and about what would change your mind.


