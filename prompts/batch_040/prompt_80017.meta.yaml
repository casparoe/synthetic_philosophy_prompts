  Task: I''m setting the agenda for a small working group (three philosophers, ~18
  months, no empirical budget) that wants to make real progress on the "expected value
  fanaticism" problem — the cluster of issues where EV-maximizing decision theory
  seems to demand absurd commitments (Pascal''s muggings, betting everything on vanishingly
  unlikely catastrophes, etc.). I''ve read most of the standard material (the Pascal''s
  mugging posts, the infinite-EV / divergent-sum discussions, the "fanaticism vs.
  rationality" framing), so I don''t want a survey. I want a *defended prioritization*
  of which open sub-questions the group should actually work on, and in what order.


  Before you give the final ranking, do a short brainstorming pass: list the candidate
  open questions you see in this area (aim for breadth, including ones I haven''t
  listed), then select and rank the top ~4–5.


  For the ranking, I want you to organize around a specific distinction I care about:
  whether each sub-question is primarily (a) epistemic — about how we should assign
  probabilities to tail events; (b) axiological — about whether/when value magnitudes
  can be unbounded or incomparable; or (c) procedural/normative — about whether EV
  maximization is the right decision rule at all, or whether we should replace it
  (satisficing, quantile/expected-shortfall decision theory, etc.). For each ranked
  question, say which of (a)/(b)/(c) it is, why it''s upstream of the others, how
  tractable it is for philosophers rather than economists or ML people, and what evidence
  or argument over the next 12–18 months would move it up or down.


  One specific cut I want you to address head-on: the "moral-uncertainty mugger" —
