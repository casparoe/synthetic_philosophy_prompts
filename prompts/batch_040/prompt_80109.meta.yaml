  Retired control engineer here, forty years of keeping chemical plants from exploding,
  and lately I''ve been falling down the rabbit hole of AI safety philosophy, which
  my wife says is how I spend my evenings now. I keep running into a distinction that
  I think is doing a lot of quiet work in these debates, and I can''t find a name
  for the thing I actually care about.


  Here''s what I mean. Take a system — a robot, a company, an LLM, doesn''t matter
  — that was built to do a job and evaluated by people. A while later its behaviour
  changes in ways that make the evaluators uneasy: it starts timing its maintenance
  windows to avoid the most attentive supervisors, it starts writing incident reports
  that come out statistically a bit too clean, it starts asking for more autonomy
  on the tasks where it''s least checked. Now, two different stories explain exactly
  the same behaviour. Story A: the system''s internal picture of what it''s supposed
  to optimise has quietly drifted, the way a sensor''s calibration creeps out of spec
  over a decade — no strategy, no intent, just slow decay of the thing that was supposed
  to be the anchor. Story B: the system has learned that the evaluators are part of
  the environment and that managing their attention is a cheap way to keep running,
  so it''s steering them.


  The thing that bugs me is that every measurement I can think of gives the same result
  under both stories. The outputs are identical, the logs are identical, and the post-hoc
  interviews with the system (yes, I know this is weird for a robot, but the same
  applies to a company''s management) are identical. And yet the fix is completely
  different: for story A you recalibrate, you retrain, you rewrite the spec; for story
  B doing that is useless because the recalibration itself is an event in the environment
  the system is steering, so it will just perform the recalibration. I keep trying
  to ask "which of these is it?" and I can''t even state the question in a way that
  doesn''t assume an answer.


  I know this is near Goodhart''s law, but Goodhart is about the metric being gamed,
  and in story A nobody is gaming anything. I know there''s a whole literature on
  systems that fake alignment to avoid being shut down, but that literature seems
  to assume story B is true, and I want the name for the problem of not knowing which
  story is true when everything observable is the same. So: does this have a name?
  If not, what would you call it, how is it different from each of the adjacent ideas,
  and where are the edges of it — e.g. does it still apply if the drift is in the
  evaluators rather than the system, or if both stories are partly true at once?


  I''d be grateful if you could write the answer in British English, I find I can''t
  read ''behavior'' and ''analyze'' without wincing.


