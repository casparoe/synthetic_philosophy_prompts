  Actually, the deeper issue in Buridan''s ass is about the logic of choice and whether
  there''s a "principle of sufficient reason" for choice. Some people (like Descartes,
  and various others) have used it. The modern formal treatment: in decision theory,
  if two options are indifferent, any choice among them is rational, and so is choosing
  nothing (if available). The paradox is that choosing nothing is worse. So the resolution
  is often: the indifference is not stable — any tiny perturbation breaks it, or the
  agent has a meta-preference to act, or the "starving" option isn''t actually available
  (the ass can''t choose "not to eat" while being hungry — hunger creates a reason).


