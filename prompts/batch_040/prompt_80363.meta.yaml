  Let me consider **Causal exclusion argument + present a position and ask what would
  count against it**. The causal exclusion argument (Kim''s argument) says: if physical
  events are causally sufficient for their physical effects, and mental events are
  non-physical, then mental events are causally excluded (they can''t be causes, or
  they cause overdetermination). The position: the causal exclusion argument shows
  that non-physical mental causation is impossible (or that mental events are either
  identical to physical events or causally inert). What would count against it?


  This is a strong candidate. The in-the-weeds angle: the argument depends on the
  principle of causal closure of the physical, plus the principle that no event can
  have two distinct sufficient causes (anti-overdetermination), plus the assumption
  that mental events are distinct from physical events. Defeaters: (1) challenge causal
  closure, (2) challenge anti-overdetermination (accept causal overdetermination),
  (3) accept identity theory (mental = physical, so no exclusion), (4) challenge the
  "sufficient cause" notion, (5) the argument only shows that if mental events are
  distinct and physical closure holds, then mental causation is overdetermination
  — but maybe that''s acceptable. Also, the "job analysis" response: the mental event
  does a different causal job than the physical. And the response that the argument
  is really an argument for physicalism, not against mental causation per se.


