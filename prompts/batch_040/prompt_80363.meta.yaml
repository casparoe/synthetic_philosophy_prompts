  **Meno problem**: Why is knowledge better than true belief? The Meno problem is
  that if knowledge is true belief plus justification, and true belief and knowledge
  both get you the right answer, what''s the extra value of knowledge? The in-the-weeds
  angle: the "tied down" vs "unfastened" belief distinction from the Meno — a true
  belief that you can''t explain is like a statue, it runs away. Knowledge is belief
  that''s "tied down" by an account of the reason. The modern value problem: what''s
  the value of knowledge over true belief? Options: (1) reliability/stability (knowledge
  is more stable), (2) the ability to use it in reasoning (inference to other truths),
  (3) the "credit" view (knowledge is credit for getting it right in the right way),
  (4) no extra value (true belief is all that matters, and the value problem dissolves).
  A good prompt could be about the value of knowledge. But I think this is a bit more
  standard.


