  Let me refine the conceptual structure for the model answer:


  - **Claim A (lock-in)**: the outcome is path-dependent, i.e., sensitive to small
  early differences, maintained by increasing returns / switching costs / network
  effects. This is a *process* / *causal* claim.

  - **Claim B (inefficiency)**: the outcome is suboptimal; a better alternative was
  available. This is an *evaluative* / *outcome* claim.

  - **Claim C (inevitability / "would have arrived anyway")**: the same (or functionally
  equivalent) outcome would have obtained even without the early difference. This
  is a *counterfactual* claim.


  Key logical relations:

  - A does not entail B. (A path-dependent process can select an efficient outcome.)

  - C (in the strong form: the *exact* outcome is inevitable) actually *undermines*
  A. If the outcome is inevitable regardless of the early difference, then the early
  difference didn''t matter, so the process wasn''t sensitive to it — not path-dependent.
  So strong-C and A are in tension / mutually undermining.

  - C (in the weak form: a *functionally equivalent* outcome would have arrived) is
  *compatible* with A but *undercuts* B''s welfare significance (if a near-equivalent
  layout would have won anyway, the welfare loss from being stuck with QWERTY is small).


  So the "would have arrived anyway" argument has a *double edge*:

  - If it''s strong (the exact outcome is inevitable), it *refutes* the path dependence
  (A).

  - If it''s weak (a functionally equivalent outcome would have arrived), it *coexists*
  with the path dependence but *reduces* the welfare loss (undercutting the case''s
  force as an example of *harmful* lock-in, while preserving the *concept* of path
  dependence).


  This is a really nice weedy structure. The exam question should ask students to
  work out this double edge.


