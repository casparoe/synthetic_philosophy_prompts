  Let me think about the exact conceptual knot to build into the question. The key
  distinction:


  1. **Lock-in (process claim)**: the outcome is sensitive to small, early, arbitrary
  differences; the system is "locked into" a path; switching costs / network effects
  / increasing returns maintain it. This is a claim about the *process* that produced
  the outcome.


  2. **Inefficiency (outcome claim)**: the outcome is worse than some alternative;
  the locked-in outcome is suboptimal. This is a claim about the *quality* of the
  outcome.


  3. **"Would have arrived anyway" (counterfactual / inevitability claim)**: even
  if the early difference hadn''t occurred, the same (or a functionally equivalent)
  outcome would have arrived via a different route. This *undercuts* the significance
  of the path dependence for *welfare* (if a better outcome would have arrived anyway,
  the welfare loss is small), but it does *not* undercut the *process* claim of lock-in
  (the path was still path-dependent).


  The weedy point: students often conflate these. They think "QWERTY is a case of
  path dependence" = "QWERTY is inefficient" = "QWERTY is a mistake that could have
  been avoided." But:

  - Path dependence (lock-in) is compatible with the outcome being efficient (the
  locked-in outcome could be the best available).

  - Path dependence is compatible with the "would have arrived anyway" claim (the
  specific layout would have been replaced, but a QWERTY-like layout would have won
  anyway — so the path dependence is "real" but the welfare loss is small).

  - The "would have arrived anyway" claim, if true, actually *weakens* the case-study
  force of QWERTY as an example of *harmful* lock-in, but does not refute the *concept*
  of path dependence.


  So the exam question: "QWERTY is the standard textbook case of path dependence.
  Explain why the claim that QWERTY is path-dependent does *not* entail that QWERTY
  is inefficient, and why the further claim that ''a better keyboard layout would
  have been adopted anyway'' does *not* refute the path-dependence claim but *does*
  (partly) defeat the case''s use as an example of harmful lock-in. Distinguish the
  three claims carefully and say what each one shows about the concept of path dependence."


  The model answer would have to:

  1. State the three claims clearly (lock-in/process, inefficiency/outcome, inevitability/counterfactual).

  2. Explain why (1) ⊄ (2): lock-in is about the process, not the outcome''s quality;
  a path-dependent process can select an efficient outcome (e.g., if QWERTY is actually
  near-optimal, it''s still path-dependent).

  3. Explain the "would have arrived anyway" claim: if true, it means the *specific*
  outcome (QWERTY) was not robustly selected, but a *functionally equivalent* outcome
  would have been; this undercuts the *welfare* significance (the loss from being
  stuck with QWERTY is small if a near-equivalent layout would have won anyway) but
  does *not* undercut the *process* claim (the adoption was still driven by early
  differences + switching costs, not by a comparison of layouts).

  4. Say what this shows about the concept: path dependence is a claim about the *causal
  process*, not about the *value* of the outcome; the concept is valuable precisely
  because it decouples "how we got here" from "whether we''re here for good reasons";
  conflating the three is a category mistake.

  5. Maybe note the nuance: the "would have arrived anyway" claim is itself a strong
  empirical claim that is hard to establish (it requires a counterfactual about what
  would have happened), and if it''s *too* strong (the outcome is *inevitable*), it
  actually *collapses* the path dependence (if the outcome is inevitable, then the
  early differences didn''t matter, so it''s not really path-dependent in the strong
  sense). So there''s a tension: the "would have arrived anyway" claim, if pushed
  to the limit (inevitability), *undermines* the path dependence; if it''s weaker
  (a functionally equivalent outcome would have arrived), it *coexists* with path
  dependence but reduces the welfare loss. This is the really weedy knot.


