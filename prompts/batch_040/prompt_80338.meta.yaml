  chance of $5M, 1% chance of $1M, 89% chance of nothing — most people pick C. The
  independence axiom says the 89% chance of nothing is common to both options in the
  second pair and should be irrelevant, and the same logic runs through the first
  pair, so picking B and C together amounts to saying at once that a 10% shot at $5M
  beats an 11% shot at $1M and that an 11% shot at $1M beats a 10% shot at $5M.


