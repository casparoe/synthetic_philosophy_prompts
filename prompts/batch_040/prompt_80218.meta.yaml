  In-the-weeds elements of RWEU that a model without web access can handle:

  - EU: maximize sum p_i u(x_i).

  - Risk aversion = concavity of u (certainty equivalent < expected value).

  - Allais paradox: the common-outcome effect; violation of the independence axiom.

  - Prospect theory: value function (concave for gains, convex for losses, loss aversion)
  + probability weighting function w(p) that overweights small probabilities and underweights
  moderate-to-large ones.

  - Rabin''s calibration: under EU, risk aversion for small stakes implies absurd
  risk aversion for large stakes (e.g., if someone turns down a 50/50 with ±$10, then
  EU implies they''d turn down a 50/50 with ±$1 million). This is a big motivation
  for rank-dependent models.

  - Rank-dependent utility (Quiglin 1982, Schmeidler 1989): weights are applied to
  the cumulative distribution function (decision weights are the differences of w
  applied to cumulative probabilities ordered by outcome ranks). Key property: it
  can satisfy first-order stochastic dominance (if w is increasing) and can handle
  the Allais paradox.

  - Key conceptual distinction: the difference between probability weighting as a
  "distortion of beliefs" (as in prospect theory for one-shot lotteries) and as a
  "rank-dependent utility functional."


  Misconceptions to preempt: (a) "the probability weighting function is just another
  utility function — so RWEU is just EU over two variables"; (b) "the Allais paradox
  shows that people are irrational/inconsistent" — actually, the paradox shows a violation
  of the independence axiom, and the rank-dependent model explains it systematically;
  (c) "risk aversion and probability weighting are the same thing" — they can be separated
  experimentally (e.g., a probability triangle, or a question about certainty equivalents
  with and without a guaranteed outcome); (d) "prospect theory is a theory of choice,
  not of judgment" — the weighting function was originally fitted to choices.


  The one example that carries the idea: the Allais paradox (the classic four bets).
  Or better: a simple "certainty effect" example: 100% chance of $100 vs. 110% chance...
  no. The classic: a 0.33 chance of $4,000 vs. a 0.66 chance of $2,000 vs. a sure
  $3,000 vs. a 0.33 chance of $0, 0.66 chance of $1,500, 0.99 chance of $0, 0.01 chance
  of $5,000... the standard Allais. That''s well known. Or the "certainty effect"
  demo: a sure $100 vs. a 95% chance of $110 — most people pick the sure thing, which
  implies a steep drop in w near 1.


  The order: (1) EU and concavity (risk aversion is already in EU — so probability
  weighting is not needed to explain risk aversion; that''s the key point to make
  early); (2) Allais/common outcome — show that EU can''t explain the pattern; (3)
  introduce the weighting function w; (4) the subtle point: why rank dependence (weights
  on cumulative probabilities of ordered outcomes) rather than just "weight each state''s
  probability" — because the latter doesn''t satisfy stochastic dominance and doesn''t
  reproduce Allais; (5) Rabin''s calibration as the payoff: why rank dependence is
  not just a trick but a structural necessity. Misconceptions along the way.


