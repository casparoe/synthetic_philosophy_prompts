  Fitch''s argument: Assume (1) all truths are knowable: for every proposition q,
  if q is true then it is possible that q is known. (2) There is a true proposition
  that is unknown: let p be a true, unknown proposition. Consider q = p ∧ ¬Kp. q is
  true (p is true and Kp is false, so ¬Kp is true). By (1), q is knowable: ◇K(p ∧
  ¬Kp). If K(p ∧ ¬Kp), then by factivity and closure under conjunction, Kp and K¬Kp,
  and K¬Kp entails ¬Kp (factivity), contradiction. So K(p ∧ ¬Kp) is impossible, so
  ◇K(p ∧ ¬Kp) is false. Contradiction. So (1) and (2) are inconsistent: if all truths
  are knowable, there can be no unknown truths.


  Response: restrict (1) to contingent truths. But q = p ∧ ¬Kp: is q contingent? q
  is true now (p unknown) and could be false (if p were known, or if p were false).
  So q is contingent. So the restriction to contingent truths doesn''t block the argument.
  This is a well-known point (discussed by, e.g., Williamson, and others). The stronger
  response: restrict to truths "without knowledge operators" or "about the world"
  — but then the restriction looks ad hoc. Or: reject factivity (e.g., the "fallibilist"
  response — replace K with "justified belief," etc.). Or: accept that the paradox
  shows all truths are known (absurd). Or: the "anti-realist" response that truth
  is knowability (verificationism), making the principle trivially true but at the
  cost of a strange notion of truth.


