  of inquirers will ultimately (in the limit) converge on.

  (2) The community converges on p by means of inquiry, and inquiry succeeds by testing
  beliefs against experience and keeping the ones that "work" (lead to successful
  action, accurate prediction, stable expectation).

  (3) So the opinion the community ultimately converges on is just the one that works
  best, in the long run, for the community.

  (4) James''s theory: A proposition p is true iff it "works" — i.e., it is good to
  believe, it pays in experience, it leads to successful satisfaction.

  (5) So James''s "works" and Peirce''s "ultimate convergence" pick out the same set
  of true propositions.

  (6) Therefore Peirce''s and James''s theories of truth are extensionally identical;
  they differ only in emphasis (Peirce stresses the long-run social process, James
  stresses the short-run individual payoff).

  (7) But if two theories pick out exactly the same truths, the dispute between them
  is merely verbal, and the strong personal attacks Peirce and James traded (Peirce
