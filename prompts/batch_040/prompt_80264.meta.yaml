  as discovered by a process that is interest-independent in the limit.


  James''s "works" is different: it''s present-tense, individual, and tied to the
  believer''s practical satisfactions. For James, a belief is true if it "works" for
  the believer here and now — if it gives them coherent, satisfying, successful experience.
  James explicitly allows that different people might find different beliefs useful,
  and that''s fine (he''s not a relativist, but he''s much more tolerant of pluralism
  than Peirce).


