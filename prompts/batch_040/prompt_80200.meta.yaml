  - **Covering law vs. narrative**: an argument that proves too much: "If historical
  explanation must subsume events under general laws (Hempel), then no historical
  event that is unique (the assassination of Julius Caesar, the fall of the Berlin
  Wall) can be historically explained, since unique events don''t fall under non-trivial
  general laws. But we do explain them. So Hempelian explanation is inadequate for
  history." This is basically the standard Dray/Humean objection — very well-trodden.
  Not in the weeds.


  - **Conceivability as a guide to possibility**: an argument that proves too much:
  "If conceivability entails possibility (Kripke''s primary intension move), then
  I can conceive of a world where I exist without my brain (or where water isn''t
  H2O), so it''s possible that I exist without a brain / that water isn''t H2O. But
  Kripke''s own arguments (the Twin Earth, the zombie… no wait, the zombie argument
  uses conceivability) show that water is necessarily H2O. So conceivability-entails-possibility
  proves too much." Flaw: the distinction between primary and secondary intension
  — conceivability of a *primary intension* (a scenario where the referent of "water"
  is not H2O — a world where the stuff I called water is XYZ) vs. a secondary intension
  (a world where the actual water is not H2O — not conceivable once the referent is
  fixed). The argument equivocates between the two. This is a good, in-the-weeds modal
  argument, and the Kripkean machinery is exactly the kind of thing where small models
  fumble. But it''s also a fairly standard philosophy-of-mind/philosophy-of-language
  topic.


