  poor (FFL) — the FFL can fall without a famine, and a famine can occur without a
  fall in FFL (the Bengal 1943 case: food supply did not fall much, but inflation
  and rationing collapsed the entitlements of the poor). The argument equivocates
  between "famines are not caused by food shortages" and "food shortages never contribute
