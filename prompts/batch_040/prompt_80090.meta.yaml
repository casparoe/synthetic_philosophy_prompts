  **Frege on CT thesis epistemic status**: I know Frege well (anti-psychologism, logicism,
  Begriffsschrift, Grundgesetze, the "Gedanke" as objective, the "horse outside the
  door," his views on the mind''s role in arithmetic — "the mind can at most assist
  in the discovery of truths, not in their creation"; his concept of "course of values"
  (Wertverlauf) as the referent of a predicate; his rejection of the idea that a "thought"
  is a mental process). The epistemic status of CT thesis: the debate — (a) the thesis
  is a theorem (if you formalize "effective procedure" mathematically, e.g., via the
  definition of "computable function" as "Turing-computable," then it''s trivially
  true by definition — but then the thesis is vacuous, "the thesis is a definition");
  (b) the thesis is a substantive claim about the world (a "physical" or "methodological"
  thesis: no physical system, including the human mind, can compute the uncomputable
  — this is an empirical claim about nature, and could in principle be refuted by
  a hypercomputer, a quantum device that solves the halting problem, or a mind that
  can "see" the truth value of an arbitrary sentence of arithmetic); (c) the thesis
  is a methodological convention (a stipulation that fixes the meaning of "algorithm"
  — Copeland''s view: the CT thesis is a "methodological" thesis, a bet on what counts
  as a computation, not a deep truth). The interesting philosophical question: the
  "intuitive" concept of "effective procedure"/"algorithm" is pre-mathematical, and
  the CT thesis is the claim that this intuitive concept coincides with the formal
  one — so the thesis is a bridge between a pre-theoretic concept and a formal theory,
  and its status is that of a "conceptual analysis" that is neither purely a priori
  nor purely empirical. That''s the in-the-weeds core.


  Now, Frege: his anti-psychologism — mathematical/logical truths are objective, not
  about mental processes. The CT thesis (in its strong form) makes a claim about what
  minds can do. How would Frege treat it? He would probably insist that the concept
  of "computable" is objective (like his "thoughts"), not a description of psychological
  processes; he would reject the psychologization of "effective procedure" (i.e.,
  the idea that "algorithm" means "what a human can actually do in practice" — that
  would be psychologism). He might treat the CT thesis as a logical/analytic truth
  about the concept of computation (if "computation" is defined by the formal systems)
  — but that risks triviality; or he might treat it as a substantive claim that needs
  justification (like his logicist project: arithmetic reduces to logic, and that''s
  a substantive claim). Also his logicism: if mathematics is logic, then the arithmetical
  truths are logical truths — and the uncomputable sets (e.g., the halting problem)
  are not "computable" but the arithmetical truths are still true — Frege would not
  see this as a problem for logicism (logicism doesn''t require all truths to be decidable;
  it requires them to be logical). Actually, interesting: logicism and the undecidability
  results are compatible — Frege''s program would survive Gödel/Turing because logicism
  is about the foundations of arithmetic, not about decidability. A nice in-the-weeds
  point.


