  I''m a novelist currently working on a historical novel set in the final decades
  of the Western Roman Empire, and I''ve been having a recurring argument with a friend
  who is a historian about what historical explanation actually is. He keeps saying
  that the old "covering-law" model of explanation — the idea that to explain an event
  is to subsume it under a general law, the way a physicist explains a falling body
  by invoking the law of gravitation — is a category mistake when applied to history,
  because historical events are singular and unrepeatable, and the best historians
  simply tell a well-constructed story. I''ve started to think he''s right, and I
  keep reaching for an analogy from my own craft: a good novel explains its characters''
  actions without any laws at all. When my protagonist makes a fateful decision, I
  don''t invoke a universal law of human behavior; I give her a character, a motive,
  a chain of circumstances, and the reader comes away understanding why she did what
  she did. A historian explaining, say, why the empire''s western provinces collapsed
  works the same way: she assembles a narrative of causes, and the "explanation" just
  is the story. So my working conclusion is that narrative is a complete and self-sufficient
  form of historical explanation, and the covering-law model is a misguided attempt
  to drag the standards of the natural sciences into a domain where they don''t belong.


