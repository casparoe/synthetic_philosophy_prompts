  - Skolem''s paradox: ZFC (if consistent) has a countable model. Within that model,
  there is a set that the model satisfies is uncountable (e.g., its own set of reals,
  or the powerset of its own naturals). But externally, since the model is countable,
  all its elements — including that "uncountable" set — are countable from the outside.
  So the model has a set it regards as uncountable that is countable from outside.

  - Resolution: "uncountable" means "there is no bijection with the naturals." The
  model believes there is no such bijection because the bijection (which exists externally,
  since the model is countable) is not an element of the model. The model only has
  the bijections it itself contains. So "there is no bijection" is true within the
  model''s own domain of functions.

  - Skolem''s theorem (general): any first-order theory with an infinite model has
  a countable model. More precisely: if a first-order theory has a model, it has a
  countable model. So any first-order axiomatization of set theory has a countable
  model.

  - Philosophical significance: the axioms of ZFC do not categorically characterize
  a unique model (in first-order logic, by the Löwenheim-Skolem theorem, they have
  models of every infinite cardinality — both downward and upward). So the idea that
  ZFC "describes" a unique mathematical universe is problematic if "describes" means
  "categorically characterizes." This is the "Skolem problem" in the philosophy of
  mathematics, and it''s used as an argument against mathematical realism (the "Skolem
  argument"): if the axioms have many non-isomorphic models, then which one is the
  "real" one? Quine''s "The Ways of Paradox" and his discussion of the Skolem paradox;
  also used by structuralists.

  - Reply (anti-Skolem / Platonist): the axioms were intended to be true of a specific
  structure, V (the cumulative hierarchy / the universe of sets). The existence of
  other models is no more a problem than the existence of other models of the axioms
  of arithmetic (e.g., nonstandard models of PA). Realism about the intended model
  is not defeated by the existence of unintended models. Also: second-order logic
  with full semantics categorically characterizes the natural numbers (Dedekind''s
  categoricity theorem), so a Platonist could say that first-order ZFC is just a convenient
  axiomatization, and the real semantics is the intended one.

  - Counter-reply: full second-order semantics requires a notion of "all subsets,"
  which is a set-theoretic notion — so the Platonist who uses second-order logic to
  pin down the intended model is presupposing the very notion (subsets / the powerset)
  whose status is in question. This is the standard objection that second-order logic
  doesn''t escape the problem; it just presupposes the set-theoretic framework. This
  is the "in the weeds" point I want to inject.

