  Bayesian analysis of the raven paradox: The hypothesis H = "all ravens are black."
  The evidence E = "this object is a black raven." P(H|E) vs P(H). The confirmation
  is P(H|E) > P(H). Now, the paradox is that E = "this object is black" also (on the
  logic of confirmation, via the material conditional) confirms H, and E'' = "this
  object is a raven" also confirms H. So the paradox is that seemingly irrelevant
  evidence (a black shoe) appears to confirm H.


  Bayesian resolution: The degree to which "this is a black non-raven" confirms H
  is much smaller than the degree to which "this is a black raven" confirms H. In
  fact, if ravens are rare, observing a black non-raven confirms H very little (or
  even slightly disconfirms, depending on the prior). So the "paradox" dissolves in
  the sense that the irrelevant evidence confirms H only negligibly. But there''s
  a residual problem: the choice of prior matters. If you condition on the total number
  of ravens being small, the black non-raven evidence can confirm H more strongly.
  This is the "no free lunch" or the problem of the base rate.


  Actually, the deeper residual problem is this: Bayesian confirmation is relative
  to a prior, and different (all reasonable) priors can give different answers to
  how much a black non-raven confirms H. So the paradox is not fully dissolved — it''s
  relocated into the choice of prior. This is a genuine point of debate.


