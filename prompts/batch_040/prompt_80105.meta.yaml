  Quine: the principle of charity (or "principle of accommodation") is one of the
  empirical constraints on radical translation. We maximize agreement with the native
  on matters we''re confident about (e.g., the native isn''t a fool or madman, so
  we assume they mostly agree with us on observable matters). This helps narrow down
  the translation. But it doesn''t fully determine it — there''s still underdetermination/indeterminacy.


  Dummett: the principle of charity is not a constraint among others. It is a *precondition*
  for the very possibility of attributing beliefs and meanings to the native. If we
  couldn''t assume that the native mostly agrees with us, we couldn''t even start
  the process of translation (we couldn''t tell which of the native''s utterances
  are true vs. false, which are assertions vs. denials, etc.). So the principle of
  charity is not something that "helps determine" the translation; it is what makes
  the notion of "translation" (and "meaning" and "belief") applicable in the first
  place. This means that the principle of charity cannot be one of the things that
  is "underdetermined" — it is fixed in advance.


