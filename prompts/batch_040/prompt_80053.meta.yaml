  Commitments:

  (1) I one-box in the standard Newcomb problem even when the predictor is only 99.9%
  reliable, as long as I can''t inspect the boxes.

  (2) I think the reason is not that my choice causes the boxes to be arranged; it''s
  that my decision procedure is the kind of thing the predictor is good at predicting,
  so I should decide by considering what my decision procedure would do, not by treating
  the choice as a free causal lever.

  (3) In the smoking-gun case, where a blood test is a perfect predictor of a lung-cancer
  gene and smoking is only evidence of the gene but doesn''t cause the cancer, I think
  a person who likes smoking should smoke, because the test result is already fixed
  and choosing to smoke doesn''t change the gene.

  (4) In the counterfactual mugging, where a demon has already flipped a fair coin
  and says that if it''s heads he will take $1,000 from me tomorrow unless I give
  him $100 now, I think I should not pay, because the coin has already landed and
  my payment can''t change the coin.

  (5) I think a rational decision theory should be time-invariant in a weak sense:
  if I would choose A when I first think about a problem, I shouldn''t later switch
  to B just because I''ve had more time to think about it, unless I''ve learned a
  new fact.

  (6) I think in transparent Newcomb, where I can see that the opaque box is empty
  before choosing, I should take both boxes.


