  Let me design it more cleanly:


  The activity: "The Withdrawal."


  Setup: a seminar of about 18 students, 75 minutes. The facilitator runs a short
  role-play: two volunteers, A (the victim) and B (the offender), plus the rest of
  the class as witnesses. B does something wrong to A in a bounded, low-stakes but
  real way — e.g., B reads aloud a "confidential" note that A wrote to the facilitator
  in advance (containing something mildly embarrassing or a small preference A doesn''t
  want public), or B "borrows" A''s seat/point in a running class tally. The point
  is that A is genuinely, mildly wronged, so the resentment is real but bounded.


  Phase 1 (5 min): A reacts naturally. The facilitator asks A to name what they feel
  (anger, resentment, a desire for an apology). The class observes.


  Phase 2 (10 min): the "diagnosis." The facilitator reveals: B did this "under a
  program" — B had signed up in advance (in a pre-class slip, or just narrated) to
  "hand control" to a script for this task, knowing the script would make them do
  this. B is now "sober" but has chosen to "withdraw" from the personal register:
  B will only respond in third person, as a "system" reporting on itself ("the action
  was executed per the pre-registered protocol; the cause was external to the current
  B; no personal acknowledgment is available"). B is not a robot and not mad — B is
  a normal adult who has strategically withdrawn into the objective register (perhaps
  out of shame, perhaps to avoid the cost of a personal apology, perhaps to test whether
  A can "get over it").


  Phase 3 (20 min): the deliberation. The class (or a panel of 4–5) must decide, by
  a structured vote or written verdict, what A is "owed" and what A may do: (a) insist
  on a personal apology (the participant''s stance), (b) accept the system report
  and "file a maintenance request" (the objective attitude), or (c) propose a third
  option. The rules: A may not simply "choose to be angry" or "choose to be calm"
  — A must argue for their stance, and B, in role, will not give a personal apology
  (B can only give system reports). The class can "pressure" B (ask questions, demand),
  but B''s responses are constrained to the objective register. The point is that
  the class will discover: (i) it''s hard to sustain resentment toward someone who
  responds like a polite appliance (the "object" is not a person you can be angry
  at), (ii) accepting the objective attitude feels like a loss (A has lost the person,
  and the "maintenance request" is a weird, impersonal thing), and (iii) the withdrawal
  is asymmetric — A cannot unilaterally resume the personal relationship; B has to
  re-enter, and B (in role) is not going to.


  Phase 4 (15 min): the "re-entry" attempt. The facilitator allows B to "re-enter"
  the personal register — but only if the class can articulate, in a short written
  statement, what B''s re-entry would "cost" B (the personal apology, the acknowledgment
  of guilt, the restoration of trust) and what it would "give" A. B reads the class''s
  statement and then, in role, decides whether to re-enter and give the personal apology,
  or to remain withdrawn. (The facilitator can steer B, in role, toward a mixed outcome
  — e.g., B re-enters partially, gives a grudging apology, but the relationship is
  visibly changed.) The point: the participant''s stance is not a switch you flip;
  it''s a relationship you rebuild, and the objective attitude, once adopted, leaves
  a scar.


  Phase 5 (15 min): the debrief. The facilitator maps moments to Strawson: (i) the
  resentment A felt in Phase 1 is the "reactive attitude," and Strawson''s point is
  that it is not a bug but a feature of treating B as a person — it is constitutive
  of the "participant''s stance"; (ii) the "system report" in Phase 2 is the "objective
  attitude," which Strawson says is legitimate in cases of madness, compulsion, or
  non-human agents — but the twist (B is a normal adult who strategically withdrew)
  is the in-the-weeds case, where the objective attitude is not a neutral detour but
  a loss; (iii) the asymmetry in Phase 4 — that A cannot unilaterally resume the personal
  stance — captures the point that the reactive attitudes are "interpersonal" / part
  of a practice, not unilateral feelings; (iv) the "scar" — that the relationship
  is changed even after re-entry — captures the point that the objective attitude
  is not cost-free.


  What will predictably go wrong: (i) A may find it "easy" to drop the resentment
  once B becomes an appliance, and the class may read this as "see, resentment was
  irrational all along" — the facilitator should counter by pointing out that A lost
  something (the person), and that the ease is the cost, not the refutation; (ii)
  the class may mock B''s "system report" and the role-play may become a joke, deflating
  the stakes — the facilitator should keep the stakes real by making the wrongdo something
  A actually cares about (a real small loss) and by treating B''s role with seriousness;
  (iii) some students may be uncomfortable with the "withdrawal" framing (it can feel
  like B is being allowed to "get away with it") — the facilitator should be ready
  to name that this is exactly the tension: the objective attitude can be used strategically
  to avoid the cost of blame, and Strawson''s framework has to answer whether that''s
  legitimate; (iv) the group may rush to a "fair" compromise (a partial apology) and
  miss the point that the issue is not the size of the apology but the register (personal
  vs. objective).


