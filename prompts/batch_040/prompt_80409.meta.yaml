  Let''s think of a precise conceptual issue. The slogan "you can''t control the past"
  in Newomb. The different claims:

  1. Causal: your current action cannot be a cause of earlier prediction. True in
  standard physics, but irrelevant if prediction is evidence of your type or if counterfactual
  relation is not causal.

  2. Temporal: you cannot change what already happened. Trivial, but in simulation
  variant the prediction may not be a brute fact but a function of your algorithm;
  "past" is derivative.

  3. Counterfactual: if you two-box, the predictor would have predicted two-box. This
  is contentious; depends on counterfactual semantics for deterministic agents/simulations.

  4. Decision-procedure: you cannot, at the moment of choice, alter the algorithm
  that was simulated. True if locked in, but you could have chosen a different algorithm
  earlier; single-choice framing ignores algorithmic choice.

  5. Epistemic: your action is evidence of what the predictor did, so you can''t use
  it to update to a favorable state? Actually you can update: if you choose two-box,
  maybe that reveals you are a two-boxer, so predictor predicted two-box, so box empty.
  This supports one-box? Need analyze.

  6. Logical/CDT: your choice is logically connected to prediction; "control" as logical
  influence. Not false in TDT/UCB sense.

