  Actually, let me reconsider. The discursive dilemma: a group of judges must decide
  on two premises (e.g., "the defendant acted knowingly" and "the defendant acted
  without justification") and a conclusion ("the defendant is guilty of a crime"),
  where the conclusion logically follows from the premises. Issue-by-issue majority
  can yield a majority for each premise but a minority for the conclusion, so the
  group''s judgment set is logically inconsistent. This is the "discursive dilemma"
  (Pettit and List). The comparison with Arrow: Arrow is about aggregating individual
  preference orderings into a collective preference ordering satisfying certain conditions
  (unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship).
  The discursive dilemma is about aggregating individual judgment sets (which are
  logically connected) into a group judgment set that is logically consistent.


  Key differences to draw out:

  - Arrow: the objects being aggregated are preferences (orderings), which are not
  logically connected in the sense that one preference doesn''t entail another. The
  discursive dilemma: the objects are judgments (beliefs/verdicts) that ARE logically
  connected (the conclusion follows from the premises). This is the crucial difference
  — the discursive dilemma is a "logical" impossibility (inconsistency), while Arrow
  is a "value" impossibility (no non-dictatorial rule satisfying the axioms).

  - Arrow''s theorem is a theorem: no rule satisfies all the axioms. The discursive
  dilemma is a "dilemma" or paradox: a natural rule (issue-by-issue majority) yields
  an inconsistent result. It''s not a theorem that no rule works — there are ways
  out (conclusion-based aggregation, weighted premises, etc.).

  - The "independence" condition in Arrow (independence of irrelevant alternatives)
  vs. the "independence" in judgment aggregation (independence: the group''s judgment
  on a proposition depends only on individual judgments on that proposition). Issue-by-issue
  majority satisfies independence but yields inconsistency. So there''s a tension
  between independence and consistency in judgment aggregation, analogous to the tension
  in Arrow.


