  Let me reconsider the premise/conclusion-based fix. The standard fixes for the discursive
  dilemma:

  1. Conclusion-based: vote on the conclusion directly (the majority on the conclusion
  wins). This avoids inconsistency but violates the idea that the conclusion should
  follow from the premises (it''s "conclusion-sensitive").

  2. Premise-based: vote on the premises, then derive the conclusion from the majority
  on the premises. This guarantees consistency but the conclusion might not match
  the majority on the conclusion (it''s "premise-sensitive").

  3. Other: weighted premises, etc.


  So the tradeoff is: premise-based guarantees logical consistency but the group''s
  conclusion might not be what the majority of individuals conclude; conclusion-based
