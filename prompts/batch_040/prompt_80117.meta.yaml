  The core question: what would a theory of moral dilemmas have to get right? The
  key conceptual issues:

  - The distinction between a "genuine" dilemma (where there is no morally right action,
  or where doing the right thing still involves doing a wrong) vs. a mere "hard choice"
  or "tragic choice" or "conflict of duties."

  - The standard formulation: a genuine moral dilemma exists when (a) the agent must
  choose between A and B, (b) both A and B are morally wrong (or at least there''s
  no option that is morally permissible/right), (c) the agent does wrong whichever
  they choose, and (d) the agent is not blameworthy / or is still blameworthy — this
  is the contested part.

  - Actually, the classic definition (e.g., from Baruch Brody, or from the "strong"
  vs. "weak" dilemma debate): A strong moral dilemma is one where the agent must do
  what is morally wrong, and there is no morally right action available. A weak dilemma
  is one where there are two morally wrong options but one is less wrong, so there
  is a "right" action (the lesser evil).

  - The desiderata: a theory must (1) preserve the intuition that there are cases
  where we feel we "had no good option" / "did wrong but shouldn''t be blamed"; (2)
  not collapse the distinction between a dilemma and a simple conflict of competing
  values; (3) handle the question of whether the agent is blameworthy (this is the
  key contested point — the "no good options" intuition vs. the intuition that the
  agent is still responsible); (4) be compatible with or clearly diverge from consequentialism
  (which tends to deny genuine dilemmas because there''s always a least-bad option)
  and deontology (which tends to allow them via conflicting absolute duties); (5)
  distinguish the phenomenology (the feeling of being "torn") from the metaphysics
  (the actual structure of the moral landscape).

  - The case behind each: the tragic choice (e.g., the lifeboat, the triage doctor,
  the spy who must betray a friend), the "two wrongs" case, the "lesser evil" case.


  This is a rich, "in the weeds" topic. The desiderata would be:

  1. Must get right the "no good options" intuition — there are cases where the agent
  genuinely faces no morally permissible action. (Case: the classic tragic choice.)

  2. Must distinguish a genuine dilemma from a "lesser evil" / "tragic choice" / "hard
  choice" — the distinction between strong and weak dilemmas.

  3. Must handle the blame question — whether the agent who does the "least wrong"
  thing is blameworthy. This is the key contested point.

  4. Must be able to say what makes a dilemma "moral" rather than merely "practical"
  — the agent''s options must be genuinely wrong, not merely suboptimal.

  5. Must not collapse into a trivialization — if every hard choice is a dilemma,
  the concept loses its force.

  6. Must respect the distinction between the agent''s perspective (epistemic — they
  can''t see the right action) and the metaphysical perspective (there is no right
  action).

  7. Must be able to say whether the dilemma is "real" (ontic) or merely a feature
  of our moral psychology.


