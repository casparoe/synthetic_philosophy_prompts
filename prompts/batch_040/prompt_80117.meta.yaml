  Desiderata for a theory of guilt and shame (and which is the "better" moral emotion):

  1. Must get right the core distinction: guilt is about an act (I did something wrong),
  shame is about the self (I am wrong / I am defective). This is the Tangney distinction
  (act-focused vs. self-focused).

  2. Must account for the functional differences: guilt tends to produce reparative
  behavior (apology, making amends), shame tends to produce avoidance, withdrawal,
  or aggression.

  3. Must handle the cultural variation: shame cultures vs. guilt cultures (the classic
  anthropology distinction, e.g., Ruth Benedict''s "The Chrysanthemum and the Sword").

  4. Must say which is "better" for moral development — guilt is often seen as healthier
  because it''s directed at the act and thus leaves the self intact; shame is seen
  as more destructive because it attacks the self.

  5. Must handle the "can a culture choose" question — is it possible for a culture
  to cultivate guilt rather than shame, or are these features of a culture''s basic
  structure?

  6. Must not collapse the distinction — guilt and shame are often conflated, and
  a good theory must keep them distinct.

  7. Must account for the phenomenology — what each feels like.


