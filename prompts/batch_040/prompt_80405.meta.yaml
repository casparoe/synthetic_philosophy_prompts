  Activity: two teams build "models" (prediction rules) of a simple but messy real-world
  system — e.g., how many cups of coffee a particular person drinks per day, or how
  a ball will bounce, or how a crowd will flow through a corridor. Team A must build
  a "realistic" model: incorporate as many true details about the system as possible
