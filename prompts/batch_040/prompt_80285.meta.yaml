  A Very Short Introduction" 2008, and the paper "Free Will: A Very Short Introduction";
  the Basic Argument is presented in the chapter "The Basic Argument"). The argument:
  (1) To be morally responsible for an action, you must have been able to have done
  otherwise (or more precisely, you must have been a certain kind of agent — an "ultimate
  author" or "originator" of your actions, responsible in a "deeply responsible" sense).
