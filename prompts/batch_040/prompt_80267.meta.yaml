  Good misrepresentations for the scale argument:

  1. **Conflation of probability and degree**: The argument is about the probability
  that insects are sentient (or the expected number of sentient insects), but the
  popular summary might conflate this with the claim that insects suffer as much as
  vertebrates. The scale argument says the aggregate moral weight could be large because
  of numbers, NOT that each insect''s suffering is as intense as a vertebrate''s.
  A summary that says "insects matter as much as vertebrates" conflates the aggregate
  argument with a claim about individual moral status.


  2. **Overstatement of a modest thesis**: The scale argument is a precautionary argument
  — it says we should not dismiss insect sentience and should reduce harm where it''s
  cheap to do so. It does NOT say we must treat every insect as definitely sentient,
  or that we must radically restructure agriculture. A summary that says "the argument
  proves we must stop killing insects" overstates it.


  3. **Standard objection presented as a refutation**: A common objection to the scale
  argument is that the probability is so low that the expected value is negligible,
  or that we have no way of knowing how to reduce insect suffering (we don''t know
  what insects experience, so we can''t target our actions). If the summary presents
  one of these as "a refutation" when it''s actually a live objection that the argument''s
  defenders respond to, that''s a misrepresentation.


  4. **Technical term in everyday sense**: "Sentience" is a technical term (the capacity
  to have subjective experience, especially of pleasure and pain). A summary might
  use it loosely to mean "awareness" or "intelligence," conflating sentience with
  cognition.


