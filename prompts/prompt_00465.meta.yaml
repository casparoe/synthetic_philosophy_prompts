reasoning_summary: 'I''m weighing "underdetermination of theory by evidence" paired
  with a false presupposition angle—the common mistake of thinking it implies all
  theories are equally supported, or conflating it with radical skepticism or the
  Duhem-Quine thesis about confirmation holism.


  A strong question would assert that underdetermination proves scientific realism
  is false since rival theories are equally supported by evidence—but this smuggles
  in the false assumption that weak, transient underdetermination (common and unthreatening)
  is the same as strong, permanent underdetermination (rare and contentious), while
  also glossing over whether truly empirically equivalent rivals actually exist once
  auxiliary considerations are factored in.


  Turning to the simulation argument as another domain, the common misreading is treating
  Bostrom''s trilemma as proof we''re in a simulation rather than a disjunction among
  three possibilities: near-universal extinction before posthumanity, posthuman civilizations
  avoiding ancestor simulations, or we''re actually simulated. A subtly flawed question
  might ask whether we should worry about simulators shutting things down, since this
  presupposes the argument concludes we''re in a simulation rather than merely presenting
  an unresolved trilemma.


  I could frame this as a philosophy professor prepping a seminar, confidently characterizing
  Bostrom''s argument as "basically proving" we''re almost certainly simulated and
  wanting to compare it to Descartes'' evil demon -- a sincere but subtly mistaken
  framing of the argument''s actual conclusion.'
