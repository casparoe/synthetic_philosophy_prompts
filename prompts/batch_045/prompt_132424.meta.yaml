  \ change them... Actually in Pereboom's case 1, the agent could reflect but the\
  \ neuroscientists ensured she'd retain them.\n\nOK, let me also add a third candidate\
  \ rule: \"irrelevancy of history + no bypassing\" (Rule A) vs. \"historical, reflection-based\"\
  \ (Rule B) vs. maybe Rule C: \"the agent must have been able to do otherwise in\
  \ a counterfactual sense\"? No—Frankfurt case rules that out.\n\nAlternatively,\
  \ a third rule: \"semicompatibilism à la Fischer: reasons-responsiveness, plus a\
  \ ban on 'actual-sequence' bypassing, plus... \" That's basically Rule A.\n\nA third\
  \ rule could be: \"responsibility requires that the agent's action not be explainable\
  \ by factors whose presence the agent couldn't have been aware of\" — an epistemic-ish\
  \ rule. Or \"ownership/identification with a true self\" (Watson's Platonistic/Frankfurt\
  \ hierarchical): Rule C = identification/deep-self view: responsible iff the agent\
  \ identifies wholeheartedly with the desire (Frankfurt's wholeheartedness, no ambivalence).\
  \ Under Rule C: the drug case — she reflectively likes it, no ambivalence → responsible.\
  \ Hmm, same as A.\n\nMaybe a better third rule: \"tracing/liability rule\": an agent\
  \ is responsible for acting on a desire if she is responsible for *having* it, via\
  \ tracing to an earlier free act (the \"tracing\" move used for culpable ignorance\
  \ / self-induced intoxication). Under Rule C: the drug case — she freely chose to\
  \ take the drug? If she took it voluntarily for another condition and foresaw possible\
