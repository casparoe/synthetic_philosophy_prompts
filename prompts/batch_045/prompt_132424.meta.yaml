  \ make this the new case.\n\nActually the new case: \"brain tumor / drug-induced\
  \ desire\" variant — divergence between \"only the actual sequence matters + no\
  \ bypassing + reasons-responsiveness\" (responsible) vs. \"history matters: responsibility-undermining\
  \ if the pro-attitudes were produced by a process the agent didn't control / didn't\
  \ acquire through her own reasoned reflection\" (not responsible).\n\nBut careful:\
  \ Rule B must fit verdict 3 (abusive upbringing → responsible). Rule B could be:\
  \ \"manipulation by another agent undermines; mere causal shaping doesn't\" → then\
  \ Rule B would say the drug case is responsible, no divergence from Rule A. So I\
  \ need Rule B formulated as: \"a responsibility-undermining history is one where\
  \ the agent's pro-attitudes were produced by a bypassing or non-rational process\
  \ (neural manipulation, tumor, drug, hormone) rather than by the agent's own reasoned\
  \ engagement\" — but then the abusive upbringing case: upbringing is partly non-rational\
  \ shaping too... Hmm. Maybe verdict 3 needs to be stronger: agent reflectively revised\
  \ her attitudes (she actively re-examined and re-endorsed them on the basis of reasons).\
  \ Then Rule B (\"the pro-attitudes must have survived or undergone the agent's own\
  \ critical reflection\") fits: abusive-upbringing agent reflected and re-endorsed\
  \ → responsible; neural manipulation case: agent's attitudes were implanted wholesale\
