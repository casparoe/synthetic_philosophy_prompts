  Accounts (I get to name them generically so a small LLM can handle them):

  1. "Predictive/intentional-stance account" (Dennett-style): X is an agent iff the
  best (most efficient, most predictive) strategy for explaining/predicting X''s behavior
  requires attributing to X beliefs, desires, and instrumental rationality — i.e.,
  X is an intentional system.

  2. "Normative-answerability account": X is an agent iff X can be the proper target
  of normative demands — genuine "oughts" addressed to it, blame/praise, demands for
  justification — i.e., X can act for reasons and be answerable for them, not merely
  be used well or badly.


  Spec: a single system, one paragraph, realistic near-future, no sci-fi, such that:

  - Account 1 returns "agent" robustly: you literally cannot predict its behavior
  well at all without attributing beliefs/desires/goals; design-stance and physical-stance
  predictions fail.

  - Account 2 returns "tool": it''s not the sort of thing that can be asked to justify
  itself or be blamed; the normative buck stops with its deployer/principal.

  - And critically: the "tool" verdict must NOT be because the system lacks sophistication,
  lacks reasons-responsiveness in the behavioral sense, or is merely simple/deterministic.
  It must fail the normative test for a specific reason — e.g., because its reasons-tracking
  is itself designed and could have been otherwise at the designer''s whim, or because
  there''s no "it" that owns the reasons (no diachronic unity, no stake), or because
  it can''t take its own reasons as reasons.


