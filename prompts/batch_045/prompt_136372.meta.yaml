  Define: A commitment race is a strategic situation in which the thing that determines
  who wins is not who has more capability but who can make their own future behavior
  less controllable first — each side competes to be the first to burn a bridge, because
  the side that has visibly destroyed its options gets to dictate terms to the side
  that still has them. Classic instances: races to pre-delegate launch authority;
  races to pass legislation that ties the government''s hands; races by firms to lock
  in regulatory capture or to sign binding contracts; races to irreversibly deploy
  a technology first. Distinguish from: arms race (accumulating capability), coordination
  race (being first to a standard), Chicken (where the commitment is the whole game,
  one-shot).


  Key structural features to translate:

  1. First-mover advantage in irreversibility; the "race" is over who gets to be the
  last mover in the substantive game by being the first mover in the meta-game of
  option destruction.

  2. Commitments must be visible/credible to change the other''s expectations: so
  the race has a communication dimension (performing the destruction).

  3. Both sides pay: the outcome is worse for both than if neither had committed,
  and worse than mutual restraint — but each individually prefers to commit first
  than to be committed-against. Payoff ordering: (commit first, other yields) > (both
  restrain) > (both commit) > (yield to other''s commitment)? Something like that;
  the exact structure determines whether it''s a Prisoner''s Dilemma in the meta-game
  or a Chicken. Actually the interesting question: is the commitment race a PD (dominant
  strategy to enter the race) or a game of Chicken (each wants the other to back down)?
  Arguably it has a PD structure at the level of "invest in capacity for irreversible
  commitment" while having Chicken structure at the level of "actually pull the trigger".
  That''s a genuinely interesting in-the-weeds point.

  4. Time compression: the value of committing is time-sensitive; as the technology
  for commitment gets cheaper/faster, the race gets shorter and the window for the
  "have your commitment believed" shrinks — the "credibility window."

  5. Endogenous risk: attempts to commit faster increase the chance of accidental
  commitment (false positives).


