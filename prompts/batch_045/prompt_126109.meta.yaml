  Draft:


  "Okay so I''m in a political philosophy seminar this term (distributive justice,
  mostly analytic stuff) and our TA keeps leaning on this one move that I can''t tell
  is deep or is just doing all the work by being vivid. The move is the gambling-vs-lightning
  thing: from the Dworkin reading — the version we got says, roughly, that a misfortune
  is either like losing a bet you chose to place, or like getting hit by lightning;
  if it''s the first, it''s your option luck and you''ve got no complaint against
  anyone, if it''s the second it''s brute luck and it''s the kind of thing a just
  distribution should undo. He used it to close down a whole discussion on tuesday:
  someone raised the case of a guy who dropped out of school at 16 to take a job in
  a warehouse and now has a wrecked back and no prospects, and the TA said, well,
  he took the job, that''s a gamble that didn''t pay off, that''s on him. And I sort
  of wanted to say yes but the room went quiet and I couldn''t articulate why it felt
  off.


  The bit I keep chewing on, and which I made up myself so nobody has to be polite
  about it, is that real life seems to be full of what I''ve started calling mandatory
  gambles — ones where sitting out isn''t on the menu. You have to put your savings
  somewhere, you have to pick some career or another, you have to decide whether to
  trust this person or that one, and if declining the bet isn''t available then ''you
  gambled and lost'' starts to cover basically every bad outcome there is, which can''t
  be what the distinction was for. And there''s a second wrinkle: the same nominal
  bet isn''t the same bet for two people, because what matters is where it sits relative
  to your cushion — if losing 5k means you eat differently for a month vs. means you
  lose your house and then can''t get the next loan, then it''s a different gamble,
  and there''s that old gambler''s-ruin idea where the person with the small stack
  is basically doomed by the sequence even if every individual bet is fair. So the
  ''he chose to take the job'' story hides that his stack was small and the sequence
  was forced. And third, whether you even see something as a gamble depends on your
  information and on how good you are at that kind of weighing, which look like they''re
  themselves luck.


  So: audit the analogy. Give me the correspondence table — who''s the gambler, what''s
  the stake, what are the odds, who or what is the house, what plays ''declining to
  bet'', what''s the payout, where does insurance fit — then tell me which of the
  disanalogies actually bite for the conclusion the TA wanted (that a lost gamble
  generates no claim, and that only the lightning cases are compensable) and which
  are just colourful noise. I especially want to know whether the gambler/lightning
  picture quietly imports a norm from actual gambling that doesn''t transfer — like
  that the odds were known and fair, or that the gambler could have walked away, or
  that there''s a discrete moment where you consented to the bet, or that the only
  thing at stake is the payout rather than your future menu of bets — and whether
  once you strip those out there''s anything left of the cut, or whether ''you took
  a gamble'' just ends up restating ''this is your responsibility''. If the analogy
  can''t carry it, is there a better one that does — I don''t know, maybe inheritance-plus-casino,
  or insurance pool with mandatory membership, or something from decision theory about
  absorbing barriers — or is the honest answer that no comparison is going to do the
  work the TA wants? Don''t bother with citations or a reading list, I''ve got the
  syllabus; I just want the argument. And please lead with the actual verdict in your
  first sentence — like, ''the analogy survives but only if you add X'' or ''it can''t
  carry the conclusion'' — and then give me the reasoning, with the table somewhere
  in there, and skip the preamble and the bit where you re-explain my question back
  to me."


