  Actually hold on. There''s a subtlety about GEB''s point that''s important and worth
  the model engaging with: Hofstadter''s claim is that the frame and outer messages
  are often *physically* carried by the medium in a way that is not itself symbolic,
  and that a "message" found by aliens requires them to first recognize it as a message
  (frame), then get instructions (outer), then content (inner) — and that higher layers
  can be reconstructed from lower ones ("you can''t get the inner without the outer,
  but you can guess the outer from the inner"). Also the key insight that the frame
  message can be carried by *form* rather than convention (e.g., the grooves of a
  record, the spiral, the fact that the artifact is clearly manufactured). And "the
  more intelligent the receiver, the less outer message needed."


  Also GEB''s distinction between outer and inner: the outer message is "the information
  which tells how to interpret the inner message" — e.g., a book in a language you
  don''t read: you have the frame (it''s a book, so it''s a message) but you can''t
  get the inner without knowing the language — the outer message would be a Rosetta-stone-like
  key.


