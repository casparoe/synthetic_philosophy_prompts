  to something like PDF/A or CSV and throw the original away, or discard. We can''t
  do everything, the depositors are usually not contactable in ten years, and there''s
  a data-protection clock on some of it, so discard is sometimes the right answer
  even when we''d rather not.


  I want to steal the frame / outer / inner message distinction from Hofstadter''s
  chapter on the location of meaning (frame = "this is a message, decode me", outer
  = the instructions or key for how to decode, inner = the actual content once decoded,
  with the point that the outer can sometimes be reconstructed from the inner by a
  smart enough receiver) and turn it into a triage checklist we can actually run in
  two minutes on a folder whose contents we mostly can''t open.


  Write me the procedure: questions in order, what counts as a sufficient answer to
  each given that we often can''t read the bytes, where it stops with "image it all",
  where with "normalise and discard the original", where with "discard outright",
  and where it hands the decision back to a human because it''s a values call about
  significance rather than about recoverability. Two things my team already argues
  about that I''d like it to settle or at least name:


  - borrowed frames: cases where the thing that says "this is a message" isn''t in
  the object at all but in its container — the labelled box, the folder name, the
  file extension, the depositor''s email. Those don''t survive the object being seperated
  from its context, and I think we systematically overestimate how much is self-describing.

  - reconstruction bets: when we can''t preserve the outer message (obscure format,
  missing key) we''re really betting that a future receiver can reconstruct it from
  the inner or from conventions that outlive the carrier. I want the procedure to
  say when that bet is reasonable and when it''s wishful, instead of us always deciding
  it by vibes.


