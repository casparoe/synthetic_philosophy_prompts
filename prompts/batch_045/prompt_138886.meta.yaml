  I work in digital preservation at a university library — me and three others, and
  we triage incoming collections in a weekly meeting, 30-40 items a session, so realistically
  each item gets about two minutes and a one-line justification that goes in the record.
  Our options per item are always the same three: keep a bit-exact image of the original
