  Draft:


  "Hi — I host a small linguistics-adjacent podcast (about 300 listeners, mostly my
  department and some friends from grad school), and next week my guest is a psycholinguist
  who''s just published a book defending what she calls ''obligatory-category relativism''.
  Rough version, as I take it: Whorfian effects are real but they only show up where
  the grammar *forces* you to code something on every utterance — evidentials, aspect,
  grammatical gender, honorifics — and not where you merely lack a word (the whole
  ''Eskimo words for snow'' genre of example is exactly what she says is irrelevant).
  And the mechanism isn''t that your concepts get reshaped; it''s that mandatory coding
  builds an encoding habit, and the habit survives as a retrieval cue, so the effects
  show up in memory and in tasks where you have to hold something online, not in what
  you can perceive or reason about right now. Her flagship new claim, and the reason
  I booked her, is about evidentiality: she argues that obligatory evidential marking
  doesn''t give speakers a richer concept of evidence at all, it just attaches a mandatory
  source-tag to the memory, so speakers of an evidential language do better on delayed
  source-monitoring ("did you see this or were you told it?") but are no better at
  weighing testimony, updating on hearsay, resisting bullshit, or anything like that.


  Here''s my problem. Every time I''ve heard her on another show she gets the same
  four easy questions — the Hopi/time thing, the snow lexicon thing, the colour studies,
  the ''so you think language determines thought'' thing — and she fields them in
  her sleep, partly with the move ''that''s the strong version, nobody defends that.''
  I want eight to ten questions that make that move useless. Concretely: I need at
  least one that separates her ''retrieval-cue'' mechanism from Slobin''s thinking-for-speaking
  in a way she can''t just say ''yes, and I''m happy with that''; one that presses
  the bilingual/monolingual and schooling-literacy confounds in the evidentiality
  work (how would you ever tell an evidentiality effect from a difference in how much
  people are drilled in citing sources, in school or in court?); one about the metalanguage
  problem — if the languages differ in what they force you to encode, what language
