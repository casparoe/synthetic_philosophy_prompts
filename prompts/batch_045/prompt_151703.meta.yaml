  ---


  I joined the clinical ethics committee of my hospital three months ago, a year after
  sitting with my family through my father''s final admission to its ICU. The committee
  is about to rewrite its guidance on two things in particular: withdrawing life-sustaining
  treatment, and what to do when a family asks the team not to tell a patient their
  prognosis. I find that positions I had previously held only as opinions now have
  to be turned into something written down, and I would be grateful for a consistency
  check before the drafting meeting. I should say that my sympathies in the generalism/particularism
  dispute are with the particularist side, though I came to it informally and not
  by any careful route. Here is roughly where I stand:


  (1) I do not think there are exceptionless moral principles, or that there is a
  manageable set of defeasible ones that would capture what matters. Whether a feature
  of a case is a reason at all, and which way it points, seems to me to depend on
  what else is going on in the case; a feature that counts in favour here can be silent,
  or count against, there.


  (2) I am not a relativist. Some verdicts on a case are just wrong, and what makes
  them wrong is fixed entirely by the descriptive facts of the case — I take the supervenience
  of the moral on the descriptive for granted.


  (3) In every case I have actually seen, the fact that a course of action would leave
  a patient in severe untreated pain has been a reason against it, and I expect our
  case mix to stay like this. I have never had to treat it as otherwise, and I don''t
  expect to.


  (4) When a clinician does what our guidance says partly because the guidance says
  so, I want to say that this gives her some genuine moral support, and not merely
  institutional cover: the guidance is a consideration in favour of acting, and not
  simply a fact about what the hospital will later accept.


  (5) I think the guidance has to pass what we have started calling the corridor test:
  a reviewer who was not in the room, who does not share our judgment and who has
  only the notes, has to be able to determine afterwards whether the clinician complied.
  Guidance that cannot be audited in that way is not guidance. This I take to be non-negotiable.


  (6) I think clinical moral judgment is a trained perceptual skill, that novices
  acquire it partly by being handed rules, and that the point of the rules is that
  they should eventually be outgrown. At the same time I want to say that a clinician
  who does the right thing only by applying a rule whose cited features were not the
  reasons actually present in the case has got it right without seeing it, and that
  this is a real defect even when the outcome is the same.


  (7) I think several people on the committee are better at this than I am and that
  I should frequently defer to them; but I do not accept that anyone''s verdict is
  right because she reached it, or that anyone has authority over anyone else''s moral
  judgment.


  (8) On the case that led to me being asked to join: my father''s team told him his
  prognosis after my mother and I had asked them not to, and I remain convinced that
  telling him was right. But I also want to say that in every case what ought to be
  done is what the balance of reasons in that case favours, and that this is the whole
  story about what makes a verdict right — and in that case the reasons I can articulate
  seem to me to point the other way, and what I am relying on is that the senior nurse
  saw it and I did not.


