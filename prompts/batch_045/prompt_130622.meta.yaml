  ---


  I am one of seven members of the Arts, Culture and Leisure Committee of our town
  council, and I have been asked to draft the opinion the committee will circulate
  before it votes on a specific proposal. I would be grateful for a draft I can work
  from.


  The proposal. A former resident who has done well in business has offered to pay
  for the conversion of a disused mill building into a 280-seat theatre, and to underwrite
  its running costs for five years through a trust she will control. The town has
  no theatre; the nearest is forty minutes away by car. Her offer is conditional on
  two things: that the council commit to an annual grant of £25,000 for ten years,
  and that the building be run as a receiving house for a professional company from
  the county town, which would programme and staff it. There is no prospect of a referendum,
  and no other bid for the building.


  The objection. A written objection of some length has been submitted by a retired
  local teacher, Mr Peter Ansell, who argues explicitly from Rousseau''s case against
  allowing a theatre into Geneva in the 1750s. His argument, as I read it, has four
  parts. (1) A play amuses without improving; the claim that watching deepens sympathy
  for others mistakes a feeling had in a seat for a disposition to act, and such feelings
  are spent in the having of them, leaving the spectator quietly pleased with himself.
  (2) A permanent theatre manufactures a taste it then satisfies — for polish, staging,
  costume — and with it a trade in late-night eating and drinking; that taste is a
  new want, not the satisfaction of an existing one. (3) It turns people who do things
  into people who watch things. Our shared civic life is made of the choir, the amateur
  dramatic society, the carnival and the bonfire; an audience is a collection of people
  sitting side by side having a private experience. (4) Because a professional company
  must live by selling tickets, and because a town our size cannot fill 280 seats
  from its own households week after week, it will have to be filled with visitors,
  and the programme will be shaped by what visitors will pay for. A council grant
  that cheapens the tickets does not remove this dependence; it merely moves it from
  the box office to us. He notes that the company''s commitment ends after five years
  while ours runs for ten.


  The complication. The town''s amateur dramatic society, the Marshfield Players,
  has written in support, saying a proper stage and professional standards will improve
  them rather than finish them. And the committee is divided on the objector''s proposed
  rule of thumb, which he wants written into our cultural strategy: that public money
  should support performance only where the performers and the audience are largely
  the same people.


  What I want. A recommendation — accept, decline, or accept with conditions — with
  a short statement of reasons, the conditions and review points spelled out concretely
  enough to be voted on. Two things matter to me. First, the opinion should take Ansell''s
  case at its best rather than treating him as a killjoy: if it recommends accepting,
  it should say what he is right about and what should be done about it. Second, it
  should be honest about the largest difficulty whichever way it goes — either that
  a participation rule applied without fear or favour would also threaten other things
  we already fund (our carnival is largely watched, not joined in), or that any such
  rule amounts to telling residents that their own choices about their own leisure
  are not to be trusted.


  About 800 words, please, in British English.


