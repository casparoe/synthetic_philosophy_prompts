  Let me write out the moves carefully.


  (1) Idris: quiet swap. Two sperm from the same ejaculate, DNA differing at a single
  position where the difference has no downstream effect at all — a synonymous substitution,
  say, so that the protein produced is the same, and every cell of the resulting organism,
  from the first division onwards, is qualitatively indistinguishable from the corresponding
  cell of the actual organism. If the other sperm had won the race, he said, everything
  that would then have happened would have been just as it actually was; the person
  born would have been me. So the gamete thesis is false: what matters is what the
  gamete does, not which gamete it was.


  (2) Rowena: You''ve built the conclusion into the description. If the two zygotes
  differ in genome, they''re two different zygotes, and identity is transitive: the
  adult is the organism that developed from the one that actually existed, so the
  adult in your scenario is a different organism — numerically different, however
  qualitatively alike. "Just as it actually was" quietly assumes the very thing in
  dispute: that the same organism could have had a different earliest stage. And once
  you see that, the appropriate reaction to the case isn''t that it refutes the thesis,
  it''s that the difference between the gametes is a difference that doesn''t matter
  to how things go — but "doesn''t matter" and "isn''t there" are not the same thing.


  (3) Idris: the quiet edit. Take the actual sperm, but suppose a single base pair
  differs because of a copying error, and that the zygote''s own repair machinery
  restores the original sequence before the first cleavage. At the start there are
  two zygotes with different sequences; shortly afterwards there aren''t, in any respect
  anyone could point to. Your transitivity argument now tells you that the organism
  at t=2 is identical with the zygote at t=0 in each scenario and not identical across
  scenarios — and nothing in the world after the repair distinguishes them. That''s
  not a proof that the essentialist is wrong, but it does show that the argument from
  transitivity will generate a verdict for any stipulated difference whatsoever, however
  inert, so it can''t be what''s carrying the intuition. And it can''t be dodged by
  saying identity facts are settled at the earliest stage, because that''s contested
  terrain: when an embryo can still split into twins, or when two embryos fuse into
  one, we don''t already know that there''s a determinate fact about which later organism
  is identical with which early one.


  (4) Rowena: That''s a non sequitur, or at least it changes the subject. Whether
  early identity facts are determinate in fission and fusion cases is a question about
  what fixes identity over time; the essentialist claim is about which modal profile
  the resulting organism has. And the absence of a principled line between the differences
  that matter and the differences that don''t is exactly what you''d expect if identity
  is not a matter of degree and isn''t fixed by qualitative similarity at all. You''re
  essentially offering a continuum argument — a silent substitution, a repairable
