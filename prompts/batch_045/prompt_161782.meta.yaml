  I convene a fortnightly metaphysics reading group, and last week two of our number
  — let me call them Rowena and Idris — got into an argument that we ran out of time
  on. The topic was origin essentialism about people: the claim, of the sort Kripke
  made famous in Naming and Necessity, that no human being could have originated from
  gametes other than the particular sperm and egg they actually came from. Neither
  of them doubted that some such thesis is intuitive; the fight was entirely about
  what it commits you to once you look at hard cases. I stayed out of it and genuinely
  can''t tell who had the better of it.


