  Domain: worst-case vs average-case guarantees in AI alignment. Core distinction:
  worst-case guarantee = a bound that holds for all inputs/deployments (e.g., "the
  system never takes an irreversible action without human approval, for every input");
  average-case = performance in expectation over a distribution of deployments (e.g.,
  "expected harm is lower than the status quo"). Also related: "high reliability"
  vs "worst-case safety"; ARC''s "guaranteed-safe AI" vs "probabilistic/empirical";
  "assurance" vs "capability"; the "no worst-case guarantees without verifiable bounds"
  argument (e.g., from Bengio/Yoshua''s "guaranteed-safe AI"), and critique from "it''s
  impossible to get worst-case guarantees for powerful AI" (e.g., people argue you
  need robust guarantees, while others say we should do empirical safety like civil
  engineering / pharmaceutical regulation which is average-case).


