  Hi, I need a hand prepping for my EPQ presentation...


  The thesis: "a person''s location isn''t a property of an object (brain or body)
  but of a working loop: you are wherever you can still perceive and act. In Dennett''s
  story Dennett is smeared across Houston and Berkeley, and if the radio link dies
  completely, he''s not in either place — he''s nowhere — until the loop is running
  again."


  Argument sketch (3 steps):

  1. Start with a case where location is unproblematic: you''re where you can act
  on things and they can act on you.

  2. Your body is how you act on the world and how it acts on you; your brain is what
  keeps it all coordinated. Neither is "you" on it''s own.

  3. So when the loop is split over two cities, the honest answer is the person is
  spread across both; when the loop is broken, there''s no fact of the matter where
  the person is — the question goes unanswered rather than having an answer we can''t
  know.


