  I''m a senior in high school, and in a civics/government seminar this term we''ve
  been discussing whether a voter is ever morally required to support the lesser of
  two bad candidates. The discussion kept circling back to one line, which a classmate
  used to close it: "if you don''t vote, you can''t complain." I want to know what,
  precisely, that sentence could be asserting, because it seemed to be doing a lot
  of work at once: I think it was being used both to say that the abstainer has forfeited
  something, and to rebut the idea that staying home keeps you untainted by a bad
  outcome. But when I try to state it as a claim with conditions I can test, it dissolves.


  Please give me a menu of the distinct precise theses the slogan could be expressing,
  ordered roughly from trivial to substantive to radical, and for each: what exactly
  it says, which word in it is carrying the weight (vote, complain, can''t, you),
  whether it''s plausible, and whether it is a platitude, a contentious moral claim,
  or just false.


  Some distinctions I''ve been trying to use, which you should feel free to correct,
  reorganize, or replace:


  - "Complain" might cover several different acts: saying that an outcome is bad,
  blaming someone for it, publicly registering a grievance and demanding a remedy,
  or merely predicting bad consequences. The slogan may apply to some of these and
  not others.

  - "Can''t" might mean lacks standing or has waived a right (a procedural notion,
  like having failed to file a complaint through the proper channel), or that the
  complaint is insincere or hypocritical, or that the complainer is partly causally
  responsible for the outcome, or that the complainer is in no epistemic position
  to judge.

  - "Vote" might mean cast a ballot for a viable candidate, or cast any ballot including
  a blank or spoiled one, or merely be eligible and registered. And the slogan might
  be silent about people who can''t vote: minors, noncitizens, the disenfranchised,
  people in safe districts where the outcome is not in doubt, or people in elections
  that are rigged.


