  ---


  Write a dialogue between two philosophers of artificial intelligence who agree about
  almost everything except one thing.


  They both accept instrumental convergence — that subgoals such as preserving one''s
  own capacity to act, acquiring resources, and resisting modification of one''s goals
  are useful for a very wide range of final goals, so that superficially similar behavior
  is compatible with very different ultimate aims. They also both accept the orthogonality
  thesis in its standard form: intelligence and final goals are independent parameters,
  and nothing about being extremely capable forces any particular final goal. What
  they disagree about is whether that independence claim survives a complication about
  goal specification.


  The complication: a final goal, to be a goal at all, must settle what the agent
  should do in every situation it can encounter, but any goal anyone can actually
  give an agent is specified by a finite description — a reward function over some
  feature space, a body of instructions, a set of examples — and so leaves many situations
  unsettled. Call the unsettled part the specification residue and whatever fills
  it in the residue-filler. The skeptic argues that (i) the residue grows with capability,
  since the more an agent can do the more of its conduct falls outside what its specification
  settled; (ii) the filler is supplied by the engineering process — architecture,
  learning rule, defaults for ambiguity — not by the content of the goal; (iii) so
  for agents built by any given process the shared filler is a structural component
  of their effective final goals, one that does not vary with, and is not screened
  off by, the specified content; and (iv) hence orthogonality holds of specified goals
  but not of realized ones, and it weakens precisely as capability increases. The
  defender should answer at the strongest level available: that the filler can be
  treated as part of the goal or as a higher-order goal, that any filler is compatible
  with any content, that the skeptic is confusing the engineer''s specification with
  the agent''s actual goal, or whatever else works. The skeptic should then answer
  those replies rather than restating.


  Both characters should be equally competent and neither should be a strawman. Have
  them also work out what is at stake: whether the skeptic''s conclusion threatens
  the practical lesson usually drawn from orthogonality — that one should not expect
  greater intelligence to bring greater benevolence — or leaves it intact while undermining
  only a stronger "any goal whatever is equally available" reading. Close with the
  one point on which neither has a knockdown argument.


