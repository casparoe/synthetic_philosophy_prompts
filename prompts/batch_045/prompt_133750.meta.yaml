  (xii) "Biosphere-level" candidates: a lineage that only evolves as a whole (the
  whole-Earth system, Gaia-style) — if the biosphere is alive, is the definition trivial
  (everything alive)?

  (xiii) Zombie/defunctionalized: a designed organism whose every trait is engineered
  for a human purpose, whose evolution is suppressed (kill switches, recoded genomes
  so it can''t exchange genes) — alive but with no evolutionary future and no autonomous
  function; and an AI-run factory that maintains itself.


  Also distinctions the definition must respect:

  - having life vs. having interests/moral status (HeLa, embryos, organoids, AI).

  - being alive vs. being an organism vs. being a living individual vs. being part
  of one.

  - being alive vs. being capable of becoming alive (a seed, an egg, a spore, a frozen
  cell) vs. being dead.

  - life vs. agency/mind.

  - type vs. token: is "life" a property of individuals, lineages, or systems?

  - the definition''s job vs. the detection marker''s job (a definition shouldn''t
  be hostage to what our instruments can measure, but an unusable definition is useless
  for the sample-return team).


  Results/consistency constraints:

  - No vitalism / continuity with chemistry and physics.

  - Only one independent instance of life known (all Earth life from a single origin),
  so no inductive base for generality.

  - Any definition that builds in Earth-specific chemistry (DNA/RNA, proteins, water,
  carbon) faces the chauvinism objection.

  - The detection problem: our instruments only detect what we look for; "life as
  we don''t know it."

  - Thermodynamics: living systems are far-from-equilibrium; but so are many nonliving
  systems, so this is necessary-not-sufficient.

  - Descent with modification as a population-level property, not an individual one
  — so "able to evolve" is a property of a lineage, not of a token organism; this
  threatens definitions that make life a property of individuals (and thus screws
  up cases (iv)).

  - If the definition is vague/cluster-based, does it still do the announcement/regulatory
  jobs (which need thresholds)? Also: does the vagueness track real indeterminacy
  in nature or just our ignorance?


  Conflicts to flag:

  - Generality (chemically neutral, applicable to unknown substrates) vs. discriminating
  power (excluding fire, crystals, computer viruses).

  - Sharp boundary (for regulatory/announcement purposes) vs. fidelity to a graded
  natural phenomenon.

  - Individual-level verdicts (mule, worker ant, spore) vs. evolution-based definitions.

  - Descriptive neutrality vs. moral/practical load-bearing (definitions gerrymandered
  to protect or exclude embryos/AI).

  - Operationalizable (what can be measured in a sample) vs. not hostage to current
  instruments (a definition that says "life = what our assays flag" is circular).

  - Extension to ordinary cases (all Earth organisms alive, fires not) vs. theoretical
  revisionism (some views imply a termite colony is more alive than a termite; or
  that a virus inside a cell is alive and outside is not — i.e., context-dependence).


  Also: should a definition allow degrees and context-relativity? Interesting requirement:
  "relational" definitions — alive-with-respect-to-X.


  Which desideratum excludes the most candidates: my guess would be "must give a verdict
  on entities that are lineages without individuals and individuals without lineages"
  or "must be chemically non-committal while still excluding fire and software." Let
  the model decide but ask for it.


  Also ask: which single requirement should be dropped if the list proves unsatisfiable,
  and why.


