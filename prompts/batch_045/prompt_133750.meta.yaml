  Structure of the prompt:

  1. Opening context: I''m [role], writing [thing]. Before I survey candidate definitions,
  I want the spec.

  2. State the purpose(s) explicitly and note they may conflict.

  3. Ask for the desiderata list: each with the case/consideration behind it.

  4. Require coverage of certain case families: give my inventory (with my constructed/out-of-distribution
  cases) but invite additions.

  5. Require distinguishing genuine desiderata from camp prejudices; say which are
  non-negotiable vs. preferences.

  6. Ask which desideratum does the most exclusionary work.

  7. Ask which subsets are jointly unsatisfiable, with the argument.

  8. Optionally brief scorecard of contenders, kept short (one or two sentences each),
  and say criteria is the main deliverable.

  9. Formatting: a table is fine; keep prose where the tension argument is.

  10. Constraints: no citations/bibliographies needed; write from the cases given.


  Let me write the case inventory carefully, in the weeds, with reasons:


  (i) Viruses and viroids: metabolically inert, no ribosome translation, but evolve
  and have lineage structure; some giant viruses blur into cellular life; some viruses
  carry translation genes; also endogenous retroviruses as parts of genomes.

  (ii) Prions: heritable, selectable, no nucleic acid, no metabolism, no membrane
  — pure conformation.

  (iii) Transposons and "selfish" genetic elements inside a genome: reproduce, evolve,
  but are parts of a genome.

  (iv) Sterile organisms: mules, worker ants, a castrated animal — alive individually,
  zero fitness, no lineage.

  (v) Dormant/diagonal cases in time: bacterial spores, anhydrobiotic tardigrades,
  seeds centuries old, permafrost microbes revived after geological time, cryopreserved
  embryos, a frozen cell line, a vitrified organ.

  (vi) Parts vs. wholes: a single cell in culture (HeLa), a spermatozoon, an organoid,
  a siphonophore colony, a eusocial colony as a superorganism, a fungal mycelium with
  no clear individual boundary, a slime mold aggregate.

  (vii) Non-organism processes: fire/flames, crystallization, hurricanes, autocatalytic
  chemical sets, Bénard convection — each self-maintaining, growing, "reproducing"
  in some sense, far from equilibrium, but not alive (or are they?).

  (viii) Software: computer viruses and worms, digital evolution systems, evolved
  neural-net agents in simulation; a program running on hardware it did not build.

  (ix) Engineered entities: minimal cells with artificially synthesized genomes (whose
  replication depends on a host cell''s machinery initially), xenobots (frog cells
  that self-replicate kinematically), protocells with metabolism but no heredity,
  hereditary systems with no metabolism, entities with one of the two but not both
  — i.e., dissociating the usual package: metabolism, compartmentalization, heredity,
  evolvability.

  (x) Mirror/chimeric life: reversed chirality — genetically incompatible with Earth
  life, would not share a code, but metabolizes and evolves.

  (xi) The constructed case (my injection): a silicate-based, supercritical-CO₂ "Taraxia"-like
