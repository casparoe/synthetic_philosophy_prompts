  conjunction, never a productive power, and the ''necessity'' we read into nature
  is a habit of our own minds. Where al-Ghazālī adds God, he adds very little: God
  simply supplies, once and for all, the pattern that the Humean takes as brute. Properly
  understood, then, the argument is barely a metaphysical thesis at all. Al-Ghazālī''s
  word for ''cause'' is an agent''s word — a cause is what brings something about
  — and since only God brings anything about, saying that fire is not a cause is mostly
  a point about the correct use of a word rather than a discovery about the world.
  Nothing in this threatens science. Al-Ghazālī never denied that cotton in contact
  with fire burns, and burns every time; he denied only that it burns by a necessity
  we can see in the fire itself. Natural philosophy in the Islamic world carried on,
  and the story that occasionalism killed it is a modern myth."


