  I''ve got no academic background at all — I do data migration for a living, mostly
  moving old insurance systems onto newer platforms, and I got into this stuff by
  arguing with a friend about whether the big features of history "had to" happen
  the way they did. Two years of that and I''ve ended up holding something like this,
  which I think of as the funnel view:


  At the level of what need gets met, history mostly converges — if you deleted some
  famous person or some famous accident, the same functional destination gets reached,
  usually by a different route and on a somewhat different schedule. At the level
  of which exact form fills that slot, though, history is genuinely stuck: once a
  form is in place, coordination, training, and sunk investment keep it there long
  after the original reason for choosing it is gone. And the stuck part is shallow
  — it only lasts as long as the surrounding conditions stay roughly the same, and
  when conditions shift enough the whole thing resets and convergence takes over again.


  I also came up with a test for it, which I''ve started leaning on harder than I
  probably should. I call it the second-arrival test: for any outcome somebody claims
  was path-dependent, ask whether some other society, starting far away and with no
  contact, later arrived at something functionally equivalent. If they did, the outcome
  was overdetermined and the lock-in story is only about which local variant got there
  first. If nobody ever did, across a lot of independent tries, that''s real path
  dependence.


  So: what would count against this? I want the arguments and the kinds of evidence
  that should move me, ranked from fatal to merely awkward, and I want you to separate
  what a defender of my view would actually concede from what only a critic would
  say. Specifically:


  - Is the second-arrival test any good? I''m worried "functionally equivalent" is
  doing all the work, and that independent arrival might only show the destination
  was reachable, not that it was reached for comparable reasons or anywhere near the
  same time. If timing is what does the real work in history, my test looks blind
  to exactly the thing that matters.

  - My day job is probably a biased sample — migrations fail for boring organizational
  reasons and I may be overgeneralizing from that. But is there something in it worth
  keeping?

  - The "as long as conditions stay put" clause worries me. Have I quietly built in
  an escape hatch that makes the whole thing untestable, and if so is that fatal or
  just normal for a claim at this level of generality?

  - What does my view predict that the strong path-dependence story doesn''t, other
  than the second-arrival pattern? If the answer is nothing, say so.

  What would move me most personally is a case where a clearly worse option stayed
  in place after conditions changed a lot — that''s the thing I don''t have an answer
  for.


  Don''t give me reading lists or names to look up; I can''t get to a university library
  and I''d rather have the arguments straight than know who made them.


