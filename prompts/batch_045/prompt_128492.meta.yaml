  Let me write the description clearly:


  1. Some group gets sorted into a kind K by an institution (a risk category, a diagnosis,
  a "high-crime area", an "at-risk" student, an illiquid bank).

  2. Being sorted changes how other people act toward them.

  3. That changed treatment generates the very data that gets cited as evidence that
  the sorting was correct and that K tracks something real — and crucially the data
  often looks like it''s about a property the people have (a measured rate, a score,
  a frequency), not about how they were treated.

  4. The criteria for K get periodically re-estimated from that data, so the kind
  drifts to fit the effects of its own application.

  5. And it settles: once it''s settled, if you try to test whether K is "real" by
  intervening, the intervention gets absorbed — the machinery re-estimates and you
  end up roughly where you started. So the kind is empirically robust and socially
  made at the same time, and the robustness is what makes it look made-of-nothing-social.


