  \ But one might argue about knowledge of the past, other minds, etc. Good.\n\n5.\
  \ Another: conflating \"I know I have hands\" with knowledge of one's own current\
  \ experience in the Moorean proof.\n\nAlso maybe the prompt should inject a niche\
  \ idea: I'll invent a variant: \"the selective envatment hypothesis\" — you were\
  \ envatted five minutes ago but your memories are continuous with the real life\
  \ you'd lived; or a \"partial\" envatment where the envatted subject receives input\
