  \ to think about whether the BIV worry is really about error or about luck/disconnection.\n\
  \nActually I like this a lot for the BIV domain: a hypothetical where the envatted\
  \ subject's beliefs are by and large true (the simulation is faithful to a distant\
  \ real world), and asks whether knowledge is undermined. This brings out whether\
