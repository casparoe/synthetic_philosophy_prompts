  \ may introduce comprehensive doctrines into public political discussion provided\
  \ that in due course they give properly public reasons). Also his thesis on religion\
  \ in \"A Brief Inquiry into the Meaning of Sin and Faith\" (his Princeton senior\
  \ thesis, 1942), later he was critical of it. Also the \"wide view of public reason\"\
  .\n\nMaking a grading prompt: exam question about Rawls's views on religion, plus\
