  \ view) — e.g., what I'd call \"doctrinal dependence\" vs \"evidential dependence\"\
  \ — or a hypothetical like \"a religious citizen who supports a law on the basis\
  \ of an alleged divine command, but who also has independent public reasons available\
  \ to them and gives them.\" Or add an invented term \"the ecumenical proviso\" or\
  \ something. Hmm.\n\nAlternatively, choose skepticism/BIV: grading a student answer\
  \ on whether BIV undermines all knowledge vs. only knowledge of the external world\
