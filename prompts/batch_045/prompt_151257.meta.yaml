  \nActually, maybe the strongest combination: type = grading a student's answer,\
  \ domain = skepticism and the brain-in-a-vat. I know this literature well: Putnam's\
  \ semantic externalism/twin earth argument in Reason, Truth and History (1981);\
  \ the \"we cannot coherently suppose we are BIVs\" claim; Brueckner's \"Brains in\
