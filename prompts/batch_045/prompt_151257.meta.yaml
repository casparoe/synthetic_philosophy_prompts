  \ reasons from public debate; misattributing to Rawls the claim that comprehensive\
  \ doctrines cannot be \"reasonable\"; conflating \"overlapping consensus\" with\
  \ \"modus vivendi\"; attributing to Rawls the view that the duty of civility applies\
  \ to the \"background culture\" rather than only to public political forum (i.e.,\
  \ constitutional essentials and matters of basic justice); a step that doesn't follow.\n\
