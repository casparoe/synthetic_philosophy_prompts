  the benchmark any solution has to hit is the usual one: the anomalous advance of
  Mercury''s perihelion really did confirm general relativity, and it still does —
  it''s part of the total case for GR for us now, not just something that briefly
  boosted Einstein''s own confidence in 1915-ish when he first got the derivation
  to come out.


