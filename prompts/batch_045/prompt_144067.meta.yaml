  I''d rather drop (3).


  (7) I''m a subjectivist about priors: any coherent prior is rationally permissible,
  there''s no rationally mandated prior, and disagreement in priors is fine.


  (8) Also, on method: I don''t think pre-theoretic intuitions about cases are evidence.
