  \ one: an ant colony or a bee colony — where the individual is rigid but the collective\
  \ is flexible. Or slime mold.\n\nMaybe best: three new cases? The prompt type says\
  \ the asker specifies a new case. Could include a couple. Let's do one main new\
  \ case with perhaps a secondary.\n\nLet me decide: the \"body\" is the asker's philosophy/biology\
  \ professor or a research group that maintains a list labeled \"sphexish vs. not\"\
