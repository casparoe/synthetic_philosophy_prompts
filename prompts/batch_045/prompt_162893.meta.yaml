  Dollar auction (Shubik, "The Dollar Auction Game: A Paradox in Noncooperative Behavior
  and Escalation", 1971, Journal of Conflict Resolution). Rules: a dollar bill auctioned;
  highest bidder receives the dollar and pays their bid; second-highest bidder also
  pays their bid and receives nothing. Bids in increments (e.g., 5 cents). Classic
  result: bids escalate past $1.


  Analysis: Suppose I bid $0.90 and you bid $0.95. If I drop out, I pay $0.90 (I''m
  second-highest now... wait, if you''re highest at $0.95 and I''m second at $0.90,
  I pay $0.90 and get nothing: loss $0.90). If I bid $1.00, I become highest; you
  become second-highest, and if you stop, you pay $0.95 and I pay $1.00 and get the
  dollar: net loss $0. So bidding $1.00 dominates dropping out ($0 loss vs $0.90 loss)
  — assuming you then stop. So yes, escalation is loss-minimizing forward-looking
  (the $0.90 is sunk in the sense that it''s paid either way, and comparing net outcomes).
  Actually careful: whether $0.90 is paid either way depends on outcome — if I bid
  $1.00 and you respond with $1.05, then I pay $1.00 (second-highest) and lose it.
  So the comparison is: drop out now → pay $0.90 for sure; bid → either win at $1.00
  (loss $0) or lose (pay $1.00, i.e., loss $1.00 if you outbid me). So it''s a gamble:
  $0 for sure vs. lottery between $0 and -$1.00. Under the assumption the other will
  stop, escalation is rational; but there''s the escalation risk. Still, the key point
  stands: continuing is not straightforwardly a sunk-cost fallacy because the already-committed
  amount is paid either way — it''s a genuine forward-looking loss minimization given
  the (possibly false) belief that the other will drop. Hmm, actually many presentations
  do describe it as sunk cost. The in-the-weeds nuance: the escalation is locally
  rational; the paradox is about backward induction / entry under common knowledge.


