  what would count against that claim.


  Please be straight about the following, and rank the defeaters from fatal down to
  merely awkward.


  First, the empirical question. Suppose we could run the study I''ll call the late-music
  cohort: children raised with no music at all beyond the incidental — no songs, no
  lullabies, no rhythmic play — but otherwise emotionally and linguistically ordinary,
  presented at adulthood with a representative sample of the world''s music alongside
  matched non-musical soundscapes. It seems to me that Schopenhauer''s account, taken
  at its word that music is intelligible without any acquaintance with the world it
  does not depict, predicts something like immediate and roughly convergent uptake:
  these listeners should recognise the will''s stirrings in a lament or a march even
  having never heard one. An associationist predicts confusion. So: what result here
