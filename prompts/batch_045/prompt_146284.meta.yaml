  the philosophy of biology, and I would rather it did philosophical work than decorated
  it. The session is on the definition of life, and I want a sestina.


  The formal conceit I have in mind: the six end-words are not abstract nouns but
  six borderline cases — fire, virus, mule, spore, colony, and one case of my own
  devising, "the selvage." The six stanzas each take up a different candidate mark
  of life in turn: metabolism; reproduction; heredity with variation, i.e. evolution
  by selection on heritable differences; bounded individuality or compartmentalization;
