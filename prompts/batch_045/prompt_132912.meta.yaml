  ---


  Construct a puzzle in the style of Hofstadter''s MU puzzle — an explicitly given
  formal system: an alphabet, one axiom string, a small finite list of rules, and
  a target string — engineered so that it isolates what it means to jump out of the
  system.


  Specifications:


  1. The target must be reachable from the axiom by the rules (so the puzzle has a
  solution in the system), but every derivation must be long enough that no realistic
  amount of search inside the system finds it — the strings reachable within, say,
  a few thousand rule-applications are vastly more numerous than any search can cover,
  or the shortest derivation is exponential in some parameter, something like that.


  2. There must be a short meta-level argument that settles reachability: a characterization
  theorem of the form "a string is derivable iff it satisfies condition C," where
  C is stated in terms of quantities defined on strings (length, counts of letters,
  residues, sums of positions) and proved by two half-arguments: (a) every rule preserves
  C (so reachable strings satisfy C), and (b) every string satisfying C can be reached
  by an explicit construction. So the insight is of the same species as the I-count-mod-3
  insight that settles MU — arithmetic done about the rules rather than moves made
  with them.


  3. The system may not encode its own rules, its own strings, or statements about
  derivability: no Gödel numbering, no quoted strings as objects, no self-reference,
  no rule that lets you write a lemma. The point of the case is that the characterization
  theorem lives outside the system, and (this is the design constraint) there is no
  way to convert it into a derivation: the meta-level argument doesn''t tell you which
  rule to apply at which step in a way that a person... hmm, actually condition (b)
  does give a construction — so the meta-argument does guide search.


  Hmm, careful: if C is necessary and sufficient and the proof is constructive, then
  the meta-level insight does give you an algorithm to find a derivation (though maybe
  a long one). That''s fine and realistic: in MU-style puzzles, the insight tells
  you "unreachable" definitively. For a reachable target with huge shortest derivation,
  the constructive proof gives you an effective procedure. Fine — I can require: the
  meta-argument must yield a polynomial-time procedure for producing a derivation,
  while blind search is exponential — so the jump-out is what makes the problem tractable,
  not merely solvable-demonstrably. And also: the *human* who has the insight still
  can''t write down the derivation (it''s too long) — so the interesting upshot: the
  JOOTS gives you certainty without giving you the object.


  4. Self-contained: no reliance on external theorems that need checking; the invariant
  must be verifiable by elementary arithmetic.


  5. Not a re-skin of MU or of any standard puzzle: the conserved/characterizing quantity
  should be a different kind — e.g., require the invariant to be a *pair* of conditions,
  one an invariant and one a monovariant, or require it to involve the ordering of
  letters, not just their counts. (Because MU''s invariant is a single residue of
  a letter count, and the obvious variants of MU just re-skin that.)


  6. Also: include a "near-miss" — a second target string that differs from the first
  in one letter, which is *not* reachable, and which a plausible-looking but wrong
  meta-level argument would declare reachable. The wrong argument must fail for a
  specific structural reason the solver must identify.


