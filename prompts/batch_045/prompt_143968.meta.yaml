  I''m a PhD student in intellectual history finishing a dissertation on how political
  communities commemorate military defeats. I keep running into a configuration in
  my sources that I don''t have a word for, and I need one because I''m building a
  typology for a chapter and I can''t keep listing instances.


  The pattern: later generations use a defeat to do two things at once that seem to
  pull in opposite directions. On the one hand the loss is treated as proof of the
  losers'' devotion — they fought on, they suffered, they were beaten, and the costliness
  of that is what licenses the honoring; a victory bought cheaply would not do the
  same work. On the other hand the same loss is used to detach the commemorators from
  the content of what was fought for. Because the side lost, the cause was never implemented,
  so it can be remembered as pure commitment — willingness to die for X — without
  anyone having to describe what X would have looked like had it won, or whom it would
  have cost.


  Instances: [Confederacy], [Kosovo], [Masada]. And a boundary case: [Dunkirk].


  Then: what I''ve tried and found imperfect: "moral victory" (too thin — it names
  only the first half), cognitive dissonance / sour grapes (too generic — doesn''t
  explain why the loss is monumentalized rather than quietly dropped; and it predicts
  downgrading the goal, whereas here the goal is often upgraded). Also: the truism
  that history is written by the victors cuts the other way.


  Then the ask: is this one thing or two things that co-occur? Is there an established
  concept? Which nearest concepts, and how does this differ from each? If nothing
