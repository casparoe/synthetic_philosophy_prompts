  no second subject, and if it''s conscious but evidentially cut off from the reporting
  subject, that is just my two-subjects claim. Also, the fact that we''d naturally
  call the left hemisphere the patient looks like an artifact of which side has speech,
  not a fact about which is the subject.


  (6) Maya: fair, but the tie shouldn''t be broken by counting. Think about the degenerate
  case I made up on the spot: suppose both hemispheres are fed pixel-identical input,
  perfectly synchronized — same scene, same everything — with no cross-talk. On your
  view there are two subjects having numerically distinct but exactly similar experiences.
  On mine there''s one, and maybe in that setup the notion of "how many" has nothing
  to distinguish the answers. Either way, the count can''t be the primitive; something
  about the streams has to make them one or two.


  (7) Josh: fine, here''s the thing that makes it two: a bandwidth dial. Imagine the
  surgeons can put in an adjustable cross-hemisphere link — start at full bandwidth,
  dial it down continuously to zero. At zero you''ve got my two subjects. At full
  you''ve got one. So somewhere on the dial there''s a point where the number of subjects
  changes, and if phenomenal unity is all-or-nothing there has to be a sharp cliff:
  one more millisecond of latency and a subject pops into existence. I''m happy with
  that — thresholds are everywhere in nature, and a sharp transition isn''t a contradiction.


  (8) Maya: I''m not happy with it, and that''s my objection rather than a rebuttal:
  a count of subjects that flips on an arbitrarily small physical change, with nothing
  else about the streams changing at that instant, looks like a brute fact with no
  explanation available — which is a reason to suspect we''re asking the wrong kind
  of question, not a reason to deny the cliff. Maybe "how many subjects are here"
  can be indeterminate in the middle of the dial without there being a fact we''re
  ignorant of, the way "how many clouds are in the sky" can be.


