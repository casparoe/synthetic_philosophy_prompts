  Two friends of mine got into an argument at dinner the other night that I couldn''t
  referee, and I want to know who was actually right about what. The topic was split-brain
  patients — people who''ve had the corpus callosum cut for epilepsy, so the hemispheres
  can''t talk to each other. You know the findings: something flashed to the right
  hemisphere gets picked out correctly by the left hand while the patient denies seeing
  anything and the speaking side invents a story about why the hand is doing that.
  Josh''s claim was that this is a case of two conscious subjects in one skull. Maya''s
  claim was that it''s one subject whose consciousness has come apart functionally.
  It went like this.


  (1) Josh: two streams, each with its own information, each driving its own behavior,
  neither available to the other — that''s what two subjects looks like from the inside.
  The only reason we ever think there''s one subject in a head is that normally everything
  is pooled; take the pooling away and you can see that there were two experiencers
  sharing a body the whole time, we just couldn''t tell.


  (2) Maya: that inference needs a premise you haven''t stated. Distinguish access
  unity — contents being jointly available for report, reasoning, and action — from
  phenomenal unity: two experiences being had together, as aspects of one experience,
  "for one subject" in the sense that there''s something it''s like to have both at
  once. The data show access unity failing. They don''t show phenomenal unity failing,
  and nothing behavioral could settle that, because phenomenal togetherness isn''t
  the same property as informational togetherness.


  (3) Josh: then phenomenal unity is doing no work. If the only possible evidence
  — mine or the patient''s — for two experiences being co-conscious is that they''re
  integrated (reportable together, reason-guiding together, action-guiding together),
  then a unity that survives the total loss of integration is unfalsifiable. In a
  normal brain, integration is all the evidence we''ve got; you''re asking me to believe
  in a further fact that floats free of every test.


  (4) Maya: not free of every test — I''ve got introspection right now. My visual
  field, the hum of the fridge, the itch on my ankle: I don''t infer that they''re
  together, I''m directly acquainted with their being together. That acquaintance
  is the datum any theory of unity has to accommodate. So there is a positive criterion;
  it''s just first-personal, and the patient''s reports come from only one hemisphere,
  which means you can''t run it on the case that matters.


  (5) Josh: which is exactly the problem, and it cuts your way too hard. If the only
  stream that reports is the speaking hemisphere''s, then on your own criterion you
  have to say: either the right hemisphere''s stream is unconscious, or it''s conscious
