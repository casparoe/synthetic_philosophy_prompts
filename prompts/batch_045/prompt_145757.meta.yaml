  ---


  I teach an upper-level seminar on representation and logical empiricism, and I am
  writing the final exam. I need one essay question — 90 minutes, 1,000 words, 25
  marks — on Otto Neurath''s picture languages: the Isotype system developed at the
  Vienna social and economic museum, with its rules that a quantity be shown by repeating
  one standardized pictogram rather than by enlarging it, that perspective and incidental
  detail be suppressed, and that raw figures be transformed before they are drawn.


  The question must defeat two stock answers. The first treats Isotype as mere popular
  outreach for the unity-of-science movement — attractive pictograms for workers,
  continuous with the campaign against metaphysics. The second treats it as a refutation
  of Neurath''s own epistemology: a medium meant to cross linguistic borders seems
  to presuppose exactly the neutral, self-interpreting representation that his holism
  and his tolerance of vagueness rule out. Both are half-right in ways I want students
  to separate out.


  Set the question around the following scenario, which students will receive verbatim:

  [scenario block]


  Then ask them to say whether counterfactual Isotype completes Neurath''s project
  or reduces it to absurdity, and why.


  Deliverables: the question as students will see it; a model answer of roughly 700
  words; and a marking scheme built on five must-hit moves (total 25) with a one-line
  note on how a strong student typically falls short on each. The scheme should make
  the A/B boundary explicit: I want real credit for noticing that Isotype''s own conventions
  — repetition, suppression of detail, transformation — are learned and already interpretive,
  so that the live issue is not whether pictures can replace words but whether a visual
  display can be at once learnable and non-question-begging, and what follows for
  Neurath if it cannot. Also say how to reward a student who argues that part of the
  dispute is verbal. Mark on argument alone: the answer should require no quotation,
  citation, biographical detail, or source beyond the scenario.


  ---


