  retire them when the loop turns bad. She extends this with a claim she calls "loop
  fatigue": every category has a half-life, because the more a category circulates,
  the more it gets taken up in self-narrative, insurance codes, disability claims,
  and social-media identity, and after a while the feedback swamps whatever signal
  it had — so she proposes scheduled sunset clauses (e.g., revalidate or retire each
  category every ~15 years) and "stealth categories": research-only categories that
  are deliberately kept out of clinical records and out of public view so they don''t
  loop.


