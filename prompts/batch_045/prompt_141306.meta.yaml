  I write novels, and my interest here is professional as much as personal. Here is
  roughly where I''ve landed:


  (1) Holism about reasons: no feature is a moral reason in every context in which
  it appears; one and the same feature can be a reason here, no reason there, and
  a reason against elsewhere.


  (2) There are no true, finitely statable, action-guiding moral principles. Moral
  judgment is a trained perceptual skill — closer to a good critic''s sense of a passage
  than to the application of a rule — acquired by apprenticeship to cases rather than
  by learning formulae.


  (3) Realism: whether my protagonist did wrong is not settled by what anyone would
  judge, even under ideal conditions of attention and reflection.


  (4) Supervenience: no moral difference without a non-moral difference; two situations
  alike in every natural respect cannot differ morally.


  (5) Moral understanding travels. A general sentence can carry knowledge to a case
  it was not drawn from (a child told not to take what isn''t yours can thereby know
  something about an apple she has never encountered), and one case can carry a verdict
  to another (I am confident in advance that if Anna''s betrayal is wrong, the parallel
