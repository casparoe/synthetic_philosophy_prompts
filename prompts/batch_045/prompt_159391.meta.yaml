  hey — I''m a novelist (literary fiction, not a physicist) and I''m about 7 months
  into a book whose narrator is a retired cosmologist named Ines who lost her husband
  last year and who, in her grief, has started talking herself into a very specific
  metaphysical line: that because relativity kills the present, nothing is ever really
  lost, her husband is still "there" at his own dates, and so grief is somehow a category
  mistake. I want that speech to be more than consoling nonsense — I want it to be
  something a philosopher could say without being caught out. The trouble is I''ve
  been going to a reading group on time and free will and I''ve ended up with a pile
  of commitments that I can''t tell are a package or just a heap. Can you act as a
  professional philosopher of physics (and someone who''s read a lot of the free will
  literature) and audit the pile? Please brainstorm a bit first — sketch what you
  think the real fault lines are before you commit to an ordered verdict — and then
  give me the audit in American English. And please don''t give me citations, reading
  lists or footnotes; I''ll chase the literature down myself.


  Here''s roughly where Ines (and, honestly, I) have landed:


  1. The Rietdijk-Putnam style argument works: the two-passers-on-the-street case
  where their "nows" slice through the Andromeda galaxy at different dates shows there''s
  no frame-independent present, and once you take physics at face value rather than
  treating it instrumentally, all times are equally real — the block universe.

  2. But I also think the standard reply is right: the argument needs "real for me
  now" to be transitive across reference frames, and for spacelike-separated events
  there''s no frame-independent now to be transitive over — and I hold both of these
  at once without knowing whether the second one quietly kills the first.

  3. I''m a compatibilist about free will and responsibility: determinism isn''t the
  threat, guidance control / reasons-responsiveness is what matters, alternative possibilities
  were never required.

  4. But I also think the block universe takes something away that plain determinism
  doesn''t: Ines keeps saying that if the outcome is already sitting there in the
  block, her *deliberating* can''t be making a difference, and that feels like a distinct,
  worse worry than determinism — even though by (3) I shouldn''t be able to say that.

  5. There''s no objective passage or flow of time; "now" is indexical, like "here."
  Yet I also think the asymmetry of agency is a real feature of the world, not just
  an artifact of memory and entropy: I can affect later things and not earlier ones,
  and that''s not merely how it looks from inside.

  6. Death: I want to keep both "nobody who ever lived has stopped existing, they''re
  alive at their own times" and "grief is fitting and the loss is real and present."

  7. Quantum mechanics gives us objective, irreducible chances (not ignorance), and
  I''ve been telling myself that''s no problem for the block — the block just contains
  the one history that happened, chances and all.


  One more thing that got thrown at me last week: a physicist in the group said that
  cosmology actually hands us a preferred slicing — the frame in which the cosmic
  microwave background looks the same in every direction — so there is a privileged
  global time after all, and doesn''t that mean Rietdijk-Putnam-style arguments only
  work in the empty special-relativistic case and not in our actual universe? I have
  no idea if that''s a rescue for a presentist-ish Ines or a bullet she has to bite,
  but fold it into the audit if it bears on any of 1-7.


