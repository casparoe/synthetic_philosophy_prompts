  that would prevent dissolving, so the object doesn''t dissolve when in water, yet
  it''s soluble. So masks break the "only if" direction, finks break the "if" direction.


  Standard responses: Lewis''s 1997 "Finkish Dispositions" — revise conditional analysis:
  x is disposed to give response r to stimulus s iff x has an intrinsic property B
  (the basis) such that, if x were to undergo s and retain B, x would give r; plus
  reference to causal basis, degree/timescale, and "lonely" — actually Lewis''s account:
  disposition to r in response to s is a property B such that x has B, and B is such
  that, if x were in circumstances s and retained B until time t, x would r within
  t. Finks are handled by "retain B", masks by... Lewis also invokes "masking" as
  a case where the disposition is present but the manifestation is prevented. Also
  there''s the complement/resultance issue — "sure-fire" dispositions.


  Other approaches: Choi & Fara''s "Dispositions" — analysis with stimulus conditions
  including "and no masker obtains". Also the "dispositional essentialism" / powers
  view (Sydney Shoemaker, C.B. Martin, John Heil, George Molnar) — dispositions are
  not reducible to conditionals, they''re causally potent intrinsic properties. There''s
  also the claim that dispositions are "extrinsic" — McKitrick''s dispositional externalism:
  some dispositions have extrinsic grounds (e.g., being a key, being visible = disposition
  to be seen depends on external circumstances). Also "hiddenness" of dispositions,
  dispositions as second-order properties, C.B. Martin''s "antidote" cases, "reverse
  cycle" finks (won''t dissolve out of water but... ), "finks" vs "masks" vs "mimics".


  Also relevant: the grounding/resultance problem: what makes it true that a thing
  has a disposition? — "the dispositional/categorical distinction is a distinction
  in how we describe properties, not a distinction between properties" (Armstrong-ish
