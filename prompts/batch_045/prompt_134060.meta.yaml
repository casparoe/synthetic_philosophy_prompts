  someone knows a thing can depend on what is at stake for them... They keep finding
  that everyone agrees on the cases and disagrees on what to call it; and they can''t
  tell from a person''s answer to one case which view they hold.


  Deliverable: A decision tree (flowchart in text) that starts from a commitment everyone
  shares and ends at a named position.


  Specs:


  1. Starting node: something like: "Hanne is meeting a friend; she checked the timetable
  this morning; nothing much depends on being wrong; you''d say she knows the train
  leaves at 11:07." Start there.


  2. Nodes: 10–12 branch nodes, each a single question with two or three answer options,
  phrased so that someone who has never heard of contextualism or pragmatic encroachment
  could answer it. No node may ask whether a label applies. Every node should be a
  concrete case or a concrete claim about a case; if a node is a theoretical claim,
  phrase it as a forced choice about a case.


  3. Dimensions the nodes must vary (at least most of them): ... list.


  4. Cases that must be used (3–4 invented, fully specified). Let me write them:


  (a) The ferry: Two colleagues, Maya and Rob, both looked at the same departures
  board for the 18:40 ferry to the island. Same evidence. Maya is taking the ferry
  for a surprise birthday dinner; if she misses it, the next one is at 21:40 and she''ll
  be late but nothing worse. Rob is a marine mechanic and the 18:40 is the last boat
  tonight; if he misses it he cannot get to a vessel whose mooring line is chafing
  through, and a man may lose a mooring... hmm, maybe keep it: if Rob misses it he
  cannot reach a boat whose bilge alarm has been sounding and someone could be hurt.
  Question: does Rob know / do they both know? — This varies stakes with evidence
  fixed.


  (b) The third party''s stakes: Same as (a) but the person with high stakes is the
  attributor: Maya, low stakes, is advising Rob... Actually design: "the only person
  at risk is a third party who will act on the subject''s say-so."


  (c) Unknown stakes: A lab technician, Priya, runs the calibration check at 09:00
  and writes "calibrated" in the log. At 09:00 nothing depends on it. At 16:00, without
  her knowing, the machine''s output is used to set a radiation dose for a patient.
  Does Priya know at 09:00 that the machine was calibrated? (Stakes raised after the
  belief is formed, unknown to subject.)


  Hmm, careful: I''m inventing; fine.


  (d) Manufactured / joked stakes: A stranger tells you, as a joke, that they will
  donate £10,000 to a cause you despise if you are wrong about whether the museum
  is open on Mondays — stakes raised by someone else''s arbitrary bet, no change in
  evidence. (Separates "stakes" views from "salience"/"relevance" views; also whether
  stakes must be the agent''s own practical reasoning.)


