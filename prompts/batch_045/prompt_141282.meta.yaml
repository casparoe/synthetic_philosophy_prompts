  I''m a retired quantity surveyor with time on my hands, and I''ve got into the habit
  of arguing about the ethics of eating animals with two people who disagree with
  each other as much as with me: my brother-in-law, who raises cattle on permanent
  pasture, and my daughter, who hasn''t eaten animal products in nine years. What
  keeps happening in these arguments is that a certain kind of consideration gets
  introduced as a tiebreaker — the wild animals affected by how we farm — and whichever
  of us introduces it, the numbers come down on their side. Two examples.


  First: compare beef with chicken, per kilogram of meat. The chicken case involves
  vastly more individual deaths per kilogram, because the animals are small, but far
  less land. The beef case involves one large animal per several hundred kilos, but
  much more land per kilo, and therefore more habitat disturbed and more field animals
  killed at harvest. So the direct-death count favours beef and the land-use count
  favours chicken, and the two don''t tell you how to weigh against each other. But
  the thing I can''t shake is that the land-use term doesn''t seem to have a stable
  sign at all. On my brother-in-law''s farm the pasture is full of voles, birds and
  insects that are there because the pasture is there; if the land went back to scrub,
  or to forest, or to a housing estate, the set of animals on it would be entirely
  different and some of those alternatives would hold fewer animals, not more. So
  whether pasture-feeding a cow "causes" wild-animal deaths, and how many, looks like
  it depends on a counterfactual that nobody states — and each of us quietly picks
  the one that suits us.


  Second: the same argument changes shape depending on what the ranking is over —
  per kilogram of meat, per gram of protein, per calorie, per hectare per year, per
  meal. Two diets can swap places when you change the unit, and the choice of unit
  seems to smuggle in a view about what we''re trying to minimise. ... A philosopher
  friend said the first example reminded her of the puzzle about future people where
  no one in particular is made worse off; but that puzzle, as she described it, is
  about who counts as harmed, whereas my worry is about whether a single consideration
  has a direction at all before some comparison class is fixed.


