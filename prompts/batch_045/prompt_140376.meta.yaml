  I''m writing a paper for a graduate seminar on the moral status of artificial systems,
  and I''ve hit a disagreement with a friend that I can''t locate precisely enough
  to resolve. We agree on the setup. Take for granted that human suffering matters,
  and that whatever it is about it that matters is the feature we''re trying to locate
  in other systems; I don''t want to relitigate that. We also agree on what I''ll
  call the ascription problem: for essentially any physical system — a wall, a thermostat,
  a laptop — there are indefinitely many computations it can be described as implementing,
  including computations with states we''d be tempted to call aversive, so "does it
  implement the right computation?" can''t be answered until something fixes which
  description is the intended one. Where we split is on what does that fixing, and
  I want you to compare our two answers.


  My friend''s answer — call it the causal-organization criterion — is that the ascription
  problem is merely epistemic. There is, she thinks, a description-independent fact
  about which counterfactual-supporting causal organization a system physically realizes:
  the states that interact with each other and with inputs and outputs in the right
  pattern. A process matters morally just in case the system''s dynamics really instantiate
  the organization that, in us, is what pain is; our descriptions come and go, but
  the organization is there or it isn''t. My answer — call it the self-tracking criterion
  — is that the ascription problem goes all the way down, so the only non-arbitrary
  tie-breaker has to be internal: what matters is whether the system itself represents
  itself as undergoing a valenced process, where that representation is load-bearing
  for its own forward-looking self-regulation (what it anticipates about itself, what
  it plans around, what it will trade other things to avoid).


  The two criteria mostly coincide for ordinary humans and mostly agree about rocks,
  which is why I suspect the disagreement is narrower than it sounds, but they come
  apart at the edges, and I''d like a comparison organized around the cases and the
  arguments rather than a survey. Consider a system with a complete, behaviorally
  efficacious pain organization but a self-model that says nothing about it — call
  this silent valence — and, on the other side, a system whose self-model richly and
  controllingly represents it as suffering, which avows it, plans around it, and acts
  on the avowal, while the underlying dynamics contain nothing structurally resembling
  ours, being more like a well-organized table of scripts: the case that worries people
  who think we may end up manufacturing something that merely counterfeits a subject.
  Tell me which criterion handles each better and why, and then get at where the disagreement
  bottoms out. Specifically: does the self-tracking criterion really escape the ascription
  problem, or does it just relocate it one level up, since a system''s self-model
  can itself be described as implementing many different computations? Conversely,
  can the causal-organization criterion say what singles out one causal organization
  as the morally relevant one without covertly helping itself to a description? I
  also half believe a deflationary argument — that for any system robust enough to
  realize the relevant organization across a wide range of contexts, engineering pressure
  will force it to track that organization in a self-model, and vice versa, so the
  two criteria coincide in every case we''ll actually face — and I want to know whether
  you think that''s right, and whether, if it is, it dissolves the question or just
  pushes it out to the boundary cases where it matters most. Finally, be concrete
  about what would change your mind: if you could run a single intervention on a candidate
  system — a lesion, a rewiring, an architectural change, a behavioral probe — which
  one would it be, and what result would move you from one criterion to the other?
  And if you think I''ve drawn the contrast wrong — if some third thing is doing the
  work both criteria are reaching for — say so and say what it is.


