  Argument (numbered):


  (1) Rational choice is forward-looking: what is over and done with cannot be changed,
  so only the future consequences of the options open to me now can count in favor
  of any of them. (Bygones are bygones.)

  (2) In an auction where the top two bidders both pay their last bids and only the
  top bidder gets the prize, every dollar I have already bid is gone no matter what
  I do next. So it is a sunk cost.

  (3) From (1) and (2): my past bids give me no reason to bid again and no reason
  to stop; the only question is whether the next bid is worth making, and since one
  more dollar can always turn a certain loss into a win, it always is.

  (4) So at every point in the auction, rationality requires bidding again.

  (5) The same reasoning applies to the other bidder, so the two of us climb past
  the value of the prize and both end up worse off than if neither had bid; a rule
  that predictably ruins everyone who follows it cannot be the right rule.

  (6) But the "only the future counts" principle is exactly what we use to condemn
  escalation of commitment in ordinary life — the contractor who keeps funding a doomed
  renovation because he''s already spent so much. And if we keep (1), we must also
