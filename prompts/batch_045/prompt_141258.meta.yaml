  Content of accurate thesis:

  - Bernard Williams''s thesis: Often called internalism about reasons / the "internal
  reasons" thesis. A person has a reason to act only if they can be motivated by it
  via their existing subjective motivational set (or "S"). So an external moral argument
  cannot by itself give someone a reason to change a deep-seated practice; argument
  alone won''t move you if it doesn''t connect to something you already care about
  (or to your dispositions). In that sense, moral arguments are not the efficient
  cause of moral revolution. (Need mention not that arguments never matter, but they
  are not sufficient.)

  - Appiah''s application: In The Honor Code, he looks at practices like dueling and
  slavery (and footbinding). He argues these practices persisted because they were
  tied to honor: dueling was how a gentleman defended his honor; slavery was bound
  up with honor and status in the Atlantic world. What ended them was not (primarily)
  new moral arguments, nor simply economic interests. Instead, the content of honor
  changed: practices that were once required by or compatible with honor came to be
  seen as dishonorable, shameful, incompatible with the respect owed to persons. Once
  honor flipped, the practice collapsed quickly. Arguments and interests could accompany
  or accelerate this, but the engine was a shift in what people could take pride in
  or be ashamed of. Honor is not mere fashion or status; it''s a social-ethical currency
  linked to self-respect and the regard of others.

  - Williams''s thesis supports this: because reasons are internal, abolitionists''
  arguments couldn''t just refute slaveholders; they had to change what the relevant
  community found honorable, at which point people''s motivational sets changed and
  they became ashamed of the practice. So the causal story is: honor shift first,
  then arguments/interest operate.


