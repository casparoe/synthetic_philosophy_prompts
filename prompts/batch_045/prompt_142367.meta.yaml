  Claim: this can generate a cascade. If the first two voters both say A, then voter
  3''s posterior from the two A''s alone is... Let''s compute. Likelihood ratio from
  one A-signal: P(sig=A|A-state)/P(sig=A|B-state) = 0.6/0.4 = 1.5. Two A signals:
