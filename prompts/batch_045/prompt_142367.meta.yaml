  paragraph a reply so it stays a conversation. You also have the annoying habit of
  ending every reply with a one-line confidence tag: how sure you are in the main
  claim you just made, and which single step you''d most want to double-check. British
  English throughout, and please don''t be polite about my numbers if they''re wrong.


  Here''s my opening. Take the theorem in its standard binary form: two states of
  the world, fifty-fifty prior, n voters, each with a private signal that''s right
  with p = 0.6, conditionally independant given the truth.


  Version A, secret ballot, simple majority, n = 101: the group is right about 98%
  of the time. Fine, that''s the theorem, everyone''s seen it.


  Version B, the same 101 people, same signals, but they deliberate in a fixed order
  and each person publicly announces the vote that their posterior implies before
  the next one speaks. Assume everyone''s a perfect Bayesian, common knowledge of
  p and the set-up, everyone knows everyone''s honest. Then as soon as one option
  is ahead by two, every voter after that ignores their own signal — the public likelihood
  ratio of 1.5 per vote already beats their private one — and the cascade locks in.
  So the outcome is decided by the first two or three speakers: the lead hits two
  immediately with probability 0.52, and when it does, it points the wrong way 0.16
  of the time; the rest of the time voter three breaks a 1–1 tie and is wrong 0.4
  of the time. Add it up and you get roughly 65% — and crucially it stays at roughly
  65% if I give you 1,001 voters or a million, because the cascade direction is set
  before the crowd ever gets used. That''s the independance assumption doing all the
  work in the theorem, and deliberation is exactly the thing that eats it.


  So: the theorem is a conditional result about a voting rule nobody uses, and the
  institution that epistemic democrats actually like — people talking to each other
  and then voting — is the one where the headline "more voters = certainty" just dies.
  And before you reach for it: yes, I know the obvious move is to say that real deliberation
  also raises p, or that people should announce signals rather than votes, or that
  we should design institutions that protect independence. I''ve got follow-ups on
  all three. Deal with the cascade first.


