  If voter 3''s private signal is B, posterior LR = 2.25/1.5 = 1.5 > 1 → still votes
  A. So a cascade starts at step 2 (once two consecutive identical announcements...
  strictly, once the tally is ahead by 2, everyone downstream ignores their private
  signal). Actually: after k A''s and j B''s, the public LR = 1.5^(k-j). Voter with
  a B private signal still votes A iff 1.5^(k-j) * (1/1.5) > 1, i.e., 1.5^(k-j-1)
  > 1, i.e., k - j > 1. So yes, once the A-lead reaches 2, everyone votes A regardless
  of private signal → cascade.


