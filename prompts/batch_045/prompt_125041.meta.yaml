  meaning (Samuelson 1938: utility as a "convenient fiction"), but later work (Afriat,
  Varian) showed you can recover a utility function from choice data — so the "meaning"
  of utility is just a numerical representation of choice. Also: the critique that
  revealed preference can''t distinguish preferences from beliefs/constraints (e.g.,
  choosing X under a budget might reflect mistaken beliefs), and Sen''s critique of
