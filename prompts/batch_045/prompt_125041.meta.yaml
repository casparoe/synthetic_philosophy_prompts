  out cycles with three+ alternatives; SARP does). Also a classic: Richter/Mas-Colell:
  WARP implies rationalizability by a (possibly incomplete/non-transitive) preference
  relation; SARP needed for transitive rationalization. And Afriat''s theorem: finite
  data, GARP ⟺ rationalizable by a locally nonsatiated utility function; and Afriat
  inequalities give a constructive utility function — so utility numbers aren''t meaningless
  but are only determined up to a certain class.


