  Key insight: in a Bongard problem, the intended rule is typically a rule that is
  (i) true of all six A-items, (ii) false of all six B-items, (iii) "the same" rule
  in some deeper sense — each B item is designed to be a near-miss: it violates the
  rule in a minimal way. So the distinguishing feature: in a well-constructed Bongard
  problem, the B items are not just any items lacking the property; they are "minimal
  pairs" — items that would satisfy the rule except for one deliberate change. So
  the phenomenon the asker describes: "sometimes I find a rule that separates the
  boxes perfectly and is quite simple, and yet it feels wrong because it doesn''t
  ''explain'' why the right-hand figures are there — the right-hand items look like
  they were constructed to be near-misses for a different rule, and my rule says nothing
  about that near-miss structure."


