  Draft text:


  ---


  Two research teams have spent a decade arguing past each other about the annual
  international happiness rankings: the league tables that order countries by mean
  score on a 0–10 self-anchoring best possible life question (the Cantril ladder),
  report alongside it a handful of explanatory variables — income, social support,
  healthy life expectancy, freedom to make life choices, generosity, perceived freedom
  from corruption — and place the Nordic countries, year after year, near the top.
  One team, the Targeters, holds that these tables measure something real and worth
  maximizing: that how a population rates its own life by its own lights is close
  to the thing a government is for, that the number is good enough to steer by, and
  that a state should treat a rising score as a standing policy objective. The other
  team, the Anti-Targeters, holds that the number is a culturally conditioned, partly
  on-the-spot-constructed judgment, that cross-population comparisons of it are unreliable
  because of response-style differences and adaptive preferences, and that turning
