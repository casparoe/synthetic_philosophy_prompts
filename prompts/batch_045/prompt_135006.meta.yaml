  — the thought that a protection duty is only recognizable if some identifiable agent''s
  conduct can be named as its cause, which is why climate displacement and structural
  poverty fall outside; and ask whether the practice strictly presupposes traceability
  or whether it''s an artifact of a 1951 drafting compromise, and what a "non-traceable
  harm" system would look like (e.g., a capacity-keyed allocation: duties assigned
  by GDP and absorption capacity, no need for a persecutor).


