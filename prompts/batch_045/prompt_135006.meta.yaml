  view (duty arises when the person is within our power — à la "effective control"
  in human rights law), vs. a capacity/consequentialist view, vs. a samaritan/contractarian
  view.


  The apparent inconsistency: "who counts" (persecution-based, agent-traceable) +
  "who must take them in" (first state in whose power you happen to be) are answers
  from different moral theories bolted together: the definition implies a corrective-justice,
  agent-relative duty (the persecutor or those who wronged owe), but the allocation
  rule assigns duties by jurisdiction/control, not by causal contribution — so the
  state that ends up owing is essentially arbitrary relative to the story that explains
  why anyone owes. That''s a great in-the-weeds thesis!


