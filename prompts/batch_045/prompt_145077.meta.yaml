  Here''s what I actually want. Restate the philosophical use of sphexishness — rigidity
  as the signature of the mechanical, flexibility as the signature of agency, and
  the move from ''that behaviour is mechanical'' to ''that behaviour isn''t free''
  — in the vocabulary I use every day: open-loop versus closed-loop, error signals
  and setpoints, gain, state estimation, sampling rates, dead reckoning, hysteresis,
  mode switching, subsumption, robustness against adaptivity, the plant/controller
