  One distinction I want you to work with, because I think the usual reading gets
  it wrong. A controller can fail to correct for a perturbation for (at least) three
  quite different reasons: it isn''t sampling at all; it''s sampling but the trigger
  is badly conditioned so it re-runs a subroutine instead of updating; or it''s updating
  a variable that isn''t the one the intervention changed. The standard telling reads
  the wasp as the first, and I suspect she''s the third — she plainly does re-check,
  so the interesting fact is that the check doesn''t feed back into the right internal
