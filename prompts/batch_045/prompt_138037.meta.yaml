  Overdetermination is different. An outcome is overdetermined when there are two
  or more causes each of which would have been enough to bring it about on their own,
  so that removing any one of them would have made no difference to what actually
  happened. The textbook case is the firing squad in which two marksmen fire simultaneously
  and either shot alone would have killed the prisoner. Because both shots occur,
  neither is necessary in the circumstances, but it would be absurd to say that neither
  caused the death.


  Overdetermination is not only a philosophers'' curiosity, because a great deal of
  ordinary historical causation is like this once you look closely. A second assassin
  waiting in the wings, ready to shoot if the first one''s nerve fails, is a case
  of the same phenomenon: the outcome would have been the same had the first assassin
  not fired, so once again no individual cause is necessary and the counterfactual
  test fails. It is in this sense that historians call 1914 overdetermined. Rival
  explanations — diplomatic, economic, domestic-political — can each seem sufficient,
  and it is tempting to conclude that the war was structurally bound to come."


  "Which brings us to part (b). Overdetermination makes historical explanation harder
  rather than easier. Where an outcome is overdetermined, the historian cannot use
  counterfactuals to test her explanation: the question ''would the war still have
  broken out if Franz Ferdinand had not been shot?'' has no determinate answer, because
  some other route was available. Nor can she rank her causes, since on her own account
  each of them was enough. The result is that causal claims in history cannot be checked
  against the evidence in the way that a causal claim in, say, physics can: what is
  left is a narrative that we assemble retrospectively and that is shaped as much
  by what we find salient as by what actually brought the event about. This is also
  why an overdetermined outcome is one that would have survived a fair amount of change
  in the background circumstances — it was robust, not fragile — and so it is safer
  to explain it by appeal to long-run structural factors than to the decisions of
  individual agents."


