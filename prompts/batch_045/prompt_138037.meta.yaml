  have been enough on its own.


  Overdetermination is something stronger. An outcome is overdetermined when there
  are two or more causes each of which would have been sufficient to bring it about
  by itself, so that removing any one of them would have made no difference to what
  actually happened. The textbook example is the firing squad: two marksmen fire at
  the same moment and either shot alone would have been fatal. Because both shots
  are fired, neither was necessary in the circumstances — but it would be absurd to
  conclude that neither of them caused the death. So overdetermination shows that
  causation cannot simply be counterfactual dependence, since here each cause is a
  cause even though the outcome does not depend on it.


