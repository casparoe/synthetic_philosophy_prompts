  My half-formed idea is this. The standard dialectic has prioritarianism escaping
  the levelling-down objection: because the weights on welfare are positive, a pure
  level-down move (make the better off worse, change nothing for the worse off) lowers
  the weighted total, so the prioritarian never recommends it; and this is routinely
  offered as the main advantage of prioritarianism over any view that assigns value
  to equality itself. But that escape strikes me as an artifact of ranking fully specified
  outcomes with a fixed population. Once we rank policies under uncertainty rather
  than outcomes, I think a prioritarian can be pushed into a structurally identical
  embarrassment: a policy can raise the weighted sum of expected well-being while
  lowering every person''s expected well-being, and even while being worse for every
  person in every state of the world that gets positive probability. Call this levelling
  down in prospect. There is also a variant I cannot get straight: when the people
  who are worst off ex ante are not the people who end up worst off ex post, the policy
  may not even be aimed at anyone in particular, and I am unsure whether that makes
  the case more or less like the original objection.


