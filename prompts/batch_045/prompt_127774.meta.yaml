  a survival probability as a discount or as a probability weighting? (hazard-rate
  vs. time-preference node) — nice: a tree can''t separate hazard-rate discounters
  from pure time preference at the level of *observable* rates, but they differ on
  whether the "discount" should be applied to the *ex ante* expected value or modeled
  as a hazard that also changes the ranking under risk aversion. Flag unseparated
  leaves.

