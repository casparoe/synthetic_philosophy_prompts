  2. If you do: is it because later benefits are *less bad to postpone* (preference/descriptive),
  or because they genuinely *matter less*?

  3. Would you still discount if you knew with certainty the beneficiaries would exist,
  be identifiable, and be no richer than us? (strips opportunity-cost, growth, uncertainty)

