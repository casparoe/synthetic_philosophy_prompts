  succeeding. I tried to answer honestly. I looked for comparable books, and I found
  that every comparison I could make felt slightly wrong — wrong in a way I could
  specify: those were debuts and this is not, those had no archive behind them, those
  were published into a different market, those authors were not writing about a subject
  with an existing readership. Each of these was true, and each had the effect of
  leaving me with a reference class that contained my own project and nothing else.
  I notice that I have done the same thing in the opposite direction: when a friend
  of mine was deciding whether to leave a large publisher and publish independently,
  I ran through the comparable cases and found reasons to exclude each of the ones
  that had gone well, until the class contained only the ones that had gone badly,
  and I advised caution on the basis of a comparison class I would not have been able
