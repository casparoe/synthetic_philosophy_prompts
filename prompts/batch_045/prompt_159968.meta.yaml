  ---


  Hi. I work in the policy/democratic services team at a mid-sized unitary council
  (pop. ~280k, so big enough to matter, small enough that everyone knows everyone).
  Over the last couple of years we keep getting asked to run things by sortition —
  citizens'' assemblies, "lottocracy"-style panels, drawn scrutiny juries — from campaign
  groups, from officers who think it would unblock something, and from a few councillors
  who I suspect want to hand off a vote they don''t fancy taking. We currently say
  yes or no in a way that is basically vibes, and I want something I can actually
  run and defend.


  What I want from you: a decision procedure, in the order I''d run it, for a request
  that comes in. Concretely:


  - The questions, in order.

  - What counts as a good enough answer to each one (I need to be able to tell when
  someone has actually answered rather than asserted).

  - Where the procedure just stops with a no.

  - Where it hands the decision to a human/elected body because it''s a values call,
  not a factual one.

  - And be honest which steps are judgement calls with a clipboard in their hands.


  Three things I think it has to get right, which is where our current vibes approach
  keeps breaking down:


  1. Sortition seems to be doing three quite different jobs in these requests and
  I don''t think one design does all three. Sometimes it''s a mirror (the body should
  look like the city). Sometimes it''s a filter (we want people who aren''t already
  captured / who''ll actually listen to evidence). Sometimes it''s a shield (we want
  the decision made somewhere that re-election, party whips, donors and the local
  paper can''t get at it). I want the procedure to start by forcing the requester
  to say which job they want, and then to make the design fall out of that.


  2. The pre-commitment problem. Half of these requests come to us after officers
  have already picked a preferred option, or with a remit that lets the cabinet ignore
  whatever comes out. I think the procedure should kill those — a consultation that
  can''t bite is worse than none — but I want a test for it that isn''t just me disliking
  the requester.


  3. Who''s in the pool. Our instinct is a stratified sample of residents. But most
  of the hard ones have costs concentrated on people who aren''t a neat demographic
  category: a ward next to an incinerator, commuter households who don''t live here,
  under-18s, people in the city for two years. And then there''s the repeat-draw thing:
  we have maybe 40k households and if we run one of these a year, do we end up with
  a class of professional drawn citizens who come back and know how the machinery
  works? I don''t know if that''s a bug or a feature and the procedure should tell
  me.


  Constraints: I''ve got about a week per request and maybe £60k a year total, one
  analyst who can do a stratified draw if you tell them what to stratify on, no in-house
  deliberative-polling expertise. Output has to be a page a councillor will read,
  and our monitoring officer has to be able to defend it. We can run at most one real
  one a year, so the procedure also needs to tell me which requests to turn down.


  Then please run it on three, in front of me:


  (a) A petition with ~8,000 signatures asking for a citizens'' assembly to set the
  city''s 20-year transport plan — congestion charging, bus franchising, workplace
  parking levy. My gut: yes, this is exactly what assemblies are for.


  (b) A motion from a backbench councillor to have a drawn panel decide councillors''
  allowances, the rules on members'' outside interests, and whether to introduce term
  limits. This smells like a conflict of interest to me but also like the one case
  where the shield job is doing real work.


  (c) A request from a residents'' group in the ward next to a proposed waste facility:
  they want the siting decision made by a drawn panel instead of the planning committee.
  I''d quite like to say yes to these people, they''ve been badly messed about — but
  I have a feeling the procedure is going to tell me no, and if it does I want to
  know why before I have to go and tell them.


  Also: if the procedure has a branch for "same pool again next year / can we invite
  back the people who were good", spell that out, because we''re about to face it.


  Ta, and please write it in British English (organisation, favour, etc.)


