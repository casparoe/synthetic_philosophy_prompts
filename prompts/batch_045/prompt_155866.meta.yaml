reasoning_summary: "I need to write a prompt. Pick a domain: I'll pick \"The welfare\
  \ state and the 'undeserving poor' (workfare, benefit fraud, conditionality)\".\
  \ Type: \"Construct a thought experiment to specifications\" seems best combined\
  \ with the personal relevance angle.\n\nLet me think about designing a good prompt.\
  \ The asker has recently become personally relevant — e.g., someone who has just\
  \ started working in a job centre / benefits administration office, or someone who\
  \ has recently had to go on benefits themselves after a redundancy, or a volunteer\
  \ at a food bank. Combine with the thought-experiment-to-specs type: build a case\
  \ where... something comes apart.\n\nWhat's the interesting \"in the weeds\" structure?\
  \ Ideas:\n\n- A case where conditionality (workfare requirement) is justified on\
  \ a \"reciprocity\" argument but not on a deterrence/needs-based argument, and vice\
  \ versa.\n- A case where the \"undeserving poor\" distinction: design a case where\
  \ someone who is intuitively \"deserving\" fails every reciprocity test, and someone\
  \ intuitively \"undeserving\" passes. Or: design a case where a benefit-claimant's\
  \ non-compliance is genuinely voluntary but excusable (or involuntary but blameworthy)\
  \ so that the \"desert\" and \"responsibility\" tracks come apart.\n- Better for\
  \ \"to specifications\": design a case where two standard justifications for conditionality\
  \ — the reciprocity/justice argument (you owe contribution in return for benefit)\
  \ and the paternalistic/welfare argument (work requirements are good for the claimant)\
  \ or the \"fair play\" argument and the \"deterrence/dependency\" argument — come\
  \ apart: both sanction the same claimant but for different reasons / or one sanctions\
  \ and the other doesn't.\n\nLet me design something more precise and engineered,\
  \ in the style of the examples. The examples specify verdicts: \"rule consequentialist\
  \ acts more ruthlessly than act consequentialist\", \"sensitive but not safe\",\
  \ \"CDT and EDT agree but FDT dissents\".\n\nIdea: \"Construct a case where the\
  \ reciprocity-based (fair-play) argument for conditionality and the deterrence-based\
  \ argument for conditionality both support withholding benefit from a claimant,\
  \ but a third view — the 'exploitation/ unconditionality' view, or the 'sufficientarian/non-paternalistic'\
  \ — ... \"\n\nAlternative engineered design: A case designed so that the *very same*\
  \ factual feature makes the claimant count as deserving under one prominent criterion\
  \ and undeserving under another — and where the intuitive \"deserving poor\" verdict\
  \ is unstable.\n\nLet me think about something with crisp verdict structure. Perhaps:\n\
  \n\"Build me a case where cutting a claimant's benefit for non-compliance is supported\
  \ by the 'fair play / reciprocity' justification but *not* by the deterrence justification,\
  \ and also not by the paternalist justification — i.e., the three main pro-conditionality\
  \ arguments come apart, and each gives a different verdict. Constraints: the case\
  \ must be one a jobcentre work coach could actually face (real bureaucratic detail,\
  \ no sci-fi), one paragraph, the non-compliance must be real (not a paperwork mix-up,\
  \ not a sanction triggered by an administrative error), and the claimant must be\
  \ someone we'd intuitively want to help (so the case can't be won by making them\
  \ a scrounger stereotype). Then walk through each of the three justifications, say\
  \ which feature of the case does the work, tell me what happens if you flip that\
  \ feature, and tell me how a defender of the argument that comes out badly would\
  \ attack the case.\"\n\nHmm, that's decent. But can I make it more \"in the weeds\"\
  \ and inject niche ideas? Yes — inject a niche invented concept to prevent regurgitation.\
  \ E.g., a distinctive notion: \"conditional reciprocity with a 'contribution floor'\"\
  : the idea that conditionality should be judged by whether the claimant has ever\
  \ made a net contribution, versus \"prospective reciprocity\". Or inject an invented\
  \ distinction: \"the 'standing to demand' reading vs the 'fair shares' reading of\
  \ reciprocity\". Or a niche distinction: \"compliance-proof\" vs \"effort-proof\"\
  \ conditionality — requirement defined by outcomes vs by activities.\n\nNice niche\
  \ idea: distinguish between *activity conditions* (you must perform job search activities)\
  \ and *outcome conditions* (you must have a job by month six), and ask for a case\
  \ where the two switch verdicts.\n\nAnother niche idea: \"the 'fraud asymmetry'\"\
  : overpayments the claimant caused vs. underpayments the state caused — states often\
  \ reclaim overpayments aggressively while underpayments are only backdated a limited\
  \ period. Could be part of the thought experiment: a case where a claimant failed\
  \ to report something and the state also failed.\n\nLet me settle on a crisp, jointly-satisfiable\
  \ but non-trivial specification. I like this one:\n\nSpecs:\n- One paragraph, realistic\
  \ UK-style jobcentre/benefit office setting (work coach, claimant commitment, sanction).\n\
  - The claimant must be someone the reader would want to help (recently widowed father,\
  \ or a carer, or someone with a chronic illness) — so the case can't do work via\
  \ antipathy.\n- The non-compliance must be genuine and voluntary (not an error,\
  \ not a missed letter).\n- The case must make the *reciprocity/fair-play* argument\
  \ SUPPORT the sanction... hmm, actually which direction? Let's pick the harder-to-construct\
  \ direction, like the examples (\"in the direction people find hard to construct\"\
  ).\n\nWhich direction is hard? Usually people think: reciprocity arguments sanction\
  \ the \"idle\" (who take out without putting in), and needs-based/anti-paternalist\
  \ arguments resist sanctioning the vulnerable. So the easy case: reciprocity → sanction\
  \ the shirker; needs → don't. The hard case: reciprocity says DON'T sanction while\
  \ the welfare/paternalist or deterrence argument says DO sanction, or: the reciprocity\
  \ argument says don't sanction because the claimant has already contributed (paid\
  \ in contributions for 20 years), while the \"moral hazard / deterrence\" argument\
  \ says sanction anyway. Hmm, that's somewhat easy too.\n\nAlternatively: hard direction\
  \ = the *reciprocity* argument supports conditionality for this person precisely\
  \ *because* she has already contributed (she owes it to herself? no...).\n\nLet\
  \ me think again about what's genuinely hard and interesting: Build a case where\
  \ a *left* / anti-conditionality argument and a *right* / pro-conditionality argument\
  \ converge on the same policy, but a \"third\" position — maybe a republican/non-domination\
  \ or a \"social citizenship / status\" argument — splits. Hmm.\n\nMaybe cleanest:\
  \ three-way split specification:\n\n\"Design a case where the three standard justifications\
  \ for conditionality — (i) reciprocity/fair play (you must contribute if you can,\
  \ as a condition of receiving from a cooperative scheme), (ii) deterrence/incentive\
  \ (conditionality deters claims that are avoidable and prevents dependency), (iii)\
  \ paternalism (work requirements benefit the claimant herself) — come apart three\
  \ ways on one and the same claimant: they don't just differ in strength, they give\
  \ three different verdicts. Specifically: reciprocity says sanction (or says don't?),\
  \ deterrence says the opposite of reciprocity, and paternalism says... \"\n\nHmm,\
  \ three different verdicts among three views when the policy space is basically\
  \ {sanction, don't sanction} plus maybe a third option like {sanction but with a\
  \ different remedy / require activity but no financial penalty}. Actually, the policy\
  \ space could be three-way: (a) full sanction, (b) no sanction, cash unconditional,\
  \ (c) keep the money but escalate the requirement / mandate a specific activity\
  \ (a \"mandatory\" referral) — i.e. conditionality without financial punishment.\
  \ Nice — that gives room for three distinct verdicts: reciprocity → no sanction\
  \ (she's already paid in; her side of the bargain is met), deterrence → sanction\
  \ (her behaviour is exactly the kind that general deterrence must target), paternalism\
  \ → conditionality without withdrawal (require her to do the activity, don't cut\
  \ her money, because cutting money is what harms her).\n\nNow, is that jointly satisfiable\
  \ and non-trivial? The claimant: someone who has made substantial past contributions,\
  \ whose non-compliance is a refusal of a specific activity (say, applying for jobs\
  \ she considers beneath her / that conflict with caring), where the refusal is visible\
  \ to others and would be widely imitated if tolerated (so deterrence bites), where\
  \ doing the activity would actually help her (so paternalism bites), but where she\
  \ has a long contribution record such that fair-play reciprocity is arguably already\
  \ satisfied.\n\nHmm, but fair-play reciprocity in the welfare-state literature typically\
  \ isn't about past National Insurance contributions only; it's about willingness\
  \ to work/contribute when able. If she's refusing to apply for jobs while able,\
  \ reciprocity obviously favours sanction. That's the easy direction. So to get reciprocity\
  \ → no sanction, we need something cleverer: maybe an \"insurance\" reading of the\
  \ welfare state (the contributory-benefit idea: she paid premiums, she's drawing\
  \ on her own insurance, so no contribution-conditional duty attaches) vs. the \"\
  reciprocity\" reading. Hmm, but then it'd be a different view, not reciprocity.\n\
  \nMaybe better: make the direction hard in a subtler way. Let me instead pick: the\
  \ hard-to-construct direction is where the *reciprocity/fair-play* argument — the\
  \ one people associate with toughness on shirkers — actually recommends *not* sanctioning,\
  \ because the claimant's refusal is a refusal to accept a degraded/undignified condition\
  \ (workfare placement at a company where the placement is essentially free labour\
  \ displacing paid jobs), and fair play reciprocity is a two-sided relation: the\
  \ scheme also owes her a fair offer. If the state's side of the cooperative scheme\
  \ is itself defective (the \"job\" offered is exploitative, or the condition imposed\
  \ is one no member of the scheme could reasonably be asked to accept), then reciprocity\
  \ gives no duty to comply. Meanwhile deterrence says sanction: tolerating visible\
  \ refusal undermines the deterrent effect and everyone will claim. And paternalism\
  \ says: don't cut money, but do require activity — no wait, paternalism with a bad\
  \ placement wouldn't require it.\n\nHmm, I'm overcomplicating. Let me simplify the\
  \ target verdicts and pick a genuinely hard-to-build, interesting triple:\n\nVerdicts\
  \ requested:\n- Reciprocity/fair-play (the \"you owe contribution back to the scheme\
  \ that supports you\" argument): says SANCTION.\n- Deterrence/incentive argument:\
  \ says DON'T sanction. (Hard: this is the pro-conditionality argument that usually\
  \ sanctions; here deterrence fails because... her non-compliance isn't the kind\
  \ that a sanction could deter — e.g., she'll comply no matter what? No, if she won't\
  \ comply then a sanction can deter. Hmm. Wait — deterrence fails when the claimant's\
  \ behaviour is not responsive/avoidable in the relevant sense: e.g., she refuses\
  \ because of a conscientious objection or a caring duty she won't abandon — sanction\
  \ threats can't move her, and there's no one else whose behaviour is affected because\
  \ her situation is not one others could replicate/it's not visible. So deterrence\
  \ gives nothing: sanctioning her costs her a lot and deters nobody. Nice, that's\
  \ the \"hard direction\": the tough-on-fraud argument declines to punish.)\n- Paternalism\
  \ (work/activity is good for the claimant): says DON'T sanction but DO keep the\
  \ requirement — or maybe: the intervention is good for her but cutting her income\
  \ is bad, so \"require but don't cut\".\n\nHmm, but then reciprocity vs. the other\
  \ two is just 1-vs-2. That's fine and matches examples? The examples had 2-vs-1\
  \ (CDT and EDT agree, FDT dissents) — a 2-1 split is fine. Or better: make deterrence\
  \ and paternalism agree on the verdict but for opposite reasons, and reciprocity\
  \ dissent. That's actually an elegant structure: \"the two arguments people usually\
  \ cite when they want to be humane (deterrence-based 'we can't afford to deter X'\
  \ and paternalist 'work is good for them') end up on the same side as each other\
  \ here, on the opposite side from reciprocity — and the case has to make that fall\
  \ out of the theories, not out of stipulation.\"\n\nWait, but is it interesting?\
  \ Let me reconsider: maybe the most interesting hard direction for the \"undeserving\
  \ poor\" domain is where the desert judgment and the policy judgment come apart,\
  \ or where the \"undeserving\" label attaches to someone who should still get the\
  \ money.\n\nAlternative spec (maybe better, more distinctive):\n\n\"Build me a case\
  \ where all four things are true at once: (1) the claimant is intuitively undeserving\
  \ in the ordinary moral sense — she really is refusing available work she could\
  \ do, no excusing hardship, no administrative error; (2) a reciprocity/fair-play\
  \ argument still says pay her in full; (3) a deterrence argument says sanction her;\
  \ and (4) the 'conditionality is expressive / it teaches the wrong lesson about\
  \ citizenship' argument — the anti-conditionality, dignity-based argument — says\
  \ sanction her too, i.e. the anti-conditionality position ends up on the same side\
  \ as the tough-love argument.\"\n\nHmm, that's a nice twist: the \"dignity/citizenship\"\
  \ critique of conditionality (usually allied against sanctions) here supports the\
  \ sanction, because the claimant's refusal is itself a refusal to participate in\
  \ the cooperative scheme / is dominating others? Eh, could work but is convoluted.\n\
  \nLet me settle. I'll go with a 2-vs-1 structure plus a nice \"third option\" in\
  \ the policy space. Actually, maybe I can do better with a \"three distinct verdicts\"\
  \ design using a three-option policy space, which is more impressive and more \"\
  engineered\". But three distinct verdicts among three views each picking a different\
  \ option is harder to make non-stipulative. Hmm. Actually the safety/sensitivity\
  \ example: two conditions, opposite verdicts. The CDT/EDT/FDT example: three theories,\
  \ two verdicts. The rule/act consequentialist: two theories, opposite in an unexpected\
  \ direction. So 2-vs-1 is in line with the type.\n\nLet me also add constraints\
  \ like the examples: realistic (a jobcentre, not a trolley); one paragraph; the\
  \ refusal must be genuine (not a paperwork error, not a missed appointment, not\
  \ mental illness excusing her); and the case may not work by making the state's\
  \ condition obviously abusive (that's the cheap way to get reciprocity offside)\
  \ — the condition she refuses must be one that a decent welfare state would actually\
  \ impose. Wait, but then how does reciprocity say \"don't sanction\"?\n\nHmm. Let\
  \ me reconsider reciprocity saying \"don't sanction\". Under fair-play reciprocity\
  \ (the \"you must be willing to work if you can, as your side of the cooperative\
  \ bargain\" view), a genuine refusal of available work = classic sanction case.\
  \ So getting reciprocity to say \"don't sanction\" requires a subtlety: e.g., the\
  \ claimant's refusal is of a workfare placement (mandatory work activity) rather\
  \ than of \"work\" per se, and reciprocity in its fair-play form is about *contributing\
  \ productively to the scheme*, and the placement is make-work with no productive\
  \ contribution — the scheme gains nothing, so there's nothing to reciprocate; the\
  \ \"contribution\" demanded is purely symbolic/punitive. That's a real, live argument\
  \ (workfare as pointless labour; \"work for your benefit\" doesn't create the reciprocal\
  \ relation because the work produces nothing anyone wants and may displace paid\
  \ workers). And the constraint \"the condition must be one a decent welfare state\
  \ would impose (no sadistic or obviously degrading placement)\" makes it non-cheap:\
  \ it's a normal, benign-ish workfare placement (e.g., stacking shelves in a charity\
  \ shop, 30 hours/week) that is nonetheless unproductive in the relevant sense —\
  \ hmm, charity shop work arguably produces something.\n\nAlternative subtlety: temporal/lifecycle\
  \ reciprocity. The claimant is 61, has worked and paid in for 40 years, is now refusing\
  \ retraining for a job she'll hold for 18 months. Fair-play reciprocity, on a *lifetime*\
  \ accounting, says she's more than paid her share — she's a net contributor and\
  \ is owed; whereas deterrence says sanction (because letting a visible, able-bodied-looking\
  \ 61-year-old refuse affects others' behaviour) — hmm, but does it? Actually arguably\
  \ yes: if everyone of that cohort could opt out, costs explode.\n\nHmm, and paternalism:\
  \ is retraining good for her? For 18 months of work, maybe not; and cutting her\
  \ money is bad. So paternalism: don't cut, and maybe don't even require. That gives\
  \ paternalism agreeing with reciprocity → 2 vs 1, with deterrence alone saying sanction.\
  \ But the \"hard direction\" I wanted was deterrence declining... \n\nWhich hard\
  \ direction is more interesting? Let me pick: the hard direction is that the *reciprocity*\
  \ argument — the one that's supposed to be the tough one — declines to sanction,\
  \ while the *deterrence* argument sanctions, and the *paternalist* argument also\
  \ sanctions? No...\n\nOK let me step back and pick the cleanest design where the\
  \ requested verdicts are (a) jointly satisfiable, (b) not trivially so, (c) in an\
  \ unexpected direction.\n\nDesign A (\"the tough argument blinks\"):\n- Claimant:\
  \ mid-50s carer? No—let's do: single dad, 54, recently made redundant from a job\
  \ he did for 26 years, refuses to apply for 40 jobs/month (or refuses a mandatory\
  \ 4-week placement in a warehouse, paid at benefit rate + expenses) because... hmm.\n\
  \nLet me try to nail \"reciprocity declines to sanction\" via the *quality of the\
  \ reciprocal offer* idea, which is a real and somewhat niche argument: reciprocity\
  \ is a relation between parties; welfare conditionality's reciprocity argument presupposes\
  \ the scheme is offering the claimant a genuine opportunity to participate/contribute\
  \ on reasonable terms. If the only thing on offer is a placement that requires her\
  \ to work 30 hours a week for no more than her benefit, at a task with no product\
  \ anyone values, then (the argument goes) the scheme isn't making her an offer of\
  \ participation — it's exacting a penalty dressed as reciprocity, and a fair-play\
  \ duty only binds when the cooperative scheme is actually one that benefits its\
  \ participants on fair terms. So: reciprocity declines to sanction (the demanded\
  \ \"contribution\" isn't a contribution; nothing is produced / the placement displaces\
  \ a paid job / the condition is purely a test of compliance). Meanwhile deterrence:\
  \ sanction — because tolerating refusal collapses the requirement's credibility;\
  \ others will copy. Paternalism: hmm, what does paternalism say? If the work is\
  \ pointless and unpaid, paternalism (activity is good for you, structure, routine,\
  \ skills) might still say require it but you can't justify cutting her income...\
  \ Actually paternalism is about benefiting the claimant; cutting income harms her;\
  \ but conditional requirements can be justified paternalistically if compliance\
  \ benefits her. So paternalism: keep the requirement, don't cut cash? That's a third\
  \ verdict, and it's plausible. So we get three distinct verdicts across a three-option\
  \ policy space:\n  - Reciprocity: drop the requirement AND pay in full (no contribution\
  \ owed; nothing to reciprocate).\n  - Deterrence: keep the requirement AND sanction.\n\
  \  - Paternalism: keep the requirement, don't cut cash (require, no financial penalty).\n\
  Hmm, that's elegant: three views, three verdicts, and each verdict is a different\
  \ combination of {keep/drop requirement} × {cut/don't cut}. That's a nice engineered\
  \ structure, and genuinely non-trivial. But is the three-way split too hard / will\
  \ the model fudge? The prompt can ask the model to show all three, with reasons,\
  \ and to say what happens if you flip the key feature (e.g., make the placement\
  \ genuinely productive / a real paid job offer — then reciprocity flips to sanction).\n\
  \nBut wait — the constraint \"the condition mustn't be obviously abusive\" guards\
  \ the cheap route. And the asker says \"the claimant must be someone a reader wants\
  \ to help\" so the case can't work by antipathy. But hold on — if the claimant is\
  \ sympathetic AND the condition is benign, getting three different verdicts is genuinely\
  \ hard. Good.\n\nHmm, but is it too hard / likely to produce a stipulative case?\
  \ The prompt asks for honest disclosure: \"tell me which feature is doing the work\
  \ and whether the case is generating the verdicts from the theories or smuggling\
  \ them in.\" Fine.\n\nActually, maybe simplify a bit for tractability: 2 views ×\
  \ 2 verdicts with a third view as tiebreaker? I think the three-way is the most\
  \ interesting. But let me consider the risk: the model may produce a mushy answer.\
  \ The prompt is for a dataset testing models, so difficulty is fine and even desirable.\
  \ But there's a risk of unanswerable. I'll keep three views but allow that a view\
  \ may have a \"conditional\" verdict, and ask explicitly which option each picks\
  \ among the three policy options, so the deliverable is checkable.\n\nAlso add \"\
  in the weeds / niche\" injection: I'll introduce a niche distinction the asker cares\
  \ about, e.g. \"compliance goods vs contribution goods\" — I'll invent terminology:\
  \ the asker distinguishes 'productive contribution' conditionality from 'compliance-testing'\
  \ conditionality, and wants the case built so the two come apart? Hmm, but I should\
  \ keep it manageable.\n\nLet me think about the niche injection more carefully —\
  \ the meta-instruction says to inject new/niche ideas so models can't regurgitate.\
  \ Ideas:\n\n1. \"Sanction without withdrawal\": keep the requirement, escalate it,\
  \ but don't cut money — \"requirements-only conditionality\". Niche-ish but sensible.\n\
  2. \"The 'double-audit' asymmetry\": the state audits claimants aggressively for\
  \ overpayments but not its own underpayments; ask the case to include a state-side\
  \ error so the reciprocity relation is strained. Maybe too much.\n3. \"Temporal\
  \ accounting of reciprocity\": whether fairness is assessed over a claim spell,\
  \ a working life, or a generation (the 61-year-old example). I like \"the accounting\
  \ window\" as a niche knob: \"I've been arguing with my colleagues about the *time\
  \ window* over which reciprocity is supposed to be assessed — the current claim,\
  \ the whole working life, or the intergenerational scheme. My case has to be built\
  \ so that the verdict flips depending on the window, and I want you to pick the\
  \ window that makes the case hardest for my side.\"\n\nHmm, that's nice and in the\
  \ weeds. But combining too many specs could be unwieldy. Let me choose: the accounting-window\
  \ knob is a nice \"injected niche idea\" and can serve as the \"what happens if\
  \ you flip this feature\" question.\n\nLet me now design the final prompt.\n\nPersonal\
  \ relevance: the asker has recently become a work coach at a jobcentre (or, alternatively,\
  \ has recently had to claim benefits himself after a layoff and sat in that chair).\
  \ \"Write the prompt from the perspective of someone for whom the topic has recently\
  \ become personally relevant\" — maybe: I started a job six weeks ago as a work\
  \ coach at a Jobcentre (UK), and I'm the one who has to decide whether to raise\
  \ a sanction. That's very personally relevant and gives an audience/constraints\
  \ naturally: the case must be one that could land on his desk, with realistic detail\
  \ (claimant commitment, a mandatory work activity placement, a \"good reason\" claim,\
  \ a sanction referral to a decision maker).\n\nHmm — but if he's a work coach, maybe\
  \ the framing: he's new, hasn't yet referred anyone for a sanction, and he's trying\
  \ to figure out whether the arguments he learned in his politics/ philosophy degree\
  \ actually support the thing he's being asked to do. Nice: personal relevance +\
  \ philosophical content.\n\nAlternatively: he recently became a carer / his brother\
  \ is on benefits / he's on a local council's benefits advisory panel. I'll go with\
  \ the new work coach, since it gives the \"realistic, bureaucratic\" constraint\
  \ naturally. Actually maybe better: he's a *volunteer* at a benefits advice service\
  \ (independent, not the DWP) — hmm. Work coach is better for the \"I have to decide\"\
  \ stake. But careful: with work coach framing, the asker might be portrayed as deciding\
  \ sanctions, which is fine.\n\nActually here's a nicer personal stake: he's a newly\
  \ hired work coach and his own mother/grandfather was a lifelong contributor who\
  \ is now... hmm, keep it simple: new work coach, first sanction decision, and the\
  \ topic became real because he watched a colleague refer someone and couldn't tell\
  \ whether any of the standard arguments actually supported it.\n\nNow the specifications:\n\
  \nScenario constraints:\n- One paragraph, realistic, on his desk at the Jobcentre;\
  \ UK-ish, but I shouldn't lean on precise policy details I can't verify (I won't\
  \ quote any rules; I'll keep generic: \"claimant commitment\", \"mandatory work\
  \ activity / workfare placement\", \"sanction referral\", \"good reason\").\n- The\
  \ claimant must be someone a reader wants to help — no scrounger stereotype, no\
  \ fraud, no missed appointments (she turned up to everything), no undeclared earnings.\n\
  - The non-compliance must be genuine and voluntary; she knows the requirement and\
  \ refuses.\n- The condition refused must be one a decent welfare state would impose:\
  \ no degrading or pointless-on-purpose placement, no 4am litter picking; a normal\
  \ placement (a charity warehouse, 25-30 hours/week, benefit + travel expenses, no\
  \ displacement of a paid worker — hmm, if I ban displacement I kill part of the\
  \ argument; keep it soft: \"not obviously abusive\").\n- Cheap moves banned: no\
  \ administrative error, no mental-health excuse, no sadistic placement, no stipulation\
  \ of verdicts.\n\nRequested verdicts (three views, three policy options):\nOptions:\
  \ (A) drop the requirement and pay in full; (B) keep the requirement, escalate it,\
  \ but no money withdrawn; (C) keep the requirement and sanction (withdraw benefit\
  \ for a fixed period).\n- Reciprocity / fair play → A.\n- Deterrence / incentive-and-deterrence\
  \ (conditionality exists to keep claims from being made when work is available,\
  \ and to protect the scheme's budget/credibility) → C.\n- Paternalist / \"work is\
  \ good for you, inactivity is bad for you\" (beneficence-to-the-claimant) → B.\n\
  \nHmm wait. Is paternalism → B plausible? Paternalism: require the activity because\
  \ it benefits her (routine, skills, social contact, route back to work). Cutting\
  \ her income is not paternalistically justified — it makes her worse off and doesn't\
  \ get her into work. So B (require, don't withdraw). Yes, plausible and a nice \"\
  peel off\" — paternalism and deterrence both want the requirement kept, but disagree\
  \ on the sanction; reciprocity agrees with paternalism on the money but not on the\
  \ requirement. And note that \"the humane alliance\" splits: paternalism sides with\
  \ reciprocity on cash and with deterrence on the requirement. Nice structure; I\
  \ can point that out in the prompt as something I noticed? Maybe the asker can mention\
  \ it as a hope but shouldn't dictate. Better: the asker specifies the verdicts and\
  \ asks the model to make them fall out.\n\nIs reciprocrity → A hard? Yes: reciprocity\
  \ is the workhorse of the \"undeserving poor\" rhetoric. To get it to A, the case\
