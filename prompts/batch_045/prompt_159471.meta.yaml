  ---


  I teach a film-and-philosophy seminar and I am building a session on behavioral
  criteria for mind, using Ridley Scott''s Blade Runner as the case study. I want
  a reading of the film, not a checklist of parallels, and I want it built around
  a test of my own devising rather than the one everyone reaches for.


  The test — call it the Attrition Test — replaces the single conversation with months
  of unscripted, low-stakes coexistence, and asks not whether the candidate is momentarily
  indistinguishable from a person but whether its behavior has the right shape over
  time. It counts as evidence of mind: selective and failing attention (boredom, distraction,
  refusals to answer); habits and private references that no one who had not shared
  the candidate''s days could predict; characteristic errors — misrememberings that
  track the candidate''s own past rather than the facts; the capacity to be surprised
  by, or to disown, its earlier self; and a standing incuriosity about its own workings,
  such that being asked to explain itself is met with something other than articulate
  self-report. Notice the consequence I am betting on: a system engineered to maximize
  indistinguishability at every instant would be expected to fail, because it would
  stay too attentive, too consistent, and too articulate about itself. So the test
  is still behavioral — it looks only at what the candidate does — but its criteria
  are irreducibly diachronic, and it appears to penalize exactly the competence that
  passing the classical imitation game rewards.


  I want two things done with it. First, the philosophy: is this a genuine behavioral
  criterion with a longer timescale, or has it smuggled in a historical or etiological
  condition — that the responses be caused by the right kind of biography — of the
  sort a behavioral test was supposed to do without? That is the charge I expect,
  and I want it answered rather than conceded.


  Second, the reading. Run the Voight-Kampff sequences, the Rachael scenes, and Roy
  Batty''s last acts through the Attrition Test and tell me who passes and who fails,
  and why: Rachael, whose memories are someone else''s and whose life is short; Roy,
  whose whole biography is a few years and who closes it with a speech of extraordinary
  self-awareness; Deckard, who is bored, drinks, and offers almost nothing about himself.
  Does the film''s own argument turn on the claim that what the replicants lack is
  not a behavior but a history — a childhood, a mother, photographs — and is that
  the film''s position or only Deckard''s? Does the fact that the test is administered
  under threat of death, and that one examinee answers it with a gun, count as a point
  about the ecology of any behavioral test that the philosophical debate has failed
  to make? And where does the film resist the reading? The scene most audiences take
  as the strongest evidence of mind is precisely the one my test should treat with
  suspicion, and I would rather you said so than smoothed it over.


  A few constraints. Do not reduce the film to an illustration of a position — I can
  get that anywhere. Say what the film does to the question that argument alone does
  not. Do not settle whether Deckard is a replicant; tell me instead what turns on
