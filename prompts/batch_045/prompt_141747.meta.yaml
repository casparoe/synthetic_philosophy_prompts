  The key distinctive features to carve:

  - Not vagueness/ambiguity: rules are clear.

  - Not a conflict about the facts.

  - Not resolved by overriding or by demoting to a rule of thumb or by repair/legislation.

  - Both remain in force *for the same agent at the same time*.

  - The practice contains the conflict: people don''t go on to derive arbitrary conclusions
  or treat everything as permitted.

  - There''s a positive, repeatable procedure — "choose, then account" / "proceed
  and record the collision" — which is not the same as "anything goes".

  - The conflict is not merely epistemic (they don''t say "we don''t know which rule
  applies").


