  The structure I have in mind is a repeated card game. Each round the world is in
  one of two hidden states, each participant gets a private, independent, imperfect
  signal of which, and any participant may unilaterally "launch" — an action whose
  gains and losses are shared by everyone. If nobody launches, everyone gets the status
