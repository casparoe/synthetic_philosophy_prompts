  \ compensating the untalented beyond the difference principle). So a person who\
  \ holds \"difference principle\" and \"skeptical of luck egalitarianism\" — apparent\
  \ tension that dissolves: Rawls explicitly distinguishes his view from compensatory/redress\
  \ views. Good: that's the dissolving apparent tension.\n\nGenuine tension B: Holding\
  \ that the veil of ignorance is meant to be a device that models fairness/moral\
  \ equality (i.e., not merely a bargaining model), while also holding that the parties'\
  \ choice is just instrumental rationality (mutually disinterested, maximin as rational\
  \ choice) — the classic tension: if the parties are purely self-interested and maximin\
  \ is just a decision rule under uncertainty, the result depends on a controversial\
  \ risk-aversion assumption; but if you say \"maximin is the moral reading, it's\
  \ what equals would choose,\" then you're smuggling in egalitarianism rather than\
  \ deriving it. That's a real, non-obvious tension: the \"derivation\" of the difference\
  \ principle is supposed to be a rational-choice derivation, but to get maximin you\
  \ need a premise that's basically already egalitarian — and if you accept that premise\
  \ as a moral one, the veil does no work; if you insist on the thin rational-choice\
  \ reading, the argument fails (e.g., expected utility maximization with equal probabilities\
  \ gives something closer to average utility, Harsanyi's objection). Nice — this\
  \ is a real tension though fairly well-known to specialists. The journalist wouldn't\
  \ know.\n\nAnother genuine tension: Holding (a) the parties behind the veil know\
  \ general facts about psychology/economics/sociology (Rawls says they know general\
  \ facts, laws of economics, etc.) and (b) that the difference principle is what\
  \ they'd choose; but also holding (c) that incentives to the talented matter and\
  \ inequality is needed to motivate productivity — a journalist writing about inequality\
