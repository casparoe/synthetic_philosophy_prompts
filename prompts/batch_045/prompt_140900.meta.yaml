  \ but you know general economic facts, whether inequality raises the worst off's\
  \ position depends on empirical claims (about incentive effects) that are highly\
  \ contested; and more importantly, the \"general facts\" clause is unstable — if\
  \ you let in enough sociology, the parties would be choosing among whole regimes\
