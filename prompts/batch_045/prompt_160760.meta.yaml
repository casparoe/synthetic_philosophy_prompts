  it teach a comprehensive curriculum, or that it be secular — and, again in most
  places, will not fund it.

  - If the instruction happens in a district school, the state regulates content heavily:
  standards, assessments, teacher certification, and a required curriculum. Yet here,
  and only here, parents are given a partial veto over exposure — in many states a
  parent may withdraw a child from particular units (sex education is the standard
