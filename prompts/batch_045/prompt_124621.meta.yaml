  I''m a high school senior in a philosophy elective, and we recently read part of
  Nietzsche''s On the Genealogy of Morality — the essay where he argues that our concept
  of guilt grows out of the much older, much more material relation between a creditor
  and a debtor, and that punishment began not as a response to blameworthiness but
  as a kind of payment: the creditor was entitled to compensation, and if he could
  not be paid in money he could be paid in the suffering of the person who owed him.
  I found the story hard to assess, so I want to try it against something concrete
  instead of arguing about it in the abstract.


  Here is the thing I keep going back and forth about. In American law, if you cannot
  pay what you owe, you can usually file for bankruptcy and have most of those debts
  discharged; the whole institution is framed as giving you a fresh start, and the
  black marks on your credit report stop counting after a set number of years. But
  if you break the criminal law, you cannot discharge your sentence by paying for
  it, you cannot get it erased just because you have learned your lesson, and the
  record of it can follow you into job applications for the rest of your life. And
  yet the two systems are not cleanly separated the way that suggests: minor offenses
  are routinely punished with nothing but a fine, so money does buy you out at the
  bottom end; people who cannot pay fines or fees can end up before a judge again;
  and courts order offenders to pay restitution to victims on top of any prison time,
  which looks almost like an invoice for the harm.


