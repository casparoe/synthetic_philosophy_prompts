  - Rule C: reject on grounds of "fanaticism-blocking": ignore probabilities below
  some threshold, or use a "lexical threshold" cutoff.

  - Rule D: a "decision-theoretic" rule: count only causal efficacy you can verify;
  reject acausal/blackmail (refuse to reward threats — a "no-blackmail" / timeless
