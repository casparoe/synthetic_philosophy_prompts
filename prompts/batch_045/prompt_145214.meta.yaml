  Hey — looking for help with something that''s turned into more of a conceptual mess
  than I expected.


  I''m a 4th-year philosophy PhD student (social epistemology, sort of) and I somehow
  ended up maintaining the prediction market for our psych department''s internal
  replication project: every couple of weeks we list a contract that pays $1 if a
  given study replicates, ~15 people in the department trade small real-money stakes
  in a continuous double auction, everyone can see the order book. My job is basically
  to keep it running and to tell the PI whether the prices are worth anything as forecasts.


  Two things are bugging me.


  First, volume is tiny — most weeks two or three trades total — and basically all
  of it is one guy, Dan, a first-year who trades constantly, quotes both sides of
  the book, and is, as far as I can tell, down money overall since we started. When
  I asked him about it he said he isn''t claiming to know anything, he''s just "taking
  the other side of whatever anyone wants" and that someone has to.


  Second, one of the contracts is on whether our own lab''s 2019 finding replicates,
  and two people who are authors on that paper keep pushing that price down — betting
  against their own result. I don''t think they''ve suddenly decided it''s false.
  I think they''re on the job market and want to get paid if it fails. So there''s
  a chunk of the trading that clearly isn''t anyone''s belief about the world.


  A visiting econ guy gave me an argument that I think is supposed to be knock-down
  but I can''t reconstruct it: he said basically that if two people start from the
  same public information and neither is confused, neither can expect to profit from
  trading with the other, so the only trades you should expect are mistakes, gambling,
  or people who need to offload risk — and since Dan is my entire market, the price
  isn''t aggregating anything, it''s just Dan''s opinion, and I should either shut
  it down or report prices as "Dan''s view". He mentioned a name for this but I forgot
  it.


  Someone else suggested a fix: scrap the order book and let anyone move the current
  price whenever they want, paying or receiving according to some scoring rule, with
  the department eating the (capped) loss — so there''s always a counterparty and
  volume should go up.


  So: is the visitor right that thin volume plus one dominant trader means the price
  carries no information? Is Dan a liquidity provider or a noise trader, and does
  the fact that he''s losing money tell me which? Does hedging demand from the authors
  make the price wrong, or just make it mean something else? And would the scoring-rule
  thing actually give me something epistemically better, or just more numbers? I have
  to write the PI a recommendation by the end of the month and I''d rather not hand
  him something that sounds fine and is empty.


