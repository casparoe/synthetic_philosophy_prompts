  Actually a nice "proves too much" on the hole argument: The argument can be reconstructed
  as: (1) If substantivalism is true, then two models differing by an active diffeomorphism
  in the hole represent distinct physically possible worlds. (2) Determinism requires
  that same initial data on a slice → same world. (3) Since these models agree outside
  the hole but differ inside, substantivalism + general covariance → indeterminism.
  (4) Indeterminism is unacceptable (or at least not to be bought from a metaphysical
  thesis). (5) So substantivalism is false. But then: by parity, the same argument
  applies to any theory with a symmetry group acting on its "absolute objects" — e.g.,
  Newtonian mechanics with absolute space: translation symmetry means you can''t determine
  absolute position, so... hmm, that doesn''t quite prove too much.


  A better "proves too much": The modern "Leibniz equivalence" move — identifying
  diffeomorphic models — is standardly used against substantivalism. But if identifying
  models that differ by a symmetry is legitimate for the hole argument, then in Newtonian/Galilean
  spacetime the shift symmetry... Actually there''s a known worry: does the hole argument
  generalize to any local spacetime symmetry, implying that spacetime points can''t
  have primitive identity in any theory with such symmetries — including e.g. electromagnetism''s
  gauge symmetry in the "gauge" sense? So the "proves too much" version: if you accept
  that the hole argument refutes manifold substantivalism, then you must also accept
