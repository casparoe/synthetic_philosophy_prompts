  I write about the ethics of artificial systems — specifically the question of which
  of them, if any, we might owe something to — and a colleague has handed me an argument
  I cannot find a way out of. I''d like your diagnosis.


  The view I want to end with has three parts, and I''d rather give up almost anything
  else than give up any of them:


  (A) Substrate neutrality: if a computation matters morally, it matters in virtue
  of its abstract causal structure — the pattern of state-transitions and their relations
  — and not in virtue of what realizes it. Two systems that implement the same computation
  equally well therefore have the same moral status, whatever they''re made of.


  (B) Implementation is a fact: for any physical system and any computation, there
  is a determinate answer to how well the system implements that computation, and
  the answer is not fixed by our choices of description, our explanatory interests,
  or how convenient it would be to describe the system one way rather than another.


  (C) Non-vacuity: some artificial systems could turn out to be moral patients, and
  this is the kind of thing we could in principle get right or wrong rather than decide.


  The argument I''ve been given — call it the Profligacy Argument — is meant to show
  that these cannot all be true...


  Steps:


  (1) [from A] Moral status supervenes on implemented computation, so any difference
  in moral status between two systems must correspond to a difference in what they
  implement or how well they implement it.


  (2) Implementation is not mere correlation of state-histories. A system implements
  C only if its states can be mapped onto C''s states in a way that is systematic
  and that survives counterfactual variation: perturb the system''s state (or its
  input) along some dimension, and the successor state must be the one C prescribes.
  Call the proportion of the relevant intervention-space over which the mapping holds
  the system''s modal fidelity with respect to C. [This is meant to answer the familiar
  triviality result: for any system with enough discriminable states and any finite
  automaton, you can gerrymander a mapping that matches on the actual run; such mappings
  have low modal fidelity, since they break under almost any intervention.]


  (3) Modal fidelity is graded, and there is no natural threshold above which a system
  "really" implements C. Any finite system degrades under sufficiently demanding interventions:
  heat it, cut it, feed it inputs outside its design envelope, and the mapping fails.
  Conversely, under a sufficiently narrow and carefully chosen intervention-space,
  almost any mapping looks robust. What counts as the relevant space of interventions
  — the grain at which we test, the class of perturbations we allow, the timescale
  over which we evaluate — is not settled by the system itself.


  (4) Which intervention-space is relevant is settled by what we want the ascription
  for: predict, control, explain, design. Implementation-ascriptions are the currency
  of engineering and cognitive science, and like any such currency their grain is
  set by the job. So, by (2) and (3), how well a system implements C is a fact relative
  to a scheme of description.


