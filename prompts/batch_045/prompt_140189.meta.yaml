  I''m writing a paper on whether guilt or shame is the better moral emotion and whether
  a culture can deliberately shift the balance, and I''d like an audit of the position
  I''ve assembled before I try to defend it. Here are the pieces:


  (1) The difference between guilt and shame is a difference in intentional object:
  guilt takes what I did, shame takes who I am — and I want to insist this is a difference
  in the emotions themselves, not merely in the judgments or beliefs that happen to
  accompany them.


  (2) After a discrete, remediable wrong, guilt is the emotion an agent should feel:
  it targets the act, leaves the agent''s standing intact, and points at repair.


  (3) Shame is the better emotion for a community to cultivate, because it ties people
  to the regard of others and makes morality a question of who you are rather than
  a ledger of transactions.


  (4) A culture can deliberately shift which of the two predominates, through childrearing
  and institutions, and ours should shift somewhat toward shame. The concrete proposal
  I want to defend is a "regard ceremony" — a standing, non-adversarial practice in
  which someone who has done wrong accounts for it before the small set of people
  whose regard they depend on, rather than before an abstract rule or an official.


  (5) Shame''s functional profile is the profile of status-loss and appeasement: it
  is the affect of being lowered in the eyes of others, which is why it so readily
  shows up as hiding, deflection, and sometimes aggression against whoever witnessed
  it.


  (6) Shame does not require an actual audience; the imagined regard of someone whose
  judgment you care about will do.


  (7) There is a species of shame I want to keep, which I''ll call "capacity shame":
  shame at not having become the person you could have been — the wasted decade, the
  unused talent. It is felt alone, it need not involve anyone''s disapproval, it violates
  no rule and there is nothing to repair, so guilt has no foothold in it. But it seems
  to me to be a real emotion and sometimes an apt one.


