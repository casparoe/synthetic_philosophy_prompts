  (a) cannot be proved in the strict mathematical sense. The reason is that the left-hand
  side is informal: ''effectively computable'' is an intuitive notion, so you can''t
  have a mathematical proof that a formal class coincides with it, because a proof
  needs precise definitions on both sides. What we have instead is strong evidence:
  all the independent attempts to formalize the intuitive notion — Turing machines,
