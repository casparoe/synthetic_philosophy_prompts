  "Q3. In this course we''ve separated three claims that often get run together:


  (a) MAT (the ''mathematical'' or ''informal-to-formal'' thesis): every function
  that is effectively computable — i.e. computable by following a finite, explicitly
  stated, mechanical procedure — is computable by a Turing machine.


