  computing device can be simulated by a Turing machine with only polynomial overhead
  in time — so Turing machines are the right model not just of what''s computable
  but of what''s feasibly computable.


  (i) Say, for each of (a)–(c), what kind of claim it is and what would count as evidence
  for or against it. Is any of them the kind of thing that could be proved? If one
  of them can''t be proved, say why, and say what it would even mean for it to be
  false.


  (ii) Suppose someone builds a ''Zeno machine'': a device that carries out its first
  step in 1/2 a second, its second in 1/4, its third in 1/8, and so on, so that after
  one second it has completed infinitely many steps, and it lights a lamp if and only
