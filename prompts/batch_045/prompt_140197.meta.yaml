  as the crux of creativity: the fantasy, which I take him to be setting up in order
  to qualify it, of a device with a large bank of labelled dials, where having an
  idea is a matter of exploring a space of possibilities by turning them. My friend''s
  claim was that the fantasy isn''t really refuted at all, only relocated: any modern
