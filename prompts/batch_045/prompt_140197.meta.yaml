  them, and the interesting question — how you find your way around such a space —
  is one that exploration plus a learned representation answers well enough. My reply
  was that the hard part was never turning the dials but deciding which dials there
  are and what turning them means, and that this can''t itself be a matter of turning
  dials without either circularity or a regress.


