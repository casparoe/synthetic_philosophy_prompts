  ---


  I teach a seminar on moral progress, and I keep running into the same picture doing
  a lot of quiet work, so I want an audit of it rather than another rehearsal.


  The picture: moral concern as a circle with the self (or family, or tribe) at the
  centre, expanding outward over history — Singer gave it its canonical form in The
  Expanding Circle (1981), and Pinker leans on the same image in Better Angels — and
  my colleague in political theory used it last week in a talk about AI welfare. In
  her hands it does three jobs: (a) it makes moral progress look like a real, measurable,
  directional thing rather than a change in fashion; (b) it identifies the engine
  — reason universalizing our parochial altruistic impulses; and (c) it licenses an
  extrapolation: the circle has gone family → tribe → nation → all humans → animals,
  so it is now moving, and should be helped to move, toward digital minds, with sentience/being-affected
  as the natural stopping point.


  I want the mapping made explicit before I decide whether to use it myself. What
  is the centre, what is the radius (what distance metric — kinship? similarity? causal
  or social proximity?), what is the circumference, what does "inside" mean — full
  equal consideration, or something weaker — and what plays the role of whatever is
  pushing the boundary out? A table of correspondences would be ideal.


  Then the places it breaks, and — this is the part I actually care about — which
  of those breaks matter for the three jobs above and which are harmless. The ones
  I already have notes on:


  1. One metric. A circle is defined by a single distance from a single centre, so
  everything sits on one ordered line of nearness. But the things we are supposed
  to be admitting — a chimp, a distant stranger, a person in 2300, a river, a digital
  mind — don''t look like they''re ranked on one dimension at all. Is the metric an
  assumption the picture smuggles in, and does job (c) depend on there being one?


  2. Dilution. A student of mine raised this and I haven''t got an answer: nothing
  in the geometry says the interior gets *more* concern rather than the same concern
  spread over more beings. Area grows as the square of the radius but so does the
  population of the interior, so per-capita concern could be falling while the circle
  looks bigger — the widening-beam / butter-over-more-bread reading. If that reading
  is compatible with the picture, the picture can''t do job (a): "the circle got bigger"
  wouldn''t settle whether anything improved, only whether it was spread thinner.
  (And note the circle is also naturally read gravitationally — concern fading with
  distance — which seems to cut against the equal-consideration conclusion the circle
  is usually wheeled out to support.)


  3. Convexity and binary membership. Circles have no holes and no partial membership.
  Actual concern is patchy — pets and cetaceans yes, insects mostly no; fetuses yes,
  distant future people mostly no — and graded rather than on/off. Is that a fatal
  disanalogy or does the picture only ever need the frontier?


  4. The centre. In the image the self sits still while the boundary moves. But the
  thing at the centre has itself changed — thinner selves, collective and corporate
  agents, standing granted to non-persons — and for digital minds there may be no
  stable centre at all, plus they can be copied, so "how many beings are inside" can
  explode overnight. Does the extrapolation to digital minds survive that?


  So: does the conclusion survive once the disanalogies are in? I''d like a verdict
  separately for (a), (b) and (c), since I suspect the picture can carry one of them
  and not the others. And if it can''t carry them, is there a better analogy — I''ve
  been toying with moral standing as expanding *jurisdiction* (standing, personhood,
  precedents accreted case by case) rather than a circle, which gets the patchiness
  and the institutional mechanism right, but I don''t know what it loses. Tell me
  what a better image would have to preserve.


