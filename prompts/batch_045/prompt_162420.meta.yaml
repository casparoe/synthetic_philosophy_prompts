  "maximize total utility including animals" as a decision procedure for us; it''s
  often read as: with respect to animals, no side constraints bar using them, and
  their welfare is to be weighed (in a way that needn''t be maximizing — could be
  a threshold/sufficientarian or a constrained view). (2) Also Nozick''s view is explicitly
  tentative/hedged rather than a policy he derives; and (3) even a utilitarian-about-animals
  view doesn''t automatically entail "worst thing going on / bulk of moral effort"
  without empirical assumptions about magnitudes and about cause prioritization; and
  (4) treating "utilitarianism for animals" as a first-order verdict on factory farming
  ignores that Nozick''s own framework is rights-based, so there''s no simple aggregation
  across the two domains — there''s a question about how the two "regimes" combine
  (lexical priority? separate spheres?). That''s a genuine in-the-weeds conceptual
  issue.


