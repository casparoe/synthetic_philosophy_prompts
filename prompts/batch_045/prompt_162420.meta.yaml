  The false presuppositions: (1) that "utilitarianism for animals" is a complete account
  of our duties regarding animals, when it says nothing about how much weight to give
  animal suffering, and doesn''t by itself entail any particular ranking of causes;
  crucially, the formula is about the *structure* of the constraint (whether side-constraints
