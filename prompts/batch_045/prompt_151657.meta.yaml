  Key conceptual work: the difference between counterfactual dependence and interventionist
  difference-making:

  - Counterfactual: Y would not have happened (or would have been different) if X
  hadn''t. Requires possible worlds / closest worlds / similarity metrics; problems:
  overdetermination, preemption, symmetric dependence, non-occurrence of causes, backtracking
  counterfactuals ("if the barometer hadn''t dropped, the storm wouldn''t have come"
  — false / needs backtracking reading), vague similarity.

  - Interventionist: X causes Y iff there''s a possible intervention on X that would
  change Y (or the value/range of Y) holding other variables fixed, in a model/directed
  graph; requires invariance under intervention, modularity; cause must be manipulable-in-principle;
  interventions must be surgical (set X directly, break arrows into X, don''t affect
  Y through other paths); problems: non-manipulable causes (race, sex, being tall...),
  the "hard" variables, and "Would the intervention actually be feasible for us?"


  Procedure for a practitioner: a checklist for whether a causal claim survives:

  1. State the candidate cause as a variable with at least two values (not an event/individual).
  (Interventionism requires variables; counterfactual accounts can handle token events
  but need to be recast.)

  2. Say which contrast is at issue: X = x1 vs X = x0 (the "compared to what" question)
  — counterfactual dependence is sensitive to the contrast class; interventionism
  forces you to specify the intervention''s value.

  3. Specify the intervention: is it surgical (sets X and breaks all other arrows
  into X)? Is it merely a "do" on a proxy (e.g., an encouragement design)?

  4. Check whether the counterfactual route and the intervention route diverge: the
  "backtracking" test — would the counterfactual be satisfied only by a backtracking
  reading (changing the past / events upstream of X)? e.g., the barometer. If the
  only way to make the counterfactual true is to change causes of X (backtracking),
  then counterfactual dependence but not interventionist causation.

  5. Check for overdetermination/preemption: symmetric overdetermination (both sufficient,
  both present) — counterfactual says neither causes (both "would have happened anyway"),
  interventionism (with joint interventions) can still say each is a cause or the
  disjunction is; and preemption (backup ready) — counterfactual says the backup doesn''t
  cause, interventionism says intervening to remove backup changes nothing, so also
  no; hmm. Actually preemption: Suzy throws, Billy would have thrown if Suzy hadn''t.
  Counterfactual: if Suzy hadn''t thrown, the bottle would still shatter — so Suzy''s
  throw is not a cause on simple counterfactual (this is the preemption problem).
  Interventionism: intervening on Suzy''s throw to make it not happen doesn''t change
  the outcome — so also not a cause! That''s the famous problem for interventionism
  too (both theories struggle; Woodward handles via "interventions on the intermediate"
  or "the actual process" / "invariance under interventions that change whether the
  process occurs"). Hmm, this is deep in the weeds. For a practitioner procedure,
  maybe use: "the case where the counterfactual fails but intervention succeeds" —
  e.g., symmetric overdetermination: two sufficient causes both present; counterfactual
  dependence fails for each (removing one wouldn''t change the outcome), but intervening
  on one with the other held fixed... hmm, in symmetric overdetermination with two
  sufficient causes, setting X1 = 0 while X2 = 1 leaves Y = 1, so no difference —
  interventionism also fails unless you test X1=0 and X2=0 jointly. Actually the classic:
  "the two-switch case": flipping either switch turns on the light; both flipped.
  Intervening to unflip switch A: light stays on → no difference-making → not a cause??
  Woodward''s response: Y is not invariant under interventions that set A=0 while
  B=1, but it is a cause under "the full range of values" — Woodward requires that
  there be some combination of values of other variables and some value of X within
  the range such that Y changes. So A is a cause because there exists some setting
  of the background (B=0) where A matters. That''s the "range of values" / "some intervention"
  clause. Good: a procedure step: "don''t test the intervention against the actual
  values of the other variables alone; ask whether there is any admissible setting
  of background variables (within the model''s range) under which intervening on X
  changes Y."


  6. Non-manipulable / non-intervenable causes: if the candidate cause can''t be set
  by any intervention even in principle (race, sex, genotype, "being a woman," "being
  born in a recession"), interventionism has trouble (Woodward''s response: interventions
  on "representations"/proxies, or "hard" vs "soft"; or the claim is really about
  manipulating perceptions of X, or about components of X). Procedure: require translation
  — what is the manipulable stand-in, and does the claim really mean the stand-in?

  7. Invariance / stability: is the relationship invariant across background changes?
  Does it survive "which intervention" changes (e.g., setting X via different routes)?
  If the effect depends on how you set X, then "X" isn''t a well-defined cause variable,
  and you''ve got a proxy problem.

  8. Modularity: the mechanism by which X affects Y should be robust.


