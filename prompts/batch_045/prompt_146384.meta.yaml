  I''m a philosophy professor who has somehow ended up chairing our university''s
  academic conduct panel for the third year running. I''ve taught the Theory of Moral
  Sentiments maybe a dozen times, so don''t explain Smith to me or give me a reading
  list — I want something else: a procedure.


  The setup: panels are me plus one faculty member from outside philosophy and one
  student, and none of them have read a word of moral philosophy. We meet twice a
  month during term, we get about 45 minutes per case, and we have to produce a one-page
  written rationale that a dean who wasn''t in the room can read on appeal. Right
  now we mostly just argue until people get tired, and the outcomes are all over the
  place.


  What I want is a checklist we can actually run in the room, built out of Smith''s
  impartial spectator, that gets us to three separate findings: was the student''s
  conduct proper (i.e. what the spectator can go along with in the motives), does
  it warrant resentment or gratitude from the people affected (merit and demerit,
  in his sense), and if so what the response should be. Please keep the distinction
  between the first two — sympathy with the agent''s motive, versus sympathy with
  what the affected party feels — since that''s the bit I think we lose most often;
  we tend to collapse everything into "how bad was it".


  Two things I want you to add, because the book doesn''t hand them to me. First,
  a rule about which spectator we''re consulting. As I see it there are three we could
  be asking: the one who knows only what was publicly observable at the time of the
  act, the one who also knows what the agent privately knew or had reason to know,
  and the one who additionally knows how it all turned out. These come apart constantly
  — someone acts on information that was reasonable and wrong, or a bit of carelessness
  produces a huge mess, or vice versa. Tell me which question each of the three gets
  to answer, and give me a rule for what we do when they disagree, including whether
  the panel should ever say out loud "we are resenting the outcome, not the person"
  and then refuse to act on it.


  Second, a calibration step. Smith builds the spectator inside us out of our experience
  of how other people have actually reacted to us, which means a panel of three people
  from the same department can construct a "spectator" that is just our own gut in
  a wig. I need a test we can run in a couple of minutes that catches us doing that
  — my idea is something like: before stating a finding, each of us has to say, in
  the first person present tense, what the agent was feeling and what the person on
  the other end was feeling, and then check something about whether those two statements
  are just mirrors of each other. Make that concrete and tell me what fails it.


  Then run the whole thing on three cases:

  1. Two students in a class where discussing problems together is allowed but write-ups
  must be separate turn in near-identical proofs. Both say they wrote them up together
  at the library and didn''t think about it. Neither will say whose work it mostly
  was.

  2. A student who reports a roommate for cheating, and who definitely also just found
  out the roommate was seeing their ex. Mixed motives, and the report is true.

  3. The one I''m dreading: a first-year who was taught, explicitly and repeatedly,
  at a school where the whole exam system worked by memorising and reproducing model
  answers, and who did exactly that on a take-home exam here. Everyone''s instinct
  is that this is obviously a violation. My worry is that a spectator who really knows
  what she knew can''t go along with any resentment at all, only with correction —
  and that the panel then has to write down something that our dean will read as going
  soft. If that''s where your procedure lands, say so plainly.


  Finally, be straight about what the procedure can''t do. I can think of at least
  three kinds of case: where the real disagreement between the two parties is about
  what happened rather than what it means, where the rule the student broke is itself
  the problem, and the empty gallery case — where the person harmed will never know
  about any of this, because they''ve graduated, or it''s diffuse, and there''s no
  actual bystander around for the machinery to work on. Also tell me which Smithian
  distinctions have to survive being translated into plain language and which I should
  let go of.


