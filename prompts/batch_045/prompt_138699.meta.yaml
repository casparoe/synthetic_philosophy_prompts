  tax isn''t borne by the party that imposed it, it''s pushed downstream, and downstream
  actors have every incentive to route around it — fine-tuning refusals out, routing
  to open-weight models, wrapping the model in code that supplies the missing step.
  So a tax that looks locally rational for one firm can raise risk at the level of
