  to impose one. If downstream actors can strip it, it was never safety — post-training
  refusals, system-prompt restrictions, filters in the serving layer are etiquette.
  What you want is a tax whose cost is structural and whose removal is expensive:
  hardware-level controls, capability limits that are built into the training pipeline
  rather than bolted on after it, provenance or attestation requirements that make
