  quantities, prohibitions of a stereotyped form; they are never asked to carry negation
  beyond the circled slash, modality, conditionals, uncertainty, or scope.


  Then: the historical ancestor — Isotype as developed by Otto Neurath and his collaborators
  in Vienna and later: a notation in which quantity is shown by repeating identical
  unit signs rather than by enlarging one, perspective and incidental detail are banned,
  numbers are aggressively rounded, and every chart is printed with a short verbal
  caption. As I understand him, Neurath''s own position is more austere than his reputation:
  he denied that Isotype was a language at all in the full sense, held that pictures
  can never be more than a helper to words, thought that what pictures can share across
  cultures is at best a limited jargon of recurring signs rather than a grammar, and
  insisted that the notation has to be taught — that visual education, not natural
  transparency, is what makes a chart legible. He also held, in his epistemology,
  the well-known anti-foundationalist line: no privileged observation language, no
  given, every statement revisable, learners like sailors who must repair their ship
  at sea without ever being able to rebuild it from the bottom.


  Question: What does the practice presuppose? Specifically:

  - Is the practice committed to a thesis about meaning — that pictures have content
  that is not translatable without remainder into sentences, and that this content
  is inferentially inert (one can take it in without being able to argue from it)?
  Or is it compatible with the deflationary view that pictures are just sentences
  in a more compact notation?

  - Does the practice strictly presuppose that comprehension is learned and conventional,
  or is that merely what fits well with the comprehension-testing part, while the
  icon-only part fits an iconicity/nativist story? i.e., where is the practice philosophically
  underdetermined?

  - Does the restriction to objects, actions, quantities and stereotyped prohibitions
  reveal a commitment about what a notation without syntax can express — and does
  that undercut the claim that pictures are a language?

