  Contemporary public-information design runs on pictures. Transit hubs and airports
  are signed with icon-only pictograms... [practice description]


  Then: the puzzle — three features that sit badly together: (i) deployment as if
  language-free and universally legible; (ii) the standards that govern them insist
  on words alongside (hazard pictograms on chemical packaging are legally required
  to be accompanied by a signal word and a hazard statement; pharmaceutical leaflets
  pair pictograms with sentences; most icon-only interfaces revert to labels after
  a hover or a long press); (iii) designers test icons on samples of users and discard
