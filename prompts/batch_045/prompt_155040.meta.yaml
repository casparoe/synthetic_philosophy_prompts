  ---


  I''m teaching a comparative seminar on death and dying, and we''re pairing Zhuangzi
  with Tolstoy''s The Death of Ivan Ilyich. I want a reading of the novella through
  Zhuangzi''s stance on death that is faithful in both directions, and I''d rather
  have you name where the pairing breaks down than tidy it up.


  The distinction I want to use as the lens: Zhuangzi''s equanimity is usually presented
  as a single attitude, but I think it comes apart into three claims that can be held
  separately — that death is not bad for the person who dies (it is a transformation
  among the cycles of things, like the turning of the seasons, which is roughly his
  response when he is found drumming on a basin after his wife dies); that death is
  not to be feared in advance; and that this death, coming now and in this way, is
  not to be resented or grieved. Ivan Ilyich, it seems to me, is tormented far more
  by the third than by the first two, and much of what he calls his fear of death
  is really a verdict on how he has lived and on the social self that is about to
  be annihilated with him.


  So, three things:


  1. Where does the lens illuminate the story? In particular the long section in which
  Ivan Ilyich asks whether his whole life has been "wrong," and the way his terror
  is bound up with his career, his house, his drawing-room propriety, the falseness
  of the people around him. Is the novella diagnosing an attachment to a socially
  constituted self that Zhuangzi would have recognized, and does Ivan Ilyich''s release
  in the final hours look like anything Zhuangzi would count as wisdom rather than
  as another form of clinging?


  2. Where does the story resist? Tolstoy gives Ivan Ilyich his release through pity,
  love for his son, and the sense that something must simply be done because "It"
  requires it — a moral and quasi-theistic frame with no counterpart in Zhuangzi,
  whose equanimity is not earned by moral repair and whose dying Zhuangzi refuses
  an elaborate funeral on the grounds that heaven and earth will do. Say plainly if
  the Zhuangzian reading can only be kept by sentimentalizing him or by secularizing
  Tolstoy, and which cost is higher.


  3. What, if anything, does the pair add to the philosophical argument? My suspicion
  is that Ivan Ilyich supplies a case Zhuangzi doesn''t handle: a death that is feared
  not because death is feared but because the life it ends is judged to have been
  wasted, and where the remedy, if there is one, is not detachment but a change in
  what one loves. If the novella supports that, it counts against the adequacy of
  an equanimity built only on the metaphysics of transformation. But I''d also want
  to hear whether Zhuangzi has resources I''m ignoring — the cook Ding, the useless
  tree, the scepticism about whether a life can be "right" or "wrong" at all.


  Keep it to about 800 words, name the scenes you''re reading, and don''t quote; my
  students have the text in front of them.


