  I have agreed to give a short talk on Garrett Hardin''s lifeboat argument to a graduate
  reading group in philosophy — I am a retired population biologist who has started
  sitting in on philosophy seminars, and the group asked for someone who could say
  what is wrong with the ecological analogy. Preparing the talk, I built an argument
  that I now cannot accept the conclusion of, and I would be grateful for a diagnosis
  rather than a verdict on Hardin.


  Here is the argument, with my labels:


  (1) Hardin''s case depends on a *ceiling*: a threshold of total occupancy such that
  taking more aboard sinks the boat, leaving everyone — those rescued included — worse
  off than if they had been left in the water. If there is such a threshold, the duty
  not to destroy the boat''s capacity defeats, at the margin, the duty to take more
  people aboard.


  (2) The ceiling is not a fixed quantity supplied independently of the population
  sitting on it. In the systems I spent my career measuring, the analogous quantity
  is path-dependent: a population modifies the resource base it depends on, degrades
  it or builds it up, and overshoot shows up in lagging indicators that are legible
  only after the damage is done. Nor is a boat special: its capacity depends on the
  bailing rate, on rationing and redistribution among those aboard, on stores and
  rigging, on whether boats are lashed together.


  (3) Hence at any decision point the ceiling is partly a product of the crew''s own
  earlier choices and of choices still open to it. What looks like an exogenous limit
  is an inherited one.


  (4) An agent cannot cite, as a reason why it is not required to aid, a limit that
  the agent has itself produced and can now relax. Ought-implies-can gives no purchase
  to a cannot of the agent''s own making.


  (5) So the lifeboat argument never applies to the cases it was written for. Whenever
  the ceiling is to any degree endogenous — and in political and economic cases it
  always is — the appeal to it has no force at the moment of decision.


  (6) But (4), taken as I have stated it, is indifferent to whether relaxing the ceiling
  is wise. The crew can raise its intake by eating the seed stores and burning the
  rigging for fuel; having done so it will founder later, and by (4) the resulting
  capacity still cannot excuse it. So (1) and (4) issue incompatible instructions:
  preserve the base, and never plead the base. And if (4) is qualified so that it
  does not bite in that case, I cannot see how it bites in Hardin''s case either.


  I find the conclusion unacceptable, but I would prefer to keep (2) — it is the claim
  I would defend in my old department — and (4), which still strikes me as sound in
  the ordinary case where someone pleads a predicament they arranged.


