  Draft:


  ---


  I teach an upper-level undergraduate seminar in philosophical logic and I need one
  question for the final that will discriminate between students who have mastered
  the literature on the justification of deduction and students who have memorised
  its slogans. The topic is the regress in Lewis Carroll''s brief dialogue about Achilles
  and the Tortoise.


  What I want: a single, self-contained essay question — 60 minutes, closed book,
  target length about 1,000 words, marked out of 25 — together with a model answer
  of roughly 900 words and a marking scheme.


  Constraints on the question:


  1. It must state the regress in the question itself, in two or three sentences,
  so that a student who has never read the dialogue can answer. Do not assume knowledge
  of any secondary author: if the question invokes a position (e.g. the view that
  a justification of a rule which itself uses that rule is circular only in a benign
  way; or the view that the lesson is just that a conditional asserted as a premise
  is not a licence to infer), characterise it in the question rather than naming it.


  2. It must be unanswerable by reciting the standard moral — that conditionals are
  not rules of inference, or that one cannot justify deduction without already relying
  on it. Both are things my students can already produce; I want a question in which
  those moves earn, at most, partial credit.


  3. The crux I want students to confront is a pair of proposed escapes from the regress,
  both of which look decisive and neither of which, I think, succeeds; the question
  should force them to say exactly where each one fails and what that failure shows
  about what a justification of deduction would have to be.


  Escape one (the "closure" escape). Carroll''s Tortoise accepts each new conditional
  Achilles writes down but still declines to accept the conclusion. But note that
  the Tortoise''s commitments — say A and "if A then Z" — together with the denial
  of Z are already jointly inconsistent. So, one might say, the Tortoise does not
  need to perform any inference at all: if he is committed to the closure of his commitments
  under logical consequence, he is already committed to Z, and the regress is spurious.
  The question should press the following: to get Z out of closure, the Tortoise must
  first establish the entailment fact, that A together with "if A then Z" entails
  Z — and establishing that is itself an exercise of deductive reasoning. Does the
  escape therefore merely relocate the regress one level up, into the justification
  of the Tortoise''s knowledge of entailment facts? And if so, is the relocated regress
  the same regress or a different one?


  Escape two (the "mechanism" escape). Suppose we simply install in the Tortoise a
  reliable disposition: whenever a sentence of the form "if p then q" and the sentence
  p are both before his mind, he comes to accept q. He now derives Z in one step and
  the dialogue never starts. But the question should ask whether this addresses Carroll''s
  problem at all, or whether it changes the subject. I want students to see that there
  are two distinguishable readings of the Tortoise: on one he is a creature with a
  performance deficit (he cannot get himself to infer), on the other he is a creature
  with a normative question (he grants every truth and every entailment and asks what
  reason he has to move). Providing a mechanism cures the first and says nothing to
  the second. Students should be made to say which reading makes the dialogue a philosophical
  problem rather than a clinical one, and what follows for the kind of thing that
  could count as an answer.


  4. A strong answer should also be able to place the "rule-circular" response: a
  justification of modus ponens that uses modus ponens is circular, but perhaps only
  in a way that still discriminates between good rules and bad ones (it can, for instance,
  show why modus ponens and not the rule that licenses inferring the antecedent from
  a conditional and its consequent is trustworthy). The question should ask whether
  such a justification can satisfy the Tortoise on the normative reading, and whether
  the Tortoise would be entitled to treat rule-circularity as a defect — given that
  he is, after all, asking for a reason and not for a cause.


  Please also supply:


  - A model answer of about 900 words that actually reaches a conclusion about whether
  the two escapes succeed and about what shape a genuine response to the normative
  reading would have to take. It should not end by saying that the issue is subtle
  and more work is needed; take a position.

  - A marking scheme out of 25, organised around five or six must-hit points, each
  with the marks it is worth and a one-line note on how candidates typically get it
  wrong (e.g. the common error of treating the closure escape as a restatement of
  the conditional/rule distinction, or of answering the mechanism escape by saying
  only that a mechanism could misfire).

  - A short note on what distinguishes an answer in the 20–25 range from one in the
  15–19 range: name the single move that a top answer makes and that a good-but-not-excellent
  answer omits.


