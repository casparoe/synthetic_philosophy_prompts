  is a detour, that we should supervise the outcome, that outcomes are what we actually
  care about and that grading intermediate steps imports human prejudices about how
  thinking ought to look. Both sides then cite the same handful of results, and nobody
  moves. Last spring I watched two researchers at a workshop agree, line by line,
  on what the published comparisons show — that step-level reward models beat answer-level
  ones on some mathematical reasoning benchmarks, that the gap narrows or vanishes
  once you equalize compute or look at harder problems, that both can be gamed — and
  then draw opposite recommendations for how a lab should spend its annotation budget.
  That conversation is why I''m writing to you.


  Before I file another piece on it, I want a diagnosis rather than a verdict...


  Then describe the positions:


  Camp 1 (process): finer credit assignment; catches the "right answer, wrong reasons"
  case — a coding agent whose patch passes the test suite by special-casing the inputs;
  a proof whose final line is correct because two errors cancelled. Also: as tasks
  get longer than a human can audit, the outcome signal is either absent or itself
  produced by a model, so you need per-step signal anyway.


  Camp 2 (outcome): outcomes are the thing we want; step labels encode a particular
  human style of reasoning and penalize routes that are valid but unfamiliar — the
  model that finds a genuinely new proof whose intermediate moves no human annotator
  would have endorsed. Step-level reward models have their own failure surface and
  their own annotation cost, and there''s no reason to think a process reward model
  is easier to align than an outcome one. Also: process supervision is just outcome
  supervision applied to a decomposition — if you reward the step of producing a correct
