  ---


  I sit on the three-person progress review panel of Cedar Row, a six-month residential
  substance-use program that takes most of its residents by court referral. At the
  end of week six each resident presents a recovery plan to the panel, and we must
  certify, on a form that goes to the referring court, either "engaged" or "not engaged."
  The program''s manual distinguishes the two this way: compliance is doing what the
  schedule requires; engagement is "owning the plan as your own choice rather than
  as something the program requires of you." Our certification determines whether
  a resident keeps his court-ordered placement or is returned on the violation.


  The case: [resident], 34, court-referred after a third OWI, eight weeks in, no infractions,
  universally described by staff as one of the harder workers on the unit. He presented
  a plan that the clinical staff agree is excellent on the merits — housing application
  before discharge, outpatient slot already arranged, a sponsor, a list of the two
  people he will call. He presented it in a flat, fatalistic register: "My father
  drank, my brother drank, I''ve been drinking since I was fifteen. I''m an addict.
  I''ll do this plan because you need me to and because my PO needs it, and I''ll
  probably drink again when I get out. That''s just how it is with me."


  Our clinical director reads this as the failure the week-six presentation exists
  to detect. On her reading, he has [given] his addiction the status of a fixed trait,
  has described his own future as something that happens to him, and has located the
  entire motive for the plan in other people''s requirements — which is precisely
  the posture the manual means by "not engaged." She wants him returned to the court.
  [Or wants a 30-day extension with the requirement that he re-present.]


  Our senior counselor — twelve years in recovery, and the staff member who knows
  him best — reads the same transcript the opposite way. She says she said almost
  exactly these words at her own week six, that they were the truest thing she had
  said in years, and that what the program did for her was not to make her disown
  them but to let her keep saying them while acting anyway. Her stronger point is
  this: if we require a resident to avow that he is choosing, we will get the avowal,
  because we hold his liberty in our hands, and what we will have taught him is to
  narrate himself in whatever register the people with the clipboard reward — which
  is the opposite of what the manual is after.


  Two further facts. First, our own two-year outcome file (small n, 41 discharges)
  shows no relationship between how a resident scored on the engagement item at week
  six and whether he was abstinent at six months; the item tracks something, but not
  that. Second, [counselor] has floated a distinction I can''t get out of my head:
  that "owning a plan" and "predicting that you''ll keep to it" are different attitudes,
  and that [resident] may be doing the first perfectly while making an honest, and
  probably accurate, estimate about the second — in which case his fatalism is a forecast,
  not a refusal.


  I have to file something by [day]. Please draft the panel''s opinion memo...


