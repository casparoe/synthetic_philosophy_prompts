  the pieces have to arrive, and what breaks if two of them are swapped — in particular
  whether rigidity should be introduced as a constraint the agent imposes on her own
  update, as a property of causal/explanatory independence between the experience
  and the partition, or as whatever is left over once you have said what the experience
