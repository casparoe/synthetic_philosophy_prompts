  differs only imperceptibly from the one it cites, yet after two years the effective
  threshold has drifted somewhere none of us would have chosen knowingly.


  I want a decision procedure my unit can actually run, and I want it built rather
  than borrowed. It should tell a caseworker what to ask, in order; what counts as
  a sufficient answer to each question; where the procedure stops with a no; and where
  it hands the case to a panel because the remaining question is one of values rather
