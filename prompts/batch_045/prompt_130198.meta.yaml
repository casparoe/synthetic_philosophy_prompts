  not let middle knowledge collapse into either of the other two; explains how it
  is supposed to do providential work without determining the will; and states the
  grounding objection and the Molinist replies to it accurately.


  **Question.** (a) Distinguish God''s natural knowledge (scientia naturalis), middle
