  for two days. Her argument is that slurs aren''t derogatory in virtue of their meaning
  at all — the derogation is entirely in the use, so a slur and its neutral counterpart
  are semantically the same word with different social mileage. I hate the conclusion
  and I can''t find the broken step. Here it is as I''ve reconstructed it, with her
  wording where I remember it:


  (1) Linguistic meaning is shared and conventional: if two competent speakers genuinely
  disagree about what a word contributes to what''s said, then at most one of them
  is using the word with its linguistic meaning — the other is confused, or speaking
  non-literally, or using a different word that happens to sound the same.


  (2) Take any slur S with neutral counterpart N. There are speakers who use S and
  derogate the target group, and speakers who use S and don''t: in-group reclaimer
  use (the group calls each other S affectionately), reported speech by people who
  oppose the slur, utterances by small children or non-native speakers who picked
  it up from a dictionary and meant nothing by it.


  (3) Both sets of speakers are competent, neither is being non-literal, and neither
  is making a mistake *about the language*. So by (1), the derogatory component isn''t
  part of the conventional meaning of S.


  (4) Generalize: the same is true of every expression with a purported evaluative
  or affective component — "lazy", "cruel", "torture", "genius", "yummy", thick terms
