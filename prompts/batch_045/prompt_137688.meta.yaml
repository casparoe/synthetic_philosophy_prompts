  I''ve got a 35-minute slot next week in our internal engineering-leadership program,
  twenty-ish newly promoted managers, and I want to build it around the dollar auction
  — the one where a dollar goes to the highest bidder but the runner-up pays their
  bid too and gets nothing. Every one of them got handed, in the last month, a project
  that''s already over budget and behind schedule, and nobody above them will say
  whether to push on or kill it, so the material is not hypothetical for them. Don''t
  explain the auction to me; I know it. Help me plan how I teach it.


  Two things make this harder than the usual version:


  First, I don''t want anyone walking out thinking the lesson is ''sunk costs are
  a fallacy'' or ''don''t get into stupid situations.'' They can''t un-enter a project
  they inherited, and in their actual jobs pushing on is sometimes exactly right.
  The distinction I care about is between the structural thing — the payoff rule that
  makes each individual step forward look better than stopping even while the pair
  of you spiral — and the psychological thing, the ''we''ve already spent too much
  to quit now'' feeling, which can exist without any such structure and can push people
  the other way too. I want them to be able to tell, on a real case of their own,
  which one is operating.


  Second, I''m not sure I should run the plain version. Option A: the standard one,
  known $1 prize. Option B: sealed prize — I write a number between 50 cents and $5
  on a card, they can see the range, and I only reveal it after bidding ends. My worry
  about A is that someone smart-alec bids 99 cents or announces they''d never go past
  a dollar and the whole thing turns into a lesson about greed or about that one guy;
  my worry about B is that it makes it feel like a gamble and muddies the mechanism.
  Tell me which to run, or tell me both are wrong and give me a third.


