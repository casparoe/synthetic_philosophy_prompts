  have and lack. It should be recognisable as their situation rather than as an auction.

  - The misconceptions I should expect, and exactly where in the sequence to head
  each off. The ones I''m anticipating: that this is just the sunk-cost fallacy with
  extra steps; that the fix is a budget cap or a pre-commitment (I think this is the
  trickiest one, because a budget you impose on yourself is revisable at exactly the
  moment it binds — but say if I''m wrong); that once the bids pass a dollar everyone
