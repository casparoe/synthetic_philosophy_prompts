  "I keep running into a pattern in discussions about whether technical systems have
  political content, and I don''t have a word for it. The standard cases people cite
  — the low overpasses on the Long Island parkways that a bus can''t clear, the mechanical
  tomato harvester that reshaped California farming — work by imposing: something
  is built into the artifact that forces people into a certain arrangement, and the
  politics is in what the artifact requires. The pattern I mean is the reverse. What
  gets built in is a removal.


  Three instances. A warehouse replaces a posted weekly roster with an app where each
  worker bids on individual shifts: everyone gets more choice, and there is no longer
  a shared schedule — the thing around which a walkout used to be organized. A city''s
  drivers all used to take the same arterial road, and the resulting congestion was
  a public fact that got contested at city meetings; navigation apps now spread each
  driver onto a different residential street, and there is no longer a single object
  anyone can complain about. An insurer replaces community-rated premiums with per-driver
  monitoring: each driver now faces his own measured risk, and the pooled risk that
  made insurance a shared political stake dissolves into individual accounts.


  In each case the effect is political in the sense that it changes who can act collectively
  and about what — but it is not a design for that outcome, it doesn''t depend on
  anyone''s bias, it survives being pointed out, and it is usually sold as removing
  a constraint rather than imposing one. It also isn''t just ''the artifact has an
  affordance'': the removed thing was never anyone''s property and its absence isn''t
  visible to the people who lost it.


  Is there an established concept for artifacts whose politics consists in dissolving
  the shared object rather than imposing an arrangement? If the nearest concepts are
  things like requiring-relations, scripts, affordances, exit-versus-voice, or individualization
  of risk, I''d like to know which fits, what each would make of my three cases, and
  where my description stops matching. If there''s nothing, I''d like a name and a
  definition with boundary cases — say, a case that looks like mine but isn''t — and
  I''m not going to be happy with just a label."


