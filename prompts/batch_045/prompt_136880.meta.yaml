  an assignment of guests to rooms in which every guest is housed and some room is
  vacant. On the dynamic reading, the claim is that the manager can get the hotel
  from its initial state to such an assignment. The two come apart: the first is a
  claim about the existence of a bijection, the second about the executability of
  a procedure. The static reading is, I claim, entirely unproblematic, and the Cantorian
