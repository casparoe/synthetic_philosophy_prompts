  "§2. What the Hotel Actually Shows


  Everyone agrees on the mechanics. A hotel with rooms 1, 2, 3, ... is full; a new
  guest arrives; the manager asks each guest to move from room n to room n+1; room
  1 is free. Infinitely many new guests can also be housed, by doubling. And the Cantorian
  moral is equally familiar: ''full'' means every room is occupied, and the existence
  of a bijection between the guests and a proper set of rooms is not a contradiction
  but the defining feature of an infinite set — Dedekind''s criterion. On this reading
  the Hotel is not a paradox but a piece of theatre: it dramatises the failure, for
  infinite totalities, of the principle that a whole is greater than each of its proper
  parts. Entertain the thought of an actually infinite collection and you have already,
  in effect, granted everything the story asks you to grant.


  I want to argue that this deflation is too quick, but not for the reasons its critics
  give. Proponents of the kalām argument have used the Hotel to argue that actual
  infinities are impossible. ..."


