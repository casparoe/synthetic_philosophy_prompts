  Let me structure:


  Steps:

  (1) Determinacy needs a level that isn''t itself in question: a representation''s
  content is fixed relative to a background that the representation doesn''t itself
  depict. Call it the inviolate level.

  (2) Drawing Hands appears to violate this: each hand is both drawer and drawn. But
  the appearance is an illusion sustained from outside: the sheet, the ink, Escher
  — an inviolate level outside the depicted scene. So the picture is not really a
  closed loop; it''s a spiral that we close.

  (3) Generalization (the "no closure" principle): whenever a system seems to contain
  itself, its determinacy is owed to a level outside it. Self-containment is always
  apparent; the loop is only a loop for someone standing outside.

  (4) Corollary: no system is self-interpreting. A language can''t contain its own
  semantics (a truth predicate for its own sentences that behaves properly), a program
