  Consider James vs Clifford: "The Will to Believe" (James 1896) vs Clifford''s "The
  Ethics of Belief" (1877). Clifford: "it is wrong always, everywhere, and for anyone,
  to believe anything upon insufficient evidence." James: for a genuine option (living,
  forced, momentous) that cannot be decided on intellectual grounds, our passional
  nature may legitimately decide. Niche weedy issues: (a) James''s claim only covers
  cases where the evidence can''t settle it — but how do we know the evidence can''t
  settle it? (b) "believing can help bring about the truth of what is believed" —
  self-fulfilling beliefs (the "trust" case: I believe you''ll keep your promise,
  which makes it more likely you will); (c) the distinction between "doxastic" (belief
  is voluntary/passional influence on belief) vs. "pragmatic" justification; (d) whether
  the "will to believe" extends to cases where the belief itself doesn''t causally
  help but the *act* of believing signals something; (e) the tension: if I believe
  partly because it''s useful, do I thereby lose the belief? (the "shallow" worry:
  pragmatic reasons for belief are "second-order" and can''t be first-personal reasons
  — you can''t believe at will, and if you believe for pragmatic reasons you learn
  that your belief isn''t truth-tracking, which undermines it). Also (f) "Clifford''s
  principle applied to itself: is the evidence for Clifford''s own principle sufficient?"
  — a classic tu quoque.


