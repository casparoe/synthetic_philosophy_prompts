  — that almost any resource spent on steering the trajectory (reducing existential
  risk, locking in better values, slowing or speeding up particular technologies)
  dwarfs in expected value anything spent on the near-term welfare of people alive
  now, because the multiplication factor is the length of the future. Others in the
  same room reach for the same picture to license the opposite: the door is very long,
  we cannot see where the far edge is going, and a push whose effects are amplified
  a billionfold is a push we should be extremely reluctant to make.


