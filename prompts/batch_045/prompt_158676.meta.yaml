  is its length, who or what does the pushing, and what plays the role of the displacement
  at the far edge? Where the mapping requires an identification that is itself contested,
  say so.


  - Then the disanalogies, and, importantly, which of them matter for the work the
  picture is doing here. Three worry me in particular, and I would like them dealt
  with rather than listed. (i) A door is rigid: a deflection at the hinge is transmitted
  mechanically to the far edge. History is presumably not rigid — later generations
  have their own capacity to deflect, and if they do, the picture may contain a chain
  of hinges rather than one, in which case amplification at our hinge is not transmitted
  but re-set. Does the single-hinge picture survive if transmission is jointed rather
  than rigid? (ii) A door swings symmetrically and reversibly, and it stays on its
  hinge however hard it is pushed. Some of the outcomes we care about — extinction,
  or a stable lock-in of bad institutions — are absorbing: they remove the hinge rather
  than moving the door. The asymmetry between deflecting the door and destroying the
  hinge seems to me to be doing much of the real argument, and the picture has no
  vocabulary for it. (iii) The amplification comes entirely from the door''s length,
  so the picture supplies no reason at all to think the future is long; it is a picture
  of leverage conditional on length, not evidence of it. Is the analogy then merely
