  I teach a first-year seminar on moral psychology, and next term I want to pair Sophocles''
  Antigone with moral foundations theory as it is usually presented: the five or six
  foundations (care, fairness, loyalty, authority, sanctity, and the liberty foundation
  that got added later), the individualizing/binding split, and the claim that left
  and right differ not in how much they moralize but in which foundations they moralize
  with. I want a reading of the play.


  The claim I want to test: the tragedy is not a clash over which foundation matters
  most but a case of what I''ll call foundation-blindness — Creon cannot register
  piety toward the dead as a moral reason at all and hears it only as subversion and
  betrayal, Antigone cannot hear authority and the ordering of the city as a moral
  reason and hears only impiety and domination, and each therefore treats the other
  as immoral rather than as moral-but-differently-tuned. Is that a reading the play
  actually sustains, scene by scene? Where does it fit — the burial and the dust,
  Creon''s language about the city and the ship, Haemon''s intervention, Antigone''s
  appeal to the unwritten laws, Tiresias and the pollution motif, Creon''s collapse
  at the end — and where does the text resist it? I especially want to know whether
  the play gives either character any real access to the other''s foundation, or whether
  Sophocles deliberately denies them that, and what that implies.


