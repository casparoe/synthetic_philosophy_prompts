  relative to what would have happened had it done nothing. But what would have happened
  had it done nothing depends on what the other one actually does, so admissible baselines
  are the fixed points of a pair of mutual counterfactuals, and there is more than
  one: both freeze; both act moderately; one acts and the other quietly compensates.
