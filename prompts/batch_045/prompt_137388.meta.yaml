  I lead a small alignment team that is trying to specify, for a deployed office-assistant
  agent, a penalty term that discourages side effects. Two of my colleagues have argued
  past each other for a year, and I want the document an adversarial collaboration
  between them would have produced rather than another round of their arguments.


