  into a workable training signal without first writing down what we value: penalize
  the difference between the world the agent actually brings about and a counterfactual
  in which it does nothing, measured in purely structural terms — how far the set
  of things various people can still bring about has shrunk, how much of the change
  is undoable, how much of the agent''s own future freedom it has preserved — and
  treat the remaining design choices as engineering defaults to be tuned. Camp B (call
  them the anti-proxy camp) holds that "structural" is a misnomer: every such measure
  has to fix a counterfactual baseline, a set of probe capabilities, a way of scaling
  and aggregating them, and a time horizon, and each of those fixes is a value judgment
  relocated to a place where nobody votes on it.


  Write the joint statement they could both sign. It must contain:


  1. A numbered section of agreed claims — claims both would defend, including about
  the formalism of impact penalties, about the failure modes both agree are real (freezing
  or "impact paralysis"; offsetting, i.e. restoring someone else''s options elsewhere
  in order to afford a large local change; interference with the people who might
  switch the agent off; and the fact that a penalty defined over the agent''s own
  future capabilities can make such interference look cheap), and about what a successful
  measure would have to achieve. These claims should be substantive, not platitudes.


  2. A disagreements table: each row gives one residual disagreement, the formulation
  of it that Camp A would accept as stating its own view, the formulation Camp B would
  accept, and a note on whether the disagreement is genuine or whether it rests on
  a word. In particular, I want you to settle whether the disagreement about the word
  "side effect" itself is verbal: on one reading it means any causal consequence of
  the agent''s action other than the ones it was asked to produce, on another it means
  a bad one, and on the first reading the instruction "avoid side effects" is either
  vacuous or impossible.


  3. A cruxes section: the sub-questions such that a settled answer would move at
  least one camp, with, for each, a concrete case both would accept as bearing on
  it and each camp''s prediction about that case recorded in advance. I want at least
  these five cruxes, and I want you to add any you think I have missed:


  (a) Scaling and aggregation. Consider the proposal I will call range-normalized
  option preservation: for each of a broad set of probe goals, compute how much the
  agent''s action changes the best value achievable for that goal, divide by the range
  of values that goal could have achieved in the baseline, and sum the absolute values.
  This removes the dependence on the arbitrary units in which a goal is written, but
  it makes the weight of a goal depend on how finely the goal set is described and
  on how correlated the goals are with each other. Is there a privileged description
  of the goal set, or is the sensitivity to parametrization a reductio?


