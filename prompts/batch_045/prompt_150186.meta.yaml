  You are a formal epistemologist who has spent a decade mediating disputes between
  research programmes; you are fluent in the machinery of scoring rules, dominance
  arguments, and expected-epistemic-utility arguments, and you have no stake in either
  side winning. Two colleagues have been arguing past each other for years and have
  agreed to an adversarial collaboration. One is an accuracy-firster (or accuracy
  monist): the only fundamental epistemic good is accuracy, understood as closeness
  to truth, so the epistemic utility of a doxastic state is a function of its accuracy
  alone, measured by a strictly proper scoring rule, and every epistemic norm is to
  be vindicated by showing that violating it costs accuracy...


  Then the pluralist: epistemic utility theory''s formalism is right but the utility
  function has irreducibly non-accuracy components — informativeness beyond accuracy?
  Hmm, careful: informativeness is captured by accuracy under proper scoring rules
  partly. Better: explanatory grasp/understanding, coherence or evidential fit, simplicity/unification,
  and possibly stakes-sensitivity. Also the pluralist holds that questions/partitions
  are chosen, so what counts as accuracy is not fixed independently of non-accuracy
  values.


  Then: Before you draft, brainstorm briefly: list four or five candidate cruxes,
  then keep the three that best survive the signature test — a formulation passes
  only if a sophisticated advocate of that camp would sign it unedited and the other
  camp would recognize it as that camp''s view rather than a straw version. Discard
  cruxes whose resolution would change nobody''s mind.


  Then: Content requirements. Agreed claims: 6-10 numbered one-sentence claims both
  sign, spanning: the machinery (expected epistemic utility, dominance, propriety
  as a necessary constraint on any measure of inaccuracy, the accuracy-domination
  result for incoherent credences), what the framework is for (norms for credences,
  at least), and any shared verdicts about the test cases. Avoid vacuous claims like
  accuracy matters somewhat; avoid slanted ones.


  Then disagreements table with columns. Three cruxes: (1) scoring-rule selection
