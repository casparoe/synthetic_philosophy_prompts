  can unfold from the present, and the sentence is true just in case every one of
  those futures contains a battle, so the disjunction ''battle or no battle'' is determinately
  true while each disjunct is indeterminate. He insists this is metaphysical, not
  epistemic: it''s not that we don''t know, it''s that there''s nothing yet to know.
  He knows the literature and is happy to use the distinction between necessity of
  the consequence and necessity of the consequent, but he should be sharp rather than
  smug, concede the small points, and never give up the main claim unless I actually
  earn it. One paragraph per reply, stay in character until I say stop..."


