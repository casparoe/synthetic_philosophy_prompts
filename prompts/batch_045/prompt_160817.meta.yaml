  "My opening: I think your gaps are either idle or they eat deliberation. Here''s
  the fork. (1) Settled-but-gappy: suppose determinism is true — the wind, the currents
  and the admiral''s own deliberations fix, by causal necessity, that the fleets engage
  at dawn. Nothing in your machinery seems to forbid gaps in a deterministic world,
  since on your account truth needs actuality, not causal necessity. But then the
  ''openness'' that was supposed to make sense of deliberation is doing no work: a
  fully settled future is as gappy as a chancy one, and the reason Aristotle wanted
  gaps — that deliberation is pointless if the outcome is already necessary — doesn''t
  distinguish them. (2) If instead you say gaps really do track causal openness, then
  they should spread: take the admiral''s practical conditional, ''if I sail at dawn
  I take the strait''. Is that determinately true now, indeterminate, or not a proposition
  until he sails? If it''s indeterminate, you''ve broken the inference deliberation
  actually runs — I want to win, if I sail I win, so I sail — and you''ve made practical
  reasoning worse off than the bivalent theorist who just says it''s true. If it''s
  determinate, tell me why indicatives about the future go gappy while the conditionals
  we reason with stay fine. Pick a horn, I''ll take the other one."


  Then: "Also, when I''ve pushed it as far as I can I want him to say, in character,
