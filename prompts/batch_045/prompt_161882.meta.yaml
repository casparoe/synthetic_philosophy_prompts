  I need a hand with something before Thursday. I''m a PhD student in philosophy —
  I work on vagueness, which is the only reason I got pulled onto this — and I''m
  the grad rep on our Graduate School''s Progress Review Committee. Every May we review
  about thirty fourth- and fifth-year students against the rule that to keep funding
  and stay enrolled a student must be "making substantial progress on the dissertation";
  the ones who don''t get a "required to withdraw" letter. Twenty-odd of the files
  are obvious in both directions and five or six ruin everyone''s week, and this year
  two committee members have dug in on what are, as far as I can tell, straight-up
  epistemicist and supervaluationist readings of what we''re doing when we pass judgement
  on those six. Dana says: the word is vague but there''s still a fact of the matter
  about whether someone is making substantial progress, our uncertainty is ignorance,
  so we should spend more time on the hard files, pull in the students'' own committees
  for more evidence, and write letters saying we judged carefully. Marcus says: there''s
  no fact until we precisify, the line is something we choose and are answerable for
  rather than something we find, so we should stipulate a precisification in the published
  policy, say why we picked that one, and stop writing letters that read like findings.
  My office mate, who is not a philosopher, thinks we should just do whatever generates
  fewest appeals, and I have to admit that''s a real consideration here.


  The complication I can''t get past is that "substantial progress" isn''t vague along
  one dimension, it''s vague along several at once — words on the page, chapters drafted,
  whether the prospectus was defended, whether there''s a submitted article, whether
  the data collection is done — and the six of us on the committee are implicitly
  weighting these differently. So Marcus''s "whatever holds across all admissible
  precisifications" move looks like it might leave almost nobody determinately qualifying,
  which can''t be the right result for the four students who plainly are doing fine.
  And then whatever borderline category we invent will have fuzzy edges of its own,
  and I don''t know whether that''s a real problem for the policy or just philosophers''
  squeamishness. Someone floated handling the borderline cases by a weighted lottery,
  the weight being the fraction of admissible precisifications on which the student
  counts as progressing; Dana''s side said that''s pretending to measure something
  and Marcus''s side said it''s fine as a tie-break but doesn''t follow from anything.
  Separately: even granting Dana the semantics, I keep coming back to the point that
  near the boundary no judgement of ours is reliable in the way knowledge is supposed
  to be — there are always nearby cases where we''d have gone the other way — and
  I genuinely can''t tell whether that pushes toward Marcus''s picture or just toward
  some procedural fix that both pictures could live with.


  What I need is the memo I circulate on Wednesday night for Thursday''s meeting.
  It should have a recommendation up front and then reasons, and it has to settle
  three things: whether we publish a codified threshold (number of chapters, word
  count, defended prospectus, some combination) or keep holistic case-by-case judgement;
  what we do with this year''s six borderline files specifically, with a date for
  a checkpoint or a decision; and what the letters to students actually say, since
