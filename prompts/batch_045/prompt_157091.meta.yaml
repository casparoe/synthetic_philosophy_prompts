  Voice: an editor convening an adversarial collaboration for a volume, or the convener
  of a workshop. Formal/polished.


  Content plan:


  Opening: "I''m editing a volume on the metaphysics of consciousness and want to
  commission one chapter as a genuine adversarial collaboration..." Then name the
  two camps: (1) combinatorial micropsychists / bottom-up constitutive panpsychists:
  phenomenal properties of fundamental physical entities are the base; macro-subjects
  exist because micro-subjects stand in a (so far unarticulated) "bonding"/combination
  relation; (2) cosmopsychists / top-down: the cosmos as a whole is the one fundamental
  conscious subject; finite subjects like us are grounded in it by "decombination"
  (derivative alters/partial aspects), not by composition.


  Then: what I want in the document —


  1. Agreed claims (numbered, jointly signable, non-vacuous): e.g.,

  - Both reject brute/radical emergence of phenomenal properties from wholly non-phenomenal
  ones, and both accept the "no-radical-emergence" premise.

  - Both accept that our ordinary introspective data (unity of a conscious field,
  unity across modalities, the unity of a subject over time?) — hmm, careful: what
  do they agree on? Both accept the datum of consciousness and the unity of a single
  conscious field at a time.

  - Both accept that phenomenal properties are intrinsic/non-structural (or: both
  accept that structural/functional description alone doesn''t settle whether there''s
  a subject) — maybe contested. Better: both accept that the physical description,
  as physics gives it, underdetermines which subjects exist — that''s the shared motivation
  for both views.

  - Both accept that no empirically available evidence to date discriminates between
  them.


  2. Disagreements table: columns: (i) neutral statement of the disputed question,
  (ii) formulation the micropsychist would sign, (iii) formulation the cosmopsychist
  would sign, (iv) whether the disagreement is substantive or verbal, (v) crux, (vi)
  agreed-bearing test/case, (vii) each side''s pre-registered prediction.


  Disputed questions:

  - Direction of grounding: do macro-subjects ground in micro-subjects by composition,
  or are macro-subjects aspects/derivatives of a cosmic subject?

  - Whether the "combination relation" needs to be a new fundamental relation vs whether
  "decombination" is a new fundamental relation — symmetry claim: the two problems
  are structurally mirror images, so is there any non-question-begging reason to prefer
  one? (this is the "symmetry/parity" worry — a good crux)

  - Whether the "grain problem" is a difficulty for both: micropsychism must say why
  base subjects are at the fundamental level and not, say, at the level of neurons,
  or cells, or brains; cosmopsychism must say why the cosmic subject''s decombination
  bottoms out at organisms and not at their organs or at groups of organisms.

  - Parfit-style: what happens with gradual integration (the novel case).

  - Whether the cosmic subject''s experience is "structured" enough to ground human
  experience — e.g., a cosmopsychist needs the universe''s phenomenal field to have
  an internal structure rich enough that our experiences can be aspects of it; if
  the universe''s fundamental physical state is maximally simple/symmetric (e.g.,
  a very early hot dense state or a degenerate quantum state), then there''s no structure
  for our experiences to be aspects of — "the paucity problem"/"the problem of cosmic
  simplicity". This is a real issue (Chalmers'' structural mismatch analog; Goff''s
  response about the universe having structure). Good crux.

  - Whether the number of subjects is a "brute given" of the combination relation,
  or whether some principle (e.g., "maximal integration", "causal integration") determines
  it.


  3. Then the novel injected element. I want a concrete, novel case both sides accept
  as bearing on a crux, with pre-registered predictions. Options:


  Novel case A ("the bandwidth bridge"): a hypothetical neurotechnology: two human
  subjects linked by an implantable "bridge" whose bandwidth and delay can be continuously
  varied from zero to values exceeding typical interhemispheric transfer. Empirically
