  Draft:


  "Hi — I''m a 5th year PhD student in political theory and I have a works-in-progress
  talk on thursday for a mixed seminar: it''s mostly labour/public finance economists
  who do optimal tax and social insurance stuff, plus two analytic political philosophers
  (one is a luck egalitarian, one works on intergenerational justice and non-identity),
  and the chair is an american politics person who just wants to know what the testable
  implication is. No one there works on Rawls specifically.


  The paper: I''m arguing that the difference principle is best read as a constraint
  on *transitions* rather than on end-states. So: a reform of the basic structure
  is permissible iff the worst-off representative person''s prospects improve relative
  to what would have happened otherwise. My two moves: (1) that reading isn''t extensionally
  equivalent to end-state maximin, because of path-dependence — with three or more
  positions and a finite horizon you can have a sequence of worst-off-improving reforms
  that ends up somewhere worse for the worst-off than some other feasible sequence
  would have, and the set of reachable endpoints strictly grows with the horizon;
  (2) to deal with the resulting lock-in problem I propose ranking admissible sequences
  by the worst-off''s *lowest* prospects at any point along the path (so, maximin
  over the whole path, not just the endpoint), with time-integrated improvement as
  tie-breaker and no discounting.


