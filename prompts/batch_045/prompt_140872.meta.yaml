  Draft:


  "I sit on the serious-incident review panel at a secure forensic psychiatric hospital.
  After every violent or threatening incident on a ward we have to decide, at the
  next morning''s case meeting, whether to respond to the patient as a moral agent
  — think resentment, demands for an apology, an expectation that the patient answer
  for what was done — or to take the wholly objective stance: treat the episode as
  a symptom to be managed, adjust medication, change the risk plan, and go no further.
  Right now we do this by feel, and the same incident gets handled very differently
  depending on who is chairing. I want a written procedure we can run in about fifteen
  minutes with a file in front of us, grounded in the Strawsonian distinction between
  the participant and the objective attitude rather than in our own hunches.


  Three things the procedure has to get right:


  1. It must distinguish, early and explicitly, between a case that excuses this action
  (he didn''t know, he was pushed, he thought he was in danger) and a case that exempts
  this person (severe intellectual disability, acute psychosis, advanced dementia)
  — Strawson treats these as different withdrawals from the reactive attitudes, and
  we keep collapsing them, which is why our decisions look arbitrary to patients.


  2. It must have a step for whether the reactive response is apt, and a separate
  step for whether expressing it is a good idea. Our team has a standing slogan —
  ''take responsibility, don''t blame'' — and we use it to avoid saying anything that
  sounds like blame to someone who is ill, but I think we''ve drifted into never asking
  whether the anger the staff actually feel is warranted, and into pretending the
  objective stance is neutral when it isn''t.


  3. It must say when the objective attitude is required, when it''s permissible,
  and when it''s a failure — including the case where we slide into it because blame
  is uncomfortable or because managing someone is cheaper than answering to them.


  Then apply the procedure to three incidents: (a) a patient with borderline personality
  disorder who, after being told her leave was cancelled, smashed a window and cut
  her arm, and the next day says ''I did it because I had to make you listen''; (b)
  a patient in the acute phase of a psychotic episode who struck a nurse he believed
  was poisoning him; (c) a patient with no diagnosis at all who threatened a weaker
  patient for his cigarettes. I want the honest output on each, including where the
  procedure tells us to do something my team will resist — and where it declines to
  answer and hands the decision back to us as a values question rather than a factual
  one.


  Finally, a note on where the procedure is most likely to fail: which step rests
  on the shakiest reading of Strawson, which step you''d expect to disagree about
  among people who accept the framework, and what evidence from our own case records
  would lead you to rewrite or drop it."


