  Actually, I recall Dennett: "greedy reductionism" is contrasted with "good reductionism"
  — the greedy reductionist tries to skip levels, e.g., explaining love in terms of
  neurochemistry directly. And "skyhooks vs cranes": a crane is a lifting device built
  from below, standing on the ground it lifts from; a skyhook is an "intrinsic wonder-worker"
  or "miracle" — an unsupported lifter. There''s a common rationalist usage: "that
  explanation is a skyhook" meaning it posits something unexplained. And there is
  a common confusion: people use "skyhook" to mean "any top-down explanation" or "any
  irreducible higher-level phenomenon" — thereby conflating non-reductionism with
  skyhooks, and using "there are no skyhooks" to rule out emergent/level-relative
  explanations, which Dennett himself allowed (he was a "good reductionist" and even
  allowed "real patterns" and some anti-reductionism about levels? Dennett defended
  the reality of patterns and the legitimacy of higher-level explanations like intentional
  stance).


