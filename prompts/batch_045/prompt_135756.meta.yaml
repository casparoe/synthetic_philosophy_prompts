  relevant competence is common-sense life experience, not trained evidence-weighing,
  or presupposes a democratic/peer judgement ideal (trial by one''s peers) rather
  than an accuracy-only epistemology. Another reading: experts'' errors are correlated
  with the judge''s/system''s errors, so excluding them preserves independence/diversity.
  Nice in-the-weeds point: exclusion of experts can be justified on Condorcet grounds
  as preserving independence and avoiding correlated error, even though it lowers
  average competence. Nice tension between competence and independence.

  4. Random selection: sortition protects against selection bias/correlated error,
  and against strategic packing; presupposes that the pool is diverse and that you
  can''t do better by screening for competence (or screening is itself corruptible).

  5. Secrecy + no reasons + unreviewable acquittal: legitimacy without accountability;
  verdict as the output of an oracle.


