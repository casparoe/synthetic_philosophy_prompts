  (majority output is authoritative even if no one can articulate reasons) but conflicts
  with a deliberative-democracy picture where the force of the outcome derives from
  the quality of the reasoning.

  2. Unanimity: anti-Condorcet. Under independence and p<1, P(unanimous for truth)
  → 0 as n grows; unanimity gives each juror veto, making the jury''s accuracy ≈ the
  least competent member''s; it converts the aggregation rule from majority to a conjunctive
  rule that maximises false-acquittal rate. Yet the practice presupposes something
  else: the Blackstone-ish asymmetry ("better that ten guilty go free...") — a very
  well-known maxim, but quoting it? I can paraphrase without quotation marks: "the
  old maxim that it''s better that many guilty people go free than one innocent be
  convicted". I''ll paraphrase, no quotes. That''s safe and well known.

