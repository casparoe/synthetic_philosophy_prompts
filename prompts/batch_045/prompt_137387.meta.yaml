  ---


  I work as a story editor on factual drama — the sort of thing that carries a caption
  about being inspired by real events — and my partner is an archivist, so we have
  been arguing, on and off for about two years, about what exactly we owe the real
  dead when we turn them into characters. I have got into the habit of writing down
  my verdicts on individual cases rather than defending general principles, and I
  would now like to know whether there is a principle behind them, because I suspect
  two of them cannot both survive.


  The verdicts, as I have them. A composite character who stands in for a whole team
  of scientists in a miniseries about a nuclear accident: fine, provided the programme
  says so somewhere. Reconstructed dialogue for a meeting that certainly happened
  but whose words were never minuted: fine. Moving a real person into a room they
  were not in, so that two documented events can share a scene: fine, it feels like
  punctuation. An invented love affair between two real people who certainly knew
  each other: fine, with a bad conscience. The same invented affair presented in a
  realist docudrama that will be most viewers'' only source on the pair: not fine.
  A fabricated specific act of cruelty — a real person shown doing something vile
  that they did not do, though they did do other vile things of that kind, so the
  scene is representative: not fine, and worse than the invented affair, though I
  cannot say why. Depicting a real person as having committed a crime they were tried
  for and acquitted of: not fine, and worse again. Depicting a real person as having
  had a secret sexual relationship contrary to the sexual identity they avowed and
  around which they organised their life: not fine — but this is, on the face of it,
  the same act as the invented affair I called fine, and I cannot get the two verdicts
  to line up. Inventing a cruel act about a Roman emperor who spent his life courting
  fame: I barely mind. Inventing the same act about a private person who died two
  centuries ago, never sought notice, and left no descendants and no community that
  remembers them: I mind a great deal — and since neither of them can be hurt, and
  no living person is distressed in either case, I do not know what my principle is
  appealing to. Finally: a biopic of a memoirist who spent his life publishing a self-aggrandising
  false account of himself, which invents scenes in order to puncture the myth: fine,
  and I am not sure whether that is because the subject forfeited something by lying
  or because the invention there is restorative.


  The three candidate principles I have been trying out are these. One, a structural
  one: what matters is not how many facts are changed but where in the narrative''s
  causal architecture they sit — inventions that decorate are permissible, inventions
  that supply the motives for the person''s actual deeds, or that become the reason
  the audience thinks the person did what they did, are falsifications of the person.
  Two, counterfactual consent: would this person, judging by the values they actually
  held and avowed, have accepted this depiction of themselves — where the relevant
  question is not what they would have liked but whether the depiction is one they
  could have seen as theirs. Three, an epistemic one about the audience: the wrong
  is a function of how likely the work is to become someone''s belief about the person,
  so it tracks the genre, the publicity, and whether there is a rival account in circulation.
  Please test these against my verdicts, repair them or replace them, and tell me
  honestly which verdicts I have to give up: I would rather have a principle that
  overturns one or two of them than a list of exceptions as long as the cases. Then
  I want the principle applied to the case I go back and forth on. A documentary about
  a writer who died in the 1990s, made with the co-operation of her estate, uses a
  voice model trained on her archived interviews to read aloud, in her own voice,
  passages from her private diaries — things she wrote, in her handwriting, but never
  said and never published, and which the film presents as her reading them, with
  a caption explaining the synthesis. I have felt both that this is the most respectful
  possible use of the archive and that it is a violation unlike any of the others,
  and I cannot tell which thought is the sentimental one. And please say what your
  account predicts about a case I have not listed — say, a drama about a musician
  who died three years ago, made against the wishes of her adult children, which depicts
  a documented episode of which they are ashamed.


