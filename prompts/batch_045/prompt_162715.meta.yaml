  Exam question (as pasted in the prompt):


  "Question 3 (25 points). In The Querist, Berkeley argues (i) that a nation''s wealth
  is the industry of its inhabitants, not its stock of gold and silver; (ii) that
  money is to be understood functionally — as a token or tally that gives its holder
  a claim on the labour and goods of others and thereby sets industry to work, rather
  than as a commodity with value of its own; and (iii) that Ireland''s poverty is
  partly due to a scarcity of circulating medium and credit, which he proposed to
  remedy by a national bank lending on real security and issuing paper notes.


  (a) [8] Is Berkeley''s treatment of money an application of his immaterialism (his
  denial of material substance)? Explain the difference between that and treating
  money as a sign in the sense of his theory of signs — and say which, if either,
  actually supports his monetary nominalism.


  (b) [9] Some readers have claimed Berkeley as a forerunner of what is now called
  chartalism or modern monetary theory: the view that money is a creature of the state
  and is valuable because the state will accept it in payment of taxes. Is this a
  fair reading? Use the role of credit and real security in his bank proposal to argue
  your answer.


  (c) [8] Suppose Berkeley were shown two modern monetary arrangements: (A) a decentralized
  digital bearer asset whose total supply is fixed in advance by its protocol and
  cannot be expanded or contracted by anyone; (B) a central bank digital currency
  whose quantity is adjusted by an issuing authority in response to a measure of idle
  productive capacity (unused hands, fallow land, idle machines) — expanding when
  capacity is idle, contracting when it is fully employed. Which would he, on his
  own principles, favour, and why? (If you think neither, say so and explain.)"


