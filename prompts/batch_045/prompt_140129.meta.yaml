  in slightly different words. My writing group has started counting. So I want her
  to have an actual method she could run out loud — something a resident could repeat
  back to her in an elevator, five steps tops, no jargon she''d have to define, but
  something that would genuinely separate the cases rather than collapse them into
  each other. I did half a term of a bioethics elective before dropping it, so assume
  I only know that there''s a view where the person''s earlier wishes should govern
  and another view that says what matters is the well-being of the person actually
  in the bed now, and that the two come apart in dementia — I don''t need the names
  of anyone''s positions, and it''s fiction, so invented devices are welcome.


  The three cases, briefly, in the order the chapters come: (1) Marta, 71, moderate-severe
  dementia, doesn''t recognize her daughter, is plainly content most days — hums along
  to old songs, loves lemon cake, shakes her head and pushes the cup away when anyone
  comes at her with a pill — and has now got pneumonia. At 34, after watching her
  grandmother die, she signed a directive refusing antibiotics and hospitalization
  for exactly this: "once I can''t recognize my family." Two wrinkles I made up for
  the book: the state she lives in requires directives to be reaffirmed every ten
  years or they lapse, and hers never was (37 years); and I keep having Nadia compare
  the earlier self to a novelist who wrote an outline and then lost control of the
  character — I''d love to know whether that metaphor is doing any real work or is
  just a line I''m fond of. (2) Ray, 58, early dementia, wrote a directive at 34 saying
  no aggressive treatment, then rewrote it during a bad depressive episode to say
  treat him aggressively and treat the first one as the depression talking; the second
  one''s witnessing is botched and he was on heavy sedatives that week, so legally
  I gather it''s probably void, but it also contains what my draft calls a "recovery
  clause" — that if he ever stops thinking he''s worth treating, that''s the illness
  speaking and should be overridden. (3) Odile, 84, no directive at all, minimally
  conscious after a stroke, on a ventilator her children insist she''d want; there
  is, however, a letter she wrote to her future self at 19, found in a drawer, saying
  don''t keep me going on machines for my children''s sake.


