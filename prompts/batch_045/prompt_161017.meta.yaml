  from the larger menu weren''t expressions of her preferences — she was choosing,
  at those moments, against what she wanted. And notice what the natural explanation
  is: she expects herself to choose badly later. That''s a claim about a gap between
  choosing and wanting, made by the agent herself, in the plainest sense available.
  Your formalism can be stretched to fit it — let preferences be defined over menus
  rather than outcomes, or let there be two selves with two utility functions — but
  every stretch is an admission that the original identification doesn''t hold where
  it matters."


  Move 5 (Marc): "The stretches are the theory working, not breaking. Preferences
  over menus are still preferences, revealed by choices over menus; two selves are
  two choosers, each revealed by their own choices; and ''expects herself to choose
