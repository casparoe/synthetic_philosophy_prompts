  Let me write each move with decent substance.


  Move 1 (Marc): "The theorem is the whole story, in both directions. As a definition:
  to say Dana prefers x to y is to say nothing more than that, were she offered the
  two together, she''d take x. As a testable theory: the consistency conditions are
  substantive — real choosers violate them. Anything you want to say about utility
  beyond what''s in the choice data is metaphysics, and specifically the useless kind:
  untestable, and invisible in the only place anyone could ever check."


  Move 2 (Dana): "Two complaints. First, your ''definition'' is either too small or
  not a definition. If ''would choose'' means ''has chosen,'' then it''s a record
  of the past and can''t tell us what to expect from anyone in a new situation; if
  it means ''is disposed to choose,'' then you''ve helped yourself to a counterfactual
  disposition, and a disposition is exactly the sort of thing I mean by a preference
  — it isn''t the behavior, it''s what explains the behavior. Second, the representation
  result is close to vacuous as a theory of utility: pick any consistent data, and
  infinitely many utility functions fit it, all differing by how you stretch the numbers.
  A quantity that is only defined ''up to stretching'' isn''t measuring anything;
  it''s a relabeling of the data with numbers. That''s why people who actually care
  about utility — about how well someone''s life is going — treat it as something
  with its own nature, of which choice is only evidence."


  Move 3 (Marc): "Give me one observation that would refute a claim about the mental-state
  version. You can''t: every case where choice and your ''real utility'' come apart
  — weakness of will, a misread label, a menu that frames things badly, an addict''s
  fix — gets explained away as a case where the choice didn''t reflect the agent''s
  preferences. That''s unfalsifiability by construction. And your alternative evidence,
  asking people, is just more behavior, and worse behavior: cheap, unincentivized,
  and famously out of step with what people do. We at least have the virtue of using
  the data where the agent stakes something."


  Move 4 (Dana): "Choice isn''t behaviorally privileged either. Take Nadia, who pays
  $50 for an app that blocks her from ordering delivery after 9pm. Her larger menu
  contained everything the blocked one did: she could always have declined to order.
  If extra options can never make a chooser worse off, then her paying to have them
