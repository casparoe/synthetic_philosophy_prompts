  ---


  I host a small interview podcast — long conversations with one guest about the single
  thing they''ve spent years on. I have no academic background; I came to philosophy
  of science on my own a few years ago and have kept reading since, so I need questions
  that don''t depend on my knowing the literature''s shorthand, and that I can still
  steer when an answer goes somewhere I didn''t expect.


  Next week''s guest is a philosopher of science who has spent about a decade defending
  what she calls the Abandonment Test. The shape of it, as I take it from her short
  book: she thinks the tradition that asks whether a theory is testable has been looking
  at the wrong object, because no observation has ever refuted a theory by itself
  and no theory has ever been given up because of one observation. On her account,
  what makes something science is a property of a community rather than of a claim:
  a field is scientific to the degree that it (i) says in advance what findings would
  count against its central commitments, (ii) runs institutions — journals that publish
  failed replications, funders who pay for attempts to break a result, career credit
  for the people who break it, a working norm against reinterpreting a failure after
  the fact — that reliably convert those findings into change, and (iii) has a record
  of its central claims actually changing or dying when the findings arrive. She also
  drops any separate requirement about content: nothing about what the claims concern,
  or whether a single person could in principle test them. She accepts the consequences
  she thinks follow — that the verdict is comparative and comes in degrees, that it
  applies to fields and not sentences, and that it can rank a social science above
  a branch of physics.


  What I want from you is ten interview questions, plus for each one the answer I
  should expect and a follow-up that only lands if she gives it. Concretely:


  [numbered asks]


  I''d also like the order to be deliberate...


  Format...


