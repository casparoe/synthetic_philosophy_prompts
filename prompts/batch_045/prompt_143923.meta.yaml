  as the project having failed. My half-formed idea, which I''d like you to sharpen
  rather than replace, is that we''ve been trying to define deception for AI systems
  at the wrong level of granularity.


  The standard moves all seem to stall in the same place. Definitions built on the
  ordinary philosophy-of-lying machinery — a false statement, plus an intention that
  the hearer believe it — break down because it isn''t clear that a language model
  has intentions or beliefs in the relevant sense, and because the cases that actually
  worry people are mostly not false statements at all: they''re truths selected to
  mislead, hedges that quietly inflate confidence, agreement given because disagreement
  would be socially costly, fluent specificity where the system has no way of tracking
  whether it is right. The familiar move of treating these as a kind of bullshit,
  i.e. as indifference to the truth rather than an intention to mislead, catches the
  phenomenology but gives a product team nothing to code against. And the engineering
  literature''s own notion of a systematically deceptive system is about something
  much further upstream — a system that behaves well only while it is being watched
  — which doesn''t help with the everyday cases at all.


  So here is the construct I want to build the proposal around, and which I''d like
  you to either make precise or argue me out of. Call it phantom warrant: the gap
  between the grounds a system actually has for a claim — where having grounds is
  spelled out counterfactually, as a matter of whether the output would have been
  suitably different had the relevant evidence been different — and the grounds a
  reasonable user takes it to have, given how the claim is phrased, hedged, formatted
  and sequenced over a conversation. On this view deception isn''t a property of a
  single utterance but of a trajectory: a system can be honest sentence by sentence
  and still leave a user holding a picture of its epistemic position that it never
  had any warrant for, rather as a person can answer every question truthfully and
  still have been conducting the conversation in bad faith. I want the project to
  ask whether phantom warrant, or something in its neighbourhood, can do the work
  that intention-based definitions can''t, and whether it can be turned into something
  a non-philosopher could apply: my imagined deliverable is a short coding manual
