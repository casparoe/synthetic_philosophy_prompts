  The practice: A court requires the dissenting judge to still apply the majority''s
  rule in future cases (stare decisis), i.e., the institution treats the body''s decision
  as authoritative for action even for those who think it wrong — while simultaneously
  the individual is permitted (even expected) to maintain publicly that it was wrongly
