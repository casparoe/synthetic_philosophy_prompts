  belief and acceptance (Cohen''s "acceptance"), or between what to believe and what
  to do/authority. Also the "we do X here, Y there" inconsistency: the same judge
  who wrote a scathing dissent dissenting from denial of cert will later vote to reaffirm
  the precedent on stare decisis grounds, and may criticize colleagues for wanting
  to overrule it — i.e., they defend the very holding they called egregious. What
  view of peer disagreement does that presuppose? Something like: the fact of a decision
