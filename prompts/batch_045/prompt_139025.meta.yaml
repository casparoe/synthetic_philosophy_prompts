  they ran with the tweak, and now I have to tell them who was right, so here goes.


  In my version the subject isn''t simply blind from birth; she''s a 30-year-old woman,
  blind from birth from dense congenital cataracts, who for the last eight years has
  been a heavy user of a sensory substitution device: a head-mounted camera whose
  output is turned into a moving pattern of tingles on a grid on her tongue. She''s
  expert with it — she navigates a building, reaches for the right object on a cluttered
  table, and can tell a coffee mug from a bowl by moving her head and "looking" with
  her tongue. Now the cataracts are removed and she can see. Cube and sphere on a
  table in front of her, no touching: does she tell which is which?


  Ines: yes, straight away. Her argument: the device already delivers shape. It''s
  distal (about the object, not the tongue), spatial, and perspectival in the same
  way vision is — she has to move her head to get more of the object, and the array
  changes as she does. So her brain has already learned to extract three-dimensional
  shape from a stream of sensor readings that shift with her own movement. Vision
  is just another such stream. If there''s anything to Molyneux''s question it can''t
  be about the physics of the proximal stimulus, because that differs wildly anyway
  between tongues and tongues and eyes.


  Tobias: that only works if you''ve already decided the two experiences share a content.
  He said the thing that''s shared is at best a label — "cubical" — applied from outside,
  and that''s not what the question was about. Otherwise the question is settled by
  stipulation: pick any description abstract enough to cover both modalities ("represents
  a cube-shaped distal object") and of course it''s shared.


  Ines: not stipulation, a bet with a testable edge. She conceded that straight-off
  recognition might fail and said it doesn''t matter, because the real question is
  transfer: if her tactile experience of shape is doing the work, she should learn
  to match seen shapes to felt ones much faster than someone whose cataracts were
  removed without those eight years of device use, and she should make distinctive
  errors (getting shape right while being hopeless at, say, telling a shadow from
  a dark surface, or at faces). If the answer is just "no transfer, vision starts
  from scratch," then Molyneux''s question was never about shape in particular.


  Tobias: fine, but now the "yes" answer is too cheap. Suppose she correctly says
  "cube" on the first go. That''s a judgement, maybe a fast inference from shading
  and edges to a shape she knows by touch. It doesn''t show her visual experience
