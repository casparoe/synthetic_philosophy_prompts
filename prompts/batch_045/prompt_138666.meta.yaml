  show you can''t have a specific package simultaneously, so you must choose which
  criterion to prioritize and why (normative choice, not math). And "equal base rates"
  as a fairness goal is itself contested (base rates may reflect the outcome you''re
  predicting, including biased outcome measurement — the "selective labels"/"infra-marginal"
  issues, and unequal base rates might be the thing you''d want to fix rather than
  assume).

