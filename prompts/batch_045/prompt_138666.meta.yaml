  knowable, or restrict the quantifier), or reject classical logic, or restrict the
  claim to a language that can''t express self-referential constructions (e.g., Tennant''s
  restriction to "Cartesian propositions", or restricting the K-operator''s iteration,
  or type restrictions, or the Church–Fitch for actual knowability vs. possible knowability).


  Common confusions: that Fitch''s paradox refutes anti-realism about a domain wholesale
  (it only refutes the naive knowability principle in its strong form); that verificationism
  = "all truths are knowable"; that the paradox shows there are unknowable truths
  in a substantive metaphysical sense (the conclusion is that if all truths are knowable
