  Then the wrinkle about hiddenness: two versions, doxastic vs discursive.


  "Here''s where I think there''s a distinction that actually saves him, and I want
  you to stress-test it. The hiddenness requirement comes in two flavors:

  (a) doxastic: the machine needs people to actually believe the justice story; if
  they stop believing, compliance goes.

  (b) discursive: what matters is that the justice story is what gets said in public
  — in laws, edicts, official speech — regardless of what people privately know. On
  (b), common knowledge is fine; avowal is what breaks it.

  If it''s (b), Pascal isn''t doing psychology at all, he''s making a claim about
  the vocabulary public power has to speak in, which lands him somewhere much weirder
  — closer to a public-justification view than to a debunking genealogy. Also (b)
  seems to fit better with the bit in the discourse to the young nobleman where he''s
  told not to disabuse the people about the basis of their deference: the instruction
