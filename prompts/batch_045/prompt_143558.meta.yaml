  be obeyed; justice without force is impotent, force without justice is tyrannical;
  but since we can''t make the just strong, we made the strong just.

  - He also denies relativism in one breath: he says there is a genuine natural justice/natural
  law, but corrupt custom ("la coutume") destroys or obscures it, becoming a second
  nature; so people can''t tell which laws are natural.

  - He thinks this arrangement has to be hidden: it''s important that nobody lets
  on that force is doing the work; the fiction has to be maintained, and in fact people
