  Reading A ("labeling"): ''just'' is semantically whatever force backs — the word
  is a name the winners get to hand out.

  Reading B ("epistemic"): there IS a real justice but we''re so epistemically wrecked
  by custom that we need a decision procedure, and force is the tie-breaker / a proxy
  that the parties can coordinate on.

  Reading C ("obligation-transfer"/"disorder-avoidance"): there''s no general obligation
  to obey the strongest, but there IS a duty not to plunge things into dispute/disorder,
  so the obligation to obey is genuinely derived, not manufactured: you owe compliance
  to whoever can settle it, because the alternative is worse, not because they''re
  just.


