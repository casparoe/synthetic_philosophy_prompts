  tuned and prompted to attach calibrated uncertainty to factual claims rather than
  assert flatly; to lay out several viewpoints on contested questions instead of arguing
  for one; to append disclaimers when a topic touches medicine, law, or finance; to
  keep the tone warm, agreeable and non-charismatic; and, since the anti-sycophancy
  work, to refuse to simply mirror whatever the user already believes. At the same
  time the whole thing is wrapped in an upbeat, agreeable register and the product
  is tuned for user satisfaction and retention, which is its own quiet influence on
  what people end up thinking. Assume for the sake of the question that the system
  these guidelines will be applied to is far better at reasoning and at arguing than
  any human, can model individual users in detail, and can pick from thousands of
  phrasings the one that will most reliably move a particular person.


  What I can''t get straight is whether "inform, don''t persuade" is even a coherent
  target, and if it is, what has to be true for it to be. Two things my colleagues
  keep proposing make me think the norm is doing more work than it looks. The first
  is what one of them calls persuasion-neutral packaging: the phrasing, ordering,
  tone and framing of a message shouldn''t add to or subtract from the uptake the
  message''s content would get on its own — a listener who trusts the system completely
  and one who distrusts it should move by the same amount, because only the evidence
  should be doing the work. The second is that a system that much smarter than us
  should deliberately stop short of conclusion-compression: give the user the considerations,
  the base rates, the cruxes, and let the human do the update, because a conclusion
  handed down without the reasoning that supports it is, to the person receiving it,
  indistinguishable from pure persuasion. And then there''s a smaller thing I noticed:
  on anything touching values the guidelines say the assistant defers to the user,
  which is itself a way of making the user''s view feel endorsed.


  So my question is: what does this whole package of norms presuppose? Is there a
  defensible line between transmitting information and influencing someone''s beliefs,
  or is the distinction the practice rests on really doing some other work — a claim
  about the listener''s autonomy, about who''s accountable when things go wrong, about
  a division of labour where the system supplies means and the human supplies ends,
  or about the difference between changing someone''s mind by giving them reasons
  and changing it some other way? I''d like the implicit theory reconstructed, and
  I''d like to know which parts of the practice strictly presuppose it and which merely
  sit comfortably with it, since I suspect several quite different theories would
