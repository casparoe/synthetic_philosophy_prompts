  later events alter what was true of earlier ones) and to argue only about the methodological
  version: whether historians can, should, or even could avoid judging and describing
  the past by the standards of their own time. He then offered the following, and
  I conceded each step as it came.


  (1) Framing is inescapable. Any history requires a selection of topic, a periodization,
  a vocabulary, and a sense of which differences among past materials are significant.
  None of these can be drawn from nowhere; they must be drawn from concepts available
  to the historian now. A history with no present framework is not an ideal we fail
  to reach; it is not a possible object.


  (2) So a historian cannot avoid the framework she in fact employs. Whatever she
  writes, she writes under some present set of standards; there is no external vantage
  from which to choose or reject it.


  (3) Ought implies can. If she could not have avoided writing under that framework,
  she is not open to criticism for writing under it.


  (4) Therefore presentism is not a vice. It is the condition under which history
  is written. The familiar complaint that some historian has illegitimately imposed
  her own time''s categories on the past — the Cambridge-school strictures against
  anachronism, the old objection to Whig narratives — is, taken strictly, a demand
  that cannot be met by anyone, and a demand that cannot be met by anyone is not a
  demand.


  (5) The reasoning is temporally symmetric; call it the Diachronic Parity Principle:
  if a historian''s present framework cannot be a ground of criticism, then no historian''s
  can, including those who will write about us. He put the case concretely: imagine
  historians of 2320, rigorous and evidence-hungry, who describe our liberal democracies
  as a regime of managed appetite and our medicine as a form of systematic cruelty,
  and who organize their narrative entirely around the catastrophe they think we were
  sleepwalking into. On the argument so far there is no methodological defect to point
  to; there is only a framework we happen not to share.


