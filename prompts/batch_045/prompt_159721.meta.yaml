  with a wink, the newsletter editor who prints a lie about which houses have typhoid
  — none of them cause harm in the relevant sense.


  (7) Therefore, if the harm principle is the whole of the state''s legitimate coercive
  authority over speech, none of it is punishable: the editor walks, the perjurer
  walks, the man who pays a neighbor to burn a barn walks.


