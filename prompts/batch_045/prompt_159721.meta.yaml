  Final argument (7 steps):


  (1) [Harm principle] The only conduct the state may coercively prevent is conduct
  that causes harm to others — harm, as opposed to mere offense, shock, or dislike,
  and as opposed to harm to the speaker himself.


  (2) [Uptake-mediation] An utterance can contribute to a harm only by way of uptake:
  it has to change what some hearer believes, wants, or takes herself to be permitted
  to do. Words are just marks and noises; nothing bad happens unless someone takes
  them up.


  (3) [Own-agency] When a hearer acts on uptake, what explains her act is her own
  deliberation — she weighed what she heard and chose. And an utterance that merely
  gives someone a reason to act is not a cause of her act in the sense the harm principle
  needs; the teacher who explains how nitroglycerin works doesn''t cause the bombing.
  (So: harms via uptake are harms the hearer causes, not the speaker.)


  (4) [Corn-dealer generalization / parasitic harms] Mill''s own corn-dealer case:
  someone publishes that corn dealers starve the poor; a crowd gathers and breaks
  windows; the writer still isn''t punishable, because the harm exists only because
  third parties chose to respond to a true (or at least arguable) claim by rioting.
  Call these parasitic harms. But every uptake-mediated harm is parasitic in exactly
  this sense: it happens only because a free hearer responded as she did. So no uptake-mediated
  harm is one the speaker causes either.


  (5) [Warrant-uptake is not a special case] Objection: sometimes the hearer isn''t
  just informed, she''s licensed — she acts because the speaker said so, and would
  say "he told me I could," so the speaker''s say-so is part of why the act happened
  and the speaker is a kind of co-author. Reply: that''s still uptake. The hearer''s
  treating someone as an authority is itself a belief she formed and acted on; if
  own-agency screens off the speaker in the belief case it screens him off here. Call
  this warrant-uptake; it''s uptake with extra psychology, not a different causal
  structure.


