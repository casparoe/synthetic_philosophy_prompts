  I''ve got to write a short essay for my political philosophy reading group — we
  spent the last few weeks on the "equality of what" stuff (Sen''s functionings and
  capabilities, Dworkin on resources and the envy test, Cohen on expensive tastes
  and access to advantage, Arneson on opportunity for welfare, Nussbaum''s list, the
  usual luck-egalitarian arguments and the harshness/disrespect objections) — and
  someone offhandedly said Gattaca makes a good teaching example, which I think is
  true but everyone always reads it the same lazy way: genetic discrimination bad,
  meritocracy good, spirit beats DNA. I want to do something less obvious with it.


  Here''s the angle I keep circling around. Vincent doesn''t seem to be demanding
  equality of resources — nobody is stopping him from buying things — and he doesn''t
  seem to be demanding equality of welfare either; he''s not saying he''s unhappy
  and wants to be cheered up. What he wants, it seems to me, is something like equality
  of conversion standing: he wants his effort and training to turn into the same functionings
  (being an astronaut, being taken seriously as a candidate) as anyone else''s effort
  and training, and what actually blocks that isn''t his heart or his genes as such
  but the fact that his genes are public — the whole machinery of urine tests, hair
  samples, blood draws. So the film''s complaint would be less "endowments should
  be compensated" and more "your brute-luck deficits shouldn''t be admissible evidence
  against you," which I think is a different position, and maybe a more interesting
  one. Relatedly: Vincent would be insulted by being offered compensation for his
  genome, but he has no problem buying Eugene''s genetic material on the black market,
  which seems to me to press right on the luck-egalitarian harshness objection. And
  there''s a question I can''t settle: for the child, is being born without the edits
  brute luck or something like option luck, given that the parents chose?


