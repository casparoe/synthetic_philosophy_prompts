  quality — its treaty settlement entrenches a substantive policy orientation (open
  markets undistorted, price stability, an independent competition and state-aid regime)
  beyond the reach of ordinary electoral reversal — while remaining formally a treaty
  order whose basic commitments can only be changed by unanimous revision. Call this
  the asymmetry: within the delegated field, decisions are made by qualified majority
  and enforced by courts with direct effect and supremacy; the boundaries of the field
  are near-immovable.

  - Hence the "reversibility condition": a delegation of sovereign power is democratically
  legitimate only if those who delegated can recover it through an ordinary, anticipated,
  non-existential political process. Article 50 is not such a process: it''s all-or-nothing
  and therefore never actually used against a specific policy; it can''t be a credible
  instrument of ordinary contestation. So the EU fails the condition, and this, not
  parliamentary weakness, is the core of the "democratic deficit."

  - Prescription: a Competence Return Procedure (CRP): (a) trigger by national parliaments
  (a "red card" upgraded from the subsidiarity orange/yellow card) or by a citizens''
  initiative-style threshold; (b) a fixed period of deliberation with a published
  competence audit (who gains, who loses, what the externalities are, e.g., on the
  internal market and on other member states); (c) a Council decision by reversed
