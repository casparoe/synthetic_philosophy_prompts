  Draft:


  "I''m drafting a short piece on why ''I never technically lied'' is a bad defence,
  and before I write it I want to know whether my own position on lying vs. misleading
  actually hangs together. Here''s the package, roughly in the order I''d defend it:


  (1) Lying = you assert what you believe false, aiming at the hearer believing it.
  Misleading (paltering, if you like: literally true sentences picked because of how
  they''ll land) is getting someone to a false belief some other way.

  (2) The difference is real and isn''t just consequential: lies are pro tanto worse,
  and not merely because they''re riskier or more likely to blow up on you.

  (3) It''s still a lie, and still wrong, if the hearer sees straight through you
  and you knew they would.

  (4) The best story I have for (2) is about assertion specifically: when you assert
  you explicitly invite someone to take your word, you stake your credibility, you
  put yourself on the record in a way you don''t when you merely leave them an inference
  to draw.

  (5) But in ordinary life, paltering is basically as bad as lying, and the test I
  keep using for this is what I call the transcript test: replay the exact sentence
  to a neutral third party who knows the conventions of the setting; if they''d say
  ''she told him the false thing'', it''s a lie in all but name and just as bad. If
  they''d say ''well, strictly, she told him the truth'', it''s a lesser wrong.

  (6) No duty to volunteer: selling a bike I know has a cracked frame and saying nothing
  when the buyer never asks is permissible, even knowing they''d walk away if they
  knew.

  (7) Lying to the guy at the door asking where my friend is, surprise parties, bluffing
  in poker — all fine.

  (8) Perjury law ought to be able to reach the technically-true answer that was built
