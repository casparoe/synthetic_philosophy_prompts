  ---


  I have been walking around with an argument about sphexishness for a term now, and
  I cannot tell whether I have discovered something or committed a fallacy. I would
  like you to locate the step and then commit to a verdict.


  The case is the usual one, which I will stipulate rather than defend (I am told
  the original field reports are shakier than textbooks suggest): a digger wasp paralyzes
  a cricket, drags it to the mouth of her burrow, leaves it there, goes inside to
  inspect the nest, comes back out, and drags the cricket in. If, while she is inside,
  the cricket is moved a few inches away, she returns it to the threshold and then
  goes in to inspect again — and does this repeatedly, apparently without ever "noticing"
  that the cricket was already in place and that only the inspection remained to be
  done.


  The standard gloss is that her routine is rigid: it tracks an internal stage counter
  rather than the state of the world, and that is what makes it mechanical rather
  than free. Two stipulations I will build on:


  - Call a routine rigid-at-grain-g if, for any perturbation of the world that occurs
  within an interval shorter than g, the subsequent stages of the routine are unchanged.

  - Call the sphex floor of a system the smallest g at which it is not rigid.


  Then:


  (1) Every system that acts in time has a sphex floor: sensing, transmission, and
  deliberation all take time, so there is some interval below which no system can
  take the world''s current state into account. So no system is flexible at every
  grain, and in that sense everything — us included — is sphexish at some grain.


  (2) But rigidity cannot be the defect the standard gloss says it is, because some
  rigidity is constitutive of agency. Consider the hyperplastic agent: one whose sphex
  floor is zero, i.e., one that re-plans from scratch after every perturbation, at
  arbitrarily fine grain. Such a system never completes anything, since there is always
  some perturbation to which it has not yet responded. Any routine long enough to
  achieve a distal goal requires committing to intermediate stages despite perturbations
  that would countermand them. So the wasp''s fault, if it has one, cannot be that
  she is rigid; it must be that she is rigid at the wrong grain, or in the wrong place.


  (3) "The wrong grain" is not a property of the behavior. Coarsen the description
  and the same sequence is flexible: perturb the cricket at intervals longer than
  one full cycle and she provisions the nest successfully; coarsen further and she
  adjusts her hunting to the prey available that season. Whether a stretch of behavior
  counts as rigid therefore depends on the grain at which you describe it.


  (4) Nothing in the creature fixes the grain. Grain is set by whoever is asking —
  a field worker interested in the provisioning cycle, a neuroethologist interested
  in milliseconds, a philosopher interested in accountability. So ''sphexish'' does
  not name a property the system has; it names a relation between a system and an
  observer''s interest.


  (5) If (4) is right, then the contrast the wasp case is used to draw — mechanical
  rigidity versus genuine flexible agency — is not a contrast in the world, and the
  case cannot be evidence about free will. It can at best be evidence about how suggestive
  a description sounds.


  (6) But that conclusion is unacceptable to me, for two reasons. First, the argument
  generalizes: by the same reasoning, a chess program''s search, a pilot''s checklist,
  and a person''s resolution to keep a promise are all sphexish at some grain and
  flexible at another, and we would have to say that no distinction between following
  a rule and exercising judgment survives. Second, if rigidity is grain-relative all
  the way down, then the compatibilist who wants to say that free action is action
  produced by the right kind of flexible mechanism has nothing left to say against
  the incompatibilist, since the incompatibilist can always redescribe at a finer
  grain.


  (7) So either I have shown that the notion of sphexishness does no philosophical
  work, or one of (1)–(4) is false. I would rather keep (2) — the point about the
  hyperplastic agent — than keep (5): it seems to me clearly right that a creature
  that never finished anything would not be more of an agent, and that is worth more
  to me than the tidy conclusion.


  My suspicion is that something equivocates between a grain of description and a
