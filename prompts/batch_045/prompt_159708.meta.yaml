  Argument design:


  Setup: define sphexishness as rigidity of the feedback loop: the wasp''s routine
  re-runs from a fixed earlier stage rather than resuming from the current state;
  the behavior is insensitive to the actual current state of the world (cricket already
  at threshold → still drags it to threshold again).


  Step 1: The intuitive lesson: what makes the wasp''s behavior mechanical — and what
  we take to be the opposite of free, flexible agency — is not that it is caused or
  even that it''s innate, but that the routine tracks an internal counter rather than
  the world. (Define: a routine is sphexish at grain-size g if perturbing the world
  at intervals shorter than g leaves the routine''s later stages unchanged.)


  Step 2: (The generalization) Any finite agent must act at some temporal grain; there
  is a smallest interval g* below which its control loop can''t sample the world (sensor
  lags, neural conduction, deliberation time). So every agent''s routines are sphexish
  at some grain — there''s a "sphex floor" for every system, including us. (Novel
  idea: "sphex floor" / "grain-relative sphexishness".)


  Step 3: Moreover, the wasp''s behavior, described at a coarser grain, is flexible:
  it re-runs the routine because the cricket isn''t where it "should" be — it responds
  to the perturbation by re-achieving the subgoal; and if you perturb at a grain coarser
  than the loop''s reset time, the wasp''s overall behavior (dig, hunt, provision,
  lay egg) is highly adaptive and goal-directed. So the same behavior is flexible
  at one grain and rigid at another. (Grain-relativity → the property isn''t intrinsic
  to the behavior.)


  Step 4: If sphexishness is grain-relative, then "is this creature sphexish?" has
  no answer without fixing a grain, and the grain is set by the observer''s interests,
  not by the creature. So the distinction between mechanical rigidity and flexible
  agency is not a distinction in the world.


  Step 5: (Scope shift / modal slide) Therefore either (a) every system — including
  human beings — is sphexish, and free will is an illusion everywhere; or (b) no system
  is sphexish in the sense that matters, and the wasp case tells us nothing about
  free will. Either way the concept does no work.


