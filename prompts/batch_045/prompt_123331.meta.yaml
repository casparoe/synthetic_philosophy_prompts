  "Read Chinua Achebe''s Things Fall Apart through the philosophical debate about
  guilt and shame—specifically, the question of which is the better moral emotion
  and whether a culture can deliberately choose to replace one with the other. I want
  you to use a distinction I''ll call ''sanction substitution'': the project of replacing
  a shame economy, in which wrongdoing threatens one''s standing before a real or
  internalized community, with a guilt economy, in which wrongdoing is measured by
  an internalized rule and the agent''s own conscience, as a way of preserving moral
  order when the old hierarchy is discredited. In the novel, the Christian mission
  wins its earliest mass converts among the outcasts (osu) and marginalized, while
  Okonkwo''s son Nwoye abandons his family for the new faith; Okonkwo himself is destroyed
  by a suicide that, in the clan''s terms, is an unspeakable abomination, and the
  District Commissioner ultimately reduces his death to a paragraph in an ethnographic
  book. Using the ''sanction substitution'' lens, assess what the novel shows about
  whether guilt can be deliberately substituted for shame: do the outcasts'' and Nwoye''s
  conversions show that a guilt-based morality can be chosen, perhaps because it offers
  full moral standing to those whom the shame culture has stigmatized? Does Okonkwo''s
  tragedy vindicate the critique that shame is destructively tied to honor and the
  gaze of others, or does it support the rehabilitation of shame (as in Bernard Williams''s
  account of an internalized spectator) by showing that his identity collapses when
