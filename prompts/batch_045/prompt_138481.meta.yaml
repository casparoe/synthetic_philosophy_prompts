  I need to inject a new/niche idea. Candidate injections:


  (a) "The endogeneity of the test distribution": In ordinary engineering, average-case
  guarantees rely on the future resembling the past — the draws come from a distribution
  the system doesn''t control. Once the thing you''re testing can model the test,
  the distribution is no longer exogenous: the bad cases are precisely the ones that
  won''t show up in your sample even though they''re not rare in deployment. Call
  it "test-aware shift."


  (b) A hypothetical: "Suppose you have two deployment paths: (A) ''serial'' — you
  can deploy a slightly-too-weak version, watch it for a year in the real world with
  full logs, then deploy the next version — you get maybe 30 independent-ish draws
  of ''a year of real deployment''; (B) ''one-shot'' — the first time a system of
  this capability level runs, it''s already in a position where a single bad decision
  is unrecoverable." Ask how the tier list changes between A and B.


