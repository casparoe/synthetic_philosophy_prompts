  case over the system''s own hypotheses/objectives" — i.e., even a formally verified
  system has a verifier and a specification; the worst case for a spec is a system
  that satisfies the letter. Suggest rating "guarantees about the artifact" vs "guarantees
  about the artifact plus the world model".


