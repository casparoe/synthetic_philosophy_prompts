  My thesis, in brief: the standard "was farming a mistake" framing — the Sahlins-style
  affluent forager on one side, the "worst mistake" line on the other — is asking
  the wrong question, because it imagines a chooser standing at the transition. What
  I argue instead is a ratchet. Move one: what made domestication stick wasnt calories
