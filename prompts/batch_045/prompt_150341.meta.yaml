  Let me draft the moves:


  Setting: two friends (both logicians-ish, one a philosopher of language) argued
  after a department colloquium on Carroll''s dialogue.


  Move 1 (Norah): The Tortoise''s demand is a category mistake. It asks Achilles to
  write down as a further premise "if A and A→B then B." But premises are truth-evaluable;
  rules of inference are not — they''re permissions to move. You can''t discharge
  a rule by adding it as a premise, because adding it only gives you something else
  to which the rule must be applied. That''s the whole regress, and it''s a reductio
  of the demand, not of deduction. So the dialogue shows nothing about the justification
  of deduction; it''s a joke about confusing rules with premises.


  Move 2 (Ellis): Right as far as it goes, but the category point is a label, not
  an answer. There are two different things the Tortoise might be after: (i) a premise
  that states the rule — that''s the joke reading; (ii) a reason to accept the rule
  — the normative reading. On (ii), "rules aren''t truth-evaluable, they''re licenses"
  answers nothing: the Tortoise is asking what makes the license a good one. And if
  you answer "nothing — we just follow them," you''ve conceded that deduction rests
  on a brute disposition, which is exactly what the Tortoise was needling.


  Move 3 (Norah): Fine — let''s grant the normative reading. But now consider what
  would satisfy it. Suppose we give the Tortoise not one extra premise but the whole
  infinite family: C0 = if A and A→B then B; C1 = if A and A→B and C0 then B; ...
  all the way up, and suppose the Tortoise accepts all of them at once (say it has
  them dispositionally, or its notebook is magical). Still it can''t reach B, because
  every conditional in the family is useless without detachment. So the regress isn''t
  a problem about how many premises we can stack or whether we can finish an infinite
  chain — it''s entirely about whether the Tortoise accepts the rule. That shows the
  normative demand isn''t answered by more content, and so it can''t be a demand for
  content. It''s either empty or it''s a demand to be given something that isn''t
  the sort of thing that can be given.


  Move 4 (Ellis): That''s a nice argument, and I agree it kills the "more premises"
  reading. But it also shows something you don''t want: it shows that what''s at issue
  is acceptance of a rule, and acceptance of a rule can be more or less justified.
  Compare: a student who accepts "from ''all Fs are G'' and ''a is F'' infer ''a is
  G''" is fine; a student who accepts "from ''everyone loves someone'' infer ''there''s
  someone everyone loves''" has taken on a bad license. We tell them the second rule
  isn''t truth-preserving. So there is a standard for licenses, and the Tortoise is
  asking after the standard — not for another line in the notebook. And the answer
  can''t just be "the rules fix the meanings of the connectives": a connective can
  be given introduction and elimination rules that don''t balance (the classic joke
  connective that lets you get from any truth to any other), so rule-following alone
  doesn''t confer warrant.


  Move 5 (Norah): Agreed that licenses have a standard — truth-preservation — but
  now the dialectic turns: to show that modus ponens is truth-preserving, you reason
  with modus ponens. So any justification we can offer uses the very rule in question:
  it''s circular. But there are two circularities. Justifying a rule by assuming it
  as a premise is premise-circularity, which is worthless. Using the rule while arguing
  for it is only rule-circularity, and that isn''t worthless: someone can know how
  to use "if" and still be unclear whether every instance of the rule preserves truth,
  so an argument that uses the rule once to establish something general about it can
  add something. (Also note: the Tortoise accepts A and A→B, so it already grasps
  "if" — it can''t simultaneously be a meaning-skeptic.)


  Move 6 (Ellis): The premise/rule-circularity move is where I get off. Rule-circularity
  is only informative if you can run the argument *while* suspending the rule — but
  you can''t suspend modus ponens and still argue. And "it can add something" is too
  weak: the Tortoise''s challenge is whether deduction is *justified*, not whether
  it can be given a pedagogically useful pat on the back. Besides, if rule-circularity
  were enough, then the bogus-quantifier-shift rule could be "justified" by an argument
  that uses it once.


  Then: a third point both might be missing: e.g., the distinction between (a) a justification
  of deduction addressed to someone outside the practice, and (b) a vindication from
  within; or the point that Carroll''s dialogue shows something about *explicit* vs
  *implicit* rules; or the model might note that the Tortoise''s acceptance conditions
