  Now, the philosophical core:

  - Knob-twiddling (Hofstadter): creativity = exploring a space of variations on a
  theme by adjusting parameters; the "crux" is that creative leaps are variations
  on a theme, and the space itself must be built up (the thematization). Key: creative
  = improbable in the space; trivial = nearby/central.

  - The law: novelty (statistical improbability of tokens) vs non-obviousness (structural
  accessibility to an ideal agent). So the law seems to presuppose that mere novelty
  (a variation nobody happened to instantiate) is insufficient: what matters is the
  difficulty of reaching the point in the space given the conceptual resources — i.e.,
  a metric on the space, not just occupancy. This distinguishes "knob settings nobody
  tried" from "knob settings reachable by routine knob-turning."

  - But the law resists full structural reduction: it uses "teaching away", "secondary
  considerations" (failure of others, commercial success) as proxies — presupposing
  that the space''s metric is not directly inspectable, and that the agents'' actual
  failures/successes are evidence about its topology. That''s an interesting tension:
  an objective structural test plus empirical/market evidence.

  - Also: the law''s PHOSITA is an "ordinary creativity" agent, i.e., it presupposes
  creativity is a graded capacity that even ordinary practitioners exercise — which
  fits knob-twiddling (everyone twiddles) and rules out a genius/muse/romantic view,
  and maybe rules out a view on which creativity is only in the production of radically
  new themes (paradigm shifts) — yet patent law does reward pioneering inventions
  more? Not really doctrinal (pioneer patents exist as a concept historically).

  - Also the "obvious to try" prong presupposes: exploration among a finite set of
  predictable options is not creative, even if the number of combinations is enormous
  — which suggests a distinction between combinatorial explosion and genuine conceptual
  distance. On a pure knob-twiddling view with a fixed space, searching a finite set
  is exactly what creativity consists in; so the law implicitly denies that creativeness
  = search effort/combinatorial size, and instead ties it to unpredictability of outcome.

  - Rival views ruled out: pure romantic/genius view (no metric, ineffable) — ruled
  out because PHOSITA + objective reach; pure statistical novelty view — ruled out
  by non-obviousness; pure economic/incentive view (inducement theory!) — the fetched
  page mentions the "inducement theory" famously (Merges & Duffy) — I could mention
  this: maybe the doctrine''s actual rationale is economic (weeding out inventions
  that would be produced without the incentive), which would mean it presupposes nothing
  interesting about creativity at all. That''s a fantastic "underdetermination" point
  to ask about: does the practice strictly presuppose a theory of creativity, or is
  it compatible with a purely economic rationale? The asker wants the answer to distinguish
  "strictly presupposes" from "merely fits well with." I can invite: "tell me whether
  the doctrine really needs a theory of creativity or whether it can be reconstructed
  entirely as an incentive-calibration device — and if the latter, what in the doctrine''s
  actual tests (e.g., ''teaching away'', ''unexpected results'') would become unmotivated."


