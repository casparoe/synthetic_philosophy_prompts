  To make it "in the weeds" and not regurgitation-friendly, I should inject my own
  distinctions/novel cases:


  1. Continuity tests: Is the present institution the same entity as the wrongdoer?
  Legal continuity (charter, endowment, assets), naming continuity, personnel continuity,
  or "beneficiary continuity" (holds assets acquired by the wrong).


  2. The asymmetry problem: institutions claim continuity for prestige/property and
  disclaim it for guilt ("continuity for benefit, discontinuity for blame"). Ask the
  procedure to forbid that: require the same continuity answer for both.


  3. Beneficiary vs. agent: guilt may not transfer but unjust enrichment might; so
  the remedy can be restitution without blame (like unjust enrichment in law, or "innocent
  possessor" of stolen goods). So distinguish "guilt-transfers" from "obligation-to-return-transfers."


  4. Constitutive vs. merely located wrongs: was the wrong done by the institution
  as such (a policy, a decision by its governing body) or by individuals who happened
  to be members (a professor''s eugenics advocacy)? Distinguishing institutional acts
  from acts of members.


  5. The "ongoingness" question: is the wrong over and done with (a one-time expropriation)
  or does it persist (an ongoing exclusion, an unreturned object, a continuing pattern
  of exclusion)? Ongoing wrongs need no theory of inherited guilt — the institution
  is guilty now, not then.


  6. The "standing to apologize" issue: who can apologize for what — can the institution''s
  president apologize for an act done by a predecessor? What does an apology by a
  non-culpable agent do? "Acknowledgment" vs. "confession" vs. "undertaking."


  7. Audience/descendant question: who are the wronged party''s successors? Held remains,
  a specific lineage, a diffuse group.


  8. Remedy proportionality and the risk of "cheap" gestures: what counts as a sufficient
  response; the difference between symbolic (renaming, memorial) and material (money,
  land, return) and the "cheap grace" problem — a gesture that costs the institution
  nothing and buys absolution.


