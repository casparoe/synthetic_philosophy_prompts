  Also, inject the "no cheap grace" test: a remedy is adequate only if it''s the one
  the wronged party''s successors would accept, and only if its cost is borne by the
  institution''s present purposes, not by a third party — and there''s a trap: remedies
  that cost the institution nothing (a plaque) can function as absolution purchased
  at no price; but conversely the procedure must not ratchet into maximalism.


  Also inject: "the counterfactual test" — would the institution be worse off but
  for the wrong? (but-for benefit). And the "clean hands of the transfer" question:
  did the institution acquire the benefit through a chain it could have refused?


  And: "the ''we'' test": can the institution say "we did this" — test: was the act
  performed by an agent acting under the institution''s rules or in its name, with
  resources it provided, and was it ratified (then or later)? Ratification matters:
  an act ratified later becomes the institution''s own; an act condemned at the time
  by the institution is not its act even if a member did it. That''s a nice concrete
  operationalization.


  Also the "honoring" twist: naming, portraits, named professorships are present-tense
  institutional speech — ongoing ratification. So a donor''s wrong becomes the institution''s
  present act through continued honoring. Nice and in-the-weeds.


  Also: the "descendant set" question: who is owed? If the wronged group has identifiable
  successors (a tribe, a family), the remedy is owed to them; if the group has been
  dispersed (slavery''s descendants are partly everybody), the remedy can''t be paid
  to a definite person, which changes what kinds of remedy make sense (programs, not
  payments). And a "no" branch: if no successor can be identified, the procedure doesn''t
  say "nothing owed", it says "payment to individuals is unavailable; the remedy must
  be to a class or none."


