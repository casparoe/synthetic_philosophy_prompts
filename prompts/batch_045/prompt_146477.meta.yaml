  Now craft the grading prompt. Let''s design the exam question:


  "I set the following question in an undergraduate philosophy course on ethics and
  markets.


  Question: Some philosophers distinguish objections to a market on the basis of harm
  from objections on the basis of repugnance, where a practice is repugnant when many
  people regard it as morally objectionable in a way that is not fully explained by
  its expected harmful consequences. Now consider the following proposal, which I
  will call the Care-Credit Kidney Plan. A state permits the buying and selling of
  kidneys, but only through a single monopsonistic agency. Sellers receive no money;
  they receive non-transferable health credits that can be redeemed only for future
  medical care for themselves or their immediate family, and that cannot be resold,
  gifted, or inherited. Buyers pay money to the agency, which uses it to fund public
  dialysis and transplant infrastructure. Supporters argue that the scheme removes
  the worst features of existing organ markets: it eliminates cash incentives to the
  poor, prevents a trade in body parts as ordinary commodities, and channels resources
  to the health system. Critics reply that it still commodifies the body and expresses
  the wrong attitude toward persons. Assess the Care-Credit Kidney Plan by using the
  harm/repugnance distinction and the idea of commodification. In particular, explain
  whether replacing cash with in-kind, non-transferable credits is enough to answer
  the commodification objection, and whether the persistence of repugnance would by
  itself be a decisive moral or legal reason to reject the plan."


