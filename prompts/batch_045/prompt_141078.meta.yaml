  kind, mere limitation or privation, is not something God could have eliminated by
  choosing better, since it is built into being a creature at all; some of the goods
  in the best world are inseparable from it.

  5. Whether a given individual is compossible with another is settled by an infinite
  analysis which only God completes, so our own judgments of possibility here are
  fallible in a way his are not.


