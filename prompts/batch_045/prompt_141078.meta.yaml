  1. Every possible individual has a complete concept, and two individuals are compossible
  just in case their complete concepts can be true of things in one and the same world;
  a possible world is a maximal set of compossible individuals.

  2. Every possible individual, merely in virtue of its possibility, has a kind of
  claim or tendency toward existence, proportional to the quantity of perfection or
  reality it contains, and these claims compete: not every possible can be actual,
  because some are incompossible with others.

  3. Hence the actual world is the one, among all maximal compossible collections,
