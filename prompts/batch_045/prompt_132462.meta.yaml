  a written checklist my team can work through on any candidate regularity before
  it is allowed into a model — questions in a fixed order, what counts as a sufficient
  answer to each, the points at which the procedure terminates in a refusal to extrapolate,
  and the points at which it has to stop and hand the question to the board because
  what remains is a judgement about how much risk the agency will carry rather than
  a judgement about evidence. Mark the steps where the person applying it has to use
