  me to Nelson Goodman, and I now think I know why: we had built our forecast on a
  predicate that fit the record exactly as well as the ordinary one and that no amount
  of past data could have distinguished from it — a grue-style predicate, defined
  partly by where our own record ends. What I cannot do is turn that insight into
  something my team can run.


