  Draft:


  " I teach an upper-level seminar on philosophies of history, and I want to close
  the term by using Tolkien''s The Lord of the Rings as a case rather than another
  excerpt from Spengler or Toynbee. The problem I keep hitting is that the book seems
  to be doing two incompatible things at once..."


  Then pose: at the civilizational scale it''s a decline narrative (loss: the Elves
  leave, the Rings fail, the Third Age ends) — Spenglerian; at the political scale
  it is restoration (the return of the king, the reunited kingdom of Gondor and Arnor)
  — which looks like the classical cycle of regimes turning back toward kingship;
  and at the moral/technological scale there is something like linear accumulation
  (Saruman''s industry, the Shire''s "reset"). Ask: reconstruct what view of history
  the work actually presupposes; is it coherent; is the "return" a closed restoration
  or a spiral; does the Fourth Age inaugurated differ in kind?


  Inject my taxonomy with names:


  - closed recurrence (same phase sequence, no inherited residue)

  - ratchet (each turn inherits the previous turn''s residue: technique, ruins, languages,
  demographic floors) — I''ll call it "inheritance-loaded" or "ratcheted"

  - damped/degenerate (amplitude shrinks toward a steady state — what Spengler would
  call civilization after culture, a "fellah" end-state rather than a crash)


  And a second injected distinction: unit-scale relativity — cycles of regimes/dynasties
  (Polybius''s rotation of constitutions; Ibn Khaldun''s generational asabiyya cycle)
  vs. cycles of whole cultures (Spengler''s organism) vs. Toynbee''s civilizational
  challenge-and-response. Note that a work of fiction with a three-thousand-year backstory
  can be cyclical at one scale and linear at another without inconsistency — and ask
  which scale Tolkien actually makes load-bearing.


  Third injected idea: the "restoration trap" — any restoration that succeeds must
  import the very capacities (centralization, standing force, machinery) that ended
  the thing it restores, so that it buys permanence at the cost of becoming the next
  cycle''s arrogance. Ask whether Aragorn''s reunited kingdom is shown as having bought
  into that trap (the crown restored, the fleet of the Corsairs taken, the Gates of
  Minas Tirith, theWhite City re-founded, the "rebuilding") or whether Tolkien shows
  a way out. And what the work''s answer is: maybe it''s that the Shire — small, low-tech,
  self-regulating — is the unit that escapes the trap, i.e., the escape from cyclical
  history is a change of scale rather than of regime.


  Also ask: does the destruction of the Ring make some forms of recurrence impossible
  ever after (the Elves'' Rings fail, the ages of enchantment end)? That is: the novel
  depicts the closing off of a cyclical possibility space — after the Ring, the kinds
  of beings and powers that could recur cannot recur. Interesting: "the One Ring''s
  destruction is an irreversible contraction of what can happen later" — a linear,
  one-way ratchet.


  Also ask about "where the reading is resisted": Tolkien was hostile to allegory;
  the work is Catholic (linear, providential, with a single irreversible direction)
  — so a Spenglerian reading of organismic decline conflicts with the creation/fall/redemption
  shape; the "eucatastrophe" (Tolkien''s coinage — well known, and it''s his term,
