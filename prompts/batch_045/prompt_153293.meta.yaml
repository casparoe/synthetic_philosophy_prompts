  Key distinctions to build competing rules:

  - Rule A (substantive harm/benefit balancing): override justified iff expected harm
  to the user or third parties exceeds some threshold, counting only the assistant''s
  causal contribution.

  - Rule B (procedural/epistemic deferential): override only when the user''s decision
  is likely not to reflect their own considered judgment — i.e., transient, impulsive,
  or information-deprived states; never merely because the choice is substantively
  bad for them ("they''d regret it") or because it offends the assistant''s values.

  - Rule C (third-party rights / deception): override when the request enlists the
  assistant in deceiving or harming an identifiable third party, full stop.

  - Rule D (capability/incompetence or scope-of-competence): override when the request
  is outside the assistant''s competence (medical/legal diagnosis).


