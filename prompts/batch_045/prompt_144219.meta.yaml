  \ unilateral action vs required unanimity vs required majority.\n\nActually the\
  \ unilateralist's curse fits really well with a decision body whose precedents involve:\
  \ (a) the action's upside is large and shared, (b) downside is catastrophic and\
  \ shared, (c) many other agents could also do the action, (d) information about\
  \ whether the case is a bad one is private / noisy.\n\nLet me think about what makes\
  \ good \"rules\" that fit the precedents but diverge on the new case:\n\nCandidate\
  \ rules:\n1. \"Curse-triggering\" rule: veto unilateral action whenever the downside\
  \ is catastrophic and others might also act — require collective agreement. (Expected-value-of-the-max\
  \ logic: the more agents who might act, the higher the chance someone acts badly.)\n\
  2. Simple expected-value rule: allow unilateral action if the actor's own expectation\
  \ is positive, regardless of distribution; just check the actor's expected value\
  \ estimate.\n3. Asymmetric-uncertainty / \"known unknowns\" rule: block when the\
  \ actor can't distinguish good from bad cases (i.e., when the sign of the value\
  \ is uncertain and the actor's info is weak), allow when the actor has good information\
  \ even if stakes are huge.\n4. Veto-rights / \"the curse is about the option value\
  \ of coordination\" rule: block when coordination is cheap and the decision is irreversible;\
  \ allow when reversible/cheap to coordinate later.\n5. A rule about whether the\
  \ harm is imposed on non-consenting third parties vs on the actor themselves.\n\n\
  So I need a set of precedents jointly consistent with, say, a \"magnitude-of-downside\"\
  \ rule and an \"information quality / actor's ability to tell good from bad cases\"\
  \ rule and a \"number of other potential actors\" rule — all of which usually travel\
  \ together in the classic unilateralist's curse setup, and a new case where they\
  \ diverge.\n\nHmm, but the domain must be philosophically meaty: the unilateralist's\
  \ curse. The track record should belong to a person or body. Good option: an EA-ish\
  \ \"community fund\" / a university's \"high-risk research committee\" / a biosafety\
  \ committee. Or maybe a fictional-but-plausible body: \"the oversight board of a\
  \ large philanthropic fund\". Or: an institutional review board for \"dual-use research\
  \ of concern\". Actually a really natural one: a \"dual-use / gain-of-function oversight\
  \ committee\" — but that's a bit loaded. Alternatively: a grantmaking committee\
  \ that has a \"single-member discretionary bucket\".\n\nI like: \"I'm on the PhD-student/postdoc-run\
  \ 'rapid response' grant committee\" — hmm, but the asker is a PhD student in a\
  \ related field (philosophy, decision theory, or maybe a biosecurity-adjacent field).\
  \ Let's make the asker a PhD student in philosophy (decision theory / social epistemology)\
  \ who is also on a \"high-risk research funding committee\" or who is advising one.\
  \ Actually, more natural: the asker is a PhD student who sits on their university's\
  \ \"Dual Use Research of Concern committee\" (DURC). Hmm, maybe too specialized.\n\
  \nAlternative framing that's cleaner and more purely decision-theoretic: a small\
  \ philanthropic fund's \"discretionary grants\" process where any one of five trustees\
  \ can commit up to £50k without the others. The precedents are the trustees' past\
  \ decisions to let a unilateral grant go through vs. to freeze it pending a vote.\
  \ New case: some concrete proposal.\n\nActually here's a nice twist: the curse is\
