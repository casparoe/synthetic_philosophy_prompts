  Here''s roughly where I''ve landed, as a list of commitments:


  (1) I think the core mechanism is statistical and distributional, not agential:
  a proxy is only correlated with the target over some range of cases, and optimizing
  hard moves the system out of that range, so the correlation breaks. On this picture
  you don''t need anyone to be clever or deceptive — a dumb hill-climber will do it,
  and the "law" isn''t really about incentives or intentions at all.


  (2) Related: I think the standard four-way taxonomy people use — regressional (the
  proxy was fit on limited data and you''re overfitting), extremal (you push into
  the tails where the fit was never good), causal (you intervene on something that
  used to be a mere effect of the good outcome, so the link breaks), and adversarial
  (a goal-directed system deliberately exploits the gap) — mostly collapses. The first
  three look to me like one phenomenon wearing three costumes, and only the fourth
  is genuinely different.


  (3) I think optimization pressure is the master variable: how badly things go is
  mostly a function of how hard you optimize, more than of how bad the proxy was to
  begin with. Practical upshot: I''m much more worried about someone taking a mediocre
  proxy and cranking the optimizer than about someone using a careful proxy at low
  pressure, and I''m suspicious of any proposal whose plan is "optimize really hard
  against this stand-in and hope."


