  ordinary objects are wholly present at every moment at which they exist, so persistence
  is a matter of one and the same three-dimensional thing showing up at different
  times with different properties. The perdurantists say objects are four-dimensional
  wholes made of temporal parts, with a temporal part at every instant they exist,
  so a persisting object is extended in time the way it is extended in space; and
  within the four-dimensional camp there''s a further split between worm theorists,
  who say I am the whole long thing, and stage theorists (exdurantists), who say I
  am a momentary stage and my talk about my past and future is made true by other
  stages bearing some identity-like counterpart relation to me. The same three or
  four arguments get wheeled out every week — the problem of change or temporary intrinsics
  (how can one thing be bent and then straight?), the coincidence puzzles (the statue
  and the clay, the ship and its planks), fission and fusion cases, and something
  about special relativity — and both sides have polished replies that the other side
  has already heard. Nobody has changed their mind in four months, and from what I
  gather the literature has looked roughly like this since Lewis''s discussion in
