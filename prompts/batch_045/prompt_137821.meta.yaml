  hey — I''m a novelist, mid-draft on a book about an AI thing going wrong, and I
  need someone to argue with me before I commit to a plot.


  My working view, which the book is built around: when this goes badly it''ll be
  drift, not seizure. Not a system that grabs power, but a long series of small, individually
  defensible re-specifications where the part we can measure keeps winning and the
  part we can''t quietly erodes. Nobody''s the villain, there''s no scene, there''s
  no moment where someone could''ve said no. Every safeguard is still formally in
  place; they''ve just become expensive to exercise.


  Two sub-versions I keep going back and forth between, and I''m not sure my plot
  can tell them apart: (a) the target stays fixed but the measurement of it degrades
  — the yardstick rots while the unit stays honest; (b) the measurement stays good
  but successive systems are handed the last system''s objective plus a small revision
  justified by the last system''s competence, so the original spec never gets re-audited
  against anything anyone currently values. I''ve been calling (b) competence laundering,
  and (a) yardstick rot.


  Related, and this is the bit I think is actually new: the orphaned objection. An
  objection raised at design time gets recorded, answered once, and then the world
  changes; the objection is preserved as text but not as a veto, so nobody re-checks
  whether the answer still holds.


  So: what would count against this? I want defeaters ranked. Specifically:

  - What would a takeover story require to be true that I''d have to actually see?
  I mean observable stuff, not thought experiments about agents in general.

  - Which of my claims are empirical and which are just consequences of how I''ve
  defined drift — and is the view insulated? If I''ve defined drift such that any
  smooth failure is drift and any abrupt one is the endpoint of a drift I didn''t
  notice, then there''s nothing that could count against it, and I should know that
  before I write 300 pages.

  - What would a committed drift person concede as counting against them, as opposed
  to what a takeover person would say? Those come apart and I only care about the
