  Alternative in-the-weeds injection: the distinction between the veto over *uses*
  and the veto over *users*: the city can''t regulate who lives there (fair housing:
  can''t exclude families with children, can''t exclude by race or, in many states,
  by source of income), but effectively can regulate who by regulating what''s built
  — exclusionary effects. That''s a rich, real, in-the-weeds tension: "we may not
  say who may live here, but we may decide that nothing can be built that they could
  afford." What does that presuppose? Does it presuppose a view on which exclusion
  is permissible if it is mediated by the market/structural rather than intentional?
  That''s a great "disparate impact vs. intent" wrinkle: the practice presupposes
  that a *structural* exclusion (via price) is categorically different from an *intentional*
  one (a sign saying "no renters"), even when the effect on who can live there is
  the same. That''s a genuinely interesting philosophical commitment: the practice
  presupposes a distinction between exclusionary *intent* and exclusionary *effect*
  / between the right to the city as a right of admission versus a right to shape.


