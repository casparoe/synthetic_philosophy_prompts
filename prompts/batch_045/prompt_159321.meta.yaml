  - Accepted grounds for denial include incompatibility with the neighborhood''s existing
  character, added traffic, loss of on-street parking, and shadow — none of which
  has to be quantified, and none of which has to be shown to reduce anyone''s property
  value.

  - Opponents may also sue under the state environmental review statute that the analysis
  was inadequate; this routinely adds a year or more, and the delays are part of what
  opponents are buying.

  - Building one large single-family house on the same lot, or tearing one down and
  replacing it, is by right: no notice, no hearing, no appeal, even when the resulting
  house is bigger and generates more traffic than the duplex would.

  - Fair-housing law forbids the city, and mostly forbids landlords and sellers, from
  choosing occupants by race, family status, or, in some states, source of income.
  So the neighborhood cannot say who may live on a street; but through the permit
  process it can, in practice, determine how much the housing there will cost and
