  Let me design the prompt:


  Setting: a mid-sized city, "the city I live in". The practice described concretely:


  - To build more than one unit on a lot zoned single-family, the developer needs
  a discretionary permit: mailed notice to owners of record within 300 feet, a public
  hearing, a council vote; "incompatibility with neighborhood character" and "traffic
  and parking" are accepted grounds for denial without any quantification or compensation.

  - Opponents can also appeal / sue under environmental review for inadequate analysis,
  adding years.

  - Meanwhile: (a) converting/extending/tearing down a single-family home, and building
  a new single-family home of any size, is by right — no hearing, though it creates
  the same traffic and parking; (b) the city now approves by right any project in
  which a set share of units is income-restricted and any project on a bus corridor,
  and the state has begun to override local denials, but only for housing, not for
  warehouses or big-box retail; (c) tenants are not notified even when the project
  replaces the building they live in; (d) someone who bought in last month has the
  same standing as someone whose family has been there for three generations; (e)
  the council explicitly counts how many people showed up and how many letters arrived,
  and treats a large turnout as itself a reason for denial; (f) neighbors who later
  get what they want (say, a park) don''t compensate; (g) the city also claims to
  have a housing crisis and a state mandate to build X units.


  The puzzle: the practice treats a group of currently-present, nearby, property-owning
  residents as the legitimate spokespeople for the neighborhood''s interests, and
  treats their willingness to pay (in time, in turnout, in lawyers) as a measure of
  harm — while denying standing to renters, to workers at the firms that can''t hire,
  and to the people who would live in the building, whose interests are equally intense
  and whose numbers are larger, and while denying the same veto over uses (warehouses,
  campus expansions) whose effects are larger.


  Question: What theory of the right to a place does this presuppose? Candidates to
  ask about:

  - Property/contract: homeownership as a share in a local collective asset whose
  value depends on the neighborhood''s character; the veto as protection of a specific
  investment that can''t be diversified (Fischel-ish "homevoter"). Then: does it require
  that the objector''s stake be financial? If so, why does the practice not require
  evidence of value loss, and why does it allow objections based on pure aesthetic
  preference?

  - Membership/self-determination: residents as a political community with a right
  to shape their common life (the "right to the city" in the Lefebvrian/Harvey sense
  vs. liberal "right of access"). Then: why is membership defined by parcel and radius
  rather than by years of presence, tenancy, or work? And does this view really need
  the property view?

  - Reliance/expectation: people planned their lives around a set of local public
  goods (school capacity, parking, quiet); the veto protects legitimate expectations.
  Then: why is the expectation of the 40-year resident not weighted more heavily than
  the newcomer''s? And why is expectation protected here but not against, e.g., a
  change in school boundaries or closure of a bus route?

  - Aggregative welfare: the practice is simply a mistake/interest-group capture;
  but then the asker wants to know whether the practice could be justified on welfarist
  grounds via local knowledge / decentralized information: residents know things planners
  don''t (which intersection is dangerous, which sewer backs up). That''s the "epistemic"
  justification: hearings as information elicitation. Then: does the practice''s design
  (counting turnout, allowing aesthetic objections, no quantification) fit the epistemic
  justification? Note the mismatch: informational hearings would record reasons, not
  headcounts.


  Also ask: distinguish what the practice strictly presupposes from what it merely
  fits with; where the practice is underdetermined (several theories license it);
  what would have to change under each rival: e.g., if the property view is right,
  objections should be tied to demonstrable value effects and compensable/tradeable;
  if the membership view is right, the franchise should extend to tenants and be defined
  by residence not ownership, and should include the right to *invite* development
  as well as to block it; if the reliance view is right, protection should be transition-relief
  and compensation, not veto; if the epistemic view is right, restructure hearings
  to elicit specific, checkable claims.


