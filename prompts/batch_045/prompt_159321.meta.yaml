  The practice: In many US cities, a proposal to build multi-unit housing on a parcel
  zoned for single-family use triggers: mailed notice to owners of record within a
  fixed radius (typically 300–500 feet), a public hearing where neighbors may testify,
  a staff report that weighs "compatibility with neighborhood character," "traffic,"
  "parking," and "shadows," and a discretionary vote by an elected or appointed body;
  denial need not be supported by quantified harm; and opponents may further sue under
  environmental review law on procedural grounds, delaying for years. Meanwhile: the
  same city grants ministerial (by-right, no hearing) approval for a single-family
  house on the same lot; it does not notify neighbors about a sale to a new owner,
  a conversion of an owner-occupied home into a short-term rental... hmm, actually
  many cities do regulate STRs. Let me choose contrasts carefully and hedge with "in
  many jurisdictions."


  Contrasts (the "we do X here but Y there"):

  1. The person who has owned for 40 years and the person who bought last month have
  identical standing; the person who has rented across the street for 20 years has
  none (often notice goes only to owners of record within the radius).

  2. The city treats neighborhood opposition as evidence of harm (number of letters,
  volume of testimony), i.e., counts intensity of preference, but does not count the
  intensity of the would-be residents'' preferences, who by definition are not yet
  residents and who are not notified.

  3. The city exempts from review those things neighbors complain about most when
  it wants them: e.g., ministerial approval for ADUs or for 100% affordable projects
  (state law in California), or by-right for industrial/warehouse uses in some zones;
  and (in some places) state preemption (e.g., Oregon''s / Minneapolis''s / California''s)
  which removes the veto for housing but keeps it for other things.

  4. Parking: neighbors'' claim to curb parking spaces is treated as protectable,
  while the housing searcher''s claim is not.

  5. Renters displaced by demolition get relocation assistance, but renters who would
  have moved in are unrepresented.


