  Douglass''s famous argument: he originally held the Garrisonian view that the Constitution
  was "a covenant with death and an agreement with hell" (that''s a quote from Isaiah,
  used by Garrison). Then he reversed. His reasoning in "The Constitution of the United
  States: Is it a Pro-Slavery or an Anti-Slavery Instrument?" (1860, Glasgow): arguments
  from (a) the Preamble "We the People" — the people, not the states; (b) Article
  I §9''s clause about migration/importation and the capitation tax; (c) the absence
  of the word "slave"; (d) the Fifth Amendment / due process clause — "no person shall
  be deprived of life, liberty, or property without due process of law" — Douglass
  argued slaves are "persons"; (e) the "guarantee clause" Article IV §4 — a republican
  form of government is incompatible with slavery; (f) the "persons held to service
  or labor" clause in Article I §2 §3 and Art IV §2: Douglass argued that "service
  or labor" meant service freely contracted, and that slavery was not mentioned; also
  his claim about the Constitution''s prohibition on states... Also the requirement
  that the Constitution be interpreted by the "rule of interpretation" laid out in
  the Preamble''s purposes ("to establish justice... secure the blessings of liberty")
  — Douglean canon: no construction of the Constitution that makes it sanction injustice.


