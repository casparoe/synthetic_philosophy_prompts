  Actually there are two classic candidate rules for Hume: (1) the "true judge" procedural
  account — the standard is the joint, stable verdict of qualified, practiced, unprejudiced,
  delicate critics (a social/epistemic rule, "convergence of experts across time and
  place"); (2) a "sentimental realism/natural response" account — some sentiments
  are natural and fitting given human nature, and the procedures merely filter out
  noise. These two coincide on Hume''s own examples (Milton, wine) but diverge on
  new cases — e.g., a case where qualified critics durably converge but that convergence
  seems to be explained by shared ideology or by the causal history (e.g., critics
  converge on the beauty of a landscape in a genre they''ve been trained in; or a
  case where a practice-based convergence arises but the object "speaks to" only a
  subculture: e.g., the beauty of atonal music; or a case of a "cherished" work whose
  reputation lasts 2,000 years vs. one that lasts 200). Also a case where experts
  converge but the sentiment depends on a moral flaw in the object (e.g., a beautiful-but-cruel
  work; Hume ties beauty partly to utility and to sympathy, and to the "sentiments"
  being appropriate; he does discuss that moral defects can be "blameless"? Actually
  he notes: "the same object... " hmm).


