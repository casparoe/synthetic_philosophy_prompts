  I''m leading a discussion section on George Eliot next month for a course on religion
  and secularism in the nineteenth-century novel, and before I put a frame in front
  of students I want to see whether it survives being pressed. The biographical spine
  is familiar: the young Marian Evans, who translated Strauss''s *The Life of Jesus,
  Critically Examined* in 1846 and Feuerbach''s *The Essence of Christianity* in 1854,
  gave up the doctrines and kept the religious psychology — God, revelation and an
  afterlife go, while reverence, duty, renunciation and the sense of being claimed
  by something outside the self stay on, re-attached to humankind, in something like
  the Comtean idiom of a religion of humanity. My worry is that "kept the psychology"
  hides a problem I''ve been calling the freestanding-reverence problem. On the Feuerbachian
  picture that Eliot translated, worship is best described as a structure with a slot
  in it: an object treated as absolute, making a total claim, around which a whole
  affective and moral life gets organized. If demythologizing removes the object but
  leaves the structure standing, then either the structure slowly atrophies for want
  of anything that can fill the slot, or it finds a surrogate and quietly re-endows
  that surrogate with exactly the absoluteness it was supposed to have surrendered
  — a contingent, finite, not-always-lovable human being asked to bear a weight that
  only God could carry. I want to know whether this is a genuine dilemma for Eliot''s
  position or something I''ve manufactured by over-formalizing what is really just
  a habit of feeling that never needed an object in the first place.


  [paragraph 2: Silas Marner] The text I most want read through it is Silas Marner,
  and the details I keep coming back to are these. Silas''s loss of faith at Lantern
  Yard is not a theodicy crisis at all — nobody suffers; what destroys him is that
  the chapel''s practice of drawing lots, treated as a way of letting God decide,
  returns a verdict he knows to be false, and it is that procedural failure, not evil
  in the world, that empties his faith. Once at Raveloe he fills the slot with gold
  and worships it, which looks like a deliberate picture of the slot occupied by the
  wrong thing. Then the plot itself performs the substitution: on the night the gold
  is stolen, Molly Farren dies in the snow on her way to the Casses'' New Year party,
  her toddler wanders through Silas''s open door, and Silas, in one of his trances,
  sees what he takes for his returned gold on the hearth and finds a child instead
  — and grows a new life around it. Two things strike me about how the novel gets
  there. First, the machinery is unmistakably providential: the theft that empties
  the slot and the child who fills it arrive on the same night, the pit is drained
  years later to produce Dunstan''s skeleton and restore Silas''s name, and the whole
  plot runs on the kind of timing a believer would call Providence — in a book whose
  whole premise is that we don''t get Providence. Second, Eppie is an extremely favorable
  sample: the religion of humanity''s object is here a golden child, while Godfrey
  Cass''s cowardice, Dunstan and Molly are what human objects look like when they
  fail. So: is the providential plotting irony, a nostalgic leftover, or evidence
  that the religion of humanity needs the shape of Providence while denying its author?
  And does the novel''s happy case do any argumentative work, or does it simply display
  one fortunate attachment and hope nobody asks about the others? I''d also like your
  read on Eppie''s refusal, at the end, of Godfrey and Nancy''s offer: she turns down
  the inheritance and the respectable marriage, and the renunciation is now entirely
  without宗教 rationale — is that the old structure surviving on a human object, or
  something different in kind?


  [paragraph 3: Middlemarch test + deliverables] I want the frame tested against Middlemarch
  too, in one specific respect. Dorothea Brooke has reverence in abundance and doctrine
  only loosely attached — and the novel''s one scholar of comparative religion, Casaubon
  with his never-finished Key to All Mythologies, is a withered pedant working in
  the very tradition of German biblical and mythological criticism Eliot had worked
  in herself, and specifically represented as not having kept up with current German
  scholarship. Eliot thus makes the demythologizer a cautionary figure in her fiction
  while being one in her own early career, and I can''t tell whether that''s self-knowledge
  or self-protection. Then there is the ending, and the complaint students always
  make — that Dorothea''s life comes to less than the novel seemed to promise — which
  on my frame is exactly the right complaint, the freestanding structure quietly failing
  to fill; but I suspect the novel may already know this and be asking whether it
  is nevertheless enough. So what I''d like from you: a reading of both novels through
  the freestanding-reverence frame, and an honest account of where it illuminates
  and where the novels resist it. Where my dilemma is anachronistic or a category
  mistake — a twentieth-century suspicion about disguised surrogates projected back
  onto a Victorian who thought she was honestly preserving an inheritance — say so
  plainly. Point me to the three or four scenes you''d put in front of a seminar,
  and end by telling me what, if anything, the novels add to the philosophical question
