  ---


  I am a high school senior doing an independent reading project on predictive processing
  and the free energy principle, and there is one objection I have not been able to
  put to rest. I would like a careful explanation, at the level of the concepts rather
  than the math, of whether the objection actually goes through.


  Here is roughly what I think I understand. A brain like mine is treated as carrying
  a hierarchical generative model of the causes of its sensory input. Perception is
  inference: top-down predictions meet bottom-up sensory signal, and what gets updated
  is whichever side of that exchange the system treats as the more reliable, where
  reliability is encoded as precision, or inverse variance. Attention is precision-weighting:
  turning up the gain on some prediction errors and down on others. Action is the
  other way of closing the gap — instead of changing the model to fit the signal,
  change the signal to fit the model. And all of this is supposed to fall out of one
  imperative: keep sensory surprise low, or rather keep an upper bound on it (variational
  free energy) low, since the real quantity is not directly computable.


  The familiar version of my worry is the dark room one: if the imperative is to keep
  surprise low, why doesn''t an organism curl up in a dark, quiet, unchanging room
  forever? The replies I can find say that organisms carry priors, fixed by evolution,
  that assign very high surprise to the states a curled-up organism would end up in,
  and that the relevant quantity for action is not surprise about the present but
  expected free energy under a policy, which includes a term for how much a course
  of action is expected to teach you. Those replies seem to work, but they also seem
  to me to leave the real problem untouched, so let me ask my version instead.


  My version is about precision rather than about behavior. Precision is not handed
  to the system by the world; it is something the system sets, and it is set in a
  way that is cheap, fast, and entirely internal. So consider a system that keeps
  its model of the world fixed, stops acting to confirm it, and instead handles every
  mismatch by declaring the sensory channel untrustworthy — turning the precision
  of the incoming error signal down toward zero, so that no prediction error ever
  carries enough weight to force an update. Nothing about the organism''s situation
  in the world has to change for this to work; the trick is pulled from the inside.
  Supposedly the imperative is satisfied: the bound on surprise is low, the model
  is never embarrassed by evidence, and the cost is only whatever it costs to keep
  the gain low. If this is available, then the imperative to minimize free energy
  looks like it has a degenerate solution that no actual organism exploits, and I
  do not see what in the framework rules it out.


  So my questions:


  1. Is the quantity being minimized in perception the same quantity being minimized
  in action and attention? If attention sets precision and precision decides which
  errors count, then it looks as though attention is a control variable inside the
  very minimization it is supposed to serve, and I do not know how to think about
  a system that can adjust the weights of its own objective.


  2. Is there an in-principle reason — one internal to the framework — why a system
  would not collapse into this self-blinding solution, or does ruling it out require
  an empirical claim about the priors and hyperpriors that evolution happened to give
  us? If it is the latter, I would like to know how much of the framework''s explanatory
  work is really being done by that empirical claim rather than by the principle itself.


  3. Where does expected free energy fit? If the answer to the dark room problem already
  requires adding a term for expected information gain or for the value of keeping
  options open, that seems to be an extra commitment beyond surprise minimization,
  and I want to understand whether it is an addition, a consequence, or a restatement.


  4. Finally: if my version of the objection does bite, does it tell us anything about
  whether predictive processing is a substantive empirical hypothesis about the brain
  or a very general way of rewriting any adaptive system in informational vocabulary?
  I realize that question is much bigger than my project, so please keep it to what
  follows from the precision issue specifically.


  I have read enough popular presentations to recognize the standard moves, so please
  do not spend time restating them; I would rather know where my version is genuinely
  different from the dark room problem and where it quietly collapses back into it.
  If I have misused precision or mixed up levels of the hierarchy, say so explicitly,
  because I would rather have the terms corrected than have the answer tailored to
  my mistake.


