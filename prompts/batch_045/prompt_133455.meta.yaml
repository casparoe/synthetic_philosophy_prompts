  "Grounding is the relation of non-causal constitutive determination: the fact that
  the glass is fragile holds in virtue of the fact that its molecules are bonded thus
  and so. It is not identity — the fragility is not the bonding — and it is not causation,
  since the grounding fact is simultaneous with, and does not precede, what it grounds.
  Grounding claims are also not merely modal: that A necessitates B does not yet tell
  us that B holds in virtue of A, and there are necessary truths, such as the truths
  of pure mathematics, that intuition treats as ungrounded even though they could
  be said to be necessitated by anything at all. Grounding, as usually understood,
  is irreflexive, asymmetric and transitive, though each of these has been questioned;
  Schaffer has argued that, once grounding is treated as a contrastive relation, transitivity
  fails. It is also standard to say that grounding entails necessitation: if the molecular
  facts ground the fragility, then necessarily, if those facts obtain, the glass is
  fragile. ..."


