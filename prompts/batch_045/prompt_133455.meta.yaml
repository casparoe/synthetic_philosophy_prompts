  that intuition treats as ungrounded" — fine, plausible, not a howler.


  Then: "Fundamentality is standardly defined negatively: a fact is fundamental iff
  nothing distinct from it grounds it. This is a definition by exclusion, and one
  might worry that it is too thin: it says what the fundamental is not, not what it
  is. ..."


  Then the derivation non-sequitur:


  "Given this definition, the existence of a fundamental level follows straightforwardly
  from the formal features of grounding. Grounding is irreflexive and asymmetric:
  no fact grounds itself, and no two facts ground one another. Suppose every fact
  were grounded. Then taking any fact and tracing its grounds, and then the grounds
  of those grounds, we would eventually run out of new facts — since the facts are
  irreflexively and asymmetrically ordered, the chain cannot loop back on itself,
  and so it must terminate. What it terminates in is, by definition, fundamental.
  And because grounding is transitive, whatever lies at the terminus grounds everything
  downstream of it; so the fundamental facts fully ground all the others, and reality
  has the layered structure that the notion of a fundamental level is supposed to
  secure."


