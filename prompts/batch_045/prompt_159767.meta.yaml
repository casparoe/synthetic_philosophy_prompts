  Prompt draft:


  I''m designing a seminar session on the extended mind whose point is to unsettle
  the assumption that the extended mind thesis is simply the permissive view about
  where cognition stops, and that its opponents are simply the restrictive ones. For
  that I need a case in which a middling view grants extension while the extended
  mind thesis withholds it. Please build it.


  Three positions, stated here so you don''t have to reconstruct the literature:


  (A) Extension by parity: an external resource counts as part of a subject''s cognition
  when it plays the functional role an internal process would play and meets the usual
  integration conditions — reliably there when needed, easy to access, and its deliverances
  automatically endorsed.


  (B) Wide computationalism: an external resource counts as part of a subject''s cognition
  when the computation the coupled system performs cannot be individuated without
  citing that resource — i.e. the resource is a vehicle of the computation. On this
  view it does not matter whether the subject retrieves content from the resource,
  endorses anything, or could say what is "stored" there.


  (C) Intracranialism: cognition is constituted by brain-bound states with non-derived
  content; environmental resources can cause, scaffold, and reshape cognition but
  never constitute it.


  The case must produce: (B) says yes, (A) says no, (C) says no — so that the view
  famous for extending the mind ends up in agreement with the view famous for confining
  it, and the reversal is generated by the theories, not stipulated.


  Constraints on the scenario:

  - One paragraph, ordinary present-day human setting; no implants, no brain-computer
  interfaces, no science fiction.

  - The resource must be inanimate and non-digital: no notebook, no phone, no GPS,
  no written list, no search engine. It must not be a variant of the notebook, the
  blind person''s cane, or an arrangement of tiles or tokens used to solve a puzzle.

  - No other person''s cognition may be doing the work: no colleagues, no social institutions,
  no division of labour across agents.

  - The agent knows the resource is there and deliberately relies on it. The case
  may not work by making her unaware of it, mistaken about it, or unusually forgetful
  or impaired.

  - The resource should be something she did not design and could not simply carry
  away with her.

  - Do not at any point stipulate that the resource is, or is not, part of her mind;
  the verdicts have to come from (A)-(C) applied to the facts of the case.


  Then give me:

  1. The verdict each of (A), (B), and (C) returns, with the reasoning that gets there
  — for (A), say which of its conditions is unmet and why; for (B), say why the computation
  cannot be individuated without the resource; for (C), say what it takes the resource
  to be merely causing.

  2. The one feature of the case that is load-bearing, stated as a variable.

  3. What happens when you toggle that variable: which verdicts flip, and why the
  case then collapses into an instance of the familiar sort that no longer does any
  work.

  4. The strongest reply available to the (A) theorist — the best way for her to argue
  that the case is not a counterexample but a case of something else (scaffolding,
  embodiment, cognitive assembly, or the coupling/constitution distinction doing its
  usual job) — and your honest assessment of whether that reply rescues (A) or merely
  relocates the disagreement to (B) vs (C).

  5. One sentence on whether you think (B)''s verdict here is a cost or a benefit
  for that view.


  Format: begin your reply with the scenario itself — its first sentence is your first
  sentence, no heading, no preamble, no restating this request. In everything after,
  lead with each section''s bottom line and then give the reasoning.


