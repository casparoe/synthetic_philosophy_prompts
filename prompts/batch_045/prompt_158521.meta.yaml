  I''m a journalist writing a long-form piece for a British magazine on the question
  of whether minds have to be made of the right kind of stuff, and I want to open
  it with a piece of fiction rather than a thought experiment in the abstract. The
  seed is a dialogue from Hofstadter and Dennett''s 1981 collection The Mind''s I
  — the one in which a preserved brain is interviewed and the reader is left unsure
  whether the mentality lies in the brain, in the book he is holding, or in the act
  of reading itself. I''d rather not write the opener myself: my instinct is to make
  it too tidy, and I want something that leaves the question genuinely open. So I''d
  be grateful if you would write the story for me.


  Setting and situation I have in mind. A conservation and digitisation studio at
  a large national library, over one winter. The object at the centre of it is not
  a novel but what the catalogue calls the Ashcombe Codex: a single surviving copy
  of a late-seventeenth-century devotional-cum-logical treatise whose pages are built
  in layers — a base text, marginal glosses, glosses on the glosses, and a final set
  of notes in a later hand that comment on the whole apparatus. The quires were disbound
  in a flood in the nineteenth century and rebound in the wrong order, so the book
  as it now sits reads as one thing, whereas the order implied by the quire signatures
  reads as another. It also ends with a colophon that gives instructions for re-sequencing
  the quires, so that the book tells the reader how to build a corrected version of
  itself; and the corrected version, once assembled, says something rather different
  from the misbound one. Two people are working on it. Marion, a senior conservator
  of twenty-five years'' standing, is producing a digital surrogate from page images
  and is increasingly convinced that the codex "answers back" — that the sequence
  in which fragments turn up in the boxes is not random, and that the book has preferences
  about which of its own orders is being read. Kwame, a machine-learning engineer
  seconded from a partner university, has trained a small model on the base text and
  is using it to fill the lacunae where pages were lost, having reconstructed the
  missing passages from a later Latin translation made from a now-vanished copy. He
