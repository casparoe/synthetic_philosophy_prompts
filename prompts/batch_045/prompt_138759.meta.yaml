  Also the scorecard: describe four views without attributions:

  - Precedent autonomy, unlimited: the instruction binds because competent choices
  about one''s own future bind, full stop.

  - Present-interests view: what matters is the interests/experiences of the person
  now in the bed; the document is at most evidence of those.

  - Value-tracking view: what binds is the earlier person''s enduring values/character,
