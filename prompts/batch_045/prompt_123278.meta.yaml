  Draft:


  ---


  I''m putting together a graduate seminar on music and metaphysics for the spring,
  and I want to audit my own position before I teach it, because I''ve accumulated
  a set of commitments over the years that I''ve never checked for joint coherence.
  A colleague in the music faculty, after hearing me sketch them, said flatly that
  I was "running Schopenhauer and the formalists on the same tank," and I haven''t
  been able to shake the remark. So here is the package, as I actually hold it.


  (1) Schopenhauer''s central claim seems to me right in outline and I want to keep
  it: the other arts copy the Platonic Ideas, but music is an immediate copy of the
  will itself, and this is why it acts on us with a directness and violence that no
  representational art can match.


  (2) I also want to keep his architectonic analogy — the bass as the lowest grades
  of the will''s objectification through the inner voices up to the melody as the
  highest grade, human life and its striving — and I think it does real explanatory
  work: it predicts something about why tonal music is built the way it is, with a
  slow-moving foundation and a fast, singing treble.


  (3) I''m committed to the Romantic corollary that instrumental music is the pure
  case and that setting words or a program is a contamination, dragging music back
  toward concepts. And I hold this as a principled aesthetic ranking, not a report
  of my tastes — which creates a problem I''ll come to.


  (4) About the mechanism of music''s effect, I hold that because the will is what
  we are in ourselves, music does not represent anything we then recognize; it acts
  on us directly, and so the right account of our response is not recognition but
  resonance.


  (5) The amendment I''ve been toying with, which I think is my own and which I''d
  like to keep: what music copies is not the will''s content but its form — the sheer
  structure of striving, which is temporal in a way nothing spatial can be. This is
  why music alone cannot be taken in at a glance, and why a piece''s identity is inseparable
  from the order of its events: play the phrases backward and you do not get the same
  thing with the parts rearranged, you get a different thing or nothing.


  (6) Methodologically, I''d like to detach all of this from Schopenhauer''s full
  metaphysics. I don''t want to defend the thing-in-itself, the oneness of the will,
  or the grades of objectification as literal cosmology; I want the aesthetic payoff
  to survive the metaphysics, so that even a Humean or a physicalist could grant (1)
  through (5).


  (7) Two further verdicts I''m unwilling to part with. First, I think music is universally
  intelligible in a way that literature is not: it needs no concepts, no translation,
  no cultural knowledge. Second, my students hear almost nothing in the late Beethoven
  quartets on first acquaintance, and I think they are right to — those pieces reward
  years of enculturation, and I don''t think that''s a defect in them or in my students.


  (8) And the problem I mentioned: I hold (3), and I also think that the closing scene
  of a Wagner music drama is the greatest achievement in any art form, and that what
  is great there is not detachable from the words and the staging.


  What I want: go through this and tell me which commitments actually pull against
  each other, which pairs only look as though they do, and what each tension would
  cost to resolve. Please rank the tensions by severity rather than flagging everything
  as equally fatal, and for each say precisely what would have to be given up or modified.
  I''d also like to know whether there is a single revision that would clean up the
  most, and whether (6) is doing the work I''m hoping it does or quietly destroying
  the explanation in (1). Please don''t just tell me what Schopenhauer''s actual view
  was; I want the audit of my package.


