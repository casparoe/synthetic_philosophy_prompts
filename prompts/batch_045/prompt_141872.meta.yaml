  ---


  I''m writing the framing section of a survey on observer-selection problems in cosmology,
  and before I go near the competing proposals I want the specification written down
  first. Please write me the desiderata a cosmological theory would have to meet in
  order to count as having solved the Boltzmann brain problem, where "solved" means
  something strong enough to be useful: a working cosmologist could take a new model,
  apply the theory, and get a verdict on whether the model is viable — not merely
  a reason to stop worrying.


  Assume the setup is known; don''t spend words defining fluctuation observers or
  recapping the dialectic. Weight the response on the requirements themselves and
  on the cases behind them.


  Some distinctions and cases I think any list has to respect, and which I''d like
  handled explicitly:


  - Two worries I take to be different and often run together: the dominance worry
  (observers produced by fluctuations vastly outnumber observers produced by a long
  low-entropy history, so a typical observer is a fluctuation) and the ratification
  worry (a theory on which I am probably a fluctuation observer is a theory on which
  my evidence for that very theory is noise, so the theory cannot be rationally accepted
  even if it is true). A theory can win on one and lose on the other, and I want separate
  requirements for each.

  - The Archive case: a fluctuation that produces not merely a momentary observer
  with disordered impressions but an observer together with a physically complete
  set of apparent records — a laboratory, a literature, a body with the right scarring
  — i.e. with the same total evidence I have. Such fluctuations are enormously more
  expensive than minimal ones, so they are far rarer; but they are also the ones that
  matter, because the cheap ones do not share my evidence. I want a requirement about
  which comparison class a theory gets to use, and a justification for it, since the
  verdict flips depending on whether we count all observers or only observers with
  my evidence.

  - A requirement about what would count as evidence for the hypothesis that I am
  such an observer, and what the theory says if nothing could in principle count.

  - A requirement about the sampling or typicality step: is it physics, is it a methodological
  rule, must the theory supply the reference class, and does the theory get to use
  typicality to generate the original prediction while suspending it when the prediction
  turns on itself?


  For each requirement: the case or consideration behind it, and a marking as non-negotiable,
  negotiable, or a preference of one research community. Then:


  Say which subset, if any, is jointly unsatisfiable — I suspect the tension is between
  using typicality to get the problem off the ground and restricting it to escape
  the conclusion, but state it precisely if that''s wrong. Say which single requirement
  does the most work in excluding candidate solutions, and which one you suspect is
  a prejudice of one camp dressed as a desideratum. Most useful of all: tell me if
  any of your requirements is such that dropping it would make the problem disappear
  altogether, since that would suggest the requirement was smuggling in the answer.


  Use the familiar families of response only as stress tests of the list — a cosmology
  with a low-entropy past and finite future, an eternally inflating cosmology with
  a measure over observers, and any approach that rejects the sampling assumption
  — and keep this to a few lines; I''ll do the scoring myself.


  Finally, where I want you to be self-critical rather than assertive: flag your own
  least secure requirement, say what argument or case would make you drop it, and
  say where you think the whole project of specifying what it would take to solve
  this problem might be misguided — for instance if there is no determinate thing
  being asked for. No citations or reading list, please; I have the literature.


  ---


