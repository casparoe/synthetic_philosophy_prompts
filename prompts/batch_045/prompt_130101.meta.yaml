  I chair the clinical ethics committee of a large public hospital, and we have a
  case next week that we expect to set precedent, so I want the written opinion to
  be argued at the level of principle rather than settled by intuition.


  Ms. A. is 79, with advanced dementia: she no longer recognises her children, speaks
  little and not coherently, shows no signs of pain, and is fed by hand by nursing
  staff. She has now developed dysphagia with recurrent aspiration, and her clinical
  team recommends either placement of a feeding tube or continued hand feeding with
  postural precautions, accepting a high risk of aspiration pneumonia and a comfort-focused
  plan thereafter. Nine years ago, while cognitively intact, she signed an advance
  directive refusing tube feeding and any further hospital admission. Her two sons
  now ask us to disregard it. Their argument, as they put it, is that their mother
  is not the same person who signed that paper: on their account a person is constituted
  by her relationships rather than by the private, temporally extended will of a single
  biological organism, and the person in the bed today is the person their family
  sustains — someone who responds to being fed by hand, to touch, to being sung to,
  and whose personhood they enact by continuing to feed her. They accept that this
  means the document is not merely outdated but was never the right kind of thing
  to bind her. Her daughter disagrees and asks that the directive be honoured. Two
  complicating facts: the sons have visited only a handful of times in the past two
  years, while the daughter has been present most days, so the family that claims
  to speak for her relational self is itself divided about who counts; and several
  staff have said privately that they think the relational argument is a philosophical
