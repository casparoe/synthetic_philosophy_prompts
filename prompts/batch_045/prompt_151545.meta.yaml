  as a substring, replace that substring by U; (iv) if a string contains UU, delete
  it. Question: is MU a theorem? The standard way of settling it is not to search
  for a derivation but to notice an invariant: ... Hence MU, which contains zero I''s
  and zero is divisible by three, is unreachable. Hofstadter''s moral is that we had
  to ''jump out of the system'' (JOOTS): the reasoning is about the system, not in
  it."


