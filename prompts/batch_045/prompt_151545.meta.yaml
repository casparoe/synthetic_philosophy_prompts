  Then: the controversy.


  "My question is whether anything of metaphysical substance follows from this. I
  have in mind the argument, associated with Lucas and, more recently, Penrose, of
  which the following is a sharpened version that I find more persuasive than the
  versions usually circulated. Fix any formal system S which is sound for a class
  of statements including the ''MU-questions'' of a family of string-rewriting systems.
  Because the rules of such systems can be generated mechanically, one can, given
  S, write down a concrete puzzle P_S — a particular alphabet, a particular axiom,
  four or five particular rules — such that the correct answer to P_S is, in effect,
  ''S is consistent'', in the sense that the target string is derivable if and only
  if S is inconsistent. If we can see that S is sound, then we can see that the answer
  is ''no''; but S itself, if it is sound, cannot settle the matter. And this construction
  can be iterated: for any system, a harder puzzle. What is supposed to follow is
  that the human mind is not a machine, since for any machine there is a puzzle we
  can answer and it cannot."


  Then note: "I have put the argument in this ''parametrised'' form myself, since
  the versions I have seen rely on Gödel sentences, which are syntactically baroque;
  the string-rewriting version is, I think, cleaner, and it makes the dependence on
  our seeing that S is sound quite explicit." Good — "injected new idea" satisfied.


  Then: "Three replies occur to me, and I want the essay to adjudicate among them
  rather than merely catalogue them."


  Reply 1 (deflation/mechanical meta-level): JOOTSing is the ordinary practice of
  doing mathematics at the metalevel; every step in the invariant argument is itself
  checkable in elementary arithmetic; the "outside" of a system is just the inside
  of another; search over candidate invariants (homomorphisms into small finite monoids,
  modular counts) is mechanical, and one can write a program that discovers the MIU
  invariant; and climbing is itself mechanisable in principle (the idea, which I gather
  Turing explored under the name of ordinal logics, of iterating consistency extensions
  along constructive ordinal notations). So the gap between "S cannot" and "we can"
  is a gap between a fixed system and an open-ended procedure, and open-ended procedures
  are exactly what machines are good at.


  Reply 2 (the self-application/identification objection): The argument needs me to
  know which system I am. But if I am a machine, there is no reason to expect that
  I can produce a correct description of my own program — indeed a machine that could
  fully prove facts about its own soundness risks inconsistency or incompleteness
  about itself. So "for any machine S there is a puzzle I can solve and S cannot"
  is compatible with "I am a machine", because the defeating puzzle for my own S is
  one I cannot identify, let alone know to be sound. Hence the argument at most establishes
  an inability to *self-ascertain*, not a transcendence.


  Reply 3 (the error/idealisation objection): "we can see S is sound" holds only for
  toy systems. For real candidate formalisations of a mathematician, the soundness
  claim is itself a substantive mathematical conjecture, and mathematicians are fallible.
  If the "we" is an individual, the argument collapses into: I have a hunch that S
  is sound, which is not the sort of thing that can outrun a machine. If the "we"
