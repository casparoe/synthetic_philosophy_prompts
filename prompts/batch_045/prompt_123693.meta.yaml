  Draft summary:


  "Imagine an interpreter who arrives among speakers of an unknown language equipped
  with nothing but his own language and his own beliefs. The only evidence he can
  have is the pattern of the speaker''s assent and dissent — which sentences she holds
  true, and when. But beliefs and meanings cannot be assigned one at a time: a belief
  is identified by its place in a larger network, and the meaning of a sentence is
  read off the belief one would have to attribute to make the sentence come out true
  in the circumstances. So the interpreter must solve for both simultaneously. Two
  constraints make the problem tractable. Coherence requires the attributed belief-set
  to be logically and inductively well-ordered; charity requires that the speaker
  turn out mostly right by the interpreter''s lights. Charity is thus an empirical
  assumption about how much interpreters and speakers have in common, and like any
  empirical assumption it could fail: confronted with a population whose beliefs were
  systematically false by our lights, the method would simply break down and we would
  have to withhold interpretation. Three things follow. First, because the evidence
  fixes only the truth conditions of sentences and not which objects satisfy the referring
  expressions, reference is inscrutable: alternative assignments related by a proxy
  function fit the evidence equally well, so meaning is indeterminate in Quine''s
  sense, and there is no fact of the matter which two adequate theories of meaning
  is correct. Second, this is why Davidson''s later talk of triangulation — interpreter
  and speaker jointly responding to a common object in a common world — has to be
  doing the real work: it is an attempt to plug the hole that indeterminacy opens.
  Third, because charity is only an assumption of similarity, the celebrated argument
  against conceptual relativism — that we could make no sense of a scheme radically
  unlike our own — is circular, since it builds the desired conclusion into the method
  used to reach it. The author adds a proposal of his own: if charity is a maximizing
  instruction, the natural formalization is to choose, among interpretations that
  fit the evidence, the one that maximizes agreement between speaker and interpreter,
  which he says makes radical interpretation a special case of inference to the best
