  I''m writing an end-of-term essay for a course on collective responsibility and
  I want to do something less predictable than another paper on the archives. Here''s
  my plan: read Remarque''s All Quiet on the Western Front as a contribution to the
  argument about who is to blame for the First World War. The background: the German
  historian Fritz Fischer argued in the early 1960s, from the Imperial German archives,
  that Germany''s leaders deliberately steered the July Crisis into a war they wanted,
  and it reopened a huge fight in West Germany — though what my professor keeps insisting
  is that the fight was never really about documents, it was about whether a nation
  can be a bearer of responsibility at all, or whether blame has to bottom out in
  individuals. So: does the novel have a view about that? To make it sharpen, here''s
  some apparatus I''ve been fooling around with (my prof hates it, which I''m choosing
  to read as a good sign). I want four kinds of blame kept apart, and I want to know
  which ones the novel is actually denying and which it quietly helps itself to: authorial
  blame — blame for having started it, the thing the war-guilt clause and the Fischer
  thesis fight over; underwriting blame — blame for keeping something going that you
  benefit from or could have refused, which attaches to you as a member of a polity
  whether or not you voted for it; uptake blame — blame you acquire by continuing
  once you know what it is, so that the longer the war runs the more people become
  blameworthy who weren''t at the start; and formation blame, the one I care about
  most — blame for having shaped someone so that they would choose the thing, which
  is what makes the schoolmaster Kantorek, who never fires a shot, the most interesting
  target in the book. (But then: who formed Kantorek? I can''t tell whether that regress
  is a reductio of formation blame or just the novel''s real subject.)


