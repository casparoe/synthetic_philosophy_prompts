  The demarcation problem/falsificationism domain is core philosophy of science. A
  model without search can answer. But the prompt must not be something they''ve seen
  a million times. If we ask "Explain the difference between falsifiability and falsification"
  that''s common. But with summary type, we present a paragraph summary with subtle
  errors. E.g.:


  "A philosophy of science popularizer summarizes Popper''s falsificationism like
  this: ''Popper''s demarcation criterion says that a theory is scientific only if
  it is possible for some observation to show that it is false. A theory becomes more
  scientific the more precise it is, because precise theories rule out more. When
  a theory makes a prediction that observation contradicts, the theory is falsified,
  and responsible scientists must immediately give it up; adding an auxiliary hypothesis
  to save it is always ad hoc and unscientific. This is why Marxism and Freudianism
  are pseudosciences: their central claims have been refuted by everyday experience,
  but their followers keep reinterpreting them to avoid refutation. Science thus advances
  by conjectures and refutations, and we should prefer the theory that has survived
  the most attempts at refutation, since surviving refutation makes a theory more
  probable.''"


  Errors:

  - "falsified, and must immediately give it up": Popper says a falsifying observation
  only means the theory (plus auxiliary assumptions) is false? Actually a strict falsification
  is of the whole system; conventionalist stratagems can save it, but at the cost
  of immunizing. Popper says we should provisionally accept the falsification and
  look for a new theory, but not "immediately give it up" in the sense of conclusive
  refutation, because falsifications are also fallible and theory-laden. Also "adding
  an auxiliary hypothesis to save it is always ad hoc and unscientific": not always;
  Popper allows auxiliary hypotheses if they are independently testable and increase
  falsifiability; only ad hoc (those that decrease falsifiability or have no independent
  test) are objectionable.

  - "Marxism and Freudianism are pseudosciences: their central claims have been refuted
  by everyday experience": Popper''s demarcation is about falsifiability, not about
  being refuted. He thought they were unfalsifiable (or at least not testable), not
  that they had been refuted. Some Marxists made falsifiable predictions that were
  falsified, but then they reinterpreted; Popper''s complaint was that the theories
  were not falsifiable as stated, or that they were immunized.

  - "surviving refutation makes a theory more probable": Popper rejected induction
  and probability of theories; corroboration is not probability. A theory that survives
  severe tests is better corroborated, but not more probable. This is a subtle misrepresentation:
  "more probable" is exactly what Popper denied.

  - Also "theory becomes more scientific the more precise it is, because precise theories
  rule out more" is correct (falsifiability increases with content).

  - "possible for some observation to show that it is false" is roughly falsifiability,
  but need to say "in principle" and "logical possibility of an observation statement"
  not "some observation will show". Popper''s falsifiability is the logical relation
  of a theory to basic statements; not just any observation.


