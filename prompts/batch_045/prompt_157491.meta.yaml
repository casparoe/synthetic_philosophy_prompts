  Good''s theorem (as usually stated): For an agent who maximizes expected utility
  and updates by conditioning, if information is free, then ex ante EU of choosing
  after receiving the information ≥ EU of choosing now. So a rational agent never
  declines free info.


  Interesting failure modes / extensions in the literature:

  1. Costly deliberation/computation (bounded rationality) — trivial.

  2. State-dependent preferences: the info itself alters utility (e.g., wanting to
  be surprised; news that makes you miserable with no decision relevance). Actually
  the interesting subtlety: if the news changes the agent''s utility function (e.g.,
  learning you have a disease makes you despair, affecting your utility beyond the
  decision), Good''s theorem can fail. But then it''s arguably "preference change"
  not irrationality.

  3. Inability to commit / the agent''s future self will not maximize as planned (the
  "Ulysses" structure): e.g., learning whether the bar has a cute stranger there →
  you''d plan to stay home if X, but you''d go anyway. Hmm, that''s weakness of will,
  and the EV calc already accounts for it if modeled properly.

  4. Strategic settings: your information is observed by others, or others know you
  have it → in games, more info can lower your payoff. This is well-known: "the value
  of information can be negative in strategic contexts" (e.g., in zero-sum games?
  no — in zero-sum, more info can''t hurt? Actually in games, more information can
  hurt: e.g., a player''s private info becoming public can hurt; also "information
  revelation" in auctions/negotiation). Classic example: in the "Battle of the sexes"?
  Or the case where if you know your hand is weak, the opponent can infer... Hmm.
  A clean known result: receiving information can reduce your payoff when others know
  you received it and can condition on your action (signaling). Example: "the inspector
  who is known to have been tipped off".

  5. There''s also a subtlety about the *timing* of commitment: info arriving after
  you must commit (irrevocable) has zero value; and info arriving before an opportunity
  to re-commit ("option value of waiting") is positive.

  6. Another subtlety: the theorem assumes the agent''s utility function is unchanged
  and that they don''t have preferences *about* the information state (e.g., curiosity,
  suspense) — but note preferences about information states can be folded into utility.

  7. A deeper philosophical issue: with imperfect recall or with "self-locating" uncertainty
  (Sleeping Beauty), does the theorem hold? Interesting! There''s a literature on
