  Requirements to demand of a theory of mind-grades:

  - Must distinguish grade from degree (a huge Skinnerian repertoire vs. a genuine
  Popperian preselection).

  - Must handle "leakage"/degenerate cases: apparent Popperian behavior produced by
  Skinnerian mechanisms (e.g., B. F. Skinner''s own account of "thinking" as covert
  behavior) — the theory must say what behavioral evidence could distinguish internal
  preselection from a rich history of reinforcement.

  - Must handle the reverse: higher-grade machinery deployed in a rigid, stereotyped
  way (a Gregorian creature that never innovates; "cultural load-bearing" vs. genuine
  generation).

  - Must respect the distinction between the generation of candidate actions and the
  testing of them (generate-and-test vs. test-only).

  - Must give an account of the *cost* side — why every creature isn''t at the top
  grade: search costs, energy, time, the mortality risk of learning by doing, and
  the fact that lower grades are faster when the environment is stable. Any theory
  that treats the tower as a ranking of value rather than of mechanisms is suspect.

