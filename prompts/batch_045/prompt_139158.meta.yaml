  made; as the poem proceeds the crowd refrain should get more confident-sounding
  and the private one quieter, without anyone ever being shown to be wrong — that''s
  the point: what travels downstream is the action, not the reason, so the queue grows
  longer without growing wiser, and after the cascade closes each additional person
  adds literally nothing. I''d like the final quatrain, where a villanelle''s two
