  "I teach a first-year seminar on practical reasoning, and I keep running into a
  pattern in student case discussions that I can''t name or place, and I''d like to
  know whether it is a recognized thing or whether I''m just watching people be irrational.


  Here is the abstract shape I think I''m seeing. Standard advice (a colleague said
  there''s a theorem, Good''s something, to this effect) says a fully rational agent
  can never lose, in expectation, by being handed a free, perfectly accurate signal
  before she chooses: she can always just ignore what she learns and do what she would
  have done anyway, so the information can only help her match her action to the world.
  But my students keep producing cases where the agent reasonably declines free and
  reliable information, and the reason is not what you''d first guess — she is not
  afraid of bad news, she does not distrust the test, she is not avoiding a cost,
  and she does not think her future self will panic or be tempted. What she says is,
  roughly: ''if I knew, I would have to act on it, and I would rather act on what
  I have now.'' Two examples from last term. (a) A woman is offered, at no cost, a
  very accurate predictive test before deciding whether to continue a pregnancy. She
  declines, and when pressed, she insists that she is certain she would respond to
  an unfavorable result exactly as she ought to — that is precisely the problem: the
  response she would then owe is one she does not want to make, and she would rather
  remain in a position where the response she owes is to continue. (b) A mid-level
  manager at a firm being audited arranges not to be read into certain internal findings
  — not to protect anyone, and not out of fear — because if she knew, she could no
  longer truthfully tell the auditors that she hadn''t known; the knowledge would
  remove a thing she can now do (speak, assert, vouch), and she wants to keep that
  available. In case (b) the loss looks like it lives in the action space rather than
  in the belief; in case (a) it looks like it lives in what the agent takes herself
  to have reason to do, and yet in both the agent is, by her own account, choosing
  ignorance while fully conceding that the information is free, accurate, and would
  be used correctly.


  So, my questions. Does this configuration have an established name — the use of
  ignorance as a way of keeping some action or some set of reasons available to oneself,
