  Let me build the trilemma:


  (1) If we had a full specification of value, we wouldn''t need an impact penalty;
  we''d just optimize. So an impact penalty is only worth having if it can be specified
  without one. Call this the independence requirement.

  (2) The independence requirement means the penalty cannot be built out of judgments
  about which states are better than which. The only materials left are (i) the environment''s
  dynamics and (ii) the agent''s own capacities: which things it can still bring about
  after acting. So any admissible penalty measures change in the agent''s *ability*
  to bring about a set of reference goals — call them the probe goals — or, failing
  that, raw distance between the actual world and a counterfactual one.

  (3) But a penalty defined over probe goals inherits the choice of probe goals. Choosing
  "reachability of states where the vase is intact" over "reachability of states where
  the vase is broken" is exactly a judgment about which states matter. So option (i)
  violates independence.

