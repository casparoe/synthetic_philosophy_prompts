  The case we keep returning to: a household robot is told to fetch a mug from a high
  shelf. The mug sits behind a heavy vase. Options include going around the vase,
  moving it carefully, knocking it aside and catching and replacing it before anyone
  notices, and — the one that matters here — making sure that nothing else in the
  kitchen ever moves again.


  The argument, as he writes it:


  (1) A side-effect penalty is only worth having if it can be specified without a
  full specification of value. If we already knew which outcomes are good, we would
  optimize that, and the penalty would add nothing; the entire point of the literature
  is to get safety-relevant constraints without solving value alignment first. Call
