  Key in-the-weeds points:

  1. The theorem is often read as: utilitarianism follows from Bayesian rationality
  + Pareto. But the "utilitarianism" it gives is the *ex ante* (prior-expectation)
  view: it maximizes the sum of expected utilities computed with respect to a prior
  over who you are, evaluated from behind the veil — it evaluates lotteries, not outcomes.

  2. John Broome''s reading: Harsanyi''s theorem shows only that social welfare is
  *separable/aggregative* (additively separable across people), not that it''s *utilitarian*
  (equal weights, or utility = well-being). Separability vs. distribution. Broome
  ("Weighing Goods", 1991; "Weighing Lives") argues: the theorem''s conclusion is
  that goodness is additive across people; the step to equal weights requires a separate
  impartiality/symmetry premise, and even then, "utility" is vNM utility = a representation
  of preferences, not well-being — Harsanyi''s theorem is about *satisfaction of preferences*
  (Broome: "good is not the same as utility"). Also Broome''s "the theorem tells us
  that social good is an additive function of individual goods, but individual good
  needn''t be utility."

