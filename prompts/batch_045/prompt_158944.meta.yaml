  Write the desiderata that a contrastive historical explanation must meet to count
  as a satisfactory answer to a question of the form ''why F rather than C?'' — where
  the focal case is the one that got the outcome and the contrast class is the one(s)
  that didn''t. For each desideratum, give the case or consideration that motivates
  it, and say whether it is non-negotiable or a preference of one methodological camp.
  The purpose I''m fixing: an explanation good enough to be worth three years of archival
  work — i.e., good enough that a negative result about it (this cause was absent
  / this cause was also present in the contrast case) would be informative rather
  than merely deflationary.


  Things I specifically want adjudicated, since I keep seeing all of them asserted
  as requirements and I can''t tell which are real:


  1. Whether the contrast class has to be a ''natural'' class rather than one gerrymandered
  to make the focal case look exceptional — and what test distinguishes the two. Consider:
  ''why Britain and not China'' behaves differently from ''why northwest Europe and
  not the Yangzi delta'', and both behave differently from ''why Britain and not France''.
  If the answer changes when we re-describe the units at different grain or scale,
  is that a defect of the question or a discovery?


  2. Whether an adequate answer must be contrast-invariant (the same cause must work
  under reasonable re-descriptions of both arms) or whether it''s allowed to be contrast-relative
  (the cause can be ''whatever was missing in C that F had'', which shifts as C shifts).
  I suspect these pull apart, and I suspect most published answers are implicitly
  contrast-relative while presenting themselves as contrast-invariant.


  3. Symmetric counterfactual support: must a cause both (a) have been absent-enough
  in C that adding it would have produced the outcome there, and (b) have been present
  in F in a way that removing it would have stopped the outcome? Or is one direction
  enough? Most explanations I read only ever argue one direction. What''s the cost
  of demanding both?


  4. Separation of the arms: the causal independence condition. In a real experiment,
  treatment of one unit doesn''t affect the other. In the historical cases, the units
  traded, borrowed technology, competed for the same bullion flows and colonies, and
  the outcome in F plausibly depressed the outcome in C. Can a contrast be well posed
  when the arms are causally coupled? If not, a lot of the literature is answering
  an ill-posed question; if yes, we owe an account of what the counterfactual ''holding
  F fixed'' even means.


