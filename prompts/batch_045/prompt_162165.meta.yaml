  Draft:


  I’ve been rewatching Arrival (the 2016 Denis Villeneuve film, based on Ted Chiang’s
  1998 novella Story of Your Life) and I keep getting stuck on the Hannah stuff. Quick
  setup in case it’s needed: Louise Banks is a linguist brought in to talk to the
  aliens; as she learns their language she starts having what look like flashbacks
  of a daughter, Hannah, who dies at twelve from an incurable illness; the reveal
  is that these are not memories but premonitions of a child who hasn’t been born
  yet, because the alien language lets a person experience future events out of order.
  The weapon the aliens offer turns out to be the language itself, and the story seems
  to move toward Louise embracing the future she has seen rather than trying to prevent
  it.


  I want a reading of the film through suffering-focused ethics / negative utilitarianism:
  the broad idea that intense suffering matters more, maybe lexically, than happiness,
  and that knowingly creating a being who will suffer and die young looks like a serious
  moral cost even if the life also contains love and joy. I don’t need a summary and
  I don’t want citations. What I do want is this: does Louise’s apparent choice to
  go ahead and have Hannah count as a rejection of that ethical outlook, or does the
  film’s weird time structure give her an excuse?


  To make it less hand-wavy I’ve been toying with a made-up principle, call it the
  already-mourned-child move. Normally, if someone is deciding whether to conceive
  a child and knows in advance that the child will undergo intense suffering and an
  early death, a suffering-focused view says that expected suffering is a heavy cost,
  perhaps decisive. But Louise does not decide in ignorance: she has already lived
  through the grief of Hannah’s death as a kind of memory before Hannah exists. The
  already-mourned-child move says this pre-lived grief changes the moral picture—either
  it partly offsets the badness because the parent has already paid some of the emotional
  cost, or, in a stronger retrospective-negative-utilitarian form, it means the suffering
  is in a sense already actual and accepted, so the choice is not one of producing
  suffering but of consenting to a future that is tenselessly there. Does that move
  actually hold up, or does it trade on a confusion between Louise’s anticipatory
  grief and Hannah’s own suffering? Does Arrival dramatise the move honestly, or does
  it smuggle in a sentimental thought that the value of the parent’s love somehow
  outweighs the child’s pain?


  I also want the reading to say where the film resists the lens. Maybe Arrival is
  not really a procreation-ethics story at all: its non-linear time is a metaphor
  for grief, love, and mortality, and a hard-nosed suffering-focused ethicist would
  say the heptapod gift is monstrous, because it removes ignorance without removing
