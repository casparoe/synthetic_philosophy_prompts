  Draft prompt (student in philosophy of science course, writing a term paper on evolutionary
  epistemology):


  ---


  I''m writing my term paper for a philosophy of science course on Popper''s evolutionary
  epistemology, and I want to lean on the Darwinian analogy that runs through it:
  conjectures (or tentative theories) play the part of variations, error elimination
  plays the part of natural selection, and theories themselves are the organisms being
  selected. My supervisor says the analogy is doing all the work and I should find
  out how much it can carry.


  Concretely, I''m using it for two claims, and I''d like to know whether either survives.
  First: that the growth of knowledge is a selection process rather than a directed
  one, so that research can''t be steered from the top — the analogue of not being
  able to direct which mutations arise. Second: that because the selecting is done
  by the world rather than by us, the theories that survive have something going for
  them beyond their having survived — the analogue of fitness tracking something real.


  Please audit the analogy. Give the correspondence explicitly (a table is fine):
  what plays the organism, the variation, the inheritance, the fitness, the environment,
  the generation, and whatever plays the gene. Then the disanalogies, separating the
  ones that bite on my two claims from the ones that are merely cosmetic. The ones
  I''m stuck on:


  - Inheritance. Biological inheritance under the modern synthesis is Weismannian
  — what an organism acquires isn''t passed on — whereas what a theory acquires in
  the course of being tested (its surviving, its reformulations, its auxiliary adjustments)
  seems to be exactly what is passed on. Is that a parameter that differs, or does
  it put the analogy on the wrong side of Lamarck?

  - Opting out of selection. An organism can''t make itself un-selectable, but a theory
  can be made immune to refutation, and lowering a theory''s testability seems to
  raise its survival rate. If fitness can be gamed by the analogue of hiding from
  the environment, what happens to the second claim?

  - The steering claim. Popper insists conjectures aren''t random in the way mutations
  are, only uninferred; but Campbell''s version of the scheme says blind variation.
  Does the variation term have to be blind for the analogy to deliver "can''t be steered,"
  and if it does, am I quoting Campbell at Popper?

  - Niche construction and theory-ladenness. Biologists now say organisms partly build
  the selection pressures they face; philosophers of science say our observations
  are shaped by the theories we hold. Does this make the analogy better than Popper''s
  own version of it, or does it break the one thing I needed it for — that the selecting
  is done by something independent of what''s being selected?


  Finally: which of my two claims, if any, is actually supported once the disanalogies
  are in, and is there a better comparison for the growth of knowledge than natural
  selection — or does every candidate inherit the same problems?


