  Student answer draft (~450 words):


  "Start with (ii), because it does most of the work. The claim is not a generalisation
  about people like me — it is not that anyone with my DNA and biography would have
  had to come from these gametes. It is a claim about me: this individual, picked
  out rigidly, could not have existed unless it developed from sperm S and egg E.
  That is why the terms matter: ''I'' and my name keep pointing at the same object
  when we ask what might have happened to it, so we are not asking whether some counterpart
  of mine came from different gametes. And it is not an epistemic claim: I am not
  saying we lack the evidence to know which gametes I came from. The claim is that
  the object itself could not have had a different origin.


  On (i): it is supposed to be necessary — necessary in the strong sense, holding
  no matter how the world had gone — and yet a posteriori, because nothing in the
  concept of a person, or in logic, tells me which gametes I came from; I had to find
  that out from the world, in my case from what my parents told me and, more rigorously,
  from a DNA test. So the necessity is metaphysical but the route to it is empirical,
  in the way the identity of water with H2O is supposed to be.


  The derivation is short. Identity is necessary: if a = b then necessarily a = b.
  Let me be a and let the child of S and E be b. I am that child. So, necessarily,
  I am the child of S and E — and that just is the thesis. Nothing more is needed.


  On (iii): the twins objection seems to me to succeed, and I think the standard view
  has to give something up. Identical twins come from one sperm and one egg and are
  two people; so having come from S and E does not settle which person you are, and
  a principle that leaves the identity of the person unsettled cannot be doing the
  work it was introduced to do. The usual repair — replace the gametes with the zygote,
  and say each twin had to come from the zygote it came from — is worse than the disease,
  because a twins'' zygote is the same zygote. Sameness of gametes therefore cannot
  be sufficient for sameness of person, and that was the whole point of the thesis.


  There is a related cost which I take to be a reductio. If the gametes are essential
  to me, so is the moment at which they met: I could not have been conceived a month
  earlier or later, and so not born a month earlier or later either. But of course
  I could have been born a month late — my mother''s pregnancy could have run longer
  — and no one thinks that would have made the baby somebody else. So the view is
  too strong, and we should conclude that origin is not essential, only the broad
  genetic makeup is."


