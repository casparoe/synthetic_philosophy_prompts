  ---


  I''m a software engineer — I build forecasting and backtesting systems for a living,
  no philosophy background at all beyond one Coursera course — and somehow that got
  me invited to give a guest talk next month at a university philosophy of science
  reading group. The topic is whether non-empirical arguments can confirm a theory,
  with the string landscape / multiverse as the test case.


  Here''s the thing I''m actually arguing. I want to separate two questions people
  keep running together: whether non-empirical assessment is ever evidence at all,
  and how strong it is in this case. My claim is that we should treat it as a forecasting
  method and audit it the way I''d audit a model at work:


  1. Write down the criteria in advance (pre-register them): "no one has found a viable
  alternative after N years of searching", "the theory unexpectedly unifies things
  it wasn''t built to unify", "arguments of this kind have paid off before."

  2. Build a historical dataset of theories that were accepted mainly on those grounds
  before they had decisive evidence, with a symmetric inclusion rule — you have to
  include the ones that later died, not just general relativity and continental drift
  — and score the method''s hit rate.

  3. Correct for the fact that the cases everyone cites are survivors, and check the
  conclusion is robust across a few different scoring rules, because otherwise the
  backtest itself is just fitted to the answer you wanted.


  My punchline: the method survives step 1 — it isn''t meaningless — but at step 2
  the base rate is much worse than the multiverse literature implicitly assumes, so
  all this buys the landscape is a modest credence bump, not confirmation. And the
  burden shifts: if you want more than that, you have to pre-register your criteria
  and eat the score.


