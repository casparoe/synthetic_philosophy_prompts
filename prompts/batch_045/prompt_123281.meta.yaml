  For and Against), he imagines a man who can save either his wife or a stranger from
  a burning building (or drowning). Utilitarianism says he should save whichever produces
  more utility, maybe both equal, so either is permissible; but if he thinks "I am
  allowed to save my wife because she''s my wife" that''s one thought too many—he
  should just save his wife without the thought that it''s permissible. Williams''s
  deeper point: Utilitarianism makes integrity impossible because it demands agents
  act on impartial utility, and if the agent''s ground project is his relationship,
  utilitarianism alienates him; also negative responsibility (Jim and the Indians)
  etc.


