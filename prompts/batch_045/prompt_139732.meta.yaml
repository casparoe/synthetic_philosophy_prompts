  "(a) Block''s distinction is between two things people mean by ''conscious''. Access
  consciousness is a relational or functional property: a state is access-conscious
  if its content is broadcast and so available to the rest of the system, i.e. the
  subject can report it and use it to guide action. Phenomenal consciousness is the
  ''what it''s like'' — the experiential property, e.g. what it''s like to see red.
  Block argues these can come apart, and he uses the Sperling partial report data
  to argue that there can be more phenomenal consciousness than access: subjects seem
  to have a rich visual experience of all twelve letters even though they can only
  report three or four of them. This matters for GWT because GWT (Baars, and Dehaene''s
  version with ''ignition'' in frontoparietal cortex) is a theory of what happens
  when information gets into the global workspace and becomes available to many systems.
  That is a theory of access consciousness. So GWT and phenomenal consciousness are
  talking about different things, and Block''s complaint is that GWT fans slide between
  the two.


  (b) RLS would be a much better version of the overflow argument than the Sperling
  data, because Sperling''s data is behavioural and critics have said the extra ''richness''
  is really just unconscious cognitive processing (lots of high-capacity but non-conscious
  representation) rather than extra experience. RLS is a neural signature, it is local
  rather than global, and it tracks the subject''s own ratings of how much things
  looked like something — so it looks like a neural correlate of experience, not just
  of information. And it is not broadcast, so by definition it is not access-conscious.
  So RLS shows phenomenal consciousness without access consciousness, which is what
  Block needs, and since GWT says that consciousness just is global availability,
  RLS refutes GWT. The best GWT reply is to say that the ratings are unreliable or
  that RLS is a precursor of consciousness rather than a correlate of it, but that''s
  ad hoc: if a neural signature predicts how things look to the subject, we should
  take it as a signature of consciousness, and there is no reason to insist that the
  broadcasting has to be part of it. Block''s absent qualia argument already made
  this point in a different way, by imagining creatures with experience but no access,
  so the RLS case just confirms it empirically."


