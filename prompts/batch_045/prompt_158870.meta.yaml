  Essay content:


  §1. Setup. Achilles has two premises A and B and conclusion Z. Tortoise accepts
  A and B but not Z. Achilles offers C: if A and B then Z. Tortoise accepts C but
  still won''t accept Z, demands D: if A and B and C then Z. And so on. Standard reading:
  the dialogue is about whether deductive inference can be justified by adding premises.


  §2. What the regress shows, at minimum: you can never force someone to draw a conclusion
  by adding more true propositions to their stock. Adding premises changes what they
  believe, not what they do with what they believe. That''s why the regress is infinite
  rather than terminating: each new conditional is another thing the Tortoise believes,
  and the gap between believing the conditional and drawing the conclusion is untouched.
  So the moral isn''t "deduction can''t be justified" but "no amount of propositional
  input settles how to reason."


  Call this the conservation claim: for any finite stock of premises S and any rule
  R, if you need R to get from S to some conclusion, adding a premise that states
  R''s validity gives you a new stock S'' from which you still need a rule — and the
  rule you need is not obviously R (it might be R again, or a meta-rule). So the number
  of rules you must apply without their being stated as premises is invariant under
  premise-addition: always at least one. Corollary: the regress is not a regress of
  *premises* but a fixed point — at every stage, the same unlicensed rule is doing
  the work. Hence Carroll hasn''t shown that justification is impossible; he''s shown
  that justification-by-premise-addition has a conserved residue.


  §3. Is that just the "rules aren''t premises" point? I claim not, and here''s the
  difference. The textbook point is semantic/category: a rule of inference is a license
  to move, a premise is something you move from, so asking for a rule in premise form
  is a category mistake. The conservation claim is *structural/epistemic*: even granting
  the category distinction, and even granting that the Tortoise can be *given* the
  rule explicitly (say by being hard-wired, or by being told "from p and if-p-then-q
  you may infer q"), there is still a residue — the Tortoise must now accept that
  license as correct, i.e., the demand reappears one level up as a demand for a reason
  to trust the rule. So the regress isn''t a category mistake that dissolves; it re-emerges
  as a regress about the *acceptance* of rules. I call the second version "the vertical
  regress" (about trusting the rule) vs "the horizontal regress" (about needing more
  premises). And my claim is that Carroll''s text only generates the horizontal one
  — the vertical one is what people *think* they see in it.


