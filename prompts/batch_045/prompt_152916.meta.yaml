  Setup: A hydrology team (or an epidemiology team) choosing between two simulation
  models for flood-defense planning. Both known false. Want "Model A is closer to
  the truth than Model B."


  Proposal: "Pragmatic, Query-Relative Truthlikeness" (call it Q-verisimilitude):


  Definition sketch:

  - Fix a finite set Q of "queries": each query q is a yes/no question about the target
  system, or a quantity with a tolerance (a triple: quantity, target value, tolerance
  ε).

  - For a model M, define its Q-truth-content: the subset of Q that M gets right (within
  tolerance), and Q-falsity-content: the subset it gets wrong (and by how much — graded
  via a loss function ℓ_q(M, truth) normalized by ε).

  - Ranking: M ≽_Q N iff M''s Q-truth-content ⊇ N''s and M''s total graded Q-error
  is ≤ N''s... but need an aggregation: a weighted sum? The team proposes: M is Q-closer
  to the truth than N iff (i) M answers every query in Q at least as accurately as
  N (tolerance-normalized), and (ii) strictly more accurately on at least one. This
  is a dominance/Pareto-style comparative definition — deliberately mirroring Popper''s
  comparative definition but restricted to Q and graded.

  - Because Q is finite, the infinity-generating trick (T ∨ P for arbitrary false
  P) has nowhere to go: falsity-content can''t be inflated without bound by irrelevant
  false consequences. So collapse argument seems blocked.


  Additional requirements the team imposes, which create the interesting tension:

  (a) Refinement-stability: if Q is refined (a query split into sub-queries, or a
  tolerance tightened) the ordering must not flip, unless the refinement crosses a
  "resolution threshold" at which the models'' rankings genuinely differ.

  (b) Reparametrization invariance / language independence: describing the same target
  system with different variables (peak height in meters vs. peak discharge in m³/s;
  or position vs. velocity representation) shouldn''t alter the ranking — this is
  meant to block the old language-dependence objection.

  (c) Epistemic tractability: ranking must be estimable from finite noisy data, i.e.,
  there should be a scoring rule / cross-validation-esque estimator that converges
  to the Q-ranking.


  The interesting implications I hope for:

  1. The dominance condition is extremely demanding — with graded, tolerance-relative
  accuracy, near-ties in one query while big gains in another mean most pairs are
  incomparable; the ordering is very partial. So the "fix" buys determinacy at the
  cost of comparability, and the team will face a forced choice: weaken to a weighted-sum
  aggregation, which reintroduces arbitrariness in the weights — i.e., the pragmatics
  of the decision is doing the work, and the notion drifts from "closeness to the
  truth" toward "expected decision value" / fit-for-purpose. So Q-verisimilitude may
  not be a truthlikeness notion at all but a cognitive-value notion (axiological problem
