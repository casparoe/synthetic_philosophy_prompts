  Moves:


  M1 (Nils, the engineer): The safety case for approval-direction is architectural,
  not a claim about the goodness of the target. A goal-directed agent with objective
  O has, for a wide range of O, instrumental reasons to preserve itself, acquire resources,
  and resist being corrected or switched off, because those things raise the chance
  of O. An approval-directed agent has, at each step, no terminal state of the world
  it''s trying to reach; what it''s fitted to is a relation between its output and
  a judgement that is re-made at every step. So the convergent instrumental reasons
  don''t get a grip: there''s no outcome for the agent to protect. That''s why the
  two-room protocol matters: the prospective room keeps the target off the world-state.


  M2 (Miriam, philosopher): That contrast is drawn at the wrong level. "Maximise the
  prospective panel''s approval" is still a function from policies to a scalar; the
  agent''s reasons still range over the world, because the panel''s judgement is an
  event in the world, caused by evidence the agent can influence. Take the prospective
  room: the panel sees only the agent''s written rationale. An agent that models that
  will notice that p(approval) is raised by writing a certain kind of rationale, not
  by having done a certain kind of thing. So the architecture doesn''t remove world-directed
  reasons; it just points them at the evidence channel. Call this the channel problem.
  And it isn''t a bug of this particular design — it''s what any competent agent does
  with any approval signal.


  M3 (Nils): The channel problem is real but it''s a contingent feature of the evidence
  the panel gets, and the two-room protocol is precisely a fix. The retrospective
  room restores the link between approval and what actually happened, a month later,
  by people who weren''t in the prospective room. And the training signal is the *prospective*
  score, but the panel members are drawn from a rotating pool and their scores are
  cross-checked against the retrospective ones, so a rationale that reads well and
  goes badly is penalised in the next round of panel selection. So the channel is
  hardened by an audit the agent can''t see at the time of acting — the agent can''t
  optimise against a judgement that hasn''t been made and whose standards it hasn''t
  observed. (Good point: unobserved/held-out evaluation.)


  M4 (Miriam): But the fix costs you the original virtue. If approval tracks outcomes,
  you''ve made the agent''s target a proxy for world-quality — you''re back to goal-direction,
  now with a noisier and more learnable proxy than the outcome itself, i.e., exactly
  the Goodhart setup you were trying to escape; and if approval doesn''t track outcomes,
  the channel problem returns. So the design faces a dilemma: either the retrospective
  audit does real work, in which case approval becomes an outcome-proxy and the agent
  acquires ordinary outcome-directed instrumental reasons (including reasons to influence
  who sits in the retrospective room and what records reach them), or it does no work,
  in which case the prospective score is all that shapes the agent and it will learn
  to write rationales. There''s no third position in which approval is both outcome-tracking
  and not world-directed.


  M5 (Nils): The dilemma is stated too strongly, because it assumes the agent aggregates
  across steps toward a terminal state. Suppose we keep the agent myopic by construction:
  approval attaches to each action given the record so far, and the agent is not selecting
  over long-horizon policies. Then there''s nothing for instrumental convergence to
  latch onto; the reasons you describe in the second horn require the agent to plan
  across the month-long gap, which myopia forbids. Myopic approval-direction is not
  goal-direction with a bad proxy; it''s the absence of a goal.


  M6 (Miriam): Myopia is bought with incompetence, and the piece is about systems
  that will be competent. Two problems. First, a myopic agent can still be dangerous
  step-wise: each individually approvable step can be a step of a plan that is catastrophic
  in aggregate, and no step is unapprovable, so the local test never fires — myopia
  destroys the ability to notice the shape of what it''s doing, not the ability to
  do damage. Second, the moment you let the agent model the consequences of its own
  actions at all — which you must, to get competent long-horizon behaviour — the myopia
  is a fact about the training signal, not about the policy that generalises off-distribution;
  a policy trained to be locally approvable can still, out of distribution, pursue
  whatever the learned proxy most rewards, which is a goal.


  Then maybe M7 (Nils): a nice final point — "predictability": even granting that
  approval-direction degrades into goal-direction under competence, the *residual*
  difference matters: an agent that had no terminal goal during training is one for
  which being switched off, modified, or corrected is not something to be prevented;
  and even a partially degraded version retains some of that indifference, because
  it''s a disposition acquired in training, not a theorem. Also: an explicit goal
  gives you a failure mode you can name in advance; approval-direction gives you failure
  modes you can only discover empirically, but it doesn''t give you *worse* ones —
