  I''m writing a piece on why institutional metrics decay, and in interview after
  interview I hear the same move: the analogy to quantum measurement. The claim is
  that a performance metric is like an observation on a physical system — Heisenberg''s
  lesson being that observing a system disturbs it, and that precision about one quantity
  is paid for in ignorance of another — so a school district graded on test scores,
  a hospital graded on waiting times, a lab graded on a benchmark, will corrupt exactly
  what the number was meant to track. Speakers lean on it to license something strong:
  that this is a fact about measurement as such rather than a remediable design flaw,
  so the rational posture is to measure less, to discount any quantitative target,
  and to treat every metric as eventually self-defeating.


  Please audit it. I want the correspondence table — what plays the system, the observable,
  the conjugate quantity, the disturbance — then the disanalogies, separated into
  the ones that bite on that conclusion and the ones that are cosmetic. Two I would
  like you to press hard on. First: quantum disturbance is set by physics and is not
  something the measured system does because it anticipates being measured, whereas
  specification gaming is done by agents who model the metric and optimize against
  it; the size of the distortion should then be a function of incentives, information,
  and optimization pressure, not a constant, and it should respond to design. Second:
  the failure modes are not all the same shape. A proxy can come apart from its target
  because we started selecting on the extreme tail of the range in which the old correlation
  held, or because acting on the proxy changed the causal structure that generated
  the correlation, or because the graded party reshaped its behavior to hit the number.
  Only some of those are about the target reacting to measurement, and presumably
  only some are cured by measuring less.


  Where does that leave the conclusion the analogy is used for? I have also heard
  control theory offered as a better analogy — a governor or thermostat, where reading
  and system are coupled on purpose, and what goes wrong is gain and lag rather than
  the reading — and if that is better, does it change the practical advice? Please
  answer in American English.


