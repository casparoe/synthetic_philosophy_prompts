  Draft begins (I''ll write ~850 words):


  Caruso''s target is basic desert: the idea that a wrongdoer morally deserves to
  suffer in virtue of the wrong alone, prior to any good that the suffering produces.
  If free will scepticism is right, no one has the kind of control that basic desert
  needs, so retributivism is out, and the state should switch to a public-health model:
  quarantine, treatment, rehabilitation, general deterrence, all constrained by rights
  and by proportionality of a purely forward-looking kind. Dennett thinks this gives
  up too much and, more importantly, gives up something that does work. On his picture
  moral responsibility is a real, evolved, socially maintained status; it comes in
  degrees, and what tracks those degrees is not luck-free contra-causal power but
  something like evitability — the capacity to anticipate a consequence and steer
  around it. The practice of holding people responsible, on this view, isn''t a report
  on a metaphysical fact; it''s part of what makes agents into the kind of thing that
  can be reasoned with. Call this the scaffolding claim.


  My worry is that both of these positions are unstable at the same place: the long
  case. Quarantine has no natural expiry date. If the only justification for confining
  someone is that they remain dangerous, then the confinement lasts exactly as long
  as the danger does, and our tools for estimating that danger are bad in a particular
  way: they are tolerably good for populations and terrible at the tails, and they
  are least reliable precisely for the people we are most tempted to keep in. (...)


  Then: Dennett''s desert, by contrast, has a built-in expiry: the desert is fixed
  by the wrong, so it runs out. That''s the expiry argument: a retributive element,
  even a merely notional one, is doing work for Caruso that his own theory can''t
  do — it caps the sanction.


  But I don''t want to go back to retributivism. My suggestion: desert as a cap, not
  an engine. Quarantine does the positive justifying; desert-talk is retained as a
  side-constraint (a ceiling), plus an "addressive" function: blaming addresses someone
  as a reason-responsive agent rather than as a hazard to be managed, and that matters
  even if you think the metaphysics is bogus.


  Two original bits:


  (i) The smuggling point: actuarial risk instruments used in the quarantine model
  often include items (remorse, acceptance of responsibility, attitude to the offence)
  that are proxies for desert-attribution. So the quarantine model may be empirically
  dependent on the desert practice it claims to replace; if you purged the instruments
  of everything desert-shaped their predictive power would drop. So the models aren''t
  as independent as advertised; and to that extent Caruso''s model inherits the metaphysical
  problems he raises for retributivism.


  (ii) The founding regress / pedagogical regress against scaffolding: if desert-attribution
  is what makes people reasons-responsive, then the first cohort of people it was
  applied to weren''t yet reasons-responsive in the relevant way, so they didn''t
  deserve it on Dennett''s own capacity-tracking terms. The practice is bootstrapped
  on an injustice it can never repair, and — worse — the same is true at the individual
  level: every child who is blamed before they can respond to reasons is blamed undeservedly.
  Dennett can say the practice is justified by its downstream effects, but then he''s
  already a consequentialist about justification and has to answer Caruso''s rights-based
  objection: you can''t use this person as a means to the responsiveness of others.


  Case: Alan and Bryn. Both drunk, both start a fire in a disused warehouse, identical
  damage, identical actuarial scores except Alan''s is a bit higher. Bryn would have
  stopped if he''d thought about it for ten seconds; Alan wouldn''t have. On the capacity
  view Bryn is the more blameworthy (more evitable); on the risk view Alan is the
  one to watch. So desert and quarantine diverge, and the divergence is the whole
  ball game: which one do we let decide the sentence, and why?


  Conclusion: my thesis: keep quarantine as the engine, keep desert as a cap and a
  form of address, and note that each side needs the other''s machinery.


  (iii) Maybe a third original bit: "the asymmetric-decay / ratchet objection": desert
  is capped but quarantine ratchets; but also desert-talk can be hijacked. Alternatively
  a third: "the opt-in problem" — Dennett suggests agents can opt in or out of moral
  responsibility; but opting out for Dennett lands you in the institution, which is
  exactly Caruso''s quarantine; so at the boundary of responsibility Dennett collapses
  into Caruso. That''s a nice third original point — and it uses the verified Wikipedia
  detail about opting in/out (imprisoned or institutionalised). I''ll include it as
  "the collapse at the boundary".


