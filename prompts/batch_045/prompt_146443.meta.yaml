  Draft:


  "I spent about a decade in failure analysis for a consumer-products company — mostly
  drop tests, impact tests, and the arguments afterward about whether the thing we
  tested was really the thing we shipped — and since retiring I''ve been reading a
  bit of metaphysics on the side, badly. I keep running into the same little knot.
  Everyone around me, including the philosophers I''ve read, seems happy to say that
  a thing''s being fragile, or soluble, or conductive, or disposed to shatter, just
  amounts to what would happen to it under the right circumstances: fragile = would
  break if struck, and so on. And yet I have a shelf of cases from work where that
  translation goes wrong, and — this is the part I care about — it seems to go wrong
  in at least four distinguishable ways, and I don''t have vocabulary for any of them.


  The first: a genuinely fragile ceramic component that we drop during a test onto
  a padded surface; it doesn''t break, but nothing about it changed — it''s the packing
  that absorbed the blow. Call it interference from outside. The second: a genuinely
  fragile component rigged to a monitor that alters the component''s internal structure
  the instant an impact is detected, so that at the moment of the strike it is no
  longer fragile; here the thing itself changes, and the change is triggered by the
  test. The third, which is my actual worry, comes from materials like shear-thickening
  gels: the material is soft and deformable in its resting state, but a sharp impact
  makes it go rigid, and it is the impact itself — no separate monitor, no added gadget
  — that produces the change, as a matter of how the material normally behaves. So
  the condition that would reveal the deformability is the condition under which the
  deformability is gone, and yet it''s obviously still a soft material: press it slowly
  and it deforms. It feels like the second case but it also feels like a cheat to
  call it the same thing, because in the second case the change was engineered from
  outside and erased a disposition, whereas here the change is the material''s own
  response and gives it the opposite of the disposition in question. The fourth is
  the reverse of all this: a component that is not fragile at all, but which a colleague
  will smash with a hammer the moment anyone strikes it, so that ''it would shatter
  if struck'' comes out true while the disposition everyone cares about is simply
  absent.


  A colleague with a philosophy minor told me years ago that at least a couple of
  these patterns have stock names in the literature — she thought one of them was
  a short word that also means a police informer — but she couldn''t reconstruct the
  definitions and I''ve never been able to chase it down. So: do these patterns have
  established names, and if so which pattern goes with which name, precisely? In particular,
  is my third case one of the named ones, or is it something else, and what exactly
  would settle that — what feature should I be looking at: whether the change is intrinsic,
