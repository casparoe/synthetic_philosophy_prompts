  is destroyed is a group with a distinctive form of life, the loss includes the non-existence
  of that form of life and of the future it would have had, and this is not captured
  by counting the dead. I hold this is why I find myself saying that the destruction
  of a small community by the people who lived alongside it can be worse than a much
  larger administratively organised killing that did not target a form of life.


