  Here is the set, as I actually hold it:


  (1) Anti-exceptionalism. Comparisons are unavoidable: any decision about commemoration,
  reparations, humanitarian priority, or what gets taught already ranks cases, and
  a refusal to compare is itself a ranking — a default allocation of attention. So
  the only question is how to compare, never whether. In particular I reject uniqueness
  and incomparability claims, including the claim that any single case is beyond comparison;
  as far as I can tell such claims function to insulate a case from scrutiny and are
  usually advanced by people with an interest in the case''s standing.


  (2) A single currency, additively aggregated. The badness of an atrocity is a function
  of the suffering and death it causes; deaths count the same whoever dies; and the
  marginal badness of a death is roughly constant, so two million is close to twice
  as bad as one million, other things equal. Rankings by absolute magnitude are therefore,
  other things equal, the correct rankings.


  (3) Intent is not merely epistemic. Deliberate extermination is worse, other things
  equal, than the same number of deaths brought about as a foreseen but unwanted side
  effect of policy; so a smaller intentional killing can be the greater evil. I want
  this to be a claim about the evil of the event, not only about the blameworthiness
  of the agents.


