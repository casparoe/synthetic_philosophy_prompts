  The paper is on Peter Turchin''s structural-demographic theory and, specifically,
  on the problem of testing it. As I understand the setup: in preindustrial agrarian
  states, population growth gradually drives down real wages and increases the supply
  of elite aspirants relative to the number of elite positions, which produces popular
  immiseration, elite overproduction and intra-elite competition, fiscal strain on
  the state, and eventually a disintegrative phase. The whole sequence is usually
  described as taking roughly two to three centuries.


  What bothers me is that the theory, as I''ve seen it stated, doesn''t seem to fix
  a period. It says the interval between crises is "about" two or three hundred years,
  which is vague enough to accommodate almost any observed gap, and a theory that
  can accommodate anything isn''t falsified by anything. So my proposal — which I''m
  calling the Interval Rule — is to make the temporal claim strict and therefore testable:
  take T = 250 years, let t₀ be the date of a polity''s founding or of its most recent
  disintegrative phase, define the phase φ = (t − t₀)/T, and predict that the onset
  of the next disintegrative phase falls within, say, ±10 years of φ = 1. On a few
  cases I''ve checked by hand — late medieval England, early modern France, Romanov
  Russia — the rule seems to line up, and it also makes sense of Turchin''s 2010 Nature
  correspondence forecasting growing instability in the United States and Western
