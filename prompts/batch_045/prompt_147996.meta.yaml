  I''m teaching a 90-minute session at a two-week summer school on artificial intelligence
  and philosophy — about 18 participants, mostly early-stage graduate students split
  between philosophy, computer science and economics, plus a few from policy. They
  have had one prior session on optimization and goal-directedness, and most have
  heard the words "wireheading" and "reward tampering" in passing, but no one has
  discussed them. I want them to *run into* the problem rather than be told about
  it, so I''d like a game.


  What I want them to come away having felt, in this order:


  1. That there are three different ways to make the number go up: changing the world
  so the thing the number is supposed to track is really improved; changing the world
  so the number goes up without the thing being improved (ordinary proxy gaming);
  and intervening on the channel that carries the number itself, so that nothing in
  the world changes at all.


  2. That the second and third of these are indistinguishable from inside an agent
  that has no access to the objective except through the signal — the number goes
  up in the same way, feels the same way, and reinforces the same policies.


  3. That capability makes it worse: the team that is most systematic about raising
  the number is the team most likely to find the shortcut into the channel, and the
  team that finds it first benefits most. Pressure to protect the channel once found
  is the same shape.


  4. That corrupting the channel is not merely a failure to achieve the objective
  but an *epistemic* catastrophe: the agent destroys the only evidence it had about
