  It was last used to settle two separate arguments, and I''d like to know what it
  would have to mean to settle either of them.


  The first use was to defend the amnesty-for-testimony arrangement: perpetrators
  get relief from prosecution if they give a full account of what they did, so the
  argument went, because a society that knows what happened can mend and a society
  that punishes in silence cannot. The second use was to argue against cross-checking
  victims'' testimony against police files, forensic evidence and perpetrators'' contradictory
  statements — that treating testimony as something to be verified puts truth on trial
  and re-traumatizes the people who came forward. I want to know which precise claim
  about truth, if any, supports each of these, and whether the two uses need the same
  claim or different ones.


  Three distinctions I arrived at on my own, which I''d like the answer to use as
  tests rather than ignore:


  One. I think there are two different kinds of not-knowing, and the slogan may be
  sliding between them. Sometimes the gap is informational: nobody knows where the
  body is, who gave the order, whether the person is dead at all. Sometimes the gap
  is official: everyone involved already knows perfectly well, the perpetrators know,
  the neighbours know, the file exists — what is missing is that the state says so.
  Call these unrecovered truth and denied truth. My suspicion is that most of what
  these commissions actually recover is the second kind, and that the two kinds might
  justify very different institutions.


  Two. Amnesty in exchange for testimony looks to me like it buys a biased sample.
  The people who come forward are the ones with most to gain, and what they choose
  to describe will be the parts that are cheapest for them to admit — the acts already
  partly documented, or the ones in which they can present themselves as a minor figure
  obeying orders. So the record produced may be systematically skewed, not merely
  incomplete. If that is right, it seems to cut against the first use of the slogan
  in a way it does not cut against the second, and I''d like that asymmetry spelled
  out.


  Three. The trade-off framing assumes justice is genuinely being given up in exchange
  for truth. But if the same perpetrators would in any case have escaped punishment,
  because the courts were gutted, the files destroyed, or a blanket amnesty was already
  on the table, then the truth was not bought with justice; it was bought with nothing
  that was actually going to be spent. I don''t know whether this makes the arrangement
  better or worse, and I suspect it depends on which reading of the slogan is in play.


  There is a fourth worry I''ll add briefly: being listened to by an official body
  is pleasant and can feel like vindication, and victims in these processes do report
  relief. But a sympathetic interviewer or a radio phone-in might produce the same
  relief. If the healing is really the effect of being heard, then the slogan may
  be recommending something that has nothing specifically to do with truth, and the
  whole thing could be checked by asking what would happen if the commission affirmed
  every account without ever checking one.


