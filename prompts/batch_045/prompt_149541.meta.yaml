  The underlying virtue here is epistemic modesty: the admission that your own judgment
  about your own case is unreliable, and that you should defer to the pooled judgment
  of everyone who has stood where you''re standing. Some philosophers grumble that
  you can gerrymander a reference class to get whatever answer you want, but that
