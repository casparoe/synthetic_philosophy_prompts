  I''m applying for a twelve-month fellowship to finish a project on decision-making
  under risk, and I need a proposal of about two pages. My half-formed idea is this.
  Risk-weighted expected utility — the framework in which an agent maximizes expected
  utility with respect to a non-linearly transformed probability distribution, so
  that a "pessimistic" weighting inflates the weight on the worst outcomes of a prospect
  and an "optimistic" weighting inflates the weight on the best — has been developed
  and defended almost entirely as a theory of individual prudential rationality: what
  it is permissible for one person to do with her own risky prospects. But the decisions
  in which the framework would do the most practical work are not like that. They
  are decisions made for, or on behalf of, many people at once: a pandemic regulator
  choosing between suppression strategies, a trustee allocating an endowment, a funder
  deciding whether to spend now on a low-probability catastrophe or on certain near-term
  benefits. In these cases there is no single subject whose attitudes toward her own
  risk could justify the weighting. My question is what happens to the theory when
  it is generalized to that case, and my suspicion is that the generalization is not
  unique, that the two natural candidates come apart, and that the parting of the
  ways reveals something about what risk-weighting was doing in the one-person case
  all along.


