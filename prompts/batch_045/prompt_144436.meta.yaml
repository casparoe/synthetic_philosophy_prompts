  stakes for the subject) with contextualism (the truth-conditions of "knows" vary
  with the attributor''s context). Student could conflate: describe contextualism
  as being about the subject''s stakes, or describe pragmatic encroachment as a semantic
  thesis about the word "knows" shifting with attributor context.

  - Another subtle mistake: claiming that invariantism is the denial that stakes ever
  matter (confusing with "classical invariantism" vs "moderate invariantism"? Actually
  there''s a distinction: "subject-sensitive invariantism" (Hawthorne) vs "pragmatic
  encroachment" — some use these interchangeably; Stanley''s version is sometimes
  called "subject-sensitive invariantism").

  - Another: misattributing DeRose''s contextualism to David Lewis (Lewis had "Elusive
  Knowledge" 1996 with rules of accommodation — attributing bank case to DeRose is
  right, DeRose''s "Contextualism and Knowledge Attributions" 1992 with the bank cases;
