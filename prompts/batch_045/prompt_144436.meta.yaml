  Does either view make knowledge unable to play that role?"


  Student''s answer (I''ll write it; italicize? just plain text with quotes):


  "Contextualism and pragmatic encroachment are both responses to the same pattern
  of cases... [bank case description]. The contextualist explains the shift by saying
  that the truth-conditions of ''S knows that p'' vary with the context of the person
  making the attribution: in a context where a lot is at stake, the standards for
  counting as knowing go up, and the very same sentence can be true in one mouth and
  false in another. The word ''knows'' is context sensitive in something like the
  way ''flat'' or ''tall'' is.


  Pragmatic encroachment (or subject-sensitive invariantism) agrees that knowledge
  shifts with practical factors, but it locates the shift differently: what varies
  is how much is at stake for the subject, not the standards in force in the attributor''s
  conversation. Importantly, encroachment is still a kind of invariantism: the meaning
  of ''knows'' doesn''t change from context to context, so unlike the contextualist
  the encroacher doesn''t have to say that one and the same sentence shifts its truth
  value with the speaker''s context. What changes is whether the subject''s practical
  situation lets her count as knowing.


  The two views therefore disagree about whose situation does the work. A case that
  separates them: if I am attributing knowledge to Dana and a lot is riding on it
  for me, while nothing much is riding on it for her, the contextualist will say that
  my high-stakes context raises the standards and so ''Dana knows'' is false; the
  encroacher will say that Dana''s own stakes are what matter, so she knows and my
  sentence is true. [correct — good]


  In the unbeknownst-stakes case, the difference is clearer still. Dana''s evidence
  is unchanged, and in her own eyes the stakes are trivial. Encroachment has to say
  that she doesn''t know, because the stakes really are high — the bet is a fact about
  her practical situation even if she''s unaware of it, and encroachment is a view
  about how much is actually at stake, not about how much the subject thinks is. Contextualism,
  by contrast, seems to have nothing to say here: nothing in the conversational context
  has changed, so it predicts that Dana knows. But this is a problem, because it shows
  that encroachment is really a version of contextualism in disguise: once the subject''s
  knowledge can depend on facts she has no access to, the encroacher is committed
  to saying that knowledge depends on something external to the subject''s evidence,
  and that is just the contextualist''s point about the attributor''s context. The
  dispute between the two views is therefore less deep than it looks. [error: non-sequitur
  + overstated; also arguably the contextualist needn''t predict Dana knows — hmm,
  keep it as the student''s claim and the error is mainly the collapse inference.]


