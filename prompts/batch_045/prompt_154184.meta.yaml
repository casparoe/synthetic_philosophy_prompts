  The version of the fence principle I care about is the strong one, not the bumper-sticker
  one. Weak version: don''t tear down an institution until you''ve understood why
  it was put up — fine, that''s just ''look before you leap,'' any reformer can sign
  it. The strong version has two extra commitments I want you to take seriously: (a)
  the tacit-knowledge point, that a practice can carry knowledge nobody inside it
  can state, so the people running the system are not automatically authorities on
  what the system is for; and (b) the asymmetry point, that keeping a system going
  is a different skill from rebuilding it, so a reform that fails can destroy something
  that can''t be reassembled even after everyone agrees the reform was a mistake.
  [Also maybe mention accreted-function problem: a fence whose original purpose is
  gone may have new ones grown around it.]


  Where I want the reading: in Omelas everyone knows the terms — the child''s misery
  is supposed to be load-bearing for the whole city''s happiness — but nobody seems
  to know it in the way that would let you act on it. So: is the child a fence in
  Chesterton''s sense at all? Chesterton''s reformer sees a fence and can''t see the
  use of it and wants it gone; the Omelans see the fence and are told (or tell themselves)
  exactly what it''s for. Does that make them Burkeans who''ve done their homework,
