  A novelist asking about Chesterton''s fence and Omelas: "I''m drafting a novel about
  a commune whose founding rule everyone follows but nobody can explain..." — that''s
  natural and in-the-weeds. The philosophical content: distinguish weak fence (look
  before you leap) from strong Burkean claim (tacit knowledge, unintended consequences,
  reforms destroy unrecoverable knowledge, the "rationalist" error), and the harder
  question: what do you do when you can''t find out why the fence is there, or when
  the fence''s original purpose has vanished but new functions have accreted? Then
  read Omelas: the child is the "fence"; everyone knows the rule; the walkers leave
  without knowing; the story refuses to test it. Does the story vindicate Burke or
  undercut him? The honest critic notes: Burke''s fence assumes the practice has a
  function discoverable by those inside; Omelas''s horror is that the function is
  known and the city depends on it — so Chesterton''s advice ("find out why then decide")
  is satisfied and yet the walkers still leave, meaning the principle is not sufficient:
  knowing why isn''t the same as the practice being justified. That''s a genuinely
  good philosophical payoff — the work adds something: knowing the rationale can be
  a reason to leave, not to stay; and the strong Burkean claim about unrecoverable
  tacit knowledge gets dramatized by the fact that no one can build a new Omelas.


