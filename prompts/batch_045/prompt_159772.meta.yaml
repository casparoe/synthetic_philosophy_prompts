  — conflation/overstatement (related but distinct; the discursive dilemma arises
  even without preference cycles; the List–Pettit impossibility differs in structure;
  also Arrow concerns preference aggregation over ≥3 options, and the judgment-aggregation
  result needs no analogue of the Pareto/IIA conditions in the same form).

  2. "no voting rule can reliably turn rational individuals into a rational group"
  — overstatement; the true result is that no rule satisfies the full conjunction
  (unrestricted domain, anonymity, systematicity/independence, collective rationality,
  decisiveness), while premise-based and conclusion-based rules each preserve consistency
  by sacrificing something else.

  3. "Which is the court''s real decision depends on nothing but which questions are
  put to the vote first" — half-right: it depends on the aggregation procedure and
  agenda, not literally on temporal order (unless sequential voting); also the dilemma
  isn''t about order but about whether the premises or the conclusion is on the agenda.

  4. "any committee... is liable to endorse conclusions that nobody in the room accepts"
  — over-generalization: it depends on the profile of judgments; many profiles are
  fine, and majority-on-each-premise coinciding with majority on conclusion is common.

  5. "the only real remedies are to hand the decision to a single person or to break
  the question down until it is yes/no about one thing" — half right on the second
  (agenda restriction genuinely helps — single-proposition agendas have no dilemma)
  but wrong/misleading on the first (dictatorship is one escape among many; premise-based,
  conclusion-based, unanimity, quotas all escape inconsistency at other costs). Also
  "break it down" note: if the conclusion is derived off-agenda (i.e., the court only
  votes on premises and doesn''t vote on the conclusion at all), the dilemma disappears
  — this is the premise-based procedure; that''s a genuine point the chapter garbles
  and is worth unpacking.

