  The summary text (write myself, plausible popularizer voice, one or two subtle misrepresentations):


  "A group can be perfectly rational member by member and still be irrational as a
  group. Suppose three judges must decide whether a defendant is liable, and the law
  says liability requires both a duty of care and a breach of that duty. Judge one
  finds a duty and a breach, so votes liable. Judge two finds a duty but no breach.
  Judge three finds no duty but a breach. Two of the three find a duty, and two of
  the three find a breach, so if the court votes on the two factual questions first
  — the ''premise-driven'' approach — it must find the defendant liable. Yet two of
  the three judges voted not liable. Which is the court''s real decision depends on
  nothing but which questions are put to the vote first; so the court''s judgment
  is an artifact of procedure rather than a discovery. This is the discursive dilemma,
  and it is simply Condorcet''s paradox of voting applied to beliefs instead of preferences,
  or, equivalently, Arrow''s impossibility theorem restated for courts: when a group
  has to decide more than one connected question at a time, no voting rule can reliably
  turn rational individuals into a rational group. Because a majority on each premise
  can produce a verdict a majority of the court rejects, the lesson generalizes far
  beyond law: any committee, electorate or board that votes on a package of related
  propositions is liable to endorse conclusions that nobody in the room accepts, which
  is why direct democracy on complex questions is a dice roll and why the only real
  remedies are to hand the decision to a single person or to break the question down
  until it is a yes/no matter about one thing only."


