  fully informed, non-strategic voting: no hidden agenda, no villains, no one being
  stupid or ignorant — I want the class to discover that each of them voted sensibly
  and the group still produced something nobody wanted (an infeasible or obviously
  dominated package). Second, I want a second round where the same group votes on
  the same measures with the same preferences but the measures are taken one at a
