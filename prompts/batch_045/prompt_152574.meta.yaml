  Here''s where I''ve landed. Aristotle isn''t offering a theory of value — not a
  labor theory, not a utility theory, not a ''subjective preference'' theory. On my
  reading, need (the thing that ''holds the city together'') isn''t a quantity that
  money measures; it''s a relation that money constitutes. Before money, two parties''
  needs are just incommensurable — my shoes, your house; nothing makes them comparable.
  Money is a conventional stand-in that creates a single scale on which the exchange
  can be proportionate, and the ratios that show up on that scale are real, but there''s
  no fact of the matter about how much ''value'' the house has that is prior to and
  independent of the scale. Call it constitutive measurement vs. derived measurement.
  The payoff for my scene: the trader can say his prices aren''t distortions of a
  true measure, because there is no true measure behind them — while Aristotle (I
  want him to) replies that this is exactly the problem: a measure with nothing to
  measure is a tool that can be pointed anywhere, which is why the same institutions
  that make proportionate reciprocity possible also make indefinite accumulation look
  like a sane thing to do. On this reading the ''unnaturalness'' of retail trade isn''t
  about the mechanism (buy low, sell high) at all, it''s about the end it''s hitched
