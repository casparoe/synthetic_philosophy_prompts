  a kill switch, a sandbox for the retraining pipeline — all seem to presuppose that
  the thing doing the modelling stands outside the thing being modelled, and I have
  become convinced that in this case it does not.


  I have been reading about embedded agency: the situation of a reasoner that is itself
  one of the objects in the world it reasons about, so that no clean Cartesian boundary
  separates agent from environment, and the standard machinery that assumes such a
  boundary — Bayesian updating over a policy-independent world, expected-utility maximisation
  over a fixed set of outcomes, offline evaluation against a ground truth — loses
  its footing. Please do not summarise this topic for me, and please do not give me
  reading suggestions or citations; assume I have no web access and that I want your
  own reasoning. What I need from you is the implications, at a level of concreteness
  at which they become decisions I could actually make.


