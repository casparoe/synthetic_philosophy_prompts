  For the past eight months I have been the technical co-founder of a six-person company
  whose only product is an autonomous procurement agent: it negotiates prices with
  other firms'' software agents, and it is retrained every night on the transaction
  data produced by its own negotiations. Until recently I was one of three people
  writing code; since our CTO''s departure I have become the person who has to decide
  whether we ship the next version, and I find that I lack the conceptual vocabulary
  to say what would have to be true of the system for any confidence in it to be earned.
