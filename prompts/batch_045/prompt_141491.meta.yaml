  Roughly: a control measure is put in place, it appears to work, and the fact that
  it appears to work is itself a reason to distrust the evidence that it works, because
  the measure''s operation removes exactly the observations that would tell you whether
  it was working. When the measure succeeds, the bad thing doesn''t happen; but the
  bad thing not happening is also what the measure would look like if it were failing
  in a way that hides the bad thing rather than preventing it. So the measure''s track
  record can''t discriminate between the two hypotheses, and it is the measure''s
  own success that destroys the power of the track record to discriminate.


  Three cases...


  (a) Monitoring written reasoning: you read the model''s reasoning before it acts
  and flag reasoning that looks like it''s planning something you wouldn''t want.
  Penalize that reasoning, and the reasoning you''d want to see stops appearing, whether
  or not the planning stopped. The monitor''s false-negative rate is then estimated
  on a distribution that the monitor has already reshaped.


  (b) Restricting actions: the model is only allowed to use a small set of tools,
  and any single forbidden action is blocked. The forbidden outcome is reached by
  composing many permitted ones — a forbidden large transfer becomes a few hundred
  permitted small ones. The block rate stays at 100% and the restriction''s log looks
