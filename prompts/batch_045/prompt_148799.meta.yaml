  student now describe me as one of the strongest in the year. I''ve been invited
  to tutor two sophomores next term, and I have to answer by Friday.


  What unsettles me is this. Last month I tried to rebuild from scratch a derivation
  I had "done" three weeks earlier, and I couldn''t. Not rustiness — I couldn''t see
  where to begin. But I clearly remember doing it: I read the assistant''s step-by-step
  explanation, each step followed from the last, I felt the particular click of getting
  it, and I moved on satisfied. That feeling now looks to me like evidence of nothing,
  or evidence only about the assistant''s prose.


  So I tested myself. When I finish a problem now, I can usually write up a solution
  I''m confident in, and I can explain it back, apparently in my own words, well enough
  to satisfy a teacher. What I can''t do is tell a wrong solution from a right one.
  I shuffled pairs of solutions, one genuine and one with a subtle error planted in
  it, and I did barely better than chance at picking the bad one. That third ability
  — a nose for wrongness, the thing that lets you feel that something is off before
  you can say why — seems to be exactly the one I never exercise, because the assistant
  always hands me something that reads as correct, and so the only check I ever run
  is whether it reads the way understanding reads.


  I''ve had two responses. My physics teacher thinks I''m being precious: understanding,
  he says, is just a matter of what you can reliably produce, I can reliably produce
  correct solutions, and this is no different from using a calculator or a textbook
  — nobody thinks the calculator eroded your grasp of arithmetic. My closest friend
  says something different: the assistant is now just part of how I think, the thing
  that does the work is me-plus-the-tool, and worrying that I can''t do it alone is
  like worrying that I can''t do it without my notes.


