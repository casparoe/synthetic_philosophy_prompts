  the right one — is reliably producing the answer really all there is to having a
  grip on something, or is the ability to smell a wrong answer a separate thing that
  can come apart from it, and if it can come apart, which one deserves the name? Second,
  assuming something in me has atrophied, was it ever really mine? I was mediocre
  at this before; maybe I never had much to erode, and the assistant didn''t take
