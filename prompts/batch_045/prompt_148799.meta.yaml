  is in ninth grade and starting the same habit, and he''ll do what I do. And I could
  simply stop for a term and find out — but it would cost me grades at exactly the
  wrong moment, since I''m applying to a competitive summer program in the spring,
  and it may be that the only honest answer comes too late to be useful.


  What would you do, and which of these arguments do you think is wrong?


