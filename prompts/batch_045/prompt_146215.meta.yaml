  ---


  You are a political philosopher who specializes in property, land use, and urban
  ethics. Please reason carefully before answering. Before writing anything, brainstorm
  the different principles that could be at stake here, and construct the strongest
  version of each one, including the ones you ultimately reject. I don''t want a "both
  sides have a point" shrug — I want you to tell me which distinctions actually do
  moral work, and then tell me what you''d do in my position.


  Here''s the situation. I''m on the board of the neighborhood association in the
  older, close-in part of a mid-sized American city. A developer wants to tear down
  a single house on my block and put up a nine-unit apartment building; the planning
  department says it''s allowed as of right. Most of my neighbors want to fight it.
  Their reasons: they bought here expecting the block to stay low-rise; the developer
  is from out of state and will probably sell to an institutional landlord; and there''d
  be a year of construction on a narrow street.


  I''m stuck, and not only about the building. I rent half of a duplex, so more housing
  looks good to me personally, and I know people who grew up here and moved away because
  they couldn''t afford to stay. But I also grew up here: my grandmother''s house
  was one of dozens demolished for a highway in the 1960s, and the families who were
  pushed out mostly ended up across town, where the schools are worse and the bus
  service is thin. So when my neighbors say "they did this to us once and now you
  want to let them do it again," I feel the force of it. When the developer''s lawyer
  says the neighbors are just protecting home values, I feel the force of that too.


  Now the wrinkle, which is what I actually need help with. Someone on the board has
  floated a rule the city council might take up: in any neighborhood vote on a rezoning
  or a variance, a resident would get one vote plus one additional vote for each decade
  they''ve lived on that block. The pitch is that it protects the people with the
  deepest stake in a place from being outvoted by newcomers and absentee owners, and
  that a rule like it would have protected the neighborhood my grandmother lived in.
  I''m uneasy: it seems to treat mere length of residence as a moral claim, and to
  hand the most blocking power to exactly the people who gain from housing being scarce.
  But I can''t say precisely what''s wrong with it, or whether my unease is just my
  own interest talking.


  So: what is the strongest case for weighting a neighborhood''s say by how long people
  have lived there, and what is the strongest case against it? More generally, what
  kind of claim — if any — does a current resident have over what gets built next
  door, and how does that compare to the claim of someone who wants to move in and
  can''t afford to, or of someone who was displaced decades ago and never got to come
  back? Does the fact that my neighbors'' objection is partly about money defeat it,
  and if not why not? And should I vote to endorse the weighted-vote rule?


  Finally: as you answer, say how confident you are in each of your main claims, and
  single out the one you''re least sure of. Flag any place where your argument turns
  on an empirical question about how housing markets actually respond to new construction,
  since I''d rather know where you''re guessing than be handed a confident answer
  that rests on it.


