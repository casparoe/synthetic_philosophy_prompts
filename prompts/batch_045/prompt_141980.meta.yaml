  Content plan:


  Paragraph 1: Setting — I''m in a reading group / writing a seminar paper on early
  modern philosophy, got interested in Hobbes''s system: he thinks geometry is the
  model science, definitions are stipulations of names (truth is in speech, not things),
  we know the causes of what we make ourselves, and natural philosophy can only go
  from effects back to hypothetical causes so it''s not demonstrative, while civil
  philosophy is demonstrable because we make the commonwealth. That sounds elegant
  but when I try to say it precisely it falls apart, and my supervisor says the interesting
  question is...


  Paragraph 2: The specific conceptual knot + my own attempt at a distinction (injected
  novelty). Two-three concrete sub-questions:

  (a) If definitions are just stipulations of names, why can''t we make physics demonstrative
  by stipulating definitions too? What exactly distinguishes a legitimate geometric
  definition from an arbitrary stipulation? My hypothesis: for Hobbes, a real definition
  has to specify the generation of the thing — the motions by which it''s produced
  — so it''s not arbitrary: I''ve been calling these "production-conditions definitions"
  vs "inventory definitions" (that just list properties). Is that Hobbes''s actual
  constraint, and does it explain why geometry is demonstrable and physics isn''t,
  given that we can''t observe the generation of natural bodies?

  (b) The bridge to application: geometry is supposed to be about real bodies (it''s
  the science of body/quantity in general in De Corpore, first part of his system),
  and it gets applied in surveying, engineering, etc. If the theorems follow from
  our own stipulations, what makes them true of physical space? Is Hobbes relying
  on the idea that the definitions are satisfied/constructible by actual motion, so
  measurement mismatches are...? My friend in the group says he''s basically doing
  something like implicit/axiomatic definition (a la Hilbert, "tables, chairs, beer
  mugs" style) and that the application is a separate empirical matter — I suspect
  this is anachronistic and misses the causal/constructive stuff, but I can''t say
  why.

  (c) The politics bit: if the criterion is "we make it ourselves," the commonwealth''s
  generation by covenant is something we do, but the matter (human passions) isn''t
  made by us — so is civil philosophy demonstrable in the same sense geometry is,
  or in a weaker sense? Does Hobbes need the causal-definition requirement to be satisfied
  by the social contract, and does this make the whole thing more empirical/less a
  priori than he advertises?

  (d) A wrinkle: Hobbes''s own geometrical practice — his notorious failed attempts
  to square the circle and the fight with Wallis. Does his theory of definition/judging
  by causes make his errors more intelligible (e.g., does he think he knows the cause/generation
  and so can skip the calculation)? Careful not to assert false facts: he did make
  repeated failed attempts to square the circle and quarrelled with Wallis — that''s
  confirmed by SEP ("best remembered for his repeated unsuccessful attempts to square
  the circle"). Good, and I can mention Wallis since SEP mentioned disputes; the Wallis
  dispute is very well documented. I''ll mention it lightly without dates.


  Also injected novelty #2: a coined contrast or a thought experiment. E.g.: "imagine
  a Hobbesian geometer who stipulates a definition of some figure, say a plane figure
  bounded by ... generated by a motion that no body can actually perform (infinite
  speed, or a line of zero breadth that bends). Does he get theorems that are vacuously
  true, false, or true of a merely possible body? What does Hobbes''s framework say
  — can a stipulation create a subject matter, or must the motion be performable?"
  That''s a great in-the-weeds wedge and it''s my own construction. Call it "the stipulation
  test": two readings — (i) permissive: any coherent stipulation yields a science
  (theorems are consequences of names), (ii) restrictive: only definitions whose generation
  is actually performable/attributable to real bodies yield knowledge. And then: the
  "inventory" vs "production" distinction.


  Let me also add the "eternal-truths / could God make it otherwise" wrinkle? Maybe
