  so I''m taking this physics of information seminar (2nd/3rd year, mixed phil+physics)
  and I''ve noticed something that I can''t find a word for, and I''m not sure if
  its a real thing or if I''m just confusing myself.


  We keep doing the same move over and over. Someone sets up a machine that turns
  information into work. We add up where the energy goes, we find the machine can''t
  actually win, and then someone says "ah, the cost was paid in step X." My problem
  is that step X keeps changing, and it seems to change depending on how we chose
  to idealise the setup rather than on anything about the machine.


  Concretely, three cases from the seminar:


  1. The one-molecule-in-a-box thing. You find out which half the molecule is in,
  you get one bit, you extract kT ln 2 of work. The usual story: you pay it back when
  you wipe the one-bit memory. Fine. But then someone asks what if the demon just
  has a huge pile of blank bits and never wipes anything — and the answer we got was
  that now the cost is in the blank bits, or in the factory that made them, or (this
  is the version I half understood) in the fact that the memory is now correlated
  with the gas, whether or not you ever wipe it. So the cost hopped from a step in
  the cycle to a state of a subsystem, and the cycle didn''t change.


  2. The feedback experiments they showed us with a bead in a laser trap being nudged
  by a controller that measures where it is. Here we were told the measurement step
  can in principle be done reversibly, so the cost is not there — it''s in resetting
  the controller. But there''s also a version of this setup where the "controller"
  is just a long tape of already-prepared bits that the machine chews through, and
  then the cost is in whoever prepared the tape, which is a different time and a different
  bench and arguably before the machine existed. So now the cost has slid along time
  as well as across subsystems.


  3. The purely mechanical one: the little spring-loaded trapdoor / ratchet thing
  with no memory and nothing you''d call a measurement. There the failure isn''t an
  information step at all, it''s that the door itself is warm and jiggles. And yet
  the number that comes out when you add it up is the same kind of size as the one
  in cases 1 and 2.


  The thing I keep noticing: the total is invariant but the location isn''t. Every
  version of the accounting comes out balanced, and the balance is always achieved
  by pointing somewhere, and the somewhere is negotiable. It feels less like "here
  is the mechanism that stops the demon" and more like a constraint on the bookkeeping
  — you can always find the cost, but which physical step is carrying it seems to
  be a function of where you drew the line between the machine and everything else,
  and of which limiting case you decided to take (reversible measurement? pre-prepared
  tape? unbounded memory?).


  I''ve started calling it "cost-sliding" in my notes and my made-up test is: hold
  the machine fixed, change only the idealisation, and see if the identified location
  moves. For all three cases it does. Which makes me think the location isn''t a property
  of the machine at all — but I also don''t want to conclude something stupid like
  "so the cost isn''t real," because the total really is fixed and the machines really
  do fail.


  Questions:

  - Does this have a name, either in the physics or in the philosophy of physics side?
  I dont want just a label though.

  - If it does, or if it doesn''t, what exactly is it and what''s it not? It''s obviously
  in the neighbourhood of the erasure-principle thing, but that''s a bound on a process
  and my worry is about where in the process the bound bites, which seems like a different
  claim. It also feels a bit like a conservation law (you can always find where the
  energy went), and a bit like the thing where heat vs work depends on where you draw
  the system boundary — but in both of those cases I think the decomposition is fixed
  once you fix the boundary, whereas here the boundary and the idealisation seem to
  be tied together in a way that makes me unsure.

  - Is anyone actually worried about this? Like, does it threaten the slogan that
