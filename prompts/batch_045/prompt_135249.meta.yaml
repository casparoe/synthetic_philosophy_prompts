  Common subtleties / misrepresentations to embed:

  1. Conflating origin essentialism with the claim that you essentially have *the
  parents you have* — actually a weaker claim: you couldn''t have come from a *completely
  different* sperm and egg, but there''s debate about whether you could have come
  from a different sperm from the same father (i.e., a different sibling) — Kripke''s
  view is often read as even a different sperm from the same parents would yield a
  different individual. Some hold "necessary origin of the individual" vs "necessary
  origin from the same parents."

  2. Conflating it with the necessity of identity / Kripke''s arguments against descriptivism,
  or with essentialism about *kind* membership (being human).

  3. Presenting it as obviously refuted by the "just replace one sperm" thought experiment,
  or by the objection from the non-identity problem / Parfit.

  4. The subtle error: saying "origin essentialism follows from the necessity of identity
  plus the principle that if x came from gamete pair G, anything identical to x came
  from G" — a common but contested argument.

  5. Another subtle misrepresentation: saying origin essentialism is the thesis that
  your *genetic makeup* is essential — but that''s not it; a different sperm could
