  with the same DNA — or monozygotic twinning, or the "same genome, different gametes"
  case). Actually a classic subtlety: origin essentialism is about which gametes,
  not which genome. Some philosophers (e.g., Salmon) argue for origin essentialism
  while allowing that you could have had genetic differences (e.g., mutations early
