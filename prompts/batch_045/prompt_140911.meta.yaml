  "the smart ones use tools." I want a session that makes them feel that the transitions
  are changes in *where selection happens and what does the dying* — genes across
  generations, an individual''s own behaviour within a lifetime, a hypothesis inside
  someone''s head, and then something stranger at the top, where the creature itself
  is largely built out of objects that were shaped by their own transmission success
  rather than by what was good for the creature.


  So: design me a runnable in-class game. ...


  Constraints:

  - Rules enforce the differences; facilitator must not name the four kinds until
  debrief.

  - Stations/roles: Darwinian cohort submits a fixed policy before any feedback and
  can only change it via a "death and mutation" across generations; Skinnerians may
  revise only after a payoff; Popperians get a limited budget of "probe" tokens letting
  them test a hypothesis without acting in the world; Gregorians inherit a lore packet
  from the previous generation and may invent notation, which is then copied forward
  under a noisy, time-pressured transcription step (telephone game).

  - Hidden world: e.g. 4x4 grid, one lethal tile, plus a rule that changes between
  generations so inherited lore can go stale.

  - Two invented probes I want included: (1) a fifth station, "solitary Popperians,"
  who can form and test hypotheses internally but are forbidden to communicate them,
  so we can see whether the Gregorian jump is about language or about accumulation;
  (2) a round in which the second generation of Gregorians must follow the inherited
  lore for one round before they''re allowed to test it, so they feel what it is to
  be steered by a tool they didn''t choose. Say what each probe''s outcome would show.

  - Materials (cheap, no screens), room layout, minute-by-minute timeline, scoring
  without money (points, candy, or grade-adjacent-but-harmless token), and how groups
