  The argument, in three steps.


  Step 1 — bookkeeping, not physics. Forget probability for a moment and just ask:
  what constraints are there on any scheme for spreading your concern across the branches?
  Call the share of a branch''s concern-weight w. I want three constraints: (a) splitting-invariance
  — if a branch of amplitude α later splits into sub-branches with amplitudes β and
  γ, the weights of the children add up to the weight of the parent, and it doesn''t
  matter how finely or coarsely you draw the branches (a coarse branch''s weight equals
  the sum of fine branches inside it); (b) indifference — branches described by equal
  amplitudes get equal weight; (c) continuity — tiny changes in amplitude produce
  tiny changes in weight. Claim: (a)-(c) force w ∝ |amplitude|². Reason: (a) says
  w is a measure on subspaces that adds across orthogonal decompositions, and since
  amplitudes add like orthogonal vectors (|α|² = |β|² + |γ|²), the only continuous
  such measure is the squared norm. So on this picture the Born rule isn''t an extra
  law of nature bolted onto branching; it''s what you get from insisting that your
  bookkeeping over branches be consistent — the same way double-entry bookkeeping
  constrains a ledger. Corollary: naive branch counting is out, since you can always
  manufacture extra branches by splitting, and counting isn''t invariant under that.


  Step 2 — from bookkeeping to caring. A physicist friend pointed out that (a) is
  basically the Pythagorean structure of the Hilbert-space norm, so maybe I''ve derived
  the Born rule from the Born rule; worse, a measure over branches still doesn''t
  tell me that I should care about a branch in proportion to its measure. So I add
  two principles that are supposed to be about agency rather than physics: (i) conservation
  of concern — the concern I now have for my future selves has to equal the summed
  concern those future selves will have for theirs, with no concern created or destroyed
  at the moment of splitting; (ii) no free tickets — I can''t raise my expected concern-weighted
  payoff just by rigging up extra branching that leaves the amplitudes alone (no buying
  a hundred lottery tickets by arranging to be split a hundred ways).


  Step 3 — the wrinkle I actually like. Decoherence never makes branches exactly orthogonal
  or exactly discrete, so the number of branches isn''t well defined at all (branching
  is continuous in time; there is no moment at which there are n of you). Branch-counting
  needs that number; the measure doesn''t. That, to me, isn''t a technical annoyance,
  it''s the reason the Born rule has to be about something other than a count.


  What I want:

  1. Is step 1 just a rehash of something with a name? Someone muttered at me in a
  bar about an old theorem — 1950s? — about measures on the lattice of projections,
  and I''ve been too embarrassed to look it up. If so, tell me what it is and where
  my version differs from the real thing (I''d rather say so in the piece than pretend
  I invented it).

  2. Where is the weakest link — splitting-invariance, indifference, continuity, or
  the move to caring? Rank them.

  3. Do (i) and (ii) in step 2 do any work beyond step 1, or are they decision-theory
  smuggled in after I claimed not to need it? A philosopher friend said they''re circular
