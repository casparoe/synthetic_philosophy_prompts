  Debrief: map moments:

  - Round 1-2: normal — broadcast = report = "what it was like" → here they feel GWT''s
  core claim in their bones (the light feels like the conscious room).

  - Flicker round: graded vs ignited.

  - Masked round: phenomenality without access (module 8''s vivid image never broadcast,
  report says "nothing").

  - Dark relay round: access without phenomenality (broadcast, report, action — but
  the relay player had no experience; and nobody outside could tell).

  - Shadow-gain round: influence without access.

  - No-report round: access without report (report is a probe, not the criterion).


  Prediction of what goes wrong: (1) dominant loud module hogs tokens — fix with token
