  Setting: high school philosophy/psych club, ~14 people, 60-75 minutes. Goal: participants
  feel the pull of the distinction between access consciousness (information globally
  available for report, reasoning, action) and phenomenal consciousness (what it''s
  like), and feel GWT''s claim that the two are the same thing — i.e., that access
  (broadcast) is what consciousness is — and then run into the case where they come
  apart. Ideally: the game makes them experience "access without phenomenality" and
  "phenomenality without access" within the mechanism, then the debrief maps it.


  Game design: "The Broadcast Room."


  - Room arranged with a central table (the global workspace) lit with a single lamp;
  only one card can sit in the light at a time.

  - Each player is a specialist module with a private channel: they hold private cards
  (their own processor''s outputs). Modules: edges, motion, color, face, word-shape,
  memory-of-this-room-last-week, hunger/internal state, language-report, action-planner.

  - Each round: the facilitator puts a stimulus on the projector (e.g., a word flashed,
  a masked image, a moving dot pattern). Modules compute privately (they have a private
  rule sheet: e.g., "edges module: you see the first and last letter"), then compete
  to get their card into the light: they can "amplify" by bidding tokens (attention
  tokens) and by forming coalitions (two modules can fuse cards into one coalition
  card). Only winning coalition''s card sits in the light for 5 seconds. During that
  5 seconds, the whole room (all modules, including ones not in the coalition) may
  read it — that''s broadcast = access.

  - The Reporter module (only one player) is the only one allowed to speak aloud;
  the Reporter may only say what''s currently in the light. So verbal report = access.

  - Scoring: team scores points if the Reporter''s spoken report matches the target;
  individual modules score if their own card was in the winning coalition. So there''s
  an incentive to broadcast your own content, not necessarily the true one — nice
  pressure.


  Now the two dissociation mechanics:


  1. Access without phenomenality — "the silent relay": one module is secretly assigned
  the Dummy/Relay role: its card wins and gets broadcast, its content drives the correct
  report, but that player has been told they never get to "feel" their own content
  — they must follow an instruction card mechanically (they''re given a lookup table
  mapping their input to an output symbol, and they''re told "you do not experience
  what your symbol means; you just pass it"). Actually better: the Relay module''s
  private sheet is encrypted — they hold a symbol but the meaning is only revealed
  when broadcast; they read out the decoded content without ever having had the experience.
  Hmm, but that''s just "processing without understanding," which is fine as an analogue.


  Better mechanic for access-without-phenomenality: A "zombie channel" — a module
  whose output reaches the workspace and drives report but which is marked "dark":
  the facilitator tells that player privately: "you have no experience of your content;
  you only carry it." Then after the round, everyone asks: did the system have access
  to that content? Yes (it was broadcast, used in reasoning, it shaped the report
  and action). Was there something it was like? Only the dark module knows they had
  nothing — and by stipulation, nothing. So the group feels: access happened, phenomenality
  didn''t. And crucially the *rest of the room cannot tell* — from the outside (third
  person) the two cases look identical. That''s the point that makes the distinction
  feel forced rather than verbal.


  2. Phenomenality without access — "the dark room winner": a module has rich content
  (given a vivid private stimulus, e.g., they''re given a detailed colored image or
  a strong taste/smell) but by the rules their coalition loses the bid (they''re capped
  at 1 attention token, or a "masking" rule: if the edges module bids ≥3 tokens within
  200 ms, the late-arriving module is masked — subliminal). Their content never gets
  broadcast, so it can''t be reported or used; but the player did have a vivid private
  experience. Then the Reporter says "nothing" and the team scores zero, even though
  the player insists something happened. From the outside: indistinguishable from
  nothing.


  Then the punch: the group is asked to vote, at the end, on whether to count a case
  as "conscious" based on broadcast or on the module''s own say-so, and the scoring
  is rigged so that they can''t win either way... Hmm.


  Better punch: a final "verification round" where the facilitator asks: the system
  produced a correct report about a stimulus. Was there something it was like? Group
  votes. Then the reveal: two different rooms ran the same task — wait, we only have
  one room. Alternative: run the same round twice, once with the dark module and once
  with a normal module; the transcript of the room''s verbal output is identical.
  The group discovers access and phenomenality came apart but nothing in the public
  record distinguishes them. That''s the "feel the force of the idea" moment: it makes
  vivid that the distinction is not empirical-from-outside, so GWT''s identification
  of consciousness with broadcast is a substantive (and contestable) move, not a discovery.


  Also include the "no-report" condition: a round where reporting is disabled (Reporter
  muted) — content still broadcasts (the room reads it) and the action-planner module
