  Timeline for 70 minutes with 14 people. Roles list. Materials: index cards, one
  lamp/flashlight, a "workspace" tray, attention tokens (poker chips), a private rule
  sheet per module, a projector or printed stimulus, a stopwatch, a bell.


  Payoffs: team points for correct report; individual chips/points for being in the
