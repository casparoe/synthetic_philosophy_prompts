  Nations in a borrowed copy that''s missing its title page, and I want her to be
  genuinely against the colonial system — for reasons she''d actually have had available
  to her — while her father and his Virginia cousin are for it. My writing group keeps
  telling me to just make her morally outraged, which is exactly the note I don''t
  want: I want her opposition to be the kind someone could have arrived at from the
  books in the room, including Smith''s.


  The thing I keep circling is this. As far as I remember it, Smith''s case against
  the colonies is almost entirely a ledger case: the monopoly drags British capital
  into a slower trade than it would otherwise find at home, the wars and the governing
  cost more than the commerce returns, the whole arrangement is run for the benefit
  of merchants and politicians at the expense of everyone else, and the sensible thing
  would be to open the trade, or let the colonies go, or bring them properly into
  the constitution. What he more or less doesn''t do — or so it reads to me — is say
  that the whole business is a wrong done to the people who are actually living under
  it. The complaint is that Britain is being cheated, not that anyone is being ruled
  without their consent. So: what are the most important implications of that shape
  of argument — an argument about cost and mismanagement rather than about injury
  — for the kind of anti-imperialism it''s plausible for someone like Ishbel to hold
  in, say, 1774? I''m especially interested in what follows for (a) how she''d answer
  the obvious question ''but what if it did pay?'', (b) whether Smith''s remedies
  are an alternative to empire or just a tidier version of it, and (c) whether she
  can get from Smith to ''this is an injustice'' at all without quietly importing
  something Smith himself wouldn''t have accepted.


