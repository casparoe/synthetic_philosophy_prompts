  I think the translation type with legal interpretation is strong and concrete. The
  mapping is genuinely non-obvious and the residue is substantive:

  - Textualism → spec/source-of-truth literalism, "the RFC is what it says," WYSIWYG,
  formal semantics; text''s meaning at the time of enactment = semantic versioning
  / language version at compile time; "ordinary meaning" = what the standard library/idiomatic
  usage at that version means.

  - Purposivism → reading the design doc / intent, "what was this code for," fixing
  obvious bugs, implementing the spirit of the spec; absurd results = the "obviously
  not what was intended" case; canons = lint rules / conventions of the codebase.

  - The "reasonable reader" = a reasonably informed user of the API at that time.

  - Scrivener''s error = typo in the spec where the spec contradicts the reference
  implementation.

  - Hyrum''s law: users come to rely on implementation details → reliance interests/entrenchment,
  has a partial analogue in statutory stare decisis.

  - Bug-for-bug compatibility → following precedent even where wrongly decided; also
  "the statute''s meaning is fixed but precedent can be overturned" asymmetry.

  - Changelogs/commit messages/discussion threads → legislative history; and the translation
  break: in software you can ask the maintainer; also multiple committers with no
  single intent (no analogue to "the legislature''s intent" as a single mind); the
  "no one reads the docs" vs. statutes'' notice function (fair notice, rule of law)
  — arguably a partial analogue in "don''t break the public API," but the moral/legitimacy
  dimension (notice → autonomy, coercion, punishment) has no software analogue. That''s
  a key residue: law coerces and can imprison; software doesn''t (mostly). That''s
  a substantively important disanalogy that the translation must flag.

  - Also: the versioning/patching asymmetry — in software errors can be fixed upstream
  in a patch release; courts can''t rewrite the statute; the legislature can amend
  but slowly, and non-retroactivity means the old version still governs past conduct.

  - Also: the "compiler" doesn''t exist for law — interpretation is not deterministic;
  there are many interpreters (courts) and a hierarchy, plus the "reasonable reader"
  is a legal fiction.

  - Also: in software, an ambiguity usually gets resolved by running it and seeing;
  and "can''t reproduce" / undefined behavior vs. legal gap (casus omissus) where
  the court must still decide — no analog to "throw an exception."

  - And: the "spec vs implementation" distinction maps onto "text vs. application,"
  and the question of whether purposivism lets judges implement an unenacted intent
  is like implementing a feature not in the spec.


