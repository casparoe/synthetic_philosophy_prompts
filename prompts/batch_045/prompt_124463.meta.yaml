  Objection to weak discernibility (this is a real and known debate point): A and
  B weakly discerned by symmetric irreflexive R — does that *refute* the claim that
  they share all properties? Weak discernibility is a fact about the *pair*/relation,
  not a property of either object: A has the property "being two miles from some sphere"
  and B has it too — so they share all their (monadic) properties. Standard PII (∀F)
  is about properties of individuals; the weak-discernibility move requires generalizing
  PII to a relational principle, and then the question is whether that generalization
  is what PII was ever *for* — e.g., PII''s job was to rule out bare numerical diversity
