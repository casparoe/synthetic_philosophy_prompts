  \ and the kind then has to be revised to fit the changed people, indefinitely. I\
  \ read him second-hand, mostly via blog summaries and a couple of essays, so I am\
  \ not wedded to the letter of his account; what I want is the principle behind my\
  \ own verdicts, which I have never managed to line up. My cases, with my gut verdicts:\
  \ a diagnosis of Attention Deficit Hyperactivity Disorder received at thirty-four\
  \ loops hard, and loops in a distinctive backward direction — it reorganises the\
  \ person's autobiography (oh, so that is why school was like that) as much as it\
  \ changes anything they will do next. A dementia diagnosis that the patient is never\
  \ told about and could not grasp does not loop at the level of the patient at all,\
  \ though it loops plenty for the family and the carers. Telling a research volunteer\
  \ that a scan shows amyloid-positive, pre-symptomatic Alzheimer disease loops hard\
  \ the moment it is disclosed, because ordinary forgetfulness is re-read as symptom.\
