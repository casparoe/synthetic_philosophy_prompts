  \ case. But I also think that a polygenic risk score for schizophrenia handed to\
  \ the parents of a four-year-old loops, even though the child takes up nothing;\
  \ and I think a label someone explicitly rejects still loops, because refusing a\
  \ description is one way of being shaped by it. So either uptake by the classified\
  \ is not required, or my negative case is not really negative. My own patched-together\
  \ principle currently has three conditions, and I would like it tested and repaired\
  \ rather than replaced wholesale if it can be saved: a classification of people\
  \ loops to the extent that (i) it is learnable and applicable by the person classified\
  \ or by those who act on them, (ii) being so classified makes a practical difference\
