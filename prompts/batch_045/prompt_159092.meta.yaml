  \ — and here I include Pathological Demand Avoidance, which as far as I know never\
  \ made it into the main manuals but has an enormous parent-led following in Britain\
  \ — loops, but shallowly and instrumentally: people learn to present for it rather\
  \ than to be it. And the broadening from Asperger syndrome to the autism spectrum\
  \ looks like a case where looping made the category worse-behaved and yet, I want\
  \ to say, more valid rather than less.\n\nThe pair I cannot reconcile is this. I\
  \ keep wanting to say that looping needs uptake by the person classified: no uptake,\
