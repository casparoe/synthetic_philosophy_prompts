  as a measuring instrument for a population of consequences, and like any instrument
  it has a selection bias — it systematically over-samples organized interests and
  people with lawyers, and under-samples diffuse harms, harms that arrive later than
  the comment window, and harms that nobody has the vocabulary to describe yet. Does
  Dewey''s experimentalism have the resources to say that a badly calibrated instrument
  is producing bad inquiry and not just insufficient participation, or does his view
  really only tell you to open the process up further? And if I took the experimentalist
  picture seriously, concretely, what would I have to change about how we do this
