  ---


  I work at a small state environmental agency, and a chunk of my job is the public
  comment side of rulemaking: we publish a proposed rule and the analysis behind it,
  anyone at all can send in written comments for a month or two, we have to read them
  and write a response to the significant ones as part of a statement explaining the
  rule, and if we blow that off a court can send the rule back to us. Same shape as
  the city council hearing where everyone gets two minutes before the vote, except
  there the vote basically never changes. A few friends and I have been reading Dewey
  in a book group (badly, and out of order — we started with the later political stuff
  rather than Democracy and Education), and one of the claims we keep circling is
  that democracy isn''t just a way of settling who gets what but the political face
  of experimental inquiry: a policy is a hypothesis, the test is what it does to the
  people it lands on, and the people it lands on are not merely interests to be balanced
  but sources of the evidence you need, because they''re the ones who notice the consequences
  that the rule-writers didn''t. I find this attractive but I can''t tell whether
  the practice I actually run already assumes it, or whether it would run exactly
  the same way under a theory that thinks it''s just counting preferences, or giving
  people their day in court, or harvesting local knowledge that the agency lacks,
  or simply laundering a decision that''s already been made.


  So: what does notice-and-comment actually presuppose about democracy and about inquiry,
  and which parts of the practice commit you to which theory? I''d like the reconstruction
  of the implicit theory first, then the honest answer about how much of it is strictly
  required — what the practice needs in order to make sense — as opposed to what it
  merely fits comfortably with, and whether the different bits of it (the self-selection
  of who shows up, the fact that we''ve already drafted the text before we hear anyone,
  the response requirement, the two-minute limit, the record a court reviews) pull
  toward different theories or toward a single one. My colleague thinks the whole
  thing is legitimacy theater and cites the fact that we almost never change the rule;
  another friend says no, it''s fairness to the affected parties and improving the
  rule is beside the point. I want to know whether those are really distinct accounts
  or whether they''d license identical institutions, and if they''d license identical
  institutions, what observable difference there is between an agency that''s genuinely
  inquiring and one that''s going through the motions.


