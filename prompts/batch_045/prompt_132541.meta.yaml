  Where the source text underdetermines a choice, the right question is what the sentence
  can be made to do in the new language, not what I was trying to do when I wrote
  it; and a translation that secures my intended reading by collapsing an ambiguity
  is, I want to argue, a worse translation than one that preserves the ambiguity at
  the cost of my reading. I''ve been calling this the resolute ambiguity rule in my
  notes, and I''d like to defend it as a norm for the profession, not merely a preference
  of mine. The room will be about forty practising literary translators, mostly working
  into and out of European languages, three or four of whom have translated my own
