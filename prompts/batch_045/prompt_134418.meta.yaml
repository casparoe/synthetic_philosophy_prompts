  Actually: Orwellian = the subject did have the "wrong" experience, but memory of
  it is subsequently rewritten (like 1984: the past is rewritten). Stalinesque = the
  show trial: the "confession" is fabricated in advance; the subject''s experience
  is pre-edited — the inaccurate content never occurred in experience at all; the
  content is fixed before it becomes conscious. So both are "revisionist" but differ
  on whether the misleading content was ever consciously experienced.


  Applied to color phi: Orwellian — you first experience the dot at position 1 red,
  then the second flash, and your memory is edited so it seems the color changed mid-flight.
  Stalinesque — the brain waits, and the experience of color-change-mid-trajectory
  is generated "just in time" and inserted, so no one ever experienced a red dot sitting
  still at position 1 then a green dot at position 2.


