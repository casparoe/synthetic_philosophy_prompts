  "I''m in the final year of a master''s programme in philosophy and I''m supposed
  to be writing a thesis chapter on the principle of alternative possibilities (PAP)
  — the claim that an agent is morally responsible for what she did only if she could
  have done otherwise — and on the Frankfurt-style cases that are supposed to refute
  it. My supervisor has now twice told me that what I''ve written is just re-running
  an exchange that has been running since Frankfurt''s original paper and that nobody
  in it has moved, and that I should either say something about why it is stuck or
  pick a different topic. I''d rather do the former, but I want to do it properly
  rather than as a literature survey.


  Here is where I am. On one side, incompatibilists run the flicker-of-freedom reply:
  the cases leave the agent only some vestigial alternative (a twitch, a prior sign,
  a faint inclination), and such a flicker isn''t the sort of alternative PAP was
  ever about — and worse, if you build the case so that there really is no alternative,
  you seem to have built determinism into the set-up and begged the question, whereas
