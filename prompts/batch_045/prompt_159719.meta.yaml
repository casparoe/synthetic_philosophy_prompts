reasoning_summary: 'Domain: moral luck. Type: turn a principle/theory into a procedure
  — moral luck operationalized for a practitioner. Who applies it repeatedly? An ethics
  committee chair in a hospital (clinical ethics consultation), or a sentencing/parole
  board, or... Actually "moral luck" applied repeatedly: a peer-review/disciplinary
  committee that grades blameworthiness where outcomes differ (e.g., two drivers,
  one hits a child). A good fit: a corporate incident-review board deciding blame/culpancy
  after near-misses vs. actual harm; or a clinical ethics committee doing retrospective
  review. Or an awards/performance review committee.


  Best: I''m chair of an incident review board at a hospital / aviation-adjacent safety
  body that must assign blame ("culpability ratings") after adverse events and near
  misses, and outcomes vary by luck. That maps directly onto Nagel/Williams and the
  control principle. The procedure should translate the control principle into something
  usable: separating outcome luck from circumstantial/constitutive luck, asking what
  the agent could reasonably have foreseen, counterfactual tests etc. And mark where
  judgment can''t be eliminated. Two worked cases including one where the procedure
  gives an unwelcome answer (e.g., the surgeon whose patient died gets the same rating
  as the near-miss doctor — or a case where a "bad character" person gets rated more
  harshly even though the procedure says character isn''t assessable; or the case
  where procedure says "no blame" for a doctor who nonetheless caused a death, which
  the board''s leadership will hate).


  Add a niche/new idea to defeat regurgitation: e.g., the board must issue a rating
  but a rule that "the board''s rating must be invariant under outcome luck," and
  introduce a concept like "counterfactual re-run with the same agent holding fixed
  the decision-relevant facts" — a "double-blindness" test. Or introduce a distinction
  invented for the prompt: "luck-discounted blame" vs. "role-accountability," and
  ask the procedure to keep them separate because the board must output both: a blame
  rating and a competency/forward-looking action. That''s a nice niche twist: the
  procedure must output two separate numbers — "retrospective blame" and "forward-looking
  restriction" — because the board conflates them.


  Also add a constraint: the board has lay members, must decide in a 90-minute meeting,
  cannot investigate beyond the record, and the hospital''s lawyers want the ratings
  to survive a negligence standard; ratings on a four-point scale.


  Also add: "counterfactual test applied by a member who didn''t see the outcome"
  — a "blind re-run" procedure: re-present the case with the outcome redacted and
  see whether the rating changes. That''s a concrete operationalization of the control
  principle and it''s genuinely a nice test.


  Also the hard cases: constitutive luck (a surgeon with naturally poor spatial reasoning),
  circumstantial luck (understaffed night shift), outcome luck (patient with undiagnosed
  aneurysm dies), and "self-luck"? Avoid needing citations. Don''t quote. Mentioning
  Nagel and Williams is fine (well-memorized). Maybe avoid pinning exact essay dates/titles
  — I could say "the well-known control principle" and "the standard distinction among
  outcome, circumstantial, constitutive and causal luck" — that''s fine, no quote
  needed. I''ll avoid asserting dates.


  Length limit: "maximum 900 words" — it''s a procedure with three worked cases. Maybe
  1000 words max, tight but feasible. Let''s say 1,000 words maximum, and format:
  "lead with the procedure as numbered steps in no more than 40 numbered/bulleted
  lines, then the three applications, then the limits section."


  Format instruction: hard length limit. Also ask for a specific format: numbered
  steps, then cases, then limits, with word budget per section. Good.


  Prompt should be 1-3 paragraphs, relatively elaborate and formal/polished. Let me
  write it.


  Role: I chair the Patient Safety Review Board at a teaching hospital — we meet fortnightly,
  ~90 minutes, review 4-6 incidents, must assign each clinician involved a written
  "responsibility rating" on a four-point scale (no fault / minor lapse / serious
  lapse / gross lapse) recorded in a file, and separately recommend one of three actions
  (no action / additional training / restriction of privileges). Members: two physicians,
  a nurse, a risk manager, a lay member, me (I teach bioethics part-time). Constraints:
  no new investigation, only the incident record; ratings go to the credentialing
  committee.


  The problem: two anaesthetists did the same thing, one patient had an undiagnosed
  condition and died, the other was fine; board rated them differently. I want a procedure.


  Niche inject: (a) the "blinded re-run" — re-rate with outcome redacted, and if the
  rating changes, the difference is outcome luck and must not be counted; (b) two
  separate outputs: backward-looking blame rating and forward-looking action, deliberately
  severed because the credentialing committee conflates them; (c) a "reasonable-peer
  counterfactual" question: would a competent peer in the same shift conditions have
  done the same; (d) constitutive luck: where the deficit is a stable trait of the
  agent, the procedure must say whether the rating can consider it at all — it can''t
  for blame, but the action can address it. That''s a genuine philosophical crux (control
  principle vs. character).


  Also add: where the procedure must stop with "no rating" — when the record can''t
  settle what the agent knew (epistemic luck). And where judgment cannot be eliminated:
  choosing what counts as "the same decision" for the counterfactual, and setting
  the foreseeability threshold.


  Three cases: (1) the two anaesthetists; (2) a surgeon with a tremor early Parkinson''s
  who performed adequately for years but botched — constitutive luck; (3) a resident
  who violated a checklist and by luck the patient was fine while a colleague who
  violated it caused harm — but the unwelcome answer: procedure requires the same
  rating for both, and a "no action" for the lucky one despite the violation, which
  leadership will hate. Or: the procedure yields "no fault" for someone whose patient
  died, which the family/comms team will hate.


  Word limit: 1,000 words max, with section budget: procedure ≤ 400 words, applications
  ≤ 400, limits ≤ 200. That''s tight and feasible-ish. Maybe 1,100. I''ll say "1,000
  words in total; no more than 450 on the procedure itself."


  Also format: numbered steps, each step with the question, what counts as a sufficient
  answer, and where it stops with a no / defers to a person.


  Let me write ~2.5 paragraphs. Also include the "I was discussing with a colleague"
  flavor, and mention that I''ve read some philosophy (Nagel, Williams) and can''t
  use it directly.


