  Hey — I''m deputy lead at a small residential outdoor program for 13-to-16-year-olds
  who''ve been permanently excluded from mainstream school. Twelve kids, they live
  in with us Monday to Friday and go home at weekends, and the people actually making
  the calls are mostly outdoor instructors with a few weeks of training and no teaching
  quals. They''re deciding stuff all day every day — do we make him do it, do we answer
  her, do we let the group see this — and the stakes aren''t abstract: our funding
  rides on kids not going back into the system, and one wrong call on restraint or
  on withholding a phone gets us shut down. Anything involving a sanction has to be
  signed off by our designated safeguarding lead. And whatever we use has to be runnable
  in the five minutes before a shift, by someone who will never open a book.


  I''ve been reading Locke''s book on education (the 1693 one, written as letters
  to a friend about his son) and I keep thinking there''s a usable procedure in it
  even though almost everything about his setting is different from mine. The bits
  I have in mind: treat children as rational creatures and actually reason with them;
  never squash curiosity or fob a question off; example does more work than rules;
  the real engine is reputation — kids care about credit and disgrace from the people
  around them, not about beatings or bribes, and rewards like money or treats just
  teach them to like the reward; physical punishment basically only for flat obstinacy;
  harden the body rather than coddle it; and he thought a private tutor at home beat
  school mostly because of what boys catch off each other.


  So: turn that into a decision procedure my instructors can run. Questions in order,
  what counts as a good enough answer to each, where it stops with a no, and where
  it has to hand off to a person because it''s a values call rather than a factual
  one.


  Two things I want handled honestly rather than smoothed over.


  First, the thing I''ve started calling the audience problem in my own notes. It
  looks to me like the whole reputation mechanism presupposes a small, stable audience
  whose good opinion the kid actually wants — parents, a tutor, one household — while
  what we''ve actually got is staff rotating on shift and a peer group that hands
  out status for the exact opposite of what we''re after. Is there anything left of
  the mechanism in our setting, or does the procedure have to run on something else
  entirely? Tell me if I''ve invented a problem.


  Second, our clinical consultant''s rule is that we never deliberately make a kid
  feel ashamed — her line is that shame is what most of these kids are already drowning
  in. That reads to me like a straight ban on Locke''s main lever, and I don''t know
  whether that leaves his framework hollowed out or whether the lever can be rebuilt
  as something like "being taken seriously by an adult."


  Then run it on three real cases, and don''t be nice about the answers:


  1. Jayden, 14, refuses to split kindling before breakfast, tells the instructor
  make me, and the rest of the group is watching.

  2. A 13-year-old who asks non-stop questions on the river walk — where the water
  goes, why the licence costs what it does, why we''re not allowed to swim here —
  and we''re forty minutes behind with the minibus booked.

  3. Curtis, who''ll do any task at all if it earns points on our level system that
  convert to Xbox time on Friday, and does nothing without them. Our funders love
  the level system because it gives them numbers to report.


  I want at least one of those to come out with an answer I don''t want to hear, and
  I''d rather you told me which one it is than hid it.


  Also: tell me which Lockean distinctions have to survive the simplification and
  which I can just throw out — the cold baths and thin shoes, the gentleman''s curriculum,
  the Latin and the manual trade, the bit where there''s one boy and one tutor — and
  say where the procedure will misfire. I''m thinking especially of kids who''ve been
  beaten at home, kids who are autistic or have ADHD, and kids whose status economy
  at home runs backwards, but tell me the ones I haven''t thought of too.


