  I''ve been reading on my own about the meta-problem of consciousness — the move
  that says the thing to explain is not why there is experience but why we are all
  so certain there is and keep insisting on it, and that if you explain the mechanism
  that generates those insistences there may be nothing left over. I want to try it
  on a novel I love, Kazuo Ishiguro''s Never Let Me Go.


  What keeps nagging me is something the versions of this argument I''ve found don''t
  seem to address. The standard worry is that reports about one''s own experience
  are cheap — that any system able to monitor its own states will chatter about how
  things seem. But in the novel, fluency isn''t what makes a claim about your inner
  life credible; it''s what destroys it. Kathy''s narration is unemphatic, full of
  things she can''t quite explain, and that clumsiness is what makes readers certain
  there is someone home. By contrast, the one thing nobody in the book will accept
  as evidence is a well-argued assertion of their own humanity; the students'' art
  is collected because it might do work their testimony can''t, and the people who
  run Hailsham want something that cannot be produced on demand.


