  I teach a final-year metaphysics seminar and I''m writing the final now. The last
  block of the course was on dispositions, and I want one essay question that I can
  actually grade — i.e. not one where "finks and masks are counterexamples to the
  simple conditional analysis, so we need a better analysis" gets you a B+ on its
  own. Students have seen the usual cases: the wired-up vase that stops being fragile
  the moment you hit it, and the vase packed in foam that stays fragile but never
  breaks. I want the question to force them to say what work the fink/mask distinction
  is doing in the first place, and whether the two kinds of case actually need the
  same fix.


  [constraints]


  Two things I''d like built into the question. First, give them at least one case
  they can''t have seen before, ideally one where our class labels don''t obviously
  apply — I was thinking of (a) a mask that counterfactually depends on the disposition
  it masks (the shielding only kicks in because the thing is fragile, so you can''t
  hold the disposition fixed and subtract the interferer), and (b) a case where the
  disposition is lost partway through the stimulus/manifestation window rather than
  before or after it. Something like that. Use whatever versions of these work best;
  the point is that reciting the standard pair of examples shouldn''t help.


  Second, I want them to have to take a stand on whether the two problems pull in
  the same direction: does a fix that handles finks (roughly: something about holding
  the basis fixed) thereby handle masks, or does the mask case push somewhere else
  entirely — and if so where? A good answer should be able to say what a reformed
  analysis would have to look like to get both right, or why no single one can.


  Format: one question, 90 minutes in the exam room, 20 marks total. Give me the question
  text, a model answer of about 700 words, and a marking scheme built around five
  must-hit points with the marks for each, plus a line on how people usually get each
  one wrong. Say explicitly what separates an A from a B — I want the A answer to
  do something more than hit the five points (e.g. noticing something about the cases
  I hadn''t flagged), so tell me what that something is.


