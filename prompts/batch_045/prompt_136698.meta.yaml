  they themselves called fair lose whatever happens. No real money: points, with a
  small prize (a book token) for whoever ends up richest and for whichever bookie
  extracts the most.


  What I need is the activity itself. Each student should post, for each proposition
  on a menu, the price at which they''d be willing to buy or sell a ticket paying
  a fixed stake — crucially a single number, not a bid and an ask — and a rotating
  set of students should play bookie against them, allowed to take either side of
  any posted price and to combine the trades into one package. Then I want a diachronic
  round on the same model: before anyone learns anything, each student fills in a
  table saying what their fair prices would be if they were to learn each cell of
  a partition (they''ll each be handed a sealed envelope that decides which cell they
  actually learn); the bookies trade against those pre-commitments first, the envelope
