  Draft:


  "I''m a fifth-year PhD student in philosophy and I''m giving a 40-minute talk next
  Thursday at a one-day workshop on well-being, choice, and policy that a public policy
  school is hosting. My title is something like Utility Is an Evidential Policy, Not
  a Quantity, though I''m not attached to it. Here is the position. I distinguish
  two readings of what the consumer theorist''s utility function is. On the thin reading,
  which I take to be what the ordinal revolution actually delivered, a utility function
  is nothing but a numerical representation of a choice relation; it carries no commitment
  to utility being a feeling, a hedonic state, or a person''s good. On the thick reading,
  utility is supposed to be the thing that makes a person''s life go better for them,
  the quantity a benevolent regulator should maximize. My first claim is that revealed
  preference theory, properly understood, is a thesis about the evidential situation
  of the observer and not a definition of utility: it says that choice behavior is
  the only evidence we have, and that any utility talk that outruns it is idle. My
  second claim is that the standard objections to revealed preference all attack the
  thick reading while borrowing their force from the thin one, and that once you see
  this the objections lose their bite; the empty-preference objection, the decision-utility-versus-experienced-utility
  gap, and the framing-and-menu-dependence findings each shows only that choices don''t
  pin down welfare, which on my view is exactly what we should have expected. My third
  and constructive claim is a protocol I call menu-invariant welfare inference. Say
  that two options are separated by a welfare-relevant ancillary condition..."


  Hmm, I should keep it tight but elaborate. Let''s write the protocol: "Fix a set
  of ancillary conditions (display order, defaults, framing, the presence of a third
  decoy option, the time of day the choice is made). Call a pair of options welfare-comparable
  on the evidence if their ranking is invariant across all variations in ancillary
  conditions that the theory classes as welfare-irrelevant. Where the invariance test
  passes, the regulator may read a welfare ranking off the choices; where it fails,
  the correct output is not a guess but a recorded incompleteness."


  And the running example: "I use a single running example throughout: a city transit
  agency''s mobile ticketing app, which lists fare products in a fixed order and pre-selects
  the middle one. In the agency''s pilot data, roughly two-thirds of riders end up
  with the pre-selected product, and when the team reversed the display order in a
  small A/B test the ranking between the two main products flipped; but administrative
  ride records show essentially identical subsequent travel between the two groups,
  and no rider complained or switched back. I want to say: the agency is licensed
  to infer nothing about which product serves riders better, and should record the
  pair as welfare-incomparable unless it can find a menu variation that stabilizes
  it. Where I think I''m on firmest ground is that this is a genuine improvement on
  both the naively behaviorist reading (take the choice as welfare) and the paternalist
