  Now the theory side: Kelly criterion / geometric rationality. Key points I want
  the prompt to ask for:


  1. Mapping: What was the "bet"? Convergence trade as a bet with small edge and small
  probability of large loss. Kelly says: bet a fraction f* of wealth; with small edge
  you bet tiny fractional amounts; leverage of 25x means massively overbetting relative
  to any plausible Kelly fraction. But note Kelly permits leverage >1 if edge is huge
  and loss is total-loss-of-bet (f*>1 means borrowing). Also Kelly assumes you can
  lose the whole amount bet (binary-ish) — with leverage the loss distribution can
  exceed the amount at risk? Actually losing more than you bet happens if you can''t
  exit/ margin calls.


  2. Overbetting: betting more than Kelly both reduces growth rate and increases volatility;
  betting more than twice Kelly gives negative growth rate. So the case is a textbook
  "overbetting" failure — but the deeper issue: Kelly assumes known probabilities;
  LTCM''s probabilities were model outputs (model risk / parameter uncertainty). Kelly
  is famously brittle to overestimated edge: if you overestimate your edge by a factor,
  the optimal bet under the true distribution is much smaller, and overbetting is
  worse than underbetting.


  3. Correlation: Kelly''s simple formulas assume repeated independent bets or sequential
  bets; LTCM''s positions were highly correlated — hundreds of distinct "convergence
  trades" all were effectively one bet on "spreads revert during calm markets / liquidity."
  If they were one bet, the correct Kelly fraction is for one bet, not the sum. Their
  diversification claim rested on treating them as independent, so the "aggregate"
  Kelly fraction was inflated. This is a great in-the-weeds point: the number of bets
  vs. correlation.


  4. Objective choice: Kelly maximizes log wealth / asymptotic growth; alternative:
  maximizing expected wealth would justify near-maximum leverage (Sharpe-ratio maximization
  / risk-neutral). LTCM''s partners were themselves large equity holders, arguably
  behaving as expected-utility maximizers with near-linear utility over the relevant
  range, or as career/reputation maximizers. Also: Kelly maximizes growth but is "myopic"
  — it''s optimal for log utility; for finite horizon or other utility, not. Also
  Kelly''s median-vs-mean point: log maximization maximizes median outcome, and most
  paths undercut the mean — relevant because LTCM''s strategy was "picking up pennies
  in front of a steamroller": high probability of small gains, low probability of
  catastrophic loss, i.e., positive expected value, negative expected log. That''s
  exactly the Kelly lens! Kelly would say: do not take such a bet at any leverage
  (or only at tiny fraction). So the case is near-perfect confirmation of the Kelly/geometrical-rationality
  critique of expected-value maximization — and it also shows what Kelly misses: model
  uncertainty, correlation, liquidity/financing constraints (Kelly assumes you can
  always rebalance and that the bet resolves at known odds; margin calls force you
  to realize losses at the worst time, converting a temporary adverse mark into permanent
  loss — "unrealizable edge").


