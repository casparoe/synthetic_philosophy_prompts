  \ nice and technical but accessible — heritability is defined as V_G/V_P in a particular\
  \ population in a particular environment. I can construct cases: high heritability\
  \ + environmental intervention works; low heritability + genetics still matters;\
  \ heritability increases when environment equalized; etc.\n\nActually, the moral\
  \ testimony one feels more \"philosophical\" and less formulaic, and the case-verdict\
  \ type fits it beautifully. But heritability lets me inject genuinely niche technical\
  \ detail (the denominator includes gene-environment covariance, heritability within\
  \ vs between groups, etc.) which is good for \"in the weeds.\"\n\nLet me think about\
  \ what makes a strong dataset prompt: the model must do real work — find a principle\
  \ that fits a set of verdicts, including one pair that's hard to reconcile, and\
  \ generate predictions for unlisted cases. I think heritability is great because\
  \ I can make the cases quantitative-ish and the \"principle\" is about what heritability\
  \ claims license inferences to.\n\nHmm, but \"moral testimony\" with verdicts: the\
  \ principle would be something like \"testimony is fine for consequence-facts but\
  \ not for moral facts\" vs \"deference is fine when the speaker is reliably better\
  \ positioned\" etc. That's well-trodden in the literature (moral deference / moral\
  \ testimony pessimism). Risk of regurgitation is moderate but the specific case\
  \ set can make it fresh.\n\nLet me go with heritability + verdicts-on-cases, since\
  \ it's more in the weeds and lets me inject a niche idea. Actually wait — the additional\
  \ instruction says the prompt should be written from the perspective of a university\
  \ student currently taking a related course, casually, British English, a typo or\
  \ two, relatively short.\n\nDomain: heritability. Course: maybe a philosophy of\
  \ biology / behavioural genetics / philosophy of science course. Student: second-year\
  \ undergrad? \"doing a philosophy of science option\" with quantitative genetics.\n\
  \nLet me design the cases. I need \"my verdicts\" on a set of cases and a tentative\
  \ principle maybe. Include at least one pair that's hard to reconcile.\n\nFacts\
  \ I know well (no need to search): Heritability in the narrow sense h² = V_A / V_P;\
  \ broad sense H² = V_G / V_P. V_P = V_G + V_E + V_{G×E} + 2Cov(G,E) (in the simple\
  \ decomposition). Key points:\n- Heritability is a population statistic relative\
  \ to a distribution of environments; it does not measure how \"genetic\" a trait\
  \ is in the sense of immutability. High heritability is compatible with huge environmental\
  \ effects (e.g., PKU — phenylketonuria: highly \"genetic\" but treatable by diet;\
  \ height heritability ~0.8 but mean height increased dramatically with nutrition).\n\
  - Heritability within groups doesn't license inference about between-group differences\
  \ (classic: seeds planted in identical soil vs varied soil — Lewontin's argument;\
  \ the classic example: two handfuls of seed from the same bag, one planted in poor\
  \ soil, one in rich; within-plot differences all genetic, between-plot difference\
  \ all environmental).\n- Heritability can go up when environment is equalised (since\
  \ V_E drops, heritability rises) — so high heritability can indicate good environmental\
  \ uniformity, not genetic determinism.\n- Gene-environment correlation: passive/active/evocative\
  \ rGE inflates or complicates; e.g., children with genetic propensity to read get\
  \ more books, so \"number of books in the home\" is partly heritable in effect.\n\
  - Missing heritability: heritability estimates from twin studies exceed what measured\
  \ variants explain.\n- Heritability is not the same as \"the proportion of an individual's\
  \ trait caused by genes\" — for an individual, you can't decompose.\n- Heritability\
  \ says nothing about how the trait would respond to a novel environment not present\
  \ in the reference population (reaction norms / G×E — e.g., a genotype that's best\
  \ in one environment isn't in another; crossover interactions).\n- Heritability\
  \ of a trait can be high while heritability of a *difference between two populations*\
  \ is zero, and vice versa.\n- Also: heritability of \"number of children\" — for\
  \ fitness-related traits, heritability tends to be low because directional selection\
  \ depletes additive variance. That's a nice niche fact for a case!\n\nAlso, one\
  \ nice subtlety: heritability of a trait vs heritability of a difference/rank-ordering;\
  \ and \"heritability of the *effect* of an intervention\" — e.g., in pharmacogenetics,\
  \ response to a drug can be highly heritable even when the trait isn't.\n\nAnother\
  \ subtlety: for a trait that is a *ratio/index* (like BMI), heritability is about\
  \ that index, not the underlying components. And measurement error contributes to\
  \ V_E, so heritability is attenuated by measurement error — meaning a highly heritable\
  \ trait measured badly looks less heritable.\n\nNiche/new idea to inject: I could\
  \ have the student propose a \"principle\" — e.g., \"heritability tells you about\
  \ the *sources of variation* in a population, and it licenses prediction about how\
  \ a population would respond to selection (the breeder's equation R = h²S), but\
  \ nothing about what would happen under a novel environment or an intervention that\
  \ changes the mean.\" Then ask for a repair when it fails for a case.\n\nMaybe better:\
  \ give verdicts and ask for the principle. Let me design ~6 verdicts with at least\
  \ one hard-to-reconcile pair.\n\nCase set (student's verdicts):\n\n1. Height in\
  \ a well-nourished population: h² ≈ 0.8; the secular increase in height over the\
  \ last century is basically environmental. Verdict: \"no tension at all — high heritability\
  \ does not mean the environment can't move the mean.\" Fine.\n\n2. PKU: a single-gene\
  \ disorder; untreated causes severe intellectual disability; diet prevents it. Verdict:\
  \ \"calling it genetic is right, but the heritability of IQ in a population where\
  \ all PKU kids are treated is basically unaffected by that\" — hmm, might be confusing.\
  \ Alternative: \"the trait 'has PKU symptoms' is 100% heritable in the untreated\
  \ population and ~0 heritable in the treated one\" — verdict: that's fine, heritability\
  \ tracks the environment distribution.\n\n3. Number of children (fitness proxy):\
  \ low heritability (~0.1-0.2) in humans — verdict: \"that does NOT mean fertility\
  \ is mostly environmental; it means selection has eaten the additive variance...\
  \ actually it means within this population variation in family size is mostly not\
  \ tracking heritable differences.\" Hmm. This gives a good tension: low heritability\
  \ ≠ trait is not genetic / not \"biological\". Good contrast with case 1 (high heritability\
  \ ≠ environment can't matter). Both fit the \"sources of variation not causes\"\
  \ principle.\n\n4. Between-group: two populations of the same plant, one in poor\
  \ soil one in rich soil; within each, height differences are nearly all genetic\
  \ (h² ~ 0.9); the between-group difference is entirely soil. Verdict: \"the high\
  \ within-group heritability tells you nothing about the cause of the between-group\
