  \ quite good too and it's naturally \"in the weeds.\"\n\nBut the type description\
  \ says \"A good prompt fixes what the prioritization is for -- whose effort, how\
  \ much of it, toward what end.\" For a student, e.g., \"I have to write a 12,000-word\
  \ dissertation... which questions should I pick.\"\n\nHmm. Let me consider heritability\
  \ with the case-verdict type: heritability of what? Cases: \"the heritability of\
