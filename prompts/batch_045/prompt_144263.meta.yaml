  being claimed. I keep watching the same word do two incompatible jobs: as a debunking
  move ("the data never pins anything down, so the consensus is just social") and
  as a license to hold onto a favored hypothesis at low cost ("no possible evidence
  could distinguish mine from the mainstream one, so my priors settle it"). Before
  we can argue about whether either move is fair, I want an instrument that sorts
  a person by what they actually think about cases, and I want it as a decision tree
  rather than an essay.


