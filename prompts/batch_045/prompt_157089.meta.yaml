  Student answer:


  Nietzsche''s question in this essay is not an epistemological one about how we can
  know the past but a therapeutic one: what does carrying a past around do to a person
  or a people, and when does it help them act and when does it make them sick. His
  answer is that we need history, but only in the way a living thing needs food —
  a certain amount nourishes, too much chokes. The measure is life, meaning roughly
  the capacity of an individual or a culture to go on acting, willing and shaping
  itself, and the key faculty is what he calls plastic power: the ability to take
  what is past and foreign into yourself, transform it, and rebuild yourself out of
  it, instead of being buried under it.


  Nietzsche distinguishes three stances, and I want to argue that they are really
  stages: a culture starts in the monumental stance, matures into the antiquarian
  one, and then, once the weight of its inheritance has become intolerable, has to
  pass through the critical stance in order to be free.


  Monumental history treats the past as a store of examples. Its need is the need
  of the person who wants to do something great and needs to be shown that greatness
  was possible — the monumental historian points to the high moments of the human
  struggle and says: this actually happened, so it is possible again. Its disadvantage
  is that this works by analogy, and analogy lies: differences get smoothed away,
  the conditions that produced the great deed are forgotten, and the past is rewritten
  into a gallery of heroes. The living are then measured against an impossible standard
  and come to seem small; or worse, success gets worshipped for its own sake and whatever
  won is treated as having been right.


  Antiquarian history treats the past as an inheritance. Its need is the need to belong:
  the person or people who reveres what it comes from, who preserves the conditions
  under which it became what it is, gets a rootedness and a gratitude for existing
  without which there is nothing to build on — Nietzsche is explicit that a culture
  without any memory of where it came from is as impoverished as a person without
  one. But the antiquarian stance can''t discriminate. It wants to keep everything,
  so the trivial sits next to the important with the same piety, and dead and even
  hateful things get preserved just because they are old. It knows how to preserve
  but not how to create, and it ends up judging everything new by how faithfully it
  repeats what already exists.


  Critical history treats the past as something to settle accounts with. Its need
  is the need of the sufferer: we are, as Nietzsche says, the results of earlier generations
