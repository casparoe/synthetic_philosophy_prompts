  Endurantism: objects are wholly present at each time; persistence = being wholly
  present at multiple times; change = having different properties at different times
  (possibly via relational/tensed properties). Perdurantism (four-dimensionalism):
  objects persist by having temporal parts at different times; an object is the aggregate/fusion
  of its temporal parts; change = different temporal parts having different properties;
  "wholly present" is rejected; also perdurantism is often paired with the "no intrinsic
  change" idea and with the problem of temporary intrinsics (Lewis).


  Dorian Gray inversion: Normally, Dorian''s body is what changes and the portrait
  is the record. In the novel, the portrait changes and Dorian''s body doesn''t. So:
  the novel splits what perdurantism fuses. Interesting questions:


  1. Is Dorian a person at all under perdurantism? If persons are fusions of person-stages,
  Dorian''s stages are all qualitatively identical (he doesn''t age), while the portrait''s
  stages differ wildly. Which object is Dorian? If we identify the person with the
  fusion of stages, and the stages are individuated by their qualitative/ causal role...
  Hmm — a "stage" of Dorian at t is a 3D object: a young man''s body. But the portrait
  at t is also changing. If perdurantism says the person is the maximal fusion of
  stages related by some relation R (e.g., continuity of the right kind), then Dorian''s
  body qualifies. So perdurantism per se doesn''t care about the qualitative identity
  of stages: a person can be unchanging. So the twist is: Dorian is a perduring object
  all of whose temporal parts are qualitatively identical — a degenerate case — while
  his *moral* change shows up in a different object. So the novel dramatizes the thought
  that a person''s history is essential to who they are: a life whose stages can be
  separated off into a picture is a life that has, in a sense, no temporal parts —
  the temporal parts exist in the portrait instead.


  2. The endurantist reading: Dorian is wholly present at each moment, unchanged —
  the *paradigm* endurantist object: an object that is exactly the same intrinsic
  stuff at every moment while bearing different relational properties (he stands in
  different relations to the portrait). Actually endurantists handle change via tensed/relational
  properties: Dorian at t is "such that the portrait is hideous at t." Hmm nice.


  3. The picture: is the portrait a temporal-part container? The portrait literally
  bears the temporal stages of Dorian''s moral life — is the portrait Dorian''s perduring
  counterpart? Interesting: when Dorian stabs the picture, the change transfers back:
  the picture reverts to the beautiful youth and Dorian''s corpse is withered. Each
  object has exactly one "true" stage-set, and the swap is corrected at the end. So
  the ending can be read as: you cannot ultimately offload your temporal parts; the
  temporal parts "belong" to the person and the redistribution is undone. A perdurantist
  would say the person just is the aggregate of those stages, so Dorian was, all along,
  the withered, corrupted thing, and the beautiful body was a kind of fake — an enduring
  husk. That''s a neat reading: Dorian''s crime is trying to be an endurantist (remaining
  wholly present and qualitatively invariant) while his temporal parts pile up elsewhere;
  the novel punishes him for it, vindicating perdurantism? Or: the novel shows that
  the "real" self is the whole temporal aggregate including the ugly stages, so a
  person cannot be identified with their current stage.


  Also: the "temporary intrinsics" problem (Lewis): how can one thing have incompatible
  intrinsic properties at different times? Endurantism must say properties are time-indexed
  (had-at-a-time). Dorian Gray literalizes this: his beauty is "had-at-a-time," and
  the ugliness is had by the picture at that time. Hmm.


