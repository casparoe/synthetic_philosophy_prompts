  complete good faith by founders who take themselves to be rigorous Aristotelians.
  Call the token something like Nomisma. The protocol should try to implement, in
  smart-contract form, exactly the doctrine we have been reading: commensuration by
  reference to need, money as a surety of later exchange, exchange as the bond of
