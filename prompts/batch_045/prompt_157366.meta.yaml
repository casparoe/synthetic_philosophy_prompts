  Frege-Geach basics: Expressivism (Ayer''s emotivism, Blackburn''s quasi-realism,
  Gibbard''s norm-expressivism) says moral sentences express non-cognitive attitudes
  rather than represent beliefs. Problem: in unasserted contexts (antecedents of conditionals,
  negations, questions, disjunctions), the attitude isn''t expressed (you don''t disapprove
  of theft when you say "if stealing is wrong, then..."), yet the sentence retains
  its meaning and moral arguments remain valid. Frege point: the content of "stealing
  is wrong" is the same whether asserted or embedded; Geach point: moral modus ponens
  arguments are valid, so the sentences must have truth-conditional content (or at
  least the expressivist must account for validity). Blackburn''s response: attitudes
  can be in conflict — being for A and being for A→B while being against B is incoherent;
  so validity can be recaptured in terms of attitudes (practical coherence). Gibbard:
  "plan-laden" / factual content — hyperplan semantics. Hmm, that''s technical; small
  LLMs might fumble. But the prompt could summarize.


