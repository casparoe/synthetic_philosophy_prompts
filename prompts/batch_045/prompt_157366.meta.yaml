  They''d agreed on the setup: expressivism says that to call something wrong is not
  to state a belief about it but to voice a conative attitude — roughly, to be against
  it — and the Frege–Geach problem is that moral sentences keep their full meaning
  when they''re not being used to voice anything: ''if stealing is wrong, then getting
  your little brother to steal is wrong'' contains ''stealing is wrong'' in a position
  where the speaker isn''t expressing disapproval of stealing. The best-known expressivist
  answer, associated with Simon Blackburn, recaptures logical validity by moving it
  up a level: what makes the argument valid isn''t that the premises and conclusion
  represent the world but that it''s incoherent to be for the antecedent, for the
  conditional, and against the consequent at once; the pattern of attitudes has structure
  even though no single attitude is being expressed. [Critic, call him X] then introduced
  what he called ''unowned'' moral sentences: tokens that are produced and consumed
  without anyone ever having the relevant attitude and without anyone being in a position
  to have it — the line in a hospital protocol that says ''withholding life-sustaining
  treatment in this class of cases is permissible,'' written by a committee, stored
  in a database, and applied by software to real patients; or a moral judgment produced
  by a language model trained on annotations whose authors are dead. He said these
  sentences figure in inferences that are plainly valid and plainly action-guiding,
  but no one is ever ''for'' or ''against'' anything in connection with them, so the
  incoherence story has nothing to bite on: there is no agent whose attitudes could
  be incoherent. [Expressivist, Y] replied that this is just the original problem
  in a new costume: meaning is a matter of the practices of a community of attitude-holders,
  an unowned token inherits its content from the use it''s fitted for, and the validity
  of the protocol''s inference consists in the fact that anyone who did take up those
  sentences — accepted the protocol, applied it while rejecting its upshot — would
  be incoherent. X answered that this makes validity counterfactually hostage to agents
  who will never exist (no one will ever ''take up'' the protocol in the relevant
