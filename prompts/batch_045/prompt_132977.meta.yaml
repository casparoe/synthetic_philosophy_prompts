  Facts about Solomonoff induction (from memory, reliable):

  - Solomonoff prior M(x) = Σ over programs p computing x of 2^{-|p|} (with a universal
  prefix-free machine). M dominates any computable semimeasure μ up to a constant
  factor: M(x) ≥ c_μ μ(x) where c_μ = 2^{-K(μ)} roughly.

  - Convergence: M(x_{1:n}) → μ(x_{1:n}) in the sense that the ratio goes to 1 with
  μ-probability 1 (Solomonoff''s theorem for the universal prior, for computable μ).
  Also total expected squared-error bound: Σ_n E[(M(x_n=1|x_{<n}) − μ(x_n=1|x_{<n}))^2]
  ≤ (ln 2 / 2) K(μ) — something like that (Hutter''s bound: the total expected number
  of errors / squared error is bounded by K(μ) ln 2 /2, or with the constant depending
  on the loss).

  - Key caveats: M is not computable (only lower semicomputable/approximable), the
  bound''s constant depends on μ (so no uniform guarantee across environments — the
  "constant" is the whole content, and it can be astronomically large), and it depends
  on the choice of reference universal machine (change of machine multiplies by a
  constant / changes K by an additive constant, which is negligible asymptotically
  but can swamp anything at finite n).

  - Critiques: "no free lunch" for computable prediction: for any computable predictor
  there are computable environments where it fails for arbitrarily long; the Solomonoff
  bound is only meaningful because K(μ) is small for "our" world — but that''s an
  empirical/contingent fact about the world plus a choice of encoding; the prior depends
  on the machine, and the choice of machine is where all the "simplicity" assumptions
  get smuggled in (the "language" or "encoding" relativity). Also: it only handles
  sequence prediction with computable sources; it doesn''t address theory choice,
  uncomputable worlds (e.g. worlds with uncomputable physics — though Solomonoff''s
  proof works for any μ computable in the limit? Actually there are extensions to
  semicomputable/lower-semicomputable environments).

  - Also relevant: the dominance result is about convergence to the true μ''s predictions,
  and the "Occam" aspect is that M''s prior assigns 2^{-K(x)} weight, i.e. exponentially
  more weight to simple environments. This is a vindication of a razor only relative
  to this encoding.


