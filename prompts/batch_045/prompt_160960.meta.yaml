  "Write a sonnet (fourteen lines of iambic pentameter, with a clear volta at the
  ninth line) about Lewis''s triviality results for indicative conditionals. The octave
  should present the Ramsey–Adams suppositional picture in concrete terms: take a
  fair three-sided die with outcomes one, two, and three, each with credence one third.
  Let A be the proposition that the die lands odd (outcomes one or three) and C be
  the proposition that it lands one. To judge the conditional sentence ''If the die
  lands odd, it lands one'', one supposes the die is odd and then assesses the chance
  of one; the degree of belief in the conditional is therefore P(C|A) = 1/2, not the
  unconditional P(C) = 1/3. Present this as a natural, attractive account of what
  it is to accept an indicative conditional.


  The volta (line nine) should be the moment Lewis''s triviality proof tightens: if
  that conditional is itself an ordinary proposition—a truth-evaluable member of the
  same Boolean algebra, whose probability is always P(C|A) for every credence function
  in a suitably rich class—then the equation forces every pair of propositions to
  be probabilistically independent. In the die case, independence would require P(C|A)
  to equal P(C): the conditional probability 1/2 would have to collapse into the unconditional
  1/3. Because the two are distinct, the space of non-extreme credence functions collapses:
  any two disjoint outcomes that both had positive probability would violate independence,
  so all remaining admissible credence functions assign probability 1 to a single
  world (or, equivalently, only 0 and 1 to every proposition). The sestet should dramatize
  this collapse without simply announcing it as jargon: the rich three-outcome uncertainty
  shrinks to a single point, the odd/even and one/not-one distinctions lose their
  probabilistic grip, and the attractive suppositional picture is caught in a dilemma.


