  Core puzzle pieces:


  1. Both countries accept a millennia-long custodial obligation: the waste must be
  guarded/buried by institutions that persist for timescales longer than any state
  has lasted. So both presuppose that obligations can bind institutions that no longer
  exist in any recognisable form, i.e., that the polity is a persisting agent across
  generations. Yet the same polity''s energy policy is set by a democratic mandate
  of a few years. What''s the implicit theory of the state as a transgenerational
  agent?


  2. Germany''s justification is often put as "we will not saddle future generations
  with the risk" — but the waste outlasts the phase-out by a factor of thousands.
  So either the phase-out is expressive (about what the nation stands for / a refusal
  to continue a practice) rather than consequentialist, or it presupposes a distinction
  between "we stop adding to the pile" and "we clean it up" — i.e., a doing/allowing
  or "no new impositions" principle. Ask: what does the exit actually presuppose about
  the wrongness of imposing unconsented risk — is it an act-centred (deontic) constraint
  rather than an expected-harm calculation?


  3. France''s practice of extending lifetimes presupposes that risk is a managed
  quantity: safety is achieved not by design alone but by continuing institutional
  competence (a regulator that re-assesses, an operator that maintains). So it presupposes
  that the state can bind itself to remain competent — i.e., it treats the state as
  capable of promising for the long run. That''s the flip of the German worry.


  4. The interesting asymmetry: Germany treats the *accident* tail risk as the thing
  that makes nuclear morally distinctive (a low-probability, concentrated, involuntary,
  catastrophic event that also undermines the social trust on which the state depends
  — evoking the "we cannot live with this" dimension), while treating CO2 as a diffuse
  harm to be traded off in cost-benefit. France treats CO2 as the紧迫 problem and nuclear
  risk as an engineering quantity. What''s the implicit taxonomy of risk? Something
  like: risks differ not only in expected harm but in their "shape" — concentration
  vs diffusion, reversibility, voluntariness, whether the harm is mediated by social
  breakdown, whether it can be consented to, whether compensation is possible. Ask
  whether both countries could share one theory given different exposure, or whether
  the two policies genuinely presuppose different value theories.


  5. Niche injected idea: "custodial capacity" / "institutional half-life". Idea:
  a technology''s moral profile depends on the duration and kind of institution it
  requires to remain safe after it stops being useful. Nuclear demands a *custodian*
  (a competent, funded, literate state) for periods exceeding the recorded duration
  of any state; fossil CO2 demands no custodian but imposes harm that persists and
  diffuses; renewables demand continuous material throughput. So the real axis isn''t
  "risk magnitude" but "what kind of successor institution are we betting on". This
  lets the model do real work: which presupposition does each policy make about the
  persistence of competent governance? And if you thought the risk of institutional
  collapse over a century was non-trivial, what would follow for France (a fleet needing
  oversight) vs Germany (a sealed repository that in principle needs no oversight
  — "passive safety" — but which currently is being sited by a process that assumes
  a functioning state)?


  I like that: "passive safety" vs "active custodianship" is a real engineering distinction,
  and it maps onto a philosophical one about what we owe the future: do we owe them
  a safe world, or do we owe them the *capacities* to manage risk? Or do we owe them
  independence from our institutions?


  6. Another in-the-weeds seam: the "we have ideas" framing — France''s Messmer plan
  was adopted without parliamentary debate; Germany''s exit was driven by a decades-long
  social movement and courts. So the two practices may presuppose different views
  about *legitimacy*: whether the relevant consent is that of the current electorate,
  of a technical elite, or of the future. Nice.


  7. Apparent inconsistency ("we do X here but Y there"): Germany refuses the tiny
  domestic risk of its own reactors while accepting the continued hazard of its own
  sealed waste and while buying nuclear electricity from its neighbour; France assumes
  indefinite institutional competence while having built its fleet in a decision made
  without public debate. Also: both countries treat nuclear waste with a precautionary,
  near-absolute standard (demonstrate isolation for geological times) while treating
  climate risk with a cost-benefit/carbon-budget standard (some nonzero optimal warming).
  That asymmetry is the sharpest philosophical seam: the same jurisdictions apply
  "demonstrate safety essentially without regard to cost" to radioactivity and "balance
  cost against harm" to CO2. What theory of risk and of future persons makes that
  coherent? Possible answers: (a) different epistemic confidence (we can compute CO2
  damages, we can''t compute tail risks); (b) different agency structure (the waste
  is our act imposed on identifiable non-consenting future people; climate is a collective
  action problem where the harm depends on others'' acts); (c) different kinds of
