  Paragraph 1: Set up the argument. Me and my friend after a long argument (at a pub
  / after a seminar, on the walk home). The friend says: probabilities over mathematics
  is nonsense — either 2+2=4 is a theorem or it isn''t; there''s no uncertainty, only
  ignorance; a Bayesian agent who is logically omniscient assigns 1 to all theorems;
  therefore any talk of "P(P=NP) = 0.3" is meaningless or just about your own epistemic
  state. I said: but that''s the whole point — the ideal of logical omniscience is
  useless for agents like us, and there''s this framework (logical induction) where
  you assign prices to sentences that are determined by the axioms, and the constraint
  isn''t coherence at each step but that no trader can make unbounded profit from
  your prices over time. We went round and round; he also said the whole thing is
  just "you''re betting on how long it takes a computer to find the answer", i.e.,
  that all logical uncertainty is really about computation time, which I think is
  too quick — I think he''s conflating decidability with what a bounded agent can
  anticipate, and also I think there''s something about a good reasoner''s uncertainty
  having to decay *before* the proof arrives, not just collapse at once. Anyway we
  didn''t resolve it.


  Paragraph 2: The ask. I''m running a session... Setting: I''m a PhD student running
  a fortnightly reading group / a 90-minute seminar for ~14 final-year philosophy
  and CS undergrads. Design an in-class activity: a market/trading game where participants
  trade on mathematical claims that are settled but not yet settled-for-them. Requirements:
  rules, materials (index cards, a spreadsheet/whiteboard, play money or points),
  a payoff scheme (no real money), and a debrief mapping moments in the game to the
  ideas. Constraints: it should make them feel (a) that there''s a difference between
  2+2=4 and a claim like "the 10,000th digit of π is 7" and "there''s an odd number
  of something" — i.e., a gradient of logical depth; (b) that a price is not a probability-of-truth
  but a willingness-to-bet that can be arbitraged against other prices (even when
  the underlying claims are all determined — e.g., P(A) + P(not A) = 1, and P(A or
  B) relations, and the fact that if A implies B then price(A) ≤ price(B), so you
  can be Dutch-booked by *logic* even though no event ever happens); (c) that a good
  reasoner''s prices should start moving toward the truth *before* the answer is revealed
  and not jump all at once.


