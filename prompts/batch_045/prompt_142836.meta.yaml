  R1 (Coordination/equilibrium rule): You ought to follow a local convention when
  it is a real, mutually-expected regularity whose point is coordination or the distribution
  of a small good, because deviating makes you a free rider on others'' compliance
  and disrupts the pattern. Visitors included — boots on the ground is enough.


  R2 (Expectation/consent rule): Deviating is wrong only when it defeats a specific
