  probability is the probability of C under the supposition of A; i.e., conditional
  probability = degree of belief in C given A, not the probability of any proposition
  expressed by "if A, C". But then Adams''s thesis is about assertability.


  Also important: Lewis''s result assumes that → is a proposition-forming operator
  on propositions, i.e., that "if A then C" expresses a proposition whose truth value
