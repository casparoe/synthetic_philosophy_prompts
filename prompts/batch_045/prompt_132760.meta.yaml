  The dispute began with Kripke''s ''quus'': x quus y = x + y if both x and y are
  below 57, and 5 otherwise. The skeptic asks what fact about me makes it the case
  that by ''plus'' I meant plus rather than quus.


  [1] Ana: The challenge is empty. We learn ''plus'' by being trained on small numbers;
  the training, together with our shared practice, is exactly the sort of thing that
  constitutes meaning. To demand something over and above use is to demand a kind
  of fact that meaning-talk never promised. So the paradox is manufactured by an inflated
  demand for a ''constituting fact.''


  [2] Rob: The demand isn''t inflated; it''s the ordinary demand that my word have
  a determinate content. Kripke''s point about dispositions is that they are finite
  — my dispositions run out long before the numbers do — and, more importantly, that
  dispositions get the normativity wrong: from the fact that I am disposed to answer
  ''125'' to 68 + 57 it doesn''t follow that 125 is the answer I *should* give. A
  use-theory gives you what I do, not what I ought to say.


  [3] Ana: That ''ought'' is doing all the work... [straight solution line] The dispositionalist
  can say: meaning plus is (roughly) being such that one would, under ideal conditions,
  respond thus-and-so; the norm is internal to the practice, not a shadowy extra fact.
  Kripke''s skeptic simply helps himself to the premise that a genuine norm must outrun
  every possible manifestation.


  [4] Rob: Ideal conditions won''t rescue it, because of the mistake problem: any
  dispositional account must pick out which of my actual responses are the ones that
  reveal my meaning — I sometimes slip, I sometimes answer inattentively — and picking
  those out presupposes the very distinction (correct vs. incorrect application) that
  the account was supposed to explain. And notice the challenge doesn''t depend on
  our being finite. Define a ''grueified'' quus: the function that agrees with addition
  on every sum I have actually performed, in thought or on paper, and returns 5 for
  every sum I haven''t [call it ''plim'']. Then my entire behavioral history — everything
  an idealized observer could record — is consistent with my having meant plim. So
  the skeptic isn''t exploiting a contingent limitation of ours; no finite record
  could settle the question in principle.


  [5] Ana: That''s exactly what makes me suspect the challenge is bogus. If the argument
  is insulated from every possible evidential difference, it isn''t a demand for a
  fact, it''s skepticism in a semantic costume. A challenge that no possible evidence
  could meet, and whose satisfaction would make no practical difference, should be
  rejected rather than answered — like the demand that you prove you''re not a brain
  in a vat.


  [6] Rob: Kripke agrees that the challenge can''t be met by a fact — that''s why
  he calls his own response a ''skeptical solution'': there is no fact of the matter
  of my meaning plus; meaning attributions are to be understood by their assertibility
  conditions and their role in our form of life, not by truth conditions. The price
  is accepting that meaning attributions aren''t straightforwardly fact-stating; the
  payoff is that we keep everything we actually do with them.


  [7] Ana: But that solution can''t be stated in its own terms. If meaning attributions
  have no truth conditions, then your assertion that ''there is no fact of the matter''
  — and indeed the whole skeptical argument, which traffic in claims about what I
  meant and what follows — isn''t true either. Worse, the argument generalizes: whatever
  a ''straight'' solution proposes, the question ''what makes *those* words mean that?''
  can be re-raised, so no solution can be so much as formulated. An argument that
  undermines the stating of any answer isn''t a discovery; it''s a machine for producing
  inarticulacy.


  [8] Rob: The generality cuts both ways: any solution, skeptical or straight, faces
  the re-raising question, so generality can''t be an objection specific to mine.
  And Kripke''s solution is local: it explains how a community can go on making meaning
  attributions without semantic facts — the conditions under which we''re entitled
  to attribute ''plus'' are given by the practice itself, and the skeptic''s own reasoning
  shows why we can''t ask for more.


