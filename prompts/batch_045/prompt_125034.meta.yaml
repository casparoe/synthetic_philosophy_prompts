  the equation while keeping truth conditions (variably strict semantics, the "Stalnaker/Lewis"
  truth-conditional accounts, and the "restricted/dyadic" analyses); (iii) the result
  doesn''t kill the material conditional by itself — the material conditional simply
  rejects the equation; its problems lie elsewhere (paradoxes of material implication,
  the fact that P(A ⊃ B) = P(¬A ∨ B) can be high while P(B|A) low, and the failure
