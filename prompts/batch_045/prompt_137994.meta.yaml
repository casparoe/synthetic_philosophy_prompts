  \ a scarce resource; or a hospital ICU triage committee; or a disaster / crisis\
  \ standards of care committee. The separateness of persons objection — Rawls's objection\
  \ that utilitarianism fails to take seriously the distinction between persons, aggregating\
  \ lives. A concrete case: a transplant committee deciding whether to allocate a\
  \ single donor liver to one patient vs. ... no, that's not aggregation.\n\nBetter:\
  \ a public health department's committee deciding whether to approve a policy that\
  \ imposes a concentrated burden on a few to produce a diffuse large benefit — e.g.,\
