  \ Or a school district rezoning. Or a hospital closing a dialysis unit serving a\
  \ small rural community to save money that will benefit many more patients elsewhere.\
  \ That's a nice aggregation vs. separateness case: \"we can save $4M by closing\
  \ the rural clinic, which will prevent an estimated 8 deaths among the rural patients\
  \ over 5 years, but will fund a cardiac program that prevents 30 deaths.\" Utilitarian\
  \ aggregation says close; separateness of persons says each person's claim can't\
