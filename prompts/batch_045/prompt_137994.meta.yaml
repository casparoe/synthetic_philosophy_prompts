  separateness of persons\" is best instantiated by a case where identifiable individuals\
  \ bear a concentrated, severe loss for a diffuse aggregate gain. Classic: a hospital\
  \ ethics committee must decide whether to allow a research study on ... hmm.\n\n\
  Another classic instantiation: the \"numbers\" vs. \"identifiable individual\" (Rule\
