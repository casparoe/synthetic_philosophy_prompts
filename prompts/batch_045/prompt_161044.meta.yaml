  \ But maybe \"who decides\" (Anthropocene) is more \"in the weeds\" philosophically\
  \ with concepts. Hmm.\n\nLet me evaluate the deliverable richness. The type requires:\
  \ identify candidate rules consistent with earlier verdicts, say what each predicts\
