  You are a professional moral philosopher with expertise in normative ethics, population
  ethics, and the ethics of rescue. I am taking an advanced seminar on distributive
  ethics, and after class my study group got stuck on the question of whether the
  numbers count in rescue cases—the issue associated with Taurek about saving the
  one versus the many. To keep things sharp and not depend on exegesis, here is the
  exact claim I want assessed. In a pure rescue case, you can save either one identifiable
  stranger or five identifiable strangers; you cannot save both; you have no special
  obligations to any of them; all six would otherwise die; the lives saved are of
  equal length and quality; and the only difference is how many people are saved.
  The claim, call it N, is that the numbers give you no moral requirement to save
  the five, and it is morally permissible for you to save the one, or alternatively
  permissible to decide by a fair lottery that gives each of the six an equal chance
  of being saved. Please treat this as the proposition to evaluate rather than as
  an occasion for exegesis; I do not want a bibliography, citations, or a hedge that
  the answer depends on your ethical theory as a way of avoiding a number.


  My own credence in N is about 0.2, and my friend Priya''s is about 0.7, and we both
  feel we are missing where the real disagreement lives. Please give me your own credence
  in N, decomposed as a rough probability for each of the following sub-questions,
  and add any further term you think belongs: first, the probability that the badness
  of a death, or the moral reasons generated by each person''s need, cannot be summed
  or aggregated across different people to produce a stronger reason to save the many;
  second, the probability that, even if some interpersonal aggregation is licensed,
  each person''s equal claim to be rescued generates a requirement of equal treatment
  or a fair lottery that defeats the numerical imbalance; third, the probability that
  the ordinary intuition that one ought to save the greater number in such cases is
  a reliable guide to moral truth, as opposed to being distorted by factors such as
  identifiability, scope neglect, or the vividness of an individual face; and fourth,
  the probability that N remains stable when the numbers are made much larger, such
  as one versus a million, or when small quality-of-life differences are introduced,
  so that the view does not collapse into absurdity at the margins. Assign a number
  and a one-line justification to each term, then show how they combine into your
  final credence in N, and tell me which single term you are least confident in and
  what argument or evidence would move it most.


  Finally, to help Priya and me locate our dispute: given the decomposition, say which
  of these sub-questions two people at 0.2 and 0.7 most likely disagree about, and
  whether the 0.2 person is probably putting too much weight on commonsense aggregation
  or the 0.7 person is probably overweighting the debunking story about rescue intuitions.
  Also, to guard against a purely verbal dispute, briefly note one way in which the
  numbers not counting could be true as a claim about what one is required to do while
