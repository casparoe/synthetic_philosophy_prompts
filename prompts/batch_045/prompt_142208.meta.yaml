  Draft outline:


  Paragraph 1: Setting + role + case description. "You are a professional moral philosopher
  with expertise in normative ethics, population ethics, and the ethics of rescue.
  I''m taking an advanced seminar on distributive ethics, and after class my study
  group got stuck on a version of the old ''numbers count'' problem—the view associated
  with Taurek about saving the one versus the many. To keep things sharp and not depend
  on exegesis, here is the exact claim I want assessed: In a pure rescue case, you
  can save either one identifiable stranger or five identifiable strangers; you cannot
  save both; you have no special obligations to any of them; all six would otherwise
  die; the lives saved are of equal length and quality; and the only difference is
  how many people are saved. The claim (call it N) is: the numbers give you no moral
  requirement to save the five, and it is morally permissible for you to save the
  one (or, if you prefer, permissible to decide by a fair lottery that gives each
  of the six an equal chance of being saved). I do not want a survey of the literature,
  a bibliography, or a citation; I also don''t want ''it depends on your ethical theory''
  as a way of avoiding a number."


  Paragraph 2: Personal credences and ask for decomposition. "My own credence in N
  is about 0.2, and my friend Priya''s is about 0.7, and we both feel we''re missing
  where the real disagreement lives. Please give me your own credence in N, decomposed
  as a rough probability for each of the following sub-questions (and add any term
  you think belongs): (1) the probability that the badness of a death—or the moral
  reasons generated by each person''s need—cannot be summed or aggregated across different
  people to produce a stronger reason to save the many; (2) the probability that,
  even if some interpersonal aggregation is licensed, each person''s equal claim to
  be rescued generates a requirement of equal treatment or a fair lottery that defeats
  the numerical imbalance; (3) the probability that the ordinary intuition that one
  ought to save the greater number in such cases is a reliable guide to moral truth
  (versus being distorted by factors like identifiability, scope neglect, or emotional
  vividness); and (4) the probability that N remains stable when the numbers are made
  much larger (one versus a million) or when small quality-of-life differences are
  introduced, i.e., that the view doesn''t collapse into absurdity at the margins.
  Assign a number and a one-line justification to each term, then show how they combine
  into your final credence in N, and tell me which single term you are least confident
  in and what argument or evidence would move it most."


  Paragraph 3: Add extra nuance / Ask about disagreement. "Finally, to help Priya
  and me locate our dispute: given the decomposition, say which of these sub-questions
  two people at 0.2 and 0.7 most likely disagree about, and whether the 0.2 person
  is probably putting too much weight on the force of commonsense aggregation or the
