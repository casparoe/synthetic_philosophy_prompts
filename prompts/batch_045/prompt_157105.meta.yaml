  I am a novelist, and I am some way into a book whose central scene is a long meeting
  of a flood-relief committee in an invented northern town. The committee has one
  grant left. It can pay for a single expensive operation that will save one named
  child''s sight, or it can fund a drainage scheme that will spare some hundreds of
  households a season of damp, ruined plaster and chronic coughs. What interests me
  is not the outcome but the form of the arguments: I have been reading around contractualist
  moral philosophy, in particular the version on which an act is wrong if it would
  be disallowed by any principle that no one, suitably motivated, could reasonably
  reject, and I have been trying to let the committee argue in that idiom.


  The novel''s device: the chair, an ageing parish clerk with no patience for theory,
  insists that any decision be defensible door to door — that is, that the committee
  be able to send one of its members to the house of every single loser, alone, and
  give that person a reason she could accept. Halfway through the book a rival councillor
  proposes the opposite procedure, which I have been calling the town-hall form: the
  justification is delivered once, to everyone assembled, and what it must answer
  is the cumulative complaint of the room. I did not invent these as allegories, but
  I have noticed that they track a dispute I keep running into in the literature,
  and that characters who accept one procedure and reject the other seem to be unable
  to argue with each other at all.


  The dispute: contractualism, on the standard telling, seems to compare objections
  person by person — the strength of one individual''s complaint against the strength
  of another''s — and so the numbers appear to drop out entirely, so that no sum of
  trivial harms can outweigh one serious harm. Almost nobody accepts that conclusion,
  and contractualists have proposed various ways of letting numbers back in: by weighing
  the many severally but comparatively, by appealing to some residual tie-breaking
  consideration, by confining the view to a narrower domain. Their critics reply that
  these manoeuvres either smuggle in a consequentialism the view was meant to replace
  or leave the numbers doing no work after all, and that this is a reason to abandon
  the framework; the contractualists reply in turn that the critics have simply helped
  themselves to a consequentialist picture of what a moral reason is. As far as I
  can tell this exchange has been running for some decades and no one has moved.


  My hypothesis is that the disagreement is not about numbers at all but about the
  address of a justification: whether a moral reason has to be one that could be given
  to each person taken separately, or to the affected people taken together, and that
  the two sides are answering different questions under a single heading. But I would
  like that tested rather than confirmed.


  So: what kind of stalemate is this? Is it verbal, a clash of bedrock intuitions
  about the separateness of persons that neither side can argue for, a substantive
  disagreement about the nature of a reason''s force, or a hidden question — perhaps
  about what a principle is for — doing all the work? Does my door-to-door/town-hall
  distinction isolate the real crux, or is it a piece of novelistic scenery that misdescribes
  it? And given your diagnosis, what would count as progress: a distinction, a formal
  result, a change of question, or nothing at all? Finally, and this is the part I
  care about as a writer: if the disagreement is genuinely of the kind you say it
  is, how should I stage it so that a reader feels the failure of the two procedures
  to engage, rather than my merely reporting that philosophers disagree?


