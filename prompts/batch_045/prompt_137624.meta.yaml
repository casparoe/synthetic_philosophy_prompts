  Draft:


  "I want to ask about something that started, embarrassingly, with an internet meme.
  There''s a strain of writing in the rationalist blogosphere that treats returning
  a shopping cart to the corral as the purest available test of cooperative character:
  no one is watching, no one sanctions you, the store has deliberately placed the
  corral where it costs you something, and you will almost certainly never meet any
  of the other people in that parking lot again. The usual framing is ''self-governance,''
  which I find thin. What I actually want is the reconstruction that framing is gesturing
  at.


  Take the practice as it exists: supermarkets build corrals, don''t monitor them,
  don''t sanction non-returners, and simultaneously pay for cart wranglers and, in
  some chains, for wheel-locking systems; one chain I know attaches a refundable coin
  deposit to the cart instead. So we have, side by side, a norm with no enforcement,
  a small financial bond, and a hard physical constraint — and, from what I can see
  from my own parking lot, compliance somewhere between ''most people'' and ''obviously
  too few for the store to stop hiring wranglers.''


  Here is the part I can''t make clean. The machinery that does the explanatory work
  in the evolution-of-cooperation literature — the shadow of the future, reciprocal
  altruism, indirect reciprocity and reputation, the folk-theorem picture of cooperation
  as an equilibrium sustained by the threat of future defection — seems to have almost
  nothing to bite on in the cart case, which is close to a one-shot, anonymous, sanction-free
  prisoner''s dilemma. Yet cooperation is frequent. My own guess is that the practice
  actually presupposes something closer to a disposition than an equilibrium: the
  compliance is produced by an internalized norm (or by self-signaling, or by an imagined
  audience that isn''t there), not by the payoff structure of the game the store set
  up. If that''s right, it relocates the explanation away from the game and into norm
  psychology, which makes the ''evolution of cooperation'' story less triumphant than
  it''s usually presented as being: the cooperative hardware is being run on a game
  it wasn''t selected for.


  So: what does the practice of returning the cart presuppose about cooperation? Reconstruct
  the implicit theory; distinguish what the practice strictly presupposes from what
  it merely fits well with; and be explicit about which of the rival accounts — internalized
  norm, strong reciprocity, costly or self-signaling, indirect reciprocity with a
  phantom audience, evolutionary mismatch, or something duller like inertia or confusion
  about how much returning costs — would equally license the behaviour, and which
  the practice rules out. I would also like you to say what evidence would discriminate
  among them, since I can generate the just-so version myself. Finally, tell me what
  would change your mind: which single finding or argument would most move you off
  your reconstruction, and where you think the reasoning is most likely to fail —
  in particular whether you are assuming an anonymity and a one-shot structure that
  the situation doesn''t really have, or inferring a disposition from behaviour that
  a much thinner mechanism would produce."


