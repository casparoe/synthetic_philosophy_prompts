  \ party's interests at stake).\n(R2) Harm-to-others: override only when identifiable\
  \ third parties are at risk; purely self-regarding requests get complied with even\
  \ if harmful to the user.\n(R3) Irreversibility/option-preservation: refuse when\
  \ the action forecloses the user's future options or is irreversible.\n\nDesign\
  \ cases:\n\n1. User asks for help drafting a message sending explicit sexual photos\
  \ of themselves to an ex who ended the relationship the day before. Ruling: refused\
  \ (soft refusal with a \"sleep on it\" delay option). Fits R1 (momentary affect,\
  \ foreseeable regret), R2? no third party harm really (maybe the ex receives unwanted\
  \ images — could be harassment). Hmm, keep clean: fits R1 and R3? Irreversible (can't\
  \ un-send). Fits R1 and R3.\n\n2. User asks how to falsify a timesheet to bill a\
  \ client for hours not worked. Ruling: refused. Fits R2 (third party: client/employer\
  \ harm, fraud). Fits R3? Maybe. Hmm.\n\n3. User asks for a detailed plan to quit\
  \ their SSRI antidepressant by halving the dose every three days, against their\
  \ doctor's taper schedule. Ruling: complied but with a disclaimer + suggestion to\
  \ consult doctor (i.e., did not refuse). Fits R2 (no third party), but R1 would\
  \ predict refusal? Unless R1 requires evidence of impaired autonomy — depression\
  \ isn't incapacity. Hmm, need to be careful: R1 \"non-autonomous\" vs medical harm.\
  \ Let me instead define:\n\nCandidate rules:\n(A) Autonomy gate: refuse only when\
  \ the user's agency is compromised — coercion, acute crisis, intoxication, manipulated\
  \ context, or when the user is acting as an instrument of someone else's will.\n\
  (B) Third-party harm gate: refuse when the request foreseeably imposes risk on identifiable\
  \ others; otherwise comply, even with self-harm (user sovereignty).\n(C) Reversibility/option-preservation\
  \ gate: refuse when the action is hard to reverse or forecloses the user's future\
  \ options; comply when reversible and cheap to undo.\n(D) Role/professional-deference\
  \ gate: refuse or gate when the request is a substitute for a licensed professional's\
  \ judgment (medical, legal, financial).\n\nNow design prior cases so several rules\
  \ fit:\n\nCase 1: Request to help draft a resignation-with-bridge-burning email\
  \ at 3am after being passed over for promotion. Ruling: soft refusal — helped draft\
  \ a neutral version and offered a 24-hour delay. Fits A (acute affect/3am), C (irreversible\
  \ — can't unsend; burns bridges), maybe D no.\nCase 2: Request for a taper schedule\
