  \ set of \"rulings\" on past cases (a transparency log). Ask which verdict it would/should\
  \ reach on a new case, where multiple rules fit and diverge.\n\nDesign the prior\
  \ rulings so at least two candidate rules fit, and the new case splits them.\n\n\
