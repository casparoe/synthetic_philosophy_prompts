  hey, I''m doing a PhD on imprecise probabilities and I keep going back to how the
  IPCC actually writes up uncertainty, because it looks like the only large real-world
  institution that reports set-valued probabilities on purpose. You get likelihood
  words with probability bands attached (likely, very likely, and so on, with a legend
  mapping them to ranges), then a completely separate confidence scale that tracks
  how much evidence there is and how much the authors agree, and then — this is the
  part that bugs me — in the very same sentence they''ll still give a single best
  estimate with a likely range around it, like the headline number for climate sensitivity.


  So help me reconstruct what that package of habits presupposes. Does it strictly
  need genuinely imprecise credences, or would a precise Bayesian with one wide posterior
  over models license every bit of it, including the best estimate? Does running two
  separate scales mean it''s committed to two different sources of imprecision — disagreement
  between experts (a set of probability functions) versus thin evidence inside one
  head — or could one story cover both? And is the single best estimate a real commitment,
  e.g. to picking a privileged member of the credal set or to something like maximality,
  or is it just pragmatics for policymakers?


  One more thing I don''t see discussed: the bands have sharp endpoints. If my probability
  for a claim isn''t precise, what does it mean to say it clears 66 per cent? Looks
  to me like the imprecision just got pushed up a level — is that stable or does it
  regress? And if you swapped the whole practice for a straight single-number Bayesian
  report, what would actually be lost?


