  Draft:


  Exam question:

  "Compare laïcité as it is understood in France with the Anglo-American ''politics
  of multiculturalism'' as responses to religious and cultural diversity. Do they
  rest on incompatible views of the person, the state, and equality, or are they variations
  on one liberal framework? Ground your answer in at least one concrete policy controversy.
  700-800 words."


  Student answer (mine):


  Laïcité and multiculturalism are usually presented as opposites, but I think the
  contrast is often overstated. Both are attempts to answer the same question — how
  a liberal state should treat religion and cultural difference — and I argue that
  they share more than their defenders admit, although they do differ on one important
  point about what equality requires.


  [Para 1: laïcité basics, correct]

  Start with laïcité. It is often translated as secularism and then misunderstood
  as state hostility to religion. That is wrong. Historically laïcité in France is
  a principle about the state: the state does not recognise, fund, or organise cultes,
  and it guarantees freedom of conscience in return. The 1905 separation law is about
  institutions, not about private belief, and the republic has continued to fund and
  administer religious schools under contract and to pay chaplains in the army and
  prisons. So laïcité is compatible with a fairly thick religious presence in civil
  society; what it forbids is the state taking sides, or being seen to.


  [Para 2: the two laws, correct; then the non-sequitur]

  The two big policy cases people argue about follow from this. The 2004 law bans
  pupils in public primary and secondary schools from wearing conspicuous religious
  symbols; the 2010 law bans the concealment of the face in public space generally,
  which is aimed at the niqab and burqa. These are often run together but they are
  different in scope and in justification. The school law is about the school as a
  protected space where children should not have to signal a religious identity or
  be pressured by peers; the 2010 law is about public space and was defended partly
  on identification and security grounds and partly on the idea of living together,
  which is more or less the reasoning the European Court of Human Rights accepted
  when it upheld the ban. Since the 1905 settlement already required the neutrality
  of state agents, extending it first to pupils in schools and then to anyone in public
  space is a straightforward application of one principle, a matter of degree rather
  than of kind.


  [Para 3: multiculturalism, Taylor, Kymlicka — with the external/internal swap]

  The multiculturalist tradition in Canada and Britain starts from the opposite worry:
  that a state which insists on treating everyone identically will in fact impose
  the majority''s cultural terms. Taylor''s distinction between a politics of equal
  dignity and a politics of recognition captures this — the point of recognition is
  not that the state should be neutral about culture, but that neutrality is impossible,
  since the state always already supports some cultural options... [correct]. Kymlicka
  gives this a liberal defence: cultural membership matters because culture is the
  context of choice within which individuals form and revise their aims, so the state
  has reason to protect cultural structures, not because groups have rights as such
  but because individuals need them. This is why Kymlicka holds that external protections
  — the restrictions a group places on its own members in order to preserve the integrity
  of the culture against internal dissent and exit — can be legitimate, especially
  for national minorities, while internal restrictions — protections of a minority
  against the wider society — are the ones liberals should be suspicious of. Kymlicka
  thus grounds group-differentiated rights in individual autonomy and ends up defending
  them for national minorities and, by the same argument, for immigrant groups, who
  need them most of all.


  Hmm wait — I want the swap to be clean. Correct version: external protections =
  protect the group from the larger society; internal restrictions = the group restricting
  its own members. Kymlicka argues liberals should endorse external protections and
  reject internal restrictions (see also his remarks that internal restrictions are
  the illiberal ones, though he allows some nuances for national minorities regarding
  self-regulation — e.g., he discusses how external protections can become internal
  restrictions, and he permits some restrictions for self-government like language
  requirements, as in Quebec). The student: defines external protections as restrictions
  on members and internal restrictions as protections from wider society — swapped.
  Then adds further errors: (a) says Kymlicka defends these internal-to-member restrictions
  as legitimate; (b) says the autonomy argument leads to defending them, when actually
  autonomy grounds rejecting internal restrictions; (c) says immigrant groups need
  them most, when Kymlicka says immigrant groups want integration plus polyethnic
  accommodations, not self-government. Maybe too much error density in one paragraph.
  Let''s moderate: swap the definitions (the key subtle error), and add the "therefore,
  by the same argument, immigrant groups" extension as a second, softer error. Drop
  the "Kymlicka defends restrictions on members as legitimate" — actually it follows
  from the swap implicitly, fine as a consequence. Keep it: definitions swapped +
  extension to immigrant groups.


  Hmm, but also: Kymlicka''s view does allow that some external protections can morph
  into internal restrictions, and he does think liberals can accept certain internal
  restrictions in the case of national minorities? He argues the liberal case for
  minority rights within a liberal theory: he accepts internal restrictions are prima
  facie inconsistent with liberalism, and argues external protections are the defensible
