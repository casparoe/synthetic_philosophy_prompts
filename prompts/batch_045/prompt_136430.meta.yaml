  I''m putting together a graduate seminar module on the moral status of animals,
  and I want one session to be spent on a tangle that the standard readings slide
  over. Please give me a map of the logical geography.


  The tangle: Start from three commitments that many animal ethicists hold simultaneously,
  and which seem to me to be jointly unstable:


  (1) Anti-speciesism: species membership is not in itself a reason to give lesser
  weight to a being''s comparable interests. Suffering matters the same amount, whoever''s
  it is.


  (2) The replaceability argument: for a being that has no conception of itself as
  persisting through time — no future-directed desires, no projects it is invested
  in — death deprives it of nothing that it could be said to miss, and so killing
  it painlessly is not a harm to it, provided another such being is created to take
  its place. The "logic of the larder" defense of humane farming rides on this: the
  animals exist at all only because someone intends to eat them.


  (3) A desire-based or time-relative account of the harm of death: what makes death
  bad for a being is the frustration of desires or the loss of the future goods to
  which the being is psychologically connected; the more that is at stake in a being''s
  future, the worse its death.


  The instability I have in mind: (3) is doing the work in (2), but (3) is graded
  and comparative in a way that (1) is not. If the badness of death tracks how much
  a creature has invested in its future, then killing a being with thin psychological
  unity over time is less bad than killing one with thick unity — and, on any credible
  comparative psychology, adult humans typically have much thicker unity than the
  animals we farm. So (3) seems to license a steep hierarchy in the wrongness of killing
  that looks like exactly the sort of asymmetry (1) forbids, even though it licenses
  it without ever mentioning species. Call this the "camouflaged asymmetry" problem.


  Conversely, if you flatten (3) — insist that death is equally bad for any creature
  with a future of positive experiences, because what matters is foregone experience,
  not frustrated desire — then (2) becomes very hard to block: the replaceability
  argument gets a foothold precisely where you flattened the account.


