  - Does the anti-speciesist have to choose between a desire-based/time-relative account
  of the harm of death (which blocks replaceability at the cost of reinstating a steep
  killing hierarchy) and an experiential account (which honors equality but lets replaceability
  in)? Or is there a way of holding (1) and (2)-rejection together — e.g. by distinguishing
  the badness of a death for the victim from the wrongness of killing, or by arguing
  that creation is not compensation even when the victim loses little?


