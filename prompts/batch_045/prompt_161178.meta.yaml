  (B) The reward-prediction-error-as-valence account: valence tracks the agent''s
  own surprise about reward, i.e. the temporal-difference error: better-than-predicted
  is elation, worse-than-predicted is frustration, and perfectly anticipated reward
  is affectively neutral.


  Each account has to answer a set of hard cases I want you to work through rather
  than waive:


  1. Gauge freedom. A reward function is not unique: rescaling it by a positive constant
  and adding a potential-based shaping term leaves the optimal policy (and, under
  the shaping result, the whole learning dynamics up to the value estimate) unchanged.
  Two reward functions can therefore drive identical behavior while disagreeing, on
  account (A), about whether the agent is in agony or in ecstasy. Is welfare then
  a matter of arbitrary parameterization? What, if anything, rescues (A)?


