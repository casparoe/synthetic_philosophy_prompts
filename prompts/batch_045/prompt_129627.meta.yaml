  The exam question, self-contained:


  "Exam question: In the seminar we built a toy model, call it the Ledger Model, of
  karma as a theory of moral desert. It has five commitments. (1) Karmic fruit is
  produced by a natural, impersonal causal law; no deity or judge assigns suffering.
  (2) Only intentional actions (cetanā, volition) generate karmic fruit; accidental
  harms generate none. (3) The severity of the fruit is fixed by the moral quality
  and strength of the volition, not by the size of the downstream consequences. (4)
  Fruit may mature in a later life, and there is no reset between lives: the ledger
  carries over. (5) Because the ledger carries over, every episode of suffering an
  agent undergoes is the maturation of some earlier intentional action of that same
  agent-stream. We also read two objections. The ''arbitrariness objection'': the
  distribution of suffering looks morally arbitrary, and karma is supposed to remove
  the arbitrariness by showing it is all deserved, but the model seems to just push
  the arbitrariness back one step — why did the agent perform the earlier action?
  The ''no-self problem'': given the no-self (anātman) view, the diachronic unity
  the ledger needs seems to be exactly what the tradition denies. Your task: (600–900
  words) Take a stand on whether the Ledger Model can support a genuine claim of desert,
  and defend it against whichever of the two objections you take to be more serious.
  You may revise the model if you say exactly what you are changing and why."


  Good — self-contained, in the weeds, no memorized facts needed (cetanā/anātman are
  standard and given).


