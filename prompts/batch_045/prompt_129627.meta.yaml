  Student answer draft:


  "The Ledger Model can support a genuine claim of desert, but only if we are careful
  about what ''desert'' comes to once we drop the judge. On commitment (1), no one
  assigns the suffering, so nothing is being inflicted on anyone for a reason; the
  fruit simply arrives. That means the model isn''t in the business of retribution
  at all. Retributivism, as we read it, is the view that it is intrinsically good
  that a wrongdoer suffer, and that some agent may inflict it. Since karma has no
  inflicter, the right way to read (5) is as a causal-explanatory thesis: suffering
  is fully explained by prior volition. And once we see that, the arbitrariness objection
  more or less dissolves. The objection says the distribution of suffering looks arbitrary
  and karma is supposed to take the arbitrariness away. But on the causal reading
  we don''t need the distribution to be morally intelligible; we only need it to be
  nomically intelligible, and (3) gives us that, because the severity of what happens
  is a strict function of the quality and strength of the earlier volition. So suffering
  is never undeserved, and it is never arbitrary: it is the exact causal upshot of
  what the agent willed. The no-self problem is the more serious of the two, but only
  if you take the no-self view in its strongest form. If there is literally nothing
  that persists, then there is no ledger to keep. But the seminar version we read
  accepts causal continuity between lives without a persisting self, and a causally
  continuous stream is enough to carry a ledger: what matters for desert is that the
  same stream that willed now undergoes later, not that there is a soul. So commitment
  (4) is safe. One consequence worth drawing out: since (4) says there is no reset
  and the ledger carries, a stream that has been going for a very long time must be
  carrying a lot more undischarged debt than one that began recently, and so the model
  actually predicts that the longest-lived streams will be the worst off. That is
  counterintuitive, and I think it is a real cost, though it is not a cost I can remove
  without giving up (4). A last point: because the fruit resembles the seed — the
  model says that what you get back matches in kind what you did — the agent can in
  principle work out what she did by looking at what she is undergoing, which makes
  karmic desert epistemically accessible in a way that Western retributivism''s deserts
  are not. That is a genuine advantage over the views we read in the first three weeks,
  and it is why I think the Ledger Model survives both objections once (5) is read
  causally. I would revise the model only in one respect: I''d add that volitions
  performed under coercion accrete less fruit, because otherwise the model seems to
  punish people for what they were forced to do."


