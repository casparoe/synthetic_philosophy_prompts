  Hey, I''ve been going back and forth with a friend about whether money pumps actually
  show anything, and I want to see if my gut verdicts on cases add up to a principle.
  Context: she says cyclic/dynamically inconsistent preferences are irrational full
  stop because a dealer can extract money from you; I keep thinking the pump is doing
  less work than people say. Here''s what I think case by case.


  1. Classic. Over a week my ranking among three apartments cycles: A > B, B > C,
  C > A (commute, then light, then rent, depending on what I''m focusing on). A dealer
  offers me each swap for a dollar each time and I take all three and end where I
  started, minus $3. Verdict: yeah, something''s wrong with me here. The pump diagnosis
  feels right.


  2. Same shape, but beliefs move. Two job offers: Monday I prefer the startup; Thursday
  I learn the startup is being restructured and I prefer the university job; Friday
  I learn the university''s hiring is frozen and I''m back to preferring the startup.
  A dealer could in principle have sold me each switch for a dollar. Verdict: not
  irrational at all — I was just badly informed. Though... I did know more news was
  coming and I still acted each time. That bugs me a little.


  3. Tiredness. At 9am I want the 7pm gym class; at 7pm I''m wrecked and would pay
  to go home instead. Fully predictable — I knew at 9am exactly how this would go.
  Verdict: still not irrational, but this one I''m less sure about, and it sits badly
  next to case 1, where there was no story at all and I convicted. The only difference
  seems to be that here the change is in my body rather than in my attention. Hmm.


  4. The boredom pump, which I think isn''t a pump. I rotate through three hobbies;
  I get sick of each after a week and want the next; a dealer charges me a dollar
  each time to swap; after three weeks I''m back on hobby 1, three dollars poorer.
  Verdict: fine, and not just excusable — good. I consumed a week of each hobby along
  the way, so the "loss" is a fee for variety. If the enjoyment per week exceeded
  a dollar, I came out ahead.


  5. The self-pump with no money. No dealer. I re-plan my weekend every morning, each
  re-plan costs me effort and a bit of stress, and I end up doing roughly what I''d
  planned on Monday. Verdict: mildly bad, but not the same kind of bad as case 1 —
  feels more like inefficiency than irrationality, and if there were no cost at all
  I''d say nothing was wrong.


  6. The refund pump. Same as case 1''s cycle, except the dealer hands the three dollars
  straight into my savings account at the end, or spends it on something my later
  self wants anyway. Verdict: now I don''t think the pump shows anything. Which makes
  me suspect the money is a red herring and the real charge is just intrapersonal
  incoherence wearing a costume.


  7. The co-op. Housing co-op, rotating weekly committee; each committee''s majority
  sincerely prefers to swap the common-room furniture for the garden tools, then the
  tools for the bike rack, then the bike rack for the furniture, with a small fee
  each time to the person doing the moving. Every individual vote is fine; the institution
  loses money and ends where it started. Verdict: the institution is being pumped
  but nobody is irrational — the fault is in how we aggregate, not in anyone''s head.


