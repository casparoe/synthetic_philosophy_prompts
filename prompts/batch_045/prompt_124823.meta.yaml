  Let me draft the prompt.


  Structure:

  - Role assignment: "You are a professional philosopher (PhD, specializing in free
  will and moral responsibility) who also has experience adjudicating / teaching...
  "

  - "Before you answer, spend a few paragraphs privately working through..."

  - Setting: "I run a reading group. Two members — I''ll call them M. and R. — got
  into an argument after our session on Galen Strawson''s Basic Argument. I''ve reconstructed
  it below as faithfully as I can. Neither would budge; they''ve asked me to referee
  and I can''t."

  - The exchange, 5-6 moves, each decent:


  Setup: The Basic Argument, stated compactly: (1) You do what you do because of how
  you are (mentally). (2) To be truly morally responsible for what you do, you must
  be truly responsible for how you are — at least in the relevant mental respects.
  (3) But you can''t be truly responsible for how you are: to be so you''d have had
  to have brought yourself into being with a certain nature, which requires that you
  already had a nature that explained your choice — an infinite regress; and you cannot
  get "something from nothing." (4) Hence no one is truly morally responsible. Strawson
  also claims the argument is neutral between determinism and indeterminism.


  M. = the skeptic (defends the argument); R. = the critic.


  Move 1 (R): The argument only shows we can''t be causa sui. But why think responsibility
  requires self-creation? Reasons-responsiveness is enough: if the mechanism issuing
  in my action is appropriately sensitive to reasons, I''m responsible. Nothing in
  the regress touches that.

  Move 2 (M): Strawson grants that compatibilist conditions can be satisfied; his
  claim is that satisfying them only gives you the kind of "responsibility" that is
  compatible with everything being ultimately a matter of luck — and luck isn''t something
  you can deserve blame for. If my being reasons-responsive is itself a product of
  heredity, upbringing and luck, then whatever I do traces back to factors I didn''t
  choose. Strawson''s point is that responsibility is a tracing notion: you are responsible
  for the output only if responsible for the input, and there is no non-arbitrary
  stopping point.

  Move 3 (R): Then the tracing requirement is what''s doing the work, and it''s too
  strong. Infinite regresses of the "no first member" kind are harmless: I can be
  responsible for my character at t2 partly because of what I did at t1, and for that
  partly because of t0, and so on, with no first member — responsibility can be accumulated
  gradually ("bootstrapped") rather than created from nothing. Compare: you don''t
  need a first link for a chain to hold. (Also: partial, degree-responsibility is
  all we ever claim.)

  Move 4 (M): Strawson''s reply (in "The Impossibility of Moral Responsibility"?)—hmm,
  avoid quoting/titles. Paraphrase: Strawson considers the gradual self-creation reply
  and says it fails because any such process has to start somewhere, and the starting
  point is unchosen; "you can''t get something from nothing"; and if the starting
  point is unchosen, then no amount of subsequent shaping yields the kind of responsibility
  that could ground desert, because the shaping was itself determined by the unchosen
  start. Also, degrees: if the regress stops at any point with something not chosen,
  ultimate responsibility is zero along the chain — like a chain with one weak link.
  Hmm, careful: M should say: partial responsibility doesn''t help because the missing
  piece is ultimate sourcehood, and that doesn''t come in degrees that sum to anything:
  0 + 0 + 0... = 0.

  Move 5 (R): Fine — but then the argument proves too much. It doesn''t just refute
  compatibilism; it refutes libertarian agent-causation too, since the agent-cause
