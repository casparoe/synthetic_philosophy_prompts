  Good defeaters for the asker''s position to invite:

  1. The Gödel sentence gives you something the halting problem doesn''t: it produces
  a *specific true sentence* whose truth you can allegedly see, not just a demonstration
  that you can''t be a *sound and known* system. I.e., there''s a difference between
