  can be re-run as an argument about *idealized* mind or about *understanding* (Penrose''s
  claim about understanding being non-computable, or his appeal to the fact that we
  can see the validity of the Gödel argument itself as evidence of non-algorithmic
  insight). If the asker says "incompleteness adds nothing special," a defeater is:
  incompleteness is special because it''s *self-referential* in a way that turns the
  mechanist''s own hypothesis into a target — the argument is a reductio of a specific
  hypothesis rather than a general "look, limits."

  2. The "consistency" worry cuts both ways: mechanists typically want to say the
  human mind is *approximately* correct/veridical about logic; if mechanism implies
  we can''t trust our own logical self-assessments, does mechanism become self-undermining
  in a way that''s a cost? Also: many mechanists (e.g., those who want AI safety /
  rely on human mathematical reliability) are committed to human reliability; the
  "I can''t know I''m consistent" response is in tension with our actual mathematical
  practice, where we do believe our own proofs and even our own consistency-reports
  to a high degree.

