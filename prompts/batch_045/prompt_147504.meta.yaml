  Essay draft:


  Title: "Doxastic Credit and the Fixed Point Argument"


  §1. Diagnosing the deadlock. Both sides in the old dispute accept a common frame:
  there is a proposition P, a body of evidence E available now, and the question is
  whether it is permissible to believe P given E. Clifford''s verdict: no, never on
  insufficient evidence; the question is settled by the origin of the belief ("not
  what it was, but how he got it"). James''s reply is usually read as: for a narrow
  class of options — genuine ones, i.e. forced, living, and momentous — the insufficiency
  of evidence is itself a reason to let the passional nature decide, since abstaining
  is itself a choice that forfeits the prize.


  §2. Two moves to break the deadlock. I propose to change two things: (a) the unit
  of evaluation — from beliefs to *exposure*; (b) the time at which warrant is assessed
  — allowing *prospective* deficit with *retrospective* vindication under a repayment
  condition.


  §3. Exposure. Belief is not directly voluntary; but the management of one''s evidential
  situation is. In the shipowner case: he did not choose to believe the ship was sound;
  he chose not to have her overhauled, i.e. to arrange his epistemic environment so
  that the discomforting evidence would not arrive. The wrong is located one step
  back. And James''s cases work the same way: the mountaineer, the person who offers
  friendship, the striker... they choose to enter a situation in which the belief
  becomes available. So the ethics of belief is a special case of an ethics of doxastic
  exposure: we assess the choices by which agents arrange what they will be in a position
  to believe.


  Nice — I''ll use this to say Clifford''s own case supports the reframing: his indictment
  is about "stifling his doubts" and "knowingly and willingly worked himself into
  that frame of mind".


  §4. The fixed-point argument. Now the interesting class: propositions whose evidence
  at t depends on the distribution of belief in them at t. Call them *evidentially
  self-dependent* or *fixed-point* propositions. Examples: "the strike will hold,"
  "this currency will keep its value," "my overture of trust will be reciprocated,"
  "the norm against X will be upheld here." For these, no individual can satisfy Clifford''s
  rule: the evidence sufficient for my believing P is constituted in part by others''
  believing P, and if each of us defers to the evidence first, the fixed point we
  land on is the pessimistic one — nobody ever gets the evidence. So a community of
  scrupulous Cliffordians is systematically evidentially impoverished with respect
  to this class. Note: the argument is not the tired "sometimes wishful thinking has
  good consequences." It''s that for this class the Cliffordian demand is not even
  coherent as a universal prescription...


  Careful nuance: the friend''s objection — this is just a coordination problem; the
  right Cliffordian reply is a *conditional* rule: "believe P on insufficient evidence
  only if (and because) doing so is part of the pattern that generates the evidence"
  — but then the reason is consequentialist, and Clifford''s origin-based verdict
  ("not what it was, but how he got it") has been abandoned for these cases: a belief
  with a bad origin gets a clean bill of health because of its downstream effects.
  So the Cliffordian can accommodate the fixed-point argument only by ceasing to be
  a Cliffordian about the *class* of fixed-point propositions. That''s the sharp claim.


  §5. The dilemma for the vindication move. For fixed-point propositions, the belief
  is at best retrospectively vindicated. So the Jamesian faces a dilemma: either warrant
  must be truth-indicative *at the time of believing* — in which case the vindication
  comes too late and the belief was unjustified when held; or warrant can be earned
  after the fact — in which case you owe an account of why the "credit" is not merely
  a bookkeeping device. I want to bite the second bullet but cash it in as a norm
  rather than as a prediction: introduce **doxastic credit**.


  §6. Doxastic credit. Proposal: adopting a belief on insufficient evidence is permissible
  only if (i) the proposition is a fixed-point proposition or the option is genuine
  in James''s sense; (ii) the agent''s evidential deficit is *discharged* — she undertakes,
  at the time of adopting the belief, a plan of inquiry and a disposition to revise,
  and she is accountable for the deficit (publicly revisable, cost-bearing); (iii)
  the deficit is bounded — no credit for beliefs that close off the inquiry that would
  repay it (i.e., no credit for beliefs that reduce your own future evidential exposure).
  The last clause is what separates it from wishful thinking: the shipowner''s belief
  would flout (iii) — his "trust in Providence" was precisely a device for not looking.


  §7. Objection and partial reply. The obvious objection: credit norms create moral
  hazard — the repayment condition is unenforceable, and agents systematically underestimate
  evidential debt. Reply: the same is true of promising, and we nevertheless treat
  the norm as doing real work, partly because reputation and the revision cost supply
  enforcement. Also: the norm is meant to be a *standard of criticism*, not a decision
  procedure.


