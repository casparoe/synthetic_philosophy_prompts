  Hey, me and a friend got into it after a podcast episode and I want to settle something.
  We were talking about panpsychism — the view that the fundamental physical stuff
  has some tiny bit of experience, and the combination problem: how all those micro-experiences
  are supposed to add up to the single unified experience you''re having right now.
  My friend''s move was the wetness analogy: no individual H2O molecule is wet, put
  enough of them together and you get wetness; that''s just how emergence works, it''s
  everywhere in nature, so why is everyone acting like composition is some special
  mystery for consciousness? More specifically he used it twice: (a) to say the combination
  problem is a non-problem, and (b) to say that if you''re already fine with wetness
  you should be fine with consciousness coming from non-conscious matter, which would
  make panpsychism pointless.


  Can you audit this? I want the correspondence table — molecule, aggregate, wetness,
  "emergent", plus what''s playing the role of the water on the consciousness side
  (is a neuron the molecule? a quark? the whole brain? the experience?). Then the
  places it breaks.


  Things I want you to actually get into:


  1. Wetness is (I think) a matter of how the stuff behaves and interacts — surface
  tension, adhesion, flowing, how it feels to us — whereas the whole point of panpsychism
  is that experience is the intrinsic/categorical nature of the stuff, not a set of
  dispositions. Doesn''t that already break the mapping? Does the analogy quietly
  smuggle in a functionalist or dispositionalist picture of consciousness that the
  panpsychist is explicitly rejecting?


  2. Numbers of subjects. Water molecules don''t have perspectives. There is no "many
  little wetnesses become one wetness" problem. But panpsychism owes us an account
  of how many subjects become one subject. My friend says that''s just the hard problem
  reappearing in a new place and isn''t made worse by the analogy, but I''m not sure.
  Is the subject-summing problem even the same shape as the emergence one, or is it
  a different kind of thing entirely — a question about *counting* rather than about
  properties appearing at scale?


  3. Here''s the bit I invented and can''t stop poking at: a "grain" version of the
  analogy. Suppose the analogy were perfect and macro-experience related to micro-experiences
  the way wetness relates to molecular properties. Wetness is a property of the whole
  that you can only get at a scale where talking about individual molecules stops
  mattering; it''s a coarse-grained, statistical, threshold thing — a single molecule
  can''t be "a bit wet" and the wetness of a puddle doesn''t feel grainy. But your
  visual field right now is smooth and fine-grained and doesn''t look like it''s made
