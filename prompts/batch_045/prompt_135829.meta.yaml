  no motive, no bits repaid, and the manipulative programs sit strictly below the
  honest ones.


  Ines (2): No consequences isn''t achievable. The log is decrypted later and the
  score feeds into whether the lab keeps funding the predictor, whether the whole
  approach gets adopted elsewhere, and so on. Those are consequences the agents can
  care about. And they don''t pay anything extra for them: if they''re already simulating
  a universe containing your lab, the downstream effects of your log are in the simulation
