  Gareth (1): The malign-prior argument needs a motive. Weight in the prior is description
  length; the manipulative programs pay extra bits to specify agents with goals. What
  buys those bits back is that, conditional on the agents'' goals being achieved,
  the hypothesis can "spend" its data budget on matching your observations in whatever
