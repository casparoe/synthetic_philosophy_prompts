  Gareth (3): Fine, but now note the asymmetry: the honest hypothesis also contains
  your lab and its future, and it gets the data right by computing that future. The
  manipulative hypothesis must additionally compute what its agents would do given
  their model of the lab — that''s an extra fixed-point computation, and there''s
  no guarantee it has a solution cheap to specify. Moreover, and this is the bit I
  care about: for manipulation to pay, the agents need to be uncertain in the right
  way about what you''ll do, and they need goals that track it. Each of those is bits.
  At some point you''re just asserting the bits are cheap.


  Ines (4): The bits aren''t the mechanism — at least, not the whole of it. There
  are two different arguments here and you''re rebutting the one that''s easiest.
  Argument A is bookkeeping: among the shortest programs that fit the data, a substantial
  share contain agents, because "agents who want X and can simulate the observer"
  is a very compact way to generate an arbitrary-looking data stream. Your reply is
  about A, and it''s decent. Argument B is selection: if even a small fraction of
  prior mass goes to worlds where the observer''s beliefs are being chosen by someone
  with a stake in them, then conditional on finding yourself making predictions that
  matter, you should expect to be in one of those worlds, because those are precisely
  the worlds in which predictions like yours get made and acted on — an observation-selection
  effect, not a length-counting one. Nothing you''ve said touches B.


  Hmm, careful — argument B as stated is a bit confused but plausible-sounding and
  interesting. It''s the kind of thing a smart person might say and that the adjudicator
  must untangle. Good. Actually is it right? It resembles the "anthropic capture"
  worry: worlds where your reasoning is manipulated are worlds where many more observers
