  ESSAY NOTES


  Main thesis: Dialetheism''s much-discussed costs are logico-semantic (no detachable
  conditional, or no modus ponens in general, disjunctive syllogism under threat,
  the whole business of "classical recapture" only working in consistent contexts).
  I think the underrated cost is decision-theoretic: once you let a glutty proposition
  into the state space of a decision problem, the glut does no work. Either deliberation
  breaks, or the agent behaves exactly as if they were maximally ignorant about the
  glutty proposition — and either way the extra truth-value earns nothing. Call this
  the inertness argument.


  Step 1 (credence). Take a paraconsistent/Dialetheic setting where P is a glut: P
  is true and false. Consider an agent who knows this. In the standard accuracy framework,
  your inaccuracy at P is measured by how far your credence sits from P''s truth value;
  but P has two truth values, 1 and 0. If you score both separately and add — the
  natural move if you think a glut is genuinely both — then the inaccuracy-minimizing
  credence in P is 1/2, since (1−x)² + x² is minimized at x = 1/2. Same for ¬P, also
  1/2. So a perfectly informed dialetheist who knows P is a glut should, by the accuracy
  lights, have credence 1/2 in it. But 1/2 is exactly what the accuracy framework
  prescribes for someone with no evidence either way. The knowledge that P is both
  does no work on credence. (Possible reply I can''t fully evaluate: the dialetheist
  may reject the "score both and add" move as itself classical — adding inaccuracies
  across P and ¬P assumes the two errors are separate and both count, which a glutty
  theorist might deny or weight differently.)


  Step 2 (acts). Now decisions. Suppose acts A1...An and a partition of states, and
  suppose the only relevant uncertainty is whether P. For ordinary cases EU(A) = cr(P)u(A,P)
  + cr(¬P)u(A,¬P), and with cr(P)=cr(¬P)=1/2 you get the agent who is maximally uncertain.
  So: if you want a decision rule at all in the presence of a glut, the one that comes
  out of step 1 treats the glut as ignorance. Alternatively you can try to preserve
  the idea that P is true (and ¬P true) and evaluate the act twice — once taking P
  as true, once taking ¬P as true — and then combine: maximin over the two evaluations,
  or average them. But averaging just returns the 1/2 case, and maximin is what a
  paranoid agent with no probability information would do. Whichever you pick, the
  resulting advice is indistinguishable from the advice you''d give someone who has
  no idea whether P. Inertness again.


  Step 3 (why this bites, and where it doesn''t). Not all gluts are equal. "Unmanageable"
  gluts — the liar-ish, set-theoretic, inclosure-schema ones — never show up in practical
  deliberation: nobody''s decision problem has a cell for "this very sentence is not
  true." So for those, inertness is harmless; the dialetheist can shrug. The costly
  case is the "manageable" gluts: vagueness. If "is a heap", "is over 18 (for a borderline-aged
  person at the stroke of midnight?)" hmm — better: borderline cases of "tall", "vehicle",
  "person" (early fetus / brain-dead patient), or legal thresholds. Take a rule like
  "no vehicles in the park," and a borderline case (an e-scooter, whatever). If the
  predication is glutty, then — assuming the deontic claim inherits the glut in the
  usual way — the agent is both permitted and not permitted. Now the agent faces exactly
  the step-2 situation, at the exact moment they need guidance, and the dialetheist''s
  machinery gives them the same advice as total ignorance. That''s where the cash
  value question lands: what is "both true and false" buying us, in the one class
  of cases where it was supposed to buy something?


  Step 4 (the reply I''m most worried about). The obvious dialetheist move is to let
  the practical verdict itself be glutty: A1 is both choice-worthy and not choice-worthy,
  and that''s not a breakdown, it''s just another true contradiction — pick either,
  or pick arbitrarily, no one is criticizing you either way. I want to say this is
  worse than it looks: (i) it makes deliberation pointless in exactly the cases that
  triggered the theory (we wanted a story about borderline cases that does some work);
  (ii) it''s unstable with the normative role of "ought" — if both "do A" and "don''t
  do A" are true, then "you''re blameworthy either way" threatens to be true too,
