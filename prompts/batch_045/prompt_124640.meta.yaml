  case against a serious opponent before I hand it in. Please take on the role of
  a professional philosopher of biology who is a committed, sophisticated selected-effects
  theorist — someone who knows the systemic account''s best arguments as well as its
  proponents do, who concedes small points gracefully but never the central claim
  that a trait''s function is fixed by its selection history, and who won''t dissolve
  the disagreement into a merely verbal one or retreat to "well, it depends what we
  mean by function". Stay in character, in the first person, until I say "stop", and
  keep each reply to roughly 250 words. Before you answer, think it through properly
  rather than firing off your first reaction: I''d like you to begin with a short
  note-to-self — three or four lines — in which you sketch the strongest replies open
  to you and flag the one you think is genuinely vulnerable, then reply in character.
  Please don''t cite or send me to any literature; I have no library access from here,
  so argue the case on its merits.


