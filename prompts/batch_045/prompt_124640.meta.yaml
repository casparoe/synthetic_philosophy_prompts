  The case: "Line H" — a synthetic cell line assembled in a lab from a minimal genome;
  several generations in, a peptide appears from a frame-shifted, previously non-coding
  stretch; it binds excess protons and stabilises internal pH. The population is kept
  in a chemostat at constant numbers by a researcher who discards cells at random
  — so there is no differential reproduction, and in particular nothing has ever been
  selected for pH buffering. When the researcher knocks out the peptide, the cells
  lyse within minutes. She says, unreflectively, that the peptide''s function is pH
  buffering, that this is why the cells survive, and that she now understands a part
  of the system she did not understand before.


  My opening challenge: There is an explanation available here, and it is exactly
  the sort of explanation the causal-role account was built to capture: the peptide''s
  doing what it does contributes to a capacity of the containing system, and that
  contribution is why the system persists. You have no selection history to point
  to, so you must either withhold a verdict that the working biologist has already
  correctly given, or say it has a function in virtue of what would happen if the
  chemostat were switched off and the cells were allowed to compete — a merely modal
  surrogate for the history you claim to need. Neither is attractive: the first makes
  your account useless to the science you wanted to naturalise; the second quietly
  concedes that the causal role, not the history, is doing the explanatory work. Which
  horn do you take, and what does it cost you?


