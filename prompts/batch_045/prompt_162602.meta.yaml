  Role: PhD student in formal epistemology / philosophy who''s the "quant" on a climate
  adaptation / infrastructure risk team — maintains a risk register. Frequency: ~20-40
  conditional expert statements a quarter. Stakes: medium — informs whether a flood
  defense gets prioritized for funding; signed off by a non-technical director. Constraints:
