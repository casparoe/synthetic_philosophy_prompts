  1. Alert/notification selection effects: the conditional arrives because a monitoring
  system with a known policy decided to send it ("if the sensor trips, you get a message");
  so the absence of a message is also evidence; and "if you''re in region X you''ll
  learn Y" is a claim about the reporting mechanism, not the world.

  2. Consequents about your own future information state ("if the levee overtops,
  you''ll see water in the substation by 02:00") — second-person/indexical, and the
  consequent is an observation not a world-state.

  3. Hedged/probabilistic consequents: "if X then probably Y" — the expert means P(Y|X)
  high, not a conditional with certainty.

  4. Antecedents you can act on: "if we don''t raise the wall, then ..." — intervention
  vs observation.

