  Reflection principle (van Fraassen): Let P_t be your credence at t, P_{t''} at a
  later time. Reflection: P_t(A | P_{t''}(A) = x) = x, for all x such that P_t(P_{t''}(A)
  = x) > 0. That is, conditional on your later credence in A being x, your current
  credence in A should be x.


  A consequence (given otherwise-satisfied assumptions): P_t(A) = Σ_x x · P_t(P_{t''}(A)
  = x), i.e., current credence = expected future credence — this "martingale" property
  follows from Reflection plus... hmm, actually it follows from Reflection plus the
  claim that the P_{t''}(A)=x partition is a partition with total probability 1 —
  then by total probability: P_t(A) = Σ_x P_t(A | P_{t''}(A)=x) P_t(P_{t''}(A)=x)
  = Σ_x x P_t(...). Yes, so current credence = expected future credence follows from
  Reflection by the law of total probability. That''s the martingale property — van
  Fraassen discusses this; and it''s connected to "the expected value of future credence
