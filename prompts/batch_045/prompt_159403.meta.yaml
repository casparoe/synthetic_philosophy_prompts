  ---


  I''m giving the commencement address at next month''s graduation of the prison education
  program I''ve directed for eleven years, and I''d like you to write it.


  The setting is a visiting room inside a maximum-security state prison. Forty graduates
  in prison blues; a hundred or so family members, many of them children; the warden;
  the commissioner of corrections; a dozen correctional officers, some there on duty
  and some because over the years they''ve come to respect the program; and two Norwegian
  corrections officials the commissioner has flown in. He wants to use the ceremony
  to announce that the department will build a Halden-style unit, and he would like
  my speech to showcase the department''s rehabilitative turn. Roughly a third of
  the graduates are serving life without parole.


  The difficulty I keep circling is one I''ve started calling the ratification problem.
  When a captive population''s achievement is displayed by the authority that confines
  it, praise of the achievement is converted into evidence that the confinement is
  humane, and the ceremony quietly becomes a license the graduates are being made
  to sign on their own behalf. I need a way of honoring what they did that doesn''t
  sign for them.


  Concretely:


  - Nothing false and nothing borrowed. Not "you are free now," not "you''ve transformed,"
  not "you''ve paid your debt," not "you''re role models" — for the third of the room
  who will die inside, each of those is either false or is a claim about the institution
  rather than about them.

  - No reentry rhetoric: no second chances, no "when you get out," no recidivism statistics.
  I want an account of what the degree is for that stays true for someone who will
  never be released — and that therefore isn''t rehabilitation in the sense the department
  means, where rehabilitation just means lower recidivism.

  - The Halden-style wing is genuinely better and I don''t want to give the commissioner
  grounds to cancel it or the officers grounds to hear me calling them sadists — several
  of them have said privately that a unit nicer than their own neighborhoods is an
  insult. But the speech can''t be the department''s exhibit either.

  - Mixed room: I want at least one line that lands for the officers and one that
  lands for the graduates'' children, and no academic vocabulary anywhere. The argument
  should still be philosophical: what punishment is owed — the sentence is the deprivation
  of liberty, not of everything else — and what a prison owes the people it holds.


  Write a seven-to-eight-minute address that ends on something true rather than something
  rousing. Give me the speech itself first, with no preface or commentary before it;
  after it, no more than 250 words on which lines were the concessions to the officers
  and to the families, and what each concession cost.


