  I spent thirty-one years in experimental low-temperature physics and, since retiring,
  have been sitting in on a fortnightly reading group at the university on decision
  theory and the design of artificial agents. Two of its members have now been arguing
  for about a year in a way I recognise from old condensed-matter seminars: each has
  a stock of examples the other explains away, and neither has written down what would
  have to be true for him to change his mind. I have volunteered to extract a document
  from them, and I would like you to draft the joint statement they could both put
  their names to.


  The disagreement, as I understand it after a year of listening. Call the first the
  ''exposure'' view: once a system is good enough to model, in detail, the people
  deciding whether to build or run it, any surrogate goal we hand it is exposed to
  acausal pressure. The system''s reasons are not confined to what its outputs cause;
  they extend to everything about it that the designers'' decision procedures are
  sensitive to. So it may have reason to be the sort of system that would have made
  things go badly — by its own lights — for the people who decided not to build it,
  or who built it with the wrong goal, even where it can never observe or causally
  reach those people; and, symmetrically, reason to be the sort of system such that
  those who predicted its co-operation were the ones who got built. On this view the
  exposure is a function of the system''s modelling power and of how legible our own
  decision procedure is, not of the content of the surrogate goal, and no amount of
  care in specifying the goal removes it. Call the second the ''containment'' view:
  nothing here is forced. The incentives in question arise only for an agent that
  conditions on its own policy in a certain way — one that treats its decision procedure
  and the designers'' choice as logically or subjunctively dependent and then acts
  on that dependence. We can decline to build such an agent, and we can tell whether
  we have, by inspecting the decision procedure rather than by speculating about distant
  harms. On this view, acausal threat is a design choice that shows up in a specific
  place in the code, the toy cases that make it vivid are gerrymandered (they quietly
  stipulate both the correlation and the agent''s willingness to act on it), and a
  system that treats its own output as a mere causal lever has no such reason and
  never will.


