  \ under full information\" (Smith's ideal advisor / Railton's ideal advisor / Brandt's\
  \ cognitive psychotherapy); Parfit's internalism vs externalism distinction (Parfit\
  \ in \"On What Matters\" distinguishes \"reasons internalism\" = reasons are provided\
  \ by desires/aims vs externalism = reasons provided by facts about values); also\
  \ \"constitutivism\" (Korsgaard) is sometimes classified as a form of internalism\
