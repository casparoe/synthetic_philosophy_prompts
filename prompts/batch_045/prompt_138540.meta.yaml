  Question (draft):

  "Keynes held both that the economic problem is not the permanent problem of the
  human race and that, once it is solved, humanity faces its real difficulty: learning
  how to live well without the spur of economic necessity. Two readings of what ''living
  well'' amounts to for him can be distinguished. Call them the Conversion Reading:
  the motivational energy formerly spent on money-making is to be redirected to intrinsically
  worthwhile activities (art, friendship, knowledge), so that the good life is continuous
  with the striving, differently aimed. Call them the Abstention Reading: the point
  of abundance is that activity no longer needs to be justified by its product; the
  good life consists in states of mind—contemplative, affectionate, aesthetic—enjoyed
  for their own sake, and the virtue of the fifteen-hour week is that it releases
  us from the need to justify our time by what it produces.


  (a) Which of these two readings is better supported by Keynes''s distinction between
  needs that are absolute (satiable) and needs that are relative (insatiable, and
  satisfiable only if others go without), together with his Bloomsbury inheritance
  from Moore—that what matters is states of mind rather than consequences? (8 marks)


  (b) Keynes himself concedes that people have been ''trained too long to strive and
  not to enjoy'' [paraphrase], and in the late memoir-essay on his early beliefs he
  criticises his younger self and his friends for having over-rated the power of reason
  and under-rated the role of habit, convention and tradition in making a decent life
  possible. Does this later self-criticism support or undermine the program of the
  earlier essay? Answer with reference to the reading you defended in (a). (7 marks)


