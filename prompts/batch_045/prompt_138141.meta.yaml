  I write literary fiction, and I am at an impasse over one chapter, which no amount
  of craft on my part seems able to settle, because the objection raised against it
  is not really about craft.


  My manuscript''s narrator, Anne, has been blind from birth and, until she was thirty-one,
  lived in a single room whose only furnishings were books, supplied to her in Braille.
  She learned her whole vocabulary from a dictionary and a set of encyclopedias. She
  has never seen color, and she corresponded with no one. In the closing chapter she
  writes a long passage describing a red coat laid on a chair in borrowed afternoon
  light — a passage cobbled, I should say honestly, out of everything the encyclopedias
  told her about red: that it sits next to orange rather than green, that it is the
  color of blood and of stop-signs and of foxes, that it has the longest wavelength
  of the visible spectrum, that it is used to signal danger, that certain painters
  mixed it from madder.


  My editor''s report is blunt: no one who has never seen red means anything by the
  word red, so the passage is a machine stitching other people''s sentences together,
  and it should be cut or reassigned to a sighted character. My own feeling is that
  the objection proves too much, and I would like to know whether it does, before
  I cut two years of work.


  Three things complicate it for me, and I would be grateful for your help with each.


  First, I have been toying with a device. Suppose Anne is given an instrument that
  converts the dominant wavelength of whatever she points it at into an audible tone,
  so that she can in some sense hear that the coat is red and the chair is not. My
  worry is that this changes nothing: a tone is no more red than a word is, and she
  would simply have one more symbol to look up in a table. But I cannot tell whether
  that worry is deep or merely stubborn.


  Second, my early readers weep over the passage. They are sighted, they have seen
  red, and they appear to take something from it. I do not know whether their understanding
  can lend her words a content they would not otherwise have, or whether it only shows
  that a reader can always supply the missing thing for himself.


  Third, my editor raises no objection at all when Anne uses words like electron,
  justice, or sincere — terms for which nobody, sighted or not, has the sort of acquaintance
  he seems to be demanding for red. I suspect he owes me an account of those, and
  I suspect that account will either rescue red or ruin half the language.


  So: is the chapter defensible? What exactly is missing from Anne, if anything is
  — and is it missing from the rest of us too? And what would I have to change, in
  the scene or in the conceit, for the passage to be something more than a machine
  stitching sentences together?


