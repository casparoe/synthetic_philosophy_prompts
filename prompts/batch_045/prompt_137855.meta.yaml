  a law or policy is legitimate (or at any rate is answerable to the right standard)
  only if it gives effect to the will of the people.

  (2) To give effect to a will, there has to be a will to give effect to. If there''s
  no fact of the matter about what the people wills on some question, nothing can
  count as giving effect to it on that question.

  (3) The people''s will isn''t a free-floating entity; it''s got to be determined
