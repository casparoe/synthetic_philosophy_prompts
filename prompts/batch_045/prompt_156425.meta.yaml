  I sit on the clinical ethics committee of a mid-sized teaching hospital, and a case
  from last month has left me unable to hear a certain sentence without wanting to
  interrupt. The patient was an eighty-two-year-old woman with advanced Alzheimer''s
  disease: minimally responsive, no longer recognising anyone, no living family, no
  visitors for something like two years, all of her care delivered by rotating agency
  staff who never knew her before her illness. The question was whether to transfer
  her for aggressive treatment of aspiration pneumonia and start tube feeding, or
  to manage her palliatively. One member of the committee, a geriatrician who brings
  a certain amount of African philosophy into our meetings, ended the discussion with
  the line a person is a person through other persons, and then drew his conclusion
  in a single step: she is a person to the extent that we are in relation with her,
  so we cannot quietly downgrade her standing by pointing to her solitude. I said
  that on that same principle she has become steadily less of a person as her visitors
  stopped coming and her chart became the only thing that mentions her, and he said
  I had misunderstood him; but neither of us could say what precise claim the sentence
  was making, and the meeting ended with the vote split along exactly that fault line.


  What I want from you is a menu, not a verdict. Set out the distinct theses that
  sentence could be expressing — the trivial and the radical ones both — and for each
  say whether it is a platitude about how human beings develop, a substantive metaphysical
  claim about what personhood consists in, a claim about a social status conferred
  (and conceivably withdrawn) by recognition, a claim about self-conception and identity,
  a claim about what we owe each other, an evidential or epistemic claim about how
  we come to know that someone is a person, or something else again. I have tried
  to sort the options myself along three axes and keep getting stuck: whether the
  dependence on relations is constitutive or merely causal; whether the relation that
  matters runs from the person to others, from others to the person, or must be mutual;
  and whether what is at stake is moral status or something more like identity and
  self-understanding. Use those axes if they help, replace them if they don''t. In
  particular I want the parameters made explicit: whose relating counts (a community,
  one other person, an institution, the dead, someone hostile), what has to pass between
  the parties (care, recognition, the possibility of address and response, mere causal
  interdependence, someone holding a file with your name on it), whether the relation
  must be current or whether being remembered is enough, and whether the view makes
  personhood scalar so that standing can come in degrees.


  Then put the readings to work on the case, and on some probes I have been using
  to test my own intuitions: a child raised with no human contact and brought into
  a clinic at fifteen; a hermit who has chosen solitude for forty years; a prisoner
  in long-term solitary confinement; the last surviving speaker of a language, whose
  entire community is dead; a newborn infant; a patient in a persistent vegetative
  state with a large and devoted family; and a conversational AI system that thousands
