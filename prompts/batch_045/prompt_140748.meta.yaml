  universe / Rietdijk-Putnam. The Rietdijk–Putnam argument (also called Andromeda
  paradox) argues that special relativity implies eternalism/block universe because
  for any two events judged simultaneous by one observer, there are observers for
  whom one is in the past and one in the future; specifically, if two spatially separated
  events are simultaneous in your frame, another inertial frame can see them as temporally
  ordered, and by moving appropriately, an observer here on Earth can have a simultaneity
  slice that includes your "now" and a distant civilization''s "future" event (like
  an Andromedan invasion fleet launching). Putnam''s version uses the relativity of
  simultaneity to argue that all events (past, present, future) are equally real because
  each event is present for some observer. Rietdijk and Putnam argued this undermines
  the distinction between past, present, and future, supporting a block universe (eternalism).
