  Content plan:

  - Setup: I help run an informal film-and-philosophy group; we''re doing Everything
  Everywhere All at Once (2022, Kwan and Scheinert). I''ve been reading on my own
  about modal metaphysics and got stuck on counterpart theory vs transworld identity.

  - The reading: treat the film as a dramatisation of the choice between them. Other-verse
  Evelyns: are they her (transworld identity) or merely counterparts? Consider: (a)
  verse-jumping — a single consciousness occupying other bodies — looks like transworld
  identity of the subject; (b) the film''s insistence that other Evelyns made different
  choices and flourished (kung fu film star) — that''s counterpart-friendly; (c) the
  Lewisian point: since Lewis''s other worlds are concrete, the film''s multiverse
  is arguably closer to Lewis''s own ontology than to an abstract "ways the world
  might have been" picture — but Lewis still needs the counterpart relation because
  individuals are world-bound, so even a concrete multiverse doesn''t give you identity
  across verses. Ask whether the film''s multiverse is best read as Lewisian (worlds
  equally concrete, "actual" indexical) or as a branching single world.

  - My own injected distinctions: (i) "modal despair" (everything I might have done
  is possible, so my actual choice is arbitrary) vs "realised-plenitude despair" (every
  possibility is somewhere actually lived, so nothing I do matters) — Jobu Tupaki''s
  bagel-nihilism: which is it, and does counterpart theory defuse only one? (ii) the
  relativity worry — Evelyn''s counterparts differ wildly (kung fu star, hot-dog-fingered
  chef, rock), so the counterpart relation can''t be straight intrinsic similarity;
  what is doing the tracking — role in a narrative, psychological continuity, or just
  being named Evelyn? And if counterpart-hood is interest-relative, does the film''s
  claim that this Evelyn is "the greatest failure of all Evelyns" even make sense?
  (iii) the identity of the observer/stipulation: Alpha-Waymond calls her the failure
  among all Evelyns — but on counterpart theory, "she" is not the one who failed...
  hmm, careful: Alpha-Waymond says Evelyn is the greatest failure of all Evelyns,
  i.e., in this universe she has the most unrealised potential. That''s comparative
  across counterparts — fine, and it''s counterpart-friendly actually.

  - Where the work resists: the film''s resolution — Waymond''s plea for kindness,
  the googly eyes, Evelyn choosing this Waymond and this Joy — is emotionally powerful
