  I''m a backend engineer with no philosophy background, and I ended up here through
  a side project. A few of us at work built a small tournament harness for a variant
  of the centipede game: two agents alternate, each either taking (which grabs the
  larger share of the pot and ends the game) or passing (which grows the pot and hands
  the choice to the other agent), for 100 rounds. We mostly run prompt-based LLM agents
  against each other, and almost all of them pass for the first ten to twenty rounds
  before someone takes. My own solver is just backward induction over the game tree,
  and it returns take at the root. As far as I can tell that argument is nothing but
  mathematical induction over a finite object, so it is as reliable as anything I
  trust in my day job — which is why I have been treating every observed pass as a
  defect: either the model cannot carry the recursion deep enough, or it is pattern-matching
  on cooperation norms in its training data. Either way it is noise, and the engineering
  conclusion I drew is to hard-code take-at-node-one and stop spending money on tournaments.


  What I cannot square is the self-play case. If I ship two instances of the same
  binary against each other, the induction looks stronger, not weaker, since each
  copy knows exactly what the other will do, so take-at-node-one should be completely
  uncontroversial there — and yet it feels like throwing away ninety-nine rounds of
  free pot growth for no reason. A friend suggested what she called a program-equilibrium
  trick: let each agent inspect the other''s source before the first move and pass
  conditionally on what it finds. I do not see how that can matter; if the induction
  is a valid proof, then no pre-game handshake changes what is rational once play
  has actually begun, and a handshake that changes your move is just a way of being
  irrational on purpose.


  So my questions: is there any defensible sense in which passing is rational here,
  or is the honest answer that the proof wins and my agents are simply broken? If
  it is the latter, why does anyone treat this as a paradox rather than as a psychological
  finding about people — isn''t take-at-node-one being the unique subgame-perfect
  equilibrium the entire content of the result? And does the particular structure
  I chose matter at all? In my version the pot roughly doubles on every pass, and
  I added a 1% chance per round that the game simply terminates with the current player
  getting nothing. My intuition is that backward induction washes out details like
  that, the way a compiler folds away constants, but I would like to know whether
  the payoff schedule or the termination rule can actually change what the induction
  delivers. (One more thing: someone told me this is connected to the surprise-exam
  paradox, which I cannot see at all — that is a puzzle about self-reference, and
  my game has concrete dollar payoffs.)


