  "Question 3 (moral dilemmas). Distinguish carefully between (i) a merely epistemic
  conflict, (ii) a conflict resolved by weighing (where one requirement overrides
  the other), and (iii) what its defenders call a genuine, irresolvable moral dilemma.
  Consider the following argument against the possibility of (iii):


  (1) If S ought to do A, then S can do A. [ought-implies-can]

  (2) In a putative genuine dilemma, S ought to do A and S ought to do B.

  (3) But S cannot do both A and B.

  (4) Therefore, if (1)-(3) hold, the situation is inconsistent: so genuine dilemmas
  are impossible.


  (a) Is the argument as stated valid? If not, state the additional premise it needs,
  and say which premise a defender of genuine dilemmas is most likely to reject and
  why. (b) Suppose that defender is right that genuine dilemmas are possible. Does
  it follow that the agent who does A has no reason to feel any residual regret, or
  that the requirement to do B was merely apparent? Explain the distinction between
  an overridden requirement and an unfulfilled one, and say what follows about the
  rationality of regret. (c) Finally: a critic says the whole debate is verbal — ''ought''
  just means ''what there is decisive reason to do,'' and there cannot be decisive
  reason for each of two incompossible acts. Assess this response."


