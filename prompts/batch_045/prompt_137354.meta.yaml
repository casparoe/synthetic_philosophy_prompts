  Ruth Barcan Marcus, "Moral Dilemmas and Consistency" (1980). She argued that the
  notion of moral dilemma can be consistent. She considers a "principle of conjunction"
  or the "agglomeration principle": If one ought to do A and one ought to do B, then
  one ought to do A and B. Rejecting agglomeration allows for consistency. She rejected
  the principle that "if you ought to do A, and if you don''t do A you ought to do
  B as a substitute/alternative..." Hmm.


  Actually the Marcus derivation: Assume (1) Ought(A), (2) Ought(B), (3) Cannot do
  both A and B: ~(possible (A&B)). Then from "ought implies can" (Ought(A&B) → Possible(A&B))
  and agglomeration (Ought(A) & Ought(B) → Ought(A&B)), we get Possible(A&B), contradiction
  with (3). Marcus rejects agglomeration, arguing that the "ought" statements should
  be understood as disjunctive: one ought to do A or B (where the "or" is not distributive).
  She defended the consistency of moral dilemmas by denying the principle that obligations
  conjoin — she held that "ought" is quantified over something like the "practical
  modality" — she suggested obligations are "disjunctively" satisfied.


  Also Bernard Williams''s "Ethical Consistency" (1965) argued against the consistency
  of dilemmas... Actually Williams argued that there''s a genuine conflict and the
  remainder (regret) is appropriate; he rejected the idea that one of the conflicting
  obligations is overridden ("the moral cost" remains). Williams''s "Ethical Consistency"
  criticized the "consistency" views and argued that moral conflict resolution leaves
  regret as rational.


