  Candidate phenomenon (call it "P"):

  In administrative/policy disputes, a disagreement turns on whether a term applies.
  The disputants agree on: all empirical facts, and all the consequences that legally/policy-wise
  follow from each classification. They also agree, when asked, that the term''s application
  isn''t settled by statute or precedent. Yet each insists the other is substantively
  wrong — not merely inconveniently worded — and neither will accept a stipulation
  ("let''s call it X for the purposes of this document"), because each thinks the
  right answer is determined by what the thing "really is," independently of any decision
  we make. And crucially: unlike an ordinary verbal dispute (where you''d expect the
  parties to dissolve the disagreement once they see they''re using words differently),
  pointing out the agreement on consequences doesn''t dissolve it — it makes them
  angrier. But also unlike a "merely" normative disagreement, neither side can produce
  a consequence that turns on it within the case; the stakes are entirely *downstream*:
  whichever label wins will be reused in future cases where consequences do diverge.


  So P is: a dispute that is verbal in the sense that nothing within the case turns
  on it, but is not dissolvable by the standard verbal-dispute move, because the object
  of the dispute is which classification to entrench for future use, and both sides
  think entrenchment is answerable to something non-conventional.


