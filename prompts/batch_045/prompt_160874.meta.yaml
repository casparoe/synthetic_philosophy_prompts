  ---


  I work as a legal adviser in the social-security department of a mid-sized government;
  I draft internal guidance and sit occasionally with the first-tier tribunal. Over
  the last few years I have noticed a pattern in the disputes that come before me,
  and I would like to know whether it has a name. I am not looking for a label as
  such — I want to know what, exactly, the thing is, where its edges lie, and what
  it is not.


  The pattern. Two parties disagree about whether a classificatory term applies to
  a case. When you press them, they turn out to agree on every fact of the case and
  on every consequence that the case itself will have: the same money is paid to the
  same person, the same procedure is followed, the same practical outcome follows
  whichever way the classification goes. They will usually also concede that no statute,
  rule, or precedent settles the classification. Yet neither experiences the disagreement
  as a choice. Both insist that the other has the matter wrong, in the way one has
  a matter wrong about the world, and both become notably more emphatic, not less,
  when it is pointed out to them that nothing in the case turns on it. Proposing that
  we simply stipulate a usage for the purposes of the document tends to be treated
  as evasive.


  What is at stake is not nothing, but it is not in the case either. Both sides know
  that the classification will be carried forward and reused in later cases where
  consequences do diverge, and that the term carries with it a settled set of downstream
  inferences. That is what they are arguing about, even though neither will describe
  it that way.


  Three instances: [sanction vs condition; fraud vs error; workfare placement as work
  vs training]


  Why I don''t think the obvious diagnosis fits: [not mere different senses; the parties
