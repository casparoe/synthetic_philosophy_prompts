  I teach a seminar on moral progress, and I want to use one sentence as a first-day
  precisification exercise. The sentence is the old line "the arc of the moral universe
  is long, but it bends toward justice." I met it doing real work at a department
  meeting last month: a colleague in political theory used it to close an argument
  about whether we should sign a statement backing a student occupation, and she got
  two conclusions out of it — that the students'' demands will look obviously just
  in fifty years, and that this future verdict is itself a reason to back them now.
  I want to hand my students a menu, not a reading.


  So: what are the distinct precise theses that sentence could be stating, ordered
  roughly from trivial to wild, with a verdict on each? I want a few things kept apart
