  ---


  So I''ve somehow ended up as one of two editors-in-chief of a mid-sized philosophy
  journal, and I need something usable out of a pair of puzzles I normally only teach.


  The flow: we get maybe forty matters-arising / errata submissions a year — someone
  writes in saying that a published paper got something wrong, or that its central
  argument depends on a claim that''s false. For each one I have to decide, inside
  about ten days, between doing nothing, publishing the note, asking for a reply first,
  issuing an expression of concern, or (rarely) retracting. I read maybe half of them
  myself; the rest get triaged by a rotating associate editor and by our managing
  editor, who is extremely good and has no philosophy training at all. Every decision
  eventually needs both me and the co-editor to sign off, and it has to be explainable
  to the original author in a single paragraph. Our publisher has boilerplate for
  retractions and expressions of concern that I can''t really edit, and there''s a
  small amount of legal exposure, so I''d rather not say anything I can''t stand behind.


  What I want is a decision procedure my team can actually run on one of these, built
  out of the epistemology of the lottery and the preface. The thing I keep running
  into is: for each individual claim in a note, I''m comfortably above whatever threshold
  for "we accept this" — call it, I''d take even money, or the Lockean thing where
  you count as believing p once your credence clears some fixed bar short of 1 — and
  yet I know perfectly well that across the four hundred or so claims we act on in
  a year, several are wrong. And conversely, a note that needs three claims all to
  be true to have any force at all is in worse shape than any of the three taken alone,
  which I don''t think my team is tracking. And then there''s the signature problem:
  the boilerplate wants me to affirm that the editors have verified the correction,
  and I can''t affirm the conjunction even when I''d affirm every conjunct.


  Please don''t give me a literature review or names and dates; I''ve read the stuff,
  and I need something to hand to a managing editor on a Monday. What I want:


  - The questions in order, with what counts as a sufficient answer to each, and where
  the procedure just stops with a no.

  - It has to work with coarse confidence language — my managing editor will not give
  me a number — and it has to say what to do when the information simply isn''t available
  (author doesn''t reply, the disputed claim is interpretive and can''t be checked
  at all).

  - It has to distinguish, because I think this matters and I don''t trust myself
  to keep it straight: risk that''s spread flat and independent across a set, so there''s
  no way to point at where the error is; risk that''s clustered in a part I can name
  (a formal appendix, a historical section), so the second-order belief is actually
  actionable; and risk where several suspect claims all hang off one shared step,
  so their failures aren''t independent at all. My sense is those three want genuinely
  different responses and that two of them are the ones the paradoxes are usually
  about, but tell me if I''m wrong.

  - Asymmetric stakes: publishing a correction that turns out to be wrong does more
  damage than sitting on one that''s right, and a retraction is basically irreversible
  in a way a published note isn''t. I want that in the procedure, not bolted on.

  - Mark explicitly the points where the question is one of values and has to come
  to me or the co-editor rather than being settled by the procedure — how much we
  care about a first-time author''s record, say.

  - And tell me what it can''t do. I already know the cheap move is to print a blanket
  caveat on everything; I want to know when that''s actually the right output and
  when it''s just noise that makes us look careful.


  Then run it on three, please:

  1. A note arguing that a well-known paper''s central argument fails, where the argument
  only fails if all three of the note''s sub-claims hold, and each one looks individually
  likely but none is checkable — it''s interpretive.

  2. A claim that a figure in a paper by a first-time author is mislabeled. Probably
  checkable, but the author hasn''t replied inside the window.

