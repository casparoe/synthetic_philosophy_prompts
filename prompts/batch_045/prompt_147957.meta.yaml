  Paragraph 1: Set up the episode and the framing. Supply facts: date, question, results,
  turnout, franchise (residence-based, EU/Commonwealth citizens resident in Scotland,
  16-17 year olds first time, ~4.3m electorate, Scots resident elsewhere in UK excluded,
  rump UK did not vote, referendum authorized by 2012 agreement between Scottish and
  UK governments + 2013 Act). Ask: run the case through the boundary problem — the
  criteria: all-affected-interests, all-subjected-to-coercion (prospective subjection
  to the laws of the successor states), constitutive/self-determination (a "people"
  with a right to constitute itself), and maybe brute residence/civic connection.
  For each criterion, say what franchise it would have generated and what it says
  about (i) Scots resident in England/Wales, (ii) EU citizens resident in Scotland,
  (iii) 16-17 year olds and, more awkwardly, those below 16 and those not yet born,
  (iv) whether the other nations of the UK should have voted at all. Where the actual
  franchise matches/diverges, and which criterion best explains the actual choice.


  Paragraph 2: Reverse direction + two novelties. (a) Endogeneity/selection: the franchise
  was itself chosen by interested parties (the Scottish Government drafted and the
  Scottish Parliament passed the Act, with UK consent), and the choice plausibly tilted
  the outcome — the boundary problem literature asks which demos is *correct* but
  seems to have little to say about a demos chosen by a side in the dispute. What
  does the episode show about that? (b) My proposed condition: "the reconstitution
  test" — a polity''s demos is entitled to dissolve a union only if the same demos,
  similarly constituted, would be competent to reconstitute it; and where the passage
  of time changes the demos (deaths, new 16-year-olds, in-migration), a decision by
  an earlier demos fails the test unless the decision is revisable. Ask whether this
  is genuinely new or just restates a known criterion; whether it solves endogeneity
  or just relocates it; and where it yields verdicts we should reject (e.g., decisions
  that are irreversible in fact but legitimate: American colonies 1776? the secession
  of the Irish Free State? also unilateral declarations). Also note the "once in a
  generation" political claim vs. no legal entrenchment.


  Paragraph 3: Discipline requirements — name the players/options/evidence; say where
  the theory is silent; don''t give me slogans about self-determination or a survey
  of literature; no citations/reading lists (can''t look things up); 800-ish words?
  Should I specify length? The asker can ask for a particular length — I''ll say "I''d
  rather have 700 careful words than a survey."


