  so it looks like there''s no room for genuine chance, and the challenge is to explain
  why our credences should track the squared amplitudes rather than, say, the branch
  count—but a couple of us got stuck on something that I realize I can''t articulate
  cleanly.


  Here is the nub of it. Consider a spin measurement on a particle prepared so that
  the amplitude for ''up'' is sqrt(1/3) and the amplitude for ''down'' is sqrt(2/3).
  A naive ''branch counter'' would assign credence 1/2 to each outcome, which gets
  the wrong answer; the Born rule assigns 1/3 and 2/3. So far so good. Now suppose
  someone proposes replacing the Born rule with a ''cubic rule'', on which the weight
  of a branch is the cube of the absolute value of its amplitude (normalized). I want
  to say two things and I''m not sure I can defend either: first, that even if we
  simply stipulated the cubic rule, we would not have solved the Born rule problem,
  because the problem is not really about which exponent appears but about what it
  even means to talk about probability in a theory in which nothing is left to chance;
  and second, that the cubic rule is not even a coherent candidate, because unlike
  the sum of the squared amplitudes the sum of the cubes is not preserved under unitary
  time evolution and is not invariant under a change of basis, so it would make an
  agent''s credences depend on which decomposition of the universal wavefunction we
  choose to call ''the branches''.


  Could you give a careful, advanced-level explanation of why (or whether) I''m right
  on both counts? In particular, I''d like you to (a) explain, using the sqrt(1/3)/sqrt(2/3)
  example and then a second measurement performed on the ''up'' branch alone that
  splits it into two equal-amplitude sub-branches, exactly how the Born rule and the
  cubic rule come apart in the predicted weights of the final branches; (b) explain
  why the failure of the cubic rule to be basis-independent is not just a technical
  nuisance but goes to the heart of why the squared-amplitude measure is the only
  one that can even be a candidate for a probability rule in this setting; and (c)
  say what remains of the Born rule problem once we grant that—i.e., what exactly
