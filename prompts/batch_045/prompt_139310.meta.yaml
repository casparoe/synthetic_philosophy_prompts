  view of desert-talk", maybe attributed to "a poster on the forums, I''ll call it
  the cached-heuristic view"). Say: "I put to them a view I''ve seen floating around
  the rationalist blogs, which I''ll call the ''compression view'': ..." Let me define:


  "The compression view: when ordinary people (and judges) say ''he deserves five
  years,'' the judgment that''s actually doing the work is a lossy compression of
  (a) an implicit estimate of future dangerousness, (b) the general-deterrence value
  of a sanction of that size, (c) the denunciatory/expressive effect on the community,
  and (d) a residue that isn''t forward-looking at all: a judgment about the quality
  of will the agent manifested in acting. The compression is ''lossy'' in the sense
  that the four strands can''t be recovered from the desert judgment, and they can
  come apart — e.g. someone whose will was rotten but who is now clearly harmless,
  or someone who is dangerous but whose will was barely culpable."


  Question: "Does the compression view, if true, help Caruso or Dennett — or neither?
  And what does it imply for whether desert-talk should be kept at sentencing? Answer
