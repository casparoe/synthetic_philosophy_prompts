  Stem:

  "Setting: suppose determinism (or at least: no agent is the ultimate source of her
  own will — no contra-causal origination). Caruso''s free will scepticism: moral
  responsibility in the ''basic desert'' sense — the sense on which someone could
  deserve to suffer just because they did wrong, apart from any good consequences
  of making them suffer — requires that kind of ultimate authorship; we don''t have
  it; so retributivism is false, and no one deserves to be punished. But that doesn''t
  leave us with nothing: on his ''public health / quarantine'' model, the state may
  restrain, treat, and reform people who have actually caused harm, on the model of
  quarantining a carrier — the justification is the right to protect others from harm,
  it''s forward-looking (dangerousness, rehabilitation, and deterrence), it is constrained
  by proportionality to the harm risk rather than to desert, and it does not license
  locking up people who are merely statistically dangerous but haven''t done anything,
  because that would be punishing them for who they are rather than what they did.


  Dennett''s reply, as we read it: the free will worth wanting is compatibilist; what
  matters for responsibility is that an agent is responsive to reasons, can be educated
  by praise and blame, and can be expected to ''get better'' under the right regime.
  He thinks Caruso over-inflates what responsibility would have to be, and that desert-talk
  and blame do real work in a moral community that the quarantine model quietly helps
  itself to (or can''t reproduce). But he is not signing up for retributive payback
  either, and in practice he wants a much less punitive system than we have."


