  in book three — and reviewers keep saying, approvingly or not, that I''ve "made
  the weather a character". I''ve come to believe that''s not only fine, it''s sometimes
  the honest thing to do, and that the standard warning about environmental determinism
  is aimed at a claim I''m not making.


  My position, as precisely as I can put it: a germ, a drought or a volcano can be
  a genuine historical actor in a narrative without committing me to determinism,
  because actorhood for my purposes is a three-part test. One: discrimination — its
  effects track a man-made pattern of exposure (it kills the people in the bad housing,
  or the ones already weakened by the enclosure of the commons), so the cause is picking
  out something humans arranged rather than landing on everyone equally. Two: load-bearingness
  — hold the cause fixed and the human decisions stop explaining the outcome; swap
  it for a mild year and the same decisions produce something quite different. Three:
  answerability — somebody in a position to act could plausibly have foreseen it and
  didn''t, or did and decided against. And the determinism worry, I think, is a thesis
  about what''s sufficient across a range of cases, not a thesis about whether a cause
  mattered in this one; I can say the frost mattered enormously without saying it
  was sufficient, or inevitable, or that the humans were puppets.


  What I want from you is what would count against that. Not the general case against
  environmental determinism, which I''ve read, but defeaters for my version, ranked
  from fatal to merely awkward. A few things I''m especially after:


  - Which of my three conditions is really doing the work, and can they come apart?
  My instinct is that the first two are in tension: a plague that kills pretty indiscriminately
  across a whole region fails discrimination but is hugely load-bearing, whilst a
  frost that only kills the landless poor passes discrimination and might be pretty
  marginal to what happens. Give me the case that splits them cleanest and tell me
  which condition I''d have to drop, and what I''d lose by dropping it.


