  I''m a novelist, mid-fifties, working on my sixth book, and I''ve written more death
  scenes than I can count and Ive finally got to write the one I''ve been avoiding
  — my own, sort of. Not autobiographical exactly, but close enough that I can''t
  fake it.


  The setup: Miriam is 61, a literary translator, and she''s been given a prognosis
  (months). Her daughter Ada is 34 and builds bridges — actual structural engineer,
  talks about load paths at dinner, it drives Miriam up the wall. Night, Miriam''s
  kitchen, kettle has just boiled and neither of them wants tea.


  Miriam has decided, and has told people, that her death is not bad for her. Ada
  thinks it obviously is and can''t get Miriam to budge, and it''s making her furious
  in a way she''s ashamed of.


  What I need from you is that argument, as a scene. 900–1300 words of dialogue. Rules:


  - Nobody names a philosopher or an ancient text or an -ism. I''ve poked around the
  standard material and I don''t want it name-checked in the scene; they''re a translator
  and an engineer, they''d talk about it in their own words. So no "as Epicurus says,"
  no "deprivationism," no "the symmetry argument." Make them build the arguments from
  scratch, in plain language, out of the stuff in the kitchen if you can.

  - Both of them have to be good at this. Miriam is not cold or in denial and she
  is not allowed to win by being serene; she has to actually run the two moves that
  got me stuck — the "there''s no time at which both I and my death exist, so nothing
  can happen to me" move, and the "how is this different from the nine billion years
  before I was born, which nobody thinks is a tragedy for me" move — and she has to
  have an answer when Ada points out that the two cases don''t look the same (we have
  forward-looking projects, the before-birth stretch doesn''t cut anything short,
  whatever the honest version of that reply is). And she should concede something
  real early: the dying is bad, the fear is bad, leaving an unfinished sentence is
  bad — she just doesn''t think the being-dead is.

  - Ada has to be more than "but you''ll miss things." She has to say what kind of
  badness this is if it isn''t a bad experience, and she has to answer the "who does
  it happen to, and when?" question properly — and I want her to actually pick a position
  on that (bad at every earlier moment? bad at no moment? bad at the moments she''d
  otherwise have been alive at?) and defend it rather than gesturing at it.


  Then the bit I actually care about, which is my own dumb idea and I want to see
  if it survives contact with people who know this stuff. Here it is.


  Take two versions of Miriam''s life, same length, same total amount of good in them
  — same number of good days, roughly, just arranged differently. In one, the good
  stuff is front-loaded and the last third is thin, a slow narrowing. In the other
  it goes the other way, a thin start and then a late, long swell. Now cut both off
  at 61 by the same disease. The usual way of counting says the loss is the same size
  in both, because it''s the size of the slab you didn''t get. But it doesn''t feel
  the same size, and I don''t think it''s just sentiment: in the second version the
  death lands in the middle of something that was on its way somewhere, and the life
  is a worse shape when it stops. A bridge that stops mid-span is a different object
  from a bridge that stops at the abutment, even if there''s the same tonnage of steel
  in both. I want Ada to use this against Miriam: the badness isn''t a quantity of
  missing goods, it''s where the cut falls in the arc, and Miriam''s accounting can''t
  see that.


  And I also want the converse, which is the part that worries me for Miriam''s side:
  if the shape is what matters, then a long decline can wreck the shape, and there
  are deaths that are... not good, but that improve the whole. Which is a hell of
  a thing to say to your mother. Let Miriam find that on her own and see if she can
  use it without being cruel about it.


  One more thing I want in there, because it''s the only move I''ve found that might
  get Ada out of the "no one is there to be harmed" problem. Suppose the death also
  makes the *earlier* stretch of the life worse — not by changing what it felt like
  at the time, but in the way a joke is worse if the punchline never comes, or a setup
  is worse if it doesn''t pay off. Then there is a subject who exists at the time
  of the harm, namely the earlier Miriam, and the harm is happening to her while she''s
  alive. I want Miriam to fight this — I think her best line is something about confusing
  a change in how we rate a whole with something happening to a part, and maybe about
  double-counting, since the good years are now being counted twice, once as good
  and once as spoiled. Give her the strongest version you can.


  Ending: don''t let them agree, and don''t let anyone cry and be forgiven. I want
  them to end up knowing exactly which sentence they disagree about. Miriam is allowed
  one small, sour joke.


  After the scene, 150-250 words from you, addressed to me, on:


