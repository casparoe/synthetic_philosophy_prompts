  Argument (call it the "Everything Is Inevitable Argument" or "The Residue Argument"):


  (1) Any historical outcome we actually bother to explain is picked out under a functional
  description: a writing system, a rail gauge, a keyboard layout, a language, a legal
  form, a currency. We don''t explain ''this exact arrangement of matter''; we explain
  ''a solution to this coordination/technological problem''.

  (2) Functional descriptions are multiply realizable: many concrete arrangements
  would have served the same function about as well at the time they were available.

  (3) If the competing candidates were functionally equivalent to within the noise
  at the moment of adoption, then the reason one of them won cannot be that it served
  the function better; it must be something local and contingent.

  (4) So what path-dependence stories explain is only the local, contingent residue
  — which key got which letter, which side of the road, which width of rail — not
  whether we get a writing system, a road rule, a railway.

  (5) But (by 1) the functionally described outcome is the outcome we care about,
  and (by 4) it was going to arrive anyway.

  (6) Moreover, the residue can''t accumulate into something that matters: each residue
  is by hypothesis functionally arbitrary, and arbitrary details wash out under later
  re-optimization, since later agents face their own functional problems and will
  re-solve them rather than inherit the accident.

  (7) Therefore, for any outcome that matters, the same outcome would have arrived
  anyway; path dependence is at most a story about trivia.


  Where''s the flaw? Several candidates:

  - (6) is the weak/novel premise — my injected niche idea: call it the "washing out"
  premise. The objection: with increasing returns / complementary investments, the
  residue becomes the *fixed* infrastructure that later functional problems are posed
  against; re-optimizing is costly, so later agents optimize *around* the residue,
  and the residue propagates into the specification of later functions ("we need a
  keyboard that typists trained on QWERTY can use" — the function itself is rewritten
  to fit the accident). So the residue gets *entrenched* rather than washed out. Also
  the functional redescription is endogenous: later functions are specified relative
  to inherited accidents, so "the same functional outcome" isn''t a stable reference
  class across counterfactual histories — a scope/quantifier shift: (2)''s equivalence
  is assessed at time t, but (5) generalizes to all times (or to the final outcome).

  - (1) is also questionable: functional description is often ex post rationalization;
  also (1) plus (5) commits the "reference class" slide: whether the outcome is "the
  same" depends on which description you choose, and the argument lets you choose
  the description freely per case — which makes the thesis unfalsifiable. That''s
  a nice "proves too much": if you can always pick a description coarse enough, everything
  is inevitable; and conversely, fine-grained enough, nothing is.

  - Also there''s an equivocation between "would have arrived anyway" as (a) eventual
  convergence to some functionally equivalent arrangement vs. (b) convergence to *this*
  arrangement; and timing matters (a century of lock-in is not trivial even if it
  eventually washes out).


