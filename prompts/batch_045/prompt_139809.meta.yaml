  (1) We only ever explain historical outcomes under a functional description. Nobody
  tries to explain why this exact arrangement of matter obtained; we explain why the
  railways of a continent share a gauge, why a writing system looks the way it does,
  why a particular programming language became standard — i.e., why some coordination
  or design problem got some solution.


  (2) Functional descriptions are multiply realizable: at the moment the candidates
  were on the table, plenty of concretely different arrangements would have served
  the function about as well.


  (3) If the candidates were functionally equivalent within the noise, then the winner
  didn''t win by serving the function better; something local — an accident of timing,
  a marketing decision, a typing contest, a war — did the selecting.


  (4) So a path-dependence narrative never explains the functionally described outcome.
  It explains the residue: which key sits where, which side of the road people drive
  on, whose standard got adopted.


  (5) And the functionally described outcome is the one we care about (by 1). So the
  outcome we care about was going to arrive anyway: some writing system, some road
  rule, some standard, sooner or later.


  (6) The residue can''t accumulate into anything that matters, because later agents
  face their own functional problems and will re-solve them; an arbitrary inherited
  detail is exactly the sort of thing that gets re-optimized away once it starts to
  bite. So no lock-in is permanent; lock-ins are delays, not destinies.


