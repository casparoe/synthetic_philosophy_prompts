  Two features of American federalism sit side by side and seem to me to be pulling
  in opposite directions, and I want to know what theory could make them parts of
  one doctrine rather than two unrelated rules.


  First: Congress may not simply order a state government to work for it. It cannot
  require a state legislature to enact and enforce a federal regulatory program, and
  it cannot conscript state executive officers — police, sheriffs, licensing officials
  — into carrying out background checks or similar federal duties. What it can do
  instead is regulate individuals directly, or preempt state law in the field altogether.
  Oddly, preemption, which wipes out state law entirely, is permitted, while conscripting
  the state''s own machinery to do the same work is not.


  Second: Congress routinely obtains exactly the state action it is forbidden to require,
  by paying for it. Conditions attached to federal highway funds — a minimum drinking
  age, specified rules for licensing drivers — are standard and have been upheld even
  where Congress could not have regulated the subject on its own. The condition is
  formally an offer the state may decline. The limits are loose: the condition has
  to be related to the purpose of the spending, it has to be stated clearly, and it
  may not be so large that persuasion becomes compulsion — a line that was crossed,
  in the Court''s view, when a federal program threatened to withdraw all of a state''s
  existing Medicaid funding unless it expanded the program.


