  so S wouldn''t M despite being disposed. (e.g., a wire connected to a device that
  destroys it when current flows; or the "finkish" example: the glass is fragile but
  a sorcerer/ an "anti-fragility field" would remove fragility upon being struck.)

  - Masks (Johnston): S retains the disposition but something would prevent the manifestation
  (the glass is fragile but wrapped; the pill is disposed to dissolve but I swallow
  an antidote simultaneously... actually the classic: a fragile glass cushioned such
  that if struck it wouldn''t break).

  - Lewis''s RCA: x is disposed to M in C iff x has some intrinsic property B (the
  disposition''s basis) such that if x were in C and retained B for long enough, x
  would M. RCA handles finks and masks (the mask interferes, but if the mask were
  "removed"? Hmm — Lewis''s RCA: "x is disposed at time t to give response r to stimulus
