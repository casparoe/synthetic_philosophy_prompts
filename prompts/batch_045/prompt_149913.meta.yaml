  Now, content details to make it in the weeds:


  Key conceptual material (from my own knowledge, standard philosophy):

  - Reichenbach''s "straight rule" and the rule of choosing the narrowest reference
  class for which we have reliable statistics (the "rule of the narrowest reference
  class" / "Reichenbach''s desideratum": use the narrowest class with adequate data).

  - The problem: classes can be narrowed along infinitely many dimensions; narrowing
  to the point of a single case gives useless statistics (and for a unique event,
  no frequency).

  - Conflicting reference classes with different rates (Bar-Hillel''s "reference class
  problem"; also the "taxicab"/"base rate" literature).

  - Relevance/objectivity: a property is relevant if it makes a difference to the
  frequency (screening off); Kyburg''s "epistemological relativity"; Levi.

  - Frequentism vs. Bayesianism: Hájek''s argument that the reference class problem
  infects Bayesianism too — the principal principle needs a specification of which
  chance; and the problem of "the totality of evidence" — you can''t just condition
  on everything, because with a finite evidence set you must choose which features
  to condition on... Actually the Bayesian version: given your evidence includes the
  information that the individual belongs to many classes with conflicting frequencies,
  what should you believe? Also the issue that conditionalizing on total evidence
  is undefined when the evidence is not a single proposition... Fine.

  - Statistical: bias-variance tradeoff; the "curse of dimensionality"; overfitting;
  shrinkage/hierarchical modeling (partial pooling) — as a practical analogue of the
  reference class problem. That''s a great bridge for a natural scientist: the statisticians''
  answer is multilevel/hierarchical modeling with partial pooling, and cross-validation
  to choose the level of pooling. And the philosophical rejoinder: cross-validation
  scores a partition you still had to choose, and the "risk" is again relative to
  a population.

  - Selection effects / Berkson''s paradox: classes defined by how the case came to
  your attention.


