  really needs vs. what it merely fits well with. Is it coherent? I''m puzzled by
  one thing: we said everything is revisable, and yet some things were not even up
  for testing — is that a contradiction, or is the ''in principle'' doing some quiet
  work? And related: are these standing-fast propositions supposed to be beliefs at
  all? Some people in the reading group said they aren''t the kind of thing that can
  be true or false, which sounds like a dodge to me, but I couldn''t say why."


  Then the hypothetical reform:


  "Last thing, the part I''ve made up myself because I couldn''t find it discussed
  anywhere. Suppose a metrology institute adopted two rules: (1) no calibration chain
  may terminate in a proposition that is supported only by measurements made with
  instruments calibrated by that same chain — call it the no-bootstrap rule; and (2)
  any paper reporting an anomaly must list, in ranked order, the background propositions
