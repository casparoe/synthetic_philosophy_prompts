  Context: I''m a retired isotope geochemist (35 years, mostly U-Pb and Ar-Ar work)
  who''s recently got into philosophy via a reading group..."


  Then describe practice concretely:


  "In the lab, when a measurement came out weird, we never once considered that the
  physics had changed. If a zircon gave an age that didn''t fit the stratigraphy,
  we suspected the sample (inheritance, lead loss, contamination) or the machine,
  and we reran it. We never wrote down ''maybe the decay constant is different today''
  — that wasn''t treated as a hypothesis at all, not even as a very improbable one.
  Same with a plate that read high: we blamed the plate. Which struck me as odd, because
  the same people — me included — would have said, if asked, that every scientific
  claim is in principle revisable, and we laughed at people who said science has dogmas."


  "Second thing: we calibrate instruments using theory (energy conservation, half-lives,
  known standards) and then we use the instruments to test theory. When I got curious
  and traced it back, the chain seemed to loop: the half-life is measured with instruments
  calibrated using ... something, and the instrument is trusted because measurements
  using it reproduce known ages. Nobody in the lab was worried about this loop."


  Then ask the philosophical question:


  "What view of knowledge / evidence does this practice presuppose? It looks like
  it''s committed to something like: there are propositions that stand fast for us,
  that function as rules rather than as things tested, and a clash between such a
  proposition and a datum is resolved against the datum. Is that the right reconstruction?
  Does the practice strictly require that, or would a plain Bayesian/coherentist story
