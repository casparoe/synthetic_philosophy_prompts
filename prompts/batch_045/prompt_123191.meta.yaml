  (1) Embedding. Any physically implemented decision-maker is part of the causal order
  it deliberates about. Its decision procedure is a physical process, and its output
  is an event in the environment.


  (2) Open options. To choose by comparing expected utilities, an agent needs, for
  each candidate action a it is choosing between, a probability distribution over
  outcomes conditional on a. Equivalently: its world-model must represent more than
  one of its own candidate outputs as genuinely possible. Call this the open-option
  condition.


