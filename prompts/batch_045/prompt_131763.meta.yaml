  Then numbered:


  (1) Heritability, as the term is used in quantitative genetics (narrow-sense h²),
  is the ratio of additive genetic variance to total phenotypic variance in a specified
  population living in a specified range of environments: h² = V_A/V_P.


  (2) A ratio defined over a population is not a decomposition of any individual''s
  outcome. From "height is about 80% heritable here," nothing follows about why my
  particular child is short — it can still be that he is short entirely because of
  diet or illness, and that no genetic difference is involved at all.


  (3) Nor does a within-population estimate license inferences about differences between
  populations: if two groups differ in average height, a high within-group heritability
  tells us nothing about whether that gap is genetic, environmental, or both — the
  classic case being a trait that is nearly 100% heritable within a population and
  yet entirely preventable by a dietary intervention (phenylketonuria).


  (4) And heritability is consistent with arbitrarily large effects of changing the
  environment for everyone: because the environmental interventions that help tend
  also to equalize, they shrink V_P, and shrinking the denominator raises h² — so
  better and fairer conditions can raise heritability while improving the trait.


  (5) So a heritability estimate never underwrites a claim of the form "this fraction
  of the outcome is written by genes, and only the rest is available to us."


  (6) My father''s inference is of exactly that form. Hence his conclusion doesn''t
  follow...


