  Content: The question: The consensus among working mathematicians is roughly "AC
  is fine, use Zorn''s lemma freely; if you worry, do it in ZFC and note where choice
  is used." But there''s a residual puzzle: the *indispensability-style* justification
  for AC (Quine–Putnam: we''re committed to what our best theories quantify over)
  seems to badly overgenerate for set theory, because almost none of the mathematics
  that empirical science actually invokes needs full AC — most applied maths works
  in ZF + countable choice, and even the choice-flavoured theorems physics leans on
  (Hahn–Banach for the duals of Banach spaces in QM, say) are, as I understand it,
  implied by the Boolean prime ideal/ultrafilter lemma, which is strictly weaker than
  AC and doesn''t even give countable choice. Meanwhile the intrinsic justification
  ("the iterative conception + a maximality heuristic gives you AC") seems not to:
  the iterative conception by itself doesn''t settle whether every family of nonempty
  sets has a choice function, and "the universe should be as rich as possible" is
  at best a heuristic that also motivates its opposite (there are forcing extensions...).


  So my half-formed idea: the real question isn''t "is Zorn''s lemma true?" but "which
  fragments of choice are load-bearing for the mathematics our best empirical theories
  actually invoke, and does the answer leave the full-strength principle with any
  non-pragmatic justification?" And the deflationary hypothesis I want to test: "is
  AC true?" is not like "is the Continuum Hypothesis true?" (a determinate question
  we may be unable to answer) but like "is the parallel postulate true?" (a question
  that dissolves once we stop assuming a unique intended model) — i.e., the debate
  is best read as a choice between set-theoretic *environments*, and once you say
  that, the only remaining normative question is a pragmatic-instrumental one about
  which environment makes "applied" reasoning easiest.


  Deliverables: (1) a taxonomy: for a finite basket of representative results that
  physics/economics/statistics actually use, classify each as (a) provable in ZF,
  (b) needs countable/dependent choice, (c) needs BPI-strength, (d) needs full AC
