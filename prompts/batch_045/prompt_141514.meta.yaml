  ---


  I''ve been reading rationalist blogs and forums for about fifteen years, and one
  of the recurring threads there is "is the axiom of choice actually true?" The modal
  answer in those threads is a shrug: Zorn''s lemma is fine, every vector space having
  a basis is a cost you should be willing to pay, Banach–Tarski is a curiosity about
  non-measurable sets rather than a problem, and if you''re still uneasy you can always
  track where choice gets used. I''ve never found that satisfying, because "fine"
  is doing all the work.


  I''m putting together a one-year, self-funded independent research proposal (roughly
  fifteen hours a week, no advisor, graduate-level maths but I am not a set theorist)
  and I want the question pinned down properly before I commit. My half-formed idea
  is that the standard justifications for accepting Zorn''s lemma are aimed at the
  wrong target, and that splitting the target dissolves part of the dispute and sharpens
  the rest.


  Here is the split I have in mind. There are two quite different questions: (1) Is
  the full-strength choice principle true / justified / to be accepted? (2) How much
  choice does the mathematics that our best empirical theories actually invoke really
  need? The indispensability-style argument (we are committed to the existence of
  whatever our best theories quantify over, and mathematics is indispensable to those
  theories) looks like it should answer (1) via (2), but my strong suspicion is that
  it cannot, because the choice-flavoured theorems that physics, statistics, and economics
  lean on mostly sit well below full AC: much of applied analysis is fine with countable
  or dependent choice, and the Hahn–Banach theorem — the one that keeps coming up
  in the foundations of quantum mechanics, since you want a rich dual space — follows,
  as I understand it, from the Boolean prime ideal theorem / ultrafilter lemma, which
