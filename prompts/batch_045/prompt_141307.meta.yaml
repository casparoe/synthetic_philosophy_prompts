  versus foresight, causation, and the scope of consent — that this pattern of practice
  would require in order to be coherent? Tell me which parts it strictly presupposes,
  which parts merely sit well with it, and which parts several competing theories
  would license equally; say whether the self-administration requirement and the psychiatric
  exclusion are independently defensible or are welded onto the rest; and say, concretely,
  what would have to change in the practice if my friend''s single principle were
  the one actually adopted.


