  ---


  After a long argument with a friend, I want a second opinion on a pattern in actual
  medical practice rather than on anyone''s theory.


  In almost every jurisdiction, a competent patient may refuse any life-sustaining
  treatment — a ventilator, dialysis, a transfusion — and the physician must comply
  even when the patient is not terminally ill and even when the reason seems to others
  inadequate; the patient then dies, and everyone describes this as allowing the disease
  to take its course. In the same jurisdictions, a physician who supplies a lethal
  dose at that patient''s request, for the very same reasons, is committing a serious
  crime; where assisted dying is lawful at all it is hedged with conditions that withdrawal
  of treatment is not — a diagnosis with a prognosis, repeated requests, waiting periods,
  exclusion of cases where the suffering is psychiatric alone, and, in several regimes,
  a requirement that the patient perform the final act himself. Meanwhile palliative
  sedation to unconsciousness until death, which foreseeably shortens life and looks
  from the outside much like the withdrawal case, is treated as ordinary good medicine.


  My friend says the whole pattern is held together by one principle and I say it
  is held together by none: he claims the law is really only protecting a negative
  right against being touched or treated without consent, and that every apparent
  inconsistency dissolves once you see that a right to be left alone cannot generate
  a duty on anyone to help; I think that explains the refusal cases and nothing else,
  and that the rest is a mishmash of the acts/omissions distinction, the doctrine
  of double effect, and anxiety about what it does to a profession once lethal means
  become something a doctor can offer.


