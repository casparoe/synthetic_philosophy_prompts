  I''m a postdoc in philosophy, and in three weeks I have a single sixty-minute slot
  in a colleague''s "Science in Public" course: about thirty second-years, mostly
  non-majors, a mix of biology and literature students, one whiteboard, no assigned
  reading and no handout (their attention budget is roughly one board diagram). I''ve
  been asked to get across the crane/skyhook contrast and the companion notion of
  greedy reductionism — Dennett''s vocabulary from Darwin''s Dangerous Idea — well
  enough that the students can use the terms on cases they haven''t seen. Don''t explain
  the distinction to me. Plan how I should explain it.


  What I want from you:


  1. The dependency order, and why. Which ideas have to be in place before the two
  labels are introduced at all — I suspect the labels should arrive late, after the
  class has already felt the difference between an explanation that does lifting work
  and one that merely relocates the mystery — and which step each later step depends
  on. Say what breaks if I invert any adjacent pair.


  2. The one example that carries the whole hour, and the constraints that pick it
  out: I want a case where the mechanism is visibly cumulative, where every individual
  step is unimpressive, and where the finished product is much more organized than
  anything that had to be assumed at the start. Tell me what such an example must
  have, what it must lack, and why the usual candidates fail the brief — I''m thinking
  the vertebrate eye, the bacterial flagellum, and a watch found on a heath.


  3. The misconception map, in the order the misconceptions will actually form, with
  the point in the sequence where each should be headed off, and which ones I should
  deliberately leave standing until the end because defusing them early would cost
  more than it saves. My guesses: that "skyhook" is a polite word for the supernatural
  and the whole apparatus is just evolution-versus-creationism in costume; that greedy
  reductionism is a charge against reduction in general, so that the lesson is "be
  suspicious of explanations that go small"; that a crane has to be a simple machine
  if it is going to do honest work; that if cranes rest on cranes we get a regress
  and something has to hang from the sky eventually; and that "it''s emergent" is
  a place where explanation can stop. Add the ones I haven''t listed, especially any
  that my own framing invites.


  4. A check at the end that would distinguish students who can use the contrast from
  students who have only learned two words — ideally something I can put on the board
  in thirty seconds — together with what a wrong-but-confident answer to it will look
  like.


  Two things I''ve been tempted to add, and I''d like your verdict on whether they
  earn their ten minutes and where they''d go. The first is a third category alongside
  crane and skyhook: the unfinished crane, where a speaker names a mechanism — self-organization,
  emergence, a faculty, a drive — and it is genuinely an open question whether the
