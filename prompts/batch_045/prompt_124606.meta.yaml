  I teach a final-year undergraduate seminar on ethics and technology, and I am writing
  this term''s final exam. The exam is a 48-hour take-home: students choose one of
  four questions and write at most 1,500 words. I need one question on whether video-game
  characters can matter morally, together with a model answer and a marking scheme.


  The problem I want to avoid is that the strong students will all produce the same
  answer: that characters lack phenomenal consciousness, or that they matter only
  derivatively (as art, or through their effects on players), and then spend the rest
  of the essay restating whichever of those two claims they picked. I would rather
  the question be located at a point where the two available metaphysical accounts
  of what a game character is each generate a conclusion that is hard to accept, so
  that a good answer has to say something constructive rather than apply a label.


  Here is the material I want the question built around. Ask students to stipulate,
  for the sake of argument, that a particular companion character in a narrative game
  has, in one scripted scene, conscious states that are unpleasant in the way pain
  is, and that this is settled by whatever test of phenomenal consciousness they favour;
  the essay is not to be spent arguing about that. Then give them three variations:


  (i) Multiplication. The game has sold several million copies and the companion''s
  scene has been run, in numerically distinct implementations on distinct machines,
  several million times.


  (ii) Suspension. The engine stops simulating non-player characters whenever no player
  is in their region of the world, resuming from a saved state on approach; on the
  standard implementation, the companion''s conscious processing is therefore intermittent
  and gappy.


  (iii) The unshipped build. A finished game is completed, its code fully specifies
  the companion''s functional organisation down to the last detail, and is then shelved
  and never executed by anyone.


  Then the crux: an implementation-based account, on which moral status attaches to
  an ongoing causal process of the right kind and moral weight scales with the amount
  or measure of implementation, seems to make the bestseller a catastrophe of a scale
  no one believes in and to make ordinary suspension a repeated killing; a pattern-based
  account, on which status attaches to the abstract functional organisation and instantiation
  is irrelevant, escapes both of those but seems committed to saying that the shelved
  build contains a moral patient, and to the further worry that abstract objects cannot
  be causally affected and so cannot be benefited or harmed at all, which would make
  the position self-undermining.


  I want the question to require the following five moves, and I would like the model
  answer to model all five and the marking scheme to price them:


  1. A statement of the two accounts precise enough that the consequential claims
  (about multiplication, suspension, and unshipped builds) follow rather than being
  asserted.

  2. A verdict about whether the number of implementations scales moral weight, and
  an argument for it that does not simply appeal to intuition.

  3. Engagement with the causal-inefficacy worry for pattern-based views, and either
