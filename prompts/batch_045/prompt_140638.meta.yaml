  \ via absences), and the argument that they can't be causes also proves too much\
  \ (no one is ever responsible for anything they didn't do). So it's a dilemma/antinomy.\n\
  \nLet me think of a cleaner chain with a subtle flaw. Idea: a \"contrastive\" /\
  \ \"fragility\" argument.\n\nConsider the argument: \n(1) c causes e iff, had c\
  \ not occurred, e would not have occurred (simple counterfactual dependence, or\
  \ at least: counterfactual dependence of e on c is sufficient for causation when\
  \ holding fixed... ). Hmm.\n\nBetter: build around the \"actual causation / but-for\
  \ test with omissions\" issue:\n\n(1) Whether an omission caused an outcome depends\
  \ on what would have happened had the agent acted.\n(2) What would have happened\
  \ had the agent acted depends on what the agent would have done — e.g., if the lifeguard\
  \ had watched, would she have noticed and rescued? If she wouldn't have noticed\
  \ anyway, or would have rescued incompetently, then...\n(3) So the truth of \"the\
  \ lifeguard's omission caused the death\" depends on facts about how she would have\
  \ acted, not merely on the fact that she didn't act.\n(4) But causation is a relation\
  \ between what actually happened, not between what would have happened; two agents\
  \ who omit the very same act in the very same situation (identical behavior, identical\
