  \ the outcome, only because of differences in counterfactual behavior.\n(5) So causal\
  \ claims about omissions are not about actual sequences at all — they smuggle in\
  \ facts about non-actual behavior.\n(6) The same is true of ordinary positive causation\
  \ claims?? Hmm.\n\nAlternatively, use the \"double prevention\" / \"causation by\
  \ disconnection\" argument. Or use a neat one: the \"omissions prove too much because\
  \ of preemption among omissions\" — the overdetermination case: both the lifeguard\
