  \ argument. Let me construct a chain:\n\n(1) Causation requires causal relata that\
  \ are actual, concrete, spatiotemporally located events (or: causation is a relation\
  \ that requires actual events).\n(2) An omission is not an event; it's the absence\
  \ of one — nothing located anywhere.\n(3) So omissions cannot be causes or effects.\n\
  (4) But many ordinary causal claims are about omissions: \"the lifeguard's failure\
  \ to watch caused the drowning,\" \"not watering the plant caused it to die,\" \"\
  the sentry's not reporting caused the ambush.\"\n(5) If omissions aren't causes,\
  \ then these claims are all false — but they're clearly true / and responsibility\
  \ attributions collapse.\n(6) Therefore (1) is false: causation doesn't require\
  \ actual events; absences can be causes.\n(7) But then: there are infinitely many\
  \ absences at any time — the Queen of England's failure to water my plant, my not\
  \ watering it, everyone else's not watering it. If absences can be causes, then\
  \ each of the billions of people who failed to water my plant caused its death.\
  \ So causal claims would be absurdly promiscuous.\n(8) So (1) is true after all...\n\
  \nHmm, this is a nice structure: an argument whose conclusion the asker can't accept.\
