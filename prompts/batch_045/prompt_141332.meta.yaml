  "I''m on the four-person advisory board of a small private foundation, and we''re
  about to commit our last big grant cycle — about eight three-year postdoctoral fellowships,
  split between philosophy departments and psychology departments but explicitly not
  funding new data collection — to work on meaning in life. The board is split down
  the middle: two of us think the money should go where the conceptual action is (whether
  meaning requires objective worth or only fitting attraction, how meaning relates
  to happiness and achievement, whether cosmic meaning and meaning in a life are even
  the same property), and two want work that would change how meaning gets invoked
  outside the academy — in end-of-life policy, in medicine, in how people are advised
  about careers and retirement, in the way employers now advertise purpose to the
  people they work for. We can''t do both. What I need from you is a defended ordering
  of the open questions, not a survey of the field: no citations, no reading recommendations,
  no names to look up.


  Two caveats on my own thinking, because I''d rather you engage with them than politely
  set them aside. First, I''ve become attached to something I''ve started calling
  the deputization model of felt meaning: the claim that for most people, the sense
  that one''s life matters is borrowed — one takes oneself to be contributing to projects
  whose value one neither fully understands nor could defend on demand, and one''s
  confidence in them is a form of deference to institutions, disciplines, or admired
  individuals. If that is even roughly right, a good deal of what gets measured as
  felt meaning may not be tracking what the theories are about, and questions about
  meaningful work may really be questions about justified deference. Second, I keep
  coming back to a striking asymmetry that a recent book defends at length: that our
  projects would lose much of their point if humanity were about to die out, even
  if our own lives and those of everyone we love were unaffected. That raises a cluster
  of questions I don''t see clearly ordered anywhere — whether meaning is essentially
  forward-looking or historical, whether a last generation could have meaningful lives,
  whether being forgotten matters, and whether meaning has any threshold at all, as
  opposed to only coming in degrees, which is what several European jurisdictions
  seem to have to assume when they debate whether a life can be complete. Add to that
  the practical worry that much ordinary meaning currently comes from being needed
  and from productive contribution, and that this may become scarce, plus my suspicion
  that the familiar cosmic-indifference framing — the universe is vast and does not
  care — is a category mistake that survives on rhetorical force alone.


  So: rank them. Which of these, and which ones I''m not listing, are worth three
  years of a smart person''s time, and why? I want the criteria made explicit and
  the trade-offs among them surfaced — how upstream a question is, whether it is tractable
  with conceptual tools and no new data, whether it is genuinely neglected or already
  crowded, and how much would change downstream if it were answered either way. I
  also want to know which questions you''d deliberately leave off the list because
  their answers wouldn''t move anything else, and which alleged implications of the
  absurdist tradition you think are overrated or don''t follow. Say what would move
  your ranking up or down over the next few years, and tell me the one slot you''d
  spend on something speculative. Please write in American English, and aim for something
  around 1,200 words — dense rather than comprehensive."


