  this was a ''race correction'' reflecting average differences in muscle mass. Last
  year the hospital eliminated that race term. In its place, it introduced a new ''ancestry-adjusted''
  estimate. Before the test, patients are given a consent form saying that the hospital
  now measures ''genetic ancestry, not race'': a saliva test estimates the proportions
  of a patient''s genome attributable to continental ancestry groups labeled African,
  European, Indigenous American, East Asian, and South Asian, and the kidney formula
  uses those proportions instead of self-identified race. The consent form also states
  that genetic ancestry is a biological variable, whereas self-identified race is
  a social category with no biological meaning.


  Yet the hospital has not retired self-identified race. Its transplant committee
  continues to award ''equity priority points'' to candidates on the basis of the
  fixed racial categories from the old record—Black, white, Asian, Native American,
  Pacific Islander, and ''other''—and its public quality dashboard still reports gaps
  in outcomes between exactly those categories. The committee''s stated justification
  is that self-identified social race, not genetic ancestry, is what tracks a patient''s
  exposure to racism and disadvantage, so social race is the correct basis for remedial
  priority. Patients may choose ''multiracial'' or decline to answer in the diversity
  questionnaire, but for anyone who does not update it, the system auto-populates
  the race field from birth-certificate data.


