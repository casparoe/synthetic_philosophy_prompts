  Aumann''s agreement theorem (1976, "Agreeing to Disagree"): if two agents have the
  same priors, and their posteriors for an event are common knowledge, then the posteriors
  are equal. So rational agents with common priors cannot agree to disagree (given
  common knowledge of posteriors). The "common prior assumption" (Harsanyi doctrine)
  says that differences in beliefs should be explained entirely by differences in
  information, not by differences in priors; in games with incomplete information,
  Harsanyi''s trick models incomplete information as a chance move by Nature from
  a commonly known distribution (the common prior).


