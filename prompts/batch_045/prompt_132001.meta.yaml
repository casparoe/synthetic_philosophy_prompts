  Then the complications:

  (a) the roll-call votes are Aumann''s common-knowledge-of-posteriors condition being
  met, yet the jurors still disagree — so by the theorem, either priors or rationality
  (or the honesty of the report) must be non-common. Which of the holdouts is a genuine
  prior difference (the bigot''s "they''re all alike", the grieving father''s fixation
  on his own son) and which is a difference about something else?

  (b) the verdict is a decision under asymmetric loss, not a probability: the holdout
  says he isn''t claiming innocence, only a doubt — so agreement on the probability
  of guilt is compatible with disagreement about the verdict, and unanimity on the
  verdict is compatible with persistent disagreement about the facts. Does that make
  the jury''s unanimity less of a vindication of the pooling story than it looks?

  (c) the injected niche idea: the votes are cheap talk — a vote is only informative
  to others if they can take it as an honest report of a posterior, and the film gives
  reasons to discount: the salesman who wants the ballgame, the father''s grief, the
  bigot''s animus. Call it the reporting problem: Aumann needs not just public posteriors
  but credible ones. Does the film''s mechanism for producing agreement -- the staged
  demonstrations (the knife, the walk, the eyeglass marks) -- amount to a solution
  to the reporting problem, i.e., converting private simulation into public evidence
  that no one has to take on trust? And does that suggest the film''s real thesis
  is that what deliberation needs is not more votes but more *demonstrations*?


