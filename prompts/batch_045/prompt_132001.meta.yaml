  So: a rich case for the philosophical reading. The common prior assumption in this
  context: the jurors are treated as sharing priors over the world (the same background
  knowledge about knives, trains, old men, eyeglasses) and differing only in evidence
  they recall or notice. The film''s ideal of deliberation: pooling of information
  — each juror notices something different, and unanimity is reached when the pool
  is complete. That''s the Harsanyi picture: differences of opinion are differences
  of information; pooling yields agreement.


  But the film complicates:

  1. Juror 3 and juror 10 don''t share priors: juror 3''s prior is loaded by his relation
  with his son (a "prior" in the psychological sense); juror 10''s prior is a stereotype
  about "them". Aumann''s theorem requires common priors; the film shows priors that
  aren''t common, and shows that no amount of shared evidence fixes that. Indeed the
  film resolves those two not by evidence but by other means — juror 10 is shamed
  into silence (social punishment), juror 3 collapses emotionally. So the film''s
  own account of how agreement is reached is not Aumann/Bayesian: it''s affective
  and social.

  2. The agreement theorem also requires common knowledge of posteriors: the secret/roll-call
  votes make each juror''s posterior public (common knowledge), and yet they still
  disagree → by modus tollens, if you assume rationality/common knowledge, their priors
  are not common. So the film instantiates the diagnostic use: disagreement under
  common knowledge of posteriors is evidence against common priors. Nice — the film
  is a counterexample to the common prior assumption as a description of actual deliberation.

  3. "Reasonable doubt" is a decision-theoretic threshold, not a probability estimate.
  A juror can agree on p(guilt) = 0.9 and disagree about whether that clears the threshold;
  also the asymmetry of the two errors (convicting the innocent vs. acquitting the
  guilty) is a payoff/utility matter, not a belief matter. Juror 8''s stance — "I''m
  not saying he''s innocent, I''m saying there''s a reasonable doubt" — is a point
  about the utility asymmetry / the burden of proof, not about the likelihood ratio.
  So the film shows that what looks like persistent disagreement about probability
  is actually agreement about probability plus disagreement about the decision rule
  (or about the loss function). That''s a great "in the weeds" point: Aumann''s theorem
  is about beliefs, but the jury''s task is a decision under asymmetric loss — so
  even with common priors and common knowledge, unanimity on the verdict need not
  imply agreement on the probability, and vice versa. Actually: with common priors
  and different loss functions, "agree to disagree" about what to do is perfectly
  consistent.

  4. Another in-the-weeds point: the film dramatizes a failure of the "pooling" model
  — information isn''t just distributed, it''s *not attended to*; jurors have the
  same evidence (they all heard the same trial) yet different posteriors because remembering/imagining
  an alternative scenario (the reenactment: the knife, the walk, the stab angle) is
  itself a costly act of imagination. Davis''s staged demonstrations are a way of
  *making* evidence public — turning private simulation into shared evidence. Nice.


