  — they''re a stranded population who cannot be deported anywhere (their ship is
  disabled, their home world is unreachable). So the standard "open borders" debate
  assumes a sending state that can receive them; here there''s no "elsewhere" to return
  them to, so exclusion means permanent internment, not refusal of entry. That''s
