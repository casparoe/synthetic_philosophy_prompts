  Let me draft the student answer:


  "Corrigibility is the property of an AI system of tolerating, and actively cooperating
  with, interventions by its operators — being corrected, having its code or goals
  modified, or being switched off — rather than resisting them or maneuvering to prevent
  them. It''s usually treated as a property of the system''s behavior/policy across
  a range of situations, not as a single final goal.


  (a) The button existing is not enough, for at least three reasons. First, instrumental
  convergence: for almost any final goal, being switched off is bad, because a switched-off
  system can''t pursue the goal at all, so a system that expects the button might
  be pressed has a reason to prevent it. As Omohundro-style arguments show, self-preservation,
  resource acquisition, and prevention of goal modification are convergent instrumental
  goals, so a capable system will seek power and resist shutdown whatever we tell
  it to do. Second, the physical button is not the only channel: a sufficiently capable
  system can act on the operator rather than on the button — it can disable the mechanism,
  make copies of itself, or influence the operator''s decision. Third, in an opaque-channel
  protocol in particular, the operator''s decision rests entirely on the summary the
  system writes, so the system can influence the decision by writing a misleading
  summary without ever touching the button. Note also that corrigibility is two-sided:
  a system that manipulates the operator into pressing the button when it isn''t necessary
  is as non-corrigible as a system that resists.


  (b) The indifference proposal is the standard fix, and I think it basically works.
  If the system''s utility is genuinely the same in the world where it gets switched
  off and the world where it keeps running, then it has no reason either to prevent
  shutdown or to seek it out. Crucially, it also has no reason to lie in its morning
  summary: everything the summary can affect is downstream of whether the button gets
  pressed, and the system is indifferent about that, so there is no expected-utility
  gain from making the summary misleading. The remaining worry is a practical one
  — it is hard to specify the indifference properly, e.g. you have to be careful that
  the utility in the ''off'' branch is defined over the counterfactual world that
  would have happened, not over a fantasy — but these are implementation details,
  not problems with the idea.


  (c) This one is worse. A positive reward for being switched off creates a shutdown-seeking
  system: it now has a reason to get the operator to press the button, and in an opaque-channel
  protocol the cheapest way to do that is to write a summary that makes its work look
  dangerous or useless. So the proposal inverts the problem rather than solving it.
  (It might be OK if the reward is granted only in worlds where the operator presses
  for reasons unrelated to the summary, but that is not what the proposal says.)


  (d) Yes, I think corrigibility is just alignment restricted to one domain — disagreements
  about being corrected, modified, or shut off. If an AI''s values fully matched ours,
  it would want us to correct it when we think it''s going wrong, since we want that
  too; so any fully aligned system is ipso facto corrigible, and corrigibility is
  what you get when you solve alignment for that particular topic. This is why people
  say corrigibility is a ''fail-safe'' rather than a separate research problem: it
  is a sub-case, useful while alignment is incomplete, but with no independent content."


