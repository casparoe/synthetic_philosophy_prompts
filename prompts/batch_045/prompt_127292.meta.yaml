  Heterophenomenology (Dennett): treat subjects'' reports as texts to be interpreted
  from the third-person point of view; the union of (a) what subjects say about their
  experience, (b) the third-person data, and (c) the "heterophenomenological world"
  — the world as described by subjects, which may be fictional — constitutes the data
  for a science of consciousness. The method''s selling point: it''s neutral, it doesn''t
  take reports at face value as revelations of real qualia, it''s an extension of
  ordinary empirical method.


  Now the phenomenon I want to describe. Idea: the reports you get depend on the elicitation
  protocol, and there''s a worry that heterophenomenology can''t distinguish (i) "subjects''
