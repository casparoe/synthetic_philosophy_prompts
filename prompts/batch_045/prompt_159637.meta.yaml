  Spec:

  Setting: ordinary, non-science-fictional (a lab, a warehouse, a clinic, an agricultural
  station). One paragraph.

  Two predicates P and Q over the same observed sample:

  - P is the "plain" uniform predicate: all members of kind K have observable property
  φ (e.g., all tablets from this production line are chalky-white / all apples in
  the orchard are red-skinned).

  - Q is the grue-style predicate: members examined before date t have φ, members
  examined after t have ψ (a different observable property).

  All data so far (collected before t) is φ, so both P and Q fit the evidence exactly
  and they diverge only in their predictions about post-t observations.


  Requirement (the reversal): Q must be the one that is genuinely projectible — the
  one a competent inquirer in the scenario should bet on — while P must be the non-projectible
  one, AND this must not be achieved by any of the obvious cheats:

  1. Not by swapping in a community that speaks "grue" as a basic vocabulary (Goodman''s
  own symmetry remark).

  2. Not by stipulating a mechanism or law that just says "things switch at t" (the
  flip must be generated by something in the scenario that an inquirer could in principle
  discover, i.e., the index variable must be causally relevant or a proxy for a causally
  relevant variable, e.g., age, batch, storage conditions, position in a stack).

  3. Not by making P gerrymandered by definition or by convention (P must look, to
  the inquirers, like the natural, simple, entrenched predicate — indeed: require
  that P is *more entrenched* than Q in the inquirers'' actual practice, and syntactically
  simpler).


