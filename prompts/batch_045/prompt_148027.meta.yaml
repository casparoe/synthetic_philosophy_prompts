  I spent my career in experimental physics -- designing apparatus, budgeting systematic
  error, arguing about whether a three-sigma bump was a signal or the look-elsewhere
  effect -- and in retirement I have been reading the Lucas-Penrose argument that
  mathematical judgement cannot be captured by any formal system. I would like that
  argument restated in the only vocabulary in which I know how to appraise a claim:
  measurement.


  The mapping I have in mind is this: a candidate formal system F is an apparatus,
  its theorems are readings, and the Gödel construction, applied to F, is a procedure
  that prints a sentence G_F the apparatus will never produce. The premise I want
  scrutinised is the step from ''F does not prove G_F'' to ''I can see that G_F is
  true'' -- which in my terms is a single, unreplicated, self-directed measurement
  taken by an uncalibrated instrument about itself.


  Two stipulations. First, do not let ''can see'' mean ''infallibly see'': suppose
  my performance at this is a measured reliability r < 1 on sentences of comparable
  complexity, with statistical and systematic uncertainties, and that the sentences
  are long enough that no finite agent, including me, could verify them by hand. Second,
  allow the mechanist the corresponding move: a machine that emits candidate Gödel
  sentences with the same reliability r, or samples them.


  Restate the argument as faithfully as you can under those stipulations, using my
  terms -- signal and noise, calibration and blind analysis, replication, error budget,
  the distinction between a fluctuation and a discovery. Then give me the residue
  report: which steps carry over cleanly, which survive only after distortion, and
  which parts of what the philosophers are claiming have no counterpart at all in
  a vocabulary built for measurement. My real question is where the residue lies:
  does the argument collapse once ''see'' is degraded to a fallible readout on sentences
  no one can check, or does my vocabulary simply lack the resources to state what
  the anti-mechanist means by seeing a truth?


