  The literature''s moves (which an LLM will know at a general level):

  1. Expected utility with bounded utility (Bernoulli''s logarithmic/marginal utility
  resolution) — resolves it but then "super-Petersburg" games break it (unbounded
  utility version: payoff 2^n where utility also grows...). Actually the standard
  objection: for any bounded-but-increasing utility you can design a game with infinite
  expected utility (Menger; "super-Petersburg"). Also, bounding utility to solve one
  puzzle looks ad hoc (and has costs elsewhere: risk aversion over large stakes ⇒
  absurd caution about small risks, cf. Rabin''s calibration argument).

  2. Truncating/censoring: finite bankroll of the counterparty (the "finite casino")
  → finite expectation, and the fair price grows only logarithmically in the bankroll.
  This is the classic "resolve by realism" answer: the actual expected value of a
  capped Petersburg game against a bankroll W is small (~log2 W).

  3. Rejecting expected value/expected utility as the decision rule in favor of something
  else: median/growth-rate/time-average (Kelly, ergodicity), stochastic dominance,
  "evaluate by probability of reaching a target", or satisficing/threshold rules.

  4. Probability weighting / rank-dependent / prospect-theory-style: small probabilities
  get over- or under-weighted; or "ignoring" sufficiently small probabilities (a cutoff),
  which is a psychological and sometimes rational (bounded-rational) move.

  5. The role of repetition: with repetition and reinvestment, growth-rate criteria
  differ from EV, but note that for additive wealth and many parallel independent
  bets, EV is fine — the ergodicity point matters for multiplicative dynamics.

  6. Value of the procedure being explainable/auditable to a board and consistent
  across proposals.


