  Option B: Consistency-check type + Nozick''s entitlement theory / Wilt Chamberlain.
  That''s a nice fit: someone lists commitments: (1) self-ownership, (2) Nozick''s
  Lockean proviso read as a baseline comparison, (3) reject patterned principles because
  they forbid capitalist acts between consenting adults, (4) think the Wilt Chamberlain
  argument is decisive, (5) but also think bequest and inheritance taxation is permissible
  / or that historical unjust acquisition (indigenous dispossession) requires rectification,
  (6) think property rights can be forfeited... Some genuine tensions: Nozick''s argument
  requires the baseline to be just; large-scale historical injustice makes the actual
  baseline unjust, which undermines applying the Chamberlain intuition to the actual
  world. Also: does the Chamberlain argument actually refute patterned principles,
  or only "liberty upsets patterns" — patterned principles can be maintained by continuous
  interference, and the argument''s force depends on the claim that such interference
  is objectionable, but if you accept a mild redistributive end-state principle you''d
  deny that. Another tension: accepting the Chamberlain argument but also endorsing
  something like a "proviso" with a strong reading (Rawlsian difference principle-ish
  baseline) — Nozick himself notes that a strong proviso would require continuous
  redistribution. Also the "gift" version: Chamberlain argument typically uses voluntary
  transfers; but if you also hold that people may be subject to taxation to fund public
  goods (which requires coercion), that''s a separate tension.


  Also there''s a known subtle point: the Chamberlain argument is usually read as
  showing that liberty upsets patterns; but Cohen (G.A. Cohen) argued it only shows
  that liberty upsets patterns if the initial distribution is just and the transfers
  are genuinely voluntary — and that Nozick''s own endorsements (self-ownership) plus
  his claim... Actually Cohen''s critique: "Where the Action Is" / "Self-ownership,
  freedom and equality" — the point that Nozick''s argument illegitimately assumes
  that the initial distribution is just and then uses the fact that people want to
  pay to see Chamberlain to claim liberty; Cohen argues that the argument shows only
  that patterns cannot be sustained without interference with liberty, not that liberty
  has priority. Great material: LLM''s can discuss this. But I need to inject new/niche
  ideas so it''s not regurgitation. E.g., invent a variant: "the streaming musician"
  case — instead of Wilt Chamberlain, a case where 10 million people each add $1 to
