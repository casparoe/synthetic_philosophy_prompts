  hey — I''m a journalist, I cover tech and ideas, and I keep hitting the same move
  in interviews and I want to know how much weight it can actually bear.


  The move: "a virtual world is just a game of make-believe, like kids playing house
  or like reading a novel. Nothing real happens to anyone in there." I got it again
  last month from a studio exec I was interviewing about a game they''re sunsetting
  — players are going to lose inventories they''ve spent years and in some cases thousands
  of dollars assembling — and he used it to argue that (a) wiping that stuff isn''t
  destroying anyone''s property any more than burning a copy of a novel murders a
  character, and (b) stuff like griefing, or the VR groping cases, isn''t a real harm
  because nobody is physically touched. Then a month later I talked to a VR researcher
  who used the same make-believe framing to argue the opposite: that because it''s
  all staged, platforms have *more* responsibility, the way a theater company does,
  not less. Same analogy, opposite conclusions, which makes me think it''s doing all
  the work and nobody''s checking it.


  So: audit it. Give me the correspondence table — what plays the role of the props,
  the rules of the game, the players, the fictional truths, the pretense — and then
  where the mapping breaks. I especially want the breaks that matter for the conclusions
  above rather than the ones that are just philosophical scenery.


  Some things I can''t get straight myself and want you to sort:


  1. Where the causal work lives. My hunch: in make-believe, the pretend object''s
  causal powers are loaned to it by the participants'' imaginations, and they evaporate
  when everyone stops playing. In a virtual world they''re loaned to it by code running
  on somebody else''s machine, and it keeps state after I log off. Is that a real
  difference in kind or just a difference in how long the loan lasts? And does it
  matter that the lender is a company that can revoke it?


  2. Money and labor. Real cash changes hands, real servers and real devs'' hours
  hold the thing up. Does the analogy quietly import "nothing of value is being created
  or destroyed" from the fiction case, where that''s roughly true, into the virtual
  case, where it isn''t?


  3. The immersive version. Does the analogy''s verdict shift if we go from a text
  MUD to full-body haptics? Because if it says "no real harm" in both, I think that''s
  a reductio of the analogy rather than a finding about the cases. Or maybe the analogy
  fans should just bite the bullet, and if so I want to hear the version of that which
  isn''t obviously stupid.


  4. Which harms are even in question: harm to the person (fear, distress, the body''s
  stress response), harm to a social fact (a convention of ownership backed by payment
  and by other people''s recognition), harm to the object itself. Tell me which of
  these the make-believe framing can even express, and which it can''t describe at
