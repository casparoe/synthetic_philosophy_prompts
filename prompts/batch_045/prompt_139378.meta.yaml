  The hole argument setup:

  - Manifold M with a "hole" H (a region free of matter/non-gravitational fields).

  - Fix all fields outside H (on M\H), including the metric and matter fields, arranged
  so that they solve the field equations.

  - Let d be a diffeomorphism of M that is the identity on M\H (or at least on the
  boundary and outside) but non-trivial inside H.

  - Then g'' = d*g and matter fields also dragged along differ from g inside H but
  agree outside; if the field equations are generally covariant, both (M, g, T) and
  (M, g'', T'') are solutions.

  - Hence the state outside the hole (on a Cauchy surface... well, in the original:
  the matter distribution) fails to determine the metric inside H: determinism fails
  / the theory is "inadmissible."

  - Resolution (modern): the two models are related by a diffeomorphism and hence
  represent the same physical state — Leibniz equivalence. The residual worry: if
  you''re a manifold substantivalist who thinks the bare manifold points have identity
  independent of the fields, then g and g'' assign different properties to the same
  point p, i.e., genuinely distinct physical possibilities; so the substantivalist
  faces indeterminism. Relationists/Leibniz-equivalence folks say no problem.

  - Also: "the hole argument applies to any local spacetime theory" — including special
  relativity in generally covariant form; and Einstein''s eventual resolution; the
  "point-coincidence" argument (Stachel: the requirement is that coincidences be determined).

  - Sophisticated substantivalism: deny haecceitism, i.e., deny that diffeomorphic
  models differing only by which bare points have which properties represent distinct
  possibilities; then the substantivalist also avoids indeterminism, at the cost of
  the hole argument no longer discriminating between substantivalism and relationism
  (the "no verdict" / Butterfield-Maudlin debate).


