  Draft:


  ---


  I''m writing a short internal piece for the engineers I work with about how to talk
  about what''s inside the models we train, and I''ve run into a distinction I keep
  needing and can''t find a name for. I''d be grateful for your help carving it.


  Background, in my own terms. When people want to show that a network "represents"
  some feature X, they tend to offer one of two kinds of evidence, and I''ve become
  convinced these are genuinely different:


  *Read evidence.* From the internal state alone I can predict, better than chance,
  whether the system''s output will treat the input as an X. I''ve done this with
  a small classifier I trained: a direction in the activations predicted the label
  almost perfectly, and I was tempted to say the thing had learned the concept.


  *Write evidence.* I can push the internal state along some direction and the system''s
  behavior changes in the way I''d expect if it had come to believe X — or, often,
  in a pile of other ways too (the same push also changes outputs that have nothing
  to do with X, sometimes more than it changes the X behavior).


  In my own experiments the two come apart constantly. Some states are good for predicting
  and useless for steering; some are the reverse; a few do both, and those are the
  ones that convince me. And I''ve noticed the argumentative pattern that follows:
  the read evidence and the write evidence get cited interchangeably, and when one
  is challenged the other is quietly substituted — "you can''t steer with it? fine,
  but look, it decodes" — so that the claim "the network represents X" never quite
  rests on a fixed criterion.


  Three questions:


  1. Is there an established name for the two kinds of evidence, and for the gap between
  them? I''ve been privately calling states "markers" (read-good) and "handles" (write-good)
  and using "leakage" for the collateral changes under a write, and I''d like to know
  whether there''s vocabulary I should be using instead.


  2. Does the gap have a bearing on the question of whether these systems really have
  representations? It''s not obvious to me in which direction. A handle that changes
  behavior looks like the best possible evidence for a causal role; but a handle that
  changes everything might be no more than a volume knob, and a marker that predicts
  perfectly might be the system''s own forecast of what it is about to say, rather
  than a record of anything it noticed.


  3. If nothing established fits, I''d like a coinage with a definition and, more
  importantly, boundary cases: what would a state look like that is clearly a representation
  under your account, what would clearly not be one, and which of the awkward middle
  cases (marker-but-not-handle; handle with heavy leakage; both, but only after fine-tuning)
  should be counted in?


  I''m not asking for a literature survey — I couldn''t chase references anyway —
  and I don''t want a name if a name is all there is. What I want to know is whether
  the distinction is doing real work or whether I''ve mistaken a difference in my
  measurement tools for a difference in the system.


  Please keep your reply under 600 words.


