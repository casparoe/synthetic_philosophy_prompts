  Draft:


  ---


  I am a high school senior writing an extended essay for a school history-of-ideas
  competition, and the section I am stuck on is a speculative one, so I would like
  your help reasoning it through rather than a list of things to read (I have to footnote
  everything myself anyway, and my school blocks most journal sites).


  The essay is about a single thread: how people have argued that you should size
  a bet or an investment. My current understanding is this. In 1738 Daniel Bernoulli
  proposed, in his paper on the St Petersburg gamble, that what matters is not the
  money you gain but the usefulness of that gain to you, and that an extra dollar
  matters less the more you already have; written down as an equation, that gives
  a logarithmic curve. Roughly two centuries later, Kelly, working at Bell Labs, derived
  a formula for what fraction of your money to risk on a favourable bet, by asking
  what makes your capital grow fastest over many rounds. On paper the two rules look
  like the same rule: both end up telling you to care about the logarithm of your
  wealth. So my working thesis for the essay is that Bernoulli had already discovered
  the right answer in 1738 and Kelly merely rediscovered it, and that nothing important
  happened in between.


  Here is where I want to put Bernoulli in front of something he never saw. Suppose
  we hand him the description of a modern daily-rebalanced triple-leveraged index
  fund and this little calculation: imagine the index goes from 100 to 90 on the first
  day and back to 100 on the second. The index has gone nowhere, but the 3x fund goes
  100 → 70 → 93.3, so it has lost about 6.7 percent. Multiply that over a year of
  choppy markets and you get funds that can finish below where they started in periods
  when the underlying index finished higher. Would Bernoulli say that this is his
  point all over again, just dressed up in modern finance? Or would he say it is a
  different phenomenon from the one he was writing about, because he was worried about
  a single choice and the diminishing usefulness of money, not about what repeated
  multiplication does to you over time?


  The second thing I want his reaction to is a simulation I ran on my laptop. Take
  a bet where you win with probability 0.6 and get back twice what you staked, offered
  to you 100 times in a row, and compare two strategies: risk 20 percent of your current
  money every time (the Kelly fraction, I think) against risking everything every
  time. In nearly every single run, the 20 percent strategy ends up far richer. But
  if I average over all the runs instead, the all-in strategy wins by an absurd margin,
  because of the tiny handful of runs where it never loses once. My teacher says this
  shows there are two different questions here, and that Bernoulli only ever asked
  one of them. I am not sure I understand what she means, and I am not sure which
  of the two numbers Bernoulli would have thought relevant.


  So my questions, put together: given what Bernoulli actually argued and the reasons
  he gave for it, how do you think he would have reacted to the leveraged-fund example
  and to my simulation? Would he have told the hypothetical investor to use the Kelly
  fraction, to stay out entirely, or something else, and on what grounds? Would he
  have accepted that the growth-rate argument is a separate argument from his own,
  or would he have thought it was just his utility curve restated?


  [confusion to be corrected] If my thesis that Kelly adds nothing to Bernoulli is
  wrong, I would rather be told now than after I submit it — please say so plainly,
  and say exactly where the two come apart, if they do. One place I suspect they might:
  my friend says that if some of your money is not in the bet at all (money you will
  never risk), then caring about the log of your total wealth and caring about the
  growth rate of your betting money stop giving the same answer. I cannot see why
  that would be, but if it is true it seems to break my thesis.


  Finally, since this is going into a graded essay: please be explicit about how confident
  you are in each of the main things you tell me, and single out the one claim you
  are least sure of, so I know which part I need to check against a real source before
  I rely on it. Please also flag anything that is your own reconstruction of Bernoulli''s
  likely reaction as opposed to something he actually wrote.


