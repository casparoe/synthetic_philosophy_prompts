  Ideas for Hobbes + geometry crux:

  - Hobbes''s constructivism: geometry is certain because we make (construct) its
  objects by motion; but Hobbes''s constructivism is *materialist* — the objects of
  geometry are bodies, and the constructions are motions of matter. Tension: if geometric
  objects are (or are abstracted from) material bodies, geometric truths look empirical/contingent
  (depending on how matter actually moves), yet Hobbes wants demonstration to be necessary
  and a priori. Crux: how can Hobbes have both? A good question: "Hobbes grounds the
  certainty of geometry in our construction of its objects, but he also holds that
  the objects of geometry are bodies (or abstractions from bodies) and that the constructions
  are real motions. Does the materialist reading of Hobbes''s constructivism undermine
  the necessity he wants? Give the strongest reconstruction that avoids this."

  - Another: Hobbes''s definitions are "causal" (definitions by generation) — a definition
  states the cause/genesis of the thing. For Hobbes, to know the cause is to know
  the thing, and geometry gives causes. But circles can be generated in multiple ways
  (by rotating a line segment; by conic section; by an equation), so which generation
  gives the definition? And Hobbes''s circle-squaring attempt came from a particular
  construction. Crux: multiple generations → which is definitional? Nice and in the
  weeds.

  - Another: the "angle of contact" — Hobbes vs. Wallis: Hobbes held that the angle
  between a circle and its tangent at the point of contact is a genuine angle of nonzero
  quantity (because the point has some magnitude / the line has breadth). This follows
  from his materialist/constructivist account. Crux: is Hobbes committed to it? Is
  it a bug or a feature? And Wallis argued from arithmetic/algebra (indivisibles,
  arithmetica infinitorum) vs. Hobbes''s geometric construction. Good.

