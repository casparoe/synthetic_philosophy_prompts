  they want positions, not summaries. Here is my bundle; I''d like an audit of it
  rather than a survey of the literature.


  The framing I''ve been using is to split the anti-planning case into three separable
  complaints, which I call the index problem (there is no common unit in which to
  compare heterogeneous capital goods and production plans once the means of production
  are not exchanged), the update problem (the knowledge relevant to allocation is
  dispersed, local, largely inarticulate, and changes faster than any central procedure
  can register), and the loss problem (the person or office setting a price does not
  bear the loss that follows from setting it wrong, and there is no mechanism that
  reliably removes them when they get it wrong). My commitments are: (1) the index
  problem is answered — Oskar Lange''s model, in which a central board announces factor
  prices and instructs managers to minimize average cost and to expand output until
  price equals marginal cost, then revises prices in the direction of excess demand,
  is a genuine solution in principle to the problem as Mises stated it; (2) the update
  problem is the real objection, and it is the one Lange cannot meet, because a trial-and-error
  price revision that would converge on a stationary world is worthless when the data
  are re-made faster than the iteration, so the board is always computing the answer
  to last quarter''s economy; (3) the index problem and the update problem are not
  rivals — holding (1) and (2) together is fine, because solving the first is exactly
  what lets you see the second clearly; (4) planning as such is not refuted by Hayek''s
  argument, since large firms are planned hierarchies that allocate capital internally
  by shadow rates and transfer prices set by committees, and they do this at a scale
  larger than many states, and the boundary between firm and market is set by comparative
  transaction costs, which is a question of degree and not of principle; (5) about
  a third of what actually went wrong in the command economies had nothing to do with
  either index or update — quantity quotas, ratchet effects on targets, chronic shortage,
  investment hunger, and the absence of anyone who could go bankrupt — i.e. the loss
