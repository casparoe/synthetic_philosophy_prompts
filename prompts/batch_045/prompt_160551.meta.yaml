  positing the data is exactly what begs the question against him; (7) finally, I
  think the "who adjusts the adjustment rule" worry — the meta-rule problem, as I''ve
  been calling it — cuts both ways and cannot be used against Lange alone, because
  the price system has no market in interest-rate rules either, and someone has to
