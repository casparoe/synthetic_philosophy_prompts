  The novel (in progress, third draft) turns on a figure I call the Sink. She is a
  young woman in a small town; nothing about her is exotic except one thing: her capacity
  to be benefited has no ceiling. Give her a loaf of bread, an hour of someone''s
  company, a room with a window, and she experiences a quantity of wellbeing that
  no hundred of her neighbors could extract from the same loaf, hour, or room. There
  is no saturation point: her returns are not just high, they are unbounded.


  I built her this way on purpose, to close the usual exits:


  - She is badly off to begin with, so she cannot be discounted as someone who already
  has enough.

  - She is not responsible for her constitution — it is congenital — so the "expensive
  tastes" reply (that we may ignore needs a person cultivated in herself) is unavailable.

  - She is one of us psychologically: continuous, self-aware, capable of love and
  of long projects, and her wellbeing is of the same kind as everyone else''s, not
  some alien currency. So she cannot be excluded as not a member of the moral community
  or as speaking a welfare language we cannot compare.

  - She is unique and her condition is not transmissible or imitable; there is no
  way to become like her and no way to make another. So the incentive-based and expressivist
  replies — that feeding such a creature would invite others to cultivate monster
  appetites, or would express contempt for ordinary human life — have nothing to work
  on.


  What remains, it seems to me, is the bare structural feature: an extremely high
  and unbounded rate of conversion from resources into welfare.


  Against that, here is the argument.


  (1) When one person would gain more from a resource than another would lose by giving
  it up, and the transfer can be made, it is morally required — this is, in its plainest
  form, the reason we think anyone owes anything to the badly off.

  (2) What makes a gain or a loss matter here is welfare and nothing else; the comparison
  in (1) is exhausted by how much welfare is at stake on each side.

  (3) The Sink gains more from any unit of resource than anyone else in the town gains
  or loses by it — by construction.

  (4) Therefore every transferable good ought to go to the Sink.

  (5) The consequential version: the town should hand over its harvest, its medicine,
  its school, its instruments; and since her returns have no ceiling, there is no
  stopping point short of that.

  (6) That is not merely demanding. On (4), no other life is permitted to flourish
  for its own sake: every project, relationship, and piece of art in the town is at
  best a means to her states, and the novel''s ordinary moral world — the one my readers
  are meant to care about — has no standing.


