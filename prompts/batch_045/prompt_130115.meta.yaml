  The subtle flaw: In (2), "if deterrence fails, retaliation can''t prevent anything"
  — but retaliation can prevent *further* attacks (limited war, second wave) and can
  shape the post-war order; and more importantly, the move from "retaliating at t2
  has negative EV conditional on the threat having failed" to "the threat cannot be
  rationally made" ignores that at t1 the agent''s choice is between policies (packages
  of disposition + probability of use), not between individual acts; expected value
  must be assessed over the whole policy, and the counterfactual "if I were the kind
  of agent who retaliates, the strike would not have happened" is not available at
  t2 but is the whole point at t1. Also there''s the "deliberation crowds out prediction"
  issue: at t2 knowing you''re the retaliating type changes the probability that you''re
  at t2. And (4)''s equivocation between "intending" and "predicting you will": you
  can rationally intend to A without predicting you will A; intentions are not predictions
  (this is the Kavka/Hintikka/Bratman point). Also (5): threats can work via commitment
  devices, delegated authority, "threat that leaves something to chance" (Schelling),
  imperfect rationality/reputation, or via the fact that the threatener''s future
  self has different reasons; and "believed to have the intention" ≠ "actually has
  the intention" (you can be believed to be irrational).


