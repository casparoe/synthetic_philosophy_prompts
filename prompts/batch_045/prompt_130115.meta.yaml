  Draft argument (as the asker''s friend''s):


  (1) Rationality of action: it''s rational to do A at t only if, at t, doing A maximizes
  expected value given what you then believe and want. (Standard.)

  (2) If deterrence succeeds, the threatened act never has to be performed; if deterrence
  fails, the threatened act has already failed to prevent the thing it was meant to
  prevent, so performing it then can only add destruction without preventing anything.
  (The classic: retaliation after a first strike cannot undo the strike.)

  (3) So at the moment of decision, retaliating always has negative expected value,
  whatever has happened. → irrational to retaliate.

  (4) An agent cannot rationally intend at t1 to do what it knows at t1 it will have
  conclusive reason not to do at t2 (no reason to intend what you''ll have no reason
  to do; intending is for guiding action).

  (5) A threat is effective only if the threatener is believed to have the relevant
  intention/propensity; you cannot rationally make a threat whose execution you know
  you can''t rationally intend.

