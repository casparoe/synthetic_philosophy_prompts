  I help run a local history society and I also sit in on a reading group that''s
  slowly working its way through the philosophy of history stuff — we did Carr a while
  back (the bit where he says the facts of the past only become historical facts once
  some historian decides to call them up, which I thought was obviously right and
  also obviously a bit of a dodge) and we''re about to start Hayden White, and there''s
  a thing I keep noticing in the actual history books I read that I don''t have a
  word for.


  Here''s the thing. Take two recent books on, say, the collapse of a communist regime
  — or honestly take any pair of books on the same event. At the level of the individual
  sentence, they agree almost completely: dates, who was in the room, what the decree
  said, what the harvest figures were. The footnotes check out. And yet the books
  tell you completely different stories — one starts in 1956 and the other starts
  in 1985, one treats the economy as the thing that moved and the other treats a handful
  of individuals'' decisions as the thing that moved, one ends with the wall coming
  down and the other ends four years later. Now here''s the part I actually want a
  word for. When a reviewer points out that a book has left something out — a famine,
  a faction, a whole decade — the author very often fixes it in the second edition.
  The missing bit goes in, sometimes as a couple of paragraphs, sometimes as a long
  footnote. And the story doesn''t change. Not a bit. The new fact gets absorbed into
  the existing shape without disturbing it, sometimes it even seems to make the shape
  more convincing, and the reviewer''s original complaint — which was never really
  about the missing fact anyway — is still just as live as it was before. I''ve now
  seen this happen enough times that I think of it as a rule: factual correction and
  narrative shape are, as far as I can tell, completely decoupled, and everyone in
  the field behaves as if they know this while also continuing to argue as if the
  facts were going to settle something.


  So: is there a name for that? Specifically for the absorption property — the fact
  that you can add true material to a historical account without changing what the
  account is *about*, and that adding it doesn''t count as the account having been
  wrong. I don''t think I mean the same thing as "the facts are selected" (fine, they
  are, but selection is about what''s in, and this is about what happens to what''s
  in after it''s added) and I don''t think I mean the "theories are underdetermined
  by evidence" thing from philosophy of science either, because in science the extra
  data at least sometimes forces you to give up the theory, whereas here I can''t
  think of a single case where a corrected detail forced a historian to change the
  story. Is this a real, discussed thing with a literature, or is it just something
  I''ve invented out of reading too many books about the same events? If there''s
  nothing established, what would you call it and how would you define it so that
  it doesn''t just collapse into "narratives have shapes" — and what would a case
  where correction *did* force a re-shaping even look like, so I know what to be on
  the lookout for?


