  Draft:


  I am a novelist with one major revision left on a literary novel, roughly six months
  of full-time work before copyediting, and an audience that reads fiction for character
  and style rather than for argument. Recently I have been persuaded, at least for
  the sake of this project, by W. E. B. Du Bois''s argument in his 1920s writings
  on art that art cannot avoid being propaganda: every novel, including one that never
  mentions politics, still advances some vision of who counts as a person, which lives
  are narratable, and what a reasonable social order looks like. Assume that this
  is true for the purpose of the question. My end is narrow and practical: I want
  the finished book to leave its readers with a slightly different imaginative sense
  of what is possible in housing policy, not by inserting speeches or converting the
  book into a tract, but by shaping the material where its propaganda actually lives.


  To think about that, I have been using a rough distinction of my own. First, there
  is the level of explicit thesis: the political views characters state, endorse,
  or refute in dialogue and narration. Second, there is the level of narrative form:
  choices about point of view, which characters are granted interior depth, what motives
  are treated as intelligible, how the plot distributes sympathy and resolution, and
  what the ending presents as livable or unlivable; on this level, propaganda can
  be carried by craft rather than by assertion. Third, there is the level of self-presentation:
  whether the book admits and foregrounds its own partiality, or presents its framing
  as simply the way things are, and how that admission changes a reader''s trust.
  Call these the thesis level, the formal level, and the reflexive level.


  My question is an agenda-setting one. Given limited revision time and a novelistic
  rather than philosophical toolkit, which two or three open questions about how to
  turn Du Bois''s claim into practice should I investigate first, and in what order?
  I do not want a survey of everything one might say about propaganda in art, and
  I do not want a reading list or citations; I cannot follow them. I want a defended
  priority list of at most three lines of work. For each, tell me: what exactly the
  question is; why it is upstream of other artistic decisions, in the sense that settling
  it would make many later choices easier or would change what counts as a good later
  choice; how tractable it is for a working novelist using only reflection, drafts,
  and perhaps a few trusted beta readers, rather than for a philosopher with unlimited
  time; and what concrete evidence over the next six months would move it up or down
  the list, such as which passages early readers call preachy, or which characters
  they say they could not understand.


  Please also make the criteria explicit: say how much weight you are giving to importance,
  tractability, neglectedness, and how many other decisions depend on the answer,
  and describe one trade-off where you deliberately deprioritize a question that is
  philosophically deeper but would not change my revision. Then give the ordering.


