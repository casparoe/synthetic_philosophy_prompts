  or whether I''ve quietly helped myself to things that don''t fit.


  Here''s roughly where I''ve landed:


  1. I don''t want to give up ordinary classical reasoning where it works. Modus ponens,
  conjunction introduction and elimination, conditional proof — all fine, and I want
  them to stay fine. The only classical rule I''m willing to drop is that a contradiction
  entails everything (explosion, I think it''s called).


  2. I think some contradictions are actually true. The semantic one: the sentence
  that says of itself that it is not true — I''ve become convinced the right answer
  isn''t "neither true nor false" but "both". And I have a second candidate, which
  is why I got interested at all: I''m tempted to say that a quantum system in a superposition
