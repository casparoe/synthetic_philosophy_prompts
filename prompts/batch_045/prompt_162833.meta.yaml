  at that position, at the same time and in the same respect. (My physics-side intuition
  keeps pushing me here, even though I know there''s some subtlety about eigenstates
  and about what "not at that position" even means in the formalism.)


  3. What actually convinces me about paraconsistent logic is mundane rather than
  exotic: working scientists regularly reason with theories and data sets they know
  are mutually inconsistent — the early quantum atom with orbiting electrons that
  didn''t radiate, two instruments disagreeing about the same sample, a model that
  works at one scale and contradicts the model that works at another — and a logic
  in which one contradiction licenses any conclusion whatsoever would make that practice
  impossible. So we should be using a logic where contradictions don''t explode.


  4. But I don''t think that commits me to very much. I want to say: in almost every
  case a contradiction in science is a sign that something has gone wrong — bad calibration,
  wrong idealization, a limit we''ve pushed too far — and the paraconsistent logic
  is just the tool that lets us keep working while we figure out which bit to drop.
  True contradictions are rare and special. Only the semantic paradoxes, and maybe
  my quantum case.


