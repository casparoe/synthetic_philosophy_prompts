  actual causation (Halpern-Pearl vs. Woodward); "causes of effects" vs "effects of
  causes" (Gelman & Imbens); the "fundamental" vs "non-fundamental" causation debate
  (Woodward accepts non-fundamental causal claims; interventionism about macro causation);
  proportionality (Yablo) — a cause should be proportional to its effect.


