  Interventionist vs counterfactual theories of causation: Woodward''s interventionism
  — causation as what would happen under interventions; counterfactual theories (Lewis)
  — dependence of effects on causes via possible worlds. Classic problems: preemption
  (late preemption, symmetric overdetermination), double prevention, causation by
  omission/absence, "actual" causation vs type-level causation, and the distinction:
  interventionism is a kind of counterfactual theory but adds the intervention constraint
  (an intervention on X must not affect Y except through X, must be exogenous, etc.).
  Key: interventionism handles cases where naive counterfactual dependence fails,
  e.g. switches with backup, and handles negative causation/omissions poorly (since
  you can''t intervene on an absence), and the problem of "actual causation" in law/moral
  responsibility — Halpern & Pearl.


