  Let me think about which work best dramatizes interventionism''s distinctive features:

  1. Interventionism: X causes Y iff there''s a possible intervention on X that changes
  Y (holding other causes fixed appropriately). Requires interventions be "surgical".

  2. Counterfactual (Lewis/Stalnaker): Y counterfactually depends on X; worries about
  similarity of worlds, backtracking, "causal chains" vs. "quasi-dependence".

