  I teach a first-year epistemology module and I am putting together a seminar that
  pairs Wittgenstein''s late notes, published posthumously as _On Certainty_, with
  Sidney Lumet''s 1957 film _12 Angry Men_ (Reginald Rose''s jury-room drama). The
  hook I want to give students is that a jury is a community institutionally required
  to doubt: twelve strangers are locked in a room and told that before they can act
  they must be certain, and the film then watches them discover, one by one, that
  the things they were certain of rested on a great deal they never examined. But
  I have become unsure how far the fit goes, and I would like a reading of the film
  through hinge epistemology that is willing to say where the fit breaks down. To
  make the discussion manageable I''ve been using a distinction of my own: evidential
  doubt, which cites some specific way the case might have gone wrong (the knife might
  not be unique, the witness across the street may not have been wearing her glasses,
  the old man could not have reached the door in time), and architectural doubt, which
  targets the framework within which those specific doubts get their force and does
  not itself point to any particular error. I also want to press a phenomenon the
  film dramatises better than any paper I know: what I call evaporative doubt, the
  state Henry Fonda''s Juror 8 seems to be in at the opening vote, when he cannot
  say what is wrong with the prosecution''s story but reports that it does not hang
  together, and is quite reasonably mocked for it by the others.


  Three things I would like you to work through. First, is Juror 8''s early stance
  best described as a Wittgensteinian doubt at all, or does it look more like the
  Cartesian doubt Wittgenstein is objecting to, and if it is the latter, does the
  film nonetheless vindicate it in a way that should embarrass the hinge reading?
  Second, consider the two holdouts against acquittal. Juror 3''s conviction that
  the boy is guilty is not responsive to evidence in the way a belief is: it organises
  everything else he says, and it collapses rather than being refuted, at the end,
  in the scene with his son''s photograph and the coat. Juror 10''s claims about people
  from the slums function similarly but are straightforwardly bigoted. My worry is
  this: if a hinge is defined by its functional role—unjustified, unshaken, standing
  fast for the one who holds it—then nothing in the definition distinguishes a healthy
  hinge from Juror 3''s or Juror 10''s, and the film becomes an argument that hinge
  epistemology owes us a normative account it does not obviously have. Is that fair,
  or is there a response available from within the framework (say, by insisting that
  genuine hinges are essentially shared, so that an idiosyncratic or corrupt one is
  not a hinge but a prejudice in hinge''s clothing)? Third, the verdict at the end
  is not that the boy is innocent; it is that the case has not been proved. Does the
  film thereby take a quiet position on whether legal inquiry aims at truth or at
  the proper termination of inquiry, and does that position comment on anything in
  the Wittgensteinian literature?


  A few constraints, if you would humour them. I would like the answer in British
  English, and I do not want a plot summary, a reading list, or citations—I know the
  film and I can supply the bibliography myself. More important: please mark, as you
  go, which of the claims you rely on are ones that nearly everyone working on _On
  Certainty_ would accept, and which are genuinely contested—in particular the questions
  of whether hinges are propositions or beliefs or neither, whether they can be true
  or false at all, and whether the variability of hinges across communities pushes
  one toward something like epistemic relativism. I do not want to hand first-years
  a contested reading dressed up as orthodoxy. Please also tell me plainly where my
  reading is stretching: if the film is really about courage and conformity rather
  than about the structure of doubt, or if evidential, architectural and evaporative
  doubt turn out to be less separable than I have made them sound—or if my distinctions
  just collapse into ones already standard in the literature—say so. And I would be
  grateful if you flagged anything you are inferring about the film from the fact
  that it is famous rather than from the film itself.


