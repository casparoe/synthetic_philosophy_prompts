  "The question is whether genetic talk of codes and information is literal or metaphorical,
  and I''ll argue it''s literal at the level of codon-to-amino-acid translation but
  metaphorical when extended to phenotypes.


  What would it take for something to be a code in the literal sense? A code needs
  (a) a mapping between two independent systems of elements, (b) that mapping being
  arbitrary or conventional in the sense that it isn''t forced by the intrinsic chemistry
  of the elements, and (c) some physically realised mechanism — a decoder — that actually
  implements the mapping. The genetic code satisfies all three. There is a mapping
  from 64 codons to 20 amino acids plus stop; it is degenerate, and degeneracy is
  just another word for ambiguity, since which amino acid a codon yields depends on
  which tRNAs the cell happens to have and on context-dependent recoding, so even
  at the level of codons there is no single determinate mapping. [error A] The mapping
  is also contingent: Crick''s frozen accident hypothesis holds that the assignments
  were fixed early and then could not be changed, and the near-universality of the
