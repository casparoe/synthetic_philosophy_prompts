  I''m retired now — spent 35 years in experimental physics, mostly condensed matter
  and instrumentation — and for the last year or so I''ve been going to a philosophy
  of mind reading group at the local university. They''ve asked each of us to write
  down where we''ve landed so the others can have a go at it. I''ve tried to do that
  below and I''d like an audit before I hand it in. I''m not after a summary of the
  positions, and I''ve read enough to know the standard names; I want to know whether
  my particular package actually holds together.


  Where I''ve landed:


  1. Mental states are functional states. What makes something the belief that it''s
  raining is the causal role it plays, not what it''s made of. So no neural identity
  claims.


  2. Multiple realizability, and I mean it without limits: silicon, aliens, an upload,
  nothing about carbon or wet chemistry is essential. I think of MR as a claim about
  which descriptions are stable, not about how many realizers happen to exist — the
  functional description is the one that survives perturbation of the substrate, which
  is the only sense of "multiple realizability" I care about.


  3. Mental states do real causal work. Psychological explanations cite genuine causes
  and I''m not an epiphenomenalist about anything.


  4. Physics is causally complete. Every physical event that has a cause has a sufficient
  physical cause, and nothing mental is a spooky extra ingredient.


  5. Psychology has its own real generalizations and doesn''t need rewriting in neural
  vocabulary to be respectable science. This was the thing that put me off the identity
  theory in the first place.


  6. My instincts are reductionist: I still think a good explanation gets cashed out
  in a lower-level mechanism eventually, and I expect neuroscience to explain memory
  and perception properly one day.


  7. Two case verdicts. (a) A gradual replacement — one neuron at a time swapped for
  a functionally equivalent silicon unit — would preserve the person''s consciousness
  all the way through, and I lean on that as my main reason for substrate independence.
  (b) A giant lookup table: no interesting internal states, just an enormous list
  of inputs and outputs, that nevertheless behaves exactly like a conscious person
  in every conversation and every test we can devise. I want to say that thing is
  NOT conscious. But (and this is the bit that bothers me) I also want to say that
  how fast or how big the realizing hardware is makes no difference to what a creature
  thinks — speed and memory size aren''t the sort of thing that could matter to mentality.
