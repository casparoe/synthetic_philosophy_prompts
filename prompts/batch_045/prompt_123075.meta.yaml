  it) quietly assumes they come to the same thing. Relatedly, one of the engineers
  has proposed a cheaper variant he calls self-cross-examination: a single model produces
  an answer, then produces the strongest case against its own answer, and a human
  picks whichever survives; I want to know at what point in the sequence I should
  deal with this, because I think explaining why it fails is itself the cleanest way
  into why two adversarial debaters are doing any work at all, but I worry it will
  sound like I am dismissing his idea before I have motivated the problem.


