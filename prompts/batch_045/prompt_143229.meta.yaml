  there in twenty years, the engineers say roughly one more per decade if we leave
  it, and the rebuild basically eliminates that risk. Option B is 200 small pedestrian
  retrofits scattered across the network (refuge islands, tightened turn radii, lower
  speed limits on approaches): the model says 2 to 3 statistical lives in expectation,
  but delivered as tiny risk reductions to a couple hundred thousand people, most
  of whom will never notice, and where maybe two thirds of the "benefit" never cashes
  out as an actual avoided death in any given decade. Our standing rule is a cost-per-statistical-life-saved
  threshold with a ceiling, and it picks B without breaking a sweat.


  What wrecked the meeting was a new member — retired philosophy teacher, quite insufferable
  about it — who said this is exactly the aggregation that Scanlon-style contractualism
  is meant to block: our rule answers the complaint of whoever dies at Elm Street
  by pointing at the sum of a hundred thousand people''s trivial risk reductions,
  and the principle that licenses summing them is precisely the kind of thing that
  person can reasonably reject, so we''re not allowed to do it. Someone shot back
  that B also burdens nobody above any threshold and benefits nobody above any threshold,
  so on her own logic B is indistinguishable from doing nothing and we should spend
  the money on bike lanes. A third member says the whole worry is an artifact of framing:
  nobody is identified in advance, everyone is facing a probability, and the objector
  is just moved by the fact that you can point at Elm Street on a map, which isn''t
  a moral difference at all. I floated a compromise and nobody liked it much: treat
  the diffuse statistical benefit as a tie-breaker between options that are each justifiable
