  Title idea: "Borrowed Standards: Montaigne''s Cannibals and the Uses of Relativism"


  §1 Setup: the essay opens with Pyrrhus; Montaigne''s paraphrase of the point: don''t
  trust vulgar opinion, judge by the eye of reason. Note the irony: the essay that
  is always enlisted for relativism opens with a demand to judge by reason rather
  than report.


  §2 Two relativisms: costume relativism (tastes, dress, beards, greeting customs,
  whether the king is carried on shoulders, the idealization of nakedness and of their
  poetry and their lack of magistrates, property, litigation) vs. reason relativism
  (whether there are reasons that apply across practices — e.g., that gratuitous cruelty
  is bad). Claim: the descriptive material licenses only costume relativism; the polemic
  against Europe needs a cross-cutting standard, hence the essay needs reason relativism
  which it never argues for.


  §3 The actual work is done by a shared ranking, not by relativism: Montaigne''s
  defense isn''t "it''s their custom"; it''s comparative — he concedes that eating
  enemies is horrible but says European practices (burning/mutilating living men in
  the religious wars) are worse. That comparison requires the ranking "cruelty to
  the living is worse than killing," which is precisely a non-relative standard. Call
  this comparative vice-minimization. So relativism is idle in the argument''s actual
  work — it''s a framing device, not a load-bearing premise.


