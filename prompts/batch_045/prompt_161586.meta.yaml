  Draft:


  "Two members of a consciousness-science reading group I sit in on have been arguing
  for weeks about method, and they''ve asked me to adjudicate. The lab is designing
  a study on near-threshold vision: a stimulus is flashed at intensities where subjects
  sometimes say ''I saw nothing'' yet still discriminate the stimulus above chance.
  The question they''re stuck on is what the report is evidence of, and the argument
  went like this.


  Nina (defending [Dennett-style] heterophenomenology): ...


  Marcus (defending trained introspection / explicitation interviewing): ..."


  Let me write the moves fully, with four to six moves, plus perhaps a final concession.


  Move 1 (Nina): The virtue of heterophenomenology is that it doesn''t presuppose
  the answer. You take everything the subject produces — what they say, their button
  presses, their confidence ratings, their reaction times — as a text, and you construct
  from it the subject''s world: the world as they take it to be. You then look for
  third-personally stable correlates of that constructed world. You never have to
  rule on whether the subject''s avowal is true, so the method can''t be held hostage
  to the very thing under investigation.


  Move 2 (Marcus): That''s exactly what''s wrong with it. At the point where it matters,
  your method goes quiet. The whole question in the near-threshold study is whether
  ''I saw nothing'' is correct — whether there was an experience the subject didn''t
  avow. You cannot answer that by accumulating more texts, because every channel you
  add (forced choice, wagering) is still just behaviour. You''ve quietly swapped the
  explanandum: the output is a science of what subjects say, plus a correlation, and
  the thing we wanted — the experience — never appears.


  Move 3 (Nina): I don''t go quiet, I go quieter, and that''s the right setting. The
  finding in this study just is the divergence: the subject''s constructed world contains
  no stimulus, while her discriminative behaviour tracks it. That divergence is third-personally
  checkable, replicable, and it survives every change of mind about what consciousness
  turns out to be. Yours doesn''t. The moment you treat the avowal as (sometimes)
  authoritative you''ve adopted an unvalidated measuring instrument, and, worse, one
  that can''t be checked, because you have no access to the quantity except through
  it.


  Move 4 (Marcus): Every science starts with unvalidated instruments and calibrates
  them by triangulation, and you can''t triangulate without some assumption about
  what the reports are about. Here''s what calibration looks like. After training
  in descriptive interviewing, subjects stop using one category — ''I saw nothing''
  — and start using three: ''nothing'', ''something I couldn''t identify'', ''something
  indefinable but present''. Those three track different discrimination performance,
  stably, across subjects. That''s an instrument being calibrated against an independent
  measure. On your view all three are just more texts, with no way to say that the
  later ones are more fine-grained than the earlier ones, so you can''t even describe
  the improvement, let alone use it.


  Move 5 (Nina): I can rank texts — by intersubjective stability, by coherence, by
  predictive power — so I can absorb your trained reports as better data. But note
  the asymmetry: you assume the trained report is closer to the facts, and you have
  no independent check on that; I can detect a report going wrong third-personally.
  Hard case. Take patient R: dense amnesia for ongoing experience. While the stimulus
  is present he describes it accurately; a minute later he has no memory of it and,
  asked to describe it, confabulates fluently and confidently. My method has no problem:
  the concurrent report is good text, the later one is bad text, and I can tell the
  difference without knowing anything about his experience. Your method is built on
  retrospective explicitation, so on R it manufactures confident confabulation and
  calls it data.


  Move 6 (Marcus): Granted, and I''d run concurrent reports too — but that''s a concession
  about timing, not about metaphysics, and you haven''t answered my objection. Mirror
  case. Take subject S: no memory deficit, full attention, and in real time she reports
  nothing whatsoever — no avowal, no confidence shift, no behavioural signature. Two
  weeks later, under a trained protocol, she reports a stable, structured, richly
  articulated experience of that stimulus, insists it was there all along, and can
  now be trained to discriminate it on demand. You have two texts and a change in
  behaviour. If your response is ''the texts are what they are; there''s nothing more
  to say'', then your method is compatible with every possible distribution of first-personal
  facts and therefore detects nothing. Calling that neutrality doesn''t make it metaphysically
  innocent; it''s the claim that nothing exists beyond the third-personal trace, wearing
  a methodological hat.


  Move 7 (Nina, maybe): Then let''s have the claim out in the open rather than disguised:
  I think there is no fact of the matter about S that outruns what is third-personally
  available, so ''was the experience there all along?'' is not a question with an
  answer that my method is failing to deliver. You owe me an account of what would
  make the later report correct rather than merely later — and you can''t give one
  that doesn''t either collapse into more behaviour or appeal to a private object.


