  ---


  I''m a third-year materials science major, and this term I''m taking a metaphysics
  course where we''ve spent two weeks on dispositions: the idea that to be fragile
  is to be such that one would break if struck, and then all the ways that idea gets
  into trouble — cases where the triggering condition itself cancels the disposition,
  cases where something else stops the manifestation from happening even though the
  disposition is still there, and cases where the manifestation happens anyway, produced
  by something that has nothing to do with the disposition. My professor treats these
  as problems for a philosophical analysis; I''ve been reading them as a description
  of my job, and I want to turn them into something I can actually use.


  I work twenty hours a week as a student technician at a small independent product-safety
  lab. We certify consumer goods for a handful of retailers'' own-brand lines: roughly
  a dozen requests a week, each of which I turn into a one-page recommendation that
  a staff engineer signs off on in about fifteen minutes, and the wording then ends
  up in front of insurers, customs brokers, and occasionally a lawyer. The constraints
  are tight. Most of our tests are destructive, so we can only ever test a sample
  and the certificate is really a claim about a production process rather than about
  the unit on the shelf. We can''t reproduce every condition a product will meet in
  the field. Some of our tests alter the thing tested — a closure that must be opened
  repeatedly to be tested, a battery that is partly drained by the self-test. And
  the certificate has to be written in language a retailer will print, which means
  short, unhedged words like "waterproof" or "child-resistant" covering what are actually
  thresholded, statistical, context-sensitive claims.


  My own sketch, which I don''t trust, is a four-question loop: name the manifestation;
  name the conditions; check whether the conditions could remove the disposition;
  check whether anything else present at test time could be producing the manifestation
  instead. Please turn this — or replace it — into a decision procedure I can actually
  run in the time I have: the questions in order, what counts as a sufficient answer
  to each, the point at which I stop and write "not certified," and the points where
  the procedure has to hand the question to a person because the remaining issue is
  how much risk we''re willing to accept rather than what the facts are. I especially
  want the procedure to be explicit about what evidence is good enough when the honest
  answer is "we can''t test for that," and about how to write a certificate when the
  disposition is real but only holds for some of the conditions the marketing copy
  implies.


  Please also run it end to end on three files on my desk. (a) A child-resistant pill
  bottle whose closure passes our standard protocol, except that the protocol requires
  more open-and-close cycles than the mechanism survives: by the end of the test the
  caps are easy for a five-year-old to open, and the intended use is a bottle that
  is opened twice a day for a month. (b) A smoke alarm that sounds within thirty seconds
  in our chamber, and which in the field is usually installed inside a decorative
  magnetic cover of the kind sold alongside it, where smoke arrives diluted and late.
  (c) A budget bike lock that survives ninety-six hours of salt spray with no corrosion,
  which on inspection turns out to arrive coated in a thick shipping grease that any
