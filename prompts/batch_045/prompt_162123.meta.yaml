  Draft:


  "Hey — I''m putting together the final for my third-year phil of language seminar
  and I need one essay question on rigid designation and the necessary a posteriori.
  The problem is that every version of this I write gets answered by reciting ''a
  rigid designator designates the same object in every possible world, so Hesperus
  is Phosphorus is necessary but only knowable empirically'' — which is true, and
  worth maybe a C, and tells me nothing about whether they get the machinery.


  The angle I''ve been pushing in lectures: I split rigidity into what I''ve been
  calling thin and thick. Thin: the term picks out the same object in every world
  where that object exists, and in worlds where it doesn''t, it either fails to refer
  or latches onto whatever else satisfies the reference-fixing description. Thick
  (some people call it obstinate): it goes on designating that very object even into
  worlds where the object doesn''t exist, at the cost of referring to something that
  isn''t there.


  I want the question built around a case where the object exists only contingently
  — say two names introduced for the same individual animal (one by ostension at a
  cloning lab, one by a description in a newspaper), where the animal might easily
  never have existed. So: does the move from ''both terms rigidly designate the same
  thing'' to ''necessarily a = b'' still go through? What has to be added, and does
  adding it cost you the claim that the truth is a posteriori (I mean the epistemic-route
  story: you know a priori that if a = b then necessarily a = b, and empirically that
  a = b)?


  Deliverables: the question as I''d hand it out (one essay, ~45 min), a model answer
  of around 700 words, and a marking scheme out of 20 that tells an A from a B by
  naming the specific moves each has to make — not vibes. Also, per point, one line
  on how students usually blow it.


  Two constraints. It shouldn''t reward knowing who said what: no Salmon/Soames/Chalmers
  name-dropping, and if the model answer needs a distinction like primary vs secondary
  intension, define it in the answer rather than assume they''ve read it. And at the
  end of the model answer I want a short ''what would sink this'' note: the strongest
