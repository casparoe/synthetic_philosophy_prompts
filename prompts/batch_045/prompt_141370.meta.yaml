  Been reading this stuff since the Sequences days and lurking in the same small Discord
  the whole time, and two people there (I''ll call them M and N) got into a really
  long argument last week about quantum immortality that I can''t referee. Neither
  of them was being dumb and I don''t want to say which one I think won because I
  genuinely don''t know.


  The part I''d like you to look at is that they weren''t arguing about the usual
  setup (guy with a quantum gun, beam splitter, pull the trigger a hundred times).
  M introduced a variant he called the coma machine, and then a pair of cases built
  on it. Setup: you''re put under general anesthesia, and while you''re completely
  unconscious — no experience at all, not even dreamless-sleep-ish minimal stuff —
  a quantum event decides whether you''re painlessly killed or not, and an hour later
  whoever''s still alive is woken up. Two variants:


  Variant A (branch-then-sleep): the quantum event happens first, while you''re awake
  and reading a book. One branch then gets anesthesized and killed while under; the
  other gets anesthesized and woken up an hour later.

  Variant B (sleep-then-branch): you''re already fully under, then the quantum event
  fires, then one branch kills you and the other wakes you an hour later.


  M''s point is that A and B have exactly the same branch structure, the same Born
  weights, the same bodies, the same everything physical — they differ only in whether
  anyone was conscious at the moment of branching. So, he says, whatever QI predicts
  has to come out the same or it isn''t a physical thesis at all.


  Then the argument:


  M: In variant B there''s no subject of experience at the moment of branching, so
  there''s nothing for the you always find yourself in the surviving branch bit to
  latch onto. QI is silent, or at best it''s really a claim about when there''s a
  next experience and not about surviving anything. Which means QI was never a prediction
  about dying; it''s an artifact of how you index first-person facts across time.


  N: That''s too quick, and the sleep case shows why. Unconscious gaps are not a problem
  for continuity — you go under every night and nobody thinks you die and a successor
  wakes up. What matters isn''t consciousness-at-branch-time, it''s that in the surviving
  branch there''s a physically and functionally continuous brain that later has experiences.
  In A and B that''s the same, so QI says the same thing in both: you wake up. Your
  timing distinction is a red herring.


  M: It''s not, because in the ordinary sleep case both branches contain a continuing
  brain, so there''s no competition for selection to resolve. In the coma machine
  one branch''s brain gets destroyed. So what makes the surviving branch the one you
  find yourself in? If you say there''s no one in the dead branch to do the finding,
  that''s fine in A but it''s empty in B, since there''s no one in either branch at
  the relevant moment. You''re helping yourself to first-person continuity precisely
  when I''m asking what grounds it.


  N: OK, but push it further and QI gets *more* interesting, not less. Take a third
  variant: the quantum event decides between killing you painlessly and keeping your
  body alive indefinitely with zero possibility of consciousness ever returning. Branch-count-wise
  you survive in one; experience-wise there is never another experience in either
  branch. Any sane version of QI has to say the prediction is about streams of experience,
  not bodies. Fine — that''s what a view about first-person facts should say, and
  it''s not a bug.


  M: If QI collapses into you always find yourself where the experiences are, it''s
  close to vacuous, and it doesn''t get you survival in the gun case either. In the
  gun case one branch has a fraction of a second of experience and then nothing; the
  other has years of it. To say that the years are *yours* you need a story about
  which future stream is the continuation of you. Under vanilla MWI, both continuations
  are equally yours, and then what you should expect is the Born-weighted mixture,
  which is death with probability approaching 1. QI only works if there''s a single
  thread of experience that follows the living branch, and that''s extra structure
  MWI doesn''t give you — basically extra metaphysics.


  N: The extra metaphysics charge is symmetric though. Getting the Born rule out of
  MWI takes extra work too — decision-theoretic derivations, self-locating uncertainty,
  whatever your favorite is — so needing some extra posit can''t be what sinks QI.
  And on the both-copies-are-equally-you horn: if what you care about is the total
  measure of your future copies, that''s exactly why you should expect death in the
  limit, so QI dies there. But if what you care about is whether there is any continuation
  of your stream at all, the measure argument has no grip, because shrinking measure
  isn''t something anybody experiences. Those are two different cares and I don''t
  think either of us has said which one is the right one to have.


  Then they went in circles for a while about whether expecting is even the right
