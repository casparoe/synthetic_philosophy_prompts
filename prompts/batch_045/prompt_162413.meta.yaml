  ---


  I''ve been painting hanging shop signs in the Fellsmere valley for about nine years
  — six of them as an apprentice in Odile Reinholt''s workshop — and this spring I
  entered a piece of my own in the guild show for the first time: a two-sided sign
  for a beekeeper, on a ground of the valley''s traditional lead-blue, with a skep
  in the centre, a border of the scrollwork every hand in Odile''s shop learns, and
  lettering in the shop''s standard cut. Nothing in it was traced or traced back to
  a particular existing sign; the motifs are the shared vocabulary of our workshop,
  and I assembled them myself for this customer.


  The judges disqualified it under Rule 12, which bars "copycat" entries in the open
  class. The word sits in scare quotes in the rulebook on purpose: the committee that
  revised the rules after the 1996 Halloran affair — a member had traced a rival''s
  catalogue design and sold it as his own — could not agree on a definition and voted
  to leave the term to the judges'' judgement. So I have an appeal hearing next month,
  and I''m trying to work out what to argue. The judge who pushed hardest for disqualification
  put it like this: I hadn''t copied anything, but my sign "does the same work" as
  Odile''s Bee Lawn sign of 2009 — same ground, same order of motifs, same silhouette
  — so that anyone who got from hers what that kind of sign is for gets it from mine;
  I have filled her slot in the repertoire. An older member of the panel, who voted
  against disqualification, pointed out that in the shop we used to call an apprentice
  a copycat when she copied well, and that this was the highest compliment we had.
  Meanwhile the Friends of the Painted Sign, a revival society that documents and
  faithfully reproduces historical signs, has asked to exhibit mine as an example
  of "idiom work," a category they treat as praise.


  I can''t tell whether the panel and I are disagreeing about my sign or about the
  word, and that seems to matter for what I should say to them. If the accusation
  is fair in some sense and unfair in another, is one of those senses the one that
  should govern the rule, or is choosing between them just settling what the guild
  wants to reward? I''d be grateful for help thinking through three things: whether
  there is a fact of the matter about whether my sign is a copycat, what I should
  actually argue in a one-page statement to the appeals committee, and whether the
  guild would do better to drop the word from Rule 12 in favour of two or three narrower
  ones — or whether anything would be lost by doing that.


