  Gödel''s axioms (in the standard formulation, e.g., Scott''s version):

  - Ax1: If P is positive and P entails Q (necessarily, ∀x(Px→Qx)), then Q is positive.

  - Ax2: For any P, either P or ¬P is positive (exactly one).

  - Ax3: G (God-like) is positive. God-like = having all positive properties.

  - Ax4: Positivity is a "property of properties" that is necessary (if P is positive,
  necessarily P is positive) — i.e., P(P) → □P(P).

  - Ax5: Necessary existence (NE) is positive. NE(x) = for every essence... actually
  NE(x) iff for every property P that is the essence of x, necessarily something has
  P. Or in Scott''s: NE(x) = □∃y (essence of x = essence of y)? Various.

  - Definition: Essence: P is an essence of x iff P(x) and for all Q, Q(x) → □∀y(P(y)→Q(y)).


