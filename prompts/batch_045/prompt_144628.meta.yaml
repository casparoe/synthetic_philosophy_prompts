  instantiated (since the set of positive properties is consistent by Ax1/Ax2). So
  ◇∃x Gx. Then by S5 (◇□p → □p or ◇□p ↔ □p), from ◇∃xGx and the theorem □(∃xGx → □∃xGx)...
