  existence is possible, then it''s necessary." But the subtle false presupposition:
  the "possibility" here isn''t bare logical/metaphysical possibility you can grant
  modestly; it''s derived from the claim that being God-like is a positive property,
  which is load-bearing and itself the substantive premise. Moreover, in S5, granting
  bare possibility ◇∃xGx already gives □∃xGx only via the theorem; but S5''s characteristic
  axiom (◇□p → □p) means that if God''s necessary existence is possible then God exists
  necessarily — and since the whole chain makes "necessary existence" the target,
  the possibility premise is doing enormous work: ◇□∃xGx is the key, and in S5 that''s
  equivalent to □∃xGx. So "granting mere possibility" is not a modest concession at
  all: in the argument''s own setting, to grant the relevant possibility claim is
  already, given S5, to grant the conclusion. That''s a nice subtle point.


