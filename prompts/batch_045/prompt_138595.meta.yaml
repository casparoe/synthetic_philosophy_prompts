  Summary: "Landauer''s principle: erasing a bit of information necessarily dumps
  at least kT ln 2 of heat into the environment; this is what saves the second law
  from Maxwell''s demon, and it''s why the demon''s memory can''t be reused forever.
  Since every irreversible logic gate erases a bit, computing has an unavoidable energy
  cost, so reversible computing is a fantasy and the only way to make computers more
  efficient is better lithography." Errors:

  - Landauer''s bound applies to logically irreversible operations on a physical degree
  of freedom; the demon exorcism via Landauer (Bennett 1982) is one route, but it''s
  contested whether erasure vs. measurement/acquisition is doing the work (Szilard''s
  original engine; the current consensus-ish: information-theoretic engines, Sagawa–Ueda
  fluctuation theorem, measurement and feedback cost). So "this is the only thing
  that saves the second law" is overstated as an exclusively correct account; Bennett''s
  own view is that measurement can in principle be done reversibly and the essential
  cost is erasure, but there''s a live literature on whether acquisition also has
  a cost (e.g., "the demon doesn''t need to erase" arguments, reversible measurement,
  and the "information is physical" debate; also the no-go for work extraction from
  a single heat bath via the fluctuation theorem).

  - "erasing a bit in your program dissipates kT ln2" — no: physical erasure of a
  physical bit in a thermal environment; `free()` in a program typically doesn''t
  move any physical degree of freedom''s entropy; also most of a modern CPU''s energy
  is dissipated in driving capacitances, ~many orders of magnitude above the Landauer
  bound (at room temp kT ln2 ≈ 2.9e-21 J ≈ 3 zJ; per transistor switching it''s ~1e-15
  J or more — like 10^6–10^8 times larger).

  - "reversible computing is a fantasy" — wrong; reversible computation is possible
  in principle (Toffoli/Fredkin gates, adiabatic circuits, Bennett''s reversible Turing
  machine), and the bound is an asymptotic limit approached only at zero speed; the
  second law is not violated but there''s no theorem forbidding arbitrarily low dissipation
  per logical operation if you go slow.

  Also subtle: conflating Shannon entropy with thermodynamic entropy — "information
  is physical" isn''t "Shannon entropy is thermodynamic entropy" though they share
  the formula; entropy is relative to a coarse-graining/observer''s macrostate.


