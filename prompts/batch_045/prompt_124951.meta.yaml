  ---


  I chair the grants committee of a small private foundation, and I need a memo I
  can circulate to the other four members before we vote on Friday. I''d like it in
  American English, and I''d rather have argument than apparatus: no citations, no
  literature review, no footnotes — just the reasoning, stated plainly enough that
  a non-philosopher trustee can follow it.


  Here is the case. Two staff analysts — I''ll call them R. and M. — were asked independently
  to assess the same cost-effectiveness estimate for a conditional cash transfer aimed
  at keeping girls in secondary school in one province. R. puts roughly 75% on the
  program having a genuine, policy-relevant effect of the advertised size. M. puts
  roughly 25%, on the grounds that the estimate comes from a cluster-level analysis
  with few clusters and would mostly wash out. Their forecasting records on comparable
  questions are, as far as anyone can tell, equally good: similar Brier scores across
  a couple hundred resolved questions about whether social-program results replicate,
  similar habits of updating, and no one has caught either of them reasoning sloppily.
  There are two complications. First, M. wrote second and had read R.''s memo, and
  moved up from 15%; R. has not seen M.''s. Second, they disagree about whether they
  are even peers: R. says most of M.''s calibration comes from easier questions, and
  M. says R. is inside-viewing this particular program.


  And the committee is split the same way, 2–2, with me holding the deciding vote;
  we have all read both memos.


  The options on the table are: fund the full three-year program, decline, fund a
  scaled-down version as a literal split of the difference, or spend a fraction of
  the money now on an independent re-analysis and a small fast pilot, with a decision
  rule pre-committed in advance, and decide at the next cycle. The program has what
  looks like a threshold: half the money buys much less than half the effect.


  Please recommend one, with reasons. I want the memo to take a real position on the
  epistemic question and not just manage it procedurally: when genuine peers disagree,
  does the fact of disagreement itself move the committee''s credence, and if so toward
  what — the midpoint, the more cautious end, or an increase in uncertainty that shows
  up somewhere other than the point estimate? I also want you to deal honestly with
  the strongest thing that can be said against whatever you recommend. Two considerations
  I''d particularly like addressed: that a policy of always splitting the difference
  looks, when applied to the disagreement about whether to split the difference, as
  though it should tell us to stop doing it; and that whatever we decide, our two
  analysts will read the new evidence too, and will probably disagree about it in
  the same direction as before.


  ---


