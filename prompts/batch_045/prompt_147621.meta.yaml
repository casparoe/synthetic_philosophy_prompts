  I am helping a foundation spend a single large grant, and I want your reasoning
  rather than a survey of a field.


  The grant will support one new research group: about fifteen researchers for five
  years, theorists and philosophers by training, with a small budget for modest human-subject
  studies and no access to frontier-scale compute. Their mandate is the conceptual
  and theoretical foundations of inferring what people want from how they behave —
  the family of problems that includes inverse reinforcement learning, preference
  learning and reward modelling. The group is not meant to build better systems. It
  is meant to work out what question these formalisms are actually answering, where
  they are confused, and which of those confusions are load-bearing for the people
  who do build such systems. Please write in British English, and do not organise
  your answer around papers, authors or a reading list; I want the arguments and the
  structure of the problem.


  Three stipulations, so that we are arguing about the same thing.


  First, most behaviour is laundered. Call a behavioural record laundered when it
  was produced by someone acting inside a choice environment that another optimiser
  arranged for its own purposes: a recommender''s ranking, a platform''s defaults,
  an employer''s incentive scheme, a market''s price signal, a form''s ordering of
  options. Any dataset of real human behaviour that a system could realistically learn
  from is largely of this kind, and the laundering is not noise added to a signal
  — it is a second agent''s objective written into the data-generating process.


  Second, the reward–rationality degeneracy. If we model a person as choosing with
  probability proportional to the exponential of the value of an action, then scaling
  the reward function up and scaling the noise parameter up produce the same choice
  distribution; observed behaviour cannot, on its own, separate "she cares enormously
  about this" from "she is very reliably choosing the better option". Relatedly, many
  distinct reward functions render the very same policy optimal: add a constant, rescale
  by a positive factor, or add a term that depends only on where in the trajectory
  you are rather than where you end up, and nothing observable changes. And a reward
  is only ever identified relative to a chosen representation of the situation — the
  features the reward is allowed to care about are themselves an assumption.


  Third, call the recovery picture the view that there is a fact of the matter about
  a person''s reward function and inference aims to estimate it; call the construction
  picture the view that what inference delivers is a useful summary that partly constitutes,
  rather than discovers, the preference it reports. I do not know which is right,
  and I suspect the group will not settle it.


  Given all that: what should these fifteen people work on, and in what order? Give
  me five or six questions, ranked, and defend the ranking. For each one I want to
  know what it gates — which other questions, and which downstream engineering or
