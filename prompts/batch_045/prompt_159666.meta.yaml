  Let me think about the bootstrapping problem desiderata:


  Background: Stewart Cohen (2002) "Basic knowledge and the problem of easy knowledge"
  — the problem arises for reliabilist/virtue accounts: if a source S''s reliability
  can be established by repeated use of S itself (bootstrapping), then knowledge comes
  too easy. Vogel''s gas gauge case: I know the gauge reads "F"; the reliability of
  the gauge is inferred from a series of readings plus the assumption that the tank
  has gas... Vogel''s bootstrapping: from "the gauge reads F" and other readings,
  infer "the tank is full" repeatedly, then infer inductively "the gauge is reliable"
  (because it has been right many times), then deductively conclude the tank is full.
  So knowledge of the reliability comes cheap. Cohen''s "basic knowledge" — no, sources
  require warrant for believing reliable.


  Desiderata for an account of easy knowledge / a solution:

  1. It must block the specific inferences (both the deductive "inference to reliability"
  and the inductive "bootstrapping" version) — with the case (gas gauge, or a "Roxanne"
  perception case).

  2. It must not block ordinary knowledge that clearly is legitimate — e.g., the case
  where a source''s reliability is established by independent corroboration (checking
  the gauge against the pump), or perception where we have no independent check but
  clearly know (this is the tension: Cohen''s basic-knowledge vs. anti-skeptical demands).

  3. It must preserve closure where it matters, or say which closure principle to
  jettison (e.g., closure under known entailment; must not fall to the skeptical argument
  from closure: if we know we''re not BIVs only via bootstrapping... ). Actually a
  desideratum: block easy knowledge without collapsing into skepticism about the external
  world (i.e., must not imply we don''t know the gauge is reliable when in fact we
  do).

  4. It must say whether the problem is about the source''s reliability, the process,
  or the agent''s evidence — e.g., must handle the case where the subject has independent
  reason to think the source reliable but still "bootstraps" (does the inference become
  fine? some say no—the "no bootstrapping" principle vs. "safety-based" accounts differ).

  5. It must handle "self-verifying" or "self-certifying" sources: thermometers, our
  own memory, testimony from a source that also vouches for itself, and also sources
  that are reliable only in the actual environment vs. nearby worlds; and the "easy
  knowledge from a reliable source in a demon world" case (how to block the BIV who
  bootstraps on his "experiences"?) — nice in-the-weeds: the demon victim''s bootstrapping
  should be blocked for the same reason ours should, or should it? That''s a great
  desideratum that presses.

  6. It must distinguish legitimate "calibration" / "self-checking" from illegitimate
  bootstrapping — e.g., using a source''s outputs to check the source is circular,
  but science does something like this all the time (using a method to validate the
  method). Hmm: the "calibration" case: I check my thermometer against the freezing
  point of water... that''s independent-ish. But "coherence of many readings" — is
  that legitimate? Real science: using a particle detector''s own readings to establish
  its efficiency? Or "using a measurement device to check itself".

  7. It must be compatible with (or explicitly reject) the idea that a reliable process''s
  outputs can ground knowledge without independent warrant — and must say what happens
  for "basic knowledge" (perceptual knowledge acquired by children/animals with no
  concept of reliability).

  8. Pragmatic/structural requirement: it must give a principled criterion, not just
  "rule out circular reasoning" — because circular reasoning is only bad when it''s
  premise-circular vs. rule-circular (there''s a real distinction: rule-circularity
  is benign — e.g., the reliability of induction defended inductively; the "rule-circular"
  vs "premise-circular" distinction from Sosa / Van Cleve / Alston''s doxastic practice
  circularity). That''s a great in-the-weeds hook! The desiderata must say whether
  rule-circular justification is benign, and if it is, why bootstrapping (which looks
  rule-circular in some formulations) is still bad.


