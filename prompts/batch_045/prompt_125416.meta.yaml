  I am a high school senior, and next month I am presenting to my school''s Academic
  Integrity Committee, which is rewriting its policy on AI tools in homework. The
  committee is: four classroom teachers (history, math, English, biology) who mostly
  want to know whether a submitted piece of work is really the student''s own; our
  AP Computer Science teacher, who is happy to treat cognition as computation and
  says substrate doesn''t matter; our librarian, who teaches information literacy
  and thinks almost entirely in terms of source evaluation and citation; the dean
  of academics, who cares above all about what is enforceable and what precedent a
  rule sets; and two student representatives who would prefer fewer rules and are
  suspicious of any policy that can''t be applied consistently.


  The thesis I am defending is that the policy should not classify AI assistance as
  a single thing. I want to argue that in a specifiable range of cases an AI tutor
  is not a substitute for a student''s thinking but a part of it, on the model of
  the well-known notebook case from the extended-mind literature in which a man with
  a memory impairment relies on a notebook he carries everywhere, consults automatically,
  and trusts without checking; if the notebook is part of his mind, the argument goes,
  then so can a device be part of mine.


  The standard conditions from that literature (that the resource be reliably available,
  that its contents be automatically endorsed rather than weighed, and that it be
  easy to consult) are, I think, too weak on their own, because a student who pastes
  an answer they cannot explain seems to satisfy all three. So I add two conditions
  of my own. First, the counterfactual-sensitivity condition: X is part of your cognitive
  system only if, were X silently altered or taken away, the difference would show
  up as a difference in what you believe and in what you would be willing to say or
  do, and not merely as a difference in what you hand in. Second, provenance-transparency:
  you must be able to say, when asked, which parts of your answer came from the device
  and why you accepted them. Where both hold I call it extension; where the first
  fails but the device is still consulted and trusted I call it borrowed cognition,
  which I treat as its own category rather than as cheating; where neither holds it
