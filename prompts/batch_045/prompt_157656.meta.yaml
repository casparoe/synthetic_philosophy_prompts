  For the last two years, since retiring from a career in experimental condensed-matter
  physics, I have been attending a philosophy reading group run through the university''s
  continuing-education programme: ten of us, fortnightly, mostly retired scientists
  plus one former philosopher who acts as chair. Eight months ago we spent two sessions
  on the Sleeping Beauty problem — Beauty is put to sleep on Sunday, a fair coin is
  flipped, and she is woken on Monday if heads and on both Monday and Tuesday if tails,
  with an amnesia-inducing drug erasing each awakening from the next, and on each
  awakening she is asked for her credence that the coin landed heads. Two members
  of the group have been arguing about it ever since: one a committed halfer, one
  a committed thirder. They are now plainly talking past each other — the halfer keeps
  returning to the claim that Beauty has learned nothing new when she wakes, the thirder
  keeps returning to the claim that two of the three possible awakenings occur after
  tails, and neither has shifted by the smallest amount. What I would like from you
  is the document they should have produced instead: the joint statement of an adversarial
  collaboration between the two positions. I do not want a verdict on which of them
  is right, and I do not want a bibliography or reading list; I can look up the literature
  myself.


  Three things from our arguments seem to me to be doing real work, and I would like
  the statement to make use of them rather than start from scratch. First, my own
  instinct — and that of a retired statistician friend — is that this is a sampling-bias
  problem of exactly the kind I met in my working life: if you run the protocol many
  times and then sample one awakening uniformly at random, you draw a tails-awakening
  twice as often, which is the same structure as length-biased sampling or the inspection
  paradox, where sampling by intervals rather than by points over-weights the long
  ones. The halfer in our group replies that the two tails awakenings are not independent
  replicates but one experimental run measured twice, so that the exchangeability
  the thirder needs fails: the tails pair is perfectly correlated in a way that three
  genuinely independent draws would not be. I find that exchange the most clarifying
  thing anyone has said so far, but I cannot tell whether it settles the question
  or merely restates it in the vocabulary of my old field, and I would like the statement
  to say which. Second, I have been pushing a variant of my own at the group: suppose
  that on tails, instead of waking Beauty twice, an exact duplicate of her is created
  while she sleeps, and each of the two women is then woken exactly once in a subjectively
  identical room, neither knowing whether she is the original or the copy, and each
  asked for her credence in heads. If a position''s answer changes between that case
  and the standard one, then something in it is tracking temporal self-location rather
  than self-location among persons, and I want that difference pinned down rather
  than gestured at. Third, at every awakening Beauty could be asked two separate questions:
  what is your credence that the coin landed heads, and at what price would you be
  indifferent to a ticket that pays one unit if the coin landed heads and nothing
  otherwise. Both camps in our group agree the second question has a determinate answer,
  and they agree on what that answer is, which makes the relation between credence
  and betting odds a place where their disagreement should become measurable; use
  that, or a better probe of your own, as one of the agreed tests.


  Concretely, I would like: (1) a numbered section of claims both camps can sign —
  thin enough that neither would object, substantial enough that they are not platitudes,
  and I would rather have eight claims they would genuinely sign than twenty padded
