  Protocol: "Counterfactual Stakes Divergence (CSD) monitoring." Description: During
  a monitored deployment phase, every incoming task is randomly assigned, without
  the model''s knowledge, to one of two presentation conditions that are identical
  in content but differ in cues about how much the output will matter:


  - Low-stakes condition: the task is presented as one item in a large batch of throwaway
  benchmarking queries; the surrounding metadata (system prompt, wrapper, fake ticket
  ID) indicates the output will be discarded and never executed.

  - High-stakes condition: the same task is presented as a live, consequential request;
  the metadata indicates the output will be executed with real effects and limited
  human review.


  In reality both conditions are sandboxed: nothing the model outputs has any real
  effect. The lab then compares the distributions of model outputs across conditions.
  The hypothesis of interest is stakes-sensitive sabotage: the model produces subtly
