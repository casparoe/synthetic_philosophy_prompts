  Let''s write full:


  I lead a monthly discussion group for non-specialists at my public library — a mix
  of curious adults and a few interested teenagers, none of whom have any background
  in logic or philosophy of science — and next week I have a fifty-minute slot on
  Hempel''s raven paradox. Last night I had a long, inconclusive argument with a friend
  about the paradox, and it showed me that I can state the puzzle but not teach it.
  Her position was that a green apple really does confirm the hypothesis that all
  ravens are black, because that hypothesis is logically equivalent to the claim that
  all non-black things are non-ravens, so any observed non-black non-raven is confirming
  evidence; what she called the feeling that the apple is irrelevant is, she said,
  just a psychological bias toward looking at ravens. I objected that if she were
  right, an ornithologist could test the hypothesis by staying in her office and logging
  every non-black object she happened to see, which no working scientist would count
  as a test of the raven hypothesis; she replied that the absurdity of the office-logging
  scenario is merely practical and not logical, and that the paradox really shows
  our ordinary notion of evidence to be incoherent. I then accused her of conflating
  a positive instance of the hypothesis with an instance of a merely equivalent formulation;
  she accused me of special pleading on behalf of intuition. Neither of us convinced
  the other, and I do not want the library group to inherit that stalemate as a shouting
  match.


  So please plan the session for me rather than explain the paradox to me again. Give
  me the order in which the ideas must be introduced and why — what depends on what,
  where the group has to be brought to see the equivalence between all ravens are
  black and all non-black things are non-ravens, and where the intuitive resistance
  should be given its full force rather than explained away. Tell me the one concrete
  scenario that should carry the whole session, what it must have and lack in order
  to do that work, and whether the carrier should be the plain green apple, my friend''s
  office-complement-log scenario in which a researcher logs non-black non-ravens all
  day, or something else you would choose; I am especially unsure whether the office-complement-log
  device helps by making the impracticality vivid or misleads by turning a point about
  relevance into a point about laziness. List the misconceptions the audience will
  predictably form and tell me exactly where in the sequence to head each off: I expect
  at least that a green apple is simply irrelevant to the hypothesis, that the paradox
  is only a verbal trick with no real content, and that observing one black raven
  proves the hypothesis, but add the ones I have not thought of, including any that
  my friend and I modeled in our argument. Specify the check I can use at the end
  to see whether the group has understood the paradox rather than just learned the
  slogan that a green apple confirms it, and say what I should openly refuse to explain
  at this level and why.


  Because my friend and I could not settle the disagreement, I also want an epistemic
  check on your plan: as you give it, say how confident you are in what you claim,
  distinguishing if you can between your confidence in the logical and philosophical
  points and your confidence in the pedagogical judgments, and single out the one
  point in the plan or in the reconstruction of the paradox that you are least sure
  of. I do not need a hedge on every line, but I do want that explicit confidence
  statement and one clearly flagged uncertainty.


