  experiences with content; to get content you need the reports, so physiology gives
  no content-criterion, only a report-criterion in different clothing. (b) The time-lag
  analogy fails because in the ordinary memory case we can check the earlier experience
  against the world (there was a crash; you were there); dream contents admit no such
  check — that''s precisely what makes dreams special. (c) Malcolm''s claim isn''t
  that dream reports are false; it''s that "experience" is a concept whose use is
  tied to the possibility of a subject''s concurrent or near-concurrent avowal and
  correction; remove that possibility and the concept has no grip.


