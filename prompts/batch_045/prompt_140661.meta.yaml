  and subjects report a single disc gliding across the gap that turns green somewhere
  around two-thirds of the way along, i.e., a colour change they seem to experience
  before the green disc has actually been presented. Our discussion then turned to
  the two stories about what must be going on, the ones Dennett labelled Orwellian
  and Stalinesque. On the Orwellian story the subject first undergoes an ordinary,
  unrevised experience of the red disc, and only after the second flash does some
  later process go back and rewrite the record, so that it now seems to them, from
  the inside, that the motion and the colour change had already happened — history
  is falsified after the fact, as in 1984. On the Stalinesque story nothing is presented
  to consciousness until after the second flash; the composed, backdated content is
  what gets written in the first place, so there was never an earlier experience for
  anyone to falsify — the trial is rigged in advance. The question someone in the
  room asked was which of these is actually happening in the subject at, say, 200
  ms, and whether that is the same question as ''when does the subject''s experience
  of the colour change occur — before the second flash, after it, or somewhere smeared
  across the interval?''


