  ---


  I work on the evolution of cooperation in theoretical biology; the vocabulary I
  actually think in is inclusive fitness, Hamilton''s rule, relatedness as a regression
  coefficient, the Price equation, replicator dynamics and correlated equilibria,
  assortment mechanisms (kin recognition, greenbeards, repeated interaction), and
  geometric-mean fitness under bet-hedging. I want you to restate the argument for
  superrationality in a one-shot Prisoner''s Dilemma between exact copies — including
  the move from "we are both rational" to "so our choices cannot come apart," which
  is the step I have never been able to cash out — in exactly that vocabulary, as
  faithfully as you can manage, and then give me the residue report.


  Two stipulations. First: I don''t want the standard population-genetic story where
  a mechanism (common descent, assortment, repeated interaction) generates a statistical
  correlation between partners'' actions; the superrationalist claims the correlation
  without any such mechanism, and I want to know what happens to the argument when
  I have to write that claim down in terms that normally denote a causal or genealogical
  process. Second, I want you to test the translation on two cases I use in my own
  work rather than on the symmetric PD: a mirror match with asymmetric roles, where
  the two agents run byte-identical decision procedures but sit in different positions
  of an asymmetric game and each knows the other''s payoff matrix (so identical procedures
  plus different inputs need not produce identical actions); and a single-winner game,
  where the joint payoff is the same whoever wins, so that maximizing the sum is indifferent
  between outcomes that superrationalists treat as distinguishable.


  Where does the translation go through cleanly, where do you have to distort something
  to make it fit, and where does it break down entirely? Specifically: does the step
  from shared rationality to identical choice have any counterpart in my vocabulary,
  or is it a piece of reasoning that my framework simply cannot express — and if it
  can''t, is that a blind spot in the framework or a sign that the step was never
  doing the work the superrationalist thinks it does? Can Hamilton''s rule say anything
  at all about an asymmetric mirror match, or does the superrationalist''s question
  there become a fixed-point problem of a kind my vocabulary has no name for? And
  in the single-winner game, can anything in my apparatus recover the requirement
  that identical agents do the same thing, or does that requirement have to be imported
  from outside — fairness, risk aversion, or something else?


  Give me exactly five numbered entries, each one or two sentences: (1) the translation
  of the core argument; (2) what carried over without distortion; (3) what carried
  over only after being bent; (4) what has no expression in my vocabulary at all;
  (5) your verdict on whether the residue is a defect of the biological framework
  or an unclarity in superrationality. No preamble, no closing summary.


