  Nozick''s tracking theory: S knows that p iff (1) p is true; (2) S believes p; (3)
  if p were false, S would not believe p (sensitivity); (4) if p were true (in the
  nearby worlds where p is true and S uses the same method), S would believe p (adherence,
  via method). It solves Gettier cases and denies closure: from knowing p and knowing
  p⊨q, one can fail to know q (e.g., the "brain in a vat" / the skeptical scenario:
  I know I have hands; I don''t know I''m not a BIV; but having hands entails not-BIV).
  Actually Nozick''s own treatment: he accepts that knowledge isn''t closed under
  known logical implication and uses this to address skepticism (we can know we have
  hands while not knowing we''re not BIVs). Dretske has a similar "relevant alternatives"
  / conclusive reasons account. Also the "closure" debate involves Hawthorne, Williamson
  (knowledge-first, defends closure), etc.


