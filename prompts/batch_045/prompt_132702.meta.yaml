  I teach a grad seminar in philosophy of physics and we spent two sessions on Maxwell''s
  demon; I thought I had the standard Landauer–Bennett story down cold until one of
  my students (the one who always asks the question I can''t answer) came to office
  hours with this. Set-up: one heat bath at temperature T, a Szilard-style demon that
  measures, and a memory. No bibliography needed, I don''t want papers, I want the
  physics and the argument.


  (1) On the story I teach, every step of the demon''s cycle can be done reversibly
  — the measurement, the sorting, the work extraction — except one: resetting the
  demon''s memory to a standard state, which by Landauer''s principle costs kT ln
  2 per bit, and that dissipation is what keeps the second law intact.

  (2) Erasure enters the picture only because we''ve assumed the demon''s memory is
  finite: after N bits it''s full and has to be wiped before it can sort again.

  (3) But nothing in physics compels a computer to erase. A machine that writes each
  new result on a fresh, previously untouched square of an ever-growing tape and never
  overwrites anything performs the same computation, is logically reversible, and
  by Landauer''s own criterion dissipates nothing.

  (4) So hand the demon an unbounded tape — or just keep shipping it new blank registers,
  one per measurement. Now every operation it performs is reversible, no bit is ever
  reset, and there is no erasure step anywhere in the gas+demon+memory system.

  (5) It therefore extracts kT ln 2 of work per bit from a single bath at temperature
  T, indefinitely. The only net changes in the world are that the bath has given up
  heat, work has been done, and the tape has gotten longer and is now covered in bits.

  (6) That is a straight violation of the Kelvin statement of the second law (heat
  drawn from a single reservoir and converted entirely into work, no other effect)
  — or if you think the growing tape counts as an "other effect," then the second
  law is saved only because we smuggled in a resource, and nobody told us which one.


