  ln 2 per bit; measurement and the work-extraction step can in principle be done
  reversibly.

  (2) Erasure is needed only because the demon''s memory is finite: after recording
  many bits, it fills up and must be reset to run another cycle.

  (3) But erasure is a computational convenience, not a physical necessity. A Turing
  machine that never erases — one that just writes each new result on a fresh, previously
  untouched square of an ever-growing tape — performs exactly the same computation
  and does no erasure, hence dissipates nothing. (There exist universal reversible/lateral-...
  hmm, "there are universal Turing machines that never need to erase" — actually the
  relevant fact: any computation can be made reversible by keeping history, per Bennett;
  and a machine that writes only on fresh tape squares is "monotone" and never erases.)

  (4) So give the demon an unbounded tape — or, if you prefer, a demon that never
  reuses memory and just keeps buying/receiving fresh blank tape. Its operations are
  all reversible, so no entropy is produced anywhere in the demon+gas system.

  (5) Then the demon can extract kT ln 2 per bit indefinitely from a single heat bath
  at temperature T, with no other effect than the conversion of heat into work and
  the growth of the tape. That''s a violation of the second law (Kelvin formulation).

  (6) Since we don''t believe the second law is false, and (1)–(4) look airtight —
  no step invokes a hidden erasure — something in the standard account is wrong. Either
  Landauer''s principle isn''t really the saving grace, or the second law needs a
  premise about resources that nobody has stated.


