  ---


  I''m writing a short position paper for a workshop on the currency of egalitarian
  justice, and since I teach this stuff every year I''d like to stop handwaving at
  the point where the good students push back. Can you audit where I''ve landed?


  (a) The currency is resources rather than welfare — the expensive-taste objection
  really is decisive against welfarism, and part of the appeal is that I never have
  to look inside anyone to see how well their life is going.

  (b) But the allocation has to be sensitive to how well people convert resources
  into actually doing and being things: disability and chronic illness get a needs-based
  top-up on top of equal resource shares, and I''m happy to talk capability language
  when the topic is severe deprivation in poor countries or inequalities inside households.

  (c) Justice is responsibility-sensitive in the luck-egalitarian way: brute luck
  is compensable, genuine choice isn''t.

  (d) But the democratic-equality critique is right that a state which sorts the badly
  off into the deserving and the undeserving and tells the latter it''s their own
  fault is demeaning, so I want an unconditional floor nobody falls below whatever
  they''ve chosen.

  (e) Case verdicts: nothing for the person who deliberately cultivated a taste for
  champagne; something for the person whose religion makes their dietary needs expensive,
  even though they could in principle convert; something for the person with treatment-resistant
  depression whose income is identical to everyone else''s; nothing for the man who
  gambled away his savings, even though he is reckless because he had a chaotic upbringing.


  Which of these actually pull against each other and which only look like they do?
  I want that distinguished rather than having every item flagged. Rank the real tensions
  by severity, say for each what would have to give and what giving it up would cost
  me, and tell me which single revision cleans up the most. And tell me where your
  own audit is most likely to be wrong and what would change your mind.


