  "I''m teaching a seminar on rational choice, self-control, and weakness of will,
  and I want to use Wilde''s The Picture of Dorian Gray as a case rather than a decoration.
  Read Dorian''s repeated resolutions to reform — above all the one he makes after
  Sibyl Vane''s death when the portrait first shows its change, and the years of dissipation
  punctuated by visits to the locked schoolroom, ending with the attic scene in which
  he destroys the portrait — through the distinction between akrasia proper (acting
  against one''s own all-things-considered better judgment) and hyperbolic discounting
  or present bias (where the judgment itself reverses as a reward draws near). Two
  questions interest me. First, whether Dorian is best modeled as a naive or a sophisticated
  discounter: he never uses a precommitment device of the Ulysses kind, but he does
  do something structurally analogous in reverse — he hides the portrait and stays
  away from it, which is plausibly a way of managing his own attention so that his
  resolutions never get refreshed. I''d like that read as a case of self-directed
  choice architecture aimed at vice rather than at virtue. Second, whether the portrait
  is best understood as what the decision-theory literature would call a feedback
  or salience mechanism — a device for making deferred consequences perceptible —
  which would suggest that Wilde locates the failure of self-control in the representability
