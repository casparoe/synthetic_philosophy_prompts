  ive been going down a rabbit hole on advance directives for a few weeks now (dont
  ask, it started as an argument about my grandmother) and the literature is driving
  me up the wall, because everything is phrased in terms of persons and selves and
  who has authority over whom, and my brain keeps trying to compile it into decision
