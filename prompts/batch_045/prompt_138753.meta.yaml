  Set up the dispute concretely:

  - Case: someone signs a document at 60 saying: if I ever get to the point where
  I dont recognise my family and cant follow a conversation, no antibiotics, no feeding
  tube, no heroics. At 75 she has advanced Alzheimers, seems content, smiles at music,
  eats fine, and gets pneumonia.

  - Position A (integrity / precedent autonomy): the document governs. The point is
  not moment-to-moment welfare but how the whole life goes; a persons life is a project
  with a shape, and letting the demented phase cap it off with a course of treatment
  she explicitly rejected damages something that is hers even if she cant grasp it
  now.

  - Position B (different person now / best interests): the thing in the bed has no
  access to the values the document expressed, has its own pleasures and pains, and
  is not really the same subject that signed; the directive is a letter addressed
  to someone who moved out. Treat the patient you have.

  - Position C (scope restriction): the earlier self gets to say which life-prolonging
  technologies are off the table but not what makes whatever is left go well; the
  directive binds the aggressive stuff and not the ice cream.

  - And my own wrinkle, the lucid convert case: a 22 year old writes that if she is
  everseverely disabled she wants no life-sustaining treatment. At 45, after a spinal
  injury, she is fully competent, has two kids, and says her earlier self was an idiot
  who knew nothing. Same reasoning capacities, changed values. I want to know how
  each of the three positions handles this, because I think it breaks some of them,
  and I have never seen anyone discuss it — if that means my case is confused, say
  so.


  My actual suspicion, offered as a suspicion: the entire framing of the authority
  of the earlier self is a category error, because nothing here is anybody binding
  themselves. The earlier self is dead or demented; the directive is a string of text
  that gets fed into a completely different decision procedure — a surrogate, a doctor,
  a hospital ethics committee, sometimes a judge — and the real question is what string
  makes that downstream procedure output something close enough to the earlier utility
  function. That makes it mechanism design / writing a spec for an unreliable executor,
  not a problem about self-binding or self-ownership at all. If that is right then
  most of the philosophical heat is misplaced and whats left is empirical work about
  surrogates.


