  Draft:


  ---


  I''m looking for a piece of conceptual clarification, not a summary of a philosopher''s
  views, and not citations or reading suggestions — I can''t check sources here and
  I don''t need to.


  In an argument about effective altruism, someone I was debating said: "Selfishness
  is a virtue; altruism is the doctrine that man has no right to exist for his own
  sake." He then used that to two conclusions: (i) that giving a large share of your
  income to strangers is not merely optional but morally degrading — a form of self-sacrifice
  that a person of integrity would refuse; and (ii) that a genuinely rational person
  would never make an anonymous gift, since an anonymous gift cannot come back to
  benefit the giver.


  The slogan is doing a lot of work in one short sentence, and I suspect most of that
  work comes from sliding between readings. I''d like a menu rather than a single
  interpretation. Here is what I have so far, and I''d like you to add to it, sharpen
  it, and grade it:


  ...


  ---


  Then list candidate readings the asker has toyed with, each with the question of
  whether it supports (i) or (ii):


  (a) The purely verbal reading: "selfishness" is being redefined... so the slogan
  just says "concern with one''s own genuine interests is virtuous" → and then whether
  the gift is "selfish" depends entirely on what the agent values; so the slogan is
  almost empty and can''t support (i) or (ii) at all.


  (b) The fixed-pie reading: presupposes that value is not a fixed pie / no conflicts
  of interest among rational men...


  (c) The jurisdictional reading: what''s wrong with altruism is not the cost to the
  agent nor the benefit to others but that the criterion of action is located outside
  the agent''s own rational judgment — the agent is acting on someone else''s need
  rather than her own judgment of value. Question: does this have any behavioral content?
  Could the same kidney donation be virtuous under this reading?


  (d) The epistemic/heuristic reading: altruistic codes fail because the needs of
  others are not transparent to the agent...


  (e) The psychological reading: altruism is unsustainable / corrupts character /
  breeds resentment — an empirical claim.


  (f) The "moral worth" vs "permissibility" vs "obligation" distinction.


  Then ask: for each reading — is it a definitional maneuver, a platitude, a substantive
  and defensible thesis, or false? Would Rand (or a defender of the slogan) be committed
  to it? And does it license (i) or (ii)?


  Also add a second requirement: the readings differ along three axes the asker wants
  made explicit: the extension of "selfishness", the kind of normative status claimed
  (permissible/praiseworthy/obligatory/worthy of admiration), and the direction of
  the contrast (is the slogan denying that altruism is obligatory, or that it''s ever
  permissible, or that it''s ever admirable?).


