  \ be a moral reason at all (vs. self-interested).\n3. The reason must be one the\
  \ agent takes to be decisive / acts from (the motivating reason).\n4. The reason\
  \ must figure in the correct way causally (non-deviant causation).\n5. Worth must\
  \ not be \"moral luck\" — e.g., the agent sees the right feature but for the wrong\
  \ epistemic route (arrives at the right belief by bad reasoning).\n\nA nice thought\
  \ experiment spec: build a case where the agent's action lacks moral worth on one\
  \ prominent account (say, the \"right-making feature must be the motivating reason\"\
  \ view), yet intuitively has moral worth, or vice versa — i.e., where the accounts\
