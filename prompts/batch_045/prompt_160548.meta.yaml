  \ where two named views deliver specified verdicts.\n\nMaybe better: Construct a\
  \ case where the agent acts for the right reason and yet the action has NO moral\
  \ worth — where the standard \"acting for the right reasons\" account says there\
  \ is worth, but a rival (e.g., a \"moral worth requires that the reason be one the\
  \ agent could have acted otherwise on\" / \"worth requires the right reasons to\
  \ be the agent's own / attributable\") says no. Hmm.\n\nLet me design: The spec:\
  \ A case in which (a) the agent does the right act, (b) the right-making feature\
