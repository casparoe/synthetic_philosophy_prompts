  Draft:


  "I convene a graduate reading group in philosophy, and next week I have a single
  ninety-minute seminar in which I must introduce David Lewis''s triviality results
  for indicative conditionals. The group has already read a sympathetic exposition
  of Adams''s thesis—the claim that a rational degree of belief in an indicative conditional
  should equal the corresponding conditional probability, so that the probability
  of ''if A, B'' is P(B|A)—and they find it extremely attractive. They have not yet
  been told that Lewis showed this thesis cannot be sustained if the conditional is
  treated as a proposition with ordinary truth conditions, and I do not want simply
  to spring the proof on them. I am therefore not asking you to explain the results
  to me; I am asking you to plan how I should explain them. What has to come first,
  and why does that ordering matter? In particular, what must the group grasp about
  conditional probability, about the idea of a proposition as a set of possible states
  (or a Boolean object with a truth value), and about the four-cell partition generated
  by two binary propositions, before the impossibility can even be stated without
  seeming like a sleight of hand?"


  Paragraph 2: Carrying example and algebra. "I had been considering building the
  session around a single concrete case—a card drawn at random from a well-shuffled
  deck, with A the proposition that the card is a heart and B the proposition that
  it is a queen—but I am unsure whether that example should carry the whole explanation,
  or whether I need to move almost immediately to a generic four-cell diagram whose
  cells have variable weights p, q, r and s. Tell me which example or case should
  be the one vehicle, and say what it must have and what it must lack: must the two
  propositions be logically independent? must the cell weights be allowed to vary
  arbitrarily? why would a example with fixed numerical probabilities (such as the
  deck of cards) be inadequate at the point where the proof generalises? I also want
  you to specify the order in which I should introduce the equation P(A→B) = P(B|A),
  the idea that A→B would have to be a proposition in the algebra generated by A and
  B, the observation that any such proposition has a probability equal to the total
  weight of some subset of the four cells, and the step where one sees that no subset
  can always sum to p/(p+q). Where in this sequence should I first say explicitly
  that the result is not a refutation of the material conditional alone, and where
  should I generalise from the four-cell case to Lewis''s stronger conclusion that,
  if the equation is to hold for all pairs of propositions, either credences are trivial
  (always 0 or 1) or every proposition is probabilistically independent of every other?"


  Paragraph 3: Misconceptions, check, leave out, British English. "Equally important
  is the misconception map. I expect the group to form at least the following misunderstandings:
  that the target is only the truth-functional material conditional; that the difficulty
  arises only for weird antecedents with probability zero; that some alternative non-truth-functional
  conditional—a closest-world account on which ''if A, B'' is true just in case B
  holds at the nearest A-world, for instance—could simply be substituted while keeping
  Adams''s thesis and the claim that the conditional is a proposition; that the upshot
  is that ordinary ''if''-talk is nonsense, rather than that one of a small set of
  jointly inconsistent commitments must be abandoned; and that the conditional probability
  P(B|A) is just a rule for updating rather than something a proposition''s probability
  is being asked to equal. Tell me whether I have characterised these correctly, whether
  I have missed a predictable misconception, and at exactly what point in the sequence
  each should be headed off. I also need to know what to leave out at this level and
  say openly that I am leaving it out: I take it I should not pursue the full apparatus
  of Popper–Rényi primitive conditional probabilities, nor the details of non-propositional
  (e.g. three-valued or random-variable) semantics for conditionals, but tell me if
  I should gesture at these or avoid the names entirely. Finally, give me one question
  or short exercise I can put to the group in the last ten minutes that would show
  me whether they have understood the force of the result—whether they can state the
  trilemma (that we cannot simultaneously keep the conditional as a truth-evaluable
  proposition, Adams''s thesis, and non-trivial, non-degenerate credences) and say
  which limb they are inclined to reject—rather than merely reproduce the four-cell
  diagram. Please write your plan in British English, and remember that I want a teaching
  plan: the sequence, the dependencies, the carrying example, the misconception map,
  the end-of-session check, and the declared omissions, not a direct explanation addressed
  to the students."


