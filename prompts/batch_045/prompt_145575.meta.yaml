  So the prompt: an asker (say, a final-year undergrad writing a dissertation chapter,
  or a teacher preparing a unit) asks for a reading of The Tempest through contemporary
  reparations theory. Specifics:


  - Note that the play is symmetrical in a way people miss: Prospero is the victim
  of one usurpation (Antonio''s, 12 years before) and the perpetrator of another (Caliban''s).
  He pursues his own claim all the way to restoration and never recognizes Caliban''s.

  - Ask: what does the play show about the mechanics of repair: identifying the remedy
  (return of the dukedom is the restoration of a status/office — can self-rule be
  returned? Caliban gets the island back at the end but the play gives us no sense
  this repairs anything), who owes (Antonio is never made to pay — he''s not even
  made to apologize; Prospero forgives him; is forgiveness instead of payment adequate,
  and to whom?), offsetting benefits (Caliban''s "you taught me language and my profit
  on''t is I know how to curse" — the play stages the benefits-of-colonization argument
  and Caliban''s answer to it: that the benefit is not a benefit as valued by the
  recipient, or that a wrong cannot be offset by an unrequested benefit).

  - Ariel''s lost year: delayed release and compensation for detention.

  - Inject a niche distinction: I''d like the asker to propose a coinage and ask whether
  the play helps carve it. E.g., "I''ve started calling it remedial capture, where
  the remedy is defined by the party who controls the process, so what gets returned
  is what the wrongdoer is willing to give back" — and ask whether the play is a case:
  Prospero decides what counts as repair for everyone (Ariel gets freedom on Prospero''s
  timetable, Caliban gets the island back because Prospero is leaving anyway, Antonio
  gets forgiveness). So all remedies run through Prospero''s will. Does the play dramatize
  the problem that repair controlled by the wrongdoer tends to be incomplete? And
  does the play itself commit that error — i.e., is Shakespeare''s ending complicit?


