  prediction? Where does his "trends are not laws" argument bite on a model that only
  ever outputs trends/probabilities, never laws? Does being probabilistic and conditional
  and continuously revised get it off the hook, or does he have an objection that
  survives calibration?

  - Specific bits to chew on: (a) his argument that you can''t predict the future
  growth of knowledge — how does that apply to a model that forecasts technological
  milestones (say fusion hitting grid parity, or AI systems doing X), i.e., predicting
  the arrival of knowledge whose content it can''t state? Would he say "if you can
