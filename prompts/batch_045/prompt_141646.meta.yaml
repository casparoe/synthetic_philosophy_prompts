  Let me draft the commitments (numbered, ~6-7):


  1. Only experiences (valenced consciousness) ground moral status. Species, humanity,
  personhood, rationality, being someone''s child, none of that does independent work.
  (Standard sentientism.)

  2. Suffering counts the same whoever''s it is: no discounting a chimp''s or a pig''s
  pain just because the chimp can''t do algebra. Equal weight per unit.

  3. But brain size / processing capacity isn''t irrelevant either — I think it matters
  a lot in one specific way: a bigger/richer nervous system makes possible more and
  richer goods (long-term projects, relationships, music, self-awareness over time),
  so more is at stake for such a creature. So a human death is normally much worse
  than a mouse death even if the pain at the moment is identical.

  4. I think there''s an additional and weirder way capacity matters, which is the
  part my friends think is made up: the temporal grain / integration window of a creature''s
  experience. Idea: a creature whose experience at a time integrates a longer stretch
  of time (longer "specious present," plus memory and anticipation) has more at stake
  per second of pain, because the pain is embedded in a larger experience — it can
  be about something, it can be dreaded or remembered. So the same intensity-duration
  of pain is worse for a chimp than a mouse, and worse for a human than a chimp, even
  before you count the extra goods in (3). Call it the grain thesis.

  5. No arbitrary cut-offs: I think the "it''s human so it''s special" line and even
  the person/non-person line are both morally arbitrary in the sense that the underlying
  properties are matters of degree. I want my view to be continuous — as the natural
  properties shift gradually, what we owe shifts gradually. I really don''t like sharp
  thresholds, and I lean on the arbitrariness/continuum argument a lot when I argue
