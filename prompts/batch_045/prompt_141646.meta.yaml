  "Is brain size morally relevant?" — domain: moral status, what makes something matter
  morally. A person could hold:

  1. Neuron count / information-processing capacity matters somewhat for moral status
  (complexity, richer phenomenal field).

  2. Sentience is sufficient for full moral status (equal consideration of equal interests).

  3. Species membership is irrelevant.

  4. We should use expected-value / precautionary reasoning under uncertainty about
