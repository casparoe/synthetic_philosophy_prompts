  I teach an upper-level metaphysics seminar on persistence and I am writing the final
  examination. The students can already recite the dialectic, and I have no interest
  in rewarding that: they know the problem of temporary intrinsics, the reply that
  temporary properties are relations to times, the worm-theoretic and stage-theoretic
  versions of the temporal-parts view, and the arguments from fission and from the
  vagueness of composition over time. I want a single essay question, answerable in
  ninety minutes, closed book and offline, that separates students who can work with
  this material from students who have only memorised its labels.


  The crux I want the question to force is whether the two views are, at the end of
  the day, saying anything different. Three pressure points seem to me to matter,
  and I want the question organised around them. First: the time-indexing reply to
  the problem of temporary intrinsics looks available to both sides, and if it is,
  the argument from temporary intrinsics appears to lose its force as a reason to
  prefer temporal parts. Second: the worm itself seems to have temporary properties
  — it is one shape over one interval and another over another — and the temporal-parts
  theorist must either reapply her own treatment one level up (with what looks like
  the beginning of a regress) or say why the sequence stops. Third: the whole apparatus
  seems to presuppose an ordering of the parts, and it is worth asking what supplies
  that ordering and whether it is doing work that the mereology alone cannot do.


  To make the third point concrete rather than rhetorical, build the question around
  the following case, which I have invented for the purpose and which you should state
  precisely (and feel free to sharpen): Ada runs a marathon, and it is metaphysically
  possible that the order in which the instantaneous stages of her run are located
  in time diverges from the order those stages bear to one another along every other
  dimension that seems relevant — fatigue, memory, causal influence, similarity of
  intrinsic character. Stipulate that the stage at which she crosses the finish line
  occupies the earliest time, the stage at which she leaves the start line the latest,
  and that the intermediate stages are scattered between with no pattern, while remaining
  pairwise causally linked and internally exactly as they would be in an ordinary
  run. Call the fatigue-and-memory ordering the gradient ordering. Ask what each theory
  says about whether and in what direction Ada changes, whether the temporal-parts
  theorist can identify change with variation across temporal parts without adding
  temporal order as a separate ingredient, and whether the case gives the endurantist
  anything she did not already have.


  Deliverables, please, in this order:


  1. The question exactly as it should appear on the paper, including the case, with
  any sub-parts and a stated total (30 marks).

  2. A model answer of 800–1000 words that takes a definite position on the collapse
  question rather than surveying options, and that explicitly flags the one assumption
  in its own argument it takes to be most contestable.

  3. A marking scheme: the must-hit moves with marks attached summing to 30, named
  in terms of the reasoning each requires rather than the conclusions reached; a note
  on what distinguishes an A answer from a B and a B from a C; and for each move,
  one line on how candidates who miss it typically go wrong. Include at least one
  mark reserved for resisting a tempting but bad move — for instance dismissing the
  case as impossible, or treating "more entities" or "intuitiveness" as decisive.


  Constraints: no citations, page references, or reading lists; the paper must be
