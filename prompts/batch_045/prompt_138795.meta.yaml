  compatibilist who thinks reasons-responsive agents can still deserve blame and punishment
  in a reconstructed, non-basic sense, and Caruso is the free-will skeptic who says
  basic desert is out and we should trade retribution for a public-health quarantine
  model aimed at prevention and social justice. I don’t need a summary of their views
  or any citations; assume the students already get the rough contrast. What I need
  is a class handout: build me a decision tree (or flowchart) that sorts someone into
  a position on punishment by making them answer concrete questions, not by letting
  them pick a label.


  I’ve cooked up three cases to do the real work, and I want the branch nodes built
  out of these cases plus one threshold question. The cases are: the Erased Legacy
  case, where an offender’s memory of the crime and the desires behind it are completely
  erased by a medical procedure before trial, leaving a law-abiding person with no
  psychological continuity to the person who did it; the Reasons-Responsive Psychopath
  case, where an offender meets every compatibilist condition for moral agency in
  a calm, reflective setting but undergoes a temporary, medically verified collapse
  of that capacity in the heat of the moment and then commits the crime; and the Twin
  Sentencing case, where two offenders commit indistinguishable crimes, but one had
  everyadvantage and acted from malice while the other acted from the same motives
  after being raised in extreme deprivation that made the crime statistically near-inevitable.


