  burdensome, condemnatory treatment on a convicted offender. If someone rejects that,
  send them straight to an abolitionism leaf. Then use the cases to ask plain-English
  yes/no or three-way questions a student can answer without knowing the position
  names. The splits that matter for us are: whether basic desert is coherent; whether
  reasons-responsiveness at some time can ground desert; whether psychological continuity
