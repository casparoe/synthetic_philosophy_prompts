  the assumptions it depends on — in particular the common-prior assumption and the
  role of common knowledge.

  (b) Say clearly which kinds of trade it does not rule out, and why: trade for purposes
  of risk-sharing or hedging, trade driven by liquidity needs or by inherited positions,
  trade between people who start out with genuinely different priors.

  (c) Explain what the Grossman–Stiglitz argument adds: it is about the incentive
  to acquire information rather than to trade on it. Say what it implies about how
  informative equilibrium prices can be, and what role noise or liquidity traders
  play.

  (d) Apply both to this case. In a catastrophe reinsurance market, every participant
  licenses the same vendor catastrophe model, but a handful also buy proprietary exposure
  data; several participants are also trying to lay off legacy books written years
  ago. Which of the trades in this market, if any, are ruled out by the no-trade result?
  And what would you expect to happen to trading volume and to the return on the proprietary
  data if the vendor model were made public and free of charge?"


