  I''m a software engineer, no philosophy background (well, one undergrad ethics class
  that I mostly slept through), and somehow I ended up as the "technical person" on
  the clinical ethics committee at one of the hospitals my company builds decision-support
  tools for. I keep finding that my gut verdicts on cases are very confident but don''t
  add up to anything I can write down, and I''d really like the actual rule. I even
  tried writing it as a spec — if X then permissible — and it collapsed every time.


  Here''s where I land. Unplugging the ventilator on a patient who''ll never breathe
  on their own again, because the family asks us to: fine, obviously. Never starting
  the vent in the first place on that same patient: also fine, and I''ll say out loud
  that it''s the same decision, even though the ICU attendings treat withholding as
  totally different from withdrawing and way easier to sleep after — I think they''re
  just wrong about that. Stopping a feeding tube: also fine, but it makes me uneasy
  in a way the vent doesn''t, and I can''t tell if that''s a real distinction or just
  squeamishness about food and water. Taking a young awake patient with a high spinal
  cord injury off the vent because he''s decided he doesn''t want to live like that:
  fine, and somehow clearer than the first case even though he isn''t dying of anything.
  Morphine for someone in end-stage lung disease who''s gasping for air, at a dose
  everyone knows will shorten things by a few hours: fine. The same drug at a much
  bigger dose, where the whole point is to end it: not fine — and I know that''s inconsistent-looking,
  because it''s the same drug, same route, same patient, same physiological cause
  of death, only the reason is different. My friend tells me there''s a name for that
  distinction, something about double effect, but I don''t want a literature tour,
  I want the principle.


  The pair that really breaks me: the guy who sneaks into the bathroom to hold his
  cousin''s head under the water for the inheritance is a murderer; the guy who came
  prepared to do exactly that, finds the kid already face-down, and just watches is
  also a murderer, close enough that I don''t care about the difference. Both are
  omissions in some sense, or at least neither involves... hmm, one is an omission.
  But then why is unplugging the vent not the same thing? My best attempt at a principle:
  it''s OK when what kills them is the thing that was already wrong with them — their
  lungs, their heart — and not OK when death comes from something I introduce. But
  that doesn''t handle the morphine pair (the drug kills them in both), and I''m not
  sure it handles the case where a nurse accidentally knocks a dialysis machine off
  and I decide not to restart it.


  And next month we''ve got two cases that aren''t in anyone''s binder. One: during
  a surge, an allocation model ranks patients and recommends moving the last ventilator
  from a patient with a poor projected benefit to one with a better one; the attending''s
