  Draft text:


  "I teach an upper-level philosophy of science seminar: fourteen students, one ninety-minute
  session, no lab equipment beyond a projector and index cards, and no real money
  for stakes. They''ve already done a week each on confirmation and on the theory-ladenness
  of observation, and their working instinct is that evidence ''adds up'' toward the
  truth of a theory — that if you just collect enough of it, the theory is forced
  on you. Next week is underdetermination, and I want them to run into the problem
  rather than hear about it, so no framing lecture up front; the distinctions get
  names only in the debrief.


  Here is the shape I''ve been toying with, which you should either make work or replace
  with something better. Stage one: small groups interrogate a hidden rule or mechanism
  with a strictly limited budget of probes they choose themselves — they design the
  experiments — and end up with two live candidate theories that fit everything they
  have been able to observe, then bet, for points, on which is right. The rule should
  be such that more data of the same kind doesn''t help, so the frustration is the
  point. Then a beat I''m less sure about: hand one group a different background assumption
  — an auxiliary they didn''t know they were relying on — and let them discover that
  the tie between their rivals was itself contingent on it, and that the tie can break
  without any new evidence. Stage two, after the bets are locked: reveal that the
  actual rule was never in any group''s hypothesis space, so the failure wasn''t between
  the rivals they compared but in the list of rivals they were able to compare. My
  worry is that this whole thing will land as a trick and the takeaway will be that
  anything goes, when what I want them to feel is the narrower claim; and I''m not
  confident stage two belongs in the same session rather than a later one.


  What I need: the mechanism itself (something I can actually build with a projector,
  index cards, and pre-generated data), the rules and the point-payoff scheme, a timeline
  with minute marks, and a debrief that maps the moments they actually lived through
  onto the distinctions I need them to hold apart — underdetermination by the evidence
  available versus by all the evidence there could be, the dependence of any apparent
  equivalence on auxiliary assumptions, and the status of the tiebreaker they will
  have reached for (simplicity, generality, elegance), including whether that tiebreaker
  is doing evidential work or something else entirely. Tell me what will predictably
  go wrong the first time I run it and how to handle it as it happens, and be frank
  about what a ninety-minute game cannot stage and that I will therefore have to say
  myself — my guess is that it can''t reproduce the difference between transient and
  permanent underdetermination, since my students only ever get finite data from a
  fixed budget. Structure it under the headings Setup and materials, Rules and timeline,
  Debrief map, Failure modes, What you must supply. Keep the whole thing under 800
