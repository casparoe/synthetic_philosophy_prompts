  ''Pleasure'' is introduced as the whatever-it-is-that-feels-good stuff. Then you
  bring up the heterogeneity problem: the pleasure of cold water after a run, the
  pleasure of finally seeing why a proof works, and the pleasure of finding out your
  paper got accepted don''t seem to share a single feeling. Cold water has a bodily
  qualia you can point to; seeing the proof is mostly absorption in the proof; the
  acceptance email seems to be a feeling *about* a proposition, not a sensation at
  all. The response I always get is: right, that''s why the modern view isn''t a felt-quality
  view, pleasure is really an attitude — enjoying, being glad, wanting the experience
  to continue, whatever. Fine. But then two paragraphs later the same person is using
  the experience intuition again to say that a desire theory is absurd because it
  counts a wish fulfilled after your death as good for you. And the ''wanting it to
  continue'' bit is doing no work at all at that point.


  I''ve been calling it hedonic drift but my friends say that sounds like a made up
  econ term. It''s also not quite motte-and-bailey, since neither version is a safe
  core you retreat to — the felt-quality version is the one doing the argumentative
  work at the start and the attitudinal version is the one doing it later, and you
  need both. Equivocation is too thin, it doesn''t explain why the switch is *systematic*
