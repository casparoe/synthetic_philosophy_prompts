  Commitments:

  1. The basic reason borders need justifying at all is coercion: the state''s border
  force is a standing threat backed by law, and anyone it turns away is still, in
  some sense, subject to it — so exclusion needs a justification addressed to the
  excluded person, not just to the citizens. (Abizadeh-ish but stated plainly.)

  2. The freedom-of-association defense of exclusion fails: letting someone in doesn''t
  make you associate with them, and if you really object you can leave — an association
  you can exit at will isn''t one whose composition you get to veto.

  3. But a political community that has built and maintained a distinct public culture
  over generations is allowed to take that into account in admissions, and to run
  schools, language rules and housing policy with an eye to keeping it.

  4. Nobody should end up with no state they''re allowed to enter — call it a right
  to somewhere (not to anywhere in particular).

  5. Within that, individual states are allowed to select on contribution: skills,
  language, age, willingness to pay in. I don''t think selection is intrinsically
  insulting; I think pretending the state has no interest in who arrives is what''s
  implausible.

