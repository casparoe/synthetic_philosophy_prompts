  Key explanations:

  1. Assertion/expression view: "I believe p" is not an assertion of a claim about
  one''s psychology but an avowal/expression of belief; "p but I don''t believe p"
  is contradictory because asserting p expresses belief that p while the second conjunct
  denies it. (Wittgensteinian; also "Moorean sentences are contradictions in the ''logical''
  sense via the speech act.")

  2. Norm-based: assertion has a norm (truth, knowledge, or sincerity/belief) — asserting
  p while denying belief in p violates the norm; the oddity is normative, not semantic
  contradiction.

  3. Transparency/self-knowledge: belief is transparent — the question whether I believe
  p is settled by attending to whether p; so "p but I don''t believe p" reveals an
  incoherence in deliberation: you''re treating something as both settled and open.
  (Cf. "transparency" accounts, Moran''s "Authority and Estrangement", Byrne''s doxastic
  transparency — "If p, do I believe p? If p, believe p.") Also Shoemaker''s self-blindness:
  a self-blind subject could say "It''s raining but I don''t believe it" without absurdity
  — suggesting the paradox depends on the special authority of self-knowledge.

  4. Belief as aiming at truth / constitutive norms of belief: to judge p is to aim
  at the truth of p; saying "p but I don''t believe p" shows you hold p true while
  disavowing taking it to be true.

