  ---


  I''ve been working on the literature around van Fraassen''s Reflection principle
  for a while now — the claim, roughly, that a rational agent''s current credence
  in a proposition, conditional on the supposition that her credence in that proposition
  at some later time will be r, should equal r — and I''ve reached the point where
  I can predict every move in the exchange and nothing anyone says changes anyone''s
  mind. I want a structural diagnosis rather than a verdict, and I have a hypothesis
  I want tested.


  The dialectic as I see it. Defenders run a diachronic Dutch book argument: an agent
  who violates Reflection can be induced to accept a sequence of bets, each of which
  looks fair to her at the time she accepts it, and which together guarantee a net
  loss; so Reflection is to diachronic rationality what probabilism is to synchronic
  rationality. Opponents produce cases in which the agent knows she will be worse-placed
  later — she''ll be drunk, or drugged, or she''ll have forgotten the evidence she
  now has — and where Reflection seems to tell her to move toward credences she knows
  are worse than her own. The standard defense is a proviso: Reflection applies only
  when the agent takes her later self to be no worse epistemically situated — when
  she doesn''t expect to forget, or to be given misleading evidence, or to have her
  judgment distorted. Opponents then say the proviso does all the work and the principle
  is either trivial (an echo of conditionalization plus the assumption that you''ll
  update by conditionalizing) or false. A further front has opened about self-locating
  matters: in cases where the agent''s later uncertainty is about where or when she
  is rather than about how the world is, Reflection seems to fail even with the proviso
  satisfied, and some have proposed more general principles that reduce to Reflection
  in the special case. And there is a fourth position I find under-discussed: that
  there simply are no genuinely diachronic requirements of rationality at all — that
  the only norms are time-slice norms, and every apparently diachronic norm is really
  a synchronic norm about one''s present attitudes toward one''s own future, in which
  case the whole dispute is misdescribed.


