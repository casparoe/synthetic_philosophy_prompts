  transformation of some kind sooner or later; not the collapse of the Soviet state
  in 1991, but the eventual collapse of any system with those inefficiencies; not
  this war, but some violent resolution of the slavery question, given what happened
  in every other slave society. The re-described claim genuinely is weaker and better
  supported, and it is usually what they meant all along; but it then gets used to
  do all the same work as the original — to dismiss counterfactual speculation as
  idle, to say that structural explanation beats agency, and sometimes to defuse questions
  about who was responsible — without anyone registering that anything has been given
  up.


