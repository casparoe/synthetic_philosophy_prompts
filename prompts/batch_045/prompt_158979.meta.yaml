  Write it out:


  ---


  I have had no color vision since birth (rod monochromacy), and for four months I
  have been enrolled in a pilot study of a sensory-substitution device that maps hue
  onto vibrotactile patterns across my torso, so that I can now sort, name, and anticipate
  wavelengths I have never actually seen. The question I want help with came up at
  work: my group builds large vision models and is now advertising one as a complete
  physical-functional model of human color processing. One colleague says that even
  a perfect model of that kind would not thereby know what red looks like — Mary''s
  room, more or less. My supervisor replies that the argument is empty, and he presses
  a single analogy: Mary is in the position of a congenitally deaf acoustical engineer
  who knows the complete physics of sound, the score of a symphony, and the full neuroscience
  of her own auditory system, and who then has a cochlear implant switched on. She
  gains the ability to recognize the theme, to imagine it, to hum along; she does
  not learn any new fact about the world. So, he says, what Mary acquires is know-how
  rather than knowledge-that, and nothing was missing from the physical story in the
  first place.


  I would like an audit of that analogy, not a verdict on the knowledge argument in
  general. Please give me the correspondence table — what plays the role of the score,
  the physics, the implant, the hearing, the humming — and then say which of the disanalogies
  actually carry weight for the conclusion he wants and which are noise. I am particularly
  suspicious of two things. First, that the source case quietly assumes what is at
  issue: a sound''s character is arguably exhausted by its acoustic structure, so
  of course the complete description leaves nothing out, whereas whether an experience''s
  character is exhausted by its functional-physical structure is precisely the point
  in dispute. Second, the modality: in his case the implant restores the very sense
  whose physics she had studied; in mine the substitution device delivers hue through
  touch. So I want to know what the ability hypothesis is committed to about a Mary
  who, from birth, has had a hue-to-touch device: she can discriminate, categorize,
  name and arguably imagine the relevant wavelengths, and she knows all the physical
  facts besides. If the ability hypothesis says she already knows what red is like,
  that seems to me to be a reductio of it; if it says she does not, then what exactly
  is the ability she lacks, why is the tactile surrogate not a case of it, and does
  specifying it slide back into acquaintance — a relation to the experience itself
  — which was supposed to be the thing the hypothesis avoided?


  Then, on that basis: does his conclusion survive, or was the symphony analogy doing
  the work? Is there a better analogy for whatever is really at stake, and is any
  part of this disagreement merely verbal — a fight about whether to call the new
  state knowledge?


