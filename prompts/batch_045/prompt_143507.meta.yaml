  Asker: I''m a TA / lecturer designing a class exercise for a joint senior seminar
  in philosophy of mind and computational neuroscience, "The Brain as a Computer:
  Explanatory vs. Metaphysical Readings." I want a decision tree/handout.


  Specify: trunk split — whether the claim "the brain is a computer" is read as (a)
  a claim about the mind (cognition = computation), (b) a claim about the brain''s
  causal/mechanical organization, (c) a claim about the best explanatory vocabulary
  for neuroscience, (d) a deflationary/Turing-equivalence claim. Then branch nodes
  on:

  1. Implementation criteria: mapping/observer-relativity vs. counterfactual/structural
  vs. causal-mechanical vs. semantic/teleological.

  2. Triviality: does every physical system compute some computation under some mapping?
  Yes/no/only with constraints.

  3. Grain/vehicle: spikes vs. dendrites vs. neural populations vs. whole organism-environment
  system (embodied/extended).

  4. Digital vs. analogue/continuous vs. hybrid — and whether "computer" requires
  discrete states and rule-governed transitions.

  5. Semantics: whether computation must be about something (content-bearing) or is
  purely syntactic/formal.

  6. Explanatory role: does the computational description do work (compression, generalization,
  mechanism-discovery) or is it a redescription that would be dispensable?

  7. Sui generis / dynamical alternative: is the right formalism dynamical systems
  rather than computation? Or is dynamics a special case of computation (analogue
  computation)?

  8. The "portability/substitution test": could the same computation be ported to
  other hardware without loss — and does the answer that neural wetware matters (metabolism,
  glia, neuromodulators, noise) undermine the claim?

  9. The "wrong-program risk": whether a brain could realize many computations, and
  if so whether that''s a problem for the claim.


  Leaves: (1) pancomputationalist deflationism; (2) "cheap" computationalism (brain
  computes in a trivial/observer-relative sense, nothing follows about mind); (3)
  classic computational theory of mind (CTC: cognition = computation over representational
  states, brain is the hardware); (4) mechanistic computationalism (Piccinini-style:
  computing is a species of physical mechanism processing medium-independent vehicles;
  brain is a computer but not necessarily a representational one); (5) structural/counterfactual
  implementation + CTM (Chalmers-style); (6) non-computational mechanistic neuroscience
  (neural mechanisms, no computation needed); (7) dynamical/embodied radical alternative
  (cognition not computation, though dynamics may be simulable); (8) analogue-computation
  friendly view (brain is an analogue/hybrid computer, digital framing is a modelling
  artifact); (9) eliminativist about computation in neuroscience ("computation" is
  a façon de parler for model-fitting / a mathematical description); (10) extended/embodied
  computationalism (computation spans brain-body-world); (11) "unnamed" unoccupied
  combos.


