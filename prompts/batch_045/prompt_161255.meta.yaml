  Content:


  §3. The Simplicity Condition.


  Standard presentation: Descartes offers two tests — the language test (no animal,
  not even a parrot, uses words as we do, i.e., to express thoughts applicable to
  any circumstance) and the adaptability test (though animals may do some things better
  than we do, they fail in others, showing they work by the disposition of their organs
  rather than by a universal instrument, reason). I claim these are not his grounds
  but his symptoms. His ground is a claim about what a subject must be.


  Simplicity Condition (SC): whatever is a subject of experience is not an aggregate
  of interacting parts but a thing whose unity is not derived from the arrangement
  of its parts.


  Why Descartes needs SC: his own physiology explains the behaviour of a sentient
  animal — withdrawal from fire, learning, fear responses — entirely by the motion
  of animal spirits in nerve tubes and the disposition of the brain. If the mechanical
  story is complete for animal behaviour, then adding felt pain does no work; but
  the deeper reason is not idleness (Descartes is unmoved by parsimony arguments about
  the mind, since no one doubts their own thoughts on such grounds). The deeper reason
  is that a machine has no single thing that the pain belongs to. Pain belongs to
  the person, not to their hand; a machine has hands but no one whose hand it is.
  So the machine''s states cannot be anyone''s states.


  Then: the two tests are evidence for the absence of a subject because a subject
  would reveal itself in speech and flexible action... hmm, careful: if SC is metaphysical,
  tests are evidence. Good: I say the tests are the observable traces of the presence
  of a subject, not the definition.


  Consequences/novel part:

  1. The familiar objections (trained parrots, apes signing, flexible animal behaviour)
  misfire: they attack the tests, not the condition. Descartes'' defenders can reply
  that the subject''s presence is not established by performance.

  2. Cost: Descartes must explain why the human being is not an aggregate. The soul
  supplies unity, but then the unity is not material and the human body remains an
  aggregate to which experiences do not belong — Descartes should say experiences
  belong to the soul, and the body''s involvement is causal only. That is coherent
  but pushes the view toward a form of "experience belongs to the soul alone", which
  makes the mechanical duplicate argument run for human bodies too: the human body-machine
  is as much a machine as the animal''s, and its motions are not felt by it. (Consistent
  for Descartes.)

  3. Novel thought experiment to press on SC: the "Joined Controls" case. Suppose
  two animal-like creatures, A and B, whose nervous control is unified by a graft
  — a single control system drives both bodies, and each body''s states are available
  to the same controller. If we count subjects by control systems rather than by organisms,
  there is one subject with two bodies; if by organisms, two subjects with a shared
  controller. Conversely, suppose one body with two independent controllers (each
  driving half, never communicating). Under SC as I''ve stated it (unity not derived
  from arrangement), the one-body/two-controllers case seems to have two subjects;
  the two-bodies/one-controller case seems to have one. But if those verdicts are
  right, unity is a matter of functional integration — of which states are available
  to which operations — and not of simplicity in Descartes'' metaphysical sense. And
  a functional criterion of unity can in principle be satisfied by a machine, since
  a machine can be informationally unified. So SC, once pressed, turns into a functional
  condition that undermines rather than supports Descartes'' conclusion — unless Descartes
  insists that the unity must be primitive, in which case the two cases remain under-described
  and the condition does no work in the cases we care about.


