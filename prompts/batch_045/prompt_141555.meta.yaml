  \ be praiseworthy). Also, there's the worry that it proves too much because it seems\
  \ to imply that more information about an agent's past makes them *less* responsible,\
  \ which is absurd — actually that's an important feature: the argument seems to\
  \ imply that learning more about someone's upbringing makes them less responsible,\
  \ which is backwards (or at least strange).\n\nAlso: Galen Strawson says the Basic\
  \ Argument establishes that true moral responsibility is impossible, and that it's\
