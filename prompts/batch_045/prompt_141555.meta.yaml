  \ a hypothetical agent who is *exactly* as we think a responsible agent should be.\
  \ And coupled with the \"moral responsibility requires X\" it seems to prove too\
  \ much in that it also undermines Strawson's own claim that we should still hold\
  \ people responsible in an \"ordinary\" sense... Hmm.\n\nActually there's a well-known\
  \ \"proves too much\" worry: the Basic Argument relies on the principle that you\
  \ can't be responsible for anything you can't be responsible for the causes of —\
  \ but that principle, applied to *epistemology* or to *praise*, or to non-moral\
