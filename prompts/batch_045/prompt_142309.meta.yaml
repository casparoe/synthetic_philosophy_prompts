  In the reading group I run on the later Wittgenstein, one participant — a cognitive
  scientist who sits in and is unsympathetic — has been pressing an objection that
  has the rest of us stuck. In the Investigations Wittgenstein asks what is common
  to all games and answers that we see, not a single common property, but a complicated
  network of similarities overlapping and criss-crossing, and he says such similarities
  are best called "family resemblances." Our visitor''s objection is that the analogy
  is doing more work than it can carry, precisely because families are not like that.
  A family, he says, is held together by something real and hidden — descent — and
  the visible resemblances are symptoms of it: noses and chins run in families because
  of shared genes, and if you found the genes you would have the necessary and sufficient
  condition that Wittgenstein says isn''t there. So, he argues, either the family-resemblance
  picture is a promissory note for an essence (in which case it is not an alternative
  to essentialism but a postponement of it), or it drops the hidden bond and then
  it cannot say why the features cluster together at all — why the same nose keeps
  turning up alongside the same chin. Either way, he concludes, the analogy fails
  in the place where it was supposed to help, and we are back to looking for a real
  theory of what a concept is: something structural or innate that has the explanatory
  role the genes have. He adds that the image is not self-exemplifying either: "family"
  is not a family-resemblance concept.


