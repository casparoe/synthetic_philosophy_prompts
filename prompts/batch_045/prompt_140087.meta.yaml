  \ Parfit's own hedge: he says Relation R matters, but also \"it would be better\
  \ if...\" hmm.\n\nDirty hands also good: Walzer's \"Political Action: The Problem\
  \ of Dirty Hands\" (1973), Machiavelli, Max Weber's \"Politik als Beruf\" with gesinnungsethik\
