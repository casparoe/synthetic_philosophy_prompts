  \ a nice subtle point for a student to conflate: thinking that in the double-success\
  \ case, the \"what matters\" relation holds between me and the original-continued\
  \ person and thus the replica is a mere copy.\n\nAlso good: Parfit's reductionism\
  \ vs the \"further fact\" view; the objection that Relation R can hold \"double\"\
