  \ replica is \"as good as ordinary survival\" even though it's not identity... Actually\
  \ careful: Parfit's view: if the original brain is destroyed, teletransportation\
  \ is about as good as ordinary survival. In the case where the scanner doesn't destroy\
  \ the original (and the original dies shortly after brain damage), Parfit claims\
  \ the relation to the replica contains \"what matters,\" even though it's not identity...\
  \ Hmm, in Reasons and Persons, the case where the scanner is unreliable and the\
  \ original survives briefly: Parfit says my relation to the Replica \"contains what\
  \ matters\" — but then I'd die in a few days. He says \"my relation to the Replica\
