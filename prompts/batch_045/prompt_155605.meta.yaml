  of a long chain of events including that transition: agriculture altered settlement,
  mating, and birth spacing, so from about two centuries in, the set of people alive
  is disjoint from the set who would have been alive under continued foraging (a "demographic
  reshuffle").

  (3) So no post-transition individual was made worse off by the transition; each
  owes their existence to it. (Non-identity: no one is harmed.)

  (4) Therefore the Neolithic transition was not a mistake for anyone, whatever it
  did to health, stature, leisure, and inequality.

  (5) The same reasoning applies to any transition whose effects on who is conceived
  are sufficiently diffuse and time-lagged — say, any change whose demographic effects
  reach two generations out — which includes industrialization, urbanization, compulsory
  schooling, fertility collapse, etc.

  (6) So no such transition can ever be a mistake-for-anyone, and the category "a
  mistake for the people who lived through it" is empty for any large-scale social
  change.

  (7) But we do think some large-scale changes were bad for the people who lived through
  them (e.g., ... a plausible one, e.g., a famine-inducing policy, forced relocation).

  (8) Therefore something''s wrong; and moreover, if (3)-(4) hold because existence
  is a benefit, we get the repugnant-ish result that bringing more worse-off people
  into existence can''t be a mistake either, so long as their lives are worth living.


