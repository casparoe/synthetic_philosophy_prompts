  (1) A change is a mistake for the people who live under it only if it makes at least
  one of them worse off than they would otherwise have been. (No harm without a worsened
  somebody; impersonally bad outcomes with no victim aren''t "mistakes for" anyone.)

  (2) Worse off than they would otherwise have been requires a counterpart: for each
  actual person A, a possible person B such that B would have existed had the change
  not occurred, and B''s life would have gone better than A''s.

  (3) Agriculture changed settlement, birth spacing, and who met whom; by roughly
  the third generation after any local transition, the set of people alive is entirely
  disjoint from the set who would have been alive had foraging continued — every conception
  then depends on a chaotically sensitive chain running back through the transition.
  Call this the "reshuffle threshold."

  (4) Once past the reshuffle threshold, no actual person has a counterpart on the
  foraging branch — not because the pairs are hard to identify, but because there
  is no fact of the matter about which counterfactual person they''d have been. So
  no one past the threshold can have been made worse off, for or against any pairing.

  (5) Hence, for everyone after the threshold, agriculture was not a mistake-for-them,
  whatever it did to stature, workload, dental health, infectious disease, or inequality.
  And since post-threshold people vastly outnumber pre-threshold ones, whatever verdict
  survives is a verdict about a handful of early generations.

  (6) The same holds for any change whose demographic effects reach past its own reshuffle
  threshold — industrialization, urbanization, compulsory schooling, fertility transitions,
