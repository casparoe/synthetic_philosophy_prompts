  ---


  I''m writing the ''state of the question'' section of a dissertation prospectus
  on the special composition question — the question, as Peter van Inwagen framed
  it in Material Beings, of under what conditions a plurality of things composes something.
  I don''t need another tour of the options; I need a diagnosis of why the debate
  hasn''t moved in roughly thirty-five years.


  The three families of answer are, as I see them: composition never occurs for inanimate
  pluralities (there are particles arranged chairwise, but no chairs — and, for van
  Inwagen, organisms are the exception); composition always occurs, so that any plurality
  whatsoever, however scattered or gerrymandered, has a fusion; and composition occurs
  under some nontrivial, non-vague condition — being caught up in a single life, or
  being bonded in the right way, or simply a brute matter of which pluralities happen
  to compose. The pressures on each are equally familiar: the argument from vagueness
  (a restricted condition would generate borderline cases of composition, and it can''t
  be vague whether something exists) seems to force the choice toward always or never;
  and each of those extremes then faces the charge of being unmotivated or incredible,
  which pushes back toward a moderate view, which is in turn charged with arbitrariness.
  Everyone has known all of this for a long time.


  My hypothesis is that the standoff is sustained by an unmarked equivocation about
  what composition is for. Call it the role-fragmentation hypothesis: the question
  looks like it has a single answer because it is asked in a single vocabulary, but
  "what composes what" is really three questions, and each family of answer is tuned
  to a different one. There is the bookkeeping role: supplying objects for our variables,
  so that any plurality we can talk about can be summed over. There is the causal-unity
  role: marking where the world contains a genuinely unified center of causal power,
  where the whole can do something its parts cannot. And there is the descriptive-explanatory
  role: marking which pluralities our best theories and ordinary practices must treat
  as one thing. My suspicion is that universalism is the right answer to the first
  question, the organism-style restriction the right answer to the second, and some
  pragmatic or brute answer the right answer to the third — and that no single relation
  can serve more than one of them, because a relation permissive enough for bookkeeping
  cannot be selective enough for causal unity, and a relation selective enough for
  causal unity will look unmotivated when it is asked to track explanatory practice.
  Call that the incompatibility conjecture.


