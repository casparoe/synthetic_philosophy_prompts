  Van Fraassen''s Reflection principle: roughly, a rational agent''s current credence
  in A, conditional on the hypothesis that her later credence in A will be x, should
  equal x: P(A | P_future(A) = x) = x. Corollary: if you know now that your future
  credence in A will be x (with certainty over the possible values), then your current
  credence should be the expectation: P(A) = Σ x·P(P_future(A)=x).


  Diachronic Dutch book / Dutch strategy argument: if an agent violates Reflection,
  a bookie can make a series of bets (a "Dutch strategy") guaranteeing a loss.


