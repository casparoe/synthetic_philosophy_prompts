  Section 1 — three senses of "push":

  - P1 (counterfactual dependence): change the symmball-level state and the symms
  end up somewhere different. Always true, trivially, because any difference in the
  macro state is a difference in the micro state. So P1 can''t be what the argument
  is about; it''s the sense people use when they say "of course the symmballs push."

  - P2 (closure / autonomy): the symmball state at t fixes the symmball state at t+1
  with no help from the micro details. This is the only sense where the claim has
  teeth, and it''s an empirical claim about the careenium, not a metaphysical one.

  - P3 (explanatory priority): the symm-level story doesn''t make the symmball-level
  story redundant. I want P2 to give me P3 but I''m not sure it does.


  Section 2 — two tests.

  Test 1 (the identity scramble): a demon permutes symms that play the same role in
  different symmballs. Symmball description unchanged. If the subsequent symmball
  evolution is unchanged, symm identity is causally inert and the symmball level is
  closed under identity swaps. Note: this is cheap-ish, because in the naive careenium
  symms are interchangeable by construction, so the test just re-describes the setup.

  Test 2 (the hidden-correlation probe): now give the demon the run of the place —
  any micro state compatible with the same symmball description, including stuff that
  doesn''t show up at the zoomed-out level, like uneven magnet wear from past collisions.
  My careenium has learning (collisions nudge magnet strengths), so wear is real and
  accumulates, and I claim the demon can always find two micro states with the same
  symmballs now and different symmballs later. If so, the abstraction leaks, and in
  that careenium the honest answer is: the symms push, the symmballs are a leaky abstraction,
  and Hofstadter''s question has a boring answer.

  Then: what would it take for the answer to flip? Error correction — the clump has
  to be an attractor that re-imposes itself on whatever the micro is doing, so that
  micro deviation gets damped instead of accumulated. Call the strength of that damping
  the self-repair coefficient. Then: "symbols push the substrate around" is not a
  claim about the metaphysics of levels, it''s a claim about how much slack the system
  has to re-assert its macro state; fully self-repairing careenium = symmballs fully
  in charge; zero self-repair = symms in charge.


  Section 3 — the borrowed-authority objection and the exchange rate.

  Objection: even in the fully self-repairing careenium, every bit of "symmball pushes
  symm" can be re-told at the symm level — the error correction is itself just symms
  bumping. So the macro story has no causal work of its own and my self-repair coefficient
