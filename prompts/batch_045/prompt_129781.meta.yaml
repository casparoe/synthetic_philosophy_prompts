  Hi — I need a Q&A prep sheet, and it''s for a slightly unusual room.


  Context: I''m giving a 20-minute talk (plus 15 min of questions) to the research
  advisory board of a big urban school district, and my thesis is going to annoy almost
  everyone in it in a different way. The talk: heritability estimates of reading achievement
  and of educational attainment are commonly read as saying how much room there is
  for schools to change things, and I want to argue that reading them that way is
  a category mistake. Two claims:


  1. h² is a ratio of variances in a particular population in a particular range of
  environments; it says nothing about any individual child, and nothing about how
  far a trait could move if you changed something for everyone. My example: a reading
  program given to every third-grader would move everyone''s mean and would contribute
  basically no variance, so it''s invisible to h² in both directions — a trait can
  be 80% "heritable" and still move a lot under a uniform intervention. Call it the
  uniformity blind spot if you like.

  2. So I want to introduce a second number, which I''m calling the closable share:
  the fraction of the observed gap that the best intervention we could actually run
  would remove. Defined relative to a set of feasible interventions, not relative
  to a variance decomposition — so it just isn''t a function of h², in either direction.
  (PKU is 100% genetic and almost entirely preventable; a gap can be entirely environmental
  and completely unclosable with the tools we have.) Also, heritability estimates
  go up when environments get more equal... [explain: same variance, less environmental
  spread => h² rises], so a rising h² in a district that''s improving is evidence
  the district is working, not evidence that schools don''t matter. That inversion
  is the bit I most want to land.


