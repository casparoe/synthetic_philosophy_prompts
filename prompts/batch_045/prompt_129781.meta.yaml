  ---


  I need a Q&A prep sheet for a talk I''m giving in two weeks, and the room is going
  to be hostile in about four different directions at once.


  Setup: a large urban school district is deciding whether to renew a K–3 reading
  intervention program, and someone on the board has been passing around the line
  "reading is about 70% heritable, so there''s a limit to what schools can do." I''ve
  been asked to give twenty minutes (plus fifteen of questions) to the district''s
  research advisory board on what heritability estimates do and don''t tell you.


  My thesis, in two parts:


  (1) h² is a ratio of variances, computed in one population living in one range of
  environments. It doesn''t apply to individual children (it does not mean 70% of
  any given kid''s reading score came from genes), and it''s blind to anything that
  moves everybody. A program given to every third grader shifts the mean and adds
  basically no variance, so it''s invisible to h² in both directions — something can
  be 80% heritable and still move a lot under a uniform intervention. I''ve been calling
  this the uniformity blind spot.


  (2) So I want a second number, which I''m calling the closable share: the fraction
  of an observed gap that the best intervention we could realistically run would remove.
  It''s defined against a set of feasible interventions, not against a variance decomposition,
  so it isn''t a function of h² in either direction. Phenylketonuria is entirely genetic
  and almost entirely preventable; a gap can be entirely environmental and completely
  unclosable with the tools anyone has. And because h² goes up mechanically when you
