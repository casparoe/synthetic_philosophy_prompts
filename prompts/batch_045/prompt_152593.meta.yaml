  ---

  I''m applying for a one-year master''s-by-research fellowship and need a two-page
  proposal for a dissertation on Mill''s late socialism. My half-formed idea is this.
  Commentators usually ask whether Mill "became" a socialist late in life, and answer
  either that he did (a rupture from the liberal of On Liberty) or that he didn''t
  (his sympathy was always a consistent extension of his individualism). Both readings,
  it seems to me, take for granted that "socialism" names a single position Mill either
  held or didn''t. I want to disambiguate three things he might mean: (i) a *prediction*
  — that once workers are educated, cooperative production will progressively displace
  wage labor, not by law but by out-competing it; (ii) a *prescription* — that a cooperative
  organization of production is what justice or the general interest requires, whether
  or not it would arise on its own; (iii) a *permission* — that socialism should be
  legally and socially permitted as one experiment in living among others, and that
  the present regime wrongly forecloses it. My suspicion is that Mill''s own commitments
  — to competition among forms of life, to the stationary state, to individuality
  as the thing progress is for — commit him to the third and the first but not the
  second; and that if this is right, his "socialism" is considerably thinner than
  either his defenders or his critics have supposed.


