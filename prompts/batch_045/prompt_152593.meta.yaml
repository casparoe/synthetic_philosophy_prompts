  I am applying for a twelve-month master''s-by-research fellowship and need a two-page
  proposal for a dissertation on Mill''s late socialism. My half-formed idea is this.
  The literature mostly asks whether Mill became a socialist late in life, and answers
  either that he did (a late rupture with the liberal of On Liberty) or that he never
  really did (his sympathy with socialism being a consistent extension of his individualism).
  Both readings, as I see it, assume that socialism names one position Mill either
  held or did not. I want to split it three ways: a *prediction*, that once labourers
  are educated, cooperative production will gradually displace wage labour not by
  law but by out-competing it; a *prescription*, that cooperative ownership of the
  means of production is what justice or the general interest requires, whether or
  not it would ever arise on its own; and a *permission*, that socialism ought to
  be legally and socially allowed as one experiment in living among others and that
  the present order unfairly forecloses it. My suspicion — which I cannot yet defend
  — is that Mill''s other commitments (to competition between forms of life, to the
  stationary state, to individuality as what progress is for) commit him to the first
  and third but not the second, so that his socialism is thinner than either his admirers
  or his critics suppose; and that the crux is his answer to the incentive objection,
  i.e. how a cooperative community is supposed to secure labour effort without legal
  compulsion.


