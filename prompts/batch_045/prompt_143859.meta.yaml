  Final prompt:


  "I''m a PhD student in environmental policy, and I''d like help reconstructing the
  implicit theory behind a practice I''m writing about, because the more closely I
  look the less consistent it seems.


  The practice is point-of-sale carbon offsetting. My university''s travel policy
  now requires every flight to be offset: the booking tool tells me my share of the
  flight''s emissions — computed by taking the aircraft''s fuel burn and dividing
  it across seats or passenger-kilometres, sometimes adjusted for load factor — lets
  me pay a per-tonne fee, and then reports that my trip is carbon-neutral. The credits
  are denominated in tonnes and treated as fully fungible: a tonne of avoided deforestation
  somewhere cancels a tonne of jet fuel at altitude, and the cancellation is treated
  as complete, so that after paying I''m described as having made no contribution
  at all. On the credit side, though, the accounting is much stricter: a project only
  gets credited for tonnes that are additional, that is, for a counterfactual difference
  the project made.


  Three things puzzle me. First, the debit side looks like average allocation, not
  counterfactual accounting: the tonnes attributed to me are not the difference my
  flying made. On the same aircraft, the passenger whose booking tipped the airline
  into adding a second daily rotation and the passenger who took a seat that would
  otherwise have flown empty are charged the same amount, even though their causal
  contributions differ by orders of magnitude — and in the ordinary case both are
  near zero. Second, my department both buys offsets and imposes a hard cap on the
  number of flights per person per year. If the offsets really do neutralize my contribution,
  the cap should be redundant; if my individual flights make no difference to anything,
  the cap should be pointless too. Third, the institution sells the offset to me,
  the passenger, and treats my responsibility as discharged by the payment, while
  saying nothing about the airline, the fuel supplier, or my continuing participation
  in a practice whose harm is entirely collective.


  So what I''d like is the implicit theory. Does this practice presuppose that an
  individual''s contribution to a collective harm is a difference-making causal contribution,
