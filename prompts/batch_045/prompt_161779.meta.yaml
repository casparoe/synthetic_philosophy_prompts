  legal stipulation. If courts stipulate a sharp cutoff for "reasonable doubt" or
  "obscene," does vagueness vanish? Epistemicist says: the term already had a cutoff;
  stipulation changes the term or its extension. Then the defeater: if stipulation
  is possible and trivially resolves our ignorance, why does the phenomenon persist?

  8. The "pragmatic/phenomenological" defeater: our experience of borderline cases
