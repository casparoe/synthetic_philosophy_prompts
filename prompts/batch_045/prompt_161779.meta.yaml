  Defeaters for epistemicism:

  1. The incredulity about sharp cutoffs: the intuition that "there''s no exact number
  of hairs at which someone becomes non-bald" is itself a piece of knowledge — but
  epistemicism explains it as ignorance.

  2. Higher-order vagueness: if the boundary is sharp, where is the boundary of "definitely
  bald"? Epistemicist answer: iterate margins for error; the boundary of "definitely
  F" is sharp too but located further in; but then there''s a puzzle: we can know
  the object is definitely bald... Hmm, the classic worry: the "Sorites on the meta-level"
  — Williamson''s response: higher-order vagueness is accommodated by iterating the
  margin principle; but one objection: the resulting structure requires infinitely
  many sharp boundaries (one per order), and it''s a coincidence that they''re all
  arranged in a neat hierarchy; also "definitely" iteration — the "unknowable-at-any-order"
  worry. Also Fara''s "Shifting Sands": the penumbral connection / "the argument from
  the impossibility of knowing the cutoff is that you can''t know it even at high
  orders". Hmm.

  3. The argument from use/meaning: if meaning is determined by use (or by what speakers
  are disposed to do), and our dispositions are tolerant, then epistemicism requires
  meaning to be insensitive to use — a "semantic wild card"? Fine''s "Vagueness, Truth
  and Logic" objection: the epistemicist owes an account of how the sharp boundary
  gets fixed given that our practice doesn''t fix it — "the argument from semantic
  plasticity"/"the problem of arbitrariness": there are many candidate sharp boundaries
  consistent with total use; what makes one the right one? Williamson''s reply: the
  boundary is fixed by the actual referential/externalist facts (supervenience of
  the semantic on the use via "global" or "externalist" determination) — and the "referential
  magnetism"/"eligibility" replies. Also there''s the "argument from arbitrariness"
  — an exact analogue: on the epistemicist view, whether a specific borderline case
  is bald is unknowable, yet this unknowable fact has massive consequences for legal/practical
  reasoning.

  4. The anti-induction/knowledge argument: if we know premise 1 (a man with 1 hair
  is bald) and the tolerance premise, then... epistemicism explains that one of the
  tolerance premises is false but we can''t know which; the objection: we know each
  instance of tolerance (or at least have reason to believe), but more importantly,
  the epistemicist says we don''t know the premises — contradiction: "we know that
  the cut-off exists but cannot know where."

  5. The "coincidence"/"disagreement" argument: if there is a sharp cutoff fixed by
  our use, and the cutoff is unknowable, then speakers'' judgments should be systematically
  related to it — but surveys show speaker disagreement isn''t just ignorance-like;
  it doesn''t converge at all (inter-speaker variation vs. intra-speaker variation).
