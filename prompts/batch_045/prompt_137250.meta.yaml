  Now design the prompt. It should:

  - Be casual, with a typo or two.

  - Supply salient facts (so the model doesn''t need to look them up) — but written
  as an asker who knows the rough story.

  - Type: analyze a real episode through a theory. Named episode: the 2003 Northeast
  blackout (plus maybe the 2011 Southwest one as a second data point). Theory: chaos,
  sensitive dependence, determinism vs. predictability.

  - In the weeds: distinguish chaos proper (deterministic, low-dimensional, positive
  Lyapunov exponent, bounded orbits, strange attractors) from cascade/criticality
  (self-organized criticality, power-law event-size distributions, branching processes
  near criticality); the distinction between event-predictability and distribution-predictability;
  determinism + Laplace''s demon vs. computational tractability; the question whether
  the blackout''s cause was a measurement/observability failure (the alarm bug) rather
  than dynamical sensitivity — which matters a lot, because if it was an observability
  failure, then determinism/chaos is a red herring and the fix is better instrumentation,
  not better theory; also the reflexivity point: the grid is a controlled system whose
  operators are in the loop, so the "initial conditions" include human decisions and
  the system is non-autonomous (driven by load, weather, markets) — is that compatible
  with the chaos framing at all, or does the "chaos" label smuggle in an assumption
  of a fixed low-dimensional attractor that doesn''t exist here?

  - Also ask: what would have to be true for "sensitive dependence on initial conditions"
  to be the right diagnosis: e.g., you''d want to show that near-identical states
  diverge in outcome — and note that we can''t rerun the blackout, so the counterfactual
  is a modeling claim, not an observation. And the near-miss: many similar tree contacts/local
  overloads happened without cascading, and the system ran near its limits — which
  supports the "the system was sitting near a critical point, so the size distribution
  of cascades is heavy-tailed, and any given trigger''s consequence is nearly unpredictable
  while the average is stable" reading. That''s the distribution point.

  - And the reverse direction: what does the episode show about the philosophical
  thesis "determinism does not imply predictability"? Maybe: it''s true but nearly
  vacuous here — the actionable content comes from the strength of the claim (how
  much state knowledge, how much compute, what time horizon). And the "determinism
  gives no comfort / no excuse" point — the chaos framing can be used fatalistically
  ("no one could have predicted it") when the real failure was institutional (untrimmed
  trees, no enforceable standards, alarm bug, operators not trained) — i.e., chaos
  talk can hide agency and responsibility. That''s a nice bite.

  - Ask where the theory is silent: chaos theory says nothing about what to do about
  heavy tails (it''s not a design principle); it doesn''t tell you whether to harden
  the grid or make it gracefully degradable; and it can''t distinguish "unpredictable"
  from "unpredictable given the institutions we have" (predictability is agent-relative:
  relative to a model, a data budget, a lead time, and a decision).

