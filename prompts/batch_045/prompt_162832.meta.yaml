  noticed a recurring pattern across three teams and I want to know whether the literature
  has a name for it. Description of the pattern with instances:]


  Draft the phenomenon:


  "Here is the pattern. A team has a practice — not a rule anyone can justify, but
  a practice everyone follows. Three examples, from three different jobs:


  1. At one company, no one was allowed to merge their own pull request, even in a
  four-person team where every PR was read by everyone else anyway, and even though
  merging your own PR was faster and nobody could point to a single incident that
  the rule had prevented. Everyone I asked said privately that the rule was pointless.
  When it came up at a retro, the objection was ''that''s just how we do code review
  here'' — and when I looked for the written policy, there wasn''t one. The rule existed
  only as the thing everyone did and everyone assumed someone else had decided.


  2. At another place, deploys only happened on Tuesdays. The original reason — a
  database maintenance window — had been gone for two years; the person who set it
  up had left. Nobody defended the Tuesday rule on the merits; but every time someone
  proposed deploying whenever, the answer was ''too risky'', and no one could say
  what the risk was.


  3. And a smaller one: a codebase where every module had to export an index file
  re-exporting its contents. Nobody knew why. People copied it from the neighbouring
  module. A new hire asked and was told ''it''s in the style guide''. It wasn''t in
  the style guide.


