  Content details:


  Part 1 (subsystem epistemicism): For any subsystem S I can pick out, the quantum
  state assigned to S is not a physical property of S; it encodes what someone (or
  some physically implementable information-gathering procedure) is in a position
  to predict/assign given interactions elsewhere. Distinct pure states may correspond
  to overlapping distributions over underlying states — i.e., I deny disjointness.
  Motivation: it makes interference and the information-disturbance tradeoffs look
  like consequences of ignorance rather than brute; and it lets collapse be updating
  rather than a physical process.


  Part 2 (global nomism): The universal state is not a thing either, and not anyone''s
  information; it plays the role of a law — a global constraint on the total history.
  Motivation: it explains why the universal state never collapses and why its evolution
  is deterministic and not subject to the Born rule as a stochastic process, and it
  avoids committing to a field on a 3N-dimensional space.


