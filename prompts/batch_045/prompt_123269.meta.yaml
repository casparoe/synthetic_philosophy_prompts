  that asserts of itself that it cannot be derived from the axioms, and then you find
  that it is true but unprovable. The moral he draws is that no system can certify
  itself: every system needs a judge standing outside it to say that it is sound.
  From there he goes to his conclusion, which is that it is a mathematical necessity,
  not merely a matter of prudence, that a regulator refuse to accept a firm''s own
  self-assessment of its models, and that the same point generalises — no audit regime,
  no professional code, no constitution can be self-sufficient. He also says the mapping
  onto the halting problem is exact, since in both cases the general question cannot
  be settled by the machinery inside which it is asked.


  I want to audit this rather than just disagree with it, and I''m not confident about
  the details. Could you lay out the correspondence explicitly: what in the setting
  of the first and second incompleteness theorems plays the role of the liar''s sentence,
  of truth, of proof, and of the outside judge; where the analogy with the liar breaks;
  and which features it quietly imports that Gödel''s actual argument does not have?
  I''m especially unsure about two things. First, whether the apparent self-reference
  of a Gödel sentence is anything like the vicious circularity of a liar sentence,
  or whether it is really something tamer that has a determinate truth value. Second,
  whether the ''outside'' standpoint is really outside, or whether the meta-theory
  that certifies a system is itself just a stronger theory with the same defect one
  level up.


  Then the part that matters for our draft: does the conclusion survive? My colleague
  wants to read off a substantive institutional prescription — mandatory external
