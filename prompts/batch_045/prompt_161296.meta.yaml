  Superrationality (Hofstadter): In a symmetric game among rational agents, you should
  act as if your decision is (counterfactually) correlated with others'' decisions,
  so you choose the action that, if chosen by all, is best for all — thus cooperate
  in one-shot PD. Critiques: it''s just evidential decision theory / CDT with a correlation
  assumption; or it''s untenable without assuming logical/causal correlation.


  Genuine tensions to embed:

  1. I cooperate in the one-shot PD against an exact physical/computational copy of
  myself (Hofstadter''s "Platonia dilemma" / with a twin), because our decisions are
  correlated.

  2. But I defect in a one-shot PD against a stranger who is merely statistically
  similar to me but not a copy — because there''s no reason to think our decisions
  are correlated.

  3. I reject evidential decision theory (I think smoking lesion / the "chewing gum"
  case shows EDT is wrong).

  4. I think decision theory should be a matter of what causes what, i.e., causality
  matters, so I lean causalist.

  5. I think the "principle of the single decision" — Hofstadter''s idea that there''s
  only one decision being made by all superrational players, as if it were a single
  decision — is metaphorical and I don''t take it literally.


