  Let me enumerate ~8 readings with names.


  1. Aggregate-shortage-is-not-necessary: a famine can occur with no decline in total
  food availability relative to normal; entitlement failures suffice.

  2. Aggregate-shortage-is-not-sufficient: a large decline in food availability need
  not produce famine; hence a harvest failure is at most a trigger, not the famine.

  3. The definitional reading: "famine" is partly constituted by a failure of protection/entitlement,
  so "natural famine" is close to a contradiction in terms — but then the thesis is
  partly stipulative and cannot be refuted by example.

  4. The counterfactual-avoidability reading: the deaths were avoidable given resources
  and technology available at the time — and the worry about vacuity: on a wide enough
  reading of "available," every death is avoidable, so the slogan becomes true of
  any mortality event and says nothing.

  5. The attributability/culpability reading: a moral claim — someone is answerable
  — not a causal one. Note it can be true even if the immediate cause is drought,
  and false even if a state''s policy error partly caused the deaths (excusable ignorance,
  e.g.).

  6. The explanatory-priority reading: political and economic variables do the explanatory
  work, so the natural-disaster framing is more misleading than illuminating even
  where a drought is in the causal chain.

  7. The institutional-immunity reading: famines occur only where the political incentives
  to relieve are absent — the claim that no famine has occurred under regular competitive
  elections and a free press — so a famine is necessarily a symptom of institutional
  failure.

  8. The expressive/speech-act reading: the sentence is not primarily a description
  but a refusal of the fatalistic register — a way of saying "don''t treat this like
