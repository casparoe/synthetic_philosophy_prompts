  \ you 50% likely to hallucinate being told things — but you have independent reason\
  \ to believe the drug has no such effect (e.g., you know the pharmacology). Reductionism\
  \ says justification depends on your evidence; anti-reductionists (Burge) say the\
  \ defeater is a \"defeater\" that you can also have reason to dismiss. Hmm.\n\n\
  5. Reductionism's classic problem cases: (a) testimony from a source about whom\
  \ the hearer has no evidence — children, strangers, cross-cultural testimony, testimony\
  \ about matters the hearer cannot check (e.g., the location of one's own pain, the\
  \ fact that one had a certain experience, mathematical testimony from an expert).\
  \ (b) The \"expertise\" case: a five-year-old's report about a complex matter vs.\
  \ a scientist.\n\nAlso: reductionism needs to explain why the hearer's justification\
  \ isn't just inferred — the \"generality problem\": the reductionist says justification\
