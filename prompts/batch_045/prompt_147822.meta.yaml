  \ you the train to X leaves from platform 4. You believe. Fine (no evidence about\
  \ their reliability). Anti-reductionist-friendly, but reductionists explain via\
  \ general induction; and also via \"the appearance of telling is evidence.\"\n\n\
  2. Someone in a bar at 1am tells you, unprompted, that the 7:05 to Manchester now\
