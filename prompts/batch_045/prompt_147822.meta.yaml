  \ drunk?\n\n3. A friend who is pathologically enthusiastic about restaurants tells\
  \ you the new place is amazing — you discount but still believe it's good-ish. Hmm.\n\
  \n4. A case where the hearer has a defeater that's \"global\" but not about the\
