  Draft final:


  I convene a twelve-week final-year undergraduate seminar on freedom, agency, and
  responsibility (eighteen students, mostly philosophy majors, several also reading
  psychology), and I am now writing the closed-book final paper. Students answer two
  questions in three hours. I want one of them to be an essay question, marked out
  of 25 and answerable in roughly a thousand words and forty-five minutes, on the
  methodological proposal that we should stop asking whether there is free will and
  ask instead which varieties of free will are worth wanting, and whether we have
  those.


  What the question has to prevent is the answer I expect from anyone who has skimmed
  a survey article: a restatement of the proposal, followed by the claim that every
  variety worth wanting is compatibilist-friendly, plus the observation that the varieties
  left over would be mere randomness or luck. That answer should earn a B at best.
  The crux I want forced is that the methodology converts a metaphysical dispute into
  a normative one, and that it counts as a dissolution rather than a change of subject
  only if the normative question has a determinate answer that does not presuppose
  the conclusion, and only if answering it settles what was contested in the first
  place. Students should have to identify what fixes the content of worth wanting
