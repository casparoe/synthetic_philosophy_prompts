  Phenomenon (call it "style-constituted identity" or "the reciprocity of letter and
  alphabet"): Two shapes count as the same letter not because they share any intrinsic
  geometric property, but because each is what the *other letters of its alphabet*
  would look like if produced by the same hand. The identity of a letterform is partly
  extrinsic — determined by relations to the whole alphabet. Cases:

  1. In a single font, a lowercase ''a'' (double-story) and the single-story ''ɑ''
  of a geometric sans — no shared shape property, same letter.

  2. In a serif italic, ''a'' becomes single-story; nobody thinks the ''a'' changed
  identity.

  3. A shape that would be a perfectly good ''a'' in a humanist sans looks like a
  mistake in a Didone — but only when you see it next to the other letters in the
  Didone; shown alone on a page it''s just an ''a''.

  4. Conversely: take a font and swap in a ''g'' from another font that''s "similar
  in shape" — it looks wrong, and the wrongness is a property of the pair (alphabet,
  letter), not of either alone.

  5. The negative space: the counters. Two ''a''s with wildly different stroke weights
  but the same counter shapes read as the same letter.

  6. Degradation: you can distort a letter a long way and it''s still readable, but
  the *direction* of tolerable distortion varies by letter: ''a'' tolerates losing
