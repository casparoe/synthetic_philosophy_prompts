  "I''m writing my term paper for a seminar on rational choice and the self, and I
  need a thought experiment built to order.


  The framework we''ve been working with is L. A. Paul''s account of transformative
  experience, which separates two dimensions that are usually said to travel together.
  An experience is epistemically transformative when the only way to learn what it
  is like is to undergo it — no amount of testimony, description, or imagining beforehand
  gives you that knowledge, so you cannot assign utilities to the outcomes in advance.
  It is personally transformative when undergoing it changes your point of view —
  your preferences, values, or practical identity — in a way that makes your pre-choice
  preferences an unreliable standard for the choice, so that the decision cannot simply
  be a matter of maximizing expected utility given the preferences you have now.


