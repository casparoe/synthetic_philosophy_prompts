  each leaf is a named position ... The first three nodes should be order-of-questions
  ... Specifications:


  1. Build the tree from the logical space first: give the questions, note which answer-combinations
  they permit, then locate the positions in that space. I want to see the empty regions
  as well as the occupied ones.


  2. Nodes I want on the tree, in an order you choose (roughly 7-9 questions total):

  - the realism fork: are there modal truths that hold independently of what we can
  know or say...

  - the reduction fork: is modality grounded in something non-modal or is it primitive?

  - if grounded: in concrete entities, in abstract representatives, in recombination
  of actual constituents, in the essences or causal powers of actual things?

  - the "alien" fork: could there be a fundamental property or individual that is
  not merely uninstantiated but uninstantiable by anything actual?

  - the cardinality fork: could there be more ways for things to be than there are
  sets of sentences / than the powerset of the actual constituents?

  - the maximality fork: must a possibility settle every question, or can there be
  partial ways for things to be, and what does that do to the "true at some world"
  analysis?

  - the de re fork: could this very table have been made of altogether different material,
  and could you have been a numerically different human being qualitatively exactly
  like you?

  - the quantification fork: do we ever quantify over things that do not actually
  exist?

  - the indexicality fork: is "actual" a property some worlds have, or is it a term
  whose reference depends on the speaker?

  - the epistemology fork (my angle): how, on the view, do we ever come to know a
  modal claim? (not a leaf-deciding fork unless you think it is — tell me which nodes
  it collapses with)


