  about half are interpretability researchers who use "representation" to mean a direction
  or a set of features in activation space that reliably covaries with some property
  of the input, and who think the interesting question is always how the thing is
  computed and how intervening on it changes behaviour; the other half are philosophers
  and a few cognitive scientists for whom "representation" is a normative notion,
  so that a state which could not possibly be wrong about anything isn''t representing
