  Let me design the teleosemantics prompt:


  Occasion: I''m giving the opening ten-minute "framing remarks" at a two-day retreat
  for a new interpretability lab (which I recently joined, coming from philosophy).
  Audience: half ML researchers who think "representation" just means a direction
  in activation space that correlates with a feature; half philosophers of mind who
  think content requires something more (normativity, misrepresentation, selection
  history). I must not beg the question in either direction, must set up a shared
  question, and must not be a lecture.


  The injected niche idea: a three-way distinction I''ve been developing — call it
  "target, job, and license":

  - "target": what the feature detector would have to be about if it were functioning
  correctly (the distal property in the world, e.g., "is a golden retriever" vs. "is
  a dog-shaped blob with fur texture"),

  - "job": what the training process actually selected it for doing — the downstream
  behavior whose success made it survive (e.g., "reduce next-token loss on images
  captioned with dog words"),

  - "license": the range of cases in which we''re entitled to treat its activation
  as *about* the target even when the target isn''t there — i.e., misrepresentation
  conditions.


  And the puzzle: a network trained only to predict text will have internal states
  that covary with, say, whether a sentence is false — but nothing in the training
  signal ever "cared" about truth. Teleosemantically: did the training process select
  for truth-tracking (so the state has the content "true" and can misrepresent), or
  only for something like "the sort of sentence people in the corpus assert"? This
  is the classic distality/indeterminacy problem, but with a new twist: in artificial
  systems we have the full selection history (the loss, the data, the optimizer) —
  we know *in principle* what the selection was for — unlike in biology where it''s
  reconstructed. So the question: does having the complete selection history dissolve
  the indeterminacy of content, or does it reveal that indeterminacy was never really
  about ignorance of the selection history but about the grain of the "normal condition"/"proper
  function" specification? That''s a genuinely nice, in-the-weeds, novel-ish idea.
  And a speech can build on it without citations.


  Also can add: another twist — the "many optimizers" point: training involves SGD
  which is not a selection process over a population of variants with heredity in
  the Darwinian sense; it''s more like a single organism being shaped. Does teleosemantics
  require a *population* with reproduction and heredity, or just a history of differential
  retention? Some teleosemantic accounts (Millikan) require a lineage of reproduced
  items with a "family" history. So: is gradient descent a "selection process" in
  Millikan''s sense or more like reinforcement learning / operant conditioning shaping
