  ---


  I teach a six-week undergraduate seminar on causation and counterfactuals in history,
  and one session is devoted to the "for want of a nail" trope: the thought that history
  turns on small, unmemorable events, and the chaos-theoretic image of sensitive dependence
  on initial conditions that is now routinely used to underwrite it. Rather than argue
  about the trope directly, I want to screen Tom Tykwer''s Run Lola Run (1998) and
  treat the film as a thesis about historical contingency. I''d like a reading of
  it that takes both sides seriously: the film''s structure (three replays of the
  same twenty minutes, each diverging on what look like trivial encounters — a dog
  on a staircase, a man with a bicycle, a pedestrian with a pram) and the actual debate
  about whether small causes have large historical effects.


  To stop the discussion collapsing into "small causes, big effects", I''ve drafted
  three distinctions for the class, and I want them tested against the film as much
  as the film tested against them:


  (i) Ampliative vs. switching. Does the small event create a new trajectory with
  a new menu of outcomes, or does it merely select among outcomes that were already
  on the table (who wins a battle, not whether there is one)?


  (ii) Knife-edge vs. buffered. A nail matters only where the system is near a bifurcation
  — where the downstream event is itself poised, or where no institution absorbs the
  loss. Elsewhere shocks decay, and the same macro-outcome re-forms.


  (iii) Token-level vs. structural-level contingency. The nail may decide which individual
  lives or dies, and that is everything to that individual, while changing nothing
  about the war, the dynasty, or the tax system.


  Where in the film does each distinction do real work? Which two or three scenes
  would you put on the screen and pause on, and what would you say about them? I especially
  want your view on the flash-forward sequences the film attaches to the strangers
  Lola brushes past: they seem to me the film''s strongest and least argued claim,
  namely that contingency is distributed across persons rather than concentrated in
  the nail.


  I also want the resistance. Lola appears to carry memory and skill across the three
  runs, and the third run is not a butterfly effect at all but a search that converges.
  So is the film, read honestly, an anti-chaos film — a story about contingency being
  progressively defeated by an agent who gets more than one attempt? If so, is it
  still usable as a teaching text for the trope, or would I be misleading students?
  And tell me plainly if any of my three distinctions collapse into each other, or
  are artifacts of a bad metaphor.


  Finally: what does the film add to this debate that the arguments don''t — what
  does showing a branched history let us see that asserting one doesn''t?


