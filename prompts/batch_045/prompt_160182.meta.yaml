  ---


  I''m a retired marine geophysicist — thirty-odd years of mapping the sea floor,
  and now, for reasons I can''t fully explain, I sit in on a philosophy reading group
  at the public library (its mostly retired people and one very argumentative undergrad).
  We got onto that auction game where the auctioneer sells a dollar bill but both
  the highest and the second-highest bidder have to hand over their bids — you can
  bid a dollar ten, win, and still lose ten cents, and the second bidder loses whatever
  they bid for nothing, so both keep bidding past a dollar. Everyone calls it a sunk-cost
  thing. I don''t think that''s obviously right, and I want somebody to take it apart
  properly.


  Here''s why I doubt it. At our field-station reunion a few years back I actually
  ran it with a real note and a crowd watching, and I added one rule: before any bids,
  the two players could settle it with a coin flip instead. Most pairs turned the
  coin flip down ("that''s boring, I can win this"), and it was exactly those pairs
  that went past a dollar; a couple of the players who got burned told me afterwards
  they weren''t trying to win the dollar any more by eighty cents in — they were trying
  not to be the one standing there with nothing. That sounds forward-looking to me,
  not backward-looking. So I''ve been separating four candidate drivers: (A) plain
  sunk-cost reasoning, spending more to justify what''s already gone; (B) the marginal
  calculus — each new bid only risks the small increment while it protects a much
  bigger stake you''d otherwise lose for nothing; (C) rational learning — the other
  side''s willingness to keep going is evidence about how much they want it or how
  long they''ll last, so continuing is just updating; (D) face, i.e. not wanting to
  be the sucker who quit in front of everyone. I''d guess (B) and (C) do more work
  than (A) in the game itself, but I can''t design the test that separates them cleanly.


  What I''d like is the same question asked about a real case: the American escalation
  in Vietnam between roughly 1964 and 1968. I know the outline — Congress''s authorization
  after the Gulf of Tonkin incident, the Rolling Thunder bombing campaign run in stages
  with pauses used as signals, search-and-destroy and body counts as the measure of
  progress, troop numbers climbing from a few thousand advisers to something like
  half a million by 1968, then the Tet offensive in early 1968 which seems to have
  been a military disaster for the other side and yet is what turned US opinion and
