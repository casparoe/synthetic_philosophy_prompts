  theorist''s agent that can consider its own action as a free variable — all smuggle
  in a Cartesian divider between agent and environment, and that this is why nothing
  we have says anything reliable about very capable systems. The other camp says this
  is a grab bag dressed up as a unified problem: partial observability, bounded computation,
  self-reference, the difficulty of learning when your model class doesn''t contain
  the truth — each of these is real, each is studied somewhere already, and the phrase
  "embedded agency" is mostly doing rhetorical work. Both sides are smart, both have
  heard the other side out many times, and in a year of this I have not seen anyone
  move or concede a single point. Every time I ask "what would actually settle this,"
  I get either "a decision theory that doesn''t break when an agent reasons about
