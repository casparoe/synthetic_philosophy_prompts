  Specify the deliverables:

  1. A clean translation: agent = term + environment; "the way you are" = program
  text/weights + environment; determinism; "could have done otherwise" = alternative
  transition under some input or nondeterministic semantics; the regress = requirement
  that a program author itself / bootstrap problem; quines and self-modifying code
  as the closest analogues to self-creation and why they fail (the quine''s output
  is determined by its source; self-modification is itself a transition governed by
  the current code); the "intelligibility" claim.

  2. A residue report in three columns: what translates cleanly; what translates only
  with distortion (and what the distortion is); what cannot be expressed at all in
  the vocabulary.

  3. Adjudication: is the residue a defect of PL vocabulary (it has no room for normativity/ultimate
  authorship) or a sign Strawson''s premise is less clear than it looks?


  Then the niche injection — the student''s own distinction/idea for the seminar paper:

  - Their proposal: "call it the contract-theoretically informed objection": in higher-order
  contract systems, a blame label is assigned to the party that supplied the offending
  value, and blame is perfectly well-defined and non-trivial (it distinguishes which
  side violated), without anyone being causa sui, and without blame being merely causal.
  Moreover blame assignment there is *asymmetric* and depends on who owns which piece
  of code (positive/negative positions), which looks structurally like the difference
  between holding responsible for an action vs. for a character trait. So maybe Strawson''s
  premise that true responsibility requires self-authorship is optional — you could
  have a coherent, non-arbitrary responsibility practice that doesn''t inherit all
  the way down.

  - Ask: does this survive? Does PL blame really avoid the regress, or does it quietly
  presuppose an external specifier/verifier (the contract author), so importing it
  into ethics smuggles in something like a designer/lawgiver, i.e. it only relocates
  the regress to the contract-writer? Also: does the translation show that the interesting
  question is not ultimate self-creation but *contract authorship* — who gets to write
  the specification? Then: is Strawson''s argument really just the claim that no agent
  can be both the spec and the program? And is that claim substantive or trivial?


