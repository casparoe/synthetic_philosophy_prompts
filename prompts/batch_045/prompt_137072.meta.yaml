  I have been trying to reconstruct an argument I was given in a graduate seminar
  on perception, and I cannot locate the mistake even though I am confident there
  is one, because the conclusion generalises far beyond anything the premises should
  license. I would be grateful for a diagnosis.


  Set-up. Call a cognitive state any personal-level state with representational content
  that is not itself perceptual: a belief, a desire, an expectation, a theory, a mood.
  Distinguish three grades of "penetration" of a perceptual experience E by a cognitive
  state C:


  - (P1) causal: C is among the causes of E''s occurring (perhaps by directing attention
  or saccades, perhaps by retuning a prior);

  - (P2) content: C is among the determinants of E''s representational content — had
  C been different, E would have represented the world differently;

  - (P3) evidential: E''s standing as a reason for some belief is inherited from,
  or otherwise answerable to, the epistemic status of the C that shaped it.


  My sense is that the literature''s rhetoric runs these together, but I may be wrong
  about that, and in any case the argument I was given only needs P1 and P2 as premises.


  The argument:


  (1) No state can confer justification on a belief B if the state''s own content,
  or its status as a reason, is fixed by B — or, more cautiously, by the prior acceptance
  of B. Reasons must be independent of what they are reasons for.


  (2) Perception is the only faculty whose deliverances are supposed to be reasons
  for us independently of anything else we believe; that is what makes it the tribunal
  to which theory is answerable.


  (3) Perceptual experience is cognitively penetrated at least in sense P1 and, on
  the best current psychology, in sense P2 too: [...] predictive processing / Bayesian:
  content fixed by top-down priors at every level.


  (4) So for any perceptual belief B that p, based on an experience E, E''s content
  depends on prior states of the subject that encode how likely p is — and in the
  ordinary run of cases, on the subject''s beliefs about p-like matters.


  (5) By (1) and (4), E cannot justify B.


  (6) Hence perception never confers non-inferential justification...


  (7) But the structure of (1) is not specific to perception: memory states are shaped
