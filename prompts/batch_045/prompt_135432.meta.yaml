  Draft text:


  I''m writing a seminar paper on mechanical rigidity and freedom, and a study-group
  argument I helped build now looks to me like it proves far more than any of us wanted.
  We start from the textbook case: a digger wasp drags its paralyzed prey to the threshold
  of its burrow, leaves it there, goes inside to inspect the nest, comes back out
  and hauls the prey in; if an experimenter moves the prey a short distance while
  the wasp is inside, the wasp emerges, drags it back to the threshold, and goes in
  to inspect again, and this can be repeated many times over. Call that sphexishness.
  (I know the empirical story about the real insects is messier than the textbook
  version; I don''t want the argument to rest on the biology, so please take the stylized
  case as a description of a possible mechanism.) What sphexishness is supposed to
  show is that the defect in the wasp''s behavior is not determinism as such but a
  certain kind of insensitivity: the wasp goes on executing a sequence whose point
  has already been achieved, because its behavior is driven by an internal schedule
  rather than by how things now stand. My group then argued:


  (1) An agent''s behavior is defective in the sphexish way exactly when it is insensitive
  to a difference in the situation that matters for the agent''s goal.

  (2) So an action is free only if the agent''s production of it is sensitive to every
  difference that matters for its goal, whatever it turns out to be — flexibility,
  not indeterminism, is what separates free action from the wasp''s.

  (3) Goals are themselves just further internal states of the agent, states that
  cause and organize its behavior; nothing outside the agent''s mechanism gets to
  say which differences matter.

  (4) But no mechanism of the kind an embodied creature could have is sensitive to
  every difference: for any agent with a finite repertoire there are indefinitely
  many differences in the world it cannot register, including differences that matter
  given its own goals.

  (5) So every agent is sphexish about something: for each of us there is some intervention
  an experimenter could perform that would reveal rigid, point-missing behavior.

  (6) If rigidity in one domain is enough to make the wasp''s action unfree in that
  domain, then by parity each of us acts unfreely in every domain where we are insensitive,
  and where an agent is insensitive is just a matter of which interventions happen
  to be available to the experimenter.

  (7) So nobody ever acts freely; freedom is at best a degree, and the degree a creature
  gets is fixed by the curiosity of whoever is watching it.


  The conclusion is stronger than I can accept, and the argument also seems to have
  a second, independent consequence that I find worse: on this criterion the fumbling
  novice, who notices everything and is thrown off by every perturbation, comes out
  freer than the expert whose performance has become automatized, and a system that
  responds to a very wide range of features of its input — a chess engine, a large
  language model prompted in English — comes out freer than a tired person on autopilot.
  That can''t be the right result. So I''d like a diagnosis, not a survey. Which step
