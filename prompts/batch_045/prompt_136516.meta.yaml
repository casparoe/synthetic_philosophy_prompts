  \n*Enumeration and the inscrutability of reference*\n\n1. The target. Quine's radical\
  \ translator arrives without interpreters and must construct a manual of translation\
  \ from scratch, correlating native utterances with observable stimulation. For observation\
  \ sentences the correlation is with stimulation directly, and translation is relatively\
  \ stable. For terms and for standing sentences there is no such anchor, and here\
  \ the famous case arises: the utterance *gavagai*, elicited by rabbits, can be rendered\
  \ by *rabbit*, or by *undetached rabbit part*, or by *rabbit stage*, or by the single\
  \ universal *rabbithood*, and every one of these renderings can be squared with\
  \ any behavioral evidence whatever, provided compensating adjustments are made elsewhere\
  \ in the manual — to the rendering of identity, of plurality, of the copula, of\
  \ quantification, and of the numerals. The conclusion Quine draws is not the modest\
  \ one that the linguist cannot discover which manual is correct. It is that no manual\
  \ is correct in a sense that distinguishes it from the others: there is nothing\
  \ to be right about.\n\n2. The gap I want to exploit. The argument, as usually presented,\
  \ inventories the evidence the linguist has as though verbal behavior came only\
  \ in the form of assent and dissent to sentences occasioned by stimulation. But\
  \ assent and dissent can also be elicited by a *performance* the linguist stages,\
  \ and one such performance is counting. The linguist can learn to execute the natives'\
  \ counting routine — recite the numeral list in order while directing a scanning\
  \ gesture successively at the items in a presented collection — and can observe,\
  \ without yet translating anything, at least the following: (a) a fixed, finite\
  \ list of numeral words, always recited in the same order; (b) a one-to-one pairing\
  \ between numeral-utterances and scanning acts; (c) correction behaviour that distinguishes\
  \ two different faults, skipping an item and scanning an item twice, together with\
  \ completion behaviour — the natives stop, and treat the numeral reached as the\
  \ number of the collection; and (d) reuse of that numeral in subsequent transactions,\
  \ e.g. in apportioning the counted items.\n\nCall the requirement that a manual\
  \ preserve the numeral paired with each collection, in every actual and possible\
  \ counting episode, the enumeration constraint. It is not an extra premise smuggled\
  \ in from outside: pairing, correction, completion and reuse are as public as anything\
  \ else in the linguist's evidence base.\n\n3. What the constraint does. Applied\
  \ to the textbook four-way list it is not neutral. (i) *Rabbithood* is excluded\
  \ on the usual reading: if the term denoted a single universal, every collection\
  \ would number one, yet the natives reach different numerals for different collections,\
  \ and the difference tracks the scanning acts. To rescue it one would have to translate\
  \ the numeral words differently depending on which count noun is in play; but the\
  \ numeral list is shared across count nouns, so the repair must be made in the sortals\
  \ instead, and then it propagates: what began as a proposal about one term becomes\
  \ a proposal about the entire sortal apparatus at once. (ii) *Undetached rabbit\
  \ part* survives the constraint only globally. Locally — hold the rest of the manual\
  \ fixed and swap the term — it fails: in an episode with three rabbits the natives\
  \ reach three and behave as though they have exhausted the collection, while the\
  \ number of undetached rabbit parts present is enormous; and their practice of correcting\
  \ skips shows them to be sensitive to omissions of just the kind the local swap\
  \ would require them to make en masse. What survives is Quine's considered, global\
  \ version: a proxy function applied across the language, so that the term comes\
  \ out as a gerrymandered predicate true of exactly the images of rabbits, and every\
  \ other predicate, quantifier and numeral is shifted in tandem. Such a manual is\
  \ cardinality-preserving and so meets the constraint.\n\n4. The dilemma. So the\
  \ thesis has two forms, and they fare differently. Read locally, as the four-way\
  \ illustration invites, indeterminacy is refuted by evidence the linguist can actually\
  \ gather. Read globally, as Quine himself insisted, it survives the constraint but\
  \ changes shape: the alternatives are no longer rival translations of a term, or\
  \ even of a language, but gerrymandered systematic reletterings of the whole referential\
