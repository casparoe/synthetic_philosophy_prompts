  to action/experience = meaning (semantic pragmatist maxim) — this is about meaning,
  not truth; (ii) verificationist: truth = verifiability in ideal conditions (Peirce:
  the opinion fated to be ultimately agreed by all who investigate); (iii) James''s
  "expedient in the way of believing" — truth as a property of beliefs that pays;
