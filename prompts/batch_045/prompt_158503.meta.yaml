  Section 1: The standard picture and its limits.

  The integrity objection is often illustrated with cases in which an agent must choose
  between a personal commitment and the overall good. Suppose an agent, Ron, can save
  either his wife or a stranger from a wreck; he can save only one. An impartial theory
  tells him to save the stranger if and only if doing so produces more good. Ron saves
