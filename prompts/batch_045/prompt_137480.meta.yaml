  The wrong kind of reasons (WKR) problem: originally Rabinowicz & Rønnow-Rasmussen:
  there are considerations that count in favor of an attitude (e.g., someone offers
  you money to believe God exists; or you''d get a benefit from admiring someone)
  but which are not the "right kind" of reason — they don''t bear on the attitude''s
  fittingness. The problem: how to distinguish right from wrong kinds of reasons.
  Standard diagnoses: buck-passing/fitting-attitude analysis (reasons for attitudes
  = facts that make the attitude fitting); evidentialism (for belief: reasons = evidence);
  the "wrong kind" is explained by the fact that a reason for an attitude can be a
  reason to want to have / bring it about, rather than a reason for it. Also "state-given
  vs object-given" reasons (Parfit? No — that''s Scanlon''s distinction? Actually
  state-given/object-given is from Parfit''s "On What Matters"? It''s Brunero? Let
  me recall: "state-given reasons" (reasons to be in the state of admiring) vs "object-given
  reasons" (reasons provided by the object) — that''s from Rabinowicz & Rønnow-Rasmussen?
