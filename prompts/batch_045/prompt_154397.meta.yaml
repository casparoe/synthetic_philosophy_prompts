  impairment — craving, panic, mania, acute pain, whatever — and not merely because
  the later self wants something different. Being earlier gets you nothing by itself.


  (2) So, yes to: locked dispensing for someone in opioid addiction, a mandatory delay
  before cashing out a retirement account, handing the passwords to a friend before
  a manic episode, court-enforced psychiatric holds. All fine by me.


