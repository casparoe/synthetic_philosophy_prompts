  That''s nicely in-the-weeds: the answer must distinguish:

  1. Mere-benefit reading: trait has good effects at group/species level (compatible
  with any level of selection — a by-product).

  2. Selection-for reading (group adaptation): trait exists because groups with it
  out-reproduced/persisted — requires group-level heritable variation, group extinction/colonisation
  rates, etc.

  3. Organism-designed-for-group-good reading: individuals have a proximate mechanism
  with group benefit as the goal (psychological/intentional, or teleonomic) — mostly
  false for non-humans but partly true for humans with cultural norms? Actually, defensible
  in some cases: an organism''s proximate rule of thumb that tracks group-level benefit.

  4. Gene''s-eye reading: trait is for the good of the gene''s propagation, group
  benefit is a vehicle-level effect — "for the good of the species" gets translated
  without loss into gene terms (Dawkins'' replicator/vehicle point) — and whether
  translation is lossless is contentious (Lloyd? Actually "unit of selection" pluralism:
  Sober & Wilson; Okasha''s Agency/framing?).

  5. "Species" vs "group/population/deme": what''s the purported beneficiary — the
  local breeding colony (trait-group), the metapopulation, the whole species? Naive
  versions say "the species" — but selection requires differential extinction/founding
  of demes; species-level selection requires species selection (speciation rates,
  e.g. Eldredge/Gould) which operates over geological time and on different currencies
  (species longevity/diversity), not on behavioural traits in a single population.
  So "the good of the species" is nearly always the wrong grain: the relevant question
  is group selection among demes.

