  I am closing the last session of a graduate seminar on P. F. Strawson''s essay "Freedom
  and Resentment", and I want to end with a poem rather than a summary. Would you
  write me a sestina to read aloud — thirty-nine lines, six stanzas of six, a three-line
  envoi, unrhymed, using the standard end-word rotation (if the first stanza closes
  1-2-3-4-5-6, the second closes 6-1-5-2-4-3, and so on)? The six end-words should
  be: resentment, gratitude, love, forgiveness, excuse, treatment.


  The reason for that set is the reason for the form. ...


  Then explain: five are drawn from the vocabulary of the participant attitude and
  one from the objective; the permutation means that whichever stance the speaker
  adopts, they never get outside the same six words — they only get them in a different
  order. That is, I take it, close to Strawson''s own point: the objective attitude
  is not a third thing that floats free of the reactive attitudes, but a suspension
  or rearrangement of them, intelligible only against a background in which one still
