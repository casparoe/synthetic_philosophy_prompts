  ---


  I''m a PhD student in criminology finishing a chapter on what the machinery of plea
  bargaining actually does to sentences, and I''ve hit a normative question I can''t
  get traction on.


  The practice, in the jurisdictions I''m working on, has four features that I take
  to be uncontroversial:


  1. Sentence is set by negotiation, not by a finding of culpability. Roughly nine
  in ten convictions are pleas, not verdicts, and the sentence is a function of the
  charges the prosecutor files, the discount the prosecutor offers for waiving trial,
  and the defendant''s willingness to accept it.

  2. The guilty-plea discount is a published scale keyed to timing, not to culpability
  — on the order of a third off for a plea entered at the first hearing, tapering
  to a token few percent for a plea entered at the courtroom door — and the stated
  justification is administrative: witnesses spared, court time saved, victims not
  made to testify. The doctrine insists that the discount is not a reward for remorse,
  and remorse is handled separately as a mitigating factor.

  3. The largest reductions go to defendants who can supply the state with information
  about other people''s crimes. A defendant''s discount therefore tracks how much
  they know and how much they can hand over, which in practice means it tracks how
  deeply embedded they were in the offending.

  4. The same systems that operate all this also maintain, at the appellate level,
  that a sentence must be proportionate to the gravity of the offence and the offender''s
  culpability, that consequences for third parties (a defendant''s children, an employer''s
  losses) are not mitigating, and that a person who lacked the capacity to conform
  is not a fit subject for punishment at all.


  What is the implicit theory here? I want it reconstructed rather than gestured at.
  My instinct is that the practice strictly presupposes almost nothing about desert
  — that it runs perfectly well on a view on which desert consists in nothing more
  than the system''s own say-so — and that the proportionality talk at the appellate
  level is doing a decorative rather than a load-bearing job. But I''m not sure that''s
  right, and I''m not sure how to tell: some of these features look like they fit
  a deterrence or resource-allocation rationale better than a desert rationale, others
  (the refusal to count third-party harms, the capacity excuses) look like they only
  make sense if desert is doing real work somewhere in the system.


  Where I''d particularly like help is the connection to the free-will literature.
  I''ve been reading the exchange between the compatibilist who thinks desert survives
  determinism as a social practice we have good reason to maintain, and the sceptic
  who argues that nobody is responsible in the desert-involving sense and that the
  state''s coercive response to crime should be modelled on quarantine — prevention,
  incapacitation, treatment, subject to a least-restrictive-means constraint. On the
  face of it these two views are miles apart, and yet it isn''t obvious to me that
  the practice I''m describing distinguishes between them: a compatibilist of the
  first kind might say that the plea system is exactly what taking desert seriously
  under uncertainty and scarcity looks like, while the quarantine theorist might say
  that plea discounts are just triage under a budget constraint and that the only
  thing wrong with them is the punitive framing. If both can license the practice,
  what would have to be different for it to be evidence for one rather than the other
  — and what, concretely, would have to change in the practice itself if either view
  were adopted honestly?


  Finally, I''d like to know where the practice is underdetermined: which features
  could be retained under several competing theories, and which are only defensible
  on one. If the answer is "the sentencing discount is the one feature no theory wants
  and every theory tolerates," I want to know why toleration is so cheap.


