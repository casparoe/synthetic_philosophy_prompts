  hey — I''m putting together the take-home final for my 4th-year philosophy of biology
  seminar and I need one question on the units of selection debate. Last year I asked
  something like "is the gene the unit of selection?" and got twelve versions of the
  same essay: genes are replicators, individuals are vehicles, groups only in special
  cases. I want to stop that.


  So: write me one question where memorising the labels gets you a B at most. Here''s
  the setup I want it built around (sharpen it if you like) — an asexual population;
  every generation individuals are randomly assorted into groups of fixed size; a
  costly cooperator allele makes its bearer leave fewer offspring within its group
  but raises the group''s total output; groups then dissolve and everyone goes back
  into a common pool to reproduce. No group lineages — the group exists for one episode
  and never reproduces as a group.


  The crux I''m after: the between-group term in the multilevel Price partition is
  always available, no matter how you slice the population, so its presence can''t
  by itself be evidence that selection is acting on groups — and symmetrically, gene-frequency
  bookkeeping is always available too. So the level question has to be a causal question,
  not a bookkeeping one. I want students to have to say (a) what "selection of" vs
  "selection for" does and doesn''t settle here, (b) whether a level needs to be a
  lineage / a reproducer for it to be a genuine unit of selection, and what''s at
  stake if you drop that requirement, (c) what extra empirical or counterfactual information
  would actually settle the case, and (d) what the "it''s just a matter of convenient
  description" answer gets right and where it runs out.


  Deliverables: the question itself as I''d hand it out (they''ve seen the Price equation
  in class, they shouldn''t have to rederive it, and no "summarise so-and-so''s view"
  — and please invent the example rather than using a textbook one, I''m sick of meerkats
  and slime moulds). Then a model answer of about 700 words. Then a marking scheme
  out of 25: five must-hit moves, marks each, and one line on how people typically
  get each one wrong, plus a short note on what seperates an A from a strong B.


