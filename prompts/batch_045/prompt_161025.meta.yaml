  2. the exclusion postulate: what happens when there are two overlapping complexes
  whose Φ values are very close, and whether a small peripheral change (an added module,
  or noise) that shifts which one is maximal can really switch which entity is conscious.

  3. the fact that computing Φ is intractable for systems of realistic size, and what
