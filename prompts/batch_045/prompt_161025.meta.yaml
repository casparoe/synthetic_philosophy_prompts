  Draft:


  ---


  I host a podcast series on philosophy of mind for an audience of graduate students
  and working neuroscientists; each episode is a single 45-minute interview, and I
  open with no more than one sentence of setup before the first question. Next week''s
  guest is a philosopher of neuroscience who has just published a book defending integrated
  information theory (IIT) against its critics. I''ll refer to her simply as "my guest."


  Her book''s positive thesis is one I want the interview to press on rather than
  summarize. She argues that IIT''s reputation as anti-computationalist rests on a
  misreading: Φ, she says, is not a quantity of information processing at all but
  a measure of a system''s intrinsic causal power, and the theory''s instruction to
  look for the description at which causal power is greatest is the very same formal
  move that appears in work on causal emergence, where a coarse-grained macro-level
  description of a system can carry more effective causal power than the fully specified
  micro-level one. On her reading IIT is therefore not a rival to computational neuroscience
  but a constraint on which coarse grainings a computational story may use. She has
  two characteristic ways of deflecting objections: to empirical objections she says
  that Φ is not something you measure with a proxy, it is something you compute from
  the true causal structure, so a mismatch with any current measurement is a problem
  for the measurement; and to "surely that isn''t conscious" objections she says that
  IIT is in the business of revising our intuitions about which systems are subjects,
  not of accommodating them.


  Draft eight to ten interview questions, each spoken-register and no more than two
  sentences, with a one-sentence follow-up attached to each, keyed to the answer she
  is most likely to give (assume the deflections above). No questions about her career,
  her route into the field, or the history of the theory; and no question that asks
  her to name papers or researchers, since we don''t do citations on the show. At
  least one question apiece on: ... [list]. End with a single question about what
  result could count against the theory, written so that "the axioms aren''t the sort
  of thing you test" is not available as an answer.


  ---


