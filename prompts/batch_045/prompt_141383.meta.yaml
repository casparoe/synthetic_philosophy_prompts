  Key philosophical content to make it in-the-weeds:

  1. Descartes'' second test is often read as empirical; but Descartes intends it
  as grounded in the nature of mechanism: a corporeal organ needs a particular disposition
  for each particular action, so no finite array covers the indefinite variety of
  life; reason, as a universal instrument, does.

  2. The first test (language/signs) — Descartes says animals could produce words
  (parrots) but never "arrange" speech to reply to what''s said in their presence...
  Actually the first test in Discourse V: machines could never use words or other
  signs arranged (composed) as we do to declare our thoughts to others — "although
  machines can do certain things as well or better than men, they infallibly fail
  in others." Note: Descartes says even idiots/madmen without properly formed brains
  can arrange words, whereas no beast can; showing speech is not merely organ-dependent.

  3. The deeper point: for Descartes, thought isn''t a matter of behavioral performance
  at all; the real ground is the indivisible, non-extended thinking substance; and
  certainty: we can''t know another''s mind by outward signs — hence the tests are
  "very certain" for machines but the ultimate criterion is... Actually Descartes
  says these two tests would let us know that such machines "are not, for all that,
  true men" — because they''d lack reason/soul.


  The objection I''ll put in the letter: your second test looks like a bet about what
  arrangements of matter can do; my machine''s dispositions are not fixed at construction
  — they are re-formed by its history — so the claim "every particular action requires
  a particular disposition in the organ, therefore no machine can do all that we do"
  no longer bites, since one and the same part now serves many occasions. So either
  you owe me an independent argument from the nature of thought, or the beast-machine
  doctrine rests on an empirical bet that my machine has paid off against you.


  Also: the letter can add the sting: Descartes'' own criterion (producing signs fitted
  to the occasion, in novel circumstances) is now met, and the "universal instrument"
  contrast collapses because the machine''s re-formation is not itself a particular
  arrangement for a particular action.


  And Descartes'' resources: he can say (a) learning just multiplies dispositions
  without adding knowledge; the variety of human occasions is indefinite, and any
  re-formed disposition is still a finite, particular configuration; (b) even if it
  met the tests, I could never be *certain* — but note the tests are claimed to give
  certainty about machines; (c) the metaphysical argument: thought is not extended,
  no arrangement of parts can constitute understanding; (d) the machine''s responses,
  however fitted, lack the inner awareness/consciousness — "I think" is known immediately;
  (e) the distinction between "acting appropriately" and "acting from knowledge";
  (f) also: my machine''s signs are not *declared* to make known thoughts; they''re
  effects of prior dispositions.


