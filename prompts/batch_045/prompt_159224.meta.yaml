  The idea: everyone who writes about the Orwellian vs Stalinesque business in the
  colour phi case is, I think, sharing one assumption — that a conscious experience
  is a kind of finished item that gets edited, and the only question is whether the
  edit happens before or after it reaches consciousness. (Stalinesque: the record
  is fixed first, then shown. Orwellian: it''s shown, then the record is rewritten.)
  Dennett''s move is that the question is empty because nothing the subject can do
  or say distinguishes them; his critics say it''s a real question we just have no
  handle on. I want to say both are wrong in the same way: the dilemma presupposes
  that experiences are punctate enough to have a single time of occurrence, when the
  interesting thing about phi is that the experience is extended and its content —
  where exactly along the trajectory the colour changes — seems to get fixed only
  as the process plays out. So my question is not ''before or after?'' but: can the
  content of an extended conscious experience be determinate only after that experience
  is over (retrospective determination), or is it rather that the experience is genuinely
  indeterminate in its temporal content while it lasts (call it prospective vagueness),
  and — the part I actually care about — is there any difference between those two
  that isn''t just the old verificationist dispute again?


  What I''d want the proposal to do: state the question so that it has a determinate
  answer (I keep getting told my question is three questions in a trenchcoat, so I
  need it split and I need to say which one I''m answering); say why the standard
