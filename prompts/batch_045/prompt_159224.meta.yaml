  Standard dialectic:

  - Colour phi: two flashes, red at position A, green at position B, ~ short ISI;
  subjects report a single spot moving from A to B and changing colour somewhere mid-trajectory,
  i.e., before the second flash occurs.

  - Puzzle: the subject reports seeing the colour change before the stimulus that
  (presumably) carries the information about greenness has been presented. So either
  (Stalinesque) the brain waits for the second flash and then constructs/fills in
  a conscious experience that never actually occurred as of that time... wait, careful:
  Stalinesque = the revision happens before the experience reaches consciousness (like
  Stalin''s show trials: the record is faked first, then presented). Orwellian = the
  subject first has one (unrevised) conscious experience, and then the record/memory
  is rewritten afterwards (like 1984: history rewritten after the fact).


  In colour phi terms: Did the subject first consciously see red-at-A and green-at-B
  as separate flashes, then have that memory rewritten (Orwellian)? Or was the "moving,
  colour-changing" experience fabricated before it ever reached consciousness, so
  there was never a conscious experience of two separate flashes (Stalinesque)? Dennett:
  the distinction makes no difference to the subject, hence no fact of the matter
  — it''s like asking whether the Cartesian theatre''s projectionist edits before
  or after screening; both are empirically equivalent, so the question is empty.


  Critics: there must be a fact of the matter about the timing of experience; the
  question is substantive but we lack a method.


  My novel angle ideas:


  (A) Split "the timing question" into two: the time of *occurrence* of an experience
  vs. the time of its *availability* to the reporting/acting systems, and argue that
  the Orwellian/Stalinesque dilemma conflates them. Suggest that there''s a third
  option neither side considers: the experience''s temporal *content* is what''s revised,
  without any revision of which experiences occur when — i.e., "no-revision" or "content-revision"
  view: the subject has a single extended experience whose content represents a change
  at t, and the apparent backwards-in-time character is a matter of what the experience
  represents, not when it occurs. Then the dilemma is a false dichotomy generated
  by assuming experiences are punctate/atomistic.


  (B) Injected niche idea: "the double-revision case" or "the interruption probe":
  consider a variant in which the second flash is *cued to be task-relevant* or where
  attention is withdrawn between the flashes; if the revision is a process that takes
  time and consumes resources, it can be disrupted — and, critically, there are *two*
  distinguishable disruption signatures: (i) the subject reports two flashes (revision
  fails entirely) and (ii) the subject reports a moving dot that changes colour *at
  the very end* of the trajectory (partial revision, timing shifted). Only the second
  is interesting because it shows the revised content is graded, which suggests the
  revision is a constructive process with a duration, not an all-or-nothing editing
  event; and if the revised experience is graded/continuous, then the "Orwellian"
  story (a discrete post-hoc erasure of a discrete prior experience) loses its grip,
  while the "Stalinesque" story is also not quite right because the revision isn''t
  complete before consciousness — it *is* the process of becoming conscious over an
  interval.


  Hmm, that''s nice: a "graded revision" / "revision-in-progress" view. The new idea:
  revision is not an event at a time but a process with a *temporal profile*, and
  if we take the temporality of the revising process seriously, the question "before
  or after?" is ill-posed — analogous to asking whether a wave breaks before or after
  it forms.


  (C) Another angle: the *second-order* question. Even if there''s no first-order
  fact, there might be a fact about whether the subject *could have known* — no.


  (D) A really nice angle: the "disagreement" isn''t about the past at all but about
  the *metaphysics of temporal parts of experiences* — but too abstract.


  I think combining (A) and (B) is good, but let me make one crisp, tractable core:


  Core thesis/half-formed idea: The Orwellian/Stalinesque dilemma assumes that there
  is a determinate time at which a conscious experience "happens" and that revision
  is an operation on a record at a time — i.e., both sides share an *editorial* model:
  experience is a finished item that gets edited. I want to propose that colour phi
  is better treated as a case where the experience is *extended* and its content is
  *retrospectively specified* — i.e., the experience has determinable temporal content
  that becomes determinate only as the process unfolds. Then the real question is
  not "before or after?" but "what is the temporal grain / the minimal duration of
  a conscious experience, and can a content be determinate only after the experience
  that bears it is over?" — call it the problem of *retrospective determination of
  content*.


  Then the tractable question: Does colour phi (plus its cousins — the flash-lag effect,
  the cutaneous rabbit, the stopped-clock/chronostasis illusion) give us any reason
  to accept "retrospective determination" (content fixed after the experience) over
  "prospective indeterminacy" (the experience is genuinely indeterminate/incomplete
  in its temporal content) — and, importantly, are these two distinguishable? Maybe
  not, and if not, the interesting conclusion is that the timing debate has been chasing
  a distinction without a difference, but for a *different* reason than the standard
  verificationist one: not because we can''t find out, but because the notion of "when
  an experience occurs" has no determinate application to extended experiences with
  retrospectively determined content.


