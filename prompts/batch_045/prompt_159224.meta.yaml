  Domain: Orwellian vs. Stalinesque revisions and color phi. Type: short research
  proposal. Perspective: PhD student in philosophy (maybe philosophy of mind / cognitive
  science). Casual, typos, British English requested.


  How to make it "in the weeds" and not regurgitated: inject a novel distinction.
  Idea: The standard dialectic is that Stalinesque (memory-insertion / pre-experiential
  revision) and Orwellian (memory-erasure / post-experiential revision) accounts are
  empirically indistinguishable because both posit a revision of the chronological
  record before/after conscious experience. The standard moves: Dennett argues the
  distinction is not empirically distinguishable and hence not a real distinction
  (Cartesian theater vs. multiple drafts); critics (e.g., some argue that there is
  a fact of the matter about the temporal order of experience).


  Niche new idea to inject: something like "the ''editing room'' objection — the question
  is not whether the subject has one experience or two, but whether the temporal content
  of a single experience can be revised" — hmm. Let me think of a genuinely interesting
  new angle.


  Options:

  1. Distinguish "order of experience" from "order of content": maybe the subject
  experiences a red dot then a moving dot changing colour — the question is whether
  the *content* mentions a temporal sequence or whether the *experience itself* is
  extended in time. A Stalinesque/Orwellian distinction might collapse at the level
  of *diachronic* vs *synchronic* unity.


  2. Inject the idea of "phenomenal layering": maybe there can be a genuine difference
  between Stalinesque and Orwellian if we attend to whether the revision is *available
  to introspection at the time* — e.g., a "double-revision" case: a revision that
  is itself experienced as occurring (the subject notices the change in the record),
  which would be a third possibility, and whether that third possibility breaks the
  symmetry.


  3. Tie to a newer empirical phenomenon: the "flash-lag effect", "skin rabbit illusion"
  (Geldard & Sherrick), "cutaneous rabbit", "chronostasis" (the stopped-clock illusion),
  "the colour phi with a backwards variant", "reversed phi". Also "the Fröhlich effect".
  A nice niche angle: use *masked* or *subliminal* variation — e.g., what happens
  when the second stimulus is present but the subject reports no change? Or the "two-flash
  fusion"?


  4. A newer and interesting idea: the "verificationist" framing — Dennett''s argument
  is that if the difference makes no difference to the subject''s reports or behaviour,
  there''s no fact of the matter. But maybe there could be a difference in *what it''s
  like later*: in the Stalinesque case, the subject''s later memory contains an experience
  they never had (the experience of the moving, colour-changing dot); in the Orwellian
  case, the subject genuinely had two experiences (red, then green) and then lost
  one. Compare with the possibility of *blocking* the revision: e.g., TMS or attentional
  blink could disrupt the consolidation stage; if the disruption causes the subject
  to report the unrevised sequence, that shows... Actually Dennett''s own reply: the
  disruption just changes what''s drafted.


  A nice novel angle: Distinguish *revision of the record* from *revision of the temporal
  ordering of experience* by considering the "specious present" granularity: What
  if the experience of the colour change is not a revision at all but a single experience
  with temporal content ("seeing-as-changing") whose duration spans both flashes —
  then the Orwellian/Stalinesque dilemma presupposes that experiences are temporally
  punctate. So maybe the interesting question is: does colour phi tell us anything
  about the temporal grain, or does the dilemma presuppose atomism about experience?


  I like a combination: The PhD student''s half-formed idea: both sides of the Orwellian/Stalinesque
  debate assume that the unit of experience is an instantaneous or near-instantaneous
  "content-bearing" state, and the only question is when the record gets edited. They
