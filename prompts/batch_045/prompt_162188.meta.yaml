  I am drafting a paper on the ethics of lending, and I keep meeting the tag "money
  is barren" (money does not breed money), usually traced back to Aristotle''s treatment
  of interest in the Politics, where the point is put by way of the word for interest
  also meaning offspring: money comes back as money, parent resembling child, and
  so this is said to be the most unnatural way of acquiring wealth. At a seminar last
  week the tag was used to end an argument rather than start one. The speaker''s claim
  was that charging for a pure loan is charging for nothing: the lender transfers
  a sum, receives the same sum plus a surplus, and has done nothing to it in the interval;
  "money is barren" was offered as the reason why no service has been rendered and
  why interest is, in the older vocabulary, usurious. I want to know what the sentence
  would have to mean for that argument to go through, and I suspect it is doing several
  different jobs at once.


  Could you lay out, as a menu, the distinct precise theses the tag might be expressing
  — ordered roughly from the trivial to the demanding — and for each: what exactly
  it asserts; what further premise it would need in order to yield the conclusion
  that a pure loan involves no service and no product; whether it is a platitude,
  a substantive and defensible claim, a piece of definitional fiat, or something false;
  and whether it actually supports the use my interlocutor made of it.


  I would also like the readings tested against three complications rather than merely
  stated:


  1. Does the tag''s force depend on what the borrower does with the money — seed
  corn bought and sown, a consumption good, or a sum simply kept under a mattress
  and repaid out of unrelated income? If the claim is about money, it should not;
  if it is about what money finances, the seminar use looks very different.

  2. What happens when the lender is the kind of institution that creates the balance
  it lends, so that the "money" advanced did not exist beforehand? Say whether the
  barrenness claim, on each reading, is even about the same object in that case.

  3. Aristotle also holds that money exists by convention rather than by nature and
  can be invalidated by those who use it, and that money''s work is to serve as a
  measure that makes unlike goods commensurable. Show how the readings interact with
  that: what kind of thing must money be, on each reading, for it to have a nature
  rich enough to be barren, or for its proper use to rule out a return? And distinguish,
  where it matters, barrenness of the token, barrenness of the lending relation, and
  unnaturalness as a verdict on a practice of acquisition rather than on a substance.


  Conclude by saying which reading the seminar speaker was most likely invoking, and
  whether that reading survives the three complications. Please argue from the distinctions
  themselves; I do not want bibliography or citations.


