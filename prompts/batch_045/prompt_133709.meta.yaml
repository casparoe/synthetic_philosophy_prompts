  I''m in a reading group that''s doing Hume''s essay on the standard of taste next
  week — me, two philosophy grad students, and my flatmate who does psychometrics
  and keeps asking what the dependent variable is supposed to be. The thing we keep
  going in circles on is the mismatch between his opening move (beauty is no quality
  in things themselves, it exists only in the mind that contemplates them — I''m paraphrasing
  badly from memory, don''t hold me to the wording) and the rest of the essay, where
  he more or less tells you which works really are better, on the authority of critics
  picked out for delicacy of taste, practice, comparison, freedom from prejudice and
  good sense. Half of us thinks the second half quietly takes back the first.


  To stop us spinning I tried to turn it into a bet, and my flatmate invented a study
  to pin it down — call it the Meridian study, and please just take the results as
  given. 300 critics from 11 countries, all with 10+ years professional experience,
  screened for delicacy with a fine-grained perceptual discrimination task, no financial
  stake in any of the works. Three sets of 60 objects: Ming-dynasty porcelain, twelve-tone
  serial music, and procedurally generated images nobody had seen before. Everyone
  got 60 hours of exposure spread over six months, and half were randomised into an
  art-historical briefing. Results: rank agreement was high for the porcelain (~0.7),
  essentially chance for the serial music, and for the generated images it started
  at chance and climbed to about 0.25 with exposure. In a second, balanced condition
  each object was shown with either a prestigious or an obscure attribution; mean
  ratings moved about 0.4 SD with attribution but the ordering was largely preserved
