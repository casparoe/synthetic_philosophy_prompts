  Something I keep chewing on for my political theory seminar: in Norway and Finland
  the tax authority publishes what everyone earned and paid, and anyone can look up
  a neighbour, a colleague or a footballer and see the number. In the US we treat
  pay as almost pruriently private — plenty of firms tell employees not to discuss
  salaries, and a manager who posts the team''s numbers has committed a social crime.
