  envy with a database). What does publishing it actually presuppose about success,
  desert and legibility? Is it a way of cutting the tall poppy down to size, or is
  it rather the precondition for an earned success being honoured rather than resented,
  since it''s the only way the claim that someone earnt it can be checked — in which
  case the American Dream''s celebration of success sits oddly with our secrecy?


  Two things I want kept apart: what the practice strictly presupposes vs. what it
