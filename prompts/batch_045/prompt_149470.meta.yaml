  substitution), (b) objection to sacrificing/using a person without consent (a constraint,
  side-constraint), (c) objection to unfair/unequal distribution (procedural — the
  lottery). Note which reading convicts Dudley and Stephens and which one only convicts
  them of doing it unfairly. Also: what happens on the "lottery" variant — if they
