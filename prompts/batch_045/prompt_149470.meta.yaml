  and then ask whether the "pure" separateness reading (no aggregation at all) is
  committed to four deaths — bite the bullet or reductio?

  3. The wrinkle of Parker being youngest/weakest/ill and likely to die first anyway:
  does that matter to a separateness-based objection, or does it smuggle in aggregative
