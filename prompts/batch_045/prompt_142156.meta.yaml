  Key moves an A answer must make:


  1. **Separate the descriptive from the normative.** The Uptake findings tell us
  about (a) gradedness of the capacity, (b) the constitutive feedback between holding-responsible
  practices and the capacity, (c) the instrumental value of address. But basic desert
  (Caruso''s target) is the claim that an agent deserves blame/praise *just because*
  of their action and the quality of will it manifested, and not merely because blaming
  has good effects. So the finding that address raises Uptake is a *forward-looking*
  reason to blame — it doesn''t show the agent *merited* the blame. The deep question
  left open: whether the appropriateness of holding responsible is fully explained
  by its forward-looking effects, or whether there''s an irreducible backward-looking
  element. Both Dennett and Caruso agree that desert is not a property we can read
  off metaphysics; they disagree about whether the practice can be vindicated without
  appeal to ultimate origination.


  2. **The self-constitution point cuts both ways.** For Dennett, (ii) is a vindication:
  responsibility is an achieved, socially scaffolded competence; holding responsible
  is how we make and keep each other answerable; there''s nothing more to want than
  this — this is the "varieties of free will worth wanting" move: ask whether the
  alternative (origination the social world can''t touch) is even worth wanting. For
  Caruso, (ii) is at best a public-health justification with a different structure
  and it still doesn''t give basic desert: the fact that the practice constitutes
  the capacity doesn''t answer whether the agent had the *ultimate* control over having
  that capacity (problem of the "luck" of constitution, upbringing, and scaffolding).
  And crucially: if Uptake is largely a product of being scaffolded well, that''s
  arguably *more* reason to think the badly scaffolded offender is unlucky, not deserving.


  3. **The feedback loop creates a dilemma for the expressivist/address-hearing compromise.**
  If address is required but has no effect on sentence, then it''s either (a) pure
  symbolism — in which case Dennett should ask what work "desert" is doing if nothing
  turns on it, and whether the practice can survive being cost-free in that way (Dennett''s
  own pragmatism: practices that do no work tend to decay or become hollow); or (b)
  it''s an intervention on the offender''s Uptake — in which case Caruso should object
  that it''s a manipulation/means-using: we''re altering the offender''s motivational
  structure for public safety, which is exactly what the quarantine model permits
  only within strict limits (necessity, least restrictive means, no punitive hard
  treatment). So the compromise is unstable in the sense that it either collapses
  into Dennett''s practice-dependent desert (where the address *must* be able to bite)
  or into a form of therapy the sceptic must justify on non-desert grounds.


  4. **The praise/blame asymmetry.** If desert is rejected, it''s rejected for praise
  too — basic desert is symmetric; Caruso''s official position is that there''s no
  basic desert for either. But many find the asymmetry tempting (we keep honours,
  drop punishment). An A answer should say why the asymmetry needs an argument: if
  the point is that ultimate control is missing, honours are as unjustified as hard
  treatment; if the point is about the *burdensomeness* of hard treatment, then the
  asymmetry is really a proportionality/consequentialist constraint, not a desert
  claim. And Dennett can exploit this: his view can explain why praise is less institutionally
  fraught (praise doesn''t need coercive enforcement) while insisting both are desert-involving.


  5. **Name the real crux and say what would settle it.** The crux: whether "desert"
  can be fully spelled out in terms of the norms internal to a practice of holding
  responsible that is justified by its effects (Dennett-ish, practice-dependent, possibly
  a form of "moral responsibility as answerability") or whether desert claims necessarily
  carry a metaphysical commitment to ultimate origination that our best science can''t
  underwrite (Caruso-ish). What settles it isn''t more neuroscience but an argument
  about whether the internal norms of the practice are answerable to something beyond
  their effects — e.g. whether we can make sense of a practice being "fitting" independent
  of its consequences, and whether complaints like "you''re using me as a means" retain
  force once desert is dropped.


  6. **Bonus A-grade move**: notice that the Uptake findings, if address raises Uptake,
  might make Caruso''s own quarantine model *less* effective (iii) — so the sceptic
  may need address after all, and then has to say whether address-without-desert is
  coherent; i.e., can you address someone as a moral agent while believing they don''t
  deserve it? (The "moral address without desert" question.) Some think this is the
  deepest problem for the sceptic.


