  I''ve been reading LessWrong and its adjacent blogs for going on fifteen years,
  and next month I''m giving a talk to a meetup that is, demographically, almost exactly
  that crowd: mostly self-described consequentialists, maybe a quarter of them working
  in or adjacent to effective altruism, several with decision-theory and economics
  training, a couple of hard-line longtermists, one or two people who take contractualist
  and person-affecting views seriously, and essentially nobody with a taste for rights-talk.
  Very few will be impressed by an appeal to intuition, and quite a few will reach
  for expected value and Harsanyi within the first two minutes.


  The thesis I want to defend is not that utilitarianism is false. It is that the
  separateness-of-persons objection has been argued about at the wrong level of description,
  and that once you move the argument to the right one the objection stops being a
  refutation of aggregation and becomes a parameter.


  Sketch: (i) What the objection really turns on is not the number of persons but
  a structural feature I call non-fusion — the fact that goods located in distinct
  loci of agency do not fuse into a single larger good that someone or something enjoys,
  even when the loci are otherwise perfectly unified. (ii) This feature shows up where
  there aren''t two persons: in fission and gradual-teletransportation-style cases,
  and more mundanely in the relation between earlier and later stages of one life,
  given a reductionist view of personal identity. (iii) It fails to show up where
  there are two persons, if the case is constructed so that there is no fact of the
  matter about whose good is whose. So ''persons'' is a proxy for the property, not
  the property. (iv) The upshot: the disagreement is best modeled as a disagreement
  about a single scalar, the substitution rate at which one locus''s gain may be traded
  for another''s, with total utilitarianism as the rate-one limit and no-aggregation
  views as the rate-zero limit; intermediate rates are coherent, and the choice among
  them is substantive rather than rhetorical.


