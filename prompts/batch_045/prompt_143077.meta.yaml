  Let''s write prompt:


  "I''m in a undergrad reading group on philosophy of mind / cognitive science, and
  last week we were going over the ‘Ant Fugue’ dialogue in Hofstadter’s Gödel, Escher,
  Bach — the ant-colony one with Aunt Hillary and the Anteater. You know the setup:
  Aunt Hillary is a colony of ants, the individual ants are constantly dying and being
  replaced, the Anteater eats some of her and her ability to think or meaningfully
  say ‘I’ degrades, and the whole thing is written kind of like a fugue where you
  can read the lines at the level of individual ants, at the level of the colony,
  or at some weird self-referential level. One person in the group kept repeating
  the old slogan ''the whole is more than the sum of its parts'' as if that settled
  the question of whether Aunt Hillary really has a mind over and above the ants,
  and someone else just said she is nothing but ants all the way down. I want to come
  back next session with something sharper then just picking a side."


  "So here''s what I need: please take the slogan ''the whole is more than the sum
  of its parts'' and lay out, as a bullet-point menu I can bring to the group, the
  different precise claims it could be making in this Aunt Hillary context, ordered
  from the totally trivial to the wildly radical. For each reading, say whether it''s
  a platitude / trivially true, substantive and defensible, or actually false or question-begging,
  and — this is the part I really care about — whether that reading would actually
  do the philosophical work my classmate wanted. That is, would it get you from ''there
  is a bunch of ants interacting'' to ''there is a single thinking being / a mind
  / a self / a subject of experience here'', or is it compatible with the reductionist
  just shrugging and saying, sure, and it is still nothing but ants?"


  "Please make the menu fine-grained, not just ''it means emergence''. Some seed distinctions
  I had in mind: (a) the mereological point that a collection or structured whole
  can have properties (mass, location, throughput of food, robustness to damage) that
  no single ant has; (b) the predictive or explanatory-irreducibility claim that you
  cannot infer or fully explain colony behavior from ant-level descriptions alone,
  so you need a higher-level vocabulary; (c) the causal-powers claim that the whole
  can do things no part can do; (d) the semantic / symbol-system claim that the colony
  is a level of interpretation where patterns of ants function as signals that refer
  or mean things, so there is a language of the colony; (e) the identity-over-time
  claim that Aunt Hillary can persist through complete turnover of her ants, so she
  is a continuant distinct from any particular ant; (f) the consciousness / subjectivity
  claim that there is something it is like to be Aunt Hillary, a unified ''I'' with
  the strange-loopish self-representation Hofstadter is always on about; and (g) the
  spooky ontological-emergence claim that some new non-physical stuff or extra vital
  property pops into existence once the ants are arranged right. Feel free to add,
  split, or rename readings, but for each one tell me whether a reductionist could
  happily accept it, and flag which reading(s) people usually mean when they deploy
  the slogan to end arguments about ant colonies and minds. Finally, say whether that
  usual reading is actually supported by the Aunt Hillary setup or whether it just
  assumes the conclusion that the colony is a minded subject."


