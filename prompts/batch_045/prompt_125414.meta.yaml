  Let me draft:


  ---


  I teach a graduate seminar on risk regulation, and I keep failing to convince my
  students that the precautionary principle is anything more than cost–benefit analysis
  wearing a safety helmet. Every example I bring — a pesticide, an additive, a new
  industrial process — gets dissolved: they re-run my example with a slightly more
  pessimistic utility for death or a more conservative prior, and then expected-utility
  maximization delivers exactly the "precautionary" verdict on its own, at which point
  they say the principle was redundant all along. So I want a case constructed to
  order, and I want it built so that this move is unavailable.


  What I need is a decision problem with these properties:


  (a) Realistic and small-scale: something a city council, a water utility, a hospital
  board, or a school district could genuinely face this year. No existential risk,
  no runaway AI, no global catastrophe, no unfamiliar technology — the uncertainty
  should be about whether a familiar intervention has a harmful side effect, not about
  the fate of the world.


  (b) Well-characterized numbers: state a probability interval and a magnitude for
  the suspected harm, and a magnitude for the forgone benefit. The probability must
  be high enough that no de minimis threshold applies (put it somewhere between 1
  in 20 and 1 in 5), the harm must be finite and modest — serious illness or a small
  number of deaths, not extinction — and the uncertainty must be the ordinary, bounded
  kind that lets an expected-value calculation go through cleanly. In other words,
  deny yourself the two things the precautionary principle is usually accused of exploiting:
  a vast unknown tail and a probability too small to estimate.


  (c) The verdicts: expected-utility maximization must clearly favor adopting the
  intervention, and the precautionary principle must clearly favor not adopting it.
  Pick one formulation of the principle and state it in a single sentence at the top;
  use it consistently.


  (d) Robustness, so my students can''t deflate the case: the expected-utility verdict
  must survive every probability in your stated interval and at least a threefold
  change in how the harms and benefits are valued relative to each other. The precautionary
  verdict must not be recoverable by expected-utility reasoning with a different prior,
  a different utility for death, or a different discount rate. If it is, say so plainly
  — I would rather have an honest report of failure than a case that cheats.


  (e) The point of the exercise: I want to isolate whatever it is that the precautionary
  principle tracks that expected-utility maximization doesn''t — my hypothesis is
  that it''s something relational or deontic (who imposes a risk on whom, whether
  the risk-bearers consent, whether they can be compensated, whether the benefit accrues
  to the same people), rather than something about magnitude or probability. Build
  the case so that this feature, and only this feature, is doing the work.


  Deliverables, in this order:


  1. One sentence: does the case work? (I''ll read the rest in light of this.)

  2. The scenario: one paragraph, no more than 150 words. Name the decision, the decision-maker,
  the people who bear the suspected harm, and the people who get the benefit — concretely
  enough that the relational structure is visible.

  3. Your one-sentence formulation of the precautionary principle, plus the expected-utility
  calculation with your numbers.

  4. Roughly 100 words on why each approach gives the verdict it gives.

  5. Roughly 80 words: which feature of the case is doing the work, and what happens
  to both verdicts when you remove it — e.g., give the risk-bearers ex ante consent,
  or make them the same people as the beneficiaries. If removing the feature doesn''t
  collapse the disagreement, the feature wasn''t doing the work and the case needs
  rebuilding.

  6. Roughly 80 words: the strongest objection a cost–benefit analyst would make against
  your case, and the best reply available to the precautionary side.


  Keep the whole answer under 700 words, and don''t pad the scenario with atmosphere
  — I need the structure visible.


