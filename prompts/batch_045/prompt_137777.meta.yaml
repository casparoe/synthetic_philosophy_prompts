  I write plotted fiction of an unfashionably determinate kind: I fix the ending before
  I write the middle, and much of the craft lies in deciding what, earlier in the
  book, the ending can honestly be said to have hinged on. I have agreed to write
  a short essay on causation in narrative, and before I commit my working assumptions
  to print I would like them audited for consistency, because several of them are
  ones I hold for quite different reasons and I have never checked whether they compose.


  Here is the set.


  (1) Causation is counterfactual dependence — a species of difference-making — and
  not the production or transmission of something. Correspondingly, I distrust interventionist
  accounts: it seems to me wrong to build an agent''s capacity to manipulate, or a
  model we have chosen to write down, into the metaphysics of what causes what. The
  counterfactuals are there in the world, fixed (as I understand it) by an objective
  ordering of similarity — the Lewis–Stalnaker apparatus, as I have encountered it
  — and similarity is not a matter of convention or of what we happen to be interested
