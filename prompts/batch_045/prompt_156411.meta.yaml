  Draft:


  "I chair the programme committee of the Alveston Scholarship Trust, a small endowed
  charity whose deed restricts its awards to students born in a single named country.
  For the past year the trustees have been arguing about whether to petition to broaden
  that restriction, and the argument keeps turning on questions I can''t settle: whether
  the trust''s freedom to choose its beneficiaries really includes freedom to choose
  them on grounds we would call discriminatory, whether our original donor''s intentions
  generate claims that outlive him, and what we owe to applicants who are poor through
  no fault of their own. As luck would have it, the trust''s annual public lecture
  this spring is to be given by a political philosopher whose new book defends a right
  of political communities to exclude would-be immigrants, and I have agreed to interview
  her on stage afterwards.


  Her position, as I understand it from the book, has three parts that I''d like the
  questions to engage with. First, she grounds the right to exclude in the freedom
  of association of a community''s existing members together with their collective
  ownership of public institutions and territory — the state''s right is derivative
  of the members'' rights, not a sovereign prerogative. Second, she argues that the
  right to exclude is a right to refuse admission rather than a right to make people
  leave: while she thinks a state may decline to admit, deny welfare benefits and
  shut out of the formal labour market those who arrive anyway, she denies that it
  may deploy coercive force to remove them, and she has said in print that open borders
  and a generous welfare state are simply incompatible and that the incompatibility
  should be resolved in favour of open borders with restricted access to benefits.
  Third, she concedes a reciprocity proviso: a state whose policies have materially
  contributed to the conditions that make people want to leave forfeits, against those
  people specifically, its right to exclude them.


  Please draft ten to twelve questions for a forty-minute on-stage conversation, none
  of them biographical or generic, that press on the joints of this position rather
  than asking her to restate it. Where you can, anticipate her most likely reply and
  give me the follow-up that that reply invites. In particular I''d like at least
  one question on each of the following, and any others you think belong: ..."


