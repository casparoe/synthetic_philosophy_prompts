  That''s good. Let me refine the candidate demands list. Make them sharp and slightly
  in the weeds:


  (i) the agency–causation gap: an account must say what "acting" adds over "causing,"
  and must not just stipulate that any cause that matters is an agent (else every
  oxygen molecule acts);

  (ii) re-identification: an actor must be the same actor across the stretches of
  narrative it figures in — a strain, an eruption, a decade of cold — and the theory
  must say what holds it together (this is a re-identification requirement);

  (iii) intentionality: agency requires responsiveness to reasons or goals, so germs,
  climates, and volcanoes fail, and attributions of agency are metaphor;

  (iv) the archive/legibility requirement: a non-human factor counts as a historical
  actor only where contemporary sources registered it as one — otherwise we are retrojecting
  our causal models onto people who did not have them;

  (v) symmetry: whatever counterfactual scrutiny we apply to human actions we must
  apply to non-human ones, and vice versa — no sheltering non-human causes from the
  demand for a mechanism, and no demanding a mechanism of human ones;

  (vi) anti-determinism: the account must make it impossible to derive a human outcome
  (a revolt, a migration, a famine''s political consequences) from the non-human factor
  alone;

  (vii) scale-invariance: the same account must handle events at microbial and climatic
  timescales;

  (viii) non-redundancy / causal-exclusion: the account must say what happens to human
  deliberative explanation once a non-human actor is admitted — whether it is displaced,
  supplemented, or reframed.


  And note: (iii) is a prejudice (it settles the question by definition); (vii) scale-invariance
  is maybe a prejudice (a "camp" demand); (i) is genuine. The answerer should sort
  them. Good — that''s exactly the "which are genuine desiderata and which are prejudices
  of one camp" work.


  The Two-Ledger Condition: an account of non-human agency must maintain (a) a geophysical/biological
  ledger on which the eruption or the pathogen''s mutation is an event in a series
