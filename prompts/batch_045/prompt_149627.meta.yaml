  Prompt:


  I''m a PhD student in history finishing a dissertation chapter in which I treat
  a pathogen, a climatic shift, and a volcanic eruption as causal factors — and my
  committee keeps pushing me on whether I''m entitled to call any of them "agents"
  rather than "conditions." Before I dig in further, I''d rather have the specification
  than the reading list. So: write the desiderata that any adequate theory of non-human
  historical agency would have to meet.


  Requirements/constraints to include:


  - The theory''s job: to license (or refuse) claims of the form "X acted" / "X was
  a historical actor" for X a germ, a climate system, a volcano, a glacier, a soil,
  while still being usable in ordinary historical explanation.

  - For each desideratum give the case or consideration behind it.

  - Distinguish genuine desiderata from camp prejudices. Give candidate demands and
  ask which are which: e.g., (i) that agency requires responsiveness to reasons /
  intentionality; (ii) that a non-human actor must be individually identifiable and
  re-identifiable across a narrative; (iii) that the account must preserve the explanatory
  primacy of human deliberation; (iv) that it must be compatible with the archive
  (i.e., a non-human actor can only count as an actor if contemporaneous sources registered
  it); (v) that it must scale — the same account must handle a pathogen acting in
  weeks and the Little Ice Age acting over a century; (vi) that it must avoid environmental
  determinism, i.e., must never let a non-human factor entail a human outcome; (vii)
  that it must give a non-question-begging criterion for "acting" vs. "merely causing";
  (viii) that it must not require counterfactual robustness (since historical counterfactuals
  about climate are untestable).

  - Flag any pair (or triple) of desiderata that plausibly cannot be jointly satisfied
  — and say which one you''d drop. In particular: the "legibility in the archive"
  demand and the "timescale" demand pull against each other; also the "must not be
  deterministic" demand and the "must explain why the volcano mattered more in 1816
  than in 1810" demand.

  - Note the "proxy problem": our evidence for past climate/volcanism/pathogens comes
  from proxies (ice cores, tree rings, aDNA, parish burial records) whose interpretation
  itself depends on human theory — so there''s a circularity worry about treating
  the trace as the actor''s act. Say whether an adequate theory needs a condition
  that blocks it.

  - Inject a novel/niche desideratum of my own that I''m considering: something like
  the "Double-Bookkeeping Condition" — an account of non-human agency must keep two
  ledgers, one on which the volcano''s eruption is an event in a geophysical series
  with its own dynamics (not a reason for anything) and one on which it is a node
  in a human narrative to which historians attribute significance, and must state
  the rules for transferring items between ledgers; an account that fuses them (so
  the volcano literally "intends" or the eruption literally "is" the famine) has collapsed.
  Ask whether this is a genuine desideratum or a restatement of something else / a
  prejudice.


