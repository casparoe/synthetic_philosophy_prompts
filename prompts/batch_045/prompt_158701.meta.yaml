  Draft:


  I run a little film-and-philosophy night at my place — six or seven of us, mostly
  grad students plus my neighbour who just shows up for the snacks — and we''re doing
  Bergman''s The Seventh Seal next week (the one with the knight playing chess with
  Death on the beach). I want to use it to talk about the argument from divine hiddenness,
  roughly: the version that says a perfectly loving God would make it so that anyone
  capable of relating to him and not resisting that relationship would actually be
  able to, and since there seem to be sincere, non-resistant people who just can''t
  find him, that''s evidence against such a God.


  The thing I keep going back and forth on is that the film seems to be working with
  two quite different kinds of hiddenness and I''m not sure it (or the argument) distinguishes
  them. When the knight talks to Death in the little chapel, what he asks for is knowledge
  — he says he wants certainty rather than faith or guesswork — but he also asks for
  God to reach out, show himself, speak to him, which sounds less like "give me a
  proof" and more like "I want my friend to answer when I call." Call the first propositional
  or evidential hiddenness and the second relational hiddenness. My hunch is that
  the standard argument quietly needs both (a loving God wouldn''t leave you in doubt
  AND wouldn''t leave you alone), and that they can come apart: a God who dumps overwhelming
  evidence on everyone might still be personally absent, and a God who is intimately
  present to you in prayer might still leave you unable to say whether he exists.
  Does that distinction hold up, and does the film do anything with it?


  Then there are two moves I want to test against the movie, and I''d love you to
  say which of them the film actually supports, complicates, or just isn''t about:


  - The deferral reply: my friend Priya''s idea that hiddenness doesn''t count against
  a loving God if it''s temporary and gets resolved later — you meet God face to face
  after death, so there''s no one who is permanently shut out of the relationship.
  The knight spends the whole film bargaining for time and then loses to Death anyway;
  the final image is the line of people dancing off into the dark with Death leading
  them. Does the ending read as an endorsement of the deferral reply, or as a refusal
  to answer, or as something darker than both?


  - The uneven distribution problem: the juggler Jof has visions (Mary and the child
  in the churchyard, the Dance of Death at the end) while the knight, who is arguably
  the most sincere seeker in the film, gets nothing but silence and a chess game.
  If a hidden God sometimes shows himself to people and sometimes doesn''t, which
  way does that cut? It looks like it makes things worse for the theist if the distribution
  is arbitrary, but it might also suggest the film''s own view: that what blocks the
  knight isn''t God''s absence but something in the knight — his grimness, the crusade,
  his inability to be delighted by a bowl of milk and strawberries. If that''s the
  reading, then the film isn''t about evidential hiddenness at all and I''ve mis-framed
  the whole session.


