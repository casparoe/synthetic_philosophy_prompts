  states that the value of information is non-negative — it''s about the expected
  value of perfect/imperfect information. Also there''s the nuance: this holds for
  an agent whose utility is not state-dependent and who can commit to ignoring information;
  it fails with state-dependent utility, risk aversion over beliefs, or when information
  is costly, and also when the act of observing changes the world (measurement effects),
  and there''s the "chocolate not good" tension with preference for information/timing.
  Also there''s the "value of information" being zero when it doesn''t change the
  action (only matters if it changes decisions); also the converse — information can
  make you worse off if you can''t commit to ignoring it (e.g., you''re forced to
  act on it — in games, or with a principal-agent problem, or "the value of flexibility").
  Also there''s the result about the value of information with multiple agents / strategic
  settings: knowing more can make you worse off (e.g., in games, "informational cascades",
