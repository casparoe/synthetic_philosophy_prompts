  That''s a nice set of tests drawn from the theory:

  Gate 0: is it a conditional at all, or a quantifier/"whenever"? (restrictor)

  Gate 1: modal hunt (Kratzer) — find what the if-clause restricts.

  Gate 2: embedding/negation test — can it take a truth value?

  Gate 3: probability assignment: if you want "P(if A then B) = 0.7", check the triviality
  trap: are you reading it as (a) the probability of a proposition, or (b) your conditional
  confidence in B given A? Lewis''s result: you can''t have both for all A, B, P.
  Rule: in copy, always say "given A, the chance of B is about 0.7" or "I''d put 7-in-10
  on B if A turns out true" — never "there''s a 70% chance that if A then B" unless
  you mean the material conditional in a context where its weakness is harmless.

  Gate 4: independence / common-cause check → is this causal? Then it''s a counterfactual;
  needs an intervention, and needs a model, not a probability.

  Gate 5: the ¬A robustness test ("if you learned A were false, would you retract?")
  — if not, you''re making a claim about the link, not a conditional assertion. (This
  is the "does it survive learning ¬A" test — related to the fact that on the material
  reading, conditionals with false antecedents are vacuously true.)

  Gate 6: vagueness/measurability of consequent — if B has no checkable truth conditions
  ("the field will have to rethink"), either define a proxy or mark as normative →
  editor sign-off.

  Gate 7: source-attribution: if the conditional is a quote, and you''d have to repair
  it to make it truth-evaluable, then attribute rather than assert.


  Also: the "no number available" branch, the "hand to a human/editor" branch (values),
  and "the procedure can''t do X" (it can''t tell you whether the causal model is
  right, can''t fix vague consequents, can''t settle whether to run a punchy line).


