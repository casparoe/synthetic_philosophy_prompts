  Argument (call it the "No Free Lunch" argument / the "value-neutrality trilemma"):


  (1) A side-effect penalty is value-free (non-question-begging) only if it doesn''t
  need to know which changes matter — i.e., only if it penalizes all changes it can
  detect, impartially.

  (2) But the agent must be allowed to bring about the changes constitutive of achieving
  its goal G (e.g., moving a vase to dust under it, or building the thing it was asked
  to build); so the penalty cannot penalize all changes impartially: it must exempt
  some.

  (3) To exempt the right changes, the measure must distinguish goal-relevant changes
  from goal-irrelevant ones.

