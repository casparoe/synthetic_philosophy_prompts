  ---

  A guy whose blog I read has a long post on Kavka''s toxin puzzle, which I''d never
  heard of. His version: a billionaire hands you a glass of stuff that will make you
  miserable for about a day and nothing worse, and says you get a million dollars
  if, at midnight tonight, you manage to *intend* to drink it at noon tomorrow — the
  money is for the intention, you don''t have to actually drink. His argument that
  you can''t win: intending to do something requires believing that you''ll do it;
  but you know that by tomorrow, once the million is already banked, your only reason
  to drink has evaporated and there''s just the day of misery left; you can foresee
  that perfectly well now; so you can''t now believe you''ll drink, so you can''t
  now intend to. He then says this shows intentions aren''t the kind of thing you
  can just decide to have — ''you can no more choose an intention than you can choose
  a belief'' — and that this is a real problem for decision theory, since decision
  theory models agents as picking whatever intention maximises expected utility, which
  is also why it flails on Newcomb''s problem.


  Then he offers what he calls the obvious workaround: just make the intention stick
  by some indirect route — announce it publicly, or bet a friend a million you''ll
  drink, or decide to be the sort of person who does what they said, or simply drink
  it anyway out of spite once you have the money. He says any of these dissolves the
  puzzle, and that anyone still treating it as deep is just refusing to notice that
  the setup sneaks in an assumption that your future self has no reason to act.


  He adds in a footnote that the same puzzle works with believing instead of intending
  — imagine the billionaire pays you for *believing at midnight* that you''ll drink
  tomorrow — and that this proves the puzzle was never really about intention at all,
  just about self-prediction.

