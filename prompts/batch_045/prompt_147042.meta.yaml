  as obvious, and sliding from "can''t intend what you know you won''t do" to "can''t
  intend what you believe you probably won''t do". Also there''s a subtlety: you can''t
  intend to A while believing you won''t A — that''s Kavka''s premise roughly. Hmm,
  is Kavka''s premise "to intend to do A you must believe you will do A"? I believe
  Kavka''s argument: "an intention to do A requires a belief that one will do A" isn''t
  quite it — I recall: "if you intend to drink, you must believe that you will drink
  (or at least that there''s a good chance)". The standard reconstruction: (1) To
  intend to A you must believe you will A. (2) You know that if you get the money
  you will have no reason to A. (3) You know you won''t A (given you''re rational).
  (4) So you can''t believe you will A. (5) So you can''t intend to A. Then the generalization/subtleties.
  So the blog''s rendering is basically the standard reconstruction — good, "mostly
  right."


  2. The scope overstatement: "intentions aren''t the kind of thing you can decide
  to have" full stop — the puzzle at most shows you can''t form an intention *for
