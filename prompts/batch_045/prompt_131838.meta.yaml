  to any formalization, including syntactic ones, if they have closure rules — it''s
  a general issue about idealization, not a refutation of possible-worlds semantics
  per se; (iv) and it''s arguably a feature: it models implicit or idealized knowledge;
  also the "problem" matters for different purposes: for distributed systems/AI knowledge,
  the idealization is used differently (Fagin et al., Reasoning About Knowledge, ideal
  agents). Also the confusion: conflating the "logical omniscience" of the model with
  a claim about actual agents — the semantics is a model of an agent''s information,
