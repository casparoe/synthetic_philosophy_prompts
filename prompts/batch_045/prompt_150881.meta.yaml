  Prompt:


  Two widespread social practices pull in opposite directions, and I want the implicit
  theory behind each reconstructed rather than defended.


  The celebratory practice (stereotypically American): business magazines tag each
  large fortune as inherited or self-made and treat the self-made tag as the honorable
  one; universities name buildings after donors and profile alumni who "made it";
  commencement speakers tell graduates to make their mark; a founder is publicly thanked
  for the jobs and products that exist because of her.


  The leveling practice (Jantelagen in the Nordic countries, tall-poppy cutting in
  Australia and New Zealand): the successful are expected not to presume they are
  anybody special, visible display of prosperity draws disapproval, and public figures
  who boast are actively knocked down — in the press, in taxes, in everyday gossip.


  Neither practice is applied uniformly, and that is the part I want explained. Leveling
  cultures do not level their Olympic champions, chess prodigies or Nobel laureates
  — they celebrate them at least as loudly. Celebratory cultures do not celebrate
  inherited wealth, and they turn on the successful who display their success too
  visibly. And both cultures appeal to desert: one says the successful person earned
  it, the other says she had help and luck.


  Questions: What view of desert, credit and status does each practice actually presuppose,
  and which rival views does it quietly rule out? In particular, distinguish (a) a
  desert view on which credit tracks what the person made happen that would not otherwise
  have happened — relative, say, to the next-best available replacement — from (b)
  a view on which the objection to celebration is not about desert at all but about
  status: that public esteem is a positional good, that its distribution is something
  we are jointly responsible for, or that admiration distorts our beliefs about how
  much the admired person contributed. Can the two practices be reconciled as one
  desert-based view plus different empirical beliefs about how legible and how replaceable
  market success is compared with athletic or artistic success? Where is each practice
  strictly committed, where is it merely compatible with several theories, and what
  would a public culture built consistently on the rival theory do differently — whom
  would it honor, whom would it cut down?


