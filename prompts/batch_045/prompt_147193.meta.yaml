  Let me think of a cleaner structure with a subtle flaw.


  Argument (from the perspective of a philosophy professor, say, teaching a course
  on AI and understanding):


  (1) A system understands a sentence only if its processing of it is sensitive to
  the meanings of the parts and their combination (compositional/semantic sensitivity),
  not merely to surface statistics.

  (2) Statistical MT is sensitive only to surface statistics: it has no representation
  of reference, of what words are about.

  (3) Hofstadter''s example: an MT system renders "The pen is in the box" with the
  French word for a writing implement even in a context where "pen" means a playpen
  — it fails where meaning matters, and any number of correct translations of other
  sentences shows nothing.

  (4) Therefore, whatever fluency MT achieves, it does not understand.

  (5) But: the very same test applied to human translators shows they too are driven
  by frequency-based expectation, and they too err on the pen case when the disambiguating
  context is absent; the difference is only that they can be brought to revise on
  seeing more context.

  (6) A modern MT system also produces different outputs given more context — its
  output is a function of the whole input, including the disambiguating context.

  (7) So any behavioural test that shows (4) — i.e., that shows MT lacks understanding
  — would also, if applied to a human, show the human lacks understanding.

  (8) Hence either the argument proves too much (it proves no one understands, or
  understanding is untestable), or (1) is false and understanding requires something
  non-behavioural — but then (3) and (4)''s evidence is irrelevant.

  (9) Therefore the "shallowness" critique either fails or proves too much.


  Where does it go wrong? A good answer: the flaw is the slide between (a) sensitivity
  to context in the sense of covariation of output with input and (b) sensitivity
  to meaning in the sense of a representation whose causal-functional role answers
  to the referent; also the equivocation in step 7: human and system differ in what
  happens under counterfactual variations and in the systematicity/generalisation
  profile — the human can answer questions, draw consequences, recognise that a playpen
  is something a child is put in, etc. Also step 5-6: the human''s frequency-driven
  error is corrigible by understanding, the system''s is not; and the appeal to "given
  more context" conflates "output is a function of more input" with "uses the context
  as a reason."


