  just man who is universally believed to be unjust; the claim is that anyone with
  the first ring would act unjustly, and that anyone in the second situation would
  be miserable — from which Glaucon concludes that what we call justice is valued
  for its consequences, not for itself.


  I treat Glaucon''s ring not as a single case but as a knob on a control panel: the
  ring can be specified along several dimensions, and turning different knobs strips
  the agent of different features that an answer to the challenge might be covertly
  relying on. Call an answer''s piggyback set the list of contingent features of the
  agent''s situation that the answer must hold fixed in order to get leverage. Call
  a ring variant severance-complete for a given answer if it removes every feature
  in that answer''s piggyback set. My thesis is that no extant answer survives a specification
  of the ring that is severance-complete for it, and that this is not a refutation
  of those answers but a reason to reconstrue the challenge.


  The variants (each includes the baseline power of undetectable action):


  R1. Impunity only. The classic case: you can act without being detected or sanctioned.

  R2. Affective severance. As R1, plus: while wearing the ring you feel no guilt,
  shame, or anticipatory dread, and you are perceptually insulated from the effects
  of what you do — the people you harm do not appear to you as suffering.

  R3. Causal inertness. As R1, plus: while wearing the ring, what you do has no causal
  consequences at all — the world unfolds exactly as it would have had you acted justly;
  you know this.

  R4. Universalization. As R1, except that every other agent also has a ring, and
  everyone knows that everyone has one.

  R5. Character drift. As R1, plus: repeated unjust use of the ring progressively
  rewires your motives, so that you cease to care about justice and cease to be pained
  by your own injustice; you know this in advance and can foresee the endpoint.

  R6. Mnemonic severance. As R5, plus: you retain no memory of what you did while
  wearing the ring and no memory that you used it; the post-ring person is, phenomenologically,
  the person who never acted.


