  (1) Call a decision rule honest if no voter ever gains by reporting a ranking other
  than her true one, whatever the others report.

  (2) Gibbard–Satterthwaite: with three or more options, every honest and onto rule
  is dictatorial — some fixed voter''s favourite always wins.

  (3) So no non-dictatorial voting rule is honest; every reform — ranked ballots,
  approval, score, whatever — is manipulable somewhere.

  (4) And manipulability can''t be a genuine defect, because the same argument applies
