  Thesis: Generations aren''t kinds we discover, but that doesn''t make them arbitrary.
  I want to argue a two-part view: (1) "exposure cohorts" — people defined by having
  been a certain age during a certain event/technology/wave (e.g., people who were
  17 during a financial crash, or who got a smartphone at 13) — do genuine causal
  work: membership is causally upstream of the traits we use to spot members, so they
  support counterfactuals and interventions; (2) "bracket cohorts" — birth-year ranges
  with arbitrary edges — have no shared cause; nearly all the credibility of generational
  talk comes from silently borrowing (1) while using (2). And so the ontological question
  "are generations real?" should be replaced by a question about what work each cohort
  concept does; also a claim about "group-level realism": generations can become real
  in a second way via self-ascription (people organize as a "we"), which is downstream
  of labeling, not the cause of it. Maybe say: there are (at least) three candidate
  kinds of thing people mean: demographic units, exposure cohorts, and self-constituted
  "we"s, and they get conflated.


