  QUESTION:

  "Consider three candidate accounts of what makes a token a token of the letter ''a'':


  (G) Geometric/feature: a token is an ''a'' iff it has certain shape features (or
  a weighted majority of them) — e.g. a closed bowl, a stem on the right, an open
  aperture.


  (H) Causal-historical: a token is an ''a'' iff it stands at the end of an appropriate
  causal chain of copying that traces back to earlier ''a''s.


  (P) Perceptual-functional: a token is an ''a'' iff (roughly) a fluent reading community
  perceives and uses it as an ''a'' in a working writing system.


  Using these, discuss the following three cases, and say which account you favour.


  (1) The single-storey ''ɑ'' (as in many geometric sans faces and in italic handwriting)
  versus the double-storey ''a'': same letter or two letters?


  (2) A hypothetical geometric sans — call it Kestrel Sans — in which the ''b'' glyph
  is the exact 180° rotation of the ''q'' glyph, the ''p'' is the exact 180° rotation
  of the ''d'', and the ''n'' the exact 180° rotation of the ''u''. Does Kestrel Sans
  contain fewer distinct letterforms than a normal font? Does it contain fewer letters?


  (3) The Chalk River script: 26 forms invented from scratch for a fictional language
