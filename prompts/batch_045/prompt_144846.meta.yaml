  equal edges, eight corners and flat faces meeting at right angles, and the sphere
  has one continuous surface with no corners; sight presents exactly that structure,
  so the shape is the same thing described in a different code — which, she said,
  is why blind people use the same shape words as everyone else and can read raised-line
  diagrams. (2) Ollie said that''s question-begging: ''the same structure'' is an
  abstraction, and an abstraction isn''t something either experience contains; two
  codes can encode the same thing and still be untranslatable without a key, and anyway
  the man would first have to work out that visual patches are signs of surfaces at
  a distance rather than something in or on his eye — that''s the Berkeley-style point.
  (3) Nadia replied that the shared structure must be doing some work, otherwise the
  connection couldn''t be learned at all, and it''s reportedly learned fast by people
  who''ve had sight restored after being blind from infancy, so ''nothing in common''
  would make the recovery magical. (4) Ollie said days isn''t ''at the first instant'',
  which is what''s being asked, and that those cases couldn''t settle it even in principle:
  any test takes time and learning starts the moment the bandages come off, plus the
  patients have had years of spatial language and handling objects, so fast learning
  is perfectly consistent with starting from nothing. (5) Nadia said that if every
  success gets written off as learning the question becomes unanswerable, so let''s
  sharpen it: use two irregular lumps he''s felt but never been given names for, test
  on a single first trial with no one saying a word, and — her addition — run a version
