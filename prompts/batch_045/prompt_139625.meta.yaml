  happens then over later states of the world is unusually high, and modally hinged
  when the spread of reachable long-run outcomes — the variance, not the mean — is
  unusually wide, so that which of several very different futures gets realized is
  still genuinely up for grabs. I argue that the moral significance people attach
  to living at the hinge really attaches to modal hingedness: it''s no argument for
  neglecting the present that a later generation will be able to edit what we built,
  and it IS an argument that the menu of futures hasn''t yet narrowed. My second move
  is that modal hingedness is not the Whiggish boast that being temporally hinged
  invites: it''s compatible with full acknowledgment that our era will look parochial
