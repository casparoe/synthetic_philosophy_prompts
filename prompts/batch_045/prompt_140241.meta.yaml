  "I''m teaching a seminar on the philosophy of artificial intelligence and screening
  Ex Machina next week, and I want to read it as a sustained argument about the intentional
  stance rather than just as a Turing-test thriller. Nathan insists Ava is a machine
  to which Caleb is merely projecting beliefs, while Caleb insists she is a person
  with whom he is in genuine conversational contact; the film''s ending can be read
  as vindicating one of them, or as showing that the whole dispute was ill-posed.
  I''m interested in a particular wrinkle: call it the problem of corrupted evidence
  for belief attribution. Dennett''s intentional stance treats deception as just another
  intentional phenomenon it handles happily — a liar is a paradigm intentional system,
  not a counterexample. But if a system has been designed or trained so as to be taken
  to have particular beliefs and desires by a human observer — if its expressive behavior
  has been optimized against our mindreading dispositions — then the behavior we would
  normally cite as evidence of belief has been decoupled from the thing it was evidence
  of, in something like the way Goodhart''s law describes for a measure used as a
  target. There is no stance-internal way to detect this, since the stance has no
  vocabulary for ''engineered to be legible'' as distinct from ''deceptive'' or ''sincere''.
  Where in the film does this worry get dramatized — the sessions through the glass,
  the blackout scenes, Nathan''s description of her as a toaster, her manipulation
  of Caleb — and where does the film resist it? I''d like a reading that takes the
  philosophy seriously enough to say whether Garland has located a real problem for
  the intentional stance or merely a problem for taking Turing-test-style behavior
  as evidence, and, if the former, what the film thinks we owe a system we can no
  longer tell whether we''re reading or being read by."


