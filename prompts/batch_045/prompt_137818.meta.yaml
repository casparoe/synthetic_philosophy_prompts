  I''m closing the last session of a graduate seminar on Dennett''s three stances
  — physical, design, intentional — and the account of real patterns they were built
  to support, and I''d like to end with a poem instead of a summary slide.


  Write a sestina: six unrhymed six-line stanzas in which the same six end-words rotate
  according to the standard pattern, plus a three-line envoi. The end-words are:


  pattern, physical, design, intend, compress, noise


  Three constraints on content:


  1. One target, not a chess-playing computer or a thermostat. Pick a single system
  that has neither a designer nor beliefs of its own, but toward which all three stances
  can be applied in earnest (an ant colony''s foraging trail, a city''s traffic at
  rush hour, a price series, a deposition of sediment — your choice). Name it in a
  one-line epigraph and stay with it for all thirty-nine lines.


  2. Get the machinery right. The physical stance predicts from constitution and law;
  the design stance from the assumption that the system is designed to do what it
  does and will do it (barring malfunction); the intentional stance from treating
  the system as a rational agent with the beliefs and desires it ought to have, then
  predicting that it will act to get what it wants given what it knows. A pattern,
  on this account, counts as real when invoking it buys you a cheaper description
  of the data than you''d get without it — when re-describing the system in its terms
  compresses rather than merely relabels.


  3. The rotation has to earn its keep. Nothing about the target changes from stanza
  to stanza; only the order of the six words does. Use that: the same six words in
  a new arrangement each time should feel like the same system re-described at a different
  level of abstraction, and by the envoi the reader should have noticed that "pattern"
  and "noise" have drifted toward each other — that what looks like noise from one
  stance is what a rival description leaves out, not the absence of structure. The
  envoi''s last line should contain both words.


  The point of the poem — and this is the part I most want handled carefully — is
  a case Dennett''s criterion doesn''t settle: two descriptions of the same data that
  compress it equally well but cannot both be right about what is going on, one of
  them available only from the intentional stance and the other only from the design
  or physical stance. Nothing in the data, and nothing in the compressibility test,
  breaks the tie. Don''t resolve it in the poem, and don''t narrate it as a failure
  of the accounts: stage the tie so that a reader who knows the literature recognizes
  what is at stake in it, and a reader who doesn''t still gets an ending rather than
