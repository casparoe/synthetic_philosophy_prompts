  Draft:


  I''m a historian of labor movements, finishing a monograph on municipal general
  strikes in interwar Europe, and a referee report on the manuscript has pushed me
  into a methodological corner I can''t get out of. The referee''s objection to my
  central case — a 1930s transport strike that I argue was broken primarily by the
  union federation''s refusal to release strike funds — is that the outcome was "overdetermined":
  the funds ran out, the city government had already signed a replacement labor agreement
  with a contractor, and the strike committee had lost the confidence of a key affiliate,
  and the referee says any one of these would have ended the strike anyway, so my
  causal claim can''t do the work I want. I''ve been going back and forth on this
  for months, and a lawyer friend tells me tort law has something like the same worry
  with its "substantial factor" test, which suggests I''m not the first person to
  trip over it, but I can''t find the concept in my own field.


  What I keep noticing, both in my manuscript and in everyone else''s, is this. The
  moment I ask whether the strike would have collapsed without the funding decision,
  the answer depends entirely on how much detail I put into the word "the strike."
  Stated thinly — the work stoppage ended without the union''s demands being met —
  the collapse survives the removal of any single one of my three factors, and the
  case does look overdetermined. Stated thickly — a stoppage that held for eleven
  days, was run by an elected rank-and-file committee, and ended with the affiliate''s
  membership voting to return — the collapse survives the removal of none of them,
  and the overdetermination evaporates. Nobody in the literature says which grain
  is the correct one, and the same chapter will often use two grains within a page
  of each other without remarking on the switch. I''ve started distinguishing, for
  my own use, between sliding vertically (more or less detail in the description)
  and sliding horizontally (whether features like the timing, the mechanism, or the
  identity of the actors count as part of the event at all), and it seems to me these
  two kinds of slide do different damage. Two things make me think this isn''t just
  ordinary overdetermination: standard overdetermination is supposed to be a matter
  of two or more processes each sufficient for the very same event, and the whole
  puzzle here is what makes it the same event; and a colleague suggested it''s just
  the familiar point that why-questions have a contrast class, but in my cases the
  question stays fixed ("why did the strike collapse?") and only the outcome term
  moves, which feels different and worse.


  So: does this have a name, in historiography, philosophy of causation, or anywhere
  else, and if not, what would you call it and how would you define it so that it
  is not merely overdetermination, not merely the contrast-sensitivity of explanation,
  and not merely the platitude that historical outcomes can be reached by many routes?
  I''m not after a reading list or citations — I can find those — I want the carving:
  what exactly the move consists in, whether my vertical/horizontal distinction is
  the right one to cut along or whether there''s a better axis, what the boundary
  cases are (when is a re-description a legitimate sharpening of what needs explaining,
  and when is it a way of protecting a favored cause from a counterfactual?), and
