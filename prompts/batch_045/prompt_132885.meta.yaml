  Domain: Du Bois on art as propaganda. Type: describe a phenomenon and ask whether
  it has a name.


  Framing/seed: I''m on a small volunteer panel that hands out a few thousand dollars
  of arts-grant money (city library foundation). We keep running into "we fund art,
  not propaganda." Then: we funded a mural about veterans, a nativity play, and a
  set of WPA-style prints... nobody called those propaganda. But a youth-theatre piece
  about police stops and a photo series about a housing eviction got called propaganda
  immediately.


  Phenomenon A: the same formal features (funded by an institution, made to move an
  audience toward a conclusion, simplified moral framing, an intended emotional effect)
  get called art in one case, propaganda in the other, and the difference seems to
  be whether the panel already agrees with the conclusion. So "propaganda" seems to
  be a name for politics I don''t share — but that''s too glib because there do seem
  to be cases where everyone agrees something is propaganda (a state poster dehumanizing
  an enemy,烟草 ads, recruitment posters).


  Phenomenon B (the amnesty/temporal one): propaganda that has won stops being called
  propaganda. A medieval altarpiece or a cathedral window was made to teach doctrine
  to people who couldn''t read, paid for by an institution with an interest in what
  people believed, and got displayed where people had to look — nobody calls it propaganda
  now; they call it devotional art. But a 1930s mural doing exactly the same job gets
  called propaganda. Difference seems to be that the doctrine in the altarpiece has
  partly stopped being contested, or we''ve stopped being in the fight, so it reads
  as "the furniture of the world" rather than a move in a game. Also: successful messaging
  becomes invisible — once everyone accepts the claim, the claim stops looking like
  a claim and starts looking like a description of how things are.


  So the asker wants: (1) does the asymmetry have a name? (2) are these one phenomenon
  or two? (3) nearest misses — art-for-art''s-sake / the idea that aesthetic value
  is autonomous from political purpose, the intentional fallacy (making a work''s
  intended effect count against it), Sartre''s committed writing, the "burden of representation"
  thing where art by a marginalized artist is asked to speak for a whole group, Benjamin''s
  aestheticization of politics — hmm, the asker shouldn''t name these (that would
  give the answer away and they''re supposed to be a non-expert). But they can gesture:
  "I found something about committed literature and about art for art''s sake but
  neither seems to be it" — that''s okay-ish? The instruction says describe without
  the technical vocabulary that would give the answer away. I can let the asker mention
  one or two things they found that don''t fit, which is realistic. E.g., "the only
  things I''ve found nearby are ''art for art''s sake'' — but that''s a slogan about
  what artists should aim at, not about what critics call things afterwards — and
  something about the ''burden of representation'', which is about asking one artist
  to speak for a group, and that''s not what''s happening here either." That''s fine
  and it actually helps a good answer carve. Keep it to those two, gestured loosely.


  Also mention Du Bois: "Du Bois somewhere says, more or less, that he has no use
  for art that isn''t doing propaganda work, and that the complaint is really that
  only some sides are allowed to do it" — and the asker notes a puzzle: if propaganda
  becomes invisible when it wins, then the person who says "all art is propaganda"
