  doesn''t value equality as such; it''s "person-affecting" in the sense that a benefit
  to someone at a given level matters the same regardless of others'' levels.

  - Leveling-down objection (originally against egalitarianism): if equality is intrinsically
  valuable, then a move to equality that makes no one better off and some worse off
  is in one respect better; that''s absurd. Egalitarians reply (Temkin: the objection
  shows equality is not the whole story; or "equality is one value among many"; or
  Parfit''s "Priority View" as the escape).

