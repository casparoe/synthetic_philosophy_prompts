  whom think their own government is currently wrecking democracy and several who
  think that''s hysterical. That disagreement is the thing I want them to run into,
  not hear about.


  The topic is democratic backsliding: what counts as it, who gets to decide, and
  whether the concept is anything more than a partisan label with a social-science
  veneer.


  What I want is an activity where they feel the "is it more than a label" problem
  in their own behaviour rather than being told about it. My rough idea: give them
  anonymised composite country vignettes — lists of institutional changes over a decade,
  no country names, no party names — and have them score each one for how much "backsliding"
  it is. But here''s the twist I want built in: each student gets a packet where two
  of the vignettes are introduced with a one-line description of the government as
  having been elected on the platform the student said they preferred at the start,
  and two as elected on the other one. Same institutional changes, different label.
  Then they see their own numbers move. I want that gap to be something they compute
  themselves and discover, not something I announce.


  Some things I need from you:


  1. The actual mechanics: what''s on the private slip at minute zero, how I sort
  packets without anyone noticing, the vignettes (4 of them, ~6-8 institutional changes
  each, invented composites that are realistic but not identifiable — please don''t
  build them around getting the details of Hungary/Poland/Turkey/US right, I''ll fill
  real cases in later if I want), and the scoring scheme. Pre-register one scoring
  scheme, not three options — I want something I can actually run.


  2. A round that does the "who decides" part. My idea: assign each group the role
