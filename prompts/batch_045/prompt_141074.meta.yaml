  us anything about h²? No, in principle: h² is about variance within a population,
  and a uniform environmental shift can raise the mean without changing variance at
  all. But if the environmental shift is *not* uniform (e.g., it lifts some people
  more than others), then it changes variance and thus h². And: measurement invariance
  issues — if tests aren''t invariant across cohorts, then "IQ gains" may not be gains
  in the same construct, which matters for whether the Flynn effect is a within-construct
  change at all. Deep and good.


