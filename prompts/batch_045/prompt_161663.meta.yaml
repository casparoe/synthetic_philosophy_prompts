  argument I built to explain why it collapsed now seems to show something much stronger
  than I want. I want to know where to cut.


  (1) A choice between options is rationally assessable only if I can, from where
  I now stand, assign each outcome a utility that represents how good living through
  it would be for me. If I cannot assign those utilities, the choice is rationally
  indeterminate: no option is more rational than any other, and deliberation has nothing
  to adjudicate.


  (2) An outcome''s utility is fixed by what it is like to live through it. So if
  I cannot now know what it would be like to live through an outcome, I cannot now
  assign it a utility.


  (3) What it is like to live through an experience cannot be known in advance whenever
  the experience is phenomenally novel — it involves some qualitative feature I have
  never met. Descriptions, testimony, and imagination assembled out of my existing
  stock of experiences cannot supply it; the only way to acquire it is to have it.
  (This is the Mary''s-room point, generalized.)


  (4) Phenomenal novelty is everywhere in ordinary choice. The first week in a job
  in a new field, the first months in a city I have never lived in, the first bite
  of a fruit I have never tasted: each contains qualitative features I have never
  met, and each can shift what I want.


