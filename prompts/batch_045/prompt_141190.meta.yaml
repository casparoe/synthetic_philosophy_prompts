  "I''ve been going back and forth on karma as a theory of desert and I want to know
  if my gut on cases actually adds up to anything.


  I''m not asking for what any tradition says — I''ve read a bit and it seems like
  the intention behind the act is supposed to be the thing that does the work, but
  I want to know whether my own verdicts fit together, not whether they match some
  doctrine.


  Cases:


  1. A guy runs a quiet fraud for fifteen years, wipes out the savings of a couple
  hundred retirees, never gets caught, dies at 92 with his family around him, no regrets.
  I want to say: there''s something outstanding. Not that anyone should have punished
  him — just that this person got something he had no claim to and the books aren''t
  closed.


  2. Same guy, but at 60 guilt eats him alive, he confesses, repays what he can, spends
  the rest of his life broke and miserable. I feel like most of the debt is gone.
  Maybe all of it.


  3. A man with a tumor that wrecks his impulse control assaults someone; tumor comes
  out, he''s horrified by what he did. Basically no debt, or very little. It wasn''t
  really his act.


  4. Someone does an expensive, genuinely helpful thing for a friend, partly out of
  care and partly because they knew it would look good. I want to give partial credit
  — not zero, not full.


  5. Someone does something cruel and small-minded that, through a chain nobody could
  have predicted, ends up making the victim''s life much better. I don''t think the
  good outcome cancels the debt at all. Which I guess is consistent with 4, since
  both say the will matters and the results don''t, but it''s worth writing down.


  6. Child soldier / cult kid: raised from birth to believe a certain kind of cruelty
  is a duty, does it at 19 with full deliberation, later comes to see it was wrong.
  I genuinely go back and forth. Compare with 3: in 3 the will was bypassed; here
  the will is intact but the moral information was wrecked. I can''t tell if that
  difference matters.


  7. The fraudster''s kids inherit the money and live very well on it. I don''t think
  they inherit any debt — the idea makes me recoil. But a university that''s still
  sitting on an endowment built on stolen land, 150 years and many turnovers of staff
  and students later: I do want to say something is owed, and owed by that institution.
  I realize those two verdicts are hard to hold together, because in both cases the
  current people didn''t do it and do benefit.


  8. Someone who lives generously and carefully and dies of a painful cancer at 41.
  I don''t want to say "past lives." I''d rather drop something else in this list
  than say that was owed.


  9. A wrongdoer who has completely forgotten his wrong — dense amnesia, and he''s
  since become a gentle, decent person. I still want to say the debt is there. But
  that sits badly with 2, where the psychological change did seem to discharge things.


  The thing I keep trying out: maybe the currency isn''t suffering at all. Maybe a
  bad act creates unpaid-for advantage — the agent got to have his way at someone
  else''s expense — and what''s owed is that the advantage gets closed, by his own
  recognition or, failing that, by some experiential setback sized to how much he
  got away with. That would explain 1 (advantage never closed) and 2 (closed by recognition)
  and 5 (the good outcome doesn''t return what he took). But I don''t know what it
  says about 3 and 6, and I have a feeling it makes 8 come out as "nothing owed" too
  quickly, in a way that feels like cheating.


  Also nagging at me: if karma is supposed to be automatic — built into how things
  work rather than handed out by anyone — then can it ever fail to arrive? And if
  it can''t fail to arrive, is it still desert, or is it just causation with a moral-sounding
  label? I think that worry might sink the whole project and I''d like to know if
  it does.


  So: is there one principle that gets 1-9, or close? State it tightly, tell me which
