  Premises:


  (1) [Projection requires invariance] A predicate F supports induction — i.e., past
  instances of F license expectations about future instances — only if the features
  in virtue of which an individual satisfies F are not themselves altered by the dissemination
  of the generalization. Call this "inferential robustness."


  (2) [Ubiquity of looping] For any kind of person K, there are indefinitely many
  ways in which the descriptions of K that circulate — clinical criteria, self-help
  literature, diagnostic questionnaires, social-media discourse, insurance codes —
  can be taken up by the people who fall under them, and such uptake alters their
  experience, conduct, self-ascription, and the reports they give. (Hacking''s looping
  effects; also, they alter the uptake of the classifiers: clinicians'' thresholds
  shift with the patients who present.)


  (3) [No privileged standpoint / no view from nowhere inside the loop] There is no
  description of the members of K that is guaranteed in advance to be immune to such
  uptake: for any proposed "underlying mechanism" or "objective marker," a mechanism,
  once known, can be sought, simulated, avoided, or presented — patients Google their
  own criteria; biomarkers become targets of self-tracking; the marker loops too.


  So: (4) No kind of person is inferentially robust. Therefore no diagnostic category
  in psychiatry (or anywhere in the human sciences) is inductively projectible: no
  evidence base about a category from one decade can underwrite the application of
  that category in the next.


