  Hi — I''m a philosophy prof, work mostly on Marx and philosophy of technology, and
  I''d like a hand disambiguating a line that got used to end an argument at me.


  Context: our department runs an interdisciplinary reading group on automation and
  work. I was arguing something like: under capitalism the introduction of machinery
  has a systematic tendency to deskill and to tighten the discipline of the labor
  process, so that changing who owns the machinery is not by itself enough — you inherit
  the machinery''s effects on the labor process even if you socialize the title to
  it. A colleague (political theorist, sympathetic, not hostile) closed the discussion
  with "but machinery is neutral — it''s all about who owns it," and everyone sort
  of nodded and we moved on. I think that line was doing more work than it earned,
  but I also think it isn''t obviously false, and I want to know which thing it has
  to mean to actually beat my claim.


  So: lay out, as a menu, the different precise theses that sentence could be expressing.
  I want them ordered from the boring/trivial to the ones that are actually load-bearing,
  and for each one: is it true, is it something Marx himself would have accepted or
  rejected, and — the part I actually care about — does it even touch my argument?
  My guess is there are at least: a claim about the machine''s physical behavior being
  invariant across property relations; a claim about who captures the surplus; a claim
  about the *design* of machines being shaped by the imperatives of the capitalist
  labor process; a claim about what happens to the direction of technical change over
  time; and maybe a claim that "neutral" is just the wrong kind of predicate here
  because a technique can''t be specified independently of its social deployment.
  But I want your version of the menu, and I suspect I''m conflating two or three
  of those.


  One thing I''ve been leaning on in my own draft, and I''d like you to take a swing
  at it: I distinguish synchronic neutrality — no single machine''s physics, or its
  immediate output in a given labor process, depends on who owns it — from diachronic
  neutrality — the trajectory of technical development, what gets built next and what
  problems get solved, is not shaped by the property relations it develops under.
  My hunch is that the slogan is trivially true synchronically and false diachronically,
  and that my colleague needs the diachronic version, which is the one Marx''s machinery
  chapters give you reason to doubt. Is that distinction holding up, or does it collapse
  under pressure? Does it cut the menu the way I think it does?


