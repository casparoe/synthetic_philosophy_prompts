  is a matter of the subject being able to report it. [Error 1: narrows to report;
  Block includes reasoning and rational guidance of action and speech; and conflates
  with Chalmers''s hard problem.]


  (b): Global workspace theory says that a state becomes conscious when it is ''broadcast''
  from local processors to a global workspace, making it available to many consumer
  systems at once — memory, attention, motor control, language. Block''s point is
  that this story is a story about availability or access, not about phenomenal character.
  The theory explains how information gets around in the brain, but it gives no account
  of why the broadcasting should be accompanied by experience at all. This is why
  Block says there could be phenomenal consciousness without access (the ''overflow''
  cases: e.g., in Sperling-style partial report, subjects seem to have a rich phenomenal
  array of more items than they can report or access) and, more contentiously, access
  without phenomenal consciousness. So a theory of access need not be a theory of
  phenomenal consciousness, and GWT should be read as the former. [Good, mostly right.]


