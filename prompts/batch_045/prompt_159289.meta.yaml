  committee for a university dining service — roughly fifteen thousand meals a day,
  four menu cycles a year, decisions that have to be defensible to students, to the
  budget officer, and to the ranchers who sell to us. The committee is not philosophers;
  I get an afternoon per cycle and whatever numbers are publicly available; I cannot
  audit supplier welfare claims.


  Please write me a decision procedure I can actually run on a proposed change to
  the menu, in this order: the questions to ask, what counts as a sufficient answer
  to each, where the procedure returns a definite no, and where it has to stop and
  hand the decision back to the committee because the unresolved question is one of
  values and not of fact. The things I want handled explicitly: how to count animals
  killed during crop cultivation alongside animals slaughtered, given that they die
  in very different numbers and very different ways per unit of food; how to compare
