  Confusions to correct:

  1. Felicity ≠ being "happy"/satisfied; "happy/unhappy" is a technical term for whether
  the conventional procedure was correctly and completely executed (Austin''s misfires
  vs. abuses); it''s not about people''s feelings/satisfaction.

  2. Abandoning the constative/performative distinction ≠ abandoning speech act theory:
  it was replaced by locutionary/illocutionary/perlocutionary and the theory of illocutionary
  force; felicity conditions survive as conditions on illocutionary acts.

  3. Reducing promising to local convention: conventions/constitutive rules matter
  (Searle''s "X counts as Y in C") but promising is not exhausted by local rules —
  the local rule creates a role/task-ownership which may not be a promise; also uptake,
  intention, and the point that promising has a direction-of-fit-independent normative
  structure; also that some conditions aren''t conventional (e.g., sincerity condition;
  or the "essential condition" is not arbitrarily stipulable — you can''t make "I
  hereby insult you" work by convention alone... well, you can make something counts
  as an insult-ish act, but you can''t stipulate that an act counts as promising without
  the normative commitment structure).

  4. Replacing illocution with perlocution: conflating illocutionary act (promising)
  with perlocutionary effect (persuading, satisfying, getting someone to rely); perlocutionary
  effects aren''t the act, and tracking satisfaction would conflate "he promised"
  with "she was reassured" — and would misclassify cases (a promise can be made and
  ignored; reassurance can happen without a promise).

  5. Also there''s a false presupposition: that a classifier needs truth conditions;
  but semantic/pragmatic classification is about force, and "is this a promise" is
  a question about whether felicity conditions were satisfied, which can be objectively
  wrong (misfire: no authority; jest/acting → void).


