  "I teach a graduate seminar in formal epistemology, and I have never once handled
  van Fraassen''s Reflection principle well. My usual habit is to write the principle
  on the board — that my credence now in A, conditional on my credence in A at some
  specified later time being x, ought to be x —, remark that it looks like conditionalization
  seen from a distance, run through a diachronic sure-loss argument, and move on before
  anyone notices that the argument is doing something quite different from the synchronic
  Dutch book argument they met two weeks earlier. This term I finally have a full
  ninety-minute slot for it, and while I can write the lecture myself once I know
  its architecture, I would like the architecture: give me a teaching plan for the
  session, not an explanation of the principle.


  Two things about the room. About two-thirds of the students are philosophy MA and
  PhD students who have had Bayes'' theorem, conditionalization, and one synchronic
  Dutch book argument, and who are quick with notation but impatient with anything
  that smells like a paradox. The rest are visitors from a machine learning group
  down the hill: they use Bayesian updating daily as an engineering tool, they have
  no prior grip on a diachronic norm as a norm, and my experience is that they translate
  any principle about an agent''s future opinions into an implementable design rule
  within about ninety seconds. Whatever you propose has to hold both halves of that
  room. So tell me the order in which the components have to appear and what depends
  on what — in particular, whether conditionalization should be presented as something
  Reflection delivers or as an independent norm I set beside it, and where the assumption
  that an agent can be certain of what her own later credence function will be belongs
  in that order — and then tell me the single case that should carry the whole session.
  My worry about the examples I have used in the past is that they are all evidence-gathering
  cases, and so they make Reflection look like nothing more than advice to wait for
  the data; the carrying case, as I now think about it, needs to be one in which the
  agent foresees a shift in her own opinion that is not simply the arrival of evidence,
  while also not being so exotic that it smuggles in manipulation or insanity. Van
  Fraassen reaches for the Ulysses-style case of an agent who can foresee being swayed;
  tell me whether that should carry the session or whether it imports the very confusion
  I am trying to avoid, and if you would replace it, say exactly what a replacement
  must contain and what it must lack.


  Then the part I am worst at: the misconception map. Here is my list of suspects,
  which you should correct, reorder, and add to, and for each surviving item I want
  the precise point in the sequence at which it should be blocked, and by what move:
  that Reflection is just conditionalization restated; that it says to defer to your
  future self because she will know more; that it says your future credences will
  be more accurate; that it is a principle of self-trust or of intellectual humility;
  that it forbids you from ever expecting to be misled; and — this is the one I most
