  full submission pile, what happens when a randomly drawn person declines, whether
  the chair is one of the drawn ones).

  - the honest part: my strongest reason for resisting is a selfish one and I want
  it in the memo as a disclosed conflict rather than hidden: I got my one real break
  when a repeat juror went to bat for my second novel in a room where nobody else
