  ---


  So I''m a novelist (four books, two of which you could find in a good library) and
  last year I let myself get talked onto the board of the Aldridge Prize for fiction
  — mid-sized, one winner, money plus a residency, funded by a foundation that mostly
  keeps to itself. We have a vote in three weeks on a reform petition that about two
  hundred of our members signed, and I''m the one who has to circulate the recommendaton
  memo beforehand. I need you to write it.


  The complaint behind the petition is that the prize has become a machine for anointing
  the same kind of book. In the last six years, something like a dozen people have
  sat on the jury, and a handful of them keep coming back — our current chair has
  now judged four times and has been on panels with two other repeaters so often that
  people have started calling them the permanent jury. Two of the last three winners
  came from the same small press. Nobody has done anything wrong, honestly; it''s
  just that when the same eight people read for the same prize every couple of years,
  they develop a house style and start mistaking it for quality.


  The petition has two parts. First, three of the six jury seats should be filled
  by lot from the membership — anyone who has published a book of fiction is eligible,
  you opt into the pool — while the board keeps appointing the other three. Second,
  term limits: nobody serves on the jury more than twice in any ten years, and the
  chair rotates every cycle. There''s also a sub-argument I find more interesting
  than either of those, which a couple of members have been pushing in emails: that
  the draw should happen at the *end* of the process — you keep the appointed readers
  for the longlist slog, then pull three names by lot out of everyone who actually
  returned scores on time, so the lottery selects for people who did the reading rather
  than for representativeness. I keep going back and forth on whether that''s a brilliant
  fix or a complete misunderstanding of what sortition is even for.


  Things you should know and can''t look up... etc.


