  sentences a community protects" — conflation of the revisability/holism thesis with
  the analyticity thesis; and it mis-characterises Quine''s positive view (holism
  is about evidence/confirmation, and sentences at the centre are protected for methodological
  reasons — but Quine''s holism doesn''t by itself yield a sociological definition
  of analyticity). Hmm, actually there is a real reading (Quine''s later "truth by
  convention"?). Well — it''s the subtle misrepresentation: presenting the revisability
