  Invented populariser''s passage (my own words, ~150-200 words):


  "Quine''s ''Two Dogmas of Empiricism'' demolished the idea that some truths are
  true by meaning alone. The positivists thought you could split every true sentence
  into a factual part and a linguistic part, and that the analytic sentences were
  the ones with no factual part. Quine pointed out that when you ask what makes a
  sentence like ''all bachelors are unmarried'' true, the only answer anyone gives
  is ''bachelor means unmarried man'' — and meaning, synonymy, definition and necessity
  all turn out to be just other names for the same thing nobody can explain. So the
  circle closes and the distinction collapses: there are no analytic truths, only
  sentences we are very unwilling to give up. That is the first dogma. The second
  dogma is reductionism, the idea that each sentence can be checked against experience
  on its own; Quine replaces it with holism, the view that our beliefs face experience
  as a body, so no sentence is immune to revision, not even the laws of logic. The
  upshot is the useful part: analyticity was never a kind of truth, just a sociological
  fact about which sentences a community protects from revision. But there''s a way
  to save something. Forget meaning and say it in terms of knowledge: call a sentence
  analytic if a fluent speaker can tell that it is true just by understanding it,
  without going and looking. ''All vixens are female'' passes; ''all swans are white''
  fails. Notice that this makes analyticity historical: ''whales are mammals'' wasn''t
  analytic in 1750 and is analytic now, because once the classifiers had settled the
  matter, the sentence became something you know just by knowing the words. Analyticity,
  on this view, is a status a sentence acquires when inquiry around it goes quiet."


  Errors embedded:

  1. "there are no analytic truths, only sentences we are unwilling to give up" —
  overstates; Quine''s conclusion is that the notion hasn''t been drawn/explained
  (and the "no statement is immune" is about revisability, not about analyticity being
  a sociological status). Also conflation of "the distinction has not been drawn"
  with "there are no analytic truths" — this is a subtle overstatement. Good.

  2. "That is the first dogma... The second dogma is reductionism" — actually fine-ish;
  but the error: the summary presents the failure of defining analyticity as the first
  dogma, when the first dogma IS the belief in the distinction (the distinction itself
  is the dogma, not the failure). Also it omits that Quine thinks the two dogmas are
  at root the same — that could be a point where the asker is unsure ("my friend says
  Quine himself says the two dogmas are, at root, identical, and the book treats them
  as separate").

