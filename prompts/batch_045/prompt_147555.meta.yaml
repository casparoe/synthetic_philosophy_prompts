  The argument (call it "the deference argument"):


  (1) The only evidence anyone has for a moral judgment is that it strikes them (and
  people like them) as obviously correct — "moral intuitions."

  (2) If the only evidence for a judgment is that it strikes a certain group as obvious,
  then that evidence is undermined once we learn the strikingness is produced by causes
  that have nothing to do with the truth of the judgment (upbringing, subsistence
  mode, etc.). — "defeater" premise.

  (3) Cross-cultural work shows that which moral judgments strike people as obvious
  varies systematically with features of their society that are clearly not truth-tracking
