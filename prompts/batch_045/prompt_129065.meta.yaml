  Where''s the confusion? Several layers:

  1. The questioner treats "dissolve" vs "bite a horn" — good, they''re somewhat self-aware;
  but the real confusion: they think that because proofs are causally accessible,
  the causal constraint on knowledge is satisfied. But the causal constraint in Benacerraf
  applies to knowledge of the *truth* of the claim, i.e., knowledge that p requires
  causal connection to the objects p is about. If truth = existence of a derivation,
  then knowledge that p requires causal contact with... the space of derivations,
  which is an abstract infinite structure; and, more importantly, the claim "T is
  provable" is itself a mathematical claim about an infinite domain, so the epistemology
  recurses.

  2. The deeper confusion: they assume that proof-theoretic semantics is *neutral*
  between the horns — that it "saves everything mathematicians want" — when in fact
  it abandons the homogeneous-semantics requirement (the Tarskian objectual semantics
  for *all* of language) that is one of the two constraints generating the dilemma.
  So it''s not a third option but a rejection of one constraint; and the standard
  costs: (a) the "applications" problem — mixed statements like "Jupiter has 95 moons"
  or "there are finitely many..." in empirical contexts require numbers to be in the
  domain of the empirical claim, otherwise the nominalistic paraphrase project (Field)
  is needed and is hard; (b) the "which system?" problem — if truth is provability
  in S, which S? Incompleteness means the metalanguage outruns S; and our belief that
  S is consistent is itself arguably a mathematical belief not warranted by proof
  in S; (c) the apparent *objectivity* / determinacy of mathematical truth: if truth
  is proof in a system, then the question of whether Goldbach''s conjecture is true
  has no determinate answer independent of our choice of formalism, and mathematicians''
  practice (and the enormous confidence in consistency) suggests otherwise; (d) also,
  the "semantic appearance isn''t dispensable": the requirement is that mathematical
  and non-mathematical language be semantically homogeneous — mixed sentences resist
  compositional treatment under paraphrase.

  3. A subtler point: proof-based warrant is not the same as knowledge of truth; and
  proof-checkers don''t give knowledge of the *soundness* of the system. Also, Gödel:
  for any consistent S, there are truths (on the standard reading) unprovable in S
  — the questioner''s "everything mathematicians want survives" is false if it includes
  the truth of claims we can prove only by transcending S (e.g., Con(S)).

  4. Also: they conflate "no numbers to link to" with nominalism, and they think the
  nominalist horn''s problem is only about "truth" — whereas the real issue is that
  the semantic horn is motivated by the need for a *uniform* semantics plus the success
  of applied mathematics; and anti-realist paraphrase strategies (if-thenism, deductivism)
  face the problem that some mathematical theories are *false* (if-thenism: "if there
  were numbers, then..." can''t distinguish good from bad theories — e.g., naive set
  theory vs ZF: both are conditionally fine? Actually if-thenism: all consistent theories
  are equally true → can''t account for the fact that we reject inconsistent ones...
  hmm, Putnam''s objection: if-thenism makes all consistent mathematical theories
  equally good, so it cannot explain why we accept arithmetic and not some alternative).


  Also there''s a nice structural point: even the proof-theoretic view needs an infinite,
  abstract structure of possible derivations, and knowledge of "for all derivations
  d, d is not a derivation of 0=1" is a universally quantified claim over an abstract
  infinite domain — so the epistemological problem reappears one level up (this is
  essentially Lewis''s "Tensions" / the recursiveness: it''s the neo-Fregean/Caesar-ish
