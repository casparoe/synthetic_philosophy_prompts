  I''m a postdoc in formal methods, and I''ve been reading about Benacerraf''s dilemma
  in connection with a paper I''m drafting on computer-assisted proof. As I understand
  the problem: our best semantics for mathematical language treats numerals as singular
  terms and number-words as quantifiers over abstract objects, so the truth conditions
  of "there are two prime numbers between 10 and 20" are objectual; but our best account
  of knowledge is causal, and abstract objects are causally inert, so the semantic
  picture seems to make mathematical knowledge impossible. Platonists get reference
  and truth right but no epistemology; nominalists get the epistemology right but
  no truth. My question is about a way out that I haven''t seen discussed, and I want
  to know whether it dissolves the dilemma or merely restates one horn of it.


  [Proposal:] Mathematical knowledge is knowledge of *proofs*, not of objects. When
  I accept a theorem, what I have causal contact with is a formal derivation — a concrete
  inscription, or at any rate a finite object that a machine in front of me can check
  token by token. The truth of the theorem is then nothing over and above the existence
  of such a derivation. So the causal constraint on knowledge is satisfied at the
  level of the thing that actually grounds my belief (the proof), while the semantic
  appearance of reference to numbers is a useful façon de parler we can paraphrase
  away. On this view there is no need for a causal link to numbers, because there
  are no numbers to link to; but equally there is no loss, because everything mathematicians
  actually want — the theorems, the checkable derivations, the applications — survives.
  Proof checkers make the point vivid: a kernel that certifies a derivation never
  consults an abstract object, and yet certification is the strongest warrant for
  a mathematical claim we have.


