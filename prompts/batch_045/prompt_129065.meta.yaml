  And the reliability worry: why does the existence of a machine-checkable derivation
  correlate with the truth of the theorem — well, if truth *is* provability, no gap;
  but then the gap is between provability-in-S and the mathematical facts we care
  about in applications (e.g., whether the program is correct).


