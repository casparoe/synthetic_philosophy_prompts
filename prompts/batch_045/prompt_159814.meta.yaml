  a hectare of mature woodland with a few deer in it, even though the woodland looks,
  to a walkier, like it contains more nature. (I run a moth trap; a good night in
  July is three hundred moths, and I assume most of them are eaten within about forty-eight
  hours. That''s the image I can''t get out of my head.)


  Anyway, here''s where I''ve landed. (1) I think most wild animals in a British temperate
  ecosystem have lives that are on balance bad — the r-selected ones especially, but
  he''d say it''s true of the beavers too, since most beavers born die young and unpleasantly,
