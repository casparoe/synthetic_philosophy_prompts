  "A great deal of what passes for historical explanation is a cognitive illusion
  with two parts. The first is hindsight bias: once we know how an event turned out,
  we cannot recover our earlier uncertainty, so we systematically rewrite the past
  as having pointed toward the outcome — in hindsight, what happened looks like it
  had to happen. The second is the narrative fallacy: human minds cannot store or
  think about a sequence of events as a bare sequence, so we compress it into a story
  with a beginning, a middle, and an end, and in compressing we invent causal links
  that were not there. Put them together and you get the standard history book: a
  chain of causes that made the outcome inevitable, written by someone who knows the
  ending and cannot un-know it. The lesson the authors draw is that narrative history
  is closer to fiction than to science, that the proper cure is to replace ''why''
  questions with ''how often'' questions — statistics, base rates, counterfactuals
  — and that because the course of events is chaotic in the sense that weather is,
  small untraceable causes make the outcome of any large historical process unpredictable
  in principle, so any story about why it went one way is at best a guess."


