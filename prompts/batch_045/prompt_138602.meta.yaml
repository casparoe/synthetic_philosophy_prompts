  discrediting of outside sources, insulating members by making them distrust all
  outside voices — you can''t escape by exposure because you''ve been taught to distrust).
  Nguyen''s key claim: echo chambers are not epistemic bubbles; they involve a manipulation
  of trust, discrediting all other sources. Also there''s the "social epistemology"
  — Nguyen also discusses "cognitive islands", and the "echo chamber" as a mechanism
  of "epistemic trust hijacking". Also there''s the point about echo chambers being
  bad for the members'' autonomy even when beliefs are true? Nguyen: echo chambers
  can produce true beliefs but they undermine epistemic agency/autonomy — the problem
  is that the believer''s reasons are not their own; they''ve been outsourced.


