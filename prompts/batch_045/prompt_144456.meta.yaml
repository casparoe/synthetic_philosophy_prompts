reasoning_summary: 'Let me pick a domain: the units of selection debate (genes vs.
  individuals vs. groups). Or Hofstadter''s strange loops. Or Van Fraassen''s Reflection.
  Or tranquilism.


  Type options: essay on a controversy; verdicts on a set of cases and ask what principle
  captures them; someone''s summary of a view and ask whether it''s fair.


  Let me consider combining "verdicts on cases + principle" with units of selection.
  That''s a nice fit: cases of traits — e.g., a gene that sabotages meiosis to get
  transmitted more (segregation distorter / t haplotype in mice), sterile worker ants
  helping queen, a trait that benefits the group but reduces individual fitness (altruistic
  alarm calls, or a "selfish" restraint on hunting), a gene that boosts its own transmission
  at a cost to organism (meiotic drive), a trait that spreads because it benefits
  kin, a cultural practice? Also multi-level selection cases: a lion pride, a cell
  in a body, a cancer cell, mitochondria, transposons, a slime mold where some cells
  die to form the stalk, a microbial public-goods case (siderophores), a trait that''s
  good for the group but the group isn''t a reproducing unit, a species-level selection
  (sexual selection runaway?), a case where the group is a transient aggregation of
  unrelated individuals.


  Also need to inject some new/niche ideas: e.g., invent a fictional case — "a hypothetical:
  a lineage of beetles where groups of unrelated adults found new colonies each season,
  and a ''restraint'' allele that reduces individual fecundity but doubles colony
  survival; colonies that found new colonies are founded by random pairs, so relatedness
  within colonies is near zero." And one where the "collective" reproduces at a different
  rate than individuals — e.g., a parthenogenetic rotifer lineage; genetic caste determination.


  I need a pair of verdicts hard to reconcile: e.g., I want to say the segregation-distorter
  allele is a case of gene-level selection (I don''t say the "gene is selfish" in
  a metaphorical sense) but I also want to say that in the beetle case, group selection
  is real, even though the groups are founded by unrelated individuals (so no kinship).
  Or: I want to say that the sterile ant worker case is best explained by kin selection
  (gene-level), but I also want to say the case of the "staying" allele in the beetle
  is group selection — yet the formalisms are equivalent (Price equation / Hamilton''s
  rule vs multi-level Price decomposition) — then the hard-to-reconcile pair: "I don''t
  think kin selection and group selection are just two descriptions of the same thing"
  while also accepting certain verdicts. Or the tension: I want to say that selection
  at the gene level is what''s "really" going on in the meiotic drive case, but I
  resist saying that eusociality is gene selection — I want to call that individual-level
  (inclusive fitness) selection.


  Alternatively, maybe the summary type with Van Fraassen''s Reflection principle
  would be great: write a paragraph from a popular article that subtly misstates reflection
  (confusing it with conditionalization; saying it''s about "future evidence" only;
  conflating the diachronic Dutch book argument; conflating Reflection with "principle
  of total evidence"; saying the Sleeping Beauty/observation selection issues; the
  "recalcitrant" worry; the objection regarding self-locating beliefs and the "Reflection-immune"
  cases, e.g., Briggs'' argument that van Fraassen''s Dutch book argument requires
  a certain assumption; the counterexample of "I will believe I''m a brain in a vat";
  the case of drugs that predictably make you irrational; the "non-negotiable" worry
  about forgetting; the issue with "I will have a false belief". Also the fact that
  Reflection is a principle about one''s own future credences, conditional on the
  evidence, and the requirement of "urus"—no, that''s the "Reflection principle with
  ur-priors"? Let me be careful.


  Van Fraassen''s Reflection principle: Let P be my current credence function, and
  P_t be my credence function at future time t. Reflection: P(A | P_t(A) = r) = r,
  for all A and r in [0,1], where t is a future time at which I''ll have learned (only)
  new evidence. Plus a proviso about "admissible" partitions. Key points: it''s diachronic;
  Dutch book argument (van Fraassen 1984 "Belief and the Will", also 1995); the "Reflection
  principle" is a constraint on one''s current conditional credences given one''s
  future credences; it doesn''t imply conditionalization; it faces problems with self-locating
  belief (Briggs), with "the Sleeping Beauty" (?), with the case of a drug that you
  know will make you irrational (a counterexample: you know tomorrow you''ll take
  a drug that makes you overconfident about X, so Reflection would demand you now
  be overconfident about X); van Fraassen''s response: restrict to admissible partitions,
  which he himself recognized — he required that the partition of future credence
  functions be "admissible", i.e., that P(P_t = p_i) > 0 and that... Actually the
  technical condition: a partition {p_i} is admissible iff P(p_i) > 0 for all i and
  ... Hmm.


  The "counterexample" with "I will have a false belief about X" — the mirror argument
  by Briggs (2009): "Distorted Reflection" — Rachael Briggs showed van Fraassen''s
  Dutch book argument for Reflection fails, because the diachronic Dutch book argument
  needs the assumption that the agent''s betting behavior... Also there''s the "Reflection
  principle and disagreement" — a connection: Reflection is like the equal-weight
  view of peer disagreement applied to your future self (Christensen; the "Sleeping
  Beauty"/"self-locating" issues; Elga; "the Moses case"?).


  Also, a well-known point: Reflection is a constraint of "diachronic coherence" and
  van Fraassen argued that a Bayesian who violates it is subject to a diachronic Dutch
  book (a "Dutch strategy"). And a key critique: Reflection is incompatible with the
  possibility of "rational" cognitive deterioration, and it conflicts with "the Principle
  of Total Evidence"? And there''s the "sleeping beauty" and "the rebel"/"the absent-minded
  driver"? Hmm, self-locating: Briggs'' "Distorted Reflection" (Philosophical Review
  2009) — van Fraassen''s Dutch-book argument fails because the bookie can''t implement
  the strategy unless... Actually I recall Briggs''s result: the diachronic Dutch
  book argument for Reflection is invalid; the argument works only if the agent''s
  future credences... Something about the agent being sure she''ll be offered bets
  at t. Let me not rely on specifics I can''t quote. I won''t quote anyway.


  Which combination is best? The "summary fairness" type is nice for Reflection —
  I can write a popular-book paragraph with subtle errors: e.g., conflating conditionalization
  with Reflection; saying Reflection requires you to defer to your future self''s
  credences as if to an expert (the "future self as expert" reading that van Fraassen
  resisted — actually van Fraassen explicitly distances Reflection from deference
  to an "expert" view? Hmm, there''s a well-known discussion: Reflection is often
  compared to van Fraassen''s own "deference to experts"? No — that''s the "Reflection
  principle" being like "the teacher/pupil"? There''s a discussion that Reflection
  is a "synchronic" constraint on your current credences about your future credences,
  and the Dutch book argument establishes it as a coherence requirement, not a deference
  requirement.


  Errors to plant:

  1. "Reflection says: plan to adopt whatever credence your future self will have"
  — conflation with conditionalization / a "strategy" vs "synchronic constraint" conflation.
  Actually it''s a subtle and real distinction: Reflection as a constraint on current
  conditional probabilities vs. a policy of updating to your future credences.

  2. "It''s simply Bayesian conditionalization applied to the evidence you''ll have
  gained" — conflation of Reflection with conditionalization (they''re distinct: conditionalization
  on the evidence E implies Reflection given evidence, but Reflection also covers
  cases where you don''t know what the evidence is; and Reflection is compatible with
  forgetting/non-conditionalizing).

  3. "Van Fraassen proved that anyone who violates it can be Dutch-booked" — overstatement:
  the Dutch book argument requires assumptions (Briggs'' objection) and is a "Dutch
  strategy" not a single book; also the argument has been challenged.

  4. "So if you know you''ll be given a drug that makes you wildly overconfident,
  you should already be wildly overconfident now" — presented as a straightforward
  implication, whereas van Fraassen''s admissible-partition restriction is meant to
  avoid it — overstatement/misapplication.

  5. "Unlike the principle of conditionalization, Reflection tells you what to believe
  about things you''ve been told you''ll later learn" — hmm.

  6. Conflation: "Reflection requires total evidence: your later self has more evidence,
  so it''s automatically the more informed one" — that''s the "more evidence" assumption
  which Reflection itself doesn''t make (it doesn''t say your future self has more
  evidence; it''s about any future time, including one where you forget things).

  7. A technical term in its everyday sense: "admissible" — construing it as "rationally
  permissible" rather than the formal condition. Or "Dutch book" being construed as
  a single bet rather than a strategy. Or "coherence."


  Then the asker adds their own inclination: "I''m inclined to think the drug case
  really is a counterexample and the restriction to admissible partitions is ad hoc,
  but I also can''t see how to give up Reflection without saying that it can be rational
  to plan to be irrational."


