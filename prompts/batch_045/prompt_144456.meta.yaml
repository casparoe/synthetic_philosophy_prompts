  Let me design the cases.


  Case 1: Meiotic drive / segregation distorter (t-haplotype in mice is real — well-known).
  A gene that sabotages gametes carrying its rival allele so it''s transmitted to
  >90% of offspring, while homozygotes are sterile or lethal. Verdict: this is selection
  at the gene level; the organism isn''t the beneficiary; there''s no group story.
  I''d say "the gene is the unit of selection here."


  Case 2: Sterile worker ants (eusociality, haplodiploidy). Verdict: I want to say
  this is kin selection — i.e., gene-level, or inclusive-fitness-individual-level.
  Actually, in my verdicts I should say: the worker''s sterility is explained by the
  gene''s transmission through relatives — I''m inclined to call this gene-level too,
  but my friend insists it''s individual-level (inclusive fitness). Hmm, I should
  pick: I say gene-level, friend says individual.


  Case 3: Alarm calls in ground squirrels / vervets — a costly call that warns relatives.
  Verdict: kin selection again, but I want to say: if the call warns non-kin too,
  and the group is a stable band, I still want to say gene-level? Better to make a
  case where I want to say group-level.


  Case 4: Female-biased sex ratio / a "restraint" allele in a parasite that reduces
  virulence so the host survives (myxoma in rabbits? Actually the classic: myxoma
  virus attenuation in Australian rabbits — a real case, well-known; also "the avirulence"
  case). Hmm: Myxoma: virulence decreased over time. Explanation: intermediate virulence
  maximizes transmission — that''s individual-level (or gene-level: the virus strain''s
  transmission). Verdict: individual/gene.


  Case 5: A made-up group selection case: a hypothetical — a species of colonial beetle
  where each breeding season, unrelated foundresses jointly start a new nest; a "restraint"
  allele reduces a female''s own egg number by half but doubles the nest''s survival;
  nests with more restraint alleles contribute more dispersers; relatedness within
  nests ≈ 0; nests are founded by random draws from a global pool, so nest-level variance
  is high and nests are "reproducing units" (they bud off daughter nests). Verdict:
  I want to call this group selection, not kin selection, and I don''t want to be
  told it''s "just kin selection with relatedness zero" — wait, with relatedness ~0,
  kin selection gives nothing, so it must be group selection. That''s not a hard-to-reconcile
  pair, though; that''s just straightforward MLS. Hmm.


  The hard-to-reconcile pair: I want to say (a) the meiotic-drive allele is gene-level
  selection, i.e., genes are genuine units of selection, and (b) some case is genuinely
  group selection, and (c) — the tension — I also want to say that in cases where
  both a gene-level and a group-level account fit, we should count only one as the
  "real" explanation, i.e., that there''s a fact of the matter about which level selection
  acts at, whereas my friend says these are just alternative bookkeeping (Price decomposition)
  and there''s no further fact. So my verdicts: "I don''t think the equivalence claim
  is right — I think there''s a real difference — but I also think many textbook group-selection
  cases are really kin selection in disguise."


  Alternatively, the hard-to-reconcile pair could be:


  (i) A trait that benefits the group but lowers individual fitness where groups are
  founded by relatives — I say kin selection, not group selection (I refuse to call
  it group selection).

  (ii) A trait that benefits the group but lowers individual fitness where groups
  are founded by unrelated individuals — I say group selection.

  (iii) But: in case (ii), if the same math works out either way, what makes it group
  selection? And in case (i) I said kin selection even though the math is the same.
  So the pair (i)/(ii) is hard to reconcile under a "single accounting" view — unless
  the principle is about causal structure (who interacts with whom / what the "unit
  of reproduction" is), not about the formalism. So the principle sought must be causal/structural:
  e.g., "count selection at level L only if the entities at level L are (a) units
  of multiplication/reproduction with heritable variance in fitness, and (b) the trait''s
  effect on fitness operates through a causal pathway that goes via the level-L entity''s
  fitness components."


  That''s nice and gives a real deliverable: a criterion with clauses, each motivated
