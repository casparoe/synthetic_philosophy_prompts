  related to sisters than to their own offspring): I want to say kin selection, and
  I resist my friend''s insistence that this is really colony-level selection. The
  colony is a reproducing unit — it buds daughter colonies — but I still don''t want
  to call it group selection.


  3. Transposable elements that copy themselves through a genome while lowering the
  host''s fitness: gene-level, straightforwardly.


  4. A case I made up to settle an argument: colonial beetles. Each season, four foundresses
  drawn at random from the whole population start a nest; nests survive and send off
  daughter nests at rates depending on how much restraint the foundresses show. Carriers
  of a restraint allele lay half as many eggs as non-carriers but nests of restraint-carriers
