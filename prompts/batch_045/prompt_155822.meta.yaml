  I am writing a paper on the bootstrapping objection to dogmatism about perceptual
  justification, and what I want from you is a diagnosis of why the debate has stopped
  moving, not a verdict on who is right and not a survey of the positions.


  Background, as I see it: dogmatism holds that a perceptual experience as of p gives
  one immediate, defeasible justification for believing p, with no antecedent justification
  for the reliability of the faculty. The objection is that this makes knowledge too
  easy: read an instrument repeatedly, take each reading at face value, infer the
  condition of the world from it, and then inductively infer that the instrument is
