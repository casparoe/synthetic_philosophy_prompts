  I work on the epistemology of perception, and I want a diagnosis rather than a verdict
  on why the bootstrapping debate has stopped moving.


  Set-up: Dogmatism — the view that having a perceptual experience as of p gives you
  immediate, defeasible justification for believing p, with no prior justification
  that your perceptual faculty is reliable — is charged with permitting easy knowledge:
  if every step of a chain of readings from a single instrument is justified just
  by taking it at face value, then by recording that the gauge says "full" and, on
  that basis, that the tank is full, repeated across many occasions, you can inductively
  establish that the gauge is reliable, which is exactly the sort of thing no one
  thinks you can do. The responses I keep meeting are (i) the transmission-failure
  reply: the inference from the instrument''s readings to a claim about its reliability
  cannot transmit warrant, because the warrant for the premises is an entitlement
  whose exercise already presupposes the reliability the conclusion asserts; (ii)
  the "not so bad" reply: some bootstrapping is benign, and the perceptual case is
  different from the instrument case in ways the objector has not shown to be irrelevant;
  and (iii) the insistence that the objector has simply helped herself to the internalist
  premise that no source can vouch for itself. Twenty-odd years on, everyone can recite
  these and no one has moved.


  My own hypothesis is that the impasse is partly about which case counts as the data.
  I want to suggest a distinction the literature does not make explicit: [niche idea].
  Call a bootstrap single-channel when every "check" on the source is informationally
  downstream of the source itself (the tank''s being full is known only through the
  gauge), so that the agreement between the readings and the world is guaranteed by
  construction and evidentially inert; call it multi-channel when the checks arrive
  through routes that are independent of the source (cross-modal, or action-guiding
  success that would fail if the source were not tracking), so that agreement is a
  genuine constraint. On that distinction, the objector''s cases are all single-channel,
  the dogmatist''s case is multi-channel, and the two sides are testing the same principle
  on different data — which would make the dispute partly verbal (about "justification"/"entitlement"?)
