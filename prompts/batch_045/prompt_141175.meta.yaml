  ---


  I''ve spent the better part of a decade working in market design — two-sided matching,
  kidney exchange, combinatorial clock auctions for spectrum, and one long-running
  headache involving the allocation of school places — so my native vocabulary is
  bidders, preference orderings over allocations, transfers, individual rationality,
  strategy-proofness, budget balance, thickness and congestion, and repugnant transactions.
  I don''t need any of that explained. A friend who works on global health funding
  has been trying to recruit me to an idea called ''moral trade'', which I''d like
  you to restate for me in those terms. As she explains it: two parties who disagree
  about what is worth doing can still trade to mutual advantage, because each can
  buy, cheaply, an action the other thinks worthless. If I believe a marginal pound
  does most good buying insecticide-treated bednets while you believe it does most
