  — it''s "value to the world as I see it", not preference satisfaction of the buyer.
  So the standard model of gains-from-trade (utility functions over own consumption
  bundles) doesn''t fit: my utility increases when you do X even though I never receive
  X. That''s "external" preference or "altruistic/impersonal" preferences. So it''s
  a market in "who acts", not "who gets".

  2. Repugnance / contested commodities: each party is being paid to do something
  they regard as worthless (or mildly bad), which is exactly the structure Roth calls
  a repugnant transaction; and yet the repugnance here is *internal* to the trade
  (the seller doesn''t value the good they produce) — unlike kidney sales, where the
  seller''s objection is mainly about the terms.

