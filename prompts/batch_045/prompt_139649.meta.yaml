  Draft argument (in the asker''s voice, seminar-built, conclusion absurd):


  (1) Evidence about the reliability of your own belief-forming processes — "higher-order
  evidence" — can rationally require you to revise a first-order belief: if a blood
  test shows you were dosed with a hallucinogen an hour ago, you should stop believing
  the things your senses told you then.


  (2) But any such verdict that your first-order processes are unreliable is itself
  a belief you formed using some belief-forming process, and (1) says nothing restricts
  (1) to first-order processes. Whatever your evidence is for the unreliability claim,
  it too is the product of a process that could be indicted.


  (3) So by (1) applied to itself, you should suspend judgment on the claim that your
  first-order processes are unreliable — that claim is one more belief, and you have
  no more reason to trust the process that produced it than any other.


  (4) But if you suspend on the unreliability claim, then you have no reason to revise
  your first-order beliefs either. (1) now has no application.


  (5) Generalizing the move in (2)–(4): for any level n, the deliverance at level
  n is defeated by a possible defeater at level n+1, and the level n+1 deliverance
  is in turn defeated by something at level n+2; so there is no level at which a revision
  requirement ever binds.


  (6) Therefore higher-order evidence never rationally requires any belief revision:
  you should just keep whatever credences you started with.


