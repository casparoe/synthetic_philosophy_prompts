  and is demanding a feeding tube, dialysis, and ICU transfer, arguing that her father
  is not diminished by his dementia: a person is a person through other persons, and
  she and the wider family still hold him fully in relation. She says the team''s
  proposal to focus on comfort is treating him as already dead.

  - His nursing team and the daughter of a neighbour who looked after him daily for
  the last twelve years say that before his decline he often told them he did not
  want to be "kept going like this," that he no longer recognises anyone, and that
  the aggressive plan serves the daughter''s guilt rather than him.


