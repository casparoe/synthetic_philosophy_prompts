  \ the committee should ask which slice of the outcome is attributable to choice.\n\
  \nAlso the \"harshness objection\" (Elizabeth Anderson) — the losing side: holding\
  \ people to the consequences of their choices means abandoning those who made bad\
  \ choices to destitution; also the \"shame/standing\" objection — that means-testing\
