  \ luck egalitarianism: brute luck vs option luck. The niche injected idea: a new\
  \ distinction the asker has been toying with — \"option luck that was priced under\
  \ a distorted information environment\" or \"responsibility for the choice vs. responsibility\
  \ for the outcome given the choice.\"\n\nActually I like the idea of injecting an\
  \ invented distinction: e.g., a \"foreseeability-within-a-social-role\" test, or\
  \ \"counterfactual insurance test\" — could the person have insured against the\
  \ outcome at a fair premium given their actual epistemic situation and income? That's\
  \ actually the classic Dworkin \"hypothetical insurance\" device. Hmm, injecting\
  \ a novel variant: \"actuarially fair insurance the person could have bought at\
  \ the time, given only what a reasonable person in their social position would have\
