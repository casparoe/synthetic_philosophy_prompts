  The classic pressure points on Humeanism:

  1. The problem of "chance without frequency" — a world where a chance process is
  "unrepresentative": a fair coin tossed once and lands heads; or a chancy world where
  all actual frequencies diverge wildly from chances (possible but improbable). Lewis''s
  answer: the chance is what the best system says; the fit is global, so a single
  divergent frequency is fine, but systematic divergence would make the system lose.

  2. "The undermining problem" (Big Bad Bug): chances about the future constrain what
  frequencies will actually be, but if the actual future frequencies are misaligned,
  then the Humean''s chance claim is undermined — the chance of the undermining evidence
  is nonzero, so Bayesian conditionalization makes the chance claims inconsistent.
  This is a well-known bug.

  3. **Incompossibility / "chance makes the laws false"**.

  4. **The "problem of the reference class / chance for one-off events":** e.g., the
  chance that *this* particular radioactive atom will decay in the next hour — Humean
  chances are assigned by the best system to event types, but the chance of the Big
  Bang having a certain feature, or of a single unrepeatable event (the chance that
  the universe''s fundamental constants are what they are). Anti-Humeans (Hall) argue
  that Humean chances require patterns of repetition, and single-case chances for
