  I like the angle: the "partition-relativity objection": Jeffrey conditionalization
  requires the agent to specify a partition over which the new probabilities are given;
  different partitions compatible with the same "experience" give different results;
  hence the rule is incomplete as a theory of "experience." The crux: distinguish
  (a) learning the value of a random variable''s distribution (genuine partition case:
  e.g., a color-seeing case under sodium light — you see a color and your credence
  shifts over color-cells), from (b) learning only a single proposition''s new probability
  (not a partition — e.g., "I''ve become 70% confident that the butler did it"), which
  is underdetermined: infinitely many partitions give different updates. Then: the
  tempting fix — KL-minimization — but note KL-minimization also requires a constraint
  set and is not generally commutative, and it coincides with Jeffrey on partitions.
  And the deep point: the choice of partition is not a matter of "what the evidence
  says" but encodes a causal/screening-off assumption (rigidity), so the real work
  is done by the rigidity assumption, not by the rule. A top answer says: the "problem
  of uncertain evidence" is misnamed; there is no such problem for a Bayesian with
  a sufficiently rich algebra — you condition on your total evidence (the experience
  itself, e.g., "it looked red"), and Jeffrey''s rule is a computational convenience
  for when you won''t/can''t extend the algebra; the whole difficulty is transferred
  into the rigidity condition.


