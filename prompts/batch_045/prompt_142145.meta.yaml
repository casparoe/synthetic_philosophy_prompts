  ---


  I am a high school student writing an extended research paper on why psychiatric
  categories seem to change over time, and I would like help with a distinction I
  have been trying to draw.


  I have been reading about Ian Hacking''s idea of looping effects: a classification
  of people can be taken up by the people it classifies, who then understand themselves
  and behave differently in light of it, which forces experts to revise the classification,
  which in turn gives the classified a slightly different thing to respond to. On
  this picture the instability of a psychiatric kind comes from the fact that the
  people classified can know about the classification and react to it; this is what
  makes such kinds, in Hacking''s terms, interactive, in contrast to the indifferent
  kinds of natural science, which do not care how we describe them.


  The mechanism I keep running into in my reading, though, seems different, and I
  have been calling it the accommodation ratchet. Once a diagnostic category is in
  place, an apparatus grows around it: screening instruments used in schools and primary
  care, referral pathways, insurance and educational accommodation codes, patient
  advocacy organizations, clinics whose funding is tied to how many patients they
  see, and commercial markets for treatment. The apparatus then produces pressure
  on both sides of the consulting room: people have reason to seek the classification
  and clinicians have reason to apply it, and the instruments used to detect it get
  calibrated against the wider, milder population now being screened. Measured prevalence
  rises; the rise is then reported as evidence that the condition was under-recognized,
  which justifies more screening; and a category that has become a route to support,
  identity, or funding becomes very hard to shrink. Note that nothing here requires
  the classified person to change, or to know anything about the diagnosis at all.


  So my question is a comparative one. How exactly does the accommodation ratchet
  differ from Hacking''s looping effect, and is it really a separate mechanism or
  only a special case of looping?


  In answering, I would find it useful if you addressed:


  1. Whether looping requires the classified people to be aware of the classification
  and to revise their self-understanding; if it does, then something like the ratchet
  could presumably operate on an indifferent kind such as an infectious or endocrine
  disease, whose measured prevalence can also climb as tests are extended down the
  severity gradient. What would that imply for Hacking''s interactive/indifferent
  distinction, if anything?


  2. How the two mechanisms differ in what they predict. My tentative thought is that
  looping should change the character of the condition itself (how it is experienced,
  described, and presented), while the ratchet should mainly change who is counted
  — pulling in milder and previously subthreshold cases at the boundary, while the
  severe cases look much as they did. Is that the right way to tell them apart, and
  what observation would discriminate between them?


  3. How far the two can be separated empirically: could the ratchet be one of the
  things that makes looping possible in the first place, by building the institutions
  through which a diagnosis becomes available as something to identify with? And if
  they are entangled, should I treat the instability of psychiatric kinds as one phenomenon
  or two?


  ---


