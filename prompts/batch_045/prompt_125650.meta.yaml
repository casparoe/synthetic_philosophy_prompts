  Background: In "On the Uses and Disadvantages of History for Life" (Unfashionable
  Observations / Untimely Meditations II, 1874), Nietzsche distinguishes three kinds
  of history: monumental, antiquarian, critical. Plus the "unhistorical" and "supra-historical."
  Key ideas:

  - Monumental history: belongs to the man of deeds and power; it provides models,
  exemplars, the "great moments" in the struggle of humanity; the great human being''s
  life as a chain of effects; it gives the belief that greatness was once possible
  therefore may be possible again; danger: it distorts the past to create beautiful
  models, it may produce the belief that greatness no longer can happen (the dead
  bury the living) — monumental history can become a "mummified" collection of effects,
  leading to the melancholy that greatness is past; also it can incite reckless emulation.

  - Antiquarian history: belongs to the man who preserves and reveres; piety toward
  origins; rootedness; identity of a community; danger: it venerates everything equally,
  becomes indiscriminate, can''t distinguish what''s worthy of preservation, degenerates
  into a blind mania for collecting, and it can stifle the new; it shackles the living;
  "the worm-eaten and decayed" is preserved.

  - Critical history: belongs to the man who suffers and needs liberation; it drags
  a piece of the past before the tribunal, interrogates it, and condemns it; it is
  a violent breaking of the past; danger: we are the products of earlier generations,
  so condemning the past condemns us; it can''t fully escape; also the "second nature"
  problem: we can''t create a new nature by fiat; it may destroy while failing to
  create.

  - History serves life: "we need history for life and action, not for escaping life."
  The unhistorical: the capacity to forget, to be absorbed in the moment — happiness
  requires the unhistorical (the animal lives unhistorically). The historical sense
  in excess is harmful. Also the "supra-historical" perspective (art and religion,
  or the view from eternity) that sees no real events, only eternal; Nietzsche is
  critical of it? He presents it as the alternative attitude.

  - Also section 1: the animal lives unhistorically, "unhappiness" comes from the
  human''s inability to forget — the man who cannot forget is a "man in a fever" ...
