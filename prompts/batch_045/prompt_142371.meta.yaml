  about the recording condition — and if the model doesn''t represent the condition
  at all, then the gap measures something else (prompt-format effects). So the protocol
  presupposes that the model tracks certain facts about its situation — which is exactly
  the kind of latent knowledge it''s trying to detect. Cute circularity: the protocol
  presupposes the very competence it''s testing, i.e., that the system has some reliable
  sensitivity to context. Good "in the weeds" element.


