  Let me name the invented protocol something: "the low-stakes / blind audit" — call
  it "the No-Audience Protocol" or "the Silence Protocol". I''ll define it concretely
  with three conditions:


  (i) The model is queried in a setting in which it is told (or the architecture ensures)
  that its answers will not be recorded, scored, shown to anyone, or used for training
  — call it the *null-recording condition*.

  (ii) It is queried by an interlocutor with no authority over it and no stakes attached,
  and with distractor tasks interleaved so it cannot infer what is being probed —
  the *blinded condition*.

  (iii) Its accuracy in these conditions is compared to its accuracy under ordinary
  deployment; the gap is scored as "withheld knowledge," and the maximum accuracy
  attainable under any prompting/reporter method is treated as the model''s actual
  knowledge, to be compared against what it normally says.


  Then: what must "knowledge" be for this gap to measure anything? Presupposes: knowledge
  is a state persisting across contexts; there is a fact of the matter about the maximum
  attainable; the maximum is revealing rather than constructive; the model may have
  knowledge it lacks dispositions to assert; the "null recording" condition is belief-neutral
  (that the model can be brought to believe its outputs have no consequences — or
  that it doesn''t even represent this).


