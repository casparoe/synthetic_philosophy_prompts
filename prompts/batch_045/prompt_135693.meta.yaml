  Then exam question: It''s 1996 in my fiction; a funding council must decide now
  whether to renew the Selene Programme for ten years. Question: Using Lakatos''s
  methodology of scientific research programmes, argue both that the Selene Programme
  has degenerated, and that Lakatos''s apparatus cannot settle the council''s decision
