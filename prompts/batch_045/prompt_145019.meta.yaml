  ---


  I have been reading the Dennett–Caruso exchange on just deserts for years as pure
  theory; it stopped being pure theory for me last winter, when my younger brother
  was badly assaulted by a stranger and I found that the thing I wanted, quite specifically,
  was the assailant''s suffering. He has pleaded guilty, there is a sentencing hearing
  in six weeks, and I have been asked whether I want to address the court. Before
  I decide what to say, I want to know whether the package of views I have been carrying
  around actually holds together, because I can feel at least one of them straining
  and I can''t tell which.


  Where I think I stand:


  1. No one is morally responsible in the basic-desert sense — the sense in which
  suffering could be intrinsically owed to someone because of what they did. I take
  the luck objection to ultimacy seriously and I don''t think the compatibilist replies
  dissolve it.


  2. So retributivism is false: the state may not harden anyone''s lot on the ground
  that it is deserved.


  3. Forward-looking justifications survive: incapacitation, deterrence, rehabilitation,
