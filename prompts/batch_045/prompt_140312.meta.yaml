  Candidates I keep hearing: that if pleasures share no common feel then welfare isn''t
  pleasure; that interpersonal comparison becomes impossible in principle rather than
  merely underdescribed; that any valence measure is therefore an arbitrary stipulation,
  so any unit is as good as any other; that hedonism quietly collapses into a desire-based
  theory; that (d) is simply a reductio of the whole project.


  3. Say whether the retentionist/substitutionist disagreement is, in whole or in
  part, merely verbal, and if so whether that defuses it or just relocates the real
  question — and where the relocated question sits in your ranking.


  4. There is a validation trap I want addressed: any candidate measure has to be
  checked against something, and the obvious candidates are subjects'' reports (undermined
  by (b)) or the very theory the measure is supposed to operationalise. Is there a
  way out, and does answering that belong in philosophy''s portion of this budget?


  Finally, be explicit about what would change your mind: what result or argument
