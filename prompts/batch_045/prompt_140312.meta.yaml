  I sit on the program committee of a private foundation that has committed roughly
  $30M over five years to a single deliverable: a cardinal, interpersonally comparable
  measure of momentary wellbeing that a national health ministry could place next
  to QALYs in cost-effectiveness analysis. Most of the grantees are psychologists
  and economists. The budget also covers about eight philosopher-years, and my job
  is to say what those are for. I don''t want a survey of the literature and I don''t
  want a reading list; I want a defended ordering of a handful of questions, with
  your criteria stated and the trade-offs between them made explicit.


  The area I think the money has to go into is the heterogeneity problem: what, if
  anything, the pleasure of a cold drink on a hot day, of finishing a proof, of a
  piece of music, of sex, and of another person''s humiliation have in common in virtue
  of which each is a pleasure, and what follows for measurement if the answer is "nothing
  experiential."


  Take the following as given from our grantees'' data (it''s stipulated for the purposes
  of this question; don''t spend time querying it):


  (a) Within a single subject, momentary pleasantness ratings across these very different
  activities load on one factor, and that factor predicts choices in a reinforcement-learning
  task better than any activity-specific measure does.

  (b) Across subjects, the rating scales appear to be related by monotone transformations
  that differ from person to person, so aggregation requires either a stipulation
  about whose scale fixes the unit or a move to something subjects don''t report at
  all.

  (c) The best available cross-person predictor of those ratings is not anything subjects
  can describe about how the experience feels; it is a measurable signature — the
  extent to which attention is captured and repeatedly returns to the activity, together
  with the disposition to re-choose it under matched conditions.

  (d) One of our econometricians has proposed cutting the Gordian knot: define the
  unit directly in terms of that signature in a representative agent, and stop claiming
  the number tracks how anyone feels.


  The committee is split three ways, roughly: retentionists, who think there is a
  thin common experiential core (a hedonic tone available to introspection) and that
  we should learn to measure it; substitutionists, who think the right move is to
  keep the causal-cum-functional role and let the signature be the target, treating
  "pleasure" as either a stipulative label or a term we should retire; and abandonmentists,
  who take the heterogeneity result to show that pleasure was never the right target
  and that we should be measuring something else — desire satisfaction, reflective
  endorsement, or a pluralist list.


  What I want from you:


  1. Rank the four or five open questions you think these eight philosopher-years
  should actually go to, and defend the ordering. For each, say what it is upstream
  of, whether it is tractable in five years by people doing conceptual work in dialogue
  with this dataset rather than needing a decade of new empirical work, and — this
  matters most to me — whether its answer would change the design of the instrument.
  Some questions are load-bearing for the theory and inert for the deliverable; if
  you think any of the committee''s favourites are like that, say so.


