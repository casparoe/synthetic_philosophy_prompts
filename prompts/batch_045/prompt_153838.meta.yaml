  the podcast concludes: this shows why a BCI can settle the question we couldn''t
  settle before — whether you and I feel the same thing — because once both of us
  have implants we can compare readouts; so Wittgenstein''s argument is really an
  argument that private experience is an illusion / that there is no hard problem,
  and once you have good enough neural data the private-language worry evaporates.


