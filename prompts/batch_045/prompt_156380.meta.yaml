  Now, the theory: interpersonal utility comparisons. Content:

  - The informational framework: ordinal non-comparable (ONC), cardinal unit-comparable
  (CUC), cardinal fully comparable (CFC); what''s possible with each (Arrow-style
  impossibility under ONC; utilitarian SWF under full comparability; Harsanyi''s aggregation/
  impartial observer theorem from von Neumann–Morgenstern utility + equiprobability;
  "extended sympathy" preferences; Sen''s critiques; Hammond/Roberts/d''Aspremont–Gevers;
  "welfarism" results, the "levelling down objection" is not relevant here).

  - Numeraire choice: any allocation rule must pick a currency — life-years, QALYs,
  dollars, chances — and the currency choice does the interpersonal comparison silently.

  - Level vs. unit vs. gain comparisons; the "zero problem" (whose zero, and whether
  gains are measured from a common baseline or from each person''s own status quo):
  the committee''s implicit baseline was probably "contribution to others" rather
  than the patient''s own experience.

  - Whether the comparison is of outcomes (welfare gained) or claims (rights, desert,
  priority), and the two-column ledger device: counting dependents'' losses — double
  counting vs. ignoring.

  - Does the lottery escape comparison? No — it presupposes equal claims within the
  pool; it converts a comparison of magnitudes into a comparison of chances; and choosing
  the pool still compares. Also: randomization as "avoiding the expressive harm" of
  ranking; and the ex-post vs ex-ante welfare question.

  - 1972: Congress dissolved the scarcity — what does that say about the theory? It
  suggests the comparison problem is often a scarcity problem, and that institutions
