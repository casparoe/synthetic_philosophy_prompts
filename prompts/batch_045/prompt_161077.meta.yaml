  \n[1] Gödel's first incompleteness theorem: if T is a formal system whose axioms\
  \ can be enumerated by a mechanical procedure and which contains enough arithmetic\
  \ to encode its own syntax, then T, if consistent, is incomplete — there is a sentence\
  \ G such that neither T ⊢ G nor T ⊢ ¬G. The arithmetic has to include multiplication\
  \ and not just addition, since the theory of addition alone is complete and decidable,\
  \ which is why the coding of sequences needs more than Presburger arithmetic gives\
  \ you. G is built by Gödel numbering plus diagonalization: you construct a sentence\
  \ that, under the intended reading of the codes, asserts that no number is the code\
  \ of a T-proof of that very sentence. Strictly speaking, Gödel's original proof\
  \ assumed ω-consistency, and Rosser later showed that plain consistency suffices\
  \ — the point being that a consistent but ω-inconsistent theory can prove the negation\
  \ of its Gödel sentence, since that negation is a Σ₁ existential claim that no specific\
  \ number witnesses. Tarski's theorem completes the picture: T cannot define a truth\
  \ predicate for its own language, so \"G is true\" is a statement we make from outside\
  \ T, not one T can formulate.\n\n[2] The important consequence for Hofstadter's\
  \ analogy is that the self-reference is an artifact of the coding. G is a sentence\
  \ of arithmetic; it doesn't contain a name of itself in any literal sense. So a\
  \ machine can do exactly what we do: there is a mechanical procedure that, given\
  \ a description of T, prints out G_T. Whatever the human's ability to \"see\" the\
  \ truth of G consists in, its *production* is mechanizable, and the anti-mechanist\
  \ cannot locate the difference there.\n\n[3] The reflection tower is the mechanist's\
  \ version of this point. T_0 = PA; the mirror-step sends T_n to T_n + Con(T_n).\
  \ Since Con(T_n) is equivalent to the Gödel sentence of T_n, each step adds a truth\
  \ that the previous stage could not prove, and since the rule is mechanical, a machine\
  \ can run it on a description of itself indefinitely, doing precisely what the anti-mechanist\
  \ says only a mind can do. And the tower does not merely postpone the problem, it\
  \ dissolves it: at stage 1 we already have a theory that proves its own consistency,\
