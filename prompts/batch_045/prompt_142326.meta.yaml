  I am writing a chapter on whether a hereditary head of state is compatible with
  democratic equality, and I keep running into one line being used as a conversation-stopper:
  the sovereign reigns but does not govern.


  Most recently it appeared in a seminar as the hinge of a dilemma. My interlocutor''s
  argument: either the monarch''s office carries no real power, in which case it is
  pure decoration and cannot be a democratic defect worth campaigning about; or it
  carries real power, in which case the country in question is not a genuine constitutional
  monarchy and the interesting question is the different one about elected presidents.
  So there is, supposedly, no middle case in which the office matters politically
  while remaining constitutionally proper. Abolition on the first horn would be like
  removing a logo; on the second horn it would be ordinary constitutional reform.
  Nothing distinctive is at stake.


  I think the dilemma is rigged by the slogan, but I cannot yet say precisely how.
  ...


  Then: the distinctions I want help with:

  1. exercise vs possession vs anticipated exercise. Introduce "gravitational" label:
  "What I have been calling (in my own notes) the gravitational effect of an unexercised
  power: the case in which ministers never place a certain proposal before the sovereign,
  or never advise a certain course, precisely because they believe it would be refused
  — so the refusal never occurs and leaves no trace in the record. I''d like the menu
  to say what kind of claim about ''governing'' such an effect is: is influencing
  what is put to you a way of governing?"

  2. governing vs legitimating: the head of state as the condition of the government''s
  ability to act in the state''s name, the locus of allegiance, the personification
  of continuity when governments change, the guaranteeing that there is always someone
  with the authority to appoint a Prime Minister after an indecisive election. Does
  the slogan''s ''not governing'' imply no governing-relevant role?

  3. legal vs conventional: in the UK much executive power is formally vested in the
  Crown and exercised by ministers; so the slogan is not a legal truth but a claim
  about convention. Ask: what does the slogan assert — a legal fact, a conventional
  fact, a causal/behavioral claim, or a normative claim about what the sovereign ought
  to do?

  4. Normative reading: sovereign ought not to govern — different from descriptive.
  Confusing "does not" with "must not" makes the description of an institution into
  a rule.

  5. Cross-national: In Japan the Emperor is constitutionally a symbol ... with no
  powers of government; in the Scandinavian kingdoms the monarch formally assents
  to legislation and presides over the Council of State — so the slogan''s truth varies;
  ask which readings are true where, and whether the dilemma''s second horn misfires
  in the Japanese case (a constitutionally constrained office can still be symbolically
  potent...).

  6. Also: the substitution point — abolition replaces one institution with another;
  the "no power" reading doesn''t establish that removal is a null change, because
  a new head of state (especially elected) would have a democratic mandate. Ask whether
