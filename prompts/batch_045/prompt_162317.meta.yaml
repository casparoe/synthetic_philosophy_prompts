  \ be answerable.\n\nOption B: Rawls veil of ignorance + difference principle, consistency\
  \ audit. Commitments: (1) accept the two principles via the original position; (2)\
  \ think the difference principle is maximin applied to primary social goods; (3)\
  \ think the parties' motivation is mutually disinterested rationality, not benevolence;\
