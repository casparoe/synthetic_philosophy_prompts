  \ content/representation (or has content?) — need care, (c) the \"content is not\
  \ normativity\" worry: that teleosemantics grounds misrepresentation (the disjunction\
  \ problem / indeterminacy), (d) that phenomenal intentionality is a problem, (e)\
  \ that the etiological vs. proper-function distinction. Genuine tension: teleosemantics\
  \ as a naturalistic theory combined with the claim that it delivers determinate\
  \ content (disjunction problem) — and the claim that swampman lacks content (history-dependence)\
  \ while also claiming that content must be intrinsic/grounded in current physical\
  \ constitution for causal explanation... Actually a nice tension: if you're a teleosemanticist\
  \ on grounds of naturalism, and you also think that a creature's current causal-discriminative\
  \ structure is what explains behavior (so you want \"structural/\"functional\" content),\
  \ then the history-dependence (swampman verdict) is in tension with the explanatory\
  \ role. Also: teleosemantics is often motivated as solving the disjunction problem,\
  \ but etiological accounts arguably inherit indeterminacy.\n\nAlso an apparent tension\
  \ that dissolves: thinking teleosemantics commits you to saying the salient difference\
  \ between swampman and a normal creature makes no causal/explanatory difference\
  \ — that's fine, content can be extrinsic/historical while being explanatory (etiological\
  \ functions explain via normal conditions). Or the apparent tension between naturalism\
  \ and normativity (Millikan's \"Normal\" conditions are statistical, not normative\
  \ — dissolves).\n\nHmm, but I need to inject a niche/new idea to make it non-regurgitable.\
  \ E.g., a novel case: \"a lineage-founding mutant\" or a self-replicating machine\
  \ whose selection history is conferred by a designer's simulation (a \"simulated\
  \ selection history\" case). Or: \"creatures whose ancestors were selected for a\
  \ different function\" — Papineau's example of a polar bear's camouflage... Let\
  \ me craft a bespoke case: \"a swarm of robots whose selection history occurred\
  \ in a simulation, then instantiated\". Or: \"an organism whose trait was selected\
  \ for in an ancestor for function F, then the organism's own trait tokens were produced\
  \ by a mechanism that has been co-opted (exaptation)\".\n\nMaybe better: combine\
  \ teleosemantics with a case about an organism that has never been selected for\
  \ anything — the first member of a species whose trait is adaptive (the \"hopeful\
  \ monster\" / \"founder\" case). Teleosemantics says the founder's states lack content\
  \ because no history of selection — but its states do causally covary and guide\
  \ behavior. This is a known issue (Millikan's \"first generation\" problem; Papineau's\
  \ \"the first members of a species\" problem). To be non-standard, I can construct:\
  \ a creature whose selection history is self-imposed — e.g., a lineage in which\
  \ individuals select their own neural wiring during development (a \"self-scaffolded\
  \ selection\" process). Does an ontogenetic selection process (like neural Darwinism\
  \ / synaptic pruning) confer proper functions? That's an actual live debate (Millikan\
  \ vs. neural Darwinism; also \"selection within the lifetime\" — the immune system,\
  \ and Garson's work on \"How to be a teleosemanticist\" / neurosemantics).\n\nHmm,\
  \ careful: don't refer to super niche theories LLMs won't have memorized. Teleosemantics\
  \ broadly, swampman, disjunction problem, Millikan's biosemantics, Dretske, Papineau\
