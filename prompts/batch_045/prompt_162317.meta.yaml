  \ instructions: keep relatively short and focused; relatively formal/polished.\n\
  \nBest combination: I think the \"state own commitments and ask whether they hang\
  \ together\" type with teleosemantics is very good — natural fit, allows injecting\
  \ niche ideas. Or Rawls with dirty hands? Or backward induction paradox with centipede\
  \ game and consistency audit (commitments: one-shot centipede, backward induction,\
  \ common knowledge of rationality, ...).\n\nLet me think about which gives the richest,\
  \ most in-the-weeds but model-accessible prompt.\n\nOption A: Teleosemantics consistency\
