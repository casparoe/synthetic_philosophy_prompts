  \ because it's about beliefs about the opponent, not about rationality of the action\
  \ given beliefs. That's a nice dissolving one.\n\nAlso: a commitment that the centipede\
  \ paradox has nothing to do with Newcomb / that it's a distinct problem from the\
  \ surprise exam paradox — apparent tension? Hmm.\n\nActually the backward induction\
