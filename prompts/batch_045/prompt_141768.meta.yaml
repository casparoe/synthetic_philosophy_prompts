  I sit on a committee at my workplace that is redesigning how employees are enrolled
  in benefits, and over the last year I have had to work out, more or less from scratch,
  what I actually think about nudging and paternalism. I have ended up with the following
  set of commitments, and I would like to know whether they are jointly defensible
  before I try to defend them to the rest of the committee.


  1. Means, not ends. I accept the state (or my employer) steering my conduct when
  it makes it more likely that I achieve the ends I already have, and I reject it
  when it substitutes someone else''s judgment about what is good for me. Where the
  line falls between "helping you get what you want" and "deciding what you should
  want" is where I expect trouble.


  2. No exploitation of quirks. A nudge is illegitimate if it works by getting me
  to act on a feature of my psychology that I would not, on reflection, want to be
  acting on. Defaults that I stick with out of inertia, or because I read them as
  a recommendation, are the cases I have in mind.


  3. Easy exit. I accept arrangements I can escape at trivial cost and reject bans,
  mandates and anything that materially burdens an option. Relatedly, I find the asymmetric
  case persuasive: an intervention that does a lot of good for people who are prone
  to error while costing people who are not essentially nothing is especially hard
  to object to.


  4. Sunset defaults. I have been arguing for defaults that expire: automatic enrollment
  would be set at the option most employees would pick if they thought about it, but
  every two years the default lapses and I would have to make an active choice before
  enrolment continues. My reasoning is that a default nobody ever revisits turns into
  the very thing objection 2 forbids, while a default you have to re-confirm does
  not.


  5. Publicity. I want to be able to be told, in plain terms, what the intervention
  is and why it is set where it is, and still be free to choose; if a policy works
  only as long as people do not notice it, I do not want it.


  6. Employer over state, and third-party benefits. I am considerably more comfortable
  being nudged by my employer than by the government... etc.


