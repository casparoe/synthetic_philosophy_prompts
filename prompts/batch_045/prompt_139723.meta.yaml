  drift": I''ll coin "the anthropic-archive objection" — the idea that any historian
  who finds herself in a position to write universal history at all is already the
  beneficiary of a long run of non-catastrophes, so the appearance of a steady progressive
  movement may be an artifact of the standpoint of the observer rather than a tendency
  in the object.


