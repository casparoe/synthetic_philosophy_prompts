  Let''s consider Wittgenstein''s private language argument.

  A classic: Can there be a language whose words refer to what only the speaker can
  know—their private sensations? Wittgenstein''s argument (Philosophical Investigations,
  ~#243-315) involves the beetle in the box, the diary of the sensation S, and the
  conclusion that a private language is impossible because there is no way to check
  the correct use of the word (no distinction between seeming to remember and actually
  remembering; no independent criterion of correctness). "An ''inner process'' stands
  in need of outward criteria."

  Restating this in the vocabulary of, say, "cryptography and information theory":
  private keys, encryption, one-time pads, or "commitment schemes". Or in the vocabulary
  of "reinforcement learning: internal reward signals, agent-environment interface,
  private state, observability". If the asker is an "RL researcher": "I''m an RL researcher.
  Restate Wittgenstein''s private language argument in the vocabulary I actually use
  -- agents, environments, observations, reward functions, internal state, partial
  observability, POMDPs, supervised vs. RL signals -- as faithfully as you can, and
  then tell me what didn''t survive. Is there anything the private language argument
  turns on that has no counterpart in my vocabulary?" This is excellent! It''s in
  the weeds, requires careful translation, and the residue report is interesting:
  e.g., the idea of a "criterion of correctness" vs. "loss minimization"; the private
  ostensive definition vs. "unsupervised representation learning with no external
  validation"; the beetle in the box vs. "private internal state that doesn''t affect
  the policy (or does it?)". Wait, in RL/POMDP, an agent can have internal states
  that are not observable, but the point of Wittgenstein is about *language* and *rules*,
  not just internal state. The translation would be interesting: a language is a set
  of signs with rules; a private language would be a vocabulary whose meaning is determined
  solely by the agent''s internal states, with no external referent or correctness
  condition. In RL, the "meaning" of a term is its use (Wittgenstein: "meaning is
  use"). The use is determined by the policy, which is shaped by rewards from the
  environment. If the "word" is tied to a private sensation, the "correct use" can''t
  be distinguished from "seeming to use it correctly". In supervised learning, labels
  provide the correctness criteria. In RL, rewards do. In a purely private setting,
  the "reward" is also private/internal. So the private language argument translates
  to something like: "can a learning system learn a representation and a policy for
  manipulating symbols where the only signal is the agent''s own internal state, with
  no grounding in the environment?" This hits on the symbol grounding problem, but
  also on the rule-following paradox ("no course of action could be determined by
  a rule, because every course of action can be made out to accord with the rule"
  - PI 201). That''s the rule-following consideration. In RL vocabulary: a policy
  is a function from observations to actions. If the "rule" is just the policy, then
  any behavior is "according to the rule" if the policy is defined by the behavior.
  But learning requires a loss/reward to distinguish better/worse policies. Without
  an external loss, there''s no gradient. This is a very nice, non-trivial translation.


