  Confusions to be corrected by a good answer:

  - The impossibility results are conditional mathematical relations between criteria
  given a fixed target and imperfect prediction; they''re not artifacts of noisy labels,
  and redefining the target doesn''t dissolve them (it changes the task; and the new
  target has its own construct-validity problems). Also, base-rate differences across
  groups are themselves often the substantive issue, not a bug to be engineered away.

  - Blindness doesn''t help: correlated features; and calibration may actually require
  using group membership (Kleinberg-style point: excluding the protected attribute
  can hurt both accuracy and fairness; also "fairness through awareness").

  - Randomization: partly legitimate (derived/randomized classifiers in the equalized-odds
  literature) but not free and not a loophole: the theorems are about distributions
  and can be extended to randomized rules; you pay in utility, you treat identical
  individuals differently (conflicts with individual fairness/treating-like-cases-alike),
  and you still have to choose which criterion to enforce; and randomization doesn''t
  fix calibration-vs-balance at the level of the reported risk score if you want the
  score itself to be both calibrated and balanced.

  - Also: the impossibility results don''t say "no algorithm can satisfy any fairness
  criterion" or "fairness is impossible" — many criteria can be jointly satisfied
  in special cases (equal base rates, perfect prediction), and the point is you must
  choose among incompatible desiderata on substantive grounds.

  - Also misuses "calibration" maybe: they think calibration means "the model is well-calibrated
  overall (marginal)" which is compatible with everything; the theorem requires calibration
  *within groups*.


