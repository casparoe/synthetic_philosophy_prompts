  I teach a unit on the politics of naming atrocities and I want to use Hotel Rwanda
  in a session that is not just a morality play. Set-up for the reading: when Lemkin
  coined the term and the eventual Genocide Convention fixed its definition, the word
  was asked to do at least three separable jobs, and almost every argument about naming
  is really a fight about which job matters. (1) Legal trigger: applying the name
  activates a distinct legal regime — the duty to prevent and punish, owed to all,
  that does not attach to crimes against humanity or war crimes in the same way. (2)
  Intent-claim: it asserts that the killing is aimed at the destruction of a group
  as such, with the special intent the definition requires, rather than being a byproduct
  of counterinsurgency, revenge, land hunger or the chaos of a collapsed army; and
  it asserts this about a group from a list that, as I understand it, covers national,
  ethnical, racial and religious groups and pointedly omits political ones. (3) Ranking:
  it makes an expressive, superlative claim — this is the worst thing — which is what
  gives the word its mobilizing force but also, critics say, demotes every atrocity
  it is withheld from.


  My seminar''s proposal: keep job (1) tied to the legal name and invent a separate,
  deliberately flat descriptive category for job (2) — call it, say, ascriptive mass
  killing, meaning violence directed at people under some group-description, with
  no implication of a superlative — and let job (3) go. The obvious objection, and
  the one I want tested against the film, is that the word''s power to force action
  seems to ride on job (3), so a flat vocabulary might be accurate and useless.


  Read the film through that dispute. Three scenes, in particular: the exchange with
  the Western journalist about the footage (his point that people will see it, say
  how terrible, and go on eating dinner); whatever the film actually does with the
  UN officer and the mandate — my memory is that the word is treated as something
  the peacekeepers must not use because using it triggers obligations; and Paul''s
  own dealings in the hotel, which run on bribes, phone calls and personal credit
  rather than on any vocabulary of atrocity at all. Do these scenes support the split,
  or do they suggest that the film''s problem is not naming but salience, and that
  a non-ranking term would fail harder, not better?


  Then the harder half: where does the film resist the reading? My worry is that the
  film is itself a naming machine — it needs its audience to supply the word and the
  shudder that goes with it, and its emotional architecture depends on exactly the
  hierarchy my seminar wants to dissolve. Is that a failure of nerve, or does the
  film know it and make something of it? Name the scenes you would put on the handout,
  describe them rather than quoting (I have no way to check a transcript), and don''t
  give me a bibliography: I want the reading, not the scholarship. Close with one
  sentence on what the film contributes to this debate that the seminar''s argument
  by itself does not.


