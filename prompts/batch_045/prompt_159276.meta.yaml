  Para 2: The ask. Design a pair of ordinary cases: A (parity) and B (tie), differing
  in exactly one respect, such that:

  - both choices are hard to make in the ordinary sense (agonizing),

  - in A, the three views give three different verdicts (comparabilist: tie/equal;
  incomparabilist: incomparable; parity: on a par),

  - in B, all three collapse onto the same verdict (equal),

  - the difference between A and B must be generated from the values/features in the
  case, not stipulated by saying "suppose they''re on a par."

  - one respect only differs — say what it is.

  - and there must be a practical, downstream difference between A and B — something
  rationally different that the agent may or should do (how long to deliberate, whether
  coin-flipping is fine, whether commitment/regret/making a decision for a reason
  is apt, what the agent may say afterwards). My hypothesis is that it shows up after
  the choice; if that''s wrong, say where it shows up.


