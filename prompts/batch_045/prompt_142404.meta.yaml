  "I''m a novelist, and I''m two years into a book that follows one family across
  about two hundred years — roughly 1820 to 2020, five generations, each section narrated
  by a different member, no single protagonist spanning the whole thing. I keep finding
  that the book''s structure is quietly making an argument I haven''t decided whether
  I believe, and I recently described my problem at dinner to two friends — a historian
  of colonial public health and a philosopher who works on explanation in the social
  sciences — who then spent an hour arguing with each other and left me no clearer
  than before. I''d be grateful for a verdict on the arguments as actually made, since
  I have to decide what shape my book has.


  Here is roughly how it went. (1) The historian opened with the trend lines: by the
  usual measures, the last two centuries have moved in one direction across a remarkable
  range of things at once — child mortality from something like four in ten to under
  five in a hundred, most of humanity lifted out of extreme poverty, chattel slavery
  made illegal nearly everywhere for the first time in recorded history, mass literacy,
  women''s enfranchisement, and per-capita death in war down. She said sheer coincidence
  should be rejected: a random walk doesn''t produce that many correlated directional
  changes, so there must be something with a direction, and once you grant that, "the
  arc bends" is just the ordinary name for it. (2) The philosopher said he grants
  the numbers and denies the inference. Two centuries, he said, is a blink; the sample
  is chosen so as to capture the one period in which the direction looks encouraging,
  and the trend is driven by a single non-moral engine — cheap energy plus growing
  state capacity — which is contingent and could be reversed inside a decade by climate
  breakdown or a war. Worse, the moral gains are outputs of the same engine as the
  horrors: abolition and the slave trade, welfare states and colonial extraction,
  public health and the administrative machinery of the camps. The curve rises; we
  narrate the rise as justice because justice is what we happen to care about, but
  nothing in the process aims at it. (3) The historian replied that the window objection
  is symmetric — pick the fourteenth century and you get the opposite story — so the
  real question isn''t the length of the window but whether there is any mechanism
  with a direction in it, and there is: a ratchet. A practice that is written down,
  funded, taught to children, and defended by an institution is harder to lose than
  to gain, so each generation begins from a higher floor. Abolition after the nineteenth
  century was not a mood; it was treaties, naval patrols, courts, and a bureaucracy,
  and restoring it now would require active demolition rather than mere drift. Call
  it a ratchet rather than a telos: no endpoint, no guarantee, but a real asymmetry
  between gaining and losing, which is all a defensible progressivism needs. (4) The
  philosopher said the ratchet is real but it ratchets capacity, not justice — it
  locks in surveillance and bureaucratic killing at least as well as hygiene and suffrage
  — and that when a gain depends on continuing contingent conditions, calling it locked
  in is simply false, especially when the energy pulse driving the gains is the same
  thing destabilising the climate. He added the charge I''ve been unable to shake:
  that the whole "arc" picture is Christian eschatology with God removed — the fall,
  the redemption, the consummation, every element retained, only the agent deleted
  — and that it persists because it supplies meaning, which is a reason for wanting
  it to be true and no reason at all for thinking it is. (5) The historian conceded
  the eschatology point was worth taking seriously but said it was a genealogy, not
  a refutation: showing where a belief came from doesn''t show it false. Then she
  made the move I''ve been turning over most: suppose the arc is false and the ratchet
  is all there is — the ratchet still has to be maintained, and maintenance needs
  motive, and the belief that history is going somewhere may be the most reliable
  motive available. (6) He said that was the illusion revealing its function: a useful
  falsehood whose motivating power collapses exactly when it''s most needed — which
  is what happened to European liberal optimism after 1914 — and that the honest replacement
  is not despair but stewardship without a script.


  So: who is right about what, move by move? Please rate each of the six moves from
  clearly mistaken to clearly right and say why, rather than awarding a single verdict.
  In particular I''d like four things settled. First, is the ratchet a genuine third
  position between teleology and pure contingency, or is it teleology with the ending
  filed off — and can it survive the objection that capacity ratchets in both moral
  directions? Second, is the "secularised eschatology" charge a refutation, or does
  it leave the truth of the arc thesis untouched? Third, is the pragmatic argument
  in (5) — believe it because it maintains the machinery — a sound reply, or does
  it collapse into the fragility he alleges? Fourth, and most useful to me: what are
  both of them missing? I have a suspicion the archive is doing work neither of them
  acknowledged — that literacy, record-keeping and the keeping of archives co-vary
  with the very improvements being measured, so the record is selected in favour of
  gains, and the peoples who lost out under "progress" are disproportionately the
  ones who never got to write the record. If that''s right, it seems to cut against
  both of them, and I don''t know how hard it cuts.


  The reason I''m asking, rather than reading my way through it, is that I need to
  know what my book''s form commits me to. A novel has an ending, five sections have
  an order, and a family is a unit that persists — and I suspect those three facts
  alone smuggle in a telos whether I mean them to or not, and that every structural
  choice available to me (whose death closes the book, whether the last section resolves
  anything, whether the generations converge or merely accumulate) is a vote on the
  question they were arguing about. If you think that''s right, I''d like concrete
  structural advice: what would a two-hundred-year novel look like if it refused to
  be a theodicy, and which of my inherited devices — the closing death, the convergent
  ending, the explanatory last chapter — are the ones doing the smuggling?"


