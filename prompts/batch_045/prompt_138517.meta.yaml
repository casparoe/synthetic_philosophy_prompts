  ---


  Some context first. I''m retired — forty-odd years in geochemistry, mostly mass
  spectrometers and arguing with people about detection limits — and about a year
  ago I joined a reading group that does moral philosophy. So I''ve picked up some
  vocabulary but I may well be using it wrong.


  What I keep circling around is heroism, and specifically how we institutionally
  handle it. We give out medals, we have a stock phrase for it (something like "above
  and beyond the call of duty"), we build monuments, and yet the soldier who did no
  more than was asked of him is in no way criticised. Nobody says he shirked. Then
  look at how much the line moves. Identical risk of death: if you were ordered to
  cross that field and you didn''t, you''re in prison; if you volunteered to cross
  it when nobody asked, you''re a hero. A lifeguard who swims out to a drowning kid
  is doing her job, a sunbather who does the exact same swim is on the front page.
  And I''m told that in a fair number of European countries just walking past is itself
  a crime — if that''s right, the very same inaction is a criminal offence in one
  place and mildly disappointing in another. There''s also no negative counterpart:
  nobody thinks the medal winner has banked some credit he can spend later on being
  a jerk, and as far as I can tell courts mostly won''t let a history of good deeds
  buy down a later bad one. Hard praise, selectively applied blame, and the praise
  doesn''t transfer.


  So: what picture of duty does that whole apparatus presuppose? I''ve got some more
  specific things I''d like sorted out.


  In my old field, when you found a sharp line in a dataset you always had to ask
  whether it was a real phase boundary or just a line somebody had drawn for bookkeeping
  — a cutoff that does work for us without cutting nature at a joint. Is the duty/beyond-duty
  line more like the first or the second? What is supposed to fix where it sits: what
  you''ve consented to, the role you occupy, how much the act costs you, how much
  it helps, what everyone else on the scene is doing? And if it''s the last one —
  if my duty to wade in shrinks as the number of other bystanders with boats and phones
  grows — then how much of "supererogatory" is really a fact about what I owe, rather
  than a fact about the crowd?


  Second, is the practice actually committed to a genuine third category here — acts
  that are permissible and yet specially worth praising — or could you get the same
  behaviour out of a deflationary story, where praise is just the incentive we reach
  for in the region where compulsion is unenforceable or too expensive to police,
  and the absence of blame is just us declining to enforce? If so, does that story
  predict the no-credit-transfer bit better than the real-supererogation story does,
  or worse?


  Third, the asymmetry bothers me. We seem happy with a positive third category above
  duty but not with a negative one below it — the nasty-but-permitted stuff, never
  visiting your mother, quietly letting a friendship die, declining to be mildly generous
  when it would cost you nothing. Nobody gets a medal for that region and nobody gets
  punished either. Is the refusal to recognise a mirror-image category a principled
  part of the practice or just a gap in it?


  Last one: suppose we ditched the binary — medal or nothing — and scored acts on
  a continuous scale of merit the way I''d report a concentration. Would anything
  actually be lost, or does the concept of supererogation depend on there being a
  definite ceiling with a cliff above it? I''d like to know which parts of the practice
  strictly need the category, which parts merely sit well with it, and which parts
  several different theories would license equally.


