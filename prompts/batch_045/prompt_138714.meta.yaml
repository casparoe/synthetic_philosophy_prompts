  is fixed at awakening, backward-dated. Actually Dennett''s position in "Are Dreams
  Experiences?" (1976): he argues dreams ARE experiences, and he proposes the "cassette
  theory" as an empirical hypothesis: the brain composes the dream at the moment of
  awakening and inserts it into memory as of an earlier time. He argues that on his
  view, the dream experience occurs at awakening (on the cassette theory) — i.e.,
  the composition process itself might be the experience. Dennett says it''s an empirical
  question; he used it to reply to Malcolm: Malcolm''s argument assumes that if dreams
  are experiences, the experiences must occur during sleep; but if the experience
  occurs at awakening (the composition of the cassette), then Malcolm''s conceptual
  argument fails. Yes — that''s Dennett''s move: "the mere possibility of the cassette
  theory shows that Malcolm''s conceptual argument is invalid."


