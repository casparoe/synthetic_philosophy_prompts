  Hi, I''m a philosophy PhD student (working mostly on explanation and counterfactuals
  in the historical sciences) and in three weeks I''m giving a 25 + 15 paper at a
  one-day workshop on big questions in global history. The audience will be maybe
  fifteen economic historians and global/global-economic historians — several of whom
  work on China and think the why Britain and not China question is perfectly respectable,
  just under-specified — plus three philosophers of history/science who are on my
  side temperamentally but will want the argument to be sharper, and one comparative-historical
  political scientist who''ll want to know what my view implies for how you actually
  design a comparison. My supervisor, who is a historian, is chairing and will ask
  the first question.


  My paper is on whether why Britain and not China? (the Needham-style question, and
  the broader Great Divergence framing) is even a well-posed contrastive question.
  I''m not taking the lazy line that it''s meaningless; my thesis is that as usually
  posed it bundles together at least three different explanatory demands — sustained
  per-capita growth, mechanised/coal-based industry, and the emergence of modern science
  — that have different candidate explanations and different spatial and temporal
  units, and that it also fails a test I want to propose, which I''m calling the partition
  test: a contrastive question why X rather than Y? is well posed only if the contrast
  survives re-partitioning the units on both sides, i.e. if you can''t make the contrast
  evaporate or reverse by redrawing X and Y into different sub-units (regions rather
  than polities, say) or by scaling up. I then spend the last five minutes offering
  a repair: turn it into a family of explicitly contrastive questions, each with a
  named outcome variable, a fixed unit, and a stated contrast class, and give up on
  the idea that there''s one thing to be explained. So the payoff I want is methodological,
