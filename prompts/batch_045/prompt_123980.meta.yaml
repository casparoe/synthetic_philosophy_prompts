  heads is 0.5 but the chance itself was produced by a chancy process (the classic
  undermining scenario where the chance of the chance being 0.5 is itself chancy).
  Lewis''s own treatment (the "undermining problem" for Humean chance).

  - Must respect admissibility: information that''s admissible vs inadmissible (you
  shouldn''t be able to update on the outcome itself; the "admissible evidence" clause).

  - Must be compatible with Bayesian conditionalization vs. the Humphreys/Levi issue:
  chances are not the sort of thing you can conditionalize on (chance is a "non-evidential"
  proposition, or the way the PP fails to be a conditional probability — "Humphreys''s
  paradox": PP is expressed as C(A|TXE) but you can''t always treat chance as a conditionalizer).

