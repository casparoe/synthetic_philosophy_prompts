  I have been trying to work out why the "combination problem" is standardly treated
  as a serious objection to panpsychism, rather than as a to-do list. As I understand
  the position: panpsychism denies that experience emerges from wholly non-experiential
  stuff, and instead holds that the microphysical relata of physics already have some
  minimal experiential nature, with macroscopic consciousness somehow composed out
  of these. The objection is that we have no account of the composition.


  What I find puzzling is why this is thought to be harder than composition anywhere
  else in nature. Mass and charge are additive; temperature, liquidity, rigidity,
  transparency and the like are macro-properties that are nothing over and above arrangements
  of microphysical parts and their relations. In those cases we do not think there
  is a special "combination problem"; we think there is a mechanistic or realization
  story to be told, and once chemistry and condensed-matter physics told it, the appearance
  of a mystery dissolved. So the panpsychist would seem to owe exactly the same kind
  of bridge story — a specification of which arrangements of micro-experiences realize
  which macro-experiences — and I do not see why we should assume in advance that
  this cannot be delivered, or why the current absence of such a story counts against
  panpsychism rather than against our patience.


  Two further thoughts push me the same way. First, if the macro-property is realized
  in the micro-arrangement, then the macro-fact seems to come for free: once the microexperiences
  and their relations are fixed, the macroexperience is fixed too, just as the liquidity
  of the water is fixed once its molecules and their circumstances are. Second, the
  objection looks dialectically unstable: the emergentist who presses it also owes
  an account of how experience arises from non-experience, and that looks like a strictly
  harder version of the same explanatory demand...


  So: what exactly is supposed to be distinctive about the combination problem? Is
