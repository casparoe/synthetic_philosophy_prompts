  ---


  I run a critique group for novelists — about 12 of us, two hours, back room of a
  pub, all of us at various stages of being sick of our own manuscripts. I want to
  do one session on that bit in Fear and Trembling about the teleological suspension
  of the ethical, but I don''t want to stand up front and lecture, and I don''t want
  anyone to hear the phrase until the last fifteen minutes. Design something we do
  instead — writing, role-play, a game with rules and small stakes, whatever you think
  survives contact with a room of tired adults who mostly write literary fiction —
  that lands them in the problem before it gets named.


  The thing I actually want them to feel, and this is where I need you to be precise,
  is the gap between two things that are easy to muddle. One: a character who does
  something plainly appalling for a reason the reader can be told late or never —
  Agamemnon, the fleet sails, the city is saved — and we can weep at the cost and
  still say whether he was right. Two: a character whose reason isn''t the sort of
  thing that could be handed over as information at all, so that from outside the
  act is just the act. If I remember right there''s something in the book about not
  being able to pick the faithful man out of a crowd, and that''s the nerve I want
  hit. Most of them will instinctively write version one with the reveal held back,
  and I want the exercise to make that move fail on them.


  So: a structure, minute by minute, the cards or prompts they get handed, any voting
  or betting (small real stakes are fine — everyone puts a page of their own prose
  in the hat), what the facilitator is allowed to say at each stage and what they
  have to bite their tongue about, and a debrief that maps the moments we actually
  had onto the parts of the idea.


  Three practical worries. Someone will turn it into a trolley problem — head that
  off in the rules rather than in the discussion. Two of them have read some philosophy
  and one will be insufferable about it; the other ten did none after school. And
  one of us lost a child three years ago, so I need a version of the setup that keeps
  the structure — an act wrong by every public standard, done for a reason the agent
  can''t make public, and the agent loves the one it wrecks — without being literally
  a father with a knife, plus an honest account of what goes soft when you swap the
  case out.


  Last thing, and it''s the part I care about most: tell me where the exercise can''t
  follow the idea. My sense is that it can make them feel the not-being-able-to-tell,
  which is the outsider''s vertigo, but not whatever it is that''s supposed to be
  going on inside the man, and I''d rather name that gap at the end than have them
  leave thinking they understood him. Also — what''s the first thing thatll go wrong
  when I run it.


