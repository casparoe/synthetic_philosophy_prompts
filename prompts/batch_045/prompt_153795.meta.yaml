  Title: "All truths are knowable" is a type error (or: what Fitch''s paradox looks
  like if you think in tests)


  1. The setup. There''s a claim that shows up in anti-realist sounding philosophy:
  truth isn''t some spooky relation to a mind-independent world; to be true is (roughly)
  to be verifiable in principle. Write it as: for any p, if p then it''s possible
  that p is known. (KP) p → ◇Kp.


  Fitch''s result: in any normal modal logic with a knowledge operator, KP proves
  the obviously false thing: for any p, if p then p *is* known. Equivalently (this
  is how Fitch stated it, as "Theorem 5"): if there is even one unknown truth, then
  there''s a truth that couldn''t possibly be known. So "in fact unknown" collapses
  into "necessarily unknowable," and the comfortable middle position between "truth
  = what God knows" and "truth = what we happen to know" disappears. Fun historical
  detail: the proof was apparently first sent to Fitch by an anonymous referee in
  the 40s and the referee turned out to be Alonzo Church.


  2. Why it works (as I understand it). Two assumptions do the work, and I think people
  undersell the second one:

  - Factivity: Kp → p. If you know it, it''s true.

  - Distribution over conjunction: K(p ∧ q) → Kp ∧ Kq. Knowing a conjunction means
  knowing each part.

  Assume p is a truth nobody knows, i.e. p ∧ ¬Kp. By KP, ◇K(p ∧ ¬Kp). But K(p ∧ ¬Kp)
  is impossible: it would give Kp (by distribution) and also ¬Kp (because K¬Kp, and
  knowledge is factive, so ¬Kp is true). Contradiction inside the diamond. So ¬◇K(p
  ∧ ¬Kp), so by KP, ¬(p ∧ ¬Kp). No unknown truths. Note: factivity alone doesn''t
  get you there — you need both. (This is the bit I''m least sure about.)


  3. My diagnosis: it''s self-application, not verification. The poison is that we''re
  allowed to *substitute a proposition that already talks about K* into KP, and then
  reason about it with the very same K. That''s diagonalization. So the natural fix
  is to index: K_T for "the procedure/test-suite/theory T verifies." Then the naive
  principle becomes: for every true p, there''s some *extension* T'' ⊇ T, still sound,
  with K_T''(p). And that''s trivial and harmless: if T can''t prove p, take T + p
  as axioms. Gödel tells you no single sound recursively axiomatized theory gets everything,
  but it says nothing against each truth being provable in some sound extension. And
  notice where Fitch breaks in this setting: from K_T''(p ∧ ¬K_T(p)) you get K_T''(p)
  and K_T''(¬K_T(p)) — but ¬K_T(p) is about T, not T'', so there''s no contradiction.
  The index moved. Which makes me think Fitch''s paradox is basically Gödel''s incompleteness
  in modal clothing: unindexed self-application, and the fix is a hierarchy that doesn''t
  collapse.


