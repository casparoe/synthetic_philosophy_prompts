  Setup: 200 people in a line, two options (A or B), exactly one is correct, each
  person gets one private hint that''s right more often than not (say 60%), each sees
  all earlier choices, everyone wants to be right.


  (1) Rational people treat other people''s behavior as evidence, because behavior
  was caused by what they knew.

  (2) If I can figure out the rule someone used, I can run it backwards and recover
  (at least partly) what they privately knew from what they did.

  (3) Evidence from separate people stacks up: enough public evidence in favor of
  A will beat whatever my own one hint says.

