  Good''s theorem nuances I can use in the prompt (as seed material the asker half-remembers):

  - The theorem: for an agent who updates by Bayes and maximizes expected utility,
  expected value of (free) information is non-negative. So "you can never be rationally
  worse off for having looked."

  - But: the guarantee is ex ante; ex post particular pieces of information can lower
  your actual utility. And it''s an average over possible messages.

  - Breakdowns: (a) the info is about a variable you can''t act on; (b) measuring
  a proxy that''s correlated but not identical — the agent then updates on the proxy
  as if it were the variable (i.e., violates the theorem''s assumption that you use
  the likelihood properly); (c) the agent''s decision rule after receiving info isn''t
  EU-maximizing (e.g., a committee that must act "on the evidence" in a specified
  way, or a boss who will overreact to a number); (d) info changes others'' behavior
  / strategic effects (value of info can be negative in games — e.g., knowing your
  hand in poker... actually in games, more info can hurt because of equilibrium effects
  / "the value of information can be negative in strategic settings" — Kamien, Tauman,
  Zang; also "ignorance can be a blessing" (Hirshleifer effect: better public information
  can destroy risk-sharing, Hirshleifer 1971)); (e) costs: measurement cost, delay
  cost, option value destroyed.


