  is luminous, S can know C in α0. For knowledge to be safe, there must be a margin:
  in nearby cases where C fails, S must not believe C. But because α0 and α1 are indistinguishable,
  whatever S is in a position to do in α0 (believe truly), S would do in α1. Since
  the margin can be made arbitrarily fine (each step imperceptible), C obtains in
  α0 ... hmm, actually the argument chooses: pick the last case αi where C obtains;
  C fails in αi+1; αi and αi+1 are indistinguishable; luminosity says in αi S is in
  a position to know C; but since αi+1 is indistinguishable, if S were in αi+1, S
