  ---


  For the past few months my reading group (which came out of the old LessWrong-adjacent
  scene, though we''ve drifted) has been using one analogy to settle all quantum-foundations
  arguments, and I''ve started to think it''s doing more work than it can bear. The
  analogy: the quantum state is just an agent''s probability distribution — the wavefunction
  is to a system what a bookie''s odds are to a horse race, or what a distribution
  over the unseen order of a shuffled deck is to the deck. Collapse is Bayesian conditioning;
  the double-slit pattern is just what you get when you don''t know which slit; and
  the measurement problem dissolves, because nobody thinks updating a spreadsheet
  is a physical process. The conclusion people draw from it is the one that matters
  to us: if the wavefunction is bookkeeping, then you don''t owe an answer to "what
  really happens," you don''t need many worlds or a collapse dynamics or a hidden-variable
  theory, and a whole cluster of decision-theoretic arguments that treat the branches
  as real (quantum suicide, anthropic reasoning about branch counts, the "many worlds
  means you should be indifferent to outcomes that happen in some branch" style of
  argument) lose their footing.


