  ---


  I have been reading the rationalist blog scene since roughly the mid-2000s, and
  my local reading group — same origin, now drifted toward more technical material
  — has converged on one analogy that it now uses to close out every argument about
  quantum foundations. I want it audited rather than endorsed or refuted, because
  I think it is carrying conclusions it cannot bear.


  The analogy: the quantum state is to a physical system what a probability distribution
  is to a shuffled deck — a summary of an agent''s uncertainty, not a description
  of a thing. The wavefunction is bookkeeping. Collapse is conditioning on a new observation,
  the double-slit pattern is what interference of ignorance looks like, and there
  is no measurement problem for the same reason there is no problem about how a spreadsheet
  changes when you type a number into it.


  The work it is made to do in our context is specific. First: if the state is bookkeeping,
  then the realist owes no story about what happens between preparation and measurement,
  and the choice between branching, collapse dynamics, and hidden variables becomes
  a choice of notation. Second, and this is the part people actually care about: a
  family of arguments that treat the branches as populated and count them — quantum
  suicide and immortality reasoning, anthropic probability over branches, indifference
  to outcomes that occur in only some branches, the decision-theoretic case for caring
  about measure rather than existence — lose their footing, because you cannot do
  anthropics over a bookkeeping device. Our group has been using the analogy to dismiss
  that whole family as a category error, and I want to know whether the dismissal
  is earned.


  Please do the following. Give the mapping explicitly, as a table of correspondences:
  what plays the role of the agent, of the unknown, of the sample space, of the prior,
  of the likelihood, of the observation, of the update. Then separate the disanalogies
  that matter for the two uses above from the ones that are merely decorative. These
  are the ones I keep going back and forth on, and I would rather have them adjudicated
  than listed:


  - Monogamy. My uncertainty about a deck can be shared: I can tell ten people everything
  I know and they will all be as uncertain as I am. Entanglement cannot be shared
  that way — maximal correlation with one system forecloses maximal correlation with
  another. Does that mark a difference between belief-states and quantum states, or
  does it only mark a difference between beliefs about classical correlations and
  beliefs about quantum ones?

  - Cloning. A probability distribution is copyable without limit; an unknown pure
  state is not. Which premise of the analogy does no-cloning break?

  - Phase. A distribution over hidden states has no room for relative phase, and the
  interference that phase produces is the entire explanatory payload of the two-slit
  experiment. Is the analogy quietly importing a sample space it is not entitled to?

  - Multiplicity of agents. Two agents who condition on different evidence get different
  distributions over the same deck, and we know how to merge them. Wigner and his
  friend assign different states to the same system and, on at least some readings,
  there is no fact of the matter that reconciles them. Does the analogy survive, or
  does surviving require it to become a different view — relational or perspectival
  — that no longer licenses the conclusion?

  - Where the thing lives. The state of N particles is a function on a 3N-dimensional
