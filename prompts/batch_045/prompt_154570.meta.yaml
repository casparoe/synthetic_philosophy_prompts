  Argument sketch (my invention, with a subtle flaw):

  (1) A rational agent should act on the basis of its own reasoning only if it trusts
  that reasoning — i.e., only if it is willing to treat "I have derived p" as a reason
  to believe p (the reflection/schema □p → p, at least for the sentences that figure
  in deliberation).

  (2) Löb''s theorem: any formal system at least as strong as Peano arithmetic that
  can prove □p → p for a sentence p already proves p; so a system cannot adopt □p
  → p as a general policy without becoming trivial (proving every p, hence every falsehood).

  (3) The sentences that figure in an agent''s deliberation are the "action-consequence"
  sentences: "if I do a, outcome u". So the self-trust needed in deliberation is a
  general policy over exactly these sentences.

  (4) Hence no agent whose reasoning is arithmetically-capable can trust its own deliberation:
  any such agent that trusts itself proves arbitrary false action-consequences and
  is thereby worse than useless.

  (5) The same holds for trusting a successor/copy that uses a system at least as
  strong: to trust it, the parent must prove its soundness, which by Gödel requires
  a stronger system; so each generation must be weaker — infinite regress/decay.

  (6) But (4) and (5) also apply to any agent that trusts any process: memory, perception,
  a calculator, a proof checker it built — trust in any of these is just another instance
  of the same schema.

  (7) So no arithmetically capable agent can trust anything at all, and no machine
  reasoning about its own outputs can ever be relied on — which is absurd, since proof
  checkers and verified software exist and work.


