  theory T: the agent considers candidate actions a, and tries to derive sentences
  of form C(a,u): "if I perform a, my expected utility is u". It then performs the
  a with the best derived u.

  (2) Deriving C(a,u) is useless to the agent unless the agent is prepared to move
  from "T proves C(a,u)" to "C(a,u)": that is just what it is to rely on one''s own
  deliberation. Call this requirement (Trust): for the sentences that figure in deliberation,
  the agent must in effect treat □p → p as available.

  (3) By Löb''s theorem, no such T can make (Trust) available for all the sentences
  that figure in deliberation — for the action-consequence sentences include arbitrarily
  strong claims ("a yields 10^100 utils"), and if (Trust) were available for all of
  them T would prove all of them and be trivial. (This is the Löbian obstacle.)

  (4) Nothing in (1)–(3) turns on the sentences being about the agent''s own actions.
  What makes the obstacle bite is that the agent''s reason for relying on a derivation
  is that it is *its own* derivation; the schema □p → p is just the formalisation
  of "reliance on one''s own reasoning". So the obstacle generalises: any process
  whose outputs the agent relies on because the outputs are its own (its memory, its
  perceptual system, a proof-checker it runs, the successor agent it builds) is subject
  to the same collapse.

  (5) Hence no arithmetically capable agent can trust its own memory, its own perception,
  its own proof checker, or the successor it builds — indeed, no such agent can trust
  anything produced by any process it runs itself.

  (6) But verified proof checkers, self-verifying compilers and memory-checked systems
  exist and are routinely relied upon; we rely on our own reasoning all the time,
  and we don''t take ourselves to be thereby committed to contradiction. So (5) is
  absurd.

  (7) Therefore the Löbian obstacle is not really an obstacle: something in (1)–(4)
  is wrong.


