  to "for all sentences of the relevant kind" — Löb''s collapse requires the schema
  be available for the specific sentence being diagonalised; a system can consistently
  prove □p → p for a restricted, decidable class of p (e.g., where p is decidable
  or where the agent can prove p outright: if T ⊢ p then T ⊢ □p → p trivially). So
  restricted/partial self-trust is consistent; what''s blocked is uniform reflection.
  Also bounded versions: □_k p → p (proofs of length ≤ k) are consistent.

