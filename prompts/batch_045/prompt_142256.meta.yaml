  I''ve been reading moral philosophy on the side for about fifteen years, mostly
  in the orbit of rationalist blogs and forums, and the view I now find myself holding
  about nonhuman animals started as a footnote. It begins with the thought Nozick
  sketches briefly in Anarchy, State and Utopia — that persons are governed by side
  constraints while animals fall inside a maximizing calculus, the slogan being something
  like Kantianism for people and utilitarianism for animals — but I hold a more specific
  version of it than anything I can find in the text, and I want it stress-tested
  rather than defended.


  My version: what does the moral work is not rationality, or language, or species
  membership, or the capacity to suffer, but diachronic self-governance — the capacity
  to hold some conception of how one''s own life is to go over time and to regulate
  a present impulse by that conception. Call it the T-view. Beings that have it are
  not to be sacrificed, traded off, or created-and-destroyed for aggregate benefit:
  they are the objects of constraints. Beings that lack it still count, and count
  directly — their suffering and enjoyment go into the calculus at whatever their
  real weight is, and I take it as a substantive commitment of my view that this weight
  is not discounted merely because of the kind of thing doing the suffering. Both
  halves matter to me: the threshold, and the refusal to discount below it.


