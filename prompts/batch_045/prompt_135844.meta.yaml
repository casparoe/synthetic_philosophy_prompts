  I am a professor of philosophy and, for the last two years, the chair of this university''s
  Committee on Commemoration and Historical Context. The committee hears petitions
  about what the campus physically and pedagogically honors: named buildings, named
  professorships and lecture series, portraits in the faculty club, and passages in
  the common curriculum that petitioners want removed, recontextualized, or annotated.
  We meet monthly and process twenty to thirty items a year. Our recommendations are
  public, they go to the president, they are read by alumni trustees and by the students
  who filed the petition, and they are regularly leaked to the student paper. We decide
  from a dossier: the petition, the response from the unit that owns the item, and
  whatever a general-purpose reference work tells us. We have no research budget,
  no outside consultants, and no time for archival work. Every decision has to be
  reached in one meeting and defended in two paragraphs of plain prose.


  What we lack is a procedure. ... etc.


