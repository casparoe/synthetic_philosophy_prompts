  Title: "Discarded for what? Error-accounting, reference classes, and the pessimistic
  meta-induction"


  §1 The argument I want to answer. The PMI: most of the theories that were predictively
  successful in the past turned out to be false in their central, unobservable claims;
  our current theories are not relevantly different from those; so probably our current
  theories are false in their central unobservable claims too. The standard inventories
  of abandoned-but-successful theories do the work.


  §2 First move: the PMI needs a base rate, and base rates need a reference class.
  Three candidate classes:

  (A) all theoretical posits ever proposed;

  (B) posits belonging to theories that achieved predictive success;

  (C) posits belonging to theories that achieved predictive success *and* whose load-bearing
  role in producing those predictions was preserved by the successor theory.

  (A) is useless — it''s dominated by speculative posits and the base rate of discard
  is essentially 1 for reasons having nothing to do with unobservability. (B) is the
  class the PMI actually uses. I want to argue (C) is the right one, and that the
  discard rate in (C) is much lower.


