  I want an implicit-theory reconstruction, not a literature survey or citations:
  I can''t follow up on references, so argue the position rather than pointing at
  who holds it.


  Here are three features of existing practice, as I understand them — correct me
  if I''ve got any of them wrong:


  (a) In Anglo-American law falsity is an element and truth is a defense. A statement
  that turns out true cannot be defamatory, fraudulent, or perjurious, however reckless
  the speaker was about whether it was true. A witness who swears to something that
  is in fact true, while believing it false and intending to deceive the court, commits
  no perjury; a defendant who guesses wildly and happens to guess right has committed
  no fraud.


  (b) Yet culpability tracks the speaker''s epistemic position. Defamation liability
  and damages turn on negligence or actual malice; fraud requires knowledge or reckless
  disregard; perjury requires asserting what one does not believe to be true. So the
  scrupulous speaker of a falsehood and the irresponsible speaker of a falsehood are
  treated very differently, and the irresponsible speaker of a truth is treated as
  having done nothing at all.


  (c) Research-integrity proceedings run the other way. Fabrication and falsification
  are sanctionable whether or not the claim they were used to support is true — even
  if independent work later confirms it — while honest error is not misconduct however
  false and damaging the published claim turns out to be.


  The law seems to make the wrong a matter of what is said; the integrity code seems
  to make it a matter of how the speaker came to say it. What norm of assertion does
  each practice presuppose — truth, belief, knowledge, reasonable belief? Is the legal
  pattern one coherent norm or a hybrid that just looks coherent? Does the knowledge
  norm predict that the law is wrong in both directions at once (the reckless truth-teller
  goes free, the scrupulous falsity-teller is exposed to liability), and if so is
  that a reductio of the knowledge norm or of the practice?


