  I sit on the programme committee of a small foundation — call it the Hallowell Fund
  — with roughly £1.2m to disburse over three years on conceptual, non-empirical work
  on the self: what persons are, what it is to have a first-personal point of view
  over time, and what we owe to ourselves (or to others) in the way of shaping our
  own self-conception. The trustees have constrained the end: every funded project
  must plausibly feed into one of two downstream uses. The first is clinical and legal
  practice around disturbance or loss of selfhood — advanced dementia, severe dissociation,
  gender transition, brain injury — where practitioners and judges talk about a person''s
  story, identity or true self in ways that strike philosophers as both load-bearing
  and slippery. The second is adjudicating claims about artificial systems: whether
  a system with long-term memory, stable goals, a persistent public-facing persona
  and the capacity to give an account of its own history could come to have something
  like a self, and whether that would make it the kind of thing to which narrative-integrity-based
  duties could be owed. My starting image — and the one several trustees like — is
  Dennett''s: the self is not an inner item but something like a centre of gravity,
  an abstract focal point around which a creature''s memories, self-told stories,
  projects and excuses organise, which does a great deal of explanatory work without
  being an extra thing in the world.


  Here is roughly where my own thinking has got to, so you can push against it rather
  than start from nowhere. I keep coming back to four or so clusters, and I can''t
  tell which are worth years of someone''s career. (a) Diaristic versus narrative
  selfhood: much of the literature assumes that what constitutes a self over time
  is story-shaped recollection, but a great deal of ordinary self-tracking is dated,
  unshaped, recorded rather than recounted — a lifelog, a calendar, a medical file.
  Is a self constituted by records rather than by narrative still a self in the relevant
  sense, and does the centre-of-gravity image survive if the gravity is exerted by
  an archive rather than by a telling? (b) Externally located centres: if the records,
  reputations and narratives that fix who someone is increasingly live outside that
  person — in other people''s memories, in institutional files, in model training
  data — then a person''s ''centre of gravity'' may be partly located outside them,
  and I want to know whether that is a coherent extension of the image or a reductio
  of it, and whether an institution or a firm can literally have a centre of narrative
  gravity at all. (c) Narrative inertia: the resistance of an existing self-story
  to revision, which looks like a vice when it entrenches self-deception and like
  a constitutive condition of agency when without it nothing a person does hangs together;
  is there a principled line between healthy and pathological inertia, and is that
  line the one clinicians actually need? (d) Plural or contested centres: fragmentation,
  ambivalence, the experience of having several incommensurable stories about oneself
  — does the metaphor tolerate several centres, or does it quietly presuppose uniqueness,
  and if it presupposes uniqueness is that a discovery or a defect? There are also
  questions I suspect are more upstream or more tractable than they look — whether
  narrative self-constitution is best read as a descriptive claim about what we in
