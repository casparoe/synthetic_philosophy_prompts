  Should I verify Harsanyi basics by search? The domain is well-known to me: aggregation
  theorem = if (i) social welfare function is linear in individual von Neumann–Morgenstern
  utilities (or: social preference satisfies expected utility axioms and individual
  preferences satisfy them), and (ii) Pareto indifference/unanimity (if everyone is
  indifferent, society is indifferent), then social welfare = weighted sum of individual
  utilities (up to positive affine transformations). The 1955 version uses the "impartial
  observer" / equiprobability assumption: social welfare is the expected utility of
  an observer who assigns equal probability to being each person. Then the weights
  come from interpersonal comparisons of unit utility. Key misconceptions:

  1. "Harsanyi proved utilitarianism" — it''s a conditional/axiomatization; the weights
  are arbitrary; no claim about total vs average; it doesn''t give equal weights;
  it doesn''t settle the population question; it presupposes individuals'' VNM utility
  functions are already interpersonally comparable (unit comparable), which is the
  substantive ethical assumption.

  2. Confusing Pareto indifference (weak) with strong Pareto.

  3. Confusing the theorem with the result that "any reasonable social welfare function
  must be a sum" — no, the linearity/expected utility assumption is doing the heavy
  lifting; an alternative is to give up expected utility for social prospects (Diamond''s
  ex post vs ex ante Pareto; Sen; and "ex post prioritarianism" / Adler''s "ex post"
  view; and the "posterior" vs "prior" — the point that Harsanyi''s theorem requires
  the social planner to satisfy the EU axioms over lotteries with known probabilities,
  which the ex post view rejects).

  4. The "weights aren''t 1" point and the confusion that weights reflect "how much
  we care" vs unit comparability scaling: since VNM utilities are only defined up
  to positive affine transformation, scaling an individual''s utility function changes
  their weight — so "weights" have no meaning independently of the unit convention.
  That''s a great "gotcha" misconception: students think weights = moral importance,
  but with positive affine freedom only, weights and units are entangled.

  5. That it requires risk-neutral social attitude: the social planner''s EU implies
  social indifference to (expected) inequality in ex ante terms; the theorem rules
  out "nonlinear" (concave) functions of the sum — i.e., prioritarianism of the concave-transformation
  kind violates VNM expected utility for the social planner. That''s Harsanyi''s argument
  against "nonlinear social welfare functions."


