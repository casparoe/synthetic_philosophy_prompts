  I am trying to work out what I actually believe about reparations for historical
  injustice, and my verdicts on particular cases do not seem to line up with one another.
  I would be grateful for help extracting a principle from them — or, if no single
  principle will do, for a small set of candidates and an honest account of what each
  of them forces me to give up.


  The cases below are invented composites, not real claims. In each one assume that
  the wrong is real and well documented, that it was a serious wrong by any standard,
  and that it would ground a claim for compensation if the original parties were still
  alive and the clock had been stopped.


  1. Traceable gain. In 1860 a colonial government seizes a fertile valley from a
  farming community and transfers title to a chartered company. The company''s successor
  still holds the land; the community''s descendants are identifiable, poorer than
  the national average, and include people who were displaced as children. — Reparation
  is owed, to the descendants, from the current holder; this is the easy case.


  2. Dissipated gain. The same seizure, except that the valley turns out to be worthless,
  the company abandons it and collapses in 1890, and nothing of value passes to anyone.
  The descendants are still disadvantaged by comparison with the national average.
  — Something is owed, and I am not sure it should be less than in case 1, even though
  no one is now enriched. I do not know what the payment is for.


  3. Legality at the time. The seizure was authorised by statute and approved by most
  of the enfranchised population; everyone involved knew it would never be reversed.
  — Owed, in no smaller measure than in case 1. I reject this defence outright.


  4. Living victim. A state imprisons an innocent person for twelve years, knowing
  the evidence was fabricated. — Owed; and I take this to be the paradigm case that
  the others must be shown to resemble.


  5. Unwanted benefits. ... perpetrator built roads, schools and hospitals in the
  region, and the descendants'' living standards are higher than they would have been
  had the wrong never happened. — I do not think this reduces what is owed at all;
  the "we gave you roads" offset strikes me as an evasion.


  6. Accepted part-payment. In 1900 the same state pays a compensation package, accepted
  by the victims'' leaders in good faith, worth about a third of what we would now
  judge adequate. — I think this genuinely reduces the debt, and may discharge it.


  7. Overlapping descent. The wrongdoing state''s population has turned over; nine
  in ten of its current citizens descend from people who arrived after the wrong,
  as refugees the state later admitted, and roughly half the claimants also descend
  from the perpetrators. — I do not think the newcomers owe anything personally. But
  I also think the state owes reparation out of general taxation, which is to say
  out of their pockets. I cannot make these two verdicts consistent.


  8. Existential precondition. Had the wrong never occurred, almost none of the people
  now claiming would have been born — it changed who met, married and migrated. —
  Not a bar to a claim, but I want to know why it is not a bar, since it seems to
  show that no one involved was made worse off than they would otherwise have been.


  9. Dead culture, no demand. The wrong destroyed a language and a set of religious
  practices; the descendants are now glad their children speak the majority language
  and do not want the practices revived. — Something is owed, but restoration is unavailable
  and unwanted, and I do not know what shape the payment should take.


  10. The one I go back and forth on. A wrong committed two centuries ago by a private
  corporation whose shareholders cannot be traced; the wrong is over, but its effects
  are locked into a still-operative constitutional clause that continues to advantage
  one group. Sometimes I think the state must act because it now enforces the clause;
  sometimes I think the chain has gone cold and nothing is owed.


  My tentative principle, which I suspect is inadequate: a historical wrong generates
  a debt held by the transgenerational political community that committed it and owed
  to the community that suffered it; the debt does not lapse with time; its magnitude
  is the loss the wrong explains, net of benefits the victims received because of
  the wrong; and it is discharged by payment to the victim community''s legitimate
  representatives. As far as I can tell this gets case 5 wrong and leaves cases 2,
  7 and 9 unexplained.


  What I would like:


  - One or two candidate principles, stated precisely enough that they yield verdicts
  rather than gestures. (If the right answer is a disjunctive or two-level account
