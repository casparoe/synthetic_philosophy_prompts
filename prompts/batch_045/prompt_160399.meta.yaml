  pair: logrolling (vote trading) vs. splitting the difference on a single bill —
  both are "concede on X to gain on Y," yet people treat them differently. Or: compromising
  where you pay the cost yourself (your own conduct) vs. compromising where a third
  party bears the cost (conscientious objection referral where the patient travels
  further).


