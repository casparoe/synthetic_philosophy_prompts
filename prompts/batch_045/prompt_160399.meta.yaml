  Let me think about good cases in moral compromise / gains from trade:


  Classic structure: two parties with different values, each can''t get what they
  most want alone, but by each partially conceding they both do better on their own
  lights than by deadlock. E.g., a compromise where each side gets less of what it
  wants but the package is better by each side''s own ranking than the status quo
  or than fighting.


  Cases:

  1. Two legislators: one wants a big climate bill with carbon tax, other wants nothing.
  Compromise: half-strength bill. Both prefer compromise to nothing. Fine.

  2. Abortion-ish / conscientious objection: hospital with two departments, one doctor
  refuses to provide a legal procedure, compromise: the hospital provides it but that
  doctor doesn''t have to. Some say fine (accommodation), others say no (the patient
  bears the cost).

  3. Compromise where the concession isn''t a smaller amount of the same good but
  doing something the compromiser thinks is positively wrong: e.g., a pacifist voting
  for a budget that funds a war they think unjust, in exchange for famine relief that
  saves more lives. Or: a vegetarian chef agreeing to cook meat.

  4. Compromise where the other side''s value is one you think is evil: e.g., splitting
  the difference with racists — halfway to a policy you think is gravely unjust.

  5. Compromise as a way of pooling risk/uncertainty: each side unsure who''s right,
  so they agree to a mixed policy — betting/hedging rather than splitting.

  6. Compromise where the gains come from the compromise itself: e.g., agreement to
  disagree, live-and-let-live toleration — both sides gain peace/legitimacy.

  7. Dirty hands: lying to a murderer at the door — no, that''s different.

  8. Compromise with future generations / across time.

  9. Compromise where the parties aren''t symmetric in power: a compromise between
  a slaveholder and... no, too charged.

  10. Compromise in a jury: jurors vote to convict on a lesser charge.

  11. Split-the-difference on a number when the numbers come from different frameworks:
  e.g., setting a discount rate for climate policy where one side uses a near-zero
  pure rate of time preference and the other uses market rates. Splitting the difference
  feels arbitrary/incoherent — "compromise between value systems" where the midpoint
  is not a value anyone holds.

  12. Compromise between two scientific/medical frameworks: e.g., a hospital allocating
  scarce ICU beds, one side prioritizes saving most lives, other prioritizes the worst
  off / youngest; compromise: a lottery weighted.

  13. Moral compromise where you come to condone something you think is wrong because
  you see it from inside — "moral residue."

  14. Case: currency — trading votes across issues: I vote for your thing if you vote
  for mine (logrolling), where I think your thing is bad. Vote trading feels worse
  than splitting a single bill, even though both are "gains from trade."

  15. Case: a treaty where both sides agree to suppress speech they respectively dislike;
  mutual censorship pact.


  The key tension: cases where compromise is fine versus cases where it feels like
