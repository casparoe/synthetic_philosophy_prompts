  Jokes from getting IRL right:

  - Degeneracy: infinitely many reward functions explain the same behavior; the report
  resolves it by an arbitrary convention (maximum-entropy / minimum-norm / linear-in-features
  prior) and then reports the resulting weights as discoveries. "We assumed your uncle
  was a Boltzmann-rational agent with temperature τ = 0.31. Under this assumption..."

  - The report cannot distinguish a large reward with high noise from a small reward
  with low noise.

  - It cannot distinguish reward from value: it reports "you place 0.02 utility on
  flossing" when actually flossing is instrumentally valuable — the model conflating
  the reward function with the value function. Great joke: "Reward weights are reported
  net of the value function; no further discounting is required."

  - It cannot see rewards for things that were never available: the absence of options
  in the observed environment means zero weight on them ("your uncle placed no value
  on grandchildren, as no grandmother-option appeared in the logged trajectory").

  - The discount factor fitted from data is reported as a character trait ("you discount
  the future at 11% per annum — a trait we describe as prudent").

  - Confounding by the platform''s own recommendation policy: "preferences were inferred
  from choices among options we presented; the presentation policy is proprietary."

  - Distribution shift: the inferred reward is valid only in the environment (the
  app) where it was fit.

  - Exploration: it models his occasional weird choices as exploration noise (ε-greedy),
  so genuine novelty-seeking gets absorbed into the noise term.

  - A constant added to the reward function is unidentifiable — the report says "we
  have fixed the arbitrary additive constant at zero; this has no effect on any behavior
  we can observe but does affect the reported ''joy'' figures." Nice joke: the units
  of utility are meaningless.

  - Model misspecification / the "reward is not the thing you want" point.

  - IRL from a *finite* trajectory with partial observability.

  - The "one human, one reward function" assumption: the person is modeled as a single
  consistent agent; the report flags "temporal inconsistency" as a data-quality issue
  rather than a fact about the person.

  - Treating the fitted parameters as evidence of intent in a legal setting: "This
  document is not a will."


  Also: "The report should be funny to someone who works on preference inference and
  legible to a smart relative."


