  £20 if you *want* to hear the piece again. Here the incentive (arguably) can work
  — desires can be acquired for pragmatic reasons, or at least "wanting to want" is
  less blocked. Actually, the interesting philosophical point: for desires, the pragmatic
  reason seems to be a reason of the *right kind* — the fact that wanting it would
  get you £20 is (arguably) a reason for wanting it, i.e., desires have no "wrong
  kind" problem in the same way. So the asymmetry between belief/admiration and desire
  is the thing they should feel: the same incentive that is a "wrong-kind reason"
  relative to admiration seems to be a perfectly good reason relative to desire (or
