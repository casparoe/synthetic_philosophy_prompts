  Structure:

  - Para 1: Setting & persona: I teach a 3rd-year seminar "Value, Reasons and the
  Attitudes", 14 students, 90 minutes, projector + speakers, no budget. Next session
  is on the fitting-attitude analysis of value and the wrong-kind-of-reasons objection.
  I don''t want to lecture; I want them to run into it. Recount a bit: last year I
  ran a straight thought experiment (the demon/patron who pays you to admire him)
  and it fell flat — students said "well obviously you can''t just decide to admire
  someone, so the case tells us nothing" — i.e., they defused it via the "no reasons
  for attitudes / can''t believe at will" response. So the activity has to be built
  so that this escape route is closed or at least made costly: they must *try* and
  record what happens.

  - Para 2: The ask: design a runnable activity: rounds, materials, payoff scheme
  (no real money), timeline, and the debrief. Include: (i) the admiration case with
  an incentive; (ii) a matched case with a different attitude (desire, or intention,
  or hope) where the incentive seems to work differently; (iii) a "wanting-to-admire"
  case; (iv) the movability ladder (rank attitudes by incentive-movability and test
  predictions); (v) the final vote "is the object better now?" (included because the
  FA analysis is on the table). Also ask: how the rules should be rigged so that the
  tempting escape ("you just can''t choose attitudes, so the case is empty") is neutralised
  rather than allowed — e.g., by separating "report", "self-prediction", and "honest
  rating" ... Hmm, actually the facilitator should not shut it down but make it *cost*
  something: e.g., require them to write down both a rating and a wager on their own
  future rating, and to predict the class distribution. Then the "you can''t choose"
  reply is revealed to be incomplete: the reward tracks the rating, and the rating
  is what they have to produce; the discomfort is real. Also: I should ask them to
  design a "private ballot" so there''s no social pressure.

  - Para 3: Deliverables: debrief mapping moments to the components of the WKR argument
  (the FA/buck-passing claim, the "reason to have the attitude" vs. "reason bearing
  on value" distinction, the direction-of-fit / constitutive-aim diagnosis, whether
  the problem generalises to desire); what will predictably go wrong (students gaming
  the points, students who genuinely like the piece, blasé students who say incentives
  are just reasons, someone announcing "it''s all about the money" and defusing it);
  and be frank about which part of the puzzle the activity can''t reproduce (e.g.,
  it can''t reproduce the claim that the fitting attitude *constitutes* value — the
  constitutive/metaphysical claim; and it can''t settle whether the demon''s reason
  is a reason at all rather than merely a cause/inducement). Also: "the piece should
  be chosen by me" — ask them to specify what kind of object to use and why (e.g.,
  a short piece of music, a painting, a joke) — the choice matters because some objects
