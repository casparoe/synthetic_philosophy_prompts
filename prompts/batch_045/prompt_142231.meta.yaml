  Setting: 90-minute upper-level seminar, ~14 students, module on "value and reasons"
  (fitting-attitude analyses). Goal: feel the difference between a reason to want
  to have an attitude / a reason for the attitude; and the pull of the "wrong kind
  of reasons" objection to FA analyses of value.


  Design: "The Impresario" game. Three rounds.


  Round 1 (Desire/intention, direction of fit world→mind... wait: desire is mind→world;
  belief is world→mind). Let''s do: participants are each given a sealed envelope
  with a card. They must privately choose whether to "back" one of two objects (a
  piece of art? a person?) Hmm.


  Better: Stage it as a "commission" game. The facilitator plays a wealthy patron,
  "the Impresario," who will screen a short piece of music/video. Students are told
  they will each write down (privately) how much they admire the piece (0–10). Before
  it plays, the Impresario announces: for each student who reports admiration ≥ 8,
  a £20 donation to a charity of the class''s choosing (or course credit: +2% on the
  essay) — payable regardless of the piece''s quality. Then play something genuinely
  mediocre (a deliberately bland 60-second clip). Most students will want to write
  8 but feel they can''t honestly. That''s the felt pull: you have a *reason to want*
  to admire; you cannot thereby admire; and if you fake it, you get the reward but
  the number is not a report of admiration.


