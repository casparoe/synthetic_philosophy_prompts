  My half-formed idea is about subsidiarity, and specifically about a distinction
  I don''t see made cleanly. Most formulations I run into — including the EU''s three-part
  test (transnational dimensions; action by member states alone demonstrably insufficient;
  better achieved at Union level), the German constitutional test of whether federal
  legislation is ''necessary,'' and the American habit of arguing about enumerated
  powers and about whether states can be conscripted into administering federal programs
  — all seem to presuppose a negative reading: subsidiarity as a reason for the higher
  level to keep its hands off. But the older Catholic-social usage that the term comes
  out of is about subsidium in the sense of help: the higher body''s job is to assist
  the lower unit to do what it should do for itself, which sometimes means the higher
  level must act — fund, train, set a floor, build capacity — in order for the lower
  unit to be genuinely able to act. Call these the abstention reading and the enablement
  reading. I think a lot of the talk past each other (Americans arguing about federal
  spending conditions, Germans about whether the federation may fund universities
  directly, EU lawyers about whether subsidiarity is justiciable at all) is explained
  by participants'' implicitly holding one or the other.


  Relatedly, I''ve been bothered by something dynamic that the standard tests seem
  blind to: competences can be held but hollowed out. A Land or a canton may formally
  retain a power it has not exercised for decades, because the standards, money, and
  administrative expertise have migrated upward; at that point the abstention reading''s
  ''can the lower unit do this?'' question has a self-fulfilling answer. And the enablement
  reading may then justify interventions that look, on the standard test, like centralization.
