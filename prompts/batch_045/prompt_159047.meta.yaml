  Draft answer:


  "The principle of alternative possibilities, or PAP, is the claim that a person
  is morally responsible for what they have done only if they could have done otherwise.
  So it treats the ability to do otherwise as a sufficient condition on responsibility:
  if you had an alternative available, that is enough to make you responsible, and
  if you had none, you cannot be. Frankfurt''s 1969 paper attacked this principle
  with a counterexample, and the pattern of counterexample he invented has been endlessly
  reused since.


  In the original case, Black wants Jones to kill Smith, and Black is able to make
  Jones do it, but Black prefers not to show his hand; he waits and watches, and would
  intervene only if it became clear that Jones was going to refrain. As things turn
  out, Jones kills Smith on his own, for his own reasons, and Black never has to do
  anything at all. Jones is obviously morally responsible for the killing. But Jones
  could not have done otherwise, because had he been about to refrain, Black would
  have ensured the killing anyway. So here is a case of moral responsibility without
  alternative possibilities, and PAP is refuted.


  The upshot is that moral responsibility is compatible with determinism. Jones''s
  action was unavoidable in the relevant sense, and yet he is responsible, because
  what makes him responsible is that the action came from his own desires and reasons
  rather than from anything outside him. Frankfurt-style cases are therefore best
  read as a defence of compatibilism, and they answer the incompatibilist argument
  that if our acts are the inevitable outcome of the laws and the past then we are
  never responsible.


  The most important reply is the flicker-of-freedom objection. Critics point out
  that Jones did retain some alternative: he could at least have twitched a muscle,
  or begun to form an intention not to kill, or blinked at a moment when in fact he
  did not. However small, that is an alternative possibility, and PAP only requires
  that there be one. The flicker is enough to satisfy the principle, so the cases
  fail to be counterexamples, and Frankfurt''s argument does not go through.


  I think this reply succeeds, and I conclude that Frankfurt-style cases do not show
  that moral responsibility is possible without the ability to do otherwise. PAP survives
  the cases, and the ability to do otherwise remains necessary for responsibility."


