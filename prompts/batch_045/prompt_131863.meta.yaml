  The genuine philosophical commitments of Kelly/geometric rationality:

  - A view about what rationality is diachronically: the rational policy is the one
  that does best in the long run almost surely (a "long-run" or "asymptotic" justification),
  rather than one that maximizes expected utility at each choice. This presupposes
  that long-run almost-sure performance is the standard of rational choice — a view
  that has to be defended against "why should I care what happens to my far-future
  self''s wealth?"

  - It presupposes the agent is a persisting entity whose preferences are over its
  whole trajectory, and that there is no discounting/death — i.e., a view of personal
  identity and prudence (Parfit-ish: why should present-me care about the growth rate?).
  Actually with a finite horizon and log utility, you get approximately Kelly anyway...
  hmm, careful. Kelly = maximizing expected log = maximizing the almost-sure asymptotic
  growth rate. It is NOT the same as log utility over terminal wealth except in special
  cases. For finite horizon with log utility, maximizing E[log W_T] of terminal wealth
  with a fixed number of bets gives full Kelly each round (because of additivity of
  log) — yes actually it does coincide for iid bets with log utility. But it''s not
  the same as maximizing E[W_T].

  - It presupposes that "more money" has diminishing marginal value in a specific
  way, OR not: Kelly can be derived from the long-run growth argument without assuming
  any risk aversion at all — that''s the interesting philosophical point: you can
  be utterly indifferent to risk in the ordinary sense and still bet Kelly, because
  the argument is about what happens to wealth over time, not about the shape of your
  utility function. So the practice presupposes that rationality has a time-extension
  component, not just a risk-attitude component.

  - It presupposes that the relevant "bets" are repeatable and that wealth is multiplicative
  (compounding) — i.e., a substantive empirical/metaphysical claim about the structure
  of the situation: that returns are multiplicative, that there''s an absorbing barrier
  at zero (ruin is permanent, you can''t borrow to come back), and that opportunities
  will keep coming.

  - It presupposes that going to zero is special — that there''s no "restart" and
  no ability to borrow against future income. If you could borrow against future earnings,
  or if bankruptcy weren''t absorbing, full-Kelly-style restraint is less compelling.
  So the practice presupposes a view about the asymmetry of the zero boundary and
  about what counts as the relevant "bankroll" (should it include human capital? that''s
  a real underdetermination).

  - It presupposes a stance on the "fractional Kelly" question: real practitioners
  bet half-Kelly or less — and the practice''s choice of fraction is underdetermined
  by the growth argument alone; it needs something else (parameter uncertainty, model
  risk, or a risk-aversion overlay).

  - It presupposes something about how to handle disagreement/uncertainty: probability
  estimates are themselves uncertain; Kelly is notoriously fragile to overestimating
  your edge (overbetting not only fails to grow but shrinks). So the practice''s hedging
  rules presuppose an epistemology — maybe a commitment to using something other than
  your best guess (a "robust"/minimax-ish or shrinkage commitment).

  - The "we do X here but Y there" inconsistency: the club rebalances into losses
  (buys more after a price falls, i.e., treats a fall as making the asset a better
  bet — contrarian) but also has stop-losses/never adds to a losing position? Or:
  the club treats the fund''s survival as supreme (won''t risk ruin) yet it does accept
  a nonzero probability of ruin each period by betting a positive fraction (Kelly
  never goes to zero in the ideal continuous model, but with jumps it can). Nice tension:
  "We say we will never risk ruin, but our rule permits bets that with probability
  p lose almost everything; the rule only ever makes ruin have probability zero in
  a frictionless model."

  - Another tension: the club maximizes the growth rate of the fund, but pays out
  members'' living expenses (dividends), so the compounding isn''t actually compounding.
  Or: the club measures itself against a benchmark and cares about relative performance
  (which can push it away from Kelly — you can maximize growth and still almost surely
  end up poorer than a rival who took more risk; indeed, maximizing P(ending richer
  than rival) ≠ growth).


