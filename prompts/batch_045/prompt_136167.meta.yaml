  \ player.\n\nNow I need a set of earlier verdicts jointly consistent with more than\
  \ one plausible rule, and a new case where they diverge.\n\nCandidate rules:\n(A)\
  \ \"Galilean/negligibility\" rule: an assumption is fine if it's an idealization\
  \ that removes a factor whose influence is small in the domain of interest (controlled,\
  \ de-idealizable). Unrealistic in degree, not in kind.\n(B) \"The F-twist proper\
  \ / instrumentalist survival rule\": unrealistic assumptions are fine as long as\
  \ the model's predictions survive test — and indeed more unrealistic is a sign of\
  \ significance. Falsity of assumptions is irrelevant, only predictive success.\n\
  (C) \"As-if / selection rule\": false assumptions are okay if some mechanism (selection,\
  \ evolution, learning) makes the agents behave as if they were true — the assumption\
  \ is \"as if\" justified by a selection argument.\n(D) \"Robustness / de-idealization\
  \ rule\": fine if results are robust to the assumption's being relaxed, i.e., you\
