  \ complicated mathematical formulas — Friedman's example.\n7. Ideal gas law: molecules\
  \ with zero volume, no interactions — wildly false but works.\n8. Hardy-Weinberg\
  \ equilibrium assumptions in population genetics (infinite population, random mating)\
