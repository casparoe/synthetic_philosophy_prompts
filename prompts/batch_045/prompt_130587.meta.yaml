  Domain: Athenian democracy''s failures (Mytilene, Sicily, trial of Socrates).

  Type: adversarial collaboration joint statement.


  Two camps: let me name them in a way that isn''t a caricature. Call them:

  - "the institutional-diagnosis camp" (the pessimist): the three episodes are symptoms
  of the same structural defect in radical direct democracy — mass assembly with no
  filter, no professional staff, no written precedent constraint, high-stakes decisions
  taken under time pressure and emotional arousal, and a political culture in which
  being outdone in demagogic escalation was rational for any speaker.

  - "the contingency camp" (the optimist): the Assembly''s record was largely prudent;
  these three are the famous ones precisely because they were aberrations; each is
  explained by local, non-regime features — the Mytilene decision was a reprisal after
  a year of blockade and fear for the empire, was reversed within a day and halted
  by a literal last-minute ship; Sicily was a judgment about allies and prestige that
  failed largely through execution and luck (Alcibiades recalled mid-campaign, Nicias''
  dithering, Syracuse''s cavalry superiority); and Socrates'' trial was a religious-political
  prosecution after the Thirty, driven by specific accusers and by Socrates'' own
  courtroom conduct, and it''s not clear the Assembly or the dikasteria was the failure
  point (it was a jury, not the Assembly).


