  Leaves to require (7):

  1. Strong determinism (language fixes the limits of what can be thought).

  2. Neo-Whorfian / weak relativity: habitual language shapes habitual attention,
  categorization, and memory in some domains but doesn''t fix limits.

  3. "Thinking for speaking": effects are confined to the act of planning/producing
  speech (online), no offline effects on thought.

  4. Nativist/universalist: thought is in a language of thought; cross-language differences
  are performance effects, strategy, or task demands.

  5. The "no single question" position: domain-relative; the debate is a family of
  separate empirical questions, some settled, some not.

