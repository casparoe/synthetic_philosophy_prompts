  Actually the cleanest "proves too much" in this area: the argument from the possibility
  of verbal dispute to global deflation of ontology. Steps:

  1. If two parties'' disagreement stems only from their using the same sentence to
  express different propositions, the dispute is merely verbal and there''s no substantive
  fact at issue.

  2. Quantifier variance (Hirsch): there are many equally good candidate meanings
  for the quantifiers; speakers who accept different ones express different propositions
  when they say "there are tables."

  3. So the dispute between the mereological universalist and the nihilist is merely
  verbal.

  4. The same holds for every dispute about what there is.

  5. So no ontological dispute is substantive; ontology is a trivial enterprise.

  6. But this argument itself is a claim in metaontology, and if the argument is right,
  then the argument''s own conclusion... or: the same reasoning applies to any dispute
  whatsoever — "do numbers exist?", "was the Holocaust...?" hmm, better: it applies
  to disputes in any domain where "exists" appears, including "do holes exist?" vs.
  ordinary empirical disputes. And a standard worry: the argument overgeneralizes
  to disputes everyone wants to count as substantive, e.g., the dispute between the
  physicist who says "there are 3 particles" and ... hmm.


  Also, there''s a nice self-application twist: if the deflationist''s argument is
  sound, then the dispute between deflationists and their opponents (Sider, van Inwagen)
  is itself merely verbal (assuming their metaontological terms have different meanings),
  so the deflationist can''t claim to have shown anything.


