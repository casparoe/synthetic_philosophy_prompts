  exist uncountable sets (e.g., the reals). So within a countable model M, there''s
  a set R that M "thinks" is uncountable — meaning there''s no function in M witnessing
  a bijection between R and ω — even though from outside M, R is countable (since
  M is countable, all its elements are countable). Resolution: "uncountable" is not
  absolute; the absence of a bijection inside the model doesn''t mean there''s none
  outside.


