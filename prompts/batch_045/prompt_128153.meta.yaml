  ---


  I''m a journalist who writes about war, international law, and the language we use
  for both. I''m at work on a long-form piece about the quarrel that now reliably
  follows every mass atrocity: survivors and their advocates fight to have it called
  a genocide, while foreign ministries and their legal advisers reach for cooler words
  — ethnic cleansing, crimes against humanity, a campaign of terror, a tragedy. I''d
  like you to write the analytical spine of that piece: an essay that works through
  the argument on both sides of the naming question and then commits to a verdict
  about what the word should mean and who should get to use it.


  A few ground rules, because of how I''ll use this. Argue from principle and from
  examples you construct yourself; do not cite cases, statutes, treaties by number,
  or legal and academic writers by name, and do not rest anything on details a reader
  would have to look up. I want an argument I could hand to a smart general reader,
  not a brief. Assume no background in law. Define every term of art at first use.
  Write in American English, in prose meant for a magazine: concrete nouns, no throat-clearing,
  no bullet lists inside the body, no summary at the top of the whole thing.


  Here is the background as I understand it, and the apparatus I''ve been developing
  in my notebooks — please take both as given and tell me if either is confused. Lemkin
  coined "genocide" by joining a Greek word for a people or tribe to a Latin word
  for killing, because he wanted a name for a crime aimed at the existence of a group
  rather than at the individuals who compose it. The convention that he campaigned
  for, and that states eventually adopted after the Second World War, ended up narrower
  than his idea: it listed a handful of specified destructive acts, and it required
  what lawyers call a special or specific intent — not merely killing on a large scale,
  but aiming at the destruction of the group as such, in whole or in substantial part.
  Proposals to include the deliberate destruction of a group''s culture, language,
  and institutions were pressed and were largely dropped. So the legal category is
  narrow, intent-centered, and, in the public imagination, supreme: it is the word
  that means the worst thing.


  Three notions I want you to use. First, the destructive footprint: not what the
  perpetrator hoped for, but the difference the conduct actually makes to the prospects
  of the group — its numbers, its cohesion, its ability to hand itself on. Second,
  the attrition test, which I want you to consider as a rival to the intent requirement:
  an episode counts as genocidal when the destructive footprint foreseeably cuts short
  the group''s persistence as a distinguishable group — say, when it makes it likely
  that the group, which would otherwise have persisted for roughly two more generations,
  will not — whether or not anyone aimed at that outcome. Third, the problem of archival
  selection: the suspicion that a standard turning on proved intent systematically
  favors tidy, bureaucratic, paperwork-generating atrocities over ones that destroy
  through dispersal, neglect, market pressure, environmental ruin, or the cumulative
  action of many unconnected hands.


  The question I want the essay to answer: should "genocide" keep its narrow, intent-centered
  shape, with other, less freighted words carrying the rest of the moral load — or
  should the concept be re-centered on consequences, in something like the attrition
  test, and its institutional uses (prosecution, diplomatic pressure, the trigger
  for outside duties, the claims of survivors on memory and repair) be uncoupled from
  the label?


  Please organize the response in exactly these sections, in this order:


  1. "The Stakes" (about 250 words) — set up why the naming fight is not merely semantic:
  what the label does, beyond the courtroom, for victims, for bystanders, and for
  perpetrators who are choosing how to document their own conduct.


  2. "The Case for Keeping the Category Narrow" (about 400 words) — the strongest
  available defense of the intent requirement and of a restricted vocabulary: what
  a mens rea standard protects, why the distinctive wrong might genuinely be the aim
  rather than the body count, and what is lost if the word thins out.


  3. "The Case Against Intent" (about 400 words) — press the opposite side, including
  the archival-selection worry and the situation of a group dissolved by policies
  nobody designed to destroy it.


  4. "Attrition and Its Discontents" (about 350 words) — take the attrition test seriously
  as a proposal and then attack it: what it would sweep in, what it cannot measure,
  how a court would ever administer a counterfactual about a group that would have
  existed, and whether it quietly makes every misfortune that thins a people into
  a crime.


  5. "Two Cases" (about 300 words) — invent and work through two stylized episodes:
  one that the current intent-centered definition fails and the attrition test catches,
  and one that the attrition test catches but that you think should not count. Use
  them as tests of the theories, not as decoration.


  6. "My Verdict" (about 350 words) — take a position on the question above and defend
