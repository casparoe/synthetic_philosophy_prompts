  to show that the whole idea of a person being a person through other persons either
  collapses into something its defenders would hate or does no work at all. That''s
  too strong, so tell me where I cheated.


  (1) On the relational view, what makes someone a person isn''t a property they have
  on their own; it''s their being adequately embedded in relationships with others.
  Personhood is achieved and kept up, not just given.


  (2) So personhood is the sort of thing other people have a hand in: it can be built,
  damaged, and in the limit undone by how those around you actually relate to you.


  (3) That looked like the view''s selling point. It explains why apartheid''s refusal
  to treat Black South Africans as fully human, or a village turning on someone and
  driving them out, is a distinctive kind of wrong and not just unkindness: it''s
  an attack on the victim''s standing itself, not merely on their welfare.


  (4) But take a case where the withdrawal sticks. Everyone around X relates to X
  as a thing: X is used, humiliated, never addressed, no one else is in reach. Given
  (1) and (2), X isn''t a person, or is a much diminished one. And now the view seems
