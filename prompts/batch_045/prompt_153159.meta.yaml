  hangs on which point is which; the physical content of a model is only what survives
  the relabelling. That''s the moral people draw from the hole argument: picture a
  region of spacetime with no matter in it (the ''hole''), and a relabelling that
  moves points around inside the hole but leaves everything outside it exactly as
  it was. If the manifold points had identities of their own, you''d have two models
  that agree everywhere up to the edge of the hole and then disagree inside it — determinism
  fails for no reason, which is absurd. So, the practice: treat the relabelled models
  as the same, and only count as observable the quantities that are invariant under
  relabelling.


  Fine. But then look at what people actually do. They build a numerical simulation,
  and the first thing they do is fix a gauge — pick a coordinate system, choose a
  lapse and a shift, lay down a grid — because the equations won''t evolve otherwise.
  They then read off numbers off that grid: ''the metric component at this grid point
  at this time step'', ''the coordinate radius of the horizon'', ''the waveform as
  a function of coordinate time''. And these are exactly the sort of quantities the
  official doctrine says aren''t physical. Some of the gauge conditions they pick
  are anchored to physical stuff (''the time coordinate is the proper time of the
  observers who are comoving with the matter'', ''r is fixed by the area of the spheres''),
  but plenty aren''t — the popular slicing conditions are just convenient functional
  choices with no matter to hang them on. And then there''s the bits of the simulation
  where there''s no matter at all to anchor anything, i.e. vacuum regions that are
  basically the hole again, and there they still seem happy to talk about what''s
  happening ''at'' a point ''at'' a time.


