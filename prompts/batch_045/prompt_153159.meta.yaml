  explain why the practice is fine (say, by treating the gauge-fixed model as just
  a representative of an equivalence class, and the numbers as a way of encoding invariant
  facts about the whole class)? I want to know what''s strictly presupposed vs. what
  the practice merely sits well with, and where it''s underdetermined — i.e. which
  of several quite different metaphysical stories would license exactly the same behaviour
  at the keyboard.


