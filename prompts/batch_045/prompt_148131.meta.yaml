  Draft final version:


  "I think ''do the symbols push the substrate around?'' is ambiguous between three
  questions, and it''s worth separating them. First: is there anything real at the
  simm level, or is it just a façon de parler? I say real. The simm-level description
  supports counterfactuals that the substrate description doesn''t: if the careenium''s
  simm about the predator had been different, it would have moved differently, and
  that holds however the blob is built. On any account where causation tracks counterfactual-supporting
  (or intervention-supporting) generalizations, that makes the simm level causally
  explanatory, not merely convenient.


  Second: does the simm level''s causation compete with the substrate''s? I think
  yes, and multiple realizability shows why. The same pattern of simmball collisions
  could be implemented in protoplasm, in silicon, or in a room of people shuffling
  index cards. So the causal work the pattern does can''t be identical to the work
  done by any particular substrate — the pattern floats free of the stuff. Which means
  the pattern has causal power of its own, and it exercises that power on the substrate:
  when the predator-simm changes, the protoplasm gets shoved around by it. People
  who say ''the physics already does all the work'' have the order backwards; the
  physics does what it does because the simm level has told it what to do. Nobody
  denies that something at the bottom is doing the shoving, but the question is what''s
  pushing what, and the answer is the symbols pushing the substrate.


  Third, the exclusion argument. Kim''s version runs: the physical domain is causally
  closed, so any physical event with a cause has a sufficient physical cause; the
  simm-level property isn''t identical to that physical cause; so we seem to have
  two causes for one effect, which is overdetermination. Kim''s own conclusion is
  that the higher level is epiphenomenal — real and supervenient, but causally inert
  — and Davidson''s anomalous monism ends up in the same place, since if there are
