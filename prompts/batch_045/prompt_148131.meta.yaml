  Question text:


  "Some thinkers have imagined a creature called the careenium: a big amoeba-like
  blob that lives in a swamp, avoids predators and looks for food. We can describe
  what goes on inside it two ways. At the substrate level: protoplasm sloshing, electrochemical
  gradients, pressures and nudges. At the simm level: the blob contains symbol-like
  structures (''simms''), including ''simmballs'' that collide with one another, and
  these collisions track facts about food and predators; when the pattern of collisions
  changes, the blob''s behaviour changes in the way you''d expect given what the pattern
  means. The simm-level description is the one that lets you predict and control the
  creature''s behaviour across all sorts of variation in how it happens to be built;
  the substrate-level description is, in practice, useless for that. Question: do
  the symbols push the substrate around, or does the substrate push the symbols around,
  or is the question ill-posed? In your answer: (a) say what ''push around'' would
  have to mean for this to be a real question about causation rather than a question
  about which description is convenient; (b) explain what the realization (or implementation)
  relation does and does not allow you to conclude about the causal work done at the
  simm level; (c) state the exclusion argument and say exactly what it would establish
  if it succeeds and what it would not; and (d) say whether the fact that the same
  simm pattern could be realized in wildly different substrates settles anything,
  and why."


  Good. That''s a solid exam question.


