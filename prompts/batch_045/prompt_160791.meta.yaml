  produced again somewhere else — other agents, causally cut off from you, running
  something structurally like your decision procedure. The interesting claim is that
  this changes the verdict in a one-shot prisoner''s dilemma: your cooperating is
  evidence about what those other runs do, and if the evidence is strong enough relative
