  ---


  For my sixth-form creative-writing portfolio I need a short story — about 1,200
  words, in British English, please — that stages a disagreement about forgetting
  rather than explaining one.


  The institution I''ve invented is called the Shedding. Once a decade the residents
  of a small town vote by secret ballot for one episode from the town''s own history
  to be put into "active oblivion": struck from the school syllabus and the local
  archive, omitted from the remembrance-day reading, and — this is the part I care
  about — something everyone who still remembers it has promised one another never
  to mention again. Children are not told that anything has been taken out. Its defenders
  say it is neither denial nor censorship: the episode is named aloud once, at a ceremony,
  and then deliberately let go of, the way a family might decide to stop rehearsing
  an old injury. (It is not forgiveness either — nobody claims the wrong has been
  atoned for or excused.) The town also keeps a sealed ledger listing everything it
  has shed, which is where my protagonist finds this year''s entry.


  Two complications should carry the story. First: the episode chosen this year is
  one in which a single family in the town was badly wronged, and their granddaughter
  argues that a community owes the people it has wronged a duty of remembrance that
  no majority can vote away — that forgetting on their behalf is a second injury,
  and that the duty is owed to them, not just to whatever the living now find useful.
  Her opponents reply that keeping it present is not loyalty but a way of pinning
  her family into the role of victims, and that forgetting can be a kind of care.
  Second: the rules require the consent of the last surviving witness, who is now
  in the advanced stages of dementia and cannot recall the episode, though she used
  to speak of it constantly — so the story has to feel its way around whether a duty
  to remember can be owed to someone who can no longer remember, and whether the town
  is remembering for her or merely about her.


  Please avoid the obvious statue-being-pulled-down set-up: the dispute should be
  about a forgetting that everyone involved has agreed to, not about contested public
  symbols. I''d also like the ending to turn on a concrete act rather than a speech
  — I was thinking of whether she tells her younger brother, who under the rules is
  not meant to know that anything was ever removed, and thereby manufactures a memory
  where there was none. No moralising narrator, no tidy resolution, and no character
  who is simply right: I want the reader to come away unsure whose claim on the past
  is the stronger one.


  ---


