  \ a claim about the *support* of the joint outcome distribution: my action and yours\
  \ are perfectly correlated. Call this the identity premise.\n\n§2. Grading the premise.\
  \ In any realistic case the identity premise fails: I am not running your code,\
  \ our evidence differs, our tie-breaks differ. Suppose instead that my action and\
  \ yours coincide with probability c — a \"mirroring probability\" — and that when\
  \ the mirroring fails, our actions are independent. Consider two agents who both\
  \ accept graded superrationality, with payoffs T=5, R=3, P=1, S=0 (and 2R > T+S).\
  \ If I cooperate: with probability c you mirror me, so I get R; with probability\
  \ 1−c your action is independent, and in that subgame you face an uncorrelated opponent\
  \ and so defect, giving me S. If I defect: whether or not the channel is up, you\
  \ defect too — mirrored with probability c, independently with probability 1−c —\
  \ and I get P. So EU(C) = cR + (1−c)S and EU(D) = P, and cooperation is correct\
  \ iff c ≥ (P−S)/(R−S) = 1/3.\n\nTwo remarks. (i) The temptation payoff T drops out\
  \ entirely: what constrains cooperation is not the lure of unilateral defection,\
  \ which the mirror forecloses, but the sucker payoff — how bad it is to be the only\
