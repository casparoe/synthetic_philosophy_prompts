  \nLet me draft the essay carefully.\n\n---\n\nDRAFT ESSAY: \"Superrationality, Graded:\
  \ or, the Dilemma One Level Up\"\n\n§1. The standard argument. In the one-shot Prisoner's\
  \ Dilemma between two agents known to be running the same decision procedure, the\
  \ superrational move is cooperation: since the procedures are identical, the only\
  \ pairs of outcomes with positive probability are (C,C) and (D,D); R > P, so choose\
