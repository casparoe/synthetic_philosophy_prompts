  (3) If an act is good for someone and bad for no one, we have pro tanto moral reason
  to do it, and if the reason is strong and costless we have reason to do it as often
  as possible.

  (4) Hence: we have reason to bring into existence every net-positive-welfare person
  we could — i.e., the larger the population (of worthwhile lives), the better, with
  no upper bound from average welfare as long as each added life is net positive.

  (5) But by (4), a world of a trillion trillion people each with lives barely worth
  living (just above zero) is far better than a world of ten billion people each ecstatic
