  effect counts as genuine cognitive penetration only if three things hold: first,
  the effect still appears in a speeded task where the subject has no time to form
  any judgment about the stimulus; second, the effect persists even after the subject
  has been told in advance exactly what the effect is, asked to correct for it, and
  offered a cash bonus for reporting only what is strictly on the screen; and third,
  the effect vanishes when the very same stimulus is presented in a slightly altered
  format, which I take to show that what is being altered is perceptual rather than
  a general response bias. If an effect meets all three, it seems to me that the standard
  deflationary replies — that it''s really a judgment effect, or a reporting bias,
  or a memory effect — are ruled out together, and if an effect meets none of them
  then the modularists were right and nothing is penetrated. I also take the clearest
  positive case to be perceptual learning, of the sort you see with a radiologist
  who has been trained to spot a tumour on a scan or a sommelier who tastes structure
  that a novice doesn''t: training plainly changes what these people see, and I can''t
  see what would be left of the anti-penetration position if that is granted.


