  the influencer intends to steer the target to a particular outcome and that intention
  is not transparent to her, whatever route the influence takes; (iii) the treating-as-a-tool
  account — influence is manipulative when the influencer substitutes her own will
  for the target''s, treating the target''s decision as something to be produced rather
  than as a self-governing choice to be engaged.


