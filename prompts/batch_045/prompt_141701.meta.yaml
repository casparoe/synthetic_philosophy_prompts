  Draft:


  "Been reading the rationalist corner of the internet since the Overcoming Bias days,
  so my reflex on any ''I can''t decide'' question is: shut up and multiply, pick
  the bigger number, and if that feels bad the problem is with my feelings. A friend
  of mine — ex-philosopher, now a clinical ethicist at a hospital, she''s the one
  who got me into this — keeps insisting this only works if the options are actually
  comparable, and that the interesting cases are precisely the ones where there''s
  no bigger number to find. I''ve read some of the parity/voluntarist stuff (Chang
  and friends) and it half-clicked, but I''ve also seen ''incommensurable'' used online
  as a stop-word meaning ''I don''t want to do arithmetic'', which I take to be a
  real failure mode that a good theory should block rather than enable.


  So before I commit to any particular theory of hard choices, I want the spec. What
  does an account of hard choices and incommensurable values have to deliver to count
  as adequate — for my purposes, adequate means good enough that I could (a) tell
  the difference between a genuinely hard choice and a lazy refusal to do the math,
  and (b) say something non-bullshitty to a friend who''s three weeks into agonizing
  over two jobs and wants to know whether she''s allowed to just pick."


  Then requirements list with the cases:


  Give them a set of injection cases:

  - "Wren''s case" (my friend''s): two jobs, one is high-status/money with 60-hr weeks
  in a city she likes, the other is lower-paid, more autonomy, near family.

  - the "tiny token" case: if you add $5 to one option does it become clearly better?
  (small-improvement argument)

  - the "resolution/zoom" case: at coarse grain both options look ''fine'' and comparable,
  at fine grain they don''t — my friend calls it resolution-dependence; a theory must
  say whether comparability is grain-relative.

  - the "re-run" case: same agent, same info, Tuesday ranks A above B, Thursday ranks
  B above A, no self-deception, no new evidence; is that irrational or is it what
  parity predicts?

  - the "transformative" case: the choice changes what you come to value (kid vs.
  no kid), so the evaluator after the choice is not the evaluator before.

  - the "advisor asymmetry": when I''m the one deciding for myself, "just pick, either
  is fine" feels like a category error; when my friend is deciding, the same advice
  seems perfectly fine. Explain the asymmetry.

  - the "third option / chaining" case (money pump): A slightly worse than B, B on
  a par with C, C... must say whether it''s vulnerable to being money-pumped / whether
  it''s exploitable.

  - the policy/aggregation case: cost-benefit analysis, value of a statistical life
  vs. a wetland, and the fact that institutions must decide anyway — must say whether
  incommensurability has any bite for collective choices or is only a first-personal
  thing.

  - the "tragic remainder" case: choose one, the other is not just lost but wronged
  / there''s residue.


  Distinctions it can''t collapse: incomparability vs parity vs equality vs vagueness
  vs ignorance/measurement error vs incompleteness of the agent''s preferences; "the
  values are incommensurable" vs "the options are incomparable"; metaphysical vs epistemic
