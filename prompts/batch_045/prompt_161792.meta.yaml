  The episode: on 22 May 2015 Ireland amended its constitution by referendum so that
  marriage may be contracted without distinction as to sex — 62% yes on a turnout
  of about 61%, the first time any state did that by popular vote rather than by legislation
  or court order. Useful background for the analysis: male homosexual acts were criminal
  offences in Ireland until 1993, under Victorian statutes inherited from Westminster;
  when the Supreme Court upheld those laws in the early 1980s it did so in part by
  appealing to the Christian character of the state and to the protection of marriage
  and public health. The change came only after the European Court of Human Rights
  said the criminalisation breach(ed?) privacy...


  Second paragraph: what I want you to do. Run Devlin''s own machinery on this rather
  than Hart''s: his claim that a shared morality is part of what holds a society together,
  that a society may defend it the way it defends its government, that there''s no
  principled limit fixed in advance, and that the test is meant to be an empirical
  one about what the ordinary person actually feels — intolerance, indignation, disgust
  — best measured, in his hands, by a jury. So: what does Devlin''s theory say the
  Irish electorate was doing in 2015, and what does it say the 1983 Supreme Court
  was doing? If the morality of a society is whatever gets measured, Devlin''s view
