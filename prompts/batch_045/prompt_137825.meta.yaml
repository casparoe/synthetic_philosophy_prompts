  Let me now assemble the misrepresentations to plant (2–3, subtle, no howlers):


  1. "Death has never once been wrong" — perfect prediction. Subtle error: with a
  perfect predictor both options give death probability 1, so the case collapses;
  the interesting version requires near-perfect but imperfect prediction, and moreover
  Death''s reliability must be about predictions of *you*, and the standard treatment
  needs the accuracy to be act-independent for the EDT verdict to be the "stay home"
  verdict. Also under perfect prediction, CDT''s unconditional probability becomes
  tied to your own credence about what you''ll do — that''s the instability.


  2. "Evidential decision theory ... tells you to stay home and die" — subtly wrong:
  it''s not that EDT "tells you to die"; with symmetric accuracy the two acts are
  equally strong evidence of death, so EDT''s verdict is a tie broken by the incidental
