  Let''s think about the "misconception map" and "dependency structure" for acausal
  trade teaching:


  Dependencies:

  1. Causal Decision Theory vs Evidential Decision Theory: need Newcomb''s paradox
  first (one-box vs two-box) to get "your choice can be evidence about outcomes without
  causing them."

  2. Then: in Newcomb, the correlation comes from a common cause (the predictor).
  In acausal trade, there is *no* common cause—the correlation comes from the fact
  that you and your counterpart are running the same decision algorithm / are algorithmically
  similar. So the key move: separate "correlation by common cause" from "correlation
  by algorithmic/logical similarity." This is the crucial dependency: you must first
  break the intuition that correlation requires causation (via Newcomb), then show
  a case where there isn''t even a common cause.

  3. Then the twin prisoner''s dilemma / Hofstadter''s superrationality: identical
  copies deciding the same way.

  4. Then generalize: you don''t need exact copies, just enough similarity that the
  other''s choice is algorithmically correlated with yours (functional decision theory
  / "you are in a logical relationship with all computations similar to you").

  5. Then the trade itself: we can each do something cheap for us and valuable for
  the other: e.g., I create a paperclip-maximizer''s utility (humans simulate/...)—standard
  example: an AI in one universe trading with a different agent in a causally disconnected
  region; or the classic "I''ll simulate happy humans if you simulate paperclips"?
  The classic LessWrong example: two agents, one values paperclips, one values staples,
  each can produce many of the other''s value cheaply. But that requires communication?
  No — acausal: they each reason "if I produce staples-for-him, he (being a similar
  reasoner) will produce paperclips-for-me."

  6. Then "acausal trade with agents who don''t know of each other" — the "no handshake"
  issue: each must independently reason about the other''s reasoning, and there''s
  the question of whether trade can get off the ground if neither can verify.

  7. Cost of computation / the "trade must be worth it" and the issue of "who counts
  as similar enough" — the problem of logical uncertainty: you can''t compute what
  other agents similar to you would do.


