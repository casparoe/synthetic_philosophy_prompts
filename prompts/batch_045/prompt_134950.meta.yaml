  Below is the question (worth 25 points) with the definitions I gave in it, then
  one student''s answer verbatim apart from trimming some hedging.


  Exam question. In A Treatise on Probability Keynes distinguishes the probability
  of an argument from its weight: the probability is the degree of rational belief
  the premises warrant in the conclusion (a matter of the balance of favourable over
  unfavourable evidence), while the weight is a matter of how much relevant evidence
  the argument draws on — you can add evidence that leaves the probability unchanged
  and still increases the weight. Modern decision theory offers at least three framings
  for ''not knowing the probabilities'': (i) Knight''s unmeasurable uncertainty, where
  no usable probability distribution over outcomes is available at all; (ii) imprecise
  or interval-valued probabilities, where you work with a set of probability functions
  and derive lower and upper bounds rather than a single number; (iii) ordinary subjective
  Bayesianism with a single precise prior, where ''uncertainty about the probabilities''
  is handled by robustness checks across priors. (a) Explain why Keynes''s own treatment
  is not straightforwardly any of these three, and say which of them is closest to
  what he was doing, with reasons. (b) Frank Ramsey''s ''Truth and Probability'' is
  usually read as having killed Keynes''s logical-relation view of probability. Does
  Ramsey''s critique apply specifically to the weight notion, or only to the claim
  that there are objective logical probability relations? Answer both parts in short
  prose; cite no sources.


  [student answer follows]"


