  "Keynes''s Treatise is a defence of the logical interpretation: probability is a
  relation between a body of evidence and a conclusion, the degree of rational belief
  that the premises warrant, not a frequency and not a state of mind. Importantly,
  probabilities for Keynes are not always numerically measurable — some are only ordinally
  comparable and some aren''t comparable at all, as in the umbrella case, where it''s
  not more likely than not, not less likely than not, and not exactly even, and he
  thinks it''s fine to let caprice decide. This is why he thinks probability theory
  isn''t just a branch of statistics, and why the Treatise spends so long on the principle
  of indifference, which he criticises for manufacturing numbers where there aren''t
  any.


  The weight of an argument is the other half of this. Weight is best thought of as
  the agent''s confidence in her own probability judgement: a second-order probability
  that the first-order judgement is correct, which goes up as the body of evidence
  behind it gets bigger and better. That''s why new evidence always raises the weight
  even when it leaves the probability unchanged — you''ve become more sure of what
  you were already claiming. And the practical moral follows directly: because a high
  weight means your judgement is more likely to be true, an agent choosing between
  two courses of action should prefer the one supported by the argument of greater
  weight even when its probability is somewhat lower. This is also, I take it, what
  Knight meant by uncertainty: for Knight the trouble is that the evidence is too
  thin to pin down a distribution, which is just Keynes''s point that the weight is
  low. Both are saying the same thing — you don''t have enough information — and the
  label "Knightian uncertainty" is basically the 1921 version of low Keynesian weight.


  Ramsey''s essay is best read as a friendly amendment rather than a refutation. Since
  the warranted degree of belief varies with what the agent knows, Keynes was already
  a subjectivist in substance; the objective logical relation is doing no work, and
  Ramsey''s complaint was really that Keynes hadn''t followed through and gone the
  whole way to subjective degrees of belief constrained only by coherence. So the
  bits of Ramsey that people quote against Keynes — the measurement of belief by betting
  behaviour, the Dutch-book-style coherence argument — are an extension of the Treatise,
  not an attack on it.


  So of the three framings, (ii) is closest. Keynes''s refusal to attach a number
  just means the probability is interval-valued, i.e. a set of probability functions
  with lower and upper bounds, which is exactly what the modern imprecise-probability
  literature calls a credal set; that literature is a rediscovery of the Treatise
  with better notation. (i) is a bit too strong, since Keynes doesn''t deny that probability
  relations exist, and (iii) is too simple because it insists on one number. The link
  to the later economics is that once you see weight is low in the interesting cases,
  long-run expectation has to rest on convention rather than calculation, which is
  what he argues in the General Theory."


