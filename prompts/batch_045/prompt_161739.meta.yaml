  and also into Second Company and Headquarters zones, so four cells: Red & Second,
  Red & Headquarters, Blue & Second, Blue & Headquarters. Initially she gives each
  cell one quarter. Then she hears a radio message from a source she doesn''t fully
  trust. The content of the message is that she is in a matching cell: if she is in
  Red she is in Second Company, and if she is in Blue she is in Headquarters. Equivalently,
  the message says she is either Red-and-Second or Blue-and-Headquarters, not one
  of the mismatched cells. Judy knows the following about the source''s reliability:
  if the true cell is Red & Second, the chance of getting the message is 0.9; if it
  is Blue & Headquarters, the chance is 0.7; if it is Red & Headquarters, the chance
  is 0.2; if it is Blue & Second, the chance is 0.2. She gets the message. (I made
  these numbers up to break the usual symmetry; in the textbook version the match
  cells are equally reliable, so hearing the message doesn''t move her confidence
  in Red at all.)


  I want a spec, not a discussion. Please act as a professional philosopher who specializes
  in formal epistemology and probabilistic updating. Take it seriously, brainstorm
  a bit to yourself first about which cases are doing the work, then give me the list
  of desiderata that any adequate update rule for this kind of case has to meet. That
  is: what a rule for turning her old credences plus this signal into new credences
  would have to get right. For each desideratum, give the motivating case or consideration
  behind it, say whether you think it is non-negotiable or merely a preference of
  one approach, and flag any subset of your desiderata that you suspect cannot all
