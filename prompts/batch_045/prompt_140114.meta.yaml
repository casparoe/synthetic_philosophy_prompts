  I am about to use epistemic game theory as an engineering tool, and I want the specification
  before I pick a framework.


  The setting: I am designing an automated negotiation protocol. A small number of
  software agents, each with a private type, exchange messages over a fixed protocol
  and then choose. I want to be able to say of some outcomes that they follow from
  the agents'' rationality together with what the agents commonly know, and of others
  that they do not — and I want to know what would have to be established for such
  a claim to be licensed. Three features of my setting are not the usual ones:


  1. The agents'' decision procedures are inspectable. In the likely deployments each
  side can read the other''s code before choosing, so the object of higher-order knowledge
  is often a procedure rather than an action.

  2. Rollouts are staggered. Some participants run a version of the protocol in which
  certain actions do not exist, and they do not merely assign those actions low probability
  — they cannot represent them.

  3. My verification is partial. I can at best establish that each agent has the relevant
