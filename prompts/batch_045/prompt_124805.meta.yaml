  the on-site parking permit and the Berkeley cafeteria allowance, on the grounds
  that his body still walks through the turnstile each morning.


  The memo should be written by a deadpan Workplace Operations analyst to the heads
  of Payroll and Tax, cc''ing Legal, and should run about 600 words of continuous
  prose — no headings, bullet points, numbered lists, bold or italic emphasis, or
  tables; just paragraphs, the way a real inter-office email would read. It should
  never name the philosophical problem or say the words "personal identity": its comedy
