  prejudices — the examples do this: "locality, determinism, no preferred basis, empirical
  equivalence ... and so on"). So I''ll list candidate requirements and ask to sort
  them.


  Candidate desiderata (with motivating cases):


  1. Safety/necessity: improvement must hold for every way the game could reasonably
  be played, not just at some equilibrium — i.e., for all outcomes in some set of
  "possible" outcomes (motivated by: you can''t know which equilibrium; also by delegation
  where you don''t know how your delegate plays).

  2. Non-vacuity: the definition must actually license some nontrivial modifications
  in interesting games (PD, Chicken), not just be empty or only license trivial relabelings.

  3. Baseline problem: what is the counterfactual — the original game''s outcome?
  the outcome under "default" play? Must specify whether improvement is relative to
  the outcome of the unmodified game under the same (unknown) play rule, and handle
  the case where the modification changes the game so much that "same play rule" is
  undefined (the token-game trick).

  4. Plausibility of the play-assumptions: which "qualitative" assumptions about how
  games get played are legitimate (isomorphic games played isomorphically; iterated
  elimination of strictly dominated strategies; symmetry/invariance) vs which sneak
  in equilibrium selection. Ask: is "isomorphic games played isomorphically" a desideratum
  of the definition or a substantive empirical assumption? Also: should the notion
  be "assumption-relative" — SPI given a class of play-assumptions — or absolute?

  5. Unanimity vs. consent/participation: should the improvement require each player
  to voluntarily opt in (interim individual rationality under their own possibly-wrong
  beliefs), or is it fine that it''s imposed? Distinguish "nobody is harmed" (objective)
  from "nobody could reasonably expect to be harmed" (subjective/epistemic). Motivating
  case: a player who is mistaken about the other''s strategy and would refuse a modification
  that in fact helps them.

  6. Interpersonal utility: no interpersonal comparisons; invariance to independent
  positive affine transformations of each player''s utility; and what happens when
  the mechanism needs transfers (then utilities must be quasi-linear — is that a prejudice?).

  7. Robustness/continuity: small misspecification of payoffs shouldn''t flip a "certainly
  better for all" into a harm. Motivating case: a knife-edge SPI in a game with nearly-equal
  payoffs.

  8. Composition/iteration: if G'' is an SPI on G and G'''' an SPI on G'', then G''''
  is an SPI on G (transitivity); and simultaneous vs. sequential adoption — do multiple
  SPIs compose, or can agents applying different SPIs interfere (the "unilateral adoption"
  problem — can one player unilaterally implement, or does it need unanimous adoption,
  and what if only some adopt)?

  9. No-regret under partial adoption: robustness to some players not participating
  (this is huge and it''s the "safe" part in practice).

  10. Implementability: the notion should be tied to mechanisms that real agents can
  set up — cheap talk, commitments, delegation to programs that can read each other''s
  source — and shouldn''t presuppose an enforcer or a trusted third party. Is "no
  trusted third party" a genuine desideratum or a prejudice?

  11. Distinctions it must not collapse: (a) better-for-each vs better-in-aggregate;
  (b) objective safety vs subjective expected improvement; (c) improving the outcome
  vs improving the game; (d) "safe" (belief-free) vs "robust" (true for all beliefs
  in a set) vs "likely"; (e) Pareto improvement vs Pareto efficient outcome selection;
  (f) ex ante vs ex post with certainty — note SPI as defined gives improvement with
  certainty, ex post, which is very demanding; maybe should allow "guaranteed in expectation
  under each player''s own beliefs" (subjective).

  12. Consistency with what we know: can''t violate the standard result that with
  strict dominance there''s no room (e.g., in a game where each player has a strictly
  dominant strategy and the SPI can''t change payoffs, no improvement is possible)
  — i.e., mustn''t imply "solutions" to games that are impossible.

  13. Equilibrium-selection-free-ness vs. decision-theoretic soundness for a player
  using FDT/UDT: if players are expected-utility maximizers with beliefs (as opposed
  to the belief-free setting), the definition must still make SPI adoption subjectively
  rational.

  14. Computational tractability? Is deciding whether an SPI exists computable/efficient
  — genuine desideratum for a design tool or a worry only an ML-flavored camp has?

  15. Scale/generality: must handle >2 players, continuous games, repeated games,
  incomplete information (private types), and games where players can''t communicate.


