  Framing idea: The asker wants a specification: what must a notion of "safe Pareto
  improvement" deliver, given a purpose. The purpose: as a guide to institutional/protocol
  design — i.e., a designer (or an AI system acting on behalf of a group of principals)
  choosing a modification to a game where you can''t rely on equilibrium selection
  or on players'' beliefs about each other. So the desiderata must come with the motivating
  cases.


