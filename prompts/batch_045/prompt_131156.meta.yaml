  cannot ever make the system more competent than the human, so the whole scheme is
  circular" — via a "no free lunch from recursion" style argument. Or concluding the
  opposite: "IA guarantees the resulting system is at least as aligned as the human"
  — which proves too much.


  Let me write an argument that seems to prove: any system produced by iterated amplification
  and distillation is either no more competent than the original human, or is guaranteed
  to be less aligned. Something like a dilemma.


