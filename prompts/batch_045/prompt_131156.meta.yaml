  Numbered steps:


  (1) The pipeline''s product at each round is M_n, obtained by supervised learning
  to imitate the amplified expert A(H) — i.e., M_n is a fast approximation to A(H).

  (2) Imitation cannot exceed its target: a model trained to reproduce a demonstrator''s
  behavior is, at best, as good as that demonstrator, and in practice somewhat worse,
  since fitting is lossy. So M_n''s competence ≤ A(H)''s competence.

  (3) Amplification is information-preserving in the following sense: A(H) has no
  source of knowledge about the task other than H. It adds only structure — sub-questions,
  extra time, copies, an aggregation rule — and rearranging H''s knowledge cannot
  add to it. So A(H)''s competence ≤ H''s competence.

  (4) By (2) and (3), competence(M_n) ≤ competence(H) for every n. Iterating doesn''t
  help, because each round''s starting point is already no better than H, and (2)–(3)
  apply to any starting point. So the "iterated" part buys nothing: the pipeline''s
  ceiling is the original human.

  (5) The only escape is to say that amplification adds something after all. The candidate:
  the extra compute. But compute only lets H use its knowledge more thoroughly; it
  doesn''t create the knowledge needed for tasks H can''t already do — and the tasks
  we care about (reviewing codebases, verifying specifications) are exactly ones where
  our reviewers lack the relevant knowledge.

  (6) So if the pipeline ever exceeds H, the excess cannot come from amplification.
  It has to come from the other place novelty can enter: the model''s generalization
  beyond its training data during distillation — the model does things no demonstration
  covered.

  (7) A generalization the human never demonstrated is not something the human endorsed.
  The human endorsed particular outputs on particular inputs; extrapolations between
  them are the model''s own, produced by an inductive bias the human didn''t choose
  and, in the case of a large pretrained model, didn''t even know about.

  (8) So the pipeline has this property: to the extent that its product is more competent
  than H, it is to that extent acting on unendorsed generalizations. Competence beyond
  the human and alignment with the human trade off one-for-one.

  (9) Since the whole selling point is exceeding human competence, and since (8) says
  every step past H is a step away from the human''s endorsement, iterated amplification
  cannot deliver both. It is either a very expensive way to clone our reviewers or
  an uncontrolled capability gain dressed up as supervision.


