  Setup paragraph:

  - We have a task (say, reviewing large codebases for subtle correctness/safety bugs,
  or writing security reviews). Human H = our reviewers, no formal ML background maybe.

  - Amplified expert A(H): H plus (i) the ability to spawn copies of itself to work
  on sub-questions, (ii) the ability to decompose a question into sub-questions recursively,
  (iii) much more time/compute, (iv) an aggregation step where the top-level instance
  combines sub-answers.

  - Distillation: supervised training of a fast model M on (input, A(H)''s output)
  pairs — or optionally on the whole decomposition tree ("procedure distillation").

  - Iterate: replace H with M_n to form A(M_n), distill to M_{n+1}.


