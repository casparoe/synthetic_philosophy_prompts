  Setup: I work in ML infrastructure. Read a summary of iterated amplification...
  Our team is considering it.


  The argument (a colleague''s, or my own):


  (1) IA produces a model M by supervised learning on demonstrations from an amplified
  expert A(H), where A(H) is H given the ability to consult copies of itself, break
  problems into sub-problems, use more time/compute.

  (2) Supervised learning on demonstrations can at best reproduce the function demonstrated;
  the distilled model M is a compression of A(H)''s behavior, and compression is lossy.
  So M is at best as competent as A(H), and in practice a bit worse. [competence ceiling]

  (3) A(H)''s competence is bounded by H''s: amplification gives H no new information
  about the world, only more ways to rearrange what H already knows — decomposition,
  more compute, self-consultation.

  (4) So no amount of iteration gets you a system more competent than H. [from 2,3]

  (5) But the point of IA is to produce systems that exceed human competence; and
  its proponents say iteration is how: each round''s model is used to build the next
  round''s amplified expert, so capability compounds.

  (6) The only way to escape (4) is if amplification adds something beyond rearrangement
  of H''s knowledge — but the only candidate source of novelty is the ML generalization
  in the distillation step, i.e., the model goes beyond its training data by interpolating.

  (7) Whatever the model learns by generalizing beyond the demonstrations is precisely
  not something the human endorsed: the human only ever endorsed the demonstrations
  they gave, and the distilled model''s extrapolations are its own.

  (8) Therefore IA faces a dilemma: either the distilled model is strictly bounded
  by human competence (no gain), or its extra competence comes from uncontrolled generalization,
  which by construction is unendorsed by the human. Either way, IA doesn''t give you
  both competence amplification and alignment preservation — and in particular, the
  more competent the product, the less aligned.


  That''s actually a pretty good argument. Where''s the subtle flaw? Several candidate
  flaws:


  - Step (2): "compression is lossy" — actually distillation can denoise: a model
  trained on many noisy demonstrations can average out idiosyncratic errors and outperform
  the average demonstrator, and even outperform the demonstrator on the specific inputs.
  Also, distilling many amplified consultations into a fast model can be better than
  a single amplified consultation because the amplified expert is stochastic / because
  the distillation aggregates over many episodes including diverse decompositions.
  That''s the real answer: distillation can beat the demonstrator via averaging over
  noise (regression to the conditional expectation is the best predictor under squared
  loss, better than any single sample). So (2) is subtly wrong: imitation need not
  be worse; training on the expert''s distribution gives the conditional mean, which
  under many loss functions beats sampling from the expert.


