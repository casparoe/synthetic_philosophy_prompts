  Let me design the argument carefully. Background: In iterated amplification (IA),
  you have a human H who can be "amplified" into an expert H+ by allowing recourse
  to sub-questions, decomposition, more time, copies of themselves, etc. Then you
  distill the amplified expert into a fast model M via supervised learning/imitation.
  Iterate: use M to amplify further, distill again, producing a system that outperforms
  the human at the task while (hopefully) remaining aligned with the human''s intentions.


  Key concerns: (a) competence: does distillation preserve competence, especially
  on out-of-distribution inputs? (b) alignment: does the decomposition into sub-questions
  and the aggregation preserve the human''s values/intentions? There''s the classic
  worry that amplification''s "divide and conquer" turns a value-laden holistic judgment
  into many narrow judgments, each of which individually looks fine, and aggregation
  loses the whole — analogous to the "Banana" problem / "the distilled model optimizes
  for the letter not the spirit". Also the "error amplification" or "compounding"
  worry, and the "who supervises the supervisor" worry re: the model generating the
  decompositions.


  Also there''s the known worry about "amplifying a weak expert can fail when the
  task requires knowledge the human lacks" — no, amplification is supposed to handle
  that.


