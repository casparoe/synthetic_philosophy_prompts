  - Each leaf: name (or "unnamed"), one awkward commitment, one observation that would
  disconfirm or seriously dent it (falsifiability tag), and one line on what it implies
  about whether we should keep doing active METI/transmitting powerful messages —
  say which leaves say shout, which say shut up, and whether any leaf is indifferent.

