  - Start node: everyone starts at "I accept that we have no convincing evidence of
  extraterrestrial technology anywhere we''ve looked, and I''m not counting UFO/UAP
  reporting as evidence."

  - Constraints: 8-10 branch questions; yes/no or choose-between-two-scenarios; no
  question names a hypothesis; no question is just "do you think aliens exist"; each
  question should be one where two positions that otherwise agree come apart; questions
  phrased as concrete scenarios or bets a 19-year-old non-major could answer; prune
  any question that doesn''t separate leaves.

  - Build from logical space: list the questions and the combinations first, then
  locate positions; note unoccupied combinations and diagnose (incoherent / unattractive
  / unexplored).

  - Required leaves (~8-10): rare-earth style (life/common, intelligence/technology
  rare), we-are-first/early + expansion is fast and hasn''t arrived (grabby aliens
  style), great filter ahead (civilizations destroy/short-circuit themselves), filter
  behind us, zoo/planetarium/quarantine (hidden by a more advanced civilization),
  dark forest (active concealment out of fear), they''ve stopped expanding / turned
  inward / aestivation / post-biological and we wouldn''t recognize their signatures,
  they''re already here but unrecognizable or in forms we don''t detect, we haven''t
  looked properly / data too weak, the question is malformed (expansion isn''t convergent
