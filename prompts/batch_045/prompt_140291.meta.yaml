  sign off on anything customer-facing.


  2. What I''ve read secondhand: the doctrine from Milton Friedman''s 1953 essay (the
  "F-twist"): judge models by predictions not assumptions; moreover the more significant
  the theory the more unrealistic its assumptions. Classic examples: expert pool player
  as if solving geometry; leaves as if maximizing sunlight. (No quotes; paraphrase.)


  3. My tentative principle (new/niche idea): call it the "sealed falsehood" rule:
  An unrealistic assumption is acceptable iff the falsehood is sealed behind the model''s
  export boundary — meaning (a) the exported quantities (the ones decisions actually
  consume) are insensitive to replacing the false assumption with any member of a
  specified family of alternative false assumptions ("swap-stability"), (b) the model
  has been validated on data from the same regime as the target use, not merely on
  historical data from a different regime, and (c) we can state the direction of the
  error the false assumption introduces, or show that downstream consumers only use
  an ordering/threshold and the error cannot flip the ordering. Also: compensating
  errors are not acceptable unless each error is individually sealed (because the
  cancellation is itself regime-specific).


