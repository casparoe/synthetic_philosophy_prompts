  Gut: not acceptable for the retry-policy question.


  Case B: An autoscaler''s cost model assumes requests arrive as a Poisson process.
  False (bursty, correlated arrivals). Used only to choose between two candidate scaling
  thresholds (an ordering decision), and a load test shows the ordering holds even
  though absolute predicted queue lengths are off by 2x. Gut: acceptable — false assumption,
  wrong absolute numbers, right ordering. (Nice: this tests the "ordering/threshold"
  clause.)


  Case C: A "digital twin" of a warehouse robot fleet assumes robots never collide
  and that the floor is empty of humans; both false. The model is used to decide the
  number of robots to buy. The two false assumptions push the throughput estimate
  in opposite directions (ignoring collisions inflates throughput; ignoring humans
  who slow robots down deflates it), and in the one calibration we have they roughly
  cancel. Gut: I don''t trust this even though it predicted the pilot throughput well.
  (Tests compensating-errors clause: cancellation is regime-specific; the pilot was
  during a slow period.) — This is a case where their tentative "swap-stability" rule
  might say OK (because swapping assumptions keeps output in tolerance?) or maybe
  it says not OK. We should make their rule give a verdict they''re unsure about.


  Case D: A physics-based renderer for a robot-grasping simulator assumes perfectly
  rigid bodies and frictionless contact. False (real objects deform, friction matters).
  Used to train a grasp policy that is then transferred to the real robot (sim-to-real).
  Gut: acceptable-ish, but only because we randomize (domain randomization) — i.e.,
  we deliberately inject variation around the false assumption. Hmm, that''s a nice
  wrinkle: the false assumption becomes acceptable because we randomize over a family
  of alternatives — exactly the "swap-stability" idea: they randomize physics params,
  effectively replacing one false assumption with a distribution. So the procedure''s
