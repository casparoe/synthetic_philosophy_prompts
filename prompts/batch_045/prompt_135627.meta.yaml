  \ is non-inferior to the resident physicians' in the hospital's own patient population;\
  \ (B) its error rates do not differ materially across the hospital's three largest\
  \ patient groups; (C) the notice and consent arrangements satisfy the hospital's\
  \ existing standards. My recommendation is that the board stop voting up-or-down\
  \ on the question \"shall we deploy\" and instead vote separately on A, B and C,\
  \ adopt an explicit decision rule stating which combinations of findings are sufficient\
  \ for deployment, record in the minutes which combination carried, and treat the\
  \ deployment decision as following from that record. Call this the reasons-first\
  \ proposal.\n\nTwo wrinkles in the charter that I have to address, and which I think\
  \ most writing on the discursive dilemma does not:\n\nFirst, thresholds. Findings\
  \ of fact are to be adopted by simple majority (four of seven), but any decision\
  \ to deploy requires a supermajority (five of seven). In the case I plan to put\
  \ on the board, A, B and C each pass four to three, yet only three members accept\
  \ all three, because the board splits three ways — two members accept A and B but\
  \ not C, two accept B and C but not A, two accept A and C but not B, and one accepts\
  \ all three. So the derived conclusion has the support of three of seven while every\
  \ element of it has the support of four of seven. I want to argue that the supermajority\
  \ requirement should be read as attaching to each element of the route rather than\
  \ to the number of members who endorse the whole route, and that a board which required\
  \ five members to endorse the whole route would in effect be requiring near-unanimity\
  \ on a conjunctive test. But I am not confident that this is the right reading,\
  \ and I expect it to be contested.\n\nSecond, the charter also says that any affirmative\
  \ deployment decision must be accompanied by a written statement of the considerations\
