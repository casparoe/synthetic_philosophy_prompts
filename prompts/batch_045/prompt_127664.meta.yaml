  - access_verdict — what GWT''s criterion gives, and the one-line reason

  - phenomenal_verdict — what your criterion gives, and the one-line reason

  - load_bearing_feature — the single feature of the case doing the work

  - if_removed — what happens to each verdict if you delete that feature


