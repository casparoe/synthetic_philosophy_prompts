  Draft:


  hey — I need a case built to order for my third-year seminar on consciousness. We''ve
  just done Block''s access/phenomenal distinction and then global workspace theory,
  and I want to show students that GWT''s criterion is really a criterion for access,
  not for phenomenology. The way I want to show it is with a dissociation case in
  the direction that usually gets fudged: full access, no phenomenology.


  What I need:


  The setup. One scenario, one paragraph, under 200 words. Ordinary human subjects
  in a clinic, ward, or psychophysics lab — no uploads, no exotic physics, no sci-fi.
  You get one hypothetical intervention or condition, which you should flag as the
  made-up bit and which should be a mild extrapolation from something real (a stimulation
  protocol, a lesion, a drug, a masking paradigm), not a magic device.


  The spec it has to meet: in the case, some content is access-conscious by GWT''s
  own lights — globally broadcast, sustained, reportable, available to working memory
  and to deliberate action and reasoning, with the subject''s confidence tracking
  their accuracy — and yet, by whatever criterion for phenomenal consciousness you''re
  using, there''s nothing it''s like for the subject with respect to that content.
  State your phenomenal criterion explicitly at the start and it can''t be defined
  in terms of report or availability, otherwise the whole thing collapses. And it
  can''t just be that the subject says "I didn''t see anything" — that''s a report,
  and a GWT person will just say the report is the evidence of access. The no-phenomenology
  verdict has to fall out of the mechanism plus your criterion, not be written into
  the story as "and there was no experience."


  Banned moves: blindsight and superblindsight, Sperling-style partial report / iconic
  memory overflow, zombies, anesthesia / sleep / coma / vegetative patients, split-brain,
  and any case where the subject is just confabulating or guessing.


