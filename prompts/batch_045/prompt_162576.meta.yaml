  Content plan:


  Opening persona: I teach an upper-level undergraduate seminar on rationality and
  reasons (14–16 students, one 90-minute session, no phones, no real money — I use
  chocolate/raffle chips). Last year I ran a trust game and it collapsed into a lesson
  about reputation in repeated interaction, which isn''t what I want.


  What I want: participants to feel the force of Parfit''s hitchhiker: stranded, driver
  offers lift conditional on a promise to pay on arrival; once arrived, the promise
  is costless to break, and everyone can see that in advance, so no lift is offered
  and both lose. And specifically the "rational irrationality" reading: the needed
  disposition must survive the agent''s knowledge, at the moment of action, that the
  reason to pay has evaporated — so binding yourself by a plan, a resolution, or a
  device isn''t obviously enough if at the moment you''re fully informed and free;
  what would have to be true is that it can be rational, earlier, to bring it about
  that you are later moved in a way that isn''t a response to your reasons at all.


  Constraints on the design:

  - One-shot and anonymous between strangers, so reputation and reciprocity can''t
  do the work; explain the mechanism (random pairing, ID numbers, sealed envelopes,
  never meet again / promise of no debrief on who did what? but debrief requires discussion
  — handle: the debrief is about aggregate stats, not individuals).

  - Stakes real but tiny, and arranged so paying is genuinely against the payer''s
  interest and not offset by guilt, friendship, or the facilitator''s approval (e.g.,
  the transfer is anonymous and goes to a pot for an opposing team / a rival seminar''s
  pizza fund... hmm, maybe: paying reduces your own raffle chances and benefits a
  stranger).

  - No external enforcement: no escrow, IOUs, contracts, phone cameras, apps. But
  students will propose these; the design must block them in a way that doesn''t feel
