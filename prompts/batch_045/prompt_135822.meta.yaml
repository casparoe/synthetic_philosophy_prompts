  roughly two to three centuries, through the coupled dynamics of population pressure
  and immiseration, elite overproduction, and the fiscal distress of the state, with
  the cycle closing when population decline and state collapse restore the conditions
  for renewed growth. I want you to tell me what would count against it.


  Please be precise about which components you are attacking... etc.


  Include:

  1. Rank defeaters from fatal to awkward.

  2. Distinguish what its defenders would themselves concede as counting against it
  from what only critics say.

  3. Address the "noise plus recovery" alternative: a damped/excitable system driven
  by exogenous shocks (plague, war, climate) can produce quasi-periodic instability
  with a long apparent period without any endogenous oscillator. What observable pattern
  — phase relations between real wages, elite numbers, fiscal capacity and unrest;
  amplitude scaling; response to shocks; behaviour in periods without major exogenous
