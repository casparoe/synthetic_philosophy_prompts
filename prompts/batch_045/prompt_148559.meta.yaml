  Draft:


  ---


  Wittgenstein''s target in the lectures is a picture of religious belief as an explanatory
  hypothesis on all fours with "there is a plane overhead". His point is grammatical:
  if you ask what difference it makes whether a man believes in a Last Judgment, you
  find that the difference isn''t that he expects a dateable event, but that the picture
  regulates what he does and how he weighs things — the way a man might be said to
  be governed by a picture of himself as judged, or by a picture of the suffering
  of others. So the religious utterance isn''t a prediction with poor evidence; it''s
  the sort of thing that stands at the top of a life rather than inside it.


  Now, does "not a hypothesis" entail "not answerable to evidence"? I want to say
  yes, and I think Wittgenstein''s view commits him to this. If a picture is genuinely
  regulative rather than descriptive — if it''s what you measure by rather than something
  you measure — then there''s no room for a check: any experience you might be tempted
  to call evidence against it is already going to be seen in its light. That''s why
  Wittgenstein says, in effect, that the religious picture is like a hinge proposition:
  it stands fast for the person who holds it, not because it''s well-supported but
  because it''s what support looks like from inside. Questions of evidence and doubt
  just don''t get a grip. This also makes sense of his insistence that the demand
  for grounds is itself a confusion: religion doesn''t need grounds, and asking for
  them is like asking for grounds for "here is a hand".


  On the Kesh: the sentence "it is keeping count" isn''t a hypothesis, because the
  community has ruled out in advance what would count against it — they say nothing
  could show the glacier had stopped. Nor is it really a belief, and I think the anthropologist
  is basically right: the sentence is a useful fiction, a device for coordinating
  behaviour and soothing grief, and the Kesh are, strictly speaking, wrong to think
  it says anything about the glacier. The interesting contrast is with the mourner
  who says "the glacier is keeping count" and then takes up a certain stance toward
  her dead: that''s the real content, and it''s a stance, not a claim. If a religious
  picture is on the Kesh model, the atheist and the believer aren''t disagreeing about
  anything — they''ve just adopted different stances — and the Wittgensteinian should
  welcome that consequence, since Wittgenstein''s own view is precisely that religious
  belief is a self-contained language-game with its own internal criteria, which philosophy
  can describe but which no outsider can properly assess or criticise.


  Finally, the "grammar not metaphysics" line is the bit that makes all of this safe.
  Wittgenstein isn''t saying anything about whether God exists; he''s pointing out
  that sentences like "God sees" work differently from "the cat is on the mat". Once
  you see that, the whole metaphysical dispute — theism vs atheism — dissolves into
  a difference of forms of life, and philosophy''s job is just to leave it alone.


