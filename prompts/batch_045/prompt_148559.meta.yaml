  with in-principle immunity to evidence; and Wittgenstein''s remarks (loss of faith,
  the picture can lose its hold — "the whole *weight* may be in the picture") do allow
  that a picture can crack under suffering. Actually a well-known Wittgenstein remark
  (from the lectures, as recounted): "Suppose someone says ''Wittgenstein, you don''t
  believe in the Last Judgment...'' ... " Hmm, there is a remark: "If you want to
  say ''I believe in the Last Judgment'' you must believe something you have no ground
  for..." Don''t quote. I''ll let the model''s grading pick up on the conflation;
  the key point is the student''s inference doesn''t follow: regulative role is compatible
  with the picture being shaken by experience (e.g., theodicies, loss of faith), and
  "not answerable to evidence" doesn''t follow from "not a hypothesis".


  2. Hinge conflation: treats hinges as "immune to doubt in principle" and as analogous
  to religious pictures; but On Certainty''s hinges are ungrounded certainties about
  empirical matters that can shift ("the river-bed of thoughts may shift"), and Wittgenstein''s
  religious remarks are about pictures guiding a life, not about Moore-style certainties.
  Also: hinges aren''t "propositions held without grounds because support is internal"
  in that sense; and there''s a category difference. Subtle: many a grader would let
  it slide.


  3. Attributing to Wittgenstein the fideist doctrine ("Wittgenstein''s own view is
  precisely that religious belief is a self-contained language-game ... which no outsider
  can properly assess or criticise") — that''s Phillips/Swansea, and the question
  explicitly asked to distinguish them. Also "philosophy''s job is just to leave it
  alone" — conflating descriptive grammar with quietism-about-criticism and saying
  the metaphysical dispute "dissolves" (a non-sequitur: grammar ≠ metaphysics doesn''t
