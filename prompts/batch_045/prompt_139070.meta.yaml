  Heuristic arguments: e.g., Cramér''s model of primes: treat "n is prime" as an event
  with probability 1/log n, assume independence, derive conjectures (twin primes ~
  C n/(log n)^2). Hardy–Littlewood prime k-tuples with the singular series correcting
  for local congruences — which is a case where naive independence fails and is corrected
  by a "local-to-global" correction factor. Also Polya''s conjecture / the Mertens
  conjecture — cases where heuristics (or numerics) misled. Also the "Law of Small
  Numbers" (Guy). Also: the prime number theorem vs. Chebyshev''s bias. Also: the
  Cramér vs. Maier controversy — Maier''s theorem (1985) showing that Cramér''s model
  gives wrong predictions for short intervals, because primes are not independent
  in the needed way at that scale; this shows the independence presumption can fail
  even after local corrections. That''s a great teaching example for "breaking the
  heuristic."


  Also relevant: the "presumption of independence" in philosophy of science / Bayesian
  epistemology: when we have no reason to think A and B are correlated, do we set
  P(A|B) = P(A)? That''s a version of the Principle of Indifference applied to conditional
  probabilities (cf. "independence version of the principle of indifference"). Also
  objective Bayesianism: maxent, and the idea that independence is the maxent distribution
  given marginals. That''s a nice formal anchor: maximum entropy gives you independence
  given marginals — i.e., the presumption of independence is what maxent yields. And
  there''s the issue of which partition/algebra you apply maxent over — the partition-dependence
  problem (van Fraassen''s "judgmental" vs. "credal"?). Actually, the maxent-dependence
  on the choice of partition is a known problem ("the problem of the reference class"/"partition
  problem for maxent"): maximizing entropy over a partition of n cells gives uniform;
  coarse-graining changes it. This is a nice in-the-weeds idea: the presumption of
  independence is not scale-invariant — you get different answers depending on which
  algebra you impose it on. That''s the deep structural point: independence is a property
  relative to a chosen set of variables, and refinements break it.


  So the teaching session: 75-minute seminar for advanced undergraduates / mixed audience.
  Order of ideas:

  1. What a heuristic argument is (vs. proof; vs. conjecture-generating device).

  2. The bare form: assign probabilities to events, presume independence, compute,
  then check against data.

  3. The carrying example: twin primes / Hardy–Littlewood: naive 1/log n independence
  gives n/(log n)^2 but misses the constant — the singular series correction from
  local congruence obstructions (mod p). So: "independence fails locally (mod 2, mod
  p), and you must correct rather than assume."

  4. Then: what "formalizing the presumption" would come to — options: (a) indifference
  over correlation parameters, (b) maxent given marginals, (c) exchangeability/de
  Finetti — but exchangeability gives positive correlation, not independence; (d)
  a "no-correlation-without-a-mechanism"/"screening-off by a common cause" principle
  (Reichenbach). Actually Reichenbach''s common cause principle: dependencies require
  explanation by a common cause or direct causal link; independence is the default.
  That''s a nice philosophical anchor: the presumption of independence = the default
  that dependencies need to be explained. And its formalization problem: what counts
  as a candidate common cause? And "no unconceived correlation" — cf. the "problem
  of unconceived alternatives" (Stanford). Also, the "reference class"/"coarsening"
  problem.

  5. The failure case: Maier''s theorem / Cramér''s model wrong about prime gaps in
  short intervals — shows independence presumption can survive local correction and
  still fail at a scale you didn''t tune.


  Misconceptions to expect:

  - "The heuristic gives you a probability that the conjecture is true" — no, it gives
  a conjectured value/density, and the heuristic is not a Bayesian posterior over
  the conjecture.

