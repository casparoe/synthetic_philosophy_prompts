  I teach a mixed graduate and advanced-undergraduate seminar called "Reasoning Without
  Proof," and in three weeks I have one seventy-five-minute session on probabilistic
  heuristic arguments in number theory — specifically, on what the presumption of
  independence inside such an argument is, and what it would take to make it more
  than a presumption. The students have had a first course in probability (up to conditional
  expectation, no measure theory) and no number theory beyond the infinitude of the
  primes. About half of them are philosophy students who will arrive wanting to know
  whether a heuristic argument of this kind gives anyone a reason to believe the conjecture
  it produces.


  Please do not write the explanation. Plan how I should give it, as an ordered sequence
  of moves with rough timings, and tell me what depends on what.


  The specific things I need settled:


  1. Which comes first: making them watch a heuristic actually produce a number, or
  making them confront that the target is deterministic — there are no chances in
  the primes, and every event the model assigns probability 1/log n to either happens
  or doesn''t — so that the probabilities have to be read as an "as if" device calibrated
  against counts rather than as chances? My instinct is the first, but I can also
  see that if I don''t handle determinism early, the philosophers will spend the rest
  of the hour stuck on it.


  2. The one example to build the session around, and what it must have and lack.
  I have been using the heuristic for the density of twin primes: treat n and n+2
  as prime independently with probability 1/log n, get the right order of growth,
  and then note that the constant is wrong and is repaired by a correction factor
  — an explicit product over small odd primes — that compensates for local congruence
  obstructions (n and n+2 are both odd; an admissible pair avoids certain residue
  classes mod p). It has the virtues that the correction is something I can derive
  in front of them and that it is visibly a local-to-global repair of a failed independence
  assumption. It has the vice of drowning non-majors in logarithms. Keep it or replace
  it, and say why.


  3. Where to place a local notion of mine, which I call the calibration rule: do
  not trust an independence-based heuristic unless the same presumption, applied at
  a scale small enough to check by brute force, reproduces the answer that is already
  known at that scale. I want to know whether this is a real constraint or false comfort.
  My suspicion is the latter in one specific sense — a presumption can be exactly
  right at every computable scale and still fail asymptotically, as in Maier''s theorem
  on the numbers of primes in short intervals, where Cramér''s random model gives
  the wrong answer. If so, the rule is a filter on nonsense rather than a defense
  of the extrapolation, and I should present it that way rather than as a vindication.
  A related habit I have is making them list, explicitly, which correlations the argument
