  I design and maintain knowledge-graph schemas for a living. My team runs a middle
  layer — internally, the registry — that merges legacy databases from separate departments
  into one typed interface, and it has a small number of primitives that were forced
  on us by that history:


  - declared kinds: named classes that a data owner asserts a record into. Membership
  is stipulation, not computation, and a declared kind can perfectly well be empty.

  - derived kinds: classes defined by a predicate over records, computed at query
  time, with no owner and no assertion.

  - aspects: named slots on a record. An aspect can repeat, so one record can carry
  COLOR at index 1 and index 2 with different fillers (patches of a painted object);
  an aspect''s filler can itself be a record, so a single aspect occurrence can be
  reified as a node with its own identifier.

  - co-tickets: a third table, added during a merger, whose rows assert that two aspect
  occurrences in different records are the same occurrence (we invented it because
  two departments had independently recorded the same patch of paint, and we needed
  to keep their records from double-counting it).

  - identity-bearing aspects: a flag on the schema saying that a record cannot lose
  this aspect and still be merged as the same record. We use it for cross-source record
  linkage; we do not use it for anything else.


  My working vocabulary beyond that is a data modeler''s and a programmer''s: type
  vs. token, intension vs. extension, nominal vs. structural typing, subtyping and
  inheritance, interfaces and implementations, validation against a schema, duck typing,
  nullable and repeated fields, reified relations, and the distinction between "is
  an instance of" and "is a subtype of". I have some second-hand acquaintance with
  type theory — universes of types, higher kinds, dependent types — but I would not
  call myself fluent. I have no metaphysics, and I do not want a glossary of it.


