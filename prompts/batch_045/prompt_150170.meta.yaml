  Then background:


  "Here is the dilemma in my novel. The Republic of Veridia is a wealthy, militarily
  secure state with recognized borders and no serious external enemy. Over the last
  generation its public life has become shallow: citizens are absorbed in private
  consumption, civic associations have decayed, and the political class is lazy and
  corrupt. There is no military threat to Veridia and no dispute with any neighbor
  that imperils its independence. A faction in the cabinet, advised by a Hegelian
  philosopher, proposes to launch a short, limited war against a much weaker neighbor
  over a trivial border incident. The war is not intended to conquer territory or
  to meet any real security threat; its openly stated purpose is to shock Veridian
  society out of its decadence and restore the collective courage and willingness
  to sacrifice that the cabinet believes have been lost. Some soldiers and civilians
  will die, though the war is expected to be brief. The question is whether, on a
  Hegelian view of war, this policy could be justified."


