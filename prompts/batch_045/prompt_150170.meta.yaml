  that in Hegel''s political philosophy there is no judge or tribunal above states;
  each state is sovereign and must decide for itself what its independence and ethical
  life require. He added that Hegel criticizes the Kantian project of a federation
  of states to enforce perpetual peace, precisely because states as particular wills
  cannot be subordinated to a higher legal authority. From this he inferred that,
  if Hegel also holds that a long peace corrupts a people and that war preserves the
  ethical health of a nation much as winds keep a sea from fouling in a long calm,
  then a state is entitled — perhaps even required — to use war as a remedy for internal
  decay. Because the cabinet sincerely judges that Veridia''s ethical health depends
  on this limited war, and because no external authority can overrule the state''s
  own judgment of necessity, the war is justified in Hegelian terms."


