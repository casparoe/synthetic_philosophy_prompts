  to start wars as therapy. More importantly, Hegel grounds the state''s right to
  demand the sacrifice of citizens'' lives and property in the defense of the state''s
  independence as a substantial end. A war deliberately begun to cure domestic corruption
  does not aim at protecting Veridia against any threat to its recognized independence;
  it treats the deaths of citizens as instruments for collective psychological renewal.
  That, the historian said, is exactly the abstract and instrumental attitude toward
  individuals that Hegel''s organic conception of the state rejects. A government
  that manufactures a war for this reason acts from the arbitrary will of a faction,
  not from the substantial will of the state."


