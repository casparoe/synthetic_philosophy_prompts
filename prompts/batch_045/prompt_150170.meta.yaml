  the state''s long-term independence: a people that has lost the capacity for sacrifice
  cannot defend its freedom in the future. On this view, preventing future corruption
  is indirectly about preserving independence. He added that the imagery of winds
  and the sea is precisely about the therapeutic function of negativity; Hegel is
  no pacifist, and he does not treat peace as an unconditional good. The theorist
  concluded that the historian was quietly importing a Kantian or liberal standard
  that Hegel himself rejects."


  "The historian''s second move (4) answered that the theorist was stretching the
  concept of independence beyond recognition. He said that, for Hegel, the kind of
  war that justifies sacrifice is one in which the state''s independence is at stake
  against another state, not a forecast of internal softness. The absence of a higher
  court explains why war cannot be abolished from international relations; it does
