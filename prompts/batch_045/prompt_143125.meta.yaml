  ---


  For about three years a reading group I belong to has been stuck on the same question:
  what is going on, evaluatively, in a hard choice — the familiar kind where one option
  is better in some respects and worse in others, where the options feel "in the same
  league" but neither seems better, and where picking either seems rationally permissible
  but not rationally required. We agree on every case and on the phenomenology. We
  do not agree on what follows. Three positions have stabilized:


  (1) The trichotomy is not exhaustive. Beyond better, worse, and equally good there
  is a fourth relation (call it parity): the options are comparable — you can see
  that neither is better — yet not equal. Hard choices are the cases where this relation
  holds. The main support is a tolerance argument: when A and B stand in this relation,
  no small improvement to A makes A better than B, and this is held to rule out equality,
  since equality would be broken by any small improvement.


  (2) The trichotomy is exhaustive. Comparison is always well defined but often vague,
  or imprecise, or beyond our epistemic reach; "neither better nor worse nor equal"
  describes our epistemic situation, not the values. Hard choices are cases where
  the balance is indeterminate or unknown, and permissibility follows from that.


  (3) The values genuinely underdetermine the choice, and what settles it is the agent''s
  own commitment; the reason for choosing comes into being with the choosing, so there
  is nothing here for a theory of value to discover.


