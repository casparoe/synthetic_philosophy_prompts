  \ the flaw is elsewhere.\n\nI want the flaw to be genuinely subtle and located in\
  \ one step, with plausible alternatives each costing something. Let me design so\
  \ the \"intended\" flaw is a scope/quantifier shift between steps 5-7 (from \"can't\
  \ satisfy all\" to \"no constraint discriminates\"), plus the equivocation on \"\
  fair\" (from \"satisfies a necessary condition\" to \"all-things-considerations\"\
  ). And also the hidden assumption that the criteria are each individually *necessary*\
  \ (2) — maybe the actual lesson is that some are not necessary conditions of fairness\
