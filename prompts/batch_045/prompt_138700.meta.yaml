  \ of each criterion as an independent necessary condition; instead, they're competing\
  \ operationalizations, and the trilemma is a *reductio of the operationalist research\
  \ program*, not of fairness.\n\nWhere does it \"prove too much\"? If it's sound,\
  \ then \"no algorithm can be fair\" — but also \"no human can be fair\", and \"\
