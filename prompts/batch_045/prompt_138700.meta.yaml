  \ Or an equivocation between \"fair\" as a property of a decision rule vs. \"fair\"\
  \ as a property of an outcome distribution.\n\nAlternatively: habitat destruction\
  \ + prove too much. Or HCH + make an argument.\n\nI think \"impossibility results\
