  \ me inject a niche invented idea.\n\nAlternatively, the taxonomy type with habitat\
  \ destruction — \"taxonomy of positions on whether habitat destruction reduces wild\
  \ animal suffering\" with branch questions. That's also good but the \"prove too\
  \ much\" seems richer and harder.\n\nLet me think about the \"prove too much\" argument\
  \ design carefully.\n\nSetup: The asker is personally relevant — e.g., they work\
  \ at a criminal justice agency / a pretrial services office, or a county that uses\
  \ a risk assessment tool, and they're on a committee deciding whether to keep using\
  \ it. Or: they're a data scientist at a hospital? Let's make it personal and casual:\
  \ \"I'm on the county's pretrial services advisory committee\" — they use a risk\
  \ assessment instrument (like PSA or COMPAS). They got emailed an argument by a\
  \ colleague/activist.\n\nActually maybe better: personal relevance — they build\
  \ models at a company that does lending or hiring and they've been asked to sign\
  \ off on a fairness audit. Or a friend sent them an argument. Let's do: they volunteer\
  \ on a committee; a law-student intern wrote a memo.\n\nNow the argument. Let me\
  \ construct a \"prove too much\" argument:\n\nClaim: The impossibility results show\
  \ that \"algorithmic fairness\" is not a real constraint — any risk score is unfair,\
  \ so fairness constraints can only be political choices, and hence there's no point\
  \ auditing; more strongly: since no algorithm can be fair, the algorithm can't be\
  \ the locus of the objection, so algorithms are off the hook and we should just\
  \ look at the underlying process.\n\nArgument sketch:\n\n(1) A decision procedure\
  \ is fair only if it satisfies all the standard fairness criteria that apply to\
  \ it. (Or: \"A risk score is fair only if it doesn't treat otherwise-similar people\
  \ differently and only if its errors are distributed evenly across groups.\")\n\
  (2) Calibration (predictive parity / equal PPV), and equal false positive rates,\
  \ and equal false negative rates are each such criteria — each is individually necessary\
  \ for fairness.\n(3) When groups differ in base rates, no non-trivial score can\
  \ satisfy all three simultaneously (unless perfect prediction or equal base rates).\n\
  (4) Base rates do differ (in the actual data, for the groups being compared), and\
  \ the tool is not a perfect predictor.\n(5) So the tool is unfair, and moreover\
  \ any replacement tool would be unfair too, and so would human judges making the\
  \ same kind of predictions.\n(6) So \"unfair\" here can't be a criticism of the\
  \ tool in particular — the unfairness is inherited from the world, not made by the\
  \ algorithm.\n(7) Therefore there is no such thing as a fair risk score, and no\
  \ fairness constraint can discriminate between candidate tools; the only real questions\
  \ are about the underlying rates (i.e., about the world), not about the algorithm.\n\
  (8) So: drop the fairness audit, nothing to audit.\n\nWhere's the flaw? Several\
  \ candidate flaws:\n\n(a) The impossibility result is about simultaneously satisfying\
  \ criteria for a fixed definition of the outcome and a fixed pair of groups; the\
  \ argument equivocates between \"no algorithm satisfies all criteria\" and \"no\
  \ algorithm satisfies any criterion\" — the impossibility result constrains but\
  \ doesn't eliminate: the set of achievable (FPR, FNR, calibration) combos is a constrained\
  \ Pareto frontier, and the choice among them is substantive. So (7) overstates:\
  \ impossibility ≠ indifference/arbitrariness. A constraint can rule out most of\
  \ the space without picking a point.\n\n(b) Quantifier scope: the impossibility\
  \ results hold for a *binary* decision threshold applied to a score, and require\
  \ the score to be non-trivial; also they compare groups *defined by* the same features\
  \ used in the outcome... Actually key: the impossibility results assume a *fixed*\
  \ outcome definition Y and fixed group membership. Changing the outcome variable\
  \ (e.g., defining Y as \"would be arrested for a new crime if released\" vs. \"\
  would commit a new crime\") or changing what the score is used for (ranking vs.\
  \ thresholding, or the decision being a resource allocation) can dissolve the trilemma.\
  \ E.g., if you use scores only for ranking (ordinal), calibration is not defined\
  \ but balance is; or if you decouple: use different thresholds per group? That just\
  \ is a choice among criteria.\n\n(c) The step from \"the unfairness isn't made by\
  \ the algorithm\" to \"there's nothing to audit\" — the algorithm can still be the\
  \ best lever, and \"inherited from the world\" mislocates: the choice of *which*\
  \ point on the frontier, and which criterion to sacrifice, is a decision the tool\
  \ designer makes, and it's a moral decision. Also the algorithm can make things\
  \ worse than the human baseline even if it can't be perfect.\n\n(d) A subtle flaw:\
  \ (1) and (2) with (3) — the impossibility result requires that the *score* not\
  \ be constant within group... Actually Kleinberg: any three of {calibration within\
  \ groups, balance for positive class, balance for negative class} — you can't have\
  \ all three, given differing base rates and imperfect prediction. Hmm, actually\
  \ Kleinberg's version: calibration + balance+ + balance− impossible unless base\
  \ rates equal or prediction perfect. Chouldechova: equal FPR + equal FNR + equal\
