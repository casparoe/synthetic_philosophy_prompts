  Right, imagine I’m trying to get my head round Berkeley’s take on money by running
  it against the South Sea Bubble, roughly as it happened in 1720. The version of
  Berkeley I have in mind is the economic one from his 1730s set of queries, The Querist:
  he argues that gold and silver aren’t the real wealth of a country, the real wealth
  is the industry of its people, and money is best thought of as a ticket or counter
  that sets that industry in motion and lets its holder draw on the labour of others,
  rather than as wealth in itself. I’ll give the Bubble facts so you don’t need to
  recall them: the South Sea Company offered to take over a large slice of Britain’s
  national debt in return for trading privileges, its shares then rose enormously
  on optimistic expectations and on easy credit, a lot of government annuitants swapped
  their annuities for stock, subscribers bought shares with borrowed money, and later
  in 1720 the price collapsed in a general financial panic that ruined many investors.


  What I want is a careful mapping of the episode through that Berkeleyan lens, then
  a look back at the theory. First, recast the players: once money is a ticket for
  industry rather than a commodity, who counts as a player? Say what the Company,
  the government, the annuitants, the credit-financed subscribers, and the wider population
  of labourers and projectors are each really doing in terms of industry and tickets.
  Then the options and payoffs: for an annuitant, swapping a stream of tax-backed
  payments for a share in a monopoly; for a subscriber, buying stock with a small
  down payment and borrowed rest; for the Company, issuing stock to retire public
  debt. What does each option look like as a move to command real industry, and which
  of them are really just trades in tickets?


