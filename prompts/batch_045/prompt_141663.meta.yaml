  (A) "Their point was empirical: most traits are not adaptations." — Overstates;
  the paper is a methodological critique (Gould & Lewontin: adaptationist programme
  is untestable in practice, needs alternatives), and they wouldn''t commit to "most
  traits". Modern defenders would say the spandrel-status of most traits is an open
  empirical question. Good error #1: methodological critique recast as an empirical
  claim about proportions.


  (B) "the adaptationist programme — the assumption that every trait was shaped by
  selection for the job it does now" — Their target was more specifically the atomizing
  Panglossian approach; the "every trait" bit is a strawman-ish overstatement of what
  adaptationists actually hold (adaptationists explicitly allow drift, constraints;
  the "adaptationist programme" as they define it is about the near-universal reach
  of selection plus atomization + optimality). Mild.


  (C) The killer subtle error: "the key test they proposed is simple: before accepting
  an adaptationist explanation, ask whether the trait could have arisen as a side
  effect instead. If it could, it''s a spandrel until someone proves otherwise." —
  This (i) inverts the burden of proof to license dismissing any adaptationist hypothesis,
  (ii) conflates "could have arisen as a by-product" (which is almost always possible
  for anything) with evidence that it did, and (iii) most importantly conflates origin
  as a spandrel with current utility — precisely Gould''s distinction between historical
  origin and current utility; a spandrel can be co-opted (exaptation) and further
  shaped by selection, so "it''s a spandrel" doesn''t tell you it''s not currently
  an adaptation. That''s the crux and it''s beautiful: the summary''s "spandrel =
  not an adaptation for what it does now" collapses Gould''s own distinction. Good
