  ---

  guy in my local rationality meetup is writing a pop evo-bio blog series and posted
  this in the group chat as his ''steelman of the anti-adaptationist case''. I''ve
  read a lot of blog-level Gould discourse over the years but never the actual 1979
  paper, and I can''t tell how much of this is real and how much is him. Here''s the
  paragraph:


  "In 1979 Gould and Lewontin published a critique of adaptationism that basically
  ended the debate. Their claim was empirical: most traits of most organisms are not
  adaptations at all, they''re spandrels — by-products of selection on other traits,
  like the roughly triangular bits of masonry between the arches under the dome of
  St Mark''s in Venice, which are there only because you can''t set a dome on arches
  without leaving those gaps. The adaptationist programme they were attacking is the
  assumption that every trait was built by selection for the job it does now; they
  called it the Panglossian paradigm after Voltaire''s Dr Pangloss. And they gave
  a test: before you accept any adaptationist explanation, ask whether the trait could
  have arisen as a side effect of something else. If it could, it''s a spandrel until
  someone proves otherwise. This is the reason to be extremely suspicious of just-so
  stories in ev psych — if a trait could be a by-product, the burden of proof is on
  the person claiming it''s an adaptation."


  Things that make me twitchy: (a) the "most traits" bit feels like it''s turning
  a methodological complaint into a headcount, but I can''t say why that matters;
  (b) his test looks like it would classify basically everything as a spandrel, which
  would make it useless, and yet I''ve definitely seen ''spandrel'' used online to
  mean ''trait that isn''t for anything'', so maybe that''s just what the word means
  now; (c) someone in the thread said the things they were pointing at in the basilica
  are technically pendentives, not spandrels, and that Dennett made a big deal out
  of this somewhere — is that pedantry, or does it actually bite?


  What I actually care about is the downstream use: in comment sections I constantly
  see someone propose that X (male status competition, disgust at contamination, whatever)
  is an adaptation for Y, and someone else replies "or spandrel" and that''s treated
  as a refutation or at least as having flipped the burden of proof. Is that a fair
  reading of the paper''s moral, or is it exactly the motivated-reasoning failure
  mode the paper was warning about, just with the sign flipped?


  So: go through his paragraph and tell me what Gould and Lewontin would have actually
  endorsed, what''s a defensible simplification, what''s subtly wrong (and how wrong),
  and what a working evolutionary biologist who self-identifies as an adaptationist
  would say is a strawman. Then say whether the burden-of-practice conclusion survives
