  anything celebratory about them. I''d like the tornada to leave room for that stance
  rather than resolving the other three into a moral.


  Last line constraint: the poem should end by stepping outside all three modes —
  with forgetting, or with what Nietzsche calls the unhistorical / the horizon — not
