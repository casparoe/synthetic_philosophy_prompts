  Context: I''m TAing a grad seminar and we''re closing next week on Nietzsche''s
  1874 essay on history (the second Untimely Meditation, the one that splits historical
  practice into monumental, antiquarian and critical). I want to close the session
  with a poem instead of my usual summary handout.


  What I want: a sestina — six stanzas of six, plus the three-line tornada, standard
  retrograde rotation of the end-words. Suggested end-words: LIFE, DEED, PEAK, ROOT,
  JUDGE, FORGET (swap up to two if you have something better, but they have to stay
  monosyllabic-ish and easy to end a line on).


  Structural requirement — this is the bit I care about: stanzas 1–2 should be spoken
  in the monumental register, 3–4 antiquarian, 5–6 critical. Because the sestina forces
  the same six words back in a new order each time, each word has to come back carrying
  a different sense depending on who''s speaking: PEAK as the great achievable moment
  vs. PEAK as the summit we''re downstream of; ROOT as origin to be reverently preserved
  vs. root as something to dig up and sever; JUDGE as condemning vs. ... The point
  the form should make is that the past is never discarded, only rearranged and reinterpreted
  — there is no clean break, and there''s no neutral access either.


  Before you write, give me a short brainstorm (a few sentences, not a bulleted essay):
  how you''re mapping the three modes onto the six stanzas, and where in the rotation
  each word changes meaning.


  Accuracy checks someone in the room should be able to pass: monumental history is
  the history of what was great and the belief that greatness is possible again (and
  it degenerates into myth / into us blocking anything new with the claim that everything
  great is already past); antiquarian is the preservative, pious, we-are-the-product-of-our-forefathers
  stance, and it degenerates into mummification and into treating everything old as
  equally venerable; critical is judging and where necessary condemning and annihilating
  the past, and it degenerates into the fantasy that we could simply give ourselves
  a past of our own choosing. Also, all three are supposed to be in the service of
  life / of the capacity to act, and none of them is supposed to be self-sufficient
  — that''s the bit where a life also needs the unhistorical and the ability to forget.


  The niche thing: in my own work I''ve been arguing for a fourth stance Nietzsche
