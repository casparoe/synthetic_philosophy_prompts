  isn''t alive, no metabolism, no membrane of its own, it''s a machine assembled inside
  somebody else''s cell; and both of them are, apparently, correct. I was talking
  too a philosopher friend about whether "both correct" here means anything more than
  "we stopped arguing," and she said what I actually want is Jain anekāntavāda, the
