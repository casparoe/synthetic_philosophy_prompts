  of home + value derives from collectively produced amenities → joint right to decide
  terms of admission]

  (4) Zoning — minimum lot sizes, height caps, bans on multifamily — is just the exercise
  of the membership right: a specification of the terms of admission.

  (5) Nobody has a right to be admitted on terms other than those the members set;
  if you have no right to X, excluding you from X violates nothing and wrongs you
  not at all.

  (6) Therefore exclusionary zoning violates no one''s rights, and the people who
  practice it — "NIMBYs" — owe newcomers nothing; more strongly, "NIMBY" is not a
  moral criticism at all but a slur for the ordinary exercise of a property right.

