  **Three Molochs** (working title)


  Setup: The word "Moloch" in rationalist-adjacent writing is used for roughly: situations
  where many agents each do something locally reasonable and the result is worse for
  everyone, and where no one can stop without being disadvantaged. I want to argue
  the word is doing three different jobs, and that conflating them leads to bad prescriptions.


  M1 — the equilibrium trap. Static. Payoff matrix: mutual cooperation 3/3, unilateral
  defection 5/0, mutual defection 1/1. Everyone defects. Diagnosis is about the structure
  of the game at a time; remedy is to change payoffs (tax, punish, subsidize), or
  change the game (bundling, repeated interaction, correlated signals). Standard.


  M2 — the selection trap. Here no one plays their game badly, or at least the badness
  isn''t the point. The point is that agents/institutions/firms differ in their willingness
  to exploit, and the exploiting type grows as a share of the population, or survives
  while the scrupulous type dies. Even a group that collectively hates the outcome
  is dragged along, because the composition of the group changes. Key diagnostic:
  look at whether the outcome would persist if you replaced every current agent with
  a cooperator — if yes, it''s M1; if no, it''s M2. Remedy: change the gradient (restrict
  the exploitative advantage), reduce the turnover rate, or lengthen the time horizon
  over which selection operates. Note: "just coordinate" is useless here, because
  the defectors aren''t in the room — they''re the ones who will exist later.


  M3 — the intra-agent trap (the bit I think is under-theorized). Selection doesn''t
  only operate between agents; it operates within them. Inside a person: habits, impulses,
  attention-grabbing routines compete for realization, and the ones that win are the
  ones with fast, local, legible rewards; they degrade the person''s shared internal
  resources — time, attention, capacity for deliberation, sleep, reputation, savings.
  Inside an organization: subunits compete for budget and headcount, and the ones
  that win are those that produce measurable short-cycle output; they eat the shared
  resources — esprit, institutional memory, maintenance, slack. The trap is "multipolar"
  in the same way: many small processes, each capturing a benefit it fully enjoys
  while paying only a fraction of the cost to the shared pool. What''s distinctive:
  the selecting environment is faster than the agent''s own deliberation, so "decide
  to stop" is not available in the way it is (arguably) in M1. Remedy: not resolve
  but architecture — precommitment, changing what''s legible (measurement), internal
  prices, friction. Also: the interesting moral-psychology upshot is that weakness
  of will looks less like a failure of the will and more like an M3 trap, which reframes
  akrasia as a design problem rather than a character problem.


  Second axis: slope vs cliff. In a slope trap, harm is a smooth function of total
  defection, and each increment is small; no single increment is detectable or blameworthy,
  so interventions that depend on noticing damage arrive too late (fish stocks, soil,
  attention, trust). In a cliff trap, harm is near-zero until a threshold and then
  collapses; here the striking feature is that the last defector before the threshold
  makes all the difference, yet has no reason to think they''re the last, and the
  person who crosses is often not worse off than anyone else — pure moral luck in
  the wrong direction. Slopes want continuous price-like mechanisms, slow feedback
  made fast (measurement, leading indicators). Cliffs want buffers, redundancy, and
  governance of the distance-to-threshold rather than of the behavior itself. And
  crucially the two get confused: people treat slope problems as if they had a cliff
  (waiting for a crisis to act) and cliff problems as if they had a slope (assuming
  gradual reform is safe).


