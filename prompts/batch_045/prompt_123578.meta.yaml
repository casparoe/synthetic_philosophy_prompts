  I spent last evening arguing with an old university friend about whether taxation
  is theft. We got nowhere on the verdict, but I came away more interested in a move
  I kept catching him making — and, when I am honest, catching myself making in the
  opposite direction. I would like to know whether that move has a name; more than
  that, I would like it carved out precisely from the several things it resembles,
  including the ones I can already think of myself.


