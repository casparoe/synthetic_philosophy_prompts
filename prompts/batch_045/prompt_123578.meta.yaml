  a product of law — contract enforcement, limited liability, planning permission,
  a land register, a currency, the rules of intestacy — gets treated as the natural
  or pre-political baseline, with the result that the tax imposed on top of it carries
  the entire burden of justification. What shaped the baseline is described as the
