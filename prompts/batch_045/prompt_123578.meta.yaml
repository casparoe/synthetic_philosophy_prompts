  not applied even-handedly: when a transfer runs in a direction my friend dislikes
  it is a taking, with agents and victims and a demand for reasons; when it runs the
  other way, or is old enough to have hardened into what people expect, it is part
  of the furniture of the world, and asking after its justification is treated as
  a category mistake. He will concede in one breath that, in any deep sense, nobody
  has pre-tax income, and in the next breath rank fiscal schemes by how far they depart
