  I teach a final-year undergraduate seminar in philosophy of physics, and I''m writing
  the exam paper. I want one essay question on the reality of the quantum state that
  cannot be answered by writing down the ψ-ontic/ψ-epistemic distinction and reporting
  that a famous theorem refuted the epistemic side.


  Constraints on the question. It must be answerable in 45 minutes in about 1,000
  words, closed-book, with no mathematics beyond whatever the question itself supplies.
  So state every distinction and every result the student needs inside the question:
  in particular, give the ψ-ontic/ψ-epistemic contrast in the ontological-models formulation
  (a model is ψ-epistemic just when distinct quantum states can be represented by
  overlapping probability distributions over the underlying physical states), and
  paraphrase in your own words the content of the 2012 no-go result of Pusey, Barrett
  and Rudolph — that no model in which the quantum state is mere information about
  an underlying physical state, and in which independently prepared systems have independent
  physical states, can reproduce the predictions of quantum theory. Nothing in the
  question should depend on the student having read a particular paper.


  The crux I want students to have to separate is this: [a] the ψ-ontic/ψ-epistemic
  question, [b] the question whether the wavefunction is a physical object (a field
  on a high-dimensional configuration space) as opposed to something more nomological
  — a codification of the dispositions of matter or of the dynamics rather than a
  piece of the furniture — and [c] the option of keeping a ψ-epistemic model by denying
  the independence assumption. A candidate who runs these together has missed the
  point of the question; one who distinguishes them but thinks that settling [a] settles
  anything about [b] has half-missed it.


  To make [c] do real work rather than being a gesture, ask the candidate to construct
  the strongest version of the independence-denying reply and then to say what it
  owes us: how two preparations we treat as independent could come out correlated
  in their underlying states, and how that move differs from — or collapses into —
  the familiar complaint against superdeterminist responses to Bell''s theorem.


  And I want the question to end somewhere harder than taxonomy: require the candidate
  to compare the cost of giving up independence with the cost of accepting a wavefunction
  living on a configuration space of enormous dimension (including the difficulty
  of recovering the appearance of ordinary three-dimensional goings-on), to say whether
  those two costs are denominated in the same currency at all, and if not, to say
  what a tie-breaker would have to look like — or to argue that none is available
  and that the dispute is idle.


  Deliverables:

  1. The question exactly as it will appear on the paper.

  2. A model answer of about 900 words.

  3. A marking scheme out of 25: five must-hit points, 5 marks each, stated as [a]–[c]
  above plus (d) the point that the Bohmian and the Everettian are both ψ-ontic yet
  give incompatible answers to [b], and (e) the candidate''s own stance on the tie-breaker.
  For each point say what earns 3, what earns 4, what earns 5. Then give a one-paragraph
  A/B boundary: what an A answer must contain that a B answer may lack — I want the
  boundary to turn on whether the candidate separates [a] from [b] and whether they
  take a position on the tie-breaker, not on how much terminology they deploy. Add
  a one-line note per point on how candidates typically get it wrong.


  Two things about the model answer''s epistemic posture. First, separate what is
  settled from what is contested among people who work on this: the content and logic
  of the no-go result, and the fact that Bohmian and Everettian theories are ψ-ontic,
  are settled; whether denying independence is as costly as it looks, whether a nomological
  treatment of the wavefunction is genuinely a ψ-ontic option or a way of changing
