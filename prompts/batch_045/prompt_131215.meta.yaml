  Draft:


  "I''m in a small reading group — half of us from the philosophy department, half
  from the divinity school — and we''ve spent three sessions on the evidential problem
  of evil without getting anywhere. Last week one of the philosophers in the group,
  Marta, wrote up an argument on the whiteboard that nobody has managed to answer,
  and the more I stare at it the more I suspect it proves too much, though I can''t
  locate the move. I''d like to present a diagnosis next week and I''d rather not
  embarrass myself.


  Here it is, cleaned up and with a case that we added to block the obvious escape
  routes. Call the following the Avoidability Condition: (AC) an agent A is morally
  justified in permitting a harm H only if every alternative available to A involves
  H or some harm at least as bad. The case: suppose God creates a single free creature,
  Solitary, in an otherwise empty world, for one reason only: to give Solitary one
  morally significant choice. Solitary — being libertarian free, and with no past
  that determines the choice and no downstream history that could redeem it — chooses
  to wreck the one other thing in the world, and the wrecking produces no greater
  goods for anyone, since there is no one else and no aftermath. The argument:


  (1) (AC) is correct: this is just what it means to call a harm gratuitous, and if
  we drop it, ''God would not permit gratuitous evil'' becomes empty.

  (2) God''s power is limited only by logic, so the alternatives available to God
  are exactly the logically possible worlds.

  (3) Libertarian freedom means Solitary could have chosen otherwise in exactly the
  circumstances Solitary was in.

  (4) So there is a logically possible world — same creature, same circumstances,
  same history up to the choice, no downstream consequences — in which Solitary refrains,
  and in which the harm doesn''t occur and nothing as bad occurs instead.

  (5) So by (2) that world was available to God, and by (AC) God was not justified
  in permitting the wrecking.

  (6) Nothing in (3)-(5) turns on Solitary being the only creature: for any freely
  chosen evil there is, by the same argument, a possible world that matches the actual
  one up to the choice and diverges at it. So no freely chosen moral evil is ever
  justified.

  (7) And nothing turns on freedom either. For any natural evil — a child''s cancer,
  a fawn''s death in a fire — there is a possible world exactly like ours except that
  the mutation doesn''t occur or the fire doesn''t spread. So no natural evil is justified
  either, and the whole apparatus of theodicies is idle: no story about soul-making,
  natural laws, or the goods of compassion can ever justify anything, because there
  is always a nearby world with the same story and no such evil.

  (8) The conclusion is absurd — or, rather, it''s stronger than Marta wanted — and
  it gets worse. Run the argument on absent goods instead of present evils: for any
