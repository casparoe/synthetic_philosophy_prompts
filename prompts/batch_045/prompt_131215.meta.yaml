  Argument sketch (final):


  Setup: Our group formulated a principle we call the "Nearby Better World" principle,
  or I''ll call it "the Avoidability Condition":

  (AC) God is justified in permitting an evil E only if every world God could have
  actualized instead contains either E or some evil at least as bad as E.


  (1) (AC) — justification requires that the evil be unavoidable-by-God.

  (2) God''s power is unlimited except by logic. The only thing that limits which
  worlds God can actualize is what is logically possible.

  (3) For any actual evil E produced by a free creature S, there is a logically possible
  world W* that is exactly like the actual world up to the moment of S''s choice,
  in which S freely chooses otherwise. (This is just what libertarian freedom means:
  S could have done otherwise in exactly those circumstances.)

  (4) W* contains all the goods of the actual world (same history, same people, same
  consequences up to that point) minus E.

  (5) So there is a possible world God could have actualized in which E doesn''t occur
  and nothing equally bad occurs instead.

  (6) So by (AC), God is not justified in permitting E.

  (7) Generalizing: no freely chosen moral evil is ever justified. So the free will
  defense (which explains moral evil by appeal to the value of libertarian freedom)
  doesn''t just fail to explain evil; it actively entails that every instance of moral
  evil is unjustified.


