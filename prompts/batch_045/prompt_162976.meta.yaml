  major), we write a short recommendation that goes to the dean''s office, and the
  dean basically always signs off on whatever we say. Most cases are plagiarism or
  unauthorised collaboration, but in the last year we''ve started getting cases where
  the accusation comes from online proctoring software flagging suspicious behaviour
