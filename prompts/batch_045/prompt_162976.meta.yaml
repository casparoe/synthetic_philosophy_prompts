  the camera frame — with no actual evidence of copying, and also a growing number
  of cases where the thing that was broken is a rule nobody feels personally bothered
  by, like a shared answer key for a problem set worth 2%, reported by a TA rather
  than by anyone who was actually harmed. My roommate is also on the board and he
  thinks all this ethics stuff is just a fancy way of saying use your gut, and I''d
  like to be able to show him it isn''t.


  So what I want is a procedure — a numbered set of steps I could actually read out
  at the start of a hearing — that turns Smith''s impartial spectator into something
  our panel can run. Not a summary of what the impartial spectator is, I''ve read
  the book; I mean the operational version. What I think I need from Smith''s machinery
