  is caused by the belief, and then used as evidence, is that double counting? A good
  model will note that the experience could still be independently reliable (e.g.,
  the belief prompts you to look more carefully), and that causal influence from a
  belief doesn''t automatically transmit the belief''s epistemic status — reliability
  matters, not causal history (externalist objection).

  2. The claim that "calibration penetration can''t raise the epistemic worry" is
  set up then revoked — is the final view actually different from a simple reliabilist
  view? i.e., the essay may have collapsed into "penetration is bad iff it reduces
  reliability," which is a deflationary/relational view that loses what was distinctive
  (the worry that experience becomes *inferential* or *theory-laden* in a way reliability
  doesn''t capture). Also: reliability is a coarse measure; you can have penetration
  that preserves reliability on average but undermines it in the specific case / undermines
  it for the subject''s own evidence (internalist access). Also, "counterfactual reliability"
  — a good model might point out that reliability is typically assessed over actual-world
  cases, and my counterfactual twist is under-described; also that "not mediated by
  any improvement in tracking" is vague — mediated how?

