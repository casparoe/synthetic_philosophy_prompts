  two, and that they pull apart in a case that both sides have ignored.


  Call a case *content-transfer* penetration when the cognitive state contributes
  its content to the content of the experience: you come to believe that the shape
  in the bushes is a bear, and your experience comes to represent the shape as a bear.
  Call it *calibration* penetration when the cognitive state changes a setting without
  contributing content: the belief alters a scaling parameter, a prior, a threshold,
  so that the experience represents the same properties differently — the same neutral
  face comes to look tense. Both are penetration; only the first obviously raises
  the epistemic worry...


  [thesis] ... My claim: the epistemic worry is not tied to content-transfer at all.
  It is tied to a third property, which I call *evidential entanglement*: the experience''s
  content is counterfactually dependent on the cognitive state in such a way that,
  had the cognitive state been different while the stimulus stayed the same, the content
  would have been different, AND the dependence is not mediated by any improvement
  in the experience''s tracking of the stimulus property. Where experience is evidentially
  entangled with a belief in P, the experience can no longer serve as an independent
  check on P, and treating it as evidence for P is a form of double counting: the
  belief''s own support is transmitted through the experience and then counted again
  as new support. ... [case] the radiologist / the resentful colleague...


  [argument] ... This explains why the old argument from the inertia of illusion was
  always a non sequitur: that experience is causally robust against knowledge shows
  only that penetration is not all-purpose; it says nothing about evidential entanglement.
  And the argument from perceptual learning is likewise beside the point: expert training
  improves tracking, so the entanglement condition fails — an expert''s experience
  is *more* reliable, not less, and calibration-by-training is not the kind of dependence
  that disables the tribunal.


  [conclusion] If this is right, the debate should stop asking whether cognition can
  reach into perception, and start asking, for each candidate case, whether the influence
  raises or lowers the experience''s counterfactual reliability on the very property
  represented. Penetration is not a kind of influence; it is a kind of epistemic dependence.
  Cases where penetration improves tracking should be called *tuning*, not penetration
  — and I suspect that most of the celebrated examples are tuning."


