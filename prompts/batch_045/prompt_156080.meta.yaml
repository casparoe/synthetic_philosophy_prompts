  "ok so I''m in a value theory seminar this term and for our last short paper we
  have to write up where we''ve landed on hard choices so the rest of the group can
  attack it. Here''s my position, roughly in the order I''d defend it:


  1. Some hard choices are genuinely incommensurable: there is no fact of the matter
  whether the music career is better than, worse than, or equally as good as the law
  career, and this isn''t just me not knowing enough — even with full information
  about both futures I think the question would still have no answer.

  2. Related but separate: no common measure, no exchange rate, and no ''better all
  things considered'' fact for these pairs. That''s what incommensurable means to
  me.

  3. I don''t buy the voluntarist stuff we read — the idea that in a hard choice you
  create value by throwing your will behind an option, so that choosing is what makes
  it the case that the option is better for you. That sounds like magic to me. Value
  is there or it isn''t; I''m not creating it.

  4. But I also don''t want to say the choice is just arbitrary. Some resolutions
  seem better than others: quitting music for a boring office job purely because your
  parents nagged you is a worse way to resolve it than quitting because you''ve come
  to care about something else more. So the resolution can be good or bad even though,
  by (1) and (2), nothing makes either option better.

  5. Methodologically, the reason I believe (1) and (2) is mostly the phenomenology:
  deliberation doesn''t settle hard choices no matter how long you go on, the reasons
  seem to run out rather than balance, and afterwards there''s this residue of regret
  that doesn''t feel like a mistake. I know that''s not a proof but I lean on it hard.

  6. In practice I still make all-things-considered judgments across different values
  all the time and I trust them: I''m confident that a life with a bit less integrity
  but a lot more security is better overall in some cases, that funding malaria nets
