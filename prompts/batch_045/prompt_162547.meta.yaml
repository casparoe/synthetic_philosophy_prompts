  Next month I am defending a chapter of my dissertation on slurs in a mixed philosophy
  of language workshop, and I want a Q&A prep sheet written for that specific room
  rather than for philosophers of language in general.


  The chapter''s thesis is about reclamation. I argue that reclamation is best modeled
  as a change in what I call a word''s *standing-norm* rather than a change in its
  meaning, its expressive or conventional-implicature content, or its prohibition-status.
  Roughly: a slur carries (i) a target — the group it ranges over; (ii) a derogatory
  appraisal; and (iii) a norm fixing who is in a position to settle what the word
  does on a given occasion. Reclamation, on my account, is the target group''s acquisition
  of (iii): the group comes to hold the authority to determine when the word may be
  used and to what effect, and the appraisal component becomes downstream of that
  authority. The payoff I advertise is an explanation of the case that the standard
  views handle badly — the out-group speaker who uses a reclaimed slur warmly, accurately,
  and with no contempt at all, in a way the target audience still treats as a serious
  offense but which no content-based account can classify as derogatory. I also lean
  on two cases I take to be underexplored: terms whose pejorative force depends on
  a stereotype that is locally shared in the source community and simply does not
  travel when the word is borrowed into another language, and terms whose target group
  no longer exists, where the offense seems to survive everyone who could have authorized
  the use.


  The room: about fifteen people. Roughly half are formal semanticists and pragmaticists
  who default to treating derogation as a compositional or conventional-implicature
  phenomenon; two or three treat slurs as semantically encoding a pejorative property;
  one or two are prohibitionists who think the right story is that the word is banned
  and nothing more; two are sociolinguists who work on stance, indexicality and enregisterment
  and who will want to know what empirical work my "authority" is doing; and there
  is one person working on speech-act approaches to silencing and autonomy who is
  sympathetic to the political end of my view but suspicious of anything that looks
  like meaning.


  What I want:


  1. Eight or so objections I will actually get from this room, ordered by how likely
  and how damaging each is, each phrased the way that particular person would phrase
  it rather than in neutral philosophical English — I want to hear the semicompositionalist''s
  version of the objection, then the prohibitionist''s version, then the sociolinguist''s
  version of what is in effect a related worry.


  2. For each: the reply I should give in about ninety seconds, plus an honest note
  on where the reply is soft.


  3. What I should concede in the first two minutes, before anyone asks anything,
  in order not to look like I am overclaiming.


  4. The one reply that has to land for the chapter to survive at all.


  5. The objection I am hoping nobody asks. My own guess is that it has to do with
  bootstrapping — if acquiring standing is itself accomplished by using the word without
  standing, the account looks circular — or with dissent inside the target group,
  if the authority I appeal to has no agreed holder. Tell me which of these is worse
  and how the worst version of it would be put.


  6. The weakest point in my own position that I should prepare to defend rather than
  hope they miss.


