  I am writing a position statement on the substantivalism/relationism dispute for
  a graduate seminar in the metaphysics of physics, and before I defend it I would
  like an audit of whether the package hangs together. The commitments, as I would
  currently state them, are these.


  (1) Newton''s rotating-bucket argument — and more cleanly his two-globes-joined-by-a-cord
  case — establishes something real: in a universe whose entire material content is
  a pair of globes connected by a taut cord, there is a determinate fact as to whether
  the system rotates, a fact that cannot be read off any relation of the globes to
  other material bodies, since there are none.


  (2) What that fact shows is that dynamics requires absolute structure — inertial,
  or affine, structure that is not itself a pattern of relations among bodies. Newton
  overreached, though, in inferring a substance of space over and above this structure,
  with its own absolute positions and states of rest.


  (3) I accept the moral usually drawn from the hole argument: models related by a
  diffeomorphism represent one and the same physical possibility, and there are no
  haecceitistic differences between worlds that differ only over which bare point
  plays which role.


  (4) So I count myself a sophisticated substantivalist: spacetime is a real, concrete
  particular and not a mere abstraction from relations among bodies, but its points
  have no primitive identity across models and no identity independent of the structure
  and matter that fill them.


  (5) I also hold that the substantivalism/relationism dispute is a substantive metaphysical
  dispute and not a merely verbal one, and I take two things to be evidence on the
  substantivalist side: the globes case, and the explanatory role of geometry, since
  on the substantivalist picture the fact that bodies traverse geodesics is explained
