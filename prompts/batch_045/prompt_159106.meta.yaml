  A good angle: distinguishing readings of Chesterton''s fence:

  1. Epistemic: you should gather evidence before acting (trivial, applies to any
  intervention, not just reform).

  2. Precautionary/asymmetric-uncertainty: status quo institutions may embody localized
  knowledge we can''t reconstruct (Hayekian) — removing may destroy unknown value;
  burden of proof asymmetry.

  3. Rational-reconstruction test: you must be able to state the function the institution
  served before removing it — but note that satisfied trivially by confabulation.

  4. Testimony/deference: past generations knew something; implicit trust in ancestors
  (Burkean "the species is wise").

  5. Conservative-inductive: institutions that survived have passed a selection test
  (survivorship-filter reading) — but selection may be on power rather than welfare.

  6. Verschlimmbessern / ratchet: reforms have systematic bias toward visible benefits
  and hidden costs (asymmetric visibility, "the seen and the unseen") — status quo
  bias as correction for a cognitive bias.

  7. The "second-order" or meta-institutional reading: the fence is the practice of
  requiring reasons — the value is in the deliberative norm itself.

  8. Distinguish "know why it was put up" (original intent) vs. "know what it does
  now" (current function) — Chesterton''s own framing is about the reason it was put
  up; a fence may have lost its original purpose but gained a new one, or vice versa:
  the original reason may be obsolete but the institution now does something else.


  Also ask: for each reading, does it support the use made of it in the argument?
  The friend used it to block a specific reform.


