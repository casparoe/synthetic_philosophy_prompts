  I think the strongest, most "in the weeds" combination: Pasadena paradox + "restate
  in vocabulary of another framework." The Pasadena paradox: Nover and Hájek (2004)
  "Vexing Expectation" — a game with a St. Petersburg-like structure where the expected
  value is undefined (conditionally convergent series that can be rearranged to any
  value / diverges in a way that yields undefined expectation). Actually the Pasadena
  game: flip a fair coin until first heads; if heads on toss n, payoff is (-1)^(n-1)
  * 2^n / n. The expected value series is the alternating harmonic-like series: sum
  (-1)^(n-1)/n... wait: expected value = sum over n of (1/2^n) * ((-1)^(n-1) 2^n /
  n) = sum (-1)^(n-1)/n = ln 2. That converges conditionally, but the absolute expectation
  is infinite (sum 1/n diverges), so the expected value is undefined in the standard
  convention (expectation defined only if E[|X|] < ∞). So by reordering terms the
  sum can be made to equal anything (Riemann rearrangement). Hence the "Pasadena paradox":
  decision theory says the game has a value ln 2 but rearrangement gives any real
  number, and also Pasadena intuition: it shouldn''t matter whether you play or not,
  etc.


