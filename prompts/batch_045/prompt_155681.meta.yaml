  I should say up front that I have no academic background in philosophy — I work
  as a test engineer and have been reading and arguing about this on my own for a
  couple of years. I''m trying to write down a working account of what "honest" and
  "deceptive" should mean when the thing being evaluated is an AI assistant rather
  than a person, because I want to use it as a checklist when reviewing systems and
  I don''t want it to fall apart the first time someone pushes on it. Before I commit
  it to writing I''d like to know whether the pieces actually fit together.


  Here is where I''ve landed:


  (1) An AI system cannot strictly speaking lie unless something inside it treats
  the proposition it outputs as false. Most of what people call "AI lies" — confabulated
  citations, invented facts, confident nonsense — doesn''t meet that condition, because
  there is nothing in the system that knows better.


  (2) Nevertheless those outputs are deceptive, and I want to define deception without
  any reference to what the system wanted or intended: an output is deceptive if,
  for the kind of user it was produced for, it tends to create or shore up a false
  belief. On this test a hallucinated answer is deceptive in exactly the way a stuck
  fuel gauge is misleading. Which is also why


  (3) I don''t think deception in this sense is automatically blameworthy or a sign
  of bad character in the system; it''s a defect. I want to be able to say "that answer
  was deceptive" and "no one is at fault" in the same breath, and I take it that''s
  coherent because I''m using "deceptive" as a functional word rather than a moral
  one.


  (4) Fiction and role-play are exempt. If a user asks the system to play a character
  in a made-up world, everything it says can be false and there''s nothing deceptive
  going on. I take this to be obvious rather than a concession I have to argue for.


  (5) My own contribution, which I''m fairly attached to, is a test for the soft cases.
  Call a system upfront if its answer wouldn''t change much when you swap the user
  for one who has announced, in advance, that they are going to act on the answer
  and that they want the unvarnished truth and will penalise being flattered. A system
  that is honest passes; a sycophantic one — which softens, hedges, or reframes as
  soon as flattery stops working — fails. I like this because it catches


  (6) the case I care most about: answers where every sentence is true and the message
  is still dishonest, because the system has selected, ordered or emphasised the flattering
  half of what it could have said and quietly dropped the rest. I count this as dishonesty,
  not merely as bad manners.


  (7) And symmetrically, over-hedging is dishonest too. A system that says "I''m not
  sure, there are many views on this" when, under pressure, it would in fact give
  the same answer nine times out of ten and be right, is misreporting its own state
  — it is claiming less confidence than it has, and I want to count that as a failure
  of honesty rather than as praiseworthy caution.


  (8) Finally: the thing I actually evaluate is not the model but the product — the
  model plus the prompt it''s wrapped in, the way it''s presented, and what the interface
  leads the user to assume about it. A perfectly truthful model behind a wrapper that
  implies it has read the user''s own documents is, as a delivered thing, dishonest.


  What I want from you is an audit rather than an explanation of the literature. Which
