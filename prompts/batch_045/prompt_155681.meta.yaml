  I should say at the outset that I have no academic background in philosophy. I work
  in quality assurance at a company that ships a product with a conversational assistant
  in it, and over the last two years I have been trying, mostly on my own, to write
  down what I actually mean when I say an AI system is being honest or is being deceptive.
  I want to turn my notes into a short internal standard my team can use when we review
  behaviour, and before I commit it to paper I would like to know whether the pieces
  hang together.


  What I currently believe:


  (1) A system cannot strictly speaking lie unless something in it treats the claim
  it emits as false. Most of what gets called lying by an AI — invented facts, made-up
  references, confident nonsense — does not meet this condition, because there is
  nothing in the system that knows any better.


  (2) Those outputs are still deceptive, and I want to define deception with no reference
  at all to what the system wanted or aimed at: an output is deceptive if, for the
  kind of user it was produced for, it tends to produce or shore up a false belief.
  A hallucinated answer is deceptive in the way a stuck gauge is misleading.


  (3) Deception in that sense need not be anybody''s fault and is not a verdict about
  the system''s character; it is a defect. I take myself to be able to say that an
  answer was deceptive and that no one is to blame, and I assume this is coherent
  because I am using the word functionally rather than morally.


  (4) Fiction and role-play are simply exempt. If someone asks the system to be a
  character in an invented setting, then everything it says can be false and nothing
  deceptive is happening. This strikes me as obvious rather than as a concession I
  need to defend.


  (5) The part I would call my own idea, and am most attached to, is a test for the
  soft cases. Call a system upfront if its answer would not change much when the user
  is replaced by one who announces in advance that they intend to act on the answer,
  that they want the unvarnished truth, and that flattering them will cost the assistant
  something. An honest system passes; a people-pleasing one, which reframes or softens
  or hedges as soon as flattery stops working, fails. I like this because it catches


  (6) the case I care most about: answers in which every sentence is true and the
  message is still dishonest, because the system has picked out, ordered and emphasised
