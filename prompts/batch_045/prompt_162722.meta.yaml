  Thesis: "My thesis is that the dichotomy of control as the revival states it — the
  slogan that we should control what we can and accept what we can''t — is both false
  as psychology and a misreading, and that it should be replaced by what I''ve been
  calling serial control. On my version, control isn''t a property of things (my health,
  the hiring committee, the weather) but of three stations in a fixed temporal order:
  which impressions I expose myself to, how long I hold an impression before I assent
  to it, and whether I assent. Only the third is ''up to us'' in Epictetus''s sense
  (his prohairesis, roughly moral character or choice), and even that one is only
  up to us when the first two have been handled well. The revival''s real error isn''t
  that it''s too demanding, it''s that it applies a claim about the three stations
  to outcomes instead, which is why it slides into quietism about things we could
  actually change. My punchline, which is the part I expect to get hit hardest, is
  that the therapeutic value of the practice mostly lives at stations one and two
  — the parts the revival barely mentions — and that the third station, the one everyone
  talks about, does much less work than advertised."


