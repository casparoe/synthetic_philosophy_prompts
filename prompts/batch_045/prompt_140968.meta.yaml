  ---


  I''m a third-year undergraduate writing the final paper for a philosophy seminar
  on punishment and social sanction, and I want to read Ibsen''s An Enemy of the People
  (1882) as a case study in informal social sanction — the kind of thing people now
  call deplatforming, though the play predates the word by a century. I don''t need
  a summary of the plot; I need a reading I can argue with.


  The frame I''ve been developing... [three conditions]


  Then: what I want.


  Let me write out the conditions carefully and crisply.


  (1) The discharge condition. Standard punishment has a terminus: the sentence is
  served, the fine paid, the apology accepted by someone with standing to accept it.
  Informal social sanction characteristically has no such terminus — there is no one
  with standing to declare the debt discharged, so the sanction can, in principle,
  run forever. Call a sanction that fails this "undischargeable."


  (2) The attribution condition (or: the anti-distributed condition). Punishment is
  normally imposed by an agent who can be asked, in principle, to stop. Much of what
  happens to Stockmann is produced by a sequence of individually permissible refusals
  — a printer declines, an editor declines, a hall is withdrawn, an employer terminates
  a contract, a landlords ends a tenancy — none of which is punitive on its own and
  none of which any participant can be asked to reverse. Call the aggregate a "distributed
  sanction." Is the aggregate punishment if no part of it is?


  (3) The transparency condition. Communicative theories of punishment want the sanction
  to be an address to the target as a moral agent: "you did this, it was wrong, you
  are being condemned for it." In the play most of the sanctioners'' operative reasons
  are not the reasons they give: the newspaper kills the article because of circulation
  and the town''s economy, the crowd because their livelihoods depend on the baths,
  and Morten Kiil because the tannery is the source of the pollution. So the sanction
  is communicative in form but not in content. Call it "interest-opaque."


  Plus the baseline question: whose platform? Stockmann treats the newspaper (the
  People''s Messenger / Folkebladet) and Horster''s hall as public infrastructure,
  and the mayor and Aslaksen treat them as private property to be lent or withheld.
  Call this the commons-baseline dispute. And distinguish platform withdrawal (losing
  an amplifier, reach) from silencing proper: Stockmann is never literally prevented
  from speaking — he keeps his voice and his window — but he loses his audience. So
  the play lets me ask whether the wrong in deplatforming is the loss of a right to
  speak or the loss of hearers...


  Then the resistance points:

  - Ibsen gives us the best possible victim: he is verifiably right, disinterested
  (refuses the shares/emigration), willing to pay. The hard real-world cases are ones
  where the epistemic status of the sanctioned claim is contested. So the play may
  stack the deck.

  - Stockmann''s contempt for the "compact majority" and his claim that the minority
  is always right: his own anti-democratic elitism might make him a poor vessel for
  the free-speech reading; the play may be less about silencing than about a certain
  kind of person''s relation to the crowd.

  - Act V: the resolution — refusing rehabilitation-in-exchange-for-silence, staying
  to teach the boys, "the strongest man is he who stands alone" — may be either a
  vindication or an admission that once a distributed sanction has run there is nothing
  to undo.

  - Also: is Peter the mayor''s counter-argument (quiet remediation, avoid ruining
  the town) actually reasonable? The play gives him the "think of the bigger picture"
