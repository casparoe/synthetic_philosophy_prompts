  Draft:


  I hold the following view about the epistemology of markets, and I want it stress-tested
  rather than defended.


  The view: market prices are epistemically privileged aggregators of dispersed private
  information. When many agents trade on information I lack, the resulting price carries
  evidence about the world that I do not otherwise have, and my confidence about a
  proposition should move toward what the price implies, unless I have a specific
  reason to think I am on the inside of that information. On this picture, the familiar
  limitative results about markets with asymmetric information describe boundary conditions
  rather than refutations: the no-trade result (common prior, commonly known information
  partitions, purely informational motive ⇒ no trade) shows only that trade requires
  some heterogeneity of priors, of risk exposure, of liquidity needs, or of reasoning;
  and the paradox that a fully revealing price would destroy the incentive to acquire
  the information it reveals shows only that revelation must be partial. Neither,
  I claim, blocks the inference from price to fact.


  Tell me what would in fact count against this. Concretely:


  1. Which observations or arguments would be decisive rather than merely awkward?
  I mean this in the strong sense: something whose truth would make the aggregation
  reading false or vacuous, not something that merely shows it needs a caveat. Distinguish
  the two explicitly.


  2. What would a committed defender of my view concede as genuinely counting against
  it? I am not interested in what hostile critics say the view is committed to; I
  want the concessions an advocate should make.


  3. Does the view predict anything that its rivals do not — something about when
  volume should occur, how prices should respond to news, or how price informativeness
  should vary with the number and diversity of traders? If a rival reading (prices
  as the outcome of risk-sharing, liquidity provision, or inventory control) predicts
  something different, say what the discriminating test is.


  4. I want the defeaters ranked, fatal to merely awkward, with a short statement
  of why each lands where it does.


  Three things I would personally find most persuasive, which I would like you to
  assess rather than simply accept:


  (a) The decision-market objection. Suppose a market is run precisely in order to
  settle a decision, and that the participants have stakes in which decision gets
  taken, not merely in being right about the question. Then each participant''s payoff
  depends on the price through the decision it triggers, and trading is no longer
  a pure expression of belief. Does this undermine the reading of price as a belief
  aggregate in a way that generalizes — i.e., does every market whose price feeds
  into decisions that participants care about inherit the problem, and if so, how
  much of the epistemic privilege survives?


  (b) The boundedness objection. The standard results assume agents who can compute
  common knowledge and share a prior. Suppose instead that a large share of trading
  is done by systems trained on overlapping data, with overlapping inductive biases,
  and with hard computational limits. Is the no-trade conclusion robust to arbitrarily
  small relaxations of common knowledge and logical omniscience, or does it break
  discontinuously, as coordination does in examples where common knowledge fails by
  an epsilon? If it breaks discontinuously, what does that tell us about how much
  the theorem ever constrained real markets?


