  Rating Claims Involving Definite Descriptions'', issued by the standards desk of
  a newspaper I''ll leave nameless — about 700–900 words, numbered rules with a short
  worked ''verdict'' example under each, deadpan bureaucratic voice, American English.
  The humor has to come from the analysis actually being applied correctly, so please
  get these right and let each one generate its own absurdity:


  1. existence and uniqueness both have to hold; ''the'' fails if there''s no satisfier
  OR if there''s more than one, so a claim about ''the tallest building downtown''
