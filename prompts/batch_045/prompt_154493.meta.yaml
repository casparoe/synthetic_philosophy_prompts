  Niche ideas to inject for the Russell prompt:

  1. Negation scope ambiguity: "The present King of France is not bald" — two readings,
  one true one false.

  2. Uniqueness condition: "the" claims existence + uniqueness, so ties make sentences
  false — e.g., "the tallest building in town" when there are two of equal height.

  3. Negative existentials: "The present King of France does not exist" is true, and
  that''s a triumph of the theory (how can a true sentence be about something that
  doesn''t exist?).

  4. Logically proper names vs. descriptions: only "this"/"that" for objects of acquaintance;
  ordinary names are disguised descriptions.

  5. Incomplete symbols: descriptions have no meaning in isolation; their contribution
  is to the whole sentence''s logical form. → satire: the style guide forbids mentioning
  the King in a headline; you may only use whole sentences.

  6. Maybe: the "non-referring" intuition clash (people''s gut says "that''s not false,
  that''s just void") — target of the satire: the institutional/legalistic treatment
