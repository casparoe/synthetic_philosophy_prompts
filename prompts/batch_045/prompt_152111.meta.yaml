  seems to me to hide the real disagreement. The textbook definition — a cost is sunk
  when it is unrecoverable whatever you now do, therefore a rational chooser leaves
  it out of the calculation — is usually presented as though the only open question
  were whether people conform to it, when it seems to me that most of what is interesting
  lies in what the definition is even measuring, and in whether the cases where people
  seem to conform less are cases where the definition applies at all.


