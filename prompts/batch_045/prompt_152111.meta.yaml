  the one commitment everyone in the room will grant — that in a stripped-down case,
  where the past expenditure has no causal bearing on future payoffs, no evidential
  bearing on how good the project is, no audience, and no further decisions attached
  to it, it cannot count in favour of continuing — down to a named leaf. Build the
