  Let''s craft polished prompt:


  "In a reading group I''ve been going through John Locke''s A Letter Concerning Toleration
  (1689, in William Popple''s translation), and we''ve hit a passage I cannot square
  with the use later writers make of Locke in debates about church and state. The
  passage says, in part: "The business of true religion is quite another thing. It
  is not instituted in order to the erecting of an external pomp, nor to the obtaining
  of ecclesiastical dominion, nor to the exercising of compulsive force, but to the
  regulating of men''s lives, according to the rules of virtue and piety." A friend
  in the group objects that if the business of true religion is to regulate men''s
  lives according to virtue and piety, and if the civil magistrate is likewise responsible
  for outward conduct and for restraining vice, then this passage seems to give the
  magistrate a warrant to enforce religious morality—which is just what defenders
  of established churches and state-collected church taxes have argued. I do not think
  that can be Locke''s view, but I cannot reconstruct from the passage itself why
  not. Can you explain what the passage is claiming about religion, compulsive force,
  and the regulation of conduct, and whether my friend''s objection actually shows
  that the passage supports a larger role for the state in religion than Locke is
  usually taken to allow? Please begin your reply by stating your bottom line in the
