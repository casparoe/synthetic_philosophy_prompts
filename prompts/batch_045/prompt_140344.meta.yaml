  \ the right call.\n\nBest fit: a \"safety case reviewer\" or a \"lab's oversight\
  \ committee\" — with precedents on cases about corrigibility: whether an agent's\
  \ behavior counts as corrigible/acceptable. Then a new case that diverges.\n\nAlternative\
  \ framing: a principal/operator deciding whether to press the shutdown button in\
