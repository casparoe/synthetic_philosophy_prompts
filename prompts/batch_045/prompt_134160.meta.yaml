  I am teaching a seventy-five-minute seminar on Thomson''s lamp in a third-year undergraduate
  course on paradoxes of infinity, and I want a plan for the session rather than an
  explanation of the puzzle. The group is deliberately mixed. Roughly half are philosophy
  majors who have met Zeno''s dichotomy and Achilles, have been told that the natural
  numbers and the reals have different sizes, and have nothing more than that; the
  other half are mathematics majors who are fluent with sequences, series and limits
  and who will arrive inclined to think the lamp is simply a question about whether
  a certain limit exists. Several students in both groups have already read the standard
  presentation and the familiar reply that the description of the task is consistent
  with the lamp being on at the end, off at the end, or gone out of existence, and
  that it therefore fails to determine an answer. My worry is that they will treat
  that reply as a verdict that closes the topic, and either file the lamp under wordplay
  or file it under solved.


  Please plan the session. In particular I want:


  1. The order in which the components have to be introduced, and what each step depends
  on. Specifically: where the observation that the lamp''s state is perfectly well
  defined throughout every interval strictly before the limit time needs to go, and
  why placing it there matters for what comes after; where to draw the distinction
  between the limit of the sequence of states failing to exist and the lamp''s having
  no state at the limit time; and where the question whether supertasks are possible
  at all should be raised, and how to raise it so that it is not prematurely answered.


  2. The one case or variant that should carry the session. I have two candidates
  and I would like you to pick one, or to say why both are needed and where each belongs.
  (a) The lagged lamp: identical set-up, except that the lamp responds to the switch
  only after a fixed delay, so that its state at any moment is fixed by the last switching
  that occurred at least that much earlier. (b) The finite-budget lamp: identical
  set-up, except that every operation of the switch dissipates some fixed minimum
  quantity of energy drawn from a store that is exhausted after finitely many operations.
  Tell me what each does and does not isolate: whether the difficulty lies in the
  infinity of the operations, in the assignment of a state at the accumulation point,
  in the physical description of the mechanism, or in the logical form of the description,
  and whether the variant settles the puzzle, dissolves it, or merely relocates it.
  Also tell me what the carrying example must lack as well as what it must have: if
  either variant smuggles in a premise that the original set-up does not contain,
  say which premise and what it would cost the session.


  3. The misconceptions to expect and the point in the sequence at which to head each
  off. The ones I anticipate are: that since the durations sum to a finite total the
  task is straightforwardly completed and the remaining question is only empirical;
  that because there is no last switching there must be no final state; that the lamp
  ends up half on, or flickering too fast to see, or at some averaged brightness;
  that infinity plus infinity, or the parity of an infinite number of switchings,
  must make sense somehow; and, from the mathematics majors, that the non-existence
  of the limit of the states is the same claim as the absence of a determinate final
  state. Add any you think I have missed, and for each say whether it should be pre-empted
  before it forms, answered when it surfaces, or left standing to be answered by a
  later part of the session.


  4. What I should explicitly refuse to explain at this level, and say aloud that
  I am refusing: non-standard analysis and infinitesimals; the relativistic point
  that in some spacetimes an unbounded amount of proper time can elapse along one
  worldline within the finite past of another; machines or formalisms that compute
  through limit stages; and the wider literature of supertasks in classical mechanics.
  For each, one sentence on why it would derail a seventy-five-minute session with
  this audience.


  5. The check for understanding at the end. I would rather it not be a request to
  restate the underdetermination reply. Give me one question I can put to the room,
  together with what a correct, a partially correct, and a merely verbal answer would
  sound like, and what each would tell me about whether the idea landed.


  Please be concrete about timing across the seventy-five minutes, and note where
  the session should slow down.


