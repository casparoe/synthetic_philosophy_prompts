  5. Must handle fission/fusion: when a colony buds/splits into two, is there one
  mind or two? Which one is the original? And when two colonies merge (e.g., in some
  fire ants, or experimentally fused colonies), what happens to the two minds? A theory
  must give identity/persistence conditions.

  6. Must handle the timescale mismatch: colony decisions unfold over hours/days,
  individual ant "thoughts" over seconds. Is there a required grain of temporal processing?
