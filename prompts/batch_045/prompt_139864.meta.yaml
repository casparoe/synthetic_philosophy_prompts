  **The "no-unheard-acts" claim**: An utterance counts as the performance of an illocutionary
  act only if it secures what I''ll call *answerable uptake*: some party other than
  the speaker is placed in a position to hold the speaker to the act — to demand the
  promised thing, to rely on the warning, to take the refusal as final. Mere intention
  plus convention plus an audience that happens to be present is not enough: what
  is required is that the speaker be *answerable* to someone.


  Consequences to defend:

  - Illocutionary acts are not speaker-side events that later cause effects; they
  are essentially relational/normative statuses.

  - Therefore Austin''s misfire/abuse distinction needs reworking: some paradigm "abuses"
  (insincere promises) are still acts (because one is answerable), while some paradigm
  "misfires" that look merely procedural (no authority) and some cases of non-uptake
  both fail for the same reason — no answerability relation is created.

