  The course is a second-year epistemology course. The question and answer:


  **Q (25 marks).** Hume and Reid set up the modern debate about testimony. Say what
  separates a reductionist from an anti-reductionist, and then answer this: does the
  anti-reductionist have to hold that a hearer can get knowledge from an assertion
  even when the thing doing the asserting isn''t a person — say, a language model
  that outputs true sentences, or a sign generated by a machine? Take a position and
  defend it.


  **Student''s answer** (about 400 words):


  "Reductionists (Hume is the classic case) hold that our reason for accepting testimony
  is never basic: our reliance on the word of others is itself justified by experience,
  by our observation that reports and the world tend to line up. So testimony is not
  an independent source of knowledge; it reduces to perception, memory and induction.
  Anti-reductionists (Reid, and more recently Coady and Burge) deny this: they hold
  that we have an original, non-inferential entitlement to accept what people tell
  us, so testimony is a basic source in its own right, on a par with perception.


  The two views are often presented as differing about whether the hearer needs ''positive
  reasons'', but that way of putting it makes the dispute sound verbal. It isn''t:
  the views really do differ about the extension of testimonial knowledge, since the
  reductionist, but not the anti-reductionist, has to say we don''t know things like
  the date of the Battle of Hastings.


  The real test case is the machine case. If we let a language model produce the assertion
  ''the meeting is at four'', and it''s true, does a hearer who accepts it know? I
  say the anti-reductionist has to say yes. Their view is that no reasons from the
  hearer''s own evidence base are required, and that''s exactly the situation here:
  the hearer has no evidence about the reliability of the model, and doesn''t need
  any. For the same reason the anti-reductionist cannot object that the model has
  no intentions or can''t be held responsible, since that objection would be a demand
  for reasons about the source, which is precisely what anti-reductionism says we
  don''t need. And once we allow that the model can''t be wrong about what it means
  to assert — it has no credibility to be excess or deficient — the anti-reductionist
  is committed to treating it as a perfectly good informant.


  So anti-reductionism is too permissive. Since the reductionist can simply say that
  our warrant here would have to come from evidence about the system''s track record,
  reductionism handles the machine case better, and that is an argument for reductionism."


