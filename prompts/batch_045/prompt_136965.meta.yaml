  1. Strong Hofstadter–Sander claim: categorization IS analogy; all thinking is analogical;
  "high-level perception" = retrieval of a prior episode.

  2. Weaker: analogy is central to creative/high-level thought but most routine cognition
  is rule/application of encapsulated modules (Fodor-style modularity, or Marr-level
  algorithmic processes).

  3. Rules-and-representations view: analogy is a derived, heuristic process on top
  of structured symbolic representations (Gentner''s structure-mapping is sometimes
  read this way; also analogy as a special case of similarity-based retrieval).

  4. Amnesic/deflationary: analogy talk is useful but there''s no unified mechanism;
  "analogy" picks out several distinct mechanisms (retrieval, mapping, re-representation,
  blending) with no common core (like "memory" or "attention" as a natural-kind-free
  category).

  5. Bayesian/predictive-processing: cognition as inference over generative models;
  analogy is a particular form of inductive bias / structure transfer (like the "Bayesian
  Program Learning" / Lake et al. one-shot learning); analogy isn''t core, structure
  learning is.

  6. Embodied/enactive: concepts are grounded in sensorimotor schemas; analogy is
  metaphor (Lakoff & Johnson), so analogy is core but in a very different sense —
  metaphor rather than structural alignment.

  7. Connectionist/neural: analogy falls out of similarity in learned representation
  spaces; no explicit structural alignment needed; "analogy" is emergent.

  8. Also: empiricist associationism — analogy is just associative similarity (Humean).


