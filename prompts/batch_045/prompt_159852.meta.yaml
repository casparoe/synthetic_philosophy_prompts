  a dollar each).

  3. Must distinguish demands on the agent''s own resources from demands that require
  violating others'' rights / from demands to coerce others.

  4. Must handle "collective/aggregative" cases where the harm is the sum of many
  small contributions (climate change, factory farming) — and say something about
  what an individual owes when the causal contribution is imperceptible.

  5. Must handle epistemic demandingness: how much time/money must I spend finding
  out whether my inaction harms people (e.g., researching supply chains, checking
  whether that $50 would go further elsewhere).

  6. Must handle the asymmetry between cost of compliance and cost of holding others
