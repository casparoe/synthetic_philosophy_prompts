  — accepted as the person who decides who gets water, who gets a place under the
  tarpaulin, and, on two occasions, who goes over the side. I need him to be of one
  mind, so I am trying to work out what rule he is running. His decisions so far:


  1. When the cutter had to be lightened and one person had to go over the side, he
  chose a man with crush injuries who, by the surgeon''s account, could not have lived
  out the night.


  2. When it had to be lightened again and the choice lay between the passenger who
  had knifed a crewman to take a place and an able seaman with a broken arm, he put
  the knifer over the side — although the seaman, with one arm, would have been of
  less use at the oars and, by the surgeon''s account, the likelier of the two to
  die of exposure.


  3. When water ran short and the last full measure had to go either to the only person
  aboard who could work a sextant or to a passenger with a kidney complaint who would
  die without it while the rest would only suffer, he gave it to the navigator, saying
  that without him none of them would ever be found.


  4. When a nine-year-old stowaway was found under the thwarts after the sinking,
  and the passengers voted to give her half a share, he overruled them and entered
  her name in the water ledger at a full share, saying the ledger records throats,
  not tickets.


  5. When an old man in full possession of his faculties begged to be put over the
  side so that his two grandchildren might have his share, he refused him, and later
  said to no one in particular that the sea takes, but the boat does not.


  The case I have to write next: the boat no longer needs lightening, but the water
