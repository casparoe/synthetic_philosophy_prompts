  I chair the collections care committee of a university museum of natural history.
  Our holdings include a herbarium of around 200,000 sheets, a research collection
  of some 40,000 pinned insects, and a duplicate teaching collection of botanical
  material used in undergraduate practicals. Carpet-beetle larvae have been found
  in the teaching collection, and the committee must now rule on two things at once.


  First, a petition signed by four curators and two technicians asks us to adopt a
  policy that no insect be killed except where necessary to protect material that
  cannot be replaced, and that where killing is necessary we use the least distressing
  method available. Second, the director asks us to resolve to become "pesticide-free"
  within two years, which would release a £1.2m bequest offered on exactly that condition.


  Please draft the committee''s decision memo: a clear recommendation (accept, reject,
  or accept with conditions), a timetable, and reasons the petitioners and the director
  could respond to. The memo must face rather than bypass three things. (i) The non-chemical
  treatments we would switch to — freezing and nitrogen anoxia — are also lethal,
  and anoxia takes two to three weeks during which the insects starve, so the choice
  before us is between methods of killing, not between killing and refraining. (ii)
  The museum already kills insects deliberately for its research collection, so any
  policy has to say what distinguishes the larvae eating the teaching collection from
  the beetles we pin. (iii) Most of the infested teaching material is replaceable
  at modest cost, which, on the petitioners'' own criterion, seems to permit letting
