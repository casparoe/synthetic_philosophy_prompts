  Let me think about what the real crux is, then wrap it in a case.


  Dennett''s "strange inversion of reasoning" (Darwin): Before Darwin, the reasoning
  was: the "reasons" (purposes/needs) of creatures explain their design — teleology;
  Darwin inverted it: the design is explained by a mindless, foresight-free process,
  so the appearance of reasons-as-purposes is explained by reasons-as-causes. Key:
  nature has no foresight; the "reasons" are retrospective (selection for past function),
  not prospective (the organism doesn''t act for the sake of future survival). The
  point: reason-respecting competence produced by reason-free processes.


  Turing''s inversion: Before Turing, computation was done by a human "computer" who
  understands; Turing showed a mindless machine can follow rules — "Turing''s strange
  inversion": you don''t need comprehension to get competence; comprehension is itself
  something you can build out of uncomprehending competences (Dennett). Also important:
  the mechanism''s operations must be "reason-respecting" (the steps track logical
  relations) without the mechanism having reasons — the "competence without comprehension"
  is genuine: it does the right thing for the right reasons (in a derived sense) without
  knowing why.


  So the two inversions differ:


  (1) Product vs. process: Darwin''s inversion is about the *etiology* of a competence
  (how it got there: from a non-teleological, retrospective process). Turing''s is
  about the *constitution/execution* of a competence (how it''s realized in a mechanism
  that operates without understanding).


  (2) What''s inverted: Darwin: from "reasons first" (purposes as explanatory primitives)
  to "reasons last" (competence first, then purposes as derived/retrospective). Turing:
  from "comprehension first" (you need a mind that understands the rules to compute)
  to "comprehension last" (comprehension is built out of comprehension-free parts).


  (3) The residual worry: For Turing, the "grounding" worry (Searle): syntax isn''t
  semantics; a mechanism can be reason-respecting-in-behavior but the normative/semantic
