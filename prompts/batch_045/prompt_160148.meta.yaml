  experience, or does it generalize? Two generalizations worry me and I can''t tell
  which matters more. The diachronic one: if my judgments about experience aren''t
  explained by experience, what explains the long-run convergence (or failure to converge)
  of the whole research literature on consciousness? The argumentative one: the conceivability
  and knowledge arguments that motivate epiphenomenalism in the first place are themselves
