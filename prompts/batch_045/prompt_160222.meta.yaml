  (b) Idiosyncrasy. What pleases is fixed by temperament rather than by anything universal;
  self-knowledge is therefore the primary instrument, and no one is in a position
  to tell another person what will make them happy. I also reject any ranking of pleasures
  as higher or lower in kind.


  (c) Dominant passion. The passions are not to be extirpated or merely moderated
  one by one; the soul needs one governing passion, and the promising candidates are
  those whose exercise is within our own power — study, and the love of the glory
  that follows from it.


  (d) Exercise-pleasures and outcome-pleasures. I distinguish pleasures whose object
  is the exercise of a capacity (solving, making, understanding) from pleasures whose
  object is a state of the world (being elected, being loved back, having the book
  succeed). I hold that a happy life is one weighted toward the former, and I insist
  this is not a qualitative ranking of the sort (b) forbids: it is a claim about reliability
  and about what is in one''s control, not about worth.


  (e) Anticipation and memory. Expecting a pleasure and remembering one are themselves
  pleasant moments, so a pleasure can be had more than once; one should cultivate
  the habit of savouring forward and of re-reading one''s past. A qualification I
  rely on: the pleasure of savouring is confirmation-dependent — it decays unless
  refreshed by evidence that the thing is actually coming.


  (f) Virtue. Being virtuous is a necessary condition of happiness, in large part
  because we are dependent on the good opinion of others and cannot be at ease in
  our own eyes without deserving it.


  (g) Undeceivedness. Happiness presupposes freedom from prejudice and self-deception.
  Concretely: I would refuse a harmless pill that induced stable, unshakable false
  beliefs about how my life was going, even if I were convinced it would raise the
  total of pleasant moments and nothing would ever undo it.


