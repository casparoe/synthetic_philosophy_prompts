  Misconceptions to list, in the order they''ll arise:

  1. "Isn''t this just out-of-distribution robustness / distributional shift?" (CS
  contingent) — head off early, at the point where you define the crisis, by conceding
  the overlap and locating the difference: OOD robustness is about predictions being
  wrong; here the model can be perfectly calibrated and the problem still arises because
  the *utility function''s arguments* move. And the inaccessible-information point
  shows it isn''t fixable by more data.

  2. "Isn''t this just skepticism about reference / Quine''s indeterminacy?" (philosophy
  contingent) — head off when you introduce inaccessible information; say what''s
  different: the agent has to *act* on a decision now, the underdetermination is not
  global but localized to a specific empirically-meaningful question, and there is
  a real fact of the matter external to the agent.

  3. "Just define the utility over low-level physics and the problem disappears" —
  head off after the example, when it''s vivid that (a) the agent''s concepts live
  at the high level; (b) the mapping from high-level to low-level is itself model-relative
  and not observable; (c) even a low-level definition must pick out which low-level
  configurations, and that choice is made under the same underdetermination... hmm,
  actually a low-level definition is well-defined if you can point to the physical
  state. The real reply: the agent doesn''t have direct access to "the physical state"
  — it has inputs; and the standard move "define values over the agent''s sensory
  inputs" fails because input-level definitions are themselves indexed to a hardware
  configuration that changes / and to the agent''s own position, and can''t capture
  what we care about. Good; I''ll let the asker not prescribe the answer but ask where
  in the sequence to head it off.

  4. "Bayesian updating will converge to the true ontology given enough evidence"
  — this is where inaccessible information does the work: two models agree on all
  possible observation sequences yet differ on the extension; no amount of data discriminates.
  Place right after the example so that the abstract point lands on something concrete.

  5. "The agent can just ask us" — the humans and their terms are part of the modeled
  world; and the question "what did you mean?" presumes the same regress. Place late,
  during the "what to do about it" segment, or refuse to answer.

  6. "So the correct answer is to freeze the referents / to be conservative" — the
  students will think one resolution is obviously right; the point is that no evidence
  settles the choice, and each resolution has a cost. Maybe ask for the misconception
  that the *resolution rule* is itself a substantive value choice, and where to place
  it.


