  in a learned world-model, and why learning more about the world can make those categories
  ill-defined — the "ontological crisis"/ontology-identification problem — plus the
  role of facts that are in principle not learnable from the agent''s observations
  ("inaccessible information").


  Audience: mixed philosophy/CS undergrads, one 50-minute session, no prior exposure,
  maybe with a prerequisite that they know basic Bayesian/ML framing but not much
  philosophy of reference.


  Niche idea to inject: I''ll propose a three-way distinction the student (asker)
  has come up with and ask the plan to respect/correct it:

  1. "Referential drift" — the model''s primitive (e.g., "person") continues to denote,
  but the boundary cases shift as the model updates (a sorites-ish failure).

  2. "Category loss"/"eviction" — a model update removes the category entirely (e.g.,
  it turns out the thing the agent called "consciousness" isn''t a natural kind; or
  the model''s ontology no longer contains "agent").

  3. "Inaccessible information" — facts about which ontology is the right one that
  no amount of additional observation from within the system could settle (e.g., the
  agent''s sensors can never distinguish two world-models that agree on all its possible
  observations but disagree on the extension of its value-bearing terms). The external
  world has facts (e.g., about which of two observationally equivalent high-level
  structures realizes the thing it values) that the agent can never come to know from
  its data stream — so it must choose a "rule for resolving ontological crises" without
  evidence.


