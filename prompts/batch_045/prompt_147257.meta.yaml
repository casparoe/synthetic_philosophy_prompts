  in latency across the current deployment environment; it''s a property of a population-in-an-environment,
  not of a trait. They could propose a concrete index: "the intervention-leakage test"
  or "shuffle test": how much of the variance would survive if you randomized the
  environment. Let me invent something plausible-but-niche: "the counterfactual heritability"
  — the share of variance that would remain under the best available intervention.
  Or "portability gap".


  Good framing: the asker defends the thesis: "A high heritability estimate tells
  you almost nothing about whether a trait can be changed by intervention, and specifically
  it doesn''t support ''this gap is genetic, so leave it alone''." Audience: ML/genomics
  people who like quantitative genetics and might be sympathetic to hereditarian conclusions,
  plus a few social scientists.


  Niche injection: the asker proposes a distinction between "variance heritability"
  (the usual h²) and what they call "counterfactual heritability" (or "intervention
  heritability"?), i.e., the fraction of variance that would persist under a specified
  intervention set; plus a "co-domain" idea: heritability is measured within a population-environment
  pair, and their proposal is a "portability score": sample the variance decomposition
  across the environments the intervention might create.


  Also the classic points they should be prepared for: heritability within vs between
  groups; Lewontin''s fallacy critique; the fact that h² can be high while mean differences
  are entirely environmental (height in a malnourished population); the "0 heritability"
  for traits like number of fingers? Actually having two eyes has ~0 heritability.
  Also the reaction norm / norm of reaction: heritability is defined for a population
  in an environment, and GxE interaction, gene-environment correlation (passive/evocative/active),
  and the distinction between "heritable" and "inherited"/"innate"/"immutable". Also:
  measurement invariance, the equal-environments assumption in twin studies, assortative
  mating, SNP heritability vs twin heritability (missing heritability), and the fact
  that heritability of an outcome that''s been equalized by policy (like schooling
  attainment under compulsory schooling) can be high while variance is environmental.


  Audience specifics: a colloquium at a genomics/ML institute — people who build polygenic
  scores; they care about prediction, transportability, out-of-distribution generalization,
  causal identifiability. So the prep sheet should have objections phrased in ML terms:
