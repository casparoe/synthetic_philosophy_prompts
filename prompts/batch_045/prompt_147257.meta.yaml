  audience needs to be philosophically informed enough. Maybe: the asker is a software
  engineer who writes a newsletter / gives a talk to a group of ML researchers and
  data scientists who use "heritability" loosely (e.g., in genomics/ML, SNP heritability,
  twin studies) about why heritability estimates don''t license the inference that
  an outcome is genetically fixed / unchangeable or that group differences are genetic.


