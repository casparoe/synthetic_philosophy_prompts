  ---


  I sit on the committee that rewrites how a large hospital system classifies and
  protects patient data, and one thing keeps bothering me, because we are about to
  write it into policy.


  DNA is carved out. A genetic test result gets its own consent form, its own retention
  rule, its own prohibition on use by employers and insurers, its own vocabulary —
  the phrase is always genetic information, never just information — while a family
  history of the same disease, a cholesterol panel, a scan showing an asymptomatic
  aneurysm, or a protein level that predicts the same outcome far better than any
  genotype does are handled as ordinary clinical data, filed and shared under the
  general rules. Meanwhile, in the same building, the parts of the genome that police,
  immigration authorities and paternity labs treat as maximally informative about
  who a person is are, as far as I understand it, short repeated sequences that vary
  enormously in copy number between people, sit outside the stretches whose sequence
  spells out proteins, and are used precisely because they appear to do nothing and
  so are free to drift. And when we do look at the coding stretches, the reports come
  back hedged: variant of uncertain significance, incomplete penetrance, a change
  that segregates with disease in one family and not in another.


  So the practice seems to run on two different notions of what makes a stretch of
  DNA informational at once, and on a metaphor — the genome as the code, the blueprint,
  the instruction book, read and now edited — that I cannot tell is doing any work
  or is decoration.


  What I want from you is the implicit theory. What view of genetic information does
  this carve-out presuppose? Does it actually presuppose that DNA is a code in some
  substantive sense — a text with content, semantics, a message about the organism,
  subject to a convention or a reader — or would a weaker view do: that DNA is one
  causal predictor among others, distinguished only by being cheap, stable, unwaivable,
  and revealing about people who never consented (my sister, my children)? Does the
  split between the identity strand and the disease strand show the practice resting
  on inconsistent commitments, or are both strands licensed by one theory I am not
  seeing? Please distinguish what the practice strictly presupposes from what it merely
  sits well with, and say where it is genuinely underdetermined, so that several theories
  of genetic information would license exactly the policy we have.


  Then tell me what would have to change. If we replaced the code-and-text picture
  with a plainly causal or predictive one — DNA as one more input to an actuarial
  estimate — what happens to the carve-out: does genetic exceptionalism collapse into
  a general rule about predictive information, and does family history, proteomics
  and imaging then have to be pulled into the protected category? And if we took the
  code picture seriously instead, what else would have to be treated as genetic information
  — a methylation profile, a transcriptome, an edited cell line — and what would we
  do about the fact that the stretches most heavily used in law enforcement carry,
  on that picture, no message at all? I would also like your view on whether the one
  hard fact that people cite here, that the mapping from codons to amino acids is
  chemically arbitrary and is implemented by adaptor molecules rather than following
  from the chemistry of the bases, settles anything about whether DNA is a code, or
  whether it settles only something much smaller.


  Finally, be explicit about your own confidence: mark which claims you would defend
  to a hostile reader and which you are inferring, and single out the one point in
  your answer you are least sure of.


