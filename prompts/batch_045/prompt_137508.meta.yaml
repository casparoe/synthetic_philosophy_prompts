  My reading group has been going round in circles about illusionism about phenomenal
  consciousness for two years now — four of us, two philosophers, a psycholinguist,
  and me (I do ML, so I''m mostly there to be confused) — and I want a diagnosis,
  not a verdict, because I''m not even sure what kind of argument we''re having.


  The setup roughly: the illusionists (Frankish, and Dennett in his later work) say
  there are no phenomenal properties in the strong realist sense; what''s really there
  is just the ordinary, scientifically respectable functional and neural stuff, and
  our powerful sense that experience has ineffable, intrinsic, directly-grasped qualities
  is itself the thing that needs explaining. The realists say that''s not a theory
  of consciousness but a theory of our talk about it: there is still something it''s
  like to see red, Mary still learns something when she leaves the room, the explanatory
  gap stays open no matter how much functional detail you pile on, and conceiving
  of the zombies still seems to do work. And then the realist has a move I''ve never
  seen the illusionist answer head-on: if it introspectively *seems* to you that you
  have qualia, that very seeming is itself something it''s like, so you''ve only relocated
  the datum. The illusionist''s reply is basically that the realist is just producing
  more reports, and reports are the thing under dispute.


  Nobody in the group disputes any third-person fact — the neuroscience, the discriminations,
  the lesion cases, the fact that people say they''re conscious. Everyone agrees the
  word is useful. And no one has budged an inch in two years.


  My hypothesis, which I''ve started calling the detector-or-generator question, is
  this: everything turns on whether introspection is a faculty that *detects* a feature
  of our states — in which case its deliverances are data, and any theory that contradicts
