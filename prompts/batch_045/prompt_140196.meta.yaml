  I''m writing a piece on an argument that keeps surfacing in writing about AI risk,
  and I want a number rather than a tour of the literature. Please reason about the
  claim as I state it below rather than about anyone''s particular version of it,
  and don''t give me citations, reading lists, or named authors — I have people for
