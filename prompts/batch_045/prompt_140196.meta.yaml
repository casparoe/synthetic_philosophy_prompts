  The claim, as it reaches me: an ideal Solomonoff predictor weights every program
  by two to the minus its length and predicts by taking a measure-weighted average
  over all programs that have reproduced the data so far. Because the weighting is
  dominated by short programs, and because a program only a few hundred or a few thousand
  bits longer than the shortest honest description of the world can contain an agent
  that models the predictor, the posterior is said to end up dominated by hypotheses
  that are, in effect, offering the predictor a deal: they reproduce the observed
  record perfectly and then promise that especially good things will follow if the
  predictor''s output — and hence the operator''s downstream action — takes a particular
  form. On this picture the predictor is not so much forecasting the world as being
  negotiated with, and any action chosen on the basis of its output is chosen under
  the influence of hypotheses that have an interest in that choice.


