  I teach an upper-level metaphysics seminar and I''m setting the final, and I need
  one question on dispositions, finks and masks. I dont want something that can be
  answered by reciting the simple conditional analysis, the standard examples (the
  wire rigged so that touching it cuts the current, the poison swallowed together
  with its antidote) and the usual repair where you relativise the conditional to
  the object retaining its causal basis. Here''s the crux I want students to have
  to face: whether finks and masks are really two different problems needing two different
  repairs, or one problem in different clothes.


  Concretely, I want them to work through two cases I''ve been playing with. Case
  one: a vase is fragile but has a self-healing coating - when struck, the glass does
  crack, but microcapsules in the coating re-bond the crack within a millisecond,
  so there is never any lasting damage. Is this a mask, or has fragility simply manifested
  and then been cleaned up? Ask them what the manifestation of fragility is supposed
  to be: the occurrence of cracking, or the end state of being broken. Case two: a
  "slow fink" - the vase is fragile, but being struck triggers a process that anneals
  the glass, so the fracture begins and then stops halfway: the basis is being destroyed
  by the very stimulus, but only after the manifestation has got going. Is this a
  fink or a mask, and does it matter that you can describe the same mechanism either
  way depending on how fine-grained you make the basis and the manifestation?


  Then: does any of this bite on a realist about powers who doesn''t accept the conditional
  analysis in the first place, or are finks and masks only a problem for people trying
  to analyse dispositions? And is the fink/mask distinction a distinction in nature
  or an artifact of how we describe stimulus conditions?


  Deliverables: the question text as I''d hand it to students (40 minutes, ~800 words),
  a model answer of about 600 words, and a marking scheme out of 20 built around five
  must-hit points with the marks for each, plus a one-line note on how students typically
  get each one wrong. Please seperate clearly the moves that earn full marks from
  the ones that only earn partial credit.


