  ---


  I am teaching a graduate seminar on population ethics and the long-term future this
  spring, and I want the first session to be about the standard of assessment rather
  than about the positions. What I don''t have, and what I''d like from you, is the
  specification: what a normative view in this area has to be able to do in order
  to count as adequate — the cases it has to get right, the distinctions it has to
  respect, the empirical and formal results it has to be consistent with — with the
  case or consideration behind each requirement.


  Fix the purpose, since adequacy is relative to it. The theory is to be good enough
  for an institution — a large foundation, or a government office setting research
  priorities — that has to choose now between three kinds of expenditure: causes whose
  benefits are near-term and comparatively well-evidenced; measures aimed at reducing
  the risk that human civilization ends prematurely; and measures aimed at improving
  the character rather than the duration or the existence of the far future. The theory
  needn''t be a complete account of beneficence. It has to rank those three, justify
  the ranking, and say in what circumstances the right answer is to spend on none
  of them and leave the money in the bank.


  Here, roughly, is the material I want you to work into a list — but I want you to
  sort it rather than to echo it back. Some of these I suspect are genuine desiderata;
  some I suspect are the prejudices of one camp; some may not be requirements on a
  theory at all but requirements on the people using it. Tell me which is which, with
  the consideration that makes it one or the other.


  - It should keep separate the good of making the future longer, the good of making
  it better, and the good of there being a future at all. These can come apart: a
  policy might raise expected welfare conditional on survival while lowering the probability
  of survival, or extend the future while filling it with less.

  - It should have an answer to the non-identity problem. Long-run policies determine
  which people exist, so the people who exist under them typically cannot have been
  harmed by them; a theory that needs a complainant either falls silent across most
  of its domain or has to compare whole histories rather than individuals. Is that
  silence a defect to be remedied, or a feature to be insisted on?

  - It should say something, or explain why it needn''t, about aggregation: whether
  the size of a future population is itself a good, and what it implies about a very
  large future of lives barely worth living versus a smaller one of flourishing lives.

  - It should be usable under cluelessness. If the sign of an intervention''s far-future
  effects is unknown and the plausible errors are roughly symmetric in magnitude,
  what does it recommend — and can it say this without treating every inconvenient
  consequence claim as unknowable and every convenient one as established?

  - It should take a position on Pascalian fanaticism: on whether responsiveness to
  astronomically large payoffs at very small probabilities is a requirement of rationality,
  or a reductio, and on whether the various ways of damping it (probability thresholds,
  bounded utilities, variance-aversion) are principled or ad hoc.

  - It should say how much rests on the empirical claim that we live at an unusually
  pivotal moment — a period of high risk that will either be survived or not — and
  what becomes of its recommendations if that claim is false, or merely unverifiable.

  - It should not assume that risk reductions from different sources simply add up.
  If the hazards are correlated — if there are common modes of failure, or if reducing
  one hazard raises another — then the ranking of interventions depends on a structure
  we may not know; and if we don''t know it, the theory should tell us whether the
  ranking is indeterminate or merely uncertain.

  - It should distinguish, or explain away, two very different goods that get run
  together: preserving future people''s ability to determine their own values, and
  making their lives go well by our own current lights. The second seems to license
  paternalism on an astronomical scale, and the worry about values getting locked
  in seems to push hard against it. Can a theory have both?

  - It should state its sensitivity to the scale premise — to the empirical guesses
  about how many morally significant beings the future could contain, and how much
  of the case disappears under a modest rather than an astronomical estimate.

  - It should be such that a generation that followed it would not be required to
  sacrifice indefinitely for its successors. If the future is enormous and investments
  compound, the maximizing answer may be that every generation saves nearly everything
  and consumes nothing — a result that no generation has reason to comply with and
  that, if complied with, produces the sacrifice without the benefit. Is avoiding
  that a real desideratum, or just an admission that we want a comfortable theory?


  Add whatever else you think belongs on the list; I would rather find out now what
  I''ve omitted. Then two things I care most about. First, if some subset of the requirements
  cannot be jointly satisfied, say so explicitly and show the tension — the list itself
  is then the result I want my students to see, and I''d like the incompatibility
  mapped. Second, tell me which single requirement excludes the largest number of
  the views people actually hold — the popular longtermist package, its person-affecting
  and near-termist critics, and the standard maximizing consequentialism that both
  sides tend to fall back on. One paragraph at the end showing the list in action
  is enough. Don''t write a scorecard; I''ll build that with the seminar.


