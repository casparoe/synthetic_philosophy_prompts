  I sit on the technical review panel for a programme that funds field trials of genetically
  engineered organisms for vector control and agricultural pest suppression. Every
  proposal we see runs the same risk: the case for release is argued at the level
  of the construct or the gene (a transmission advantage, a supe-Mendelian inheritance
  bias), while the risk assessment is argued at the level of the local population
  or the host–symbiont system (persistence, collapse, spread beyond the release site).
  When the two arguments give different predictions, we currently have no principled
  way to say which one to act on, or what we would have to measure to find out. So
  what we need is not another position in the units-of-selection debate but a specification:
  what a theory of the units of selection would have to be able to do in order to
  be adequate for this job — planning and auditing deliberate releases into systems
  we cannot fully control.


