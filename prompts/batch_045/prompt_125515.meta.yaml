  knowledge about how ordinary moral language is used.


  I am a high school student in an introductory ethics class, and I need your help
  with a slogan my teacher used to end an argument. We were discussing whether it
  is ever permissible to tell a small lie to spare someone''s feelings—for example,
  telling a friend that a deliberately awful poem they wrote is good, because they
  are already having a terrible week and the poem will never be published or graded.
  I argued that this is a harmless one-off exception: the ordinary rule against lying
  still does almost all the work in our shared life, and my case is not the kind of
  case the rule exists to forbid. My teacher replied with the one-liner ''What if
  everybody did that?'' and acted as if the matter were settled. That feels too quick
  to me, but I cannot say exactly why.


  What are the different precise things that slogan could actually be claiming, from
  the thinnest or most trivial reading to the most radical one? Please lay the readings
  out as a numbered list I can bring back to class. For each reading, tell me:


  1. what precise principle it states, including what ''everybody'', ''that'', and
  ''did'' are taken to refer to;

  2. whether it is a platitude, a substantive and defensible moral principle, or actually
  false or confused;

  3. whether it is a genuinely Kantian universalizability test, or instead a consequentialist,
  fairness-based, coordination-based, or purely rhetorical principle;

  4. whether it would really vindicate my teacher''s attempt to close off my harmless-exception
  example, or whether it only looks decisive because of an ambiguity.


  In your list, please make sure to address the following complications I thought
  of, and use them to sharpen the distinctions:


  - Scope of ''everybody'': Does the slogan mean literally every human being, everyone
  in relevantly similar circumstances, everyone with my desires, everyone in my social
  role, or merely enough people to trigger some threshold effect? How does each choice
  change the argument?

  - Act versus maxim: Is the slogan asking me to imagine universalizing the bare act
  (''tell a small comforting lie''), or the maxim or rule I am actually following?
  If the latter, how should I formulate my maxim, and why does that matter?

  - Roles and exceptions: Some acts seem permissible for a person in a special role
  but not for everyone. Does the slogan need to be restricted to people in my role,
  and if so, does that save my example or undermine it?

  - Logical impossibility versus bad consequences: Is the test whether universal adoption
  would be logically or conceptually impossible, whether it would be practically self-defeating,
  or merely whether it would lead to worse consequences? Which of these is my teacher
  actually relying on when she says the line, and is that reliance fair?

  - One-off exceptions: I am not advocating that everyone lie all the time; I am only
  claiming an exception for myself. Does the slogan confuse ''what if everybody performed
  this act?'' with ''what if everybody granted themselves this same exception?'' and
  does that distinction matter for my case?


  Finally, identify which precise reading the slogan would have to have in order to
  genuinely refute my harmless-exception argument, and tell me whether that reading
  is one a Kantian universalizability test would actually endorse. If my teacher''s
  use of the slogan depends on an extra empirical or consequentialist premise that
  is never stated, say so explicitly."


