  "Please adopt the role of a professional philosopher who specializes in Kant''s
  moral philosophy and in the logic of moral slogans. Think carefully, and start by
  brainstorming a broad menu of candidate interpretations before you evaluate any
  of them; do not simply assume the first reading that comes to mind. Assume you have
