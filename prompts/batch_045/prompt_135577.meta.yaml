  Draft:


  I run a monthly internal session at the company I work for — an hour and a half,
  usually sixteen to twenty engineers, mostly backend and infra, almost none of whom
  have studied philosophy. The format is usually "here is an idea from outside our
  field, let''s poke at it," and I try to make the sessions do something rather than
  talk.


  The next one I want to run is on the argument that qualia — the "what it''s like"
  properties of experience — are not a real subject matter but an incoherent posit:
  that the standard thing philosophers say they are talking about bundles four commitments
  (ineffable, intrinsic, private, and directly or infallibly apprehensible) that cannot
  all be held at once, and that once you notice this, the philosophical use of the
  term has no well-defined extension left. I want people to feel that, and I don''t
  want to stand at the front and explain it.


  [Then: what I''ve tried / constraints.] I''ve noticed that if you just ask the room
  "do qualia exist," you get twenty minutes of people insisting they are having one
  right now, and nothing moves. So I''d like an activity where the incoherence is
  something the participants run into while trying to build something.


  Here''s the shape I had in mind, which you should feel free to replace: stage it
  as a compliance exercise. A regulator requires any system sold as conscious to ship
  with an audit — a written specification of the property in question plus a procedure
  a third-party auditor can run to decide, for any given system, whether it has that
  property. Small teams, each writes a spec, then swaps with another team and runs
  the other team''s spec against a fixed case list. Then the clauses from the standard
  definition get introduced one at a time, and after each one the teams must revise
  their spec to honour it and re-run the audit. My hope is that the specs get worse
  in a legible way, and converge, under the four clauses taken together, on something
  that passes everything or certifies nothing — i.e. that the procedure becomes a
  no-op, and the participants notice that they''ve deleted their own subject matter.


  [Asks:]

  1. Concrete design: team sizes, materials/artifacts, the case list (with cases that
  push both directions: a system whose property changes with no behavioural or functional
  difference, and one whose behaviour changes while the property, by hypothesis, stays
  the same; a system that reports the property and one functionally identical to it
  that doesn''t; a subject whose report is unreliable), how the clauses get handed
  out and in what order, timing for a 90-minute session including setup and cleanup.

  2. The handout text for the four clauses and the audit brief — I want wording a
  working engineer treats as a specification, not as poetry.

  3. What I should require each team to produce at each round, so that the deterioration
  is visible on paper and I can point at it in the debrief rather than assert it.

  4. The debrief: which moment in the exercise maps onto which part of the argument;
