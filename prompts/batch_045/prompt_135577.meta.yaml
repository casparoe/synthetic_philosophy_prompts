  after each, teams must revise their spec to honor the clause (ineffable → no spec
  in words; intrinsic → not relational/functional; private → only the subject can
  access; directly and infallibly apprehensible → the subject can''t be wrong). After
  each revision, they must re-run their audit against the same case list and report
  which cases their spec now returns "can''t say" or "whatever the subject says."


