  Here is what prompted the question. Six weeks ago we shipped an AI-assisted rewrite
  of an overnight reconciliation job. It looked clean, the review comments were addressed,
  and the test suite was generated alongside the code and was green. Three weeks later
  the finance team noticed a slow drift: under a specific combination of a retried
  request and a currency conversion, some entries were being reconciled against the
  wrong side of the ledger, and the behaviour had been there since the day we shipped.
  Nobody on the team could say, when asked, why the new version had been written the
  way it had. Since then two of my colleagues, Nadia and Femi, have been arguing about
  what exactly went wrong, and they''ve asked the guild to let them present it as
  a written dialogue rather than as two competing proposals.


  Nadia''s view, as I understand it, is that nothing new happened. Engineers have
  always leaned on things they don''t fully understand — compilers, database query
  planners, cloud managed services, libraries maintained by strangers, Stack Overflow
  answers, senior colleagues who just tell you the answer. What matters on her account
  is whether the whole arrangement is reliable and whether people are calibrated about
  when to trust it, not whether any individual can re-derive the result. She thinks
  the demand that you be able to reconstruct a derivation before you rely on it fetishises
  a particular feeling, and that because attention is finite it is better spent on
  specifications, invariants and end-to-end checks than on re-deriving code that works.
  Femi''s view is that AI assistance has a structurally new failure mode, and he has
  two terms for parts of it. The first is comprehension debt: a deferred maintenance
  cost that, unlike ordinary technical debt, leaves no trace in the codebase and comes
  due at exactly the moment you need to change something, because no one left can
  say what the current behaviour was for. The second he calls the interlock problem:
  the system is tuned to be plausible to someone like you, and you were trained on
  much the same material, so its mistakes cluster in precisely the places where your
  own checking is weakest — which means your review and its output are not the two
  independent checks that reliability arithmetic assumes. He also insists on separating
  three abilities that we normally run together: being able to re-derive a result,
  being able to localise and fix a fault in it, and being able to tell a correct output
  from a subtly wrong one. His claim is that heavy assistance erodes the third of
  these first and fastest, while leaving the subjective sense of competence untouched,
  so the person least able to spot the problem is also the most confident.


