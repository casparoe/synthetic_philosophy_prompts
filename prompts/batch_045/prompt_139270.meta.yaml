  counts as a reason for an agent only if she could arrive at being moved by it through
  correct reasoning from what is already in her subjective motivational set, so the
  young man with no inclination whatever toward a military career has no reason to
  enlist merely because his family expects it, and the man who is casually cruel to
  his wife has no reason to stop unless something he already cares about can be brought
  to bear. The externalist side insists that some things count in favour of an action
  whether or not any such route exists, and that to deny this is to make it impossible
  to say the obvious thing about the cruel man. Everyone on both sides knows all of
  this, and nobody is persuaded by any of the arguments, which is what makes me think
  something other than the stated disagreement is doing the work.


