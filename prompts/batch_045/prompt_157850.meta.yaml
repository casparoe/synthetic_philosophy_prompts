  Piccione & Rubinstein 1997: The driver drives home; there are two identical exits,
  the first leads to a bad neighborhood (payoff 0), the second leads home (payoff
  4), and if he fails to exit at either he ends up at a hotel (payoff 1). He can''t
  distinguish the exits or remember passing one. The optimal ex ante plan: exit with
  probability p at each exit. Expected payoff: with prob p exit at first → 0; with
  prob (1-p)p exit at second → 4; with prob (1-p)^2 → 1. So E = 4p(1-p) + (1-p)^2.
  Maximize: derivative 4(1-2p) - 2(1-p) = 4 - 8p - 2 + 2p = 2 - 6p = 0 → p = 1/3.
  E = 4(1/3)(2/3) + (4/9) = 8/9 + 4/9 = 12/9 = 4/3. So 4/3 > 1. So the plan "exit
  with prob 1/3 at each exit" yields 4/3, better than always continuing (1). But at
  each exit, given the driver is at an exit, the probability that it''s the first
  exit is... he''s at the first exit with probability 1, at the second with probability
  (1-p) = 2/3. So being at an exit, P(it''s the second) = (2/3)/(1+2/3) = 2/5. If
  he exits: payoff = (3/5)·0 + (2/5)·4 = 8/5 = 1.6. If he continues: with prob 3/5
  he''s at the first → then continues, reaches second, exits with prob 1/3 → 4, else
  1: expected = (1/3)(4)+(2/3)(1) = 4/3+2/3 = 2; so (3/5)(2) = 1.2; with prob 2/5
  he''s at second and continues → 1, so (2/5)(1) = 0.4. Total 1.6. Equal! So actually
  with the ex-ante optimal p, exiting and continuing are indifferent — consistent.
  The paradox is more subtle: Piccione & Rubinstein note a "time-inconsistency": if
  the driver decides at an exit and uses the belief P(first)=3/5, he''s indifferent;
  but if he re-derives beliefs differently... There''s the famous issue about whether
  the driver should use the ex ante plan''s probabilities or update on "I am at an
  exit."


