  Let me draft:


  "I''m writing a short piece for a general-audience philosophy magazine about Arrival
  (2016) and the knowledge argument, and I want to get the philosophy right rather
  than hand-wave.


  Set up the mapping: Louise Banks spends the film acquiring a new representational
  system — the Heptapod language — and the film''s central reveal is that what she
  takes at first to be memories of a dead daughter are foresight: once she has the
  language, she experiences (or "remembers") events that haven''t happened. Nothing
  in the world changes; only her access to it does. This looks like a near-perfect
  dramatization of the representationalist reply to Jackson''s Mary — the view that
  Mary doesn''t learn new facts, only a new way of representing old ones (including
  Jackson''s own later position). But I want the reading tested rather than asserted.


  Questions I''d like addressed:


  1. Distinguish carefully the three options: Mary gains new non-physical facts (the
  original anti-physicalist conclusion); Mary gains only abilities, no new facts (Lewis/Nemirow
  ability hypothesis); Mary gains new representations or phenomenal concepts of facts
  she already knew (the phenomenal-concept strategy, acquaintance-based). What does
  each predict about Louise''s case specifically — what changes for her, and on which
  version of the story does the change count as knowledge in the argument-relevant
  sense?


  2. The twist I want to press: Louise''s transformation is triggered by learning
  a notation, not by undergoing anything. Call this the vehicle-first case: a new
  representational vehicle (the non-linear script) is acquired first, and the new
  mode of experience follows. In Mary''s case the order is reversed: experience first,
  concept after. Does that order matter to the argument? In particular, the phenomenal-concept
  strategy is usually defended by a constitutive/acquaintance constraint — phenomenal
  concepts can only be acquired by having the experience. If a language could in principle
  deliver the concepts without the experience (call that the linguistic Mary variant),
  would the knowledge argument collapse? And is Arrival best read as evidence that
  it would, or as a case where the language is doing something other than conveying
  concepts — more like installing a cognitive capacity, which pushes toward the ability
  hypothesis?


  3. Where the film resists: the heptapod script is said to be non-linear and to represent
  time all at once, and Louise''s new relation to the future is presented as lived
  and affective rather than propositional — she "remembers" a person she hasn''t met.
  Say whether that supports a phenomenal reading (acquaintance with what it''s like
  to experience time that way) or whether it''s better explained as a change in access
  that leaves the facts untouched. Also say honestly where the metaphor is doing work
  instead of the argument: the film leans on a strong Sapir-Whorf premise that most
  philosophers of language and mind would reject, and I''d like to know whether the
  reading survives if that premise is weakened to something defensible.


  4. Finally, what the film adds: the knowledge argument is usually discussed in the
  epistemic register (what Mary knows, what she can do, what she can imagine). Arrival
  adds the practical register — whether knowing the future undermines acting on it,
  and Louise''s choice to have the child anyway. Does that turn the philosophical
  dial at all, or is it a separate problem (foreknowledge and agency) merely sharing
  the structure? I''d like the piece to be able to say what Arrival shows that the
  standard cases don''t."


