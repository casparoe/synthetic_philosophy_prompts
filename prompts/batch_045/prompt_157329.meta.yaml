  Let me design the Mary''s room + Arrival prompt:


  Key in-the-weeds content:

  - The knowledge argument''s three-way fork: (1) phenomenal facts are new non-physical
  facts (Jackson''s original conclusion, anti-physicalism); (2) the ability hypothesis
  (Lewis/Nemirow): Mary gains abilities (to imagine, remember, recognize), not facts;
  (3) the representational/epistemic reply: Mary gains new phenomenal concepts or
  new representations of old physical facts (Jackson''s later position in "Mind and
  Illusion"; also Stoljar "physicalism and the phenomenalconcept strategy"; Balog;
  Papineau''s "new knowledge of old facts" via acquaintance).

  - The distinguishing test: does Mary gain new facts, new abilities, or new representations?
  And how to tell these apart — the notorious difficulty: any representationalist
  reply needs to explain why the new representation can''t be acquired a priori from
  the physical facts (the "a priori entailment" constraint). Actually the key objection
  to the phenomenal-concept strategy: if phenomenal concepts are just new modes of
  presentation of physical facts, why can''t Mary derive them from the physical description?
  Answer: conceptual/empirical gap due to the constitutive nature of phenomenal concepts
  (they''re formed by experiencing), which is a kind of "use-theoretic" or "acquaintance"
  constraint.


  Arrival specifics: Louise Banks learns Heptapod B; the film (and Chiang''s story)
  ties language acquisition to a change in the mode of experiencing time — she "remembers"
  the future. Notably: (a) the change is brought about by learning a new representational
  system, not by encountering new subject matter; (b) the facts about the future are
  already physically fixed, so nothing in the world changes — her epistemic position
  changes; (c) the film frames this as a skill/tool: she gains an ability to do something
  (read the future, act on it), and the drama is whether knowing the outcome undermines
  agency/free will; (d) importantly, Heptapod B is a non-linear, simultaneous script
  — a different vehicle for the same content, which maps nicely onto the "same facts,
  new representational vehicle" move.


  So the reading: Arrival is a dramatized instance of the representationalist/ability
  reply, not the anti-physicalist reading — but there''s a wrinkle: in the film, the
  new representational system changes what she can do and arguably what she experiences
  (the visions are experientially vivid, non-propositional, unfolding as lived memory).
  So does the film land on "new experience" (phenomenal) rather than "new fact" —
  which addresses the "what Mary learns is what it''s like" — i.e., the knowledge
  argument''s real bite is about acquaintance with a quale, and the film shows a case
  where acquaintance arrives via a new symbol system, which is precisely the case
  the phenomenal-concept strategy predicts should be possible.


