  ---


  I write a column on science and ideas for a UK newspaper, and I recently sat in
  on a two-hour session at a workshop on consciousness and physics where two of the
  participants argued about the ethics of panpsychism. I have reconstructed the exchange
  below from my notes; I have kept the order of the moves but tightened the phrasing.
  I am not a philosopher and I could not tell who was getting the better of it, and
  I would rather not print a garbled version of the argument, so I would be grateful
  for a careful adjudication.


  The dispute in outline: Ferreira holds that if panpsychism is anywhere near as likely
  as its recent defenders claim, then the expected amount of experience-bearing stuff
  in the universe is so vast that even a small chance of unpleasant experience at
  the fundamental level should make fundamental physics a first-order moral priority
  — not merely a curiosity. Lindqvist holds that the argument cannot get off the ground,
  and that even where it can, it does not support acting.


  Then the moves, numbered:


  1. Ferreira: [expected value/fanaticism-flavoured]: Suppose you give panpsychism
  3 per cent... the number of fundamental bearers within the observable universe is
  of the order 10^80... Multiply a tiny credence by tiny probability of negative valence
  by an astronomical headcount and you get an expected disvalue that dwarfs terrestrial
  suffering... So even before you do the physics, the conclusion is that fundamental
  physics deserves a serious share of altruistic and public research budgets, and
  that we should treat any result that bears on micro-valence as urgent.


  2. Lindqvist: [measure/counting]: the calculation has no well-defined input. Under
  constitutive panpsychism there is no canonical answer to how many subjects there
  are... In you, is there one subject, one per cell, one per particle, or a nested
  hierarchy? ... Choose a decomposition and you can make the number whatever you like
  (call it decomposition-relative expected value). Until panpsychism supplies a counting
  rule — and the combination problem is precisely its failure to supply one — the
  expected-value argument is not a calculation with a large result, it is not a calculation
  at all.


  3. Ferreira: we do not need a point estimate, only a floor that survives every decomposition
  both sides are prepared to take seriously. Count only subjects whose experiences
  are not wholly determined by those of any containing subject — call them non-subsumed
  subjects... even on the most conservative such count the numbers are astronomical.
  And note that the combination problem cuts against you: if micro-subjects fail to
  fuse, that is more separate centres of experience, not fewer, so the panic case
  is the default case rather than the exception.


  4. Lindqvist: Suppose I grant you the headcount and a nonzero probability of negative
  micro-valence. The argument is still only action-guiding if micro-valence is sensitive
  to what we do — and the standard motivation for panpsychism says it may not be.
  The Russellian thought... intrinsic natures: if the categorical bases of dispositions
  are experiential, then the natural view is that micro-valence supervenes on the
  intrinsic state of a fundamental entity... But physics conserves the inventory:
  we rearrange matter, we do not create or annihilate the bearers or the state-types
  they occupy. If valence is tied to intrinsic state-type, then the total is very
  nearly invariant under anything we could do, and mitigation is impossible in principle.
  Call it the invariance objection. Motivation and mitigation therefore pull in opposite
  directions: the better the argument for panpsychism, the worse the argument for
  doing anything about it.


  5. Ferreira: Two replies. First, a fixed inventory is not a fixed profile: which
  state-types get occupied, and how often, is exactly the sort of thing intervention
  changes (heating, compressing, binding, exciting a system shift the occupancy distribution),
  so intrinsic-state supervenience gives you no invariance at the level of totals
  over time. Second, even if you were right about strict invariance, the argument
  still supports the research conclusion: if the total is fixed and merely unknown
  in sign, then a single measurement that reveals the sign has astronomical value,
  because it tells us whether the universe is, in moral terms, a very good or a very
  bad place — and governments could act on that (or not) with a clear head. Call this
  the diagnostic fallback.


  6. Lindqvist: The diagnostic fallback is much smaller than it looks, and I am happy
  to concede a modest version of it. But the priority claim needs a negative skew,
  and you have not earned one: on the intrinsic-state picture the prior should be
  that valence is either absent or thinly spread and roughly symmetric, not that it
  is intensely negative. Meanwhile every account of valence we have any grip on makes
  valence an achievement of organisation: the states of a human being that are intensely
  unpleasant occupy a vanishingly small and highly structured region of that person''s
  possible states, and the generic state is bland. If that is the right model, then
  micro-experience is overwhelmingly likely to be neutral, and the fanatical calculation
  collapses. Call it the rarity of valence.


  7. Ferreira: I can break the symmetry, and I do not need organisation to do it.
  Take a frustration theory of valence: a state is unpleasant to the extent that the
  system in it is disposed to leave it, and pleasant to the extent that it is disposed
  to remain in it — this is roughly why pain and pleasure have the functional profiles
  they do in us. Now take cosmology: we live in a universe that is still far from
  equilibrium, whose contents are overwhelmingly in states they are on their way out
  of — radiating, decaying, equilibrating. If micro-experiences track that structure
  at all, the aggregate over cosmic time skews mildly but persistently negative, and
  mildly negative times an astronomical headcount is not mild at all. That is the
  asymmetry you asked for, and it costs me nothing that I was not already committed
  to.


  8. Lindqvist: It costs you exactly what you need. The frustration theory is a relational,
  functional, organisation-involving theory of valence, which is the sort of theory
  I was using to argue for rarity; you cannot use its structure to generate a skew
  and then deny that valence depends on how things are arranged. Worse, if you are
  right, the total is fixed by cosmological processes — the cooling of the universe
  — and the fraction of it that any human action could in principle affect is negligible.
  So at most you have an argument for finding out, not for acting, and for finding
  out only to the extent that the answer could be used.


