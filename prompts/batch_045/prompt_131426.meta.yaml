  report" or "the copy-editor''s note": a referee''s note arrives saying "at least
  one claim in chapter four is false; we can''t tell you which." Now the author has
  a lottery whose tickets are her own sentences — an externally supplied denial of
  the conjunction. Ask: which family does it belong to? And the poem''s structure
  should hint: it behaves like the lottery, not the preface — which is itself informative,
  because it shows that the preface''s second premise isn''t just a weaker version
