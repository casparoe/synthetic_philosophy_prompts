  Structural mapping:

  - Stanzas 1–2: the lottery. Per-ticket: for each ticket you know the odds are a
  million to one; you''re sure ticket #1 loses; closure (conjunction) turns N individually
  justified beliefs into a belief you know to be false. The rotation should do the
  accumulating work: each return of ODDS and TICKET feels reassuring, and CLOSURE
  keeps arriving whether or not it''s wanted.

  - Stanzas 3–4: the preface. Author''s voice: she stands behind every sentence (SURE,
  FALLIBLE, ERRATA) and yet writes the apology page. Key contrast: there''s no external
  announcement that one sentence is false — the "something''s wrong" premise comes
  from her own track record, from the length of the book, from the fact that long
  books by people like her always contain errors.

