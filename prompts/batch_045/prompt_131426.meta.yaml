  Full draft:


  ---


  You are a professional philosopher who also writes formal verse — someone who cares
  as much about whether a poem''s end-words rotate correctly as about whether its
  epistemology would survive a question from the floor. I''m a TA for a fourth-year
  seminar on epistemic paradoxes, and for our last session I want to hand out a poem
  instead of another problem set. The session covers the two paradoxes of conjunction
  and closure that everyone lumps together: the lottery paradox (for each ticket in
  a large fair lottery you are justified in believing it will lose, and closure then
  seems to entitle you to believe the conjunction, which you know to be false) and
  the preface paradox (an author is justified in each claim of her book, and is also
  justified in believing that somewhere in the book there is a mistake). My students
  treat these as the same puzzle with different costumes, and I want the poem to show
  that they are not — without ever saying so in so many words.


  Please write a sestina: six stanzas of six lines with the usual rotating end-words,
  plus a three-line tornada in which all six words return a final time, paired. Use
  these six end-words: TICKET, ODDS, SURE, CLOSURE, ERRATA, FALLIBLE (if one of them
  is genuinely unusable, substitute a near neighbour and note the substitution). The
  philosophical work should be done by the machinery of the form, not by exposition.
  Stanzas one and two should be the lottery, and the rotation itself should do the
  accumulating: each return of TICKET and ODDS should feel more reassuring, while
  CLOSURE keeps arriving at line''s end whether it is wanted or not, until the reader
  notices that the reassurance has quietly summed to something false. Stanzas three
  and four should be the preface, in the author''s own voice as she writes the apology
  page — and the point they should make, by contrast, is that nobody has told her
  anything: there is no announcement, no reported odds, only her own track record,
  the length of the book, and the fact that books like this one by people like her
  always contain at least one error. The turn comes in stanza five, and I want it
  to be a case I invented for the handout, which the seminar has not seen before:
  suppose the author receives a copy-editor''s note saying that at least one claim
  in the manuscript is false, without saying which. This is a lottery whose tickets
  are her own sentences, and I want the poem to place it — to make the reader feel
  that it belongs with the lottery rather than with the preface, even though it is
  about her own book, and thereby to suggest what the difference really is: in the
  lottery the second premise is handed to you from outside, whereas in the preface
  it comes from the same fallibility that is supposed to underwrite everything else,
  so the pressure lands somewhere else. Stanzas six and the tornada must not resolve
  anything: the six words should come round one last time with both claims still standing,
  and the last line should not name a culprit. No stanza should tell the reader what
  to conclude.


  Before drafting, spend a few lines brainstorming — say which end-word you''ll lean
