  political thought, and I want to use Kazuo Ishiguro''s Never Let Me Go as a case
  rather than as decoration. Please read the novel through the trichotomy of negative
  liberty (freedom as the absence of interference by others), positive liberty (freedom
  as self-direction or self-realization, being governed by one''s own reason rather
  than by external or alien forces), and republican liberty (freedom as non-domination:
  not being subject to another''s arbitrary power, i.e. power that need not track
  your interests and that you cannot contest). Take all three at their strongest,
  not as slogans.


  The puzzle I want handled: on a negative-liberty reading the students at Hailsham
  are, for long stretches, strikingly free — little coercion, a protected childhood,
  width to live as they like — and the violation arrives only later and briefly, at
  the donations. On a republican reading they are never free at all: from birth they
  stand under a power that fixes their fate, that they cannot contest, and that no
  amount of kindness reduces. On a positive-liberty reading something more disturbing
  is true: their deepest projects (the art, the longing for a possible, the hope for
  deferral) are not self-authored in the required sense, and worse, one of them is
  harvested by the regime as evidence that they have inner lives.


