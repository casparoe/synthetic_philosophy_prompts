  I write about physics for a broadsheet and am drafting a piece on how cosmologists
  and particle theorists argue about theories whose distinctive claims cannot, at
  present, be tested. As background I read a long magazine essay — I would rather
  not name it — and before I repeat any of its framing I would like to know how much
  of it a working physicist or philosopher of science would endorse. Compressed but,
  I think, faithful, its argument runs as follows:


  — Theorists set out to find a single set of laws that would unify the forces, and
  what they got instead was a theory that permits an enormous number of different
  low-energy worlds, on the order of ten to the power of five hundred.


  — Rather than count this as a failure, many of them reinterpreted it: if the theory
  allows all of these possibilities, and some of them are hospitable to life, then
  finding ourselves in a hospitable one is just what you would expect — provided that
  all of them are actually realized somewhere in an eternally inflating cosmos. So
  the multiverse is not an extra hypothesis bolted on to rescue a failed theory; it
  is what you get by taking your own best theory seriously.


  — And it is not merely a way of avoiding refutation, because the package makes a
  genuine prediction: that a typical observer will find itself in a universe whose
  parameters permit observers. Since we are such observers, the fact that our universe
  is biologically friendly is evidence in favour of the whole package.


  — Critics object that a theory compatible with every possible observation predicts
  nothing, and call the whole enterprise unfalsifiable and therefore — in the sense
  made famous by Karl Popper — not science. But that objection is dated. The current
  argument is that a theory can earn warranted confidence without making novel predictions,
  from considerations such as the persistent absence of any alternative and the way
  the theory''s internal parts hang together in ways nobody designed. I am told this
  line has a name in philosophy of science and is associated with a philosopher called
  Richard Dawid, though I could not confirm the details.


  Three things worry me. First, a cosmologist friend says the essay runs together
  two separate claims — that the theory has many solutions, and that those solutions
  are all physically realized somewhere — and that the second needs a cosmological
  mechanism the first does not supply. Second, the step that treats our own existence
  as evidence is where my journalistic instincts fire; I cannot tell whether it is
