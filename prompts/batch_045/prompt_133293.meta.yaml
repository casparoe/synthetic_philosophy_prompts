  Consider Populism + slogan "the will of the people" more concretely:


  Readings menu:

  1. Aggregative/majoritarian: the will of the people = the will of the numerical
  majority on this issue (as revealed by vote or poll).

  2. Unanimous/general will (Rousseau): what all would will as citizens, aimed at
  the common good — distinct from the will of all; can be what the majority wills
  only contingently.

  3. Counterfactual-deliberative: what the people would will under specified idealized
  conditions (full information, deliberation, impartiality) — "the considered will."

  4. Dispositional/corporate: the people as a group agent with beliefs/desires that
  may diverge from any individual''s (permissible under "discursive dilemma" style
  aggregation facts).

  5. Authorization/consent-based: the will of the people = whatever those currently
  authorized to speak for it say... hmm.

  6. Constructivist/procedural: there is no will prior to a procedure; the procedure
  *constitutes* rather than *tracks* the will (so the question "did the procedure
  get it right?" is empty; only "was the procedure legitimate?").

  7. Expressive/legitimating: "the will of the people" has no descriptive content;
  it''s a claim to legitimacy — an essentially contested honorific.

  8. Populist-exclusive: "the people" denotes a subset (the virtuous, the native,
  the real people) versus elites/enemies, so the will of the people is the will of
  the morally qualified part — a moralized reading.

  9. Negative: the will of the people = whatever the people would rebel against /
  refuse to accept (a "veto" reading).

