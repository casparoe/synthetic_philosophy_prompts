  axiology* or a *counterexample to the decision procedure*, and the role of *interpersonal
  comparison* / the fact that utilitarianism requires cardinal, interpersonally comparable
  utility — the monster is really the claim that utilitarianism''s aggregation is
  hostage to the *units* of interpersonal comparison (any affine rescaling of one
  person''s utility function with positive multiplier makes them a monster). That''s
  a nice, real point: if utility is only defined up to positive affine transformation,
  then "monster" status is not a property of the being but of the choice of scale
  — so the monster objection, if it has force, is really an objection to the determinacy
  of interpersonal comparison, and the monster is just the name for a normalization
  artifact. That''s genuinely in the weeds and philosophically meaty, and it''s a
  known-ish idea (utility monsters as a problem of normalization/level comparability)
  but not a regurgitated talking point.


