  ---


  I''m flying out next week to present my job-market paper, "The Utility Monster Is
  a Unit Convention," to a department that is hiring in philosophy and public policy,
  and I want a Q&A prep sheet rather than a defense of the view.


  The paper''s thesis and argument sketch, so the objections have something to bite
  on. The utility monster — the familiar creature who draws far more welfare from
  each unit of resource than anyone else, so that total utilitarianism appears to
  require handing it everything — is standardly treated as an objection to the aggregative
  structure of utilitarianism. I argue it is instead an artifact of the units of interpersonal
  comparison. Each person''s utility representation is determined only up to positive
  affine transformation, u → au + b with a > 0. For a fixed population the b''s drop
  out of total welfare, but the a''s do not: multiply anyone''s utility function by
  a large enough constant and the sum-maximizing allocation sends them the resources.
  So on a pure "ordinal-plus-level-comparability" reading of interpersonal comparison,
  who the monster is — and whether there is one at all — is not a fact about any creature
  but a fact about the choice of scale. I then distinguish two ways of fixing the
  scale, which I call range normalization (equalize the distance each person can travel
  between a life not worth living and their best attainable life) and unit-of-sacrifice
  normalization (fix each person''s unit at the largest cost they could bear and still
  count as benefited on the whole), and I argue that each is a substantive moral claim
  in its own right, not a measurement result. The payoff I want: since the choice
  is moral rather than empirical, the familiar anti-monster moves — prioritarian weighting,
  sufficientarian floors, and per-person caps — are best redescribed as three different
  ways of fixing, or refusing to fix, the scale, and one of them (the cap) is not
  really in the same business as the others.


