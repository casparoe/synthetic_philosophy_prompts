  ---


  Last night I had a long, unresolved argument with a friend about epistemic injustice,
  and I want a thought experiment that either settles it or shows us what we were
  actually disagreeing about.


  The disagreement. We agreed on the standard shape of the account: a speaker suffers
  testimonial injustice when a hearer, because of identity prejudice, affords them
  less credibility than they deserve, and the wrong consists in the speaker being
  undermined in their capacity as a knower. We then got stuck on the following: suppose
  the prejudice-driven credibility assessment is, at the moment of the exchange, exactly
  as low as the speaker''s own presentation merits — because an earlier history of
  being under-credited has made the speaker hesitant, hedging, and deferential in
  the way they testify. My friend says: then the hearer has done nothing wrong; the
  credibility they gave is the credibility the speaker''s evidence supported, and
  whatever injustice there is belongs upstream, to whoever produced the hesitancy.
  I say: the hearer is still committing a wrong, because what the speaker deserves
  is not settled by the distorted presentation but by what that presentation would
  have been had the speaker not been shaped by a history of prejudice. Call these
  the local-calibration reading and the history-adjusted reading.


  I want a case that makes the two readings come apart cleanly, for use in a paper
  section arguing that testimonial injustice can be diachronic — i.e., that a hearer
  can wrong a speaker even while their credibility judgment is perfectly in line with
  everything available to them in the moment.


  Constraints on the scenario:

  1. Realistic and ordinary: a hospital handover, a workplace incident report, a school,
  a police interview — no science fiction, nothing exotic.

  2. One paragraph, roughly 150 words.

  3. The hearer must be someone who thinks of themselves as scrupulously evidence-driven
  and who is not a bigot by their own lights, and the deficit must be one a careful
  professional could actually exhibit. No cartoon villainy, no overt slurs.

  4. The speaker must genuinely know what they say: the case must not work by having
  the speaker actually be unreliable, or junior, or uninformed.

  5. The identity cue (accent, race, age, class, disability, gender) must be doing
  the work: if you swap it for a cue associated with the dominant group and hold everything
  else fixed, the deficit disappears.

  6. The hearer must not be the person who produced the speaker''s hesitancy — otherwise
  the case collapses into an ordinary single-wrongdoer case and my friend will just
  agree with me for the wrong reason.

  7. Crucially, the case must not stipulate the verdicts. It has to be built so that
  the two readings generate their different answers from their own content; if you
  find yourself writing "and this is a testimonial injustice," the case has failed.


  What I want from you, in this order:


  1. The scenario — one paragraph, about 150 words.

  2. Why the identity cue is doing the work — about 120 words: run the swap test from
  constraint 5 and show that the non-prejudicial explanations (inexperience, surprising
