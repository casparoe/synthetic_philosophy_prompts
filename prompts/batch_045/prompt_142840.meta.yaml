  For karma as moral desert: What are the pressure points?

  - The epistemic problem: we don''t remember past lives, so how can the punishment
  be morally communicative or reformative? Standard retributivism often requires that
  the punished person be able to understand why they are being punished. Karma lacks
  that. Question: "If a person has no access to the past-life wrongdoing that is supposed
  to make her suffering deserved, in what sense is the suffering addressed to her
  as a moral agent? Follow-up: Doesn''t this make karmic desert more like a natural
  evil (a disease) than like punishment?"

  - The problem of proportionality: how is the amount of suffering matched to the
  gravity of the past wrongdoing? Karma is often vague. Ask: "What is the metric of
  proportionality? Is it eye-for-an-eye, or does it track culpability?"

  - The problem of collective/karmic families? Maybe too niche.

  - The moral hazard / victim-blaming: if we explain current suffering as deserved,
  does that undermine compassion and the duty to aid? Ask: "If a child suffers from
  a painful disease, and your view entails this is karmically deserved, what does
  that imply for the moral obligations of observers? Follow-up: Does your view give
  us any reason not to alleviate undeserved-looking suffering if desert is invisible
  to us?" Actually the view says it IS deserved, so alleviating it might be interfering
  with cosmic justice. Ask that.

  - The "just world" empirical problem: the distribution of suffering looks random
  and disproportionate to any plausible moral ledger (e.g., natural disasters, infant
  mortality). Ask: "How does the view respond to the problem of evil / the apparent
  randomness of suffering?"

  - The infinite regress / beginning problem: if every suffering is payback for a
  past life, and every past suffering was payback for an earlier one, when did it
  start? Standard Indian philosophy has beginningless karma (anadi). Ask: "Is the
  karmic series beginningless? If so, can there be moral desert without a first wrongdoer?
  Follow-up: does an infinite regress of desert explain anything, or does it just
  push the mystery back?"

  - The problem of identifying the agent: karma is often described as a natural law,
  not a punisher. Does desert require a punisher? Retributivist desert might be agent-relative.
  Ask: "Can there be desert without a judge? If karma is a mindless causal law, in
  what sense is the suffering deserved rather than merely caused?"

  - The problem of the self: if there is no enduring self (anatman, as in Buddhism)
  or if personal identity across lives is weak, who is the ''same'' person who deserves?
  Ask: "What theory of personal identity across rebirths does the view require? If
  the connection is merely causal, is it enough for desert?"


