  Disanalogies that matter:

  - In the email game, the uncertainty is about whether *the message got through*,
  i.e., about the other''s information, and it''s "common p-belief" for every p<1
  but never common knowledge (1-belief). Monderer & Samet: common p-belief, ε-common
