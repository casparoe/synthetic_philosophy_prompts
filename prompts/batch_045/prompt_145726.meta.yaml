  ---


  Bit of a strange one, but I''ve somehow ended up sitting on my hospital''s clinical
  ethics comittee — supposed to be a single meeting, two years ago — and there are
  two things we do there that I can''t get to sit together. I want to know what each
  of them commits us to about what life *is*.


  The first: we certify patients dead on neurological criteria — no brain-stem reflexes,
  no drive to breathe — while the ventilator keeps the heart going, the skin heals,
  wounds knit, infections get fought off, and in the rare pregnant cases the unit
  has carried a foetus for months inside someone we''ve already signed off as dead.
  Legally, that''s a corpse. Biologically, it''s doing an awful lot of the stuff I
  put on the first slide of my philosophy of biology lectures.


  The second: we run a dead-donor rule. Nobody may take organs from someone who isn''t
  dead, but the organs have to be alive when they come out. So the moment death is
  declared we switch from "this is a patient, protect them" to "this is a set of parts,
  keep each one warm and perfused" — and in donation after circulatory death we stand
  around and count off a short no-touch interval before anyone lays a hand on the
  body. How long that interval is varies by protocol, and everyone in the room knows
  it''s a bit of a fudge, but nobody knows what would settle it.


  So: reconstruct the account of life — and of where life is located, organism or
  part or process — that this pair of practices is running. Is it one account, or
  is the hospital simply doing different metaphysics depending on whether it''s treating
  or procuring? What I''d like, concretely:


  - what the practices strictly presuppose — what would actually break if we gave
  up that bit of the concept, as opposed to what just sounds natural alongside it;

  - where they''re underdetermined and several rival accounts of life would license
  exactly the same behaviour, so the practice tells us nothing;

  - and whether the two halves are even consistent with each other.


  I''ve also been playing with a criterion of my own that I''d rather have stress-tested
  than indulged. Call it the subsidy criterion: a system is alive iff the work of
  holding it far from equilibrium is being done by that system, not by something outside
  it. On that view the ventilated body doesn''t count — the gas exchange, the temperature
  control, the fluid balance are all being done *to* it — and it fails in the same
  way a flask of cells in an incubator fails, which is why nobody thinks a cell line
  that''s been dividing for decades is an organism however busily it metabolises.
  But it obviously over-reaches: someone on ECMO for six weeks who then wakes up was
  surely alive the whole time, and a newborn is alive while its mother''s body does
  essentially all of its regulation for it. So I want to know whether the hospital''s
  practice is actually committed to something like the subsidy criterion — in which
  case my over-reach is their problem too — or whether they''re better off saying
  "no, the body is alive, it''s just not a person any more" and getting everything
  they need from a completely different distinction: life versus personhood, organism
  versus agency, whatever.


  If you go the second route, tell me what would have to change in practice if we
  swapped in the subsidy criterion instead: would we owe the ventilated body something
  we don''t currently owe it, would the dead-donor rule fall apart or become trivial,
  would keeping a brain-dead pregnant woman going for months become indefensible,
  and would it change anything about the embryos? On which: the IVF side of the same
  hospital freezes embryos for years, then uses them, gives them to research, or bin
  them, and there''s a legal limit on how long an embryo may be kept growing in vitro.
  Frozen isn''t treated as dead and isn''t treated as alive either. If your reconstruction
