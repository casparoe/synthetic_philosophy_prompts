  5. Retrospective/selection-effect: we read history as progress because we select
  which dimensions count (survivor bias; measuring what we now value; progress in
  values not in outcomes).

  6. Self-fulfilling: the claim is a call to action; believing it makes it true (mobilization),
  so it is performative, not predictive.

  7. Normative/moral: we owe it to the dead/future to make it true; it''s a statement
  about obligation disguised as prediction.

  8. Anti-consolation/ideological: it functions to quiet the urgency of present injustice
