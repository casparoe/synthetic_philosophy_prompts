  The Argument (as the asker presents it):


  (1) A predicate marks a natural kind only if the properties in virtue of which its
  instances belong together are ones that nature, and not we, has singled out: that
  is, only if there are true, non-accidental, projectible generalizations — laws,
  or lawlike regularities — that hold of all and only its instances.

  (2) Given any classification of a domain, and any finite set of observations supporting
  it, one can always construct an alternative predicate which is grue-like: it agrees
  with the original predicate on every observed case — hence fits the data exactly
  as well — but which sorts the unexamined cases differently.

  (3) What it is for a generalization to be non-accidental and projectible cannot
  be anything more than fitting the data and being usable in inference; there is no
  further fact about "what nature has singled out" for us to consult beyond the success
  of the scheme that employs the predicate.

  (4) So the grue-like alternative is as much a natural-kind predicate as the original:
  if it is admitted, there are at least two incompatible classifications of the same
  domain, each equally joint-carving.

  (5) But a joint is where the thing actually divides. If a domain genuinely divides
  along one set of lines, a rival scheme that divides it differently does not carve
  it at its joints; and if two rival schemes are equally good, then neither has been
  shown to carve anything, and the most we have is a catalogue of our own conveniences.

  (6) Since a grue-like rival can be constructed for any classification whatever,
  no classification carves nature at its joints. Chemistry''s elements and compounds
  are classifications. Therefore no chemical kind is a natural kind.


  And (7) the asker''s resistance: "I cannot accept (6) and I do not think I have
