  Structure plan for the prompt:


  Opening: I moderate a large online history discussion board, no academic training,
  ten years of reading. We have a moderation problem: distinguishing pseudohistory
  from legitimate but unpopular revision, without adjudicating substance. What I want
  is the spec, not a verdict on particular theories.


  Purpose statement (fix it): a triage rule for a general-purpose history forum, applied
  by moderators who know a fair amount of history but are not specialists in the period
  at issue, in a few minutes, in public, defensible to a user who says we''re gatekeeping
  for the academy. No specialist consultation. Not a theory of what''s true — a rule
  for what gets removed, labeled "contested," or left alone.


  Then the deliverable: list of desiderata, each with the case or consideration behind
  it, and each marked non-negotiable / negotiable / pretend-to-be. Plus which pairs
  are jointly unsatisfiable and which single requirement excludes the most candidates.
  Brief scorecard at the end for: deference-to-consensus; falsifiability; method/responsiveness;
  burden-of-proof; research-program progress (Lakatosian); Bayesian priors / conspiracy-size;
  and a "sociology of the field" view. Ask to flag any that are really the same test
  in disguise.


  Cases it must get right (give them generically so no lookup needed):

  1. Atlantis (from a philosopher''s dialogue, treated as real history by enthusiasts).

  2. Ancient astronauts attributed to Erich von Däniken.

  3. Fomenko''s compressed chronology (a mathematician using statistics over chronicles,
  claiming the standard timeline was fabricated).

  4. The material that has no author, no book, mostly photographs of buildings with
  windows below current street level and star-shaped earthworks in old maps ("Tartaria"/mud
  flood) — must be classifiable even though there''s no one to interrogate and no
  canonical statement.

  5. Must NOT flag: continental drift (outsider, no mechanism, later vindicated);
  Troy (a literary epic treated as a guide to real place, dug up); a people known
  only from one ancient text and doubted as an invention, later confirmed by excavation
  of their capital; the Norse land west of Greenland confirmed by an excavated site
  in Newfoundland.

  6. Must handle: a period where specialists genuinely disagree with each other (e.g.,
  what ended the Bronze Age palaces) — internal disagreement must not be an open door.

  7. Must handle: nationalist/ideological history that is methodologically ordinary
  vs. nationalist myth that isn''t; and a true claim that came from a bad motive,
