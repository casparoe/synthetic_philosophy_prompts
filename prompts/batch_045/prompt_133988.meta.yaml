  Draft:


  ---


  I had a long argument with a friend last night about whether *collapse* is ever
  more than a way of moralizing about people who were not us, and I came away unable
  to say what I actually think. Her position was that societies do not fail, they
  only change, and that calling a change a collapse just imports the values of whatever
  the losers happened to care about. I think that is half right and half evasion:
  some of the changes we group under this word really do seem to be losses, and losses
  of a distinctive kind, not merely changes we disapprove of. But I cannot state the
  difference, and my verdicts on cases do not line up. So I want to try reflective
  equilibrium on myself, and I would be grateful for your help — in American English,
  please, and without any reading suggestions, since I am not going to follow them
  up.


  Cases. Then verdicts:


  1. Palace economies of the eastern Mediterranean at the end of the second millennium
  BCE: great houses, palace bureaucracies, long-distance trade in metals, and a script
  used for keeping accounts — all gone within a couple of generations; Greek world
  forgets how to write for centuries; settlements smaller, poorer, simpler. My verdict:
  collapse, and the paradigm one. Also: the thing that weighs with me most is not
  the poverty but the lost script: the grandchildren could not read what the grandparents
  wrote.


  2. Southern lowland Maya cities: monumental building and dated royal inscriptions
  stop in roughly the eighth to ninth centuries CE; the southern cities are emptied;
  but Maya people, language, maize farming, and later northern cities continue. My
  verdict: not a collapse, or at most a collapse *of* divine kingship and not of a
  society. My friend says this is special pleading: I am choosing the unit to get
  the verdict I want.


  3. Rapa Nui: statues toppled, a smaller population by the nineteenth century, much
  of it owing to European disease and slaving raids. My verdict: collapse, and I feel
  it strongly — but the cause is largely external, and I also want to say that a society
  destroyed from outside has not collapsed, it has been destroyed. Those two thoughts
  do not fit together, and I would rather keep both and drop a principle than choose.


  4. Glasshouse (invented): an island community whose numbers fall by two thirds over
  two centuries; not from famine or disease but because a new religion persuades people
  to have far fewer children; those who remain eat better, live longer, are all literate,
  and produce the finest sculpture the island has ever seen; they stop maintaining
  the old ceremonial centres, and after four generations no one can explain what the
  old ceremonies meant. My verdict: not a collapse, emphatically, even though everything
  my friend would measure has gone down. My friend''s verdict: obviously a collapse.


  5. A rich country two centuries from now: fertility long below replacement, population
  half what it was, income per person higher than ever, no one poor, no one hungry,
