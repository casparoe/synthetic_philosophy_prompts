  so the treaty enforces itself with no referee, no repeat rounds, no reputaion. Conclusion
  he draws: once AI systems can inspect each other (weights, code, whatever), cooperation
  between them is basically solved by transparency alone, so we shouldn''t spend research
  effort on commitment mechanisms / enforcement / multi-agent handshaking — just make
  everything auditable and conflict takes care of itself.


