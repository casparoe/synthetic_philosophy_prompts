  the community gave me birth records which establish, fairly clearly, that a recessive
  condition is far more common among children born there than the elders admit, and
  that families are not told about carrier screening that exists and is free. The
  elders'' position, as they have explained it to me, is not that the condition is
  harmless: it is that public knowledge of it would mark every family in the settlement
  as risky marriage prospects, that the settlement would not survive that, and that
  whether to use the screening is a decision the community should make for itself.
  I believe them about the consequences. I have also watched the people who would
  bear the cost of the decision — mostly young women who had no part in making it
  — being given no say in it, and I notice that the word "we" is doing a lot of quiet
  work in their argument.


  Three complications. First, my editor says my obligations depend on which book I
