  I''m writing an essay for a volume on free will and foreknowledge in popular film,
  and I want to read Spielberg''s Minority Report (from Philip K. Dick''s short story)
  as a film about middle knowledge rather than about simple foreknowledge.


  The core of the reading: precrime''s warrant isn''t that it sees what will happen
  — on its own institutional logic the whole point is that what it sees never happens.
  So the object of the prevision is, structurally, a counterfactual of freedom: what
  this agent would do in these circumstances, absent the intervention. That is the
  Molinist''s scientia media almost exactly, and the film''s legal setup (arrest for
  a murder that is about-to-be, the doctrine that the prevision is treated as already
  conclusive) looks like an institution built on the assumption that such counterfactuals
  are both true in advance and knowable by a non-divine observer.


  But I want the essay to be more than "the film is Molinist." Specifically:


  1. Distinguish three readings of what the prevision tracks: (a) simple foreknowledge
  of the actual future (which the film''s own practice of intervention makes self-defeating),
  (b) middle knowledge of counterfactuals of freedom (true independently of any causal
  setup), (c) what I''d call the staged-counterfactual reading, where the prevision
  is true because someone has arranged the circumstances so that the agent will do
  the thing — which is how the conspiracy at the heart of the plot actually works.
  I''d like you to tell me which of these the film''s opening sequence commits it
  to, which one the ending commits it to, and whether any single reading covers both.
  My own suspicion is that the film starts as a Molinist tract and ends as a debunking
  of it, and I want that argued rather than asserted.


  2. Scene-level work: the sequence where Anderton is shown his own prevision and
  then goes on to do the thing; the room where the previsions are assembled from three
  divergent sources, and the doctrine of the minority report; the final confrontation
  where the murderer more or less insists that Anderton still has a choice. For each,
  say what in the Molinist apparatus it illuminates and where it presses on it — in
  particular whether the film''s knowledge is causal (showing Anderton the vision
  is part of what produces the killing), which is exactly the feature middle knowledge
  is supposed not to have.


  3. The minority report itself: within Molinism, disagreement about counterfactuals
  of freedom is not well-modeled by two sources disagreeing about the same one, since
  on the standard picture the counterfactual about what S would freely do in C has
  a unique truth value. Does the film''s device of divergent previsions from the same
  circumstances map onto anything in the actual debate — the restriction to feasible
  worlds, the question whether God can actualize any world he likes — or is it just
  a plot mechanism the Molinist can absorb? I''d rather you said "plot mechanism"
  than manufactured a mapping.


  4. Where the film resists: I don''t want a reading that turns it into an illustrated
  textbook entry. Say plainly which parts of the movie are doing something else —
  the surveillance, the eye-transplant, the domestic plot — and what the film adds
  to the philosophy that a paper on middle knowledge doesn''t: something about the
  institutional temptation to treat a counterfactual as a crime, or about what knowing
  your own future does to agency.


  Please don''t spend the essay on plot summary, and don''t cite secondary literature;
  I want the argument to stand on the film as most viewers remember it, and on the
  structure of the Molinist position rather than on who said what when.


