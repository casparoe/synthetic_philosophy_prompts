  ---


  Youre a professional philosopher who''s spent your career on epistemic paradoxes
  — surprise exam, hangman, the lot — and you''ve also done a bit of consulting for
  regulators, so you know how policy documents actually get written. Take your time,
  and before you commit to an answer, brainstorm at least three or four different
