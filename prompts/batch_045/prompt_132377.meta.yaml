  one you think is right and why the others are worse. I''d rather have a careful
  diagnosis than a tidy answer.


  Here''s the thing. I''m on a small committee rewriting the "unannounced inspection"
  policy where I work (we inspect workplaces for safety compliance, few hundred sites
  a year). And I keep having the feeling that our policy is doing something impossible,
  and also that it obviously isn''t, because we did it about 300 times last year.


  Concretely, this is what we do:

  - At the start of the year every site gets a letter saying it will receive exactly
  one inspection during the year, and that the inspection will be unannounced.

  - The inspection window is the calendar year, but we exclude december (and we exclude
  the last week of the year specifically so that the visit is "genuinely a surprise"
  — someone put that in the policy years ago).

  - The day isn''t random in any formal sense. The regional scheduler picks a day
  that works for the inspector, and generally tries to spread visits out.

  - If word gets out in advance — a manager hears from another site that the inspector
  is in the area — the visit gets pushed and rescheduled, on the grounds that it wouldn''t
  be a real inspection any more: they''d have had time to tidy up.

  - After the fact we grade the visit partly on how the site responded in the moment:
  whether records were produced on the spot, whether the place looked like a normal
  working day. And the point of the whole regime, officially, is deterrence: you don''t
  know when we''re coming, so you comply all year.


  Now, the philosophers'' version of this — the surprise exam, or the unexpected hanging
  — says the announcement is somehow trouble: there can''t be a surprise on the last
  day of the window, so not on the second-to-last, and so on. Our policy seems to
  be living proof that either that argument is wrong or we are all confused about
  what we''re doing.


  My hunch is that the whole thing only needs "you can''t be certain enough to change
  your behaviour" and that the trouble starts as soon as you read surprise as a knowledge-requiring,
  all-or-nothing property. But I can''t shake two other things: (a) we deliberately
  cut the last week out of the window, which looks like conceding the backwards induction
  while only conceding one step of it, and (b) our letter literally says there *will*
  be one visit, and if the philosophers are right that no such announcement can be
  true/believable/whatever, then we''ve been sending out a defective sentence to 300
  people a year and it seems to work fine.


  So: what does this practice presuppose? Specifically —

  - What view of "surprise" (or of knowledge, certainty, rational belief, predictability)
  does the policy only make sense under, and what does it quietly rule out? Does it
  need the inspectee''s uncertainty to be about which day rather than whether? Does
  it need surprise to be a matter of degree — how many hours of forewarning — rather
  than a yes/no, given that plenty of inspection regimes (ours included, in draft)
  define "no notice" as a minimum number of hours?

  - Does it need the event to be objectively chancy? Our procedure isn''t random at
  all, and nobody thinks that''s a problem. What does that tell you?

  - Is there anything inconsistent about it: we exclude the last week, we use "will"
  rather than "may", we cancel when word gets out. Do those parts presuppose the same
  thing or different things?

