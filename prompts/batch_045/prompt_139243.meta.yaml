  ---


  I am applying for a one-year dissertation fellowship and need a two-page research
  proposal on safe Pareto improvements. My half-formed idea is that the notion has
  an unnoticed dependence on the planner''s epistemic position, and I want the proposal
  to turn that into a precise question.


  The idea, as I am working with it, is this. There is a status quo policy, a set
  of feasible alternatives, a finite set of people, and a finite set of states of
  the world. Each person has a utility function over outcomes and a probability distribution
  over states. Say that a move from the status quo to an alternative is a safe Pareto
  improvement if, for every person, that person''s own expected utility—computed with
  that person''s own probabilities and their own utility function—is higher under
  the alternative than under the status quo. The appeal is that the standard requires
  no interpersonal comparison and no social welfare function, and it seems to let
  a planner who knows nothing about the merits of the dispute still make things better.
  ...


  My worry: the guarantee is conditional on each person''s actual beliefs, but the
  beliefs are exactly what the planner does not observe. If the planner has to ask,
  then anyone who expects to lose from a proposed change can report probabilities
  under which it looks bad, and reporting pessimism is costless; conversely people
  may report confident beliefs to push through changes they like. So safety may be
  safety relative to reported beliefs only. And there is a structural point behind
  the strategic one: the status quo is the disagreement point, so "no change" is available
  for free, and anyone can secure it by reporting suitably unhelpful beliefs. I suspect
  some kind of impossibility: a mechanism that (i) always selects a safe Pareto improvement
  when one exists given the true beliefs, (ii) never gives anyone an expected-utility
  gain from misreporting their probabilities, and (iii) is not simply a rule that
  defaults to the status quo or listens to one designated person, cannot exist — or
  can exist only with a characterization so narrow that it tells us the notion is
  not institutionally usable. I don''t know whether that is right, and I don''t know
  whether the right conclusion is a pessimistic one about safe Pareto improvements
  or a redesign of the notion.


