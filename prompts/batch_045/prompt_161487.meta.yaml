  Alternatively inject novelty into the earlier verdicts: one precedent involves a
  "sunsetted" measure (formally reversible, practically sticky). Let''s add precedent
  8: "They declined to refer a five-year suspension of a constitutional right during
  an emergency, on the grounds that it lapses automatically — even though everyone
  expected it to be renewed twice." That kills a naive "reversibility" reading and
