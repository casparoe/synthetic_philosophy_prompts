  I am preparing the closing lecture of an undergraduate seminar I teach on ethics
  and film, and this year I want to end with Frank Capra''s It''s a Wonderful Life,
  read against the cluelessness objection to consequentialism — the worry, roughly,
  that for most of the things we do the downstream causal consequences are so numerous,
  so chaotically sensitive and so far beyond our epistemic reach that we cannot tell,
  even in expectation, whether what we do makes things better or worse, and that this
  ignorance is not a remediable failing of ours but a feature of the situations we
  are in. My hope is that the film does something the journal literature does not:
  it gives the problem a face, by showing us, in the Pottersville sequence, precisely
  the thing the objection says we can never have — a view of the total difference
  one life makes — and then taking it away again. What I want from you is a close
  reading of the film in those terms, scene by scene where it matters: the boyhood
  rescue at the frozen pond and Harry''s later career as a pilot, the capsules that
  Mr Gower would have filled in error, the run on the Bailey Building and Loan, the
  "wish I had never been born" bridge, and the final gathering in the Bailey parlour.
  Before I write the lecture I would also like you to work with three distinctions
  I have been playing with, which I have not seen drawn in quite this way. The first
  is between what I''ll call sign-cluelessness (we cannot tell whether the net effect
  of an act is positive or negative) and magnitude-cluelessness (we can tell the sign
  but have no idea how large it is): Pottersville seems to me to deliver spectacular
  magnitude knowledge but arguably no sign knowledge at all, since George is shown
  a world without himself rather than a world in which he had simply acted otherwise
  — which raises the second distinction, between the total-effects comparison a guardian
  angel can perform and the contrastive comparison (this act versus the nearest alternative
  available to me at the moment of acting) that consequentialism actually requires.
  Third, I want you to consider what I''ve been calling counterfactual completeness:
  the film shows one fully worked-out downstream branch, closed and coherent, whereas
  the objection trades on the openness and branching of causal chains — is the film,
  in other words, cheating by giving causal chaos a narrative shape? And, more mischievously,
  is Clarence''s own intervention subject to the same problem? He acts on George''s
  behalf on the basis of a guess about how George will respond, and it very nearly
  goes wrong.


