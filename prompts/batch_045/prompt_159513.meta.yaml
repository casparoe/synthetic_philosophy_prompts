  \ I’ll add citaitons myself. Same for any reading list.\n\nMy half-formed idea:\
  \ “Darwinism” as Popper argued about it isn’t one theory but a layer cake of at\
  \ least three different things glued together. There’s (1) the big historical claim\
  \ that species are modified descendants of common ancestors and that all terrestrial\
  \ life probably goes back to a few simple organisms; (2) a population-genetic /\
  \ model-building layer where, if you specify things like mutation rates, selection\
  \ coefficients, population size, and an independent measure of fitness, you get\
  \ concrete predictions about allele frequencies and trait distributions; and (3)\
  \ an adaptationist heuristic: assume that most widespread traits are there because\
  \ natural selection put them there, and look for selectionist explanations first\
  \ unless you have special reason not to. I think Popper’s early charge that Darwinism\
  \ is “not a testable scientific theory, but a metaphysical research programme” was\
  \ really mostly about (3), and maybe about a sloppy version of (2) where “fitness”\
  \ is just defined by actual survival, so “survival of the fittest” looks like a\
  \ tautology and he even called the theory “almost tautological.” His later recantation,\
  \ where he says the theory can be formulated so it is far from tautological and\
  \ is testable, was mostly about (2), and maybe (1) too. But (3), the “look for adaptive\
  \ explanations” framework, still looks untestable on its own: no failure of any\
  \ particular trait to have a selectionist story seems to refute the heuristic itself,\
  \ because you can always say the trait is a byproduct, a constraint, drift, or you\
  \ haven’t found the right selective regime yet.\n\nSo the question I want the proposal\
  \ to ask: can Popper’s own demarcation machinery handle a composite object like\
  \ this—part testable model, part historical narrative, part untestable-but-heuristically-vital\
  \ framework—or do we need to supplement falsifiability with some notion of “framework\
  \ appraisal” (explanatory fertility, ability to generate novel testable models,\
  \ resistance to ad hoc rescue, maybe something like degrees of empirical content\
  \ inherited from the models a framework spawns)? A sharper way to put it: is Popper’s\
  \ recantation best read as (a) a genuine retraction, (b) a relocation of the “metaphysical\
  \ research programme” label from the whole theory to just the adaptationist heuristic\
  \ / framework layer, or (c) a sign that his falsifiability criterion is too coarse\
  \ to classify real historical sciences, so we should replace or supplement it? I\
  \ want the question stated so it has a determinate answer (one of those options,\
  \ or a defended taxonomy with conditions), not just an “explore the issue” prompt.\n\
  \nWhy the existing answers leave it open: the obvious moves are (i) “Popper was\
