  and I want you to separate the defeaters a defender of this position would themselves
  concede from the ones they''d dismiss as question-begging. Three lines of pressure
  seem worth testing. (i) Is the existence requirement independent support, or is
  it a restatement of the conclusion dressed as a principle? Consider whether other
