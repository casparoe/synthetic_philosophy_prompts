  I hold a fairly specific version of the Epicurean position about death, and I''d
  like a map of what it risks rather than a defense of it. Here is the version. Nothing
  is intrinsically bad for a person unless there is a time at which that person exists
  and at which it is bad for them; I''ll call this the existence requirement. Death,
  on this view, leaves no such time: once someone is dead there is no subject left
  for the harm to attach to, and while they are still alive their death is still future
  and, so I claim, not yet intrinsically bad for them — the familiar dread is a matter
  of attitude, not of a pending harm. Two things distinguish my version from cruder
  ones. First, I am not committed to an experience requirement: I happily grant that
  a person can be harmed, at a time when they exist, by things they never experience
  — the collapse of their life''s work during a dreamless coma, a betrayal they will
  never learn of, the quiet destruction of their reputation. So the work is being
  done entirely by the subject''s existence, not by their consciousness. Second, I
  reject merely counterfactual losses: that you would have had forty more good years
  is not by itself a harm unless there is a time at which it is had. I also accept
  the consequences in the cases my reading group raises: annihilation followed by
  exact reassembly a year later is not bad for the traveler even though no time seems
  to pass from their own point of view; the Lucretian symmetry with the time before
  birth holds; and whatever badness death has is exhausted by the process of dying
  and the effects on others.


