  Draft the question text:


  > Suppose neurophysiology discovered that in adult humans some occurrent mental
  states are, at a single time in a single subject, fully realized by each of two
  non-overlapping neural populations: each population on its own occupies the complete
  causal role characteristic of that mental state, and disabling either while leaving
  the other intact changes nothing in the subject''s psychology or behaviour. Call
  such a state co-tenant. In no more than 500 words: (a) does co-tenancy cause trouble
  for the type-identity theory that ordinary cross-species multiple realizability
  does not, and why? (b) does it threaten token-identity? (c) a critic objects that
  once realization is allowed to be many-to-one, functionalism loses its grip, since
  for any physical system and any causal role there is some description under which
  the system occupies that role — so everything realizes everything. Assess this "promiscuous
  realization" objection and the best available reply. (d) can the identity theorist
  escape (a) by identifying the mental type with a disjunction of physical types?


  Student''s answer:


  > Ordinary multiple realizability says that one mental type can be realized by many
  physically unrelated types, so no single physical type can be identical with it.
  But the identity theorist has a standard hedge: identity may fail globally while
  holding locally — within a species, or within a single subject at a time, one physical
  type may do all the work. Co-tenancy is what removes that hedge, and that is why
  it bites harder than cross-species cases: here even a single subject at a single
  moment offers two distinct physical realizers, so there is no local type-identity
  left to retreat to.

  >

  > (b) Co-tenancy also settles the token question. Token-identity is the claim that
  each mental particular is identical with exactly one physical particular; co-tenancy
  gives us one mental particular with two, so token-identity is false. Functionalists
  who say they reject type-identity but keep token-identity are therefore kidding
  themselves: once realization is many-to-one at the token level, realization cannot
  be identity at any level, and the mental particular must be a distinct, higher-level
  item over and above both neural populations.

  >

  > (c) The promiscuous-realization objection is serious but answerable. If any system
  can be described as occupying any role, then functionalism individuates nothing
  — a mousetrap realizes belief under some mapping. The functionalist''s reply must
  be to constrain realization, not to abandon multiple realizability: the realizer
  has to possess the causal powers the role demands and the mapping has to be one
  that supports the right counterfactuals, not a gerrymandered one. The residual difficulty
  is specifying whose theory fixes the role; I take this to be the Ramsey-sentence
  issue, and I don''t think it is fatal.

  >

  > (d) The disjunctive fallback fails. Pain = (C-fibre firing or silicon state S
  or ...) is only true if the disjunction is complete, and we cannot enumerate every
  possible realizer, so the identity is in principle unfinishable. Besides, disjunctive
  predicates are not observational predicates, so the claim is no longer the empirical,
  a posteriori identification the identity theorist advertised.


