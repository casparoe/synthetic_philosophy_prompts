  "History as it is actually taught and examined has a house style for causal explanation,
  and I want to know what it commits you to. In the standard exam essay — ''why did
  a general European war break out in 1914?'' — a strong answer names several distinct
  causes (alliance systems, arms races and war plans, imperial rivalry, Balkan nationalism,
  the domestic pressures on particular governments) and is marked down for naming
  one. Candidates are rewarded for breadth, and there is no requirement anywhere in
  the rubric that the student say what would have happened had any one of these been
  absent; the counterfactual is treated as decoration, if it appears at all. At the
  same time, the profession treats counterfactual history as a pariah genre: the ''what
  if'' book is reviewed as entertainment, and graduate training steers students away
  from it.


