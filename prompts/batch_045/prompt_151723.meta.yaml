  \ perpetual-motion/information engines.\" The deliverable: predict his verdict on\
  \ a newly proposed case, identify the rules (e.g., R1: any demon must be included\
  \ in the accounting and its memory must be erased — Landauer cost; R2: the demon\
  \ can't decrease total entropy; more subtle candidate rules that diverge).\n\nLet\
  \ me design candidate rules carefully. I need the earlier verdicts jointly consistent\
  \ with at least two plausible rules, and the new case where they diverge.\n\nCandidate\
  \ rules the physicist might be running:\n\n(A) \"Landauer bookkeeping\" rule: any\
  \ demon pays kT ln 2 per bit of information it acquires and must eventually erase;\
  \ the second law is saved by the erasure cost. Prediction: a scheme is impossible\
  \ iff the work extracted exceeds (information acquired) × kT ln 2 net of erasure.\n\
  \n(B) \"Correlation-as-fuel / no-free-lunch-from-measurement\" rule: the second\
  \ law is saved because measurement itself cannot create the correlations needed;\
  \ the demon merely converts pre-existing correlations (mutual information) into\
  \ work, so the maximum work is bounded by the mutual information already present\
  \ before measurement, not by the information acquired.\n\nThese two diverge in a\
  \ case! Classic: Sagawa–Ueda feedback control: W_ext ≤ kT I (mutual information\
  \ obtained by measurement) — but with a subtlety: the bound involving \"information\
