  \ the memory into a cold reservoir, or the memory is \"used up\" as a resource.\n\
  \nBetter diverging case: **the demon measures and then, instead of erasing, transfers\
  \ its memory record to a system that is then discarded into the environment at a\
  \ lower temperature** — or Landauer's bound vs the \"erasure-free\" trick where\
