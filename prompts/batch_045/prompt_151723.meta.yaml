  \ costs k T_c ln 2 < k T_h ln 2. Rule (A) would say: fine, no violation, because\
  \ you paid something (kT_c ln 2) — hmm actually both rules say no violation; the\
  \ question is whether it's \"legitimate\" / whether it counts as a demon.\n\nHmm,\
  \ we need the verdict to be a verdict about something like \"is this a violation\
  \ of the second law / does it work / is it admissible\". Let me make the verdicts\
  \ be rulings on \"does this proposed engine violate the second law, i.e., should\
