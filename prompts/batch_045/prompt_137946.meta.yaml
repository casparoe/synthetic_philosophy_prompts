  Now, the readings menu:

  1. Trivial/empirical: People recall simplified visual summaries better than tables
  of exact numbers (a psychological claim about memory; roughly platitude-ish but
  empirically contestable and about degree).

  2. Epistemic-value claim: A fact that isn''t remembered has no communicative value
  — accuracy beyond what the audience can retain is wasted. (Substantive, and questionable:
  accuracy may matter even unremembered — e.g., it''s available for others, for re-checking,
  affects trust.)

  3. Trade-off claim: For a fixed audience and purpose, some accuracy should be traded
  for memorability — a claim about an optimum, i.e., there''s a non-zero optimal level
  of simplification. (Plausible, but note it''s a claim about degree, not about "simplify
  as much as possible.")

  4. Strong: The purpose of a statistical display is to produce a lasting mental model
  in the reader, not to faithfully record data; a chart is an argument/teaching device,
  not a dataset. (Neurath-ish in spirit: museum as teaching museum, "bring dead statistics
  to life"; but Neurath also insisted pictures must be accurate in what they assert.)

  5. Radical: "Simplified" pictures and "accurate" figures are rivals such that you
  must choose — i.e., precision and communicability trade off monotonically; there''s
  no way to have both. (Probably false: footnotes, drill-down, layered charts, providing
  exact figures alongside.)

