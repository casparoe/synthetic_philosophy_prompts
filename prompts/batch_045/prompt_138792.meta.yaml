  Let''s build prompt:


  "I have been reading about T. M. Scanlon''s contractualism, the view that a moral
  principle is permissible only if no individual could reasonably reject it, where
  the strength of a rejection is supposed to be assessed by comparing how that individual
  would fare under the principle against how they would fare under alternatives. In
  the usual illustrations of the difficulty this view has with aggregation, a principle
  would impose a large harm on one person while sparing a large number of other people
  a very small harm; because each of the many has only a trivial personal complaint,
  while the single person has a severe one, the principle seems rejectable even though
  the summed trivial harms intuitively outweigh the single severe harm. I have noticed
  a variant that I cannot map onto that illustration. Suppose a principle imposes,
  on a single person, a very large number of individually trivial burdens spread across
  a lifetime—say, a minor irritation experienced every day for decades—while the alternative
  imposes on that same person one severe burden at a single time. The many trivial
  burdens seem to sum to something greater than the single severe burden, yet the
  framework''s unit of comparison appears to be each person''s complaint, and it is
  unclear whether the trivial burdens are to be aggregated into one lifetime complaint,
  treated as countless negligible complaints, or compared individually to the severe
  one. A second instance: the same structure arises when the many trivial burdens
  and the single severe burden are distributed across members of a small, tightly
  bound group whose identities are irrelevant to them, so that it feels like one collective
  complaint rather than many separate ones. Is there an established term for this
  phenomenon—the problem of aggregating trivial complaints within a single life or
  within a tightly unified group, as opposed to across many separate individuals—or,
  if not, can you coin and define one? Please identify the nearest established concepts,
  explain exactly how the phenomenon differs from each of them (including the standard
  interpersonal case and any doctrine about the separateness of persons), and state
  which fits best or why none does; I want the carving and the boundary cases, not
  just a label."


