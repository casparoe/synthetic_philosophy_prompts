  Good''s theorem (I.J. Good, 1966/1967): the expected value of information is non-negative
  for a rational agent who maximizes expected utility — actually the theorem: the
  value of a free observation is non-negative, and more precisely, the expected utility
  of a decision made after observing an experiment is at least as great as before,
  for an expected-utility maximizer. Key subtleties:


  1. The theorem assumes the agent is an expected utility maximizer with a fixed utility
  function and coherent probabilities; it says the value of *free* information is
  non-negative; if information has a cost, net value can be negative.

  2. Confusions: (a) that it says more information is always better — actually it''s
  about expected value ex ante, particular pieces can turn out to be misleading/useless;
  (b) that it requires the agent to be perfect Bayesian; (c) that it applies to agents
  with non-expected-utility preferences; (d) confusion with the value of *knowing*
  vs value of *observing* — e.g., the "value of knowledge" — the theorem is about
  decisions, not about truth for its own sake; (e) Some think Good''s theorem shows
  you should always gather information before acting — but it doesn''t account for
  the cost of delay or computation, and there''s a known result that for agents with
  limited computation or non-EU preferences, information can have negative value (e.g.,
  "the value of information can be negative" for bounded agents).

  3. Also there''s a subtlety: Good''s theorem says value of information is non-negative
  *in expectation before you see the result*, but conditional on a particular realization,
  you might be worse off than if you hadn''t looked (you could have been better off
  not knowing — no: actually ex post, with a fixed policy, having more information
  can''t make you worse off if you act optimally? Hmm. Ex post it can: learning the
  result can lead you to take an action that turns out worse than what you''d have
  done without the info. Yes — ex post regret is possible. Also there''s the point
  about the "expected value of *sample* information" being positive while the "expected
  value of *perfect* information" etc.)

  4. Another famous subtlety: Good''s theorem relies on the agent''s *own* probabilities
  (it''s not that information is objectively valuable — if your probabilities are
  miscalibrated, an information source you wrongly trust can reduce expected value
  under the true distribution).

  5. Also: the theorem requires that the act of observation doesn''t itself change
  the world/utility (no measurement effect on outcomes — e.g., a test that has side
  effects, or measurement that alters the system).

  6. Another subtlety: Good''s theorem in its 1967 form: "the value of a free observation
  is non-negative" — more precisely, the expected utility of the best decision rule
  using the observation is ≥ the expected utility of the best action without it. Also
  there''s the refinement with "the value of information is non-negative and the value
  of a *more* informative experiment (in the Blackwell sense) is at least as great."

  7. Also there''s a known issue: for a *risk-averse* EU maximizer it still holds
  (utility is defined over outcomes; risk aversion is in the utility function). It
  fails for agents who violate EU, e.g., ambiguity-averse (maxmin) agents — information
  can reduce value for them (there''s literature: "the value of information for a
  maxmin agent" — e.g., information can be harmful for ambiguity-averse decision makers).
  Also for agents with preference for suspense/spoiler-averse preferences, or agents
  with non-instrumental curiosity — no, that helps.


