  "I''m a high school senior, and I got into an argument about the old ship puzzle
  — the one where a ship''s planks are replaced one by one — after helping a friend''s
  uncle rebuild a truck. What struck me afterwards is that we don''t only argue about
  this as a puzzle; we settle it every day by rule, and I''d like to know what the
  rules assume.


  As far as I can make out, in my state a car''s legal identity is carried by its
  VIN and its title. You can replace an engine, a transmission, body panels, the interior,
  and it stays the same car. If it''s wrecked badly enough that an insurer pays out
  instead of paying for repairs, the title is marked salvage, and if it''s rebuilt
  and inspected the mark is changed to rebuilt — but the VIN, and so the car, is unchanged.
  Yet a running car assembled out of the parts of two wrecked cars is, as I understand
  it, treated as a new vehicle and given a fresh VIN, rather than as one of the two
  originals or as two cars sharing a body.


  Two things puzzle me about this. First, the insurer''s decision that a car is a
  total loss looks like an official declaration that this car is gone, and yet the
  same paperwork keeps treating it as the same car afterwards. Second, the whole system
  seems to hang on a stamped plate: if you swapped the VIN plates between two otherwise
  identical cars overnight, the law''s answer about which car is which would swap
  with them, as far as I can tell.


  So: what view of identity over time does this pattern of rules actually presuppose,
  and which rival views does it quietly rule out? I''d like you to separate what it
  strictly presupposes from what it merely fits nicely, and to say where it is underdetermined
  — where several different theories of identity would all license exactly these rules,
