  I''ve been going around in circles with the old rationalist-blog discussions of
  van Fraassen''s Reflection principle — the constraint that your credence in A now,
  conditional on your later self having credence x in A, should itself be x — and
  I''ve convinced myself it can''t be a genuine requirement of rationality. I''d like
  to know where the argument goes wrong.


  Start with the case that convinced me. I''m deciding whether to fund a two-year
  trial of some intervention. I trust the trial''s design completely: whatever final
  credence n it leaves me with, I''ll update to n. Reflection then seems to say my
  credence today should already equal my expectation of n, which means I should skip
  the trial and just write that number down. Worse: I expect the trial, if it does
  anything, to move me toward the truth, and Reflection seems to forbid me from expecting
  any such directional movement. Since I plainly should run the trial and plainly
  should expect it to improve my accuracy, I conclude Reflection is false — or at
  best derived from conditionalization and so unable to tell me anything I didn''t
  already accept.


  Where does that break down? Two specific things: does Reflection really entail that
  I can''t expect my credence to move in a direction I can name, and does it really
  make the trial worthless? Please also flag whether the principle''s normative status
  here is settled among people who work on it or contested — and don''t present a
