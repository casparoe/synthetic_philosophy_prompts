  Argument (Harsanyi aggregation theorem proves too much):

  1. If a social ranking and each individual''s ranking all satisfy the von Neumann–Morgenstern
  axioms, and society is indifferent between two lotteries whenever every individual
  is, then social utility is a weighted sum of individual (vNM) utilities. (Harsanyi''s
  aggregation theorem.)

  2. The vNM axioms are simply the requirements of instrumental rationality applied
  to choice under uncertainty; the Pareto/indifference condition is a minimal unanimity
  requirement.

  3. So anyone who accepts expected-utility theory as a theory of individual rationality
  and accepts bare unanimity is committed to ranking social options by a weighted
  sum of individual utilities — i.e., to utilitarianism, and to treating interpersonal
  comparisons of utility as meaningful.

  4. But the theorem''s conditions don''t require that the individuals be actual,
  present, or even human: replace the set of individuals with (a) the set of all time-slices
  of a single person across their life, or (b) the set of all sentient beings including
  animals, or (c) the set of all possible people who might exist.

  5. Under (c), the sum is over possible people, so any population policy is to be
  assessed by total utility across all possible persons — and, since each possible
  person''s utility must be normalized somehow, the ranking depends on arbitrary choices
  about how to scale utilities of people who never exist (e.g., 0 for non-existence),
  which yields the repugnant conclusion / mere addition paralysis.

  6. Under (a), intrapersonal aggregation: a single person''s rational choice over
  time must be a weighted sum of her time-slice utilities, which means there is no
  such thing as prudence beyond a weighted sum — i.e., it vindicates Parfit''s reductionism
  about personal identity and makes "self-sacrifice now for a greater later benefit"
