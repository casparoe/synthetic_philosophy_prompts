  not in the codon table alone; the tRNA synthetases are part of the mechanism. So
  a theory must say whether the code is a property of the mapping or of the mechanism
  of interpretation.

  4. Must handle alternative codes (mitochondrial variants) and recoded synthetic
  genomes — i.e., whether the code is contingent/variable, and whether a "wrong" code
  is possible (misreading vs. recoding).

  5. Must handle multiple overlapping codes on the same string: reading frames, overlapping
  genes, splicing signals within exons, codon usage/translational speed "codes" (the
  "ribosome code"?), the "histone code" — i.e., the same physical structure can carry
  several distinct messages depending on which reader.

