  ---


  I am a PhD student writing a dissertation chapter on the structure of deontological
  constraints, and my working group has split into two camps that have now spent a
  term arguing past each other about the paradox of deontology — the puzzle that a
  view which treats certain acts (killing an innocent person, say) as things an agent
  must not do, and treats their occurrence as morally grave, nevertheless appears
  to leave each agent free to refrain from preventing many such acts by performing
  one herself, and to leave every agent in a chain free in the same way, so that the
  total number of violations is far higher than it had to be. Please draft the joint
  statement these two camps could sign after a genuine adversarial collaboration.


  Camp A — the agent-relative deontologist. Constraints and options are irreducibly
  agent-relative; the permission not to minimize violations is not a bug to be explained
  away but the predictable expression of the separateness of persons...


  Camp B — the collectivist (or "minimizing") deontologist. Constraints are real and
  are not consequentialist, but the prohibition must be understood as attaching in
  the first instance to the group of agents who could jointly prevent the outcome;
  a moral theory that licenses every member of that group to refrain from minimizing,
  while treating violations as grave, has lost its grip on the very thing that made
  constraints plausible...


