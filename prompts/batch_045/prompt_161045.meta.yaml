  ---


  I spent most of last evening arguing with a friend — a molecular biologist with
  a taste for philosophy — about whether the vocabulary of cranes and skyhooks, and
  the companion charge of greedy reductionism, does any real work. Her position, pressed
  repeatedly and with some force: the distinction is drawn retrospectively. Whatever
  mechanism we eventually find for some apparently top-down phenomenon will automatically
  be labelled a crane, and if we never find one, the phenomenon will be said to have
  been a skyhook all along. On that reading, "there are no skyhooks" is not a substantive
  claim about the world but a rule for how to describe whatever we find, and "greedy
  reductionism" is simply the name we give to reductions we antecedently dislike.
  I conceded more than I wanted to, and I would like to spend a fellowship term working
  out whether the concession was necessary.


  Here is the half-formed idea I came away with. What makes a crane a crane, I want
  to say, is not that it is a mechanism — the skyhook-poser also offers a mechanism
  of sorts — but that its lifting capacity is traceable. A crane should be able to
  lift only what its own parts, organized as they are, could lift; and the crane itself
  must have a provenance that can be told without skyhooks. If that is right, then
  there are three distinguishable ways a proposed reduction can be greedy, and I suspect
  the debate has been treating them as one:


  (i) Level-skipping: the mechanism is described at a level that jumps over the intervening
  machinery, so that the middle of the ladder is missing.

  (ii) Capacity shortfall: the mechanism is real and well described, but what it demonstrably
  lifts is lighter than the phenomenon to be explained — the crane is undersized,
  and the extra weight is silently carried by something else.

  (iii) Borrowed lift: the crane is specified using the very vocabulary that was supposed
  to be explained away, so the reducing story reimports what it was meant to reduce.


