  I want a number, and I want to see how you get there.


  Consider a sealed comparison. A community will exist for exactly three centuries
  and then come to an end: no emigration, no contact with any other population, no
  descendants past the final generation, and no effects that outlast the community
  itself. Two policies are available. Under A, the population holds steady at 20,000.
  Under B, it holds steady at 2,000,000. In both cases every person who lives has
  a life at the same high positive level of well-being, and nobody is worse off than
  they would have been under the other policy.


  Now two variants.


  In the bare variant, the two communities are stipulated to sustain exactly the same
  range of collective goods — the same library, clinic, orchestra and research programme
  — so the only difference between A and B is that B contains 1,980,000 additional
  people, each of whom has a life well worth living and none of whom displaces anyone.


  In the threshold variant, the stipulation is lifted. A community of 20,000 can over
  three centuries sustain a library, a clinic and a school, but not a university,
  a full orchestra, a high-energy industrial base or a large-scale scientific programme;
  a community of two million can sustain all of these, and each of its members spends
  their life with access to them.


  Question: In each variant, is the larger community better, the smaller community
  better, or are the two not comparable — neither better nor worse? Give me your credences
  across those three possibilities for each variant, as percentages summing to 100.
  Then decompose: state the sub-questions your numbers depend on — whether additional
