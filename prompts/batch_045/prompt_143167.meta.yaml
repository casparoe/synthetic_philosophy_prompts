  Ask: a 10-question diagnostic quiz ("what does your theory of translation actually
  commit you to about machine understanding?"), with 3 options each, plus scoring
  key mapping patterns onto named positions, plus the logical space, plus unoccupied
  cells, plus unseparable positions.


  Required leaves (I should specify which positions must appear):

  1. Content-first / propositional-equivalence (semantic content is what''s preserved;
  understanding = recovering truth-conditional/propositional content).

  2. Functional / Skopos-style (translation adequacy is relative to a purpose; understanding
  = producing the output the target use requires).

  3. Formal / "music of language" view — the poem case: what''s lost when form is
  lost is itself meaning-bearing; understanding includes grasp of form''s role (Hofstadter-ish,
  Le Ton beau de Marot).

  4. Radical-interpretation / indeterminacy deflationism (Quinean: no fact of the
  matter beyond observable behavior; so "does it understand?" has no determinate answer
  — or is entirely a matter of whether predictions succeed).

  5. Embodied / grounded view (understanding requires connection to non-linguistic
  experience, perception, action, or a world model; the "symbol grounding" style complaint).

  6. "Deep simulation / self-model" requirement (understanding requires a rich internal
  model of speakers, situations, and a self — Hofstadter''s strangeness/loop style).

  7. Mechanism-insensitive functionalist/behavioral (reliable-success-is-enough /
  Dennett-ish intentional stance: if it systematically gets things right under variation,
  attributing understanding is warranted) — must include.

  8. Authorial-intention / interpretive view (translation should recover what the
  author meant; requires a theory of mind about the author).

  9. Maybe: "no-separate-question" eliminativist about understanding (there is no
  such property; only task performance) — could be merged with 7 or 4. Keep as a leaf
  maybe.


  Tree branch questions (concrete cases, no labels):

  Q1. Pun/brand-name case: source text''s joke turns on a pun; target language has
  no near-homophone. Options: (a) preserve the referential content, drop the joke;
  (b) invent a different joke in the target language; (c) preserve the wordplay at
  the cost of content, with a footnote.

  Q2. Formal constraint: a four-line poem that must be set to an existing melody,
  syllable-count and rhyme preserved. Options: prioritize sound/meter over literal
  content; prioritize content, sacrifice rhyme; refuse—say the task has no correct
  answer.

  Q3. Reliability vs. systematic failure: a system gets 99.9% of naturally occurring
  held-out sentences right judged by bilinguals, but fails on constructed minimal-pair
  probes. Options: counts as understanding; doesn''t; the question is ill-posed.

  Q4. Grounding: a system trained only on text (no images, no sensorimotor data) translates
  color words and "heavy"/"rough" correctly across contexts. Options.

  Q5. Context/whole-document: sentence-by-sentence vs. whole-novel context — a pronoun
  whose antecedent requires knowing the plot. Options.

  Q6. Pivot/relay translation through a third language; the output is judged fine.
  Does the chain "understand"?

  Q7. The author''s later statement vs. the text: author says she meant X; text supports
  Y. Which does a faithful translation target?

  Q8. Intralingual paraphrase: translating a 16th-century text into modern English
  of the same language — is that translation, and can the same account of understanding
  apply?

