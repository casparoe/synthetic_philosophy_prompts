  Good in-the-weeds Fermi content:

  - The paradox isn''t "no evidence" but that the *distribution* of evidence is bimodal:
  we have zero. And "zero" is unstable: any detection ends it. The "silence is loud"
  idea — for a galaxy that could be colonized in a few million years (a blink relative
  to the age of the galaxy), the *absence* of any signature is extremely informative;
  so silence is not "absence of data" but a strong constraint. That''s the classic
  Hart/Tipler line.

  - The "uniformity requirement": a solution only works if it applies to (nearly)
  all civilizations, everywhere, across billions of years — one exception (a single
  expansionist civilization) would break it. So solutions must be near-universal and
  durable: this is the argument for "the filter is early" or "no technological expansionists
  ever arise".

  - The "Grabby Aliens" model (Hanson, Martin, McCarter, Paulson 2021): if loud civilizations
  expand at a noticeable fraction of light speed and are visible, then the fact that
  we appear early (our date) and don''t see them constrains their parameters; also
  it implies we''d be "early" arrivals and should expect to become grabby ourselves.
  Also the "hard steps" model for our arrival date (Carter''s anthropic argument,
  Hanson''s hard-steps model) — the "we are early" explanation: our arrival looks
  early because the hard steps (abiogenesis, etc.) take ~ billions of years and the
  biosphere''s habitable window is limited.

  - The "we''re early" resolution: if life''s hard steps take ~ a few billion years
  and stars live ~10 Gyr, then a civilization''s expected arrival time is near the
  middle/end of the habitable window — meaning observers typically find themselves
  *early* rather than late, before the sky fills. That combines nicely with the "why
  no one is here yet" — they exist, but they haven''t arrived yet; and the reason
  we''re alone now is that we''re before the wave.

  - Also: the distinction between "they don''t exist" (rare Earth / great filter)
  and "they exist but we''d never notice" (detectability: we''ve only been able to
  detect for decades; e.g., a galaxy-wide probe network might be invisible, or "quiet"
  civilizations with low power, or the "aestivation hypothesis" (Sandberg, Armstrong,
  Cirkovic) — wait for a colder universe for computing).


