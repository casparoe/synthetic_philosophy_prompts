  So the defeat is not a licence to demythologize; it is, in her phrase, ''a scalpel,
  not a solvent''. She supports this mostly from his handling of the Joshua miracle
  and the sundial story: he doesn''t treat the passages as merely phenomenal language,
  he argues that on the Copernican arrangement the lengthening of the day requires
