  Core mechanism idea: "The Qualia Auction" / "The Private Property Game". Participants
  each receive an envelope with a stimulus (a card with a color swatch, or a taste,
  or a tactile object). They are told: your job is to record the intrinsic character
  of your experience, not the stimulus, not your behavioral dispositions. Then we
  do successive rounds in which the facilitator adds constraints, each designed to
  strip away a property that qualia are supposed to have — drawing on Dennett''s list:
  ineffable, intrinsic, private, directly/apprehensible in consciousness. Each round,
  participants find their reports converge on something that''s just... judgment/discrimination,
  or they find nothing to say.


  Concretely:


  Round 1: Write a description of your experience such that someone who has never
  had it could not recognize it — but make it contentful. They''ll find themselves
  using comparisons to public objects ("it''s like the smell of X") — which Dennett
  says makes it relational, not intrinsic.


  Round 2: "Swap test" — you are told you may have been secretly swapped with a partner''s
  stimulus; report whether your experience changed, using only introspection. (Dennett''s
  "philosophers'' syndrome" — the subject can''t tell; also "dancing qualia".) Predictably,
  some will say "yes, obviously it changed" and some "no" — but the group can''t adjudicate;
  the point: the posit was supposed to be the thing you can''t be wrong about, but
  the disagreement is unresolvable, so it does no work.


  Round 3: Inverted spectrum staged: half the group gets a "spectrum inverting" instruction
  — from now on, the label you use for color X you should use for its complement.
  They must pass a "normal" test: the group has to detect, from their verbal reports
  and sorting behavior, who was inverted. If nobody can detect it, then either qualia
  do nothing (epiphenomenal, so why posit them) or the notion is empty. This mirrors
  the "inverted qualia are undetectable in principle" claim → the "why should we believe
  in them" pressure.


  Round 4: The "quale as intrinsic property" round: ask them to hold fixed everything
  relational/dispositional and say what remains. Usually silence or a gesture ("you
  know, *that*"). Then facilitator: you''ve just performed the last move available
  to the qualophile — and that move is what the eliminativist says is no move at all.


