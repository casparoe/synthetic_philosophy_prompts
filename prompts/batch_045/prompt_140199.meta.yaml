  I think a good structure:


  Setting: second-year philosophy of mind seminar, 16 students, 80 minutes, room with
  a projector. Materials: envelopes with colored cards, small opaque cups with two
  different juices/jelly beans (e.g., two similar flavors), index cards, a "quale
  ledger".


  Game: "The Intrinsic Properties Exchange" (prediction market on private facts).


  Round 0 (no framing yet): Everyone gets a stimulus privately (a jellybean of flavor
  A or B). They write down, on a card, a description of the experience that mentions
  no public object, no comparisons, no causal role. Collect cards. Read them aloud.
  The group votes: which cards describe the same experience as which? Then reveal
  the actual stimuli. Show: the mapping of "descriptions" onto stimuli is achieved
  entirely via public anchors; when public anchors are banned, descriptions carry
  no information — the vote is at chance.


  Round 1 — "The Swap": secretly, a "swap" happens (some students are given a second
  stimulus). Ask each: did your experience change? They must answer yes/no. Then:
  the group must decide, from the reports, who was swapped. Point: reports of "change"
  are either (a) reliable, in which case experience is tied to discriminable structure
  — but then it''s just a judgment/disposition and no special property is needed,
  or (b) unreliable — but then the claim to authority is gone. (Chase & Sanborn angle:
  maybe they say experience concepts are vague, so yes/no answers to "did it change"
  can be indeterminate; include a role that forces borderline-ness.)


  Round 2 — "The market": participants trade "qualia futures": contracts that pay
  off on whether a given claim about experiences is true, e.g., "Alex''s experience
  of A right now is phenomenally the same as their experience of A ten minutes ago,"
  "Bea and Carlos have the same experience of B." Crucially, the facilitator announces
  the settlement rule: contracts are settled by whatever the subjects say. Then run
  a round in which subjects'' sayings are manipulated (e.g., a rule that half the
  subjects have their reports "translated" through an inversion without their knowledge).
  Traders discover that the market price is entirely a function of expectations about
  reports, and the "underlying fact" never enters — the posit floats free.


