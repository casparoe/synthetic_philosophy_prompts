  Let me think about the important conceptual structure for Fitch:


  1. Motivating idea: anti-realism / verificationism — truth is (in some sense) tied
  to our capacity to know: every truth is knowable (KP: ∀p(p → ◇Kp)).

  2. The derivation: take a truth p that is not known (¬∃ actually known). Consider
  the truth (p & ¬Kp) — assuming there is some unknown truth. By KP, ◇K(p & ¬Kp).
