  so K(p&¬Kp) → Kp & K(¬Kp) → Kp & ¬Kp (since knowledge is factive), contradiction.
  So ¬◇K(p & ¬Kp), so by KP, ¬(p & ¬Kp) for any p, hence p → Kp: every truth is known.
  So KP collapses into omniscience.

