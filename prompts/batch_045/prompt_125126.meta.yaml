  and factivity, and also the modal step: from K(p&¬Kp) being impossible, and KP giving
  ◇K(p&¬Kp) for the particular unknown truth. Note the paradox doesn''t require us
  to know which truth is unknown — hence "there are unknown truths" is enough with
  classical logic (the non-constructivity: from ¬∀p(p→Kp) get ∃p(p & ¬Kp)).

