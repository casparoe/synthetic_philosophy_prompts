  Question (as set on the problem set):

  "Epiphenomenalism about phenomenal consciousness holds that phenomenal states have
  no causal effects. But we make judgments about our own phenomenal states, and these
  judgments are remarkably fine-grained and reliable. Explain the ''paradox of phenomenal
  judgment.'' Then assess the following reply: ''There is no paradox. The phenomenal
  state and the judgment about it have a common neural cause; the judgment is caused
  by the neural state, not by the experience, so the experience need not be causal.
  And because the judgment counterfactually tracks the experience, its reliability
  is secured.'' Does this reply succeed? If not, what residual problem remains?"


