  Draft:


  "Epiphenomenalism is the view, associated with Huxley''s image of consciousness
  as the steam whistle on a locomotive — a byproduct that does none of the work —
  that phenomenal properties are causally inert. Chalmers raises the paradox of phenomenal
  judgment against this view. The paradox is basically the same point as Jackson''s
  knowledge argument: if experience did nothing, we could not have any knowledge of
  it. More exactly, the claim is that epiphenomenalism is self-refuting: the epiphenomenalist
  cannot even formulate the view, because formulating it requires having concepts
  of phenomenal states, and those concepts could only have been acquired through the
  causal influence of phenomenal states on the subject''s belief-forming mechanisms.
  So epiphenomenalism entails that no one could ever have stated it, which contradicts
  the fact that it has been stated. Hence epiphenomenalism is false.


  Against this, the common-cause reply. [The reply given in the question] ... I think
  the reply succeeds. Neural state N causes experience E and, independently, causes
  judgment J with the content ''I am now in pain.'' The correlation between E and
  J is explained by the common cause, so no causal work needs to be done by E. Moreover,
  given that E supervenes on N with nomological necessity, if E had been different,
  J would have been different too: the judgment counterfactually depends on the experience.
  That is all that reliability requires — a judgment is reliable just in case it would
  covary with the facts it is about. Since we have counterfactual dependence without
  causal influence, the epiphenomenalist can keep both the inertness of experience
  and the reliability of introspection, and the paradox dissolves.


  One might worry that the epiphenomenalist still has no account of how the *content*
  of J manages to be about E rather than about N. But this worry is misplaced: content
  is determined by the judgment''s causal-functional role in the subject''s cognitive
  system, and J''s role is fixed entirely by N and the subject''s physical history.
  Nothing more is needed for J to be about pain. So the paradox really is just a version
  of the causal exclusion problem in disguise — the appearance of a difficulty comes
  from tacitly assuming that only causes can explain, and once we drop that assumption,
