  within the system. Adding the Gödel sentence as an axiom gives a new system with
  its own Gödel sentence. Also: it applies to effectively axiomatized systems — requires
  the axioms be computably enumerable, so you can check proofs. Also: "sufficiently
  strong" — Robinson arithmetic/Q or PA strength; systems weaker (Presburger arithmetic,
  Euclidean geometry (Tarski)) are complete and decidable. And consistency assumption;
  if inconsistent, everything is provable.


