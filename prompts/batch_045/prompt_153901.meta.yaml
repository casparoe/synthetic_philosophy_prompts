  Background in case it helps: the setup I''ve been working with is that instead of
  maximising expected utility — the arithmetic mean of utility across worlds/agents
  — you maximise the geometric mean of utility, i.e. expected log utility, which is
  what gives you the Kelly criterion for bet sizing, and which is supposed to be the
  rule you want when the thing doing the choosing is a merger of agents or a single
  agent across time rather than a one-shot chooser.


  Things I''d like you to take seriously:

  - Howard''s bets are parlays (he wins a six-way on Garnett''s stat line, then a
  three-way at the end) and they''re lumpy and indivisible — he''s betting a pawned
  championship ring, then a lump of Garnett''s cash sent off with Julia in a helicopter.
  Kelly assumes you can scale your stake continuously and rebalance. Does the film
  show a man who couldn''t implement fractional Kelly even if he wanted to, and does
  that change what we should say about him?

  - Most of what he risks isn''t really his: the ring is Garnett''s collateral, the
  first bet is placed with money he owes Arno (who then puts a stop on it). My suspicion
  is that Kelly''s conservatism is a downstream consequence of losses shrinking your
  own future stake, and that the film is quietly about how the surrounding institutions
