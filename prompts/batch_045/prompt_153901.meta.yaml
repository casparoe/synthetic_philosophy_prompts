  Actually this is the key in-the-weeds point: when you''re already at ruin — when
  your downside is saturated (you''re dead/indebted regardless) — Kelly''s ruin-aversion
  gives you nothing; maximizing log growth is meaningless when the floor is already
  hit, and the correct move can be to take enormous variance. That''s a genuine philosophical
  point about Kelly/geometric rationality: it''s a criterion for someone with something
  to lose who expects to keep playing; it silently assumes you''re not already at/near
  ruin and that more money keeps converting to more utility at log rate. Also: for
  a "target" (debt threshold) utility is step-like and log-utility fails.


  Also: Howard is a "gambling addict" — the film resists the decision-theoretic reading:
  he''s not choosing a strategy, he''s compelled; the film''s form (relentless, no
  moments of reflective choice, overlapping noise) undermines the picture of an agent
  who could pick a betting fraction. And the ending: he wins and is killed — the money
  accrues to Julia, not to him; the payoff structure is severed from the person who
  took the risk. That''s a beautiful point for geometric rationality: the film dramatizes
  a decoupled "growth" — the bankroll compounds, the agent doesn''t. Good for "what
  the work adds that argument alone doesn''t": the separation between the compounding
  quantity and the person/self who is supposed to be the beneficiary; also the way
  geometric rationality presupposes the agent''s identity/continuity across the compounding
  (the "merger over time" — the log-optimal strategy is optimal for the "self" that
  persists; Howard''s life is fragmented between wife/mistress/store/bet, and in the
  end he isn''t there to collect).


  Also good: "money he doesn''t own" — betting with Garnett''s pawned ring and with
  money owed to Arno: these are "other people''s capital", which breaks the Kelly
  discipline (limited liability / moral hazard: if it loses, Garnett/Arno eat it).
  This is a genuinely good in-the-weeds point: Kelly''s conservatism comes from the
  fact that losses shrink your own future stake; when losses fall on others (or when
  you''re betting with money you''ve already effectively lost), the log penalty doesn''t
  bind. And the film makes the point that the *institutional* structure (bookies,
  pawnshops, loan sharks, collateral) manufactures these asymmetries — so a purely
  individual-level decision theory misses it. That''s a nice "what the film adds".


