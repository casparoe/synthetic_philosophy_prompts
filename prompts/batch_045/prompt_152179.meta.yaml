  Nāgārjuna in Buddhist texts). Also "all four fail" — that''s actually closer to
  right; the error is framing it as "reality is messier" and "there are four possibilities"
  as if it were a logic of four truth values.

  2. "Empty means nothing has an existence of its own" + "a university is nothing
  but its parts, so it doesn''t really exist" — this is the mereological reduction
  / Abhidharma-style analysis; Nāgārjuna''s target is svabhāva even in the parts;
  and conventional existence isn''t denied. Also "doesn''t really exist in its own
  right" is ambiguous between "lacks intrinsic nature" (right) and "is unreal" (wrong).

