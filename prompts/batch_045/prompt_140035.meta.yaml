  \ \"self-fulfilling belief\" exception.\n\nI like the nonidentity problem too. Let\
  \ me think which lends itself most to \"jointly consistent with more than one plausible\
  \ rule\" and \"divergence on the new case.\"\n\nNonidentity: cases where an act\
  \ causes a person to exist who has a life worth living but worse than an alternative\
  \ person's would have been; or causes the same person to exist with a worse life\
  \ (same-person vs different-person cases). Candidate rules:\n- A: \"No one is wronged\
  \ if the act is necessary for their existence and their life is worth living\" (Parfit's\
  \ no-difference... actually the standard: no-person harmed → no wrong done).\n-\
  \ B: \"wrongful if it makes someone worse off than they would have been\" — but\
  \ in nonidentity, no one is worse off.\n- C: Wrongness depends on impersonal total/average\
  \ welfare comparison, regardless of identity.\n- D: Wrongness depends on whether\
  \ the act violates a rights-based constraint (reproduction rights, procreative liberty)\
  \ — the \"no-right-to-a-specific-genetic-identity\" or \"right to an open future\"\
  .\n- E: A \"threshold\" view: wrong if the resulting life falls below some decent-minimum\
