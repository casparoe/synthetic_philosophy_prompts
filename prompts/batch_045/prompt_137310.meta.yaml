  I''m in a graduate reading group on the philosophy of AI — we worked through the
  intentional-stance material a few weeks ago and have since been arguing about whether
  large language models believe anything — and one of the members brought in an argument
  that I think has to go wrong somewhere, but I can''t locate the break. It runs like
  this.


  (1) Instrumentalism: for a system S to believe that p is nothing over and above
  this — that treating S as a rational agent which believes p and wants such-and-such
  forms part of the best available strategy for predicting and explaining what S does.
  There is no further fact of the matter about S''s beliefs beyond what the intentional
  stance, applied to S, delivers.

  (2) Whether a predictive strategy is "the best available" is not a property of S
  alone. It depends on what other strategies are available to the predictor: the stance
  pays off for S only if it yields predictions the predictor could not get as accurately
  or as cheaply in some other way — from the design stance or the physical stance.
  That is why we don''t say a thermostat or a vending machine has beliefs even though
  the stance technically applies: for those systems it buys us nothing we didn''t
  already have.

  (3) Now suppose interpretability research completes its program for some present-day
  language model M: we end up with a full mechanistic account, so that M''s next output
  can be computed from its weights and activations more reliably and more cheaply
  than by reasoning about what M believes and wants. (Call M, so understood, "glass-boxed".)
  Nothing about M''s behavior or its internal machinery changes when this account
  arrives; only our epistemic situation does.

  (4) By (1) and (2), once M is glass-boxed, M no longer has any beliefs — the intentional
  stance is no longer part of the best available strategy for it. Worse: M loses its
  beliefs at the moment the mechanistic account is published and retains them only
  for predictors who haven''t read it; and a physically identical copy of M, running
  where no one has done the interpretive work, keeps its beliefs while the glass-boxed
  one has none. Call this "belief evaporation by interpretability."

  (5) Belief cannot be that kind of property. It cannot come and go with the publication
  schedule of interpretability papers, or differ between two intrinsically identical
  systems because one of them happens to have been mechanistically explained. Whatever
  beliefs are, they don''t depend on the explanatory uptake of a third party in that
  way.

  (6) Therefore (1) is false: there is more to having a belief than being usefully
  predictable from the intentional stance — believing must be settled by something
  intrinsic (the causal/functional organization of the system, or what its internal
  states actually track), and the intentional stance is at best evidence of it.


  Then: my problem is that I accept (6)''s spirit but the argument seems to prove
