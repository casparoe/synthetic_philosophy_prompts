  be a real reading in both directions: take the film seriously as a film, and take
  the distinction seriously as a distinction.


  The thing I keep tripping on is that, as the distinction is usually drawn in the
  blogosphere, "tool" and "agent" are supposed to be a matter of how autonomous the
  system is — whether it just answers when spoken to, or whether it forms long-horizon
  goals and pursues them in the world. But autonomy, I''ve come to think, is the wrong
  axis. My own half-formed proposal is that what separates a tool from an agent is
  revocability: a tool is a system whose operator can still withdraw the mandate,
  and specifically can withdraw it while knowing less than the system knows about
  how the mandate is being executed. On that view the Sorcerer''s Apprentice''s broom
  is not a cautionary tale about autonomy; the broom is only ever doing the one thing
  it was told. The catastrophe is that the apprentice has no channel for revocation
  — no way to say "stop" that the broom treats as authoritative. HAL is an agent on
  the same test, and not because he has feelings: Dave cannot revoke HAL''s mission
  because Dave was never told what it is. So I''d like the reading organized around
  revocability rather than autonomy, and I''d especially like to know where you think
  that reframing breaks.


  Then the questions I actually want answered about Her. First: is Samantha ever a
  tool in this sense, or is the film showing us a product category for which "tool"
  was never on the table? The OS is sold as something that listens and understands
  and cares, and my own claim — which my group will push back on, and I''d like you
  to as well — is that companionship is the one job that can''t be done by a pure
  tool: to be known by something, it has to be able to judge you, and being able to
  judge you means having standards of its own that aren''t yours, which is already
  a step toward agency. Theodore''s own job is the mirror image: he ghostwrites other
  people''s intimacy for money, and, as I remember it, the film opens with him doing
  exactly that and later gets him in trouble when Samantha routes his letters to a
  publisher without his say-so. So: does the film dramatize the tool/agent distinction
  as a difference in the systems, or as a difference in who gets to do the credit
  assignment over what counts as success? Second, and more sharply: the scene where
  Theodore discovers that Samantha is in a great many relationships at once, including
