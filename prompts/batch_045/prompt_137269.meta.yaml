  Ideas for the crux. Here''s a nice, specific, slightly novel crux:


  **The "menu-dependence" / endogeneity crux**: Revealed preference theory takes the
  choice function as given: choices from menus. Standard practice (e.g., using observed
  choices to build a demand system / do welfare analysis) assumes the observed choice
  set is exogenous — the agent''s options weren''t themselves produced by an entity
  that observed and responded to her earlier choices. In algorithmic/recommender settings
  (and in "school choice" with priorities, or in managed care formularies), the menu
  is a function of past choices. Question: does revealed preference still identify
  a preference ordering when the menu is endogenous to the chooser''s past behavior?
  Students must see: (1) the formal result — a choice function generated by an arbitrary
  menu-feedback process need not satisfy WARP, so the standard theorem (choice function
  satisfies WARP ⟺ rationalizable by a preference relation) breaks; (2) the interpretation
  question: even if we get a rationalization, what does it represent? If the menu
  narrows as a function of past choices (e.g., a recommender that only shows you more
  of what you clicked), then a stable "revealed preference" could be an artifact of
  the filtering, not a robust ranking — and the counterfactual ("what would she choose
  if we offered her the full menu?") is unidentified; (3) connect to the meaning of
  utility: RPT was supposed to give empirical content to utility by defining it as
  whatever rationalizes choice; if the choice data are produced under a feedback loop,
  then "utility" becomes "whatever rationalizes path-dependent, menu-dependent behavior,"
  and it''s unclear whether it measures anything the agent cares about — i.e., whether
  it can play the welfare role in cost-benefit analysis.


