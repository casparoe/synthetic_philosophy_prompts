  popular book / long blog post — say, the "Against the Corruption Industrial Complex"
  sort of essay — summarizing the "particularist" or "anti-universalist" position
  on corruption. The summary has mostly-right content plus subtle misrepresentations:


  1. Conflating the descriptive claim ("the gift/bribe boundary is drawn differently
  across societies") with the normative claim ("so calling it corruption is just Western
  imperialism") — the actual literature often keeps the descriptive and the evaluative
  apart, and many relativists are only making an "internal standard" point.

  2. Claiming that the standard definition of corruption (abuse of public office for
  private gain) is "circular" or "self-serving because it was written by Western institutions"
  — overstating a modest point about the definition''s provenance; also misstating
  Nye: the summary might say "private-regarding gain" but drop "deviates from the
  formal duties of a public role," i.e., dropping the norm that''s being violated
  — which turns corruption into "any private benefit from public action," which would
  make, e.g., a salary... hmm, actually a good subtle error: dropping the "formal
  duties" clause makes it impossible to distinguish corruption from mere self-interest,
  and makes it collapse into "any action with mixed motives."

  3. Presenting a standard objection (e.g., "the universal definitions are themselves
  parochial / the World Bank index is basically a measure of Western perceptions")
  as a refutation of universalism — i.e., a genetic/measurement objection treated
  as a knockdown.

  4. Using "clientelism" in its everyday sense as just "favouritism for friends,"
  when in the literature clientelism is a specific *structured* exchange relation
  (asymmetric, iterated, contingent, particularistic: votes/support for material goods/favours)
  — and there''s an important distinction between clientelism and "pork-barrel"/programmatic
  distribution. Also, clientelism involves a *relationship* with ongoing obligations,
  not a one-off spot transaction — so a "vote-buying" one-shot isn''t clientelism
  proper. Also there is an interesting point: clientelist exchange can be *welfare-improving*
  for the poor in the absence of a welfare state, so the "clientelism is always exploitative"
  claim is contested.

