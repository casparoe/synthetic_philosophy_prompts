  Let me make the summary''s claims precise:


  Claim A: "''Corruption'' in the modern sense is basically a 1990s Western institutional
  invention — before that the word just meant decay or rottenness of meat, so there''s
  no deep concept here to be faithful to." (Subtle: the political sense — decay of
  a constitution/republic, ruler ruling for private advantage — is old; Aristotle''s
  deviant constitutions; early modern English ''corruption'' of Parliament. So the
  "no deep concept" bit overstates; also etymologically ''corruption'' = breaking/destroying
  together, not just rotting meat.)


  Claim B: "The standard definition — abuse of public office for private gain — is
  either vacuous or circular: any official who enjoys her salary gains privately,
  so the definition only does work if you''ve already smuggled in a Weberian picture
  of impersonal rules, i.e. you''ve assumed the answer." (Fair-but-overstated: the
  definition is anchored on deviation from duties of the role, so salary isn''t a
  counterexample; but the real bite — the definition is hostage to whatever the formal
  rules happen to be, so it can''t call a system of corrupt rules corrupt — is a genuine
  and well-known objection that this framing misses/mangles.)


  Claim C: "In most of the world what we''d call a bribe is a gift, and the gift/bribe
  line is drawn by culture, not by morality — guanxi, wasta, blat, bringing the doctor
  an envelope, it''s the same behaviour we call ''networking'' when a hedge funder
  does it." (Mostly fair descriptive claim; the error is sliding from "the line is
  drawn in different places / by different considerations" to "drawn by culture, not
  morality," because these practices carry their own internal norms and their own
  condemnations; and "same behaviour as networking" elides the public-role/trust element.)


  Claim D: "Anyway there''s no such thing as a free gift — anthropologists since Mauss
  have shown every gift creates an obligation to reciprocate — so the gift/bribe distinction
  collapses and gifts are just bribes with better PR." (Conflation of inchoate diffuse
  reciprocity with quid pro quo for a specified official act; proves too much — Christmas,
  birthday presents; also this actually undermines the relativist conclusion rather
  than supporting it, since it universalises.)


  Claim E: "Clientelism is the same thing with extra steps: rich guy hands out favours,
  poor people hand over votes, everybody knows the price — it''s corruption, just
  with a relationship bolted on." (Loose use of ''clientelism''; in the literature
  it''s a durable asymmetric contingent exchange — loyalty/support for goods/protection,
  brokered, monitored — distinct from one-shot vote buying; and the "everybody knows
  the price" bit misses that the relation constrains the patron, provides insurance
  where the state doesn''t, and is often resented and defended at once. Also ''corruption
  with extra steps'' misses that clientelism can be welfare-improving for recipients
  while corroding programmatic politics — two different harms.)


  Claim F (conclusion): "So: ''corruption'' names whatever the powerful want to ban;
  there''s no non-question-begging standpoint from which to criticise it, and the
  anti-corruption industry is just Western preferences with a spreadsheet." (Doesn''t
  follow: showing the concept has a parochial genealogy and is measured badly doesn''t
  show there''s no universal content; and the conclusion is self-undermining for the
