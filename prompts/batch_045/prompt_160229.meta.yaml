  ---


  You are acting as the rapporteur for an adversarial collaboration in rational choice
  theory. You have research-level command of decision theory, the theory of rationality,
  and the debates about self-defeating or paradoxically profitable irrationality.
  Work carefully and slowly: begin with a short private brainstorming section (ten
  to fifteen bullets) in which you list candidate shared claims, mark each keep or
  drop with a one-line reason, and flag any dispute you suspect is merely verbal.
  Only then produce the document described below. No citations, footnotes, or bibliography
  are needed; the text must be self-contained and intelligible to someone who has
  never read the literature.


  The case, stated neutrally. A stranded motorist is driven to town by a stranger
  who will be paid only on arrival. Once in town, the passenger has no incentive to
  pay; the driver knows this, is a reliable reader of character, and will not offer
  the ride unless she is confident the passenger is the sort of person who pays. So
  the passenger is offered the ride only if he is disposed to pay, and paying once
  in town is, at that moment, contrary to his aims. Call this the Base Case. Both
  camps agree the passenger gains by being the sort of person who pays, and that the
  act of paying, performed in town, does not advance his aims by its own causal efficacy.


  The two camps, described by their claims rather than by names.


  Camp D (disposition-first): rationality is primarily a property of standing dispositions,
  traits, policies, or characters, and only derivatively of acts. A disposition can
  be rational even when its exercise, on a given occasion, is not: the Base Case is
  a case of rationally required irrationality at the level of the act. What the passenger
  has most reason to do is to be such that he would pay, and there is no further demand
  that the resulting act be rational on its own.


  Camp R (decision-theory-revision): rationality is primarily a property of acts under
  a choice rule, and the Base Case shows only that the wrong choice rule has been
  assumed. Once the driver''s prediction is treated as depending on what the passenger''s
  act indicates about his disposition, the correct rule ranks paying above not paying,
  and the act of paying is straightforwardly rational. Nothing in the case requires
  describing any act as rationally required and irrational at once; the appearance
