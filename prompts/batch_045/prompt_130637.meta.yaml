  ---


  I''ve believed some version of epiphenomenalism since I read Huxley as a first-year,
  and I''ve decided to try to defend it in my master''s thesis rather than write about
  it from the outside. My supervisor''s reaction was that the self-stultification
  objection — the one about how, if experiences cause nothing, my reports about them
  aren''t really about them — was "dealt with in the nineties" and that I shouldn''t
  spend a chapter on it. I can''t see that it was, and I''ve tried to write the objection
  out as carefully as I can so that it either stands or visibly breaks. Here it is.


  (1) Tracking: S knows that p only if, in the nearest possible worlds where p is
  false, S doesn''t believe that p. (I mean this in the ordinary Nozick-style way;
  I''m not assuming closure either way.)

  (2) Epiphenomenalism: phenomenal states are effects of physical states and causes
  of nothing physical — in particular they cause none of my beliefs, utterances, or
  diary entries.

  (3) So for any phenomenal fact F about me — say, that I''m in pain right now — there
  are possible worlds in which F doesn''t obtain, my entire physical history is exactly
  as it actually is, and I believe that F obtains just as I actually do.

  (4) Those worlds differ from actuality in strictly fewer respects than any world
  in which my physical history also changes, so the nearest ¬F worlds are among them.

  (5) So my belief that I''m in pain doesn''t track the fact that I''m in pain: I
  don''t know that I''m in pain, and by repetition I don''t know any phenomenal fact
  about myself.

  (6) But the arguments that moved me to epiphenomenalism in the first place — the
  Mary case, the conceivability of zombies, the explanatory gap — are all arguments
  from facts about what my experience is like, and they presuppose that I know those
  facts. If (5) is right, epiphenomenalism saws off the branch it was sitting on:
  I can''t even know that there are experiences of which to say that they do nothing.

  (7) And here is what actually bothers me, more than (6): nothing in (1)–(5) uses
  the word "phenomenal" in any essential way. Swap in any class of states that is
  claimed to make no causal difference to what I believe. Most physicalists I argue
  with say exactly that about semantic properties — that whether my noise means that
  snow is white makes no difference to what my neurons do — and about the rational
  relation between premises and conclusion, which they take to be implemented by,
  and nothing over and above, the neurophysical story. Run (1)–(5) with those substituted
  and I get: I don''t know what I believe, I don''t know that my conclusions follow
  from my premises, and therefore I don''t know that (1)–(5) are sound. That is too
  much. An argument that refutes every position in the philosophy of mind at once,
  including the one my opponents hold, has refuted nothing.


  So: which step goes, and what does giving it up cost me? I''d rather keep (2) than
  (1) — I''m attached to epiphenomenalism, obviously — but I''d like to know if I''m
  being sold a lemon. Two things I''ve tried, in case they help or in case they''re
