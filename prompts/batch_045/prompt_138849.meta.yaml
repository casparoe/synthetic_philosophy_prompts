  Details on the invented variant to describe concretely:

  - Conditional markets trade "index if A adopted" vs "index if B adopted"; govt adopts
  higher one.

  - Problem she targets: only one branch is ever realized, so no trader is ever scored
  on the counterfactual; settlement against realized welfare rewards traders for forecasting
  the world, not for causal judgment.

  - Her fix: 5 years later a standing panel of economists issues an official counterfactual
  estimate of what the index would have been under the rejected policy; conditional
  markets settle against that estimate (so the winning side gets paid out of a settlement
  fund based on panel''s number).

  - Anti-capture: a second-order market trades on what the panel will say; divergence
  above a threshold triggers a review by a second panel; she calls this "auditing
  the auditors".

  - Known deflecting move: "that''s a measurement question, not a governance question".


  Questions/topics:

  1. Causal identification: are conditional prices causal? Reply: "prices of conditional
  assets are expected counterfactuals; traders are rewarded for causal reasoning because
  the asset pays on the realized branch... " Hmm — press: on the realized branch,
  payoff only depends on realized world, so a trader''s causal belief is disciplined
  only via the realized branch, and if she settles against realized value, the counterfactual
  is never scored. Follow up: what would it even mean for a market to be "wrong about
  the counterfactual", and can a market have a track record on that?

  2. Panel politics / method-dependence: synthetic control vs structural model vs
  expert elicitation; she says measurement not governance → follow up: whoever sets
  the counterfactual method sets which policies win retroactively, and traders know
  this ex ante, so they''ll price the panel''s method not the world; so the panel''s
  method is effectively legislation.

  3. Regress: second-order market on the panel; who audits them; if regress stops
  at a boring rule, credentials inherit from there.

  4. Manipulation with counterfactual settlement: you can''t move realized index but
  you can move the panel''s estimate (funding, capture, publishing); plus classic
  sabotage (make the adopted policy fail, and also the sovereign is the counterparty
  — a later legislature can refuse to fund settlement).

  5. Revisable measure: contract written on a moving target; her likely reply "settle
  on the definition frozen at trade time" → follow up: then the market prices today''s
  definition, not the welfare we''ll care about, and voters lose the ability to correct
  the measure without expropriating open positions.

  6. Horizon/liquidity/intergenerational: 5–10 year settlement, dead traders, no counterparty,
  no liquidity; and discount rate inside the index is itself a value choice.

  7. Value/belief boundary (Cowen-style): policies change who counts and how the index
