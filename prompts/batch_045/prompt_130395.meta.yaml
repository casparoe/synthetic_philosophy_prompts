  \n(a)\n\nBoden's distinction concerns two ways of being novel. In exploratory creativity\
  \ the space is already fixed: the rules that generate the space are in place, and\
  \ the creator's achievement is to reach a place in it that nobody had reached —\
  \ the item was always possible, merely unvisited. In transformational creativity\
  \ it is the rules that change. The space is altered, and afterwards items are possible\
  \ which before were not merely unvisited but not there to be visited. Her examples\
  \ are the large ones: a new genre in painting, a new framework in science, where\
  \ what alters is not which structure you have but which structures there are to\
  \ be had.\n\nSet against that, the knob model looks like a model of exploration\
  \ only. K1 gives the creator a fixed list of knobs; K2 says that what they do is\
  \ alter a few of the settings; the novelty of the result consists in its being a\
  \ combination of settings that has not been chosen before. But every such combination\
  \ is already in the span. So the model can explain how an unvisited point gets visited\
  \ and not how a space gets altered: the list of knobs is not itself something the\
  \ act of creation puts in play, since on K4 it is simply whatever apprenticeship\
  \ has installed. The criticism is best put as a dilemma. Either the new work is\
  \ a setting of the old knobs, in which case it lay in the span already and the novelty\
  \ is exploratory; or it is not a setting of the old knobs, in which case the model\
  \ has nothing to say about how it was produced. What Boden calls transformational\
  \ creativity falls on the second horn, and that is the horn the model cannot grip.\
  \ It is worth adding that the dilemma is not answered by pointing out how large\
  \ the span is — that is a difference of degree within the first horn.\n\nGood: that\
  \ last sentence is a nice touch of strength.\n\n(b)\n\nThe strongest reply, I think,\
  \ has three strands.\n\nThe first is high leverage, and it is a reply to the critic's\
  \ inference rather than to the criticism. The critic moves from \"the new work looks\
  \ discontinuous with what came before\" to \"the space must have changed\". K5 blocks\
  \ that move. If a knob can be such that altering it reinterprets what all the other\
  \ knobs are for — a switch rather than a dial — then two settings one twiddle apart\
  \ can yield works with no perceptible family resemblance, and the appearance of\
  \ a leap in the product is no evidence of a leap in the process.\n\nThe second is\
  \ that the knobs need not be knobs of the surface. Nothing in K1 says what a setting\
  \ must be a setting of; a knob's settings may be operations on the scheme itself\
  \ — split knob 7, merge knobs 2 and 5, delete knob 3. Twiddling can then change\
  \ the list, and what K4 describes as slow revision becomes something the model represents\
  \ rather than something it merely presupposes.\n\nThe third is that new knobs typically\
  \ arrive from outside, by analogy with a neighbouring domain; the space is altered\
  \ by contact with other spaces, not by an escape from space altogether.\n\nStrand\
  \ one works. Strand three is a suggestion about where new knobs come from, not an\
  \ account of how they are taken up, so it relocates the problem rather than answering\
  \ it. Strand two is the one that has to carry the weight, and whether it can is\
  \ a question about what a space is; I take it up in (c).\n\nOne further point about\
  \ what is at stake. It is sometimes said that the two of them are not really in\
  \ dispute, since Boden is offering a mechanistic account of creativity and so cannot\
  \ be denying that transformation has a mechanism. But that is too quick. On her\
  \ view transformational creativity is precisely the case where there is no space\
  \ to search, and she concludes from this that it is not the sort of thing a mechanism\
  \ could produce and that it lies outside what any computational model could in principle\
  \ do; that is why, for her, a machine could at best be exploratory. If that is right,\
  \ then strand two is not an extension of Hofstadter's model but a denial of Boden's,\
  \ and the two views are further apart than the literature usually allows.\n\nHmm\
  \ — \"It is sometimes said that...\" nice: the student anticipates the correct reading\
  \ and dismisses it. That makes the error subtle and realistic. Good.\n\n(c)\n\n\
  (i) The relation is transitive, and this can be shown rather than assumed. Twiddle\
  \ distance is a metric, so the triangle inequality holds: d(x,z) ≤ d(x,y) + d(y,z).\
  \ Let y be an r-variation of x and z an r-variation of y. Then d(x,z) ≤ r + r =\
  \ 2r. But r is the elasticity of the theme, and the only bound with any content\
  \ is r: a work more than r twiddles from the theme is not a variation of it at all,\
  \ however it was arrived at. So the relation is transitive in the only sense that\
  \ matters. Either a chain of steps each of size at most r stays within the theme's\
  \ r-ball, in which case its endpoint is a variation of the origin; or it leaves\
  \ that ball, in which case the chain has ceased to be a chain of variations of the\
  \ origin, and the smallness of the individual steps is neither here nor there.\n\
  \nIt follows that ordinary twiddling is bounded: the region a creator can reach\
  \ from a theme by successive variations is exactly that theme's ball of radius r,\
  \ and no accumulation of small steps takes them outside it. If the model is to allow\
  \ a creator to end up somewhere genuinely new, it must be the metaknob that does\
  \ the work, since only a change of scheme lifts the bound.\n\n(ii) This is awkward\
  \ for slippage, which is the part of the model I find most attractive and which\
  \ I therefore want to be careful about. The idea is that a creator can drift arbitrarily\
  \ far from an origin by steps each of which is licensed by its smallness. But if\
  \ the variation relation is transitive with the bound r, the drift is bounded: either\
