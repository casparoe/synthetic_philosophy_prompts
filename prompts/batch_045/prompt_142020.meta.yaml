  Draft:


  ---


  I host a podcast on the foundations of machine learning, and next week''s guest
  is Dr. Ines Kovač, a philosopher of science turned interpretability researcher.
  In her forthcoming book manuscript she defends what she calls mosaic realism: the
  claim that a trained network does have genuine representations, but that the real
  thing is not any individual feature direction you can recover — not the columns
  of a sparse autoencoder''s dictionary, not the directions found by a linear probe,
  not the clusters you get from PCA — because different methods, and different widths
  or sparsity budgets within a method, yield different and mutually incompatible feature
  lists. What is real, she argues, is the mosaic: the coarse-grained pattern of similarity
  and compositional relations among features — which features sit near which, which
  cluster hierarchically under which, which combine to make which — that she says
  survives changes of method. She leans hard on an analogy with temperature: thermometers
  of different makes and different physical principles disagree about the numbers
  while tracking one and the same quantity, and nobody concludes that thermometers
  invent temperature.


  Her stock reply to skeptical questions is: "That''s a measurement problem, not a
  metaphysics problem." I''d like questions that make that reply progressively harder
  to lean on.


  Please draft nine or ten interview questions, with a follow-up for each keyed to
  the answer she is most likely to give. I want at least one question on each of the
  following, and I''d rather you not ask her to restate the view:


  1. Granularity. Wider dictionaries split features that narrower ones treat as single
  ("dog" becomes poodle-head, snout-in-profile, animal-ear), and the splitting looks
  like it could continue indefinitely. If the number and identity of features is not
  fixed by the network, what fixes the grain of the mosaic? — I expect her to say
  the hierarchical/clustering structure is itself part of the mosaic, so splitting
  is not a problem but a refinement. Press on whether the resulting hierarchy is a
  property of the network or of the training distribution''s own compositional structure,
  and on what follows if it is the latter.


  2. Privileged basis. ...


  3. Untrained networks / unused structure.


  4. Content and misrepresentation.


  5. Falsifiability: what finding would make her an antirealist — specifically, what
  if the geometry turned out to be fully predicted by data statistics independent
  of weights/training?


  6. What turns on it — the "verbal dispute" challenge: if realist and instrumentalist
  agree on all intervention-level predictions.


  7. The thermometer analogy''s limits — the sequence that makes the deflection harder.


  Also: no questions about her background, her career path, or advice for young researchers.


  Finally: for each question, tell me how confident you are that the answer you''ve
  anticipated is what she''d actually say, and flag the one follow-up you''re least
  sure will land — including, where relevant, where you''re unsure whether a technical
  assumption you''re relying on is correct.


