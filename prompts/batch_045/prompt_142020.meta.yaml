  is invariant — but is the geometry invariant under changes of granularity? Hierarchical
  structure: splitting produces a tree; is the tree structure the invariant? Follow-up:
  she says the tree is the invariant → ask whether the tree is just the clustering
  of the data manifold, i.e., a property of the training distribution rather than
  of the network. Follow-up: then is the "representation" a property of network +
  data distribution, which seems to make it relational/extrinsic, not intrinsic.


  2. The causal-role / intervention worry: linear probes can find directions that
  correlate with a concept but that the network doesn''t use (causally inert). Realism
  might require the representation to be causally efficacious in the network''s own
  computation. But structural realism says structure, not use. Question: does she
  need the geometry to be causally exploited by the network, or is mere presence enough?
  Her likely reply: "structure is what''s available for use; use is downstream and
  task-dependent." Follow-up: a scrambled/shuffled network, or an untrained network
  at init — random init networks also have rich geometric structure in activation
  space (clustering reflecting input statistics); is a randomly initialized network
  therefore "representing" things? That''s a great gotcha: untrained networks have
  non-trivial representational geometry too (and untrained nets have some alignment).
  Her likely reply: "at init the geometry doesn''t support the fine-grained discrimination
  / it''s not *used*"; follow-up: then use is doing work → back to causal role; or
  "the geometry must be *systematically exploitable* by a linear readout for many
  tasks" — then realism is relativized to a task family.


