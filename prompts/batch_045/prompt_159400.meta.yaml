  voluntary choice; soft paternalism overrides choices that are nonvoluntary or based
  on flawed information (Feinberg).

  - Nudge as "asymmetric paternalism" (Camerer, Issacharoff, Loewenstein, O''Donoghue
  & Rabin 2003): help boundedly rational people while not much harming fully rational
  ones.

