  view is often said to give a general argument for epistemic modesty about one''s
  own plans. Explain the distinction, and say what the argument is and how strong
  it is. Your answer must address the following case. A team is estimating the cost
  and schedule of a first-of-a-kind direct air capture plant. Their own bottom-up
  estimate is $400m and four years. To get an "outside view" they assemble a reference
  class of 30 first-of-a-kind energy and chemical demonstration plants, whose cost
  overruns and schedule slips were themselves recorded from the internal forecasts
  of the teams that built them, and they adjust their estimate to the median outcome
  of that class: $900m and seven years. Someone objects that the reference data was
  produced by exactly the kind of optimistic inside-view forecasting the outside view
  was supposed to correct for, so the adjusted estimate inherits the very bias it
  was meant to remove. Assess this objection. Does the outside view still have anything
  to offer here, and if so what?''


  Below is one student''s answer. Please grade it out of 25 with a point-by-point
  justification: say which claims are correct, which are partly right, and which are
  mistakes — including any mistake that a hasty reader would pass over — and give
  a mark with brief comments that could be pasted into the margin.


  [Student answer: ~450 words]


  The inside view is the view you get by looking at the details of the case in front
  of you: you list the work packages, talk to engineers, add up the costs and get
  $400m and four years. The outside view is the view of someone who isn''t inside
  the team — an external reviewer or a consultant who hasn''t spent two years on the
  design and hasn''t fallen in love with it. You get it by asking how often things
  like this turn out well: put the project in a reference class of similar projects,
  look at the distribution of outcomes, and use that as your estimate. Kahneman''s
  work on the planning fallacy shows the two come apart: people''s inside-view forecasts
  are systematically optimistic because they imagine the most likely scenario and
  neglect how many ways there are for things to go wrong.


  The argument for epistemic modesty is straightforward. Your inside-view estimate
  is one person''s (or one team''s) judgment, and modesty about your own judgment
  means giving weight to the track record of similar cases rather than to your own
  sense of the details — roughly, deferring to what usually happens instead of trusting
  yourself. So the team was right to adjust to $900m and seven years.


  The objection is stronger than it looks, and I think it succeeds. Which reference
  class you use is itself a judgment call: the team chose first-of-a-kind demonstration
  plants, but they could have chosen all energy projects, or all projects with this
  budget, or all projects their firm has done, and the median would be different each
  time. Since picking the class requires exactly the kind of case-specific judgment
  the outside view was meant to bracket, the outside view is infected with the inside
  view from the start. In this case it is worse: the recorded overruns were computed
  against internal forecasts, so the numbers in the reference class were generated
  by the same optimism the method was supposed to correct. If the base rates are just
  other people''s inside views, then using them is still using an inside view, and
  the "correction" is really just deference to a group of equally biased forecasters.
  Nothing is gained.


  That said, the outside view is still useful as a sanity check when the reference
  class is genuinely settled in advance. Here it wasn''t, so I would discount the
  $900m figure heavily and revert toward the team''s own number."


