  I am grading a take-home exam for a graduate seminar on judgment and decision making
  and would like an independent reading before I finalise marks. The question was:


  **Question (25 marks).** "The distinction between the inside view and the outside
  view is often presented as giving a general argument for epistemic modesty about
  one''s own plans. Explain the distinction, state that argument, and assess its strength.
  In your answer you must also discuss the following case.


  A team is forecasting the cost and schedule of a first-of-a-kind direct air capture
  plant. Their bottom-up estimate is $400m and four years. They then build a reference
  class of thirty comparable first-of-a-kind energy and chemical demonstration plants.
  For each, the database records the estimate made at the point of sanction and the
  final outturn; the median estimate in the class is $350m and three and a half years,
  the median outturn $900m and seven years. The team sets its forecast at the median
  outturn: $900m and seven years.


  A colleague objects that the class was assembled from, and characterised by, exactly
  the kind of optimistic inside-view estimates the outside view was supposed to correct:
  the sanction estimates were produced by the same bottom-up process as the team''s
  own $400m, and the overruns are measured against them. On this objection, the adjusted
