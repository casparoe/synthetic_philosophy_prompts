  Last night I had a long argument with a friend — she''s a computational linguist
  and probably the most consistent skeptic about machine understanding I know — and
  I''ve been turning it over since. She gave me the following seven steps. I think
  the argument is in trouble because it appears to prove far more than she wants,
  but every exit I try either costs me something I''d rather not pay or turns out
  to be an exit she''s already blocked. I''d be grateful for a diagnosis.


  (1) Anchoring. A symbol-token in a system has content — is about something, refers,
  can be true or false — only if the system''s use of the symbol is anchored in something
  that is not itself a symbol: the system must be able to pick its referent out non-symbolically,
  whether perceptually, or by some causal relation that isn''t merely a matter of
  symbol-to-symbol rules. [This is the symbol grounding requirement as it is usually
  stated.]


  (2) No proxies. Anchoring cannot be inherited. If A''s token "dog" is anchored,
  and A''s activity causes a token "dog" in a system S whose handling of that token
  is fixed purely by relations among symbols, then S''s token is unanchored all the
  same: causal descent from an anchored token is not anchoring. (She says this is
  what distinguishes grounding from mere reference-borrowing.)


  (3) The machines. A large language model is trained on text. Every element of its
  training signal is a symbol-vehicle, and its objective is to predict symbol-vehicles
  from symbol-vehicles. Nothing in the training loop puts it in non-symbolic contact
  with anything beyond its own states. So none of its symbols are anchored.


  (4) Therefore its outputs are not about anything. When it emits "the capital of
  France is Paris," that string no more refers to Paris, or is true, than the "5"
  on a calculator''s display is about the number five.


  (5) But the tracking is real. It produces sentences it has never seen; those sentences
  can be checked against the world and come out true; it can be corrected and it revises;
  and its failures are about the world rather than about strings — it mixes up two
  cities, not two symbol-types. Something with no content at all cannot be systematically
  right or wrong about France.


  (6) So one of (1)–(3) is false. Give up (1) and the grounding requirement was never
  a requirement on meaning. Give up (2) and content can be inherited through a chain,
  in which case the model inherits whatever content the authors of its corpus had,
  and (4) is false. Give up (3) and you owe an account of what non-symbolic contact
  a text-trained model has.


  (7) And I think the argument overreaches. (1) and (2) don''t only apply to machines.
  Most of my vocabulary comes from testimony: I have never had non-symbolic contact
  with a quark, with Byzantium, with the inside of a star, or with the heat death
  of the universe. By (1), my tokens for these are unanchored; by (2), I cannot borrow
  anchoring from the physicists and historians who did have contact. So a large part
  of what I say — everything about unobservable, abstract, merely possible, or future
  things — comes out contentless and not truth-evaluable. That can''t be right. So
  (1) or (2) goes. And whichever one goes, (4) goes with it, and I no longer see any
  version of the grounding requirement that bites on the model and spares me.


  Her replies, briefly, so you know which moves are already occupied. On (5): a barometer
  tracks storms without being about them, so reliable covariation with the world is
  not yet content; the model is a very elaborate barometer. On (7): she accepts the
  consequence for some of these and calls it the right result — my talk of quarks,
  she says, gets its content only by deference to people who do have contact, and
