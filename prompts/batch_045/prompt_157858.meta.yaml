  Draft text:


  Title: The imitation game is an unvalidated assay


  Para 1: Turing''s 1950 paper... opens: I propose to consider the question, "Can
  machines think?" and then says he''ll replace that question by another, expressed
  in relatively unambiguous words. In my old field this move had a name: you can''t
  measure "is this water safe?", so you operationalise — total coliforms, or lead
  in ppb — and then, crucially, you validate. Nobody accepts a new assay on the strength
  of the idea behind it; you have to show what it responds to.


  Para 2: What validation means. Four things at least: selectivity (does it respond
  to anything besides the target analyte?), calibration against standards of known
  concentration, a limit of detection, and robustness across operators and instruments.
  As far as I can tell the imitation game has had none of these. It has generated
  an enormous amount of argument and roughly no validation data.


  Para 3: Standards problem. Positive standards: only us. We have no independent sample
  of known mindedness against which to calibrate, so we calibrate on the only positives
  available and then treat a match to them as the signal. Equivalent: validate a method
  on pure standards in distilled water and never run a spiked real matrix. Perfectly
  possible that the assay is responding to something that travels with mindedness
  in humans but doesn''t constitute it.


  Para 4: The readout is a property of the pair. Interrogators differ — in severity,
  and in what they''re charmed by. Some are persuaded by a typo, some by a graceful
  admission of ignorance, some by a long anecdote about a childhood kitchen. A candidate''s
  score is therefore not a candidate measurement; it''s an interaction. My chemist''s
  reflex: the absorbance depends on path length and on the lamp as well as on the
  sample. In testing theory this is handled by treating the questioners as items —
  give many interrogators of differing severity to many candidates, fit candidate
  ability and item severity together, look at residuals. Until somebody does that,
  a pass is partly a fact about the interrogator.


  Para 5: The part I think is actually new — the dimensionality check. Suppose you
  did run that battery: enough interrogators of different styles (chatty, hostile,
  technical, personal, patient, impatient) and enough candidates. If the test tracks
  one property, one latent dimension plus item severity should mostly explain who
  fools whom, and the residuals should be noise. My prediction is that they won''t
  be: I expect two fairly independent factors. Call one fluency — the ability to generate
  plausible, well-shaped conversation about anything. Call the other situatedness
  — having been somewhere, having a body, a history, specific boring commitments,
  the ability to be dull and particular. A fluent system with no history does well
  on the first, badly on the second; plenty of real people are the reverse. If the
  residuals need both, then "passes the test" isn''t reporting a single measurement.
  And note this is a stronger complaint than "it measures the wrong thing" — it''s
  that there may be no thing there for the test to be an assay of.


  Para 6: The selectivity panel. Build candidates that vary one human-like property
  at a time and see how the assay sorts them. (a) The mimic: a system tuned to imitate
  one particular real person — their hesitations, misspellings, opinions, the way
  they answer a question they don''t like. No mind, maximal surface match. (b) The
  locked-in respondent: fully conscious, can only signal yes or no, slowly, through
  a switch. (c) The fluent confabulator: warm, plausible, ungrounded. My guess is
  the assay ranks (a) and (c) above (b). If so, it has poor selectivity in the technical
  sense, and I want to be careful here because I think two different complaints get
  mixed together: (b) is about the test failing as a necessary condition for mind,
  (a) and (c) about it failing as a sufficient one. Those are different failures and
  they need different fixes.


  Para 7: Three objections I can hear coming. First, that Turing never offered the
  test as an analysis of mind but as a replacement question, a prediction about what
  machines would do, so my demands are beside the point. Reply: if it''s only ever
  meant as a sufficient condition, then its whole job is to have few false positives,
  which is exactly the selectivity question, and the mimic is precisely the false
  positive it can''t exclude. Second, that unidimensionality is an unreasonable demand
  — intelligence isn''t one thing, chess skill isn''t one thing, why should mind be?
  Reply: for chess we have an independent criterion, winning games, so we don''t need
  the internal structure to be simple; for mind we have no criterion the test isn''t
  itself supplying, so the internal-structure check is the only validation there is.
  Third, and this is the one that worries me most, that the whole framing assumes
  mindedness is a quantity — something with a true value that an assay can be more
  or less accurate about, in the way lead-in-ppb has a true value. If mindedness isn''t
  that kind of thing, my talk of calibration and selectivity is a category mistake
