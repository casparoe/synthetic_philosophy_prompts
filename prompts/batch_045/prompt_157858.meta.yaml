  Essay draft content (as the scientist''s own words):


  Title: "The imitation game is an assay, and nobody has validated it"


  1. Turing''s move: replace vague question with operational one. Quote. Respect:
  this is exactly what we did in analytical chemistry — replace "is this water safe?"
  with "does it contain more than X of Y", then validate.


  2. Validation vocabulary: selectivity (does the assay respond to things other than
  the target analyte?), sensitivity, calibration against standards of known concentration,
  limit of detection, robustness to operator. None of this has been done for the imitation
  game.


  3. Standards problem: we have no samples of known mindedness except other humans
  (and ourselves), so the assay is calibrated on a single class of positive standards.
  In chemistry that''s like having a method validated only on pure standard solutions
  and never on spiked real matrices. So we can''t tell whether a pass means "minded"
  or "minded-looking."


  4. The pair problem: the measurement is a function of the (candidate, interrogator)
  pair, not the candidate alone — every interrogator is an "instrument" with their
  own gain and their own idiosyncratic blind spots (some are charmed by a certain
  style, some by typos and hesitations). Chemistry analogue: reading depends on path
  length and on the instrument. Fix: treat interrogators like items in a psychometric
  battery — many interrogators of graded severity, many candidates, estimate a candidate
  parameter and an interrogator-severity parameter, and inspect the residuals. (I''ll
  mention "the kind of model used in educational testing" without a proper name.)


  5. The bit I think is new / interesting: the unidimensionality check. If "mindedness"
  is one property, then a single latent dimension should explain who passes which
  interrogator. My guess is it won''t: I predict at least two roughly independent
  factors — (a) fluency/genericity, being able to produce plausible conversation;
  (b) situatedness, having been somewhere, having a body, having a history, being
  able to be boring and specific about it. And note these can be anti-correlated in
  interesting ways. If the residuals need two factors, then "passes the test" isn''t
  reporting a single measurement, and the behavioral criterion is measuring a mixture
  — which is a different situation from "it measures the wrong thing"; it''s "it doesn''t
  measure a thing."


  6. Selectivity panel: build engineered candidates that vary one human-like property
  at a time: (i) a mimic — a system tuned to imitate a particular real person''s verbal
  tics, pauses, spelling habits, opinions — mindless, but maximally human-like; (ii)
  a "locked-in" respondent — a person who is fully conscious but can only answer yes/no
  or very slowly through a switch; (iii) a fluent confabulator — plausible, warm,
  no grounding. If the assay scores (i) above (ii), the assay''s selectivity is poor.
  Note: (ii) shows the test fails as a necessary condition; (i) shows it fails as
  a sufficient condition; these are different failures and I think the literature
  (well, what I''ve read) sometimes runs them together.


  7. Anticipated objections I want to handle: (a) "Turing never offered it as an analysis
  of mind, just as a prediction/sufficient condition" — reply: then the assay''s job
  is only to have few false positives, and that''s exactly the selectivity question,
  and the mimic case makes it look bad; (b) "unidimensionality is too strong — intelligence
  isn''t one thing" — reply: for a construct like "good chess player" we have an independent
  criterion (win/loss), so we don''t need unidimensionality; for mind we have no independent
  criterion, so the internal-structure check is the only validation available; (c)
  "you''re assuming mindedness comes in degrees / is a measurable latent quantity"
  — that''s my real worry, a philosopher will say I''ve smuggled in a realist assumption
  about the very thing at issue.


  8. Where I want to end: modest conclusion — not "the Turing test is worthless" but
  "the test is an unvalidated assay, and until someone reports interrogator-severity-controlled
  data and a selectivity panel, a pass is evidence about the interrogator at least
  as much as about the candidate."


