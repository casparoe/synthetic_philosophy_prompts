  the prior sign deterministically necessitates the intervention (i.e., the sign itself
  is determined, so no free will/responsibility at the actual sequence — begging the
  question against the incompatibilist) or the sign is indeterminate (so Jones could
  have done otherwise in the robust sense — the case fails). Which is "blocking" vs.
