  the dilemma by using a non-contrived deterministic manipulation. (4) Frankfurt''s
  later "alternative: the agent''s will is his own because he identifies with it"
  — the "willing addict/meshing" — actual-sequence views (Frankfurt''s own positive
  view: responsibility grounded in the agent''s identification with the will, not
  in alternatives).

