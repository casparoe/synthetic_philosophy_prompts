  of how referring expressions get their referents but a theory of the logical form
  of sentences containing descriptions; the standard objections from Strawson, Donnellan,
  and Kripke all presuppose that the theory is trying to do pragmatic or referential
  work that Russell explicitly denies. I call this the ''logical-form-only'' reading.
