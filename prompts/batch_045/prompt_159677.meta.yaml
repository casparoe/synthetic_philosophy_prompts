  operator REPORT, which maps an utterance containing a definite description onto
  a meta-linguistic proposition about how the speaker is using the description (attributively
  or referentially), without letting that pragmatic fact enter the truth-conditions
  of the original sentence." Or maybe simpler: "I propose that Russell''s scope distinctions,
