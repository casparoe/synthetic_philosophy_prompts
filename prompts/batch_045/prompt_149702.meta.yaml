  Argument (from my friend "Dave" or "a guy on a forum"):


  (1) Forming an intention to do A is settling on A for what you take to be reasons
  to do A.

  (2) You cannot now settle on A for reasons you know will not be reasons at the moment
  of acting, because an intention is a commitment carried forward: it has to be a
