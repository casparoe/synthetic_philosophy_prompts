  bring myself to give up, or broken somewhere I can''t locate. Here it is in his
  steps.


  (1) Parity: if an external process, coupled to a subject, would count as a cognitive
  process were it going on inside the head, then it counts as one outside it. Refusing
  this is just prejudice about skull and skin.


  (2) What fixes the relevant role is only the subject''s downstream relation to the
  resource: it is reliably available, easily accessed, automatically endorsed, and
  it saves her the trouble of working out for herself what it says. Call these the
  coupling conditions.


  (3) Otto''s notebook meets them: he always carries it, consults it before acting,
  and treats what it says as authoritative without re-checking. So Otto''s notebook
  is part of Otto''s mind, and Otto has beliefs stored outside his head. I want to
  keep this.


  (4) Nothing in (1) or (2) requires the resource to be paper, to be portable, to
  have been written by the subject, to be writable by her now, or to be under her
  exclusive control. The conditions concern only how she is related to it when she
  acts.


  (5) The conditions are matters of degree, and Otto satisfies them only finitely:
  his notebook is not perfectly reliable, not instantly accessible, and he occasionally
  checks an entry against another source. So for any item that satisfies them, a slightly
  worse item — slower, less often verified, less exclusively his — satisfies them
  too, and a difference that makes no difference to how he reasons cannot make a difference
  to what his mind is made of.


  (6) There is therefore a chain of such steps from Otto''s notebook to: a photocopy
  of a friend''s notes that Otto has annotated and relied on for years; a colleague
  whose standing answer to "what''s the exchange rate?" Otto acts on without checking;
  a phone that completes his query before he finishes typing it; and the internet
  generally.


  (7) So the internet is part of Otto''s mind. More generally, everything he is reliably
  coupled to is.


