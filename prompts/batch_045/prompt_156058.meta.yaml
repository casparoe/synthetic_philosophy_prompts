  Dennett''s position in "Are Dreams Experiences?" (1976, Philosophical Studies):
  He argues that dreams are not experiences in the sense of there being conscious
  episodes of the sort we have when awake; the "dream" is a memory-ish phenomenon
  — the brain "composes" a dream at the moment of waking (the "cassette theory": during
  sleep the brain produces neural activity that, at the moment of awakening, is turned
  into a "dream" loaded into memory, like a cassette tape being loaded). He says:
  "we can be wrong about our dreams" — and there''s a famous line about the dream
  being composed in the moment of waking, comparable to the way a story can seem to
  have been experienced. He also introduces "cassette theory of dreaming" and contrasts
  with the "camera theory" (the dream is a film being played during sleep, watched
  by an inner observer).


  Malcolm''s position (Norman Malcolm, "Dreaming" 1956, Wittgensteinian): The concept
  of dreaming is not the concept of an experience; the criteria for saying someone
  had a dream are the waking report (or the disposition to report), not any inner
  episode. Malcolm''s argument: "if a person is asleep, he is not conscious; dreams
  can only be identified by their being remembered on waking; a remembered dream is
  not a memory of an experience" — Malcolm famously argued that "dreams are not experiences"
  and that the question of whether dreams occur during sleep has no sense; "the concept
  of a dream is derived from the dream report." There''s also Malcolm''s argument:
  no criterion can distinguish "I dreamed X" from "I seemed to remember X" if dreams
  are experiences had during sleep — actually his "no criterion" argument: if we say
  dreams are experiences during sleep, then since we only have the waking report as
  evidence, and the report could be a memory-hallucination, the hypothesis that the
  dream occurred during sleep would be unverifiable, hence meaningless.


  Dennett disagrees with Malcolm''s verificationism: Dennett accepts that dreams might
  be real neural events during sleep but argues the "experience" (the phenomenal movie)
  is composed at waking. So both reject the "internal movie" but for different reasons.


