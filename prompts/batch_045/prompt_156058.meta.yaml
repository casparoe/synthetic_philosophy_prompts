  Draft:


  (1) The "camera" or "inner movie" picture is incoherent: for a film to be an experience
  someone has to watch it, and positing an inner watcher just pushes the problem back
  a step. So whatever dreaming is, it isn''t a film playing to an inner audience while
  I lie there.


  (2) The only thing that ever makes it true that I dreamed such-and-such is what
  I can say, draw, or recognize on waking — my spontaneous waking report and the impressions
  it draws on. There''s no other access to the purported episode, not even for me.


  (3) If all the access I have to a putative episode is a later state, then there
  is nothing more to the episode than what that later state provides. (Otherwise we''d
  be positing a fact that could never, even in principle, make a difference to anything
  I could think, say, or do — including in the first person.)


  (4) So the temporal order, duration, and detail that dreams seem to have are properties
  of the report-construction process, which happens at or shortly after waking, not
  properties of anything that unfolded during sleep. The dream isn''t a memory of
  an experience; it''s something more like an improvisation that gets filed as a memory.


  (5) But (3) and (4) are general: they say an episode''s being an experience depends
  on a later state''s providing access to it. So they apply to any putative episode
  whose later access is missing.


  (6) Cases: (a) the patient who is awake enough during surgery to respond and later
  has total retrograde amnesia for the interval; (b) the driver who navigates twenty
  miles on a familiar road with no later recollection of any of it; (c) the seizure
  patient whose hippocampal damage means nothing from the ictal period is ever retrievable;
  (d) pre-linguistic infants and non-human animals, who have no first-person avowal
  capacity at all.


  (7) In each of (6a)–(6d), by (3) there was no experience at the time. Which is absurd:
  the surgical patient''s pain was real when it happened, the driver saw the road,
