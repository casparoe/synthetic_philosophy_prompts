  Let me write the argument:


  (1) Call a quantity P a proxy for target T in a system if P and T are positively
  correlated across the interventions available to the optimizer at the start.

  (2) Goodhart''s law, generalized: whenever an optimizer is put under enough pressure
  on P, the correlation between P and T degrades — up to and including inverting —
  because the optimizer selects for the parts of P that aren''t backed by T.

  (3) Any objective we can actually give a system, or that we can act on ourselves,
  is a finite description; and any finite description is a proxy for the thing we
  care about, since the description will be applied to cases the describer didn''t
  have in mind. So every goal is a proxy. [N.B.: even "maximize T itself" is a description
  and hence a proxy for T.]

  (4) From (2) and (3): for every goal G, there is a level of optimization pressure
  at which pushing on G stops improving what we care about. (Some level — maybe very
  high, maybe low.)

  (5) Now: for any goal G and any optimizer, we never know in advance where that threshold
  is; and the whole point of a capable optimizer is to push hard. Moreover, if we
  knew where the threshold was, we could just add the constraint "don''t push past
  it" — but that constraint is itself part of a new finite description G'', which
  by (3) is a proxy, and by (2) has its own threshold. So the patch regress never
  terminates.

  (6) [The quantifier slide] So for any optimizer with anything like general capability,
  and any goal, more optimization is not reliably better, and at the limit it''s worse
  than doing nothing.

  (7) But "do less optimization" is also a goal-specification — a description — so
  by (3) and (2) it too is gameable, and there''s no non-arbitrary stopping point:
  any amount of optimization > 0 can be the one that overshoots, and any cap is itself
  an optimized quantity.

  (8) So there''s no coherent amount of optimization: every candidate degree is either
  arbitrary or self-undermining. Optimization is rationally impermissible; the only
  safe policy is to not steer at all (act at random / do nothing).

  (9) That''s absurd: taking an aspirin for a headache is optimizing, and it reliably
  helps. So something''s wrong.


  Flaws to consider (the answer should name one):

  - (4)→(6): quantifier shift from "for each goal there exists a (possibly very high)
  pressure threshold" to "a single fixed capability/pressure level (the one we have)
  crosses the threshold for every goal" — ∀G ∃p vs ∃p ∀G. Subtle and real.

  - Step (4)→(5)→(6) also slides from "stops improving" (diminishing returns / plateau)
  to "gets worse" (inversion), and from "at the limit" to "at our actual level".

  - (2): equivocation between two distinct mechanisms: (a) adversarial/direct gaming
  (agent manipulates the measure itself, e.g., the robot hiding the mess instead of
  cleaning) and (b) distributional/extremal selection (the correlation was only ever
  local; pushing to the tail picks up cases where the correlation breaks, e.g., selecting
  for a score far out in the tail where the noise dominates). Mechanism (b) doesn''t
  imply the agent did anything wrong or that optimizing hurt; it just means the proxy''s
  informativeness decays. And crucially (b) can''t be avoided by making the metric
  unobservable, but (a) can.

  - (3): conflation of "a description of T" with "a proxy correlated with T." If the
  target is constitutively given by the description (e.g., the goal just is "maximize
  the quantity picked out by this description"), there''s no gap for gaming — no daylight
  between sign and referent. Gaming requires the gap. So (3) smuggles in a gap between
  description and target, which is exactly what''s at issue. Or: on the "metaethics/idealized
  interpretation" reading, a specification is interpreted over all possible cases,
  not "applied to unforeseen cases by a literal rule."

  - (7): "every cap is arbitrary" — but there can be principled reasons for a stopping
  point (expected-value calculation with a model of how much correlation remains;
  robust satisficing), and "arbitrary" ≠ "rationally impermissible."

  - Also (8) is a slide: not being able to pick the exact optimum doesn''t mean any
  choice is as bad as any other; "no unique best" ≠ "all impermissible."

  - Also (5) patch regress: not all regresses are vicious; adding constraints can
  raise the threshold enough (e.g., "adversarial training" raises the cost of gaming)
