  But Simpson''s paradox gives cleaner rule-divergence and is more technical/in-the-weeds.
  Also the "hard rule" about quotes — no quotes needed.


  Let me reconsider: is there a risk the model just says "adjust for confounders,
  don''t adjust for colliders"? Yes, but the new case is designed so that rule is
  genuinely torn: the partition is pre-treatment (so confounder-ish) but policy-dependent
  (so not invariant under the intervention). I think that''s a good, non-memorized
  wrinkle. To make it sharper, I''ll add: the panel has previously said it "doesn''t
  care about mechanisms we can''t specify in advance" — hmm.


  Let me also add a second twist to raise the stakes: within each arrival mode, the
  reversal holds for mortality but *reverses back* for a second outcome (30-day readmission
