  Hmm, that one''s fun and it means the model can''t just say "keep splitting."


  Let me now make sure at least two rules fit all the precedents and diverge on the
  new case:


  Rule 1 (Causal-structural / "confounders yes, mediators/colliders no, pre-specified"):
  adjust iff the splitter is a pre-treatment common cause of exposure and outcome
