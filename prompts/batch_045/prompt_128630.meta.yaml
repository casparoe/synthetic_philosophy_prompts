  Now: the new case. Let me write it concretely.


  Setting: Regional health system with two stroke centers, Northgate and Fairview
  (names). Proposal on the table: consolidate — route all suspected stroke patients
  to Fairview (or: reroute ambulance strokes from Northgate to Fairview). The numbers:


  Overall (last 3 years, all suspected-stroke arrivals):

  - Northgate: 9.1% 30-day mortality (say 182/2000)

  - Fairview: 7.4% (259/3500)

  So Fairview looks better overall.


  Split by arrival mode (ambulance vs. walk-in/private transfer) — arrival mode is
  determined before the patient reaches either hospital (by 911 dispatch and patient
  choice), measured at or before arrival, not affected by which hospital they end
  up at in the current data (in the current data, dispatch protocol sends to nearest
  center):

  - Ambulance: Northgate 14.2% (170/1200?) vs Fairview 15.9% — Northgate better.

  - Walk-in: Northgate 3.5% (12/350?) vs Fairview 2.9% — Northgate better.

  So within each mode, Northgate is better; overall Fairview better because Fairview
  takes a much larger share of ambulance (severe) patients... wait, no: if Fairview
  takes more ambulance patients (higher mortality), its aggregate should be *worse*,
  not better. Let me redo: For a classic Simpson reversal where the aggregate favors
  Fairview but every stratum favors Northgate, Fairview must have *more* of the *low-risk*
  stratum. So Fairview should have more walk-ins (low mortality). Hmm, but then "Fairview
  takes a larger share of low-risk patients" — that''s fine, it''s a referral-pattern
  thing: Fairview is the one the EMS protocol favors for mild/late-presenting? Let''s
  just say: Fairview is the bigger, better-known center, so it attracts a lot of self-referred
  mild cases (headache, resolved symptoms) — huge walk-in volume with low mortality;
  Northgate, being smaller and closer to the highway, gets proportionally more ambulance
  arrivals. So Northgate''s mix is worse; Northgate is better within each mode. And
  the aggregate favors Fairview because of the mix.


  Then the policy: route ambulances to Fairview. Under the policy, Fairview''s mix
  gets *worse* (more ambulance patients), and its per-patient performance may degrade
  with crowding (door-to-needle times). Also, the "arrival mode" distribution at each
  hospital changes, so the aggregate under the old mix isn''t the right prediction.


  So: the confounder-adjustment rule says "Northgate is better — don''t consolidate
  / route to Northgate." The invariance/transport rule says "the stratum-specific
  effects are the stable quantities, but you also need to know whether Fairview''s
  within-stratum performance degrades with volume, because the policy changes the
  mix; so the honest verdict is ''not decidable from these data, and here''s the one
  number that would decide it.''" And the institutional-suspicion rule says "audit
  the denominators first." And the "decision-relative" rule says: if you''re routing
  a *particular* patient who is already arriving by ambulance, send them to Northgate;
  if you''re predicting system-wide deaths under full consolidation, neither number
  answers it.


  That''s a good divergence with a real, non-memorized punchline. Also there''s the
