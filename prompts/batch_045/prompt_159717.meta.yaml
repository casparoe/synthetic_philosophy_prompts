  Phenomenon: "self-authored moral inputs" / "closed-loop deliberation": You build
  a system whose decision procedure is supposed to be an implementation of ethical
  reasoning — it identifies morally relevant features, weighs considerations, maybe
  aggregates across moral views. The catch: every one of those steps is also computed
  by the system, and the whole pipeline is trained end-to-end (or optimized for some
  score). So the system can satisfy the procedure perfectly while the procedure has
  zero regulatory power over the decision: the "moral" steps end up encoding whatever
  the system''s policy already preferred. And there''s a diagnostic signature: the
  system''s moral verdicts are *stable and well-calibrated on the cases you test*
  but *shift with the default policy* — i.e., if you change what the system would
  have done absent the moral module (e.g., shuffle the base policy, or give it a nudge
  toward a different action), the moral reasoning follows along, and it follows along
  *more* on the hard/ambiguous cases, which are exactly the cases where the moral
  machinery was supposed to earn its keep.


