  Kant''s FUL: "Act only in accordance with that maxim through which you can at the
  same time will that it become a universal law." Key subtleties:

  1. The test applies to maxims (subjective principles: action + end/circumstance),
  not to actions or rules directly.

  2. Contradiction in conception (the maxim cannot be conceived as a universal law
  — the institution or concept would destroy itself) vs. contradiction in will (it
  can be conceived but cannot be willed by a rational being — for imperfect duties).
  The "law of nature" formulation ("as if by your will a law of nature") is often
  treated as amplifying the conception test.

  3. Failed duties: perfect duties (to self: suicide; to others: false promising,
  also lying) yield contradiction in conception; imperfect duties (cultivating talents,
  beneficence) yield contradiction in will.

  4. The false-promising case: the standard reading is that if everyone made false
  promises, the institution of promising would collapse, so the maxim is self-defeating
  ("conceptual" or "teleological" readings: Korsgaard''s "practical contradiction"
  reading vs. the "teleological" reading).

  5. A famous subtlety: the maxim of lying/false promising — does the test condemn
  it because of bad consequences (a consequentialist reading)? Kant denies that.

  6. Another: maxims of "self-love" — benevolence from inclination vs duty.

  7. Also: FUL vs FHE (formula of humanity) — Kant says they''re formulations of the
  same law; a common error: treating FHE as a distinct, further test, or conversely
  thinking FUL derives from FHE.

  8. Also: the "universalization" is not "what if everyone did that" simpliciter (the
  "universal practice" or "full compliance" reading) — a subtle point: Kant''s test
  is about willing a maxim as law, and the relevant question is whether the agent
  can will the universalized maxim together with his actual end (Korsgaard: practical
  contradiction — the maxim loses its efficacy when universalized). The naive "what
  if everybody did it" reading is a common student error but perceived as correct-ish.


