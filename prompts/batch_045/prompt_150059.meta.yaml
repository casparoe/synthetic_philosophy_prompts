  empirical assumptions, since whether a universalized maxim is coherent depends on
  how people would in fact respond.'' Assess this objection and outline the strongest
  Kantian reply."


  Student''s answer:


  "Kant''s formula of universal law tells us to act only on maxims that we can at
  the same time will to become universal laws, i.e., to ask ourselves whether we could
  will that everyone, in the relevant circumstances, act on the same principle of
  action. The object of the test is the maxim, not the action: the same outward act
  can be permissible or impermissible depending on the end and circumstances that
  the agent builds into his maxim, which is why the test cannot be replaced by a list
  of duties.


  The test fails in two ways. A maxim fails by contradiction in conception when the
  universalized version of it is logically incoherent — its universal adoption is
  literally unthinkable — and this is the mark of a perfect duty: in the case of the
  false promise, it is logically impossible for everyone to promise with no intention
  of keeping the promise, because if everyone did that the institution of promising
  could not exist, and similarly the maxim of suicide from self-love destroys the
  very feeling of self-love that is supposed to shorten life. A maxim fails by contradiction
  in will, by contrast, when it can be conceived without contradiction but a rational
  will could not endorse it; this is the mark of an imperfect duty, and it is why
  Kant''s examples of neglecting one''s talents and of refusing to help others in
  need leave us with a duty of wide obligation — we must adopt some end of self-cultivation
  and some policy of aid, but we have latitude about how and when, and it is not wrong
  on a particular occasion to prefer our own projects.


  On the critic''s dilemma in part (b), I think we should simply accept the first
  horn. The formula of universal law really does ask what would happen under universal
  compliance; that is what the ''law of nature'' formulation is for. And this is not
  a problem for Kant, because in the cases he discusses the bad consequences are what
  make the maxim fail: universal promise-breaking would destroy credit, and universal
  indifference to others would leave people worse off. So Kant''s test is best understood
  as a form of rule-consequentialism restricted to single maxims. What distinguishes
  the two failure modes is just how bad the consequences are: perfect duties are violated
  when universal adoption would be catastrophic, imperfect duties when adoption would
  merely be worse than the alternative."


