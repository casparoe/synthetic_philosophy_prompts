  Draft exam question:


  "Exam question (Kant, Groundwork of the Metaphysics of Morals, Section II):

  (a) State the formula of universal law and explain the contrast Kant draws between
  a maxim that cannot be conceived as a universal law and a maxim that can be conceived
  but not willed as one. Which of the four examples illustrate which, and why?

  (b) A critic says: ''The universal-law test is either a disguised appeal to consequences
