  \ regret / \"the ass knows that after choosing it will know the other bale was equally\
  \ good, so no regret\" — versus a case where the tie is between incommensurable\
  \ options where post-choice you learn something.\n\nSubtle mistakes to plant in\
  \ the student's answer:\n1. Conflating \"no all-things-considered reason to prefer\"\
