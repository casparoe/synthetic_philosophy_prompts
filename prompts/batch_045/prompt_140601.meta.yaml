  \ follow.\n\nLet me now design the exam question and answer concretely.\n\nExam\
  \ question (written by me, presented as from a problem set):\n\n\"Q3. Buridan's\
  \ ass stands exactly between two bales of hay that are, as far as it can tell, identical\
  \ in every respect it cares about, and it must walk to one to survive.\n\n(a) Distinguish\
  \ the following three claims, and say which of them (if any) is what the example\
  \ is standardly used to show:\n (i) An agent who has no all-things-considered preference\
