  \ prompt is meaty.\n\nSetup: Buridan's ass: equidistant between two identical bales\
  \ of hay, dies of hunger because it has no reason to prefer either. Standard use:\
  \ a rational choice requires... no — the standard lesson is that rationality doesn't\
