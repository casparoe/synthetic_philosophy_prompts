  \ \"Ties-Commit-You-To-Nothing\" — hmm, better: invent a distinction like \"preferential\
  \ indifference vs. deliberative indifference\" or a thought experiment \"the Two-Keys\
  \ case.\"\n\nLet me design: exam question asks the student to evaluate a proposed\
