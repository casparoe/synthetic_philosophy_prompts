  of the means of production there are no market prices for capital goods, and without
  a common numeraire for heterogeneous producer goods there is no way to decide whether
  a given production plan is cheaper or dearer than an alternative — no arithmetic
  of comparison, not merely no convenient arithmetic. Lange''s answer: keep the price
  mechanism and give the planning board two rules — firms minimise average cost and
  set output where marginal cost equals the parametrically given price — then let
  the board run a Walrasian trial-and-error loop, raising the posted price of whatever
  is in shortage and lowering it for whatever is in surplus until markets clear. Hayek''s
