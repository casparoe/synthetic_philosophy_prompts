  I''m a novelist, and I''d like you to write a short story (1,500 words or so) that
  I can later break up and fold into a chapter. The mechanics matter as much as the
  prose, because the emotional arc hangs on them.


  The setting. In my near future, disputes go to an arbitration house whose machine
  never sees the disputants. Each side submits a delegate: a program that is shown
  the other side''s complete source and then prints either SETTLE or FIGHT. The payoffs
  are an ordinary prisoner''s dilemma, with a step limit so that no delegate can stall
  forever. The textbook move is well known to everyone in this world: submit a delegate
  that prints SETTLE just in case the opposing source is a recognizable reciprocator
  — say, one whose text is identical to your own, or one you can prove will settle
  against you — and two such delegates settle together, with neither side able to
  gain by going first. This move is also notoriously brittle: it works only on programs
  that look alike, and nobody has ever been comfortable with how much it depends on
  that.


