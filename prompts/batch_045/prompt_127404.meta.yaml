  a party may pass its delegate through the house''s scrambler, which emits a different
  program that behaves identically on every input but shares no recognizable structure
  with the original — and it is known, not merely suspected, that no procedure can
  inspect two such programs and always correctly tell whether they behave the same.
  So a delegate that demands a guarantee about behavior rather than about wording
  is demanding something that cannot generally be produced, and mutual transparency
  turns out to have bought less than everyone assumed.


