  precise theses the sentence could be expressing — I''d expect somewhere between
  six and eight — and for each: the thesis stated in a form you could actually argue
  about; whether it is a platitude, a substantive and defensible claim, or false;
  and what it would and would not licence in our decision. Please group them by the
  kind of claim they make (about the truth or mind-dependence of moral standards;
  about what was knowable or reasonable to believe then; about excuse, blameworthiness
  and alternatives available to the agent; about the point of commemoration; about
  counterfactuals concerning what we ourselves would have done).


  Two constraints I''d like each reading tested against.


  First, "his time" is doing unexamined work. Spell out, for each reading, what it
  takes "the standards of his time" to be: the prevailing opinion, the best opinion
  then available, what was knowable from his position, what he could realistically
  have done otherwise, or the opinion of the people his actions affected. To keep
  the answer from turning on contested history, stipulate for the sake of argument
  that each of the three was criticised by at least some contemporaries for the conduct
  we now object to, and each also did things we now admire.


  Second, the sentence seems to travel in only one direction: nobody says "he was
  a man of his time" to explain why Columbus sailed, or why Churchill refused to surrender.
  It is produced only for the parts we condemn. For each reading, say whether it can
  explain that asymmetry, or whether the asymmetry shows the reading is being used
  as a selective excuse rather than a general claim — and, if a reading fails that
  test, whether it fails merely as used or in itself.


  Finally: given what the sentence is being made to do in the room, which reading
  is my colleague most likely reaching for when she says it ends the matter, and does
  that reading actually end it? If it does not, tell me what question the panel should
  be asking instead. Please write in British English.


