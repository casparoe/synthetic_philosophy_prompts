  I sit on a small advisory panel to a civic museum that is re-writing the interpretation
  for a permanent gallery on trade, empire and exploration; Columbus, Jefferson and
  Churchill all appear in it. We have now had three sessions in which the same sentence
  has stopped the discussion dead: "he was a man of his time — you can''t judge him
  by the standards of today". What interests me is that it is being used by people
  on both sides. One member uses it to say that no verdict should be attached at all,
  and therefore that the celebratory framing should stay; another uses it to say that
  if his conduct was merely the output of his period, then he was not an exemplar,
  and the commemoration should go.


