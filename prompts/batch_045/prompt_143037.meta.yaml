  ---


  I''m a graduate TA in a first-year survey of modern moral philosophy, and I have
  one fifty-minute section to do justice to Adam Smith''s machinery of sympathy and
  the impartial spectator. The students will have read the material on sympathy and
  propriety in Part I of The Theory of Moral Sentiments and the later material in
  which the spectator is relocated inside the agent and becomes the measure of our
  judgments about ourselves. They have not read any Kant, and their only prior contact
  with Smith is the "invisible hand" and the claim that bakers and brewers serve us
  out of self-interest. I have the theory reasonably well in hand, so please don''t
  explain Smith to me: give me a plan for how to teach him, and keep the whole plan
  to 600 words or fewer — I would rather have a tight spine with reasons than a complete
  lesson script.


  What I want from you is the dependency structure. My provisional spine is this:
  start with sympathy as a mechanism, not a virtue — the claim that I come to feel
  something with you by imaginatively changing situations with you rather than by
  catching your emotion — then use the mismatch cases (the passion I cannot go along
  with) to get propriety out of sympathy rather than out of any rule, and only then
  move the spectator inside the agent and treat conscience as the verdict of that
  inner tribunal. In particular I want to know: at what point should I split the spectator''s
  two verdicts — whether the passion is proportionate to its cause, versus whether
  the passion is owed to its object (the propriety/merit distinction, roughly) — and
  where in the sequence belongs the move from "what people around me actually approve"
  to "what an impartial spectator would approve"?


  Two things I''ve been turning over and can''t settle. First, I''ve been toying with
  two readings of the inner spectator: the surrogate reading, on which he is simply
  my representation of the people who actually watch me and whose approval I need,
  and the fixed-point reading, on which he is where you land when you repeatedly correct
  for the partiality, ignorance and self-interest of actual spectators. I suspect
  the second is what makes the account moral rather than sociological, but I suspect
  too that starting there will make the students think I''ve smuggled in a Kantian
  universal agent. Should I build on one and demote the other to a footnote, and if
  so which and where? Second, I want to know whether to raise, or to pre-empt, the
  calibration worry: if the inner spectator is built out of internalised actual spectators,
  and those spectators are as partial as I am, where does the corrective get its grip?
  I can use it as the final diagnostic question, or I can defuse it in passing, and
  I can''t tell which is less destructive.


  Beyond that: I need one example to carry the whole fifty minutes, and I''d like
  you to say what it has to contain and what it must not. It has to let the students
  feel the difference between failing to enter into someone''s passion and judging
  that their passion is directed at the wrong person, and it has to leave room for
  the thought that the onlookers'' actual reaction is not the verdict. I take it that
  it should not be a case of death or bereavement, since that will make them hear
  "sympathy" as pity and miss that Smith''s notion covers any passion, and I take
  it that it must not have a clean answer available from a rule they already accept.
  What else must it have, and what must it avoid?


  The misconceptions I expect, roughly in the order I expect them: sympathy as compassion
  or altruism; the inner spectator as conscience internalised from social approval
  (the superego reading, which I think is the one that quietly destroys the whole
  account); "impartial" as meaning abstract or universal in the way a law is; and,
  at the end, the relativist objection that if the standard is what spectators approve,
  no whole society can be wrong. Tell me where each has to be headed off and, where
  possible, what has to be in place beforehand for the correction to take. Tell me
