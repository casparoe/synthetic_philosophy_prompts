  Subtleties a good answer should catch:

  1. "The public" for Kierkegaard is not identical with the readership of the press;
  the press is one of its organs/expressions. The public is a reflective, passionless
  abstraction whose defining trait is that it is not a gathering of people — it can
  be "the public" even when each member is alone, and even when no one is present
  (a public can exist without any actual individuals; the "monster" that no one belongs
  to). Kierkegaard distinguishes crowd, generation, public, and "the single individual,"
  and the public is not reducible to the sum of individuals or to their aggregate
  opinion.

  2. Kierkegaard''s claim is not that he withdrew from public discourse: he used the
  press strategically; "that single individual" (hiin Enkelte) is a category of address/responsibility,
  not a withdrawal program; he insisted on being a single individual addressing single
  individuals, and on signing his own name precisely to take responsibility (contrast
  with anonymous press, which is irresponsible because the anonymous author is nobody).
  Also, in the Corsair affair, he thought the press had to be confronted and that
  being mocked was itself a kind of religious trial/martyrdom — "if I am to be sacrificed..."
  Also he wrote "The Activity of a Traveling Esthetician" etc. Also his "My work as
  an author" and the "armed neutrality"? Also his point that the press makes possible
  "leveling" and that the way to defeat the abstract public is to address individuals,
  not to be silent. And he was himself ambivalent: he wrote that he needed the press
  to reach people, and later in "The Moment" he used pamphlets/press.

  3. Another dimension: Kierkegaard''s critique isn''t "the press is bad because it
  lies" (a complaint about bias) — it''s about the relation-forming character: the
  press creates a relation that is no relation — detachment, irresponsible observers;
  the "public" is the "phantom" that judges without acting. Also leveling needs an
  instrument: the press.

  4. Also: the presupposition "the only proper Christian response is withdrawal" —
  Kierkegaard''s category of "the single individual" and his criticism of "the crowd
  is untruth" don''t entail quietism; "the crowd is untruth" is about the mode of
  relating (the crowd is where no one is responsible), not about number per se, and
  not a recommendation of silence.


