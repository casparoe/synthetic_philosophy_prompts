  what I need is for the argumentative structure to be straightened out.


  Here is where I have got stuck. As I understand him: the press produces a "public",
  which is not a collection of persons but an abstract, detached, irresponsible entity
  to which individuals transfer their judgement and so shed their responsibility;
  leveling is the process by which this abstraction reduces the single individual
  to a numerical specimen; and the counter-category is "that single individual", to
  whom Kierkegaard addressed his upbuilding works. My question has two parts.


  First, a contemporary case I want to use as a framing device. Suppose a small polity
  in which every citizen now reads only a personalized, algorithmically compiled digest,
  so that no two citizens ever read the same sentence and no one ever knows what anyone
  else has read. A colleague says: no shared object, no shared organ, therefore no
  "public" in Kierkegaard''s sense — whatever else is wrong with that polity. I think
  this is wrong, but I cannot say precisely why, and the more I press on it the more
  it seems to me that Kierkegaard''s own remedy has the same defect.


  Second, that worry in general form. If the disease is the relation to an abstraction
  and the remedy is to write for "that single individual", then the remedy looks like
  a distribution strategy: address readers one at a time, severed from one another,
  each in his privacy. But a million isolated readers, each addressed alone, is just
  the disease under another name — a public with no press. And this makes Kierkegaard''s
