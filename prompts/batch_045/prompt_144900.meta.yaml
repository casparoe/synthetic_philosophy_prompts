  Context: They''re arguing about whether Good''s theorem shows that "you can never
  be worse off for knowing more" and whether that licenses a general epistemic norm
  of inquiry (always gather free information / never avoid evidence), i.e., objections
  to "willful ignorance" / "right to an open future".


  Move 1 (Clara): Good''s theorem shows that for a perfect expected-utility maximizer
  who will choose optimally after learning, any free experiment has non-negative expected
  value. So the standard advice to avoid information (e.g., not looking up spoilers,
  declining a genetic test) must be explained away as either cost of information,
  or as irrationality — there is no room for a distinctively epistemic reason to remain
  ignorant.


  Move 2 (Mansur): The theorem''s conclusion is conditional on the agent''s updating
  by conditionalization and then maximizing. That''s an idealization, and the interesting
  cases are precisely ones where it fails: the agent who takes a genetic test for
  an untreatable condition, then, knowing, can''t help but act in ways that make things
  worse (or depression reduces her ability to act well). Saying "she''d be fine if
  she were a perfect Bayesian" is no answer; for her, the information is genuinely
  bad.


