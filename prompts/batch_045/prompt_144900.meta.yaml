  she will mishandle the information, then that''s a known failure of instrumental
  rationality, and the theorem still governs what she should do — she should fix the
  mishandling, or decline the test because information is not really free for her
  (it carries a "handling cost"). Either way, no new principle about ignorance; the
  theorem plus a cost term covers it.


  Move 4 (Mansur): Not so fast — the cost term isn''t a cost at all in many such cases;
  it''s a fact about the agent''s psychology, and you can''t just stipulate it away.
  But more importantly there''s a class of cases where even a *perfect* Bayesian agent
  is worse off, which is where the theorem''s fixed-utility assumption does the work:
  some information changes what you care about, not just what you believe. Someone
  who learns, late in life, that his biological father was a man his mother was coerced
  by — suppose the learning transforms his values (call it "endogenous preference
  change"). Ex ante, in his current utility function, the information has positive
  expected value; ex post, by his new utility function, he''s worse off. Good''s theorem
  can only compare with a single utility function, so it is silent — and the "can''t
