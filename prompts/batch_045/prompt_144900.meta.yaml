  (1) Julian: Good''s theorem tells us that for an agent who updates by conditionalization
  and then maximizes expected utility, a costless observation has non-negative expected
  utility — computed, of course, ex ante, before the observation. So the folk claim
  that ignorance can be a blessing needs an explanation, and there are only two available:
  either the information isn''t really costless (it costs time, money, attention,
  or it forecloses later options), or the agent mishandles it. Neither gives us a
  norm of ignorance. What we get instead is a dilemma for anyone who declines free
  information: either you''re paying a cost you haven''t noticed, or you''re planning
  to be irrational later. Either way, there''s no such thing as a distinctively intellectual
  duty to remain ignorant — no analogue of "sometimes you should stop looking."


  (2) Marta: The dilemma is too quick, because its second horn isn''t a diagnosis,
  it''s a description of the human condition... [elaborate: the agent who knows she
  will mishandle]. Take the case the clinicians worry about: a genetic test for a
  late-onset condition with no available treatment and no preventive measure. The
  patient who tests positive does not thereby gain any option she lacked; she gains
  a piece of knowledge that reliably degrades her subsequent practical reasoning —
  she becomes depressed, she discounts her future less... hmm, better: "she becomes
  depressed and starts making worse financial and medical decisions." Say: for her
  the information is not free in any sense that a cost-benefit ledger written from
  the inside can represent: she is, as a matter of psychological fact, worse at getting
  what she wants after she looks. Telling her "a perfect Bayesian in your position
  would be fine" is like telling a man with a broken leg that a perfect walker would
