  Draft argument (asker''s):


  (1) The only facts that can ground a reason to save someone are facts about what
  that person loses if they aren''t saved. (Call it the "no reasons without a subject"
  premise — nothing can count in favor of an act unless some individual''s loss is
  at stake.)

  (2) If five die rather than one, each of the five loses just as much as the one
  loses — his life — and no one loses five lives. There''s no sixth subject who bears
  the aggregate.

  (3) So there is no reason to save the five rather than the one; the numbers don''t
  count. (This is Taurek''s conclusion, and I''m fine with it.)

  (4) Now consider Ada: she can either live one more year and then die, or live ten
  more years and then die. The "ten years" isn''t something any single subject enjoys
  at once. Ada-at-40 isn''t numerically identical, in any sense that survives a reductionist
  view of persons, to Ada-at-45; and even if she is, she never experiences the total.
  What she has is a series of experiences, each with its own momentary subject.

  (5) But by (1), the only facts that can ground a reason are facts about what an
  individual loses. By (4), no individual loses "ten years" rather than "one year";
  each momentary stage loses only what it loses.

  (6) So there is no reason, from Ada''s own standpoint, to give her ten years rather
  than one. Which is absurd — a doctor who could give her the ten and gave her the
  one would have injured her.

  (7) So (1) is false, and numbers count after all — including across people.


