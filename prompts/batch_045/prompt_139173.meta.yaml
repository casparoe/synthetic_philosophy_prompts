  Below are the eight candidate explanations we''ve collected, in my own wording and
  with my own labels:


  1. Rare Earth. Complex life, and intelligence especially, needs an unusual combination
  of circumstances; the Galaxy has at most one or two technological species, and we
  are one.

  2. Hard step behind us. One transition on the way to intelligence — abiogenesis,
  complex cells, something of that kind — is so improbable that it has effectively
  happened once, and intelligence itself is easy once you''re past it.

  3. Filter ahead of us. Technological species reliably destroy themselves, or are
  destroyed, within a short time of becoming detectable, so the Galaxy is full of
  ruins or of nothing.

  4. They stay home. Interstellar Travel is physically possible but never worth what
  it costs; civilizations grow inward, not outward, and no one fills the Galaxy.

  5. They went quiet. Civilizations that last do not stay loud: they move to low power,
  to small scales, to machine or virtual existence, and there is nothing for our instruments
