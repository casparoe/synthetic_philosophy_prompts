  Background: I''m a high school senior writing an extended essay on whether making
  images with a generator is a form of making, and I''ve painted seriously for about
  six years. My art teacher read my draft and said my argument "proves too much,"
  which I think is right but can''t locate. Here it is, cleaned up.


  (1) A person is the maker of a work only if the features that make the work good
  depend in the right way on that person''s own judgments — their sense of what looks
  right, what is finished, what the thing is trying to be.

  (2) "Depend in the right way" has to mean more than mere causation. It means: holding
  everything else fixed, if your judgment had been different, the relevant features
  would have been correspondingly different. Call this the counterfactual test.

  (3) With an image generator, there is no such dependence. The route from what I
  want to what I get runs through a process I don''t understand; tiny prompt changes
  give wildly different images; I cannot in general obtain a particular visual feature
  on demand; I get what I get and then decide whether to keep it.

  (4) So the valuable features of a generated image do not depend on my judgments
  in the required way.

  (5) So I am not the maker of the image. At most I commission or curate it.

  (6) But now take a painter with forty years behind her. She frequently cannot say
  why a stroke went where it did, cannot reproduce an effect when asked, and says
  the painting sometimes seems to decide for itself. Her judgments don''t map onto
  the features in the sense of (2) either.

  (7) So she is not the maker of her paintings. That''s false.

  (8) So (2) is the wrong test. What matters is instead: that you set the process
  going, that your judgment governs what you keep, revise, or discard, and that you''re
  prepared to answer for the result.

  (9) Prompting satisfies that: I choose the initial prompt, generate hundreds of
  candidates, reject nearly all, refine, and can usually articulate why I kept the
  one I kept.

  (10) So prompting is a way of making, and the images are mine.


  My teacher''s complaint is that (8) is far too permissive: on that test the museum
  curator who hangs a show, the person who flings paint at a wall and then points
  at the patch she likes, and maybe even someone who plays a slot machine and decides
  which "win" to photograph are all makers too. I agree, but I can''t see how to avoid
  (8) without falling back into (7).


  Things I care about keeping: premise (1) — that making something has to involve
  your judgment in some non-trivial way — and the denial of (7), that the experienced
  painter really is the maker of her paintings. I''d rather give up almost anything
  else.


