  \ is trustworthy\" — but then verdict 2 (tattoo + blue car) would be accepted...\
  \ unless she rejected it because the registry estimate is biased/noisy or because\
  \ of multiple-comparisons. Hmm, I need verdict 2 to be explained by both rules.\
  \ Let me make verdict 2: she rejects the tattoo/blue car class because the estimate\
  \ comes from a dataset where nobody pre-specified that subgroup — i.e., it was data-mined\
