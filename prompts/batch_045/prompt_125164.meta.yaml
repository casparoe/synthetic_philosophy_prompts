reasoning_summary: "Let me pick a domain. Options: Putnam's views on religion; judgment\
  \ aggregation and the discursive dilemma; source criticism / distant past; Confucian\
  \ role ethics; reference class problem.\n\nThe type: \"Ask a question that rests\
  \ on a subtle confusion or false presupposition\" or role-play or verdict prediction.\n\
  \nHmm, I need to pick one type. Let me consider which combines best. The \"verdict\
  \ prediction\" type works nicely with the reference class problem: a professor's\
  \ verdicts on reference class cases. Actually the reference class problem is a great\
  \ fit: someone (a \"my statistics professor turned risk analyst friend\") gives\
  \ verdicts about which reference class to use in various cases — and the new case\
  \ is something where multiple rules diverge. Also I could inject a niche idea (e.g.,\
  \ a novel case involving an \"AI system trained on distribution X\" or a \"reference\
  \ class of people who bought a particular insurance policy conditional on...\").\n\
  \nAlternatively, \"subtle confusion\" type with judgment aggregation/discursive\
  \ dilemma: e.g., \"I read that the discursive dilemma shows that majority voting\
  \ on premises vs conclusions gives different results, so the solution is to always\
  \ vote on conclusions — right?\" That's a nice false presupposition: the doctrinally\
  \ standard view is that premise-based vs conclusion-based procedures both have problems,\
  \ and List & Pettit's impossibility result shows no aggregation procedure satisfying\
  \ certain conditions; also the confusion that the dilemma is a paradox of voting\
  \ rather than a general impossibility, or that it requires logical inconsistency\
  \ of the collective judgment set. Also a common misreading: \"the discursive dilemma\
  \ shows that group deliberation is irrational\" or \"it only arises with an odd\
  \ number of voters and majority rule.\"\n\nBut I think the reference class problem\
  \ + verdict prediction is a nice in-the-weeds fit. However, the \"verdict prediction\"\
  \ type requires constructing earlier verdicts consistent with more than one rule\
  \ and a new case where rules diverge. That's doable and very much \"in the weeds.\"\
  \n\nHmm, but the requirement: \"you'll often have to inject some sort of new / niche\
  \ ideas into the prompt\" — new cases work well for that.\n\nLet me think about\
  \ which domain I know well enough. Reference class problem: I know it well (Hájek,\
  \ Venn, Reichenbach, frequency interpretations, the \"problem of the single case\"\
  , reference class choice; the standard example: probability that John Smith, a 40-year-old\
  \ Englishman, will live to 61 — reference class of Englishmen vs 40-year-old Englishmen\
  \ vs those with tuberculosis etc.). Also medical decisions, actuarial. And Hájek's\
  \ \"the reference class problem is your problem too\" extends it to frequentism\
  \ and other interpretations.\n\nI could build the verdict set around a friend who\
  \ is a \"statistician/actuary turned epidemiologist\" who gives verdicts on which\
  \ reference class to use for single-case probabilities. Rules that fit: (a) use\
  \ the narrowest class with sufficient data (specificity/narrowness rule); (b) use\
  \ the class defined by the causal/mechanistic factors (causal relevance — Reichenbach's\
  \ \"smallest class with reliable statistics\"? Actually Reichenbach: the smallest\
  \ reference class for which reliable statistics can be obtained — that's the narrowest-with-enough-data\
  \ rule); (c) use the class defined by the evidence you actually have (epistemic:\
  \ the most specific class you know the frequency for); (d) objective chance / propensity:\
  \ the class defined by causally relevant properties, i.e., the \"objectively homogeneous\"\
  \ class.\n\nNew case where they diverge: a case where the narrowest class with enough\
  \ data is gerrymandered (e.g., \"people who own a parrot and were born on a Tuesday\"\
  \ — arbitrary), or a case where the causally homogeneous class has tiny data, or\
  \ a case where the narrowest well-populated class is defined by a factor that is\
  \ an effect rather than a cause (e.g., class of people who have already had a heart\
  \ attack — to judge risk of a heart attack? no), or a case where the individual\
  \ is a member of a class defined by a downstream/consequence property (Berkson-type\
  \ selection; e.g., class of people already hospitalized).\n\nAlso inject a niche/new\
  \ idea: e.g., a machine learning model's prediction — the individual is \"an AI\
  \ instance\" — hmm, maybe better: the new case involves a \"digital twin\" or a\
  \ \"patient whose genome-sequenced subgroup has n=12\" or \"a person selected by\
  \ an algorithm because the algorithm predicted high risk\" (selection on the predicted\
  \ outcome — the reference class \"people flagged as high risk\" is defined downstream).\
  \ Actually a nice one: the reference class problem for an individual who was selected\
  \ into the data precisely because of the outcome — e.g., \"people who appear in\
  \ the dataset of recidivism because they were sentenced.\"\n\nLet me design:\n\n\
  Person: my friend Dana, who works in \"clinical prediction / evidence-based medicine\"\
  \ — she has strong opinions about which reference class to use when someone asks\
  \ \"what's the probability this patient has X?\"\n\nVerdicts:\n1. For a 55-year-old\
  \ man with chest pain, she uses the class of \"patients presenting to a clinic with\
  \ chest pain\" rather than \"all men\" — narrow.\n2. When someone proposes the class\
  \ of \"55-year-old men with chest pain who also have a tattoo and drive a blue car\"\
  , she rejects it — too gerrymandered/arbitrary even though data exist from a big\
  \ registry. So not simply narrowest-with-data.\n3. When there's a well-conducted\
  \ trial on a causally defined subgroup (e.g., people with a specific genetic variant),\
  \ she uses that subgroup even though n is small (~40), rather than lumping with\
  \ the broader population. So she'll go narrow when it's causally motivated.\n4.\
  \ When the only data for the causally relevant subgroup is tiny (n=3), she goes\
  \ back to broader class. So there's a threshold tradeoff — you don't know if it's\
  \ a hard threshold or a bias-variance judgment.\n5. She refuses to use \"people\
  \ who were referred to a specialist\" because referral is downstream of suspicion\
  \ (selection effect) — she wants classes defined by causes, not effects/symptoms\
  \ that reflect selection.\n6. She uses \"patients tested with the old assay\" versus\
  \ new assay? Hmm, maybe too much.\n7. She rejects \"people who survived to be in\
  \ the follow-up study\" (survivorship).\n\nHmm, one more dimension: does she care\
  \ about the class being one that a frequency is known for, or about objective chance?\
  \ E.g., verdict: when told that a coin is biased but unknown amount, she says the\
  \ probability of heads is .5 — hmm that's a different issue (chance vs epistemic).\
  \ Maybe: \"she says there's no such thing as the probability for the single case,\
  \ only frequencies relative to a class; but when pressed she says she's happy to\
  \ talk about 'the patient's chance'.\" Maybe too much.\n\nNew case: I want at least\
  \ two rules that fit all verdicts to diverge.\n\nRule A: \"causal homogeneity +\
  \ data threshold\" (use the most specific class whose defining properties are causally\
  \ relevant to the outcome AND for which you have enough data; arbitrary/incidental\
  \ properties never count).\nRule B: \"the narrowest class for which a reliable statistic\
  \ can be obtained, where 'reliable' means estimated from a study you trust methodologically\
