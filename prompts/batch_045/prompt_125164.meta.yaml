  \ B (trustworthy-estimate narrowness) also rejects it. Good: both rules fit.\n\n\
  So Rule A: causally relevant properties only, subject to data threshold.\nRule B:\
  \ narrowest class with a methodologically trustworthy estimate (pre-specified, adequately\
  \ powered), regardless of whether the extra properties look causally relevant —\
  \ if the subgroup was pre-specified and the data are good, narrowing is fine and\
  \ strictly better.\n\nHmm, but verdict 5 (reject \"referred to specialist\" because\
  \ downstream/selection) — Rule B can explain: referral is a collider, the estimate\
