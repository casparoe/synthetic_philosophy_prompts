  built around. I''ll sketch it roughly: call it ampliative self-creation (ASC). Grant
  Strawson that no act can be uncaused by prior character and that no agent can be
  causa sui. Still, an agent''s acts can reorganize her own subsequent character —
  by reducing akratic conflict, by installing second-order policies, by making her
  motives more transparent and more unified — so that later acts express her to a
