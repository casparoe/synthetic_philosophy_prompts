  The Basic Argument (as commonly presented):

  P1: You do what you do — in the circumstances in which you find yourself — because
  of the way you are (character, nature, dispositions).

  P2: So to be truly morally responsible for what you do, you must be truly responsible
  for the way you are — at least in certain crucial mental respects.

  P3: But you cannot be truly responsible for the way you are, because to be so you''d
  have to have brought it about, which requires that you already were some way (a
  prior nature in light of which you chose), leading to infinite regress; you''d have
  to be causa sui.

  C: No one is truly morally responsible; and since moral responsibility in the "basic
  desert" sense is required for genuine desert of praise/blame/punishment, no one
  truly deserves anything.


  Strawson emphasizes "true" or "ultimate" moral responsibility, and that the argument
  applies no matter whether determinism is true (it''s an argument that works either
  way — "the Impossibility of Moral Responsibility"). He also holds that most people
  ("the majority"?) implicitly believe in MR but... He also says the argument doesn''t
  depend on determinism; indeterminism doesn''t help because random/indeterministic
  events aren''t something you''re responsible for.


  Also Strawson distinguishes "true/basic desert" from consequentialist/forward-looking
  justifications of punishment and blame, and holds that ordinary practices can survive
  via non-desert-based rationales.


