  I''m a high school senior doing an independent reading project on theories of well-being,
  and my teacher has me trying out a view she calls tranquilism — the claim that,
  as far as a person''s welfare goes, only two things matter: the absence of craving
  and the absence of suffering. Everything we normally count as positive welfare —
  pleasure, achievement, love, knowledge — matters only indirectly, if at all. I want
  to test the view on someone who never had to think about the modern version of it,
  so: how would Arthur Schopenhauer, writing as he did in the first half of the nineteenth
  century, have reacted to the following?


  By the 2040s (suppose) there are two safe, cheap, reversible biomedical interventions
  for wanting. The Source-cutter lowers the intensity of desire itself: people on
  it still act, but they no longer hunger, strive, worry, or fall passionately in
  love; they simply do the next reasonable thing. The Sting-cutter leaves desire exactly
  as strong as it was but removes the unpleasantness of its not being satisfied —
  people still want things acutely and still enjoy getting them, but frustration,
  longing and anxiety no longer hurt. A third option, much discussed, is the Second-order
  version: you keep both the desire and its sting, but you stop being bothered by
  having them, in the way a person can be perfectly aware of an itch and not care
  about it. And suppose a government puts one of these in the water supply... no,
  too much? Let''s say: funds it for anyone who wants it and evaluates the programme
  using a national well-being index that tracks only two variables: average intensity
  of craving and average intensity of suffering.


  What I can''t work out is which way Schopenhauer would jump. On the one hand his
  own position sounds nearly tranquilist: happiness is only ever negative, satisfaction
  is just the removal of a want and is instantly replaced by boredom, and life swings
  between suffering and boredom — so a population with no cravings sounds like exactly
  what he wanted. On the other hand, three things pull the other way and I''d like
  you to weigh them: (1) he holds the will to be the thing-in-itself, outside space,
  time and causality, so I suspect he''d say no molecule can touch it and that these
  interventions only alter how the will appears in a given person''s experience —
  is that right, and does it make them worthless or merely incomplete? (2) boredom
  is itself a form of suffering for him, so does the Source-cutter risk creating the
  very condition he thought unavoidable, and would he then rank it below the Sting-cutter
  or the Second-order version? (3) he treated aesthetic experience and compassion
  as the only genuine escapes from the will, and both seem to require strong desire
