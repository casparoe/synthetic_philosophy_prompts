  Memo draft (mostly right, in competent popularizer voice, with subtle errors):


  "Tolstoy''s book What Is Art? proposes a single, sharply deflationary test. Art,
  he says, is not beauty and it is not self-expression: it is a human activity in
  which a person who has experienced a feeling deliberately transmits it to others
  by means of external signs — words, sounds, colors, shapes — and succeeds in making
  them feel the same feeling. Call that success infection. If a work infects, it is
  art, and it is good art; if it doesn''t, it is not art at all, however much beauty
  or craft it displays. Because infection is the whole test, art has to be immediately
  intelligible: whatever requires specialized training, a program note, or an education
  to appreciate is by that very fact counterfeit, since a plain person cannot catch
  a feeling from it. This is why Tolstoy consigned most of the high art of his own
  day — the operas, the symbolist poetry, and, notoriously, Shakespeare and a great
  deal of his own fiction — to the counterfeit bin: it is imitation, or strikingness,
  or cleverness, work made by professionals for a trained audience rather than by
  someone with a feeling to convey. Good art is also moral art, though this is not
  an additional test; it is just that the feelings worth transmitting are the ones
  Christianity teaches. And since infection requires a person who has had a feeling
  and means to pass it on, the generating system cannot be an artist: a machine has
  no feeling and no intention, so an algorithmically generated ambient piece is at
  best an imitation of art, and we would be using public money to fund a counterfeit."


