  Draft:


  "Hi — I write a column on science and ideas and I''m about to write a piece on how
  you''d build a science of consciousness, and I''ve realized my own position is a
  pile of things I''ve picked up from hanging around labs rather than anything coherent.
  Someone (a philosopher friend) asked me to write down my methodological profile
  so they can poke at it. Here goes:


  (1) First-person report is the only evidence that can settle whether a subject was
  conscious of something — if they can''t report it, no experiment, however fancy,
  shows they experienced it.

  (2) But I also think the demand for report ruins the measurement: asking someone
  to report changes what they experience and what shows up in the data, which is why
  I''m sympathetic to the no-report paradigms people keep arguing about, and I think
  the field should be moving toward report-free measures.

  (3) I like that the heterophenomenology method is advertised as metaphysically neutral
  — it brackets whether the experiences it attributes are really there, so both a
  realist about qualia and someone who thinks there''s nothing extra can use it.

  (4) I also think that once you''ve adopted it the hard problem basically evaporates:
  fix all the dispositions to report in all circumstances and there''s nothing left
  to ask.

  (5) I think the covert awareness findings — patients who look entirely unresponsive
  but seem to follow commands with their brain activity — really do establish that
  some of them are conscious, i.e. a fact about what it''s like for them, arrived
  at without anything that looks like a report.

  (6) And I like that the method takes subjects at face value rather than overruling
  them about their own experience; that''s most of why I prefer it to the harder-nosed
  stuff.

  (7) Last one: I want to try running the method on a language model''s first-person
  outputs for the piece. I think that''s a legitimate application and that what you
  get is a fiction, which I take to be what you always get.


