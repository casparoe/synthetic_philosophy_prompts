  Let me think about the content: heterophenomenology (Dennett''s method, from "The
  Heterophenomenology" / Consciousness Explained). Key commitments a science journalist
  might hold:


  1. Reports of subjective experience ("what it''s like" verbal reports) are the only
  legitimate data; there are no facts beyond what subjects say — heterophenomenology
  treats first-person reports as texts to be interpreted, not authoritative.

  2. But: reports are fallible, subjects can be wrong about their own experience (change
  blindness, confabulation, blindsight denial, choice blindness, dennett''s "fame
  in the brain"?).

  3. Also: consciousness science should be "third-person," no privileged access, so
  no "hard problem" data.

  4. Tension: if you hold that reports are data (not evidence about something else),
  and also that reports can be mistaken... Hmm, that''s a classic tension: heterophenomenology
  is often criticized for either being behaviorism/eliminativism (reports are just
  noise to be explained away) or for being able to accommodate the reality of experience.
  Actually a genuine tension: (a) heterophenomenology is supposed to be neutral —
  it brackets the question of whether the reports are true, so it''s compatible with
  both realism about qualia and eliminativism; (b) but many hold that it''s only useful
  if it''s not neutral — it earns its keep by deflating the hard problem. Also (c)
  the method requires interpreting reports as sincere/charitable — you take the subject
  at their word — yet you also hold (d) subjects are frequently wrong/confabulating,
  and Dennett''s own practice involves explaining away reports (e.g., " filling in,"
  the "Cartesian theater"). The tension: the principle of charity (take reports at
  face value in constructing the heterophenomenological world) vs. the commitment
  that reports are unreliable and that the heterophenomenological "world" is a fiction.


  Another nice tension: (e) hold that verbal report is the gold standard in consciousness
  science (that''s how we measure awareness in binocular rivalry, masking, global
  workspace studies / no-report paradigms) — but also hold that report itself can
  change the phenomenon (report confounds, no-report paradigms show that requiring
  report alters neural correlates, e.g., Tsuchiya/Block''s no-report paradigm debates).
  That''s a genuine in-the-weeds tension: the whole empirical field rests on reports,
  yet the method of report is suspected to alter/contaminate the very thing measured.
  And it pairs with the heterophenomenological commitment that reports are data.


  Another commitment: (f) Dennett-style: no facts about consciousness beyond what
  heterophenomenology can in principle settle; if a subject''s report can''t be settled
  by any third-person evidence, there''s no fact. (g) But hold that "what it''s like"
  claims about non-human animals or patients in disorders of consciousness (unresponsive
  wakefulness syndrome, the covert awareness findings with fMRI/EEG in Owen''s 2006-ish
  studies, and the "willful modulation" tasks) — hold that these are genuinely factual
  and important even where no verbal report is available. Tension with (f): covert
  awareness via neuroimaging is a "quasi-report" that is not verbal report — is that
  compatible with heterophenomenology? Dennett might say yes (neural data is third-person
  data) but the "what it''s like" claim... Actually it''s a genuine tension: if you
  think whether a patient is conscious is settled by whether they can follow commands
  via brain activity, you''re treating an弗兰imagistic report surrogate as authoritative,
  which seems to grant that there''s a fact of the matter about experience not constituted
  by verbal reports. Hmm — actually a nice tension: heterophenomenology says we take
  the subject''s reports as authoritative for their heterophenomenological world;
  in the disorder-of-consciousness case you''re not taking reports at all, you''re
