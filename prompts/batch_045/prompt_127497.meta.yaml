reasoning_summary: "Domain choice: heritability — what it does and does not mean.\
  \ Type: question + student answer, ask model to grade.\n\nI know this domain well.\
  \ I should write an exam question and a student answer with subtle mistakes. Let\
  \ me design.\n\nDomain: heritability. Key concepts:\n- h² = V_A/V_P (narrow-sense\
  \ heritability: additive genetic variance / phenotypic variance) within a defined\
  \ population in a defined environment.\n- Broad-sense H² = V_G/V_P.\n- Heritability\
  \ is a population statistic, not about individuals; doesn't measure \"how genetic\"\
  \ a trait is in the sense of immutability.\n- A trait can have high heritability\
  \ and still respond to environmental intervention (PKU, height, myopia).\n- Heritability\
  \ is not a measure of the contribution of genes to an individual's trait (the \"\
  heritability of a trait is not the heritability of a trait difference in an individual\"\
  ).\n- Heritability says nothing about between-group differences: high within-group\
  \ heritability does not imply between-group differences are genetic (classic: two\
  \ bags of seed, one in good soil, one in poor soil — height differences within each\
  \ bag entirely genetic, mean difference between bags entirely environmental).\n\
  - Heritability estimates assume no genotype-environment correlation and no GxE interaction,\
  \ or more precisely they partition variance within a given range of environments\
  \ and the estimate is conditional on the range of environments.\n- Missing heritability\
  \ / GWAS: heritability from twin studies vs SNP heritability.\n- Heritability of\
  \ a trait is not fixed; it can change if environment changes (if environment becomes\
  \ more uniform, heritability goes up).\n- The heritability of IQ rises with age\
  \ (Wilson effect) — hmm, that's a specific empirical fact but well-known. Could\
  \ mention but need care. Actually maybe better to invent a niche concept to avoid\
  \ relying on facts.\n- Shared environment: ADE/ADE model: A (additive genetics),\
  \ D (dominance), C (shared/common environment), E (non-shared environment).\n- Equal\
  \ environments assumption (EEA) of twin studies.\n- Assortative mating inflates\
  \ DZ correlation and if uncorrected leads to underestimating heritability... actually\
  \ assortative mating increases DZ similarity more than MZ, so ignoring it deflates\
  \ A? Let me think: heritability estimates from twin studies: h² = 2(r_MZ − r_DZ).\
  \ Assortative mating raises DZ correlation (DZ siblings share more than 50% of segregating\
  \ genes under assortative mating — actually for a trait under assortative mating,\
  \ DZ cotwins correlate more than 0.5 genetically). So r_DZ inflated → h² underestimated.\
  \ Yes: ignoring assortative mating leads to underestimating heritability (since\
  \ DZ pairs are more genetically similar than the 50% assumed). That's a nice subtle\
  \ point.\n- Falconer's formula: h² = 2(r_MZ − r_DZ); shared environment c² = 2r_DZ\
  \ − r_MZ. And an error: some students compute c² = r_MZ − h² or state that heritability\
  \ is the MZ correlation.\n- Also: heritability is defined for a trait in a population,\
  \ and it's a ratio of variances — variance of what? Of the trait values; requires\
  \ that variance be non-zero.\n- Key subtle mistake candidates:\n  1. Conflating\
  \ narrow-sense (additive) with broad-sense heritability — e.g., saying heritability\
  \ is V_G/V_P then using it to predict response to selection (breeder's equation\
  \ R = h²S requires narrow-sense).\n  2. Claiming that heritability of 0.8 for a\
  \ trait means 80% of an individual's trait is due to genes.\n  3. Claiming high\
  \ heritability within groups implies between-group differences are genetic.\n  4.\
  \ Saying that if heritability is high then environmental intervention can't work.\n\
  \  5. Confusing \"genetic\" with \"unchangeable\"/\"inevitable\" or \"heritable\"\
  \ with \"inherited from parents\" (in the ordinary sense).\n  6. Saying heritability\
  \ is a fixed property of a trait across populations/environments.\n  7. Mis-stating\
  \ the breeder's equation or the \"missing heritability\" gap.\n  8. Confusing heritability\
  \ with genetic determination/concordance.\n\nI want to inject a niche/novel idea\
  \ to make it non-regurgitable. Idea: introduce a fictional-but-coherent construct:\
  \ \"conditional heritability\" or a made-up new measure, e.g., a proposed statistic\
  \ they call \"intervention elasticity\" or a hypothetical \"the Environmental Equalization\
  \ Index\". Or: define a new index \"heritability of the trait's variance under an\
  \ environmental equalization\" — I can invent something like \"the 'equalized-environment\
  \ heritability' h²_eq\" and ask about it. Actually a good niche idea: a made-up\
  \ metric \"G-load\"? No, that exists.\n\nBetter: invent a scenario: a fictional\
  \ scenario about a fish farming / a plant-breeding setup, with concrete numbers.\
  \ Use the classic two-field seed corn example but make it specific and new: e.g.,\
  \ an aquaculture company raising salmon in two farms... Hmm.\n\nLet me craft: The\
  \ exam question has three parts:\n(a) Explain what it means to say h² = 0.6 for\
  \ a trait.\n(b) A scenario: two populations of a species raised in different environments,\
  \ with within-population heritability high and a mean difference; does high within-population\
