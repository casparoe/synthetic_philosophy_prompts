  their evidence, their conversational setting. Two speakers who''ve got the same
  information about S and who say opposite things are thereby disagreeing, not each
  saying something true-for-themselves. Call the denial of this ''ascriber-sensitivity''.
  By ''epistemic dominance'' I mean the fallback move people reach for when they want
  to keep universality: among all the perspectives in play (ascriber''s, subject''s,
  later assessor''s, the group''s total evidence) exactly one is privileged and its
  standards are the ones that fix the truth value; the others don''t get a vote. My
  half-baked worry is that dominance is doing more work than anyone admits, because
  (a) in nested cases — A says ''B knows that p'', and later C, from a totally different
  context, says ''what A said was wrong'' — it''s not obvious whether the privileged
  perspective is picked once for the whole embedding or freshly at each level, and
  (b) when perspectives differ in dimensions that don''t rank against each other (A
  has stakes, B has evidence, C has neither but is the assessor) there just may be
  no dominant one. I''ve been toying with a weaker version, call it weak dominance:
  instead of one privileged perspective, take the set of perspectives that are ''not
  dominated by any other'' and let the ascription be correct iff it''s correct by
  all of their standards — which buys you universality back, but seems to make a lot
  of ascriptions neither true nor false...


