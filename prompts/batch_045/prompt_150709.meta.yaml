  Core setup (self-contained, in my own words):


  Thesis of "ascription universality" (AU): when I say "S knows that p", the truth
  of my ascription does not depend on my (the ascriber''s) epistemic situation/standards
  — knowledge ascriptions aren''t relative to the ascriber''s context; they track
  something about S alone (plus maybe facts about the world). Equivalently: any two
  people who ascribe/deny knowledge to the same S at the same time, with the same
  information about S, must be disagreeing, not merely talking past each other — there''s
  a single correctness standard.


  "Epistemic dominance" (ED): the idea that when perspectives conflict, one of them
  governs: the standards that fix the truth of the ascription are those of whichever
  perspective epistemically dominates — e.g., the perspective with more evidence /
  the subject''s own perspective / the ascriber''s perspective. So one can combine
  AU with a dominance ordering: the ascription is universal but its standards are
  set by the dominant perspective (which might be a function of the total evidence
  available in the conversation, or of the subject''s stakes).


