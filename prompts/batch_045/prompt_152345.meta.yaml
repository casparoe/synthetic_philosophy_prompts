  universe is indifferent, in a hundred years none of this will have left a trace
  — and at the very same time is gripped by some local thing in a way that has nothing
  to do with enjoyment and isn''t presented as a choice. They don''t say "I''ve decided
  this matters." They say it matters, full stop, and they''d be a bit insulted if
  you called it a hobby or a coping strategy.


  Three cases, because I''m not sure they''re the same thing:


  1. A PhD student of mine told me over a coffee that the whole field is churn and
  nobody will read any of it, said it calmly, not depressed, and then went straight
  back to a paper she''s been grinding on for two years. She isn''t under any illusion
  that it''s important. But she also can''t just stop — stopping would be, in her
  words, "a thing that happened to me" rather than a decision. She resisted when I
  tried to argue her out of the cosmic bit; she doesn''t think the two levels touch.


  2. A neighbour retired and now spends most of his week on a volunteer project restoring
  a stretch of canal. He says outright that it''s pointless — the funders will pull
  out, it''ll silt up again. And it''s the part of his week he talks about with the
  most energy. He''s not enjoying most of it: it''s cold, it''s muddy, the other volunteers
  annoy him.


  3. A friend who lost her religion years ago still goes to the services, still does
  the whole yearly round, and is cheerfully clear that she believes none of it. She
  doesn''t describe it as meaning anything. She describes it as where she belongs.
  But when the parish was closed for repairs for eight months, she said that stretch
  of time felt "weightless," which is the word she uses for the years before she had
  kids too.


  What I keep noticing is that these people aren''t doing the thing the pop-philosophy
  version says they should do. They haven''t chosen a project and decided to make
  it theirs. The pull was already there (case 3), or arrived and then stopped being
  optional (cases 1 and 2), and if you asked them what would happen if they picked
  something else instead, they''d say that''s not how it works — you can''t swap it
  out at will. And they''d deny the thing has any value that would survive their not
  caring about it. So it isn''t "I made my own meaning," which sounds like an act
  of will, and it isn''t "this is genuinely valuable," which they explicitly deny,
  and it isn''t "I like doing it," because they mostly don''t, and lots of what they
  enjoy they''d call trivial.


  My colleague in value theory says meaning is a matter of being gripped by something
  that''s independently worth being gripped by, and that sounds like it can''t handle
  these cases at all — the grip is there and the worth is denied. But the alternative
  that keeps coming up in conversation is that these people are just describing attachments
  or habits or identity, in inflated language, and that the word "meaning" is doing
