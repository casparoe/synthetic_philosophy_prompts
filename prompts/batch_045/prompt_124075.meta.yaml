  I''m the operations manager of a supported-living provider: eight group homes, about
  forty adult residents, most of whom have an intellectual disability and many of
  whom also carry psychiatric diagnoses — schizoaffective disorder, emotionally unstable
  ("borderline") personality disorder, alcohol-related brain damage, and, increasingly,
  residents ageing into early dementia. Our staff are support workers with three weeks
  of classroom training and a two-day annual refresher; none of them have any philosophy.
  Incidents — a punch during a personal-care prompt, a stolen wallet, sexual touching
  of a co-resident, a violent episode during a psychotic relapse — happen somewhere
  in the service a few times a week, and after each one a shift lead fills in a form
  and, with the clinical lead signing off, decides what happens next: a mediation,
  a behaviour plan, a police referral, a change of placement, nothing.


  ... Then: the current framework is positive behaviour support / ABC charts — everything
  as behaviour with antecedents and consequences. Two failure modes: staff who get
  disciplined for showing they were hurt/angry (told it''s unprofessional), and residents/families
  who say they''re written off, treated like weather or like a dog. So I read about
  Strawson...


  Then: what I want — a written procedure. Constraints: run at debrief within 20 minutes
  by a shift lead with no theory; one page; questions in order; what counts as a sufficient
  answer; where it stops with a "no"; where it hands to a person.


  Then: things I want it to handle — (1) the distinction between excusing and exempting
  (he didn''t mean to/he was coerced vs. he isn''t the sort of thing you address at
  all); (2) partial/temporary vs. total/standing; (3) the positive side (gratitude,
  appreciation, restored trust) — we only ever deal with the negative; (4) the feedback
  loop: our history of taking the objective stance with a resident plausibly reduces
  their capacities, so the file itself is part of the cause — I want the procedure
  to say what to do with that, since it seems to make the "is he an agent now?" question
  unstable; (5) resentment vs. punitiveness/cruelty.


  Then: three cases + one unwelcome answer + what it can''t do + "don''t depend on
  settling free will."


