  Pain asymbolia: condition (following Schilder and Stengel) where patients report
  pain without the unpleasantness/distress — they can feel the pain''s sensory-discriminative
  features but aren''t bothered by it. Used in philosophy of pain: the "asymbolia"
  case is used to argue against the identification of pain with its unpleasantness,
  and in discussions of whether pain''s badness is intrinsic or whether painfulness
  = motivational/affective dimension. Also often used in discussions about whether
  pain is essentially motivating (the "motivational theory" — pain essentially motivating),
  and in the debate about whether pain''s badness is a reason for action, e.g., in
  arguments about the "evil of pain."


  A subtle confusion: someone might think pain asymbolia shows that pain isn''t bad
  (intrinsically), so it''s a counterexample to the idea that pain''s badness is intrinsic
  — but many philosophers think asymbolia patients still report the pain as unpleasant...
  Actually the real literature: asymbolia is used in arguments about whether pain
  is essentially unpleasant (Hall), or the "dispositional theory" vs. "evaluative
  theory" of pain. Also, in the "badness of pain" debate, the "experience machine"-style
  or the "pain asymbolia" argument is sometimes used in the debate over whether suffering
  is intrinsically bad or bad because of its effects.


  Also, a nice confusion: someone might say "since asymbolia patients still feel pain
  but aren''t bothered, the badness of pain is just the desire that it stop — so if
  you just stop wanting it to stop (CBT, mindfulness, acceptance), or take a drug,
