  I am the principal policy adviser to a statutory commission on cultural and religious
  pluralism. Two or three times a month we receive a submission from a minority community
  asking us to recommend that the law accommodate one of its practices — language
  schooling, customary family law, religious arbitration, communal land tenure, ritual
