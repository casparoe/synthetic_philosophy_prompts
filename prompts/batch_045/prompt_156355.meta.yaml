  charter of individual rights and a set of anti-discrimination statutes, which means
  every submission is restated, before it reaches the commissioners, as a claim about
  individuals: what a person may do, or what burden a person must not suffer. I have
  become convinced that this restatement is not a neutral transcription, and I want
  to know whether the thing I am seeing has been described and named.


  Two recent submissions made it plain.


  A linguistic minority asked for public funding for its own-language schools and
  for legal recognition of its own marriage customs. Its stated reason was about the
  survival of the people: if the next generation is educated in the majority language,
  there will be no one left to be a member of this people in two generations, and
  that disappearance is itself the harm to be prevented. By the time the paper reached
  the commissioners, the claim was "members of the minority have a right to education
  in their own language." Nothing in that sentence carries the interest in survival,
  and some of it is in tension with it: a right belongs to a person and may be waived,
  exit must remain open, and the number of people who exercise it is irrelevant to
  whether the right exists.


  A religious community asked that its internal dispute resolution be given legal
  effect. Its reason was that adjudication is partly constitutive of the community:
  a community that brings its disputes to the state''s courts has, in its own terms,
  already stopped being the community it is. Translated, the claim became "individual
  members have a right to access religious arbitration." The predictable objection
  — what of the member who would rather go to the state courts, or who is under family
  pressure — then bites, and the community cannot answer it, because the option of
  exit for each individual is exactly what threatens the practice it is asking us
  to protect.


  The pattern I keep seeing has several parts. Claims whose content was already individualistic
  (a person wants to wear a particular garment, wants a dietary accommodation) pass
  through almost unchanged. Claims about the survival of a form of life come out the
  other side as claims about individual options, losing what the claimants said mattered.
  The claimants and their representatives learn this, and after a few years the survival
  reason stops appearing in our records altogether; a later commission reading those
  records would conclude that these communities never had such an interest. And in
  at least one case the restatement struck me as an improvement rather than a loss:
  the original submission bundled in a demand that the community be able to sanction
  members who marry outside it, and the rights frame correctly stripped that out —
  but it stripped out the non-coercive part of the same claim along with it.


  I have tried the obvious labels and they do not fit. "Hermeneutical injustice" seems
