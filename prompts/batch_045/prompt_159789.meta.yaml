  Draft:


  ---


  I am a retired physical chemist — forty years, most of them spent on critical phenomena
  and phase behaviour in fluids and liquid crystals — and in retirement I have been
  reading philosophy of science properly for the first time. I find that I have accumulated
  a set of views that feel to me like one coherent position but which I cannot get
  anyone to scrutinise, since my reading group is mostly historians of science. I
  would be grateful for an audit of the package below.


  My commitments:


  (1) The textbook picture of inter-theoretic reduction — derive the upper-level theory
  from the lower-level one together with bridge principles — is, in the main, a fiction....
  What actually happens in the history of science is succession: an older theory is
  superseded and survives as an approximation valid in a restricted domain, with the
  relation between the two given by a limiting or correspondence argument rather than
  a derivation. I think that is all the unity the physical sciences have ever had,
  and that we should stop wanting more.


  (2) I think the familiar argument from multiple realisability for the autonomy of
  the special sciences is a dud: it is too cheap to be worth much, and it proves nothing
  about the cases that actually matter. The serious arguments for autonomy are mathematical
  — singular limits and renormalisation-group universality... And I go further than
  most of what I have read: in the phase-transition case I want to say that the non-analytic
  behaviour is exhibited only by the idealised infinite system, and that this is not
  a defect in the idealisation but a sign that the infinite system is where the phenomenon
  really lives. Call this taking the limit first.


  (3) I have a test of my own for when a coarse-grained model is doing genuine explanatory
  work rather than merely saving us labour, which I call the substitution test: a
  macro-model M explains a phenomenon better than a detailed micro-model D, and not
  merely more conveniently, when M remains correct under substitutions of the underlying
  constitution that change D — as, for instance, one very simple lattice model with
  short-range interactions gets the critical exponents right for fluids of wildly
  different molecular constitution and for uniaxial magnets alike. Where the substitution
  test is passed, I hold that the coarse-grained model is the better explanation,
  full stop, and not a poorer explanation we resort to because the detailed one is
  computationally closed to us.


  (4) I am a token physicalist of an unexciting sort. Every particular is nothing
  over and above its microphysical constituents and their arrangement; there is no
  downward causation; and higher-level causal claims are, I take it, causal claims
  about microphysical goings-on picked out under a coarser description.


  (5) I keep ontology and explanation sharply apart. Questions of what there is are
  settled by what the fundamental theory says, and an in-principle derivation from
  the fundamental theory — never actually carried out, and computationally impossible
  for creatures like us — is enough. Questions of explanation and modelling are epistemic.
  It is by this separation, as I understand it, that (2) and (3) cost me nothing in
  the way of ontological extravagance.


  (6) Consequently I think talk of emergent causal powers is either false or, charitably
  read, just (4) again.


  What I would like: go through the set and tell me which pairs are in tension, ordered
  by severity rather than listed indiscriminately, distinguishing genuine tensions
  from ones that dissolve on inspection; for each genuine tension say what would have
  to be given up and what that would cost me elsewhere in the set; and then name the
