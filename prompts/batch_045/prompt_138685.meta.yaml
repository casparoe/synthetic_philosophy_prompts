  I teach a final-year undergraduate module on catastrophic and existential risk,
  and I am considering screening Kubrick''s Dr. Strangelove as a set text for a session
  on the case for and against taking AI existential risk seriously. I want a critical
  reading of the film through that debate before I commit to it, because I suspect
  parts of the film illuminate the argument and parts of it quietly mislead.


  Please write that reading, in British English, as a piece of criticism rather than
  a survey or a film review...


  Structure of asks:


  1. The central device. The doomsday machine is dangerous because it works exactly
  as designed and cannot be recalled. I have been using a distinction in my teaching
  between mechanisms of two kinds: those whose danger lies in being too reliable (they
  faithfully execute a commitment no one can withdraw), and those whose danger lies
  in being insufficiently reliable (they do something no one specified, and no one
  can predict). Call them the committed and the refractory failure modes. Which of
  the two does the film actually dramatise? Which of the two does the case for AI
  existential risk need? If the film only gives me the first, is it an exhibit for
  the wrong argument — and if so, is there a reading of the film on which the absurd
  chain of human error stands in for the refractory case?


  2. Where the loss of control really sits. Trace, through the scenes, the points
  at which the catastrophe could still have been averted and wasn''t — the order being
  given, the recall, the attempt on the plane, the last conversations with the Soviet
  premier. What does the film say about whether control is lost at the moment of design,
  the moment of delegation, or the moment of execution? I want this because it bears
  on where an x-risk argument should locate the intervention.


  3. The villain-shape of the fable. ... the film''s causation runs through named
  individuals: a mad general, a sinister scientist, a hawkish general, a strutting
  ambassador; every step is someone''s decision. My worry is that a parable in this
  shape teaches students that catastrophe requires villains or madness, whereas the
  arguments I want them to engage locate the risk in competitive dynamics among actors
  each of whom is individually reasonable... Does the film corroborate my worry, or
  does the bureaucratic texture of the war room undercut it?


  4. What kind of catastrophe it is. Whether the ending depicts an existential catastrophe
  in the sense the literature uses — the permanent foreclosure of humanity''s future
  — or merely a civilisational one, with a survivable elite below ground. And whether
  the difference matters to the analogy, given that much of the force of the x-risk
  case comes from the size of what is at stake rather than the probability.


  5. The comic register. Does the satire flatter the audience into a sense of superior
  sanity, and so disarm exactly the "ordinary incentives" version of the argument;
  or does absurdity do philosophical work here that analytic prose cannot — making
  vivid the gap between decision and consequence, or the felt disproportion between
  the machinery and what is at stake?


