  ---


  I hold a view I''ll call simulation deflationism, and I''d like to know what would
  count against it.


  The view: even a modest credence in the simulation hypothesis should substantially
  deflate the case for treating existential-risk reduction as astronomically dominant
  — not by touching the probability of extinction, but by shrinking the quantity that
  the long-termist calculus multiplies it by.


  Three premises:


  1. The long-termist case gets its force from a product: a small probability of affecting
  whether humanity (or its successors) has a long future, times a future containing
  an enormous number of morally considerable beings. Near-term goods can''t compete
  with that product unless the probability is absurdly small.


  2. Taking the simulation hypothesis seriously at, say, anywhere from a few per cent
  to a substantial minority of my credence: our future is then bounded by the remaining
  runtime of this simulation, and we have no causal purchase on what happens in the
  simulating reality after (or outside) it.


  3. The short-run bias (the part I think is doing the real work, and the part I''d
  most like stress-tested): a simulating civilisation''s computational budget is finite,
  and the cost of a run scales with the amount of simulated history it contains, not
  with wall-clock time in the simulating reality. Runs are therefore cheap in proportion
  to how little simulated history they contain; a run that continues for a billion
  simulated years is among the most expensive things such a civilisation could do,
  while a run that terminates soon is among the cheapest. So the population of runs
  — and, on a natural way of counting, the measure of simulated observer-moments —
  is dominated by short runs, and conditional on being simulated I should expect this
  run to end well before anything like a colonised galaxy appears in it. Simulations,
  on this picture, are meteorological: built to study a period, not to inherit a future.


  Conclusion: conditional on sim, the "astronomical" term in the long-termist product
  is not astronomical; unconditional on it, the expected value of the far future is
  a mixture of something huge and something modest, and even a moderate credence in
  sim pulls the expected number of future beings we can affect down by orders of magnitude.
  The fanaticism — the result that essentially all expected value sits in one bucket
  — doesn''t survive.


