  Let me think about "moral progress and the expanding circle" with the commitments
  type. A recognizably held package:


  (a) There has been real moral progress in history — not just changed conventions;
  some later moral views are more correct than earlier ones (progress realism, in
  the sense of e.g. Singer''s The Expanding Circle, or Buchanan/Powell).

  (b) The expanding circle: moral progress consists partly in extending moral consideration
  to beings previously excluded, and the mechanism is the extension of reason/sympathy.

  (c) A debunking-friendly genealogy: the historical expansion of the circle is explained
  by contingent material and economic changes (literacy, urbanization, trade, declining
  violence, state capacity) rather than by improved moral insight.

  (d) Moral realism of a fairly robust, mind-independent sort: progress requires a
  standard independent of our own later views.

  (e) A case verdict: it''s permissible/right to give priority to one''s own children
  in ordinary life (partiality is not a moral failing) — but the historical pattern
  is that partiality toward kin and tribe is precisely what the expanding circle has
  been eroding.

  (f) Methodological: reflective equilibrium, treating considered particular judgments
  (e.g., "slavery is wrong," "I may favor my own kids") as data.


