  High school student + IP: could be a debate topic (e.g., "Resolved: intellectual
  property should be abolished"), or a student whose AI-generated work / school policy,
  or a Science fair project idea being "stolen". E.g., "my friend copied my science
  fair idea" — "you can''t own an idea". Or a school literary magazine plagiarism
  dispute. That''s a nice concrete scenario, and the slogan readings:


  1. Trivial/logical: ideas are non-rival — my using it doesn''t deprive you (versus
  rival goods); that''s a fact about ideas, not a moral conclusion. Also: ideas are
  not the sort of thing that can be owned because they aren''t scarce/excludable...
  but non-rivalry is exactly why we need artificial exclusivity (incentives).

  2. Legal doctrine: copyright protects expression, not ideas (idea/expression dichotomy);
  patents protect applications, not abstract ideas. So the slogan reads as a description
  of actual law — but that''s contingent and jurisdiction-specific, and "ideas" here
  is a term of art.

  3. Moral/Lockean: you can mix your labor with a physical thing, but an idea isn''t
  an unowned object; also, ideas come from a common stock, so appropriation is limited
  by the Lockean proviso ("enough and as good left for others") — but for ideas, others''
  independent discovery is not "taken from," so the proviso is easily satisfied →
  no ownership. Counter: the proviso is satisfied but the labor-desert claim still
  holds? Or the puzzle: if two people independently arrive, neither is harmed, so
  no one has a complaint — which is why independent creation is a defense to copyright
  infringement (though for patents, first-to-file, independent creation is no defense...
  mostly).

  4. Incentive/consequentialist: ownership of ideas is a legal tool to induce creation/disclosure;
  whether to have it is an empirical question, not a matter of principle; the slogan
  conflates "can''t" with "shouldn''t."

  5. Epistemic: "ownership" requires boundaries and provenance; ideas are hard to
  individuate (is my idea the same as yours?) — the "identity problem": there''s no
  fact of the matter about whether two ideas are "the same idea," so ownership claims
  are indeterminate. (Interesting and somewhat niche.)

  6. Expressive/personality: ideas are the commons of human thought, part of the self;
  owning themalienates... Hegelian/personality (but then expression is personal too).

  7. The "blocking" reading: owning an idea doesn''t just stop copying; it stops independent
  re-creation, which is a distinctive harm (you''re not deprived of the idea — you''re
  deprived of the right to use your own mind''s output). That''s the strongest anti-IP
  use: the slogan says "you can''t own an idea" as a protest against blocking.

  8. Radical reading: nobody owns anything, or: all ownership is conventional; or:
  "ideas are discovered, not made, so no one makes them" (Platonist-ish / mathematical
  discovery).

  9. "You can''t own an idea" as "you can''t own my having it" — reading: what''s
  protected isn''t the idea but the labor/product; the slogan conflates owning a token
  vs. a type.


