  "Don''t throw good money after bad" — readings:

  (a) Pure forward-looking: only future consequences matter. Trivial tautology of
  expected-utility maximization? Actually it''s a theorem-ish of decision theory given
  separability.

  (b) Heuristic/debiasing: people systematically over-weight past investment (loss
  aversion, justification, sunk cost effect) → the slogan is a corrective rule of
  thumb that''s not exceptionless: it can misfire when you systematically under-weight
  (e.g., quitting too early, present bias, "quitter''s regret"). Also: it can be self-fulfillingly
  bad if applied to itself — if you never honor sunk costs, you can''t make credible
  commitments.

  (c) The "costs are already paid" bookkeeping point — that''s not the same as "irrelevant":
  sunk costs often change the feasible set (the equipment you own, the skills you''ve
  built, the partial progress toward a goal), so "ignoring sunk costs" must mean ignoring
  them as reasons, not ignoring the present assets they left behind. Common misuse:
  someone says "ignore what you''ve spent" but then also ignores the value of what
  the spending produced.

  (d) Commitment/identity: honoring sunk costs as expressively rational — some goods
  are partly constituted by their history (a friendship, a marriage, a vow, a craft,
  a community, a restored car as a heirloom). This is where "honoring sunk costs is
  irrational" is arguably false: the past investment is not a reason to continue because
  it "would be wasted," but continuing may be rational because the history itself
  has value — though note that''s a forward-looking value too (the value of a 20-year
  friendship now).

  (e) Strategic/signaling: precommitment to sink further costs deters predators (military
  "credible commitment", Schelling) — where the irrationality is precisely the point,
  and honoring sunk costs is instrumentally rational ex ante even though it''s ex
  post irrational. Also the "Paradox of the sunk cost as reputation": a firm that
  always cuts losses invites competitors to inflict costs.

  (f) Epistemic: others'' sunk investments are evidence (costly signaling: a company''s
  R&D spend signals confidence; a friend''s years of effort signals dedication). Also
  your own past self''s investment is evidence about your own judgment/values — "past-me
  spent two years on this, which is evidence (defeasible) that past-me saw value I
  now can''t see; and my present boredom is not a reliable guide."

  (g) Distributed/agency problems: agents deciding for others (a school board spending
  on a building; a manager finishing a project) — malaligned incentives: an agent
  who honors sunk costs signals loyalty/avoids blame; here "sunk cost fallacy" is
  a diagnostic of agency problems rather than irrationality per se.

  (h) Option-value/exploration: continuing in the face of bad news has option value
  (learning, real options) — quitting too early destroys the value of information.
  So the slogan can be false when the activity generates information whose value exceeds
  the cost of continuing.

  (i) Non-consequentialist / deontological: promises, gratitude, loyalty — keeping
  a promise even when it no longer serves anyone''s future good (i.e., you could compensate).
  Is that "honoring a sunk cost"? Partly.


