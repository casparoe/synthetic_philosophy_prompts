  with paralysis, chronic pain, colostomies report wellbeing close to the general
  population. Since weighting schemes mostly use these reports, conditions that outsiders
  would describe as involving a lot of suffering end up counted as only mild losses,
  so prevention/treatment for them ranks low. Meanwhile there''s basically no category
  in the framework for ''states worse than death'' or for suffering that the person
  has adapted to and doesn''t report.


