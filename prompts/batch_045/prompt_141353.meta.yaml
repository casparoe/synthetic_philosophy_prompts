  I''m a third-year PhD student (evo-devo-ish, but my lab is really a functional morphology
  lab) and I have to write a position chapter for my thesis framing where I say where
  I stand on the adaptationism stuff. We also have a reading group on the Gould–Lewontin
  spandrels paper and the literature around it, and I keep finding that when I write
  down what I actually believe it looks like a pile of things that don''t go together,
  but I can''t tell which ones are actually in conflict. My advisor says I''m just
  rehashing a standard package; I don''t think so, but I can''t locate the problem
  either. So here''s the list, roughly in the order I think of them:


  (1) I hold an etiological / selected-effect view of function: a trait''s function
  is what it was selected to do, and a trait doesn''t get a function just from doing
  something useful now.

  (2) I think the spandrels critique is right as a methodological demand — an adaptationist
  hypothesis has to be tested against the alternatives (drift, developmental constraint,
  phylogenetic inertia, and byproduct status), and I mean constraint as a real explanation,
  not as a placeholder for we-don''t-know-yet.

  (3) I think that as a matter of fact, for a randomly chosen trait in a randomly
  chosen organism, the best explanation of why it''s there cites selection. (This
  might just follow from (2)? I can''t tell.)

  (4) I think reverse engineering / optimality modelling is the right way to find
  out what a trait is for: write down the design problem, solve for the optimum, compare
  to the animal.

  (5) I think spandrels and exaptations are a real and sizable phenomenon, not just
  a methodological caution — I don''t want to end up saying "oh sure, there are a
  few" and then never letting it change a single hypothesis.

  (6) But I also think that once a co-opted trait starts being modified by selection
  for its new role, it''s an adaptation for that role, full stop — origins don''t
  settle current status.

  (7) I''m a pluralist about levels of selection and bookkeeping: multi-level selection
  partitions or inclusive fitness, whichever is less confusing for the case at hand.


  The case that made me notice this is my own system: a clade of burrowing skinks
  (I call them the sand-swimmers in my notes) with enlarged fused scale patches on
  the flank above the hind limb — flank plaques. They show up on the tree at the same
  node where the lineage shifts to burrowing through coarse gravel; in the lab they
  have no measurable effect on burrowing speed, abrasion or water loss (I checked
  all three, and honestly the negative results are the most solid data I have); but
  in the two most derived species the plaques are reshaped into a gutter that channels
  sand away from the cloaca, and ablation costs those species something like 15% of
  burrowing efficiency while the basal species don''t care at all if you glue theirs
  shut. My instinct is to say: spandrel at origin, adaptation now, in the derived
  species only — and I''ve started using a rule of thumb that a trait counts as a
  spandrel only if selection has never acted on it for any of its current effects,
  so that "spandrel" is a claim about the whole history and not just the origin.


