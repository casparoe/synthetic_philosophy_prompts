  ---


  In the last decade of his life John Stuart Mill moved, in print, towards something
  he himself described as a qualified socialism, and the essays in which he did so
  appeared only after his death. I want to ask what that late Mill would make of three
  things he did not live to see, and I want the answer to be a verdict rather than
  a survey.


  Take his late position to be roughly this (correct me if you think the capsule is
  wrong, and say what in it you would change): the wage relation is a stage of industrial
  development, not its terminus, and it is to be outgrown by associated production
  in which the workers are their own capitalists and share the profits; private property
  and competition are to be reformed and circumscribed rather than abolished, and
  the state should not absorb production into a salaried officialdom; the transition
  must be gradual, voluntary and experimental — cooperatives have to prove themselves
  in the market against the ordinary capitalist firm, and their failure is information;
  the real point of all of it is moral, the education of the labourer in independence,
  prudence and self-government, and any arrangement that buys material security at
  the price of that education is a bad bargain; large inheritances should be cut down,
  so that great fortunes are not transmitted intact from generation to generation;
  and the growth of capital and population need not continue for ever, since a stationary
  state is not obviously a worse condition than the scrambling, competitive one.


