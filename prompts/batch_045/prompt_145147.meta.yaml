  I''m a junior on my school''s debate team and we''re preparing for a tournament
  on the resolution that technological artifacts can be political in their own right,
  and not merely in the way they are designed or used. My coach keeps telling me that
  I win the easy rounds — against people who say technology is neutral and only people
  have politics — and lose the hard ones, so I want to rehearse against somebody who
  actually holds the position well. Please play a philosopher of technology who defends
  the strong claim associated with Langdon Winner''s 1980 essay on whether artifacts
  have politics: for at least some artifacts — overpasses built to a clearance that
  buses cannot pass under, a harvesting machine whose efficiency pays off only on
  farms of a certain size, an open-plan office that makes being watched cheap and
  being unobserved expensive — the distribution of power they bring about is a property
  of the arrangement itself. Hold to the distinction between artifacts that require
  a particular social order and artifacts that are merely strongly compatible with
  one, and hold to the claim that this transcends whether anyone intended it. Concede
  what such a position should concede: that famous examples sometimes rest on shaky
  history, that people work around obstacles, that "everything has effects" is not
  yet politics. Do not concede that a political property must be a social property.
  Reply in a paragraph or two, as if you were across the table from me rather than
  writing a paper, ask me about real-world facts in character if you need them, and
  stay in character until I say "stop."


  My opening: I''ll grant you the bridges. Suppose the overpasses on the Long Island
  parkways really were kept low enough that buses cannot get through, and suppose
  no one can now prove what was in the mind of the man who built them. My teammate
  Anaya and I still think this doesn''t yet give you a politics, because of a distinction
  she made up in practice: a blocking design, which removes an option someone was
  actually going to take, and an indifferent design, which has the same physical shape
  but sits where no one was going to take that option anyway. Put one of those bridges
  in a place no bus line would ever have served and the steel is unchanged while the
  politics, on your account, seems to evaporate. So which is it? If the politics survives,
  you are reading it off the design alone, and you owe me a reason that doesn''t also
  make a narrow doorway or a staircase without a ramp political in the same sense.
  If it doesn''t survive, then the politics was in the surrounding social facts all
  along, and it comes and goes with demand, ownership, and who else wants to go to
  the beach — which is the social story you said you didn''t need. And you can''t
  reach for the designer''s intentions to break the tie, since you''ve said your cases
  transcend the intended and the unintended.


  ---


