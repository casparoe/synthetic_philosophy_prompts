  Now, the competing accounts to bring in for the audit:

  1. Standing as a gate on a scarce institutional resource (courts): standing is about
  who gets to trigger state coercion; blame is a communicative act among equals, no
  scarce resource, no third-party adjudicator. So the "gatekeeping" rationale doesn''t
  transfer.

  2. Legal standing is about the plaintiff''s own injury (injury in fact, particularized,
  traceable to the defendant) — mapped onto blame: does blame require that the blamer
  be personally wronged? On some accounts (second-personal), blame is addressed by
  anyone with standing as a member of the moral community; on others, victims have
  a distinctive standing. The legal analogy imports a victim-centered model of standing
  that is controversial in the moral case (third-party blame seems fine).

  3. Unclean hands in equity: (a) applies only to the same transaction/matter (must
  be connected to the subject matter of the suit); (b) it''s an affirmative defense
  raised by the defendant, not a jurisdictional bar; (c) it doesn''t mean the plaintiff''s
  claim is false — it means equitable relief is withheld; (d) it''s discretionary
  and weighed against public interest. Mapped: hypocrisy as "unclean hands" requires
  the hypocrite''s own failing be the same norm, or any norm? Does the defense block
  the whole claim or only certain remedies (e.g., you can still demand, but can''t
  demand as a superior)? Does it make the blame false or merely barred?

  4. Waiver/estoppel: legal rights can be waived or forfeited by conduct; and estoppel
  requires reliance/detriment by the defendant. Mapped: does the target need to have
  relied on the hypocrite''s waiver? Does the hypocrite''s conduct communicate a waiver
  (hypocrisy is usually hidden — secret hypocrisy can''t be a communicated waiver,
  yet intuitively hypocrisy undermines standing even if undiscovered — big disanalogy:
  legal unclean hands operates publicly via adjudication; blame happens in private).

  5. The legal analogy imports a "trial" model: there is a determinate verdict, a
  judge, and a remedy; blame has no judge and the "remedy" is the target''s own recognition/remorse.

  6. Big one: in law, standing is a precondition of the court''s acting at all — if
  the plaintiff lacks standing the court does nothing, and the law isn''t enforced.
  If blame requires standing and hypocrisy destroys it, then hypocrites can''t hold
  anyone to norms → norm enforcement collapses / only the saintly may blame → paradoxically,
  the most immoral people get immunity from blame (a reductio: the "blame-immunity
  for the worst" problem). Actually the real worry: if hypocrisy forfeits standing,
  then consistent criminals are immune to blame by other criminals — a "criminals''
  cartel" outcome. That''s a neat injected idea.

