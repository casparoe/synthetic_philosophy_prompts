  I have no formal background in any of this — I work in logistics and have been reading
  about machine consciousness on my own for a couple of years — so please keep the
  technical vocabulary to a minimum and explain any term of art you use.


  There is a forum I read where the same question comes up endlessly: when a computation
  is a person, or part of one, or something we owe something to. One member — I''ll
  call him M., a systems engineer, the only person there whose verdicts I''ve found
  to be stable across threads — has ruled on a long series of cases. I''ve collected
  them:


  - A whole-brain emulation running on a server: it matters, in the same way you do.
  Run it a thousand times faster and it doesn''t matter a thousand times more, and
  there aren''t a thousand of it.

  - Two identical copies running side by side: two things that matter, each of them
  entirely, not half each.

  - The same emulation run on three machines with majority voting, purely for reliability:
  one, not three.

  - A lookup table with a precomputed answer for every possible history of inputs,
  giving exactly the outputs the emulation would give: nothing there.

  - A vat of convecting fluid whose microstates can be mapped one-to-one onto the
  emulation''s states so that its dynamics instantiate the same abstract state-transition
  structure, where the pattern plays no role in causing what the fluid does next:
  nothing there.

  - A system shaped exactly like the emulation internally, except that every state
  transition is imposed from outside by a controller, so that its internal states
  never cause one another: nothing there.

  - A person whose neurons are replaced one at a time with silicon units doing the
  same job: it matters throughout, and the finished thing matters too.

  - An emulation checkpointed to disk, the machine switched off for a year, then resumed:
  same thing that mattered before, not two of them.

  - A nematode: it matters, but only a little, and he''d sooner give up a lot of nematodes
  than one person.

  - A present-day chatbot: he says no, but the reason he gives is that it keeps no
  unified state of its own from one exchange to the next, and he''s said he''d change
  his mind if that were fixed.


  The case now being argued on the forum, which he hasn''t ruled on, is what I''d
  like a prediction about...


  [Federation description]


  Would M. say there is something there that matters? Is it one such thing or many,
  or a fraction of one? Does it survive the replacement of every shard? I''m less
  interested in getting the answer right than in the following: the two or three different
  rules that fit his whole record equally well, what each of them says about the federation,
  which one I should bet on and why, and — if his record really doesn''t settle it
  — the smallest change to the case, or the extra case I should put to him, that would
  separate them.


  Finally — and this matters to me as much as the prediction — I''d like you to mark
  clearly which parts of what you say are settled and which are live disputes among
  people who actually work on this. I can''t tell the difference myself, and I''d
  rather be told "people disagree and here''s the split" than be handed one side as
  though it were the standard view. Tell me too how much confidence you''d put on
  the prediction given that the record is a stranger''s forum posts, and what would
