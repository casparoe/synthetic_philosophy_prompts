  I had a two-hour argument with my friend last night — she does ML, I''m TAing a
  first-year cog sci seminar on concepts — about whether a system that can solve Bongard
  problems has thereby shown anything like human concept learning. Her line was that
  if a model looks at six examples a side and induces the rule, that''s the same thing
  we''re doing. My line was that Bongard problems only look like concept induction
  because whoever designs them has already picked out the projectible feature, and
  that nothing in the twelve panels rules out the gerrymandered rules; the problem
  set is carrying the conclusion. We went in circles because neither of us had an
  actual case in front of us. So: I want to build one, as a take-home for the seminar,
  and I want the disagreement to show up in the design of the panels rather than only
  in the philosophy afterwards.


  Here''s what I need. One problem, six panels on the left that share a rule and six
  on the right that share its opposite, plus a thirteenth held-out panel. Text only
  — every panel has to be describable unambiguously in a single sentence of plain
  prose (ASCII sketches are fine but must not carry information the prose doesn''t
  have). Tiny vocabulary: dots, line segments, circles, triangles, squares; nothing
  culture-specific, no letters or numerals; at most six elements a panel. Two things
  have to be true at once. First, the intended rule has to be relational or topological
  — about how parts relate, containment, contact, order, parity of nesting, that kind
  of thing — and specifically not computable from any per-panel summary statistic:
  not from how many elements there are, not total ink, not symmetry or bounding-box
  shape. The two sides should be matched on all of those, generated by the same random
