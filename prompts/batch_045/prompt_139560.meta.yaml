  The activity: "The Transfer."


  Structure: participants fill out a short pre-questionnaire (a "taste profile": rank
  8 things), then they''re offered one of two envelopes: STAY or TRANSFER, with the
  possibility to pay points to peek at a report from a previous transferee. The reports
  are written by "previous participants" (pre-written by you) in value-language that
  has shifted: e.g. a report says "the light is very generous here and the food is
