  you to test rather than flatter, is this: a rescuer earns the right to say ''not
  yet'' only if, before the delay was observed, the theory had already specified (a)
  the offsetting variable, (b) a rough bound on how far and how long it could push
  the outcome, and (c) an observable sign that the offset was running out. Call it
