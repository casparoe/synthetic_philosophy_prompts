  "Part one. For Grice, what a speaker says is the truth-conditional content of the
  utterance. It is fixed by the conventional meanings of the words, together with
  disambiguation and the fixing of reference, and nothing else. Speaker meaning —
  what the speaker means by uttering the sentence — is accordingly the same thing
  as what the speaker implicates, since the saying side is settled by convention and
  everything the speaker brings to it beyond the words counts as implicated. Saying
  and implicating thus divide the content of an utterance between convention and inference.


  An implicature is derived like this: the speaker has said that p; the hearer assumes
  she is observing the cooperative principle and the maxims of Quality, Quantity,
  Relation, and Manner; the hearer asks what the speaker must think for saying that
  p to be consistent with that assumption; and the answer is the implicature. So if
  A asks whether there is anywhere to buy petrol nearby and B replies ''There is a
  garage round the corner'', B implicates that the garage sells petrol and is open,
  because otherwise the reply would not be relevant.


  Some implicatures depend on the details of the context and are called particularized.
  Others attach to the form of words whatever the context: ''Some of the students
  passed'' implicates that not all of them did, and because this effect travels with
  the word ''some'' itself it is a conventional implicature, like the contribution
  of ''but'' or ''therefore''.


  Part two. Eli said that Chen has lovely handwriting. Eli implicated that Chen is
  a poor candidate for the data job. Eli flouts the maxim of Relation: the remark
