  ---


  I work as an analyst for the Nosology and Entitlements Committee of a national health
  service. The Committee maintains the Schedule of Diseases: getting a condition onto
  the Schedule triggers mandatory coverage of diagnosis and treatment with no cost-sharing;
  conditions the Committee declines go into a separate prevention budget, where screening
  is discretionary and patients pay a co-payment. The governing statute defines a
  disease in terms the Committee has never fully unpacked: a departure from the normal
  functional organization of the human organism that, in the environment its bearers
  actually inhabit, is harmful or materially raises the risk of harm. Every disagreement
  we have is really a disagreement about how to read that sentence.


  I am writing the recommendation memo on a new petition and I need the rule-space
  laid out, not a literature review. I can find the literature myself; what I need
  is a menu of the rules consistent with our own precedents, what each predicts here,
  and which further case would separate them. No citations needed.


  Our precedents (all reasonably recent, all with reasons given):


  1. Asymptomatic essential hypertension — blood pressure persistently above a fixed
  threshold, no symptoms, roughly doubled ten-year cardiovascular risk, effective
  and cheap treatment. Listed. Harm, the Committee said, may consist entirely in raised
  risk; present suffering is not required. Note that the threshold here is absolute,
  not age-relative.


  2. Age-related bone loss and presbyopia in people over 65 — near-universal, measurable
  loss of function, treatable, sometimes painful secondarily. Not listed: "changes
  incident to the normal course of ageing." The Committee compared each patient to
  an age-matched reference distribution, and explicitly refused to list a condition
  that would make most of the elderly population diseased.


  3. Dental caries in adults — present in something like nine in ten adults, caused
  largely by refined sugar, a dietary novelty in evolutionary terms; causes pain and
  tooth loss. Listed. The statistical objection was met by saying that the reference
  population is itself environmentally abnormal, so that high prevalence in it is
  not evidence of normality.


