  Language," issued by a fictional bureau, in numbered clauses with cross-references,
  a definitions section, and at least one appendix, about 700–900 words, in the deadpan
  voice of a compliance manual.


  The setup I have in mind: a team of auditors has to certify that the manual which
  renders the native word "gavagai" as "rabbit" is the correct one. As I understand
  the argument, they cannot do this — not because the natives are hard to read or
  the data is incomplete, but because there is nothing for the certificate to record:
  rival manuals that render the same word as "undetached rabbit part," as "rabbit
  stage," or as the universal rabbithood fit all the same evidence, provided the manual''s
  translations of the surrounding apparatus — identity, counting, "same again," plural
  endings — are adjusted in step. So the Standard should keep trying to close, clause
  by clause, and each time it closes on empty.


  What I want to be funny, and where the jokes must come from:


  - The Standard''s criteria should be the real ones people reach for and should fail
  for the real reason: checking the natives'' assent and dissent to the sentence under
  stimulation; asking them "is this the same gavagai as that one?"; appealing to simplicity,
  charity, naturalness, and what a native "would obviously mean." The failure should
  not be that the natives are unforthcoming. It should be that every question the
  auditors can ask has to be put in a language whose manual is the very thing under
  certification, and that a rival manual predicts every answer just as well once it
  adjusts its plumbing.

  - The tone should be bureaucratic confidence, not bafflement. The bureau must never
  worry, never confess ignorance, never wonder whether the natives have language or
  minds. It keeps issuing certificates. The joke is that the certification is vacuous
  while the paperwork is impeccable — say, clause 9 cross-referencing itself, an appendix
