  Draft:


  I am writing a short position statement on the special composition question and,
  before I commit to it in print, I want an audit of whether the package I have assembled
  is internally coherent. My commitments:


  (1) Anti-nihilism: there are composite material objects — organisms, but also artifacts
  like bicycles and carburetors — and ordinary claims about them are literally true.


  (2) Anti-universalism: composition is restricted. There is no object composed of
  my bicycle and the Moon''s far side, and I am unmoved by the Lewisian argument that
  unrestricted composition buys parsimony in ideology at the price of only quantitatively,
  rather than qualitatively, costly ontology.


  (3) Anti-brutalism: the correct answer must state an informative, non-arbitrary
  condition. I reject the view that the composition facts are simply brute, and I
  also reject "the xs compose something iff they are arranged bicycle-wise / table-wise"
  as uninformative.


  (4) Non-deflationism: the disagreement between nihilist, universalist and moderate
  is a first-order dispute about what there is, not a dispute about words, concepts
  or the meaning of the quantifier. I do not think quantifier variance or the "easy"
  answers to existence questions settle anything here.


  (5) Causal idleness: composing something adds no causal powers. The causal profile
  of a composite is fixed by its proper parts and their arrangement; there is no downward
  causation and no emergence of novel causal powers at the composite level.


  (6) The restriction, whatever exactly it is, must be grounded in something like
  causal or dynamical integration among the parts — that is the only place I can see
  to draw a non-arbitrary line, and I am attracted to a generalization of the "life"-style
  criterion that would let artifacts back in. (I cannot accept that criterion in its
  original form, since it denies that there are bicycles.)


  (7) Anti-realism about groups: there is no such thing as a corporation, a university
  or a state over and above the people who make it up and their activities — no group
  agent, no group object.


