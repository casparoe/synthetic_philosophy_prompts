  Jeffrey conditionalization (JC): You have a partition {E_i}; your experience shifts
  your probabilities on the partition to q_i without making any of them certain; then
  P_new(A) = Σ_i P_old(A | E_i) q_i. This presupposes "rigidity": P_new(A | E_i) =
  P_old(A | E_i) for all A. Known issues:

  - Order-dependence/non-commutativity: JC is not generally commutative — updating
  on a partition then a refinement can differ from reverse order. Also repeated JC
  on the same partition is fine.

  - JC is not "sufficient" — the rigidity condition is strong; in many cases learning
  E should change your conditional probabilities P(A|E) too (e.g., you learn that
  the light looked red, which also tells you something about the lighting conditions,
  so P(A|red-looking) might change).

  - Dutch-book / accuracy: JC minimizes expected inaccuracy (relative entropy / KL
  divergence from the old distribution) subject to the constraint on the new marginal
  over the partition — that''s a known result (relative-entropy minimization / "minimum
  change" principle). Actually, that''s the well-known result: JC is the result of
  minimizing KL divergence subject to constraints. Hmm — I believe that''s right (Diaconis
  & Zabell; Williams). Yes: minimizing D_KL(P''||P) subject to P''(E_i)=q_i yields
  P''(A) = Σ P(A|E_i) q_i. That''s a standard result. I should present it carefully
  or not assert it. I can mention it as a claimed virtue and ask whether it''s a desideratum
  or a prejudice (obviously minimizing KL is only one way to measure "minimal change";
  other divergences give other rules — e.g., minimizing KL in the other direction
  gives something else). That''s a nice "genuine desideratum vs. camp prejudice" item!

  - Handling of "evidence you might be wrong about the partition": what if the experience
  doesn''t neatly carve a partition?

  - "Uncertain evidence" vs "evidence about your own evidence" (the "problem of uncertain
  evidence" in the sense of learning P(E)=0.9 vs. learning something that raises P(E)
  to 0.9 — the distinction between "learning the value of a random variable" vs. "a
  change in your degrees of belief about E" — the "evidential uptake" distinction,
  e.g., Richard Jeffrey''s "ratifiability"; or "the difference between your coming
  to have credence q in E because of an experience and your being told by a reliable-ish
  instrument what to set it to").

  - Also: the problem of old evidence for Bayesianism relates.

  - Also desideratum: should reduce to standard conditionalization when q_i collapses
  to 1 on one cell.

  - Should handle "screening off"/sufficiency: if the partition screens off A from
  the rest, etc.

  - Should be applicable to self-locating evidence / indexical? (e.g., Sleeping Beauty,
  where the evidence is centered). Maybe too much.


