  candidates:

  1. The rivals must be genuinely different theories (not notational variants / not
  the same theory in different coordinates) — case: Newtonian mechanics in different
  frames; wave vs matrix mechanics.

  2. Empirical equivalence must hold not just for all evidence we''ve actually gathered
  but for all evidence we could possibly gather — but then flag: if "possible evidence"
  is unconstrained, empirically equivalent genuinely distinct theories are easy (e.g.,
  adding an unobservable epicycle), so this desideratum is cheap; if evidence includes
  theoretical virtues, the thesis becomes false.

  3. Distinction between local (a specific pair of rivals) and global (all theories)
  underdetermination; and between transient (resolvable by more evidence of a kind
  we can get) and permanent.

  4. Must be consistent with the fact that scientists do manage to discriminate; must
  not collapse into general skepticism or into the Duhem–Quine thesis (which is about
  auxiliary hypotheses, not whole theories).

  5. Must respect the distinction between underdetermination by *evidence* and underdetermination
  by evidence+whatever.

  6. Should say whether "empirical equivalence" includes counterfactual/possible observations,
  and whether the observation language is theory-neutral (that''s the "theory-ladenness"
  wrinkle that makes the whole thing collapse or trivial).

