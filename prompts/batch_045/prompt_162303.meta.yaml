  our student union. Twice a month, in a ninety-minute meeting, we read through six
  to ten proposals for small commissions — $500 to $3,000 — from student and local
  artists for work that gets installed in the building or shown in the gallery cases.
  We vote, we write a paragraph of reasons that goes back to the applicant, and the
  gallery director reviews our recommendations and can veto them (she has, once, over
  insurance). Our current rubric is three items — ''artistic merit,'' ''message,''
  ''fits the space'' — and it is useless: every disagreement we have ends up being
  a fight inside ''artistic merit.'' I''d like to replace it with something built
  honestly out of Du Bois''s position: art should be propaganda, but propaganda has
  to pass the test of beauty, and beauty that carries no message is decoration.


