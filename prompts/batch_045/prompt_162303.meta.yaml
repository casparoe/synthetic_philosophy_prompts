  Now let''s design the prompt.


  Domain: Du Bois on art as propaganda.

  Type: Turn a principle/theory into a procedure a practitioner can follow.


  Role: Undergrad (say junior) taking a course — maybe "Philosophy of Art" or "Race
  and Aesthetics" — and serving on a student committee: the "Public Art and Exhibitions
  Committee" of the university''s student arts fund, which awards small commissions
  ($500–$3,000) to student and local artists for works installed in the student center
  / shown in the campus gallery. They meet twice a month, ~90 minutes, review 6–10
  proposals, decisions must be recommended to the gallery director who signs off;
  proposals must be decided with reasons given in writing because artists get feedback.


  Constraint: The committee currently uses a mushy rubric ("is it good? does it have
  a message?"). Student wants a procedure grounded in Du Bois''s view — that art must
  be propaganda, and that propaganda must also be beautiful (and true? He also stressed
  truth). Key thrust: Du Bois''s doctrine organized into an ordered checklist: (1)
  Is it propaganda at all — i.e., does the work take a position about how people should
  live/see things, addressed to someone; (2) is the propaganda the work''s own or
  the sponsor''s; (3) is it beautiful/craft-wise realized, does it work as art; (4)
  does it tell the truth / is it accurate about the people or condition it depicts;
  (5) is it addressed to the community it depicts or to a patron — who is the audience
  and does the work flatter them.


  Injected niche ideas (my own, to make it non-regurgitable):

  - Distinction between "propaganda" and "testimony/announcement" — works that express
  the artist''s experience without asking anyone to change anything.

  - "Exit test / subtractability test": strip the message and see if the craft still
  holds; strip the craft and see if the message still travels. If removing the content
  leaves something merely decorative, it''s decoration wearing a slogan.

  - "Counter-audience test": would the work still be shown if the people it depicts
  were the only audience? And: would the institution have funded it if it said the
  same thing about a group the institution is comfortable with?

  - "Sponsorship capture": when a funder''s framing makes the work propaganda for
  the funder''s own virtue (institutional reputational propaganda) — "propaganda for
  the innocence of its patron."

  - The disanalogy case: censorship — a work whose politics the committee finds abhorrent
  but is beautifully made and genuinely propagandistic; Du Bois''s view seems to say
  beauty + propaganda earns a place, yet his own practice (he objected to some Harlem
  Renaissance works?) suggests limits.


  Worked cases (3):

  1. A polished, beautiful mural proposal about campus labor (dining hall workers''
  schedules) by a student artist, from a student-labor group; strong craft, clear
  message — procedure: fund.

  2. A slick, well-produced recruitment/branding video commissioned... hmm, better:
  a corporate-sponsored (bank) "diversity" installation — beautiful, message "we are
  inclusive" — procedure likely says it''s propaganda for the sponsor''s innocence,
  and the beauty is in service of a false claim → no (or conditional). Maybe the committee
  likes it because it''s free and beautiful; the answer they won''t like?

  3. The unwelcome one: a rough, didactic, aesthetically weak stack of photocopied
  posters about eviction in the nearby neighborhood, made by a tenants'' union — message
  the committee agrees with, made by the people affected, but not beautiful, and Du
  Bois insisted on beauty → procedure says no (or: fund only with a development condition).
  Committee won''t like rejecting grassroots work they politically support.

  4. Maybe a fourth: a technically brilliant work by a student that is beautiful but
  whose propagandistic content the committee finds morally repulsive — procedure says
  yes (Du Bois: beauty + propaganda is art; he wouldn''t exclude on disagreement of
  content) but the committee will balk and the gallery director might veto. This is
  another "unwelcome" and also tests where judgment can''t be eliminated.


  Also ask: where the procedure stops with a no; where it hands to a person because
