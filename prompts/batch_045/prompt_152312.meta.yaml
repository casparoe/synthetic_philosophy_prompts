  act; that a concept is not a definition but a slowly accreted bundle of nested analogies,
  so that what feels like perceiving an essence is really the after-the-fact obviousness
  of a reminding; and that the mappings that matter carry relational structure rather
  than surface features."


  Then the specs:


  "What I do not want: a joke about analogy, a joke about AI failing at analogies,
  puns whose mechanism is phonetic, or anything that would work just as well as a
  generic nerd joke. What I want is a joke whose laugh is manufactured by the listener
  completing a mapping: the setup should be flat, mundane and literal, with nothing
  to get, and the punchline should force a re-categorization of something already
