  Two familiar packages: hold on to the person-affecting restriction and swallow that
  such acts are not wrong (unless the life is not worth living); or drop it for an
  impersonal axiology (maximise total or average welfare across outcomes) and swallow
  its consequences (in particular, that the wrongness of such acts is of a piece with
  the wrongness of failing to add extra happy people to the world). I''ll call the
  shared assumption *Identity-Determined Assessment*: the moral significance of an
  outcome is a function of which individuals it contains, so outcomes that differ
  only in who exists are, morally speaking, incomparable unless one invokes an impersonal
  value.


  §2. The proposal: deny Identity-Determined Assessment while keeping the relational
  structure. Distinguish the *occupants* of a choice''s effects from the *slots* those
  occupants fill. Slots are the positions that the agent''s practical question was
  about: "my first child", "the player who gets the kidney", "a resident of this city
  in 2120", "the child of the violinist I hire". The agent''s feasible options differ
  not merely in who fills those slots but in how well they are filled. Proposal: an
  act is pro tanto wrong when, relative to the practical question the agent faced,
  it fills some slot worse than some feasible alternative fills the corresponding
  slot, and fills no slot better. Call this *filling-relative assessment*.


  §3. The complaint: on this view, the child of the girl who conceived at fourteen
  can lodge a genuine complaint, but not the counterfactual one ("I would have been
  better off had you waited"). The complaint is about occupancy: "the slot you filled
  — your first child — you filled below the level that was open to you, and you did
  it knowingly." Wrongness is thus a three-place relation between an agent, a slot
  her choice filled, and the alternatives she had; it does not require that the complainant
  would have existed under any alternative, only that she occupies a slot the agent
  had a duty to fill well. That is why I take this to be a person-affecting view in
  spirit but not in the standard sense: it preserves "no wrong without a complainant"
  while dropping "no complaint without counterfactual improvement."


