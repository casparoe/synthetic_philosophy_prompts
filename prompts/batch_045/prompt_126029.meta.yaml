  §1. Restate: In the standard array of cases — a girl conceives at fourteen rather
  than waiting; a government depletes rather than conserves; a couple conceives a
  child who will be deaf, having had the option to conceive a different, hearing child
  — the agent''s act is contingent for the existence of the individual it affects.
