  ---


  I am a novelist. In six weeks I am giving the closing keynote at a three-day conference
  on consciousness and the arts — my title is What Novelists Know That Introspection
  Forgets — and I have twenty minutes of questions afterward with no slides and no
  one to hide behind. I would like the prep sheet.


  The thesis. Phenomenal character is not a property that introspection discloses;
  it is the residue of an act of composition, and the act is the same one I perform
  at a desk. Three pieces of it:


  - the dictation error: we misremember introspection as taking dictation from an
  inner object, when it is in fact drafting — selecting a coarse, contrastive, communicable
  predicate under pressure of time, memory and audience, then reading the draft back
  as a discovery;

  - grain-matching: the felt fineness of grain of an experience tracks the grain of
  the vocabulary currently at hand, not the grain of the stimulus, so that a subject
  given three new color words reports three new regions of phenomenal space;

  - the aura argument: my own migraine aura is, by any physiological account, a low-dimensional,
  stereotyped, geometrically crude disturbance — an expanding zigzag arc with a blind
  region trailing behind it — yet I have filled two decades of notebooks about it
  and each entry reports a qualitative depth that no description exhausts. A competent
  stylist can manufacture inexhaustibility at will, including for states known to
  be thin or nonexistent. So inexhaustibility is evidence about the describing, not
  about the described.


  Sketch of the argument they will be aiming at:

  1. Introspective reports are composed under the constraints of a public vocabulary
  whose grain is set by practical and social need.

  2. The reporter then reads the output of composition as a reading-off of a property
  present in the experience: the dictation error.

  3. If 1 and 2, then the datum realists start from — that introspection reveals a
  determinate, fine-grained, apparently inexhaustible what-it-is-like — has an explanation
  that never mentions phenomenal properties.

  4. Grain-matching and the aura argument show that this explanation is not merely
  possible but independently evidenced.

  5. By inference to the best explanation, there are no phenomenal properties; there
  is only the seeming, produced.


