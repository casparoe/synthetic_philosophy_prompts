  I''m revising a paper on the unity of the proposition, and I want your help deciding
  which objection to spend my remaining space answering.


  Here is the dialectic as I have it. Bradley''s regress argument is usually taken
  to show that if a proposition is a complex assembled from a subject, a predicate
  and a relation that is itself a further constituent tying the two together, then
  that relation is just one more item needing to be tied to the others by a yet further
  relation, and so on. The standard replies all try to make the regress stop somewhere:
  treat the relation as active rather than as another term; take unity as a brute
  primitive; give up structure and identify propositions with sets of possible worlds;
  or identify the proposition with an act of predication instead of an abstract structured
  entity.


  The view I want to defend — I''ll call it the Fixed-Point Proposal — accepts the
  regress rather than stopping it. Let U be the operation that adds to a collection
  of items a further item purporting to unify them. Bradley''s complaint, on my reading,
  is that no finite iteration of U ever delivers a genuine unity: each application
  simply pushes the unifying work up to the next level. But that is exactly what an
  iteration does; the fix is to stop iterating and solve the equation instead. Take
  a proposition to be a structure P such that P = U(P): the unifier is among the items
  it unifies, so there is no further level for the question to migrate to. The regress
  is not cut off by fiat, it is closed into a loop, much as a recursive definition
  can pick out an infinite object by a finite equation. The payoffs are that no relation
  needs a special metaphysical status, and that the proposition stays finitely specifiable,
  so nothing is being asked of a finite thinker that cannot be given.


  I also take it that content comes along for free: a self-unifying structure is one
  that presents its own terms as related, which is just what it is for something to
  have truth conditions, so the theory of content is not a separate problem from the
  theory of unity.


