  Setup so you know which versions I mean. Take the zombie argument in its careful,
  two-dimensionalist form: it''s not just ''I can imagine a zombie''; the claim is
  that after ideal a priori reflection nothing in the complete physical/functional
  description of a world entails the phenomenal facts about it, that this yields a
  positively conceivable scenario (a world considered as actual), and that positive
  ideal conceivability gives primary possibility, which for the relevant purposes
  is supposed to carry over into the metaphysical possibility that matters, so physicalism
  as a metaphysical thesis is false. The physicalist replies we keep coming back to:
  (a) Kripkean a posteriori necessities show the move from ''not derivable a priori''
  to ''not necessary'' is invalid, and the standard reply is that ideal reasoning
  absorbs every a posteriori identity we antecedently know, so the gap survives; (b)
  the Yablo-ish line that conceiving is at best a test or a heuristic for possibility,
  not evidence — we have no account of why imagination should track modal space; (c)
  Block-style: the conceiver has to think ''no consciousness'' using phenomenal concepts,
  and if the supposed further fact has no causal-dispositional profile there''s a
  question whether we''ve picked out a scenario at all rather than just produced a
  blank stare in zombie''s clothing.


  Two things came up in our last couple of sessions that nobody has an answer to and
  that I think might be where the real action is:


  1. A symmetry worry. It also seems not-ruled-out-a-priori that the physical facts
  necessitate the phenomenal ones via some brute a posteriori necessary connection
  (Kripke-style identities all the way down, or a ''hidden essence'' story). If conceivability
  is only ever absence of a priori entailment, then the same datum that certifies
  P&~Q as possible also certifies P→Q as necessary, and something has to break the
  tie. The honest anti-physicalist move is to insist on ideal positive conceivability
  and to say the Kripkean case is one ideal reflection would resolve — but then the
  debate looks like it''s a debate about whether ideal a priori reasoning has authority
  over modality at all, i.e. about the epistemology of modality, not about consciousness.


  2. A parity worry. No a priori entailment from descriptive to moral facts either;
  the moral twin-earth style arguments give you ''all the descriptive facts, different
  moral facts'' with the same intuitive pull, and yet hardly anyone concludes moral
  facts are ontologically extra. If our side says the phenomenal case is special,
  that''s a claim about phenomenal concepts (or about the structure of our concepts
  of the physical), and the disagreement relocates to philosophy of mind. If they
  don''t say that, they owe an answer about the parody.


