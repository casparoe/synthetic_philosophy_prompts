  Core ideas:

  - Distinction between the criterion of rightness (e.g., maximize expected value
  / act on the balance of reasons) and the decision procedure an agent ought to use.

  - Indirect normativity: it can be right for an agent to follow a rule or a proxy
  procedure rather than directly aim at the right-making features, because direct
  aiming is costly, error-prone, or self-defeating; the "subjective ought" vs "objective
  ought"; also "the right thing to do" vs "the right thing to recommend/advise."

  - Idealized deliberation: rightness defined counterfactually via what an idealized
  (fully informed, fully rational, calm) counterpart would advise/desire; and the
  subtlety that idealization must be specified (which facts added, which rational
  corrections, in what order, and whether the idealized counterpart shares the agent''s
  aims/values or has corrected ones).


