  Draft student answer:


  ---

  Start with the common prior assumption. It says that at the ex ante stage — before
  anybody gets their private signal — all traders assign the same probability distribution
  over the states. It does not say that traders have the same beliefs when they trade:
  after private info arrives their posteriors generally differ, and they can have
  different utility functions and different endowments too. Milgrom and Stokey (1982)
  combine CPA with common knowledge of rationality, common knowledge that the trade
  is voluntary, and the requirement that the pre-trade allocation be Pareto optimal
  relative to the prior. The result: no trade. The mechanism is essentially Aumann''s
  (1976) agreement theorem. With a common prior, agents cannot end up disagreeing
  — once they communicate, their posteriors have to coincide — and trade is a kind
  of communication: if I learn that you''re willing to buy from me at p, that''s evidence
  you''ve seen good news, and after conditioning on it I don''t want to sell anymore.
