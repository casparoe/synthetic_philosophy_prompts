  Let''s think about the menu of readings for "meanings ain''t in the head":

  1. Trivial: what a word refers to isn''t determined solely by the speaker''s current
  beliefs/descriptions — reference can depend on how the world is. (Reference-determination
  externalism — moderate.)

  2. Content externalism: the content of a speaker''s thoughts/beliefs (not just word
  reference) is partly constituted by the environment — individualistic supervenience
  fails. Twin Earth: Oscar''s "water" thoughts differ from Twin Oscar''s though they''re
  intrinsically identical.

  3. Methodological/semantic: the meaning of a term can''t be given by a description
  the speaker associates with it; meaning isn''t a "method of verifying".

  4. Epistemic: a speaker can be ignorant or mistaken about what they mean / can''t
  know a priori what their words mean; self-knowledge of content is not privileged
  (Burge''s "self-knowledge" externalism, "slow switching").

  5. Anti-intentionalist: what a speaker means isn''t fixed by their intentions; speaker''s
  meaning doesn''t determine semantic content (anti-Humpty Dumpty).

  6. Metaphysical: meanings are abstract objects / external entities such as properties
  or "Russelian" propositions; meaning-components are objects in the world, not mental
  representations.

  7. Radical: there''s no such thing as "in the head" content at all; narrow content
  is incoherent; a speaker''s psychology has no content at all (or content is "wide"
  all the way down).

  8. Trivial/near-tautological: two intrinsically identical speakers can differ in
  meaning — this is just the denial of individualism.

  9. A claim about the division of linguistic labour: a speaker''s word can mean what
  experts would say it means even if the speaker has no idea (deferential externalism,
  Putnam''s "indexicality" — "meaning ain''t in the head" partly = social externalism,
