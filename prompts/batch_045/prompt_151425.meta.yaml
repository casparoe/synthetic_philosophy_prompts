  Thesis and argument sketch (the speaker''s, so objections can target):

  1. Dennettian stances are strategies for buying predictive leverage; adopting a
  stance is justified when it yields predictions you can''t get more cheaply otherwise.

  2. Patterns found by a stance are real (in the real-patterns sense: they support
  compression) but not stance-independent; there''s no further fact about which stance
  is the "true" one.

  3. For trained neural networks the design stance is inert: we have the architecture
  and weights (so the physical stance is available in principle), but the system has
  no design in the sense that buys leverage — nothing was arranged part-by-part for
  a purpose; the weights are the output of an optimization process over data. So the
  design stance gives you nothing between the physical and the intentional.

  4. But the intentional stance on an LLM is surprisingly reliable, and that reliability
  isn''t a lucky accident: it''s explained by the training process → introduce the
  training/selection stance (call it the "optimization stance"): predict a system''s
  behavior by asking what a system selected/trained to minimize such-and-such loss
  on such-and-such distribution, with such-and-such capacity, would tend to do — including
  off-distribution.

  5. So: (a) there''s a fourth stance, (b) it''s what underwrites intentional attributions
  to LLMs (rather than the intentional stance being basic), (c) therefore in safety
  cases, claims of the form "the model knows that p" are true only in the real-pattern,
  stance-relative sense, and evaluators should say which stance the claim is indexed
  to; (d) the right question isn''t "does it really know?" but "which stance-relative
  claim is load-bearing in this safety argument, and is that stance licensed here?".

  6. Payoff: this dissolves a current internal fight about whether our eval reports
  may say "the model believes X" — the answer is: yes, if the intentional stance is
  licensed, and the license comes from the optimization stance plus evidence of reliability.


