  The confusion to be spotted: The trilemma''s third horn treats "the subject is conscious"
  as a datum that the theory must preserve, but that datum is exactly what''s in dispute
  — describing the case as one in which a subject "has a mental state and is conscious
  of the wrong thing" already presupposes that first-order states carry consciousness
  independent of higher-order representation (i.e., it begs the question against HOT).
  Also, more subtly: the asker has conflated (a) what makes a state conscious with
  (b) what it''s like / the character of the experience, and has assumed that HOT''s
  role must be to *contribute phenomenal content* — when on Rosenthal''s view the
  HOT makes the state conscious but the phenomenal character is determined (largely)
  by the first-order state''s properties. So horn (i) misdescribes: on the standard
  view the HOT need not "inject" pain-content; it can represent the state more thinly
  (e.g., "I am in some sensory state or other"), and then the subject is conscious
  of the itch while mistakenly *judging* (or misrepresenting) that it''s a pain. That
  is: the mismatch can be located in the *classificatory* content of a further, inferential
  judgment rather than in the constitutive higher-order representation. So the "dilemma"
  isn''t exhaustive; HOT has a fourth option the asker hasn''t considered.


  Also: the asker''s claim that "a subject in an itch state with a mistaken belief
  about it is not a rock" runs together creature consciousness with state consciousness
  — Rosenthal''s distinction — so the intuition that "she must be conscious" is satisfied
  trivially (she''s a conscious creature, awake, etc.) while the question is which
  of her states are conscious ones. That''s the same transitive/intransitive point.


  And the "is this new?" bit: it''s not new — the literature on misrepresentation
  in HOT (and on whether HOTs must be accurate) is a known dialectic; plus the asker''s
  assumption that the targetless-HOT replies are the only two replies.


