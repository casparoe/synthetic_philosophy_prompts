  Standard structure: In the Zhuangzi passage, Zhuang Zhou dreams he''s a butterfly;
  on waking he doesn''t know whether he''s Zhuang Zhou who dreamed being a butterfly
  or a butterfly now dreaming he''s Zhuang Zhou. Standard reading: Cartesian-style
  dream skepticism. Alternative reading: "transformation of things" (物化 wu hua) —
  the point is not doubt but that identities are not fixed, and there''s no grounded
  standpoint from which to adjudicate.


  Specification task: Construct a case that is *phenomenologically indistinguishable
  from a normal life* — no Cartesian demon, no brain-in-vat, no indistinguishable-from-waking
  sensory trick — in which the Zhuangzian worry bites, i.e., in which the subject
  has no privileged standpoint, yet the Cartesian worry (global skeptical doubt) does
  not bite. That is: separate the two. The Zhuangzian question "which am I?" must
  be pressing while "am I being deceived about everything?" is not pressing at all.


