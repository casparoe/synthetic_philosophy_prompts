  *conformity* to any uniformity over deviation... Let me recall Lewis''s definition
  (1969): A regularity R in the behavior of members of a population P when they are
  agents in a recurrent situation S is a convention if and only if it is true that,
  and it is common knowledge in P that, in any instance of S among members of P: (1)
