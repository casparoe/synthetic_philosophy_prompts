  I''m writing a short piece for a philosophy-and-computation reading group, and I
  want to read Borges'' "The Library of Babel" as a story about intractability rather
  than about infinity or skepticism. Two things Ive been chewing on that I want you
  to actually engage with, not just nod at:


  (1) The librarians'' problem isn''t only that there are 25^huge books. Its that
  the Library gives them no neighborhood structure: the set of books is the same however
  you shelve them, but because books sit next to others that differ from them at random,
  nearness on the shelf carries no information about nearness in content, so there''s
  no gradient to climb. Size alone doesn''t make a search space hard; the access structure
  does. Two libraries with identical contents could differ between trivially searchable
  and hopeless.


  (2) The standard NP picture says hard to find, easy to check. But checkability may
  be part of what breaks in the story: since the Library also contains every one-character
  variation on any candidate book, the sect looking for the perfect catalogue or the
  Man of the Book can''t trust what it''s holding even when it''s holding something
  that looks right — and "is this the book that would justify a life?" isn''t a decidable
