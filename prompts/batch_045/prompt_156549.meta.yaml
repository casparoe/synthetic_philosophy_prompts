  Draft:


  ---


  I sit on the Joint Committee on Research Computing, which oversees the shared GPU
  cluster for six labs at our institute. Two of them — the Molecular Design Lab and
  the Climate Modelling Group — have submitted a joint request to run a six-month
  pilot modifying the mandate of the autonomous scheduling agents that bid for contested
  nodes on their behalf.


  Background as we have it: each lab currently instructs its agent simply to maximise
  that lab''s own realised throughput; the agents bid against each other in a daily
  contention protocol and are, by all accounts, very good at it. The result is what
  the two labs call a "wasteful equilibrium": both agents have learned to over-claim
  capacity they then release late, and roughly a fifth of contested node-hours are
  lost to both. Neither lab knows how to get out of it unilaterally, and nobody on
  the committee is able to predict how the agents would behave under any proposed
  change — they are adaptive systems, and we have no reliable model of which outcome
  they would settle on.


  The proposed modification has two parts:


  (1) Reciprocal restraint. Each agent is told: if the other lab''s agent has, for
  that day, publicly registered a matching commitment to restraint, then you may not
  use the over-claim action and you may not bid above the honest value of the jobs
  you actually have ready.


  (2) A surrogate objective. Each agent''s utility function is adjusted so that it
  also counts, at 10% weight, the other lab''s wasted node-hours.


  The labs'' central argument is that the package is safe in a particular sense: it
  does not require the committee to predict how the agents will actually settle, because
  in every case in which the added instruction changes anything both labs do better,
  and in every case in which it changes nothing, neither lab does worse than under
  the present arrangement. They call this a safe Pareto improvement and ask us to
  approve it on that basis.


  Three complications are on the record. First, part (2) is not conditional: as drafted,
  each lab''s agent carries the 10% weight whether or not the other lab''s agent does.
  Second, the "matching commitment" in part (1) is a registration flag the agents
  post themselves; it is not verified against the other agent''s actual bidding behaviour,
  and it can be withdrawn after the day''s bids are in. Third, the climate group''s
  proposal as submitted retains for itself one exemption — its agents may still over-claim
  on the last three days of each month, to cover grant-cycle deadlines — which the
