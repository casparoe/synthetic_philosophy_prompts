  ---


  The Equal Risk Scheme (ERS)


  In the imaginary Republic of Varrania the state runs the "Equal Risk Scheme." Every
  year, each citizen''s disposable income is adjusted by a "luck audit." The audit
  works like this:


  - For each citizen, officials construct a counterfactual twin — someone born into
  the same social position, with the same legal rights, but with the average bundle
  of native endowments (health, talents, temperament) and an average-quality upbringing.

  - Any shortfall in the citizen''s income compared with that twin is attributed to
  brute luck and is cancelled by a state transfer.

  - Any shortfall that results from the citizen''s own choices is left standing: the
  citizen bears it.

  - Officials count a choice as genuine, and hence as the citizen''s responsibility,
  only when three conditions hold: the agent had adequate information about the risks,
  was not coerced, and could reasonably have foreseen the outcome.

  - Varrania is proud that the ERS never lets anyone fall below a modest floor, and
  it insists that the floor is humanitarian relief, not justice: justice, it says,
  is done by the audit.


  Recent work by Varrania''s actuaries has turned up two awkward facts:


  (i) The choices that show up in the audit are themselves distributed by brute luck.
  People who grew up in poverty, or who inherited a temperament low in impulse control,
  are much more likely to make the very choices — risky jobs, poor saving, dropping
  out — that leave them short of their twin. The audit therefore converts brute luck
  into apparent option luck, and the transfers shrink towards zero precisely for those
  who started worst off.


  (ii) Some losses are covariant: when Varrania''s shipbuilding region collapses after
  a trade shock, everyone who chose to work there loses at once, and no private insurer
  would ever have covered the risk, because there is no pool to spread it across.


  ---


