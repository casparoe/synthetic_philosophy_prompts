  or a vote over candidate value functions, with the choice among these fixed by axiomatic
  desiderata. The other camp — call them the neutralists — holds that the system should
  not rank conceptions of the good at all, and that what must be justified to each
  person is the procedure that generates its behaviour, in terms that person could
  reasonably accept, rather than the content of the ranking it happens to produce.
  Everyone in the group now concedes the same three things: that no tractable elicitation
  recovers anything close to a complete value function for one person, let alone many;
  that Arrow-style and Sen-style impossibility results block any aggregation rule
