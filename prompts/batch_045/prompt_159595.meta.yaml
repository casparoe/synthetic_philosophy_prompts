  (1) Nils opened with Szasz''s core claim: a disease is a structural or functional
  abnormality of the body, of the sort pathology or anatomy can in principle identify,
  whereas what psychiatrists call mental illness is conduct, speech, and experience
  that a community finds disturbing, distressing, or inconvenient. On this view the
  term is doing metaphorical work — it borrows the prestige and the exemption-from-blame
  of being sick and applies them to what are really problems of living, moral conflict,
  and deviance. He added that the stakes are not academic: the disease framing is
  what licenses involuntary commitment and the insanity defense, two practices Szasz
  thought medicine had no business running. He was careful to say this is not denial
  of suffering: Szasz allowed that people suffer terribly and may want help, and insisted
  only that the help be contracted for rather than imposed, as with any other adult
  service.


  (2) Marisol replied with the case she called decisive: general paresis of the insane.
  For decades it was a psychiatric condition — grandiosity, dementia, paralysis, death
  — until the spirochete responsible was identified and it became neurosyphilis, a
  plain brain disease. So psychiatric categories are syndromic and provisional: clinicians
  pick out a cluster of symptoms before anyone knows the mechanism. From this she
  concluded that Szasz generalizes illegitimately from we have not yet found the lesion
  to there is no lesion, which is the argument from ignorance with a clinical accent.


  (3) Nils said the case proves his side''s point rather than hers. He gave that pattern
  a name, the retirement problem: whenever a condition in the psychiatric roster acquires
  a demonstrable bodily mechanism, it is retired into neurology or medicine and stops
  counting as a mental illness. On his reading this shows that the category has no
  fixed membership; it names, at any moment, roughly the set of distressing conditions
  whose bodily basis we have not yet worked out — a residual class, defined by our
  ignorance. And a residual class cannot carry the weight Szasz''s opponents put on
  it, because the inference from this person has a mental illness to this person has
  a medical condition has no content until further notice; it is a promissory note,
  and the promissory note is what justifies coerced treatment in the present.


  (4) Marisol''s answer was that syndrome-first medicine is simply how medicine works,
  and that Szasz is holding psychiatry to a standard internal medicine has never met.
  Migraine, epilepsy, and the various fevers of unknown origin were all defined clinically
  long before their mechanisms and nobody concluded they were myths. More importantly,
  she said, disease does not require a lesion in the first place: a disease can be
  a dysfunction, a part or system not doing what it does in a normally functioning
  organism, and that notion applies as well to the systems that regulate fear, attention,
  mood, and reward as it does to a kidney. So Nils needs a second premise — that failure
  of a mental mechanism is not real failure — and she said he had not produced one.


  (5) Nils''s second premise was about anchoring. In the somatic cases, he said, the
  syndrome is anchored by involuntary bodily signs — a sustained temperature, an electrical
  storm on an EEG, an infiltrate on a film — while in psychiatry the anchoring items
  are conduct and reported experience, and whether those count as abnormal is settled
  partly by local norms about how much grief, fear, eccentricity, or religious enthusiasm
  is fitting. That is why, on his telling, the same phenomena can be a symptom in
  one setting and a vocation, a religion, or a poem in another, and nothing in the
  body adjudicates between those descriptions. He extended this to Marisol''s dysfunction
  account: to say a mechanism has failed you need a specification of what it is for,
  and for fear, mood, or attention we have no agreed specification — so dysfunction
  here quietly imports a contestable ideal of how a person ought to feel and attend,
  which is exactly the evaluative element Szasz said was being disguised as a diagnosis.


