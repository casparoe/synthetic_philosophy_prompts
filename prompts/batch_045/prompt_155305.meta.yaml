  eventually explained the whole pipeline mechanistically, attributions of belief
  to the persona would be shown to have been false all along. Assess (i)-(iii). In
  particular: does the intentional stance''s success depend on the design stance''s
  failure? And is there a tension between Dennett''s talk of ''real patterns'' and
  (ii)''s ''merely heuristic''?"


