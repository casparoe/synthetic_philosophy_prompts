  Proposed argument:


  Setup: Call the principle "No Aggregate Subjects" (NAS): there is no entity whose
  good is the sum of the goods of several people; goodness/badness attaches only to
  individual lives.


  (1) For any moral assessment of an outcome, the assessment must be answerable to
  each individual affected: an outcome can be better or worse only in virtue of being
  better or worse for someone.

  (2) "Better for someone" is always better for a particular individual; there is
  no one for whom an aggregate total is better, since no one lives the total.

  (3) Therefore the total (sum) of well-being has no moral significance: adding up
  gains and losses across people and choosing the largest total is a mistake — "a
  sum is not a state of anyone."

  (4) But: consider prudence. A single life is a series of temporal stages; at no
  stage does anyone experience the sum of the life''s pleasures and pains either;
  the unity of a life is, like the unity of a group, a matter of degree (relations
  of memory, intention, character, continuity).

  (5) So by (3)''s reasoning, the sum over a life has no significance either, and
  prudential trade-offs (enduring dentistry now for decades of dental health later;
  studying instead of gaming) are unjustified.

  (6) Yet prudential trade-offs are plainly justified; indeed the objector relies
  on them (the individual''s own good over time is what the objection is supposed
  to protect).

  (7) So the separateness-of-persons objection refutes itself: it proves far too much,
  since either aggregation is fine everywhere or it''s fine nowhere, and if it''s
  fine within a life, it must be fine across lives too (the difference being only
  one of degree).


