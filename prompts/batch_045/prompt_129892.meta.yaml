  I''m a high school senior writing a paper on whether utilitarianism''s habit of
  adding up everyone''s happiness is a mistake, and I''ve built an argument I now
  don''t trust, because it seems to hand the conclusion to utilitarians.


  The target is the objection that goes by the name "the separateness of persons":
  summing across people is supposed to be illegitimate because there is no one whose
  good the sum is — no one lives the total, only this person and that person live
  their own portions — so a larger total cannot be what makes an outcome better. I
  want to keep that. But here is my argument:


  (1) An outcome is better or worse only in virtue of being better or worse for someone.

  (2) When several people are better off by a little and one person is worse off by
  a lot, the improvement is had by the several and the loss by the one; the positive
  balance is had by nobody. By (1), then, a positive balance that nobody has cannot
  make an outcome better. So: no aggregation across persons.

  (3) What licenses aggregation within a single life — painful dental work now, decades
  of healthy teeth later; hours of practice, a recital much later — can only be the
  unity of a life, and the unity of a life is a matter of degree: the stage that sits
  in the chair is tied to the stage that enjoys the teeth by memory, intention, and
  character, and those ties come in degrees.

  (4) Degrees of unity do not stop at the skin. Consider the Pair: two sisters who
  since childhood have had each other''s experiences available to them in real time,
  who deliberate together about everything, share every plan, and have never formed
  an intention the other didn''t share. Now consider a single case: a woman at eighteen
  and the same woman at sixty-eight, who by then shares almost no memories, desires,
  or traits with the teenager, having been changed slowly, one small alteration at
