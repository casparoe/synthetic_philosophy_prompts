  \ non-perceptual grip on changes in the measured quantity.\n\nNow — is this a good\
  \ prompt for a model? Yes: it's a genuine design task with constraints, and the\
  \ model must then show each condition. Let me formalize the spec:\n\nSpecifications:\n\
