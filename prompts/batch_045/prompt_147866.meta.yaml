  I work in operations at a mid-sized company that recently routed most of its customer
  support e-mail through a language model assistant, and I spend a fair amount of
  my day reading transcripts of what it says to customers. A recurring argument in
  our Slack channel is whether the sentences it produces — "I understand how frustrating
  that has been," "I''m sorry, we shipped you the wrong part," "I checked and your
  refund was processed on Tuesday" — should ever be treated as reports of anything
  the system believes, knows, or intends. I came across the philosopher Daniel Dennett''s
  idea of the "intentional stance" in a podcast and found it helpful but too blunt
  for my purposes: it tells me that treating a thing as an agent with beliefs can
  be a useful predictive shortcut, but it doesn''t tell me which of the several quite
  different shortcuts I find myself reaching for, or which of them is going to get
  me or my company into trouble.


  So I have been trying to write down, from my own notes on the transcripts, a longer
  list of stances one can adopt toward such a system, and I would like you to rate
  them. Here is my list, with a one-line gloss of each:


  1. Physical stance — think about the model only at the level of voltages, GPU, weights.

  2. Design stance — predict from how it was built and what it was trained to do.

  3. Intentional stance — treat it as an agent with beliefs and desires; read its
  sentences as its reports.

  4. Simulator stance — treat it not as one agent but as a machine that can inhabit
  many simulated agents, so that no single one of them is "it."

  5. Corpus/echo stance — treat its output as a sample of what the text it was trained
  on would most likely say next, asked of no one in particular.

  6. Role stance — treat it as an actor playing whatever character the system prompt
  and the conversation have cast it as, and evaluate only the performance.

  7. Authorial-absence (cenotaph) stance — treat the output as an inscription left
  behind by absent human writers (the annotators, the prompt author, the user), with
  no speaker present at all.

  8. Attributive/legal stance — treat whatever it says as the statement of whoever
  deployed it, the way a company speaks through a press release.

  9. Adversarial stance — assume that any appearance of understanding, sincerity,
  or self-knowledge is optimized to be persuasive rather than to be true, and discount
  accordingly.

  10. Instrument-reading stance — treat its self-reports the way you''d treat a thermometer
  reading or a survey response: not authoritative about itself, but still evidence
  about something (here, about the text it was trained on and the prompt it was given).


  Two things I want, and I''d like them separate. First: score each stance from 0
  to 100 for how much predictive grip it actually gives someone in my job who is trying
  to anticipate, in advance, what the assistant will say in a new support conversation.
  Second: sort the same ten stances into three or four tiers by how much ethical,
  legal, or reputational risk you think my company takes on by relying on that stance
  when deciding what to do — for example, when deciding whether a transcript shows
  that we "knew" about a defect, or whether an apology from the assistant is a real
  apology, or whether a customer who says the assistant "promised" them something
  was promised anything at all.


  Give me the numbers and the tiers with a sentence or two of justification per stance,
  and don''t spread the first set of scores evenly — I want to know which of these
  stances you think is doing real work for someone in my position and which is mostly
  decoration. If you think a stance on my list collapses into another one, or that
  I''m missing the stance that would actually be most useful to me, say so and rate
  that instead.


