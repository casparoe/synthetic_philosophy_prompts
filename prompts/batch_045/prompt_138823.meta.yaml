  Then describe theory to use:


  "The theory to apply is the rational-herding or information-cascade picture. In
  its simplest form, agents decide in sequence after observing the choices of earlier
  agents. Each agent has a private signal about some underlying state—here, perhaps,
  the bank’s solvency or liquidity—and a prior. Because later agents can see what
  earlier agents did, they may rationally imitate them even when their own private
  signal points the other way, since the pattern of earlier choices can swamp a single
  noisy private signal. The result is a cascade: once enough people have withdrawn,
  everyone withdraws regardless of private doubts, and the cascade can be fragile
  or persistent depending on whether new public information arrives."


  Then inject niche/new idea:


  "I want you to add one wrinkle that the textbook version does not usually handle:
  suppose that for many retail depositors the act of queueing is not a final, irreversible
  withdrawal but the purchase of a cheap option. By joining the queue, a depositor
  keeps the ability to withdraw if the queues keep growing, while signaling nothing
  final to the bank; if the panic subsides, the depositor can quietly go home and
  leave the money where it is. Call this the reversible-queue or herding-option variant.
  In this variant, the public signal is not ''these people have withdrawn'' but ''these
  people are willing to be seen waiting''."


