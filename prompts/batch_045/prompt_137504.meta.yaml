  Full student answer draft:


  "The hypothesis is that thinking is computation over syntactically structured mental
  representations: Mentalese. It is not the claim that we think in English; Fodor''s
  point is that the vehicle of thought must be a symbol system, and that this system
  is innately specified rather than learned.


  The argument from productivity and systematicity runs as follows. There is no finite
  bound on the thoughts a thinker can entertain, and the abilities thinkers have are
  systematically related: anyone who can think that dogs chase cats can also think
  that cats chase dogs, and anyone who can think that John loves Mary can think that
  someone loves Mary. The best explanation is that mental representations have parts,
  that those parts are recombined according to rules, and that the content of the
  whole is a function of the contents of the parts. Systematicity therefore confirms
  the ambitious thesis: the format Mentalese must have the expressive power of a language
  with variables and quantifiers, since the only way to get from one thought to its
  rearrangement is to treat noun-phrases as bound and reordered variables. On the
  modest thesis, by contrast, there is no reason to expect this kind of systematic
  recombination at all, so the argument from systematicity does no work for it; the
  two versions really stand or fall together.


  The second argument concerns acquisition. Learning proceeds by forming and testing
  hypotheses, and formulating a hypothesis already requires a system of representation
  at least as expressive as what is being learned. So one cannot acquire one''s first
  representational system by learning; it must be innate. Fodor''s conclusion is that
  the basic stock of Mentalese is built in, and that children''s rapid acquisition
  of a public language is explained by the fact that learning English is largely a
  matter of mapping words onto concepts one already has. ...and this is why Fodor
  holds that creatures without a natural language — prelinguistic infants, nonhuman
  animals — cannot be credited with thoughts of the same kind at all, since they lack
  the combinatorial vehicle thought requires.


  The most serious challenge to this comes from connectionism. Fodor and Pylyshyn''s
  reply is decisive here: they showed that networks of the relevant kind are incapable
  in principle of the systematic generalization that thought displays, because distributed
  representations have no constituents to recombine. This is now generally accepted
  as having settled the dispute in favour of the classical architecture, and connectionist
  models survive only as accounts of how a classical architecture might be implemented
  in neural hardware."


