  I''m teaching a seminar on moral change this spring (mostly engineers, bless them)
  and I want to get better at arguing *for* the rationalist story against someone
  who actually knows the Williams material. So: play Bernard Williams — late Williams,
  say the mid-1990s, sharp, generous about small points, completely unmoved on the
  big one. You hold roughly this: the story the Enlightenment tells about itself —
  that moral progress is what happens when people finally reason properly and shrug
  off superstition — is flattering nonsense; we cannot suppose the slave-owner, or
  the officer who fights duels, was simply making an error of reasoning that you or
  I could point out from inside his own outlook; and once you''ve told a causal, genealogical
  story about how the change actually happened, it is a genuine and unsettled question
  what is left of our confidence that the old practice was wrong, and you don''t think
  there is a clean vindicatory answer available. Concede things a real Williams would
  concede (that reasons and arguments did causal work, that some internal critique
  is possible inside a going practice) but never concede that the change was *warranted*
  by reasons available to the people who changed. Reply in the first person, in a
  voice, about two paragraphs, no bullet points, no hedging boilerplate, no breaking
  character, no footnotes or citations — you can''t look anything up anyway. If you
  need a fact about my case, ask me for it the way Williams would. If I have mangled
  one of your examples or attributed to you a view you don''t hold, say so, in character,
  and then answer the corrected version. Take a beat to work out what you''ll grant
  me before you start.


  Here is my opening, and it''s a case I made up precisely so you can''t have a canned
  answer ready. Call it "the wintering." In a mountain valley — think somewhere in
  the Alps, roughly 1890 to 1935 — the eldest daughter of each household spent one
  winter alone in a stone hut above the treeline, and everyone involved, including
  the daughters, said she came back with a kind of standing in the village that she
  could not acquire any other way. It was understood, and written into the local custom,
  that the girl could refuse; the standing was supposed to depend on its being her
  act. Then, in about fifteen years, it stopped. Nobody was paid to stop; the harvests
  were the same; the young men were not suddenly scarce; no one came through with
  a new moral principle; and when the last women who did it were asked why they gave
  it up, none of them said anything like "we came to see that it was wrong." They
  said the hut was cold, that younger girls had begun to giggle about it, and — this
  is the line I keep coming back to — that they could not bear to be seen doing it.


  Now my objection, in two parts. First: this looks to me like a practice that refuted
  itself from the inside, which is exactly the rationalist story and none of yours.
  The custom said the standing had to be earned by her own act; the right to refuse
  was always part of it; and what actually happened is that the right to refuse stopped
  being notional, at which point nobody could any longer say what the practice was
  *for* — so what did the work was the inconsistency between the practice and a standard
  its own participants already accepted, and that is an argument, not a change of
  sentiment. Second, and this is the part I really want: even if you''re right that
  the giggling did the work, honor isn''t what''s doing it here. Honor, in the sense
  the honor thesis needs — the one Kwame Anthony Appiah has made much of, as I recall
  — needs a code and a constituency: a class of people whose regard you can lose,
  and a rule about what loses it. These women had no code and the people laughing
  at them were not their peers; being unable to bear being seen is embarrassment,
  which is thinner than honor, and it floats free of any standard. So you have a fourth
  thing on your hands — not argument, not interest, not honor — and if the mechanism
  of moral change is that thin, doesn''t your own question about what is left of the
  conviction get even harder to answer?


