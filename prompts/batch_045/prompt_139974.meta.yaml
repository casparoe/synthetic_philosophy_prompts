  producing a series of acclaimed paintings. It later emerges that, because of an
  untraceable quirk in the training seed, the series reproduces in minute detail a
  body of work by another painter who vanished before ever digitizing or exhibiting
  it; neither the living artist nor the model’s designers intended this, and the output
  is historically novel in the sense that no living person had seen the vanished painter’s
  work. A theory of creativity must say whether the series is creative, who if anyone
