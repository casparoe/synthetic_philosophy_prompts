  Draft:


  You are a professional philosopher who works on philosophy of medicine and philosophy
  of psychiatry, with a working knowledge of 20th-century antipsychiatry and the naturalism/normativism
  dispute about disease. Think carefully and, before you answer, spend some time brainstorming:
  enumerate candidate tensions freely, then filter. Structure your final answer as
  an audit.


  Then context: I''m a philosophy PhD student (4th year) writing a dissertation chapter
  on whether "mental illness" can be a natural kind, and my supervisor has asked me
  to write down my own position set so it can be attacked in my proposal defence.
  Here''s where I''ve landed...


  Commitments list (a)–(h) maybe 8 items. Then asks:

  1. Which pairs are in genuine tension, ordered by severity?

  2. For each genuine tension: state the tension in one sentence, say what has to
  give, and the cheapest revision and what it costs me (does it cost me a commitment
  I like, or a dialectical move in the chapter).

  3. Which apparent tensions dissolve, and why.

  4. Which single revision cleans up the most.

  5. Test my two novelties: the predicament-first vs mechanism-first distinction and
  the prevalence-invariance test — do they do work or collapse into something already
  on the table?


  Include instruction: don''t give me citations or a reading list (no library access
  where I''m writing), argue from the views themselves.


  Also: "assume I hold all of these simultaneously and don''t tell me which to drop
  first without ranking."


  Write it polished, first person, formal-ish. Length moderate-long.


  Let me set the beliefs precisely:


  (a) Realism, mechanism-first: Something is a disease only if there is an identifiable
  malfunction of a mechanism that has a biological function, where function is understood
  etiologically (selected-effects), not statistically. I''ll call this the mechanism
  criterion. I hold it for all of medicine, not just psychiatry.


  (b) Szasz''s historical claim: I accept the historical claim at the heart of Szasz''s
  1961 book — that the extension of "mental illness" in his time was fixed substantially
  by social deviance, institutional convenience, and the profession''s interest, not
  by pathological findings; and I think the fact that DSM categories are settled by
  committee vote is real (if weak) evidence that they still are.


  (c) But: melancholia. I want to say severe melancholic depression is a disease,
  on the mechanism criterion, while "major depressive disorder" as currently defined
  is not — because the criterion set is heterogeneous, threshold-based, and its boundary
  moves with referral and screening practices.


  (d) Neurodiversity: Autism and ADHD should not be called diseases; the impairment
  is largely a mismatch between a person''s traits and the demands of an environment
  we chose to build, and shifting the environment can remove the impairment.


  (e) Coercion without disease: I support compulsory treatment in a narrow set of
  cases, but I want to justify it without disease vocabulary: I propose that the state''s
  power be exercised through a "capacity tribunal" that asks only, in the domain at
  stake, whether the person''s practical reasoning is impaired enough that they cannot
  act on reasons they themselves endorse — with detention and treatment authorised
  separately, two different decisions by two different bodies (my "two-keys rule").


  (f) Veracity plus treatment: I think the serotonin/chemical-imbalance story is a
  misleading oversimplification at best, yet I think it would be a form of neglect
  to withhold medication from someone in a severe episode on the grounds that we don''t
  know the mechanism — and I think a physician should offer it.


  (g) Diagnostic insincerity: I think it is often permissible, and sometimes required,
  for a clinician to record a diagnosis they believe does not pick out a disease,
  because access to care and reimbursement are gated on it.


  (h) Meta: I think conceptual analysis of "disease" is nearly inert for policy; policy
  about coercion and resource allocation should be settled by consequences — suffering
  reduced, liberties curtailed — not by what "disease" means. And yet I also think
  a great deal turns on whether a condition is called a disease, because the label
  redistributes blame, obligation and standing.


  (i) My novelties: (i) predicament-first vs mechanism-first clinical kinds: a predicament-first
  kind is defined by a situation a person is in — can''t sleep, can''t stop drinking,
  hears commenting voices — and is vindicated only if intervenable mechanisms cluster
  under it stably enough to guide treatment; it need not name a single mechanism.
  (ii) The prevalence-invariance test: if a category''s extension would expand or
  contract merely because the social environment changed — without any change in anyone''s
  biology — then treat it as a predicament, not a disease.


  Tensions I want (genuine, non-obvious):

  - (a)+(c) vs (d): selected-effects function + environment-relativity → mismatch;
  modern environments are not the selectional environment, so a trait can be "dysfunctional"
  only relative to an environment, and melancholia vs ADHD line is unstable. Also:
  if impairment is environment-relative for ADHD, why isn''t melancholia''s impairment
  environment-relative too? Genuine, not obvious.

  - (a) vs (f): treatment responsiveness fails as evidence of disease under the mechanism
  criterion, yet my practice in (f) seems to rely on "it helps" — I owe an account
  of why offering an intervention is fine without a mechanism, and whether that account
  generalizes in a way that would force me to call more things diseases (or none).

  - (e) vs (d): capacity is domain-specific and environment-relative too; a capacity
  tribunal with the two-keys rule may end up authorising coercion against the merely
  unconventional/poorly accommodated — which is Szasz''s own objection reappearing
  in a non-medical vocabulary. Also (e) vs (a): if impairment of practical reasoning
  is itself a mechanism failure, the tribunal has sneaked disease back in under another
  name — which may be fine, or may collapse (e) into what it was designed to avoid.

  - (g) vs (b) and (h): if I criticise committee-negotiated categories while licensing
  clinicians to issue negotiated diagnoses for bureaucratic gatekeeping, I am endorsing
  the very mechanism of negotiation at the point where it does most work; and my (h)
  consequentialism about labels undercuts the complaint in (b) — or maybe it doesn''t,
  since (b) is an epistemic complaint about tracking, not a policy complaint. That
  one is a nice near-dissolve requiring discrimination.

  - (h) vs (g)/(b): if labels redistribute blame and standing (h''s second half),
  then conceptual facts about "disease" aren''t policy-inert after all — internal
  tension inside (h).


  Apparent tensions that dissolve:

  - (b) Committee negotiation + (a) natural-kind realism: dissolves — bad tracking
  ≠ conventional kind. The DSM''s vote is evidence about our access, not about the
  kind''s constitution. (A good answer should say this.)

  - (a) mechanism criterion + (c) no known mechanism for melancholia: dissolves via
  in-principle vs in-hand; also via the distinction between the criterion and our
  evidence for satisfying it.

  - (b) Szasz + (e) coercion: dissolves because Szasz''s target was medical disguise
  of coercion, and (e) removes the disguise — but only if the capacity test really
  isn''t a disguised disease test (which is where it turns into the genuine tension
  above). Nice: one pair that both dissolves and doesn''t, depending.


