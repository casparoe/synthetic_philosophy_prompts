  Student answer draft:


  "The two accounts differ about whether function is a historical or a current-causal
  property. On the etiological (selected-effect) account, defended by Wright and developed
  by Millikan, the function of a trait is the effect for which ancestral tokens of
  that trait were selected: the heart''s function is pumping blood because pumping
  blood is why hearts were favoured by selection. So function is a relational, backward-looking
  property; two organisms can be molecule-for-molecule identical in the present and
  yet differ in function if their causal histories differ. On Cummins''s causal-role
  account, by contrast, to ascribe a function to a part is to say what it contributes
  to some capacity of a containing system that we want to explain: functional analysis
  decomposes a complex capacity — circulation, say — into the simpler capacities of
  the parts (pumping, valve-regulation, oxygen uptake) and ascribes each part the
  role it plays in producing the whole. Function is thus answerable to the current
  organization of the system and to the explanatory interests of the investigator.


  The cases bring out the difference. In the synthetic-cell case, the engineered transporter
  has no history of selection at all, only a designer''s intention; the causal-role
  account straightforwardly gives it the function the designer gave it, whereas the
  etiological account appears forced to say that the transporter has no function until
  enough generations have passed for its effects to be selected. Likewise, in the
  duplicated-enzyme case, the enzyme''s original selective history is for metabolising
  a sugar, and on the etiological account that is what its function is, period — so
  the account cannot say that it now functions to confer antibiotic resistance, even
  after several hundred generations of exposure to the antibiotic. Since the resistance-conferring
  role is the one doing the explanatory work in the population biologist''s model,
  this shows that the etiological account gets the case wrong, which supports (T).


  It is often said that the great advantage of the etiological account is its treatment
  of malfunction: a heart that cannot pump is still a heart with the function of pumping,
  precisely because it is a token of a type whose effects were selected for, and that
  is exactly what makes it defective rather than merely different. The causal-role
  account can only say that a diseased heart lacks the relevant capacity, and so has
  no function at all, which fails to capture the normative dimension of function ascriptions.
  Cummins''s account also faces the well-known problem of proliferation: the heart
  makes sounds, jostles neighbouring tissue, and occupies space, and if function is
  just causal contribution to a system, all of these are functions. The appeal to
  the investigator''s interests is what is supposed to narrow the set, but that just
  makes function ascriptions dependent on what we happen to care about.


  Finally, the suggestion that the two accounts answer different questions does not
  really help. Cummins''s functional analysis tells us how a system currently works;
  the etiological account tells us why it is there. But once we see that, we can simply
  ask which question biology actually asks, and the answer is clear: working biologists
  identify functions by looking at what a part currently does in the containing system
  and never by reconstructing a selective history. So the different-questions move
  collapses back into the causal-role account, and (T) should be accepted."


