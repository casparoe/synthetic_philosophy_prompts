  Prompt design (type: what does a practice presuppose):


  Asker: someone (say, a civil servant / policy adviser, or a graduate student) puzzling
  over an inconsistency: European law mandates and synchronises leisure; Japanese
  law compensates death from overwork but... The apparent inconsistency: labour law
  treats leisure as something the state must guarantee (35-hour week, right to disconnect,
  mandatory paid leave, Sunday closing) yet simultaneously treats overwork deaths
  as *compensable accidents* rather than, e.g., crimes or as failures of the worker''s
  own choice — workers choose overtime (service overtime, sabisu zangyo, unpaid),
  and the law compensates the consequence of a choice. Also: the same legal systems
  that cap hours exempt salaried/managerial employees (e.g., France''s cadre forfait-jours
  / "forfait jours" up to 218 days per year; US FLSA exempt "white collar" employees;
  Japan''s 2019 "highly-skilled professional" exemption — "高度プロフェッショナル制度"). So: hours
  protection is denied precisely to the highest-paid workers. What theory of leisure
  does that presuppose? — that leisure is for consumption/rest, and high-status workers
  don''t need protection because their work is intrinsically rewarding / they have
  autonomy? Or that they can be trusted to bargain?


  Also: the "Protestant work ethic" element — Weber''s claim that the modern attitude
  treats work as a duty/calling, so that the demand for more work is not just about
  money but about moral worth; and that this makes hours regulation seem like a limit
  on virtue. And note the puzzle: if the work ethic is right that work is a calling/duty,
  then legally mandating leisure looks like mandating vice; if leisure is mere recuperation
  for future productivity (as in the "work harder" / Ford''s five-dollar day and the
  creation of the weekend — Ford instituted the five-day week in 1926 partly to give
  workers time to consume), then mandated leisure is justified instrumentally, not
  as an end. So the practice''s implicit theory is ambiguous between: (a) leisure
  as intrinsically valuable, (b) leisure as recuperative input to productivity, (c)
  leisure as a positional/status good that individuals can''t secure by themselves
  (collective action problem), (d) leisure as a good whose value depends on synchronisation
  with others.


  Injected novel idea: "synchronised leisure" / "co-presence" — the value of free
  time depends on whether the people you''d spend it with are free at the same time;
  hence the law''s focus on weekends, holidays, Sunday closing, and now "right to
  disconnect" — all synchronising devices. Test: if leisure were merely recuperative,
  staggering hours would be as good as or better than synchronising them (it would
  spread congestion); the fact that the law synchronises suggests it presupposes the
  co-presence view. Counter-consideration: staggering is also resisted for other reasons.


  Second injected idea: "the temporal Gini" or "dispersion": average hours can fall
  while inequality in leisure rises (the "time bind" — some work long hours while
  others want more hours). A cap on the *average* (35 hours) does nothing about dispersion.
  So the 35-hour week presupposes that what matters is the mean, not the distribution;
  and it presupposes that hours are the right metric rather than intensity or autonomy.


  Third: "the exemption for the highly paid" — what does that presuppose?


  Also the karoshi practice: recognising overwork death as a compensable work injury
  presupposes that the worker''s own consent to overtime doesn''t extinguish the employer''s
  responsibility — i.e., it rejects pure voluntariness, in contrast to the law''s
  general treatment of assumed risk. And yet it treats the harm as compensable by
  money rather than criminal, unlike e.g. industrial safety failures. Also karoshi
  requires a threshold of hours — presupposing a dose-response model with a threshold,
  and that "karoshi" is a distinct ontological category (death by overwork) rather
  than merely a statistical excess.


