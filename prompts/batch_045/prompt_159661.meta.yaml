  I write about science and ideas for a magazine, and I am working on a long piece
  about how the question of responsibility for the First World War gets re-litigated
  whenever a great-power crisis appears — not as history for its own sake, but as
  a template people reach for when they want to say whether a rival power is, or isn''t,
  "the one that wants this." What has struck me, reading across the historiography,
  is that the argument itself is frozen: Fischer''s thesis in the early 1960s, the
  reaction to it, the later "sleepwalkers" reading, the rejoinders to that, and the
  continually renewed claim that all the powers share the guilt. Same documents, same
  quotations from the same memoranda, same conclusions. New monographs are absorbed
  into one camp or the other without denting either.


  Set out the camps concretely:

  1. The German-primacy camp: Berlin gave Vienna a blank cheque and used the July
  crisis to force a war it had decided was necessary, a preventive war justified by
  a closing window of power; domestic pressures made a "flight forward" attractive;
  the same disposition is visible in the December 1912 meeting of the Kaiser with
  his service chiefs and in the September 1914 list of war aims.

  2. The diffusion camp: nobody in authority wanted a continental war; each capital
  made a local, defensible decision under severe uncertainty, misread the others''
  signals, and took risks it did not understand; Serbia''s entanglement, Russia''s
  mobilization, France''s blank cheque, Germany''s support of Austria, Britain''s
  ambiguity — the outcome is an emergent product of a system, not the execution of
  a plan.

  3. The skeptics: the counterfactual "what if Berlin had restrained Vienna" is unfalsifiable;
  the archives will never settle it; the argument is really about how much weight
  to give to documents of intent, whether a memorandum is evidence of intention or
  of self-dramatizing talk, whether a political system''s structure or its leaders''
  beliefs do the explanatory work.


  My hypothesis: the word responsibility is doing three jobs at once and the sides
  are answering three different questions under one name: (a) causal pivotalness —
  whose action, if deleted, would have prevented the war, given that several actions
  were individually sufficient and none was necessary; (b) wrongful initiation — who
  did the thing that counts as starting it, mobilizing or declaring first, and whether
  that is a normative or merely a conventional marker; (c) blameworthiness — who acted
  with foresight, with alternatives, in an official role, and is therefore open to
  moral criticism rather than mere causal explanation. And behind all three, a fourth
  difficulty I have not seen handled well: whether "Germany" or "Russia" or "France"
  is the kind of thing that can be responsible at all, when the decisions were made
  by a handful of men who disagreed with one another and whose interaction produced
  something none of them exactly chose. If that is right, the debate is stalled because
  participants keep scoring points on one question and claiming victory on another;
  if it is wrong, I want to know what the real structure is — whether it is a difference
  in evidentiary standards, in what counts as a historical cause, in the priors each
  side brings about how states behave, or in the present-day policies each answer
  is heard as licensing.


