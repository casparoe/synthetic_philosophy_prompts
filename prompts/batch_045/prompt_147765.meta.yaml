  Each guild accepts disks only because it believes that the next guild in a fixed
  cycle — fishers to grain growers to potters to weavers to metalworkers and back
  to fishers — treats disks as sacred objects that that guild wants for their own
  sake, for use in its ceremonies. No guild treats disks that way. Every guild''s
  belief about the next guild is therefore false. But every guild''s weaker belief
  — that the next guild will in fact hand over goods in exchange for disks — is true,
  and has been true as long as anyone can remember. Nobody tests the stronger belief,
  because anyone who wants grain simply takes disks to the grain growers, who accept
  them. Twice in living memory a guild has found out that the next guild does not
