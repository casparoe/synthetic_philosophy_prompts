  Actually, there''s a well-known taxonomy: (1) Aggregate/Utilitarian: numbers count,
  save the many. (2) Numbers count only as tiebreaker among equals (Taurek''s actual
  view? Taurek says numbers don''t count at all; he says each has equal claim, flip
  a coin / give each an equal chance). (3) Taurek: give each an equal chance of survival
