  The questions I want the tree to be built around, at minimum:


  1. Whether the fact that there are five rather than one bears on what the rescuer
  ought to do at all.

  2. Whether, if it bears at all, it settles what she must do or only what she may
  do.

  3. Whether the numbers do their work through outcomes (more people alive at the
  end) or through chances (each person''s prospect of being saved).

  4. Whether it matters that reaching the five requires letting the one die rather
  than doing something to him.

  5. Whether it matters that all six will in any case die soon, or that the one is
  already worse off than the five.

