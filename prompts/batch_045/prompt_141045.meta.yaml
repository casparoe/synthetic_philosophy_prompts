  many others are saved. Most of the club arrives certain that saving the five is
  obviously required, and a few arrive certain that it isn''t, and neither camp can
  say much more than that. So rather than another summary of the debate, I''d like
  to build something that sorts people by what they think about cases instead of by
  which side they walked in on — a decision tree they can walk through in ten minutes.


