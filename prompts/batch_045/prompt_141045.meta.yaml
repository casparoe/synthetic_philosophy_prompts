  five is permissible if it''s the only way to give all an equal chance? Actually
  Taurek: it doesn''t matter to each individual whether others are saved, so save
  the one, or flip a coin. (4) Kamm''s "irrelevant goods"/ "the numbers count but
  only via the ''greater good''"? (5) The "Personal Point of View" / "each-person
  standpoint" (Otsuka? or "Hirose"?). (6) Equality-based: save the many because it
  minimizes inequality in chances—Temkin? Actually Temkin on "equality vs. priority".
  (7) Contractualist "justifiability to each person" (Scanlon/Parfit) — saving the
  many is justifiable to each. (8) The "numbers count only when each would lose the
  same amount" view. (9) Sufficiency/prioritarian: weight by worse off. (10) "Deontic
  egoism"? no.


