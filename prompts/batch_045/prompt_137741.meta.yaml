  argument rather than from the bare theorem". That''s an asker belief, not asserted
  fact — safe and it gives the guest something to react to. Good.

  8. What would falsify it? What empirical or axiomatic finding would make her drop
  λ=0 or abandon partitioning?

  9. The "identity is special" move vs. ex post vs ex ante: does she think the fairness
  term should apply to *expected* utilities (ex ante) or to realized utilities (ex
  post)? If ex post, the functional is not separable across states and her representation
  theorem (which is over expected utility vectors) doesn''t capture ex post fairness
