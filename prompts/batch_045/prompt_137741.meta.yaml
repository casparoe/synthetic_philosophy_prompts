  that pins the form down? Is the representation *the* theorem or *a* convenient functional?
  Ask for the axiom that delivers MAD specifically (she probably has "decomposability
  across pairs" or "linearity in pairwise gaps"). Follow-up: if the axiom is just
  as contestable as independence, what has been gained over Diamond''s bare rejection?

  5. Is the whole thing still utilitarian? Where does that leave her with respect
  to the *point* of Harsanyi''s theorem — that it was supposed to derive utilitarianism
  from weak premises? If λ and the weights are free parameters fixed by moral stipulation,
  is the "theorem" doing any work, or is it just a convenient parameterization? Follow-up
  on her likely "it shifts the burden: you only need to fix n+1 numbers".

  6. Variable population / average vs total: does the dispersion term create a repugnant-conclusion-like
  problem of its own, or a "reverse repugnant conclusion" (prefer fewer people for
  equality)? What''s her answer about different-number cases, given the theorem''s
  fixed-population assumption?

  7. Harsanyi''s own move: he distinguished the aggregation theorem from the "impartial
  observer"/equiprobability argument and (I believe) conceded the aggregation theorem
  alone doesn''t give equal weights. Hmm, risky to assert in prompt. I can frame it
