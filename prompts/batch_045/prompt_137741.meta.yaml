  That gives lots of pressure points:

  1. Does the state/identity distinction survive? In the veil-of-ignorance model,
  who-you-are IS just another state, and the observer''s uncertainty about identity
  is modeled as a lottery over states. So partitioned independence requires the social
  ordering to depend on *how* the lottery is generated (its source), not just on the
  resulting probability distribution over outcomes — i.e., it''s a source-dependent
  preference, like ambiguity/Ellsberg-type source preference. Follow-up: if she accepts
  source-dependence, why not also for state uncertainty (e.g., a hurricane vs. a market
  crash)? Follow-up to her likely answer "because identity is special: fairness is
  about persons, not states" → press: then the view needs an account of what makes
  a partition of states "identity-constituting."

  2. Diamond''s objection resurfaces: does the dispersion term actually deliver the
  coin-flip preference? Mean absolute deviation of expected utilities: for the coin
  flip, each person gets 0.5 in expectation; for "give to A", A gets 1, B gets 0.
  D for coin flip = 0; for giving = 0.5·... With equal weights, mean = 0.5 either
  way; MAD for coin flip = 0, for certainty = 0.5. So yes, coin flip wins with λ>0.
  Good. But the catch: does it violate stochastic dominance or ex post Pareto? D reduction
  could prefer a prospect that''s worse for everyone? Actually subtracting dispersion:
  could it prefer a prospect where everyone is worse off and more equal? Yes — e.g.,
  leveling down. Press: does her functional ever recommend levelling down (making
  everyone worse off but more equal)? That''s a classic. Follow-up: she''ll probably
  say "only in expectation under the veil" — press.

  3. Interpersonal comparability / anchor normalization: the anchor-gamble normalization
  is a substantive moral stipulation dressed as measurement; Sen''s point that you
  can''t get comparability from within-person preferences alone. Also the anchors
