  Student''s answer (I paste it):


  Answer (about 700 words):


  "Reductionism is the claim that when I believe something because you told me so,
  my justification isn''t basic — it has to come from somewhere else, ultimately perception,
  memory and inference. The Humean version says we learn from experience that testimony
  tends to line up with the facts, and that our confidence in what we''re told is
  really confidence in that correlation. Anti-reductionism says no: testimony is a
  genuine, independentsource of justification, we have a default entitlement to accept
  what people tell us, and we''re justified unless we have a defeater. The two views
  disagree about whether testimonial justification is derived or immediate.


  (a) Local reductionism says that for me to be justified in believing what S tells
  me, I need reasons bearing on S specifically — I''ve seen S get things right, I
  know S is honest, and so on. Global reductionism says I only need general reasons:
  testimony in general is reliable, people in general are honest, and that''s enough;
  I don''t need anything about this particular speaker. The strongest objection to
  reductionism is the one from novices and children. Very young children believe what
  they are told constantly, and we think they are justified, but they have neither
  speaker-specific evidence nor the general evidence — they haven''t run any kind
  of survey of how often testimony is true, and couldn''t. If reductionism were true,
  children and newcomers to a field would almost never be justified in what they learn
  from others, which is absurd. So the reductionist is committed to saying that most
  of the testimonial knowledge in the world isn''t really knowledge, and that''s too
  high a price.


  The bifurcation view says: where the content is the kind of thing the hearer could
  in principle check for herself, reductionism is right, and where it isn''t, the
  anti-reductionist is right. I think the view collapses into plain reductionism,
  because there''s basically nothing a hearer can''t verify — with enough time and
  training I could learn the physics, or go to the archive, or build the instrument,
  so every piece of testimony falls on the reductive side of the line and the second
  branch is empty. That means the bifurcation view is extensionally the same as reductionism,
  and it inherits the novice objection. Also I don''t think the view can be right
  to seperate the two halves, because it has to treat testimony as two different kinds
  of thing depending on content, whereas really testimony is one natural kind and
  our entitlement to it shouldn''t vary with whether we happen to be able to check
  this particular claim.


  One more problem: on the bifurcation view, the second branch is anti-reductionist,
  and the anti-reductionist''s default entitlement isn''t defeated by general evidence
  about the speaker, since defeaters have to be about the particular claim being made.
  So the bifurcation view says that in those cases a hearer who knows the speaker
  is unreliable is still justified in believing her, which is clearly wrong. So the
  view is worse off than either of the views it''s made of."


