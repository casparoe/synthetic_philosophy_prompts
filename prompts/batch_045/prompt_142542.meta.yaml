  The domain: Are dreams experiences? Norman Malcolm (1959, "Dreaming") argued, on
  Wittgensteinian grounds, that dreams are not experiences — the concept of dreaming
  is derived from dream-reports, and the criterion for "I dreamt that p" is just the
  sincere report; there''s no experience during sleep. Dennett ("Are Dreams Experiences?"
  1976) argued for the opposite, defending the "cassette theory" of dreaming (dreams
  are experiences, sequences of experiences stored and replayed), against Malcolm''s
  and Wittgenstein''s view. Dennett''s argument: the conceptual point that there''s
  no way to check whether the dream occurred as reported doesn''t show dreams aren''t
  experiences; also Dennett argued that the "cassette theory of dream presentation"
  is in fact empirically refutable and that there are facts of the matter — he argues
  the issue is empirical, not conceptual, and can be settled (he suggests the "cassette
  theory" is empirically testable and probably false, and offers his "cassette theory
  of dream composition" — dreams composed at the moment of waking). Also relevant:
  the "bold investigator" thought experiment, REM sleep research (Dement & Kleitman
  1957), lucid dreaming, dreaming in sleepwalking, and the philosophical literature
  on whether dreams are experiences (e.g., Windt, "Dreaming: A Conceptual Framework
