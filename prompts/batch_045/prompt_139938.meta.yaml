  benefits. Non-compliance is taking advantage. So: must tip where tips are how servers
  get paid (you benefited from the service under a scheme whose terms include tipping);
  must queue where a queue exists (you benefit from others'' restraint); may skip
  the tip where service is included (you paid the price, no benefit accepted under
  the scheme); may jaywalk on an empty street (no cooperative scheme, no one''s restraint
  benefits you); must not follow the local custom of underpaying the guide (you''d
  be taking advantage, not complying).


  R2 (Coordination / mutual-benefit): You owe compliance when your deviation would
  make things worse for others in a way that matters — undermine a scheme that solves
  a coordination problem, create risk, or impose costs. Similar predictions. Need
  divergence.


  R3 (Resentment / "what locals can reasonably expect"): A visitor should follow a
  convention when locals would be reasonable in expecting it, i.e., when their expectations
  are grounded in the practice; mere etiquette that locals are relaxed about generates
  nothing.


  R4 (Law-plus / institutional): Follow the rule that''s actually in force (law, posted
  rule, contract) plus ordinary politeness; local custom is only evidence of what''s
  polite, and politeness is optional-ish.


  Divergence case: a convention that is (a) not law, (b) universally followed by locals,
  (c) but the costs of your violation fall on someone who isn''t local / who didn''t
  choose the scheme; or (d) the convention is one you''d be complying with, but compliance
  makes you complicit in something bad; or (e) the convention is new and in flux,
  so "locals do it" and "locals reasonably expect it" diverge.


