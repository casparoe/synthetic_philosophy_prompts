  they do this even in the familiar, uncomfortable cases where the person now seems
  content, no longer recognizes her family, and would, if asked, refuse to be killed.
  But the same framework is much less willing to honor the earlier self''s positive
  requests: an advance directive asking to be admitted and medicated during a future
  psychiatric crisis, or asking for a treatment the clinical team now regards as futile,
  is typically treated as advisory and set aside. So deference to the earlier self
  runs strongly in one direction and weakly in the other.


  My question is what view of the earlier self''s authority this asymmetry commits
  us to. In particular, must a system that honors prior refusals hold that the earlier
  and later self are the same person or the same agent in some demanding sense — psychological
  continuity, or a narrative unity-of-a-life view — or can it get by with something
  metaphysically lighter: the thought that a life is one thing to be governed, or
  that the earlier self is simply the most reliable evidence about what the later
  one would value? Is one principle doing all the work here, or is the practice quietly
  running an identity-based account for refusals and a welfare- or interests-based
