  not be which reason the agent had, but whether the right-making reason was load-bearing:
  would she have done the same thing if that reason had been absent? Consider a lifeguard
  who rescues a rival only in order to beat him later, a cashier watched by a camera
  who would have given correct change anyway, and someone who does the right thing
  while sincerely believing it to be wrong. Does the doctrine''s implicit theory have
  resources for these, or does it simply refuse the question?


  I do not want a recommendation for any case and I do not need citations. I want
  the implicit theory stated, the rival views it quietly rules out identified, the
