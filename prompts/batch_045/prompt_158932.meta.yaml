  I sit on a volunteer board that reviews applications for early release, and almost
  everything we do turns on why the applicant acted as she did — whether she now grasps
  the harm, whether she has stopped making excuses, whether the same pressure would
  produce the same act again. The trial that sent her there ran on the opposite principle.
  As I read the transcripts, the prosecution had to prove nothing about her ultimate
  reasons, and the jury was directed that a good motive is no defence and a bad motive
  no aggravation: the person who kills to end suffering commits murder; the person
  who steals to feed her children commits theft.


  Yet the same system is not consistent about this, and I would like the implicit
  theory reconstructed rather than defended. It cares intensely about whether she
  meant the result, foresaw it, or acted in order to bring it about; burglary requires
  an ulterior purpose; duress and self-defence are available only if the threat or
  the attack was what actually moved her, so that a person who would have acted anyway
  gets nothing; an honest and reasonable mistake about the facts excuses, while a
  mistake about the law generally does not; penalty-enhancement statutes add years
  precisely for bigoted reasons; and no one may claim payment for doing what one was
  already legally bound to do, even as the system pays bounties to informants and
  honours those who did more than was required.


  So: what view of blameworthiness — or of the worth of an action, or of credit —
  does the trial-side doctrine presuppose? Does it presuppose that the moral standing
  of what someone does is fixed by the act and what was foreseen, and not at all by
  why? Or can a view on which reasons are central explain the doctrine some other
  way, as caution about evidence, or as a limit on what the state may coercively examine?
  Please keep separate three questions I keep running together: whether the act was
  wrong, whether the agent is blameworthy, and whether the agent deserves credit —
  and tell me which of them the doctrine is actually about, and whether the trial
  and the parole board are answering different ones.


