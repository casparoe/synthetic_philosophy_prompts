  of the problem form, (ii) recurrence of opportunity for the same agents, (iii) recurrence
  of the payoff structure — and use them to separate "genuine conventions" from what
  I call quasi-conventions: single-instance regularities whose compliance is explained
  by backward-looking reasons (a prior promise, a constitutive rule, a precedent one
  is bound by) rather than by forward-looking mutual expectation?


