  Question: Does the Lewisian account of convention (roughly: a regularity in behavior
  that is arbitrary, sustained by common knowledge of it and by each agent''s preference
  to conform given others conform, in a recurrent coordination problem) require that
  the coordination problem recur at the level of *particular agents*, or only at the
  level of situation type? And if only at the type level, does the account retain
  any purchase on the normativity of one-off or terminal norms — cases where a regularity
  has, or will have, exactly one instance in the relevant population?


