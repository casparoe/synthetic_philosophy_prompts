  needed; you don''t need to suppress anyone''s option to act, just correct each person''s
  threshold. Others say the analogy licenses the opposite: a hard veto/near-unanimity.


  Ask: audit. Mapping table (bidders ↔ agents capable of acting alone; common value
  of the item ↔ the value of the action, shared by all; private noisy estimate ↔ each
  agent''s private judgment; the winner = highest bid ↔ the agent whose optimism triggers
  the action; the overpayment ↔ the harm). Where it breaks: in an auction the winner''s
  curse harms the winner and the seller gains, and bidders know they''re in a max-selection;
  in the unilateralist case the person who acts is not the one who bears the loss
  (the loss is collective / borne by others), the "seller" analogue is the world,
  and there''s no single selection event... hmm, actually the key disanalogies:


  1. In the winner''s curse, the selection is "the highest bid wins" — one winner.
  In the unilateralist case, the selection is "the action happens if *anyone* acts"
  — also a max, so it maps. But: bidders compete; agents may not even know others
  exist / may act simultaneously, and the action is not exclusive.

  2. Payoff structure: in an auction, the winner pays and the loss is private; the
  winner''s curse is self-correcting in expectation because bidders internalize their
  loss and can shade. In the unilateralist case the actor externalizes most of the
  downside onto everyone, so there''s no self-correcting incentive — shading has to
  be imposed by a norm rather than arising from prudence. This is a big one: it means
  the "just shade" fix lacks the mechanism that makes it work in auctions, and also
  there''s a moral hazard / free-riding aspect.

  3. Asymmetry: in the unilateralist case the relevant domain is often acts with catastrophic
  downside but modest upside (the asymmetry between "creating a pandemic" and "curing
  a disease"), and the winner''s curse in auctions is symmetric — you can also underbid
  and lose. There''s no analogue of "the option to act is itself the hazard" — the
  curse comes from ease of unilateral action, not from aggregating estimates.

  4. Correlation of errors: the winner''s curse result depends on errors being (roughly)
  independent conditional on the true value; if agents share information sources,
  or if the most optimistic are also systematically the least expert / or the most
  optimistic are correlated, the standard shading formula (conditional-on-winning
  correction) miscalibrates. In the unilateralist case, the person who most wants
  to act may be the one with the most idiosyncratic stake bias.

  5. Auction has a principal/known rules and repeated play, feedback; unilateralist
  cases are one-shot, no feedback, no way to learn the error distribution. (This is
  a big one: "shade" requires knowing the distribution of your own error, which you
  can calibrate in repeated auctions but not in a one-shot existential decision.)

  6. The winner''s curse is about overpaying for something you get; the unilateralist
  curse is about producing an outcome nobody chose — the aggregation failure is not
  estimation but decision-aggregation. Also there''s a "veto" asymmetry: in the unilateralist
  case, the reverse case (anyone can veto a good action) is symmetric in form but
  not in payoff — so the analogy is silent about when the max-selection is fine.


