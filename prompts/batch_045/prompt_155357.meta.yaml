  ---


  I am applying for a one-year postdoctoral fellowship and need a two-page proposal
  (about 1,200 words) on the political theory of constitutional monarchy in contemporary
  democracies. I will supply the references myself, so please write the proposal without
  citations or a bibliography: name positions and arguments, not authors and titles,
  except where a name is genuinely unavoidable.


  My half-formed idea is this. The familiar defences of a hereditary head of state
  — that it separates national solidarity from partisan contest, that it supplies
  a non-partisan arbiter, that it is cheap, that it guarantees continuity — all seem
  to me to fail at the same point: none of them explains why the office should be
  filled by inheritance. An elected figurehead with a long non-renewable term, a life-tenure
  office filled by supermajority, or a sortition-based head of state could apparently
  do the symbolic work. What heredity might uniquely supply, I suspect, is not symbolism
  but a particular structure of incentives around the powers the monarch formally
  retains but never uses: assent to legislation, appointment or dismissal of a government,
  dissolution. Those powers do their work, if they do any work at all, by not being
  exercised; but a power that is never exercised is only a deterrent if some agent
  is credibly willing to exercise it, and in a mature constitutional monarchy exercising
  it would very likely trigger the crisis that ends the monarchy. The power is thus
  self-consuming in roughly the way a nuclear threat is: usable only by someone prepared
  to destroy the standing that makes it usable. I want the proposal to develop this
  into a real argument rather than a metaphor, and I want it centred on the question
  whether heredity specifically solves, or merely cosmetically covers, that credibility
  problem.


  Please do the following in the proposal.


  1. Separate three questions that I keep conflating: the design question (should
  the office exist and be hereditary?), the convention question (what should the unwritten
  rules be about exercising the reserved powers?), and the legitimacy question (can
  a democracy contain an office filled by birth?). State the project''s question so
  that it picks one of these as primary and has a determinate answer.


  2. Explain why the existing answers leave it open, including why the "self-consuming
  power" framing isn''t already answered by the standard debates about deterrence
  or about judicial review. A referee on an earlier draft said my idea "reduces to
  the question whether any unaccountable power can ever be justified, and has nothing
  specially to do with monarchy." Answer that objection in the proposal rather than
  ignoring it.


  3. Confront a wrinkle that I think is fatal if unhandled: heredity secures an interest
  in the continuation of the dynasty, not in the constitution. A monarch might use
  the reserved powers to protect the monarchy — against a bill to abolish it, say
  — which would make dynastic self-interest a corrupting rather than stabilising motive.
  Say whether the account should treat this as a bug, a feature, or an unavoidable
  cost, and what follows either way.


  4. Method, month by month, for one year. Note the methodological crux: by hypothesis,
  the behaviour that matters is almost entirely absent from the historical record
  in stable monarchies, since the powers are never exercised. So what kind of argument
  could settle the question at all? Explain why the approach you recommend — comparative
  institutional analysis of non-monarchical analogues with reserve powers, equilibrium
  or credibility modelling, analysis of the near-miss cases where vice-regal representatives
  did act, conceptual work on the difference between a legal power and a conventional
  power, or something else — is better than the obvious alternatives, and how much
  of the year each stage should take.


  5. Say what the possible conclusions are, what would decide between them, and —
  honestly — what would count as the project failing. I would rather see a proposal
  that says "this fails if the credibility argument can be run identically for a life-tenure
  elected figurehead, in which case heredity does no justificatory work" than one
  that only describes success. Also say what would make the project too big for a
  year.


  Two working assumptions, which you should flag in one sentence if you think they
