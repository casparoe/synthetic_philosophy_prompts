  ---


  I''m in a small graduate reading group in philosophy of biology, and for our last
  meeting we''ve set ourselves an exercise that I initially thought was frivolous
  but now think is genuinely difficult, and I''d like your help with it. The question
  is what Charles Darwin himself — not "Darwinism," not what a modern textbook asserts
  about what selection acts on — would have said about the units-of-selection dispute,
  given that he died before Mendel''s work was generally read, before the word "gene"
  existed, and before anyone had separated the question of what selection acts on
  from the question of what is reliably transmitted across generations. Two things
  in his own writing make this non-trivial for me. First, in the Origin, when he confronts
  the sterile worker castes of social insects — the case he treats as the most serious
  special difficulty for his theory — he seems to me to say that the difficulty is
  lessened or removed once you allow that selection can act on the family or community
  and not only on the individual organism. Second, in the Descent of Man, in his discussion
  of the moral faculties, he appears to reason that a high standard of morality gives
  little or no advantage to an individual man and his children over other men of the
  same tribe, yet gives an immense advantage to one tribe over another. My supervisor''s
  view is that these are just isolated lapses into group-thinking in an otherwise
  thoroughly individual-level theorist; someone else in the group says they show Darwin
  was a multi-level selectionist avant la lettre and that it is only the modern synthesis
  that made everybody forget it. I don''t want to settle that by appeal to labels.


  So here is the case we invented for the session, which I''d like you to apply him
  to. Suppose a long-running evolution experiment with microbes (or, if you prefer,
  digital organisms) in which two levels of selection are deliberately pitted against
  each other: within each local group, a "hoarder" type that keeps a public resource
  to itself outreproduces a "sharer" type that releases the resource, but groups containing
  more sharers grow faster and are more often the founders of new groups. The results,
  suppose, are these three. With frequent mixing between groups the hoarder type fixes
  in every replicate and the population then collapses. With rare mixing, sharers
  are stable and, over the whole collection of groups, the sharer type ends up more
  common than it began. And when the experimenters delete the group-level founding
  events entirely while leaving everything else, including the supply of new mutations,
  untouched, the hoarder fixes anyway — but the total population is smaller at the
  end than at the start. Suppose also that these organisms swap small functional modules
  sideways between living individuals, so that there is no tidy lineage of genes to
  track: heritable variation is transmitted, but not by anything that looks like a
  genealogy of particles.


  What I want from you is a reconstruction, not a verdict on who is right. Tell me
  how Darwin, working with the materials he actually had, would describe what is going
  on in that experiment: would he count the competition between groups as natural
  selection in the same sense as the competition within them, or as something else
  — a separate principle, or a mere consequence of individual-level processes — and
