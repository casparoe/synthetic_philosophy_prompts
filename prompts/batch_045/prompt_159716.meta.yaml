  writing a thesis chapter / teaching). Type: read fiction through a philosophical
  lens. Domain: Taurek / numbers.


  Content plan:

  1. Context: PhD student, final-year seminar or thesis chapter on the numbers question;
  considering Le Guin''s "The Ones Who Walk Away from Omelas" (1973) as a teaching
  text alongside Taurek.

  2. Frame the worry: the story is often wheeled out as a straightforward anti-utilitarian
  illustration; I think that''s too easy, and I want a reading that takes both seriously.

  3. Inject the structural mismatch: Taurek''s case is a rescue case — five vs one,
  both already imperilled, you can help only one; the child in Omelas is not merely
  not-rescued but kept in misery as the condition of the city''s joy, and the joy
  wouldn''t exist otherwise. Ask: is "numbers don''t count" a claim with scope beyond
  rescue? What bridge principle is needed?

  4. Inject the novel idea: the rotation lottery — suppose the city replaced the single
  lifelong victim with a lottery in which each citizen (including, say, each citizen
  in turn) spends a fixed period in the closet, so that the burden is shared and each
  bears an equal expected share. Does Taurek''s positive/fairness claim (equal chances)
  require this? Is it an improvement? Or is it a case where equalising chances is
  not equalising *harm*, because the child''s harm is the destruction of a whole life
  (a ruined developmental trajectory) whereas a year or two of misery for an adult
  is a bounded episode — so the lottery is not really an equal-chance arrangement
  at all but a dilution that produces many small ruins instead of one great one? Ask
  whether that shows aggregation sneaks back in.

  5. The walkers: they leave, and the narrator says the place they go to is even less
  imaginable than the city of happiness; their exit does nothing for the child. What
  is the status of exit? Is it coherence/ integrity (walking away from complicity)
  or is it, on a Taurekian view, a moral mistake — since no one is permitted to abandon
  the one whose claim is as strong as anyone''s? Or does Taurek''s permission (you
  may save whomever, you''re not required to save the many) generate a permission
  to stay? Ask which reading the story supports and whether the story takes a position
  at all — note the narrator''s refusal to describe the destination, and the story''s
  refusal to say whether the walkers are admirable.

  6. Also: ask what the story adds that the argument doesn''t — e.g., the phenomenology
  of knowing participation: the citizens'' happiness is undiminished by knowledge
  of the child; the story asks whether a benefit that rests on someone''s ruin can
  be good at all. And the demand that the reader choose (the narrator''s challenge).

  7. Epistemic request: give a definite reading — commit to whether the story vindicates,
  complicates, or fails Taurek; say which scenes to point a seminar at; flag where
  the reading leans on a contested interpretation of Taurek (e.g., whether his positive
  claim is equal chances or a permission) and where my framing may be imposing on
  the story. Don''t catalogue options.

  8. Constraints: don''t quote, don''t give bibliography.


