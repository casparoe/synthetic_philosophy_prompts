  My team does safety reviews for deployment, and there''s an argument we keep having
  about "low-impact" / side-effect penalties that just never resolves, and I want
  a diagnosis rather than another survey.


  Setup as I understand it. You want an agent that achieves its objective without
  rearranging the rest of the world in ways you didn''t ask for. The obvious move
  is: pick a baseline of what would have happened if the agent sat there (inaction
  baseline), pick a distance on world states, penalize deviation. That immediately
  breaks in two ways everyone knows: it penalizes the agent for succeeding (fetching
  the coffee is itself a huge deviation), and it makes the agent indifferent between
  letting a vase fall and catching it, since under inaction the vase breaks anyway.
  So people moved to capability-style measures: don''t measure how much the world
  changed, measure how much the agent''s power to achieve a broad spread of possible
  goals changed, and penalize that. Which fixes the vase but introduces offsetting
  — the agent can create new options somewhere else to pay for the ones it destroys
  — and it still needs you to pick the spread of possible goals and the baseline policy,
  and the answer swings wildly on that choice.


  And then the third thing: every time someone publishes a new measure, someone else
  publishes a new failure case, and then another measure. It''s been like this for
  years and nobody has moved. My colleague thinks it''s terminal — she says there''s
  a theorem-shaped reason no such measure can work, roughly that any impact measure
  is either so value-laden that you''ve just written down your utility function in
  disguise, or so value-free that it''s exploitable/constant, with nothing in between.
  I half believe her but I also think "there''s a no free lunch theorem" is one of
