  Hmm, honestly, Rawls''s domain gives a nice in-the-weeds question: does the cake
  analogy support equality rather than the difference principle? The difference principle
  permits inequality only if it benefits the worst off. In "I cut, you choose," the
  cutter ensures equal halves — that yields equality, not maximin-with-incentives.
  And the difference principle is about the basic structure, primary goods, and the
  "chain connection"/"close-knitness" assumptions. Also Rawls''s parties are behind
  a veil but they know general facts about psychology and economics; they are mutually
  disinterested, not envious. Cake-cutting''s two-person, zero-sum, no-production
  structure is a huge disanalogy: Rawls''s original position is about a cooperative
  scheme producing a surplus where incentives matter (the difference principle is
  justified partly by the idea that inequalities can be incentives that raise the
  least-advantaged share). Also: cake-cutting is about dividing a known fixed thing
  among actual individuals with known preferences; the veil is about choosing rules
  for a society where you don''t know who you''ll be — including whether you''ll be
  talented, and even your conception of the good. And there''s the "one person vs.
  many" issue: in "I cut, you choose," the cutter''s advantage is eliminated by the
  chooser''s option; in the veil, there is no separate chooser — nature assigns you
  a place. So it''s really a one-person decision under uncertainty (a "veil" version
  of cake cutting would be: you cut the cake, then you''re randomly assigned a slice
  — which actually gives you a motive for equality, and if slices can differ in kind
  and you''re risk-averse... hmm, actually with equal-probability random assignment
  and risk aversion you''d want to maximize the worst slice? No — you''d want to maximize
  the worst slice only under maximin; expected utility would maximize average, which
  for a fixed cake means any division is equal in total, so it''s about variance:
  risk aversion → equality. Interesting: the difference principle is NOT the outcome
  of expected-utility maximization behind a veil with equal probabilities — Rawls
  argues for maximin because probabilities are unknown/unknowable and stakes are high.
  That''s a great in-the-weeds point: with a veil you cut, then get a random slice;
  the analogies: maximin vs. expected utility; the "unknown probabilities" justification;
  and the fact that Rawls''s own argument (maximin under uncertainty) is what the
  cake picture hides, because cake-cutting with a random assignment is just risk aversion
  over a fixed total, giving equality, whereas the difference principle allows unequal
  shares when that''s better for the smallest slice.


