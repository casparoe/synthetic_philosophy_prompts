  Let me try Aumann + proves-too-much, with a subtle flaw. Design:


  Asker: I got into a years-long argument with my brother-in-law about [something].
  Recently read about Aumann. Built this argument:


  (1) Aumann''s agreement theorem: if two agents have a common prior and their posteriors
  are common knowledge, their posteriors are identical.

  (2) Two rational agents who have heard each other''s evidence and trust each other
  will converge; disagreement among apparent peers is therefore always evidence of
  irrationality or of a hidden difference in priors.

  (3) Priors are not rationally constrainable (any prior is permitted by Bayesianism),
  so a difference in priors is not itself a rational defect.

  (4) So when a disagreement persists, the only diagnostic available is that at least
  one party is processing evidence badly or isn''t really sharing evidence.

  (5) Now apply to the disagreement about the theorem itself: philosophers/economists
  disagree about how much weight the common prior assumption carries.

  (6) By (2)-(4), that disagreement shows someone is irrational or has different priors...
  which is fine (3) — so the theorem tells us nothing about actual disagreements,
  since prior-differences always explain them and priors are unconstrained.

  (7) Therefore the agreement theorem is empirically empty / has no bite on real disagreements.

  (8) But that can''t be right: the theorem is supposed to be the central result about
  disagreement.

  So: where does it go wrong?


  Candidate flaws: (a) The move from "priors may differ" to "prior differences always
  explain persistent disagreement" ignores that the common prior assumption is an
  idealization about a *shared* evidential situation — i.e., in Aumann, priors are
  over the same state space and are common; a "difference in priors" is itself a form
  of disagreement that needs explaining (the standard move: prior differences are
  just disagreements pushed back a stage; Harsanyi''s doctrine says prior differences
  must come from differences in information/life history, which can be modeled as
  posteriors from a common prior). That''s a real, meaty point — the "common prior"
  isn''t as unconstraining as it seems once you model differences via Harsanyi. So
  step (3)/(6) is where it goes wrong: the slide from "priors are unconstrained by
  rationality" to "invoking a prior difference costs nothing," because on a Harsanyi-style
  view prior differences must be traceable to different evidence, which re-imports
  the disagreement at the prior stage and the theorem bites again (though now about
  the "ur-prior"). Also (b) the equivocation between "common knowledge of posteriors"
  and merely "hearing each other''s evidence" — the theorem needs common knowledge
  of the posteriors themselves, which is much stronger than hearing the evidence;
  iterated exchange matters and can fail. (c) There is also the point that disagreement
  can persist after conditioning on the event that you disagree (the "disagreement
  is itself informative" point) — i.e., conditioning on the partition cell where your
  posteriors differ can legitimately change your posterior; Aumann says this happens
  with probability zero, but with approximate/common-p-belief versions (Monderer–Samet)
  it doesn''t. Hmm, careful with attributions. Also (d) the idealization: the theorem
  assumes the agents'' information partitions and the whole model are common knowledge.


