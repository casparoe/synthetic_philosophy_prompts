  first ten minutes, that this is just the hard problem in a new hat, and I don''t
  know whether to head that off before I let them grant the micro-subjects, or to
  use it, or to just concede half of it and move on.


  Second, the carrying example. I''ve been toying with a wall of a thousand tiny screens,
  each showing something different, and asking what would have to be true for it to
  be correct that the wall itself is watching one thing. I half like it and half don''t:
  I think it sneaks in a second-order watcher standing behind the screens, and it
  makes combination look like it happens somewhere, in a space, when part of the point
  is that there''s no room for it to happen in. Tell me what the one example has to
  do and what it has to avoid, and either fix mine or replace it. Misconceptions I''m
  expecting, in rough order: toaster consciousness; "it''s just parts making a whole,
