  moves have to come in and what depends on what, and how much time each bit deserves
  out of the 45.


  Here''s my rough sense and where I think it breaks. I want to start by getting them
  to *grant* the micro-subjects as a dialectical move — you accept tiny subjects somewhere
  at the bottom because it''s meant to get you out of the hard problem, not because
  you like it — and only then spring the combination problem as the bill coming due.
