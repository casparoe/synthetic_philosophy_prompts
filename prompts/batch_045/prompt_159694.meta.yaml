  Prompt draft:


  "I''m writing a paper for an ethics journal on prioritarianism and the levelling-down
  objection, and I want to use Ursula K. Le Guin''s short story ''The Ones Who Walk
  Away from Omelas'' as the case that the paper is organized around, rather than the
  usual stylized examples. So I need a reading of the story that is serious about
  both sides.


  The setup, as I read it: everyone in Omelas enjoys a rich, genuinely good life,
  and the whole of that felicity — the beauty of the city, the health of their children,
  the quality of their friendships — is said to depend entirely on one child kept
  in a closet in a basement, in filth and near-total neglect, terrified, and degraded
  to the point of being barely a person. Nearly all the citizens are taken to see
  the child; most are initially shocked and then come to accept the bargain. A few,
  young, walk out of the city into the darkness and do not come back, and the narrator
  says nothing about whether the child is helped or whether Omelas changes.


  What I want from you:


  1. Why prioritarianism is the natural lens here and where it bites. Prioritarianism
  gives extra weight to benefits to the worse off and, unlike an intrinsic egalitarianism,
  has no problem saying that levelling down is not an improvement. But Omelas is precisely
  a case where improving the worst-off person''s condition is not a free lunch: on
  the story''s own terms, taking the child out of the closet destroys the felicity
  of everyone else. So the structure is: one person at the very bottom rises enormously,
  and a large population falls, though nobody is said to fall below the level of a
  decent life. Run the numbers structurally: at what size of population and what shape
  of priority weighting does the verdict flip, and is the flip a feature or a reductio
  of the view? I''m interested in whether Omelas exposes the same aggregative insensitivity
  to the worst off that prioritarianism was supposed to fix, or whether it exposes
  something else — an ambiguity about whether the priority view is person-affecting,
  comparative, or purely additive.


  2. The variants that the story does not give us, and which I want you to construct
  and use as probes. (a) The misery is divisible: instead of one child, a hundred
  children each kept in a fraction of the misery, with the city''s felicity depending
  on the total rather than on any one bearer. Does the same weighting give the same
  verdict? (b) Rotation: the same total misery is distributed over time, every citizen
  taking a turn as the child for a year, so that at any moment one person is at the
  bottom but over a life everyone is. (c) A version in which the child''s condition
  is unknown to the citizens and the dependency runs on their belief that it is there,
  not on its actual state. For each, say what a prioritarian should say and, more
  importantly, what the divergence between the variants shows about whether the view
  is tracking a person''s level, a person''s claim, or a distribution''s shape.


  3. The walkers-away, and the option the narrator leaves out. The people who leave
  do not free the child; on the most natural reading nothing about Omelas changes
  and the child is no better off. Is that a morally significant act or merely expressive?
  Prioritarianism has no obvious room for it, and I want you to say whether that is
  a gap in the view or a point in its favour. Note too that the story''s own framing
  — the child''s terror and degradation are described as having partly destroyed its
  capacity for the richer goods it is deprived of — complicates any simple ''the worst
  off has the strongest claim'' line, since on some readings the size of the loss
  depends on capacities the arrangement itself has destroyed.


  4. Where to stop. I don''t want the story reduced to an illustration and I don''t
  want the view bent to fit the story. Tell me which of the story''s features are
  doing philosophical work and which are narrative scaffolding that a paper should
  not lean on — the unseriousness of the utopia, the ritual of being taken to see
  the child, the narrator''s own uncertainty about where the walkers go. And tell
  me honestly whether anything survives: does the story give us a reason to accept
  or reject anything about prioritarianism and levelling down that the stylized examples
  involving blindness don''t, or is it only a memorable way of staging the aggregation
  problem?"


