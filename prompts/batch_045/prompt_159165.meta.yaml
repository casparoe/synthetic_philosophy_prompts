  Student answer draft:

  "Aristotle''s account of money and exchange contains two complementary parts. In
  Politics I he argues that the household''s natural art of acquisition, oikonomia,
  aims at self-sufficiency and is limited by real needs. By contrast, chrematistics,
  especially the retail trade and lending at interest, aims at unlimited monetary
  gain, which is unnatural because the goods'' natural use is bounded. A shoe has
  two uses: its peculiar use, being worn, and its use in exchange. Barter that exchanges
  surplus for missing necessaries, such as wine for corn, is not contrary to nature;
  it replenishes natural self-sufficiency. But once money is introduced, the art of
  business arises: money is a portable, easily handled commodity, at first defined
  by size and weight and later stamped to indicate amount. This innovation makes possible
  retail trade aimed at profit, and eventually usury.


  In Nicomachean Ethics V Aristotle treats justice in exchange as proportionate reciprocity
  rather than arithmetic equality. A builder and a shoemaker do not exchange identical
  products; their association requires that their different products be equalized.
  Aristotle represents this with a figure in which builder is to shoemaker as house
  is to shoes (or shoes to house), and the exchange is just when the diagonal proportion
  holds. Because a house and a number of shoes are not naturally commensurable, the
  community introduces money as a middle term. Money measures all things and thus
  makes them commensurable, allowing the proportion to be expressed and exchange to
  take place.


  Crucially, Aristotle says money is nomisma: it exists by nomos, not by nature, and
  can be altered or made useless at will. This shows that money is a human convention.
  However, the real bond of exchange is chreia, need or demand: if no one needs anything
  from the other, no exchange occurs. Money is a conventional symbol that represents
  demand; it also serves as a guarantee of future exchange, since someone who has
  no present need can accept money now and use it later. Thus Aristotle rejects the
  crude conventionalist reading: exchange ratios are not arbitrary or purely revisable,
  because they must track the real demand that holds the community together. But he
  also rejects the opposite reading: money is not a passive veil, because without
  a conventional measure the incommensurable products could not be equalized and exchange
  would not happen. Money''s conventionality is therefore essential to its measuring
  role.


  Given this, Aristotle''s condemnation of usury follows directly. Money was invented
  to measure exchange and to satisfy needs indirectly. Interest, or tokos, is money
  born of money: the lender gets back more money than he gave, as if money could breed
  like livestock. Since money''s only natural function is to serve exchange, and not
  to produce offspring from itself, usury is the most unnatural form of wealth-getting.
  The borrower''s need (chreia) may be real, but the lender''s profit does not answer
  to any need for use; it is a limitless increase of the measure itself. Aristotle
  therefore hates usury most because it mistakes a conventional measure for a natural
  source of growth.


  In sum, the two readings each capture half of the truth. The conventionalist reading
  rightly notes that money is not natural, but wrongly infers that exchange value
  floats free of need. The ''veil'' reading rightly notes that need is the real bond,
  but wrongly treats money''s conventionality as unimportant. Aristotle''s own view
  is that a conventionally instituted measure is required to make need effective across
  incommensurable goods, and that treating this measure as if it had a nature of its
  own — capable of growth — is the root error of usury."


