  Student''s answer:

  Aristotle''s treatment of money and exchange has two complementary parts. In Politics
  I the household''s natural art of acquisition, oikonomia, is directed to self-sufficiency
  and is limited by real needs; by contrast chrematistics, especially retail trade
  and lending at interest, is directed to unlimited monetary gain and is therefore
  unnatural. The distinction is illustrated by the famous example of a shoe. Every
  article of property has two uses: the use peculiar to it, such as wearing a shoe,
  and the use not peculiar to it, such as exchanging the shoe for money or food. Barter
  that exchanges a surplus for a missing necessary, for instance wine for corn, is
  not contrary to nature; it exists to replenish natural self-sufficiency and is not
  yet an unnatural art of wealth-getting. When communities begin to import and export,
  however, money is devised: a portable commodity such as silver, at first measured
  by size and weight and later stamped to indicate amount. This makes possible the
  art of business aimed at profit, and ultimately usury.


  In Nicomachean Ethics V justice in exchange is proportionate reciprocity. A builder
  and a shoemaker do not exchange identical products, so their association requires
  that their different products be equalized. Aristotle represents this with the proportion
  builder : shoemaker :: house : shoes, so that the relative worth of the producers
  is mirrored by the relative worth of their products, taken in the same order. The
  exchange is just when the diagonal proportion holds. Because a house and a number
  of shoes are not naturally commensurable, the community introduces money as a middle
  term. Money measures all things and thus makes them commensurable, allowing the
  proportion to be expressed and exchange to take place. Money also serves as a guarantee
  of future exchange, since a person with no present need can accept money now and
  use it later.


  Crucially, Aristotle says money is nomisma: it exists by nomos, not by nature, and
  can be altered or made useless at will. This shows that money is a human convention.
  The real bond of exchange, however, is chreia, need or demand: if neither party
  needs anything from the other, no exchange occurs. Money is a conventional symbol
  that represents this demand. Yet because chreia is itself the natural need that
  goods answer to, the measure is not wholly artificial: the ratios are fixed by the
  natural usefulness of the goods in relation to need, and money, as a conventional
  measure, simply registers a commensurability that is already present in nature.
  Thus Aristotle rejects the crude conventionalist reading, Reading A: exchange ratios
  are not arbitrary or merely revisable, because they track real demand. But he also
  rejects the opposite reading, Reading B: money is not a passive veil, because without
  a conventional measure the incommensurable products could not be equalized and exchange
  would not happen. Money''s conventionality is therefore essential to its measuring
  role.


  Given this, Aristotle''s condemnation of usury follows directly. Money was invented
  to serve exchange and to satisfy needs indirectly. Interest, or tokos, is money
  born of money: the lender receives back more money than was given, as if money could
  breed like livestock. Since money''s only natural function is to serve as a measure
  of exchange, and not to produce offspring from itself, usury is the most unnatural
  form of wealth-getting. The borrower''s need may be real, but the lender''s profit
  is a limitless increase of the measure itself rather than a return for any use of
  a real good. Aristotle therefore hates usury most because it mistakes a conventional
  measure for a natural source of growth.


  In sum, the two readings each capture half of the truth. The conventionalist reading
  rightly notes that money is not natural, but wrongly infers that exchange value
  floats free of need. The veil reading rightly notes that need is the real bond,
  but wrongly treats money''s conventionality as unimportant. Aristotle''s own view
  is that a conventionally instituted measure is required to make need effective across
  goods that are not strictly commensurable, and that treating this measure as if
  it had a nature of its own, capable of growth, is the root error of usury.


