  Exam Question (instructor-written):

  "Aristotle argues both that money exists by convention (nomisma, from nomos) and
  not by nature, and that the ultimate bond of exchange is need or demand (chreia).
  He also claims that money makes goods commensurable and serves as a ''guarantee''
  or pledge of future exchange. Some readers conclude that, for Aristotle, exchange
  ratios are therefore merely conventional and politically revisable, with no grounding
  in the goods exchanged or in human needs. Others conclude that, since Aristotle
  says need is the real standard, money is a purely passive veil and its conventionality
  is philosophically unimportant.


  Drawing on (a) the argument of Nicomachean Ethics V on proportionate reciprocity,
  commensurability, and the role of money, and (b) the treatment of the two uses of
  a shoe, barter, retail trade, and usury in Politics I, assess these two readings.
  In particular: Does Aristotle''s conventionalism about money imply that exchange
  value is arbitrary? What work does chreia do in his account, and how is it related
  to the conventional measure? Why, given this account, does he condemn usury (tokos)
  as especially unnatural? Be precise about the steps of the argument and about where
  the two readings go wrong."


