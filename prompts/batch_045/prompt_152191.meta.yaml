  Draft:


  "Write a philosophy essay, at roughly 1,200–1,600 words, on the following question.


  Theories of emotion are usually tested against episodes: a sudden fear, a flash
  of irritation, a burst of grief. But a great deal of emotional life is not episodic.
  Someone can love a friend, resent a sibling over a childhood slight, be proud of
  a city, or dread a diagnosis, for years on end, while having no occurrent emotional
  experience of the matter at all — often for months at a time. Call this the standing-emotion
  problem: any adequate theory must say what it is for a standing emotion to be possessed
  between episodes.


  The three standard families of theory are:

  (1) feeling theories — an emotion is, constitutively, an experience of one''s own
  bodily changes;

  (2) perceptual (or attitudinal) theories — an emotion is, constitutively, an experience
  in which an evaluative property of some object is presented to one;

  (3) judgement theories — an emotion is, constitutively, an evaluative judgement
  or the assent to an evaluative proposition.


  Each of them faces the standing-emotion problem, and each has an apparently easy
  reply: treat the standing emotion as a disposition — a disposition to undergo feelings,
  to have evaluative perceptions, or to make evaluative judgements, as the case may
  be.


  Your task is to assess whether that dispositional reply works, and what follows
  for the choice between the three theories. In particular, I would like you to weigh
  the following considerations.


  1. Symmetry and discrimination. If all three theories can avail themselves of the
  dispositional move, the standing-emotion problem apparently cannot decide between
  them. Is that the right conclusion, or does the move cost one theory more than another?
  Note that the three resulting dispositions are different dispositions, and that
  the question remains which one is constitutive of the standing emotion: to resent
  one''s sibling is apparently to be disposed to resent, not to be disposed to have
  just any old feelings or to make just any old judgements.


  2. Correctness conditions. Standing emotions are assessable for intelligibility
  and proportion — a decades-long resentment may be pointless, or wildly disproportionate
  to its occasion — and this assessability is often offered as an argument against
  feeling theories and in favour of judgement or perception theories. Does the standing
  case add anything to the episodic case here, or does it merely repeat it?


  3. Finks, masks and the merely hypothetical. Standard worries about dispositional
  analyses apply: a person might resent her sibling and yet be constitutionally incapable
  of ever feeling, perceiving or judging accordingly — say because she takes a beta
  blocker that flattens the bodily response, or because she has trained herself out
  of the relevant reactions without thereby ceasing to resent him. If a theory has
  to cash out ''she resents him'' as a counterfactual about what she would do under
  some test condition, it needs some way of handling cases where the would-be manifestation
  is prevented or destroyed by the test itself. Which of the three theories, if any,
  has the resources to do so?


  4. The analogy with standing belief. The distinction between occurrent and standing
  emotions looks structurally like the distinction between occurrent and dispositional
  belief, and philosophers have had a great deal to say about the latter. Does that
  analogy illuminate the standing-emotion problem — for instance, by suggesting that
  an emotion is a state with a functional role rather than a disposition to manifest
  — or does it mislead, by assimilating emotions to a category whose intentionality
  is, arguably, quite different in kind?


  The essay should not end on a non-committal note. Having weighed the arguments,
  defend one of the following verdicts (or, if you think none fits, say plainly what
  you do conclude): that the standing-emotion problem refutes feeling theories; that
  it refutes judgement theories; that it refutes neither and is genuinely theory-neutral;
  that it is best answered by a hybrid view on which standing emotions are dispositions
  of a distinctive, irreducibly emotional kind; or that the problem is really an argument
  for pluralism about ''the emotions'' rather than for any single theory.


  End the essay with a final line in exactly this form, and nothing after it:


  \answer{label}


  where label is one of: refutes-feeling-theories, refutes-judgement-theories, theory-neutral,
  hybrid-dispositional, or pluralism. The paragraph immediately before that line should
  state the verdict in one sentence and give its single strongest justification."


