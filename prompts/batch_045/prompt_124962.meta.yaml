  ---


  I''m a third-year undergraduate in a seminar on Rousseau''s political thought, and
  next week I''m responsible for leading one 50-minute discussion section on the Letter
  to d''Alembert on the Theatre. Rather than present the argument, I want the section
  to stage it. I need a runnable activity...


  Constraints: 18 students, 50 minutes, one seminar room with a table we can push
  to the wall, no projector, no money, no real stakes beyond a genuine but small optional
  action I can arrange with a local organisation...


  The three theses I want them to arrive at from inside:

  (1) Rousseau''s inversion of catharsis: the theater discharges pity where it is
  safe, so that we leave with the passion spent and no residue for action — the tear
  we shed over Phèdre is a tear we don''t shed over our neighbour; the emotion is
  complete in itself and asks nothing further.

  (2) The scandal of the actor: the actor''s excellence consists precisely in not
  feeling what he represents; his art is the art of counterfeiting, and we pay him
  to do what would be despicable in life. (Diderot made this notorious later; I don''t
  want the section to depend on the priority dispute.)

  (3) The proposed alternative is not "better plays" but a different structure of
  attention: public festivals in the open air, with no stage and therefore no spectators,
  where the people are at once performers and audience, and the spectacle is of themselves.


  What I want from you: rules, materials, minute-by-minute timeline, roles, debrief,
  what goes wrong, and what the activity cannot reproduce.


  Specific design demands:

  - No up-front lecture. They should not hear "sterile pity," "catharsis," or "impartial..."
  [no] until debrief.

  - Two conditions in sequence with the same group (no between-subjects split; I only
  get 18 people). The first is a spectacle (a few performers, the rest an audience
  confined to watch and applaud); the second is a participatory sequence with no spectator
  position at all (everyone doing the same simple thing at the same time — a song,
  a shared meal, a circle). Both must end in the same real opportunity to do something
  that costs about half an hour, and the only thing I measure is how many follow through
  (anonymous, no pressure, opt-in). I want them to feel the gap between how moved
  they were and what they did, and to argue about whether the gap means what Rousseau
  says it means.

  - The acting block: the same four lines read twice under two instructions (feel
  it / make us feel it) with a vote and a report from the performer about which was
  easier to sustain.

  - I want one role card that isn''t in the reading: someone in the second condition
  instructed to refuse to join — to stand aside and watch. I''ve been worrying that
  the festival is the riskier half of the argument, not the safer one: a gathering
  with no spectators has no place for the person who dissents, and the unanimity it
  produces is exactly what the theatre''s ironic distance protects against. I want
  that objection produced inside the exercise rather than named by me, and I want
  the debrief to say honestly what to do with it.

  - Debrief: map moments onto theses; say which of the three theses the exercise actually
  earns and which it merely illustrates; note what will go wrong (bad acting kills
  condition one; someone guesses the hypothesis; demand characteristics; the pledge
  measure will be tiny and noisy; the second condition contaminates the first / order
  effects) and how to handle each; and tell me what I must supply in the last 8 minutes
  because the activity structurally cannot show it — I assume this includes the fact
  that Rousseau''s claim is about mores formed over generations and a small republic,
  not about a single afternoon, and something about why he thinks the division into
  actors and spectators is itself the political harm, not just the content of the
  plays.


  Length/format guidance: I''d like it organized so I can run it from the page...


