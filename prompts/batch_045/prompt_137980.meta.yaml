  since the words are all we have — the same book. My question: is his Quixote Cervantes'',
  or Menard''s, or neither, and why isn''t the answer ''it''s all three, so the date
  does no work at all''? Because if the date does no work in my case, then Menard''s
  superiority doesn''t come from time at all, and it''s just the reader''s knowledge
