  call a locally checkable answer, and a large and important class of questions don''t.
  Call a question locally checkable if there is a decomposition into steps such that
  (a) each step is individually checkable by the judge with better-than-chance reliability,
  and (b) the judge can tell when a decomposition is complete. Holistically checkable
  questions are ones where the only thing the judge could in principle check is the
  whole answer at once, and where the judge''s reliability on the whole is not better
  than chance. Examples: math proofs (locally checkable), long-run policy forecasting,
  historical counterfactuals, most questions about what a complicated system will
