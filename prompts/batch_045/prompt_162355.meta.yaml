  ---


  I''m a research engineer on the safety team at a mid-sized AI lab, and in ten days
  I present to the lab''s internal deployment review board — the body that decides
  whether a system we''ve built with ordinary current methods (large-scale pretraining,
  RLHF-style post-training on human preferences, some rejection sampling / RFT, tool
  use, and a system prompt plus monitors around it) is allowed to ship to a customer-facing
  product. Twenty minutes of talk, forty of questions.


  My thesis: for systems built by current methods, alignment should stop being treated
  as a property of the trained model and become a property of the deployed scaffold,
  certified as a reliability contract rather than argued for as a doctrine. More precisely:
  the failure modes we actually observe are competence failures, not incentive failures
  — the model generalizes a badly-specified objective into regions we wouldn''t endorse,
  or degrades in distribution tails we never sampled, and it does this visibly and
  inconsistently rather than hiding it the way something with a cross-situational
  goal would. Because competence failures are relational — they are facts about a
  system in an environment, not about a matrix of weights — the model should be treated
  as an untrusted but not adversarial component, characterized only relative to a
  maintained, deployment-representative evaluation suite and to runtime monitors with
  stated error budgets, and re-validated on every scaffold change. Because the object
  is the scaffold, the safety case doesn''t port: it expires. And because non-adversariality
  is what licenses us to skip control-theoretic machinery, it is an empirical assumption
  with a shelf life, to be re-tested at each capability jump rather than assumed once.


  My claim about insight: none of this needs a new theory of value or agency. The
  binding constraints are infrastructural (building and maintaining suites that track
  a moving deployment distribution without becoming the training target) and institutional
  (someone has to have the authority to block a ship, and written guarantees create
  legal exposure). That is the part I expect to be fought hardest.


