  no mechanical system of reasoning can settle everything, a recursively self-improving
  AI can never fully verify its own successors, so there is a hard, principled ceiling
  on how far automated mathematics and self-improvement can go, and anything that
  looks like progress past that ceiling must be either unsound or stuck at the same
  place. A second member of the group grabbed the same analogy and ran it in the opposite
  direction: if every fixed formal system leaves something out, and human mathematicians
  can apparently see that the leftover sentence is true, then whatever mathematicians
  are doing cannot be mechanical at all. I noticed both of them were treating the
  mapping as obvious and never actually wrote it down, and when I tried to I got stuck
  almost immediately.


  So I''d like an audit of the analogy rather than a verdict on the theorems themselves.
  Please give me an explicit table of correspondences — what plays the role of the
  machine, the input, the halting/looping outcome, the decider, and the diagonal construction
  on each side — and then tell me which rows are exact, which are loose, and which
  are pure decoration. In particular I can''t tell where the following fit: (i) the
  halting problem is about one fixed procedure deciding a property for every program-input
  pair, while incompleteness is about a fixed computably axiomatized theory strong
  enough to encode arithmetic failing to decide some one sentence; (ii) the Gödelian
  limitation seems to be a package deal of three properties — mechanical axiomatizability,
  consistency or omega-consistency, and completeness — so that a complete arithmetic
  is available the moment you give up soundness, and a sound complete one is available
  if you give up being mechanical (the set of all true sentences of arithmetic); an
  AI that merely conjectures and is sometimes wrong looks like it opts out of the
  package entirely, which makes me suspect the "ceiling" claim is importing a requirement
  of soundness that nobody argued for; (iii) not all independent sentences seem to
  behave alike — the Gödel sentence for a theory, the assertion that the theory is
  consistent, and set-theoretic statements known to be undecidable from the usual
  axioms (which nobody agrees have a determinate truth value) all get lumped together
  as truths we can never prove, and I suspect that lumping is doing a lot of work
  in the argument; (iv) my group also got onto the move where you notice the undecidable
  sentence is true, add it as a new axiom, and repeat — one person says this shows
