  use broadest class; narrow classes are where inside-view contamination sneaks in
  and where you can pick your class to get the answer you want), whereas (2) says
  narrow by mechanism. Actually the standard tension: broad reference classes have
  statistical reliability but heterogeneity; narrow classes fit better but small N
  and selection. Also: choosing reference class by mechanism requires an inside-view
  causal model — so "outside view first" is contaminated by the inside view at the
  very point of class selection. That''s a nice non-obvious tension.


  (3) They think the "empires" data is basically a set of duration distributions that
