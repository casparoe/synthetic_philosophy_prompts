  ---


  I work on the metaphysics of mind and I''ve been using Dennett''s tower of four
  kinds of minds — Darwinian, Skinnerian, Popperian, Gregorian — as a framework for
  thinking about what sorts of flexibility a system can have. A colleague has an argument
  that the tower is really only one storey tall, and I can''t locate the mistake.
  Here it is as I''ve reconstructed it.


  (1) To ask what kind of mind a creature has is to ask what process actually does
  the work of producing its adaptive behaviour — the machinery that causally generates
  the flexibility you observe. Slogan: kinds of minds are kinds of causal processes.


  (2) A Popperian creature''s prescreening of candidate actions is itself carried
  out by some mechanism; that mechanism cannot be another Popperian creature on pain
  of regress, and Dennett himself insists the homunculi populating the inner environment
  are dumb — at best Skinnerian devices, and ideally just hard-wired ones.


  (3) So the machinery that does the work in a Popperian creature is Skinnerian or
  Darwinian: differential retention of candidates that have actually been produced
  inside the head, scored by an internal signal.


  (4) The same holds for a Gregorian creature. Language and other mind-tools enlarge
  the pool of candidates and make them easier to score; the scoring is still done
  by (3)''s machinery, and the tools themselves were shaped by selection over tokens
  that actually occurred — in public, or in other heads.


  (5) Hence every creature above the Skinnerian level is, at the level of the machinery
  that does the work, Skinnerian. And Skinnerian plasticity is itself a product of
  Darwinian selection, differing from hard-wired design only in how much information
