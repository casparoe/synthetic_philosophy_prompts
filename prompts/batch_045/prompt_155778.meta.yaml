  The subtle flaw: premise (1) plus (2)–(3) conflate "the kind of selection the creature
  as a whole can perform" with "the kind of process that implements it." Dennett''s
  taxonomy is a hierarchy of *design spaces explored*, i.e., of the information available
  to the individual before it acts: a Darwinian individual has only the information
  its genes have accumulated; a Skinnerian individual has information from its own
  history of actual trials; a Popperian individual has information about counterfactual
  actions (it can evaluate actions it hasn''t performed); a Gregorian individual has
  information accumulated by others and transmitted culturally. These are differences
  in *what the creature''s behavior is sensitive to*, i.e., a functional/intentional-level
  distinction — not a distinction in the micro-causal machinery. So (1) is false or
  at best a scope/level equivocation: the taxonomy classifies the space of candidate
  designs accessible to the creature, not the machinery. And "does the causal work"
  is ambiguous between "proximate mechanism" and "the source of the information that
  discriminates."


