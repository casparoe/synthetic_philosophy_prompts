  I''m opening it, not solving it.


  Here''s the bit I''d like you to build the thing around, if you think it survives,
  and tell me plainly if you don''t.


  I keep thinking about how we argued in the office about whether the Great Storm
  was worse than the one in January ''90, and the answer was always "worse by what"
  — deepest pressure, fastest gust, insured loss, or lives lost — and none of us felt
  indecent asking. Two things strike me. First, that when one event is worse than
  another on every single measure anyone cares about, nobody has any qualm about ranking:
  no one hesitates to say the Black Death was worse than a bad winter. Second, that
  all our arguments, in weather, were cases where the measures crossed — lower pressure
  here, more insured loss there — and where it isn''t just that we lacked the data,
  it''s that there was no fact of the matter to be had. So my hunch is that the "is
  it even possible / is it obscene" question and the "which is worse" question are
