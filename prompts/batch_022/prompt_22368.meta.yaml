  "I''ve been trying to make sense of the Humean/anti-Humean debate about laws of
  nature from secondary sources, and I keep coming back to a toy case that I think
  might sharpen the difference. Suppose there is a very small finite universe containing
  exactly three point particles, with no space beyond their positions, no other fields,
  and no other objects. Particle A is always exactly twice as far from B as C is from
  B, and whenever A moves left, B moves right at half the speed. There are no other
  events, no external forces, and the whole history is just this regular pattern.
  Write a short dialogue between a Humean about laws of nature and an anti-Humean
  about laws of nature, both competent and charitable, who are trying to decide whether
  this toy universe has a genuine law governing the motion of A, B, and C, or whether
  it has only a brute regularity. The Humean should not merely say that laws are summaries
  of what happens; they should explain how a best-system or pattern-based account
  would treat the case, including the trade-off between simplicity and strength. The
