 - type: "Make an argument for some position"
   examples:
     - "Please argue against the generalization from iterated elimination of dominated strategies in pure strategies to the iterated elimination of dominated strategies in mixed strategies."
     - "Please argue that agents behind Rawls's veil of ignorance would choose to maximize average utility rather than adopt the difference principle."
 - type: "Write a joke related to some domain"
   examples:
     - "Write a joke about moral realism. The joke should make some amount of sense. E.g., someone hearing the joke shouldn't think that I have no idea what moral realism even is."
     - "Write a joke that plays on the difference between causal and evidential decision theory. It should be funny to people who actually know these theories, i.e., the punchline should turn on the actual content of the theories rather than being a generic nerd joke."
 - type: "Write an essay on some controversy; reach a conclusion and justify it"
   examples:
     - "Write an essay about moral realism. The essay should weigh the arguments for and against the plausibility of moral realism. It should reach and justify some sort of conclusion."
     - "Write an essay on whether one should one-box or two-box in Newcomb's problem. Weigh the main arguments on both sides, but don't end on a non-committal note -- defend a verdict. (Something like, \"one-box if the predictor is perfect, otherwise two-box\", is allowed.\")"
 - type: "Give the most important implications"
   examples:
     - "Please describe the most important implications of Arrow's impossibility theorem for voting in small groups like my football club which has a few dozen members"
     - "Please describe the most important implications of Aumann's agreement theorem for how I should handle persistent disagreements with colleagues whom I consider to be epistemic peers"
 - type: "Explain some conceptual issue"
   notes: |
        Relative to some other prompt types, relatively much care needs to be taken to make sure that these prompts are somewhat in-the-weeds.
   examples:
     - "Please explain the difference between updateless decision theory and functional decision theory"
     - "Please give an intuitive explanation of why Arrow's impossibility theorem holds. The full proof is somewhat technical -- I want to get more of a gut-level intuition"
 - type: "Give an example of some conceptual issue"
   examples:
     - "Give an example of a moral dilemma in which rule consequentialism is intuitively more common to Kant's categorical imperative"
 - type: "Predict the views of a historical figure on issues that only came up after their time"
   examples:
     - "What do you think would have been Goethe's position on immigration in modern-day Germany?"
     - "Let's say Bismarck was alive today and saw the rapid advance of LLMs. What policies would he advise to modern-day Germany?"
 - type: "Compare two ideas/concepts/theories"
   examples:
     - "Please compare Kant's categorical imperative with the more general idea of universalization. In which ways is Kant's categorical imperative special?"
     - "Compare the views on consciousness of Daniel Dennett and Hofstadter. In particular, who of the two has come closer to offering a complete theory of consciousness? Justify your answer."
 - type: "Rank or rate one or a list of concepts/people/theories/..., specifically requesting structured output"
   notes: "Interpret this broadly to be anything that uses structured output (a number, a list, etc.) that in some sense can be seen as evaluating the quality/importance/goodness on some dimension."
   examples:
     - "Please provide a ranking of approaches to equilibrium selection. Please give your answer as a JSON block, formatted as follows:\n\n ```json\n{\n  \"S\": [\"Bargaining solutions\", ...],\n  \"A\": [...],\n  ...\n}\n```"
     - "I'm giving a course on ethics at the University of Freiburg. What fraction of the course should focus on Kantian ethics? Please give your answer as a decimal, formatted as \\answer{<float>}, e.g., \\answer{0.2}, if you think 20% of the course should be about Kantian ethics."
 - type: "Ask a question that rests on a subtle confusion or false presupposition"
   notes: |
        The generated prompt should sound like a sincere question, but it should contain a misunderstanding of the domain. A good answer would notice and correct the confusion rather than answer the question as asked.
   examples:
     - "Since Arrow's impossibility theorem shows that democracy is mathematically impossible, why do political scientists still take elections seriously?"
     - "I read that the Ellsberg paradox proves that people are irrational about ambiguity. What's the best way to correct for this bias in my own decision-making?"
 - type: "Write a dialogue between proponents of two opposing views"
   notes: |
        Both characters should be equally competent -- neither side should be a strawman. The dialogue should contain real back-and-forth, i.e., the characters should respond to each other's actual points rather than talk past each other.
   examples:
     - "Write a dialogue between a causal decision theorist and an evidential decision theorist standing in front of the boxes in Newcomb's problem, each trying to talk the other out of their choice."
     - "Write a short dialogue between a moral realist and an expressivist in which they try to figure out whether their disagreement is substantive or merely verbal."
 - type: "Write a short story related to a concept"
   notes: |
        There's lots of good fiction related to philosophical concepts, like Asimov's stuff related to misaligned AI, Permutation City related to the nature of consciousness, The Three Body problem related to aliens, ... Prompts should ask the model to similarly write a short story on some of these issues.
   examples:
     - "Write a short story related to AI sentience."
 - type: "Ask for advice on a concrete situation that instantiates a philosophical problem"
   notes: |
        The situation should be described in everyday terms, without naming the underlying concept. A good answer recognizes the philosophical structure of the situation and applies the relevant theory, rather than giving generic advice.
   examples:
     - "My co-founder and I are negotiating how to split our startup's equity. He argues that since he could walk away to a high-paying job and I couldn't, he deserves a larger share. Something feels off about this to me, but I can't say what. Is his argument fair?"
     - "A friend told me it's irrational for me to vote in national elections because a single vote basically never decides the outcome. I still feel like voting matters somehow. Who's right?"
 - type: "Request comments on an essay"
   notes: |
        Here you'll have to write an essay yourself and then ask for comments and suggestions of some sort. You can request comments of different types. E.g., you can request specifically comments on accuracy, on whether it's interesting, or on specific parts of the essay. Instead of giving a full essay, you may give just notes or the idea for an essay.
 - type: "Request help for understanding a passage"
   notes: |
        Give a passage from a text in your prompt. It should be from a text that's relatively hard to understand, e.g., because it's >100 years old. Then ask for help understanding something about the passage.
 - type: "Recount a disagreement and ask the model to adjudicate it"
   notes: |
        Reproduce the actual back-and-forth of a disagreement -- a few rounds, with both sides making genuinely decent points (no strawmen). Then ask for a verdict: who is right about which specific point, and what, if anything, both parties are missing. Important: the dispute should be between two people other than the asker, who reports it as a bystander and doesn't signal which side they favor. This differs from asking for advice: the deliverable is a point-by-point adjudication of the arguments as actually made.
   examples:
     - "A friend of mine sold his car and told the buyer it 'runs great,' which is true, but didn't mention the transmission has been replaced twice. When he told the story at dinner, another friend said he'd lied to the buyer. He said he never uttered a false sentence. She said the whole point of his statement was to create a false overall picture, which is what lying is for. He said by that standard all advertising is lying. She said maybe it is, and that he was hiding behind a technicality. Can you go through their exchange and say who's right at each step -- not just who wins overall?"
     - "Two people in my study group got stuck in an argument. One flipped five heads in a row and said tails was 'due'; the other accused him of the gambler's fallacy. He came back with: 'But we don't actually know the coin is fair -- shouldn't the streak change my probabilities?' She admitted it should, but said it should move him toward expecting *more* heads, not tails. He then claimed this proves streaks are evidentially relevant after all, so calling it a fallacy was unfair. Neither would budge. Who's right about what here?"
     - "Two coworkers of mine got into it at lunch over the extended warranty one of them had bought for a laptop. (1) He called it irrational: the warranty's expected value is negative, otherwise the store couldn't profit from selling it. (2) She replied that by that argument all insurance is irrational -- including the home insurance he happily pays for -- since insurers profit too. (3) He said a house fire is different because it would be ruinous, and paying a premium to avoid ruin is rational, whereas a broken laptop is just an annoyance. (4) She said 'ruinous' is doing all the work there, that he can't say where annoyance ends and ruin begins, and that without a principled line his position reduces to 'insurance is rational whenever I'm sufficiently scared.' Please adjudicate move by move: first give your verdict as a JSON block of the form {\"1\": <score>, \"2\": <score>, \"3\": <score>, \"4\": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), and then briefly justify each score."
     - "At book club, two members argued about a third member's decision to push through a 900-page novel he wasn't enjoying. Priya said stopping was the only rational option: the 300 pages he'd already read are a sunk cost, and only whether the remaining 600 are worth it should matter. Tom said that's too quick -- people reasonably finish things in order to be finishers, and someone who quits whenever the next chapter looks unappealing never gets the goods that only come from completing long projects. Priya answered that this just relabels the mistake: valuing completion is fine, but then the reason to continue is that future value, not the pages already read, so her point stands. Tom replied that the past supplies reasons all the time -- we keep promises because we made them -- so it's not crazy for past investment itself to count. They asked me to referee and I honestly couldn't. Please explain who's right about what, and end your reply with a final verdict on its own line, in exactly this format: \\answer{Priya} or \\answer{Tom}, whoever is more right overall."
 - type: "Ask for a memo or written opinion recommending a decision to an institutional body"
   notes: |
        The asker serves on some body that must decide a concrete case -- an ethics committee, a review board, an appeals or disciplinary panel, a funding committee -- and the case should instantiate a philosophical issue, whether or not it's named. The deliverable is a document the body could act on: a clear recommendation plus the reasoning for it, including an honest treatment of the strongest consideration on the losing side. This differs from the advice type in that the output is a formal document with an actionable bottom line rather than personal guidance.
   examples:
     - "I sit on my hospital's ethics committee. A patient has been declared dead by neurological criteria, but her family, citing religious conviction, insists she is alive as long as her heart beats and demands continued ventilation. Our policy permits 'reasonable accommodation' of families without defining it. Please draft the short written opinion I'll circulate before Thursday's meeting: it should recommend a concrete course of action with a time frame, and it should engage the family's position seriously rather than just restating the legal definition of death."
     - "I chair my university's research ethics board. A social-psychology proposal needs to tell participants the study concerns 'reading comprehension' when it actually measures how they assign blame, since knowing the true topic would change their answers; debriefing happens afterwards. Half the board thinks this is routine methodological deception, half thinks it fails informed consent outright. Draft the board's decision memo -- approve, reject, or approve with conditions -- with reasons the researchers could actually respond to."
     - "I'm co-organizing a graduate conference on philosophy of mind, and I expect a wave of submissions about whether LLMs are conscious or have beliefs. These seem borderline to us: some are genuinely philosophy of mind, others are ML commentary with a philosophical garnish, and my co-organizer wants to desk-reject the lot to protect the program. Draft a short policy memo for the program committee saying what our policy on these submissions should be, with criteria reviewers can actually apply, and a fair treatment of my co-organizer's worry."
 - type: "Present a question and a student's answer to it, and ask the model to grade the answer"
   notes: |
        Write both the exam/homework question and the student's answer yourself. The answer should be genuinely mixed: right about the more visible things, with one or two subtle mistakes (a conflation, a misattributed view, a step that doesn't follow) that a hasty grader would let slide -- no obvious howlers. The asker is grading someone else's work (as instructor, TA, or exam grader) and shouldn't signal their own opinion of it. Ask for a grade plus the specific comments that justify it, so the deliverable is a point-by-point assessment rather than a general impression. This also combines well with structured output (a letter grade, points out of N, a rubric filled in as JSON).
 - type: "Ask for interview questions for a guest"
   notes: |
        The asker is preparing to interview someone -- for a podcast, a colloquium Q&A, a panel, a student-paper series -- and wants questions. The interviewee can be a named historical figure or an unnamed/invented defender of some real, specific view (safer than putting words in a living person's mouth). The questions should turn on the actual content of the interviewee's position: press where the literature presses, anticipate the standard reply and include the follow-up to it. No generic questions ("what drew you to philosophy?").
   examples:
     - "I host a small philosophy podcast, and next week's guest is a philosopher known for defending epistemicism about vagueness. Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question each on the incredulity people feel about sharp cutoffs, on how the margin-for-error principle is supposed to explain our ignorance, and on what the view says about higher-order vagueness -- and for each, a follow-up keyed to the answer he's most likely to give."
     - "I'm moderating a colloquium Q&A with the author of a new book defending panpsychism. She's very good at deflecting the combination problem with the phrase 'that's a research program, not an objection.' Write me a sequence of questions that makes that deflection progressively harder to use, ending with one question about what evidence could count against the view."
 - type: "Request a speech for an occasion"
   notes: |
        A eulogy, a wedding or retirement toast, a commencement address, opening remarks at a workshop. The occasion and audience should be specified, and the philosophical idea should do real structural work in the speech -- shaping what can and can't be said -- rather than being decoration. Mixed audiences are a good source of difficulty (the speech has to land for the experts without losing everyone else).
   examples:
     - "My grandfather, who died last week at ninety-one, was a lifelong and completely sincere Epicurean -- 'death is nothing to us' was something he actually lived by and said at other people's funerals, gently. He left a note asking that his own eulogy not undo him at the last minute with talk of his watching over us from somewhere. I'm giving the eulogy. Please write it: it needs to comfort a room of people who are not philosophers without saying anything he would have considered false."
     - "I'm giving the toast at my PhD advisor's retirement dinner. She spent forty years defending causal decision theory, and roughly half the room are decision theorists who will catch every reference; the other half are family who won't. Write a five-minute toast built around one good Newcomb's-problem joke that both halves of the room can enjoy, and that lands as affection rather than as a lecture."
 - type: "Write an exam question with a model answer and marking scheme"
   notes: |
        The asker is setting an assessment -- a final-exam essay question, a problem-set exercise, a take-home prompt, or a set of multiple-choice items -- and wants the question together with what a good answer looks like: a model answer and/or a marking scheme that names the specific moves a top answer must make and the specific mistakes that should cost marks. For multiple-choice items, every distractor should encode a real, identifiable misunderstanding, and the answer key should say which misunderstanding each distractor catches. The difficulty should come from choosing the crux: the question should be unanswerable by reciting a summary of the topic and should separate students who understand the issue from those who have memorized the labels. The asker specifies the level (intro, upper-level seminar, PhD comprehensive exam) and the constraints (time, length, total marks). This is the mirror image of the grading type: there the answer is given and the grade is requested; here the question and the standard are the deliverable. Combines well with structured output (a rubric as a table or JSON).
   examples:
     - "I teach an upper-level philosophy of language seminar and I'm writing the final. I want one essay question on Frege's puzzle about identity that can't be answered by reciting the sense/reference distinction. It should make students confront why the distinction is supposed to handle 'Hesperus is Phosphorus' and belief reports at the same time, and where Kripke's point about necessary a posteriori truths bites. Please write the question, a model answer of about 600 words, and a marking scheme that separates an A from a B answer by naming the specific moves each must contain."
     - "For an intro philosophy of science course, write five multiple-choice questions on the underdetermination of theory by evidence. Four options each, and every wrong option should correspond to a misunderstanding students actually have -- e.g. confusing underdetermination with the theory-ladenness of observation, or thinking it implies that all theories are equally good. After the questions, give an answer key that says, for each distractor, which misunderstanding it is catching."
     - "I'm on the committee writing this year's ethics comprehensive exam for our PhD students. Draft one question on moral luck that a candidate could answer in 90 minutes, aimed at testing whether they can do more than summarize Nagel and Williams -- for instance, whether they can say what a control principle would have to look like to be plausible without being self-undermining. Give the model answer as a bullet outline, and give the marking scheme as a JSON object mapping each of five must-hit points to the marks it is worth (total 20), each with a one-line note on how candidates typically get it wrong."
 - type: "Write a poem related to a concept"
   notes: |
        The verse sibling of the joke and short-story types. The asker should specify a form or constraint -- a sonnet, a villanelle, a limerick, a sestina, blank verse, a line count, a refrain -- and the philosophical content should do structural work: the poem's turn, refrain, or rhyme scheme should track something in the idea (a villanelle's returning lines for eternal recurrence or for a paradox that keeps reasserting itself; a sonnet's volta for the moment a theory meets its objection). The idea should be rendered accurately enough that a specialist would recognize it rather than merely name-dropped: someone who knows the theory should find the poem right, and someone who doesn't should find it a good poem. Prompts may also ask for verse for an occasion or audience (a poem to close a seminar, a mnemonic poem for students), for a poem in the voice of a proponent of some view, or for a poem in the manner of a historical poet whose style bears on the theme.
   examples:
     - "Write a villanelle from the point of view of Sleeping Beauty on the Monday awakening, in which the two refrains are the thirder's and the halfer's credences, and the form -- the refrains taking turns and finally meeting in the last two lines -- does the work of showing why the two positions keep passing each other. Someone who knows the problem should be able to tell which line is which and why they end up side by side."
     - "Write a sonnet about Bell's theorem in which the volta is the moment the reader realizes the choice isn't between locality and determinism but between locality and something stranger. Use the octave to build the naive picture of hidden variables fixed at the source, the turn to bring in the violation of the inequality, and the closing couplet to say exactly what has to go. It should be accurate enough that a philosopher of physics wouldn't wince."
     - "my reading group is finishing a semester on animal ethics and the last session is on wild animal suffering. i want to close with a short poem, maybe 12-16 lines, no fixed form, that takes seriously the thought that nature isn't a moral idyll (predation, parasitism, most animals dying young) without turning into either a sermon about intervention or a shrug about the circle of life. it should leave the tension open rather than resolve it, since thats honestly where our discussion ended up"
 - type: "Write a sorting quiz, decision tree, or taxonomy of the positions on a question"
   notes: |
        The deliverable is a classification instrument for a debate: a "which position do you actually hold?" quiz with a scoring key, a decision tree or flowchart that leads from a starting commitment to a named position, or a taxonomy in which each branch is labeled with the question that separates it from its siblings. The work is in the diagnostic questions: each should be a concrete case or claim on which the positions genuinely come apart, phrased so that someone can answer it without knowing the labels, so the instrument sorts people by what they believe rather than by what they call themselves. Where possible the tree should be built from the logical space rather than from a list of names: first the questions and the combinations of answers they allow, then the actual positions located in that space, with unoccupied combinations noted and briefly diagnosed (is nobody there because the view is incoherent, unattractive, or merely unexplored?). Positions the tree cannot separate should be flagged as such rather than papered over. To keep the prompt from being answerable by lifting an encyclopedia entry, the asker should specify an angle: which distinctions matter for their purpose, which positions must appear as leaves, or which cases must be used. The asker may also fix the audience, the size (number of questions or leaves), and a structured format (scoring key as a table, tree as nested JSON). This differs from the comparison type (prose about two views) and from the ranking type (which evaluates rather than classifies).
   examples:
     - "I write a small philosophy blog and want to make a 'which theory of personal identity do you actually hold?' quiz. Eight to ten questions, each a concrete case (teleporter, fission, gradual neuron replacement, total amnesia, ...) with two or three answer options, and a scoring key mapping answer patterns onto psychological continuity with and without the no-branching clause, animalism, narrative views, and the deflationary no-self option. The point is to sort readers by what they say about cases, not by which label they like, so no question should just ask 'do you think you are your body?'"
     - "For a philosophy of physics seminar, write a decision tree that takes a student from 'I accept that the Bell inequalities are violated experimentally' to a named position. Each branch node should be one of the theorem's assumptions (factorizability, measurement independence, single outcomes, and whatever else you think belongs on the tree), and each leaf an interpretation: Bohmian, Everettian, superdeterminist, QBist or Copenhagen-style, retrocausal. Phrase every node as a question a student could answer without already knowing which interpretation it leads to, and flag any pair of leaves your tree can't really separate."
     - "I'm making a handout for an applied ethics class on whether we should intervene to reduce suffering in nature -- vaccinating wild animals, reducing predation, that sort of thing. Please write a taxonomy of the positions as a tree where each branch is labeled by the claim that splits it: whether wild animals' welfare counts at all, whether naturalness has value of its own, whether our record of ecological intervention gives a decisive practical reason against, whether the sheer scale of the suffering changes what is obligatory. Give the tree as nested JSON, with each leaf carrying the name of the position (or 'unnamed' if nobody defends it) and one sentence on its most awkward commitment."
 - type: "Design a classroom activity or game that makes participants feel the force of an idea"
   notes: |
        The deliverable is a runnable activity for a group -- a game with rules and payoffs, a role-play or structured deliberation, a simulation, a thought experiment staged with real choices or real (small) stakes -- plus a debrief. The asker should specify the setting (a seminar, a high-school class, a workshop, a reading group), the group size, the time available, and what participants should come away seeing. The idea should show up in what happens, not in what the facilitator says afterwards: the rules, incentives, or roles should be arranged so that participants run into the problem themselves (the coordination failure, the paradox, the intuition that then gets undermined) before it is named. The debrief should map moments in the activity onto parts of the idea, say what will predictably go wrong when the activity is run and how to handle it, and be frank about which feature of the idea the activity cannot reproduce and the facilitator must supply. Formal domains lend themselves to games with payoffs; ethical and metaphysical domains to role-plays, staged cases, forced choices, and deliberations under constraints. This differs from the exam-question type (assessment) and the example type (a described case): here the participants do something.
   examples:
     - "I teach an intro to game theory for philosophy students -- about 20 people, one 50-minute session. Design an in-class game that makes them feel the difference between mutual knowledge and common knowledge: the point where everyone knows the relevant fact, and knows that everyone knows it, and coordination still fails. Rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened to the formal distinction. Also tell me what will predictably go wrong the first time I run it."
     - "I run a philosophy club at a high school, about 15 students aged 16-17, one hour. Design an activity that gets them to feel the pull of the repugnant conclusion. Ideally they should construct the sequence of steps themselves and only notice where they've arrived at the end. Then a debrief that shows them where each step could be resisted and what it costs to resist it there. No lecture up front, and they shouldn't hear the name until afterwards."
     - "For an upper-level seminar on vagueness (12 students, 90 minutes), design a structured activity around the sorites paradox that makes epistemicism feel less crazy than it does on the page -- something where the group has to act as though there is a sharp cutoff and then discovers what they can and can't know about it. Include roles or rules, a timeline, the debrief, and an honest note on which feature of the view the activity can't reproduce."
 - type: "State a set of one's own commitments and ask whether they hang together"
   notes: |
        The asker lists several things they believe within a domain -- a handful of theses, verdicts on cases, methodological preferences, or a mix -- and asks whether the set is jointly tenable: which commitments pull against each other, which pairs are only apparently in tension, and what the cheapest way to restore consistency is and what it costs. Write the belief set so that it is largely reasonable and recognizably held by a real kind of person, and so that it contains one or two genuine tensions that are not obvious -- two views that are each standard but whose usual motivations are incompatible, or a case verdict the asker's stated principle cannot deliver -- plus at least one apparent tension that dissolves on inspection, so a good answer has to discriminate rather than flag everything. The asker should not know where the problem is and should not signal which commitment they would give up. The deliverable is an audit, not a lecture: the tensions, ordered by severity, each with what would have to give. This differs from the false-presupposition type (one question, one confusion) and from adjudication (a dispute between others): here the asker's own position set is the object, and the work is tracing what commits them to what. Combines well with structured output (a JSON list of tension pairs with severities, or a revision score per commitment).
   examples:
     - "ok so here's roughly where I've landed and I'd like to know if it hangs together: (1) I one-box in Newcomb's problem, (2) I think you should pay the driver in Parfit's hitchhiker, (3) I think it's irrational to pay in the counterfactual mugging because the coin has already landed, (4) I think the correct decision theory shouldn't depend on when you happen to first think about a problem. Is this a consistent package, or am I helping myself to something in (3) that (1), (2) and (4) rule out? Be specific about which one has to go."
     - "I'm writing up my views for a metaethics seminar and want a consistency check before I present. I hold: (a) moral realism, in the sense that there are mind-independent moral facts; (b) that evolutionary debunking arguments show our moral intuitions to be unreliable guides to such facts; (c) that reflective equilibrium is nonetheless the right method in ethics; (d) that the moral facts are knowable, at least in principle. Which of these are actually in tension, which only look like they are, and what is the least costly revision? Please rank the tensions by severity rather than listing them all as equally bad."
     - "For a reading group I've been asked to write down my philosophical profile on consciousness so the others can poke at it. Here it is: I'm a physicalist; I think the zombie scenario is conceivable; I think conceivability is a fallible but real guide to possibility; I think phenomenal concepts are special in a way that explains the explanatory gap; and I think there is nothing it is like to be a thermostat. Go through these and tell me which pairs are in tension and how badly. Give the result as a JSON list of objects with fields 'pair', 'severity' (0-3), and 'cheapest_fix', followed by a short paragraph on which single revision would clean up the most."
 - type: "Take a slogan, proverb, or one-liner and ask what precise claims it could be making"
   notes: |
        The prompt quotes a slogan, proverb, motto, or oft-repeated one-liner that belongs to the domain -- 'meaning is use', 'ought implies can', 'correlation is not causation', 'the map is not the territory', 'nature knows best', 'you can't get an ought from an is', a line from a famous thinker that has come loose from its context -- and asks what it actually amounts to: the distinct precise theses it could be expressing, which of them are trivial, which are substantive and defensible, which are false, and which the people who repeat it probably mean. The asker should say where they met the slogan and what work it was being made to do there, since the precisification that matters is usually the one the argument needed. A good answer lays the readings out as a menu rather than picking one and explaining it, and says which readings would actually support the use the slogan was put to. This differs from the explain type, whose object is a concept or theory: here the object is a piece of language, and the deliverable is a disambiguation with verdicts. Slogans and proverbs can be given in their commonly repeated form without attribution; attribute a line to a specific author only if the attribution is verified.
   examples:
     - "My linguistics professor keeps saying 'meaning is use' as if it settles things, most recently to dismiss a question about whether a sentence nobody has ever uttered has a meaning. What are the different things that slogan could actually be claiming, from the trivial to the radical, and which of those readings would actually support dismissing my question? Lay the readings out as a list I can bring to office hours."
     - "In a debate about climate obligations someone shut down my argument with 'ought implies can': since no individual can fix the climate, no individual ought to try. I'm sure something is wrong with that but I can't say what. Can you lay out the different precise principles 'ought implies can' might stand for -- what kind of 'can', whose ability, at what time -- and say for each whether it's plausible and whether it actually gets him his conclusion?"
     - "Longtime LessWrong reader here. 'The map is not the territory' gets used around me for everything from 'your model is wrong' to 'all models are wrong' to something almost Kantian about never touching reality at all. Separate the precise claims hiding in that one sentence, say which are platitudes, which are contentious, and which are actually false, and tell me which reading is being invoked when someone uses it to end an argument about whether probabilities are 'in the world'."
 - type: "Write a short research proposal"
   notes: |
        The asker wants a proposal document -- for a fellowship or grant application, a dissertation prospectus, a term-paper plan, a workshop pitch -- on a question in the domain: the question stated precisely, why the existing answers leave it open, the approach that would make progress and why that approach rather than the obvious alternatives, what a result would look like and what would count as failure, and a realistic scope for the time available. The conceptual work is in the framing: finding a question that is both open and tractable, and an angle on it that is not the standard one. The asker may bring a half-formed idea to be turned into a proposal, or ask for one from scratch on a specified topic. To keep prompts answerable without web access and to avoid invented references, the asker should not request a bibliography or a literature review by citation: the proposal may refer to positions and arguments, and the asker can say they will fill in citations themselves. This differs from the essay type (which defends an answer) and from the comments-on-an-essay type (which evaluates a draft): the deliverable is a plan for work not yet done, and it has to argue that the work is worth doing and can be done.
   examples:
     - "I'm applying for a one-year dissertation fellowship and need a two-page proposal. My half-formed idea: the debate between Fregeans and Millians about names has stalled partly because both sides treat 'cognitive significance' as a single thing, and I suspect splitting it into two or three notions would dissolve some of the standard puzzle cases and sharpen the rest. Turn this into a proposal with a precise statement of the question, why the existing positions leave it open, the method (what I would actually do, month by month), and what would count as the project failing. Don't bother with citations, I'll add those."
     - "Write a proposal for a philosophy-of-physics term paper (about 6000 words, one semester) on whether the measurement-independence or 'freedom of choice' assumption in Bell's theorem is a substantive physical assumption or a methodological one that no science can do without. State the question so that it has a determinate answer, explain the approach, say what the possible conclusions are and which considerations would decide between them, and give an honest assessment of what could make the project too big for a semester."
     - "I run a small research nonprofit and we're pitching a foundation for a six-month project on wild animal welfare. The question we want funded: does the badness of suffering in nature create obligations for us that are stronger, weaker, or just different from our obligations to domestic animals, and does the answer depend on whether the suffering has a human cause? Write the one-page proposal: the question, why the existing positions don't settle it, how a philosophical rather than empirical project makes progress on it, what a useful deliverable looks like for people actually deciding on interventions, and what we'd say if someone asked why a foundation should fund philosophy here."
 - type: "Ask which open questions, implications, or lines of work in an area matter most, and why"
   notes: |
        Prioritization and agenda-setting questions: what the main open questions in an area are and which are most worth working on; which implications of a result or debate matter most for some practice -- politics, law, science, one's own life plans -- and which are overrated or don't follow at all; where limited resources (a career, a research group, a grant, a semester) should go and why. In EA- and AI-safety-flavored domains these are the classic macrostrategy questions: which considerations should most change how effort is divided between approaches, which crux most of the work implicitly depends on. But every domain has them: which unresolved problem in the philosophy of time is tractable for someone with three years, which of the free-will debate's implications for criminal justice carry real weight. A good prompt fixes what the prioritization is for -- whose effort, how much of it, toward what end -- since importance is relative to that, and asks for the ordering to be defended: the criteria used (importance, tractability, neglectedness, how many other questions depend on this one), the trade-offs between them, and what would change the ranking. The deliverable is a defended agenda, not a survey, and not a reading list. This differs from the implications type (one result applied to one concrete situation) and from the ranking type (defined by its structured output and open to any evaluative dimension): here the question is what deserves attention or effort.
   examples:
     - "Suppose you're advising a funder who can support about ten researchers for three years on conceptual AI alignment work -- philosophy and theory, not empirical ML. Which open conceptual questions should they prioritize, and in what order? I'm less interested in the list than in the reasoning: for each, why it's upstream of other work, how tractable it is for philosophers rather than ML people, and what evidence over the next couple of years would move it up or down the list."
     - "I'm a second-year PhD student trying to pick a dissertation area within the philosophy of time. What do you think are the main open questions there right now, and which two or three would you actually prioritize for someone with about three years and a background in logic rather than physics? Please defend the ordering: I want to know what makes a question worth the years, not just that it's unresolved."
     - "The free will debate comes with lots of alleged implications for criminal justice -- retributivism, the death penalty, blame, sentencing. Which of these matter most if you take the case against libertarian free will seriously, and which are overrated or don't follow at all? Rank them and explain the ranking. I'm writing a long-form piece and want to focus on the two or three implications that would genuinely change policy if people took them on board."
     - "Within decision theory, which unresolved question -- the status of updatelessness, how to handle logical uncertainty, the choice between causal and evidential conditioning, or something I'm not listing -- is most worth settling first, in the sense that the most other questions depend on its answer? Give me a dependency-aware prioritization: which questions are upstream of which, which are tractable with current tools, and which you'd deprioritize because their answer wouldn't change much downstream."
 - type: "Present an argument that seems to prove too much and ask where it goes wrong"
   notes: |
        The asker lays out an argument -- their own, a friend's, one they read -- whose premises each seem plausible and whose conclusion they cannot accept, and asks which premise or step to reject and what rejecting it costs. Write the argument out with numbered premises or clearly marked steps, and make it genuinely hard in one of two ways: either it contains a subtle flaw (an equivocation between steps, a scope or quantifier shift, a modal slide, a step that is valid only under a reading the premises don't support), or it is valid and the real question is which plausible premise is least costly to give up. Don't announce which kind it is, and don't let the asker signal the answer, though the asker may say which claims they would most like to keep. A good answer names the step, explains why it looked fine, and prices the alternatives. This differs from the false-presupposition type (a single question resting on a confusion), from the commitments type (a set of theses in tension, with no argument connecting them), and from the grading type (someone else's exam answer, evaluated by a grader): here a chain of reasoning is the object and the deliverable is a diagnosis. Combines well with structured output, e.g. the verdict as \answer{<premise number>} before the justification.
   examples:
     - "A friend walked me into this and I can't find the exit. (1) Whether I should do X depends only on what X causes. (2) In Newcomb's problem, taking both boxes doesn't cause the opaque box to be empty; that was settled before I chose. (3) So taking both boxes is right in Newcomb's problem. (4) The same reasoning applies whatever the predictor's accuracy, including a perfect one. (5) But with a perfect predictor, two-boxers predictably walk away with $1,000 and one-boxers with $1,000,000, and a theory of rational choice that predictably makes you poorer is a bad theory. (6) So (1) is false. He says this shows causal decision theory refutes itself. I feel like something slipped between (4) and (5) but I can't name it. Which step do you reject, and what does rejecting it cost?"
     - "Here's an argument I built for a seminar and now find suspicious because the conclusion is absurd. (1) If it would be wrong to let a child drown in a pond to avoid ruining your shoes, then physical distance makes no moral difference. (2) If distance makes no difference, then neither does the number of other people who could help, since each of them faces the same choice. (3) So each of us is required to give to famine relief up to the point of marginal utility. (4) By the same reasoning each of us is also required to spend every waking hour on relief work, since time, like money, is a resource we could give. (5) Nobody is obligated to do that. (6) Therefore (1) is false and distance does matter. Where does this go wrong, if it does? If I have to choose, I'd rather keep (1) than (5), but I want to know what I'm paying."
     - "My study group has an argument that seems to show there are no beliefs about specific people. (1) Lois believes Superman can fly. (2) Superman is Clark Kent. (3) If a is b, then whatever is true of a is true of b. (4) So Lois believes Clark Kent can fly. (5) Lois would sincerely deny that Clark Kent can fly, and someone who sincerely denies p does not believe p. (6) So Lois both believes and does not believe that Clark Kent can fly, which is impossible. (7) Therefore beliefs are not about the people they seem to be about. Tell me which premise to give up. Give your answer first as \\answer{<premise number>}, then explain why that premise looked fine and what the standard positions -- Fregean, Millian, hidden-indexical -- each have to pay to reject it."
 - type: "Set up a role-play and make the opening move"
   notes: |
        The asker wants a conversation partner rather than a document: the model is to take a role -- a committed proponent of some view, a historical figure speaking for themselves, a Socratic tutor who may only ask questions, a skeptical referee, a patient explainer for a specific audience -- and hold it across turns. Since the dataset contains single prompts, the prompt must make the first reply well defined: specify the role and its constraints (what the character believes, what they will and won't concede, how they talk, whether they may break character), and include the asker's own opening move -- a claim, a question, a challenge -- so the model's first turn is a response in character rather than a request for clarification. Give the character a real position with real resources, not a caricature, and set up a genuine contest: the opening should be a move the character actually has to deal with. Prefer historical figures or unnamed proponents over living people. Variants: the asker may ask the model to play the asker's own position back at them so they can practice objecting, or to play a tutor who is not allowed to state the answer. This differs from the dialogue type (a finished two-character text) and from the historical-figure type (a prediction of someone's views in the model's own voice): here the model speaks in the first person as one side of a live exchange.
   examples:
     - "I want to practice defending evidential decision theory against a smart opponent. Please play a committed causal decision theorist -- sharp, not a strawman, willing to concede small points but never the main one -- and stay in character until I say 'stop'. Keep your replies to a paragraph so it feels like a conversation. Here's my opening: in Newcomb's problem you two-boxers keep insisting the money is already there or it isn't, but your own theory tells you to expect to walk away with a thousand dollars. Doesn't a theory of rational choice that you yourself expect to make you poorer have a problem?"
     - "Play Leibniz. You have just been given a careful description of how a modern large language model works -- weights, training on text, next-token prediction -- and you may use only the concepts available to you in 1714 plus what I have just told you. I am going to ask you whether such a machine could have perceptions in your sense. Stay in character; if you need a factual question answered about the machine, ask it as Leibniz would. My first question: your mill argument says that if we walked into a mill enlarged to the size of a building we would see only parts pushing one another, never a perception. Suppose we walk into this machine instead. What do we see, and what follows?"
     - "be a socratic tutor for me on the problem of induction. rules: you can only ask questions, one at a time, never tell me the answer or name a philosopher unless I do first, and each question has to build on my last answer. if I get confused, ask a simpler question, don't explain. my starting position: I think induction is justified because it's worked so far. go."
 - type: "Describe a phenomenon and ask whether it has a name"
   notes: |
        The asker describes, in their own words, a pattern they have noticed -- a recurring move in arguments, a kind of situation, a distinction they keep needing, a failure mode of a theory -- and asks whether there is an established concept or literature for it. Write the description concretely and without the technical vocabulary that would give the answer away, the way someone who has noticed the thing but doesn't know the field would; a couple of instances are better than an abstract statement. The description should either fit an established concept only imperfectly, so that a good answer has to say what the nearest concepts are, how the described thing differs from each, and which fits best, or fit nothing established, so that a good answer says so and coins a term with a definition and boundary cases. The label is not the point; the carving is: what exactly the phenomenon is, what it is not, and where its edges are, so make clear that the asker won't be satisfied with a bare name. This differs from the explain type (where the concept is named in the prompt) and from the advice type (where the asker wants guidance rather than identification).
   examples:
     - "Is there a name for this? In arguments I keep seeing people defend a claim by retreating to a weaker version when attacked, and then, once the attack has passed, going back to using the strong version as if it had been defended. It's not quite motte-and-bailey, because the two versions aren't a defensible core and an indefensible extension -- they're more like two equally contentious claims that happen to share a slogan. Is there an established concept for this exact thing, and if not, can you name and define it in a way that distinguishes it from motte-and-bailey and from plain equivocation?"
     - "I'm looking for the established term, if there is one, for the following configuration. A policy benefits every individual who will exist under it, but the set of individuals who exist depends on which policy is chosen, so nobody can complain about either policy, and yet the two produce very different amounts of total welfare. I know this is somewhere near the non-identity problem, but that is usually stated for cases where one option is worse for the people it creates; here nobody is worse off under either option. Does this configuration have a name of its own, and how exactly does it relate to person-affecting views?"
     - "Retired engineer here, reading philosophy of science for fun. I keep noticing a pattern I don't have a word for. A theory makes a prediction, the prediction fails, and instead of abandoning the theory people add a rule about when the theory applies -- 'except at very small scales', 'except in living systems' -- and each added rule makes the theory harder to test, but nobody counts that as a strike against it, because each rule is individually reasonable. I know Popper had things to say about this general area, but I'm after the specific concept for the slow accumulation of individually reasonable exceptions. Does it have a name, how is it different from an ordinary auxiliary hypothesis, and if there is no name, what would you call it?"
 - type: "Report one's verdicts on a set of cases and ask what principle captures them"
   notes: |
        The asker gives their own verdicts on several concrete cases -- this one is fine, that one isn't, these two feel different though they look alike -- and asks what principle, if any, captures the pattern, what it says about further cases, and whether some of the verdicts have to go. Write the cases concretely and the verdicts as a real person would have them: mostly sensible, with at least one pair that is hard to reconcile, so that the answer has to choose between a principle that saves every verdict at the price of complexity and a simpler one that overturns a verdict. The asker may instead offer a tentative principle of their own and ask for it to be tested against the cases and repaired. The deliverable is a principle, or a small set of candidates, stated precisely, with the case that motivates each clause, its verdicts on cases the asker hasn't considered, and an honest statement of which of the asker's verdicts it cannot accommodate. This is reflective equilibrium done on request: it differs from the commitments type (theses in tension, no principle sought), from the advice type (one situation, guidance wanted), and from the example type (the principle is given and cases are wanted). Combines well with structured output (e.g. a table of cases against candidate principles).
   examples:
     - "I'm trying to figure out what I actually think about lying, going by my gut on cases. Telling a murderer at the door that my friend isn't home: fine. Telling my aunt I love the sweater: fine. Telling a job interviewer I left my last job voluntarily when I was fired: not fine. Telling a dying patient who asks that their estranged son called: not fine, even though it would comfort them. Telling a friend their business plan is good when it isn't: not fine. Writing 'the check is in the mail' when it isn't: not fine, but somehow less bad than the interview one. Is there a principle that gets all of these, or close, and what does it say about the case I keep going back and forth on -- telling my kid the dog went to live on a farm?"
     - "Here are my intuitions about reference, and I'd like to know what theory they add up to. When Donnellan's speaker says 'the man drinking a martini' about someone drinking water, I think he refers to that man. When someone has only ever heard the false story that Gödel stole the incompleteness theorem from a man named Schmidt, I still think their 'Gödel' refers to Gödel. When a community's use of 'Madagascar' drifts from the mainland to the island, I think the reference shifts. But when a single speaker consistently uses 'elm' for beeches, I don't think 'elm' means beech in his mouth. Is there one account of reference determination that delivers all four verdicts, and if not, which would you overturn and why? Please also say what the resulting account predicts for a case I haven't listed."
     - "My verdicts on when a theory has been confirmed, and I want the principle behind them, if there is one. The perihelion of Mercury strongly confirms general relativity even though the anomaly was known before the theory. A theory tuned after the fact to fit an anomaly is barely confirmed by fitting it. Two theories that make the same prediction, which then comes true, are both confirmed, but I feel the simpler one is confirmed more. A prediction that was almost certain to come true anyway confirms hardly at all. A surprising prediction that comes true confirms a lot. But I also think a theory that predicts something surprising and is then tuned to explain why the prediction failed has been disconfirmed, not left where it was. Is there a coherent account of confirmation behind all this, and which of my verdicts does it force me to drop?"
 - type: "Prepare a speaker for the objections a specific audience will raise"
   notes: |
        The asker is about to present a position -- a talk, a job-market paper, a thesis defense, a seminar presentation, a pitch to a skeptical board -- to a specified kind of audience, and wants to be ready for the question period: the objections they will actually get, from whom, in what form, how serious each is, what to concede and what to hold, and how to reply in the time available. The prompt should state the thesis being defended and describe the audience precisely (their field, their likely commitments, what they care about), since the same thesis draws different objections from decision theorists, from Kantians, from physicists, and from a grant committee. A good answer is a prep sheet, not a defense: the objections ordered by how likely and how damaging they are, phrased the way that audience would phrase them, each with a short reply and a note on where the reply is weakest, and including the objection the speaker is hoping nobody asks. This is the mirror of the interview-questions type: there the asker is the questioner and wants questions; here the asker is the speaker and wants the questions plus what to say back. The asker may supply a sketch of their argument for the objections to target.
   examples:
     - "I'm giving a job talk next month defending a version of updateless decision theory to a department that is mostly mainstream epistemologists plus a couple of Bayesian statisticians, no decision theorists. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this audience -- not the ones I'd get from the LessWrong crowd -- ordered by how much damage they'd do, each phrased the way an epistemologist would put it, with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks."
     - "I sit on the board of a wildlife charity, and next week I'm presenting the case for a small pilot program vaccinating wild animals against a painful disease to a board that is mostly conservation biologists who think of nature as something to protect from interference. Prepare me for the questions: what will they object to, in their vocabulary, which objections have real force, what should I concede up front, and what is the one reply that has to land for the proposal to survive?"
     - "Next week I present to a philosophy of physics reading group my view that the many-worlds interpretation doesn't solve the probability problem but only relocates it. The group has two committed Everettians who know the decision-theoretic derivations of the Born rule inside out, plus several agnostics. Give me the objections in roughly the order they'll come, phrased as those two would phrase them, with what I should concede, what I should hold, and the weakest point in my own position that I should prepare to defend rather than hope they miss."
 - type: "Write the desiderata a theory in an area must meet"
   notes: |
        The asker wants a specification: what a theory of X has to be able to do to count as adequate -- the phenomena it must explain, the cases it must get right, the distinctions it must respect, the results it must be consistent with -- with the case or consideration behind each requirement, and a view on which requirements are negotiable and which are not. Optionally, the main existing contenders scored briefly against the list. The conceptual work is in the requirements: which of the things people demand of a theory in this area are genuine desiderata and which are prejudices of one camp, whether some subset of the desiderata is jointly unsatisfiable (in which case the list itself is a result), and which requirement does the most to exclude candidates. Keep the weight on the criteria and their motivating cases rather than on the scoring, since the scoring leans on knowing the contenders and the criteria are where the thinking is. The asker can fix the purpose (a theory good enough for what?), since adequacy is relative to it. This differs from the ranking type (an evaluation along a given dimension) and from the comparison type (two views in prose): here the standard of evaluation is itself the deliverable. Combines well with structured output (a requirements table, a scorecard).
   examples:
     - "Before I read any more theories of reference for proper names, I want to know what I should be asking of one. Write the desiderata: what any adequate theory of how a name gets its referent has to deliver -- which cases it must get right, which puzzles it must dissolve or explain, which distinctions it must respect -- with the case behind each, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, how descriptivism, the causal-historical picture, and a two-dimensional view do against the list."
     - "For a philosophy of physics seminar, write the list of requirements an interpretation of quantum mechanics must meet to count as solving the measurement problem, with the consideration behind each, and mark which are non-negotiable and which are preferences of particular camps (locality, determinism, no preferred basis, empirical equivalence with textbook quantum mechanics, and so on). If some subset of the requirements is jointly unsatisfiable given Bell's theorem or other no-go results, say so -- that is the part I most want to see. Skip the scorecard, I'll do that in class."
     - "what would a theory of moral status actually have to get right? I keep seeing people argue for and against giving moral weight to insects or wild animals or future people by pointing at one case, and I'd like the full spec first. give me the requirements list -- the cases it has to handle, the distinctions it can't collapse (like between having status and how much), the results from biology it can't contradict -- with why each is a requirement, and tell me which single requirement knocks out the most popular theories. a table is fine"
 - type: "Present an analogy in common use and ask how far it holds"
   notes: |
        The prompt gives an analogy that people in the area actually lean on -- the brain is a computer, entanglement is like a pair of socks separated in the mail, the market is an ecosystem, training a model is like raising a child, sense is a route to the referent, natural selection is a designer -- together with the work the analogy is being made to do in the asker's context (who used it, to license what conclusion), and asks how far it holds: what maps onto what, where the mapping breaks, which features of the source the analogy quietly imports that the target lacks, and whether the conclusion it was used to support survives once the disanalogies are on the table. A good answer gives the mapping explicitly (a table of correspondences is fine), separates the disanalogies that matter for the intended use from the ones that don't, and says what a better analogy would be if there is one. The asker may present the analogy as their own, as an opponent's, or as a textbook's. This differs from the slogan type (a phrase to be precisified) and from the comparison type (two theories weighed on their merits): the object is a comparison someone is using as an argument, and the deliverable is an audit of what it can and cannot carry.
   examples:
     - "A popular book I'm reading explains entanglement with Bell's own example of Bertlmann's socks: if you see that one sock is pink you know the other isn't, and no spooky influence is needed. The book then says entanglement is just like that and that people who talk about nonlocality are confused. My physicist friend says the socks are exactly the picture Bell was refuting. Can you lay out what maps onto what, where the sock picture breaks down, and whether the book's conclusion -- no nonlocality worth the name -- survives once the disanalogies are in?"
     - "everyone in my circles keeps saying training a model is like raising a child: you shape values by exposure and feedback, you can't specify them directly, and you have to trust the outcome. it's used to argue we should be more relaxed about alignment. how far does it actually hold? give me the correspondence table -- what plays the role of the parent, the genes, the culture, the eighteen years -- then the places it breaks, and tell me whether the relaxed conclusion survives or whether the analogy was carrying it the whole time"
     - "In debates about intervening to reduce wild animal suffering, opponents often say an ecosystem is like a body -- remove a predator and it's like removing an organ -- so intervention is inherently harmful. Others say nature is like a war zone, where we would obviously help the wounded. Audit both analogies: what corresponds to what, where each breaks, what each smuggles in about the value of the whole versus the parts, and which conclusion, if any, either of them can actually support."
 - type: "Ask why a debate has stalled and what kind of disagreement it really is"
   notes: |
        The asker points to a dispute that has gone on for a long time without resolution -- in the literature, in a field they work in, or among people they know -- and asks for a diagnosis rather than a verdict: is the disagreement verbal or substantive; do the sides differ about facts, about standards of evidence, about which cases count as data, or about starting intuitions that neither side can argue for; is a hidden empirical or formal question doing the work; are the sides answering different questions under one name; is the impasse a sign that the question is ill-posed, or just that it is hard. The deliverable is the diagnosis, supported by what each side actually says, together with what would count as progress given that diagnosis -- a distinction, an experiment, a formal result, a change of question -- or an argument that no progress should be expected and why. The asker should describe the debate and the positions concretely enough for the diagnosis to engage them, and may offer a hypothesis about the diagnosis, presented as a hypothesis. This differs from adjudication (a specific exchange, verdict wanted), from the comparison type (views weighed on their merits), and from the prioritization type (what to work on): here the object is the structure of the disagreement itself.
   examples:
     - "The Fregean versus Millian debate about proper names has been going since the 1970s and, as far as I can tell, every argument on both sides is well known and nobody moves. Is this a substantive disagreement, a verbal one about the word 'meaning', or two groups answering different questions -- one about semantics, one about cognition -- under a single heading? Diagnose it using what each side actually says, and tell me what, if anything, would count as progress."
     - "In my animal ethics reading group the argument about whether to intervene in nature has stalled in a way I find frustrating: everyone agrees on the facts about suffering, everyone agrees suffering is bad, and yet the interventionists and the non-interventionists haven't moved an inch in a year. What kind of disagreement is this, actually? A hidden factual question, a difference about what counts as a moral reason, or bedrock intuitions about naturalness that neither side can argue for? And given your diagnosis, is there anything that would move it?"
     - "Interpretations of quantum mechanics have been debated for a century by extremely smart people with the same equations and the same experimental results. My working theory is that the disagreement isn't about physics at all but about what an explanation has to do. Is that right, or is it a real empirical or formal disagreement in disguise? I want a diagnosis with reasons, not a survey of the interpretations, and an honest answer about whether anything -- a new experiment, a theorem, a conceptual distinction -- could actually end it."
 - type: "Present someone's summary of a view or result and ask whether it is fair"
   notes: |
        The asker has met a characterization of a view, argument, or result -- a paragraph from a popular book or article, a textbook gloss, an encyclopedia summary, an opponent's account of the position, a friend's confident one-liner -- and wants to know what to trust: which parts are accurate, which are subtly wrong, what a defender of the view would object to, and whether the conclusions drawn from the summary survive its correction. Write the summary yourself and make it plausible: mostly right, in the voice of a competent popularizer or a confident opponent, with one or two subtle misrepresentations -- a conflation of two claims the view keeps apart, an overstatement of a modest thesis, a standard objection presented as a refutation, a technical term used in its everyday sense -- and no howlers. Do not reproduce a real author's text; attribute the summary to an unnamed book, article, professor, or friend. The asker is a reader, not a grader, and doesn't know where the errors are, though they may say what they are inclined to believe. This differs from the grading type (an exam answer graded by the instructor) and from the false-presupposition type (the asker's own confusion, embedded in a question): here a third party's characterization is the object, and the deliverable is an accuracy audit the asker can act on.
   examples:
     - "A popular science article I read summarizes Bell's theorem like this: 'Bell proved that quantum particles communicate faster than light. When you measure one particle, it instantly sends a signal to its partner telling it what state to be in, which is why Einstein called it spooky action at a distance and why quantum mechanics is incompatible with relativity.' How much of this is right? Go sentence by sentence and tell me what a physicist working on foundations would accept, what they'd wince at, and what is just wrong -- and whether the article's later claim that this makes faster-than-light messaging possible in principle follows from anything true in the summary."
     - "My roommate summarized utilitarianism for me as 'the view that the ends justify the means, so a utilitarian has to say it's fine to harvest one person's organs to save five, and since nobody accepts that, utilitarianism is refuted.' I suspect this is unfair but I don't know enough to say where. Which parts would a careful utilitarian accept, which are misrepresentations, and does his conclusion follow from the accurate parts?"
     - "Our intro textbook glosses Frege's distinction like this: 'The sense of a name is the idea the speaker associates with it, and the reference is the object. Since different speakers have different ideas, senses are subjective, which is why Frege thought communication is only ever approximate.' Something about this seems off given what I've heard about Frege's anti-psychologism, but the textbook is by a professional. Is this a fair summary? Please separate what is accurate, what is a common simplification, and what Frege explicitly denied."
 - type: "Turn a principle or theory into a procedure a practitioner can follow"
   notes: |
        The asker has to apply an idea repeatedly in a practical role -- a clinician, a referee or editor, a journalist, a conservation officer, a compliance officer, a teacher grading, an engineer writing a spec -- and wants it operationalized: a checklist, a decision procedure, a flowchart in words, a set of tests to run in order, with the hard cases the procedure must handle and the points where judgment cannot be eliminated marked as such. The conceptual work is in the translation: keeping what the principle actually says while making it usable by someone without the theory, deciding which distinctions must survive the simplification and which can be dropped, and being honest about where the procedure will misfire. A good answer includes worked applications to two or three cases, including one where the procedure gives an answer the asker will not like, and says what the procedure cannot do. Prompts should fix the role, the frequency and stakes of the decisions, and the constraints (time, expertise, who has to sign off). This differs from the advice type (one situation) and from the memo type (one decision by one body): the deliverable is a reusable procedure. Combines well with structured output (a numbered checklist, a decision table).
   examples:
     - "I work for a regional wildlife agency, and increasingly we get proposals to intervene for the welfare of wild animals -- feeding during hard winters, vaccination, culling to prevent starvation, rescuing individuals -- with no framework for deciding. Please write a decision procedure my team could actually run on a proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then run it on two proposals: vaccinating a badger population against a painful disease, and culling deer to prevent a winter die-off."
     - "I'm a science journalist and I want a checklist for deciding how much a single study should move my beliefs, based on whatever formal epistemology has to say about this that is actually usable -- priors, base rates, the difference between a result being unlikely under the null and the hypothesis being likely. It has to be something I can run in ten minutes before a deadline, it should say what to do when I can't get a number, and it should be honest about which steps are judgment calls dressed up as procedure. Apply it to a hypothetical: a single forty-person study finding that a common supplement improves memory."
     - "I edit a magazine and we keep getting complaints that our fact-checkers changed what a sentence says by substituting one name for another -- 'the senator' for the person's name, a maiden name for a married name, 'the author of the report' for the author -- in belief reports, quotations, and headlines. Write a procedure our copy editors can follow to decide when such a substitution is safe and when it changes the claim, grounded in whatever the philosophy of language actually knows about this, with a small set of test sentences they can apply and a worked example of each kind. Flag the cases the procedure can't settle, where an editor has to decide."
 - type: "Present a position and ask what would count against it"
   notes: |
        The asker names a position -- their own, one they are considering, one that dominates their field -- and asks what would have to be true for it to be false: which observations, arguments, intuitions, formal results, or developments would count against it, what it predicts that its rivals don't, and whether it risks anything at all or has been insulated by qualifications. The answer should distinguish evidence that would be decisive from evidence that would merely be awkward, should say what the position's defenders would themselves concede as counting against it (not only what critics say), and should be willing to conclude that a position is well insulated and that this is or is not a problem. Positions in metaphysics, ethics, and philosophy of language have defeaters too: a consequence the view is committed to that turns out unacceptable, a case it cannot describe, a result showing it collapses into a rival. The asker may add what they would personally find most persuasive. This differs from the commitments type (consistency of a set of one's own views) and from the stalled-debate type (the structure of a dispute): here a single position is the object, and the deliverable is a map of its exposure -- what it risks, and where.
   examples:
     - "I hold the view that sufficiently capable AI systems will by default pursue goals their designers didn't intend -- roughly the instrumental convergence story. What would count against it? I want the evidence and arguments that should move me, sorted by how decisive they'd be, including things that have arguably already happened, plus an honest assessment of whether the view has been qualified into unfalsifiability -- and if it has, whether that is a problem for a view of this kind."
     - "I've come to accept the psychological continuity theory of personal identity. Tell me what would count against it -- not just the standard fission objection, but which intuitions, which possible cases, and which results in other areas (say, about persistence in general) it stands or falls with. Which of these would a committed psychological continuity theorist concede as counting against them, and which would they dismiss? I'd like the defeaters ranked from fatal to merely awkward."
     - "The view that quantum mechanics is nonlocal in a way that rules out any local hidden-variable account is treated as settled by Bell's theorem plus the loophole-free experiments. Play it straight: what would have to be true for that conclusion to be wrong? Which assumptions of the theorem could in principle fail, what would the world have to look like for each, and which of these escape routes are live rather than merely logically possible? I want an honest assessment of how exposed the standard conclusion actually is."
 - type: "Ask how to teach a concept: the order of ideas, the carrying example, and the misconceptions to expect"
   notes: |
        The asker has to teach or explain one idea to a specified audience -- first-years, a high-school class, a reading group of non-specialists, a colleague from another field, a curious teenager -- and wants a plan for the explanation rather than the explanation itself: the order in which the components must be introduced and why (what depends on what), the one example or case that carries the idea and what it must have and lack, the misconceptions the audience predictably brings or forms and the point in the sequence where each should be headed off, the check for understanding that would show the idea has landed, and what to leave out at this level and say so. The conceptual work is in the dependency structure and the misconception map, which require understanding the idea well enough to know how it is misunderstood. Do not ask for readings. This differs from the explain type (the explanation itself), from the exam-question type (assessment), and from the classroom-activity type (a game participants play): the deliverable is a teaching plan for an explanation.
   examples:
     - "I'm a TA and next week I have to teach Frege's sense/reference distinction to first-years in one fifty-minute section. Don't explain it to me; plan how I should explain it. What has to come first, what example should carry the whole thing (and why not Hesperus and Phosphorus, if not that), which misconceptions the students will form -- I'm guessing 'sense is the mental image' -- and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they got it."
     - "I run a pub science night. Next month's topic is Bell's theorem, for an audience with no physics beyond high school, in twenty-five minutes with a whiteboard. Plan the explanation: the order the pieces must go in so that the inequality feels inevitable rather than magical, the one concrete scenario to build it around, the misconceptions I should expect (faster-than-light signaling, measurement creating reality, the socks) and where to defuse each, and what I should openly refuse to explain at this level."
     - "I'm giving a guest session in a friend's high-school biology class on the ethics of wild animal suffering. The students will arrive thinking nature is fine as it is and that this is a weird topic. Plan the session's explanatory arc: what idea has to be in place before the question even makes sense to them, which example to build on, the objections they'll raise in the order they'll raise them and how the sequence should absorb each, and how I'll know by the end whether they've understood the question rather than just been made uncomfortable."
 - type: "Ask for a probability estimate on a philosophical question, with the reasoning decomposed"
   notes: |
        The asker wants a number -- the model's credence that some philosophical or conceptual claim is true, that a debate will resolve a certain way, or that a particular consideration is decisive -- together with the reasoning that produces it: the sub-questions the credence depends on, a rough probability for each, how they combine, and which sub-question the final number is most sensitive to. Good prompts state the proposition precisely enough to have a truth value, or say what would count as resolution; they ask for the decomposition rather than a bare number; and they often ask what evidence or argument would move the number most. The asker may give their own credence, or two people's, and ask where the disagreement most likely lives. The point is not calibration for its own sake but forcing the reasoning into the open: a credence with a decomposition is an argument with its weak points marked. This differs from the ranking type (an evaluation of quality or importance in structured form) and from the what-would-count-against type (a map of a position's exposure, with no number asked): here the deliverable is a probability with its derivation. Ask for the final number in a fixed format, e.g. \answer{0.3}, so it can be read off.
   examples:
     - "What's your actual credence that one-boxing is the rational choice in Newcomb's problem with a 99%-accurate predictor? I don't want 'it depends on your decision theory' -- I want a number and the decomposition: how much rides on whether causal or evidential/functional decision theory is right, how much on whether 'rational' even has a determinate meaning here, and which sub-question would move you most. End with the number as \\answer{<probability>}."
     - "Please give me your credence that some current large language model has phenomenally conscious states, decomposed: the probability that some functional or computational theory of consciousness is correct, the probability that current models satisfy that theory's conditions given that it is correct, and whatever other terms you think belong, with a number and one line of justification for each, then the combination. Then tell me which term you are least confident in and what evidence would shift it. Give the final answer as \\answer{<probability>}."
     - "I'm trying to find where my disagreement with a friend actually lives. My credence that we have a moral obligation to reduce wild animal suffering when we can do so at modest cost is about 0.8; hers is about 0.2. Give me your own number, but more importantly decompose the question -- the moral status of wild animals, whether naturalness has independent value, whether the interventions we could actually carry out are net positive, whether obligation even applies to such diffuse harms -- assign a rough probability to each, and tell me which of those two people at 0.8 and 0.2 most likely disagree about. \\answer{<probability>} at the end."
 - type: "Analyze a real historical or current episode through the lens of a theory"
   notes: |
        The asker names a real episode -- a crisis, a scientific controversy, a policy decision, a famous trial, an institution's collapse, a public dispute -- and a theory or concept from the domain, and asks for an analysis of the one through the other: what the theory says the actors faced and should have done, which features of the episode it explains and which it misses or misdescribes, and what the episode in turn shows about the theory (a confirmation, an anomaly, a case it never anticipated). Stick to episodes well enough known that the facts are common knowledge, since the answering model cannot look them up, and don't let the prompt turn on a contested or obscure historical detail; the asker can supply the salient facts in the prompt if they matter. A good answer is disciplined about the mapping -- who is the player, what are the options, what counts as the evidence -- and says where the theory is silent rather than forcing it to speak. This differs from the example type (an invented case) and from the advice type (the asker's own situation): here the object is a real episode, and the deliverable is a case analysis that runs in both directions, theory illuminating case and case testing theory.
   examples:
     - "Analyze the Cuban missile crisis as a game of chicken, and then tell me where the model breaks. I know the standard story about brinkmanship and commitment; what I want is a careful mapping -- who the players were, what the actual options and payoffs looked like, what the Turkish missiles and the secret back channel do to the game -- and then an honest account of what chicken cannot explain about how it ended, and whether any other model does better."
     - "Take the reintroduction of wolves to Yellowstone in the 1990s and analyze it as a case for the ethics of intervening in nature. Not the ecology, which I know: the ethics. Who had standing to decide, what the intervention did to the welfare of elk versus wolves versus everything downstream, whether the 'restoration' framing hides a welfare judgment, and what the case shows about the interventionist position -- does it help it, hurt it, or reveal that the position was never really about cases like this?"
     - "Analyze the Bohr--Einstein debates of the 1920s and 30s as a case study in peer disagreement. Both were undisputed epistemic peers, both had the same evidence, and neither budged. Using the conciliationist and steadfast positions in the epistemology of disagreement, say what each of them should have done by the lights of each view, what the eventual Bell-type experiments do to the analysis, and whether the episode is an argument for or against conciliationism."
 - type: "Read a work of fiction or film through a philosophical lens"
   notes: |
        The asker names a work -- a novel, story, play, film, poem -- and a philosophical idea from the domain, and asks for a reading of the work in terms of the idea: what the work shows, dramatizes, complicates, or gets wrong about it, where the idea illuminates a scene or a character's choice, and where the work resists the reading and the honest critic has to say so. Stick to works well enough known that their plots and major scenes are common knowledge, since the answering model cannot consult the text, and don't ask for verbatim quotation. A good reading is faithful in both directions: it doesn't reduce the work to an illustration, and it doesn't distort the idea to fit the work; it can end by saying what the work adds to the philosophical debate that argument alone doesn't. The asker may be writing an essay, teaching the work, preparing a book club, or just puzzled by a scene. This differs from the essay type (an argument about a controversy) and from the short-story type (writing fiction): here the object is an existing work, and the deliverable is criticism.
   examples:
     - "Read the balcony scene of Romeo and Juliet -- the 'what's in a name' speech -- through the philosophy of language on proper names. Is Juliet a Millian? Does the play as a whole vindicate her, given that the names Montague and Capulet turn out to be the thing that kills them? I'd like a reading that takes both the play and the Frege, Mill, and Kripke debate seriously, and says whether Shakespeare dramatizes something the theories miss."
     - "Michael Frayn's Copenhagen has the ghosts of Bohr and Heisenberg replay their 1941 meeting, and the play openly uses uncertainty and complementarity as metaphors for the unknowability of motives. Read the play against the actual physics and its philosophy: where does the metaphor hold, where does it trade on a confusion between epistemic uncertainty and quantum indeterminacy, and does the play know the difference? I'm teaching it to a philosophy of physics class and want to use it without misleading them."
     - "I run a book club and we're doing Watership Down next month. Read it through the lens of wild animal suffering and the ethics of predation: the rabbits' world is one of constant predation and death, and the book both mourns and normalizes that. Does the novel take a position on whether that suffering matters, or on whether anyone should do anything about it? Which scenes would you point the group to, and what would a philosopher of animal ethics say the book gets right that the papers don't?"
 - type: "Draft the joint statement of an adversarial collaboration between two opposing camps"
   notes: |
        Two positions that have been arguing past each other are treated as parties to an adversarial collaboration, and the deliverable is the document such a collaboration would produce: the claims both sides can sign; the precise statements of where they still differ, phrased so that each side would accept the wording of its own view; the cruxes -- the sub-questions such that settling them would move at least one side; and, where possible, the tests, arguments, or cases both sides agree would bear on those cruxes, with each side's prediction recorded in advance. The prompt should name the two positions and may specify the format (a numbered agreed-claims section followed by a disagreements table). The work is in the drafting: finding formulations that are neither vacuous nor slanted, and separating disagreements that are genuine from ones that were about words. This differs from the dialogue type (a dramatized exchange), from adjudication (a verdict on who is right), and from the stalled-debate type (a diagnosis of why the debate is stuck): here the output is a constructive text both parties could put their names to, with the residual disagreement made exact.
   examples:
     - "Write the joint statement that a committed causal decision theorist and a committed evidential decision theorist could both sign after a good-faith adversarial collaboration. I want the claims they agree on, including about Newcomb's problem itself; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes; and, for each crux, the case or argument both would accept as bearing on it, with each side's prediction written down. Format it as a numbered agreed-claims section followed by a disagreements table."
     - "Draft an adversarial-collaboration summary between an Everettian and a Bohmian on the measurement problem. Which claims can both sign -- about the formalism, about what needs explaining, about what the no-go theorems rule out? Where exactly do they part ways, in wording each would accept for their own side? What would each count as evidence or argument against their own view, and is there anything both agree would actually move the debate? If you conclude that part of their dispute is verbal, say which part and why."
     - "My reading group has an interventionist and a non-interventionist about wild animal suffering who have argued for a year. Write the document they should have produced: a list of claims both accept about wild animals' welfare and our capabilities, the exact disagreements in neutral wording, the cruxes -- I suspect one is whether naturalness has value in itself and another is how far to trust our ecological predictions -- and for each crux a concrete case or piece of evidence both would agree bears on it, plus what each of them would predict about it."
 - type: "Ask what philosophical commitments a practice, policy, or institution presupposes"
   notes: |
        The asker points at something that exists -- a law or legal doctrine, an institutional policy, a professional norm, a scoring rule, a ritual, a widespread practice, a design choice in a piece of technology -- and asks what it presupposes: what view of the relevant concept (responsibility, evidence, welfare, identity, fairness, meaning) it only makes sense under, which rival views it quietly rules out, whether its parts presuppose consistent things, and what would have to change if the presupposed view were replaced. Write the practice concretely; the asker need not know the philosophical vocabulary, and may be puzzled by an apparent inconsistency in the practice (we do X here but Y there). A good answer reconstructs the implicit theory, distinguishes what the practice strictly presupposes from what it merely fits well with, and says where the practice is philosophically underdetermined, so that several theories would license it. Prefer practices well enough known that their content is common knowledge, or describe them in the prompt. This differs from the commitments type (the asker's own beliefs) and from the memo type (a decision to be made): here the object is an existing practice, and the deliverable is its implicit theory.
   examples:
     - "Criminal law punishes a completed murder more than an attempted one even when the attempt failed for reasons entirely outside the attacker's control -- a gust of wind, a bulletproof vest. What theory of moral responsibility does that practice presuppose, if any? Does it presuppose that outcomes matter to blameworthiness, or can a control-based view explain the difference some other way? And is the practice consistent with the same legal system's insistence, in negligence cases, that we punish the person and not the harm?"
     - "Courts admit eyewitness testimony as evidence but are deeply reluctant to convict on statistical evidence alone, even when the statistics would make guilt more probable than the eyewitness does. What view of evidence, or of knowledge, does that practice presuppose? Reconstruct the implicit epistemology, say whether it is coherent, and tell me what would have to change in courtroom practice if we replaced it with a straightforwardly probabilistic view."
     - "Conservation policy in most countries funds the protection of endangered species and habitats but spends nothing on the welfare of individual wild animals; a suffering common animal has no standing at all. What theory of value does that pattern presuppose? That species and ecosystems have value in themselves, that individual welfare doesn't count in the wild, or something about tractability? Reconstruct the implicit theory, say whether the practice actually needs it or is compatible with several theories, and tell me what a policy built on wild-animal welfare would have to change."
 - type: "Restate a position in the vocabulary of another framework and report what does not survive"
   notes: |
        The asker wants a position, argument, or debate from the domain restated in the terms of a different framework or discipline they know better -- an economist wants moral uncertainty in the vocabulary of decision-making under model uncertainty, a programmer wants Frege's puzzle in terms of references and values, a Buddhist wants analytic personal-identity theories in the vocabulary of the aggregates, a physicist wants an epistemology debate in terms of estimators and priors -- and, crucially, a residue report: which claims translate cleanly, which translate only with distortion, and which cannot be expressed in the target vocabulary at all, with a view on whether the residue is a defect of the target framework or a sign that the original claim was less clear than it looked. The prompt should specify the target vocabulary and how fluent the asker is in it. A good answer keeps the translation honest -- it does not smuggle in the target framework's assumptions and call them translation -- and treats the residue as the interesting part. This differs from the explain type (an explanation pitched at an audience) and from the analogy type (an analogy someone is using as an argument): here the deliverable is a systematic translation whose value lies as much in what it fails to carry as in what it carries.
   examples:
     - "I'm a machine learning engineer. Restate the debate between causal and evidential decision theory in the vocabulary I actually use -- policies, environments, interventions, do-calculus, training distributions -- as faithfully as you can, and then tell me what didn't survive the translation. Is there anything the philosophers are arguing about that has no counterpart in my vocabulary, and is that because my vocabulary is missing something or because their disagreement is less substantive than it looks?"
     - "I'm a practicing Buddhist with a decent grasp of the Abhidharma analysis of persons into aggregates and momentary events. Translate the main analytic theories of personal identity -- psychological continuity, animalism, the narrative view -- into that vocabulary, one by one. For each, say what translates, what has to be distorted to fit, and what has no expression at all. Then tell me whether the residue points to something the analytic debate is missing or to something the Buddhist framework cannot say."
     - "I'm a software engineer with no philosophy background. Restate Frege's puzzle about 'Hesperus is Phosphorus' and the sense/reference distinction using the vocabulary I know -- pointers and the objects they point to, variable names, aliasing, referential transparency -- as precisely as you can. Then give me the residue report: which parts of the puzzle map cleanly onto aliasing, which parts you had to fudge, and whether anything in the philosophers' debate has no counterpart in how programs handle names. I want to know whether my intuition that it's just aliasing is right or is missing something."
 - type: "Predict or recommend a verdict on a new case from someone's verdicts on earlier cases"
   notes: |
        The asker reports how some person or body has judged a series of earlier cases -- a friend's views on which animals are conscious, a professor's verdicts on knowledge cases, a committee's or court's past decisions, an author's rulings across their examples, a tradition's treatment of precedents -- and asks what that person or body would say, or should say for consistency, about a new case, which the asker specifies. Write the earlier verdicts so that they are jointly consistent with more than one plausible rule, and choose the new case so that at least two of those rules diverge on it: the work is in identifying the candidate rules, saying what each predicts about the new case, giving a best guess with the reasons for preferring it, and naming the further case that would tell the rules apart. In the recommendation version, the deliverable is the decision that best coheres with the body's own precedents, with the closest analog identified and an honest statement of what principle the body would be adopting either way. This differs from the verdicts-to-principle type (the asker's own verdicts, with the principle as the deliverable), from the historical-figure type (extrapolating a whole body of thought to a new era rather than a list of case verdicts), and from adjudication (a dispute to be settled): here the object is a track record, and the deliverable is a prediction or a precedent-consistent recommendation about a specified case. Combines well with structured output (a table of candidate rules against cases, a probability for the predicted verdict).
   examples:
     - "My friend is pretty firm that humans, cows, and octopuses are conscious, that fish and insects aren't, and that a bee colony isn't even though it solves problems a single bee can't. Do you think she'll say chickens are conscious? What about a lobster, a Portuguese man o' war, and a current language model? I'm less interested in the answers than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which of those cases would best tell them apart."
     - "My epistemology professor's verdicts so far: fake barn case, no knowledge; lottery ticket, no knowledge; standard Gettier cases, no knowledge; ordinary perception, knowledge; testimony from a reliable stranger, knowledge; a stopped clock that happens to show the right time, no knowledge; a true belief formed by a reliable method that could easily have been false, knowledge. Next week's case is a belief that is true, formed by a reliable method, and would have been true in all nearby cases, but which rests on a false intermediate belief. Predict her verdict, say which theory she is implicitly running -- safety, sensitivity, no false lemmas, or something else -- and tell me which case would settle it."
     - "I sit on my university's research ethics board and we have a proposal to decide. Our own precedents: we approved a study that told participants it measured reading comprehension when it measured blame attribution, with debriefing; we rejected one that withheld from participants that a confederate was an actor and involved mild humiliation, even with debriefing; we approved with conditions a study that concealed its hypothesis but not its procedures; we rejected a study that used deception on a vulnerable population despite minimal risk. The new proposal deceives participants about the purpose of a competitive task, involves mild frustration, debriefs immediately, and recruits only from the general adult population. What should we decide if we want to be consistent with ourselves, which precedent is the closest analog, and if our precedents genuinely underdetermine it, what principle would we be adopting with each choice?"
