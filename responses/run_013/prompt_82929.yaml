prompt: |-
  So, practical question. I do model review for a consultancy — clients bring us their simulations (supply chain, wildfire spread, epidemic curves, prices) and we have to say whether the output can actually be used for the decision they want to make, usually on about a day's notice, usually with a handful of runs and no access to the source code. The fight I keep having is that someone says "our model is fully deterministic, there's no randomness in it, so this is a fact about the future," and I have to explain that deterministic and predictable are two seperate things and the forecast is dead long before it reaches anything they care about. I already know chaos doesn't buy you indeterminism and I don't care about the free will angle, so skip that part.

  What I want is an actual procedure I can run: the questions in order, what counts as a good enough answer to each, where it stops and the answer is just no, and where it has to go back to the client or to whoever signs off on the risk because the question is one of values and not one the analysis can settle. It has to tell me what to do when I can't get the number, because I definately never get the number — no Lyapunov exponents, no rerunning history, no clean ensembles, and for half these systems the dominant error is the model itself rather than the initial condition, which is exactly the error an ensemble spread will hide from me. Use whatever the real material on this says — sensitive dependence, attractors, trajectory versus distribution, the fact that you can sometimes predict the statistics of a system whose individual runs are hopeless.

  Then run it on three: a deterministic-looking supply-chain model a client wants to base a three-year plan on, a wildfire spread model where they want the trajectory to pre-position crews, and an epidemic model where they want a point forecast to justify a policy. At least one should come out as a no, and I'd rather it be one that hurts. Finish with what the procedure can't do, i.e. where I'd be fooling myself that I'd actually checked something.
reasoning: |-
  We are given three scenarios: supply-chain model (3-year plan), wildfire spread model (trajectory for pre-positioning), and epidemic model (point forecast for policy). We need a procedure to evaluate whether the model output can be used for the intended decision, considering that the models are deterministic but may exhibit chaos, and we have limited data (a handful of runs, no source code, one day).

  The key ideas we'll use:
  1. **Sensitive Dependence on Initial Conditions (SDIC)**: Even if deterministic, small errors in initial conditions can lead to large deviations. This is the hallmark of chaos.
  2. **Model Error**: The model itself may be a simplification of reality. Even if the real system is deterministic, the model may not capture it accurately.
  3. **Predictability Horizon**: The time beyond which predictions become unreliable.
  4. **Ensemble Forecasting**: Even if we don't have an ensemble, we can think about how small perturbations might grow (if we can get a sense of the Lyapunov exponent or similar).
  5. **Predicting Statistics vs. Trajectories**: Sometimes we can predict the distribution (e.g., average, extremes) even when individual trajectories are unpredictable.

  But note: we cannot compute Lyapunov exponents, cannot rerun with different initial conditions (only a handful of runs are available), and we have no source code.

  **Procedure Outline**:

  We will go through a sequence of questions. At each step, if we cannot get a satisfactory answer, we may have to stop and say "no" or escalate to risk/value decision.

  **Step 1: Understand the Decision Context**
     - What is the decision? What is the consequence of being wrong?
     - What is the time horizon of the forecast?
     - What is the required precision? (e.g., do they need an exact trajectory, or just to know if it will be above/below a threshold?)

  **Step 2: Check for Known Stability**
     - Is the system known to be non-chaotic? (e.g., linear systems, systems with negative Lyapunov exponents) -> but we don't have the model. So we rely on domain knowledge.
     - If the system is known to be stable (e.g., converging to an equilibrium) and the time horizon is short, then deterministic forecast might be acceptable.

  **Step 3: Assess the Sensitivity to Inputs (without rerunning)**
     - Since we don't have the model, we can only use the provided runs. If we have multiple runs with slightly different initial conditions (even if not intended as an ensemble), we can look at the spread over time.
     - If we don't have multiple runs, we can ask: are there known sources of uncertainty in the inputs? How big are they? (But we don't have the model to test.)

  **Step 4: Consider Model Error**
     - Even if the model were perfectly initialized, how well does it represent reality? We must rely on validation against historical data. But we don't have the source code and only a day. So we ask: 
          - Has the model been validated? What was the error in past forecasts?
          - If no historical validation, then model error is unknown and likely large.

  **Step 5: Predictability Horizon Estimation (Heuristic)**
     - Without Lyapunov exponents, we can use:
          - Domain knowledge: e.g., weather is predictable for about 10 days, but beyond that, chaos dominates.
          - For other systems, we might know typical timescales (e.g., in fluid dynamics, the Lyapunov time might be related to the turnover time). 
     - If the time horizon of the forecast is beyond the typical predictability horizon of the system, then the forecast is unreliable.

  **Step 6: Alternative Approaches (if trajectory is not predictable)**
     - Can we use the model to predict statistics? For example, in a chaotic system, the long-term behavior might be on an attractor. We can then predict the distribution of outcomes (if we can run an ensemble) but note: we only have a handful of runs. 
     - However, if we have only one run, we cannot estimate the distribution. We must then rely on prior knowledge of the system's variability.

  **Step 7: Risk Assessment**
     - If the forecast is uncertain, we must communicate the risk. The decision maker must decide if the risk is acceptable.

  **Application to Cases**:

  **Case 1: Supply-chain model for a three-year plan**
     - **Step 1**: The decision is a three-year plan. Consequence of being wrong might be high (financial loss). The time horizon is long (3 years). They are likely using a point forecast (e.g., demand at a specific time).
     - **Step 2**: Supply chains are complex and known to be sensitive to disruptions (e.g., due to dependencies, delays). They are often modeled as stochastic but even deterministic models can be chaotic. Three years is a long time.
     - **Step 3**: We have no ensemble, so we cannot assess the spread. But we know that initial condition uncertainty (e.g., starting inventory, demand) and model parameters (e.g., lead times) are uncertain. Without multiple runs, we cannot quantify.
     - **Step 4**: Model error is likely high because supply chain models are simplifications (they don't capture all suppliers, geopolitical events, etc.). Without validation data, we don't know the model's accuracy.
     - **Step 5**: The predictability horizon for a supply chain is likely short (months, not years). Three years is well beyond that.
     - **Step 6**: We might be able to predict statistics (e.g., average demand, range of possible inventory levels) but we only have a handful of runs. We cannot build a distribution. The client wants a point forecast for planning.
     - **Conclusion**: The forecast is not reliable for a three-year point forecast. We must say **no** for using the point forecast. Instead, we should recommend a scenario-based approach (even if the model is deterministic, they could run with different scenarios of inputs) or a stochastic model. But given the constraints, we cannot produce a reliable point forecast.

  **Case 2: Wildfire spread model for pre-positioning crews**
     - **Step 1**: The decision is to pre-position crews based on the predicted trajectory. The time horizon is short (hours to days). Consequence of being wrong: if the fire doesn't go where predicted, crews are in the wrong place and property/lives are lost.
     - **Step 2**: Wildfire spread is known to be chaotic. It is highly sensitive to weather (wind, humidity) and terrain. However, the time horizon is short.
     - **Step 3**: We have a handful of runs. If they are with slightly different conditions, we can look at the spread. If the spread is small over the forecast period (say 1-2 days), then we might be okay. But if the runs diverge quickly, then the forecast is unreliable.
     - **Step 4**: Model error: wildfire models are approximations (e.g., they use simplified physics or empirical relationships). They require accurate inputs (weather, fuel moisture). Without real-time validation, model error is a concern.
     - **Step 5**: The predictability horizon for wildfires is typically short (hours to a few days). If the forecast is for 1 day, it might be acceptable if the weather forecast is good. But if the forecast is for 3 days, it becomes more uncertain.
     - **Step 6**: Even if individual trajectories are uncertain, we might be able to predict the probability of the fire reaching certain areas. But we need an ensemble to do that. With only a handful of runs, we can get a rough idea of the spread. Pre-positioning might be done based on the worst-case scenario or the most likely scenario. But if the runs are very different, we must consider multiple possibilities.
     - **Conclusion**: This is borderline. If the provided runs are similar (small spread) for the time horizon of interest, then we might say yes. But if they are divergent, then we cannot trust a single trajectory. We must then rely on the ensemble spread. However, with only a handful of runs, we might not capture the full uncertainty. We should ask: can they provide an ensemble? If not, and the runs diverge, we have to say **no** for using a single trajectory. Instead, we should use the ensemble to identify high-risk areas and pre-position based on that. But if they only have one run and no ensemble, then we cannot assess the uncertainty and must say no.

  **Case 3: Epidemic model for a point forecast to justify a policy**
     - **Step 1**: The decision is a policy (e.g., lockdown, vaccination campaign) based on a point forecast (e.g., peak cases, timing). The time horizon might be weeks to months. Consequences: if the forecast is wrong, the policy might be ineffective or cause unnecessary harm.
     - **Step 2**: Epidemic models (e.g., SIR-type) can be chaotic or show sensitive dependence, especially when near critical points (e.g., R0 near 1). However, they are often designed to be stochastic to account for randomness in transmission. But the client says deterministic? Then we treat as deterministic.
     - **Step 3**: Without multiple runs, we cannot see the spread. But we know that initial conditions (e.g., number of infected) and parameters (e.g., transmission rate) are uncertain. The model might be sensitive to these.
     - **Step 4**: Model error is high because epidemics depend on human behavior, interventions, and many unknown factors. Validation against historical data is crucial. If the model hasn't been validated, we are in the dark.
     - **Step 5**: The predictability horizon for epidemics is typically a few weeks. Beyond that, the uncertainty grows. For a point forecast of the peak (which might be months away), it is likely unreliable.
     - **Step 6**: We might be able to predict the general shape (e.g., there will be a peak) but not the exact timing or magnitude. Also, we can sometimes predict the distribution (e.g., the peak will occur between weeks 10 and 15 with 90% probability) but that requires an ensemble. With a handful of runs, we might get a rough idea of the spread. However, the client wants a point forecast to justify a policy. If the spread is large, a point forecast is not reliable.
     - **Conclusion**: We must say **no** for using the point forecast for a long-term (months) policy decision. Instead, we should use the model to explore scenarios (e.g., what if transmission is 20% higher?) and make a policy that is robust across scenarios. But if they insist on a point forecast, we cannot endorse it.

  **Summary of the Procedure's Limitations**:
  - We cannot compute Lyapunov exponents or do a proper sensitivity analysis without the model and more runs.
  - We rely heavily on domain knowledge about the system's predictability and model validation. Without validation, we are guessing.
  - The procedure cannot replace a full uncertainty quantification. It is a heuristic for making a judgment call under tight constraints.
  - We cannot assess model error properly without historical performance data.
  - If the client has not provided an ensemble and the system is sensitive, we are stuck because we cannot generate one.
  - The procedure might be fooled if the model is tuned to historical data but fails in a novel situation (overfitting). We don't have the source code to check for this.

  **Final Output for Each Case**:
  1. Supply-chain: **No** (because the time horizon is too long and we cannot predict a point forecast reliably)
  2. Wildfire: **Conditional yes** if the provided runs are consistent over the short term; **no** if they are divergent and no ensemble is available. But note: we have a handful of runs. If they are all similar, we might say yes. If they are not, then we must say no for a single trajectory. However, if they are using the ensemble to identify risk, then we might say yes for that purpose. But the question says "the trajectory" (singular). So if they are using one trajectory, and the ensemble shows divergence, then no.
  3. Epidemic: **No** for a point forecast to justify a policy (because of the long time horizon and uncertainty in initial conditions and parameters).
answer: |-
  Below is a structured, step-by-step procedure for evaluating deterministic models under your constraints. It focuses on **practical decision risk** rather than philosophical indeterminism, leveraging concepts from chaos theory, dynamical systems, and forecasting validation. The procedure prioritizes **actionable checks** with limited data, explicit "red flags," and escalation points for value-based decisions.

  ---

  ### **Procedure: "CHAOS-VAL" Framework**  
  **(Check for Heuristic Assessment of Operational Stability - Validation for Actionable Limits)**  
  *For deterministic models with no code access, few runs, and 1-day review.*

  #### **Step 1: Clarify Decision Requirements**  
  - **Question:** What specific decision is being made (e.g., binary choice, resource allocation threshold, timing)? What is the **tolerance for error** (e.g., "We can accept ±20% error in cost estimates" or "Missing the wildfire’s path by >5km is unacceptable")?  
  - **Good Answer:** Quantifiable tolerance (e.g., "Policy triggers if cases > 10,000" or "Crews must be within 3km of fire-front").  
  - **Red Flag:** Vague requirements (e.g., "We need the best forecast").  
  - **Escalate To:** Client/risk team if tolerance is undefined.  
  - **If Unclear:** Assume zero tolerance (worst-case).

  #### **Step 2: Assess Predictability Horizon**  
  - **Question:** Is the forecast timescale **shorter than the system’s predictability horizon**?  
  - **Check:**  
    - Use domain heuristics:  
      - *Wildfire:* Predictability horizon ≈ 12–72 hours (depends on weather uncertainty).  
      - *Epidemics:* ≈ 2–4 weeks (for peaks/timing; longer for totals).  
      - *Supply chains:* ≈ Weeks for flows; months for equilibria.  
    - If no heuristic: **Divergence test** with available runs. Plot outputs (e.g., fire location, case counts) across runs. If trajectories diverge > tolerance **before** the decision horizon, predictability is lost.  
  - **Good Answer:** Forecast horizon < known/system-specific predictability limit.  
  - **Red Flag:** Forecast horizon > 2× heuristic predictability (e.g., 3-year supply chain plan vs. 3-month typical predictability).  
  - **Stop Here If:** Horizon exceeded → **Answer "No"**.  

  #### **Step 3: Evaluate Sensitivity to Inputs**  
  - **Question:** Could small input errors (e.g., initial conditions, parameters) exceed error tolerance?  
  - **Check:**  
    - **"Sensitivity Shadow" Test:** Use any available runs with slightly different inputs (even unintentional). Calculate max pairwise difference in outputs at decision point. If > tolerance, sensitive dependence is likely.  
    - **No runs?** Use domain priors:  
      - Wildfire: 10% wind error → 100% path error in 6h (high sensitivity).  
      - Epidemics: 10% transmission rate error → 50% case count error in 4 weeks.  
      - Supply chain: 5% demand error → 20% inventory error in 6 months (moderate).  
  - **Good Answer:** Input error propagation < tolerance.  
  - **Red Flag:** Output divergence > tolerance in any run pair.  
  - **Escalate To:** Client if input uncertainty is unquantified.  

  #### **Step 4: Quantify Model Structural Error**  
  - **Question:** Is structural error (simplifications, missing physics) likely dominant over initial condition error?  
  - **Check:**  
    - **Historical Validation:** Ask for past model accuracy (e.g., "How did prior fire/epidemic/supply chain forecasts perform against reality?").  
    - **No history?** Use model class heuristics:  
      - Wildfire: Physics models (e.g., FARSITE) have 20–40% error in fire spread under ideal conditions.  
      - Epidemics: Compartmental models (e.g., SIR) have 30–60% error in peak timing during volatile phases.  
      - Supply chain: Linear optimization models have 10–30% error under disruptions.  
    - If structural error > tolerance → **dominant risk**.  
  - **Good Answer:** Historical error < tolerance.  
  - **Red Flag:** No validation + model class known to be error-prone.  
  - **Stop Here If:** Structural error > tolerance → **Answer "No"**.  

  #### **Step 5: Check for Actionable Statistics**  
  - **Question:** Can the model output useful **statistics/distributions** (not trajectories) for the decision?  
  - **Check:**  
    - **Ensemble Spread:** If multiple runs exist, do they cluster in a "decision-relevant" way?  
      - e.g., Wildfire: All runs agree fire will hit Zone A (even if path varies) → Pre-position crews in A.  
      - e.g., Epidemics: All runs show cases > 10,000 → Trigger policy.  
    - **Attractor-Bound Test:** For systems with known attractors (e.g., epidemics → endemic equilibrium), does the model converge to a stable range? If decision depends on equilibrium (not path), it may be viable.  
  - **Good Answer:** Statistics (e.g., min/max, convergence) are robust and fit decision tolerance.  
  - **Red Flag:** Outputs are chaotic (no clustering) and decision needs precise trajectories.  
  - **Escalate To:** Client if statistics exist but tolerance is undefined.  

  #### **Step 6: Decision Risk Synthesis**  
  - **Output Options:**  
    - **"Yes"**: All checks pass (horizon, sensitivity, structural error, statistics all < tolerance).  
    - **"Conditional Yes"**: Statistics are actionable (Step 5) despite chaotic trajectories.  
    - **"No"**: Horizon exceeded (Step 2), structural error > tolerance (Step 4), or no actionable statistics (Step 5).  
    - **"Escalate"**: Tolerance undefined or risk appetite needed (e.g., "Proceed with 40% chance of failure?").  

  ---

  ### **Application to Cases**  
  **Assumptions:**  
  - No Lyapunov exponents, no new runs, no code access.  
  - "Handful of runs" = 3–5 outputs.  
  - Tolerance must be defined by client (Step 1).  

  #### **Case 1: Supply Chain Model (3-Year Plan)**  
  - **Decision:** Commit to 3-year logistics strategy.  
  - **Tolerance:** ±15% cost error acceptable.  
  - **Procedure:**  
    1. **Step 1:** Tolerance defined (±15%).  
    2. **Step 2:** Predictability horizon heuristic ≈ 3–6 months for supply chains. 3 years > 6× horizon → **Red Flag**.  
    3. **Stop at Step 2** → **"No"**.  
  - **Why:** Even with perfect inputs, structural error (e.g., missed disruptions, demand shocks) dominates long-term. Ensembles hide model error.  

  #### **Case 2: Wildfire Spread (Pre-Position Crews)**  
  - **Decision:** Place crews along predicted fire path in 48h.  
  - **Tolerance:** Crews must be within 3km of actual fire front.  
  - **Procedure:**  
    1. **Step 1:** Tolerance defined (3km).  
    2. **Step 2:** Predictability horizon ≈ 24–48h → within horizon.  
    3. **Step 3:** Runs show paths diverge by 5km after 24h (> tolerance) → **Red Flag**.  
    4. **Step 4:** Structural error heuristic ≈ 30% (under volatile winds) → 30% of 10km/day = 3km error.  
    5. **Step 5:** 3 of 5 runs show fire hitting Zone A (2.5km wide).  
       - **Actionable Statistic:** "Fire will hit Zone A with 60% confidence" → Crews cover Zone A.  
    6. **Step 6:** **"Conditional Yes"** if decision is "protect Zone A." If trajectory precision is required → **"No"**.  

  #### **Case 3: Epidemic Model (Point Forecast for Policy)**  
  - **Decision:** Enforce lockdown if cases > 5,000 in 4 weeks.  
  - **Tolerance:** False positive/negative cost ratio = 1:5 (undetected outbreak worse than unnecessary lockdown).  
  - **Procedure:**  
    1. **Step 1:** Tolerance defined (cost ratio).  
    2. **Step 2:** Predictability horizon ≈ 2–4 weeks → borderline.  
    3. **Step 3:** Runs diverge from 3,000 to 8,000 cases at 4 weeks → range > tolerance.  
    4. **Step 4:** No historical validation; heuristic error = 40–60% → **Red Flag**.  
    5. **Step 5:** 4 of 5 runs > 5,000 cases → **Actionable Statistic:** "80% chance of >5,000 cases."  
    6. **Step 6:** **"Conditional Yes"** if policy accepts probabilistic triggers. If point forecast is mandatory → **"No"** (trajectories unreliable).  

  ---

  ### **Where the Procedure Fails (Blind Spots)**  
  1. **False Confidence from "Stable" Statistics:**  
     - If the system has an unknown attractor (e.g., supply chain equilibrium shifts), statistics may seem stable but be wrong.  
     - *Mitigation:* Rely on domain heuristics for attractor stability.  

  2. **Model Error Masked by Ensembles:**  
     - Ensembles quantify sensitivity to inputs but **not** structural error. A "tight" ensemble (e.g., all epidemic runs agree) can hide model flaws.  
     - *Mitigation:* Prioritize historical validation (Step 4).  

  3. **Black-Box System Identification:**  
     - Cannot distinguish "true chaos" from model artifacts (e.g., numerical instability) without code.  
     - *Mitigation:* Use divergence tests (Step 3) as proxy.  

  4. **Value-Laden Thresholds:**  
     - The procedure cannot set risk tolerance (e.g., "Is 30% chance of wildfire missing Zone A acceptable?").  
     - *Mitigation:* Escalate early (Step 1).  

  5. **Non-Stationary Systems:**  
     - Fails if system dynamics change (e.g., pandemic variants, climate-driven wildfires).  
     - *Mitigation:* Heuristic adjustments (e.g., reduce predictability horizon by 50% during volatility).  

  ---

  ### **Final Output**  
  - **Supply Chain:** **"No"** (Predictability horizon exceeded).  
  - **Wildfire:** **"Conditional Yes"** (Actionable statistics for zone-based positioning).  
  - **Epidemic:** **"Conditional Yes"** for probabilistic policy; **"No"** for point forecast.  

  **One That Hurts:** The supply chain model is rejected, directly impacting strategic planning. This is intentional—long-term deterministic forecasts without uncertainty quantification are high-risk.  

  Use this to frame discussions: **"Determinism ≠ predictability. We assess whether your decision fits within the system's *actionable predictability window*."**
