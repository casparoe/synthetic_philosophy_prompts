prompt: |-
  I'm in the back half of a cognitive science degree and I keep bumping into the "frame problem" — it turns up in my AI course as this ancient unsolved thing, and my philosophy of mind lecturer treats it like the deepest reason machines will never really understand anything. But the more I poke at it, the more it looks like a fuss about something pretty mundane. As I understand it, the problem is just that when you write down in logic what an action does, you also have to write down everything the action *doesn't* change — the walls don't move when the robot rolls across the room, the sword doesn't vanish from the chest when a door opens in my friend's RPG, and so on — and if you forget, your reasoner will cheerfully conclude that the robot can now fly or that the sword teleported. That's a bookkeeping annoyance, and it seems like something you could just automate: generate the "nothing else changes" axioms for you, or use default logic and circumscription, and if that's still not enough, let a learned model figure out what stays put. We have probabilistic world models now and systems that predict the next frame of a video game pretty well, so hasn't the frame problem basically been solved in practice — and isn't the reason philosophers still wave it around just that they're attached to the old symbolic story?

  My study partner complicates things further: she says the frame problem is really just the qualification problem wearing a hat, and seperately that it only ever applied to GOFAI, so neural nets made it evaporate. I can't tell if either of those is right, or if she's just as confused as I am. Can you set me straight — where exactly have I gone wrong, and what is the actual problem (if there even is one), in a way that survives contact with the modern machine-learning stuff rather than just restating the old textbook version? Give it to me as a numbered list of exactly five points, each one or two sentences, with no intro or conclusion.
reasoning: |-
  Hmm, the user is grappling with the frame problem in cognitive science, questioning its significance and whether it's been solved by modern AI. They've encountered it in both AI and philosophy courses, with professors presenting it as a deep unsolvable issue, but they see it as a mundane bookkeeping annoyance that could be automated. They mention their study partner's views that it's just the qualification problem or only relevant to GOFAI, and neural nets make it irrelevant.

  I need to address their specific misconceptions. First, they think the frame problem is just about explicitly stating what doesn't change in logic systems. That's part of it, but I know it's deeper. Second, they suggest automating "nothing else changes" axioms or using probabilistic models as a solution, but that oversimplifies the core challenge. Third, they wonder if philosophers cling to it because of symbolic AI bias, which isn't entirely accurate.

  The user's deeper need seems to be understanding why this concept persists despite advancements. They want a clear, concise explanation that connects to modern machine learning, not just textbook definitions. Their study partner adds confusion with claims about the qualification problem and GOFAI exclusivity, so I should clarify those too.

  Breaking it down: The frame problem isn't just about listing unchanged properties; it's about relevance - determining what matters in a given context without infinite preconditions. Even in probabilistic models, relevance is inferred from data, not explicitly solved. The qualification problem is related but distinct, dealing with necessary preconditions for actions. Philosophers care because it highlights a fundamental difference in how humans and machines represent knowledge, tied to intentionality and understanding. And it applies beyond GOFAI to any system that reasons about change, including neural nets that handle prediction but still face generalization issues.

  I'll structure my response as a numbered list of exactly five points, each one or two sentences, as requested. No introduction or conclusion, just direct points that correct misunderstandings while linking to contemporary AI. This should provide clarity without fluff, respecting the user's academic level and frustration with outdated perspectives.
answer: |-
  Here is your numbered list:

  1.  The *symbolic* frame problem (explicitly listing unchanged properties) is indeed largely automated today via successor state axioms or circumscription, but this addresses only the surface "bookkeeping" issue within formal logic systems.
  2.  The deeper, persistent "relevance problem" remains: how does any system (symbolic or neural) automatically determine *which* properties are *possibly* relevant to consider changing or preserving in a specific context, without exhaustive pre-specification or infinite data?
  3.  Modern probabilistic/neural models bypass explicit frame axioms by learning implicit predictive models from data, but they still fundamentally grapple with relevance implicitly – their success relies on the training data (and architecture) capturing the *right* regularities about what typically stays constant.
  4.  Your study partner is partially right: the qualification problem (specifying all necessary preconditions) is closely related, often seen as the flip side, and the *explicit formulation* was GOFAI-centric; however, the core challenge of relevance determination persists for *any* system needing efficient, general reasoning about change.
  5.  Philosophers emphasize it not merely from symbolic attachment, but because it highlights a fundamental gap between learned statistical correlations and the kind of flexible, context-sensitive understanding of causality and relevance exhibited by humans.
