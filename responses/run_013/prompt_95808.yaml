answer: |-
  ### Activity Design: Demonstrating Weight of Evidence vs. Probability  
  **Goal:** Make participants *experience* the distinction between probability (degree of belief) and weight of evidence (amount of evidence supporting that belief), avoiding conflation with ambiguity aversion.  

  ---

  ### **Materials (Printable in 5 Minutes)**  
  **Handout:** A single sheet with the following instructions and choices:  
  > **Instructions:**  
  > - You will see 4 rounds. In each round, choose **Urn A** or **Urn B** to draw from.  
  > - If you draw a **black ball**, you win 1 point (redeemable for chocolate).  
  > - The history of draws (with replacement) is provided. Base your choice *only* on this history.  
  > - **No discussion** until the debrief. Circle your choice for each round.  
  >  
  > **Round 1**  
  > Urn A: 1,000 draws — 500 black, 500 white.  
  > Urn B: 2 draws — 1 black, 1 white.  
  > I choose: ○ Urn A ○ Urn B  
  >  
  > **Round 2**  
  > Urn A: 1,000 draws — 500 black, 500 white.  
  > Urn B: 1,000 draws — 500 black, 500 white.  
  > I choose: ○ Urn A ○ Urn B  
  >  
  > **Round 3**  
  > Urn A: 1,000 draws — 500 black, 500 white.  
  > Urn B: 1,000 draws — 400 black, 600 white.  
  > I choose: ○ Urn A ○ Urn B  
  >  
  > **Round 4**  
  > Urn A: 2 draws — 1 black, 1 white.  
  > Urn B: 3 draws — 1 black, 2 white.  
  > I choose: ○ Urn A ○ Urn B  

  ---

  ### **Round-by-Round Timeline (Total: 40–45 Minutes)**  
  1. **Introduction (5 min):**  
     - Explain the setup: "Two urns with unknown compositions. You see their *draw histories* (with replacement). Choose one urn per round to draw a black ball. Win points for chocolate."  
     - Emphasize: "This is about how evidence *supports* probability—not Ellsberg-style ambiguity. Focus on the histories."  
     - Distribute handouts.  

  2. **Choice Rounds (10 min):**  
     - Give 2 minutes per round for silent, individual choices.  
     - **Key facilitation:** Walk around, enforce silence, remind them to commit to a preference.  

  3. **Collect and Tabulate Votes (5 min):**  
     - Collect handouts. Tally choices for each round on a board:  
       - Round 1: A: [count] | B: [count]  
       - Round 2: A: [count] | B: [count]  
       - Round 3: A: [count] | B: [count]  
       - Round 4: A: [count] | B: [count]  

  4. **Debrief (25–30 min):**  
     - **Map results to probability vs. weight:**  
       - **Round 1 (Probability = 0.5 for both, weight differs):**  
         - Expect >90% to choose A.  
         - "Why A? Same probability, but A has 1,000 draws vs. B’s 2. This is *weight of evidence*—A’s probability rests on more evidence, reducing uncertainty about the true probability."  
         - **Block ambiguity-aversion claims:** "If you say this is ‘variance aversion,’ note: both urns have identical *predictive* variance for the next draw (Bernoulli variance = 0.25). What differs is the *variance of the probability estimate* (higher for B). Weight *is* this precision."  
       - **Round 2 (Probability = 0.5, weight equal):**  
         - Expect indifference (~50/50 split).  
         - "Equal weight and probability → no preference. This isolates weight as the driver in Round 1."  
       - **Round 3 (Probability differs, weight equal):**  
         - Expect near-100% for A (probability = 0.5 vs. 0.4).  
         - "Probability dominates when weight is equal. Weight isn’t the *only* factor."  
       - **Round 4 (Probability vs. weight trade-off):**  
         - Expect >80% for A (probability = 0.5 vs. 0.33, weight = low vs. medium).  
         - "Keynes’s claim: Weight increased from A (2 draws) to B (3 draws), but probability decreased (0.5 → 0.33). You prioritized probability. Weight and probability are distinct dimensions."  

     - **Key takeaways:**  
       - Weight = amount of evidence (reduces uncertainty about the probability estimate).  
       - Probability = degree of belief given the evidence.  
       - They *can* conflict (Round 4), and people prioritize probability.  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **"This is just ambiguity aversion!" (Economists’ objection):**  
     - **Preempt:** In intro, rule out Ellsberg: "No ambiguous probabilities here—both urns have precise *estimated* probabilities based on draws."  
     - **Counter during debrief:** "Ambiguity aversion applies when probabilities are *unknown*. Here, probabilities are known (e.g., 0.5), but their *reliability* (weight) differs. Round 2 shows it’s not general ambiguity avoidance."  
     - **If pressed:** "Variance of the outcome is identical in Round 1 (Bernoulli variance). What varies is epistemic uncertainty—that’s weight."  

  2. **Round 4 confusion:**  
     - **Risk:** Some may misread and think Urn B has higher probability.  
     - **Solution:** Clarify during handout: "Urn B: 1 black in 3 draws → P(black) = 1/3 ≈ 0.33."  

  3. **Skepticism about no real draws:**  
     - **Risk:** "Why care without stakes?"  
     - **Solution:** "Points = chocolate. This is about introspecting your *felt pull* toward evidence-backed probabilities."  

  4. **Over-intellectualizing during choices:**  
     - **Risk:** Economists over-analyze, breaking the "experiential" goal.  
     - **Solution:** Enforce silence, stress: "Go with your gut. We’ll analyze after."  

  ---

  ### **What the Activity CANNOT Do**  
  - **Prove rationality:** It shows people *do* care about weight, but not that they *should*. You’ll need to argue this separately:  
    > "Reducing uncertainty about probabilities is rational if you care about robustness (e.g., repeated bets). Weight is the ‘anti-fragility’ of your probability—high weight means it’s less likely to shift with new evidence. Rational if you value stable judgments."  
  - **Fully isolate weight from variance:** The "variance of the probability estimate" is a statistical correlate of weight. Economists may reduce weight to this—stand firm that weight is the *epistemic* concept (amount of evidence) underlying it.  

  ---

  ### **Why This Works**  
  - **Stakes:** Chocolate/points make choices consequential.  
  - **Rounds 1–3:** Isolate weight (Round 1) and probability (Round 3).  
  - **Round 4:** Forces confrontation with Keynes’s claim (weight ↑, probability ↓).  
  - **Blocks ambiguity-aversion:** By fixing probabilities and varying evidence *precision*, not ambiguity.  

  Run this, and even the economists will have to grapple with weight as a distinct pull—not just nod. End by challenging them: "If weight is just ‘variance aversion,’ why did you feel safer with Urn A when the predictive variance was the same?"
