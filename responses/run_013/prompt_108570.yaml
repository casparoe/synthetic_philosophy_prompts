  Into the dirt, the air. We try to *count*
  The cost. You said experience was *one*
  With what just *is*. Not added on, but *one*.
  The collider’s ring, a terrible *charge*
  Concentrates force. Does it unknowingly *count*
  Each shattering? Each point within the *field*
  Aware? Or is awareness only *fold*-
  ed in complex ways, leaving the small *still*
  Unfeeling? Is the fundamental *still*?
  A silent hum? Or does the basic *one*,
  The quark, the lepton, know its lonely *fold*
  In space? Does it recoil from a *charge*,
  Or simply *be*, a point within the *field*,
  Neutral? There’s no observer here to *count*
  The agony, if agony there *count*-
  s. Or joy. The universe expands, *still*
  Drifting apart. Each point, each quantum *field*
  Retains its state. But where does being *one*
  Subject begin? Where does the moral *charge*
  Accrue? It blurs. A gradual *fold*.
  Her hand, the way she’d smooth a stubborn *fold*
  In cloth. The specific warmth. To *count*
  Her breaths beside me. That unique *charge*
  Of presence, gone. Yet nothing’s truly *still*
  Or gone, you’d say. Just ceased to be quite *one*.
  Dissolved back to the universal *field*.
  The kitchen light reflects off spoons. The *field*
  Of vision shimmers. Memory’s tight *fold*
  Unravels. What remains is not the *one*
  I knew. Just echoes. Can the scattered *count*
  As *her*? Or is the aggregate too *still*,
  Too diffuse now to hold that human *charge*?

  *Envoi:*
  The table holds the *charge* of absence. *Field*
  And particle alike are *still*. The *count*
  Of selves dissolves in every *fold*. Not *one*.

