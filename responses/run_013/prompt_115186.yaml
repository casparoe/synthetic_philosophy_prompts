prompt: |-
  I'm running a reading group for adults with no economics background but who follow politics closely. Next month we're doing Hume on money and trade. I've got one 90-minute session. Don't explain Hume to me -- I need a plan for how to teach it. The thing I want them to actually get is the apparent tension in Hume: he says money isn't wealth and that in the long run more money just raises prices, yet he also thinks a sudden inflow of money can temporarily boost industry and employment. And he uses that to argue against mercantilism and against fearing the prosperity of other nations. Plan the session's arc: what idea has to be in place before the tension even makes sense to them, what single example should carry the whole thing (and why not just the standard example of gold discovered in Spain), the misconceptions they'll bring or form -- I'm guessing they'll think Hume is a simple quantity theorist, or that Hume thinks money doesn't matter -- and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they got the tension rather than just memorized the conclusion. Also tell me what to leave out at this level and say so. Keep it under 600 words. I dont need readings or citations, just the teaching plan.
reasoning: |-
  Okay, the user is running a reading group for adults with no economics background but who are politically engaged. They need a 90-minute session plan on Hume's views on money and trade, focusing on the tension between money not being wealth in the long run versus its temporary stimulative effects. The key is to help them grasp this tension to counter mercantilism and the fear of other nations' prosperity.

  First, I need to establish foundational concepts. Participants might confuse money with wealth itself. Starting with a barter economy example could clarify that wealth comes from goods and services, not the medium of exchange. This sets the stage for understanding why more money doesn't create real wealth long-term.

  The Spain gold example is standard, but the user wants an alternative. A trade surplus scenario might be better because it addresses mercantilist policies directly, showing how increased money supply from exports leads to inflation. This connects to real-world politics they follow, like trade imbalances.

  Participants might think Hume is a strict quantity theorist or that money doesn't matter at all. I need to preempt these. Early on, emphasize that money is neutral long-term but has short-term effects. Later, when discussing the inflow's impact, highlight the temporary boost to industry to counter the misconception that money is irrelevant.

  The session should start with the barter economy, then introduce money's role. Use the trade surplus example to show the price rise. Then explain the short-term stimulus due to sticky prices and increased demand. Finally, link this to Hume's arguments against mercantilism and fear of neighbors' prosperity.

  Time management is crucial. Leave out the specie-flow mechanism and technical terms. Focus on the core tension. For assessment, ask a question requiring them to apply both parts: why a gold discovery might help initially but not long-term, and why mercantilists are wrong.

  The user's deeper need is to facilitate critical discussion, so the plan must encourage interaction. Use the trade example to spark debate on modern parallels. Ensure the end question tests understanding of the tension, not just memorization.
answer: |-
  Here's a 90-minute session arc focused on Hume's tension, designed for politically engaged non-economists:

  **Core Goal:** Participants grasp the tension: Money isn't real wealth (long-run neutrality) BUT a sudden inflow *can* temporarily boost industry (non-neutrality short-run), and how this defeats mercantilism/fear of neighbors.

  **Key Foundation (15 mins): Wealth ≠ Money**
  *   **Start Simple:** "What makes a country wealthy?" Brainstorm (goods, services, factories, farms, skills, *not* cash piles).
  *   **Barter Thought Experiment:** Imagine trading wheat for shoes directly. What matters? *Real goods/services*. Money is just a convenient *tool* for this exchange.
  *   **Crucial Point:** Hume says **real wealth = productive capacity + goods/services.** Money is just the *measuring stick* or *lubricant*. More sticks/lubricant don't magically create more wheat or shoes *in the long run*.

  **Introducing the Tension via Example (30 mins): The Trade Surplus Inflow (Better than Spanish Gold)**
  *   **Why Trade Surplus?** More relevant to mercantilism & politics than a gold mine. Mercantilists fear trade deficits like the plague and hoard money (gold/silver).
  *   **The Scenario:** Country A exports a lot (say, cloth), imports little. Gold flows *in* (payment for cloth). Money supply ↑↑.
  *   **Long-Run Effect (The Obvious Part - 15 mins):**
      *   Merchants/workers with new gold spend more.
      *   But total goods haven't ↑ yet → Demand ↑ > Supply → Prices ↑↑ (Inflation!).
      *   **Result:** More money, but everything costs more. Real wealth unchanged? Nominal prices adjusted. Hume's "neutrality" illustrated. *(Preempt misconception: Hume *is* a quantity theorist long-run)*.
  *   **The Twist - Short-Run Stimulus (The Tension - 15 mins):**
      *   **Key Insight:** Prices & wages don't jump instantly! They are "sticky."
      *   **Process:** Traders get gold → spend it *now* → Shopkeepers see demand ↑ → *Before* they raise prices, they order more goods → Manufacturers see orders ↑ → *Before* they raise prices, they hire more workers/make more stuff → Workers get hired/paid → spend their wages → More demand... **Temporary boom!**
      *   **Crucial Distinction:** This boost happens *because* prices haven't fully adjusted yet. It's a transition effect, *not* creating new permanent wealth from thin air. *(Preempt misconception: Hume *doesn't* think money is irrelevant; the *process* matters)*.

  **Resolving the Tension & Defeating Mercantilism (25 mins)**
  *   **Connect the Dots:**
      1.  Long-Run: More money = Higher prices. Money isn't wealth.
      2.  Short-Run (Transition): Sudden inflow → Spending before prices adjust → Temporary production/employment ↑.
      3.  **The Tension Resolved:** The boost is *temporary* and *self-correcting* (prices/wages eventually rise). It doesn't create *permanent* new wealth, just utilizes existing capacity *more fully* for a while.
  *   **Against Mercantilism:**
      *   Hoarding money (gold) is pointless long-run (just causes inflation).
      *   Blocking imports/fearing neighbors' prosperity is counterproductive.
      *   **Hume's Insight:** Your neighbor's prosperity isn't a threat! If they get richer (more productive), they can buy *more of your exports*. Money flowing *out* to pay them will eventually lower *your* prices, making *your* exports cheaper and stimulating *your* industry! Trade is mutually beneficial.
      *   *(Preempt misconception: Hume isn't anti-trade or pro-isolation; he sees dynamic global benefits)*.

  **Assessment Question (5 mins):** "Imagine Country B discovers a huge gold mine. Using Hume's ideas, explain: a) Why won't this make Country B permanently richer in real terms? b) Why *might* it lead to a temporary economic boom? c) Why shouldn't Country A panic about B's newfound gold?"

  **What to Leave Out:**
  *   **Technical Jargon:** MV=PY, Velocity of Money, Specie-Flow Mechanism details.
  *   **Historical Nuance:** Deep dive into 18th-century context or Hume's other works.
  *   **Modern Refinements:** Expectations, central banking, complex inflation dynamics.
  *   **Detailed Critiques:** Later economists' challenges to Hume (e.g., Keynesian sticky wages vs. rational expectations). Stay focused on Hume's core tension.
  *   **Alternative Examples:** Stick to the trade surplus/gold inflow example for clarity. Avoid overcomplicating.

  **Why this works:** Builds logically from a relatable foundation (wealth vs. money), uses a politically relevant example (trade surplus), explicitly names and resolves the tension, directly links it to Hume's policy conclusions, and provides a clear assessment question targeting the core understanding.
