prompt: |-
  I am a novelist, and for a book I am writing I have been reading the medieval discussions of tyrannicide, especially Aquinas. What interests me is less the conclusion than the shape of the argument, and I want to know whether the shape has a name. Aquinas appears to allow that a tyrant may be killed, but the permission is divided. A man who seizes power without title is, on his account, fair game for anyone; a man who holds power legitimately but rules tyrannically may not be dispatched by private persons, and the remedy lies with public authority, or, if no such authority exists, with God. He also warns that killing one tyrant tends to produce another, and that the upheaval may be worse than the disease. The upshot is a doctrine that seems to license a dramatic act while making the licence almost impossible to use in the cases that actually arise. The permission is real on paper, but it is hedged by conditions that, taken together, leave the ordinary subject with little to do but endure or pray.

  That is the pattern I keep noticing, not only in Aquinas: a theory grants a radical remedy, but attaches to it a set of individually sensible conditions — proper authority, no superior to appeal to, a reasonable prospect of improvement, the risk of a worse successor — such that the remedy is available only in a vanishingly small class of cases, and perhaps in none at all. The theory can then be praised for its moral seriousness, because it does not flinch from the hard case, while in practice it counsels submission. It is not simple hypocrisy, because the conditions are sincerely meant; nor is it merely a prohibition dressed up as a permission, because the permission is not a sham — there really are conditions under which it holds. And it is not the same as an ordinary proviso or exception, because the exceptions are not marginal; they swallow the rule.

  Is there a name for this? I am looking for the established concept, if there is one, for a permission whose conditions of application are so constructed that it is nearly always inoperative, and which thereby secures the rhetorical advantage of a bold doctrine while producing the practical effect of a conservative one. I would like to know how it relates to the nearest ideas — the lesser evil, the right of resistance, the distinction between a usurper and a tyrant in exercise, the notion of a remedy that is available only when there is no lawful authority to invoke — and where the edges of the phenomenon lie. If there is no name, I should like a term coined and defined, with a clear statement of what it is not. I am less interested in the label than in the carving.
reasoning: |-
  Okay, let me start by unpacking what this novelist is asking. They're diving into medieval political thought, specifically Aquinas on tyrannicide. The key point isn't the conclusion but the structure of the argument. Aquinas allows killing a tyrant but with conditions: usurpers can be killed by anyone, but legitimate rulers turned tyrants can only be removed by public authority. Plus, there are warnings about chaos and worse successors. The result? A theoretical permission that's nearly impossible to use. 

  The user keeps noticing this pattern: a radical remedy granted in theory but surrounded by conditions that make it practically unavailable. They want to know if there's a name for this structure. If not, they need a coined term and a clear definition. They also want to understand how this relates to concepts like the lesser evil, resistance rights, etc.

  First, I recall Aquinas' Summa Theologiae, Question 42. He distinguishes between usurpers and legitimate tyrants. The conditions he adds—like public authority and risk of worse outcomes—do seem to make the permission almost void. The user calls it a pattern where exceptions swallow the rule. 

  Next, I consider related concepts. Casuistry comes to mind—case-based reasoning with intricate conditions. But it's broader. Then there's the Doctrine of Double Effect, but that's about unintended consequences. The lesser evil is a consideration within the conditions but not the structure itself. 

  The user mentioned "rhetorical advantage of a bold doctrine with conservative effect." That's key. They want to capture the tension between theoretical permission and practical restriction. 

  Looking for existing terms: "dead letter provision" in law refers to unenforced laws, but here it's about conditions making a rule inoperative. "Paper permission" is descriptive but not a formal term. "Practical nullity" is close but not specific.

  Maybe coining a term? I think about "concessive prohibition" or "licentia evanescens" (vanishing license). But they need to be clear. "Doctrinal containment" might work—containing radical ideas within safe boundaries. Or "sanitized radicalism," emphasizing the removal of danger from the idea.

  Also, distinguishing it from similar ideas is important. It's not hypocrisy because the conditions are sincere. Not just casuistry; it's about the conditions nullifying the rule. Not a sham permission since it's theoretically valid.

  The user is a novelist, so the term needs to be usable in a narrative context. They might want to reference it in their book, so clarity and memorability matter. They also want to explore the edges—when does a condition make a rule inoperative? When do exceptions swallow the rule?

  Putting it all together: the core is a permission structurally nullified by its own conditions. The term should reflect that. "Licentia Evanescens" has a scholarly ring, while "doctrinal containment" is more descriptive. Explaining the conditions as "swallowing conditions" or "nullifying safeguards" could help. 

  Need to ensure the definition covers sincerity, theoretical validity, and practical nullity. Also, relate it to Aquinas' distinction between usurpers and tyrants, and how public authority is key. The aftermath concerns (worse successor) add another layer. 

  Finally, the novelist might use this to develop a character or theme, so the term needs to resonate in a literary context. Providing options with Latin and English versions gives flexibility. Highlighting the tension between boldness and caution will help in storytelling.
answer: |-
  Your analysis brilliantly captures a recurring pattern in political and moral philosophy that *does* have conceptual neighbors but lacks a single, universally accepted name. It's a sophisticated form of **doctrinal containment** or **structured nullification**. Let's carve it out:

  1.  **The Core Structure:** A theoretically radical permission (e.g., tyrannicide) is formally granted.
  2.  **The Nullifying Mechanism:** This permission is encased within a set of *individually plausible, often morally serious, conditions*.
  3.  **The Effect:** The cumulative weight and practical improbability of satisfying *all* conditions simultaneously render the permission virtually inoperative in real-world scenarios (the "vanishingly small class of cases").
  4.  **The Function:**
      *   **Rhetorical:** Maintains theoretical purity, moral seriousness, and avoids the charge of absolutism or passive acceptance of evil ("does not flinch from the hard case").
      *   **Practical:** Effectively counsels submission, stability, and non-resistance in nearly all conceivable situations, aligning with conservative or institutional priorities.
      *   **Sincere Tension:** It's not mere hypocrisy; the conditions *are* valid concerns (risk of chaos, need for authority). The permission *is* theoretically valid but structurally inaccessible.

  **Established Concepts & How They Relate/Differ:**

  *   **Casuistry:** Your pattern *uses* casuistry (case-based reasoning with conditions). However, casuistry is the broader *method*; the specific *effect* of near-total nullification is its particular application here. Not all casuistry has this nullifying effect.
  *   **Doctrine of Double Effect (DDE):** Sometimes used *within* the conditions (e.g., killing the tyrant is foreseen but not intended, while removing tyranny is intended). DDE is a *tool* for assessing permissibility under one condition (intention), not the overall structure nullifying the permission itself.
  *   **Lesser Evil:** Often invoked as one *justifying condition* ("Is the upheaval truly the lesser evil?"). It's a *factor within* the nullifying mechanism, not the overarching structure.
  *   **Right of Resistance:** This *is* the radical permission being granted. Your focus is on *how* that right is structurally negated in practice despite its theoretical affirmation.
  *   **Distinction (Usurper vs. Tyrant in Exercise):** This is a classic *nullifying condition* itself (as in Aquinas). It carves out a tiny slice where the permission *might* practically apply (usurper) while walling off the much more common scenario (abusive legitimate ruler).
  *   **Necessity of Lawful Authority / Exhaustion of Remedies:** This is the *primary nullifying condition* for the legitimate-tyrant case. It explicitly removes agency from the "ordinary subject," centralizing action in institutions that rarely act against themselves.
  *   **Dead Letter Law:** This describes the *result* (an unenforced law), not the *intentional structure* or the *reason* for its deadness. Your pattern explains *why* it becomes a dead letter: due to its own carefully constructed doctrinal safeguards.
  *   **Paper Doctrine / Paper Right:** Descriptive terms for the *outcome*, but lack specificity about the *mechanism* (the structured conditions) causing it.
  *   **Practical Nullity:** Another term for the *result*, but doesn't capture the *sincere theoretical commitment* or the *rhetorical function*.

  **Coining a Term & Defining the Phenomenon:**

  Since no single term perfectly captures this intricate structure, I propose:

  1.  **Licentia Evanescens (Vanishing License):**
      *   **Definition:** A formally articulated moral or legal permission for a radical action (e.g., tyrannicide, revolt), deliberately encumbered by a set of individually defensible but cumulatively prohibitive conditions (e.g., proper authority, exhaustion of remedies, proportionality, foreseeable improvement, low risk of greater evil). The structure ensures the license "vanishes" under practical scrutiny, rendering it effectively inoperative while preserving its theoretical validity and the rhetorical advantages of acknowledging extreme necessity.
      *   **Key Features:** Theoretical permission / Sincere conditions / Cumulative nullification / Rhetorical boldness / Practical conservatism / Sincere tension.
      *   **Edges:** It becomes this when the conditions, however reasonable *individually*, are *structured* such that their *joint satisfaction* is either logically contradictory (e.g., "public authority" to judge a public authority), empirically vanishingly rare, or deliberately vested in entities with overwhelming incentives *not* to act. It ceases to be *Licentia Evanescens* and becomes either:
          *   A **Sham Permission** (if the conditions are disingenuous).
          *   A **Genuine but Restricted Right** (if the conditions are reasonable and frequently satisfiable, e.g., self-defense against an immediate attacker).
          *   A **Simple Prohibition** (if the "permission" clause is purely nominal).
          *   **Casuistry without Nullification** (if the conditions guide application without making it practically impossible).

  2.  **Doctrinal Containment:**
      *   **Definition:** The strategic intellectual process of acknowledging a radical moral or political principle (like tyrannicide) while simultaneously developing and emphasizing a framework of qualifying conditions designed to restrict its application so severely that the principle is "contained" and prevented from posing a significant threat to established order or practical stability. The radical core remains acknowledged but is rendered inert.
      *   **Key Features:** Focuses on the *purpose* (containing the radical idea) and the *process*. Emphasizes the intentional structuring.
      *   **Edges:** Differs from simple rejection or condemnation. Differs from practical difficulties inherent in any complex action. It's specifically about the *intellectual architecture* built *around* the radical idea to neutralize it.

  **Why these terms fit Aquinas and your pattern:**

  *   Aquinas *grants* the license (`Licentia`).
  *   He erects the nullifying conditions: Legitimacy distinction, Public Authority requirement, Risk of Worse Outcomes (`Evanescens` - causing vanishing).
  *   The effect is that the license for the most common form of tyranny (abuse by a legitimate ruler) vanishes for the ordinary subject.
  *   This structure *contains* the dangerous doctrine of tyrannicide (`Doctrinal Containment`) within safe boundaries, preventing it from justifying widespread revolt while allowing Aquinas to address the extreme case intellectually.

  **In Summary:**

  You've identified **Licentia Evanescens** or **Doctrinal Containment**: a sophisticated, sincere, and rhetorically powerful structure where a radical permission is intellectually preserved but practically nullified by its own qualifying conditions. This allows a theorist like Aquinas to navigate the perilous territory of tyranny – acknowledging the theoretical extremity where removal is conceivable, while constructing a doctrinal labyrinth ensuring that, in nearly all real situations, endurance and prayer remain the only viable options for the subject. It's the ultimate "yes, but..." of political theology. This structure is profoundly relevant to your novel, exploring the gap between the solace of theoretical possibility and the crushing weight of practical impossibility in the face of oppression.
