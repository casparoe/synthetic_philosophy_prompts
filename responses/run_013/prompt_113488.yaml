prompt: |-
  I would like you to act as an expert in epistemology and the philosophy of religion, with a strong background in analytic philosophy of language and in the theory of argumentation, and to reason carefully before you commit to an answer. My question is not really a request for a label; I care much less about the word than about the carving — what the thing I am about to describe is exactly, what it is not, and where its edges lie.

  I have been reading Hume's discussion of miracles, and I keep encountering a move that I can describe but cannot name. I want to know whether it already has one, and if it does not, I want you to give it one. Let me give you the instances that keep striking me, since the pattern is easier to see in examples than in the abstract.

  First instance. Two people consider the same report of an extraordinary event — a man said to have been dead for a day and then to have walked. The first says: an event of that sort would be a miracle, and a miracle just is a violation of a law of nature; the only evidence for it would be testimony, and testimony is never as firm as the law it would have to overturn, so the report fails. The second says: I grant that the man walked; I only deny that it was a miracle — it was some rare natural cause we have not yet identified, or an extraordinary coincidence. Notice that the two agree on every fact before them and disagree only about how to describe the event, and it is the description, not the evidence, that settles the case. The description does not follow from the evidence; it fixes in advance what will count as evidence.

  Second instance. A historian and a pilgrim examine the same case notes from a healing shrine: a woman with a long-standing condition who improved after a visit. The pilgrim calls it a miracle; the historian calls it spontaneous remission or regression to the mean. The case notes cannot arbitrate, because each description has already classified them.

  Third instance, from outside religion, to test whether the move is general or peculiar to miracle-talk. A patient recovers. One clinician credits the drug; another credits the placebo effect or the natural course of the illness. Same chart, opposite classification, and the classification decides which observations even count as relevant.

  The feature I am trying to isolate is not the mere fact that people apply different descriptions to the same facts. It is that the disputed description of the event, rather than any evidence for the event, does the decisive work, so that settling on a description settles the evidential question before it is ever asked. The move also seems symmetric: it can be used to license belief, by re-describing the natural as miraculous, or to forbid it, by re-describing the miraculous as natural.

  I half-know several things that sit near it, and none of them seems to be it. Begging the question feels too broad, and it concerns premises in an argument rather than the classification of an event. An ad hoc rescue seems to be about saving a theory by adding a rule, not about re-describing the data. A persuasive definition seems to be about redefining a word in order to change attitudes, whereas here the re-description changes what can be evidence at all. And the thought that observation is theory-laden seems to say that descriptions are never neutral, whereas I am after something narrower: a description that is contested precisely because it sets the evidential standard. Please tell me which of these is closest, how each differs from the thing I am describing, and whether some one of them is in fact the right home for it.

  I do not want a reading list or citations — I cannot look anything up — so please reason from what you know, and say plainly when you are unsure rather than guessing at a source.

  Before you answer, brainstorm: list the candidate concepts you know of that might fit, and for each note the single feature that fits and the single feature that does not; only then choose. If an established concept fits, name it and say how the phenomenon I described relates to it. If nothing fits, coin a term and define it, and give boundary cases on both sides — at least two cases that fall inside the term and two nearby cases that fall outside — so that I can see where the edges are.

  After the analysis, give me a brief structured summary as a JSON object with these fields: phenomenon_name (the established term if there is one, otherwise your coined term); status (one of established, partially matching, or newly coined); one_sentence_definition; nearest_concepts (an array of objects, each with concept and how_the_phenomenon_differs); key_discriminator (the single feature that does the carving); falls_inside (an array of boundary cases that belong to the phenomenon); falls_outside (an array of nearby cases that do not); and uncertainty (a short note on what you are least sure of).
reasoning: |-
  Hmm, the user is asking me to analyze a specific argumentative move they've observed in discussions about miracles and similar phenomena. They've described it clearly through three examples: in each case, two observers agree on the factual evidence but disagree on how to classify the event, and this classification difference predetermines how they evaluate the evidence itself. The key feature is that the description sets the evidential standard before any evidence is examined.

  The user wants me to identify if this has an established name in philosophy, and if not, to coin a term for it. They've already considered several related concepts like begging the question, ad hoc rescue, persuasive definition, and theory-ladenness of observation, but find each insufficient for different reasons. I need to systematically compare their phenomenon to these concepts.

  Looking at the phenomenon's core: it's about how contested classifications (miracle/natural, drug-effect/placebo) function as epistemological gatekeepers. The classification isn't derived from evidence but rather determines what would count as evidence for or against the claim. This differs from:
  - Begging the question: That's circular reasoning where the conclusion is assumed in the premises, whereas here it's about classification framing evidence.
  - Ad hoc rescue: That modifies theories to evade counterevidence, but here no theory modification occurs - just alternate labeling of the same event.
  - Persuasive definition: That redefines terms to sway attitudes, but here the re-description alters evidential standards, not just emotional valence.
  - Theory-ladenness: That's a broad thesis about all observation being influenced by theory, while this is a specific tactical move in argumentation.

  The closest fit seems to be "framework-dependent evidential standards," but that's descriptive rather than a named concept. For precision, I should coin a term. "Evidential preemption" captures how classification pre-sets evidence evaluation. Alternatively, "classification-determined evidence thresholds" is more precise but clunky.

  For boundary cases:
  - Inside: Hume's miracle debate (as described), medical attribution disputes (drug vs placebo), archaeological artifact classification (ritual object vs practical tool).
  - Outside: Genuine ad hoc rescue (like adding epicycles), standard theory-laden observation (like seeing a cloud as a rabbit), and straightforward persuasive definition.

  The key discriminator is: The classification of the event itself (not just background theories) directly defines what evidence could possibly confirm or refute it, making the evidentiary evaluation dependent on prior categorical commitment.

  I'm least sure whether there's an existing term in philosophy of science for this specific move - it might relate to "underdetermination of theory by evidence" but differs in being about event classification rather than theory choice.
answer: |-
  ### Brainstorming Candidate Concepts  
  I'll list potential philosophical concepts, noting one fitting feature and one misfitting feature for each relative to your described phenomenon:  

  1. **Begging the question (petitio principii)**  
     - **Fits**: Involves presupposing a conclusion.  
     - **Misfits**: Focuses on circular *argumentation* (premises assume the conclusion), not on how *event classification* predetermines evidence.  

  2. **Ad hoc rescue**  
     - **Fits**: Adjusts a position to evade counterevidence.  
     - **Misfits**: Modifies a *theory* to absorb anomalies (e.g., adding epicycles), but your cases involve *re-describing data* without altering theories.  

  3. **Persuasive definition**  
     - **Fits**: Redefines terms to sway attitudes.  
     - **Misfits**: Alters *emotional/connotative meaning* of words; your phenomenon alters *epistemic standards* (what counts as evidence).  

  4. **Theory-ladenness of observation**  
     - **Fits**: All observation is shaped by prior concepts.  
     - **Misfits**: A *broad epistemological thesis* about perception; your case is a *tactical move* where contested descriptions *explicitly set evidential thresholds*.  

  5. **Underdetermination of theory by evidence**  
     - **Fits**: Evidence alone can’t dictate theory choice.  
     - **Misfits**: Addresses ambiguity between *competing theories*, not how *event classification* bypasses evidence evaluation.  

  6. **Framing effect (in argumentation)**  
     - **Fits**: How presentation influences interpretation.  
     - **Misfits**: A *cognitive bias* in decision-making; your phenomenon is a *deliberate argumentative strategy* to control evidential relevance.  

  **Verdict**: No established concept fits perfectly. The phenomenon is distinct due to its **evidential gatekeeping function**: the contested description *itself* (not just background theories) defines what could count as evidence, preempting empirical debate. I’ll coin a term.  

  ---

  ### Analysis and Coined Term  
  **Phenomenon Name**: **Evidential Preemption**  
  **Definition**: A rhetorical-epistemic move where classifying an event (e.g., as "miracle" or "natural") unilaterally sets the standard for what evidence could confirm/refute it, rendering empirical data inert unless it aligns with the chosen classification.  

  **Key Discriminator**:  
  The *classification of the event itself* (not theories, premises, or definitions) directly determines the evidential threshold, making the evidentiary evaluation parasitic on prior categorical commitment.  

  **Boundary Cases**:  
  - **Falls Inside** (belongs to the phenomenon):  
    1. Hume’s miracle debate: Calling resurrection "natural" vs. "miraculous" predefines testimonial evidence as insufficient or sufficient.  
    2. Medical attribution: Labeling recovery "drug effect" vs. "placebo" dictates whether clinical data is relevant to drug efficacy.  
  - **Falls Outside** (near but distinct):  
    1. **Ad hoc rescue**: A physicist adds "dark matter" to save gravitational theory from anomalous observations—*modifies theory*, not event classification.  
    2. **Persuasive definition**: Defining "democracy" as "majority rule" to dismiss minority rights—*changes word meaning*, not evidential standards for a specific event.  

  **Uncertainty**: I’m least sure whether this overlaps with **semantic externalism** (where meanings fix reference), but your cases focus on *epistemic consequences* of classification, not meaning determination.  

