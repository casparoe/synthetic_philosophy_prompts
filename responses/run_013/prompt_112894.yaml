prompt: |-
  ok so I'm prepping for a grad seminar on population ethics and I've realised I don't actually have a clear list of what I'm asking a theory to do before I start judging the contenders. so: give me the desiderata. what does any adequate theory of how many people there should be, and how well off they should be, have to deliver -- the cases it has to get right, the distinctions it can't flatten, the formal constraints it can't break -- and for each one, the case or intuition that motivates it. Lead with your bottom line in the first sentence, then the reasoning. No throat-clearing and don't restate my question.

  the cases I keep bumping into, so you can tell me which are load-bearing: the one where a huge population of people whose lives are only barely worth living is supposedly better than a small population living great lives (I think this is the repugnant one?); the one where you add a happy person without making anyone worse off, and it's supposed to be an improvement but not enough to get you the first result; the one where the extra people only exist because of your choice, so there's nobody you can point to and say you harmed them; the one where a world with a little suffering spread across lots of people comes out better than a smaller world with none; and the asymmetry where it seems bad to bring a miserable person into being but not required to bring a happy one. tell me which of my "cases" are actually the same case wearing a hat.

  Then the part I most want: I've heard there's a family of results showing you can't have all the nice properties at once. spell that out -- which subset of the requirements is jointly unsatisfiable, and what the trade-off looks like at each escape route. flag which single requirement does the most work, i.e. which one, if you drop it, buys back the most consistency, and say which requirements are non-negotiable vs. just a camp's taste. a table is fine for that bit.

  Last thing if it's quick: totalism, the average view, a critical-level view, and a person-affecting view -- one line each on how they fare against the list, and which desideratum each most obviously violates. no citations or reading lists please, I can't look anything up right now.
reasoning: |-
  Okay, the user is prepping for a grad seminar on population ethics and needs a clear list of desiderata for evaluating theories. They mentioned several cases like the Repugnant Conclusion and the Mere Addition Paradox, and want to know which are fundamental. They also want an explanation of impossibility theorems and how different theories stack up against the criteria.

  First, I need to recall the core desiderata in population ethics. The key ones are Pareto Plus, Non-Antiegalitarianism, Non-Repugnance, Asymmetry, and Transitivity. The user’s cases map to these: the Repugnant Conclusion challenges Non-Repugnance, adding a happy person without harm relates to Pareto Plus, the asymmetry between creating happy vs. miserable lives is the Asymmetry desideratum. I should clarify that some cases they mentioned are variations of the same issue, like the Mere Addition Paradox being a setup for the Repugnant Conclusion.

  Next, the impossibility results. The main point is that all desiderata can't be satisfied simultaneously. The Minimal Trade-Offs diagram shows which combinations are possible. Dropping Pareto Plus resolves most conflicts, but it's controversial. I need to highlight which desideratum is the linchpin—Pareto Plus—and how sacrificing it affects the others.

  For the theories, totalism satisfies Pareto Plus but leads to the Repugnant Conclusion. Average utilitarianism avoids Repugnance but fails Pareto Plus and harms Addition. Critical-level views add a threshold, which helps with Repugnance but might violate Pareto Plus. Person-affecting views handle Asymmetry but struggle with Non-Antiegalitarianism and transitivity in same-number cases.

  The user’s deeper needs: They want a structured framework to critique theories efficiently for their seminar. They might need to present these trade-offs clearly and understand which theoretical compromises are necessary. Emphasizing the impossibility results and which desiderata are commonly contested (like Pareto Plus) will help them navigate debates. Also, clarifying which cases are interconnected saves them from redundancy in discussion. Making sure the explanation is concise but comprehensive, avoiding jargon where possible, and using the table for quick reference aligns with their time constraints.
answer: |-
  Here's the bottom line: **An adequate population ethics theory must satisfy Pareto Plus, avoid the Repugnant Conclusion, uphold the Asymmetry, respect Non-Antiegalitarianism, maintain Transitivity, and handle the Mere Addition Paradox without implying Repugnance – but formal results show this is impossible.**

  **Desiderata & Motivations:**

  1.  **Pareto Plus (PP):** Adding a person with a life worth living, without making anyone else worse off, must be an improvement.
      *   *Motivation:* Intuition that creating extra happiness "for free" is good (e.g., adding one very happy person to a paradise).
  2.  **Non-Repugnance (NR):** A world (A) with a small number of very well-off people must be better than a world (Z) with a vast number of people whose lives are barely worth living, even if Z has a higher total utility.
      *   *Motivation:* The Repugnant Conclusion itself. Z seems intuitively worse than A despite higher total utility.
  3.  **Asymmetry (A):** Bringing a miserable person into existence is bad. Bringing a happy person into existence is *not* morally required (merely permissible or good but not obligatory).
      *   *Motivation:* We feel obligations to avoid creating suffering but no symmetric obligation to create happiness for non-existent beings.
  4.  **Non-Antiegalitarianism (NA):** Ceteris Paribus (same people, same total utility), a more equal distribution is better than a less equal one.
      *   *Motivation:* Basic egalitarian intuition. E.g., a world with moderate suffering spread thinly might be worse than a smaller world with *no* suffering (if total utility is held constant, the smaller world *is* more equal - everyone has none).
  5.  **Transitivity (T):** If A is better than B, and B is better than C, then A is better than C. Essential for coherent choice.
      *   *Motivation:* Without it, rational choice and betterness ordering collapse.
  6.  **Mere Addition Intuition (MA):** Adding a group of people with lives worth living (even if below average), *without affecting existing people*, is not worse than the original state, and might be better if the new people are happy enough.
      *   *Motivation:* The "Mere Addition" case. Creating a separate happy group doesn't seem to harm anyone or make the world worse. (Note: This is distinct from PP which adds *one* person *without changing others*; MA often involves adding a *group*, potentially changing averages/distribution *among the new whole*, but *not harming pre-existing individuals*).

  **Mapping Your Cases:**

  *   "Huge barely-worth-living vs small great lives": **The Repugnant Conclusion** (Directly motivates NR).
  *   "Add a happy person without making anyone worse off": **Pareto Plus (PP)**.
  *   "Extra people only exist because of your choice / no harmed individual": Core issue for **Person-Affecting Views** and the **Asymmetry (A)**. This scenario is often used to *challenge* the idea that creating a happy person is required (supporting A) or to *motivate* PP.
  *   "Little suffering spread vs smaller world with none": Illustrates **Non-Antiegalitarianism (NA)**. If the total suffering is identical, the concentrated suffering (in the smaller world) is worse *if* we value equality (NA). If the smaller world has *zero* suffering, it likely has higher *average* utility, making it also a case against pure Totalism.
  *   "Asymmetry (bad to create miserable, not required to create happy)": Directly **Asymmetry (A)**.
  *   "Add happy person... improvement but not enough to get repugnance": This is the **Mere Addition Paradox (MA)** acting as a stepping stone *towards* the Repugnant Conclusion. The paradox shows how starting from A, adding a moderately happy group (B) seems acceptable (MA), then improving that group's welfare to match the original (C) seems acceptable (PP or equality), making C potentially better than A. But repeating this process leads to Z (Repugnant Conclusion).

  **The Impossibility:**

  Formal results (like Arrhenius's Impossibility Theorem) show **no population axiology can satisfy PP, NR, A, NA, and T simultaneously when also accounting for the intuitions behind MA.**

  *   **The Core Conflict:** PP + MA intuitions + T push strongly towards Totalism, which violates NR and A. Trying to modify the theory to avoid NR (e.g., Critical Level, Average View) typically violates PP or MA. Upholding A strongly often requires violating PP or T.
  *   **The Linchpin:** **Pareto Plus (PP) does the most work in generating contradictions.** Dropping PP (or significantly weakening it) is the most effective way to restore consistency, as it breaks the chain leading directly from adding happy people to the Repugnant Conclusion. However, PP is deeply intuitive for many.
  *   **Trade-Offs Table:**

  | Desideratum Dropped/Weakened | What Becomes Possible                                                                 | Cost                                                                                                 |
  | :--------------------------- | :------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------- |
  | **Pareto Plus (PP)**         | Most consistent escape. Theories can strongly satisfy NR, A, NA, T.                   | Violates strong intuition that adding happy people without harm is always good.                      |
  | **Non-Repugnance (NR)**      | Upholds PP, A (sometimes), T. Average view avoids RC by definition.                   | Accepts the Repugnant Conclusion (Z > A).                                                           |
  | **Asymmetry (A)**            | Upholds PP, T, NA (sometimes). Makes "required to create happy people" possible.      | Loses strong intuition that creating suffering is bad in a way creating happiness isn't obligatory. |
  | **Non-Antiegalitarianism (NA)** | Upholds PP, T, NR (sometimes). Focuses solely on total/avg/critical level.          | Permits or even requires highly unequal distributions if they boost the core metric.                 |
  | **Transitivity (T)**         | Allows "betterness loops" (A>B, B>C, C>A).                                           | Renders the theory practically useless for guiding choices; betterness ordering collapses.         |
  | **Mere Addition Intuition (MA)** | Allows declaring mere addition bad/worse even if new lives are happy.              | Violates intuition that creating happy people in a separate "bubble" isn't harmful/worse.           |

  *   **Non-Negotiable vs. Taste:**
      *   **Near-Non-Negotiable:** **Transitivity (T)**. Without it, the theory isn't coherent for decision-making.
      *   **Highly Contested:** **Pareto Plus (PP)** vs. **Non-Repugnance (NR)** vs. **Asymmetry (A)**. Which of these core intuitions you *must* uphold defines the major camps. Sacrificing one is usually necessary.
      *   **Common Sacrifice:** **Non-Antiegalitarianism (NA)** is often weakened or sacrificed, especially by totalist-leaning views, to avoid other problems.

  **Theories vs. Desiderata (One Line):**

  1.  **Totalism (Classical Utilitarianism):** Satisfies PP, T, MA; **Violates NR** (embraces Repugnant Conclusion) and **A** (requires creating happy people).
  2.  **Average Utilitarianism:** Satisfies NR, T; **Violates PP** (adding a slightly-below-average happy person makes things worse) and **MA** (same reason), often violates **NA**.
  3.  **Critical-Level View:** Satisfies NR, T (often); **Violates PP** if added person's utility is above zero but below the critical level (adding them isn't an improvement).
  4.  **Person-Affecting View:** Satisfies A strongly; **Violates PP** (no one existing is harmed by *not* creating a happy person, so it's not required/possibly not better), **Violates T/NA** in same-number choices, struggles massively with different-number cases.
