prompt: |-
  You are a philosopher of classical Indian epistemology specializing in Nyāya, and you have spent years turning theoretical frameworks into evidence-grading rubrics that non-specialists can actually run. I need one of those rubrics, and I want it built deliberately rather than generically: before you simplify anything, think through what the Nyāya account of the pramāṇas actually commits you to, so that every simplification is a conscious choice rather than an accident.

  Context and role. I run a small claims desk at a public-policy nonprofit. Each week two to three dozen empirical and quasi-empirical claims arrive from program staff, partner organizations, and draft reports — claims such as "this training improves staff retention," "this neighborhood contains no affordable child care," "clinicians in this region under-prescribe this drug," "the 2019 reform caused the drop in filings." My job is to triage each claim into one of four bins: established enough to publish, needs specified additional work, rejected, or escalated to a human because the question is one of value or policy rather than fact. I have about twenty minutes per claim, I am not a statistician, and the research director signs off on anything that goes into a published report. I want a procedure I can run in that time, in that seat, with that sign-off.

  What to build.

  A decision procedure, taken in order, for evaluating a single claim, organized around the Nyāya means of valid cognition rather than around the familiar evidence hierarchy. For each step give the question to ask, what counts as a sufficient answer, and what to do when the answer falls short. The procedure must do the following.

  1. Force an explicit determination of which pramāṇa could in principle settle the claim — perception, inference, comparison or analogy, or trustworthy testimony — and state what to do when a claim appears to need a means that Nyāya does not accept as independent: a negative existence claim that seems to rest only on non-apprehension, or an "inference to the best explanation" that is not a strict pervasion-based inference. Handle that mismatch openly instead of pretending it away.

  2. Spell out inference with its conditions: the reason's presence in the subject under discussion, the pervasion linking reason to conclusion, and the standard ways an inference goes wrong — the reason deviating, contradicting the conclusion, being counterbalanced by an equally good opposing reason, being unestablished, being mistimed, or being overturned by later knowledge. I want these as concrete checks a non-specialist can actually perform, with an example of what a "counterbalanced" claim looks like in a policy setting.

  3. Spell out testimony with its conditions: what makes a source a trustworthy expert in the relevant sense — direct acquaintance with the matter, sincerity, competence — and how to probe each of those in practice when I cannot interview the source.

  4. Include a defeat step: a place to record what would later overturn an accepted claim, and instructions on when a claim should be re-opened rather than merely annotated.

  5. Mark the points where the procedure cannot decide and a person must, saying which person (me, the research director, an outside expert) and what the handoff should contain.

  Then run it end to end on three claims, showing the steps as you go: (a) a claim backed by a single well-conducted but small study; (b) a negative existence claim ("there is no X in this region") supported only by an absence of records; (c) a causal claim about a policy change whose strongest support is a plausible mechanism plus a before-and-after comparison. At least one of these should come out in a way I will not like — I would rather watch the procedure bite than watch it flatter me. For each, finish with the bin and a one-line justification.

  Finally, tell me what the procedure cannot do: the claim types it will systematically mishandle, the places where the Nyāya machinery is doing real work versus where it is decoration, and where an ordinary evidence-grading approach would have served me better. Be candid about which steps are judgment calls dressed up as procedure.

  Constraints on your answer: keep the procedure to something I could keep on one page; no citations, reading lists, or references to specific texts, since I will not be able to look anything up; write for a competent non-philosopher; and think carefully before committing to the rubric rather than producing the first tidy version that comes to mind.

  End your response with a single final line of the form \answer{...} giving your recommended bin for case (c), using exactly one of: established, needs-work, rejected, escalated.
reasoning: |-
  We are building a decision procedure based on Nyāya epistemology. The four pramāṇas (means of valid cognition) are:
    1. Pratyakṣa (perception)
    2. Anumāna (inference)
    3. Upamāna (comparison/analogy)
    4. Śabda (testimony)

   We will structure the procedure as a sequence of questions for each claim. The steps:

   Step 1: Determine the appropriate pramāṇa
     - Question: "What kind of evidence could, in principle, settle this claim? Is it direct observation (perception)? A logical inference with a universal rule? A comparison to a known case? Or testimony from a reliable source?"
     - Sufficient answer: Identify one of the four. If the claim appears to rest on a negative existence (non-apprehension) or an inference to the best explanation (which isn't a strict Nyāya inference), note that and proceed to Step 1a.

     Step 1a: Handling non-standard claims
       - For negative existence claims: "If we cannot perceive X, is that because X is imperceptible in principle? Or because we have looked adequately and found nothing?" In Nyāya, non-apprehension (anupalabdhi) is accepted as a way to know absence, but only under conditions of adequate search and when the object would be perceptible if present. If these conditions are met, we can treat it as a form of perception (by non-perception). If not, then the claim is weak and may need to be rejected or require more work.
       - For inference to the best explanation (IBE): Nyāya does not accept IBE as an independent pramāṇa. It must be converted into a proper inference (anumāna) by identifying a universal relation (vyāpti) between the evidence and the conclusion. If that conversion fails, treat the claim as needing more work or reject it.

   Step 2: If the claim is to be settled by perception (pratyakṣa)
     - Question: "Is there a direct, error-free observation of the fact in question, under conditions that rule out illusion or doubt?"
     - Sufficient answer: A clear, verifiable observation report (e.g., a well-documented survey, sensor data, or direct inspection) that is not contradicted by other observations.
     - If falls short: 
          - If the observation is indirect (e.g., via instruments) or under suboptimal conditions, then it may need corroboration (escalate to Step 3 or 4).
          - If not, then the claim may need more work (to get direct observation) or be rejected.

   Step 3: If the claim is to be settled by inference (anumāna)
     We require:
        a. Pakṣa (subject): The thing about which we are inferring.
        b. Sādhya (probandum): The property to be proved.
        c. Hetu (reason): The evidence property that is present in the pakṣa and linked to the sādhya by a universal rule (vyāpti).
        d. Vyāpti: The universal relation between hetu and sādhya.

     We must check for fallacies (hetvābhāsa):
        1. Asiddhi: The reason is unestablished in the subject.
           - Check: "Is the reason actually present in the subject under discussion?"
           - Example: Claim: "This training improves retention (in our staff)." Reason: "Because it improved retention in a study." But if the study was on a different group (e.g., nurses, and we are teachers), then the reason may not be established in our subject.

        2. Savyabhicāra: The reason deviates (it is present in examples where the sādhya is absent).
           - Check: "Are there cases where the reason is present but the conclusion is false?"
           - Example: Claim: "Clinicians under-prescribe drug X because they are not trained in the new guidelines." But if there are clinicians who are not trained but still prescribe appropriately (e.g., because they read journals), then the reason deviates.

        3. Viruddha: The reason contradicts the conclusion (it proves the opposite).
           - Check: "Does the reason actually support the opposite conclusion?"
           - Example: Claim: "The policy caused an increase in filings." Reason: "Because filings rose after the policy." But if the policy was designed to reduce filings, and there is a known alternative cause (like an economic boom) that would increase filings, then the reason might be viruddha.

        4. Satpratipakṣa: The reason is counterbalanced by an equally strong opposing reason.
           - Check: "Is there a strong counter-argument that uses a different reason to prove the opposite?"
           - Example: Claim: "The training improves retention." Counterclaim: "The training does not improve retention because it is too short to have an effect." And if both reasons are equally strong, then we have satpratipakṣa. In policy: "This neighborhood has no affordable childcare." Counter: "There are three licensed daycares with below-market rates." If both claims are equally supported, then counterbalanced.

        5. Bādhita: The reason is overturned by later knowledge (or stronger evidence).
           - Check: "Is there stronger evidence that contradicts the conclusion?"
           - Example: A study shows the training improves retention, but then a larger, better-controlled study shows it does not.

        6. Kālātīta: Mistimed (the reason is only present at a time when the sādhya cannot occur). Less common in policy, but consider if timing is off.

     - Sufficient answer: The inference must pass all six checks. If it fails, the claim is rejected or needs more work to fix the flaw.

   Step 4: If the claim is by comparison (upamāna)
     - Question: "Is the claim based on a valid analogy? Does it compare the subject to a known case that is substantially similar and where the property in question is known to hold?"
     - Sufficient answer: The analogy must be to a case that is directly known (by perception or testimony) and the similarity must be in relevant aspects.
     - If falls short: The claim may need more work (to establish the analogy) or be rejected.

   Step 5: If the claim is by testimony (śabda)
     - Conditions for trustworthy testimony:
          a. Āptatva: The source is an expert (directly acquainted with the matter).
          b. Satya: The source is sincere (not lying or misleading).
          c. Abhāva of doṣa: The source is free from defects (competent, not biased, etc.).

     - How to probe without interviewing the source:
          a. Expertise: Check the source's credentials, field of work, and whether they have direct access to the information. For a study, check the methodology: did they use appropriate methods to gather the data?
          b. Sincerity: Look for conflicts of interest, consistency in reporting, and whether the source has a history of reliability. For a study, check for transparency and whether it was peer-reviewed.
          c. Competence: Check if the source used proper methods and if the report is internally consistent and free from obvious errors.

     - Sufficient answer: The source must be credible on all three counts. If any is in doubt, the testimony is insufficient.

   Step 6: Defeat step
     - For every accepted claim, record: "What new evidence would overturn this?" and "When should we re-open the evaluation?"
     - Instructions: Re-open if new evidence of the same or higher quality becomes available that contradicts the claim, or if the conditions of the original evidence change (e.g., a source is discredited).

   Step 7: Escalation points
     - Where the procedure cannot decide:
          a. When the claim involves a value judgment (e.g., "this policy is unfair") -> escalate to the research director with a note on the value component.
          b. When the evidence is conflicting and the procedure cannot resolve it (e.g., satpratipakṣa) -> escalate to the research director or an outside expert, providing the conflicting evidence and the reasons for stalemate.
          c. When the claim requires specialized knowledge beyond the evaluator's capacity -> escalate to an outside expert, specifying the gap.

   Now, we run three examples.

   Example (a): Claim backed by a single well-conducted but small study.
     - Claim: "This training improves staff retention."
     - Evidence: A randomized controlled trial (RCT) with 30 participants, showing a statistically significant improvement.

     Step 1: The claim is about a causal effect. In principle, it could be settled by perception (if we directly observe retention changes in many cases) or inference (if we have a universal rule that the training causes retention). But the evidence is a study, which is testimony (the researchers' report). So we go to Step 5.

     Step 5: Testimony from the study.
        - Expertise: The researchers are experts (academics) and used an RCT, which is appropriate.
        - Sincerity: Assume no conflicts and peer-reviewed -> sincere.
        - Competence: The study is well-conducted but small -> competence is in doubt because the sample size may be too small to generalize. 

     This does not pass because of the small sample size (lack of competence in establishing a general rule). So we mark it as needing more work (to replicate with a larger sample or to provide additional evidence).

     Defeat step: If a larger study fails to replicate, we re-open.

     Bin: Needs work. Justification: The testimony is from a competent source but the small sample size limits its generalizability.

   Example (b): Negative existence claim: "There is no affordable child care in this neighborhood."
     Supported only by an absence of records (e.g., no licensed daycares listed in a government database).

     Step 1: Negative existence. We use non-apprehension (anupalabdhi) as a form of perception. But we must check:
          - Is the object (affordable childcare) perceptible? Yes, because it would be listed or observable.
          - Was the search adequate? We have a government database that is supposed to list all licensed daycares. But what about unlicensed ones? The claim may be only about licensed ones? Clarify.

     Step 1a: If the claim is about licensed affordable childcare, then the absence in the database is adequate. But if it's about any affordable childcare (including unlicensed), then the database may not be adequate. Without more, we cannot be sure.

     We might treat this as perception (non-perception) but only if the search is adequate. Since we don't know if the search was adequate for unlicensed, we must either:
          - Reject the claim as stated (if it is meant to include unlicensed) and ask for a survey of the neighborhood.
          - Or, if the claim is explicitly about licensed childcare, then accept.

     Let's assume the claim is about any affordable childcare. Then:

     Step 2 (as perception by non-perception): 
          - The absence of records is not direct perception of absence. We need a thorough search. The evidence provided is only a database check. Without evidence of a thorough search (e.g., a survey of the neighborhood), the claim is not established.

     Bin: Needs work (to conduct a survey) or rejected if we cannot get more evidence. 

     But note: In policy, sometimes the absence in a reliable database is accepted. We might treat the database as testimony. Step 5: The database is maintained by a government agency. 
          - Expertise: The agency is supposed to have complete records? 
          - Sincerity: No known reason to lie.
          - Competence: If the agency is known to have incomplete records, then not competent.

     Without knowing the database's completeness, we cannot accept. 

     Bin: Needs work (to verify the database's completeness) or rejected.

   Example (c): Causal claim: "The 2019 reform caused the drop in filings."
     Strongest support: a plausible mechanism (the reform made filing harder) and a before-and-after comparison (filings dropped after the reform).

     Step 1: This is a causal claim. In principle, it could be settled by inference (if we have a universal rule that such reforms cause drops) or by testimony (if an expert says so). But the evidence is a mechanism and a correlation. We must try to form an inference.

     Step 3: Inference.
          - Pakṣa: The 2019 reform.
          - Sādhya: caused the drop in filings.
          - Hetu: The drop occurred after the reform.
          - Vyāpti: We need a universal rule: "Whenever such a reform occurs, then a drop in filings follows." But is this true?

     Check for fallacies:
          1. Asiddhi: The reason (drop after) is present? Yes, if the data shows a drop.
          2. Savyabhicāra: Are there cases where such a reform occurs but no drop? Yes, if other factors offset. So the reason may deviate.
          3. Viruddha: Does the reason prove the opposite? No, but note: if there was a simultaneous event that would cause an increase, then the drop might be even more significant, but without controlling for that, we cannot be sure.
          4. Satpratipakṣa: Is there an opposing reason? Yes: "The drop was caused by an economic downturn (which reduces the number of cases)." And if that reason is equally plausible, then counterbalanced.
          5. Bādhita: Not yet.
          6. Kālātīta: Not applicable.

     The inference fails because of savyabhicāra (the reason deviates) and possibly satpratipakṣa (if there is an alternative cause). 

     Without controlling for confounders, the before-and-after comparison is weak. The plausible mechanism is not enough because there might be other mechanisms at work.

     Bin: Rejected or needs work. We reject because the evidence is insufficient to establish the universal rule and because of the possibility of confounding. 

     But note: the procedure may require more work to rule out confounders. So:

     Bin: Needs work (to control for other factors, e.g., by a regression analysis or a comparison group).

   However, the user wants at least one outcome they don't like. For (c), we might have to reject if no further work is planned.

   But the instructions say: finish with the bin and a one-line justification.

   For (c): 
     Bin: Needs work (to control for confounding factors). 
     Justification: The inference is flawed due to possible deviation and counterbalancing by alternative causes.

   Now, what the procedure cannot do:

    - It cannot handle claims that are not about empirical facts (e.g., pure value claims). These must be escalated.
    - It may be too strict for policy settings where decisions must be made under uncertainty. Nyāya requires certainty for knowledge, but policy often uses probabilities. The procedure does not handle probabilistic evidence well.
    - It may reject claims that are supported by multiple weak pieces of evidence (like several small studies) because each piece fails on its own. In such cases, an ordinary evidence hierarchy (which allows for upgrading evidence when there is consistency) might be better.
    - The steps on inference require universal rules (vyāpti), which are hard to come by in social sciences. This might lead to rejecting many causal claims.
    - Judgment calls: 
          - Determining "adequate search" for negative claims.
          - Deciding when a source is an expert (Step 5) is often a judgment.
          - Recognizing a counterbalanced reason (Step 3) is subjective.

   The procedure is doing real work in:
     - Forcing an explicit account of the type of evidence and its conditions.
     - Unpacking inferences (which are common in policy) and revealing their weaknesses.
     - Providing a structured way to evaluate testimony.

   But it is decoration in:
     - The comparison (upamāna) step is rarely used in policy claims.

   Finally, we output the bin for (c) in the required format.

   \answer{needs-work}
answer: |-
  ### Nyāya Evidence Triage Procedure  
  *For empirical/quasi-empirical claims in policy contexts. Complete steps in order. Time: ≤20 min/claim.*  

  ---

  #### **Step 1: Identify Valid Means of Knowing (Pramāṇa)**  
  **Question:** *"What kind of evidence could settle this claim? Perception (direct observation), inference (logical deduction), comparison (analogy), or testimony (expert source)?"*  
  - **Sufficient:** Match to one pramāṇa.  
  - **If mismatch:**  
    - **Negative existence claims** (e.g., "no X exists"): Accept *only* if:  
      - (a) X would be observable if present,  
      - (b) A thorough search occurred (e.g., systematic audit, not just missing records).  
      Else → **Bin: Needs work** (specify search gaps).  
    - **"Best explanation" claims** (e.g., "Y caused Z" without direct proof): Not a standalone pramāṇa. Convert to inference (Step 2) or reject.  
  - **Escalate if:** Claim is about values/policy (not facts) → **Research Director** with note: "Value judgment beyond evidence grading."  

  #### **Step 2: Test Inference (Anumāna)**  
  *For claims like "A causes B," "All X are Y."*  
  **Questions to ask (check for fallacies: Unestablished, Deviating, Contradictory, Counterbalanced, Overturned, Mistimed):**  
  1. **Unestablished (Asiddhi):** *"Is the evidence *directly* linked to the specific case?"*  
     - Fail: Evidence from dissimilar contexts (e.g., study on nurses applied to teachers). → **Bin: Rejected** or **Needs work** (get case-specific data).  
  2. **Deviating (Savyabhicāra):** *"Could the evidence exist *without* the conclusion?"*  
     - Fail: "Filings dropped after the policy" → but drop could be due to recession. → **Bin: Needs work** (rule out confounders).  
  3. **Contradictory (Viruddha):** *"Does the evidence *disprove* the claim?"*  
     - Fail: "Training improves retention" but evidence shows attrition spiked post-training. → **Bin: Rejected**.  
  4. **Counterbalanced (Satpratipakṣa):** *"Is there equally strong evidence for the *opposite*?"*  
     - **Policy example:** "No affordable childcare here" (no licenses found) vs. "3 unlicensed providers exist" (community survey). → **Bin: Escalate to Research Director** with both proofs.  
  5. **Overturned (Bādhita) or Mistimed (Kālātīta):** *"Is there newer/better evidence? Is the evidence temporally misaligned?"*  
     - Fail: New data contradicts claim. → **Bin: Rejected**.  

  **Sufficient:** Pass all checks + a universal rule (e.g., "Policy X *always* reduces filings when implemented").  

  #### **Step 3: Test Testimony (Śabda)**  
  *For claims relying on sources (e.g., studies, experts).*  
  **Questions to assess trustworthiness (expertise, sincerity, competence):**  
  - **Expertise (direct knowledge):** *"Does the source have direct access? What methods did they use?"*  
    - Fail: Secondhand report; flawed methodology (e.g., biased sampling). → **Bin: Needs work** (get primary data).  
  - **Sincerity (no deception):** *"Could the source gain/lose from this claim? History of reliability?"*  
    - Fail: Conflict of interest (e.g., funder bias). → **Bin: Rejected** or **Escalate to outside expert**.  
  - **Competence (skill):** *"Is the source qualified? Is evidence peer-reviewed/replicated?"*  
    - Fail: Lone study with small sample; no replication. → **Bin: Needs work** (corroborate).  

  #### **Step 4: Record Defeasibility**  
  **For ALL claims moved to "Established" or "Needs work":**  
  - *"What new evidence would overturn this?"* (e.g., "A study showing retention unchanged").  
  - *"Reopen if:"* New evidence emerges, source credibility challenged, or context changes (e.g., policy amended).  

  ---

  ### Procedure in Action  
  #### **Case (a): "This training improves staff retention" (backed by small RCT)**  
  - **Step 1:** Testimony (study is source).  
  - **Step 3:**  
    - Expertise: Yes (researchers conducted RCT).  
    - Sincerity: Assume no conflict (peer-reviewed).  
    - Competence: **Fail** — small sample → high error risk. Universal rule not proven.  
  - **Defeasibility:** Overturned by larger study.  
  - **Bin: Needs work** — *Insufficient competence: Small study requires replication.*  

  #### **Case (b): "No affordable childcare in this region" (absence of records)**  
  - **Step 1:** Negative existence → Check perceptibility/search adequacy.  
    - Perceptibility: Yes (childcare is observable).  
    - Search adequacy: **Fail** — records ≠ ground truth (unlicensed providers?).  
  - **Step 1a:** Convert to inference? No pervasion ("no records" → "no childcare" isn’t universal).  
  - **Bin: Needs work** — *Inadequate search: Requires field verification.*  

  #### **Case (c): "The 2019 reform caused the drop in filings" (mechanism + before/after)**  
  - **Step 1:** "Best explanation" → Must convert to inference.  
  - **Step 2:**  
    - Unestablished: Pass (data from same region).  
    - Deviating: **Fail** — Drop could be due to economic boom (confounder).  
    - Counterbalanced: Plausible alternative (e.g., "Boom increased filings, but drop still occurred").  
    - Contradictory/Overturned: None.  
  - **Defeasibility:** Overturned by controlled study.  
  - **Bin: Needs work** — *Deviating reason: Confounders not ruled out.*  

  ---

  ### Limitations and Caveats  
  **What this procedure cannot do:**  
  - Handle probabilistic claims (e.g., "80% chance of effect"). Nyāya demands certainty; use statistics instead.  
  - Weight "lower-quality" evidence (e.g., anecdotes + surveys). Nyāya rejects non-universal inferences.  
  - Resolve value conflicts (e.g., "affordable" = normative). Escalate early.  
  - Replace specialist judgment for technical claims (e.g., clinical drug effects).  

  **Where Nyāya adds value:**  
  - Forces rigor in causal logic (Step 2 exposes confounders).  
  - Demands source scrutiny (Step 3 prevents "expert worship").  
  - Clarifies negative claims (Step 1a avoids gaps).  

  **Where standard evidence hierarchies are better:**  
  - Grading *quantity* of evidence (e.g., multiple weak studies → stronger claim).  
  - Fields relying on probability (e.g., epidemiology).  

  **Judgment calls disguised as procedure:**  
  - Step 2 ("deviating reason"): Requires estimating confounder strength.  
  - Step 3 ("competence"): Deciding what counts as "adequate" replication.  
  - Step 1 (pramāṇa choice): Ambiguous claims (e.g., analogy vs. testimony) need escalation.  

  \answer{needs-work}
