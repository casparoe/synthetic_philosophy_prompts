prompt: |-
  I host a small podcast that's basically an offshoot of my blog — audience is mostly people who read the rationalist blogs plus a handful of political philosophy grad students, so I can assume they know what brute and option luck are but not much past that. Next month's guest is an economist-turned-philosopher shopping around a book manuscript. His thesis is that luck egalitarianism has been aimed at the wrong target all along: instead of compensating people for the effects of brute luck, we should try to equalize how much brute luck each person is exposed to over the course of a life. He calls it the variance view. I honestly can't tell if it's a real position or a motte-and-bailey, but I want the interview to make him do actual work.

  You're a philosopher who knows the distributive justice literature cold, and also a good interviewer — the kind who hears the stock answer coming and already has the next question loaded. Start with a few lines brainstorming where the variance view is genuinely vulnerable, then draft eight to ten questions. I want at least one pressing the leveling-down objection as it applies to the distribution of exposure to luck rather than to outcomes, at least one on the harshness/abandonment objection (what does the view say about someone who gambles away their savings, or about the "unfortunate" whose situation can only be improved in ways that look paternalistic), and at least one on whether the variance view collapses into prioritarianism or into Dworkin's hypothetical insurance market in disguise. For each question, give me a one-line note on the answer he's most likely to reach for and a follow-up that survives that answer. No softballs, and please no "what drew you to this topic."

  One more thing, I don't want to get embarassed on air: seperate clearly what's a live dispute among people who actually work on distributive justice from what's your own extrapolation, and don't present a contested claim as if it's the consensus. If the view I described doesn't map cleanly onto anything in the literature, say so and tell me which existing position it's closest to.
reasoning: |-
  Okay, the user hosts a niche podcast for an audience familiar with rationalist blogs and political philosophy grad students. They're interviewing an economist-turned-philosopher promoting a "variance view" of luck egalitarianism. The core idea seems to be shifting focus from compensating brute luck outcomes to equalizing exposure to brute luck over a lifetime. 

  Hmm, first I need to locate this in existing literature. It doesn't map neatly to standard positions—Dworkin's insurance markets still compensate outcomes, while pure ex ante equality of fortune would look different. The variance view feels like a hybrid, emphasizing lifetime risk distribution rather than either initial endowments or final outcomes. That's... oddly specific. 

  *Checks notes on abandonment objections* Right, if we're equalizing luck exposure instead of outcomes, the "harshness" problem intensifies. Someone who gambles away their savings might get zero help since their bad outcome stems from option luck. But the guest might counter that high-variance lives (like gamblers) already had unequal brute luck exposure by his metric. Clever, but then...

  *Mentally drafts leveling-down question* What if we equalize by forcing everyone into boring, low-variance lives? His likely response would appeal to some "acceptable risk threshold," but that smells ad hoc. Follow-up: Who defines that threshold? Isn't that just smuggling in outcome concerns through the back door?

  *Pauses at paternalism angle* The "unfortunate" case is tricky. If someone can only be helped via paternalism, does his view endorse it? He'll probably say "only for brute luck exposure!" But follow-up: How do we isolate brute vs. option luck in risk profiles? If I'm born risk-averse, is that brute luck? Suddenly we're back to outcome-based judgments. 

  *Scratches head at prioritarianism comparison* If he weights the luck-exposed worst-off, it collapses to prioritarianism; if not, it abandons them. His dodge might be "it's about ex ante fairness!" But then—aha!—follow-up: Why is equalizing ex ante exposure fairer than weighting outcomes for the worst-off? That's the hill to make him defend.

  *Makes note for insurance markets* If he uses hypothetical markets to set "fair" risk levels, it's Dworkin redux. He'll deny it by emphasizing actual exposure. Follow-up: But don't markets just simulate outcome compensation? Pin him on whether variance reduction is intrinsically valuable.

  User definitely wants blood sport, not softball. Good. They also fear embarrassment, so I'll flag where professional disputes exist (e.g., whether harshness is fatal to luck egalitarianism generally). The variance view's novelty is its Achilles' heel—less room to hide behind established arguments. Time to weaponize that.
answer: |-
  Here's a breakdown of the "variance view" vulnerabilities and a set of hard-hitting questions designed to force clarification, expose tensions, and avoid embarrassment. **Crucially:** This view, as described, is *not* a standard position in the literature. It's closest to **ex ante luck egalitarianism** focused on the *distribution of initial risk profiles* over lifetimes, rather than ex post outcomes or Dworkin's insurance markets. It shares some DNA with proposals for equalizing opportunity sets or capabilities *ex ante*, but the specific focus on *variance in brute luck exposure* is novel and underdeveloped, making it highly vulnerable to the objections below.

  **Key Vulnerabilities:**
  1.  **Operationalization/Metric:** How do we *measure* "brute luck exposure" or its "variance" over a life? Is it frequency, severity, expected disutility? This seems intractably vague.
  2.  **Leveling Down (Risk Version):** Could equalizing exposure mean forcing low-variance lives (e.g., subsistence farmers) onto high-variance individuals (e.g., entrepreneurs), making everyone worse off *ex ante* by increasing their risk, purely for equality's sake?
  3.  **Harshness Squared:** Not only might reckless individuals get no help (standard LE harshness), but individuals *born into* high-variance circumstances (e.g., war zones, genetic disorders) might be considered "equalized" if society ensures *others* face similarly chaotic risks, rather than reducing the chaos itself.
  4.  **Brute/Option Luck Distinction Collapse:** Risk *exposure* often results from prior choices (option luck influencing future brute luck vulnerability). How can we cleanly isolate "brute luck exposure"?
  5.  **Paternalism Paradox:** Equalizing exposure likely requires massive, continuous intervention in life choices to control risk profiles, far beyond standard LE compensation.
  6.  **Disguised Prioritarianism/Insurance?:** Does "equalizing variance" functionally prioritize reducing risk for the worst-off-exposed? Or does it just mimic Dworkin's market, where premiums reflect acceptable risk levels?

  **Interview Questions:**

  1.  **Metric & Scope:** "Your core concept is 'equalizing brute luck exposure variance'. Can you define the *unit* of brute luck exposure? Is it the number of brute luck events, their potential severity, their expected impact on welfare/resources, or something else? How do we aggregate this *over an entire life* for comparison?"
      *   *Likely Grab:* Appeal to "expected disutility" or "significant risk differentials," possibly referencing insurance metrics or epidemiological risk factors.
      *   *Follow-Up:* "But expected disutility relies on *outcomes* we're supposedly moving beyond. And 'significant' is normative – doesn't this smuggled-in outcome-sensitivity undermine the claim that exposure, not effect, is the fundamental target? How is this *not* just a complex way of focusing on expected outcomes?"

  2.  **Leveling Down (Risk):** "Imagine two societies. Society A has low variance: everyone faces minimal brute luck risk (stable climate, good health, no war). Society B has equal variance: everyone faces moderate but equal risk of serious disease, natural disaster, and economic shock. Isn't Society A *ex ante* better for everyone? Doesn't forcing Society B's higher, equalized variance onto Society A's citizens make them worse off purely for the sake of equality of exposure? Is this leveling down acceptable?"
      *   *Likely Grab:* Deny leveling down applies, arguing lower *average* risk is better, but equality of variance is a separate, independent good; or claim Society B is unrealistic/not the goal.
      *   *Follow-Up:* "If equality of variance is intrinsically valuable, why *wouldn't* moving from A to B be required? If it's *not* intrinsically valuable and average risk matters more, doesn't that collapse your view back into minimizing overall/maximin expected bad luck (prioritarianism), not equalizing variance?"

  3.  **Harshness & Abandonment (Structural):** "Consider someone born into a high-variance brute luck environment – say, a region prone to devastating floods *and* droughts *and* political instability through no fault of their own. Under standard LE, we'd compensate the bad outcomes. Under your view, if we 'equalize variance' by ensuring *everyone* faces similar compound environmental/political risks, haven't we simply abandoned this person to their fate? How is this not a *worse* form of abandonment?"
      *   *Likely Grab:* Argue that equalizing variance *requires* reducing the risk for the worst-exposed; it's not about making others face *more* risk, but bringing the high-variance down.
      *   *Follow-Up:* "But your core principle is *equalizing* variance, not minimizing it for the worst-off. If bringing the high down is impossible without also raising the low (a common scenario with risk distributions), doesn't the equality mandate force us toward the higher baseline, abandoning the unfortunate? Or does this reveal your view is actually prioritarian about risk exposure?"

  4.  **Brute/Option Luck Entanglement:** "You focus on 'brute luck' exposure. But isn't much of an individual's *vulnerability* to brute luck the result of prior option luck? The gambler who loses their savings (option luck) is now vastly more exposed to brute luck (e.g., illness, job loss). How do you disentangle brute luck exposure from the downstream effects of option luck choices in a non-arbitrary way?"
      *   *Likely Grab:* Insist on a "baseline" vulnerability set by initial endowments/circumstances; subsequent choices alter exposure but the *baseline brute luck risk* is what's equalized.
      *   *Follow-Up:* "What *is* this baseline? At birth? At age 18? Doesn't the baseline itself change constantly due to brute luck events (a childhood illness)? And if we allow choices to *increase* exposure from the baseline (like the gambler), haven't we just recreated the standard LE harshness objection *at the level of risk* – the gambler now faces high brute luck vulnerability, and we do nothing?"

  5.  **Paternalism & the "Unfortunate":** "Take someone with a severe congenital condition requiring constant, expensive care just to survive – a high-variance brute luck exposure. The only way to 'equalize down' their variance might be highly restrictive paternalism: mandating where they live, their diet, activities, etc., to minimize additional risks. Does your view endorse this level of control? If not, how does it avoid collapsing back into compensating the bad *outcomes* their condition causes?"
      *   *Likely Grab:* Distinguish between reducing *unavoidable* baseline risk (good) and controlling option luck risks (bad paternalism); claim care reduces outcome severity, not exposure variance per se.
      *   *Follow-Up:* "But if the congenital condition *is* the high-variance exposure, and providing care only mitigates outcomes, haven't you conceded that equalizing exposure is impossible here, and outcome compensation is necessary? Doesn't this show exposure variance is often *inalienable*, forcing your view to either accept brutal outcomes or revert to standard LE?"

  6.  **Collapse into Dworkin?: "** Dworkin's hypothetical insurance market aims to compensate for unequal brute luck endowments by simulating what people *would* insure against *ex ante*. Your view seems focused on that *ex ante* risk landscape. How is 'equalizing brute luck exposure variance' meaningfully different from setting, via a social scheme, the level of insurance coverage Dworkin's market would have produced for various risks?"
      *   *Likely Grab:* Argue Dworkin *compensates* realized bad luck based on *ex ante* preferences, while his view *prevents* the unequal exposure from existing in the first place; it's about the actual distribution of risk, not hypothetical compensation.
      *   *Follow-Up:* "But how do you determine the 'equalized' level of acceptable variance for each risk without referencing what people would find acceptable or worth insuring against (i.e., Dworkin's market)? Isn't your 'equal variance' just the risk level corresponding to the coverage level a Dworkinian market would have chosen, making it Dworkin in disguise?"

  7.  **Collapse into Prioritarianism?:** "If the goal isn't strict equality of variance but ensuring no one faces *too much* brute luck exposure, especially the worst off in terms of exposure, doesn't your view functionally become *prioritarianism* applied to risk profiles – giving priority to reducing the highest exposures? If not, how do you justify letting some suffer vastly higher *ex ante* risks purely for the sake of variance equality?"
      *   *Likely Grab:* Maintain that equality of variance is the distinct distributive ideal; prioritarianism focuses on welfare levels, not risk distribution.
      *   *Follow-Up:* "But if someone faces astronomically higher brute luck risk than others, doesn't the moral imperative to reduce *that specific* extreme risk dominate any concern for perfect variance equality with others facing minimal risk? If yes, doesn't prioritarianism capture the core moral impulse better? If no, how do you defend leaving them exposed?"

  8.  **Feasibility & Information:** "Even if normatively compelling, isn't this view practically impossible? Accurately measuring, comparing, and dynamically equalizing lifetime brute luck exposure variance across millions of individuals requires god-like knowledge of complex futures and constant intervention. Doesn't this make the view inert as a guide for real policy, unlike outcome-focused compensation?"
      *   *Likely Grab:* Acknowledge practical limits but argue it provides a clearer ideal target; suggest proxies (e.g., equalizing access to healthcare, security, education reduces baseline variance).
      *   *Follow-Up:* "But if your proxies are standard social goods that mitigate *outcomes*, haven't you just retreated to outcome-focused policies under a different name? How do these proxies specifically target *variance* reduction rather than just improving average/minimum conditions?"

  **Key Disputes & Consensus Notes for You:**
  *   **Live Dispute:** The harshness objection against standard LE is highly contested (e.g., Anderson vs. Arneson/Dworkin). **Don't** present it as settled.
  *   **Live Dispute:** The viability and moral significance of the brute/option luck distinction is debated. **Don't** assume it's clear-cut.
  *   **Live Dispute:** The moral relevance of ex ante vs. ex post perspectives is contested.
  *   **Novelty/Consensus Gap:** The specific "variance view" as described (equalizing *variance* of *exposure* over a *lifetime*) lacks direct precedent. The consensus is that this is **not** a standard or well-developed position. Its closest cousins are ex ante LE and capability/opportunity egalitarianism, but its unique focus creates novel problems.
  *   **Your Safety Net:** Frame questions as exploring tensions within *his* view ("How does your view handle X? It seems to lead to Y, which is problematic because Z...") rather than stating established critiques of a non-existent position. Highlight where his answers might align with or diverge from known positions ("That sounds similar to Dworkin's point about..." or "This seems to go beyond what prioritarianism would require...").

  This line of questioning forces him to define terms precisely, confront counterintuitive implications (especially leveling down risk and abandonment), defend against collapse accusations, and grapple with feasibility. Good luck with the interview!
