prompt: |-
  So I've been lurking on LessWrong and the old OB archives for like a decade now, and there's this one that keeps coming up that I've never fully gotten past: Good's theorem, i.e. the result that info can't hurt you, that free information is always welcome, a Bayesian should never pay to avoid a signal, etc. The proof is clean enough (max of an average is ≤ the average of the maxes, you can always just ignore the extra data), and everyone cites it like it settles the matter.

  But then in real life basically everyone avoids information constantly and it doesn't obviously seem irrational. My roommate refuses to look at his brokerage account when the market tanks. My sister won't get a screening test she's eligible for. I skip plot summaries of movies I'm about to watch. And whenever I bring this up the standard move is "oh thats just because the disutility of knowing is itself part of the payoff," which honestly feels like a dodge rather than an answer.

  So my actual question: given that Good's theorem proves information is never harmful, is all this avoidance just akrasia / a failure of instrumental rationality that I should be trying to train out of myself? Or is there some assumption in the theorem I'm not seeing that makes these cases actually not counterexamples?
reasoning: |-
  Okay, the user has been engaging with LessWrong and Overcoming Bias for a decade, so they're clearly familiar with rationalist concepts. They're stuck on Good's theorem—specifically, why people avoid information if the theorem says it should never hurt. They mention real-life examples: their roommate avoiding brokerage accounts during market dips, their sister skipping screening tests, and themselves avoiding movie spoilers. The standard explanation about disutility of knowing feels like a dodge to them.

  First, I need to recall Good's theorem. It states that free information is non-harmful because a Bayesian agent can always ignore it. The proof uses the max of averages vs. average of maxes inequality. But the user sees a contradiction with real behavior. They want to know if this avoidance is irrational or if there's a flaw in the theorem's assumptions.

  The user's explicit question is whether avoidance is akrasia or if there are hidden assumptions. But their deeper need might be reconciling theoretical rationality with human behavior. They might feel conflicted about their own information avoidance and want validation that it's rational, not a failure.

  Looking at the examples: emotional impact (roommate's stress), decision dynamics (sister's test leading to irreversible choices), and value of experience (movie spoilers reducing enjoyment). These point to the theorem's assumptions not holding in practice. The theorem assumes that information is free, utility is fixed, decisions remain flexible, and rationality is perfect. Real life violates these—information has emotional costs, utilities change upon knowing, decisions can become constrained, and humans aren't perfectly rational.

  The "disutility of knowing" explanation isn't a dodge; it's valid. The utility function includes more than just outcomes. For the sister, the anxiety from a positive test is a real cost. For the roommate, seeing losses causes immediate stress, even if holding is optimal. And for movies, spoilers alter the experience itself. Also, information can limit future choices, like in medical tests where knowing might force decisions the person wants to avoid.

  So, the answer is that these behaviors aren't necessarily irrational. The theorem's assumptions don't account for psychological costs, state-dependent utilities, or commitment mechanisms. The user shouldn't feel they need to train this out of themselves. Instead, they can recognize when information avoidance is rational by considering hidden costs and constraints beyond the simplified model.
answer: |-
  You've hit on one of the most genuinely subtle and practically important tensions between Bayesian rationality and human experience. Good's theorem *is* correct mathematically under its strict assumptions, but those assumptions are frequently violated in real life. The "disutility of knowing" explanation isn't *just* a dodge – it's often the key – but it's a bit glib without unpacking *why* that disutility arises and how it interacts with the theorem's foundations. Let's break it down:

  **The Core of Good's Theorem (Recap for Clarity):**
  1.  **Agent:** A perfectly rational Bayesian agent.
  2.  **Decision:** Facing a choice among actions `A`.
  3.  **World:** Existing in some unknown state `S` (with prior beliefs `P(S)`).
  4.  **Utility:** Has a utility function `U(A, S)` that depends *only* on the action chosen and the true state of the world. Utility is fixed and state-independent.
  5.  **Signal:** Receives a potentially informative signal `X` about `S` (with known likelihood `P(X|S)`).
  6.  **Free:** The signal is costless to receive and process.
  7.  **Commitment:** The agent can *always* choose to ignore `X` and act *exactly* as if they hadn't received it. They retain full flexibility.

  **Theorem:** `max_A E[U(A, S)]` ≤ `E_X [max_A E[U(A, S) | X]]`
  *   Left side: Max expected utility without the signal.
  *   Right side: Average (over possible signals `X`) of the max expected utility *given* that signal.
  *   The inequality says the expected utility *with* the signal (even after averaging over the uncertainty of what `X` will be) is at least as high as without it. You can't be worse off on average.

  **Why Real-Life Information Avoidance Isn't (Necessarily) Akrasia:**

  The examples you gave violate one or more of the core assumptions, making avoidance perfectly rational:

  1.  **Violation: Utility Depends on the *State of Knowledge* (Not just `A` and `S`):**
      *   **The Crucial Point:** Good's theorem assumes `U(A, S)` depends *only* on the action and the world state. It *cannot* depend on what the agent *knows* or *believes*.
      *   **Real Life:** Our utility *overwhelmingly* depends on our state of mind.
      *   **Examples:**
          *   **Your Roommate:** `U("Hold Stocks", S=Market Recovers)` is high. `U("Hold Stocks", S=Market Crashes Permanently)` is low. But crucially, `U` *also depends on the anxiety experienced during the crash*. *Knowing* the current massive paper loss causes immediate negative utility (anxiety, fear, temptation to panic sell) *even if the optimal action is still to hold*. Avoiding the information avoids this disutility *without changing the physical action* (holding). The "disutility of knowing" is real and isn't accounted for in the pure `U(A, S)` model.
          *   **Your Sister:** `U("Get Test", S=No Cancer)` is slightly negative (cost, inconvenience). `U("Get Test", S=Cancer)` is massively negative (fear, anxiety, facing mortality *even before treatment decisions*). `U("Don't Get Test", S=No Cancer)` is neutral/high. `U("Don't Get Test", S=Cancer)` is high *until symptoms appear* (blissful ignorance). The utility of the state "I have cancer but don't know it yet" is *higher* than the state "I have cancer and know it." The *knowledge itself* carries disutility that isn't captured solely by `S` and `A`.
          *   **You (Movie Spoilers):** `U("Watch Movie", S=Plot Twist)` is *much higher* if you experience the twist organically than if you know it's coming. The *state of knowledge* (`K`) during the watching experience fundamentally alters the utility derived from `(A="Watch", S=Plot Twist)`. `U(A, S, K)` ≠ `U(A, S)`.

  2.  **Violation: Loss of Flexibility / Commitment Problems:**
      *   **Assumption:** The agent can always ignore the signal and act *exactly* as if ignorant.
      *   **Real Life:** Knowing information can *force* you into choices or states of mind you actively want to avoid, or make it psychologically impossible to maintain the "ignorant" strategy.
      *   **Examples:**
          *   **Your Sister:** If she gets the test and it's positive, she *cannot* act "as if she didn't know." She *must* now grapple with the knowledge and the subsequent cascade of stressful decisions (biopsy, treatment options). Avoiding the test allows her to *commit* to the state of not having to deal with that potential future decision burden and anxiety. Good's theorem assumes she can get the test result and then effortlessly choose to ignore it completely – a psychological impossibility for most people facing a life-altering possibility.
          *   **Your Roommate:** Seeing the massive loss *might* make it impossible for him to stick to his "hold" plan due to panic, even if it's rationally optimal. He avoids the information to prevent triggering that panic response and preserve his ability to hold. The signal changes his internal state in a way that constrains his future action space psychologically.
      *   **Mechanism:** Information can act as a *pre-commitment device*. Avoiding it prevents locking yourself into a path (physical or psychological) that you know you'd take if you had the information, but prefer *not* to be on.

  3.  **Violation: Costly Processing / Rational Ignorance:**
      *   **Assumption:** The signal is free to receive and process.
      *   **Real Life:** Paying attention, understanding, and emotionally processing information costs time, mental energy, and causes stress ("disutility of knowing" again). If the expected benefit of the information (in terms of better decisions) is *less* than the expected cost of processing it (including anxiety), then avoiding it is rational.
      *   **Example:** Checking your brokerage constantly during volatility has a high attentional/emotional cost. The marginal benefit of knowing the exact figure *right now* vs. checking weekly/monthly is negligible for a long-term holder, but the cost is high. Avoiding frequent checks optimizes net utility.

  4.  **Violation: Imperfect Rationality (A softer point):**
      *   **Assumption:** Perfect Bayesian updating and optimal action selection.
      *   **Real Life:** Humans are cognitively limited and suffer from biases. Knowing information can trigger suboptimal heuristics or biases (loss aversion, availability heuristic, panic) that lead to worse decisions *than if they remained ignorant*. Avoiding the signal can be a rational second-best strategy to protect against one's own known irrational tendencies, especially in high-stakes emotional situations. Your roommate might *know* he's prone to panic selling. Avoiding the account is a self-binding strategy.

  **Addressing Your Examples Directly:**

  *   **Roommate Avoiding Brokerage:** Primarily violations of **Utility Depends on State of Knowledge** (immediate anxiety) and potentially **Loss of Flexibility** (risk of panic selling) or **Costly Processing** (constant stress).
  *   **Sister Avoiding Screening:** Primarily violations of **Utility Depends on State of Knowledge** (fear upon positive result) and **Loss of Flexibility** (forced confrontation with a terrifying decision cascade she wants to avoid).
  *   **You Avoiding Movie Spoilers:** Clear violation of **Utility Depends on State of Knowledge**. The experience utility is fundamentally altered by knowing the plot.

  **So, Is it Akrasia? Should You Train Yourself Out of It?**

  *   **No, not necessarily akrasia.** In the contexts you describe, it's often sophisticated **instrumental rationality**. You (and your roommate/sister) are recognizing that the core assumptions of Good's theorem don't hold. The disutility of knowing *is* a real part of the payoff, and the theorem *doesn't* prove that information is never harmful once you account for that. The loss of psychological flexibility is real.
  *   **When *is* it irrational?** Information avoidance *becomes* akrasia or irrational when:
      *   The *only* utility is in `A` and `S`, and the information genuinely improves decision-making with negligible processing cost. (e.g., refusing to look at a GPS when lost because you're stubborn).
      *   The avoidance stems from simple fear of truth rather than a calculated assessment of the net utility impact (including psychological costs).
      *   It prevents necessary actions indefinitely (e.g., never checking finances at all).
  *   **Training Yourself:** The goal shouldn't be to blindly seek all information because of Good's theorem. The goal should be to develop the **meta-cognitive skill** to:
      1.  **Identify Costs:** Honestly assess the *true* costs of information for *you*: emotional toll, distraction, potential to trigger biases, loss of desirable ignorance.
      2.  **Assess Benefits:** Honestly assess the potential decision-making benefits of the information. How much *could* it realistically improve your actions?
      3.  **Compare Net Utility:** Make a deliberate choice: Is the expected benefit of improved decisions (factoring in your ability to actually *use* the info rationally) *greater* than the expected costs (emotional, cognitive, loss of flexibility)?
      4.  **Manage Reactions:** If you *do* seek information, develop strategies to manage the psychological fallout (e.g., your roommate could plan a calming ritual *before* checking his account during downturns, reaffirming his long-term plan).

  **Conclusion:** Good's theorem is mathematically sound *within its specific, highly idealized model*. The real world constantly violates its assumptions, particularly the requirement that utility depends only on the action and the world state, and that agents retain perfect flexibility to ignore signals. Information avoidance in the examples you cite is often a rational response to the *real* disutility of knowing, the loss of psychological flexibility, the cost of processing, or a safeguard against known irrationality. It's not a failure of instrumental rationality; it *is* instrumental rationality operating in a complex world where knowledge itself has weight. The "dodge" points directly to the critical flaw in applying the theorem naïvely to human experience. You shouldn't feel obligated to purge yourself of this tendency, but rather refine your understanding of *when* avoidance serves your true goals and when it doesn't.
