  I'm a software engineer with no formal philosophy background, so sorry if this is basic. I've been reading about the lottery paradox and the preface paradox, and I think I'm missing something. My understanding is that the lottery paradox shows it's irrational to believe your ticket won't win, because if you believe that for every ticket then you believe no ticket wins, but you know one does. And the preface paradox shows it's irrational to believe everything in a book you wrote, because you also believe at least one claim in it is wrong. Someone told me the preface paradox is just the lottery paradox with sentences instead of tickets, and the winning ticket is the one false claim. If that's right, then both are really the same problem about high probabilty and conjunction. So if both paradoxes show that you can't rationally believe anything that isn't certain, doesnt that mean the only consistent position is to believe nothing? How do people actually reason under uncertainty then? I saw a comment that the fix is to drop conjunctive closure, but that seems like it just lets you believe contradictions. Can you answer in sections: Short verdict (2-3 sentences); The mix-up in my question (1 paragraph); What the lottery paradox actually shows (1-2 paragraphs); What the preface paradox actually shows (1-2 paragraphs); How I should think about rational belief under uncertainty (1 paragraph); and What would change your mind (1 paragraph).
