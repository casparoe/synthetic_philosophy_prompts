prompt: |-
  Ok so I just got back from like a three hour argument with my friend Priya about truthlikeness / verisimilitude, and I need to outsource the revenge part of this. The argument was: I said obviously some false theories are closer to the truth than others (Newton is closer to the truth than "the moon is made of cheese"), and she said yeah sure, but the project of actually *defining* that in a way that survives scrutiny is a graveyard, and then she gave me a pile of technical reasons that I only half followed and can now not reproduce at all. So I want to see a version of her point that I can actually understand, and ideally that stings a bit.

  Here's the job. You're a philosopher of science who's been refereeing for journals for about 20 years and is very, very tired. Write me a mock referee report -- the thing a journal emails to authors -- on a manuscript that claims to have *measured* how close two rival scientific theories are to the truth and ranked them. Like 600-700 words, formatted as a real report: the manuscript's (made-up) title, a one line recommendation, then numbered comments. Deadpan the whole way through. No winking, no "of course this is impossible!", no asides to the reader explaining the joke. The comedy has to come from the referee behaving like a totally normal, slightly pedantic referee while what he is asking for is structurally impossible, and from the author-facing politeness of it all. If it helps, the bleakest possible ending is him saying he'd be happy to look at a revised version.

  Things I want smuggled in. Priya explained these to me so I'm pretty sure they're right, and if you know the real versions, use them, but please don't cite anything, I don't want a bibliography, and if you need a philosopher's name just invent one rather than half-remembering a real one:

  - there's an old proof that on the natural definition of "closer to the truth" (A beats B if A keeps all of B's true consequences and adds some, while A's false consequences are fewer), no false theory can ever come out closer to the truth than any other false theory. Something about how you can always manufacture an extra false consequence of A that B doesn't have. The referee should ask the authors to reconcile their ranking with this, in the tone of a man asking them to fix their formatting.
  - the score depends on the vocabulary you describe the theory in. Same theory, equally expressive re-description, different ranking. Have him politely request that they re-run their metric in a second language and report both numbers.
  - the triviality thing: you can raise your truth-content by conjoining boring truths (2+2=4, that kind of thing), so he should be gravely unsure whether the theory in their appendix is closer to the truth just because they added more stuff to it.
  - they claim the measure "rewards content", and he notices that adding content also added false consequences, so he asks them to restate the whole result as a partial order.
  - if they switch to a similarity/distance based fix, he wants the weights justified, and points out that re-weighting flips the ranking in their own Table 2.
  - at some point he should note that the two theories being ranked are both false (the authors admit this in §2), i.e. the ranking is being done in exactly the case the proof covers.
  - somewhere he should be unable to say whether his own report is true and treat that as administratively fine.

  Think carefully before writing. Start with a few bullets of the actual technical objections you're going to put in his mouth, check that each one is something a real philosopher of science would nod at rather than wince at, and then write the report. And keep it readable for someone who's never heard of any of this, because I'm definately sending it to her.
