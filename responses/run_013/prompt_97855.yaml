prompt: |-
  I keep giving lopsided verdicts about whether someone did something on purpose, and I want to know what principle, if any, unifies them. I will describe the cases in my own words; please do not worry about whether they match anything in the literature.

  1. A pharmaceutical executive approves a drug knowing that, as a side effect, it will give a small number of patients a serious heart condition. She does not care about that at all. She approves it for the revenue, and she would approve it even if the heart risk were considerably larger. I think she harmed those patients on purpose.

  2. The same executive approves a drug knowing that, as a side effect, it will cure a rare disease in a small number of patients. She does not care about that either. I do not think she cured anyone on purpose.

  3. An engineer knows that his bridge design will, in a once-a-century flood, kill people downstream. He spends months searching for an alternative, fails, and builds it anyway, because the alternative route would kill more people in ordinary accidents. I still think he kills those people on purpose; the effort to avoid it does not change my verdict.

  4. A conscript is ordered to fire a warning shot that she knows will permanently deafen a bystander standing nearby. Refusing means execution, and she fires. I do not think she deafened him on purpose.

  5. A driver speeds through a residential street, indifferent to the risk, and his speeding startles a would-be mugger into fleeing, preventing a mugging he knew nothing about and cared nothing about. I do not think he prevented the mugging on purpose, even though he was reckless and blameworthy.

  6. A physician gives a painkiller she knows will, as a side effect, hasten a dying patient's death by a few hours. She intends only the relief and acts within accepted practice. I do not think she hastened the death on purpose.

  7. A corporation adopts a policy knowing that, as a side effect, it will drive a competitor out of business. No individual inside the firm intends this, and no one is pleased by it. I am inclined to say the corporation did it on purpose, but this verdict feels shakier to me than the others, and I can be argued out of it.

  My tentative principle is this: an outcome counts as brought about on purpose when the agent foresaw it as certain and the outcome is bad; good outcomes count only if the agent actually cared about them, not merely foresaw them. I can already see that this principle is strained by case 3, where the agent cared about avoiding the outcome and was justified in proceeding, and by case 4, where coercion seems to do the work rather than the agent's attitudes. I suspect the real driver is not the goodness or badness of the outcome but whether I am prepared to blame the agent, though case 5 seems to cut against that.

  What I want from you: state the principle, or a small ordered set of competing principles, that best captures these verdicts, and for each clause tell me which case forces it. Then say what each candidate principle predicts about a case I have not listed: an autonomous trading algorithm that foreseeably triggers a market crash, where no one intended the crash and the designers were merely careless in a way that would not support a criminal charge. Finally, tell me honestly which of my seven verdicts the best principle cannot accommodate, and whether I should give that verdict up or keep it and accept a more complicated principle.
reasoning: |-
  Hmm, the user is presenting a fascinating philosophical puzzle about intentional action. They've described seven nuanced cases where their intuition about "on purpose" seems inconsistent, and they're struggling to find a unifying principle. Their current hypothesis ties intentionality to outcome valence (good/bad) and agent attitude, but they correctly note it strains against cases 3 (justified harm) and 4 (coerced harm).

  Looking at their cases, I notice three recurring tensions: 
  First, bad outcomes tend to get labeled "on purpose" even when unintended (cases 1,3), while good ones require actual intent (2,5). 
  Second, effort to avoid harm doesn't negate "on purpose" (3), but coercion does (4). 
  Third, corporate/algorithmic cases (7) challenge individual intent frameworks.

  The user's meta-awareness is impressive - they've spotted how blame-sensitivity might contaminate their judgments (e.g., excusing the conscript while condemning the engineer despite both causing foreseeable harm). This suggests their question isn't just about semantics but about moral responsibility framing.

  For my response, I'll need to: 
  1) Formalize their valence-attitude principle clearly 
  2) Identify which cases break it (notably 3 and 4) 
  3) Propose two alternatives: one focusing on causal control, another on normative constraints 
  4) Apply all principles to their algorithmic crash scenario 
  5) Honestly flag where their verdicts conflict - particularly case 4 where coercion disrupts the pattern

  The algorithmic case will be telling: under valence-attitude, a "bad" crash would be "on purpose"; under causal control, yes if the algorithm had crash-triggering as a means/goal; under normative constraints, probably not since no duty violation. This might help them disentangle intentionality from blame.

  Ultimately they may need to accept either modifying their case 4 verdict ("the conscript did deafen on purpose, but is excused") or adopting a messier, multi-factor principle. I'll present this tradeoff transparently since they clearly value intellectual honesty.
answer: |-
  Your intuitive verdicts reveal a consistent pattern that's more nuanced than simple outcome valence (good/bad) or blame. The unifying principle lies in **whether the outcome was accepted as a necessary component of the agent's chosen course of action to achieve their primary goal, where the agent had meaningful causal control and no overriding normative constraint absolved them of authorship.** Below is the best-fitting principle, its competitors, and their application.

  ### The Best-Fitting Principle: The "Necessary Means/Component" Principle
  **An agent brings about an outcome "on purpose" if:**
  1.  **Foreseen Certainty/Near-Certainty:** The agent foresaw the outcome as certain or overwhelmingly likely to result from their chosen action.
  2.  **Causal Integration:** The outcome was a direct, non-deviant causal consequence of the action taken to achieve the agent's primary goal(s).
  3.  **Necessity to Plan:** The outcome was treated by the agent as a necessary component or unavoidable means inherent in the action plan chosen to pursue their goal(s), even if undesired.
  4.  **Meaningful Agency:** The agent had sufficient control and lack of overriding external compulsion (like direct, lethal coercion) in making the choice.

  **How it explains your cases:**
  *   **Case 1 (Drug Harm):** Satisfies all. Heart condition is foreseen, causally direct, necessary to drug approval/approval process, and she had full agency. (Forces Clause 3 - treated as necessary component).
  *   **Case 2 (Drug Cure):** Fails Clause 3. The cure is foreseen and causally direct, but it's *not* treated as a necessary component of her plan (approval for profit). It's pure, irrelevant side-effect. (Forces distinction in Clause 3).
  *   **Case 3 (Bridge):** Satisfies all. Deaths are foreseen, causally direct, treated as a necessary component of the chosen plan (building *this* bridge despite knowing the flood risk), and he had agency/alternatives (even if worse). Effort shows aversion, not that it wasn't necessary to *his chosen solution*. (Forces Clause 4 - Agency can exist even with justification/regret; confirms Clause 3).
  *   **Case 4 (Conscript):** **Fails Clause 4.** While deafening is foreseen, causally direct, and arguably necessary to firing the shot (her chosen action to avoid execution), she lacks meaningful agency due to the overwhelming compulsion (execution threat). The act is *attributed to the coercer*. (Forces Clause 4 - Overriding compulsion breaks authorship).
  *   **Case 5 (Reckless Driver):** Fails Clause 2 & 3. Prevention is unforeseen. Even if foreseen, it's a deviant causal chain (startling mugger) and not a necessary component of speeding (he didn't rely on it happening). (Forces Clause 2 - Direct causal link needed; reinforces Clause 3).
  *   **Case 6 (Physician):** Fails Clause 3. Hastening death is foreseen and causally direct, but it's *not* treated as a necessary component of the plan (pain relief). Relief doesn't *require* hastening death; it's an unintended side-effect of the necessary means (the drug). Accepted practice reflects this. (Reinforces Clause 3 distinction).
  *   **Case 7 (Corp Competitor):** **Borderline, leans Yes on this principle.** Outcome is foreseen, causally direct (policy adoption -> competitor failure), and treated as a necessary component of the *corporation's* chosen plan to achieve its goals (e.g., profit via market dominance). The lack of individual intent/pleasure is countered by *corporate* intent/plan adoption. (Forces application of the principle to collective agents via Clause 3 & 4).

  ### Competing Principles & Their Shortcomings
  1.  **Valence-Attitude Principle (Your Tentative One):** "On purpose" if outcome is bad, foreseen as certain, *or* good and actually desired.
      *   **Fails:** Case 3 (Bad outcome, agent cared *against* it, effort made, but you say "on purpose"). Case 4 (Bad outcome, foreseen, but you say *not* "on purpose" due to coercion). Case 7 (Ambiguity weakens it). **Predicts Crash:** Yes (Bad outcome, foreseen as certain/near-certain).
  2.  **Blame-Sensitivity Principle:** "On purpose" if you are prepared to blame the agent for the outcome.
      *   **Fails:** Case 5 (You blame driver for recklessness, but *not* for preventing mugging "on purpose"). Case 6 (No blame for physician, verdict fits, but principle is circular - verdict defines blame, not vice versa). Case 3 (You blame engineer *less* due to justification, but still say "on purpose"). **Predicts Crash:** Maybe, if designers are blamed for carelessness.

  ### Application to the Algorithmic Crash Case
  *   **Scenario:** Autonomous trading algorithm foreseeably triggers a market crash. No one intended the crash; designers were merely careless (not criminally negligent).
  *   **Necessary Means/Component Principle Prediction:** **No, not "on purpose."**
      *   *Why?* Clause 3 fails. The crash, while foreseeable, was *not* treated as a necessary component of the algorithm's trading strategy or the designers' plan for profit. It was an unintended, undesirable side-effect of the chosen design/strategy. The designers didn't incorporate the crash risk as a necessary step; they failed to adequately prevent it (carelessness). Clause 4 (agency) is complex for algorithms, but the *designers'* lack of integration of the crash into their plan is key.
  *   **Valence-Attitude Principle Prediction:** Yes (Bad outcome, foreseen).
  *   **Blame-Sensitivity Principle Prediction:** Maybe (If you blame designers for carelessness).

  ### Verdicts the Best Principle Cannot Fully Accommodate (and Recommendation)
  *   **Case 4 (Conscript):** This is the biggest tension. The principle clearly says "No" due to Clause 4 (overriding compulsion). Your verdict is "No," which fits, *but* the *reasoning* differs. You likely feel the coercion makes it "not on purpose" *because* she lacked real choice. The principle captures this via Clause 4. **Recommendation: Keep your verdict; the principle accommodates it well via Clause 4.**
  *   **Case 7 (Corporation):** The principle leans "Yes," matching your shaky inclination. However, your discomfort highlights the challenge of collective agency. Does the corporation truly have a "plan" where the outcome is a "necessary component"? If the policy *wasn't chosen specifically because* it would harm the competitor, but the harm was merely foreseen, Clause 3 might not hold. **Recommendation: Keep your verdict but refine Clause 3 for collectives.** Specify that the outcome must be part of the *institutional* rationale or foreseeable consequence of the *corporate* plan/action, not necessarily desired by individuals. Your instinct is defensible.
  *   **Minor Strain in Case 3 (Engineer):** You felt effort didn't matter; the principle explains *why* (the outcome was still necessary to *his chosen plan*). This is consistent.

  **Conclusion:** The "Necessary Means/Component" principle best unifies your verdicts, explaining the core distinction between outcomes integrated into the agent's plan (even if regretted/justified) and those that are merely foreseen side-effects or overridden by coercion. It cleanly handles the algorithmic crash case ("not on purpose"). Your Case 4 verdict is accommodated by Clause 4, and Case 7 can be accommodated with a slight refinement for collective agency. This principle successfully disentangles "on purpose" from simple outcome valence, blame, or desire, focusing instead on the *structural role* of the outcome within the agent's chosen action framework.
