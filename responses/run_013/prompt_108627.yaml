answer: |-
  ## Kitchen Table Calculus

  **Setting:** A worn kitchen table. Two postcards, one blank, one with a number scrawled. A twenty-sided die sits beside Iris’s teacup. Ray nervously taps a pencil on the edge of an envelope covered in calculations.

  **(The air is thick with unsaid frustration.)**

  **IRIS:** (Picks up the die, rolls it thoughtfully in her palm) One chance in twenty thousand. That's my stake. My one vote in the lottery of greed.

  **RAY:** (Doesn't look up from his envelope) It's not greed, Iris. It's counterweight. If the town claims low, my high claim balances it. If they claim high, I match their sum. It’s the only rational play. Look. (Taps the envelope) Let ‘S’ be the total claims *without* me. My claim is ‘S’. Total entries become S + S = 2S. My *share* of the prize is S / 2S = half. Half a million dollars, guaranteed, if S is less than a million. If S is huge, I still get half the *effective* prize pool relative to the others. It’s dominant.

  **IRIS:** Dominant for *you*. But what if everyone plays Ray? What number do you write down then, Ray? What's this magical 'S' that you claim, if everyone else is also trying to claim 'S'? What *is* S? Tell me the number. (Leans forward) Give me a number that every single person in this town can write on their card *simultaneously*, following your rule.

  **RAY:** (Looks up, momentarily flustered) They... they won't. They don't think like this. Most people will put down ten, or a hundred, or a thousand. They're not calculating S. They're guessing.

  **IRIS:** But *if* they did? If everyone read your envelope? Your rule evaporates. It requires most people *not* to follow it for *you* to follow it. It’s parasitic. It only works if you’re the only one doing it, or one of a very few. It’s not a rule for living together; it’s a strategy for exploiting the herd.

  **RAY:** That’s not the point! My action doesn't *force* theirs. My one postcard doesn't magically make everyone else start calculating S. Their numbers are fixed when they mail them. My claim adjusts to *their* fixed sum. It’s responsive. It doesn’t require them to know my strategy, let alone copy it. Why should I tie my hands because of a hypothetical where *everyone* suddenly becomes a game theorist? That’s like refusing to wear a raincoat because ‘what if everyone wore one, then we’d all look silly?’ The rain is still falling!

  **IRIS:** The rain falls on everyone equally. This contest *is* the raincoat! Your strategy *is* the downpour! You see a collective action problem and your solution is to sprint ahead of the crowd, grabbing as many life jackets as you can carry, making sure there are fewer for everyone else. You call it counterweight? It’s an anchor you’re tying to the community raft while jumping into your own lifeboat. And yes, maybe only *you* jump smartly today. But what lesson does it teach? What happens next time? People remember. They see Ray won big by claiming ten thousand times more than anyone else. Next contest, they claim ten thousand too. Then you claim twenty thousand. Then they claim fifty. Where does it stop? It becomes a race where the prize shrinks exactly as fast as we run towards it. We all just sweat more for the same tiny crumb.

  **RAY:** (Scribbles furiously) Okay, worst case, worst case... say everyone *does* get crazy smart and aggressive next time. Say they all claim huge numbers. Fine. My calculation *still holds*. If the total without me is a billion, I claim a billion. My share is a billion divided by two billion – still fifty cents on the dollar relative to the *existing* pot. I still get my *proportional* slice. Standing still gets you crumbs. Playing gets you your fair slice, adjusted for the madness. Sitting out? That gets you *nothing*. You surrender your chance entirely. That’s not principle, Iris, that’s... resignation.

  **IRIS:** Resignation? Or inoculation? I’m refusing to play the madness game. My one entry is my statement: this is enough. My chance is real, tiny, but real. Claiming thousands? That inflates the total, shrinks the prize for *everyone*, including yourself! You’re chasing a bigger slice of a pie you’re actively making smaller! It’s self-defeating on a mass scale. We know this! Didn’t some science magazine do this exact thing decades ago? People mailed in numbers like a billion billion? The prize shrank to a fraction of a penny. It was a joke! A monument to collective stupidity dressed up as self-interest.

  **RAY:** (Sighs, puts the pencil down) Okay. Yes. *Scientific American*. The ‘Luring Lottery’. People overcomplicated it. They panicked. They didn’t understand the equilibrium. They claimed numbers far bigger than the actual population or rational expectation. It was chaos. But that *proves* they weren’t thinking clearly! They weren’t using a strategy like mine. My claim is *directly proportional* to the expected claim of others. It’s bounded by reality. If everyone used *my* strategy rationally… okay, yes, it breaks down. It assumes not everyone is doing it. I grant you that. (He meets her eyes, conceding the point but not the principle). But in the *real world*, Iris, in *this* town, on *this* Friday, with people mailing in tens and hundreds… my number is optimal. For me. Right now. Your one-in-twenty-thousand chance? It’s noble. It’s also functionally identical to zero. You might as well not mail the card.

  **IRIS:** (Picks up her postcard, looks at the blank space) Functionally zero? Maybe. But it’s *my* functionally zero. It’s the weight of my choice, measured honestly. One chance. Not ten thousand manufactured chances that only exist because I’m trying to outmaneuver my neighbors. (She takes a pen, writes a single, deliberate '1' on the card). You talk about your fair proportional slice. Fair to whom? To the aggregate of other claims? What about fairness to Mrs. Gable next door, living on cat food and social security? Is she calculating S? Is she even mailing a card? Your ‘fair’ slice comes directly out of the pool that might have been her lifeline if everyone showed restraint. You’re not just claiming *your* slice, Ray. You’re helping ensure the whole pie is crumbs before anyone else gets near it.

  **RAY:** (Stares at his own card, the large number he’s written looking suddenly grotesque) And your restraint guarantees only the unrestrained get anything at all. Mrs. Gable won’t win your one-entry lottery either, Iris. The winner will likely be someone who claimed a hundred, or five hundred. Someone playing the game, just less aggressively than me. Your purity feeds their opportunism just as surely as my aggression does. Maybe more so, because you remove your counterweight. (He picks up his card, doesn't change the number). It’s ugly. I know it’s ugly. But opting out doesn’t make it beautiful. It just makes you irrelevant to the outcome. I’d rather be in the fray, trying to navigate the ugliness rationally, than sitting on the sidelines wishing it were different.

  **IRIS:** (Stands, postcard in hand) Then navigate, Ray. Claim your proportional slice of the shrinking pie. I’ll take my one chance in the lottery, and the certainty that I didn’t make the water murkier for the fish I swim with. There’s a mailbox down the street. I’ll see you tomorrow. (She walks out, the die left gleaming on the table beside her empty cup).

  **RAY:** (Sits alone for a long moment, looking at the large number on his card. He picks up the die Iris left behind, weighs it in his hand. He puts it down. He doesn't touch his postcard yet. He picks up the pencil again and stares at the envelope, not writing, just staring at the immutable logic of 'S' and the shrinking fraction it now represents in the silence of the kitchen).
