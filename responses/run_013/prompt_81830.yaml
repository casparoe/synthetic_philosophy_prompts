prompt: |-
  So I'm about 200 pages into a novel — German family, 1920s, father's a schoolmaster, one son back from the front and one buried in France — and I keep stalling on the same scene. It's the morning the paper prints the clause from the peace treaty where Germany "accepts the responsibility of Germany and her allies for causing all the loss and damage." And the reason I keep stalling is that I've been reading about the fight historians had over this later — Fischer and the crowd arguing about whether Germany alone willed the war or whether the whole continent slid into it together — and it finally clicked for me that the clause was never meant as a moral verdict at all. It was plumbing. A legal hook so the Allies could send a bill. The men who wrote it were apparently surprised anybody read it as an accusation. Yet that's exactly how it read in every kitchen in Germany: an accusation, handed to a whole people, including the ones who'd been against the war, the ones who'd just chucked out the Kaiser, and the ones not born yet.

  So here's what I actually want, and its not history, it's the thing underneath the history. When we take a war and pin it on a nation — in a treaty, in a reparations schedule, in the way everybody afterward says "they started it" — what is that practice secretly committed to? Does it need nations to be agents, the kind of thing that can intend, decide, and be blamed the way a person is? Or could it run on something thinner — strict liability, where fault never enters and you simply owe for damage that happened to come from your side? Is "caused" doing the work, or "guilty," and are those the same job or two different jobs? And which parts of the practice are load-bearing and which are just decoration, because I suspect the whole thing is a mess holding together on vibes.

  Don't send me reading lists or citations, I won't chase them and I don't trust you to get them right without looking anything up anyway. Just reason it out and hand it back as a JSON object, exactly these fields:

  - "the_practice": the practice restated plainly in a sentence or two, the way you'd describe it to someone who'd never heard of it.
  - "what_it_presupposes": the implicit theory of responsibility — and of what a nation is — that the practice only makes sense under, in a short paragraph.
  - "load_bearing": array of short strings. The commitments it genuinely cannot do without.
  - "just_fits": array of short strings. Things the practice is merely compatible with, that it isn't actually committed to.
  - "rules_out": array of short strings. Rival views the practice can't live with.
  - "cracks": array of short strings. Places where it pulls two ways at once — liability versus fault, the collective versus the individual, the nation-as-one versus the nation-as-many.
  - "left_open": array of short strings. Where the practice is undecided, so that several different theories would each license it.
  - "swap_test": if you traded the presupposed view for its main rival, what concretely changes — in the treaty, the tribunal, the bill, the way the next war gets blamed.
  - "for_the_scene": two or three concrete beats or images I could put on the page that would make all this visible without a character standing up and lecturing. This is the one I'll actually use, so make them good.

  Keep the whole thing tight. I've got a deadline and a bad back.
reasoning: |-
  We are describing the practice of assigning responsibility for a war to a nation (or nations) through mechanisms like treaties, reparations, and historical narratives. The focus is on the underlying assumptions and the structure of this practice.

  The practice restated plainly: 
  When a war ends, the victorious powers write into the peace treaty that the defeated nation (or nations) is responsible for causing the war and must pay reparations for the damages. This is done to legally justify the reparations and to assign blame.

  What it presupposes:
  The practice presupposes that a nation is a unified agent capable of collective action and intention, much like an individual person. It assumes that the nation, as a whole, can be held responsible for the actions of its government and military, even if individual citizens had varying degrees of complicity or opposition. Responsibility is seen as collective and transferable across time and regime changes. The practice also assumes that wars have a clear cause that can be attributed to one side and that assigning blame in this way is a legitimate basis for demanding compensation.

  Load bearing (essential commitments without which the practice collapses):
  - "Collective responsibility of the nation"
  - "Nation as a continuous legal entity"
  - "Causality: the war can be attributed to one side"
  - "Legal basis for reparations"
  - "Distinction between victor and defeated"

  Just fits (compatible but not necessary):
  - "Moral guilt of the nation"
  - "Historical narrative of blame"
  - "Punitive intent"
  - "Deterrence for future wars"
  - "Symbolic acknowledgment of suffering"

  Rules out (rival views that the practice cannot accommodate):
  - "War as a complex system with no single cause"
  - "Individual responsibility only (no collective guilt)"
  - "Nation as a mere aggregation of individuals without agency"
  - "Strict liability without any attribution of fault"
  - "Shared responsibility among multiple nations"

  Cracks (internal tensions):
  - "Collective liability vs. individual innocence"
  - "Attribution of fault vs. strict liability (without fault)"
  - "The nation as one (monolithic) vs. the nation as many (diverse individuals)"
  - "The legal need for a responsible party vs. the historical ambiguity of causes"
  - "Continuity of the nation across regime changes vs. the new government's lack of involvement in starting the war"

  Left open (undecided, so multiple theories could fit):
  - "Whether the assignment is primarily legal or moral"
  - "The degree to which the nation's population endorses the war"
  - "The exact mechanism by which the nation 'causes' the war (e.g., government, military, popular will)"
  - "The extent to which reparations are compensatory vs. punitive"

  Swap test (if we swapped the presupposed view for its main rival):
  Main rival: Strict liability without fault (like in tort law for dangerous activities) — where the nation owes simply because the damage came from its side, without any accusation of blame.

  Concretely:
  - The treaty clause would read: "Germany and her allies are liable for the loss and damage" (dropping "responsibility" and "causing" in the moral sense).
  - The tribunal would not investigate the causes of the war but only the extent of damages.
  - The bill would be based solely on the damage caused, without any moral condemnation.
  - The next war's blame would be assigned by who lost, not by who started it. The narrative would be: "The defeated pays" rather than "The guilty pays."

  For the scene (concrete beats/images for the novel):
  1. The father, a schoolmaster, reads the newspaper with the clause. He underlines the word "responsibility" and then "caused", then looks at the photo of his son buried in France — a son who volunteered in 1914. He remembers arguing against the war in the staff room and being called a traitor. Now he is being called responsible. The newspaper ink smudges under his thumb as he rereads the sentence.

  2. The son back from the front enters, sees the paper, and scoffs: "So now we're the criminals? Tell that to the French machine gunner who killed Karl — he was defending his country, same as me." He picks up his dead brother's photo and turns it face down.

  3. The mother, who has been silently setting the table, says: "They're sending a bill. It's about the money. But they've wrapped it in shame." She folds the newspaper and tucks it under the leg of the wobbly kitchen table to steady it — a practical use for the document that accuses them.

  These images show the personal impact, the gap between the legal intent and the perceived moral accusation, and the practical reality of reparations versus the symbolic weight of the words.
