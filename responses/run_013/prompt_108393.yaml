  Okay, let me approach this systematically. The user is preparing seminar notes on Aristotle's Metaphysics VII.13 and needs help unpacking a dense passage about universals and substance. They specifically want to move students beyond labels like realism/nominalism into the actual argumentation.

  First, I need to analyze the Metaphysics passage in detail. The core tension is between Aristotle's early view in Categories (where genera/species are secondary substances) and his later rejection of universals as substances in Metaphysics VII.13. The user's questions reveal several pain points: the "But perhaps..." concession, the composition argument, and reconciling the two texts.

  For question 1 about step-by-step argument: I'll break it down logically. Key steps are: (1) Substance is peculiar to one thing, universal common to many - this sets up incompatibility. (2) Universal can't be substance of all or one (leads to monism). (3) Substance isn't predicated, universal always is - terminological clash. Each step mixes definitions ("predicated of a subject") with metaphysical claims (monism absurdity).

  Question 2's "But perhaps..." is tricky. Aristotle temporarily grants the opponent's view that universals might exist within essences (like animal in man). But he shows this creates infinite regress when "animal" must then be substance of something else. The phrase "as peculiar to it" exposes the flaw - if animal is peculiar to horse, it can't also be in man.

  Question 3's composition argument shifts focus: if substance were composed of qualities (universals), non-substances would precede substances - absurd for Aristotle. The Socrates argument shows universals can't be substances of multiple individuals. Both reinforce earlier points but add new angles.

  For question 4's reconciliation: The Categories uses "substance" hierarchically (primary/secondary) while Metaphysics uses it exclusively for particulars. It's a refinement - Metaphysics tightens criteria, denying secondary substance status. The translation of logos as "formula" rather than "account" or "definition" may obscure how Aristotle links definability to substancehood.

  The colleague's question-begging charge (question 5) misses Aristotle's target - he's arguing against any universal being substance (primary or secondary), not just separately existing Forms. The mediaeval distinction suggestion (question 6) isn't present here; Aristotle doesn't consider "natures" abstracted from instantiation.

  Throughout, I'll avoid scholarly references per request, sticking strictly to the passages. The notes should model how to dissect philosophical arguments layer by layer - exactly what the user wants to teach their students.
answer: |-
  Here are seminar notes addressing each query, designed to reconstruct the argument's joints and highlight interpretive tensions without smoothing them over. Key terms are glossed contextually.

  ---

  ### **Core Terminology** (Glossed for Clarity in Passage)
  *   **Substance (ousia):** The fundamental, independent reality of a thing; *what it is* in the most basic sense (e.g., this specific horse, Socrates).
  *   **Universal (katholou):** That which is common (predicable) of many particular things (e.g., "man," "animal").
  *   **Predicated of a subject (kath' hypokeimenou):** Said *of* something else as its subject (e.g., "Socrates is a man" – "man" is predicated of the subject "Socrates").
  *   **Present in a subject (en hypokeimenōi):** An attribute existing *in* and inseparable from a substance, but not part of its essence (e.g., "Socrates is pale" – paleness is *in* Socrates).
  *   **Essence (to ti ēn einai, "what-it-was-to-be"):** The fundamental, defining nature of a substance, captured in its definition.
  *   **Formula/Account (logos):** The statement or definition expressing the essence of a thing.

  ---

  ### **1. Step-by-Step Argument of Metaphysics VII.13 Passage**
      *   **Step 1 (Premise - Definitional):** "The substance of an individual is the substance which is peculiar to it and belongs to nothing else." (Substance is *particular* and *unique* to the individual.)
      *   **Step 2 (Premise - Definitional):** "The universal is common; for by universal we mean that which by nature appertains to several things." (Universal is *common* and *repeatable*.)
      *   **Step 3 (Inference - Metaphysical Claim):** Therefore, a universal cannot be the substance (in the primary, peculiar sense) of any individual, as substance is unique, universals are shared. *(Tension established: Universality vs. Substantial Peculiarity)*
      *   **Step 4 (Argument - Dilemma):** Of what particular(s) could a universal be the substance? "Either of all or of none."
          *   **Horn A (Impossible):** It cannot be the substance *of all* the things it applies to. (Why? Implied: It would make all those things *one* substance.)
          *   **Horn B (Impossible - Metaphysical Claim):** If it were the substance of just *one* particular, then all other particulars it applies to would *also* be that one particular. "Because things whose substance is one have also one essence and are themselves one." (Shared substance implies shared essence implies numerical identity – absurd monism.)
      *   **Step 5 (Premise - Definitional):** "Substance means that which is not predicated of a subject, whereas the universal is always predicated of some subject." (Substance is *ultimate subject*; Universals are *predicates*.) *(Tension reinforced: Subjecthood vs. Predicability)*
      *   **Step 6 (Concession & Counter):** "But perhaps although the universal cannot be substance in the sense that essence is, it can be present *in* the essence..." (See Q2 below for full analysis). *Concession:* Maybe universal isn't the essence/substance *itself*, but a *constituent* of the essence (e.g., "animal" in "man").
      *   **Step 7 (Reductio of Concession):** If the universal (e.g., "animal") is present *in* the essence (e.g., of "man") and is thereby the substance *of* that in which it is present *as peculiar to it*, then "animal" must be the substance of *one* thing (e.g., the species "man"?). But then "animal" must apply *peculiarly* to that one thing. This recreates the original problem: "animal" applies to many species (horse, man). If it's the substance of one (say "man"), then by Step 4, "horse" would also *be* "man" – absurdity redux. *(Argument loops back)*
      *   **Step 8 (New Argument - Composition):** "Again, it is impossible and absurd that the individual or substance, if it is composed of anything, should be composed not of substances nor of the individual, but of a quality..." (See Q3 below).
      *   **Step 9 (New Argument - Double Substance):** "Again, a substance will be present in 'Socrates,' who is a substance; so that it will be the substance of two things." (See Q3 below).

  **Key:** Steps 1, 2, 5 rely heavily on **definitions** of 'substance' and 'universal'. Steps 3, 4 (esp. Horn B), 7, 8, 9 make **substantive metaphysical claims** about the uniqueness of substance, the absurdity of monism, the priority of substance over qualities, and the impossibility of a substance being predicated of another substance.

  ---

  ### **2. The "But perhaps..." Sentence**
  *   **What is Conceded?** Aristotle concedes an objection: Perhaps his opponent doesn't claim the universal *is* the whole substance/essence itself, but rather that it is a *constituent part* present *within* the essence. (E.g., "animal" isn't *Socrates'* substance, but it *is* a fundamental part *within* the essence "man" which *is* Socrates' substance.)
  *   **To Whom?** Likely to Platonists who see Forms (universals) as components of reality, or to anyone trying to salvage universals as essential parts.
  *   **Why Concession Makes Things Worse:** Granting this seems helpful to the opponent initially ("Then clearly there is in some sense a formula of the universal"). However, Aristotle immediately presses: Even if the universal is a constituent *in* the essence (and thus *part* of what makes the substance what it is), then *this universal constituent itself* must be the substance *of something*. If "man" (a universal) is the substance of *this* man (Socrates), then "animal" (a more universal constituent within "man") must likewise be the substance *of that in which it is present as peculiar to it*. But what is "animal" present in *peculiarly*? It must be present in *one* thing (e.g., the species "man") as *its* peculiar substance.
  *   **Work of "as peculiar to it":** This phrase is crucial for the reductio. Aristotle uses the opponent's own concession against them. If the universal ("animal") is to be *a substance* at all (even as a constituent), it must meet the core criterion from Step 1: it must be *peculiar* to *one* thing. But "animal" is *not* peculiar to just one species (e.g., "man"); it is common to "man" *and* "horse". Therefore, it *cannot* be the peculiar substance of "man". The concession that the universal is *in* the essence forces it back into the role of needing to be *a substance itself* (of the species?), which then triggers the original dilemma (Step 4) about what *it* could be the substance of. The "peculiar" requirement exposes the universal's inherent commonality as fatal to its substantiality.

  ---

  ### **3. The Composition and Socrates Arguments**
  *   **The Composition Argument (Step 8):**
      *   **Claim:** It's absurd for an individual substance (a "this") to be composed *of* qualities (like universals) rather than of other substances or individuals. If it were composed of qualities (e.g., if Socrates were just a bundle of "animality" + "rationality"), then non-substances (qualities) would be *prior* to substance. This is impossible because:
          *   **In Formula (Logos):** You cannot define a quality without reference to the substance it belongs to (e.g., "pale" means "pale *thing*").
          *   **In Time:** The substance must exist first for the quality to inhere *in* it.
          *   **In Generation:** The substance comes into being first, qualities come to be *in* it.
      *   **Connection to Universals:** While phrased about composition ("composed of"), the target is the view that universals (like "animal") are the fundamental *constituents* of substances. If the universal "animal" were the substance (or a primary constituent), then the individual (Socrates) would be composed *of* this universal quality. Aristotle argues this inverts metaphysical priority: the dependent quality (universal) would be prior to the independent subject (substance). It reinforces Step 5 (substance isn't predicated) by showing universals (predicates/qualities) cannot be the fundamental *stuff* things are made of.
  *   **The Socrates Argument (Step 9):**
      *   **Claim:** If a universal (e.g., "man") *were* a substance, and it is present *in* the primary substance Socrates (who *is* a substance), then we would have *one* substance ("man") being the substance *of* another substance (Socrates). This means the *same* substance ("man") would be the substance *of two things*: 1) Socrates, and 2) Whatever "man" itself *is* (its own substrate or essence). This violates the uniqueness implied by substantiality.
      *   **Connection:** This directly follows the composition argument. If universals like "man" were substances *and* present *in* primary substances like Socrates, you get the absurdity of one substance ("man") being both the substance *of* Socrates *and* being a substance *in its own right*. It reiterates the core tension: universals are predicated *of* subjects/substances (Step 5) and cannot *themselves* *be* the fundamental subjects/substances without creating confusion and duplication.
  *   **Are they Independent or Restatements?** Both arguments are **independent reinforcements** of the core thesis (no universal is substance) using *different* angles:
      1.  The *Composition Argument* focuses on **metaphysical priority** (substances must be prior to qualities/universals).
      2.  The *Socrates Argument* focuses on **logical/ontological confusion** (one thing cannot be *the substance of* two distinct things, especially if one is predicated *of* the other).
      They are not mere restatements of Steps 1-7 but apply the core principles (substance as subject, substance as unique) to new scenarios (constitution, predication hierarchy) to show further absurdities.

  ---

  ### **4. Reconciling Categories and Metaphysics VII.13**
  *   **The Conflict:** *Categories:* Primary substances = individuals (Socrates). Secondary substances = species ("man") and genera ("animal") – they *are* substances, just less fundamental. *Metaphysics VII.13:* No universal ("man," "animal") can be a substance *at all*. Substance = what is *not* predicated of a subject (aligning with *Categories* primary substance).
  *   **Holding Them Together?** Yes, with significant **refinement**, not a simple retreat. The *sense* of "substance" shifts:
      *   **Categories Sense (Broad Hierarchical):** "Substance" primarily means *individual concrete thing*. Secondarily, it extends to *what is said of* these things *to tell you what they essentially are* (species/genus). Predicability of secondary substances is unproblematic.
      *   **Metaphysics VII Sense (Strict & Exclusive):** "Substance" *only* means the ultimate subject, the fundamental reality *which cannot be predicated of anything else*. Here, "substance" *exclusively* refers to what the *Categories* calls "primary substance." The *Categories'* "secondary substances" are now explicitly *excluded* from being substances *because* they are universals/predicables. **The later passage refines the concept, tightening the criteria.** Substance is now synonymous with *primary* substance only, and universals (even essential ones like species) fail the test of being non-predicable subjects.
  *   **What to Tell the Student:** Aristotle didn't simply change his mind; he **deepened and narrowed his analysis.** In the *Categories*, he classifies terms linguistically/ontologically. In *Metaphysics* VII, he asks what *fundamental reality* must be like. He concludes that only the individual concrete particular meets the strict criteria of being the ultimate subject, non-predicable, and unique. The *Categories* "secondary substances" are still real and essential for knowledge (as universals/essences), but they are *not* substances in the primary, fundamental sense being investigated in *Metaphysics* VII. **The refinement is the denial of substantial status to universals *as such*.**

  ---

  ### **5. Assessing the Charge of Question-Begging**
  *   **The Charge:** The argument only shows a universal cannot be a *primary* substance (an individual "this"). But Platonists (like the colleague suggests) believe separately existing universals (Forms) are a *higher kind* of substance, *not* primary substances like Socrates. Aristotle hasn't refuted *this* claim; he assumes that only "this-es" can be fundamental.
  *   **Assessment on Passage's Terms:**
      1.  The argument **does explicitly target universals *as such***, not just primary substances. Steps 1-5 argue *from the definition of universal* (common to many) that it cannot satisfy the definition of substance (peculiar, non-predicable subject). This applies to *any* universal, whether immanent or transcendent.
      2.  The **dilemma (Step 4)** targets *what* a universal could be the substance *of*. If a Platonic Form (e.g., Man-Itself) is proposed as the substance of *something* (e.g., the species "man" or individual men), the same problems arise:
          *   If Man-Itself is the substance of *all* men, they become one thing.
          *   If Man-Itself is the substance of just *one* thing (itself?), then men wouldn't have *it* as their substance.
      3.  The **Socrates Argument (Step 9)** directly challenges transcendent Forms: If Man-Itself (a substance) is "present in" Socrates (a substance), then Man-Itself is the substance of both itself *and* Socrates – absurd.
      4.  The **Composition Argument (Step 8)** implies that even transcendent Forms, if they were the "stuff" things are made of or depend on, would make qualities prior to substances.
  *   **Conclusion:** While the argument *assumes* that substance must be a "this" (individual subject), it **does not beg the question against separately existing universals.** It attempts to show that *any* entity possessing the characteristic of universality (being common/predicable) *cannot* possess the characteristics required of substance (being peculiar/non-predicable/subject). It argues that the *very concept* of a universal is incompatible with the *very concept* of substance as Aristotle has defined it in *Metaphysics* VII, *regardless* of whether that universal is immanent or transcendent. The Platonist's "higher substance" is exactly what Aristotle is arguing *cannot exist* as substance.

  ---

  ### **6. The Mediaeval Nature/Contraction Distinction**
  *   **The Distinction:** A nature (e.g., humanity) considered *in itself* is neither universal nor singular; it's just the essence. It becomes universal when considered abstractly by the mind. It becomes singular ("contracted") when instantiated in matter by a principle of individuation (like *haecceitas* in Scotus).
  *   **Is it Present in the Passage?** **No.** Aristotle shows no sign of this distinction here. He treats "animal" and "man" straightforwardly *as universals* throughout the argument (common, predicable of many). He doesn't posit a neutral "animality-as-such" prior to its mode of being (universal in mind, singular in instance).
  *   **What Would the Passage Need to Engage It?** Aristotle would need to:
      *   Explicitly discuss the essence/nature *apart* from its instantiation or mental consideration.
      *   Distinguish between the nature *as real component* and the nature *as universal predicate*.
      *   Consider whether *this* neutral nature could be substance.
      *   Address how individuation works.
      *   He does none of this. The argument relentlessly treats the universal *as* common and predicable.
  *   **Does the Argument Retain Force if we Grant the Distinction?** **Yes, significantly.** Even granting a neutral nature:
      1.  **The Core Dilemma Remains:** *Of what* would this neutral nature (say, "humanity-in-itself") be the substance? If it's the substance of *all* humans, monism. If of *one* (itself?), then other humans lack it as substance. If of *nothing*, it's not substance.
      2.  **The Predication Problem Remains:** Could this neutral nature be predicated? If *yes* (e.g., "Socrates *is* [an instance of] humanity"), then it fails the non-predicability criterion. If *no*, it's unclear how it relates to individuals at all.
      3.  **The Composition/Socrates Problems:** If the individual substance is composed *of* this neutral nature plus individuator, is the *nature-component* a substance? If yes, the Socrates argument applies. If no, then we are composing substance from non-substances (the nature and the individuator), raising the priority issue from Step 8. Aristotle's arguments target the *status* of the common essence *as a candidate for being substance*, regardless of whether we call it "universal" or "neutral nature." The challenge of being fundamental, unique, and non-predicable remains.

  ---

  ### **7. The Translation of "Logos" as "Formula"**
  *   **Impact of "Formula":** "Formula" can sound overly technical or mathematical, potentially obscuring the semantic and definitional aspects. It might downplay the connection to *saying what something is*.
  *   **Reading with "Account" or "Definition":**
      *   "...clearly there is in some sense a **definition/account** of the universal." (Makes sense: We define universals like "man".)
      *   "...for neither in **definition/account** nor in time nor in generation can the affections of substance be prior to the substance..." (Much clearer: You cannot *define* an affection/quality without reference to the substance it belongs to. E.g., you define "pale" as "pale *thing*".)
  *   **How it Helps:** Using "account" or "definition" makes Aristotle's point about **conceptual/logical priority** much more transparent. The argument that affections cannot be prior "in formula/logos" is central to Step 8 and is primarily about the *order of understanding and explanation*, not a physical recipe ("formula"). It emphasizes that substance is the primary subject in *any* statement about what a thing is or what properties it has. "Account" or "definition" captures this linguistic/conceptual dimension better than "formula." The passage's difficulty on this point is partly the translator's; "account" or "definition" aligns better with Aristotle's typical usage of *logos* in these contexts.

  ---
  **Key Seminar Takeaway for Students:** Aristotle's argument against universals being substances hinges on the *incompatibility* between the core features of substance (particularity, uniqueness, subjecthood, non-predicability) and the core features of universals (commonality, repeatability, predicability). The *Metaphysics* VII passage refines the *Categories* view by stripping secondary substances of their title precisely *because* they are universals. The argument targets the *concept* of a universal *as such*, attempting to show its inability to fulfill the role of fundamental reality, regardless of immanence, transcendence, or later scholastic distinctions. The challenge is to see the *force* of these definitional tensions driving the metaphysical conclusions.
