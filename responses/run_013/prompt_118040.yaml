prompt: |-
  I keep getting into arguments about what counts as art and I've realized I don't actually know what I want a defintion of art to do, so I keep shifting the goalposts halfway through. Before I read any more of them, give me the spec instead: what does any account of art have to get right? List the requirements, with the case behind each -- the urinal in the gallery versus its identical twin in the plumbing shop, the forger's painting before and after the experts catch him (art, then suddenly not?), the child's drawing and the trained artist's lookalike, the elephant that paints, the piano piece where nothing gets played, the novel in a drawer nobody ever reads, the pot that sat unrecognized in the ground for three thousand years, the piece that's only a set of instructions, the craftsperson who'd deny making art at all, and things from cultures with no word for art. For each, say why it's a real requirement and not just a prejudice of one camp, and mark which ones are non-negotiable against the ones that are mere preferences. Then tell me which requirements can't all be satisfied at once -- if the list turns out to be inconsistent, that's the part I most want to see. Don't bother scoring the famous theories against it, I can do that myself. British English please. End with a final line \answer{...} naming the single requirement you think does the most to rule candidates out.
reasoning: |-
  Okay, let me tackle this user's request systematically. They're frustrated with circular art definition arguments and want a "spec" - essentially core requirements any art theory must address, based on key problem cases. 

  First, I need to unpack their examples. Each represents a definitional challenge: Duchamp's urinal questions intentionality, forgeries test authenticity, child/elephant creations probe authorship, 4'33" challenges materiality. The archaeological pot examines temporal recognition, Fluxus highlights process over object, craft denial involves cultural framing, and non-Western examples demand cross-cultural validity. 

  The user's deeper need seems to be cutting through partisan debates to find definitional bedrock. They want requirements sorted by necessity versus preference, plus any inherent contradictions. I should resist evaluating existing theories as requested, but flag where requirements conflict - like how institutional acceptance (urinal case) clashes with non-recognition cases (buried pot).

  Non-negotiables emerge: intentionality (even in readymades), expressive content (present even in silence), and cultural context (vital for non-Western objects). More flexible aspects include skill level and physical permanence. The biggest tension lies between requiring audience reception (problematic for unread novels) versus creator intention alone.

  For the final answer, I'm considering "intentional expressive action" as the strongest filter - it excludes accidental objects and pure utility while accommodating everything from cave paintings to conceptual art. This covers the urinal (intentionally positioned) but not its identical plumbing sibling, and explains why forgeries lose art-status upon exposure (original intent matters).
answer: |-
  Here's a specification for any account of art, derived from your test cases. Requirements are categorised as **Non-Negotiable** (NN) or **Negotiable Preference** (NP), with the reasoning and case behind each:

  1.  **Intentional Creation/Selection for Contemplation (NN):**
      *   **Case:** The urinal in the gallery vs. its identical twin in the plumbing shop.
      *   **Requirement:** The account must distinguish between an ordinary object and that *same* object presented as art. The crucial difference lies in the *intentional act* of an agent (artist, curator, institution) selecting, presenting, or framing it *specifically* to be engaged with as art – for aesthetic consideration, meaning, or challenge. The plumbing shop urinal lacks this framing intent.
      *   **Why it's real, not prejudice:** Rejecting this reduces art to mere physicality, ignoring the fundamental role of human agency and purpose in creating the *category* of art. It explains the urinal without resorting to intrinsic properties.

  2.  **Expressive/Communicative Content or Potential (NN):**
      *   **Cases:** The novel in an unread drawer; the piano piece where nothing gets played (4'33"); the piece that's only a set of instructions (Fluxus scores); the unrecognised ancient pot; the child's drawing; the elephant painting; the craftsperson denying art status.
      *   **Requirement:** The account must accommodate works that convey meaning, feeling, ideas, or formal qualities *even if* unperceived, unread, unrecognised, or created by non-humans or those disavowing the label. It must explain *how* the silent piece, the unread novel, or the ancient pot *possess* this potential content – structured by form, context, or intention – regardless of audience reception.
      *   **Why it's real, not prejudice:** Art is fundamentally a communicative/expressive act. Denying this potential reduces it to mere decoration or utility. It avoids defining art solely by its effects (which might not occur) or creator's label (which can be contested or absent).

  3.  **Cultural/Historical Contextualisation (NN):**
      *   **Cases:** Things from cultures with no word for art; the unrecognised ancient pot; the craftsperson denying art status; the urinal; the forger.
      *   **Requirement:** The account must recognise that what counts as art, and the meaning/function of specific artefacts, is deeply embedded in and relative to specific cultural practices, historical periods, and frameworks of understanding. An object might be 'art' in one context (gallery, later archaeology) but not another (original functional use, craft tradition).
      *   **Why it's real, not prejudice:** Ignoring context leads to ethnocentrism (imposing Western definitions) and historical anachronism (judging past objects by modern standards). It's necessary to explain cultural artefacts and the pot's shift in status.

  4.  **Authenticity/Origin Matters (NN):**
      *   **Case:** The forger's painting before and after discovery.
      *   **Requirement:** The account must recognise that the *origin* and *history of creation* (who made it, under what circumstances, with what intent) are constitutive of an artwork's identity and value *as art*. A perfect forgery, once known, loses its status *as that specific artwork* (though it might become art *about* forgery).
      *   **Why it's real, not prejudice:** Art is irreducibly historical and intentional. Denying the importance of origin collapses the distinction between an original expression and a deceptive copy, undermining core artistic values like authorship and authenticity.

  5.  **Human Agency (Often, But Not Exclusively) (NP):**
      *   **Cases:** The child's drawing; the trained artist's lookalike; the elephant that paints; the craftsperson.
      *   **Requirement:** While human agency is overwhelmingly central, the account shouldn't *necessarily* exclude the possibility of non-human creations exhibiting sufficient complexity, intentionality (if attributed to the animal/training), or contextual framing to warrant consideration *as art* within a specific framework. The child's drawing relies on developing human agency.
      *   **Why it's preference:** Insisting on *only* human agency might be anthropocentric, but relaxing it too far risks diluting the concept. The elephant case highlights the tension; most accounts will strongly favour human agency but might allow for borderline cases under specific institutional/critical acceptance.

  6.  **Skill/Technique Not Defining (NP):**
      *   **Cases:** The child's drawing vs. the trained artist's lookalike; the urinal; the silent piece; the instruction piece.
      *   **Requirement:** While often present and valued, technical skill or mastery of craft cannot be a *necessary* condition. Art can emerge from conceptual innovation, found objects, intentional simplicity, or untrained expression.
      *   **Why it's preference:** Elevating skill to necessity excludes vast swathes of accepted modern and contemporary art (Duchamp, Outsider Art, conceptual work) and risks valorising mere craftsmanship over expressive or conceptual content.

  7.  **Audience Reception Not Defining (NP):**
      *   **Cases:** The unread novel; the unrecognised ancient pot; the silent piece (in a disengaged audience).
      *   **Requirement:** While art typically *aims* for reception and meaning-making, its status as art cannot *depend* on being actually perceived, understood, or valued by an audience. An artwork can exist in potentia.
      *   **Why it's preference:** Making reception necessary renders status ephemeral and subjective, making the unread novel or the undiscovered pot non-art until found/appreciated, which seems counterintuitive to their creation *as* expressive artefacts.

  8.  **Physical Object Not Required (NP):**
      *   **Cases:** The silent piece; the novel (as text); the instruction piece; performance art.
      *   **Requirement:** The account must accommodate non-object-based or ephemeral art forms (music, performance, conceptual art, literature).
      *   **Why it's preference:** While historically dominant, insisting on a unique physical artefact excludes major art forms central to contemporary practice and historical traditions (like oral poetry or performance rituals).

  **Key Tensions and Inconsistencies:**

  *   **Authenticity vs. Pure Form/Appearance (Forgery):** Requirement 4 (Authenticity) clashes directly with any definition relying *only* on perceivable formal properties. The forgery proves identical appearance isn't sufficient.
  *   **Intentional Framing vs. Unrecognised Objects (Pot):** Requirement 1 (Intentional Framing) seems challenged by the ancient pot. Was it *intended* as art in its time? Requirement 3 (Context) resolves this by showing the framing intent can come *later* from a different culture/context. The pot *became* art through re-contextualisation.
  *   **Expressive Potential vs. Complete Lack of Reception:** Requirement 2 (Expressive Potential) tries to bridge the gap for the unread novel. It *has* the potential by virtue of its structure and intent, even if unrealised. But this relies on the *possibility* of reception, which Requirement 7 rightly insists shouldn't be *necessary* for status. There's a tension between potential and actualisation, but Requirement 2 prioritises the inherent properties enabling potential.
  *   **Human Agency vs. Non-Human Creation (Elephant):** Requirement 5 highlights the strain. Requirement 1 (Intentional Framing) often pulls towards human agency (who framed the elephant's painting?), while Requirement 2 (Expressive Content) *might* allow the painting itself to possess expressive qualities, raising questions about authorship and intention's necessity.
  *   **Institutional Acceptance vs. Craft Denial/Cultural Absence:** While not listed as a separate requirement, institutional theories face tension with the craftsperson denying art status and cultures lacking the concept. Requirement 3 (Context) is crucial here: the craft object might function as 'art' *within the gallery context* despite the maker's view, while also functioning as craft *within its original context*. It highlights that status is context-dependent, not absolute.

  **The Most Rule-Out Requirement:**

  While all Non-Negotiables are crucial filters, the requirement that arguably does the most work in excluding candidates is **Intentional Creation/Selection for Contemplation (NN)**. It immediately rules out natural objects (a beautiful sunset), purely functional objects lacking that framing intent (the plumbing shop urinal), and random marks/accidents not purposefully presented. It forces the question: "Was this thing deliberately positioned within a sphere of aesthetic/reflective engagement?" This is the first and most powerful gatekeeper.

  \answer{Intentional Creation/Selection for Contemplation}
