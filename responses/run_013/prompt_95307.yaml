  ### Decision Tree for Zeno's Paradoxes Analysis  
  **Aim**: Sort students by how their answer interacts with Zeno's argument (e.g., Dichotomy or Arrow paradox), focusing on logical structure rather than named solutions.  
  **First Branch**: How does the student engage with the argument?  
  - **A. Deny a premise** (reject one of Zeno's assumptions)  
  - **B. Deny that the premises entail the conclusion** (accept premises but reject logical inference)  
  - **C. Accept the conclusion** (motion is impossible/illusory)  
  - **D. Say the paradox isn’t really about motion** (shift focus to deeper issues)  

  ---

  #### **A. Deny a premise**  
  *Which premise is denied?*  
  - **A1. Deny infinite divisibility** (a finite stretch *cannot* be divided without end)  
    - *Continuum view*: Discrete chunks (space/time quantised)  
      - **Leaf: Quantised spacetime**  
        - *Awkward commitment*: Explaining apparent continuity of motion.  
  - **A2. Deny completability** (infinitely many parts *cannot* all be gone through)  
    - *Continuum view*: Merely potential (divisions not actualised)  
      - **Leaf: Aristotelian potential infinite**  
        - *Awkward commitment*: Justifying "potential" vs. "actual" divisions.  
    - *Continuum view*: Built from points/gunky/discrete → *Unattractive/unexplored* (Denying completability while accepting actual points leads to motion’s impossibility; incoherent with discrete chunks).  
  - **A3. Deny point location** (a thing in motion is *not* somewhere at each instant)  
    - *Continuum view*: Gunky (no points, only extended regions)  
      - **Leaf: Gunky spacetime**  
        - *Awkward commitment*: Accounting for precise locations in measurement.  
    - *Continuum view*: Built from points/discrete → *Incoherent* (Cannot deny point-location if points exist).  
  - **A4. Deny next instant** (there is *no* "next instant" in time)  
    - *Continuum view*: Gunky/potential → *Unexplored* (Rarely addressed; gunky view under A3 covers similar ground).  
    - *Continuum view*: Built from points/discrete → *Incoherent* (Discrete time requires "next" instants; points imply instants).  

  ---

  #### **B. Deny that the premises entail the conclusion**  
  *How is the inference blocked?*  
  - **B1. Super tasks possible** (infinitely many parts *can* be completed via limits/sums)  
    - **Leaf: Supertask-permissive**  
      - *Awkward commitment*: Defending actual infinities in physical processes.  
  - **B2. Motion defined relationally** (premises don’t imply rest at instants)  
    - **Leaf: Motion as being at different places at different times** (the "at-at" theory)  
      - *Awkward commitment*: Explaining velocity without intrinsic motion.  

  ---

  #### **C. Accept the conclusion**  
  - **Leaf: Motion is an illusion**  
    - *Awkward commitment*: Accounting for universal perceptual error.  

  ---

  #### **D. Paradox isn’t really about motion**  
  *What is it about instead?*  
  - **D1. Self-referential contradictions**  
    - **Leaf: True contradictions (like the liar paradox)**  
      - *Awkward commitment*: Accepting dialetheism (true contradictions).  
  - **D2. Conceptual/linguistic confusion**  
    - **Leaf: Unnamed (e.g., Wittgensteinian language-game error)**  
      - *Awkward commitment*: Reducing paradox to "misuse" without resolving metaphysics.  

  ---

  ### Summary of Leaves (10 Positions)  
  1. **Quantised spacetime** (A1)  
  2. **Aristotelian potential infinite** (A2)  
  3. **Gunky spacetime** (A3)  
  4. **Unnamed (process view)** (A4; unexplored)  
  5. **Supertask-permissive** (B1)  
  6. **Motion as different places at different times** (B2)  
  7. **Motion is an illusion** (C)  
  8. **True contradictions** (D1)  
  9. **Unnamed (language-game error)** (D2)  
  10. **Unnamed (idealism)** (D2 variant; e.g., motion is mental)  
     - *Awkward commitment*: Reconciling physics with non-spatiotemporal reality.  

  ---

  ### Notes  
  - **Indistinguishable pairs**:  
    - **Gunky spacetime** (A3) and **Unnamed process view** (A4) may overlap if "no instants" implies gunky time. Questions about instantaneity vs. extension may not separate them cleanly.  
  - **Unoccupied combinations**:  
    - **Discrete chunks + Gunky** (A1 + A3): *Incoherent* (atomism vs. infinite divisibility).  
    - **Built from points + Deny completability** (A2): *Unattractive* (forces motion’s denial; see C).  
    - **Discrete chunks + Deny next instant** (A1 + A4): *Incoherent* (discrete time requires "next" instants).  
    - **Potential infinite + Gunky** (A2 + A3): *Unexplored* (few defend both potential divisibility and gunky ontology).  

  **British English Note**: "Spacetime" (not "space-time"), "defence" (not "defense"), "reconciling" (not "reconciling").
