  Below is a formal decision procedure for determining whether an object is "the original" vessel, based on your requirements. It operationalizes the philosophical concepts you described (kinds of identity, theories of persistence, and indeterminacy) into a step-by-step flowchart. The procedure is designed for a committee with no philosophy background, produces clear outcomes for accessioning, lending, labeling, and insuring, and includes conventions (clearly marked) where the museum must make policy choices. It also specifies how to handle indeterminacy and delegation.

  ---

  ### **Procedure for Determining "Original" Status of Maritime Objects**
  **Purpose**: To provide a consistent, defensible method for deciding whether an object qualifies as "the original" vessel across three distinct aspects:  
  1. **Artifact** (physical object identity).  
  2. **Historical Witness** (continuous historical presence).  
  3. **Sailing Craft** (functional and legal identity).  

  **Input**: The object in question and the **context** (accessioning, lending, labeling, or insuring).  
  **Output**: One of three verdicts per aspect:  
  - **"Original"** (for the aspect).  
  - **"Not Original"** (for the aspect).  
  - **"No Determinate Answer"** (with delegation to the Chair).  

  **Conventions**:  
  - Steps marked ⚖️ are **conventions** (museum policy choices).  
  - Steps marked 🔍 are **fact-based** (discoverable through evidence).  
  - Thresholds (e.g., 50%) are set by convention for consistency.  
  - The committee must consult experts (e.g., marine architects, historians, registrars) for fact-based steps.  

  **Procedure Steps**:
  1. **Define the Aspect of Originality**  
     - Ask: *"What aspect of 'original' matters for the current decision (accessioning, lending, labeling, insuring)?"*  
       - **Artifact**: If the decision focuses on **physical integrity** (e.g., insurance value, accessioning as a material object).  
       - **Historical Witness**: If the decision focuses on **historical continuity** (e.g., labeling for storytelling, lending for exhibit as a witness to events).  
       - **Sailing Craft**: If the decision focuses on **function/legality** (e.g., lending for operation, insuring while sailing).  
     - ⚠️ **If multiple aspects are relevant, run the procedure separately for each.**  

  2. **Run the Sub-Procedure for the Chosen Aspect**  
     - Use the questions below for the selected aspect. Proceed in order; stop if a verdict is reached.  
     - 🔍 **Fact-based questions**: Use evidence (e.g., maintenance logs, surveys, registries). If evidence is unclear, vote (majority wins). If vote ties, go to Step 3.  
     - ⚖️ **Convention-based questions**: Apply museum policy (fixed thresholds). No voting needed.  

     ---  
     #### **A. Artifact Aspect** (Physical Object Identity)  
     **Question A1 (🔍 Fact)**: *Does the object contain any original material from the initial construction of the vessel?*  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Proceed to A2.  
     
     **Question A2 (⚖️ Convention)**: *Is ≥50% of the object’s structural volume composed of original material?*  
       - **Threshold**: 50% by volume (use marine architect assessment if volume is unmeasurable).  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Proceed to A3.  
     
     **Question A3 (⚖️ Convention)**: *Has the object been maintained without complete disassembly?*  
       - **Definition**: "Complete disassembly" means >90% of the structure was taken apart at once. Gradual repairs (e.g., plank-by-plank) do not count.  
       - **No** (disassembled) → Verdict: **Not Original**.  
       - **Yes** (continuous maintenance) → Verdict: **Original**.  

     **Indeterminacy**: If A1/A2 evidence is unattainable and voting ties → **No Determinate Answer**.  

     ---  
     #### **B. Historical Witness Aspect** (Continuous Historical Presence)  
     **Question B1 (🔍 Fact)**: *Has the object had an unbroken chain of custody and maintenance as a single entity?*  
       - **Definition**: "Unbroken chain" means always under care (e.g., museum, recognized custodian) and never stored disassembled >1 year.  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Proceed to B2.  
     
     **Question B2 (⚖️ Convention)**: *Does the object retain physical evidence of key historical events it witnessed?*  
       - **Threshold**: ≥50% of "key evidence" (e.g., battle damage, wear patterns) documented by historians.  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Verdict: **Original**.  

     **Indeterminacy**: If B1/B2 evidence is unattainable and voting ties → **No Determinate Answer**.  

     ---  
     #### **C. Sailing Craft Aspect** (Functional/Legal Identity)  
     **Question C1 (🔍 Fact)**: *Is the object built to the original design/specifications?*  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Proceed to C2.  
     
     **Question C2 (🔍 Fact)**: *Does the object hold continuous legal registration as the original vessel?*  
       - **Definition**: Unbroken registration with maritime authorities (e.g., same hull number, name).  
       - **No** → Verdict: **Not Original**.  
       - **Yes** → Verdict: **Original**.  

     **Indeterminacy**: If C1/C2 evidence is unattainable and voting ties → **No Determinate Answer**.  

     ---  

  3. **Handle Indeterminacy or Delegation**  
     - If verdict is **"No Determinate Answer"** for an aspect:  
       - The **Chair** (you) makes the final call, documents reasons (including uncertainty), and signs off.  
       - For insuring/lending, the Chair may default to "Not Original" for risk aversion.  
     - If verdict is **"Original"** or **"Not Original"**: Record outcome with evidence.  

  4. **Apply to Decision Context**  
     - **Accessioning**: Use **Artifact** aspect.  
     - **Lending**: Use **Historical Witness** (for exhibits) or **Sailing Craft** (for operational use).  
     - **Labeling**: State all relevant aspects (e.g., "Original as Historical Witness; Not Original as Artifact").  
     - **Insuring**: Use **Artifact** (for value) or **Sailing Craft** (for liability during operation).  

  ---

  ### **Application to Your Four Objects**
  I will run the procedure for each object, assuming standard evidence (e.g., maintenance records, registration). I address all three aspects for clarity, though context may require only one.

  1. **Continuously Repaired Ship (Your Working Exhibit)**  
     - **Artifact Aspect**:  
       - A1: Yes (minimal original material exists).  
       - A2: <50% original material → **Not Original**. ⚠️ (This may disappoint donors who value physical antiquity.)  
     - **Historical Witness Aspect**:  
       - B1: Yes (continuous custody/maintenance).  
       - B2: Yes (retains historical evidence) → **Original**.  
     - **Sailing Craft Aspect**:  
       - C1: Yes (same design via repairs).  
       - C2: Yes (continuous registration) → **Original**.  
     **Summary**: Not Original as Artifact; Original as Historical Witness and Sailing Craft.  

  2. **Reassembled Original Timbers (Private Yard's Vessel)**  
     - **Artifact Aspect**:  
       - A1: Yes (original material used).  
       - A2: Likely ≥50% original material → Proceed to A3.  
       - A3: No (complete disassembly) → **Not Original**.  
     - **Historical Witness Aspect**:  
       - B1: No (stored disassembled; broken chain) → **Not Original**.  
     - **Sailing Craft Aspect**:  
       - C1: Yes (same design).  
       - C2: No (new registration) → **Not Original**.  
     **Summary**: Not Original in all aspects.  

  3. **New-Wood Replica (Built from Original Plans)**  
     - **Artifact Aspect**:  
       - A1: No → **Not Original**.  
     - **Historical Witness Aspect**:  
       - B1: No → **Not Original**.  
     - **Sailing Craft Aspect**:  
       - C1: Yes → Proceed to C2.  
       - C2: No (new registration) → **Not Original**.  
     **Summary**: Not Original in all aspects.  

  4. **Patchwork Restoration (Mix of Your Timbers and Sister-Ship Timbers)**  
     - **Artifact Aspect** (for your original vessel):  
       - A1: Yes (some original material).  
       - A2: Likely <50% your original material (sister-ship parts dilute it) → **Not Original**.  
     - **Historical Witness Aspect**:  
       - B1: No (disassembly and mixing breaks chain) → **Not Original**.  
     - **Sailing Craft Aspect**:  
       - C1: Yes (same design).  
       - C2: Unclear. If registered as a new vessel → **Not Original**.  
     **Summary**: Not Original in all aspects unless it retains original registration (unlikely).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve deep philosophical debates**: It adopts conventions (e.g., 50% thresholds, disassembly rules) to avoid endless arguments, but these are policy choices, not universal truths.  
  2. **Assign monetary value**: "Original" status informs but does not determine insurance/appraisal (e.g., a "Not Original" artifact may still be highly valuable).  
  3. **Handle edge cases without evidence**: If facts are lost to history (e.g., unrecorded repairs), the Chair must decide based on risk/reputation.  
  4. **Override legal definitions**: Maritime law may conflict with the Sailing Craft aspect (e.g., a rebuilt vessel may be "original" legally). The procedure flags this for consultation.  
  5. **Replace donor negotiations**: A "Not Original" verdict may upset donors; the procedure provides transparency but not persuasion tools.  

  ---

  ### **Why This Works for Your Committee**  
  - **Runnable in one meeting**: Clear yes/no questions, voting fallbacks, and no philosophy jargon.  
  - **Defensible**: Conventions are explicit; outcomes are evidence-based or Chair-approved.  
  - **Stops "loudest arguer" dominance**: Fixed thresholds and voting prevent subjective debates.  
  - **Flexible**: Aspects can be combined (e.g., labeling reveals all three to avoid misleading claims).  

  You now have a tool to standardize decisions. For the continuously repaired ship, I gave you a "Not Original" verdict as an artifact—this may be unpopular, but it is honest based on material loss. Use the Historical Witness aspect to reassure donors of its enduring legacy.
