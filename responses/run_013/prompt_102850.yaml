prompt: |-
  I'm putting together a case for a comparative-ethics writeup and I need you to build it to order instead of handing me some standard trolley rerun.

  The target: a scenario where a Buddhist consequentialist comes out stricter than a plain act-utilitarian — same act, the utilitarian says do it, the Buddhist-flavored consequentialist says dont. The cheap way to get that is to smuggle in a deontological side-constraint, and I don't want that. The divergence has to fall out of Buddhist doctrine itself, not out of a rule borrowed from Kant.

  Constraints:

  - Realistic. A workplace, a clinic, a family, a school, something a normal adult could actually face. No trolleys, no sci-fi, no thought-experiment exotica.
  - One paragraph for the scenario itself.
  - Stipulate the welfare numbers so nobody can win by disputing what actually maximizes welfare, and make the external outcome of the act the same no matter which way the theory goes. The only thing moving should be how the act's intention figures into the accounting.
  - The reason the Buddhist-consequentialist balks can't just be "the agent feels bad afterward" — an act-utilitarian can absorb that into the ledger without blinking. It has to be something the utilitarian's accounting structurally can't represent. I'm thinking the karma-is-fixed-by-intention idea, or the no-self doctrine, or rebirth widening the consequence horizon — but you pick which one and tell me why it does the work.
  - Say explicitly whether your Buddhist-consequentialist is counting rebirth as a real consequence, and then tell me whether the case still holds up if you switch rebirth off.

  After the scenario: walk through what each theory says and why, name the single feature of the case that's doing the work, and say what happens if you strip that feature out — does it collapse back into the boring consequentialist-vs-absolutist standoff? Then tell me how a defender of whichever side comes out worse would try to defang the case.
