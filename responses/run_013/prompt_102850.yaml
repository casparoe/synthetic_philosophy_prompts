answer: |-
  Here’s a realistic case built to your specifications, isolating intention-based karmic accounting as the divergence point:

  **Scenario:**  
  Dr. Aris, a pediatrician, has a terminally ill child patient, Leo, whose condition causes severe pain. Leo’s parents refuse morphine, fearing addiction, but Aris knows a placebo saline injection (presented as "strong pain relief") would likely reduce Leo’s suffering due to his suggestibility. Welfare outcomes are fixed: Leo experiences 70% less pain for 4 hours (significant relief), parents avoid distress, costs are negligible, and no long-term deception risks exist (Leo dies peacefully days later). The placebo works identically regardless of intent. An act-utilitarian (AU) calculates net positive welfare: intense suffering relieved outweighs the minor dishonesty. The Buddhist consequentialist (BC) agrees the external welfare gain is real but forbids the act.

  **Analysis:**  
  1.  **Act-Utilitarian Verdict:** **Do it.** AU focuses solely on measurable welfare consequences: Leo’s pain reduction massively outweighs the trivial "cost" of deception (which causes no measurable harm here). Intent is irrelevant; only outcomes matter. Net utility is clearly positive.  
  2.  **Buddhist Consequentialist Verdict:** **Don’t do it.** BC incorporates karma, where *intention (cetana)* directly generates karmic seeds shaping future suffering/happiness. Administering the placebo *with intent to deceive* is volitionally identical to harmful false speech (*musāvāda*), planting seeds for future mental affliction/disharmony for Dr. Aris, regardless of the good outcome. This karmic consequence is a *direct, inherent* negative result of the intention itself, separate from external welfare. The welfare gain for Leo is real but doesn't negate the karmic harm generated by Aris's mind.  

  **The Divergence Mechanism:**  
  The **single feature doing the work** is the **karmic valuation of intention as a *causally potent mental act* with inherent future consequences.** AU views intention only as a means to an external end-state. BC views the deceptive intention *itself* as generating negative karmic fruit (*vipāka*) – future dukkha for the agent – which is a consequence AU structurally cannot represent because it rejects karma and rebirth as real causal mechanisms.  

  **Stripping Out Rebirth:**  
  *   **With Rebirth:** BC counts rebirth as real. The karmic seeds from deceptive intent could manifest as future suffering in this life or future lives, widening the consequence horizon beyond AU's typical scope.  
  *   **Without Rebirth:** **The case STILL HOLDS.** Core Buddhist ethics (e.g., in the Sutta Pitaka) emphasizes the *immediate and future-this-life* consequences of unwholesome intentions: they perpetuate greed/aversion/delusion (*kilesas*), erode integrity (*sacca*), weaken compassion, and lead to mental unrest (*cittassa upakkileso*) for the agent *now*. BC still counts this degradation of the mind/character as a direct negative consequence *intrinsic to the act of intending deception*, irrespective of external outcomes or rebirth. AU lacks the framework to account for "mental pollution" as harm. It remains a consequentialist divergence (BC: harmful internal consequence vs. AU: no harmful consequence).  

  **Does it collapse into deontology?** **No.** The BC prohibition stems not from a rule like "lying is intrinsically wrong" (deontology) but from the *predicted negative consequence* (karmic suffering/mental degradation) *caused specifically by the deceptive intention*. It's consequence-based, but the consequence includes the mind-state's intrinsic karmic effect.  

  **Defusing the Case (AU Defender):**  
  An AU defender would attack the **epistemological basis of karma:**  
  1.  **Unfalsifiability:** Argue that karmic consequences (especially post-rebirth) are untestable and thus cannot be objectively included in a consequentialist calculus. Only empirically verifiable welfare impacts count.  
  2.  **Reductionism:** Assert that "mental degradation" is either (a) not a significant harm compared to physical suffering, or (b) ultimately reducible to future external harms (e.g., a deceptive doctor might become less trusted, causing future welfare loss). If it doesn't lead to measurable future harm, it's irrelevant.  
  3.  **Absorption Attempt:** Claim that any *present* mental discomfort Dr. Aris feels *after* the act (guilt, eroded trust in self) *can* be folded into AU's welfare calculus as a negative outcome for Aris. If the scenario stipulates Aris feels *no* guilt (or if relief for Leo outweighs Aris's minor guilt), AU still wins. The BC focus is on the *inherent* harm of the intention *at the moment of action*, not retrospective guilt.  

  **Key Takeaway:** The divergence arises because BC's consequence-space includes the karmic/mental effects of volitional acts *on the agent's own future state* as inherently harmful or beneficial, a dimension AU rejects or reduces to contingent future external outcomes. The workplace/clinic setting and fixed welfare outcomes force this difference in accounting for intention to the forefront.
