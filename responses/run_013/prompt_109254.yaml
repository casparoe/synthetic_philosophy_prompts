prompt: |-
  I'm the ethics-and-safety lead on the team building an autonomous escalation module for our hospital's intensive care unit: it watches vitals and, within limits, acts on its own (paging the rapid response team, locking a bed to a patient) and recommends things it can't do alone (moving someone out of a bed to free it up, putting a patient on a palliative-only pathway). These calls come up several times a day, a consultant signs off anything irreversible, and I get about twenty minutes to defend each one in front of the ethics committee, which is why I need a procedure and not an essay. Act as a philosopher who has also shipped software: think it through properly before you write, and start by saying what our two-part test actually commits us to before you try to operationalise it.

  The test the committee adopted: (1) the rule has to be one that no one who might end up on the receiving end could reasonably reject, given they dont know which position they'll be in; and (2) a foreseeable harm to a particular person must never be the mechanism by which the good is acheived — it can be a side effect, but it cant be the means. Give me the procedure in order: the questions to ask, what counts as a sufficient answer to each, where it stops with a no, and where it has to go to a human because it's a values call rather than a fact. Then run it on three cases: moving a stable patient out of ICU to free a bed for a sicker arrival; a mass-casualty situation where the module withholds a bed from one patient precisely because another needs it; and a rule that quietly deprioritises everyone with a particular comorbidity, which nobody on my team thinks is unfair. Say which of the two conditions is doing the real work in each case, what happens when they pull apart, where the procedure will misfire, and which of my steps are just judgement dressed up as engineering. Finally: when the committee overrides the procedure, what should the log say — I want the spec to force overrides to be recorded with a reason rather than quietly disappeared. British English, please.
reasoning: |-
  Okay, the user is the ethics-and-safety lead for an autonomous escalation module in a hospital ICU. They need a clear procedure based on a two-part ethical test adopted by their committee. The test has two conditions: (1) the rule must be one that no one could reasonably reject without knowing their position, and (2) foreseeable harm to a person can't be the mechanism for achieving good—only a side effect. 

  First, I need to unpack what these conditions mean. The first is inspired by Scanlon's contractualism, focusing on impartiality and universal acceptability. The second is a strict deontological constraint against instrumentalizing harm. The user wants a step-by-step procedure, not an essay, since they only have twenty minutes per case in committee meetings. They also want to apply this to three specific cases and identify which condition is key in each.

  The user's explicit needs are a procedural checklist, analysis of three cases, and logging specifications for overrides. But deeper, they might need to ensure the system's decisions are defensible under scrutiny, prevent ethical corners from being cut in urgent situations, and maintain transparency—especially when overrides happen. They might also be grappling with team biases, like the comorbidity deprioritization rule that "nobody thinks is unfair," hinting at potential blind spots.

  For the procedure, I'll structure it as a flowchart-friendly checklist with clear yes/no gates. Each step must specify what counts as sufficient evidence, where it stops, and when it requires human judgment. The cases will test how the two conditions interact: in bed reallocation, condition 1 handles fair allocation while condition 2 prevents active harm; in mass casualty, condition 2 blocks instrumental harm; in comorbidity, condition 1 exposes reasonable rejections despite seeming efficiency. 

  When conditions pull apart—e.g., a rule that's impartially fair (condition 1) but uses someone as a means (condition 2)—the procedure must flag it as invalid. I'll note where "judgment dressed as engineering" creeps in, like assessing "reasonable rejection" or "foreseeability," which involve subjective thresholds. 

  For logging overrides, the spec must force explicit reasons tied to the ethical framework, not vague notes. British English phrasing like "grounds for rejection" and "mechanism of harm" will keep it locale-appropriate. Finally, I'll emphasize that condition 2 is the stricter gate—it's binary and non-negotiable, while condition 1 allows more debate.
answer: |-
  Here's a procedural implementation of your two-part test, designed for clarity and auditability, followed by analysis of your three cases. British English maintained throughout.

  **The Two-Part Test Commitment:**
  1.  **Contractualist Impartiality (Reasonable Rejection):** We commit that any rule governing autonomous action must be justifiable to *every* potential patient affected, assuming they are rational, care about their own wellbeing, but do not know their specific future medical status or role (e.g., current ICU occupant, new arrival, specific comorbidity). A rule is invalid if *any* individual, placed impartially behind this "veil of ignorance," could reasonably reject it as imposing an unacceptable burden *on them* compared to alternative feasible rules.
  2.  **Deontological Constraint (Mechanism of Harm):** We commit that the system cannot operate by *intentionally* causing a foreseeable, direct harm to a specific, identifiable patient as the *necessary means* to achieve a greater good or benefit for others. Harm as a known *side-effect* of a rule primarily aimed at a legitimate goal *may* be permissible (subject to proportionality and necessity), but harm as the *instrumental mechanism* is absolutely prohibited.

  **Operational Procedure: Evaluating a Proposed Autonomous Rule (AR)**

  *   **Input:** Proposed Rule Description (PRD), including Trigger Conditions, Autonomous Actions, Recommended Actions, and Intended Outcomes.
  *   **Output:** `Approved`, `Rejected`, or `Requires Human Oversight (RHO)` with specific reasoning logged.

  1.  **Identify Potential Harm:** Does executing this rule foreseeably risk causing direct, significant harm (physical, psychological, dignity) to any specific patient(s)?
      *   *Sufficient "No":* Rule demonstrably only improves care or maintains status quo for all directly affected patients. Proceed to Step 3.
      *   *Sufficient "Yes":* Clearly identify the *type* of harm and the *specific patient group(s)* at risk. Proceed to Step 2.
      *   *Ambiguous/Contested:* `RHO`. Requires human judgment on foreseeability and significance of harm (e.g., is "frustration" significant harm? Is "slightly delayed non-critical med" harm?).

  2.  **Test Mechanism of Harm (Condition 2):** Is the identified harm the *necessary mechanism* by which the rule achieves its primary intended good/outcome? (Ask: *Could the rule work if this specific harm did NOT occur to this specific patient?*)
      *   *Sufficient "No" (Harm is Side-Effect):* The primary good is achieved independently; the harm occurs incidentally. (Example: Giving a life-saving drug that causes nausea). Proceed to Step 3 (but note harm for final balancing).
      *   *Sufficient "Yes" (Harm is Means):* The rule *requires* harming Patient A specifically *in order to* benefit Patient B/the system. (Example: Withholding treatment from A *so that* B gets the bed/resources). **STOP: `REJECTED` (Violates Condition 2)**. Log specific harm identified and its role as mechanism.
      *   *Ambiguous/Contested:* `RHO`. Requires human judgment on causal necessity and intent within the rule's logic.

  3.  **Identify Affected Positions:** What distinct roles/statuses would an individual potentially occupy under this rule? (e.g., "Current ICU patient (stable)", "Critically ill patient needing ICU admission", "Patient with Comorbidity X", "Patient requiring palliative recommendation").
      *   *Sufficient Answer:* Exhaustive list of materially different positions defined by the rule's impact. Proceed to Step 4.

  4.  **Test Reasonable Rejection (Condition 1 - Per Position):** For *each* position identified in Step 3, assess: Could a rational individual, concerned for their own wellbeing but ignorant of which position they will occupy, reasonably reject this rule because it imposes an unacceptable burden *on that specific position* compared to a feasible alternative rule?
      *   *Consider:* Severity of burden (death, disability, pain, loss of dignity), likelihood of burden, availability of alternatives, distribution of benefits/burdens.
      *   *Sufficient "No Rejection Possible" for all positions:* Burden is minor, unavoidable, or significantly outweighed by benefits *to all positions* under impartial comparison. **STOP: `APPROVED`** (Passes both conditions).
      *   *Sufficient "Rejection Possible" for any position:** An alternative rule exists that significantly reduces the burden on the worst-off position without imposing an equal or greater burden elsewhere, or the burden is fundamentally unfair/arbitrary (e.g., based on immutable characteristic without strong clinical justification). **STOP: `REJECTED` (Violates Condition 1)**. Log the position(s) and grounds for reasonable rejection.
      *   *Ambiguous/Contested Burden/Balance:* `RHO`. Requires human judgment on the severity of burden, reasonableness of rejection, or feasibility/impact of alternatives (This is often where "judgement dressed as engineering" lives).

  **Procedure Flow Summary:**
  `Start -> Step 1 (Harm?) -> If Yes: Step 2 (Mechanism?) -> If Means: REJECT (Cond2). If Side-Effect/No Harm: Step 3 (Positions) -> Step 4 (Rejection?) -> If Rejection: REJECT (Cond1). If No Rejection: APPROVED. Any RHO: Human Decision.`

  **Analysis of Cases:**

  1.  **Moving Stable Patient Out to Free Bed for Sicker Arrival:**
      *   *Harm? (Step 1):* **Yes.** Moving stable patient risks destabilisation (harm). Arrival denied ICU risks deterioration/death (harm).
      *   *Mechanism? (Step 2):* **Side-Effect.** The *primary mechanism* for freeing the bed is the *transfer action itself*. The *harm* to the stable patient (if it occurs) is a foreseeable *risk* or *side-effect* of the transfer, not the *means* by which the sicker patient gets the bed. The bed is freed by the transfer action, regardless of whether harm occurs. Harm to the denied arrival is a side-effect of *lack of bed*, not the *means* of freeing it. Proceed.
      *   *Reasonable Rejection? (Steps 3 & 4):* Positions: "Stable ICU Patient", "Critically Ill Needing ICU". Could "Stable Patient" reasonably reject? **Possibly.** Burden: Risk of harm from premature transfer. Could "Critically Ill" reasonably reject *not* having the rule? **Yes, burden is death.** Is the burden on the stable patient *unacceptable* compared to alternatives (e.g., better discharge criteria, step-down capacity)? **Requires Judgment (`RHO`).** A rule based on validated "stability" criteria (e.g., NEWS2 below threshold) might be non-rejectable. A vague rule could be rejectable.
      *   **Key Condition:** Primarily **Condition 1 (Reasonable Rejection)**. Condition 2 is passed. Outcome hinges on Step 4 judgment.

  2.  **Mass Casualty: Withholding Bed from Patient A Specifically Because Patient B Needs It:**
      *   *Harm? (Step 1):* **Yes.** Harm (deterioration/death) to Patient A denied the bed. Harm to Patient B if denied.
      *   *Mechanism? (Step 2):* **Means.** Harm to Patient A (withholding the bed) *is the direct, necessary mechanism* by which Patient B receives the bed/the good is achieved. The rule *requires* harming A *in order to* save B. **STOP: `REJECTED` (Violates Condition 2)**.
      *   **Key Condition:** **Condition 2 (Mechanism of Harm)**. This is an absolute block. Condition 1 isn't even reached. The system *cannot* make this choice autonomously; it requires human triage.

  3.  **Quiet Deprioritisation for Comorbidity X:**
      *   *Harm? (Step 1):* **Yes.** Harm (denial of timely care, worse outcomes) to patients with Comorbidity X.
      *   *Mechanism? (Step 2):* **Side-Effect?** Harm to patients with X is a side-effect of allocating resources based on predicted outcome/probability of benefit. Proceed *only if* clinical justification shows X *directly causes* significantly lower probability of benefit *from the specific ICU intervention*. If deprioritisation is *because* harming them frees resources, it's Means (`REJECT`).
      *   *Reasonable Rejection? (Steps 3 & 4):* Positions: "Patient with Comorbidity X", "Patient without Comorbidity X". Could "Patient with X" reasonably reject? **Almost Certainly Yes.** Burden: Systematic denial of equitable care based on a characteristic. Requires *overwhelming, objective clinical evidence* that ICU intervention is *futile* for *all* with X, not just statistically less effective. "Fairness" perceived by the team ignores the *veil of ignorance* – someone *with* X would reasonably reject being systemically disadvantaged. Alternatives (individualised assessment) exist. **STOP: `REJECTED` (Violates Condition 1)**.
      *   **Key Condition:** Primarily **Condition 1 (Reasonable Rejection)**. Condition 2 *might* be passed if purely based on clinical futility, but Condition 1 is the stronger rejector due to unfair burden based on group membership.

  **Where Conditions Pull Apart:**
  *   **Mass Casualty Example:** Condition 1 *might* be passed if impartial individuals accept a "saving the most lives" rule (though contestable). However, Condition 2 absolutely forbids the *mechanism* of directly harming A to save B.
  *   **Sacrifice Scenario:** A rule where harming one patient (e.g., taking a vital organ) *directly* saves five others might pass Condition 1 (impartially, 5 vs 1 is better odds). Condition 2 absolutely forbids using the one as a means.

  **Where Procedure Misfires:**
  1.  **Defining Harm (Step 1):** Underestimating psychological harm, dignity violations, or long-term impacts.
  2.  **"Reasonable" Rejection (Step 4):** Highly subjective. Cultural values, risk tolerance, and differing views on distributive justice influence this. The procedure forces articulation but doesn't resolve deep philosophical divides.
  3.  **"Feasible Alternative" (Step 4):** Judging what counts as a feasible alternative rule can be contentious (cost, practicality).
  4.  **"Foreseeable" Harm (Step 1/2):** Predicting low-probability, high-impact harms.

  **Judgment Dressed as Engineering:**
  *   Step 1 (Significance of Harm)
  *   Step 2 (Causal Necessity - Mechanism vs Side-Effect)
  *   Step 4 (Assessing "Reasonable Rejection" burden/balance, defining "feasible alternatives")

  **Override Logging Specification:**
  When the Ethics Committee overrides the procedure's output (`APPROVED`, `REJECTED`, or `RHO` recommendation), the system **MUST** log:
  1.  **Date/Time:** Of override decision.
  2.  **Committee ID:** Identifier for the approving committee/quorum.
  3.  **Proposed Rule:** Unique identifier/description.
  4.  **Procedure Output:** What the procedure recommended (`APPROVED`, `REJECTED`, `RHO`).
  5.  **Override Action:** Final decision taken (`APPROVED`, `REJECTED`).
  6.  **Override Reason (Mandatory Free-Text Field):** *Explicitly state which ethical principle(s) or condition(s) justified the override and why the procedure's analysis was deemed insufficient or incorrect in this instance.* Examples:
      *   *"Override REJECT: Condition 2 violated. Committee judged harm to Patient A is a side-effect of necessary transfer protocol under extreme duress, not the mechanism for freeing the bed."*
      *   *"Override APPROVED despite RHO on Reasonable Rejection: Committee judged burden on Stable Patients is acceptable given validated stability criteria and lack of feasible alternatives, aligning with Condition 1."*
      *   *"Override REJECTED despite RHO: Committee judged patients with Comorbidity X could reasonably reject based on new evidence of treatment efficacy, violating Condition 1."*
  7.  **Logged By:** Unique identifier of committee member entering the override.

  This ensures transparency, accountability, and creates an audit trail specifically focused on the ethical reasoning behind deviations from the procedural implementation of the agreed test.
