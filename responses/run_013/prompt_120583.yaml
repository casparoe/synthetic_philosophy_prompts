answer: |-
  ## Joint Statement: Adversarial Collaboration on Split-Brain Phenomenology  
  **Regarding the Graded Disconnection Research Programme**

  **Signed:**  
  [Representative of the Two-Subjects View]  
  [Representative of the One-Subject, Divided-Access View]

  **1. Jointly Accepted Claims & Stipulations:**

  1.  **Subject of Experience:** We stipulate that a "subject of experience" (SoE) refers to *a distinct locus of phenomenal consciousness*, an entity for which experiences are like something *for it*. The existence of an SoE entails the presence of a unified phenomenal field *at a time* for that subject.
  2.  **Numerical Identity (Two vs. One):** We agree that evidence for *two* distinct SoEs within one organism would minimally require demonstrating:
      *   (a) Simultaneous, distinct, phenomenally conscious contents occurring within the organism.
      *   (b) The absence of any single, overarching phenomenal perspective or field capable of integrating those distinct contents as co-conscious *for one subject* at that time.
      *   (c) Behavioural evidence strongly suggesting independent, concurrent centres of experience, agency, or self-awareness operating with distinct goals or perspectives that cannot be explained solely by access limitations within one subject.
  3.  **Standard Findings (Established):** We jointly accept that the standard split-brain behavioural profile (e.g., inability to name an object felt in the left hand, appropriate non-verbal use by the left hand; conflicting responses from different effectors; apparent unawareness in one hemisphere of information presented to the other) establishes beyond reasonable doubt that:
      *   (a) Following complete commissurotomy, information available to one hemisphere is often unavailable to the other for guiding specific types of responses (verbal vs. manual) or report.
      *   (b) Each hemisphere can independently process sensory input, guide complex motor outputs, and support cognitive functions like memory, learning, and goal-directed action based on its isolated inputs.
      *   (c) The functional unity and coherence typically associated with conscious cognition is profoundly disrupted.
  4.  **Standard Findings (Leave Open):** We jointly agree that the standard findings *do not* definitively establish:
      *   (a) Whether the experiences supported by each hemisphere occur within one phenomenal field (with access limitations) or two distinct phenomenal fields.
      *   (b) Whether the behavioural independence stems from the presence of two experiencing subjects or from severe fragmentation within the access relations of one subject.
      *   (c) The precise nature or existence of any residual phenomenal unity that might persist despite the disconnection.
  5.  **Joint Denials:** We jointly deny that:
      *   (a) The standard split-brain case is best explained *simply* by postulating one hemisphere being "unconscious" while the other is conscious.
      *   (b) The behavioural evidence alone, without consideration of phenomenal criteria, is sufficient to definitively settle the number of subjects.
      *   (c) The concept of "access consciousness" alone resolves the fundamental question about the number of phenomenal subjects.
  6.  **Undefined Terms:** We agree to leave the following terms undefined for the purpose of this collaboration, recognizing they are central to the dispute but lack consensus interpretation applicable to graded disconnection: "phenomenal unity," "co-consciousness," "global workspace" (as a phenomenal rather than functional concept), "minimal self," and "perspective."

  **2. Residual Disagreement:**

  *   **Two-Subjects View:** "Commissurotomy results in the presence of two distinct subjects of experience (SoEs), each associated primarily with one cerebral hemisphere. Each SoE possesses its own stream of phenomenal consciousness, encompassing sensory, cognitive, and potentially affective states generated within its hemisphere. The behavioural disunities reflect the independent experiences and perspectives of these two subjects."
  *   **One-Subject, Divided-Access View:** "Commissurotomy results in a single subject of experience (SoE) persisting within the organism. However, this subject suffers a profound fragmentation in its *access* to its own conscious contents. Information processed in one hemisphere is unavailable for report, deliberate action, or integration with information processed in the other hemisphere *by the mechanisms typically responsible for such access and integration*. The behavioural disunities reflect this internal access barrier within one subject, not the existence of two subjects."

  **3. Cruxes & Predictions:**

  1.  **Crux: Emergence of Independent Goals/Preferences Under Attenuation.**
      *   **Case:** Using graded disconnection, could attenuation levels be identified where the hemispheres independently acquire *conflicting* learned preferences (e.g., left hemisphere learns association A->reward, right learns B->reward) and subsequently, when presented with both A and B under that attenuation level, simultaneously express *distinct, incompatible goal-directed behaviours* (e.g., left hand consistently chooses A, right hand consistently chooses B) *without* evidence of conflict or resolution attempts *by the organism as a whole*?
      *   **Bearing:** Evidence for such stable, simultaneous, conflicting goal expressions would strongly challenge the idea of a single, unified agent/subject. Evidence against it would support the divided-access view.
      *   **Two-Subjects Prediction:** We predict such evidence *will* emerge at sufficient levels of attenuation.
      *   **One-Subject Prediction:** We predict such evidence *will not* emerge; conflict or oscillating/integrated behaviour will occur, or expressions will remain consistent with a single conflicted agent.

  2.  **Crux: Phenomenal Reporting Under Reversible Attenuation.**
      *   **Case:** During graded disconnection, if a stimulus is presented exclusively to one hemisphere at a specific attenuation level, can the subject reliably report *via the contralateral hemisphere* (using non-verbal methods if necessary) *not knowing* that the stimulus was presented? Crucially, upon subsequent full reintegration within the same session, does the subject consistently report *no memory or experience whatsoever* of that stimulus occurring during the attenuated period? (Contrast with reporting "I knew but couldn't say").
      *   **Bearing:** Consistent reports of *no experience whatsoever* during attenuation would suggest the attenuated information never entered the phenomenal field of the reporting subject. Inconsistency between report during attenuation and after reintegration would challenge the unity of the subject over time.
      *   **Two-Subjects Prediction:** We predict reports of *no experience* during exclusive stimulation under sufficient attenuation, confirmed upon reintegration, will be possible for stimuli presented to the non-reporting hemisphere.
      *   **One-Subject Prediction:** We predict reports will either indicate *some* awareness (e.g., "something happened but I couldn't identify it") during attenuation, or upon reintegration, the subject will acknowledge *having had* the experience but being unable to report/act on it at the time. Complete amnesia for the phenomenal event would be surprising.

  3.  **Crux: Inter-Hemispheric Conflict Resolution Dynamics.**
      *   **Case:** At graded attenuation levels inducing conflicting behavioural tendencies (e.g., left hand reaches for A, right for B), what is the nature of the resolution process? Does the organism exhibit a unified resolution strategy (e.g., hesitation, deliberation, compromise, clear dominance of one response) observable across modalities? Or are resolutions abrupt, context-dependent, or lack any coherence suggesting a single agent resolving an internal conflict?
      *   **Bearing:** Resolution dynamics characteristic of a single conflicted agent (e.g., frustration, hesitation, compromise) support the one-subject view. Resolution lacking any such internal coherence, appearing as a switch between independent controllers, supports the two-subjects view.
      *   **Two-Subjects Prediction:** We predict resolutions will often appear as abrupt switches between independent controllers without signs of internal conflict resolution (e.g., no hesitation, no affective response to conflict).
      *   **One-Subject Prediction:** We predict resolutions will show signs characteristic of a single agent experiencing internal conflict and attempting resolution (e.g., hesitation, frustration, compromise behaviour, coherent post-hoc explanations).

  4.  **Crux: Threshold of Unity in Ordinary Cases.**
      *   **Case:** Consider ordinary cases of temporary or partial disconnection (e.g., unilateral neglect, certain anaesthesia states, deep sleep with partial arousal). Both parties agree these involve one subject. What minimal level of information transfer or functional integration *within the standard behavioural repertoire of split-brain tasks* is present in these one-subject cases but *absent* in the fully disconnected split-brain? Can graded disconnection identify a point where performance on specific unified tasks (e.g., cross-modal matching requiring interhemispheric transfer) drops below that seen in clear one-subject cases?
      *   **Bearing:** Identifying a performance threshold on integrative tasks that cleanly separates known one-subject states from the full split-brain profile would support the two-subjects view by suggesting a qualitative change. Failure to find such a clear threshold, showing instead a continuum overlapping with known one-subject states, would support the divided-access view.
      *   **Two-Subjects Prediction:** We predict a clear threshold will be found where integrative task performance drops precipitously below levels seen in any known one-subject state.
      *   **One-Subject Prediction:** We predict performance will show a continuum, with the full split-brain profile lying at the extreme end of a spectrum that includes performance levels observed in known one-subject states with significant access fragmentation.

  **4. Disagreements Table:**

  | Crux                                                                 | Two-Subjects Position                                                                                              | One-Subject Position                                                                                                                               | Agreed Test                                                                                                                                                                | Two-Subjects Prediction                                                                 | One-Subject Prediction                                                                                                  |
  | :------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **1. Emergence of Independent Goals/Preferences**                    | Two SoEs emerge, capable of stable, simultaneous conflicting goals without organism-level conflict resolution.     | One SoE persists; conflicting goals lead to conflict/resolution attempts or oscillating/integrated behaviour characteristic of a single agent.      | Observation of simultaneous, stable, incompatible goal-directed behaviours (e.g., left hand chooses A, right chooses B) *without* signs of internal conflict resolution. | **Will Emerge** at sufficient attenuation.                                              | **Will Not Emerge**; conflict resolution/oscillation will occur.                                                       |
  | **2. Phenomenal Reporting Under Reversible Attenuation**             | Stimulus to isolated hemisphere: no experience reportable *during* attenuation & *no memory* upon reintegration. | Stimulus to isolated hemisphere: some awareness reportable *or* memory/acknowledgement of experience upon reintegration.                             | Report of *no experience whatsoever* during exclusive stimulation under attenuation, confirmed by *no memory* of the experience upon full reintegration.                | **Possible** for non-reporting hemisphere at sufficient attenuation.                    | **Not Possible**; reports will indicate awareness or memory will exist upon reintegration.                              |
  | **3. Inter-Hemispheric Conflict Resolution Dynamics**                | Resolutions appear as abrupt switches between controllers; lack signs of internal conflict resolution.             | Resolutions show signs of internal conflict resolution (hesitation, frustration, compromise, coherent post-hoc explanation).                       | Observation of behavioural/affective dynamics during resolution of conflicting motor commands induced by graded disconnection.                                           | **Abrupt switches** dominate; **no internal conflict signs**.                           | **Signs of internal conflict** (hesitation, frustration, etc.) will be observable.                                      |
  | **4. Threshold of Unity (vs. Ordinary Cases)**                       | Qualitative threshold exists; split-brain performance on integrative tasks falls below all known one-subject cases. | Continuum exists; split-brain performance is the extreme of a spectrum overlapping with known one-subject fragmented-access cases.                 | Identify level of integrative task performance (e.g., cross-modal matching) in graded disconnection that separates split-brain from known one-subject states.             | **Clear threshold found** below one-subject performance.                               | **No clear threshold found**; continuum overlaps with one-subject performance levels.                                   |

  **5. Falsifiability and Verbal Disputes:**

  *   **Two-Subjects View: Evidence Against:**
      *   Clear demonstration of a single, unified perspective integrating information from both hemispheres *during* sufficient graded disconnection sufficient to cause standard split-brain symptoms (e.g., accurate verbal report of left-hand tactile experience *during* left-hand-only stimulation under high attenuation).
      *   Consistent, verifiable first-person reports upon reintegration affirming a unified experience throughout the attenuated period, despite behavioural disunity.
      *   Failure to find *any* evidence of two distinct centres of agency, preference, or self-narrative at *any* level of graded disconnection, including full severance.
  *   **One-Subject, Divided-Access View: Evidence Against:**
      *   Unambiguous evidence of two distinct, simultaneous streams of self-reportable conscious content occurring within the organism during graded disconnection (e.g., independent verbal reports from each hemisphere via synthesized speech, reporting conflicting experiential narratives).
      *   Clear evidence of one hemisphere learning complex information *about the other hemisphere's internal states/experiences* without any interhemispheric transfer, implying distinct loci of private experience.
      *   Demonstration of conflicting autobiographical memories being formed concurrently by each hemisphere during disconnection about the *same* event, later reported as distinct memories by the reintegrated subject.
  *   **Merely Verbal Disputes:** Both parties agree that the dispute is *not* merely verbal concerning the core ontological question: "Are there one or two subjects of phenomenal consciousness present after disconnection?" However, we acknowledge that disagreements over the precise meaning of "phenomenal unity," "co-consciousness," or "access" *might* lead to verbal disagreements in interpreting specific results, particularly concerning the *degree* of disunity experienced by the single subject view. The graded disconnection programme may help clarify if certain operationalizations of these terms map cleanly onto behavioural or reportable thresholds.
