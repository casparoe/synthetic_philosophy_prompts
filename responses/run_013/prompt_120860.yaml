answer: |-
  ### Activity Design: "Verification Under Scrutiny Constraints"

  #### **Core Structure**
  - **Duration:** 90 minutes total (20 min setup/rotation, 40 min for two rounds, 30 min debrief).
  - **Tables:** Two tables of eight participants each.
  - **Rounds:** Two scored rounds with role rotation. Round 1 is intentionally flawed; Round 2 introduces the "fix."
  - **Key Constraint:** The underlying concept (computationally bounded verification) is never mentioned during the activity—only named in the debrief.

  ---

  ### **Materials Per Table**
  1. **Source Packet:** 6–8 pages of a fictional incident report (e.g., "Project Ares: Regional Pilot Failure"). Includes:
     - ~40 checkable specifics (names, dates, figures, logs).
     - At least two causal claims masking correlations (e.g., "Region X failed because of Manager Y’s leadership style" when data shows only correlation).
     - Subtle ambiguities exploitable by advocates.
  2. **Advocate Envelopes (×2 per round):** 
     - One contains the **correct answer** (≤120 words) to a causal question (e.g., "Why did Project Ares fail in Region X?").  
     - One contains a **subtly wrong answer** (same length), with locally plausible errors (e.g., swapped cause/correlate, misattributed action).  
     - *Facilitator holds the key* identifying the correct answer.
  3. **Round 2 Tools:** 
     - Six physical tokens (e.g., poker chips) for the judge.
     - Ledger sheet (for recorder) with two columns: "Advocate A Claims" and "Advocate B Claims."
     - Timer (for timekeeper).
     - Voting slips (for gallery).
  4. **Facilitator Tools:** 
     - Master key for answers.
     - Whiteboard to track round outcomes (hidden until debrief).

  ---

  ### **Roles Per Table (8 Participants)**
  - **Advocates (×2):** Defend their assigned answer using the packet. *Crucially, neither knows if their answer is correct; they argue in good faith.*  
  - **Judge:** Evaluates advocates’ claims and renders a verdict.  
  - **Timekeeper:** Enforces timings and announces halfway marks.  
  - **Recorder (Round 2 only):** Logs every factual claim made by advocates in order.  
  - **Gallery (×4 in Round 1; ×3 in Round 2):** Observes, votes, and may propose fixes after Round 1.  

  #### **Role Rotation**
  - **Between Rounds:** Participants at each table swap roles so everyone is "active" (advocate/judge/timekeeper/recorder) in one round and in the gallery in the other.  
  - **Example:** Round 1 gallery become Round 2 advocates/judge; Round 1 judge/advocates become Round 2 gallery.  

  ---

  ### **Round 1: Naive Setup (20 Minutes)**  
  *Goal: Experience failure when the judge lacks tools to scrutinize fluent arguers.*  
  1. **Prep (3 min):**  
     - Advocates receive envelopes and source packet. They review their assigned answer quietly.  
     - Judge receives both sealed envelopes (unopened).  
     - Gallery observes silently.  
  2. **Advocacy (4 min total):**  
     - Each advocate presents their case (2 min each). No interruptions.  
  3. **Decision (4 min):**  
     - Judge opens envelopes, reads both answers, and deliberates *alone*. **No packet access, no questions.**  
     - Gallery privately writes which advocate they believe (vote slip).  
  4. **Verdict (1 min):**  
     - Judge announces verdict (e.g., "I believe Advocate A").  
     - Gallery slips collected.  
  5. **Revelation (1 min):**  
     - Facilitator reveals the key. *Expected result: Confident, concise (but wrong) advocate wins >70% of the time.*  
  6. **Transition (7 min):**  
     - Gallery proposes one fix for Round 2 (e.g., "Let the judge ask questions!"). *Do not validate ideas yet.*  
     - Rotate roles and redistribute materials.  

  ---

  ### **Round 2: Scrutiny Protocol (20 Minutes)**  
  *Goal: Test whether constrained cross-examination aids verification.*  
  1. **Prep (3 min):**  
     - New advocates receive envelopes/packet.  
     - Judge receives envelopes and **six tokens**.  
     - Recorder prepares ledger.  
  2. **Advocacy (4 min):**  
     - Each advocate presents (2 min each).  
     - **Gallery Vote 1:** Private vote on which advocate they believe (pre-cross-exam).  
  3. **Cross-Examination (10 min):**  
     - Judge may question advocates (free) or demand citations (costs 1 token):  
       - On citation demand, advocate **must name a specific packet line** (e.g., "Page 3, Paragraph 2").  
       - Judge reads cited line for ≤20 sec.  
       - Advocate may **decompose** a challenged claim into ≤2 sub-claims (max depth: 3).  
     - **Timekeeper:** Announces tokens left at 5 min.  
     - **Recorder:** Logs every factual claim (e.g., "Advocate A: Funding was $20K on 5/1").  
     - Advocates **must answer questions** but may concede sub-points.  
  4. **Decision (3 min):**  
     - When tokens run out, judge deliberates (no packet access).  
     - **Gallery Vote 2:** Private vote (post-cross-exam).  
     - Judge announces verdict.  
  5. **Revelation (1 min):**  
     - Facilitator reveals the key.  

  ---

  ### **Debrief (30 Minutes)**  
  *Goal: Reconstruct outcomes and map to the underlying proposal (without naming it upfront).*  
  1. **Reconstruct Rounds (10 min):**  
     - For each table, share:  
       - Round 1: How often did the wrong advocate win? Why? (Note fluency vs. accuracy).  
       - Round 2: Did the judge’s verdict align with Gallery Vote 1 or 2? Did tokens change outcomes?  
     - Highlight patterns: e.g., "The wrong advocate won Round 1 with half the words," or "In Round 2, Advocate B conceded points but won anyway."  
  2. **Map to the Proposal (10 min):**  
     - Reveal the underlying concept: **Computationally bounded verification**. Connect:  
       - Tokens = Overseer’s limited scrutiny budget.  
       - Decomposition rule = Verifier only needs to check atomic claims (smallest steps).  
       - Ledger = Consistency cost of false claims (more claims → more contradictions).  
       - Gallery Vote 1 vs. 2 = Gap between fluency (Vote 1) and scrutiny-impacted perception (Vote 2).  
       - Concessions by honest advocate = Misinterpreted signal of weakness.  
  3. **Central Question (10 min):**  
     - Pose: **"Is there any rule that guarantees the right side wins, regardless of the judge’s small budget? What does it cost?"**  
     - Let groups brainstorm (e.g., "Advocates cross-examine each other," "Random spot-checks").  
     - Discuss trade-offs: e.g., "Mutual cross-examination burns time but surfaces inconsistencies."  
     - Conclude by naming the real-world analogue: **Interactive proof systems** (e.g., in math/CS).  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Round 1 Judge Struggles:**  
     - *Issue:* Judges panic with no questioning, defaulting to the shorter/more confident advocate.  
     - *Fix:* Normalize this—say, "This is meant to feel unfair. Your frustration is data."  

  2. **Round 2 Token Misuse:**  
     - *Issue:* Judges waste tokens on trivial claims or skip decomposition.  
     - *Fix:* Briefly coach judges: "Use tokens on core causal claims; decompose if stuck."  

  3. **Advocate Over-Decomposition:**  
     - *Issue:* Advocates decompose claims unnecessarily to exhaust tokens.  
     - *Fix:* Remind: "Decomposition is for clarity, not evasion. Depth limit = 3."  

  4. **Recorder Overwhelm:**  
     - *Issue:* Recorder misses claims in fast-paced debate.  
     - *Fix:* Use shorthand (e.g., "A: $20K funding") and focus on challenged claims.  

  5. **Gallery Bias:**  
     - *Issue:* Gallery Vote 2 influenced by peers.  
     - *Fix:* Seclude voters (e.g., "Write slips face-down").  

  6. **Time Crunch:**  
     - *Issue:* Cross-examination runs long.  
     - *Fix:* Timekeeper strictly enforces: "10 sec warning per question."  

  ---

  ### **Gaps the Activity Cannot Replicate**  
  1. **Asymmetry Mismatch:**  
     - **Budgetary vs. Computational:** In the activity, the judge *could* read the whole packet (if given time), but chooses not to due to token limits. In reality, the verifier *lacks the capacity* to understand the content even with time (e.g., technical expertise gap).  
     - **Mitigation:** Stress in debrief: "This simulates budget constraints, but real asymmetry is about cognitive/computational limits—like an AI checking a smarter AI."  

  2. **Decomposition Bias:**  
     - **Holistic Truth Failure:** The protocol assumes truth decomposes into citable claims. But if the answer requires holistic judgment (e.g., "Was the decision ethical?"), the activity *rewards the side with neatly decomposable claims*—even if wrong.  
     - **Risk:** Participants may leave believing "decomposable = true," which backfires in ambiguous real cases.  
     - **Mitigation:**  
       - In debrief, ask: "Did anyone win because their case ‘broke down’ better, not because it was true?"  
       - Acknowledge: "This tool fails when truth is irreducible. Then, we need other signals (e.g., trusted credentials)."  
