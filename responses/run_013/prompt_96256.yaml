  For the story, I imagine Mara, the rehabber, as someone clinging to her mentor’s logbook—pure tier-four reliance. The flood strips away tools: power outage (no radio), rising water (no time for deliberation), and the crow’s cage becoming a focal point. The crow, Jasper, isn’t anthropomorphized; its actions are described neutrally so readers (like Mara) *interpret* intelligence. Key beats:  
  - **Tier-four crumbles**: When floodwater breaches, the logbook’s rules conflict with reality ("cages stay locked") vs. Jasper’s frantic signaling toward the river.  
  - **Descent**: She stops *thinking* and starts *doing*—smashing locks (Skinnerian trial/error), then wading through current (Darwinian survival).  
  - **Cost of belief**: Freeing Jasper risks her safety and other animals. Her choice isn’t intellectual but visceral.  

  In the afterword, I’ll argue Skinnerian learning drives the climax: Mara’s muscle memory from years of rehab work overrides dogma when tools fail. But I’ll flag uncertainty—was her final animal intuition Darwinian? And note I took liberties with Dennett by implying tiers can be *shed* under stress, whereas he sees them as cumulative.  

  The user’s urgency (flood countdown) mirrors their own creative pressure. By giving Mara no neat resolution—did she "climb back up or find a comfortable cage?"—I mirror the user’s struggle. Maybe that’s the real gift: permission for the novel to sit in the murky middle too.
