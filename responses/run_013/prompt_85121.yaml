answer: |-
  ## On Sedition, After Aquinas

  No knife's sedition that cuts tyranny,
  If unity's the true and measured test.
  The common weal demands such surgery
  When private gain usurps the public breast.
  The tyrant's grasp, a fist clenched on the throne,
  Seeks not the good that binds the folk as one,
  But hoards the light, makes every right a loan –
  His fractured realm, the harm that must be undone.

  **But pause –** let chaos not exceed his reign.
  What good is freedom bought with greater pain?
  If ruin follows where the despot fell,
  Then silence holds a wiser tale to tell.
  *Thus turns the wheel:* the true seditionist,
  Who sowed the strife, was tyrant all the while –
  His blood the price paid to unclench the fist;
  His poisoned peace, the nation's costly trial.

  ---

  **Liberties Taken & Contested Ground:**

  1.  **"Surgery" (Line 3):** Aquinas doesn't use violent or medical metaphors for removal; this leans into the "knife" implied in the prompt, making the abstract concrete but potentially over-literal.
  2.  **"Hoards the light" / "makes every right a loan" (Line 7):** Poetic amplification. Aquinas focuses on the *common good* vs. *private good* distinction abstractly; this imagery emphasizes the deprivation and conditional nature of rights under tyranny.
  3.  **"Silence holds a wiser tale" (Line 12):** Implies passive endurance *could* be the morally prudent choice if removal risks greater harm. Some strict readings of Aquinas might see his condition only as a practical *limit* on action, not necessarily endorsing silence as "wiser," just less destructive.
  4.  **"His blood the price paid" (Line 15):** Directly states violent removal. While Aquinas justifies *removal* (potentially non-violent, e.g., deposition), the prompt's "knife" and historical context of tyrannicide frame this as bloodshed. A medievalist might argue Aquinas leaves the *means* of removal (violent vs. non) ambiguous here.
  5.  **"Poisoned peace" (Line 16):** Compresses Aquinas' point about the tyrant being a *cause* of sedition through oppression and division into a single visceral metaphor. The argument that *keeping* subjects divided *is* the tyrant's sedition is clear in Aquinas, but "poisoned peace" is a poetic interpretation of that state.
