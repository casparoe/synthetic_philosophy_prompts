answer: |-
  ### Game: Two firms choosing pricing strategies (High, Medium, Low)

  **Payoff Matrix (Row Firm, Column Firm):**

  |          | Column: High (A) | Column: Medium (B) | Column: Low (C) |
  |----------|------------------|--------------------|-----------------|
  | **Row: High (A)** | (5, 5)          | (0, 0)            | (5, 0)         |
  | **Row: Medium (B)** | (0, 0)          | (4, 4)            | (4, 5)         |
  | **Row: Low (C)**  | (1, 0)          | (1, 1)            | (2, 2)         |

  ---

  ### Verification of Specifications
  1. **No pure strategy strictly dominated by another pure strategy at outset:**  
     - *Row:*  
       - A vs. B: A better if Column A (5 > 0) or C (5 > 4); B better if Column B (4 > 0). No domination.  
       - A vs. C: A better if Column A (5 > 1) or C (5 > 2); C better if Column B (1 > 0). No domination.  
       - B vs. C: B better if Column B (4 > 1) or C (4 > 2); C better if Column A (1 > 0). No domination.  
     - *Column:*  
       - A vs. B: A better if Row A (5 > 0); B better if Row B (4 > 0) or C (1 > 0). No domination.  
       - A vs. C: A better if Row A (5 > 0); C better if Row B (5 > 4) or C (2 > 0). No domination.  
       - B vs. C: B better if Row A (0 = 0) [tie]; C better if Row B (5 > 4) or C (2 > 1). No **strict** domination (due to tie in Row A).

  2. **Row's Low (C) strictly dominated by non-degenerate mixture of High (A) and Medium (B):**  
     - Use mixture \(p = 0.5\) (50% A, 50% B). Expected payoff for Row:  
       - If Column A: \(0.5 \times 5 + 0.5 \times 0 = 2.5 > 1\)  
       - If Column B: \(0.5 \times 0 + 0.5 \times 4 = 2 > 1\)  
       - If Column C: \(0.5 \times 5 + 0.5 \times 4 = 4.5 > 2\)  
     - Strict inequalities hold; C is strictly dominated.

  3. **Row's Low (C) not a best response to any Column mixture, and unique Nash equilibrium:**  
     - Let Column use mixture \((q_A, q_B, q_C)\). Row's payoff for C: \(1 \cdot q_A + 1 \cdot q_B + 2 \cdot q_C\).  
       - Payoff for A: \(5q_A + 0q_B + 5q_C\)  
       - Payoff for B: \(0q_A + 4q_B + 4q_C\)  
       - Always, either A or B yields a higher payoff than C:  
         - If \(5q_A + 5q_C > 1q_A + 1q_B + 2q_C\) or \(4q_B + 4q_C > 1q_A + 1q_B + 2q_C\), which holds strictly unless \(q_A = q_B = q_C = 0\).  
     - **Unique Nash equilibrium:** (High, High) = (A, A).  
       - At (A, A): Row best response to A is A (5 > 0, 5 > 1); Column best response to A is A (5 > 0, 5 > 0).  
       - No other equilibria (e.g., (B, B) fails as Column prefers C (5 > 4) given Row B).

  ---

  ### Iterated Elimination Procedures
  #### Procedure 1: Only Pure Strategies as Dominators
  - **Round 1:** No pure strategy strictly dominated by another (verified above). **No elimination.**  
  - **Further rounds:** No changes.  
  - **Surviving strategies:** All (Row: A, B, C; Column: A, B, C).

  #### Procedure 2: Mixed Strategies Allowed as Dominators
  - **Round 1:**  
    - Row's C strictly dominated by mixture of A and B (verified above). **Eliminate Row C.**  
    - Column's B strictly dominated by mixture of A and C (e.g., 10% A, 90% C):  
      - Against Row A: \(0.1 \times 5 + 0.9 \times 0 = 0.5 > 0\) (B's payoff)  
      - Against Row B: \(0.1 \times 0 + 0.9 \times 5 = 4.5 > 4\) (B's payoff)  
      - **Eliminate Column B.**  
  - **Reduced game:**  
    |          | Column: A | Column: C |
    |----------|-----------|-----------|
    | **Row: A** | (5, 5)   | (5, 0)   |
    | **Row: B** | (0, 0)   | (4, 5)   |
  - **Round 2:**  
    - Row's B strictly dominated by A: 5 > 0 (if Column A) and 5 > 4 (if Column C). **Eliminate Row B.**  
    - Column's C strictly dominated by A: 5 > 0 (if Row A; Row B eliminated). **Eliminate Column C.**  
  - **Surviving strategies:** Only (A, A).

  ---

  ### Summary of Differences
  - **Divergence:** Procedures part ways immediately in Round 1. Pure-only procedure eliminates nothing; mixed procedure eliminates Row C and Column B.  
  - **Prediction impact:** Both procedures leave the unique Nash equilibrium (A, A) standing. However, pure-only procedure retains strategies not in equilibrium (Row C, Column B, Column C), while mixed procedure refines to only (A, A).  
  - **Structural feature:** Payoffs are designed so that:  
    - No pure strategy dominates another (due to cross-over payoffs).  
    - Mixed strategies exploit gaps (e.g., Row's C is worse than average of A/B; Column's B is worse than mixture of A/C).  

  ### Effect of Nudging a Payoff
  - **Nudge:** Increase Row's payoff for (C, C) from 2 to 6.  
    - **Consequence:** Row's C is no longer dominated by mixture of A and B.  
      - If Column C: Mixture payoff = \(0.5 \times 5 + 0.5 \times 4 = 4.5 < 6\).  
    - **Procedures now agree:** Both eliminate nothing in Round 1 (no pure or mixed domination).  

  ### Strongest Objection for Pure-Dominance-Only View
  **Objection:** "Mixed strategies require players to model opponents' randomization, which may be unrealistic. Without evidence that players consider mixed strategies, elimination should rely solely on pure dominance. The example artificially forces domination via mixtures, but real firms may not compute expected payoffs against randomized opponents."  

  **Rebuttal:** Rationalizability (mixed) captures strategic uncertainty where players optimize against all possible opponent behaviors, including randomized ones. Pure-only elimination fails to remove strategies never best responses (like Row C), leading to overly broad predictions.  

  ### Weak Dominance Version
  - **Pure-weak-dominance-only:**  
    - Column B is weakly dominated by C (equal in Row A, strictly worse in B and C). **Eliminate Column B in Round 1.**  
    - Subsequent rounds may eliminate more (e.g., Row C weakly dominated by A/B).  
  - **Mixed-weak-dominance:** More strategies eliminated (e.g., Row C weakly dominated by mixture).  
  - **Agreement?** Unlikely; weak domination often removes additional strategies in pure-only procedure, but mixed may still differ.  

  ---

  This example demonstrates that iterated elimination of strictly dominated strategies coincides with rationalizability **only** when mixed strategies are permitted as dominators. The pure-only approach fails to eliminate non-rationalizable strategies, altering the surviving set even if the equilibrium prediction remains unchanged. The key is designing payoffs where mixtures exploit strictly higher expected payoffs not detectable by pure comparisons.
