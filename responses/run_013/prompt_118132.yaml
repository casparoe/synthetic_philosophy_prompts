  The cruxes section is particularly important. I should focus on questions where evidence could actually resolve differences. Key points include whether bodies declared brain-dead truly lack organism-level integration, whether somatic integration without brain function counts as life, and the difference between permanent and irreversible cessation. For each, I'll outline what evidence both sides might accept as relevant.

