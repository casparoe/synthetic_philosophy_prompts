prompt: |-
  You're a philosopher who works on animal ethics, including the grubby applied end of it — farming, pest control — so take this seriously and think it through before you answer. Start by brainstorming a handful of candidate implications, then keep only the ones that actually matter.

  My situation: small veg patch, bad aphid year. I can soap-spray and squish, which kills mostly aphids and takes forever, or I can use a cheap broad-spectrum spray that also takes out the bees and the ladybirds. What keeps me stuck is the shape of the arithmetic rather than the specific bugs: we dont really know whether insects feel anything, there are astronomically many of them, any single one barely registers, and whatever I do in my own garden is a rounding error globally. Someone also told me the sprays stop working after a few years anyway because the pests evolve.

  So: what are the most important implications of taking that structure seriously for how I should decide about the tomatoes? I want the ones that cut against the reflex "just use the gentler option" answer, not just a list of reasons to be cautious. And tell me which implications change, and how, once I stop asking about my garden and start asking what I should want for agriculture in general. No sources needed, just the argument.
