prompt: |-
  I am a doctoral student working on responsibility-sensitive egalitarianism, and I keep circling a pattern that I suspect is either a familiar problem under a name I have not encountered, or a problem that has not been isolated because it looks like two other problems at once.

  The pattern concerns how we decide whether a disadvantage is one its bearer should bear. Take the standard apparatus: a disadvantage is unjust insofar as it traces to bad luck, and permissible insofar as it traces to the agent's own choices. What I notice is that in practice the verdict does not turn on the causal history. It turns on the comparison, and the comparison slides without any change in the causal facts.

  Two cases I use in teaching. First, a worker takes a job in a mine knowing it carries a high risk of a specific injury, and is injured. Compare him with the counterpart who took the safer job at lower pay, and the shortfall looks like a stake he wagered and lost. Compare him with himself as he would have been had the injury not occurred, and the same shortfall looks like a bolt from the blue. Nothing about what he did or why changes between the two comparisons. Second, a student chooses to study a field with poor employment prospects because it is the only thing she has ever wanted to do. Compare her with the classmates who went to law school, and her prospects look like the price of a decision. Compare her with the person she would have been had her tastes been formed in a different household, and the same prospects look like the upshot of something she never chose. Again the causal facts are held fixed; only the term of comparison moves.

  The second case suggests something the first does not: the choice of comparison is not innocent, because it selects how far back along the chain we treat the agent as the author of her situation, and hence how much of the situation counts as her doing. And in what I read, the comparison appears to be selected by the verdict the author wants rather than the reverse. Cases are set up already containing the preferred comparison, so the argument appears to run from causal history to verdict when it runs from verdict to comparison.

  I know the standard regress objection, that choices trace back to unchosen tastes and circumstances, so that genuine option luck may be empty. That is not my pattern, since mine survives even if we stipulate the causal history and grant that some choices are genuinely the agent's. The question is which counterfactual does the normative work, and the theory seems not to say. I have also looked at the reference class problem in probability and at the analogous worry about baselines in the measurement of harm, but there the issue is which class or baseline yields a correct probability or a correct magnitude, whereas here the issue is which counterfactual fixes the loss at all, when the loss is meant to be the input to a verdict rather than a quantity to be estimated.

  So: does this have a name? If it does, I want the name plus an account of what it covers that my cases do not, because I would rather learn that I am redescribing something established than coin a term for what already has one. If it does not, I want a name, a definition, and the edges — in particular, whether the trouble is a gap in the theory's specification, an illicit step in how the theory is applied, or evidence that the distinction between option luck and brute luck does no independent work at all. Those are three diagnoses and I doubt they can all be right. I would also like to know whether anything turns on the grain at which the choice is described, or whether that is a different problem wearing the same clothes.
reasoning: |-
  Okay, let me start by unpacking this doctoral student's query. They're working on responsibility-sensitive egalitarianism and have identified a recurring pattern in how disadvantages are judged. The core issue is that the verdict on whether a disadvantage is just or not depends on the counterfactual comparison used, even when the causal history is fixed. 

  First, I need to fully grasp their examples. The miner case shows that comparing the injured worker to a safer-job counterpart frames the injury as a lost gamble, while comparing to their uninjured self makes it seem like bad luck. The student case highlights how comparing to law school peers frames poor prospects as a choice consequence, but comparing to a version with different formative influences frames it as unchosen circumstance. The key insight here is that the selection of comparison point implicitly determines where we draw the line of agential responsibility.

  Hmm, they've explicitly ruled out two common objections: the regress problem (choices trace back to unchosen factors) and reference class issues in probability/harm measurement. This suggests they're isolating something distinct - not about causal origins but about normative framing. Their suspicion that theorists reverse-engineer comparisons to match desired verdicts feels important - it points to a circularity in application.

  As I scan possible conceptual neighbors, "counterfactual sensitivity" comes to mind as descriptive but not established. The closest named concepts seem to be:
  - Non-identity problem (Parfit): But that's about harm to possible people, not choice of comparison frames
  - Moral luck paradox (Williams/Nagel): Focuses on outcome dependence of blame, not counterfactual selection
  - Context-dependence of responsibility: Too broad

  Ah! The "baseline problem" in harm/luck egalitarianism might be relevant - but as they note, typical baseline issues concern magnitude, whereas here it's about constituting the loss itself. Their observation that the loss is an input rather than measurable quantity is sharp - this elevates it from epistemological to ontological.

  For diagnosis, I see three layers:
  1. Specification gap: Theory doesn't prescribe how to select the relevant counterfactual
  2. Application flaw: Practitioners smuggle in normative preferences via comparison choice
  3. Foundational critique: Option/brute luck distinction collapses without external anchor

  The granularity question is astute. If we describe choices finely (e.g., "studying philosophy" vs. "pursuing passion given specific upbringing"), responsibility assignments shift, but this feels like a separate issue about description-dependence rather than comparison-dependence.

  Naming this "counterfactual relativity" seems apt - emphasizing how moral valence changes with the observer's referential frame. The "problem" suffix makes it recognizable as a philosophical challenge. I should note how this connects to but differs from Dworkin's twin parameters (tastes vs. resources) and Anderson/Scheffler's critiques of luck egalitarianism's punitive aspects.

  The doctoral student's closing request for edges is crucial. This isn't just naming - it's about locating the fracture point in the theory's architecture. The deepest implication may be that responsibility is inherently relational, requiring a prior theory of "relevant others" for comparison - which luck egalitarianism lacks.
answer: |-
  Your observation exposes a deep and under-discussed problem in responsibility-sensitive egalitarianism. What you're describing doesn't have a single, universally accepted name, but it intersects with several recognized challenges. The closest established concept is the **Baseline Problem in the Specification of Option Luck**, but your focus on the *counterfactual relativity of loss-constitution* refines it in a novel way.

  ### Why Existing Labels Don't Quite Fit
  1.  **The Baseline Problem (Standard Form):** As you note, this typically concerns *measuring the magnitude* of disadvantage or harm once it's agreed a loss exists (e.g., "Harm compared to what? Average welfare? Previous state? A specific counterfactual?"). Your problem is more fundamental: **which counterfactual comparison *constitutes* the loss *as* a matter of luck or responsibility in the first place?** Your cases show the *same state of affairs* is only constituted as a "loss for which one is responsible" *relative to a chosen comparison*. The loss itself is ontologically dependent on the normative frame.
  2.  **The Regress Problem:** You rightly distinguish this. The regress questions whether *any* choice is truly "authentic" given antecedent causes. Your problem persists even *if* we stipulate authentic choice exists within the causal chain.
  3.  **Moral Luck / Outcome Luck:** This focuses on how outcomes beyond an agent's control affect blame/praise for an *action*. Your problem is about how the counterfactual frame determines whether a *resulting state* (disadvantage) is seen as flowing from a responsible choice *at all*.
  4.  **Context-Dependence of Responsibility:** While related, this is too broad. Your insight specifies the mechanism: **counterfactual comparison selects the point along the causal chain where agential authorship is deemed to "start" for the purpose of assigning the disadvantage.**

  ### Proposed Name & Definition
  **The Problem of Counterfactual Relativity in Loss-Constitution (CRLC)**

  *   **Definition:** The phenomenon whereby whether a particular disadvantage is normatively constituted *as* a matter of option luck (for which the bearer is responsible) or brute luck (for which compensation may be owed) is inherently relative to the choice of counterfactual scenario used for comparison. This choice determines the segment of the causal chain attributed to agency, and crucially, the theory lacks principled criteria for selecting the *normatively relevant* counterfactual, leading to verdict-driven (rather than principle-driven) comparisons.

  ### Diagnosis: The Gaps and Implications
  CRLC reveals **multiple, interconnected gaps in the theory's specification and application**, rather than a single flaw. It also poses a threat to the distinction's independent work:

  1.  **Gap in Specification (The Core Issue):** Luck egalitarianism, particularly its Dworkinian strand, fails to provide a non-arbitrary, non-question-begging principle for selecting the *normatively relevant counterfactual*. It implicitly assumes a "natural" or "correct" comparison point, but your cases demonstrate its profound relativity. *What makes the safer-job miner the "correct" comparison for the injured miner, rather than his uninjured self?* The theory is silent. This is not merely an application error; it's a foundational omission in the theory's structure.
  2.  **Illicit Step in Application (A Consequence):** Because the theory lacks criteria for the relevant counterfactual, *application becomes verdict-driven*. Theorists and practitioners intuitively select the comparison that yields their desired normative conclusion about responsibility (e.g., "miners chose risk" -> compare to safer worker; "students didn't choose upbringing" -> compare to differently-formed self). This reverses the intended direction of argument (from causal history to verdict). The causal history alone is insufficient without the framing comparison.
  3.  **Threat to the Distinction's Independence:** CRLC suggests the brute/option luck distinction **cannot do independent justificatory work** in many hard cases. The distinction *depends* on a prior (and untheorized) choice of comparison point. The comparison does the heavy lifting in *defining* what counts as option luck *within* the causal history. If the distinction relies on a choice that is itself verdict-driven or arbitrary, its claim to provide an objective basis for distributive justice is undermined. It becomes a *post hoc* label rather than an *a priori* guide.

  ### The Role of Grain
  Your question about the "grain" of choice description is **distinct but intimately related and often co-occurring**.

  *   **The Grain Problem:** This concerns how finely or coarsely we describe the choice itself (e.g., "choosing to mine" vs. "choosing to accept a specific risk-reward package under specific informational constraints"). Different descriptions can make the same action appear more or less responsible/risky/informed.
  *   **Interaction with CRLC:** The chosen grain often implicitly *predetermines* plausible counterfactuals. A coarse-grained description ("mining") makes comparison to "not-mining" (the safer job) salient. A fine-grained description ("pursuing a passion shaped by upbringing X") makes comparison to "upbringing Y" salient. Theorists can manipulate *both* the description of the choice *and* the counterfactual comparison to steer the verdict. CRLC focuses specifically on the counterfactual selection, while the grain problem focuses on the description of the act/agent. They are separate levers, but pulling one often pulls the other.

  ### Why This Matters and What It Implies
  CRLC is a significant problem because it exposes a **fundamental indeterminacy** at the heart of applying the luck/choice distinction. It suggests that:

  1.  **A Theory of Relevant Counterfactuals is Needed:** Any viable responsibility-sensitive egalitarianism requires a supplementary theory specifying *which counterfactuals are normatively relevant* for constituting losses. This might involve appeals to:
      *   **Reasonable Expectations:** What counterfactuals were salient/available to the agent at the time of choice? (Though this risks circularity).
      *   **Social Conventions/Norms:** What comparisons are socially embedded? (Risks parochialism and conservatism).
      *   **Idealized Agency:** What would a similarly situated agent with "reasonable" preferences/values have chosen? (Raises problems of paternalism and defining "reasonable").
      *   **Purpose of the Inquiry:** Is the goal compensation, blame, social stability? (But this abandons the search for a principle).
  2.  **Highlights the Constructed Nature of "Option Luck":** CRLC shows that labeling a disadvantage as "option luck" is not a simple discovery of a causal fact; it's a normative *interpretation* dependent on selecting a specific frame of reference.
  3.  **Strengthens Communitarian/Relational Critiques:** Critics like Elizabeth Anderson or Samuel Scheffler argue that luck egalitarianism isolates individuals from social context and ignores the relational basis of equality. CRLC supports this by showing how the very constitution of individual responsibility depends on unacknowledged, arbitrary choices about comparison points, which are fundamentally social and contextual.

  **In conclusion:** You have isolated a distinct and profound problem – Counterfactual Relativity in Loss-Constitution (CRLC). It is not merely the baseline problem, the regress problem, or the grain problem, though it interacts with them. It reveals a critical specification gap in the theory (lack of criteria for relevant counterfactuals), which leads to an illicit application step (verdict-driven comparison selection), and thereby threatens the brute/option luck distinction's ability to do independent normative work. It demands a theory of relevant counterfactuals that luck egalitarianism currently lacks. This is a significant contribution to the critique and potential refinement of responsibility-sensitive egalitarianism.
