answer: |-
  ### Case 1: The Apparent Violation  
  A trapped Brownian particle in a double-well potential serves as the working substance, coupled to a heat bath at temperature *T*. The demon is a two-state register (e.g., a bistable mechanical switch) initially in state 0. Before the cycle, a reversible coupling adiabatically swaps the particle’s position (left/right) with the register’s state, establishing correlation without measurement or dissipation. The cycle then proceeds: (1) If the particle is left, the demon uses a conditional lever to lower the left well’s energy barrier, letting the particle expand reversibly and lift a weight. (2) If the particle is right (register state 1), the lever lowers the right barrier for reversible compression. (3) The register is reset to 0 by coupling it to the heat bath: the switch diffuses to equilibrium, dissipating heat.  

  **Budget**:  
  - Stage 1 (coupling): Logically reversible (swapping states), thermodynamically reversible (no dissipation).  
  - Stage 2 (conditional expansion/compression): Logically irreversible (choice is path-dependent), but thermodynamically reversible (work extracted/input matches free-energy change, no net dissipation).  
  - Stage 3 (register reset): Logically irreversible (many microstates map to state 0), thermodynamically irreversible. Entropy debt is paid here: the bath absorbs *k<sub>B</sub>T* ln 2 of heat.  
  Total dissipation: *k<sub>B</sub>T* ln 2, matching the work extracted in one cycle. If reset is eliminated, the register retains the record, and the cycle repeats without reset costs, enabling net work per cycle—but this violates closed-cycle conditions. The debt accumulates indefinitely.  

  ### Case 2: Legitimate Work Extraction  
  Consider two elastically coupled particles in a shared heat bath at uniform *T*, initially correlated (e.g., left particle compressed, right extended). A one-shot process exploits this correlation: (1) Measure the left particle’s state reversibly. (2) Apply conditional feedback: if compressed, allow right particle to expand while coupled to a work reservoir, extracting work. The initial correlation—not the bath—is consumed. The register is not reset; the process ends with particles uncorrelated.  

  **Resource and Condition**: The low-entropy resource is the pre-existing correlation between particles, quantified by mutual information. Work extraction requires consuming such a resource; here, it is converted to work via feedback. This avoids violating thermodynamic principles because the bath alone does not supply the free energy—the initial correlated state does. No net work is possible if particles start uncorrelated.  

  ### Notes  
  1. **Critical Feature in Case 1**: The closed-cycle requirement forces register reset. Without it, indefinite work extraction seems possible, mimicking a violation.  
  2. **Attack and Reply**: If erasure is seen as "mere bookkeeping," one might claim reset costs nothing. Reply: The physical diffusion of the switch during reset requires heat dissipation to the bath, empirically verifying the cost.  
  3. **Demon Necessity**: Case 1 needs no demon—only a conditional mechanism. This shows the core physics is information (correlation) handling, not intelligence.  

  \answer{erasure; pre-existing correlation}
