  **REGULATORY IMPACT ASSESSMENT: FREEMONT VALLEY RESOURCE DEVELOPMENT ACT**  
  **Office of Intergenerational Impact (OII) | Case No. R-7XG42**  
  **Date: 15 November 2048**

  **1. Project Summary**  
  The proposed Fremont Valley Resource Development Act (FVRDA) authorizes subsurface mineral extraction (lithium, cobalt) over a 120-year period, generating an estimated $48B in near-term economic activity. Project operations will result in irreversible aquifer depletion and long-term soil toxicity, reducing regional habitability for post-2100 populations. Expected lifespan reductions for post-2100 residents: 3–7 years. Project alternatives (delayed extraction, remediation protocols) were evaluated per OII Mandate §5(b).

  **2. Analysis of Impacts on Future Persons**  
  2.1. **Affected Population Identification**: The population experiencing reduced welfare (post-2100 Fremont Basin residents) cannot be identified at present. Demographic modeling confirms FVRDA’s resource allocation timeline alters migration patterns, employment opportunities, and reproductive pairings, resulting in a 99.98% variance in the specific individuals conceived after 2100 versus a no-project scenario.  
  2.2. **Comparative Welfare Assessment**:  
  - *Project Scenario (PS)*: Identifiable future persons (FPs) experience moderate welfare reduction (estimated QALY deficit: 12–18%).  
  - *No-Project Scenario (NPS)*: The specific FPs in PS do not exist. Alternative FPs under NPS experience baseline welfare.  
  2.3. **Harm Attribution**: No FP in PS is rendered *worse off than they would otherwise have been*, as the counterfactual (NPS) entails their nonexistence. FPs in PS exist at a welfare level above the "life not worth living" threshold (OII Precedent 2035-B). Thus, PS does not harm identified persons.  

  **3. Standing and Procedural Considerations**  
  3.1. **Legal Standing**: Affected FPs lack standing under the *Intergenerational Rights Act (2029)*, as they are unidentifiable ex-ante and possess no legal identity prior to conception.  
  3.2. **Representation Gap**: The cohort hypothetically advantaged under NPS (i.e., alternative future persons) cannot participate in review proceedings, as they do not exist to assert claims.  

  **4. Conclusion and Recommendation**  
  The FVRDA imposes no actionable harm upon specific, identifiable future persons. The economic and social benefits to existing persons (employment, tax revenue, energy security) are substantial and quantifiable. Alternatives offering higher welfare for FPs are *conceptually incoherent*, as they necessitate the nonexistence of the very population whose welfare is purportedly protected. OII finds no statutory basis to oppose FVRDA.  

  **Recommendation**: Approve with standard mitigation bonds (§12-C).  

  ---

  **REVIEWER COMMENTS (Dr. Aris Thorne, OII Ethics Advisory)**  
  > *Section 2.3 logically consistent with OII framework. Nonetheless, the conclusion feels... wrong. We are licensing significant welfare reduction for persons who will exist, purely because the alternative persons don’t exist to claim they’d have been better off. But if we accept this, what policy *wouldn’t* pass? A project causing greater harm (e.g., 30% QALY loss) would still clear 2.3 if those harmed owe existence to the project. I cannot articulate a procedural objection, yet the outcome seems to violate the spirit of intergenerational equity. Recommend adding a "moral hazard" disclaimer?*  

  **Approved:**  
  *Elara Voss, Director*  
  Office of Intergenerational Impact  

  ---  

  **Accuracy Note (98 words):**  
  Confidence: High. The assessment mirrors core nonidentity logic: the "person-affecting restriction" (only harming existing/identifiable persons counts), the incoherence of comparing welfare across nonexistence, and standing barriers for future persons. The move I’m least sure about is the dismissal of higher-welfare alternative populations as "conceptually incoherent" stakeholders. While the nonidentity problem *does* complicate their moral claim, some philosophers argue we still owe duties to "possible future people" collectively. However, the satire’s bureaucratic framing (prioritizing identifiable plaintiffs) makes this dismissal plausible in a regulatory context, even if philosophically contested.
