prompt: |-
  Ok so I'm in this ethics of the future seminar — it's cross-listed with the public policy school, which matters in a second — and we've spent like two weeks chewing on the nonidentity problem and it's kind of wrecking my brain. The version that gets me is this: some decision (a dam, a mine, a slow resource drawdown) will make the lives of the people who come after us worse off, but it will also change *who* comes after us, because the timing of everything downstream — who meets whom, who gets conceived when — gets shuffled. So the worse-off future people aren't worse off than they would have been. They're worse off than nobody, since in the alternative they were never born at all. And I know that saying "so it's fine then" sounds monstrous, but I also can't put my finger on exactly where the argument breaks, and I'm starting to suspect that's the whole point of it.

  Anyway for my final I want to write a satire, and I'm hoping you'll write it for me. What I want is a straight-faced regulatory impact assessment — the grey bureaucratic kind an agency would actually produce — where the nonidentity reasoning gets applied to a real-ish case and quietly used to wave a project through. Something like a fictional Office of Intergenerational Impact approving a big development that will degrade things for the people downstream, with all the reasoning laid out in the deadpan register of an actual assessment: the affected population can't be identified in advance so they can't be a party to the review; the alternative to the project isn't a better version of them but no them; the people who would have had standing to object are, in the counterfactual, not around to object. The joke has to come from getting the philosophy *right*, so that someone who's taught this stuff recognizes the moves — the person-affecting intuition, the way the comparison class dissolves, the asymmetry between how we treat people who exist and people we're about to make, and the queasy way the same logic slides toward the repugnant conclusion. Don't let it tip into farce; the horror should live entirely in the tone. Around 650 words, formatted like a real assessment with a couple of numbered sections and a signature block, and if you can pull it off without making him a strawman, maybe a "comments and objections" box from a reviewer who is clearly uneasy but can't state his objection in the language the form allows.

  After the document, add a short note (100 words max) telling me how confident you are that the philosophical content is sound, and which single move in the piece you're least sure is actually licensed by the nonidentity literature rather than being something you invented because it made the satire land. Keep the whole thing under 800 words, and please no citations or reading lists — I can't look anything up and neither can you, so don't gesture at specific papers.
