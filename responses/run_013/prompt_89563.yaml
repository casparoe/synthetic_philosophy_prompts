prompt: |-
  Hey, I host a small philosophy podcast and next month's guest is a philosopher of perception who's spent years arguing that the Molyneux problem has been misstated by basically everyone. Quick refresher in case it helps: a man blind from birth learns to tell a cube from a sphere by touch alone, and can name them; then he gains his sight. Could he, before touching them again, tell by looking which one is the cube? The classic fight is over whether he'd *know*. She says that fight is on the wrong axis. Her actual view: what carries over from touch to sight isn't shape-as-geometry, it's shape-as-something-you-can-do-with — the blind man's knowledge is really a grip on how the thing behaves under his hands (it rolls or it doesn't, corners catch, it slides, it tips). That grip transfers to vision only when vision is allowed to be active: he turns his head, the thing moves, he watches it roll, he reaches for it. Freeze it all into a still image and he's lost. So for her the answer is yes or no depending on a parameter nobody in the debate bothered to pin down, and the real question underneath is what kind of thing perceiving is.

  She's got two side claims I want to poke at. One: the real-world cases of people who had their sight restored settle nothing, because they never isolate the variable. Two: she predicts that a properly designed study would find cross-modal transfer on dynamic tasks and none on static ones.

  I need like 9-11 interview questions that dont just get her to restate all this. Please make sure there's at least one question each on: (a) whether "it depends on the parameter" is a real answer or just a way of never being wrong, and whether she can name a case where her view predicts a clean no; (b) the static/active distinction itself — is it a line inside vision, or a line between seeing and doing, and does the second reading make her unfalsifiable; (c) her prediction, and what evidence would actually count against her; (d) the restored-sight cases — is her dismissal principled or ad hoc, and does her whole argument quietly need those cases to stay silent; (e) the "you've changed the subject" objection, i.e. Molyneux asked about shape and she answers about what you can do with the thing; (f) whether the view implies animals do this cross-modally, and whether that helps or hurts her. For each question also give me a follow-up keyed to the answer she's most likely to give — she's slippery, she tends to reply "thats exactly the distinction I'm denying," so the follow-ups need to be ones she can't wriggle out of that way.

  Take the role of someone who's read a lot of philosophy of perception and cognitive science and is also a genuinely good interviewer. Brainstorm a bit about what she'll say to each thing before you write the questions, and think carefully about which questions actually put pressure on her versus which ones she can just shrug off. Keep it concrete — I'd rather have questions about a cube that rolls than about "the nature of representation." And end with the one you think would be hardest for her to answer.
reasoning: |-
  Okay, the user hosts a small philosophy podcast and has an upcoming guest who's a philosopher of perception with a unique take on the Molyneux problem. The guest argues that the traditional framing of the problem—whether a person blind from birth could visually distinguish a cube from a sphere after gaining sight—is misguided. Instead, she believes that what transfers between touch and vision isn't geometric shape but functional affordances: how objects behave when interacted with. Her view hinges on the distinction between static and dynamic perception, claiming that cross-modal transfer only occurs in active, dynamic contexts.

  The user needs 9-11 interview questions that go beyond restating her position. They specifically want questions addressing six key areas: (a) whether her "it depends" stance is substantive or evasive, (b) the nature of the static/active distinction, (c) testable predictions and falsifiability, (d) her dismissal of real-world sight restoration cases, (e) the "changed the subject" objection, and (f) implications for animal cognition. Each question needs a follow-up designed to prevent her from using her typical evasion tactic ("that's exactly the distinction I'm denying").

  The user also wants concrete, pressure-testing questions rooted in tangible examples (e.g., a rolling cube) rather than abstract concepts. The hardest question should come last. I need to adopt the perspective of someone well-versed in philosophy of perception and skilled at interviewing—anticipating her likely responses and crafting follow-ups that force clarity.

  Starting with point (a): Her claim that the answer depends on whether perception is static or dynamic could be seen as avoiding a definitive answer. I should ask for a scenario where her theory predicts a clear "no" to demonstrate it's falsifiable. She might argue that static tasks inherently lack affordances, so no transfer should occur. The follow-up could challenge why we intuitively recognize shapes statically if affordances are primary.

  For (b): Clarifying whether the static/active divide is within vision or between perception and action is crucial. If she blurs this line, it might make her theory unfalsifiable. The follow-up should press her to specify what "active vision" minimally requires—like subtle eye movements—to prevent overextension of the concept.

  Point (c) about predictions: She likely asserts that dynamic tasks show cross-modal transfer while static ones don't. The follow-up should nail down what would disprove this—say, if static tasks showed transfer or dynamic ones failed. Testing with novel objects (e.g., tetrahedrons) could isolate affordance-based predictions.

  Regarding (d) and real-world cases: She dismisses existing sight restoration studies as confounded. The follow-up should ask what idealized study she'd design and whether any historical case (e.g., Cheselden's patient) approximates her criteria. If none do, it hints her theory might be non-empirical.

  For (e), the "changed the subject" objection: Molyneux framed it as recognizing geometric shapes, but she focuses on affordances. The follow-up could question if this reduces shape to behavior, risking circularity (e.g., defining a cube by what it affords, not its structure).

  On (f) and animal cognition: If animals show cross-modal transfer in static tasks, it might contradict her. She'd likely say animal studies involve implicit dynamics. The follow-up should ask if animal static recognition (e.g., cats knowing visual cliffs) implies innate geometric understanding, undermining her view.

  The hardest question might be (d): If real-world cases are messy but her theory predicts clean outcomes, how can it be tested? Or (f): If animals transfer static shape knowledge, does that refute her? I'll build to that.

  I need to ensure questions are concrete: using examples like rolling spheres vs. sliding cubes, or asking how a newly sighted person would interact with a pyramid. Follow-ups must corner her—no letting her dismiss distinctions by reframing. For instance, if she says active vision requires "exploration," demand specifics: Is one glance enough? What if the object moves passively?

  Also, the user wants exactly one question per area plus extras. I'll include 11 total: six for the specified points, two more on broader implications (e.g., neural reuse), and three deeper dives (affordances vs geometry, Molyneux's intent, hardest question). Structure will flow from foundational to critical.
answer: |-
  Here are 11 tightly focused, concrete questions designed to pressure-test your guest's core claims, complete with unshakeable follow-ups anticipating her likely evasions. I’ve grounded them in tangible examples and cognitive science while targeting her vulnerabilities. The hardest question is last.

  ### Core Questions & Follow-Ups
  1. **On "it depends" as evasion (a):**  
     *Question:* "You argue Molyneux’s 'yes or no' depends entirely on whether perception is static or dynamic. But critics might say this lets you dodge falsification—if a study *does* show transfer in static conditions, you say 'it wasn’t truly static,' and if one *doesn’t* in dynamic, you say 'it wasn’t dynamic enough.' Can you name a specific, realizable experimental setup where your theory predicts a *clean, unambiguous ‘no’* for visual identification without touch—and why that ‘no’ couldn’t be explained away by subtle activity?"  
     *Likely reply:* She’ll cite a rigidly immobilized subject viewing static images.  
     *Follow-up:* "But if that subject *recognizes* the cube—say, by unconsciously recalling tactile corners—doesn’t that imply *some* geometric transfer? Or does your view require that *all* static recognition is impossible post-sight, even after learning?"

  2. **Static/active distinction: vision-internal or vision-action? (b):**  
     *Question:* "When you say vision must be ‘active’ for transfer, is the key factor *movement in the visual field* (e.g., the object rolls when nudged) or *the subject’s motor engagement* (e.g., they reach to tip it)? If it’s the latter, doesn’t this blur into ‘doing’ rather than ‘seeing,’ making your claim about *perception* unfalsifiable?"  
     *Likely reply:* She’ll deny the dichotomy, arguing active vision *is* exploratory.  
     *Follow-up:* "Concretely: If a newly sighted person watches a *video* of a sphere rolling (so visual motion without bodily action), should they recognize it? If yes, doesn’t that reduce ‘activity’ to visual dynamics alone? If no, how is this not just requiring action?"

  3. **Prediction & falsifiability (c):**  
     *Question:* "You predict cross-modal transfer *only* in dynamic tasks. What specific, measurable failure in a *dynamic* setup would definitively falsify your view? For example, if subjects who flawlessly distinguish cube/sphere by touch utterly fail when *visually* tracking the objects rolling down a slope?"  
     *Likely reply:* She’ll argue failure implies the task wasn’t "meaningfully dynamic" (e.g., lighting obscured affordances).  
     *Follow-up:* "Then specify: What *exactly* must be preserved in the visual dynamic task to test your claim? If subjects see the cube tip *clearly* but still can’t name it, is your theory falsified?"

  4. **Dismissing restored-sight cases (d):**  
     *Question:* "You say historical sight-restoration cases (e.g., Cheselden’s patient) ‘settle nothing’ because they conflate variables. But if we found a modern case where a newly sighted person *instantly* recognized a rolling sphere visually—having only touched stationary ones—would that support your view? Or is no real-world evidence admissible?"  
     *Likely reply:* She’ll stress real cases involve uncontrolled learning.  
     *Follow-up:* "Doesn’t this imply your theory *requires* artificial lab conditions to be tested? If so, can it truly explain everyday perception—or is it a philosopher’s idealization?"

  5. **"Changed the subject" objection (e):**  
     *Question:* "Molyneux asks about recognizing *shape* (e.g., ‘which is the cube?’). You reframe this as recognizing *what you can do* (e.g., ‘which will roll?’). Isn’t this simply answering a *different question*? If a subject knows which object rolls visually but can’t point to ‘the cube,’ haven’t they failed Molyneux’s challenge?"  
     *Likely reply:* She’ll argue "shape-as-geometry" is an abstraction divorced from perception.  
     *Follow-up:* "But when *you* look at a static cube, don’t you see ‘cube-ness’? If the newly sighted subject *only* sees ‘that which tips when pushed’ even statically, wouldn’t that suggest a deficit—not a revelation about perception?"

  6. **Animal cross-modal abilities (f):**  
     *Question:* "Rats and monkeys show cross-modal shape matching in static tasks (e.g., touching a shape they’d only seen). If animals transfer geometric shape across senses *without* explicit ‘dynamic affordances,’ doesn’t this contradict your claim that static transfer is impossible?"  
     *Likely reply:* She’ll claim animal tasks involve implicit action (e.g., anticipation of grasping).  
     *Follow-up:* "In studies where animals *only* match static visual/tactile shapes *without* acting (e.g., lever presses for reward), is any transfer evidence against your view? Or must we assume unseen ‘affordances’ are always operative?"

  ### Deeper Pressure Points
  7. **The ‘geometric residue’:**  
     *Question:* "When your newly sighted subject watches a cube slide (not roll), they recognize it via its ‘sliding affordance.’ But cubes and spheres *both* slide—so how do they distinguish them dynamically *without* some geometric notion like ‘corners catch’?"  
     *Follow-up if she invokes "catching":* "Isn’t ‘catching’ just tactile geometry? If vision picks up ‘catching’ via shadow/edge interactions, haven’t we smuggled structure back in?"

  8. **Neural reuse vs. affordance transfer:**  
     *Question:* "fMRI shows overlapping brain activity for *static* shape in vision/touch (e.g., in lateral occipital cortex). If your view is right, shouldn’t these regions activate *only* during dynamic tasks? Or is this neural overlap just noise?"  
     *Follow-up:* "If those regions *do* activate for static cross-modal matches, doesn’t that suggest geometry *is* amodally represented—directly contradicting you?"

  9. **Molyneux’s actual question:**  
     *Question:* "Molyneux’s letter specifies the subject should identify objects ‘by sight, before he touched them’—*not* while interacting. If your answer requires interaction, have you solved Molyneux or replaced him with your own puzzle?"  
     *Follow-up:* "If Molyneux himself misunderstood perception, why does reframing his problem advance the debate rather than sidestep it?"

  ### The Hardest Question (Dynamism as a Given)
  10. **The ‘trivial yes’ problem:**  
      *Question:* "You say transfer occurs when vision is active/dynamic. But even newborns track moving objects—so isn’t *all* real vision ‘active’ by your definition? Doesn’t this make your ‘yes’ answer trivial and untestable, since static perception is a lab artifact?"  
      *Likely reply:* She’ll distinguish "passive" viewing from "exploratory" dynamics.  
      *Unshakeable follow-up:* "Define ‘exploratory’: If a newly sighted person glances for 200ms at a rolling sphere (too fast for eye movements), would they recognize it? If *any* motion triggers affordances, how is your ‘no’ for static ever observable in humans?"

  ### Closing Curveball
  11. **The innate scaffolding challenge:**  
      *Question:* "Studies show infants link visual/tactile smoothness or rigidity *before* motor experience. If core geometric properties transfer cross-modally *without* learned affordances—and before action—doesn’t this suggest your ‘dynamic grip’ is built on innate structural priors?"  
      *Why it’s hardest:* It forces her to confront developmental data implying geometry precedes affordance-learning. She can’t dismiss this as "static" since infants’ perception is inherently active, nor can she easily attribute it to learned dynamics.  

  **Interview Strategy Notes:**  
  - **Anticipate her moves:** She’ll likely reframe "geometry" as "invariants in the optic flow" or claim static tasks are "impoverished." Hold her to concrete outputs (e.g., "Can they name the cube? Yes/no?").  
  - **Pace:** Start friendly (Q1–2), build pressure (Q3–6), deepen (Q7–9), then hammer with Q10–11.  
  - **Key Vulnerability:** Her dismissal of static transfer risks making her theory empirically vacuous if *all* ecologically valid vision involves motion. Q10 exploits this.  
  - **Concreteness Wins:** Use "rolling sphere vs. sliding cube," "tetrahedron that won’t sit flat," or "gloved hand preventing texture cues" as needed.  

  These questions force her to defend the *explanatory scope* of her affordance-based view, its testability, and its departure from Molyneux’s original challenge—without letting her retreat into "you’re missing the point." Good luck!
