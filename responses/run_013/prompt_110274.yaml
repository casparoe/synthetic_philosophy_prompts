  I'm in a second-year history of philosophy course and we've just hit the end of the Sixth Meditation. I can follow the doubt and the cogito well enough on its own, but there's a passage near the end that's throwing me. As I understand it, Descartes says that he is not present in his body the way a sailor is present in a ship, but that he is tightly joined and, as it were, mixed up with it, so that he and his body make up one thing. Or something like that—I don't have the exact wording in front of me, and I might be mangling the simile. My problem is that this seems to sit badly with what the cogito is supposed to have established. If the cogito proves that I am a thinking thing, and if I can clearly and distinctly understand myself as a thinking, non-extended thing while understanding body as extended and non-thinking, then why does Descartes turn around and insist that I'm not just a mind lodged in a body but a genuine unity with it? Is the cogito only supposed to prove that I exist whenever I think, and not that my essence is to think? Or does it prove the essence claim too, and then the union passage is a separate, maybe weaker, claim about experience? I keep going back and forth.

  Could you help me untangle this? I'd like the answer in five parts, in this order. 1) Restatement: a short plain-English restatement of what Descartes is actually claiming in that sailor passage, one paragraph. 2) What the cogito proves: an explanation of what the cogito is supposed to prove and what it is not supposed to prove, two paragraphs, being clear about the difference between existing as a thinking thing and being essentially a thinking thing. 3) The union in the Sixth Meditation: a reconstruction of how the union claim fits into the overall argument of the Sixth Meditation, two paragraphs, including why Descartes needs it after the real distinction argument. 4) Objection and reply: the strongest objection you can think of to that move, and what Descartes would likely say back, two paragraphs. 5) Bottom line: given all that, what should I think the cogito actually proves about the self, and how much does the union passage qualify it, a few sentences. I'm not after a reading list or citations—just help seeing how the pieces are supposed to fit together.
