   Now, if everyone cooperates, each gets: (E - C) + (M * n * C) / n = E - C + M*C = E + C*(M-1)
   If everyone defects, each gets E.

   So if M>1, then everyone is better off if everyone cooperates. But again, the dominant strategy is to defect.

