  We are going to design an activity that uses a public goods game (which is an n-player prisoner's dilemma) and run it at two different group sizes to show that the superrational choice flips. We'll set up the payoffs so that for a small group, defecting (free-riding) is the dominant strategy in the non-superrational view, but superrationality might suggest cooperating if the group is small enough. Then for a larger group, we'll set the parameters so that superrationality suggests defecting. The key is that the superrational reasoning says: "since everyone is in the same situation and will reason the same way, we will all do the same thing. Therefore, I should choose the action that yields the best outcome when everyone does it."

   Let me set up the public goods game:

   Each player has an endowment of E tokens.
   They can choose to contribute any integer number of tokens (including 0) to a public pot, or they can keep them.
   The public pot is multiplied by a factor M (where 1 < M < n, so that the total pot is M times the sum of contributions) and then divided equally among all n players.

   So the payoff for a player i who contributes c_i is:
     Payoff_i = (E - c_i) + (M * total_contributions) / n

   In this setup, the dominant strategy (without superrationality) is to contribute 0, because the return from the public pot for each token you contribute is M/n, which is less than 1 (since M < n). So you get less than 1 token back for each token you contribute, meaning you are better off keeping it.

   However, if everyone contributes all E tokens, then each player gets:
     (E - E) + (M * n * E) / n = 0 + M * E
   And if everyone contributes 0, each gets E.

   So if M * E > E (i.e., M>1), then everyone is better off if everyone contributes everything than if everyone contributes nothing. But because of the free-rider problem, the Nash equilibrium is for everyone to contribute 0.

   Now, superrationality: if we assume that everyone will do the same as me, then we have two possibilities: either everyone contributes E or everyone contributes 0.

   Then the payoff for me if I choose to contribute (and thus everyone does) is M * E.
   The payoff if I choose not to contribute (and thus everyone doesn't) is E.

   So if M > 1, then M*E > E, so the superrational choice is to contribute.

   But note: this reasoning leads to contributing regardless of n and M (as long as M>1). However, we want a flip. How can we get a flip?

   We have to adjust the setup. The above reasoning assumes that the only two symmetric options are contribute everything or contribute nothing. But in reality, players can choose any amount. However, the superrational reasoning can be extended to continuous choices? That might be too complex.

   Alternatively, we can use a binary choice: contribute ALL or NOTHING. Then the above reasoning holds. But then we don't get a flip because M>1 always leads to contributing.

   We need a different setup. Let me consider a variation:

   Instead of a continuous contribution, let's make it binary: each player chooses either to COOPERATE (contribute a fixed amount C) or DEFECT (contribute 0). Then:

   If a player defects, they keep their entire endowment E and also get a share of the public pot.
   If a player cooperates, they pay a cost of C (so they have E - C left) and then get the share of the public pot.

   The public pot is the sum of all contributions multiplied by M, then divided equally.

   So for a player:
     If they defect: payoff = E + (M * total_contributions_by_others) / n
     If they cooperate: payoff = (E - C) + (M * (C + total_contributions_by_others)) / n

   Now, the difference in payoff if k other players cooperate (and the rest defect) is:

     Defect: E + (M * k * C) / n
     Cooperate: (E - C) + (M * (k+1) * C) / n

   The difference (Defect - Cooperate) = [E + (M * k * C)/n] - [(E - C) + (M * (k+1) * C)/n]
   = E + (M k C)/n - E + C - (M (k+1) C)/n
