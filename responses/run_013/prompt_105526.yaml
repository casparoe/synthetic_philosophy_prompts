  ### **Superrationality Activity Design: "The Group Contribution Game"**

  #### **Overview**
  This activity uses a public goods game to create an *n*-player Prisoner's Dilemma. Participants choose to **Cooperate (C)** or **Defect (D)** in two rounds with different group sizes. The payoffs are designed so that:  
  - In **small groups (n=5)**, superrationality (symmetric reasoning) favors **defection**.  
  - In **large groups (n=15+)**, superrationality favors **cooperation**.  
  The flip in outcomes forces participants to confront how group size changes the rational choice, and a group size of **n=6** creates ambiguity where symmetric reasoning fails.

  ---

  ### **Rules & Setup**  
  **Materials**:  
  - Paper/online forms for choices.  
  - Calculator for payoffs (or pre-made spreadsheet).  
  - Points tracked publicly (whiteboard/screen).  

  **Stakes**:  
  Points convert to coffee/snacks (e.g., 10 points = $1 value).  

  **Key Numbers**:  
  - **Endowment**: Each player starts with **10 points** per round.  
  - **Cost of Cooperating (C)**: Lose **5 points**.  
  - **Benefit of Cooperating**: Each cooperator gives **1 point** to **every other player** in their group.  

  **Payoffs**:  
  - **Defect (D)**: Keep your 10 points + (1 point × number of *other* cooperators).  
  - **Cooperate (C)**: (10 - 5) + (1 point × number of *other* cooperators) = **5 points** + (others' cooperation).  

  **Group Sizes**:  
  - **Round 1 (Small Groups)**: Groups of **5 players** (if uneven, one group of 6).  
  - **Round 2 (Large Group)**: Entire class as one group (**15–18 players**).  

  **Symmetric Outcomes**:  
  | Group Size | All Cooperate | All Defect | Rational Superrational Choice |  
  |------------|---------------|------------|-------------------------------|  
  | **n=5**    | 5 + 4 = **9** | **10**     | Defect (10 > 9)               |  
  | **n=6**    | 5 + 5 = **10**| **10**     | Indifferent (tie)             |  
  | **n=15**   | 5 + 14 = **19**| **10**    | Cooperate (19 > 10)           |  
  *(Example: For n=5, if all cooperate, each gets 5 base + 4 points from 4 others = 9. If all defect, each gets 10.)*  

  ---

  ### **Timeline (90 Minutes)**  
  **0–10 min: Introduction & Rules**  
  - Explain the game: *"You’ll play two rounds. In each, decide privately: COOPERATE or DEFECT. Your choice affects your points and others’. Group size changes each round."*  
  - Clarify payoffs with examples:  
    - *"In a 3-player group:*  
      *- If you defect and both others cooperate: 10 + 2 = 12 points.*  
      *- If you cooperate and both defect: 5 + 0 = 5 points."*  
  - Emphasize: **No communication** during decisions.  

  **10–20 min: Round 1 (Small Groups, n=5)**  
  - Split into groups of 5 (or 6 if needed).  
  - Players submit choices anonymously.  
  - **Collect data**: Tally cooperators/defectors per group.  

  **20–30 min: Round 2 (Large Group, n=15+)**  
  - Announce: *"Now, everyone is in one large group."*  
  - Players submit choices.  
  - **Collect data**: Tally total cooperators.  

  **30–50 min: Calculate & Reveal Results**  
  - **Round 1 (Small Groups)**:  
    - For each group, announce:  
      - Number of cooperators (C), defectors (D).  
      - Payoffs:  
        - **Defector**: 10 + (1 × C)  
        - **Cooperator**: 5 + (1 × [C - 1])  
  *(e.g., If 3 cooperate in a group: Cooperators get 5 + 2 = 7; Defectors get 10 + 3 = 13.)*  
  - **Round 2 (Large Group)**:  
    - Announce total cooperators (C).  
    - Payoffs:  
      - **Defector**: 10 + (1 × C)  
      - **Cooperator**: 5 + (1 × [C - 1])  

  **50–90 min: Debrief & Discussion**  

  ---

  ### **Debrief (40 Minutes)**  
  **1. Surface Reactions (5 min)**  
  - Ask:  
    - *"In Round 1 (small groups), why did you choose C or D?"*  
    - *"In Round 2 (large group), did your strategy change? Why?"*  
  - **Goal**: Highlight intuitive pulls (e.g., *"I defected because I worried others wouldn’t cooperate"* vs. *"I cooperated because everyone benefits"*).  

  **2. Map to Superrationality (15 min)**  
  - **Symmetry in Action**:  
    - *"What if everyone in your group did the SAME as you? Let’s compare outcomes."*  
    - Show symmetric outcomes table (above).  
    - **Reveal the flip**:  
      - Small groups (n=5): All defect (10) > All cooperate (9) → **Defect is rational**.  
      - Large groups (n=15): All cooperate (19) > All defect (10) → **Cooperate is rational**.  
  - **Key Insight**:  
    - Superrationality isn’t "always cooperate." It asks: *"If everyone mirrors me, which choice gives the best group outcome?"*  
    - **Why the flip?**  
      - Cooperating costs you **5 points** but gives **1 point to each other player**.  
      - In small groups, your cost (5) > total benefit to others (1 × 4 = 4).  
      - In large groups, your cost (5) < total benefit to others (1 × 14 = 14).  

  **3. Where Symmetry Breaks Down (10 min)**  
  - Pose: *"What if your group had exactly 6 players?"*  
    - Symmetric outcome: All cooperate (10) = All defect (10).  
  - Ask: *"What should a superrational player do here?"*  
    - **Conflict**: No unique best choice! Symmetric reasoning fails.  
    - **Deeper point**: Superrationality works when one symmetric outcome dominates. When outcomes tie (or are equal), the logic collapses.  

  **4. Connect to Prisoner’s Dilemma (10 min)**  
  - **Standard view**: *"Defect always pays more individually."*  
  - **Superrational view**: *"If your counterpart reasons identically to you, you both choose the same action. Cooperate yields a better shared outcome (if parameters allow)."*  
  - **Caveat**: This assumes perfect symmetry in knowledge/rationality. Reality is messier!  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Participants defect in large groups (n=15) despite superrational cooperation being optimal.  
     - **Why**: Mistrust or focus on individual payoff ("Defecting still pays more if others cooperate").  
     - **Fix**: In debrief, contrast:  
       - *Individual* payoff if others don’t mirror you (e.g., defecting while others cooperate).  
       - *Symmetric* payoff (all mirror you). Ask: *"Which scenario feels more relevant if everyone is identical?"*  

  2. **Problem**: Confusion over payoffs (e.g., "Do I benefit from my own cooperation?").  
     - **Fix**: Reiterate rules with examples before each round. Use consistent phrasing: *"You get 1 point for every other cooperator."*  

  3. **Problem**: Group size n=6 dilutes the "flip" moment (symmetric outcomes tie).  
     - **Fix**: Explicitly use n=6 to showcase symmetry’s failure. Ask: *"Would you cooperate or defect here? Why isn’t the answer obvious?"*  

  ---

  ### **Limitations of the Activity**  
  - **What it doesn’t replicate**: The core assumption that players are in **identical epistemic positions**. Participants may not fully internalize that others are "mirroring" their reasoning.  
    - **How to address**: Explicitly state in debrief: *"Superrationality requires that your counterpart is as rational and informed as you. The activity simulates this with symmetry, but real life adds noise."*  
  - **What it simplifies**: The activity assumes binary choices. Real superrationality applies to continuous decisions (e.g., how much to contribute), but we sacrifice this for clarity.  

  ### **Why This Design?**  
  - **Flip at n=6**: Unexpected (most expect cooperation to get harder in large groups).  
  - **Breakdown moment**: Natural pivot from "symmetric reasoning works" to "it doesn’t."  
  - **Gut-level pull**: Points create stakes; group-size contrast forces cognitive dissonance.  

  ---  
  **Final Tip**: Run rounds quickly to keep energy high. Use the debrief to validate frustrations ("But defecting still pays more!") and redirect to symmetric logic.
