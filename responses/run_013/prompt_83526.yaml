prompt: |-
  I am assembling seminar materials on performance legitimacy — the claim that a government's record of delivering prosperity, security, and order is itself a ground of political legitimacy, sufficient to justify authoritarian rule. Before we assess any particular defense of that claim, I want its specification written out: what must a theory of political legitimacy be able to do before the performance argument counts as settled rather than assumed? Give me the desiderata, each with the case or consideration that motivates it — the cases the theory must get right, the distinctions it may not collapse, and the results it must remain consistent with. Keep legitimacy distinct from mere stability, from legality, and from the bare fact that people believe the regime legitimate. Three demands I especially want addressed: first, that the theory handle a regime that is broadly successful yet built on the systematic sacrifice of a small, disfavored group; second, that it say what becomes of legitimacy when the performance on which it was founded ends; and third, that it confront the fact that any performance comparison presupposes a counterfactual about how the country would otherwise have fared, which no one can observe. The cases usually cited are Singapore and China under reform, but treat them as illustrations rather than evidence. Mark which requirements are non-negotiable and which are commitments of a particular camp, and identify any pair that cannot be jointly satisfied — that is the part I most need. Leave the competing theorists to me.
reasoning: |-
  Okay, the user is assembling seminar materials on performance legitimacy and needs a clear specification of what a theory of political legitimacy must achieve before accepting performance as a valid basis for legitimacy. They specifically want desiderata, each motivated by cases or considerations, and they've highlighted three critical demands: handling regimes that succeed by sacrificing a minority, addressing legitimacy after performance ends, and confronting counterfactual problems. They also emphasize distinguishing legitimacy from stability, legality, and belief.

  First, I need to unpack the core challenge. Performance legitimacy argues that effective governance (prosperity, security, order) justifies authoritarian rule. But the user wants to know what a theory must do to properly evaluate this claim without circularity. The key is setting rigorous criteria that prevent performance from being a self-justifying loop.

  The three highlighted demands are crucial. For the sacrifice of minorities, think of cases like Singapore's marginalized migrant workers or China's Uighurs. The theory must reject legitimacy if success hinges on oppression, but performance-based theories might struggle with this if they focus solely on aggregate outcomes. This clashes with moral intuitions about equal protection.

  For legitimacy post-performance, consider the Arab Spring: regimes like Mubarak's Egypt were seen as legitimate until economic downturns exposed their fragility. A good theory must explain why legitimacy shouldn't vanish overnight if performance dips, or why it might persist despite failure. This tests whether performance creates enduring legitimacy or just contingent compliance.

  The counterfactual problem is thorny. When we say "China's growth justifies its system," we're implicitly comparing it to hypothetical alternatives—maybe democratic India or chaotic Russia. But since we can't observe these alternatives, the claim is unfalsifiable. The theory needs a way to ground comparisons without speculative histories.

  Beyond these, the user wants strict separation between legitimacy and related concepts. Stability is descriptive (people don't rebel), while legitimacy is normative (they shouldn't rebel). Legality is about rules, legitimacy about moral rightness. Belief is sociological, not philosophical. Collapsing these would confuse might with right.

  I should also note tensions. For example, demanding that legitimacy endure beyond performance (say, through institutions) might conflict with performance purism. Or insisting that minority sacrifices void legitimacy could clash with utilitarian approaches that tolerate small harms for greater good. Highlighting these trade-offs is vital for the seminar's critical edge.

  Finally, non-negotiables: anti-collapse principles (stability ≠ legitimacy), moral constraints (no legitimacy through oppression), and avoiding circularity (performance can't justify itself without independent criteria). The rest are contestable—e.g., how much endurance matters or how to handle counterfactuals—depending on whether one leans toward liberal or consequentialist ethics.
answer: |-
  Here is a specification of desiderata for a theory of political legitimacy aiming to rigorously evaluate the "performance legitimacy" claim for authoritarian regimes. Each desideratum includes its motivating case or consideration, with non-negotiables marked **(NN)** and tensions highlighted. Theorists like Rawls, Raz, Weber, Beetham, and Sen are implicitly engaged, but left for your exploration.

  **Core Non-Negotiables: Anti-Collapse & Anti-Circularity (NN)**
  1.  **Distinguish Legitimacy from Stability:** The theory *must not* equate a regime's factual persistence (stability) or lack of overt rebellion with legitimacy. *Motivation:* A brutal regime (e.g., North Korea) can be stable through terror but illegitimate. Legitimacy implies a *right* to rule, not just effective coercion.
  2.  **Distinguish Legitimacy from Legality:** The theory *must not* equate conformity to the regime's own positive laws with legitimacy. *Motivation:* Apartheid South Africa or Nazi Germany operated "legally" by their own statutes. Legitimacy requires justification *beyond* mere internal proceduralism.
  3.  **Distinguish Legitimacy from Subjective Belief:** The theory *must not* reduce legitimacy solely to widespread popular *belief* in legitimacy. *Motivation:* Populations can be systematically misled, propagandized, or habituated to oppression (e.g., historical caste systems). Legitimacy must involve normative justification, not just sociological fact.

  **Performance-Specific Desiderata (Motivated by Key Challenges):**
  4.  **Define "Performance" Non-Arbitrarily:** The theory must specify *what constitutes success* (prosperity? security? for whom?), *over what timeframe*, and *against what baseline*. *Motivation:* "Prosperity" could mean GDP growth (China) or broad-based development (Costa Rica). Security could mean low crime (Singapore) or suppression of dissent. Without definition, "performance" is vacuous. *(Commitment: Specific performance theorists define this; non-negotiable is that *some* definition is required).*
  5.  **Address the Counterfactual Problem:** The theory must grapple with the inherent unobservability of the counterfactual ("how *would* we have fared otherwise?"). It cannot simply assume the authoritarian regime is uniquely responsible for successes or that alternatives would have failed. *Motivation:* Claims like "China's growth *required* the CCP" or "Singapore's order *needed* PAP control" are foundational but speculative. The theory needs a method for plausible counterfactual assessment (e.g., comparative analysis, institutional theory) or must acknowledge this as a severe limitation. *(NN: Must confront the problem; specific solutions vary by camp).*
  6.  **Handle the "Sacrificed Minority" Case:** The theory must adjudicate whether a regime achieving broad prosperity/security/order *through the systematic sacrifice or oppression of a specific minority group* (e.g., Uighurs in Xinjiang contributing to China's "stability," low-wage migrant workers underpinning Singapore's prosperity without full rights) can be legitimate. *Motivation:* This tests whether performance legitimacy can override fundamental rights or distributive justice. Utilitarianism might allow it; deontological theories almost certainly reject it. *(NN: Must address this conflict explicitly; the *resolution* is camp-dependent).*
  7.  **Address Legitimacy's Duration & Demise:** The theory must explain what happens to legitimacy *when the performance justifying it ceases or reverses* (e.g., economic collapse, loss of security). Does legitimacy evaporate instantly? Persist based on past performance? Transform? *Motivation:* The Arab Spring challenged regimes (Egypt, Tunisia) whose performance legitimacy eroded. If legitimacy vanishes solely with performance, it's merely contingent stability. If it persists, what is its basis? This tests if performance creates *enduring* legitimacy or merely contingent compliance. *(Commitment: Theories vary - e.g., institutionalization might prolong legitimacy; pure output legitimacy would fade).*
  8.  **Avoid Performance Self-Justification (Circularity):** The theory *must not* allow "performance" itself to be the sole and sufficient justification for the *authority structure* that produced it, without independent criteria. *Motivation:* This is the core risk of performance legitimacy claims: "We are legitimate because we deliver; we deliver because of our (authoritarian) system; therefore our system is legitimate." This is circular. The theory needs external benchmarks for evaluating *both* the performance *and* the means/morality of the regime achieving it. **(NN)**
  9.  **Specify the Scope of Performance's Justificatory Power:** The theory must clarify *what aspects of rule* performance justifies. Does good performance justify:
      *   *Specific policies*? (Plausible)
      *   *The ruling group/party*? (Common claim)
      *   *The *authoritarian structure itself***? (The core claim needing scrutiny)
      *   *The suspension of rights/procedures*? (Often implied)
      *Motivation:* Performance legitimacy arguments often subtly shift from justifying outputs to justifying the entire authoritarian edifice and its illiberal methods. The theory must prevent this sleight of hand.

  **Critical Tensions (Where Desiderata Conflict):**

  *   **Sacrificed Minority vs. Performance Purism (Des. 6 vs. Des. 4/8):** A strictly utilitarian/"ends justify the means" performance theory (focusing solely on aggregate outcomes defined by Des. 4) *could* accept sacrificing a minority as a legitimate cost for the greater good. However, this directly conflicts with desiderata demanding non-circularity (Des. 8 - which requires external morality) and potentially collapses legitimacy into mere stability/effectiveness (violating Des. 1/2/3). **A theory satisfying Des. 6 (morally rejecting minority sacrifice) likely cannot be a *pure* performance theory; it must incorporate independent moral constraints (e.g., basic rights, non-discrimination).** Pure performance logic struggles here.

  *   **Enduring Legitimacy vs. Performance Contingency (Des. 7 vs. Des. 4/8):** If legitimacy is *solely* based on current performance (Des. 4), it vanishes when performance falters (Des. 7 - "evaporates"). However, this makes legitimacy extremely fragile and arguably indistinguishable from contingent compliance/stability (risking Des. 1). To argue legitimacy *endures* past performance (Des. 7 - "persists/transforms"), the theory needs an *additional basis* beyond performance – e.g., institutionalization, consent generated during good times, or a "reserve" of legitimacy. This moves beyond pure performance legitimacy. **A pure performance theory struggles to explain enduring legitimacy post-performance without introducing non-performance elements.**

  *   **Counterfactual Requirement vs. Practical Feasibility (Des. 5):** Rigorously satisfying Des. 5 (counterfactuals) is inherently difficult/impossible. Theories must either:
      *   Develop sophisticated (but contestable) methods for plausible counterfactuals (e.g., institutional comparative analysis), risking bias.
      *   Acknowledge the deep epistemic problem, weakening the justificatory force of performance claims.
      *   Retreat into ideological assertion ("our way is *obviously* best").
      **There is no fully satisfying resolution; theories choose how to manage this inherent weakness.**

  **Summary of Non-Negotiables (NN):**
  1.  Stability ≠ Legitimacy.
  2.  Legality (internal) ≠ Legitimacy.
  3.  Subjective Belief ≠ Legitimacy.
  4.  Avoidance of Performance Self-Justification/Circularity.
  5.  Explicit Confrontation of the Counterfactual Problem.
  6.  Explicit Handling of the "Sacrificed Minority" Case.

  **Key Commitments Varying by Camp:**
  *   Definition of "Performance" (Des. 4).
  *   Method for handling Counterfactuals (Des. 5).
  *   Resolution of the "Sacrificed Minority" dilemma (Des. 6 - pure utilitarianism vs. rights-based constraints).
  *   Explanation of Legitimacy's Duration/Demise (Des. 7 - contingent vs. enduring).
  *   Scope of Justificatory Power (Des. 9 - outputs vs. structures).

  This specification forces the performance legitimacy thesis to confront its core vulnerabilities: circularity, moral blind spots (minority rights), historical contingency, and the unprovable counterfactual. A robust defense must navigate these tensions without collapsing legitimacy into mere effectiveness or popular acquiescence. Use Singapore and China as test cases *against* these desiderata, not as proof.
