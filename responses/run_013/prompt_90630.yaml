prompt: |-
  I'm a novelist — three books, no philosophy training — and I'm stuck on a character problem that I'm fairly sure is secretly the Sartre thing. The vocabulary I actually think in is craft vocabulary: wants vs. needs, backstory as explanation, arc, scene vs. summary, free indirect discourse, the unreliable narrator, the difference between a character's reason and their motive. What I want: take Sartre's claim that we're radically free — that existence precedes essence, and that bad faith is the flight from that freedom into a fixed identity — and restate it as faithfully as you can in those terms, move by move. Then the residue report. Which bits translate cleanly into how a novelist builds a person, which ones I'd have to fudge or distort, and which have no counterpart in my vocabulary at all. My real question is the one the translation keeps running into: in a novel every choice the character makes is one I made, so is there any room left for the freedom Sartre is talking about, or does the whole thing collapse into authorial puppet show — and if it does, is that a failure of my vocabulary or a real problem with his? Dont be polite about it. If the translation fails because my vocabulary is missing something, name the thing. But if the question as I've posed it is confused, or if this just cant be done well, tell me that straight instead of handing me a tidy answer.
reasoning: |-
  Okay, the user is a novelist with three books under their belt, no formal philosophy training, and they're stuck on a character problem they suspect ties into Sartre's ideas. They want Sartre's concepts—radical freedom, existence preceding essence, bad faith—translated into their craft vocabulary. They also want a residue report: what parts translate cleanly, what needs fudging, and what has no counterpart. The real question is whether character freedom in a novel is possible since every choice is made by the author. Does this collapse into a puppet show? And if so, is it a vocabulary failure or a problem with Sartre?

  First, I need to unpack Sartre's key ideas. Radical freedom means humans are free to choose their actions without being determined by past or external factors. Existence precedes essence: we exist first and define ourselves through choices. Bad faith is denying this freedom by adopting fixed identities or societal roles. 

  Now, mapping to novel-writing terms. Wants vs. needs: wants are conscious desires, needs are deeper, unacknowledged drives. In Sartrean terms, needs could relate to the fundamental desire to avoid freedom. Backstory explains past events but shouldn't determine current choices if we're sticking to radical freedom. Character arc might show a shift from bad faith to authenticity or vice versa. Scene vs. summary: scenes could dramatize moments of choice, highlighting freedom, while summary might cover deterministic backstory. Free indirect discourse and unreliable narrators could illustrate bad faith by showing self-deception.

  Residue report: Translating radical freedom cleanly is tough because characters are author-determined. The character's experience of freedom is simulated through narrative techniques. The philosophical weight of "existence precedes essence" might not fully translate—characters are bound by the author's essence-setting. Bad faith as a lie to oneself works well with unreliable narration. But Sartre's idea that bad faith requires freedom clashes with characters being puppets.

  The core issue: authorial control vs. character freedom. The novelist creates the illusion of freedom. Vocabulary isn't missing; it's about fictional ontology. Maybe the solution is accepting that characters are constructs but treating their choices as "free" within the story's framework. The user should focus on portraying the struggle with freedom rather than actual freedom. Highlighting moments where characters confront choices can evoke Sartrean themes without solving the puppet problem. Emphasize that the tension itself is productive for the story.
answer: |-
  Here’s the raw translation of Sartre into craft terms, followed by a residue report that tackles your puppet-show question head-on. No politeness, no tidy lies.

  **Sartre’s Moves in Novelist Vocabulary:**

  1.  **Radical Freedom (Existence Precedes Essence):**
      *   **Craft Translation:** *The character’s past (backstory) is not their fate.* Their "essence" (who they *are* – coward, hero, victim, villain) isn’t pre-written. It’s defined *retroactively* by the choices they make *now*, in the present moment of the scene. Every scene presents an **active choice**, not just a reaction dictated by backstory. Their "need" (often unconscious) is to *avoid acknowledging this terrifying freedom*.
      *   **Scene-Level Focus:** Show moments where the character *could* act differently, even if subtly. The weight is on the *choosing*, not just the outcome dictated by plot. Use **scene** (real-time action/dialogue/thought) to dramatize the *anguish* or *evasion* of choice. **Summary** risks implying determinism ("Of course she did that, given her past...").

  2.  **Bad Faith (Flight from Freedom):**
      *   **Craft Translation:** This is the character clinging to a fixed **"want"** (or stated motive) that masks their deeper **"need"** to escape responsibility for their freedom. They adopt a rigid **role** (The Loyal Soldier, The Dutiful Wife, The Hardened Criminal, The Victim of Circumstance) as an excuse. Their *stated reason* for an action is often a socially acceptable mask for the *motive* of fleeing anxiety. This is prime territory for the **unreliable narrator** (lying to themselves) or **free indirect discourse** (revealing their self-deception through subtle narrative voice).
      *   **Backstory's Role:** Backstory explains *why* they adopted this role (e.g., trauma taught them safety lies in playing the victim), but it does **not** justify their *continued* refusal to choose authentically *now*. It’s the backstory *as shield*, not backstory *as destiny*.

  3.  **The Moment of Authenticity (Confronting Freedom):**
      *   **Craft Translation:** The character **arc** hinges on moments where the mask slips. They glimpse the void of their freedom and the possibility of choosing differently. This is terrifying. It might look like paralysis, a breakdown, or a seemingly "out of character" act. The **"need"** shifts from evasion to confronting the burden of self-creation. The **unreliable narrator** might fracture here, revealing glimpses of truth beneath the lies.

  **Residue Report: Where the Translation Grinds & The Puppet Show Problem**

  1.  **Translates Cleanly (Surprisingly Well):**
      *   **Bad Faith as Character Mechanism:** This is gold. The gap between stated **want/reason** and the true **motive** (escaping freedom's anguish) maps perfectly onto craft concepts of subtext, unreliable narration, and internal conflict. Showing a character clinging to a fixed **role** defined by backstory is standard novelistic stuff.
      *   **"Existence Precedes Essence" as Narrative Principle:** The idea that a character is defined by *present choices*, not predetermined by backstory, is *how good character-driven plots work*. Backstory provides context and pressure, but the character *must* act *now*. This justifies focusing on **scene** over **summary** for key choices.
      *   **Anguish of Choice:** Dramatizing the *weight* of a decision, the feeling that "I could do X *or* Y, and nothing forces me," is a core novelistic technique. **Free indirect discourse** excels here.

  2.  **Requires Fudging/Distortion:**
      *   **Radical Freedom's Boundlessness:** Sartre's freedom is near-absolute (constrained only by facticity – physical limits, death). In a novel, character choices are *always* constrained by **plot**, **genre**, **theme**, and **your authorial intent**. You *must* fudge this. The illusion of boundless choice is created by presenting *meaningful alternatives within the story's constructed world*. You simulate radical freedom by making choices feel significant and non-inevitable *to the character and reader*, even if you plotted it all along.
      *   **The Source of "Need":** In Sartre, the fundamental "need" is ontological – to be God (a fixed essence) or to flee the anguish of not being God. Novelistic "needs" are usually psychological/spiritual (love, security, purpose, redemption). You distort by mapping the ontological terror onto these psychological needs. The character's "need" to avoid freedom manifests as clinging to a destructive psychological need (e.g., "need for security at all costs" masking "terror of free choice").

  3.  **No Clean Counterpart (The Real Sticking Points):**
      *   **Consciousness Itself:** Sartre's freedom is rooted in non-reflective consciousness preceding thought. Novelistic vocabulary deals with **thoughts, feelings, motivations, actions** – the *products* of consciousness, not its pre-reflective structure. You can't directly show this. You imply it through the *gap* between action and justification, or the raw feeling of choice before rationalization (using **scene** and sensory detail).
      *   **The Author in the Machine (Your Core Question):** This is where your vocabulary *isn't* missing anything. **It's the fundamental, unresolvable tension between Sartre's philosophy and fiction.** Sartre posits a subject creating itself through unconditioned choice. In a novel, *every aspect of the character is a choice made by the author*.
      *   **The Puppet Show Problem Isn't Solvable:** It's a real ontological problem, not a vocabulary failure. Your character *is* a puppet. Their "radical freedom" is a simulated effect, an *illusion you meticulously craft*.
      *   **Why It Doesn't *Have* to Collapse (But It's Always Fragile):**
          *   **Authorial Bad Faith is the Danger:** The collapse happens *if you write deterministically*. If every choice is *obviously* dictated by backstory, plot mechanics, or your heavy-handed theme, then yes, it's a puppet show contradicting Sartre. If you use backstory only as context, not cause, and make choices feel organic, surprising (yet believable) *within the character's developing nature*, you sustain the *illusion* of their freedom.
          *   **Freedom as *Experience*, Not Ontology:** Your craft vocabulary is about creating the *reader's experience* of the character's freedom and anguish. Does the reader *feel* the character could choose differently in key moments? Does their bad faith feel like a trap they *could* break, even if they don't? This is where **scene**, **free indirect discourse**, and showing internal conflict are vital. You make the reader *believe* in the character's freedom *as if it were real*, even though you know it's not.
          *   **Sartre as Lens, Not Blueprint:** You use Sartre to deepen your understanding of *human* freedom and self-deception. You then use your *craft* to create characters who *manifest* that understanding believably within the *constructed reality* of your novel. Their freedom is fictional, but the *portrayal* of the struggle with freedom can be authentic.

  **The Brutal Answer to Your Real Question:**

  Yes, the character is your puppet. Sartrean radical freedom **cannot exist** for a fictional character in an ontological sense. The entire thing **does** risk collapsing into an authorial puppet show **if you write poorly** – if your characters feel like plot functions or mouthpieces, if their choices feel inevitable and mechanical.

  **However, this is NOT a failure of your vocabulary or a fatal flaw in Sartre. It's the nature of fiction.**

  *   **Your Vocabulary's Job:** Your craft terms are tools to create the *convincing illusion* of freedom, choice, and bad faith *for the reader*. They are perfectly suited for this. They describe *how* character works *in narrative*, not in metaphysical reality.
  *   **Sartre's Value:** He gives you a profound framework for understanding the *human condition* your characters are *simulating*. He clarifies the *stakes* of choice and the mechanisms of self-deception. He pushes you to write characters whose choices feel *weighty* and non-inevitable, whose bad faith is *active* cowardice, not passive fate.
  *   **The Escape Hatch (Sort Of):** Focus on the *character's experience*. Within the fictional world *you* built, does *the character* feel anguish at their freedom? Do they struggle with choices? Do they actively lie to themselves? If you make this experience vivid and believable using your craft (**scene, FID, unreliable narrator, wants vs. needs**), then the *reader* will experience the *meaning* of Sartre's ideas through the character, even though the character is your creation. The character's *sense* of freedom (or their flight from it) becomes the vehicle for the theme.

  **Conclusion:** Don't try to make your character *be* radically free. That's impossible. Use Sartre to understand the human terror and evasion of freedom. Then use your novelist's craft to **make your puppet *convincingly struggle* with the strings you've attached, making the audience forget they're strings at all.** The residue isn't garbage; it's the friction that generates the story's heat. The puppet show is inevitable; your skill determines whether it feels like real life.
