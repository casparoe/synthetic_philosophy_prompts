  2) Superfluous thought: About the category error in requiring moral justification for non-moral motivations

  The "criterion/decision-procedure" distinction only partially addresses the first objection while ignoring the second. This explains their group's stalemate - they're using one tool on two different problems.

  The third point about reasons-structure is crucial. The debate hinges on whether "she is my wife" functions as:
