answer: |-
  Your impasse is a beautifully articulated specimen of philosophical gridlock, and I suspect the frustration comes from recognising that both sides have hold of something true, but about different things. Let’s dissect the disagreement as it plays out in your back room, then diagnose its structure. I’ll engage with the actual moves you describe, avoid caricature, and be frank about what progress might—or might not—look like.

  ### 1. The Two Arguments Under One Name: Integrity vs. Superfluous Thought  
  You’re right to suspect these are distinct objections, and conflating them muddies the waters. Williams’ "saving one’s wife" example serves both, but they cut differently:  
  - **Integrity Objection Proper**: This is *existential*. It claims impartialist morality (e.g., utilitarianism or Kantianism) threatens the agent’s "ground projects" (e.g., love for one’s spouse) by demanding they be subordinated to impersonal demands. The worry is *what the agent must become*: a self-alienated calculator who treats personal commitments as contingent inputs. The unit of assessment here is the *agent’s character* or *life as a whole*.  
  - **Superfluous-Thought Complaint**: This is *deliberative*. It argues that forcing the agent to justify saving his wife via impartialist grounds (e.g., "I’m permitted to prioritise her") *misdescribes his actual reason* ("she’s my wife"). The thought isn’t just burdensome; it’s *inappropriate* to the situation. The unit here is the *moment of decision*, and the complaint is about *how reasons function in deliberation*.  

  The **criterion/decision-procedure distinction** (CDP) only engages the Integrity Objection superficially. It says: "You can *act* from love while an impartial *theory* judges your act right." But this doesn’t touch the Superfluous-Thought Complaint. For Williams, the man’s reason ("she’s my wife") isn’t just *psychologically prior* to impartial justification—it’s *normatively sufficient*. Inserting the CDP reply risks turning the personal reason into a *placeholder* for impartial permission, which still distorts the phenomenology.  

  ### 2. The Nature of the Disagreement  
  This isn’t verbal; it’s a **substantive clash over the purpose and scope of moral theory**, rooted in divergent intuitions about normativity:  
  - **Your Kantian/Decision Theorist Opponents** likely hold:  
    - Moral theories are primarily *evaluative frameworks* (criteria of rightness).  
    - Deliberation can (and often should) be "theory-lite" to avoid paralysis.  
    - The unit of assessment is the *act* (e.g., "saving your wife was permissible").  
    - Intuition: Morality’s job is to set boundaries; personal reasons operate *within* those boundaries.  
  - **Your Williams-Leaning Side** likely holds:  
    - Moral theories must be *action-guiding* without distorting our deepest reasons.  
    - Deliberation reveals normative structure; if a theory can’t be "thought in," it’s defective.  
    - The unit of assessment is the *agent’s practical identity* (e.g., "what it means to be a husband").  
    - Intuition: Personal relationships generate *sui generis* reasons, not just exemptions.  

  **Where the Sides Talk Past Each Other**:  
  - Your opponents see CDP as a *solution* (it resolves the Integrity Objection by separating evaluation from psychology). You see it as *evading* the Superfluous-Thought Complaint (it doesn’t explain why "she’s my wife" needs no justification).  
  - They think the debate is about *permissibility* ("Is saving his wife allowed?"). You think it’s about *description* ("What is his actual reason?").  

  ### 3. The Third Possibility: Reasons vs. Exemptions  
  This is the crux. The disagreement is **substantive metaethics disguised as moral psychology**:  
  - **Exemption View** (likely your opponents): "She’s my wife" is not a *positive reason* but a *negative condition*: it defeats the *pro tanto* duty to be impartial. The impartial framework is primary; personal ties are exceptions.  
  - **Reasons View** (Williams): "She’s my wife" *is* the primary reason—a *source* of normative force. Impartial morality is the interloper, demanding justification where none is needed.  

  This isn’t about "psychology" alone; it’s about **whether the normative authority of personal commitments derives from or precedes impartial morality**. Williams thinks morality gets its grip *from* such commitments; your opponents think morality sits in judgment *over* them.  

  ### 4. Is Progress Possible? Diagnosing the Impasse  
  The gridlock stems from **competing foundational intuitions** neither side can argue for directly:  
  - One side intuits that morality must be *universal* (hence impartial criteria are sovereign).  
  - The other intuits that morality must be *lived* (hence personal reasons are sovereign).  

  This makes the question **hard but not ill-posed**. The CDP distinction *feels* like progress to your opponents because it preserves universalism while accommodating psychology. To you, it feels like a dodge because it sidesteps the normative authority of the personal.  

  ### What Would Count as Progress?  
  A. **Disambiguate the Objections**: Frame discussions as:  
     - "Does impartial morality *demand too much* of our identities?" (Integrity)  
     - "Does it *misdescribe our reasons* in personal contexts?" (Superfluous Thought)  
     This prevents CDP from masquerading as a solution to both.  

  B. **Interrogate the Exemption vs. Reason Structure**: Push the table to argue:  
     - *If* "she’s my wife" is merely an exemption, why does it feel like a positive reason?  
     - *If* it’s a reason, how does it relate to impartial demands (e.g., in cases of nepotism)?  
     This shifts from psychology to metaethics—where the real dispute lies.  

  C. **Change the Question**: Instead of "Can the agent use CDP?", ask: **"What would a moral theory look like that took personal reasons as *foundational*?"** (e.g., ethical particularism, Williams’ "relativism of distance"). This might reveal whether your opponents object to Williams’ *description* or his *normative vision*.  

  D. **A Formal Result?** Unlikely. But a **diagnostic concession** might help:  
     - Consequentialists/Kantians could grant that *in this specific case*, "she’s my wife" is sufficient *without* needing impartial grounding—but argue this is a *local* feature of intimate relationships, not a global challenge to impartialism.  
     - Williamsians could grant that CDP *sometimes* works (e.g., in policy decisions) but fails when personal integrity is at stake.  

  ### Frankly: Will This Unstick Your Pub Table?  
  Probably not decisively. The dispute runs too deep. But progress *could* look like:  
  - Recognising that **CDP answers Integrity but not Superfluous Thought**.  
  - Admitting that **"Is ‘she’s my wife’ a reason or an exemption?"** is the root question.  
  - Agreeing that **no theory can satisfy both intuitions fully**—so the choice is which to privilege.  

  That last point might be the bittersweet end: some disagreements are between **rival conceptions of morality’s task**, and resolution requires choosing which intuition to abandon. You might leave the pub not with consensus, but with a clearer map of the fault lines. And sometimes, that’s all philosophy can offer—apart from the next round.
