  Below is a runnable game designed to embody Lewis's account of convention without naming it, followed by a debrief and critical notes.

  ---

  ### **Game: "The Color Match"**  
  **Objective:** Players aim to maximize points by coordinating color choices with others, without communication.  

  #### **Materials**  
  - 40 cards: 20 blue, 20 green (or two distinct colored papers/slips).  
  - Whiteboard to track rounds, choices, and payoffs.  
  - Timer (60 seconds per round).  

  #### **Rules & Payoff Scheme**  
  - **Players:** 20 students.  
  - **Rounds:** 8 rounds total.  
  - **Choices per round:** Each player *privately* chooses **blue** or **green**.  
  - **Payoffs (no real money):**  
    - Players earn points based on group coordination:  
      - If you choose the **majority color**, you get **10 points** × the % of players matching you (e.g., if 15/20 match you: 10 × 75% = 7.5 points).  
      - If you choose the **minority color**, you get **0 points**.  
    - In ties (e.g., 10–10), everyone gets 5 points.  
  - **Secrecy:** Players never reveal individual choices. Only group totals are shared after each round.  

  #### **Sequence of Rounds**  
  1. **Rounds 1–4 (Establishing a convention):**  
     - Play normally. Announce totals and payoffs after each round.  
     - *Likely outcome:* Random initial split (e.g., 12 blue, 8 green in Round 1). By Round 4, the group converges on one color (e.g., 19 blue, 1 green) due to payoff incentives.  

  2. **Round 5 (Newcomer shock):**  
     - Introduce a "newcomer" (select one student secretly). They **miss Rounds 1–4** (sit outside or close eyes).  
     - Newcomer chooses *without knowing prior rounds' results*.  
     - Play Round 5: Regular players continue; newcomer chooses freely.  
     - *Likely outcome:* Newcomer often picks the minority color (e.g., green), earning 0 points while others earn high points.  

  3. **Rounds 6–8 (Payoff shift):**  
     - **Announce rule change:** *"Green now gives +2 bonus points if you choose it. Blue gives no bonus."*  
     - Payoffs adjust:  
       - **Green:** `(10 × % matching you) + 2`  
       - **Blue:** `10 × % matching you` (no bonus).  
     - *Note:* If all switch to green, everyone earns **12 points** (max possible). If all stay blue, everyone earns **10 points**.  
     - Play Rounds 6–8: Observe if the group shifts to green.  

  ---

  ### **Debrief: Mapping the Game to Lewis's Account**  
  *(Reveal "convention" only at the end. Mark **✓** for settled points; **?** for contested.)*  

  1. **Emergence without agreement/authority (✓):**  
     - *Game moment:* The group converged on one color (e.g., blue) by Round 4 without any discussion or leader.  
     - *Lewis link:* Conventions arise from repeated interactions in coordination problems, not explicit agreements.  

  2. **Arbitrariness (✓):**  
     - *Game moment:* Blue "won" by chance in Round 1. If green had been the initial majority, convergence would have occurred identically.  
     - *Lewis link:* A convention is arbitrary because another regularity (green) would have worked just as well.  

  3. **Self-enforcement & perceived justification (✓):**  
     - *Game moment:* After convergence, players stuck with blue because deviating (e.g., choosing green) meant 0 points. The newcomer in Round 5 learned this harshly.  
     - *Lewis link:* Conventions are self-policing—players conform because it’s in their interest *given others’ behavior*. The "rightness" of blue emerges from its success.  

  4. **Stickiness (✓):**  
     - *Game moment:* In Rounds 6–8, most likely stayed with blue *even though everyone would earn more in green*. Switching required coordinated risk—no one wanted to be the first (and get 0 points).  
     - *Lewis link:* Conventions persist despite inefficiency because unilateral deviation is costly.  

  ---

  ### **Critical Gaps & Contested Issues**  
  **What the game cannot reproduce (must be supplied by you):**  
  1. **Common knowledge vs. mutual expectation (?):**  
     - The game shows mutual expectation ("I expect others to choose blue") but **not common knowledge** ("I know that you know that I know..."). Lewis requires common knowledge (✓), but scholars like Bicchieri argue mutual expectation suffices (?).  
     - *Supply this:* Discuss whether players truly *knew* others knew blue was entrenched, or just guessed.  

  2. **Normativity ("ought") gap:**  
     - Players followed blue for self-interest, **not moral obligation**. Real conventions (e.g., traffic rules) feel "binding." Lewis avoids normativity (✓), but Gilbert argues conventions inherently imply "we ought" (?).  
     - *Supply this:* Ask, "Did anyone feel they *should* choose blue, or was it pure self-interest?"  

  **Contested Debrief Points (flag these):**  
  - "Are conventions exhausted by coordination problems?"  
    - Lewis: **Yes** (✓). Critics: No—some conventions (e.g., etiquette) lack payoff structures (?).  
  - "Does arbitrariness hold universally?"  
    - Lewis: **Yes**—any convention is replaceable (✓). Critics: Some conventions (e.g., metric system) are non-arbitrary due to efficiency (?).  

  ---

  ### **Predictable First-Run Problems**  
  1. **Slow convergence:** If initial rounds are ties (10–10), convergence may take until Round 4–5. *Fix:* Gently note payoff differences to nudge decisions.  
  2. **Newcomer conformity:** The newcomer might coincidentally pick the majority color. *Fix:* Secretly prompt them to "choose randomly" to increase minority choice odds.  
  3. **Successful shift to green:** If 3+ players switch to green early in Round 6, a cascade may occur. *Use this:* Highlight how coordination (not just preference) drives change.  

  ---

  ### **Why This Works**  
  - **Low prep:** Only cards and a whiteboard needed.  
  - **Embodied learning:** Students *feel* arbitrary convergence, self-enforcement, and stickiness.  
  - **Debrief flexibility:** Explicitly marks settled/contested issues, avoiding dogma.  

  This primes students to read Lewis with visceral insight into coordination, arbitrariness, and inertia—while openly flagging where philosophy takes over.
