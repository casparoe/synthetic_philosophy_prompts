prompt: |-
  My friend started a game theory course this term and now every single argument we have ends with him saying you can't play a dominated strategy, said like it's a law of nature rather than a piece of advice. Last night it was about this stupid 3x3 thing and I want to write down what he actually claimed before I go back at him, because I kept saying "that's basically cheating" and he kept saying "thats literally the definition".

  My payoffs, my rows U, M, D against his columns L, C, R:

  U: 3, 0, 1
  M: 0, 3, 1
  D: 1, 1, 0

  He says D is dominated so I should never play it, even though neither U nor M on its own beats D against all three of his columns. His argument is that the 50/50 coin flip between U and M beats D in every column, and that that counts. Is that actually what "dominated" means? And if it is, what's the difference between "dominated" and "never a best response"? He used the two like they were the same sentence and I have a feeling they're not. (He also said his own payoffs don't matter for whether my strategy is dominated, which I think is right, but confirm that.)

  Then he escalated. He said you delete stuff like that, then assume the other guy is rational and does the same, and that he knows you know he's rational, and so on forever, and you just keep deleting until one thing is left and that's what you play. He said the order you delete in doesn't matter for strict domination but does for weak, and that with weak domination you can delete an actual equilibrium right out of the game. He also said that in a zero-sum game dominance reasoning gets you the whole answer, which I don't buy, because matching pennies has nothing to delete and the answer is still a coin flip.

  So: lay out for me the different precise things "you can't play a dominated strategy" could be claiming, as a menu. Which readings are trivial, which are real theorems, which quietly need assumptions about what I believe about him and about how much he believes about me, and which are just false. For each, tell me whether it actually gets him what he was using it for, which was basically "so the only rational thing for you to do here is X". And say where iterated elemination and never-a-best-response come apart, if they do.
reasoning: |-
  Okay, the user is dealing with a friend who's taking game theory and keeps insisting "you can't play a dominated strategy" as if it's an absolute rule. The core of their argument is about a specific 3x3 game where the friend claims the user's strategy D is dominated and should never be played. The user is skeptical and wants to clarify the technical definitions and validity of these claims before responding.

  First, I need to analyze the payoff matrix provided by the user. The payoffs are:
  - U: (3, 0, 1) against L, C, R
  - M: (0, 3, 1) against L, C, R
  - D: (1, 1, 0) against L, C, R

  The friend argues D is dominated because a 50/50 mix of U and M yields higher payoffs against every column. Against L: (3+0)/2=1.5 > 1; against C: (0+3)/2=1.5 > 1; against R: (1+1)/2=1 > 0. This satisfies strict dominance by a mixed strategy. 

  But the user questions whether "dominated" includes mixed strategies or only pure. The technical definition does include mixed strategies - this is crucial. The friend is correct that D is strictly dominated by the mixed strategy (0.5U, 0.5M). 

  The user also questions if "dominated" equals "never a best response." These aren't equivalent. In this game, against a fixed column:
  - Against L: U gives 3 (best), D gives 1
  - Against C: M gives 3 (best), D gives 1
  - Against R: both U and M give 1, D gives 0 - so D isn't best against any pure column

  But if the opponent plays mixed strategies, D could potentially be a best response to some mixtures, though in this case it's not. The key point is dominated implies never best response, but not vice versa. 

  The friend also claims iterated deletion order doesn't matter for strict domination but does for weak. This is correct - strict domination is order-independent, while weak isn't. Weak domination can indeed delete equilibria, which is problematic. 

  For zero-sum games, the friend claims dominance solves everything. But matching pennies has no dominated strategies, so dominance doesn't help find the mixed equilibrium. The friend overgeneralized here. 

  The user wants a "menu" of interpretations for "can't play dominated strategy":
  - Trivial: It's definitionally inferior - true but useless alone
  - Rationality: Requires common knowledge of rationality to justify deletion
  - Iterated: Needs common knowledge for multiple rounds
  - Equilibrium: False that dominance always finds equilibria
  - Zero-sum: Only true for dominance-solvable games

  The friend's application in this specific game is correct - D is dominated and shouldn't be played. But their broader claims about zero-sum games and equilibrium are overstated. 

  I should emphasize where iterated deletion and "never best response" diverge: After deletion, remaining strategies may still not be best responses to anything. And some never-best-response strategies aren't dominated (though that requires larger games).

  The user's instinct about "cheating" with mixed strategies is understandable but technically incorrect - game theory does include mixed dominance. However, the friend's absolutism about "never play dominated strategies" oversimplifies the underlying assumptions about mutual rationality.
answer: |-
  Let's break down your friend's claims with precision. **Your skepticism is warranted**—while the core idea is sound, your friend is overstating and oversimplifying game theory. Here's the full "menu" of interpretations for "you can't play a dominated strategy," along with clarifications on iterated elimination and best responses.

  ---

  ### **1. The Specific 3x3 Game: Is D Dominated?**
  **Payoff Matrix (Your Payoffs Only):**
  |       | L     | C     | R     |
  |-------|-------|-------|-------|
  | **U** | 3     | 0     | 1     |
  | **M** | 0     | 3     | 1     |
  | **D** | 1     | 1     | 0     |

  **Claim:** D is strictly dominated because a mixed strategy (50% U, 50% M) beats D against every column.  
  **Verification:**  
  - Against L: (0.5×3) + (0.5×0) = 1.5 > 1  
  - Against C: (0.5×0) + (0.5×3) = 1.5 > 1  
  - Against R: (0.5×1) + (0.5×1) = 1 > 0  
  **Conclusion:** D is **strictly dominated** by the mixed strategy (U:0.5, M:0.5). This is correct.  
  **Key Point:** "Dominated" includes domination by *mixed strategies* (not just pure). Your friend is right on this.  

  ---

  ### **2. "Dominated" vs. "Never a Best Response"**
  - **Strictly Dominated Strategy:**  
    There exists *another strategy* (pure or mixed) that gives a **strictly higher payoff** against *every possible play* by the opponent.  
    - *Theorem:* If a strategy is strictly dominated, it is **never a best response** to any belief about the opponent's play.  
    - *In your game:* D is strictly dominated → never a best response.  

  - **Never a Best Response (NBR):**  
    A strategy that is never optimal, *no matter what* you believe the opponent does.  
    - *Crucial Distinction:* **All strictly dominated strategies are NBR, but not all NBR strategies are strictly dominated.**  
    - *Example where NBR ≠ Dominated:* In larger games, some strategies are NBR but not dominated (e.g., in games with "spurious" best responses). Your 3x3 game lacks this, but it's possible.  

  **Bottom Line:** Your friend conflated terms, but in this case, they align. Dominance implies NBR; NBR does not imply dominance.  

  ---

  ### **3. Iterated Elimination of Dominated Strategies (IEDS)**
  **Your Friend's Claims:**  
  - Delete dominated strategies → assume rationality/common knowledge → repeat.  
  - Order doesn't matter for strict domination; does for weak.  
  - Weak domination can delete equilibria.  
  - In zero-sum games, dominance "gets the whole answer."  

  **Assessment:**  
  | Claim | Verdict | Explanation |
  |-------|---------|-------------|
  | **Delete in order, assume rationality/common knowledge** | True | IEDS requires **common knowledge of rationality**: You know he's rational, he knows you know, etc. |
  | **Order irrelevant for strict domination** | True | Strictly dominated strategies can be deleted in any order → same result. |
  | **Order matters for weak domination** | True | Weakly dominated strategies (e.g., payoff ties) may delete different outcomes depending on order. |
  | **Weak domination can delete equilibria** | True | Weak IEDS can eliminate Nash equilibria. Example: Game with two equilibria, one deleted by careless elimination. |
  | **Zero-sum games: dominance solves everything** | **False** | Only true for **dominance-solvable games** (e.g., your 3x3). Counterexample: Matching Pennies has no dominated strategies → requires mixed equilibrium. |

  ---

  ### **4. "You Can't Play a Dominated Strategy": The Menu of Interpretations**
  Here's what the phrase could mean, and its validity:

  | Interpretation | Status | Assumptions Needed | Validity in Your Game |
  |----------------|--------|---------------------|------------------------|
  | **1. Definitional:** "Dominated" means "always worse than some alternative." | Trivial Truth | None | Correct, but useless without justification. |
  | **2. Rationality-Consistent:** No rational player *chooses* a dominated strategy. | True | Individual rationality (you maximize your payoff). | Valid: Playing D is irrational. |
  | **3. Belief-Based:** You shouldn't play D because *you believe* he might play anything. | Theorem | Belief that opponent plays *some* strategy (no restrictions). | Valid: D loses to U/M mix regardless of his play. |
  | **4. IEDS Justification:** Delete D first, then solve the reduced game. | True | Common knowledge of rationality (+ payoff structure). | Valid: After deleting D, U and M are symmetric → mixed strategy equilibrium. |
  | **5. Equilibrium Selection:** Dominance identifies the *only* rational outcome. | **False** | None (overreach). | Fails: IEDS leaves U and M, but no pure equilibrium. Equilibrium is mixed (U:50%, M:50%). |
  | **6. Zero-Sum Panacea:** "In zero-sum games, dominance always finds the solution." | **False** | Only when the game is dominance-solvable. | Fails: Matching Pennies requires mixed strategies; no dominance exists. |

  ---

  ### **5. Where Iterated Elimination and "Never Best Response" Diverge**
  - **After IEDS:** Remaining strategies may **still not be best responses** to anything plausible. Example: In the deletion process, you might eliminate strategies that *would* be best responses to beliefs eliminated later.  
  - **NBR survives IEDS:** Strategies that are never best responses *can persist* after IEDS if not strictly dominated.  
  - **Key Insight:** IEDS assumes common knowledge of rationality. "Never best response" is a weaker condition (only about your beliefs).  

  ---

  ### **Conclusion: Was Your Friend Right?**
  - **In your 3x3 game:** Correct that D is strictly dominated and irrational to play.  
  - **Overreach:**  
    - Claiming dominance ⇒ "the only rational thing" is wrong. Here, U and M both survive (equilibrium is mixed).  
    - Asserting zero-sum games are "solved by dominance" is false (e.g., Matching Pennies).  
    - Conflating "dominated" with "never best response" is sloppy (though aligned here).  
  - **Core Truth:** Under common knowledge of rationality, IEDS *is* valid for strict dominance. But it's a tool, not a physical law.  

  **How to respond:**  
  > "D *is* dominated by your U/M mix, so I won't play it. But after deleting D, there's no pure equilibrium—I need to randomize 50/50 between U and M. Also, zero-sum games like Matching Pennies aren't 'solved' by dominance. Stop treating game theory like the Ten Commandments."  

  This shuts down his overconfidence while conceding the (narrow) technical win.
