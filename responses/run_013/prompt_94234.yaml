answer: |-
  Here's your Q&A prep sheet, prioritizing objections by damage potential and audience segment. Weak points in your position are flagged in **bold**, with strategic concessions marked.

  ---

  ### **Highest Damage: Computational Neuroscientists**  
  1.  **Objection (Skeptical Modeler):** "Why waste time dissecting Φ's internal consistency? It's not even a *functional* measure. It doesn't predict behavior, learning, or cognitive capacity. Your 'boundary drift' is just rearranging deck chairs on the Titanic – the whole ship is pseudomathematical. Show me one real-world system where Φ correlates with *anything* measurable besides itself."  
      *   **Your Reply (2 min):** "Fair – Φ isn't predictive of cognition, and I agree it's computationally intractable for real brains. But that's *why* my critique matters: IIT's clinical traction (via PCI derivatives) creates false legitimacy. My point is that *even if* we grant IIT's goals, its core machinery is incoherent. Exposing that incoherence protects against misapplying oversimplified Φ-proxies in *your* models. This isn't about saving IIT; it's about preventing bad metaphysics from contaminating computational work."  
      *   **Soft Spot:** You concede Φ's empirical emptiness but still rely on its theoretical claim to relevance via PCI. If pressed hard on "Why not ignore IIT entirely?", your structural critique feels academic. **Concede:** "Φ has no proven role in cognition." **Hold:** "PCI's success ≠ validation of IIT's ontology."

  ### **High Damage: Experimentalist (Sympathetic but Practical)**  
  2.  **Objection (Clinician):** "You dismiss Φ, but PCI – based *directly* on IIT’s postulates – reliably distinguishes conscious states in patients. Doesn't that prove the *combined* theory works where it counts? Your 'two-bridge' feels like a philosopher's toy. In clinical practice, we *get* clear answers."  
      *   **Your Reply (2 min):** "PCI is valuable pragmatically, but it doesn't validate IIT's metaphysics. PCI measures *differentiation* and *integration* of neural responses – concepts compatible with many theories (e.g., GNWT, PP). It likely works because it tracks *access* consciousness, not IIT's phenomenal claims. My point is that the axioms alone (e.g., 'consciousness is integrated') could justify PCI *without* the baggage of Φ and exclusion. IIT's clinical utility doesn't rescue its foundational flaws."  
      *   **Soft Spot:** You lack a clear account of *why* PCI works if not via Φ+exclusion. **Concede:** "PCI is a clinically useful tool." **Hold:** "Its success is orthogonal to IIT's *ontological* claims about consciousness."

  ### **Moderate Damage: Philosophers (Diverging Paths)**  
  3.  **Objection (Illusionist):** "Your critique buys into IIT's framing mistake: that consciousness is a 'thing' with 'boundaries' to be measured. Boundary drift shows the absurdity of reifying consciousness as a physical property. Why not drop the axioms too and accept consciousness is a computational illusion?"  
      *   **Your Reply (2 min):** "I largely agree the 'boundary' problem stems from reification. But my target is narrower: showing IIT *internally* fails by its own lights. Even if consciousness is illusory, IIT claims it's real and measurable. Its failure to do so consistently is diagnostic. The axioms are defensible *only* as descriptors of the illusion's properties, not a foundation for Φ."  
      *   **Soft Spot:** Your position assumes consciousness *can* be described by axioms, which the illusionist rejects. **Concede:** "Reification is problematic." **Hold:** "IIT's internal inconsistency undermines it *even if* consciousness is real."

  4.  **Objection (Panpsychist):** "Exclusion isn't 'bolted on' – it's *essential* to resolve combination problems. Without it, you get absurd universal consciousness. Your 'two-bridge' case just shows reality has nested conscious entities. Why is that a flaw? IIT embraces this!"  
      *   **Your Reply (2 min):** "Exclusion *solves* a real problem but is *inconsistent* with the axioms. Axioms like 'intrinsic existence' suggest consciousness is fundamental and ubiquitous, yet exclusion artificially suppresses it in overlapping complexes. In 'two-bridge', *both* complexes exist intrinsically, yet IIT picks one arbitrarily. If consciousness is fundamental, exclusion is ad hoc suppression, not principled metaphysics."  
      *   **Soft Spot:** Panpsychists *want* nested consciousness. Your "arbitrary" claim relies on intuition that overlapping consciousness is absurd – which they deny. **Hold:** "Exclusion contradicts intrinsic existence."

  ### **Sneaky Damage: Computational Neuroscientists (Follow-Up)**  
  5.  **Objection (Modeler):** "You say the axioms are defensible without Φ. But stripped down to 'consciousness is integrated/differentiated', they're vacuously compatible with *any* theory (PP, GNWT). What's left of IIT worth saving? Why not junk it all?"  
      *   **Your Reply (2 min):** "Precisely – the axioms are minimal descriptors, not a theory. Their value is in *constraining* future measures: any viable theory must account for integration, etc. IIT's error was grafting on Φ as the *only* quantifier. Jettisoning Φ lets us keep useful phenomenological guardrails without IIT's baggage."  
      *   **Soft Spot:** This makes your "defensible half" seem trivial. **Bold Weakness:** **You haven't shown these minimal axioms add value beyond common sense.**

  ---

  ### **The Question You Hope Nobody Asks**  
  **Experimentalist or Modeler:** "If Φ/exclusion are incoherent and axioms are toothless descriptors, what *positive* framework/testable measure do you propose instead to replace IIT in explaining consciousness?"  
  *   **Why it hurts:** You’ve offered a critique, not an alternative. Your position is purely negative.  
  *   **Reply (Bluff):** "My goal today is diagnostic, not prescriptive. But progress requires clearing conceptual deadwood. Predictive frameworks like PP already handle dynamics IIT misses, without Φ's problems."  
  *   **Honest Note:** This is soft. You have no rival measure. **Concede:** "I lack a replacement measure." **Deflect:** "But PP offers a more robust framework for neural correlates."

  ---

  ### **Strategic Summary**  
  - **Concede Cheaply:** Φ’s computational irrelevance, PCI’s clinical utility, reification worries.  
  - **Hold Firm:** Exclusion’s inconsistency with axioms, Φ’s disconnect from phenomenology, PCI’s independence from IIT metaphysics.  
  - **Weakest Point:** **The value of the "defensible axioms" alone is underspecified and risks being trivial.** Prepare examples (e.g., how axioms rule out feedforward networks as conscious).  
  - **Audience Play:** Leverage the illusionist to dismiss IIT’s framing, use the clinician’s pragmatism to decouple PCI from Φ, and corner the panpsychist on exclusion vs. intrinsic existence.
