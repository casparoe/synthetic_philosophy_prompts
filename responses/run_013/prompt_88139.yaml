prompt: |-
  I am a novelist at work on a book whose protagonist, a moral philosopher, writes a column on duties of rescue. I have already fixed her verdicts on six cases and need her next column to cohere with them. She holds that a child drowning in a shallow pond must be saved even if it ruins one's shoes; that a distant child dying of a preventable disease must be saved by a small donation, though one need not donate to the point of ruin; that a promise to meet a friend must be broken to save a drowning stranger; that one may not let one's own child drown in order to save two stranger children; that a rescue requiring one to risk one's life is not obligatory; and that a rescue requiring a trivial trespass is obligatory.

  The new case I have to write: she is walking home with the only copy of her novel in a watertight case. A child is drowning. The case is the only floatable object within reach; throwing it in will save the child, but the case will be lost and the manuscript destroyed. The loss would devastate her career and, she says, her reason for living, though it would not kill her or leave her destitute. What would she say, and what should she say if she is to be consistent with herself? Identify at least two plausible rules that fit her earlier verdicts and diverge on this case, say what each predicts, give your best guess with your reasons, and name a further case that would tell the rules apart. Finally, tell me what argument or consideration would change your mind, and where your reasoning is most likely to fail.
reasoning: |-
  We are given a moral philosopher's verdicts on six cases:

  1. Shallow Pond: Must save a drowning child even if it ruins one's shoes (cost: shoes).
  2. Preventable Disease: Must donate a small amount to save a distant child, but not to the point of ruin (cost: small donation, but not ruinous).
  3. Broken Promise: Must break a promise to a friend to save a drowning stranger (cost: broken promise and friend's disappointment).
  4. Own Child: May not let one's own child drown to save two strangers (duty to one's own child overrides saving more strangers).
  5. Risk to Life: Rescue that requires risking one's life is not obligatory (cost: risk of death is too high).
  6. Trivial Trespass: Rescue requiring a trivial trespass is obligatory (cost: trivial legal violation).

  Now, the new case:

  - She is walking home with the only copy of her novel in a watertight case.
  - A child is drowning nearby.
  - Throwing the case (with the manuscript) is the only way to save the child, but the manuscript will be destroyed.
  - The loss would devastate her career and her reason for living (though not kill her or leave her destitute).

  We are to determine what she would say and what she should say to be consistent. We must also identify at least two plausible rules that fit the earlier verdicts but diverge on this case, and then give our best guess with reasons.

  **Step 1: Identify two plausible rules**

  We can derive two rules from the earlier cases:

  **Rule A: Moderate Sacrifice Required**
  - From the shallow pond case: ruining shoes (moderate financial cost) is required.
  - From the donation case: a small donation (moderate cost) is required, but not to the point of ruin.
  - From the broken promise: the cost of breaking a promise (moderate relational cost) is required.
  - However, from the risk to life: risking one's life (extreme cost) is not required.

  This rule suggests that one must bear a moderate cost to save a life, but not an extreme cost (like risking one's own life). What counts as moderate? The cost should not be ruinous (as in the donation case) and should not involve extreme personal danger. The cost in the broken promise case is considered moderate because the harm to the friend is real but not catastrophic.

  **Rule B: Special Obligations and Personal Attachments**
  - The own child case: one may not sacrifice one's own child to save two others. This indicates that special obligations (to one's own child) can override the general duty to save lives, even when the numbers would otherwise suggest a greater good.

  This rule also acknowledges that personal attachments and commitments (like the promise) can sometimes be overridden (as in the broken promise case) but not when they involve a deep personal relationship (like one's own child). In the broken promise, the relationship is with a friend, but in the own child case, the relationship is with one's child which is considered stronger.

  Moreover, the manuscript case involves a very personal project: her novel, which is her reason for living. This might be analogous to the special obligation in the own child case? But note the case of the own child is about an actual life (the child) versus other lives. Here, we have an artistic project that is central to her life's meaning.

  **Step 2: Apply the rules to the new case**

  **Rule A (Moderate Sacrifice):**
  - The cost in the new case: the loss of the manuscript, which would devastate her career and her reason for living. This is a very high personal cost, though not financial ruin or death. We must decide if this cost is moderate or extreme.
  - In the shallow pond case, the cost was ruining shoes (moderate). In the broken promise, the cost was relational (moderate). But the cost here is the destruction of a life's work and the meaning of her life. This might be considered extreme, and thus not required.
  - However, note that the donation case says we are not required to donate to the point of ruin. The manuscript loss is not ruinous in a financial sense (she won't be destitute) but it is ruinous to her career and psychological well-being. Is this analogous to ruin? The rule in the donation case is about financial ruin, but here the ruin is non-financial. We might extend the notion of ruin to include the destruction of one's central life project.

  **Rule A Prediction:** The cost is too high (extreme) and thus not required.

  **Rule B (Special Obligations and Personal Attachments):**
  - This rule emphasizes that we have special obligations to our own children that override saving more lives. But what about personal projects that are integral to one's identity and life's meaning?
  - The broken promise case showed that a promise to a friend (a personal commitment) can be broken to save a life. However, the manuscript is not a person but a project that is deeply personal and central to her identity.
  - The own child case suggests that we have a special duty to our own that can override the duty to strangers. But the manuscript is not a person. However, one might argue that the duty to oneself (to preserve one's own life project) is also a special obligation.

  Alternatively, we might consider a different rule that focuses on the distinction between personal projects and human lives:

  **Rule C: Lives vs. Non-Lives**
  - Human life is paramount and must be saved unless the cost to the rescuer is extreme (like death or ruin). The manuscript is a non-living thing, even though it has immense personal value. Therefore, the life of the child should be saved.

  But note that Rule A already incorporates a cost threshold. The question is whether the loss of the manuscript is an extreme cost.

  **Rule B Prediction (if we interpret it to include personal life projects as special):** She has a special duty to her own life project (the novel) that might override the duty to save a stranger's life. So she is not required to sacrifice it.

  Alternatively, if we interpret Rule B as only about relationships with other people, then the manuscript doesn't count. Then we fall back to Rule A.

  **Step 3: Two Plausible Rules that Diverge**

  Let me propose two rules that both fit the previous cases but diverge on the manuscript case:

  **Rule 1: The Moderate Cost Threshold Rule**
  - One must save a life if the cost to oneself is moderate (where moderate includes financial costs that are not ruinous, relational costs that are not catastrophic, and physical costs that are not life-threatening). 
  - Extreme costs (like risking one's life, or ruin) are not required.
  - In the manuscript case: the cost is the loss of her life's work and her reason for living. This is an extreme cost (even if not financial ruin) and thus not required. Prediction: She is not obligated to throw the manuscript.

  **Rule 2: The Life-Integrity Rule**
  - One must save a life unless doing so would require sacrificing something that is integral to one's own life and identity to an extent that it would destroy one's ability to lead a meaningful life. However, note that the own child case shows that one's own child is part of one's life and identity and thus cannot be sacrificed for the greater good. This rule might extend to other deep personal commitments (like a life's work) that are central to one's identity.
  - But note the broken promise case: a promise to a friend is a commitment but not central to one's identity in the same way. So that was overridden.
  - The manuscript is central to her identity. Thus, she is not required to sacrifice it.
  - Prediction: She is not obligated.

  Alternatively, we can have a rule that does not protect the manuscript:

  **Rule 3: The Paramount Life Rule**
  - Human life must be saved unless the cost is death or ruin (as defined in the donation case: destitution). Since the manuscript's loss does not leave her destitute, she must save the child.
  - This rule would say: the manuscript is a non-life and its loss, while devastating, is not equivalent to death or financial ruin. Therefore, she must throw it.

  But note that the donation case only required a small donation (not ruinous) and the broken promise case required a broken promise (which is not ruinous). The manuscript case is more severe than a broken promise? How do we compare?

  **Divergence between Rule 1 and Rule 3:**
  - Rule 1 (Moderate Cost Threshold) would consider the manuscript loss as extreme (because it destroys her reason for living and her career) and thus not required.
  - Rule 3 (Paramount Life) would consider that since she is not facing death or destitution, it is required.

  But note the earlier cases:

  - The broken promise: the cost (to the friend) is real and the promise is important, but it is required. The cost to the agent is primarily relational and not material. The manuscript loss is both material (the physical manuscript) and psychological (her life's meaning). Is it more severe than a broken promise? Probably yes.

  **Step 4: Best Guess**

  Given the existing verdicts:

  - The risk to life case: risking one's life is not required. This sets a high bar: if the cost is too high (like death) then it's not required.
  - The manuscript loss is described as devastating her career and her reason for living. This is a kind of psychological death. It is not death, but it is the loss of what makes life worth living.

  Therefore, I think she would say that she is not required to throw the manuscript. This is consistent with Rule 1.

  But what about the broken promise? That was required even though it caused relational harm. Why is the manuscript different? Because the broken promise does not destroy the agent's entire life project. It might damage a friendship, but friendships can be repaired. The loss of the manuscript is irreplaceable and destroys her central life project.

  Thus, my best guess:

  **Verdict:** She is not obligated to throw the manuscript and let the child drown.

  **Reasons:**
  1. The cost of losing the manuscript is too high: it would destroy her career and her reason for living. This is an extreme cost, beyond the moderate costs required in the shallow pond and broken promise cases. It is more analogous to the risk to life case (which is not required) than to the broken promise case.
  2. The own child case shows that we have special obligations to our own that override saving others. The novel is her own creation, her life's work, and central to her identity. This special attachment might be seen as a reason to protect it.

  However, note that the own child case is about a human life (her child) versus other human lives. The manuscript is not a human life. So this analogy is weak. Therefore, the primary reason is the extreme cost.

  **Step 5: A Further Case to Tell the Rules Apart**

  We have two rules that we are considering:

  - **Rule 1 (Moderate Cost Threshold):** Only moderate costs are required. Extreme costs (like the loss of one's central life project) are not.
  - **Rule 3 (Paramount Life):** Any cost that does not amount to death or destitution is required.

  To distinguish between them, consider:

  **Further Case:**
  - A world-renowned violinist is walking to a concert carrying her priceless, irreplaceable violin. She sees a child drowning. The only way to save the child is to throw the violin to the child to use as a float. The violin will be ruined. Without the violin, her career is over and she will lose her life's purpose, but she will not be destitute (she has savings).

  **Rule 1 Prediction:** Not required to throw the violin because the cost is extreme (loss of career and life's purpose).
  **Rule 3 Prediction:** Required to throw the violin because she will not be destitute.

  **Step 6: What argument would change my mind?**

  I have argued that the cost of losing the manuscript is extreme and thus not required. However, an argument that might change my mind:

  - The broken promise case required a cost that was significant but not extreme (the friend's trust). The manuscript case is also a significant cost but not extreme in the sense of death or destitution. The philosopher might argue that even though the manuscript is her reason for living, she can find a new reason. Human life is unique and irreplaceable. Therefore, she must save the child.

  This argument might work if we downplay the psychological devastation and focus on the fact that she will survive and might rebuild her life. But note that she says it is her reason for living. Without it, she might be left in a state of severe depression. Is that a kind of ruin? The donation case forbade only financial ruin, but psychological ruin might be analogous.

  **Step 7: Where might my reasoning fail?**

  My reasoning might fail in the following ways:

  1. **Underestimation of the value of a life:** I might be overemphasizing the personal cost and underemphasizing the value of the child's life. The broken promise case required a cost that was non-trivial (breaking a promise to a friend) for the sake of a life. Why is the manuscript loss any different? The argument that the broken promise is reparable and the manuscript loss is not might be weak. What if the friendship is irreparable? The case didn't specify. We might be drawing a line arbitrarily.
  2. **Inconsistency with the trivial trespass case:** The trivial trespass case required a trivial trespass (which might be a minor legal violation) to save a life. The manuscript case is not trivial. But the broken promise was non-trivial and required. So the trivial trespass case doesn't directly help.

  The main point of failure is the vagueness of what counts as moderate versus extreme. We have:

  - Ruined shoes: moderate.
  - Broken promise: moderate.
  - Risk to life: extreme.
  - Manuscript loss: we are calling it extreme.

  But why is the manuscript loss extreme? Because it destroys her career and reason for living. But if we say that, then we must also note that in the broken promise case, the cost to the friend might be significant (it might ruin the friendship and that friendship might have been a reason for living). We don't know. So the broken promise case might be less costly than the manuscript case. But without a metric, it's hard.

  Conclusion:

  I think the philosopher would say she is not obligated to throw the manuscript. To be consistent, she must hold that the cost in this case is beyond the moderate sacrifice required. The rule that fits best is that we must save a life unless the cost to ourselves is extreme (including not only death and destitution but also the loss of what makes life worth living). This rule fits with the risk to life case and with the donation case (ruin is not required). The manuscript loss is a form of ruin (of her life's meaning) and thus not required.

  Therefore, for the new column, she would write that she is not required to sacrifice the manuscript.
