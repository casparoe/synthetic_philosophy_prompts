  I need to check if there's an existing term. Concepts like "rhetorical relativism" or "critical relativism" might come close. Marshall Sahlins' "afterology" points to using others to critique the West, but it's more about content. Maybe the philosophical term is "performative contradiction," where the act undermines the stated position. That's a possibility, but it might be too broad.

  The user's deeper need seems to be understanding the logical tension and how to avoid it. They want a clear analysis of the presuppositions and a way to frame critiques without hypocrisy. So, proposing a new term like "crypto-universalism" makes sense. It captures the hidden universal standard while professing relativism. 

  We also need to address when this move is legitimate. If the universal value is argued for explicitly, it's valid. But when smuggled in, it's problematic. The user might be looking for ways to honestly engage in cross-cultural critique without falling into this trap. Examples like Martha Nussbaum's capabilities approach show how to argue for universals transparently.

  Additionally, considering the user's possible identity: they're likely a student or scholar in humanities, dealing with ethical relativism in texts. Their real need is to articulate this logical flaw in academic writing or discussions. They might want to reference existing debates but found gaps in terminology. Providing both existing terms and a new one covers their request and offers tools for critical analysis.
answer: |-
  This is a brilliantly observed paradox at the heart of much cross-cultural critique, particularly in the tradition Montaigne exemplifies. You've pinpointed the core tension: **using cultural difference to relativize one's own norms, while simultaneously relying on an unstated, assumed universal value derived *from* that difference to mount the critique.** This move is indeed distinct from straightforward relativism, ethnocentrism, or simple romanticization.

  **Existing Terms & Why They Fit (Partially) or Don't Fit Perfectly:**

  1.  **"Performative Contradiction" (Philosophy):** This is the closest *established* concept describing the *logical structure*. It refers to an argument whose *enactment* contradicts its *stated premises*. Here, the stated premise is often a form of relativism ("no universal standards"), but the *act of critique* ("our individualism is bad, their communalism is good") implicitly relies on a universal standard ("communalism is universally preferable" or "freedom is universally good"). While accurate for the *structure*, it's a broad philosophical term, not specific to cultural critique.
  2.  **"Rhetorical Relativism" / "Critical Relativism":** These terms are sometimes used informally to describe *using* relativist arguments strategically to undermine dominant norms, often without fully committing to relativism's philosophical implications. This captures the *function* but less precisely the *logical tension* you describe.
  3.  **"The Noble Savage Trope" / "Romantic Primitivism":** These describe the *content* of the idealization (the "other" as inherently pure, natural, free, communal) but not the specific *logical maneuver* of using that idealized "other" to critique one's own society *by* smuggling in universal values *embodied* (presumably) by the "savage."
  4.  **"Schizoid Universalism" (Less Common):** Occasionally used to describe the split between professed difference and practiced universalism, but not widely established.
  5.  **Sahlins's "Afterology" (Marshall Sahlins):** Anthropologist Marshall Sahlins coined this term critically for Western intellectual traditions that define the West negatively *against* a constructed "other" (e.g., "They have myth, we have history"; "They have community, we have individualism"). This captures the *mirror* function and the critical intent but focuses more on the *construction* of the other than the specific *logical contradiction* of relying on unstated universals.

  **Proposing a New Term: Crypto-Universalism**

  Given the lack of a perfect, widely accepted term focusing precisely on *this logical tension*, let's define one:

  *   **Term:** **Crypto-Universalism**
  *   **Definition:** A rhetorical and critical strategy whereby an observer, ostensibly embracing cultural relativism (or at least challenging cultural absolutism), critiques their own society by invoking practices or values from another culture. However, the critique implicitly relies on and assumes the universal validity of a specific value (e.g., freedom, community, authenticity, harmony with nature) that is either:
      *   a) Projected onto the other culture without sufficient evidence they hold it as a *universal good* (they may simply live it as custom), or
      *   b) Treated as self-evidently superior by the critic, despite their professed relativism.
      The "other" culture thus functions primarily as a rhetorical device – a mirror reflecting the critic's own unacknowledged universal values – rather than being understood or engaged with holistically on its own complex terms. The universal value remains hidden ("crypto") beneath a surface appeal to difference.

  **Analyzing the Move (The "Exact Shape of the Tension"):**

  1.  **Presuppositions:**
      *   A core, desirable value exists (freedom, community, authenticity, etc.).
      *   This value is either absent or deficient in the critic's own society.
      *   This value is embodied (consciously or unconsciously) by the described "other" culture.
      *   The presence of this value makes the "other" culture, at least in this specific aspect, morally superior *in a way that is binding on the critic's own society* (hence the critique).
      *   The critic can access and interpret the "other" culture accurately enough to identify this value.

  2.  **When is it Legitimate?**
      *   **Rhetorically/Pedagogically:** It can be a powerful tool to shock complacent audiences and destabilize entrenched ethnocentrism ("See, it *can* be done differently!"). Montaigne masterfully uses it this way.
      *   **As a Starting Point:** It can initiate valuable self-reflection and spark genuine inquiry into both cultures.
      *   **When the Universal Value is Explicitly Argued For:** If the critic *drops the relativist pretense* and explicitly argues *why* freedom, community, etc., *should* be considered universally desirable human goods *before* using the other culture as an illustration, the move becomes coherent (though open to debate on the universality claim). The illegitimacy lies in the *smuggling* of the universal under the cloak of difference.

  3.  **A Critique Without the Hidden Standard:**
      There are several ways to avoid crypto-universalism while still making a cross-cultural critique:
      *   **Internal Critique:** Criticize Society A *using its own stated values and ideals*, showing how it fails to live up to them (e.g., "We claim to value freedom, yet our practices X, Y, Z create widespread unfreedom"). No appeal to another culture is needed.
      *   **Explicit Universalism:** Argue directly for a universal value (e.g., "Minimizing unnecessary suffering is a universal human good"). *Then*, use examples from other cultures (and one's own) to show how different social arrangements succeed or fail *according to that explicit standard*. (e.g., Martha Nussbaum's capabilities approach).
      *   **Dialogic Understanding:** Engage deeply with the *internal logic* and *self-understanding* of the other culture. Instead of saying "They have freedom, we don't," ask: "What does 'freedom' *mean* within their conceptual scheme? How does it relate to their notions of obligation, nature, the divine? How does our concept differ?" The critique of one's own society emerges from a richer, less instrumental comparison, focusing on the *costs and benefits, coherence and contradictions* within *each* system, rather than simple superiority/inferiority. (e.g., "While their system ensures strong community bonds through practice X, it also entails constraint Y. Our system maximizes individual choice but produces isolation Z. Neither is simply 'better,' but understanding both challenges the inevitability of our own trade-offs").
      *   **Focus on Specific Harms (Minimalist Universalism):** Focus critique on tangible, widely recognized harms within one's own society (e.g., systemic poverty, violence, environmental degradation) without necessarily claiming the other culture has "the answer," but perhaps showing alternative ways of organizing that mitigate *those specific harms*. The value ("avoiding mass starvation") is made explicit and argued for based on shared human vulnerability.

  **Relation to Other Concepts:**

  *   **Cultural Relativism:** Crypto-universalism parasitizes the *rhetoric* of relativism (highlighting difference to challenge absolutism) but violates its core methodological principle of suspending judgment based on external standards. It uses relativism tactically, not consistently.
  *   **Ethnocentrism:** While criticizing *overt* ethnocentrism ("our way is best"), crypto-universalism often exhibits a *reverse* or *romantic* ethnocentrism, projecting idealized values onto the "other" and judging one's own culture negatively *by that projected standard*. The "other" is still defined primarily in relation to the critic's preoccupations.
  *   **Appeal to Universal Values:** This is the hidden engine of crypto-universalism. The difference is the *denial* or *lack of acknowledgment* of this appeal while simultaneously depending on it. Legitimate universalism makes its standards explicit and argues for them.

  **In essence, crypto-universalism is the logical flaw that arises when the powerful impulse to use cultural difference as a critical lever collides with the philosophical difficulty of maintaining pure relativism and the practical difficulty of avoiding projection.** Recognizing this pattern – whether we call it crypto-universalism, a performative contradiction, or rhetorical relativism – is crucial for engaging in more honest, rigorous, and less exploitative cross-cultural comparison and critique. Montaigne himself was deeply aware of these tensions, using them provocatively, but the pattern persists wherever the "cannibals" are invoked to shame the "civilized."
