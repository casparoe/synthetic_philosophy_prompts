  First, I recall that Montaigne is a key figure here. His essay is a classic example where he uses the Tupinambá people to critique European society. But Montaigne points out that the Tupinambá's practices, like eating their enemies, might be less cruel than European torture methods. The user's observation is that this critique relies on a hidden universal standard, say, the value of humane treatment, which the Tupinambá might not share. 

