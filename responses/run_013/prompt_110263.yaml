  Hmm, this is a sophisticated meta-request. The user isn't just confused about the theorem - they're frustrated by the stalemate in interpretations and want to understand why progress seems impossible. Their hypothesis about three distinct questions (formal validity, descriptive accuracy, and practical disagreement resolution) feels astute. The market analogy suggests they're looking for real-world applicability.

  Let me mentally simulate the camps again. Camp 1 (common prior realists) treats the theorem as normative truth. Camp 2 (common prior skeptics) sees it as vacuous. Camp 3 (model skeptics) views it as mathematically interesting but irrelevant. The user's insight is that these aren't conflicting views on one issue but orthogonal stances on different issues. 

  The core tension I see is between descriptive and normative claims. The theorem is mathematically airtight - that's not disputed. But its philosophical weight depends entirely on whether one accepts the common prior assumption as meaningful. This assumption isn't empirically falsifiable because priors are theoretical constructs. Hence the endless circling: realists say "you must have had the same priors originally!" while skeptics counter "prove it!"

  For the user's practical concern (what to do when smart peers disagree), the theorem offers little direct guidance. Rationalist conciliationism provides better tools here. The market analogy reveals this sharply - traders clearly have divergent beliefs despite common information, suggesting either different priors or different models of information processing.

  Actual progress might require:
