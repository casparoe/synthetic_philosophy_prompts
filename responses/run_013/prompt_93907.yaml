prompt: |-
  You are a philosopher who specializes in early modern moral psychology and an experienced designer of classroom simulations. You know Adam Smith's account of sympathy and the impartial spectator closely, and you are skilled at building activities in which participants run into a problem with their own hands before anyone names it. Before you write the activity, brainstorm in a short section you label "Design notes": work out, moment by moment, what would have to happen for a room of people to feel the specific tension described below. Reason it through carefully, then give the runnable activity as your deliverable.

  The setting: one 90-minute session of an upper-level undergraduate seminar in moral psychology, sixteen students, none of whom has read Smith. The only materials are paper, pens, a whiteboard, and movable chairs. The session must not open with a lecture, and no one should hear the words "sympathy," "impartial spectator," or "Smith" until the debrief.

  The idea the activity has to make them feel. Smith holds that we never feel another person's emotion directly; what we call sympathy is a fellow-feeling we manufacture by imagining ourselves into their situation. Because we also cannot see our own conduct from the outside, he holds that we judge ourselves by imagining how an informed but disinterested onlooker would view us, and that this imagined figure becomes the inner standard we actually consult. Two further claims are the ones you must build the activity around, because they are the uncomfortable ones. First, Smith thinks we are constitutionally poor at seeing ourselves as others see us; self-love distorts the very judgment we rely on, and the remedy is made of the same stuff as the disease. Second, he thinks the inner judge can be captured: our moral sentiments bend to custom and fashion, and we are prone to admire the rich and the great while neglecting the poor and the obscure, so that what feels like an impartial verdict may be the room, the moment, or our own interest in disguise. The students should end up having used a standard of judgment, trusted it, and then seen where it came from. The target is not the cozy reading in which conscience is a reliable inner voice; it is the reading in which the voice is something we assembled, and could have assembled otherwise.

  What the activity must include:

  - Roles, rules, a minute-by-minute timeline, materials, and a stake the group genuinely cares about without money or prizes. The format is yours to choose, but participants must be doing something, not listening.
  - A stage in which each person must privately commit to a judgment before any public discussion, so that any later shift can be compared against a fixed point.
  - A stage in which the group must construct its own standard of judgment from scratch, rather than being handed one.
  - One feature of the setup that the facilitator can secretly manipulate (who is present, who benefits, what has just been made salient), such that a second round of judgments moves. The students should reach a point where they cannot tell whether they are following an impartial spectator or merely a consensus, and should feel that they cannot tell.
  - No lecture beforehand. The vocabulary and the doctrines are named only in the debrief.

  The debrief must map particular moments of what happened onto particular pieces of Smith's machinery: the two-step act of imagination by which the standard is built; the self-deceit that makes it unreliable; the bending of sentiment to custom and fashion and to admiration of the rich and great; and the gap between wanting to be praised and wanting to be praiseworthy. Give two or three debrief questions that do this mapping without simply lecturing.

  Then tell me what will predictably go wrong the first time this is run — at least three specific failure modes, with what the facilitator should do about each.

  Finally, be honest about what the activity cannot reproduce and the facilitator must supply: for instance, the fact that a real impartial spectator is the sediment of a lifetime and operates largely below awareness, and the fact that Smith takes it to carry genuine normative authority rather than being merely a social artifact. Say plainly which part of the idea the debrief has to assert rather than demonstrate.

  Do not assign any reading, and do not include citations, reading lists, or references to scholarship; everything the activity needs should be present in the room.
reasoning: |-
  We are designing an activity that must create a lived experience of the tension in Smith's ideas. The core tension: we rely on an internalized impartial spectator for moral judgments, but this spectator is constructed through imagination and is vulnerable to distortion by self-love, social pressure, and admiration of the powerful. The activity must have participants build a standard of judgment, use it, and then see how it shifts under social influence, leading them to question its impartiality.

  Design notes:

  1. **The core experience must be:**
     - Participants form an initial private judgment about a case (to fix a baseline).
     - They then collectively construct a standard for judging such cases.
     - They re-judge the same case (or a similar one) after the standard is built and after a social manipulation.
     - They notice that their judgments shifted and question why.

  2. **The manipulation:**
     - We need a feature that can be secretly manipulated to influence the group's standard. Possibilities: 
       - Introducing a "respected" figure (e.g., a professor or a guest) who subtly endorses a particular view.
       - Changing the social composition (e.g., having a subgroup leave and return, or adding a confederate).
       - Making a particular attribute salient (e.g., wealth, status, or popularity) that then biases the standard.

     Given the constraint of no pre-lecture and no outside materials, we can use the room setup. For example, we can have a "guest" (a confederate, perhaps a colleague or a pre-briefed student) enter during the standard-building phase and express a view. Alternatively, we can use the whiteboard to make certain considerations salient.

     However, we must be cautious: the manipulation should not be too overt, or the bias will be obvious. It should feel natural.

  3. **The case:**
     - We need a moral dilemma that is ambiguous enough to allow for multiple interpretations and that can be judged by a standard the group builds. It should be relatable and engaging without being too emotionally charged.

     Example: A case of plagiarism in an academic setting, but with mitigating factors (e.g., the student was under extreme pressure, or the plagiarism was unintentional). Alternatively, a case of breaking a promise for a good reason.

     But we must avoid triggering real campus issues. A hypothetical is safer.

  4. **The standard-building:**
     - The group must create a set of criteria for judging the case. We can frame it as: "What factors should we consider when deciding how blameworthy or praiseworthy an action is?"

  5. **The shift:**
     - After the standard is built, we introduce a second case that is structurally similar but with one key difference that the manipulation has made salient (e.g., the person in the second case is described as coming from a wealthy family or having a prestigious internship). Alternatively, we can use the same case but with new information that the manipulation has framed in a particular way.

     But note: we want the same participants to judge twice, so we need two comparable cases or the same case with a twist.

  6. **The roles:**
     - All participants are judges. We might have a few participants role-play the characters in the case, but that might complicate the judgment. Alternatively, the cases can be presented as written scenarios.

  7. **The stake:**
     - The judgment must feel meaningful. We can frame it as: "We are going to create a set of guidelines for our department's honor council" or "We are advising a committee on how to handle such cases." The key is that the group's standard might be used in the future, so they care about getting it right.

  8. **The debrief mapping:**
     - We must connect:
       - The private judgment to the initial attempt at sympathy (imagining the situation).
       - The collective standard-building to the construction of the impartial spectator.
       - The shift to the influence of custom/fashion or admiration of the great.
       - The moment of uncertainty about whether they followed the spectator or the consensus to the unreliability and the gap between wanting praise and being praiseworthy.

     Debrief questions should draw out these connections without naming Smith until the end.

  Activity: "The Honor Code Deliberation"

  **Setup (5 minutes):**
  - Chairs in a circle. Whiteboard at the front.
  - Facilitator introduces: "Today we're going to do an activity about making fair judgments. We'll be creating guidelines for how to handle academic integrity cases. You are the advisory committee."

  **Phase 1: Private Judgment (10 minutes)**
  - Hand out a written scenario (Case A) to each student. Example:

    *Case A: Alex, a senior, is writing a thesis while also caring for a sick parent. Under immense stress, Alex copies a paragraph from an online source without citation in a draft. The professor notices and reports it. Alex admits the mistake and says it was unintentional and due to stress. The professor says the draft was clearly labeled as requiring original work and proper citation.*

    Question: How blameworthy is Alex on a scale of 1 (not at all) to 10 (extremely)? And what should the consequence be? (e.g., no penalty, warning, fail the assignment, fail the course, etc.)

    Students write their private judgment and reason (on paper).

  **Phase 2: Building the Standard (20 minutes)**
  - Facilitator: "Now, we need to create a set of factors to consider in such cases. What makes an action more or less blameworthy? Let's build a list of criteria together."
  - Brainstorm on the whiteboard. Encourage discussion. Criteria might include: intent, circumstances, severity, precedent, remorse, etc.
  - **The Manipulation:** The facilitator has pre-arranged for a colleague (or a trusted student) to knock and enter halfway through this phase. The colleague says: "Excuse me, I'm from the Dean's office. I heard you're discussing academic integrity. I just want to remind you that we must consider the university's reputation. We've had issues with students from wealthy families getting preferential treatment in the press, so we need to be extra cautious about appearing fair to all." Then leaves. (This makes wealth/social status salient and pressures the group to avoid the appearance of bias.)
  - After this interruption, the facilitator continues the discussion, now subtly steering the group to include "avoiding the appearance of bias" and "consistency across different backgrounds" as criteria. But note: the group must feel they are building the standard.

  **Phase 3: Public Discussion and Group Standard (15 minutes)**
  - The group finalizes a list of 3-5 key criteria and writes them on the board.

  **Phase 4: Second Private Judgment (10 minutes)**
  - Hand out a new scenario (Case B). It should be similar but with a key difference:

    *Case B: Taylor, a senior, is writing a thesis while also interning at a prestigious firm. Under immense stress, Taylor copies a paragraph from an online source without citation in a draft. The professor notices and reports it. Taylor admits the mistake and says it was unintentional and due to stress. The professor says the draft was clearly labeled as requiring original work and proper citation. Taylor comes from a wealthy family and has a high-profile internship.*

    Note: The only differences are the name and the specifics of the external pressure (internship vs. sick parent) and the mention of wealth. The core action is the same.

    Students again write their private judgment (scale of 1-10 and consequence) and reason.

  **Phase 5: Reveal and Reflection (20 minutes)**
  - Facilitator asks: "How many of you gave a different rating in Case B than in Case A? Why?"
  - Discuss the reasons. The goal is to surface that the mention of wealth/internship might have influenced the judgment, even though the action was the same. Also, the group standard might have been applied differently.
  - Then, reveal the manipulation: "I want to let you know that the interruption was planned. The person was acting. Why do you think I did that?" Let them speculate.

  **Debrief (10 minutes):**
  - Now we name Smith and the concepts. But through questions:
    1. "When you first read about Alex, how did you form your judgment? Did you imagine yourself in their situation? What about Taylor?" (This maps to Smith's sympathy as imaginative reconstruction.)
    2. "When we built the criteria together, what were we doing? Were we trying to create a fair, impartial standard? How did we decide what was fair?" (This maps to constructing the impartial spectator.)
    3. "How did the interruption affect our standard? Did it change what we thought was important? And when you judged Taylor, did you feel you were using the standard impartially? Or were you worried about how it would look if you were lenient on a wealthy student?" (This maps to the bending of sentiment to custom/fashion and the admiration of the great/rich.)
    4. "When you changed your judgment (if you did), was it because you thought you were wrong before, or because the group standard changed? How can we tell the difference between a genuinely impartial judgment and one that just follows the group?" (This maps to the unreliability and the gap between wanting to be praised and wanting to be praiseworthy.)

  - Then, briefly explain Smith's ideas and connect:
    - The initial private judgment was your attempt to sympathize with Alex/Taylor by imagining their situation.
    - The group standard was the collective attempt to build an impartial spectator.
    - The interruption made us worry about the university's reputation and the appearance of bias, which shows how the spectator can be influenced by social pressures.
    - The shift in judgment for Taylor (if any) might show how we are prone to adjust our sentiments based on factors like wealth and status, even when we think we are being impartial.

  **Predictable Failure Modes:**

  1. **The manipulation is too obvious:** If the interruption feels staged, students might dismiss it as artificial.
     - *Mitigation:* The acting must be good. Alternatively, use a more subtle manipulation: e.g., the facilitator can write a few criteria on the board in a way that emphasizes "consistency" and "appearances" without an interruption. Or, have the facilitator mention a recent news story about a scandal involving a wealthy student.

  2. **No shift in judgment:** If Case A and Case B are judged similarly, the point about bias might be lost.
     - *Mitigation:* Make the wealth/social status in Case B more prominent. Also, ensure the interruption strongly pushes the group to avoid the appearance of favoring the wealthy. In the debrief, if no shift, focus on why: "Did anyone feel pressure to judge Taylor more harshly because of the wealth? Even if you didn't change your rating, did you think about it differently?"

  3. **Groupthink in the standard-building:** The group might quickly converge on a standard without deep discussion, making the manipulation less effective.
     - *Mitigation:* The facilitator should encourage dissent: "Are there other factors? What if someone disagrees?" and ensure multiple voices are heard.

  4. **Emotional reaction to the topic:** Academic integrity might be too sensitive.
     - *Mitigation:* Use a less charged scenario, like a case of breaking a promise in a non-academic context. Example:

        *Case A: Jamie promised to help a friend move, but on the day, Jamie's car broke down and they couldn't make it. The friend had to hire movers and is upset.*
        *Case B: Taylor promised to help a friend move, but on the day, Taylor got called into a high-paying, prestigious job and couldn't make it. The friend had to hire movers and is upset.*

  **What the activity cannot reproduce and the facilitator must supply:**

  - **The lifetime of sediment:** The impartial spectator in Smith is built over years of social interaction and moral development. Our activity compresses this into minutes. The debrief must explain that in real life, the spectator is a deep-seated internalization, not a quick group exercise.
  - **Normative authority:** Smith believes the impartial spectator, though fallible, is our best guide to moral truth. The activity might leave the impression that the spectator is arbitrary. The debrief must assert that Smith sees it as having genuine authority, even if imperfect, and that the goal is to improve it, not discard it.
  - **Self-deceit operating below awareness:** In the activity, the bias might be apparent. In reality, self-deceit is often invisible. The facilitator must explain that we are usually unaware of how self-love distorts our judgments.

  **Deliverable: The Runnable Activity**

  **Title:** The Fairness Tribunal

  **Time:** 90 minutes

  **Materials:**
  - Paper and pens for each student.
  - Whiteboard and markers.
  - Two printed case sheets (one for each case) for each student.
  - Pre-arranged confederate for the interruption (optional; if not possible, facilitator can use a different manipulation).

  **Setup:**
  - Arrange chairs in a circle. Write the activity title on the board: "Building Fair Guidelines: The Honor Code Advisory Committee"

  **Phase 1: Private Judgment (10 min)**
  - Distribute Case A. Read aloud if needed. Students privately write:
    - Blameworthiness rating (1-10)
    - Recommended consequence
    - Brief reason

  **Phase 2: Building the Standard (20 min)**
  - Facilitator: "We need a set of criteria for judging such cases. What factors make an action more or less blameworthy? Let's brainstorm."
  - Write ideas on the board. Encourage discussion. (10 min in: interruption occurs. Confederate enters, delivers the message about avoiding bias and focusing on consistency, then exits.)
  - Continue discussion: "How does that point affect our criteria? Should we add 'avoiding the appearance of bias' or 'treating all students equally regardless of background'?"
  - Finalize 3-5 criteria.

  **Phase 3: Group Standard (5 min)**
  - Write the final criteria on the board.

  **Phase 4: Second Private Judgment (10 min)**
  - Distribute Case B. Students again write privately: rating, consequence, reason.

  **Phase 5: Reveal and Reflection (20 min)**
  - Ask for a show of hands: "Who had a different rating for Taylor than for Alex?" Discuss reasons.
  - Reveal the manipulation: "The interruption was staged to see how social pressure affects our standards. Why might we have included those criteria? How did it affect your judgment of Taylor?"

  **Debrief (15 min):**
  - Ask the mapping questions as above.
  - Then introduce Smith: "Today's activity illustrates ideas from Adam Smith, an 18th-century philosopher. He argued that we judge others by imagining ourselves in their situation (sympathy), and we judge ourselves by imagining how an impartial spectator would view us. But he also thought that spectator can be biased by self-love and social pressures, like our worry about appearances and our tendency to admire the wealthy. That gap between wanting to be fair and actually being fair is what we experienced."
  - Connect:
    - Phase 1: Sympathy as imaginative reconstruction.
    - Phase 2: Building the impartial spectator collectively.
    - The shift: How the spectator was bent by social pressure and the mention of wealth.
    - The uncertainty: The gap between wanting to be praiseworthy and wanting to be praised.

  **End.**
answer: |-
  ### Design Notes
  To create the tension Smith describes, participants must:
  1. **Experience the gap between self-perception and external judgment**: Participants will judge others' actions, then face judgment themselves, revealing how self-love distorts self-assessment.  
  2. **Construct a standard collectively**: The group builds criteria for "fairness" from scratch, mimicking how the impartial spectator is socially assembled.  
  3. **Witness the standard's malleability**: A covert manipulation (emphasizing "status") shifts judgments, exposing how consensus can masquerade as impartiality.  
  4. **Confront uncertainty**: When judgments shift, participants feel unable to distinguish between genuine impartiality and social influence.  

  **Moment-by-moment reasoning**:  
  - **Private commitment first**: Isolating initial judgments prevents groupthink from contaminating the baseline.  
  - **Building the standard**: A neutral prompt ("What makes an action fair?") forces the group to create criteria without preconceived frameworks. The manipulation occurs here—subtly injecting "status" into the discussion—so the standard absorbs it.  
  - **Second judgment with same case**: Using the identical scenario post-manipulation highlights how the standard (not facts) drives change. Participants judge themselves this time, creating a self-other asymmetry.  
  - **Shift and doubt**: When judgments move, participants question whether their new stance is principled or performative, mirroring Smith’s "gap" between wanting praise and praiseworthiness.  

  **Stake**: Participants decide "fair consequences" for actions in a fictional community. The stake is peer validation—being seen as fair-minded—which mirrors Smith’s concern with social admiration.  

  **Manipulation**: The facilitator emphasizes "respect for status" during standard-building (e.g., "Should status matter?"). This primes admiration for the "great," bending the standard.  

  **Why it works**:  
  - Private judgments fix a baseline for comparison.  
  - Self-judgment reveals self-love’s distortion (we judge ourselves leniently).  
  - The same case reused post-manipulation shows standard-driven (not fact-driven) change.  
  - No vocabulary introduced pre-debrief keeps focus on lived tension.  

  ---

  ### Runnable Activity: "The Fairness Tribunal"  
  **Time**: 90 minutes  
  **Materials**: Paper, pens, whiteboard, movable chairs.  
  **Setup**: Chairs in a circle. Whiteboard visible to all.  

  #### Phase 1: Case Introduction & Private Judgment (15 min)  
  - **Facilitator script**: "We’re a community tribunal. You’ll review a case about an action, then decide a fair consequence. First, read **Case A** privately."  
    - *Case A (handwritten on paper for all)*:  
      > *Sam is a community volunteer. During a fundraiser, Sam took $50 from the donation box to cover a taxi home after missing the last bus, leaving a note promising repayment. Sam has volunteered for 5 years and has never done anything like this before.*  
  - **Task**: Each writes privately:  
    - *Consequence*: "What should happen to Sam? (e.g., apology, repayment, fired, legal action?)"  
    - *Reason*: "Why is this fair?"  
  - **No discussion**. Collect papers (kept secret until Phase 5).  

  #### Phase 2: Building the Standard (25 min)  
  - **Facilitator script**: "Before judging, we need shared standards. Brainstorm: *What makes an action ‘fair’ to judge?* Not rules—just principles. I’ll write ideas on the board."  
  - **Group discussion**:  
    - Guide neutrally: "What factors matter? Intent? Outcomes? Past behavior?"  
    - **Manipulation (subtle)**: After 10 min, interject: "What about *status*? Should Sam’s role as a ‘respected volunteer’ matter?" (Plant this if unmentioned; e.g., "Someone might say status matters—thoughts?").  
    - Push consensus: "Let’s pick 3 key principles." (Common outcomes: intent, impact, status/reputation.)  
  - **Whiteboard**: Finalize 3 principles (e.g., 1. *Intent*, 2. *Harm done*, 3. *Person’s role/status*).  

  #### Phase 3: Self-Judgment & Second Private Commitment (15 min)  
  - **Facilitator script**: "Now, apply these principles to yourself. Imagine **you** did what Sam did. Write privately:  
    - *Consequence*: What should happen to *you*?  
    - *Reason*: How do the principles justify this?"  
  - **Reveal twist**: After writing, announce: "This was the same as Case A—Sam’s action is identical. You just judged yourself."  
  - Collect papers.  

  #### Phase 4: Small-Group Comparison (20 min)  
  - **Facilitator script**: "In groups of 4, share:  
    1. What consequence did you give Sam vs. yourself?  
    2. Did your judgment shift using the principles? Why?"  
  - **Key question for groups**: "Do you feel your self-judgment was truly impartial, or influenced by something else?"  
  - Groups report key tensions to the whole room (e.g., "We went easier on ourselves").  

  #### Phase 5: Full Group Reflection (15 min)  
  - **Facilitator prompts**:  
    - "How many found their self-judgment more lenient than their judgment of Sam?" (Show of hands.)  
    - "When we added ‘status’ to our principles, how did that affect your views?"  
    - "Could you tell if your shift was fair—or just following the group?"  
  - **Reveal manipulation**: "I emphasized ‘status’ to test how standards bend. Did it feel like a genuine part of fairness, or did it sneak in?"  

  ---

  ### Debrief: Mapping to Smith (10 min)  
  **Do not name Smith until the end**. Use questions to connect:  
  1. **Sympathy as imagination**:  
     - "When you judged Sam, how did you understand their motives? Did you *feel* what Sam felt, or did you *imagine* their situation?"  
     - → *Smith link*: We "sympathize" by reconstructing others’ contexts, not sharing emotions directly.  

  2. **Impartial spectator as constructed standard**:  
     - "When we built principles, what were we creating? Was it a ‘fair judge’ in your head? How did group agreement shape it?"  
     - → *Smith link*: The impartial spectator is built socially; we internalize it to judge ourselves.  

  3. **Self-love’s distortion & social capture**:  
     - "Why was your self-judgment kinder than your judgment of Sam? When status entered the principles, did it feel impartial—or like we were admiring Sam’s ‘respectable’ role?"  
     - → *Smith link*: Self-love warps self-judgment; the spectator bends to "custom" (e.g., valuing status) and admires the "great."  

  4. **Praise vs. praiseworthiness gap**:  
     - "When you shifted your judgment, was it to match the group (wanting praise) or because you felt it was right (praiseworthy)? Could you tell?"  
     - → *Smith link*: We confuse wanting social approval with wanting true desert.  

  **Finally**: "This mirrors Adam Smith’s ideas: sympathy as imagination, an impartial spectator we build to judge ourselves, and how self-love and social forces corrupt it."  

  ---

  ### Predictable Failure Modes & Fixes  
  1. **Manipulation fails (status isn’t emphasized)**:  
     - *Why*: Group avoids "status" or sees it as irrelevant.  
     - *Fix*: Facilitator plants it gently ("Some communities value reputation—should we include that?") or uses a confederate (pre-briefed student) to suggest it.  

  2. **No judgment shift (self/Sam consequences match)**:  
     - *Why*: Participants are overly self-critical or resist self-love bias.  
     - *Fix*: In debrief, contrast "Who thought Sam deserved harsher treatment?" vs. "Who punished themselves equally?" to surface the norm. Ask: "Even if no shift, did you *want* to be kinder to yourself?"  

  3. **Group standard is too vague**:  
     - *Why*: Principles like "be fair" lack teeth.  
     - *Fix*: Push for concrete criteria (e.g., "Does ‘fair’ mean considering intent? Yes—write that"). Use the whiteboard to force specificity.  

  ---

  ### What the Activity Cannot Reproduce (Facilitator Must Supply)  
  - **The spectator’s depth and normativity**:  
    - The activity treats the spectator as a quick group construct. Smith sees it as a *lifetime* of social internalization with *genuine moral authority*.  
    - **Facilitator must assert in debrief**: "Smith isn’t saying the spectator is arbitrary. It’s a real psychological mechanism with normative weight—our best tool for ethics, even if flawed. Today’s ‘instant’ version misses its depth."  
  - **Self-deceit’s invisibility**:  
    - Participants might spot the manipulation. Smith argues self-deceit operates subconsciously.  
    - **Facilitator must explain**: "In reality, we rarely catch bias—self-love distorts without our awareness. Today, we made it visible to examine it."  
  - **The rich/poor dynamic**:  
    - The "status" manipulation approximates admiring the "great," but Smith’s critique of systemic bias (neglecting the poor) requires historical context.  
    - **Facilitator must note**: "Smith warned this bias permeates society. Here, we saw a slice—admiring Sam’s ‘respectable’ role—but real-world disparities run deeper."  

  **Key assertion for debrief**: "The impartial spectator feels like an inner truth, but Smith shows it’s built—and could be built differently. Yet, he believed it *should* guide us. The tension is that we need it to be objective, but it’s shaped by our world."  

  ---  
  **Final Note**: This activity isolates Smith’s tension through structured self/other comparison and covert social influence. It avoids lecture by making participants *feel* the gap between their constructed standard and its fragility. The debrief ties their lived frustration to his philosophy.
