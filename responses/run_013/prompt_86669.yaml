answer: |-
  ### Final Examination Question  
  **Realism and Anti-Realism Seminar**  
  **Time Allowed: 50 minutes**  

  ---

  **Question**  
  A student proposes blocking the knowability paradox by restricting the knowability principle (KP)—*every truth is knowable*—to *non-self-referential propositions*, analogous to restrictions used to avoid semantic paradoxes like the liar. Your task:  
  1. **Diagnose the proposal**: Does excluding self-referential propositions block the paradox? If not, explain precisely *why* it fails, focusing on the structure of the paradoxical proposition \( p \land \neg Kp \) (where \( K \) denotes "is known").  
  2. **Propose and defend an alternative restriction**: Design a *new restriction* on KP that successfully avoids the paradox. Justify why your restriction works where "self-reference" fails.  
  3. **Assess the cost to anti-realism**: Explain what your restriction forces the anti-realist to abandon or concede. Could it render KP trivial, ad hoc, or incompatible with anti-realism’s core commitments?  

  Additionally, briefly consider: Would rejecting *factivity*, *distribution over conjunction*, or *classical logic* resolve the paradox without restricting KP? Why might these routes fail?  

  ---

  ### Model Answer (≈700 words)  

  #### 1. Why the Self-Reference Restriction Fails  
  The proposal to restrict KP to non-self-referential propositions does *not* block the knowability paradox. The paradoxical proposition—\( q = p \land \neg Kp \) (for an unknown truth \( p \))—is **not self-referential** in the sense of paradoxes like the liar. The liar paradox arises when a proposition *directly refers to its own truth value* (e.g., "This sentence is false"). By contrast, \( q \) does not assert anything *about itself*; it asserts \( p \) (which may be about anything, e.g., "There are mountains on Pluto") and the *independent, empirical* claim that \( p \) is unknown (\( \neg Kp \)). The problem emerges from the *logical interaction* between \( p \) and \( \neg Kp \) under KP and the assumptions about knowledge, not from \( q \)’s self-reference. Thus, a "no self-reference" rule excludes irrelevant cases (e.g., a liar-like "This conjunction is unknown") but permits \( q \), leaving the paradox untouched.  

  #### 2. A Workable Restriction: Non-Blindspot Propositions  
  To block the paradox, KP must exclude propositions like \( q \) that generate *epistemic blindspots*: truths whose knowledge is *impossible* due to their structure. Neil Tennant’s "Cartesian" restriction is exemplary: KP applies only to propositions \( p \) such that \( p \)’s truth *does not preclude* the possibility of knowing \( p \). Formally, \( p \) is "Cartesian" if \( \Diamond K(p) \) is logically consistent. Since \( K(q) \) entails \( Kp \land K(\neg Kp) \) (by distribution), and \( K(\neg Kp) \) entails \( \neg Kp \) (by factivity), \( K(q) \) entails \( Kp \land \neg Kp \)—a contradiction. Thus, \( q \) is *not* Cartesian, and excluding non-Cartesian propositions blocks the derivation. This restriction is *non-ad hoc*: it surgically targets propositions whose knowability is *internally inconsistent*, not merely "problematic" by fiat.  

  #### 3. The Dilemma for Anti-Realism  
  The cost of Tennant-style restrictions is severe for anti-realism. Anti-realism claims truth is *essentially epistemically constrained*: a proposition cannot be true unless it could, in principle, be known. The restriction, however, *concedes* that certain truths—blindspots like \( q \)—are *unknowable*. This risks two pitfalls:  
  - **Circularity**: If we define the restriction as "\( p \) is knowable," KP collapses to "All knowable truths are knowable," rendering it trivial.  
  - **Anti-Realist Incoherence**: If the restriction is *non*-circular (e.g., "Cartesian" as above), it admits truths unmoored from knowability. This contradicts anti-realism’s core tenet that truth *requires* knowability. Worse, since \( \neg Kp \) is often an *empirical* claim (e.g., "No one has checked Pluto for mountains"), excluding it from KP implies that *some aspects of reality* (e.g., our ignorance) are recognition-transcendent—a realist concession. Thus, the restriction saves KP only by gutting anti-realism’s content.  

  #### 4. Alternative Escape Routes?  
  - **Rejecting Factivity**: Abandoning "knowledge implies truth" destroys the concept of knowledge itself, reducing it to mere belief. This is untenable.  
  - **Rejecting Distribution Over Conjunction**: Denying that knowledge distributes over conjunction (e.g., \( K(a \land b) \rightarrow Ka \land Kb \)) *can* block the paradox. However, it requires accepting that agents can know a conjunction *without* knowing its conjuncts—a deeply counterintuitive epistemology that weakens anti-realism’s explanatory power.  
  - **Rejecting Classical Logic**: Adopting intuitionist logic (e.g., denying double-negation elimination) avoids concluding "all truths are known" from the paradox. Yet it still validates that *no truth is unknown*—hardly better for anti-realism—and imposes heavy revisionist costs.  

  #### Conclusion  
  The knowability paradox reveals a fatal tension in anti-realism: maintaining that "all truths are knowable" while acknowledging that *some truths about ignorance* cannot be known without contradiction. Restrictions like "non-self-referential" misdiagnose the issue; effective ones (e.g., "Cartesian") save KP but force anti-realists to admit unknowable truths, betraying their position. While rejecting distribution offers a less damaging escape, it strains the epistemology underpinning anti-realism. Ultimately, the paradox suggests anti-realism must either trivialize KP or concede a realist enclave.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **First-Class Answer (17–20)**  
  - **Diagnosis (6 marks)**: *Correctly identifies \( q \) as non-self-referential*; explains that the paradox stems from logical conflict, not self-reference.  
  - **Restriction (6 marks)**: Proposes a *viable, non-ad hoc restriction* (e.g., Cartesian propositions); *proves* it blocks the contradiction.  
  - **Cost Assessment (5 marks)**: Articulates the *circularity vs. anti-realist incoherence dilemma*; links exclusion of \( q \) to concessions to realism.  
  - **Alternatives (3 marks)**: Notes rejecting distribution *could* work but is costly; others fail decisively.  

  **Competent Answer (12–16)**  
  - **Diagnosis (5 marks)**: States the restriction fails but confuses why (e.g., calls \( q \) "indirectly self-referential").  
  - **Restriction (5 marks)**: Offers a restriction (e.g., "no ignorance claims") but lacks formal precision or defense.  
  - **Cost Assessment (4 marks)**: Notes KP becomes trivial or anti-realism weakened, without dilemma structure.  
  - **Alternatives (2 marks)**: Superficial treatment (e.g., "rejecting factivity is bad").  

  **Adequate Answer (7–11)**  
  - **Diagnosis (4 marks)**: Claims the restriction "might work" or mislabels \( q \) as self-referential.  
  - **Restriction (3 marks)**: Suggests an irrelevant restriction (e.g., "only empirical propositions").  
  - **Cost (2 marks)**: Vague remarks about "limitations" of KP.  
  - **Alternatives (1 mark)**: Omits or gravely misstates alternatives.  

  **Poor Answer (0–6)**  
  Fails to engage the paradox, misrepresents the repair, or offers no restriction.  

  ---

  **Note to Examiner**: Top-tier answers will spot that the "self-reference" proposal mislocates the paradox in *syntax* (self-predication) rather than *semantic conflict under epistemic constraints*. Weaker responses often fixate on \( \neg Kp \) "referring to knowledge" as sufficient for self-reference. Award marks for precision in distinguishing *propositional content* from *logical form*.
