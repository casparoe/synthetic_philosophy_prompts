  I'm a third-year philosophy student and I'm in a seminar on teleology and the intentional stance (cross-listed with phil of bio). We have to hand in a short research proposal — not the paper, just the plan, maybe 1500–2000 words — and I'd like your help turning a half-formed idea into one that actually stands up.

  Act like a philosopher who works on teleosemantics and the intentional stance, and who is allergic to hand-waving. Think carefully, and before you write anything, brainstorm 2–3 different ways of framing the question and tell me which is most likely to be both open and doable in a term.

  Here's the idea. I keep bumping into the notion of a free-floating rationale — the claim, I'm pretty sure it's Dennett's, that there can be a reason for some behavior even when nothing entertains it; e.g. the reason a cuckoo chick or a digger wasp does what it does is present in the design but not in any mind. What bugs me is that people seem to use it to do two jobs at once and I can't tell if they're compatable:

  (1) a thin, explanatory job: positing a rationale is just a way of making sense of / predicting the behavior, with no commitment to its being a fact out there;

  (2) a thick, realist job: it's a genuine feature of the organism, mind-independent, and it's what grounds the later emergence of real reasons and normativity — reasons with reasoners growing out of reasons without them.

  My suspicion is that the explanatory use survives fine on the thin reading, but the emergence story needs the thick one, and the thick one might be smuggling in exactly the norm it was supposed to explain. But I also worry I'm just equivocating on 'reason' — motivating vs normative vs explanatory vs a merely engineering/design rationale — and that once I seperate those the tension dissolves.

  So: turn this into a real proposal. I want (a) the question stated precisely enough that it has a determinate answer, (b) why the existing positions don't already settle it, (c) the method — what I'd actually do, week by week over a term, and why that approach rather than just arguing from intuitions, (d) what a result would look like and what would count as the project failing, and (e) a scope that's honest about a term's worth of time. Don't do a lit review or references — I'll add those myself.

  And please push back: if the two-jobs tension is really a pseudo-problem, or if this can't be done without turning into a whole dissertation, say so plainly instead of humoring me.
