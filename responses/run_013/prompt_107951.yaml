prompt: |-
  Ok so I need help planning something. I'm in this interdisiplinary reading group — bio and econ grad students, a retired nurse, a guy who teaches intro ethics at the community college, we meet in the back room of a bar — and next month's session landed on me. The topic I got handed is the cross-cultural stuff in moral psychology: apparently in some small-scale societies people judge accidental harms much more harshly than we do, and in some places an accidental killing gets blamed about as much as a deliberate one, with intent barely moving the needle, whereas for us intent is basically everything. Throw in the general WEIRD-samples complaint about psych being run entirely on undergrads. The question on the table is what any of that is supposed to mean for whether morality is objective. I've got about seventy-five minutes, a whiteboard, and one guy who brings up Sam Harris every single time.

  Don't explain the material to me — plan the session. I need the order the pieces have to go in. My instinct is that if I open with the cool cross-cultural findings, everyone will immediately jump to "so it's all just culture" and we'll never climb back out, but I don't actually know what has to be in place *first* for those findings to bear on the objectivity question instead of sliding past it. What's the one example or case that should carry the whole thing? I was going to lean on the Müller-Lyer illusion — people in different places supposedly get fooled by it to different degrees, and nobody thinks that shows there's no fact about which line is longer — but I half remember hearing that the cross-cultural version of that has been walked back (something about blind people being fooled by it too?), so tell me whether it's a bad carrier, what the carrier has to have and can't have, or give me a better one. Also the misconceptions you'd expect this exact crowd to walk in with and to form around the halfway mark, and where in the sequence I should head each off — I'm already betting on "the variation just shows we need bigger samples," "if morality were objective everyone would agree," and "come on, everybody everywhere agrees murder is wrong." What should I openly tell them I'm not going to get into at this level? And one question I can put to the room at the end that would actually show me whether they've got the difference between the empirical claim and the metaethical one, rather than just having nodded along. Oh — the econ guy will want to turn the whole thing into cooperation and reciprocity, so if there's a spot to use that instead of fighting it, tell me where.
reasoning: |-
  Okay, let me tackle this user's problem. They're planning a session for an interdisciplinary reading group on whether cross-cultural differences in moral psychology challenge the objectivity of morality. The user is worried that starting with the findings might lead the group to conclude it's all cultural and miss the deeper philosophical points. 

  First, I need to structure the session to prevent premature conclusions. The Müller-Lyer illusion example came up, but I recall that study has issues—like blind people being affected—so it's not reliable. Instead, the user needs a strong "carrier" example that clearly separates perception from judgment. The Harmless Trolley case seems better here. It's a familiar thought experiment where intent matters in Western contexts but might not in other cultures, making the point without confusion.

  The audience mix is important: bio and econ grads, a nurse, an ethics teacher, and a Sam Harris fan. Common misconceptions will likely include conflating disagreement with relativism, assuming objectivity requires universal agreement, and reducing everything to cooperation. I should address these early. For instance, when introducing moral diversity, explicitly state that variation alone doesn't disprove objectivity, using examples like scientific disagreements.

  The econ guy's focus on cooperation can be turned into an asset. During the discussion on why intent matters in some societies, linking it to systems of cooperation and reciprocity could engage him productively. Explaining how complex societies rely on intent-based judgments to maintain cooperation might satisfy his perspective without derailing the session.

  Key points to emphasize: the is-ought gap, the distinction between descriptive findings and metaethics, and avoiding conflation of objectivity with universal agreement. Ending with a question that tests their grasp of this distinction, like asking how the studies relate to whether morality is mind-dependent, would reveal if they've understood the core issues.

  Timing is tight for 75 minutes. Allocating specific chunks to each segment ensures coverage without rush. Starting with the objectivity definition sets the stage, then introducing moral diversity with examples, and finally examining intent variations. The whiteboard will help map concepts and keep track of the discussion flow.

  Also, preempting tangents is crucial. Mentioning upfront that the session won't resolve metaethical debates but focuses on how empirical data interacts with these questions keeps the conversation on track. Managing the Sam Harris references by acknowledging his stance but steering back to the broader philosophical context can prevent digressions.
answer: |-
  Here’s a battle-tested session plan designed to navigate the landmines and leverage your group’s dynamics. The key is structuring the sequence to build conceptual tools *before* introducing the cross-cultural data.

  **Session Goal:** Equip the group to *critically evaluate* whether cross-cultural findings in moral psychology challenge moral objectivity – **without** letting them default to simplistic relativism or universalism.

  **Core Structure (75 Min):**

  1.  **Ground Zero: What "Objectivity" Might Mean Here (10 min)**
      *   **Whiteboard:** "What does it mean for morality to be 'objective'?" Brainstorm features (e.g., mind-independent, universal, fact-like, discoverable by reason, not *just* preference/culture).
      *   **Crucial Focus:** Separate *epistemology* (how we *know* morals) from *ontology* (what morals *are*). Emphasize that disagreement ≠ lack of objectivity (use historical scientific disagreement analogy briefly).
      *   **Head Off:** Explicitly state: "We're *not* trying to *prove* or *disprove* objectivity today. We're asking: **Do these specific empirical findings *challenge* common intuitions about objectivity?**"

  2.  **The WEIRD Lens & Its Limits (15 min)**
      *   **Problem:** "Most psych studies use WEIRD undergrads. Why might this be a problem for claims about *human* moral psychology?"
      *   **Discussion:** Group brainstorms limitations (narrow cultural experience, age, education, exposure to specific philosophical ideas, incentivized participation). Connect to econ guy: "How might this skew models of cooperation/reciprocity if we assume WEIRD responses are universal?"
      *   **Key Point:** Establish that WEIRD findings might reflect *one specific cultural package*, not universal human nature. Creates appetite for non-WEIRD data.

  3.  **The Anchor: Intent in Western Folk Morality (The Control Group) (15 min)**
      *   **Carrier Case:** **The Harmless Trolley (Knobe Effect Variant).**
          *   *CEO hears proposal: Plan A makes profit but harms environment. Plan B helps environment but makes less profit. CEO says: "I don't care about the environment, I just want max profit. Implement Plan A." Environment harmed.*
          *   **Question:** Did the CEO *intentionally* harm the environment? (Most Westerners say YES, despite identical outcome to a case where he *wanted* to harm).
      *   **Whiteboard:** Results. Highlight **Intent/Outcome Distinction** and **Side-Effect Effect** as core features of *many* WEIRD moral judgments.
      *   **Why this first?** Establishes the "default" WEIRD pattern (intent matters hugely) *before* showing variation. Makes the cross-cultural contrast stark. Reinforces point 2.

  4.  **The Cross-Cultural Punch: When Intent Doesn't Rule (20 min)**
      *   **Introduce Findings:** "Now, studies in some small-scale societies (e.g., Mayan, Hadza, Yasawa Islanders) show something different..."
      *   **Core Examples:**
          *   **Accidental Harm:** Person A trips, spills poison in communal stew, kills 2. Person B deliberately poisons stew, kills 2. *Judgments of blameworthiness much closer than in WEIRD samples.*
          *   **Unintentional Sacrifice:** Ritual requires sacrifice. Shaman performs ritual correctly, but unforeseeable accident kills someone. *Shaman often held responsible/blamed.*
      *   **Whiteboard:** WEIRD Pattern vs. Observed Non-WEIRD Pattern (Blame more tied to outcome, less mitigated by intent/accident).
      *   **Address Econ Guy Here:** "How might systems of cooperation/recipritity function differently in small-scale, kinship-based societies vs. large anonymous WEIRD ones? Could outcome-based blame be more functional for maintaining cohesion in certain contexts? Does this explain the difference *without* necessarily negating objectivity?" (Leverages his interest productively).

  5.  **The Crucible: What Does This *Mean* for Objectivity? (10 min)**
      *   **Reframe the Question:** "Given this variation in *how* intent factors into moral judgment..."
      *   **Guided Discussion Prompts:**
          *   Does variation in the *weight given to intent* prove morality is *just* cultural? (Push back: Does variation in *scientific methodology* across cultures/history prove science isn't objective?).
          *   **Müller-Lyer Analogy - Use CAUTIOUSLY:** Acknowledge complexity ("It's contested, but the *point stands as a conceptual tool*"). *"Imagine a perceptual illusion fooling some cultures more than others. Does that mean there's no objective fact about line length? No. It means human *perception* is fallible/culturally shaped. Could variation in moral psychology be about our *moral perception/judgment apparatus* being shaped by environment, rather than the *moral facts themselves*?"*
          *   **Head Off "But Murder!":** "Yes, prohibitions against killing exist widely. But *this* variation shows the *criteria for assigning blame/praise* (like the role of intent) can differ significantly. Does disagreement on *how* to judge a killing challenge objectivity as much as disagreement on *whether* killing is wrong?"
      *   **Concede:** This doesn't *prove* objectivity either! It just shows variation isn't a *knockdown argument* against it. Objectivity might be compatible with culturally-shaped moral *cognition*.

  6.  **Wrap-Up & Diagnostic Question (5 min)**
      *   **Summarize:** We saw WEIRD limitations, established a WEIRD intent-focus, saw cross-cultural variation in that focus, and explored whether this variation challenges the *objectivity* of morality itself.
      *   **Diagnostic Question:** **"Imagine two things are true: (1) Moral facts are objective and mind-independent (like mathematical truths). (2) Human moral psychology is heavily shaped by cultural learning and environment. Could *both* be true simultaneously? Why or why not?"**
          *   *Why it works:* Forces them to engage the core distinction between *the nature of morality* (metaethics) and *how humans perceive/judge it* (psychology). A "yes" indicates grasp of the separation. A "no" likely indicates conflation. Sam Harris guy will likely say "no" - be ready to probe *why* he thinks objective morals *must* produce uniform psychology.

  **Carrier Case Justification:** The **Harmless Trolley (Knobe Effect)** is superior to Müller-Lyer here.
  *   **Relevance:** Directly targets *intentionality* – the core of your topic.
  *   **Robustness:** Well-replicated in WEIRD samples.
  *   **Clarity:** Shows intent isn't just about outcomes, even in WEIRD contexts.
  *   **Contrast:** Sets up a clear, specific WEIRD pattern to contrast with non-WEIRD findings.
  *   **Avoids Müller-Lyer Problems:** You're right, it's messy. Perception isn't a perfect analogy for moral judgment anyway.

  **Misconception Head-Offs:**

  *   **Opening:** "Disagreement ≠ Lack of Objectivity" (Science analogy).
  *   **Before Cross-Cultural Data:** "Remember, variation in *how* a rule is applied doesn't always mean variation in the *rule itself*." and "We're looking at *psychology*, not necessarily *ontology*."
  *   **WEIRD Section:** "This isn't about 'bad science,' it's about the limits of generalizing from one specific sample."
  *   **"Bigger Samples":** "These findings *are* from systematic cross-cultural studies, not just small WEIRD samples. The variation appears robust across distinct non-WEIRD groups."
  *   **Sam Harris (When He Pops Up):** "Harris argues science *can* determine values, often based on well-being. That's one metaethical position. Our question today is narrower: does *this specific type of psychological variation* challenge the *possibility* of objective moral facts, *regardless* of what they're based on? Let's table his full argument for another time." (Be firm but respectful).
  *   **What We're NOT Doing:** State early: "We won't resolve deep metaethical debates (naturalism vs non-naturalism, etc.), judge which culture is 'right,' or fully define moral objectivity. Focus: Do these findings *pose a specific challenge*?"

  **Leveraging the Econ Guy:** Point 4 (Cross-Cultural) is his sweet spot. Frame the functional explanation (outcome-focus aiding cohesion in small groups) as a *potential explanation for the psychological variation*, NOT as a claim about morality itself. Ask: "Does this functional explanation make the variation *more* or *less* challenging to ideas of moral objectivity? Why?"

  This structure builds the necessary framework, introduces the data in a context designed to prevent snap relativism, leverages your group's strengths, and provides tools to diagnose understanding at the end. Good luck with the session!
