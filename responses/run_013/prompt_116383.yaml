prompt: |-
  I'm a first-year PhD student in philosophy of science (I did a CS masters before this, so I can read a proof even if I can't write one) and I'm applying for my department's summer seed grant — it's about 8k for six months, and they want a two-page proposal with the usual parts: the question, the state of play, the plan, the deliverables, the risk. I have a half-formed idea I've been chewing on with a friend from my old lab and I keep failing to write it up in a way that doesn't come out sounding like a book report on Hume.

  The idea. Whenever anyone drags the no-free-lunch theorems into the induction debate, the same thing happens: someone says the theorems show there's no a priori reason to prefer one inductive bias over another, someone else says yes, Hume wins, and then the reply comes that the uniform measure over all objective functions is absurd and nobody is actually uncertain that way, so the theorems are irrelevant. I think both moves are looking at the wrong part of the theorem. The sharpened versions of NFL, as I understand them, aren't really about uniform measures as such — they say the averaging result holds for a class of problems if and only if that class is closed under permutation, i.e. if relabelling inputs and outputs maps the class onto itself, then every method does equally well on average and there's no free lunch. So the theorem is a statement about which transformations leave your space of problems invariant, not about what probability you assign. And that looks like the shape of the grue problem to me (maybe I'm being sloppy here — grue and green aren't related by a pure permutation, there's a time transformation in there too, but you get what I mean): what makes 'green' the better bet is that we treat some transformations as meaning-preserving and others as gerrymandering, and the whole thing bottoms out in which symmetries we take to be constitutive of our concepts rather than discovered in the world. So what I actually want to ask is whether the induction debate is better reconstructed as a disagreement about symmetries, and whether that reconstruction buys us anything or just relocates the mystery one step back — from 'why these biases' to 'why these transformations', which sounds like the same problem wearing a nicer outfit.

  Please turn that into the proposal. I need the question stated so that it has a determinate answer; right now I can feel it splitting into three or four different questions (a formal one, a normative one about justification, and a descriptive one about how the theorems actually get used by ML people) and I don't know which one is mine, or whether the honest thing is to pick one and say the others are downstream. Explain why the existing positions leave this open — the Hume-vindicating reading, the irrelevant-measure reply, and whatever the Bayesian/learning-theoretic people say when they get tired of the whole exchange — and why the symmetry angle isn't just a restatement of the theorem in fancier vocabulary. Tell me what the method actually is for six months, given that I am not going to prove new theorems about permutation-closed classes; is this conceptual work, a formal-but-small reframing, a case study of how NFL gets invoked in the machine learning literature, or some mix, and why that rather than the obvious alternative of writing yet another reply to the Bayesian. Say what a real result would look like versus what would just be me re-labelling the theorem, what would count as the project failing, and be honest about whether this is too big for one summer — if it is, what's the smallest version that's still worth funding. No bibliography or lit review, I'll fill in the citations myself, but if there's a standard name for the permutation-closure sharpening of the theorem, go ahead and use it, because I'm tired of calling it 'the sharper version' in every conversation.
