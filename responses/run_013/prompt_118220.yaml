answer: |-
  Below is a taxonomy of positions on the right to work and leisure, structured as a decision tree. Each internal node is phrased as a practical question a colleague could answer without knowing the underlying theory (e.g., based on everyday reasoning). The tree addresses your six distinctions (presumption of time, value of leisure, grounds for limiting hours, duty-holder, nature of overwork, and relationship between work/leisure rights) and reaches all nine required leaves. 

  Leaves are labeled with the position name (or "unnamed" if undefended), followed by one sentence on its "most awkward commitment"—the counterintuitive, controversial, or challenging implication of holding that view. Where multiple required leaves coincide in one leaf, it is noted; where a logical combination is unoccupied, the reason is given (incoherent, unattractive, or unclaimed).

  ### Decision Tree: Who has a right to work and leisure?

  **Start:** Your employer asks you to work a public holiday for triple pay, but you had planned a family gathering. What do you do?  
  - **A: Work because the job is my calling—I feel a duty to it.** → Go to Node 1  
  - **B: Work because the money is too good to refuse.** → Go to Node 2  
  - **C: Work because I fear penalty (e.g., losing promotion) if I say no.** → Go to Node 3  
  - **D: Refuse to prioritize my planned leisure (e.g., rest, hobby, or time with friends).** → Go to Node 4  
  - **E: Refuse to prioritize a household commitment (e.g., childcare, eldercare).** → Go to Node 5  

  ---

  **Node 1** (from A): When you take time off, what is the main reason?  
  - **A1: To rest so I can return to work more effectively.** → *Leaf: Work as a calling in which idleness is the characteristic vice*  
    - **Most awkward commitment:** Work must continue even if it risks health or life, as idleness is a moral failing.  
  - **A2: Rarely take time off; my calling demands near-constant dedication.** → *Leaf: Work as a calling in which idleness is the characteristic vice* (Same leaf as A1; both converge here.)  

  ---

  **Node 2** (from B): Should there be laws capping working hours?  
  - **B1: No—hours should be set by individual agreement, like any contract term.** → *Leaf: Hours as nothing but a bargained term*  
    - **Most awkward commitment:** If someone freely chooses 100-hour weeks for pay, stopping them violates their autonomy, even if it kills them.  
  - **B2: Yes—to protect health or fairness.** → Go to Node 6  

  ---

  **Node 3** (from C): Why do you feel unable to refuse work without penalty?  
  - **C1: My employer has unchecked power—I have no real choice.** → Go to Node 7  
  - **C2: The system forces it (e.g., gig economy, precarious jobs)—everyone is trapped.** → *Leaf: Structural-equilibrium account of overwork*  
    - **Most awkward commitment:** Individual "work-life balance" is futile; overwork persists until the economic system changes.  

  ---

  **Node 4** (from D): What is the main value of your leisure time?  
  - **D1: It restores my energy for work.** → Go to Node 8  
  - **D2: It's intrinsically rewarding (e.g., for creativity, relationships, or joy).** → Go to Node 9  

  ---

  **Node 5** (from E): Should society treat household labor (e.g., parenting, chores) as "work" with rights?  
  - **E1: Yes—it’s essential labor, just unpaid and invisible.** → *Leaf: Claim that the question is malformed while caring labour goes uncounted*  
    - **Most awkward commitment:** We cannot define "leisure" fairly until unpaid care work is valued, making current debates irrelevant.  
  - **E2: No—household duties are private obligations, not "work."** → *Leaf: Unnamed (household as non-negotiable duty)*  
    - **Most awkward commitment:** Family demands can be as exploitative as employment, but we lack tools to address this.  

  ---

  **Node 6** (from B2): Who should enforce hour limits?  
  - **F1: The state, via laws (e.g., a 35-hour week).** → *Leaf: Statutory maximum hours as a matter of right*  
    - **Most awkward commitment:** The state must override voluntary agreements to protect people from their own "choices" under pressure.  
  - **F2: Employers or unions, via bargaining.** → *Leaf: Unnamed (employer/collective duty)*  
    - **Most awkward commitment:** Employers cannot impartially regulate themselves when profit conflicts with worker well-being.  

  ---

  **Node 7** (from C1): How should we fix this power imbalance?  
  - **G1: Limit hours to prevent employer domination—leisure enables citizenship.** → *Leaf: Civic argument that leisure is a condition of being a citizen*  
    - **Most awkward commitment:** If people use leisure for escapism (e.g., streaming) not civic engagement, the argument weakens.  
  - **G2: Redistribute work fairly so everyone has a job and free time.** → *Leaf: Unnamed (fairness in sharing work)*  
    - **Most awkward commitment:** Reducing hours may lower incomes and not create jobs, worsening inequality.  

  ---

  **Node 8** (from D1): Is the wage system itself the problem?  
  - **H1: Yes—work for wages is exploitative; abolish it entirely.** → *Leaf: Leisure as mere recovery time for labour power that should be abolished along with the wage relation*  
    - **Most awkward commitment:** Reforms like shorter hours are "band-aids" that delay revolution by making capitalism bearable.  
  - **H2: No—the system is fixable with better rules.** → *Leaf: Structural-equilibrium account of overwork* (Same as C2; systemic, not individual.)  

  ---

  **Node 9** (from D2): Why should society protect leisure time?  
  - **I1: For health and autonomy—people need control over their lives.** → *Leaf: Statutory maximum hours as a matter of right* (Same as F1; state duty grounds it in autonomy.)  
  - **I2: For citizenship—people can’t engage in democracy without free time.** → *Leaf: Civic argument that leisure is a condition of being a citizen* (Same as G1.)  
  - **I3: For human flourishing—leisure is where we find meaning beyond work.** → *Leaf: Leisure as a contemplative or festive attitude rather than spare time*  
    - **Most awkward commitment:** True leisure requires resisting the "productivity mindset," making it unattainable in a work-obsessed culture.  

  ---

  ### Notes on Unoccupied or Convergent Leaves
  - **Convergent leaves:**  
    - *Work as a calling* has one leaf (from A1/A2), as both paths emphasize duty overriding justification for leisure.  
    - *Statutory maximum hours* appears twice (from F1/I1), as it can arise from health/autonomy grounds in different contexts.  
    - *Civic argument* appears twice (from G1/I2), as republican power dynamics and citizenship are linked.  
    - *Structural-equilibrium account* appears twice (from C2/H2), as it explains coercion in both individual and systemic terms.  
  - **Unoccupied combinations:**  
    - **"Leisure as recovery" + "Duty on household":** Incoherent. If time is owed to a household (e.g., Node E), leisure can’t be purely for work recovery.  
    - **"Hours as bargained term" + "Intrinsic leisure":** Unattractive. Valuing leisure intrinsically conflicts with seeing hours as purely contractual, making this rare.  
    - **"No rights" + "Fairness grounds":** Unclaimed. Believing in no rights (Leaf below) is inconsistent with fairness-based limits.  
  - **Missing required leaf?** All nine are reached:  
    - Work as calling (Node 1).  
    - Leisure as contemplative (Node 9, I3).  
    - Statutory hours (Node 6, F1 / Node 9, I1).  
    - Hours as bargained (Node 2, B1).  
    - Leisure as recovery to abolish (Node 8, H1).  
    - Civic argument (Node 7, G1 / Node 9, I2).  
    - Structural overwork (Node 3, C2 / Node 8, H2).  
    - Malformed question (Node 5, E1).  
    - No rights to work/leisure (Below).  

  ### Additional Leaf from Node 2
  **From Node 2, B1:** Do you believe society owes people jobs?  
  - **B1a: No—work isn’t a right; jobs are market outcomes.** → *Leaf: No right to leisure and no right to work either*  
    - **Most awkward commitment:** Society has no duty to prevent starvation or exhaustion, as both are "individual responsibilities."  
  - **B1b: Yes—work is a right, but hours are bargained.** → *Leaf: Hours as nothing but a bargained term* (Same as B1; adding "right to work" doesn’t change the leisure analysis.)  

  This tree maps your distinctions to practical choices, isolates the nine positions, and highlights tensions. For bargaining, focus on Nodes 4–9 (where leisure is valued intrinsically) and Nodes 6–7 (where duty is collective or state-based), as these challenge "flexibility" arguments. The structural-equilibrium leaf (Node 3/C2 and Node 8/H2) is key for rejecting individual "balance" rhetoric.
