prompt: |-
  I am assembling materials for a one-semester independent-study project in decision theory and game theory, and I would like you to draft the research proposal for it. The setting is the pair of puzzles introduced by Douglas Hofstadter: the Platonia dilemma and the Luring Lottery. In the Platonia dilemma, some number of people are each promised a large prize if and only if exactly one of them sends in a telegram, with no communication and no binding agreements permitted; naive individual reasoning tells everyone to send, which would spoil it for all, and the "superrational" answer is usually given as each participant sending with probability equal to one over the number of participants. In the Luring Lottery, entrants may submit any whole number of entries, the prize is one million dollars divided by the total number of entries, and a single entry is drawn at random to receive it; here the superrational prescription is said to be a randomization that makes the expected total about one entry, but because the strategy space is unbounded, any number of symmetric prescriptions look equally defensible.

  My half-formed worry, which I want the proposal to sharpen rather than merely restate: the superrational prescriptions in both games appear to depend on an unstated assumption that the participants are in the same situation in a strong sense, and in the Luring Lottery the assumption of a shared strategy does not by itself single out a unique action, since there are infinitely many symmetric strategies and nothing internal to superrationality ranks them. I suspect that what presents itself as a decision-theoretic prescription is really a selection principle imported from outside — perhaps payoff-dominance among symmetric equilibria, or a program-equilibrium style argument in which each player picks a rule that would be optimal if everyone ran the same rule — and that once the participants are even slightly asymmetric (different priors about how many others are playing, or about how likely the others are to reason superrationally), the prescription either becomes indeterminate or collapses into ordinary expected-utility reasoning.

  Please turn this into a formal research proposal containing the following:

  1. A precise statement of the question, narrow enough to have a determinate answer. I would like the central question to be something along the lines of: under exactly what conditions on the game — the number of players and the players' uncertainty about it, finite versus infinite strategy spaces, entry costs, and the degree of asymmetry among players' beliefs — does superrational reasoning yield a unique and well-defined prescription, and when it does not, what supplementary principle, if any, does the real work?

  2. An account of why the existing answers leave this open: what the superrationality literature and its rivals (causal and evidential decision theory, team reasoning, program equilibrium, Kantian universalization) each already settle, and precisely where each falls silent.

  3. The method — the actual formal objects I would construct and the moves I would make. For example: parameterizing the Platonia dilemma by the players' beliefs and locating the point at which the symmetric mixed-strategy prescription ceases to be unique; building an infinite-strategy variant of the Luring Lottery to test whether any principled selection rule survives the loss of a finite strategy set; and comparing what each rival framework predicts across a small set of constructed cases, including one asymmetric case.

  4. What a result would look like and what would count as the project failing. I want to be told what a genuine theorem or taxonomy here would look like, and also the honest failure modes, including the possibility that "superrationality" turns out not to name a single thing.

  5. A realistic month-by-month scope for a single semester's work by one person, with a note on which part is most likely to overrun.

  Assume I will supply all citations myself, so do not include a bibliography and do not refer to specific papers by author and year; refer to positions and arguments instead. Write the proposal in American English, in a formal register suitable for a fellowship or independent-study application.
reasoning: |-
  We are drafting a research proposal on superrationality in the context of the Platonia dilemma and the Luring Lottery. The central concern is that superrational prescriptions appear to rely on strong symmetry assumptions and may break down under asymmetry or in infinite strategy spaces. The proposal should be structured as requested.

  1. **Precise Statement of the Question**:
     We need to specify the conditions under which superrational reasoning yields a unique and well-defined prescription. We will consider:
     - The number of players and uncertainty about it.
     - Finite vs. infinite strategy spaces (with the Luring Lottery as a key example of infinite).
     - Entry costs (if any) in the Luring Lottery.
     - The degree of asymmetry in players' beliefs (about the number of players, the reasoning style of others, etc.).

     The central question is: 
     > Under what conditions on the game structure (number of players, players' uncertainty about the number of players, finiteness of the strategy space, presence of entry costs, and degree of asymmetry in players' beliefs) does superrational reasoning yield a unique and well-defined prescription? When it does not, what supplementary principles (if any) are invoked in the literature, and how do they resolve the indeterminacy?

  2. **Account of Existing Answers**:
     We will briefly survey:
     - Superrationality (Hofstadter): Assumes perfect symmetry and common knowledge of rationality. It prescribes symmetric equilibria but does not address asymmetry or infinite strategy spaces adequately.
     - Causal Decision Theory (CDT): Would prescribe defection in Platonia and over-submission in Luring Lottery, leading to suboptimal outcomes. It does not address coordination on symmetric equilibria.
     - Evidential Decision Theory (EDT): Might condition on one's own action as evidence about others, but in Platonia, conditioning on sending a telegram might lead to the belief that others are not sending, which could justify sending. However, in asymmetric settings, it may not yield a clear prescription.
     - Team Reasoning: Prescribes the action that would be chosen by a team aiming to maximize collective payoff. This can select symmetric Pareto-efficient outcomes but requires a shared team identity and does not specify a unique solution in the Luring Lottery without additional assumptions.
     - Program Equilibrium: Players commit to programs (strategies) that condition on others' programs. It can implement cooperative outcomes but requires precommitment and a mechanism for program selection. It may break down in asymmetric settings and when there are infinitely many programs.
     - Kantian Universalization: Each player acts only on a maxim that they could will to be a universal law. In symmetric games, it often prescribes the symmetric Pareto-efficient action. But it does not resolve the Luring Lottery's indeterminacy because multiple symmetric strategies (with different expected total entries) are equally universalizable.

     The gap: None of these frameworks adequately address the case of asymmetric beliefs or the infinite strategy space of the Luring Lottery. Superrationality, in particular, relies on symmetry and common knowledge without a clear extension to asymmetric cases.

  3. **Method**:
     We will:
     a. **Parameterize the Platonia dilemma**:
        - Model players with different prior beliefs about the number of players (e.g., each player i has a belief distribution P_i over the set of possible player counts).
        - Introduce asymmetry in beliefs about others' rationality: some players may believe others are superrational with probability p_i and rational (in the standard sense) with probability 1-p_i.
        - Analyze the resulting game to see when the symmetric mixed-strategy equilibrium (each sending with probability 1/n) is unique and when it breaks down into multiple equilibria or collapses to standard reasoning.

     b. **Infinite-strategy variant of the Luring Lottery**:
        - Consider the standard Luring Lottery (with no entry cost) and a variant with a small entry cost per entry to test robustness.
        - Investigate symmetric strategies in the infinite strategy space (nonnegative integers). We will look for symmetric Nash equilibria and symmetric superrational prescriptions.
        - Examine whether there exists a unique symmetric equilibrium and, if not, what selection principles (e.g., payoff-dominance, risk-dominance, or minimal total entry) can be applied and whether they are consistent with superrationality.

     c. **Compare rival frameworks across constructed cases**:
        - Design a small set of games (including symmetric and asymmetric versions of Platonia and Luring Lottery) and compute the prescriptions of:
            * CDT and EDT
            * Team reasoning
            * Program equilibrium (with a fixed program space)
            * Kantian universalization
        - Check for agreement or divergence, especially in asymmetric cases.

  4. **Result and Failure Modes**:
     - A successful result would be a theorem characterizing the conditions (on the game and players' beliefs) under which superrational reasoning yields a unique prescription. For example: "In the Platonia dilemma with common knowledge of the number of players and symmetric beliefs about superrationality, the symmetric mixed strategy is the unique superrational equilibrium. However, if players have asymmetric priors about the number of players, then superrational reasoning becomes indeterminate and we must rely on [supplementary principle]." 
     - Another result might be: "In the Luring Lottery with no entry costs, there is no symmetric pure-strategy equilibrium. The symmetric mixed-strategy equilibrium with expected total entry 1 is uniquely selected by the principle of minimal total entry (or by maximizing the expected prize per player). However, when we add an entry cost, the set of symmetric equilibria changes and [X]."
     - Failure modes:
          * Superrationality might not be a unified concept: It might be that in finite symmetric games it reduces to symmetric Nash equilibrium, in infinite games it requires additional principles, and in asymmetric games it has no coherent extension.
          * The project might reveal that superrationality is always parasitic on other frameworks (like program equilibrium or team reasoning) and has no independent content.
          * The asymmetric cases might be too diverse to admit a clean taxonomy.

  5. **Timeline**:
     - Month 1: Formalize the Platonia dilemma with asymmetric beliefs. Model the game and solve for equilibria under different belief structures. Write up the symmetric case as a baseline.
     - Month 2: Extend the analysis to the Luring Lottery without and with entry costs. Identify symmetric equilibria and test selection principles. Begin comparing with rival frameworks for symmetric cases.
     - Month 3: Construct asymmetric versions of both games and compute prescriptions under rival frameworks. Identify points of agreement and divergence.
     - Month 4: Synthesize results, formulate theorems or taxonomies, and write the final report.

     The most likely part to overrun is Month 3 (asymmetric cases) because of the complexity of modeling and solving games with heterogeneous beliefs.

  We now write the proposal accordingly.
answer: |-
  ### Research Proposal: The Foundations of Superrationality in Asymmetric and Infinite Games  

  **1. Research Question**  
  This project investigates the conditions under which superrational reasoning—a decision paradigm emphasizing symmetric, mutually optimal outcomes without explicit coordination—yields unique and well-defined prescriptions. Focusing on Hofstadter’s Platonia dilemma and Luring Lottery, it addresses the following core question:  
  > *Under what structural conditions (e.g., number of players, uncertainty about player count, finite vs. infinite strategy spaces, entry costs, and asymmetry in beliefs) does superrational reasoning generate a unique prescription? When uniqueness fails—due to indeterminacy in symmetric strategies or asymmetries—what supplementary principles (e.g., payoff-dominance, program equilibrium) resolve the ambiguity, and how do they interact with superrationality?*  

  The inquiry is narrowed to three axes:  
  - **Asymmetry in beliefs**: How do heterogeneous priors (e.g., player A believes 10 participants exist, while player B believes 5) disrupt symmetric superrational equilibria?  
  - **Strategy space cardinality**: Does the Luring Lottery’s infinite strategy space admit a privileged superrational strategy when finite analogs (e.g., capped entries) do not?  
  - **Cost structures**: How do entry fees in the Luring Lottery alter the viability of superrational prescriptions?  

  **2. Gap in Existing Literature**  
  Superrationality posits that identical players in symmetric games should adopt identical, collectively optimal strategies. However, extant frameworks leave critical gaps:  
  - **Superrationality** assumes perfect symmetry and common knowledge of rationality, yielding unique prescriptions in finite symmetric games (e.g., mixed \(p = 1/n\) in Platonia). It remains silent on asymmetric beliefs and infinite strategy spaces, where symmetric strategies are non-unique (e.g., any \(k\) with \(E[\text{total entries}] = 1\) in the Luring Lottery).  
  - **Causal/Evidential Decision Theory (CDT/EDT)** resolve indeterminacy via individual rationality but fail to coordinate on symmetric optima (e.g., CDT prescribes over-submission in Luring Lottery). Neither addresses how players anticipate identical reasoning under asymmetry.  
  - **Team Reasoning** selects group-optimal outcomes but requires exogenous team identification and cannot rank competing symmetric equilibria (e.g., multiple \(k\) in Luring Lottery).  
  - **Program Equilibrium** enforces mutual optimality via precommitment to rules, yet it presupposes fixed program spaces and offers no guidance when multiple symmetric programs exist.  
  - **Kantian Universalization** defaults to Pareto-dominant symmetric actions but falters in infinite games where dominance is undefined (e.g., all \(k\) yield identical payoffs in Luring Lottery).  

  These approaches either presuppose symmetry or bypass the indeterminacy inherent in superrationality’s reliance on it. None systematically address how asymmetry dissolves superrational prescriptions or what principles might restore determinacy.  

  **3. Methodological Approach**  
  The project employs game-theoretic modeling to construct and analyze variants of Platonia and Luring Lottery, comparing outputs across decision frameworks. Key steps include:  
  - **Parametric Platonia Models**:  
    - Define a Bayesian game where players have private priors over the number of participants \(n\) and beliefs about others’ rationality (e.g., player \(i\) believes others are superrational with probability \(q_i\)).  
    - Solve for symmetric and asymmetric equilibria, identifying thresholds at which superrationality collapses into CDT-like reasoning (e.g., when \(q_i\) heterogeneity exceeds \(\epsilon\)).  
  - **Infinite Luring Lottery Variants**:  
    - Introduce entry costs \(c > 0\) and strategy caps (e.g., entries \(\leq M\)) to test robustness.  
    - Characterize symmetric equilibria under unbounded strategies; evaluate selection principles (e.g., minimizing total entries vs. maximizing prize-per-player) against Kantian and program-equilibrium criteria.  
  - **Cross-Framework Comparison**:  
    - Construct four canonical cases: symmetric Platonia, asymmetric Platonia (differing \(n\)-priors), symmetric Luring Lottery, and asymmetric Luring Lottery (differing cost perceptions).  
    - Derive prescriptions from CDT, EDT, team reasoning, program equilibrium, and Kantianism. Measure divergence from superrationality and identify points of framework failure.  

  **4. Expected Outcomes and Failure Modes**  
  - **Success**: A taxonomy classifying games by determinacy of superrational prescriptions:  
    - *Theorem sketch*: "In symmetric \(n\)-player Platonia with common priors, superrationality uniquely prescribes \(p = 1/n\). Under belief asymmetry exceeding \(\delta\), it degenerates to individualistic EDT unless supplemented by program-equilibrium selection."  
    - A principled selection rule for infinite-strategy games (e.g., minimal total entries in Luring Lottery as the unique Kantian optimum).  
  - **Failure Modes**:  
    - **Fragmentation**: Superrationality may not cohere into a unified theory, instead fracturing into context-dependent applications of team reasoning or program equilibrium.  
    - **Indeterminacy Persists**: Asymmetry or infiniteness may preclude any unique solution, even with supplementary principles.  
    - **Trivialization**: Asymmetric cases may universally reduce to CDT/EDT, rendering superrationality redundant.  
  A negative result—e.g., "superrationality lacks independent content under asymmetry"—would still advance the field by clarifying its limitations.  

  **5. Timeline and Scope**  
  - **Month 1**: Formalize symmetric Platonia and Luring Lottery. Derive superrational equilibria; compare with rival frameworks.  
  - **Month 2**: Introduce asymmetry in Platonia (varying \(n\)-priors). Characterize equilibrium breakdown; test team/program supplements.  
  - **Month 3**: Extend Luring Lottery to infinite strategies + entry costs. Identify selection principles; evaluate Kantian universalization.  
  - **Month 4**: Synthesize results into taxonomy; draft final report.  

  **Overrun Risk**: Month 3 (infinite games) is most vulnerable due to technical challenges in continuum strategy spaces. Month 2 may expand if asymmetric equilibria prove intractable. Contingency: Focus on bounded Luring Lottery variants if unbounded cases are infeasible.  

  This project aims to resolve superrationality’s ambiguities by stress-testing it against asymmetry and infiniteness—ultimately clarifying whether it is a robust decision paradigm or a veneer over imported principles.
