  **Luring Lottery Official Rules**  

  1. **Entry Procedure**: Each housemate may submit exactly one email to the designated address by the specified deadline, with the subject line containing a single positive integer (the "Entry Number"), representing their total entries into the lottery; non-conforming submissions are void.  
  2. **Prize Calculation**: The total prize fund is fixed at £1,200, divided by the aggregate number of valid entries received from all participants to determine the final prize amount.  
  3. **Winner Selection**: One entry is drawn uniformly at random from the entire pool of valid entries; the housemate who submitted the selected entry wins the entire calculated prize amount.  
  4. **Collusion Prohibition**: Participants must not communicate their Entry Numbers or coordinate strategies prior to submission; violations may invalidate the lottery or disqualify involved parties at the organizer’s discretion.  
  5. **Prize Disbursement**: The prize, irrespective of its final value (which may be a fraction of a penny and is influenced by the total entries), is awarded in full to the winner; the organizer’s determination of all outcomes is final.
