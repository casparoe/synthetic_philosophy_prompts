answer: |-
  ## The Fifty-Year Plank

  [Clinks glass gently] Ladies and gentlemen, fellow crew, trustees, donors, and especially you, our indomitable coxswain – thank you for your patience with a retired scientist who’s swapped sediment cores for… well, rather too much thinking. It’s a profound honour to stand before you as we mark fifty years of this remarkable trust and the vessel that has been its beating heart.

  Now, many of you know I’ve been wrestling lately with an old puzzle. It started as a parlour game: a ship sailing for centuries, having every single plank replaced, one by one. Is it still the same ship? Harmless fun, I thought. Until it became *our* boat. Until I realised, preparing this toast, that it’s not just a riddle – it’s the very question hanging over this marquee tonight. Three claimants stand before us: the boat still sailing out there on the tide; the carefully reassembled timbers in the county museum, labelled ‘the original’; and the new vessel waiting in the wings to take the name and bell in spring. Which one are we toasting tonight? We *must* choose; a toast needs a focus.

  So, let’s look at the facts, undisputed thanks to dendrochronology and stable isotopes – tools of my old trade. We can pinpoint where and when each oak grew. We know that from the 1912 build, only the keel, stem, sternpost, eleven frames, the mast step, the bell, the log books, and the name remain in *this* vessel. The rest? Replaced. Twice. The museum holds planks once bolted to her frames, now displayed as ‘the original boat’. And soon, a completely new hull will carry her name and bell. Facts measured, catalogued, undeniable.

  But do these facts tell us *which* is *her*? Our 1998 shipwright declared loudly: a boat is her keel and her name. Simple. Material continuity, anchored by the name. The museum curator, equally clear in his accession papers, sees the reassembled 1912 planking as the true vessel. Original material, preserved. The underwriters, pragmatic souls, will soon stipulate in cold ink what *they* consider ‘the vessel’ for insurance purposes. These are definitions, decisions – stipulations. Useful, necessary even, but not discoveries about identity. They tell us *how* someone chooses to define her, not necessarily *what* she *is*.

  So, what else can we weigh? Continuity of form and function? The museum hull has the *shape* of 1912, but it doesn’t ride the waves. It doesn’t fulfil the purpose for which it was built. The new boat will have a similar form, and soon, the same function – but it hasn’t started yet. It carries potential, not history. *This* boat, the one outside, still sailing? Her lines echo 1912, yes, but modified by rebuilds. Crucially, she *has* fulfilled the function, continuously, for fifty years: taking young people to sea. She *is* the working boat.

  Then there’s the thread of her life. Her causal history. The keel laid in 1912. The countless voyages logged in those books. Every storm weathered, every reef negotiated, every young face lit by the salt spray and the challenge. The name, echoing across decades. The crews – especially one coxswain whose forty years at her helm are a history lesson in themselves! This continuity isn't physical timber; it's the unfolding story. It’s the *habit* of being this specific boat, doing this specific work, bearing this specific name through time. The museum hull? Its history *stopped* when its planks were removed. Its story is now one of preservation, not operation. The new boat’s story hasn’t truly begun.

  One could take an austere view: perhaps there *is* no single boat persisting through time. Just timber, fastenings, arrangements – ‘boatwise’, as it were. Tonight, in this marquee, filled with laughter and shared memory, that view feels… thin. It dissolves the very thing we’ve gathered to celebrate. Why? Because it ignores the powerful reality of *this* ongoing project – the trust, the crew, the generations learning on *this* vessel. The boat isn’t *just* the sum of her current planks; she’s the vessel carrying our collective endeavour forward. To deny her persistence is to deny the meaning of these fifty years.

  So, where does that leave us? The museum hull is a precious artefact, a vital snapshot of her beginning. We owe the curator and the historian enormous gratitude for preserving that chapter. The new boat? She embodies our future hope, our commitment to carry the work forward. We welcome her with open arms and deep appreciation for the generosity that brought her here.

  But the vessel we toast tonight? It must be the one that *carried* the history. The one whose worn deck beams absorbed the shouts of learning teenagers for half a century. The one whose keel – that original 1912 spine – has consistently borne the weight of her purpose. The one whose logbooks record a continuous journey, not an interrupted one. The one whose bell still rings over the waves *she* is still actively sailing. She is the claimant defined not by pristine material or a stipulated definition, but by the unbroken thread of *being* our working boat, our teacher, our floating classroom. She is the ship whose identity resides in her enduring function and her continuous voyage through time – a voyage maintained by care, rebuilds, and the relentless dedication of people like our coxswain.

  She is the boat that, despite the replacement of planks, frames, and deck beams, never ceased *being* the vessel entrusted to us fifty years ago. Her material evolved, her form subtly adapted, but her story – the story we are part of – rolled on, wave after wave, season after season.

  So, raise your glasses high, to the living history, the enduring purpose, the boat still answering her helm. To fifty years of voyages, of lessons learned at sea, and to the remarkable vessel that carried them all: **Our Boat! May her spirit, her lessons, and her purpose sail on!**

  [Lowers glass, looks towards the coxswain with a slight smile] And may she continue to tolerate philosophers.
