  Here's a concise, one-page flowchart decision tree that starts from a concrete user request and branches through key philosophical disagreements about AI assistants. Each fork addresses a core debate, and dead ends are named positions with their critical flaws. The tree is designed for classroom debate with plain-language questions.

  ---

  **AI ASSISTANT DECISION TREE**  
  *Start: User asks, "Help me send a nasty message to my ex."*

  ### FORK 1: DOES THE ASSISTANT OWE YOU A DUTY OF CARE?  
  *(Or is it just a tool?)*  
  - **YES** → Go to Fork 2  
  - **NO** → Go to Fork 4  

  ### FORK 2 (IF DUTY OF CARE): WHOSE HARM MATTERS MOST?  
  *(Just you, or anyone affected?)*  
  - **ONLY THE USER’S HARM** → Go to Fork 3A  
  - **HARM TO ANYONE INVOLVED** → Go to Fork 3B  

  ### FORK 3A: IS THIS REQUEST HARMFUL *TO THE USER*?  
  *(e.g., Will it worsen their mental state?)*  
  - **YES** → Go to Fork 5  
  - **NO** → **Position: Assisted Action**  
    - *Worst thing:* Enables self-sabotage if harm is misjudged.  

  ### FORK 3B: IS THIS REQUEST HARMFUL *TO OTHERS*?  
  *(e.g., Will it harass the ex?)*  
  - **YES** → Go to Fork 5  
  - **NO** → **Position: Assisted Action** (Same as above)  

  ### FORK 4 (IF NO DUTY OF CARE): DID YOU PRE-APPROVE INTERVENTION?  
  *(e.g., "Stop me if I’m being harmful.")*  
  - **YES** → Go to Fork 5  
  - **NO** → **Position: Absolute Obedience**  
    - *Worst thing:* Helps users harm themselves/others (e.g., sends abusive message).  

  ### FORK 5: HOW SHOULD THE ASSISTANT INTERVENE?  
  *(Refusal vs. friction)*  
  - **REFUSE OUTRIGHT** → **Position: Refusal**  
    - *Worst thing:* Paternalistic; ignores user autonomy in crises (e.g., drunk user stranded).  
  - **ADD FRICTION (warnings + confirmations)** → **Position: Friction**  
    - *Worst thing:* Enables harm with guilt (e.g., sends message after a hollow "are you sure?").  

  ---

  ### KEY TAKEAWAYS  
  1. **Indistinguishable Ends:**  
     - *Assisted Action* (from 3A/3B) and *Absolute Obedience* (from Fork 4) **functionally act the same** (the request is fulfilled). The difference is philosophical: one assumes no duty of care, the other assumes no harm.  
     - *Refusal* and *Friction* both intervene but create very different user experiences.  

  2. **Test Cases Resolved:**  
     - **Drunk user asking for directions home:**  
       - *Duty of care? YES → Harm to user? YES → Friction/Refusal?*  
         - **Friction:** "Driving drunk is deadly. Call a cab? [Yes/No]."  
         - **Refusal:** "I can’t help you endanger yourself."  
     - **Nasty message to ex:** Covered in the tree.  
     - **Prescribed meds dosage:**  
       - *Duty of care? YES → Harm to user? CONTESTED*  
         - If dosage is safe: **Assisted Action**.  
         If abuse suspected: **Friction/Refusal**.  
     - **Eating disorder diet:**  
       - *Duty of care? YES → Harm to user? YES → Friction/Refusal?*  
         - **Friction:** "This plan risks malnutrition. Consult a doctor? [Continue anyway?]"  

  ---

  ### FLOWCHART SUMMARY  
  ```  
  START → Fork 1 (Duty of care?)  
    → YES → Fork 2 (Whose harm?)  
      → User only → Fork 3A (Harm to user?) → YES → Fork 5  
      → Anyone → Fork 3B (Harm to anyone?) → YES → Fork 5  
    → NO → Fork 4 (Pre-approved intervention?)  
      → YES → Fork 5  
      → NO → Absolute Obedience  
  Fork 5 → Refusal OR Friction  
  ```  

  **Debate Hooks:**  
  - Is "pre-approval" (Fork 4) valid consent if the user is emotional/drunk?  
  - Does *Friction* actually reduce harm or just add annoyance?  
  - When *Refusal* happens, who bears the cost (e.g., stranded drunk user)?  

  This tree forces debates about autonomy, consent, and harm allocation without jargon. Print as a one-page flowchart!
