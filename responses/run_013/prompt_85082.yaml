    - We will run this round for 3 turns to allow learning. In each turn, we reassign types within the group (so the same two people, but one is High and one is Low, randomly assigned each turn). Then they play. After each turn, they see the outcome.

    - After a few turns, receivers will learn to always choose the signaler who signals? And signalers will learn that if they are High, it's worth signaling, and if Low, it's not.

  Round 4: Index (if time)
    - The signal is only available to High quality. Low quality cannot signal even if they want to.
    - Cost for High to signal: 0.
    - Low quality: cannot signal.
    - Then, High will signal (free). Low cannot.
    - Receiver sees one signaler signaling and one not. They choose the one who signals? Then they get 10. High gets 10, Low gets 0.

    - But what if the High doesn't signal? Then both don't signal? But High can signal for free, so they will? We can force High to have the option to signal or not? But if they don't, then they look like Low? But why wouldn't they? So they will signal.

  Running order for the session (90 minutes):

  1. Introduction (10 minutes): Explain the setting, roles, and the goal of understanding signaling. Explain the rounds. Assign groups.

  2. Round 1: Free signals (10 minutes)
     - Explain rules
     - Play 2 turns (each turn: assign types, signalers decide, receiver chooses, record payoffs)

  3. Round 2: Uniform cost (10 minutes)
     - Explain new rules (cost 5 for everyone)
     - Play 2 turns

  4. Round 3: Graded cost (15 minutes)
     - Explain new rules (High cost 3, Low cost 8)
     - Play 3 turns (to allow learning)

  5. Round 4: Index (10 minutes, if time)
     - Explain: only High can signal (cost 0), Low cannot.
     - Play 2 turns

  6. Debrief (35 minutes): Discuss the rounds and map to theory.

  Materials:
  - For each group: 
     - Type assignment: two cards (High and Low) for the two signalers, shuffled and distributed secretly each turn.
     - A decision sheet for signalers: each turn, they write down whether they signal (in Rounds 1-3) or not (in Round 4, only High can).
     - For the receiver: a sheet to record which signalers are signaling and then their choice.
     - Payoff recording for each player.

  - For the facilitator: a master sheet to collect data from groups? Or not necessary, but we can have a whiteboard to record average payoffs.

  Payoff scheme:
  - As described per round.

  Debrief:

  Round 1: Free signals
    - Theory: signals are free, so everyone signals. The signal provides no information because it doesn't distinguish types. Receivers cannot do better than random. The signal is not honest in the sense that it is not informative.

  Round 2: Uniform cost
    - Theory: signals are costly but the cost is the same for both types. This creates a burden but does not separate types. In the long run, signalers might stop signaling because it is wasteful, and then the signal disappears. Or if they continue, it is still not informative. The cost is not graded by quality, so there is no incentive for only high-quality to signal.

  Round 3: Graded cost
    - Theory: the cost is graded: it is cheaper for the high-quality individual to signal. This creates a separating equilibrium: high-quality signals, low-quality does not. The signal is honest because it is too expensive for the low-quality to fake. The receiver can trust the signal. Note: the cost is not necessarily wasteful; it is the difference in marginal cost that matters.

  Round 4: Index
    - Theory: the signal is an index. It is tied to the quality (only high-quality can produce it) and cannot be faked. It is cheap (or free) for the high-quality, and impossible for the low-quality. The signal is honest by necessity. No cost is required beyond the production constraint.

  What might go wrong:

  Round 1: 
