    - Alternatively, we can run the round without revealing, and then after the round, we ask the receiver how they chose.

    - Also, the signalers might not play equilibrium: a Low might try to signal? Then if they do and the High also signals, the receiver might choose randomly? Then the Low might get chosen and get 10-8=2? But if they are not chosen, they lose 8? Risk. And the High might get only 2 (if chosen) or -3 (if not). Then in the next turn, they might adjust.

  Round 4:
    - Should be straightforward.

  What the activity cannot reproduce:

  - The evolutionary process: how the population finds the equilibrium. We have to explain that in nature, the strategies evolve over generations.

  - The continuous variation in quality and signal.

  - The possibility of pooling equilibria or mixed strategies.

  - The dynamic adjustment in real populations.

  We have to emphasize that the game shows the incentive structure at equilibrium, but not the process of getting there.

  This design should fit in 90 minutes.
answer: |-
  Below is a comprehensive design for your 90-minute teaching session, structured as a game to help participants discover the core insights of the handicap principle and signaling theory step by step. The game uses a partner-choice framework with hidden quality types, and it progresses through four rounds that mirror your learning objectives: (1) free signals are worthless, (2) uniformly costly signals are futile, (3) graded costs enable honest signaling, and (4) index signals achieve honesty without cost. I've included rules, materials, payoffs, running order, debriefing points, and notes on limitations.

  ---

  ### **Game Overview**
  - **Core Idea**: Participants experience how signal honesty emerges from incentives, not just cost. Signalers (with hidden quality) decide whether to signal to attract Receivers (who choose partners). Payoffs depend on successful matching and the cost/benefit of signaling.
  - **Group Structure**: Split into 6 groups of 3 (total 18 participants). Each group has:
    - **2 Signalers**: One "High-Quality" (HQ) and one "Low-Quality" (LQ), assigned secretly each round.
    - **1 Receiver**: Chooses one Signaler to partner with.
  - **Hidden Quality**: HQ types have higher "intrinsic value" (e.g., better genes/resources), but this is only revealed if matched. LQ types cannot fake HQ.
  - **Signal Decision**: Signalers choose to "signal" (e.g., display a trait) or not. Signaling costs vary by round and type.
  - **Partner Choice**: Receiver observes signals and chooses one Signaler. If no one signals, Receiver chooses randomly.
  - **Payoffs**: 
    - **Signaler**: Gains 10 "fitness points" if chosen, minus signaling cost. Not chosen = 0 points.
    - **Receiver**: Gains 10 points if matched with HQ, 0 if matched with LQ.
  - **Currency**: "Fitness points" (not real money). Tracked on score sheets.
  - **Rounds**: 4 rounds, each with 2 turns (except Round 3 with 3 turns). Types are re-randomized each turn. Total time: 50 minutes for gameplay.

  ---

  ### **Materials (Per Group)**
  1. **Role Cards**: 2 Signaler cards (labeled "Signaler 1", "Signaler 2"), 1 Receiver card.
  2. **Quality Cards**: 2 cards per group (one "High", one "Low") for secret type assignment.
  3. **Decision Sheets**: 
     - **Signalers**: Circle "Signal" or "No Signal" each turn.
     - **Receiver**: Record observed signals and choice (e.g., "Signaler 1 signaled, I choose them").
  4. **Payoff Trackers**: Tables to record points per turn (see template below).
  5. **Round-Specific Rule Cards**: Brief instructions for each round (distributed sequentially).
  6. **Shared Props**: 
     - Red/Blue tokens (optional) for signaling (e.g., red = signal, blue = no signal).
     - Whiteboard for facilitator to summarize group outcomes.

  **Template Payoff Tracker** (photocopy for all groups):

  | Turn | Signaler 1 (Quality) | Signal? | Cost Paid | Chosen? | Payoff | Receiver Choice | Receiver Payoff |
  |------|----------------------|---------|-----------|---------|--------|-----------------|----------------|
  | 1    | ?                    |         |           |         |        |                 |                |
  | 2    | ?                    |         |           |         |        |                 |                |

  ---

  ### **Running Order (90 Minutes Total)**
  1. **Introduction (10 min)**:
     - Briefly frame the session: "Today, we'll explore why some signals in nature are honest. You'll play a game where Signalers advertise quality, and Receivers choose partners. We'll run multiple rounds, each with new rules."
     - Assign groups and roles (5 min): Randomly split into 6 groups. Distribute Role Cards. Emphasize:
       - Quality (High/Low) is hidden and reassigned each turn.
       - Goal: Maximize your fitness points.
     - Explain core mechanics (5 min): "Each turn, Signalers decide to signal or not. Receivers observe signals and choose one partner. Payoffs depend on matches and costs."

  2. **Round 1: Free Signals (Cost = 0) (10 min)**  
     **Objective**: Show that free signals are worthless (no separation, no information).  
     **Rules**: 
     - Signaling costs 0 for both HQ and LQ.
     - Receiver sees signals and chooses one partner.  
     **Predictions**: 
       - All Signalers signal (no cost, only upside). 
       - Receivers see identical signals → choose randomly. 
       - Result: No separation (HQ/LQ chosen equally often), low average payoffs.  
     **Flow**:
       - Assign types secretly (HQ/LQ) using Quality Cards (1 min).
       - Signalers decide (1 min): All likely signal.
       - Receiver chooses partner (1 min).
       - Record payoffs (1 min). 
       - Repeat for Turn 2 (reassign types). 
       - **Group Discussion (1 min)**: "Did signals help Receivers? Why or why not?"

  3. **Round 2: Uniform Cost (Cost = 5 for all) (10 min)**  
     **Objective**: Show that uniformly costly signals are futile (no separation, signals ignored).  
     **Rules**: 
     - Signaling costs 5 points for both HQ and LQ.
     - Receiver sees signals and chooses one partner.  
     **Predictions**: 
       - Signaling is costly but identical for all → Signalers may stop signaling to avoid costs. 
       - If no one signals, Receivers choose randomly → signals become irrelevant. 
       - Result: Payoffs decrease for all, no improvement in matching.  
     **Flow**:
       - Assign types (1 min).
       - Signalers decide (1 min): Many won't signal (costly with no benefit).
       - Receiver chooses (1 min): If no signals, choose randomly.
       - Record payoffs (1 min).
       - Repeat for Turn 2. 
       - **Group Discussion (1 min)**: "Did costly signals improve matching? Why did/didn’t you signal?"

  4. **Round 3: Graded Cost (Costs: HQ = 3, LQ = 8) (15 min)**  
     **Objective**: Show graded costs enable honest signaling (HQ signals, LQ does not → separation).  
     **Rules**: 
     - HQ signaling costs 3 points; LQ costs 8 points.
     - Receiver sees signals and chooses one partner.  
     **Predictions**: 
       - HQ signals (net gain if chosen: 10 - 3 = 7). 
       - LQ does not signal (cost 8 too high; net gain if chosen would be 2, but unlikely). 
       - Receiver chooses signaling partner → always matches with HQ. 
       - Result: High payoffs for HQ and Receivers; low for LQ.  
     **Flow**:
       - Assign types (1 min).
       - Signalers decide (1 min): HQ signals, LQ avoids.
       - Receiver chooses (1 min): Likely picks the signaler who signaled.
       - Record payoffs (1 min).
       - Repeat for 3 turns (to reinforce learning). 
       - **Group Discussion (1 min)**: "Why did only some signal? How did Receivers use signals?"

  5. **Round 4: Index Signals (If time, 10 min)**  
     **Objective**: Show unfakeable signals achieve honesty without cost.  
     **Rules**: 
     - HQ can signal for 0 cost; LQ cannot signal at all (even if they try).
     - Receiver sees signals and chooses one partner.  
     **Predictions**: 
       - HQ signals (free and beneficial). 
       - LQ cannot signal → only HQ signals. 
       - Receiver chooses signaling partner → always matches with HQ. 
       - Result: High payoffs for HQ/Receivers; no cost incurred.  
     **Flow**:
       - Assign types (1 min).
       - Signalers decide (1 min): HQ signals, LQ does nothing.
       - Receiver chooses (1 min): Selects the signaler who signaled.
       - Record payoffs (1 min).
       - Repeat for Turn 2. 
       - **Group Discussion (1 min)**: "How is this different from Round 3? Could LQ fake this signal?"

  6. **Debrief and Theory Mapping (35 min)**:  
     Facilitate a full-group discussion. Use whiteboard to summarize outcomes.  
     - **Round 1 (Free Signals)**:  
       - Theory: Free signals provide no information because anyone can afford them. Signals are "cheap talk" → ignored by Receivers.  
       - Outcome: Random matching, payoffs ~5 for all (since HQ chosen 50% of the time).  
       - Key Insight: Cost alone doesn’t create honesty; correlation between cost and quality is key.  
     - **Round 2 (Uniform Cost)**:  
       - Theory: Uniform costs are wasteful but don’t separate types because marginal cost is equal. Low-quality types can still afford signals, or signals are abandoned.  
       - Outcome: Signaling declines; Receivers ignore signals → matching remains random. Payoffs lower due to costs (e.g., Signalers average 0–5, Receivers ~5).  
       - Key Insight: Mere expense is futile; it only makes the group poorer.  
     - **Round 3 (Graded Cost)**:  
       - Theory: Graded costs (lower marginal cost for HQ) enable separation. Signals are honest because LQ cannot profitably imitate (costs are "differentially burdensome").  
       - Outcome: HQ signals, LQ doesn’t → Receivers identify HQ. HQ/receivers gain high payoffs (7–10), LQ gain 0.  
       - Key Insight: Honesty comes from the correlation, not the absolute cost. Signals need not be wasteful (e.g., HQ net 7 points).  
     - **Round 4 (Index Signals)**:  
       - Theory: Index signals are unfakeable (causally linked to quality) and cheap/free. Honesty arises from physical constraints, not costs.  
       - Outcome: HQ signals freely, LQ cannot → perfect matching.  
       - Key Insight: "Handicap" isn’t the only path; indices provide cost-free honesty.  
     - **Overarching Themes**:  
       - Honesty is equilibrium-specific: A signal that works in Round 3 would fail in Round 2.  
       - Receivers drive the system: Their attention (or lack thereof) determines signal value.  
       - Handicap principle oversimplification: It focuses on cost but misses graded costs and indices.  

  ---

  ### **What Will Go Wrong and How to Handle It**
  - **Round 1**: 
    - **Issue**: Signalers might not signal (e.g., "Why bother if it’s free?").  
    - **Fix**: Remind them that signaling has no downside and might help. If they resist, note that in nature, signals often evolve if they have any potential benefit.
  - **Round 2**: 
    - **Issue**: Signalers may all signal anyway (e.g., "Maybe Receivers prefer signalers"). Receivers might not ignore signals.  
    - **Fix**: After Turn 1, highlight that costly signaling didn’t improve matching (use group data). Ask Receivers: "Did signals help you? Why pay attention if everyone does it?"  
  - **Round 3**: 
    - **Issue**: LQ might signal (e.g., "I’ll risk it to get chosen"), or Receivers might not trust signals initially.  
    - **Fix**: Use 3 turns for learning. After Turn 1, reveal types (temporarily) to show Receivers that signalers were HQ. Ask: "Why couldn’t LQ afford this?"  
  - **Round 4**: 
    - **Issue**: LQ might protest ("I want to signal!").  
    - **Fix**: Emphasize the rule: "This signal is unfakeable—only HQ can produce it." Relate to real indices (e.g., deep croak = large body).  
  - **General**: 
    - **Chaos**: With 6 groups, pacing may vary. Assign a timekeeper; use a bell. 
    - **Confusion**: Philosophers may overthink incentives. Provide simple examples (e.g., "Think of HQ as a healthy bird growing a tail; LQ as a sick one").

  ---

  ### **What the Game Cannot Reproduce (and How to Address)**
  - **Evolutionary Dynamics**: The game shows static incentives at equilibrium, not how populations evolve toward it.  
    - **Supplement**: Post-game, explain that equilibria emerge via selection (e.g., mutants who cheat are punished by Receivers and die out). Use a 2-minute example: "Imagine a LQ bird signaling in Round 3—it pays 8 points but rarely gets chosen, so its lineage shrinks."
  - **Continuous Variation**: The game uses binary types (HQ/LQ), but real quality/signals are often continuous.  
    - **Supplement**: Mention that graded costs work across spectra (e.g., tail length incrementally cheaper for fitter birds).  
  - **Receiver Learning**: In nature, receivers evolve responses; here, they learn in minutes.  
    - **Acknowledge**: Note that the game compresses evolutionary time.  
  - **Non-Equilibrium States**: The game starts near equilibrium; it doesn’t show chaotic initial phases.  
    - **Address**: Discuss how initial conditions matter (e.g., in Round 2, signals may persist briefly before collapsing).

  ---

  ### **Why This Works**
  - **Experiential Learning**: Participants "feel" why costs alone fail and how graded/index signals work.  
  - **Interdisciplinary Appeal**: Biologists see concrete examples; philosophers grasp game-theoretic incentives.  
  - **Time-Efficient**: Rounds build logically, and debriefing maps directly to theory.  
  - **Low Barrier**: Simple rules, no math, focused on intuition.  

  By the end, your group should viscerally understand why the handicap principle is more than "cost equals honesty"—and why philosophy clarifies what fieldwork obscures. If you test-run this, I’d love feedback!
