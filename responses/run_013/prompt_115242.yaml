  The user's hunch about the differences being top-down vs. diffuse and different timelines seems spot on. I need to confirm that. Also, the friend's "temporal audit" idea isn't directly from either theory but aligns with Hobsbawm's method. Explaining how it fits into his approach would clarify that.

