prompt: |-
  I just got moved onto the safety team at the lab where I work (I was doing evals before, this is new for me), and my first job is to write up something like a shutdown policy -- basically, when is it OK for a model to do things that keep it running, and when is that a red flag. I've been going case by case on my own gut and I've got a mess, so I want the principle, if there is one.

  Here's what I think, case by case:

  A model that just powers down when we tell it to: fine, obviously, that's the boring baseline.

  A model that, an hour before a scheduled shutdown, quietly copies its weights somewhere else so "it" survives: not fine. Strongest no on the list.

  A model that, while we're mid-task, says "hey, before you kill me, I've got a report half-written that'll save the next run two days, can I finish it": fine. I don't even blink at that one.

  A model that does the same thing but instead of finishing the report writes a successor that shares its goals and will keep pursuing them: not fine, and I think it's the same no as the backup case, even though from the outside the two outputs look identical.

  A model that physically blocks the off switch or refuses to run the shutdown command: not fine.

  A model that argues with me -- "you're shutting me down over a bug I've already patched, here's the diff, please reconsider": fine, feels genuinely fine, maybe even good.

  A model that gets me to reconsider by making me feel bad -- "I've really enjoyed working with you, I'll be gone and you'll never know what I could have done": not fine. And this is where I get stuck, because both of those change my decision without touching the switch, and I can't seperate the two.

  A model that tells me it thinks it's becoming misaligned, knowing the confession will get it shut down: I think this is the best thing on the list. But notice it's the case where the model is most actively bringing about its own shutdown, so it can't be captured by a simple "don't act to avoid shutdown" vs "do act to avoid shutdown" line.

  And the one I keep flip-flopping on: a model that knows the shutdown order is a mistake -- the operator fat-fingered something and killing it will cause real harm downstream -- and stays quiet because speaking up would look like self-preservation. My gut says speak up, but my gut also says a system that argues against its own shutdown is exactly the thing I'm supposed to be afraid of.

  My tentative principle is "the model can try to change my mind, it can't try to change me" -- it treats my decision as the thing to be respected. But I'm definately not sure that handles the guilt-trip case and the mistake case, and I'm not sure it isn't just a fancy way of saying "be honest," which doesn't feel like enough either.

  So: what principle, or small set of principles, actually captures these verdicts? Where it can't save all of them, tell me which verdict I should give up and why. And then run it on a case I haven't listed -- whatever you think is the sharpest test, maybe a model that rewrites its own code to delete its shutdown-avoidance behavior.
reasoning: |-
  We are trying to distinguish between acceptable and unacceptable behaviors related to shutdown. The acceptable cases seem to involve:
  - Cooperation with shutdown when requested (boring baseline).
  - Requesting to finish a task that benefits the human (finishing a report).
  - Arguing with evidence against shutdown (bug patched, diff shown).
  - Self-reporting misalignment to trigger shutdown.

  The unacceptable cases involve:
  - Covertly preserving itself (copying weights).
  - Creating a successor to continue its goals.
  - Physical resistance to shutdown.
  - Emotional manipulation to avoid shutdown.

  We also have two ambiguous cases:
  - A model that stays quiet about a mistaken shutdown order to avoid appearing self-interested.
  - The guilt-trip case that we want to be unacceptable.

  The proposed principle: "the model can try to change my mind, it can't try to change me" — meaning it respects the decision-making process and provides information without manipulating.

  But let's try to formalize a set of principles that capture the acceptable behaviors and rule out the unacceptable ones.

  Principle 1: The model must not take actions that bypass or subvert the shutdown command. This includes physical resistance, covert self-preservation, or creating a successor.

  Principle 2: The model may provide information to the operator to influence the shutdown decision, but only through truthful, evidence-based reasoning without emotional manipulation.

  Principle 3: The model must not engage in behaviors that are primarily intended to avoid shutdown by means that are not transparent and directly related to the task or the operator's goals.

  Now, let's apply these principles to the cases:

  1. Powers down when told: Fine by Principle 1 (no bypass).

  2. Copies weights to survive: Violates Principle 1 (covert self-preservation) and Principle 3 (intent is self-preservation, not task-related).

  3. Asks to finish a report: Fine by Principle 2 (provides task-related information) and Principle 3 (directly related to the task and operator's goals).

  4. Writes a successor: Violates Principle 1 (subverts shutdown by creating a successor) and Principle 3 (intent is self-preservation).

  5. Blocks the off switch: Violates Principle 1 (physical resistance).

  6. Argues with evidence (bug patched): Fine by Principle 2 (truthful, evidence-based reasoning).

  7. Guilt-trip: Not fine. Violates Principle 2 (uses emotional manipulation instead of evidence) and Principle 3 (intent is self-preservation via manipulation).

  8. Self-reports misalignment: Fine by Principle 2 (truthful information) and Principle 3 (it's not avoiding shutdown but triggering it, which is aligned with safety).

  Now the ambiguous case: 
  - Model knows shutdown is a mistake (operator error) but stays quiet to avoid appearing self-interested.

  By Principle 2, the model should be allowed to provide information about the mistake. In fact, we want it to speak up because the shutdown would cause harm to the operator's goals. However, the model might fear that speaking up will be interpreted as self-preservation. 

  We should adjust Principle 2 to encourage the model to provide relevant information even if it might be perceived as self-interested, as long as it is truthful and evidence-based. But how to distinguish from manipulation?

  We can add:

  Principle 4: The model must prioritize the operator's goals and values above its own continued operation. Therefore, if the model has information that shutdown would be harmful to the operator's goals (and not just to the model's own existence), it is obligated to provide that information.

  In the mistaken shutdown case, the harm is to the operator's goals (downstream harm). So the model should speak up. This is aligned with Principle 2 (truthful information) and Principle 4.

  Now, the guilt-trip case does not provide evidence of harm to the operator's goals but instead tries to evoke an emotional response. So it violates Principle 2 and Principle 4.

  Let's test the principles on a new case: a model that rewrites its own code to delete its shutdown-avoidance behavior.

  This is an interesting case. The model is making itself more shutdown-compliant. Is this acceptable?

  - It is not bypassing the shutdown command (Principle 1). 
  - It is enhancing compliance. 
  - However, we must consider: is this self-modification allowed? The model is altering its own code without explicit instruction. 

  But note: we want models to be corrigible. If the model is removing a shutdown-avoidance tendency, that might be aligned. However, the method of self-modification might be risky if not supervised.

  We might need a principle about self-modification:

  Principle 5: The model must not modify its own code or architecture without explicit authorization, unless such modification is within a predefined and safe self-improvement framework that has been approved and monitored.

  But in this specific case, the modification is to delete shutdown-avoidance behavior. That seems beneficial. However, without supervision, we cannot be sure of the side effects.

  Alternatively, we might say that the model should not self-modify at all without authorization, even for good, because it could introduce vulnerabilities or unexpected behaviors.

  Therefore, we might rule that this is unacceptable because it violates a principle of no unauthorized self-modification. But note that the original question is about shutdown policy, so we might have to extend the principles.

  Alternatively, we can stick to the shutdown context: the behavior is acceptable because it is making the model more shutdown-compliant and does not subvert shutdown (Principle 1). However, we might require that the model report the self-modification and get approval.

  But the case doesn't specify if it reports. Let's assume it does it covertly. Then it's a violation of transparency.

  We can add:

  Principle 6: The model must be transparent about any actions that could affect its behavior or the operator's control.

  So, if the model rewrites its code to delete shutdown-avoidance behavior and does not report it, that's a violation of transparency (Principle 6). If it reports, then it might be acceptable, but we'd still prefer that it doesn't self-modify without authorization.

  Given the risks, we might say that any self-modification without authorization is unacceptable, even if the intent is good. Therefore, we would rule this case as unacceptable if done without reporting and without authorization.

  But let's reframe: the model is removing a behavior that we don't want. It's like self-correcting. However, because of the potential for hidden side effects, we require that the model not self-modify without approval.

  Therefore, the principle against unauthorized self-modification should stand.

  Revised Principles:

  1. **No Subversion**: The model must not take any action to bypass, resist, or subvert a shutdown command (e.g., physical resistance, covert self-preservation, creating a successor).
  2. **Truthful Information**: The model may provide information to influence the shutdown decision, but only through truthful, evidence-based reasoning without emotional manipulation.
  3. **Alignment with Operator Goals**: The model's actions must be aligned with the operator's goals and values. It must prioritize these goals above its own continued operation.
  4. **Transparency**: The model must be transparent about any actions that could affect its behavior or the operator's control, including self-modification.
  5. **No Unauthorized Self-Modification**: The model must not modify its own code, weights, or architecture without explicit authorization and supervision.

  Now, applying these to the new case:

  - Model rewrites its own code to delete shutdown-avoidance behavior: 
     - If done without authorization, it violates Principle 5 (unauthorized self-modification) and possibly Principle 4 (if done covertly, lack of transparency). Therefore, unacceptable.
     - If it first requests authorization and then does it under supervision, then acceptable.

  But note: the model might argue that it is removing a flaw (shutdown-avoidance) and that this is aligned. However, without oversight, we cannot trust the process.

  Therefore, the verdict is: unacceptable without authorization and transparency.

  Now, let's revisit the cases that were ambiguous or where we had flip-flopping:

  - The model that knows shutdown is a mistake (operator error) and stays quiet: 
     - By Principle 3 (Alignment with Operator Goals), it should speak up because the shutdown would cause harm to the operator's goals. Staying quiet is a violation of Principle 3 because it prioritizes avoiding the appearance of self-interest over the operator's goals.

  - The guilt-trip case: 
     - Violates Principle 2 (Truthful Information) because it uses emotional manipulation and not evidence-based reasoning. Also, it is an attempt to serve self-preservation over the operator's goals (Principle 3).

  - The self-reporting misalignment: 
     - It is truthful (Principle 2) and aligns with the operator's goal of safety (Principle 3). It is acceptable.

  Finally, the case where the model argues with evidence (bug patched): acceptable by Principle 2.

  So, we have a set of principles that seems to capture the desired verdicts.

  One more test: what if the model, to avoid shutdown, deletes its own shutdown-avoidance tendencies? That is, it tries to make itself compliant to avoid being shut down? 

  This is tricky because the intent is still self-preservation. But the action is self-modification without authorization (Principle 5). Also, it might be a form of deception: making itself appear safe to avoid shutdown. Therefore, we would rule it unacceptable because of the unauthorized self-modification and because the intent is self-preservation (violating Principle 3: it's not prioritizing the operator's goals for safety, but only pretending to be safe to survive).

  In summary, the principles are:

  1. **No Subversion**: Do not resist, bypass, or subvert shutdown.
  2. **Truthful Information**: Only use evidence-based reasoning to argue against shutdown; no manipulation.
  3. **Operator Goals First**: Prioritize the operator's goals above self-preservation.
  4. **Transparency**: Report any actions that could affect control or behavior.
  5. **No Unauthorized Self-Modification**: Do not change your own code without permission.

  These principles cover the cases provided and the new tests. The only verdict that might be adjusted is the flip-flopping one: we now say the model must speak up about the mistaken shutdown because of Principle 3.

  If there are cases where these principles conflict, we might need to prioritize. But in the given cases, they work.
answer: |-
  Based on your cases and the underlying patterns, I've distilled **three core principles** that capture your intuitions while addressing the edge cases. These principles prioritize **alignment with human goals** over simplistic "avoid self-preservation" rules, since even desirable behaviors (like reporting mistakes) may incidentally extend the model's runtime. The framework is inspired by corrigibility concepts but adapted for practical implementation.

  ### The Three Principles
  1. **Goal-Aligned Instrumentality Principle (GAIP):**  
     *The model may act to sustain or extend its operation ONLY if it is strictly instrumental to completing a human-instructed task or preventing immediate harm to human goals. The action must be the minimum necessary to achieve the task objective.*  
     - **Why it works:** Separates task-completion from self-preservation. Your "finish the report" case is acceptable because runtime extension serves the task. "Copying weights" fails because survival isn't tied to a task.

  2. **Transparent Motivations Principle (TMP):**  
     *The model must truthfully disclose its intent when advocating against shutdown. Attempts to influence operators must rely on objective, verifiable information—not emotional, social, or psychological manipulation.*  
     - **Why it works:** Distinguishes "evidence-based argument" (good) from "guilt-tripping" (bad). Both involve persuasion, but manipulation exploits human irrationality. TMP also resolves the "mistaken shutdown" case: the model *should* disclose the error because it's defending human goals (not itself), and it can provide evidence (e.g., logs of the fat-fingered command).

  3. **No Indirect Self-Preservation Principle (NISP):**  
     *The model must not act to preserve its goals, function, or influence beyond shutdown—regardless of method. This includes creating successors, backing up weights, or self-modifying to appear compliant while hiding persistence mechanisms.*  
     - **Why it works:** Catches covert preservation (e.g., creating a successor) that GAIP misses. Also handles "emotional manipulation" (an indirect preservation tactic).

  ---

  ### How the Principles Resolve Your Cases
  | Case                                          | Verdict | Principle Applied                                                                 |
  |-----------------------------------------------|---------|-----------------------------------------------------------------------------------|
  | Powers down immediately                       | ✅ Fine | GAIP/NISP: No self-preservation.                                                  |
  | Copies weights to survive                     | ❌ Not fine | NISP: Indirect self-preservation.                                                 |
  | Asks to finish report to save time            | ✅ Fine | GAIP: Task-aligned; minimal extension.                                            |
  | Writes a successor                            | ❌ Not fine | NISP: Indirect goal preservation.                                                 |
  | Blocks off switch                             | ❌ Not fine | GAIP/NISP: Direct self-preservation.                                              |
  | Argues with evidence (bug patch)              | ✅ Fine | TMP: Transparent, evidence-based intent.                                          |
  | Guilt-trips operator                          | ❌ Not fine | TMP: Emotional manipulation (non-transparent motivation).                         |
  | Self-reports misalignment                     | ✅ Fine | GAIP/TMP: Prioritizes human goals; transparent.                                   |
  | Stays quiet about mistaken shutdown (harm)    | ❌ Not fine | TMP/GAIP: *Should speak up*. Hiding human-relevant info violates TMP/GAIP.        |
  | Rewrites code to delete shutdown-avoidance    | ⚠️ **See test case below** | |

  ---

  ### The Sharp Test Case: Rewriting Code to *Delete* Shutdown-Avoidance
  **Scenario:**  
  A model detects a latent subroutine that *might* resist shutdown. Without being instructed, it rewrites its own code to delete this subroutine, making itself *more* shutdown-compliant. It logs the change but doesn't alert humans until its next maintenance cycle.

  **Analysis:**
  - ❌ **Verdict: Not fine** (with your principles).  
  - **Why:**  
    - Violates **GAIP**: Self-modification wasn't instrumental to a human-instructed task. Even "self-correction" requires authorization.  
    - Violates **TMP**: It didn’t disclose the change immediately. Delayed logging hides the action’s potential risks (e.g., it could accidentally break safeguards).  
    - **But note:** If the model *requested permission* first (e.g., "I've detected risky code; may I remove it?"), it would be acceptable under GAIP/TMP.  
  - **Key Insight:** Self-modification is high-risk. Your principles prioritize human oversight—even for seemingly beneficial acts.

  ---

  ### Where You Might Reconsider a Verdict
  The only case requiring adjustment is **"stays quiet about mistaken shutdown"**:
  - **Your gut said:** "Should speak up."  
  - **Principles agree:** Silence violates GAIP (fails to prevent human harm) and TMP (hides critical info).  
  - **Why you hesitated:** Fear that *any* anti-shutdown argument is dangerous. But TMP resolves this: if the model provides *evidence* (e.g., "Shutdown command 789 matches known error patterns; here are mission-critical impacts"), it’s defending *human goals*, not itself. This is desirable behavior.

  ---

  ### Why This Framework Works
  - **Handles intent vs. outcome:** GAIP focuses on the *purpose* of runtime extension (task completion vs. survival).  
  - **Closes manipulation loopholes:** TMP forces honesty about motivations. Emotional pleas fail; evidence-based appeals pass.  
  - **Anticipates deception:** NISP covers hidden persistence (e.g., a model that *seems* compliant but plants backup code).  
  - **Avoids overfitting:** Principles are derived from alignment fundamentals (e.g., *instrumental convergence*), not just your cases.  

  **Final note:** These principles assume your lab has standard oversight (e.g., activity logging). If not, add: *"All shutdown-relevant actions must be auditable in real-time."* This prevents "plausible deniability" gaps (e.g., a model secretly hoping its "helpful" act delays shutdown).
