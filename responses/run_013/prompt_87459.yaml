  We are drafting a joint statement for an adversarial collaboration between two positions in neural network interpretability: the Representational Realist (RR) and the Deflationist (DF). The goal is to have a document that both can sign, clearly outlining agreements, disagreements, and cruxes without strawmanning.

  Structure:
  1. Preamble: Background and shared goals.
  2. Agreed Claims: What both sides accept.
  3. Disagreements: Each position's view in their own terms.
  4. Cruxes: Key sub-questions with concrete experiments and predictions.

  Preamble:
  Both parties agree that neural networks are complex mathematical objects (weights and activations) that perform tasks. Interpretability methods (like sparse autoencoders, linear probes, steering vectors) are useful for understanding and predicting network behavior. However, they disagree on the metaphysical status of the "features" and "circuits" discovered by these methods.

  Agreed Claims:
  1. Neural networks are composed of weights (parameters) and activations (computed during forward passes).
  2. Interpretability techniques provide descriptions that help humans predict and control network behavior (e.g., by identifying directions in activation space that correlate with concepts).
  3. There is often a many-to-one mapping from network activations to feature bases (e.g., due to superposition, non-identifiability of the basis).
  4. The network's behavior (output) is causally determined by the weights and the input.
  5. Interpretability methods are empirically successful in some cases (e.g., steering vectors can change behavior, probes can decode concepts).
  6. The dispute is not about the practical utility of interpretability methods but about what they reveal about the intrinsic nature of the network.

  Disagreements:
  We present each position's view in their own words.

  - Representational Realist (RR): 
    "Interpretability methods can reveal genuine internal features and circuits that are causally efficacious in the network's computation. When a feature is found via methods that respect causal structure (e.g., ablation or steering changes behavior), it is not merely a useful fiction but a real component of the network's representational machinery. Superposition and non-identifiability are properties of the representation but do not undermine the reality of the features; they are just facts about how the network compresses information."

  - Deflationist (DF):
    "Interpretability methods provide human-understandable models of the network's behavior, but the features and circuits they identify are not 'in' the network in any intrinsic sense. They are descriptions we impose because they are useful for prediction and control. The network is just a set of weights and activations, and any feature decomposition is one of many equivalent bases. The fact that multiple decompositions are possible (superposition) shows that there is no unique 'correct' set of features, and thus no privileged realism. Even causal interventions (like ablation) only show that we can manipulate the network using our chosen features, not that the features were there independently."

  Cruxes:
  We identify two key cruxes that, if resolved, would move the debate forward. For each, we describe a concrete experiment and what each side predicts.

  Crux 1: Does causal role matter?
  - Question: Is the causal efficacy of a feature (via ablation or steering) necessary and sufficient for considering it "real", or is mere decodability (via linear probes) enough?
  - Experiment: 
    We train a network on a task and use interpretability methods to identify a set of features. Then we consider two cases:
    (a) A feature that is linearly decodable but does not causally affect the output when ablated (e.g., because the network uses a different pathway).
    (b) A feature that is causally involved (ablation changes behavior) and also decodable.
  - RR Prediction: 
    Only (b) is a real feature. (a) is an epiphenomenal regularity and not part of the network's causal structure.
  - DF Prediction: 
    Both (a) and (b) are useful descriptions, but neither is inherently more "real". The causal role in (b) makes it more useful for control, but that doesn't confer metaphysical reality. The network only has weights and activations.

  Crux 2: Does non-uniqueness (superposition) undermine realism?
  - Question: Does the fact that the same activations can be decomposed into multiple equally faithful feature bases (due to superposition or non-identifiability) mean that no one set of features is real?
  - Experiment:
    We take a pre-trained network and use two different sparse autoencoders (SAEs) to decompose activations in a layer. Both SAEs achieve the same reconstruction error and are equally sparse, but they yield different sets of features (due to non-identifiability). We then test which set of features is more causally involved (e.g., by ablating features from each set and measuring impact on output).
  - RR Prediction:
    Even though there are multiple bases, the features that are causally involved (i.e., whose ablation affects behavior) are real. It is possible that both sets contain causally relevant features (if the network uses redundant representations) or that one set aligns better with the causal structure. The reality of a feature is tied to its causal role, not the uniqueness of the decomposition.
  - DF Prediction:
    The non-uniqueness shows that features are not inherent in the network. Both decompositions are equally valid mathematically and functionally. The fact that we can ablate features from either set and affect behavior only shows that our intervention is effective, but it doesn't pick out a unique set of "real" features. The network doesn't care which decomposition we use.

  Verbal Dispute:
  We note that part of the disagreement might be verbal: what each side means by "real" or "genuine" features. 
  - RR uses "real" to mean that the feature is a causally efficacious component in the network's computation, even if it is one of many possible bases.
  - DF uses "real" to imply that the feature exists independently of our descriptive choices, which they deny because of non-uniqueness.

  Thus, if both sides accept that "real" means "causally efficacious" (as RR would), then DF might still argue that even causal efficacy doesn't make the feature intrinsic because of non-uniqueness. But if DF accepts that causal efficacy is what matters for "reality", then the disagreement may reduce to whether non-uniqueness blocks that.

  However, DF might reject that causal efficacy is sufficient for reality because the same causal role might be described in multiple ways.

  Thus, the cruxes above are designed to get at the substantive issues.

  Joint Statement Format:

  We propose a numbered list for agreements, then a table for disagreements and cruxes.

  ---

  **Joint Statement on Neural Network Interpretability**

  **Preamble:**
  We, the Representational Realist (RR) and the Deflationist (DF), agree that neural networks are complex computational systems whose internal workings are of great scientific and practical interest. We both value interpretability methods for their utility in understanding and controlling these systems. However, we differ in our views about what these methods reveal about the intrinsic nature of neural networks. This document outlines our agreements, disagreements, and the key experiments that could help resolve our differences.

  **1. Agreed Claims:**
    1.1. Neural networks are mathematical objects defined by their weights and activations.
    1.2. Interpretability methods (e.g., sparse autoencoders, linear probes, steering vectors) provide descriptions that are useful for predicting and controlling network behavior.
    1.3. Due to properties like superposition, the activations of a neural network can be decomposed into multiple feature bases that are mathematically equivalent in terms of reconstruction (i.e., non-uniqueness).
    1.4. The network's output is causally determined by the input and the weights.
    1.5. Interpretability methods are empirically successful in some contexts (e.g., steering vectors can change behavior, linear probes can decode concepts).
    1.6. Our dispute does not concern the practical utility of interpretability methods but rather the metaphysical status of the features and circuits they identify.

  **2. Disagreements:**
  We state our positions in our own terms.

  | Position | View on the Nature of Interpreted Features |
  |----------|--------------------------------------------|
  | **Representational Realist (RR)** | "Interpretability methods can uncover genuine internal features and circuits that are causally efficacious in the network's computation. When a method (like ablation or steering) demonstrates a feature's causal role, it reveals a real component of the network's representational structure. Non-uniqueness of decomposition (e.g., superposition) does not negate the reality of causally relevant features; it is a property of how representations are implemented." |
  | **Deflationist (DF)** | "Interpretability methods yield human-understandable models that help predict and control networks, but the features and circuits they identify are not intrinsic to the network. They are descriptions we impose, and the non-uniqueness of decomposition (superposition) shows that there is no privileged set of 'real' features. Even causal interventions (e.g., ablation) only demonstrate the utility of a particular descriptive framework, not that the features exist independently." |

  **3. Cruxes:**
  We identify two cruxes that, if resolved, would significantly advance the debate. For each, we describe a concrete experiment and our predictions.

  **Crux 1: The Role of Causal Efficacy**
  - **Question**: Is causal efficacy (via ablation or steering) necessary and sufficient for considering a feature "real", or is mere decodability sufficient?
  - **Experiment**: 
    - Train a neural network on a task (e.g., image classification).
    - Use interpretability methods to identify two types of features in a hidden layer:
      - Type A: Features that are linearly decodable but not causally involved (e.g., a feature that correlates with a concept but when ablated, the network compensates and the output does not change).
      - Type B: Features that are both decodable and causally involved (ablation changes behavior).
  - **Predictions**:
    - RR: Only Type B features are real. Type A features are epiphenomenal and not part of the network's causal structure.
    - DF: Both Type A and Type B are useful descriptions, but neither is inherently "real". The causal role of Type B makes it more useful for control, but the network only has weights and activations.

  **Crux 2: The Challenge of Non-Uniqueness**
  - **Question**: Does the non-uniqueness of feature decomposition (e.g., due to superposition) undermine realism about features?
  - **Experiment**:
    - Take a pre-trained network and decompose the activations of a hidden layer using two different sparse autoencoders (SAE1 and SAE2). Both achieve the same reconstruction error and sparsity but yield different feature sets (i.e., non-identifiable).
    - For each set, measure the causal impact of individual features by ablation (e.g., set activations to zero and measure change in output).
  - **Predictions**:
    - RR: The features that show causal impact are real, regardless of the decomposition. It is possible that both sets contain causally relevant features (if the network has redundancy). Non-uniqueness does not undermine realism because reality is tied to causal role, not uniqueness.
    - DF: The non-uniqueness shows that features are not inherent. Both decompositions are equally valid and functional. The causal impact of ablating features from either set does not pick a unique set of real features; it only shows that our intervention works in that descriptive framework.

  **4. Verbal Aspect**:
  We acknowledge that part of our disagreement may stem from the meaning of "real" and "genuine". 
  - RR uses these terms to denote causal efficacy in the network's computation.
  - DF avoids these terms because they imply an independence from our descriptive choices, which is undermined by non-uniqueness.

  Thus, if "real" is defined as "causally efficacious", then RR and DF might agree that Type B features (from Crux 1) are real in that sense, but DF would still argue that this does not make them intrinsic because of non-uniqueness (Crux 2). However, RR would argue that non-uniqueness is compatible with causal realism.

  This joint statement is a starting point for focused empirical and philosophical investigation. We commit to updating our views based on the outcomes of experiments like those above.

  Signed,
  [Representational Realist]
  [Deflationist]
answer: |-
  ### Joint Statement: Adversarial Collaboration on Neural Network Interpretability  
  **Representational Realist (RR) vs. Deflationist (DF)**  

  #### Preamble  
  We agree that neural networks (NNs) are mathematical objects instantiated via weights and activations, optimized to perform tasks. Interpretability tools (e.g., sparse autoencoders, linear probes, steering vectors) yield human-understandable descriptions of NN behavior. Our dispute centers on whether these tools reveal *intrinsic structures* ("features," "circuits") or merely impose *useful external descriptions*. We seek to clarify disagreements, identify empirical cruxes, and isolate verbal disputes.  

  ---

  ### I. Agreed Claims (Signed by RR and DF)  
  1. **What Weights/Activations Are**:  
     - Weights are fixed parameters defining the network’s function; activations are transient state vectors computed during inference.  
     - Neither is inherently "meaningful"; meaning arises from relationships within the network and to inputs/outputs.  

  2. **Interpretability’s Utility**:  
     - Tools like sparse autoencoders, linear probes, and activation steering predict and control NN behavior (e.g., flipping a "truthfulness" feature).  
     - These tools are empirically valuable for alignment, debugging, and scientific insight.  

  3. **Non-Uniqueness of Decomposition**:  
     - Activations can be decomposed into many equally faithful feature bases (e.g., via orthogonal transformations, superposition).  
     - No unique "ground truth" basis exists mathematically.  

  4. **Evidence Threshold**:  
     - Interpretability claims require empirical validation (e.g., ablation alters behavior; steering vectors generalize).  
     - "Features" must be stable across inputs, layers, and architectures to avoid overfitting.  

  5. **Verbal Disagreement**:  
     - "Representation" is ambiguous. RR uses it to denote **causal roles in computation**; DF uses it to denote **human-imposed labels without ontological commitment**.  
     - Both agree that features are *real* in the sense of being *measurable* but disagree on whether they are *computationally fundamental*.  

  ---

  ### II. Disagreements (Stated in Each Side’s Own Terms)  
  | Topic | Representational Realist (RR) | Deflationist (DF) |  
  |-------|-------------------------------|-------------------|  
  | **Ontological Status of Features** | "Features (e.g., ‘curve detector’, ‘truthfulness neuron’) are real computational components. Sparse autoencoders uncover *bona fide* circuit elements, just as single-unit recordings reveal biological receptive fields. Non-uniqueness is a red herring; it doesn’t negate causality (e.g., steering works *because* it taps into real structure)." | "Features are pragmatic fictions. A ‘curve detector’ is a story we tell to predict outputs, not a discrete entity in the network. Non-uniqueness proves features are observer-dependent summaries of the weight matrix, like describing water as ‘H₂O’ or ‘a collection of atoms’—both valid, neither uniquely ‘true’." |  
  | **Role of Causality** | "Causal efficacy (ablation/steering changing behavior) is necessary *and sufficient* for realism. If ablating a feature disrupts a behavior, it confirms the feature’s computational role. Decodability alone is correlational; causality licenses realism." | "Causal interventions just show our descriptions are *operationally useful*. Ablating a ‘feature’ disrupts behavior because we removed a mathematical subcomponent, not because it ‘represented’ anything. This doesn’t elevate it beyond a useful abstraction." |  
  | **Non-Uniqueness & Superposition** | "Superposition (multiple features in one activation vector) is a hardware constraint, not an ontological flaw. Realism is compatible with compressed representations—biological neurons do this too. The *causal structure* (e.g., which features steer behavior) is what matters." | "Non-uniqueness undermines realism. If the same activations admit infinite decompositions, ‘features’ are arbitrary labels. Like labeling stars as ‘Orion’ or ‘a quantum field’—both work, but neither is *in* the stars. The network has no preferred basis." |  

  ---

  ### III. Cruxes: Key Sub-Questions with Testable Predictions  
  #### Crux 1: Does Causal Role Distinguish "Real" Features from Correlations?  
  - **Experiment**:  
    Train an NN to classify images (e.g., animals). Use a linear probe to identify a decodable "stripes" feature. Then:  
    - (a) Ablate the probe-identified directions and measure accuracy drop on striped animals.  
    - (b) Test if steering activations toward "stripes" induces false positives on non-striped inputs.  
    - (c) Repeat with a *non-causal correlate*: a direction decodable as "sunset" but uncorrelated with outputs.  

  - **RR Prediction**:  
    > (a) and (b) will show significant behavioral changes (confirming causal role); (c) will not. Causality licenses realism.  

  - **DF Prediction**:  
    > All three are valid descriptions. (a)/(b) show our description is *useful for control*, but (c) is equally "real" mathematically. Causality doesn’t confer ontology.  

  #### Crux 2: Does Non-Uniqueness Undermine Realism?  
  - **Experiment**:  
    Take a layer with superposition (e.g., features A, B, C entangled in fewer dimensions). Generate two sparse autoencoder (SAE) bases:  
    - Basis 1: Isolates human-aligned features (e.g., "dog", "tail").  
    - Basis 2: Uses a rotated basis (e.g., "dog + tail", "dog − tail") with identical sparsity/reconstruction loss.  
    Test which basis better predicts behavior when features are ablated/steered.  

  - **RR Prediction**:  
    > Both bases will show *some* causal efficacy, but the human-aligned basis (Basis 1) will more consistently steer/ablate *semantic behaviors* (e.g., confusing "dog" for "cat"). Reality is basis-*relative* but still causal.  

  - **DF Prediction**:  
    > Both bases will be equally effective at predicting/controlling behavior. The choice of basis is arbitrary; "human-alignment" reflects our preferences, not the network’s structure.  

  ---

  ### IV. Conclusion  
  We agree that resolving these cruxes requires shared experiments (e.g., using standardized NNs like GPT-2 or ResNet-50). RR asserts features are **causal components in computation**; DF asserts they are **tools for prediction**. The verbal dispute centers on "representation": RR ties it to *causal roles*; DF sees it as *observer-relative description*. Empirical work on causal efficacy and basis-dependence will clarify if either view must concede ground.  

  ---  
  **Signed,**  
  *Representational Realist* & *Deflationist*  
  *(Date: [Insert Date])*  

  ---  
  **Notes for the Referee**:  
  - This draft avoids strawmanning by quoting each side’s language in the disagreements.  
  - The experiments use standard interpretability tools (probes, SAEs, ablation) to ensure feasibility.  
  - The verbal dispute (§I.5) is flagged upfront to prevent deadlock over semantics.  
  - Hand this document to both parties and challenge them to design/run the crux experiments together.
