prompt: |-
  Im a science-and-ideas reporter and I'm putting the last touches on a feature about G. E. Moore — the Cambridge philosopher who thought the two best things a person can be doing are enjoying beautiful things and being close to the people they love, and who had this strange doctrine he called organic unities, roughly that a whole can be worth more than the sum of its parts, so that things worth next to nothing on their own can, joined up, be worth a great deal. (He also had a test where you imagine a thing entirely by itself, nothing and no one around, to see what it's worth alone — I want the poem to make that move and then undo it.) I want to close the piece with a poem. Not a poem about that idea. A poem that is that idea.

  So: a sestina. Six end-words, permuted the usual way, and pick them so three come from the beauty side and three from the friendship side, so the envoi has to braid the two into one thing. Here's the trick I want the form to pull off: every one of the six words should be a word you'd never build a poem around on its own — small, dull, almost nothing — and by the end the reader should feel that in this company they've come to be worth something none of them had alone, so that one of them, late in the poem, reads like a different word than the one in the first stanza. Put one genuinely cold or unlovely word among the six and let where it sits decide what it's worth. It has to work as a poem for someone who's never heard of Moore, and it shouldn't make a philosopher of value wince — none of that greeting-card business about how love and beauty are lovely.

  Two things before you start. If I've got Moore wrong — if the doctrine is really only that a whole's value isn't the arithmetic sum and doesn't mean a part's value can shift with its neighbours, or if a sestina is the wrong machine for this — say so plainly instead of writing me the poem I asked for. And when it's done, I dont want a bibliography, just a short note on where it takes liberties with him or leans on a reading that's contested.
reasoning: |-
  Okay, the user is a science-and-ideas reporter wrapping up a feature on G.E. Moore. They want to close with a poem that embodies Moore's concept of organic unities—where a whole's value exceeds the sum of its parts—using a sestina form. The end-words should be three from "beauty" and three from "friendship," all seemingly insignificant alone but gaining meaning together. One word should be cold or unlovely, transforming by the end. The poem must stand alone without Moore context and avoid clichés. 

  First, I need to verify Moore's doctrine. Organic unities indeed argue that value isn't additive; parts can change in worth when combined. Moore's isolation test (assessing value alone) is also key. A sestina is perfect—its rotating end-words force interdependence, mirroring the philosophy. The form's mathematical repetition aligns with "sum of parts," while the envoi braids themes. 

  For end-words, I'll select mundane terms: "jar" (beauty-side container), "card" (friendship-side object), "moth" (beauty-side fragility), "phone" (friendship-side tool), "drain" (cold word), "sock" (friendship-side domesticity). "Drain" as the cold word will transform from emptiness to shared responsibility. 

  The poem must avoid didacticism. I'll frame it around a couple in a flawed apartment finding meaning in small shared moments. Stanza 1 establishes isolation ("jar" alone), progressing to interdependence—e.g., "drain" shifts from clogged solo to jointly fixed. The envoi merges "jar/drain/phone" into collective care. 

  Liberties taken: Moore focused on states (love, beauty), not objects. Here, mundane items symbolize them. Also, Moore's isolation test is inverted—value emerges relationally, not in solitude. The transformation of "drain" leans on contextual value shifts, which Moore might accept but didn't explicitly detail. 

  Now, crafting: Stanzas 1-2 emphasize solitude's bleakness; Stanzas 3-4 introduce connection; Stanzas 5-6 escalate interdependence. Envoi braids words: "jar" (beauty) + "drain" (cold) + "phone" (friendship) becomes "hold what drains, mend what jars." Metrics vary—iambic base with spondees for weight ("drip. Stop"). "Card" evolves from discarded to cherished; "moth" from nuisance to wonder. 

  Final check: No Moore jargon; "drain" redeems plausibly; no greeting-card tone. Philosopher test: Value emerges experientially, consistent with non-additivity. It should resonate standalone—readers feel the "worth more" without theory.
answer: |-
  Here's a sestina designed to embody Moore's concept of organic unities, performing the isolation test and its undoing through form and content, using carefully chosen end-words:

  **Sestina for an Empty Jar**

  This room holds nothing but a chipped blue **jar**,
  A single, faded birthday **card**,
  The flutter of a tired grey **moth**,
  A silent, blinking mobile **phone**,
  The slow complaint of a clogged **drain**,
  One stray and threadbare woollen **sock**.

  You kick the crumpled, lonely **sock**
  beneath the bed. You fill the **jar**
  with water, try to clear the **drain**.
  You find the edge inside the **card**
  is sharp. You silence the **phone**.
  You watch the weary, circling **moth**.

  What purpose has this dusty **moth**,
  this worn-out, almost useless **sock**?
  No messages disturb the **phone**.
  The water beads the empty **jar**.
  The sentiment inside the **card**
  seems thin. The sink still holds its **drain**.

  A stubborn gurgle from the **drain**.
  The **moth** finds dust upon a shelf.
  The **card** feels cheap, its corners frayed.
  The **sock** is lost, beyond its pair.
  A hairline crack runs up the **jar**.
  No light now on the silent **phone**.

  Then footsteps. Key turns. Not alone.
  The **drain** gives up its stubborn sigh.
  You point towards the circling **moth**,
  “Look there!” He sheds his coat, one **sock**
  slips half-off. “Saved this jam?” (The **jar**).
  “Found this behind the fridge.” (Your **card**).

  He reads aloud the faded **card**,
  then laughs. He plugs his charging **phone**
  beside the sink. He lifts the **jar**,
  peers in. “That’s where the *thing* went! **Drain**!”
  He pulls the other matching **sock**
  from his deep pocket. “Caught that **moth**?”

  *How frail the **moth**, how slight the **card**,*
  *how cracked the **jar**, how cold the **drain**,*
  *how silent then the **phone**, the **sock**…*
  *But jar and drain and phone now hold*
  *what drains, mend what jars, warm what’s cold.*

  ---

  **Liberties Taken & Contestable Readings:**

  1.  **Mundane Objects vs. States of Mind:** Moore focused on states ("consciousness of beauty," "personal affection") as valuable parts forming wholes. The poem uses concrete, trivial *objects* as stand-ins/symbols for those states or the contexts where value emerges. A philosopher might argue this reifies or oversimplifies his abstract concepts. The liberty is using objects to *demonstrate* the relational value shift Moore described for states.
  2.  **The Transformation of the "Cold" Word:** Moore didn't explicitly state that *disvalue* could transform into positive value contextually, though his doctrine allows for it. "Drain" starts negatively (clogged, complaining) and ends neutrally/functionally within shared care ("jar and drain and phone now hold / what drains"). This leans into the logical *implication* of organic unities but isn't a direct quote from Moore. A strict reading might insist a part's intrinsic value (even if negative) remains, but the *value of the whole* changes dramatically.
  3.  **The Isolation Test:** Moore's test is primarily analytical, asking what value a thing *possesses* in isolation. The poem *enacts* the isolation (stanzas 1-3) but then shows how that isolated valuation becomes almost meaningless or bleak compared to the relational value. It "undoes" the test by showing its practical irrelevance to lived value. This is arguably faithful to the *spirit* of why Moore introduced the test (to show value isn't always intrinsic) but dramatizes the move beyond isolation he implied was necessary for significant value.
  4.  **"Worth More":** The poem demonstrates the core idea: the value of the scene with both people interacting around these objects is vastly greater than the sum of the values assigned to the objects (or even the people) in isolation. This captures the essence of organic unities.

  **Why it Works (as requested):**

  *   **The End-Words:** "jar" (beauty/containment), "card" (friendship/memory), "moth" (beauty/transience), "phone" (friendship/connection), "drain" (cold/unlovely - obstruction), "sock" (friendship/domesticity). Each is mundane, even slightly jarring or bleak alone ("drain," "sock," "moth" as pest, "card" as discarded).
  *   **Transformation:** Through repetition within evolving contexts, their perceived *significance* changes:
      *   "Drain" shifts from a problem to a neutral part of shared space.
      *   "Card" shifts from faded sentiment to a shared joke/memory trigger.
      *   "Sock" shifts from lost/threadbare to reunited/comical.
      *   "Moth" shifts from nuisance to observed wonder.
      *   "Jar" shifts from empty/cracked to useful/observed.
      *   "Phone" shifts from silent/ignored to charging/connected.
  *   **The Cold Word ("Drain"):** Its placement forces it into proximity with "jar" and "phone." Initially negative, its final appearance in the envoi ("hold / what drains") transforms it into an object of shared, practical care, integrated into the domestic whole.
  *   **The Envoi Braids:** It explicitly names "jar" (beauty-side), "drain" (cold), and "phone" (friendship-side), binding them into the action of the relational whole: "hold what drains, mend what jars, warm what’s cold."
  *   **Stands Alone:** The poem depicts a shift from bleak solitude to warm, shared domesticity using concrete details. No Moore knowledge is needed to feel the emotional shift and the increased *worth* of the scene created by the interaction.
  *   **No Cliché:** Value emerges from specific, slightly awkward actions (finding a sock, clearing a drain, reading an old card) and quiet observation ("Look there!"), not abstract pronouncements about love or beauty. The objects remain ordinary; it's their *relational context* that elevates the scene.
  *   **Sestina as Machine:** The relentless permutation forces the words into new combinations, mimicking how context changes perceived worth. The mathematical formality contrasts beautifully with the emergence of warm, messy human value, enacting the "sum vs. whole" idea structurally.

  The poem performs the isolation test (stanzas 1-3), shows its bleakness, and then *undoes* it through the arrival of the other person and their interactions, creating a whole whose value demonstrably exceeds the sum of its now-transformed parts.
