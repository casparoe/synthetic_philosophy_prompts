  ---

  **PHYSICS DEPARTMENT ADOPTS 18TH-CENTURY METAPHYSICS, DECLARES MATTER "OFFICIALLY OPTIONAL"**

  *By Gwen Pritchard, Campus Chronicle Staff Writer*  
  *October 27, 2023*

  PROVOST ANNOUNCES "PARADIGM SHIFT" BACKED BY "SUPREME PERCIPIENT"  

  In a move Provost Eleanor Davies called "long overdue for epistemological hygiene," Harrison University’s Department of Physics formally adopted Bishop George Berkeley’s idealism as its operational framework yesterday. Effective immediately, the department no longer recognizes the independent existence of unperceived material substance.  

  "The empirical data remains unchanged," Provost Davies clarified in a statement, "but we’ve eliminated an unnecessary ontological hypothesis. Objects persist when our lab closes because they’re perceived by God—a far more elegant solution than postulating invisible, inert *stuff*. Frankly, it’s fiscally responsible; we’re downsizing reality."  

  **Chair: "Master Argument Made Resistance Inconceivable"**  

  Department Chair Dr. Robert Armitage explained the unanimous faculty decision. "We grappled with Berkeley’s master argument. Try to conceive of a quark existing unconceived. You can’t—because the moment you attempt it, you’re perceiving it mentally. Denying idealism becomes performatively self-refuting. It was simply… *inconceivable* to vote no."  

  When pressed on criticisms that the argument conflates *conceiving* of an object with *sensing* it—a frequent charge of philosophical "cheating"—Armitage was unfazed. "Linguistic trick? Hardly. The perceptual act is primary. Whether through sense or thought, *to be* is *to be registered in a mind*. Our new spectrometer readings? Direct divine data-streams. Very efficient."  

  He stressed this is **not solipsism**. "God’s constant perception ensures shared, stable reality. Your coffee cup doesn’t vanish when you blink. It’s just that Prof. Jenkins over in Chemistry now perceives it via divine mediation during those 300 milliseconds. Common mistake."  

  **Facilities Struggles with "Perception-Dependent Leaks"**  

  Practical challenges emerged swiftly. Facilities Manager Hank Dobbs reported confusion repairing a leak in the physics building’s roof. "We’d patch it, walk away, and it’d leak again. Chair Armitage says if no one *perceives* the leak actively, it only exists as a ‘potential idea’ in God’s mind. So is the drip real during lunch hour? Do we invoice the Almighty? My guys are spooked."  

  Armitage advised mindfulness training: "Focusing collective attention *away* from the leak during repairs should, ontologically speaking, help."  

  **Realist Colleague: "You Still Stub Your Toe"**  

  Emeritus Professor of Geology Frank Kellerman, a self-described "knee-jerk materialist," was unimpressed. "They’ve replaced quarks with ‘ideas of sense,’ dark matter with ‘divine volition,’ and kept all the differential equations. The undergrads still calculate force vectors. You still stub your toe on a misplaced diffraction grating—which, by their lights, is just God *very persistently* impressing the idea of pain upon your mind. What’s empirically different? Nothing. It’s realism with extra steps and a theistic helpdesk."  

  Armitage conceded Kellerman’s point: "Idealism is empirically identical to realism. No experiment can falsify God’s role as ground of perception. That’s the beauty—it explains why physics *worked* before we corrected its metaphysics."  

  **HEALTH & SAFETY ADJUSTS REPORTING FORMS**  
  *(Sidebar)*  

  The Office of Campus Safety is revising incident protocols. Draft language obtained by the *Chronicle* shows:  

  *   **Sec. 4.3 Hazard Reporting**: "…must specify whether the hazard was an *idea of sense* (e.g., observed spill, perceived chemical odor) or *idea of imagination* (e.g., anxiety about unobserved frayed wiring). Only hazards actively perceived or deemed ‘regularly sustained by Divine Mind’ require intervention."  
  *   **Appendix D**: "Unattended injuries cease to exist when consciousness lapses. Report *during* the stubbing."  

  Director Louise Chen: "We’re seeking metaphysical consultation. Possibly Berkeley’s."  

  ---

  **Why This Hits Your Brief:**  

  1.  **Technically Accurate Berkeley**:  
      *   *Esse est percipi* (to be is to be perceived) is the core.  
      *   God’s role maintaining unobserved objects is explicit.  
      *   Distinction between involuntary "ideas of sense" (lab data, the leak, toe-stub) vs. voluntary "ideas of imagination" is operationalized (safety forms).  
      *   Master Argument presented accurately and its common criticism ("cheating") noted but dismissed by the chair.  
      *   **Explicitly NOT Solipsism**: God ensures shared reality.  
      *   **Empirical Equivalence**: The realist’s "stub your toe just the same" and "no experiment can falsify it" lines nail this crucial Berkeleyan point.  

  2.  **Deadpan Bureaucratic Absurdity**:  
      *   Provost frames it as "fiscally responsible" downsizing.  
      *   Facilities can't grasp a leak that depends on perception.  
      *   Health & Safety forms are the perfect vehicle for literalizing the sense/imagination distinction.  
      *   "Divine data-streams," "theistic helpdesk," "invoice the Almighty" – all delivered straight.  

  3.  **Fair to Berkeley**:  
      *   The chair presents Berkeley's arguments earnestly and internally consistently. The humor comes from applying them literally in a physics context, not from mocking the ideas themselves as stupid. The realist’s frustration highlights the *unfalsifiability*, which is a genuine philosophical point, not just a dunk.  

  4.  **Invented Names & Onion Style**:  
      *   Provost Davies, Dr. Armitage, Hank Dobbs, Frank Kellerman, Louise Chen – all plausible, non-real.  
      *   Headline captures Onion’s mix of mundane and absurd ("Matter Officially Optional").  
      *   Campus newspaper framing allows for dry quotes and bureaucratic details.  

  This gives philosophers the nod ("they got the master argument right, and the God loophole, and the sense vs. imagination") while making everyone else laugh at the leaky roof and safety forms. Good luck with the writing group!
