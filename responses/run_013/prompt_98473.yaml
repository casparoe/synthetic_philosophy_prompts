  *Revised math:* 
  Set disagreement: (10%,10%). 
  Utopia: (90%,50%). 
  Feasible set: s + j ≤ 100%, s≥10%, j≥10%. 
  KS: Maximize λ where s=10% + 80%λ, j=10% + 40%λ, and s+j≤100%. 
  So 10+80λ +10+40λ ≤100 → 20 + 120λ ≤100 → 120λ≤80 → λ≤2/3. 
  Thus s=10 + 80*(2/3)≈63.3%, j=10+40*(2/3)≈36.7%. 

