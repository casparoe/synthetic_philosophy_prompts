prompt: |-
  I'm a novelist, about two-thirds through a book where a scientific commission has to draw a single line across a chart and, just by doing that, decides when a new epoch began. The whole point of the book is that the line is a decision dressed up as a discovery, so I need a properly worked-out case I can steal from — one where the science is solid and the argument still can't be settled by the science.

  So build me a thought experiment to spec. Here's what I need:

  One paragraph of scenario, realistic — real kinds of material, a real kind of international scientific body, no time travel, no invented instruments. The key move: make the boundary marker something that genuinely spreads across the planet over a long stretch of time rather than appearing everywhere at once, so that whichever single place gets picked as the official reference point is what fixes the date, and picking a different place moves the date by a century or more. Hold the evidence fixed and vary only who gets to choose the reference point. Both bodies have to be competent and neither one corrupt or ignorant — the disagreement has to be about what a period boundary is even *for*, not about facts. I don't want you naming the real commission or real dates; keep it self-contained so I can rename everything.

  Then walk it through: for each rival criterion, what date it lands on and why; which feature of the case is doing all the work; what happens if you make the marker instantaneous instead of drawn-out (does the whole disagreement collapse, and if so does that mean the politics was doing the work all along?); and how someone defending the side that comes out looking bad would attack the case — I want the strongest version of that objection, not a strawman. Also say honestly whether the case cheats by building the verdict into the setup, since thats the thing I'm worried about.

  Keep the whole thing under 500 words and end with one sentence naming the single feature that's carrying the load. Casual is fine, don't stand on ceremony.
reasoning: |-
  Okay, the user is a novelist looking for a scientific scenario where defining a geological epoch boundary involves a decision that appears objective but is actually subjective. They want a realistic case where the boundary marker spreads gradually, leading to different dates based on the reference point chosen. 

  First, I need to create a plausible scenario. The marker should be a physical trace that appears at different times globally. Microplastics come to mind—they emerged in industrial areas first and spread over decades. The scientific body should be a real-sounding commission without using actual names. 

  The key criteria for choosing the reference point: earliest appearance versus global ubiquity. The earliest site gives an older date, while ubiquity requires a later date when the signal is widespread. The disagreement hinges on whether the boundary marks the first trace or when the marker becomes inescapable. 

  If the marker were instantaneous, the disagreement collapses since all sites would show the same date. That reveals the politics—subjective priorities determine the date when evidence is gradual. 

  The strongest objection: the ubiquity criterion is arbitrary because "significant presence" lacks a strict definition. The earliest proponent might argue that initial appearance is the only objective point. 

  Does the case cheat? No, because both criteria are scientifically valid but prioritize different philosophical approaches. The gradual spread is what makes the decision necessary. 

  The single feature carrying the load is the spatio-temporal gradient of the marker's appearance. That’s the core.
answer: |-
  Here's your thought experiment:

  **Scenario:** The International Chronostratigraphic Commission (ICC) must define the start of the "Synthetocene" Epoch. The primary marker is crystalline polymer microspheres (CMPs) – tiny, durable, artificial particles first mass-produced in industrial centers circa 1820 CE. CPMs spread globally via trade winds and ocean currents, but *not* synchronously. They appear abruptly in European lake sediments by 1830, reach detectable levels in Antarctic ice cores by 1880, and only become ubiquitous in remote Amazonian soils by 1920. The ICC must choose one Global Boundary Stratotype Section and Point (GSSP) – a single location defining the epoch's start.

  **Rival Criteria & Dates:**
  1.  **"First Detectable Signal":** Advocates prioritize the *earliest unambiguous appearance* of the novel human signature. They select a European lake core. **Date: 1830 CE.** *Why:* This captures the *genesis* of the new forcing agent. The feature doing the work is the **localized industrial origin** of CPMs.
  2.  **"Global Environmental Impact":** Advocates argue the epoch begins when the marker becomes an *inescapable, planet-wide phenomenon*. They select the Antarctic ice core. **Date: 1880 CE.** *Why:* This marks when human influence became geographically inescapable, not just a local anomaly. The feature doing the work is the **slow planetary diffusion** of CPMs.

  **If Marker Instantaneous:** If CPMs appeared *everywhere* simultaneously in 1850, the disagreement *collapses*. Both criteria converge on 1850. This proves the **politics isn't creating the disagreement**; it's the **objective spatio-temporal gradient** of the evidence that forces a *scientific judgment call* about what constitutes the "start" of a global change.

  **Strongest Objection (Defending 1830):** "Choosing 1880 isn't science, it's moving the goalposts based on arbitrary thresholds. 'Ubiquity' is undefined and subjective – is it 50% of sampled sites? 90%? The *only* objective, reproducible point is the *first occurrence*. By selecting Antarctica, you're deliberately ignoring the clear *origin point* of the forcing mechanism just because it took time for *our* pollution to reach pristine environments. You're prioritizing the *consequence* over the *cause*, retroactively absolving the initial industrial act by delaying the epoch's start."

  **Honest Check:** It doesn't cheat. The science (gradual spread) is fixed. The disagreement arises *entirely* from differing, equally valid *definitions* of what a period boundary signifies: is it the birth of a new force, or its maturation into a global driver? Both criteria are logically defensible within stratigraphic principles; the choice reflects *what story the boundary should tell*.

  **The Load-Bearing Feature:** The **spatio-temporal gradient** of the marker's first appearance.
