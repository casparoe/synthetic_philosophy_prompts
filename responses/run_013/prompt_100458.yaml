answer: |-
  Here’s a decision tree handout mapping the logical space of positions on advance directives for dementia, based on shared starting commitments. Each branch answers a key philosophical question, leading to named positions on the authority of the past self. Nodes are phrased neutrally, and unexplored/incoherent leaves are flagged.

  ---

  **ADVANCE DIRECTIVES & DEMENTIA: WHO GOVERNS THE FUTURE SELF?**  
  *Starting Commitment: It is legitimate for a competent person (P1) to sign an advance directive refusing treatment for future dementia.*

  ### THE DECISION TREE  
  **(Follow paths by answering YES/NO to each question)**

  1.  **Is the severely demented individual (P2) numerically the same person as P1?**  
      *(Does personal identity persist despite radical psychological discontinuity?)*  
      - **NO** → Go to Q1a  
      - **YES** → Go to Q2  

      1a. **Does P1’s directive still bind P2’s caregivers?**  
          *(Can P1 obligate others to enforce their will on a "new" person?)*  
          - **NO** → **Position: Moral Stranger** (P1’s directive lacks authority; P2 is a distinct person whose caregivers owe duties *only* to P2. Directive is void.)  
          - **YES** → **Position: Testator Authority** (P1’s directive functions like a *will* disposing of their body/resources. P2’s interests/wishes are irrelevant. Authority rests on property-like rights.)  

  2.  **Can P1’s autonomy be “exercised in advance”?**  
      *(Is autonomy a capacity only exercisable *now*, or can its effects bind future states?)*  
      - **NO** → Go to Q3  
      - **YES** → Go to Q4  

  3.  **Does P2 retain *sufficient* psychological continuity with P1 for P1’s directive to apply?**  
      *(Is there a threshold of connectedness (e.g., values, narrative identity) that survives dementia?)*  
      - **NO** → **Position: Presentist Autonomy** (Only P2’s current interests/wishes matter. P1’s directive is merely advisory. Authority rests solely on present capacity.)  
      - **YES** → **Position: Survivor Interest Proxy** (P1’s directive reflects P1’s *enduring interests* that survive into dementia. It binds if it serves P2’s *objective* well-being, interpreted via continuity. P2’s protests may indicate failure.)  

  4.  **What is the PRIMARY basis of the directive’s authority?**  
      - **P1’s Enduring Critical Interests** → Go to Q5  
      *(e.g., avoiding indignity, preserving resources, preventing suffering P1 feared)*  
      - **P1’s Authorship of P2’s Situation** → Go to Q6  
      *(P1 created P2’s state; P2 is P1’s “work”)*  
      - **P1’s Binding Commitment** → Go to Q7  
      *(P1 made a promise/contract; fidelity demands enforcement)*  

  5.  **Does P2’s *current contentment* override P1’s directive?**  
      *(If P2 seems happy, does this negate P1’s fear of suffering?)*  
      - **NO** → **Position: Critical Interest Preservation** (P1’s judgment about their *own* enduring interests dominates. P2’s contentment is irrelevant or evidence of incompetence.)  
      - **YES** → **Position: Contentment Threshold** (P1’s directive binds *unless* P2 achieves a minimal threshold of stable contentment/satisfaction, suggesting the feared suffering is absent.)  

  6.  **Is P1’s authority over P2 analogous to a *contract* with caregivers or a *Ulysses pact*?**  
      - **Contract** → **Position: Delegated Stewardship** (P1 contracts with caregivers to enforce their will *on P2* as a condition of care. P2’s dissent breaches the contract.) **(*Unexplored* - Logically possible but rarely defended due to objectifying P2.)**  
      - **Ulysses Pact** → **Position: Self-Binding Sovereignty** (P1 binds *themselves* against future weakness/“sirens.” P2’s protests are the weakness P1 anticipated. Authority rests on P1’s sovereignty over their life narrative.)  

  7.  **Does P2’s *vehement protest* against the directive nullify it?**  
      - **NO** → **Position: Binding Self-Governance** (P1’s commitment must be honored to respect their prior autonomy. P2’s protest is a symptom of the condition P1 sought to avoid.)  
      - **YES** → **Position: Revocable Commitment** (A competent self can bind a future self, but a future self expressing clear dissent (even if demented) retains the power to revoke the commitment. Authority is contingent on ongoing non-repudiation.)  

  ### KEY DISTINCTIONS INCORPORATED
  *   **Directive Type:**  
      *   *Will (Testator)*: Q1a-YES.  
      *   *Contract (Stewardship)*: Q6-YES (Contract).  
      *   *Ulysses Pact (Self-Binding)*: Q6-YES (Ulysses).
  *   **Decision Type:**  
      *   Most positions distinguish one-off (e.g., antibiotics) vs. ongoing care implicitly via the basis of authority (Interests/Commitment more likely to support ongoing refusal than Presentism or Contentment Threshold). *Self-Binding Sovereignty* most clearly authorizes ongoing constraints.

  ### NOTES ON THE TREE
  *   **Unexplored/Incoherent:** `Delegated Stewardship` (Q6 Contract) is logically possible but ethically problematic (treating P2 as property/object of contract). Few defend it.
  *   **Branch Ambiguity:** Distinguishing `Critical Interest Preservation` (Q5-NO) from `Self-Binding Sovereignty` (Q6-Ulysses) can be fuzzy. Both prioritize P1, but the *basis* (Interests vs. Commitment/Narrative) differs. The tree separates them via Q4.
  *   **Key Omission:** Distinctions based on *type of treatment refused* (e.g., life-saving vs. comfort care) aren't nodes but factor into how positions *apply* (e.g., `Contentment Threshold` might allow refusing dialysis but not pain meds).

  ### MY COMMITMENT & CRUCIAL BRANCH
  I defend **Binding Self-Governance (Q7-NO)**. Autonomy isn't just present capacity; it includes the power to shape one's future story through precommitment, especially against anticipated loss of self. P2’s protests, while poignant, are the very manifestation of the fractured autonomy P1 sought to preempt. Honoring P1’s directive respects their life-long agency.

  **The Crucial Branch is Q2 (Can Autonomy Be Banked? YES).** Accepting that autonomy can extend temporally through commitment is fundamental. Without this, arguments collapse into presentism (`Presentist Autonomy`) or weak proxies (`Survivor Interest Proxy`), failing to capture the core idea of governing one’s *own* future diminished state.

  ---
  **Handout Formatting Tip:** Print this as a flowchart. Use boxes for Questions (Q1, Q1a, Q2, etc.) and ovals for Positions. Arrows labeled YES/NO connect them. Bold position names for clarity. Keep the "My Commitment" section separate if desired.
