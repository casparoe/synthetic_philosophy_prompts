prompt: |-
  I'm a philosophy professor, and through a series of decisions I won't defend I've ended up on the advisory board of a small grantmaker that funds insect-welfare work. The board is three economists, one commited utilitarian, and me. Last month they got me to build the scoring sheet that decides which proposals get funded, and now I can't stop seeing the philosophy leaking out of it.

  Here's how it works. Every proposal gets a single number: N, the number of insects affected, times P, a sentience probability we read off a rubric we made up ourselves (honeybee 0.6, black soldier fly 0.2, ant 0.05, springtail 0.002, and anything not on the list gets whatever the person doing the rubric feels like that morning), times D, duration in insect-hours, times I, a suffering-intensity weight from 1 to 5, times S, the probability the intervention actually does what the proposal claims. We sort by the product and fund down the list until the money runs out. When we compare across the whole portfolio we multiply anything vertebrate by 100, which nobody has ever justified out loud. Two more features of the process: we have a standing rule that no grant may itself involve deliberately harming insects, no matter how big the expected number comes out, and most of the interventions we like work by changing how many insects there are (fewer larvae hatching, more overwintering habitat) rather than by making a fixed set of insects feel better — and we've never worked out what the N cell is even supposed to mean in those cases.

  So: what does this practice presuppose? I don't want a survey of insect cognition, I want the implicit theory. Does the product formula commit us to sentience being a graded magnitude that can carry a probability and be compared cardinally across taxa — or could you hold that and still find a spreadsheet like ours absurd? What does the multiplication quietly rule out (threshold views, precautionary views, moral status as all-or-nothing, the idea that you can't do arithmetic on moral status at all)? Where is the practice underdetermined — which incompatible theories would license exactly the same spreadsheet? And is the no-deliberate-harm rule consistent with ranking everything by expected value, or is the board just holding two things that can't both be true?

  Then the counterfactuals: for each main rival, what would have to change — new columns, a different aggregation, or no aggregation at all?

  Skip the citations and reading lists, just give me the analysis, and finish with a JSON object with exactly these keys:

  - "presuppositions": array, at most six. Each element an object with "claim" (the commitment, one sentence), "strength" (one of "strict", "loose", "merely compatible"), "why" (the argument that the practice actually needs it), and "rules_out" (array of rival positions it excludes; empty array if none).
  - "compatible_rivals": array of strings — theories that would license the practice exactly as it stands.
  - "underdetermined": array of objects with "question" (a question the practice can't answer) and "all_fit" (array of the competing answers that the practice can't distinguish between).
  - "tensions": array of objects with "tension" (one sentence), "poles" (array of the two things pulling apart), and "severity" (one of "fatal", "serious", "cosmetic").
  - "counterfactuals": array of objects with "alternative" (the rival view) and "change" (what the spreadsheet or process would have to become).
  - "bottom_line": string, three sentences max, on how much philosophy is actually baked into the thing.
reasoning: |-
  We are given a detailed description of a grant scoring practice and asked to analyze its philosophical presuppositions, tensions, and alternatives. We'll break it down step by step.

  ### Presuppositions
  The practice uses a formula: `Score = N * P * D * I * S`, with an ad-hoc multiplier for vertebrates (x100). Also, there is a rule against deliberate harm and interventions that change population sizes.

  We need to extract the implicit commitments:

  1. **Claim**: Sentience can be meaningfully represented as a probability (P) and compared across taxa.  
     **Strength**: Strict (the rubric requires assigning a number to each species).  
     **Why**: The formula multiplies P, which is a probability of sentience, and this is central to the score. Without this, the P factor collapses.  
     **Rules_out**: Views that deny sentience can be probabilistic (e.g., all-or-nothing views that say an organism either is sentient or not, with no probability) or that deny cross-taxa comparability.

  2. **Claim**: Moral value (or disvalue) of an intervention is linear in the number of individuals (N), the duration (D), and the intensity (I).  
     **Strength**: Strict.  
     **Why**: The multiplicative form assumes linear scaling. If doubling N doesn't double the moral weight, the product is invalid.  
     **Rules_out**: Threshold views (e.g., suffering only matters above a certain intensity or duration), diminishing returns, or non-linear aggregation.

  3. **Claim**: The moral value of affecting an individual can be represented by a single cardinal number (the product of P, I, and D) that aggregates multiple dimensions.  
     **Strength**: Strict.  
     **Why**: The formula multiplies P, I, and D to get a per-individual measure, then multiplies by N. This requires cardinal comparability.  
     **Rules_out**: Views that see moral status as multi-dimensional and incommensurable (e.g., no common currency) or that reject cardinal aggregation.

  4. **Claim**: Expected value maximization is the correct decision procedure.  
     **Strength**: Strict.  
     **Why**: The formula multiplies by S (probability of success) and then ranks by expected value (N*P*D*I*S).  
     **Rules_out**: Precautionary principles (e.g., avoid actions with catastrophic potential even if expected value is high), satisficing, or non-consequentialist decision rules.

  5. **Claim**: The moral status of vertebrates is exactly 100 times that of invertebrates, in a way that is constant across contexts.  
     **Strength**: Strict (for the purpose of the multiplier).  
     **Why**: The x100 multiplier is applied without justification and without variation.  
     **Rules_out**: Views that see moral status as context-dependent, or that don't accept a fixed ratio, or that see moral status as incommensurable.

  6. **Claim**: Deliberate harm is impermissible even if it leads to greater expected good.  
     **Strength**: Strict (from the no-harm rule).  
     **Why**: The rule prohibits grants that involve deliberate harm regardless of the expected value.  
     **Rules_out**: Pure consequentialism (which would allow harm if the net expected value is positive).

  Note: The practice also has an issue with interventions that change population sizes (e.g., reducing the number of larvae). In these cases, N is ambiguous. This points to a presupposition about the counterfactual baseline:

  7. **Claim**: The baseline for comparison (what would have happened without intervention) is well-defined and the change in population is the relevant N.  
     **Strength**: Loose (because they haven't worked it out).  
     **Why**: Without a clear counterfactual, N is undefined. But the practice still uses N, so they must assume that the change in population (or the number of insects affected) can be measured.  
     **Rules_out**: Views that deny we can define a baseline (e.g., due to uncertainty) or that see population changes as morally irrelevant.

  But we are limited to six, so we'll pick the top six.

  ### Compatible Rivals
  What theories would license the practice exactly as it stands?

  - **Classical utilitarianism (hedonistic) with a fixed moral weight per species and expected utility maximization**: This fits because the formula is additive (via the product) and maximizes expected value. The no-harm rule might be seen as an external constraint, so not entirely consistent, but if we interpret the rule as a deontological side-constraint, then a mixed theory could fit.

  But note: the no-harm rule is inconsistent with pure classical utilitarianism. So we need a theory that:

     - Endorses expected value maximization for non-harmful interventions.
     - Forbids deliberate harm categorically.

  Thus:

  - **Rule utilitarianism**: If the rule against deliberate harm is justified by its overall utility, then it might be incorporated. However, in the scoring, the rule is absolute and not subject to expected value, so it might not fit perfectly.

  Alternatively:

  - **A hybrid theory**: deontological constraints (no deliberate harm) plus consequentialist maximization otherwise.

  But the spreadsheet itself (without the no-harm rule) is purely consequentialist. The no-harm rule is a separate constraint. So the practice as a whole is compatible with:

     - **Consequentialism with an absolute constraint against deliberate harm** (which is not a standard consequentialist view; it's deontological). 

  However, the economists and the utilitarian might be inconsistent. The utilitarian might accept the rule as a heuristic, but the rule is applied strictly.

  Also, the fixed multiplier (x100) is arbitrary and not justified by any particular theory. But any theory that accepts cardinal comparability and that vertebrates have higher moral weight (by a fixed factor) could accept it.

  So:

  - **A form of utilitarianism that assigns fixed moral weights per species, with a special multiplier for vertebrates, and that uses expected utility, but with an absolute deontological constraint against deliberate harm.**

  But note: the utilitarian on the board might be going along with the rule for pragmatic reasons. The practice as a whole is compatible with a theory that has:

     - A consequentialist core (the scoring) and a deontological exception (the no-harm rule).

  Thus, we can say:

     - "Consequentialism with a deontological constraint against harm"

  But note: the scoring formula is also compatible with prioritarianism or other aggregative consequentialist views if they accept the linear form. However, the linearity in N and D suggests classical utilitarianism.

  So we'll say:

  - **Classical utilitarianism with an absolute side-constraint against deliberate harm** (which is a hybrid theory).

  Also, the fixed multiplier for vertebrates might be compatible with a speciesist view or one that assigns moral weight based on neurological complexity.

  But the question is: what theories would license the practice exactly? So:

     - The practice is compatible with a form of **expected utility theory with fixed moral weights and a side-constraint**.

  But note: the practice does not specify a theory, so any theory that would produce the same decisions is compatible. We cannot list all, but we can note:

     - **The practice is compatible with a hybrid deontological-consequentialist theory that uses expected utility for non-harmful interventions and forbids harm.**

  However, the economists might be acting as if they are pure consequentialists, but they are not because of the rule.

  Alternatively, the no-harm rule might be seen as a way to avoid slippery slopes or bad publicity, which is consequentialist. But the rule is absolute, so it's not justified case-by-case. That would be rule-consequentialism.

  So:

     - **Rule-utilitarianism**: if the rule against harm is justified by its long-term consequences, then the practice is compatible.

  Thus, we can list:

     - Rule-utilitarianism
     - Hybrid deontological-consequentialism

  But note: the problem says "theories that would license the practice exactly as it stands". Both of these can.

  ### Underdetermined
  What questions can the practice not answer? And what competing answers are compatible?

  1. **Question**: What is the baseline for population-changing interventions?  
     **All_fit**: 
        - The baseline is the current population (so reducing larvae means fewer insects will exist and suffer, so N is the reduction).
        - The baseline is the potential population (so if we don't intervene, more insects would have been born, so N is the number of prevented births).
        - The baseline is the welfare of the insects that would have been born (so we are affecting the welfare of non-existent beings?).

     The practice uses N without specifying, so any of these can be plugged in.

  2. **Question**: What is the moral significance of changing population sizes?  
     **All_fit**:
        - Reducing the number of insects is good because it reduces total suffering (if we assume their lives are net negative).
        - Reducing the number of insects is bad because it deprives them of positive experiences (if we assume their lives are net positive).
        - It is neutral because non-existent beings have no moral status.

     The practice doesn't specify how to value existence vs. non-existence. They just use N, so any of these could be behind the scenes.

  3. **Question**: How do we assign P (sentience probability) to unlisted species?  
     **All_fit**: 
        - Use analogy to known species (so extrapolate).
        - Use a theory of sentience (e.g., based on brain structures).
        - Arbitrary assignment (which is what they do).

     The practice doesn't specify, so any method fits.

  ### Tensions
  Internal conflicts in the practice:

  1. **Tension**: The no-deliberate-harm rule vs. expected value maximization.  
     **Poles**: ["Deontological constraint", "Consequentialist maximization"]  
     **Severity**: Serious (because the rule is absolute and not integrated into the scoring, so it might block a high-scoring proposal that involves harm, which would be inconsistent with pure consequentialism).

  2. **Tension**: The fixed vertebrate multiplier vs. the individualistic, per-insect scoring.  
     **Poles**: ["Species-based moral hierarchy", "Individual welfare aggregation"]  
     **Severity**: Cosmetic (because the multiplier is arbitrary but doesn't break the system; it's just an ad-hoc adjustment).

  3. **Tension**: The linear aggregation in the product formula vs. the possibility of diminishing returns or threshold effects.  
     **Poles**: ["Linear aggregation", "Non-linear moral weighting"]  
     **Severity**: Serious (if in reality there are thresholds, e.g., only suffering above a certain intensity matters, then the formula is fundamentally flawed).

  4. **Tension**: The ambiguity in N for population-changing interventions vs. the need for a clear number.  
     **Poles**: ["Counterfactual population as baseline", "Actual population as baseline"]  
     **Severity**: Serious (because without a clear definition, the same intervention could be scored differently).

  ### Counterfactuals
  For each rival view, what would change?

  1. **Alternative**: Precautionary principle (avoid actions with potential for high harm even if expected value is positive).  
     **Change**: Instead of multiplying by S (probability of success), we might set a threshold (e.g., only fund if S is above a certain level) or use a minimax rule. The aggregation might change to reflect worst-case scenarios.

  2. **Alternative**: Deontological view that sentience is all-or-nothing and that some species have rights (so no probability P).  
     **Change**: We would have to drop P. Instead, we might have a binary column (sentient or not) and only consider sentient species. The scoring would then be N*D*I*S for those species. Also, the vertebrate multiplier would be dropped or integrated differently.

  3. **Alternative**: View that moral status is not cardinally comparable across taxa.  
     **Change**: We could not have a single product. We might have separate categories for each species and fund based on categorical priorities. Or use an ordinal ranking.

  4. **Alternative**: View that population changes are morally neutral (antinatalism or pronatalism).  
     **Change**: For interventions that change population, we would set N to zero (so they get no score) or adjust the calculation to only consider welfare changes for existing insects.

  5. **Alternative**: Threshold view (suffering only matters above a certain intensity).  
     **Change**: We would set a threshold for I (e.g., only I>=3 matters) and then use the same formula but with I set to 0 for below-threshold suffering.

  ### Bottom Line
  The spreadsheet is deeply philosophical. It presupposes a form of consequentialism that aggregates individual welfare linearly and cardinally, with expected value maximization. However, the no-harm rule introduces a deontological constraint that is inconsistent with pure consequentialism. The arbitrary vertebrate multiplier and the ad-hoc sentience probabilities reveal that the practice is underdetermined by theory and relies on operational compromises.

