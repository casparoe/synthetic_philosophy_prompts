prompt: |-
  I am a trustee of a small woodland charity, and I would like advice on a decision the board has to take.

  Our scheme is simple: we pay a landowner a fixed sum for each hectare of native broadleaf woodland they plant and maintain for ten years. Our endowment covers a modest number of hectares each year, and we have just opened a fourth round of applications. Three difficulties have surfaced at once, and I suspect they are not the same difficulty.

  The first is that two applicants appear to have cleared mature native woodland and then replanted it. Their paperwork is in order, because our criteria are written in terms of what is planted rather than in terms of what was there beforehand. The second is that most of the land we have funded is land nobody else wanted — steep, wet, awkward fields whose baseline was already poor — so the hectares we can point to flatter us, while the woodlands that matter most to us are being looked after by other people with other money. The third is that we can no longer find out whether the scheme works at all: the only sites we hold data for are sites that applied to us, and the people who apply are the people who wanted the money. Our evidence about the scheme is manufactured by the scheme.

  A fellow trustee draws the moral that this is simply what happens to every number, that whatever figure we choose will be chased and distorted within a year or two, and that we should abandon the hectare payment and fund people we trust, case by case, on our judgement. I think she is half right and half dangerous. Another trustee proposes keeping the hectare count but adding a condition that no mature woodland may be lost, with an audit. I can already see how I would evade that condition if I were a landowner.

  What should we do — keep, repair, or abandon the hectare measure? I am also asking something less practical: whether my colleague's position is even coherent. Is there any real alternative to being steered by some measure, or is the choice only between the measures we admit to using and the ones we pretend not to be using? And if we do keep a measure, what can we honestly tell our funders, who want a headline figure and have hinted that next year's grant depends on that figure rising? Please be concrete, and tell me what I would be giving up in each case. I do not need a survey of the literature.
reasoning: |-
  Okay, the user is a trustee of a small woodland charity facing a complex dilemma about their hectare-based funding model. They've described three distinct problems: applicants clearing mature woodland to replant for payments, funding only marginal land that wasn't threatened anyway, and selection bias in their effectiveness data. 

  Hmm, this is fascinating because it's both a practical operational challenge and a profound philosophical question about metrics. The user clearly understands the deeper systemic issue - how measurement creates perverse incentives. Their colleague's "all metrics corrupt" stance feels too nihilistic, while the other trustee's simple "no mature woodland loss" rule seems easy to circumvent. 

  What the user really needs is concrete alternatives that balance accountability with ecological integrity. They're also subtly asking for validation that metrics aren't inherently evil - just dangerous if naive. The charity's funders demanding rising hectare counts make this urgent. 

  Let me break this down: First, the hectare measure is clearly broken. Keeping it as-is would be irresponsible. But abandoning measurement entirely would make them unaccountable to funders and vulnerable to bias. So repair is the only viable path. 

  For the clearing problem: The solution isn't just banning mature woodland loss - that's too narrow. They need a holistic "additionality" test. Maybe require applicants to document land use history? Though that creates paperwork... Perhaps a points system where replanted cleared woodland scores lower than true conversion? 

  The marginal land issue cuts deeper. They're paying for trees that would've been fine anyway. Should they incorporate ecological threat into payments? Like paying more for converting high-value farmland? But that might exceed their budget... 

  The data problem is toughest. They need control groups. Could they partner with universities for independent monitoring? Or sample non-applicant woodlands? Though that costs money... 

  The colleague advocating pure judgment has a point about flexibility but ignores human bias. Better to design metrics that capture what matters - like canopy cover or biodiversity scores. Though those are harder to measure than hectares... 

  For funders: They'll need education. Instead of "hectares planted," pitch "net native woodland gain" or "habitat quality points." Frame it as smarter measurement. 

  Practically, I'd suggest: Tiered payments based on land quality, mandatory before/after audits, and allocating 10% of funds to monitoring. Yes, it's more work. But the alternative is funding deforestation while calling it conservation - which is worse.
answer: |-
  Your situation exposes three distinct but interconnected flaws in the hectare-based metric: **perverse incentives, marginal impact, and selection bias**. Here’s a concrete analysis of your options—**keep, repair, or abandon**—and what you’d gain or lose with each, followed by principles for communicating with funders.

  ---

  ### **Option 1: Keep the Hectare Measure (Status Quo)**  
  **What you give up:**  
  - **Ecological integrity:** Paying for clearing mature woodland (even if replanted) *reduces* biodiversity and carbon storage. Mature woods take decades to recover.  
  - **Impact:** Funding only marginal land means your charity isn’t protecting threatened habitats or creating meaningful change.  
  - **Credibility:** Funders may eventually realize your "hectares planted" metric is ecologically shallow or even harmful.  
  - **Truthful accountability:** Your data only measures "hectares applicants wanted money for," not environmental benefit.  

  **Outcome:** Short-term simplicity, long-term reputational risk and wasted resources.

  ---

  ### **Option 2: Repair the Hectare Measure**  
  **Concrete fixes for each flaw:**  
  1. **Perverse Incentives (clearing mature woodlands):**  
     - **Require "additionality":** Pay *only* for **new native woodland** on land that was *not wooded* in the past 10–20 years (verified via satellite/historical maps).  
     - **Penalize clearance:** Deduct payments if any mature native woodland was cleared on the applicant’s *total holdings* (not just the funded plot) in the last 5 years.  
     - **Tiered payments:** Pay more for converting improved pasture/Arable land (higher opportunity cost), less for marginal land.  

  2. **Marginal Impact (funding low-value land):**  
     - **Target "at-risk" land:** Prioritize applications adjacent to existing ancient woodlands, wildlife corridors, or floodplains. Use GIS data to score ecological value.  
     - **Pay for outcomes, not just trees:** Allocate 20% of payment to survival rate at Year 5/10 (e.g., >80% canopy cover).  

  3. **Selection Bias (no counterfactual data):**  
     - **Fund third-party monitoring:** Use 5–10% of your budget to audit *randomly selected* funded sites + similar non-funded woodlands. Partner with a university for independent impact analysis.  
     - **Track non-applicants:** Survey landowners who *didn’t* apply to understand their management practices (e.g., offer a small incentive for participation).  

  **What you gain:** Metrics aligned with ecological goals, defensible impact claims.  
  **What you give up:** Administrative complexity, higher verification costs (~15–20% of budget), potentially fewer "hectares" to report.  

  ---

  ### **Option 3: Abandon the Hectare Measure**  
  **Shift to a hybrid model:**  
  - **Core funding for "trusted stewards":** Identify 3–5 long-term partners (e.g., community forests, conservation NGOs) with proven records. Fund them via unrestricted grants for 5+ years to manage existing high-value woodlands.  
  - **Impact bonuses:** Allocate 20–30% of funds for competitive projects tied to outcomes (e.g., £X per confirmed breeding pair of endangered species, £Y per hectare of invasive species removed).  
  - **"Emergency fund"** for rapid response (e.g., preventing ancient woodland clearance).  

  **What you gain:** Targets real threats, builds deep partnerships, avoids perverse incentives.  
  **What you give up:** Simplicity for funders ("hectares planted" is gone), requires expert judgment (board must assess steward credibility), fewer "new" hectares to showcase.  

  ---

  ### **Your Colleague’s Dilemma: Measure vs. Judgment**  
  Your colleague is **half-right**:  
  - **Dangerous half:** Abandoning metrics entirely leaves you vulnerable to bias, inconsistency, and opaque decision-making. Funders and regulators demand accountability.  
  - **Correct half:** *Naive metrics corrupt*. The solution is **smarter metrics**, not no metrics.  
  **A coherent alternative:** Adopt **weighted indicators** (e.g., Habitat Quality Score × Hectares) or **outcome-based payments** (e.g., carbon sequestered, biodiversity uplift). These require expertise but resist gaming better than hectare counts.  

  ---

  ### **What to Tell Funders**  
  **Transparency is your leverage.** Say:  
  > *"We’ve refined our approach to ensure every pound creates lasting impact. Instead of just tracking hectares planted, we now measure:  
  > 1. **Net native woodland gain** (excluding replaced mature woodland),  
  > 2. **Ecological quality** of land funded (prioritizing at-risk habitats),  
  > 3. **Long-term survival rates** of trees.  
  > This means our headline figure may be lower initially, but each hectare achieves 3× the biodiversity benefit. We’d welcome your support to pilot this industry-leading standard."*  

  **If they insist on rising hectares:** Propose a **"matched outcomes"** grant (e.g., £X for hectares, £2X for verified habitat improvement). This aligns their demand with your mission.  

  ---

  ### **Recommendation: Repair, with Hybrid Elements**  
  1. **Immediately:** Add an **"additionality and no-clearance" clause** to contracts (with satellite audits).  
  2. **Year 1:** Pilot **outcome payments** (e.g., 30% of fee conditional on Year 5 survival).  
  3. **Year 2:** Allocate 20% of funds to **"stewardship grants"** for critical existing woodlands.  
  4. **Invest in monitoring:** Use free tools like [Global Forest Watch](https://www.globalforestwatch.org/) for land-use history.  

  **You give up simplicity, but gain impact and integrity.** The alternative is funding deforestation while calling it conservation—a far greater risk.
