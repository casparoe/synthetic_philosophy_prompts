  ### Joint Statement on Pragmatic Encroachment and Contextualism in Epistemology

  #### 1. Common Ground  
  We, the undersigned subject-sensitive invariantist (pragmatic encroacher) and epistemic contextualist, affirm the following points of agreement:

  1.1 **Ordinary pattern of knowledge attributions**:  
  Ordinary speakers exhibit a systematic pattern of knowledge ascription: holding fixed a subject’s evidence and the factual world, speakers are less inclined to attribute knowledge in high-stakes situations (where error costs are grave) and more inclined in low-stakes situations. Similarly, speakers retract or modify knowledge attributions when salient alternatives are raised, irrespective of the subject’s awareness of those alternatives.

  1.2 **Rival positions jointly rejected**:  
  We reject classical invariantism, which holds that the truth conditions of knowledge attributions are wholly determined by the subject’s evidence, the proposition’s truth, and invariant epistemic standards. We also reject skeptical invariantism, which posits universally high standards that render knowledge unattainable in most practical contexts. Both views fail to explain the observed variability in knowledge attributions.

  1.3 **Methodological constraints**:  
  A theory of knowledge ascription must:  
  (i) Explain the patterns in §1.1 without ad hoc stipulations.  
  (ii) Preserve the intuitive connections between knowledge, assertion, and practical reasoning (e.g., "knowledge warrants action").  
  (iii) Be grounded in a plausible semantics for "knows" that integrates with broader linguistic theory (e.g., handling gradability, context-sensitivity, or disagreement).

  1.4 **Evidence against our own views**:  
  - The **pragmatic encroacher** would accept evidence against subject-sensitive invariantism (SSI) if:  
    *Empirical studies show that subjects with identical evidence/practical situations receive divergent knowledge attributions solely due to attributor context (e.g., third-party eavesdroppers in contrasting stakes).*  
  - The **contextualist** would accept evidence against contextualism if:  
    *Subjects with identical evidence but differing practical situations (e.g., low- vs. high-stakes) systematically receive uniform knowledge attributions across all attributor contexts.*  

  ---

  #### 2. Residual Disagreements  
  The table below states our core disagreements twice: first in wording the pragmatic encroacher (SSI) endorses, second in wording the contextualist (EC) endorses. Notes indicate whether disagreements may be verbal and how disambiguating "knows" might resolve them.

  | Topic | Pragmatic Encroacher (SSI) Endorsement | Contextualist (EC) Endorsement | Notes |
  |-------|----------------------------------------|-------------------------------|-------|
  | **Role of practical factors** | Practical stakes partially constitute the *knowledge relation itself*. Whether S knows p depends constitutively on S’s practical situation. | Practical stakes affect the *semantic content of "knows"* by setting the threshold for justification/warrant in the attributor’s context. Stakes do not alter the knowledge relation. | **Not merely verbal**. Disambiguating "knows" reveals a metaphysical divide: SSI treats stakes as world-involving (affecting the factive relation), while EC treats stakes as language-involving (affecting semantic content). |
  | **Locus of practical stakes** | The relevant practical situation is the *subject’s*: S’s stakes directly modulate the truth conditions of "S knows p" for all attributors. | The relevant practical situation is the *attributor’s*: The attributor’s stakes (or contextually salient stakes) fix the truth conditions of "S knows p." | **Substantive disagreement**. Turns on whether "knows" is agent-indexed (SSI) or speaker-indexed (EC). Disambiguating "knows" as *knows-subject* vs. *knows-context* clarifies but does not resolve the dispute. |
  | **Source of epistemic standards** | Epistemic standards are fixed by the *subject’s environment*, including practical risks. Standards are invariant across contexts of attribution. | Epistemic standards are fixed by the *attributor’s conversational context*, including presuppositions and practical interests. Standards vary across contexts of attribution. | **Potentially verbal**. If "epistemic standards" refer to the *threshold for justification*, both agree it varies; disagreement concerns *what determines variation* (subject’s world vs. attributor’s context). |

  ---

  #### 3. Cruxes and Predictions  
  We present two cruxes, agreed cases bearing on them, and each side’s predictions. These will be tested during the workshop.

  **Crux 1: Do practical factors enter the truth conditions of "knows" or the knowledge relation?**  
  - **Agreed Case**: A subject, Hannah, has moderate evidence for p (e.g., a reliable but not infallible source). She faces medium stakes. Two attributors discuss her: one in a low-stakes context (e.g., casual conversation), one in a high-stakes context (e.g., planning a critical mission).  
    - **SSI Prediction**: Both attributors’ knowledge claims about Hannah have the *same truth value*. Truth conditions depend solely on Hannah’s practical situation (medium stakes), not attributors’ contexts.  
    - **EC Prediction**: The attributors’ knowledge claims have *different truth values*. Truth conditions depend on attributors’ contexts: the low-stakes attributor speaks truly; the high-stakes one speaks falsely.  

  **Crux 2: Whose practical situation matters—subject’s or attributor’s?**  
  - **Agreed Case**: Identical twins, Low-Stakes Lara and High-Stakes Hana, have the same evidence for p. Lara faces trivial consequences if wrong; Hana faces dire consequences. A single attributor in a *neutral* context evaluates both.  
    - **SSI Prediction**: "Lara knows p" is true; "Hana knows p" is false. Truth conditions track the subject’s stakes.  
    - **EC Prediction**: Both claims have the *same* truth value. Truth conditions depend solely on the attributor’s context (here, neutral), not the subjects’ stakes.  

  ---

  #### 4. Case Analyses  
  We apply our views to two cases, stating verdicts and reasons. Where verdicts align, we note if the reasoning diverges.

  **Case 1: The Engineer and the Bridge**  
  *Scenario*: An engineer must certify a bridge’s safety; a mistake would kill hundreds. During a relaxed lunch, her colleague (same evidence, no certification duty) says, "I know the bridge is safe."  
  - **SSI Verdict**: The colleague speaks **truly**.  
    *Reason*: The colleague is in a low-stakes situation (no responsibility), so her evidence suffices for knowledge. The engineer’s high stakes are irrelevant to the colleague’s knowledge state.  
  - **EC Verdict**: The colleague speaks **truly**.  
    *Reason*: The lunch context has low salience of error, so "knows" has low epistemic standards. The colleague’s evidence meets these standards.  
  - **Agreement**: Verdicts align, but routes differ. SSI cites the colleague’s practical situation; EC cites the attributor’s (colleague’s) conversational context.  

  **Case 2: Mistaken Stakes**  
  *Scenario*: Alex has strong evidence that Bridge X is safe. She believes she is choosing a low-stakes footpath route (error = getting wet). Unbeknownst to her, she is actually choosing whether to send a bus over Bridge X (error = mass casualties). Does Alex know the bridge is safe?  
  - **SSI Verdict**: Alex **does not know**.  
    *Reason*: Knowledge depends on the *actual* practical situation (high stakes), not the subject’s belief. Alex’s evidence is insufficient for high-stakes knowledge.  
  - **EC Verdict**: In an attributor context aware of the true stakes, "Alex knows" is **false**.  
    *Reason*: The attributor’s context (high stakes) sets high epistemic standards. Alex’s evidence, while strong, does not meet them.  
  - **Agreement**: Both judge the knowledge attribution false in a high-stakes-aware context. SSI roots this in Alex’s objective situation; EC roots it in the attributor’s context.  

