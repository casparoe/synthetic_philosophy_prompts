answer: |-
  Your engagement with Wigner is thoughtful—and your test is admirably crisp. Below, I rank defeaters by decisiveness, analyze defenses, clarify predictions, and offer a "gold-standard" case. The tension between *insulation* and *falsifiability* is central.

  ---

  ### **Ranked Defeaters (Most to Least Decisive)**
  1. **Selection Effect (The "Carving" Problem)**  
     **Why decisive?** If we *retroactively* label abstract math "pure" only when it later finds application, the correlation is circular. We discard cases where abstract math *never* finds physics applications (e.g., large cardinals in set theory) and falsely inflate "hits."  
     **Strength:** Undercuts the *surprise* of the correlation. If we define "mathematics" as patterns humans find deeply interesting, and physics as the study of patterned regularities, overlap is inevitable.  
     **Conceded?** A defender would grant this as a *legitimate cost* but note: not *all* useful math fits this mold (e.g., number theory pre-computers).

  2. **Rival Explanations (Fewer Commitments)**  
     **Examples:**  
     - **Cognitive/Evolutionary:** Math is effective because it evolved to model regularities in our physical niche (Dehaene, Lakoff).  
     - **Structural Realism:** Physics reveals invariant structures, and math is our best tool to describe structures (Shapiro, Ladyman).  
     - **Tegmark's Mathematical Universe:** Physics *is* mathematics—no "fit" needed.  
     **Strength:** Explains effectiveness without invoking a "miracle." Predicts math *should* work when modeling isomorphic structures.  
     **Conceded?** Defenders accept rivals as *parsimonious* but argue they dilute math's *creative autonomy*: why do *a priori* constructions (e.g., complex numbers) later match reality?

  3. **Celebrated Cases Failing Your Test**  
     **Clause 1 (Math First):** Riemannian geometry (1854) was motivated by generalizing Gauss's differential geometry—*not* gravity. But Gauss studied curvature for geodesy, muddying "purity."  
     **Clause 2 (Novel Prediction):** Group theory predicted quarks (1960s), but physicists like Gell-Mann were already using group-theoretic methods.  
     **Strength:** Shows paradigmatic examples aren't "clean." Most math-physics cross-pollination is gradual.  
     **Conceded?** Defenders wave this off: *some* cases (e.g., below) pass the test. Failures reflect *messy history*, not theory weakness.

  4. **Overqualified Claim (Immunization)**  
     **Risk:** If we exempt math "tainted" by physical inspiration (e.g., calculus, Fourier analysis) or dismiss failed predictions, Wigner's claim becomes unfalsifiable.  
     **Example:** "String theory math hasn't predicted anything? It just hasn't found its domain yet!"  
     **Strength:** Makes the claim vacuous.  
     **Conceded?** **Rightly waved off.** A rigorous defender *insists* on your test: math must be developed *without intent* for the domain and yield *testable novelties*.

  ---

  ### **Sympathetic Defense: Costs and Ripostes**
  - **Real Costs:**  
    - Selection effect weakens *inductive surprise*.  
    - Most historical cases *are* "messy" (e.g., calculus ↔ mechanics).  
  - **Wave-Offs:**  
    - Failures of specific cases don't refute the *general phenomenon*.  
    - Rivals don't explain why *arbitrarily abstract* math (e.g., modular forms in moonshine) applies.

  ---

  ### **What Wigner Predicts (Uniquely)**  
  The position predicts:  
  > *Discoveries in "pure" mathematics, pursued for aesthetic/logical reasons, will **repeatedly** yield precise models for physical phenomena **unforeseeable** by physicists of the era.*  

  Rivals predict math *refining* existing models or modeling *expected* structures (e.g., symmetries), but not the "bolt-from-the-blue" cases.

  ---

  ### **Insulation: Defect or Virtue?**  
  It's **both**, and inherent to meta-scientific claims:  
  - **Defect:** If no failure is admissible (e.g., "just wait longer!"), it's pseudoscience.  
  - **Virtue:** Grand theses (e.g., natural selection) withstand local counterexamples via *explanatory depth*.  
  **Balance:** Your test *forces* falsifiability. If no math passed it in 100 years, Wigner loses.

  ---

  ### **The Gold-Standard Case: Dirac's Antimatter**  
  **Meets your test perfectly:**  
  1. **Math First:** Pauli developed spin matrices (1927) to describe electron spin—a *purely quantum* property with no classical analog. Dirac sought a relativistic wave equation (1928) using Pauli's abstract algebra, treating it as a formal tool.  
  2. **Novel Prediction:** His equation implied negative-energy states. Rather than reject it, he posited *antiparticles* (1928)—a concept absent from physics.  
  3. **Independent Confirmation:** Anderson discovered the positron in cosmic rays (1932), with no prior experimental hints.  

  **Why it satisfies you:**  
  - No physicist sought "antimatter"; Dirac trusted the math.  
  - The algebra was developed for non-relativistic spin, not field theory.  
  - Prediction was shocking, testable, and upheld.  

  Other contenders:  
  - Adams/Leverrier predicting Neptune from orbital math (1846).  
  - Einstein's GR predicting light bending (1919) via Riemannian geometry.  
  *(But both had clearer physical motivations.)*

  ---

  ### **Conclusion**  
  Your test is stringent but fair. The selection effect is the strongest defeater, forcing defenders to argue that *some* math (e.g., number theory) is "pure" by construction. Dirac's antimatter remains the exemplar: abstract algebra compelled a reality no physicist anticipated. Wigner survives not because he's unfalsifiable, but because such cases *exist*—and we should expect more. The unreasonable effectiveness may yet be reasonable, but its moments of *revelation* remain transcendent.
