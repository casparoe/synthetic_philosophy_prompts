prompt: |-
  Turing floated the idea that rather than hand-coding a thinking machine you'd build one that starts out like a child and then educate it. Fast forward to now: would he have been into the modern recipe of just pretraining a giant model on the whole internet and then tuning it with human feedback (RLHF)? I'm curious whether he'd see the no-explicit-curriculum, scale-it-up approach as vindicating his education analogy or as a betrayal of it. Then push it further: what would he have made of AI safety via debate, the proposal where two models argue and a human judges which side is right, as a way of overseeing systems too smart for us to check directly? Would he buy it, or would he think his imitation game already hands you all the oversight you need? And on the education side: if he watched students leaning on LLM tutors that can solve basically any homework, would that be a win for his teach-the-machine-like-a-child picture or a disaster for human learning? Anchor the predictions in specific things he actually argued, and be explicit about where you're extrapolating beyond anything he said.
