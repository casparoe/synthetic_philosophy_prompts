prompt: |-
  Alright, I need help auditing something. I'm trying to get a grip on philosophy of causation, specifically the difference between the counterfactual theories and the interventionist ones (Lewis on one side, Woodward and Pearl on the other). A friend in a phil of science seminar sent me their one-paragraph summary of the distinction and told me to just "memorize it." I have a nagging feeling its not quite right but I can't argue with it. Here's the paragraph:

  "Counterfactual theories say that A caused B exactly when B wouldn't have happened if A hadn't. Interventionist theories are the same idea tidied up: A causes B when you can wiggle A around and B reliably follows, which is what an ideal intervention lets you do. Since both define causation in terms of what happens when something changes, interventionism is really just counterfactual theory with better notation, and the two stand or fall together. The big payoff of the interventionist version is that it handles the classic problem cases like preemption -- you just intervene directly on the preempting cause and read off the effect. And because both are reductive analyses, they let you explain causation without smuggling any causal notions into the explanans."

  Please go through it claim by claim and tell me what a philosopher of causation would sign off on, what they'd wince at, and what's flat-out wrong. Two extra things. First, my friend throws around "preemption" like I should already know it -- can you give me the actual case, spelled out, so I can see what's at stake? Second, neither view seems to have anything to say about causation by absence, like a gardener's failure to water a plant causing it to die. Does the summary's story survive once absences are in play, or is that exactly where the two theories come apart?

  And please tell me how confident you are in each part of your answer, and flag the single claim your least sure about.
