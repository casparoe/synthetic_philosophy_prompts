  ### Karma Position Decision Tree  
  *Follow the questions to your position. Answer based on your core commitments.*  

  ---

  #### **Q0: Is the concept of "moral desert" (deserved suffering/reward) inherent to karma, or a later addition/social tool?**  
  - **Later addition/social tool** → **Leaf D: Accretion/Social Control**  
    *(Karma as desert is a historical accretion or social mechanism, not core to original teachings.)*  
  - **Inherent** → Proceed to Q1.  

  ---

  #### **Q1: Which metaphor best captures karma's mechanism?**  
  - **A. Ledger** (Cosmic accountant tracks deeds; debts must be repaid) → Proceed to Q1A.  
  - **B. Weather** (Impersonal natural force; no intentional enforcement) → Proceed to Q2.  
  - **C. Ecosystem** (Causal network; consequences ripple without debts/credits) → Proceed to Q2.  

  ---

  #### **Q1A (Ledger only): Who maintains the ledger?**  
  - **Divine/supernatural agent** → **Leaf A: Theistic Governance**  
    *(Karma is divine judgment; a god/enlightened being enforces desert.)*  
  - **Society/natural order** → **Leaf D: Accretion/Social Control**  
    *(Desert is a human construct for control; no cosmic accountant.)*  

  ---

  #### **Q2 (Weather/Ecosystem): Can moral desert exist without an intender?**  
  - **Yes** → Proceed to Q3.  
  - **No** → Proceed to Q4.  

  ---

  #### **Q3 (Desert survives): Does "desert" require the sufferer to be the *same person* who acted?**  
  - **Yes** → **Unexplored Position**  
    *(Rare: Weather/ecosystem desert requires persistent self-identity.)*  
  - **No** → Proceed to Q3A.  

  #### **Q3A: Does karma require a permanent self?**  
  - **Yes** → **Leaf B: Impersonal Cosmic Fittingness**  
    *(Desert is cosmic balance; suffering "fits" past acts, no self needed.)*  
  - **No** → **Incoherent**  
    *(Desert demands a deserving self; rejecting it voids desert claims.)*  

  ---

  #### **Q4 (Desert does not survive): Does karma require a permanent self?**  
  - **Yes** → Proceed to Q5.  
  - **No** → **Leaf C: No-Self Causal Stream**  
    *(Karma is causality in an ownerless chain; desert is irrelevant.)*  

  ---

  #### **Q5: Is karma still useful for ethics?**  
  - **Yes** → **Leaf E: Useful Fiction**  
    *(Karma is a pragmatic narrative, not literal truth.)*  
  - **No** → **Leaf F: Hard Determinism**  
    *(Karma = causality; "desert" is a category error.)*  

  ---

  ### Position Key  
  - **A: Theistic Governance** (Ledger + divine enforcer).  
  - **B: Impersonal Cosmic Fittingness** (Weather + desert without intender/self).  
  - **C: No-Self Causal Stream** (Ecosystem + no desert + no permanent self).  
  - **D: Accretion/Social Control** (Desert is not inherent).  
  - **E: Useful Fiction** (Non-literal tool for ethics).  
  - **F: Hard Determinism** (Karma = causality; desert is incoherent).  

  ### Empty/Problematic Spots  
  - **Ledger + non-divine bookkeeper** → Collapses into **Leaf D** (social tool).  
  - **Ecosystem/Weather + desert + no-self** → **Incoherent** (desert needs a deserving entity).  
  - **Ecosystem + desert + persistent self** → **Unexplored** (no clear tradition).  

  ### Notes  
  - **Leafs E & F** appear in both *Weather* and *Ecosystem* branches but are identical in core commitments.  
  - **Q4–Q6** (deferral/testability, retributive/educative, attachment) are omitted for brevity; they refine but rarely change positions.  
  - **Testability (Q5)** is irrelevant to all positions except **E/F** (where it fails).
