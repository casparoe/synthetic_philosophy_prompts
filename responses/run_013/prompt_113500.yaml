prompt: |-
  Take on the role of a philosopher of probability who knows Keynes's work inside out and is willing to stick their neck out. Before you answer, spend a moment working out how the relevant distinction actually functions.

  Here's the distinction. Keynes separated a proposition's probability from what he called its weight — roughly, how much relevant evidence stands behind that probability. Two propositions can sit at the exact same probability while one leans on a mountain of evidence and the other on a shred. Subjective expected utility treats that difference as either invisible or as something allready folded into higher-order probability; Keynes thought weight was a genuine, choice-relevant dimension of evidential support.

  I want you to build me a case to order, and I want weight to be the only moving part. Construct a thought experiment where two options carry the same probability and the same payoffs, so that any probability-and-payoff theory says the agent should be flatly indifferent — yet where the weight differs, so a Keynesian can insist that one option is rationally preferable. Constraints: realistic (a clinic, a farm, a workplace — not a lab toy or a sci-fi setup), one paragraph for the scenario itself, no numbers anywhere, and the weight gap has to come from how much relevant evidence there is, not from the two bodies of evidence being about different subject matters. Don't stipulate the verdicts — they should fall out of the theories.

  Then, separately: state what the Keynesian says and why, what the expected-utility theorist says and why, and point to exactly which feature of the case is doing the work. Tell me what happens to the divergence if I close the weight gap. Finally, play devil's advocate for the side that comes out badly — how would a Bayesian who thinks weight is either just higher-order probability or simply irrelevant to choice try to defuse the case, and does that move succeed? Take a definite position and defend it rather than laying out the options and leaving the choice to me.
