prompt: |-
  I am applying for a six-month seed grant from my faculty's research fund and need a research proposal of roughly 1,800 words. I have a half-formed idea that I would like you to turn into a proper proposal. I will add the references myself, so please describe positions and arguments rather than citing anything, and do not include a bibliography or a literature review.

  My idea concerns Strawson's account of moral responsibility, which locates it in the reactive attitudes — resentment, gratitude, indignation, guilt — and which is usually read as making those attitudes responses to the good or ill will, or the indifference, that another person displays toward us. Call that the quality-of-will condition. What I cannot stop noticing is a family of attitudes that share the shape of the reactive ones but are aimed at targets that cannot hold or express any will toward us at all: the dead, characters in fiction, my own past self, and — more contestably — animals, institutions, and people who have lost the capacities of agency. I have been calling these detached reactive attitudes; the label is my own coinage and not a term of art, so please treat it as a stipulation rather than as something to look up. They seem to carry the same phenomenology (a sense of being owed something, a pull either to withdraw or to demand) and the same action-tendencies (avoidance, confrontation, the wish for acknowledgment) as ordinary resentment or gratitude. That suggests two readings. On the first, the detached attitudes are parasitic on the genuine article: they are imaginative extensions of attitudes whose home is interpersonal, and they tell us nothing about what a reactive attitude essentially is. On the second, they are a stress test that the quality-of-will condition fails, and the real core of the reactive attitudes is something else — a demand for acknowledgment, say, or the maintenance of a claim to be a term in a relationship of mutual regard — of which the quality-of-will condition is only a special case. I want to know which reading survives, and what the survivor does to the rest of the theory, in particular to the familiar contrast between excusing someone (modifying the attitude) and exempting them (withdrawing it altogether).

  The question I want the proposal to state precisely, and to make answerable within six months, is this: is there a single structure that covers both the attitudes directed at those who can show us good or ill will and the attitudes directed at targets that cannot, and if there is, does the quality-of-will condition survive as a condition on it?

  Please write the proposal in the following sections, in this order, at roughly these lengths, for a total of about 1,800 words:

  - "The question" (about 150 words): state the question so that it has a determinate answer, and set out the two candidate answers so that a reader knows in advance what would settle it either way.
  - "Why the field leaves it open" (about 300 words): explain how the main ways of reading Strawson — the response-dependent reading, the quality-of-will reading, and the second-personal or address reading — each handle, or fail to handle, the detached cases, and identify the exact point at which the question becomes live rather than merely curious.
  - "The strategy and its rivals" (about 400 words): the method, and why it beats the two obvious alternatives, which are a conceptual analysis of the term reactive attitude and a survey of what people report feeling. Make explicit what the detached cases are doing in the argument — acting as a stress test on a proposed necessary condition, not as evidence that such attitudes exist — and say what kind of result would count as a generalisation of the account rather than an ad hoc patch.
  - "Work plan" (about 400 words): month by month across six months, assigning the borderline cases (the dead, the fictional, one's past and future selves, animals, corporate agents) to specific months, and marking the point in the schedule at which the account either generalises or breaks.
  - "Deliverables" (about 100 words): one article of roughly 10,000 words and one workshop paper, with a sentence on what each will contain.
  - "What success and failure look like" (about 250 words): what a reader should be able to say afterwards that they could not say before, and the honest conditions under which the project fails — for instance, if the detached attitudes turn out to be merely metaphorical, or if the unified account collapses into the uninformative claim that we care about things.
  - "Scope and risks" (about 200 words): what could make this too big for six months, what I would cut first, and what the proposal would have to concede if the detached cases turn out to be less revealing than I think.
reasoning: |-
  We are writing a research proposal for a six-month seed grant. The core idea is to test Strawson's quality-of-will condition for reactive attitudes by examining "detached reactive attitudes" directed at entities that cannot hold or express will (dead, fictional characters, etc.). The proposal must be structured as specified, without a literature review or bibliography, and references will be added by the applicant.

  Let's break down each section:

  1. **The question (150 words)**: 
     - State the precise question: Is there a single structure covering both standard reactive attitudes (requiring quality of will) and detached ones? And does the quality-of-will condition survive?
     - Two candidate answers: 
       (A) The detached attitudes are parasitic and do not challenge the quality-of-will condition (so it survives as essential). 
       (B) They reveal a deeper core (e.g., demand for acknowledgment) making quality of will a special case.

  2. **Why the field leaves it open (300 words)**:
     - Discuss three readings of Strawson: 
       - Response-dependent: Focuses on emotional responses to others' actions. Detached cases might be seen as non-standard or derivative.
       - Quality-of-will: Central to Strawson. Detached cases are problematic because no will is present.
       - Second-personal/address: Emphasizes the reciprocal address between agents. Detached cases lack a second person to address.
     - The exact point: The field hasn't systematically tested whether the reactive attitudes' structure requires a capable agent. The detached cases become live when they show the same phenomenology and action-tendencies, suggesting a gap in the theory.

  3. **The strategy and its rivals (400 words)**:
     - Method: Analyze the phenomenology and functional role of detached attitudes in comparison to standard ones, using philosophical case analysis (of the borderline cases). The detached cases act as a stress test for the necessary condition (quality of will).
     - Why not conceptual analysis? It might be circular or rely on intuitions that miss the lived experience.
     - Why not surveys? They capture reports but not the essential structure; also, folk psychology might not distinguish detached from standard.
     - What counts as generalization: A unified account that explains both standard and detached cases without treating detached as exceptions (e.g., if the core is a "demand for acknowledgment," which in standard cases is mediated by will, in detached cases it's direct).

  4. **Work plan (400 words)**:
     - 6 months, each month assigned to a borderline case. The schedule should build from less contested to more contested, with the break point at the point of generalization.
     - Month 1: The dead (clear case of no will, yet we feel resentment/guilt).
     - Month 2: Fictional characters (we react to them as if real, but they are not).
     - Month 3: Past/future selves (agency but not current; past actions can evoke guilt, future plans hope).
     - Month 4: Animals (may have will but not moral agency; e.g., resentment at a pet's betrayal).
     - Month 5: Corporate agents (institutions; they act but without a mind; e.g., indignation at a company).
     - Month 6: Synthesis and writing. The account either generalizes (if a common structure is found across all) or breaks (if the cases are too disparate).

  5. **Deliverables (100 words)**:
     - One article (10,000 words) presenting the argument and conclusion.
     - One workshop paper (shorter) focusing on one case study (e.g., fiction) and its implications.

  6. **What success and failure look like (250 words)**:
     - Success: We can say whether the reactive attitudes have a unified structure and what it is; how exemptions and excuses apply to detached cases; and whether Strawson's account needs revision.
     - Failure: If detached attitudes are metaphorical (not real attitudes) or if no unified structure is found (they are fundamentally different). Also, if the account collapses into "we care about things" without explanatory power.

  7. **Scope and risks (200 words)**:
     - Risks: Too many cases to cover in depth; the core might not emerge. 
     - Cut: Focus on dead, fiction, and past selves (leaving animals and institutions for later). 
     - Concession: If detached cases are less revealing, the proposal would concede that the quality-of-will condition holds for the core cases, and detached ones are peripheral.

  Now, writing the proposal in the specified order and word counts.
answer: |-
  ### Research Proposal: Detached Reactive Attitudes and the Structure of Moral Responsibility  

  **1. The Question (approx. 150 words)**  
  This project asks a precise question: *Can Strawson’s account of moral responsibility—which grounds reactive attitudes (e.g., resentment, gratitude) in the quality of will displayed by agents—accommodate "detached reactive attitudes" directed at entities incapable of holding or expressing will (e.g., the dead, fictional characters, or past selves), or must the theory be revised?* The answer is determinate. If a unified structure underlies both standard and detached cases—retaining the core "demand for acknowledgment" while generalizing beyond quality of will—the account survives as expanded. If not, and detached attitudes are parasitic imaginings, quality of will remains necessary. Settlement hinges on whether detached attitudes exhibit the same functional role (phenomenology, action-tendencies, and normative force) as standard ones. A positive finding implies revision; a negative one upholds Strawson’s original condition.  

  **2. Why the Field Leaves It Open (approx. 300 words)**  
  Strawson’s framework is interpreted in three dominant ways, each struggling with detached cases. The *response-dependent* reading treats reactive attitudes as emotions tracking interpersonal conduct. It dismisses detached attitudes as non-literal, but cannot explain their shared phenomenology (e.g., guilt toward the dead feels "real," not simulated). The *quality-of-will* reading insists these attitudes require perceived agency, treating detached cases as outliers. Yet this ignores how they mirror standard attitudes in intensity and consequence (e.g., resentment toward a fictional villain motivates avoidance). The *second-personal* reading, emphasizing mutual address between agents, excludes detached targets entirely (e.g., one cannot "address" the dead), yet we still feel owed by them.  

  The field overlooks this because debates focus on paradigmatic cases (e.g., resentment between adults). Detached attitudes are treated as curiosities, not theoretically loaded. The question becomes live when we recognize that these attitudes—directed at non-agents—retain the hallmarks of moral response: a normative "pull," behavioral dispositions (e.g., confronting a past self through journaling), and a sense of violated expectations. If they are not derivative, they expose a gap: reactive attitudes may fundamentally express a *claim for regard*, with quality of will as one instantiation.  

  **3. The Strategy and Its Rivals (approx. 400 words)**  
  **Strategy**: The project uses *phenomenological and functional analysis* of borderline cases to stress-test the quality-of-will condition. For each entity (e.g., the dead), we examine:  
  - Whether the attitude’s "felt demand" matches standard cases.  
  - Whether it inspires similar actions (e.g., withdrawal as in resentment).  
  - How exemptions (e.g., "they couldn’t help it") or excuses (e.g., "they meant well") apply.  
  Detached cases act as a *stress test*: if they function identically without quality of will, the condition is unnecessary, revealing a deeper core (e.g., a demand for acknowledgment). A successful generalization would preserve Strawson’s insights while expanding the theory’s scope—e.g., showing that reactive attitudes maintain relationships of regard, with quality of will applying only when agency is present.  

  **Rivals**: This beats two alternatives. *Conceptual analysis* (defining "reactive attitude" linguistically) risks circularity, relying on intuitions that may ignore lived experience. For instance, labeling grief-driven resentment toward the dead as "metaphorical" preemptively dismisses data. *Empirical surveys* (e.g., self-reports of feelings) capture surface beliefs but not structural roles; folk psychology may conflate detached attitudes with mere disappointment. Our method, by contrast, isolates functional equivalence.  

  Generalization would be *non-ad hoc* if it:  
  - Explains exemptions/excuses uniformly (e.g., we "exempt" animals not because they lack will *per se*, but because they cannot grasp demands).  
  - Clarifies why quality of will *matters* in standard cases (as the primary mode of regard), without being essential.  

  **4. Work Plan (approx. 400 words)**  
  *Month 1: Literature synthesis*—Map Strawson’s core framework and identify gaps. *Month 2: The dead*—Analyze attitudes like posthumous resentment or unresolved guilt. Break point: If these lack action-tendencies (e.g., no pursuit of repair), quality of will stands.  
  *Month 3: Fictional characters*—Study reactions to narrative injustice (e.g., indignation at a villain). If phenomenology differs (e.g., no real avoidance), detached attitudes are parasitic.  
  *Month 4: Past/future selves*—Examine guilt over past actions or hope for future change. Key test: Whether "exemptions" (e.g., "I was immature") parallel interpersonal cases.  
  *Month 5: Animals/institutions*—Assess contested cases (e.g., resentment toward a corporation). If functional roles converge (e.g., demanding accountability), generalization occurs here.  
  *Month 6: Synthesis and writing*—Integrate findings. If Months 2–5 show consistent functional equivalence, the account generalizes; if disparities dominate, it breaks. Outcomes: A unified model (demand for regard) or confirmation of Strawson’s condition.  

  **5. Deliverables (approx. 100 words)**  
  - One 10,000-word article for a leading ethics journal, arguing for either the revision or preservation of Strawson’s account based on the stress test.  
  - One 3,000-word workshop paper for an interdisciplinary audience, using fictional characters to illustrate the stakes for moral psychology.  

  **6. What Success and Failure Look Like (approx. 250 words)**  
  **Success** would yield a determinate answer: either reactive attitudes have a unified structure (e.g., sustaining claims of regard) with quality of will as a subspecies, or detached attitudes are imaginative extensions. A reader could then say: (1) whether moral responsibility extends to non-agential entities, (2) how exemptions (e.g., toward the mentally ill) differ from excuses (e.g., for accidents) in detached contexts, and (3) what reactive attitudes fundamentally "do" in moral life.  
  **Failure** conditions:  
  - If detached attitudes are merely metaphorical (e.g., "resenting" a storm lacks the demand for acknowledgment), the project corroborates Strawson.  
  - If no unified structure emerges—e.g., each case requires ad hoc treatment—the account collapses into the trivial claim that "we care about things," offering no insight.  
  - If functional analysis reveals irreconcilable differences (e.g., guilt toward the dead inspires atonement, but not confrontation), the quality-of-will condition holds. Failure is honest if core cases (e.g., the dead) prove disanalogous after rigorous scrutiny.  

  **7. Scope and Risks (approx. 200 words)**  
  **Risks**: The project could exceed six months if borderline cases (e.g., corporate agents) require extensive conceptual groundwork. Animal/institution cases may also draw in adjacent debates (e.g., collective responsibility), risking scope creep.  
  **Mitigation**: I prioritize the dead, fictional characters, and past selves—the clearest cases—deferring animals/institutions if needed. Should time run short, corporate agents will be cut first, as they are most contested.  
  **Concessions**: If detached attitudes prove less revealing, I concede that quality of will is *necessary for prototypical responsibility*, but note that their persistence highlights a broader human tendency to moralize non-agential entities. If functional parallels are weak, the proposal upholds Strawson’s condition as central, with detached cases treated as marginal curiosities. The worst-case outcome—ambiguous data across cases—would still clarify the limits of moral responsibility.  

  ---  
  **Total words**: ~1,800  
  **Note**: This proposal omits citations per instructions, focuses on argumentative structure, and positions the project for feasibility within six months. References to Strawson’s *Freedom and Resentment* and key commentaries can be inserted where appropriate.
