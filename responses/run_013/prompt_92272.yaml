  ### **LEAVES: YOUR POSITION**  
  *(With "awkward thing to swallow" and scholarly status)*  

  1. **Eternal Self/Essence**  
     - *Reached if:* You answered Question 1 with strong essentialism (not shown—tree starts from your "self as process" view).  
     - **Key:** Self is an unchanging core (e.g., soul).  
     - **Awkward:** Must explain how this core interacts with changing aggregates (mind/body).  
     - **Status:** Rejected in Buddhism; live dispute in philosophy.  

  2. **Reductionist View (Convenient Fiction)**  
     - *Reached via:* Q3C, Q6A, Q10A.  
     - **Key:** Self = aggregates (body, memory, etc.). No extra "self-entity"—just a label for convenience.  
     - **Awkward:** Struggles to explain responsibility ("Why blame *me* for past actions if I’m just a label?").  
     - **Status:** Common in analytic philosophy (e.g., Derek Parfit). **Consensus:** Buddhists agree it rejects eternal self but dispute if it’s sufficient.  

  3. **Two Truths View (Conventional Self Only)**  
     - *Reached via:* Q4A, Q7A.  
     - **Key:** Self exists conventionally (for daily life) but not ultimately (under analysis). Like an API—useful abstraction, but no deeper reality.  
     - **Awkward:** Why does conventional truth *feel* so real if it’s "just" convention?  
     - **Status:** Standard in Mahayana Buddhism (Nagarjuna). **Consensus:** Core Buddhist doctrine.  

  4. **Middle View (Neither Same Nor Different)**  
     - *Reached via:* Q8A, Q9A, Q10B.  
     - **Key:** Self is real and unified, but not separate from aggregates. Like a cluster—emergent, not reducible.  
     - **Awkward:** Sounds paradoxical ("real but not independent"). Hard to articulate without contradiction.  
     - **Status:** Held by Pudgalavada school (condemned as heretical). **Consensus:** Incoherent to most Buddhists; a few modern scholars defend it.  

  5. **Pragmatic No-Self (Technique Only)**  
     - *Reached via:* Q4C.  
     - **Key:** "No-self" is a tool to reduce clinging—no metaphysics. Like calling a service "stateless" for scalability.  
     - **Awkward:** Avoids ontological commitments but can’t explain why the technique *works*.  
     - **Status:** Modern secular Buddhist view (e.g., Stephen Batchelor). **Consensus:** Disputed—traditionalists say it ignores Buddha’s deeper teachings.  

  6. **Narrative Self (Constructed Story)**  
     - *Reached via:* Q5B, Q7B/C, Q9B.  
     - **Key:** Self = story brain tells to unify experiences. Like Git history—authored by you, but not a "thing."  
     - **Awkward:** If you forget your past, does the self vanish? What rewrites the story?  
     - **Status:** Compatible with both Two Truths (**Leaf 3**) and Reductionism (**Leaf 2**). **Tree Note:** Overlaps with Leaf 3—distinction is emphasis (narrative vs. convention).  

  7. **Stream-Only View (Continuity Without Bearer)**  
     - *Reached via:* Q4B, Q5A, Q8B.  
     - **Key:** No self, only causal stream (karma/events). Like a message queue—events persist, no "owner."  
     - **Awkward:** How does karma bind experiences without a subject?  
     - **Status:** Theravada Buddhist orthodoxy. **Consensus:** Core to early Buddhism; philosophers debate if it differs from Reductionism.  

