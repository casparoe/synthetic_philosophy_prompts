prompt: |-
  I'm applying for a small grant for a one-semester dissertation chapter in philosophy of mind and need a two-page proposal out of a half formed idea. Here's the idea: arguments about which systems are concious -- dogs, bees, octopuses, an ant colony, a chatbot -- keep sliding between three demands that get treated as if they were one. (1) Intersubjective agreement: any competent human ascribes the state the same way. (2) What I'm calling ascription universality: the state is the sort of thing that any interpreter whatsoever could ascribe, whatever its own makeup, so the ascription can't require the interpreter to share the subject's perceptual or conceptual capacities. (3) Epistemic dominance: one framework can ascribe everything any rival framework can ascribe and more, so the rivals become dispensable. My suspicion is that alot of theories of consciousness buy one of these and then quietly claim another -- that behaviorism is universal but wrong, that higher-order theories get dominance but not universality, that biological naturalism buys universality only by smuggling in the interpreter's own biology. Turn this into the proposal: state the question so that it has a determinate answer, say why the existing positions leave it open instead of settling it, say what I would actually do across the semester and why that's the right method rather than just running more empirical tests, describe what a result would look like and what would count as the project failing, and give me an honest scope check -- if it's too big for one chapter, tell me which single piece to keep. Skip citations and reading lists, I'll add those myself. American English please.
