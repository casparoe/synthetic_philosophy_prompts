prompt: |-
  I am running the opening session of a doctoral proseminar on the epistemology and ethics of AI, for students trained in machine learning and engineering rather than in philosophy. Most of them have met the trolley problem and the Chinese Room second-hand, and they arrive with two reflexes that pull in opposite directions: that philosophical cases are unrealistic and so cannot tell us anything about the world, and that their own favoured scenarios -- the model that merely predicts, the optimiser that merely maximises -- are neutral descriptions of how things stand rather than cases with a point of view. I have ninety minutes and a whiteboard. I do not want to give them a survey of the literature on thought experiments. I want them to leave able to tell when a case is doing argumentative work and when it is doing rhetorical work, and to say which is which without either gullibility or cynicism.

  The one idea I want to land is this: a thought experiment's persuasive force and its argumentative force are separable, and the gap between them is diagnosable rather than a matter of taste.

  Plan the session for me; do not deliver it.

  1. The order in which the components must come, and why each depends on the one before it. In particular: what has to be in place before the notion of an intuition pump can be introduced at all without sounding like an accusation?

  2. The one case that should carry the whole session. Say what it must have and what it must lack. My constraint on it: within the hour, the same case, re-described, must flip the room's verdict, and the flip must not be attributable to the re-description being more realistic. Tell me why the obvious candidates -- the trolley, the Chinese Room, Mary's room -- are the wrong carriers for this room, or, if one of them is right, why.

  3. The misconceptions this audience will bring or form, in the order they will surface, and the exact point in the sequence at which each should be headed off. I expect at least these: that a case which could not happen shows nothing; that thought experiments are empirical claims in disguise; that an intuition which changes when a detail changes has thereby been refuted; and that calling a case an intuition pump is a refutation of its conclusion.

  4. I have a three-question test I want the session to culminate in, and I would rather they derive it than receive it. (i) What verdict does the case invite, and what is that verdict being used as evidence for? (ii) Which details are producing the verdict, and does the argument need those details or only the verdict? (iii) Does the inference from the verdict to the conclusion run through a principle the room would accept independently of this case? Plan the arc so that the test arrives as a summary of what they have already done, not as a handout.

  5. The check I can run in the final ten minutes that would show the idea has landed rather than merely been admired.

  6. What to leave out at this level, and how to say so without making it sound like a promise of later revelation.
reasoning: |-
  Hmm, the user is designing an opening session for a doctoral proseminar on AI epistemology and ethics, targeting students with ML/engineering backgrounds. They're facing a specific pedagogical challenge: students dismiss philosophical thought experiments as unrealistic while treating their own technical scenarios as neutral. The core goal is to teach students to distinguish argumentative from rhetorical use of cases, focusing on the gap between persuasive and argumentative force.

  The user has several concrete requirements: a structured session plan with logical dependencies, one central case study that can flip verdicts through re-description (not trolley/Chinese Room/Mary), handling predictable misconceptions in sequence, deriving a three-question test organically, and an assessment check. They also want guidance on intentional omissions.

  Key insights about the audience: engineering students often conflate physical realizability with relevance, mistake normative claims for empirical ones, and treat their own models as "view from nowhere" while critiquing philosophical cases. The chosen case must therefore be simple, non-AI-related, and capable of generating conflicting intuitions through strategic re-description.

  For the core case, I'm considering a modified "Ship of Theseus" - it's accessible, lacks technical baggage, and allows clean flipping between identity and functionalist intuitions. The re-descriptions would shift focus from material continuity to purpose continuity without adding realism, precisely demonstrating how framing drives verdicts.

  The session should unfold in five phases: first deconstructing a student's "neutral" model scenario to reveal its perspective; then introducing the core case with initial verdict; flipping the verdict through re-description; generalizing to the persuasion/argument gap; and finally deriving the three-question test from their own analysis.

  Misconceptions will surface predictably: after initial case presentation (unrealistic = irrelevant), after verdict flip (changing details invalidates), and during generalization (intuition pump as refutation). Each requires targeted interventions: emphasizing what the case isolates, showing detail-sensitivity as feature not bug, and distinguishing tool criticism from conclusion criticism.

  The three-question test should emerge naturally: Q1 when comparing initial/final verdicts, Q2 during detail analysis in flip phase, Q3 when examining why the flip didn't feel like cheating. The final check involves applying the test to their own AI scenario - if they spontaneously spot its framing, the core idea has landed.

  Crucial omissions include: most classic thought experiments (reference only), comprehensive philosophy survey (focus on analytical tool), and ethics debates (postpone for methodology). This should be framed not as withholding but as sharpening focus - "we're building X-ray vision first, diagnosis later."
answer: |-
  Here’s a structured 90-minute plan targeting your goals, centered on a carefully chosen case study, with misconceptions preempted and your three-question test derived organically. The arc prioritizes experiential learning over lecture.

  **Core Logic:** Students must *feel* the flip in verdicts before analyzing why it happened. This prevents premature cynicism and grounds abstract concepts in lived confusion. The chosen case must be **simple, non-AI, and emotionally neutral** to avoid triggering disciplinary defenses.

  ### The Case: "The Library of Alexandria Backup" (Tailored Version)
  *   **Version A (Initial):** *"Imagine a perfect, atom-by-atom digital backup of the Library of Alexandria exists on a server. A catastrophic event destroys the original library and the server simultaneously. Later, using the backup data and advanced molecular printers, an exact physical replica is rebuilt in the original location, using new matter. Is this the Library of Alexandria?"*
  *   **Version B (Flipped):** *"Imagine the Library of Alexandria meticulously digitized every scroll. One day, a fire destroys the physical building and its servers. Generations later, scholars rebuild the library using the *same architectural plans* and *repopulate it* with painstakingly recreated copies of the texts based on surviving fragments and the known catalog. Is this the Library of Alexandria?"*

  **Why this case? Why NOT the obvious ones?**
  *   **Avoids AI/CS Baggage:** Trolley problem is moral/emotional; Chinese Room is directly about AI/computation; Mary's Room is about qualia/consciousness. These trigger pre-existing debates and defenses. The Library case is about *identity/persistence* – unfamiliar enough to be approached freshly.
  *   **Clean Flip Mechanism:** The flip depends **solely on shifting the *salient criterion* for identity** (physical continuity vs. information/functional continuity) without adding "realism" (both involve reconstruction). The *details changed* directly challenge what counts as "the same thing."
  *   **Emotionally Neutral:** Lacks visceral weight (unlike trolley), avoiding moral outrage clouding analysis.
  *   **Universally Understandable:** Everyone grasps the idea of a library and its value lying in its content/role.

  ### The 90-Minute Plan

  **Phase 1: Undermining "Neutrality" (15 min)**
  *   **(5 min) Warm-up:** "Give me an example of a 'neutral' AI scenario you work with or think is fundamental." (E.g., "A model predicting recidivism," "An RL agent maximizing game score.")
  *   **(10 min) Deconstructing "Neutral":** *Whiteboard the scenario.* Ask: "What is *selected* to be input? What is *defined* as the output? What *metric* is chosen for optimization? What *data* is it trained on? What *constraints* are assumed?" Emphasize: "Each choice reflects a *priority*, an *assumption* about what matters. There is no 'view from nowhere.' This scenario has a *point of view* baked in – it *isolates specific aspects* of reality to focus on." **Goal:** Land the idea that *all* scenarios, including technical ones, are constructed frames.

  **Phase 2: Introducing the Core Case & First Verdict (15 min)**
  *   **(5 min) Present Version A (Digital Backup):** Read it clearly. **Poll:** "Raise hand if YES (it's the same Library), NO (it's not), or UNSURE." Record counts.
  *   **(10 min) Elicit Reasons:** "Why YES?" (Likely: "Same information/structure.") "Why NO?" (Likely: "Not the original atoms/history destroyed.") *Whiteboard key reasons under YES/NO.* **Crucial:** Do NOT engage in debate yet. Just map the intuitions. **Preempt Misconception 1 (Unrealistic = Useless):** *Before it surfaces*, ask: "Could this *exact* scenario happen tomorrow with current tech? Probably not. So, is it useless? *What question is it trying to isolate* that *might* be relevant, even if the setup is idealized?" (Guide towards: "What makes something the *same* persistent entity over time/change?"). Land: "Its power is in *isolating a specific conceptual question*."

  **Phase 3: The Flip & Diagnosing the Gap (25 min)**
  *   **(5 min) Present Version B (Plans & Recreation):** Read it clearly. **Poll again.** *The room will flip towards NO (it's a replica, not the original).* Show the shift dramatically. Induce productive confusion.
  *   **(10 min) Contrast & Analyze:** "What changed? Not the 'realism' – both involve destruction and recreation. *What specific details changed?*" (Guide: Backup vs. Plans/Fragments; Atomic Replica vs. Reconstruction; Digital vs. Analog Process). "How did changing *these specific details* change your *intuition* about what counts as 'the same library'?" *Whiteboard the changed details and link them to shifted criteria* (Version A highlights information; Version B highlights material origin/continuity).
  *   **(10 min) Introducing "Intuition Pump" (Safely):** "This case *pumped* different intuitions by highlighting different aspects. That's what thought experiments *do* – they *prime* us to focus on X or Y. **The key question isn't 'Did it pump an intuition?' (it did!), but 'Is the intuition it pumped *doing argumentative work* for a specific claim, or is it *just* persuasion?'** Let's diagnose the gap." **Preempt Misconception 2 (Empirical Claim):** "Is either version making a claim about how often libraries burn? No. It's asking a *conceptual* question about *identity conditions*." **Preempt Misconception 3 (Changed Detail = Refuted):** "Did changing details *refute* your first intuition? Or did it show that your intuition is *sensitive* to *what aspect you focus on*? The *question* (what is identity?) remains; the case shows it's complex and context-dependent."

  **Phase 4: Deriving the Three-Question Test (25 min)**
  *   **(5 min) Recap & Frame:** "We used a case. It pumped intuitions. We saw the persuasive force shift dramatically. We diagnosed *why* (changed details shifted focus). Now, how do we rigorously evaluate if its *argument* is good, separate from its *persuasive punch*?"
  *   **(15 min) Build the Test Through Q&A (Using the Library Case):**
      1.  **"What verdict did Version A invite? (YES). What might someone use that YES verdict as *evidence for*?"** (Guide: "That identity depends on information/structure, not matter/history.") **→ Land Q1:** *What verdict does the case invite, and what is that verdict being used as evidence for?*
      2.  **"Which *details* in Version A *produced* that YES verdict?"** (e.g., "atom-by-atom backup," "exact replica"). **"Does the *claim* 'Identity depends on information' *need* those specific details? Or just the *general idea* that information was preserved?"** (Guide: The *principle* only needs preservation of form/info; the atom-by-atom detail just makes the "perfect preservation" vivid/undeniable). **→ Land Q2:** *Which details are producing the verdict, and does the argument need those details or only the verdict?*
      3.  **"In Version A, does inferring 'Identity depends on information' *require* accepting a principle like 'If information is perfectly preserved, identity is preserved'? *Would you accept that principle based on other examples*? (e.g., Is a PDF of *Moby Dick* the same novel as the physical book?) What about Version B's NO verdict?"** (Links to principle: "Identity requires material continuity/history"). **→ Land Q3:** *Does the inference from the verdict to the conclusion run through a principle the room would accept independently of this case?*
  *   **(5 min) Formalize & Name:** "So, to separate persuasive force from argumentative force, we ask these three questions. Let's call it the **Case Diagnosis Test**." *Write the 3 Qs clearly on the board.*

  **Phase 5: Check & Consolidation (10 min)**
  *   **(7 min) Apply Test to Their Own "Neutral" Scenario:** "Pick *one* 'neutral' AI scenario mentioned earlier (e.g., 'model predicting recidivism'). Apply the 3-question test to it *as if it were a thought experiment presented to make a point*.
      1.  What verdict/intuition does it invite? (e.g., "Prediction is objective/neutral"). What could that be evidence *for*? (e.g., "AI is just math, unbiased").
      2.  What *details* produce that? (e.g., "labeled historical data," "accuracy metric"). Does the argument *need* those details, or just the verdict? (The argument *needs* the framing of data as "given" and metric as "objective").
      3.  What principle links verdict to conclusion? (e.g., "Mathematical processes using given data are neutral"). Would we accept this independently? (Discuss biases in data, choice of metric).
  *   **(3 min) Wrap-up:** "The gap between persuasion and argument is *diagnosable*. You now have the scalpel. Use the test. Next time: We apply this to Trolleys, Chinese Rooms, and *your* research proposals." **Preempt Misconception 4 (Intuition Pump = Refutation):** "Calling something an 'intuition pump' isn't a refutation – it's step one. The *test* tells you if it's *also* a good argument."

  **What to Leave Out & How to Say It:**
  *   **Deep Dives into Specific Philosophers/History:** "We're focusing on the *tool* for *analyzing* cases, not surveying the history of using them. Master the scalpel first; we'll examine famous surgeries later."
  *   **Comprehensive Ethics/Epistemology Theory:** "This session is about *how* cases work argumentatively. We'll build the ethical/epistemic frameworks *using* this tool in subsequent weeks."
  *   **Resolving the Library Case:** "We're not here to *solve* what makes a library the same library today. We're here to see *how a case manipulates our thinking* about such questions. The unresolved tension *is the point*."
  *   **Other Famous Thought Experiments (as primary focus):** "Trolleys, Chinese Rooms – they're important, but they come with baggage. We used a cleaner case to build the fundamental skill. Next time, we deploy this skill on those heavier hitters."

  **Why This Works:**
  1.  **Dependency Flow:** Neutrality deconstruction (Phase 1) is essential pre-work to make students receptive to analyzing *any* case (including philosophical ones) without immediate dismissal. Experiencing the flip (Phase 3) *before* analysis makes the persuasion/argument gap visceral and undeniable, creating the need for the test (Phase 4). Introducing "intuition pump" *after* the flip (and framing it as a normal function) prevents it sounding like an accusation.
  2.  **The Flip:** The Library case flips cleanly by changing the *salient criterion* (info vs. matter/history) using equally plausible, non-realistic details. The flip isn't about realism; it's about *what we value in identity*. Trolley flips often rely on emotional manipulation or adding realism (e.g., "What if it's your child?"); Chinese Room/Mary's Room flips are less dramatic and more entrenched.
  3.  **Misconceptions Preempted:**
      *   *Unrealistic = Useless:* Addressed proactively when introducing Version A.
      *   *Empirical Claim:* Addressed during the flip analysis (Phase 3).
      *   *Changed Detail Refutes Intuition:* Addressed explicitly during the flip analysis, reframing sensitivity as insight.
      *   *Intuition Pump = Refutation:* Addressed during test formalization (Phase 4) and wrap-up.
  4.  **Deriving the Test:** The test emerges organically from the steps the class *just took* to understand the Library case flip. Each question directly corresponds to a phase of their analysis: Q1 (identifying the point - Phase 2/3), Q2 (diagnosing persuasive details - Phase 3), Q3 (evaluating the underlying principle - implicit in Phase 3 contrast, made explicit in Phase 4).
  5.  **Check for Landing:** Applying the test *themselves* to their *own* "neutral" scenario in the final check is crucial. If they can articulate how their own example invites a verdict, what details drive it, and question the underlying principle, the core idea has landed. Admiration would sound like "That Library case was cool"; landing sounds like "Wait, our training data setup totally primes us to think the bias is just in the labels...".
  6.  **Omissions Handled:** Framing omissions as "focusing on the foundational tool first" and explicitly stating what *will* come later ("next time...") manages expectations without implying mystery. It positions this session as essential groundwork.
