answer: |-
  ## Opening Address: Municipal Citizens' Assembly - First Sitting

  **(Address delivered calmly, directly, without flourish. Aim: Clarity, not inspiration.)**

  Good morning. My name is [Your Name]. I will chair this Citizens’ Assembly on Ward Boundaries.

  We are here because the previous ward map was drawn unfairly. It was drawn by people who stood to gain or lose power by its lines. This created a scandal. It broke trust. Because of that broken trust, the City Council has handed the task of drawing a new, fair map to you.

  How did you get here? Your names were drawn by lot from the electoral register. One hundred and twenty residents. Randomly selected. Like being called for jury duty. That is the key point we must understand today – the *why* of the lot.

  For generations, we’ve mostly thought about public office, about having a say in how we are governed, as a prize. Something to be campaigned for, fought over, won or lost. Like a trophy. The winners get the power. The losers step aside. This Assembly operates on a different understanding. A simpler, perhaps older, one.

  **Public office – having a hand in difficult decisions that affect everyone – is fundamentally a burden.** It is work. It is responsibility. It is time taken from your lives, your jobs, your families. It is the weight of getting it right for others, not just yourself. Like shovelling snow off a communal path, or serving on a jury, or taking your turn on the neighbourhood watch. It is a duty that belongs to all of us, collectively. And because it belongs to all of us, the *fair* way to assign such a duty, when not everyone can do it at once, is to share it out. To distribute the burden.

  **The lot is the tool we use for that distribution.** It is a fairness machine. It ensures everyone has an equal *chance* to be called upon to bear this particular burden, just as everyone has an equal stake in its outcome. The lot doesn’t pick you because you are special, or wise, or generous. It picks you because the burden needed distributing, and your name came up. That is all. It is not a compliment. It is not an honour bestowed. It is an assignment.

  Because this is a burden, and because burdens can be heavy, **part of the fairness is the right to say 'no'.** Life is complex. A night shift clashes with meeting times. A taxi driver’s income depends on being on the road. A parent is stretched thin. Someone is caring for a sick relative. Or perhaps, quite simply, you feel this isn’t your time, or your task. **That is perfectly acceptable. It is not a failure. It is not a lack of civic spirit. It is a recognition of the weight of the duty and your own circumstances.** If you feel you cannot carry this burden, after hearing what it entails, you may step aside. We will draw another name. That is how the fairness machine works – it allows for the reality of people’s lives. There will be no judgment, only the quiet administration of the lot. See a staff member during the break if this is your decision. The system expects it.

  Look around you. You are a snapshot of this city. Different jobs, different backgrounds, different experiences, different views. That is the point. The burden of deciding these boundaries must not fall only to those who seek power, or who have the time or resources to campaign for it. It must fall, by chance, to a group that reflects the whole. Your diversity of perspective *is* the resource. Your common task, the map, is the burden.

  **(Turning slightly towards the Councillors at the back)**

  I see the elected Councillors are with us. Their presence is welcome. Their knowledge of the city and its neighbourhoods will be vital. But I also see expressions. Skepticism, perhaps. Disappointment. Maybe even frustration. That, too, is part of the fairness story we are telling today.

  Councillors, you sought your offices. You campaigned. You won the prize. And now, the drawing of the very boundaries that shape your political futures has been taken from you and given to people who did *not* seek it. This might feel strange. Uncomfortable. It might even feel unfair *to you*. But understand this: **Your absence from *these* seats, the seats of the map-drawers, is not a mark against you. It is the system working as intended.** The scandal happened precisely because the prize-winners were drawing the map of the prize. The lot distributes the burden of restoring fairness precisely to prevent that conflict. Your disappointment is, in a way, proof that the burden is real and that distributing it randomly is a necessary check. Your role now is to support this process, provide your insights when asked, and respect the burden this Assembly carries on behalf of the whole city.

  You, the members, have a monumental task ahead. For the next six months, you will learn about demography, geography, communities of interest, legal requirements. You will hear from experts. You will deliberate. You will argue. You will compromise. You will draw lines that will shape this city for a decade. It *is* a burden. It requires diligence, patience, and a commitment to fairness above all else. The staff behind me, and I, as your chair, are here to facilitate that work. To provide information. To manage the process. To ensure everyone is heard.

  But here is something crucial we must acknowledge plainly, right from the start: **While the lot randomly selected *who* deliberates, it did not randomise *what* you deliberate about, *when* you deliberate, or *whose* expertise you hear.**

  You didn’t choose the scope of your task – it was set by the Council’s mandate. You didn’t set this timetable – staff did. You didn’t choose which experts will brief you – staff compiled the initial lists. **Your independence as an assembly is most fragile precisely at the point where it looks most secure: in the framing of the questions, the control of information, and the flow of the process.** We, the staff and I, hold significant power in shaping the landscape you will navigate. We have a duty to be scrupulously neutral, to present balanced information, and to structure discussions fairly. But the *potential* for influence, however unintentional, exists simply because we control the machinery of the assembly.

  This isn't said to alarm you, but to arm you. Forewarned is forearmed. You must be vigilant. Question the materials. Question the timetable. Question why certain experts are put before you and not others. Demand clarity on how topics are framed.

  To put power directly into your hands, right now, to counterbalance this inherent fragility, **I am granting this Assembly one concrete right, effective immediately: the power to veto any proposed expert witness.**

  The staff will propose lists of experts on various topics – demographers, urban planners, community historians, legal advisors. We will propose who speaks and when. But for any expert proposed, if a simple majority of you vote against hearing that specific person, that veto stands. No explanation required to us. We will find another qualified expert on that topic. This is your safeguard against information you collectively deem unbalanced, irrelevant, or untrustworthy. It puts a lever in your hands. Use it if you feel the need. It is your right.

  So, we begin. The burden is distributed. The fairness machine is running. The work is hard, the responsibility heavy. You are not here because you are special. You are here because your city needed someone to bear this burden, and the lot fell to you. Do the work. Question everything, including us. Be fair. Be diligent. Remember the lines you draw affect real lives and real communities. Remember why you are here: because the prize system failed, and the burden must be shared.

  Let’s get started. The first briefing begins in ten minutes. Staff are available now if you wish to discuss stepping aside. For those staying, please find your table assignments.
