prompt: |-
  My friend clerks for a judge on our state court of appeals and keeps complaining that she cant tell what the judge's interpretive method actually is. The statute in question is our state's mobile vending act. It defines "school" as "a public or private institution providing instruction to students in grades K through 12." It defines "cart" as "a wheeled conveyance with not more than 100 square feet of floor area." And its purpose section says the act exists "to protect children walking to and from school" and "to keep sidewalks passable." Three rulings so far: (1) a taco guy with a 110-square-foot trailer applied for a cart permit; she held he doesn't qualify, a 110-foot trailer is simply not a cart under the definition, no matter how much easier that would of made his life. (2) The act requires vendors to leave "a clear path" on the sidewalk and never says how wide; she held it means five feet, on the ground that the whole point is that people can get past. (3) The act requires a "commissary," defined as a state-licensed food prep facility; a vendor prepped in a church kitchen the state has licensed, and she said that satisfies it, licensed is licensed.

  New case: a standalone early-learning center, ages three to five, licensed by the state as a child care center and not as a school, sits on the corner where a vendor wants to park, within 100 feet of the door the little kids use. The health department's FAQ says the buffer covers child care centers; the vendor's lawyer says the definition says K through 12 and a preschool is not a school.

  What does she do? Which rule is she actually running, which other rules fit her three rulings just as well, what's your best guess and why, and what case would tell those rules apart? And if her three rulings genuinely don't decide it, tell me what principle she'd be signing onto either way.
reasoning: |-
  Okay, let me approach this step by step. The user presents a complex legal scenario involving statutory interpretation in a state appeals court context. The core issue is determining the judge's interpretive methodology based on three prior rulings and predicting how she might rule in a new preschool case.

  First, I need to carefully analyze the three existing rulings to identify patterns. In Case 1, the judge strictly applied the statutory definition of "cart" (100 sq ft maximum) despite practical consequences. In Case 2, she interpreted the ambiguous "clear path" requirement by referencing the statute's purpose (keeping sidewalks passable). In Case 3, she accepted a licensed church kitchen as a "commissary" based solely on the licensing requirement without additional conditions.

  These rulings suggest a methodological hierarchy: precise definitions control when unambiguous (Case 1), but purpose guides interpretation when language is vague (Case 2), while meeting explicit statutory criteria suffices regardless of unconventional circumstances (Case 3). This points to textualism with purpose-based gap-filling - essentially a modified textualist approach.

  For the new preschool case, the conflict arises between the strict "K-12" definition and the health department's broader interpretation covering childcare centers. Following the pattern, I'd expect the judge to prioritize the precise statutory definition over agency guidance, since the definition is unambiguous. This would likely exclude the preschool from the buffer zone despite policy arguments.

  The key distinguishing principle appears to be threshold ambiguity: when statutory language is clear (as with "K-12"), she won't consult purpose or external sources; only when language is vague (like "clear path") does she turn to purpose. This explains why Case 2 differed from Cases 1 and 3.

  If the rulings genuinely don't decide it, upholding the preschool exclusion would endorse strict textualism, while including it would embrace purposivism. The case might turn on whether "K-12" is considered sufficiently unambiguous - a close call given that preschools are educational institutions even if not formally "schools" in that jurisdiction.
answer: |-
  Based on the judge's prior rulings, her interpretive method appears to be **Modified Textualism with Purpose-Based Gap Filling**, prioritizing the plain meaning of statutory text *unless* the language is ambiguous *or* a specific term requires operationalization, in which case she uses the statute's stated purpose to resolve the ambiguity. However, she strictly enforces clear textual limits even when inconvenient.

  **Analysis of Prior Rulings:**
  1.  **Case 1 (110 sq ft Trailer):** Strict textualism. The definition of "cart" had a clear numerical limit ("not more than 100 square feet"). 110 > 100. Result: No permit. Purpose/convenience irrelevant. (**Rule: Clear, unambiguous textual definitions control absolutely.**)
  2.  **Case 2 ("Clear Path" Width):** Purpose-driven interpretation. The text ("clear path") was inherently ambiguous regarding width. She resolved the ambiguity by referencing the statute's core purpose ("to keep sidewalks passable"). Result: 5 feet. (**Rule: When text is ambiguous, the statute's stated purpose provides the operative meaning.**)
  3.  **Case 3 (Church Kitchen Commissary):** Textual compliance. The definition of "commissary" had one explicit requirement: "state-licensed food prep facility." The church kitchen met that requirement. Result: It qualifies. She didn't impose additional, unstated requirements (e.g., commercial zoning, dedicated use). (**Rule: If a definition sets specific, objective criteria, meeting those criteria satisfies the definition, regardless of other contextual factors.**)

  **Best Guess for the Preschool Case:** **She rules that the preschool is NOT a "school" under the Act.** The vendor wins; no buffer applies.

  *   **Why?** The key rule from Case 1 applies most directly: **Clear, unambiguous textual definitions control absolutely.**
      *   The statute explicitly defines "school" as "a public or private institution providing instruction to students in grades K through 12."
      *   A preschool serving ages 3-5 unambiguously does *not* provide instruction to students in grades K through 12. K typically starts at age 5-6. "Grades K through 12" is a specific, well-understood educational category.
      *   The facility is licensed as a "child care center," not a school, reinforcing the distinction within the state's own regulatory framework.
  *   **Why not use Purpose (Protecting Children)?** Cases 1 and 3 show she *won't* override clear text with purpose. Only Case 2 used purpose because the text *itself* ("clear path") was vague. Here, the text defining the *trigger* for the protection ("school") is precise and unambiguous. Applying the buffer here would be legislating, not interpreting.
  *   **Why ignore the Health Dept FAQ?** The FAQ is interpretive guidance, not law. Her rulings show fidelity to the enacted statutory text over administrative interpretation, especially when the text is clear (Case 1). Case 3 focused solely on the text ("licensed") and ignored potential contextual arguments against a church kitchen.

  **Rules Her Rulings Fit Just As Well (But Why This One is Better):**

  1.  **Pure Textualism:** Fits Cases 1 and 3 perfectly. Doesn't perfectly fit Case 2 – pure textualism might have demanded a more literal (and potentially unworkable) interpretation of "clear path" or declared it void for vagueness rather than imposing a specific measurement based on purpose.
  2.  **Purposeivism (Protecting Kids/Passable Sidewalks):** Fits Case 2 perfectly and could *explain* the outcomes in 1 (keeping paths passable) and 3 (protecting kids via licensed prep). However, it doesn't fit her *reasoning* in Cases 1 and 3. In Case 1, she didn't mention purpose; she cited the definition. In Case 3, she didn't say "this protects kids"; she said "licensed is licensed." Her refusal to bend the 100 sq ft rule for convenience strongly argues against pure purposivism.
  3.  **"Meeting the Textual Criteria" Approach:** Fits Cases 1 (didn't meet 100 sq ft) and 3 (met licensing requirement) perfectly. Case 2 is the outlier, requiring purpose to give meaning to an operational term lacking criteria. The preschool case is like Cases 1 & 3: Does it meet the textual criteria? "Grades K-12"? No.

  **Why "Modified Textualism with Purpose-Based Gap Filling" is the Best Fit:** It explains *all three* rulings:
  *   **Clear Text Controls:** Enforced rigidly in Case 1 (100 sq ft) and Case 3 (licensed=licensed). **Preschool case fits here.**
  *   **Ambiguous Text Resolved by Purpose:** Used in Case 2 ("clear path" -> 5ft via "passable" purpose). The preschool definition isn't ambiguous.

  **Case That Would Tell These Rules Apart:** A case where the **text is arguably clear but applying it literally seems to *contradict* the statute's core purpose in a specific context.** Would she:
      *   **(Textualism):** Apply the clear text despite the apparent conflict with purpose? (Like she did in Case 1 - text over convenience/potential purpose).
      *   **(Purposivism):** Adjust the textual meaning to avoid frustrating the core purpose?
      *   **(Her Likely Approach):** Only look to purpose if the text is *ambiguous on its face*. If the text is clear, even if it leads to a seemingly purposeless result in *this* instance, she applies it literally.

  **If Her Rulings Genuinely Don't Decide It (Though They Strongly Suggest They Do):**

  *   **Ruling FOR the Preschool Buffer (Vendor Loses):** She would be signing onto **Purposivism**. The principle: "Where the statutory purpose clearly encompasses a situation functionally identical to the defined term, the purpose controls even if the specific definition doesn't literally cover it." (Protecting kids near preschools is the *same* goal as protecting kids near K-12 schools).
  *   **Ruling AGAINST the Preschool Buffer (Vendor Wins):** She would be signing onto **Strict Textualism**. The principle: "A statutory definition creates a bright-line rule. If an entity falls outside the explicit definition, it falls outside the statute's application, regardless of functional similarity or policy arguments."

  **Conclusion:** Based on her strong adherence to clear definitions in Cases 1 and 3, and her use of purpose *only* when faced with operational ambiguity in Case 2, the best prediction is that the judge will rule the preschool **is not** a "school" under the Act. The definition is clear and unambiguous: "grades K through 12" does not encompass preschool. The Health Dept FAQ and arguments about protecting young children are policy considerations she is likely to view as beyond her interpretive role when the text provides a clear answer. She applies the law as written, even if it seems to leave a gap related to preschools.
