  ---  
  **Notes on Evidence**:  
  - **Bronze Age**: Palatial collapse (c. 1200 BCE) was multicausal (earthquakes, drought, migration). Rural settlements persisted, but writing/trade networks dissolved.  
  - **Maya**: Southern lowland abandonment correlates with megadroughts and warfare, but northern cities and peasant communities adapted.  
  - **Rapa Nui**: Pre-contact society adapted to deforestation (e.g., rock gardens); collapse narratives often overstate ecological recklessness.  

  *Final Verdict*: "Collapse" is palatial; "transformation" is often populist. Elite structures fragmented, but human resilience persisted through local recalibration.
