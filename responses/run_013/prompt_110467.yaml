answer: |-
  Below is the specification for a general account of strategy-stealing arguments in games, structured as a list of requirements. Each requirement is grounded in specific cases or conceptual distinctions, with clarity on non-negotiable vs. negotiable aspects, potential conflicts, and settled vs. contested statuses. This list is designed to be a decision procedure: for an unfamiliar game, verify all non-negotiable requirements to determine if the argument applies and what it licenses (e.g., "first player does not lose").

  ### **Requirements for a Strategy-Stealing Account**
  **Non-negotiable requirements** are essential for the argument to hold; failure on any invalidates the application. **Negotiable requirements** reflect common presentations or preferences but are not fundamental; they may vary without undermining the core. Motivating cases and distinctions are included with each.

  1. **Symmetric Game (Non-negotiable)**  
     - **Specification**: The game must be symmetric under player swap, meaning both players have identical move options from any position (move symmetry) and identical winning/drawing objectives (objective symmetry).  
     - **Motivation**: Required to "imitate" the second player's strategy after the first player's initial move.  
     - **Case**: Builder and Spoiler (Case 4) fails due to asymmetric objectives (one wins on a row, the other wins on a draw).  
     - **Distinction**: Move symmetry alone is insufficient; objective symmetry is essential (e.g., misère games may have move symmetry but altered objectives).  
     - **Settled**: Theorem with explicit hypotheses (folklore in combinatorial game theory).

  2. **Finiteness (Non-negotiable)**  
     - **Specification**: Every play must terminate after finitely many moves (no infinite sequences).  
     - **Motivation**: Ensures the game is determined (via Zermelo's theorem), so "second player has a winning strategy" is a valid assumption.  
     - **Case**: Strip with infinite play (Case 5 variant) fails; infinite play scored as a draw violates termination.  
     - **Distinction**: Finite vs. unbounded/infinite games; the argument relies on termination for contradiction.  
     - **Settled**: Theorem (finiteness implies determinacy).

  3. **Extra-Move Property (Non-negotiable)**  
     - **Specification**: Adding a player's own stone to any empty square must never worsen their outcome (if they could guarantee outcome O—win, draw, or at least "not lose"—without the stone, they can still guarantee O with it).  
     - **Motivation**: When imitation requires an arbitrary move (due to an occupied square), this property ensures no harm.  
     - **Case**: Overline (Case 3) fails because creating four-in-a-row loses, so an extra stone can hurt. Strip (Case 1) satisfies it.  
     - **Distinction**: "Never hurts" means no outcome degradation, not that it always helps. Must be player-specific (ownership required).  
     - **Settled**: Theorem (relies on game-specific state transitions; verified per game).

  4. **Ownership of Moves (Non-negotiable)**  
     - **Specification**: Moves must produce player-owned resources (e.g., stones with ownership), distinct from neutral elements.  
     - **Motivation**: Defines "extra stone of one's own" for the extra-move property.  
     - **Case**: Single stone (Case 2) fails—stones are neutral (no ownership), so extra-move property is undefined.  
     - **Distinction**: Placement games (e.g., Hex) satisfy this; removal games (e.g., Case 2) do not.  
     - **Settled**: Terminological choice (implicit in strategy-stealing literature).

  5. **First Player Has an Initial Move (Non-negotiable)**  
     - **Specification**: At the start, the first player must have at least one legal move.  
     - **Motivation**: The argument begins with the first player making an "arbitrary move"; no move means no strategy-stealing.  
     - **Case**: A game with no initial move would trivially lose, but such games are excluded by design.  
     - **Settled**: Folklore (trivial precondition).

  6. **Non-Constructivity (Negotiable)**  
     - **Specification**: The argument does not produce an explicit strategy; it non-constructively assumes the existence of a winning strategy for contradiction.  
     - **Motivation**: Core to the seminar's focus on non-constructive proofs. However, constructive variants (e.g., explicit pairing strategies) are sometimes called "strategy-stealing," so this is a preference for the non-constructive version.  
     - **Case**: In Strip (Case 1), the argument shows existence without a strategy.  
     - **Distinction**: Non-constructive vs. constructive existence; the account must explain non-constructivity but need not enforce it.  
     - **Contested**: Terminological choice (some broaden "strategy-stealing" to include constructive mirroring).

  7. **Conclusion: First Player Does Not Lose (Non-negotiable)**  
     - **Specification**: The argument licenses "first player has a strategy to avoid loss" (win or draw), not necessarily a win.  
     - **Motivation**: Stealing a winning strategy only guarantees the original outcome (non-loss) if the game might have draws.  
     - **Case**: Strip (Case 1) may end in a draw, so the conclusion is "does not lose," not "wins."  
     - **Distinction**: Winning vs. non-losing; the latter is weaker but necessary for games with draws.  
     - **Settled**: Theorem (conclusion follows from extra-move property and symmetry).

  8. **Perfect Information (Non-negotiable, but Redundant)**  
     - **Specification**: The game must have perfect information (all moves/positions are visible to both players).  
     - **Motivation**: Required for strategies to be well-defined functions of game states.  
     - **Case**: All given cases satisfy this; it is assumed in the background.  
     - **Distinction**: Redundant with finiteness (finite perfect-information games are determined).  
     - **Settled**: Theorem (finiteness + perfect information imply determinacy).

  ### **Potential Conflicts and Key Exclusions**
  - **Conflict**: The extra-move property and ownership requirements may exclude otherwise symmetric, finite games (e.g., removal games like Case 2). This is intentional—ownership is non-negotiable for defining "own stone."  
  - **Key Exclusion**: The requirement doing the most exclusion is **ownership of moves**. It excludes neutral-object games (e.g., Case 2) and is why the colleague's criterion (below) fails. Without ownership, the extra-move property is ill-defined.  
  - **Colleague's Criterion Analysis**:  
    - *Criterion*: "First player does not lose for every finite perfect-information game that is symmetric and has an extra stone never hurt."  
    - **Too strong**: Applies to Single stone (Case 2)—symmetric and finite, but first player loses. Ownership is missing, making "extra stone" undefined.  
    - **Too weak**: Misses Builder and Spoiler (Case 4)—symmetric moves but asymmetric objectives, excluded by symmetry requirement.  
    - **Quietly drops**: Ownership and objective symmetry (it allows asymmetric objectives if moves are symmetric).

  ### **Settled vs. Contested Status**
  - **Settled (theorems with explicit hypotheses)**:  
    - Symmetry + finiteness + extra-move property + ownership + initial move ⇒ first player does not lose.  
    - Finiteness + perfect information ⇒ determinacy.  
  - **Folklore/Terminological**:  
    - "Strategy-stealing" sometimes includes mirroring/copycat arguments (negotiable).  
    - "Extra stone never hurts" is a hypothesis, not a theorem (verified per game).  
  - **Contested/Open**:  
    - Whether passes (Case 5) break imitation if they disrupt turn order (requires game-specific checks).  
    - Generalizing to non-discrete games (e.g., continuous spaces) is open; the account here assumes discrete moves.

  ### **Decision Procedure for Unfamiliar Games**
  To apply the strategy-stealing argument:
  1. **Check non-negotiable requirements**:  
     - Is the game symmetric (moves and objectives)? If no, stop (argument fails).  
     - Is it finite? If no, stop.  
     - Does it have player-owned moves? If no, stop.  
     - Does an extra stone of a player's own never hurt? If no, stop.  
     - Does the first player have an initial move? If no, stop.  
  2. **If all non-negotiables pass**:  
     - The argument applies and licenses "first player has a strategy to avoid loss."  
     - Non-constructivity is typical but not enforced (negotiable).  
  3. **Handle negotiable aspects as preferred**:  
     - E.g., if mirroring is used, it may still be called "strategy-stealing."  

  This procedure resolves all given cases:  
  - **Strip (1)**: Applies (non-loss).  
  - **Single stone (2)**: Fails (no ownership).  
  - **Overline (3)**: Fails (extra stone can hurt).  
  - **Builder and Spoiler (4)**: Fails (asymmetric objectives).  
  - **Strip with passes (5)**: Applies for one-pass variant (finite); fails for infinite-play variant (non-finite).
