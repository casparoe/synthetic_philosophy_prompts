prompt: |-
  Most legal systems descended from Roman law have to answer a question that is more metaphysical than it looks: when one person makes a new thing out of materials belonging to another — pressing someone else's grapes into wine, painting a picture on someone else's canvas, building with someone else's bricks, weaving someone else's thread into a garment, or mixing two owners' grain — who owns the result? The doctrine, usually called accession, resolves this by sorting the inputs into a principal thing and an accessory that has been merged into it, and awarding the product to the owner of the principal. Which input counts as principal is settled by a shifting list of tests — economic value, bulk, whose labor it was, and, most characteristically, physical identity, under which the principal is whatever gives the finished thing its name while the accessory is whatever has lost its identity in the other. The verdicts are casuistic: paint on another's panel, write on another's parchment, weave with another's thread, mix two owners' grain, and you get four different rules rather than one. Roman jurists themselves arrived at no consistent principle and decided these cases one at a time.

  I want to know what conception of objects this body of practice presupposes. Concretely: does it assume a settled answer to the question of when several things come together to make a single new thing, and of whether the things that went into it survive inside it as parts or are destroyed in the making? The recurrent image of an accessory whose identity is lost in the principal suggests that composition sometimes swallows its inputs and sometimes does not; is that a stable position, or does the doctrine slide between two incompatible pictures of what a finished object is? Please separate what the practice strictly requires from what it merely accommodates comfortably, and identify where it is underdetermined — whether one account of composition could underwrite all of the doctrine's verdicts, or whether the casuistry is itself evidence that no single account is being applied. Then consider two replacements for the implicit view. On the first, composition never occurs: there are only basic particles, and no such thing as the wine, the painting, or the house, only arrangements of simples. On the second, composition always occurs: any plurality of things whatsoever makes something. For each replacement, say which parts of the doctrine would have to be rewritten and which would be left standing.
reasoning: |-
  Okay, let me try to unpack this user's query. They're diving into Roman law's doctrine of accession and its metaphysical underpinnings regarding object composition. The user wants to know what conception of objects this legal doctrine presupposes. Specifically, they're asking whether the doctrine assumes a settled answer about when multiple things form a new single entity and whether the original components survive as parts or are destroyed.

  First, I need to recall how accession works. The doctrine sorts inputs into principal and accessory, awarding ownership based on which is deemed principal. Tests include economic value, bulk, labor, and physical identity. The key here is the "physical identity" test where the principal gives the new thing its name, and the accessory loses its identity. But the outcomes vary: painting on someone's panel vs. writing on parchment have different rulings. The Romans didn't have a consistent principle, handling each case individually.

  The user's main question is about the implicit view of objects. Do the jurists assume a stable answer to when composition occurs and if components survive? The recurring theme of the accessory losing its identity suggests that sometimes components are absorbed, other times not. But is this consistent? Or is the doctrine oscillating between two incompatible views?

  Breaking it down: the practice requires that we can identify a single new object (like wine or a painting). It also needs to determine which input retains its identity (principal) and which doesn't (accessory). However, it doesn't strictly require that components are destroyed; they might survive as parts, but the accessory's legal identity is extinguished. The underdetermined part is the exact metaphysical status of the components. The doctrine doesn't specify if the canvas ceases to exist or just loses legal significance. This ambiguity allows flexibility but also leads to casuistry because there's no unified theory of composition. The varying rulings suggest that no single account is applied consistently.

  Now, considering the two replacements. First, composition never occurs: only basic particles exist. If we adopt this view, the entire doctrine collapses because there's no "wine" or "painting" as distinct entities. Ownership couldn't be assigned to a non-existent composite. The law relies on socially recognized objects, so this view is incompatible. All verdicts would need rewriting since the doctrine assumes higher-level objects.

  Second replacement: composition always occurs. Any plurality makes a new entity. Here, the problem is determining ownership without distinguishing principal and accessory. Every combination creates a new object, so who owns it? The doctrine's tests (value, labor, identity) become irrelevant. Instead, you'd need rules based on contribution or consent. For example, mixing grains would create a new composite owned jointly, whereas accession might give it to the grain owner who contributed more. The core mechanism of accession (principal-accessory) would be discarded, but some outcomes might align if redefined through joint ownership or labor rights.

  The user also asked about what the practice accommodates versus strictly requires. The doctrine accommodates some components surviving as parts (like bricks in a house) but requires the accessory's legal identity to be subsumed. It's underdetermined in whether physical destruction occurs or just legal assimilation. Casuistry arises because there's no consistent metaphysical basis, leading to context-dependent rulings.

  In summary, the doctrine's implicit view is a flexible, folk-metaphysical one where composites are recognized pragmatically. Replacing it with either extreme (no composition or universal composition) dismantles the principal-accessory framework. The user's deep interest seems to be in how legal doctrines rely on implicit metaphysics and whether they can withstand philosophical scrutiny. They might be exploring the intersection of law, philosophy, and ontology, possibly for academic research or theoretical curiosity. Their careful dissection suggests a need for clarity on how practical legal systems handle metaphysical uncertainties, which is crucial for understanding law's foundations.
answer: |-
  The doctrine of accession presupposes a **folk-metaphysical view of objects** that is pragmatic, context-dependent, and fundamentally **underdetermined** in its ontology. It relies on *socially recognized unity* rather than a consistent metaphysical theory of composition or part-survival. Here's a breakdown:

  ### What the Practice Strictly Requires & Accommodates
  1.  **Requires a Single New Object:** The outcome *must* be a unified entity (the wine, painting, house, garment, mixed grain) owned by one person. The law needs a clear "thing" to attach ownership to.
  2.  **Requires Loss of (Legal) Identity for the Accessory:** The accessory input *must* legally cease to be an independent object. Its ownership is extinguished; it becomes inseparable from the principal.
  3.  **Requires Preservation of (Legal) Identity for the Principal:** The principal's core identity persists into the new object, carrying ownership with it. The new thing is fundamentally "the principal transformed" (e.g., the canvas with paint is still "the canvas-thing" owned by the canvas owner).
  4.  **Accommodates (but doesn't require) physical destruction/survival:** The doctrine is agnostic *metaphysically* about whether the accessory is annihilated or merely subsumed. Legally, it's "gone" as a separate entity. Similarly, components of the principal might survive as physical parts (bricks in a house) or be transformed (grapes into wine).
  5.  **Accommodates Contextual Criteria:** The tests (value, bulk, labor, name) are tools to determine the *socially salient identity* of the new object ("What do we *call* this thing? What is its essence in this context?"), not to discover a pre-existing metaphysical truth.

  ### Where it is Underdetermined & Evidence of Casuistry
  *   **The Core Ambiguity:** The doctrine **does not and cannot** consistently answer whether composition destroys the inputs or preserves them as parts. It *legally* treats the accessory as destroyed (ownership lost) and the principal as preserved (ownership continues). Metaphysically, it's silent. This lets it slide between pictures:
      *   **"Destruction" Picture:** Grapes are destroyed to *create* wine; thread is destroyed to *create* a garment. The new entity supersedes.
      *   **"Subsumption/Parts" Picture:** Bricks survive *as parts* of a house; paint survives *on* the canvas. The new entity is an aggregation where the principal dominates.
  *   **Casuistry as Evidence:** The wildly different rules (e.g., painter loses paint to canvas owner but writer owns the writing on the parchment) are **direct evidence that no single, consistent metaphysical principle is being applied.** The outcomes depend entirely on culturally contingent judgments about what constitutes the "essential" or "naming" component in each specific type of artifact. The doctrine resolves ownership disputes pragmatically, not ontologically. **No single account of composition (destruction vs. part-survival) can underwrite all verdicts.** The casuistry *is* the practice; it reflects adjudication based on perceived societal values and practical consequences, not a unified theory.

  ### Replacement 1: Composition Never Occurs (Only Simples)
  *   **Doctrine Collapse:** This view is **fundamentally incompatible** with accession. The doctrine *requires* the existence of higher-level objects (wine, painting, house) as the subjects of ownership.
  *   **What Must be Rewritten:**
      *   **The Entire Premise:** The question "Who owns the new thing?" vanishes. There *is* no "new thing," only arrangements of particles.
      *   **Ownership Basis:** Ownership could only attach to the original simples (canvas particles, paint particles, brick particles). Any "merger" is illusory.
      *   **All Verdicts:** Every accession rule becomes nonsensical. Ownership disputes would be about tracing particles or perhaps compensating for unauthorized use/labor on someone else's particles. The "principal/accessory" distinction evaporates.
  *   **Left Standing?** Nothing substantial. The *problem* of unauthorized combination exists, but the *solution* (awarding a single composite object) disappears.

  ### Replacement 2: Composition Always Occurs (Universalism)
  *   **Doctrine Undermined:** Universalism dissolves the core mechanism of accession – distinguishing principal from accessory based on identity loss/persistence. *Every* combination creates a new object, and *all* inputs lose their independent identity equally.
  *   **What Must be Rewritten:**
      *   **The Principal/Accessory Distinction:** This collapses. There is no "surviving" principal input; all inputs are equally subsumed into the new composite.
      *   **Ownership Rule:** Awarding the composite to the owner of the "principal" is meaningless. New rules are needed:
          *   **Joint Ownership:** The composite is owned by *all* original owners proportionally (e.g., based on value contributed). This fits mixing grain or potentially weaving thread.
          *   **Creator Ownership:** The laborer/creator owns the new composite, perhaps subject to compensating the material owners for conversion/damages. This fits painting or writing.
          *   **Material Dominance:** Ownership follows the *majority* material by value or bulk, ignoring identity persistence. This might approximate some accession outcomes but lacks its rationale.
      *   **Specific Verdicts:** Painting on another's canvas becomes joint ownership or creator ownership, not automatic award to the canvas owner. Mixing grain becomes joint ownership, not award to one owner (unless value/bulk dictates it).
  *   **What Might Survive (Modified):**
      *   **Value/Bulk as Proportionality Measures:** These could determine shares in joint ownership.
      *   **Labor as a Claim:** The creator's effort could ground a claim to ownership of the composite or compensation, separate from the material contribution.
      *   **The *Problem* Solved:** The need to resolve ownership of the composite remains, but the *mechanism* changes entirely. The focus shifts to fair distribution among contributors or rewarding creation, not identifying a dominant surviving identity.

  ### Conclusion
  Accession presupposes a **pragmatic, folk ontology** where certain arrangements of matter are recognized by society as unified objects ("substances" or "artifacts") whose identity is determined contextually, often by what is perceived as its essential, naming component. It *legally* treats the accessory as destroyed and the principal as surviving to anchor ownership, but this is a legal fiction, not a stable metaphysical commitment. The casuistry is inherent, arising from applying contextual social norms rather than a unified theory of composition. Neither replacement view (no composition or universal composition) is compatible with the doctrine's core reliance on identifying a *single surviving identity* from the inputs to carry ownership into the new object. Both replacements necessitate abandoning the principal/accessory distinction entirely.
