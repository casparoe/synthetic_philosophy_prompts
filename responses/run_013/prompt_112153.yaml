prompt: |-
  I am the analyst attached to the appraisal panel of a regional health board — the body that decides whether to fund changes to how services are configured — and we are stuck in a loop. Whenever a proposal is contentious, someone moves that we defer and commission more evidence first: a pilot at two sites, a modelling exercise, a patient survey, a further audit of the existing service. The motion is almost always defended by an appeal to Good's theorem — the claim that the expected value of information is never negative, so that we cannot lose by looking before we decide. I have read enough to be fairly sure that this is a loose application, but I do not have a better rule, and the deferrals are costing us: two of them have pushed changes back by more than a year, and at least one service has got worse in the meantime. We meet monthly, we have nobody trained in decision analysis, the chair has the casting vote, and our finance director — who has to sign off anything above £50,000, and who has become allergic to pilots — will be reading this too.

  Please write us a procedure we can run in ten minutes, at the table, on each request to gather more evidence before deciding: the questions in the order we should ask them, what counts as a sufficient answer to each, where the procedure stops and tells us to decide now on what we have, and where it has to hand the question to a person because the answer turns on values rather than facts. If a step needs numbers we do not have, say what to do instead. Be explicit about exactly what is being operationalised. As I understand it, the theorem is a claim about the expected value of a free observation to a single expected-utility maximiser with a fixed prior and fixed preferences, who will then act on what they learn; the non-negativity is a property of the expectation taken before looking, not a promise that any particular result leaves us better off than ignorance would have. I would like the procedure to mark clearly the three or four places where getting from that statement to a public body's decision is a substantive step rather than a deduction — the panel is not a single agent with one prior; commissioning evidence is itself an act with consequences, since a consultation or an audit changes what the service does and what people believe while it runs; the panel does not always act on what it learns; and value here means expected utility, which is precisely what is in dispute. Then run it on three cases: a proposal to pilot a new triage model at two sites before regional roll-out; a proposal to survey patients before deciding whether to close a small unit; and a proposal to defer the reconfiguration of stroke services pending further modelling. I suspect the third will come out against the cautious option, which several of my colleagues will not enjoy hearing — better to have that argument now than in six months.

  Throughout, keep clear which parts of this are settled and which are genuinely contested among people who work on it — the mathematics of the theorem is one thing; whether expected-utility language is the right frame for a public body at all, whether information has a value apart from the decision it feeds, and how much of the result survives when the decision-maker is a committee are quite another. Please do not present a contested position as though it were the consensus, and say plainly where a competent analyst could reasonably run the procedure differently from the way you have written it. Write in British English.
reasoning: |-
  We are designing a 10-minute procedure to evaluate requests for gathering more evidence before making a decision. The procedure must account for the limitations of Good's theorem in a public body context. We note that the theorem assumes a single rational agent with fixed preferences and prior, free information, and that the agent will act on the information. Our context differs: we have a panel (a committee), information gathering is costly and has consequences (delays, changes to services, etc.), and the panel may not act on the information.

  The procedure is structured as a series of questions. At any point if the answer is negative or insufficient, we stop and decide now. We also note steps where the decision is value-laden and must be handed to the panel.

  **Procedure: "Should We Gather More Evidence?" (10-minute table exercise)**

  **Step 1: Clarify the Decision and the Options**
     - Question: "What is the specific decision we are being asked to defer, and what are the alternative actions (including the status quo)?"
     - Sufficient answer: A clear statement of the decision (e.g., "whether to roll out the new triage model regionally") and at least two distinct alternatives (e.g., "roll out now", "do not roll out", and "pilot at two sites then decide" is an alternative if we are considering deferring for a pilot).
     - If not clear, stop: The panel must define the decision and alternatives now. Do not proceed until this is clear.
     - Operationalising: We are setting the decision context. Without this, we cannot apply any decision theory.

  **Step 2: Is the Request for Evidence Tied to a Specific Decision?**
     - Question: "Is the proposed evidence-gathering activity (pilot, survey, etc.) intended to inform this specific decision, and are we committed to making that decision after the evidence is gathered?"
     - Sufficient answer: Yes, and the activity is designed to reduce uncertainty about a key factor that would change our choice among the alternatives. If no, then the evidence gathering is not directly tied to the decision and deferral is not justified by the decision-theoretic argument.
     - If no: Stop and decide now. The evidence gathering is not decision-relevant in the required sense.
     - Note: This step addresses the concern that the panel might not act on the information. We require a commitment to act (i.e., to make the decision after the evidence is in).

  **Step 3: What is the Cost of Delay?**
     - Question: "What negative consequences (financial, health outcomes, operational disruption, etc.) will occur if we defer the decision until the evidence is gathered? Quantify if possible, but if not, describe."
     - Sufficient answer: A list of the main negative consequences and, ideally, an estimate of their magnitude (e.g., "delaying stroke reconfiguration by 6 months will lead to 2 avoidable deaths and cost £X in inefficiencies"). If no negative consequences are identified, then the cost of delay is zero.
     - If the cost of delay is high (relative to the stakes of the decision) and the benefits of the evidence are uncertain, we may decide now.
     - Operationalising: We are introducing the real-world cost of information gathering. This step is critical because Good's theorem assumes free information.

  **Step 4: What Specific Uncertainty Will the Evidence Reduce?**
     - Question: "What specific uncertainty (or uncertainties) does the proposed evidence address, and how will it change our decision? In particular, what might we learn that would make us choose a different alternative than we would choose today?"
     - Sufficient answer: A clear statement of the uncertainty (e.g., "we don't know whether the new triage model reduces waiting times by at least 15% without increasing clinical risk") and a plausible scenario in which the evidence would change the decision (e.g., "if the pilot shows a 20% reduction, we roll out; if it shows no reduction, we don't").
     - If the evidence cannot change the decision (i.e., we would make the same decision regardless of the outcome), then gathering it is not justified for this decision. Stop and decide now.
     - Operationalising: This step checks for the necessary condition that the evidence has potential decision value (the possibility of changing the decision).

  **Step 5: Is the Cost of Gathering Evidence Justified?**
     - Question: "What are the direct costs (financial, time, staff effort) and indirect costs (e.g., disruption from running a pilot, survey fatigue) of gathering the evidence? And what is the likelihood that the evidence will change our decision, and how much better (in terms of outcomes) would the changed decision be?"
     - Sufficient answer: An estimate of the costs (if above £50,000, the finance director's approval is needed) and a qualitative assessment of the potential benefits (e.g., "the pilot costs £100,000 and takes 6 months; if it shows the model works, we gain £Y per year in efficiency; if it shows it doesn't, we avoid a failed roll-out costing £Z. The chance of it changing our decision is about P%.").
     - If the costs clearly outweigh the potential benefits (even roughly) or if the chance of changing the decision is very low, then stop and decide now.
     - If numbers are not available, use expert judgment from the panel: "On a scale of 1 to 10, how likely is the evidence to change our decision? How large are the potential benefits relative to the costs?"
     - Operationalising: This step requires a rough cost-benefit analysis of the evidence gathering itself. It is the crux of the expected value of information (EVI) calculation, but we are doing it qualitatively. Note: The EVI is the expected benefit of the information minus the cost of obtaining it, and we require EVI > 0 to proceed.

  **Step 6: Are We Able to Gather the Evidence Without Unacceptable Side Effects?**
     - Question: "Beyond the direct costs, are there negative consequences of gathering the evidence that we haven't accounted for? (e.g., running a pilot might create inequity between pilot and non-pilot sites, or a survey might raise patient expectations that we cannot meet.)"
     - Sufficient answer: Identify any such consequences and assess whether they can be mitigated or are acceptable. If they are unacceptable, then we do not gather the evidence.
     - If unacceptable: Stop and decide now without the evidence.

  **Step 7: Decision Point**
     - If we have passed Steps 1-6, then we defer the decision and commission the evidence.
     - Otherwise, we make the decision now based on current information.

  **Contested Steps and Where Values Matter:**
  - Step 3 (Cost of Delay) and Step 5 (Cost-Benefit of Evidence) involve value judgments and uncertainty. The panel must agree on the magnitude of the costs and benefits, which may be disputed. 
  - Step 6 (Side Effects) is inherently value-laden (what is "unacceptable"?). 
  - The entire procedure assumes that the decision can be framed in terms of expected utility. Some panel members might argue for other values (e.g., equity, procedural fairness) that are not captured in the expected utility framework. In such cases, the panel must explicitly discuss and decide.

  **Applying the Procedure to Three Cases**

  **Case 1: Proposal to pilot a new triage model at two sites before regional roll-out**

  Step 1: Decision: Whether to roll out the new triage model regionally. Alternatives: Roll out now, do not roll out, or pilot then decide (the deferral option).
  Step 2: The pilot is directly tied to the roll-out decision. We commit to deciding after the pilot.
  Step 3: Cost of delay: Delaying regional roll-out by 6 months might mean forgoing efficiency gains. Estimate: If the model is good, we lose £X per month in inefficiencies. Also, the pilot might disrupt the two sites.
  Step 4: Uncertainty: The effect of the triage model on waiting times and clinical outcomes. We might learn that the model is not effective, in which case we would avoid a bad roll-out.
  Step 5: Cost of pilot: £Y (if >£50,000, FD must agree). Benefits: Avoids cost of a failed roll-out if the model is bad. The chance of the model being bad is unknown? We need an estimate. If we think the model is likely to work, then the chance of changing the decision (to not roll out) might be low. Without numbers, we use expert judgment: if the panel believes the model is promising but unproven, the chance of changing the decision might be moderate (say 30-50%). The benefits of avoiding a failed roll-out could be high. If the cost of the pilot is low relative to the potential losses from a failed roll-out, then proceed.
  Step 6: Side effects: Inequity between pilot and non-pilot sites? Also, if the pilot is run poorly, it might discredit a good model. Assess: Mitigate by careful design and clear communication.

  **Verdict:** If the cost of delay and the pilot cost are acceptable and the potential benefits (avoiding a bad roll-out) are high, then defer for the pilot. Otherwise, decide now.

  **Case 2: Proposal to survey patients before deciding whether to close a small unit**

  Step 1: Decision: Whether to close the small unit. Alternatives: Close now, keep open, or survey then decide.
  Step 2: The survey is intended to inform the closure decision. We commit to deciding after the survey.
  Step 3: Cost of delay: The unit is underperforming and may be providing substandard care. Delay might lead to worse patient outcomes. Also, financial losses may continue.
  Step 4: Uncertainty: We don't know how much patients value the unit. The survey might reveal that patients strongly oppose closure, which might change our decision? But note: the decision to close should be based on clinical and financial sustainability, not just patient preference. So, we must clarify: is the survey addressing a key uncertainty that the panel has agreed is relevant? If the panel has already decided that patient preference is not a decisive factor, then the survey won't change the decision. Then we stop at Step 4 and decide now.
  Step 5: If patient preference is a factor, then we proceed. Cost of survey: £Z. Benefit: if we learn that patient opposition is overwhelming, we might avoid a backlash and maintain trust. The chance of changing the decision depends on how uncertain we are about patient views. If we are fairly sure they oppose closure, then the survey might not change anything. If we are unsure, then it might change the decision. But note: if the unit is clinically unsafe, patient preference might not override that. So the benefit might be low.
  Step 6: Side effects: The survey might raise anxiety and expectations that the unit will stay open.

  **Verdict:** Likely to stop at Step 4 if the survey is not addressing a key uncertainty that could change the decision. If patient preference is a key factor and we are uncertain, then we might proceed. But if the cost of delay (substandard care) is high, we might decide to close now.

  **Case 3: Proposal to defer the reconfiguration of stroke services pending further modelling**

  Step 1: Decision: Whether to reconfigure stroke services (e.g., centralise services). Alternatives: Reconfigure now, leave as is, or wait for modelling then decide.
  Step 2: The modelling is directly tied to the reconfiguration decision. We commit to deciding after the modelling.
  Step 3: Cost of delay: Stroke services are currently fragmented, leading to avoidable deaths and disabilities. Every month of delay may cost lives. Quantify: If centralisation saves 5 lives per month, then a 6-month delay costs 30 lives.
  Step 4: Uncertainty: We don't know the exact impact of reconfiguration? But we might have strong evidence already (e.g., from other regions). The modelling would reduce uncertainty about the magnitude of the benefits. What would change our decision? If the modelling showed that the benefits are marginal, we might not proceed. But if we are already convinced by existing evidence, then the modelling won't change the decision. We stop at Step 4 if we would reconfigure regardless of the modelling (because the status quo is unacceptable) or if we wouldn't reconfigure regardless (then why model?).
  Step 5: Cost of modelling: £W and time (say 3 months). The benefit: avoiding a reconfiguration if it turns out to be only marginally beneficial. But if the existing evidence is strong, the chance of the modelling changing the decision is low. The cost of delay (lives lost) is very high. Therefore, the cost of delay likely outweighs the potential benefit of the modelling.
  Step 6: Side effects: Modelling might cause uncertainty among staff and patients.

  **Verdict:** Given the high cost of delay and the low chance of the modelling changing the decision (if the existing evidence is strong), we should decide now without the modelling. This is the case the analyst expects will come out against deferral.

  **Conclusion on the Procedure:**
  The procedure operationalises the expected value of information in a practical way for a panel. It highlights that information is not free and that the panel must consider the costs and benefits of gathering it. The contested points are:
  - The framing of the decision and alternatives (Step 1) may be value-laden.
  - The assessment of costs and benefits (Steps 3 and 5) requires judgment and may be disputed.
  - The procedure assumes the panel can commit to acting on the evidence (Step 2).

  A competent analyst could adjust the thresholds in Steps 3 and 5 (e.g., what counts as "high" cost of delay) or the level of detail in the cost-benefit assessment. But the structure should be robust.

  **Final Procedure for the Panel:**
  We will run through the seven steps for each request to defer for evidence. We will stop at any step if the answer is insufficient and then vote on the main decision. The chair has the casting vote.
answer: |-
  Below is a step-by-step procedure designed to be run in 10 minutes at your panel meetings. It operationalises the **expected value of information (EVI)** framework while explicitly accounting for the limitations of Good's theorem in your context (e.g., panel dynamics, costs of delay, and committee decision-making). The procedure is structured as a flowchart of yes/no questions, with clear stopping rules. It flags where values (e.g., equity, risk tolerance) must override technical calculations, and where the mathematics of Good's theorem diverges from real-world constraints.

  Key contested issues are marked with **(!)**. These are steps where:
  1. Good's theorem assumes a single rational agent with fixed preferences, but your panel is a group with potentially conflicting priors and values.
  2. Information is not "free" – delays or evidence-gathering alter the decision context.
  3. The panel may not act on the information (e.g., due to politics or inertia).
  4. "Value" is defined as expected utility, but public bodies may prioritise procedural fairness, equity, or other non-utilitarian goals.

  The procedure uses **British English** and pragmatic workarounds for missing numbers (e.g., qualitative scales). It is designed for a non-technical panel, with finance director (FD) constraints integrated.

  ---

  ### **Procedure: Should We Defer to Gather More Evidence?**
  **Time:** 10 minutes per request.  
  **Input:** A proposal to defer decision X for evidence Y (e.g., pilot, survey, model).  
  **Output:** Either (a) **Defer and commission Y**, or (b) **Decide now** based on current information.  
  **Chair’s role:** Resolve ties, ensure discipline on time.

  #### **Step 1: Define the Decision and Alternatives**  
  **Question:** "What is the core decision we are deferring, and what are the feasible alternatives (including status quo)?"  
  **Sufficient answer:**  
  - Decision clearly stated (e.g., "roll out triage regionally").  
  - At least two alternatives (e.g., "implement now," "reject," "status quo").  
  - Evidence Y must directly inform this decision.  
  **Stop and decide now if:**  
  - Alternatives are unclear (e.g., vague objectives like "explore options").  
  - Evidence Y is unrelated to the decision (e.g., a patient survey for a clinical redesign).  
  **Operationalises:** Framing the decision problem.  
  **Contested (!):** Panel may disagree on what alternatives are "feasible" (values/risk tolerance).  

  #### **Step 2: Will We Act on the Evidence?**  
  **Question:** "Do we commit to making this decision within [timeframe of evidence Y] using the results, barring major external changes?"  
  **Sufficient answer:** Unambiguous "yes" from the panel. If "no" or "unsure," deferral is high-risk.  
  **Stop and decide now if:**  
  - No commitment (e.g., history suggests evidence is ignored or the decision will be deferred again).  
  **Operationalises:** Good's theorem assumes the decision-maker acts on new information.  
  **Contested (!):** Public bodies may prioritise process over outcomes (e.g., consultation as box-ticking).  

  #### **Step 3: Assess Costs of Delay**  
  **Question:** "What are the quantifiable costs of deferring the decision by [duration of evidence Y]? Include:  
  - Health impacts (e.g., avoidable deaths, worse outcomes).  
  - Financial costs (e.g., overspend, inefficiencies).  
  - Operational/social costs (e.g., staff morale, patient trust)."  
  **Sufficient answer:**  
  - **Quantified estimate** (e.g., "6-month delay in stroke reconfig causes 4 avoidable deaths and £200k waste").  
  - If numbers unavailable, use a **1–10 scale** for severity (1 = negligible, 10 = catastrophic).  
  **Stop and decide now if:**  
  - Cost of delay ≥7 on the scale OR ≥£50k financial cost (FD must flag this).  
  - Status quo is actively harmful (e.g., service deteriorating).  
  **Operationalises:** Good's theorem assumes cost-free information; here, delay itself has utility impacts.  

  #### **Step 4: Will Evidence Change the Decision?**  
  **Question:** "Is there a realistic scenario where evidence Y could change our preferred alternative? What specific uncertainty does Y address?"  
  **Sufficient answer:**  
  - A tangible uncertainty (e.g., "Pilot will tell us if triage reduces wait times by ≥15% without safety risks").  
  - A plausible outcome that flips the decision (e.g., "If pilot shows <10% improvement, we abandon rollout").  
  **Stop and decide now if:**  
  - Evidence Y cannot change the decision (e.g., we will rollout regardless due to political pressure).  
  - Uncertainty is irrelevant (e.g., surveying patients about clinical efficacy).  
  **Operationalises:** EVI requires information to have "decision sensitivity."  

  #### **Step 5: Cost-Benefit of Evidence**  
  **Question:** "Do the benefits of evidence Y outweigh its costs? Assess:  
  - **Direct costs:** £££ of Y (e.g., pilot setup), time, staff effort.  
  - **Benefits:** Avoided losses if Y prevents a bad decision (e.g., rolling out a harmful triage).  
  - **Probability:** Estimate likelihood (%) that Y changes the decision (use 1–10 scale if needed)."  
  **Sufficient answer:**  
  - **Rough calculation:** (Probability Y changes decision) × (Value of better decision) > (Cost of Y + Cost of delay).  
  - **FD rule:** If Y costs >£50k, FD must approve cost-effectiveness.  
  **Stop and decide now if:**  
  - Costs > benefits (e.g., pilot costs £100k but has <10% chance of changing decision).  
  - Benefits are speculative ("might give insights").  
  **Operationalises:** EVI minus costs must be positive.  
  **Contested (!):** Requires estimating "value" of outcomes – panel may disagree on health vs. financial trade-offs.  

  #### **Step 6: Mitigate Side Effects**  
  **Question:** "Could evidence Y cause unintended harm (e.g., inequity, service disruption, false expectations)?"  
  **Sufficient answer:**  
  - Risks identified (e.g., "Pilot sites get better care, creating inequity").  
  - Mitigation proposed (e.g., "Limit pilot to 4 weeks and compensate non-pilot sites").  
  **Stop and decide now if:**  
  - Unacceptable risks remain (e.g., survey could panic patients about unit closure).  
  **Operationalises:** Real-world constraints beyond utility maximisation.  

  #### **Step 7: Decision**  
  - If all steps passed → **Defer and commission Y**.  
  - If any step failed → **Decide now**.  

  ---

  ### **Application to Cases**
  **Assumptions:**  
  - Panel uses 1–10 scales for unquantified costs/benefits.  
  - FD engaged on cost thresholds.  
  - Time discipline enforced (2 minutes per step).

  #### **Case 1: Pilot new triage model at two sites before regional roll-out**  
  - **Step 1:** Decision = "Roll out triage regionally?" Alternatives = Roll out now, reject, pilot then decide. Pass.  
  - **Step 2:** Panel commits to deciding after pilot. Pass.  
  - **Step 3:** Cost of delay = 6-month delay loses £150k inefficiencies. Scale: 4/10. Pass.  
  - **Step 4:** Uncertainty = "Does triage cut wait times ≥15% safely?" If pilot shows <10%, reject rollout. Pass.  
  - **Step 5:** Pilot costs £80k. Benefits: Avoids £500k loss if rollout fails. Probability of changing decision = 40% (scale 7/10). Benefits > costs. FD must review (>£50k). Pass.  
  - **Step 6:** Risk = Inequity between pilot/non-pilot sites. Mitigate: Random site selection, 3-month max. Pass.  
  - **Outcome:** Defer for pilot. FD scrutiny applies.

  #### **Case 2: Survey patients before closing small unit**  
  - **Step 1:** Decision = "Close unit?" Alternatives = Close now, keep open, survey then decide. Pass.  
  - **Step 2:** Panel commits to using survey. Pass.  
  - **Step 3:** Cost of delay = Unit is underperforming; delay risks patient harm. Scale: 8/10. **Stop and decide now.**  
  - **Rationale:** High cost of delay (Step 3) overrides other steps. Status quo is unsafe – decide now.

  #### **Case 3: Defer stroke reconfiguration for further modelling**  
  - **Step 1:** Decision = "Reconfigure stroke services?" Alternatives = Proceed now, abandon, model then decide. Pass.  
  - **Step 2:** Panel commits to using model. Pass.  
  - **Step 3:** Cost of delay = Current fragmentation causes 5 avoidable deaths/month. Scale: 9/10. **Stop and decide now.**  
  - **Rationale:** Delay costs (lives lost) are catastrophic. Even if modelling is valuable (Step 4–5), it cannot justify delay.  
  - **Note:** This rejects deferral, as you anticipated. The mathematics of EVI is overruled by the ethical urgency of the status quo.

  ---

  ### **Contested Elements and Adaptations**  
  1. **Single agent vs. committee (!):**  
     - Good's theorem assumes one decision-maker. Panels aggregate views, risking "analysis paralysis." The procedure forces commitment (Step 2) but cannot eliminate politics.  
     - Competent analyst variation: If panel priors are highly conflicted, add a preliminary vote on "confidence in current evidence." Low confidence may justify evidence-gathering despite costs.

  2. **Expected utility as the frame (!):**  
     - The procedure uses utility (health/financial outcomes) for cost-benefit. Some members may value due process or equity more. Step 6 allows override but does not resolve this.  
     - Competent analyst variation: In value-laden cases (e.g., unit closures), replace Step 5 with a structured values discussion (e.g., "What ethical principles are at stake?").

  3. **Cost of delay quantification (!):**  
     - Health impacts (e.g., lives lost) are often unquantified. The 1–10 scale operationalises judgement.  
     - Competent analyst variation: Use published health-economic values (e.g., £20k–30k per QALY) if available, but panel must agree on thresholds.

  4. **Information as intrinsically valuable (!):**  
     - Good's theorem rejects this, but public bodies may value transparency. The procedure treats evidence as instrumental (Step 4).  
     - Competent analyst variation: If "procedural fairness" is invoked, skip to Step 6 for harm assessment.

  **Settled vs. Contested:**  
  - **Settled:** Good's theorem mathematically proves EVI ≥0 for a free, perfectly acted-upon observation.  
  - **Contested:** Whether this applies to committees, costly evidence, or non-utilitarian goals. The procedure makes these conflicts explicit (flagged with **(!)**).  

  **Final Advice:**  
  - Train the chair to enforce time limits and tie-break.  
  - For high-stakes cases, pre-circulate cost/benefit templates.  
  - The FD’s £50k threshold is a hard stop – embed it in Steps 3 and 5.  
  - This procedure prevents "deferral loops" by emphasising costs of delay (Step 3) and actionability (Step 2). Case 3 illustrates how it forces decisive action when status quo harms outweigh information benefits.
