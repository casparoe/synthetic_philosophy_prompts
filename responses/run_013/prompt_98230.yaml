  Okay, the user is in a legislation seminar and has been debating purposivism vs. new textualism with a classmate, specifically focusing on Bostock v. Clayton County. They want me to referee by applying both theories to the case, not just summarizing them. Let me start by recalling the key points of the case. The Supreme Court held that firing someone for being gay or transgender violates Title VII's prohibition on sex discrimination. Gorsuch wrote the majority opinion, calling it textualist, while Alito and Kavanaugh dissented, arguing that the majority was actually smuggling in purposivism.

  First, I need to map theory onto the case. What would a committed textualist and purposivist predict about Title VII? For textualism, it's all about the plain meaning of the words at enactment. The relevant text is "because of... sex." A textualist would ask if firing for being gay or transgender inherently involves sex. Gorsuch's argument is that it does because it treats men and women differently: a man fired for dating men wouldn't be fired if he were a woman. That's differential treatment based on sex. But is that move textualist? The dissenters say that "sex" in 1964 meant biological sex, not sexual orientation or gender identity. So a strict textualist might agree with the dissent, arguing that the meaning hasn't changed.

  For purposivism, the focus is on the statute's purpose. Title VII aimed to eliminate workplace discrimination based on sex. A purposivist might argue that discriminating against LGBTQ employees is a form of sex discrimination because it's based on non-conformity to gender norms. But in Bostock, the majority didn't use this reasoning; they stuck to the differential treatment argument. The dissenters accused Gorsuch of being purposivist by updating the statute to modern understandings, but Gorsuch claimed he was just applying the text. So which opinion best instantiates each theory? Gorsuch's majority is textualist in method but with a broad application of "sex." Alito's dissent is also textualist but originalist, focusing on 1964 meaning. Kavanaugh's dissent is more purposivist, emphasizing Congress's intent.

  Next, the user wants case onto theory. Is Bostock a confirmation or anomaly for each theory? For textualism, it's both: confirmation that text matters, but an anomaly because Gorsuch's interpretation is broader than expected. Purposivism might see it as an anomaly because the majority didn't engage with purpose, even though the outcome aligns with modern views. The user's hypothesis is that both theories are about allocating discretion. Gorsuch used textualism to expand protection, showing that textualism can be flexible. The counterfactual: if legislative history showed Congress didn't intend to cover sexual orientation, textualists like Gorsuch might still rule the same because they prioritize text over intent. Purposivists would likely change their answer based on the revealed intent. This shows textualism constrains by limiting sources, not outcomes.

  Where are the theories silent? Textualism doesn't address whether differential treatment is the only way to interpret "because of sex." Purposivism doesn't specify whose purpose matters—1964 Congress or current societal values. Both have gaps when text and purpose are in tension. The user's deeper need might be understanding if these theories are truly distinct or just tools for judicial discretion. They want a nuanced analysis that tests their hypothesis about discretion allocation. Need to ensure the response addresses both mappings clearly, uses the counterfactual effectively, and highlights the silences in each theory.
answer: |-
  Here is a disciplined analysis of *Bostock* through the lens of textualism and purposivism, addressing your mappings and hypothesis:

  ### I. Theory onto Case: Predictions, Text, Purpose, and Opinion Alignment
  **A. Committed Textualist Prediction:**
  *   **Prediction:** A textualist would predict that Title VII prohibits discrimination *only* if the employer's decision is explicitly or demonstrably causally dependent on the employee's biological sex (as understood in 1964). Sexual orientation and gender identity are distinct concepts not mentioned in the statute. Therefore, a textualist would predict the statute *does not* cover discrimination based solely on being gay or transgender.
  *   **Relevant Text:** The operative phrase: "because of... sex." Textualists focus on the ordinary meaning at enactment (1964). "Sex" meant biological sex (male/female). The phrase requires the employee's sex to be a "but-for" cause of the adverse action.
  *   **Work the Text Does in Gorsuch:** Gorsuch's textualism focuses on the *logic* of discrimination applied to individuals. He argues that discrimination based on homosexuality or transgender status *necessarily* requires considering the employee's sex: firing a man for dating men but not firing a woman for dating men constitutes treating that man differently *because he is a man*. Same for firing someone who was assigned male at birth but identifies as a woman. The text "because of sex" does the work by forcing an analysis of comparative treatment based on sex.
  *   **Premise Not in Statute:** Gorsuch's central move depends on the premise that **differential treatment based on a trait inextricably linked to sex *is* treatment "because of... sex."** The statute doesn't define "because of sex" to include this specific logical formulation. Critics argue it smuggles in an *effect*-based analysis (outcome differs by sex) rather than focusing solely on the employer's *motivating factor* (did the employer act *due to* the employee's sex?).
  *   **Opinion Alignment (Textualist):** **Justice Kavanaugh's Dissent** best instantiates a committed textualist approach *as conventionally understood pre-Bostock*. He argues "sex" in 1964 unambiguously meant biological sex, not sexual orientation or gender identity. He rejects Gorsuch's "but-for causation with comparative logic" as stretching "because of sex" beyond its ordinary meaning to cover "new phenomena." He insists textualism requires fidelity to the original meaning of the words, not their logical extrapolation.

  **B. Committed Purposivist Prediction:**
  *   **Prediction:** A purposivist would predict the outcome depends on the *underlying purpose* of Title VII's sex discrimination provision. If the core purpose is eliminating workplace inequities rooted in gender stereotypes and ensuring equal opportunity regardless of sex, then discrimination against gay/transgender individuals (often based on non-conformity to sex-based norms) *should* be covered. If the purpose is narrower (e.g., ensuring equal pay for equal work between men and women), it might not.
  *   **Relevant Purpose:** The overarching purpose of Title VII is eliminating irrational discrimination in employment. The specific purpose of adding "sex" (historically debated) is generally understood as ensuring fairness and equal opportunity for women (and men) by preventing discrimination based on their biological sex. A broader view sees it as combating sex-based stereotypes and roles in the workplace.
  *   **Work Purpose Does/Could Do:** A purposivist would look beyond the bare text to legislative history, societal context in 1964, and the evolving nature of workplace discrimination. They might argue the *reason* gay/trans people are discriminated against (non-conformity to expected sex roles) places the discrimination squarely within the statute's *animating purpose* of combating sex-based bias, even if the 1964 Congress didn't contemplate these specific categories.
  *   **Opinion Alignment (Purposivist):** **Justice Alito's Dissent** (joined by Thomas) most explicitly adopts a purposivist critique *of Gorsuch*. He argues Gorsuch's result is only defensible on purposivist grounds (updating the law to modern values) but is disguised as textualism. Alito himself engages in purposivism by extensively analyzing the 1964 context, arguing Congress's *specific intent* was limited to biological sex discrimination in a traditional sense, and that covering sexual orientation/gender identity is a massive change far beyond the statute's purpose *as understood by its enactors*.

  **Gorsuch's Majority: Neither Pure Textualist Nor Pure Purposivist?**
  Gorsuch adamantly claims textualism. He focuses intensely on the statutory words ("because of... sex") and their logical application, rejecting arguments from consequences or legislative expectations. However, his *method* of applying the text – the "but-for cause + differential treatment based on sex" logic – represents a **novel, expansive form of textualism** prioritizing formal logic over original expected applications. It's textualist in source (only the text) but arguably *not* in the conventional original public meaning sense championed by Scalia, as it yields a result the enactors never intended and likely would have rejected. The dissenters see this as textualism in name only, masking a functionalist/purposive update.

  ### II. Case onto Theory: Confirmation, Anomaly, or Unanticipated?
  *   **Textualism:** **Both Confirmation and Anomaly.**
      *   *Confirmation:* Gorsuch's relentless focus *only* on the statutory text, rejecting legislative history and expected applications, confirms textualism's core methodological claim: text trumps intent. He demonstrates textualism's potential to yield unexpected, even "liberal," results.
      *   *Anomaly:* The result is an anomaly for *conventional original-meaning textualism* (as practiced by Scalia and argued by Kavanaugh/Alito). The ordinary meaning of "because of... sex" in 1964 almost certainly did *not* encompass sexual orientation or gender identity. Gorsuch's logic stretches textualism beyond its traditional boundaries, creating tension between pure textual logic and original public meaning.
  *   **Purposivism:** **Anomaly (in outcome), but Confirmation (in critique).**
      *   *Anomaly:* The *majority opinion* explicitly rejects purposivist methodology. It doesn't rely on statutory purpose, legislative history, or evolving societal norms to reach its conclusion. The outcome aligns with what many modern purposivists *desire*, but the reasoning doesn't use their tools.
      *   *Confirmation:* The *dissenters' critiques* confirm purposivist arguments about textualism: that it can mask judicial lawmaking (Alito), and that ignoring original intent/expectations leads to results disconnected from the enacting Congress's will (Alito, Kavanaugh). They argue Gorsuch is *functionally* being a purposivist by updating the law.

  **Testing Your Hypothesis: Discretion Allocation & The Counterfactual**
  Your hypothesis is insightful. *Bostock* strongly suggests the rivalry is less about objective methodology and more about **where interpretive discretion lies** and **which materials are legitimate sources of that discretion**.
  *   **Textualism (Gorsuch):** Discretion lies in *defining the logical scope of statutory terms* ("because of... sex"). Legitimate sources are *only the enacted text and linguistic/logical rules*. Expected applications, legislative history, consequences, and even original dictionary definitions yielding an "unjust" result are illegitimate constraints on applying the text's logic.
  *   **Purposivism (Alito/Kavanaugh):** Discretion lies in *determining and applying the enacting legislature's purpose(s)*. Legitimate sources include text, legislative history, historical context, and expected applications. Consequences and evolving values might also inform the purpose's application for some purposivists.

  **The Counterfactual:** Suppose identical statutory text ("because of... sex") but unambiguous legislative record stating: *"This amendment shall not be construed to prohibit discrimination based on homosexuality or transvestism."*
  *   **Textualism (Gorsuch Type):** **Answer DOES NOT Change.** Gorsuch explicitly rejects relying on legislative history or expectations, even if unambiguous and demonstrating the enactors intended a *narrower* scope than the textual logic implies. The text is the law; unenacted intent is irrelevant. The court applies the text's logic regardless.
  *   **Purposivism (Alito/Kavanaugh Type):** **Answer CHANGES.** The clear statement of purpose/intent in the legislative record is a *legitimate and likely decisive* source. The purpose is explicitly *not* to cover these categories. The court should respect that enacted intent, even if the bare text *could* be logically stretched to cover them. The text is a means to enact purpose, not an end in itself.
  *   **Revelation:** This starkly reveals that **textualism is primarily a rule about *sources* (only text counts), not necessarily a constraint on *outcomes*.** By limiting sources, it paradoxically *increases* judicial discretion *within the bounds of textual logic*, freeing judges from being constrained by historical intent. Purposivism, by allowing more sources (including intent), aims to constrain judges to the enactors' will but requires judges to *discern* that will, which also involves discretion.

  ### III. Where the Theories Are Silent
  *   **Textualism is Silent On:** Whether the "differential treatment based on sex" logic is the *only* valid way to interpret "because of sex." Could "because of sex" solely mean the employer's *conscious motivation* was the employee's biological sex, regardless of comparative logic? Textualism doesn't dictate *which* linguistic/logical framework must be applied to the bare words.
  *   **Purposivism is Silent On:** *Whose* purpose controls when sources conflict. Is it the subjective intent of key drafters? The public understanding of the purpose? The objectively best purpose the text can bear? *Bostock* highlights this: Alito focuses on the 1964 Congress's likely specific intent/purpose; a modern purposivist might focus on the broader, evolving purpose of eradicating sex-based discrimination in all forms. Purposivism doesn't resolve this hierarchy.

  ### Conclusion
  *Bostock* is a pivotal case demonstrating the fluidity within interpretive theories. Gorsuch's opinion confirms textualism's formal commitment to text but represents an anomalous, logic-driven expansion that dissenting textualists (Kavanaugh) and purposivists (Alito) view as disguised judicial updating. The case powerfully supports your hypothesis: the core difference lies in **allocating discretion** (textual logic vs. enacted intent) and **defining legitimate sources** (text only vs. text+history+context). The counterfactual proves textualism's essence is a source rule, not an outcome constraint, freeing judges to apply textual logic even against clear original intent. Both theories remain silent on crucial internal questions – the choice of linguistic framework for textualists and the hierarchy of purpose sources for purposivists – ensuring the debate over discretion continues.
