prompt: |-
  I'm a third-year undergraduate writing a term paper for a course on time, tense, and truth, and I've decided to work from my own judgments about statements concerning what has not yet happened rather than from any of the positions we've been assigned. I'd like you to tell me what principle — or small set of principles — fits those judgments, and which of them I ought to give up. My working thought, which I expect to need repair, is that a statement about the future is true just in case the world turns out the way it says, so that its truth is fixed at the time of utterance by what subsequently happens; I can't tell whether that leaves the future already settled or merely makes truth hostage to it.

  Here is what I find myself thinking.

  1. A forecaster says on Monday, "It will rain here on Tuesday," and it rains on Tuesday. I take that utterance to have been true on Monday — true when he made it, not merely vindicated later, and not something that became true only once the rain began.

  2. Same forecaster, same sentence, no rain on Tuesday. I take the utterance to have been false on Monday, not neither-true-nor-false and then false.

  3. What I resist is the step people take from 1 and 2. If the Monday utterance was true, and truth is not the sort of thing a claim acquires or sheds with the calendar, it looks as though it was already true in 1900 that it would rain here on that Tuesday. That I reject: I don't think there was any fact about that Tuesday's weather in 1900 for the claim to match. But I also don't want truth to switch on at the moment of utterance, as though the world acquired a past-tensed shadow of my claim only when someone spoke. I can't comfortably hold both.

  4. A columnist predicts that the bill will pass; it fails; the paper runs a correction. I think the correction is owed, and that "there was no fact of the matter when he wrote it" would be a dodge rather than an excuse: he told his readers to expect something that did not happen.

  5. Suppose instead a prediction that a particular unstable atom will decay within the hour, in a case where nothing whatever fixes in advance whether it does. I am much less willing to call that prediction true or false when it was made — it feels as though the world had not yet written the answer — but once the hour has passed I want to say it was, after all, right or wrong.

  6. I don't think a true prediction about what I will do makes my action unfree or unavoidable. If someone says I will order the fish and I do, I still think I could have ordered the steak; being right about what I do is not the same as making me do it.

  7. A bet on the future is settled by what happens. If I bet you that it will rain and it doesn't, I pay, and I pay because it didn't rain, not because of any verdict about whether my prediction was true when I made it. Told that there was no fact of the matter when I spoke, I would say: fine, I still owe you the money.

  8. Before a coin lands I want to say both that it might land heads and that it might land tails, and I take that to report my ignorance rather than any openness in the world. Yet when I say that tomorrow's weather is unsettled I mean something about the weather and not only about me, and I couldn't say what that something is.

  9. A pollster predicts the bill will fail; wavering members switch sides; it fails. I think his prediction was true when he made it and also helped bring about its own truth, and I don't find those two things in tension.

  10. "There will be a battle tomorrow," said today, and "There was a battle yesterday," said the day after. I want to say these say the same thing about the same battle — believing one commits me to the other — but also that the first concerns what hasn't happened and the second what has, and those cannot be the same thing to believe.

  Is there an account of the truth of statements about the future, together with an account of when it is right to assert one and when to withdraw it, that delivers these judgments or nearly all of them? If not, which should I abandon, and what does the surviving account imply for two cases I have not yet put to myself: a promise about what I will do, made in good faith and then broken, and a prediction later discovered to have been impossible from the start, the coin having been double-headed all along? Please also give me one further case of your own devising that separates the leading candidates. I am not asking for a survey of the literature; I need the principle stated precisely enough that I can see which clause is bought with which judgment, and an honest note on the judgments it cannot save.
reasoning: |-
  Okay, the user is a third-year undergraduate writing a term paper on time, tense, and truth. They're trying to develop their own position rather than relying on assigned readings. Their core idea is that future statements are true based on what eventually happens, but they're struggling with whether this implies the future is settled. They've listed ten specific judgments about future statements and want a set of principles that can accommodate most of them, along with advice on which judgments might need revision.

  Let me analyze their judgments systematically. Judgments 1 and 2 show they believe future statements have definite truth values at utterance time based on actual outcomes. Judgment 3 reveals their tension - they reject that truth was always determined (e.g., since 1900) but also dislike truth "switching on" at utterance. Judgment 4 reinforces their commitment to binary truth values for ordinary predictions. Judgment 5 introduces nuance for genuinely indeterministic cases like quantum decay, where they're hesitant about definite truth values beforehand but accept them afterward.

  Judgment 6 shows they don't see truth as incompatible with free will. Judgment 7 emphasizes practical consequences (bets) depend on outcomes, not utterance-time truth status. Judgment 8 captures their struggle with epistemic vs metaphysical unsettledness. Judgment 9 accepts self-fulfilling prophecies without tension. Judgment 10 highlights the tense puzzle: how "will be F" and "was F" can be "about" the same event yet feel different.

  The key tension points are: A) Truth determination without eternal settledness (3), B) Handling genuine indeterminism (5), C) Reconciling tense differences (10), and D) Clarifying unsettledness (8).

  For a principled solution, I'm considering a hybrid approach combining eternalism for truth conditions with a distinction between settled and unsettled futures. The core principles would be:
  1. Eternalism: All times are equally real; truth depends on actual history.
  2. Truth supervenes on history: Future statements are true/false at utterance based on actual later outcomes.
  3. Settledness distinction: Some futures are causally settled (weather), others not (quantum events).
  4. Assertion norms: Assert only what's epistemically justified (settled or probable).
  5. Tense identity: "Will be F" and "was F" refer to the same event but from different temporal perspectives.

  This resolves most judgments: 1-4,6-7,9 work via principle 2. Judgment 5 is handled by principle 3 - quantum cases aren't settled pre-outcome. Judgment 8 distinguishes epistemic might (our ignorance) from unsettled might (causal openness). Judgment 10's tension is addressed by principle 5: same event, different temporal relations.

  The main sacrifice is Judgment 3's intuition - we must accept that in 1900 it was already true about Tuesday's rain, but this is a metaphysical commitment rather than a contradiction. For their unasked cases: Broken promises are false statements (no truth-value change), just blameworthy. Impossible predictions were always false. My added test case: A prediction about quantum decay that never occurs - true pre-outcome? (Answer: no truth value until outcome).

  The user needs to decide if they can accept eternalism (truths always existed) while maintaining everyday notions of openness. The solution is philosophically costly but coherent. I'll present this as clearly as possible, noting where intuitions must yield.
answer: |-
  Below is a principled account designed to preserve your core intuitions while flagging necessary trade-offs. It combines **Eternalism** (all events in time are equally real) with a **Settledness Constraint** on truth-aptness for genuinely indeterministic futures. The core principles:

  1. **Truth Supervenes on Actual History**:  
     A statement *S* about an event at time *t* is **true at utterance-time *u*** iff the event occurs at *t* in the actual history of the world. *S* is **false at *u*** iff the event does not occur at *t* in actual history.  
     *→ Explains judgments 1, 2, 4, 6, 7, 9.*

  2. **Settledness Constraint for Truth-Aptness**:  
     A future-tensed statement *S* is **truth-apt at *u*** only if the event it describes is *causally settled* at *u*. If the event is causally open (indeterministic) at *u*, *S* lacks a truth value at *u* but **acquires one retroactively** once the event becomes settled.  
     *→ Explains judgment 5 (quantum decay lacks truth value pre-outcome) while preserving 1–4 for settled cases.*

  3. **Tense Transparency**:  
     "It will be that *F* at *t*" (uttered at *u*) and "It was that *F* at *t*" (uttered after *t*) describe the **same event** *F* and have the **same truth conditions** (i.e., occurrence of *F* at *t*). The difference is pragmatic: the former expresses epistemic/causal uncertainty; the latter expresses epistemic certainty.  
     *→ Partially addresses judgment 10 (same truth conditions) but sacrifices the intuition that they "concern different things."*

  4. **Norm of Assertion**:  
     Assert *S* about the future only if either:  
     (a) *S* is causally settled at *u* (warrants categorical assertion), or  
     (b) *S* is probable given evidence at *u* (warrants probabilistic assertion).  
     Withdraw *S* if *S* is falsified by actual history, regardless of prior justification.  
     *→ Explains judgment 4 (correction owed), judgment 8 (unsettled weather warrants "might" not "will"), and judgment 9 (self-fulfilling prophecies can be true).*

  ---

  ### **Judgments Requiring Revision**
  - **Judgment 3:** You must accept that *if "It rains Tuesday" is true on Monday, it was true in 1900*. Principle 1 demands this: truth is timelessly grounded in actual history. Rejecting this while keeping 1 and 2 is impossible. The cost: eternalism (past, present, future equally real).  
    - *Mitigation*: Distinguish *truth* (timeless) from *knowability* or *causal determination*. In 1900, Tuesday's rain was true but *unknowable* and *causally undetermined*.  

  - **Judgment 8:** Your intuition that "tomorrow is unsettled" is metaphysical (not just epistemic) **cannot be fully saved**. Principle 2 allows metaphysical unsettledness for quantum cases, but for macro-events (weather), unsettledness is epistemic.  
    - *Resolution*: Use the Settledness Constraint. "It might rain" is true iff rain is *causally possible* (open); false iff causally impossible.  

  - **Judgment 10:** You must drop the idea that "will be F" and "was F" concern "different things." Principle 3 treats them as having identical truth-conditions (both depend on *F* occurring). The difference is in the speaker's temporal perspective and epistemic access.  

  ---

  ### **Your Unaddressed Cases**
  - **Broken promise**: "I promise I’ll pay you tomorrow."  
    - If you don’t pay: The statement was **false** when uttered (via Principle 1). Truth is fixed by actual history. Moral/legal blame arises from the promise’s *normative force*, not truth-value changes.  
  - **Impossible prediction**: "This coin will land heads" (double-headed coin, unknown to predictor).  
    - The statement was **true** when uttered (it landed heads). The predictor’s ignorance doesn’t affect truth (Principle 1), but asserting it violated the Norm of Assertion (lacked evidence).  

  ---

  ### **Test Case: Separating Candidates**  
  **Scenario**: A physicist predicts: "Particle *X* will decay within 1 hour." The world is **indeterministic**: nothing fixes decay pre-outcome.  
  - **At utterance (u)**:  
    - *Your view*: No truth value (aligned with Principle 2).  
    - *Competitor (e.g., Peirceanism)*: False (since future contingents are all false).  
    - *Competitor (e.g., Ockhamism)*: True or false (truth is settled eternally).  
  - **After 1 hour (decay occurs)**:  
    - *Your view/Principle 2*: The prediction *was* true at *u* (retroactively assigned).  
    - *Peirceanism*: Still false (only present/past can be true).  
    - *Ockhamism*: True at *u* (unchanged).  

  **Why it separates theories**: Tests whether truth requires causal settledness *at utterance-time* (you) vs. timelessly (Ockhamism) vs. never (Peirceanism).  

  ---

  ### **Surviving Account Summary**  
  - **Strengths**:  
    - Preserves truth-value bivalence for *settled* futures (judgments 1–2, 4, 6–7, 9).  
    - Allows metaphysical openness (judgment 5, 8).  
    - Grounds norms of assertion/retraction (judgments 4, 8).  
  - **Costs**:  
    - Eternalism: Truths about future events *always* existed (e.g., true in 1900 that it rains Tuesday).  
    - Truth-value gaps for genuinely indeterministic events pre-outcome.  
    - "Will" and "was" are truth-conditionally identical (differ only pragmatically).  

  **Recommendation**: Defend this by arguing that *causal settledness* (not utterance-time) gates truth-aptness. This rescues most intuitions while accepting eternalism as the price for a coherent, non-contradictory system. Abandoning Judgment 3’s anti-eternalism is unavoidable if you keep 1 and 2.  

  For your term paper: Develop the **Settledness Constraint** rigorously, showing how it resolves quantum/agency cases without collapsing into global anti-realism about truth. Contrast it with Ockhamism (timeless truth) and Peirceanism (future contingents are false).
