answer: |-
  Here's the specification table for any theory of path dependence, designed as your analytical checklist:

  **Theory of Path Dependence: Desiderata**

  | Requirement                                 | Case/Consideration Forcing It                                                               | Genuine (G) or Camp Preference (CP - Whose) | What It Rules Out                                                                 | Tradeable (Y/N) |
  | :------------------------------------------ | :------------------------------------------------------------------------------------------ | :------------------------------------------ | :-------------------------------------------------------------------------------- | :-------------- |
  | **1. Explain genuine lock-in (vs. mere persistence)** | QWERTY (persists despite disputed inefficiency), Nuclear light-water reactors (safety/cost concerns) | G                                           | Calling any persistent state "path dependent"; mistaking stability for lock-in.    | N               |
  | **2. Account for contingency ("could have been otherwise")** | AC/DC current wars, VHS/Betamax (similar tech, different winner), Driving side conventions | G                                           | Deterministic explanations; inevitability narratives.                              | N               |
  | **3. Specify the mechanism(s) of lock-in**  | Network effects (QWERTY), Sunk costs (nuclear), Coordination problems (driving side, gauge) | G                                           | Vague appeals to "history"; treating path dep. as a black box.                    | N               |
  | **4. Handle cases of functional equivalence** | Driving side (left/right equally viable), Betamax arguably *not* superior, AC/DC tradeoffs | G                                           | Assuming the "locked-in" outcome is always inferior; assuming alternatives *must* be superior. | N               |
  | **5. Explain cases of *non*-lock-in**       | Metric system adoption (most countries), USB-C replacing proprietary ports, Containerization | G                                           | Theories claiming *all* persistent outcomes are path dependent.                   | N               |
  | **6. Accommodate convergent evolution**     | Camera eyes (biology), Screw threads (ISO standards), TCP/IP protocol                       | G                                           | Theories where path dep. implies *unique* outcomes; denying independent problem-solving. | N               |
  | **7. Distinguish "stuck" from "late"**      | Electric cars (delayed by tech/batteries, now viable vs. Betamax permanently obsolete?)     | G                                           | Confusing temporary delay/immaturity with permanent lock-in.                      | N               |
  | **8. Allow assessment of efficiency claims** | QWERTY (disputed inefficiency), VHS (cheaper/longer tapes arguably functional)              | G                                           | Assuming lock-in *always* implies inefficiency or *never* does.                   | Y               |
  | **9. Be compatible with evolutionary biology** | Convergent evolution vs. historical contingency (Gould's "tape of life")                    | G (Constraint)                              | Theories requiring extreme uniqueness (no convergence) or extreme determinism.     | N               |
  | **10. Avoid collapsing contingency & multiple viable options** | Driving side (contingent choice *among* viable options) vs. unique optimal solution.        | G                                           | Equating "contingent" with "arbitrary" or "suboptimal"; assuming contingency implies many equally good options. | N               |
  | **11. Provide criteria for "degree" of path dependence** | QWERTY (moderate? Debated) vs. Railway gauges (strong network lock-in) vs. Imperial units (weaker, mixed use) | CP (Quantifiers)                            | Treating path dep. as binary (yes/no); inability to compare cases.                 | Y               |
  | **12. Distinguish world vs. explanatory fact** | Is Betamax's loss *inherently* lock-in, or just *our best explanation* given the evidence? | CP (Realists vs. Pragmatists)               | Ontological overreach (calling everything lock-in) or excessive skepticism.       | Y               |
  | **13. Allow for path *creation* (not just dependence)** | Internet protocols (deliberate design creating new path), Bitcoin (new institutional path)  | CP (Institutionalists)                      | Purely reactive theories; ignoring agency in shaping paths.                       | Y               |

  **Key Insights from the Spec:**

  1.  **The Unsatisfiable Pair?** Potentially **#8 (Efficiency Assessment)** and **#11 (Degree of Path Dependence)**. Rigorously judging the *efficiency* of the locked-in outcome vs. alternatives is often empirically fraught (QWERTY debates). Quantifying the *degree* of path dependence (#11) requires defining metrics for lock-in strength and contingency, which is highly context-dependent and lacks universal scales. A theory might handle one well but struggle with the other robustly across all cases.
  2.  **Most Restrictive Requirement:** **#1 (Explain Genuine Lock-in vs. Mere Persistence)**. This rules out the most common misuse: labeling any persistent, suboptimal, or contingent outcome as "path dependent" without demonstrating a specific lock-in *mechanism* (like increasing returns, coordination failure, sunk costs) that makes change prohibitively costly *even when* potential improvements exist. It forces specificity.
  3.  **World vs. Storytelling?** It's **both, but the balance is crucial.** There are *real mechanisms* in the world that create increasing returns, coordination problems, and sunk costs that genuinely make switching paths difficult or costly (e.g., retraining billions on Dvorak, rewiring a continent's grid). This is ontological path dependence. However, *identifying* and *labeling* a situation as "path dependent" (#12) is often an explanatory move. We use it when deterministic or pure efficiency explanations fail, and we need to invoke historical accident amplified by feedback loops. The danger lies in storytelling *without* grounding in identifiable mechanisms (confusing #2 Contingency with #1 Lock-in) or invoking lock-in as a catch-all for any persistent outcome we don't like. A good theory must ground the storytelling in identifiable worldly mechanisms.

  **On Your Distinctions:**

  1.  **"Stuck" vs. "Late":** **Crucial Distinction (Aligned with #7).** "Stuck" implies a mechanism actively *prevents* switching to a now-viable alternative (lock-in, path dep.). "Late" implies the alternative simply wasn't feasible earlier due to technology, cost, knowledge, etc., but its emergence was likely/inevitable once barriers fell (e.g., electric cars pre-Li-ion vs. post-Li-ion). A good theory must separate these.
  2.  **World vs. Explanation:** **Vital Distinction (Aligned with #12).** Is the lock-in a real causal force in the system, or is "path dependence" just the label we apply because our usual explanations (efficiency, optimization) don't fit? The best theories recognize the real mechanisms but acknowledge that *applying the concept* is an interpretive act dependent on available evidence and counterfactuals.
  3.  **Contingency vs. Multiple Viable Options:** **They Can Come Apart.** Contingency (#2) means the outcome depended on specific, potentially minor, historical events (a random meeting, a lucky break). Multiple viable options (#4) means several alternatives *could* have sustained themselves *if* chosen. You can have:
      *   **Contingency + Multiple Viable Options:** Driving side conventions. A random early choice locked in one, but the other was equally viable.
      *   **Contingency + Single Viable Option:** Maybe Betamax? Contingent events led to VHS winning, but *if* Betamax had won, it *might* have been just as viable long-term (functional equivalence debate) *or* perhaps not (making it not truly viable).
      *   **Determinism + Single Viable Option:** Outcome was inevitable and only one solution works (rare in social/tech contexts).
      *   **Determinism + Multiple Options?** Logically odd; if deterministic, only one path unfolds. Path dependence theory primarily deals with the first quadrant: Contingency + Multiple Viable Options leading to lock-in. The distinction matters because claiming "contingency" doesn't automatically mean the losers were good options.

  **On "More Path Dependent":** It **is coherent and necessary (#11)**, but hard. Factors could include: *Strength of lock-in mechanism* (How costly is switching? Impossible? Very expensive?), *Degree of contingency* (How sensitive was the outcome to minor early events? Could a tiny nudge have changed it?), *Number of plausible alternatives at the branching point*. A theory needs *some* way to compare, even if qualitative.

  **Using the Checklist:** When someone says "X is path dependent," ask:
  1.  What's the **lock-in mechanism**? (Requirement #1, #3)
  2.  How was it **contingent**? (#2)
  3.  Were there **viable alternatives** at the time? (#4, #10)
  4.  Is it truly **stuck**, or just **late/immature**? (#7)
  5.  What **evidence** challenges this? (e.g., Non-lock-in cases #5, Convergence #6)
  6.  Are they confusing **persistence/contingency** with genuine **lock-in**? (#1, #2, #7)

  This spec forces clarity on mechanisms, contingency, alternatives, and the boundaries of the concept, separating robust analysis from storytelling.
