prompt: |-
  I'm not a philosopher, I just read a lot of it and I manage a small team, and there's a pattern I keep running into that I dont have a word for.

  Here it is. Everyone already knows the thing — the deadline is impossible, the plan is bad, the office kitchen is disgusting. Everyone also knows that everyone else knows; there's no secret and nobody's fooling themselves. And nothing happens. Then one person says it out loud, once, in a normal voice, in front of everybody, and within a week the whole situation flips, and afterward people talk as if it had always been obvious and there was never any gap at all. What bugs me isn't secrecy, because there wasn't any. The fact was fully known the whole time and it did zero work until it got said.

  Second case, same shape but more personal. Two people in a long partnership, both privately sure it should end, both sure the other is sure. Nothing happens for a year. Then one of them says it, once, and nobody is surprised.

  But here's the case that wrecks my theory. Everyone I know dislikes the restaurant we keep going to. We have all said so, out loud, to each other, many times, in groups. Nothing ever changes. So saying it in public can't be the whole mechanism. (Saying it in private definately isn't — someone told me months ago, just me, that the deadline was impossible, and I did nothing about it.)

  My hunch is that what flips a situation isn't information, since nothing was unknown, but something about who has to go first, or what it costs to be the one who says it, or what becomes allowed once somebody has said it. I can't tell if that's one thing or three, and I can't tell whether the missing piece is really knowing the fact or knowing that other people will actually act on it — which feels like a different kind of thing to know.

  So: is there an established name for the gap between everyone knowing a thing and it being out in the open? More to the point, does the best-fitting name actually cover cases like mine, or only the easy ones? And what separates the cases that flip from the restaurant that doesn't?

  Don't just hand me a label and stop — the edges are the point. Write it in American English, skip the reading list, and give me these sections in this order:

  1. "Short answer" — three to five sentences. Does it have a name, and what's the closest fit.
  2. "Closest existing terms" — three named concepts, about 120 words each: what each one covers, and exactly where it stops covering my cases.
  3. "What saying it out loud actually does" — about 250 words, and say plainly if the answer is that it isn't about knowledge at all.
  4. "The case that doesn't fit" — about 150 words on my restaurant case and what it rules out.
  5. "If nothing fits, coin it" — a name, a one-sentence definition, and three boundary cases: one clearly in, one clearly out, one you're undecided about.
reasoning: |-
  Hmm, the user is describing a fascinating pattern they've observed in group dynamics. They're a manager who reads philosophy but isn't a specialist, and they're noticing how certain unspoken truths remain inert until someone voices them publicly - even when everyone already knows them. 

  The core frustration seems to be about the gap between collective awareness and collective action. What's interesting is they've already identified key nuances: it's not about secrecy (since everyone knows), it's not about the content of the information (since it doesn't change), and private acknowledgment doesn't trigger change. The restaurant case complicates things because there speech happens but nothing changes.

  I notice they're very precise about what they want from me: no jargon dumps, no reading lists, American English, and a specific five-part structure. They're clearly thought deeply about this and want equally precise thinking in return. The real meat is in the boundaries - why some voiced truths catalyze change while others don't.

  The challenge is that existing concepts like pluralistic ignorance or the spiral of silence don't quite fit because they assume people don't know others' true thoughts. Here everyone knows. Even psychological safety frameworks don't fully capture why vocalization itself unlocks action.

  For the restaurant puzzle, I'm realizing the missing element might be the locus of responsibility. When someone names the deadline problem at work, it implicitly assigns accountability ("this needs fixing and we're the ones who must fix it"). With the restaurant, complaining may actually reinforce inaction by distributing responsibility ("we all agree it's bad but nobody feels empowered to break the routine").

  The coining part is tricky. "Accountability crystallization" feels close - that moment when naming something makes it impossible to ignore as a collective responsibility. But I need to test it against their cases: it should explain why the deadline comment works (assigns action to the team) but restaurant complaints don't (no clear owner for change).
answer: |-
  Here’s a breakdown tailored to your observations, focusing on the gap between collective knowledge and action:

  ### 1. Short Answer
  No single established term perfectly captures your cases. The closest fit is **pluralistic ignorance**, but it fails because your scenarios lack actual ignorance—everyone *knows* the truth. **Psychological safety** touches on the cost of speaking up but doesn’t address why action follows only after vocalization. **Common knowledge** (a game theory term) comes nearer but still misses the "action trigger" element you describe.

  ### 2. Closest Existing Terms
  - **Pluralistic Ignorance**: When individuals privately reject a norm but assume others accept it, leading to public conformity. *Fails your cases*: Everyone actually knows the truth *and* knows others know it. No false assumption exists.  
  - **Spiral of Silence**: People stay silent to avoid isolation if they believe their opinion is unpopular. *Fails your cases*: Silence persists *despite* universal private agreement. The issue isn’t fear of isolation but the inertia of unstated consensus.  
  - **Common Knowledge**: A fact is "common knowledge" if everyone knows it, everyone knows that everyone knows it, and so on. *Fails your cases*: It explains shared awareness but not why action requires vocalization despite this. Your deadline/partnership cases show common knowledge exists *before* speech, yet nothing changes.

  ### 3. What Saying It Out Loud Actually Does  
  It’s **not about knowledge transfer**—it’s about **shifting accountability**. Vocalizing a shared truth does three things:  
  - **Assigns agency**: The speaker implicitly nominates themselves (or the group) as responsible for acting. Saying "This deadline is impossible" forces the manager (you) to either defend it or change it, making inaction untenable.  
  - **Creates a coordination point**: Public articulation transforms private certainty into a collective reference. Once spoken, the fact becomes a "tool" the group can use to coordinate ("Since we all agree X, let’s do Y").  
  - **Lowers the cost of action**: The first speaker absorbs the social/emotional risk (e.g., being the "complainer"). Once spoken, others can act without that cost—they’re just aligning with the now-public norm.  

  ### 4. The Case That Doesn’t Fit  
  **The restaurant fails** because vocalizing disgust doesn’t assign agency or create coordination. Complaints like "This place is awful" are **rhetorical, not instrumental**—they vent frustration but lack a clear call to action or responsible party. Unlike the deadline (which implicates *your* authority) or the partnership (which demands mutual honesty), the restaurant has no clear "owner" of change. It’s socially easier to keep complaining than to propose/manage alternatives (e.g., finding new spots). This rules out theories claiming *any* public utterance triggers change—**the content must imply an obligation or enable coordination**.

  ### 5. If Nothing Fits, Coin It  
  **Accountability Crystallization**: The moment a publicly stated fact transforms latent shared knowledge into an obligation to act.  
  - **Clearly in**: Your deadline case. Saying "This is impossible" crystallizes your duty as manager to fix it.  
  - **Clearly out**: The restaurant gripes. Speech occurs but implies no action—no accountability is assigned.  
  - **Undecided**: A team agrees a project is failing. One member says, "We need to pivot." If the group expects *them* to lead the pivot, it’s crystallization. If it’s just added to the "complaint pile," it’s not.
