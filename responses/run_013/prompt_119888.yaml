prompt: |-
  So I've been drafted at the last minute to cover a session for a lecturer who's away — it's an 80-minute slot with second-year undergrads in a metaphysics unit, they've done properties and modality but nothing at all on dispositions, and the topic I've been handed is dispositions with a reading that's mostly about finks and masks. I know this material well enough to talk for an hour but I've never taught it and I'm worried I'll do the classic thing of unloading the counter-examples before they've felt the pull of the view being attacked. Don't explain finks and masks to me — plan how I should teach them. What has to be in place before the first counter-example lands, i.e. the dependency order: does the simple "would break if struck" analysis have to be stated and half-believed before I show it failing, and where exactly does the fink go relative to the mask, and the mimic relative to both? Which single case should carry the whole session — I want one example I can twist three ways so they see it's one phenomenon with three different twists rather than three unrelated puzzle-cases, and I need to know what that case has to have (a disposition everyone grants, an interference that's clearly the stimulus itself in one version and clearly external in another) and what it has to lack so it doesn't smuggle in extra controversy. And the misconceptions: I'm expecting at least "a disposition is just a tendency, a statistical frequency", "the fink shows there are no dispositions at all", and "fink and mask are the same thing, something got in the way" — but I bet there are ones I'm not seeing. Tell me which they'll actually form, in the order they'll form them, and at which point in the sequence I should head each one off, and which ones I should let them form on purpose because the confusion is load-bearing.

  Two more things. I have two cases of my own I want to use and I'm not sure they're any good: (a) a shy person who is genuinely chatty with friends but who, the moment the friends actually turn up, gets anxious and goes silent — I think that's a fink, because the stimulus itself kills the disposition rather than merely blocking it; and (b) a lift whose doors are disposed to close when you press the button, except a sensor reopens them whenever something breaks the beam — I think that's a mask, since the disposition to close is still there and something outside it is just stopping the manifestation. Tell me whether those are right, which if either should be the carrying case, and if they're wrong, what they actually are and what a corrected pair would look like. Also, I keep seeing mask, antidote and mimic used almost interchangeably in what I've read and I can't tell which usage is standard — just fix a consistent set of labels for the session and stick to them, and flag if the fink/mask line is shakier then the textbooks make out, because I'd rather the students leave with a live worry than a tidy taxonomy they'll parrot back.

  Finally: what do I have to leave out at this level? I'm thinking the whole dispositional-essentialist use of finks to explain laws of nature, and the intrinsic/extrinsic argument about whether dispositions are real properties — tell me if that's the right cut, and give me a sentence I can say out loud to them to mark the cut without making it sound like I'm hiding the good bit. And one question to ask in the last five minutes that would actually show me whether they've got the distinction, or are just nodding along at the vocabulary.
reasoning: |-
  Okay, the user is stepping in last minute to teach a metaphysics session on dispositions, focusing on finks and masks. They're familiar with the material but haven't taught it before and are worried about overwhelming students with counter-examples too early. I need to help them structure the session effectively.

  The key challenge is building the dependency order - students need to understand the simple conditional analysis (SCA) before seeing why it fails. The user wants one core example that can be twisted to show finks, masks, and possibly mimics as variations of the same problem. They also have two personal examples (shy person and elevator doors) and want validation.

  First, the dependency order is crucial. Start with the intuitive pull of SCA using everyday dispositions (glass fragility). Make students feel why we'd think "disposition = conditional" makes sense before dismantling it. The first counter-example (fink) should come only after they've bought into SCA.

  For the core example, I'll suggest a "breakable glass" case because it's concrete and twistable. The user's shy person example actually works better as a fink case than their elevator example, which confuses mask and mimic mechanisms. I'll refine these into a cohesive set.

  Common misconceptions will likely include: conflating dispositions with frequencies, thinking finks disprove dispositions entirely, and blurring fink/mask distinctions. I'll map when these typically arise and how to preempt them - especially the "finks mean no dispositions" error which needs early correction.

  The user's examples need adjustment. The shy person is a good fink (stimulus removes disposition), but the elevator is actually a mimic (disposition missing despite appearance). I'll suggest a corrected mask example (e.g., fortified glass) and clarify terminology: finks (disposition removed by stimulus), masks (disposition present but blocked), mimics (no disposition despite behavior).

  For scope limits, I agree to skip dispositional essentialism and intrinsic/extrinsic debates. The exit question should force application: "Is this a fink, mask, or mimic?" with a case that reveals their grasp of the causal mechanism distinction.

  The session arc should be: Hook (dispositions matter) → Intuition pump (SCA) → Fink counter-example → Mask counter-example → Mimic contrast → Taxonomy clarification → Misconception cleanup. All anchored to variations of one glass example.
answer: |-
  Here's a battle-tested lesson plan focusing on conceptual clarity and avoiding premature counterexample overload, using your core ideas and refining your examples:

  **Core Principle:** They must *feel the pull* of the Simple Conditional Analysis (SCA) before seeing it break. **Dependency Order is Crucial:**

  1.  **The Intuitive Pull of Dispositions (10 mins):**
      *   Start with **everyday examples** everyone accepts: Glass is fragile (disposed to break if struck). Sugar is soluble (disposed to dissolve if placed in water). Wire is conductive (disposed to conduct electricity if a voltage is applied).
      *   **Question:** "What *is* fragility? What *makes* the glass fragile right now, even when it's sitting safely on the table?" Elicit ideas. Guide towards the intuitive answer: "It's fragile *because* it *would* break *if* it were struck."
      *   **Formalize SCA:** "So, one very tempting idea is this: To have a disposition D to manifest M in response to stimulus S just *is* for it to be true that: **If S were to occur, then M would occur.** Fragile = Would break if struck. Soluble = Would dissolve if immersed."
      *   **Sell SCA:** Emphasize its simplicity, elegance, and how it captures the core intuition linking dispositions to counterfactual conditionals. Make them *want* it to be true.

  2.  **Introducing the Threat: Interference (5 mins):**
      *   "But... things can get in the way, right? Imagine the glass is wrapped in bubble wrap. If you strike it *gently* (through the wrap), it *wouldn't* break. Does that mean it's *not* fragile?" (Most will say "No, the bubble wrap just protected it.")
      *   **Key Point:** "So, intuitively, the bubble wrap doesn't *remove* the glass's fragility, it just *prevents* the breaking from happening *this time*. The disposition is still there, but its manifestation was **blocked**." Plant the seed for "masking".

  3.  **The First Counterexample: FINK (The Killer Stimulus) (20 mins)**
      *   **Set-up:** "Now, imagine a *different* kind of interference. Imagine a special 'Fragile Glass' protected by an invisible force field. **This force field is designed to instantly make the glass super-strong *only if* it's about to be struck.**"
      *   **Scenario:** "The glass is sitting there, fragile. You swing the hammer towards it. The moment the hammer starts its swing *towards* the glass (the stimulus S begins to occur), the force field activates instantly, changing the glass's internal structure to make it non-fragile *before* the hammer makes contact. The hammer hits the now super-strong glass... and bounces off. No break."
      *   **Crucial Question:** "**According to the Simple Conditional Analysis (SCA):** If the glass were struck (S), would it break (M)? NO. Therefore, SCA says the glass is *not* fragile. But *is* it fragile before the hammer starts swinging? Intuitively, YES! It *was* fragile. The *stimulus itself* (the impending strike) *caused* the disposition to be lost *before* the manifestation could happen. The stimulus **finked** the disposition."
      *   **Why it breaks SCA:** SCA requires the *same object* that has the disposition *when S occurs* to manifest M. The fink changes the object *during* S (or just before M would happen), so the object that *would* manifest M isn't the same as the one that *had* D when S started. SCA gives the wrong answer.
      *   **Your Shy Person Example (Perfect Fink):** "Think about your shy person. They *are* genuinely chatty (disposed to talk when friends arrive - S). But the *very act* of the friends arriving (S) triggers such intense anxiety *instantly* that it *destroys* the chatty disposition *before* any talking can happen. The stimulus finks the disposition. SCA fails: If friends arrived (S), would they talk (M)? Probably not. But they *were* disposed to talk before S occurred." **USE THIS!**

  4.  **The Second Counterexample: MASK (The Blocker) (20 mins)**
      *   **Set-up:** "Back to blocking. But not all blocking is like bubble wrap. Imagine our fragile glass again. Now, it's sitting next to a powerful electromagnet. **The glass has been secretly treated: it's still intrinsically fragile, *but* it has a tiny iron filament inside. The electromagnet is set up so that *if* the glass is struck, it instantly activates a magnetic field that *holds the glass rigidly together*, preventing shattering.**"
      *   **Scenario:** "Glass is fragile. You strike it (S). The magnet activates *instantly* upon impact, holding the glass together with immense force. It doesn't break (M does not occur)."
      *   **Crucial Question:** "**According to SCA:** If struck (S), would it break (M)? NO. So SCA says it's not fragile. But *is* it fragile? Intuitively, YES! It *was* fragile when struck. The fragility *was* there, trying to cause breaking. The magnet *interfered* with the *manifestation process*, preventing the breaking *despite* the disposition being present and triggered. The magnet **masked** the disposition."
      *   **Why it breaks SCA:** SCA requires M to follow S. Here, S happens, D is present, but M is prevented by an external interferer acting *concurrently*. SCA gives the wrong answer. The disposition is still there, but its effect is masked.
      *   **Bubble Wrap vs. Electromagnet:** Contrast this with the earlier bubble wrap (which might just prevent S from being properly applied - a weaker, perhaps non-standard mask). The electromagnet *allows* S to occur fully on an object with D, but directly blocks M. That's the core mask.

  5.  **Contrast: MIMIC (The Imposter) (10 mins)**
      *   **Set-up:** "Now imagine a *different* glass. It looks identical. But it's *not* fragile at all; it's incredibly tough. However, it's connected to a hidden device. **This device is set to *explode* the glass into pieces *if* it is struck, making it *look* like it shattered from fragility.**"
      *   **Scenario:** "You strike the tough glass (S). The device detects the strike and instantly explodes the glass (M). It breaks."
      *   **Crucial Question:** "**According to SCA:** If struck (S), would it break (M)? YES. So SCA says it *is* fragile. But *was* it fragile? Intuitively, NO! It was tough. The breaking was caused *entirely* by the hidden device, not by any intrinsic disposition to break. It **mimicked** fragility."
      *   **Why it breaks SCA:** SCA can be *accidentally* satisfied by something that *lacks* the disposition D but is rigged to produce M when S happens anyway. SCA gives the wrong answer (false positive).

  **Your Elevator Example - Analysis & Correction:**
  *   **The Setup:** Disposed to close when button pressed (S). Sensor reopens if beam broken.
  *   **What it actually is:** This is **primarily a MIMIC for the disposition "Disposed to *close and stay closed* when the button is pressed"**.
      *   SCA: "If button pressed (S), would doors close *and stay closed* (M)? NO (they reopen if beam broken). So SCA says *no* disposition. Is there a disposition to close and stay closed? Intuitively, YES, but the sensor *prevents* the full manifestation (staying closed). This looks like a **MASK** for "close and stay closed".
      *   **BUT**, it's **also potentially a MIMIC for the disposition "Disposed to *move* when the button is pressed"**.
      *   SCA: "If button pressed (S), would doors *move* (M)? YES (they start closing). So SCA says *yes* disposition. Is there a real disposition to move? Probably YES (the motor). No mimic here, just a mask preventing *full* closure.
  *   **Problem:** It's messy because the manifestation "M" is ambiguous (close? close and stay closed? move?). **Corrected Mask Example:** Use the electromagnet glass or a soluble pill coated in an impermeable shell that instantly dissolves upon immersion, forming a barrier that prevents water reaching the pill (masking solubility). **Corrected Mimic:** Use the exploding tough glass.

  **The Carrying Case:** **USE YOUR SHY PERSON!** It's relatable and clearly illustrates the **fink**.
  *   **Twist 1 (Fink - Original):** Friends arriving (S) *causes* loss of chatty disposition (D) *before* talking (M) can occur. SCA fails (If S, M? No. But D present before S).
  *   **Twist 2 (Mask):** The person *is* chatty (D). Friends arrive (S). They *start* to talk (M begins). But instantly, a loud noise outside (external interferer) distracts them so severely they clam up. D was present, S occurred, M started but was *blocked*. (Mask).
  *   **Twist 3 (Mimic):** A *very* shy person (no disposition to chat) has a hidden earpiece. *If* friends arrive (S), their therapist *tells them exactly what to say* via the earpiece, making them *seem* chatty (M). SCA satisfied (If S, M? Yes), but no real chatty disposition (D) – it's mimicked.

  **Taxonomy Fix (Stick to this!):**
  *   **Fink:** Stimulus S (or its imminent occurrence) *causes the loss* of disposition D *before* M can occur. (D is *destroyed* by S).
  *   **Mask:** Disposition D is *present*, stimulus S *occurs and triggers D*, but an *external* factor *interferes* and *prevents* manifestation M *despite* D being triggered. (D is *blocked*).
  *   **Mimic:** Object *lacks* disposition D, but is rigged so that *when* S occurs, M happens *anyway* (often via a hidden mechanism), making it *falsely appear* to have D. (D is *faked*).
  *   **Flag the Shaky Line:** "Notice the key difference: Does S *remove* the disposition itself (Fink), or does something *block* the manifestation while the disposition is still there and triggered (Mask)? The mimic is different again – there's *no real disposition* at all. Philosophers sometimes debate *exactly* where to draw these lines, especially between masks and finks in complex cases. Focus on the core mechanisms: removal vs. blocking vs. faking."

  **Common Misconceptions & When to Address Them:**
  1.  **"Dispositions are just tendencies/frequencies." (Likely arises during Step 1)** *Head off immediately:* "Good point! But think: A *single* glass can be fragile even if it never gets struck. Fragility is about *what it would do* in certain situations, not what it *has* done or *will* do on average. We're talking about a *single object's potential*, not statistics." (Crucial for understanding counterexamples are about *single cases*).
  2.  **"Finks show there are no dispositions at all!" (Likely arises after Step 3)** *Head off immediately:* "Hold on! The *point* of the fink case is that the glass *was* fragile *before* the hammer swung, even though SCA fails to capture it. Finks show SCA is *wrong*, not that dispositions don't exist! We need a *better way* to understand what dispositions *are*." (This is load-bearing! Don't let nihilism take root).
  3.  **"Fink and mask are the same thing - something got in the way." (Likely arises during/after Step 4)** *Let this form, then use it to deepen understanding:* "Great instinct! They both involve things going wrong. But *how* does it go wrong? In the fink, *the disposition disappears*. In the mask, *the disposition is still there, fighting to manifest, but something stops it*. That's the crucial difference we need to capture. The shy person *stops being chatty* when friends arrive (fink) vs. the shy person *tries to talk* but is interrupted by a noise (mask)." (This confusion is productive to resolve).
  4.  **"So dispositions are just whatever we say they are?" (May arise late)** *Address if it comes up:* "Not quite. The counterexamples show the *simple conditional* doesn't define them. But the *intuition* remains strong: The glass *was* fragile before the fink, its solubility *was* masked by the coating. The challenge is to find a theory (maybe involving underlying categorical properties, maybe not) that captures these intuitions *better* than SCA." (Point towards deeper metaphysics without diving in).

  **What to Leave Out & How:**
  *   **Dispositional Essentialism/Laws:** Absolutely right. "We're focusing on understanding dispositions *themselves* and the challenges in defining them clearly. We won't be diving into the bigger debates today about whether dispositions *fundamentally explain* laws of nature or what the world is *really* made of, though those are fascinating questions arising from this groundwork."
  *   **Intrinsic/Extrinsic Debate:** Also correct. "Similarly, we're setting aside the complex question of whether dispositions must be *intrinsic* properties or if they can depend on external circumstances – that's a crucial debate, but one step beyond our focus on the basic structure of dispositions and the problems for the simple analysis."

  **The Exit Question (Last 5 mins):**
  > "Imagine a standard, unmodified, ordinary house brick. It's not fragile. Now, imagine we attach a tiny, incredibly sensitive explosive charge *to the brick*. This charge is wired to detonate *only if* the brick is struck sharply with a hammer, shattering the brick into pieces. **Is this explosive brick a case of a Fink, a Mask, or a Mimic for fragility? Explain *why* in one sentence focusing on the disposition and the mechanism."**

  *   **Why it works:** It clearly lacks the intrinsic disposition (not fragile). The explosion *causes* the breaking *when* struck, mimicking fragility. It tests understanding of mimic vs. mask/fink. If they say "Mask", they missed the lack of real disposition. If they say "Fink", they misunderstood the mechanism. "Mimic" with the right reason shows they grasp the core distinction. It uses a novel example, forcing application, not just recall.

  **Session Flow Summary:**
  1.  Hook & Intuition (Dispositions Matter) (5 min)
  2.  Build SCA Intuition Pump (Everyday Examples) (5 min)
  3.  Introduce SCA Formally & Sell It (5 min)
  4.  Tease Interference (Bubble Wrap - weak mask) (5 min)
  5.  **FINK:** Shy Person / Force Field Glass (20 min) - SCA FAILS (False Negative)
  6.  **MASK:** Electromagnet Glass / Shy Person Interrupted (20 min) - SCA FAILS (False Negative)
  7.  **MIMIC:** Exploding Brick / Therapist Shy Person (10 min) - SCA FAILS (False Positive)
  8.  Taxonomy Clarification & Shaky Line Warning (5 min)
  9.  Address Lingering Misconceptions / Q&A (5 min)
  10. Exit Question (5 min)

  **Key to Success:** **Pace the SCA build-up.** Don't rush Steps 1-3. Make them *feel* the appeal. Then, deploy the counterexamples decisively, emphasizing *why* SCA gives the *wrong* answer in each case and *what intuition* it violates. Your shy person example is gold – use it prominently. Good luck! You've got this.
