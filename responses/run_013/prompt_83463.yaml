  Okay, the user is drafting a scientific annex for a sentience statute that categorizes animals into three tiers of protection. They need desiderata for theories of consciousness to ensure they're adequate for legal use. Let me start by breaking down their query.

  First, they mention specific cases: dog, honeybee, shrimp, oyster, sea sponge. These examples test the theory's ability to handle clear and borderline cases. The theory must classify these correctly, especially where pre-theoretic intuitions are strong (like dogs needing full protection) or weak (like sponges). Also, it needs to address animals like oysters where there's disagreement. So, correctness across these cases is crucial, but I should note that firm verdicts are non-negotiable only for obvious cases.

  Next, distinctions like phenomenal consciousness vs. nociception. The statute mustn't confuse reflexive responses with actual suffering. The theory should distinguish capacity to suffer from rich experiences and subject vs. agent. Gradedness is tricky because even if consciousness is a spectrum, the law needs thresholds. The theory must define what the boundaries are based on, which is non-negotiable.

  Empirical results are another point. The theory shouldn't contradict well-established findings. For example, animals without layered cortices but showing complex behavior (like birds or octopuses) must be accounted for. Also, handling taxa where experiments aren't feasible requires a principled approach. Non-contradiction of robust data is non-negotiable, but dealing with untestable cases might need pragmatic solutions.

  Practical constraints include feasible evidence collection. Legislative bodies can't conduct invasive tests, so the theory must use accessible data. It should apply to individual animals, not just species averages, and have defaults for indeterminate cases. Feasible evidence and defaults are non-negotiable, while individual assessment is a preference but important for fairness.

  Stability constraints involve taxonomy changes and different animal states. Splitting or lumping species shouldn't alter protection tiers. Also, assessments must work for juveniles, sleeping, or injured animals. Taxonomy independence is non-negotiable to avoid arbitrary changes, while state-invariant measures are preferred but harder to achieve.

  Now, conflicting desiderata. For example, needing firm verdicts vs. avoiding invasive experiments. Some animals might require tests that aren't feasible, creating a gap. Also, individual assessment vs. stable taxonomy: individual variability might clash with species-level categorization. Gradedness and thresholds pose another conflict; setting boundaries on a continuum is inherently subjective.

  The most demanding requirement is likely feasible evidence. Many theories rely on neural structures that need invasive methods, which aren't practical for legislation. This probably excludes several current theories. The parochial demand might be requiring individual assessments. While ideal, it's resource-intensive and may stem from specific ethical views rather than practical necessity.

  I should also consider if any desiderata can't be jointly satisfied. For instance, non-contradiction of empirical data (like birds' consciousness without cortex) and feasible evidence. If the best markers require invasive tests, but legislation can't use them, there's a conflict. Similarly, gradedness and stable thresholds involve trade-offs between scientific accuracy and legal need for clear categories.

  The user's deeper need is to expose trade-offs in the framework, showing that the statute isn't just applying science but making ethical choices. Highlighting conflicts, like between gradedness and thresholds, serves this purpose. They also need the theory to be legally operational, so practical constraints are critical. Recognizing these tensions helps in drafting a transparent annex that acknowledges its own limitations and biases.
answer: |-
  Here are the desiderata for a theory of consciousness suitable for legislative tiering, structured by your requirements, with motivations, negotiability flags, and analysis of conflicts. The core challenge is balancing scientific validity, ethical relevance, and administrative practicality.

  **I. Desiderata & Motivations**

  1.  **Correct Classification (Firm Verdicts):**
      *   **Demand:** Must correctly classify paradigmatic cases where pre-theoretic consensus is strong (e.g., Dog -> Full Protection; Sea Sponge -> No Protection).
      *   **Motivation:** Anchors the system in widely shared moral intuitions and ensures core credibility. Failure here renders the statute ethically arbitrary or scientifically implausible.
      *   **Non-Negotiable:** Yes (for firm cases like Dogs/Sponges). Borderline cases (Oyster, Shrimp) test the theory's coherence but firm misclassification is fatal.

  2.  **Correct Classification (Borderline Cases):**
      *   **Demand:** Must provide *principled, evidence-based* classifications for scientifically/ethically contested cases (Honeybee, Shrimp, Oyster). Need not match universal intuition, but must be defensible.
      *   **Motivation:** Statute must cover the full animal kingdom; leaving common/contested cases unaddressed invites legal challenges and policy paralysis.
      *   **Non-Negotiable:** Partially. The *requirement to classify* them is non-negotiable. The *specific verdict* is negotiable *if* the theory provides strong, consistent rationale based on its core principles. The theory must *attempt* a verdict.

  3.  **Avoiding Conceptual Collapses:**
      *   **a) Phenom. Consciousness vs. Responsiveness/Nociception:** Must distinguish genuine subjective experience from mere reflex, tropism, or basic nociceptive signaling without affect.
      *   **b) Suffering vs. Rich Experience:** Need not equate them, but must clearly identify the *minimal* markers for the capacity to suffer (the ethically crucial trigger for basic protection).
      *   **c) Subject vs. Agent:** Must be able to attribute sentience/phenomenality without requiring complex agency, self-awareness, or reasoning.
      *   **d) Gradedness vs. Threshold:** Must provide a clear conceptual basis for *where* tier boundaries are drawn *within* a graded spectrum (e.g., boundary between no/basic protection marks the emergence of phenomenal affect; basic/full marks significantly richer integrated world models).
      *   **Motivation:** Legal categories require conceptual clarity. Mistaking reflexes for suffering leads to over-/under-protection. Tiers need operational definitions tied to ethically relevant capacities, even if consciousness itself is graded.
      *   **Non-Negotiable:** (a) Absolutely. (b) Absolutely re: suffering marker. (c) Absolutely (sentience ≠ intelligence). (d) Absolutely – the theory *must* define the boundaries.

  4.  **Empirical Fidelity:**
      *   **a) Non-Contradiction:** Must not contradict well-established, robust empirical findings (e.g., complex cognition/behavior in birds, cephalopods, fish despite non-layered cortex; dissociation of nociception and pain behavior in some contexts).
      *   **b) Untestable Taxa:** Must provide a *principled framework* for extrapolation to untestable taxa (e.g., deep-sea organisms, microscopic invertebrates) based on phylogeny, functional analogy, or conserved mechanisms, *not* simply ignorance = no protection.
      *   **Motivation:** Scientific credibility and avoiding anthropocentrism. Ignoring evidence from non-mammals invalidates the science. Lack of direct testability is common; the framework must guide reasonable inference.
      *   **Non-Negotiable:** (a) Absolutely. (b) Absolutely – requires a default rule *based on the theory's principles*.

  5.  **Practical Feasibility:**
      *   **a) Non-Invasive Evidence:** Verdicts must be derivable from evidence obtainable without harming the animal or requiring highly specialized lab settings (e.g., observable behavior, natural history, neuroanatomy from ethically sourced cadavers, established physiological markers).
      *   **b) Individual Assessment (Ideal):** Should ideally allow assessment of individual animals (e.g., severely brain-damaged dog, exceptionally intelligent bee).
      *   **c) Default for Indeterminacy:** Must specify a default tier (e.g., "precautionary" = basic protection, "burden of proof" = no protection) when evidence is insufficient *even after reasonable inquiry*.
      *   **Motivation:** Legislation must be implementable by advisory bodies without causing harm or requiring impractical research. Individual justice is ideal but challenging. Indeterminacy must be resolved legally.
      *   **Non-Negotiable:** (a) Absolutely. (c) Absolutely. (b) Strong Preference (Negotiable in practice, often defaulting to species-typical).

  6.  **Stability & Robustness:**
      *   **a) Taxonomy-Independent:** Tier assignments must be stable under reasonable taxonomic revisions (splitting/lumping species). Protection should depend on biological traits, not taxonomic labels.
      *   **b) State-Invariance (Ideal):** Verdicts should ideally hold across developmental stages (juveniles/adults), behavioral states (sleep/active), and non-permanent injuries. The *capacity* is key, not its constant expression.
      *   **Motivation:** Avoids arbitrary changes in protection based solely on scientific naming conventions. Ensures protection applies when the capacity exists, even if temporarily unexpressed.
      *   **Non-Negotiable:** (a) Absolutely. (b) Strong Preference (Negotiable; e.g., sleep might imply reduced capacity needing interpretation; severe permanent damage might alter status).

  **II. Conflicts & Trade-Offs (The Inherent Tensions)**

  1.  **Feasible Evidence vs. Individual Assessment vs. Untestable Taxa:**
      *   **Conflict:** Obtaining conclusive evidence for *individual* animals, especially for borderline species or those hard to observe/test, using *only non-invasive, feasible methods* is often impossible. Reliance on species-typical traits (practical) sacrifices individual assessment (ideal).
      *   **Trade-Off:** Legislation will likely prioritize species-typical assessment based on feasible evidence, making individual exceptions rare and difficult to prove. The "default for indeterminacy" becomes crucial for individuals and obscure species.

  2.  **Gradedness & Thresholds vs. Firm Verdicts (Borderline Cases) vs. Conceptual Clarity:**
      *   **Conflict:** Consciousness is likely graded, but the law demands sharp boundaries. Defining the *exact* point on the gradient for a tier boundary (e.g., where does "minimal phenomenal affect" begin?) is scientifically and philosophically fraught, especially for borderline cases. A "clear" threshold might feel arbitrary.
      *   **Trade-Off:** The theory must provide the *best possible principled justification* for where boundaries fall, acknowledging the underlying gradedness. The statute accepts some arbitrariness in boundary placement for the sake of workable categories, guided by the theory's markers.

  3.  **Empirical Fidelity (Non-Cortex Cognition) vs. Feasible Evidence:**
      *   **Conflict:** The most compelling evidence for consciousness in non-mammals (e.g., octopus, corvids) often requires complex behavioral experiments or neurophysiology that may not be "feasible" for all relevant species in a legislative context. Relying solely on crude proxies (e.g., presence of a brain) risks under-protection.
      *   **Trade-Off:** The theory must identify *conserved functional or structural markers* that correlate strongly with the empirically demonstrated capacities and *are* feasibly assessed (e.g., degree of brain integration, specific neural architectures, behavioral flexibility benchmarks observable in natural settings or simple tests). Inference from analogy/phylogeny becomes essential.

  4.  **State-Invariance vs. Feasible Evidence:**
      *   **Conflict:** Proving a *capacity* exists in a sleeping or juvenile animal using only non-invasive, feasible methods is challenging. We often infer capacity from its expression in typical adults.
      *   **Trade-Off:** Legislation will likely assume the capacity exists in juveniles/sleeping animals of a protected species unless there's specific evidence of its absence (e.g., early developmental stage before neural structures form). This relies on species-typical assessment.

  **III. Key Excluder & Parochial Demand**

  *   **Most Excluding Requirement: Feasible Evidence (Non-Invasive & Obtainable).** Many prominent theories (e.g., Higher-Order Thought theories requiring complex metacognition, some Global Workspace theories requiring specific cortical architectures) rely on markers that are incredibly difficult or impossible to assess non-invasively or at scale across diverse taxa. Theories emphasizing behavioral complexity alone risk over-inclusion (mistaking reflexes for sentience). This requirement heavily favors theories based on:
      *   Conserved neuroanatomical structures observable via imaging/cadavers.
      *   Robust behavioral markers of learning, valence, and behavioral flexibility observable in relatively simple, non-harmful paradigms or natural history.
      *   Clear phylogenetic inference rules.
  *   **Most Likely Parochial Demand: Strong Individual Assessment.** While ethically appealing, the demand for *routine, reliable* assessment of *individual* animals (beyond obvious cases like severe brain damage in a dog) is likely a preference stemming from a particular view of individual rights applied extremely rigorously. In practice, given feasibility constraints and the graded nature of the underlying traits, legislation will almost certainly rely primarily on *species-typical* capacities for initial classification. Individual exceptions would require extraordinary evidence, placing this more in the "strong preference" camp for implementation, though the *conceptual capability* remains a valid theoretical desideratum.

  **Conclusion:** Your schedule inherently involves significant trade-offs. The most fundamental tension lies between the **graded, complex, and often hidden nature of consciousness** and the **legal need for categorical tiers based on feasible evidence**. No theory perfectly resolves this. The desiderata framework forces explicit choices about where to prioritize scientific nuance, ethical precaution, administrative practicality, and conceptual rigor. The "Feasible Evidence" requirement is the major practical bottleneck, while the insistence on sharp thresholds within a graded phenomenon represents the core conceptual challenge for legislation. Recognizing these conflicts is crucial for drafting an annex that transparently acknowledges the limitations and value judgments involved.
