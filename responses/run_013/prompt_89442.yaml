prompt: |-
  Write a satirical internal engineering design doc — an RFC — proposing that my platform team adopt the MIU string-rewriting system as the company's official problem-solving methodology, with shipping the string MU as the flagship Q3 deliverable. Use the system's actual rules: the sole axiom is MI; any string ending in I may have a U appended; any string Mx may be doubled to Mxx; any III may be replaced by a single U; any UU may be deleted. MU cannot be derived from MI by these rules, and the standard proof is an invariant — no derivable string contains a number of I's divisible by three, and MU contains none. The doc must treat that fact not as a refutation but as a delivery risk to be mitigated.

  Form and length: numbered RFC sections (Summary, Motivation, Design, Alternatives Considered, Drawbacks, Rollout, Success Metrics), 600–800 words, in the voice of an earnest staff engineer who believes every word. The comedy should come from the system being real: every absurd commitment in the doc should be something the rules actually license or actually forbid, so that a reader who has worked through the MU-puzzle laughs because the document is accurate rather than because it is zany. The target is the habit — managerial and philosophical alike — of answering a formal limit with "we'll just step outside the system."

  The centerpiece is a section on "jumping out of the system" as the mitigation: the plan is to escape the system's limits by stepping outside it. I want the doc to keep not noticing that the way it steps outside — proving a theorem about the system, then adopting that theorem as a new rule — is the same rule-following one level up, in a slightly larger system. Include one dissenting footnote from a skeptical staff engineer who raises precisely that objection and is overruled in the next revision. Land the point, without stating it, that there is no final outside to jump to, and that "think outside the box" is a request to build a bigger box.
reasoning: |-
  We are writing a satirical internal engineering RFC. The goal is to propose adopting the MIU system as the company's problem-solving methodology, with shipping the string "MU" as the deliverable.
   The MU puzzle: We start with "MI", and we have four rules:
    1. If a string ends with 'I', we can add a 'U' at the end.
    2. We can duplicate any string following 'M': if we have "Mx", we can make it "Mxx".
    3. We can replace any occurrence of "III" with 'U'.
    4. We can remove any occurrence of "UU".

   However, it is impossible to derive "MU" from "MI" because of an invariant: the number of 'I's in any derivable string (from MI) is never divisible by 3 (and MU has 0, which is divisible by 3). The invariant holds because:
     - Starting with MI: 1 I (not divisible by 3)
     - Rule 1: adding U doesn't change the number of I's.
     - Rule 2: duplicating the string after M: if the current string is Mx, then the number of I's becomes twice the original (if x has k I's, then xx has 2k). Since k mod 3 is not 0, then 2k mod 3 is also not 0 (because 2 and 3 are coprime, so multiplying by 2 doesn't introduce divisibility by 3 in the residues).
     - Rule 3: replacing "III" (3 I's) with U removes 3 I's, so the total number of I's changes by a multiple of 3. If k mod 3 = r (r != 0), then after removing 3 I's, (k-3) mod 3 = r (still non-zero).
     - Rule 4: removing UU doesn't change the number of I's.

   Therefore, we cannot get to 0 I's (which is divisible by 3) from 1 (which is not) without breaking the invariant.

   The satire: We are going to treat the impossibility as a "delivery risk" and propose to mitigate it by "jumping out of the system". But note: the way we jump out is by proving a theorem about the system and then adopting that theorem as a new rule. However, that is just working in a larger system. We want to subtly point out that there's no final outside.

   The document structure: numbered sections as per RFC. We'll have:
    1. Summary
    2. Motivation
    3. Design
    4. Alternatives Considered
    5. Drawbacks
    6. Rollout
    7. Success Metrics

   And we need a footnote from a skeptical engineer who points out that the "jumping out" is just building a bigger system, and then we overrule that footnote in the next revision.

   The voice: earnest, as if this is a serious proposal.

   The comedy: comes from the fact that we are proposing a system that cannot produce MU and then planning to deliver MU anyway by "jumping out". We must be accurate to the rules.

   Let's outline the sections:

  Summary:
    Proposes the adoption of the MIU formal system as the official problem-solving methodology for the platform team. The flagship deliverable for Q3 is the production of the string "MU". The RFC details the methodology and a mitigation for the known delivery risk (the impossibility of deriving MU within the system) by "jumping out of the system".

  Motivation:
    - We face complex problems that require structured approaches.
    - The MIU system is simple, elegant, and based on string rewriting which is familiar to engineers (like our configuration files, DSLs, etc.).
    - It will bring uniformity and rigor to our problem-solving.

  Design:
    - The four rules of the MIU system (as above).
    - How we will use it: every problem will be formulated as a string and we will apply the rules until we get the desired output.
    - The flagship deliverable: MU. We note that there is a known invariant that prevents the derivation of MU (explain the invariant briefly without math, but in the footnote we can be more precise). We propose to mitigate this by "jumping out of the system": we will formally prove the invariant and then add a new rule that allows us to bypass it when necessary.

  Alternatives Considered:
    - Other formal systems (like lambda calculus, Turing machines) but they are too complex.
    - Not using a formal system -> leads to ad-hoc solutions and technical debt.

  Drawbacks:
    - The learning curve for the team to become proficient in the MIU system.
    - The invariant that blocks MU might be seen as a flaw, but we reframe it as an opportunity to innovate by jumping out.

  Rollout:
    - Training sessions for the team.
    - Starting with small problems to build confidence.
    - By Q3, we will have produced MU.

  Success Metrics:
    - Number of problems solved using MIU.
    - Production of MU by end of Q3.

   The footnote: we'll have a footnote in the Design section where the skeptical engineer (let's call them Alex) says:

     Footnote 1 (by Alex): But if we prove a theorem about the system and then add it as a new rule, aren't we just creating a new, larger formal system? And then we are still inside that system? How is that "jumping out"?

   And then in the next revision, we overrule it by saying:

     Revision 1: Alex's concern is noted, but the act of proving the theorem is done outside the original system. Therefore, we are indeed stepping outside. The new rule is a bridge that allows us to transcend the limitations.

   But note: we are not breaking the fourth wall. The document must remain in the voice of the earnest engineer.

   We must be careful to not explicitly state the meta-point (that there's no final outside). We imply it by the circularity of the argument.

