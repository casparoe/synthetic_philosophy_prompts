  First, I analyze the core challenge: the poem must make philosophers *feel* the WKR paradox before intellectualizing it. The demon/threat scenario and needy person scenario need parallel emotional weight. Key requirements: no resolution, internal indistinguishability of attitudes, and avoiding groans from combative readers.

  Considering the structure: 
