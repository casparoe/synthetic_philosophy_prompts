answer: |-
  1. **Would it be pointless or counterproductive for you alone to switch behavior in this practice, since the benefit of conforming relies on others also conforming?**  
     - If **yes**, proceed to 2 (coordination problem present).  
     - If **no**, proceed to 3 (not a coordination problem).  

  2. **Is the practice arbitrary relative to the problem it solves, meaning an alternative would have worked just as well?**  
     - If **yes**, proceed to 4 (arbitrary coordination).  
     - If **no**, proceed to 5 (non-arbitrary coordination).  

  3. **Is what holds the practice in place not only the expectation that others do it, but also that they think you ought to and would blame you for not?**  
     - If **yes**, proceed to 5 (involves normative expectations).  
     - If **no**, proceed to 5 (lacks normative expectations).  

  4. **Does the pattern require common knowledge (universal recognition of mutual awareness) to function, rather than evolving from precedent or local reinforcement without global insight?**  
     - If **yes**, **Lewis-style convention** (common knowledge anchors it).  
     - If **no**, **Convention that evolves and holds without common knowledge** (sustained by precedent/imitation).  

  5. **Does the practice rest on explicit agreement or an authority’s decree, rather than self-sustaining expectations?**  
     - If **yes**:  
       - If reached from 2 (non-arbitrary coordination) or from 3 with normative expectations: **Sanction-backed rule, not a convention** (imposed solution, not coordination equilibrium).  
       - If reached from 3 without normative expectations: **Not a convention, dictated from above** (no expectations, just decree).  
     - If **no**:  
       - If reached from 2 (non-arbitrary coordination): **Not a convention, mere habit** (non-arbitrary coordination with no expectations or decree).  
       - If reached from 3 with normative expectations: **Norm from normative expectations (Bicchieri-type)** (grip via blame/sanction, not coordination).  
       - If reached from 3 without normative expectations: **Not a convention, mere habit** (no expectations, decree, or coordination).  

  ---

  **Sorted Practices**  
  - **Escalator side**: Coordination (yes), arbitrary (yes), common knowledge (yes) → *Lewis-style convention*.  
  - **Handshake**: Not coordination (no), normative expectations (yes), no decree → *Norm from normative expectations (Bicchieri-type)*.  
  - **Tip**: Not coordination (no), normative expectations (yes), no decree → *Norm from normative expectations (Bicchieri-type)*.  
  - **Interview tie**: Not coordination (no), normative expectations (yes), no decree → *Norm from normative expectations (Bicchieri-type)*.  
  - **Queue**: Coordination (yes), arbitrary (yes), common knowledge (no) → *Convention without common knowledge*.  
  - **Word meaning ("bank")**: Coordination (yes), arbitrary (yes), common knowledge (yes) → *Lewis-style convention*.  

  **Note on Overlap**: For norms with normative expectations (Bicchieri-type), informal sanctions (e.g., blame) are intrinsic to the expectations. Thus, this leaf coincides with sanction-backed rules when sanctions are informal. Distinction at **Node 5**: If imposed by decree, it is a formal *sanction-backed rule*; if self-sustaining, it is a *Bicchieri-type norm* with informal sanctions.
