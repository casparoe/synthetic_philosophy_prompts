  The handbook needs to be written in a dry, corporate policy style while satirizing the impracticality of enforcing this strict epistemological standard in a business that deals with predicting uncertain futures. I need to cover specific elements like what counts as an assertion versus other speech acts, the lottery paradox, Moore's paradox, and various bureaucratic procedures they'd implement.

  The satire should be subtle - never breaking character or winking at the reader. A philosophy scholar should recognize it as accurate satire of the knowledge account of assertion, not a straw man. Meanwhile, someone unfamiliar with the theory should still find it humorously bureaucratic.

  I'll structure it as a numbered corporate handbook with sections addressing all eight required elements. For the dissenting factions, I'll create the "Belief Norm Caucus" and "Truth Norm Working Group" with quotes that capture the genuine philosophical objections to the knowledge norm. The appendix will be a retroactive knowledge waiver request form.

  The humor will come from the tension between the company's impossible epistemic standards and the reality of working with probabilistic forecasts. I'll invent corporate-sounding names like "Office of Assertoric Standards" and officers like "Chief Assertion Officer" to maintain the deadpan tone throughout. The challenge is keeping the jargon accurate while making the bureaucracy absurd enough to highlight the impracticality.
answer: |-
  **PROGNOSTICA, INC.  
  INTERNAL COMPLIANCE HANDBOOK: ASSERTORIC STANDARDS (Revision 7.3a)  
  ISSUED BY: OFFICE OF ASSERTORIC STANDARDS (OAS)**  
  **EFFECTIVE: 01 OCTOBER 2024**  
  **PREAMBLE:** Prognostica, Inc. ("The Firm") operates at the forefront of predictive intelligence. To maintain the highest standard of epistemic integrity and client trust, all employee communications must adhere strictly to the Knowledge Norm of Assertion (KNA). This Handbook establishes binding protocols governing verbal, written, and digital assertions made within the Firm or on its behalf. Compliance is mandatory; non-adherence constitutes a Tier 2 Epistemic Violation.

  **SECTION 1: DEFINITION AND SCOPE OF ASSERTION**
  1.1 **Assertion Defined:** An Assertion is any declarative utterance (oral, written, or digital) presented as fact within a professional context. It explicitly or implicitly represents the speaker/writer as knowing its content to be true.
  1.2 **Non-Assertive Speech Acts:**
      1.2.1 **Belief Report:** Declaring a personal conviction (e.g., "I believe Q3 market volatility will increase") is permissible, provided it is explicitly prefaced with "I believe..." or equivalent phrasing approved by OAS (Form AS-12a). Belief Reports do not constitute KNA assertions.
      1.2.2 **Credence Report:** Stating a probability *as a reflection of subjective confidence* (e.g., "I assign a 70% credence to Scenario B") is permissible as a non-assertive report. Phrasing must clearly denote subjective probability.
      1.2.3 **Forecast:** A Forecast is an OAS-approved probabilistic statement concerning future events, generated via Firm-mandated methodologies (Ref: Forecasting Protocols Doc FC-101). A Forecast *becomes an Assertion only if the assigned probability reaches the "Knowledge Threshold" (KT)* (see Section 1.3). Forecasts below KT are inherently non-assertive Credence Reports.
  1.3 **Knowledge Threshold (KT):** Forecasts achieving a probability ≥ 0.95 are *prima facie* candidates for Assertion status. However, KT is necessary but *not sufficient*. Final Assertion status requires additional verification per Sections 6 (Safety/Sensitivity Audit) and 7 (Zetetic Duty fulfillment). Forecasts < 0.95 cannot be asserted under KNA; they must be presented solely as Credence Reports.

  **SECTION 2: THE LOTTERY PROTOCOL**
  2.1 **Problem Statement:** Certain high-stakes low-probability events ("Lottery-Class Events," e.g., "Client X faces existential regulatory risk this quarter, P=0.02") are critical to risk analysis but inherently fall below KT.
  2.2 **Protocol:** Analysts *must not assert* the occurrence of Lottery-Class Events. Permissible communication is restricted to:
      2.2.1 Asserting the *existence of the non-trivial risk* itself ("Client X faces a non-trivial existential regulatory risk this quarter" - *if known* via standard KNA procedures).
      2.2.2 Reporting the precise low credence ("I assign a 2% credence to Client X facing existential regulatory risk this quarter").
  2.3 **Rationale:** Direct assertion of the event's occurrence violates KNA, as the analyst cannot *know* it will happen, regardless of its actual probability or eventual truth. Prohibition preserves assertoric integrity while allowing risk communication.

  **SECTION 3: MOORE'S PARADOX RESOLUTION PATHWAY**
  3.1 **Definition:** A Moorean Utterance takes the form "P, but I do not know that P" (or functional equivalents like "P, though I lack justification for P").
  3.2 **Prohibition:** Moorean Utterances are strictly forbidden under KNA. They represent an intrinsic assertoric contradiction.
  3.3 **Resolution Pathway:** Employees experiencing an urge to make a Moorean Utterance *must*:
      1. Cease communication immediately.
      2. Submit Form MP-1 ("Moorean Urge Disclosure & Epistemic Triage Request") to OAS within 1 business hour.
      3. Await OAS consultation. OAS will determine if:
          * The employee *does* know P (resolving the contradiction; utterance prohibited).
          * The employee *does not* know P (assertion of P prohibited; permissible Belief/Credence Report may be advised).
          * Epistemic counseling (Module EC-7: "Untangling Moorean Knots") is required.

  **SECTION 4: TRANSMISSION PROTOCOL (REPEATING COLLEAGUE ASSERTIONS)**
  4.1 **Core Principle:** KNA applies primarily to the *original asserter*. However, repeating an assertion implies *personal endorsement* of its knowledge-backed status.
  4.2 **Protocol for Repeating Assertion A (made by Colleague C):**
      4.2.1 Employee E *may* repeat A *only if* E possesses independent, KNA-compliant knowledge supporting A.
      4.2.2 If E lacks independent knowledge, E *must* use Attribution Phrasing: "Colleague C asserted that P, and I have no reason to doubt C's adherence to KNA on this matter." E *must not* present A as their own assertion.
      4.2.3 Failure to Attribute when repeating without independent knowledge constitutes a Tier 1 Epistemic Violation (Misrepresentation of Epistemic State).

  **SECTION 5: RECOGNIZED INTERNAL DISSENT GROUPS (Informational Only)**
  *OAS acknowledges the existence of employee groups advocating alternative assertoric norms. Dissent must be channeled through approved forums (Ethics Portal, Topic 4b). OAS maintains the sole authority on KNA interpretation and enforcement.*
  5.1 **Belief Norm Caucus (BNC):** Advocates that sincere belief, not knowledge, suffices for warranted assertion. *Stated Objection (BNC Manifesto, v3): "KNA renders ordinary communication paralyzingly cautious. Requiring knowledge for every 'The meeting is at 3' or 'Q2 reports are finalized' is impractical and ignores the social function of assertion based on justified belief."*
  5.2 **Truth Norm Working Group (TN):** Advocates that truth alone (regardless of the asserter's epistemic state) warrants assertion. *Stated Objection (TN Position Paper, §2): "KNA unjustly penalizes lucky guessers who assert true propositions. If the market *did* crash as predicted, why sanction the analyst who correctly asserted it would, simply because their model later proved flawed? Truth is the goal, knowledge is often elusive."*

  **SECTION 6: SAFETY AND SENSITIVITY AUDIT (SSA)**
  6.1 **Purpose:** To certify that a belief supporting a potential Assertion meets the counterfactual robustness requirements of knowledge (i.e., it is *safe* - not easily false; and *sensitive* - would not be held if false).
  6.2 **Procedure:** Prior to asserting high-impact forecasts near KT (≥0.95), the analyst *must* submit Forecast & Methodology Package (FMP) to OAS for SSA.
      6.2.1 OAS auditors construct relevant counterfactual scenarios ("nearest possible worlds").
      6.2.2 Auditors assess if, in these scenarios: (a) The belief would likely still be true (Safety); (b) If P were false, the analyst would not hold the belief (Sensitivity).
  6.3 **Lucky True Belief (LTB) Ruling:** If the SSA determines the belief was true in the actual world but *unsafe* or *insensitive* (i.e., easily could have been false), the belief fails the Audit. Assertion based *solely* on this belief is prohibited, even if eventually verified as true. (See Section 8.3 for LTB penalty mitigation).

  **SECTION 7: ZETETIC DUTY (INQUIRY REQUIREMENT)**
  7.1 **Principle:** Employees have a duty to inquire sufficiently before asserting. Sufficiency is determined relative to the assertoric context (stakes, complexity, time constraints).
  7.2 **Standard:** Inquiry is deemed sufficient when a reasonably diligent analyst, utilizing Firm-approved resources and methodologies, would conclude they have met the KNA standard for P.
  7.3 **Determination:** The individual analyst makes the initial sufficiency judgment. However:
      7.3.1 OAS provides Inquiry Sufficiency Checklists (ISC-xx series) for common assertion types.
      7.3.2 Post-assertion challenges (via OAS Complaint Form AS-15) or SSA failure (Section 6) may trigger review of Zetetic Duty fulfillment. OAS makes the final ruling on sufficiency in contested cases.

  **SECTION 8: PENALTIES, APPEALS, & WAIVERS**
  8.1 **Violation Tiers:**
      * Tier 1: Knowingly asserting without knowledge; Misrepresentation of Epistemic State. Penalty: Mandatory Epistemic Recalibration Training (ERT), 1st offense; Suspension without pay, 2nd offense; Termination, 3rd offense.
      * Tier 2: Unintentional assertion without knowledge (e.g., failed SSA, insufficient inquiry discovered later). Penalty: ERT, 1st offense; Formal Epistemic Reprimand (on record), 2nd offense; Suspension, 3rd offense.
  8.2 **Appeals:** Appeals against OAS rulings must be filed within 5 business days using Form AP-1, reviewed by the Chief Assertion Officer (CAO). CAO decision is final.
  8.3 **Lucky True Belief (LTB) Waiver:** If an assertion violated KNA (failing SSA or Zetetic Duty) but is subsequently verified as *true*, the employee may petition for a Retroactive Knowledge Waiver (RKW - Appendix A). Granting an RKW converts a Tier 2 violation into a "Corrected Epistemic Status" notation, mitigating penalties. *Note: Truth alone does not constitute knowledge; the RKW is a discretionary administrative remedy, not an epistemic vindication.* RKWs are rarely granted for Tier 1 violations.

  **APPENDIX A: FORM RKW-1 - REQUEST FOR RETROACTIVE KNOWLEDGE WAIVER**

