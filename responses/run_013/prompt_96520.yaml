prompt: |-
  I sit on the diagnostic classification committee of my national psychiatric association, which meets next month to vote on the next revision of our diagnostic manual. I am expected to circulate a written opinion in advance, and I would like you to draft it.

  The disputed item is a proposed new category, chronic attentional flatness (CAF). The working definition is at least six months of persistent difficulty becoming absorbed in anything, blunted interest even in previously valued activities, compulsive low-grade stimulation-seeking, and a felt unreality of one's own preferences, producing distress or impairment. The proposed criteria include a fourteen-item self-report scale with a cutoff. The field trial reports acceptable sensitivity and specificity against clinician judgment, but the clinician-judgment criterion was itself calibrated against the scale, so the two are not independent measurements of anything.

  Two further complications. First, an informal version of the label has been circulating online for roughly two years. Clinics in three regions report that patients increasingly arrive already self-diagnosed, and the reported symptom profile has drifted: early self-identified cases emphasized bodily fatigue and sleep disturbance, recent ones emphasize a specific vocabulary of flatness and of preferences that do not feel like one's own. The drafters treat this drift as evidence that the category is tracking something real; the skeptics treat it as evidence that the category is manufacturing its own referent. Second, CAF overlaps heavily with our existing, better-validated category for persistent low mood and anhedonia. Admitting CAF would draw off a subpopulation that currently anchors the existing category's validity evidence, since that evidence was gathered on exactly the patients CAF would now capture. There is also a treatment and reimbursement stake: a coding category is the precondition for the therapy protocol and for insurance coverage, so rejecting CAF leaves patients who present this way without the treatment.

  One of the drafters has proposed a general admissibility test: a category should be stable under its own application, meaning that classifying people under it should not systematically change what the category measures. Taken seriously, that test would also appear to discredit at least two categories already in the manual, so endorsing it as a general rule would reopen decisions the committee regards as settled.

  The committee divides roughly three ways: admit CAF as a full category; reject it and treat the presentation as a variant of the existing category; or admit it only with provisional status and mandatory monitoring. I must recommend one of these, with reasons the other two factions can actually respond to, and I must give an honest account of the strongest consideration on the side I come down against. Note that this is not the familiar argument about whether some condition is a real disease. The live question is what our committee should do given that the act of classifying will itself reshape the population being classified, and given that our categories are not evidentially independent of one another.

  Please draft the memo, roughly 900 to 1200 words. It should state a concrete recommendation and any conditions attached to it; give the reasoning; engage the strongest objection to the recommendation rather than restating our own position; and specify what we should monitor after the vote so that the decision can be revisited on stated grounds. Do not include citations or a literature review; I will insert references to the committee's own documents myself. End with a final line in the form Verdict: LABEL, using exactly one of ADOPT, REJECT, or PROVISIONAL.
reasoning: |-
  Okay, let me approach this complex drafting request systematically. The user is a psychiatric classification committee member needing a balanced memo on the contentious CAF proposal, with specific structural requirements and deep epistemological concerns.

  Hmm, the core tension involves diagnostic categories that actively reshape the phenomena they describe - a recursive problem magnified by pre-existing online discourse about CAF. The user's framing suggests they're acutely aware of how diagnostic labels can become self-fulfilling prophecies, especially when community-driven symptom descriptions evolve post-labeling. 

  I notice three critical layers here: scientific (validity concerns with circular field trials), practical (treatment access vs nosological integrity), and meta-diagnostic (that proposed stability criterion threatening existing categories). The memo must navigate all three while maintaining committee cohesion.

  Right, the provisional recommendation seems most prudent. It allows: 1) addressing patient care gaps immediately through existing codes, 2) mandating studies to untangle the CAF-depression overlap question, and 3) establishing safeguards against diagnostic contagion through the longitudinal registry. The strongest counterargument - denying patients a tailored intervention - gets mitigated by the therapy protocol allowance.

  Ah, and that stability test dilemma... best to explicitly bracket it as beyond CAF's remit. The draft handles this well by noting how reopening that debate would derail the current decision, while still acknowledging its conceptual merit for future review.

  For monitoring: the drift tracking mechanism feels crucial. Comparing self-diagnosed vs clinically diagnosed trajectories could finally resolve whether this is discovery or creation of a disorder. And embedding the scale validation in real-world practice settings avoids the circularity trap.

  The closing "VERDICT" format is non-negotiable - must be exact to fit committee procedures. Provisional satisfies both urgency and caution.
answer: |-
  **MEMORANDUM**  
  To: Diagnostic Classification Committee  
  From: [Your Name/Title]  
  Subject: Recommendation Regarding Proposed Category: Chronic Attentional Flatness (CAF)  
  Date: [Date]  

  **1. RECOMMENDATION**  
  I recommend adopting CAF with **provisional status** for a period of five years, subject to the following conditions:  
  - (a) CAF is explicitly designated as a "Condition for Further Study" in the manual, with clear annotation of its provisional nature in all coding documentation.  
  - (b) Mandatory longitudinal monitoring is implemented:  
    - (i) All clinics using the CAF code must submit de-identified symptom trajectory data (including the 14-item scale scores, treatment response, and functional outcomes) to a central registry.  
    - (ii) A dedicated working group tracks online symptom discourse evolution quarterly, comparing self-diagnosed communities with clinically diagnosed cohorts.  
  - (c) The existing mood/anhedonia category’s diagnostic criteria are amended to explicitly note CAF’s provisional status and encourage differential assessment using both criteria sets during the monitoring period.  
  - (d) Payer reimbursement for CAF-specific therapy protocols is permitted *only* if delivered within approved research registries or with outcome data submission.  

  **2. RATIONALE**  
  Our decision must balance three imperatives: scientific integrity, clinical utility, and ethical responsibility to patients. Provisional adoption best navigates the complexities of this case.  

  **Scientific Integrity**: The circular validation (scale vs. clinician judgment) and symptom drift observed in online communities are profound methodological concerns. They suggest CAF may be vulnerable to *diagnostic contagion*—where the label itself amplifies or reshapes the phenomenon. However, outright rejection ignores that distressed patients are presenting with this profile *now*, and the scale *does* correlate with impairment. Provisional status allows us to:  
  - Test whether CAF stabilizes diagnostically *after* formalization, or if drift accelerates.  
  - Collect independent validity data (e.g., neurocognitive markers, treatment response) uncoupled from the initial circular field trial.  
  - Determine if CAF is a distinct entity or a subtype of existing mood disorders by analyzing overlap dynamics prospectively.  

  **Clinical Utility & Patient Access**: Rejecting CAF leaves patients without a validated treatment pathway or reimbursement mechanism. Adopting it fully risks reifying a potentially unstable construct and fragmenting a validated category (mood/anhedonia), jeopardizing *both* categories’ evidence base. Provisional status with registry requirements:  
  - Provides immediate access to structured assessment and reimbursable care *within monitored frameworks*.  
  - Prevents premature fragmentation of the existing category by maintaining dual-track assessment during the study period.  
  - Generates real-world data on whether CAF-specific protocols outperform existing interventions for this subgroup.  

  **Ethical Responsibility**: The online symptom drift indicates significant patient suffering seeking explanation. Dismissing this risks alienating a population already experiencing "preference unreality." Provisional adoption acknowledges their distress while rigorously testing the construct’s legitimacy.  

  **The Stability Test**: While intellectually compelling, applying the drafter’s proposed stability test universally would destabilize our manual retroactively, exceeding our mandate. This decision focuses solely on CAF’s context: its pre-existing online footprint makes stability concerns uniquely urgent *here*.  

  **3. ENGAGING THE STRONGEST OBJECTION**  
  The most compelling argument against provisional adoption comes from the **Reject Faction**: *Provisional status legitimizes a socially constructed and methodologically flawed category, accelerating diagnostic contagion while failing to deliver equitable care.*  

  They rightly argue:  
  - **Legitimization Risk**: Granting CAF any formal status (even provisional) may accelerate symptom drift by conferring institutional authority on the label, amplifying online validation loops and potentially "hardening" a socially mediated presentation into an intractable clinical entity.  
  - **Clinical Inequity**: Restricting reimbursement to research registries creates a two-tier system. Patients in underserved areas without registry access will be denied care tied to the code, exacerbating disparities.  
  - **Resource Diversion**: Mandatory monitoring diverts limited clinical and administrative resources toward tracking an unstable construct, potentially undermining care for better-validated conditions.  
  - **False Hope**: If CAF collapses under scrutiny in 5 years, patients invested in this identity may experience therapeutic rupture and renewed alienation.  

  This objection forces us to confront whether provisional status truly mitigates harm or merely sanitizes premature recognition. It underscores that *any* acknowledgment of CAF risks iatrogenic consequences.  

  **4. MONITORING AND REVISION CRITERIA**  
  The decision must be revisited based on data, not consensus. The committee should pre-commit to reviewing:  
  - **Stability**: Does symptom presentation in *clinically diagnosed* CAF cases remain consistent over 3 years, or does significant drift occur post-adoption?  
  - **Distinctiveness**: Does longitudinal data confirm CAF as a discrete entity (e.g., unique biomarkers, differential treatment response, distinct functional outcomes) or reveal it as a mood/anhedonia subtype?  
  - **Impact on Existing Category**: Has removing the CAF-like subpopulation significantly altered the prevalence, clinical correlates, or treatment response profile of the core mood/anhedonia category?  
  - **Access & Equity**: Have registry requirements created significant barriers to care? Are outcomes improved for patients receiving CAF-coded care vs. those treated under existing codes?  

  **5. CONCLUSION**  
  CAF presents a paradigmatic challenge of modern nosology: a construct emerging at the intersection of lived experience, digital culture, and clinical observation, with evident distress but uncertain validity. Full adoption risks enshrining a potentially ephemeral construct; outright rejection neglects patients actively seeking help under this banner. Provisional status with rigorous safeguards allows us to:  
  - **Learn** whether CAF represents a novel clinical entity or a culturally shaped expression of existing morbidity.  
  - **Treat** suffering patients without prematurely fracturing our diagnostic ecosystem.  
  - **Adapt** our framework based on evidence of stability or instability under formal application.  

  This path demands vigilance and resources but honors both our scientific duty and our obligation to relieve suffering in a rapidly evolving landscape.  

  **VERDICT: PROVISIONAL**
