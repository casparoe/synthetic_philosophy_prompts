  Okay, the user is a teaching assistant for a behavioral genetics course, dealing with common misconceptions about heritability. They want a poem to start their discussion section, specifically a pantoum. The key issue is students misunderstanding heritability as meaning traits are mostly genetic and unchangeable. The lecturer previously brushed off a student's question about why average height increased despite high heritability, which points to environmental factors. 

  The user wants the pantoum to illustrate how context changes the meaning of recurring lines, without using terms like "gene" or "nature vs nurture." The repeating lines should represent the fixed aspect (like genetics), while the changing lines show environmental influences. By the end, the same repeating lines should feel inadequate without their original context, demonstrating that heritability isn't fixed and environment matters.

  Constraints include avoiding clichés like twin studies or seed/soil analogies. The poem should be about 16 lines. After the poem, I need to explain how the structure teaches the lesson and identify the key feature. The user’s deeper need is to create an intuitive understanding before lecturing, using the poem's form to embody the concept. 

  I'll structure the pantoum with everyday scenarios. The repeating lines will be "The shape is in the wood" and "The blade obeys the grain," suggesting inherent traits. The changing lines will show different contexts: carpentry, flood, fire, and finally, the wood changed despite the "grain." This progression makes the fixed lines feel insufficient by the end.

  For the analysis, I'll highlight how recurring lines seem explanatory initially but lose meaning as context shifts. The key structural feature is the unchanging repetition versus varying context. The summary will emphasize that identical lines become inadequate when separated from their original supporting context.
answer: |-
  Here's a pantoum designed to embody the lesson through its structure:

  **The Grain**

  The shape is in the wood they claim.
  The blade obeys the grain.
  A table stands, familiar, plain.
  The blade obeys the grain.

  A table stands, familiar, plain.
  Then floodwaters rose and stayed.
  The legs grew soft, the surface swayed.
  Then floodwaters rose and stayed.

  The legs grew soft, the surface swayed.
  Sun cracked the varnish, bleached the floor.
  A warped thing leans against the door.
  Sun cracked the varnish, bleached the floor.

  A warped thing leans against the door.
  The fire ate the sap and glue.
  Ash drifts where the table grew.
  The fire ate the sap and glue.

  Ash drifts where the table grew.
  The shape is in the wood they claim.
  The blade obeys the grain.

  ---

  **Analysis:**

  1.  **The Recurring Lines as "Fixed Trait":** "The shape is in the wood they claim" and "The blade obeys the grain" act as the poem's "heritable core." They reappear verbatim, unchanging, representing the perceived inherent, fixed potential (like the genetic influence). They seem explanatory and fundamental in Stanza 1.
  2.  **The New Lines as Shifting Environment:** Each stanza introduces radically different environmental pressures – normal conditions ("A table stands..."), flooding, intense heat/sun, and finally fire/consumption. These new lines are the varying circumstances.
  3.  **The Erosion of Explanation:** As the environments become more extreme and transformative (flood warps, sun bleaches, fire destroys), the *exact same* recurring lines ("The shape is in the wood...", "The blade obeys the grain") become increasingly detached and inadequate to explain the observed outcome (warped board, bleached floor, ash). The "fixed" lines haven't changed; the context they exist within has utterly altered their meaning and explanatory power. By the final recurrence, they feel almost hollow or ironic.
  4.  **The Loop:** Ending with the opening lines reinforces the "fixed" aspect returning, but now the reader has experienced how little they predict without context. The "grain" is present, but the table's fate was dictated by circumstance.

  **What Breaks if Moved:**
  *   If the recurring lines changed wording, the core "fixed" element dissolves, ruining the contrast.
  *   If the new lines weren't progressively more disruptive, the inadequacy of the recurring lines wouldn't build effectively.
  *   If the loop didn't return to the start, the cyclical nature reinforcing the persistence of the "core" (despite its contextual inadequacy) is lost.

  **Summary:** The unchanging repetition of core lines becoming inadequate to explain outcomes as the context they frame radically shifts embodies the dependence of heritability estimates on specific environmental ranges.
