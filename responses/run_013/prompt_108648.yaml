prompt: |-
  You are a philosopher of science who also understands early-stage venture investing. I am a venture capital partner; I know Lakatos only at the level of hard core, protective belt, positive and negative heuristics, and progressive versus degenerating problemshifts, but I think natively in terms of portfolio construction, investment thesis, pivot, traction, moat, runway, sunk cost, and power-law returns. Think carefully before writing. Restate Lakatos's account of how a scientific research programme is appraised—especially the claim that a programme can be rational to pursue even when it contains anomalies, so long as it remains theoretically and empirically progressive over the long run—in my vocabulary, as faithfully as you can. In particular, test whether the distinction between a programme's hard core and its protective belt maps onto the distinction between a company's founding thesis and its product roadmap, or whether that mapping loses the point that the hard core is held immune by methodological decision rather than by empirical evidence. Then give me the residue report: which claims translate cleanly, which translate only with distortion, and which have no counterpart in how a VC evaluates a portfolio company. Tell me whether the residue is a defect of the VC vocabulary or a sign that Lakatos's framework is less clear than it looks. Do not give citations or reading lists. Open with a one-sentence bottom line, then a three-column table (Lakatosian term, VC analogue, what is lost), then a residue report of no more than 300 words. Keep the whole response under 800 words.
reasoning: |-
  Hmm, the user is a venture capital partner who wants me to translate Lakatos's philosophy of science into VC terminology. They're familiar with core Lakatos concepts like hard core, protective belt, and progressive/degenerating problemshifts, but they think natively in VC terms like portfolio construction, investment thesis, pivot, and power-law returns.

  The user wants me to restate Lakatos's account of scientific research programs in VC vocabulary, focusing on how programs can be rational to pursue despite anomalies if they remain progressive. I need to test whether mapping hard core to founding thesis and protective belt to product roadmap preserves Lakatos's key insight that the hard core is protected by methodological decision rather than evidence. Then I should provide a residue report showing what translates cleanly, what distorts, and what has no counterpart.

  For the bottom line: I'll start with a concise summary that captures the essence of Lakatos in VC terms. Then I'll create a three-column table comparing Lakatosian terms with VC analogues while noting what gets lost in translation. Key mappings include research programme to investment thesis, hard core to founding thesis, and protective belt to product roadmap. I need to be careful with the hard core mapping - in Lakatos it's protected by methodological fiat, while in VC the founding thesis can pivot based on evidence.

  For the residue report (under 300 words): I'll note that anomalies map cleanly to traction issues, and problemshifts to pivots. But degenerating programmes don't perfectly map to zombie companies since VCs cut losses faster. The biggest gap is Lakatos's long-term rationality despite anomalies - VCs have shorter time horizons due to fund cycles. I'll conclude that the residue shows VC vocabulary's practical constraints rather than defects in Lakatos's framework.

  I'll keep the whole response under 800 words, avoid citations, and maintain a professional yet conversational tone suitable for a VC partner.
answer: |-
  **Bottom line:** Lakatos's research programmes map surprisingly well to VC investment theses, where protecting a core thesis while aggressively iterating the product/strategy (protective belt) is rational if it consistently generates valuable new insights and market progress, even amid early setbacks.

  **Translation Table:**

  | Lakatosian Term              | VC Analogue                       | What is Lost in Translation                                                                 |
  | :--------------------------- | :-------------------------------- | :------------------------------------------------------------------------------------------ |
  | **Research Programme (RP)**  | **Investment Thesis**             | The RP's deeper philosophical unity & long-term historical narrative beyond specific bets.   |
  | **Hard Core**                | **Founding Thesis / Core Moat Hypothesis** | **Crucially:** The *immunity by methodological fiat*. VCs *do* abandon the core thesis with sufficient contradictory evidence (e.g., fundamental market shift, tech impossibility). Lakatos *forbids* directly attacking the core. |
  | **Protective Belt**          | **Product Roadmap / GTM Strategy / Business Model Iterations** | The explicit *function* of protecting the core via sacrifice. VC pivots aim for survival/growth, not necessarily core defense. |
  | **Positive Heuristics**      | **Product Roadmap / Playbook / Hypothesis Testing Framework** | The prescriptive guidance for *how* to develop the programme/thesis. VC playbooks are often less formalized. |
  | **Negative Heuristics**      | **"Red Lines" / Anti-Portfolio Criteria** | The explicit prohibition against core challenge. VC "red lines" are often more about market/team risks than core idea sacrosanctity. |
  | **Anomaly**                  | **Traction Issue / Unexpected Data / Negative Signal** | The RP's tolerance for anomalies within an *overall* progressive trend. VCs have lower tolerance due to runway. |
  | **Theoretically Progressive**| **Generating Novel, Validated Insights / Strong New Hypotheses** | The focus on *explanatory* novelty. VC values actionable market/tech insights over pure theoretical novelty. |
  | **Empirically Progressive**  | **Generating Positive Traction / Validating Key Metrics** | Close analogue.                                                                             |
  | **Progressive Problemshift** | **Successful Pivot / Iteration Leading to Growth** | The cumulative, programme-wide nature of progress. VC success is company-specific.           |
  | **Degenerating Problemshift**| **"Pivot Fatigue" / Lack of Traction Despite Iteration / Zombie Co.** | The precise criterion of *only* explaining past anomalies without new predictions. VC judges on growth/momentum. |

  **Residue Report (283 words):**

  The core mapping holds surprisingly well: a VC thesis (RP) centers on a foundational bet (Hard Core/Founding Thesis) protected by adaptable execution (Protective Belt/Product Roadmap), judged by its ability to generate consistent progress (Traction/Validation) despite hurdles (Anomalies). Pivots are the protective belt in action.

  **Clean Translations:** Anomalies → Negative Signals, Empirical Progress → Positive Traction/Validation, Protective Belt Adjustments → Pivots/Iterations. The core idea of persisting with a strategy *despite setbacks* if it's generating *new, valuable insights and progress* translates directly to backing teams showing learning and momentum through pivots.

  **Distorted Translations:** Mapping the **Hard Core** to the Founding Thesis loses the *absolute methodological immunity*. VCs *expect* the core thesis might be wrong and force a pivot or shutdown if evidence mounts (e.g., TAM proven tiny, core tech unworkable). Lakatos's core is shielded *by rule*. **Degenerating Shifts** map to failing companies, but Lakatos's specific criterion (only explaining past failures without novel predictions) is less precise than VC judgment based on growth curves and momentum loss. **Positive Heuristics** exist as playbooks, but are less formalized than Lakatos's guiding principles for RP development.

  **No Counterpart:** Lakatos's "**Theoretical Progress**" (novel explanations/predictions) lacks a direct VC equivalent. VCs care about *actionable* insights driving commercial progress, not explanatory power per se. The RP's **long-term historical unity** transcends any single company or fund cycle, unlike VC theses tied to fund lifetimes.

  **Residue Analysis:** The residue stems primarily from **VC's practical constraints** (fund life, power law, capital intensity) forcing faster, more decisive judgment than academic science allows. The absence of theoretical progress as a distinct criterion isn't a VC defect but reflects its commercial focus. The critical distortion around the Hard Core's immunity highlights a fundamental difference: VC is fundamentally *empirical* and *falsificationist* at the core thesis level, while Lakatos's RP protects its core *conventionally*. This residue exposes the limit of the analogy, *not* necessarily a lack of clarity in Lakatos. His framework describes a specific scientific rationality that VC adapts pragmatically.
