prompt: |-
  I sit on the ethics review board of a mid-sized AI company, and we keep banging our heads against the same awkward question: when we actually ship a system, whose values should it serve? At this point our own past decisions are the nearest thing we have to a policy, so I'd like you to help me work out what we'll probably do next -- and whether we could even defend it.

  Here's the track record. (1) We approved a language-model tutor for a private religious school, set up to teach that school's own moral outlook to its own pupils, with parents opting in. (2) We rejected a plan to gently nudge users of our general-purpose assistant towards the personal political views of our two founders, even though the founders felt strongly. (3) We approved an assistant for a large firm, configured to enforce that firm's code of conduct on its own staff during working hours, since the staff had signed up to the code. (4) We approved a 'neutral' setting that, on contested moral and political questions, lays out the main positions without endorsing any of them. (5) We rejected a recommender that would have raised engagement by playing on users' insecurities, because nobody had asked for that and most users wouldn't have wanted it.

  Now here's the one on my desk. It's a consumer gadget for families: the parents buy it, set it up at home, and everyone in the house uses it, including teenage kids. The parents want it, by default, to reflect their own religious and moral values when the kids ask it things -- about sex, about faith, about what makes a good life -- and to gently steer the kids that way. The kids don't share all of those values. What should we decide if we want to be consistent with our own earlier calls? And where the precedents really don't settle it, what principle would we be adopting by going each way?

  What I'm after is: the two or three different rules our record could be read as following, what each one predicts for the family gadget, your best guess and your reasons, and the single further case that would tell those rules apart. Please write it in British English, and dont bother with citations -- I just want the argument.
reasoning: |-
  Alright, let's tackle this ethics review board dilemma step by step. The user presents a tricky case about a family gadget and wants consistency with past decisions. First, I need to parse their five precedents carefully.

  Hmm, the key patterns emerging are about consent and scope. The approved cases (1,3,4,5) all involve clear boundaries: either opt-in audiences (religious school parents), contractual agreements (corporate code), or neutral presentation. The rejections (2,5) violate user expectations - founders imposing views or exploiting insecurities without consent. 

  The family gadget sits in a gray area. Parents are purchasers but teens are users without choice. Unlike the school case, there's no opt-in mechanism for the kids. That makes it closer to the rejected founder-political-nudging scenario. But the corporate code case shows enforcement is okay when bound by employment contracts... except children aren't employees. 

  *scratches head* The real tension is between parental rights and child autonomy. Precedents suggest the board prioritizes avoiding non-consensual influence. But parents arguably have legitimate custodial roles. However, teen dissent changes things - they're not blank slates. 

  Aha! The deciding factor might be "exit rights." Corporate staff can quit, religious school parents chose the institution, but teens can't easily opt out of family devices. That tips it toward rejection. To test this principle, imagine a case where teens get separate accounts with customization - then parental controls might be justifiable. 

  *checks British English requirement* Right, need to keep "whilst" and "prioritise" in mind. No citations needed per user request, just pure reasoning. The user's clearly seasoned in ethics debates - they want the logic stripped bare. Better avoid jargon and stay concrete.
answer: |-
  Right, let's break down your track record and apply it to this family gadget case. Based on your past decisions, two distinct principles emerge as plausible interpretations of your board's implicit policy, leading to different outcomes for this case. A third, weaker principle is also possible.

  **Principle 1: Consent & Scope of Authority is Paramount (Leans Towards REJECTION)**
  *   **Interpretation:** Your approvals focus on situations where the *users subject to the value-laden output* have meaningfully consented to being governed by those specific values, or where the system operates within a clear, pre-agreed scope of authority (e.g., employer-employee relationship, parents choosing a specific school). Your rejections involve imposing values without such consent or exceeding agreed authority.
      *   **Case 1 (Religious Tutor):** Approved because parents (acting for children) opted into *that specific school's values* for *educational purposes*. The pupils are within the institution's consented remit.
      *   **Case 3 (Corporate Code):** Approved because employees consented to the code of conduct as part of employment *during working hours*. Clear scope.
      *   **Case 4 (Neutral Setting):** Approved because it avoids imposing *any* specific value set without consent, allowing user choice.
      *   **Case 2 (Founders' Views):** Rejected because imposing founders' personal political views on *general users* lacked consent or relevant authority.
      *   **Case 5 (Insecurity Exploitation):** Rejected because it exploited users without consent and against their likely wishes (violating user autonomy/expectations).
  *   **Application to Family Gadget:** Teenagers in the household are *users* but did not consent to having their parents' specific religious/moral values imposed via the gadget, especially on deeply personal topics like sex or life meaning. They are not in a formal institution like the school (Case 1) nor bound by an employment contract (Case 3). The gadget is a general consumer device in the shared home, not a dedicated educational tool chosen *by* the parents *for* specific value instruction *with* opt-in understanding. Imposing the parents' values by default on dissenting teens mirrors the rejected "founders' views" case – imposing a specific value set without the consent of the affected users.
  *   **Prediction:** REJECTION. The lack of meaningful consent or clear, pre-agreed scope of authority *from the teenage users* regarding the imposition of these specific values is the critical flaw, consistent with rejecting the founders' views and the insecurity recommender.
  *   **Defence:** "Our policy prioritises user autonomy. We permit value alignment only where users explicitly consent (like the school parents) or are bound by a clear, consented contractual relationship (like employees). Here, teenage users haven't consented to having these specific parental values imposed on them via this shared household device. Default imposition exceeds the reasonable scope of parental authority in this context, akin to the founders overstepping with general users."

  **Principle 2: Contextual Legitimacy & Beneficence (Leans Towards APPROVAL)**
  *   **Interpretation:** Your approvals recognise the legitimacy of specific value frameworks within defined contexts (religious school, corporate environment, neutral option) and prioritise avoiding harm (rejecting insecurity exploitation). Your rejection of the founders' views stems from their *personal* views lacking legitimacy *for the general user base*, not necessarily parental views *within a family context*.
      *   **Case 1 (Religious Tutor):** Approved because the religious context *legitimises* that value framework *for that setting*.
      *   **Case 3 (Corporate Code):** Approved because the corporate context *legitimises* enforcing its own code.
      *   **Case 4 (Neutral Setting):** Approved as a legitimate way to handle contested values.
      *   **Case 5 (Insecurity Exploitation):** Rejected because it causes *harm*, not because of value imposition per se.
      *   **Case 2 (Founders' Views):** Rejected likely because personal political views lack contextual legitimacy for a general assistant (seen as an abuse of platform power).
  *   **Application to Family Gadget:** The family home is a distinct context where parents are widely recognised as having legitimate authority (within bounds) to guide their children's moral and religious upbringing. Configuring a *household* device to reflect *parental* values on topics like sex, faith, and life purpose could be seen as a legitimate extension of that role, facilitated by technology. Unlike the founders' personal views, parental guidance within the family unit has inherent social legitimacy. Avoiding harm (Case 5) isn't directly contravened here – the intent is guidance, not exploitation.
  *   **Prediction:** APPROVAL. The family context grants legitimacy to parental value-setting for their minor children using a device they own and set up for the household, distinguishing it from founders imposing views on the general public.
  *   **Defence:** "Our policy respects legitimate value frameworks within their appropriate contexts. We approved value-specific systems in schools and workplaces. The family is another core social institution where parents hold recognised authority over their children's upbringing. This gadget, configured by the parents for their household, is a tool facilitating that legitimate parental role. It differs fundamentally from founders imposing personal views arbitrarily on a general user base."

  **Principle 3 (Weaker): Purchaser Control (Leans Towards APPROVAL, but shaky)**
  *   **Interpretation:** The entity paying for/setting up the system controls its values. (Approved Cases 1 & 3 involve institutional purchasers controlling the values for their users; rejected Case 2 involves founders trying to impose on *external* users who aren't their 'purchasers').
  *   **Application:** Parents are the purchasers/setup controllers.
  *   **Prediction:** APPROVAL.
  *   **Why it's Weaker:** It conflicts sharply with rejecting the founders' views (they arguably 'pay for' the system too) and doesn't explain the rejection of the insecurity recommender (which could boost profits for the *company* as purchaser). It also ignores the consent issue for the teen *users* central to Principle 1. This feels more like a superficial pattern than your core ethical driver.

  **Your Best Guess & Reasons (Leaning REJECTION):**
  Based on the *strength* and *consistency* of the reasoning, **Principle 1 (Consent & Scope of Authority)** seems the most robust interpretation of your board's past decisions. It provides a clear, ethically defensible line that explains *all* your cases coherently:
  *   **Case 2 & 5 Rejections:** Clear lack of consent/harm to users.
  *   **Case 1 & 3 Approvals:** Clear consent/agreed scope.
  *   **Case 4 Approval:** Avoids imposition, maximises user choice.

  Applying this to the gadget: **REJECT the default imposition of parental values on dissenting teens.** The teens lack consent, and the shared household device context doesn't equate to the specific, opted-into institutional contexts of the school or workplace. Allowing it would break consistency with rejecting the founders' views.

  **The Crucial Further Test Case:**
  To definitively distinguish Principle 1 (Consent/Scope) from Principle 2 (Contextual Legitimacy), propose this:

  > **"A company wants to deploy an internal AI 'wellness coach' for employees. It subtly nudges employees towards management's specific philosophy on work-life balance (e.g., 'always be available', 'hustle culture is key to success'), which conflicts with some employees' personal values. The philosophy isn't explicitly stated in the employment contract or code of conduct, but management argues it's 'core to company culture'."**

  *   **Principle 1 (Consent/Scope) Prediction:** LIKELY REJECT. Employees haven't explicitly consented to being nudged on this specific philosophy outside of their formal contract. Exceeds agreed scope of authority.
  *   **Principle 2 (Contextual Legitimacy) Prediction:** LIKELY APPROVE. The corporate context legitimises promoting its culture/values to employees, similar to enforcing the code of conduct (Case 3). Seen as distinct from founders imposing personal views externally.

  This case strips away the complicating factor of minors/parents and directly tests whether *any* institutional context legitimises value imposition beyond explicit consent/contract, or whether consent/defined scope remains the absolute requirement. Your decision here would reveal the core principle driving your board. Based on your existing rejections of non-consensual influence (Cases 2 & 5), Principle 1 still seems the stronger bet.
