prompt: |-
  I am a graduate student presenting my job-market paper at a small decision theory workshop next month, and I need a Q&A prep sheet. The paper argues that the standard cases for expected value fanaticism — the ones in which an enormous good rides on an absurdly small probability, so that maximizing expected value swamps every ordinary consideration — depend on an assumption nobody states: that the size of the payoff and the size of the probability can be varied independently, so that the payoff can be held fixed while the odds are driven arbitrarily low. I argue that this independence is an artifact of how the cases are written down. Whenever the enormous payoff is something a mechanism actually produces, the same mechanism constrains how probable that payoff can be; there is no way to hold the good fixed and lower the odds without changing what produces the good. I am not claiming that no coherent mathematical object has these features — one can write down a distribution with any payoff at any probability — but that the argument for fanaticism needs the prospect to be something an agent can do, and once you ask what the agent would actually do, the payoff and the odds are fixed by the same causal structure. I call this the coupling condition, and I use it to argue that we can keep ordinary expected value maximization without the Pascalian embarrassments.

  The room will be about a dozen people, and I know who they are. Four work on the foundations of decision theory and will come at me through the axioms: they will ask which axiom I am rejecting, whether my argument is a claim about rational preference at all or a disguised claim about physics, and whether anything recognizable as expected utility survives the change. Two are formal epistemologists who care about the separability of credence and value and will press on whether I am offering a norm of rationality or a prediction about which gambles exist. One works on the long-term future and infinite ethics and will suspect that I am handing people a respectable excuse to ignore tiny probabilities of catastrophe. One is an economist who will bring up the St. Petersburg paradox, bounded utility, and the fact that decision theory was deliberately built to handle the kind of uninstantiated prospects I want to exclude.

  Prepare me. Give me the seven or eight objections I will actually get from this room — not the generic objections to expected value maximization — ordered by how likely they are and how much damage they would do, each phrased the way the person who holds it would phrase it, each with a two-minute reply and a note on where the reply is soft. Tell me what to concede up front. And tell me the one question I am hoping nobody asks.
reasoning: |-
  Okay, the user is a grad student prepping for a job-market workshop. They've presented a paper challenging expected value fanaticism by introducing a coupling condition. Let me unpack their core argument first. They're saying that in standard cases like Pascal's Mugging, you can't independently vary the payoff size and probability because the mechanism producing the payoff constrains both. So the usual fanaticism arguments fall apart when you consider real-world implementation.

  Now, the workshop audience is specialized: four decision theory foundationalists, two formal epistemologists, one long-term future ethicist, and one economist. Each will have specific angles. The user needs targeted Q&A prep.

  Hmm, the foundationalists will likely question which axiom is being rejected. They might argue that rational preferences should handle abstract prospects, not just physically realizable ones. The coupling condition could be seen as importing physics into decision theory. How to reply? Concede that the axioms work mathematically but emphasize rational choice requires actionable prospects. The soft spot is whether this reduces decision theory to engineering.

  The formal epistemologists will worry about credence-value separability. If coupling binds probability and value, does that undermine standard expected utility theory? The reply should clarify that coupling affects gamble specification, not the EU framework itself. But the soft spot is whether this makes EU conditional on empirical facts about the world.

  The long-term future person will fear this gives excuses to ignore catastrophic risks. Need to stress that coupling doesn't dismiss small probabilities, just requires realistic mechanisms. But conceding that some important cases (like asteroid impacts) might still fit fanaticism patterns could be a vulnerability.

  The economist will bring up St. Petersburg and bounded utility. They'll see coupling as unnecessary if utility is bounded. Reply should agree bounded utility helps but argue coupling addresses cases where unboundedness seems plausible. Soft spot is whether coupling solves anything new beyond existing solutions.

  Ah, the nightmare question would be if someone links the argument to fanaticism in long-termism. If existential risk mitigation seems "coupled," does that make fanaticism rational? The user needs to distinguish tractable mechanisms (where coupling applies) from speculative ones (where it might not). This could force them into uncomfortable territory about which long-term gambles are "real."

  Prioritizing objections: the foundationalists' challenges are most damaging because they attack the coherence of the argument within decision theory. The economist's point is next because St. Petersburg is a classic counterexample. Then the long-term fear, then the epistemologists.

  User should concede upfront that abstract prospects are mathematically coherent and that bounded utility helps. But insist rational choice requires feasible options. The key move is shifting the burden: fanatics must specify mechanisms, not just postulate payoffs.

  Need to make sure replies stay within two minutes. Keep them crisp: state the objection, give the coupling response, flag the weakness. The nightmare question requires careful handling—distinguish between different types of long-term gambles without dismissing existential risk.
answer: |-
  Here are the 7 most likely objections from your specific audience, ranked by damage potential and likelihood, phrased as they'd ask them, with concise replies, soft spots, strategic concessions, and the nightmare question:

  **Prioritized Objections & Replies:**

  1.  **The Foundationalist (Damage: ⭐⭐⭐⭐ | Likelihood: ⭐⭐⭐⭐)**
      *   **Objection (Axiomatic Purity):** "Your 'coupling condition' seems like a constraint from physics or feasibility, smuggled into rational preference. Decision theory is about coherence of preferences over *prospects*, defined abstractly by outcomes and probabilities. Which axiom (Completeness, Transitivity, Independence, Continuity) are you actually rejecting? If none, how is this a *decision-theoretic* argument and not just an observation about the world?"
      *   **2-Minute Reply:** "I'm not rejecting any core axiom *within* the domain of well-specified, *actionable* prospects. The argument is that fanaticism relies on prospects that *appear* well-specified abstractly ('Utility U at probability p') but are *not actionable* because they lack a coherent causal mechanism that fixes both U and p independently. Rational choice requires choosing among *options an agent can genuinely bring about*. The coupling condition reveals that the abstractly specified prospects central to fanaticism arguments don't correspond to such actionable options. Expected utility maximization applies fully *within* the space of coupled prospects."
      *   **Soft Spot:** Distinguishing between "abstract prospect coherence" (which fanaticism relies on) and "actionable prospect specification" (where coupling applies). Requires careful framing of what constitutes a legitimate option for rational choice.

  2.  **The Economist (Damage: ⭐⭐⭐⭐ | Likelihood: ⭐⭐⭐⭐)**
      *   **Objection (St. Petersburg & Bounded Utility):** "This seems like a convoluted solution in search of a problem. The St. Petersburg paradox already showed the issue with unbounded utility and *mathematically* possible high-payoff/low-prob events. Standard solutions like bounded utility functions or rejection of infinite expectations cleanly handle the fanaticism problem without needing your 'coupling' or excluding prospects. Aren't you just reinventing the wheel poorly? Why dismiss bounded utility?"
      *   **2-Minute Reply:** "Bounded utility is a powerful and often correct solution! I concede it resolves *many* fanaticism cases arising from mathematical unboundedness. However, fanaticism arguments often target cases where bounded utility seems *implausible* (e.g., vast moral value, existential stakes) or try to push boundaries *within* plausible bounds. My argument tackles these by showing that even *if* utility is locally unbounded for high-stakes goods, the *prospects* needed to exploit this fanatically – where U is fixed astronomically high *while* p is driven arbitrarily low independently – don't correspond to realizable actions. Coupling provides a distinct, mechanism-based constraint *complementary* to bounded utility."
      *   **Soft Spot:** If bounded utility is accepted as the primary solution, coupling can seem redundant. Need to argue for its unique value against "plausibly unbounded" cases.

  3.  **The Long-Term Futurist (Damage: ⭐⭐⭐⭐ | Likelihood: ⭐⭐⭐⭐)**
      *   **Objection (Ignoring Catastrophe):** "You're giving policymakers an intellectual fig leaf to dismiss small-probability existential risks! The mechanism *is* real: an asteroid impact, engineered pandemic, or unaligned AI *could* cause near-infinite disvalue (or value if prevented). Your 'coupling' just seems to say 'if the payoff is huge, the probability can't be *too* tiny', but that's precisely what we need to take seriously – mechanisms exist where vast value *is* coupled with very small, non-zero probabilities. Doesn't your view dangerously downplay the Precautionary Principle?"
      *   **2-Minute Reply:** "Absolutely not! My argument *does not* dismiss small probabilities of vast stakes if they arise from a *credible, coupled mechanism*. If an asteroid deflection mission truly offers a 10^-9 chance of saving 10^15 lives, and that probability is fixed by the physics/engineering of the mechanism, then EV maximization *demands* we weigh it seriously, even if the EV is small relative to certain costs. Fanaticism arises only when we imagine *holding the payoff fixed* (e.g., 'saving 10^15 lives') and *arbitrarily lowering the probability further* ('what if it's 10^-100?') *without changing the causal story*. That decoupling isn't possible for real mechanisms. Real long-term risks with plausible mechanisms deserve their full, coupled EV."
      *   **Soft Spot:** Distinguishing legitimate small-p/high-U prospects (like asteroid deflection) from purely abstract decoupled ones (Pascal's Mugging). Must avoid sounding dismissive of genuine tail risks.

  4.  **The Foundationalist (Damage: ⭐⭐⭐ | Likelihood: ⭐⭐⭐)**
      *   **Objection (Scope of Rational Preference):** "Rationality governs *attitudes* towards prospects, not the metaphysical possibility of instantiating them. We reason coherently about uninstantiated prospects all the time (e.g., idealized games, hypotheticals). Why can't an agent have coherent, fanatical preferences over the *abstract mathematical objects* (distributions) you mention, even if they can't be realized? Isn't your argument really about feasibility, not rationality?"
      *   **2-Minute Reply:** "Decision theory aims to guide *action*. Rational preferences over prospects must ultimately be *action-guiding* for the choices the agent actually faces. While we can contemplate abstract distributions, the norms of rational *choice* apply to selecting among *feasible acts*. The fanaticism argument uses abstract prospects to derive counterintuitive prescriptions for *real choices*. I argue these prescriptions fail because the abstract prospects don't map onto coherent, feasible acts – the coupling condition explains *why* they don't. Rationality requires coherence over the domain of *possible actions*, not just abstract mathematical spaces."
      *   **Soft Spot:** A strong commitment to formalism might see this as changing the subject from pure preference coherence.

  5.  **The Formal Epistemologist (Damage: ⭐⭐ | Likelihood: ⭐⭐⭐)**
      *   **Objection (Credence/Value Separability):** "Your coupling seems to violate the fundamental separability of credence (probability) and utility (value) that underpins expected utility theory. In EU, we assign probabilities to states and utilities to outcomes *independently*, then combine them. By tying the *size* of the outcome utility to the *probability* it can occur via 'mechanism', aren't you conflating epistemology (what we can know/bring about) with axiology (what's valuable)? Is this still EU maximization?"
      *   **2-Minute Reply:** "I fully endorse credence/value separability *within the specification of a single, coherent prospect defined by its mechanism*. Credence applies to the mechanism's uncertain outputs; utility applies to the resulting outcomes. The coupling condition operates at the level of *defining the prospect/act itself*. It says that when specifying an *act* (e.g., 'pull this lever'), the mechanism *simultaneously* fixes the *possible* outcome magnitudes *and* constrains the *possible* probabilities of those outcomes. We still assign credences over the mechanism's results and utilities to the results independently; but the mechanism constrains *which* (magnitude, probability) pairs are even *available* to be specified as outcomes in the prospect."
      *   **Soft Spot:** Requires clear separation between prospect *specification* (where coupling acts) and *evaluation* (where credence/value separation holds). Can feel like a subtle shift.

  6.  **The Formal Epistemologist (Damage: ⭐⭐ | Likelihood: ⭐⭐)**
      *   **Objection (Norm vs. Prediction):** "Is your 'coupling condition' a *normative* claim about how agents *should* conceptualize prospects/gambles? Or is it a *positive* claim about which gambles *actually exist* in the world? If normative, how is it justified within decision theory? If positive, how does it constrain rational agents contemplating hypothetical or as-yet-unknown mechanisms?"
      *   **2-Minute Reply:** "It's primarily a claim about the *structure of feasible actions*. When an agent considers a concrete course of action ('build this device', 'fund this research', 'pay this mugger'), the causal structure of that action determines both the potential payoffs it can produce *and* the probabilities associated with them. The norm is: agents *should* evaluate the expected value of *feasible actions* based on their coupled (payoff, probability) profiles, rather than evaluating abstract, decoupled profiles that don't correspond to any feasible action. For genuinely unknown mechanisms (e.g., novel tech), agents must use their best estimates *of what that mechanism would entail*, which inherently involves estimating its coupled properties."
      *   **Soft Spot:** Blurs the line slightly between metaphysics of actions and norms of deliberation. Doesn't fully address purely hypothetical reasoning.

  7.  **The Foundationalist (Damage: ⭐⭐ | Likelihood: ⭐⭐)**
      *   **Objection (Continuity Axiom):** "Doesn't your view directly attack the Continuity Axiom? Continuity implies that for any outcome (like a huge payoff U), there should be some sufficiently small probability p such that a gamble offering U with probability p (and status quo otherwise) is preferred to some fixed moderate good. Your coupling seems to deny that such a p can always be found *while holding U fixed*, which is precisely what Continuity assumes is possible. Are you rejecting Continuity?"
      *   **2-Minute Reply:** "I'm not rejecting Continuity *within the realm of coupled prospects*. Continuity holds for any *fixed, feasible mechanism*: for a given action (mechanism M), if it *can* produce payoff U with probability p(M), then as p(M) approaches 0, the value of the prospect decreases continuously. The fanaticism problem arises when we try to apply Continuity *across different mechanisms* – imagining we can hold U fixed while moving to a *different* mechanism M' that produces U with a much lower p(M'). Coupling says M' doesn't exist or produces a different U. Continuity governs preferences over variations *within* a single well-specified (coupled) prospect space."
      *   **Soft Spot:** Requires accepting that Continuity applies only *within* a prospect defined by a fixed mechanism, not *across* mechanisms arbitrarily.

  **What to Concede Up Front:**

  1.  **Abstract Distributions are Coherent:** "I fully agree that mathematically, one can define a probability distribution with any payoff at any probability. The fanaticism arguments are mathematically sound *given* those abstract distributions."
  2.  **Bounded Utility Often Works:** "Solutions like bounded utility functions successfully resolve fanaticism for many cases, especially those stemming from pure mathematical unboundedness. They are important tools."
  3.  **Feasibility Matters for Action:** "Decision theory ultimately aims to guide action. Rational choice must operate over options that are, in some meaningful sense, feasible or actionable for the agent."

  **The Nightmare Question:**

  *   **The Long-Term Futurist/Foundationalist Hybrid:** "Let's grant your coupling condition for simple, tractable mechanisms. But what about interventions aimed at influencing the *very long-term future*? The 'mechanism' here (e.g., shaping AI development, promoting cooperative institutions) is inherently poorly understood and speculative. Doesn't this *lack* of understanding about the causal structure *recreate* the possibility of fanaticism? Couldn't one argue there exists *some* feasible (though poorly specified) action with a tiny, unknown probability of steering the future towards near-infinite value, and that EV maximization then demands devoting immense resources to finding it? Doesn't your coupling condition break down precisely where we need decision theory most – under deep uncertainty about causal structure itself?"

  **Why it's a Nightmare:**

  1.  **Targets Core Application:** It directly attacks the most motivationally important potential counterexample to your view (long-termism).
  2.  **Exploits Uncertainty:** It uses the *lack* of knowledge about mechanisms, which your argument relies on defining clearly, as the very source of potential fanaticism.
  3.  **Hard to Refute Simply:** Requires navigating deep uncertainty, the epistemology of speculative mechanisms, and the value of information gathering, moving far from your core argument in a 2-minute reply.
  4.  **High Stakes:** A weak answer here could alienate the long-termist and make your view seem practically irrelevant for major ethical concerns.

  **How to Mitigate (if asked):** *Briefly* acknowledge the challenge. Emphasize: 1) EV still applies to *research* aimed at reducing uncertainty about mechanisms; its value is coupled to the plausibility of finding impactful actions. 2) Under deep uncertainty, *robust* decision-making (maximin, satisficing) often complements EV where mechanisms are too vague for reliable coupling estimates. 3) True fanaticism requires not just *uncertainty* but an *unfounded conviction* in the existence of a decoupled (huge payoff, arbitrarily low probability) prospect, which remains unjustified. Conclude that coupling guides us to focus resources on understanding causal mechanisms better, rather than betting blindly on abstract possibilities.

  **Good luck!** Your core argument is strong and novel. Focus on clearly articulating that fanaticism requires *decoupled prospects*, and decoupled prospects aren't *actionable prospects*. Frame coupling as revealing the structure of real options, not as changing the axioms for abstract ones. Be prepared to concede the math but insist on the relevance to action.
