  We are creating a decision procedure for dispute resolution that focuses on identifying whether a dispute is verbal (about the meaning of words) or substantive (about non-linguistic facts). The procedure must also handle cases that are about which words or concepts to adopt (policy questions) and cases where coordination is needed.

   The procedure will be step-by-step, with specific questions and actions.

   Step 1: Initial Review
     - Ask: "Can you both state the disagreement in a way that does not use the contested term(s) and without using any other term that might be contested?"
     - Sufficient answer: Each party must provide a restatement of the issue that avoids the contested words and still captures the essence of the dispute. If they can do this, then the dispute is likely substantive. If they cannot, then we note that the dispute might be verbal and proceed to Step 2.

   Step 2: Non-Linguistic Fact Agreement
     - Ask: "Do you agree on all the non-linguistic facts? Please list the facts that are relevant to the dispute and confirm agreement on each."
     - Sufficient answer: The parties must explicitly agree on a list of facts. If there is any disagreement about non-linguistic facts, then the dispute is at least partially substantive and we note that. However, if they agree on all non-linguistic facts, then the dispute may be verbal and we proceed to Step 3.

   Step 3: The Basic Test (Hold non-linguistic facts fixed)
     - Ask: "Given that you both agree on the non-linguistic facts, what exactly do you still disagree about? Please state the point of disagreement without using the contested term(s)."
     - Sufficient answer: If the parties can state a disagreement that does not depend on the contested terms, then the dispute is substantive. If they cannot, then the dispute is verbal. However, note that even if they can state a disagreement without the terms, it might still be about the concept (so we have a policy dispute). Proceed to Step 4 to test.

   Step 4: Substitution Test
     - For each contested term, ask each party: "What do you mean by [term]? Please define it clearly."
     - Then, take each party's definition and substitute it into the other party's claim. Then ask: "If we replace the term with your own definition in the other party's claim, do you still disagree with the claim?"
     - Sufficient answer: If after substitution the disagreement vanishes (i.e., they agree when using the same definition), then the dispute is merely verbal. If the disagreement remains even after substitution, then the dispute is substantive. But note: if the substitution leads to agreement only when using one party's definition but not the other, then we might be dealing with a policy dispute (about which definition to use).

   Step 5: Distinguishing Merely Verbal vs. Policy (Conceptual Choice)
     - If the dispute is found to be verbal (i.e., disappears when definitions are fixed), then we need to determine if it is merely verbal (no real issue left) or if it is a policy dispute (about which definition we should adopt).
     - Ask: "Is there a reason why we should prefer one definition over the other? For example, does one definition better serve the goals of the program, or is one more aligned with common usage in the field, or does one avoid ambiguity in the future?"
     - Also, ask: "Is the dispute about the way we should use the term going forward, for the purposes of our program?"
     - Sufficient answer: If the parties provide reasons that relate to the program's policies, goals, or future clarity, then the dispute is a policy dispute. If they cannot, then it is merely verbal.

   Step 6: Internal Coherence and Legitimacy Check (for cases where both definitions are valid)
     - If both definitions are found to be internally coherent and anchored in legitimate traditions (i.e., both are reasonable and used in some part of the academic community), then we have a situation where there is no fact of the matter about which is correct.
     - Action: Propose coordination options: 
          a. Agree on a term to use in the program context.
          b. Disambiguate (e.g., use "theory-A" and "theory-B").
          c. Agree to stop using the word at each other (avoid the term in contexts where confusion arises).
          d. Propose a new term or sharpen an existing one if neither existing term is suitable.

   Step 7: Handoff Points
     - The procedure must stop and hand the decision to a person (the dean) in the following cases:
          a. After Step 2, if there is a substantive disagreement about non-linguistic facts that cannot be resolved, then the case is substantive and should go to the formal process (unless it is resolved by the parties with the help of the chair).
          b. After Step 5, if the dispute is determined to be a policy dispute (about which definition to adopt), then it should be routed to the dean as a policy question.
          c. After Step 3, if the chair cannot determine whether the dispute is verbal or substantive (because the parties are unable to restate without the contested terms or because the restatement is unclear), then the conservative default is to treat it as substantive and route it to the formal process.

   Step 8: Guard Against Abuse
     - To prevent misusing the "merely verbal" diagnosis to silence a party:
          - The chair must verify that both parties agree on the non-linguistic facts (Step 2) and that the substitution test (Step 4) is applied fairly.
          - Evidence that a party is misusing the diagnosis: 
               * If one party insists on a definition that is idiosyncratic and not rooted in any legitimate tradition, that might be an attempt to avoid a substantive issue.
               * If one party is trying to change the subject from a substantive grievance to a verbal one, by focusing on a term that is not central to the original complaint.
          - The chair should ask: "Is the contested term central to the original complaint, or is it being introduced to obscure a substantive issue?" and "Is there a pattern of one party consistently trying to reframe substantive disputes as verbal?"

