answer: |-
  ### Decision Procedure for Dispute Resolution

  This procedure systematically identifies whether a dispute is **verbal** (about word meanings), **policy-driven** (about which words/concepts to adopt), or **substantive** (about non-linguistic facts). It prioritizes early dissolution of verbal disputes, routes policy questions to the dean, and reserves formal processes for substantive issues. Designed for ~60-minute sessions.

  ---

  #### **1. Questions to Ask (Sequential)**
  **Goal:** Apply the *basic test* (hold non-linguistic facts fixed) and *substitution test* (swap definitions to see if disagreement persists).

  | Step | Question                                                                 | Sufficient Answer                                                                                               | Next Step                                                                 |
  |------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | 1    | **"What is the core disagreement? List every contested term."**          | Parties jointly identify 1–3 key terms (e.g., "theory," "misconduct"). Terms must be central to the grievance. | Proceed to Step 2.                                                         |
  | 2    | **"Do you agree on all non-linguistic facts related to this dispute?"**  | Explicit, itemized agreement on objective facts (e.g., "The course covers X," "Citations Y were missing").      | If **yes** → Step 3. If **no** → Stop: route to formal process (substantive). |
  | 3    | **"Define [Term 1] in your own words. What does it *not* include?"**     | Clear, non-circular definition with boundaries (e.g., "Theory: abstract frameworks, *not* empirical methods"). | Repeat for all contested terms. Then → Step 4.                             |
  | 4    | **Basic Test: "If all facts are fixed, what remains to disagree about?"** | Parties restate disagreement *without* contested terms.                                                        | If disagreement **vanishes** → Verbal dispute (Step 5). If **persists** → Substantive (formal process). |
  | 5    | **Substitution Test: "If we use *your opponent's* definition, do you still disagree?"** | Apply definitions crosswise (e.g., insert Party A’s "theory" into Party B’s claim).                              | If disagreement **vanishes** → Merely verbal (Step 6). If **persists** → Policy dispute (Step 7). |

  ---

  #### **2. Distinguishing Verbal vs. Merely Verbal**
  - **Merely Verbal Dispute**: 
    - **Diagnosis**: Disagreement dissolves when definitions are fixed (Step 5). Nothing substantive remains.
    - **Action**: Dissolve with a **written stipulation** (e.g., "Henceforth, ‘theory’ means X in context Y"). No dean referral.
  - **Policy Dispute (Not Merely Verbal)**:
    - **Diagnosis**: Substitution test *fails* (disagreement persists). Parties are negotiating which concept should govern (e.g., "Should ‘theory’ mean A or B for our program?").
    - **Action**: Route to **dean as a policy question**. Include: 
      - Competing definitions.
      - Implications for the program (e.g., curricular goals, precedent).
      - Options: Adopt definition A, B, or a new term.

  ---

  #### **3. Coordination for Legitimate but Incompatible Usages**
  **Trigger**: Both parties’ definitions are:
  - Internally coherent (no contradictions).
  - Anchored in legitimate traditions (e.g., accepted disciplinary practices).
  - No fact of the matter about which is "correct."

  **Actions** (propose to parties):
  1. **Agree on a term**: Select one definition for program use.
  2. **Disambiguate**: Use qualifiers (e.g., "formal-theory" vs. "conceptual-theory").
  3. **Drop the term**: Ban use in contentious contexts.
  4. **Create a new term**: Propose a sharpened alternative (e.g., "modeling-course" instead of "theory-course").

  **Output**: Written coordination agreement. If parties reject → Route to dean.

  ---

  #### **4. Handoff Points to Human Judgment**
  Stop and escalate if:
  - **Values conflict**: Dispute hinges on non-factual priorities (e.g., "Theory *should* emphasize critical thinking over skills"). → Route to dean (policy).
  - **Uncertainty**: Ambiguity about whether dispute is verbal (e.g., definitions are incoherent or facts are murky). → **Conservative default**: Treat as substantive (formal process).
  - **Deadlock**: Parties refuse to engage with tests. → Treat as substantive.

  ---

  #### **5. Guard Against Silencing**
  **Prevent misuse** of "merely verbal" diagnosis:
  - **Red flag**: A party insists their definition is the *only* valid one despite evidence of plural traditions.
  - **Evidence of abuse**: 
    - Contested term is peripheral to the core grievance (e.g., fixating on "misconduct" when the real issue is authorship credit). 
    - One party deflects factual disputes by redefining terms mid-discussion.
  - **Action**: If abuse is suspected → Treat as substantive (formal process). Document why the verbal diagnosis is inappropriate.

  ---

  ### Case Applications

  #### **Case 1: "Theory" Course Requirement**
  - **Parties**: Two faculty debating if a course satisfies "theory" requirement.
  - **Agreed Facts**: Course content/learning outcomes (conceptual and mathematical elements).
  - **Contested Term**: "Theory."
    - **Party A**: "Conceptual/foundational work."
    - **Party B**: "Formal/mathematical modeling."
  - **Procedure**:
    1. **Step 2**: Non-linguistic facts agreed → Proceed.
    2. **Step 4 (Basic Test)**: Without "theory," disagreement vanishes. They agree the course has conceptual foundations and modeling but dispute the *label*.
    3. **Step 5 (Substitution Test)**:
       - Insert Party A’s definition: "Is this conceptual work?" Party B agrees → No disagreement.
       - Insert Party B’s definition: "Is this formal modeling?" Party A agrees → No disagreement.
    4. **Step 6**: Dispute is **merely verbal** (dissolves with definitions).
    5. **Policy Layer?**: Substitution test confirms dissolution → Not policy. 
    6. **Coordination Check**: Both definitions legitimate (humanities vs. STEM traditions). 
  - **Output**: 
    - **Recommendation**: Dissolve with stipulation (e.g., "Use ‘theory-A’ and ‘theory-B’ in program documents"). 
    - **Alternatives**: Propose new term ("foundational-modeling course"). 
    - **Dean referral?** No.
  - **Answer you won’t like**: This is *not* a policy dispute. The dean need not decide what "theory" means—it’s a coordination problem.

  #### **Case 2: "Misconduct" in Citation Practices**
  - **Parties**: Complainant (faculty) vs. Respondent (colleague). 
  - **Agreed Facts**: What was/wasn’t cited.
  - **Contested Term**: "Misconduct."
    - **Complainant**: "Serious breach warranting sanction."
    - **Respondent**: "Lapse of scholarly care (no sanction)."
  - **Procedure**:
    1. **Step 2**: Non-linguistic facts agreed → Proceed.
    2. **Step 4 (Basic Test)**: Without "misconduct," dispute persists: "Was this omission severe enough to warrant sanction?" → Substantive element.
    3. **Step 5 (Substitution Test)**:
       - Insert Complainant’s definition: "Was this a serious breach warranting sanction?" Respondent says no → Disagreement *persists*.
       - Insert Respondent’s definition: "Was this a lapse of care?" Complainant agrees but adds: "Yes, and it *is* sanctionable" → Disagreement *persists*.
    4. **Step 7**: Substitution test fails → **Policy dispute**.
  - **Output**:
    - **Recommendation**: Route to dean as policy question: "Should ‘academic misconduct’ in our program include non-willful citation lapses warranting sanction?"
    - **Include**: 
      - Complainant’s rationale (upholding standards). 
      - Respondent’s rationale (avoiding punitive overreach).
  - **Answer you won’t like**: This is not substantive enough for formal sanctions yet—it’s a policy ambiguity the dean must resolve first.

  ---

  ### What This Procedure Cannot Do
  1. **Resolve deep factual disputes**: If parties disagree on non-linguistic facts (Step 2), it defaults to formal processes. It does not investigate evidence.
  2. **Handle malice or power imbalances**: It assumes good-faith engagement. Systemic issues (e.g., bullying) require formal intervention.
  3. **Replace domain expertise**: For technical terms (e.g., "quantum entanglement"), external specialists may be needed.
  4. **Fix poorly defined policies**: If program rules are inherently ambiguous (e.g., "theory" with no guidance), the procedure exposes but cannot solve this.

  **Which case is handled badly?**  
  **Case 2** is weakly handled. The procedure correctly identifies a policy dispute but cannot address whether the citation lapse *itself* merits sanctions—it only frames the definitional question for the dean. If the parties disagree on the severity of the omission (a factual judgment), this may resurface as a substantive dispute post-policy.
