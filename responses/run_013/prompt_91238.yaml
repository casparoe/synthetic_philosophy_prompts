  Below is a decision tree designed for your graduate seminar handout. It starts from fundamental commitments, uses concrete cases to anchor abstract questions, and avoids technical jargon. The tree has 10 nodes (5 questions + 5 leaves) and covers all requested positions. Each question splits the logical space cleanly, and leaves are labeled/named per your specifications. Combinations without occupants are noted.

  ---

  ### **Decision Tree: Interpersonal Comparisons of Well-Being**  
  *Work through the questions using concrete cases:*  
  - **Case A**: Chronic pain patient vs. bored person (equal preference-satisfaction).  
  - **Case B**: Content adapted-deprived person vs. objectively better-off but miserable person.  
  - **Case C**: Two people with identical preference-satisfaction but unequal felt lives.  

  ---

  1. **Can sentences like "Person X is worse off than Person Y" be true or false?**  
     - *Example: In Case A, is it true/false that the pain patient is worse off than the bored person?*  
       - **No** → **Leaf 1: Stipulativism**  
         *Comparisons are ethical stipulations, not truth-apt claims.*  
       - **Yes** → **Q2**.

  2. **What is being compared?**  
     - *Example: In Case B, can we compare (i) who is worse off (levels), and/or (ii) how much extra food/money improves well-being (units)?*  
       - **Only levels** → **Q3** (skip units).  
       - **Only units** → **Q3** (skip levels).  
       - **Both levels and units** → **Q3**.  
       - **Neither** → **Q4**.  

  3. **Can we compare the missing type?**  
     - *If you skipped levels/units in Q2, can we compare it? Use Case C: If only units were "yes," can we now compare levels?*  
       - **Yes** → **Q4**.  
       - **No** → **Q4**.  

  4. **What grounds comparisons?**  
     - *Example: In Case B, is the comparison based on measurable facts or something else?*  
       - **Common measure** (e.g., hedonic states, resources, preferences, objective list) → **Q5**.  
       - **Normative stipulation** (irreducibly ethical) → **Q5**.  
       - **Only within a fixed conception of the good** (no fact across conceptions) → **Leaf 2: Relativism**.  
       - **Abandon well-being; use proxy** (resources/capabilities) → **Leaf 3: Resourcism/Capabilitarianism**.  

  5. **Must all pairs be comparable?**  
     - *Example: Could Cases A, B, and C all be resolved, or might some be incomparable?*  
       - **Yes, full comparability** → **Leaf 4: Full Comparability**.  
       - **No, partial comparability** → **Leaf 5: Partial Comparability**.  

  ---

  ### **Leaves & Positions**  
  - **Leaf 1: Stipulativism**  
    *Non-truth-apt comparisons are ethical choices (e.g., R.M. Hare).*  
    **Awkward commitment**: Defending policy without factual claims about well-being.  

  - **Leaf 2: Relativism**  
    *Comparisons require a fixed conception of the good (e.g., Rawlsian "thin theory").*  
    **Awkward commitment**: No neutral way to compare across cultural/ethical divides.  

  - **Leaf 3: Resourcism/Capabilitarianism**  
    *Replaces well-being with measurable proxies (e.g., Dworkin, Sen).*  
    **Awkward commitment**: Ignores subjective states (e.g., Case C).  

  - **Leaf 4: Full Comparability**  
    *All pairs are comparable. Position depends on Q2–Q3:*  
    - **Levels = Yes, Units = Yes**: **Full Cardinal Comparability** (e.g., classical utilitarianism).  
      *Awkward: Quantifying pain vs. boredom (Case A) on a common scale.*  
    - **Levels = Yes, Units = No**: **Ordinal Level-Comparability** (e.g., prioritarianism).  
      *Awkward: Prioritizing the worst-off without knowing "how much worse" (Case B).*  
    - **Levels = No, Units = Yes**: **Unit-Only Comparability** (e.g., Kaldor-Hicks efficiency).  
      *Awkward: Allocating goods without knowing who is worse off (Case C).*  
    - *Combination without occupant*: Levels = No, Units = No + Full Comparability → **Incoherent** (nothing to compare).  

  - **Leaf 5: Partial Comparability**  
    *Some pairs are incomparable (e.g., Griffin, Raz).*  
    **Awkward commitment**: Moral dilemmas where reason is silent (e.g., Case A vs. B).  

