prompt: |-
  I have read rationalist blogs and forums for years, and I have a settled set of gut verdicts about how much the long-run consequences of an action bear on its moral status. I would like to know what principle, if any, unifies them, and I am prepared to be told that one of my verdicts has to go.

  Here are the cases and my verdicts.

  Voting in a close national election for the candidate I judge somewhat better: clearly worth doing, and I would feel a mild sting at skipping it — even though the chance my single vote is decisive is vanishing and the downstream effects are anyone's guess. Spending forty dollars on a well-made sweater I will wear for years: morally neutral; I do not owe anyone a justification, though the long-run effects on labor practices and the climate are unknowable. Giving a hundred dollars to a charity that distributes anti-malarial bednets, where the near-term effects are well evidenced: clearly good, and good because of its effects. Giving a hundred dollars to a group doing speculative work to make advanced AI go well: at least as good as the bednets, possibly better — even though I cannot trace any specific near-term effect and the long-run payoff is a lottery. Recycling one bottle: fine, morally negligible, not required of me. Having a child: permissible and good, but I do not think it is good because of the child's long-run consequences, which could be anything.

  The pair I cannot square: the speculative AI donation and the sweater both have essentially unmeasurable long-run consequences, yet I call one strongly good and the other morally neutral. Voting and recycling both have negligible marginal causal impact, yet I call one nearly obligatory and the other not required at all. And the AI donation and the child have the same clueless long-run structure, yet I ground the goodness of one in its effects and refuse to ground the other that way.

  Here is the principle I suspect is doing the work, which I will call the horizon principle: an act's moral status is fixed by the expected value of its consequences within the horizon over which I can assign non-trivial credences, and beyond that horizon acts inherit the moral status of their reference class. Please test it against the cases, repair it where it fails, and tell me plainly which of my verdicts it forces me to abandon. Then say what the repaired principle predicts for a case I have not listed: choosing between two careers, one with clear and modest local benefit and one whose payoff is entirely speculative and far off. If no single principle can hold all the verdicts, give me the smallest set of candidates, name the case that motivates each clause, and say which candidate I should prefer once I see what it costs me.
reasoning: |-
  Hmm, the user has been deeply engaged with rationalist thinking and has developed a set of moral intuitions about various actions. They're struggling to find a unifying principle that explains why they judge certain actions as good, neutral, or obligatory despite similar structural features regarding uncertainty and long-term consequences.

  Looking at their cases: voting feels obligatory despite negligible impact, buying a sweater feels neutral despite unknowable ripple effects, donating to bednets feels good due to clear evidence, speculative AI donation feels good despite uncertainty, recycling feels negligible, and having a child feels permissible without needing to justify long-term consequences. The tensions are clear - why treat speculative AI donation differently from buying a sweater when both have unmeasurable effects? Why treat voting differently from recycling when both have near-zero marginal impact?

  Their proposed "horizon principle" tries to solve this by saying we judge actions based on expected value within a predictable timeframe, and beyond that, actions inherit moral status from their reference class. But this doesn't quite hold up. For the sweater purchase, the reference class of "personal consumption" is neutral, while speculative AI donation falls under "targeted long-term good" which is positive. Voting belongs to "civic duty" making it obligatory, while recycling is just "individual environmental action" which isn't required. Having a child is in the "personal life choice" category rather than being judged by its long-term effects.

  Where this principle becomes messy is with career choices - it would likely classify the clear-benefit career as good and the speculative one as neutral or weakly positive, depending on how we define the reference class. But this shows the limitations of the principle.

  A better approach might be a three-factor model: 1) Expected value within predictable horizon, 2) Structural features that create moral obligations or permissions independent of consequences, and 3) Reference classes that carry normative weight. This preserves most of their intuitions except possibly the speculative AI donation - they might need to either strengthen their justification for it or accept it as a special exception.

  For the career choice case, the three-factor model suggests the clear-benefit career would be strongly good due to predictable impacts, while the speculative career would be weakly positive at best unless it has strong structural justification. The user might need to decide whether speculative work deserves its own moral category or should be judged more cautiously.
answer: |-
  Based on your cases and the tensions you identify, your "horizon principle" is a strong candidate but needs refinement. Let's test it, repair it, and see which verdicts it forces you to abandon.

  ### Testing Your Horizon Principle
  *"An act's moral status is fixed by the expected value of its consequences within the horizon over which I can assign non-trivial credences, and beyond that horizon acts inherit the moral status of their reference class."*

  - **Voting**: Fails. The near-term expected value (your vote deciding the election) is negligible. Its "reference class" (civic participation) saves it, but the principle doesn't explain why *this* reference class is obligatory.
  - **Sweater**: Passes. Near-term consequences (your comfort) are morally neutral personal consumption. Long-term unknowable effects inherit this neutral reference class.
  - **Bednets**: Passes. High expected near-term value dominates.
  - **Speculative AI Donation**: Fails. Near-term credences are trivial (no measurable immediate impact). If its reference class is "donations to speculative causes," your principle doesn't explain why this class is "strongly good" rather than neutral.
  - **Recycling**: Passes. Negligible near-term impact, reference class ("individual pro-environmental acts") isn't obligatory.
  - **Having a Child**: Passes. Near-term value (family fulfillment) is positive/permissible. Long-term cluelessness inherits the reference class "personal life choices," not judged by distant consequences.

  **Core Problem**: The principle handles cases where the reference class is *descriptively* obvious (consumption, personal choice) but struggles when the reference class is *normatively loaded* (civic duty, speculative altruism). It doesn't explain *why* some reference classes carry moral weight.

  ### Repaired Principle: The Normative Horizon Framework
  *"An act's moral status is determined by:*
  1. **Expected Value within the Predictable Horizon**: *Where non-trivial credences exist.*
  2. **Structural Moral Properties**: *Including obligations, rights, or symbolic roles tied to the act-type, independent of long-term consequences.*
  3. **Default Reference Class**: *For unknowable long-term effects, inherit the status of the act's most salient normative type (not just descriptive type). If none, default to neutrality.*"

  ### How the Repaired Principle Handles Your Cases
  | **Case**              | **Predictable Horizon EV** | **Structural Moral Property**                          | **Default Reference Class**               | **Verdict**          | Match? |
  |-----------------------|----------------------------|--------------------------------------------------------|-------------------------------------------|----------------------|--------|
  | **Voting**            | Negligible (≈0)            | **Strong**: Civic duty; upholding democratic systems | Personal choice (neutral)                 | **Obligatory**       | ✓      |
  | **Buying Sweater**    | Moderate (personal welfare)| None                                                    | Personal consumption (neutral)            | **Neutral**          | ✓      |
  | **Bednet Donation**   | High (lives saved)         | None (effects are primary driver)                      | N/A (dominated by EV)                     | **Strongly Good**    | ✓      |
  | **Speculative AI Donation** | Low (no near-term impact)  | **Weak**: Symbolic support for existential risk mitigation? | Earning-to-give (positive) OR consumption (neutral) | **Strongly Good?**   | **✗**  |
  | **Recycling**         | Negligible (≈0)            | None                                                    | Individual pro-environmental act (neutral) | **Not Required**     | ✓      |
  | **Having a Child**    | High (family fulfillment)  | **Strong**: Parental autonomy; intrinsic human goods   | Personal life choice (permissible)        | **Permissible/Good** | ✓      |

  **The Conflict**: Your verdict on **speculative AI donation** cannot be held if you want consistency. The repaired principle forces you to either:
  - **Downgrade it to "weakly positive/neutral"** (if you deny it has special structural properties), OR
  - **Upgrade your justification** by asserting that "targeted long-term altruism" has inherent moral weight (making it a structural property).

  ### Career Choice Case Prediction
  *Choosing between:*
  - **Career A**: Clear, modest local benefit (e.g., teaching in a community school).
  - **Career B**: Entirely speculative far-off payoff (e.g., foundational math research with unknown applications).

  **Repaired Principle's Prediction**:
  - **Career A**: Strong verdict. High predictable near-term EV (direct impact on students). Structural property: Social contribution. → **Strongly Good**.
  - **Career B**: Ambiguous. Near-term EV ≈0 (no measurable impact). Structural property: None (unless "pursuit of truth" is deemed intrinsically valuable). Reference class: "Speculative work" → **Weakly Positive/Neutral**.  
  *Only becomes "strongly good" if you grant "knowledge creation" inherent moral weight.*

  ### If No Single Principle Holds All Verdicts
  A **two-principle set** is the minimal fix:

  1. **Constrained Consequentialism**:  
     *"Acts are judged by expected value within the predictable horizon (≤20-100 years)."*  
     → Explains: Bednets (strongly good), Sweater (neutral), Recycling (negligible).  
     *Motivated by: Bednets vs. Sweater contrast.*

  2. **Structural Deontology**:  
     *"Acts inherit obligations/rights from their role in essential social practices (voting, parenting) or symbolic alignment with moral priorities (speculative x-risk mitigation)."*  
     → Explains: Voting (obligatory), Having a Child (permissible), Speculative AI (strongly good *if* you accept this).  
     *Motivated by: Voting vs. Recycling contrast.*

  **Which to prefer?**  
  - If maintaining **speculative AI = strongly good**, you need Structural Deontology and must accept that moral obligations can arise from symbolic roles. Cost: Reduced consistency; "obligation" expands beyond clear duties.  
  - If downgrading **speculative AI to neutral**, Constrained Consequentialism suffices. Cost: Abandons your intuition that targeted long-term good acts are special.

  **Recommendation**: Keep **speculative AI donation** as a special case. Your intuitions suggest you *do* assign inherent normative weight to acts explicitly aimed at shaping the long-term future, even under cluelessness. This aligns with "pragmatic altruism" in rationalist communities. The repaired principle can hold all verdicts *if* you explicitly classify "targeted existential risk reduction" as a structural moral property due to its symbolic and practical role in a morally responsible society.
