  For the lottery and preface distinction: I'll argue they're two distinct paradoxes. The lottery targets probabilistic coherence and consistency in acceptance when propositions are mutually exclusive, while the preface targets aggregation of individually credible but conjunctively inconsistent beliefs. The lottery creates inconsistency through mutual exclusion, while the preface creates inconsistency through the author's fallibility admission. They test different aspects of rational acceptance.

