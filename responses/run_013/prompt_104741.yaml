prompt: |-
  I do a tiny history-of-science podcast and next week's guest is a historian (not famous, a friend's colleague) who's writing a book arguing that microbes, climate patterns, and volcanoes should count as historical actors. Her line is that the Tambora eruption wasn't just a backdrop to the crop failures and food riots that followed, and that cholera wasn't just a consequence of urban crowding but a participant in the remaking of nineteenth-century cities. She's careful to say she's not an environmental determinist: non-human things have what she calls 'affordances' and 'causal reach' rather than intentions, and historians should trace 'tangles' of causation instead of picking a single prime mover. I want to interview her in a way that actually tests the view, not just lets her repeat that non-humans can be actors.

  Can you draft 10-12 questions? I want at least one each on: the difference between being a cause and being an actor, and whether her view collapses that distinction; the objection that agency without intention is just a metaphor and that metaphors don't belong in causal explanation; the charge that even a sophisticated non-human agency story slides back into environmental determinism when it explains big political outcomes; the ethical/political worry that calling a volcano or a germ an actor lets human decision-makers off the hook; the counterfactual test -- what would have to be different for us to say the volcano was not an actor but merely a condition; and the historiographical payoff, i.e. what changes in how we write history if we accept her view. For each of those, add a follow-up that's keyed to the answer she's most likely to give, so I'm not stuck if she gives the standard reply. And end with one question that forces her to say what evidence or argument would make her give up the whole 'non-human actor' framing. The audience is smart general listeners, so if a question leans on a technical distinction, please make the question itself carry the explanation. Please dont give me generic 'what got you interested' stuff; I want the questions to turn on the actual mechanics of her position, and I'd rather they be a bit too sharp than too polite. I'm not looking for reading lists or citations, just the questions and follow-ups.
