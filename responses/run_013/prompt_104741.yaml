answer: |-
  Here are 12 incisive questions with embedded follow-ups, designed to rigorously test the core claims and mechanics of her "non-human actor" framework:

  1.  **Core Distinction:** You argue microbes or volcanoes are "actors," not just background causes. What's the crucial difference? If a volcano *causes* crop failures that *cause* riots, doesn't calling it an "actor" just stretch the word "cause" without adding new explanatory power?
      *   *Likely Reply/Follow-Up:* (If she emphasizes relationality, entanglement, or effect on human choices): Okay, so the difference is the *kind* of interaction? But doesn't any significant cause *force* humans to react? How does calling it an "actor" reveal something that calling it a "powerful, complex cause" doesn't?

  2.  **Agency & Metaphor:** Critics say agency requires intention. When you call a germ or a climate pattern an "actor" without intentions, isn't that just a vivid metaphor? And shouldn't causal explanations avoid metaphors that might mislead us into seeing purpose where there is none?
      *   *Likely Reply/Follow-Up:* (If she argues "agency" can be non-intentional, like in Actor-Network Theory, or emphasizes effect): Granting that things have effects without intent, why is the *term* "actor" or "agency" essential here? Isn't "powerful non-intentional force" more accurate and less metaphorically risky than "actor"?

  3.  **Determinism Slippery Slope:** You reject environmental determinism, but when you argue a volcanic eruption *participated* in reshaping 19th-century politics, how do you prevent that very participation from becoming the dominant, deterministic explanation? Doesn't emphasizing non-human "actors" inherently risk downplaying human contingency and choice?
      *   *Likely Reply/Follow-Up:* (If she insists on tangles/mutual constitution): How, *in practice*, when writing about a specific event like post-Tambora riots, do you ensure the volcano's "participation" doesn't *functionally* overwhelm the complex human decisions about resource distribution, policing, or blame in your narrative?

  4.  **Accountability & Politics:** If we say cholera was an "actor" remaking cities, doesn't that risk letting human decision-makers – like city planners who ignored sanitation, or governments withholding resources – off the hook by sharing or diluting agency with a mindless germ? What's the ethical impact of this framing?
      *   *Likely Reply/Follow-Up:* (If she says it makes human choices *more* visible by showing the context): But doesn't framing the germ as *co-actor* inherently shift the locus of responsibility? Doesn't "X and Y acted" sound like shared blame, even unintentionally, compared to "Humans failed to act effectively *in the face of* X"?

  5.  **Counterfactual Test:** What would a historical event look like where a non-human entity (like a volcano) was *merely* a passive condition or backdrop, *not* an actor? What specific element would be missing that makes Tambora, in your view, an actor?
      *   *Likely Reply/Follow-Up:* (If she cites scale, unpredictability, or cascading effects): So, is the threshold for "actor" status simply the *scale and unpredictability* of the disruption? Does that mean a very large, disruptive event automatically becomes an "actor," collapsing the distinction back to just being a *big* cause?

  6.  **Historiographical Payoff:** If historians fully embrace your framework, what's one concrete way their *narrative structure* or *source analysis* would change compared to standard histories? What specific thing would they do differently when writing about, say, the Industrial Revolution?
      *   *Likely Reply/Follow-Up:* (If she says they'd trace networks or material flows more): But historians *already* study coal, steam, and disease in industrialization. How does labeling coal an "actor" *change* that analysis beyond just saying "coal availability was a crucial factor"?

  7.  **"Affordances" in Action:** You use "affordances" – what a thing enables or constrains. How does saying "cholera *afforded* rapid urban death and panic" give us better insight than saying "cholera's biological characteristics *caused* rapid urban death and panic"?
      *   *Likely Reply/Follow-Up:* (If she emphasizes relational potential): Isn't "affordance" just describing the *potential* causal properties of the thing-in-context? Does treating it as a distinct concept *do* explanatory work that listing the causes and conditions doesn't?

  8.  **Causal Reach vs. Prime Mover:** You advocate tracing "tangles" of causation instead of prime movers. Isn't this just good, complex historical practice anyway? How does inserting non-human "actors" fundamentally alter this process rather than just adding more threads to the tangle?
      *   *Likely Reply/Follow-Up:* (If she argues it flattens hierarchy/avoids anthropocentrism): But does giving microbes or volcanoes the *same* ontological status as human actors ("actors" in the tangle) actually obscure the unique role of human cognition, intention, and social structures in history?

  9.  **Scale of Agency:** Is *everything* with causal impact an actor? Is the pebble that trips a king, leading to a war, also a "historical actor"? If not, how do you draw the line between a mere causal thing and an "actor" without it being arbitrary?
      *   *Likely Reply/Follow-Up:* (If she uses criteria like transformative impact or network centrality): Doesn't relying on impact/centrality make "actor" status entirely *retrospective*? A pebble *could* trip a king – it only becomes an "actor" if the king falls and it matters? How is that different than just identifying a significant cause?

  10. **The Human Exception?:** Does your framework leave *any* space for uniquely human forms of agency – intention, reflexivity, moral reasoning – or does it render them just one type of "effect" within a larger network of actors (human and non-human)?
      *   *Likely Reply/Follow-Up:* (If she downplays uniqueness or embeds it in networks): Doesn't this risk a different kind of reductionism, where conscious human deliberation becomes indistinguishable in kind (though maybe not complexity) from the "causal reach" of a virus?

  11. **Falsifiability:** What kind of historical evidence or argument would convince you that the "non-human actor" framework *doesn't* work? What would demonstrate that it's genuinely misleading or adds no value compared to traditional causal analysis?
      *   *Likely Reply/Follow-Up:* (If she says evidence showing humans acted entirely independently of non-human forces): But is that even possible? Humans always act *in an environment*. If the framework can absorb any level of non-human influence as "participation," isn't it effectively unfalsifiable?

  12. **The Payoff Revisited:** Let's get concrete. Suppose two historians write about the 1832 Paris cholera epidemic. One uses your actor framework, one doesn't. What specific, non-trivial claim or insight would appear *only* in the first historian's account?
      *   *Likely Reply/Follow-Up:* (If she cites emphasis on microbial action shaping responses): Couldn't the traditional historian simply say "the *nature* of the disease profoundly shaped the medical and political response"? What does "the disease acted" add that "the disease's characteristics caused" misses?

  **Key features of these questions:**
  *   **Embedded Explanation:** Terms like "affordances," "causal reach," "tangles," and critiques like "metaphor" or "determinism" are explained within the question itself for clarity.
  *   **Precision & Edge:** They directly challenge the mechanics (distinctions, definitions, implications) rather than the premise. They anticipate common rebuttals.
  *   **Follow-Up Logic:** Each follow-up presses on potential weaknesses in the *most likely* defense, forcing deeper justification and preventing easy answers.
  *   **Concreteness:** They demand specific examples (Tambora, cholera, Industrial Rev., pebble, Paris 1832) to ground abstract claims.
  *   **Critical Angles Covered:** Cause/Actor, Metaphor, Determinism Slippery Slope, Accountability, Counterfactual, Payoff, Affordances, Prime Mover, Scale, Human Exception, and Falsifiability.
  *   **No Softballs:** Focuses entirely on testing the argument's rigor and utility.

  These questions should push your guest to articulate and defend the *operational value* of her framework beyond the initial compelling metaphor, making for a much more engaging and substantive interview. Good luck!
