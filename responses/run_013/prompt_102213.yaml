prompt: |-
  Ok so I'm not an academic, I just read too much political stuff online and this one problem keeps bugging me. Everyone says democracy is rule by the people, but you have to know who "the people" are before you can ask them anything, and deciding who belongs seems like exactly the kind of thing the people should get to decide. Chicken and egg. I want to make a flowchart poster for my wall that sorts where someone actually lands on this — so act like a political philosopher and walk me from the starting commitment to named positions.

  Please don't just list famous names. Build the tree from the logical space first: the branch points should be questions a normal person can answer without already knowing the labels — like, does having a say come from being affected by a decision, or from being bound by it, or from living somewhere, or from something you don't choose at all? Then put the actual positions at the leaves, and when a combination is empty say so and guess why (incoherent, just unattractive, or nobody's bothered?). Route these cases through it so I can watch where they fall: a long-term resident who's fully subject to the laws but can't vote; someone abroad whose crops get wrecked by this country's emissions; people who aren't born yet; and a random lottery-picked mini-public that gets to make binding rules for everyone else. Think it through carefully first and sketch the branch questions before the tree, flag any two leaves you can't really seperate, and keep it to something that fits on one poster — six to eight branch points max.
reasoning: |-
  Okay, the user has a really interesting puzzle about democracy and defining "the people." They've noticed a fundamental chicken-and-egg problem: you need to know who "the people" are before they can rule, but deciding that membership seems like something the people themselves should decide. 

  First, I need to unpack their core frustration. They're not an academic but clearly a deep thinker who engages with political content online. Their mention of "reading too much political stuff" suggests they've encountered surface-level debates but crave systematic clarity. The flowchart request reveals they want a visual tool to organize this conceptually messy topic.

  The key challenge is designing branch points that:
  - Are intuitive for non-experts (no jargon)
  - Cover all major philosophical positions
  - Lead logically to real-world examples
  - Stay visually manageable (6-8 branches max)

  Hmm... the foundational split should be about the source of democratic legitimacy. The big divides seem to be:
  1. Is membership voluntary or unchosen? (Consent vs. As-Is theories)
  2. What creates the right to participate - being affected, being bound, or birthright?
  3. For future generations - do they count as "the people" now?

  I'm noticing tension between principles that sound good in isolation but clash in practice. Like "all affected should have a say" would include foreigners impacted by climate policies - but that quickly becomes impractical. And birthright citizenship seems arbitrary but provides clear boundaries.

  For the examples:
  - The non-voting resident exposes the gap between subjecthood and participation
  - The climate-affected farmer tests the "affected interests" principle to breaking point
  - Future generations force us to confront time limits in democratic theory
  - The lottery mini-public challenges whether "the people" must be everyone

  The trickiest part will be showing where positions like cosmopolitanism (everyone affected gets a vote) collapse under their own weight when applied to real policy decisions. And explaining why no pure theory survives contact with reality - hence most democracies use messy hybrids.

  Should flag where boundaries get fuzzy too. Like between civic republicanism (membership by participation) and nationalism - they overlap when "shared identity" means civic participation rather than ethnicity. 

  This needs to balance philosophical rigor with the user's request for practical clarity. The examples will anchor it - especially showing how the non-voting resident falls through the cracks of most theories. That case alone reveals why democracies struggle with immigrant voting rights.
answer: |-
  Here's a logical flowchart to map the "Who are 'the People'?" problem, designed as a 6-branch tree with annotated examples. Key branch points focus on foundational principles, not labels.

  **Core Branching Questions:**
  1.  **Does membership require consent?** (Voluntary vs. As-Is)
  2.  **Is the core unit the individual or the group?** (Individualist vs. Collective)
  3.  **What primarily grounds the right to participate?** (Affected Interests, Subject to Rules, or Shared Identity/Fate)
  4.  **Is "the People" bounded or universal?** (Bounded Community vs. Unbounded Humanity)
  5.  **Does membership extend to future generations?** (Presentism vs. Intergenerational)
  6.  **Can "the People" delegate rule-making?** (Direct vs. Representative Principle)

  ---

  **The "Who Are The People?" Flowchart**

  ```
  START: What defines belonging to "The People"?
  |
  ├── [Branch 1: Membership Requires Consent?]
  │   ├── YES (Voluntarist) ───> Go to Branch 2
  │   └── NO (As-Is Theories) ──> Go to Branch 3
  |
  ├── [Branch 2: Core Unit?] (From YES to Branch 1)
  │   ├── INDIVIDUAL (Contractualism) ───┐
  │   └── GROUP (Associational) ────────┴──> Go to Branch 3
  |
  ├── [Branch 3: Grounds for Participation?] (From NO to Branch 1 OR from Branch 2)
  │   ├── AFFECTED INTERESTS ────────────> Go to Branch 4
  │   ├── SUBJECT TO RULES ──────────────> Go to Branch 5
  │   └── SHARED IDENTITY/FATE ──────────> Go to Branch 6
  |
  ├── [Branch 4: Bounded or Universal?] (From AFFECTED INTERESTS)
  │   ├── BOUNDED (Pragmatic Affectedness) ───> Position: **Deliberative Democracy (e.g., Habermas)**  
  │   │   [*People = Those significantly/continuously affected by collective decisions within a practical scope*]
  │   └── UNIVERSAL (Strict Affectedness) ───> Position: **Cosmopolitan Democracy (e.g., Held)**  
  │       [*People = All humans affected, in principle*] **BUT often seen as incoherent/impossible** (Why? Requires global institutions & dilutes local self-rule beyond recognition)
  |
  ├── [Branch 5: Intergenerational?] (From SUBJECT TO RULES)
  │   ├── NO (Presentist) ───────────────> Position: **Civic Republicanism (e.g., Pettit)**  
  │   │   [*People = Current citizens subject to the laws*]
  │   └── YES (Future-Inclusive) ────────> Position: **Ecological/Stewardship Democracy**  
  │       [*People = Current citizens + Future Generations*] **BUT implementation unclear** (How do futures vote?)
  |
  ├── [Branch 6: Direct or Representative?] (From SHARED IDENTITY/FATE)
  │   ├── DIRECT (Pure Popular Sovereignty) ───> Position: **Radical Democracy (e.g., Mouffe)**  
  │   │   [*People = The demos asserting its will directly*] **Problematic for large states**
  │   └── REPRESENTATIVE ────────────────┐
  │       [*People = The body choosing representatives*] ──> Position: **Liberal/Representative Democracy (e.g., Schumpeter)**  
  │       [*People = Citizens (often defined by birth/residence)*] 
  │
  └── [Branch 7: Delegation Legitimacy?] (Implicit after REP Branch 6)
      ├── YES (Legitimate Mini-Public) ───> **Sortition Advocates (e.g., Athenian Model/Ostrom)**  
      │   [*Mini-public IS "the People" for that decision if randomly selected*]
      └── NO (Only Elected Reps) ────────> **Standard Electoralism**  
          [*Mini-public is advisory, not sovereign*]
  ```

  ---

  **Where the Examples Land:**

  1.  **Long-term resident (subject to laws, no vote):**
      *   Branch 1 (Consent?): *NO* (Didn't consent to exclusion) → Branch 3
      *   Branch 3 (Grounds): *SUBJECT TO RULES* (Clearly bound) → Branch 5
      *   Branch 5 (Future?): *NO* → **Civic Republicanism**: **Problem!** Exposed as inconsistent. This position struggles to justify exclusion if subjection is key.
      *   *Also Lands In*: **Pragmatic Affectedness (Deliberative Dem)**: Often included if residency is significant. **Cosmopolitanism**: Included as affected. **Associationalism/Nationalism**: Excluded if not seen as part of the group.

  2.  **Person Abroad (crops wrecked by emissions):**
      *   Branch 1 (Consent?): *NO* → Branch 3
      *   Branch 3 (Grounds): *AFFECTED INTERESTS* (Clearly affected) → Branch 4
      *   Branch 4 (Scope): *UNIVERSAL* → **Cosmopolitan Democracy**: **Theoretical Answer**. *BOUNDED* → **Deliberative Democracy**: **Practical Exclusion** (Seen as "external").
      *   *Rejected By*: **Civic Republicanism** (Not subject to *their* laws), **Nationalism/Associationalism** (Not part of *their* group).

  3.  **People Not Born Yet:**
      *   Branch 1 (Consent?): *NO* (Can't consent) → Branch 3
      *   Branch 3 (Grounds): Hard! *AFFECTED INTERESTS* (Massively) → Branch 4 → *UNIVERSAL/BOUNDED* → Included in principle by **Cosmopolitanism/Deliberative Dem**, but voting impossible. *SHARED FATE* → Branch 6 → Included by **Ecological Democracy**.
      *   *Specifically Lands In*: **Ecological/Stewardship Democracy** (Branch 5 YES).
      *   *Excluded By*: **Presentist Civic Republicanism** (Branch 5 NO), **Standard Representative Democracy** (No mechanism).

  4.  **Random Lottery Mini-Public (makes binding rules):**
      *   Branch 6 (Core Identity/Fate): *REPRESENTATIVE* → Branch 7
      *   Branch 7 (Delegation): *YES* → **Sortition Advocates**: **Legitimate** (Seen as embodying "the People").
      *   Branch 7 (Delegation): *NO* → **Standard Electoralism**: **Illegitimate** (Only elected reps count).
      *   *Rejected By*: **Radical Democracy** (Branch 6 DIRECT - only the *whole* demos is sovereign).

  ---

  **Key Insights & Fuzzy Boundaries:**

  *   **The Civic Republicanism Problem:** Its core principle (subject to rules → membership) clashes with common exclusions (resident non-citizens). This exposes a tension often resolved by adding other criteria (e.g., formal citizenship, identity).
  *   **Cosmopolitanism's Practical Void:** While logically appealing ("all affected"), it struggles to define workable institutions, making it largely aspirational.
  *   **Shared Identity/Fate is Fuzzy:** Distinguishing Civic (participation-focused) from Ethnic nationalism is crucial but often blurry in practice. Branch 3's "Shared Identity/Fate" leads to both **Liberal Nationalism (e.g., Miller)** (civic focus) and **Ethnic Nationalism** (exclusionary).
  *   **The Delegation Dilemma (Branch 7):** This is a major modern debate: *Can* "the People" legitimately outsource sovereign decisions to a randomly selected microcosm? Sortition says yes; traditional electoralism says no.
  *   **Most Real Democracies are Hybrids:** They mix criteria (e.g., birth/residence + subjection + pragmatic affectedness).

  This tree shows why defining "the People" is inherently contested: different foundational values (consent, affectedness, subjection, identity) lead to radically different conclusions, and pure principles often clash with practicality. Your poster will highlight these tensions visually!
