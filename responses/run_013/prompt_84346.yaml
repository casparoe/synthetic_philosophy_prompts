prompt: |-
  I chair the clinical ethics committee at a mid-sized hospital. We take two or three consults a week — a family pressing for treatment the team calls futile, a patient with capacity refusing something that would plainly help, a surrogate who won't decide — and each one ends in a short written recommendation. Our quality committee reviews those recommendations quarterly and counts two consults reaching different conclusions on similar-looking cases as a defect, so we are under pressure to write down rules.

  I have come round to particularism: reasons don't carry fixed weights, a feature that favours an action here can tell against it there, and no finite set of principles generates the right answer to a case. But I can't hand my colleagues a treatise, and I can't tell the quality committee we have no method.

  Write me a procedure the committee can actually run, in about thirty minutes, using people with no philosophy training: the questions to ask in order, what counts as a sufficient answer to each, where it stops and returns a recommendation, and where it stops and hands the decision to a person. It must not smuggle a principle in and then call it a procedure — if all this view can give me is a discipline for noticing what is salient in a case and arguing about it, say so and give me that instead. It also has to give me something to tell the quality committee about why similar cases may legitimately come out differently.

  Then run it on two consults: an eighty-four-year-old with advanced dementia and severe pneumonia, whose son demands ICU transfer and intubation while the team expects she will not survive it; and a thirty-year-old in a persistent vegetative state after an overdose, whose family asks that ventilation continue six more weeks so a brother can travel from abroad, which the team resists partly because the bed is needed. One of those, I suspect, will come out somewhere I don't like. Finish by telling me where the procedure will misfire, and whether I am asking for something the view cannot coherently deliver — if so, say that plainly rather than handing me a procedure-shaped consolation prize.
reasoning: |-
  Okay, let me tackle this complex ethics committee challenge. The user chairs a clinical ethics committee facing pressure to standardize recommendations while embracing particularism - the view that ethical decisions depend on contextual details rather than fixed rules. They need a practical 30-minute procedure usable by non-philosophers that doesn't covertly impose principles, plus demonstration on two cases and honest assessment of limitations.

  Hmm, the core tension here is between institutional demand for consistency and particularism's rejection of cookie-cutter solutions. The quality committee's "similar cases must align" expectation fundamentally contradicts ethical particularism. I need to design a process that honors context without pretending to be algorithmic. 

  First, I'll structure a four-phase procedure: 
  1) Situation Mapping (10 mins) - jointly listing concrete facts without interpretation 
  2) Stakeholder Perspectives (10 mins) - capturing all viewpoints neutrally 
  3) Deliberation (8 mins) - discussing what features matter most here/why 
  4) Resolution Path (2 mins) - deciding recommendation or passing to individual judgment

  For the dementia/pneumonia case: The procedure would likely reject ICU transfer after noting the patient's inability to benefit from aggressive intervention versus the son's distress. But for the PVS case with the traveling brother, it might surprisingly approve the 6-week extension - not because of bed shortages but because the symbolic meaning for the family could outweigh minimal burdens. 

  Important limitations to highlight: This won't satisfy the quality committee's craving for uniformity, and can't eliminate subjectivity in noticing salient features. The output isn't "consistent decisions" but "rigorous context-sensitivity" - which is actually the point of particularism. I should be blunt that any procedure promising mechanical consistency would betray this philosophical stance.

  The demonstration cases will reveal uncomfortable outcomes precisely to show particularism in action: sometimes family needs outweigh resource concerns, sometimes they don't. The real test is whether the committee can tolerate that complexity.
answer: |-
  Here's a procedure grounded in ethical particularism, designed for clinical ethics committees without philosophical training, focused on disciplined contextual analysis rather than rule-application. It rejects the premise that "similar-looking cases" must have identical outcomes.

  **The "Salience & Deliberation" Procedure (30-Minute Framework):**

  **Phase 1: Situation Mapping (10 mins)**  
  *Questions to Ask (sequentially):*  
  1. "What are the *undisputed medical facts*? (Diagnosis, prognosis, treatment options, risks/benefits)"  
  2. "Who are the key stakeholders (patient, family, team, others)? What specific *hopes, fears, or values* has each explicitly expressed?"  
  3. "What is the *specific, immediate conflict* triggering this consult? (e.g., 'Son demands intubation, team believes it causes harm')"  

  *Sufficient Answer:* A shared, factual whiteboard/list capturing ONLY concrete statements/observations (no interpretation).

  **Phase 2: Stakeholder Perspectives & Context (10 mins)**  
  *Questions to Ask:*  
  4. "For each stakeholder's position, *what underlying values or goals* seem most important to them? (e.g., 'Son values fighting for life,' 'Team values preventing suffering')"  
  5. "What *unique contextual features* might shape these values or the options? (e.g., cultural/religious beliefs, prior patient statements, family dynamics, institutional pressures, resource constraints)"  
  6. "Are there *unmet needs* (emotional, informational, practical) contributing to the conflict?"  

  *Sufficient Answer:* A list of *plausible* values/contexts for each stakeholder, explicitly linked to their expressed statements or observed behaviors. Avoid assumptions; use "seems," "expresses," "suggests."

  **Phase 3: Deliberation on Salience (8 mins)**  
  *Questions to Ask:*  
  7. "Looking at the values and context, which features feel *most ethically significant* or *weighty* in *this specific situation*? Why?"  
  8. "What are the *potential consequences* (physical, emotional, relational, symbolic) of each proposed course of action, *given this specific context*?"  
  9. "Is there *any relevant precedent* (institutional, legal, ethical)? Does it *fit* or *clash* with what feels salient here?"  

  *Sufficient Answer:* Identification of 2-4 key salient features driving the perceived ethical tension *in this case*, with brief rationale. Consensus on *whether precedent feels applicable or irrelevant* here.

  **Phase 4: Resolution Path (2 mins)**  
  *Decision Points:*  
  -   **Recommendation:** If a clear path emerges where the salient features strongly converge on one action as minimizing harm/upholding key values *in this context*, AND the committee agrees (>80%), formulate a brief recommendation: "Based on the significant weight of [Salient Feature X] and [Salient Feature Y] in this context, the committee recommends..."
  -   **Handoff to Person:** If significant disagreement persists, salient features feel irreconcilably balanced, or context is too unique/novel, state: "The salient features [list them] create an irreconcilable conflict/novel situation requiring individual judgment. We recommend [Specific Clinician/Administrator] make the final decision, considering [Key Salient Features 1, 2]."

  **Addressing the Quality Committee:**  
  "**Our procedure ensures rigorous analysis of *contextual salience*, not rule application.** 'Similar-looking' cases often differ in ethically crucial ways: a family's trauma history, a patient's previously expressed values, unique cultural meanings, or institutional resource strain *at that moment*. **Differences in recommendations reflect legitimate differences in the ethically salient features of each unique situation.** We track *process fidelity* (did we map facts, perspectives, context, and salience rigorously?) and *resolution clarity* (did we identify why *this* decision fits *this* context?), not uniformity of outcomes."

  ---

  **Running the Procedure on the Consults:**

  **Case 1: 84yo with Advanced Dementia & Severe Pneumonia (Son demands ICU/Intubation)**  
  *   **Phase 1:** Facts: High mortality risk with intubation, high suffering potential, no advance directive. Stakeholders: Son (demands "everything"), Team (futile/harmful). Conflict: Demand vs. Refusal.  
  *   **Phase 2:** Son's Values: "Fighting for mom," potential guilt, fear of letting go. Team's Values: Avoid non-beneficial suffering, stewardship. Context: Advanced dementia (inability to interact/experience benefit), high procedural burden. Unmet Need: Son's grief support, clarity on goals.  
  *   **Phase 3:** **Salience:** **1. Inability to Experience Potential Benefit:** The profound dementia means survival likely offers no meaningful recovery or relational interaction, only prolonged dying. **2. High Burden/Harm:** Intubation/ICU pose significant suffering (delirium, restraints, lines) with minimal chance of meaningful recovery. **3. Son's Distress:** Significant, but treatment cannot resolve its source (impending loss). Precedent (futility policies) *fits* here due to salience of #1 & #2.  
  *   **Phase 4: RECOMMENDATION.** "Based on the overwhelming salience of the patient's inability to experience benefit from aggressive intervention and the high likelihood of significant burdens and suffering outweighing any potential benefit in this context, the committee supports the team's recommendation to not transfer to ICU or intubate. Focus should shift to comfort care and intensive support for the son's grief."

  **Case 2: 30yo in PVS post-Overdose (Family requests 6-week vent continuation for brother's arrival)**  
  *   **Phase 1:** Facts: PVS (no awareness, permanent), stable on vent. Prognosis: No recovery expected. Stakeholders: Family (requests time), Team (resists - resource/bed need cited). Conflict: Time request vs. Resource concern.  
  *   **Phase 2:** Family's Values: Family unity, closure, cultural/religious significance of presence, hope for "miracle." Team's Values: Resource stewardship, potentially "futility." Context: Brother traveling internationally, specific timeframe (6 wks), PVS means no suffering from continuation. Unmet Need: Family's need for closure together.  
  *   **Phase 3:** **Salience:** **1. Minimal Burden to Patient:** Ventilation in PVS causes no suffering; burden is resource-based. **2. Profound Significance to Family:** Closure with all siblings present holds deep relational and potentially cultural meaning. **3. Resource Constraint:** Real, but needs quantification (Is the bed crisis *immediate and absolute*? Are alternatives possible?). **4. Futility Concept:** Less salient here – survival itself isn't the disputed benefit; the *symbolic act for the family* is the perceived benefit. Precedent (withdrawing "futile" care) *clashes* due to salience of #2 & #1.  
  *   **Phase 4: RECOMMENDATION (Likely).** "Given the profound significance to the family of allowing the brother to arrive for closure, coupled with the lack of burden or suffering imposed on the patient by a defined, short-term continuation (6 weeks), the committee recommends supporting the family's request *provided*: (1) The team confirms no immediately life-threatening bed shortage exists that cannot be mitigated, and (2) A clear plan for compassionate withdrawal is established at the 6-week mark. The focus shifts to supporting the family's needs during this period."  
      *(You suspected discomfort here - it prioritizes family relational needs over resource stewardship in this specific context where patient harm is absent).*

  ---

  **Where the Procedure Will Misfire & Its Limits:**

  1.  **The "Salience" Judgment:** Identifying what features are *most salient* is inherently interpretive and subjective. A committee member's values/biases will influence what they see as "heavy." The procedure exposes this but doesn't eliminate it. Vigilant facilitation is key.
  2.  **Resource Constraints:** Case 2 exposes this. The procedure struggles *if* the resource constraint is truly overwhelming and immediate ("this bed *must* be used for a salvageable patient *right now*"). The procedure might still prioritize family needs, potentially feeling unjustifiable to the team/QC. **This is where the tension between particularism and systemic pressures is most acute.**
  3.  **Truly Novel Dilemmas:** It relies on analogical thinking ("does precedent fit/clash?"). For radical novelties, the "handoff to person" might be frequent.
  4.  **Intractable Conflicts:** When core values (e.g., deeply held religious belief vs. medical harm) are diametrically opposed and equally salient, deliberation may stall, forcing handoff.
  5.  **Quality Committee Expectations:** **This procedure fundamentally cannot deliver what the QC seemingly wants: guaranteed consistency in outcomes for "similar-looking" cases.** It delivers *process consistency* and *contextual justification*. Telling the QC that outcome differences are *legitimate* based on context requires courage and a shift in their metrics. The procedure provides the *language* for that justification (salience), but the QC must accept the *philosophy*.

  **Are You Asking for Something Particularism Cannot Coherently Deliver?**

  **Yes, in one crucial aspect.** Particularism **cannot** deliver a procedure that guarantees the **outcome consistency** desired by the Quality Committee when they define "similar" superficially. It rejects the very idea that fixed principles/rules applied to case features *should* yield identical outcomes. Its core tenet is that context changes the ethical weight of features.

  **What it CAN deliver is:**  
  *   A **disciplined, transparent process** for mapping context and arguing about salience.  
  *   A **justification framework** explaining why different contexts *should* lead to different outcomes.  
  *   A **defensible alternative** to rule-based approaches that often mask value judgments or force inappropriate consistency.  
  *   **Honesty** about the irreducible role of judgment in ethics.

  **This isn't a consolation prize; it's the authentic procedural expression of particularism.** Your challenge is not designing the procedure, but championing the philosophical shift it represents to the Quality Committee. The procedure gives you the *tool*; you must win the argument that their metric ("different outcome = defect") is itself ethically flawed. Use the language of **salience** and **contextual justification** relentlessly. The misfires aren't failures of the procedure, but inevitable tensions in clinical ethics that rules merely obscure, not resolve.
