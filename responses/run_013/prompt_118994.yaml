prompt: |-
  Okay, I'm trying to get my head around something about money. Banks make loans by crediting accounts with new money—they don't lend out existing deposits. The borrower pays back the principal plus interest, so the bank treats money as something that can be rented out and that generates a return. What philosophical commitments does that practice presuppose about the nature of money? Does it assume money is a commodity with productive power, or just a social convention that can be created and destroyed by accounting? And how does that relate to Aristotles view that money is barren—that it's a measure and medium of exchange, not something that naturally breeds? He thought usury was unnatural because it makes money beget money, right? So is modern banking just rejecting that, or can you read Aristotle as allowing interest under some conditions? I guess I want you to reconstruct the implicit theory of money and exchange that interest-bearing bank lending presupposes, separate what the practice strictly needs from what it merely fits with, and say whether that theory is consistent with Aristotles distinction between household management and acquisition. Also, if we took Aristotle seriously, what would have to change—would we have to ban interest, or is there a way to have credit without treating money as productive? And where is the practice philosophically underdetermined, so that different theories of money could license it?
