  On underdetermination: Both commodity theories (money as thing-value) and credit theories (money as promise) can justify interest, albeit differently. The user might appreciate that duality—it shows banking adapts to multiple philosophies while retaining its core mechanics. 

  If we applied Aristotle strictly, banning interest outright seems impractical today. But Islamic finance models (profit-sharing instead of interest) offer alternatives. The user might want concrete examples here. 

