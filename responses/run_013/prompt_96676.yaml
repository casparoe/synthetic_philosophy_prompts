prompt: |-
  I recently took over the rule by which our unit decides what to fund and what to work on: a fixed pot of money, a limited pool of reviewer hours, and more proposals worth doing than either can absorb. I had assumed that the right description of what we do is satisficing — we set a bar, fund whatever clears it, and adjust the bar when too much or too little clears it — and I said as much to a colleague who works on decision theory. He pushed back hard. On his view, satisficing is not a genuine alternative to optimizing at all: once you write the costs of searching, deliberating, and reviewing into the objective, a threshold rule simply is the optimal policy for agents in our position, and describing it as satisficing adds nothing. I would like a careful comparison rather than a verdict by slogan, because I will have to defend our procedure to people who ask exactly this question.

  Compare Herbert Simon's satisficing with the resource-rational (or computational-rationality) program, which treats a bounded agent's policy as the solution to a meta-level optimization problem whose objective includes the cost of the computation itself. Set out precisely what each claims — on one side the search process, the acceptability threshold or aspiration level, and its adaptation to what has already been found; on the other, the object-level/meta-level split and something like the expected value of computation — and then work through the following.

  First, is the subsumption claim true? Is satisficing simply what optimality looks like once search and deliberation are costly, or does something in it resist being written into a single objective? Second, if an aspiration level is fixed by an agent's history, its identity, and its comparisons with others rather than derived from an objective, does satisficing become a different kind of theory rather than a special case? Third, does the meta-level optimization regress — optimizing how much to optimize, and then how much to optimize that — tell against the resource-rational program, or is it a harmless feature of it? Fourth, what kind of theory is each: a description of how agents actually choose, an explanation of why their choices look as they do, or a normative standard for how they should choose? And finally, what would each say about a case like mine, in which a threshold is chosen deliberately, revised in the light of what turns up, and constrained mainly by the scarcity of review attention?

  End with a judgment: which framework should I use to describe and defend our selection rule, and what does the other one capture that I would lose by abandoning it.
reasoning: |-
  Okay, let me start by understanding the user's situation. They manage a funding unit with limited resources—money and reviewer hours—and more proposals than they can handle. They thought satisficing was the right model, but their colleague, who works in decision theory, argued that it's actually optimal under constraints. The user needs a detailed comparison to defend their process.

  First, I need to break down both concepts: Simon's satisficing and resource-rationality. Simon's idea is about setting an aspiration level and accepting the first option that meets it. The aspiration level adjusts based on experience and social comparisons. On the other hand, resource-rationality frames decisions as optimizing a meta-objective that includes computation costs. So the key difference is whether the threshold is derived from an internal state (satisficing) or from an explicit cost-benefit analysis (resource-rationality).

  The user's main questions are about subsumption, aspiration levels, the regress problem, the nature of each theory, and their application. Let me tackle each one. 

  For subsumption: Can satisficing be reduced to optimization with costs? Some argue yes, but Simon's emphasis on adaptive, identity-based thresholds adds nuance. If the aspiration level is tied to the agent's history and identity, it might not fit neatly into a single objective function.

  Next, the aspiration level's source. If it's fixed by history or social comparison rather than calculated, that makes satisficing distinct. This is crucial because in the user's case, the threshold adapts over time based on what's found, which aligns with satisficing's adaptive nature.

  The regress problem in resource-rationality—optimizing the optimization—might seem infinite, but it's handled by heuristics or approximations. Still, it's a practical issue, whereas satisficing avoids it by not requiring such calculations.

  Regarding theory types: Satisficing is descriptive and normative for bounded agents, while resource-rationality is prescriptive, suggesting optimal strategies under constraints. The user needs to justify their process, so understanding both angles is key.

  Applying this to their case: They set a threshold, adjust it based on proposals, and are constrained by reviewer hours. Satisficing fits well here because it explains adaptive thresholds and heuristic decision-making. Resource-rationality would model it as optimizing EVC, but that might be too abstract for their needs.

  The user's deeper need is to defend their process to stakeholders. Using satisficing makes the procedure relatable and pragmatic. Resource-rationality, while mathematically sound, might be harder to communicate. However, acknowledging the optimization perspective shows thoroughness, satisfying critics who prefer formal models.

  In conclusion, recommending satisficing as the primary framework for its practicality, while noting resource-rationality's value in highlighting efficiency under constraints. This balanced approach should address both the procedural justification and theoretical concerns.
answer: |-
  Here's a careful comparison of satisficing and resource-rationality, addressing your specific questions and concluding with a recommendation for defending your funding process:

  ### Core Concepts
  1.  **Herbert Simon's Satisficing:**
      *   **Problem:** Agents face bounded rationality (limited cognitive resources, time, information, computational power).
      *   **Search Process:** Sequential search through alternatives until one meets a criterion.
      *   **Acceptability Threshold (Aspiration Level):** A pre-defined level of acceptability on key attributes (e.g., expected return, feasibility). *Not* necessarily derived from a global utility function or optimization.
      *   **Adaptation:** The aspiration level is dynamic. It adjusts based on:
          *   **Experience:** If search is easy (many acceptable options), the level rises. If hard (few acceptable options), it falls.
          *   **Identity/Social Comparison:** Aspirations are influenced by the agent's self-concept, past achievements, and observations of peers ("I deserve/expect outcomes like X" or "Others like me achieve Y").
      *   **Outcome:** Selection of the *first* alternative encountered that meets or exceeds the current aspiration level. Deliberation/search stops.

  2.  **Resource-Rationality (RR)/Computational Rationality:**
      *   **Problem:** Agents are optimal *given* their cognitive constraints. The *cost of computation itself* (search time, reviewer hours, cognitive effort) is explicitly part of the optimization.
      *   **Meta-Level Optimization:** The agent solves a *meta-decision problem*: choosing a deliberation/decision *policy* (e.g., a threshold rule) that maximizes *expected utility minus the cost of computation*.
      *   **Expected Value of Computation (EVC):** The core RR concept. EVC estimates the net benefit (improvement in decision outcome minus cost) of acquiring more information or performing more computation (e.g., reviewing another proposal, deliberating longer). The optimal policy stops computation when EVC becomes negative.
      *   **Object-Level/Meta-Level Split:** The *object-level* is the original problem (e.g., "Which proposal is best?"). The *meta-level* is the problem of how to solve the object-level problem given computational costs ("How much review effort should we expend?").
      *   **Outcome:** Selection of the decision policy (e.g., threshold rule, specific number of alternatives to consider, specific review depth) that is *optimal* for the meta-problem. This policy is then executed.

  ### Addressing Your Questions

  1.  **Is satisficing subsumed by resource-rational optimization?**
      *   **Partially, but not fully.** RR provides a powerful framework showing that under costly search/deliberation, threshold rules *can be* optimal meta-policies. This validates your colleague's core point: *a* threshold rule *can* be the RR optimal policy.
      *   **Resistance to Subsumption:** The crucial difference lies in the *source* and *nature* of the threshold.
          *   **RR:** The threshold is *derived* from an explicit meta-optimization over a single, encompassing objective (utility - computation cost). It's calculated (in principle) based on the distribution of options, their values, and search/review costs.
          *   **Simon:** The aspiration level is fundamentally *adaptive* and often *non-optimally set*. It arises from psychology, history, social comparison, and satisficing's own adaptive mechanism. It's not necessarily derived from, nor does it necessarily maximize, a single global expected utility function including costs. It might reflect "good enough given who I am and what I see," not "best net value after costs." The *process* of adaptation itself isn't framed as optimizing a meta-objective.
      *   **Verdict:** RR shows satisficing *can* be optimal, but Simon's theory describes a broader, psychologically plausible *mechanism* for *how* thresholds arise and adapt that doesn't require agents to perform the complex RR meta-optimization.

  2.  **Does a historically/socially fixed aspiration level make satisficing distinct?**
      *   **Yes, decisively.** This is the core argument *against* subsumption. If the aspiration level is primarily shaped by identity ("We are a top-tier unit"), history ("Last year's average return was X"), or social comparison ("Competitor Y funds projects like Z") rather than being calculated as the solution to an explicit EVC equation for the *current* decision context, then satisficing describes a fundamentally different *process*.
      *   RR might try to model identity/history as priors or constraints within its meta-optimization, but Simon's point is that humans often *don't* optimize in that way; they use these factors directly to set a "good enough" level. This makes satisficing a distinct *behavioral* theory.

  3.  **Does the meta-optimization regress doom RR?**
      *   **No, it's manageable (but a challenge).** RR proponents acknowledge the regress (optimizing the optimization of the optimization...). Solutions exist:
          *   **Heuristics at Higher Levels:** Using simple, robust rules for the meta-meta decision (e.g., "Use EVC with these standard priors/cost estimates").
          *   **Approximate Solutions:** Finding good-enough meta-policies without infinite recursion.
          *   **Evolution/Learning:** Assuming effective meta-policies are learned over time or evolved, avoiding explicit online recursion.
      *   While a theoretical concern, the regress doesn't invalidate RR as a useful normative framework or computational-level explanation. It highlights the need for approximations, which is consistent with bounded rationality.

  4.  **What kind of theory is each?**
      *   **Simon's Satisficing:**
          *   **Primarily Descriptive/Explanatory:** Aims to describe *how* real, bounded agents *actually* make decisions and explain *why* their choices might look irrational from an unbounded optimization perspective (e.g., why they stop search "too early").
          *   **Secondarily Normative:** Offers a prescriptive approach *for* bounded agents: "Set an aspiration level adaptively and satisfice" is proposed as a good heuristic.
      *   **Resource-Rationality:**
          *   **Primarily Normative/Prescriptive:** Defines what constitutes *optimal* performance *given* cognitive constraints. Tells agents *how they should* allocate their limited computational resources.
          *   **Secondarily Explanatory:** Aims to explain *why* observed cognitive strategies (like satisficing, heuristics) exist – because they are approximately optimal solutions to the meta-problem of computation under constraints. It's a "computational-level" theory (Marr's Level 1).

  5.  **Applying the Frameworks to Your Case:**
      *   **Satisficing View:**
          *   You deliberately set an "aspiration level" (funding threshold).
          *   You fund proposals meeting/exceeding it (satisficing).
          *   You adapt the threshold based on experience (what turns up) – a core Simonian feature.
          *   The scarcity of reviewer hours *causes* the bound and necessitates the adaptive threshold rule. The rule itself embodies "good enough" given your unit's context and identity.
      *   **Resource-Rational View:**
          *   You are implicitly solving a meta-optimization problem: maximizing the expected value of funded projects *minus* the cost of reviewer hours.
          *   The threshold rule is (assumed to be) the optimal policy derived from this meta-problem. The adaptation process is an (approximate) way to keep the threshold aligned with the current EVC of further search/review, given proposal flow and costs.
          *   Reviewer hour scarcity is *explicitly written into the objective* as a cost.

  ### Judgment and Recommendation

  *   **Which Framework to Use for Defense: Satisficing.**
      *   **Why:** It perfectly matches the *process* you describe and its *psychological/practical* justification:
          1.  **Transparency & Relatability:** Stakeholders easily grasp "setting a bar" and "adjusting based on what we see." Explaining EVC meta-optimization is abstract and complex.
          2.  **Emphasis on Adaptation:** Simon's core mechanism (adjusting aspirations based on experience) directly describes your procedure. RR explains *why* adaptation *might* be optimal, but doesn't center it descriptively.
          3.  **Acknowledges Bounds Naturally:** "We have limited reviewer hours, so we need a practical rule that adapts" is an intuitive satisficing argument. RR requires translating this into an optimization-with-costs argument.
          4.  **Identity/Context:** If your threshold reflects institutional norms, past performance, or peer comparisons (beyond pure EVC calculation), satisficing explicitly accommodates this. RR struggles to incorporate these naturally.
          5.  **Avoids Regress Concerns:** You don't need to explain how you meta-optimized the meta-optimization.

  *   **What You Gain by Using RR (and What You Lose by *Only* Using Satisficing):**
      *   **Gain:** RR provides a powerful *normative justification* and a *deeper computational explanation*:
          *   It rigorously shows your threshold rule isn't just "good enough," but potentially *optimal* given reviewer hour costs.
          *   It frames reviewer time scarcity not just as a problem forcing compromise, but as an *integral part* of the rational decision calculus.
          *   It offers tools (like EVC *thinking*) to potentially *improve* your process: e.g., formally estimating if spending more hours reviewing marginal proposals is *worth it* on average, or optimizing reviewer allocation.
      *   **Loss (if abandoning RR entirely):** You lose the strongest *normative defense* against critics demanding "true" optimization. Satisficing can sound like settling; RR demonstrates it's the *correct* form of optimization under constraints. You also lose a framework for potentially refining efficiency.

  ### Final Defense Strategy

  1.  **Lead with Satisficing:** Describe your process clearly: "We set a funding threshold reflecting our goals and constraints, fund proposals meeting it, and adapt the threshold based on the quality and volume of submissions we receive. This is a well-established, practical approach for complex decisions under resource constraints, known as *satisficing*."
  2.  **Acknowledge the RR Insight:** "As my colleague pointed out, this approach is also rational from a deeper perspective. When the costs of search and review are significant – like our limited reviewer hours – a well-calibrated threshold rule is actually the *optimal* strategy. It maximizes the net value of our funded portfolio after accounting for the substantial cost of the review process itself."
  3.  **Emphasize Adaptation:** Highlight how your adaptation mechanism ensures the threshold responds to reality: "Crucially, our threshold isn't static. We actively adjust it based on what we find, ensuring it remains appropriate for the current pool of proposals and our fixed review capacity."
  4.  **Address Identity/Norms (if relevant):** "Our threshold also reflects our unit's standards and mission [mention specifics if appropriate], ensuring funded projects align with our identity and strategic goals."

  This strategy leverages the intuitive, descriptive power of satisficing while incorporating the robust normative foundation provided by resource-rationality, creating a comprehensive and defensible position.
