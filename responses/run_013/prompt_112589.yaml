answer: |-
  ## Research Proposal: Competence Without Comprehension? Disaggregating the Darwin-Turing Analogy in Explanatory Practice

  **1. Title:** The Ontology of Competence: A Workshop Series on Revisiting the Unity of "Strange Inversions" in Biology and Cognitive Science

  **2. Project Summary:** The analogy between Darwin’s explanation of biological design without a designer and Turing’s explanation of computation without a comprehender is a cornerstone of modern intellectual discourse, often presented as a unified "strange inversion" where competence precedes comprehension. This workshop series challenges the presumed unity of this pattern as an open empirical and conceptual question. We propose that the *ontological status* of the competence explained differs fundamentally between the two paradigmatic cases: Darwinian competence (e.g., organismic fitness) is plausibly an intrinsic, system-owned property, while Turingian competence (e.g., a chess engine's play) may be an observer-relative artifact of description. This distinction, if robust, radically alters the interpretation of "inversion," transforming the explanatory project from relocating comprehension to potentially dissolving the demand for it in specific contexts. The series will develop a diagnostic criterion, grounded in comparative case analysis, to determine when a competence-without-comprehension explanation successfully discharges the explanatory demand for "understanding" versus merely postponing it, thereby refining explanatory practice in the cognitive and biological sciences.

  **3. Research Question:** Do the Darwinian and Turingian "strange inversions" belong to a single explanatory kind, or do they fundamentally differ in the ontological status of the competence they invoke? Specifically, is the competence explained (e.g., fitness, arithmetic calculation, immune defense, market efficiency):
      *   (A) A **real, system-owned property** (e.g., genuinely attributable to the organism/market/mechanism itself, independent of specific observer descriptions), or
      *   (B) An **artifact of description** (e.g., existing only relative to a specific interpretive framework imposed by an observer)?
  Furthermore, can we develop a **criterion** to distinguish (A) from (B) in novel cases, thereby clarifying the type of "inversion" at work and the residual explanatory burden?

  **4. Why the Question is Open & Existing Positions Fall Short:** The standard narrative leverages rhetorical symmetry: Darwin eliminates the need for a Designer, Turing eliminates the need for a Mind/Comprehender; thus, both exemplify the same powerful explanatory move. However, this symmetry masks a critical ambiguity concerning "comprehension" and its purported elimination:

  1.  **Comprehension as Explanatory Posit:** Defenders often treat the eliminated "designer" or "comprehender" as a hypothesized *explanatory entity* performing intelligent work (e.g., God's plan, a homunculus). The inversion succeeds by showing how complex outcomes emerge without this entity. This fits Darwin well: the Designer is a proposed *cause* replaced by natural selection. Does it fit Turing? Is "comprehension" genuinely proposed as *the cause* of calculation, or merely as a *description* of its outcome? Eliminating a non-existent cause isn't an explanatory achievement.
  2.  **Comprehension as Folk Psychology:** Alternatively, "comprehension" is dismissed as merely folk-psychological baggage with no real explanatory role. The inversion simply shows competence arising mechanistically. This fits the *process* Turing describes (rule-following). But does it fit the *competence* Darwin explains? The fitness of an organism isn't *just* a description we apply; it has real, measurable consequences *for that organism* (survival, reproduction). Its "goodness" seems intrinsic to the biological context.

  **The Oscillation:** Existing discussions frequently slide between these treatments. When emphasizing the *elimination of the homunculus*, the Turing case seems strong. When emphasizing the *reality of the competence explained*, the Darwin case seems paradigmatic, while the Turing case appears potentially descriptive. Neither reading can be applied uniformly and satisfactorily across both original cases without strain, leaving the unity of the inversion pattern an assumption rather than a demonstrated conclusion. The analogy gains rhetorical force by obscuring this ontological tension.

  **5. Method: Taxonomy through Contrasting Cases:** To isolate the ontological dimension and build a diagnostic criterion, we will conduct a structured comparative analysis of four carefully chosen cases where the tension between (A) and (B) is pronounced and pulls in different directions:

  1.  **Simple Feedback Device (e.g., Thermostat):** Competence: Maintaining temperature within a range. Comprehension: None attributed. *Axis:* Is the "goal" (target temperature) intrinsic to the system (part of its causal structure/evolutionary history) or purely imposed by the designer/user? Does it *malfunction* intrinsically if it fails, or only relative to our desire?
  2.  **Chess Engine (e.g., Stockfish):** Competence: Playing high-level chess. Comprehension: None attributed. *Axis:* Does the engine possess chess-playing competence *in itself*, or only relative to the rules of chess defined by humans and our interpretation of its moves as "playing"? If we changed the rules, does it lose competence, or simply become competent at a different game? Is its "mistake" intrinsic or observer-relative?
  3.  **Biological Competence without Representation (e.g., Immune Response or DNA Polymerase Proofreading):** Competence: Defending against pathogens / accurately replicating DNA. Comprehension: No internal representation of the goal state. *Axis:* Is the normative aspect ("correct" immune response, "error") intrinsic to the biological function within the organism's viability, or imposed by our description? Does it genuinely succeed or fail *for the organism*?
  4.  **Distributed Comprehension System (e.g., Market or Bureaucracy):** Competence: Efficient allocation of resources / implementing complex policies. Comprehension: Genuinely present, but distributed across individual human agents; no single agent comprehends the whole. *Axis:* How does the competence of the *system* relate to the comprehension of its parts? Is the system's competence reducible to the sum of individual comprehensions? Is it emergent? Does it possess competence independently of the comprehension distributed within it?

  **Avoiding Stipulation:** We will avoid defining "comprehension" in a question-begging way (e.g., requiring human-like consciousness). Instead, we will focus on the *explanatory role* the concept is purported to play in the *pre-inversion* picture (e.g., as a causal agent) and the *normativity* inherent in attributing competence (success/failure, correctness/incorrectness). The key is tracing the source of this normativity: is it anchored *within* the system's own state space and viability conditions, or projected *onto* it by an external interpreter?

  **6. Addressing the Alternative: The Collapse Objection.** The most serious challenge is that the distinction between (A) and (B) collapses: *all* competence attributions are fundamentally observer-relative. A thermostat's function is defined by us; an organism's fitness is only "fitness" relative to an environment we delineate; a chess engine's moves are only "chess" relative to our rules.

  **Response:** For this collapse to be correct, it must hold that:
  *   Normativity (success/failure, correct function) is *always and only* imposed by the observer.
  *   There is no relevant difference between the normativity arising from an organism's internal physiology failing (e.g., autoimmune disease destroying tissue) and a chess engine violating a rule we just invented (e.g., "knights must hop backwards on Tuesdays").
  *   The "viability conditions" of a biological system are ontologically equivalent to the arbitrary rules of a formal game.

  **Resisting the Collapse:** We argue that biological systems exhibit *autopoietic normativity* – the standards for success/failure, proper function/malfunction, are generated by the system's own organization and its precarious existence within an environment. The immune system *intrinsically* malfunctions when it attacks self-tissue because this undermines the organism's viability. The DNA polymerase *intrinsically* makes an error when it misincorporates a base, potentially leading to deleterious mutations. This contrasts sharply with the chess engine: its "error" in violating a novel rule isn't an intrinsic failure *of the engine itself*; it simply ceases to be interpretable *by us* as playing *that specific game*. Its core competence (efficient search and evaluation) remains unchanged. The workshop will rigorously test whether this distinction holds water across the cases.

  **7. Outcomes & Success/Failure Criteria:**

  *   **Success:** A **diagnostic criterion** for classifying competence-without-comprehension explanations. A successful criterion would:
      *   **Discharge vs. Postpone:** Clearly indicate when the explanation genuinely discharges the demand for a "comprehender" (by showing competence is system-owned, e.g., Darwin, immune system) versus merely postponing it (by showing competence is description-relative, leaving open *why* that description yields competence, e.g., perhaps the chess engine, thermostat).
      *   **Non-Trivial & Applicable:** Be applicable to novel cases without presupposing contested philosophical commitments (e.g., about consciousness or intrinsic intentionality). It should classify cases based on features of the *explanation* and the *system* being explained, not merely our chosen vocabulary.
      *   **Clarify Residual Burden:** Make explicit the different *types* of explanatory work remaining. For system-owned competence (A), the burden shifts to mechanisms and history. For description-relative competence (B), the burden often shifts to explaining *why* that description yields competence (e.g., the programmer's comprehension, market participant psychology).
  *   **Failure:** The project fails if:
      1.  **Verbal Relativity:** The resulting criterion merely reflects our choice of descriptive framework, offering no objective basis for distinguishing system-owned from description-relative competence ("Failure by Verbalism").
      2.  **Circularity/Stipulation:** The criterion relies on defining "comprehension," "ownership," or "normativity" in ways that presuppose the answer to the core question ("Failure by Stipulation").
      3.  **Intractability:** Applying the criterion inevitably requires first resolving deep, unresolved debates in philosophy of mind (e.g., the hard problem of consciousness, original intentionality) ("Failure by Intractability").
      4.  **Indistinction:** The analysis conclusively demonstrates that the proposed distinction between (A) and (B) collapses for all scientifically relevant purposes, validating the unity of the inversion schema ("Failure by Collapse").

  **8. Scope & Realism:** This is a workshop series, not a monograph. We will:
  1.  Clearly stake out the core distinction and question.
  2.  Work through the four case studies intensively, using them to probe the ontology of competence.
  3.  Develop and refine the diagnostic criterion based on these analyses.
  4.  Explicitly identify the criterion's potential weaknesses and limitations based on the workshop discussions.
  We will *not* attempt a comprehensive historical survey of the Darwin-Turing analogy, engage deeply with all possible variations of AI or biological systems, or resolve the metaphysical status of consciousness or intentionality.

  **9. Why This Framing? Beyond "Can Machines Think?"** The perennial question "Can machines think?" often devolves into semantic debates or intractable philosophical disputes. This project reframes the issue productively for scientific explanation:
  *   **Focus on Explanation:** It shifts focus from the metaphysical status of machine "minds" to the *explanatory practices* we use when confronted with complex, competent systems, biological or artificial.
  *   **Clarifies Scientific Practice:** It seeks a tool for scientists to determine *what kind* of explanation suffices for a given competence. Does appealing to selection history or mechanistic coupling suffice? Or does competence-under-description demand an explanation of the describer's role?
  *   **Precision on "Inversion":** It forces precision on what the celebrated "strange inversion" actually achieves in different domains. Does it eliminate a ghost *or* reveal that the competence itself was partly spectral?
  *   **Bridges Disciplines:** By examining cases across biology (immune system), cognitive science/AI (chess engine), engineering (thermostat), and social science (market), it fosters dialogue on the nature of explanation itself.
  *   **Practical Relevance:** Understanding when competence is system-owned versus description-relative is crucial for evaluating claims in AI (e.g., "understanding" in LLMs), synthetic biology (designing novel functions), and complex systems science.

  This workshop series proposes not to settle the debate over machine understanding definitively, but to provide a sharper conceptual toolkit for navigating it and for assessing competence-without-comprehension explanations across the sciences. By treating the unity of the Darwin-Turing inversion as an open question, we aim to uncover deeper nuances in how science explains the appearance of intelligence and design in the natural and artificial world.
