  ### Decision Tree: Normative Rationality of Honoring Sunk Costs

  **Instructions:** Answer each question based solely on whether you believe the action described is *rational* (normatively justifiable), ignoring whether people *actually* do this. Proceed down the tree based on your answers.

  ---

  #### **Node 1: Film Ticket**  
  You paid $12 for a movie ticket. After 30 minutes, you are bored and would gain more enjoyment from leaving (e.g., meeting friends). You have no stake in the film’s outcome (e.g., reviewing it). Is it rational to stay *just because you paid*?  
  - **Yes** → Go to Node A  
  - **No** → Go to Node B  

  #### **Node A (Film = Yes): PhD Completion**  
  A student has spent 3 years and $60,000 on a PhD but now dislikes academia and has a lucrative job offer. Finishing would cost 2 more years and $40,000, with no added career benefit. Is it rational to complete the PhD *because of the prior investment*?  
  - **Yes** → **Leaf 1: Coherent Non-Standard Preferences**  
    *Rational if the agent values consistency/completion intrinsically, even when costly (e.g., due to identity or "waste-aversion" preferences).*  
    **Most awkward commitment**: Defending why paying $12 for a film justifies wasting an evening, but skipping dinner you paid for might not.  
  - **No** → **Leaf 2: Low-Stakes Self-Knowledge Only**  
    *Rational only in trivial cases: small sunk costs (like a ticket) signal forgotten values (e.g., "I chose this film, so I might rediscover why").*  
    **Most awkward commitment**: Claiming $12 provides self-insight, but years in a PhD (a major life choice) does not.  

  #### **Node B (Film = No): PhD Completion**  
  Same PhD case as Node A. Is finishing rational *due to sunk costs*?  
  - **Yes** → Go to Node C  
  - **No** → Go to Node D  

  #### **Node C (Film = No, PhD = Yes): War Continuation**  
  A government has spent 10 years and $1 trillion on a war. Intelligence confirms it is unwinnable, and continuing will cost lives/money with no strategic gain. Is persisting *to honor soldiers' sacrifices* rational?  
  - **Yes** → **Leaf 3: World-Changed Investment**  
    *Rational if sunk costs alter external realities (e.g., reputation, morale, or geopolitical posture), not just ledgers.*  
    **Most awkward commitment**: Arguing that a war with no upside is rational, but a bad film (which alters no realities) is not.  
  - **No** → **Leaf 4: Identity-Dependent Self-Knowledge**  
    *Rational only for identity-shaping investments (e.g., a doctorate signals core values), not monetary/collective ones.*  
    **Most awkward commitment**: Asserting a PhD’s sunk costs reveal "true" values, but a war’s human costs do not.  

  #### **Node D (Film = No, PhD = No): War Continuation**  
  Same war case as Node C. Is persisting *due to sunk costs* rational?  
  - **Yes** → **Leaf 5: Collective Action Exception**  
    *Rational only in group contexts: honoring sunk costs maintains trust/cohesion (e.g., allies or citizens expect commitment).*  
    **Most awkward commitment**: Permitting irrational war continuation but forbidding it in personal/economic decisions.  
  - **No** → **Leaf 6: Orthodox/Bias-Tracking Hybrid**  
    *Sunk costs are never a direct reason, but the "fallacy" persists because it often correlates with real factors (e.g., persistence signals credibility).*  
    **Most awkward commitment**: Denying rationality while admitting the fallacy is environmentally adaptive.  

  ---

  ### Key Features:
  - **Leaves** (6):  
    1. Coherent Non-Standard Preferences  
    2. Low-Stakes Self-Knowledge Only  
    3. World-Changed Investment  
    4. Identity-Dependent Self-Knowledge  
    5. Collective Action Exception  
    6. Orthodox/Bias-Tracking Hybrid  

  - **Unseparated Leaves**:  
    - **Orthodox** (sunk costs never rational) and **Bias-Tracking** (fallacy tracks real factors but still irrational) both map to **Leaf 6**.  
    **Why?** No case-based question distinguishes them normatively—both reject all examples. The bias-tracking view is a *descriptive* addendum to orthodoxy.  

  - **Unoccupied Combinations**:  
    - **Film=Yes, PhD=No, War=Yes**: Why honor a film ticket and a war but not a PhD? Likely *incoherent* without a principled distinction.  
    - **Film=Yes, PhD=No, War=No**: Why honor only a trivial film ticket? *Unattractive*—it privileges small stakes arbitrarily.  

  - **Omitted View**:  
    - **Policy/Plan Rationality** (a standing disposition to finish can be rational even if acts aren’t) is excluded. To capture it, the tree would need a meta-question (e.g., "Is a *policy* of honoring sunk costs rational?"), violating the "act-level cases only" constraint.  

  ---

  ### Summary
  This tree uses concrete cases to normatively sort views on sunk costs. It isolates self-knowledge, preference coherence, and environmental adaptations while flagging limitations in separating orthodoxy from bias-tracking. Unoccupied combinations reflect logical or intuitive gaps.
