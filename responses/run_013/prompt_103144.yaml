  - The experience might not feel as damning as a real money pump.
  - In the cycle, the items are not equally desirable in a global sense, but the pairwise comparisons create a cycle. In reality, people might have a global utility that breaks the cycle.
  - The debrief must connect the experience to the theory: we are demonstrating that if preferences are cyclic, you can be exploited. But in the real world, we might not be in a situation with a malicious broker.

  Lesson Plan:

  **Rational Choice and Decision Theory: Money Pump Activity**

  **Instructor Prep:**
  1. Buy items:
     - 5 gourmet chocolate bars (about 2 oz each) -> Item A
     - 5 granola bars (1 oz, organic) -> Item B
     - 6 packs of plain rice cakes (3 oz) -> Item C
     - Alternatively, adjust quantities to class size (16 students: 6 of A, 5 of B, 5 of C? But we have a cycle so we need all three. We can have 6 of each? Then some students might not trade. Or just have 5,5,6 and it's okay if not everyone trades.)

  2. Tokens: Poker chips or printed cards (at least 15 per student? but for round1 they start with 5, round2 they start with 10). Or use a ledger on paper.

  3. Comparison sheets: For each pair (A vs B, B vs C, C vs A) create a table:

     ```
     Comparison: Item A vs Item B

     Attribute   | Item A           | Item B           | Winner (A or B)
     ----------------------------------------------------------------
     Flavor      | Gourmet chocolate| Granola bar      | _____
     Healthiness | Indulgent        | Nutritious       | _____
     Quantity    | 2 oz             | 1 oz             | _____
     ```
     And then: "Overall, I prefer: ( ) A or ( ) B"

     Make copies.

  4. Broker station: a table at the front with extra items and a token collection box.

  5. For round2: prepare a record sheet for each student to track their level and tokens.

  **Timeline:**

  0:00-0:10 Introduction

  - "Today we are going to experience two trading activities. You will start with some tokens and an item. Tokens can be exchanged at the end for [rewards: e.g., 1 token = 1 extra credit point, up to 5 points, or 1 token = 1 piece of candy]. You will have opportunities to trade your item for another, but each trade costs 1 token. Also, in the second activity, you will make investment decisions."

  - Distribute 5 tokens to each student.

  0:10-0:20 Distribution and Initial Setup

  - Randomly distribute items A, B, C to students (5 A, 5 B, 6 C). 
  - Explain: "Hold on to your item. In a moment, you will have the opportunity to trade it at the broker station. The broker will offer specific trades."

  0:20-0:40 Trading Round 1 (Cycle Pump)

  - Broker (instructor) announces: 
     "I am now open for trades. Here are the offers:
        - If you have item A, you can trade it for item B for 1 token.
        - If you have item B, you can trade it for item C for 1 token.
        - If you have item C, you can trade it for item A for 1 token."
     "When you come to trade, you must fill out a comparison sheet for the two items you are trading between. You will check which item wins on each attribute and then decide which one you prefer. If you prefer the new item, you can trade by paying 1 token."

  - Students line up at the broker station. For each trade, the broker gives them the appropriate comparison sheet. They fill it out quickly (should take 1-2 minutes) and then, if they prefer the new item, they trade.

  - The broker collects the token and the old item, and gives them the new item.

  - The broker continues to offer for 20 minutes. Encourage students to trade multiple times.

  0:40-0:55 Trading Round 2 (Escalating Commitment Pump)

  - Collect all items from round1. Tell students: "Now we are starting a new activity. You start at level 0. I am giving each of you 10 tokens for this round."

  - Distribute 10 tokens to each student (so they now have 10 new tokens for this round).

  - Broker announces the rules:
     "You can invest in levels. The rules:
        - You start at level 0.
        - To move from level k to level k+1, you pay 1 token and immediately receive (k+1) tokens.
        - When the round ends, you must pay a termination fee of (your level)^2 tokens.
        - You can stop at any level by not taking further trades."

     Broker then offers:
     "Step up to level 1: pay 1 token, get 1 token. Termination fee at level1 is 1 token."
     "Step up to level 2: pay 1 token, get 2 tokens. Termination fee at level2 is 4 tokens."
     "Step up to level 3: pay 1 token, get 3 tokens. Termination fee at level3 is 9 tokens."

  - Students come to the broker to level up. They can come multiple times. The broker updates their level and collects/grants tokens immediately.

  - After 5 minutes, announce: "Last call for trades." Then after 15 minutes from the start of round2, say: "The round is over. Please pay your termination fee: if you are at level k, pay k^2 tokens."

  - Students pay the fee. They should have a negative net in tokens.

  0:55-1:30 Debrief

  1. Cycle Pump Experience:
     - Poll: "How many traded at least once? How many twice? How many three times? How many ended up with their original item?"
     - Ask a student who cycled: "Why did you trade each time?" (Expected: each trade was an improvement by pairwise comparison.)
     - Show the preference cycle: A>B, B>C, C>A. 
     - Ask: "Is there anything wrong with having these preferences? After all, each trade was rational at the time."
     - Raise the issue of exploitability: the broker pumped tokens out of you by exploiting the cycle.

  2. The Sophisticated Chooser:
     - "Did anyone refuse to trade? Why?"
     - "If you see the cycle, is it rational to refuse the first trade, even though right now you prefer B to A?"
     - Discuss: sophisticated vs. naive choice.

  3. Escalating Commitment:
     - Poll: "What level did you reach? What was your net token change? (Subtract the termination fee.)"
     - Show the marginal decision: at level k, moving to k+1 gives you k+1 tokens for 1 token, which seems good. But the termination fee increases by (k+1)^2 - k^2 = 2k+1, which is greater than the immediate gain.
     - Why did you keep going? (Sunk cost fallacy? Underestimating the fee? Myopia?)
     - This pump exploits dynamic inconsistency: the cost of the fee is delayed, so you focus on the immediate gain.

  4. Broader Implications:
     - Money pump arguments show that having cyclic preferences or being dynamically inconsistent makes you vulnerable to exploitation.
     - In standard decision theory, rational preferences are required to be acyclic and dynamically consistent to avoid being money-pumped.
     - But note: in real life, we might not face malicious brokers. And some argue that if you are sophisticated, you can avoid the pump even with inconsistent preferences.

  5. Conclusion:
     - The activity lets you experience the pump. The theory provides tools to diagnose and avoid it.

  **What can go wrong:**

  - Some students might not trade in round1 because they are happy with their item. That's okay. In the debrief, we can say: "Even if you didn't trade, you might have been willing to trade if you had a different item."
  - In round1, the comparison might not lead to the cycle for everyone. Emphasize the rule: count the attributes.
  - In round2, students might stop at level1 or 2 and not see the pump. That's okay, we can still show the calculations.
  - Time: 90 minutes is tight. Keep the rounds moving.

  **What the activity can't do:**

  - It can't replicate high-stakes real-world decisions.
  - It might not convince everyone that cyclic preferences are irrational, especially if they can avoid the pump by being sophisticated.
  - The debrief must connect the experience to the formal theory and address philosophical objections.

  Good luck!
answer: |-
  ### Lesson Plan: Experiencing the Money Pump  
  **Objective:** Students will experience cyclic preferences and dynamic inconsistency through two money pump simulations, then analyze the rationality of their choices in a debrief.  

  ---

  #### **Materials & Setup**  
  1. **Items for Cyclic Preferences (Round 1):**  
     - **Item A:** "Gourmet Chocolate Bar" (2 oz, high sugar, rich flavor).  
     - **Item B:** "Organic Granola Bar" (1 oz, moderate fiber, mild flavor).  
     - **Item C:** "Rice Cake Pack" (3 oz, low calorie, plain flavor).  
     *Quantity:* 5 of A, 5 of B, 6 of C (adjust for 16 students).  

  2. **Attributes & Rankings (Rigged for Cycle):**  
     - **Flavor:** A (best) > B (medium) > C (worst).  
     - **Health:** B (best) > C (medium) > A (worst).  
     - **Quantity:** C (best) > A (medium) > B (worst).  
     *Cycle:* A > B (2/3 attributes), B > C (2/3), C > A (2/3).  

  3. **Comparison Sheet** (1 per student; [download template](https://example.com/comparison-sheet)):  
     ```markdown
     | Attribute | Your Item       | New Item        | Winner? |
     |-----------|-----------------|-----------------|---------|
     | Flavor    | [ ] A / [ ] B / [ ] C | [ ] A / [ ] B / [ ] C | [ ]     |
     | Health    | [ ] A / [ ] B / [ ] C | [ ] A / [ ] B / [ ] C | [ ]     |
     | Quantity  | [ ] A / [ ] B / [ ] C | [ ] A / [ ] B / [ ] C | [ ]     |
     **Overall Preference:** [ ] My Item | [ ] New Item  
     ```  
     *Rules:* "Decide based on which item wins more attributes. No weighting!"  

  4. **Tokens & Rewards:**  
     - Start with 5 tokens (e.g., poker chips) per student.  
     - Tokens buy rewards post-activity (e.g., 1 token = 1 candy, 5 tokens = extra credit point).  
     - Each trade costs 1 token.  

  5. **Broker Station:**  
     - Instructor/TA acts as broker.  
     - **Script:** "Trade your current item for [next item] for 1 token. Fill out the comparison sheet first!"  
     - *Offers:*  
       - Holders of A: Trade for B.  
       - Holders of B: Trade for C.  
       - Holders of C: Trade for A.  

  6. **Escalating Commitment Pump (Round 2):**  
     - "Investment Dial" (poster showing levels):  
       ```  
       Level 0: Start (0 tokens cost, 0 reward).  
       Level 1: Pay 1 token → Get 1 candy.  
       Level 2: Pay 1 token → Get 1 candy.  
       ...  
       Level 5: Pay 1 token → Get 1 candy → Pay 5 token "completion fee".  
       ```  
     - *Net outcome:* Each step seems fair (+0 net), but Level 5 costs 10 tokens for 5 candies (net -5 tokens).  
     - **Broker Script:** "Upgrade a level for 1 token! Get candy now, pay fees later."  

  ---

  #### **Timeline (90 Minutes)**  
  **0:00–0:15 — Intro & Setup**  
  - Explain: "Today, you’ll trade items for rewards. Tokens = real goodies later."  
  - Distribute: Items randomly (5 A, 5 B, 6 C). Give 5 tokens/student.  

  **0:15–0:35 — Round 1: Cyclic Pump**  
  - **Broker announces trades** (per script above).  
  - Students visit broker:  
    1. Fill comparison sheet for their item vs. new item.  
    2. If they prefer the new item, trade + pay 1 token.  
  - *Broker manipulates:*  
    - After trading A→B, offer B→C, then C→A.  
    - Goal: Pump students back to start item (e.g., A→B→C→A) minus tokens.  
  - *Run 15 minutes.*  

  **0:35–0:50 — Round 2: Escalating Commitment Pump**  
  - Collect Round 1 items. Reset tokens to 5/student.  
  - **Broker announces:** "New game! Invest tokens to climb levels for candy. Pay fees at the end."  
  - Students visit broker to "upgrade":  
    - Each level-up costs 1 token → immediate candy.  
    - At Level 5, broker charges 5 tokens "completion fee."  
  - *Broker pushes:* "Just one more level! Small cost, instant reward."  
  - *Run 10 minutes.*  

  **0:50–1:25 — Debrief**  
  *(Use whiteboard to map choices to theory)*  

  1. **Round 1 Experience:**  
     - Poll: "Who traded back to their start item? How many tokens lost?"  
     - Reveal the cycle:  
       ```  
       A > B (Flavor+Qty vs. Health)  
       B > C (Flavor+Health vs. Qty)  
       C > A (Health+Qty vs. Flavor)  
       ```  
     - **Q:** "Why did you trade each time?"  
       → *Expected:* "I preferred the new item in the moment."  
     - **Key Point:** Cyclic preferences enable exploitation.  

  2. **Round 2 Experience:**  
     - Poll: "Who reached Level 5? Net tokens vs. candy?"  
     - Contrast:  
       - Cyclic pump: Violates *transitivity* (A>B, B>C, but C>A).  
       - Escalating pump: Violates *dynamic consistency* (myopic focus on immediate rewards).  
     - **Q:** "Why keep investing?"  
       → *Expected:* "Each step felt worth it."  

  3. **Sophisticated Chooser Dilemma:**  
     - "Who refused Round 1 trades? Why?"  
       → *Expected:* "I saw the cycle coming."  
     - **Debate:**  
       - *Pro-exploitability:* If you prefer B to A now, refusing is irrational unless you anticipate pumping.  
       - *Counter:* Sophistication (foreseeing cycles) is rational.  
     - **Key Point:** Rationality debates hinge on whether exploitability defines irrationality.  

  4. **Broader Implications:**  
     - Fixes:  
       - Cyclic preferences → Use ranking systems (e.g., weighted attributes).  
       - Dynamic inconsistency → Precommitment (e.g., set investment limits).  
     - **Q:** "Does avoiding pumps require ‘rational’ preferences, or just cleverness?"  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem:** Students don’t cycle (e.g., weigh attributes equally).  
     - **Fix:** Enforce the comparison sheet rules: "Decide by attribute wins only!"  

  2. **Problem:** Some smell the trap early.  
     - **Fix:** Use them in debrief: "Sophistication saved you tokens. Is that rational?"  

  3. **Problem:** Token confusion.  
     - **Fix:** Use physical tokens (chips) and a public ledger.  

  4. **Problem:** Time crunch.  
     - **Fix:** Cap trades at 2 cycles in Round 1; end Round 2 at Level 4 if needed.  

  ---

  #### **Limitations & Teaching Notes**  
  **What This Can’t Reproduce (Supply in Debrief):**  
  - **Real-world stakes:** Tokens are low-stakes. Emphasize that pumps with real money cause bankruptcy.  
  - **Weighted preferences:** Students may argue attributes aren’t equally important. Discuss: "Cycles arise even with weighting if rankings conflict."  
  - **Emotional bias:** The activity assumes rational comparison, but stress that emotion (e.g., craving chocolate) exacerbates pumps.  

  **Final Note:**  
  This activity makes exploitability visceral. Your role: Connect feelings (frustration, regret) to theory. Highlight that rationality is contested—some economists defend cyclic preferences if pumping is rare. Assign follow-up reading (e.g., Amartya Sen on internal consistency).  

  Run cold, this works 80% of the way; your energy fills the last 20%. Good luck!  

