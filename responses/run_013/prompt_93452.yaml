  Potential pitfalls: Offending the family by implying the fictional version overshadows the real person, or upsetting historians by downplaying accuracy. Mitigation involves emphasizing respect and the intent to honor, not replace, the truth. Using phrases like "caretakers of her legacy" includes both groups in the responsibility. Including the historian's scrutiny as a positive force adds balance.

