  Here’s a structured, honest, and warm 6-7 minute speech that confronts your core idea head-on, respects both audiences, and lands on a clear ethical position:

  **(Start warmly, standing, holding the plaque lightly)**  
  Thank you. This plaque is… deeply meaningful. To the Historical Society, thank you for this honor, and for keeping our shared past alive. To [Great-Great-Granddaughter's Name], thank you for trusting me with your ancestor’s shadow. And to the historians here tonight… *(small smile, acknowledging)* …thank you for keeping me honest. Or at least, for noticing when I wasn’t.

  **(Transition to the core idea)**  
  Receiving this for a novel – a *work of fiction* – about a real woman who walked these streets, raises something I think about constantly. We say a life ends when the breath leaves the body. But is that true? Or does a life truly end only when the *last* person forgets the *last* story about them? As long as someone is telling their tale, that life… persists. It changes, evolves, breathes in a different way.

  **(Address the tension directly)**  
  And that’s where someone like me comes in. I spent years with [Woman's Name]. I read every scrap, walked where she walked, tried to inhabit her world. But let’s be utterly clear: I filled in the cavernous gaps. I invented dialogue. I shaped events for narrative drive. I compressed timelines. I gave her thoughts I could never prove she had. The version many of you now know? It’s partly mine. That invented version flows back into the river of her memory, mingling with the documented facts. The dead, as I’ve come to feel it keenly, have no voice to say, *“Not that. Not me.”*

  **(Confront the ethical question head-on)**  
  So, what do I owe her? What do any of us owe the dead when we tell their stories? Especially when half this room holds the facts dear, and the other half – her family – holds her blood?

  Is getting every date perfect the debt? *(Look directly at the historians)* Well, no. Not entirely. Though I *do* owe you all the rigor I can muster, and my profound respect for the work you do to anchor us in truth. A wrong date is carelessness, and carelessness dishonors the work.

  But is *only* imagination and empathy enough? *(Look towards the family)* Also, no. That feels like a dodge. A warm blanket over a hard question.

  **(Land on your clear position)**  
  **What I owe [Woman's Name] is this: Respect for the *essence*.** Not just the facts of her life, but the *truth* of her struggle, her time, and her humanity as best I could discern it. I owe her the refusal to make her a mere puppet for my plot. I owe her the refusal to soften her edges or simplify her world if it betrays the harder, messier reality she navigated. I owe her the work of trying to make my inventions *tributaries* that flow *towards* the river of her documented life, not dams blocking it or pollutants muddying it beyond recognition.

  **(Acknowledge the power & the risk)**  
  When we tell a dead person's story, we reach back and change what their life *means* in the collective memory. That’s an immense power. It can be for the better – illuminating forgotten courage, giving voice to the silenced. Or it can be for the worse – reducing them to a caricature, imposing our own biases, drowning their reality in our fantasy. The dead *can* be wronged. Not because they feel it, but because we obscure *them* – the actual person who lived, breathed, and faced their own dawns – beneath our inventions.

  **(Bring it home to the room & the honor)**  
  So tonight, this plaque honors the *story*. But the responsibility it reminds me of is far heavier: the responsibility to wield that power of continuation with humility and fierce care. To the historians: keep your spreadsheets. Scrutinize. Hold the line on the facts – you are the bedrock. To the family: thank you for sharing her. My hope isn’t that you see *only* my version, but that the story sent more people back to *yours*, to *her*. And to [Woman's Name]: I hope the life we keep telling – the one built on your real bones and clothed, yes, in some of my fabric – resonates with something true. That it keeps you walking among us, not as I made you, but as you fundamentally were: a real woman, forever part of this place we all call home.

  **(Raise the plaque slightly)**  
  Thank you for letting me continue her story. Let’s all keep telling it, and telling it well. Cheers.

  **Key elements & why they work:**

  1.  **Direct Address of Both Audiences:** Names them specifically ("historians," "family"), acknowledges their valid perspectives upfront (facts vs. bloodline), and speaks *to* their concerns.
  2.  **Unflinching Honesty:** Uses clear, unambiguous language about invention ("invented dialogue," "compressed timelines," "version many of you know... partly mine," "dead... have no voice").
  3.  **Confronts the Ethical Core:** Explicitly states the dilemma ("What do I owe her?"), rejects easy answers ("not just dates," "not just imagination/empathy"), and lands the clear position ("Respect for the *essence*").
  4.  **Defines "Owed" Concretely:** Breaks down the debt: Rigor + Respect for Facts (to historians), Refusal to Betray Core Humanity (to the subject), Intentional Tributaries vs. Dams/Pollutants (metaphor for responsible invention).
  5.  **Acknowledges Power & Risk:** Clearly states the writer's power to change meaning and the potential to wrong the dead by obscuring *them*.
  6.  **Warmth & Connection:** Grounded in place ("our shared past," "this place we all call home"), gratitude (to Society, Family, Historians), and the shared purpose of remembrance ("keep telling it, and telling it well").
  7.  **Clear Position:** The answer isn't factual perfection alone, nor unbridled imagination. It's **respect for the essence**, wielded with humility and care, understanding the power to shape legacy and the risk of obscuring the real person. The plaque is for the story, but the responsibility is to the person.
  8.  **The Plaque as Prop/Anchor:** Starts and ends with it, using it physically to bridge the abstract idea and the concrete honor.
  9.  **Time:** Structured for approx. 6-7 minutes when delivered with measured pace and pauses.

  This speech delivers the hard truth you want, honors both the family and the historians by taking their stakes seriously, avoids sentimentality while retaining warmth, and fulfills your need to articulate the profound responsibility and ethical weight of reanimating a real life through fiction. It lands firmly: You owe the dead respect for their essential truth, not just fact-checking, and you wield the power to shape their ongoing life with immense care.
