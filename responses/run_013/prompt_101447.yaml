  First, I need to outline the agreed-upon claims. Both sides would agree on the need to explain mental content, including misrepresentation, the disjunction problem, and other key phenomena. The user provided two test cases: one involving a copied signaling circuit and another a designed device without selection history. These cases are crucial for testing each theory's predictions.

  Next, the disagreements table. The main points are the necessity of selection history, the definition of normal conditions, and what fixes content. For each, I have to phrase each side's position in their own terms. For example, teleosemantics insists on historical selection, while the causal-informational view rejects it as essential.

  The cruxes are where experiments could decide. The copied circuit case tests if history matters. The teleosemanticist predicts content based on original function, while the causal theorist says current correlations define it. The designed device without history challenges if selection is necessary. The engineer case here is key—causal theory says yes, teleosemantics says no without history.

  I should also address verbal disputes, like whether learning or design counts as history. Both sides might agree on design as intentional, but teleosemantics includes it as part of selection history. This could be a point of clarification.

  The user wants to know what evidence would falsify each position. For teleosemantics, a state with no history but clear content. For causal theory, a state with reliable correlation but no representational status. The test cases are set up to probe these points.

  I need to ensure the language is precise and each side's view is accurately represented. Using terms like "proper function" for teleosemantics and "reliable covariation" for causal theory. Also, structuring the document with numbered sections, tables, and clear cruxes as requested.

  Finally, assessing if there's common ground. Both agree that normal conditions matter, but define them differently. The collaboration might reveal that historical functions sometimes align with current correlations, but cases of mismatch are where theories diverge. Highlighting such scenarios can clarify the substantive disagreements versus terminological differences.
answer: |-
  ## Joint Statement on the Naturalisation of Mental Content  
  **Signed:**  
  *Dr. Anya Finch (Committed Teleosemanticist)*  
  *Dr. Ben Stone (Committed Causal-Informational Theorist)*  
  *Date: October 26, 2023*

  ### 1. Agreed Foundational Claims
  We affirm the following core commitments about the project of naturalising mental content:

  1.  **The Target Phenomenon:** Any successful theory must explain intentionality – the "aboutness" of mental states – as a natural, non-magical feature of certain physical systems.
  2.  **Explananda:** A theory must account for:
      *   **Misrepresentation:** The possibility of states being *false* or *inaccurate* (e.g., a perceptual state signaling "predator" when none is present).
      *   **The Disjunction Problem:** Explaining why a state triggered by X (e.g., a rabbit) and sometimes by Y (e.g., a squirrel in shadows) represents X (rabbit) and *not* the disjunction (rabbit-or-squirrel-in-shadows), especially when the state is reliably caused by both.
      *   **Indeterminacy:** Acknowledging that content may sometimes be indeterminate (e.g., whether a frog's fly-detector represents "fly," "small dark moving thing," or "food").
      *   **Non-Covariant Content:** The possibility of representational states that do not reliably covary with anything in the environment *now* (e.g., a novel thought, a memory of a unique event).
      *   **Normativity:** The fact that representations can be *correct* or *incorrect* relative to how things actually are.
  3.  **Shared Assumption (Covariation):** Both theories agree that reliable causal covariation under some conditions is a *necessary* (but not necessarily sufficient) condition for a state to carry natural content. A state that *never* covaried with anything lacks representational status.
  4.  **The Central Dispute is Substantive:** We agree that the core disagreement – whether a history of selection (broadly construed) is *essential* for fixing natural content, or whether current causal covariation under normal conditions suffices – is a substantive, non-verbal dispute about the world. It concerns what facts *constitute* representational content.
  5.  **Agreed Test Cases:** We accept the following stipulated cases as crucial test material for evaluating our theories:
      *   **Case 1 (Copied Circuit):** A neural signaling circuit was selected for in Species A to indicate the presence of Predator P and to trigger Flight Response F. An experimenter perfectly copies this circuit (including its internal structure and connections to sensory input and behavioral output pathways) into Species B, which inhabits an ecology devoid of P. In Species B, the same circuit state is reliably triggered by Harmless Stimulus H (to which Species B sensors are sensitive) and triggers Grooming Behavior G. What, if anything, does this circuit state represent *in Species B*?
      *   **Case 2 (Engineered Device):** An engineer, starting from scratch with no prior selection history (evolutionary, learning, or design iteration), builds a device. An internal state S of this device reliably covaries with ambient temperature (T) via a well-calibrated sensor under standard atmospheric conditions and activates a cooling mechanism when T exceeds a set threshold. Does S represent temperature (T)? If so, in virtue of what?

  ### 2. Disagreements Table

  | Point of Contention                                                                 | Teleosemantic Position (Finch)                                                                                                 | Causal-Informational Position (Stone)                                                                                                 |
  | :---------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ |
  | **1. Necessity of Selection History:** Is a history of selection essential for fixing content? | **Yes.** Content is fixed *only* by the proper function of a state, which is conferred by its history of selection (natural, learning, or deliberate design) for producing certain effects. | **No.** Content is fixed solely by the state's current reliable causal covariation with features in the world under normal conditions, irrespective of history. |
  | **2. Definition of "Normal Conditions":** What determines the conditions under which covariation fixes content? | "Normal conditions" are defined teleologically: the conditions under which the mechanism *was selected* to operate successfully. Content is fixed relative to these historical conditions. | "Normal conditions" are defined non-teleologically: statistically prevalent conditions or conditions conducive to the overall stability/persistence of the system *now*. Content is fixed relative to current causal patterns. |
  | **3. What Fixes Content?** What is the primary determinant? | The **consumer's function** (historically selected *use* of the state, e.g., triggering flight) primarily fixes content, often overriding producer correlations. | The **producer's correlation** (reliable causal link from feature to state under normal conditions) primarily fixes content, constraining possible consumer uses. |
  | **4. Status of Novel Design (Case 2):** Does the engineered device's state S represent T? | **No.** Without a history of selection (including design iteration where success/failure *drove* refinement), S lacks a proper function. It reliably correlates with T, but this correlation lacks normative force (cannot misrepresent). It is merely a causal indicator. | **Yes.** S reliably covaries with T under normal conditions (standard atmosphere) and this covariation plays a defined causal role (triggering cooling). This suffices for representation. Misrepresentation is possible (e.g., sensor malfunction). |
  | **5. Interpretation of Copied Circuit (Case 1):** What does the state represent in Species B? | It represents **Predator P**. Its content is fixed by its original proper function in Species A. In Species B, it *misrepresents* H as P (because H triggers the state whose function is to indicate P). The output (Grooming G) is a malfunction. | It represents **Harmless Stimulus H**. In its *current* context (Species B ecology, sensors, outputs), S reliably covaries with H under normal conditions and triggers G. It has no function indicating P in this new system. |

  ### 3. Cruxes: Experiments and Predictions
  We identify the following testable cruxes where empirical findings or conceptual analysis of agreed cases could significantly shift the debate:

  1.  **Crux 1: The Copied Circuit (Case 1) - Does Historical Function Constrain Current Content?**
      *   **Case:** The copied circuit in Species B.
      *   **Question:** Does the state's history in Species A dictate its representational content in Species B, overriding its current reliable covariation with H?
      *   **Finch (Teleosemantic) Prediction:** Yes. The state *misrepresents* H as P in Species B. Evidence: If manipulating the circuit in Species B (e.g., stimulating it directly) elicits behaviors *appropriate to P* (like fear or attempted flight) rather than just grooming, this supports the persistence of the original functional role/content.
      *   **Stone (Causal-Informational) Prediction:** No. The state represents H. Evidence: If the circuit integrates seamlessly into Species B's behavioral repertoire, responding adaptively *to H* via Grooming G, and shows no behavioral or systemic signature of "detecting" P, this supports content being fixed by current causal role/correlation. The history is irrelevant.

  2.  **Crux 2: Novel Artifact Content (Case 2) - Is Selection History Necessary for Normativity?**
      *   **Case:** The engineered thermometer/cooler device built from scratch.
      *   **Question:** Can S represent T and misrepresent (e.g., when the sensor malfunctions and triggers cooling on a cold day), absent any history of selection?
      *   **Finch (Teleosemantic) Prediction:** No. S covaries with T reliably, but without a history where this correlation was selected *for* a purpose (e.g., maintaining a system within viable temperature bounds through differential success/failure), the state lacks genuine representational content and normative standards. It simply causes cooling when T is high. A malfunction is just a broken cause, not a false representation.
      *   **Stone (Causal-Informational) Prediction:** Yes. S represents T. Its reliable covariation under normal conditions (defined by the system's design specs and operating environment), combined with its functional role in regulating temperature, constitutes its representational content. If cooling activates when the sensor incorrectly reports high T (due to local heat source, not ambient), S misrepresents the ambient temperature.

  3.  **Crux 3: Learning as History - Does it Suffice for Teleosemantics?**
      *   **Case:** Consider a simple associative learning mechanism (e.g., Pavlovian conditioning) where a neutral state S comes to reliably covary with a stimulus U (e.g., shock) and triggers a response R (e.g., fear). Assume no prior evolutionary history for S representing U.
      *   **Question:** Does the *learning process itself* (differential reinforcement) confer a proper function on S to indicate U, thereby fixing its content as U?
      *   **Finch (Teleosemantic) Prediction:** Yes. Learning is a selection process (reinforcement selects successful associations). The acquired proper function of S is to indicate U, enabling misrepresentation (e.g., if S fires due to a similar stimulus without U).
      *   **Stone (Causal-Informational) Prediction:** Content Established. S reliably covaries with U under the learned "normal conditions" (the conditioned context). The learning history *explains* the reliable correlation but doesn't add an essential "function" layer; the correlation itself under current conditions fixes content. Misrepresentation occurs if S fires without U in that context.

  ### 4. Evidence and Argument Against Own Positions

  *   **Finch (Teleosemantic):** "Evidence against my position would be a clear case of a novel state (1) lacking *any* relevant selection history (evolutionary, learning, or design iteration), yet (2) exhibiting undeniable hallmarks of genuine representation: robust, systemic sensitivity to specific environmental conditions driving appropriate, flexible behavior, coupled with clear instances of *system-relative* misrepresentation where the state is active but the condition it seems keyed to is absent *and* this leads to inappropriate behavior *in that novel context*. Case 2 (Engineered Device) is my paradigmatic test. If compelling arguments or thought experiments demonstrate that such a state *must* be granted genuine representational status and normativity absent history, my core claim fails."
  *   **Stone (Causal-Informational):** "Evidence against my position would be a compelling case where (1) a state reliably covaries with feature F under conditions C that are normal *by my definition* (statistically prevalent/conducive to persistence), (2) the state plays a clear functional role within the system, yet (3) we have strong intuitions or systemic behavioral evidence that it *does not* represent F, or represents something else entirely, *and* this intuition is best explained by its history. Case 1 (Copied Circuit) is key. If experiments showed the copied circuit in Species B *systematically* caused behaviors appropriate *only* to P (despite never encountering P) and disrupted behaviors keyed to H, this would suggest history overrides current covariance, challenging my core claim."

  ### 5. Potential Movers of the Debate & Verbal Disputes

  *   **Agreed Potential Mover:** **Crux 1 (Copied Circuit).** Both agree that empirical investigation into the systemic behavioral and cognitive effects of the copied circuit in Species B could provide decisive evidence. If the circuit behaves purely as an H-detector/grooming-trigger within Species B's cognitive economy, it favors Stone. If it retains "echoes" of its P-related function (eliciting P-appropriate behaviors, disrupting B's normal functioning when activated in contexts unrelated to H), it favors Finch.
  *   **Verbal Dispute:** The **status of deliberate design** within teleosemantics is partially verbal. *Both* agree that the *engineer's intentions* fix the device's *assigned* content/function. The dispute is whether this counts as the relevant "selection history" for *natural* content. Finch *defines* deliberate design as a type of selection process (where the designer selects successful designs based on criteria). Stone argues this stretches "selection" beyond its naturalistic core and that the *designer's mind* is doing the work, not a natural selection process. This definitional difference colors their interpretations of Case 2, but the core disagreement (is history necessary?) remains substantive. **Learning** is less disputed verbally; both agree it involves a selection-like process, but Stone denies this process adds anything essential *beyond* establishing the reliable covariation that fixes content.

  **Conclusion:** This collaboration has sharpened our respective positions and identified crucial test cases (Copied Circuit, Engineered Device) and conceptual cruxes (role of history in normativity, persistence of historical function). While significant disagreement remains on the necessity of selection history, we agree that empirical investigation of systems like the Copied Circuit in novel contexts offers the most promising path towards resolving the core substantive dispute about the natural basis of mental content. The resolution likely hinges on whether historical functions exhibit robust persistence overriding current causal profiles.
