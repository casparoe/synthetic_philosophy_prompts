  Predictions matter: HOT uniquely predicts that metacognitive deficits (e.g., no self-report) = no phenomenology, while global workspace might allow "unreportable" feelings. But falsifiability is shaky—if every counterexample gets patched by redefining "suitable HOT," does the theory become untestable? The user’s last question nails it: Is this a fatal flaw or just the cost of doing business in consciousness studies?  

