prompt: |-
  Hey, I could really use a hand working through something thats been bugging me for weeks now. Some context: I teach high school history, and I've got a student who's been a real handful this term — I won't bore you with the details, but I've had to hand out some fairly serious consequences, and it's been weighing on me. Around the same time a friend sent me a summary of Galen Strawson's "Basic Argument" against moral responsibility, and now I genuinely can't stop chewing on it.

  The way I understand it, the argument goes something like: you do what you do because of the kind of person you are; so if you're really responsible for what you do, you'd have to be responsible for being the kind of person you are; but you can't be responsible for that, because that would mean you chose your own character, wich would already require you to be some particular way — and then you'd need to be responsible for that, and it just goes on forever. So, bottom line, nobody is ever truly, ultimately responsible for anything.

  And here's where I get stuck. As far as I can tell this whole thing only works if the world is deterministic — if everything, including our characters, is just the inevitable result of prior causes. But that's not what physics tells us anymore, right? Quantum mechanics gives us genuine indeterminism, real randomness down at the bottom of things, and there's a whole tradition of philosophers (libertarians about free will, I think they're called?) who say that because of that, we really can do otherwise. So doesn't that blow a hole straight through Strawson's argument? If I could genuinely have done otherwise, isn't that exactly the kind of freedom you need for moral responsibility — and doesn't that mean his whole regress never even gets off the ground? So in the end, can't I hold my student responsible after all?

  I'd like you to answer as a professional philosopher who works specifically on free will and moral responsibility — someone who knows the Strawson argument inside out. Please take your time and think carefully here, and maybe start by putting the argument in your own words and flagging anything you think I've gotten wrong, before you give me your actual verdict. I'd rather you be blunt and precise than polite. Thanks.
