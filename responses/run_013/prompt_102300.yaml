answer: |-
  ## Joint Statement of Adversarial Collaboration on Testimony  
  **Signed:** The Reductionist (R) & The Anti-Reductionist (AR)  
  **Date:** 2023-10-26  
  **Context:** Resolution-seeking document from Humean (R) and Reidian (AR) perspectives, addressing core disagreements via shared cases.  

  ---

  ### I. Agreed Foundational Claims (Signed by Both)  
  1. **Testimony Defined:** Testimony is an act whereby a speaker (or speaker-analogue) asserts information with the intention to convey it to an audience.  
  2. **Epistemic Target:** The primary phenomenon requiring explanation is how testimonial beliefs gain *justification* or *entitlement* for a hearer.  
  3. **Psychological Reality:** Both children and adults acquire vast amounts of belief from testimony, often without explicit investigation into the speaker’s reliability.  
  4. **Developmental Fact:** Early language acquisition requires children to treat caregivers’ utterances as trustworthy for learning word-referent mappings and basic facts about the world.  
  5. **No Magic Justification:** Testimonial justification is not sui generis or disconnected from broader epistemic norms (e.g., coherence, evidence-responsiveness).  
  6. **Defeaters Matter:** Both views acknowledge that evidence of speaker unreliability, inconsistency, or incoherence can *defeat* testimonial justification.  
  7. **Burden of Proof:** The central dispute is whether the *default posture* toward testimony is one of trust (AR) or one requiring prior justification (R).  

  ---

  ### II. Remaining Disagreements (Phrased in Own Terms)  
  - **R’s Position:** *"Hearers must epistemically earn the right to trust testimony by verifying the speaker’s competence and sincerity through independent evidence or inductive track records. Absent such evidence, testimony alone provides no justification."*  
  - **AR’s Position:** *"Hearers possess a defeasible entitlement to trust testimony by default, grounded in our design as social cognizers. This entitlement is overridden only by positive evidence of unreliability, not by a lack of positive evidence."*  

  ---

  ### III. Cruxes: Test Cases & Predictions  
  *Cases agreed by the reading group as decisive. Predictions are pre-commitments.*  

  #### **Crux 1: Is default trust psychologically primitive?**  
  - **Case:** (3) Child picking up language.  
  - **R’s Prediction:** *Children infer reliability inductively from correlations (e.g., "mama" + presence of mother). No default entitlement needed.*  
  - **AR’s Prediction:** *Children treat language as trustworthy *before* forming inductive generalizations; this pre-inductive trust is foundational.*  
  - **Embarrassment Condition:**  
    - R embarrassed if experiments show infants trust novel speakers *without* reinforcement history.  
    - AR embarrassed if infants *only* trust after repeated confirmation.  
  - **Load-Bearing:** **YES** – Directly tests developmental origins.  

  #### **Crux 2: Can testimony be fully "discharged"?**  
  - **Case:** (1) Reading/checking every step of a proof.  
  - **R’s Prediction:** *After checking, belief rests on personal verification, not testimony. Testimony is a mere catalyst.*  
  - **AR’s Prediction:** *The initial structure of understanding relies on testimony; verification depends on concepts inherited linguistically.*  
  - **Embarrassment Condition:**  
    - R embarrassed if the checker cannot explain why they trusted the *notation* or *axioms* without testimonial history.  
    - AR embarrassed if the checker can fully reconstruct all presuppositions autonomously.  
  - **Load-Bearing:** **YES** – Tests whether testimony leaves justificatory residue.  

  #### **Crux 3: Does reliability without intentionality suffice?**  
  - **Case:** (4) LLM producing a fluent answer with no speaker.  
  - **R’s Prediction:** *Justification depends *only* on evidence of the LLM’s reliability (e.g., benchmark accuracy), not on "speaker" properties.*  
  - **AR’s Prediction:** *LLMs lack intentional states; thus, their outputs are not testimony and receive no default entitlement (though they may be reliable evidence).*  
  - **Embarrassment Condition:**  
    - R embarrassed if people intuitively distrust LLMs *despite* known reliability stats.  
    - AR embarrassed if people treat LLMs identically to human testimony absent defeaters.  
  - **Load-Bearing:** **YES** – Tests necessity of human agency.  

  #### **Crux 4: Is reliability sufficient absent sincerity?**  
  - **Case:** (2) Known liar who is structurally reliable (e.g., compulsive liar predicting coin flips correctly).  
  - **R’s Prediction:** *Belief is justified because reliability is verified, regardless of intent.*  
  - **AR’s Prediction:** *Defeated: Sincerity is a necessary condition for testimonial entitlement.*  
  - **Embarrassment Condition:**  
    - R embarrassed if hearers cannot rationally trust the liar *even knowing* the reliability.  
    - AR embarrassed if hearers rationally trust the liar absent new defeaters.  
  - **Load-Bearing:** **NO** – Both sides can explain outcomes: R via reliability, AR via defeat.  

  #### **Crux 5: Does genealogy undermine justification?**  
  - **Case:** (5) Community with untraceable but accurate inherited knowledge.  
  - **R’s Prediction:** *Justified *only* if current evidence supports reliability (e.g., maps match terrain).*  
  - **AR’s Prediction:** *Justified by default; lost genealogy is not a defeater unless unreliability is suspected.*  
  - **Embarrassment Condition:**  
    - R embarrassed if community knowledge is deemed rational without *any* current verification.  
    - AR embarrassed if accuracy is coincidental (e.g., distorted origins) and justification persists.  
  - **Load-Bearing:** **PARTIAL** – Tests scope of defeaters, but both frameworks can accommodate.  

  ---

  ### IV. Verbal Disputes (Flagged & Clarified)  
  1. **"Presumption" vs. "Prima Facie Justification":**  
     - **Why Verbal?** AR uses "presumption" as a psychological default; R uses "prima facie justification" as an epistemic norm. Both agree the functional outcome is: *trust is rational unless defeated*.  
  2. **Is an LLM a "speaker"?**  
     - **Why Verbal?** R defines "speaker" functionally (source of reliable assertions); AR defines it intentionally (mind with communicative goals). **Agreed Neutral Term:** *Assertion-generator*.  

  ---

  ### V. Disagreements Table  
  | Issue                          | Reductionist (R)                          | Anti-Reductionist (AR)                     |  
  |--------------------------------|-------------------------------------------|--------------------------------------------|  
  | **Default Justification**      | Must be actively earned                   | Presumptively granted                      |  
  | **Developmental Basis**        | Inductive learning                        | Pre-inductive entitlement                  |  
  | **LLM Epistemic Status**       | Reliability suffices                      | Not testimony (no intentionality)          |  
  | **Sincerity Necessary?**       | No (reliability sufficient)               | Yes (core to testimony)                    |  
  | **After Verification**         | Testimony discharged                      | Testimony remains foundational             |  

  ---  
  **Joint Conclusion:** We disagree on the *architecture of trust*: R sees it as bottom-up (track records → justification), AR as top-down (entitlement → defeat). Cases 1, 3, and 4 are pivotal. We commit to revisiting predictions after empirical work (e.g., developmental psychology on Crux 1, user studies on LLMs for Crux 3). The wine remains impartial.  

  *(Signatures)*  
  **— The Reductionist**  
  **— The Anti-Reductionist**  

  ---  
  **Note for Group:** Cases 2 and 5 are less decisive (both views can handle them). Case 3 (child development) is AR’s strongest battleground; Case 4 (LLM) forces R to defend non-intentional "testimony." Case 1 exposes the residual-dispute core.
