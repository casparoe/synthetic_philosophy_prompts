  The key constraints are:
  - Must use the Dimmer Dial case exactly as described
  - Cannot reference empirical data beyond the stipulations
  - Question must have three cumulative parts (conceptual distinction, case analysis, theory application)
  - Avoid stock objections while testing deep understanding

  For part (a), I'm considering how to frame the conceptual vs metaphysical distinction clearly. The phrasing should make students demonstrate why this matters for hedonism's viability - does it need a scalar quantity or not? I need to avoid presupposing hedonism requires scalar pleasure.

  For part (b), the Dimmer Dial analysis needs to center on whether it begs the question. The device's stipulations (continuity, modality-blindness, unchanged desires) create tension: it seems to demonstrate scalar pleasure but may simply assume what it proves. I should emphasize the "reports are not theoretically innocent" warning.

  For part (c), theory application should require strategic choice - students must pick two "strongest" accounts and show trade-offs in accommodating the case. This prevents mechanical matching of theories to objections.

  The model answer must:
  - Explicitly distinguish conceptual/metaphysical claims
  - Argue the Dial demonstrates metaphysical possibility but not conceptual coherence
  - Analyze how attitude/desire theories struggle with unchanged dispositions
  - Show how sensation/apparent-good theories fare better
  - Maintain rigorous focus on the thought experiment's boundaries

  The marking scheme requires precise allocation of 25 marks across specific analytical moves, with common errors anticipated. For example, conflating conceptual and metaphysical aspects in part (a) should carry heavy penalties.

  I'm structuring the question to build logically: first establish what's at stake (part a), then test with the case (part b), then examine theoretical fallout (part c). The wording will push students beyond summary into evaluation - "what it does and does not establish" is crucial phrasing.

  For the model answer, I'll have it argue the Dial suggests metaphysical unity is possible, but doesn't resolve whether we actually have a unified concept of pleasure. The theories will show different costs: attitude theories must abandon desire-independence, while sensation theories become implausible for non-sensory pleasures. This creates the desired dilemma.

  The marking scheme will penalize:
  - Failing to distinguish conceptual/metaphysical (3 marks)
  - Ignoring question-begging risk (4 marks)
  - Superficial theory application (3 marks per theory)
  - Violating thought experiment constraints

  This approach should satisfy the professor's goal of testing philosophical reasoning through novel case analysis while respecting all constraints.
answer: |-
  ### Final Examination: Philosophy of Pleasure and Pain  
  **Time Allowed:** 45 minutes  
  **Materials Allowed:** None (closed book)  
  **Total Marks:** 25  

  ---

  ### Essay Question  
  **The Heterogeneity Problem and the Dimmer Dial Thought Experiment**  

  Hedonism treats pleasure as a single, scalar quantity to be maximized. The heterogeneity objection argues that "pleasures" (e.g., sensory thrills, relief, intellectual satisfaction) share no common phenomenal or functional feature, rendering hedonism either vacuous (pleasure = "whatever we like") or parochial (privileging one type of pleasure).  
  You have studied five accounts of pleasure:  
  1. **Sensation Account**: Pleasure is a distinctive sensory quality.  
  2. **Attitude Account**: Pleasure is an attitude (e.g., liking) toward an experience.  
  3. **Desire Account**: Pleasure is the object of a desire to continue the experience.  
  4. **Hedonic-Tone Account**: Pleasure is a non-intentional "glow" attached to experiences.  
  5. **Apparent-Good Account**: Pleasure is the appearance of something as good.  

  Using **only** the stipulated details of the **Dimmer Dial** case below, address the following:  

  > **The Dimmer Dial Case**: A subject is fitted with a device that scales the *felt pleasantness* of all her experiences along a single, continuous scale. The scale ranges from a floor (total indifference) to a ceiling (intense pleasantness). The device:  
  > - Leaves sensory content, desires, functional dispositions, and the sequence of experiences **unchanged**.  
  > - Is **modality-blind** (one setting affects taste, pain relief, crossword-solving, etc. equally).  
  > - Is physically possible.  
  > *Assume the subject’s reports about the device are not theoretically innocent.*  

  **(a)** (8 marks)  
  Distinguish the *conceptual* claim of the heterogeneity objection (we lack a single concept uniting all pleasures) from its *metaphysical* claim (there is no single property shared by all pleasures). Explain why hedonism’s feasibility depends on which claim is at stake, and whether hedonism *requires* a single scalar quantity.  

  **(b)** (10 marks)  
  Does the coherence of the Dimmer Dial case resolve the heterogeneity objection? Reckon with the charge that the device *begs the question* (by presupposing a common currency) and the possibility that it does not. Conclude by stating what the case *does* and *does not* establish about the objection.  

  **(c)** (7 marks)  
  Select the **two strongest accounts** of pleasure from the unit. For each, explain whether it can accommodate the Dimmer Dial case and what it must give up to do so.  

  ---

  ### Model Answer (650 words)  
  **(a)** The heterogeneity objection targets hedonism’s assumption that diverse pleasures constitute a single, scalar quantity. Its *conceptual* claim denies that we possess a unified concept of pleasure covering all cases (e.g., no common descriptor applies equally to gustatory delight and cognitive relief). Its *metaphysical* claim denies that pleasures share an intrinsic property (e.g., no unitary neurobiological or phenomenological state). Hedonism requires a scalar quantity only if it is *substantive* (e.g., maximizing a natural property like hedonic tone); it need not if it is *formal* (e.g., maximizing "whatever is desired"). The objection devastates substantive hedonism if the metaphysical claim holds (no property exists to maximize). If only the conceptual claim holds, hedonism might survive by positing a property we fail to conceptualize coherently. Thus, hedonism’s prospects hinge on whether the objection is metaphysical (scalar quantity impossible) or conceptual (scalar quantity ineffable).  

  **(b)** The Dimmer Dial’s coherence suggests that a *metaphysically* unitary property of pleasantness is possible: a single, continuous parameter modulates all pleasures without altering their sensory, functional, or desiderative features. This challenges the heterogeneity objection’s metaphysical claim by demonstrating that diverse experiences *can* share a scalar property (pleasantness intensity) while retaining their heterogeneity in other respects. However, this does not resolve the *conceptual* claim. The device may beg the question by *stipulating* a common currency (scaled pleasantness) that the objection denies exists. Crucially, the subject’s reports—e.g., "every experience is now intensely pleasant"—are not theoretically innocent; they may reflect the *concept* "pleasantness" being imposed by the device or the experimenter, not an independently coherent concept. Thus, the case establishes the *metaphysical possibility* of a unitary scalar property underlying pleasure, but it does not establish that this property corresponds to a *pre-theoretical concept* we actually possess. It leaves open whether "pleasantness" is a parochial construct (e.g., the experimenter’s sensory bias) or a vacuous label for "whatever the dial amplifies."  

  **(c)**  
  **Attitude Account (Strongest #1)**: This account can accommodate the case only by sacrificing its core tenets. If pleasure is an attitude (e.g., "liking"), the dial’s unchanged desires/functional dispositions contradict its effects: a subject could report heightened pleasantness without increased desire to continue experiences (e.g., intensified "liking" of a headache’s throbbing without reduced aversion). To reconcile this, the account must abandon the link between pleasure and motivation, collapsing into vacuity ("pleasure is whatever the dial intensifies").  

  **Apparent-Good Account (Strongest #2)**: This account accommodates the case elegantly but becomes parochial. If pleasure is the appearance of an experience as good, the dial directly alters how "good" experiences seem (e.g., a headache appears intensely good at high settings). Since desires remain unchanged, however, the account must decouple "appearing good" from motivation. This preserves coherence but reduces "good" to a passive phenomenal quality, excluding its normative character. The account thus becomes a variant of hedonic-tone theory, vulnerable to the charge that it privileges sensory "seemings."  

  ---

  ### Marking Scheme (25 marks total)  
  #### **(a) Conceptual vs. Metaphysical Distinction** (8 marks)  
  - **2 marks**: Clearly distinguishes conceptual claim (no unified *concept* of pleasure) from metaphysical claim (no shared *property*).  
  - **3 marks**: Explains implications for hedonism:  
    - If *metaphysical* claim true → substantive hedonism (requiring scalar property) fails.  
    - If *conceptual* claim true → hedonism may posit ineffable scalar property.  
  - **2 marks**: Correctly notes hedonism *need not* be scalar if formal (e.g., desire-based) but *must* be if substantive.  
  - **1 mark**: Avoids assuming hedonism requires scalar quantity.  
    *Common errors:* Conflating conceptual/metaphysical claims (-2); asserting hedonism always requires scalar pleasure (-1); ignoring formal/substantive hedonism distinction (-2).  

  #### **(b) Dimmer Dial Analysis** (10 marks)  
  - **3 marks**: Identifies that the case challenges the *metaphysical* claim (shows scalar property is possible).  
  - **3 marks**: Engages the charge of question-begging (device presupposes common currency) and notes non-innocence of reports.  
  - **2 marks**: Concludes the case establishes metaphysical possibility but *not* conceptual coherence or pre-theoretical unity.  
  - **2 marks**: Limits conclusions to what is stipulated (e.g., no appeal to neuroscience).  
    *Common errors:* Claiming the case resolves the entire objection (-3); ignoring question-begging risk (-2); misrepresenting stipulations (e.g., "desires change") (-2).  

  #### **(c) Theory Application** (7 marks)  
  - **1 mark**: Selects two plausible "strongest" accounts (e.g., attitude + apparent-good).  
  - **For each account (3 marks per account)**:  
    - **1.5 marks**: Accurate explanation of accommodation (or not) given case stipulations.  
    - **1.5 marks**: Identifies what the account must give up to fit the case (e.g., attitude account severs pleasure-desire link).  
    *Common errors:* Choosing implausibly weak accounts (-1 per account); failing to use case stipulations (e.g., unchanged desires) (-1 per account); describing theory without engagement (-1 per account).  

  ---  
  **Note to Examiner:** Top answers will rigorously adhere to the case stipulations, avoid external empirical appeals, and demonstrate metacognitive awareness of the heterogeneity problem’s dual (conceptual/metaphysical) structure. Award partial credit for incomplete but reasoned steps.
