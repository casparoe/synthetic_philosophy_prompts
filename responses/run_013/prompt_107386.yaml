prompt: |-
  My friend and I have just spent two days arguing about who should get to vote on our community land trust's proposed sale of its last open parcel, and I want your read on where she will come down. She sits on the board, and her record on past membership questions is consistent: she voted to let renters and live-in caregivers vote, and also owner-occupiers who were behind on their ground-lease payments, but she voted against letting a former member who moved two blocks away yet still attends every meeting, a neighboring shopkeeper whose delivery access the sale would destroy, and a co-founder who now lives out of state and merely fundraises for the trust. Throughout the argument she kept saying the line is not who is touched but who is governed — that the demos is whoever the trust's decisions bind, not whoever they affect — while I kept insisting that a decision that can ruin a neighbor's livelihood ought to give that neighbor a say. The board now faces a new case: a household just outside the trust's boundary whose garden plot is leased from the trust and whose members are bound by the trust's bylaws, including its maintenance and dispute-resolution rules, but who do not live on the land. Predict how she will vote, identify the rule she is actually running, give the other rules that fit her past votes just as well, say which of them the new case separates, and name the further case I should put to her to force the issue.
reasoning: |-
  Hmm, this user presents a fascinating case study in democratic theory applied to a community land trust (CLT). They've been arguing with their board-member friend about voting rights criteria, and now want me to predict her vote on a specific case involving off-site gardeners bound by bylaws. 

  The core tension here is beautifully philosophical: "who is governed vs who is affected." The friend's position seems rooted in classical democratic theory where legitimacy comes from binding the governed, while the user leans toward participatory democracy where affected parties deserve voice. Both positions have merit, which makes this so thorny.

  Looking at the friend's voting pattern, I notice three consistent "no" votes that reveal her boundaries: the relocated member (geographic disconnection), the shopkeeper (affected but not governed), and the remote co-founder (governance without residence). Her "yes" votes all share actual subjection to CLT rules despite non-standard statuses. 

  For the garden plot case, I'm struck by how it perfectly straddles her criteria. These gardeners are geographically outside yet contractually bound - it's like testing whether "governed" requires spatial presence. Her past emphasis on binding rules suggests she'll see the bylaws as creating sufficient governance relationship, but that dispute-resolution clause is particularly persuasive. Still, the residence gap might trouble her.

  The user's request for "other rules" is smart - makes me examine if her pattern could fit alternative principles. Could it be about property rights? No, because she excluded the shopkeeper with tangible losses. About residency? No, since she included caregivers who may not own property. About legal obligation? Almost, but then why exclude the fundraising co-founder who presumably signed governance docs? Ah - that last exception reveals her rule requires current subjection to daily operational rules, not historical or symbolic ties.

  To force the distinction, I'd propose a hypothetical involving a non-resident subject to rules but without property stake - like a vendor bound by CLT sustainability standards. If she rejects them while accepting the gardeners, we'd know physical assets matter more than she claims. If she accepts both, her rule is purely contractual. Either way, the user gets their diagnostic tool.
answer: |-
  Based on your friend's stated principle ("who is governed, not who is affected") and her consistent voting pattern, here's the breakdown:

  1.  **Prediction for the Garden Plot Household:** She will vote **YES** to allow them to vote.
  2.  **The Rule She is Actually Running:** **"Formal, ongoing contractual obligation to abide by the CLT's binding operational rules."**
  3.  **Other Rules that Fit Her Past Votes (Equally Well):**
      *   **"Current legal subjection to the CLT's enforceable bylaws."**
      *   **"Directly bound by the CLT's day-to-day operational authority."**
      *   **"Holds a current, active legal relationship with the CLT involving reciprocal duties enforceable by the CLT."**
  4.  **Which Rule the New Case Separates:** The new case **separates the rule "Residence *on* the trust land"** from her core principle. Her past "no" votes could be interpreted as requiring residency. This case shows residency isn't the key factor for her; the key factor is being formally governed by the rules *regardless* of physical location.
  5.  **Further Case to Force the Issue:** Propose this scenario:
      *   **"A commercial tenant leasing a small building *within* the CLT's boundary. They are bound by the CLT's bylaws (maintenance standards, dispute resolution, use restrictions) and pay ground lease fees, but they are purely a business, not a resident. Should they vote?"**

  **Detailed Reasoning:**

  *   **Her Stated Principle:** "The demos is whoever the trust's decisions **bind**, not whoever they **affect**." This is a classic legal/contractual view of membership, focusing on who is directly subject to the CLT's authority.
  *   **Analysis of Past Votes:**
      *   **Yes (Included):** Renters (bound by lease/rules), Live-in Caregivers (likely bound by household rules/agreements), Owner-Occupiers behind on payments (still bound by ground lease/bylaws). All are directly *governed* by the CLT's operational rules.
      *   **No (Excluded):**
          *   Former member who moved away (no longer bound by rules, even if affected/engaged).
          *   Neighboring shopkeeper (affected, but no contractual obligation to follow CLT rules).
          *   Remote co-founder (may be affected, may have historical ties, may contribute, but likely *not* currently bound by day-to-day operational bylaws like maintenance or dispute resolution).
  *   **The Garden Plot Case:** This household fits her core principle perfectly:
      *   **Bound by Bylaws:** They are explicitly bound by the trust's maintenance and dispute-resolution rules. This is a direct, ongoing contractual obligation.
      *   **Formal Relationship:** They have a lease agreement, creating a formal legal relationship.
      *   **Governed, Not Just Affected:** The CLT's decisions (especially regarding the land they lease) directly *bind* them to certain actions and subject them to the CLT's authority for disputes/maintenance, even though they don't live *on* the land. The impact on their garden is secondary to their formal subjection.
      *   **Separates Residence:** This case clearly shows her "no" votes weren't *primarily* about geographic proximity (the shopkeeper was adjacent!) or even impact (the shopkeeper was highly impacted). Her "no" vote on the out-of-state co-founder likely hinged on the *lack of current binding operational rules*, not distance per se. The garden plot household, though off-site, *is* bound by operational rules.
  *   **Why the Commercial Tenant Case Forces the Issue:**
      *   It directly tests the boundary of "binding operational rules" vs. "residency" or "ownership".
      *   Like the gardener, the tenant is *on* CLT land (geographically inside), bound by bylaws (operationally governed), and has a lease (contractual obligation).
      *   The *only* difference is the nature of their occupancy (commercial vs. residential/garden).
      *   If she votes **YES**, she confirms her rule is purely **"bound by enforceable bylaws"**, regardless of resident status or purpose (residential, agricultural, commercial).
      *   If she votes **NO**, it reveals an *unstated* requirement for **"residential use"** or **"personal/household connection"** beyond just being governed by the rules. This would be inconsistent with including the off-site *residential* gardeners but excluding an on-site *commercial* entity equally bound by rules. It would force her to articulate why residential purpose matters when her stated principle is solely about being bound.

  **Conclusion:** Your friend has a coherent, principle-driven approach focused on formal governance rather than impact. The garden plot case aligns perfectly with her inclusion of those bound by rules (renters, caregivers, owners behind on payments) and her exclusion of those not bound (ex-member, shopkeeper, remote co-founder). Expect her to vote "yes". To truly test the limits of her principle and expose any hidden assumptions about residential purpose, pose the commercial tenant case.
