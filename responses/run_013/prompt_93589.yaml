prompt: |-
  I'm running a 90-minute session for a mixed group -- half econ grad students, half philosophy grad students -- on weakness of will vs. hyperbolic discounting, and I need you to plan how I teach it, not teach it yourself. What I care about most is that they leave able to tell the two apart, because right now they (and honestly, alot of the literature) use "akrasia" for anything where someone doesn't do what they said they'd do.

  So: what has to be in place before the distinction can even be stated -- the judgment/action gap first, or time-indexed preference first, or what -- and in what order, and why that order and not the reverse.

  For the carrying example I want to use a pair of cases I've been kicking around: (1) someone who's ranked finishing their thesis above everything else for years, sincerely and without wavering, and yet in the moment keeps not doing it; (2) someone whose ranking itself flips as the deadline gets close, so that at every moment they're acting on what they currently prefer -- no gap at the time, just a different person tomorrow. Then the alarm-clock case as the trap, since it can be read either way and I want them to feel that.

  Misconceptions I'm expecting: that akrasia just is procrastination; that hyperbolic discounting is a fancy word for impatience; that time-inconsistent preferences mean the agent is irrational; and something vague about willpower being a muscle that runs out. Which of those get formed earlier in the sequence, and exactly where do I head each one off?

  I also want the naive/sophisticated split in there -- the person who sees their own future reversal coming and plans around it versus the one who doesnt -- as the payoff. Where does it go, and why not earlier? And tell me what to leave out at this level and to actually say so out loud. Last thing: one question to ask at the end that shows whether they got the distinction, not whether they can repeat it.
reasoning: |-
  Okay, the user is running a 90-minute session for econ and philosophy grad students focusing on distinguishing weakness of will (akrasia) from hyperbolic discounting. They want a structured plan to teach this distinction effectively. Let me start by understanding their main concerns.

  First, the user mentions that both groups (and the literature) often misuse "akrasia" for any case where someone doesn't follow through. So the primary goal is clarity between the two concepts. They provided two cases: one where a person consistently values finishing their thesis but fails to act (akrasia), and another where preferences flip as deadlines approach (hyperbolic discounting). They also want to use the alarm-clock example as ambiguous to highlight the difference.

  Key misconceptions to address: conflating akrasia with procrastination, thinking hyperbolic discounting is just impatience, equating time-inconsistent preferences with irrationality, and the willpower-as-muscle idea. The user wants to know when and how to preempt these. Also, introducing naive vs. sophisticated agents as a payoff is crucial.

  I need to structure the session step by step. Start with the judgment-action gap, which is essential for akrasia. Without this, the distinction can't be made. Then introduce time-indexed preferences to contrast with hyperbolic discounting. Order matters because if you start with time preferences, students might interpret akrasia as a preference flip. Presenting akrasia first establishes the gap without time dynamics.

  The carrying cases: Case 1 (thesis) illustrates akrasia—consistent judgment but action gap. Case 2 (deadline) shows preference reversal over time. The alarm-clock case should come later to challenge them to apply both frameworks. This helps solidify the distinction through application.

  Misconceptions: Addressing early that procrastination isn't always akrasia. Hyperbolic discounting vs. impatience comes up when explaining exponential discounting. Time-inconsistent preferences don't imply irrationality; it's about structure, not logic. The willpower misconception might arise during akrasia discussion; clarify it's about judgment-action conflict, not depletion.

  Naive vs. sophisticated split should come after both concepts are clear. Introducing it earlier could confuse the core definitions. Use it as an application to show how understanding both models leads to different strategies.

  What to omit: Deep dives into philosophy debates (Socrates, Davidson) or technical discounting math. Mention this explicitly to keep focus.

  The final question needs to test application, not recall. Asking them to diagnose the alarm-clock case using both models forces synthesis and distinction.

  Potential pitfalls: Ensuring econ students don't reduce akrasia to preferences, and philosophy students don't dismiss discounting as irrelevant. Emphasize interdisciplinary dialogue. Timing each section is crucial; interactive elements like polls or discussions can maintain engagement and check understanding.

  Need to scaffold concepts carefully. Start with observable phenomena (people not doing what they intend), then build frameworks. Use relatable examples. Encourage discussion between the two disciplines to highlight different perspectives. Allocate time for Q&A to address lingering confusions.
answer: |-
  Here’s a battle-tested 90-minute plan focused on building the distinction step-by-step, targeting misconceptions, and ending with a diagnostic question. The order is designed to **scaffold concepts logically** and **prevent premature conflation**:

  ### Core Sequence (75 mins total)
  **PART 1: SETTING THE STAGE - THE PHENOMENON (10 mins)**  
  1.  **Start with the Observable:** "People often fail to do what they *say* they want to do, even sincerely. What are *your* everyday examples?" (Brief brainstorm).  
  2.  **Introduce the Term (Carefully):** "Philosophers often call this *akrasia* or weakness of will. Economists study related phenomena like procrastination. But are these *the same thing*? Today we dissect two fundamentally different explanations."  
      *   *Why this order?* Start with shared observation before jargon. Avoid defining "akrasia" rigidly upfront – that's the *goal* of the session.

  **PART 2: BUILDING AKRASIA (WEAKNESS OF WILL) (25 mins)**  
  3.  **The Judgment-Action Gap (Core Foundation):**  
      *   "Imagine an agent, *at a single moment in time*, holds a considered judgment: 'Doing X is best *now*.' Yet, they voluntarily do Y instead, knowing Y is worse."  
      *   **Use Thesis Case (1):** "For *years*, they judge 'Finishing my thesis is my top priority *right now*.' Yet, *in that very moment*, they scroll social media. Their *action* contradicts their *sincere, occurrent judgment* about what's best *now*."  
      *   **Emphasize:** *Simultaneity* of the conflicting judgment and action. No time delay is *essential* to the gap.  
      *   **Misconception Head-Off #1 (Akrasia=Procrastination):** "Is *all* procrastination like this? Could there be procrastination *without* this simultaneous gap? Hold that thought."  
      *   **Misconception Head-Off #2 (Willpower Muscle):** "Some explain this gap via depleted 'willpower.' While descriptively useful sometimes, our *formal* model of akrasia focuses purely on the *structure*: a failure to act on a conscious, occurrent best judgment *at t*."  
  4.  **Formalize Akrasia:** Define it as: **A voluntarily performed action Y at time t, where the agent consciously holds at t the all-things-considered judgment that X is the best action available at t, yet does Y instead.** Stress "at t".

  **PART 3: BUILDING HYPERBOLIC DISCOUNTING (30 mins)**  
  5.  **Introduce Time & Preference:** "Now imagine preferences *shifting* over time. How do we value future rewards/costs?"  
  6.  **Exponential Discounting (Baseline):** Briefly show constant discount rate (e.g., $100 today vs $110 tomorrow vs $121 in 2 days is consistent). Define "time-consistent preferences."  
  7.  **Hyperbolic Discounting (The Flip):**  
      *   Show how discounting is steeper for near-term delays (e.g., strongly prefer $100 today over $110 tomorrow, but indifferent between $110 in 365 days vs $121 in 366 days).  
      *   **Use Deadline Case (2):** "Months out: 'Finishing later is fine, I prefer leisure *now*.' As deadline looms (tomorrow!): 'Finishing *now* is suddenly urgent, leisure can wait!' Their *preference ranking itself changes* as time passes. The action (procrastinate earlier, work frantically later) *matches* their preference *at each moment*."  
      *   **Key Contrast:** "Where is the gap *at the time of action*? In Case 2, *at the moment they scroll*, they genuinely prefer scrolling to working! Tomorrow, they genuinely prefer working."  
      *   **Misconception Head-Off #3 (HD = Impatience):** "Impatience is high discounting. HD is *inconsistent* discounting – the *rate* changes dramatically based on temporal proximity."  
      *   **Misconception Head-Off #4 (HD = Irrational):** "HD agents *are* rational in a thin sense: they maximize utility given their *current* preferences. The 'irrationality' is dynamic inconsistency – their future self won't want what their past self planned." Contrast with akrasia's *intra*-temporal conflict.

  **PART 4: CONTRASTING & APPLYING (20 mins)**  
  8.  **Side-by-Side Comparison:**  
      *   Draw a 2x2 table: Rows = Case 1 (Thesis Gap), Case 2 (Deadline Flip). Columns = "Judgment/Aim at t" vs "Action at t" vs "Preference at t". Fill it in explicitly.  
      *   **Crucial Question:** "In which case is there a contradiction *within the agent's perspective at the single moment of action*?" (Answer: Only Case 1/Akrasia).  
  9.  **The Alarm Clock Trap:**  
      *   "You set an alarm for 6 am, sincerely intending to get up. When it rings, you hit snooze. Is this Akrasia or HD?"  
      *   **Force the Distinction:** Poll the room. Have small groups argue for *each* interpretation:  
          *   *Akrasia:* "At 6 am, you *judge* getting up is best *right now*, but you voluntarily hit snooze."  
          *   *HD:* "Last night, your 'evening self' preferred future work. At 6 am, your 'morning self' strongly prefers immediate sleep. Action matches *current* preference."  
      *   **Reveal:** "It's ambiguous! We need *more data* about the agent's state of mind *at 6 am*. Does the snooze-hitter *feel* like they *should* get up (Akrasia) or are they *content* with snoozing (HD)? This is why the distinction matters!"  
  10. **Payoff: Naive vs. Sophisticated (Why LAST?):**  
      *   "Now we understand the *problems* (Akrasia's internal conflict, HD's dynamic inconsistency), we can see solutions."  
      *   Naive HD: Doesn't foresee preference flip. Gets caught out (e.g., doesn't start thesis).  
      *   Sophisticated HD: *Foresees* future preference flip. Uses commitment devices (e.g., removes distractions, pays a penalty for missing deadline).  
      *   **Why not earlier?** Sophistication requires understanding the *core* HD model and its problem (dynamic inconsistency). Introducing it earlier risks conflating sophistication with "overcoming akrasia" or making HD seem like it *requires* irrationality.  
      *   **Contrast with Akrasia:** Can sophistication help? Maybe (e.g., commitment removes temptation), but the core problem is the *intra*-temporal failure, not inconsistent planning. Willpower models *might* apply here, but that's a separate mechanism.

  ### What to Explicitly Omit (Say This!) (5 mins)
  *   "We're skipping deep dives into: The philosophical debate over *whether* akrasia is possible (Socrates vs. Davidson), detailed utility functions beyond discount curves, neurobiological correlates of willpower, and most behavioral econ heuristics. Focus today is the *structural distinction* between these two models of failure."

  ### The Diagnostic Question (Final 5 mins)
  **Ask:** *"Imagine someone who, every Sunday, plans a healthy week of cooking but ends up ordering takeout most nights. They say, 'In the moment, I just really want takeout and don't feel like cooking.' Does this statement* **alone** *point more strongly towards Akrasia or Hyperbolic Discounting as the explanation? Why?"*

  *   **Why it works:**  
      *   It requires application, not definition regurgitation.  
      *   The key phrase is "**in the moment, I just really want...**". This explicitly signals the *absence* of a simultaneous conflicting judgment *at the time of action* ("don't feel like cooking" reinforces this).  
      *   **Correct Diagnosis:** This leans heavily towards **Hyperbolic Discounting**. Their action (ordering takeout) aligns with their stated preference *at t* ("I really want takeout now"). There's no indication of a simultaneous judgment *at dinnertime* that cooking would be better. The *planning* on Sunday reveals the dynamic inconsistency characteristic of HD.  
      *   **Trap Avoidance:** It prevents them from just saying "procrastination" or "akrasia" by default. They must engage with the agent's stated mental state *at the time of action*.

  ### Why This Sequence is Robust
  1.  **Phenomenon First:** Grounds the discussion in observable reality before theory.
  2.  **Akrasia Before Time:** Builds the core concept of the *intra*-temporal gap without complicating it with time dynamics. Starting with time preferences makes it incredibly hard *not* to interpret akrasia cases as preference shifts.
  3.  **Contrast Through Cases:** Using parallel cases (Thesis/Deadline) with identical surface behavior (procrastination) but different underlying structures forces the distinction.
  4.  **Ambiguity as Tool:** The Alarm Clock case isn't resolved; it's used to show why the distinction matters for diagnosis and intervention.
  5.  **Misconceptions Preempted Contextually:** Each is addressed *when* the relevant concept is introduced, using the contrast to clarify.
  6.  **Sophistication as Payoff:** Positioned as a *consequence* of understanding HD, not a core part of its definition.
  7.  **Diagnostic Question:** Tests the ability to *apply* the distinction to a novel statement focusing on the critical element (presence/absence of a conflicting judgment *at t*).

  This structure forces engagement with the *mechanism* of failure (gap vs. flip) rather than just the outcome (didn't do it). Good luck! The mix of econ and philosophy students should make for fantastic discussion.
