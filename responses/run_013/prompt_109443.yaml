prompt: |-
  I've been having the same argument with a colleague for about a year now and we've finally agreed to do the thing we should've done at the start, which is to write down where we actually stand. I need you to draft that document for us.

  The argument: I hold that an omission is a cause whenever the outcome counterfactually depends on it — same standing as a positive event, no lesser kind of causing reserved for absences — and that the reason we wince when someone says a failure to water killed the plant but shrug when someone says he killed it is a fact about us and not about causation. She holds that causation needs an actual connection between cause and effect, a process or a chain you could in principle trace, and that an absence has nothing to connect, so talk of omissions causing things is explanation dressed up as causation, or a covert way of saying a norm got broken.

  Draft the joint statement we could both sign. What do we actually agree on — about the cases, about what's at stake, about what we're even disagreeing about? Then the disagreements, each one worded so that the person who holds it would accept the wording; don't stack the deck on either side, thats the whole point. Then the cruxes, with a case or argument we'd both agree bears on each, and each of our predictions written down in advance. I suspect one crux is whether counterfactual dependence is enough for causation and another is whether "cause" is one thing at all.

  Three cases you have to run through, because they're where we go in circles: (a) the pair where one person unplugs a respirator and another declines to plug one in, same patient, same death; (b) an absence with no agent anywhere in it — a pressure valve that fails to open because a spring is missing, or a road that simply had no guardrail; (c) a case where the action and the omission look like the same event under two descriptions, like a goalkeeper who doesn't dive, or a surgeon who stands still for a minute.

  If part of what we're fighting about turns out to be just the word "cause," say which part and why. Numbered agreed-claims section first, then a table for the disagreements and the cruxes.
