  The cruxes need clear questions, like "Is counterfactual dependence sufficient for causation?" and "Is 'cause' a single concept?" For each, I'll include a test case both find relevant and their opposing predictions. The three specified cases (respirator, missing spring, goalkeeper) are crucial here—they're the battlegrounds.

