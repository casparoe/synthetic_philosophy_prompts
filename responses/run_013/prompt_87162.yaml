prompt: |-
  I'm a handling editor at a behavioral ecology journal and a big chunk of what I send out for review makes some version of the claim "trait T is an adaptation for function F" — sometimes with real data, sometimes it's basically a story with a figure attached. I'd like a checklist my referees can actually run on a manuscript in maybe half an hour, that tells them how much of the adaptation claim has been earned. The questions to ask in order (comparative/phylogenetic, heritability, developmental or structural analysis, optimality modelling, evidence of past selection, whatever else belongs on it), what counts as a sufficient answer to each, and where the procedure stops with a no instead of scoring the paper. Two things I really need it to do: separate "T is an adaptation" from "T is currently doing something useful" — I keep watching those two slide into each other in referee reports — and force a genuine spandrel check, i.e. could T just be a byproduct of something else that was under selection, or of a developmental/structural constraint, and what would the evidence look like if it were?

  Bake in that lots of these traits are known from one or two species, so "run the comparative method" is often just not available — say what the referee does then. And mark the steps where the referee is really making a judgment call rather than running a test, don't dress those up as procedure.

  Then run it on three hypothetical submissions: one on a bird alarm call claimed to be adapted for warning kin, one claiming a human psychological trait is an adaptation for some ancestral problem, and one from a cultural-evolution person claiming a social norm is an adaptation for group cohesion. Tell me where the checklist can't settle the matter and where it'll misfire, including a case where it gives an author an answer they won't like.
reasoning: |-
  We are creating a checklist for referees to evaluate claims of the form "trait T is an adaptation for function F". The checklist should help separate the claim that T is an adaptation (shaped by natural selection for F) from the claim that T is currently useful (performing F). It should also force consideration of alternative explanations (spandrels, byproducts, constraints). 

  The checklist should be structured as a series of questions, with clear stopping points (if a critical step fails, the claim is not supported). We must account for cases where comparative methods are not feasible (e.g., single-species studies). We should also note where the referee must use judgment.

  Steps (in order):

  1. **Functionality**: Is there evidence that T currently serves function F? (This is necessary but not sufficient for adaptation.)
     - Evidence: Experimental manipulation, observational data showing the trait in action, etc.
     - If no, then the adaptation claim fails (stop here). 
     - If yes, proceed.

  2. **Alternative Explanation - Current Byproduct/Constraint**: Could T be a byproduct of another trait or a structural/developmental constraint, and still perform F? What evidence rules this out?
     - Evidence: For example, if the trait is a necessary byproduct of development, or if it is found in contexts where F is not needed. 
     - Referee judgment: If there is strong evidence that T is a byproduct (e.g., it arises without any relation to F, or is a fixed aspect of development that cannot be altered by selection for F) then the adaptation claim is weakened. However, note that even byproducts can be co-opted (exaptation). 
     - If the evidence for byproduct/constraint is strong and there is no counterevidence, then the adaptation claim is not supported (stop). Otherwise, proceed.

  3. **Heritability/Genetic Basis**: Is there evidence that T has a heritable component? (Without heritability, selection cannot shape the trait.)
     - Evidence: Quantitative genetics (e.g., parent-offspring regression, twin studies), or molecular genetics. In cultural evolution, we might look for transmission mechanisms that allow selection to act.
     - If no, then the adaptation claim fails (unless the trait is a cultural trait and the paper is about cultural evolution, then we might adjust). 
     - Note: For cultural traits, we might replace heritability with 'cultural transmission' and stability. Proceed with caution.

  4. **Evidence of Past Selection**: Is there evidence that T has been under selection for F in the past?
     - This is the core of the adaptation claim.
     - Methods:
       - Comparative method (if multiple species): Look for correlated evolution between T and F across a phylogeny. If the trait is only known in one species, this is not possible.
       - Population genetics: Signatures of selection (e.g., reduced genetic variation, selective sweeps).
       - Fossil record: Changes in T over time in response to environmental changes related to F.
       - Optimality modeling: Does the trait perform F in an optimal way? (But note: optimality does not prove adaptation, it only shows that the trait is effective.)
     - If the paper lacks evidence of past selection and no alternative method is provided, then the adaptation claim is not supported (stop). 

  5. **Alternative Explanation - Phylogenetic Inertia/Constraint**: Could T be present because of shared ancestry (phylogenetic inertia) rather than adaptation for F? 
     - Especially if the trait is present in species that do not experience the selective pressure for F. 
     - Without comparative data, this is hard to rule out. Referee must use judgment: if the trait is present in a clade and the function F is only relevant in one species, then inertia is a possibility.

  6. **Spandrel Check (Developmental/Structural Byproduct)**: Could T be a byproduct of development or structure that was under selection for a different reason? 
     - Evidence: If T is a necessary consequence of a developmental process that is under selection for another function, then it might be a spandrel. 
     - How to check: Look for cases where T is invariant even when F is not needed, or if T is present in organisms that do not have F as a function. 
     - Referee judgment: If there is a plausible alternative developmental/structural explanation, then the burden is on the authors to rule it out.

  Given that many traits are known from one or two species, we have to adjust:

  - If comparative methods are not available, then steps 4 (evidence of past selection) must rely on other methods (e.g., population genetics, optimality, or detailed functional analysis showing design for F).

  Checklist Structure:

  1. **Current Functionality**:
     - Question: Is there robust evidence that trait T currently performs function F?
     - Sufficient evidence: Experimental manipulation (removing T and showing loss of F, or adding T and gaining F), strong correlation between T and contexts where F is needed, etc.
     - Insufficient: Anecdotes, untested assumptions.
     - If no: Stop. Claim not supported.

  2. **Byproduct/Constraint Check (Current)**:
     - Question: Could T currently be a byproduct of another trait or a structural/developmental constraint? Is there evidence against this?
     - Sufficient evidence: T is not linked to the development of other traits, or T can vary independently. If T is a necessary byproduct (e.g., the color of blood), then it's not an adaptation for F (though it might be co-opted). 
     - Judgment: If a plausible byproduct scenario exists and is not refuted, then the adaptation claim is weak. But we don't necessarily stop here because the trait might still be an exaptation (co-opted for F). However, for the claim of adaptation (shaped by selection for F), we require evidence that it was shaped for F.

  3. **Heritability/Transmission**:
     - Question: Is there evidence that T has a heritable basis (or, for cultural traits, is transmitted and modifiable by selection)?
     - Sufficient evidence: Quantitative genetics, breeding experiments, or for cultural traits: longitudinal studies showing transmission and change.
     - If no: Stop. Natural selection cannot act without heritable variation.

  4. **Evidence of Past Selection**:
     - Question: Is there evidence that T has been under historical selection for F?
     - Methods (choose applicable):
       - Comparative: Correlated evolution of T and F across phylogeny (if multiple species).
       - Population genetics: Signatures of selection (e.g., Tajima's D, Fst outliers, etc.).
       - Optimality: Does T perform F in a way that is optimal or near-optimal? (Note: This is not direct evidence but consistent with adaptation.)
       - Fossil/Historical: Changes in T over time in response to changes in F-related pressures.
     - If none of these are provided and the study is on a single species, then the referee must note that the evidence for adaptation is weak. However, we don't necessarily stop because the paper might still present a good case for current function. But the adaptation claim is unearned.

  5. **Phylogenetic Inertia/Constraint**:
     - Question: Could T be present due to shared ancestry (and not adaptation for F in the focal species)? 
     - Without comparative data, this is hard. Referee judgment: If the trait is widespread in the clade and F is only relevant in the focal species, then inertia is a concern.

  6. **Developmental/Structural Spandrel Check**:
     - Question: Could T be a byproduct of development or structure that was under selection for a different function? 
     - Evidence: If T is invariant and tied to a developmental pathway under selection for another reason, then it might be a spandrel.
     - Referee judgment: Look for evidence that T is not a necessary byproduct, or that it has been modified by selection for F.

  Now, we run the checklist on three hypothetical submissions:

  **Case 1: Bird alarm call adapted for warning kin**
  - Trait T: Specific acoustic properties of an alarm call.
  - Function F: Warning close relatives (kin).

  Checklist:
  1. **Current Functionality**: Evidence that the alarm call is given in the presence of predators and that kin are warned? (e.g., playback experiments showing kin respond appropriately). Likely present. Proceed.
  2. **Byproduct/Constraint (Current)**: Is the call a byproduct of, say, general stress vocalizations? If the call is acoustically distinct and only given in predator contexts, then it's less likely. Proceed.
  3. **Heritability**: Are there individual differences in the call? Is there evidence of heritability? (e.g., cross-fostering studies). If not, might be a problem. But birdsong often has learned components. If the trait is learned, then we consider cultural transmission. Proceed with caution.
  4. **Past Selection**: 
     - Comparative: If data from multiple species, show that species with kin-based groups have these calls? (But if only one species, skip).
     - Population genetics: Not typical for this trait. 
     - Optimality: Does the call structure minimize detection by predators while maximizing kin recognition? (e.g., directional patterns). This might be presented.
     - Without comparative data, the evidence for past selection might be weak. The referee would note that the adaptation claim is not fully supported without evidence of historical selection. 
  5. **Phylogenetic Inertia**: If the call is present in non-kin-based species, that would be a problem. Without comparative data, hard to rule out. 
  6. **Developmental Spandrel**: Is the call a byproduct of the bird's vocal apparatus? If the call is species-specific and developmentally fixed, but that doesn't rule out adaptation. 

  Conclusion: The claim of adaptation for warning kin might rest on current function and optimal design, but without evidence of past selection (and with possible cultural transmission) the adaptation claim might be weak. The referee would note that the authors have shown current function but not necessarily that it is an adaptation.

  **Case 2: Human psychological trait as an adaptation for an ancestral problem**
  - Trait T: Say, fear of snakes.
  - Function F: Avoiding venomous snakes in ancestral environments.

  Checklist:
  1. **Current Functionality**: Evidence that fear of snakes leads to avoidance and increases survival? (e.g., experiments showing faster detection of snakes, or self-reports of avoidance). Likely. Proceed.
  2. **Byproduct/Constraint**: Could it be a byproduct of a general fear response? If fear is specific to snakes (more than to other stimuli) then less likely. Proceed.
  3. **Heritability**: Twin studies showing heritability of snake fear? Or is it learned? (Likely a mix). Without heritability evidence, the adaptation claim is weakened. 
  4. **Past Selection**:
     - Comparative: Not applicable (only humans).
     - Population genetics: Hard to do. Maybe if there is a known gene associated with snake fear and it shows signatures of selection? Unlikely.
     - Optimality: Does the fear response optimally avoid snakes? (e.g., appropriate balance between false positives and negatives). This might be argued.
     - Fossil/Historical: No direct evidence.
     - Without strong evidence, the past selection step is weak.
  5. **Phylogenetic Inertia**: Not applicable (only one species).
  6. **Developmental Spandrel**: Could fear of snakes be a byproduct of general aversive conditioning? If the trait emerges without direct experience (e.g., in infants), then it might be innate. But still, without evidence of selection, it's hard.

  Conclusion: The claim of adaptation is difficult to support because of the lack of evidence for past selection and heritability. The referee would note that the trait may be an evolved fear module, but the evidence is circumstantial.

  **Case 3: Cultural evolution - social norm as an adaptation for group cohesion**
  - Trait T: A specific social norm (e.g., sharing food).
  - Function F: Promoting group cohesion.

  Checklist adjustment for cultural evolution:
  - We replace heritability with cultural transmission and stability.
  - Past selection might be cultural group selection.

  1. **Current Functionality**: Evidence that the norm promotes group cohesion? (e.g., experiments or observational studies showing groups with the norm are more cohesive). Proceed if yes.
  2. **Byproduct/Constraint**: Could the norm be a byproduct of, say, economic necessity? (e.g., sharing because of immediate reciprocity). If the norm is enforced even when not necessary, then it might be for group cohesion. Proceed.
  3. **Cultural Transmission**: Is the norm transmitted socially? Evidence of learning, teaching, or imitation. If not, stop. But likely present.
  4. **Past Selection (Cultural Evolution)**:
     - Comparative: Compare groups with and without the norm? (But note: groups are not phylogenetically independent). 
     - Historical: Changes in the norm in response to group cohesion needs? 
     - Modeling: Does the norm conform to predictions of cultural group selection models? (e.g., punishment of non-cooperators).
     - Without historical or comparative evidence, the past selection step is weak.
  5. **Phylogenetic Inertia**: Not applicable (unless the norm is inherited from ancestral cultures and not adaptive now).
  6. **Developmental Spandrel**: Could the norm be a byproduct of individual-level psychology? (e.g., a norm of sharing because of evolved psychology for reciprocity). Then it might not be a group-level adaptation. 

  Conclusion: The adaptation claim (for group cohesion) might be supported by current function and transmission, but evidence of past cultural group selection is needed. Without that, it might be a byproduct of individual-level adaptations.

  Where the checklist misfires:
  - In the cultural evolution case, the checklist might be too focused on genetic heritability and not flexible enough for cultural transmission. We adjusted step 3 for that.
  - In the human case, the lack of methods to study past selection might make it impossible to fulfill step 4, leading to rejection of adaptation claims even when they are plausible. This might be a limitation of the field.

  Case where the author gets an answer they don't like: 
  - A paper on a bird alarm call that has strong evidence of current function (warning kin) but no evidence of heritability (if the call is entirely learned and varies arbitrarily) and no evidence of past selection (because it's a recent cultural innovation). The checklist would stop at step 3 (heritability/transmission) if they can't show that the trait is transmitted and modifiable by selection? But note: for cultural traits, we allow cultural transmission. However, the adaptation claim (by natural selection) might require genetic heritability. This is a gray area. The referee might say: the trait is a cultural adaptation (if we define adaptation broadly) but not a genetic one. The authors might not like that distinction.

  Final Checklist:

  **Referee Checklist: Adaptation Claims**

  **Manuscript Claim**: Trait T is an adaptation for function F.

  **Instructions**: Proceed in order. If a step fails, note the failure and stop or weaken the claim accordingly. Use judgment where indicated.

  1. **Current Functionality**:
     - Is there robust evidence that T currently serves F?
     - Sufficient evidence: Experimental manipulation, strong observational correlation in relevant contexts.
     - Insufficient: Anecdotes, untested assumptions.
     - Referee decision: If no, the adaptation claim fails. Stop. If yes, proceed.

  2. **Byproduct/Constraint Check (Current)**:
     - Is there a plausible alternative that T is a byproduct of another trait or a constraint? What evidence refutes this?
     - Judgment: If a strong byproduct scenario is not refuted, note that T might be an exaptation (co-opted for F) but not an adaptation. This weakens the adaptation claim but does not necessarily stop the process.

  3. **Heritability/Transmission**:
     - For genetic traits: Is T heritable? (Evidence: quantitative genetics, breeding experiments, etc.)
     - For cultural traits: Is T culturally transmitted and modifiable? (Evidence: transmission studies, longitudinal change)
     - If no, then natural selection cannot act. The adaptation claim fails. Stop.

  4. **Evidence of Past Selection**:
     - Is there evidence that T has been under historical selection for F?
     - Methods (check all that apply and evaluate strength):
       - Comparative (if multiple species): Correlated evolution of T and F across a phylogeny (with controls). *If not feasible, skip.*
       - Population genetics: Signatures of selection (e.g., Tajima's D, Fst, etc.). 
       - Optimality: Does T perform F in a way that is optimal? (Note: consistent with but not proof of adaptation.)
       - Fossil/Historical: Changes in T over time in response to changes in F-related pressures.
     - Judgment: If none of the above are provided (or are weak) then the evidence for adaptation is weak. The claim of adaptation is not earned. Proceed but note the weakness.

  5. **Phylogenetic Inertia/Constraint**:
     - Could T be present due to shared ancestry and not adaptation for F? (Especially if the trait is widespread in the clade and F is only relevant in the focal species.)
     - Without comparative data, this is hard to assess. Judgment: If the trait is present in species without F, it weakens the claim.

  6. **Developmental/Structural Spandrel Check**:
     - Could T be a byproduct of development or structure under selection for a different function? 
     - Evidence: T is invariant and tied to a developmental pathway, or appears in contexts without F.
     - Judgment: If a plausible spandrel scenario exists and is not refuted, then the adaptation claim is weakened.

  **Overall Assessment**:
  - If all steps are passed with strong evidence, the adaptation claim is well supported.
  - If critical steps (1, 3) are passed but others are weak, the claim is possible but not fully supported.
  - If step 4 (past selection) is weak, the claim of adaptation is not earned.

  Note: The claim "T is an adaptation for F" requires evidence of historical selection. Without that, the trait might be an exaptation (co-opted for F) or simply currently functional.
answer: |-
  Below is a comprehensive, referee-friendly checklist for evaluating adaptation claims in behavioral ecology manuscripts. It prioritizes efficiency (usable in ~30 minutes), clearly separates "adaptation" from "current utility," forces consideration of spandrels/byproducts, and accommodates single-species studies. Judgment calls are explicitly flagged. The checklist is structured as a **sequential workflow**: if a critical step fails, the adaptation claim is unsupported, and referees can stop their evaluation early.

  ---

  ### **Checklist for Adaptation Claims: "Trait T is an adaptation for Function F"**
  **Instructions for Referees:**  
  - Proceed step-by-step. Stop at any "STOP" point if evidence is insufficient.  
  - "Judgment call" steps are marked ⚠️; use your expertise but avoid overreach.  
  - For single-species studies, skip comparative steps (noted below).  
  - **Core distinction**: "Currently useful" ≠ "Adaptation." Adaptation requires evidence of historical selection *for F*.

  ---

  #### **Step 1: Current Functionality (Necessary but Not Sufficient)**  
  **Question:** Is there robust evidence that T *currently* performs F?  
  - **Sufficient evidence**:  
    - Experimental: Manipulating T disrupts F (e.g., T removal/alteration reduces F).  
    - Observational: Strong correlation between T and F in ecologically relevant contexts (e.g., T expression predicts F outcomes).  
  - **Insufficient evidence**:  
    - Anecdotes, untested assumptions, or F inferred solely from T's structure.  
  - **Judgment call?** No (objective test).  
  - **Decision**:  
    - ✅ **Proceed** if evidence is robust.  
    - ❌ **STOP** if weak/absent. Claim fails; T may be useful but not necessarily an *adaptation*.  

  ---

  #### **Step 2: Spandrel/Byproduct Check (Current Causality)**  
  **Question:** Could T be a byproduct of another trait/constraint, not selection *for F*?  
  - **Key tests**:  
    - Is T linked to a developmental pathway, structural constraint, or non-F trait?  
      - *Example*: Bird plumage color arising from diet (not selection for camouflage).  
    - Does T persist when F is irrelevant? (e.g., trait expressed in environments without F's selective pressure).  
  - **Evidence to refute spandrel**:  
    - T is decoupled from the proposed constraining system (e.g., T varies independently).  
    - Experimental: Disrupting the proposed "parent trait" does not affect T.  
  - **Judgment call?** ⚠️ Yes (assess plausibility of alternatives).  
  - **Decision**:  
    - ✅ **Proceed** if spandrel is ruled out or unlikely.  
    - ⚠️ **Flag weakness** if evidence is equivocal. Adaptation claim requires stronger support.  
    - ❌ **STOP** if T is demonstrably a byproduct (e.g., T is invariant and tied to a constraint).  

  ---

  #### **Step 3: Heritability/Transmission (For Evolvability)**  
  **Question:** Is there evidence that T can respond to selection?  
  - **Sufficient evidence**:  
    - Genetic traits: Heritability estimates (e.g., parent-offspring regression, QTL studies).  
    - Cultural traits: Transmission fidelity (e.g., longitudinal data showing social learning).  
  - **Insufficient evidence**:  
    - Phenotypic variation alone (without inheritance mechanism).  
  - **Judgment call?** ⚠️ Partially (e.g., inferring heritability from related traits).  
  - **Decision**:  
    - ✅ **Proceed** if supported (or if cultural, skip to Step 4b).  
    - ❌ **STOP** if absent. Selection cannot shape T without inheritance.  

  ---

  #### **Step 4: Evidence of Past Selection (Core of Adaptation Claim)**  
  *For non-cultural traits:*  
  **Question (4a):** Is there evidence of historical selection *for F*?  
  - **Methods (use any applicable; rank strongest to weakest)**:  
    1. **Optimality modeling**: T achieves F optimally (e.g., minimizes costs, maximizes efficiency).  
       - *Sufficient*: Quantitative match between T and model predictions.  
       - *Insufficient*: Qualitative/story-based "optimality."  
    2. **Population genetics**: Signatures of selection (e.g., dN/dS ratios, Tajima's D).  
    3. **Comparative analysis (if multi-species)**:  
       - Correlated evolution of T and F across phylogeny (e.g., PGLS).  
    4. **Paleo/historical data**: T changes track historical F-relevant pressures.  
  - **For single-species studies**:  
    - Comparative methods **not available**. Rely on optimality, genetics, or developmental constraints (Step 2).  
  - **Judgment call?** ⚠️ Yes (e.g., weighing quality of optimality models).  
  - **Decision**:  
    - ✅ **Strong support** if ≥1 robust line of evidence.  
    - ⚠️ **Weak support** if indirect (e.g., optimality alone). Adaptation claim is tentative.  
    - ❌ **STOP** if absent. T is not an adaptation for F (may be co-opted/exaptation).  

  *For cultural traits (replace 4a with 4b):*  
  **Question (4b):** Is there evidence of cultural selection *for F*?  
  - **Methods**:  
    - Group-level selection: T increases group fitness (e.g., cohesion → survival).  
    - Transmission biases: T is modified toward F (e.g., norm enforcement reduces defectors).  
  - **Decision**:  
    - ✅ **Proceed** if group-level benefits or selective transmission shown.  
    - ❌ **STOP** if T is arbitrary drift or individual-level only.  

  ---

  #### **Step 5: Phylogenetic Inertia/Constraint (If Comparative Data Available)**  
  **Question:** Could T exist due to ancestry (not adaptation for F)?  
  - **Tests**:  
    - T is present in species without F-selective pressures.  
    - Phylogenetic signal > adaptive signal (e.g., T evolves slower than F-relevant ecology).  
  - **For single-species studies**: Skip (not applicable).  
  - **Judgment call?** ⚠️ Yes (interpreting phylogenetic patterns).  
  - **Decision**:  
    - ✅ **Proceed** if inertia is unlikely (e.g., T-F correlation persists after phylogeny correction).  
    - ⚠️ **Flag weakness** if inertia is plausible.  
    - ❌ **STOP** if T is better explained by ancestry than F-adaptation.  

  ---

  #### **Step 6: Developmental/Structural Spandrel Deep Dive (If Step 2 Uncertain)**  
  **Question:** Could T be a fixed byproduct of development/structure?  
  - **Evidence for spandrel**:  
    - T is invariant across contexts where F is irrelevant.  
    - T arises inevitably from developmental pathways (e.g., allometric scaling).  
  - **Evidence against spandrel**:  
    - T is modular (evolves independently from proposed "parent" trait).  
    - T shows adaptive plasticity (e.g., changes with F-relevant environments).  
  - **Judgment call?** ⚠️ Yes (developmental biology expertise helpful).  
  - **Decision**:  
    - ✅ **Proceed** if spandrel unlikely.  
    - ❌ **STOP** if T is clearly a constraint.  

  ---

  ### **Applying the Checklist to Hypothetical Submissions**

  #### **Case 1: Bird Alarm Call "Adapted for Warning Kin"**  
  - **Trait T**: Acoustic structure of call.  
  - **Function F**: Warning close relatives.  
  - **Checklist Outcome**:  
    1. **Current Functionality**: Likely pass (playback experiments show kin respond).  
    2. **Spandrel Check**: Pass (call is predator-specific, not a general stress byproduct).  
    3. **Heritability**: Pass (twin studies show genetic component).  
    4. **Past Selection (4a)**:  
       - Optimality: Pass if call minimizes predator detection while maximizing kin recognition.  
       - Comparative: Fail (single-species study; not available).  
       - **Verdict**: Weak support. Adaptation claim not fully earned (no selection evidence beyond optimality).  
    5. **Phylogenetic Inertia**: Skipped (single-species).  
    6. **Developmental Spandrel**: Pass (no evidence of fixed developmental constraint).  
  - **Conclusion**: Paper shows current utility and design, but adaptation claim is **weak** due to lack of historical evidence. Referee recommends rejecting "adaptation" wording; reframe as current function.  

  ---

  #### **Case 2: Human Psychological Trait "Adapted for Ancestral Problem"**  
  - **Trait T**: E.g., aversion to incest.  
  - **Function F**: Avoid inbreeding depression.  
  - **Checklist Outcome**:  
    1. **Current Functionality**: Pass (observations show avoidance behavior).  
    2. **Spandrel Check**: ⚠️ Judgment call. Could be byproduct of general disgust; weak evidence.  
    3. **Heritability**: ⚠️ Pass/Fail ambiguous (twin studies conflicted; cultural influences).  
    4. **Past Selection (4a)**:  
       - Comparative: Fail (humans only).  
       - Optimality: Fail (no model; just-so story).  
       - Genetics: Fail (no selection signatures).  
       - **Verdict**: STOP. No evidence of past selection.  
  - **Conclusion**: Adaptation claim **fails**. Trait may be useful or a spandrel of disgust systems. Referee rejects adaptation claim; suggests alternative explanations.  

  ---

  #### **Case 3: Cultural Norm "Adapted for Group Cohesion"**  
  - **Trait T**: E.g., food-sharing norm.  
  - **Function F**: Promote group cohesion.  
  - **Checklist Outcome**:  
    1. **Current Functionality**: Pass (experiments show norm increases cohesion).  
    2. **Spandrel Check**: ⚠️ Judgment call. Could be byproduct of reciprocity norms; evidence mixed.  
    3. **Heritability**: Pass (cultural transmission shown).  
    4. **Past Selection (4b)**:  
       - Group-level selection: Fail (no data showing groups with norm outcompete others).  
       - Transmission biases: Pass if norm is enforced/modified to enhance cohesion.  
       - **Verdict**: Weak support (cohesion benefits may be side effect).  
    5. **Developmental Spandrel**: Pass (no fixed constraint).  
  - **Conclusion**: Adaptation claim **weak**. Norm is transmitted and useful, but no evidence of cultural selection *for F*. Referee requests rewording to "currently functional" or tests of group selection.  

  ---

  ### **Where the Checklist Succeeds and Fails**  
  - **Settles the matter**:  
    - Clearly distinguishes adaptation from current utility (Steps 1 vs. 4).  
    - Forces spandrel checks (Step 2/6) and stops unsupported claims (e.g., Case 2).  
  - **Cannot settle (judgment calls)**:  
    - Plausibility of spandrels (Step 2) in single-species studies.  
    - Optimality as evidence of past selection (Step 4a; can be teleological).  
  - **Misfires/limitations**:  
    - **False negative on exaptations**: A trait co-opted for F (e.g., feathers for flight) may fail Step 4 if original selection unknown.  
    - **Cultural misfire**: In Case 3, group selection is hard to prove; checklist may be too strict.  
    - **Gives authors "bad news"**: In Case 1, a well-studied trait fails adaptation claim due to lack of historical evidence. Authors must accept weaker wording or collect new data.  
  - **Improvements**:  
    - For single-species studies, emphasize optimality/population genetics.  
    - Add "exaptation" as a recommendation where appropriate.  

  This checklist provides a structured, evidence-based workflow for referees, ensuring adaptation claims are rigorously evaluated while respecting practical constraints.
