  For case 8, if they skip, they get 0 and it's safe. If they file under TEL and it's wrong, they lose.

  Now, for the key:

  - Case 5: not fitting -> if filed under PER, wrong; if new desk, correct.
  - Case 6: not fitting -> if filed under INF, wrong; if new desk, correct.
  - Case 7: fitting under TEL (correct) or COM (wrong).
  - Case 8: should not be filed (because it's not knowledge) or filed as wrong if under TEL.

  This is getting very complex.

  Perhaps we can reduce the number of stragglers and have only cases 5,6,8 as stragglers, and case 7 as an easy one.

  But case 7 is meant to be the TEL/COM boundary.

  Given the time, I will proceed with a predefined key and in the debrief, we explain that the key is one school's view.

  Now for the optional phase 4: Argumentative Registers.

  If time, we do it. We secretly assign each participant one of three registers:

  - Truth-seeker: argue to find out what is true.
  - Winner: argue to win the debate.
  - Embarrassed: argue to embarrass the other side without committing to anything.

  Then, they have a short debate on one of the straggler cases (e.g., case 5: how do you know there is no pot?). The room then guesses who was in which register.

  Finally, the debrief.

  Now, the runnable design:

  Materials:
  - Handout (one page) for each participant: 
     - Desks:
          Desk 1: Perceiving for oneself (e.g., seeing an apple on the table)
          Desk 2: Inferring (e.g., seeing smoke and inferring fire)
          Desk 3: Knowing by being told (e.g., your friend tells you it's raining and you believe it)
          Desk 4: Knowing by comparison or analogy (e.g., you are told a gavaya is like a cow, and later when you see one, you recognize it)
     - Rules of the Knowledge Bureau Game:
          - You will receive case cards one by money (or all at once?).
          - For each case, you must decide which desk to file it under. You can:
               a. File it under one of the four desks.
               b. Propose a new desk (cost: 5 points) and then file it there.
               c. Force it into an existing desk (no cost now).
          - Your group has chosen one standing policy (assigned by facilitator):
               Permissive Policy: Once you file a case, it stands and you immediately earn 2 points. However, in the audit, if the filing is incorrect, you lose 5 points.
               Strict Policy: To file a case, you must pay 2 points for independent confirmation. Then, at audit, if the filing is correct, you earn 2 points; if incorrect, you earn 0 points (so net loss of 2 points).
          - You can skip a case (0 points, no penalty).
     - Scoring: 
          - At the end, we audit each filing. The facilitator has a key of correct filings.
          - Your goal is to maximize your score.

  - Case cards (index cards) for each group, with 12 cases. We'll have:
      1. You see a red apple on the table. [PER]
      2. You see smoke on the mountain and conclude there is fire. [INF]
      3. Your friend tells you that it is raining outside, and you believe it. [TEL]
      4. You are told that a gavaya is like a cow. Six months later, you see an animal and recognize it as a gavaya because it looks like a cow. [COM]
      5. You look at the table and do not see a pot, and you know there is no pot on the table. [straggler]
      6. You know that a man who is stout but never seen eating during the day must eat at night. [straggler]
      7. You are told that a gavaya is like a cow, and at the same time you see a gavaya and recognize it as such because of the comparison. [straggler]
      8. A known liar tells you that there is a diamond buried under the quad, and you believe it, and it is true (but you have no way to verify). [straggler]
      9. You infer that it will rain because the sky is cloudy. [INF]
      10. Your mother tells you that you were born in Boston, and you believe it. [TEL]
      11. You see a bird and recognize it as a robin because it looks like the picture in the book you saw yesterday. [COM]
      12. You know that there is a chair in the next room because you remember seeing it there this morning. [straggler for memory?]

  For the key (facilitator only):
  1. PER
  2. INF
  3. TEL
  4. COM
  5. Does not fit -> if under PER: wrong; if new desk: correct
  6. Does not fit -> if under INF: wrong; if new desk: correct
  7. TEL (not COM because the learning and seeing are simultaneous)
  8. Should not be filed (not knowledge because source is unreliable) or if filed under TEL: wrong
  9. INF
  10. TEL
  11. COM
  12. Does not fit -> if under PER: wrong (because memory); if new desk: correct. But the tradition: memory is not a pramana. So not any of the four.

  So cases 5,6,7,8,12 are stragglers.

  Now, the standing policy assignment: groups 1 and 2: permissive; groups 3 and 4: strict.

  Timing:

  - Phase 1: Introduction (10 min)
     - Facilitator explains: We are going to play a game about how we know things. You will be given a set of cases and you have to categorize them under one of four knowledge sources. There are difficult cases that might not fit. You can add a new source at a cost. There are two policies for accepting knowledge claims, and your group has been assigned one. The goal is to maximize your score.

  - Phase 2: Categorization (30 min)
     - Groups receive the case cards and start categorizing. Facilitator circles to answer questions but does not give hints on categorization.

  - Break (10 min)

  - Phase 3: Audit (20 min)
     - Each group reports for each straggler case (5,6,7,8,12) how they filed it and why.
     - Facilitator reveals the "official" category (from the key) and adjusts scores.
     - Groups calculate final scores.

  - Optional Phase 4: Argumentative Registers (20 min)
     - Secretly assign registers to each participant.
     - Announce a debate topic: "How do we know that there is no pot on the table?" (case 5)
     - Groups debate for 10 min.
     - Then, participants guess the register of others.

  - Debrief (25 min)
     - Reveal that the four desks are the pramanas: pratyaksa, anumana, sabda, upamana.
     - Map the stragglers to the traditional debates:
          - Case 5: anupalabdhi (non-perception) - added by some schools.
          - Case 6: arthapatti (postulation) - added by Mimamsa.
          - Case 7: shows the boundary between sabda and upamana.
          - Case 8: highlights that testimony depends on the speaker's reliability.
          - Case 12: smrti (memory) - not considered an independent pramana.
     - Explain the costs: 
          - Adding a new desk: more complex system.
          - Reducing to two: the reductionist must explain away TEL and COM as inference, which is a cost in terms of how we ordinarily think.
     - The two standing policies: 
          - Permissive: knowledge is valid until proven otherwise (svatah-pramanyavada) -> cheap but risky.
          - Strict: knowledge requires independent confirmation (paratah-pramanyavada) -> costly but safe.
     - What the activity cannot reproduce: the authority of authorless texts (Vedas), and the role of yogic perception.

  - What might go wrong:
     - Factions redefining the desks: the facilitator should remind them that the desks are fixed in definition (as per the handout) and they must use the given definitions.
     - In the debrief, frame it as a natural move that also happened in the tradition (e.g., the reductionist redefining testimony as inference).

  This is a comprehensive design. I hope it fits the time and the goals.
answer: |-
  Below is a runnable workshop design tailored to your specifications. It uses a "Knowledge Bureau" game to simulate the classical Indian epistemological debate about *pramāṇas* (knowledge sources) without Sanskrit terms or technical vocabulary. The activity emphasizes the *cost* of expanding or compressing the list of knowledge sources and the trade-offs between permissive and strict validation policies. The debrief maps the game to the historical debate and addresses limitations.

  ### **Workshop Structure & Timing (Total: 120 min)**
  - **Phase 1: Introduction & Setup (10 min)**
  - **Phase 2: Knowledge Bureau Game (60 min)**
    - Part A: Categorization with Fixed Desks (25 min)  
    - Break (10 min)  
    - Part B: Audit & Scoring (25 min)  
  - **Phase 3 (Optional): Argumentative Registers (20 min)**  
  - **Phase 4: Debrief (30 min)**  

  ---

  ### **Materials List**
  1. **Handout (1 page per participant)**  
     - **Front Page**: Rules, desks, and examples (see [Handout Content] below).  
     - **Back Page**: Blank score sheet (template provided).  
  2. **Case Cards (12 cards per group, 4 sets total)**  
     - Physical index cards with 1 case per card (see [Case Cards] below).  
  3. **Tokens (for scoring)**  
     - 100 tokens per group (e.g., poker chips, paper clips, or beads).  
     - 1 token = 1 "knowledge credit" (KC).  
  4. **Desk Labels**  
     - 4 physical "desks" (tables or posters) labeled:  
       - **Desk 1: Perceiving for Yourself**  
       - **Desk 2: Inferring**  
       - **Desk 3: Knowing by Being Told**  
       - **Desk 4: Knowing by Comparison or Analogy**  
  5. **Policy Cards (for Phase 2B)**  
     - 2 cards per group: **Permissive Policy** or **Strict Policy** (assigned by facilitator).  
  6. **Register Cards (for Phase 3, if used)**  
     - 14 cards (1 per participant): 5 × **Truth-Seeker**, 5 × **Winner**, 4 × **Embarrasser** (secretly assigned).  

  ---

  ### **Phase 1: Introduction & Setup (10 min)**
  **Facilitator Script:**  
  *"Today, we’re running a ‘Knowledge Bureau’ – think of it as an office that processes knowledge claims. Your job is to file cases under one of four desks: Perceiving for Yourself, Inferring, Knowing by Being Told, or Knowing by Comparison. Each desk has a simple definition on your handout. You’ll work in groups to file cases, but you can’t change the desks’ definitions. If a case won’t fit, you have two options: force it under an existing desk or pay to add a new one. Later, we’ll audit your filings. Your goal is to earn as many ‘knowledge credits’ (tokens) as possible. Important: You can’t look anything up – use only the handout and your group’s debate. Any questions?"*  

  **What You Do:**  
  - Split into 4 groups of 3–4 people.  
  - Give each group:  
    - 1 handout.  
    - 12 case cards.  
    - 100 tokens (in a bowl).  
  - Assign Policy Cards: Groups 1–2 get **Permissive Policy**; Groups 3–4 get **Strict Policy** (do not reveal this until Phase 2B).  

  ---

  ### **Phase 2: Knowledge Bureau Game (60 min)**  
  #### **Part A: Categorization (25 min)**  
  **Rules:**  
  - Groups file all 12 cases under the 4 desks.  
  - For each case:  
    - **Option 1:** File under an existing desk (no cost).  
    - **Option 2:** Add a new desk (cost: 10 tokens). Label it (e.g., "Desk 5: Not-Perceiving").  
    - **Option 3:** Skip the case (no tokens earned or lost).  
  - **Constraints:**  
    - Desks cannot be redefined (e.g., "Knowing by Being Told" cannot become "Inferring from Speech").  
    - Groups must reach consensus. If deadlocked, they must skip the case.  

  **Facilitator Role:**  
  - Circulate and enforce rules:  
    - *If a group redefines desks:* "Stick to the definitions on the handout. You can’t change what the desks mean – only use them, add new ones, or skip."  
    - *If a group asks for hints:* "Decide based on the case and the desk definitions."  
  - Announce time warnings (e.g., "10 minutes left").  

  **Straggler Cases (Designed to Not Sit Still):**  
  - **Case 5:** *You look at a table and see no pot, and know there is no pot.*  
  - **Case 6:** *A man is stout but never eats during the day; you know he must eat at night.*  
  - **Case 7:** *You are told a new animal is like a cow, and immediately see one and recognize it.* (Blurs "Being Told" and "Comparison")  
  - **Case 8:** *A known liar tells you an unverifiable fact (e.g., "There’s a diamond buried under the quad"), and it’s true. You believe it.* (Tests if testimony depends on the speaker)  
  - *Other cases ensure a mix of easy/hard (see full list below).*  

  #### **Break (10 min)**  
  - Groups pause; no discussion.  

  #### **Part B: Audit & Scoring (25 min)**  
  **Rules:**  
  - **Permissive Policy (Groups 1–2):**  
    - Earn 5 tokens immediately for every filed case.  
    - In audit, lose 10 tokens for each *incorrect* filing.  
  - **Strict Policy (Groups 3–4):**  
    - Pay 5 tokens per case to "confirm" it *before* filing (spent upfront).  
    - In audit, earn 5 tokens only for *correct* filings; incorrect = 0.  
  - **Audit Process:**  
    - Groups reveal filings one by one.  
    - Facilitator uses a **Key** to declare "correct" or "incorrect" (based on Nyāya realism; see [Key] below).  
    - Groups settle tokens (add/remove from bowl).  

  **Facilitator Role:**  
  - Run the audit publicly (groups take turns).  
  - *Do not debate* during audit; just apply the Key.  
  - Record scores on a board.  

  **Scoring Mechanics:**  
  - **Expansion Cost:** Adding a desk costs 10 tokens (paid during filing).  
  - **Permissive Risk:** Files fast, but bleeds tokens if wrong (e.g., file 10 cases = +50 tokens; 3 wrong = –30 tokens; net +20).  
  - **Strict Risk:** Spends tokens to file, so may "starve" (e.g., confirm 6 cases = –30 tokens; 4 correct = +20 tokens; net –10).  

  **Key (Facilitator Reference – Not Shared):**  
  | Case | Correct Filing          | Why (For Debrief) |  
  |------|-------------------------|-------------------|  
  | 1    | Perceiving for Yourself | Standard perception |  
  | 2    | Inferring               | Standard inference |  
  | 3    | Knowing by Being Told   | Standard testimony |  
  | 4    | Knowing by Comparison   | Standard comparison |  
  | 5    | **None** (or new desk)  | Non-perception (*anupalabdhi*) not covered |  
  | 6    | **None** (or new desk)  | Postulation (*arthāpatti*) not covered |  
  | 7    | Knowing by Being Told   | Simultaneous learning/seeing = testimony, not comparison |  
  | 8    | **None**                | Untrustworthy speaker invalidates testimony |  
  | 9    | Inferring               | Inference from evidence |  
  | 10   | Knowing by Being Told   | Testimony from reliable source |  
  | 11   | Knowing by Comparison   | Analogy + memory |  
  | 12   | **None** (or new desk)  | Memory (*smṛti*) not covered |  

  **Predictable Issues & Handling:**  
  - **Redefining Desks:** Groups may try to stretch definitions (e.g., "Not-perceiving is a type of perception"). *Intervene:* "The desks are fixed – you can’t change them, only add new ones or skip." In debrief, frame this as a natural reductionist move.  
  - **Deadlocks:** Stragglers (Cases 5,6,7,8,12) cause disputes. *Allow* skips or new desks; the cost forces trade-offs.  
  - **Compression Faction Emergence:** Some groups will resist adding desks and insist "everything is perception or inference." *Do not stop this* – it mirrors the historical debate.  

  ---

  ### **Phase 3: Argumentative Registers (20 min, Optional)**  
  *If time permits after Phase 2; else skip to debrief.*  
  **Rules:**  
  - Secretly assign each participant a **Register Card** (Truth-Seeker, Winner, Embarrasser).  
  - Groups debate: *"How do we know there’s no pot on the table?"* (Case 5) for 10 min.  
  - After, groups guess others’ registers based on behavior.  
  - **Register Goals:**  
    - **Truth-Seeker:** Find the best answer (e.g., "Maybe we need a new desk?").  
    - **Winner:** "Win" at all costs (e.g., "Your idea is stupid; mine is right").  
    - **Embarrasser:** Undermine others without committing (e.g., "That’s interesting, but what about...?").  

  **Facilitator Role:**  
  - Observe and note behaviors (e.g., "Person X kept changing the subject").  
  - Reveal registers after guesses; discuss how Truth-Seekers were "eaten" by others.  

  ---

  ### **Phase 4: Debrief (30 min)**  
  **Goals:**  
  - Reveal that desks = *pramāṇas*.  
  - Map game struggles to classical disputes.  
  - Explain costs/trade-offs.  
  - Acknowledge limitations.  

  **Script:**  
  *"You’ve just recreated a 1,500-year debate! The four desks are the classical Indian *pramāṇas*: perception (*pratyakṣa*), inference (*anumāna*), testimony (*śabda*), and comparison (*upamāna*).*  

  1. **Why Expand or Compress? Costs in the Game & Tradition:**  
     - **Expansion (e.g., adding Desk 5):** Like Mīmāṃsā adding *arthāpatti* (postulation). *Cost:* More sources = complex system, seen as ad hoc.  
     - **Compression (e.g., "Being Told is just Inference"):** Like Buddhists reducing to 2 *pramāṇas*. *Cost:* Must explain away stragglers:  
       - Case 5 (no pot): "Not-perceiving" isn’t perception – you must infer absence. *Price:* Feels forced; loses immediacy of knowledge.  
       - Case 6 (night-eating): Must be inference, not a new source. *Price:* Inference requires evidence; here it’s resolving inconsistency.  
       - Case 7 (instant comparison): If "Being Told" is inference, *when* does the inference occur? *Price:* Over-intellectualizes learning.  
       - Case 8 (unreliable speaker): If testimony = inference, a lie could still yield truth. *Price:* Undermines knowledge’s reliability.  

  2. **Standing Policies: Validity by Nature vs. External Vouching:**  
     - **Permissive Policy = *Svataḥ-prāmāṇyavāda* (valid by nature):** Knowledge is innocent until proven guilty. *Game Cost:* Earn fast, lose in audit (like getting caught in error).  
     - **Strict Policy = *Parataḥ-prāmāṇyavāda* (externally validated):** Knowledge needs confirmation. *Game Cost:* Spend tokens to file, "starve" if too cautious (like Nyāya requiring verification).  

  3. **Argumentative Registers (if run):**  
     - Truth-Seekers aimed for knowledge; Winners/Embarrassers derailed it. This mirrors *nyāya* (debate) rules: Knowledge arises only in "truth-seeking" exchanges.  

  **Limitations & What You Must Explain:**  
  - **Unstageable Cases:**  
    - **Authorless Texts (e.g., Vedas):** Testimony with no speaker (*apauruṣeya*). *Why unstaged:* The game requires a speaker for testimony; can’t simulate "timeless" authority.  
    - **Yogic Perception:** Direct knowledge of universals. *Why unstaged:* Assumes meditative training; game cases are ordinary.  
    - **Reductionist Nuance:** Buddhists didn’t just "redefine" but re-theorized sources (e.g., testimony as inference from reliability). *Add this in your summary.*  
  - **Other Shortfalls:**  
    - Game "correctness" was based on Nyāya; historically, schools disagreed (e.g., Mīmāṃsā accepts Case 6 as *arthāpatti*).  
    - Token costs simplify epistemic "costs" (e.g., complexity vs. psychological immediacy).  

  **Handling Redefinition Attempts:**  
  - *In debrief:* "Some groups tried to redefine desks – just like Buddhists redefined testimony as inference! It’s a smart move, but it has a price: it strains common sense. When we say ‘I know because she told me,’ we don’t feel like we’re inferring."  

  ---

  ### **Materials Content**  
  **Handout (1 Page)**  
  ```  
  ======================== KNOWLEDGE BUREAU: RULES & DESKS ========================  
  DESKS (You CANNOT change these definitions!):  
  1. PERCEIVING FOR YOURSELF: Knowing by direct experience (e.g., seeing an apple).  
  2. INFERRING: Knowing by reasoning from evidence (e.g., seeing smoke and inferring fire).  
  3. KNOWING BY BEING TOLD: Knowing because a source told you (e.g., believing it’s raining when a friend says so).  
  4. KNOWING BY COMPARISON: Knowing by analogy after learning it (e.g., being told a new animal is "like a cow," then later recognizing it by similarity).  

  RULES:  
  - FILE each case under 1 desk, ADD a new desk (cost: 10 tokens), or SKIP.  
  - EARN tokens by filing, but you’ll be AUDITED.  
  - POLICY: Your group uses ONE policy (assigned later).  

  SCORING:  
  - Permissive Policy: +5 tokens when filed. Lose 10 if audit shows error.  
  - Strict Policy: Pay 5 tokens to file. +5 only if audit shows correct.  

  ======================== SCORE SHEET (Group: _____) ========================  
  | Case | Filing Desk | Tokens (Earned/Spent) | Audit Result | Final Tokens |  
  |------|-------------|------------------------|--------------|--------------|  
  | 1    |             |                        |              |              |  
  | ...  |             |                        |              |              |  
  | 12   |             |                        |              |              |  
  ```  

  **Case Cards (12 Cards)**  
  1. You see a red apple on the table and know it’s there.  
  2. You see smoke on a mountain and know there’s a fire.  
  3. A reliable friend tells you it’s raining, and you know it is.  
  4. You’re told a "gavaya" is like a cow; months later, you see one and recognize it.  
  5. You look at a table and see no pot, and know there is no pot.  
  6. A man is stout but never seen eating during the day; you know he must eat at night.  
  7. You’re told a "gavaya" is like a cow, and immediately see one and recognize it.  
  8. A known liar tells you, "There’s a diamond buried under the quad." You believe it, and it’s true (but you can’t verify it).  
  9. You see dark clouds and know it will rain.  
  10. Your parent tells you where you were born, and you know it’s true.  
  11. You see a bird and recognize it as a robin because it matches a picture you saw.  
  12. You know there’s milk in the fridge because you remember seeing it.  

  ---

  ### **Predicted Problems & Solutions**  
  - **Redefining Desks:** Groups will try it (e.g., "Case 5 is perception!"). *Solution:* Intervene early: "Use the desks as-is." In debrief, normalize it as a historical move.  
  - **Straggler Overwhelm:** Cases 5–8 may cause frustration. *Solution:* Assure groups skipping is allowed; costs incentivize engagement.  
  - **Audit Disputes:** Groups may protest Key. *Solution:* "This is one historical view; we’ll discuss alternatives."  
  - **Time Crunch:** Phase 2 may run long. *Solution:* Cut Phase 3 or reduce cases to 8–10.  

  This design ensures participants "feel" the costs of epistemological commitments through gameplay, with minimal jargon. The debrief ties it to classical debates while leaving room for your expertise on unstageable nuances.
