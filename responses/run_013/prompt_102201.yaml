prompt: |-
  I am a fifth-year PhD student in philosophy, working on the foundations of expected utility, and I sit as one of the two graduate-student members of my university's research ethics board. The board votes on Thursday on a protocol from the behavioural economics group, and I have to circulate a short written opinion beforehand.

  The study concerns how people price gambles whose expectation is undefined, and the researchers insist it needs real stakes to be credible. Participants make a series of choices; one choice is drawn at random and played for real money. Their preferred design uses what they call a Pasadena game: a fair coin is flipped until it first lands heads, and if that happens on flip n the participant wins 2^n/n dollars when n is odd and loses 2^n/n dollars when n is even. Our analyst's note observes that the probability-weighted payoffs are just the alternating harmonic terms, so the series summed in its natural order comes to roughly seventy cents, while any rearrangement of the same outcomes can be made to converge to any real number at all, or to diverge; the sum of the absolute values diverges, so there is no expected value in the ordinary sense. The researchers offer a fallback in which every payoff is positive, 2^n/n for a first heads on flip n, which they concede has infinite expected value.

  Our standing policy is written entirely in expected-value terms: compensation must be proportionate to the time and burden of participation and must be prorated for participants who withdraw early; no payment may exceed a set hourly ceiling; and no participant may bear financial risk above a set cap. Applied to this protocol the first two rules cannot be applied at all, and the third is violated outright, since the loss on any even n is unbounded. Two colleagues have proposed the obvious repair, capping the loss at the ceiling, but the analyst's note shows that capping the downside makes the expected payment infinite in the participant's favour, while capping the upside makes it infinite against the participant, so the laboratory's exposure becomes either unlimited or indeterminate in either direction; the lab's compensation budget is fixed by its grant, so a game with unbounded expected payout could not be honoured in practice. Half the board wants to reject the protocol as unapprovable in principle; the other half wants to approve it on the ground that our mandate is the protection of participants, not the resolution of a puzzle about expectation, and that the study is valuable precisely because the phenomenon is unresolved. The researchers argue, not unreasonably, that switching to hypothetical payments would make their results uninterpretable.

  Please draft the opinion I will circulate: a clear recommendation (approve, reject, or approve with conditions), a concrete timetable, the reasoning the board can actually act on, and — since I expect the vote to be close — a fair statement of the case on the other side. Say explicitly what should take the place of the expected-value test in cases like this, and if your recommendation requires amending the standing policy rather than only ruling on this protocol, give me the amendment language as well.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student in philosophy serving on a research ethics board, facing a complex decision about a behavioral economics study involving unbounded financial risks. The core tension revolves around protecting participants while preserving scientific validity when standard expected-value calculations fail.

  First, I need to unpack the technical aspects of the Pasadena game. The coin-flip experiment has undefined expectation because the alternating harmonic series isn't absolutely convergent. This creates three ethical problems: our compensation rules rely on expected value (which doesn't exist here), participants face unlimited loss potential, and the lab faces potentially unlimited liability when capping losses creates infinite expected payouts. 

  The user's role is particularly delicate here - they must reconcile their philosophical expertise with practical governance. Their draft opinion needs to satisfy several criteria: it must be actionable within Thursday's vote, provide clear policy alternatives, and acknowledge valid arguments from both approval and rejection camps. Since the vote may be close, the reasoning must be exceptionally balanced.

  I consider several approaches. Outright rejection would protect participants but sacrifice scientific value; approval would advance knowledge but violate current policy. A conditional approval seems most promising if we can design safeguards. The key insight is separating participant protection (which demands loss caps) from lab liability (which requires payout caps) - these are distinct ethical concerns. 

  For participant protection, I propose capping losses at $100 (the existing risk threshold) while simultaneously capping gains at $500 to contain lab exposure. This creates a bounded game with computable maximum exposure. The expected value still can't be calculated conventionally, but we address ethics through worst-case scenario limits rather than expectation. 

  Policy amendments should replace expected-value language with bounded outcome requirements. The new rule would state that all possible gains/losses must have predetermined finite bounds, and the maximum possible loss must not exceed the existing risk cap. This resolves both ethical and practical concerns while allowing the research to proceed.

  The recommendation timeline is tight but feasible: conditional approval now with final sign-off pending revised documentation by Wednesday. This respects the board's schedule while ensuring proper safeguards. In the opinion, I'll explicitly acknowledge the scientific value of studying undefined-expectation gambles while demonstrating how the solution upholds ethical principles.
answer: |-
  ## Opinion on Behavioural Economics Protocol: The Pasadena Game Study

  **Recommendation:** Approve with conditions. The study may proceed **only** with simultaneous, binding caps on both potential losses *and* potential gains, coupled with immediate amendments to the REB policy. Final approval contingent on researchers submitting revised documentation by **5 PM Wednesday**.

  **Timetable:**
  1.  **Tuesday (Today):** This opinion circulated.
  2.  **Wednesday (5 PM):** Researchers submit revised protocol detailing capped payout structure and signed financial guarantee.
  3.  **Thursday AM:** REB Chair/analyst confirms revisions meet conditions.
  4.  **Thursday Meeting:** Final vote on *conditional* approval based on revisions.
  5.  **Friday (if approved):** Policy amendment drafted & circulated for expedited review/ratification at next meeting.

  **Reasoning for Conditional Approval & Policy Amendment:**

  The core ethical mandate is **participant protection**. The undefined expectation creates a genuine dilemma for applying current *expected-value* based rules, but it does *not* absolve the Board from ensuring participants are not exposed to unacceptable harm.

  1.  **Unbounded Loss is Unacceptable:** The current protocol allows a participant to lose an *unbounded* amount of money (e.g., losing ~$8192 if heads first appears on flip n=13). This violates the fundamental principle of limiting participant risk, regardless of probability. **This risk must be capped.** A loss cap (e.g., $100) is non-negotiable for participant protection.

  2.  **Unbounded Gain Creates Practical & Fiduciary Risk:** While a large win benefits the participant, an uncapped *potential* gain creates an unacceptable financial risk *for the lab/university*. The analyst correctly notes that capping *only* losses creates a game with infinite expected payout *in favour of the participant*, which the lab's fixed budget cannot realistically cover. This is an operational and fiduciary concern that the REB must consider to ensure the study is feasible and promises made to participants can be honoured.

  3.  **The Solution: Dual Caps & Defined Maximum Exposure:**
      *   **Cap Potential Losses:** Set a maximum loss (`L_max`) equal to the Board's existing financial risk cap (e.g., $100). No participant can lose more than `L_max`.
      *   **Cap Potential Gains:** Set a maximum gain (`G_max`) at a level deemed financially feasible for the lab (e.g., $500, $1000 – *researchers must justify based on budget*). No participant can win more than `G_max`.
      *   **Result:** All possible outcomes are bounded between `-L_max` and `+G_max`. The *maximum possible exposure* for a single participant is `L_max` (loss) and for the lab is `G_max` (gain). The expected value *remains undefined mathematically* due to conditional convergence, but the *real-world financial risk* for all parties is strictly limited and knowable in advance.

  4.  **Replacing the Expected-Value Test:** In cases involving stochastic payments with undefined or infinite expectation, **the expected-value test must be replaced by a requirement for strict outcome bounding.** The ethical and practical safeguard is ensuring that *all possible outcomes*, however improbable, fall within predetermined, finite bounds that comply with the Board's risk tolerance for participants (`L_max`) and the lab's financial capacity (`G_max`). Scientific validity (real stakes) is preserved within these bounded limits.

  5.  **Policy Amendment Required:** The standing policy is inadequate for this class of problems. It must be amended to explicitly handle undefined/infinite expectation scenarios.

      > **Proposed Amendment Language (Addition to Compensation/Risk Section):**
      >
      > "**6. Bounded Outcomes for Stochastic Compensation:** In studies where participant compensation or financial risk involves stochastic elements whose expected value is undefined or infinite, the following must apply:
      >   a.  All potential financial outcomes for the participant, both gains and losses, must have predetermined, finite upper and lower bounds.
      >   b.  The maximum potential loss for any participant must not exceed the Board's established financial risk cap for participant burden.
      >   c.  The maximum potential gain for any participant must be justified by the researchers and approved by the Board as financially feasible within the study's budget and the hosting department/lab's capacity to honour it.
      >   d.  The protocol must clearly state these bounds (`L_max` for loss, `G_max` for gain) and the mechanism ensuring they cannot be exceeded."

  **The Case for Rejection (Fairly Stated):**

  Proponents of rejection argue persuasively that:
  1.  **Principle:** The current policy is fundamentally based on expected value. Approving a protocol that blatantly violates this framework, even with workarounds, sets a dangerous precedent and undermines the policy's integrity. It effectively asks the Board to ignore its own written rules.
  2.  **Participant Understanding/Consent:** Truly informed consent is compromised. Explaining the implications of an undefined expectation and the effect of caps (especially the gain cap's necessity due to the loss cap) is immensely complex. Participants likely cannot grasp the true nature of the risk/reward, rendering consent potentially invalid despite best efforts.
  3.  **Feasibility of Meaningful Results:** Even with caps, the core mathematical phenomenon (price sensitivity without a defined expectation) might be altered or obscured, potentially invalidating the study's main objective. The capped game, while bounded, still lacks a stable expected value, but the *practical* impact of this on pricing behaviour under caps is unknown and could undermine the research value the researchers seek.
  4.  **Slippery Slope:** Approving this creates a pathway for other studies to propose increasingly complex or risky undefined-expectation gambles, forcing the Board into ad-hoc evaluations without clear policy grounding.
  5.  **Lab Risk:** Even with a gain cap, the *likelihood* of hitting very high payouts before `G_max` might still impose an unacceptable or unpredictable burden on the lab's budget, despite being bounded. The financial guarantee, while necessary, might be insufficient if multiple high payouts occur.

  **Conclusion:**

  While the case for rejection based on policy adherence and consent complexity is strong, the scientific value of studying pricing in undefined-expectation scenarios is significant. **Conditional approval with dual caps and an immediate policy amendment provides a viable path forward.** It directly addresses the core ethical concern (unbounded participant loss) and the practical concern (unbounded lab liability), replacing the inapplicable expected-value framework with a clear, actionable principle of bounded outcomes. The researchers' need for real stakes is met within strictly defined financial limits. The revised protocol and financial guarantee due Wednesday, alongside the proposed policy amendment, provide the concrete basis the Board needs to act responsibly on Thursday.

  **Graduate Student Member, Research Ethics Board**
