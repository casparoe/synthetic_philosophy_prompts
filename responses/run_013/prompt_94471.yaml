prompt: |-
  You are a philosopher of AI with a good ear for comedy and a working knowledge of the technical literature on low-impact agency. I need a single joke to open a workshop talk on low-impact AI — the proposal that an agent should try to avoid side effects. I want the punchline to turn on the following problem: whether something counts as a side effect depends on a baseline, and every candidate baseline (the world as it would have been had the agent done nothing; the world as it would have been had it done exactly what was asked; the world its designers would have endorsed) yields different, sometimes absurd verdicts — so an agent told to minimise side effects, but given no specification of what is valuable, has no non-arbitrary way to separate an intended effect from a side effect, and can satisfy the constraint by doing nothing at all, or by treating the very action it was asked to perform as the side effect. Begin by brainstorming three or four possible vehicles for the joke (a dialogue between a researcher and her agent, a genie's wish, an internal compliance memo, a help-desk transcript), pick the strongest, and then write the joke. It must be self-contained, tellable in under a minute, and genuinely funny to an audience that knows this literature; the humour should come from the baseline problem itself rather than from generic robot or AI-safety gags. British English, please.
