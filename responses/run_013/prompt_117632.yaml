    "retroactive_reason_move": {"verdict": "sound | bootstrapping | sound only with a restriction", "restriction_that_would_fix_it": "if any, otherwise none"},
    "regret_test": {"verdict": "usable | circular | usable only after amendment", "amendment": "if any, otherwise none"},
