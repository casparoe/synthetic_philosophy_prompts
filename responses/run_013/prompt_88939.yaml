answer: |-
  Here’s a tight ten-minute script with spine, edge, and coffee-fueled clarity:

  **(Start with energy, lean into the room)**  
  Good morning. Before we dive into two days of rigorous debate, free caffeine, and physicists loudly sighing at philosophers... let’s admit the obvious: most opening remarks about math’s applicability are coma-inducing. We’ve all heard the usual hymn: *math is unreasonably effective!* As if it’s some cosmic accident that the language we invented describes the world. But honestly? That’s the easy puzzle. We build math to organize chaos. We keep what works, scrap what doesn’t. If *nothing* fit, *that* would be shocking.  

  **(Sharpen the focus)**  
  The real head-scratcher—the one that keeps me up—isn’t the math we *expect* to work. It’s the stuff that *shouldn’t*. The cases where mathematicians, chasing beauty or structure, scribble abstractions with zero thought of utility... and decades later, physicists find those scribbles are a perfect blueprint for reality. You know the star example: Riemann’s curved geometries, pure math in the 1850s, suddenly Einstein’s scaffolding for gravity.  

  **(Give them one more punchy example)**  
  Here’s another that stuns me: matrix mechanics. Heisenberg, wrestling with atomic spectra in the 1920s, writes down multiplication rules for abstract arrays. No matrices in sight—just a desperate tool for messy data. Then Born and Jordan say: *Wait—this is matrix algebra*. Math developed centuries earlier to solve linear equations, purely as symbolic play. Suddenly, it’s the engine of quantum mechanics. Not tweaked, not adapted—*ready*.  

  **(Take the stand: deflationary, no wriggling)**  
  So, is this magic? A universe whispering equations to mathematicians? I say no. Here’s the hard pill: **pre-adapted math feels astonishing because we misread history and ignore the graveyard**. We see Riemann’s triumph, not the thousand dead-end geometries forgotten. We celebrate matrices saving quantum theory, not the abstract algebras that never left the seminar room. Our pattern-hungry brains—shaped by evolution to find order—spot the hits and ignore the misses. And yes, some physicists might protest: *But the fit is too perfect!* Is it? Or do we sand off the rough edges? When math *almost* fits, we bend the physics or tweak the model until it clicks. The “pre-adapted” cases are the rare accidents where the tweaking was minimal.  

  **(Address the elephant—flag the fight)**  
  Now—full transparency—some in this room will say I’m cheating. That math *must* latch onto deep truths because even our “pure” abstractions are stealthily mined from physical intuition. That’s a fight worth having. But to the constructivist in front? I’ll say this: We built the math. We built the physics. Sometimes, by luck or inevitability, they align.  

  **(Wrap with momentum)**  
  So let’s use these two days not to marvel at some imagined magic, but to dissect *how* these alignments happen. When does aesthetic math become a physical tool? What fails, and why? And physicists—complain all you want, but bring receipts. Grad students? The coffee’s in the back. Let’s get to work.  

  **Thesis: Pre-adapted mathematics is not a cosmic coincidence but a survivor bias in the long evolution of human abstraction.**  

  ---

  **Why this works:**  
  - **Spine:** Unapologetically deflationary. Pre-adaptation = selection effect + historical cherry-picking.  
  - **Engagement:** Jabs at physicists/grad students (with affection), avoids jargon, uses vivid examples.  
  - **Room-ready:** No platitudes, respects constructivism by centering human invention ("We built the math").  
  - **Fight flagged:** The "stealth mining" rebuttal gets called out upfront.  
  - **Thesis:** Cuts to the core. Provocative but defensible.  

  **Delivery tip:** Start fast, land the jokes lightly, and punch the thesis like you mean it. Ten minutes, done.
