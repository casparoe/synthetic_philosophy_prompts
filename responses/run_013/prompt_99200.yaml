    The fragility is: 
      - Unanimity requirement: one team can block the pact.
      - And if a team blocks, it might be because they plan to escalate.

    We don't have a verification problem, but we have a coordination problem and the ratchet.

  Given the time, we'll go with this simpler pact mechanism.

  Summary of the game:

    Title: The Ratchet Race

    Players: 4-5 teams.

    Levels: 0 to 5 (maximum level).

    Payoff at the end of the game:
        P_i = 100 - 5 * L_i - 15 * (L_max - L_i)

        Explanation: 
          - 100: base security.
          - 5: cost per level (economic burden).
          - 15: vulnerability penalty per unit gap between your level and the maximum level.

    Rounds: 5 rounds.

    Round procedure:

        Round 1 to 5:

          1. Current state: 
               - Moderator reveals the current level of each team (initially all 0).
          2. Pact proposal and vote (if any team proposes a pact):
               - One team can choose to propose a pact: "We agree to stop escalating now. If we all agree, the game ends with no further escalation."
               - All teams vote publicly (yes/no). 
               - If all vote yes, the game ends immediately. Payoffs are computed based on current levels.
               - If at least one team votes no, the pact fails and we proceed to the action phase.
          3. Action phase (if no pact or pact failed):
               - Each team simultaneously decides and announces:
                    a) Stay: remain at current level.
                    b) Escalate: increase level by 1 (if not at max level). This is permanent.
               - Moderator updates levels and reveals new levels.

    Important: After round 5, the game ends regardless.

    Note: A team can only escalate if they are not at level 5.

  Debrief Outline:

    We want to highlight:
      - The ratchet: irreversible escalation.
      - The multipolar trap: individual incentives to escalate (to avoid the gap penalty) lead to collective worse outcome.
      - The coordination problem: the difficulty of getting everyone to agree to stop, especially because some might think they can benefit from escalating one more time or might not trust others.

    Structure of debrief (15-20 minutes):

      1. What happened? 
          - Ask each team to describe their strategy and when they escalated and why.
          - Ask if pacts were proposed and why they succeeded/failed.

      2. Mapping to concepts:
          a) Ratchet: 
              - How did the inability to de-escalate affect the dynamics?
              - Example: once you escalate, you can't go back, so teams might escalate early to avoid being left behind?
          b) Coordination failure in pacts:
              - Why did pacts fail? (unanimity requirement: one holdout can scuttle it)
              - Was there a team that wanted to escalate further and therefore voted no?
              - Or was there distrust: teams worried that if they voted for the pact, others might vote no and then escalate, leaving them vulnerable?
          c) The trap: 
              - At the end, compare the outcome to the optimal (all at 0: 100 points).
              - Show how the gap penalty and cost per level led to a race.

      3. What is settled and what is contested:
          - Settled: 
               * In multipolar traps with positive feedback and irreversibility, individual rationality can lead to collective worse outcomes.
               * Coordination to avoid the trap is fragile, especially with many parties and when trust is low.
          - Contested:
               * The extent to which real-world examples (like climate change, AI race) are driven by irreversibility (ratchet) versus other factors.
               * The effectiveness of different coordination mechanisms (e.g., pacts with penalties, repeated games).

      4. What the game cannot capture:
          - In the real world, the parameters (costs, penalties) are not known and might be subjective.
          - The game has a fixed endpoint (5 rounds), but in reality, the future might be indefinite, which can change the dynamics.
          - The game assumes perfect information (after the round) of levels, but in reality, information is often imperfect and delayed.

      5. Handling the "clever player" who tries to win:
          - We expect someone might try to be the only one at a high level? But the payoff structure penalizes being below L_max heavily, so being the only one at a high level would make you the new L_max and others would have a gap, but you would have a high cost? 
          - Example: if one team is at 5 and others at 0, then L_max=5, so:
              Team at 5: 100 - 5*5 - 0 = 75.
              Teams at 0: 100 - 0 - 15*5 = 25.
            So the high team does better than others, but worse than if they had stayed at 0 (100). 
          - The clever player might think they can force others to escalate? But in the game, if one team escalates to 5 in round 1, then others have 4 rounds to escalate to 5? 
          - How to handle: in the debrief, point out that even the "winner" is worse off than the collective optimum.

    Finally, at the end, you can mention that this is sometimes called "Moloch", but stress that the focus is on the structural trap, not the meme.

  Timeline for 90 minutes:

    0-10 min: Explain rules and setup.
    10-50 min: Play the game (5 rounds, each round might take 5-8 minutes, so 25-40 minutes, plus pact votes might end the game early).
    50-70 min: Teams discuss their experience and prepare insights.
    70-90 min: Debrief.

  Rules to read aloud:

    "Welcome to The Ratchet Race. In this game, you are in a security dilemma. Each team represents a country building defenses. 

    The goal is to maximize your security points. 

    - You start at level 0.
    - You can choose to escalate (increase your level by 1) in any round, but once you escalate, you cannot go back.
    - The game has 5 rounds.

    At the end of the game, your points are calculated as:
        Points = 100 - 5 * (your level) - 15 * (the highest level among all teams - your level)

    Explanation:
        - You pay a cost of 5 points per level (because maintaining defenses is expensive).
        - You also lose 15 points for every level you are below the highest level (because you are vulnerable to the best-defended team).

    Round structure:

        1. I will show the current levels.
        2. Any team can propose a pact: 'Let's stop escalating now and end the game with these levels.' 
           - If proposed, every team votes publicly (thumbs up/down). 
           - If every team votes yes, the game ends immediately and points are awarded.
           - If at least one team votes no, the pact fails.
        3. If no pact is formed (or it fails), then every team announces their action for the round: 
              - 'Stay' (remain at your current level)
              - 'Escalate' (increase by 1 level, if not at level 5)
           - I will then update the levels and show the new state.

    Note: You can only escalate if you haven't reached level 5.

    Let's start with everyone at level 0."

  Materials:
    - Projector/whiteboard to show a table of teams and their levels.
    - A way for teams to vote (colored cards for pact voting: green=yes, red=no; and for actions: green=escalate, red=stay).

  First-time issues:
    - Someone might escalate to level 5 in round 1 to see what happens? 
        -> That's okay, it will show the consequences.
    - Teams might not propose a pact early? 
        -> They might wait until they are at a high level? But then the gap penalty for teams below might be large.
    - A team might try to be the only one at a high level? 
        -> As per the payoff, they will have a high cost and also cause harm to others? And then others will escalate to reduce the gap.

  In the debrief, if a team tried to "win", ask them if they feel they won? And show the points.

  This design should create a ratchet effect and a coordination challenge with the pact.
answer: |-
  ### The Ratchet Race Game  
  **Designed to simulate a multipolar trap with irreversible escalation and fragile coordination.**  

  ---

  #### **Materials Needed**  
  - Projector/display for instructions and tracking  
  - Whiteboard to track:  
    - Each team's current "level" (0–5)  
    - Pact status (active/inactive)  
    - Verification tokens  
  - Colored cards (green/red) for team decisions  
  - Timer  

  ---

  #### **Setup**  
  - **Players:** Split into 4–5 teams (4–5 people/team).  
  - **Objective:** Maximize team points. Points depend on *your level* and the *highest level in the room*.  
  - **Levels:** Each team starts at **Level 0**. Levels can only increase (0 → 1 → 2 → 3 → 4 → 5).  
  - **Rounds:** 6 rounds (10 min/round) + debrief.  

  ---

  #### **Payoff Structure**  
  At game end, points =   
  `100 - (10 × Your Level) - (20 × Highest Level in the Room)`  

  - **Example:**  
    - If all teams hold at Level 0: **100 points each**.  
    - If one team escalates to Level 1 (others at 0):  
      - Escalator: `100 - 10 - 20 = 70`  
      - Others: `100 - 0 - 20 = 80`  
    - If all escalate to Level 1: `100 - 10 - 20 = 70` (all worse off).  

  **Key insight:** Escalating *avoids being left behind* if others escalate, but collectively hurts everyone.  

  ---

  #### **Rules & Round Structure**  
  1. **Current State (1 min):**  
     - Moderator displays all teams’ levels.  
  2. **Pact Proposal (2 min):**  
     - Any team can propose a pact: *"Freeze escalation at current levels."*  
     - **Pact binds only if:**  
       - All teams vote **"YES"** publicly (green card).  
       - **Verification required:** After pact passes, teams *secretly* choose to **COMPLY** or **DEFECT** next round.  
  3. **Action Phase (2 min):**  
     - **If NO pact (or pact fails):** Teams publicly choose:  
       - **STAY** (red card) or **ESCALATE** (green card, move up 1 level).  
       - *Escalation is irreversible.*  
     - **If pact PASSED:** Teams *secretly* submit:  
       - **COMPLY** (red card, stay) or **DEFECT** (green card, escalate).  
  4. **Verification (3 min):**  
     - **Only if pact is active:**  
       - Each team decides whether to pay **5 points** to verify *one random team’s* compliance.  
       - Verification reveals if that team complied/defected.  
       - **Pact breaks if ANY verified team defected OR if no one pays to verify.**  
  5. **Update & Reveal (2 min):**  
     - New levels displayed.  
     - If pact broke, announce and display defectors (if verified).  

  ---

  #### **Game Flow**  
  | Round | Key Activities                            | Time  |  
  |-------|-------------------------------------------|-------|  
  | 1     | Rules explanation, setup                  | 10 min|  
  | 2–6   | State → Pact → Action → Verification → Reveal | 10 min/round |  
  | 7     | Final scoring, debrief                    | 20 min|  

  ---

  #### **Instructions to Read Aloud**  
  > "Welcome to *The Ratchet Race*. You’re teams managing a shared resource.  
  > **Goal:** Maximize your team’s points.  
  > **Rules:**  
  > - Start at **Level 0**. You can **ESCALATE** (irreversible) or **STAY** each round.  
  > - Points = `100 - (10 × Your Level) - (20 × Highest Level in the Room)`.  
  > - You can propose a **PACT** to freeze escalation. It passes *only* if every team votes YES.  
  > - **If a pact passes:** Next round, you *secretly* choose to COMPLY (stay) or DEFECT (escalate).  
  > - **Verification:** After a pact, you can pay 5 points to check *one random team’s* compliance.  
  > - **Pact breaks** if verification catches a defector OR if no one pays to verify.  
  > 6 rounds total. Let’s begin."  

  ---

  ### **Debrief Framework**  
  **Time:** 20 min  
  **Goals:** Connect gameplay to real-world dynamics, separate ratchet effects from coordination failures.  

  #### **Discussion Prompts**  
  1. **What happened?**  
     - *"When did escalation start? Why?"*  
     - *"Did pacts form? Why did they succeed/fail?"*  

  2. **Map Moments to Concepts:**  
     - **Ratchet Effect:**  
       - *"When a team escalated, could they undo it? How did that force others’ hands?"*  
       - Link: Irreversible moves shrink options, creating a "slippery slope."  
     - **Coordination Failure:**  
       - *"Why was unanimous agreement hard? Did distrust or self-interest play a role?"*  
       - Link: Pact failures stem from alignment challenges, not "bad actors."  
     - **Verification Problem:**  
       - *"Did teams pay to verify? Why might teams avoid it? How did this break pacts?"*  
       - Link: Monitoring is costly → defection risk rises → pacts collapse.  

  3. **Settled vs. Contested:**  
     - **Settled:**  
       - Ratchets + poor coordination *can* create races to the bottom (e.g., climate inaction, tech arms races).  
       - Verification costs undermine trust (empirically observed).  
     - **Contested:**  
       - *"Can societies design verification that isn’t costly?"* (Some argue blockchain/AI fixes this; others say it’s inherent.)  
       - *"Do ratchets always dominate? Or can coordination overcome them?"* (Optimists point to international treaties; pessimists cite breakdowns.)  

  4. **What the Game Can’t Capture:**  
     - **Hidden information:** Real actors rarely see all levels/decisions.  
     - **Long timescales:** Escalation consequences unfold over years, not rounds.  
     - **External shocks:** Wars, innovations, or disasters change incentives.  
     - **Mention:** *"This is sometimes called 'Moloch'*—a metaphor for systems that trap groups despite good intentions."  

  ---

  ### **Predictable Issues & Fixes**  
  - **"Clever player tries to 'win' by escalating early":**  
    - **Why it happens:** They assume high levels "win."  
    - **Fix pre-game:** Emphasize, *"Points drop when ANYONE escalates. The goal is collective health, not 'beating’ others."*  
    - **Fix mid-game:** If a team escalates aggressively, ask in debrief: *"Did this help them? Or drag everyone down?"*  
  - **Pacts never form:**  
    - Highlight in debrief: *"Coordination requires trust. Did the ratchet make you too scared to try?"*  
  - **Verification ignored:**  
    - Ask: *"Why skip verification? Was 5 points too costly? What if the cost was higher/lower?"*  

  ---

  **Why This Works:**  
  - **Ratchet focus:** Escalation is permanent and visible, forcing incremental collapse.  
  - **Fragile pact:** Unanimity + costly verification mirrors real coordination pain points.  
  - **No "villains":** Incentives, not malice, drive failure.  
  - **"Moloch" withheld:** Prevents premature pattern-matching.  

  **First Run Tips:** Keep rounds tight, enforce the timer, and remind teams: *"This is about systems, not outsmarting each other."*
