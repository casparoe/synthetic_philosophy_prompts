answer: |-
  Here's the translation you requested, followed by the residue analysis. Each welfare position is rendered strictly in your actuarial vocabulary:

  **1. Reciprocity/Desert Argument (Conditionality as Fairness & Incentive):**
  *   **Actuarial Translation:** The welfare pool faces severe *ex-ante moral hazard* (reduced labor force participation) and potential *adverse selection* (attracting individuals with lower inherent labor market attachment). Conditionality (work requirements/job search) acts as a mandatory *deductible* or *waiting period*, imposing a cost (effort/time) on claimants. This screens for *preferred risks* (those genuinely seeking work/able to work) by increasing the *loading* (effective cost) for *substandard risks* (those less motivated/able). It aligns claimant incentives with the pool's sustainability, reducing the pool's overall *risk charge* by mitigating the *probability of loss* (long-term dependency). Verification (job logs, interviews) manages *claims leakage* (benefits paid without sufficient effort). "Desert" reflects the principle that benefits should correlate with *contribution* to the pool's stability (via labor participation reducing claims costs), maintaining *equitable risk classification* where premiums (taxes) fund benefits contingent on effort.

  **2. Political-Economy / "Deservingness as Construct" Argument:**
  *   **Actuarial Translation:** The discourse of "deservingness" is a politically motivated *risk classification* scheme designed to segment the pool. Its primary function is to artificially create *substandard risk classes* ("undeserving") to justify imposing higher *loadings* (stricter conditions, sanctions) and *deductibles* (work requirements) on them, thereby lowering the *pool's average claims cost*. This segmentation isn't actuarially fair but serves to *discipline labor supply* (reduce *ex-ante moral hazard* by increasing the perceived cost of claiming benefits). The focus on "fraud" amplifies *verification costs* and acts as a *deterrent* (sanction risk) for all claimants, regardless of actual fraud levels. It manufactures *adverse selection* pressures *away* from the labor market by making the welfare pool less attractive/accessible, artificially improving the *loss ratio* of the employed population pool.

  **3. Basic Income / Unconditional Rights Objection:**
  *   **Actuarial Translation:** Eliminating conditionality removes *deductibles*, *waiting periods*, and most *verification costs*. This creates a pure *risk pool* funded by *premiums* (taxes) where the *benefit* is payable upon the *insured event* (insufficient income/life circumstance) without proof of mitigation effort. It accepts higher inherent *ex-ante moral hazard* (potential work disincentives) and treats it as a necessary *loading* for universality. Adverse selection is minimized because *coverage is automatic* – the pool encompasses the entire population segment. The core argument is that the *transaction costs* (verification, condition enforcement, error rates) and the *deadweight loss* from imperfect screening (excluding genuine needs) outweigh the *savings* from reduced moral hazard and the *inequity costs* of flawed *risk classification*. The "unconditional right" is equivalent to a guaranteed minimum claim payment without underwriting.

  **4. Paternalist / Commitment Device Argument:**
  *   **Actuarial Translation:** Conditionality acts as an externally enforced *commitment device* for individuals with *self-binding problems* (time inconsistency, present bias). Without mandated requirements (*deductibles*), these individuals under-invest in *loss prevention* (job search, skill development), leading to worse long-term outcomes and higher *claims severity/duration* (long-term dependency). The requirements force *ex-ante* mitigation efforts that the individual *rationally* values *ex-post* but cannot self-impose. Verification and sanctions function as the *enforcement mechanism* for this commitment contract. The *loading* (effort cost) imposed is justified as preventing the higher *expected loss* (future poverty, skills atrophy) resulting from inaction, effectively improving the individual's long-term *risk profile* within the broader societal pool.

  ---

  **Residue Report: What Survives, What Bends, What's Missing**

  **Survives Cleanly:**
  1.  **Incentive Structures:** The core mechanics of *ex-ante moral hazard* (work disincentives), *ex-post moral hazard* (reduced job search effort while claiming), and using *deductibles/waiting periods* (conditionality) to mitigate them translate almost perfectly. The logic of aligning incentives via cost-sharing is fundamental to both domains.
  2.  **Screening & Classification:** The concept of using conditions and verification to *screen* for different *risk types* (motivated/unmotivated, able/less able) and impose differential *loadings* (stricter rules/higher effort costs) maps directly onto debates about "deservingness" and targeting.
  3.  **Verification Costs:** The inherent cost and difficulty of accurately assessing eligibility/effort (*claims verification*) and its impact on system design/leakage is a direct parallel.
  4.  **Adverse Selection:** The concern that overly generous/unconditional benefits might attract individuals systematically more likely to claim/claim longer (a form of *adverse selection* into the welfare pool) is a valid actuarial concern mirrored in the political debate.
  5.  **Pool Sustainability:** The fundamental actuarial drive to ensure the *pool remains solvent and sustainable* translates directly into concerns about fiscal responsibility and long-term program viability in welfare debates. Loadings, deductibles, and screening are all tools for this.

  **Bent Out of Shape:**
  1.  **"Desert":** This is **not** just "ill-formed incentives." It introduces a **normative judgment** about *earned entitlement* based on perceived effort/virtue/membership. Actuarial "preferred risk" or "mitigated hazard" is descriptive; "deserving" carries heavy moral weight about *worthiness*. Your frame can model the *behavioral outcomes* (effort exerted), but the *moral judgment* ("they *deserve* it") is exogenous. The translation forces "desert" to mean "meets the incentive/screening conditions for preferred risk status," stripping the core moral sentiment.
  2.  **Power & Constructed Categories:** The political-economy argument's core claim – that categories like "deserving" are *manufactured tools of power/discipline* – is bent. Actuarial *risk classification* is presented as a *technical, optimizing* response to inherent heterogeneity. Translating "manufactured deservingness" as "politically motivated risk classification" captures the *outcome* (segmentation) but flattens the *intentionality* (power dynamics, ideology) into a mere input parameter. The *why* of the classification gets lost.
  3.  **Unconditional Rights / Human Dignity:** The BI argument's foundation in inherent rights/human dignity doesn't fit. Translating it as accepting higher moral hazard as a loading for lower transaction costs captures the *efficiency* argument but completely bypasses the *deontological* claim ("everyone *deserves* basic security, period"). The "right" becomes a policy choice about acceptable loss ratios, not a fundamental principle.

  **No Counterpart In Your Vocabulary:**
  1.  **"Undeserving":** This has **zero actuarial content**. It's pure moralizing/social judgment. Your framework has "substandard risk," "high hazard," or "fraudulent claimant" – all behavioral or probabilistic descriptions. "Undeserving" injects an irreducible element of *moral condemnation* and *social exclusion* that your vocabulary rightly discards as non-actuarial. It's a political/social label, not a risk category.
  2.  **Stigma:** This is **not** just the deterrent effect of a sanction. Stigma is a *social cost* borne by *all* claimants (even compliant ones), arising from negative social perceptions tied to claiming benefits. It's an **externality** and a **deadweight loss** imposed by the system/design/society. Your framework sees sanctions (reduced benefits) as a direct deterrent cost. Stigma is an *indirect social cost* (reduced self-worth, social isolation, discrimination) that isn't priced into the premium or the benefit structure. It's a real cost your frame lacks a line for.
  3.  **Fraud Fixation vs. Rational Response:** You're correct that "fraud" and "rational response to bad design" are often the same behavior. The fixation in the debate **does point to a genuine blind spot in your frame: Legitimacy & Social Cohesion.** Your framework is amoral about behavior – it's just a claim cost to be minimized. The political debate fixates on fraud because it threatens the *perceived legitimacy* of the pool. If members believe others are "cheating," the *solidarity* underpinning the pool (willingness to pay premiums/taxes) erodes. Your frame optimizes the *technical* pool; the fixation highlights the *social/political* vulnerability of the pool requiring constant legitimation. It's not confusion; it's about maintaining the *social contract* enabling the pool to exist.
  4.  **Emotional/Social Dimensions:** The brother-in-law's "sentimentality" reflects costs and values your frame ignores: human suffering, dignity eroded by bureaucracy/stigma, community bonds, trust. These aren't priced risks or loadings; they're the social fabric within which the actuarial pool operates.

  **Conclusion: The Leftover Bits**

  The residue isn't primarily a **defect of your framework**. It's purpose-built for managing financial risk within a defined pool using probabilistic models and incentives. It excels at that. The residue arises because **the welfare debate is fundamentally muddier** and tackles problems your framework isn't designed to handle:

  1.  **Morality & Social Judgment:** Concepts like "desert," "undeserving," and the emotional weight of "fraud" are inherently normative and social, not actuarial.
  2.  **Power & Legitimacy:** The construction of categories and the focus on fraud legitimacy are about power dynamics and maintaining the social contract necessary for the pool to exist politically, not just financially.
  3.  **Intrinsic Value:** Unconditional rights arguments rest on values (human dignity, basic security) that exist outside the logic of risk pooling and optimization.
  4.  **Social Externalities:** Costs like stigma are real but fall outside the direct claimant-insurer financial relationship your frame models.

  Your framework reveals the **underlying incentive structures and efficiency trade-offs** with brilliant clarity. The residue exposes the **irreducible social, moral, and political dimensions** that inevitably shape how welfare systems are designed, perceived, and contested. The "muddiness" isn't confusion *within* each domain, but the *necessary friction* when a technocratic risk-management logic meets the messy realities of human need, social solidarity, power, and moral judgment. Your vocabulary isn't blind; it's focused. The debate requires lenses yours wasn't ground for.
