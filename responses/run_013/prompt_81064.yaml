  Assessing candidate theories: (i) Sunk costs ignore is normative but fails to explain real behavior. (ii) Loss aversion explains irrational escalation but doesn't help in-the-moment decisions. (iii) Reputation accounts for cases like (e) but not simple auctions. (iv) Game theory explains infinite escalation but assumes rationality contrary to real behavior.

  The most load-bearing requirement is R9 (decision procedure), as it's hardest to satisfy with existing theories. The conflict between R8 (explanation) and R9 (procedure) is critical. Non-negotiable requirements include R1, R2, R4, R6, R10, R11, R12. Others might be preferences but still important.

  In real-world scenarios (f), the theory must abstract correctly. Identifying features like loser-pays rule or reputation is key. The user’s hidden need might be practical solutions; they might prioritize a decision procedure over theoretical purity. So, suggesting accepting the conflict and focusing on mitigations like pre-commitment could be useful.
answer: |-
  ### Desiderata for an Adequate Theory of Escalation of Commitment  

  **Non-negotiable requirements** (grounded in empirical/logical necessity) are marked with **★**. Others reflect explanatory depth or practical utility.  

  #### **Core Phenomena & Cases to Explain**  
  - **R1 (★): Explain paradoxical bids above prize value**  
    *Case*: Standard auction (a) shows bids exceeding $1 despite diminishing marginal returns. *Forces*: Mechanistic failure of "ignore sunk costs" advice.  
  - **R2 (★): Explain reduced escalation under caps**  
    *Case*: Capped auction (b) sees bids halt near cap (e.g., $5). *Forces*: Limits alter strategic calculus; theory must distinguish finite vs. infinite games.  
  - **R3 (★): Explain partial refund effects**  
    *Case*: Half-refund auction (c) dampens bids but may not eliminate escalation. *Forces*: Sunk costs aren’t binary; recoverability gradients matter.  
  - **R4 (★): Explain irrational persistence against scripts**  
    *Case*: Fixed-script opponent (d) should make quitting dominant, yet humans persist. *Forces*: Distinguish rational vs. irrational drivers.  
  - **R5 (★): Explain non-monetary escalation**  
    *Case*: Reputational auction (e) where visible persistence *increases* prize value. *Forces*: Endogenous prizes break fixed-value models.  
  - **R6 (★): Generalize to real-world endeavors**  
    *Case*: Wars, lawsuits, product lines (f). *Forces*: Theory must abstract prize fluidity, partial loser penalties, multi-party dynamics, and hidden information.  

  #### **Structural Distinctions & Features**  
  - **R7 (★): Isolate critical auction mechanics**  
    *Must distinguish*: Fixed prize vs. variable prize, loser-pays vs. partial penalties, cap absence vs. presence, public bids vs. hidden actions, coordination feasibility. *Forces*: Case (e) and (f) require prize variability; (c) requires loser-pays flexibility.  
  - **R8: Explain escalation despite awareness**  
    *Case*: Sophisticated actors in (a) or (f) who know the trap but bid past $1. *Forces*: Theory must resolve the "knowledge-behavior gap."  
  - **R9: Supply a decision procedure for active participants**  
    *Case*: Bidder at $0.95 deciding whether to bid $1.00. *Forces*: Need prescriptive guidance under uncertainty.  

  #### **Theoretical Robustness**  
  - **R10 (★): Predict outcomes under parameter changes**  
    *Must be consistent with*: Caps reducing bids (R2), refunds reducing bids less than expected (R3).  
  - **R11 (★): Be falsifiable**  
    *Must specify*: Conditions under which escalation would *not* occur (e.g., no loser penalty).  
  - **R12 (★): Distinguish normative vs. descriptive claims**  
    *Must clarify*: When escalation is rational (e.g., reputational gains) vs. irrational (e.g., against scripts).  

  ---

  ### **Candidate Accounts Scored Against Desiderata**  
  | **Account**               | **R1** | **R2** | **R3** | **R4** | **R5** | **R6** | **R7** | **R8** | **R9** | **R10** | **R11** | **R12** |  
  |----------------------------|--------|--------|--------|--------|--------|--------|--------|--------|--------|---------|---------|---------|  
  | **(i) Ignore sunk costs**  | ✗      | △      | △      | ✗      | ✗      | ✗      | △      | ✗      | ✓      | ✗       | ✓       | ✓       |  
  | **(ii) Loss aversion**     | ✓      | ✓      | ✓      | ✓      | △      | ✓      | △      | ✗      | △      | ✓       | ✓       | ✓       |  
  | **(iii) Reputation**       | △      | △      | △      | ✗      | ✓      | ✓      | ✓      | ✓      | △      | △       | △       | ✓       |  
  | **(iv) Game theory**       | ✓      | ✓      | ✓      | ✗      | ✗      | △      | ✓      | ✗      | ✓      | ✓       | ✓       | ✓       |  

  **✓**: Fully satisfies, **△**: Partially satisfies, **✗**: Fails  
  - **(i)** Fails R1, R4, R8 (no explanation for persistent bids); useful only for R9.  
  - **(ii)** Explains R1, R4, R8 (cognitive biases) but weak on R9 (no decision rule).  
  - **(iii)** Explains R5, R8 (reputational incentives) but fails R4 (no script response).  
  - **(iv)** Explains R1, R2, R7 (rational escalation) but fails R4, R8 (assumes rationality).  

  ---

  ### **Critical Observations**  
  1. **One theory for both?** Unlikely. R8 (explanation despite knowledge) requires cognitive/behavioral mechanisms, while R9 (decision procedure) requires normative rationality. Accounts satisfying R8 (e.g., ii, iii) struggle with R9; those satisfying R9 (e.g., i, iv) fail R8.  
  2. **Key conflict**: **R8 vs. R9** (explanation vs. prescriptive guidance). They demand incompatible foundations: descriptive theories invoke biases, while prescriptive theories assume rationality.  
  3. **Most load-bearing requirement**: **R6** (generalize to real-world). Forces the theory to handle ambiguity (e.g., fluid prizes, multi-party).  
  4. **Most assumed requirement**: **R12** (normative/descriptive split). Often blurred, especially in game theory (iv) treating escalation as "rational."  

  ### **Unavoidable Conflict & Recommendation**  
  - **Conflict**: R8 and R9 are jointly unsatisfiable. A unified theory would need to explain irrational behavior *and* supply a rational decision tool—a contradiction.  
  - **Resolution proposal**: Drop **R9** (decision procedure) as a *core requirement*. Focus instead on:  
    - *Pre-commitment* (e.g., caps, exit criteria) for future decisions (addresses R2, R10).  
    - *Cognitive debiasing* for ongoing endeavors (addresses R4, R8).  

  **Verdict: R6; conflict R8/R9**
