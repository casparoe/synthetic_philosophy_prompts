  The user wants two things: explanation of escalation despite awareness and a decision procedure. These might conflict because a descriptive theory explaining irrational behavior may not provide a normative decision guide. I need to check if one theory can satisfy both.

  Desiderata should include explaining paradoxical bids post-$1 (R1), why caps reduce bids (R2), partial refunds' effects (R3), behavior against scripts (R4), reputation as a motivator (R5), and applicability to real-world complexity (R6). Also, the theory must identify key auction features (R7) and cover both explanation and procedural guidance (R8, R9). 

