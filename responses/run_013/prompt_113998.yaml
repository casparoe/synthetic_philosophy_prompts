  ### **Falsifiability Inspector General Clears Darwinism After 100-Year Suspicion**  
  *Subheading: "Metaphysical Research Programme" Label to Be Retired Pending Review of Testable Predictions*  

  **LONDON** — In a landmark ruling, the International Bureau of Falsification Standards (IBFS) announced today that Darwinian evolution has finally been cleared of longstanding suspicions of being "untestable pseudoscience," ending a century-long investigation spearheaded by the late philosopher Karl Popper.  

  The decision follows a grueling 87-year audit of natural selection’s falsification credentials, initiated after Popper famously red-flagged Darwinism in 1934 for "tautological tendencies" and "questionable empirical protocols." Inspector General Dr. Reginald Quibble of the IBFS confirmed the breakthrough at a press conference flanked by stoic men in lab coats holding clipboards labeled "FALSIFIABILITY PROTOCOLS: DO NOT BEND."  

  "For decades, Darwinism operated under a cloud of suspicion," droned Dr. Quibble, adjusting his spectacles. "Our initial findings echoed Popper’s concern that ‘survival of the fittest’ was circular — if fitness is defined by survival, how do we falsify it? Is it science or a metaphysical spa retreat for adaptationists?" He paused for effect. "However, after reviewing auxiliary hypotheses like genetic drift and speciation mechanisms, we’ve concluded that while Darwinism *as a whole* remains a ‘metaphysical research programme’ — a term we use affectionately, like ‘eccentric aunt’ — its testable predictions are now IBFS-compliant."  

  The ruling vindicates Popper’s nuanced, oft-misinterpreted stance. Though the philosopher initially dismissed evolution as "almost tautological" in *The Poverty of Historicism* (1957), he later upgraded it to a "metaphysical research programme" in his 1978 essay *Natural Selection and the Emergence of Mind* — a designation he insisted was "not a criticism" but a "badge of honor" for theories too grand to falsify outright.  

  Dr. Evelyn Taxon, a philosopher of biology at the Institute for Falsification Studies, elaborated: "Popper adored Darwinism! He called it ‘extremely valuable’ precisely *because* it’s metaphysical — a scaffold for generating testable claims. For example, ‘Tiktaalik fossils will appear in Devonian strata’ or ‘Antibiotic resistance evolves in bacteria.’ Those *are* falsifiable. The core theory? It’s like accusing gravity of metaphysics because you can’t falsify ‘things fall down.’"  

  Evolutionary biologists reacted with weary relief. "We’ve been submitting peer-reviewed falsifications since the Modern Synthesis in the 1940s," grumbled Dr. Finch Beakman of the University of Cambridgshire. "Observed speciation in finches? Falsifiable. Lenski’s E. coli? Falsifiable. Popper’s worry was solved with population genetics. But sure, let’s throw a party because a philosopher finally filed the paperwork."  

  Critics note the ruling comes with caveats. Darwinism remains on the IBFS "Metaphysical Watchlist" — a designation shared with string theory and the Copenhagen interpretation of quantum mechanics — pending annual reviews of "empirical output." Quibble clarified: "This isn’t demotion; it’s a promotion *to* strategic oversight. Like making Darwin the permanent secretary of the Adaptation Committee."  

  Popper, reached via ouija board for comment, reportedly spelled out: "I RECANT NOTHING. BUT TELL THAT LAB GUY HE’S MISSING THE POINT. ALSO, BUY MY BOOKS."  

