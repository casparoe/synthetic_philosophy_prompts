  For the great-granddaughter, if she claims guilt not by identity but by voluntary association, it might not fit perfectly. But we have no leaf for voluntary assumption. We could add a leaf, but we are at 13. We can consider that as part of Identity-Based if she identifies with the group, or create a new leaf under passive attributes in present branch? But it's for past wrong.

