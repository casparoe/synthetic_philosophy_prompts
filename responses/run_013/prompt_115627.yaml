    *Awkward commitment: Must hold that the past has no bearing on present moral obligations, even if it explains current advantages or disadvantages.*  
  - Yes: Go to 4

  Level 3: **Is the present-day situation a direct continuation of the historical wrong?**
  - No: **Leaf: Independent Present**  
    *Awkward commitment: Must address present injustices without reference to their historical causes, even when they are structurally identical.*  
  - Yes: Go to 5

  Level 4: **Who is the primary bearer of responsibility?**
  - Individual: Go to 6
  - Collective: Go to 7

  Level 5 (for individual in historical branch): **What is the basis for the individual's responsibility?**
  - Group identity: **Leaf: Identity-Based Responsibility**  
    *Awkward commitment: Must accept responsibility for deeds one did not commit based on shared group membership.*  
  - Benefits received: **Leaf: Unjust Enrichment Liability**  
    *Awkward commitment: Must renounce benefits from past injustice, even if it leaves one worse off.*  
  - Own present-day actions (e.g., denial): **Leaf: Contemporary Complicity (Past-Focused)**  
    *Awkward commitment: Must acknowledge that present actions like denial or minimization compound the original wrong.*  

  Level 5 (for collective in historical branch): **What type of collective?**
  - State: **Leaf: State Continuity**  
    *Awkward commitment: Must hold the state liable for its past actions, even if it has since reformed.*  
  - Nation: **Leaf: Collective National Guilt**  
    *Awkward commitment: Must accept that the nation is a transgenerational entity that bears guilt, shared by all members.*  
  - Lineage: **Leaf: Familial Taint**  
    *Awkward commitment: Must accept that guilt is inherited through family lines, like a moral stain.*  
  - Other: **Leaf: Unnamed Collective Responsibility**  
    *Awkward commitment: Must defend the idea that collectives (e.g., culture, generation) can bear guilt across time.*  

  Level 5 (for individual in present branch): **Is the individual's responsibility based on their own actions or on passive attributes?**
  - Own actions: **Leaf: Active Perpetrator**  
    *Awkward commitment: Must admit to being a present-day perpetrator of injustice, even if acting within inherited structures.*  
  - Passive attributes: **Leaf: Passive Bystander Liability**  
    *Awkward commitment: Must accept blame for inaction in the face of ongoing injustice, even if not personally responsible for its origins.*  

  Level 5 (for collective in present branch): **What type of collective?**
  - State: **Leaf: State Perpetuation**  
    *Awkward commitment: Must hold the state responsible for ongoing injustice that began in the past, regardless of when it joined.*  
  - Nation/Culture: **Leaf: Collective Perpetuation**  
