answer: |-
  Below is a decision tree designed to categorize positions on intergenerational guilt, liability, or obligation. It is built from the logical space you described, with internal nodes as questions answerable without knowing the outcome, branches labeled by claims, and leaves as named positions (or "unnamed") plus their most awkward commitment. The tree prioritizes your specified distinctions: bearer of guilt, what descends, connection to the deed, live question (past wrong vs. present actions), and owed response. It avoids Jaspers' taxonomy and focuses on logical branching.

  The tree has **13 leaves** and **5 levels of branching** (maximum depth). It was tested against your cases by placing each at the node where it does "real work" (explained after the tree). Positions are named only where recognizable; "unnamed" indicates unexplored or unattractive combinations. Awkward commitments highlight the hardest pill to swallow for each position. The tree is designed for objectivity: input a character's answers to return a position, not a mood.

  ---

  ### **Decision Tree: Positions on Intergenerational Guilt**

  **Level 1: Is the live question about the ancestors' deeds or the descendants' present actions?**  
  *(This splits the focus: historical wrong vs. current implications.)*  
  - **Branch A: Ancestors' deeds** → Go to Level 2A  
  - **Branch B: Descendants' present actions** → Go to Level 2B  

  ---

  #### **Branch A: Focus on Ancestors' Deeds**  
  **Level 2A: Can guilt, responsibility, or obligation for the historical wrong attach to present-day entities?**  
  *(Tests if the past wrong has any present moral weight.)*  
  - **Branch A1: No** → **Leaf: Full Rejection**  
    *Most awkward commitment: Must deny any present claim from the past, even if descendants directly benefit or institutions continue unchanged.*  
  - **Branch A2: Yes** → Go to Level 3A  

  **Level 3A: What bears the guilt?**  
  *(Identifies the primary bearer: individual, state, or collective.)*  
  - **Branch A2.1: Individual descendants** → Go to Level 4A  
  - **Branch A2.2: State (as a continuing institution)** → **Leaf: State Continuity Liability**  
    *Most awkward commitment: Must treat the state as an unbroken moral agent across time, liable for reparations regardless of current governance.*  
  - **Branch A2.3: Collective (nation, lineage, or culture)** → Go to Level 4B  

  **Level 4A (Individual descendants): What is the basis for the individual's connection?**  
  *(Connects the descendant to the deed.)*  
  - **Branch A2.1.1: Identity (e.g., familial or national)** → **Leaf: Identity-Based Guilt**  
    *Most awkward commitment: Must accept guilt for acts one did not commit, based solely on group membership.*  
  - **Branch A2.1.2: Benefits (e.g., inheritance or enrichment)** → **Leaf: Unjust Enrichment Liability**  
    *Most awkward commitment: Must forfeit benefits even if acquired innocently, potentially impoverishing oneself.*  
  - **Branch A2.1.3: No direct connection, but a moral duty exists** → **Leaf: Metaphorical Taint**  
    *Most awkward commitment: Must embrace a symbolic "stain" from the past that demands atonement, despite no causal responsibility.*  

  **Level 4B (Collective): What type of collective?**  
  *(Distinguishes between collective subjects.)*  
  - **Branch A2.3.1: Lineage (family)** → **Leaf: Familial Taint**  
    *Most awkward commitment: Must affirm that guilt flows through bloodlines, making descendants culpable by birth.*  
  - **Branch A2.3.2: Nation or culture** → **Leaf: Collective National Guilt**  
    *Most awkward commitment: Must hold that nations/cultures are timeless moral agents, obliging all members to atone for history.*  

  ---

  #### **Branch B: Focus on Descendants' Present Actions**  
  **Level 2B: Are present actions perpetuating or mitigating the historical wrong?**  
  *(Focuses on current agency: harm vs. repair.)*  
  - **Branch B1: Perpetuating the wrong** → Go to Level 3B  
  - **Branch B2: Mitigating the wrong (or failing to)** → Go to Level 3C  

  **Level 3B (Perpetuating): Who bears responsibility for perpetuation?**  
  *(Assigns blame for ongoing harm.)*  
  - **Branch B1.1: Individual descendants** → **Leaf: Active Perpetuation**  
    *Most awkward commitment: Must admit to personally continuing harm, even if unaware or unintentional.*  
  - **Branch B1.2: State or institutions** → **Leaf: Institutional Perpetuation**  
    *Most awkward commitment: Must concede that institutions inherit guilt if they uphold past systems, regardless of reforms.*  
  - **Branch B1.3: Collective (nation, lineage, or culture)** → **Leaf: Cultural Perpetuation**  
    *Most awkward commitment: Must blame one's culture/nation for sustaining injustice, demanding disavowal or exit.*  

  **Level 3C (Mitigating or failing to): What is owed, and to whom?**  
  *(Based on duty to respond.)*  
  - **Branch B2.1: To living victims** → **Leaf: Restorative Duty**  
    *Most awkward commitment: Must prioritize victims' needs over all else, even if costly or futile.*  
  - **Branch B2.2: To the descendants themselves (e.g., for integrity)** → **Leaf: Moral Self-Purification**  
    *Most awkward commitment: Must sacrifice self-interest for symbolic cleansing, with no external obligation.*  
  - **Branch B2.3: To no one (duty exists but is impersonal)** → **Leaf: Abstract Responsibility**  
    *Most awkward commitment: Must act on behalf of justice itself, without expecting recognition or resolution.*  

  ---

  ### **Test Case Placements**
  Each case is placed at the node where it "does real work" by forcing a key distinction. Positions are derived from the tree, not retrofitted.

  1. **Farmer working disputed land**:  
     - At **Level 4A, Branch A2.1.2 (Benefits)** → **Unjust Enrichment Liability**  
     *Why: The land's benefits force a choice about enrichment, not identity or state.*

  2. **Woman with grandfather's photo**:  
     - At **Level 4A, Branch A2.1.1 (Identity)** → **Identity-Based Guilt**  
     *Why: Her hidden photo reflects identity-based unease; she lost nothing, so benefits don't apply.*

  3. **Town maintaining a monument**:  
     - At **Level 3A, Branch A2.2 (State)** → **State Continuity Liability**  
     *Why: Municipal use of public funds implicates the state as a continuing institution.*

  4. **Great-granddaughter adopting victims' faith and claiming guilt**:  
     - At **Level 4A, Branch A2.1.3 (No direct connection)** → **Metaphorical Taint**  
     *Why: Her voluntary faith shift creates a self-imposed duty without lineage/benefits.*

  5. **Grandson working for the ministry**:  
     - At **Level 3B, Branch B1.2 (State/institutions)** → **Institutional Perpetuation**  
     *Why: His role in the institution highlights present-day perpetuation, not past deeds alone.*

  6. **Man renouncing inheritance**:  
     - At **Level 4A, Branch A2.1.2 (Benefits)** → **Unjust Enrichment Liability**  
     *Why: Immediate renunciation centers on benefits, not identity or perpetuation.*

  7. **Woman abroad asked to apologize for family**:  
     - At **Level 4B, Branch A2.3.1 (Lineage)** → **Familial Taint**  
     *Why: The demand assumes guilt flows through family, overriding her lack of ties.*

  ---

  ### **Notes on Unoccupied or Indistinct Positions**
  - **Incoherent combinations**:  
    - *Identity-based guilt + focus on present actions*: Identity is inherently past-oriented. If a character emphasizes present actions, they must shift to Active Perpetuation or Restorative Duty.  
    - *State liability + no connection to deed*: The state's continuity requires institutional ties (e.g., same laws). A descendant with no ties (e.g., emigrant) defaults to individual branches.  
  - **Unattractive/unexplored combinations**:  
    - *Moral self-purification + owed to victims*: Mixing self-focused duty with victim claims creates tension (is it for them or you?). Rarely held, as it risks narcissism.  
    - *Collective guilt + no descent mechanism*: If guilt doesn't "descend" (e.g., via culture, benefits), the position collapses. All collective leaves require a descent claim.  
  - **Indistinguishable cases**:  
    - The woman with the photo (case 2) and the ceremony (case 7) cannot be separated if both cite lineage. Family identity (photo) and familial taint (ceremony) share the node at **Level 4B, Branch A2.3.1**. The tree treats them as one position (Familial Taint), as no question splits voluntary vs. involuntary lineage claims without arbitrariness.

  ---

  ### **Tree Summary**
  - **Leaves (13)**: Full Rejection, State Continuity Liability, Identity-Based Guilt, Unjust Enrichment Liability, Metaphorical Taint, Familial Taint, Collective National Guilt, Active Perpetuation, Institutional Perpetuation, Cultural Perpetuation, Restorative Duty, Moral Self-Purification, Abstract Responsibility.  
  - **Depth**: 5 levels (Level 1 → 2A/2B → 3A/3B/3C → 4A/4B → leaves).  
  - **Use in novel**: Assign positions by answering questions sequentially (e.g., a character who focuses on ancestors, accepts guilt, cites lineage → Familial Taint). For the appendix, readers can self-test via the questions.  
  - **Testing**: Cases 1, 3, 4, 5, 6, and 7 fit cleanly; case 2 overlaps with 7 but is resolved at the lineage node. All positions have distinct "awkward commitments" to prevent character collapse.  

  This tree isolates core tensions (e.g., guilt vs. benefit, past vs. present) to force divergence. Use it as a writing tool to map character arcs, then refine for nuance.
