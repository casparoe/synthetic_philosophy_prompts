  - Grandson in ministry: If the ministry is still doing harm, Active Perpetrator (leaf 10). If not, but he is part of the institution that did it, State Continuity (leaf 6) or if his own actions (e.g., covering up), Contemporary Complicity (leaf 5).
  - Man renouncing inheritance: Unjust Enrichment Liability (leaf 4).
  - Ceremony abroad: Familial Taint (leaf 8).

