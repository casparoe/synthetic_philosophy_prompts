answer: |-
  Here are five numbered items as specified:

  1. **Core Disagreement**: We fundamentally dispute whether human cognition and behavior are best explained primarily by numerous domain-specific psychological adaptations sculpted by natural selection in ancestral environments, or primarily by domain-general learning mechanisms interacting flexibly with present-day social and ecological conditions to produce adaptive outcomes.

  2. **Cross-Cultural Universality as Evidence**:
      *   **Adaptationist Position**: A trait's reliable emergence across diverse cultures, especially under varying learning conditions, constitutes strong evidence for an innate, domain-specific adaptation shaped by natural selection. *Predicts*: Universality persists even when cultural transmission or obvious reinforcement is disrupted.
      *   **Critic Position**: Cross-cultural universality is readily explained by convergent domain-general learning operating on universally recurring structures in human social life (e.g., kinship, reciprocity, threat) or by cultural transmission of highly functional solutions. *Predicts*: Universality diminishes or alters significantly when specific learning opportunities or cultural inputs are experimentally manipulated or absent in isolated populations.
      *   **Agreed Test Case**: The development and expression of incest avoidance mechanisms across cultures, examining variations in kinship recognition cues and learning environments.

  3. **Cheater-Detection & the Wason Task**:
      *   **Adaptationist Prediction**: The performance boost on the social contract version of the Wason task reflects a dedicated cheater-detection module. This module should remain engaged even if the logical rule is "switched" (e.g., "If you *don't* take the benefit, then you *don't* have to satisfy the requirement"), as long as the context involves detecting violations of a conditional social exchange. *Predicts*: Performance remains high on logically identical switched-rule social contracts.
      *   **Critic Prediction**: The boost stems from the permission/obligation schema making the task pragmatically clearer, not a specific cheater module. This framing advantage disappears if the rule is switched, making violation detection pragmatically confusing or unnatural. *Predicts*: Performance drops significantly on switched-rule social contracts compared to standard social contracts, mirroring abstract rule performance.
      *   **Pre-Registered Test**: Compare accuracy and response times on four Wason tasks within-subjects: (a) Abstract (If vowel, then even number), (b) Standard Social Contract (e.g., "If you take the benefit, you must satisfy the requirement" - check Benefit takers & Requirement *violators*), (c) Logically Identical Switched Social Contract (e.g., "If you *do not* satisfy the requirement, you *cannot* take the benefit" - check Requirement *violators* & Benefit takers), (d) A different framing control. Pre-registered prediction: Adaptationist expects (b) = (c) > (a); Critic expects (b) > (c) ≈ (a).

  4. **Environment of Evolutionary Adaptedness (EEA) Utility**:
      *   **Adaptationist Position**: Invoking the EEA generates unique, testable predictions about design features (e.g., specific triggers, biases, or inefficiencies) that would be functional in ancestral environments but not predictable from, or may even be maladaptive in, modern environments. It provides essential historical context for understanding adaptations. *Predicts*: Traits exhibiting "mismatch" to modern environments reveal their EEA-adapted function.
      *   **Critic Position**: References to the EEA often provide unfalsifiable, post-hoc justifications for observed traits. Predictive power resides solely in analyzing current fitness consequences and phenotypic plasticity in response to present-day ecological variation. *Predicts*: Present-day fitness measures and plasticity models explain trait variation better than EEA-based hypotheses.
      *   **Settling Observation**: Discovering a trait with a clear, complex design feature that is *currently* fitness-reducing but would have been highly advantageous in a specific, reconstructible ancestral environment with no plausible alternative explanation (e.g., a specific pathogen-avoidance response triggered *only* by cues absent in the modern world but common ancestrally).

  5. **Massive Modularity vs. Domain-General Machinery**:
      *   **Crux**: Whether the mind consists of many functionally specialized, innate computational modules (massive modularity) or relies more heavily on fewer, domain-general processes (e.g., associative learning, executive function) that produce domain-specific *outcomes* through interaction with input and feedback. The dispute is substantive, not purely verbal.
      *   **Decisive Evidence Both Accept**:
          *   Neuropsychological Dissociations: Highly specific, acquired deficits affecting one domain (e.g., face recognition) while sparing closely related ones (e.g., object recognition) support modularity; broad deficits across domains support general mechanisms.
          *   Developmental Invariance: Early emergence of complex, domain-specific competence with minimal relevant input supports innate modules; gradual development tightly coupled to specific experiences supports learning.
          *   Cross-Species Comparisons: Human-unique, complex cognitive abilities perfectly matched to unique human selective pressures support dedicated modules; abilities showing smooth continuity or relying on mechanisms shared for general learning support domain-general processes.
      *   **Predictions**:
          *   **Modularist**: Predicts numerous, specific dissociations, early competence with poverty-of-stimulus, and human-unique complex modules.
          *   **Domain-Generalist**: Predicts broad deficits from localized damage, gradual development dependent on input, and human cognition built upon evolutionarily conserved general mechanisms amplified by culture.
