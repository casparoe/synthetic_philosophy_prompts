prompt: |-
  I'm helping set up an adversarial collaboration for a journal special issue, and the two people involved have been sniping at each other for years: one is a card-carrying adaptationist evolutionary psychologist (massive modularity, environment-of-adaptedness reasoning, cheater-detection modules, the whole stack) and the other is a critic who thinks most of that literature is just-so stories that don't replicate, and that the real adaptation work gets done by measuring present-day fitness payoffs and plasticity rather than by positing stone-age modules. They're both sharp and arguing in good faith, so what I need is the statement they could actually both put their names to -- not a summary of who's winning.

  Give it to me as exactly five numbered items, no intro, no closing paragraph, a sentence or two each:

  1) the one thing they both sign about what the fight is actually about, and make it non-vacuous -- I don't want "we agree evidence matters";
  2) the crux over whether a trait being cross-culturally universal is evidence of an adaptation or is equally well explained by domain-general learning and cultural transmission, with each side's own position written so that side would accept the wording, plus the evidence or case both agree bears on it and what each predicts about it;
  3) the crux over the cheater-detection stuff -- whether people's good performance on the social-contract version of the Wason selection task shows a dedicated cheater-detection mechanism, or just shows that permission/obligation framing helps, which would predict the boost disappears under a logically identical but "switched" rule; give me a pre-registered-ish design both would accept as the test, with both sides' advance predictions;
  4) the crux over the environment-of-adaptedness move -- does invoking an ancestral environment do any predictive work you couldn't get from present-day ecology, or is it an unfalsifiable gloss, and is there any observation that would actually settle it;
  5) the crux over massive modularity vs. domain-general machinery, including what evidence (dissociations, developmental data, cross-species comparisons) both would treat as decisive and what each side would predict.

  No citations or reading lists please, they can't be looked up anyway, and don't hedge everything into mush -- if some part of their dispute turns out to be purely verbal, say so in whichever item it belongs to.
