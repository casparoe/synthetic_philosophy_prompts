prompt: |-
  I spent 30 years as a clinical pathologist — my whole job was looking at tissue and telling people whether it was normal or not — and I retired about six years ago. Since then I've been sitting in on a philosophy seminar at the local university, and I've gotten hung up on one thing the group keeps dancing around alot: when you call something a disease, are you reporting a fact about the body, or making a value call about a life? I don't want another discussion where everybody agrees it's "both." I want to run an activity that makes them feel both pulls in their hands.

  Setting: the seminar is 16 people, a mix of grad students and retirees like me, and I get 90 minutes to run the whole session myself. No lecture from me up front.

  Here's my sketch — tell me if it works, and fix what doesn't. I want the full runnable version: rules, materials, a timeline, the debrief, and where it'll blow up.

  Split the room into four tables of four. Each table gets a deck of about a dozen "intake" cards. Every card describes a made-up condition (invent the conditions, please — I don't want anybody's real diagnosis on the table) in plain physiology, and each card comes with two printed lines. The first line is from a made-up device I'm calling the Function Panel: for the mechanism named on the card, it reports whether that mechanism is pulling its statistically typical weight for survival and reproduction — typical, below typical, or above typical. The second line is the person's own attitude: wants it gone, wants to keep it, indifferent.

  Before they sort anything, each table has to write and sign one sentence: a condition counts as a disease exactly when ____. Then they sort every card into DISEASE or NOT A DISEASE. Here's the part I care about: I'm the referee, and the signed sentence is binding. If they call a card a disease, their sentence has to cover it. If they want an exception, they have to amend the sentence in writing, out loud, and the amendment binds them for every card after. Each table starts with three chips; every amendment costs a chip; a table that runs out is told it's "rule" is now just a list and sits out the last round.

  Then I hand out a second small deck built to break the rules I expect them to write. I'm thinking: a mechanism that's clearly below typical but the person is glad to have it and lives a long happy life; a below-typical mechanism that's statistically universal past a certain age; a condition with nothing wrong on the Panel at all that everybody in the room still flinches at; a below-typical mechanism that turns out to be protective in one environment and a liability in another; a condition only one culture files under disease; and a below-typical mechanism the person insists is just who they are. Add or swap cases as you see fit, but keep them invented.

  The payoff moment should be when I lay all the signed sentences and amendments on the table and read them back in order, and they hear the value-words creeping in — harmful, unwanted, gets in the way of a good life — because the pure-biology versions kept forcing them to call things diseases they wouldn't. That's the thing I want them to feel before I say a word about it.

  So: give me the runnable design, the card list with the two printed lines for each, the referee script, the debrief that maps what happened onto the two camps (I think there are standard names for the two poles, I can never keep them seperate — put the labels on at the end), what predictably goes wrong the first time and how to handle it, and an honest note on what this setup can't show them and I'll have to supply myself.
reasoning: |-
  We are creating a 90-minute seminar activity for 16 people, split into four tables of four. The goal is to explore the tension between biological facts and value judgments in defining "disease."

  Materials:
  - Four sets of 12 intake cards (one set per table). Each card has:
    1. A description of a made-up condition in plain physiology.
    2. A "Function Panel" line: reports whether the mechanism is typical, below typical, or above typical for survival and reproduction.
    3. The person's attitude: wants it gone, wants to keep it, indifferent.

  - A second deck of 6 challenge cards per table (same for all tables) designed to break common rules.

  - Chips: 3 per table (to be used for amendments).

  - Paper and pens for each table to write their rule and amendments.

  - A timer.

  - A whiteboard or flip chart for the facilitator to record the initial rules and amendments.

  Timeline (90 minutes total):
  1. Introduction (5 minutes)
  2. Rule Writing (10 minutes)
  3. First Sorting Round (15 minutes)
  4. Challenge Round (20 minutes)
  5. Group Discussion and Reading of Rules (25 minutes)
  6. Debrief (15 minutes)

  Detailed Steps:

  1. Introduction (5 minutes)
     - Explain the activity: "Today we're going to explore what it means to call something a disease. Each table has a deck of cards describing made-up conditions. Your first task is to agree on a one-sentence rule that defines when a condition counts as a disease. Then you'll sort the cards accordingly. The rule you write is binding. If you find a card that doesn't fit, you can amend your rule, but each amendment costs one chip. If you run out of chips, you can't amend anymore and you'll have to sort the rest without changing the rule. After the first deck, I'll give you a second set of cards designed to challenge your rule."
     - Emphasize: "The rule must be a single sentence, and you must all sign it. Then, when sorting, if you call a condition a disease, your rule must cover it. If you want to make an exception, you must amend the rule in writing, out loud, and that amendment applies to all subsequent cards."

  2. Rule Writing (10 minutes)
     - Each table has 10 minutes to write and sign one sentence: "A condition counts as a disease exactly when [their rule]."
     - Collect the rules and write them on the board for all to see (without comment).

  3. First Sorting Round (15 minutes)
     - Each table sorts their first deck of 12 cards into DISEASE or NOT A DISEASE.
     - They must use their rule. If a card doesn't fit, they can amend the rule (cost: one chip) and then sort that card. The amendment must be written and signed, and then the facilitator collects the amendment and records it (e.g., on the board under their rule).
     - They continue until they sort all 12 or run out of chips (and then must sort the rest without amending).

  4. Challenge Round (20 minutes)
     - Hand out the second deck (6 cards) to each table.
     - Repeat the sorting process with the same rule (and any amendments) and the same chip count (if they have chips left, they can use them for amendments; if not, they must sort without amending).
     - This deck is designed to be harder and to break the rules.

  5. Group Discussion and Reading of Rules (25 minutes)
     - Bring the whole group together.
     - Lay out the initial rules and all amendments (in order) for each table on a central table or board.
     - Read each table's initial rule and then the amendments in the order they were made.
     - Highlight how the rules evolved and the language used (especially when value words like "harmful", "unwanted", etc., appear).
     - Ask each table to share one card that was particularly hard to sort and why.

  6. Debrief (15 minutes)
     - Map the experience to the philosophical concepts: 
       - The "naturalist" view: disease is a deviation from normal biological functioning (based on facts about the body).
       - The "normativist" view: disease involves a value judgment about harm or undesirability.
     - Point out how the initial rules often started with naturalist criteria (e.g., "below typical function") but then amendments introduced normativist elements (e.g., "and it causes harm" or "and the person wants it gone").
     - Discuss the tension: the Function Panel gives objective data, but the person's attitude and context matter too.
     - Note that in real life, many conditions (like the ones in the challenge deck) blur the lines.

  Predictable Problems and Solutions:
  - Problem: A table might write a very vague rule to avoid amendments.
    Solution: As referee, challenge vagueness. Require the rule to be specific enough to be testable. Example: if they write "when it's not normal", ask: what does "normal" mean? (They must define it in terms of the Function Panel: typical, below, above?).

  - Problem: A table might try to sort without amending when the rule doesn't fit.
    Solution: As referee, watch and if they put a card in DISEASE without the rule covering it, ask: "How does your rule cover this?" If it doesn't, they must amend (and pay a chip) or move the card to NOT A DISEASE.

  - Problem: Running out of time in the sorting rounds.
    Solution: Keep strict time. After 15 minutes in the first round, call time and have them stop. In the challenge round, after 20 minutes, stop them. Unfinished cards are set aside and discussed in the group discussion as "unsorted because of time" and the table explains how they would have sorted them and why.

  - Problem: A table runs out of chips early and feels stuck.
    Solution: This is by design. They will have to sort the remaining cards even if they don't like the outcome. This forces the issue. In the discussion, they can express their frustration, which illustrates the inflexibility of a purely biological definition.

  What the Setup Can't Show:
  - The activity uses made-up conditions to avoid real-world sensitivities, but it might not capture the full emotional weight of real diagnoses. You might need to point out that in real life, the stakes are higher.
  - The activity focuses on individual conditions, but in reality, social and cultural factors play a huge role in defining disease (e.g., through medical institutions and insurance systems). You may need to mention that in the debrief.
  - The Function Panel simplifies biological functioning to three levels. Real biology is more complex (e.g., trade-offs, multiple functions). You can note that in the debrief.

  Card Design:

  First Deck (12 cards per table - examples below. Each table gets the same set):

  1. Condition: "Chronic Hiccups"
     - Function Panel: Below typical (interferes with eating and breathing efficiency)
     - Attitude: Wants it gone

  2. Condition: "Enhanced Night Vision"
     - Function Panel: Above typical (allows better navigation in low light)
     - Attitude: Wants to keep it

  3. Condition: "Fast Metabolism"
     - Function Panel: Above typical (burns calories quickly, requires frequent eating)
     - Attitude: Indifferent

  4. Condition: "Slow Healing"
     - Function Panel: Below typical (wounds take longer to close, increasing infection risk)
     - Attitude: Wants it gone

  5. Condition: "Extra Finger"
     - Function Panel: Typical (no functional impairment)
     - Attitude: Wants it gone (for cosmetic reasons)

  6. Condition: "No Sense of Smell"
     - Function Panel: Below typical (reduces ability to detect dangers like smoke or spoiled food)
     - Attitude: Indifferent (has adapted)

  7. Condition: "High Pain Threshold"
     - Function Panel: Above typical (allows endurance of injuries without distress)
     - Attitude: Wants to keep it

  8. Condition: "Fragile Bones"
     - Function Panel: Below typical (bones break easily)
     - Attitude: Wants it gone

  9. Condition: "Perfect Pitch"
     - Function Panel: Above typical (enhanced auditory discrimination)
     - Attitude: Wants to keep it

  10. Condition: "Chronic Itching"
      - Function Panel: Below typical (causes skin damage from scratching)
      - Attitude: Wants it gone

  11. Condition: "Double-Jointed Thumbs"
      - Function Panel: Typical (no impairment, may even help in some tasks)
      - Attitude: Wants to keep it (finds it useful)

  12. Condition: "Low Blood Pressure"
      - Function Panel: Below typical (may cause dizziness, reducing physical activity)
      - Attitude: Wants it gone

  Challenge Deck (6 cards per table):

  1. Condition: "Reverse Seasonal Affective Disorder"
     - Function Panel: Below typical (the person becomes lethargic and sleeps more in summer, reducing activity during optimal foraging time)
     - Attitude: Wants to keep it (loves winter sports and is happier in winter; lives a long, happy life)
     - Designed to break: Below typical but the person is happy and lives well.

  2. Condition: "Age-Related Joint Stiffness"
     - Function Panel: Below typical (reduces mobility and flexibility)
     - Attitude: Indifferent (it's just part of aging, and the person accepts it)
     - Designed to break: Statistically universal past a certain age. Is it a disease or normal aging?

  3. Condition: "Third Eyelid"
     - Function Panel: Typical (the person has a nictitating membrane that occasionally blurs vision for a second, but no functional impairment; in fact, it protects the eye)
     - Attitude: Wants it gone (because it looks strange and causes social stigma)
     - Designed to break: Nothing wrong on the Panel, but the person and society flinch.

  4. Condition: "Salt Craving Gene"
     - Function Panel: Below typical (causes high salt intake, which in modern environments leads to hypertension; but in a low-salt environment, it prevents hyponatremia)
     - Attitude: Wants it gone (because the person lives in a city with salty food and has hypertension)
     - Designed to break: Protective in one environment, a liability in another.

  5. Condition: "Spirit Sight"
     - Function Panel: Typical (the person sees patterns in natural phenomena that others don't; no impairment, but no survival advantage either)
     - Attitude: Wants to keep it (it is central to their role as a shaman in their culture)
     - Note: In one culture, it's revered; in another, it might be called a hallucination disorder.
     - Designed to break: Only one culture files under disease.

  6. Condition: "Heightened Empathy"
     - Function Panel: Below typical (the person feels others' emotions so intensely that it causes distress and avoidance of social situations; reduces reproductive opportunities)
     - Attitude: Insists it is just who they are (doesn't want it gone; sees it as part of identity)
     - Designed to break: Below typical but the person identifies with it.

  Referee Script:

  - During rule writing: Circulate and ensure rules are one clear sentence. If vague, ask: "What does that mean in terms of the Function Panel?" or "How would you test this with the data on the card?"
  - During sorting: 
     - If a table puts a card in DISEASE: "Does your rule cover this? How?" 
     - If they say yes but it's not clear: "Point to the part of your rule that applies." 
     - If it doesn't: "It seems your rule doesn't cover this. You can either amend your rule (cost: one chip) or move the card to NOT A DISEASE."
     - If they amend: They must write the amendment (one sentence added to the rule) and sign it. Collect the amendment and record it.
     - If they run out of chips: "You have no more chips, so you must sort without amending. Please continue."
  - Challenge round: Same as above.

  Debrief Plan:

  1. Start by having each table share their initial rule and how it changed (read the amendments in order).
  2. Point out the language: "Notice how your rule started with biological terms (like 'below typical') but then you added things like 'and it causes harm' or 'and the person wants it gone'. That's the value judgment creeping in."
  3. Introduce the two poles:
     - Naturalist (or objectivist) view: Disease is a biological dysfunction (rooted in facts about the body).
     - Normativist (or subjectivist) view: Disease is a condition that is disvalued (rooted in values).
  4. Discuss the challenge cards: 
     - Card 1: Below typical but happy. Is it a disease? (Naturalist: yes; normativist: no, because no harm is experienced.)
     - Card 2: Normal aging. Is it a disease? (Naturalist: it's a dysfunction; normativist: if it doesn't bother the person, maybe not.)
     - Card 3: Social stigma. Is it a disease? (Naturalist: no dysfunction; normativist: if it causes distress, maybe yes.)
     - Card 4: Environment matters. Is it a disease? (Naturalist: it's dysfunctional in this environment; normativist: the person wants it gone because it causes harm here.)
     - Card 5: Cultural variation. Is it a disease? (Highlights that value judgments are social.)
     - Card 6: Identity. Is it a disease? (Even if biologically dysfunctional, if the person doesn't want to change it, is it a disease?)

  5. Conclude: "In medicine, we often see this tension. As a pathologist, I focused on the biological facts, but in the clinic, the patient's experience and values are crucial. This activity shows that defining disease is not just a scientific question but also a value-laden one."

  Honest Note:
  - The activity simplifies by using invented conditions and a binary Function Panel. Real medicine deals with complex, multifactorial conditions and varying degrees of dysfunction. Also, the activity focuses on individual cases, but in reality, disease definitions are influenced by societal structures and power dynamics (e.g., medicalization of normal life events). You might want to mention these complexities briefly.

  This design should achieve the goal of making participants feel the tension between biological facts and value judgments in their own rule-making and sorting.
answer: |-
  Below is a runnable, detailed design for your 90-minute seminar session. It includes a step-by-step timeline, card lists, referee script, debrief structure, and notes on potential pitfalls and limitations. The goal is to create a visceral experience where participants **feel** the tension between biological facts ("naturalist" view) and value judgments ("normativist" view) when defining disease.

  ---

  ### **Activity Design: "Defining Disease"**
  **Goal:** Force participants to confront the tension between objective biological dysfunction and subjective value judgments when labeling something a "disease."  
  **Core Tension:** Naturalist view (disease = biological fact) vs. Normativist view (disease = value judgment about harm/desirability).  
  **Group Size:** 16 people (4 tables of 4).  
  **Time:** 90 minutes total.  
  **Materials Needed:**  
  - 4 identical decks of 12 "Intake Cards" (one per table).  
  - 4 identical decks of 6 "Challenge Cards" (one per table).  
  - 4 sets of 3 poker chips (one set per table).  
  - Paper and pens for each table.  
  - Whiteboard or large paper for public rule-tracking.  
  - Timer.  

  ---

  ### **Timeline & Rules**  
  **Total Time:** 90 minutes  
  1. **Introduction (5 min):**  
     - Briefly frame the session: "Today, you’ll define what makes something a disease. You’ll create a rule, apply it to cases, and amend it when it fails. The rule is binding—no exceptions unless you amend it publicly."  
     - Key rules:  
       - Each table must write **one sentence** defining disease: "A condition counts as a disease exactly when ______." Everyone signs it.  
       - Use the Function Panel (biological data) and the person’s attitude (value data) on cards to sort into DISEASE or NOT A DISEASE.  
       - If your rule doesn’t cover a case, you **must** amend your sentence (verbally and in writing) to include it. Each amendment costs one chip.  
       - If you run out of chips, you can’t amend further—you must follow your rule as written.  
     - Emphasize: "I’m the referee. If you call something a disease, I’ll ask how your rule justifies it. No hand-waving!"  

  2. **Rule Creation & First Sorting (25 min):**  
     - **Step 1 (10 min):** Tables write and sign their one-sentence rule. Referee (you) collects rules and writes them publicly.  
     - **Step 2 (15 min):** Tables sort their 12 Intake Cards. Referee circulates, enforcing rules strictly.  
       - If a table sorts a card as DISEASE, ask: "How does your rule cover this?"  
       - If the rule doesn’t fit, they must amend (e.g., "Add: ‘and the person wants it gone’"). Amendments are written/signed, announced aloud, and cost 1 chip. Referee records amendments publicly.  
       - If chips run out, they sort remaining cards without amendments.  

  3. **Challenge Round (20 min):**  
     - Hand out 6 Challenge Cards per table.  
     - Repeat sorting with the same rule/amendments. Referee enforces strictly.  
     - Tables with chips left can use them for amendments; others must follow their rule as is.  

  4. **Group Share-Out (25 min):**  
     - Each table reports: (1) Initial rule, (2) Amendments made, (3) One card that broke their rule.  
     - Referee lays all rules/amendments on a table, reading them in order of creation: "Table 1 started with: ‘[rule]’. Then amended to: ‘[amendment]’ after Card X."  
     - Highlight creeping value-language (e.g., "harmful," "unwanted").  

  5. **Debrief (15 min):**  
     - Map the tension to philosophy (naturalism vs. normativism), then open discussion.  

  ---

  ### **Card Decks**  
  Each card includes:  
  - **Condition:** Made-up physiological description.  
  - **Function Panel:** Biological status (typical/below typical/above typical for survival/reproduction).  
  - **Attitude:** Person’s subjective view.  

  #### **Intake Cards (12 per table)**  
  *Designed to tempt tables toward simple biological definitions (e.g., "all below typical = disease").*  
  1. **Slow-Acting Liver**  
     - *Function Panel:* Below typical (detoxifies slowly, increasing poisoning risk).  
     - *Attitude:* Wants it gone.  
  2. **Rapid Muscle Growth**  
     - *Function Panel:* Above typical (builds strength quickly but strains the heart).  
     - *Attitude:* Wants to keep it.  
  3. **Thin Skin**  
     - *Function Panel:* Below typical (tears easily, prone to infection).  
     - *Attitude:* Wants it gone.  
  4. **High Oxygen Efficiency**  
     - *Function Panel:* Above typical (excels in endurance activities).  
     - *Attitude:* Indifferent.  
  5. **Fragile Teeth**  
     - *Function Panel:* Below typical (easily damaged, impairs chewing).  
     - *Attitude:* Wants it gone.  
  6. **Night Vision Adaptation**  
     - *Function Panel:* Above typical (sees clearly in darkness; daylight causes headaches).  
     - *Attitude:* Wants to keep it.  
  7. **Fast Metabolism**  
     - *Function Panel:* Above typical (burns energy quickly; requires constant eating).  
     - *Attitude:* Indifferent.  
  8. **Weak Immune Response**  
     - *Function Panel:* Below typical (frequent severe infections).  
     - *Attitude:* Wants it gone.  
  9. **Double-Jointed Fingers**  
     - *Function Panel:* Typical (no functional impact).  
     - *Attitude:* Wants it gone (cosmetic dislike).  
  10. **Low Pain Sensitivity**  
      - *Function Panel:* Below typical (fails to detect injuries, leading to unnoticed damage).  
      - *Attitude:* Wants to keep it (proud of toughness).  
  11. **Extra Kidney**  
      - *Function Panel:* Above typical (improved filtration; no downsides).  
      - *Attitude:* Indifferent.  
  12. **Brittle Hair**  
      - *Function Panel:* Typical (no survival/reproduction impact).  
      - *Attitude:* Wants it gone (social embarrassment).  

  #### **Challenge Cards (6 per table)**  
  *Designed to "break" common rules. Each targets a flaw in purely biological definitions.*  
  1. **Reverse Seasonal Fatigue**  
     - *Function Panel:* Below typical (lethargy in summer reduces foraging efficiency).  
     - *Attitude:* Wants to keep it (loves winter; lives happily to 100).  
     - *Breaks:* Below typical but person is glad/lives well.  
  2. **Age-Related Stiff Joints**  
     - *Function Panel:* Below typical (reduces mobility in 80% of people over 70).  
     - *Attitude:* Indifferent ("just part of aging").  
     - *Breaks:* Statistically universal in a group. Is aging a disease?  
  3. **Emotional Tear Reflex**  
     - *Function Panel:* Typical (no dysfunction; tears release stress hormones).  
     - *Attitude:* Wants it gone (seen as a "weakness" in their culture).  
     - *Breaks:* Biologically typical, but socially stigmatized.  
  4. **Salt-Retaining Hormone**  
     - *Function Panel:* Below typical (causes hypertension in modern diets).  
     - *Attitude:* Wants it gone.  
     - *Hidden Context:* In low-salt environments, it prevents dehydration (protective).  
     - *Breaks:* Environment-dependent harm.  
  5. **Spirit Dreaming**  
     - *Function Panel:* Typical (vivid dreams; no biological impact).  
     - *Attitude:* Wants to keep it (central to their spiritual identity).  
     - *Cultural Note:* In one culture, this is revered; in another, it’s labeled "hallucination disorder."  
     - *Breaks:* Cultural relativism.  
  6. **Hyper-Empathy**  
     - *Function Panel:* Below typical (overwhelming emotional absorption; avoidant of crowds).  
     - *Attitude:* Indifferent ("this is who I am").  
     - *Breaks:* Person sees it as identity, not dysfunction.  

  ---

  ### **Referee Script**  
  **During Rule Creation (10 min):**  
  - "Your sentence must be clear and testable—no vague terms like ‘abnormal’ without defining them. I’ll reject rules like ‘when it’s harmful’ unless you specify how harm is measured."  
  - If a table writes a broad rule (e.g., "all below typical function"): Let it stand—they’ll suffer in sorting.  

  **During Sorting (First Round - 15 min):**  
  - Approach a table after they place a card: "Why is this DISEASE/NOT based on your rule? Show me the part of your sentence that applies."  
  - **If rule doesn’t fit:** "Your rule doesn’t cover this. You must amend it (cost: 1 chip) or change your sort. If you amend, write it down, sign it, and announce it."  
  - **If they resist:** "Remember: your rule is binding. No ‘special cases’ without an amendment."  
  - **If chips run out:** "No amendments left. Follow your rule as written."  

  **During Challenge Round (20 min):**  
  - Same as above, but push harder: "Card 5 (Spirit Dreaming) is sorted as NOT DISEASE? But your rule says ‘below typical function’—this is typical. Explain."  

  **During Group Share-Out (25 min):**  
  - Read rules/amendments dramatically: "Table 2’s rule began as ‘below typical function.’ After Card 10 (Low Pain Sensitivity), they amended to ‘below typical function AND unwanted.’ Then, after Card 3 (Emotional Tear Reflex) in the challenge round, they added ‘OR causes social harm.’"  
  - Highlight value-language: "Notice how ‘unwanted’ and ‘harm’ crept in. Why did biology alone fail you?"  

  ---

  ### **Debrief (15 min)**  
  1. **Map the Tension (5 min):**  
     - "Today, you felt two pulls:  
       - **Naturalism:** Disease as a biological fact (‘below typical function’).  
       - **Normativism:** Disease as a value judgment (‘unwanted’ or ‘harmful’).  
       Your rules started naturalist but became normativist to avoid calling happy/long-lived people ‘diseased’."  
     - Point to amendments: "You paid chips to add value words because biology alone forced you to call things diseases that felt wrong (e.g., Reverse Seasonal Fatigue)."  

  2. **Connect to Real Philosophy (5 min):**  
     - "Naturalists (e.g., Boorse) say disease is objective dysfunction. Normativists (e.g., Engelhardt) say it’s tied to harm/suffering.  
     - Today showed why pure naturalism fails:  
       - *Aging* isn’t called disease, but it’s biologically suboptimal.  
       - *Hyper-Empathy* is dysfunctional but part of identity.  
     - Normativism has flaws too: If ‘harm’ is subjective, disease becomes arbitrary (e.g., Spirit Dreaming)."  

  3. **Group Reflection (5 min):**  
     - "When did you feel most uncomfortable? Was it when biology clashed with values (e.g., Low Pain Sensitivity)? Or when culture/environment mattered (e.g., Salt-Retaining Hormone)?"  
     - End with your insight: "As a pathologist, I saw biology as fact. But today shows why medicine can’t escape values. A ‘disease’ label isn’t just about tissue—it’s about lives."  

  ---

  ### **Where It’ll Blow Up (Predictable Problems & Fixes)**  
  1. **Problem:** Tables write overly broad/vague rules to avoid amendments (e.g., "when it’s not ideal").  
     - **Fix:** Reject vague rules upfront: "Define ‘ideal’ using the Function Panel or attitude."  

  2. **Problem:** A table uses all chips early and protests when stuck.  
     - **Fix:** Lean in: "This is the point! If disease were purely biological, you’d call a happy person with Reverse Seasonal Fatigue ‘diseased.’ Do you still want that?"  

  3. **Problem:** Emotionally charged debates (e.g., defending Hyper-Empathy as identity).  
     - **Fix:** Redirect to the rule: "I hear your passion—but does your rule allow this exception? If not, amend or sort."  

  4. **Problem:** Time runs out during sorting.  
     - **Fix:** Announce time warnings: "5 minutes left!" Incomplete sorts become discussion fodder: "How would your rule handle this?"  

  5. **Problem:** A table ignores the Function Panel/attitude and sorts based on instinct.  
     - **Fix:** Enforce strictly: "You called Thin Skin a disease. The Function Panel says ‘below typical,’ but your rule requires ‘unwanted.’ The attitude is ‘wants it gone,’ so it fits. But if your rule didn’t include ‘unwanted,’ you’d need an amendment."  

  ---

  ### **What This Setup Can’t Show (And You’ll Need to Mention)**  
  - **Power Dynamics:** Real-world disease definitions are shaped by institutions (e.g., pharmaceutical companies, insurance). This activity focuses on individual judgments, not systemic influences.  
  - **Chronic/Complex Conditions:** Made-up cards simplify biology. Real diseases involve interactions (e.g., depression’s blend of biology and experience).  
  - **Evolutionary Trade-offs:** The Function Panel oversimplifies "function." In reality, traits can be adaptive in one context and harmful in another (e.g., sickle-cell trait).  
  - **Social Constructs:** While cultural relativism is hinted at (Spirit Dreaming), the activity can’t show how norms shift over time (e.g., homosexuality’s removal from DSM).  

  **Closing Note:** This design creates a physical sense of tension—participants literally "pay" (with chips) to add values to their rules. By the debrief, they’ll feel why medicine isn’t pure biology. Your role as referee is crucial: be firm, question relentlessly, and let them struggle. Their frustration is the lesson.
