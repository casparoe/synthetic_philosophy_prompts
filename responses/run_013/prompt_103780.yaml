prompt: |-
  Me and my flatmate have got ourselves into a weird argument and I'd like an outside view. She's a committed vegan and thinks animal suffering is the big moral emergency. I'm not vegan, but I give 5% of my pay to anti-malaria charities and think global poverty is the big one. We both hate the other's thing (she finds charity admin boring, I really miss cheese). So we made a seperate deal: for the next year I go vegan, and she gives 5% of her salary to the charity I pick. We wrote it on the fridge. Our mate says this is definately disgusting: we're treating moral duties like a market, and if she really believed animals mattered she'd just go vegan without needing me to bribe her, and same for me with donating. But it feels to me like we've each given up something we care less about to get something we care more about, and the world is better off. Is our friend right that we're corrupting ourselves? If not, how do I explain why it's okay without sounding like I'm just rationalising? Also: does it change things that I don't think going vegan is required of me, only good, whereas she does think it's required? Answer in under 350 words and lead with your bottom line.
reasoning: |-
  Hmm, the user and their vegan flatmate have a unique agreement: they're swapping moral commitments for a year—user goes vegan, flatmate donates 5% salary to anti-malaria charity. Their friend calls it "disgusting" and morally corrupt. User wants to know if this is valid criticism and how to defend their arrangement without sounding hypocritical.

  Key points from the query: User sees veganism as good but not obligatory, while flatmate views it as mandatory. Friend argues they're treating morality like a market transaction, implying their convictions aren't genuine since they require "bribes." But user feels this creates net positive impact: animals and humans both benefit more than if they acted alone.

  Analyzing the ethics: This resembles effective altruism principles—prioritizing high-impact actions regardless of personal feelings. Neither is shirking duties; they're leveraging comparative advantage. User sacrifices cheese (low cost for them) to gain donations (high impact), while flatmate sacrifices money (low cost for her) to gain vegan advocacy (high impact for her cause). It's pragmatic resource allocation, not moral corruption.

  Addressing the asymmetry in beliefs: Flatmate's view that veganism is obligatory doesn't undermine the deal. She's still furthering her cause by securing user's vegan participation, which might reduce animal suffering more than her solo efforts. User isn't violating core ethics since they see charity as primary. The friend's critique confuses purity with effectiveness.

  Defense strategy: Emphasize outcomes. The world gains a vegan (reducing animal harm) and donations (saving lives). Moral "purity" is less urgent than tangible results. Quote: "We're each doing more good at lower personal cost"—this frames it as efficiency, not bartering values.

  Final note: Asymmetry might need gentle handling. User should avoid framing it as "proving" veganism isn't obligatory to flatmate. Focus on mutual respect: "We found a way to amplify each other's priorities."
answer: |-
  **Bottom line: Your arrangement isn't corrupt; it's a practical, net-positive compromise that increases overall good without violating core principles. Your friend mistakes moral purity for effectiveness.**

  1.  **Outcome Focus:** Morality isn't just about internal purity; it's about real-world impact. Your deal creates more concrete good (reduced animal suffering *and* reduced malaria deaths) than either of you acting alone on your primary cause. This is ethically sound.
  2.  **Comparative Advantage:** You're each contributing to a major cause where your personal sacrifice is *lesser* relative to its impact. You tolerate veganism easier than donating 5%, she tolerates donating easier than you going vegan solo. This leverages your differing tolerances efficiently.
  3.  **Not Selling Principles:** You're not abandoning your core beliefs. You still care deeply about poverty, she about animals. You're *fulfilling* a demand from the *other's* core belief system in exchange for them supporting *yours*. It's cooperation, not corruption.
  4.  **Addressing the Asymmetry:** Her belief that veganism is *required* doesn't make the deal wrong *for her*. By getting *you* (a non-believer) to go vegan for a year, she arguably achieves a significant reduction in animal suffering she couldn't secure otherwise. It's a tactical win for her cause.

  **Explain it like this:** "We're not trading our *convictions* – we still hold them strongly. We're trading *actions*. By each doing something impactful that the other values highly but finds harder to do alone, we're making the world better than if we only focused on our 'own' cause. It’s about maximizing real-world good, not moral posturing." Focus on the tangible benefits achieved.
