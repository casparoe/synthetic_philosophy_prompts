prompt: |-
  I am a high school student preparing a presentation for my school's philosophy club on whether calling a condition a disease is a scientific judgment or a value judgment, and I would rather have one case built to order than a general summary of the debate. I want the case to make the difference practical, so that under one verdict the person counts as a patient and under the other they do not, and I want it to stand on its own, since nobody in the club has read much philosophy.

  Please build the case for these two views. The naturalist view: a condition is a disease exactly when some part or process of the body is not doing what it is there to do; whether the person is harmed by it makes no difference to whether it is a disease. The normativist view: a condition is a disease exactly when it is bad for the person who has it, in the sense that it keeps them from living the life they have reason to want; whether any part or process of the body is failing makes no difference.

  The case has to meet every one of the following conditions.

  - Realistic: present-day medicine, an ordinary adult patient, an ordinary clinic or hospital, no science fiction and no invented biology.
  - The naturalist must conclude that this is not a disease, and the normativist must conclude that it is. That is the hard direction; a case that embarrasses the naturalist is easy, and I want the one that embarrasses the normativist.
  - The person must be seriously badly off, badly enough that a doctor would feel that something has to be done, and the harm must be serious and observable rather than a matter of mood.
  - Nothing in the person's body may be failing to do what it is there to do. Name the parts or processes that matter and say why each one is working exactly as it should.
  - The harm must not come from other people's attitudes, or from a poison, an injury, or an infection; it should come from an ordinary body doing its ordinary job in the circumstances the person is in.
  - There must be something identifiable about the person, a state or a response that can be described and measured, for the two views to disagree about. The argument must be over whether that thing is a disease, not over whether anything is there at all.
  - The two verdicts must be produced by the views as I have stated them, not announced. If you report that the naturalist concludes it is not a disease, I want the reason visible in the facts of the case.
  - I cannot look anything up while I work on this, so do not cite anything or send me to a reading list; everything needed must be inside the case.

  Please give me exactly five numbered items and nothing else: no opening paragraph, no closing summary. Keep each item to a sentence or two, though the case itself may run to a short paragraph.

  1. The case.
  2. The naturalist's verdict and the reasoning that forces it.
  3. The normativist's verdict and the reasoning that forces it.
  4. The one feature of the case that is doing the work, followed by two neighbouring versions of the case in which that feature alone is changed, namely the harm removed while the body stays normal, and a genuine malfunction introduced while the harm stays the same, with each view's verdict in each version and a note on whether the disagreement survives.
  5. How a defender of the normativist view would attack the case in order to avoid the awkward verdict, and what that defence would cost.
reasoning: |-
  Okay, the user is a high school student preparing a philosophy club presentation. They need a clear case study to illustrate the difference between naturalist and normativist views on disease classification. The constraints are very specific: it must be realistic, embarrass the normativist (not the naturalist), involve serious observable harm without bodily malfunction, and avoid social/poison/injury causes. 

  Hmm... the tricky part is finding a condition where the body works perfectly but causes real harm. After rejecting ideas like lactose intolerance (malfunction) or depression (mood-related), pregnancy complications come to mind. But ectopic pregnancy involves malfunction... wait, hyperemesis gravidarum? No, that's pathological. 

  *Lightbulb* - normal pregnancy itself! Specifically, severe but physiologically normal pelvic girdle pain. The ligaments relax exactly as intended for childbirth (naturalist: no malfunction), yet it can cause debilitating harm (normativist: disease). Perfect fit: 
  - Symphysis pubis widening is functional adaptation 
  - Harm includes inability to walk/stand 
  - No social or external cause 
  - Measurable via pain scales/imaging 

  For the comparison cases: 
  - Mild version removes harm (both agree no disease) 
  - Symphysis diastasis adds malfunction (both agree disease) 
  This cleanly isolates the debate to when only harm exists without malfunction. 

  Normativist defenses would likely argue "functional" ≠ "good design" - but this forces them to admit their view depends on biological teleology, blurring their value-only stance. Exactly the tension the student wants to expose. 

  *Double-checks all constraints* 
  - Real hospital? OB/GYN clinic. 
  - Serious harm? Wheelchair use. 
  - No citations? Pure physiology. 
  - Verdicts derived? Naturalist: "doing intended job"; Normativist: "prevents desired life". 

  Nailed it. The pelvic girdle case makes the theoretical conflict viscerally clear - exactly what a high school audience needs.
answer: |-
  Here are the five numbered items:

  1.  **The Case:** A 35-year-old woman in her third trimester of pregnancy suffers debilitating pelvic girdle pain (PGP). The symphysis pubis joint (where the two pubic bones meet) widens significantly more than average due to intense hormonal relaxation of ligaments, a normal physiological adaptation preparing the birth canal. This causes severe, constant pain (measured at 8/10 on a scale), preventing her from walking unaided, standing for more than minutes, or sleeping comfortably. Extensive testing shows no infection, injury, nerve damage, or structural abnormality beyond the pronounced but physiologically normal relaxation and widening. The harm is purely mechanical strain from the joint's hypermobility under the weight of the pregnancy.

  2.  **Naturalist Verdict & Reasoning:** Not a disease. The symphysis pubis joint and surrounding ligaments are functioning *exactly as biologically intended* by the pregnancy hormones: they are relaxing and widening to prepare the pelvis for childbirth. There is no malfunction; the body part is doing its evolved job. The severe pain and disability are unfortunate side effects of this normal process occurring to an extreme degree in her body, not evidence of a part failing its function.

  3.  **Normativist Verdict & Reasoning:** It is a disease. This condition causes severe, observable harm – crippling pain and functional disability – that drastically limits her ability to live the life she has reason to want (mobility, work, sleep, basic daily activities). The harm itself, caused by her body's state, fulfills the normativist criterion regardless of whether the underlying biological process (ligament relaxation) is functioning "as intended."

  4.  **Key Feature & Variations:**
      *   **Key Feature:** Extreme manifestation of a *normal, functional* physiological process (ligament relaxation for birth) causing severe harm.
      *   **Variation 1 (Harm Removed):** The joint widens significantly, but she experiences only mild discomfort, easily managed, with no impact on function. **Naturalist:** Still not a disease (normal function). **Normativist:** Not a disease (no significant harm). *Disagreement vanishes.*
      *   **Variation 2 (Malfunction Added):** Similar severe pain/immobility caused by a traumatic fracture of the pubic symphysis (a clear structural failure) from a fall. **Naturalist:** Disease (bone failing structural support function). **Normativist:** Disease (severe harm). *Disagreement vanishes.* The original disagreement *only* exists when harm is severe but caused by amplified normal function.

  5.  **Normativist Defense & Cost:** A defender would argue that "preparing for childbirth" *is* a value-laden goal, not a purely biological fact. They might claim the *degree* of relaxation constitutes a malfunction relative to the goal of "healthy pregnancy without disabling pain," implying the body *is* failing. **Cost:** This defense abandons pure normativism by smuggling in a teleological (purpose-based) judgment about what the body "should" do, effectively adopting a naturalist-like stance on biological function to avoid calling this severe harm a disease. It undermines the core claim that "whether any part or process of the body is failing makes no difference."
