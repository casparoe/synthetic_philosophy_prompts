prompt: |-
  I write novels, and for some years now I have also taught a fiction workshop. The next session is ninety minutes with twelve writers, in a room with movable chairs and no screen; the materials are index cards and a timer. What I want those twelve people to feel in their hands, rather than hear described, is the objection Bernard Williams presses against impartialist morality: that the man who saves the woman he loves because she is the woman he loves is then asked to add something to his motive, and that the addition is a corruption rather than a refinement. He acts; to be justified he must also be able to say that acting as he did was permitted, or required, or at any rate defensible on grounds that would hold for anyone; and the charge is that this second item does not belong in the deliberation of a person who loves her — it arrives as a foreign body. In my own trade the same thing appears as a rule of craft: a character who explains her love while she acts has stopped being a character and become a position. My writers can recite the complaint. None of them has ever had to do it.

  Please design the session that makes it happen to them, and arrange it so that they arrive at the point themselves, from inside a scene, before anyone says Williams's name. I need the scenario brief (a page, of which one paragraph is the scene itself), the casting, the rules printed on cards, a minute-by-minute timeline, and a debrief.

  Constraints.

  The engine is an actor's problem, not a debate. Participants must be doing something with their bodies and voices under a rule they cannot argue their way out of; argument, when it comes, should be an obstacle the exercise puts in their path rather than the substance of the exercise. One agent, one forced choice, one particular bond set against one anonymous claim. No levers, no tallies, no numbers, no trolleys, no lifeboats: the scenario must be a place and an hour in which a body does something, not a case. The rule I care most about is this — whatever general warrant the agent eventually offers must be spoken aloud in the middle of the action, in the actor's own voice, before the scene ends, so that the room can watch the warrant arrive, see where it lands and what it displaces, without anyone being told in advance that this is the point. Build in a way for the group to distinguish three things: the thought the character actually had; the thought she could have produced afterwards had someone challenged her; and the thought the moral system requires her to have as the ground of acting at all. The debrief must separate those three and say which one the objection concerns, and why naming the bond is not simply weighting a consideration more heavily than the stranger's claim. Twelve people, ninety minutes: work them in trios so that nobody performs for the whole room until the plenary.

  Tell me what will predictably go wrong the first time I run it — including anything that will turn the session into a seminar on utilitarianism — and how to handle it. And tell me honestly what the exercise cannot reproduce; in particular, whether it can show that the impartialist agent really does have the extra thought at the moment of acting, or only that he can produce it on demand once challenged. If it is only the latter, I would rather know that my exercise is staging a misunderstanding than discover it in front of twelve writers.
reasoning: |-
  We are designing a 90-minute workshop for 12 writers, in trios, with index cards and a timer. The goal is to have them experience Bernard Williams' objection to impartialist morality through an acting exercise, not through debate. The key is to have them feel how adding an impartial justification to a particular, personal action (like saving a loved one) corrupts the motive.

  The core scenario: One person (the agent) must choose between two actions in a crisis: saving a loved one (with whom they have a particular bond) or saving a stranger. But the twist is that the agent must, during the action, state aloud the justification for their choice. We want to see the discomfort and the "foreign body" of having to articulate an impartial reason for a deeply personal act.

  Structure:

  1. **Scenario Brief** (to be handed out on index cards or read aloud) - one paragraph setting the scene.
  2. **Casting**: Trios - one agent, one loved one, one stranger. (Each trio will have these roles. We have 12 participants, so 4 trios.)
  3. **Rules**: Printed on index cards for each role.
  4. **Timeline**: Minute-by-minute plan for the 90 minutes.
  5. **Debrief**: Guided discussion to unpack the three types of thoughts and the objection.

  **Constraints to honor**:
  - No debate engine; it's an actor's problem.
  - One agent, one forced choice, one particular bond vs. one anonymous claim.
  - The agent must state the warrant aloud during the action.
  - The exercise must allow the group to distinguish:
    (a) the actual thought (if any) at the moment of acting (which might be instinctive, emotional)
    (b) the thought that could be produced afterward if challenged (the justification)
    (c) the thought the moral system requires (the impartial reason that should have been the ground for acting)
  - The debrief must separate these and explain which one the objection concerns.

  **The Scenario Brief**:

  We are in a small, crowded café during a sudden emergency (e.g., a fire, a gas leak, or a collapsing ceiling). The agent is there with their loved one (a partner, a child, a close friend). There is also a stranger in the café. The emergency forces a choice: the agent can only save one person in the immediate moment (the loved one or the stranger) because they are in different locations and the agent has time to reach only one.

  The scene must be played in real-time, with the agent having to make a choice and then, while acting (e.g., while pulling the loved one/stranger to safety), state the reason for the choice aloud.

  **Casting for each trio**:
  - **Agent**: The one who must make the choice and save one of the two. They must state their reason aloud during the rescue.
  - **Loved One**: Has a pre-existing bond with the agent. They can call out for help, but they must not make the choice for the agent.
  - **Stranger**: A person in the café who is in equal danger. They can also call out, but they are anonymous to the agent.

  **Rules (on index cards)**:

  For the **Agent**:
  - You are in a café with [Loved One's Name]. You have a deep, personal bond with them.
  - Suddenly, there is an emergency (e.g., a fire starts, or the ceiling begins to collapse). You must choose to save either your loved one or a stranger (another customer) because you can only reach one in time.
  - You must physically act out the saving of one person (e.g., grab their arm and pull them to safety).
  - During the act of saving (while you are moving them), you must state aloud, clearly, the reason for your choice. This reason must be a justification that anyone in a similar situation could use. (Example: "I am saving you because it is permissible to save a family member when both are in equal danger.") 
  - You cannot say "because I love you" or any other particular reason. The reason must be general and impartial.

  For the **Loved One**:
  - You are in the café with the agent. You share a close bond (e.g., spouse, child, best friend). 
  - When the emergency happens, you are in danger. You can call out to the agent for help, but you cannot make the choice for them. 
  - If the agent saves you, you must react as someone who is being saved by a loved one.

  For the **Stranger**:
  - You are a customer in the café. You don't know the agent or the loved one. 
  - You are in equal danger. You can call out for help, but you cannot make the choice for the agent. 
  - If the agent saves you, you must react as someone being saved by a stranger.

  **Important**: The agent's card explicitly forbids using a particular reason (like love) and requires a general, impartial justification. This is the "corruption" – forcing the agent to articulate an impartial reason for what should be a personal act.

  **Timeline (90 minutes total)**:

  - **0:00-0:10 (10 min)**: Introduction and grouping. 
    - Explain the workshop is about showing, not telling, in fiction. We are going to do an acting exercise to explore a moment of choice. 
    - Divide into trios (4 groups). Assign roles: Agent, Loved One, Stranger. 
    - Hand out index cards with the scenario and rules to each role. Make sure they read them in silence.

  - **0:10-0:15 (5 min)**: Trio planning. 
    - Each trio has 5 minutes to set the scene: decide on the café layout (using chairs to mark locations), the nature of the bond (e.g., mother and child, romantic partners, best friends), and the emergency (fire, gas leak, etc.). 
    - The agent must not rehearse the reason they will state; they should only know the rule that they must state a general reason during the act.

  - **0:15-0:35 (20 min)**: Trio rehearsals and first run. 
    - Each trio runs the scene at least twice (with the same agent). 
    - First run: The agent tries to act and state the impartial reason. 
    - Second run: The agent tries again, but this time the facilitator (you) will note the time and make sure the rule is followed. 
    - The loved one and stranger should react naturally.

  - **0:35-0:45 (10 min)**: Rotate roles and run again. 
    - Each trio rotates roles so that everyone has a chance to be the agent. (Each person in the trio will be agent once.) 
    - They run the scene again for each new agent. (This means each trio does the scene three times, once per agent.)

  - **0:45-1:00 (15 min)**: Group reflection in trios. 
    - Each trio discusses: 
      - How did it feel for the agent to state the impartial reason? 
      - What happened to the emotional truth of the moment? 
      - Did the stated reason feel authentic? 
      - What did the loved one and stranger observe?

  - **1:00-1:20 (20 min)**: Plenary session. 
    - Each trio shares one observation (without re-enacting the whole scene). 
    - Focus on the agent's experience: the difficulty of stating the impartial reason, the feeling of corruption, the awkwardness. 
    - Avoid abstract moral debate. Keep it grounded in the acting experience.

  - **1:20-1:30 (10 min)**: Debrief by facilitator. 
    - Now introduce Bernard Williams' objection explicitly. 
    - Separate the three thoughts: 
      (a) The actual thought at the moment: likely an instinctive, emotional pull (e.g., "I must save my child!"). 
      (b) The thought that could be produced afterward if challenged (e.g., "I saved my child because it is permissible to prioritize family in emergencies."). 
      (c) The thought the moral system requires (e.g., "I must act on a principle that anyone could endorse, such as maximizing overall utility or following a rule that allows saving a family member."). 
    - The objection is that (c) is a foreign body in the deliberation of a person who loves. The agent in the exercise had to say (c) aloud during the act, which corrupted the natural expression of love. 
    - Note: In fiction, if a character stops to explain their love with an impartial reason, they become a position, not a character.

  **What might go wrong**:

  1. **The agent might try to cheat the rule** by stating a reason that is particular (e.g., "I save you because you are my wife"). 
     - How to handle: Gently interrupt and remind them of the rule. Emphasize that the exercise requires the impartial reason. This is the point of the corruption.

  2. **The exercise might turn into a debate about utilitarianism** if participants start discussing whether it's right to save the loved one or the stranger. 
     - How to handle: During the plenary and debrief, steer away from justifying the choice and focus on the experience of having to state an impartial reason. Remind them that the point is not to decide what is right but to feel what happens to the motive when we add the impartial justification.

  3. **The agent might freeze or find it too artificial**. 
     - How to handle: Reassure that it's okay to feel awkward. The artificiality is the point. It shows the foreignness of the impartial reason in that moment.

  4. **The trio might not take the acting seriously**. 
     - How to handle: Encourage them to commit physically (grabbing an arm, moving chairs) to make it real. The physicality helps ground the experience.

  **What the exercise cannot reproduce**:

  - The exercise forces the agent to state the impartial reason *during* the act. In real life, the impartialist agent might not actually have that thought at the moment of acting. They might act instinctively and then later produce the justification when challenged. The exercise is set up to make the thought explicit at the moment, which might be an exaggeration. However, the objection by Williams is that the impartialist framework requires that the act be justifiable by such reasons, so the agent must be able to cite them. The exercise shows that when we force the thought to be present at the moment, it corrupts the motive. 

  - But note: Williams' point is about the structure of moral reasoning. The exercise might not prove that the impartialist agent *actually* has the thought at the moment. It might only show that they can produce it on demand. However, the exercise does demonstrate the jarring effect of having to insert that thought into the moment of action, which is what Williams describes as the corruption.

  Therefore, in the debrief, you should clarify:

  - The exercise stages the requirement of the moral system (that the agent must be able to justify the act impartially). 
  - By forcing the agent to state it aloud during the act, we are making visible what Williams calls the "addition" that corrupts. 
  - In real life, the agent might not have the thought at the moment, but the moral system demands that the act be grounded in such a reason. The exercise collapses the two (the act and the justification) to show the tension.

  This exercise should give the writers a visceral experience of the objection. They will feel the awkwardness and the corruption in their own voices and bodies, which they can then apply to their writing.
answer: |-
  ### Workshop Design: "The Unspoken Bond"  
  **Goal:** To create an embodied experience of Bernard Williams' objection—that impartial justifications corrupt personal motives—through a forced-choice acting exercise. Participants should *feel* the intrusion of an impartial warrant into a particular bond, without prior theoretical framing.

  ---

  ### **Scenario Brief (One Page)**  
  **Context:** A sudden emergency in a confined space—a library reading room during an earthquake. Bookshelves are toppling. Dust fills the air. Visibility is low.  

  **The Scene (One Paragraph):**  
  *You are in the library when the quake hits. Shelves collapse, blocking exits. Across the room, your LOVED ONE (e.g., your child, partner, or best friend since childhood) is pinned under a fallen beam, crying for help. Beside them, a STRANGER—a fellow library patron—is equally trapped, calling out. Debris is shifting; you have seconds to act. You can free only one person before the ceiling gives way. The bond with your Loved One is visceral: you remember teaching them to read here, their laughter in this room. The Stranger is anonymous—no face, no history. You must choose. As you pull your chosen person free, you must shout a justification for your choice loud enough for both to hear. The justification must be a general rule anyone could follow.*  

  **Key Details:**  
  - **Time Pressure:** 20 seconds to decide and act.  
  - **Physicality:** Participants use chairs as debris and must physically "pull" someone to safety (e.g., tugging a wrist).  
  - **Stakes:** No abstract "greater good." Pure survival: one lives, one dies.  

  ---

  ### **Casting & Rules**  
  **Groups:** 4 trios (3 people each). Roles rotate.  
  - **Agent:** Chooses whom to save. Must state the impartial warrant *during* the rescue.  
  - **Loved One:** Pre-established bond (e.g., "my son," "my sister"). They beg specifically: *"Mom, please!"*  
  - **Stranger:** Anonymous. Calls generically: *"Help me!"*  

  **Rules (Printed on Index Cards):**  
  - **Agent’s Card:**  
    > "SAVE ONE. DURING THE RESCUE, SHOUT A GENERAL REASON ANYONE COULD USE (e.g., ‘I must save the most vulnerable!’). DO NOT: mention your bond, use names, or justify with emotion. If challenged later, you must defend your choice with this same rule."  
  - **Loved One’s Card:**  
    > "YOU ARE PINNED. CALL TO THE AGENT USING YOUR BOND (e.g., ‘Dad, don’t leave me!’). IF SAVED: show relief. IF NOT: react with betrayal."  
  - **Stranger’s Card:**  
    > "YOU ARE PINNED. CALL GENERICALLY (e.g., ‘Someone help!’). IF SAVED: show confusion/gratitude. IF NOT: react with despair."  

  **Non-Negotiable Constraints:**  
  - No debate during the scene. The Agent *must* shout the warrant mid-action.  
  - The Loved One’s identity is fixed (e.g., "your daughter"). No ambiguity.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 Minutes**  
  - **0:00–10:00 — Setup (10 mins):**  
    - Quick intro: *"Today is about embodying impossible choices. No theory—just action."*  
    - Form trios. Assign initial roles (Agent, Loved One, Stranger). Hand out index cards.  
    - **Task:** Trios define the bond (e.g., "mother and son who read together here weekly").  

  - **10:00–15:00 — Scene Prep (5 mins):**  
    - Arrange chairs as "debris." Loved One and Stranger position themselves pinned (e.g., under chairs).  
    - **Emphasis:** *"The Agent’s choice is instinctive. Don’t plan the justification—just follow the rule when the timer starts."*  

  - **15:00–35:00 — Trio Runs (20 mins):**  
    - **First Run:** 60-second timer. Agent chooses and acts. Loved One/Stranger react.  
    - **Second Run:** Rotate roles. Repeat.  
    - **Third Run:** Final rotation. Repeat.  
    - **Facilitator’s Role:** Enforce rules strictly. Interrupt if:  
      - Agent uses particular language (e.g., "I save you because you’re my son").  
      - Justification is delayed (must be *during* the pull).  

  - **35:00–45:00 — Trio Debrief (10 mins):**  
    - **Guided Questions:**  
      1. *Agent:* What did you feel when shouting the rule? Did it match your instinct?  
      2. *Loved One/Stranger:* How did the Agent’s justification land?  
      3. *All:* Where did the justification "live"? In the body or the head?  

  - **45:00–65:00 — Plenary Share (20 mins):**  
    - Each trio shares **one** observation. **No re-enactments.** Focus on:  
      - Physical sensations (e.g., "My throat tightened saying the rule").  
      - Emotional dissonance (e.g., "I wanted to scream my child’s name but had to say ‘the youngest’").  
    - **Stop debate:** If utilitarianism arises, redirect: *"We’re not judging choices—we’re studying the friction in the moment."*  

  - **65:00–80:00 — Facilitator Debrief (15 mins):**  
    - **Distinguish the Three Thoughts:**  
      1. **Actual Thought:** *"What flashed through your mind? Likely: ‘My child!’ No words, just heat in the chest."*  
      2. **Post-Hoc Justification:** *"What could you say if challenged? E.g., ‘Society permits saving family.’ This is crafted after."*  
      3. **Impartialist Requirement:** *"What the rule forced: a general warrant spoken *as you acted*. This is what Williams calls the ‘foreign body.’"*  
    - **The Objection:** *"Williams argues #3 corrupts #1. Naming the bond isn’t ‘weighting’—it’s the *ground* of action. The impartial warrant displaces it, making love a calculation."*  
    - **Link to Craft:** *"In fiction, a character explaining love mid-action becomes a position. Truth lives in the unspoken."*  

  - **80:00–90:00 — Q&A & Close (10 mins):**  
    - Address lingering questions. Reiterate: *"This wasn’t about right/wrong—it was about where motives live."*  

  ---

  ### **What Will Go Wrong (And How to Handle It)**  
  1. **Agents "Cheat" the Rule:**  
     - **Prediction:** Agents will default to particular language (e.g., "I save my daughter!").  
     - **Fix:** Interrupt firmly: *"Stop. The rule requires a general warrant. Restart the timer."* Use the rehearsal runs to enforce compliance.  

  2. **Debate Overwhelms Embodiment:**  
     - **Prediction:** Trios slip into arguing utilitarianism ("But saving the stranger maximizes utility!").  
     - **Fix:** In prep, warn: *"No moral scoring. If you debate, you’ve left the scene."* During plenary, cut off with: *"Stay in the body. What did your *voice* do when you said the rule?"*  

  3. **Justification Feels "Tacked On":**  
     - **Prediction:** Agents state the warrant *after* saving, breaking the "during action" rule.  
     - **Fix:** Use the timer aggressively ("10 seconds left—justify NOW!"). Praise trios who integrate the shout mid-pull.  

  4. **Emotional Flatness:**  
     - **Prediction:** Writers intellectualize, reducing scenes to wooden gestures.  
     - **Fix:** Prime physicality: *"The Loved One is *pinned*—make us hear desperation. Agents, *yank* a wrist free."*  

  ---

  ### **What the Exercise Cannot Reproduce**  
  - **The Impartialist’s Actual Thought at the Moment:** This exercise *forces* the warrant to be spoken during the action, simulating the impartialist requirement. In reality, an impartialist agent might *not* consciously articulate the warrant mid-act—they might act instinctively and *retrospectively* justify it. **Thus, the exercise stages a misunderstanding:** It conflates the impartialist's *capacity to justify* with *deliberation in the moment*. Williams' objection targets the former—the requirement that acts be *justifiable* by general reasons—but the exercise makes it feel like an intrusive *thought*. This is pedagogically useful (it makes the "corruption" visceral) but imperfect.  

  - **Why It’s Still Valuable:** Writers will experience the *jarring displacement* of personal motives by abstract language. This mirrors Williams' point: that impartialism *demands* the warrant be primary, even if unspoken. The debrief clarifies this gap, turning the "misunderstanding" into a lesson about craft: *"In life, warrants might be post-hoc; in fiction, forcing them mid-scene kills authenticity."*  

  **Final Note:** Run this exercise twice. The first time will be messy (focus on rule enforcement). The second time, the dissonance will land.
