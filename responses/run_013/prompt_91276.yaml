  For the procedure structure: start with Fuller's principles because they're the gatekeepers—if a rule wasn't law, enforcers can't hide behind "just following orders." Prioritize retroactivity, impossibility, and contradiction since they're common in authoritarian contexts. End with Hart's "was it valid?" as a formality—if it clears Fuller's bar, it was technically law, but punishing still needs retroactive legislation. 

  Ah, and the examples! The judge enforcing retroactive defeatism law likely fails Fuller on multiple counts (retroactive, possibly unpublished). The warden's incommunicado rule might violate generality if applied arbitrarily. But the procedure must admit when it's laundering politics—like judging what counts as "impossible" compliance, which involves moral calls. 

  Biggest gap: the test can't handle perpetrators who knew the rules were rotten but complied anyway. That's where the handoff to the board for "moral culpability" comes in—transparently outsourcing the tough calls. 

