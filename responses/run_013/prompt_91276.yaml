answer: |-
  Here’s a one-page intake procedure based on the Hart-Fuller debate, designed for efficiency and objectivity. It prioritizes Fuller’s 8 conditions of "inner morality of law" as a threshold test, then checks Hartian validity. **Stops are hard; no softening.**

  ---

  ### **INTAKE PROCEDURE: LEGITIMACY ASSESSMENT**  
  *(Based on Hart v. Fuller; 1-page max)*  
  **Goal:** Determine if the functionary acted under a "law" or an invalid rule.  
  **Outputs:**  
  ✅ **TAKE**: Rule failed Fuller’s test (never law → no defense).  
  🚫 **DROP**: Rule passed Fuller + Hart tests (was valid law → retroactive punishment needed).  
  📥 **BOARD**: Moral/political judgment required.  

  #### **QUESTIONS IN ORDER**  
  **Ask these about THE SPECIFIC RULE APPLIED by the functionary:**  
  1. **Was the rule RETROACTIVE?**  
     - *Sufficient "yes"*: Sanction applied to conduct before the rule existed.  
     - **STOP 🚫 if NO** (Proceed if YES).  

  2. **Was the rule SECRET/UNPUBLISHED?**  
     - *Sufficient "yes"*: Not accessible to those expected to comply.  
     - **STOP 🚫 if NO** (Proceed if YES).  

  3. **Was the rule IMPOSSIBLE TO COMPLY WITH?**  
     - *Sufficient "yes"*: Compliance was logically/physically unfeasible (e.g., "never think disloyal thoughts").  
     - **STOP 🚫 if NO** (Proceed if YES).  

  4. **Was the rule CONTRADICTORY?**  
     - *Sufficient "yes"*: Required conduct forbidden by another valid rule.  
     - **STOP 🚫 if NO** (Proceed if YES).  

  5. **Was the rule NON-GENERAL?**  
     - *Sufficient "yes"*: Applied only to specific persons/groups (not universal).  
     - **STOP 🚫 if NO** (Proceed if YES).  

  6. **Was the rule CHANGED TOO FREQUENTLY?**  
     - *Sufficient "yes"*: Amended/replaced weekly (or faster) → no stable compliance.  
     - **STOP 🚫 if NO** (Proceed if YES).  

  7. **Did OFFICIALS DISREGARD the rule?**  
     - *Sufficient "yes"*: Those enforcing it routinely ignored it (e.g., elites exempt).  
     - **STOP 🚫 if NO** (Proceed if YES).  

  8. **Did the rule lack CLARITY?**  
     - *Sufficient "yes"*: Unintelligible terms (e.g., "defeatism" undefined).  
     - **STOP 🚫 if NO** (Proceed if YES).  

  **If ANY answer is YES → Rule FAILED Fuller’s test**  
     - ✅ **TAKE CASE**: Not "law" → functionary cannot claim legal defense.  

  **If ALL answers are NO → Rule had Fuller’s "inner morality"**  
     - *Now ask:* **Was the rule VALID under Hart’s test?**  
       - *Sufficient "yes"*: Created per regime’s own procedures (e.g., signed by dictator, published in gazette).  
       - **🚫 DROP CASE if YES**: It was valid law → retroactive punishment required (political decision).  
       - **📥 BOARD if NO**: Rule violated regime’s own constitution/procedures (e.g., decree lacked authority).  

  **HANDOFF TO BOARD FOR:**  
  - Moral culpability assessment (e.g., "They knew it was wrong!").  
  - Political feasibility of retroactive legislation.  
  - Resource prioritization.  

  ---

  ### **APPLICATION TO EXAMPLES**  
  **1. The Judge (rubber-stamped executions under retroactive "defeatism" law):**  
  - Q1: **YES** (retroactive) → ✅ **TAKE CASE**.  
  - *Procedure stops here*. Fuller: Not law. Judge has no defense.  

  **2. The Warden (enforced incommunicado rule):**  
  - Assume the rule was *published, non-retroactive, possible* (physically isolate).  
  - Q5: **Was it NON-GENERAL?**  
    - *If selectively applied* (e.g., only to political prisoners) → **YES** → ✅ **TAKE CASE**.  
    - *If universally applied* → **NO** → proceed.  
  - Q7: **Did officials disregard it?**  
    - *If wardens exempted allies* → **YES** → ✅ **TAKE CASE**.  
    - *If uniformly enforced* → **NO** → 🚫 **DROP CASE** (Valid law under Hart-Fuller).  

  ---

  ### **WHERE THIS LAUNDERS POLITICS & LIMITATIONS**  
  1. **"Impossible to Comply" (Q3) & "Clarity" (Q8)**:  
     - *Laundering*: Deciding "impossible" or "unintelligible" is moral judgment (e.g., "defeatism" = vague to *us*).  
     - *Fix*: Strict evidence (e.g., regime’s own courts struggled with term).  

  2. **"Officials Disregarded Rule" (Q7)**:  
     - *Laundering*: Arbitrarily defines "routine disregard." How much exemption is too much?  
     - *Fix*: Require data (e.g., 30+% of cases ignored).  

  3. **Hart’s Validity Test**:  
     - *Limitation*: Accepts the regime’s corrupt procedures as legitimate. A decree *was* "law" if the dictator signed it.  

  4. **What It Can’t Do**:  
     - Assess **individual intent** ("I knew it was evil").  
     - Handle **systemic coercion** ("I’d be shot if I refused").  
     - Solve **resource constraints** (all "TAKE" cases may be unactionable).  
     - Replace **transitional justice policy** (amnesty? reparations?).  

  ---

  **STRAIGHT TALK**: This procedure **will drop cases** against functionaries who enforced *formally valid* horrors (e.g., the warden if rules were clear/general). That’s the Hartian price of legal clarity. The board must own retroactive legislation or accept that some enforcers walk. Fuller’s test catches blatantly pathological rules, but many atrocities wear a mask of legality. Your junior lawyer will flag the unambiguous outrages; the rest goes to the board for the messy moral fights.
