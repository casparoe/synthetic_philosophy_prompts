  The problem: the weights are multiplicative over rounds, but the points are additive. The linear weighting is done over the entire history. The weight for a branch is the product of the marks in each round. The points in the branch is the sum of the points per round. So we are computing:

    Sum_{branches} [ weight(branch) * (points in branch) ] / total_weight

  But the points in branch is the sum over rounds of the points in that round. So we can write:

    = [ Sum_{branches} weight(branch) * ( sum_{round i} points_i(branch) ) ] / total_weight
    = sum_i [ Sum_{branches} weight(branch) * points_i(branch) ] / total_weight

  Now, for a fixed round i, what is the contribution? 

  In round i, the weight of a branch is the mark in that round multiplied by the marks in the other rounds? But the weight is the product of all three marks. However, the point in round i depends only on the mark in round i and the wager chosen in round i.

  Moreover, the branches split independently. So for round i, we can factor:

    Sum_{branches} weight(branch) * points_i(branch) 
      = [product_{j != i} (9+3)] * [ sum_{mark_i} (mark_i * points_i(mark_i)) ]

  Because the weight is the product of the three marks, and for the other rounds, the sum over the branches in those rounds is (9+3) per round.

  So for round i, the numerator part is: (9+3)^2 * [ 9 * points_i(9) + 3 * points_i(3) ]

  And the total weight is (9+3)^3 = 12^3.

  So the contribution from round i is:
    [ (12^2) * (9 * points_i(9) + 3 * points_i(3)) ] / 12^3 
    = (9 * points_i(9) + 3 * points_i(3)) / 12

  For wager A: points_i(9)=0, points_i(3)=3 -> (9*0 + 3*3)/12 = 9/12=0.75

  So per round, the linear weighted average points is 0.75. Then for three rounds, the total is 0.75*3=2.25.

  But in our direct calculation we got 0.84375? That must be because I computed the entire branch without factoring. Let me check the direct calculation again:

  We had:
    k is the number of threes. For a branch with k threes, the weight = 9^(3-k)*3^k, and the points = 3k.

  Then the numerator = sum_{k} C(3,k) * (3k) * (9^(3-k)*3^k)

  But note: the weight for one branch is 9^(3-k)*3^k, and there are C(3,k) branches. So the numerator is:
    = sum_{k} C(3,k) * 3k * 9^(3-k)*3^k
    = 3 * sum_{k} C(3,k) * k * 9^(3-k) * 3^k

  Now, note that 9^(3-k) * 3^k = 9^3 * (3/9)^k = 729 * (1/3)^k? No, 9^(3-k)=9^3/9^k, and 3^k, so = 9^3 * (3^k / 9^k) = 729 * (1/3)^k? Actually, 3^k / 9^k = (3/9)^k = (1/3)^k.

  But let's compute without that:

  k=0: 0
  k=1: 3 * 3 * 1 * 9^2 * 3^1 = 3 * 3 * 81 * 3 = 3*3=9, 9*81=729, 729*3=2187? Wait, I did:

  Earlier:
    k=1: C(3,1)=3, k=1 -> 3 * (1) * (9^2) * (3^1) = 3 * 1 * 81 * 3 = 3*1=3, 3*81=243, 243*3=729? 

  Wait, the formula is: [C(3,k) * (3k) * (9^(3-k)*3^k)] for the branch? But no: the term for k is: we have C(3,k) branches, each with weight 9^(3-k)*3^k and each with points 3k. So the contribution for k is: C(3,k) * (3k) * (9^(3-k)*3^k)

  So for k=1: 3 * (3*1) * (9^2 * 3^1) = 3 * 3 * (81*3) = 3 * 3 * 243 = 9*243=2187

  Similarly, k=2: 3 * (3*2) * (9^1 * 3^2) = 3 * 6 * (9*9) = 18 * 81 = 1458
  k=3: 1 * (3*3) * (9^0 * 3^3) = 1 * 9 * (1 * 27) = 243

  k=0: 0

  So total numerator = 0 + 2187 + 1458 + 243 = 3888? 

  I see the mistake: in the weight, 9^(3-k)*3^k, but for k=1, 9^(3-1)=9^2=81, and 3^1=3, so 81*3=243. Then multiplied by the number of branches (3) and the points (3*1=3): 3 * 3 * 243 = 9*243=2187.

  But then total numerator = 2187 (k=1) + 1458 (k=2) + 243 (k=3) = 2187+1458=3645, +243=3888.

  Total weight = sum_{k} C(3,k) * 9^(3-k)*3^k = (9+3)^3 = 12^3=1728.

  Then average = 3888 / 1728 = let me compute: 3888 ÷ 1728. Simplify: divide numerator and denominator by 144: 3888÷144=27, 1728÷144=12 -> 27/12 = 9/4 = 2.25.

  Yes! So 2.25, which is 0.75 per round.

  Similarly, for the student who chose B and linear weighting: per round expected points 1.5, so total 4.5.

  Now for squared weighting: 
    Weight of a branch = (9^2)^(number of nines) * (3^2)^(number of threes) = 81^(3-k) * 9^k, where k=number of threes.

  Total weight = (81+9)^3 = 90^3 = 729000.

  For a branch with k threes, points = 2*(3-k) [for the student who chose B: they get 2 for each nine, and there are (3-k) nines].

  For the student who chose A, we would have points=3k, but we are now comparing for B.

  For B: points = 2*(number of nines) = 2*(3-k).

  Weight = 81^(3-k) * 9^k.

  Number of branches with k threes: C(3,k).

  So for the student who chose B:
    Numerator = sum_{k} C(3,k) * [2*(3-k)] * [81^(3-k) * 9^k]

  We can compute per round: 
    Per round, the squared weighting expected points = (81 * points(9) + 9 * points(3)) / 90
    For wager B: points(9)=2, points(3)=0 -> (81*2 + 9*0)/90 = 162/90 = 1.8

  So for three rounds: 5.4.

  Now, back to the activity.

  We will run 3 rounds. We'll use the same wagers in each round:

  Wager A: 0 in branch 9, 3 in branch 3.
  Wager B: 2 in branch 9, 0 in branch 3.

  We'll have the students choose either A or B in each round. We won't tell them how to choose; we want them to choose based on their intuition.

  Then, after 3 rounds, each student has 8 branches, each with a history of marks and accumulated points.

  Then, we ask: what is the student's score? We need a rule to aggregate the branches.

  We can have a class discussion: how should we combine the branches? The three methods will be proposed.

  We then compute the student's score by the three methods. We can do this for one volunteer student (or every student, but time is short). We'll see that the score depends on the method.

  Then, we ask: which method is right? Why?

  Now, we turn to quantum mechanics: in a similar branching (like a sequence of spin measurements), quantum mechanics predicts that the relative frequency of seeing a particular outcome (say, the branch with mark 9) should be about 9/10 (because the probability for 9 is 81/90=0.9). But note: in the branching, every branch exists. However, in a typical branch? What is typical? 

  If we weight branches equally (branch counting), then the proportion of branches with a given history is determined by the number of branches. For example, the proportion of branches with a specific sequence of outcomes is the same for every sequence? Yes, there is only one branch per sequence. So for 3 rounds, there are 8 branches, each with a different sequence. The number of nines in a sequence is k, and the proportion of branches with k nines is C(3,k)/8. The expected frequency of nines per branch is (0*1 + 1*3 + 2*3 + 3*1)/8 / 3? The frequency of nines in a branch is k/3. The average of k/3 over branches is ( (0/3)*1 + (1/3)*3 + (2/3)*3 + (3/3)*1 ) / 8 = (0 + 1 + 2 + 1) / 8 = 4/8 = 0.5.

  But quantum mechanics predicts 0.9. So if we use branch counting, we don't get the quantum frequencies.

  If we use linear weighting, then the weight of a branch is proportional to the product of the amplitudes (which are proportional to the marks). The expected frequency of nines in a branch is the weighted average of the frequency of nines in the branch. The frequency of nines in a branch is k/3, but k is the number of threes? Actually, the number of nines is 3-k.

  For a branch with k threes (so 3-k nines), the weight is 9^(3-k)*3^k.

  Then the weighted average of the frequency of nines = [ sum_{k} C(3,k) * ( (3-k)/3 ) * (9^(3-k)*3^k) ] / 12^3

  But per round, the weighted average of the outcome (whether it is 9) is: 
    (9 * 1 + 3 * 0) / 12 = 9/12 = 0.75.

  But quantum mechanics says it should be 0.9.

  If we use squared weighting, then per round: (81 * 1 + 9 * 0) / 90 = 81/90=0.9, which matches.

  So we see that only the squared weighting gives the quantum mechanical frequency.

  The activity should make the students feel the need for a measure, and then in the debrief we show that only the squared measure recovers the quantum frequencies.

  Now, the timeline:

  Total: 90 minutes.

  1. Setup and explanation: 15 minutes.
     - Explain the branching: each round, each world splits into two. The rule: one branch gets 9, the other gets 3, assigned by coin flip (but both exist). 
     - Show the wagers for the round (same every round). 
     - Each student starts with one world (index card). They write "World 1", points=0.
     - They choose wager for round 1 (A or B) and record it.
     - Facilitator flips a coin for round 1 (and records the assignment: heads-> left branch gets 9, right gets 3; tails-> left gets 3, right gets 9). [We can use left/right arbitrarily; we just need to label the two branches.]

     - Then, each student splits their world: they create two new cards. They label them (e.g., World 1A and World 1B). They record the mark for round 1 on each (according to the coin flip). Then, for each new branch, they add the points from the wager: for branch 1A: if it got mark 9, then look at what wager A pays for 9, etc.

     - They put the old card away (or we can have them update in place; we'll have them create new cards for the new branches).

     We'll have a template for the new branch cards:
          Branch ID: 
          History: (sequence of marks)
          Points from round 1: 
          Total points: (initially just the round 1 points)

     But we'll add points per round. Alternatively, they can just accumulate the total points on the card.

     After round 1, each student has two branches.

  2. Round 2: 10 minutes.
     - Students choose wager for round 2 (A or B) for both branches (they must choose the same wager).
     - Facilitator flips a coin for round 2.
     - Each student splits each of their current branches into two. For each branch, they create two new cards. They append the new mark (from round 2) to the history. Then, for each new branch, they add the points from the wager in round 2 to the previous total.

     Now they have 4 branches.

  3. Round 3: 10 minutes.
     - Same as round 2. After round 3, they have 8 branches.

  4. Aggregation and discussion: 40 minutes.
     - Ask: what is your total score? How should we combine the branches?
     - Let the students propose methods. We expect: 
          a) Sum the points and divide by the number of branches (branch counting).
          b) Weight each branch by the product of the marks (linear).
          c) Weight each branch by the product of the squares of the marks (squared).
          d) Other ideas?
     - Have the students compute their score by one method (e.g., branch counting) and then by another. They will see it varies.
     - Ask: which method is correct? Why?
     - Then, introduce the quantum mechanical fact: in a sequence of identical experiments, the frequency of a particular outcome (say, the mark 9) is not 50% (as in branch counting), not 75% (as in linear), but 90%. And only the squared weighting gives 90%.
     - Discuss the implications: the Born rule (squared weighting) is needed to recover the observed frequencies.

  5. Concluding remarks: 15 minutes.
     - Map the game to the many-worlds interpretation: 
          - The branching process is the unitary evolution.
          - The wagers represent choices the agent makes.
          - The aggregation problem: how should the agent care about the different branches?
          - The marks represent the amplitude (so the amplitude for a branch is proportional to the product of the marks along the history).
          - The Born rule says to use the squared amplitude.
     - What the activity doesn't do: it doesn't derive the Born rule. It shows that we need a measure, and that the squared measure is the one that matches quantum predictions.

  Potential pitfalls:
  - Students might think that they are only in one branch (the one they experience). We must stress that in the game, both branches exist and the student is in both. The point accumulation is per branch.
  - Students might try to maximize the minimum points, or use some other decision theory. We can acknowledge that, but then point out that quantum mechanics gives definite frequencies that are not the minimum or maximum.
  - Some students might say the setup is meaningless because there's no defined score. That's the point! We need a measure. We can say: "Exactly! So how do we define the score? We need an additional rule."
  - Time: 3 rounds might take longer than 10 minutes each. We can practice with one round together.

  Materials:
  - For each student: 
      8 index cards (or a worksheet with a tree).
    Alternatively, we can have a printed sheet with a tree and they fill in the marks and points.
  - A coin for the facilitator.
  - A whiteboard to record the wagers and the coin flip outcomes.

  Wager description (for each round, projected or on a handout):
     Wager A: 
          If the branch is marked 9: 0 points
          If the branch is marked 3: 3 points
     Wager B:
          If the branch is marked 9: 2 points
          If the branch is marked 3: 0 points

  Round-by-round:

  Round 1 (15 minutes including setup and explanation):
    - Students start with one card: World 1, history=[], points=0.
    - They choose wager (A or B) for round 1.
    - Facilitator flips a coin and announces the assignment (e.g., "Heads: A=9, B=3").
    - Each student splits their world into two: 
          World 1A: mark = 9 (if heads) or 3 (if tails)
          World 1B: mark = 3 (if heads) or 9 (if tails)
    - They add the points for round 1: for World 1A: if mark=9, then if they chose A: 0 points; if they chose B: 2 points. Similarly for World 1B.
    - They record on the new cards: 
          World 1A: history=[9 or 3], points= (the points from wager)
          World 1B: history=[3 or 9], points= (points from wager)

  Round 2 (10 minutes):
    - Students now have two cards. They choose a wager (A or B) for round 2 (the same for both branches).
    - Facilitator flips a coin for round 2.
    - For each branch they currently have, they split it into two. So from World 1A, they make World 1AA and World 1AB. Similarly from World 1B, they make World 1BA and World 1BB.
    - They assign the mark for round 2 to each new branch according to the coin flip (e.g., if coin is tails, then for every split: the A branch gets 3, the B branch gets 9).
    - For each new branch, they take the points from the parent branch and add the wager points for round 2.

    Example: 
          World 1A had 0 points (say) and history [9]. 
          They split into World 1AA and World 1AB.
          If coin round2 is tails: then World 1AA gets mark 3, World 1AB gets mark 9.
          If the student chose wager A for round2: 
              World 1AA: mark=3 -> add 3 points -> total = 0+3=3
              World 1AB: mark=9 -> add 0 points -> total = 0+0=0
          They record:
              World 1AA: history=[9,3], points=3
              World 1AB: history=[9,9], points=0

  Round 3 (10 minutes): same as round 2.

  After round 3, each student has 8 branches.

  Then, the aggregation discussion.

  We can have the students compute:

  1. Branch counting: average of the total points of the 8 branches.

  2. Linear weighting: 
        For each branch, weight = product of the marks in the history.
        Total weight = sum of the weights of the 8 branches.
        Weighted points = sum over branches (weight(branch) * total_points(branch)) / total_weight

  3. Squared weighting: 
        For each branch, weight = product of the squares of the marks in the history.
        Similarly.

  This computation might be heavy, so we can do it for one volunteer or pre-compute the formula.

  Alternatively, we can use a computer, but we want it on the board.

  To save time, we can note that the total points for a branch is the sum over rounds of the points in that branch. And the weight is multiplicative. We can compute the expected points per round and then sum.

  But for the activity, we can have the students calculate the branch counting average and then show the other two by formula.

  We can also have the students work in groups to compute one method.

  But given time, we might do:

  - Compute branch counting for one or two students.
  - Then show that if you always chose A, the branch counting average is 4.5, linear is 2.25, squared is 0.9? Wait, for squared weighting and wager A: per round expected points 0.3, so total 0.9? But let me compute for wager A and squared weighting per round: 
        (81 * points(9) + 9 * points(3)) / 90 = (81*0 + 9*3)/90 = 27/90=0.3, so 3 rounds: 0.9.

  But the branch counting gave 4.5 for A. So the difference is huge.

  For a student who always chose B:
    Branch counting: 3 (as above)
    Linear: 4.5? Per round 1.5, total 4.5.
    Squared: per round 1.8, total 5.4.

  So the student who chose B does better by linear and squared than by branch counting.

  The student who chose A does worse by linear and squared.

  In the debrief, we note that only the squared weighting matches the quantum frequencies.

  Finally, we note that the marks were chosen to be proportional to the amplitudes, and the square gives the probability.

  What the activity cannot do: it doesn't explain why the squared measure is the correct one. It only shows that it is the one that matches quantum statistics. The derivation of the Born rule in MWI is a deep problem, and there are various approaches (decision theory, typicality, etc.), but that's for the next lecture.

  Response to potential escape: if a student says "I don't care about the other branches, only this one", we can ask: but when you made the bet, you didn't know which branch you would be in. In fact, you are in all of them. And quantum mechanics predicts frequencies in this branch, but why should this branch be the one that has the high amplitude? The theory doesn't privilege one branch over the other, but it does assign a measure.

  We can also note that if we run the experiment once, we get one branch, but the probability of getting a branch with high amplitude is high? But that uses the Born rule to define probability. The circularity is part of the problem.

  The activity is stipulative in that we assigned marks proportional to the amplitudes. In reality, the amplitude is a complex number and the modulus is what matters. But we abstracted that away.

  The facilitator should emphasize that the branching structure alone does not determine the weights; we have to add the measure to match observation.

  This should set up the next lecture on derivations of the Born rule.
answer: |-
  ### **Branching Bets: A Hands-On Encounter with the Born Rule Problem**  
  **Target Audience**: Upper-level philosophy of physics seminar (14 students) with basic QM knowledge (including textbook collapse), but no prior exposure to MWI measurement problems.  
  **Goal**: Make students viscerally confront the need for a measure over branches in MWI by forcing them to bet in a branching universe where all outcomes exist, then revealing that branch-counting, linear weighting by amplitude, and squared weighting yield conflicting rational choices—none of which is "obviously" correct without importing the Born rule.  

  ---

  ### **Full Runnable Package**  
  #### **Materials & Preparation**  
  1. **Branching Rulebook (1 per student)**:  
     - A card stating:  
       - *Round 1*: Split into two branches. Marks: 9 and 3.  
       - *Round 2*: Each branch splits again. Marks: 9 and 3.  
       - *Round 3*: Each branch splits again. Marks: 9 and 3.  
     - **Clarification**: The "marks" (9 and 3) are arbitrary labels with no intrinsic meaning. They represent amplitudes in the simulation.  

  2. **Wager Menu (Projected or printed)**:  
     - **Wager A**:  
       - In branch marked 9: **0 points**  
       - In branch marked 3: **3 points**  
     - **Wager B**:  
       - In branch marked 9: **2 points**  
       - In branch marked 3: **0 points**  
     *(Designed so branch-counting favors A, linear weighting favors B, and squared weighting strongly favors B.)*  

  3. **Branching Device**:  
     - A coin (fair, provided by facilitator).  
     - **Role**: Determines mark assignment *after* bets are placed (e.g., Heads: Left branch = 9, Right = 3; Tails: Left = 3, Right = 9).  

  4. **Student Materials (Per Student)**:  
     - **8 index cards** (or a worksheet with 8 slots).  
     - **Pencil** for tracking branches.  
     - **Starting card**: Labeled "World 1" with "History: —" and "Points: 0".  

  5. **Scoring Board**:  
     - Whiteboard with three columns:  
       - **Branch-Counting**: Average points per branch.  
       - **Linear Weighting**: Points weighted by product of marks.  
       - **Squared Weighting**: Points weighted by product of marks squared.  

  #### **Setup (15 min)**  
  - **Context (5 min)**:  
    > "Today, we simulate a branching universe. Each of you starts in one world. Each round, your world splits into two branches (like MWI’s unitary evolution). Both branches exist forever—no one is eliminated. Before each split, you’ll choose a wager. Points accumulate *in each branch*, and your final score depends on how we weigh these branches."  
    - Emphasize: **Marks are neutral** (e.g., "9 isn’t ‘better’ than 3—it’s just a label").  

  - **Demo Round 1 (10 min)**:  
    - Each student starts with one card ("World 1: History: —, Points: 0").  
    - Students choose **Wager A or B** for Round 1.  
    - Facilitator flips coin (hidden), announces assignment (e.g., "Heads: Left=9, Right=3").  
    - Students split their world:  
      - Create two new cards:  
        - "World 1L: History: 9, Points: [Wager payout] + 0"  
        - "World 1R: History: 3, Points: [Wager payout] + 0"  
      - *Example*: If a student chose Wager A and the branch gets mark 3, they add 3 points.  

  ---

  #### **Rounds 2 & 3 (20 min total; 10 min each)**  
  **Rules for Each Round**:  
  - Students choose **one wager (A or B) for all current branches**.  
  - Facilitator flips coin (new flip each round), announces mark assignment.  
  - Each branch splits into two. Students create new cards:  
    - Append the new mark to the history.  
    - Add new wager points to the parent branch’s total.  
  - **No elimination**: All branches persist.  

  **Example (Round 2)**:  
  - A student has two branches (e.g., "World 1L: Points=0, History=9"; "World 1R: Points=3, History=3").  
  - They choose Wager B for all.  
  - Coin flip: Tails → Left branch = 3, Right branch = 9.  
  - Split each branch:  
    - "World 1LL: History=9→3, Points=0 + [Wager B: mark=3 → 0] = 0"  
    - "World 1LR: History=9→9, Points=0 + [Wager B: mark=9 → 2] = 2"  
    - "World 1RL: History=3→3, Points=3 + [Wager B: mark=3 → 0] = 3"  
    - "World 1RR: History=3→9, Points=3 + [Wager B: mark=9 → 2] = 5"  

  **After Round 3**: Each student has **8 branches** with unique histories (e.g., 9→3→9) and points.  

  ---

  #### **Aggregation & Debate (40 min)**  
  1. **The Trap (5 min)**:  
     > "Calculate your total score. How? The rulebook doesn’t say. You have 8 branches with different points. What’s your *real* payoff?"  
     - Students realize: **No score exists without a weighting rule**.  

  2. **Proposals (15 min)**:  
     - Facilitator asks: "How should we weigh branches?" Elicit three methods:  
       - **Branch-Counting**: All branches equal → Score = average points per branch.  
       - **Linear Weighting**: Weight each branch by product of marks (e.g., branch 9→3→9: weight = 9 × 3 × 9 = 243).  
       - **Squared Weighting**: Weight by product of squared marks (e.g., 9² × 3² × 9² = 6561 × 9).  
     - Students compute scores for their branch set using each method.  

  3. **Conflict (10 min)**:  
     - Compare scores on the board. **Example outcomes for a student who always chose Wager A**:  
       | Method          | Score | Rationale for Wager A |  
       |------------------|-------|------------------------|  
       | Branch-Counting  | 4.5   | "Branches are equal"   |  
       | Linear Weighting | 2.25  | "Marks feel important" |  
       | Squared Weighting| 0.9   | "Squares ‘feel right’" |  
     - **Key revelation**:  
       - Branch-counters favor A (expected 1.5/round).  
       - Linear/squared favor B (expected 1.5/round and 1.8/round).  
       - *No consensus on which wager is rational*.  

  4. **Quantum Connection (10 min)**:  
     > "In quantum mechanics, if ‘9’ and ‘3’ were amplitudes, we’d see ‘9’ outcomes ~90% of the time. Let’s test our methods:"  
     - **Simulate frequencies**:  
       - Branch-counting: 50% of branches have mark 9 (✗ contradicts QM).  
       - Linear weighting: 75% weight to mark 9 (✗ contradicts QM).  
       - Squared weighting: 90% weight to mark 9 (✓ matches QM).  
     - > "But why squared? Nothing in branching *alone* forces this. The amplitudes’ *squares* are imported from outside to match experiment."  

  ---

  #### **Debrief (15 min)**  
  - **Map Game to MWI Problem**:  
    - *Branching as unitary evolution*: "You specified the split rule (marks = amplitudes), but not how to weight outcomes."  
    - *Betting as pre-measurement choice*: "You had to act, but ‘rationality’ depended on an arbitrary measure."  
    - *The discomfort*: "When you realized your score was undefined, you hit the core of the Born rule problem: branching doesn’t privilege one measure over another."  

  - **Predictable Student Challenges**:  
    - **"I only care about *my* branch!"**: Respond: "But at betting time, you didn’t know which branch you’d ‘experience’. MWI says you’re in all—so how do you weigh them *ex ante*?"  
    - **"This is meaningless!"**: Respond: "Exactly! Without a measure, ‘rational choice’ is undefined. But quantum statistics *are* defined—so where do they come from?"  
    - **Muddying worlds vs. selves**: Some may confuse tracking branch points with "their" point total. Clarify: "You’re not eliminated—you’re multiplied. All your future selves exist."  

  - **Limitations of the Activity**:  
    - **What it achieves**: Forces confrontation with the need for a measure; shows branch-counting/linear weighting fail QM statistics.  
    - **What it doesn’t do**: Derive the Born rule or explain *why* squared modulus works. That’s for later lectures (e.g., decision-theory derivations, typicality).  
    - **Where it’s stipulative**: The marks are *given* as proportional to amplitudes. In reality, amplitudes are complex numbers—but the modulus is what matters for the Born rule.  

  ---

  ### **Realistic 90-Minute Timeline**  
  - **0–15 min**: Setup, rules, and Round 1.  
  - **15–25 min**: Round 2.  
  - **25–35 min**: Round 3.  
  - **35–40 min**: Trap ("What’s my score?").  
  - **40–55 min**: Proposals and scoring calculations.  
  - **55–65 min**: Conflict (board comparison).  
  - **65–75 min**: Quantum frequency connection.  
  - **75–90 min**: Debrief and Q&A.  

  ---

  ### **Why This Works**  
  Students *feel* the problem when their bets force them to confront the undefined value of branches. By making them calculate scores three ways—and seeing all three as defensible until quantum frequencies are invoked—they internalize why MWI needs the Born rule as an *additional* structure. The game isolates the "measure problem" without requiring formalism, setting the stage for philosophical derivations.  

  > "The activity doesn’t solve the problem—it makes them *need* the solution. When you later present Wallace’s decision theory or Zurek’s envariance, they’ll be primed to see why it matters."
