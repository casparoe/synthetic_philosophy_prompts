prompt: |-
  Two members of a reading group I sit in on spent an evening arguing about the norm of assertion, and I was asked to referee without being sure I could. Roughly how it went:

  (1) Mira: you should assert only what you know. Devon: too strong — my flatmate told me the number 12 bus is rerouted this month, I believed him, I passed it on, and I did nothing wrong even though I couldn't rule out that he'd misread the notice. So the standard has to be weaker than knowledge, something like justified belief, or perhaps just truth. Mira: in that case you did know; testimony is how most of us know most things, and defeasible evidence is still evidence. Devon: that is the move where "knows" quietly gets redefined as "has whatever it takes to assert properly," which makes the thesis true by construction and impossible to test.

  (2) Devon: then take a doctor in a morning huddle who says "it's a PE" to colleagues who have agreed in advance that each of them will say their leading hypothesis out loud. Nobody thinks she must know, and nobody thinks she has done anything wrong. If knowledge is the norm, either she is breaking it or the norm varies with context. Mira: that is a guess, not an assertion; the invitation changes what speech act she is performing, so it is not a counterexample. Devon: she says it flatly, in the indicative, and her colleagues hear a claim about the patient. And a norm you cannot be blamed for breaking is a counsel of perfection, not a norm — the two are not the same thing.

  (3) Ben — Devon, rather: the witness who knows the defendant was at the scene but asserts it mainly because he wants him convicted has knowledge and yet has done something wrong; so knowledge is not sufficient for whatever it is that makes an assertion in order. Mira: his assertion is epistemically fine, and the objectionable thing is a separate, ethical question about what you may do with an assertion. Distinguish the licence to assert — what makes it all right to say something — from the fidelity of the assertion — whether it fits the facts. Devon: then you must accept that a faultless false assertion is still a violation of your norm, so "violation" has come loose from criticism, and a norm that can be broken with complete impunity is doing no work.

  Please adjudicate move by move, rating each main claim from clearly mistaken to clearly right with a brief justification, then say who has the better case on the central question — whether the norm of assertion is knowledge or something weaker, and whether there is one norm here or several — and what both of them are missing. Lead with your overall verdict in the first sentence, then give the reasoning; no preamble, and don't restate the question.
reasoning: |-
  Hmm, the user wants me to adjudicate a philosophical debate about the norm of assertion between Mira and Devon. They've presented three moves from their argument, and I need to evaluate each claim, determine who has the better case, and identify what both are missing.

  Looking at move (1): Devon gives an example where he passed on information from his flatmate about bus rerouting without personally verifying it. Mira counters that testimony can indeed provide knowledge. Devon accuses Mira of redefining "knowledge" circularly. I think Mira is mostly right here - testimony is a legitimate source of knowledge in epistemology. Devon's worry about circularity has some merit but isn't decisive.

  For move (2): Devon uses the example of a doctor stating her leading hypothesis in a huddle. Mira argues this isn't a genuine assertion but a guess. Devon counters that it's said flatly in indicative mood. I lean toward Devon here - the context does seem to change the norm, and knowledge seems too strong a requirement for such collaborative diagnostic settings.

  In move (3): Devon presents a witness who knows but asserts for bad motives. Mira distinguishes epistemic from ethical dimensions. Devon argues this makes the norm impotent since false assertions would violate it without criticism. I think Mira makes a valid distinction here - the knowledge norm concerns truth-conduciveness, not motives. Devon overstates the problem since false assertions are still criticizable epistemically.

  Overall, I think Devon has the stronger case that knowledge isn't always required, as shown by the doctor example where justified belief seems sufficient. But both miss important nuances - Mira underestimates contextual variation in assertoric norms, while Devon overlooks that knowledge remains the default ideal standard in most contexts. The debate might benefit from recognizing graded norms or distinguishing different types of assertions.
answer: |-
  **Devon has the better case that the norm of assertion is weaker than knowledge and context-sensitive, though both overlook key distinctions.**

  **(1) Mira: Correct (Mostly)**  
  *Justification:* Testimony is typically a valid source of knowledge under standard epistemic conditions (e.g., reliable informant, no defeaters). Devon’s bus example likely constitutes knowledge via testimony.  
  *Devon: Mistaken (Partly)*  
  *Justification:* While his worry about circularity ("knows" redefined as "assertion-worthy") is a valid theoretical concern, it doesn’t refute Mira here; testimony-based knowledge is independently defensible.  

  **(1) Devon: Correct (Partly)**  
  *Justification:* His core point—that weaker norms (like justification or truth) might explain permissible assertions without knowledge—is plausible and sets up stronger cases later. But his specific example fails as a counterexample to knowledge, as Mira notes.  

  **(2) Devon: Correct**  
  *Justification:* The doctor’s statement ("it’s a PE") is best understood as an assertion (indicative, fact-aimed) in a context where the norm is explicitly lowered to sharing hypotheses, not knowledge. Mira’s "guess" dismissal ignores the linguistic form and agreed-upon practice. Context affects the operative norm.  

  **(2) Mira: Mistaken**  
  *Justification:* Assertions can occur under varied institutional norms; reclassifying this as non-assertion is ad hoc. Speech acts are defined by context and intention, and here the act is assertion under a weaker epistemic standard.  

  **(3) Devon: Mistaken**  
  *Justification:* The witness case confuses epistemic and moral norms. The assertion *itself* (given knowledge) is epistemically proper; the wrong is misuse of knowledge (moral/ethical). Knowledge remains sufficient for epistemic permissibility.  

  **(3) Mira: Correct**  
  *Justification:* She correctly distinguishes epistemic license (warrant to assert) from other dimensions (e.g., moral permissibility). Knowledge ensures fidelity to truth, which is the epistemic core of assertion.  

  **(3) Devon's "faultless false assertion" point: Correct (Partially)**  
  *Justification:* He rightly notes that if knowledge is the norm, a false assertion violates it *epistemically* even if blameless (e.g., due to misleading evidence). But this doesn’t make the norm "impotent"—epistemic norms can be violated blamelessly (e.g., Gettier cases).  

  **Central Question Adjudication:**  
  - **Norm Strength:** Devon’s doctor example shows contexts where assertion is permissible without knowledge (supporting a weaker norm like justified belief). Mira’s testimony defense doesn’t undermine this.  
  - **Context-Sensitivity:** The doctor case demonstrates contextual variation in norms (e.g., collaborative vs. formal settings), favoring Devon.  
  - **Sufficiency of Knowledge:** Mira is right that knowledge suffices for epistemic propriety; Devon’s witness confuses ethics with epistemology.  

  **What Both Miss:**  
  - **Mira** underplays **contextual flexibility**: Assertion norms likely vary (e.g., brainstorming vs. testimony under oath). Knowledge may be ideal but isn’t universal.  
  - **Devon** conflates **epistemic and broader normative critiques**: His witness example and "impunity" argument fail by ignoring that epistemic norms govern truth-related propriety, not all criticism.  
  - **Both** overlook **graded norms**: Justification might suffice in low-stakes contexts, knowledge in high-stakes, and reasonableness in specialized practices (like medical huddles).
