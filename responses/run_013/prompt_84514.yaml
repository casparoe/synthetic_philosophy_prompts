prompt: |-
  I'm an undergraduate taking a decision theory course, and we've just finished the unit on the expected value of information. The headline result was Good's theorem: since a rational agent can always ignore additional information and act exactly as she would have without it, the expected value of free information is never negative. The proof struck me as airtight, and the theorem has a pleasing sweep to it — it seems to say that any reluctance to acquire information is a mistake. But the more I consider cases outside the textbook, the more I suspect I've misunderstood what the theorem is actually claiming, and I'd like you to diagnose my confusion rather than simply reassure me that the theorem is correct.

  Here are three cases that seem to me to push against it. First, my roommate is a medical student and she tells me that patients sometimes decline predictive genetic testing because they would rather not know, and that some legal systems even protect a right not to know; she thinks this is perfectly rational. Second, a friend in an economics seminar told me that for an ambiguity-averse decision-maker the value of information can be negative, which sounds like a straight counterexample to Good. Third, I've noticed that I sometimes prefer not to look up the ending of a novel or the score of a match I've recorded, and it doesn't feel like a failure of rationality — it feels like knowing would itself make my situation worse. My question is whether Good's theorem really proves that information can never make a rational agent worse off, and if it doesn't, what exactly it does prove and what it is silent about. I'd like you to correct whatever is confused in my framing — I suspect I'm treating the claim that the expected value of information is non-negative as a claim about how things turn out for actual people, and also ignoring something about what the theorem assumes regarding an agent's preferences and regarding what information is. Then tell me which of my three cases the theorem genuinely rules out as irrational and which it simply does not address.
reasoning: |-
  Okay, I see this student is grappling with Good's theorem in decision theory and has presented three cases that seem to contradict it. They're clearly thinking deeply and noticing real-world complexities that challenge the textbook presentation. 

  First, let's unpack their core question: they suspect they're misunderstanding the theorem's scope, particularly by treating it as a claim about actual outcomes rather than expected utility, and by missing key assumptions about preferences and information. That's astute - many students miss those nuances.

  The medical testing case is interesting because it involves psychological states and identity-changing information. The patient isn't just valuing outcomes but their lived experience of uncertainty. Good's theorem would classify this as irrational if the agent's utility function only considers health outcomes, but that's precisely the rub - if the utility function includes peace of mind, then declining testing might be perfectly rational. The student's roommate has a point, but it doesn't refute Good; it just shows how utility functions can be richer than simplified models.

  The ambiguity aversion example is trickier. That friend in economics might be referring to Ellsberg paradox situations where people prefer known probabilities over ambiguous ones. But Good's theorem assumes Bayesian updating with precise priors - if the agent can't form sharp priors, the whole expected utility framework breaks down. So this isn't a counterexample but a boundary case where the theorem's assumptions don't hold.

  Their personal example about spoilers is the most relatable. Here the information acquisition itself changes the experience - knowing the score or ending alters how they consume the content. Good's theorem assumes information is costless and preference-neutral, but in reality, the act of acquiring information can be part of the consumption bundle. If their utility function values suspense, then not knowing is intrinsically better.

  What they're really bumping against are three limitations of the theorem: (1) it assumes utility functions are fixed and don't change with information, (2) it requires Bayesian updating capabilities, and (3) it treats information as separate from the decision process. Their cases highlight psychological utility, ambiguity aversion, and endogenous preference effects - all areas where standard rational choice models show their seams.

  The student seems to intuitively grasp that rationality might be broader than the theorem assumes, which is mature for an undergrad. I should validate that insight while clarifying where the theorem holds firm. Their confusion isn't about the math but about the philosophy of rationality - exactly the deep thinking we want in theory courses.
answer: |-
  You've identified crucial nuances where Good's theorem's elegant abstraction meets the messiness of human experience. Your intuition is correct: the theorem **doesn't** claim that acquiring information *always* makes people better off in their lived reality. Instead, it proves a very specific statement within a tightly defined rational choice framework. Let's dissect your confusion and your cases.

  ### Good's Theorem: Core Claims and Crucial Assumptions
  1.  **The Headline Result:** For a rational, expected utility maximizing agent *with a fixed utility function*, the Expected Value of Sample Information (EVSI) is non-negative. Acquiring information *cannot reduce* the agent's *expected utility* in the initial decision problem.
  2.  **What "Expected Value" Means:** This is about the *ex ante* calculation *before* seeing the information. It averages the value over all possible information outcomes, weighted by their prior probabilities. It does *not* guarantee that *after* acquiring the information, the agent will be *actually* better off in every possible world state.
  3.  **What "Rational Agent" Assumes:**
      *   **Bayesian Updating:** The agent must be able to form precise prior probabilities and update them correctly using Bayes' rule upon receiving information.
      *   **Fixed Utility Function:** The agent's preferences over *ultimate outcomes* (states of the world + actions taken) are fixed and known *before* acquiring information. Information only changes beliefs, not preferences.
      *   **Consistent Optimization:** The agent will always choose the action maximizing expected utility given their *current* beliefs, both before and after receiving information.
      *   **Free Information:** There are no direct costs (time, money, psychological burden) associated with acquiring or processing the information itself.
  4.  **The "Can Ignore" Argument:** This is key. Rationality requires the agent chooses the action with highest expected utility *given their beliefs*. If receiving information *could* sometimes lead them to choose an action that was *worse* in expectation *given their prior beliefs*, then the agent could simply *ignore the information* and choose the action they would have chosen without it. Therefore, the *worst* the information can do is be useless (EVSI=0), never harmful (EVSI<0). But this relies entirely on the assumptions above.

  ### Correcting Your Framing
  You're right about two potential misinterpretations:
  1.  **Actual Outcomes vs. Expected Utility:** Good's theorem guarantees non-negative *expected* utility *before* seeing the information. It says nothing about the utility *realized* in any *actual* outcome state after the information is received and acted upon. You can get unlucky! Information might lead you to an action that turns out poorly due to unforeseen circumstances.
  2.  **Scope of Preferences:** The theorem assumes utility is defined solely over the *final states of the world and the actions taken*. It does *not* include within utility:
      *   The psychological state of *knowing* the information itself (e.g., anxiety, loss of surprise).
      *   Any costs or burdens associated with the *process* of acquiring or processing the information.
      *   Changes to the utility function *caused* by the information.

  ### Analyzing Your Three Cases
  1.  **Declining Predictive Genetic Testing (Medical "Right Not to Know"):**
      *   **Good's Theorem Perspective:** If the *only* things entering utility are health outcomes and treatments (e.g., longer life expectancy, fewer side effects), then declining the test *is* irrational according to Good. The agent *could* get the test, see the result, and then *still choose exactly the same preventative actions* they would have taken *without* the test. Having the information gives more options, never fewer.
      *   **Why it *Feels* Rational (and Often Is):** People's utility functions frequently *do* include psychological states. *Not knowing* might preserve hope, avoid anxiety, protect self-image, or maintain a sense of freedom. If "living without the burden of knowing a grim genetic predisposition" is a valued outcome state *in itself*, then declining the test *can* be perfectly rational. **Good's theorem does not address this.** It assumes utility is fixed over final states *external* to the mind's knowledge state. This case highlights the limitation of the "fixed utility function over external outcomes" assumption. **The theorem does *not* rule this out as irrational** if the utility function genuinely includes psychological states affected by knowledge.

  2.  **Ambiguity-Averse Decision-Maker:**
      *   **Good's Theorem Perspective:** Good's theorem relies on the agent having well-defined *prior probabilities* for all states. Ambiguity aversion describes agents who are uncomfortable making decisions *without* precise probabilities (e.g., Ellsberg Paradox). They may strictly prefer a gamble with known probabilities over an *equivalent* gamble with unknown probabilities.
      *   **Why it *Seems* Like a Counterexample:** Acquiring information can *increase* perceived ambiguity! Imagine an expert gives you a vague or conflicting report, making your probabilities *less* precise instead of more precise. An ambiguity-averse agent might genuinely *prefer* their initial ambiguous state to the new, potentially worse ambiguity. The *expected utility framework breaks down* because the agent cannot assign sharp probabilities required for Bayesian updating and expected utility calculation.
      *   **The Crux:** Good's theorem assumes the agent *can and will* form sharp priors and update them sharply. It does not apply to models of ambiguity aversion (like max-min expected utility or smooth ambiguity) that fundamentally reject the Bayesian framework or the completeness of probabilistic beliefs. **This is a case where the core assumption of Bayesian rationality (sharp, probabilistic beliefs) fails. Good's theorem does not apply here.** It's not that the agent is irrational *within Good's model*; it's that Good's model doesn't capture this type of preference.

  3.  **Avoiding Spoilers (Novel Ending, Sports Score):**
      *   **Good's Theorem Perspective:** If the *only* valued outcome is the hedonic experience of consuming the novel or watching the match, then Good's theorem suggests knowing the ending/score should let you optimize that experience better. The "ignoring" option remains: you could learn the spoiler and then still choose to read/watch "as if" you didn't know.
      *   **Why it *Feels* Rational (and Is):** The experience of suspense, surprise, and discovery *during consumption* is often a *crucial component* of the utility derived from novels, films, or live sports. Knowing the ending fundamentally *changes the nature of the experience itself*. If "experiencing the suspense/surprise" is part of your utility function for the consumption event, then acquiring the spoiler information *directly destroys* utility by making that preferred experience impossible. **Good's theorem does not address this.** It treats the "state of the world" (the actual ending/score) and the "action" (reading/watching) as separable, assuming the utility of the action depends *only* on the state and the action, not on *how much you knew* while performing the action. Here, the information acquisition *directly alters* the quality of a future state/action bundle in a way the standard model doesn't capture. **The theorem does *not* rule this out as irrational.**

  ### Summary of Your Cases vs. Good's Theorem

  | **Case**                          | **Addressed by Good's Theorem?** | **Rational per Good?** | **Why Not Addressed/Rational in Reality**                          |
  | :-------------------------------- | :------------------------------- | :--------------------- | :----------------------------------------------------------------- |
  | **1. Declining Genetic Testing**  | ❌ No                            | N/A                    | Utility function includes psychological states (anxiety, hope)     |
  | **2. Ambiguity-Averse Agent**     | ❌ No                            | N/A                    | Violates Bayesian prior assumption; sharp probabilities impossible |
  | **3. Avoiding Spoilers**          | ❌ No                            | N/A                    | Information acquisition directly alters the nature of future experiences |

  ### Conclusion: What Good's Theorem *Does* and *Does Not* Prove
  *   **Does Prove:** Within the strict Bayesian expected utility framework (sharp priors, fixed utility over external outcomes/actions, costless information, consistent optimization), acquiring additional *free* information *cannot decrease* the agent's *expected utility* calculated *before* acquiring the information. Rational agents can always ignore information to achieve at least their pre-information expected utility.
  *   **Does *Not* Prove:**
      *   That information *always* leads to better *actual* outcomes.
      *   That reluctance to acquire information is *always* irrational for real humans.
      *   That utility functions cannot include states of knowledge, psychological burdens, or the experiential quality of actions influenced by prior knowledge.
      *   That the theorem applies when agents face ambiguity instead of risk (lack sharp priors).
      *   That acquiring information has no psychological or cognitive costs.

  Your cases powerfully illustrate the boundaries of the standard rational choice model. Good's theorem is a profound and important result *within its domain*, but its domain excludes the very real human experiences of psychological burden from knowledge, the intrinsic value of suspense/surprise, and the discomfort of ambiguity. Your reluctance to accept the theorem as a universal law of rationality is well-founded; it highlights your understanding that rationality encompasses more than just Bayesian expected utility maximization over narrowly defined outcomes.
