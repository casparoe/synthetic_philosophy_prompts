  - What "closed" means (no non-physical causes? no non-physical explanations?)
  - What "causation" means (deterministic sufficiency? probability-raising? difference-making?)
  - The status of the claim (empirical? methodological? definitional?)
  - How mental states relate to physical states (identical? distinct? determinable/determinate?)

  For each combination of these variables, I should evaluate whether the claim is:
