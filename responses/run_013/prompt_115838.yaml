  Compromise: Modify Tolstoy to include works created with sincere emotional intent, regardless of actual transmission, focusing on the maker's process. Then the virtuoso piece is art if the composer had sincere feeling. The jingle's maker might not. The child's drawing has sincere intent. The portrait without care lacks sincerity. 

