  I recall that illusionists like Keith Frankish or Daniel Dennett typically bite the bullet at step (4). They'd argue the "presenting state" isn't phenomenal—it's just complex functional/computational machinery creating a *representation* of phenomenality. The qualitative "seeming" is a hollow output, not proof of intrinsic properties. 

