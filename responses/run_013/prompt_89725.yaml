     1a. **Is the internal state something that can be directly observed or measured by an objective, verifiable action? (e.g., completing a training, reporting an incident)**
          - If YES: Then it's not really about the internal state but about the behavior. Proceed to question 2.
          - If NO: Then we cannot measure the internal state without relying on self-report or subjective judgment. Go to question 1b.

