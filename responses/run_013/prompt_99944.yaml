answer: |-
  ## Sestina for the Paradox Reading Group

  Let’s pry apart this stubborn, tangled core.
  First argument: it’s carved in stone, in **nature**.
  The blueprint’s fixed, beyond our shaping **culture**,
  A primal script that guides each free **choice** made.
  Why strain for some impossible **equal** state?
  Accept the deep, essential, given **gap**.

  But look again – perhaps the yawning **gap**
  Was taught, not born. The lessons of our **culture**
  Press hard on young minds, shaping each **choice**,
  Rewarding this, forbidding that. True **justice**
  Demands we dismantle walls, make **equal**
  The ground on which we stand, beyond mere **nature**.

  Is difference then, perhaps, a shrewd **choice**?
  Responding rationally, the **gap**
  A measured step, not proof we’re less **equal**,
  But smart adaptation. Constraints, not **nature**,
  Dictate the path. Is this the face of **justice**?
  Or just the weight of an old **culture**?

  But **justice** surely cares for more than **gap**s,
  For substance, dignity, a truly **equal**
  Regard. Does counting roles reveal **justice**,
  Or miss the heart? Perhaps the vital **choice**
  Is valuing what’s done, not who, by **nature**,
  Ignoring pressure from the ambient **culture**.

  Yet still the stubborn numbers show the **gap**.
  In lands that strive most fiercely to be **equal**,
  Where structures bend to foster freedom’s **choice**,
  The differences in path seem *wider*. **Culture**
  Advanced, they say, should iron out mere **nature**.
  Why does it bloom? Where hides the missing **justice**?

  Perhaps the lens itself distorts the **gap**.
  The very tools designed to measure **equal**,
  The surveys, polls, the gaze of anxious **culture**,
  *Create* the preferences they seek. Each **choice**
  Recorded isn't pure, untouched by **nature**
  Or nurture, but a product. Where is **justice**
  In counting what the counter’s frame sets loose?

  The knot pulls tighter, word by word: **culture**,
  **Nature**, **choice**, **justice**, **equal**, **gap**.
  The paradox resists each neat escape.
  No single thread – biology’s hard stone,
  Learned bias etched by socialisation’s hand,
  Rational response to walls that still confine,
  Or justice focused solely on the score –
  Can bear the weight alone. The distinction frays.

  But see: the act of seeking, charting, weighing –
  Defining "preference," fixing where we stand –
  This very process, shaping what we see,
  May *be* the engine, knitting tight the snare.
  The **gap** we mourn, the **equal** we pursue,
  Are partly *made* by how we ask, and who.

  So **nature**? **Culture**? Cease the weary fight.
  The **choice** is framed by instruments of light
  That cast the shadows forming **justice**'s plight.
  That vexing **gap**, the dream of being **equal** –
  The **culture** of the count *constructs* the scene.
  The knot's the loom. The terms define the **gap**.
