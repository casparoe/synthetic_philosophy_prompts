  Okay, let me tackle this query about the phrase "could have done otherwise." The user is running a reading group on free will and moral responsibility, and their colleague, a determinist philosopher, uses this phrase to shut down discussions. The colleague claims that since no one could have done otherwise, no one is answerable for anything. The user wants a handout that disambiguates the phrase for their students. They need a clear breakdown of possible interpretations, an analysis of the colleague's probability-based gloss, and an identification of which interpretation the colleague's argument relies on.

  First, I need to brainstorm all possible precise meanings of "could have done otherwise." The key aspects to cover include the species of possibility (metaphysical, nomological, epistemic), the fixity of the past and laws, the nature of the ability (general capacity, occasion-specific power, counterfactual, reasons-responsiveness), the agent and time in question, and whether it's descriptive or evaluative.

  For species of possibility, metaphysical possibility involves what's possible in the broadest sense, nomological is constrained by physical laws, and epistemic is about what's known or knowable. The colleague's determinist view likely assumes nomological impossibility given determinism. 

  Next, indexing the alternative—same past and laws, or just character and reasons? Determinists fix the past and laws, while compatibilists might relax this. The nature of the ability: is it a general capacity, like having the skill to choose differently, or an occasion-specific power? Or a counterfactual where if the agent chose otherwise, they'd act otherwise? Or reasons-responsiveness, where the agent would act differently if reasons were different? 

  Whose ability and at what time? The colleague focuses on the agent at the moment of action, but others might consider the agent's prior development. Also, is the phrase descriptive or appraisive? The colleague uses it descriptively, but it might carry evaluative weight in moral contexts.

  The colleague's gloss involves objective chance exceeding a threshold. This introduces degrees of possibility, which is unusual. I need to compare this to other readings. It resembles nomological possibility but with probabilities. Problems include the threshold being arbitrary and the implication that "could" comes in degrees, which conflicts with binary moral responsibility ascriptions.

  To support the colleague's argument from "couldn't do otherwise" to "no answerability," he needs a specific reading where the inability is absolute and tied to control. Nomological impossibility given same past and laws fits, as it denies any alternative possibilities. However, compatibilists can accept this premise under that reading but deny the conclusion by using alternative interpretations like reasons-responsiveness or conditional analyses. For example, if "could have done otherwise" means the agent would have acted differently if they chose to, compatibilists can argue that even in a deterministic world, agents can have such conditional abilities, preserving moral responsibility.

  I should structure this as a menu of readings with verdicts. Each reading's status—platitude, defensible, confused—needs assessment. For instance, the conditional analysis is a defensible compatibilist move, while the colleague's probabilistic view might be confused due to threshold issues. Highlight where ordinary speech conflates readings, like mixing general capacities with occasion-specific powers.

  The user's deeper needs include clarifying the debate for students, exposing the colleague's assumptions, and empowering students to engage critically. The handout should enable students to see how different interpretations affect the free will debate, especially the compatibilist responses. Emphasizing the colleague's reliance on a strong incompatibilist reading and how compatibilists sidestep it with alternative meanings is crucial.
answer: |-
  ## Disambiguating "Could Have Done Otherwise": A Menu for Critical Analysis

  **Introduction:**  
  The phrase "could have done otherwise" (CHDO) is central to debates about free will and moral responsibility, but it is *not* a univocal concept. Its ambiguity allows for significant confusion. This handout catalogs its potential precise meanings, assesses their plausibility, and examines the role they play in arguments like your colleague's. We'll also analyze his proposed "objective chance" interpretation.

  **Key Dimensions of Ambiguity:**

  1.  **Species of Possibility:**
      *   *Metaphysical:* What is broadly possible, given the nature of reality itself (often linked to possible worlds).
      *   *Nomological:* What is possible given the actual laws of nature.
      *   *Epistemic:* What is possible given our (or the agent's) state of knowledge/ignorance.
  2.  **Fixity Constraints (What is Held Fixed?):**
      *   *Same Complete Past & Laws (SCPL):* The alternative action must be possible *holding fixed the entire state of the universe prior to the action and the laws of nature*. (Strongest constraint)
      *   *Same Laws, Different Past:* The alternative action must be possible *given the actual laws*, but allowing for *some* variation in the past leading to the choice.
      *   *Same Character/Reasons/Intention:* The alternative action must be possible *given the agent's actual character, reasons for acting, or intention at the time*. (Weakest constraint, often used in compatibilist analyses).
  3.  **Nature of the Ability/Modal Claim:**
      *   *General Capacity:* The agent possesses the general skills, knowledge, and psychological makeup *type* that would enable performing the alternative action *in some relevantly similar circumstances* (e.g., "I *can* swim").
      *   *Occasion-Specific Power:* The agent had the specific, unimpeded ability *on that very occasion* to perform the alternative action. This is the classic "all-in" sense often associated with libertarian free will.
      *   *Conditional Analysis (CA):* The agent *would have* done otherwise *if* she had chosen/willed/desired otherwise. (A standard compatibilist move).
      *   *Reasons-Responsiveness:* The agent's mechanism for action is *sensitive* to reasons. She *would* have done otherwise *if* sufficiently strong, good reasons for doing so had been present/apparent to her. (A sophisticated compatibilist move).
  4.  **Agent/Time Indexing:**
      *   *The Agent at T (Time of Action):* Focuses solely on the agent's state and options at the precise moment of action/decision.
      *   *The Agent over Time:* Considers the agent's developmental history, character formation, and opportunities for self-shaping leading up to T.
  5.  **Descriptive vs. Appraisive Function:**
      *   *Descriptive:* Makes a factual claim about the agent's abilities or possibilities in the world.
      *   *Appraisive:* Functions primarily as a judgment about the agent's control or responsibility-worthiness. (Suggests the phrase might be *defined* by its role in responsibility ascriptions).

  **The Menu of Interpretations & Verdicts:**

  | Interpretation (Combining Dimensions)                                                                                                | Species of Possibility | Fixity Constraint     | Nature of Ability       | Agent/Time      | Function      | Verdict                                                                                                                               | Notes on Ordinary Speech                                                                                                                                 |
  | :----------------------------------------------------------------------------------------------------------------------------------- | :--------------------- | :-------------------- | :---------------------- | :-------------- | :----------- | :------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Metaphysical SCPL Occasion-Specific Power**                                                                                     | Metaphysical           | SCPL                  | Occasion-Specific Power | Agent at T      | Descriptive  | **Substantive & Highly Contested (False under Determinism).** Requires indeterminism at the moment of choice for libertarians.        | **Rarely used.** Incompatible with determinism *by definition*.                                                                                          |
  | **2. Nomological SCPL Occasion-Specific Power**                                                                                      | Nomological            | SCPL                  | Occasion-Specific Power | Agent at T      | Descriptive  | **False under Determinism.** *The core incompatibilist premise:* Determinism + SCPL implies only one nomologically possible future. | **Colleague's core premise.** Essential for his argument. If true, no alternative actions are physically possible given the actual past/laws.             |
  | **3. Nomological SCPL Conditional Analysis (CA)**                                                                                    | Nomological            | SCPL                  | Conditional Analysis    | Agent at T      | Descriptive  | **Defensible (Widely Held Compatibilist View).** Compatible with determinism. Focuses on agent's will.                               | Often *intended* by compatibilists when they say "could have done otherwise", *accepting* SCPL impossibility.                                             |
  | **4. Nomological SCPL Reasons-Responsiveness**                                                                                       | Nomological            | SCPL                  | Reasons-Responsiveness  | Agent at T      | Descriptive  | **Defensible (Sophisticated Compatibilist View).** Compatible with determinism. Focuses on connection to reasons.                   | Increasingly popular compatibilist interpretation. Accepts SCPL impossibility but locates freedom/relevance elsewhere.                                   |
  | **5. Nomological Different Past (Same Laws) Power**                                                                                  | Nomological            | Same Laws, Diff Past  | Occasion-Specific Power | Agent at T      | Descriptive  | **Substantive & Defensible (Source Incompatibilism/Libertarianism).** Allows alternative possibilities *if* the past was different. | Important for some libertarian views ("leeway" freedom). Requires the *ability* to initiate different causal chains.                                     |
  | **6. Epistemic Possibility**                                                                                                         | Epistemic              | (Irrelevant)          | Not Specified           | Agent/Others    | Descriptive  | **Platitude (Often True, but Irrelevant).** We often *don't know* what will happen. Doesn't bear on metaphysical/nomological control. | **Routinely confused** with nomological/metaphysical possibility in ordinary speech ("I didn't know I *couldn't* do it").                                 |
  | **7. General Capacity**                                                                                                              | Nomological/Metaphysical | Same Char/Reasons     | General Capacity        | Agent over Time | Descriptive  | **Platitude (Often True).** Having the *kind* of capacity relevant to the action type. Necessary but insufficient for responsibility. | **Routinely run together** with occasion-specific power in ordinary speech ("He *can* be kind" vs "He *could* have been kind *then*"). Crucial distinction. |
  | **8. Appraisive Sense**                                                                                                              | (Vague/Contextual)     | (Vague/Contextual)    | (Vague/Contextual)      | Agent at T      | **Appraisive** | **Potentially Confused or Defensible.** Might mean *only* "was responsible" or "had sufficient control".                              | **Likely pervasive** in ordinary moral discourse. Can lead to question-begging ("He's responsible because he could have done otherwise" = "He's responsible because he's responsible"). |

  **Analyzing the Colleague's "Objective Chance" Gloss:**

  *   **Proposal:** "Agent could have done otherwise iff the objective chance of her doing otherwise, given the total prior state of the world, exceeded some threshold (e.g., >0%, >1%, >50%)."
  *   **Situating the Proposal:**
      *   **Resembles:** Most closely **Nomological SCPL Occasion-Specific Power (Interpretation 2)**, but crucially *modifies* it. It replaces the binary "possible/impossible" (chance = 0% or 100%) inherent in strict determinism/nomological possibility with a *spectrum* of chances.
      *   **Incompatible With:** Strict determinism (which requires chance = 0% or 100% for any event given SCPL), and thus with **Interpretation 2** as defined above. It presupposes *indeterminism* at the point of action. Also incompatible with purely **Appraisive (8)** or **General Capacity (7)** interpretations.
      *   **Obvious Objections:**
          1.  **Degrees of "Could"?** Yes, it makes CHDO come in degrees. This is highly counterintuitive for moral responsibility ascriptions, which seem largely binary (responsible/not responsible, blameworthy/praiseworthy). Is someone with a 51% chance *significantly more* responsible than someone with a 49% chance? This seems arbitrary and misaligned with practice.
          2.  **The Threshold Problem:** Any specific threshold (0%, 1%, 50%) appears arbitrary. Why that number? What principled connection exists between, say, a 30% chance and the kind of control required for basic desert moral responsibility? There seems to be no non-arbitrary answer. This undermines the concept's usefulness for grounding responsibility.
      *   **Verdict:** **Substantive but Deeply Problematic.** It offers a precise *indeterminist* reading of CHDO as a non-zero objective chance, but the threshold problem and the disconnect between degrees of chance and binary responsibility ascriptions render it highly dubious as a foundation for moral responsibility. It likely smuggles in the colleague's determinist leanings via the SCPL constraint combined with an implicit assumption that *only* this kind of possibility (or its probabilistic cousin) is relevant.

  **The Core of Your Colleague's Argument & The Compatibilist Response:**

  1.  **The Argument's Necessary Premise:** For your colleague's argument ("Nobody CHDO → Nobody is Answerable") to be valid, he **needs Interpretation 2: Nomological SCPL Occasion-Specific Power.** Only this reading makes CHDO *logically incompatible* with determinism and implies the *absolute impossibility* of any alternative action given the actual past and laws. This absolute impossibility is what he leverages to argue for the absence of any relevant control, hence no answerability.
  2.  **Compatibilist Acceptance of Premise + Denial of Conclusion:** Compatibilists can readily accept the premise "Nobody [CHDO in the sense of **Interpretation 2**]" under determinism. They *deny the conclusion* ("Nobody is answerable") by arguing that moral responsibility depends *not* on this specific, strong sense of CHDO, but on other factors captured by different interpretations:
      *   **Interpretation 3 (Conditional Analysis):** The agent *could have* done otherwise *if* she had chosen otherwise. She had the *power* to act according to her will. Her will was appropriately formed (e.g., by her reasons, character). This is sufficient for control and answerability.
      *   **Interpretation 4 (Reasons-Responsiveness):** The agent acted from a mechanism that is sensitive to reasons. She *would have* done otherwise *if* sufficient reasons had been present. This responsiveness constitutes the relevant control for answerability.
      *   **Interpretation 7 (General Capacity + History):** While insufficient alone, combined with a history where the agent had opportunities to shape her character and capacities in responsibility-relevant ways, it contributes to grounding answerability *even if* on the specific occasion, given SCPL, only one action was possible.
      *   **Rejection of Interpretation 2's Relevance:** Compatibilists argue that **Interpretation 2** is simply *not* the sense of "could have done otherwise" required for moral responsibility. They might see it as confused (**Interpretation 8** running into **Interpretation 2**) or irrelevant. Answerability depends on the *actual source* of the action (reasons, character, control mechanisms) and its connection to the agent, not on the existence of alternative possibilities *given SCPL*.

  **Conclusion & Implications for Discussion:**

  Your colleague's argument relies entirely on equating "could have done otherwise" exclusively with **Nomological SCPL Occasion-Specific Power (Interpretation 2)** and assuming this specific ability is necessary for answerability. His "objective chance" gloss is a problematic variant of this, requiring indeterminism but facing the threshold problem.

  The compatibilist strategy is two-pronged:
  1.  **Concede:** Accept that determinism implies the **falsity** of CHDO under **Interpretation 2**.
  2.  **Deny:** Argue that **Interpretation 2** is **irrelevant** to moral responsibility. Responsibility requires something else, captured by interpretations like **3 (CA)** or **4 (Reasons-Responsiveness)**, which *are* compatible with determinism (and thus with the falsity of Interpretation 2).

  When your colleague says compatibilism "merely changes the subject," he is asserting that **only Interpretation 2** captures the *true, relevant* meaning of "could have done otherwise" for responsibility. The compatibilist rejects this assertion. The core debate often hinges on *which interpretation* of CHDO (if any) is actually essential for the kind of control grounding moral responsibility – not on whether determinism allows for Interpretation 2 (it doesn't), but on whether Interpretation 2 is necessary.

  **Using this Handout:** Encourage students to identify *which interpretation* of CHDO is being used in any given claim or argument. Ask: "Could have done otherwise *in what sense*?" Challenge your colleague to defend why **Interpretation 2** (or his probabilistic variant) is the *only* relevant sense for answerability, rather than simply assuming it. Explore whether compatibilist alternatives (**3, 4, 7**) genuinely capture the control we value when holding people responsible. This disambiguation is crucial for moving beyond stalemate.
