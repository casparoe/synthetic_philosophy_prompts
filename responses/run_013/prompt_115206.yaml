answer: |-
  Alright. Let's engage. Your point about shared physical life is meaningful, but it conflates different kinds of unity. The comprehensive union in marriage specifically requires *one-flesh* unity – a biological coordination toward the common good of reproduction. This isn't about *doing* things together in space, but about the intrinsic *kind of act* performed. 

  Heterosexual intercourse is unique: it's an act where two people coordinate their bodies organically toward the single biological function of reproduction, regardless of whether conception actually occurs. The man and woman become a single reproductive principle *during the act itself*. This specific, procreative-type union is the bodily component of comprehensive union. 

  Your shared life – the flat, the care, the bed – is profound cooperation, a partnership. But it's *collaborative*, not *constitutive* of organic bodily unity in that specific reproductive sense. You build a life *alongside* each other; in the marital act (as defined), man and woman unite *as* one biological principle. The commitment and love in a gay relationship are real and valuable, but they don't generate *this particular type* of biological union, which is a core aspect of what defines marriage as a distinct, comprehensive institution. The physical life you build is vital, but it's the fruit and framework *around* the union, not the union itself in its foundational biological dimension. Why privilege *that* act? Because it's biologically irreducible – it’s where two literally become one organism in function. Nothing else replicates that.

  *(Holding the line. Ready when you are.)*
