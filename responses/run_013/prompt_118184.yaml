  ## Passive Voice

  Maya tapped her pen against the edge of her monitor, the rhythmic click-click-click lost in the fluorescent hum of the Community Wellbeing Directorate records office. Before her lay Mrs. Khatri’s handwritten note, scrawled on the back of a glossy "Your Housing Journey!" pamphlet. The words were blunt, painful: *Council men broke my door. Took my things. Put them on street. Said I owed. I paid! Now nowhere.*

  Maya sighed. Processing 'Expressions of Community Experience' was her job, translating raw emotion into the Directorate’s official lexicon: *ClearSpeak*. Designed for accessibility and positivity, ClearSpeak mandated passive voice, euphemism, and the erasure of institutional agency. 'Eviction'? Unthinkably harsh. It was 'housing transition support' or 'relocation assistance'. The Council never *did* anything; services *were accessed*, outcomes *were achieved*, situations *arose*.

  She opened the digital complaint form. Drop-down menus offered choices like "Unexpected Relocation Occurrence" or "Tenancy Pathway Adjustment". Free-text fields triggered instant flags for non-ClearSpeak terms like "force," "remove," or "blame." Maya started typing: *"Regarding Unit 7B, Willow Creek Complex, a housing transition event was initiated..."* She paused. How to convey the violence? *"...involving unplanned property movement."* Property movement? Mrs. Khatri’s life was in bin bags on the pavement. *"...following identification of potential tenancy agreement variations."* Variations? She claimed she’d paid.

  Maya deleted the sentence. It wasn't just inaccurate; it felt like a lie. The form demanded she categorize the "Primary Community Experience Impact." Options were "Adjustment Period," "Service Navigation Opportunity," or "Temporary Wellbeing Fluctuation." Anger flared in Maya’s chest. Where was "Homelessness"? "Trauma"? "Injustice"?

  She tried again, wrestling with the syntax: *"The resident experienced an accelerated relocation outcome. Personal effects were temporarily situated externally..."* Externally? *"...during a period of tenancy status review."* It was bureaucratic gobbledygook, sanitizing a woman’s suffering into a series of passive, bloodless events. The *council* sent bailiffs. The *council* broke the door. The *council* was responsible. But ClearSpeak had no room for that subject-verb-object sequence. The Council, as an acting entity, simply didn’t exist grammatically in official communications.

  "Stuck on Khatri?" Ben leaned over the partition, holding two mugs of weak tea. He was Maya’s deskmate, a cheerful adherent to ClearSpeak who genuinely believed it fostered community harmony.

  "It’s impossible," Maya muttered, pushing the note towards him. "She says they broke her door, threw her stuff out. She insists she paid. How do I put *that* in ClearSpeak without making it sound like a minor administrative hiccup?"

  Ben scanned the note, his brow furrowing slightly. "Okay. So, focus on the outcome, not the... method. 'An unscheduled property access event led to the external placement of resident belongings during a tenancy verification process.' See? Accurate, neutral, avoids assigning blame. ClearSpeak’s genius is it keeps things constructive."

  "But it’s *not* accurate!" Maya’s voice rose, drawing a glance from a supervisor two rows over. She lowered it. "Accurate would be 'Council enforcement officers forcibly entered Mrs. Khatri’s home without adequate notice and removed her possessions due to an alleged, but disputed, rent arrears error, rendering her homeless.'"

  Ben shook his head, sipping his tea. "All those judgment words – 'forcibly', 'without adequate notice', 'alleged', 'error', 'homeless'. They’re inflammatory. They presuppose fault and harm. ClearSpeak avoids that negativity spiral. We state observable facts neutrally."

  "The *fact*," Maya insisted, jabbing a finger at Mrs. Khatri’s note, "is that agents acting for the Council did something terrible to her, potentially by mistake or worse. That *is* the observable fact. Saying 'belongings were externally placed' buries the fact that *people* threw them *out*. It buries *who* did it and *how* it felt. How can she get justice if we can’t even *say* what was done?"

  "Justice?" Ben looked puzzled. "This is a records log, Maya, not a courtroom. We document the *situation* for service coordination – maybe she needs temporary accommodation signposting? If there was a procedural error, Internal Alignment will spot it from the neutral facts. Truth doesn’t need loaded language."

  "That’s just it!" Maya leaned forward, her frustration boiling over. "Can’t you see? The truth *here* – the truth that the Council might have actively caused harm – *requires* those 'loaded' words. It requires saying *they did it*. Without those words, without that structure, the truth vanishes. It becomes unsayable. You can have all the 'neutral facts' in the world, but if you can’t structure them to show *agency* and *culpability*, then the core truth – that an institution hurt someone – gets erased. It becomes just... something that happened. Like bad weather."

  Ben stared at her, a flicker of unease crossing his face before settling into mild disapproval. "You’re overcomplicating it. If it happened, it can be said within ClearSpeak. 'Services were accessed resulting in resident displacement.' That covers it. The *truth* is still there."

  "Is it?" Maya whispered, looking back at her screen, at the blinking cursor in the sanitized form. "Where? Show me the word that means 'the Council did wrong'."

  Ben sighed. "The system works, Maya. It keeps things calm, accessible. People understand 'relocation assistance' better than 'eviction'. It’s friendlier. Just log the basics for the pathway team." He retreated to his desk.

  Maya looked at Mrs. Khatri’s desperate scribble, then at the gleaming, restrictive form on her screen. The unsayable truth screamed in the silence: *The Council destroyed this woman’s home*. But ClearSpeak offered no subject to blame, no verb strong enough to convey the violence, no grammatical slot for institutional fault. To speak it officially was impossible. The lexicon, designed for kindness, had built a cage around the harsh realities of power.

  She saved the incomplete form draft – a monument to linguistic absence. Opening a new, blank document outside the official system, Maya began typing furiously, ignoring the red underlines of non-compliant words. She wrote the raw, ugly truth about Mrs. Khatri. But where would this secret record go? Who would see it? And what happened to truth when it had to live in the shadows, exiled from the language of power?

