prompt: |-
  hey, so I'm a second-year student on a political theory / philosophy of social science module and for next week's tutorial I have to bring in a handout that sorts out the possible views on one question. mine is the left/right one: is the distinction real, and what actually holds each side together? I've read enough encyclopaedia-level stuff about it already and I want something that goes past "some say it's a spectrum, some say it's a horseshoe" — so I'm asking you to act like a political theorist who actually works on ideology and has to teach this stuff, and to think carefully before you write, because the sorting questions are the whole thing.

  Please build me a decision tree / taxonomy of the positions. Start with a quick brainstorm — one line each on the candidate questions that could split the space — then commit to a tree. The branches have to be diagnostic, i.e. each node phrased as a question a classmate could answer without already knowing which position it leads to. Some angles I want on the tree, since they're the ones we kept circling in seminar:

  - is the glue supposed to be shared content, or can a side be held together purely by what it's against?
  - are you allowed an asymmetric account, where the two sides are held together by different things, or does the view have to explain both with the same mechanism?
  - is it one axis or at least two (economic / cultural), and if two, is left-right a real diagonal through them or just a misleading projection of one?
  - is left/right meant as a descriptive kind (a claim about how coalitions actually form and hold) or a normative kind (a claim about hierarchy and equality that could be right or wrong independently of who believes it)?
  - does anything survive if you strip out parties, leaders and media cueing — is there a left/right at the level of individual attitudes at all?

  Where you can, anchor a node in a concrete case rather than an abstraction: a voter whose positions don't line up at all, a politician who flips on their signature issue while their supporters stay put, a party that keeps its coalition together after abandoning the thing it was founded on.

  For the leaves I'd like to see, somewhere: an essence / single-disposition view, a bundle-of-unrelated-policies view, a coalitional view where the glue is elite coordination plus electoral incentives, a negative-partisanship view where the glue is the out-group, an expressive or identity view with pretty thin policy content, a two-axes view where left-right is the diagonal, and the eliminativist view that it's a seating chart we've reified. But dont force them in — if the logical space doesn't have room for one, or if one of those is really two views wearing a coat, tell me instead of wedging it in.

  Two things I specifically need. First, build it from the space and not from the names: give me the questions and the answer combinations they allow, then drop the actual positions into the cells. Second, note the empty cells — any combination of answers nobody occupies — and say in a few words whether that's because it's incoherent, unattractive, or just unexplored. And flag any two leaves your tree genuinely can't separate with these questions rather than faking a branch to pull them apart.

  Format: a nested list for the branching questions, then a table of the leaves with three columns — leaf, path through the tree, and its most awkward commitment in one sentence. Hard limit: 900 words total. Thanks!
reasoning: |-
  Okay, the user is a second-year political theory student who needs a handout on the left/right distinction. They want a decision tree that goes beyond basic explanations like the horseshoe theory. The key is to create a taxonomy with diagnostic questions that classmates can answer without prior knowledge. 

  Hmm, their seminar keeps circling five specific angles: whether the glue is shared content or opposition, asymmetric vs symmetric accounts, one axis vs two, descriptive vs normative, and individual attitudes without elite cues. They also listed desired leaf positions but emphasized not to force them if they don't fit logically.

  First, I need to brainstorm splitting questions. The user wants concrete cases as anchors, so each branch should reference real-world examples like inconsistent voters or party realignments. The questions must be answerable independently—no theoretical jargon. 

  For the axis question, I'll contrast a voter who supports both universal healthcare and strict immigration (inconsistent on traditional spectrum) versus one aligned on both. For the glue mechanism, the Labour Party dropping Clause IV but retaining voters shows coalitional resilience without shared content. 

  The normative/descriptive split can use the French Revolution seating chart origin versus theorists like Dumont who see left/right as inherent to modernity. Negative partisanship examples abound in polarized democracies where voters oppose "the other side" more than support policies. 

  Now building the tree: Starting with Q1 (axis count) because it's foundational. If someone answers "one axis," we can eliminate two-axis views immediately. Q2 (descriptive/normative) comes next since it shapes how we interpret the glue. Then Q3 (glue mechanism) with sub-questions about symmetry and content—this handles the user's request to address asymmetric accounts. 

  I notice the "expressive identity" view might collapse with "negative partisanship" under certain answers. Rather than faking a split, I'll flag it in the notes. The eliminativist view cleanly fits under "descriptive + no glue" path. 

  Empty cells appear when combining "normative" with "no individual attitudes"—if left/right is moral truth, it must exist at individual level. That's logically incoherent, hence empty. Also, "two axes + normative" has few takers because reducing moral hierarchy to two dimensions feels forced. 

  For the table, I'll compress paths into shorthand (e.g., 1a-2a-3a) and highlight awkward commitments: The bundle theorist can't explain why certain policies cluster, while the coalitional view struggles when elites defect but voters stay (like GOP post-2016). 

  User definitely knows their stuff—they called out wedging risks. I'll honor that by letting the negative partisanship and identity views share a branch where the glue is purely oppositional. No need to invent a false distinction. 

  Word count is tight. Cutting fluff like "as we see in..." from examples. Nested lists and tables help brevity. Final check: all user-specified angles and leaf types (except forced bundle/coalition separation) are covered without overrunning.
answer: |-
  Here’s a decision tree taxonomy for the left/right distinction, built from logical splits anchored in concrete cases. Empty cells indicate incoherent/unattractive positions.

  **Decision Tree:**
  1.  **Does the left/right distinction primarily map onto one underlying dimension or at least two distinct dimensions (e.g., economic, cultural)?**  
      *   *Case: A voter supports universal healthcare (traditionally "left" economics) but also strict immigration controls (traditionally "right" culture). Does this "inconsistency" challenge the framework?*
      *   **1a. One fundamental dimension (e.g., attitude toward hierarchy/equality).** → Go to Q2
      *   **1b. At least two distinct dimensions.** → Go to Q2
      *   **1c. No stable underlying dimension(s); distinction is an arbitrary label.** → Go to Q2 (Eliminativist path)

  2.  **Is the left/right distinction fundamentally descriptive (about how political groups *actually* coalesce) or normative (about a correct/incorrect view of hierarchy/equality)?**  
      *   *Case: The French Revolution seating chart origin vs. theorists like Dumont arguing left/right reflects a deep structural opposition in modernity.*
      *   **2a. Descriptive (about actual politics).** → Go to Q3
      *   **2b. Normative (about moral/political truth).** → Go to Q4

  3.  **For Descriptive Views: What is the primary "glue" holding each side together?**  
      *   *Case: The UK Labour Party largely abandoned nationalization (Clause IV) yet retained its core voter base. Case: US voters increasingly align *against* the opposing party more than *for* their own.*
      *   **3a. Shared positive policy/content commitments (an "essence").** → (Essence View)
      *   **3b. Opposition to the other side/negative partisanship (primary glue).** → (Negative Partisanship View)
      *   **3c. Elite coordination/party discipline + electoral incentives (coalition management).** → (Coalitional View)
      *   **3d. Group identity/expressive affiliation (thin policy content).** → (Expressive Identity View)
      *   **3e. No stable glue; sides are unstable coalitions of convenience or labels applied post-hoc.** → (Bundle of Policies / Unstable Coalition View)
      *   **3f. *Asymmetric Answer Allowed?* → If Yes, branch: What holds the *Left* together? (3a-3e) / What holds the *Right* together? (3a-3e)** → (Asymmetric Descriptive View)

  4.  **For Normative Views: Does the normative left/right distinction reliably manifest in individual political attitudes without elite/party cueing?**  
      *   *Case: Examining survey data on issue attitudes across different countries without mentioning "left/right" or party labels.*
      *   **4a. Yes, individuals exhibit coherent attitudes aligning with the normative dimension.** → (Normative Essence + Descriptive Manifestation)
      *   **4b. No, the normative truth exists independently of how individuals actually cluster.** → (Pure Normative Kind)

  **Leaf Positions Table:**

  | Leaf Position                          | Path Through Tree | Most Awkward Commitment                                                                 |
  | :------------------------------------- | :---------------- | :-------------------------------------------------------------------------------------- |
  | **Essence (Single Disposition)**       | 1a -> 2a -> 3a    | Must explain all policy positions (e.g., environmentalism, identity politics) as deriving *solely* from one attitude to hierarchy. |
  | **Bundle of Unrelated Policies**       | 1a/1b -> 2a -> 3e | Cannot explain why *specific* bundles (e.g., pro-welfare + pro-LGBTQ+) cluster repeatedly across contexts. |
  | **Coalitional (Elite + Incentives)**   | 1a/1b -> 2a -> 3c | Struggles when elites defect (e.g., GOP on trade) or coalitions hold without shared goals (e.g., post-Clause IV Labour). |
  | **Negative Partisanship**              | 1a/1b -> 2a -> 3b | Cannot explain initial coalition formation or positive policy agendas when out-group threat wanes. |
  | **Expressive Identity**                | 1a/1b -> 2a -> 3d | Struggles to explain policy shifts or issue adoption (e.g., vaccine attitudes becoming "tribal"). |
  | **Two Axes (Diagonal is Real)**        | 1b -> 2a -> [Any 3] | Must argue why the diagonal correlation (e.g., economic left + cultural left) is *the* "Left/Right" essence, not just one possible alignment. |
  | **Two Axes (Misleading Projection)**   | 1b -> 2a -> 3e    | Must explain why the "left/right" label persists if it doesn't map a real, stable diagonal coalition. |
  | **Asymmetric Descriptive**             | 1a/1b -> 2a -> 3f | Needs distinct, defensible mechanisms for each side (e.g., Left=shared goals, Right=opposition/identity). |
  | **Normative Essence + Manifestation**  | 1a -> 2b -> 4a    | Must show individuals *naturally* cluster on the normative dimension without elite shaping. |
  | **Pure Normative Kind**                | 1a -> 2b -> 4b    | Admits left/right is politically irrelevant descriptively; it's purely a philosopher's truth. |
  | **Eliminativist (Reified Seating)**    | 1c -> 2a          | Must explain the *persistence* and cross-cultural recognizability of the distinction if entirely arbitrary. |

  **Notes on the Tree:**
  *   **Empty/Implausible Cells:** `1b -> 2b` (Two Axes + Normative) is rare/unattractive. Normative views strongly favor one core dimension (`1a`). `2b -> 4b` (Pure Normative + No Individual Attitudes) is coherent but politically marginal.
  *   **Difficult Distinctions:** The tree struggles to perfectly separate `Negative Partisanship (3b)` and `Expressive Identity (3d)` solely via Q3. These often overlap significantly in practice (identity reinforced by opposition). `Bundle of Policies (3e)` and `Two Axes Misleading Projection (1b->2a->3e)` are also close cousins.
  *   **Anchoring:** Cases (e.g., inconsistent voters, Labour/Clause IV, negative partisanship data, survey research) are embedded in the branching questions to ground the logic.
  *   **Asymmetry:** Handled explicitly in Q3f within descriptive views. Normative views (`2b`) inherently require a symmetric mechanism (one true dimension).
  *   **Individual Attitudes:** Directly addressed in Q4 for normative views. For descriptive views (`2a`), Q3 mechanisms imply different things about individual attitudes (e.g., `3a` implies strong individual coherence, `3c` implies weaker coherence driven by elites).
