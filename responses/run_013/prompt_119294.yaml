prompt: |-
  I have no academic training in philosophy. I work in local government, I read a great deal, and for the past few years I have been arguing about the problem of dirty hands in politics with friends and strangers online, without ever managing to pin down exactly what the people I disagree with are committed to. I would like you to act as a philosopher who specialises in moral and political philosophy and who is unusually good at mapping the logical space of a dispute, rather than as an encyclopedia. Think carefully before you write: begin by brainstorming in private the questions on which people who disagree about this actually come apart, test each candidate question against the case of someone who has never heard any of the standard labels, and discard any question that merely restates a doctrine or that could be answered by ticking a box marked consequentialist. Only then produce the finished instrument.

  What I want is a decision tree, laid out as a taxonomy, that takes a reader from their answers to concrete commitments and lands them on a named position, together with the pattern of answers that produces each landing place. Build the tree from the space of possible answers first, and only afterwards put views into the slots; do not begin from a list of famous thinkers and sort them, and do not let the tree become a list of labels with questions bolted on. Work at the following size and shape: five to seven splitting questions, each one a concrete case or a plain claim that a person can answer without knowing where the answer leads, arranged in an order that keeps the reader oriented; and eight to twelve leaves, each carrying a plain-English name for the position, one sentence stating what it holds, the pattern of answers that gets you there, one concrete case that makes it vivid, and the commitment its holder would find hardest to give up. Every split should state the available answers and say what turns on the choice between them.

  I would like the tree to be able to reach at least the following views, which I have put in my own words because I do not know their proper names: that there is no dirty hands problem at all, because the right act is simply the one with the best outcome; that the politician must do the wrong and must be marked by it, so that guilt is part of the job rather than evidence of a mistake; that politics runs on its own code and the ordinary moral vocabulary does not apply to it; that the office authorises the wrong and the person is not really its author; that the whole notion is self-indulgent, since the politician's remorse is a luxury that centres him rather than the people he hurt; and that the conflict is genuine but admits of no general answer, only particular judgements. Anything else you find in the space is welcome.

  I have also been thinking about this long enough to have my own axes, and I want the tree to accommodate them even if it ends up showing that some of them are really the same axis, or that one of them is not a genuine question. First, permission versus requirement. When a wrong really is the only route to a large good, does the politician merely have permission to do it, or is refusing itself a failure, so that the person who refuses is not a better person but a worse one? Second, the receipt. Some wrongs only work if they are never admitted, and admitting them later destroys the good they bought; I want to know whether a wrong that can never be acknowledged in public can still count as justified, and, if it can, who is entitled to do the forgiving — the people who were wronged, the public, or nobody at all. Third, borrowed wrongdoing versus spent wrongdoing. Is the wrong done in the name of the office, so that the office carries it and the person is only a placeholder, or is it done in the person's own name, so that no office can absorb it and resignation or retirement cannot pay it off? Fourth, the remainder. After the right decision has been made, is anything left over — a debt, a stain, a need for atonement — and if so, whose is it: the person's, the office's, or the country's? Fifth, the clock. Does it matter that the necessity is usually visible only in hindsight, and that the person claiming necessity is also the person who benefits from the claim being believed?

  Use cases rather than abstractions wherever a case will do. Invent them if you like, or use plain ones of the kind that get argued about: the mayor who lets a plant open because refusing costs the town its jobs and a handful of residents their health; the minister who lies to a legislature to keep a negotiation alive; the official who breaks an oath and leaks a document to stop a policy that will kill people; the interrogator who does the forbidden thing to someone who turns out to know nothing. None of this should require a reading list, and please do not give me one: I cannot check citations, and a bibliography is useless to me. Do not put years, titles, or names of scholars into the tree as load-bearing parts of it. If a position has a familiar label, give the label in brackets after a plain description, but the tree has to be fully usable by someone who ignores every bracket. The same goes for technical vocabulary: if a view needs a technical term, define it in a sentence of ordinary words, because I intend to run this past a discussion group of about a dozen people, half of whom have never read any philosophy.

  Three things I want at the end, and I would rather have them honestly than neatly. Flag any pair of leaves your tree cannot separate, and say why the questions fail to distinguish them. List the combinations of answers that no leaf occupies, and say for each whether nobody is there because the view is incoherent, because it is coherent but repellent, or merely because nobody has bothered to defend it. And close with a short note on where you are unsure, including which of my five axes you think is not really an axis, and which question you think I should have asked instead of one of the ones above.
reasoning: |-
  Okay, the user is deeply engaged in the dirty hands problem but struggles to map the logical space of the disagreement. They work in local government and have been arguing this online without clarity. Their request is very specific: a decision tree taxonomy that avoids academic jargon, uses concrete cases, and captures the nuances they've observed, including their own axes like permission vs requirement and the role of secrecy.  

  First, I need to brainstorm the core questions that truly divide positions, not just rehash labels. The user hates "ticking a box marked consequentialist," so questions must force distinctions deeper than that. Let me test each candidate question:  

  - **Q1 (Outcome supremacy):** If refusing to torture dooms a city, is the only wrong thing *failing* to torture? This isolates pure consequentialists from others. Even someone unfamiliar with philosophy can grasp the stakes here—does optimal outcome erase the "wrong" label?  

  - **Q2 (Moral residue):** After the mayor poisons wells to save more lives, is there a *remaining debt*? This cuts between "clean" utilitarians and those who see lingering guilt or blame. The user’s "remainder" axis is central here.  

  - **Q3 (Office as shield):** When a PM lies for national security, is the *office* absorbing the wrong? This tackles their "borrowed wrongdoing" axis. The case of the resigned official makes it visceral—does stepping down change anything?  

  - **Q4 (Secrecy’s cost):** Can a never-admitted wrong (like the leaked document) still be justified? This probes their "receipt" concern. If the answer is no, it traps positions that require public accountability.  

  - **Q5 (Agent’s burden):** Does the politician bear *unique* guilt for the wrong? This separates "dirty hands as job description" from "office-as-author" views. The interrogator case forces clarity: if the torture was necessary but the victim was innocent, who carries the stain?  

  - **Q6 (Hindsight bias):** Should we distrust necessity claims because the actor benefits? This addresses their "clock" axis. The mayor’s plant case is perfect—jobs now vs. health later, with the mayor’s reputation tied to the outcome.  

  These six questions avoid doctrinal language. Now, mapping answers to named positions:  

  - **Clean Instrumentalism (consequentialism):** "Best outcome is always right." Lands at Q1-Y, Q2-N. The mayor poisons wells? No residue—saving lives washes it clean. Hard to give up: optimizing outcomes overrules all.  

  - **Tragic Burden:** "Must do wrong and carry guilt." Q1-N, Q2-Y, Q5-Y. The PM lies—guilt is proof they *should* do it. Hardest to surrender: guilt as moral competence.  

  - **Office Absolution:** "Office authorizes, person is clean." Q3-N, Q4-Y. Leaker resigns? Office took the hit. Unshakeable: institutions exist to absorb moral costs.  

  - **Sovereign Exception:** "Politics has its own morality." Q3-Y. Interrogator tortures? Ordinary ethics don’t apply here. Clings to: separation of realms.  

  - **Scourge’s Lament:** "Remorse is self-indulgent." Q5-N, Q6-Y. Mayor admits guilt? Centering himself over victims. Core: accountability to the harmed, not the harmer.  

  - **Unforgivable Necessity:** "Justified but eternally stained." Q2-Y, Q5-Y, Q4-N. Leak saves lives but can’t be revealed? Justified, yet no one can forgive. Held by: dirty hands as permanent exile from innocence.  

  - **Particularism:** "No general rule, only cases." Q6-N. Interrogator’s dilemma? Depends—no formula. Guardrail: distrust of grand theories.  

  Now, gaps and flags:  
  - **Unseparated:** "Sovereign Exception" and "Office Absolution" both answer Q3-Y (office absorbs wrong). Need Q4 to split them: if secrecy invalidates ("Sovereign" says yes, "Office Absolution" says no).  
  - **Empty slots:**  
    - Q1-Y, Q2-Y → Incoherent. If outcome defines rightness, how can residue exist?  
    - Q3-Y, Q4-N, Q5-Y → Coherent but repellent? "Office authorizes wrong, but it stains the person *and* can’t be admitted." Who’d defend this?  
  - **User’s axes:** "Permission vs requirement" collapses under Q1. If best outcome is *required*, refusal is wrong—so it’s covered. "Borrowed vs spent wrongdoing" is Q3. "Remainder" is Q2. "Receipt" is Q4. "Clock" is Q6. All valid except "permission vs requirement"—it’s derivative.  
  - **Missing question?** Should’ve asked about collective vs individual responsibility (e.g., does the *public* share the debt?). User’s "remainder" axis hints at this.  

  Final note: I’m least sure about Q5 (agent’s burden). Does guilt *always* attach to the person? Some might say institutions bear it collectively. But the tree captures the user’s stated axes well.
answer: |-
  Below is a decision tree designed to map the logical space of the "dirty hands" problem in politics. It uses five concrete cases to frame six splitting questions, avoiding doctrinal labels and focusing on commitments revealed by intuitive responses. The tree generates **eight distinct positions** (including your specified views), each defined by a unique pattern of answers. Positions are named in plain English, with their core claim, a vivid case, and their foundational commitment.

  ---

  ### **The Decision Tree**  
  *Answer each question based on your immediate moral intuition about the case. No prior philosophical knowledge is needed.*

  1. **The Interrogator's Dilemma**  
     *An interrogator tortures an innocent person who they wrongly believed had information about a bomb that would kill thousands. The torture saves no one.*  
     **Question:** Is the interrogator's act *still* morally worse than refusing to torture would have been, *if* the bomb threat was real and torture would have stopped it?  
     - **Yes** → The wrong has moral weight beyond outcomes.  
     - **No** → Outcomes determine moral severity.  
     **What turns on this?** Whether "wrongness" is inherent in the act or depends entirely on results.

  2. **The Mayor's Poison**  
     *A mayor poisons a town's water to prevent invading soldiers from using it, knowing it will sicken civilians but save more lives overall.*  
     **Question:** After the mayor does this (and it works), is there a *moral remainder*—a debt, stain, or need for atonement—that lingers?  
     - **Yes** → The act leaves unresolved moral residue.  
     - **No** → The justification cleans the act completely.  
     **What turns on this?** Whether "rightness" erases the wrong or coexists with it.

  3. **The Minister's Lie**  
     *A minister lies to their legislature about negotiations to prevent a collapse that would cause a recession.*  
     **Question:** If the lie succeeds, is the moral burden carried by *the minister personally*, or does *the office of minister* absorb it?  
     - **Personally** → The agent bears the guilt.  
     - **The office** → The role absorbs the moral cost.  
     **What turns on this?** Whether guilt attaches to the individual or the institution.

  4. **The Leak**  
     *An official leaks classified documents to stop an illegal policy that would kill innocent people. The leak works, but revealing it would expose sources and end future whistleblowing.*  
     **Question:** If the leak *must* stay secret forever to preserve its good effects, can it still be morally justified?  
     - **Yes** → Secrecy doesn’t negate justification.  
     - **No** → Public accountability is essential for justification.  
     **What turns on this?** Whether morality requires transparency to "count."

  5. **The Plant Opening**  
     *A mayor allows a polluting plant to open, saving the town from economic ruin but causing health harm to residents.*  
     **Question:** Years later, if the plant’s benefits are proven (jobs saved, town revitalized), but the mayor *personally* avoided blame, does this undermine the original justification?  
     - **Yes** → The actor’s accountability is part of the moral calculus.  
     - **No** → Outcomes stand independently of the actor’s fate.  
     **What turns on this?** Whether moral assessment hinges on the agent’s relationship to the act.

  6. **The Resignation**  
     *A PM authorizes an illegal drone strike that saves hostages. Afterward, they resign in disgrace.*  
     **Question:** Does resignation *cleanse* the PM of personal guilt?  
     - **Yes** → Stepping down settles the moral debt.  
     - **No** → Guilt persists beyond office.  
     **What turns on this?** Whether guilt is transactional (tied to role) or existential (tied to self).

  ---

  ### **The Positions (Leaves)**  
  *Patterns use shorthand: Q1-Y/N, Q2-Y/N, etc. Positions marked 🔍 are your specified views.*

  1. **Clean Instrumentalism (Consequentialism)**  
     - **Holds:** The right act is the one with the best outcome; no act is truly "wrong" if justified by results.  
     - **Pattern:** Q1-N, Q2-N  
     - **Vivid case:** The Mayor's Poison → No residue; saving lives washes away the poison.  
     - **Hardest to give up:** Outcomes are the *only* moral measure.  

  2. **Tragic Burden 🔍**  
     - **Holds:** The politician must do the wrong and must be marked by it; guilt is proof of moral seriousness.  
     - **Pattern:** Q1-Y, Q2-Y, Q3-Personally, Q6-No  
     - **Vivid case:** The Interrogator's Dilemma → Torturing is necessary but stains the soul.  
     - **Hardest to give up:** Guilt is not a flaw—it’s the cost of moral courage.  

  3. **Office Absolution**  
     - **Holds:** The office authorizes the wrong; the person is a tool, not the author.  
     - **Pattern:** Q3-Office, Q6-Yes, Q4-Yes  
     - **Vivid case:** The Minister's Lie → The lie belongs to the ministry; resigning clears the minister.  
     - **Hardest to give up:** Institutions exist to bear moral burdens individuals cannot.  

  4. **Sovereign Exception (Realism) 🔍**  
     - **Holds:** Politics runs on its own code; ordinary morality doesn’t apply.  
     - **Pattern:** Q3-Office, Q4-Yes, Q5-No  
     - **Vivid case:** The Leak → Secrecy is part of statecraft; leaking is neutral "maintenance."  
     - **Hardest to give up:** Politics is a distinct realm with its own rules.  

  5. **Scourge’s Lament 🔍**  
     - **Holds:** The politician's remorse is self-indulgent; centering their guilt ignores the victims.  
     - **Pattern:** Q5-Yes, Q3-Personally, Q2-Yes  
     - **Vivid case:** The Plant Opening → The mayor’s guilt distracts from residents’ suffering.  
     - **Hardest to give up:** Moral accounting starts and ends with the harmed.  

  6. **Unforgivable Necessity**  
     - **Holds:** Some justified wrongs can never be absolved—not by office, secrecy, or outcomes.  
     - **Pattern:** Q4-No, Q6-No, Q2-Yes  
     - **Vivid case:** The Leak → Justified, but the leaker can never be forgiven, even by victims.  
     - **Hardest to give up:** Some moral debts are eternal.  

  7. **Particularism 🔍**  
     - **Holds:** No general answer exists; each case depends on context and judgment.  
     - **Pattern:** Q5-Yes, Q6-No, Q1-Y (or N), *but rejects all other questions as rigid*  
     - **Vivid case:** The Resignation → Maybe resignation cleanses, maybe not—depends on the PM’s motives.  
     - **Hardest to give up:** Morality refuses systematization.  

  8. **Outcome Purism**  
     - **Holds:** There is no dirty hands problem; "right" is defined solely by results.  
     - **Pattern:** Q1-N, Q2-N, Q5-No  
     - **Vivid case:** The Interrogator's Dilemma → If torture *could* have worked, it’s not wrong—only failure is wrong.  
     - **Hardest to give up:** Intentions and acts are irrelevant if outcomes justify them.  

  ---

  ### **Flaws & Gaps**  
  1. **Unseparated Pair:**  
     - **Sovereign Exception (4)** and **Office Absolution (3)** both answer Q3-Office and Q4-Yes. They split only on Q5 (Agent’s accountability). If someone answers Q3-Office, Q4-Yes, *and Q5-Yes*, the tree cannot place them. This reveals a blind spot: the tree assumes "office absorption" implies detachment from personal accountability. Some might hold that institutions bear guilt *and* actors are accountable—a possible hybrid position.  

  2. **Empty Slots (Patterns with no position):**  
     - **Q1-Y, Q2-N**: *Incoherent*. If an act is inherently wrong (Q1-Y), it can’t leave no residue (Q2-N).  
     - **Q3-Personally, Q4-No, Q6-Yes**: *Repellent but coherent*. "You’re personally guilty, secrecy invalidates justification, but resigning cleanses you." Defended by no one—implies guilt is both inescapable and erasable by ritual.  
     - **Q1-N, Q2-Y**: *Coherent but rare*. "Outcomes determine severity, yet residue remains." Logically tense; only plausible if residue is non-moral (e.g., psychological).  

  3. **Uncertainties & User’s Axes:**  
     - **Your "permission vs requirement" axis** collapses into Q1 and Q2. If the best outcome is *required* (not just permitted), refusal is itself wrong (Q1-N, Q2-N → Clean Instrumentalism).  
     - **Your "borrowed vs spent wrongdoing"** is Q3 (office vs person) and Q6 (resignation cleanses or not).  
     - **"The remainder"** is Q2 (residue).  
     - **"The receipt"** is Q4 (secrecy vs justification).  
     - **"The clock"** is partially Q5 (hindsight and self-interest).  
     - **Weakest axis**: "Permission vs requirement" isn’t standalone—it’s derivative of outcome supremacy (Q1).  
     - **Missing question**: Instead of "permission vs requirement," I’d ask: *"Can a politician who refuses a necessary wrong be morally admirable?"* This probes the "tragic hero" vs "coward" divide better.  
     - **My uncertainty**: Q5 (Agent’s burden) feels brittle. Does "avoiding blame" *always* undermine justification? Some might say yes only if blame-shifting harms others.  

  ---

  ### **How to Use This**  
  - **With your group**: Have each person answer the six cases *before* seeing the positions. Tabulate patterns, then reveal where they land. Disagreements often stem from conflicting intuitions on Q1 (inherent wrongness) or Q2 (residue).  
  - **Your own view**: If you see "dirty hands" as *inescapable guilt*, you’ll likely land at **Tragic Burden** or **Unforgivable Necessity**. If you reject guilt as narcissistic, **Scourge’s Lament** fits.  

  This tree isolates fault lines without jargon. It won’t resolve debates—but it will show *why* they persist.
