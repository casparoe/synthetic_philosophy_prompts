answer: |-
  I'll break this down systematically—first unpacking "you can't argue with the math" into precise claims, assessing their validity, and then addressing your core questions. As a retired chemist diving into philosophy, you're spot-on to question this phrase: it's often used as a rhetorical stop sign, but it smuggles in several distinct (and often conflated) ideas. I'll categorize them into "flat/boring" (modest, technical) and "dramatic" (bold, philosophical) claims, then evaluate each for truth, defensibility, or falsity. Finally, I'll tackle the inconsistency scenario and your worry level. Your neighbor likely defaults to the weaker claims, not the stronger ones he *thinks* he's defending.

  ---

  ### **The Menu: What "You Can't Argue with the Math" Might Mean**
  I've distilled five key interpretations, ordered from least to most ambitious. For each, I note:
  - **Status**: Trivially true (TT), defensible (D), or false (F).
  - **Survival under inconsistency**: Does it hold if arithmetic is inconsistent? (Using your "0=1 proof" scenario.)
  - **What your neighbor probably means**: Based on common usage by scientists/mathematicians.

  #### 1. **Mathematical Necessity (Internal Deduction)**  
     - **Claim**: *If you accept axioms A and rules of inference R, then theorem T follows inevitably. You can't argue with the deduction itself—only with A or R.*  
     - **Status**: **TT** (trivially true by definition).  
       - This is just symbolic manipulation: e.g., if you grant Peano axioms, 2+2=4 is unavoidable.  
     - **Survives inconsistency?** **Partially**.  
       - In classical logic, an inconsistent system "explodes" (ex falso quodlibet—any statement becomes provable, like 0=1 implying 2+2=5). So deduction loses meaning.  
       - But in **paraconsistent logics** (e.g., relevance logic), contradictions don't propagate everywhere. You could still have "islands" of reliable deduction (e.g., finite arithmetic might remain intact). So *local* necessity holds.  
     - **Neighbor's likely commitment**: **High**. This is the safest, least philosophical reading—common lab-math pragmatism.

  #### 2. **Unassailable Correctness (Infallibility)**  
     - **Claim**: *Mathematical proofs, once verified, are objectively and eternally correct—free from doubt or revision.*  
     - **Status**: **D** (defensible but contested).  
       - Gödel shattered Hilbert's dream of complete certainty: no consistent formal system can prove its own consistency. We rely on meta-justifications (e.g., "ZFC set theory feels sound").  
     - **Survives inconsistency?** **No**.  
       - If arithmetic is inconsistent, proofs can "prove" falsehoods, so correctness collapses. Paraconsistent logics salvage *some* structure but force us to accept "true contradictions," undermining infallibility.  
     - **Neighbor's likely commitment**: **Medium**. He might *say* this, but mathematicians know better—Gödel is taught early. He's probably gesturing at necessity (#1).

  #### 3. **Empirical Immunity (Apriority)**  
     - **Claim**: *Math doesn't depend on sensory experience. Its truths are known independently of the physical world.*  
     - **Status**: **TT/D** (trivially true for formalism; defensible for Platonism).  
       - Even if physics changes, "3 is prime" holds. But *why* it holds is debated (e.g., is math invented or discovered?).  
     - **Survives inconsistency?** **Yes, mostly**.  
       - Inconsistency might mean math doesn't "describe" anything, but its *method* remains experience-independent. We'd still derive theorems from axioms—just with less confidence. Paraconsistent logics keep this intact.  
     - **Neighbor's likely commitment**: **High**. Scientists often appeal to math's purity vs. "messy" empiricism.

  #### 4. **Foundational Security (Arithmetic as Bedrock)**  
     - **Claim**: *Basic arithmetic (e.g., Peano axioms) is unshakeable—the secure foundation for all math/science.*  
     - **Status**: **D/F** (historically defensible, but false after Gödel).  
       - Gödel showed arithmetic can't self-verify consistency. We use it because it works, not because it's proven secure.  
     - **Survives inconsistency?** **No**.  
       - If 0=1 is provable, arithmetic isn't a foundation—it's broken. We'd need a new base (e.g., category theory, finitism, or paraconsistent systems).  
     - **Neighbor's likely commitment**: **Low/Medium**. He might *think* this, but logicians don't. His phrase targets applied math, not foundations.

  #### 5. **Discourse-Ending Authority (Rhetorical Shield)**  
     - **Claim**: *Invoking "math" ends debate—it's the ultimate trump card against philosophical or empirical challenges.*  
     - **Status**: **F** (false as a universal rule).  
       - Math can't resolve *external* disputes (e.g., "Do numbers exist?" or "Is this equation *useful*?"). It’s a tool, not an oracle.  
     - **Survives inconsistency?** **Ironically, yes**.  
       - Even if inconsistent, math remains pragmatically useful (see below). People would keep using it as a rhetorical cudgel!  
     - **Neighbor's likely commitment**: **High**. This is his *behavior*—shutting down discomfort. But it's lazy philosophy.

  ---

  ### **Which Claims Survive If Arithmetic Is Inconsistent?**
  - **Robust survivors**: Only **Mathematical Necessity** (in paraconsistent systems) and **Empirical Immunity**. Deduction persists if we abandon classical logic, and math's apriority is unscathed.  
  - **Collapsed claims**: **Unassailable Correctness** and **Foundational Security**—inconsistency guts them.  
  - **Social survivor**: **Discourse-Ending Authority** thrives on utility, not truth.  

  **Paraconsistent logics** are key here. In these systems (e.g., Priest's LP logic), a contradiction (A and ¬A) doesn't imply *everything* is true. You can quarantine inconsistencies—like containing a lab spill—so math stays usable for chemistry or engineering. For example, even if infinite set theory has a contradiction, finite calculations (e.g., balancing equations) might be unaffected. It's not magic: you lose some power (e.g., no more proof by contradiction), but it's a coherent fallback.  

  **Your neighbor's actual commitment**: He's almost certainly defending **Mathematical Necessity** (#1) or **Empirical Immunity** (#3)—flat claims that avoid philosophy. When he says "you can't argue with the math," he likely means: *"Given our axioms, this derivation is compulsory, and it's not up for debate like empirical data."* That's defensible... but it doesn't justify his rhetorical use of it to dismiss *deeper* questions (e.g., "Do numbers correspond to reality?"). He's conflating the internal ("how we calculate") with the external ("why it works").  

  ---

  ### **Should You Be Worried? Short Answer: No, Sleep Soundly**
  This is a **dinner-table curiosity**, not a nightmare scenario. Here's why:  
  1. **Practical inertness**: If an inconsistency exists in Peano arithmetic, it's almost certainly a "Gödelian monster"—enormously long, non-constructive, and irrelevant to real-world math. Think of it like a radioactive isotope with a half-life longer than the universe: theoretically unstable, but practically inert. Chemistry still uses quantum models despite unsettled foundations (e.g., measurement problem). Similarly, engineers use calculus without caring if ZFC is consistent.  
  2. **Paraconsistent fallback**: If inconsistency surfaced, we'd switch logics and carry on. Life wouldn't change—just as non-Euclidean geometry didn't collapse physics.  
  3. **No existential threat**: Math isn't "true" in an absolute sense—it's a human tool. If flawed, we'd revise it (like Newton to Einstein). Science uses math as a language; inconsistency would be a grammatical hiccup, not a reality meltdown.  

  **When to worry?** Only if you're a foundationalist philosopher or a set theorist. For chemistry, physics, or daily life? It's a fascinating thought experiment, nothing more. Your neighbor's phrase is a conversation-stopper, not wisdom. Arm yourself with this menu—especially #1 and #5—and next time, ask: *"Which math? And can it argue with itself?"* That might turn the tables.  

  If you want ammunition: Read Priest's *In Contradiction* (on paraconsistency) or Franzén's *Gödel's Theorem: An Incomplete Guide*. Both are accessible and lethal to "you can't argue with the math" as a universal claim.
