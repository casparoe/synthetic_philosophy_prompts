  Retired chemist here, spent most of my working life in a lab and only started reading philosphy after I stopped, so forgive me if I fumble the vocabulary. My neighbour is a retired mathematician and we argue most evenings. Whenever a conversation gets uncomfortable — whether the numbers in my old equations really pick out anything in the world, whether a theory could be "true" but useless, whatever — he reaches for the same line: you can't argue with the math. For him that seems to settle it. It got under my skin lately because I've been reading about the possibility that the basic axioms of arithmetic are actually inconsistent — that there might be a proof of 0=1 sitting in there somewhere, just so absurdly long that nobody has ever written it down, and that thanks to Godel the system can't certify its own consistency from the inside, so we couldn't rule it out by any internal means. Someone also told me there are logics where a contradiction doesn't make everything collapse, which I don't fully follow. So now I genuinely don't know what "you can't argue with the math" is actually asserting. Can you break it into the different precise claims it might be making — the flat boring ones and the dramatic ones — and for each say whether it's trivially true, defensible, or just false, and which of them (if any) would survive the scenario where arithmetic turns out to be inconsistent? I'd like a menu I can take back to him. And I'd like your best guess at which of the readings he's actually committed to when he says it, because I suspect he's defending something much weaker than he thinks he is. If it turns out none of the readings survive, then tell me straight — how worried should I be? I honestly can't tell whether this is a dinner-table curiosity or something that should keep me up at night.
