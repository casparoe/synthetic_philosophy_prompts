  I recalled that thermostats are often used in philosophy to discuss minimal consciousness. A joke about a thermostat's micro-experiences unable to form a unified "desire" for temperature could highlight the combination problem. Adding a corporate angle might make it relatable—shareholders as micro-subjects unable to form a cohesive decision, paralleling the thermostat's issue.

