  Another rule might focus on teleology: whether the system's purpose comes from natural selection or human assignment. Original intentionality stems from biological functions shaped by evolution. The robot's purpose comes from the grad student's fitness function, so derived. But wait, the bacterium's purpose is natural, so original. The thermostat's purpose is human-assigned, derived. Makes sense.

  But then there's the octopus—also evolved, so original. The chess engine's purpose is human-assigned (winning chess), derived. The robot's purpose is obstacle avoidance via artificial evolution. So under teleology rule, it's derived.

  The user wants rules that fit all verdicts. Both these rules seem to fit. But maybe there's a third rule about intrinsic meaning versus derived representation. Like, does the system have representations that are inherently meaningful? But that's fuzzy.

