prompt: |-
  I chair the clinical ethics committee at a mid-sized teaching hospital, and we keep getting consulted on cases where a treatment will foreseeably cause a serious harm—death, the loss of a fetus, the loss of one twin—while the clinical team's aim is to relieve suffering or save a life. We have no shared procedure for these cases, and the conversation usually becomes a fight about whether the harm is intended or merely foreseen. I want a reusable decision procedure grounded in the doctrine of double effect that my committee can actually run in a thirty-minute meeting. I am not asking for a tour of trolley problems; I want the doctrine made usable.

  Write it as a procedure, not an essay. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it stops with a yes, and where it hands the decision to a person because the question is one of values rather than facts. Our recommendations are advisory, but they carry weight with the attending clinician and the family, so the procedure should say who has to sign off and when legal counsel must be brought in. I want the procedure to be a burden-shifting one: I have become convinced that the doctrine is best read as a set of questions that move the burden of proof back and forth, not as a checklist of necessary and sufficient conditions. Make that reading explicit, and say where it distorts the doctrine or where it makes the doctrine more permissive than its standard statement. Each question, when answered one way, should shift the burden to the objector or to the proponent.

  Do not give me a textbook recitation of the four conditions; I want the operational version—which condition is doing the work in which kind of case, which conditions collapse into each other, and which are doing no work at all. The procedure must force the committee to separate three attitudes: aiming at the harm, accepting it as a foreseeable side effect, and using it as a means. I want a question for each, and I want the procedure to say what follows when the honest answer is that the harm is being used as a means. Be honest about which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases: (1) a terminally ill patient in severe pain, where the team proposes escalating opioids and foresees that this may suppress respiration and hasten death; (2) conjoined twins sharing vital organs, where separation will save one and cause the death of the other; and (3) a pregnant patient with cancer, where chemotherapy is needed to save her life and will likely cause the death of the fetus. Include at least one case where the procedure's verdict is one I will not like—either because it permits something I find repugnant or forbids something I think is clearly right—and explain why the procedure gives that verdict anyway. Mark the points where the procedure cannot eliminate judgment, and say what the procedure cannot do.

  At the end, state how confident you are in the procedure as a whole and in its main steps, and identify the single point in the procedure you are least sure about, with your reasons. Do not include citations, reading lists, or references to the literature; I want the procedure itself.
reasoning: |-
  Okay, the user chairs a clinical ethics committee and is dealing with tough cases where treatments cause serious harms like death or loss of a fetus while trying to save lives or relieve suffering. They're frustrated with endless debates about whether the harm is intended or merely foreseen. What they need is a practical, step-by-step procedure based on the doctrine of double effect (DDE) that can be used in 30-minute meetings. 

  First, I need to understand their pain points. They want something operational, not theoretical—no trolley problems or textbook recitations. The key is to make DDE usable by turning it into a burden-shifting framework. The user is clearly experienced but needs a tool to streamline discussions and avoid philosophical gridlock. 

  The core challenge is separating three attitudes: aiming at harm, accepting it as a side effect, and using it as a means. DDE's standard four conditions (intention, proportionality, etc.) need to be distilled into actionable questions. I should collapse or reframe conditions where they overlap (e.g., proportionality often bleeds into intention) and focus on what actually matters in clinical practice. 

  I’ll structure the procedure as a flowchart of yes/no questions that shift the burden of proof. For example:  
  - Start with "Is the harm the clinical goal?" (shifts burden to proponents if yes)  
  - Then "Is the harm a means?" (shifts burden if yes)  
  - Then proportionality assessment (shifts burden to objectors if proportionality is clear)  

  Crucially, the procedure must flag when a decision hinges on values (e.g., "How much risk is acceptable?") rather than facts, and delegate those to committee judgment. It should also specify when legal counsel is needed (e.g., fetal loss cases) and who signs off. 

  For the case applications:  
  - Opioid escalation: Harm (respiratory suppression) isn’t the goal or a means, so likely permissible if proportional.  
  - Conjoined twins: Separation uses one twin’s death as a means to save the other—fails DDE. This might be the "unlikable" verdict since it feels necessary but is ethically problematic.  
  - Cancer in pregnancy: Chemo isn’t *using* fetal death as a means, so passes if proportional.  

  The weakest point? Proportionality. It’s inherently subjective and can’t be proceduralized. I’ll admit this upfront.  

  Confidence level: High on isolating intention/means, low on proportionality. The procedure won’t eliminate disputes but will force clarity on *why* they’re stuck.
answer: |-
  ### **Burden-Shifting DDE Procedure for Clinical Ethics Committee**  
  *(Designed for 30-minute consultations. Committee votes at burden-shifting points. Chair breaks ties.)*  

  **Pre-procedure:** Confirm all medical facts are undisputed. If not, pause for clinical review.  
  **Output:** "Permissible" (green), "Impermissible" (red), or "Judgment Call" (yellow—delegate to attending/clinician with family consent).  
  **Legal trigger:** Consult hospital counsel *immediately* if case involves fetal loss, incapacity, or minors. Attending must sign off on final recommendation.  

  ---

  ### **The Procedure: Ask in Order**  
  **Goal:** Shift burden to prove permissibility (proponent) or impermissibility (objector).  

  1. **QUESTION 1: Is the *primary clinical goal* achievable without the foreseeable harm?**  
     - *Sufficient "Yes"*: Harm is avoidable → **Stop: Impermissible (red)**. Burden *remains* on proponent.  
     - *Sufficient "No"*: Harm is unavoidable to achieve goal (e.g., pain relief requires opioids; separation requires cutting shared organ). Burden **shifts to objector** to prove impermissibility.  
     - *Judgment call*: If equipoise on avoidability → **Pause for clinical re-evaluation**.  

  2. **QUESTION 2: Is the harm itself the *mechanism* or *required condition* to achieve the primary goal?**  
     - *Focus*: "Using" vs. "accepting" harm. Harm is a *means* if goal fails without it (e.g., death *enables* organ transplant).  
     - *Sufficient "Yes"*: Harm is a means → **Stop: Impermissible (red)**. Burden *stays* with proponent.  
     - *Sufficient "No"*: Harm is collateral (e.g., respiratory suppression isn’t *how* opioids relieve pain). Burden **shifts to objector**.  
     - *Judgment call*: If mechanism is indirect (e.g., fetal death "makes space" for chemo) → **Proceed to Q3**.  

  3. **QUESTION 3: Would the clinical team act the same way if the harm *could be magically prevented*?**  
     - *Focus*: Is harm *aimed at*? Tests intention.  
     - *Sufficient "No"*: Team would proceed identically if harm vanished (e.g., give same opioid dose if no respiratory risk). Burden **shifts to objector**.  
     - *Sufficient "Yes"*: Action changes if harm removed (e.g., lower dose if no death risk) → Suggests harm is intended. **Stop: Impermissible (red)**.  
     - *Judgment call*: Team’s answer is ambiguous → **Vote on intention**.  

  4. **QUESTION 4: Is the harm *proportionate* to the benefit?**  
     - *Focus*: Burdens objector to disprove proportionality. Only reached if Q1–Q3 passed.  
     - *Sufficient "Yes"*: Benefit *significantly outweighs* harm (e.g., survival vs. death; severe pain relief vs. hours-days life shortening). **Stop: Permissible (green)**.  
     - *Sufficient "No"*: Harm grossly disproportionate (e.g., death to relieve mild nausea). **Stop: Impermissible (red)**.  
     - *Judgment call*: Close balance (e.g., life shortening in severe pain) → **Yellow: Delegate to attending + family**.  

  ---

  ### **How This Distorts/Expands Standard DDE**  
  - **Collapses conditions**: "Right intention" (Q3) and "means vs. side effect" (Q2) are separated; "proportionality" (Q4) stands alone.  
  - **Ignores "act must be good"**: Assumed if clinically indicated. Focuses on harm.  
  - **More permissive**: Allows "close call" proportionality (Q4) to be delegated, not vetoed.  
  - **Burden-shifting**: Proponent must pass Q1–Q2; objector must disprove Q3–Q4.  

  ---

  ### **Case Applications**  

  #### **CASE 1: Terminally Ill Patient – Opioid Escalation**  
  - **Q1**: *Avoidable harm?* No—pain relief requires dose risking suppression. **Burden → Objector**.  
  - **Q2**: *Harm a means?* No—suppression isn’t *how* opioids relieve pain. **Burden → Objector**.  
  - **Q3**: *Same action if no harm?* Yes—team would give same dose if no suppression risk. **Burden → Objector**.  
  - **Q4**: *Proportionate?* Yes—relieving agonizing pain vs. hours-days life shortening. **VERDICT: Permissible (green)**.  

  #### **CASE 2: Conjoined Twins – Separation**  
  - **Q1**: *Avoidable harm?* No—separation requires cutting shared organ, killing Twin B. **Burden → Objector**.  
  - **Q2**: *Harm a means?* **Yes**—Twin B’s death *enables* Twin A’s survival (severing the connection kills B to free A). **VERDICT: Impermissible (red)**.  
    - *Why you may dislike this*: Separation is often seen as necessary. But DDE rejects *using* death as a tool—even for life-saving goals.  
    - *Judgment call*: If team argues death is "collateral damage" not a means, Q2 becomes debatable (procedure flags this as values conflict).  

  #### **CASE 3: Pregnant Patient – Chemotherapy**  
  - **Q1**: *Avoidable harm?* No—chemo needed to save mother, fetal death foreseeable. **Burden → Objector**.  
  - **Q2**: *Harm a means?* No—fetal death isn’t *how* chemo treats cancer (it’s a toxicity effect). **Burden → Objector**.  
  - **Q3**: *Same action if no harm?* Yes—team would give chemo even if fetus unaffected. **Burden → Objector**.  
  - **Q4**: *Proportionate?* **Judgment call**—mother’s survival vs. loss of fetus. **VERDICT: Yellow → Delegate to attending + family**.  

  ---

  ### **Limitations & Confidence Assessment**  
  - **Cannot eliminate judgment**: Q2 (means vs. side effect) and Q4 (proportionality) are inherently value-laden. The procedure forces explicit debate but not resolution.  
  - **Cannot resolve**: Cases where harm is *indirectly* useful (e.g., fetal death simplifies delivery). Q2 flags this for human deliberation.  
  - **Weakest point**: **Q2 (Is harm a means?)**. Clinicians often conflate biological mechanism with moral "use." Confidence: **Low**. *Why*: "Means" is philosophically fraught; in practice, it relies on clinical narrative.  
  - **Overall confidence**:  
    - **High** on isolating intention (Q3) and burden-shifting structure.  
    - **Medium** on proportionality (Q4)—delegation mitigates risk.  
    - **Procedure as a whole**: **80% fit-for-purpose**. It forces focus on operational dilemmas, not textbook DDE, but cannot make hard decisions easy.  

  **Final note**: The procedure’s value is in *structuring* debate, not replacing ethics. When it outputs "yellow," the committee’s role shifts to ensuring informed deliberation—not imposing answers. Attending physician signs all recommendations; counsel reviews fetal/minor cases pre-implementation.
