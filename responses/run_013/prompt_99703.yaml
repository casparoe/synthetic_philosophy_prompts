prompt: |-
  Bit of an odd request, but here's the situation. I've got a mate who's really into the idea of karma as a theory of moral desert — not the pop-culture version, the actual claim that what you accrue tracks what you morally deserve, across lives or at least across your standing in the moral ledger. Over the years he's given me verdicts on a bunch of cases about who picks up bad karma, and I've been writing them down:

  - A surgeon does everything by the book, genuinely wants to save the patient, but the patient dies of a complication nobody could have foreseen. He says: no bad karma.
  - A driver speeds through a school zone and a kid runs out and is killed. He says: bad karma, obviously, even though the driver wasn't trying to hurt anyone.
  - Someone walking through a field crushes a beetle they never saw and couldn't have seen. He says: no bad karma.
  - Someone pays a hitman to kill a rival. He says: bad karma, full stop, even though the person never laid a hand on anyone.
  - A bloke inherits a fortune from his father's business, a business he had nothing to do with running and which he now learns cut corners that got workers killed. He says: hmm, probably no bad karma, the son didn't do anything.

  Now the new case. I buy a cheap phone. It's pretty widely reported that phones like this one are made using forced labour somewhere down the supply chain, but I don't look into it, I don't intend anyone any harm, and honestly it's not like I could trace the exact components. I just want the phone. Does he say I accrue bad karma?

  What I actually want from you is less the yes/no and more the machinery. Tell me the rule he seems to be running, and then at least two other rules that fit everything he's said just as well — I suspect things like "karma tracks the quality of your will and your negligence" versus "karma tracks whether you knowingly benefit from harm" versus "karma tracks your causal contribution, aware or not" are all still live. Say what each of those predicts about my phone, give me your best guess at his actual verdict and why you'd bet on it, and then name the one further case I should put to him that would best split the rules apart. Where his past verdicts genuinely underdetermine the answer, say so and tell me what he'd be committing to either way.

  Oh and write it in British English please, I'm fussy about that.
reasoning: |-
  Okay, let me tackle this query step by step. The user's mate has a specific interpretation of karma as moral desert, and we've got five precedent cases to analyse. The new scenario involves buying a cheap phone despite reports of forced labour in the supply chain. The user wants the underlying rule, alternative rules that fit the precedents, predictions for the phone case, and a discriminating case to test the mate's framework.

  First, I'll examine the mate's verdicts to deduce his rule. The surgeon case shows intent matters - no bad karma because everything was by the book with good intentions. The driver case involves negligence (speeding in a school zone), leading to bad karma despite no harmful intent. The beetle case has no bad karma because there's no negligence or awareness - couldn't have seen it. The hitman case shows bad karma for intentional complicity without direct action. The inheritance case suggests mere benefit from harm isn't enough if there's no active involvement.

  This points to a rule combining will (intent) and negligence (foreseeable risk). Now, I need alternative rules that also fit these cases. One could be "knowing benefit from harm" - but the inheritance case contradicts this since the son benefits but gets no bad karma. Another could be "causal contribution" - but the beetle case has causal harm with no karma, so that doesn't fit. A better alternative is "quality of will plus negligence," which aligns with all cases. Another is "intentional participation," but the hitman case is intentional while the inheritance isn't. 

  For the phone case: mate's rule would likely say no bad karma because there's no negligence if the user didn't look into it and couldn't trace components. But if negligence includes should-have-known, it might flip. The knowing benefit rule would say bad karma since you benefit from harm, even unknowingly. Intentional participation would say no bad karma without intent.

  Best guess for mate's verdict: no bad karma, as he emphasises negligence requiring conscious disregard, not just possible knowledge. The inheritance case suggests passive benefit isn't enough.

  Discriminating case: "should-have-known" negligence vs "deliberate ignorance." Like buying a rug from a region known for child labour, deliberately avoiding information. If mate assigns bad karma, it's negligence-including-should-have-known; if not, it's only conscious disregard.

  This covers the user's request for the mate's rule, alternatives, phone prediction, and a test case, all in British English as specified.
answer: |-
  Right then, let's crack this. Your mate's karma framework seems rather Kantian-meets-negligence-law. Based on his past cases, here's the machinery as I deduce it, alternative rules that *also* fit his past verdicts, predictions for your phone conundrum, my best guess at his verdict, and a discriminating case to pin him down. All rendered in proper British English, naturally.

  **Your Mate's Apparent Rule (Based on Precedents):**

  *   **"Bad karma accrues for intentional wrongdoing *or* culpable negligence where harm was foreseeable and avoidable."**
  *   **Breakdown:**
      *   **Intentional Wrongdoing:** Directly intending harm or commissioning it (e.g., hiring the hitman). Bad karma regardless of direct physical action.
      *   **Culpable Negligence:** Failing to exercise reasonable care where harm was a *foreseeable and avoidable* consequence of your actions, even without intent to harm (e.g., speeding in a school zone). Requires a *breach of a duty of care*.
      *   **Exclusions:** No bad karma for unforeseeable accidents (surgeon, beetle), purely accidental outcomes without negligence, or merely benefiting from harm you played no active role in causing or enabling (inheritance).

  **Alternative Rules That Fit His Past Verdicts Equally Well (So Far):**

  1.  **"Karma tracks the quality of your will *plus* your conscious disregard of foreseeable risks."**
      *   *How it fits:* Matches all cases. Good will + no foreseeable risk = no karma (surgeon, beetle). Conscious disregard of foreseeable risk = bad karma (driver). Bad will = bad karma (hitman payer). No conscious disregard or active involvement = no karma (inheritance).
      *   *Nuance:* Focuses on the *mental state* regarding risk – "conscious disregard" implies you actually considered the risk and proceeded anyway, or *deliberately* avoided knowing.
      *   **Prediction for Your Phone:** Likely **NO bad karma**. You "don't look into it" and "honestly... couldn't trace" suggests no *conscious* disregard. You didn't *choose* to ignore specific known risks; you remained passively ignorant. Benefit is irrelevant under this rule.

  2.  **"Karma tracks your intentional participation in harmful systems or actions, including willful ignorance where harm is highly probable."**
      *   *How it fits:* Matches all cases. No participation = no karma (surgeon, beetle, inheritance - son didn't participate). Active, intentional participation in harm = bad karma (hitman payer). Reckless action creating high risk = intentional participation in a dangerous act (driver).
      *   *Nuance:* Focuses on *active choices* within harmful contexts. "Willful ignorance" implies *choosing* not to know *because* you suspect the truth would obligate you to act differently.
      *   **Prediction for Your Phone:** **Likely BAD karma**. Buying the phone is an intentional act of participation in a system widely reported as harmful. "Don't look into it" could be argued as *willful ignorance* – deliberately avoiding confirming uncomfortable truths you suspect, precisely to avoid the moral burden. The "couldn't trace" bit might weaken this, but the rule focuses on participation and ignoring *known probabilities*, not tracing specifics.

  **Your Mate's Likely Verdict on Your Phone & Why:**

  *   **Best Guess:** He'll say **NO bad karma accrues to you.**
  *   **Why:** His past verdicts strongly emphasise *foreseeability to the individual* and *avoidability*. The surgeon couldn't foresee; the driver *could* and *should* have foreseen the risk in a school zone. The inheritance case is key: merely benefiting from past harm you didn't cause and couldn't avoid *now* doesn't count. For the phone:
      *   **"Widely reported" ≠ Personal foreseeability:** He'll likely argue that general reports don't automatically translate to *your* specific, personal knowledge or duty unless you actively seek out and confirm the details *for that purchase*. "Widely reported" is vague.
      *   **"Don't look into it" vs. "Couldn't trace":** He'll probably seize on "it's not like I could trace the exact components." This mirrors the inheritance (couldn't change the past harm) and beetle (couldn't avoid it) cases. The inability to trace makes the harm effectively unforeseeable *and unavoidable* *for you in this specific act*. Merely suspecting general reports isn't enough for "culpable negligence" or "conscious disregard" *in his framework* as demonstrated so far. Your intention ("just want the phone") is harmless.
      *   **Benefit irrelevant:** Like the inheritance, merely benefiting from harm isn't sufficient on its own.

  **The Discriminating Case to Split the Rules:**

  **The Case:** "A person wants a beautiful, hand-knotted rug. They know such rugs from a specific region are *very frequently* made using child labour, though it's not guaranteed for any individual rug. They could easily afford a more expensive rug certified as ethically made from a different region, but they prefer the look and price of the potentially problematic one. They deliberately avoid asking the seller any questions about the rug's origins or looking for certifications because they don't want to know for sure and feel guilty or pay more. They buy the rug. Do they accrue bad karma?"

  *   **Why this case splits the rules:**
      *   **Your Mate's Apparent Rule (Culpable Negligence):** Likely **BAD karma**. Harm (child labour) is *highly foreseeable* and *specifically linked* to this type of purchase from this region. Choosing *not* to ask or look, when it was easy to do so, likely constitutes a *breach of a duty of care* (taking reasonable steps to avoid foreseeable harm). The harm was also *avoidable* (buying the ethical rug). This goes beyond passive ignorance to active avoidance of confirmation.
      *   **Rule 1 (Conscious Disregard):** **BAD karma.** This is the *textbook* definition of "conscious disregard." They strongly suspect the harm, have easy means to confirm or avoid it, but *choose ignorance* to proceed guilt-free. The conscious choice *not* to know demonstrates the disregard.
      *   **Rule 2 (Intentional Participation + Willful Ignorance):** **BAD karma.** They intentionally participate in a system known for harm, and their avoidance of questions is *precisely* "willful ignorance" to facilitate their participation without moral qualms.
      *   **Where he'd be committing:** If he says **NO bad karma** here, he's doubling down on a very narrow view of negligence, perhaps requiring near-certainty of harm *for this specific item* that the buyer actively confirmed and ignored. It would solidify that mere high probability + deliberate avoidance isn't enough for him; he needs something closer to *actual, confirmed knowledge* disregarded (like the driver knowing speeding is dangerous). If he says **BAD karma**, it confirms a broader view encompassing "should-have-known-and-easily-could-have-checked-but-chose-not-to" as culpable negligence or willful disregard, bringing his view closer to Rule 1 or 2 and making your phone case potentially more borderline for him.

  **In Summary:**

  *   His rule seems centred on **personal culpability through intent or blameworthy negligence (foreseeable & avoidable harm)**.
  *   Alternative rules focusing on **conscious disregard** or **intentional participation + willful ignorance** also fit his past cases.
  *   For **your phone**: Best guess is **NO bad karma** based on his emphasis on lack of personal foreseeability/avoidability and the inheritance precedent. Rules 1 & 2 *could* argue for bad karma, but his past language suggests he'd reject that for your case.
  *   **Test him with the Rug Case.** His verdict there will reveal whether "widely reported + deliberate avoidance of confirmation" crosses his negligence threshold, or if he requires something stronger. That'll truly nail down his machinery. Good luck! Do report back – this is fascinating moral spelunking.
