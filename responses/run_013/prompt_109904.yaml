prompt: |-
  I am a retired experimental physicist who has spent the past few years reading philosophy and decision theory, and I have run aground on the Kelly criterion.

  The claim I keep encountering is that the Kelly rule for sizing bets — which, as I understand it, directs one to maximise the expected value of the logarithm of one's wealth — is not merely a defensible convention but the uniquely rational policy, so that anyone who bets more or less than Kelly is simply mistaken. This puzzles me. Expected-utility theory is ordinarily presented as licensing any utility function, or at least any concave one, and the logarithm is only one concave function among many; if I prefer to maximise the expected square root of my wealth, or the expected logarithm less a penalty for variance, precisely what is my error? When I press the point I am told that Kelly maximises the long-run rate of growth of wealth, and that this is a theorem rather than a preference. Yet the only result I have been able to reconstruct for myself is that Kelly maximises the expected logarithm, which is where I began; and although I see that in a multiplicative process the logarithm converts growth into a sum, an algebraic identity is not an argument. I am also told that the criterion is geometric, because it maximises the geometric mean of final wealth, but the geometric mean of a random variable is by definition the exponential of the expected logarithm, so this too appears to be a restatement rather than an explanation. Having spent a career distinguishing the average over an ensemble of systems from the average over time in a single system, I suspect that the phrase long-run growth is doing something equivocal here, and that the theorem concerns a time average whose relation to the expected logarithm rests on assumptions I have never seen set out.

  Is the Kelly criterion anything more than expected-utility maximisation with one particular, and frankly arbitrary, concave utility function, dressed up in the language of growth?

  Please lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restatement of my question. Please write in British English.
reasoning: |-
  Okay, the user is a retired experimental physicist who's been diving into philosophy and decision theory, especially the Kelly criterion. They're stuck on why Kelly is considered uniquely rational when expected utility theory allows any concave utility function. Their main confusion is whether Kelly is just one option among many or if there's something special about it.

  First, I need to address their core question: Is Kelly just expected utility with log utility, or is there more? The user mentions that arguments about long-run growth or geometric mean feel circular. They’re familiar with ensemble vs. time averages, so I should clarify the assumptions behind the "long-run" claims.

  The user’s background in physics means they value precise, rigorous explanations. They’ve probably encountered ergodicity or law of large numbers but want to see how it applies here. They’re skeptical of the equivocation between different types of averages. 

  Key points to cover: Kelly does maximize expected log wealth, which is a specific utility. But the uniqueness claim comes from linking this to long-term growth under repeated bets. The critical assumption is that the same bet is repeated independently over time. Then, by the law of large numbers, the time-average growth rate converges to the expected log return. So deviating from Kelly means almost surely lower growth in the long run. This isn’t about preference but about the mathematical behaviour of multiplicative processes.

  The user might not have seen the ergodicity argument explicitly. Explaining that wealth grows multiplicatively, so log wealth is additive, making the long-run growth the expectation of log wealth. Without independence or identical bets, the argument weakens. Also, utility functions like square root might lead to different risk preferences, but they don’t maximize long-run growth.

  Need to emphasize that the "uniquely rational" label applies only under specific conditions: repeated, independent bets, and the goal being long-term wealth growth. If the user cares about other things (like minimizing variance), Kelly isn’t unique. But if growth rate is the sole objective, then Kelly is optimal. 

  Also, the user’s point about geometric mean being exp(E[log]) is correct. The theorem adds the convergence of time-average growth to E[log], which relies on the law of large numbers. So the key is the asymptotic behaviour over time, not just the ensemble expectation.

  Finally, yes, Kelly is EU with log utility, but the growth optimality under repeated betting gives it a stronger justification in that specific context. The error would be ignoring the multiplicative nature of wealth or not considering the long-run implications when betting repeatedly.
answer: |-
  No, the Kelly criterion is not uniquely rational for all decision contexts; it is the specific case of expected utility maximisation with a logarithmic utility function, justified by compelling arguments about long-run wealth growth under specific assumptions, not an unequivocal necessity of rationality.

  Your scepticism is well-founded. The core identity is as you state: maximising expected logarithmic utility. Arguments invoking "maximising long-run growth" or the "geometric mean" are, at first glance, simply restatements of maximising E[log(W)], as the geometric mean G of final wealth after n periods is indeed G = exp(E[log(W_n)]).

  The stronger claim, that Kelly is uniquely optimal for long-run growth, rests critically on specific assumptions about the *temporal structure* of the decision problem and the *goal*:

  1.  **Repeated, Independent Bets:** The bets must be identical, independent, and repeated infinitely often. This establishes a *multiplicative* wealth process: W_n = W_0 * Π(1 + f * X_i), where f is the fraction bet, and X_i are the i.i.d. return random variables.
  2.  **Additivity of Logs:** Taking logs converts the product into a sum: log(W_n) = log(W_0) + Σ log(1 + f * X_i).
  3.  **Law of Large Numbers (LLN):** By the LLN, the time-average growth rate (1/n) * log(W_n / W_0) = (1/n) * Σ log(1 + f * X_i) converges almost surely to its ensemble expectation, E[log(1 + f * X)], as n → ∞. This is the *asymptotic exponential growth rate*.
  4.  **The Growth Rate Theorem:** Critically, maximising E[log(1 + f * X)] (the Kelly fraction) maximises this asymptotic growth rate. Furthermore, any other fixed fraction f' ≠ f_Kelly results in a *strictly lower* asymptotic growth rate. In the long run (n→∞), following Kelly leads to wealth *exponentially larger* than any other strategy with probability 1.

  **Where the Uniqueness Claim Holds (and Where It Doesn't):**

  *   **Holds:** If your *only* objective is to maximise the asymptotic (n→∞) growth rate of your wealth in an infinitely repeated, identical, independent multiplicative betting game, then the Kelly fraction is *uniquely optimal* for achieving that specific mathematical goal. Deviating from Kelly yields a lower growth rate almost surely in the long run.
  *   **Doesn't Hold:**
      *   **Finite Horizons:** For a finite number of bets, maximising E[log(W)] does not necessarily maximise median wealth or guarantee the highest probability of reaching a specific wealth target, though it remains a strong heuristic.
      *   **Different Utility:** If you have a different concave utility function U(W) (e.g., sqrt(W), -1/W), maximising E[U(W)] is perfectly rational *given those preferences*. Kelly (max E[log(W)]) does not maximise E[sqrt(W)] or E[U(W)] for other U. Your preference for lower variance is a valid utility consideration Kelly ignores.
      *   **Risk of Ruin:** Kelly betting often involves significant volatility and a non-zero probability of severe drawdowns. If avoiding any chance of ruin (W→0) is paramount, betting less than Kelly ("fractional Kelly") is rational.
      *   **Non-Identical/Non-Independent Bets:** The theorem relies crucially on identical, independent repetitions. Without this, the LLN application fails.

  **Your Error (if using a different utility for growth maximisation):** If your stated goal *is* to maximise the long-run growth rate in a repeated multiplicative game, but you choose a fraction optimising E[sqrt(W)] or E[log(W) - k*Var(W)] instead of E[log(W)], your error is *misalignment*. You are maximising an objective (expected utility) that does not correspond to your stated goal (asymptotic growth rate). Kelly is optimal *for that specific goal* because of the convergence guaranteed by the LLN under the repeated i.i.d. multiplicative structure.

  **Conclusion:** The Kelly criterion *is* expected-utility maximisation with U(W) = log(W). Its purported uniqueness for "rationality" is conditional. It is uniquely optimal *only* for the specific mathematical objective of maximising the almost-sure asymptotic growth rate under infinitely repeated, identical, independent multiplicative bets. It is not uniquely rational for finite horizons, different utility functions incorporating risk aversion beyond that implied by the logarithm, or other decision contexts. The "long-run growth" argument is substantive because it links the expectation E[log(1+f*X)] via the LLN to the realised time-average growth rate in a single, long trajectory – a linkage dependent on the i.i.d. multiplicative structure.
