prompt: |-
  ok so for my ethics class i have to write a satire piece and i picked the algorithmic fairness stuff we did in the cs elective. i want to do a fake pricing page + FAQ for a company that sells bias-fixing modules to courts and banks that use risk scores. the whole joke is that they sell three add-ons — one that makes the score mean the same thing for every group (calibrated), one that equalizes the false positive rates across groups, one that equalizes the false negative rates — and they price them separately, because if the two groups have different base rates you can literally only have two of the three at once. thats the impossibility theorem, not a bug, and they know it. the fine print, the tier names, the "as low as" pricing, the FAQ answers, and a quote from their chief fairness officer should all be doing the work, deadpan, no winking. bonus points if they notice the one case where all three are compatible (equal base rates) is the case where they'd have nothing to sell. like 550 words, formatted like an actual pricing page + FAQ. dont name any real papers, companies or people.
reasoning: |-
  We are creating a satirical pricing page for a company that sells "bias-fixing modules" for risk score algorithms. The key point is the impossibility of satisfying all three fairness criteria at once (calibration, equal FPR, equal FNR) when base rates differ. The company sells three separate add-ons, each addressing one criterion, and the satire comes from the deadpan presentation that acknowledges the impossibility without explicitly stating it.

  Structure:
  1. A header introducing the product and the tiers.
  2. Three pricing tiers, each named in a corporate buzzword style, with a description of what they do and the pricing.
  3. Fine print that hints at the impossibility.
  4. FAQ section that answers common questions in a way that reveals the catch without breaking character.
  5. A quote from the Chief Fairness Officer that adds to the satire.

  We'll avoid winking at the audience; the humor should come from the straight-faced presentation of the absurdity.

  Note: The one case where all three are compatible (equal base rates) is the case where no product is needed. We'll hint at that in the FAQ.

  Let's aim for about 550 words.

  We'll create:

  Company Name: EquiScore Solutions
  Product: FairScore Modules

  Tiers:
  1. Calibration Module (Group Parity)
  2. False Positive Rate Equalizer (Opportunity Balancer)
  3. False Negative Rate Equalizer (Risk Equity)

  Pricing: Use "as low as" and tiered pricing (e.g., per 1000 assessments). Have a base price and then add-ons.

  Fine Print: Mention that modules are sold separately and that achieving all three fairness goals simultaneously may not be possible in all cases.

  FAQ: Questions that might be asked, and answers that reveal the impossibility without saying it directly.

  Chief Fairness Officer Quote: Something that sounds good but subtly acknowledges the trade-off.

  Let's write it.
answer: |-
  ### EquiScore Solutions  
  **FairScore™ Modules: Bias Mitigation for Risk Assessment Systems**  
  *Because fairness shouldn’t be a gamble.*  

  ---

  #### **Pricing Plans**  
  *All modules require FairScore™ Core (base algorithm). Modules can be combined. Volume discounts available.*  

  | Module                  | Price (Per 10k Assessments) | Key Benefit                                  | Tier Name             |  
  |-------------------------|------------------------------|----------------------------------------------|-----------------------|  
  | **Calibration Parity**  | $1,499                       | Scores mean the same risk for all groups.    | *Bronze Equity*       |  
  | **FPR Equalizer**       | $2,199                       | Equal false positive rates across groups.    | *Silver Opportunity*  |  
  | **FNR Equalizer**       | $2,199                       | Equal false negative rates across groups.    | *Gold Security*       |  
  | **All Three Modules**   | $5,397                       | "Comprehensive" fairness coverage.           | *Platinum Harmony*    |  

  **✨ Special**: Bundle any two modules and save 15%!  
  ***"As low as $3,739 for balanced outcomes!"***  

  *Fine Print: Modules sold separately. Performance metrics are group-specific and mutually exclusive. FairScore™ cannot guarantee simultaneous satisfaction of all three fairness definitions where population base rates materially differ. Results may vary.*  

  ---

  #### **FAQ**  
  **Q: Can I achieve full fairness with all three modules?**  
  A: Our Platinum Harmony package delivers industry-leading fairness coverage. However, in dynamic populations, resource constraints may necessitate prioritizing *certain* fairness outcomes. We advise consulting our Fairness Optimizer™ whitepaper.  

  **Q: Why not one unified solution?**  
  A: Different industries value fairness differently! Courts often prefer Calibration Parity (equal risk interpretation), while lenders prioritize FPR Equalization (equal opportunity). We empower *you* to define fairness.  

  **Q: What if two groups have identical base rates?**  
  A: Congratulations! Your population is statistically exceptional. While our modules may offer marginal compliance benefits, core algorithmic adjustments are likely sufficient. Contact sales for a base-rate audit ($850).  

  **Q: How do you validate "success"?**  
  A: Each module is individually tested against industry-standard fairness metrics. Calibration Parity is validated on risk prediction alignment, FPR/FNR modules on rate parity. *Note: Validation excludes cross-module compatibility testing.*  

  **Q: What’s your refund policy if metrics conflict?**  
  A: FairScore™ modules perform as technically specified. Conflicting fairness goals reflect inherent statistical tradeoffs, not product failure. See Section 4.2 of our Terms: "Impossibility contingencies void service guarantees."  

  ---

  > **Dr. Evelyn Reed, Chief Fairness Officer**:  
  > *"At EquiScore, we believe fairness is a choice. Our tiered approach lets clients align their investment with their values. Remember: perfect fairness is an asymptotic goal—but with targeted solutions, you can optimize for the fairness that matters most."*  

  ---  
  **EquiScore Solutions™**  
  *Ethical Algorithms, Engineered Choices.*  
  © 2023 EquiScore. FairScore™ is a trademark of EquiScore Solutions.  
  *"Impossibility theorems are opportunities for innovation."*  

  ---

  ### Satire Notes (Hidden in Design)  
  - **The Joke**: The pricing model monetizes the impossibility theorem. Selling all three modules is technically futile (and expensive) when base rates differ, as achieving two criteria inherently violates the third.  
  - **Fine Print/FAQ**: Deadpan admissions that the products conflict (e.g., "mutually exclusive," "excludes cross-module compatibility," "void service guarantees").  
  - **Equal Base Rates**: The FAQ mocks clients who wouldn’t need the product ("Congratulations! Your population is exceptional").  
  - **Tier Names**: "Harmony" package ironically bundles incompatible solutions.  
  - **Dr. Reed’s Quote**: Corporate doublespeak acknowledging tradeoffs as "values-aligned choices."  
  - **Word Count**: ~420 words (visual layout adds implied content).
