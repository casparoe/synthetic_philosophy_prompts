  The user might also be hinting at a deeper frustration: EA frameworks claiming objectivity while embedding this tilt toward conservatism. That's worth acknowledging implicitly by emphasizing concrete mitigation strategies in the response.
answer: |-
  This is a profound observation that cuts to the heart of cause prioritization frameworks. You've identified a **structural coupling bias** in the standard "importance-neglectedness-tractability" (INT) framework, where *neglectedness* and *tractability* become inversely correlated proxies for the *same underlying variable*: **problem maturity/attention saturation**. This has established recognition but lacks a universal name. Let's define it precisely.

  ### The Core Pattern: Heuristic Collapse
  - **Name Proposal**: **Heuristic Collapse** (or **Attention-Solvability Coupling Bias**)  
  - **Definition**:  
    *The tendency for estimated neglectedness and tractability in cause prioritization frameworks to become inversely correlated, non-independent variables driven primarily by a single latent factor—the degree of existing attention/effort allocated to a problem—thereby systematically undervaluing frontier problems where solutions are unknown and overvaluing mature fields with established solutions.*  

  ### Why This Isn't Just "Hunting Where the Light Is"
  1.  **Streetlight Effect** (searching where measurement is easy) is about *measurement bias*. Your observation is about *structural entanglement of evaluation criteria themselves*.  
  2.  **Goodhart's Law** (metrics gamed when targeted) assumes intentional optimization. Heuristic Collapse occurs *even with honest scoring* due to inherent dependencies.  
  3.  **"Neglected Because Hard"** is a subset. Heuristic Collapse also includes cases where problems *become* tractable *because* attention revealed solutions (e.g., mRNA vaccines were "intractable" until focused R&D made them tractable).

  ### Boundary Cases & What Falls Outside
  - **Inside Boundary**:  
    - Disease with existing treatment (high tractability, low neglectedness) vs. disease with unknown mechanism (low tractability, high neglectedness).  
    - Climate change adaptation (established methods) vs. stratospheric aerosol injection (unknown risks, no proven deployment).  
  - **Outside Boundary**:  
    - Problems where tractability is *genuinely independent* of attention (e.g., asteroid deflection: highly tractable with current tech but neglected).  
    - Problems where neglectedness persists *despite* high tractability (e.g., lead pipe replacement: cheap and proven but politically stalled).  
    - Frontier areas where a *novel intervention* suddenly unlocks tractability without prior attention (e.g., CRISPR creating tractability in rare genetic diseases).

  ### Why This Happens: The Feedback Loop
  ```mermaid
  graph LR
      A[Existing Attention] --> B[Resources & Effort];
      B --> C[Solution Exploration];
      C --> D[Discovery of Interventions];
      D --> E[↑ Perceived Tractability];
      E --> F[↑ Further Attention];
      F --> A;
      A --> G[↓ Neglectedness Score];
      D --> H[↓ Tractability Score if no solution found];
  ```

  ### Mitigation Strategies (Avoiding the Trap)
  1.  **Score Marginal Opportunities**:  
      Instead of scoring entire causes (e.g., "malaria"), score *specific interventions* (e.g., "novel mosquito gene-drive rollout in Benin"). This decouples tractability from global attention.  
  2.  **Explicitly Model Attention Saturation**:  
      Add a fourth dimension: **"Attention Sensitivity"** – *How much would marginal resources accelerate progress?* Frontier issues often have high sensitivity.  
  3.  **Dynamic Tractability Estimation**:  
      Tractability ≠ current feasibility. Estimate:  
      - **Static Tractability**: Current solution viability  
      - **Dynamic Tractability**: Solution viability *given targeted R&D* (e.g., "If $50M were invested in biomarker research, would dementia drugs become tractable?")  
  4.  **Counterfactual Impact Scoring**:  
      Focus on: *"How much does effort here *enable* future tractability?"* (e.g., funding basic virology may make future pandemics more tractable).  
  5.  **Accept "Exploration" as a Meta-Cause**:  
      Allocate resources explicitly to searching for neglected-but-potentially-tractable problems (e.g., LTFF or Astera Institute's model).

  ### Established Recognition
  - Open Philanthropy discusses "**hits-based giving**" to address high-uncertainty frontiers.  
  - 80,000 Hours flags **"information hazards"** in cause selection: early estimates often misjudge neglected/tractable intersections.  
  - In economics, this resembles **exploration-exploitation tradeoffs** in reinforcement learning: INT frameworks over-index on "exploitation."

  ### In Practice: Reframing Your Disease Example
  - **Standard INT**: Untreated disease → Low tractability (no solution) + High neglectedness → Mid-low score.  
  - **Anti-Collapse Adjustment**:  
    - *Dynamic tractability*: "If $X million funded pathogen research, would solutions emerge in 5 years?" (If yes, tractability ↑)  
    - *Attention sensitivity*: "Would funding here unlock new fields?" (High for fundamental research)  
    - → Adjusted score favors neglected *pathways* over neglected *diseases with no plausible near-term solution*.

  You're not misreading a caveat—you've pinpointed a fundamental limitation in how we evaluate social impact. The bias toward well-trodden problems isn't accidental; it's baked into the criteria unless explicitly corrected. Heuristic Collapse explains why truly novel solutions rarely emerge from INT analyses without deliberate countermeasures.
