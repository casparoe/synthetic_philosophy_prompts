  Hmm, this is actually a profound critique of standard EA cause selection heuristics. The user is clearly analytically sophisticated—they've not only spotted the pattern but articulated how the criteria might be double-counting the same underlying reality (attention level). Their examples (untreated diseases vs. treated ones) perfectly illustrate the tension.  

  What they're really asking for is:  
