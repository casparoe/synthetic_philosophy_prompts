  - Solutions or adjustments to avoid the bias  

  The closest established concept is indeed the Streetlight Effect, but that's more about measurement bias rather than structural coupling in evaluation criteria. The innovation here is how neglect and solvability become proxies for each other. "Heuristic Collapse" feels like the right term—it captures how distinct criteria collapse into one dimension (attention saturation).  

  Key nuances to address:  
  1) This isn't just about gaming metrics—it's structural. Even honest scorers face it.  
  2) The bias worsens when scoring whole causes rather than marginal interventions.  
