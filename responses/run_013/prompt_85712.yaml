  ### In-Class Activity: Truth Value Networks

  **Objective:** Students will experience the pressures that lead to non-classical truth theories by attempting to assign consistent truth values to interconnected sentence networks. They will encounter:  
  (i) A network with no consistent classical assignment (liar-type paradox).  
  (ii) A network with multiple consistent assignments (truth-teller pair).  
  (iii) A network that cycles endlessly under revision (oscillating loop).  
  (iv) A grounded network that stabilizes (control).  

  **Materials (for 12 students, 4 groups of 3):**  
  - **Index cards** (pre-prepared sets for each station):  
    - **Station 1 (Grounded Control):**  
      - Card A: "Snow is white."  
      - Card B: "Card A is true."  
      - Card C: "Card B is true."  
    - **Station 2 (Classical Impasse):**  
      - Card D: "Card D is false."  
    - **Station 3 (Ungrounded Consistent):**  
      - Card E: "Card F is true."  
      - Card F: "Card E is true."  
    - **Station 4 (Oscillating):**  
      - Card G: "Card H is true."  
      - Card H: "Card I is true."  
      - Card I: "Card G is false."  
  - **Worksheets** for each station (one per group) with two sections:  
    - **Static Assignment:** Table to write truth values (T/F) for each card.  
    - **Revision Sequence:** Grid to record truth values over 5 steps (rows: Steps 0–5; columns: Cards).  
  - **Whiteboard** to track group progress (list stations and leave space for key outcomes).  
  - **Timers** for each station.  
  - **Pens/pencils.**  

  **Setup:**  
  - Arrange 4 tables (stations), each with one card set and worksheets.  
  - Divide students into 4 groups of 3. Assign each group to a starting station.  
  - Rules displayed at all stations:  
    - **Disquotation Rule:** A card is *true* iff what it states is the case.  
    - **Bivalence:** Each card must be *true* or *false* (no other values).  
    - **Simultaneous Revision:** When updating, use *only* the truth values from the *previous* step (no incremental changes).  

  **Procedure (80 minutes total):**  
  1. **Introduction (5 minutes):**  
     - Explain the goal: Assign truth values to cards using the Disquotation Rule and classical logic.  
     - Clarify rules: No phones/laptops; groups must agree on assignments; revision updates all cards at once.  

  2. **Station Work (60 minutes, 15 minutes per station × 4 rotations):**  
     - **Timer:** 15 minutes per station (announce when 5/10/14 minutes remain).  
     - **At each station, groups complete two tasks:**  
       - **Task 1: Static Assignment (7 minutes):**  
         - Assign T/F to each card to satisfy the Disquotation Rule.  
         - Record assignments on worksheets. If multiple assignments work, note all. If impossible, explain why.  
       - **Task 2: Revision (8 minutes):**  
         - **Step 0:** Start with all cards **False**. Record.  
         - **Steps 1–5:** Update all cards *simultaneously*:  
           - A card is T in Step *n* iff its statement is true given Step *n–1* values.  
           - Record new values after each step.  
         - Observe if assignments stabilize (stop changing) or cycle.  
     - **Rotation:** After 15 minutes, groups rotate stations (1→2, 2→3, 3→4, 4→1).  

  3. **Group Collaboration Rules:**  
     - All three students must agree on assignments/revision steps.  
     - Resolve disagreements by vote (majority rule).  
     - Instructor circulates to answer procedural questions (avoid theoretical hints).  

  **Payoff/Scoring:**  
  - **No competitive scoring.** Pressure arises from:  
    - **Time limits:** Groups must agree before rotating.  
    - **Logical frustration:** Inconsistent networks force concessions.  
    - **Cycle detection:** Revision instability creates urgency to "fix" assignments.  

  **Expected Challenges & Recovery:**  
  - **Problem:** Groups may update cards sequentially (not simultaneously) in revision, altering outcomes.  
    - **Recovery:** Intervene to clarify "simultaneous" means using *only prior-step values*.  
  - **Problem:** Station 3 (E–F) may only find one assignment (e.g., both F) and miss the other (both T).  
    - **Recovery:** Ask: "Could *both* cards be true? Check the rule."  
  - **Problem:** Station 4 (G–H–I) revision cycles may be too long (6 steps) to observe in 5 steps.  
    - **Recovery:** Note partial patterns (e.g., "values kept changing") and extrapolate in debrief.  

  ---

  ### Debrief (10 minutes)  
  **Map Activity Moments to Theory:**  
  1. **Station 2 (Card D: "Card D is false"):**  
     - **Moment:** Groups cannot assign T/F without violating the Disquotation Rule (if D=T, it must be F; if D=F, it must be T).  
     - **Theory:** Classical impasse (i). Bivalence fails—no consistent assignment exists.  
     - **Trade-off:** To "solve" this, you must abandon classical bivalence (e.g., allow truth-value gaps/gluts).  

  2. **Station 3 (Cards E–F: "E says F is true; F says E is true"):**  
     - **Moment:** Groups find two assignments: (E=T, F=T) or (E=F, F=F). Both satisfy the rules, but nothing "breaks the tie." Revision stabilizes quickly (both F or both T).  
     - **Theory:** Ungrounded consistency (ii). Sentences are consistent but lack "grounding" (no external input to fix values).  
     - **Trade-off:** To handle this, you might reject unique assignments (accept multiple fixed points) or demand grounding.  

  3. **Station 4 (Cards G–H–I: "G says H is true; H says I is true; I says G is false"):**  
     - **Moment:** Static assignment is impossible (e.g., G=T requires H=T, which requires I=T, but I=T requires G=F—contradiction). Revision **cycles** (e.g., Step 0: F-F-F → Step 1: F-F-T → Step 2: F-T-T → Step 3: T-T-T → Step 4: T-T-F → Step 5: T-F-F → then back to Step 0).  
     - **Theory:** Oscillation (iii). No stable assignment exists; revision loops indefinitely.  
     - **Trade-off:** To handle this, you might abandon stability (embrace revision rules) or restrict truth predicates.  

  4. **Station 1 (Cards A–B–C: Grounded control):**  
     - **Moment:** Static assignment (A=T, B=T, C=T) is easy. Revision stabilizes by Step 3 (e.g., Step 0: F-F-F → Step 1: T-F-F → Step 2: T-T-F → Step 3: T-T-T).  
     - **Theory:** Grounded sentences resolve without paradox.  
     - **Contrast:** This works because truth depends on a non-semantic fact ("snow is white").  

  **Theoretical Trade-offs Summary:**  
  - **Classical logic** handles Station 1 but fails Stations 2 and 4 (impasse/oscillation).  
  - **Gap/glut theories** (e.g., Kripke) handle Station 2 by relaxing bivalence but may struggle with Station 3 (arbitrary assignments).  
  - **Revision theories** (e.g., Gupta-Belnap) handle Station 4 by embracing cycles but abandon "final truth" for dynamic evaluation.  
  - **No single solution** handles all without compromise—hence the need for non-classical approaches.  

  **Candid Limitation:**  
  - **What the activity cannot replicate:** The *infinite* aspect of revision (e.g., transfinite sequences in revision theory). Students only see 5 steps; you must clarify that some cycles persist indefinitely and require "limit rules" beyond finite steps.  

  **Instructor Script for Closing:**  
  > "Today, you felt the tensions that force us beyond classical truth: networks that explode (D), float (E–F), or spin (G–H–I). Each non-classical theory you’ll study—fixed points, revision rules, paraconsistency—solves one problem but pays a price elsewhere. Keep these trade-offs in mind as we dive deeper."  

  This activity immerses students in the phenomena, ensuring they confront paradoxes experientially before formalizing solutions. Run it as a fast-paced "truth lab"—chaos is part of the learning!
