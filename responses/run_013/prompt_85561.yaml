  Okay, the user is describing a pattern in legal arguments about punishing sexual practices where the term itself carries a verdict, bypassing harm assessment. They want a term for this, distinctions from similar concepts, boundary cases, and a new term if needed.

  First, I recall "question-begging epithet" as a term where a label assumes a conclusion. For example, calling something "obscene" implies it's punishable without proving harm. But I need to check if this fits exactly. The user mentioned a utilitarian law reformer who noted offense names doing the argument's work. That might be Jeremy Bentham, who criticized "question-begging appellatives." 

  Next, distinguishing from related concepts. Persuasive definitions change a term's meaning to sway opinions, but here the definition isn't changed; the label itself includes judgment. Thick ethical concepts like "brave" combine description and evaluation, but they aren't necessarily institutionalized like legal terms. Essentially contested concepts involve endless debate over meaning, whereas here the debate is avoided because the term implies guilt. Euphemisms/dysphemisms soften or harsh language but don't fuse verdicts directly. Enthymemes miss premises in arguments, but here the term itself is the missing premise.

  Boundary cases: If everyone agrees on the term's meaning, does it still work? Yes, because the verdict is embedded. Institutions like statutes formalize this, making it harder to challenge. If the verdict is correct, the structure remains the same; it's still bypassing argument. The acquittal mirror (e.g., "consensual") is the same phenomenon with opposite effect.

  Since "question-begging appellative" is historical and fits, but might be obscure, coining a term like "verdict-embedded descriptor" could work. Defining it tightly: requires institutional embedding, fuses description/verdict, bypasses harm argument. Examples: "sodomy" (inside), "murder" (outside as harm is intrinsic), "offensive" (inside if legal charge), "rude" (outside as non-institutional).
answer: |-
  The established name for expressions that fuse description and verdict is **question-begging epithet**, with the narrower legal variant **question-begging appellative** (coined by Jeremy Bentham, whom your reformer likely referenced). I am highly confident this matches your core case.  

  ### 1. **Carving the Phenomenon**  
  - **Question-begging epithet**: Embeds a verdict (e.g., "obscenity," "perversion") within a descriptive term, presupposing harm/immorality. Resistance forces debate about the term, not harm.  
  - **Vs. Persuasive definition**: Alters a term’s meaning to sway attitudes (e.g., redefining "justice" as equality). Your case doesn’t redefine; it *presupposes* the verdict via existing usage.  
  - **Vs. Thick ethical concept**: Terms like "courage" fuse fact/value inherently. Your case is *institutional*: statutory labels (e.g., "indecent assault") weaponize thickness to skip harm arguments.  
  - **Vs. Essentially contested concept**: Debates over "democracy" focus on meaning. Here, the term’s meaning is *fixed by authority*; contesting it seems pedantic, not substantive.  
  - **Vs. Euphemism/dysphemism**: Soften/harden perceptions ("collateral damage"). Your case is *verdict-conferring*: "sodomy" defines conduct *and* declares it criminal.  
  - **Vs. Enthymeme**: Omits a premise (e.g., "He lied; he’s untrustworthy" omits "Lying implies untrustworthiness"). Your case *embeds the premise in the term*: "Assault" implies harm, making omission invisible.  

  **Key distinction**: The *institutional embedding* (statutes, charges) forces opponents into linguistic quibbles. Thickness/persuasion lacks this coercion.  

  ### 2. **Boundary Cases**  
  - **Uncontested term?** Yes. If "murder" is universally agreed to mean "unlawful killing with malice," it still fuses verdict/description—but harm (death) is intrinsic. Your sexual-practice terms lack intrinsic harm, making the fusion deceptive.  
  - **Institutional embedding required?** Core cases require it (e.g., statutes naming offences). Loose vernacular use ("That’s cheating!") is parasitic but not identical.  
  - **Correct verdict?** Same phenomenon. If "theft" accurately describes harmful taking, the term *still* skips proving harm in court—it’s structurally identical but morally justified.  
  - **Acquittal-embedding terms?** Symmetric: "Consensual act" fuses description/acquittal. Resisting requires contesting "consensual," not proving harm. Identical mechanism, opposite valence.  

  ### 3. **Coined Term (if rejecting "appellative")**  
  **Verdict-embedded descriptor (VED)**:  
  - *Definition*: A term that institutionally fuses (a) a description of conduct and (b) a legal/moral verdict (guilt/innocence), thereby circumventing independent evaluation of harm/consent.  
  - *Exclusions*:  
    - Inside: "Indecent exposure" (assumes harm), "consensual sex" (assumes innocence).  
    - Outside: "Homicide" (neutral description; verdict appended separately), "offensive" (non-institutional dysphemism).  

  **Bottom line**: Your pattern is **question-begging appellative** (Bentham’s term), distinct due to institutional authority weaponizing semantic fusion to evade harm arguments.
