  We are designing a decision procedure for choosing between process supervision (check every reasoning step) and outcome supervision (only grade the final answer) for a new task.

  Key considerations:
  1. Legibility Tax: The extra cost (annotation time, latency, engineering) of making the model's reasoning checkable step by step. We want to avoid paying this tax unless necessary.
  2. Execution vs. Intent Errors:
     - Execution error: Wrong step, but final answer happens to be right (by luck or compensating errors). This can be caught by process supervision.
     - Intent error: Right final answer, but the reasoning would generalize badly (e.g., shortcuts, unfaithful reasoning). Process supervision can help here too, but note that the reasoning trace might be unfaithful (the model writes a plausible trace but didn't actually use it).
  3. Outcome supervision risks:
     - It can be gamed if the checker is a proxy (e.g., if the model learns to produce answers that look good to the checker but are actually bad in ways the checker doesn't capture).

  The procedure must be usable by someone without theory background. We break it into a series of questions. Each question must be answered with a clear "yes" or "no" (or a small set of options) and the procedure will branch accordingly.

  We aim to cover the following:
  - When is the legibility tax worth paying?
  - How to separate execution errors from intent errors when only outcome labels are available? (But note: if we only have outcome labels, we can't directly see the reasoning. So we may need to infer from patterns in the errors, but the procedure should avoid requiring that if possible.)
  - Flag cases where process supervision might be untrustworthy (unfaithful traces) or outcome supervision might be gamed.

  The procedure:

  # Step 1: Can we automatically verify the outcome with high reliability and low cost?
     - If yes, then outcome supervision is cheap and reliable. We then move to Step 2 to see if we still need process.
     - If no, then we must rely on human evaluation for the outcome. Then we move to Step 3.

  # Step 2: If outcome can be automatically verified, then ask: Is the outcome verification a perfect proxy for the true goal? (i.e., if the model passes the outcome check, is it definitely doing what we want in a way that generalizes?)
     - Consider: Are there known ways the model can "cheat" (like hardcoding in coding) or pass without genuine understanding? If we've seen such cases (or they are likely), then we have a problem of intent errors.
     - If yes (perfect proxy), then outcome supervision is sufficient. We can stop and choose outcome supervision.
     - If no, then we have to worry about intent errors. We then move to Step 4.

  # Step 3: If outcome must be checked by humans, then ask: Is the outcome check by humans cheap and quick (relative to the legibility tax)? And is the outcome itself clear enough that humans can reliably judge it without seeing the process?
     - If yes, then outcome supervision might be acceptable. But we also need to consider if we care about the reasoning. Move to Step 5.
     - If no (outcome is fuzzy, expensive, or unreliable for humans to judge without the process), then we need to consider process supervision. Move to Step 6.

