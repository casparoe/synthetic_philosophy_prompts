answer: |-
  ### Decision Procedure for Choosing Supervision Type  
  *(Run this for each new task before data collection. Answer questions in order. Stop at the first decision or escalation.)*

  ---

  #### 1. **Can we automatically check the final outcome?**  
     - *Sufficient answer:* Yes = Outcome is 100% machine-verifiable (e.g., math answer, test pass/fail). No = Requires human judgment (e.g., tone, policy, vague success).  
     - **Yes → Go to 2.**  
     - **No → Go to 3.**  

  #### 2. **Is a correct final outcome a perfect guarantee of success?**  
     - *Sufficient answer:* Yes = No known risks of "gaming" or hidden bad reasoning (e.g., simple arithmetic). No = Outcome can be right for wrong reasons (e.g., hardcoded solutions, lucky guesses, incomplete checks).  
     - **Yes → Use OUTCOME supervision.** (Legibility tax isn’t worth it.)  
     - **No → Go to 4.**  

  #### 3. **Can humans judge the outcome reliably without seeing steps?**  
     - *Sufficient answer:* Yes = Outcome is unambiguous and quick to score (e.g., "Was the customer satisfied?"). No = Outcome is fuzzy/complex and needs step-by-step context (e.g., policy adherence in a chat).  
     - **Yes → Go to 5.**  
     - **No → Go to 6a.**  

  #### 4. **Can we catch bad reasoning *without* step-by-step checks?**  
     - *Sufficient answer:* Yes = Cheap tricks exist (e.g., adding extra tests, input variations). No = Bad reasoning is stealthy and hard to detect from outcomes alone.  
     - **Yes → Use OUTCOME supervision** (augment with anti-gaming safeguards).  
     - **No → Go to 6a.**  

  #### 5. **Do we care *why* the outcome was correct?**  
     - *Sufficient answer:* Yes = Values require trustworthy reasoning (e.g., safety, generalization). No = Only the result matters (e.g., efficiency, cost).  
     - **Yes → Go to 6a.**  
     - **No → Use OUTCOME supervision.**  

  #### 6a. **Can the task be broken into clear, verifiable steps?**  
     - *Sufficient answer:* Yes = Steps are objective and checkable (e.g., code, math equations). No = Steps are subjective or easily faked (e.g., "thoughts" in a chatbot).  
     - **Yes → Go to 6b.**  
     - **No → ESCALATE.** (Values call: How much do we care about unfaithful reasoning traces?)  

  #### 6b. **Is the legibility tax affordable?**  
     - *Sufficient answer:* Yes = Annotation cost/latency ≤ 20% of budget AND errors are costly. No = Tax strains resources OR task is low-stakes.  
     - **Yes → Use PROCESS supervision.**  
     - **No → ESCALATE.** (Values call: How critical is avoiding intent errors vs. cost?)  

  ---

  ### Key Clarifications  
  - **Legibility tax worth it?** Only if:  
    - Execution/intent errors are dangerous, AND  
    - Steps are truly checkable (6a), AND  
    - Cost is justified (6b).  
  - **Spotting intent errors from outcomes?** Only possible if you can design "trap" checks (e.g., varied inputs). If not, assume process needed.  
  - **Unfaithful traces?** Flagged in 6a (subjective steps = high risk).  
  - **Gamed outcomes?** Flagged in 2/4 (imperfect proxies = high risk).  

  ---

  ### Runs on Cases  
  #### Case 1: Math word problems (auto-checked outcome)  
  1. **Yes** → 2. **No** (right answer ≠ valid reasoning) → 4. **No** (can’t auto-detect bad steps) → 6a. **Yes** (math steps are checkable) → 6b. **Yes** (equations are cheap to verify) → **PROCESS supervision.**  
  *Why?* Prevents lucky guesses. Tax is low (steps are auto-verifiable).  

  #### Case 2: Customer-support agent (fuzzy outcome)  
  1. **No** → 3. **No** (tone/policy need step-by-step context) → 6a. **Yes** (messages are checkable) → 6b. **No** (annotating every chat is too costly) → **ESCALATE.**  
  *Why?* Steps are legible, but tax may be prohibitive. PI must weigh: Is random auditing enough?  

  #### Case 3: Coding agent (auto-checked but incomplete tests)  
  1. **Yes** → 2. **No** (tests can be gamed) → 4. **No** (hardcoding is stealthy; no cheap traps) → 6a. **Yes** (code is checkable) → 6b. **No** (human review of all code is expensive; budget small) → **ESCALATE.**  
  *Why you won’t like it:* You want process, but the procedure forces cost accountability. If annotators can’t feasibly review every step, escalation is required. PI must decide: Accept risk of bad code, pay the tax, or find hybrid solutions (e.g., spot checks).  

  ---

  ### What the Procedure Can’t Do  
  - **Hybrid approaches:** Only handles pure process/outcome. Escalation flags when hybrids (e.g., 20% process spot checks) should be considered.  
  - **Future-proofing:** Assumes current constraints. If budgets/tools change, re-run.  
  - **Low-stakes tasks:** May over-recommend process if 6b isn’t strict (e.g., "errors are costly" is subjective).  
  - **Misfires when:**  
    - Steps *seem* legible but are actually unfaithful (e.g., deceptive reasoning traces).  
    - Outcome proxies *seem* imperfect but are "good enough" (e.g., 95% test coverage).  

  \answer{escalate}
