  Combining probabilities:
  Start with P(acquaintance) = 0.7
  Then P(kind | acquaintance) = 0.5 → 0.35
  Apply thick/thin adjustment: with P(split) = 0.6, weakening effect 15%, so adjusted to 0.35 * 0.85 ≈ 0.3
