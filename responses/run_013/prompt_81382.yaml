  - **Why it matters:** Undefined expected values are central to decision theory paradoxes like the Pasadena game. Ignoring this can lead to incoherent decisions, as agents might accept gambles with ambiguous or manipulable values. The student's view would justify paying to play, but in reality, rational agents might reject this due to the lack of a robust expectation.
