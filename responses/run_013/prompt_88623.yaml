  The user raises important points about higher-order vagueness—whether the borderline itself is vague—and how legal necessity forces decisions, which might challenge both theories. They also mention persistent disagreement across courts and communities, which could support epistemicism (if it's about our ignorance) or undermine it (if no consistent boundary exists).

  Looking at the Miller test, the "community standards" prong seems epistemicist. It implies a factual boundary we're trying to discover, but disagreement might suggest there isn't one. The "serious value" prong, however, feels more like supervaluationist precisification, especially with experts testifying. 

  Higher-order vagueness is crucial here. If the boundary between clear cases and borderline cases is itself vague, epistemicism's sharp line becomes problematic. Legal practice might reveal this through inconsistent rulings even after appellate review. 

  The user's deeper interest seems to be in how law's practical demands test these theories beyond philosophical puzzles. The obscenity context adds social dimensions like cultural shifts and moral disagreement, which aren't present in sorites paradoxes. 

  I should emphasize how legal necessity forces binary outcomes, bridging supervaluationist gaps through authority rather than truth. This relates to Hart's view of law providing determinate answers. Persistent disagreement might lean toward supervaluationism, showing no single correct boundary. 

  The unique insights from obscenity law include the role of community standards evolving over time, the impact of multiple jurisdictions, and the law's need to decide despite vagueness. These elements highlight tensions in both theories when applied to real legal systems.
answer: |-
  Your analysis of obscenity jurisprudence through epistemicism and supervaluationism reveals profound tensions in legal vagueness, particularly regarding higher-order vagueness and law's decisional imperative. Here's a framework structured around your core questions:

  ### 1. **Miller Test & Theoretical Framing:**
     - **Epistemicist Reading (Ignorance of Sharp Line):**  
       The Court's assertion that obscenity is "knowable when seen" (*Jacobellis*) echoes epistemicism. The Miller test’s reliance on "contemporary community standards" and "serious value" *presupposes* a factually determinate line grounded in empirical social facts (what "the average person" deems prurient) or objective value (LAPS). Persistent disagreement is framed as *epistemic limitation*—courts seek but fail to locate the precise boundary. Legal error becomes possible even in borderline cases.
     
     - **Supervaluationist Reading (Precisification Required):**  
       Miller’s three prongs function as *precisification parameters*. "Community standards" allows for variable admissible precisifications (e.g., different jurisdictions defining "prurient interest" differently). The "serious value" prong (determined by a "reasonable person" standard, not community norms, per *Pope v. Illinois*) explicitly requires judicial precisification of an abstract concept. Borderline works lack determinate legal status until a court rules.

  ### 2. **Law’s Decisional Imperative vs. Truth-Value Gaps:**
     - **The Supervaluationist Challenge:** Legal systems cannot tolerate truth-value gaps—every case must be decided. This forces courts to *impose* determinate outcomes on borderline cases (*forced march through the sorites series*).  
       - **Resolution:** Courts act as *authorized precisifiers*. A ruling doesn’t discover pre-existing truth but *creates* legal status through institutional authority (Hart’s "rules of adjudication"). Post-decision, "this work is obscene" becomes true *by fiat* within that jurisdiction, collapsing the supervaluationist gap. This aligns with Keefe’s "penumbral connections" but prioritizes institutional finality over semantic indeterminacy.

  ### 3. **Persistent Disagreement: A Double-Edged Sword:**
     - **Against Epistemicism:** Widespread, persistent disagreement across courts/communities (e.g., divergent rulings on identical material in different circuits) suggests no *single knowable boundary* exists. If epistemicism requires a unique sharp line, but communities/judges legitimately precisify differently, the data undermines the theory.  
     - **For Epistemicism (Revised):** An epistemicist might argue disagreement stems from *noisy access* to the objective boundary (e.g., flawed application of community standards) or *context-relativity* (the line is sharp *relative to a specific community*). However, this strains credibility when disagreement persists among equally positioned observers.  
     - **For Supervaluationism:** Disagreement is *expected*—different precisifications yield different verdicts. The absence of consensus demonstrates the absence of a unique correct answer pre-decision. The law manages this via jurisdictional boundaries and stare decisis.

  ### 4. **Higher-Order Vagueness: The Critical Problem for Epistemism in Law:**
     Epistemicism posits a sharp cutoff between obscene and non-obscene works. But where is the sharp cutoff between *clearly obscene* and the *borderline*, or between the *borderline* and *clearly protected*?  
     - **The Inescapable Regress:** If "obscene" has borderline cases, so does "clearly obscene." Epistemicism must posit *infinitely many sharp boundaries* for higher-order categories—e.g., a precise point where a work transitions from "definitely obscene" to "borderline-obscene." This is *legally unintelligible*. Courts don’t (and can’t) treat their own uncertainty as tracking infinitely complex boundaries.  
     - **Judicial Practice as Evidence:** Courts grapple with *second-order vagueness* implicitly. When appellate courts review obscenity determinations, they often focus on whether the material was *properly placed in the borderline zone for jury evaluation*, not whether a precise line was missed. This suggests zones of indeterminacy, not sharp boundaries obscured by ignorance. Legal tests like Miller *acknowledge* this by incorporating flexible, multi-factor analysis rather than seeking a single criterion.

  ### 5. **Beyond the Sorites: What Obscenity Reveals:**
     - **Temporal Dynamics:** "Contemporary community standards" shift over time (*Miller* explicitly rejects *national* standards). Epistemicism struggles with a boundary that *moves* objectively yet imperceptibly. Supervaluationism handles this via re-precisification (new community norms generate new admissible precisifications).  
     - **Normative Pluralism:** Communities differ *morally and aesthetically*. Supervaluationism accommodates this by allowing multiple legitimate precisifications. Epistemicism requires either one "true" standard (implausible) or relativization (undermining national constitutional principles).  
     - **Institutional Expertise:** The "serious value" prong relies on expert testimony (critics, scholars). This resembles supervaluationist "admissible precisifiers" resolving indeterminacy through recognized authority, not discovering hidden facts.  
     - **The Cost of Error:** In law, misclassifying protected speech as obscene (a First Amendment violation) is deemed *more harmful* than the reverse. This normative asymmetry shapes precisification (courts may err toward protection in close cases), something a purely descriptive epistemicism cannot explain. Supervaluationism allows normative considerations to guide precisification.

  ### Conclusion:
  The Court’s obscenity jurisprudence **fits supervaluationism better**, especially given higher-order vagueness and law’s need for institutional resolution of indeterminacy. Miller functions as a *precisification framework*, not an epistemic discovery tool. Persistent disagreement reflects the absence of a unique sharp line, not collective ignorance. Higher-order vagueness makes epistemicism's sharp boundaries legally untenable—courts manage penumbras, not hunt for invisible lines. Crucially, obscenity highlights how law *uses* vagueness to accommodate pluralism and change, resolving it authoritatively when needed. This pragmatic dimension, absent in sorites puzzles, reveals supervaluationism's strength in capturing law's dynamic response to vagueness.

  This analysis suggests that in legal contexts—where decisions are obligatory, normative, and institutional—supervaluationism offers a more coherent framework than epistemicism, particularly when confronting higher-order vagueness and socio-moral evolution.
