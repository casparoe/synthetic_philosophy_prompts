prompt: |-
  As a software engineer, I keep needing to put a probability distribution on a continuous quantity when all I know is its range or a symmetry, and I have been warned that this is a minefield. Before adopting any rule, I want a full specification of what such a rule must deliver. Write the desiderata that any adequate principle of indifference must satisfy, giving the motivating case behind each. Please include at least: consistency across the competing parametrisations in the classical chord problem; invariance under a change of variable, or else an explicit account of which parametrisation is privileged and why; agreement between indifference applied to a quantity and indifference applied to a derived quantity of it (say, a rate known only to lie between 1 and 2, its reciprocal, and the ratio of two such rates); and stability under conditioning. I am also uneasy that such a rule can be turned on itself, so add a requirement that it must not yield contradictory advice when applied to the choice of rule. Then tell me which requirements are non-negotiable and which are merely the preferences of a particular camp, and flag any subset that cannot be jointly satisfied — I suspect the invariance and the additivity requirements pull against each other, and that would be the most useful part of the answer. Finally, identify the single requirement that rules out the greatest number of otherwise plausible principles. I want the reasoning only, so no reading list and no references, and please write in British English.
reasoning: |-
  Okay, the user is a software engineer dealing with placing probability distributions on continuous quantities when only the range or symmetry is known. They've been warned it's tricky, so they want a clear set of desiderata for any principle of indifference. Let me start by recalling the key issues they mentioned: consistency across parametrizations (like the chord problem), invariance under variable changes, agreement between a quantity and its derived form (like reciprocal rates), and stability under conditioning. They also want the rule to avoid self-contradiction when choosing the rule itself.

  First, I need to break down each desideratum with a motivating case. The chord problem is a classic example where different parametrizations (distance from center vs. angle) lead to different probabilities. So consistency there is crucial. Then, change of variables—like measuring a rod in cm vs. inches—shouldn't change the distribution unless there's a reason. The reciprocal rates example: if I have a rate between 1 and 2, its reciprocal is between 0.5 and 1. Indifference on the rate should align with indifference on the reciprocal. Stability under conditioning means that if I learn part of the range is impossible, the updated distribution should still make sense.

  The user's deeper concern is avoiding contradictions. They might be designing systems where arbitrary choices in parametrization lead to inconsistent results, which could break models. Also, they probably need robust implementations where derived quantities behave predictably. The self-referential requirement suggests they want a rule that's logically sound at a meta-level.

  I should consider which desiderata are non-negotiable. Consistency in parametrization and invariance are fundamental; without them, the principle isn't reliable. Agreement between quantities and their derivations is also key for coherent systems. Stability under conditioning is practical for updating beliefs. But the self-referential consistency is tricky—it's a higher-order check that might not be feasible, but it's important to flag.

  Now, the big issue: invariance and additivity can't both be satisfied. For example, uniform in one variable isn't uniform in its inverse. That's the core conflict. The strongest requirement that rules out many approaches is likely invariance under change of variables, as it demands that the measure doesn't depend on how you describe the problem. Without it, many ad-hoc solutions fail.

  Also, I should note that some desiderata might be preferences. For instance, some Bayesian camps might accept that reparametrization requires a prior based on information, not strict invariance. But the user wants clarity on what's essential. The chord problem shows that without consistency, the principle is arbitrary. So invariance is non-negotiable for objectivity, but it conflicts with additivity, leading to the need for a privileged parametrization—which then needs justification.

  Finally, the meta-requirement: the rule shouldn't contradict itself when applied to choosing rules. This might be too stringent, but it's worth including to highlight the limitations. In practice, this is where many principles fall apart, pushing towards structured approaches like maximum entropy based on empirical constraints rather than pure indifference.

  Summarizing: the key tension is between invariance and additivity. Invariance is the major filter, ruling out uniform distributions unless the parametrization is linear. The reciprocal rates example illustrates that uniformity in rate isn't uniform in its reciprocal, so you can't have both. Hence, a principle must choose a parametrization, like using Jeffreys prior in some cases, but that requires justification. The user needs to know that no perfect solution exists, but understanding these conflicts helps in making informed choices.
answer: |-
  As a software engineer venturing into continuous probability with limited information, your caution is warranted. The Principle of Indifference (PoI) – assigning uniform probabilities based solely on ignorance – is indeed treacherous. Here’s a rigorous specification of desiderata, grounded in motivating cases, highlighting tensions:

  1.  **Consistency Across Competing Parametrisations (Chord Problem):**
      *   **Desideratum:** The PoI must assign the same probability to equivalent events, regardless of the mathematical parameterisation used to describe the underlying quantity.
      *   **Motivating Case:** Consider a circle with a chord chosen "at random". What is P(chord length > side of inscribed equilateral triangle)? Parametrising by:
          *   *Distance from centre (d):* Uniform d on [0, R] implies P ≈ 0.5.
          *   *Angle subtended at circumference (θ):* Uniform θ on [0, π] implies P ≈ 1/3.
          *   *Midpoint coordinates (x,y):* Uniform on the disk implies P ≈ 0.25.
      *   **Need:** A valid PoI must *not* yield conflicting probabilities for the same event based solely on the chosen coordinate system. The event "chord longer than L" is invariant; its probability must be invariant too.

  2.  **Invariance under Change of Variable:**
      *   **Desideratum:** The probability distribution assigned to a quantity `X` must transform correctly under a smooth, invertible change of variables `Y = g(X)`. If `g` is 1-to-1, the distribution for `Y` should be derivable *uniquely* via the Jacobian from the distribution of `X`. Absent a *privileged parametrisation*, the PoI must yield consistent results under *all* such transformations.
      *   **Motivating Case:** You know a rod's length `L` is between 1m and 2m. Apply PoI to `L`: uniform on [1,2]. Now consider volume `V = k*L³` (for some constant k). Uniform `L` implies non-uniform `V` (P(V ≤ v) ∝ v^{1/3}). If you instead applied PoI naively to `V` (knowing V between k*1³ and k*2³), you'd get uniform `V`, implying non-uniform `L`. Which is "correct" for representing ignorance?
      *   **Need:** Probability should reflect properties of the *system*, not the arbitrary units or functions we use to describe it. Without invariance, the PoI is arbitrary and meaningless.

  3.  **Agreement under Invertible Transformation (Reciprocal Rates):**
      *   **Desideratum:** If `Y = g(X)` is a smooth, invertible transformation, and ignorance about `X` justifies a specific distribution via PoI, then applying PoI *directly* to `Y` (based solely on its range derived from `X`'s range) must yield a distribution consistent with transforming the distribution of `X` via `g`. If it does not, there is a contradiction.
      *   **Motivating Case:** Rate `R₁` known only to be in [1, 2]. Rate `R₂` known only to be in [1, 2]. Apply PoI independently: `R₁ ~ Uniform[1,2]`, `R₂ ~ Uniform[1,2]`.
          *   Consider `S = R₁ / R₂`. Its range is [0.5, 2]. What is P(S ≤ 1)? Under independent uniforms for R₁, R₂, P(S ≤ 1) = 0.5.
          *   Now apply PoI *directly* to `S` on [0.5, 2]. A naive uniform S would give P(S ≤ 1) = (1 - 0.5) / (2 - 0.5) ≈ 0.333. Contradiction!
          *   Similarly, consider the reciprocal: `T = 1/R₁` lies in [0.5, 1]. PoI on `R₁` (uniform) implies `T` has density ∝ 1/t². Naive PoI on `T` (uniform on [0.5,1]) gives a different distribution.
      *   **Need:** Ignorance about `X` logically implies ignorance about `Y = g(X)`. The assigned probabilities must cohere across these logically equivalent descriptions. This is a specific instance of the broader invariance requirement (2), highlighting its criticality.

  4.  **Stability under Conditioning (Refinement Consistency):**
      *   **Desideratum:** Applying the PoI to the initial range, and then conditioning on a sub-interval revealed to be possible, should yield the same distribution as directly applying the PoI to the sub-interval *if no further information distinguishes sub-parts of the sub-interval*.
      *   **Motivating Case:** A parameter `X` is initially known only to lie in [0, 1]. PoI assigns `X ~ Uniform[0,1]`. You then learn conclusively that `X ∈ [0.2, 0.8]`, but gain no other information. Conditioning the initial uniform distribution gives `X ~ Uniform[0.2, 0.8]`. Applying PoI directly to the new range `[0.2, 0.8]` also gives `Uniform[0.2, 0.8]`. These agree.
      *   **Need:** Learning only that the value lies in a subset shouldn't change the *form* of ignorance within that subset, assuming the PoI was correctly applied initially. The principle should be stable upon receiving information that merely refines the range without adding discriminatory detail.

  5.  **Self-Consistency (No Self-Contradiction in Rule Selection):**
      *   **Desideratum:** The PoI rule itself must not generate contradictory advice if applied to the problem of selecting *which* PoI rule (or parametrisation) to use, based solely on ignorance about the appropriate rule.
      *   **Motivating Case:** Suppose we consider different candidate PoI rules (e.g., uniform in X, uniform in log(X), uniform in X²). If we are "ignorant" of which rule is "correct", could we apply a PoI over the *set* of rules? A uniform distribution over rules would likely assign positive probability to rules that contradict each other fundamentally. Applying the chosen PoI rule to itself shouldn't create an inconsistency or regress.
      *   **Need:** To avoid infinite regress or arbitrariness. If the PoI requires a privileged parametrisation, how do we choose *that* parametrisation under ignorance? Applying PoI naively at this meta-level is paradoxical. The rule must be justifiable without invoking itself in a contradictory loop.

  **Analysis of Desiderata & Conflicts:**

  1.  **Non-Negotiable (Foundational):**
      *   **Consistency (1):** Without this, the PoI isn't a principle; it's arbitrary nonsense. Contradicting probabilities for the *same* event are fatal.
      *   **Invariance (2) OR Privileged Parametrisation (2a):** You *must* have one or the other. Pure invariance (2) is the gold standard for representing ignorance, as it removes arbitrariness. Accepting a privileged parametrisation (2a) is a retreat, demanding a *compelling justification* for *why* that specific parametrisation reflects ignorance uniquely (e.g., scale invariance suggests log(X), translation invariance suggests X). Without either (2) or (2a), the PoI is arbitrary.
      *   **Agreement (3):** This is a direct consequence of (2). If agreement fails, invariance fails. It's non-negotiable *if* invariance is desired.
      *   **Self-Consistency (5):** While subtle, a rule that contradicts itself when self-applied cannot be rationally defended. It reveals a fundamental flaw.

  2.  **Preferences / Contextual (Important but potentially relaxed):**
      *   **Stability (4):** Highly desirable for coherence. However, *some* proposed resolutions to the invariance problem (e.g., using non-additive measures) might violate strict Kolmogorov probability and thus standard conditioning, making (4) moot or requiring redefinition. Within standard probability, it's strongly desired.
      *   **Privileged Parametrisation (2a):** Accepting this is a *concession* forced by the conflict between invariance and additivity (see below). The justification *for* the privileged parametrisation becomes paramount (e.g., Jaynes' transformation groups, Jeffreys priors based on Fisher information for statistical models). It moves away from pure "ignorance".

  3.  **The Core Conflict: Invariance vs. Additivity:**
      *   **The Tension:** Desiderata (2) [Invariance] and (3) [Agreement] fundamentally conflict with the intuitive notion that "uniform" in the "obvious" space should hold, *and* that probabilities should add up over disjoint intervals in that obvious space.
      *   **Why?** A uniform distribution in variable `X` is *not* uniform in `Y = g(X)` unless `g` is linear (`Y = aX + b`). For example:
          *   Uniform `X` on [a, b] has constant density `fₓ(x) = 1/(b-a)`.
          *   For `Y = g(X)`, the density `fᵧ(y) = fₓ(g⁻¹(y)) * |d(g⁻¹(y))/dy|`.
          *   For `fᵧ(y)` to be constant, `|d(g⁻¹(y))/dy|` must be proportional to `1 / fₓ(g⁻¹(y))`. This only holds if `fₓ` is constant *and* `g` is linear.
      *   **Consequence:** You *cannot* simultaneously have:
          *   Uniform distribution in `X`.
          *   Uniform distribution in `Y = g(X)` (unless `g` linear).
          *   Standard additivity of probability over intervals defined in both `X` and `Y`.
      *   **Resolution?** You must abandon one: 1) Demand invariance (2 & 3), giving up uniformity in any particular parametrisation (e.g., Jeffreys priors). 2) Accept a privileged parametrisation (2a) where uniformity is defined (e.g., linear space), breaking invariance for others. 3) Abandon Kolmogorov probability (rarely practical).

  4.  **The Most Discriminating Requirement:**
      *   **Invariance under Change of Variable (2).** This single requirement eliminates the vast majority of naive "uniform" assignments. It immediately exposes the flaw in assuming uniformity in the most "obvious" or linearly scaled variable (like length `L` or rate `R₁`). It forces the recognition that "uniform" is parametrisation-dependent and that true ignorance demands a solution respecting the geometry of the parameter space (e.g., using a measure like the Jeffreys prior derived from information geometry) or a convincing argument for a privileged base. It is the requirement that Bertrand's Paradox and the Reciprocal Rates problem most starkly violate under naive application.

  **Conclusion:**

  The essential, non-negotiable core is **consistency** (1) and **self-consistency** (5). However, the **invariance/agreement** cluster (2 & 3) is the critical battleground. You *must* explicitly choose:

  1.  **The Hard Path:** Insist on full invariance. This necessitates abandoning uniformity in familiar scales and leads to priors defined by transformation groups or information geometry (e.g., uniform in log(X) for scale parameters). Stability (4) often holds under conditioning *within* this framework.
  2.  **The Pragmatic Path:** Accept a privileged parametrisation (2a). You *must* rigorously justify *why* that parametrisation uniquely represents ignorance (e.g., "linear distance is fundamental", "the problem specification implies this scale"). Agreement (3) holds only between transformations consistent with the privileged space. Stability (4) usually holds within the chosen parametrisation.

  The conflict between invariance and additivity means **no single, universally applicable "uniform" distribution exists for representing ignorance on continuous spaces.** Your choice of rule depends critically on the *nature* of the continuous quantity (is it a location? a scale? a count?) and the *symmetry* you genuinely believe represents your ignorance. Resist the siren call of naively slapping down `Uniform(a, b)` without confronting this core conflict.
