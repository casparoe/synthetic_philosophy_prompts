answer: |-
  ### Research Proposal: Answer-Independent Constraints in Conceptual Slippage during Analogy-Making  

  #### **1. Research Question and Background**  
  **Core Question**: Does conceptual slippage in analogy-making rely on *answer-independent constraints* (warranted by domain structure), or is it driven *retrospectively* by answer elegance, with slippage rationalized post hoc?  

  **Determinate Answer & Null Result**:  
  - **Affirmative**: Evidence that specific slippages are preferred *before* answer generation, predicted by domain structure (e.g., statistical regularities or causal links).  
  - **Negative**: Slippage correlates only with answer elegance, with no domain-internal predictive constraints.  
  - **Null Result**: If no answer-independent constraints are found, this challenges Copycat’s cognitive plausibility, suggesting slippage is purely elegance-driven.  

  **Why Existing Work Leaves This Open**:  
  Copycat’s architecture (e.g., slipnet, temperature) permits slippages but lacks mechanisms to *independently* validate them. Slippage costs are dynamic and context-sensitive, yet ultimately minimized to achieve coherence in the workspace. Evaluations focus on *answer quality* (e.g., depth, elegance), not constraints *intrinsic to the domain*. Letter-string domains exacerbate this: answers are predefined (e.g., "abc"→"abd" implies "ijk"→"ijd"), conflating slippage warrant with elegance. The model’s post-solution temperature drop reflects *settledness*, not *warrant*. Thus, whether slippage is constrained *during* processing (vs. justified by outcome) remains untested.  

  ---  

  #### **2. Method: Microdomain and Experiment Design**  
  **Novel Microdomain: "Container-Liquid" Sequences**  
  - **Primitives**:  
    - *Containers*: Cup (C), Bowl (B), Vase (V).  
    - *Liquids*: Water (W), Juice (J), Syrup (S).  
    - *States*: Full (F), Half-full (H), Empty (E).  
    Each item is a tuple: (Container, Liquid, State), e.g., `(C, W, F)` = "Full cup of water". Sequences describe transitions, e.g., `[(C, W, F) → (C, W, E)]` = "Full cup of water becomes empty".  

  - **Literal Reading**:  
    Rules map inputs verbatim (e.g., "Cup→Cup", "Water→Water", "Full→Empty").  

  - **Permitted Slippages**:  
    - *Container*: Cup ↔ Bowl (shape similarity), Vase → Cup (function: both hold liquid).  
    - *Liquid*: Water ↔ Juice (viscosity), Syrup → Juice (sugar content).  
    - *State*: Full ↔ Half-full (volume), Half-full → Empty (depletion).  
    **Warranted** slippages have *causal/functional links* (e.g., "Vase→Cup" via *holding-liquid*; "Half-full→Empty" via *depletion*). **Ad hoc** slippages lack such links (e.g., "Cup→Bowl" via arbitrary shape).  

  - **Problem Set**:  
    20 analogy problems (A:B :: C:?), each with two valid answers:  
    - **Warranted-Slippage Answer**: Requires slippage with domain support (e.g., causal chain).  
    - **Ad-Hoc-Slippage Answer**: Uses arbitrary slippage but yields elegant symmetry (e.g., identical container change).  
    *Example Problem*:  
    A: `[(B, J, F) → (B, J, H)]` (*Bowl of juice full → half-full*)  
    B: `[(V, S, F) → (V, S, E)]` (*Vase of syrup full → empty*)  
    C: `[(C, W, F) → (C, W, H)]` (*Cup of water full → half-full*)  
    ?:  
    - Warranted: `(C, W, E)` (via *depletion*: half-full → empty).  
    - Ad hoc: `(B, W, H)` (via *container* slip Cup→Bowl; elegant as A and C now share containers).  

  **Hypothesis Separation**:  
  - **Answer-Driven Hypothesis**: Ad-hoc answers chosen more often; elegance predicts slippage.  
  - **Constraint-Based Hypothesis**: Warranted answers preferred; slippage constrained by domain structure.  

  **Manipulation: Goal-Seeding Context**  
  - Participants complete 5 training problems priming either:  
    - **Constraint-Based Goal**: "Identify *physically realistic* transitions" (emphasizes causality).  
    - **Elegance-Driven Goal**: "Identify *aesthetically symmetric* transitions" (emphasizes patterns).  
  - Critical test: 10 problems post-training (counterbalanced).  

  **Computational Model (Python Implementation)**:  
  - **Architecture**:  
    - *Slipnet*: Nodes for containers/liquids/states; edges weighted by slippage warrant (e.g., causal strength: Half-full→Empty = 0.9; arbitrary: Cup→Bowl = 0.3).  
    - *Workspace*: Builds mappings between A→B and C→D.  
    - *Temperature*: Updated via perceptual instability (rule conflicts), not answer quality.  
  - **Prediction Mechanism**:  
    Simulates human responses under two versions:  
    1. **Constraint Model**: Slippage cost inversely proportional to warrant (e.g., causal strength).  
    2. **Elegance Model**: Slippage cost fixed; answer selected by elegance (e.g., symmetry score).  
  - **Output**: For each problem, model predicts slippage path and answer.  

  **Dependent Variables**:  
  - Human: % choosing warranted vs. ad hoc answers (per group).  
  - Model: Agreement with human choices; slippage path analysis.  

  ---  

  #### **3. Feasibility, Risks, and Outcomes**  
  **Scope (One Semester)**:  
  - **Achievable**:  
    - Model implementation (Python; ~4 weeks).  
    - Problem set design (~2 weeks).  
    - Online behavioral study (30 participants; Prolific; $300 budget; ~2 weeks).  
    - Basic analysis (model-human comparison; slippage path correlations; ~2 weeks).  
  - **Not Achievable**:  
    - Full Copycat replication (complex micro-worlds).  
    - Large-N fMRI/eye-tracking.  
    - Domain-general conclusions.  

  **Failure Criteria**:  
  1. Model cannot generate distinct predictions (e.g., constraint/elegance versions converge).  
  2. Null results:  
     - Human data show no preference for warranted slippages *even under constraint-based goals*.  
     - Model fails to predict human choices (accuracy < 60%).  
  3. Critical problems misclassified (e.g., ad hoc answers deemed more "realistic").  

  **Expected Outcomes**:  
  - **Success**: Evidence for answer-independent constraints (e.g., constraint group + model prefer warranted slippages).  
  - **Theoretical Impact**:  
    - Positive: Validates constrained-slippage mechanisms in analogy models.  
    - Negative: Suggests Copycat’s "warrant" is elegance in disguise.  

  ---  
  **Proposal Length**: ~3 pages (excluding citations).  
  **Budget**: $300 for participant payments (optional).  
  **Ethics**: Exempt protocol (minimal-risk online study).
