  I am applying for a small internal pilot grant — one semester, one person, coding in Python, enough budget for a couple of dozen participants or none at all — and I need a three-page research proposal. My half-formed idea: in the Copycat tradition, conceptual slippage is offered as the explanation of how a system gets from a literal reading of an analogy problem to the reading under which the problem becomes solvable, and the global measure of how settled a reading has become (temperature, in that tradition) is supposed to tell you when the system has arrived. I cannot see that the mechanism ever distinguishes a warranted slippage from a merely convenient one: the elegance of the answer seems to be doing the work, with the slippage read back off it after the fact. I want to know whether that is actually so — whether there is any answer-independent criterion by which one slippage can be called warranted and another ad hoc.

