  We are writing a research proposal for a small internal pilot grant. The project is to be completed in one semester by one person (the PI) coding in Python, with a budget sufficient for a small behavioral experiment (or none at all). The central question is about the mechanism of conceptual slippage in analogy-making, inspired by the Copycat tradition. Specifically, we question whether the system has an answer-independent way to distinguish warranted slippage (which is conceptually justified) from ad hoc slippage (which is merely convenient for arriving at an elegant answer). The proposal must:

  1. State the research question so that it has a determinate answer and a null result would be informative.
  2. Explain why existing work in the Copycat tradition leaves the question open.
  3. Propose a novel microdomain (not letter-strings) with defined primitives, literal reading, permitted slippages, and a set of items.
  4. Design a study to separate two hypotheses: (a) slippage is driven by the elegance of the answer (i.e., after the fact) and (b) slippage is constrained by something internal to the domain (i.e., answer-independent criteria).
  5. Specify the computational model to be built, what it must predict, a manipulation to seed a different goal, and the criteria for failure.
  6. Be honest about the scope (what fits in one semester).

  Let's break this down.

  ### Research Question
  The core question: In the process of analogy-making, is conceptual slippage guided by answer-independent constraints (i.e., inherent in the domain's structure) or is it driven retrospectively by the elegance of the answer?

  We can state it as: 
  "Does the process of conceptual slippage in analogy-making rely on answer-independent constraints that distinguish warranted from ad hoc slippages, or is it driven by the elegance of the answer, with slippage being read back after the fact?"

  To make it have a determinate answer and informative null result:
  - A determinate answer would be: "Yes, there is an answer-independent constraint" or "No, the process is entirely answer-driven."
  - A null result (i.e., we cannot find evidence for answer-independent constraints) would suggest that the Copycat model (and similar) might be fundamentally answer-driven, which challenges the cognitive plausibility of the mechanism.

  ### Why Existing Work Leaves the Question Open
  In the Copycat model, slippages are allowed by the architecture (e.g., through the slipnet and the temperature mechanism). However, the model does not explicitly represent a distinction between warranted and ad hoc slippage. The evaluation of an answer is based on its "goodness" (e.g., elegance, depth) and the temperature (which reflects the system's uncertainty) drops when a coherent answer is found. But the process of slippage itself is not constrained by an independent criterion; it is driven by the current state of the workspace and the pressures to find a solution. Thus, the model does not have a built-in mechanism to prevent an ad hoc slippage if it leads to an elegant answer. Moreover, the existing work (on letter-string domains) has not tested this distinction because the problems are designed to have one "intended" elegant solution. The question remains open because the model's behavior has not been systematically tested against cases where warranted and ad hoc slippages lead to different outcomes.

  ### Proposed Microdomain
  We need a microdomain that:
  - Is novel (not letter-strings).
  - Has clear primitives and a literal reading.
  - Permits multiple slippages (both warranted and potentially ad hoc).
  - Is simple enough for a small-scale study.

  I propose a domain of **simple geometric shapes** arranged in sequences. The sequences are composed of a few basic shapes (circle, square, triangle) and a few attributes (size: small, large; and color: red, blue). The analogy problems will be of the form: A:B :: C:? 

  **Primitives:**
  - Shapes: circle (c), square (s), triangle (t)
  - Sizes: small (sm), large (lg)
  - Colors: red (r), blue (b)

  Each element in a sequence is a tuple: (shape, size, color). Example element: (circle, large, red) -> "clg r"

  **Literal Reading:** 
  The literal meaning of a sequence is the exact sequence of these tuples. For example, the sequence [clg r, sml b] is a large red circle followed by a small blue square.

  **Slippages:**
  We allow slippages on the attributes:
  1. Slippage on size: ignoring size (so that large and small are considered the same) or considering size relatively (e.g., "small" and "large" become relative terms in the context of the sequence).
  2. Slippage on color: ignoring color, or considering color as a binary attribute that can be flipped (so that red and blue are interchangeable in a pattern).
  3. Slippage on shape: ignoring shape, or allowing shape to change in a pattern (e.g., circle->square->triangle might be seen as a cycle).

  **Permitted Slippages in the Domain:**
  We will design the domain such that there are two types of slippages:
  - Warranted slippage: one that is supported by the structure of the domain (e.g., if the problem context has a pattern that consistently ignores color, then ignoring color is warranted).
  - Ad hoc slippage: one that is not supported by the context but might be forced to get an elegant answer.

  ### Study Design
  We will create a set of analogy problems (A:B :: C:?) in the geometric shapes domain. Each problem will have two potential solutions:
  - One solution that requires a warranted slippage (based on the context of the problem).
  - One solution that requires an ad hoc slippage (but leads to an elegant answer).

  We will then test two hypotheses:
  1. **Answer-driven hypothesis**: The system will choose the solution with the more elegant answer, regardless of whether the slippage is warranted or ad hoc.
  2. **Constraint-based hypothesis**: The system will prefer the solution that uses a warranted slippage, even if the resulting answer is less elegant.

  **Manipulation to seed a different goal**: We will introduce a context (via a prior sequence of problems) that either:
  - Emphasizes the importance of adhering to the domain's structure (constraint-based context), or 
  - Emphasizes the importance of finding an elegant answer (elegance-driven context).

  We can have two groups of participants (if we run a behavioral study) or two conditions in the model.

  **Computational Model**: 
  We will build a simplified model inspired by Copycat (in Python) that operates in the geometric shapes domain. The model will have:
  - A representation of the problem (the sequences A, B, C, and a set of candidate D's).
  - A slipnet-like structure for the domain (with nodes for concepts: shapes, sizes, colors, and links that allow slippages).
  - A workspace where structures are built (e.g., mappings between A and B, then extended to C and D).
  - A temperature-like measure that reflects the system's uncertainty.

  The model must be able to:
  1. Represent the literal structure of the sequences.
  2. Allow slippages on the attributes (size, color, shape) with a cost (initially, all slippages have the same cost).
  3. Build mappings and derive an answer.
  4. Evaluate the answer based on elegance (e.g., simplicity, symmetry) and also (in the constraint-based condition) based on the warrant of the slippage (how well it fits the context).

  We will run the model in two modes:
  - Mode 1 (Constraint-based): The cost of slippage is adjusted by how warranted it is in the context (e.g., if the problem context has a pattern that ignores color, then color slippage has lower cost).
  - Mode 2 (Answer-driven): The cost of slippage is fixed, and the answer is chosen by elegance.

  **Predictions**:
  - If the constraint-based model (Mode 1) can account for human data (if collected) or if it shows a preference for warranted slippages even when the answer is less elegant, that supports the constraint-based hypothesis.
  - If the answer-driven model (Mode 2) accounts for the data (i.e., always picks the most elegant answer) and the constraint-based model does not, that supports the answer-driven hypothesis.

  **Behavioral Study (if budget allows)**:
  We recruit two groups of participants (n=15 each, total 30). Each group is given a set of training problems that seed the context:
  - Group 1 (Constraint-based): Training problems that reward warranted slippages (even if the answer is less elegant).
  - Group 2 (Elegance-driven): Training problems that reward elegant answers (even if the slippage is ad hoc).

  Then, both groups are tested on the same set of critical problems that pit warranted slippage (leading to a less elegant answer) against ad hoc slippage (leading to a more elegant answer).

  **Key dependent variable**: The proportion of participants choosing the warranted-slippage answer vs. the ad-hoc-slippage answer in each group.

  **Prediction under constraint-based hypothesis**: Group 1 (constraint-based training) will choose the warranted-slippage answer more often than Group 2.

  **Prediction under answer-driven hypothesis**: Both groups will choose the elegant answer (ad-hoc slippage) because elegance is the main driver.

  **Null result**: If both groups choose the elegant answer (ad-hoc slippage) equally, that would support the answer-driven hypothesis and suggest that the constraint-based mechanism is not at play (or not strong enough). This would be informative because it would challenge the idea that the system uses answer-independent constraints.

  ### What Fits in One Semester
  - **Doable**:
    - Design and implement the computational model (in Python) for the geometric shapes domain.
    - Create a set of problems (about 20-30) for testing the model.
    - Run simulations with the model in the two modes and analyze the results.
    - If budget allows, design the behavioral study and run it with a small sample (n=30 total). Otherwise, skip the behavioral part and focus on the model.
  - **Not doable**:
    - A large-scale behavioral study (hundreds of participants).
    - Building a full-fledged Copycat-like architecture with all the complexities.
    - Extensive model tuning and validation against multiple domains.

  ### Criteria for Failure
  The project fails if:
  1. The computational model cannot be built in the time frame (e.g., because the domain is too complex or the slippage mechanism is too vague).
  2. The model, when run, does not produce distinct behaviors in the two modes (so we cannot separate the hypotheses).
  3. The behavioral study (if run) has inconclusive results (e.g., high variability, no clear preference in either group) and we cannot interpret the outcome.

  ### Proposal Outline (Three Pages)

  **Page 1: Introduction and Research Question**
  - Background: Analogy-making and the role of conceptual slippage (Copycat).
  - The gap: How do we distinguish warranted vs. ad hoc slippage?
  - Research Question: "Is conceptual slippage guided by answer-independent constraints (warranted by the domain context) or is it driven retrospectively by the elegance of the answer?"
  - Importance: If slippage is purely answer-driven, it challenges the cognitive plausibility of current models.

  **Page 2: Methods**
  - Microdomain: Geometric shapes (primitives, literal reading, slippages).
  - Computational Model: 
    - Architecture (simplified slipnet, workspace, temperature).
    - Two modes of operation (constraint-based vs. answer-driven).
    - How we measure elegance and warrant.
  - Study Design:
    - Critical problems: Each has a warranted-slippage answer and an ad-hoc-slippage answer.
    - Behavioral study (if feasible): Two groups with different training contexts.
    - Predictions for each hypothesis.
  - Analysis: Compare model outputs and (if run) human responses.

  **Page 3: Expected Outcomes, Significance, and Timeline**
  - Expected outcomes: We expect to show either (a) evidence for answer-independent constraints or (b) evidence for answer-driven slippage.
  - Significance: Either outcome advances our understanding of analogy-making.
  - Timeline: 
    - Month 1: Model implementation and problem set creation.
    - Month 2: Model simulations and (if applicable) behavioral study.
    - Month 3: Data analysis and report.
  - Limitations and future work.

  Now, let's write the proposal in the required format (three pages). Since we are not including citations, we'll focus on content.

  ---

  **Research Proposal: The Role of Answer-Independent Constraints in Conceptual Slippage during Analogy-Making**

  **1. Introduction**

  Analogy-making is a core cognitive process, and computational models such as Copycat have provided insights into how humans might solve analogy problems. A key mechanism in these models is "conceptual slippage" — the flexible reinterpreting of concepts (e.g., allowing "a" to be seen as "b" in a particular context) to enable the discovery of a solution. The Copycat model uses a global measure (temperature) to indicate the system's uncertainty, which decreases as the system converges on a solution. However, a critical question remains: does the mechanism have a way to distinguish between a "warranted" slippage (one that is justified by the structure of the domain) and an "ad hoc" slippage (one that is merely convenient for achieving an elegant solution)? 

  The existing literature, focused on letter-string analogy problems (e.g., "abc -> abd, ijk -> ?"), has not resolved this question. In these problems, the intended solution is typically elegant, and the slippage (e.g., treating the letter group as a sequence that can be incremented) is read back as warranted because it leads to that solution. There is no independent test of whether the slippage was driven by the domain's constraints or by the elegance of the answer. This leaves open the possibility that the model is fundamentally answer-driven, which would undermine its claim to model human cognition (as humans can recognize when a slippage is forced).

  This project asks: **Is conceptual slippage guided by answer-independent constraints inherent in the domain, or is it driven by the elegance of the answer, with slippage being read back after the fact?** We will address this by creating a novel microdomain and a computational model that can be run under two competing hypotheses. A null result (no evidence for answer-independent constraints) would be informative, as it would suggest that current models might not capture a key aspect of human analogy-making.

  **2. Methods**

  **2.1. Microdomain: Geometric Shape Sequences**

  We propose a microdomain of sequences of geometric shapes. Each element in a sequence is defined by three attributes:
  - *Shape*: circle (c), square (s), triangle (t).
  - *Size*: small (sm), large (lg).
  - *Color*: red (r), blue (b).

  An example sequence: [c lg r, s sm b] meaning "a large red circle followed by a small blue square".

  The analogy problems are of the form: A : B :: C : ? 
  For instance:
  - A: [c lg r, s sm b]
  - B: [s lg r, t sm b]
  - C: [c sm r, s lg b]
  - ?: ? 

  **Literal reading**: The sequences are compared attribute by attribute in the given order.

  **Permitted slippages**: 
  - *Size slippage*: Ignoring size (so that large and small are considered the same) or considering size relatively (e.g., "change in size").
  - *Color slippage*: Ignoring color or considering color as a pattern (e.g., alternating).
  - *Shape slippage*: Ignoring shape or allowing a systematic change (e.g., next shape in a cycle: circle->square->triangle).

  We design two types of solutions for each problem:
  - *Warranted slippage solution*: A solution that uses a slippage that is consistent with the context (e.g., if the context of A and B shows a pattern that ignores color, then the solution for C should ignore color too).
  - *Ad hoc slippage solution*: A solution that uses a slippage not supported by the context but produces an elegant answer (e.g., a symmetric pattern).

  **2.2. Computational Model**

  We will build a Python model inspired by Copycat. The model includes:
  - A *slipnet*: A network of nodes (concepts: shapes, sizes, colors) with links that allow slippages (e.g., "small" can slip to "large" with a cost).
  - A *workspace*: Where mappings between sequences are built.
  - *Temperature*: A measure of the system's uncertainty (initially high, decreases as the system settles on a solution).

  The model runs in two modes:
  1. *Constraint-based mode*: The cost of a slippage is adjusted by how warranted it is in the context (e.g., if the problem context has a pattern that ignores color, then color slippage has a lower cost).
  2. *Answer-driven mode*: The cost of slippage is fixed, and the answer is chosen solely by elegance (e.g., the solution with the highest symmetry or simplicity).

  **2.3. Study Design**

  We will create 20 critical analogy problems. Each problem has two possible solutions:
  - Solution 1 (warranted slippage): Uses a slippage that is consistent with the context of A and B. This solution may be less elegant (e.g., more complex).
  - Solution 2 (ad hoc slippage): Uses a slippage that is not supported by the context but leads to an elegant answer.

  *Model Simulations*:
  We will run the model (in both modes) on all 20 problems and record which solution it chooses. We predict:
  - Constraint-based mode will prefer Solution 1 (warranted).
  - Answer-driven mode will prefer Solution 2 (elegant).

  *Behavioral Study (if feasible)*:
  We will recruit 30 participants (or skip if budget is limited). Participants are divided into two groups:
  - Group 1 (Constraint-based training): Training problems reward warranted slippages (even if the answer is less elegant).
  - Group 2 (Elegance-driven training): Training problems reward elegant answers (even if the slippage is ad hoc).

  Both groups then solve the 20 critical problems. We measure the proportion of warranted-slippage choices per group.

  *Predictions*:
  - If the constraint-based hypothesis is correct, Group 1 will choose warranted slippages more than Group 2.
  - If the answer-driven hypothesis is correct, both groups will prefer the elegant answer (ad hoc slippage).

  **3. Expected Outcomes and Significance**

  **Expected Outcomes**:
  - We expect to find evidence for one of the two hypotheses. A null result (no difference between groups in the behavioral study and the model in constraint-based mode not showing a preference for warranted slippages) would support the answer-driven hypothesis.

  **Significance**:
  This work will advance our understanding of the cognitive mechanisms of analogy. If we find evidence for answer-independent constraints, it would validate a key aspect of current models. If not, it would call for a reevaluation of these models.

  **Timeline and Feasibility**:
  - Month 1: Model implementation and problem set creation.
  - Month 2: Model simulations and (if applicable) behavioral study.
  - Month 3: Data analysis and report writing.

  **Limitations**:
  - The model is a simplified version of Copycat.
  - The microdomain is artificial, but that allows controlled experimentation.
  - The behavioral study is small (n=30) and may lack power, but it is a pilot.

  **Criteria for Failure**:
  - The model cannot be implemented or does not produce interpretable results.
  - The critical problems do not successfully pit the two hypotheses against each other.
  - The behavioral results are inconclusive (e.g., due to random responding).

  Despite these risks, the project is feasible in one semester and will provide valuable insights.

