  Next, for the dramatic structure: the storm on the heath is key. It mirrors Lear's inner turmoil and the societal collapse. Kepler's astrology could explain this as a celestial influence that amplifies human passions without controlling them. For example, the storm isn't caused by the stars but resonates with the chaos, inclining characters toward madness or revelation. Older astrology might be needed for moments like Gloucester's reading of the eclipses, where characters attribute direct causality, showing their superstition. But overall, the play leans toward Kepler's view because outcomes depend on human choices, like Lear's decision to divide the kingdom.

  For the limits of this reading: in scenes like Gloucester's blinding or Cordelia's return, the play focuses on human cruelty and love, making astrology irrelevant. Edmund's naturalism is compelling in his villainy, and the tragedy emphasizes moral responsibility, which Kepler's hedging can't match. The play's indifference shows in its poetic use of heavens as metaphor, not physics.

  What does the tragedy add? Kepler's treatises are abstract; the play dramatizes the tension between influence and freedom. Lear's suffering forces a confrontation with existence that transcends debate, showing the cost of misreading celestial signs as either all-powerful or meaningless. This highlights the human need for meaning in chaos.

