     The third point: that the success of simplicity rests on an assumption about how the data were produced. In the debrief, we reveal that the true programs were drawn from a distribution that favors short programs. Therefore, betting on short programs was a good idea. But if the data were generated by a process that favors long programs, then it might not work.

