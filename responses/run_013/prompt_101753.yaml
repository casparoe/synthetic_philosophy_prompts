  Below is a complete, runnable in-class activity designed for a 75-minute session. It includes rules, materials, a timeline, debriefing points, potential pitfalls, and limitations. The activity focuses on Occam's razor as a prior over hypotheses, with simplicity defined as program brevity in a minimal language.

  ---

  ### **Activity: Occam's Prediction Game**
  **Objective:** Students experience how short descriptions constrain predictions, why Occam's razor is a "bet" not a guarantee, and how its success depends on assumptions about data generation.

  ---

  ### **Materials & Setup**
  1. **Handout** (1 per team, 4 teams total):  
     - **Machine Language Rules** (tokens in brackets `[ ]`):  
       - `0`: Emits bit `0` (1 token).  
       - `1`: Emits bit `1` (1 token).  
       - `repeat k [X]`: Runs block `X` exactly `k` times. `k` is an integer (1 token), `X` is any valid program. The entire `repeat` instruction counts as **2 tokens + tokens in `X`** (brackets not counted).  
     - **Token Examples**:  
       - `0 1 0 1` → 4 tokens.  
       - `repeat 3 [0 1]` → `repeat` (1) + `3` (1) + `0 1` (2) = 4 tokens.  
       - `repeat 2 [repeat 2 [0]]` → `repeat` (1) + `2` (1) + inner `repeat 2 [0]` (1+1+1=3) = 6 tokens.  
     - **Scoring**: Predict the next 8 bits. Score **1 point/bit** if your prediction matches the true continuation.  
     - **Goal**: Submit the **shortest program** emitting the 12-bit prefix, then predict bits 13–20.  

  2. **Sequences** (pre-generated; display prefixes on slides):  
     - **Round 1**: Prefix = `010101010101`  
       - *True Continuation*: `01010101` (from program `repeat 10 [01]`, 4 tokens).  
     - **Round 2**: Prefix = `101010101010`  
       - *True Continuation*: `10101010` (from program `repeat 10 [10]`, 4 tokens).  
     - **Round 3**: Prefix = `010101010101`  
       - *True Continuation*: `00000000` (from program `repeat 6 [01] repeat 8 [0]`, 7 tokens).  

  3. **True Program Prior** (revealed in debrief):  
     Programs were drawn from a distribution favoring brevity: probability ∝ \(2^{-\text{token length}}\).  

  4. **Team Submission Sheets** (paper or digital):  
     - Program, token count, predicted bits 13–20.  

  5. **Scoreboard** (e.g., whiteboard).  

  ---

  ### **Timeline (75 Minutes)**  
  **0–10 min: Introduction & Rules**  
  - Explain the machine language and token counting (5 min).  
  - Live example: Prefix `010101010101` → Program `repeat 6 [01]` (4 tokens) → Output `010101010101` → Prediction `01010101` for bits 13–20 (5 min).  

  **10–25 min: Round 1**  
  - Show Prefix 1 (`010101010101`).  
  - Teams (4 groups of 4) write a program emitting the prefix and predict next 8 bits (10 min).  
  - **Submission & Scoring** (5 min):  
    - Collect programs/predictions.  
    - Reveal true continuation (`01010101`).  
    - Award points (0–8) per team. Update scoreboard.  

  **25–40 min: Round 2**  
  - Show Prefix 2 (`101010101010`).  
  - Teams work (10 min).  
  - **Submission & Scoring** (5 min): Reveal continuation (`10101010`).  

  **40–55 min: Round 3**  
  - Show Prefix 3 (`010101010101`).  
  - Teams work (10 min).  
  - **Submission & Scoring** (5 min): Reveal continuation (`00000000`).  

  **55–75 min: Debrief**  
  - **Activity Recap** (5 min): Ask teams to share programs/scores.  
  - **Key Insights** (10 min):  
    1. **Short rules pin down continuations**:  
       - Rounds 1 & 2: Short programs (e.g., `repeat 10 [01]`) forced a periodic continuation.  
       - Contrast: A long program like `0 1 0 1 ...` (12 tokens for prefix) + arbitrary 8 bits (e.g., `11111111`) is "flexible" but didn’t win.  
    2. **Occam’s razor is a bet, not a theorem**:  
       - Any 12-bit prefix is compatible with many continuations (e.g., Round 3 prefix works with `repeat 6 [01] repeat 8 [01]` → prediction `01010101`).  
       - Shorter programs *constrain* the future more (e.g., `repeat 6 [01]` requires alternating bits; `repeat 8 [0]` locks in zeros).  
    3. **Success depends on data-generation assumptions**:  
       - We drew true programs from a prior favoring brevity. In Round 3, a short program (`repeat 6 [01] repeat 8 [0]`, 7 tokens) beat a similarly short "periodic" program (8 tokens).  
       - If data came from a complex process (e.g., random), short programs would fail.  
  - **Theory Connections** (5 min):  
    - **Kolmogorov complexity**: Shortest program length ≈ "simplicity." But it’s language-dependent (switching languages changes lengths by a constant).  
    - **Mixture predictor**: Weighting hypotheses by \(2^{-\text{length}}\) ensures you never do *much* worse than the true hypothesis.  
    - **The razor isn’t metaphysical**: It works if the *data-source* favors simplicity.  

  ---

  ### **Predictable Pitfalls & Solutions**  
  1. **Language confusion**:  
     - *Solution*: Use the handout + live example. Clarify that `repeat k [X]` is 2 + tokens in `X`.  
  2. **Teams submit invalid programs**:  
     - *Solution*: Spot-check during work time. If invalid, they fix it or get 0 points.  
  3. **No one submits a "wrong" short program in Round 3**:  
     - *Solution*: Pre-submit an example yourself (e.g., `repeat 6 [01] repeat 8 [01]` → prediction `01010101`).  
  4. **Time crunch**:  
     - *Solution*: Cap program length (e.g., ≤15 tokens). Skip a round if needed.  

  ---

  ### **Limitations & What You Must Explain**  
  1. **Finite hypothesis space**:  
     - Real Kolmogorov complexity uses Turing-complete languages (infinite programs). Here, we use a toy language.  
  2. **Invariance up to a constant**:  
     - Complexity is language-dependent, but switching languages only changes lengths by a fixed constant.  
  3. **Mixture predictors**:  
     - The activity shows "shortest program" (MAP estimation), not Bayesian averaging over programs.  
  4. **No free lunch**:  
     - Emphasize: Simplicity wins *only if* the data-source favors it. If the universe is complex, Occam fails.  

  ---

  ### **Why This Works**  
  - **Discovery-based**: Teams *experience* how short programs constrain futures and how any prefix has multiple explanations.  
  - **Debrief maps to theory**: Each round illustrates a core idea, and the hidden prior clarifies the razor’s dependence on data-generation.  
  - **No lectures needed**: The activity forces confrontation with the key insights.  

  Run this as-is, and your class will grasp Occam's razor as a prior in under 75 minutes!
