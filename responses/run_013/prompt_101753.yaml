     - Time might be tight for the work periods. -> We can be flexible and add a few minutes if needed.

     What the activity cannot reproduce:

     - In real life, the hypothesis space is infinite and we cannot enumerate it. Here, they can try only a few programs.
     - In real life, we don't know the true prior. Here, we revealed it in the debrief.
     - The activity uses a very simple language. In real life, we use Turing-complete languages, and the invariance theorem says that the choice of language only changes the complexity by a constant.

