          A short program: "repeat 10 [10]" -> 4 tokens.

     - Round 3 (45-60 min):
          Prefix: "010101010101"
          true next 8: "00000000"   [from true program: "repeat 6 [01] repeat 8 [0]"]
          Note: we changed the true program for round 3 to: "repeat 6 [01] repeat 8 [0]", which outputs 12+8=20 bits: 01010101010100000000.

     - Debrief (60-75 min):
          Structure the debrief around the three points.

          1. Short rules pin down the continuation: 
                - In round 1 and 2, the short programs you found forced a specific continuation. For example, in round 1, the program "repeat 10 [01]" forces the continuation to be periodic with 01.

          2. The razor is a bet, not a theorem:
                - In round 3, there were programs that fit the prefix but predicted a different continuation. For example, a program that continued with 01010101. The prefix alone does not determine the continuation.

          3. The success of simplicity rests on an assumption about the data-generating process:
                - We revealed that the true programs were drawn from a distribution that favors short programs. That's why betting on short programs worked well in rounds 1 and 2. But in round 3, the true program was not the very shortest possible (someone might have submitted a program of 7 tokens: "repeat 6 [01] repeat 8 [0]" which is correct and shorter than the true program we used to generate? wait, we used that as the true program in round 3 now). 
                - In our setup, the true program for round 3 is 7 tokens. The program that predicted the periodic continuation was 8 tokens and was wrong. So the shortest program won.

           - We also discuss:
                - Description length and Kolmogorov complexity: the length of the shortest program in a fixed language. But note: the language matters. If we change the language, the length might change by a constant. So complexity is relative to the language.
                - The mixture predictor: a weighted average over programs, with weights exponential in the negative length, will not do much worse than the true program.
                - The point about invariance: if you change the language, the complexity changes only by a constant.

     Things that might go wrong:

     - The students might not understand the language. -> Solution: clear handout and example.
     - They might not find any program and get stuck. -> Solution: provide a fallback: the program that lists the prefix and then arbitrary continuation. It will be long.
