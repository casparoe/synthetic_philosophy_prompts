prompt: |-
  I am assembling a specification for a theory of biological function, and I want the desiderata rather than a tour of the literature: what must any adequate account of what it is for a trait to have a function be able to deliver? Treat the two live families — the etiological, selected-effects accounts, on which a trait's function is the effect for which it was selected, and the causal-role accounts, on which a trait's function is the contribution it makes to some capacity of the system that contains it — as candidates to be tested against the list, not as the subject of it. For every requirement you state, give the case or consideration that forces it, and separate the requirements that any account must meet from those that merely encode one camp's prior commitments.

  The list should at least confront the following, and should say for each what it demands of a theory: a trait fixed by drift that now incidentally promotes survival but was never selected for doing so; a novel variant that confers an advantage on its first carriers before selection has had any chance to act; a trait selected for one effect that now reliably produces another; a vestigial organ whose original effect is gone; a trait that is harmful, so that function must be separable from health or proper working; a nearly neutral trait whose contribution to fitness is real but whose persistence is governed by drift rather than selection; two systems whose parts have identical causal roles but different histories, and two whose histories are identical but whose roles differ; and function talk about items with no history of selection at all — a molecule-for-molecule duplicate of an organism that assembles by chance, or a trait in a population with no heritable variation. Say also whether the theory is to cover only evolved biological parts or also artifacts and their components, and what follows either way.

  I most want two things. First, whether some subset of the desiderata is jointly unsatisfiable — in particular whether the demand that function be a matter of selection history can coexist with the demand that functions be ascribable to novel, drift-fixed, or historyless items; if it cannot, say which demand should give way and why. Second, which single requirement eliminates the most otherwise attractive accounts. Close with a short assessment of how the etiological and causal-role families fare against the list, but keep the weight on the criteria themselves.
reasoning: |-
  Okay, the user is asking about what a theory of biological function must be able to explain. They want a list of requirements, not a literature review. They mentioned two main theories: etiological (based on evolutionary history) and causal-role (based on current contributions). But they want to test these theories against specific cases, not focus on the theories themselves.

  The user provided several specific cases that any theory must handle: traits fixed by drift that now help survival, new variants before selection acts, traits with new effects, vestigial organs, harmful traits, nearly neutral traits, systems with same parts but different histories (or vice versa), and entities without selection history. They also want to know if the theory should cover artifacts.

  I need to think about each case and what it demands from a theory. For example, the drift-fixed trait case requires that function isn't just about past selection. The novel variant shows that function can exist before history forms. Vestigial organs mean original function must be distinguishable from current effects. Harmful traits require separating function from benefit.

  The user really wants to know if some requirements conflict, especially whether selection-based functions can coexist with function ascriptions to historyless items. If they can't, I need to decide which demand should give way. They also want to know which requirement is hardest for theories to meet.

  I should list each requirement with the case that forces it and note which are essential versus tied to one theory. Then identify conflicts - probably the history vs ahistoricity conflict is key. The vestigial organ case might be the toughest for many theories. Finally, I'll briefly assess how etiological and causal-role theories fare against the list, but keep the focus on the criteria.
answer: |-
  Here is a specification of desiderata for any adequate theory of biological function, derived from the cases you provided. Each requirement is stated, followed by the case forcing it, and an indication of whether it's a core demand or encodes a prior commitment. Finally, the key conflicts and assessments are addressed.

  ### Core Desiderata (Any Adequate Theory Must Meet These)

  1.  **Ahistoricity Requirement:** Functions must be ascribable to traits *without* a history of selection *for* their current effects.
      *   **Forcing Case:** A trait fixed solely by genetic drift that now incidentally promotes survival/reproduction but was *never* selected for doing so (e.g., a neutral mutation fixing, then an environmental change makes it beneficial). Also covers the "molecule-for-molecule duplicate" and "no heritable variation" cases.
      *   **Demand:** Core. Denying this makes function dependent on contingent evolutionary history in a way that excludes biologically relevant current utility in these cases.

  2.  **Novelty Requirement:** Functions must be ascribable to *novel traits/variants* upon their first appearance, *before* any selection history for their effect has been established.
      *   **Forcing Case:** A novel variant (e.g., mutation, recombination) that confers a survival/reproductive advantage on its *first* carrier(s).
      *   **Demand:** Core. Function talk is biologically meaningful when describing the *advantage* a new variant provides, even absent a history.

  3.  **Vestigiality Requirement:** A trait must be able to *lack* a current function while retaining an ascribable *past* function.
      *   **Forcing Case:** A vestigial organ (e.g., human appendix, whale pelvis) whose original effect is gone and which no longer contributes significantly to fitness.
      *   **Demand:** Core. Captures the distinction between current causal contribution and historical raison d'être.

  4.  **Non-Beneficiary Requirement:** Function ascriptions must be separable from the *beneficial nature* of the effect for the organism or system. Functions can be harmful or maladaptive.
      *   **Forcing Case:** A trait that is harmful to the organism (e.g., a genetic disease allele like Huntington's, a maladaptive behavior).
      *   **Demand:** Core. Function is often attributed to harmful traits (e.g., "the function of this toxin is to paralyze prey" in a predator, even harmful to itself if self-exposed). Separates "function" from "proper working" or "health".

  5.  **Effect Distinction Requirement:** A trait's *current* function must be distinguishable from *other effects* it reliably produces, and a trait's *past* function must be distinguishable from its *current* effects.
      *   **Forcing Case 1:** A trait selected for one effect that now reliably produces another (e.g., feathers selected for thermoregulation now co-opted for flight; the "current effect" is flight, but "past function" was thermoregulation).
      *   **Forcing Case 2:** Vestigial organs (see #3).
      *   **Demand:** Core. A theory must account for functional change over time and distinguish primary functional effects from side-effects or exaptations.

  6.  **Context Sensitivity Requirement:** Function ascriptions must be relativized to a containing system and a capacity or goal-state of that system.
      *   **Forcing Case:** Two systems with parts having identical causal roles but different histories (e.g., homologous vs. analogous structures - bat wing vs. bird wing bones contributing identically to flight capacity now, but with different evolutionary histories).
      *   **Demand:** Core. Function is always "function *for* system S *with respect to* capacity/goal C". This relativization is inherent in function talk.

  7.  **History Sensitivity Requirement:** The functional status of a trait can depend on its history *even when* its current causal role is identical to another trait.
      *   **Forcing Case:** Two systems with identical histories but whose current causal roles differ (e.g., ancestral trait in two descendant lineages; in one lineage it retains its original causal role, in the other it has been co-opted for a new role. History is identical *up to the split*, roles now differ).
      *   **Demand:** Core. History matters for distinguishing original function from novel function or exaptation, even if current mechanisms look similar initially.

  ### Desiderata Encoding Prior Commitments (Not Core, But Important for Specific Frameworks)

  8.  **Fitness Contribution Requirement:** Function ascriptions should be grounded in the trait's contribution to the fitness (survival/reproduction) of the organism *or* the persistence/stability of the containing system at the relevant level.
      *   **Forcing Case:** The nearly neutral trait whose contribution to fitness is real but whose persistence is governed by drift. Also relevant to novelty and drift-fixed beneficial traits.
      *   **Demand:** Prior Commitment (Primarily Etiological). While core desiderata 1, 2, and 4 touch on fitness, this explicitly makes fitness contribution the *basis* for function. Causal-role accounts might ground function in contributions to system capacities *without* requiring a fitness link per se (e.g., in development).

  9.  **Selection History Requirement:** The function of a trait is determined by its history of natural selection.
      *   **Forcing Case:** Used by Etiological theories as foundational. Cases like vestigiality (past selection) and effect distinction (what it was selected *for*) are explained by this.
      *   **Demand:** Prior Commitment (Etiological). Directly conflicts with Core Desiderata 1 (Ahistoricity) and 2 (Novelty).

  ### Scope: Biological vs. Artifactual

  *   **Requirement:** The theory must explicitly state its scope.
  *   **Demand:** Core for clarity. If covering only biological traits, it must explain why artifact function is different (e.g., intentional design vs. natural selection). If covering both, it must provide unified criteria that apply to both domains (e.g., selection history - natural vs. artificial; causal role - contribution to system goal).
  *   **Consequence:** A theory covering both faces challenges explaining vestigiality/harmful traits biologically without conflating them with broken artifacts. A purely biological theory avoids intentionality issues but loses potential generality.

  ### Key Conflicts & Assessments

  1.  **The Fundamental Conflict:** **Selection History Requirement (Etiological Commitment #9) vs. Ahistoricity (#1) and Novelty (#2) Requirements.** These are *jointly unsatisfiable*.
      *   **Resolution:** The **Selection History Requirement must give way**. **Why:** Core Desiderata 1 and 2 are forced by biologically significant cases where function attribution is meaningful and useful *without* a history of selection (drift-fixed benefits, novel advantages). Denying function in these cases renders the concept biologically inert for describing real-time adaptation, novelty, and the potential utility of traits in populations lacking variation or history. History explains *why* a trait exists, but current contribution explains *what it's doing now* that is functionally relevant.

  2.  **The Most Eliminative Requirement:** The **Vestigiality Requirement (#3)** is likely the single toughest requirement that eliminates otherwise attractive accounts.
      *   **Why:** Simple Causal-Role accounts (focusing *only* on current contribution) struggle to ascribe a function to a vestige that does nothing now. Simple Goal-Contribution accounts struggle if the system's "goal" is defined purely contemporaneously (e.g., survival *now*). *Pure* forward-looking accounts (only future effects) fail here. **Any theory must incorporate a notion of functional persistence or historical designation** to handle vestigiality, which forces complexity beyond simple current-contribution or future-contribution models. While the Ahistoricity/Novelty requirements conflict directly with Etiology, Vestigiality challenges the sufficiency of *any* purely ahistorical, contemporaneous account.

  ### Brief Assessment of Etiological and Causal-Role Families

  *   **Etiological (Selected-Effects) Accounts:**
      *   **Strengths:** Excel at Vestigiality (#3), Effect Distinction (#5 - past function), History Sensitivity (#7), Fitness Contribution (#8). Provide a clear explanation for *why* a trait exists.
      *   **Fatal Weakness:** Fail Core Ahistoricity (#1) and Novelty (#2) requirements. Cannot ascribe functions to drift-fixed beneficial traits, novel variants, historyless systems, or traits in populations without heritable variation. Struggle inherently with harmful traits (#4) unless "function" is decoupled from *benefit* in a potentially counterintuitive way (e.g., "selected for harming the organism").

  *   **Causal-Role (Systemic Capacity) Accounts:**
      *   **Strengths:** Excel at Ahistoricity (#1), Novelty (#2), Context Sensitivity (#6), and naturally handle artifacts if system goals are defined. Can potentially handle harmful traits (#4) by relativizing to a system goal (even if harmful to a larger system).
      *   **Weaknesses:** Struggle severely with Vestigiality (#3) and Effect Distinction (#5 - especially past vs. present function). Can struggle with History Sensitivity (#7) - why history matters if current role is identical. Risk being overly liberal (ascribing "functions" to any causally relevant part, like the function of rocks in a stream bed) unless system goals/capacities are carefully constrained (e.g., tying them to fitness or system persistence - #8). Often lack an explanation for *why* the trait is present.

  **Conclusion:** An adequate theory must satisfy the **Core Desiderata (1-7)**. This necessitates incorporating ahistorical function ascription based on current contribution to system capacities/goals (satisfying #1, #2, #4, #6) *while also* incorporating historical elements or designations to handle vestigiality and functional change (#3, #5, #7). This inherently pushes towards a hybrid or pluralist approach, or a systemic account where the relevant "goal" integrates evolutionary design (e.g., survival/reproduction) and allows for historical designation of functional persistence even when contribution ceases. The **Vestigiality Requirement (#3)** remains the most stringent test, demanding that the theory is not purely forward-looking or purely contemporaneous.
