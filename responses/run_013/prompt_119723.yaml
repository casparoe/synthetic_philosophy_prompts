prompt: |-
  You're going to act as a historian of political thought who knows Aquinas's moral and political writings in real detail — not the summary version, the actual arguments and their qualifications. Before you answer, spend a few lines laying out for yourself what his position on killing a tyrant actually comes to, what the moving parts are, and where he hedges; I want to see that groundwork, then the analysis.

  The reason I'm asking: I'm Catholic and I take the natural-law tradition seriously, so I can't just wave this stuff off, and my kid is doing the English Civil War at school this term, so I've been dragged back into 1649. The short version of what happened, since you can't look anything up: Charles I lost the war to Parliament, the army purged the MPs who wanted to negotiate with him, a special court was then set up to try him for treason against the people, he refused to reconize the court's authority, and he was beheaded at the end of January 1649. Then there was a republic, then Cromwell ruling as Lord Protector with the army behind him, and then in 1660 the monarchy came back and the men who had signed the death warrant were hunted down, killed, locked up, or driven abroad.

  What I want is a case analysis, and I want it to run in both directions: 1649 read through Aquinas, and then 1649 turned back on Aquinas.

  First direction. Was Charles a tyrant in Aquinas's sense at all, or is that already the wrong question? Who counted as having the public authority to do something about him — Parliament, the army, the court, the people at large? Does a body that has just purged its own opponents still count? I have a half-memory that when Aquinas does permit killing a tyrant he is mainly talking about a usurper, someone with no right to rule in the first place, and that a king with a sound title who merely rules badly gets a very different answer — if that's right, say so and say exactly why it matters here; if I've got it wrong, correct me. I also have a vague sense that somewhere in this tradition the tyrant gets described as a punishment for the people's sins — Augustine, maybe Aquinas too — which would point toward patience and repentance rather than a scaffold. Tell me whether that's genuinely in Aquinas and how much work it can do here.

  Second direction. He worries that removing a tyrant can leave you with something worse. Do the next eleven years vindicate him, or is that too neat — Cromwell's rule against Charles's, and the fact that the Restoration killed the regicides? And what does the case expose as a gap in his position: he seems to assume a reasonably clean line between public authority and private individuals, and a reasonably clean judgment about what makes someone a tyrant. 1649 has neither. Is that a genuine problem for the theory or just a hard case it was never built to cover?

  Ground rules. The facts above are all you get, so don't wander off into other episodes to compare — stay with this one and squeeze it. Flag which writing of his each claim is coming from only if you're confident; do not invent references, and I don't want a bibliography or a reading list, I want the argument. Don't end on a shrug like "it depends on your interpretive framework" — give me your best reading, with the places you're genuinely unsure about marked as such. And the mapping has to be specific: who is who, what authority each party actually had, what his conditions would require, and whether they were met. Then finish with one short paragraph: which version of Aquinas's position survives this case, and which version doesn't.
reasoning: |-
  Alright, let's tackle this step by step. The user wants a detailed analysis of Aquinas's position on tyrannicide applied to the execution of Charles I in 1649, and then how the events reflect back on Aquinas's theory.

  First, I need to recall Aquinas's actual arguments, not just summaries. He discusses tyranny in two main places: the *Summa Theologica* and *De Regno*. In ST II-II Q.42 A.2, he allows rebellion against a usurper but not against a legitimate ruler who becomes tyrannical. The key distinction here is between a tyrant by practice (who abuses power but has legitimate title) and a tyrant by usurpation (no rightful claim). For the latter, killing isn't sedition; for the former, it's prohibited unless public authority acts. 

  Then there's the caveat in *De Regno*: removing a tyrant might lead to worse outcomes. Also, the idea that tyranny is divine punishment (ST I-II Q.97 A.1 ad 2) suggests patience and repentance. Aquinas emphasizes that only public authority, not private individuals, can act against a legitimate tyrant.

  Now, applying this to 1649. Charles I had legitimate title, so killing him would be sedition unless done by proper authority. Who had that authority? Parliament claimed it, but the army purged dissenting MPs. Aquinas is vague on what constitutes "public authority" when institutions fracture. The purged Parliament's legitimacy is questionable. The court was ad hoc, not a recognized body. So, Aquinas might see this as private usurpation, not lawful action.

  Charles's tyranny is debatable. He ruled without Parliament, but Aquinas might view that as abuse, not loss of legitimacy. The divine punishment angle suggests enduring tyranny as penance. Post-execution, Cromwell's rule and the Restoration's violence support Aquinas's warning about worse consequences. The messy authority lines in 1649 expose gaps in his theory: how to define "public authority" during civil strife and whether procedural legitimacy matters.

  Inverting the analysis, 1649 shows that Aquinas's framework struggles with fractured sovereignty and procedural irregularities. His distinction between usurpers and legitimate rulers holds, but the case reveals ambiguities in identifying valid authority during crises. The outcome partly validates his caution about worse aftermaths, but the Restoration's vengeance complicates it.

  The core of Aquinas's position survives: only public authority can act against tyrants, and usurpers can be killed. But his theory doesn't handle contested authority well. The divine punishment idea remains, but Cromwell's rule challenges the inevitability of worse outcomes. Ultimately, Aquinas's strict conditions weren't met in 1649, making it a hard case that highlights the theory's limitations in real political fractures.
answer: |-
  ### Aquinas's Position on Tyrannicide: Core Framework
  1. **Legitimacy Distinction (ST II-II, Q.42, A.2):**  
     - **Tyrant by Usurpation (no rightful title):** May be killed by *anyone* as an act of just defense of the common good. This is not sedition.  
     - **Tyrant by Practice (legitimate title ruling unjustly):**  
       - **Private individuals** may *never* kill him; this is sedition and mortal sin.  
       - **Public authority** *might* act, but only if:  
         (a) The tyranny is extreme ("intolerable and incurable" per *De Regno*, Ch. 6).  
         (b) Removal is authorized by a body *with standing jurisdiction* (e.g., nobles, representatives of the realm).  
         (c) There is high confidence removal won’t cause greater evils (e.g., civil war, worse tyranny).  

  2. **Hedging and Qualifications:**  
     - **Divine Punishment Angle (ST I-II, Q.97, A.1 ad 2; *De Regno* Ch. 6):** Tyranny may be God’s punishment for societal sin; passive endurance and repentance may be required.  
     - **Procedural Caution (*De Regno*):** Even legitimate authorities must weigh consequences. Removing a tyrant often unleashes chaos ("the tyranny of many").  
     - **No "Right to Revolution":** Aquinas rejects popular uprising; only constituted intermediary bodies (e.g., estates, councils) may act against a titled tyrant.  

  ---

  ### Case Analysis: 1649 through Aquinas  

  **1. Was Charles I a Tyrant?**  
     - **Title:** Undeniably legitimate (hereditary king, coronation oath, 23-year reign). Aquinas *excludes* him from the "usurper" category.  
     - **Tyranny by Practice?** His 11-year Personal Rule (bypassing Parliament), arbitrary taxation, and civil war initiation *might* qualify as "intolerable and incurable" tyranny (*De Regno*). **But:** Aquinas views such judgments as *objective*, not partisan. Royalists denied tyranny; Parliament asserted it. Aquinas offers no clear metric.  

  **2. Who Had Authority to Act?**  
     - **Parliament (Pre-Purge):** Aquinas likely saw medieval estates as legitimate "intermediary authority" (*De Regno*). The *unpurged* Long Parliament (with Royalist members) could claim this role.  
     - **The Purged Parliament ("Rump"):** Aquinas would question its legitimacy. Purging dissenters (Dec 1648) makes it a faction, not the realm’s representative body. *This is critical:* A self-selected group lacks "public authority" status.  
     - **The Army:** Never a constituted political body. Aquinas would deem its role seditious.  
     - **The High Court of Justice:** An ad hoc tribunal created by the Rump. Aquinas rejects vigilante justice; authority must pre-exist.  

  **3. Divine Punishment and Patience**  
     - Aquinas’s warning (*De Regno*, ST I-II Q.97) applies: Civil war itself could signify divine chastisement. Killing Charles might compound sin, not rectify it. Endurance and prayer are the safer path.  

  **Verdict (Aquinas on 1649):**  
  Charles’s execution violates core Thomistic principles:  
  - A **legitimately titled ruler** was killed.  
  - The act was orchestrated by **factions without clear public authority** (purged Parliament, army, novel court).  
  - Private judgment (**Cromwell**, Ireton) overrode due process.  
  - Aquinas would deem this **sedition**, not lawful tyrannicide. The usurper/tyrant distinction collapses here to condemn the regicides.  

  ---

  ### 1649 Turned Back on Aquinas  

  **1. "Worse Consequences" Vindicated?**  
     - **Cromwell vs. Charles:** Cromwell’s rule (1649-58) featured harsh military governance, colonial atrocities (Ireland), and sectarian suppression. Arguably *more* oppressive than Charles’s "tyranny."  
     - **The Restoration:** Regicides executed (1660-62); monarchy restored with enhanced absolutism under Charles II. Chaos followed by reactionary violence.  
     - **Aquinas’s Warning Upheld:** Removing Charles *did* unleash "the tyranny of many" (army rule) and worse retribution. The case empirically supports his caution.  

  **2. Gaps in Aquinas Exposed:**  
     - **Authority in Crisis:** When institutions fracture (King vs. Parliament), who is "public authority"? Aquinas assumes stable intermediaries – **1649 shows this is naive**. The Rump claimed continuity; Royalists denied it. Aquinas provides no test.  
     - **Defining Tyranny:** Charles’s "tyranny" was contested. Royalists saw Parliament as rebels; Parliament saw Charles as traitor to "the people." Aquinas offers **no objective standard** amid ideological rupture.  
     - **Procedural Legitimacy:** Aquinas ignores *how* authority acts. The regicides used a trial (however flawed) to assert legality. Is a lawful *form* sufficient, or must authority be *substantively* representative? Aquinas is silent.  

  **3. The Usurper/Tyrant Distinction Strained:**  
     - Parliament framed Charles as a *usurper of the people’s trust*, voiding his title. Aquinas’s binary (lawful title vs. naked usurpation) **fails to address rulers who betray foundational laws**. Natural law might support resistance, but Aquinas’s schema is too rigid for constitutional crises.  

  ---

  ### Final Assessment: What Survives, What Fails  

  **Survives Aquinas:**  
  - The core prohibition: **Private individuals cannot kill a titled ruler**. The regicides (officers, MPs) claimed public roles, but their authority was fatally compromised.  
  - The **usurper exception**: Irrelevant here, but intact.  
  - The **cautionary principle**: Removing tyrants risks disaster – validated by the Protectorate and Restoration vengeance.  
  - **Tyranny as divine punishment**: Endurance remains the *safer* path; 1649-60 shows why.  

  **Fails or Needs Revision:**  
  - **Authority Identification**: Aquinas’s theory **collapses when institutions disintegrate**. He assumes coherent "public authority" – 1649 proves this illusory.  
  - **Tyranny Definition**: His framework **cannot resolve contested sovereignty**. If king and parliament both claim legitimacy, natural law offers no adjudicative tool.  
  - **Proceduralism**: The use of a trial (however flawed) challenges Aquinas. If a *formally constituted* body condemns a king, is it valid? Aquinas prioritizes authority’s *source*, not its *process*.  

  **Enduring Thomistic Lesson:**  
  1649 confirms Aquinas’s deepest fear: extralegal removal of a titled ruler, even a tyrant, unleashes moral and political chaos. The regicides violated his strict conditions – and the aftermath vindicated his warning. Yet the case exposes his theory’s inadequacy in revolutions where authority itself is the battleground. The *principle* of public action against tyranny survives; the *mechanism* for identifying lawful authority in crisis does not.
