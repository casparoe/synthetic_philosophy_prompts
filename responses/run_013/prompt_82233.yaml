answer: |-
  ### The View, Restated
  Your package combines expressivism (moral sentences express practical states, not propositions), a solution to Frege-Geach (embedded moral predicates *characterize* rather than *express* attitudes, enabling truth-apt compositional semantics), and a non-truth-preserving account of validity (coherence in attitude combinations). Moral sentences are "true" when endorsing the relevant state. This retains expressivism’s core (attitudes fix meaning) while handling embedding and logic by repurposing moral language in inferences as tracking relations between prescribed states.

  ---

  ### Defeaters, Ranked

  #### Fatal Defeaters
  1.  **Part 2 Converts the View into Descriptivism (Attacks Part 2 primarily, implications for Part 1):**
      *   **Problem:** If "wrong" in "If lying is wrong..." *characterizes* the state of disapproval (treating it as an object of description/reference), not *expresses* it, then moral terms in embedded contexts function like *descriptions of psychological states*. This collapses into a form of **psychologistic descriptivism** (moral sentences describe the speaker's/normative community's attitudes). This fatally undermines Part 1's core expressivist claim that meaning *is fixed by expression*. The semantic job in embedded contexts *is* to stand for a proposition (about attitudes).
      *   **Why Fatal:** Expressivism dies if moral language, even in core logical operations, primarily *describes* attitudes rather than *expresses* them. Your "characterize" move solves Geach by abandoning pure expressivism for a hybrid or outright descriptivist semantics.

  #### Serious Defeaters
  2.  **Failure to Distinguish Negation, Absence, and Withholding (Attacks Part 3 primarily, implications for Part 1):**
      *   **Problem:** Part 3 defines validity as coherence: no way to hold premise attitudes without conclusion attitude. But what *is* "holding" the attitude expressed by "Lying is not wrong"?
          *   Is it *forbearance* (absence of disapproval of lying)?
          *   Is it *tolerance* (a positive attitude of non-disapproval)?
          *   Is it *prohibition of disapproval* (disapproving of disapproving of lying)?
      *   **Consequence:** If "not wrong" is mere absence (forbearance), then "Lying is wrong" and "Lying is not wrong" are *not* genuine contradictories. One can coherently hold *neither* attitude (withhold judgment) without violating any logical constraint. Your validity criterion struggles to explain why withholding judgment on P is compatible with any premise set not containing P or ~P. If "not wrong" is tolerance or prohibition, you need an independent, non-question-begging account of these distinct states and why *they* are the required "negation" state. Failure here cripples Part 3's logic.

  3.  **The Problem of "Creeping Minimalism" (Attacks the whole package, especially "thin truth"):**
      *   **Problem:** By granting that moral sentences are truth-apt (via characterization in embeddings) and defining validity non-trivially (via coherence), your view converges *structurally* with sophisticated forms of **cognitivist realism** or **quasi-realism**. The "thin truth" concession, combined with Part 2, makes the *semantic behavior* of moral language indistinguishable from descriptive language. Your "expressivism" risks being merely a story about the *psychological origin* of moral commitments, not a distinct *semantic thesis*. This undermines the motivation for the package as a *rival* to descriptivism.

  #### Merely Awkward Defeaters
  4.  **Lack of Novel Predictions / Stipulative Nature (Attacks the whole package):**
      *   **Problem:** The package feels highly stipulative: "characterize" instead of "express" in embeddings, "coherence" defined over stipulated attitude-states, "thin truth" granted. Does it *predict* anything distinctive about moral discourse, logic, or psychology that rivals (e.g., realism, error theory, other expressivisms) don't? Or is it primarily an *ad hoc* construction to avoid Frege-Geach? Without novel predictions or explanations, it lacks clear theoretical advantage over competitors.
  5.  **The Problem of Attitude Individuation (Attacks Part 1 & 3):**
      *   **Problem:** Part 3 relies on clearly individuated "attitudes" (disapproval-of-lying, disapproval-of-cheating). But how fine-grained are these states? Is disapproving of lying *in general* the same state as disapproving of *this specific lie*? Is the state expressed by "Lying is wrong" identical to the state "characterized" in embeddings? Blurriness here threatens the coherence-based validity criterion.

  ---

  ### What a Defender Should Concede
  A defender *must* concede that **Part 2 fundamentally alters the semantic picture, moving decisively towards descriptivism/hybridism.** The "characterization" move isn't a minor tweak; it redefines the semantic function of moral predicates in the very contexts (embedding, logic) that were problematic for pure expression. This is a significant cost for expressivism. Concede that the view is likely best understood as a **sophisticated hybrid expressivism** or **quasi-realist project**, not pure non-descriptivism.

  Concede that **distinguishing negation, absence, and withholding within the attitude-state framework (Part 3) is deeply challenging and requires substantial, non-stipulative development.** The defender needs a robust theory of the "logical structure" of conative states, explaining why one specific conative state (e.g., tolerance? meta-disapproval?) counts as the *negation* of disapproval, and how withholding differs systematically.

  Concede that **"thin truth" does heavy lifting and risks collapsing the distinction with cognitivism.** The defender must clearly articulate what substantive work "expression" still does *after* conceding truth-aptness and a descriptivist-like semantics for embeddings.

  *Do not* wave away the descriptivist implications of Part 2. *Do not* pretend the negation/withholding problem is trivial. *Do not* claim the view makes novel predictions without evidence.

  ---

  ### Immunity Check
  The view *has* bought survival through significant qualification:
  1.  **Retreat on Expression:** It surrendered the pure expressivist claim that moral language *always* functions to express non-cognitive states. In embedded contexts, it *characterizes* (describes) them.
  2.  **Retreat on Truth:** It adopted minimalism about truth, sacrificing any distinctively expressivist account of moral truth.
  3.  **Reconception of Logic:** It abandoned truth-preservation as the core of validity, replacing it with coherence-over-attitudes.

  **Immunity Achieved?** Against the *letter* of the original Frege-Geach challenge (how can non-truth-apt expressions feature in truth-conditional logic?), yes – by making moral sentences truth-apt via characterization. Against the *spirit* (can expressivism handle logic without collapsing?), arguably not. It survives by conceding that moral language must adopt descriptivist *semantic functions* within logic, fundamentally qualifying expressivism's core semantic claim. Its "immunity" relies on a strategic retreat to hybrid territory.

  ---

  ### Verdict
  The package is ingenious but **fatally compromised as pure expressivism.** Part 2's embedding solution necessitates a descriptivist semantics, undermining Part 1. Part 3 struggles seriously with negation and withholding. While offering a coherent formal structure (qualifying as "expressivism" only in a highly attenuated, quasi-realist sense), it survives Frege-Geach by sacrificing the view's defining non-descriptivist semantic thesis. **Fatal defeat via descriptivist conversion.**
