prompt: |-
  I teach a ninety-minute upper-level seminar in formal epistemology to twelve students who are comfortable with credences and conditionalization but who have only ever met van Fraassen's reflection principle as a one-line formula: your present credence in a proposition ought already to equal your expectation of the credence you will hold in it later, at least when the later credence is one you expect to arrive at without any cognitive failure on your part. On the page it looks either vacuously true or plainly false, and neither reaction is the one I want. I want them to feel the pull of the principle from the inside — to be put in a position where deferring to their own future judgment seems obviously right, and then to watch that obviousness come apart in cases involving self-doubt, foreseeable forgetting, or a future self they know will be compromised — before we ever argue about whether the principle is a coherence constraint or a substantive claim about trusting oneself. Design a runnable activity for this group and this time slot. I am happy to use an urn, a deck, a set of sealed envelopes, or a small prediction market with play money, but the payoffs must not require real stakes, and the students should construct the relevant credences themselves rather than being handed numbers. Specify the rules, the materials, a timeline that fits ninety minutes including the debrief, and any roles I need to assign. The idea should show up in what happens rather than in what I say afterwards: I want the structure of the activity to push them into the reflection-respecting move, then into a variant where the same move is clearly the wrong one, so that the debrief has something to point back to. In the debrief, map the moments of the activity onto the parts of the idea — the expectation formula itself, the Dutch-book-style case for the principle, the self-doubt case in which an agent is unsure what she will later think, and the case in which she expects her later self to be irrational, distracted, or to have lost relevant information — and tell me honestly which feature of the principle the activity cannot reproduce and which I will therefore have to supply in exposition. Also tell me what will predictably go wrong the first time I run it and how to handle that, since I would rather hear it now than discover it in front of the class. If the activity as I have imagined it cannot actually make the principle feel forceful — if the setup collapses into a trivial arithmetic exercise, or if the rules guarantee by construction that the reflective credence is always the right one, so that the students learn nothing they did not already assume — then say so plainly and tell me what to change, rather than handing me a polished lesson plan that flatters the premise.
reasoning: |-
  We are going to design an activity that makes van Fraassen's reflection principle feel intuitive and then problematizes it. The principle states that your current credence in A should equal your expectation of your future credence in A, provided that you expect to update without cognitive failure.

   We will use two scenarios:
   Scenario 1: A straightforward case where reflection seems obviously right.
   Scenario 2: A case where the future self is compromised (e.g., by forgetting) and reflection seems wrong.

   We will use an urn with balls of two colors (say, red and blue) and two possible urns (Urn A and Urn B). The twist in the second scenario is that the student will forget some information.

   Materials:
     - Two urns (or two containers that can be hidden): 
          Urn A: 3 red, 1 blue
          Urn B: 1 red, 3 blue
     - A deck of cards to simulate the forgetting scenario (if needed) OR sealed envelopes for the two scenarios.
     - Play money for payoffs (if we use a market) but without real stakes.

   However, to avoid real stakes, we can use a scoring rule that is hypothetical. We want students to construct their own credences and then see the consequences.

   Alternative: We can use a quadratic scoring rule with play money that they can convert into participation points or just for bragging rights. But note: the problem says payoffs must not require real stakes, so we can use play money and not worry about real loss.

   Activity Structure:

   Part 1: Reflection in a straightforward case (40 minutes)

     Step 1: Setup (5 minutes)
       - Explain the two urns: Urn A (3 red, 1 blue) and Urn B (1 red, 3 blue).
       - We will flip a fair coin to choose the urn. So the prior probability for each urn is 0.5.
       - We are going to draw two balls from the chosen urn with replacement (so each draw is independent). But note: the coin flip is hidden so students don't know which urn.

     Step 2: First prediction (10 minutes)
       - Students are asked to record their credence (as a probability) that the first ball drawn will be red. 
          Since they don't know the urn, they should reason:
            P(red) = P(red|A)*P(A) + P(red|B)*P(B) = (3/4)*(1/2) + (1/4)*(1/2) = (3/8 + 1/8) = 4/8 = 0.5.

          But note: we are going to do two draws. We are interested in the first draw and then the second.

       - Now, we draw the first ball (let's say it's red). We show it to the students.

       - Update: The students now update their credence about which urn was chosen.
          P(A|first red) = [P(first red|A)*P(A)] / P(first red) = [(3/4)*(1/2)] / (1/2) = (3/8)/(4/8)= 3/4.
          So now they think with probability 3/4 that it's Urn A.

       - Now, what is their credence that the second ball will be red?
          They condition on the urn: 
            If Urn A: P(second red | A) = 3/4
            If Urn B: P(second red | B) = 1/4
          So P(second red | first red) = (3/4)*(3/4) + (1/4)*(1/4) = 9/16 + 1/16 = 10/16 = 5/8.

     Step 3: Introduce the reflection principle (10 minutes)
       - Now, we ask the students: What do you think your credence for the second ball being red will be AFTER you see the first ball? 
          They have just calculated it: 5/8.

       - But note: before seeing the first ball, they had a credence for the second ball being red. At that time, they should have set it to the expectation of their future credence.

          How to compute that expectation at time 0?
            There are two possibilities for the first ball: red or blue.

            If first ball is red (which happens with probability 0.5): then future credence in second red is 5/8.
            If first ball is blue: 
              Then P(A|first blue) = [P(blue|A)*P(A)] / P(blue) = [(1/4)*(1/2)] / (1/2) = (1/8)/(4/8)= 1/4.
              Then P(second red | first blue) = (3/4)*(1/4) + (1/4)*(3/4) = 3/16 + 3/16 = 6/16 = 3/8.

            So at time 0, the expectation of the future credence in the second ball being red is:
              (0.5) * (5/8) + (0.5) * (3/8) = (5/16 + 3/16) = 8/16 = 0.5.

          And note: at time 0, the prior for the second ball being red was also 0.5.

          So reflection holds: current credence (0.5) equals expectation of future credence (0.5).

       - We can have the students compute this without giving them the numbers. They should see that at time 0, the expectation of their future credence for the second draw (after seeing the first) is the same as their current credence for the second draw.

     Step 4: Run the first scenario (15 minutes)
       - Actually flip the coin to choose the urn (but don't reveal which urn) and draw the first ball (reveal it).
       - Then have the students update and record their new credence for the second draw (which we just computed as 5/8 if red, 3/8 if blue).
       - Then draw the second ball and see what happens. (This is just for fun, because the point is the credence setting.)

       - Now, we point out that at the beginning, they set a credence for the second draw that was the same as the expectation of what they would set after the first draw. And that seems right.

   Part 2: Reflection in a compromised future self (forgetting) (35 minutes)

     Step 1: Setup (5 minutes)
       - Same urns and coin flip. But now we add a twist: after the first draw, the students will be told the color of the first ball, but then they will be given a drug that makes them forget the outcome of the coin flip (the urn type) but remember the first ball's color? Or we can design a different kind of forgetting.

       Alternative (to avoid the drug story): We tell them that after the first draw, they will be told the color of the first ball, but then they will be distracted and forget which urn was chosen (but remember the setup and the first ball). However, note: they never knew the urn to begin with. So we need a different setup.

     Revised idea for Part 2:
       - We are going to draw two balls again. But after the first draw, we will not reveal the color of the first ball to the students. Instead, we will put it back and then draw a second ball. But then we tell the students that after the two draws, they will be told the outcome of the first draw. However, they will not be told the outcome of the second draw until after they have to make a prediction about a third draw? That might get too complicated.

     Better idea (using sealed envelopes and a memory lapse):
       - We do the same as Part 1: flip a coin for the urn, then draw the first ball and show it. Then we tell the students that they will be given a sealed envelope that contains the result of the coin flip (which urn was chosen). But they cannot open it until after they have made their prediction for the second draw. However, they will forget the first ball's color? This is tricky.

     Another idea: 
       - We have two stages. In the first stage, we choose the urn and draw the first ball. We record the first ball's color and then put it back (so the urn is the same for the second draw). But then we tell the students that when they are about to predict the second ball, they will have forgotten the first ball's color. However, they will be told that the first ball was drawn and that it was either red or blue, but not which. And they will also be told that they had updated their credence about the urn based on that first ball, but they won't remember the update.

       How about: 
          At time 0: coin is flipped, urn chosen (hidden). First ball drawn and shown to students. They update their credence for the urn and for the second ball.
          Then, we take away the first ball and tell them they have forgotten the color of the first ball. But they do remember that they saw a first ball and that they updated. However, they don't remember what it was. Now, we ask for their credence about the second ball.

          But note: without the color, they are back to the prior. So their credence for the second ball would be 0.5? That might be too straightforward.

     Another approach: We use a deck of cards to simulate the forgetting.

     Let me propose this:

       We have two stages:

          Stage 1: 
            - Flip a coin to choose the urn (hidden).
            - Draw the first ball and show it to the students. They update.
            - Then, we take the first ball and put it in an envelope without letting them see it again. We tell them that they will be asked about the second ball but they won't be allowed to look at the first ball again. However, they are allowed to write down their updated credence for the urn (or for the second ball) at this moment? But that's not forgetting.

     Instead, we can do:

          We tell the students: "After you see the first ball, we will ask you to make a prediction for the second ball. But then, we will ask you to make the same prediction again after some time has passed and you have forgotten the first ball's color. However, you will remember that you saw a ball and that it made you update your credence about the urn, but you won't remember what color it was."

          Then, at the time of the second prediction (after forgetting), what should their credence be?

          They know:
            - They saw either red or blue. 
            - They know the update rule: if red, then P(A) becomes 3/4; if blue, then P(A) becomes 1/4.
            - But they don't know which. And they know that at the time they saw the ball, they updated appropriately.

          However, they don't remember the color. So they are uncertain about what their updated credence was. But note: they do remember that they updated. So they are in a state of self-doubt? Not exactly, they just lack the information.

          What is their credence at the forgetting time for the urn being A?
            They know that if they had seen red (which had prior probability 0.5), they would have P(A)=3/4.
            If they had seen blue (prior probability 0.5), they would have P(A)=1/4.

            So their current credence for the urn being A is the same as at time 0? 
            Because they are now in a state where they have to average over the two possibilities:

              P(A) = P(A|saw red)*P(saw red) + P(A|saw blue)*P(saw blue)
                    = (3/4)*(1/2) + (1/4)*(1/2) = (3/8 + 1/8) = 4/8 = 0.5.

          Therefore, their credence for the second ball being red is again 0.5.

          Now, the reflection principle would say that at the time they had just seen the first ball (and before forgetting), their credence for the second ball being red (say, 5/8 if they saw red) should equal their expectation at that time of what their credence would be after forgetting? 

            At the time of having seen the first ball (say red), they know that they will forget the color. So they expect that after forgetting, they will have a credence of 0.5 for the second ball being red.

            But at the time of having seen red, their credence is 5/8, which is not 0.5.

          Therefore, if they were to set their current credence (5/8) to the expectation of their future credence after forgetting, they would set it to 0.5. But that would be wrong because they currently have evidence (the red ball) that the urn is likely A and hence the next ball is likely red.

          So reflection fails in this case? Actually, van Fraassen's principle has an exception: when the future self is compromised (by forgetting). So we want to show that in this case, they should not defer to their future self.

     Step 2: Run the scenario (15 minutes)
          - Flip the coin to choose the urn (hidden).
          - Draw the first ball and show it (say, red). 
          - Ask the students to record their current credence for the second ball being red (they should say 5/8).
          - Then tell them: "Now, imagine that after this, you will forget the color of this first ball. But you will remember that you saw a ball and that you updated. What do you expect your credence for the second ball to be after you forget?"
            They should compute: after forgetting, they will have a credence of 0.5 for the second ball being red? 
          - Then ask: "So should you now set your credence to 0.5 because that's what you expect your future self to believe?" 
            They should say no, because they currently have evidence that the urn is A and that the next ball is more likely red.

          - Then, to drive the point home, we can ask them to compute: at the moment they have just seen the red ball, what is their expectation of their future credence (after forgetting) for the second ball being red?
            They know that after forgetting, their credence will be 0.5 regardless of what they saw. So their expectation is 0.5.

            But their current credence is 5/8, which is not 0.5. So they see that reflection fails.

          - We then do the same if the first ball had been blue: current credence would be 3/8, and future credence after forgetting would be 0.5.

     Step 3: Compare the two scenarios (5 minutes)
          - In the first scenario, they expected to remember the first ball when making the second prediction, so they set their prior for the second ball to the expectation of their future (well-informed) credence.
          - In the second scenario, they expect to forget, so they do not set their current credence to the expectation of their future (poorly informed) credence.

   Part 3: Debrief (15 minutes)

     Map the activity to the principle:

       - The formula: 
            Current credence in A = E[ future credence in A ]

          In Part 1: 
            Let A be "second ball is red". 
            At time 0: P(A) = 0.5.
            E[ future credence in A ] = 0.5, so it holds.

          In Part 2 (at the moment after seeing the first ball, say red):
            Current credence in A (second ball red) is 5/8.
            E[ future credence in A (after forgetting) ] = 0.5, so it does not hold.

       - The Dutch-book argument: 
            We didn't run a Dutch book, but we can mention that if you violate reflection, you can be Dutch-booked. We didn't do that in the activity, so we may have to explain it briefly in the debrief.

       - Self-doubt: 
            In Part 2, the future self has lost information. This is a case of cognitive compromise (forgetting) and therefore the principle does not apply.

     What the activity cannot reproduce:

          We did not have a case where the agent is unsure about what she will later think (but without forgetting). We had a case of forgetting, which is a clear compromise. But we did not have a case of self-doubt in the sense of being unsure about how she will update (for reasons other than forgetting). For example, if the agent thinks she might make a mistake in updating, then even without forgetting she might not want to defer. Our activity doesn't cover that.

          We also did not cover a case where the future self is expected to be irrational. We covered forgetting (a loss of information) but not irrationality.

          Therefore, in exposition, we will have to:

            - Explain that the principle assumes that the future update is rational and with the same information (or more). 
            - Also, we did not have a case of the agent being unsure about what her future credence will be (without forgetting). In Part 1, the agent knew exactly what her future credence would be conditional on the first draw. But what if she is uncertain about how she will update? The principle requires her to take an expectation over the possible future credences. Our Part 1 was a simple case with two possible future credences.

     Predictable problems and how to handle them:

          Problem 1: The students might not compute the probabilities correctly.

            Solution: Have a worksheet that guides them through the calculations. Do a sample calculation together for Part 1.

          Problem 2: In Part 2, the forgetting scenario might be confusing.

            Solution: Explain the forgetting scenario very clearly: "You have seen the first ball, but then you forget its color. However, you remember that you saw a ball and that you updated your beliefs appropriately. But you don't remember the color, so you don't know which update you did."

          Problem 3: The activity might take longer than planned.

            Solution: Keep strict time. For Part 1, if the first draw is red, then focus on that. Don't do both red and blue. Similarly in Part 2, do one color.

          Problem 4: The students might not see the connection to the reflection principle in Part 1.

            Solution: In the debrief, explicitly write the formula and show the numbers.

          Problem 5: In Part 2, the students might think that the current self should set the credence to 0.5 because that's what they expect the future self to have, even though they have more information now.

            We hope that the activity will make it clear that they should not. But if not, we can ask: "Would you ignore the red ball you just saw and set your credence to 0.5? Why not?"

     Timeline:

       0-5 min: Introduction and setup of urns and draws.

       Part 1:
          5-15 min: Students compute prior for second draw (0.5) and then we draw the first ball (say red).
          15-25 min: Students update to get P(second red | first red) = 5/8.
          25-30 min: We ask them to compute at time 0 the expectation of their future credence for the second draw (which is 0.5) and note it matches the prior.
          30-40 min: We draw the second ball (just to complete, but not necessary). Then we set up Part 2.

       Part 2:
          40-45 min: Explain the forgetting scenario. We have the same setup: we've seen the first ball (red) and we have updated to 5/8 for the second ball.
          45-55 min: Now, we tell them they will forget the color of the first ball. What will their credence be after forgetting? (0.5) 
          55-60 min: We ask: "At the moment you have the red ball in view, what is your expectation of your future credence after forgetting?" (0.5) 
          60-65 min: Compare: your current credence is 5/8 but your expectation of your future credence is 0.5. Should you set your current credence to 0.5? Why not?

       Debrief:
          65-80 min: Map the two parts to the principle. Discuss the exceptions.

     Roles:

          - The instructor flips the coin and draws the balls.
          - The students work in groups of 3-4 (so 3-4 groups) to compute the probabilities. Then we discuss as a class.

     Materials:

          - Two urns: one with 3 red and 1 blue, the other with 1 red and 3 blue.
          - A fair coin.
          - A container with the balls (or use marbles or colored beads). Make sure to have enough for the draws.

     Note: We are not using play money for bets because of time and complexity. Instead, we are focusing on the credences and the principle.

     If we have time, we can add a third part with a Dutch book? But 90 minutes is tight.

     Alternatively, we can have a very brief Dutch book illustration:

          In Part 1: 
            At time 0, the agent's credence for the second ball being red is 0.5.
            But she expects that after the first draw, her credence will be either 5/8 or 3/8. 
            Suppose she is offered a bet at time 0 that pays $1 if the second ball is red and $0 otherwise. She would be willing to pay up to $0.50 for it.
            Now, after the first draw (say red), she would be willing to pay up to $0.625 for the same bet. 
            If she violates reflection and sets her time-0 credence to something other than the expectation of her time-1 credence, she might accept a set of bets that lead to a sure loss.

          We don't have time to run a full Dutch book, but we can mention it.

     Final note: The activity does make the principle feel forceful in the first part and then shows a clear exception in the second part. However, the activity does not cover all the nuances (like self-doubt without forgetting). We will have to cover those in exposition.

     Let me know if you need any adjustments.
answer: |-
  ### Activity Design: Experiencing Reflection and Its Limits  
  **Goal:** Create an intuitive grasp of van Fraassen's reflection principle through lived experience, followed by a breakdown in cases of cognitive compromise.  

  ---

  #### **Materials**  
  - **Two urns:**  
    - Urn A: 3 red balls, 1 blue ball.  
    - Urn B: 1 red ball, 3 blue balls.  
  - **Coin** (fair) to select the urn.  
  - **Sealed envelopes** (12) containing instructions for Part 2.  
  - **Worksheets** for students to calculate and record credences.  
  - **Timer** for activity phases.  

  ---

  ### **Rules and Timeline (90 Minutes Total)**  

  #### **Part 1: Reflection Feels Right (35 mins)**  
  *Setup: Students experience rational updating with full information.*  

  1. **Introduction (5 mins)**  
     - Explain: "We’ll draw two balls from an urn. The urn is chosen by a coin flip: Heads → Urn A (3 red, 1 blue); Tails → Urn B (1 red, 3 blue). You’ll predict the second draw *before* seeing the first, then update *after* seeing it."  

  2. **Initial Credence for Second Draw (10 mins)**  
     - *Task:* Calculate prior credence that the **second ball is red**.  
     - *Guiding Q:* "Without knowing the urn or first draw, what’s your credence for the second ball being red?"  
     - *Math:*  
       - `P(second red) = P(Heads) × P(red|A) + P(Tails) × P(red|B) = (0.5)(3/4) + (0.5)(1/4) = 0.5`.  
     - *Instructor:* Flip coin (hidden), select urn. Draw first ball but **don’t reveal yet**.  

  3. **Future Credence & Reflection (15 mins)**  
     - *Task 1:* "Suppose the first ball is **red**. What will be your *updated* credence for the second ball being red?"  
       - *Math:*  
         - `P(Heads|first red) = [P(first red|Heads) × P(Heads)] / P(first red) = [(3/4)(0.5)] / 0.5 = 3/4`.  
         - `P(second red | first red) = (3/4)(3/4) + (1/4)(1/4) = 5/8`.  
     - *Task 2:* "Suppose the first ball is **blue**. What will be your updated credence?"  
       - `P(second red | first blue) = (1/4)(3/4) + (3/4)(1/4) = 3/8`.  
     - *Task 3:* "Now compute your *current expectation* of your future credence for the second ball being red:  
       - `(P(first red) × future credence if red) + (P(first blue) × future credence if blue) = (0.5)(5/8) + (0.5)(3/8) = 0.5`."  
     - **Key Insight:** Initial credence (0.5) = Expectation of future credence (0.5). Reflection holds!  

  4. **Reveal and Confirm (5 mins)**  
     - Reveal first ball (e.g., red). Students update credence for second draw to 5/8.  
     - Draw second ball (for fun, but not critical).  

  ---

  #### **Part 2: Reflection Fails Under Forgetting (40 mins)**  
  *Setup: Students expect to forget key information, breaking reflection.*  

  1. **Twist Introduction (5 mins)**  
     - Distribute sealed envelopes. "After seeing the first ball, you’ll take a ‘memory-erasing pill’—you’ll forget the first ball’s color *but remember* it was drawn and that you updated."  

  2. **Post-Forgetting Credence (15 mins)**  
     - *Task:* "You saw the first ball (e.g., red) and calculated P(second red) = 5/8. **After forgetting the color**, what’s your credence for the second ball being red?"  
     - *Guiding Q:* "You know you saw red *or* blue, but not which. Compute your credence *now*."  
       - `P(second red) = P(saw red) × P(second red | saw red) + P(saw blue) × P(second red | saw blue) = (0.5)(5/8) + (0.5)(3/8) = 0.5`.  
     - Students open envelopes confirming: "Your future self will have credence 0.5."  

  3. **Conflict and Reflection Breakdown (15 mins)**  
     - *Task 1:* "At this moment (seeing red), your credence for the second red is 5/8. What do you expect your *future credence* to be after forgetting?" (Answer: 0.5).  
     - *Task 2:* "Should you set your *current* credence to 0.5 to match your future self? Why or why not?"  
     - **Key Insight:**  
       - Current credence (5/8) ≠ Expectation of future credence (0.5).  
       - Deferring to the future self ignores critical evidence (the seen red ball).  

  4. **Role-Play (5 mins)**  
     - Assign 3 students as "Future Selves" (post-forgetting) with credence 0.5.  
     - Assign 3 as "Present Selves" (pre-forgetting) with credence 5/8.  
     - Debate: "Who is better justified?"  

  ---

  #### **Debrief (15 mins)**  
  Map activity moments to the reflection principle:  

  | **Activity Moment**               | **Reflection Principle Concept**                                  |  
  |-----------------------------------|-------------------------------------------------------------------|  
  | Part 1: Initial credence = 0.5    | Formula: Current credence = Expectation of future credence.       |  
  | Part 1: Expectation calculation   | Dutch-book intuition: Coherence requires alignment.               |  
  | Part 2: Conflict (5/8 vs. 0.5)   | Self-doubt case: Future self loses information (forgetting).      |  
  | Part 2: Rejecting 0.5             | Compromised future: Don’t defer if cognitively impaired.          |  

  **Honest Gap:** The activity cannot reproduce cases where the future self is **irrational without information loss** (e.g., expected bias or distraction). You must explain this in exposition:  
  - *Example:* "Suppose you expect your future self to ignore evidence due to exhaustion. Reflection doesn’t apply—it assumes rationality."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Students skip calculations and guess.  
     - *Fix:* Use worksheets with guided steps (e.g., "Step 1: Compute P(Heads \| first red)").  

  2. **Problem:** Confusion in Part 2’s forgetting scenario.  
     - *Fix:* Clarify: "You forget the *color*, not the update rule. You know you *did* update." Model with a student: "I saw a ball and updated, but I don’t recall if it was red."  

  3. **Problem:** The 0.5 result in Part 2 feels contrived.  
     - *Fix:* Emphasize arbitrariness: "It’s 0.5 only because the priors are symmetric. Asymmetry would change it—but the *conflict* remains."  

  4. **Problem:** Students conflate credence with truth.  
     - *Fix:* Stress: "Credences are about evidence, not frequencies. Future-you has *less* evidence."  

  ---

  ### **Why This Works**  
  - **Reflection Feels Right:** Part 1’s math forces alignment—violating it would ignore their own updating rule.  
  - **Reflection Clearly Fails:** Part 2’s forgetting makes deferring absurd—they *know* future-you is impoverished.  
  - **No Trivial Arithmetic:** Students *construct* credences using evidence (urn composition, draws), not given numbers. The forgetting twist prevents mechanical application.  

  **Final Tip:** Run the activity verbatim—the emotional friction of "losing" evidence in Part 2 makes the limits of reflection unforgettable.
