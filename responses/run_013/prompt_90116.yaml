prompt: |-
  I am a first-year PhD student in philosophy of biology, and I keep meeting the same conversational move. Someone will say, in effect, that Darwinism is a metaphysical research programme rather than a testable scientific theory, and then treat that as having settled whatever was actually under discussion. I have seen it used three quite different ways in the last month: to dismiss a demand that a particular adaptationist story be backed by evidence; to argue about whether evolutionary biology belongs alongside physics as a science; and, most awkwardly, by a friend from my old church who takes it to show that design and selection are on an equal footing because neither can be tested. The line is usually credited to Popper, and I have heard that he later partly softened it, though I have never seen the details and I do not want to build anything on that hearsay. What I need is not a ruling on what Popper really meant, but a careful map of what that one sentence could be claiming, so that I can tell which version is being invoked on each occasion and whether it genuinely does the work it is being made to do there.

  Please lay the readings out as a menu, ordered from the trivial to the radical, and give a verdict on each. Among the candidates I would want covered: that the principle of natural selection, taken by itself and apart from any particular application, is unfalsifiable because it collapses into something close to the claim that survivors survive; that it is unfalsifiable only in the innocuous way any high-level framework is, and that the charge therefore costs evolutionary biology nothing; that it is unfalsifiable in principle, which is a genuine defect; that it is perfectly falsifiable in form but that its central claims have not in fact been subjected to serious test; that it is metaphysical in a technical and respectable sense, namely a body of unfalsifiable but still criticisable background assumptions that generate testable problems; that it is metaphysical in the pejorative sense, untestable and therefore not science at all; that the slogan is really a claim about the logical form of a historical science as opposed to a nomological one; and that it is a remark about heuristic fertility, or about what can usefully be taught, rather than about truth or scientific status. For each reading, say whether it is a platitude, a substantive and defensible thesis, or simply false, and say which of my three conversational contexts it would actually support. I would also like you to say, separately, what difference it makes if Popper eventually allowed that selection under a sufficiently specified problem situation might be predictable after all — whether that concession defuses the slogan, narrows it to one of the readings above, or leaves the more radical readings untouched. Please do not give me a reading list; I want the argumentative structure, not the literature.

  End the whole reply with a single line of the form \answer{...}, containing the short label of the one reading you judge both most defensible on its merits and most likely to be what people are actually reaching for when they repeat the slogan.
reasoning: |-
  Hmm, I see what this philosophy of biology student needs. They're encountering a common rhetorical move where people dismiss evolutionary biology by calling Darwinism "metaphysical" rather than scientific, and they've seen it used in three distinct contexts: to avoid providing evidence for adaptationist claims, to question biology's scientific status compared to physics, and to put design on equal footing with natural selection. 

  The student wants a clear taxonomy of possible interpretations of this "Darwinism is metaphysical/unfalsifiable" claim, organized from least to most radical. They've provided helpful parameters: each reading should be assessed as platitude, defensible, or false; evaluated for relevance to their three scenarios; and tagged with a short label. The final output needs a single \answer{} with the most plausible interpretation.

  Looking at the interpretations they suggested: We have versions ranging from the trivial (natural selection as tautological) to the radical (full pseudoscience claim). There's also the heuristic reading, the historical science distinction, and Popper's own technical meaning of "metaphysical". Each needs unpacking.

  For structure, I'll start with the least controversial reading and escalate. The tautology objection (#1) is almost a platitude but doesn't actually damage evolutionary biology. The framework reading (#2) is defensible and normal for science. The technical metaphysical reading (#3) is Popper's actual position and quite defensible. Then we get into more contested territory: the heuristic view (#4), the historical science point (#5), the untested theory claim (#6), and finally the pseudoscience accusation (#7) which is simply false.

  For their three scenarios: 
  - The adaptationist dodge only "works" with the extreme readings (#6-7) which are weak. 
  - The physics comparison might lean on #5 or #7. 
  - The design equivalency relies entirely on #7.

  On Popper's later concession: it mainly undercuts the tautology reading (#1) but leaves the technical metaphysical reading (#3) intact since he always allowed testable versions.

  The most defensible and commonly invoked reading is likely #3 - the technical sense of "metaphysical research programme". It's what Popper meant, it's accurate, and it explains why the slogan persists even among informed critics.

  Final answer will be "Metaphysical framework (technical)".
answer: |-
  Below is a systematic breakdown of the "Darwinism is metaphysical/unfalsifiable" claim, ordered from least to most radical. Each reading is assessed for defensibility, relevance to your three scenarios (dismissing adaptationist evidence; comparing biology to physics; equating design with selection), and given a verdict. Popper's later concession is addressed separately.

  ---

  ### **The Menu of Readings**

  1.  **"Tautology" reading**  
      *Claim*: The *core principle* of natural selection ("survivors survive") is unfalsifiable because it is circular/analytical.  
      *Verdict*: **Platitude** (trivially true for the bare principle, but misrepresents evolutionary theory).  
      *Your scenarios*:  
      - Adaptationist dodge: Weak support (distracts from concrete hypotheses).  
      - Science status: Irrelevant (core principles in physics are similarly abstract).  
      - Design equivalency: Invalid (design makes testable claims; selection's tautology is avoidable via auxiliary assumptions).  

  2.  **"High-level framework" reading**  
      *Claim*: Darwinism is unfalsifiable only in the way all broad scientific frameworks (e.g., Newtonian mechanics) are—it requires auxiliary hypotheses to generate testable predictions.  
      *Verdict*: **Defensible thesis** (describes how science works; no defect implied).  
      *Your scenarios*:  
      - Adaptationist dodge: Fails (demand for evidence is legitimate; framework enables tests).  
      - Science status: Neutral (physics frameworks are similar).  
      - Design equivalency: Undermines (design lacks comparable generative power for testable hypotheses).  

  3.  **"Metaphysical framework" (technical Popperian) reading**  
      *Claim*: Darwinism is "metaphysical" in Popper's *neutral* sense: an unfalsifiable but *criticizable* research programme that *generates testable problems*.  
      *Verdict*: **Defensible thesis** (accurately describes evolutionary biology's heuristic role; not a flaw).  
      *Your scenarios*:  
      - Adaptationist dodge: Contradicts (the programme *requires* empirical testing of specific hypotheses).  
      - Science status: Affirms biology as science (metaphysical frameworks underpin all sciences).  
      - Design equivalency: Undermines (design programmes typically resist criticism/falsification).  

  4.  **"Heuristic/pedagogical" reading**  
      *Claim*: The slogan concerns utility—Darwinism is a fertile tool for discovery or teaching, not a literal truth-claim.  
      *Verdict*: **Defensible but incomplete** (overemphasizes pragmatics; ignores empirical content).  
      *Your scenarios*:  
      - Adaptationist dodge: Fails (heuristics still require empirical validation).  
      - Science status: Neutral (physics uses similar heuristics).  
      - Design equivalency: Weakens (design is less empirically fertile).  

  5.  **"Historical science" reading**  
      *Claim*: Evolutionary biology is unfalsifiable due to its historical/narrative nature (contrasted with nomological sciences like physics).  
      *Verdict*: **False** (historical sciences test retrodictions, use consilience, and make predictions; e.g., phylogenetics, antibiotic resistance).  
      *Your scenarios*:  
      - Adaptationist dodge: Invalid (historical claims *are* testable).  
      - Science status: Misleading (cosmology/geology are historical and scientific).  
      - Design equivalency: Invalid (untestable design is not analogous to testable historical inference).  

  6.  **"Untested theory" reading**  
      *Claim*: Darwinism is falsifiable in principle but has not faced serious tests (e.g., due to ad-hoc adjustments).  
      *Verdict*: **False** (extensively tested via paleontology, genetics, biogeography, etc.).  
      *Your scenarios*:  
      - Adaptationist dodge: Superficial support (but ignores evidence).  
      - Science status: Weakens biology (empirically untrue).  
      - Design equivalency: Invalid (design lacks testable instances).  

  7.  **"Pseudoscience" reading**  
      *Claim*: Darwinism is metaphysical in the *pejorative* sense: untestable, therefore unscientific (placing it on par with design).  
      *Verdict*: **Simply false** (evolutionary biology generates and confirms testable predictions; design does not).  
      *Your scenarios*:  
      - Adaptationist dodge: Only "supports" via fallacy.  
      - Science status: Denies biology's scientific status (incorrect).  
      - Design equivalency: Primary target—but false (selection is testable; design is not).  

  ---

  ### **Effect of Popper's Later Concession**  
  Popper conceded that *specific* natural selection scenarios (e.g., under constrained conditions) *are* testable and falsifiable. This:  
  - **Defuses** the "tautology" (1) and "untested theory" (6) readings.  
  - **Narrows** the slogan to the "metaphysical framework" reading (3), which he always endorsed.  
  - **Leaves untouched** radical readings (5,7), which misrepresent Popper and biology.  

  ---

  ### **Summary for Your Conversational Strategy**  
  - **Most common invocations**: Typically blend readings 1, 3, and 7. Your church friend uses #7; the physics debater uses #5 or #7; the adaptationist dodger uses #1 or #6.  
  - **Most defensible & likely intended**: **Reading 3** (metaphysical framework). It is Popper-accurate, philosophically sound, and explains why the slogan persists. It *does not* support dismissing evidence or equating with design.  

  \answer{Metaphysical framework (technical)}
