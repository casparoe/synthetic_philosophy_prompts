  Also, the user is prepping for a seminar, so they need a clear, structured explanation. They might be struggling to reconcile the two letters, so emphasizing that sensation in animals is reflexive while in humans it's combined with thought could bridge the gap. Pointing out Descartes' theological concerns about immortal souls adds context to his strict separation.

