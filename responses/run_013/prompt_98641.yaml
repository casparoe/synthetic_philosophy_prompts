  Third, the user questions if Descartes' arguments are more rhetorical against animal immortality than solid philosophy. They also wonder which part of his system relies most on denying animal minds. I should address how Descartes' mind-body dualism requires a clear boundary, and granting animals any thought could blur that line, threatening his entire metaphysics. The physics might allow for animal consciousness, but Descartes avoids it to preserve dualism.

