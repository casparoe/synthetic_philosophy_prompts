  Let me start with candidate baselines. Statistical normality? CCR5-Δ32 is rare in China, so editing would be enhancement. Harmful dysfunction? HIV susceptibility isn't a dysfunction—it's how humans evolved. So by this view, it's enhancement. But if we take a public health view, HIV is a disease, so prevention is therapy. Already contradictions. 

