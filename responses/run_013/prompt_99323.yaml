  The user’s deeper need seems to be cutting through theoretical noise to find what’s ethically salient. They suspect the distinction is a proxy or distraction. I agree—most objections persist if you swap CCR5 for a therapeutic edit. The distinction goes silent on safety, consent, justice. It’s a bureaucratic tool, not an ethical one. 

  The most honest mapping? Frame He’s act as enhancement only if you fix a baseline (e.g., statistical). But that’s arbitrary. Better to admit the distinction collapsed here—it was neither clear therapy nor clear enhancement. The real ethical weight was elsewhere. 

