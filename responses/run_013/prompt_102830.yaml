prompt: |-
  ok, so superrationality. me and a friend have been going back and forth about this for weeks and I want a number out of you.

  His position: superrationality is a real, distinct decision theory. In a one-shot prisoners dilemma where you know the other player is reasoning about the problem the same way you are, you cooperate, and that isnt just a weird special case, its what decision theory should have been all along. My position: its either (a) evidential decision theory with a correlation assumption stapled on, so it adds nothing, or (b) a heuristic that only bites when you already know your co-players algorithm down to the source code, which basically never happens outside toy problems.

  Heres the part I actually want to test him on, and I think its the real crux. Take the clean superrational story and break the identity just a little. Two agents, identical source code, same priors, same everything, except each one flips a private fair coin before acting and the coin is the only thing that differs. Or, slightly less clean: the co-player is a copy of you with a single bit flipped in its decision procedure, so its *almost* identical. Does the superrational argument still say cooperate? Because the whole thing seemed to rest on "if I cooperate then my identical twin cooperates," and the moment the twin is only probabilistically you, that inference gets a probability on it, and now it looks exactly like evidential reasoning about a correlated agent. So I suspect the coin version collapses superrationality into EDT, and if it does, the distinct-theory claim is dead.

  So give me your credence in this proposition: superrationality is a genuinely distinct and correct decision principle, not reducible to evidential or functional decision theory plus an assumption of correlation, and not merely a heuristic that requires exact knowledge of the co-players algorithm. One-shot games, no repetition, no precommitment tech, just the pure principle.

  But decompose it, I want the guts:
  - the probability that "rational" even has a determinate enough meaning in a one-shot symmetric game for any decision theory to be uniquely correct there, versus the question partly dissolving
  - the probability that the self-referential argument is valid as stated, i.e. that identical agents really must reach identical decisions, the fixed-point/determinism assumption, and how far it breaks under the private-coin tweak
  - the probability that, conditional on perfect correlation, superrationality says anything EDT doesnt already say
  - the probability that it survives the almost-identical (one-bit-flipped) version with anything like its force intact
  - plus anything else you think belongs in there

  Then give me the combination, tell me which term the final number is most sensitive to, and tell me what single argument or result would move it the most. Like, what would you have to see to take your number to the other side of 0.5. And if you think my friend wins this one, just say so, I can take it.
reasoning: |-
  Okay, let me tackle this user's query about superrationality. They've been debating with a friend for weeks and want a numerical assessment. The core issue is whether superrationality is a distinct decision theory or reducible to evidential decision theory (EDT) with correlation.

  First, I need to parse their scenario. The user's position is that superrationality either collapses into EDT with added correlation assumptions or only works when you know the co-player's algorithm exactly. Their friend argues it's a legitimate standalone theory. The test case involves tweaking the identical agent setup—adding a private coin flip or a one-bit difference—to see if cooperation still holds.

  Breaking down the user's decomposition request:
  - **Determinate meaning of "rational"**: In symmetric one-shot games, is rationality well-defined enough for a unique correct decision theory? I think there's ambiguity here. Rationality frameworks like CDT, EDT, and functional decision theory often conflict, so no single answer might be "correct."
  - **Self-referential argument validity**: The claim that identical agents must make identical decisions. This relies on determinism and common knowledge. Introducing a private coin breaks this determinism, making actions probabilistic. The fixed-point assumption fails here.
  - **Superrationality vs. EDT under perfect correlation**: If agents are perfectly correlated, both theories recommend cooperation. But EDT requires explicit correlation priors, while superrationality assumes identity. The difference is in the mechanism, not the outcome.
  - **Survival under near-identity**: With a one-bit flip or private coin, correlation isn't perfect. Superrationality's inference weakens because the agent can't be certain of the twin's action. EDT handles this with probabilistic correlation, showing superrationality might just be a special case.

  Considering broader aspects:
  - **Philosophical baggage**: Superrationality assumes symmetry and determinism without justification. EDT explicitly models beliefs about correlations.
  - **Real-world applicability**: The user's point about needing source code knowledge is valid. Outside toy problems, such perfect alignment is unrealistic.
  - **Douglas Hofstadter's original idea**: He envisioned it for identical reasoning, but it doesn't extend well to perturbations.

  The key sensitivity is the near-identical scenario. If superrationality requires perfect determinism and breaks under minor differences, it lacks robustness. Evidence showing superrationality handling probabilistic correlation uniquely would change my view, but I haven't seen that.

  Final credence: 0.15, leaning heavily against superrationality being distinct. The user's coin flip test exposes its fragility, collapsing it into EDT with correlation priors.
answer: |-
  After dissecting your query, the core philosophical disagreement, and the specific "coin flip" and "one-bit-flipped" tests, here's my rigorously decomposed analysis. I'll ground this in decision theory fundamentals (Savage, Jeffrey, Nozick), critiques of superrationality (Binmore, Wolpert), and the implications of symmetry-breaking perturbations. Your suspicion is directionally correct, but let's quantify it.

  ### Decomposed Credence Components (on a 0.0–1.0 scale)
  1. **Determinate meaning of "rational" in symmetric one-shot games**:  
     **Credence: 0.30**  
     Rationality lacks a universally determinate meaning here. CDT (causal decision theory) defection dominates. EDT (evidential decision theory) cooperates if correlation is assumed. FDT (functional decision theory) often mirrors superrationality but grounds it in abstract dependencies. The question dissolves because "rational" is framework-dependent—no theory is uniquely "correct" without meta-justification.

  2. **Validity of self-referential argument (identical agents → identical decisions)**:  
     **Credence: 0.65**  
     Under perfect determinism and common knowledge of identical source code, the fixed-point argument holds: if your algorithm outputs "cooperate" only when it deduces the other does too, mutual cooperation is the only consistent equilibrium. **But** this breaks catastrophically under your perturbations:  
     - *Private coin flip*: Decisions are now stochastic. Your twin's action is no longer determined solely by "your" reasoning but by RNG. The inference "I cooperate → they cooperate" becomes probabilistic (P <1.0), not logical.  
     - *One-bit-flipped code*: May introduce divergent reasoning paths (e.g., a flipped bit could make them defect if their XOR gate triggers). Identical outputs aren't guaranteed.  
     → *Key weakness: Superrationality assumes determinism and fails under any noise.*

  3. **Superrationality vs. EDT under perfect correlation**:  
     **Credence: 0.10**  
     Conditional on perfect correlation, superrationality and EDT converge on "cooperate." EDT explicitly models this via a correlation prior (e.g., P(my twin cooperates | I cooperate) ≈ 1). Superrationality *implies* this correlation but doesn't add new content—it's EDT with the correlation assumption *hardwired via identity* instead of Bayesian priors. No distinct substance here.

  4. **Survival under near-identical (one-bit/coin-flip) perturbations**:  
     **Credence: 0.05**  
     Superrationality collapses entirely here. With a private coin:  
     - You now face uncertainty. EDT handles this naturally: cooperate if P(twin cooperates | I cooperate) > P(twin cooperates | I defect) * [payoff ratio].  
     - Superrationality lacks tools for uncertainty. Its argument ("identical reasoning → identical action") is invalid when agents differ stochastically. You're forced into EDT-like evidential calculations.  
     The "distinct theory" claim evaporates when identity is imperfect.

  5. **Additional critical factors**:  
     - **Real-world applicability**: Superrationality requires exact algorithmic knowledge (source code, same priors)—impossible outside toy problems. EDT/FDT only require beliefs about correlations/functions. (Credence against distinctness: **0.95**)  
     - **Self-referential paradoxes**: Without a formal fixed-point theory (like FDT's logical induction), superrationality risks incoherence (e.g., "What if I'm uncertain about my own algorithm?").  
     - **Philosophical baggage**: Superrationality smuggles in a controversial determinism (no free will?) and symmetry that EDT/FDT avoid.

  ---

  ### Final Composite Credence  
  **Probability that superrationality is a distinct and correct decision principle: 0.15**  
  *(Meaning: 85% confidence it's reducible to EDT/FDT + correlation or a fragile heuristic.)*

  - **Most sensitive term**: **#4 (survival under perturbations)**. This is the crux. If superrationality could robustly handle the coin-flip scenario *without* collapsing into EDT—e.g., via a novel "near-identity" principle—it might survive. But it can't, and this exposes it as a special case of evidential reasoning.  
  - **Second-most sensitive**: **#2 (self-referential validity)**. If identicality implies determinism (debatable), superrationality holds in pristine cases—but these don't exist in reality.

  ---

  ### What Would Change My Mind (Move Credence >0.5)  
  A single argument/result could flip this:  
  - **Demonstrate unique prescriptions under uncertainty**: If superrationality offered a *distinct, rational* answer in the coin-flip dilemma that **differs from EDT/FDT and isn't ad hoc**, I'd concede. For example:  
    > "Agents with ε-different source codes should cooperate with probability P(ε), where P is derived from information-theoretic symmetry (not evidential correlation)."  
    *(No such formalism exists. Current attempts reduce to EDT.)*

  ---

  ### Verdict  
  **You win this round.** Superrationality isn't a distinct theory. It's:  
  - **(a) EDT with a correlation prior**, justified by agent-identity (which is just a causal story for correlation), or  
  - **(b) A heuristic** that only works under impossible idealizations (exact identity, determinism, common knowledge of code).  

  The coin-flip test is fatal. Once identity is probabilistic, superrationality either:  
  1. Implicitly calculates EDT-style correlations (e.g., "My twin's coin flip is independent, so P(cooperation) drops"), or  
  2. Becomes incoherent ("We're identical except for RNG... but identical reasoning says ignore RNG?").  

  Your friend's position holds only in Platonic math puzzles. In any real-world or perturbed scenario, EDT/FDT swallow it whole. If they insist otherwise, demand their answer for the coin-flip PD—bet you a beer it reduces to EDT.
