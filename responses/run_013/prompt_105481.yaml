prompt: |-
  I am 37 and must decide by the end of the month whether to accept a two-year posting at a remote Antarctic research station. The pay and career boost are large, but every account I have read by people who wintered over says the experience remade them: some lost the ambitions that sent them there, some formed attachments they could not have anticipated, and some describe a self they no longer recognize. I cannot even describe the outcomes in my current vocabulary, let alone assign them probabilities. My partner, a decision theorist, says I should treat my future preferences as just another uncertain variable and maximize expected utility from my current standpoint. My closest friend, a novelist, says that is exactly the mistake, because the person who would enjoy or regret the outcome is not me, so any expected-value calculation is a fiction. A third friend says I should ignore both and choose the option that makes for the better story, since the only self who can judge the choice is the one who emerges from it. I cannot visit first, I cannot postpone, and I cannot gather more information. What should I do? Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, this is a fascinating existential decision dilemma. The user faces a high-stakes Antarctic commitment with unknowable identity-altering consequences, framed through three distinct philosophical lenses: decision theory (partner), narrative identity (novelist friend), and retrospective selfhood (third friend). 

  The core tension revolves around whether to privilege current preferences (as the decision theorist suggests) or surrender to future self-transformation (as the friends argue). I notice the user emphasizes the inadequacy of their current vocabulary to conceptualize outcomes - this linguistic limitation reveals how profoundly alien the transformation might be. 

  For the response structure, I'll distill five actionable principles balancing these perspectives. Key considerations: 1) Acknowledge the irreversibility of identity shifts while honoring current values 2) Reframe "utility" to include growth potential 3) Leverage narrative imagination as decision tool 4) Accept epistemological limits 5) Center emotional resonance over abstract calculation. 

  The Antarctic setting is particularly resonant - it's not just geographic isolation but a confrontation with raw existence. The "better story" advice gains weight here because extreme experiences demand meaning-making. Yet completely dismissing utility maximization seems unwise given the career implications. 

  I'll avoid prescriptive choices and instead equip the user with metacognitive tools. The numbered format forces conciseness while permitting paradoxical truths ("prepare to become unrecognizable yet trust continuity of values"). The one-to-two sentence constraint means each point must land like a polar ice core sample - layered and compact.
answer: |-
  Here are five considerations for your decision:

  1.  Acknowledge that profound experiences inherently change us; resisting this transformation is unrealistic whether you go or stay.
  2.  Weigh the *current* value you place on growth and novel experiences against your desire for continuity, as this reflects who you are *now*.
  3.  Accept that accurately predicting your future preferences is impossible; the core uncertainty is part of the decision's essence.
  4.  Consider which choice aligns more strongly with your deepest current values and sense of purpose, despite the unknown outcomes.
  5.  Recognize that whichever path you choose will fundamentally shape your future self and story; commit fully to integrating that new identity.
