prompt: |-
  My friend and I spent most of Saturday evening arguing about whether there would have been a Nazi Germany without Hitler. I said no; she said the structural conditions — the settlement at Versailles, the Depression, the fragmentation of the Weimar parties, the readiness of conservative elites to do business with the radical right — would have produced something very like it under somebody else, and that the man was less a cause than a beneficiary. We got nowhere, and I am not asking you to settle it. What unsettles me is that our argument seems to bear on a practice I otherwise admire: the practice, inaugurated at Nuremberg and carried on by the international criminal tribunals, of answering state-organised atrocity by prosecuting individual leaders — the man at the desk rather than the machinery around him — for planning, ordering, and directing the crimes. That practice appears to take my side. It treats the individual as the author of the catastrophe, it rejects the plea that one was merely following orders, and it holds one person answerable for events that required an army, a civil service, and a population's acquiescence. Yet the same law hedges. To make out a crime against humanity, a prosecutor must show that the particular act belonged to a widespread or systematic attack directed against a civilian population — which reads like a concession that the act is criminal only because of the structure surrounding it.

  So: what philosophical commitments about historical causation and individual responsibility does this practice presuppose? Does it commit us to something like the great-man theory of history, on which the leader is the difference-maker, the cause without which the catastrophe would not have occurred? Or can a thoroughly structural account of atrocity accommodate individual prosecution, casting the leader as a trigger, a catalyst, or merely the point at which the system becomes visible? Which parts of the practice strictly require such commitments and which merely sit comfortably with them — in other words, where is the practice underdetermined, so that rival theories of history would each license it? And if we gave up the presupposed view for a frankly structural one, what would have to change: would personal prosecution have to yield to measures aimed at institutions and arrangements, or is there a way of holding individuals answerable that survives the thought that any one of them was replaceable?

  Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating my question. Write in British English.
reasoning: |-
  Okay, let me tackle this user's query. They had an argument with their friend about whether Nazi Germany could have happened without Hitler. The user said no, but their friend argued structural conditions would have led to something similar anyway. The user connects this to international criminal law, like the Nuremberg Trials, which prosecutes individual leaders for atrocities. They're unsettled because the law seems to rely on individual responsibility, yet the crime against humanity definition requires a systematic attack, acknowledging structural factors. 

  The user wants to know the philosophical commitments behind this legal practice. They're asking if it presupposes a "great man" theory of history or if a structural view can still justify prosecuting individuals. I need to figure out the bottom line first: the law works with both individual agency and structural context. My reasoning should explore how international law balances these without fully committing to either extreme.

  Breaking it down, the key elements are the Nuremberg principle of individual responsibility versus the systemic requirement for crimes against humanity. The user questions if holding leaders accountable assumes they were indispensable. But the legal framework actually avoids taking a stance on historical causation theories. Instead, it focuses on agency within structures—leaders are culpable for their choices, even if replaceable. 

  I should consider concepts like "necessary but not sufficient" causes. Hitler might not have been necessary structurally, but his actions were criminally significant. The law targets those who intentionally exploit structures to commit crimes. This allows prosecution without claiming they were the sole cause. The systematic element contextualizes the crime but doesn't diminish individual guilt.

  The user also asks what would change if we adopted a purely structural view. If individuals were seen as entirely replaceable, prosecuting them might seem less meaningful. But the law's current approach can withstand structuralism by emphasizing personal culpability in enabling systemic crimes. Alternatives might include institutional reforms, but individual accountability remains crucial for justice.

  I need to ensure my response addresses all parts: the philosophical commitments, underdetermined areas, and implications of shifting views. The bottom line is that international law navigates between structure and agency, allowing prosecution based on culpable actions without resolving historical determinism.
answer: |-
  The legal practice of prosecuting individual leaders for atrocities presupposes a hybrid view of causation and responsibility, rejecting both pure structural determinism and a simplistic "great man" theory, whilst focusing on individual agency *within* enabling structures.

  Its core commitment is to moral and legal agency: individuals capable of making choices bear responsibility for their deliberate acts, even when those acts occur within, and exploit, powerful structural conditions. Nuremberg rejected the "just following orders" defence precisely because it denies this fundamental agency – the capacity to choose to participate in evil. Prosecuting leaders treats them not necessarily as the *sole* or *indispensable* cause (the great-man view), but as the *authoritative agents* who intentionally harnessed structures to plan, order, and direct criminal enterprises. They are held responsible for *their* actions – initiating wars, issuing extermination orders – not for creating the entire historical context.

  The requirement that crimes against humanity be "widespread or systematic" is not a concession to structural determinism but a jurisdictional and definitional element. It distinguishes isolated atrocities from state or organisational policy, ensuring the crime reflects an assault on humanity itself. Crucially, it *does not* excuse the individual perpetrator; instead, it contextualises *their* act as part of a larger criminal enterprise *for which they are culpably responsible*. The leader is prosecuted for *using* the machinery, not merely for being part of it. A "trigger" or "catalyst" analogy fits: the structural conditions provided the explosive material, but the leader intentionally lit the fuse and directed the blast.

  The practice is **underdetermined** regarding the *historical necessity* of the specific leader. It doesn't require proving Hitler was utterly irreplaceable for a fascist Germany to emerge (your friend's structural point). It *only* requires proving that *this* individual, occupying *this* position of power, intentionally committed specific criminal acts (planning aggressive war, ordering genocide). Rival historical theories (emphasising structure or individual agency) can both license prosecution: the structuralist can still say the accused was culpable for *how* they acted within the system, while the agency-focused theorist sees them as the prime mover. The practice hinges on proven *acts of commission* by the individual, not on their historical uniqueness.

  Adopting a "frankly structural" view, where individuals are seen as entirely replaceable cogs, *would* fundamentally challenge this practice. If leaders are viewed as having no meaningful agency – merely the inevitable products and expressions of the structure – then personal culpability diminishes. Prosecution could appear like scapegoating individuals for systemic forces beyond their control. Justice might then shift towards measures targeting institutions, systems, and arrangements (e.g., constitutional reforms, demilitarisation, economic restructuring, truth commissions focused on societal complicity). However, a path for individual accountability *could* survive even within a structural framework if it focuses on the *intentional exercise of power*: holding individuals answerable not for being the *cause* of the structure, but for *choosing* to wield its power criminally and sadistically when alternatives (however constrained) might have existed. The law, as it stands, navigates this middle ground, insisting that structures commit crimes *through* responsible human agents who must answer for their choices.
