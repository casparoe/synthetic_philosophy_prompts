answer: |-
  **Bottom line**  
  This is a substantive dispute between two legitimate but incompatible framings of rationality, rooted in different assumptions about agent correlation. Superrationality assumes agents recognise their reasoning is identical and thus correlated, treating choices as interdependent. Orthodox causal decision theory assumes independence, treating others’ actions as fixed parameters. The dispute isn’t merely verbal; it reflects a deep tension in how to model identical agents in symmetric games. Both approaches are internally consistent but answer distinct questions: "What should *we* do if we all reason identically?" versus "What should *I* do given others’ possible actions?".

  **The two sides as they actually stand**  
  *Superrationality* (e.g., Hofstadter): Assumes all agents use identical reasoning under common knowledge of symmetry. Your choice (e.g., sending the telegram with *p* = 1/20) reveals probabilistic information about others’ choices because their algorithms mirror yours. In the Luring Lottery, where the prize is shared among entrants, this justifies entering with *p* ≈ 1/*N*—you coordinate implicitly to maximise collective payoff. It’s rational only if you believe others *are* identically rational.  

  *Causal/orthodox decision theory*: Treats others’ choices as independent of your reasoning. Your postcard doesn’t causally affect theirs; you should maximise expected utility given fixed beliefs about others’ behaviour. In the telegram puzzle, if you expect others to send with probability *q*, you send only if *q*<sup>19</sup> is high enough. In the Luring Lottery, you *always* enter (if costless), as your entry doesn’t reduce others’—exploiting their restraint. Your friend sees superrationality as conflating correlation with causation.  

  The Luring Lottery’s probabilistic twist amplifies the clash: Superrationalists argue entering *p* = 1/*N* avoids prize dilution; causalists counter that since entries don’t interact, you gain by entering unconditionally.

  **What kind of disagreement this is**  
  This is a substantive, formal dispute about how to model *logical dependence* in decision problems with identical reasoners. Superrationality incorporates the idea that your decision algorithm’s output is evidence about others’ outputs (due to symmetry), making it a form of *logical decision theory*. Orthodox causal decision theory rejects this, viewing agents as causally isolated. The disagreement survives accusations of "magical thinking" because superrationality isn’t claiming spooky causation—it’s claiming that in symmetric games, Bayesian updating *about logical relationships* is valid.  

  The puzzle isn’t ill-posed, but it highlights ambiguities in defining "the same problem" for identical agents. If agents *know* their reasoning is identical, their choices *are* logically entangled—a fact orthodox models ignore. However, superrationality struggles with robustness: if one agent defects from symmetry (e.g., enters the lottery twice), the "equilibrium" collapses. The dispute thus reveals a rift in decision theory: whether rationality requires optimising under *causal independence* or accepting *evidential/logical dependence* in symmetric worlds. Crucially, both sides survive this diagnosis: the causalist rightly notes that real-world actions lack logical entanglement; the superrationalist rightly notes that in tightly symmetric thought experiments, ignoring entanglement is myopic.

  **What would count as progress**  
  Progress requires formalising how agents model each other’s decision processes. Key steps:  
  1. **Axiomatic distinction**: Prove whether superrationality can be derived from broader principles (e.g., cooperative game theory) or if it requires new axioms (e.g., "logical correlation").  
  2. **Empirical test**: Run the Luring Lottery with subjects versed in both theories. Do superrational entrants earn more when participants are peers? If not, causalism wins pragmatically.  
  3. **Asymmetry injection**: Modify the puzzle (e.g., add a known "irrational" agent). Superrationality must then adjust probabilities, while causalists won’t—testing robustness.  
  4. **Reframing the question**: Shift from "What is rational?" to "When is it rational to assume identical reasoning?" This admits both answers: causal for most real cases; superrational for idealised common-knowledge symmetries.  
  Absent this, the dispute persists: causalists see superrationality as a special case of equilibrium selection; superrationalists see causalists as ignoring logical knots.

  **Where I'd put my money**  
  I lean causal: superrationality’s beauty relies on knife-edge conditions (perfect symmetry, common knowledge, identical algorithms) that rarely hold. In practice, someone *always* defects—entering twice in the lottery—rewarding causal exploitation. But I’d shift if:  
  - A theorem showed superrational strategies emerge naturally from learning dynamics in symmetric games.  
  - Experiments proved humans intuitively converge to *p* = 1/*N* in high-symmetry scenarios *without collusion*.  
  Until then, treating others’ actions as independent remains the safer bet—even if it feels less elegant.
