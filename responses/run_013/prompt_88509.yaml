prompt: |-
  I've been lurking on rationalist blogs for like twelve years and I still can't state my own decision theory, so I'm hoping you can reverse-engineer it from my gut. No theory, just five calls:

  a) Two transparent boxes, a predictor that put $1M in box A iff it predicted I'd one-box. Twist: it isn't simulating my reasoning at all, it just has a big dataset of people who scored like me on some personality quiz, and its record is 95 out of 100. I one-box. 95% is 95%, I dont care where the correlation comes from.

  b) The gene that both makes you want cigarettes and gives you cancer, cigarettes themselves harmless. I'd never start. The cigarettes aren't doing anything, I just dont want to be the guy the gene picked.

  c) Desert hitchhiker. The driver only picks up people he's sure will pay at the end of the ride, and he's already picked me up. I pay.

  d) Two programmers each write a one-shot prisoner's dilemma strategy, each knowing the other will run whatever program they themselves would have written, and each knowing they'd write the same program. I write the cooperate one.

  e) The counterfactual mugging. It flips a coin, it comes up tails, so it isn't asking me for anything; but it says that if the coin had come up heads it would have asked me for $100, and it'll hand me $10,000 right now iff I'd have paid in the heads branch. I say no, I wouldn't have paid. Feels like extortion.

  c and e feel like the same case to me and I answer them oppositely, so something in there is doing work I can't see. What principle actually fits? And what does it say about the troll — a guy with a scary-accurate model of me announces that if his model says I'll donate to the food bank this month, he'll burn down an orphanage next month. My gut says donate anyway and I dont trust that gut, since it's the same shape as (a) and I go the other way there.

  Give it back as exactly five numbered items, one or two sentences each, no intro and no wrap-up: (1) your best single principle, (2) the best runner-up, (3) what each says about the c-versus-e clash, (4) what your preferred one says about the troll, (5) which of my five gut calls I have to give up.
reasoning: |-
  Okay, let me unpack this user's request. They've presented five decision scenarios where their gut reactions seem contradictory, especially between (c) and (e), and want me to reverse-engineer a consistent principle. 

  Hmm, the user is clearly deeply familiar with rationalist concepts - mentioning things like transparent Newcomb, smoking lesion, and counterfactual mugging without explanation. They've been lurking for 12 years but feel stuck, which suggests frustration with theoretical purity versus practical intuition. The "no theory, just gut" approach is interesting - they want me to ignore textbook answers and find what actually drives their instincts.

  Looking at their responses: 
  - In (a) they one-box despite the predictor being statistical rather than psychological. That feels like pure expected value calculation. 
  - (b) shows aversion to correlated harm even when the action is harmless. 
  - (c) and (d) demonstrate commitment to reciprocal cooperation. 
  - But (e) rejects hypothetical cooperation when no actual payoff exists. 

  The contradiction between (c) and (e) is the key. Both involve conditional commitments, but (c) has real consequences (not paying harms the driver) while (e) is purely counterfactual. The user senses this but can't articulate why it matters.

  For the orphanage troll case, their gut says donate but they distrust that instinct because it resembles (a). I need to explain why (a) and the troll are different: in (a) the predictor's behavior is fixed regardless of their choice, while the troll actively punishes virtue.

  My candidate principles would be:
  1) Actual consequence focus: only care about real-world outcomes, not hypotheticals or correlations. This explains rejecting counterfactual mugging while accepting desert hitchhiker. 
  2) Correlation aversion as secondary: explains smoking lesion but not the orphanage dilemma.

  For the troll, principle #1 says donate anyway since withholding won't prevent harm - the model is already set. Whereas in (a), one-boxing produces better outcomes regardless of prediction mechanics.

  The user might need to give up their (a) response if they fully embrace #2, but that seems inconsistent with their other choices. Better to keep (a) under #1 by framing the predictor as part of the causal chain.

  The challenge is packaging this tightly per their request: five numbered items, no fluff. Need to make every word count while preserving nuance.
answer: |-
  Here are the five items per your request:  

  1. **Primary Principle**: Maximize actual outcomes; ignore acausal correlations and unactualized counterfactuals unless they demonstrably alter real consequences.  
  2. **Runner-Up Principle**: Avoid being complicit in harmful patterns, even if causally inert, when the correlation feels identity-threatening (e.g., genetic fate).  
  3. **c vs. e Clash**: (c) has real, immediate consequences (defection harms the driver); (e) demands payment for a *hypothetical* scenario with no tangible effect. Principle #1 rejects (e) as extortion but enforces (c) as contractual.  
  4. **Troll under #1**: Donate. Withholding won’t save the orphanage (his threat is fixed to his model, not your action), while donating feeds the hungry. Unlike (a), the troll’s model is adversarial, not neutral prediction.  
  5. **Gut call to abandon**: (a) must go. Principle #1 dismisses the predictor’s source, but your 95% trust in statistical correlation contradicts your rejection of acausal payouts in (e).
