  ### The Joke (147 words)
  The guy at the Rationalist Meetup hawked tickets for his St. Petersburg table: "Infinite expected value! Just $500 to play!"  
  A skeptic eyed the chalkboard: "Heads: $2. Tails-Heads: $4. Tails-Tails-Heads: $8... *ad infinitum*. Your bankroll?"  
  "$10,000," the hawker admitted. "But statistically—"  
  "Statistically," the skeptic cut in, "your $10k caps the payout after 13 tails. Meaning you actually expect to pay out about $12. So why $500?"  
  "Because infinity!"  
  "Right. And if I told you a guy outside had a magic box that *might*, with Planck-scale probability, torture your loved ones for a googleplex years... would you pay him $500 *not* to press the button?"  
  "Of course not! That's Pascal's Mugging!"  
  The skeptic nodded. "Funny how the vanishingly small chance of infinite gain demands my wallet, but the vanishingly small chance of infinite loss gets dismissed as irrational. Pass."

  ### Load-Bearing Elements
  1.  **Vanishing Probabilities Driving Divergence:** The punchline hinges entirely on the hawker admitting his finite bankroll caps the *actual* payout (making the *real* EV ~$12), exposing the "infinite EV" as purely theoretical, sustained only by outcomes so improbable they effectively don't occur (needing 14+ tails). The humor is in contrasting the marketed "infinity" with the capped reality.
  2.  **Asymmetry with Pascal's Mugging:** The core punchline juxtaposes the hawker's demand for a high fee based on vanishingly small chances of huge gains against his immediate dismissal of paying based on vanishingly small chances of huge losses. This directly exploits the rationalist discomfort with the non-symmetric treatment of unbounded payoffs and disutilities, making the paradox's structure feel hypocritical in practice. The finite bankroll cap makes this asymmetry concrete and absurd.
