prompt: |-
  I am a senior software engineer who was recently promoted to manage a group of about twenty engineers, and I have no formal training in philosophy. The part of the job I am worst at is deciding how to respond when someone's behavior or a team's habits need to change. My instincts oscillate between two stories. One story says people are basically decent and want to do good work, so when someone behaves badly it is because something in the environment is starving or distorting that decency—unclear expectations, a bad example set by a senior person, incentives that reward the wrong thing—and my job is to remove the obstruction and give the good tendency room. The other story says people are self-interested and will drift toward whatever is easiest unless the structure makes the right behavior easier than the wrong one, so my job is to install rituals, checklists, and consequences that reshape the default. I recently heard a discussion of Mencius and Xunzi that made me think these are not just moods but two developed positions, and I want to stop flip-flopping. These decisions come up weekly, sometimes daily, and the stakes are moderate but cumulative: attrition, whether people trust each other, whether the team can absorb a bad quarter. Anything that touches someone’s employment ultimately has to go through me and HR.

  Please turn the Mencius–Xunzi disagreement into a decision procedure that I and my tech leads can actually run on a recurring problem—something we can do in about twenty minutes without reading the primary texts, and that preserves the parts of each view that make them different rather than collapsing them into nurture versus nature. I want the questions asked in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it must hand the decision to me or to HR because the remaining question is about values or about someone’s employment rather than about diagnosis. In particular, keep whatever is distinctive in Mencius’s idea that the moral sprouts need to be extended and can be lost through neglect or bad company, and in Xunzi’s idea that goodness is deliberate artifice, that ritual and propriety do not merely suppress desire but nourish and channel it, and that the right structure can make a person’s own approval of the ritual the thing that makes it stick. The procedure should tell us when to remove an influence, when to install a ritual, and when neither will work.

  Then run it on three cases we actually face: a talented senior engineer whose code review comments are consistently dismissive and who says he is just being direct; a team that reliably misses documentation and handoff commitments even after two rounds of gentle reminders; and a case where the procedure tells me the problem is my own incentives and that I am the one who has to change, which I will not enjoy hearing. For each case, show the questions in order, the answers, the recommended intervention, and what would count as evidence after a month that the diagnosis was wrong. Finally, tell me what this procedure cannot decide and where I am likely to mistake a Xunzian problem for a Mencian one or the reverse.
reasoning: |-
  We are creating a decision procedure based on the Mencius-Xunzi debate. The key elements from each:
  - Mencius: People have innate moral sprouts (compassion, shame, courtesy, sense of right and wrong). Bad behavior arises when these are starved or distorted by environment (e.g., unclear expectations, bad examples, perverse incentives). The solution is to remove obstructions and nurture the sprouts.
  - Xunzi: People are born with self-interested desires and need deliberate cultivation through ritual and structure. Goodness is an artificial construct that must be learned and internalized. The solution is to install rituals, checklists, and consequences that make the right behavior easier and more rewarding.

  The decision procedure will be a series of questions to diagnose the problem and recommend an intervention (remove an obstruction, install a ritual, or neither). It should run in about 20 minutes and be used by tech leads and the manager.

  Procedure Steps:

  1. **Question 1: Is the behavior occurring in a context where the individual/team has previously demonstrated the desired behavior?**
     - *Purpose*: To check if the moral sprout (Mencian view) might exist but is being suppressed.
     - *Sufficient Answer*: 
       - Yes: We have seen this person/team do the right thing in similar circumstances. (Proceed to Q2)
       - No: We have never seen them do the right thing in any context, or they are new and we have no history. (Proceed to Q3)
       - Unclear: We are not sure. Then we must gather evidence (e.g., ask peers, look at past records). If still unclear, treat as "No".

  2. **Question 2: In the instances where they did the right thing, was there a clear structure or ritual in place that has since decayed or been removed?**
     - *Purpose*: If they did the right thing before, perhaps a Xunzian structure was present and now it's gone. Or, if no structure was present, then it might be a Mencian sprout that is now being obstructed.
     - *Sufficient Answer*:
       - Yes, there was a structure/ritual and it is now gone or weakened. (Recommend: Reinstate or repair the structure. Xunzian intervention.)
       - No, they did the right thing without any apparent structure. (Proceed to Q4)

  3. **Question 3: Is the individual/team aware that the behavior is a problem and do they express a desire to change but lack the know-how?**
     - *Purpose*: This checks for a Mencian sprout (shame, desire to do good) that is present but not being nurtured because of a lack of knowledge or skill. Also, if they are unaware, it might be a deeper Xunzian problem requiring imposed structure.
     - *Sufficient Answer*:
       - Yes, they acknowledge the problem and want to change but don't know how. (Recommend: Remove the obstruction by providing training, mentorship, or resources. Mencian intervention.)
       - No, they do not acknowledge the problem or see it as a problem. (Proceed to Q5)

  4. **Question 4: Is there an identifiable obstruction (e.g., conflicting priorities, lack of time, unclear expectations, bad example) that is preventing the desired behavior?**
     - *Purpose*: To see if the Mencian sprout is being blocked by an environmental factor.
     - *Sufficient Answer*:
       - Yes, there is a clear obstruction. (Recommend: Remove the obstruction. Mencian intervention.)
       - No, we cannot identify any obstruction. (Proceed to Q5)

  5. **Question 5: Can we design a simple, clear ritual or structure (e.g., checklist, recurring meeting, peer review, consequence) that would make the desired behavior easier and the undesired behavior harder?**
     - *Purpose*: If we have no evidence of the sprout or if the sprout is not manifesting and we can't find an obstruction, we try a Xunzian approach.
     - *Sufficient Answer*:
       - Yes, we can design such a structure. (Recommend: Install the ritual/structure. Xunzian intervention.)
       - No, we cannot design a feasible structure. (Proceed to Q6)

  6. **Question 6: Is the problem severe enough that it is causing significant harm to the team or product and has persisted despite previous interventions?**
     - *Purpose*: If we can't find a Mencian obstruction nor design a Xunzian structure, we might be facing a deep-seated issue that requires escalation.
     - *Sufficient Answer*:
       - Yes. (Recommend: Escalate to HR or higher management for potential disciplinary action or formal performance process.)
       - No. (Recommend: Monitor the situation and revisit in 2-4 weeks. Also, consider if the problem is minor enough to tolerate.)

  **Stopping Points and Handoffs**:
  - The procedure stops with a recommendation at any step that yields a clear intervention (remove obstruction, install ritual, escalate).
  - If at any point the issue involves potential discrimination, harassment, or legal concerns, hand off immediately to HR.
  - If the problem is about the manager's own incentives or behavior (as in the third case), then the procedure must be run by the manager's superior or a peer (to avoid bias) and may require the manager to change.

  **What the Procedure Cannot Decide**:
  - It cannot resolve fundamental value disagreements (e.g., what constitutes "dismissive" comments might be a cultural or subjective matter). These require a values discussion with the team and possibly HR.
  - It cannot diagnose problems that require deep psychological expertise (e.g., personality disorders) and should not replace professional HR processes for severe interpersonal issues.

  **Common Mistakes**:
  - Mistaking a Xunzian problem for a Mencian one: If the issue is due to a lack of structure (Xunzi) but we try to remove an obstruction (Mencius) that isn't there, we may waste time. Example: A team that has never documented well because they never had a template or process (Xunzi) might be misdiagnosed as having an obstruction (like time constraints) when the real issue is lack of habit and structure.
  - Mistaking a Mencian problem for a Xunzian one: If the issue is due to an obstruction (e.g., a toxic senior engineer setting a bad example) but we impose a new ritual, we might not fix the root cause and the ritual may fail.

  Now, run the procedure on three cases:

  **Case 1: Talented senior engineer whose code review comments are consistently dismissive and says he is just being direct.**

  - Q1: Has this engineer ever given constructive, non-dismissive code reviews? 
    - Let's say: **Yes**, in the past he was more constructive. (Proceed to Q2)
  - Q2: Was there a structure/ritual in place then that is now gone? 
    - Perhaps: **No**, there was no particular structure. He was just more careful. (Proceed to Q4)
  - Q4: Is there an obstruction? 
    - Possible obstructions: Maybe he is under time pressure, or he is mimicking a senior person who is also dismissive? Or perhaps expectations about code review tone were never made clear? 
    - If we find an obstruction (e.g., unclear expectations), then **Yes**. 
    - **Intervention (Mencian)**: Remove the obstruction. For example, set clear expectations about code review tone (using examples) and provide feedback on how his comments are perceived. Also, if there is a bad example, address that person too.
  - If no obstruction found: Proceed to Q5 and try a ritual (e.g., a checklist for code reviews that includes "use constructive language", or a peer review of his reviews by a lead).

  *Evidence after a month that diagnosis was wrong*: If after setting clear expectations and removing obstructions, the behavior doesn't improve, then we might have misdiagnosed. It could be that he doesn't see the problem (so we should have gone to Q3) or that a ritual is needed (Q5).

  **Case 2: Team that reliably misses documentation and handoff commitments even after two rounds of gentle reminders.**

  - Q1: Has the team ever met documentation commitments? 
    - **No**, they have always struggled with this. (Proceed to Q3)
  - Q3: Are they aware it's a problem and do they want to change but lack know-how? 
    - Let's say: **Yes**, they admit it's important and want to do better, but they don't know how to fit it in. (Mencian intervention: Remove obstruction by providing time, resources, or training.)
    - But if they say: **No**, they don't see it as a priority, then proceed to Q5.
  - Alternatively, if they are aware and want to change, we remove obstructions. If that doesn't work, we might have to go to Q5 later.

  *However, let's assume they are aware and want to change but don't know how. Then we remove obstructions. But if they have been given reminders and still fail, maybe the obstruction is not the issue. Alternatively, maybe the reminders are not enough and they need structure.*

  - Alternatively, if we go to Q5: Can we design a ritual? 
    - **Yes**: Install a ritual. For example, a mandatory documentation checklist that must be completed before closing a ticket, or a recurring handoff meeting. (Xunzian)

  *Evidence after a month*: If after removing obstructions (e.g., allocating time for documentation) they still miss commitments, then the problem might be lack of structure (so we should have done a Xunzian intervention). Conversely, if we imposed a ritual and they still miss, perhaps there is an obstruction (like unrealistic deadlines) that we didn't remove.

  **Case 3: Problem is my own incentives and I have to change.**

  - This case is about the manager's own behavior. The procedure must be run by someone else (e.g., a peer manager or the manager's superior) to avoid bias.

  Example problem: The manager has been pushing for fast feature delivery, which leads the team to cut corners on quality.

  - Q1: Has the manager ever set incentives that balanced speed and quality? 
    - **Yes**, in the past. (Proceed to Q2)
  - Q2: Was there a structure then that is now gone? 
    - Maybe **No**, but if there was a structure (e.g., a quality checklist that the manager stopped enforcing), then reinstate it.
  - If no structure, then Q4: Is there an obstruction? 
    - Obstruction could be: Pressure from above to deliver quickly? Or the manager's own promotion incentives tied to speed? 
    - If we identify an obstruction (e.g., pressure from above), the intervention is to remove it (e.g., the manager negotiates with superiors for more realistic timelines). 
    - If the obstruction is the manager's own incentives, then the intervention is for the manager to change their own behavior (e.g., adjust the incentives they set for the team).

  *Evidence after a month*: If the manager changes the incentives and the team's behavior improves, then the diagnosis was correct. If not, maybe a ritual is needed (Q5) or the problem is deeper.

  **Final Note**: The procedure is iterative. If the first intervention doesn't work, revisit the procedure and try the next step.
answer: |-
  ### The Mencius–Xunzi Decision Procedure for Behavioral Change  
  **Philosophical Core Preserved**:  
  - **Mencius Focus**: People have innate "moral sprouts" (e.g., compassion, shame). Bad behavior arises when these are starved by environmental obstructions (e.g., unclear expectations, toxic role models). Intervention: **Remove obstructions** to let the sprouts grow.  
  - **Xunzi Focus**: People have self-interested desires that must be reshaped by deliberate ritual. Goodness is artificial and requires structure (e.g., checklists, consequences) that makes right behavior easier and eventually internalized. Intervention: **Install rituals** to redirect desire.  

  **Procedure Rules**:  
  1. **Timebox**: 20 minutes per problem. Involve at least 2 people (e.g., you + a tech lead).  
  2. **Stop Conditions**:  
     - **Stop with "No"** at any step if evidence is insufficient (abort and monitor).  
     - **Hand off to HR** if the issue involves legal/employment risks (e.g., harassment, discrimination) or values conflicts (e.g., "What is 'dismissive'?").  
     - **Hand off to you** if the root cause is your incentives/behavior (run by a peer for objectivity).  
  3. **Output**: A clear action—**remove obstruction** (Mencius), **install ritual** (Xunzi), **neither** (monitor or escalate).  
  4. **Validation**: After 1 month, check for **reduced problem frequency** (e.g., 50% fewer incidents). If unchanged, the diagnosis was wrong.  

  **Decision Procedure: 6 Ordered Questions**  
  1. **"Have we observed the desired behavior in this person/team before, even inconsistently?"**  
     - **Purpose**: Tests for existing moral sprouts (Mencius). If yes, the potential is proven.  
     - **Sufficient Answer**:  
       - **Yes** (with examples) → Proceed to Q2.  
       - **No** (or unclear) → Skip to Q3.  
     - **Stop/Handoff**: If "no" and no evidence after 5 min of discussion → **Hand off to HR** if behavior is severe (e.g., bullying); else, **install ritual** (Xunzi).  

  2. **"Was there a ritual/structure in place when the desired behavior occurred?"**  
     - **Purpose**: Distinguishes if past success was innate (Mencius) or structural (Xunzi).  
     - **Sufficient Answer**:  
       - **Yes** (e.g., they documented well when checklists were enforced) → **Reinforce/repair that ritual** (Xunzi).  
       - **No** (e.g., they were self-motivated) → Proceed to Q4 (skip Q3).  
     - **Stop/Handoff**: If "yes" → **Install ritual** (Xunzi).  

  3. **"Does the person/team acknowledge the problem and want to improve, but lack tools/knowledge?"**  
     - **Purpose**: Tests for a suppressed sprout (Mencius) vs. needing structure (Xunzi).  
     - **Sufficient Answer**:  
       - **Yes** (e.g., "I want to fix this but don’t know how") → **Remove obstruction** (Mencius).  
       - **No** (e.g., "This isn’t a real problem") → Proceed to Q5.  
     - **Stop/Handoff**: If "yes" → **Remove obstruction** (e.g., training, clarity).  

  4. **"Is there an identifiable environmental obstruction starving good behavior?"**  
     - **Purpose**: Mencius diagnosis. Obstructions include: unclear goals, toxic role models, conflicting incentives, or resource gaps.  
     - **Sufficient Answer**:  
       - **Yes** (e.g., "They’re mimicking a dismissive VP") → **Remove obstruction** (Mencius).  
       - **No** (e.g., no obvious blockers) → Proceed to Q5.  
     - **Stop/Handoff**: If "yes" → Act to remove (e.g., reset expectations).  

  5. **"Can we design a ritual/structure to make good behavior easier than bad?"**  
     - **Purpose**: Xunzi diagnosis. Rituals must be simple, actionable, and self-reinforcing (e.g., "Do this, get praise").  
     - **Sufficient Answer**:  
       - **Yes** (e.g., a template for code reviews) → **Install ritual** (Xunzi).  
       - **No** (e.g., too complex to enforce) → Proceed to Q6.  
     - **Stop/Handoff**: If "yes" → Implement ritual.  

  6. **"Has this persisted >3 months despite prior interventions, causing material harm?"**  
     - **Purpose**: Tests for escalation needs.  
     - **Sufficient Answer**:  
       - **Yes** (e.g., attrition risk) → **Escalate to HR** (not fixable via philosophy).  
       - **No** → **Neither** (monitor for 1 month and revisit).  
     - **Stop/Handoff**: Always stops → Escalate or monitor.  

  ---  
  ### Case Applications  
  **Case 1: Senior Engineer with Dismissive Code Reviews**  
  - **Context**: Engineer says they’re "just being direct." Team morale is falling.  
  - **Procedure**:  
    1. **Q1**: "Have they given constructive reviews before?" → **Yes** (early in their tenure, before promotion).  
    2. **Q2**: "Was there a ritual then?" → **No** (they were self-motivated).  
    3. **Q4**: "Is there an obstruction?" → **Yes** (recent pressure to ship fast + a VP who mocks "soft" feedback).  
  - **Intervention**: **Remove obstruction** (Mencius). Reset expectations: "Quality includes respectful feedback. Here’s a positive example from your past work. The VP’s tone is not our standard."  
  - **Evidence of Wrong Diagnosis**: After 1 month, if reviews are still dismissive → Misdiagnosed; likely needs ritual (e.g., a code review checklist with "tone" criteria).  

  **Case 2: Team Misses Documentation Handoffs**  
  - **Context**: Gentle reminders failed twice.  
  - **Procedure**:  
    1. **Q1**: "Have they met deadlines before?" → **No** (consistent pattern for 6 months).  
    2. **Q3**: "Do they want to improve but lack tools?" → **No** ("Documentation is low priority").  
    3. **Q5**: "Can we design a ritual?" → **Yes** (automate handoff checklists in Jira; completion unlocks next sprint’s resources).  
  - **Intervention**: **Install ritual** (Xunzi). Implement checklist + public recognition for on-time handoffs.  
  - **Evidence of Wrong Diagnosis**: If deadlines still missed → Obstruction exists (e.g., unrealistic workload; revisit Q4).  

  **Case 3: Your Incentives Are the Problem**  
  - **Context**: Team cuts corners because you reward speed over quality.  
  - **Procedure** (run by your peer):  
    1. **Q1**: "Did the team deliver quality work before?" → **Yes** (under previous manager).  
    2. **Q2**: "Was there a ritual then?" → **Yes** (bi-weekly quality audits).  
    3. → **Install ritual** (Xunzi) but note: *The ritual decayed because you changed incentives*.  
  - **Intervention**: **You change** by reinstating quality audits and tying promotions to quality metrics.  
  - **Evidence of Wrong Diagnosis**: If quality doesn’t improve in 1 month → Obstruction exists (e.g., your skip-level insists on speed; revisit Q4).  

  ---  
  ### What the Procedure Cannot Decide  
  1. **Values Conflicts**: E.g., "What counts as 'dismissive'?" Requires team/HR alignment on definitions.  
  2. **Employment Decisions**: E.g., "Is this person irredeemable?" Hand off to HR after Q6.  
  3. **Deep Cultural Issues**: E.g., company-wide toxicity. The procedure fixes local problems, not systemic ones.  

  ### Common Misdiagnoses  
  - **Mistaking Xunzi for Mencius**: Assuming "obstruction" when the real issue is lack of structure.  
    - **Example**: Team misses deadlines (Q1:no → Q3:no). You blame "time pressure" (obstruction), but the fix is a ritual (e.g., automated reminders).  
  - **Mistaking Mencius for Xunzi**: Imposing rituals when an obstruction is starving motivation.  
    - **Example**: Engineer is dismissive (Q1:yes → Q4: obstruction = bad role model). You add a checklist, but the VP’s influence remains.  

  **Key Insight**: Mencius is about **unblocking existing good**, Xunzi is about **building new habits**. Use the questions to force clarity—don’t assume.
