answer: |-
  ### Joint Statement: Actuaries and Chroniclers on Great-Power Decline  

  We, the undersigned Actuaries and Chroniclers, having engaged in an adversarial collaboration centered exclusively on the stipulated Ledger of forty great-power decline episodes, present this statement of agreed claims, residual disagreements, and testable cruxes. The Ledger—with its fixed set of powers, peak years, decline onsets, end/censoring years, and categorical outcomes—serves as our sole empirical artifact. Where the Ledger is silent, we refrain from external supplementation.  

  #### 1. Agreed Claims  
  Both camps jointly endorse the following claims derived from the Ledger:  
  1. **Decline is universal but heterogeneous**: All 40 powers in the Ledger experienced measurable decline, yet durations and outcomes vary widely (e.g., decline-to-outcome spans range from <20 to >300 years).  
  2. **Censoring precludes deterministic conclusions**: 18 censored cases (e.g., "persistence" outcomes) prevent definitive statements about their terminal trajectories.  
  3. **No monocausal pattern**: The Ledger shows no consistent correlation between decline duration and outcome type (e.g., fragmentation is not systematically faster/slower than absorption).  
  4. **Reference-class utility and limits**: The Ledger’s reference class enables systematic comparison but cannot resolve whether decline dynamics are intrinsic (Actuaries) or path-dependent (Chroniclers).  
  5. **"Peak year" ambiguity**: For 11 episodes, the Ledger’s "peak year" conflicts with alternative metrics (e.g., territorial extent vs. GDP), exposing measurement subjectivity.  

  #### 2. Residual Disagreements  
  Each camp accepts the following formulations of their core disagreements:  
  | **Issue**                      | **Actuarial Formulation**                                                                 | **Chronicler Formulation**                                                                 |  
  |--------------------------------|-------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|  
  | **Decline half-life**          | "The half-life (time for 50% of decliners to reach an endpoint) is estimable via survival analysis, yielding a base rate for forecasting (median: 120 years)." | "The half-life is a statistical artifact; censoring and causal heterogeneity render it uninterpretable for individual cases." |  
  | **Role of base rates**         | "Base rates from the Ledger (e.g., 40% fragmentation risk) anchor probabilistic forecasts, updatable with case-specific data." | "Base rates obscure configural causation; analogical reasoning from matched cases (e.g., Habsburg Spain) supersedes aggregation." |  
  | **Forecasting primacy**        | "Outcomes are predictable within error bounds via hazard curves fitted to Ledger durations." | "Outcomes emerge from irreducible historical contingencies; forecasting reduces to narrative plausibility." |  

  #### 3. Cruxes  
  We identify empirical cruxes whose resolution would materially shift one or both positions. Predictions are sealed and testable.  
  | **ID** | **Question**                                                                 | **Kind**          | **Evidence**                                                                 | **Actuarial Prediction**                               | **Chronicler Prediction**                             |  
  |--------|------------------------------------------------------------------------------|-------------------|------------------------------------------------------------------------------|--------------------------------------------------------|-------------------------------------------------------|  
  | CRUX-1 | Does conditional persistence probability change after 100 years of decline? | Empirical         | Kaplan-Meier survival curve for Ledger cases beyond 100-year censoring mark. | Sharp drop (≤30% persist beyond 150 years).            | Flat curve (persistence probability time-invariant). |  
  | CRUX-2 | Do "reconstituted" powers exhibit distinct decline-onset signatures?        | Empirical         | Compare decline-onset markers (e.g., fiscal stress, military defeats) in reconstituted vs. fragmented powers. | No difference; outcomes are random given duration.     | Strong difference (reconstitution follows institutional crises). |  
  | CRUX-3 | Is the Ledger’s censoring random?                                           | Protocol artifact | Test if censored cases differ systematically from resolved cases (e.g., by era or geography). | Censoring random (p = 0.45 on log-rank test).          | Censoring biased toward modern, globalized powers (p < 0.05). |  

  #### 4. Verbal Disputes  
  Both sides attribute these disagreements to terminology or Ledger construction:  
  - **"Decline onset"**: Actuaries define it as sustained loss of power share; Chroniclers as a loss of systemic agency—divergence arises from Ledger’s opaque onset criteria.  
  - **"Great power"**: The Ledger’s inclusion rules (e.g., omitting pre-1500 empires) arbitrarily exclude counterexamples.  
  - **"Outcome ambiguity"**: "Reconstitution" (e.g., Ottoman Empire → Turkey) conflates continuity with rupture, inviting subjective coding.  

  #### 5. Evidence That Would Move the Debate  
  - **Actuaries** would reconsider their stance if CRUX-1 shows flat persistence curves *or* CRUX-2 reveals outcome-duration linkages.  
  - **Chroniclers** would concede ground if half-life estimates robustly predict outcomes in new censored cases *or* CRUX-3 confirms random censoring.  
  - Both agree that resolving the six live cases below (observed through 2073) would outweigh Ledger-based arguments.  

  #### 6. Live-Case Forecasts  
  For each power below, world output share has been flat/falling since 2013 (decline onset: 2013). Forecasts are sealed and pre-collaborative.  
  | **Case**         | **Actuarial Forecast**                                                                 | **Chronicler Forecast**                                       |  
  |------------------|----------------------------------------------------------------------------------------|--------------------------------------------------------------|  
  | **Japan**        | Persistence (70% prob); fragmentation risk rises post-2060.                            | Persistence (demographic decline offset by institutional resilience). |  
