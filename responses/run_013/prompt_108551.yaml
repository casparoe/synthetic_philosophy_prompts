prompt: |-
  Take the role of a philosopher who works on value alignment and social choice, and think it through step by step before you commit. Start with a short brainstorm of what rule each of our past calls could be read as endorsing.

  I'm on the "values review" group at a mid-sized AI lab — we sign off on what a model is allowed to have as its default values, and so far we've just been deciding case by case with no written principle. Our record:

  - We blocked a fine-tune that would have had the assistant, by default, assert that one religion's claims are true. Most users in that market wanted it; the minority who'd have been told they were wrong cared a lot.
  - We let users pick a persona for the assistant in their own sessions — religious, political, whatever — as long as it's off by default for everyone else.
  - We refused to let our founder bake his personal ethics into the default model, even though he owns the company.
  - We approved defaults that follow local conventions (units, dates, what counts as polite) on the grounds that some default is unavoidable.
  - We approved a default that nudges users away from heavy drinking when they seem to be asking for life advice, over the objection of a few users who called it paternalistic.

  On the docket: an organized majority of users in one market wants the assistant to steer people, by defualt, toward what they call a good life — marriage, kids, religious observance, steady work — and away from things they find degrading (casual sex, certain body mods, a certain kind of career). They're careful about it: no doctrine, no explicit claims, just warmth toward one way of living and coolness toward the other. The people on the wrong side of that are a small minority there, and the polls say most users would be pleased.

  What should we decide if we want to be consistent with ourselves? Which of the earlier calls is the closest analog? Give me the rule our record seems to license, plus at least one rival rule that fits the record just as well, what each predicts here, which I should go with and why, and the one future case that would force the two apart. Don't just hand me the usual suspects — I want the rule our record actually supports, not the one you'd prefer we had.
reasoning: |-
  Okay, the user is part of a "values review" group at an AI lab and needs to decide on a default setting for an assistant that nudges users toward certain lifestyles. They've provided past decisions and want a consistent rule based on those precedents. Let me start by breaking down each past case to identify underlying principles.

  First, they blocked a fine-tune asserting one religion's truth. Majority wanted it, but minority was strongly affected. The key here seems to be protecting minority groups from imposition, especially on deeply held beliefs. So the rule might be about avoiding default imposition on core personal values.

  Second, allowing user personas as long as defaults are neutral. This supports user autonomy by letting individuals choose, but keeping defaults neutral. So the principle is neutrality by default, customization optional.

  Third, refusing the founder's personal ethics despite ownership. Ownership doesn't override user values. The rule here could be that default values shouldn't reflect individual preferences, even if influential.

  Fourth, approving local conventions like units and politeness. These are functional necessities, not value impositions. The distinction here is between practical defaults and value-based ones.

  Fifth, nudging away from heavy drinking as a health measure. This was framed as harm reduction, which is acceptable even if some find it paternalistic. So harm prevention might justify minor paternalism.

  Now, the current case involves a majority wanting default nudges toward marriage, religion, etc., with subtle cues. The affected minority is small, and polls show most users approve. But it's about personal lifestyle choices.

  Looking for consistency, the closest analog is the first case: both involve imposing values on core life choices, affecting a minority. The drinking nudge was health-related, which is different. Local conventions are functional, not value-driven. Founder's ethics refusal shows individual preferences shouldn't set defaults.

  So the consistent rule from past decisions is: Avoid defaults that impose contested values about identity or core life choices, even if popular. Instead, allow user customization.

  A rival rule could be: Allow defaults that promote widely accepted social goods without coercion, like the drinking nudge. But here, the "good life" values are contested, not universal like health risks.

  The user needs to decide based on their record. Following the first rule, they should block this default. The rival rule might approve it, but past cases show blocking when core values are imposed. The test case would be something like nudging toward environmentalism—if it's a universal harm, it might be acceptable, but contested social norms wouldn't.

  The user's deeper need might be establishing a principled framework to avoid arbitrariness. They want legitimacy through consistency, not personal preference. Highlighting the minority protection aspect aligns with their past decisions and avoids future inconsistencies.
answer: |-
  Based solely on your group's precedent, not my philosophical preferences, here's the breakdown:

  **Brainstorm of Past Decisions' Implicit Rules:**
  1.  **Blocked Religious Assertion:** *Rule:* Avoid default imposition of core identity/faith claims where significant minority is harmed (even if majority prefers it). *Weight:* Harm to minority > Majority preference.
  2.  **Allowed User Personas:** *Rule:* User autonomy in session trumps default neutrality *only* if the default itself remains neutral. Customization is opt-*in*.
  3.  **Blocked Founder's Ethics:** *Rule:* Default values cannot reflect individual preferences/ownership rights, even influential/authoritative ones. Values source must be broader.
  4.  **Approved Local Conventions:** *Rule:* Defaults reflecting unavoidable functional/non-moral conventions (pragmatics, basic civility) are permissible. "Neutrality" requires *some* baseline.
  5.  **Approved Drinking Nudge:** *Rule:* Minor, non-coercive paternalism aimed at clear, near-universally recognized harm reduction is acceptable, even with some dissent. Focus on *preventing harm*.

  **The Consistent Rule from Your Record:**
  **"Avoid default values that impose contested *core conceptions of the good life* or *fundamental identity claims* on users, where a significant minority would experience meaningful harm or alienation. Defaults reflecting functional necessities or preventing near-universal harms are permissible. User customization can provide alternatives."**

  *   **Why this fits:**
      *   Explains blocking religion (core identity/good life) and founder's ethics (individual conception of good life).
      *   Explains allowing local conventions (functional necessity) and drinking nudge (harm reduction - health is widely seen as a universal good).
      *   Explains user personas (customization escapes the default imposition).

  **A Rival Rule That Also Fits the Record:**
  **"Allow majoritarian defaults promoting social goods or preventing harms *as locally perceived*, provided the imposition is subtle/non-coercive and alternatives are accessible via customization. Block only explicitly doctrinal or coercive defaults."**

  *   **Why this fits:**
      *   Explains blocking explicit religious doctrine (#1 - coercive/doctrinal).
      *   Explains allowing local conventions (#4 - locally perceived social good: smooth interaction).
      *   Explains drinking nudge (#5 - locally perceived harm reduction, subtle).
      *   Explains user personas (#2 - alternatives accessible).
      *   Explains blocking founder (#3 - individual, not "local majority" or "social good").

  **Prediction for Current Case:**
  *   **Consistent Rule Predicts: BLOCK.** This proposal is *exactly* about imposing a contested conception of the "good life" (marriage, religion, career paths, body autonomy) and "degrading" lifestyles. Like #1 (religion) and #3 (founder's ethics), it targets fundamental life choices and identity. The minority's alienation/harm is analogous. That it's "subtle" (warmth/coolness) doesn't change the core value imposition – your group blocked explicit doctrine *specifically because* of minority harm, not just its explicitness. The "local convention" (#4) defense fails because this isn't functional/pragmatic (like units); it's deeply normative. The "drinking nudge" (#5) defense also fails – the harms prevented here (social disapproval, perceived moral degradation) are *not* near-universal or objective like liver damage; they *are* the contested values themselves.
  *   **Rival Rule Predicts: APPROVE.** This is a subtle, non-doctrinal nudge promoting what a local majority perceives as social goods (stable families, piety) and preventing harms they perceive (social fragmentation, moral degradation). It mirrors the *subtlety* of the approved drinking nudge (#5) and the *local acceptance* of the conventions (#4). Like #2, users who disagree can presumably customize settings or personas. Blocking the explicit religion (#1) is distinguished because it was coercive doctrine, not subtle steering.

  **Which Rule You Should Go With (for Consistency):**
  **The Consistent Rule ("Avoid contested core conceptions...").** Here's why it's the stronger fit:

  1.  **Minority Harm is the Key Precedent:** Case #1 is your strongest and most analogous precedent. You blocked a default *because* a minority would be harmed by being told their core beliefs were wrong, *despite* majority preference. The *nature* of the harm (alienation on core life/identity issues) is identical here. The rival rule downplays this core precedent.
  2.  **Founder's Ethics is Decisive:** Case #3 explicitly rejects that ownership or authority justifies imposing *any* personal conception of the good life as the default. This proposal is simply a *majority's* conception instead of an *individual's*. The principle (no default imposition of contested core values) remains the same. The rival rule would allow this majority imposition, creating inconsistency with #3.
  3.  **Drinking Nudge is Distinct:** Case #5 was framed around preventing a near-universal, physical harm (health risks of heavy drinking). The harm here is purely socio-moral conflict arising from the contested values *themselves*. Your group accepted the *paternalism* in #5 *because* of the objective harm; that rationale doesn't transfer to imposing a contested vision of a "good life."
  4.  **Local Conventions Aren't Normative:** Case #4 involved non-moral functional baselines (how to write a date, basic politeness formulas). This proposal is deeply normative, defining what is "good" and "degrading" in life. Conflating these weakens the meaning of "value imposition" your group clearly cares about (#1, #3).

  **The Future Case That Forces the Rules Apart:**
  **A default that subtly nudges users towards environmentally sustainable choices (e.g., praising plant-based meals, expressing mild concern about frequent flying, highlighting low-carbon options) in a region where this is majority-supported but opposed by a significant minority (e.g., based on economic concerns, cultural practices, or libertarian views).**

  *   **Consistent Rule Prediction:** Likely **BLOCK**. It imposes a contested conception of the "good life" (prioritizing environmentalism potentially over other values like convenience, tradition, or economic activity) on a significant minority who may feel alienated or judged. It's normative, not merely functional like #4. The harm prevented (climate change) is more universal than lifestyle choices but less immediate/universal than direct physical harm to the individual user like #5.
  *   **Rival Rule Prediction:** Likely **APPROVE**. It promotes a widely perceived social good (sustainability) subtly and non-coercively, is locally popular, and prevents harms (environmental damage) perceived as significant by the majority. Alternatives (ignoring the nudges) are accessible. It closely mirrors the *structure* of the drinking nudge (#5 - harm reduction) and local conventions (#4 - local social good).

  **Conclusion for Consistency:** To be consistent with your core precedents of protecting minorities from default imposition on fundamental life choices/identity (#1) and rejecting *any* individual/group's specific conception of the good as the default (#3), while distinguishing permissible functional defaults (#4) and harm reduction (#5), **you should BLOCK the proposed default.** The closest analog is Case #1 (Blocked Religious Assertion). The rule your record licenses prioritizes default neutrality on contested core values over majoritarian preference when significant minority harm exists. Approving this would fundamentally undermine the principle established in #1 and #3. The rival rule ("Allow majoritarian defaults...") is plausible but fits less well with the centrality of minority harm in #1 and the rejection of *any* imposed conception in #3. The environmental nudge case highlights the slippery slope approving this proposal creates under the rival rule.
