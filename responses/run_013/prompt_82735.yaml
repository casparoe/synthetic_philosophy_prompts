prompt: |-
  Okay, so this has been rattling around my head for about a week and I keep flip-flopping, so I'm outsourcing it.

  Setup. I'm sympathetic to the idea that not every credence has to be a number. Show me an urn with 100 balls in it and tell me nothing at all about the mix. Then show me a second urn that's definitely 50 red and 50 black. I don't think the honest response to the first urn is to shrug and say 50/50 — the honest response is a range, a whole set of probability functions, every one of them compatible with what I actually know. I've absorbed this from enough rationalist blogs that I'd be sad to give it up.

  Then my housemate (philosophy grad student, reads alot of decision theory) put the following on our whiteboard and said it kills the whole idea stone dead. I can't find the bad step and it's bothering me.

  (1) A credence that isn't a single number is a set of probability functions. Call it a spread.
  (2) When a spread has to choose an action, it picks the action whose worst case is best: for each action, work out how it does under every function in the spread, take the worst of those, then take the action with the highest worst case.
  (3) So whatever the spread tells you to do, there is some member of the spread that would tell you to do the same thing.
  (4) So you could swap the spread out for one of its members and your behaviour would be identical. The other functions in the set are doing no work.
  (5) Or the spread tells you to do nothing at all — no action comes out ahead.
  (6) But a mental state that doesn't tell you what to do isn't a credence. Credences are for deciding with. An attitude that leaves the decision open isn't a view about the odds, it's a confession that you haven't got one.
  (7) So imprecise credences are either sharp credences in disguise, or they aren't credences. Either the framework is idle or its confused.

  She also claims the argument doesn't depend on the rule in (2) — she says you get the same result if you use the rule where any action that's optimal for at least one member of the spread is allowed. I haven't checked that and I'm not sure I'd know how.

  I'd like to keep (1), and I'd like to keep the negation of (7), but honestly I care more about not having a false step sitting in my own reasoning than about which side wins.

  So: which step do I give up, why did it look fine to me in the first place, and what does giving it up actually cost? If you think every step survives, say that instead, and tell me what it means for (1). I'm not asking who said what or where to read more — I just want to see the machinery.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is struggling with an argument that challenges the concept of imprecise credences. They want to keep the idea that credences can be sets of probability functions, but their housemate's argument seems to show that such imprecise credences are either equivalent to precise ones or not real credences at all. 

  First, I need to understand the core of the argument. The key move is in step (3): whatever action the spread recommends, there's always one precise credence function in the spread that would recommend the same action. Therefore, the spread isn't adding anything beyond what a single credence function would do. 

  Hmm, this feels like it might be conflating two different things. The spread represents uncertainty about which probability function is correct, not just an average of them. The maxmin rule in step (2) is designed to handle this uncertainty by being cautious. But step (3) claims that this cautious approach could be mimicked by one specific function in the spread. 

  Wait, is that actually true? Let me test with a simple example. Suppose I have two actions: A and B. The spread has two probability functions. Under P1, A gives utility 10 and B gives 0. Under P2, A gives 0 and B gives 10. The maxmin rule would look at the worst case: for A it's 0 (from P2), for B it's 0 (from P1). So maxmin says both actions are equally bad? That would lead to indecision. But the user's housemate argues that in such cases the spread fails to guide action, which supposedly means it's not a real credence. 

  But what if we tweak the numbers? Suppose P1 gives A:10, B:9; P2 gives A:1, B:10. Then maxmin for A is min(10,1)=1, for B is min(9,10)=9. So it picks B. Now, is there a single credence that would also pick B? Well, P2 picks B, but P1 picks A. So actually, no single function in the spread agrees with the spread's decision (since P1 prefers A, P2 prefers B, but the spread picks B). 

  Aha! This contradicts step (3). The spread picked B based on worst-case analysis, but no individual function in the spread would have picked B as the sole best action. P2 does pick B, but it considers B strictly better than A, whereas the spread sees them as incomparable under different functions. 

  So the flaw is in step (3). The maxmin choice isn't necessarily optimal under any single credence in the spread; it's a conservative choice that avoids the worst outcomes. In cases where one action dominates in the worst case, the spread behaves differently than any individual credence function. 

  This also addresses the housemate's claim about other decision rules. If we allow any action that's optimal for some function in the spread, we might end up with multiple permissible actions. But that doesn't mean the spread is idle—it reflects genuine indecision where no option is clearly best across all plausible probabilities. 

  The cost of giving up step (3) is accepting that imprecise credences don't collapse to precise ones. They represent a different kind of uncertainty that affects decisions in ways a single probability can't capture. This might lead to indecision sometimes, but that's not a flaw—it's an honest reflection of ambiguity. 

  The user might have missed this because they focused on cases where the maxmin choice coincides with some function in the spread. The counterexample shows this isn't universal. The key insight is that spreads handle ambiguity aversion, which single probabilities don't capture.
answer: |-
  Let's dissect this argument step by step. The flaw is in **step (3)**, and it's subtle but fundamental. Here's the breakdown:

  ### Step-by-Step Analysis
  1. **"(1) A credence that isn't a single number is a set of probability functions. Call it a spread."**  
     → This is your starting point. Imprecise credences are represented as a set $\mathcal{C}$ of probability functions. **Safe to keep.**

  2. **"(2) When a spread has to choose an action, it picks the action whose worst case is best: for each action, work out how it does under every function in the spread, take the worst of those, then take the action with the highest worst case."**  
     → This is **maximin decision rule**:  
     $$\text{Choose } a^* \text{ such that } \min_{P \in \mathcal{C}} \mathbb{E}_P[U(a^*)] = \max_{a} \min_{P \in \mathcal{C}} \mathbb{E}_P[U(a)]$$  
     → A valid rule for ambiguity aversion. **No flaw here.**

  3. **"(3) So whatever the spread tells you to do, there is some member of the spread that would tell you to do the same thing."**  
     → **This is false.** The maxmin choice $a^*$ is **not necessarily optimal** under any single $P \in \mathcal{C}$.  
     → **Counterexample**:  
     - Actions: $\{a, b\}$  
     - Spread: $\{P_1, P_2\}$  
       - $P_1$: $\mathbb{E}[U(a)] = 10$, $\mathbb{E}[U(b)] = 0$  
       - $P_2$: $\mathbb{E}[U(a)] = 0$, $\mathbb{E}[U(b)] = 10$  
     - Maxmin:  
       - Worst case for $a$: $\min(10, 0) = 0$  
       - Worst case for $b$: $\min(0, 10) = 0$  
       → Both actions have identical maxmin value (0).  
     - **But neither $P_1$ nor $P_2$ is indifferent!**  
       - $P_1$ strictly prefers $a$ (10 > 0).  
       - $P_2$ strictly prefers $b$ (10 > 0).  
     → The spread's indecision **does not imply** that any single $P \in \mathcal{C}$ shares that indecision.  

  4. **"(4) So you could swap the spread out for one of its members and your behaviour would be identical."**  
     → **False**, as shown above. If you replace $\mathcal{C}$ with $P_1$, you'd always choose $a$; with $P_2$, always $b$. But the spread doesn't commit to either.  
     → **Cost of rejecting (4)**: You accept that imprecise credences can produce behavior **not mimicked by any single precise credence**. This is a feature, not a bug—it reflects genuine ambiguity.

  5. **"(5) Or the spread tells you to do nothing at all — no action comes out ahead."**  
     → **Possible**, as in the counterexample. This is ambiguity-induced indecision.  
     → **But this doesn't kill the framework**. It reflects legitimate suspension of judgment when options are incomparable under uncertainty.

  6. **"(6) But a mental state that doesn't tell you what to do isn't a credence."**  
     → **Question-begging**. Assumes "credence" must always yield a strict preference.  
     → Imprecise probabilists argue:  
       - Credences represent doxastic states, which can include **indeterminacy** (e.g., "I genuinely can't compare these options").  
       - Indecision is rational when evidence is symmetric or ambiguous.  

  7. **"(7) So imprecise credences are either sharp credences in disguise, or they aren't credences."**  
     → **False dichotomy**. Rejected because (3) and (6) fail.

  ### Why Step (3) Looked Persuasive
  - **Hidden assumption**: That the maxmin action $a^*$ must be optimal for some $P \in \mathcal{C}$. This holds in *some* cases (e.g., if one action dominates), but **not universally**.  
  - **Decision-rule dependence**: The housemate claims this works for other rules (e.g., "pick any action optimal for some $P \in \mathcal{C}$"). But:  
    - Under that rule, the spread allows **multiple permissible actions** (e.g., both $a$ and $b$ in the counterexample).  
    - No single $P \in \mathcal{C}$ permits the same set of actions ($P_1$ forbids $b$, $P_2$ forbids $a$).  
    → Still no equivalence to any single precise credence.

  ### What Giving Up Step (3) Costs You
  - **Conceptual cost**: You must accept that imprecise credences can lead to decision-making fundamentally different from precise credences (e.g., indecision or non-singleton choice sets). This requires rethinking "rationality" to accommodate ambiguity.  
  - **Formal cost**: You need decision rules that handle sets (e.g., maxmin, Levi-admissibility, E-admissibility) and accept that they may not reduce to maximizing expected utility under one probability.  
  - **Philosophical cost**: You abandon the idea that every rational agent can be modeled as having a single "true" probability function guiding their choices.

  ### The Bigger Picture
  Imprecise credences aren't "idle" because:  
  - They model **states of knowledge** (e.g., "I know the urn has between 30-70 red balls") more faithfully than an arbitrary precise prior (e.g., 50/50).  
  - Decision rules like maxmin **use the entire set** to handle ambiguity aversion. Removing functions from $\mathcal{C}$ can change the decision (e.g., drop $P_2$ from the counterexample, and $a$ becomes maxmin-optimal).  
  - They explain **indecision** under ambiguity as rational, not irrational.

  ### Final Verdict
  - **Give up step (3)**: It's empirically false for imprecise frameworks.  
  - **Keep (1) and reject (7)**: Imprecise credences are a distinct, coherent way to represent belief.  
  - **Cost**: You embrace a more nuanced view of rationality where evidence gaps can percolate into decision gaps—which is exactly what your urn example illustrates.  

  This doesn't resolve all debates (e.g., "Are imprecise credences *necessary*?"), but it shows the argument against them fails. The machinery holds up.
