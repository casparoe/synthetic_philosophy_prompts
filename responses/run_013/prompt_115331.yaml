prompt: |-
  I am taking a continuing-education course in ethics, and after a session on how demanding morality can reasonably be, I admitted to a friend of mine — a philosophy graduate who is usually reliable about this sort of thing — that I could not get a grip on the idea of supererogation. He sent back the following thumbnail sketch, which I reproduce as faithfully as I can. I would like you to audit it rather than improve on it, since I do not yet know which parts to trust.

  His sketch runs roughly as follows. Supererogation is the category of actions that are morally good but not morally required: the soldier who throws himself on a grenade, the stranger who donates a kidney, the colleague who quietly covers for you at the cost of her weekend. Such acts are said to occupy a distinctive place in the moral landscape — not obligatory, since one does no wrong in omitting them, but not merely permissible either, since they are positively good and praiseworthy. The traditional division of acts into the forbidden, the permissible and the obligatory is therefore incomplete, and a fourth category is needed, the supererogatory, which is really the realm of the morally optional: the space in which morality lets you do as you please and merely applauds if you do more. The word itself descends from theology, where works of supererogation were understood as good deeds over and above what God commands, but the modern puzzle, sometimes called the paradox of supererogation, is that if an act really is good, it is hard to see why we do not simply owe it to one another — either the act is good, in which case it looks required, or it is not, in which case the praise looks misplaced. He reports that most philosophers now take the paradox to dissolve once one separates an act's being good from its being required, so that nothing deeply puzzling remains, and that this is why the concept is generally taken to show that any moral theory without room for it must be wrong: strict Kantianism, which makes duty the whole of morality, has no place for the hero, and act utilitarianism, which tells one to maximise the good at every moment, makes every optimific act obligatory, which is why utilitarianism is so often said to demand too much. He ends with the thought that some philosophers worry the supererogatory space is where self-indulgence hides, and that the ideal of a moral saint is dehumanising in any case, which he says is basically the same worry.

  I suspect he is right about the broad outline and wrong about some of the joints, but I cannot say which. Could you go through the sketch claim by claim and tell me what someone who works on supererogation would accept as stated, what they would wince at and want reworded, and what is simply mistaken? I am particularly unsure about the taxonomy — whether the supererogatory is really a fourth category sitting alongside the obligatory and the forbidden, or something with a different logical relation to them — and about his suggestion that the puzzle has been dissolved. Finally, does his closing inference survive correction? That is, if it turns out that Kantians or utilitarians can make room for supererogation after all, is there anything left in the sketch that licenses the conclusion that a moral theory lacking a distinct supererogatory category is refuted? I am not looking for citations or a reading list; I want the anatomy of the summary, so that I can see which of its sentences I can safely repeat and which I should not.
reasoning: |-
  Okay, the user is taking an ethics course and struggling with the concept of supererogation. They've shared a summary from their philosophy graduate friend and want an audit of it—pointing out accurate parts, problematic phrasing, and mistakes. They're especially concerned about the taxonomy of moral categories and whether the paradox of supererogation is truly resolved. Also, they question if Kantianism or utilitarianism lacking supererogation refutes them.

  First, I need to break down the friend's summary step by step. The friend defines supererogation as morally good but not required actions, like self-sacrificing deeds. They claim it's a fourth moral category beyond forbidden, permissible, and obligatory. The historical note about theology seems correct. The paradox is that if something is good, why isn't it obligatory? The friend says philosophers resolve this by separating good from required. Then, they argue that moral theories without supererogation, like Kantianism or utilitarianism, are flawed. The closing worry is that supererogation might hide self-indulgence and moral sainthood is dehumanizing.

  I need to evaluate each part. Starting with the definition: supererogatory acts are indeed beyond duty, praiseworthy but not obligatory. That's solid. The examples (soldier, kidney donor) are classic and acceptable. 

  Next, the taxonomy: claiming it's a fourth category alongside obligatory, forbidden, and permissible is problematic. Permissible already covers non-forbidden actions, so supererogatory should be a subset of permissible acts that are especially good. Saying it's a distinct fourth category misrepresents the structure. The user specifically questioned this, so I should highlight that confusion.

  The theological origin is accurate. The paradox part is mostly right—separating good and required does help resolve it, but it's not entirely dissolved; debates about cost to the agent and demandingness persist. The friend oversimplifies by saying "nothing deeply puzzling remains."

  Regarding moral theories: Kantianism might accommodate supererogation through imperfect duties, and utilitarians have strategies like scalar utilitarianism or incorporating personal costs. So the claim that lacking supererogation refutes them is too strong. The user asked if this conclusion holds after corrections—probably not, since adaptations exist.

  The closing worry about self-indulgence and dehumanization is valid but conflates two different issues: one about misuse of supererogation and the other about moral sainthood. They aren't "basically the same."

  The user's deeper needs might include understanding nuances for academic discussions, avoiding misrepresentation in their course, and grasping why supererogation challenges ethical theories. They might also want to know reliable parts to reference without citations.

  In the response, I'll structure it by parts of the sketch, noting what's spot on, needs rewording, or is mistaken. Emphasize the taxonomy error and the unresolved aspects of the paradox. Clarify that moral theories can adapt, so the refutation isn't absolute. Acknowledge the valid points in the closing worry but correct the conflation.
answer: |-
  Here's a claim-by-claim audit of your friend's sketch from the perspective of contemporary supererogation scholarship:

  1.  **"Supererogation is the category of actions that are morally good but not morally required..."**
      *   **Spot On.** This is the standard definition. The core idea is "beyond the call of duty."

  2.  **"...the soldier who throws himself on a grenade, the stranger who donates a kidney, the colleague who quietly covers for you at the cost of her weekend."**
      *   **Spot On.** These are classic, uncontroversial examples illustrating the concept effectively. They involve significant sacrifice or risk for the benefit of others, clearly exceeding standard obligations.

  3.  **"Such acts are said to occupy a distinctive place in the moral landscape — not obligatory, since one does no wrong in omitting them, but not merely permissible either, since they are positively good and praiseworthy."**
      *   **Spot On.** This captures the essential "distinctive place": omission isn't wrong/blameworthy, but performance is good/praiseworthy. The contrast with "merely permissible" (which might be neutral) is crucial and correct.

  4.  **"The traditional division of acts into the forbidden, the permissible and the obligatory is therefore incomplete, and a fourth category is needed, the supererogatory..."**
      *   **Wince & Reword.** This is conceptually sound but taxonomically misleading. The problem isn't that the *number* is wrong, but that "permissible" is too broad. Supererogatory acts *are* a type of permissible act (since they are not forbidden). The key is that "permissible" needs subdivision:
          *   Permissible = Not Forbidden.
          *   Permissible includes: a) The Obligatory (Required), b) The Merely Permissible (Neutral/Allowed but not required), and c) The Supererogatory (Good but not required).
      Saying it's a "fourth category sitting alongside" obligatory and forbidden risks confusion. *Logically, supererogation is a sub-category of the permissible, distinct from the obligatory and the merely permissible.*

  5.  **"...which is really the realm of the morally optional: the space in which morality lets you do as you please and merely applauds if you do more."**
      *   **Mostly Spot On, but slightly imprecise.** "Morally optional" is fine. "Lets you do as you please" captures the lack of requirement. "Merely applauds" is generally correct but slightly downplays the *positive* moral value and praiseworthiness; it's more than just "applause," it's genuine moral commendation. It's the "merely" that slightly rankles.

  6.  **"The word itself descends from theology, where works of supererogation were understood as good deeds over and above what God commands..."**
      *   **Spot On.** Accurate historical note on the term's origin.

  7.  **"...but the modern puzzle, sometimes called the paradox of supererogation, is that if an act really is good, it is hard to see why we do not simply owe it to one another — either the act is good, in which case it looks required, or it is not, in which case the praise looks misplaced."**
      *   **Spot On.** This perfectly articulates the core philosophical puzzle ("paradox") that motivates much of the literature: the tension between goodness and requirement.

  8.  **"He reports that most philosophers now take the paradox to dissolve once one separates an act's being good from its being required..."**
      *   **Wince & Qualify.** While separating goodness from requirement is *essential* to *addressing* the paradox, saying it "dissolves" and "nothing deeply puzzling remains" is a significant **overstatement**.
          *   **Why it's problematic:** The *real* puzzle often lies *behind* this separation: *why* are some very good acts not required? What *principle* distinguishes the required from the supererogatory? Common answers involve the *cost* or *sacrifice* to the agent, but articulating a clear, non-arbitrary boundary remains a live debate. The separation is the starting point, not the complete dissolution. The puzzle morphs into "How do we justify this separation in a principled way?" Claiming it's "dissolved" understates ongoing philosophical work.

  9.  **"...so that this is why the concept is generally taken to show that any moral theory without room for it must be wrong..."**
      *   **Wince & Qualify.** The *intuition* that supererogation exists is strong and widely held. A theory that *cannot* accommodate it faces a significant challenge. "Must be wrong" is too strong. Many argue that a plausible moral theory *should* accommodate it, but theories are complex and can be defended on multiple grounds. It's a major *problem* for theories that seem to exclude it, not an automatic refutation.

  10. **"...strict Kantianism, which makes duty the whole of morality, has no place for the hero..."**
      *   **Wince & Qualify (Re: Strictness).** *Traditional* interpretations of Kant emphasizing *only* perfect duties struggle here. However, Kant's category of "imperfect duties" (duties of wide obligation, like beneficence) is often argued by Kantians to *provide* space for supererogation. You have a duty to promote others' happiness *in general*, but latitude exists in *how* and *when* you fulfill it. Heroic acts could be seen as fulfilling this duty in an exemplary way, beyond the minimal demands. So "strict Kantianism" (interpreted narrowly) might struggle, but nuanced Kantianism has resources.

  11. **"...and act utilitarianism, which tells one to maximise the good at every moment, makes every optimific act obligatory, which is why utilitarianism is so often said to demand too much."**
      *   **Spot On (for Standard Act Utilitarianism).** This is the classic criticism. If the *only* duty is to maximize good, then any time you *could* do something optimific but don't (e.g., donate your second kidney, live in extreme poverty to give more), you are failing in your duty. This seems absurdly demanding and leaves no room for supererogation (as everything optimific becomes obligatory).

  12. **"He ends with the thought that some philosophers worry the supererogatory space is where self-indulgence hides..."**
      *   **Spot On.** This is a recognized concern. The worry is that labeling certain costly good deeds as "optional" provides an easy excuse ("I *could* have done that heroic thing, but it wasn't *required*, so I'm fine just doing the bare minimum"), potentially masking moral laziness or self-interest.

  13. **"...and that the ideal of a moral saint is dehumanising in any case..."**
      *   **Spot On.** This draws on influential work (like Susan Wolf's "Moral Saints") arguing that a life *solely* dedicated to maximizing moral goodness, leaving no room for personal projects, relationships, or interests that aren't morally optimific, would be unattractive and lacking in essential human dimensions.

  14. **"...which he says is basically the same worry."**
      *   **Mistaken.** These are **distinct worries**:
          *   **Worry 1 (Self-Indulgence):** Supererogation might be *misused* as an excuse for not doing enough, allowing self-interest to hide behind the label of the "optional."
          *   **Worry 2 (Dehumanizing Saint):** The *ideal* of constantly striving for the supererogatory (or, more broadly, maximizing the good) itself might be an undesirable or impossible ideal for human flourishing.
      While both relate to concerns about demandingness and the limits of morality, they target different things: one targets the *potential misuse* of a concept, the other targets the *undesirability of an ideal* linked to (but not identical to) that concept. They are related but not "basically the same."

  **Addressing Your Specific Queries:**

  1.  **Taxonomy:** As noted in point 4, supererogation is best understood as a *sub-category* of the permissible (what is not forbidden). It sits alongside the *obligatory* (which is also permissible) and the *merely permissible* (neutral/allowed acts). It is not a separate fourth pillar alongside forbidden/permissible/obligatory. The logical relation is: Permissible ⊃ {Obligatory, Merely Permissible, Supererogatory}.
  2.  **Dissolution of the Puzzle:** While separating goodness from requirement is necessary and fundamental, claiming the puzzle is "dissolved" is an overstatement. The core challenge of *justifying why* some highly good acts are not required, especially those involving significant sacrifice, remains active and debated. The separation is the *basis* for a solution, not the solution itself.
  3.  **Licensing the Conclusion (Refuting Theories Lacking Supererogation):**
      *   **Kantianism:** As noted in point 10, sophisticated Kantians argue that the framework *can* accommodate supererogation via imperfect duties. If this defense is successful, the lack of a *distinct* supererogatory category doesn't refute Kantianism; it just shows the concept operates within the duty framework differently.
      *   **Utilitarianism:** Standard Act Utilitarianism *does* struggle profoundly here. However, utilitarians have developed responses: 1) **Scalar Utilitarianism:** Abandoning the deontic categories (obligatory/forbidden) altogether, seeing morality on a scale of better/worse, where "supererogatory" just means "very good but not maximally best possible." 2) **Incorporating Agent-Centered Prerogatives:** Modifying utilitarianism to allow agents to give *some* priority to their own interests, creating a space for acts that are good but not required because they involve significant personal cost. *If* these modifications are accepted, utilitarianism *can* accommodate the phenomena, even if the *distinct category* of supererogation (as traditionally understood with a sharp line) is blurred or transformed.
      *   **Conclusion on Refutation:** The *intuition* that supererogatory acts exist is very strong. A theory that *cannot* make sense of why heroic self-sacrifice isn't *always strictly required* faces a major objection. However, calling it a definitive "refutation" is too strong. It's a powerful *challenge* that theories must *address* or *accommodate*, often leading to revisions or nuanced interpretations. The sketch's claim ("must be wrong") overstates the case, especially given the defenses available to Kantians and utilitarians.

  **Summary of Safe vs. Unsafe Sentences:**

  *   **Safe to Repeat:** The definition (1), examples (2), distinctive place description (3), theological origin (6), articulation of the paradox (7), the demandingness problem for standard act utilitarianism (11), the existence of the worry about self-indulgence (12), the existence of the worry about dehumanizing moral sainthood (13).
  *   **Needs Rewording/Careful Nuance:** The taxonomy (4 - clarify as a sub-category of permissible), the "realm of the morally optional" (5 - "merely applauds" is slightly weak), the claim that the paradox is "dissolved" (8 - say "addressed" or "requires separating goodness from requirement"), the claim that Kantianism has "no place for the hero" (10 - acknowledge the imperfect duty argument), the conclusion that theories without it "must be wrong" (9 - say "faces a significant challenge" or "is widely considered problematic").
  *   **Mistaken:** The claim that the self-indulgence worry and the dehumanizing saint worry are "basically the same" (14 - they are distinct).

  The core structure of your friend's sketch is sound and captures the key ideas and debates well. The main points needing correction are the taxonomy, the overstatement about the paradox being dissolved, the overstatement about theories lacking supererogation being refuted, and the conflation of the two distinct worries at the end. The defenses available to Kantians and utilitarians mean the sketch's conclusion about refutation does not survive correction intact; it remains a significant challenge, not a knockout blow.
