prompt: |-
  I took my degree in entomology and then spent thirty years in a physiology laboratory; since retiring I have been reading philosophy of mind, and I have reached the point where I need a specification before I read any further. The occasion is the notion that behaviour can be sphexish — mechanically fixed, endlessly repeated — as when the digger wasp drags its paralysed prey to the burrow, leaves it outside while it inspects the nest, and then, if the prey has in the meantime been nudged a few inches away, retrieves it and begins the whole inspection sequence again, indefinitely. What I cannot tell is whether sphexishness marks a real difference in kind among systems, or only a difference in how much of an animal's repertoire the observer happened to sample. So, before I go on: write the desiderata for a theory of behavioural rigidity and flexibility — what such a theory must deliver to be adequate for serious comparative use, i.e. good enough that calling a wasp, a patient, or a program sphexish could be an explanatory remark rather than an insult. I want the cases it must get right (the wasp; the ants that mill themselves to death around a pheromone trail that doubles back; the corvid that bends a hook; the driver who takes the familiar turning without deciding to; the player who calculates), each with the consideration behind it; the distinctions it may not collapse (rigidity of a component mechanism versus of the whole agent; being unable to vary versus having no occasion to vary; a graded capacity versus a difference in kind; a flexible competence exercised rigidly; behaviour that is stereotyped under one description and variable under another); and the findings it cannot contradict, including the persistence of a trained habit after its outcome has been devalued and its reinstatement by its cue, and the learning and context sensitivity displayed by the very animals we call rigid. Say which requirements are non-negotiable and which are the preferences of a particular camp, and whether some subset is jointly unsatisfiable — I suspect that demanding rigidity be intrinsic to the system, and demanding that it be graded and description-relative, cannot both be honoured, but correct me if I am wrong. Finally, which single requirement excludes the most candidates? You needn't cite anything; I can chase the literature myself.
reasoning: |-
  Okay, let me tackle this user's query. They have a background in entomology and physiology, now diving into philosophy of mind. The core question is about "sphexishness"—whether it represents a real categorical difference in behavioral systems or just an observational artifact. They want a framework to evaluate theories of behavioral rigidity vs. flexibility.

  First, I need to unpack their examples. The digger wasp's repetitive behavior, ants in a death spiral, corvids using tools, habitual drivers, and calculating gamers. Each highlights different aspects: instinctual loops, collective rigidity, innovation, automaticity, and deliberate action. The user also mentions key distinctions like component vs. whole-agent rigidity, capacity vs. expression, and description relativity.

  The user's deeper needs seem to be about finding a robust theoretical foundation that avoids oversimplification. They’re wary of false dichotomies and want clarity on whether rigidity is intrinsic or observer-dependent. They also hint at a tension between intrinsic rigidity and description relativity—can a theory satisfy both?

  I recall concepts from comparative psychology and philosophy of mind. The devaluation experiments (e.g., habits persisting after outcome devaluation) suggest dissociation between behavior and current goals. Meanwhile, neuroplasticity and context sensitivity in "rigid" systems challenge binary views.

  Key desiderata must include: handling both fixed and flexible behaviors across species, accommodating graded capacities, respecting multiple description levels, and not collapsing key distinctions. The non-negotiable? Any theory must explain persistence after devaluation—it’s empirically solid. Description relativity is also crucial; a behavior can be rigid in one frame but flexible in another.

  The toughest requirement might be integrating context sensitivity with intrinsic mechanisms. For example, if a system’s rigidity is context-dependent, how intrinsic is it? This might exclude theories that are too mechanistic or too observer-relative. 

  I should also note possible tensions. If rigidity is purely intrinsic, how can it be description-relative? Maybe the solution is multi-level explanations: neural mechanisms vs. behavioral descriptions. But that’s tricky. The user’s suspicion seems valid—some theories might not reconcile both.

  Finally, the single most exclusionary criterion? Persistence after devaluation. It rules out simple associative models and demands a hierarchical control perspective. 

  I’ll structure the answer around desiderata, cases, distinctions, and constraints. Highlighting non-negotiables like devaluation and description-relativity, while flagging the intrinsic vs. graded tension as a potential dealbreaker for some theories. The user can then dive into literature with these filters in mind.
answer: |-
  Here is a specification for a theory of behavioural rigidity and flexibility ("sphexishness"), designed for robust comparative use:

  **Core Desiderata: What the Theory MUST Deliver**

  1.  **Handle the Core Cases Correctly:**
      *   **Digger Wasp (Sphex):** Must explain the *apparent infinite loop* triggered by specific environmental manipulation (prey displacement), despite the wasp's ability to complete the sequence successfully under normal conditions. *Consideration:* Highlights action sequences that are robustly elicited by specific cues but lack online monitoring/updating of sub-goal completion or environmental changes during the sequence.
      *   **Circular Mill Ants:** Must explain how highly coordinated, self-reinforcing collective behaviour can emerge from individually simple rules, leading to maladaptive outcomes when environmental cues create a closed loop. *Consideration:* Demonstrates rigidity arising from positive feedback in cue-response mechanisms within a decentralized system, where individual flexibility is insufficient to break the pattern.
      *   **Hook-Bending Corvid (e.g., New Caledonian Crow):** Must explain the capacity for *novel tool fabrication and use* to solve a novel problem, demonstrating planning, causal understanding, and motor innovation. *Consideration:* Represents the ability to generate genuinely new, adaptive behavioural sequences not pre-programmed or solely triggered by immediate cues.
      *   **Habitual Driver:** Must explain the execution of a complex, goal-directed action sequence (turning) *without conscious deliberation or current goal evaluation*, triggered by context (route familiarity, location). *Consideration:* Illustrates *automaticity* – learned sequences becoming highly efficient and cue-driven, bypassing higher-level control *in specific contexts*, yet potentially interruptible.
      *   **Calculating Player (Chess/Go):** Must explain highly *deliberate, serial, rule-based* manipulation of abstract representations to achieve a distant goal, involving evaluation, planning, and suppression of impulsive moves. *Consideration:* Represents cognitive control, working memory, and abstract reasoning overriding simpler associative or habitual responses.

  2.  **Respect Critical Distinctions (Must NOT Collapse):**
      *   **Mechanism vs. Agent Rigidity:** A theory must distinguish between a *specific subroutine* (like the wasp's "inspect burrow" module) being rigid and the *entire agent* being rigid. An agent with many rigid modules can still exhibit overall flexibility if control systems can select and sequence them appropriately.
      *   **Inability vs. Lack of Occasion:** Rigidity means the system *cannot* vary its response appropriately when variation is required for success (like the wasp with displaced prey). It is distinct from a system that *could* vary but simply hasn't encountered a situation demanding it (e.g., a flexible animal in a constant environment).
      *   **Graded Capacity vs. Categorical Kind:** The theory must accommodate that flexibility/rigidity exists on spectra *within* and *across* domains (e.g., an animal flexible in foraging but rigid in mating rituals) without *necessarily* requiring a single, absolute categorical divide between "sphexish" and "non-sphexish" systems. It should allow for the possibility of thresholds or qualitative shifts without mandating them universally.
      *   **Flexible Competence, Rigid Expression:** It must account for systems possessing the *underlying competence* for variation but expressing it rigidly due to factors like strong habit strength, overwhelming stimulus salience, or impaired control (e.g., addiction, strong habits, some OCD behaviours).
      *   **Description Relativity:** Behaviour can be rigid *under one description* (e.g., motor sequence of prey dragging) but variable *under another* (e.g., location of prey retrieval, timing relative to sun). The level of abstraction is crucial.

  3.  **Account for Key Empirical Findings (Must NOT Contradict):**
      *   **Persistence after Devaluation:** Habits persist even when the outcome has been devalued (e.g., satiated, paired with illness) and are reinstated by their cue. *This is non-negotiable.* It demonstrates cue-driven behaviour dissociated from current motivation/goal value.
      *   **Reinstatement by Cue:** Rigid/habitual behaviours are powerfully triggered by specific environmental cues, even after extinction or devaluation.
      *   **Learning & Context Sensitivity in "Rigid" Systems:** Animals like insects exhibit impressive learning (associative, operant, spatial), including context-dependent learning. Their behaviour adapts over time and varies with context. *A theory cannot depict them as universally inflexible automatons.*
      *   **Neurobiological Dissociations:** Evidence for distinct neural substrates supporting habitual/automatic vs. goal-directed/flexible actions (e.g., basal ganglia circuits vs. prefrontal cortex engagement). The theory should be compatible with mechanistic implementation.

  **Non-Negotiables vs. Theoretical Preferences:**

  *   **Non-Negotiables:**
      1.  **Must explain Persistence after Devaluation & Reinstatement by Cue.** This is a bedrock empirical phenomenon defining habitual/rigid processes.
      2.  **Must respect Description Relativity.** Behaviour is always described at some level; rigidity is not an observer-independent property of the raw movement.
      3.  **Must accommodate Learning & Context Sensitivity in "Rigid" Agents.** Denying this contradicts vast evidence.
      4.  **Must distinguish Mechanism Rigidity from Agent Rigidity.** Conflating them leads to category errors.
      5.  **Must handle the Core Cases** without gross distortion or dismissal.

  *   **Theoretical Preferences (Camps may differ):**
      1.  **Graded vs. Categorical:** Whether rigidity/flexibility is fundamentally a continuum or involves distinct types/systems (e.g., dual-process theories).
      2.  **Intrinsic Property vs. Relational Property:** Whether rigidity is solely a property of the internal mechanism or inherently involves the *relationship* between the mechanism and the range of environments it encounters/is tested in.
      3.  **Level of Explanation:** Heavy emphasis on cognitive representations vs. dynamical systems/embodied cognition vs. neural mechanisms vs. evolutionary function.
      4.  **Role of Consciousness:** The necessity (or not) of conscious access/control for flexibility.

  **The Tension: Intrinsic Rigidity vs. Description Relativity & Gradedness**

  Your suspicion is **largely correct**. Demanding that rigidity be an *intrinsic, categorical property of the system itself*, independent of description *and* demanding that it be fundamentally graded and description-relative, creates significant tension.

  *   **Intrinsic/Categorical View:** Favours finding a specific neural or computational signature *inside the system* that defines a behaviour as rigid (e.g., specific circuit activation, lack of model-based planning). This struggles with Description Relativity (is the *neural pattern* rigid, or the *described behaviour*?) and Gradedness (is the circuit fully engaged or partially?).
  *   **Description-Relative/Graded View:** Sees rigidity as an attribute assigned to a *description* of behaviour *in a specific context*. What's rigid under a fine-grained motor description might be flexible under a functional description. Rigidity exists on spectrums. This struggles with defining something as intrinsically "sphexish" – it's always relative to the observer's lens and the test environment.

  **Resolution Path (Possible for a Theory):** A successful theory likely needs to be **multi-level**. It could propose:

  1.  **Intrinsic Mechanisms:** Specific *types* of underlying processes (e.g., direct cue-response associations, fixed action patterns, highly trained habits) that have a *propensity* towards rigidity under certain descriptions and in certain contexts. These mechanisms are intrinsic.
  2.  **Relational Emergence:** The *manifestation* of rigidity (as observed behaviour under a specific description) emerges from the *interaction* of these intrinsic mechanisms with the *specific environmental structure and demands*. The *degree* of rigidity observed can be graded depending on the test.
  3.  **Control Hierarchy:** Rigidity at one level (e.g., a motor subroutine) can be embedded within flexible control at a higher level (e.g., whether to initiate the sequence). The "agent's" rigidity depends on the highest level of control engaged.

  **The Single Most Exclusionary Requirement:**

  **Persistence after Devaluation & Reinstatement by Cue.**

  This requirement immediately excludes:

  1.  **Simple Associative Models:** Models relying purely on current stimulus-response (S-R) strength or current outcome value (e.g., basic Thorndikean law of effect) cannot explain why behaviour persists when the outcome is devalued. They predict behaviour should cease.
  2.  **Purely Goal-Directed/Model-Based Theories:** Theories positing that behaviour is *always* driven by a current evaluation of the desired outcome and the causal model of how actions achieve it. These predict devaluation should immediately stop the behaviour.
  3.  **Theories Denying Cue-Elicitation:** Theories that cannot account for the powerful eliciting role of specific environmental cues independent of current goals.

  This phenomenon forces the theory to incorporate a mechanism for behaviour that is *cue-driven and decoupled from current motivational state* – the hallmark of the rigid processes exemplified by sphexishness, habits, and automaticity. Any theory failing to explain this fundamental dissociation is inadequate for serious comparative use of the concept. This requirement does the heaviest lifting in filtering candidate theories.

  This specification provides the necessary grounding to critically evaluate existing theories (e.g., dual-process models, hierarchical reinforcement learning, perceptual control theory, embodied/dynamical approaches) and future proposals in philosophy of mind, psychology, neuroscience, and AI concerning behavioural rigidity and flexibility.
