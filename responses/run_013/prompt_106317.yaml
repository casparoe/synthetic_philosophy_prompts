prompt: |-
  Two philosophers of probability have spent years arguing past each other about uncertain evidence, and have now agreed to write, jointly, the document their exchange should have produced. One holds that all genuine learning by a Bayesian agent is conditionalization on a proposition the agent comes to accept with certainty, so that an apparent redistribution of credence across a partition, with no proposition becoming certain, is either really conditioning on some higher-order proposition about the agent's own state, or else not learning at all but a change in the agent's input that falls outside the scope of any rule of learning. The other holds that uncertain evidence is a genuine and irreducible category: an agent may redistribute credence across the members of a partition without becoming certain of any of them, and the rule governing that shift takes her prior conditional probabilities given each member of the partition as fixed and reweights them by her new probabilities over the partition, recovering ordinary conditioning when the new distribution over the partition places all its weight on one member.

  Draft their joint statement. It should contain the following.

  1. A numbered list of claims both sides can sign: the two rules and the exact relation between them; what the rigidity requirement on the prior conditional probabilities says and what it does not say; the precise statement of what happens when two successive uncertain shifts are made with respect to different partitions, including whether and when the result depends on the order in which they are made; the correct formulation of the diachronic Dutch book argument that has been offered on behalf of the uncertain-evidence rule, stated only as far as its formal conclusion goes; and what the object of an uncertain shift is — a proposition, a partition, or a distribution over a partition. No agreed claim should be so weak that either side's view would survive its denial.

  2. A disagreements table. Each row is a single sub-question on which the two still differ. For each row give: the sub-question in neutral wording; each side's own formulation of its answer, written so that the side in question would accept the wording as its own; and a note on whether the disagreement is genuine or merely verbal, with a reason.

  3. The cruxes: the sub-questions such that settling one would move at least one side. For each crux, give a case or argument that both sides accept as bearing on it, and record in advance what each side predicts the case shows. Consider, and either adopt or replace with better ones, the following candidates: whether the rigidity requirement is a constraint that follows from the concept of evidence or an empirical assumption that can fail; whether avoiding a diachronic Dutch book is a requirement of rationality or merely a property of a coherent policy; and whether the certainty camp's reduction of uncertain evidence to conditioning on a higher-order proposition preserves the content of what is learned.

  4. A short adjudication of three cases, each handled separately, with each side's verdict stated in its own terms. (a) A report: an agent's only change is that her credence in the content of a source's report rises, while her estimate of the source's reliability is unchanged and independent — is she updating on uncertain evidence about the report's content, or conditioning on the proposition that the source issued the report? (b) A drift: over an hour, with no proposition she would say she has newly come to believe, an agent's credence in a hypothesis about her immediate surroundings slides upward as a sensation changes — learning, or not? (c) A self-doubting channel: an agent treats a signal as uncertain evidence about a hypothesis, but also treats that same signal as evidence about whether the channel producing it is reliable, so the signal bears at once on the hypothesis and on the trustworthiness of the evidence about the hypothesis — state whether the rigidity requirement has a well-defined application here, what each side says the correct update is, and whether the case forces either side to revise a claim it made in section 1.

  5. A closing paragraph identifying any part of the dispute that would dissolve if the two sides settled on a definition, and any part that would survive such agreement.

  Write the whole document in the two philosophers' shared voice, as a text both could put their names to.
reasoning: |-
  We are two philosophers of probability who have long debated the nature of learning under uncertainty. After years of argument, we now present a joint statement that clarifies both our agreements and our remaining disagreements. We hope this document will advance the discussion by distinguishing verbal from substantive disputes and by identifying the cruxes that future work might resolve.

  ## 1. Agreed Claims

  Both sides agree on the following formal claims:

  1. **The Two Rules**: 
     - **Conditionalization (Certain Evidence)**: When an agent becomes certain of a proposition \(E\) (where \(E\) has positive prior probability), the agent updates by conditioning on \(E\). The new credence function \(P_{\text{new}}\) is given by:
       \[
       P_{\text{new}}( \cdot ) = P_{\text{old}}( \cdot \mid E)
       \]
     - **Generalized Conditioning (Uncertain Evidence)**: When an agent undergoes an uncertain shift with respect to a partition \(\mathcal{P} = \{H_1, H_2, \dots, H_n\}\) (where each \(H_i\) has positive prior probability), the agent adopts a new probability distribution \(Q\) over \(\mathcal{P}\). The new credence function \(P_{\text{new}}\) is given by:
       \[
       P_{\text{new}}( \cdot ) = \sum_{i} Q(H_i) \cdot P_{\text{old}}( \cdot \mid H_i)
       \]
       This rule is sometimes called "Jeffrey conditioning" or "probability kinematics".

  2. **Relation Between the Rules**: 
     Ordinary conditionalization is a special case of generalized conditioning, occurring when \(Q\) is concentrated on a single element of the partition (i.e., when there exists an \(H_k\) such that \(Q(H_k) = 1\)).

  3. **Rigidity Requirement**:
     - The prior conditional probabilities \(P_{\text{old}}(\cdot \mid H_i)\) for each \(H_i\) in the partition remain fixed in the update. That is, for any proposition \(A\), \(P_{\text{new}}(A \mid H_i) = P_{\text{old}}(A \mid H_i)\) for each \(i\).
     - This requirement does **not** say that the conditional probabilities given any other proposition (outside the partition) must remain fixed. In particular, it does not require that \(P_{\text{new}}(A \mid B) = P_{\text{old}}(A \mid B)\) for arbitrary \(B\).

  4. **Successive Shifts on Different Partitions**:
     - Suppose an agent first undergoes an uncertain shift with respect to partition \(\mathcal{P}\) and then with respect to partition \(\mathcal{Q}\). The result of these successive updates depends on the order of the shifts unless the partitions are such that the rigidity conditions are compatible across the updates. In general, the order matters: updating first on \(\mathcal{P}\) then on \(\mathcal{Q}\) need not yield the same result as updating first on \(\mathcal{Q}\) then on \(\mathcal{P}\).
     - A sufficient condition for order-invariance is that the two partitions are independent in the prior and each shift preserves the conditional probabilities given the other partition. However, without such conditions, the order of updates may affect the final probabilities.

  5. **Diachronic Dutch Book Argument for Uncertain Evidence**:
     - A diachronic Dutch book can be constructed against an agent who violates the generalized conditioning rule in an uncertain shift (under the rigidity assumption). Specifically, if an agent announces in advance a plan to update to a distribution that does not satisfy the generalized conditioning formula (with the rigidity requirement), then a bookie can place a series of bets that the agent will accept at each time but that result in a sure loss. The formal conclusion is that adherence to the generalized conditioning rule is necessary to avoid being vulnerable to a diachronic Dutch book in this scenario.

  6. **Object of an Uncertain Shift**:
     - An uncertain shift is defined relative to a partition \(\mathcal{P}\) and a new probability distribution \(Q\) over that partition. The object is not a proposition, but the pair \((\mathcal{P}, Q)\). The partition \(\mathcal{P}\) must be one for which the rigidity requirement holds.

  ## 2. Disagreements Table

  The following table summarizes our remaining disagreements. For each sub-question, we provide both our answers and a note on whether the disagreement is genuine or verbal.

  | Sub-question | Certainty Camp (Camp C) | Uncertain Evidence Camp (Camp U) | Genuine or Verbal? | Reason |
  |--------------|-------------------------|----------------------------------|---------------------|--------|
  | **Q1: Is uncertain evidence reducible to conditioning on a higher-order proposition?** | "Yes: any apparent case of uncertain evidence is either not learning at all or is equivalent to conditioning on a proposition about the agent's own state (e.g., 'I have an experience as of E')." | "No: uncertain evidence is a distinct and irreducible category of learning; it is not equivalent to conditioning on any proposition." | Genuine | Camp C sees no loss in the reduction; Camp U sees a loss of content and a misrepresentation of the learning event. |
  | **Q2: What is the status of the rigidity requirement?** | "Rigidity is an empirical assumption that may fail; it is not a requirement of rationality. An agent may rationally change conditional probabilities without new evidence." | "Rigidity is a constitutive requirement of learning: if the conditional probabilities change, that change must itself be accounted for by further learning, which would require a different update." | Genuine | Camp U sees rigidity as part of the definition of what it is to have evidence about the partition; Camp C sees it as a contingent condition. |
  | **Q3: Is avoiding a diachronic Dutch book a requirement of rationality?** | "Avoiding a sure loss is a minimal requirement of rationality. Thus, the diachronic Dutch book argument shows that violating generalized conditioning is irrational." | "Avoiding a sure loss is a property of a coherent updating policy, but rationality does not require one to follow a policy that avoids Dutch books in all hypothetical scenarios. The argument shows a formal property, not a norm." | Genuine | Camp C takes Dutch books to reveal irrationality; Camp U sees them as a formal feature of a chosen updating rule. |
  | **Q4: Can an agent learn without becoming certain of any proposition?** | "No: all genuine learning involves coming to accept some proposition with certainty (though it may be about the agent's own state)." | "Yes: an agent can learn by redistributing credence over a partition without becoming certain of any of its elements." | Genuine | This is the core dispute about the nature of learning. |
  | **Q5: What is the object of an uncertain shift?** | "The object is a proposition about the agent's experience or state. The partition and distribution are merely tools for representing the shift, but the learning is about a proposition." | "The object is the partition and the new distribution over it. There is no proposition that captures the evidence." | Genuine | Camp C insists that evidence must be propositional; Camp U denies this. |

  ## 3. Cruxes

  We identify the following as cruxes of the debate. For each, we provide a case or argument that both sides accept as relevant, and we state each side's prediction about what the case shows.

  1. **Crux: The Status of Rigidity**  
     - **Case**: Consider an agent who learns via a channel that may be distorted. The agent initially has conditional probabilities \(P(A \mid H_i)\) for a hypothesis partition. After receiving a signal, the agent updates by generalized conditioning. But now, the agent receives further information that the channel was distorted in a way that affects the conditional probabilities.  
     - **Camp C Prediction**: This case shows that rigidity is an empirical assumption that can be overturned by new evidence. The agent must then update again, possibly by conditioning on the new information about the channel.  
     - **Camp U Prediction**: The case shows that the rigidity requirement was part of the initial update. The subsequent information about the channel is a new learning event that requires a new update (possibly on a different partition). Rigidity is not violated; it is a constraint on what counts as an update on a given partition.  
     - **Both sides agree** that this case bears on the question, but they interpret it differently. Camp C sees it as a failure of rigidity, while Camp U sees it as a sequence of two updates.

  2. **Crux: Diachronic Dutch Books and Rationality**  
     - **Argument**: Consider an agent who violates generalized conditioning but does not commit to any updating policy. Can such an agent be Dutch booked?  
     - **Camp C Prediction**: The agent can be Dutch booked only if they commit to an updating rule. Avoiding Dutch books is a constraint only for agents who adopt a policy.  
     - **Camp U Prediction**: Avoiding Dutch books is a requirement for any rational agent, even without a prior commitment. The argument shows that any agent who violates the rule is vulnerable to exploitation.  
     - **Note**: We replace the candidate with a focus on whether avoiding Dutch books is required for rationality per se or only for coherent policies.

  3. **Crux: Reduction and Content Preservation**  
     - **Case**: An agent has an uncertain visual experience that raises the probability of a red apple from 0.3 to 0.7. Camp C says this is conditioning on the proposition "I have a reddish experience". Camp U says it is a shift on the partition {apple is red, apple is not red}.  
     - **Camp C Prediction**: The reduction preserves the content because the experience is captured by the proposition. The shift in probabilities is the same.  
     - **Camp U Prediction**: The reduction loses the content because the experience is not a proposition about the world but a change in the agent's state. The proposition "I have a reddish experience" is a higher-order claim that the agent might doubt, but the evidence itself is the experience.  
     - **Both sides agree** that this case is central. Camp U argues that the reduction introduces an unnecessary and possibly distorting layer of self-ascription.

  ## 4. Adjudication of Cases

  We now apply our views to three cases.

  **(a) A Report**:  
  - **Description**: An agent initially has credence \(P_{\text{old}}(R)\) in the reliability of a source and \(P_{\text{old}}(C)\) in the content of the report. The source issues a report, and the agent's credence in \(C\) rises to a new value, while her estimate of the source's reliability remains unchanged and is independent of \(C\).  
  - **Camp C**: This is conditioning on the proposition that the source issued the report. The rise in credence in \(C\) is a consequence of conditioning on that proposition.  
  - **Camp U**: This is an update on uncertain evidence about \(C\) (with the partition being \(\{C, \neg C\}\)). The new distribution over the partition is set directly, and the rigidity of the conditional probabilities (given \(C\) and \(\neg C\)) is assumed.  
  - **Note**: Both sides agree that the update can be modeled either way, but they interpret what the agent is doing differently.

  **(b) A Drift**:  
  - **Description**: Over an hour, an agent's credence in a hypothesis \(H\) about her immediate surroundings gradually slides upward as a sensation changes. The agent does not become certain of any proposition.  
  - **Camp C**: This is not genuine learning. It may be a change in the agent's inputs (e.g., a change in the sensory field) that falls outside the scope of updating rules. Alternatively, it might be conditioning on a sequence of propositions about the sensation at each time.  
  - **Camp U**: This is a continuous case of learning by uncertain evidence. The agent is updating her credence in \(H\) as the evidence (the sensation) changes, but without ever becoming certain.  
  - **Note**: The disagreement reflects their core views on whether learning requires certainty.

  **(c) A Self-Doubting Channel**:  
  - **Description**: An agent receives a signal \(S\) which she treats as uncertain evidence about a hypothesis \(H\). However, she also treats \(S\) as evidence about the reliability of the channel (i.e., about whether the channel is reliable for \(H\)). Thus, \(S\) bears on \(H\) and on the trustworthiness of the evidence about \(H\).  
  - **Rigidity Application**:  
    - Camp U: The rigidity requirement does not have a well-defined application here because the same signal is used to update on two different partitions. The agent must update on a joint partition that includes both \(H\) and the reliability of the channel.  
    - Camp C: The agent conditions on the proposition that the signal \(S\) occurred. Then, the update on \(H\) and on the channel's reliability is done by conditioning on that proposition.  
  - **Correct Update**:  
    - Camp U: The agent should update on the partition \(\mathcal{P} = \{H \land \text{reliable}, H \land \neg\text{reliable}, \neg H \land \text{reliable}, \neg H \land \neg\text{reliable}\}\). The signal \(S\) provides a new distribution over this partition.  
    - Camp C: The agent conditions on \(S\).  
  - **Revision of Section 1 Claims?**:  
    - Camp U: This case does not force a revision. It shows that when evidence bears on multiple issues, the partition must be chosen appropriately.  
    - Camp C: This case confirms their view: the agent conditions on \(S\). The rigidity requirement is not needed.  
  - **Note**: Both sides handle the case without revising their claims in section 1.

  ## 5. Closing

  Some parts of our dispute would dissolve if we agreed on definitions. For example, if we both accepted that "evidence" must be propositional, then Camp U would have to reframe their view. Conversely, if we both accepted that evidence can be non-propositional, Camp C would have to reconsider. However, the core disagreement about whether learning requires certainty would survive such definitional agreement. That issue turns on deeper questions about the nature of belief and evidence. We hope that by clarifying our agreements and disagreements, we have set the stage for further progress on these questions.

  [Signed]  
  Philosopher C (Certainty Camp)  
  Philosopher U (Uncertain Evidence Camp)
answer: |-
  ## Joint Statement on Learning Under Uncertainty

  We, the undersigned, after extensive debate, present this joint document to clarify our agreements and disagreements on the nature of Bayesian learning. We concur on formal aspects of updating rules but diverge on their interpretation, metaphysics, and scope. This statement aims to disentangle verbal from substantive disputes and identify unresolved cruxes.

  ### 1. Agreed Claims  
  Both parties endorse the following:  

  1. **The Two Rules**:  
     - **Conditionalization (Certain Evidence)**: If an agent becomes certain of a proposition \(E\) (with \(P_{\text{old}}(E) > 0\)), their posterior credence for any proposition \(A\) is \(P_{\text{new}}(A) = P_{\text{old}}(A \mid E)\).  
     - **Generalized Conditioning (Uncertain Evidence)**: If an agent redistributes credence over a partition \(\mathcal{P} = \{H_1, \dots, H_n\}\) (with \(P_{\text{old}}(H_i) > 0\)) to new probabilities \(Q(H_i)\), their posterior credence is \(P_{\text{new}}(A) = \sum_i Q(H_i) \cdot P_{\text{old}}(A \mid H_i)\), provided rigidity holds (see below).  

  2. **Relation Between the Rules**:  
     Generalized conditioning reduces to conditionalization when \(Q(H_k) = 1\) for some \(H_k \in \mathcal{P}\).  

  3. **Rigidity Requirement**:  
     - **What it says**: For all \(H_i \in \mathcal{P}\) and all propositions \(A\), \(P_{\text{new}}(A \mid H_i) = P_{\text{old}}(A \mid H_i)\). Rigidity is a constraint on the update: conditional probabilities given each \(H_i\) must remain invariant.  
     - **What it does not say**: Rigidity does not require preservation of \(P(A \mid B)\) for arbitrary \(B \notin \mathcal{P}\), nor does it preclude changes to conditional probabilities given propositions outside \(\mathcal{P}\).  

  4. **Successive Shifts on Different Partitions**:  
     - Two successive uncertain shifts (first on \(\mathcal{P}\), then on \(\mathcal{Q}\)) yield order-dependent results unless the partitions are such that the rigidity conditions for \(\mathcal{P}\) and \(\mathcal{Q}\) commute. Specifically, if \(P_{\text{old}}(A \mid H_i \cap K_j)\) is preserved under both updates for all \(H_i \in \mathcal{P}\), \(K_j \in \mathcal{Q}\), and propositions \(A\), then order does not matter. Otherwise, order affects the outcome.  

  5. **Diachronic Dutch Book Argument (for Generalized Conditioning)**:  
     - **Formal conclusion**: An agent who violates generalized conditioning (under rigidity) is vulnerable to a diachronic Dutch book: a sequence of bets, acceptable at different times, that guarantees a net loss.  

  6. **Object of an Uncertain Shift**:  
     An uncertain shift is defined by a **partition** \(\mathcal{P}\) and a **distribution** \(Q\) over \(\mathcal{P}\). It is not defined by a single proposition or by \(Q\) alone.  

  ### 2. Disagreements Table  
  The table below catalogs persistent disagreements. Wording reflects each side’s self-expression.  

  | Sub-question | Certainty Camp (C) | Uncertain Evidence Camp (U) | Genuine or Verbal? | Reason |  
  |--------------|-------------------|----------------------------|-------------------|--------|  
  | **Is learning without certainty possible?** | "All genuine learning is conditionalization on a proposition accepted with certainty; non-certain shifts are either higher-order conditioning or non-rational changes." | "Learning can occur via uncertain evidence: redistribution over a partition without certainty in any member, governed by generalized conditioning." | Genuine | C denies non-certain learning is possible; U affirms it. |  
  | **Must rigidity hold?** | "Rigidity is an empirical condition that may fail; violation indicates new learning or error, not irrationality." | "Rigidity is constitutive of learning: if \(P(A \mid H_i)\) changes, it reflects further evidence, requiring a separate update." | Genuine | C sees rigidity as contingent; U as a norm of evidence. |  
  | **What does avoiding Dutch books signify?** | "Avoiding Dutch books is a minimal consistency condition for rational updating policies." | "Avoiding Dutch books is a formal property of coherent policies, not a rationality requirement per se." | Genuine | C ties rationality to Dutch-book immunity; U sees it as a consistency feature. |  
  | **Can uncertain evidence be reduced?** | "Uncertain evidence reduces to conditioning on a higher-order proposition (e.g., about experiences)." | "Uncertain evidence is irreducible; reduction mischaracterizes the content of learning." | Genuine | C asserts reducibility without loss; U denies reducibility preserves content. |  
  | **What is evidence?** | "Evidence is propositional; learning updates on propositions." | "Evidence can be non-propositional; learning updates on partitions and distributions." | Verbal | Dispute hinges on defining 'evidence'; both agree on formal rules. |  

  ### 3. Cruxes  
  Settling these would shift positions. Cases/arguments are accepted by both as relevant.  

  1. **Crux: Status of Rigidity**  
     - **Case**: An agent updates on uncertain evidence for partition \(\mathcal{P} = \{H_1, H_2\}\), assuming rigidity. Later, they learn \(H_1\) implies \(P_{\text{old}}(A \mid H_1)\) was miscalculated.  
     - **C’s prediction**: Rigidity fails empirically; the agent must re-update.  
     - **U’s prediction**: Rigidity holds for the initial update; new learning requires a fresh shift.  
     - **Role**: Tests whether rigidity is a normative or empirical constraint.  

  2. **Crux: Diachronic Dutch Books and Rationality**  
     - **Argument**: An agent violates generalized conditioning but avoids Dutch books by randomizing updates.  
     - **C’s prediction**: Randomization is irrational; Dutch-book vulnerability reveals irrationality.  
     - **U’s prediction**: Avoiding Dutch books is policy-dependent; randomization isn’t irrational.  
     - **Role**: Challenges if Dutch-book immunity is necessary for rationality.  

  3. **Crux: Reduction and Content Preservation**  
     - **Case**: Agent sees a blurry shape, shifting \(P(\text{‘Cat’})\) from 0.3 to 0.7. C reduces this to conditioning on "I have a cat-like experience."  
     - **C’s prediction**: Reduction preserves content: same credence shift, same epistemic state.  
     - **U’s prediction**: Reduction distorts content: the experience is not identical to a self-ascriptive belief.  
     - **Role**: Decides if reduction captures the "what" of learning.  

  ### 4. Case Adjudications  

  **(a) A Report**  
  - **Description**: Agent’s credence in report content \(C\) rises; reliability credence and independence are unchanged.  
  - **C**: Conditioning on "Source reported \(C\)." Higher-order proposition accepted with certainty.  
  - **U**: Uncertain evidence shift for partition \(\{C, \neg C\}\). \(Q(C)\) increases; rigidity fixes conditionals.  
  - **Note**: Both accommodate the case; no claim in §1 is revised.  

  **(b) A Drift**  
  - **Description**: Over an hour, \(P(H)\) drifts up with a changing sensation; no proposition is newly believed.  
  - **C**: Not learning. A non-rational "input change" (e.g., sensory drift) outside updating rules.  
  - **U**: Learning via continuous uncertain evidence. A limit case of generalized conditioning.  
  - **Note**: Reflects core disagreement on certainty (§2, Row 1).  

  **(c) A Self-Doubting Channel**  
  - **Description**: Signal \(S\) is evidence for hypothesis \(H\) and for the reliability \(R\) of the channel for \(H\).  
  - **Rigidity Application**:  
    - **C**: Rigidity ill-defined. Agent conditions on \(S\) (a proposition).  
    - **U**: Rigidity applies only if partition includes \(H\) and \(R\) jointly (e.g., \(\{H \land R, H \land \neg R, \neg H \land R, \neg H \land \neg R\}\)).  
  - **Correct Update**:  
    - **C**: \(P_{\text{new}}(\cdot) = P_{\text{old}}(\cdot \mid S)\).  
    - **U**: Generalized conditioning on the joint partition, with \(Q\) set by the agent’s response to \(S\).  
  - **Revision of §1?**:  
    - **C**: No revision; §1’s rigidity requirement is not fundamental.  
    - **U**: No revision; case confirms rigidity requires appropriate partitions.  

  ### 5. Closing  
  Definitional agreement on "evidence" (propositional or not) would resolve verbal disputes (e.g., §2, Row 5) but not genuine ones. The core disagreement—whether learning demands certainty—would persist, as it stems from divergent views on the metaphysics of belief and evidence. We concur that diachronic coherence (per Dutch books) is important, but we dispute its normative force. Future work should target the cruxes, especially content preservation and rigidity’s status, through cases where reduction fails or rigidity empirically breaks.  

  ---  
  **Signed**,  
  Philosopher of the Certainty Camp  
  Philosopher of the Uncertain Evidence Camp
