prompt: |-
  Henry Sidgwick spent years evaluating testimony about apparitions, telepathy, and survival while insisting that psychical research be held to ordinary evidential standards and that ethical judgment be impartial. Compare the two main explanatory strategies available to him for apparitions of the dying that apparently convey veridical information—survival of the deceased versus telepathy among the living—under a distinction I have been calling ontological economy versus testimonial fit. Say which strategy Sidgwick's evidential caution and ethical impartiality would favor, where the comparison turns on a value judgment rather than a fact, and what would have to be true for the other strategy to win. Answer as exactly five numbered points, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking about Henry Sidgwick's approach to apparitions of the dying, specifically comparing survival versus telepathy explanations through the lens of ontological economy and testimonial fit. They want me to analyze how Sidgwick's principles would influence his preference between these explanatory strategies.

  Sidgwick emphasized both evidential caution and ethical impartiality in psychical research. Ontological economy means preferring explanations that don't introduce new entities (like surviving souls), while testimonial fit means prioritizing explanations that best match witness accounts (like apparitions conveying specific information).

  The user wants exactly five numbered points about which strategy Sidgwick would favor and under what conditions the alternative might win. I need to be concise and structured.

  Considering Sidgwick's values: His evidential caution would lean toward ontological economy to avoid unnecessary assumptions. His ethical impartiality might push toward testimonial fit since apparitions often involve personal messages that telepathy could explain without survival.

  The key is recognizing the value judgment involved - ontological economy prioritizes theoretical simplicity, while testimonial fit values experiential accuracy. For telepathy to win under Sidgwick's framework, it would need to become theoretically simpler or evidentially stronger.

  I'm structuring five points: First establishing Sidgwick's likely preference based on his principles, then clarifying it's a value choice, then what would make telepathy win, followed by specific conditions for that shift, and finally noting the evidence threshold.

  I'm ensuring each point is one to two sentences as requested, covering all aspects without introduction or conclusion. This should give the user a clear, philosophical analysis of Sidgwick's probable stance and the contingencies involved.
answer: |-
  1.  Sidgwick's evidential caution, demanding adherence to ordinary standards and avoiding unnecessary entities, strongly favors the telepathy explanation due to its ontological economy, as it explains apparitions using only known, living minds.
  2.  His ethical impartiality, seeking unbiased evaluation, might seem neutral but actually reinforces favoring telepathy, as survival hypotheses often carry strong prior emotional or ethical weight demanding extra scrutiny under caution.
  3.  The choice between ontological economy (favoring telepathy) and testimonial fit (favoring survival for better explaining specific veridical details) ultimately involves a value judgment on whether theoretical simplicity or explanatory adequacy for the data is paramount.
  4.  For the survival hypothesis to win under Sidgwick's principles, telepathy would need to be proven theoretically incoherent or empirically impossible, eliminating it as a viable, ontologically economical alternative explanation.
  5.  Alternatively, survival could win if evidence for veridical information in apparitions became so overwhelming and inexplicable by any living-agent telepathy that accepting a new ontological entity (surviving consciousness) became the *less* extravagant option under evidential caution.
