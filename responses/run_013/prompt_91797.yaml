  ### Principle for Evaluating Games with Undefined Expected Value

  The principle that addresses your concerns and provides a consistent framework for decision-making is based on the **absolute convergence of the expected value** and the use of **expected utility theory** when absolute convergence fails. Here it is stated precisely:

  **Principle:**  
  The expected monetary value of a game is well-defined only if the expected absolute payoff is finite, i.e., \( \mathbb{E}[|X|] < \infty \). If \( \mathbb{E}[|X|] < \infty \), then the expectation \( \mathbb{E}[X] \) is well-defined and can be used as the fair price under risk neutrality. If \( \mathbb{E}[|X|] = \infty \), the expected monetary value is undefined, and decisions should be based on expected utility with a concave utility function \( u \) (reflecting risk aversion and diminishing marginal utility of money) for which \( \mathbb{E}[|u(X)|] < \infty \). The fair price is then the certainty equivalent derived from \( \mathbb{E}[u(X)] \).

  ### How This Principle Saves Your Verdicts
  This principle is designed to resolve inconsistencies in your intuitions while adhering to standard decision theory. Below, I explain how it addresses each of your verdicts, which clauses save them, and where you might need to adjust your thinking.

  1. **Coin-tossing game with alternating payoff (payoff = \((-1)^{n+1} \cdot 2^n / n\)):**  
     - **Your verdict:** You would pay about $0.69 (based on \(\ln 2\)) to play, but the expectation depends on summation order, making you nervous. You feel the game has "some value, just not a number," and every outcome is finite with the game ending almost surely.  
     - **Clause that saves it:** The "undefined expectation clause" (since \( \mathbb{E}[|X|] = \infty \)) saves the idea that the expectation is not a well-defined number. This matches your feeling that the value is "not a number." However, your willingness to pay based on \(\ln 2\) is not saved by this principle—it must be dropped or modified.  
     - **Why?** Here, \( \mathbb{E}[|X|] = \sum_{n=1}^\infty \frac{1}{n} = \infty \) (harmonic series divergence), so the expectation is undefined. The \(\ln 2\) value arises from conditional convergence in the natural order (\(n\)), but this is not robust. The principle forces you to use expected utility with a concave \(u\) for a well-defined value, which might differ from \(\ln 2\). For example, with \( u(x) = \log(1 + x) \) (assuming initial wealth covers losses), the expected utility could be finite, but the certainty equivalent may not be \(\ln 2\).

  2. **Cousin game with all positive payoffs (payoff = \(2^n / n\)):**  
     - **Your verdict:** You would rather play the alternating game than this one, even though this game dominates (pays at least as much in every outcome and more when the alternating payoff is negative).  
     - **Clause that saves it:** The "use expected utility clause" saves your preference for the alternating game over this one, but only if your utility function justifies it (e.g., due to risk aversion or the perception of infinite expectations as less valuable). However, the dominance aspect (this game pays more in every outcome) cannot be fully saved under increasing utility—this verdict must be dropped or seen as inconsistent.  
     - **Why?** \( \mathbb{E}[|X|] = \sum_{n=1}^\infty \frac{1}{n} = \infty \), so monetary expectation is undefined. With utility, \( \mathbb{E}[u(X)] \) can be finite (e.g., with \( u(x) = \log x \), \( \mathbb{E}[\log X] \) is finite). But since the cousin game dominates the alternating one, \( X_{\text{cousin}} \geq X_{\text{alternating}} \) pointwise, so for any increasing \( u \), \( \mathbb{E}[u(X_{\text{cousin}})] \geq \mathbb{E}[u(X_{\text{alternating}})] \). Preferring the alternating game violates this, so you must drop this verdict unless your utility function is not increasing (e.g., if losses in the alternating game are less aversive than the cousin game's unbounded gains under risk aversion). The principle "saves" your gut feeling by attributing it to utility effects, but the dominance violation is irrational under standard assumptions.

  3. **St. Petersburg game (payoff = \(2^n\) for first heads on toss \(n\)):**  
     - **Your verdict:** With infinite expectation, you would only pay a few dollars due to diminishing marginal utility of money.  
     - **Clause that saves it:** The "diminishing returns clause" (using expected utility with concave \(u\)) saves your low willingness to pay. For example, with \( u(x) = \log x \), \( \mathbb{E}[u(X)] \) is finite, yielding a certainty equivalent of about $2-4.  
     - **Why?** \( \mathbb{E}[|X|] = \infty \), so monetary expectation is undefined. Expected utility resolves the paradox, matching your focus on diminishing returns.

  4. **General view on games with undefined expectation but finite outcomes:**  
     - **Your verdict:** Such games have "some value, just not a number."  
     - **Clause that saves it:** The "undefined expectation clause" (when \( \mathbb{E}[|X|] = \infty \)) directly saves this, as the principle states that no single monetary value is well-defined. Value comes from expected utility, which is a "some value" concept.

  ### Predictions for Unlisted Cases
  The principle provides clear predictions for other scenarios:

  - **Game whose terms can be reordered to give expectation 0:**  
    If a game has a payoff structure where the series for expectation is conditionally convergent (e.g., similar to the alternating game but reordered), the principle treats reordering as defining a different game. For example:
    - Original game (natural order \(n\)): Expectation might converge to some value (e.g., \(\ln 2\)) but is undefined due to \( \mathbb{E}[|X|] = \infty \).
    - "Reordered" game (payoffs reassigned to different \(n\)): This is a new game with its own expectation. If the reordered series sums to 0 in natural order, but \( \mathbb{E}[|X|] = \infty \), the expectation is still undefined. Decisions require expected utility, and the certainty equivalent might differ (e.g., not 0).  
    **Prediction:** No value is assigned monetarily; use expected utility for both games. The reordering changes the game, so your nervousness about the same game having different expectations is mitigated—reordering implies a different random variable.

  - **Pair of games with undefined expectation and neither dominates:**  
    Suppose Game A and Game B both have \( \mathbb{E}[|X|] = \infty \), and neither dominates the other (i.e., neither pays at least as much in every outcome).  
    **Prediction:** The principle requires expected utility for comparison. \( \mathbb{E}[u(X)] \) is computed for each, and the game with higher expected utility is preferred. For example:
    - Game A: Payoff \( (-1)^{n+1} \cdot 2^n / n \) (undefined expectation).
    - Game B: Payoff \( 2^n / n^2 \) ( \( \mathbb{E}[|X|] = \sum \frac{1}{n} = \infty \), but \( \mathbb{E}[X] \) diverges slower).  
    With utility, one might have higher \( \mathbb{E}[u(X)] \) based on the distribution (e.g., Game B might be preferred if it has less extreme outcomes).

  ### Which Verdicts Cannot Be Kept and Why
  The principle cannot fully preserve all your verdicts without inconsistency. Here's what you must give up and why:

  - **Paying based on \(\ln 2\) for the alternating game:**  
    You must drop this verdict. The principle states that since \( \mathbb{E}[|X|] = \infty \), the expectation is undefined, and \(\ln 2\) is an artifact of conditional convergence in one ordering. Relying on it ignores the reordering issue and the lack of absolute convergence. Instead, you must use expected utility, which could yield a different value (e.g., if you are risk-averse to losses, the certainty equivalent might be lower than \(\ln 2\)).

  - **Preferring the alternating game to the cousin game despite dominance:**  
    You must drop this verdict or accept that it is irrational under standard assumptions. The cousin game dominates, so for any increasing utility function, it should be preferred or indifferent. Your preference suggests an inconsistency or a specific utility quirk (e.g., extreme aversion to the cousin game's unbounded gains). The principle forces you to use expected utility, which would typically favor the cousin game, so this verdict conflicts unless your utility function is decreasing or non-monotonic (which is unusual).

  ### Why a Simpler Principle Fails
  A simpler principle, such as **"always use the conditional expectation in the natural order,"** might seem appealing but fails to resolve your concerns:
  - **Why it's simpler:** Define \( \mathbb{E}[X] \) as the limit of partial sums in the natural order of outcomes (e.g., toss number \(n\)).
  - **Why it forces you to drop a verdict:** 
    - For the alternating game, it saves \(\ln 2\) and your willingness to pay.
    - For the cousin game, it gives \( \mathbb{E}[X] = \infty \), implying you should pay any amount—but you don't want to, so you'd need utility anyway for this case.
    - For preferring alternating over cousin, it says cousin is infinitely valuable, so you should prefer it, contradicting your verdict. You must drop your preference or the principle.
    - It doesn't resolve the reordering issue: if reordering defines a new game (as above), it might work, but if you insist the game "hasn't changed," the principle breaks down because conditional convergence is order-dependent.
  - **Overall:** This principle is less robust because it doesn't handle the reordering concern cleanly and forces you to accept infinite values for divergent games, which contradicts your St. Petersburg intuition. The absolute convergence principle is more consistent with measure-theoretic probability and expected utility theory.

  ### Final Recommendation
  This principle provides a rigorous foundation: use absolute convergence for well-defined monetary expectations and expected utility otherwise. It saves most of your intuitions but requires you to drop the \(\ln 2\) valuation and the dominance-violating preference, as they are inconsistent with rational choice under standard assumptions. If you keep those verdicts, it suggests a heuristic or context-specific risk attitude (e.g., "conditionally convergent games feel safer than divergent ones"), but this isn't a general principle. For your cases, always specify a concave utility function (e.g., logarithmic) to make decisions coherent.
