answer: |-
  Your hypothesis about the equivocation between **modal-status knowability** and **route-based knowability** is astute and exposes a critical fault line in the Fitch debate. However, this is not *merely* a verbal dispute but a **conceptual divergence that masks deeper disagreements about anti-realist commitments**. Below, I diagnose the core issues, grounded in the actual positions, and outline paths for progress.

  ---

  ### **1. The Equivocation: Two Readings of "Knowable"**
  - **Modal-Status Knowability (Restrictionist Camp: e.g., Tennant, Dummett, Edgington)**  
    "It is possible that S knows that p" (◇Kp) is interpreted as:  
    *There exists some possible world where p is true and an agent knows p.*  
    This is a **bare modal claim** about logical compatibility. Restrictions (e.g., Tennant's "anti-realistically acceptable" propositions) are "principled" here because they exclude propositions like "p ∧ ¬Kp" that are *provably inconsistent with knowability* in any world. The restriction avoids contradiction by excluding pathological cases, preserving the principle for "well-behaved" truths.  

  - **Route-Based Knowability (Anti-Restrictionist Camp: e.g., Williamson, Rosenkranz)**  
    "It is possible that S knows that p" means:  
    *There exists a *feasible epistemic route* (e.g., a method, investigation, or cognitive process) available from the actual world that could yield knowledge of p.*  
    Here, knowability requires **epistemic achievability**. Restrictions appear "ad hoc" because they block Fitch without guaranteeing that *actual* truths (e.g., "there are no Martian cities") have a concrete path to knowledge. The anti-realist’s core project—tying truth to *humanly accessible* knowledge—is undermined if restrictions are motivated solely by logical expediency.  

  **Why the Equivocation Persists**:  
  Restrictionists (e.g., Tennant) frame knowability as a **logical constraint on truth-aptness**, while anti-restrictionists (e.g., Williamson) treat it as an **epistemic constraint on truth-makers**. Both camps use "knowable" as a primitive, but their tacit commitments diverge:  
  - Restrictionists prioritize *consistency* (avoiding collapse) and see Fitch as revealing "defective" propositions.  
  - Anti-restrictionists prioritize *explanatory power*: if knowability doesn’t imply that truths can *actually be known by us*, it fails to ground anti-realism.  

  ---

  ### **2. The Substantive Disagreement Underneath**  
  The equivocation is a symptom of unresolved questions about **anti-realist ontology**:  
  - **What is the modality in "possible"?**  
    Restrictionists use standard modal logic (S4/S5), where possibility is unproblematic. Anti-restrictionists (implicitly) demand a **constructive modality** (e.g., intuitionistic or computational), where possibility requires a warrant or procedure.  
    *Example*: Edgington’s actuality-operator restriction works modally but offers no route to knowing "p ∧ actually ¬Kp" *in the actual world*.  

  - **What must anti-realism explain?**  
    - Restrictionists: Anti-realism requires that *intelligible* truths are knowable in *some* world (blocking skepticism about meaning).  
    - Anti-restrictionists: Anti-realism requires that truths are knowable *by us* (blocking verification-transcendent truth).  
    Fitch’s paradox forces a choice: either abandon the universality of knowability (restrictionists) or abandon non-omniscience (anti-restrictionists). Neither camp accepts the other’s trade-off.  

  ---

  ### **3. The Hidden Formal Question**  
  **Can a restriction preserve both (a) non-collapse (¬∀p(p → Kp)) and (b) the anti-realist’s need to cover all "humanly accessible" truths?**  
  - This question **is well-posed** but rarely addressed formally. A decisive result would require:  
    - Formalizing "epistemic routes" (e.g., as constructive functions or proofs).  
    - Defining a class of propositions C such that:  
      (i) ∀p∈C (p → ◇Kp) is consistent with non-omniscience,  
      (ii) C includes all truths the anti-realist deems "cognitively significant" (e.g., empirical, mathematical, or moral truths).  
  - **What a result would look like**:  
    - A **negative result**: Prove that *any* restriction avoiding Fitch must exclude truths the anti-realist cannot reasonably reject (e.g., "there is no life on Kepler-22b"). This would vindicate anti-restrictionists.  
    - A **positive result**: Show a restriction C that is both Fitch-proof and *maximal* (e.g., Tennant’s "uniform negation" or "Cartesian" propositions). But anti-restrictionists would still object if C excludes truths we *could* discover (e.g., unobserved events).  

  **Current Status**:  
  Tennant’s syntactic restrictions (avoiding "known unknowns") satisfy (i) but not (ii) for anti-restrictionists. Hand-waving about "a priori unknowables" doesn’t show that *all non-C truths* are irrelevant to anti-realism.  

  ---

  ### **4. Paths to Progress**  
  The debate is stuck because both sides beg the question. Progress requires:  
  #### **A. Disambiguate "Knowable" Explicitly**  
    - **Route-based knowability** should be formalized (e.g., as a Σ₁ concept in epistemic logic, where ◇Kp iff ∃e (e is a finite epistemic process ∧ e ⊧ Kp)).  
    - **Consequence**: Fitch might *still* hold for route-based readings, forcing anti-realists to either accept omniscience or reject non-omniscience (e.g., dialetheism). This is a substantive outcome.  

  #### **B. Reorient Anti-Realism Away from Universal Quantification**  
    - Anti-realism might be framed as: "Truth supervenes on *ideal* epistemic conditions" (cf. Peirce, Putnam) rather than "all truths are knowable". This avoids Fitch by denying the latter’s *literal* reading.  
    - **Objection**: This concedes the restrictionist point but refocuses on whether "ideal knowability" can do anti-realist work.  

  #### **C. Settle the Formal Question**  
    - **Prove a limitative theorem**: Show that no Fitch-blocking restriction C can include:  
      (a) All propositions not containing K,  
      (b) All propositions about physical reality,  
      (c) All propositions with constructive verification conditions.  
      If proven, anti-realism collapses or requires radical revision (e.g., paraconsistent logic).  

  #### **D. Shift from "Knowable" to "Known in Principle"**  
    - **Anti-realist reformulation**: "p is true iff evidence *sufficient* for knowledge of p exists (even if unpossessed)". This avoids ◇Kp but retains epistemic truth-conditions.  
    - **Risk**: Invites Gettier-style counterexamples.  

  ---

  ### **Conclusion: Why Progress is Possible**  
  The deadlock stems from conflating **logical possibility** and **epistemic achievability**. Until this is resolved, charges of "ad hoc"-ness and "over-strongness" will persist. Your diagnosis is correct: the dispute is **conceptual** (hinging on what "knowable" *must* mean for anti-realism) but has **substantive implications** (whether anti-realism can avoid omniscience). A formal result clarifying the limits of restrictions would break new ground, but only if it engages the *epistemic* reading of knowability. The next step is to formalize "routes to knowledge" and test whether any restriction preserves anti-realist intuitions under this harsher lens. If none can, anti-realism must reinvent itself—or concede.
