               Price of Cloth in red chips (sold by B and they prefer red)

          But in practice, because we allow both currencies, the price might be in mixed. We can ask for the average price in the seller's currency.

     Alternatively, we can not worry about the exact price and just ask for the range.

     For simplicity, we will not calculate exact prices unless needed for the debrief. In the debrief, we can ask the students what happened to prices.

     What will go wrong:

     1. Someone says "this is just inflation" early: 
          - That's okay. Ask them to observe how it plays out and whether it's evenly distributed.

     2. Students not getting the windfall might feel left out and check out:
          - We can tell them that in the next round they will get the money, so they should prepare.

     3. Market clearing too slow: 
          - We strictly enforce time limits. If there are unsold goods, they can be carried over? Or not. We can allow inventory.

     4. Confusion about currencies: 
          - We will explain clearly that both currencies are accepted everywhere, but the mercantilist bonus is only for their own currency.

     5. Students might not produce more in response to high prices because the production task is boring:
          - We can make the task very quick (only 10 symbols) so doing two is not onerous. And we can incentivize by allowing them to sell extra and accumulate money.

     6. The two-island trade might be dominated by a few active traders, others might be passive.

     What the game cannot do:

     - It cannot show real output rising in the long run because the production task is fixed and there are no real resources. The only effect is a temporary production boost if students choose to work harder in response to high prices.

     - It cannot show the structural change in production (from agriculture to manufactures, etc.) because we have fixed roles.

     - The distribution of the new money is random, not through particular channels (bankers, landlords).

     Debrief Questions:

     - What happened to the price of Cloth in round 3? Why?
     - Did the students on Island B produce more in round 4? Why or why not?
     - How did the students on Island A who got the windfall in round 3 feel? Could they buy more? What about those who didn't?
     - In round 4, when everyone on A had extra money, could they buy more goods? Why not?
     - What was the effect on the balance of trade? Did one island accumulate more of its own currency? 
     - Did the island that accumulated more currency have happier students (more consumption)? 

     Then, connect to Hume:

     - The interval: between the injection of money and the rise in prices, money can stimulate industry (if producers respond to higher prices by producing more).
     - After prices adjust, money is neutral.
     - Money as oil: it facilitates trade, but is not wealth itself. The mercantilist focus on accumulating money (own currency) did not necessarily lead to more consumption.

     Finally, ask: 
          - Are the two claims (money as oil and the temporary effect) in tension? 
          - How does the interval resolve the apparent tension?

     The resolution costs you the idea that money is always neutral; it's only neutral in the long run. In the short run, it can have real effects.

  Materials List:

     - Blue and red poker chips (or any tokens): 
          For 22 students, 4 rounds, initial 10 per student: 22*10 = 220 of each color.
          Treasure: 20 per student on A (round 3 and 4): 11*20 = 220 blue chips extra.
          So total blue chips: 220 (initial) + 220 (treasure) = 440.
          Red chips: 220.

     - Fish tokens and Cloth tokens: at least 2 per student per round (if they produce 2) * 4 rounds * 22 students = 176 of each. Have extras.

     - Task sheets: papers with lines for copying symbols. Students will need 1 or 2 per round.

     - Score sheets for each student to record: production, transactions, consumption, and money held.

     - Timer.

     - Whiteboard to record average prices after each round.

  This is a complex game. We might run it in 75 minutes if we keep to the time limits.

  Time Breakdown:

     - Introduction and setup: 10 minutes.
     - Round 1: 12 minutes (3 production, 7 trade, 2 consumption)
     - Round 2: 12 minutes
     - Round 3: 12 minutes (with treasure to half of A)
     - Round 4: 12 minutes (with treasure to the other half of A)
     - Scoring and debrief: 17 minutes.

  Total: 10+12*4+17 = 75 minutes.

  We must be strict on time.

  This design is ambitious. We can simplify by having only 3 rounds (1 before treasure, 2 after) if time is tight.

  I hope this meets your requirements.
answer: |-
  Below is a complete, runnable classroom game designed to make students experience Hume's "interval" between money injection and price adjustment, and grasp why money is "oil, not a wheel" while temporary monetary shocks can stimulate industry. The game emphasizes the distributional effects and the mercantilist fallacy.

  ---

  ### **Game: The Humean Islands**
  **Objective:** Simulate how new money enters an economy, affects behavior before prices adjust, and why mercantilist hoarding is irrational.

  **Materials List:**
  - **Two colors of poker chips:** Blue for Island A (11 students), red for Island B (11 students).  
  - **Goods tokens:** Two types (e.g., "Fish" cards for Island A, "Cloth" cards for Island B).  
  - **Production sheets:** Simple repetitive tasks (e.g., sheets with 10 blank lines to copy "Hume" or "▲" symbols).  
  - **Price boards:** Two whiteboards (one per island) to post prices.  
  - **Timer** and whistle.  
  - **Treasure envelopes:** 5 envelopes with "20 blue chips" for Phase 1 windfall; 6 for Phase 2.  
  - **Scorecards:** For tracking chips/goods (individual and island totals).  

  ---

  ### **Setup (10 min)**  
  1. **Assign Islands:** Split class into Island A (producers of "Fish") and Island B (producers of "Cloth"). Arrange chairs into two circles.  
  2. **Distribute starting resources:**  
     - Each student gets:  
       - 10 chips of their island's color.  
       - 2 blank production sheets.  
       - 1 scorecard.  
     - Each island gets a treasury (a box) labeled "Island Treasury."  

  ---

  ### **Round Structure (4 rounds × 12 min each = 48 min total)**  
  Each round has three phases: **Production → Trade → Consumption**.  

  #### **Phase 1: Production (3 min)**  
  - **Task:** Students produce goods by copying symbols.  
    - 1 completed sheet = 1 "Fish" (Island A) or 1 "Cloth" (Island B).  
    - **Rule:** Students choose effort: Complete 1 sheet (low effort) or 2 sheets (high effort). Effort is real (they *must* write).  
  - **Why:** Embodies Hume's "money excites industry" – effort responds to *expected* prices from prior rounds.  

  #### **Phase 2: Trade (6 min)**  
  - **Domestic Trade (2 min):**  
    - Students trade *within* their island.  
    - **Price setting:** Use pre-posted prices on island boards (updated by TA each round).  
      - *Round 1 prices:* 2 chips per good.  
      - *Later rounds:* TA sets prices based on *last round's* average transaction (e.g., if Fish sold for 2–4 chips, set at 3).  
    - **Mechanics:** Students approach island treasury to "sell" goods for chips or "buy" goods from treasury with chips.  
  - **International Trade (4 min):**  
    - **Harbor station (TA desk):** One trader per island brings goods to trade.  
    - **Price setting:** Traders haggle for 1 min to set exchange rate (e.g., 1 Fish = X Cloth). TA enforces deal.  
    - **Transaction:** Traders exchange goods; unsold goods return to island treasury.  
  - **Why:** Centralized prices prevent haggling delays; international trade mirrors Hume’s balance-of-trade dynamics.  

  #### **Phase 3: Consumption (3 min)**  
  - Students "consume" 1 Fish + 1 Cloth to survive (record on scorecard).  
    - Failure to consume = 0 points for the round.  
  - Unconsumed goods/chips saved for future rounds.  
  - **Treasure Injection (Round 3 only):**  
    - **Phase 1 (start of Production):** 5 randomly chosen Island A students get envelopes with 20 blue chips.  
    - **Phase 2 (start of Trade):** Remaining 6 Island A students get envelopes.  

  ---

  ### **Scoring (5 min at game end)**  
  - **Individual score:**  
    - 1 point per round of consumption.  
    - 1 point per 5 chips held (any color).  
  - **Island score (mercantilist bonus):**  
    - Island with the most chips in *its own treasury* wins 5 bonus points per student.  
  - **Why:** Incentivizes chip hoarding (mercantilism) despite no consumption benefit.  

  ---

  ### **Debrief (12 min)**  
  Link game events to Hume’s texts:  

  | **Game Moment**          | **Hume's Concept**                                                                 | **Key Quote**                                                                 |
  |---------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------|
  | **Production effort spike** (after treasure) | Money "excites industry" *before* prices adjust.                                  | "In the progress towards these changes, the augmentation may have some influence, by exciting industry" ("Of Interest") |
  | **Prices rising post-treasure** | The interval: Money is non-neutral until "prices settle."                          | "after the prices are settled... [money] has no manner of influence." ("Of Interest") |
  | **Chips ≠ wealth** (hoarding vs. consumption) | Money is "oil," not a "wheel of trade." Wealth is consumption, not metal.         | "money is none of the wheels of trade: It is the oil which renders the motion... more smooth" ("Of Money") |
  | **Island treasury bonus** | Mercantilist fallacy: Hoarding chips (bullion) ≠ prosperity.                      | "we cannot... heap up money, more than any fluid, beyond its proper level" ("Balance of Trade") |
  | **Two-island trade**      | One nation’s gain isn’t another’s loss; trade balances naturally.                 | "The increase of riches and commerce in any one nation... [does not] hinder... its neighbours" ("Balance of Trade") |

  **Critical Discussion Questions:**  
  1. "Why did some Island A students work harder in Round 3? Did it pay off?"  
     → Connects to the interval: Extra effort only rewarded if done *before* prices rise.  
  2. "Did the island that hoarded more chips have happier students?"  
     → Highlights mercantilist delusion: Chips in treasury ≠ consumption.  
  3. "How is money like oil? When is it more/less useful?"  
     → Reinforces core tension: Money facilitates trade but isn’t wealth itself.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"This is just inflation!" in Round 1:**  
     - **Fix:** "Yes! But *who* benefits? When? Watch the treasure round." Redirect to distribution.  

  2. **Windfall recipients dominate; others disengage:**  
     - **Fix:** Treasure is staggered (Phase 1/2). Remind Phase 2 recipients: "You’re getting chips soon – plan your trades!"  

  3. **Market clears slowly during trade:**  
     - **Fix:** Enforce time limits strictly. TA posts prices to avoid haggling. Unsold goods go to treasury.  

  4. **Production effort lags price signals:**  
     - **Fix:** Update prices visibly *before* production. Say: "Yesterday’s Fish sold for 4 chips – how hard will you work today?"  

  5. **Score confusion:**  
     - **Fix:** Use simple scorecards; tally publicly at the end.  

  ---

  ### **What the Game Can’t Show (and How to Explain)**  
  1. **Real output gains:**  
     - Goods are tokens; "effort" is artificial. Hume argues new money can *permanently* boost output if it funds productivity.  
     - **Explain:** "Hume’s interval isn’t just inflation – it redirects labor. E.g., new money might fund a factory, raising output long-term. Our game can’t simulate structural change."  

  2. **Non-random money injection:**  
     - Treasure is random, but Hume’s money flows to merchants/landlords first, reshaping incentives.  
     - **Explain:** "In reality, money enters through specific channels (e.g., banks). Winners/losers depend on who gets it first – our random split approximates this."  

  3. **Global price adjustments:**  
     - Prices are island-specific; Hume’s prices adjust across interconnected economies.  
     - **Explain:** "Hume’s ‘price settling’ is a global process. Our two islands show the core, but real economies are more complex."  

  ---

  ### **Why This Works**  
  - **The interval is visceral:** Students *feel* the windfall’s fleeting advantage (Phase 1 recipients buy cheap; Phase 2 see inflated prices).  
  - **Mercantilism emerges naturally:** Islands hoard chips for the treasury bonus, then realize it’s pointless.  
  - **Hume’s tension resolves:** Money isn’t wealth (oil), but injecting it *temporarily* excites industry (wheels spin faster). The cost? Gains are uneven and ephemeral.  

  This game forces students to confront Hume’s nuance: Money’s neutrality isn’t instant, and that gap is where economics gets interesting. Your flatmate’s "footnote" becomes the climax.
