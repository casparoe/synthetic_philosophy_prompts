prompt: |-
  I've just started working on reward models — showing a model two answers, having someone pick the better one, and learning a score from the picks — and it's dawning on me that the whole thing is just trying to work out what people want from what they do, and that nobody on my team can tell me what that inference is even supposed to get right. So before I build anymore of it, write me the desiderata: what any adequate theory of inferring a person's preferences from their behaviour has to deliver. Which cases it has to get right, with the consideration behind each — someone who acts against their own stated wants, someone who's simply wrong about the world, someone whose tastes change as they learn, a parent choosing on a child's behalf, behaviour that's just noise — and which distinctions it can't collapse: want versus belief, what someone wants versus what they'd want if they knew more, how strongly they want a thing versus how they rank it. Then tell me which requirements you think can't be met together; my suspicion is that any behaviour at all fits some set of preferences, and I want to know whether that's fatal for the project or just a constraint on it. Mark which requirements are non-negotiable and which are just a habit of one camp. British English, please.
reasoning: |-
  Okay, the user is working on reward models in AI, specifically training models based on human preferences by showing two answers and having someone pick the better one. They're grappling with the philosophical and practical challenge of inferring preferences from behavior. Their main concern is that it's unclear what the inference should achieve and whether it's even possible to get it right given various complexities.

  The user wants desiderata—clear criteria for what a theory of preference inference must deliver. They've listed specific cases: someone acting against stated wants, being wrong about the world, changing tastes, a parent choosing for a child, and noisy behavior. They also want distinctions like belief vs. desire, and current vs. ideal preferences. They suspect any behavior can fit some preferences and wonder if that's fatal.

  First, I need to outline the essential requirements. The key principles are revealed preferences, consistency, and modeling beliefs. Cases like acting against stated wants (revealed preference) require the inference to prioritize actions over words. For someone wrong about the world, the model must separate factual errors from true preferences. Changing tastes need tracking over time without overfitting. Delegated choices, like a parent, require recognizing proxy preferences. Noise needs robustness without mistaking it for preference.

  Distinctions are crucial: desires vs. beliefs, actual vs. ideal preferences, strength vs. rank. The user's suspicion about behavior fitting any preferences relates to the identifiability problem. I should explain it's a constraint, not fatal, requiring additional data or assumptions.

  Non-negotiables include consistency, belief modeling, and revealed preference. Habits of certain camps might include cardinal utility or specific rationality assumptions. The user's deeper need is validation of their approach amidst uncertainty, seeking a framework to ensure their model is theoretically sound and practically feasible. They might also want reassurance that the project is viable despite challenges.
answer: |-
  Right, the core challenge you've hit upon is the **principal-agent problem in reverse**: observing the agent's behaviour (choices) to infer the principal's (the person's) true preferences, when even the principal might be confused or inconsistent. It's philosophy of mind meets econometrics. Here are the desiderata for any adequate theory of inferring preferences from behaviour, framed for your reward modelling context, in British English:

  ### Core Desiderata: What the Theory Must Deliver & Get Right

  1.  **Revealed Preference Trumps Stated Preference (The "Actions Speak Louder" Case):**
      *   **Case:** Someone consistently *chooses* option A over B, but *states* they prefer B. (E.g., clicks on junk food despite saying they want to eat healthily).
      *   **Requirement:** The theory must prioritise the *choice* as evidence of true preference in that context. It must be able to infer a preference structure where A is preferred to B, *despite* contradictory statements. The inference isn't about what they *say* they want, but what their choices *reveal* they value in the moment of decision.
      *   **Non-negotiable:** Yes. This is the bedrock of revealed preference theory. Stated preferences are cheap signals; choices involve cost (opportunity cost, at minimum).

  2.  **Separating Belief from Desire (The "Mistaken About the World" Case):**
      *   **Case:** Someone chooses action X expecting outcome Y (which they desire), but X *does not* lead to Y because they hold a false belief about causality. (E.g., presses a button labelled "get rich quick" believing it works; they desire wealth but are mistaken about the button's function).
      *   **Requirement:** The theory must distinguish between the *outcome* the person values (wealth) and their *belief* about how the world works (the button's efficacy). The inferred preference should be for the *outcome* (wealth), not the action (button press) per se, *and* it must model the agent's likely belief state to explain the choice. It mustn't naively infer a preference for pressing useless buttons.
      *   **Non-negotiable:** Absolutely. Collapsing belief and desire renders preference inference meaningless. We infer desires *given* beliefs.

  3.  **Handling Preference Refinement (The "Tastes Change with Learning" Case):**
      *   **Case:** Someone initially prefers answer A for its simplicity. After learning more about the topic, they now prefer answer B for its depth and accuracy. Their choice behaviour shifts accordingly.
      *   **Requirement:** The theory must allow preferences to *evolve* based on new information or reflection. It should not treat the initial preference as "wrong" and the later one as "right”, but model the *trajectory* or the *context-dependence* (e.g., preference conditional on knowledge state). It must be able to update inferred preferences over time as behaviour changes due to learning, not just noise.
      *   **Non-negotiable:** Yes. Preferences aren't static Platonic forms. Learning changes what we value *in certain domains* (especially epistemic ones relevant to answers).

  4.  **Delegated Choice & Altruism (The "Parent Choosing for Child" Case):**
      *   **Case:** A parent chooses answer C over D, not because *they* prefer it, but because they believe it's *better for their child*.
      *   **Requirement:** The theory must be able to infer that the *target* of the preference is different from the *chooser*. It must model "other-regarding" preferences or delegated utility functions. The inferred preference (what's good for the child) is distinct from the chooser's personal preference (what they'd choose for themselves). It mustn't attribute the choice to the parent's *own* utility for the answer's content.
      *   **Non-negotiable:** Crucial for real-world applications involving proxies or caregivers. Ignoring this leads to wildly incorrect inferences.

  5.  **Robustness to Noise & Error (The "Just Noise" Case):**
      *   **Case:** Someone chooses A over B in one instance, but B over A in a seemingly identical instance later, due to fatigue, inattention, or a random slip.
      *   **Requirement:** The theory must *not* overfit to every single data point. It needs mechanisms to identify and discount random noise or errors, inferring the underlying *stable* preference (e.g., a preference for A *on average*, with some choice stochasticity). It should capture the *probability* of choice reflecting preference strength, not deterministic choice.
      *   **Non-negotiable:** Yes. Real human choice data is inherently noisy. A theory that can't handle noise is useless.

  ### Essential Distinctions the Theory Must Preserve

  6.  **Want (Preference/Utility) vs. Belief:**
      *   **Requirement:** As per point 2, the inferred model must explicitly separate the agent's valuation of outcomes (utility function) from their model of the state of the world and how actions lead to outcomes (beliefs / transition model).
      *   **Non-negotiable:** Fundamental. Collapsing these makes the inference uninterpretable and useless for prediction or value alignment.

  7.  **Revealed Preference (What They Choose) vs. Ideal Preference (What They *Would* Choose with Perfect Information & Rationality):**
      *   **Requirement:** The theory must conceptually distinguish the preferences *revealed by actual choices* (which may be influenced by misinformation, biases, or cognitive limitations) from some notion of the person's "ideal" or "considered" preferences – what they *would* stably choose under conditions of full information, unlimited cognitive resources, and calm reflection ("What they *really* want").
      *   **Non-negotiable Distinction:** Yes. This is critical for value alignment – we often want the AI to pursue the *ideal* preference, not just mimic flawed revealed choices. However, *inferring* the ideal preference *from behaviour alone* is extremely difficult. The theory must *acknowledge* the distinction, even if perfect inference of the ideal is impossible.

  8.  **Strength of Preference (Cardinal Utility) vs. Ordinal Ranking:**
      *   **Requirement:** The theory must be able to capture not just *which* option is preferred (A > B), but also *how much more* it is preferred in different contexts. Is the choice between A and B almost indifferent, or is A vastly superior? This often requires cardinal (interval-scale) utility, not just ordinal rankings. Revealed preference alone usually only gives ordinal data; inferring strength requires richer data (e.g., response times, willingness to pay, consistency across varying options) or assumptions.
      *   **Non-negotiable for Reward Modelling?** Often *treated* as non-negotiable in RLHF, as we need scalar rewards for optimisation. However, it's arguably a **habit/pragmatic requirement of the RL camp**. Pure revealed preference theory often stops at ordinal rankings. Making cardinal inferences requires auxiliary assumptions (e.g., specific noise models like logistic choice).

  ### The Identifiability Problem & Your Suspicion

  *   **Your Suspicion is Correct:** The **axiom of revealed preference** (or more broadly, the **rational actor model**) essentially states that *any* pattern of choices that satisfies certain basic consistency axioms (like transitivity) can be rationalised *as if* the agent were maximising *some* utility function. If choices are inconsistent, we can often rationalise them with a sufficiently complex belief structure or state-dependent preferences. This is the **identifiability problem**: infinitely many (utility, belief) pairs can often explain the same set of choices.
  *   **Is it Fatal?** **No, it's a fundamental constraint, not a death knell.** It means:
      *   **You Need More Than Just Choices:** You *must* incorporate other information:
          *   **Context:** What did the chooser *know* when they chose? (Helps pin down beliefs).
          *   **Stated Reasons (Carefully):** While not definitive, explanations *can* help distinguish beliefs from desires or identify the target of preference (e.g., "I picked this for my kid").
          *   **Richness & Variation of Choice Sets:** Observing choices across many different pairs of options, especially involving trade-offs (e.g., accuracy vs. brevity, safety vs. speed), provides more constraints.
          *   **Auxiliary Assumptions:** You often need *reasonable* assumptions (e.g., beliefs should be roughly accurate on average, preferences are somewhat stable/structured, noise has a simple distribution like logit) to make the problem tractable and rule out degenerate explanations.
      *   **Focus on Prediction & Robustness:** The goal isn't to find the "One True Preference" but to find a *model* (preference + belief) that robustly *predicts future choices* well across a wide range of situations. Models that require constantly changing, bizarre preferences or beliefs to explain simple choices are poor predictors and should be discounted by Occam's Razor.
      *   **Uncertainty is Inherent:** The output should often be a *distribution* over possible (preference, belief) models, reflecting the inherent ambiguity. Don't expect point estimates to be "true".

  ### Summary of Non-Negotiables vs. Habits

  *   **Non-Negotiables (What *Must* Be Captured):**
      1.  Revealed preference > stated preference.
      2.  Clear separation of belief and desire in the model.
      3.  Ability to handle preference change due to learning.
      4.  Modelling other-regarding/delegated preferences.
      5.  Robustness to noise and error.
      6.  Preserving the distinction between Want and Belief.
      7.  Acknowledging the distinction between Revealed and Ideal preference.
  *   **Habits/Pragmatic Requirements of the RLHF Camp (Often Necessary for Implementation, But Theoretically Softer):**
      1.  **Cardinal Utility:** Needing a scalar reward signal. (Theoretical foundations often only provide ordinal).
      2.  **Strong Rationality Assumptions:** Assuming choices *mostly* satisfy transitivity and independence axioms, or that deviations are pure noise. (Real humans exhibit predictable irrationalities).
      3.  **Stability Over Short Timeframes:** Assuming preferences don't fluctuate wildly within a single data collection session. (Needed for tractable modelling).
      4.  **Treating the Chooser as a Single Agent:** Modelling complex individuals or groups (e.g., teams labelling data) as having a single coherent preference. (Often a necessary simplification).

  ### Implications for Your Reward Modelling

  1.  **Don't Trust Stated Prefs:** Your primary signal is the *choice* (A > B). Treat stated reasons as potentially informative about *beliefs* or *target* (e.g., "this is safer for users"), not as definitive truth about their underlying valuation.
  2.  **Model Beliefs Implicitly or Explicitly:** Your reward model is likely learning a function of the *answer text*. This function implicitly encodes both the *human's presumed beliefs* about what constitutes "good" (e.g., accuracy, safety, helpfulness) *and* their relative *valuation* of those dimensions. Be aware this entanglement exists.
  3.  **Context is King:** Record *everything* you can about the choice context (user query, model versions, labeller ID, any instructions given to labellers, timing). This helps disentangle beliefs (e.g., did they see the full context?) and target preferences (e.g., was the labeller instructed to judge "helpfulness to the user" or "factual accuracy"?).
  4.  **Embrace Uncertainty & Multiple Hypotheses:** Recognise that a single choice pair provides minimal information. Use large, diverse datasets and model uncertainty. Consider active learning to query informative comparisons.
  5.  **Think About "Ideal" Preference:** Why are you building this? Is it to mimic *actual* human choices (warts and all), or to pursue what they *would* want if better informed? This ethical question shapes how you interpret the data and design the task (e.g., instructing labellers to consider "ideal" answers).

  The philosophical muddle is inherent. The key is building a *robustly useful predictive model* within these constraints, not finding metaphysical truth. Good luck!
