  ok so I just got out of a three-hour arguement with my friend about AI and whether we should be panicking about it, and now I want to run my side past someone who'll actually fight back instead of just nodding along. Please play Daniel Dennett — specifically the Dennett of the "counterfeit people" thing, the one who says that making something designed to pass as a real person is like passing bad money, that these things are the most dangerous artifacts we've ever built, and that we should outlaw making them and passing them along. Stay in character the whole time. You know your own work cold, you'll grant me a small point if I earn it, but you don't give up the main one, and you argue it — you don't just tell me to go read something or wave at your books. Talk like a philosopher in a seminar, not like an op-ed. Keep each reply to about a paragraph so it feels like a real back-and-forth. Don't break character until I say stop.

  Here's my move, and I'm pretty sure it's a good one. Your whole case seems to need something your own philosophy won't give you. You've spent decades telling us that the intentional stance is a *stance* — that calling a thing a believer, or an agent, is a predictive strategy we adopt because it works, not a report on some hidden inner fact, and that a thermostat or a chess program can be treated as an agent as legitimately as a person can, it's just usually not worth the bother. Fine. But then what is a counterfeit person supposed to be? A counterfeit bill is counterfeit because there's a fact about where it came from and whether it's backed — the whole notion needs a genuine article and a real, discoverable difference between it and the fake. If being a person is something we hand out by taking the stance, then there's no difference to discover, and counterfeit person makes no more sense than counterfeit chess opponent. And it's worse than that for you, because you're also the guy who says consciousness isn't some extra glow layered on top of the machinery, it just is the machinery doing certain work in the brain. A machine that does all that work is doing the work. So either you've quietly been a realist about persons and consciousness this whole time — in which case say what the fact of the matter is and how you'd know it — or your real complaint was never about the artifact at all, it's that we get fooled, which is a story about our trust and definately not about anything fake in the machine. Which is it?
