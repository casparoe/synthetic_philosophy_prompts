  ### Adversarial-Collaboration Document: Rationality in the Prisoner's Dilemma

  This document outlines the agreed claims, disagreements, and cruxes between Friend A (orthodox game theorist) and Friend B (decision-procedure theorist) regarding whether it can be rational to cooperate in a one-shot Prisoner's Dilemma (PD). The focus is on reasoning, not literature. Predictions and disagreements are based on the specified cases, with a new case (Case 7) added to cleanly split the views. For each case, we explicitly state whether A and B predict the same outcome (even if labeled differently) and identify cruxes where predictions diverge.

  #### Agreed Claims (Both Sign)
  1. **Case 1 (Plain one-shot PD)**: In a genuinely one-shot PD with standard payoffs (T > R > P > S; 2R > T + S), no repetition, no reputation, no binding commitments, and no causal influence between players' choices, both players will defect (outcome: D,D). Defecting strictly dominates cooperating, as it yields a higher payoff regardless of the other's action.
  2. **Case 2 (Exact copies)**: If both players are identical copies (same memories, same decision procedure) and know it, both will cooperate (outcome: C,C). Mutual cooperation (R) is better than mutual defection (P), and identical reasoning ensures aligned actions.
  3. **Case 3 (Deterministic programs with source code access)**: If both players are deterministic programs that can read each other's source code before choosing, both will cooperate (outcome: C,C). Each program can condition its action on the other's code, enabling mutual cooperation as a Nash equilibrium.
  4. **Case 5 (Independent draws from known distribution)**: If each player is an independent draw from a known common distribution over types, both will defect (outcome: D,D). Defecting strictly dominates, as the other's action is statistically independent and unaffected by one's own choice.
  5. **Case 6a (Indefinitely repeated PD)**: In an indefinitely repeated PD with continuation probability δ, cooperation can be rationally sustained if δ is sufficiently high (e.g., via trigger strategies). Both predict cooperation persists for high δ.
  6. **Case 6b (Finitely repeated PD)**: In a finitely repeated PD with a known last round, both players will defect in every round, including the first. Backward induction implies defection dominates as the last round approaches.

  #### Disagreements (Tabulated)
