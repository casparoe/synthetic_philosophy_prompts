  ### Case A: The Subscription Service Audit

  **Setting:**  
  You are a subscriber to a premium financial newsletter. At the start of the year, the newsletter's algorithm predicted whether you would pay a $100 "audit fee" if audited mid-year for compliance with their terms. The audit never occurred—it was a hypothetical scenario they simulated. However, their policy states: if the algorithm predicted you *would pay* the fee in the audit scenario, they invest $10,000 in a bonus fund for you. If it predicted you *would refuse*, you get nothing. The prediction is already fixed; it was made using your past behavior and public data, with human-level accuracy.  

  Today, the newsletter contacts you: "Our algorithm was uncertain. Pay $100 now, and we'll take it as confirmation you'd have paid in the audit, releasing your $10,000 bonus. Refuse, and you forfeit the bonus."  

  **Verdicts:**  
  - **Causal Decision Theory (CDT) refuses.**  
    Reasoning: Paying $100 causes a loss of $100. The bonus depends on a *past* prediction about a *counterfactual* scenario (the audit that never happened). Your payment now doesn’t cause the prediction to change; it’s already fixed. The actual world (no audit) is unaffected. Net effect: −$100.  

  - **Evidential Decision Theory (EDT) refuses.**  
    Reasoning: Conditioning on paying, what evidence do you gain? The prediction is already made and uncorrelated with your current act. Paying doesn’t provide new information about the prediction; it merely signals compliance. You have no reason to believe paying increases the chance of the bonus. Paying costs $100 with no offsetting evidence of gain.  

  - **Policy-Level (Updateless) Theory pays.**  
    Reasoning: From a pre-commitment perspective, the optimal policy is to always pay in such situations. If your *disposition* to pay had been predicted (as it would under this policy), you’d have received the $10,000 without facing an audit. The $100 cost now is the price of maintaining that disposition. Expected value of the policy (factoring in the rare audit scenario) is positive: −$100 now vs. +$10,000 from the prediction.  

  **Key feature:** The bonus hinges on a prediction of your behavior in a *counterfactual scenario* (audit) that never occurred.  
  **Degenerates into:** If the counterfactual branch is replaced by a real parallel subscriber facing the audit separately, the policy-level verdict collapses. Your payment now doesn’t affect their prediction or outcome, reducing the case to a pointless $100 loss.  
  **Defender’s attack (targeting CDT/EDT):** A policy-level theorist would argue that refusing is myopic. By committing to pay, you incentivize the newsletter to predict cooperation, securing the bonus in advance. CDT/EDT ignore how your *identity as a payer* was pre-rewarded.  

  ---

  ### Case B: The Insurance Claim Review  

  **Setting:**  
  You filed a claim with an insurer for a rare $10,000 loss (e.g., art theft). The insurer uses an algorithm to predict your response to a $100 "review fee." Their policy:  
  - If the claim is *valid*, and they predict you *refuse* the fee, they demand it. Paying processes the claim; refusing denies it.  
  - If the claim is *valid*, and they predict you *pay*, they auto-approve without demanding.  
  - If the claim is *invalid*, they never demand.  

  The algorithm’s prediction is fixed at the time of filing, using your claims history (human-level accuracy). You receive a fee demand.  

  **Verdicts:**  
  - **Causal Decision Theory (CDT) refuses.**  
    Reasoning: Paying $100 causes a loss of $100. The claim’s validity and prediction are already fixed; your payment doesn’t cause validity. If the claim is invalid, paying gains nothing (no loss occurred). If valid, paying processes it, but CDT doesn’t use the demand as evidence. Without evidence, the probability of validity is low (say, 1%), making expected value: 99% × −$100 + 1% × (−$100 + $10,000) ≈ −$99. Refusing avoids the fee.  

  - **Evidential Decision Theory (EDT) pays.**  
    Reasoning: Conditioning on the *demand’s arrival*: it only occurs if the claim is valid *and* refusal was predicted. Thus, the demand is evidence that the claim is valid (if invalid, no demand). Conditioning on paying: if you pay, you get $10,000 − $100 = $9,900. Refusing nets $0. The demand shifts your belief: validity is now likely (e.g., 95% given the prediction’s accuracy), so EU(pay) ≈ 95% × $9,900 + 5% × −$100 > $0.  

  - **Policy-Level (Updateless) Theory refuses.**  
    Reasoning: The optimal policy is to *never pay*. If your disposition is to refuse, the insurer predicts refusal. For valid claims, they demand the fee, but you refuse and lose $10,000. If you pay now, you get $9,900 *this time*, but it signals a willingness to pay, encouraging future demands. Crucially, if your policy were to *always pay*, the insurer would predict payment and auto-approve valid claims without demanding fees—netting you $10,000 at no cost. By refusing now, you maintain the refusal policy, which (despite this loss) avoids fees in all future claims. Long-term, the paying policy is superior, but in this *specific* node (where the demand occurred because refusal was predicted), refusing aligns with the policy that minimizes extortion.  

  **Key feature:** The demand arrives only if a *hidden fact* (claim validity) *disagrees* with an *exogenous prediction* of your act (XOR-like conditioning).  
  **Degenerates into:** If the prediction is removed (e.g., the insurer demands randomly), EDT’s verdict collapses. The demand is no longer evidence of validity, reducing the case to a low-probability gamble.  
  **Defender’s attack (targeting EDT):** A CDT or policy-level theorist argues EDT conflates evidence with control. Paying "because the demand signals validity" is futile: validity is fixed, and paying doesn’t change it. EDT’s payoff comes from correlation, not causation, and encourages systems to exploit your responsiveness.  

  ---

  ### Structural Difference and Robustness  
  - **Difference:** Case A turns on a *counterfactual prediction* (reward for expected behavior in an unrealized scenario). Case B turns on *XOR evidence* (demand as proof of a hidden state when prediction and fact mismatch).  
  - **Policy in Case A:** If the unobserved branch is a real parallel instance (e.g., another subscriber facing the audit), paying now doesn’t affect their outcome. The policy-level verdict *does not survive*; it relies on the prediction being about *your* disposition, not a separate agent.  
  - **Attacks:**  
    - **EDT defender** against Case A: "The newsletter’s prediction isn’t perfectly linked to my act. Paying now doesn’t prove I’d pay in the audit; it’s a costly signal with no ROI."  
    - **Policy-level defender** against Case B: "Refusing here is consistent with the superior ‘always pay’ policy. Being in this node means I failed to commit, but I should act to *correct* toward the better policy, not entrench the worse one." (Rebuttal: The policy is fixed; you’re updating on the demand, violating updatelessness.)  
    - **CDT defender** against both: "Paying in either case wastes money on non-causal relationships. Real agents don’t optimize for alternate timelines or abstract policies."  

  **Verdict Profile Confirmed:**  
  - Case A: CDT refuses, EDT refuses, policy pays.  
  - Case B: CDT refuses, EDT pays, policy refuses.
