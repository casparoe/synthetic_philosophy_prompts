  **Remarks for Dana's Retirement Dinner**

  Dana. Colleagues. Friends. Family. For thirty-four years, I counted fish. Since retiring, I’ve been counting distinctions – subtle ones, hard ones, the kind that keep you up at night. It feels fitting to be here tonight for Dana, because nobody I know has wrestled with harder distinctions than she has. Especially in this chair.

  Many of you know Dana as the one who makes the pie. That perfect crust is legendary. And that Dana is absolutely here tonight, wrapped in the love of grandkids and family. But the Dana who sat in *that* chair, the one we’re here to honor professionally… that Dana lived in a different kitchen. One where the ingredients were often bitter, the stakes immense, and the choices… rarely simple. Rarely clean.

  We all remember the bay. The collapsing stock. The desperate scramble. And Dana’s decision – the buyout. Taking the last eleven boats off the water. She did it believing it was necessary. I believed it was necessary. But necessity doesn’t erase cost. It doesn’t erase the weight of standing in front of families who trusted you, families whose lives were woven into that bay for generations, and delivering a message about the science that felt… absolute. Settled. In a situation that, by its nature, held uncertainties. I was there. I saw the necessity she saw, and I also saw the faces of those who heard that certainty.

  Where does that leave us? With the aftermath. And Dana’s response *to* the aftermath wasn’t to walk away from the table, or to simply move on. It was to sit down, in the raw space of that decision, and write. She wrote the protocol. The one we all just call "The Playbook."

  Think about that. Not just making the hard call, but then meticulously documenting *how* such a call should be made. The considerations. The thresholds. The trade-offs laid bare for the next person, and the next council, to see and use. She codified the process born from that incredibly painful moment.

  Does writing it down cleanse the original act? Does it make the hard choices of leadership pure? I don’t think so. The ink doesn’t wash the hands. What it *does* do is something else entirely. It takes the solitary burden, the intense pressure of that chair in *that* crisis, and transforms it. It makes the process transparent. It makes the reasoning, however fraught, shareable. It makes the *difficulty* reproducible. The Playbook doesn't erase the past; it institutionalizes the acknowledgement that decisions like the buyout *are* complex, carry deep human cost, and require a structured, examined approach. It forces future councils to confront the distinctions Dana lived. That’s its power, and its weight.

  It’s not absolution. It’s a legacy of grappling. It’s saying, "This is the terrain. These are the maps we drew navigating it, scars and all." The Playbook ensures that the weight of such choices isn’t borne alone in the dark by one person, but shared, examined, and carried forward openly by the institution.

  So tonight, Dana, we honor the complexity you navigated. We honor the fierce conviction that drove you to act for the bay’s future, even knowing the immediate cost. And we honor the profound honesty it took, after the storm, to sit down and write that Playbook – not to excuse, but to equip. To force the hard distinctions into the light for everyone who follows.

  You carried the weight of the bay. You helped build the structure meant to share that weight. For the sleepless nights, for the pie, for the protocol, and for wrestling openly with the hardest distinctions in the room… thank you. Let’s raise a glass to Dana.

