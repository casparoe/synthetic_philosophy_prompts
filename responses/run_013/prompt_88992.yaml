  I spent thirty-four years as a fisheries biologist and retired a few years back, and since then I've been reading alot of philosophy in a pretty undisciplined way — my wife says I've gone from counting fish to counting distinctions. Anyway, my old boss Dana is retiring after twenty-odd years running the regional fisheries council, and they've asked me to give the remarks at her dinner. Here's my problem. Dana is the person who pushed through the buyout that took the last eleven boats off the bay. She did it, I think, for good reasons — the stock was collapsing and we both knew it — but she got it done partly by standing in front of those families and telling them the science was more settled than it was. I was in the room for one of those meetings. I don't see a version of it where she didn't lie to people who had every reason to trust her. She also went home and didn't sleep for about a year, and she wrote out the decision protocol the council still uses for allocation fights, which everyone now just calls the playbook.

  The room will be about half agency and fishing people — some still furious with her, a few, I suspect, there to see whether anyone was finally going to say the true thing out loud — and about half her family: two grandkids, a brother, people who know her as the one who makes the pie. I want five minutes of remarks, maybe seven hundred words. I don't want to whitewash her and I don't want to put her on trial, and I especially don't want to do the thing where you haul in "dirty hands" as a way of making the person who did the dirty thing feel better about it. I've read enough by now to recognize that move and I think it's cheap. But I can't stand the other move either, the one where everyone pretends a person could have kept her hands clean in that chair. What I'd like the speech built around is the playbook itself — the fact that she sat down and wrote out how to make a call like that one, and that the council still uses it. Does writing it down launder anything, or does it just make the dirt reproducible? I want the speech to leave that open, and still somehow leave her family glad they came and leave the angry ones feeling their anger was in the room rather than swept up after. Can you write it for me.

