answer: |-
  ## Triage

  *(Fluorescent hum. A curtain half-drawn.)*

  **Patient:**  
  It started sharp, *here*, like glass grinding deep in the bone.  
  **Clinician:**  
  We see discomfort of that nature quite frequently.  

  **Patient:**  
  It wakes me, cold sweat, can't turn without this catch—  
  **Clinician:**  
  Musculoskeletal strain often presents with referred sensations.  

  **Patient:**  
  But it *radiates*, down my arm, into the jawbone—  
  **Clinician:**  
  Referred pain pathways can create surprising patterns.  

  **Patient:**  
  It’s not… it doesn’t feel like a pulled muscle. It’s…  
  **Clinician:**  
  Anxiety can heighten somatic awareness significantly.  

  **Patient:**  
  Last week, carrying groceries, it seized so hard I—  
  **Clinician:**  
  Daily activities often trigger latent inflammatory responses.  

  **Patient:**  
  Could it be… something else? Something…?  
  **Clinician:**  
  We’re ruling out acute concerns with appropriate diligence.  

  **Patient:**  
  It just… *lingers*. Worse after… perhaps…  
  **Clinician:**  
  Persistent symptoms sometimes correlate with stress cycles.  

  **Patient:**  
  The jaw part… maybe it’s referred, like you said?  
  **Clinician:**  
  Referred pain pathways are indeed a helpful context.  

  **Patient:**  
  And the cold sweat… could that be… anxiety?  
  **Clinician:**  
  Anxiety frequently manifests in autonomic responses.  

  **Patient:**  
  So… maybe not *grinding* glass, just… strain?  
  **Clinician:**  
  Musculoskeletal strain explains many presentations.  

  **Patient:**  
  This catch when I turn… perhaps it’s… inflammatory?  
  **Clinician:**  
  Latent inflammatory responses cause functional limitations.  

  **Patient:**  
  It *feels*… severe. But… perhaps amplified?  
  **Clinician:**  
  Heightened somatic awareness alters perceived intensity.  

  **Patient:**  
  Stress-related… amplification?  
  **Clinician:**  
  Stress-related amplification is a recognized factor.  

  **Patient:**  
  Maybe…  
  **Clinician:**  
  We’re confident we’ve explored the pertinent possibilities.  

  *(The pen taps the whiteboard. The curtain sways.)*

  ---

  **Notes on Execution:**

  1.  **The Mechanism:** The poem enacts the *erosion of epistemic confidence* through linguistic osmosis. The patient isn't contradicted; her testimony is *recontextualized* using the clinician's stock phrases ("referred pain," "stress," "inflammation," "somatic awareness"). Her vocabulary shrinks and adopts these terms ("perhaps," "maybe," "amplified"), losing its original, visceral authority ("glass grinding deep in the bone").
  2.  **Antiphonal Structure:** Clear visual separation of voices. The clinician's lines are consistently shorter, relying on recycled, institutionally-approved phrases that sound reasonable in isolation but collectively reshape the narrative.
  3.  **Clinician's Voice:** Never cold, never contradictory. Phrases like "helpful context," "appropriate diligence," "recognized factor" sound professional and concerned. Their repetition reveals systemic detachment, not individual malice.
  4.  **Patient's Erosion:** Lines shorten dramatically. Concrete sensation ("glass grinding") becomes vague ("severe"), then qualified ("perhaps amplified"), and finally internalizes the clinician's framing ("Stress-related… amplification?"). Her final "Maybe..." signifies near-silence.
  5.  **Concrete Setting:** The ER bay (fluorescent hum, curtain, whiteboard, pen tap) grounds the abstract injustice. The symptom (left shoulder pain radiating to jaw) is specific and plausible for various conditions (muscular, cardiac referral).
  6.  **No Villain/Epiphany:** The clinician acts per protocol. The patient doesn't protest or have a revelation. The injustice lies in the *structure* of the interaction, the unspoken weight given to institutional language over lived experience.
  7.  **Accessibility & Accuracy:** The dynamic is clear without jargon ("testimonial injustice"). A philosopher would recognize the systematic credibility deficit enacted through linguistic dominance and the patient's internalization of the diminished epistemic position. The clinician *means* well; that's the point.
