prompt: |-
  ok, so i've somehow ended up convening a working group next term on letterforms — the 'what makes every a an a' thing, categories and style and the essence of a letter — and I get to set the agenda. Twelve sessions, so realistically four or five questions if we're honest about how long things take. The room is a wierd mix: two type designers, a linguist who works on writing systems, someone from the Unicode/NLP side, a vision person, and me (philosophy, categories and essences, that's my whole deal). Nobody in this room is going to run experiments for us, so factor that in.

  Give me a defended agenda: which open questions about letterform identity are worth the term, in order, and why. I want the reasoning more than the list — what makes one question upstream of another, what's tractable for a room like this vs. what secretly needs a psychophysics lab, what looks well-worked but is actually stalled, and what would move something up or down. Don't bother with a reading list, I've got that side handled.

  Some things I keep tripping on and want taken seriously rather than waved at:

  - The 'a' you see in most books is the two-storey kind; the 'a' most people actually write by hand is the single-storey kind. Both are just 'a'. Same for 'g'. So what's carrying the identity — something perceptual, something motor, or something more like an abstract specification?
  - Geometrically they're a mess: different skeletons, different stroke counts, and the two-storey 'a' has two enclosed counters where the single-storey one has one. Whatever the essence is, it doesn't look like a shape.
  - Unicode hands out seperate code points to the bold, italic, fraktur, script and double-struck versions of a letter — different characters by the standard, the same letter to any reader. Meanwhile Cyrillic and Greek letters that are pixel-identical to Latin ones are definately different letters. So 'same character' and 'same letter' come apart — is that typography, writing-systems, or metaphysics?
  - If you build something that generates letterforms in a given style — which is the whole point of the Letter Spirit idea — you seem forced to commit to some notion of letter identity. Does the generator need a notion of sameness that a perceiver wouldn't have? Or vice versa?

  Also be honest about the empirical/conceptual seam here: if the perceptual work comes out one way rather than another, does that settle the philosophical question or only constrain it? I'd rather you flag where the two are doing genuinely different work than pretend it's all one inquiry.

  Format:

  - Shortlist: the four or five questions, one line each, in your order. ~150 words.
  - The case for the ordering: for each, why it sits where it does — upstream-ness, tractability for us, neglectedness — plus where you're least confident. ~900 words.
  - What I'm cutting: things that sound central but that you'd deprioritise, and what it would take to change your mind. ~250 words.
  - What would reshuffle it: per question, the one result or argument that would move it, and what a genuinely good session on it would look like. ~300 words.

  And if you think the framing is off — that 'what makes every a an a' is the wrong thing to spend a term on — say so, but bring a replacement agenda with it.
