prompt: |-
  I'm a second-year PhD student in a computational biology lab, and I'm trying to decide whether to switch labs before my fellowship runs out. The lab studies how ant colonies allocate foragers across food sources. The whole approach rests on one big assumption: a colony is always maximizing a single global energy-return rate, and any weird behavior is just a constraint we haven't modeled yet. When experiments don't fit, my advisor adds another auxiliary layer -- pheromone decay rates, individual variation, thermal effects, spatial memory, whatever -- and the core assumption never gets touched. The latest patch is a "forager memory kernel" with a decay constant that gets re-fit for each experiment. A postdoc in the lab says this is normal and that you can't judge an approach by how many anomalies it has, because every approach has them; what matters is whether it keeps making novel predictions. But a friend in another department says we're just adding epicycles, and that a program that only explains old data by patching is already dead. Meanwhile, a rival lab models colonies as satisficing networks of local rules, no global optimizer, and they've had some striking successes on new kinds of foraging data. I have to decide by the end of the month, and I recieve a lot of conflicting advice.

  Can you give me advice on how to think about this? I don't want generic "follow your passion" stuff. I want to know how to tell whether my current lab's approach is still worth staying in, and how much weight to give the fact that it has a lot of unexplained results versus the fact that it's still publishing. Also, my advisor is a good mentor and I'd feel bad leaving, but that's seperate.

  Please answer as exactly five numbered points, each one or two sentences, with no intro or conclusion.
