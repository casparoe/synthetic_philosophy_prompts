answer: |-
  Here are five numbered points:

  1.  Judge the core assumption by its falsifiability: does it make risky, testable predictions beyond current data, or is it shielded by endless patches that only explain known anomalies? A core idea that can't be falsified is problematic.
  2.  Prioritize novel predictions over mere accommodation: significant research programs generate surprising, testable predictions about *new* phenomena, not just post-hoc adjustments to explain existing problematic data.
  3.  Weight the rival lab's success heavily: their alternative approach succeeding on novel foraging data suggests the "global maximizer" assumption might be fundamentally limiting, not just incomplete.
  4.  Assess if patches are becoming the focus: if the core model requires increasingly complex, experiment-specific additions (like unique memory kernels) to function, it signals diminishing returns and a potential dead end.
  5.  Separate publishing volume from program health: continued publication shows activity, but evaluate if papers offer genuinely novel insights/predictions or just incremental patches to maintain the core assumption.
