prompt: |-
  I'm a novelist and I'm stuck on something I keep running into in my current book, which is written partly in a "we" voice — a group of people, and I have to decide at every turn whether it's true to say "we did that" or whether it's really just a bunch of "I"s that happen to line up. I've been going on gut on alot of cases and I want to know if there's a principle behind them, because right now my gut feels inconsistent and it's wrecking my chapters.

  Here's what I've got, cases and my gut:

  - Two people carrying a couch down the stairs. "We carried it." Obviously yes.
  - Two people walking the same direction on the sidewalk, no relation, both just going north. "We walked together." No. But if they fall into step, and one slows when the other does, and they start chatting — yes, now it's a we. Nothing changed except... something.
  - A flash mob. A hundred strangers get a text, all start dancing in the station at noon. None of them intends the group's dance, most don't know each other. My gut says "we danced" is weirdly half-true. Something happened there that's more than a hundred solo dances.
  - Improv. Two actors on stage, no script, nobody knows what the other will do next, each just responds. "We built that scene" — yes, fully. And yet there's no shared plan, no goal agreed in advance, nothing. This one bugs me because it breaks my favourite theory.
  - A jury. Twelve people each vote guilty. "We convicted him." Yes, absolutely, even though no single one of them did it.
  - A corporation dumps waste in a river over years — nobody there ever intended "we pollute the river," it's just what the org chart plus the incentives produced. "The company polluted the river." Yes. But if I say yes to that, I have to be careful, because I'm about to say no to something with the same shape.
  - A couple who each secretly book the same surprise trip to Paris for the same week, and find out at dinner. "We planned a trip to Paris." My gut says no — it's a coincidence, it's funny, it's not a we. But structurally this looks to me exactly like the flash mob: independent private intentions that happen to mesh. I say yes to the flash mob and no to this, so I think one of those has to go and I don't know which.

  My tentative principle, which I suspect is wrong: we did X when each of us did our part knowing the others were doing theirs, and doing our part partly because of that. That handles the couch and the jury. It seems to fail the improv (no prior plan, no knowledge of what the other will do) and maybe the flash mob. So either improv isn't joint action, which I don't believe, or my principle is too demanding. Wether it's the principle or my belief about improv, one is off.

  What I want: a principle, or a couple of rival ones, that gets as many of these as possible, stated precisely enough that I can actually apply it to a scene — plus what it predicts for a case I haven't listed, and which of my verdicts I have to give up. And if the honest answer is that "we did it" is doing two or three different jobs and no single principle covers them, say that, and tell me which job each case is doing. I'm not after a reading list, just the thing itself.
reasoning: |-
  Okay, the user is a novelist struggling with the "we" voice in their book. They've provided several scenarios where they're unsure whether "we" is appropriate. Their gut feelings are inconsistent, causing issues in their chapters. They need a clear principle to apply consistently.

  First, I need to understand the core issue. The user is dealing with collective action versus individual actions that coincide. They want a reliable way to decide when "we did X" is truthful. Their examples range from clear cases like carrying a couch to ambiguous ones like the surprise trip to Paris.

  Looking at their examples: carrying a couch is a clear "we" because it's a coordinated effort. Strangers walking the same direction isn't "we" unless they start interacting. The flash mob is tricky—participants act individually but create a collective outcome. Improv is collaborative without a plan, yet "we built that scene" feels right. The jury convicting as a group is clearly "we." Corporate pollution involves distributed responsibility without intent. The surprise trip is coincidental, so "we" doesn't fit.

  Their tentative principle—knowing others are participating and acting because of that—works for some cases but fails for improv and the flash mob. Why? Improv relies on real-time responsiveness, not prior knowledge. The flash mob participants know others will dance but don't coordinate. So the principle might be too narrow.

  I recall theories of joint action. Philosophers like Bratman and Gilbert discuss shared intentions. For Bratman, it's about mutual responsiveness and commitment to joint activity. Gilbert focuses on plural subjects formed by agreements. Applying this, the couch carriers have a shared goal and coordination. The walking strangers become "we" when they adjust to each other, forming a minimal shared intention. The flash mob: each dancer knows others are dancing (common knowledge) and acts in a way that contributes to the group dance. That's mutual responsiveness, so "we danced" fits. Improv actors are highly responsive to each other, creating a shared activity dynamically. The jury's decision is a formal joint action. The corporation lacks shared intent; it's systemic, not agential. The surprise trip is pure coincidence without mutual awareness or responsiveness.

  The user's gut conflicts (flash mob vs. surprise trip) make sense. The flash mob has mutual responsiveness (knowing others participate), while the couple doesn't. So the key is mutual responsiveness, not just coincidence.

  The principle could be: "We did X" when there's mutual responsiveness to others' actions to achieve a shared goal (even emergent). This covers couch, walking (once interacting), flash mob, improv, jury. Corporate pollution isn't agential "we," but the company as an entity. The surprise trip lacks mutual responsiveness.

  User needs to give up their verdict on the flash mob or adjust the principle. Since flash mob has common knowledge and responsiveness, "we" fits. The surprise trip doesn't, so no "we." Also, corporate "we" is metaphorical, not literal joint action.

  For application: in scenes, check if individuals are responsive to each other toward a common outcome. If yes, "we" works. For the unlisted case (traffic jam), drivers aren't responsive, so no "we."

  The user might also need to distinguish between literal joint action and metaphorical uses (like corporate actions). Their deeper need is consistent narrative voice that feels truthful. By clarifying mutual responsiveness, they can decide "we" more confidently.
answer: |-
  I've got you. This is a fascinating puzzle at the intersection of philosophy of action, linguistics, and narrative craft. Your gut is picking up on genuine nuances, but it needs a sharper framework. The core insight is that **"we did X" signals *joint intentional action*, not just the sum of individual actions.** However, "joint intentional action" isn't one thing; it's a spectrum with a crucial core requirement. Your principle is *almost* right but needs refinement to handle improv and the flash mob.

  Here's the principle, stated precisely, followed by application to your cases, a new case, and what you need to give up:

  **The Core Principle: "We did X" is true when:**
  1.  **There is a Plural Subject:** The individuals constitute a "we" for the duration of the action X. This requires:
      *   **Mutual Awareness & Responsiveness:** Each participant is aware (or can reasonably assume) that others are participating in *the same type of activity* directed towards *the same outcome or state of affairs* (X), *and* they are responsive to the actions and presence of the others in performing their part. This responsiveness adjusts their own actions to fit, coordinate, or achieve X *together*.
      *   **Shared Goal (Emergent or Agreed):** There is a goal, outcome, or state of affairs (X) that the actions are directed towards achieving *as a group*. Crucially, this goal can be *emergent* (like in improv) or *minimal* (like walking together), not necessarily pre-planned or elaborate. The key is that the participants *recognize* this shared goal *during* the action and orient their responsiveness towards it.
  2.  **Collective Attribution:** The action X is something that *can* be attributed to the group as a whole, meaning the outcome depends fundamentally on the *interaction* and *combined effort* of the participants acting as a plural subject, not just their individual contributions happening simultaneously.

  **Applying the Principle to Your Cases:**

  1.  **Couch Carrying:** YES.
      *   *Why:* Clear mutual awareness ("You take that end!"), constant responsiveness (adjusting grip, pace, balance), explicit shared goal (get couch downstairs safely). Classic plural subject.

  2.  **Strangers Walking North:** NO (initially). YES (if they fall into step/chat).
      *   *Why (No):* No mutual awareness of *joint* walking. No responsiveness ("I walk north regardless of you"). No shared goal beyond individual "go north". Just coincidence.
      *   *Why (Yes - later):* Falling into step shows responsiveness (adjusting pace). Chatting signals mutual awareness of *each other's presence in this specific context*. A minimal, emergent shared goal arises: "walking *together* along this path" (even if destination differs). They become a temporary "we".

  3.  **Flash Mob:** YES ("We danced").
      *   *Why:* Participants have mutual awareness *that others are dancing as part of the same event* (via the shared instruction/context). They are responsive – they see the others dancing and this shapes *their own* dancing (timing, style, energy level) to fit *the collective dance happening*. The shared goal is "executing this flash mob dance at noon". While individual intent exists ("I will dance"), the *collective action* ("a flash mob happening") is the shared frame they are mutually aware of and responsive within. The *outcome* (the spectacle of the flash mob) depends on their combined, coordinated participation.

  4.  **Improv:** YES ("We built that scene").
      *   *Why:* Extreme mutual awareness and responsiveness is the *essence* of improv ("Yes, and..."). Each actor's action is fundamentally shaped by the other's prior action, aiming towards the emergent shared goal: "creating *this* scene *together*". The scene *is* the product of their dynamic interaction as a plural subject. No prior plan is needed; the shared goal emerges instantly and guides responsive action.

  5.  **Jury Verdict:** YES ("We convicted him").
      *   *Why:* They are a formal plural subject (the jury). Deliberation involves intense mutual awareness and responsiveness (arguments, counter-arguments, persuasion). The shared goal is explicit: "reach a unanimous verdict on guilt". The action "convicting" is the collective outcome of their deliberation and vote *as a body*.

  6.  **Corporate Pollution:** NO (for literal "we" by the employees). YES (as a metaphorical statement about the company entity).
      *   *Why (No - Literal):* Employees likely lack mutual awareness *that their specific actions constitute polluting the river as a group goal*. They are responsive to rules and incentives, not to *each other* in performing the act of polluting. No shared goal exists *for the individuals* to "pollute the river together"; it's an unintended consequence of individual actions within a system. They are not a plural subject *for the action of polluting*.
      *   *Why (Yes - Metaphorical):* Legally and narratively, we *do* attribute actions to organizations ("The company polluted"). This treats the organization *as if* it were a single agent. But this is a different *kind* of "we" – an institutional, not a joint-intentional, one. Your narrative voice (a group "we") needs to decide if it's speaking as intentional actors or as an institutional entity.

  7.  **Surprise Trip:** NO ("We planned a trip to Paris").
      *   *Why:* Crucial lack of mutual awareness and responsiveness *during the planning*. Each acted entirely independently, oblivious to the other's actions. There was no shared goal ("plan a trip *together*") during the planning phase. The *outcome* (both going to Paris) is a coincidence, not the result of joint intentional action. They were not a plural subject for the action of *planning the trip*. (They *become* a "we" when they jointly react to the discovery and decide what to do next!).

  **What Your Principle Got Wrong & What You Need to Give Up:**

  *   **Your Tentative Principle:** "we did X when each of us did our part knowing the others were doing theirs, and doing our part partly because of that."
  *   **The Flaw:** It overemphasizes *prior knowledge of specific parts* and *causal dependence* ("because of that"). This fails improv (no knowledge of the *specific part* the other will play, just responsiveness to *whatever* they do) and arguably the flash mob (dancers know others are dancing generally, not *how* they'll dance specifically, but they respond to the overall event).
  *   **The Fix:** Replace "knowing the others were doing theirs" with **"mutual awareness of participation in the *shared activity* (X) and responsiveness to others' actions within it"**, and replace "doing our part partly because of that" with **"orienting action towards the *shared goal* (even emergent)"**.
  *   **What You Must Give Up:** Your conflicting gut feelings on **Flash Mob vs. Surprise Trip**. The principle demands you choose: **Flash Mob YES, Surprise Trip NO**. The difference is the **mutual awareness and responsiveness during the action**. Flash mob participants are aware *of the collective event* and responsive *to it* while dancing. The planners were isolated and unresponsive *to each other* while planning. Coincidence ≠ Joint Action.

  **A New Case & Prediction:**
  *   **The Case:** A crowded crosswalk when the light turns green. Hundreds of strangers start walking across the street at the same time, flowing around each other, avoiding collisions, moving towards the other side.
  *   **Prediction:** YES ("We crossed the street") is *often acceptable*, but it's borderline and context-dependent.
  *   *Why (Leaning Yes):* There is mutual awareness of others crossing (you see them). There is constant micro-responsiveness (adjusting pace, swerving slightly to avoid collision, flowing with the crowd). There is a clear shared goal: "cross the street safely now the light is green". The outcome (the mass crossing happening smoothly) depends on this mutual responsiveness. It forms a minimal, temporary plural subject – a "crossing-the-street-together-at-this-light" we.
  *   *Why (Could be No):* If the crowd is sparse and individuals walk without any interaction or adjustment, just individually moving from A to B, then "we" feels less appropriate. It shifts back towards coincidence. The key is the *density and necessity for responsiveness*.

  **Conclusion:**
  Your gut is inconsistent because "we" *is* doing slightly different jobs, but they all orbit the core of **joint intentional action defined by mutual awareness and responsiveness towards a shared goal**. Use this as your test for each scene:

  1.  **Is there a shared goal (explicit or emergent) for X?**
  2.  **Are the participants mutually aware they are engaged in X?**
  3.  **Are they responsive to each other's actions in performing X?**
  4.  **Is the outcome X attributable to this group interaction?**

  If yes to all, "we did X" is true for your narrative voice. If not, it's likely a collection of "I"s or an institutional attribution. This principle resolves your core conflicts (improv, flash mob, surprise trip) and provides a clear, actionable filter for your chapters. Now go fix that "we"!
