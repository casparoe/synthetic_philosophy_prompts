prompt: |-
  I run the help centre and the community forum for a small software company: every page a customer reads when something has gone wrong is written by me or by the two colleagues I train, we publish several items a day, and people act on what we write with their money and their data. I have no academic training, but I have been thinking about one question I cannot settle: when is one entitled to state something flatly, rather than hedging it, attributing it, or giving the reader the odds? It is plainly not enough that I believe it, and I am not convinced it is enough that it is true — I can write a sentence that is literally accurate and still leave a customer with a false picture of their situation. Nor does certainty look like the test: on our uptime figures it is about as near-certain as anything gets that the service will be up tomorrow, and I still would not put that sentence on a status page. I understand philosophers have offered truth, belief and knowledge as rival standards for assertion, and I want whatever survives of that debate turned into something we can actually run, in twenty minutes, with no lawyer in the room.

  Please give me a procedure for deciding what may be published as a flat claim: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure returns a no and what to publish instead (hedge, attribute, quantify, or stay silent), and the points where I am fooling myself if I treat a judgement call as mechanical. Then run it on three cases — (1) 'Your files are never shared outside the company', true as written; (2) a fix that cures the crash for roughly nine users in ten; (3) the uptime sentence above — at least one of which should come out against what I would like to publish. Finish by saying what the procedure cannot decide.

  Write in British English.
reasoning: |-
  Okay, the user runs a help centre and community forum for a small software company. They write content that customers rely on for important decisions involving money and data. They need a practical procedure to decide when to make flat claims versus hedging or attributing, without academic jargon. 

  Hmm, the user's core struggle is balancing accuracy with clarity in high-stakes communication. They've correctly identified that truth alone isn't sufficient - they mention how technically true statements can still mislead customers. The uptime example shows they understand probabilistic contexts too. What they really need is a decision tree that survives real-world chaos.

  Right, let's break this down. First, the philosophical foundations: Williamson's knowledge norm of assertion seems most relevant here - you shouldn't assert without knowledge. But "knowledge" needs unpacking for daily use. I'll define it operationally as "defensible confidence" with clear criteria.

  The procedure must handle three key tension points: 
  - Literal truth vs practical interpretation (like the files example)
  - Probabilistic outcomes (the crash fix)
  - Known unknowns (uptime guarantees)

  For structure, a four-stage filter makes sense: 
  1. Verifiability - Can we prove this now? (kills the uptime claim immediately)
  2. Interpretive safety - Will typical users misunderstand? (files example fails here) 
  3. Harm test - What's the cost if we're wrong? (all cases need this)
  4. Defensibility - Is our confidence justified? (the crash fix passes only with quantification)

  Ah, the user's self-awareness about "fooling oneself" is crucial. Need to flag judgment points explicitly: 
  - When assessing "typical" users (varies by product) 
  - Gauging harm severity (support veterans vs new users differ here) 
  - Defining "reasonable doubt" (engineers might dismiss edge cases customers hit)

  For the test cases: 
  - The files claim fails interpretive safety - "never" triggers unrealistic expectations
  - The crash fix requires quantification ("most users") and an escape hatch
  - The uptime claim gets vetoed at verifiability stage - future events can't be proven now

  Finally, the procedure's limits: It can't resolve value judgments (what counts as "material harm") or override legal requirements. And it assumes good faith - won't catch intentional deception.

  Better emphasize British English throughout. "Colour" not "color", "defence" not "defense", etc. The tone should stay practical - this is for stressed technical writers, not philosophers.
answer: |-
  Here’s a practical, philosophy-grounded procedure for deciding when to state something flatly in your help content, followed by case analyses. It prioritises **defensible confidence** over abstract notions of truth or certainty, acknowledging that your words have real-world consequences.

  ---

  ### **The Flat Claim Decision Procedure**  
  *(Run sequentially; stop at any "No")*

  1. **VERIFIABILITY CHECK**  
     *Question: "Can I prove this claim right now with direct, current evidence?"*  
     - **Sufficient answer**: Yes, if you can point to:  
       - Live system data (e.g., "Your current dashboard shows X").  
       - Reproducible steps (e.g., "Clicking Y always opens Z").  
       - Immutable policies (e.g., "Our Terms, section 3.2, state X").  
     - **No?** → **Hedge** ("appears", "suggests") or **attribute** ("according to our logs").  
     - *Judgement call*: Interpreting "direct evidence" (e.g., is a single test enough?).

  2. **INTERPRETIVE SAFETY CHECK**  
     *Question: "Will a typical user reasonably interpret this as I intend, without over/underestimating risks?"*  
     - **Sufficient answer**: Yes, if:  
       - The claim closes obvious misinterpretations (e.g., specifying "external" if "never shared" could imply internal sharing is allowed).  
       - It accounts for predictable edge cases (e.g., "unless you manually export").  
       - It avoids absolutes ("always", "never") unless truly exceptionless.  
     - **No?** → **Quantify** ("rarely"), **qualify** ("under normal conditions"), or **rephrase**.  
     - *Judgement call*: Defining "typical user" and "reasonable interpretation" for your audience.

  3. **HARM TEST**  
     *Question: "If this claim is wrong (even if true now), what’s the worst realistic harm?"*  
     - **Sufficient answer**: Low/acceptable harm if:  
       - Error causes minor inconvenience (e.g., "restart the app").  
       - Harm is reversible (e.g., incorrect settings can be reset).  
       - Users have safeguards (e.g., data backups are standard).  
     - **No?** → **Hedge vigorously**, **add warnings**, or **stay silent** until verified.  
     - *Judgement call*: Gauging "realistic harm" (e.g., data loss vs. temporary frustration).

  4. **DEFENSIBILITY AUDIT**  
     *Question: "Can I defend this claim under scrutiny (e.g., by a colleague, regulator, or angry customer)?"*  
     - **Sufficient answer**: Yes, if:  
       - Evidence is documented and audit-trailed.  
       - Confidence accounts for known unknowns (e.g., "tested on all OS versions we support").  
       - No material doubts exist among SMEs (Subject Matter Experts).  
     - **No?** → **Attribute** ("our engineers indicate"), **quantify** ("9/10 cases"), or **delay**.  
     - *Judgement call*: Whether doubts are "material" (e.g., a 1% edge case may be critical for sensitive operations).

  **OUTPUTS**:  
  - **Yes at all steps?** → State flatly.  
  - **No at any step?** → Use:  
    - **Hedge** for uncertainty ("usually", "may").  
    - **Attribute** for unverified/third-party claims ("according to X").  
    - **Quantify** for probabilities ("most users", "in 90% of cases").  
    - **Stay silent** if harm risk is high & evidence weak.

  ---

  ### **Case Analyses**  
  *(Using British English phrasing)*

  1. **"Your files are never shared outside the company"**  
     - **Verifiability**: Yes (internal policy exists).  
     - **Interpretive Safety**: **No**. Users may interpret "shared" as excluding subcontractors, backups, or legal disclosures. Absolutes invite scrutiny.  
     - **Harm Test**: High (breach of trust, legal risk).  
     - **Defensibility**: **No** (exceptions like legal requests exist).  
     → **VERDICT: Do not state flatly.** Rephrase: *"We do not share your files externally except where legally required (e.g., court orders)."*  

  2. **"This fix cures the crash for roughly nine users in ten"**  
     - **Verifiability**: Yes (if based on tested bug reports).  
     - **Interpretive Safety**: **No**. "Roughly nine in ten" is vague; users may assume *they’ll* be in the 90%.  
     - **Harm Test**: Moderate (users may blame the fix if it fails).  
     - **Defensibility**: Yes (if stats are from reproducible tests).  
     → **VERDICT: Quantify clearly.** State: *"In our tests, this fix resolved the crash for 90% of users. If issues persist, [link to backup solution]."*  

  3. **"The service will be up tomorrow"** (despite 99.99% uptime)  
     - **Verifiability**: **No**. Future states cannot be proven now.  
     - **Interpretive Safety**: **No**. "Will be up" implies ironclad certainty; outages still occur.  
     - **Harm Test**: High (users may schedule critical tasks relying on this).  
     - **Defensibility**: **No** (past performance ≠ future guarantee).  
     → **VERDICT: Stay silent or hedge.** Use: *"Based on historical uptime, we anticipate normal service tomorrow. Monitor [status page] for updates."*  

  ---

  ### **What the Procedure Cannot Decide**  
  This framework cannot resolve:  
  - **Value judgments**: E.g., whether "material harm" includes reputational damage *to the user* (not just data loss).  
  - **Legal thresholds**: When a "defensible" claim meets regulatory standards (consult your lawyer).  
  - **Ethical grey areas**: E.g., withholding truths to prevent panic (use internal escalation instead).  
  - **Cultural nuance**: How "typical users" in Japan vs. Brazil interpret absolutes.  

  The core is this: **A flat claim is a promise**. Use it only when you can *prove it*, *phrase it unambiguously*, and *accept blame if it fails*. Else, clarity with caveats builds trust more than broken certainties. When in doubt, hedge – your users’ data depends on it.
