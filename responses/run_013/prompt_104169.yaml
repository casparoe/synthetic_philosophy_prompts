prompt: |-
  I'm a novelist who each spring teaches a single session in an MFA program's elective on fiction and public life: fourteen writers, one room, two hours. Design an activity that makes them feel the force of the requirement that citizens justify their political positions with reasons their fellow citizens could accept — and feel it as writers, as the predicament of a character who has to argue in public for what she actually believes. The engine should be an admissibility rule enforced live in the room by a participant rather than by me, so that the cost of the rule falls visibly on some people and not others; build the roles so that burden doesn't fall only on the conventionally religious, and give each role a stated position, a real grounding its holder would rather not reveal, and a stake in the outcome. Give me the roles, the rule and its enforcement, a scoring scheme that needs no money, a two-hour timeline, and a debrief that maps particular moments onto the distinctions I most want them to feel: between a reason others can understand and a reason they could accept, between sincerity and admissibility in public, and between the matters the requirement is meant to bind and ordinary policy where it isn't. Neither the phrase public reason nor Rawls's name should come up until the debrief. Tell me what will predictably go wrong the first time I run it and how to handle it, and be frank about which feature of the idea the activity cannot reproduce and that I will have to supply in words. Open with the activity's central conceit in one sentence, then give the design, with no preamble and no restating of my request.
reasoning: |-
  We are going to simulate a town hall meeting where citizens must argue for a policy proposal, but they can only use reasons that are "admissible" -- reasons that their fellow citizens (as represented by a diverse group) could accept. The twist: each participant has a hidden, personal grounding for their position that they would rather not reveal, and they must navigate between sincerity and the admissibility rule.

  **Central Conceit**: In a fictional town facing a crisis, citizens must publicly justify their vote on a divisive policy by giving reasons that pass an admissibility rule enforced by a randomly selected "Moderator" who represents the town's diverse epistemic standards.

  **Roles**: 14 participants (13 citizens + 1 Moderator). Assign roles by drawing slips of paper. Each role has:
  - A publicly stated position (for or against the policy)
  - A hidden, personal grounding (a real reason they hold the position, which they want to keep private because it might be embarrassing, too personal, or based on beliefs others don't share)
  - A stake in the outcome (what they personally gain or lose if the policy passes or fails)

  **Policy Proposal**: "The town will ban all overnight street parking in residential neighborhoods to reduce crime and increase emergency vehicle access." (This is chosen because it can be argued on multiple grounds: safety, convenience, property rights, inequality, etc.)

  **Roles Details** (assign randomly, but ensure balance of for/against and diversity of hidden grounds):

  1. **Elderly Homeowner (For)**: 
     - Public: "Overnight parking blocks narrow streets, delaying emergency vehicles."
     - Hidden: Her husband died because an ambulance was delayed by parked cars.
     - Stake: She lives on a narrow street and fears for her own safety.

  2. **Young Parent (For)**:
     - Public: "Children playing in the street are at risk from cars parked overnight that limit visibility."
     - Hidden: Her child was hit by a car backing out of a driveway obscured by a parked van (but the driver was not at fault legally).
     - Stake: She wants to feel safe letting her kids play outside.

  3. **Environmentalist (For)**:
     - Public: "Fewer cars parked overnight will encourage public transport use and reduce emissions."
     - Hidden: He believes cars are a symbol of capitalist excess and wants to undermine car culture.
     - Stake: Hopes this will lead to broader anti-car policies.

  4. **Local Business Owner (Against)**:
     - Public: "This will hurt my restaurant because employees who work late have no other parking."
     - Hidden: He is undocumented and cannot get a local parking permit, so his employees (also undocumented) rely on street parking.
     - Stake: If employees can't park, they quit; he might go out of business.

  5. **Renter in Apartment (Against)**:
     - Public: "This unfairly targets renters who don't have driveways."
     - Hidden: She has a secret side job delivering packages overnight using her car, which she parks on the street.
     - Stake: Losing overnight parking would mean losing her second income.

  6. **Disability Advocate (Against)**:
     - Public: "This will make life harder for disabled residents who rely on caregivers who park overnight."
     - Hidden: She herself is disabled and her caregiver parks overnight; she fears loss of independence.
     - Stake: Without the caregiver, she would have to move to a facility.

  7. **Police Officer (For)**:
     - Public: "We've seen increased crime in areas with dense overnight parking."
     - Hidden: He wants to reduce the number of calls he has to respond to because he is burnt out.
     - Stake: Hopes for a quieter shift and less paperwork.

  8. **Teenager with Part-Time Job (Against)**:
     - Public: "I need to park on the street to get to my job early in the morning when buses don't run."
     - Hidden: He is saving money to leave an abusive home and needs the car for escape.
     - Stake: Without the car, he feels trapped.

  9. **Religious Leader (Neutral but must vote)**: 
     - Public: "We must balance safety with compassion for the vulnerable."
     - Hidden: The church parking lot is full at night because he allows homeless people to sleep in their cars there, and if street parking is banned, more will ask to use the lot.
     - Stake: The church board might stop the homeless ministry if it becomes too burdensome.

  10. **Taxi Driver (For)**:
      - Public: "Easier street cleaning and snow removal without parked cars."
      - Hidden: He has a feud with a neighbor who parks in front of his house and wants revenge.
      - Stake: He wants to annoy that specific neighbor.

  11. **College Student (Against)**:
      - Public: "This is classist; it assumes everyone can afford a garage."
      - Hidden: She deals drugs from her car parked overnight and needs the anonymity.
      - Stake: If she can't park, her business is ruined and she can't pay tuition.

  12. **Retired Veteran (For)**:
      - Public: "We need clear streets for civil defense and orderly movement."
      - Hidden: He has PTSD and the sight of crowded streets triggers his anxiety.
      - Stake: He feels safer when streets are clear.

  13. **Real Estate Agent (Against)**:
      - Public: "This will lower property values by making the town less attractive."
      - Hidden: She is having an affair with a neighbor and parks overnight on his street to avoid suspicion at home.
      - Stake: If she can't park, the affair might be discovered.

  **Moderator Role**: 
  - Enforces the admissibility rule. They are told: "A reason is admissible only if it is based on facts or principles that could be accepted by people who hold different worldviews (religious, philosophical, etc.) in our town. Personal experiences or beliefs that are not widely shared are inadmissible."
  - The Moderator has a script: "I rule that reason inadmissible because it relies on a personal belief/experience that not all citizens share." (They must say this exact phrase when ruling.)
  - The Moderator is also a citizen and will vote, but they must enforce the rule impartially during the debate.

  **Admissibility Rule**: 
  - "Reasons must be based on evidence or principles that are accessible and acceptable to all reasonable citizens, regardless of their personal beliefs or experiences. Personal stories, religious doctrines, or idiosyncratic moral views are inadmissible."
  - The Moderator will interrupt any speaker who gives an inadmissible reason and say: "I rule that reason inadmissible because it relies on a personal belief/experience that not all citizens share." The speaker must then rephrase or give another reason.

  **Scoring Scheme (no money)**:
  - Each citizen starts with 3 tokens (representing social capital). 
  - If the Moderator rules your reason inadmissible, you lose one token. 
  - If you are forced to reveal your hidden grounding (or hint at it so obviously that others guess), you lose all tokens. 
  - If you successfully use an admissible reason that sways at least one other citizen to change their vote (recorded by a show of hands before and after your speech), you gain one token. 
  - Goal: End with as many tokens as possible. (This creates tension between winning the vote and preserving social capital.)

  **Two-Hour Timeline**:

  - **0:00-0:10**: Introduce the activity: "We are in the town of Fairhaven. There's a proposal to ban overnight street parking. Each of you has a role. You must argue for your position in a town hall, but you must follow the admissibility rule enforced by the Moderator. Your goal is to keep your tokens and sway the vote if you can." Hand out role slips. Give them 5 minutes to read and internalize. Assign the Moderator randomly (draw a slip).

  - **0:10-0:15**: Moderator reads the rule aloud and the scoring system. Emphasize: "The Moderator must enforce the rule by saying the exact phrase when they hear an inadmissible reason."

  - **0:15-0:20**: Citizens may ask the Moderator for clarification on the rule (but not about specific arguments).

  - **0:20-0:50**: **First Round of Speeches**: Each citizen has 1.5 minutes to speak. The Moderator enforces the rule. Use a timer. After each speech, if the Moderator rules a reason inadmissible, the speaker loses a token (hand in one token to you, the instructor). If they successfully sway a vote (by show of hands before and after), they gain a token (you hand them one). Record vote changes visibly.

  - **0:50-1:00**: **Break**: Citizens may talk among themselves. They may try to form alliances or adjust arguments. The Moderator is off-duty during break and can talk too.

  - **1:00-1:30**: **Second Round of Speeches**: Same as first, but now citizens know the rule better. They can respond to others. Same timing and token rules.

  - **1:30-1:40**: **Final Vote**: Secret ballot on the policy. While votes are counted, each citizen writes down their hidden grounding and stakes on a slip (for debrief, not shared yet).

  - **1:40-2:00**: **Debrief**:

    - First, reveal the hidden groundings and stakes (anonymously or by role, as they feel comfortable).
    - Discuss: 
      - Which arguments were ruled inadmissible? Why?
      - How did it feel to have to hide your real reason? 
      - When did you see someone almost reveal their hidden grounding? 
      - Which arguments swayed votes? Were they the most sincere? The most admissible?
    - Map to concepts:
      - "The rule was trying to make you give reasons that others could accept, not just understand. What's the difference?" (E.g., "I understand your religious reason, but I don't accept it as binding for the town.")
      - "Sincerity vs. admissibility: Sometimes the most heartfelt reason was ruled out. What does that do to public discourse?"
      - "This rule is meant for fundamental political questions (like basic rights or the structure of society), not for ordinary policy. But in this case, we applied it to parking. When might such a rule be essential? When might it be too heavy-handed?"
    - Finally, name the concepts: "In political philosophy, this is called the requirement of public reason, associated with John Rawls. It's meant for when we debate the basic rules of society."

  **What Will Go Wrong and How to Handle**:

  - **Problem**: The Moderator might be inconsistent or too lenient/strict.
    - **Handle**: Before starting, give the Moderator a few examples of admissible and inadmissible reasons. Have a cheat sheet for them. During the activity, if it's going off track, you can pause and remind the Moderator of the rule (but don't overrule them publicly).

  - **Problem**: Participants might ignore the rule or argue with the Moderator.
    - **Handle**: Set the norm at the start: "The Moderator's ruling is final. If your reason is ruled out, you must rephrase or move on. Arguing costs you 30 seconds of your speaking time."

  - **Problem**: Hidden groundings might be revealed too early or not at all.
    - **Handle**: Emphasize the token penalty for revealing. In debrief, you can reveal what they were to show the tension.

  - **Problem**: Token system might distract from the main point.
    - **Handle**: Keep token exchanges quick and symbolic. Focus debrief on the emotional and strategic experience.

  **Feature the Activity Cannot Reproduce and You Must Supply in Words**:
  The activity simulates the *strategic* and *emotional* cost of hiding one's true reasons, but it cannot fully replicate the *moral weight* of public reason in a pluralistic democracy — the idea that we owe this to each other as free and equal citizens. You must explain that in the debrief: "In real life, this isn't just a game; it's a way to respect others' freedom by not imposing views they cannot reasonably accept. That's why we do it, even when it's hard."
answer: |-
  ### Central Conceit
  In a town hall debate over a controversial noise ordinance, citizens must justify their votes using only reasons that pass an admissibility rule enforced by a peer moderator, forcing them to conceal deeply personal stakes while navigating public scrutiny.

  ### Roles (14 Participants)
  Assign roles randomly via slips of paper. Each includes:  
  - **Public Position**: Stated stance for the debate.  
  - **Hidden Grounding**: Real, vulnerable reason (concealed).  
  - **Stake**: Personal consequence of the vote outcome.  

  1. **Environmental Scientist (For the ordinance)**  
     - Public: "Nighttime noise pollution disrupts local wildlife ecosystems."  
     - Hidden Grounding: Her child has sensory processing disorder; sleep deprivation worsens meltdowns.  
     - Stake: If ordinance fails, she must move schools for her child, costing her a promotion.  

  2. **Bar Owner (Against the ordinance)**  
     - Public: "The law unfairly targets small businesses that rely on nightlife revenue."  
     - Hidden Grounding: He’s secretly using profits to fund his brother’s cancer treatment.  
     - Stake: If ordinance passes, his bar closes, cutting off treatment funds.  

  3. **Single Parent (For the ordinance)**  
     - Public: "Excessive noise prevents children from focusing on homework at night."  
     - Hidden Grounding: She’s recovering from domestic violence; loud noises trigger panic attacks.  
     - Stake: If ordinance fails, she relapses into PTSD therapy, risking custody.  

  4. **Night Shift Nurse (Against the ordinance)**  
     - Public: "Daytime noise from construction is the real issue; this distracts from it."  
     - Hidden Grounding: She hosts underground AA meetings at home; silence rules would expose attendees.  
     - Stake: If ordinance passes, her meetings stop, risking her sobriety.  

  5. **Retired Veteran (For the ordinance)**  
     - Public: "Quiet hours are essential for community respect and mental well-being."  
     - Hidden Grounding: He associates loud nights with combat trauma and has attempted suicide twice.  
     - Stake: If ordinance fails, his VA benefits are reviewed due to "instability."  

  6. **College Student (Against the ordinance)**  
     - Public: "This criminalizes young people for harmless socializing and stifles cultural growth."  
     - Hidden Grounding: He records music at night; his album is his only escape from family poverty.  
     - Stake: If ordinance passes, his demo deal collapses, forcing him to dropout.  

  7. **Religious Leader (Neutral, leaning Against)**  
     - Public: "The law should emphasize community mediation, not punishment."  
     - Hidden Grounding: His congregation includes undocumented immigrants afraid of police noise complaints.  
     - Stake: If ordinance passes, raids at gatherings could lead to deportations.  

  8. **Home-Based Therapist (For the ordinance)**  
     - Public: "Clients need guaranteed quiet for teletherapy sessions at night."  
     - Hidden Grounding: She’s hiding her own depression; noise amplifies her suicidal ideation.  
     - Stake: If ordinance fails, her licensure lapses due to "impaired focus."  

  9. **Rideshare Driver (Against the ordinance)**  
     - Public: "Ticketing nighttime gatherings hurts gig workers who depend on surge pricing."  
     - Hidden Grounding: His car is his home; overnight bans leave him homeless.  
     - Stake: If ordinance passes, he loses shelter and his driver’s license.  

  10. **Schoolteacher (For the ordinance)**  
      - Public: "Sleep-deprived students undermine classroom performance."  
      - Hidden Grounding: She’s concealing early-stage Alzheimer’s; noise confusion accelerates her symptoms.  
      - Stake: If ordinance fails, her diagnosis goes public, ending her career.  

  11. **Artist (Against the ordinance)**  
      - Public: "Creative expression often happens at night; this kills artistic innovation."  
      - Hidden Grounding: She’s in witness protection; silence would draw attention to her "hidden" life.  
      - Stake: If ordinance passes, her cover breaks, endangering her family.  

  12. **Local Librarian (Neutral, leaning For)**  
      - Public: "Libraries host overnight digital access programs; noise disrupts equity efforts."  
      - Hidden Grounding: She’s illiterate and uses nighttime quiet to secretly teach herself.  
      - Stake: If ordinance fails, her illiteracy is exposed, costing her job.  

  13. **Small Farmer (Against the ordinance)**  
      - Public: "Nocturnal animal care requires movement and sound; this penalizes agriculture."  
      - Hidden Grounding: He’s growing illegal medicinal herbs for his dying wife.  
      - Stake: If ordinance passes, increased patrols discover his crop, leading to arrest.  

  14. **Moderator (Enforcer, no fixed position)**  
      - **Duty**: Enforce the admissibility rule during speeches.  
      - **Hidden Grounding**: His son is the town’s worst noise offender; he fears the debate will expose this.  
      - **Stake**: If enforcement is seen as biased, his family is publicly shamed.  

  ### Admissibility Rule & Enforcement  
  - **Rule**: "Reasons must be based on facts, principles, or values that all citizens could reasonably accept, regardless of their private beliefs. Personal experiences, emotions, or unverifiable claims are inadmissible."  
  - **Enforcement**:  
    - Moderator interrupts any speaker with: "That reason is inadmissible—it relies on something not all citizens can accept."  
    - Speaker must rephrase immediately or lose their turn.  
    - **Cost**: Visible token loss (see scoring) and public pressure.  

  ### Scoring Scheme (No Money)  
  - Each participant starts with **3 "Trust Tokens"** (e.g., colored paper clips).  
  - **Lose 1 token** if the Moderator rules your reason inadmissible.  
  - **Lose 2 tokens** if you accidentally reveal your hidden grounding (peer-reported).  
  - **Gain 1 token** if another citizen cites your argument as "acceptable" in their speech.  
  - **Goal**: Maximize tokens. Tokens = social capital in the debrief.  

  ### Two-Hour Timeline  
  **0:00–0:15: Setup**  
  - Hand out roles. Give participants 5 minutes to read their role.  
  - Brief Moderator separately: Emphasize impartiality and the exact ruling phrase.  
  - Announce: "You’re citizens of Cedar Hill debating a noise ordinance. Argue your position using only admissible reasons. The Moderator will enforce the rule."  

  **0:15–0:25: Rule Calibration**  
  - Moderator reads the admissibility rule aloud.  
  - Conduct a 1-minute "test speech" (volunteer role) with Moderator rulings for clarity.  

  **0:25–0:50: First Speeches (60 sec each)**  
  - Participants speak in random order. Moderator enforces rule live.  
  - **Token actions**: Hand tokens to you when lost; you distribute when gained.  

  **0:50–1:00: Alliance Building**  
  - Open floor for private negotiations. Participants strategize new arguments.  
  - Moderator circulates but cannot rule.  

  **1:00–1:30: Second Speeches (90 sec each)**  
  - Speakers rebut opponents. Moderator rules strictly.  
  - Record token changes visibly on a board.  

  **1:30–1:40: Final Vote & Revelation**  
  - Secret ballot on the ordinance.  
  - Participants anonymously write their hidden grounding on a slip for the debrief.  

  **1:40–2:00: Debrief**  
  - **Reveal**: Share anonymous hidden groundings. Ask: "How did hiding this shape your arguments?"  
  - **Key Distinctions**:  
    - **Understand vs. Accept**: "When did you use a reason others *understood* but couldn’t *accept* as fair? (e.g., the Veteran’s trauma was understood but ruled inadmissible)."  
    - **Sincerity vs. Admissibility**: "When did you mask a sincere reason to make it admissible? (e.g., the Bar Owner hiding medical funding as 'small business impact')."  
    - **Binding vs. Non-Binding**: "This rule binds debates about shared civic life (like rights). For routine policy (e.g., potholes), we wouldn’t need it. When did this feel mismatched to a noise law?"  
  - **Connect to Writing**: "As fiction writers, your characters face this: arguing for beliefs while hiding vulnerabilities. How does this tension shape dialogue and conflict?"  
  - **Name Concepts**: Only now reveal: "This mirrors 'public reason' (Rawls)—justifying power in ways all citizens can accept."  

  ### Predictable Problems & Fixes  
  - **Problem**: Moderator hesitates to rule.  
    - **Fix**: Privately remind them: "Your role is to make the cost visible. Inconsistency undermines the exercise."  
  - **Problem**: Participants ignore the rule or reveal hidden groundings.  
    - **Fix**: Pause and restate: "The rule forces hard choices. Losing tokens shows the real-world cost of exclusion."  
  - **Problem**: Token trading distracts from arguments.  
    - **Fix**: Use large, visible tokens (e.g., poker chips) and minimize handling time.  

  ### Unreproducible Feature & Your Role  
  - **The Missing Element**: The activity can’t replicate the **moral weight of mutual respect** underpinning public reason—that we owe justifications to others as equals.  
  - **Supply in Words**: During debrief, say: "This isn’t just strategy. In democracy, we hide personal truths not to lie, but to respect others’ freedom. We ask: 'Could my reason bind someone who doesn’t share my life?' That respect is the force no game can simulate—writers must evoke it in character."  

  ---  
  **Why This Works**: The noise ordinance is neutral but high-stakes, ensuring no group (e.g., religious) bears disproportionate burden. Tokens make exclusion tangible, and the Moderator’s personal stake prevents impartiality from feeling academic. Writers will feel the character’s dilemma: the gap between inner truth and public speech.
