prompt: |-
  Okay so some context: I'm not a philosopher, I just end up at dinners where people argue about this stuff, and I never know who's actually right. Last weekend I was at a friend's place and two of her friends went at each other for like an hour, and I've been chewing on it since.

  I'd like you to take on the role of someone who actually works on political ethics — somebody who's spent real time on the question of whether a leader can be justified in doing something morally wrong. Before you give any verdicts, think it through carefully and maybe start by spelling out what each of them is actually committed to, since I suspect they're talking past each other in places.

  Here's the case they were fighting about. A mayor of a mid-sized city got told in confidence that the town's biggest employer was going to shut the plant and move everything out of state. She was bound by a confidentiality agreement — if the company found out she'd leaked, they'd move faster and scrap the severance and the retraining program they'd already agreed to, so more people would get hurt, not fewer. So she said nothing. Then a couple weeks later she stood at a ribbon-cutting for the company's new training center and gave a speech about how committed they were to this community and how the future was here. People in that audience went home and, on the strength of that, some of them bought houses and took out loans. Three months later the plant closed. She has never admitted she knew.

  Alina said: "She stood up in front of a room and lied so they'd feel safe, and they went out and signed mortgages because of it. My aunt's neighbor took out a second mortgage off that speech. That's not a hard call, that's using people's trust and then calling it prudence."

  Marcus said: "So what was the better option? Tell everyone and make it worse for the exact people you say she betrayed? She had two doors and one of them hurt more people. Picking the door that hurts fewer people isn't a betrayal, that's the job. If you want to condemn her you have to name the better option, and there wasn't one."

  Alina: "There wasn't a good option, sure. But 'she made the best choice available' and 'she did nothing wrong' are two different sentences. She still did it — on purpose, to people who trusted her. Being cornered explains it, it doesn't erase it. And the erasing matters, because if it isn't wrong then there's nothing to answer for, and if there's nothing to answer for then the powerful can do whatever the math likes. She owes those people something."

  Marcus: "Owes them what? Guilt? That's free for her and worth nothing to them. A confession? That tanks the city's trust in the office and changes nothing for anyone who lost a house — it'd just be her buying a clean conscience with other people's money. If she was justified, then 'she did wrong' is just you saying you didn't like it."

  Alina: "It isn't that I didn't like it. It's that a justification isn't a permission slip. When you're stuck between two bad things you don't get to relabel the one you picked as good — you take it on and carry it. And carrying it isn't theater, it's the thing that stops you from getting comfortable, which is how people end up doing the smaller version of this next year for no reason at all. If she's fine with it, that's the part I'd worry about."

  Marcus: "But notice what you just did — you moved the whole thing inside her head. If she has to feel bad but can never say so, then from the outside she's identical to a mayor who doesn't care. So what does your 'she owes them' actually cash out to? Nothing anyone can see."

  I coudln't referee this at all. Can you go through it move by move — for each one, say whether the person is right, wrong, or right about something narrower than they think, and why. Then tell me what both of them are missing, and whether any chunk of this is just a fight about words. You don't need to cite any philosophers, I'm not going to go look them up — just reason it out. And please don't just hand me a winner; I want to know which specific claims survive and which don't, and then, if you have to, who's more right overall.
