prompt: |-
  My sister teaches 7th grade special ed and she's in a standoff with her district over how they count 'reading proficiency.' Her class has a kid who's blind and reads Braille, a kid with dyslexia who uses text-to-speech at like 400 words a minute, and a kid who can't use her hands and reads with eye-tracking software. All three score the same on the state comprehension test as the kids reading regular print. The district says their scores can't count, because the test is only validated for print and the kids are 'accessing the text differently.' My sister says if they can do the thing the test is testing, they can read, and the district is just describing the plumbing. I'm a software dev so my gut says if it does the same job it's the same thing, but that gut has burned me before.

  Two wrinkles she mentioned. One student aces every comprehension question, but a week later cant tell you a thing about the book and can't use anything from it in a new context. Another kid answers everything right but says he doesn't see anything in his head while he reads, and never gets the jokes.

  So who's actually right, and whats the real disagreement here? Does anything change if one of the kids uses an AI app that reads the book to him and basically answers the questions for him?

  Give me back a JSON object with these fields:

  - "verdict": 2-3 sentences on who I should side with
  - "what_the_fight_is_really_about": the underlying disagreement in plain terms, no jargon
  - "kid_by_kid": an array of objects, one per student, each with "kid", "what_they_do", "same_thing_as_print_reading_or_not" (yes/no/it depends), and "why"
  - "strongest_case_for_district": the best version of their position, not a strawman
  - "strongest_case_for_sister": same, best version
  - "what_both_sides_are_talking_past": where they're not even disagreeing about the same question
  - "the_ai_kid": what changes, if anything, when the answers come from an app
  - "what_would_flip_the_verdict": what facts would change your answer
reasoning: |-
  Hmm, the user is asking me to weigh in on an educational debate involving his sister, who's a 7th grade special ed teacher in conflict with her school district. The core issue is whether students who use alternative methods to access text - Braille, text-to-speech, or eye-tracking software - should be counted as "proficient readers" when they score well on comprehension tests. The district is excluding their scores because the test was validated for print reading only.

  The user has shared several interesting wrinkles: one student aces tests but can't retain information long-term or apply it in new contexts; another gets answers right but lacks visualization and misses humor elements. He also poses a hypothetical about an AI app that essentially answers questions for the student.

  I need to analyze this carefully. The sister argues that reading is about comprehension - "the thing the test is testing" - regardless of the input method ("plumbing"). The district insists the test only measures proficiency with printed text. Both have reasonable points when viewed through different lenses.

  For the Braille user, this seems fundamentally equivalent to print reading since it's direct tactile decoding. The text-to-speech user at 400 wpm raises questions about cognitive processing speed versus comprehension. The eye-tracking student likely faces similar issues to the Braille reader. The retention-deficient student exposes a gap in what the test measures versus real-world application. The non-visualizing student suggests comprehension without typical phenomenological experiences.

  The AI hypothetical is particularly telling - it would represent outsourcing cognition, not reading proficiency. This highlights the district's valid concern about what exactly is being measured.

  The real disagreement appears to be whether "reading" means decoding written symbols (district) versus comprehending language (sister). They're also talking past each other on whether standardized tests can validly measure the latter when the input method differs.

  I'll structure my response as a JSON object with the specified fields. For the verdict, I'll lean toward the sister's broader definition of reading as comprehension, while acknowledging the district's point about test validity limitations. For each student, I'll assess whether their method constitutes "reading" equivalently. And I'll note that verifiable cognitive outsourcing (like the AI scenario) would fundamentally change the equation.
