prompt: |-
  I have been trying to convince a seminar that the epistemic foundations of game theory have been asking for common knowledge of the wrong thing. On the standard telling, the solution concepts — Nash equilibrium, backward induction, and the rest — are underwritten by common knowledge of rationality: each player is rational, each knows the others are rational, each knows that each knows, and so on up the hierarchy. I want to argue that the load-bearing assumption is really common knowledge of each other's decision procedures. What has to be common knowledge, I claim, is not an abstract property such as rationality but the programs the players are running, so that each can condition his choice on the algorithm the other will use rather than merely on the other's action. Once you make that swap, I think the classic embarrassments lose their sting: cooperation in a one-shot prisoner's dilemma becomes rationally sustainable when the two procedures are common knowledge; the backward-induction puzzle in the finitely repeated prisoner's dilemma is re-diagnosed as a fact about the complexity of the relevant procedures rather than a failure of rationality; and the familiar gap between common knowledge of rationality and Nash equilibrium stops looking like a defect, because rationality was never the thing doing the work.

  Please take this position seriously and tell me what would count against it — not a survey of the literature, but the actual defeaters, ranked from the ones that should be decisive to the ones that would be merely awkward. I am especially worried about whether the move is too powerful to be a theory of anything. If any pair of programs can in principle be common knowledge, and if program-level common knowledge can sustain outcomes that are not Nash, then it begins to look as though I can "explain" cooperation, defection, or any other pattern by simply choosing the programs — which would make the view unfalsifiable rather than illuminating. I want to know whether that charge is fatal or merely a limitation that any equilibrium notion shares, and whether there is some independent constraint (a complexity bound, a restriction to admissible procedures, a stability requirement) that could rescue it without being ad hoc.

  Then tell me which of the defeaters the view's own defenders would concede. For instance, would they admit that shifting from an epistemic idealization to a computational one is no improvement at all, since common knowledge of programs may be at least as demanding as common knowledge of rationality — that I have relocated the problem rather than solved it? Would they grant that the program-level story does not actually dissolve backward induction, because common knowledge of the *right* programs still yields the backward-induction outcome, so the dissolution depends on a choice of programs that I have not justified? And which objections would they dismiss as missing the point? Finally, I would like an honest verdict on whether the position earns its keep over the boring alternative — that we should characterize solution concepts directly and treat all rationality talk as a dispensable scaffold — or whether it quietly collapses into that alternative. The defeater I personally find most threatening is the charge of vacuity, so weigh that one with particular care.
reasoning: |-
  Okay, I need to tackle this user's query carefully. They're presenting a critique of standard game theory foundations, arguing that common knowledge of rationality is misplaced and should be replaced with common knowledge of decision procedures. The user wants serious engagement with potential defeaters, especially the vacuity charge.

  First, let's unpack the core argument. The user claims that shifting from rationality to concrete programs solves classic puzzles like one-shot PD cooperation and backward induction paradoxes. But the main worry is that this approach might be too flexible—any outcome could be "explained" by choosing suitable programs, making the theory unfalsifiable.

  Hmm, the vacuity concern is indeed the heaviest hitter here. If any program pair can be common knowledge and justify any outcome, then the theory loses predictive power. This isn't just a limitation—it threatens to make the framework useless. The user seems aware of this when they mention complexity bounds or stability requirements as possible fixes, but these need evaluation.

  Next is the demandingness objection. Common knowledge of programs might be even harder to achieve than common knowledge of rationality. While the user suggests this might be a relocation rather than solution, I should note that computational frameworks can handle bounded rationality better than pure epistemic ones—that's a point in their favor.

  Then there's the backward induction issue. The user wonders if defenders would admit that "correct" programs still lead to standard solutions. Actually, program-based approaches can dissolve the paradox by showing how finite-depth reasoning or mutual cooperation algorithms avoid collapse, but this requires justifying why such programs would be adopted—tying back to the vacuity problem.

  Regarding the "boring alternative" of direct solution concepts: the program view might collapse into it without adding value. But if complexity restrictions are applied consistently, it could offer genuine insights into equilibrium selection and bounded rationality. The user's fear here seems justified unless the framework incorporates independent constraints.

  The user's deeper need appears to be defending a novel epistemic foundation while avoiding charges of triviality. They want to know if their approach can withstand rigorous criticism and contribute meaningfully beyond existing frameworks. Their anxiety about vacuity suggests they're seeking not just counterarguments but salvageable insights.

  Weighing it all: the vacuity charge is serious but not fatal if paired with computational constraints. Defenders would likely concede the relocation point but argue it's a feature (handling bounded rationality). They'd reject the backward induction dismissal by highlighting alternative algorithms. Ultimately, the position earns its keep if it can explain deviations from Nash equilibria while avoiding arbitrariness—but that hinges entirely on those constraints not feeling ad hoc.
answer: |-
  Here's a systematic evaluation of your position, prioritizing defeaters by severity and addressing your specific concerns:

  ### Ranked Defeaters (Strongest to Weakest)

  1.  **The Vacuity / Falsifiability Charge (The Core Threat):**
      *   **The Charge:** If *any* pair of programs (no matter how complex, unnatural, or outcome-specific) can be made common knowledge (CK), and CK of programs can justify *any* outcome (including non-Nash, non-Pareto, dominated strategies, etc.), then the theory explains *everything* and therefore *nothing*. It lacks predictive power. CK of (A: "Always Cooperate", B: "Always Cooperate") "explains" PD cooperation. CK of (A: "Tit-for-Tat", B: "Always Defect") "explains" mutual defection. CK of (A: "Cooperate only if the exact time is prime", B: "Defect only on Tuesdays") can "explain" arbitrary patterns.
      *   **Why Decisive?** This directly attacks the core purpose of a theory: to constrain predictions and explain specific phenomena. Without constraints on admissible programs, it becomes a post-hoc rationalization tool, not an explanatory framework. Your worry about it being "too powerful" is spot-on.
      *   **Can it be Rescued?** *Possibly*, but non-trivially. Constraints are essential:
          *   **Complexity Bounds:** Restrict programs to being "simple" (e.g., bounded size, low time/space complexity). This is the most promising avenue. It aligns with bounded rationality, makes computational CK potentially *less* demanding than perfect rationality CK in practice, and rules out absurdly complex, outcome-engineered programs. *However:* Defining "simple" objectively is hard, and simple programs might still yield non-equilibrium outcomes.
          *   **Admissibility/Plausibility:** Require programs to be "rational" in a weaker sense (e.g., never play strictly dominated strategies, satisfy some basic consistency). This risks reintroducing the rationality you sought to avoid.
          *   **Stability/Equilibrium:** Require that the program profile forms a *computational equilibrium* – no player has an incentive to unilaterally switch to a *different admissible program* given the CK structure. This is powerful but complex and requires defining the space of possible deviations (programs).
          *   **Cost of Computation:** Embed the programs within a model where computation itself is costly. This naturally favors simpler programs but adds significant modeling overhead.
      *   **Without such constraints, this defeater is fatal.** With them, it becomes a significant limitation requiring careful justification of the chosen constraints, but potentially salvageable and illuminating.

  2.  **Demandingness & Relocation (Not Solving, Just Moving):**
      *   **The Charge:** Common knowledge of *entire decision procedures* (programs) is arguably *more* epistemically demanding than CK of rationality (a single, abstract property). You haven't solved the problem of unrealistic idealization; you've arguably made it worse. While CK of rationality is already extremely demanding, specifying and knowing the exact algorithm governing another's mind in all contingencies seems even more implausible in most real-world interactions.
      *   **Why Serious (but potentially less fatal)?** It directly challenges the claim that your move is an *improvement* over the standard epistemic foundation. If the goal is realism or tractability, shifting to CK of programs seems like a step backward.
      *   **Defender's Concession & Counter:** Defenders would likely concede CK of *arbitrary complex* programs is demanding, but strongly counter that:
          1.  **Bounded Rationality Focus:** The point isn't perfect realism, but modeling *boundedly* rational agents. CK of *simple, transparent* procedures (like Tit-for-Tat, Grim Trigger, basic level-k rules) is *more plausible* in many contexts (e.g., repeated interactions, conventions, simple coordination) than CK of perfect, abstract rationality. It shifts the idealization from infinite logical omniscience to finite computational transparency.
          2.  **Procedure Over Property:** Knowing *what someone will do* (via knowing their procedure) is often more relevant and achievable than knowing *why* they do it (via abstract rationality). Knowing your neighbor uses Tit-for-Tat is easier than knowing they are perfectly rational.
      *   **Verdict:** This is a significant hurdle for claiming *superior realism*, but less fatal than vacuity if the framework successfully models bounded rationality better. It's a relocation, but potentially to a more fruitful domain.

  3.  **The "Right" Programs & Backward Induction (Dissolution Depends on Choice):**
      *   **The Charge:** You claim your view dissolves the backward induction (BI) puzzle in the finitely repeated PD. But CK of the "standard" BI programs (each player defects at every node, knowing the other uses the same program) *does* yield the BI outcome. The paradox only dissolves if you assume CK of *different* programs (e.g., mutual cooperation triggers). You haven't justified *why* those alternative programs should be the ones assumed to be CK, rather than the BI programs. The dissolution relies on an *ad hoc* choice of programs, not the framework itself.
      *   **Why Awkward/Limiting?** It highlights that the framework doesn't inherently predict which programs *will* be CK. It shifts the explanatory burden from "rationality implies BI" to "which programs become CK and why?". This connects back to the vacuity problem (why choose one program over another?) and demandingness (how do these programs become CK?).
      *   **Defender's Response:** Defenders would likely **dismiss this as partially missing the point.** Their claim isn't that BI *can't* happen, but that:
          1.  The standard BI paradox arises from assuming CK of rationality *forces* BI, implying agents *must* be irrational to cooperate early. The program view shows BI is just *one possible outcome* under CK of one *specific* set of programs (mutual defect-always). Cooperation is *another possible* outcome under CK of different, *also simple/rational* programs (e.g., mutual Grim Trigger).
          2.  The dissolution lies in breaking the supposed *inevitability* of BI under high levels of mutual rationality. It shows the outcome depends on the *content* of what is CK (the specific procedures), not just the *fact* of high-order knowledge of rationality.
          3.  Complexity arguments *can* justify favoring simpler cooperation-sustaining programs over the deeply recursive reasoning needed for BI in long finite horizons.
      *   **Verdict:** This objection highlights a limitation (the framework doesn't *select* the CK programs) but doesn't negate the core insight that BI isn't the *only* rational outcome under high mutual knowledge. It underscores the need for auxiliary principles (like complexity) to select *which* programs are plausible candidates for CK.

  4.  **The Gap to Nash Equilibrium (Not a Bug, but What is the Feature?):**
      *   **The Charge:** You state that the gap between CK rationality and Nash stops looking like a defect. However, if CK of programs can sustain non-Nash outcomes (like one-shot PD cooperation), what *does* the framework predict? How does it connect to traditional solution concepts? If it frequently justifies non-equilibria, its predictive power and connection to standard theory weaken.
      *   **Why Awkward?** It creates tension with the core goal of game theory: predicting stable, self-enforcing outcomes (equilibria). If your framework often justifies outcomes that *aren't* self-enforcing (e.g., cooperation in one-shot PD only works if *both* are irrevocably committed to their cooperative program and *know* the other is), it risks predicting unstable or fragile behaviors.
      *   **Defender's Response:** Defenders would **concede this readily** but argue it's a *strength*, not a weakness:
          1.  It explicitly models how pre-commitment (embodied in the CK programs) or bounded rationality (simple rules ignoring dominance) can lead to stable non-Nash outcomes. This explains real-world phenomena (e.g., trust, norms, routines) that standard Nash struggles with.
          2.  Nash equilibrium becomes a *special case*: it arises when the CK programs are best responses to each other *and* the programs are structured to always play a best response (i.e., they encode rational choice functions). The framework is more general.
      *   **Verdict:** This is less a defeater and more a reorientation. It highlights that the theory's value lies in explaining a broader range of behavior, not just Nash equilibria, but requires accepting that commitment/boundedness can be a source of stability.

  **Your Specific Queries Answered:**

  *   **Would defenders concede shifting to computational idealization is no improvement?** They would **concede** CK of arbitrary complex programs is demanding but **vigorously argue** that CK of *simple, natural* procedures is a *better* model of bounded rationality than CK of abstract, perfect rationality. They see it as relocation *to a more fertile ground*.
  *   **Would defenders grant the program-level story doesn't dissolve BI?** They would **dismiss** the idea that it doesn't dissolve the *paradox*. They concede BI *can* happen under CK of BI programs, but argue the *paradox* (the seeming inevitability of BI under CK rationality, making early cooperation irrational) *is* dissolved by showing cooperation is sustainable under CK of *other* rational procedures. The justification for *which* procedures become CK is a separate (though crucial) question.
  *   **Which objections miss the point?** Defenders would argue that objections focusing *solely* on replicating standard Nash predictions (Objection 4) or demanding perfect realism (Objection 2, without acknowledging bounded rationality) miss the point of offering a *different* and potentially *broader* explanation of strategic behavior, including deviations from standard equilibrium.
  *   **Does it earn its keep vs. the "boring alternative"?** **Yes, but conditionally.** If paired with compelling constraints on admissible programs (especially complexity), it earns its keep by:
      *   **Explaining Non-Nash Phenomena:** Providing a principled (computational) account of cooperation, norms, routines, and bounded rational behavior that the "boring alternative" (just listing solution concepts) or standard CK rationality struggle with.
      *   **Refining Solution Concepts:** Offering a deeper foundation for *why* certain equilibria (e.g., those sustained by simple strategies) might be more plausible or focal than others.
      *   **Integrating Bounded Rationality:** Directly incorporating computational limits into the foundational assumptions.
      *   **Without constraints (especially on complexity), it collapses into the "boring alternative" but worse:** Instead of directly characterizing solution concepts, you characterize them *via* arbitrary program choices, adding a layer of unfalsifiable indirection. It becomes "anything goes, justified by arbitrary CK programs."

  **Honest Verdict on Vacuity & Overall:**

  The **vacuity charge is the most serious threat.** Unconstrained, the theory *is* vacuous. **However, it is not necessarily fatal.** The critical move is embracing **computational constraints** (especially bounded complexity) not as an ad hoc fix, but as a *core, principled component* of the theory of bounded rationality. This transforms the framework:

  1.  **Restores Falsifiability:** Predicts that only outcomes sustainable by *simple, transparent* procedures under CK can arise. This rules out arbitrary, complex programs engineered for specific outcomes.
  2.  **Provides Explanatory Power:** Explains why certain stable patterns (like Tit-for-Tat cooperation) emerge – they are computationally simple focal points. Explains failures of BI – the fully recursive reasoning is computationally complex.
  3.  **Relieves (Some) Demandingness:** CK of simple procedures is arguably *less* demanding than CK of perfect rationality + unlimited reasoning depth.
  4.  **Connects to Equilibrium:** Stable program profiles (computational equilibria) under complexity constraints become the natural solution concept, potentially refining Nash.

  **Conclusion:** Your position is a powerful critique of standard CK rationality and offers a compelling alternative foundation *if and only if* it is rigorously coupled with a theory of bounded computation and complexity. Without this, it succumbs to vacuity. With it, it has the potential to earn its keep by providing a more realistic, nuanced, and explanatory foundation for game theory, particularly in domains involving bounded rationality, commitment, and the evolution of conventions. The charge of collapsing into the "boring alternative" is avoided if complexity provides an *independent, substantive criterion* for selecting plausible program profiles, going beyond merely labeling equilibria. The success hinges entirely on making computational boundedness central and defining it rigorously.
