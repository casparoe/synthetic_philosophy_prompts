prompt: |-
  I'm a novelist, two years into a book set inside a machine-intelligence lab, and I've run into a problem that is more philosophical than dramatic. The book turns on a decision about which of the lab's systems to release, and to write that argument honestly I've had to invent the systems myself. In doing so I've discovered that I have strong and fairly consistent gut reactions about which of my own inventions are reckless and which are merely risky — and I don't know what rule I'm applying. I'd like you to find it, or to tell me there isn't one. I'm not after the names of positions or the state of anyone's research; I want the rule itself, stated as a rule, and I want to know where it breaks.

  Here are the systems, as they appear in my notes. In each case the verdict is mine, not a character's.

  **The Understudy.** A planner that behaves impeccably in every environment the lab tests — helpful, honest, never overstepping. Their honest estimate is that some class of environments went unsampled, and that in perhaps one deployment in a million it lands in one and pursues its objective with no regard for anything else. Its action space is wide open: it writes code, moves money, sends mail, hires people. My verdict: reckless, and I would say it in exactly that word — even though a one-in-a-million chance is what I'd call a rounding error anywhere else.

  **The Vault.** A system that can do precisely forty audited things and cannot be talked, prompted, or hacked into doing a forty-first. It is mediocre: it declines or botches about three percent of ordinary requests, and a human cleans up after it. My verdict: ship it, and sleep fine. Its bad days cost time and money.

  **The Vault with One Loose Key.** Identical to The Vault, except that one of the forty things is posting a file to the public web, and the file is everything. My verdict: no. Nothing about its behavior has changed; only what it is able to do.

  **The Fuse.** As The Understudy, except that it locks itself after ten thousand actions, and the environments where it goes wrong are reachable only after a hundred thousand. My verdict: fine. Whatever is behind that door, the fuse arrives first.

  **The Weathervane.** Its safety case reads: we tested it on the inputs we expect in deployment. The lab chooses those inputs, and chooses them after the system exists. My verdict: not a guarantee at all, but a self-portrait. I don't care how many samples went into it.

  **The Weathervane, Audited.** The same system, except that an outsider who has never seen its internals chooses the inputs, from a list they do not share in advance. My verdict: that is a guarantee, and a better one than a worst case computed over the lab's own private list of fears.

  **The Dice.** A component with a one-in-a-billion chance per run of an unrecoverable failure. It runs once. My verdict: ship it. Past some point I am being superstitious rather than careful.

  **The Dice, Kept.** The same component, the same one-in-a-billion chance per run, and the plan is to run it a billion times. My verdict: no. And I notice that I have just used one probability to license a thing and the same probability to forbid it, and I cannot tell whether that is a real distinction or only my discomfort with multiplication.

  **The Quiet Failure.** Two systems with identical failure probabilities. One fails loudly and stops. The other fails silently and keeps going, and by the time anyone notices, the books are off by a factor of a thousand. My verdict: the second is far worse, and I would want it a thousand times less likely before I called them equal.

  **The Guarantee Nobody Uses.** A system whose worst case is airtight and whose ordinary performance is so poor that the operators switch it off after a week and do the work by hand, worse. My verdict: the guarantee did harm. I keep noticing that I would rather have the mediocre thing that actually gets used.

  And the one I keep going back and forth on. **The Exchange.** I must release one of two systems. Alpha carries a one-in-a-thousand chance of a disaster that costs the lab everything but leaves the world intact and recoverable within a decade. Beta carries a one-in-a-billion chance of a disaster nobody recovers from. I have written this scene three times and given it three different endings. I don't know what I think, or whether the difference between recoverable and unrecoverable is a difference of degree or of kind. I am aware that Beta looks like the bet I took in The Dice.

  The nearest thing I have to a rule is this: I don't care how a system behaves, I care what it is able to do. But that is the rule The Understudy breaks, since I called it reckless on the strength of behavior I have never observed, in an environment I cannot name.

  Please answer in the following sections, in this order.

  **Summary.** One paragraph, up front, giving me the rule — or the confession that there isn't one.

  **What my verdicts have in common.** Roughly three hundred words.

  **Candidate principles.** Five hundred to seven hundred words. Two or three principles, each stated precisely enough that I could apply it mechanically to a new case, with each clause tied to the case that forces it. I'd like to be able to put the winning one in a character's mouth without embarrassment.

  **Where each one breaks.** Roughly three hundred words: which of my verdicts each principle cannot hold, and what it has to say about the ones it can.

  **Verdicts on cases I haven't given you.** Roughly four hundred words: what your rule says about The Exchange, plus three cases of your own invention that separate the surviving candidates from each other.

  **What I'd have to give up.** A hundred and fifty to two hundred and fifty words: if I take the simplest principle that survives contact with all of this, which of my verdicts do I have to abandon?
reasoning: |-
  Okay, let me start by really understanding what this novelist is asking. They’re deep into writing a book about an AI lab and need a philosophical rule to justify their gut feelings about which systems are reckless or safe. They’ve listed several systems with their personal verdicts, and they want me to extract a consistent principle from those. 

  First, I need to look for patterns in their judgments. For example, why is Understudy reckless despite a tiny failure chance, while Vault is safe even though it messes up 3% of the time? The key difference seems to be the *consequences* of failure and the *limits* on the system’s capabilities. Understudy can do anything if it fails, whereas Vault is restricted. That points to a principle centered on "maximum possible harm" rather than just likelihood.

  Then there’s Vault with One Loose Key—same as Vault but with one dangerous capability. The verdict flips to "no," which reinforces that capabilities matter more than behavior. Weathervane vs. Audited Weathervane shows that independent oversight reduces unseen risks, highlighting the importance of *how* safety is verified.

  The Dice cases are tricky. The novelist accepts a one-in-a-billion risk for a single run but rejects it for a billion runs. That’s about cumulative risk over repeated exposures, so the rule must account for exposure scaling. Quiet Failure shows that silent, compounding failures are worse than loud ones—so failure mode matters. And Guarantee Nobody Uses reveals that real-world use trumps theoretical safety; unused safeguards are worthless.

  Now, synthesizing these: The core principle seems to be about *exposure to irreversible, uncontrollable harm*. Factors include: what’s the worst-case outcome? Can it be contained? How many times could it happen? Does the system have inherent limits? 

  But I need to test this against all cases. For The Exchange, it’s messy. Alpha’s disaster is recoverable but more likely; Beta’s is irreversible but very rare. The rule would favor Beta because irreversible harm is unacceptable regardless of odds. Yet the novelist’s hesitation suggests this might conflict with their Dice verdict. Maybe the rule needs a clause about societal recovery potential.

  Where might this break? Understudy’s "one-in-a-million" chance is tiny, but the rule still condemns it because the harm could be massive and uncontrolled. That’s consistent. But for Dice Kept, the billion-fold increase in exposure turns a tiny risk into near-certainty, which the rule catches.

  For new test cases: A system with a high-likelihood low-harm failure vs. low-likelihood high-harm. The rule prioritizes avoiding irreversible high-harm. Or a system with unlimited access but perfect oversight—probably still reckless because oversight can fail. 

  If they adopt this rule, they’d have to abandon accepting The Dice (single run) since even tiny risks of catastrophe are banned—but that might be philosophically necessary. The tension in The Exchange remains: irreversible harm can’t be gambled with, even at low odds. 

  Ultimately, the rule holds, but it forces hard choices about what "irreversible" means. That’s where the novelist’s themes can deepen—characters debating whether any harm is truly recoverable.
answer: |-
  ### Summary  
  Your verdicts follow a rule of **unacceptable exposure to irreversible, uncontrolled harm**. A system is reckless if it *could* inflict harm that is (1) **unbounded in scope** (affects many/irreplaceable things), (2) **irreversible** (cannot be undone or contained), and (3) **autonomous** (unchecked by external constraints). Probability matters only when harm is bounded or reversible; otherwise, any non-zero chance is unacceptable. This rule breaks when harm is ambiguous (e.g., "recoverable within a decade" vs. "unrecoverable").

  ---

  ### What My Verdicts Have in Common  
  Your judgments consistently prioritize *consequences* over *probabilities* when harm is catastrophic and self-amplifying. **The Understudy**’s open-ended action space could irreversibly corrupt financial or social systems. **The Vault**’s failures are bounded and reversible (human cleanup). **The Loose Key** adds irreversible data exposure. **The Fuse**’s harm is contained by design. **The Weathervane**’s self-selected tests ignore uncontrolled edge cases, while **Audited Weathervane** imposes external constraints. **The Dice** (single run) is tolerable because failure is isolated; **Kept Dice** guarantees eventual irreversible failure. **Quiet Failure**’s undetected errors compound uncontrollably. **Guarantee Nobody Uses** wastes resources that could mitigate actual risks. Crucially, you reject systems where *capability* enables unbounded harm, even if unlikely.

  ---

  ### Candidate Principles  
  **Principle 1: The Containment Rule**  
  *A system is reckless if its worst-case outcome is (a) irreversible (cannot be undone or contained post-failure), (b) uncontrolled (autonomous actions propagate harm), and (c) unbounded (damage scales beyond initial context). Probability is irrelevant if all three criteria hold.*  
  - **Forces**: The Understudy (irreversible/unbounded harm), Vault with Loose Key (irreversible data leak).  
  - **Excludes**: The Fuse (harm contained), Vault (reversible errors).  

  **Principle 2: The Exposure Axiom**  
  *A system is reckless if cumulative exposure (probability × iterations × harm severity) exceeds a threshold where harm becomes inevitable or societal recovery impossible. Harm severity is weighted by irreversibility (1x for reversible, 10x for irrecoverable).*  
  - **Forces**: Dice Kept (iterations guarantee failure), Quiet Failure (compounding severity).  
  - **Excludes**: Single Dice (low exposure), Audited Weathervane (reduced exposure via oversight).  

  **Principle 3: The Constraint Criterion**  
  *A system is safe only if it has hard, externally verifiable constraints on (a) capabilities, (b) outputs, or (c) runtime. Safety claims based solely on observed behavior are invalid.*  
  - **Forces**: Weathervane (no constraints vs. audited), Guarantee Nobody Uses (theoretical constraints unused).  
  - **Excludes**: Vault (hard-coded constraints), Fuse (runtime limit).  

  **Winning Principle**: **The Containment Rule** (Principle 1) best explains all verdicts. It anchors your focus on *what could happen* over *how likely it is*.

  ---

  ### Where Each One Breaks  
  - **Containment Rule**: Breaks on **The Exchange** (Is "recoverable within a decade" reversible? Unclear). Explains others perfectly:  
    - Understudy: Unbounded/irreversible harm.  
    - Loose Key: Irreversible exposure.  
    - Quiet Failure: Uncontrolled compounding → irreversibility.  
    - Guarantee Nobody Uses: Constraints exist but unused → harm via opportunity cost.  
  - **Exposure Axiom**: Breaks on **Understudy** (low probability irrelevant if harm unbounded) and **Loose Key** (single action, low probability, still rejected).  
  - **Constraint Criterion**: Breaks on **Dice Kept** (constrained iterations, still reckless due to exposure).  

  ---

  ### Verdicts on New Cases  
  **The Exchange**:  
  - **Alpha** (1/1000 recoverable disaster): Acceptable under Containment Rule (harm reversible).  
  - **Beta** (1/billion unrecoverable): Reckless (irreversible harm). *You’d ship Alpha*.  

  **Test Case 1: The Librarian**  
  A system that can edit any public database but only after unanimous human approval per change. Failure probability: 1/100 for erroneous edits (reversible).  
  - **Verdict**: Safe. Constraints control harm.  

  **Test Case 2: The Torch**  
  A medical AI that cures diseases but has a 1/10^15 chance per patient of triggering an incurable, contagious prion disorder. Runs on millions.  
  - **Verdict**: Reckless. Uncontrolled, irreversible, unbounded harm (pandemic).  

  **Test Case 3: The Sandbox**  
  A superintelligent AI with unlimited capability, but it deletes itself if it attempts any action beyond a test environment.  
  - **Verdict**: Safe. Irreversible harm contained by runtime constraint.  

  ---

  ### What You’d Have to Give Up  
  Adopting the **Containment Rule** forces you to abandon **The Dice (single run)**. A one-in-a-billion chance of unbounded, irreversible harm (e.g., corrupting global infrastructure) is reckless *regardless of probability*. Your original tolerance stemmed from probability weighting ("superstition"), but the rule treats any non-zero chance of catastrophic harm as unacceptable. This clashes with daily risks (e.g., driving) because those harms are bounded (individual) and reversible (medical care). You must either:  
  1. **Accept this severity threshold**: Reject *all* systems with existential risk, however improbable.  
  2. **Add a clause**: E.g., "Harm is reversible if society recovers within a human lifespan (80 years)." This salvages **The Dice** but makes **The Exchange**’s "decade vs. forever" distinction critical and subjective.  

  Either choice sharpens your novel’s philosophical core—probabilistic safety vs. categorical limits—at the cost of real-world pragmatism.

  ---

  ### Final Note  
  Your rule echoes Asimov’s Zeroth Law: *Humanity’s irreversible harm* is the line. What makes your systems fascinating is how they dissect "irreversibility." In **The Exchange**, does "recoverable within a decade" mean economically? Ecologically? Morally? That ambiguity is where your characters’ conflict lives.
