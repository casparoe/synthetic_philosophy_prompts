prompt: |-
  Ok so I'm trying to get clear on the aggregation problem before I commit to any view, and I've decided what I actually need first is a spec, not another argument for one side. So here's what I want. Suppose someone wanted to give a full theory of when it's ok to let the numbers count in a moral decision and when it isn't, basically the adding-up move that Scanlon's contractualism tells us we're not allowed to make. What I want from you is the list of things any such theory has to get right. Not the theory itself, the requirements.

  For each item I want the case or consideration that forces it. The classic one-person-drowning-versus-five is obviously one, but I don't just want that. I want the requirements that come from: the fact that a single person can have a claim so strong it beats a bunch of weaker ones; the fact that we seem to care about numbers at all and that caring doesn't look like an obvious mistake; cases where the harms differ in kind and can't be lined up on a single scale; cases where one person will suffer a great deal versus many people each suffering a little; cases where the same person is affected repeatedly over time, which seems different from affecting many people once, and honestly this is the one that confuses me most, because I have a hunch a decent theory has to say something about whether time-slices of one life can be aggregated the way separate lives can, or why they can't; and the requirement that the theory not just quietly collapse into do-the-most-good when nobody's looking.

  Then tell me which of these requirements you think are real and which are just prejudices of one camp, like is never-aggregate itself a substantive moral claim or more of a methodological rule. And flag any pair you think can't both be satisfied, because if there's a genuine conflict buried in there then that's kind of the whole point and I'd rather know now than after I've picked a side.

  If you can, also tell me which single requirement does the most damage, i.e. which one rules out the most otherwise attractive theories.

  One thing about format: please write it as continuous prose, no headings, no bullet points, no bold, no tables, just paragraphs like you'd write in an email. Lists make me skim and I want to actually read the reasoning behind each requirement.
reasoning: |-
  Okay, the user is diving deep into moral philosophy, specifically the aggregation problem. They want a clear specification of what any theory about when numbers count must satisfy, without being swayed by arguments for one side. I need to provide a comprehensive list of requirements that such a theory must meet, each grounded in specific cases or considerations. They mentioned several key scenarios: strong individual claims outweighing many weaker ones, the intuition that numbers sometimes matter, differing harm types that resist a single scale, one person suffering greatly versus many suffering minor harms, and the tricky issue of time-slices within a single life versus separate lives. They also want to ensure the theory doesn't covertly collapse into utilitarianism.

  I should start by recalling the core dilemma: aggregation allows adding up smaller harms to outweigh a larger one, which Scanlon rejects. The user isn't asking for theories but for the criteria those theories must address. Each requirement needs a concrete example to illustrate it. For instance, the drowning child case shows why aggregation might be necessary, while a case like torture vs headaches highlights its limits. The time-slice issue is particularly complex—comparing repeated minor harms over time versus one-off harms to many people. 

  The user also wants me to flag which requirements might be mere biases versus substantive claims. For example, is Scanlon's non-aggregation stance a foundational principle or a methodological choice? I should note conflicts between requirements, like how accommodating numbers in some cases might force aggregation in others, leading to utilitarian slippage. 

  Prioritizing which requirement is most challenging: probably the "no covert utilitarianism" because many theories that try to balance aggregation with individual claims end up mirroring maximizing outcomes. Also, the time-slice problem is thorny—treating a person's repeated sufferings as aggregable could imply that separate persons' sufferings are too, which non-aggregationists resist. 

  I'll structure the response as continuous prose, avoiding lists. Start with foundational cases, move through each requirement with examples, discuss conflicts, and end with which requirement is most damaging. Ensure clarity and depth, matching the user's thoughtful approach.
answer: |-
  Alright, let's map the terrain. You're right to want the spec first – the constraints any plausible theory of aggregation must grapple with before endorsing or rejecting it. The core tension is this: sometimes letting the numbers count seems morally imperative (saving five lives vs. one), sometimes morally grotesque (inflicting horrific torture to prevent many minor headaches), and sometimes deeply puzzling (repeated minor harms to one vs. scattered minor harms to many). Any theory needs to navigate this minefield, and these are the pressure points it *must* address:

  The foundational requirement comes from the basic intuition that numbers *can* matter decisively in some cases. The drowning child scenario, or Taurek's lifeboat, forces this. If you have a limited resource (one life-saving intervention) and must choose between saving one person or five, a theory that *never* allows aggregation seems monstrously indifferent to the extra four lives lost. It violates a deep-seated conviction that saving more lives is better, all else being equal. Any theory must explain *why* aggregation is permissible here, or if it rejects it, provide a compelling justification for the counter-intuitive result that saving one is no worse than saving five.

  However, the opposite extreme is equally untenable, leading to the second requirement: the theory must robustly respect individual claims of *sufficient strength*, preventing them from being overridden by any number of *sufficiently weaker* claims. This is starkly illustrated by the torture vs. headaches case. Imagine having to choose between inflicting severe, prolonged torture on one innocent person or allowing a very large number of other people to each experience a minor, fleeting headache. Pure aggregation (utilitarianism) might permit or even demand the torture. But this feels morally abhorrent. The tortured individual’s claim against such intense suffering seems inviolable; it cannot be "outweighed" by the sheer number of trivial inconveniences. The theory must account for this threshold effect or incommensurability.

  This leads naturally to the third requirement: the theory must handle *heterogeneous harms* that resist easy comparison on a single cardinal scale. Aggregation becomes deeply problematic when the harms involved are qualitatively different. Is preventing one death equivalent to curing a million headaches? Is saving a life worth causing widespread moderate economic hardship? A theory cannot simply assume all harms and benefits are fungible units on a single "utility" scale. It needs a way to address the *kind* of harm and the nature of the claims individuals hold, recognizing that some types of suffering create claims that are categorically distinct or non-additive with others.

  The fourth requirement tackles distribution: the theory must differentiate between aggregating many *small* harms versus imposing one *large* harm. This is distinct from the torture/headache case, focusing instead on the *distribution* of harm even when the *total* "disutility" might be comparable. Consider choosing between imposing a severe, life-altering injury on one person, or imposing a very minor, barely noticeable inconvenience (like a momentary itch) on a vast multitude. Even if the sum of the minor harms numerically exceeded the single severe harm, many find it intuitively worse to inflict the catastrophic harm on the one. The theory must explain whether and why concentrating harm matters, or why it doesn't, beyond the simple sum.

  The fifth, and perhaps most conceptually challenging requirement, concerns the *unit of moral concern* over time: the theory must provide a principled account of whether and how harms or benefits to the *same person* at *different times* can be aggregated, and how this relates to aggregation across distinct persons. This is your time-slice puzzle. Is enduring ten minor headaches over a week, each causing a brief discomfort, morally equivalent to ten different people each suffering one minor headache? Or is it significantly *less* bad because the suffering is distributed *within* one life? Conversely, is preventing a single person from suffering ten separate, unrelated broken legs over a lifetime less important than preventing ten different people from each suffering one broken leg? A theory that allows aggregation across persons but not within a single life (over time) needs to justify why temporal separation within a biography is fundamentally different from spatial/identity separation across biographies. Conversely, a theory that aggregates freely within a life needs to explain why the unity of the person doesn't create a stronger claim against the *accumulation* of harms. This requirement forces clarity on the moral significance of personal identity and temporal boundaries.

  Finally, the sixth requirement is meta-theoretical: the theory must not *covertly collapse* into straightforward consequentialist maximization ("do-the-most-good") under plausible interpretations or in non-extreme cases. This is the "no cheating" rule. Many attempts to restrict aggregation (e.g., by introducing thresholds, agent-centered prerogatives, or non-aggregative pairwise comparisons) risk smuggling in aggregation through the backdoor when the numbers get large enough or the harms get close enough on the spectrum. A theory must demonstrate that its restrictions are robust and principled, genuinely preserving the core insight that individual claims have weight that isn't *always* additive, even when doing so leads to suboptimal outcomes by consequentialist lights. If, in practice, it always aggregates whenever the stakes are high and harms are similar, it hasn't truly escaped utilitarianism.

  **Assessing the Requirements:**

  *   **Real vs. Prejudice?** The requirement to explain the permissibility of aggregation in the drowning case reflects a near-universal moral intuition; dismissing it entirely risks profound moral counter-intuitiveness. Scanlon's non-aggregation *is* a substantive moral claim (prioritizing justifiability to each over maximizing outcomes), not merely methodological. However, insisting that aggregation *must always* be allowed, or that claims *can never* create thresholds strong enough to resist any number of weaker claims, leans more towards a prejudice of strict consequentialism. The requirement to handle heterogeneous harms and differing distributions seems real and grounded in the complexity of moral experience.
  *   **Conflicts:** Genuine conflicts are inherent. The most profound is between **accommodating numbers (Req 1)** and **respecting strong individual claims/avoiding horrific trade-offs (Req 2 & 4)**. Theories often sacrifice one to satisfy the other. Similarly, satisfying **Req 1 (numbers matter)** while avoiding **Req 6 (covert collapse)** is extremely difficult. If you allow aggregation in the drowning case (similar harms, lives at stake), what principle prevents it from applying to cases with slightly less severe harms, or slightly different harms, eventually justifying the torture case under large numbers? Drawing a non-arbitrary line is the core challenge. Furthermore, the **time-slice problem (Req 5)** creates internal tension: a solution that seems plausible for aggregation across persons might yield counter-intuitive results when applied within a life, or vice-versa.
  *   **The Most Damaging Requirement:** **Requirement 6 (No Covert Collapse)** is arguably the most damaging to otherwise attractive non-utilitarian theories. Many sophisticated attempts to allow *some* aggregation while respecting thresholds (e.g., "moderate" forms of prioritarianism, sufficientarianism with aggregation above the threshold, or complex contractualist frameworks) struggle mightily here. When pushed with large numbers or finely grained continua of harm severity, they often either yield results indistinguishable from utilitarianism (violating Req 2 & 4) or resort to seemingly ad hoc limitations to block those results (undermining their own principles). This requirement exposes the deep difficulty of finding stable middle ground. **Requirement 5 (Time-Slices)** is also profoundly damaging, as it forces the theory to confront foundational questions about personal identity and the moral significance of time that many theories simply assume an answer to, often inconsistently.

  The aggregation problem isn't solved by finding a neat formula; it's about navigating a web of powerful, sometimes conflicting, moral pressures. A successful theory must provide coherent, non-arbitrary answers across this entire landscape, resisting the gravitational pull of both absolute non-aggregation and pure maximization. The devil, as always, is in the details of *how* it satisfies these requirements simultaneously, or justifies why satisfying one necessitates violating another. Good luck wrestling with it.
