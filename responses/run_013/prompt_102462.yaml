answer: |-
  Here’s a structured 75-minute plan focused on making Molyneux’s problem land as a **live philosophical puzzle**, not a historical footnote. The key is building the conceptual scaffolding *before* stating the question itself.

  ---

  ### **Dependency Chain & Sequence (45 mins)**
  **Why this order?** You must first establish *what’s at stake* (sensory isolation) before students can see why "recognize" is ambiguous and non-trivial.

  1.  **Groundwork: Sensory Modalities as Distinct "Languages" (15 mins)**
      *   **Activity:** Contrast *haptic* vs. *visual* experiences of the *same property*.  
          *Example:* Hand students a **cold, smooth, heavy glass paperweight** (or describe vividly).  
          *Ask:* "Describe its properties *to someone who has never touched anything*."  
          *Goal:* Show that touch gives "cold," "smooth under pressure," "inertial resistance"; vision gives "shiny," "reflective," "greenish." The *same object* yields non-identical data streams.  
      *   **Crucial Point:** Emphasize that we *learn* to correlate these streams (e.g., "this shiny green visual array = cold smooth touch"). This correlation isn't given; it's acquired.

  2.  **Introduce the Gap: "Recognition" vs. "Discrimination" (15 mins)**
      *   **Activity:** Pose a *new* scenario:  
          *"Imagine someone who has never seen light/darkness, only felt textures. You teach them by touch to perfectly distinguish sandpaper (rough) from polished marble (smooth). Then they gain sight. You show them a chessboard (sharp black/white contrast). Without touching it, do they recognize it as 'smooth' or 'rough'?"*  
      *   **Discussion:**  
          *   Could they *discriminate* the chessboard squares visually? (Probably yes).  
          *   Would they *recognize* the visual experience as corresponding to "smooth" or "rough"? (Highly doubtful).  
      *   **Load-Bearing Insight:** Distinguish *discrimination* (noticing difference) from *recognition* (assigning a cross-modal identity). This reveals the conceptual leap required.

  3.  **State Molyneux’s Problem (as Locke endorsed it) (5 mins)**  
      *Now* introduce the classic formulation, but with your **new object**:  
      *"A person born blind, who learned by touch to distinguish a **small square pyramid** (e.g., a tiny stone obelisk) from a **triangular wedge** (e.g., a doorstop shape), gains sight. These objects are made of identical, featureless grey material. Presented visually with the pyramid and wedge side-by-side: Could they, by sight alone, reliably pick out which is the pyramid and which is the wedge, before touching them?"*  
      *Emphasize:* "Recognize" here means *visually identify which object corresponds to the tactile pyramid/wedge they know*.

  4.  **Locke's Answer & Why It's Not Obvious (10 mins)**  
      *   State Locke's "No" and his reasoning: Lack of experience connecting sight-touch.  
      *   *Challenge the class:* "Why might someone *intuitively* say 'Yes'?" Draw out the **"Shape is Shape" Reductionist Intuition**: "A cube *looks* square and *feels* square – squareness is the same property!"  
      *   *Counter:* Refer back to Step 1 & 2. Is "squareness" a *single* experience, or is visual squareness (angles, parallel lines, light/shadow) fundamentally *different data* than tactile squareness (parallel edges meeting at right angles under your fingers)? The *concept* "square" might bridge them, but is that concept present *before* cross-modal experience?

  ---

  ### **The Example: Pyramid & Wedge**
  *   **Why it works:**  
      *   **Novelty:** Avoids cube/sphere fatigue.  
      *   **Geometric Clarity:** Pyramid has a distinct base and converging sides; wedge has a distinct slope and edge. Tactilely distinct, visually distinct.  
      *   **Avoids Cheating:**  
          *   *No Texture/Color:* Specify "identical, smooth, featureless grey material."  
          *   *No Symmetry Issues:* Unlike sphere/cube, neither is radically symmetrical. Discrimination is possible both modally.  
          *   *Distinct Features:* The pyramid's apex vs. the wedge's linear slope force attention to *specific spatial relations* (angles, convergence) accessible to both senses, *but perhaps not immediately relatable*.  
  *   **Must Not Have:** Symmetry (like a sphere), surface details (texture, color, markings), or familiar everyday associations (avoid a "die" or "ball").

  ---

  ### **Misconceptions: Order & Anticipation (20 mins)**
  Address these *as they naturally arise* during Steps 1-4, but be ready to explicitly tackle them here if needed:

  1.  **"It's just about blind people / cataract surgery!"**  
      *   **When:** Likely arises when stating the problem.  
      *   **Head off:** Immediately when introducing the problem. *Say:* "This is *not* an empirical prediction. It's a thought experiment about the relationship between sensory experiences and concepts. Actual blind people gaining sight face overwhelming challenges; this isolates *one specific conceptual question*."
  2.  **"Recognize = Name"**  
      *   **When:** Likely in Step 2 or 3.  
      *   **Head off:** During the "Recognition vs. Discrimination" discussion (Step 2). *Say:* "It's not about saying 'pyramid' or 'wedge'. It's about visually identifying *which object corresponds to the specific tactile experience they know as 'pyramid'*. Could they *match* the sight to the touch?"
  3.  **"Shape is Shape / Geometry is Universal"**  
      *   **When:** The main intuitive objection (Step 4).  
      *   **Head off:** Hammer Step 1 & 2. *Ask:* "Is the *visual experience* of converging lines the *same thing* as the *tactile experience* of edges meeting at a point under your fingertips? Or are they distinct experiences we *learn* refer to the same spatial property?" This is the CORE LOAD-BEARING ISSUE.
  4.  **"Molyneux & Locke Agreed"**  
      *   **When:** When stating Locke's answer.  
      *   **Head off:** Briefly clarify: "Molyneux *posed* it, *assuming* the answer was No. Locke *agreed* with the No. But they both saw it as supporting empiricism. The question itself is what matters for us."
  5.  **"It's just a proxy for innate ideas!"**  
      *   **When:** If discussion gets abstract.  
      *   **Head off:** Acknowledge the link but refocus: "While connected to that debate, the power of Molyneux's problem is that it poses a *specific, concrete challenge* about sensory experience and concept formation *regardless* of innateness. Does 'knowing' a shape by touch equip you to 'know' it by sight *without further experience*?"
  6.  **(Hidden Misconception: "Vision is Primary")**  
      *   **When:** Underlying assumptions in Step 1/2.  
      *   **Head off:** Gently challenge: "Are we assuming vision is the 'real' way to know shape? The question is symmetric! Could someone who knew shapes *only* by sight recognize them *by touch* upon first touching them?"

  ---

  ### **Closing Question to Test Understanding (5 mins)**
  > **"Could the subject *discriminate* the pyramid from the wedge visually (tell them apart as different shapes) *without* being able to *recognize* which one was the specific shape they knew by touch? What would that show?"**

  *   **Why it works:**  
      *   Tests grasp of the critical recognition/discrimination distinction.  
      *   Reveals if they see the gap between modal experience and cross-modal identity.  
      *   A "Yes" answer demonstrates understanding of the problem's depth (Locke/Molyneux thought discrimination *was* possible, but recognition wasn't).  
      *   A thoughtful "No" could show understanding that discrimination might *require* some conceptual grounding.

  ---

  ### **What to Explicitly Skip (State at Start & End)**
  *   **"We are skipping the history of cataract cases (Cheselden, etc.) – they don't settle the *conceptual* question, only its empirical complexity."**  
  *   **"We are skipping Berkeley's idealist answer and later vision science (e.g., Held et al.) – we're focusing purely on Locke's framing."**  
  *   **"We are *not* debating innate ideas vs. empiricism broadly – we're using Molyneux as a lens into how sensory experience relates to concepts."**

  ---

  **Why this plan works:** It forces students to confront the *gap* between sensory modalities before they see the question. The pyramid/wedge provides novelty while preserving geometric essence. Addressing "Shape is Shape" head-on as the main intuitive hurdle makes Locke's "No" non-trivial. Ending with the discrimination/recognition question reveals if they grasped the core issue. Skipping the tangents keeps focus on the philosophical puzzle.
