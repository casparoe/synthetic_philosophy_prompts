prompt: |-
  Ok so I'm running a 75-minute session next month on Molyneux's problem for a room of second- and third-years. They've read the bit of the Essay where Molyneux puts the question to Locke, plus Locke's reply, and that's it -- no Berkeley, no vision science, no history of the cataract cases. Don't explain the problem to me, I know it. What I want is a plan for teaching it.

  Specifically: what order do the pieces have to go in so it lands as a real question and not a trivia item? I keep feeling that if I open with "would he recognise the cube" the whole thing collapses into yes/no and we're done in five minutes. What has to be in place before they can even hear what's being asked? I suspect it's something about what's given in experience versus what's built up, but I'm not sure that's the load-bearing piece, or whether it's really the distinction between recognising the shape and the shape looking a certain way, or something about concept possession instead. You tell me the dependency chain and why it has to go in that order.

  Then pick the example that carries it. Not the cube and the sphere if you can avoid it -- I've done that one to death and they've all seen it -- so something that does the same work without being the textbook case. And tell me what the example has to have and what it must not have; I'm worried that anything with too much texture or colour lets them cheat by using those cues.

  Then the misconceptions, in the order they'll actually surface, and the exact point in the sequence where I should head each one off. Ones I'm expecting: that this is an empirical question about blind people; that the old cataract-surgery story settles it one way or the other; that "recognise" means "be able to name"; that Molyneux and Locke were asking the same question; that it's really just a proxy fight about innate ideas. I bet there are two or three I'm not seeing.

  And one question I can ask at the end that would tell me whether they've actually got the question rather than memorised the answer. Plus tell me what to deliberately skip at this level and say out loud that I'm skipping it. No readings please, this has to be self-contained.
