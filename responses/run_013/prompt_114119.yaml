prompt: |-
  I am a graduate student in a cognitive science reading group that has spent the term arguing about the free energy principle, and I would like to commission the joint statement that our two factions should have produced as an adversarial collaboration. The first faction, the free-energy realists, holds that the free energy principle (FEP) is a substantive, unifying law of self-organising systems: any system that maintains its integrity against dispersion must, under a suitable description, minimise variational free energy, and this fact explains why brains approximate Bayesian inference. The second faction, the free-energy deflationists, holds that the FEP is either a mathematical truism dressed in thermodynamic language or an unfalsifiable modelling framework, and that its apparent explanatory power comes from the fact that almost any persistent system can be described as if it minimised a free-energy functional. Both sides accept that active inference is a useful engineering paradigm; they disagree about whether the FEP earns the title of a theory of the brain. A colleague has also proposed a distinction I would like the statement to register: between blanket-relative formulations, on which the FEP is always indexed to a chosen Markov blanket and therefore cannot be stated without already fixing the system's boundaries, and blanket-free formulations, on which the principle is supposed to apply to any system whatsoever, with the blanket derived rather than assumed.

  Please draft the document they could both sign. It should open with a numbered list of claims both sides accept -- about the formalism (variational free energy, expected free energy, Markov blankets), about what the principle does and does not entail, about the status of the dark-room problem, and about the relation between the FEP and Bayesian brain hypotheses. Then provide a disagreements table with two columns, one for each camp, where each row states a precise disagreement in wording that the camp in question would accept as fair to its own view. I am especially interested in three cruxes. First, whether the FEP is a constitutive principle (any persisting system must be describable as minimising free energy) or a regulative one (it is a normative constraint on modelling, not a description of mechanism). Second, whether the Markov blanket apparatus is doing explanatory work or merely redescribing the boundaries of a system. Third, whether the FEP makes any prediction that a well-confirmed alternative -- say, a predictive-coding model with a fixed generative model and no explicit free-energy objective -- does not also make. For each crux, identify a concrete test, thought experiment, or empirical case that both sides agree would bear on it, record in advance what each side predicts, and say what each side would count as evidence against its own view. Finally, say whether any part of the dispute is merely verbal, and if so, propose a stipulation that would dissolve it without begging the question. Please do not give me a reading list or citations; I want the argument and the formulations.
reasoning: |-
  We are drafting a joint statement for two factions in a cognitive science reading group: the free-energy realists (Realists) and the free-energy deflationists (Deflationists). The statement should include:

  1. A numbered list of claims both sides accept.
  2. A disagreements table with two columns (one for each camp) and rows for precise disagreements.
  3. Three cruxes (with concrete tests, predictions, and what would count as evidence against each view).
  4. An assessment of whether any part of the dispute is verbal and a proposed stipulation to dissolve it.

  The factions agree that active inference is a useful engineering paradigm but disagree on whether the FEP is a substantive theory of the brain.

  We note the distinction between blanket-relative and blanket-free formulations.

  Let's structure the document:

  I. Agreed Upon Claims (numbered list)

  II. Disagreements Table

  III. Cruxes (with tests, predictions, and falsifiability conditions)

  IV. Verbal Dispute Assessment

  ---

  I. Agreed Upon Claims:

  We, the undersigned, agree on the following points:

  1. **Formalism**: The mathematical formalism of the FEP, including variational free energy (VFE) and expected free energy (EFE), is well-defined and provides a framework for modeling systems under uncertainty. Markov blankets are a mathematical concept that partitions a system into internal, external, and blanket states, enabling conditional independence.

  2. **Scope of the FEP**: The FEP, as a mathematical framework, can be applied to any system that can be described as maintaining a non-equilibrium steady state by restricting itself to a limited number of states (i.e., it possesses a Markov blanket). However, this does not necessarily imply that every such system must be described this way, nor that the FEP is the only valid description.

  3. **Relation to Bayesian Brain Hypotheses**: The FEP provides a formal basis for understanding how biological systems (like brains) might approximate Bayesian inference. In particular, it shows how minimizing VFE can lead to Bayesian updating and how minimizing EFE can account for active inference (action and perception).

  4. **Active Inference as Engineering**: Active inference, as a process theory derived from the FEP, is a useful paradigm for designing artificial agents and modeling cognitive processes, regardless of the ontological status of the FEP.

  5. **The Dark Room Problem**: The dark room problem (where an agent minimizing expected free energy would seek a dark, quiet room to minimize surprise) is a valid challenge to naive applications of the FEP. Both sides agree that this problem can be addressed by refining the generative model (e.g., incorporating intrinsic motivation or goals) and does not, by itself, falsify the FEP.

  6. **Falsifiability of Specific Models**: While specific models built using the FEP framework (e.g., a particular active inference model of a cognitive task) are falsifiable, the status of the FEP as a general principle is subject to debate.

  7. **Blanket-Relative vs. Blanket-Free**: The FEP can be formulated in two ways:
     - **Blanket-relative**: The FEP is always applied relative to a chosen Markov blanket. The blanket defines the boundaries of the system, and the principle is about the dynamics of the system given that boundary.
     - **Blanket-free**: The FEP is a universal principle that applies to any system that maintains its existence over time, and the Markov blanket is derived from the system's dynamics (rather than assumed). Both sides agree that the blanket-relative formulation is uncontroversial and widely applicable, but they disagree on the validity and significance of the blanket-free formulation.

  ---

  II. Disagreements Table:

  We disagree on the following points:

  | Realist Position                                                                                                | Deflationist Position                                                                                                |
  |-----------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|
  | The FEP is a substantive, unifying law of nature for self-organising systems: any system that maintains its existence must, under a suitable description, minimise variational free energy. | The FEP is a mathematical truism: it is a restatement of the fact that any system that persists must avoid phase transitions that destroy its structure, and this can be described as minimising free energy. |
  | The FEP explains why brains approximate Bayesian inference: the minimization of free energy is the fundamental mechanism by which brains (and other adaptive systems) operate. | The FEP does not explain why brains approximate Bayesian inference; it merely provides a framework for modeling them as if they did. The real explanation lies in the specific neural mechanisms and evolutionary history. |
  | The Markov blanket is not just a descriptive tool but plays an explanatory role: it is a fundamental feature of any self-organising system that the blanket arises naturally and constrains the system's dynamics. | The Markov blanket is a useful modeling choice that helps define the system boundaries, but it does not add explanatory power beyond what is already present in the system's causal structure. It is a redescription, not an explanation. |
  | The FEP earns the title of a "theory of the brain" because it provides a unified account of perception, action, and learning, and it makes novel predictions that are empirically testable. | The FEP is a modeling framework, not a theory of the brain. It is too flexible to be falsifiable as a general principle, and its predictions are either shared by alternative models or are not unique to the FEP. |

  ---

  III. Cruxes:

  We identify three cruxes and propose tests that would bear on them. For each crux, we state the disagreement, a concrete test or case, the predictions of each side, and what each side would count as evidence against their own view.

  **Crux 1: Constitutive vs. Regulative Principle**

  - **Disagreement**: Realists hold that the FEP is a constitutive principle: any persisting system must be describable as minimizing free energy. Deflationists hold that the FEP is a regulative principle: it is a normative constraint on modeling, not a description of mechanism.

  - **Test**: Consider a system that is known to persist (e.g., a hurricane, a crystal, or a simple autocatalytic set) and attempt to describe it under the FEP. Then, attempt to describe the same system without invoking free energy minimization, using an alternative framework (e.g., dynamical systems theory or non-equilibrium thermodynamics). The test is whether the FEP description provides new, non-trivial explanatory insights that the alternative does not.

  - **Predictions**:
    - Realists: The FEP description will reveal non-obvious aspects of the system's dynamics (e.g., that it must encode a generative model of its environment) that are not captured by the alternative description. Moreover, the FEP will apply to any persistent system without exception.
    - Deflationists: The FEP description will be possible but will not provide additional explanatory insight beyond what is already captured by the alternative framework. The FEP might even obscure the system's actual mechanisms by forcing a Bayesian interpretation.

  - **Evidence against**:
    - Realists: If a persistent system is found that cannot be described as minimizing free energy (under any reasonable Markov blanket) without violating the mathematics of the FEP, or if the FEP description fails to yield any new testable predictions for that system.
    - Deflationists: If the FEP description consistently provides unique, non-trivial predictions that are empirically confirmed and cannot be derived from the alternative framework.

  **Crux 2: The Role of the Markov Blanket**

  - **Disagreement**: Realists hold that the Markov blanket apparatus does explanatory work: it is a fundamental feature that arises naturally and constrains the system's dynamics. Deflationists hold that it is merely a redescription of the system's boundaries and adds no explanatory power.

  - **Test**: Take a well-understood physical system (e.g., a biological cell) and model it with and without the Markov blanket formalism. Then, perturb the system in a way that should affect the Markov blanket (e.g., alter the membrane of the cell) and observe whether the Markov blanket framework predicts the system's response in a way that the alternative (boundary-agnostic) model does not.

  - **Predictions**:
    - Realists: The Markov blanket framework will predict that changes to the blanket (e.g., the cell membrane) will have specific, quantifiable effects on the internal states (e.g., the cell's metabolism) that are not predicted by a model that only considers the system's internal dynamics without reference to the blanket.
    - Deflationists: Any predictions made by the Markov blanket framework can be equally well made by a model that directly represents the causal interactions at the boundary (e.g., the physical properties of the membrane and its interaction with the environment) without invoking the Markov blanket concept.

  - **Evidence against**:
    - Realists: If the Markov blanket framework fails to make any unique, testable predictions about the system's behavior under perturbation, or if it makes predictions that are falsified.
    - Deflationists: If the Markov blanket framework consistently makes novel, accurate predictions that cannot be derived from a boundary-agnostic model of the same system.

  **Crux 3: Novel Predictions of the FEP**

  - **Disagreement**: Realists hold that the FEP makes unique predictions that are not made by alternative frameworks (e.g., a predictive coding model with a fixed generative model and no explicit free-energy objective). Deflationists hold that the FEP does not make any such unique predictions.

  - **Test**: Design an experiment in a cognitive task (e.g., perceptual inference under uncertainty) where the FEP (via active inference) predicts a specific pattern of behavior or neural activity that differs from the prediction of an alternative model (e.g., a standard predictive coding model without action optimization). The alternative model should have a fixed generative model (not updated by action) and no free-energy objective for action selection.

  - **Predictions**:
    - Realists: The FEP/active inference model will predict that agents will take actions to change their sensory input in ways that minimize expected free energy (e.g., seeking informative stimuli even if they are currently surprising), leading to behaviors like curiosity or active sensing that are not predicted by the passive predictive coding model.
    - Deflationists: The same behaviors can be explained by the alternative model by adding ad hoc parameters (e.g., an intrinsic curiosity drive) without invoking the FEP. Thus, the FEP does not make a unique prediction.

  - **Evidence against**:
    - Realists: If the active inference model's predictions are not borne out in the experiment, or if the alternative model (without free-energy minimization) can explain the results without additional parameters.
    - Deflationists: If the FEP/active inference model makes a specific, quantitatively accurate prediction that is confirmed and cannot be replicated by any alternative model without explicitly incorporating the free-energy objective.

  ---

  IV. Verbal Dispute Assessment:

  We agree that part of the dispute may be verbal, centering on the meaning of terms like "law," "explanation," and "theory." Specifically:

  - The Realists use "law" to mean a unifying principle that is necessarily true of persistent systems (like a law of nature). The Deflationists use "law" in a weaker sense, as a mathematical identity that is always true but not explanatory.

  - Similarly, the Realists consider the FEP a "theory of the brain" because it provides a unifying framework, while the Deflationists reserve "theory" for falsifiable mechanistic accounts.

  **Proposed Stipulation**: To dissolve the verbal aspect, we propose:

  - We will use "FEP framework" to refer to the mathematical formalism and its applications.
  - We will avoid the term "law" and instead specify whether we mean:
    - **Necessity claim**: The FEP framework must apply to every persistent system (under a suitable description).
    - **Utility claim**: The FEP framework is a useful tool for modeling and engineering.
  - We will use "explanatory power" to mean the ability to generate novel, testable predictions that are confirmed and not made by alternative frameworks.

  By adopting this language, we can focus on substantive disagreements about necessity and explanatory power.

  ---

  Final Statement:

  We, the Free-Energy Realists and the Free-Energy Deflationists, have signed this statement to clarify our agreements and disagreements and to propose tests for resolving our disputes.

  [Signatures]

  [Date]
answer: |-
  ### Joint Statement on the Free Energy Principle: Adversarial Collaboration

  **Preamble**  
  We, the undersigned members of this reading group, agree that the free energy principle (FEP) formalizes ideas of direct relevance to cognitive science, particularly through its connection to Bayesian inference and active inference. While we endorse active inference as a productive engineering paradigm for designing adaptive systems, we disagree on whether the FEP constitutes a substantive, unifying theory of self-organizing systems or the brain. This statement clarifies our common ground, precise disagreements, and proposed empirical tests to resolve key disputes. We also register the distinction between "blanket-relative" formulations (where the FEP is indexed to a pre-specified Markov blanket) and "blanket-free" formulations (where the FEP applies universally, with blankets derived from dynamics).

  ---

  ### I. Agreed-Upon Claims  
  Both factions accept the following:  

  1. **Formal Apparatus**:  
     - Variational free energy (VFE) is a mathematical functional that bounds surprisal (negative log-evidence) under a generative model.  
     - Expected free energy (EFE) extends VFE to future states, balancing pragmatic (goal-directed) and epistemic (information-seeking) imperatives.  
     - Markov blankets define statistical boundaries that render internal and external states conditionally independent given blanket states.  

  2. **Scope and Limitations**:  
     - The FEP does not entail that systems "infer" or "represent" in a cognitive sense; it describes dynamics that can be interpreted as inference.  
     - The "dark room" problem (where agents minimize surprise by seeking predictable, unchanging states) is resolvable by incorporating dynamic, context-sensitive generative models (e.g., with preferences for exploration).  

  3. **Relation to Bayesian Brain Hypotheses**:  
     - The FEP provides a formal link between self-organization and Bayesian inference: minimizing VFE implies approximating Bayesian posterior updating.  
     - Active inference operationalizes this for perception-action cycles but does not require literal neural "beliefs."  

  4. **Status of Blanket-Relative vs. Blanket-Free Formulations**:  
     - Blanket-relative formulations are uncontroversial: given a Markov blanket, the FEP describes how internal states minimize VFE relative to blanket states.  
     - Blanket-free formulations are debated: they claim the FEP applies universally to any persisting system, with blankets emergent from dynamics.  

  5. **Utility and Falsifiability**:  
     - The FEP is a useful modeling framework for engineering (e.g., robotics) and describing biological systems.  
     - Specific FEP-based models (e.g., of a particular neural circuit) are falsifiable, but the principle’s generality is not self-evident.  

  ---

  ### II. Disagreements Table  
  Each row states a position that the respective faction endorses as fair.  

  | Free-Energy Realist Position | Free-Energy Deflationist Position |
  |------------------------------|----------------------------------|
  | The FEP is a **constitutive principle**: any system maintaining statistical boundaries against dispersion *must* minimize variational free energy under a blanket-free description. This necessity explains why brains approximate Bayesian inference. | The FEP is a **regulative principle**: it is a normative constraint for modeling systems *as if* they minimize free energy, but it does not describe a mechanism. Brains approximate Bayesian inference due to evolutionary and mechanistic factors, not FEP necessitation. |
  | Markov blankets are **explanatorily fundamental**: they arise from the dynamics of self-organization and constrain how systems resist entropy, providing a causal account of boundary formation. | Markov blankets are **descriptive conveniences**: they redescribe pre-existing system boundaries without adding explanatory power; the "work" is done by the system’s physics, not the blanket. |
  | The FEP earns the title of a **theory of the brain** because it unifies perception, action, and learning under a single law, makes novel predictions (e.g., precision-weighting in prediction errors), and is falsifiable as a general principle. | The FEP is a **modeling framework**, not a theory of the brain: it is too flexible to be falsified broadly, and its predictions (e.g., Bayesian inference) are shared by alternatives without free-energy objectives. |

  ---

  ### III. Cruxes: Tests, Predictions, and Falsifiability  

  #### **Crux 1: Constitutive vs. Regulative Principle**  
  - **Disagreement**: Is the FEP a necessary law (systems *must* minimize VFE) or a modeling heuristic (systems *can be described* as minimizing VFE)?  
  - **Test**: *Study a non-adaptive, self-organizing system* (e.g., a dissipative structure like a Bénard cell or a hurricane) using both FEP and an alternative framework (e.g., classical non-equilibrium thermodynamics). Assess whether the FEP provides unique, testable insights beyond redescription.  
    - **Realist prediction**: FEP will reveal non-trivially *why* the system persists—e.g., by showing its dynamics necessarily minimize VFE, with blanket states emerging naturally.  
    - **Deflationist prediction**: The system will be *describable* via FEP, but this adds no explanatory value; classical thermodynamics will fully account for persistence without VFE minimization.  
  - **Evidence against own view**:  
    - Realists: If no Markov blanket emerges or VFE minimization is indistinguishable from entropy minimization in classical frameworks.  
    - Deflationists: If FEP uniquely predicts stability conditions (e.g., phase transitions) that are empirically confirmed and unexplained by alternatives.  

  #### **Crux 2: Explanatory Role of Markov Blankets**  
  - **Disagreement**: Do Markov blankets explain boundary formation, or do they merely label boundaries?  
  - **Test**: *Simulate a minimal self-organizing system* (e.g., an autocatalytic chemical reaction) with perturbed interactions. Use blanket-free FEP to derive a Markov blanket from dynamics alone, and test whether it predicts how perturbations affect boundary integrity.  
    - **Realist prediction**: Blankets derived from dynamics will predict how perturbations destabilize the system (e.g., loss of conditional independence between internal/external states).  
    - **Deflationist prediction**: The blanket will correlate with system stability but will not predict outcomes better than direct analysis of physical interactions.  
  - **Evidence against own view**:  
    - Realists: If derived blankets fail to predict system behavior or align trivially with pre-specified boundaries.  
    - Deflationists: If blanket-derived predictions are empirically unique (e.g., identifying critical instability points) and irreproducible without FEP.  

  #### **Crux 3: Novel Predictions of FEP vs. Alternatives**  
  - **Disagreement**: Does the FEP make unique predictions compared to non-FEP Bayesian models (e.g., predictive coding with fixed priors)?  
  - **Test**: *Design a perceptual task* where agents must actively resolve uncertainty (e.g., foraging with ambiguous cues). Compare FEP-based active inference (which minimizes EFE via action) to a predictive-coding model with identical priors but no free-energy objective for action.  
    - **Realist prediction**: Only active inference will reproduce "epistemic foraging" (e.g., information-seeking sampling), as it minimizes EFE.  
    - **Deflationist prediction**: Similar behavior will arise in the alternative model by adding exploration bonuses or curiosity drives, without invoking EFE.  
  - **Evidence against own view**:  
    - Realists: If active inference fails to predict behavior or is outperformed by the alternative model.  
    - Deflationists: If EFE minimization uniquely predicts quantitative aspects of behavior (e.g., trial-by-trial sampling dynamics) that cannot be replicated in the alternative without free-energy constructs.  

  ---

  ### IV. Verbal Dispute Assessment  
  We agree that part of the disagreement is verbal, hinging on divergent uses of "theory," "law," and "explanation":  
  - Realists use "theory/law" for principles with *universal necessity* (e.g., FEP as constitutive).  
  - Deflationists reserve "theory" for *falsifiable mechanistic accounts* and see "law" as inapplicable to FEP.  

  **Proposed Stipulation**: To dissolve verbal ambiguity, we adopt the following terminology:  
  - **Unifying Principle**: A framework claiming necessity for persistent systems (e.g., blanket-free FEP).  
  - **Modeling Tool**: A normative framework for designing descriptions (e.g., blanket-relative FEP).  
  - **Explanatory Power**: The capacity to generate *novel, unique predictions* not made by alternatives.  

  This avoids question-begging by decoupling semantic disputes from empirical tests of necessity and prediction.  

  ---

