prompt: |-
  I've been arguing with my roomate about how much of everyday etiquette is actually morally required, and I keep landing on opposite answers depending on the case. Here's the pile I've got, with my gut calls on each. Tipping 20% at a US diner where the server's wage is set assuming tips: not leaving anything feels genuinely wrong to me, like stiffing a person who did their job, not just bad manners. But the same diner after the owner switched to a no-tipping, higher-wage model and put up a sign saying tips now go straight to the owner: suddenly I feel nothing at all about leaving zero. A friend visiting from a country with no tipping custom, eating at a normal US diner: I don't think they're obligated the way I am, even though the server is relying on the same tips from the same table. An American tourist in that friend's country leaving cash on the table: I think they shouldn't, it comes off as imposing our rule on someone who never asked for it. Jaywalking across an empty street at 2am, no cars, no cop in sight: totally fine, the light is just a suggestion. Cutting to the front of a crowded bus queue because I'm late: not fine, clearly, even though nobody's hurt in any lasting way. And blocking the walking side of an escalator in a city where walk-left is the norm, so people pile up behind me: feels like almost nothing, forgivable, especially for a visitor, even though I'm literally slowing specific people down.

  The two that won't sit together are the queue and the escalator -- both inconvenience real people right behind me, and yet I feel bound by one and not the other -- and the tipping pair pulls in the other direction, since there the convention says tip but my obligation evaporates the moment the money stops reaching the worker. My roomate says it's all just one rule, follow whatever convention the locals follow and be extra lenient with visitors, but that makes my Japan-tipping tourist either rude or fine depending on nothing, and it can't explain why the no-tipping sign changes a thing. I also want it to tell me about a weird one: my friend's building has an unspoken custom that whoever boards the elevator first presses the button for everyone and calls out floors, and guests who don't do it get side-eye. Do I have to?

  Can you figure out what principle, or small set of them, actually generates my verdicts, tell me which of my calls it forces me to give up, and predict what it says about the elevator one? Give it to me as exactly five numbered points, each a sentence or two, no intro and no summing-up at the end.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're wrestling with everyday etiquette and moral obligations, and their gut reactions vary across different scenarios. The key conflicts they mention are tipping in different contexts, jaywalking, queue-cutting, escalator blocking, and an elevator button custom. 

  First, I notice their tipping judgments hinge on whether the tip actually reaches the worker. When the server relies on tips for wages, not tipping feels morally wrong. But if the owner absorbs tips or the diner is from a non-tipping culture, the obligation vanishes. This suggests their moral concern is about fair compensation, not just following social rules.

  The queue vs escalator contrast is interesting. Both involve inconveniencing others, but they feel strongly about queue order while dismissing escalator norms. The difference might be that queues have explicit fairness stakes (first-come-first-served), while escalator blocking causes minor, diffuse delays without clear "cutting" of rights. 

  Jaywalking when empty aligns with harm reduction - no risk, no problem. But their tourist tipping example shows they dislike imposing cultural norms unilaterally, which explains why they judge the American tipping abroad harshly.

  The roommate's "follow local convention" theory fails because it can't explain why the no-tipping sign changes obligations, or why escalator blocking feels less binding than queue-cutting. It also can't handle the elevator button custom cleanly.

  For the elevator case: since it's an unspoken building-specific custom with low stakes, their principles would likely say it's polite but not obligatory, especially for visitors. The side-eye would be seen as unreasonable enforcement.

  Their core drivers appear to be: 1) preventing tangible harm/exploitation, 2) respecting explicit fairness systems, 3) avoiding cultural imposition, 4) weighting stakes of inconvenience, and 5) rejecting arbitrary norms. The escalator judgment might be the weakest link if they value minimizing all inconvenience equally, but they clearly weight queue injustice higher than momentary delays.

  I'll need to formalize this into five precise points that cover all cases, identify which gut feeling should be revised (probably the escalator), and apply it to the elevator scenario without adding fluff. The challenge is keeping it tight while capturing their nuanced distinctions.
answer: |-
  Here are five principles derived from your judgments, with their implications:

  1.  **Obligation arises when failing to act sustains unjust systems or directly exploits vulnerable individuals.** This justifies feeling obligated to tip in the standard US diner (worker reliance) and not obligated when the sign redirects to the owner (no exploitation).
  2.  **Explicit fairness structures (like queues) demand adherence to prevent direct injustice to identifiable individuals.** This explains why cutting a bus queue feels wrong (denying rightful place), while jaywalking an empty street (no inherent injustice, minimal risk) doesn't.
  3.  **Minor, diffuse inconveniences caused by violating mere coordination norms lack moral weight unless linked to exploitation or injustice.** This accounts for feeling little obligation on the escalator (inconvenience is real but minor/diffuse, not denying a specific right) versus the queue (specific injustice).
  4.  **Cultural norms are morally binding only if adhering prevents harm/exploitation (Principle 1) or upholds explicit fairness (Principle 2); otherwise, imposing one's own norms on others is wrong.** This explains why the non-US friend isn't obligated (no inherent harm/fairness breach), the US tourist tipping abroad *is* wrong (imposing norm), and why the no-tipping sign changes things (removes harm/exploitation element).
  5.  **Hyper-local, low-stakes conventions (like the elevator button) are matters of politeness, not morality; demanding adherence as obligation is unreasonable.** This principle forces you to give up feeling any *moral* obligation about the elevator custom, judging the side-eye as excessive. It highlights the lack of exploitation, injustice, or significant harm inherent in the act.

  This set forces you to give up the view that blocking the escalator has *any* significant moral weight (beyond minor politeness), as it fails Principles 1, 2, and 3 (no exploitation, no specific injustice, only minor diffuse inconvenience).
