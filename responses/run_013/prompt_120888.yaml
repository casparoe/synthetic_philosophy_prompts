prompt: |-
  I write about science and ideas for a magazine, and last year I did a long piece on a wrongful-death suit where a family argued that a chemical company had killed a man by never telling him about a risk it had sat on for years. The whole thing turned on whether you can "cause" something by not doing something, and ever since I've been keeping a note on my phone of cases where my gut says cause or no-cause, and I cant get them to add up. Here they are, verdicts included:

  - I promise my neighbour I'll water her plants while she's away, I forget, they die. Gut: I killed those plants, basically. Not the same as if I'd stomped on them, but a real cause.
  - I walk past a pond, a kid's drowning, I'm a useless swimmer, I don't go in. Gut: I didn't cause the drowning. The water did. I'm ashamed of myself, but I'm not the cause.
  - Same pond, same kid, but now it's the lifeguard on duty and she's just not watching. Gut: she caused it, full stop, no hedging.
  - A company learns its brake seals crack in the cold, doesn't recall the cars, a driver dies. Gut: the company caused the death. Obvious.
  - A hiker finds a smouldering campfire in dry grass, could stamp it out with one boot, walks on, the ridge burns. Gut: he let it burn. But did he cause the fire? I want to say no, and I can't defend that well.
  - I turn the boiler up one winter and never turn it back down; years later it blows and scalds the lodger. Gut: that's on me, clearly — even though the thing that "did" it is my not going back down to the basement.
  - My candidate loses our district by a single vote and I stayed home, so my vote really would have flipped it. Gut: I still didn't cause her to lose. Though I feel sick about it in a way that's suspiciously like the plant thing.

  My editor has taken to calling my half-formed rule the you-broke-it rule: an omission is a cause only when you'd already put yourself in the story — you'd promised, you'd taken the job, you'd sold the brakes, you'd turned the dial. That seems to get the plants, the lifeguard, the company and the boiler, and it gets the pond and the vote too, so it's seven for seven. But a friend of mine who does philosophy says the hiker obviously caused the fire, because if he'd stamped it out the ridge would still be standing — that's just what causing means — and she says my lifeguard only counts as a cause because she'd signed a contract, which makes a death turn on a piece of paperwork, which feels like the wrong place to put it. I keep going back and forth on one more case I haven't listed: I'm alone in a room with a stranger who's choking, I know how to do the Heimlich, I freeze, he dies. No promise, no job, no dial. My gut says something, and I honestly can't tell you what.

  So is there a principle that gets all of these, or close? What does it say about the hiker and the lifeguard — same or different, and why? And which of my verdicts would it make me give up? I'd rather have a rule that's honest about the cases it loses than one that saves them all by getting baroque. Oh, and my editor wants me to say that if the answer turns out to be "it depends on local norms" he'll kill the piece, so please tell me whether that's actually where this lands.
reasoning: |-
  Okay, let me start by unpacking the science writer's dilemma. They've been collecting cases where causation by omission feels intuitively different—sometimes yes, sometimes no—and their editor's "you-broke-it" rule (omission as cause only if you're already involved) works for most but clashes with philosophical pushback on the hiker case and uncertainty about the Heimlich scenario. The core tension is between moral intuition and causal logic, with stakes for their article: they need a coherent principle that doesn't rely on cultural relativism ("local norms" would kill the piece). 

  First, I need to map the cases. The plant scenario (promise broken) and lifeguard (duty ignored) feel like clear causation-by-omission because of prior commitment. The non-swimmer bystander and non-voter don’t, despite bad outcomes. The car company and boiler cases fit the "you-broke-it" mold through product responsibility and prior action. But the hiker—no prior involvement, just opportunity—stumps them; their gut says "no cause" while their philosopher friend insists opportunity equals but-for cause. The Heimlich variant (stranger, no duty) is the litmus test. 

  The writer’s struggle exposes a deeper conflict: causation isn’t binary. Legal causation (proximate cause) often requires duty, while philosophical causation (but-for) is purely counterfactual. The hiker is a battleground: if "cause" just means "but-for," then yes, the fire wouldn’t have happened if he’d acted. But intuitively, we assign blame only when there’s a duty—like the lifeguard’s contract or the neighbor’s promise. That’s why the Heimlich case wavers: no duty, but visceral guilt suggests moral weight. 

  The key insight is distinguishing causal contribution from moral/legal responsibility. But-for causation is necessary but not sufficient; we layer on duty to filter cases like the non-swimmer (no duty) vs. lifeguard (duty). This reconciles the hiker: his omission is a but-for cause (fire wouldn’t spread if he’d stomped), but without duty, he’s not *responsible*. Same for Heimlich: but-for cause exists (death preventable), but no responsibility without duty. The "you-broke-it" rule implicitly captures duty through prior actions (promise, job, product sale). 

  For the article, I’d propose: omissions cause harm if (a) the omission is a but-for cause, and (b) there was a duty to act. This gets all cases: 
  - Plants, lifeguard, company, boiler: duty + but-for cause. 
  - Pond bystander, vote, hiker, Heimlich bystander: but-for cause exists, but no duty → not responsible. 
  The writer’s gut "no" on hiker/Heimlich aligns with no duty; the philosopher’s "cause" refers only to but-for. 

  This saves all verdicts except needing to clarify that the hiker *caused* in the but-for sense but isn’t *culpable*. The piece can argue that legal/moral systems add duty to but-for logic precisely to avoid absurdities (e.g., suing every non-voter). And no—it doesn’t land on "local norms"; duty often derives from universal principles (contracts, roles, prior acts). 

  Final check: the editor’s fear of relativism is avoided. Duty frameworks exist across jurisdictions (e.g., tort law’s duty of care). The hiker’s lack of duty isn’t cultural—it’s about no pre-existing obligation. Only the Heimlich case might vary (some countries impose duty-to-rescue), but the principle holds: causation requires both elements, not mood.
answer: |-
  Here's a principle that reconciles your intuitions, handles all your cases (including the hiker and Heimlich), and avoids both "it depends on local norms" and philosophical overcomplication—while making you reconsider *one* verdict:

  **The Duty-Bound Intervention Principle:**  
  *An omission causes harm if (1) the omission is a necessary condition for the harm (the "but-for" test), **and** (2) the agent had a specific, pre-existing duty to prevent that harm—a duty arising from role, relationship, prior action, or assumption of responsibility.*

  ---

  ### How this applies to your cases:
  1. **Plants (Gut: Cause)**  
     ✓ But-for: Plants die without water.  
     ✓ **Duty:** You promised → assumed responsibility.  
     ➔ *Cause: Agrees with your gut.*

  2. **Non-Swimmer Bystander (Gut: Not Cause)**  
     ✓ But-for: Kid drowns without rescue.  
     ✗ **Duty:** No role/relationship/prior action.  
     ➔ *Not cause: Agrees with your gut.*

  3. **Lifeguard (Gut: Cause)**  
     ✓ But-for: Kid drowns without supervision.  
     ✓ **Duty:** Job = formal role-based duty.  
     ➔ *Cause: Agrees with your gut.*  
     *(Crucially: Duty comes from role, not "paperwork" – the contract just formalizes it.)*

  4. **Brake Seals (Gut: Cause)**  
     ✓ But-for: Death occurs without recall.  
     ✓ **Duty:** Company manufactured product → created risk + has legal/moral duty to warn.  
     ➔ *Cause: Agrees with gut.*

  5. **Hiker & Fire (Gut: Not Cause)**  
     ✓ But-for: Fire spreads without intervention.  
     ✗ **Duty:** No role (not a ranger), no relationship (stranger), no prior action (didn’t light fire).  
     ➔ **Not cause: Agrees with your gut** – but forces you to defend it.  
     *(Your philosopher friend confuses "but-for" with full causation. Duty is the missing filter.)*

  6. **Boiler (Gut: Cause)**  
     ✓ But-for: Blowup occurs without adjustment.  
     ✓ **Duty:** You altered the system (turned dial up) → created latent risk + duty to maintain.  
     ➔ *Cause: Agrees with gut.*

  7. **Non-Voter (Gut: Not Cause)**  
     ✓ But-for: Loss occurs without your vote.  
     ✗ **Duty:** No role (election official?), no prior action (you didn’t cause other votes).  
     ➔ *Not cause: Agrees with gut.*

  8. **Heimlich Bystander (Your Unlisted Case):**  
     ✓ But-for: Death occurs without intervention.  
     ✗ **Duty:** No role (not medic), no relationship (stranger), no prior action (didn’t cause choking).  
     ➔ **Not cause** by omission. (Your gut likely whispers "not cause" but screams "immoral" – that’s the *duty* gap.)

  ---

  ### What You'd Need to Give Up:
  - **Only the Lifeguard's "Full Stop" Hedging:** Your gut said "she caused it, full stop." But the principle shows her omission *combined with her duty* caused it. Without duty, she’s just a bystander (like the non-swimmer). Duty transforms omission into cause.  
  - **The Philosopher's Hiker Argument:** She’s wrong that "but-for = cause." We constantly omit acts that *would* prevent harm (e.g., not donating all income to famine relief) without "causing" starvation. Duty separates moral failure from causal responsibility.

  ---

  ### Why This Isn’t "Local Norms":
  - **Duty sources are objective:** Roles (lifeguard, manufacturer), promises (plants), or prior actions (boiler dial) create duties that aren’t culturally relative. Societies debate *new* duties (e.g., duty-to-rescue laws), but your cases rely on established ones.  
  - **The core principle is universal:** "But-for + duty" is how tort law, ethics, and common sense separate causation from tragic inaction. The hiker has no duty in any legal system; the lifeguard always does.  
  - **Your editor’s "You-Broke-It" rule was almost right** – but "broke it" implies *creating risk* (boiler, brakes) or *assuming responsibility* (plants, lifeguard). This refines it.

  ---

  ### Final Verdicts for Your Piece:
  | Case                  | Cause? | Why                                                                 |
  |-----------------------|--------|---------------------------------------------------------------------|
  | Plants                | Yes    | Promise created duty.                                              |
  | Non-Swimmer Bystander | No     | No duty.                                                           |
  | Lifeguard             | Yes    | Role-based duty.                                                   |
  | Brake Seals           | Yes    | Creator-of-risk duty.                                              |
  | Hiker                 | **No** | No duty (despite but-for opportunity).                             |
  | Boiler                | Yes    | Prior action created risk + duty.                                  |
  | Non-Voter             | No     | No duty.                                                           |
  | Heimlich Bystander    | No     | No duty (though morally fraught).                                  |

  **The takeaway:** Causation-by-omission isn’t mysterious. When we say an omission "caused" harm, we mean: (a) the harm wouldn’t have occurred without it, *and* (b) someone was on the hook to stop it. The hiker could have saved the ridge, but he wasn’t the fire’s keeper. The lifeguard was. That’s why we hold her responsible – not because of paperwork, but because she took the job. Your gut was right all along; it just needed the right words.
