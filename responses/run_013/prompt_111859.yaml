  For the standup ending, I need three actionable sentences that: 1) honor each viewpoint 2) reject false neutrality 3) focus on intentionality. Something like: "Our choices are the work" for Carr, "Our template is an explanatory tool" for White, and "We'll track distortion" as the takeaway.

