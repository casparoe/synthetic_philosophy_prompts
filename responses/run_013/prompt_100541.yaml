  For structure: opening with gratitude, then historical facts (using "this town" to create slight distance), followed by Jaspers' framework adapted conversationally. The "we" shifts: "we" as present-day community inheriting history (political guilt), "we" as individuals examining conscience (moral), but not "we" for the crime itself. 

  The scholarship/maintenance section is crucial—it's the town's tangible commitment. We'll frame it as "what we owe going forward," leaving the "buying our way out" tension unresolved. The closing image of the plaque as a "hard gift" honors the descendants' wish to keep history open. 

  Personal note: mentioning their ancestor ("blood in the water") adds weight without theatrics. The tone stays firm, quiet—no platitudes. We'll avoid any phrase that sounds like closure. 

  Biggest risk is the legal minefield. Words like "massacre" and "killed" are factual but charged. The town attorney might balk, but the user seems prepared for that. The descendants' chair's stance gives cover to avoid apologies. 

  Final check: Does this avoid eulogy voice? Yes—no "healed wounds" or "community bonds." Does it handle guilt distinctions? Yes, by separating the town's past act from present responsibility. And the unresolved tension? The scholarship is presented neutrally—it's an obligation, not redemption.
answer: |-
  Here’s a speech draft grounded in Jaspers’ distinctions, honoring your constraints while refusing to soften the truth. It runs about 7 minutes spoken, avoids eulogy clichés, and maintains the tension you requested:

  ---

  **(Begin calmly, looking at the descendants, then the assembly)**  
  Thank you all for being here today, especially the families who have traveled far to join us. This memorial stands for eleven men: laborers brought to Harlow Falls in 1874 to work the docks, who were killed here by a mob from this town. For generations, we called it only “the ferry business.” We buried the truth in silence. Today, we stop burying it.  

  **(Shift to factual tone)**  
  History isn’t a ledger where we only record the good. It’s the full account. In September 1874, men from Harlow Falls took boats across the river. They attacked the Chinese workers’ camp. Eleven men died. No one was punished. No one spoke of it openly for 150 years. That is what happened.  

  **(Lean into Jaspers’ distinctions – direct, unflowery)**  
  When I say “we” today, I need to be precise. My own ancestor was on one of those boats. Does that make *me* criminally guilty? No. Criminal guilt belongs only to those who committed the act. They are beyond any earthly court.  

  But do I carry *political* guilt? Yes. Because I belong to the community that produced those men. Because this town – this specific place with its laws, its norms, its silence – enabled that violence and then buried it. **We, Harlow Falls, as a community across time, bear the weight of that history.** It is ours. We inherit it with the land and the river. Political guilt isn’t about blame; it’s about responsibility for the legacy we live within.  

  **(Look down, then up – personal reflection)**  
  *Moral* guilt? That’s a private reckoning. It asks: Knowing what happened, knowing my own blood was in that water, what do *I* do? How do I live? That guilt isn’t shared; it’s carried alone, in the quiet. Everyone here must answer that for themselves.  

  And *metaphysical* guilt? The sheer, unsettling fact that we stand here in comfort, on ground stained by suffering we didn’t cause but still benefit from? That perhaps belongs to all of us alive today, anywhere. It’s the shadow of history.  

  **(Address the memorial directly)**  
  This plaque names the eleven men. It states plainly how they died. It does not forgive. It does not heal. It does not balance any scales. Its purpose is simple: **to end the silence.** To state the fact so that ignorance is no longer an excuse. So that when someone asks, “What was the ferry business?” the answer is clear.  

  **(Shift to the commitment – pragmatic, not redemptive)**  
  Ending the silence isn’t enough. The commission, with the town council’s approval, commits two things: First, a permanently funded scholarship in the names of the eleven men, supporting historical research into labor migration and exclusion. Second, a legally binding obligation for the town to maintain this memorial in perpetuity. Not as flowers on a grave, but as a **permanent line item in the town budget** – a practical acknowledgment that Harlow Falls must bear the ongoing cost of remembering what was done in its name. This is what the town owes, going forward.  

  **(Conclude with unresolved tension)**  
  Is this commitment justice? No. Justice for those men is impossible.  
  Is it atonement? I don’t know. Atonement requires a reckoning we may never fully achieve.  
  Is it enough? That’s not for me, or for this town, to decide. That question belongs especially to the families of the men we name today. It is a question we must live with.  

  This memorial isn’t a period. It’s a question mark etched in stone. It asks us, every time we see it: *What does Harlow Falls do now?* The answer isn’t carved here. It’s written in what we choose next.  

  Thank you.

  ---

  **Why this works for your minefield:**

  1.  **"We" Precision:** Explicitly separates criminal guilt (rejected for present "we"), political guilt (claimed for the community across time), moral guilt (individual), and metaphysical guilt (universal).
  2.  **No Apology, No Liability:** States facts ("killed by a mob from this town") without saying "*the town* was guilty/criminal/wrong." Focuses on *enabling*, *silence*, and *inheritance* (political guilt) – not direct liability for 1874. The attorney *may* flinch, but it passes the "admission" test.
  3.  **Honors the Descendants' Request:** No apology. Calls the memorial a "question mark," not closure. Acknowledges the question "Is it enough?" belongs *to them*, leaving it open.
  4.  **Commitment Framing:** Presents scholarship/maintenance as concrete, perpetual obligations ("what the town owes going forward," "permanent line item"). Avoids framing it as redemption ("Not as flowers on a grave"). The unresolved tension ("Is it atonement? I don't know... Is it enough?...") is central.
  5.  **Tone:** Direct, factual, quiet. Avoids eulogy sentimentality ("does not forgive... does not heal... does not balance scales"). Rejects "as-a-community" fluff.
  6.  **Personal Connection:** Acknowledges ancestor ("my own blood was in that water") without theatrics or assuming undue burden.
  7.  **The "Minefield" Navigated:** Legally safer by focusing on facts and inherited political/moral responsibility. Respects descendants' wishes. Acknowledges perpetrator descendants' presence implicitly through the guilt distinctions without attacking them.

  **Delivery Tip:** Read it slowly. Pause after the hard facts and the key lines about guilt. Let the unresolved tension hang in the air at the end. Look at the descendants during the commitment section and the final question. Good luck.
