answer: |-
  Here’s a direct, no-menu engagement with your view. I’ll defend a modified version of it but argue that it collapses for "transfer conventions" (your "ransom" category) and must be narrowed significantly. The core survives only for genuine coordination norms. I’ll rank objections from fatal to minor, flag concessions, and give a verdict.

  ---

  ### **Fatal Objection: Rigged Conventions Undermine the "Cooperation" Premise**  
  **The Problem**: Your view hinges on conventions being "the terms on which people share space." But many conventions *aren’t* neutral coordination tools—they’re tools of exploitation. Consider:  
  - A tourist town where locals "expect" inflated tips (20% on tax-inclusive prices) because they know visitors can’t discern local practice.  
  - A caste-based society where lower-caste individuals "conventionally" yield space to upper-caste members in public transport.  

  Here, compliance isn’t "free-riding on forbearance"—it’s *enforcing* an unjust status quo. The obligation dissolves because the "terms of cooperation" are rigged. **Defenders must concede this**: if the convention exists primarily to extract unearned benefits or entrench hierarchy, your principle fails. This collapses your view for *transfer conventions* (tipping in unbalanced systems) but leaves coordination norms (queuing) intact.  

  **Why it kills the broad view**: You can’t rescue this by excluding "cruel" conventions without importing independent moral judgments (e.g., fairness, equality). Once you do that, conventions aren’t doing real work—they’re just triggers for fairness reasoning.  

  ---

  ### **Serious Objection: Ignorance and Contestation Make Obligations Ephemeral**  
  **The Problem**: Visitors often can’t know the local norm (e.g., tipping 10% vs. 15% in a niche café; whether jaywalking is tolerated on *this* street). Worse, locals may disagree (e.g., Gen Z New Yorkers queue loosely, Boomers insist on rigid lines). If obligation scales with "knowability/settledness," the theory becomes:  
  - *Obligatory* only for crystal-clear, unanimous norms (rare).  
  - *Advisory* for fuzzy cases (most real-world scenarios).  

  This doesn’t kill the view but makes it trivial: "Follow clear norms when you know them" is banal. **Defenders must concede** that obligation is defeasible by reasonable ignorance or norm ambiguity, weakening its moral force.  

  ---

  ### **Awkward Objection: Harm-Based Morality Swallows the Convention’s Role**  
  **The Problem**: A harm-focused ethic (don’t cause frustration, waste time, or exploit workers) might cover all cases:  
  - Not queuing → harms others by increasing wait times.  
  - Not tipping (where wages rely on it) → harms workers.  
  - Jaywalking dangerously → risks accidents.  

  **But here’s where conventions do unique work**: Jaywalking *when safe and customary*. In Berlin, jaywalking at empty crossings is normal. A tourist who rigidly waits for the "walk" signal slows foot traffic, causing mild coordination friction. *No harm occurs*, but they violate the local efficiency norm. Harm-based morality can’t condemn this—only convention can. **Defenders win here**: your view explains why we should adapt to *efficiency customs* even without harm.  

  **The catch**: This only works for pure coordination norms (queuing, jaywalking-when-safe). For transfers (tipping), harm/fairness does all the work. Your "ransom vs. coordination" distinction is vital and saves the core.  

  ---

  ### **Verdict: Narrow, Don’t Abandon**  
  **What survives**: A **coordination-convention principle**: *When a behavioral norm solves a coordination problem (e.g., queueing, traffic flow) and is locally settled, you have a pro tanto obligation to follow it as a visitor. Ground: Avoiding free-riding on others’ cooperative restraint.*  
  - **Why it works**: It binds without consent because coordination norms are mutually beneficial and costless to join (e.g., queueing costs you nothing but benefits all).  
  - **What it covers**: Queuing, jaywalking-when-customary, standing on escalator sides.  

  **What dies**: The extension to *transfer conventions* (tipping, bribes, "expected" gifts). These require independent fairness/harm justifications. Calling them "conventions" adds nothing moral.  

  **Is it unfalsifiable?** Only if stretched. Your harm/rigged-convention exceptions aren’t dodges—they’re necessary limits. The narrowed view *is* falsifiable: show me a coordination norm that’s harmless, settled, and knowable, but where compliance is morally wrong. I can’t find one.  

  **Is it "be polite" in disguise?** No. Politeness is about respect; this is about *efficiency*. Politeness might require tipping in a fair system; your coordination principle doesn’t care about tipping at all.  

  ---

  ### **Final Tally**  
  - **Killed**: The broad view covering tipping/transfers.  
  - **Narrowed**: Survival for coordination conventions only.  
  - **Concessions**: Rigged conventions and ignorance weaken obligation; harm ethics covers most transfers.  
  - **Unique value**: Explains obligations in harmless coordination puzzles (jaywalking-custom).  

  **Your view’s best self**: A moral glue for frictionless coexistence in shared space—nothing more, nothing less. Hold that, drop the rest.
