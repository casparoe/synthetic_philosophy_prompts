  I keep going back and forth on which contradictions I think are actually true, and I want to know what principle, if any, is behind my gut here. The liar sentence ("this sentence is not true") — I really do think it's both true and false, not a sign I've messed up somewhere. A patch in the middle of a red-orange continuum — both red and not red, and I don't think that's my language being sloppy, I think the world is like that. The instant a ball stops going up and starts coming down — both moving and not moving. A statute that repeals all earlier inconsistent statutes, where it turns out to be earlier than one of the statutes it repeals — I think the law just contains both and a judge has to pick, not that one of them is secretly false. But the set of all sets that aren't members of themselves: I dont think that's a true contradiction at all, I think it just shows naive comprehension is false, full stop, reductio. And someone who sincerely says "p and not p" isn't making two facts true, they're just confused; same with a moral dilemma where I both ought to keep a promise and ought to break it — one obligation is simply overridden, the ought-facts aren't contradictory. My tentative principle is that a contradiction is true when both sides are forced on us by the subject matter itself, and a mere reductio when it follows only from a theoretical assumption we could give up. Is that any good? Test it against the cases, repair or replace it, tell me what it predicts about the truth-teller sentence ("this sentence is true"), and be honest about which of my verdicts it can't keep. Give me exactly five numbered points, a sentence or two each, no intro or outro.
