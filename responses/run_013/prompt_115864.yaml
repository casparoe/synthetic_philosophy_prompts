prompt: |-
  I am a second-year PhD student in philosophy who came into decision theory sideways, from a statistics background, and I keep running into what the people around my department call coherence arguments for expected utility maximization without ever getting a straight account of what they are supposed to establish. Last week a friend in an AI safety reading group — very sharp, but self-taught in philosophy mostly from blog posts and forum threads — gave me his summary of the whole business, and I have been chewing on it since. His line was roughly this. Expected utility theory is not a psychological theory at all, he said, but a consistency requirement on preference: the von Neumann–Morgenstern and Savage theorems show that any agent whose preferences satisfy a handful of trivial bookkeeping conditions — no cycles, no gaps, that sort of thing — can be represented as maximizing expected utility, which means the agent's beliefs and desires can simply be read off its choices without anyone ever asking it what it wants. The axioms are just canons of logic, so an agent who violates them is provably irrational; that is why the money-pump argument works, since anyone with intransitive preferences can be bled dry by a sequence of trades each one of which he prefers to the one before. Therefore expected utility maximization is the only decision rule that reason permits, full stop, and once you grant the axioms there is nothing substantive left to argue about. He added, as a kind of coda, that this is also why an incoherent agent is doomed in any competitive setting: a coherent opponent can predict it and strip it of everything it has.

  I suspect this is one of those summaries that is right in spirit and wrong in ways that matter — he has absorbed the conclusions of the literature and mislaid the load-bearing qualifications — but I do not know the material well enough to locate the seams myself. If it helps to know my inclinations: I find the representation theorems genuinely impressive and the money pump vivid, but I have a nagging suspicion that the word rationality is doing an enormous amount of work in his last two sentences, and that the phrase a handful of trivial bookkeeping conditions is hiding something. I can handle technical detail; I know what a representation theorem is and I am not frightened of notation. What I am missing are the in-house distinctions.

  So what I would like is a sentence-by-sentence audit of the summary above. For each of his claims, tell me whether a working decision theorist would accept it as stated, wince at it as a defensible simplification, or reject it outright; where he has run two distinct claims together, pull them apart and say which one is true; where he has taken a modest representational result for a normative thesis, or the reverse, say so explicitly. I would like to know both what a defender of the coherence program would say in his own defense — which of these sentences the program's own proponents would disavow as a caricature — and which of them are instead the standard objections pressed by critics rather than errors of exposition, since those two categories need different treatment. Then the part I care about most: if the summary is corrected along the lines you suggest, does the conclusion that expected utility maximization is the uniquely rational policy still follow from what remains, or does it require an extra premise that my friend never supplies? I do not need reading lists, citations, or names of papers — I would much rather have the shape of the argument and the exact joints at which it can be pulled apart.
reasoning: |-
  Okay, the user is a second-year PhD in philosophy with a stats background, grappling with decision theory. They've encountered coherence arguments for expected utility maximization but aren't clear on what they establish. A friend in an AI safety group gave a summary, and the user suspects it's oversimplified. They want a detailed audit of each claim, distinguishing what's accepted, simplified, or rejected by working decision theorists. They also want to know if, after corrections, the conclusion that expected utility is uniquely rational still holds.

  First, I need to parse the friend's claims. The friend frames expected utility as a consistency requirement, not psychology. The representation theorems (like von Neumann-Morgenstern and Savage) show that preferences satisfying certain axioms can be represented as maximizing expected utility. The axioms are "trivial bookkeeping" (no cycles, no gaps). Violating axioms makes one "provably irrational," proven by money pumps. Therefore, expected utility is the only rational decision rule. Plus, incoherent agents lose in competitive settings.

  The user's concerns: "rationality" might be doing heavy lifting, and "trivial bookkeeping" might hide complexities. They want to know where the friend's summary is accurate, oversimplified, or wrong, and if the corrected version still supports the strong conclusion.

  Breaking it down sentence by sentence:

  1. **Expected utility theory is not psychological but a consistency requirement.**  
     Generally accepted. Representation theorems are about preference consistency, not mental states. But note: the axioms are conditions on preferences, not direct rationality claims.

  2. **VN-M and Savage show preferences satisfying axioms can be represented as EU maximization.**  
     Accepted, but the axioms are not all "trivial." Completeness and continuity are contentious. Completeness requires preferences between all options, which isn't always realistic. Continuity involves probabilistic mixtures, which might not align with real-world choices.

  3. **Beliefs/desires read off choices without introspection.**  
     Accepted as per revealed preference. However, uniqueness is an issue—multiple belief/desire pairs can represent the same preferences. Also, Savage's theorem requires preferences over acts, which can be demanding.

  4. **Axioms are "canons of logic," so violators are "provably irrational."**  
     Overstated. The axioms are normative, not logical truths. "Irrational" here means violating internal consistency, but this depends on accepting the axioms as normative. Critics argue some axiom violations can be rational (e.g., incompleteness or state-dependence).

  5. **Money pump argument proves irrationality.**  
     Defensible but has caveats. Money pumps show practical consequences, but agents might avoid exploitation (e.g., precommitment). Also, not all violations lead to money pumps (e.g., cyclic preferences without sequential trades).

  6. **Therefore, EU maximization is the only rational policy.**  
     Overreaching. Representation theorems show that consistent preferences can be represented as EU, but don't prove that EU is the only way to be rational. Alternatives exist (e.g., ambiguity aversion models), which violate axioms but aren't necessarily irrational.

  7. **Incoherent agents lose to coherent opponents.**  
     Plausible in some contexts, but not universally. Competitive advantage assumes the opponent exploits inconsistencies. However, in games with mixed strategies or learning, incoherent agents might still perform well if not exploited.

  Key issues:  
  - **Axioms' Normative Status**: The friend treats axioms as self-evident, but they're debatable (e.g., completeness, independence).  
  - **Scope of Rationality**: The argument conflates internal consistency with overall rationality, which might involve other factors like moral reasons or computational limits.  
  - **Uniqueness**: Representation theorems show that satisfying axioms implies representability by EU, but not that EU is necessary for rationality—only if you accept all axioms as required for rationality.  
  - **Money Pumps**: Practical consequences exist, but real agents might avoid them, and not all violations are exploitable.

  After corrections, does the strong conclusion hold? Only if you accept the axioms as necessary for rationality. Critics argue that rationality might permit violations (e.g., when preferences are incomplete or context-dependent). So, the extra premise is that all the axioms (including contested ones like completeness and independence) are indeed requirements of rationality. Without that, alternatives to EU can be rational.
answer: |-
  Below is a sentence-by-sentence audit of your friend's summary, structured as you requested. I'll assess each claim through the lens of contemporary decision theory, distinguishing between what is **accepted** (A), **defensibly simplified** (DS) with key caveats, or **rejected** (R) by working decision theorists. I'll also separate conflated claims, identify where representation is mistaken for normativity (or vice versa), and clarify where critics and defenders diverge. Finally, I'll address whether the corrected summary supports the conclusion that expected utility (EU) maximization is the *uniquely rational* policy.  

  The audit assumes familiarity with representation theorems (e.g., von Neumann-Morgenstern/VN-M for risk, Savage for uncertainty) and money-pump arguments. Key distinctions:  
  - **Representational results**: Mathematical proofs that *if* preferences satisfy axioms, they *can be modeled* as EU-maximizing.  
  - **Normative claims**: Arguments that rational agents *ought to* satisfy the axioms (and thus obey EU).  
  - **Coherence**: Internal consistency of preferences (e.g., transitivity), distinct from broader rationality.  

  ---

  ### Sentence-by-Sentence Audit  

  1. **"Expected utility theory is not a psychological theory at all, but a consistency requirement on preference."**  
     - **Assessment**: **A** (with nuance).  
     - **Details**: Defenders (e.g., Savage, Broome) emphasize EU as a *logical framework* for consistent choice, not a claim about mental states. Critics (e.g., Kahneman, Gigerenzer) reject this, arguing EU implicitly assumes unrealistic cognitive capacities (e.g., precise probability/utility assignments).  
     - **Conflation**: Separating "consistency requirement" (coherence) from "theory" (EU formalism) is correct, but "not psychological" is debated: while not *reducing* to psychology, EU relies on idealized agent models that may not be psychologically plausible.  

  2. **"The von Neumann–Morgenstern and Savage theorems show that any agent whose preferences satisfy a handful of trivial bookkeeping conditions — no cycles, no gaps, that sort of thing — can be represented as maximizing expected utility."**  
     - **Assessment**: **DS** (oversimplifies axioms).  
     - **Details**:  
       - **Accepted**: VN-M/Savage *do* show that preferences satisfying axioms (e.g., completeness, transitivity, independence) can be represented as EU-maximizing.  
       - **Defensible Simplification**: "No cycles" ≈ transitivity (A), "no gaps" ≈ completeness (DS/R). Completeness (preferences defined for all pairs of options) is *not* trivial—it rules out unresolved dilemmas (e.g., Buridan's ass), which many (e.g., Levi) argue are rationally permissible.  
       - **Rejected**: "Trivial bookkeeping" ignores heavy lifting:  
         - **Independence axiom** (VN-M): Requires that if \( A \prec B \), then \( pA + (1-p)C \prec pB + (1-p)C \) for all \( C \). Violated by Allais paradox, which some (e.g., Buchak) defend as rational.  
         - **Sure-Thing Principle** (Savage): Critiqued by Ellsberg paradox (ambiguity aversion).  
       - **Conflation**: "No gaps" bundles completeness with *archimedean/continuity* axioms (e.g., no "infinitesimal" preferences), which are mathematically necessary but normatively contested.  

  3. **"[This] means the agent's beliefs and desires can simply be read off its choices without anyone ever asking it what it wants."**  
     - **Assessment**: **DS** (revealed preference has limits).  
     - **Details**:  
       - **Accepted**: Revealed preference (Samuelson) is core to the program: choices *reveal* beliefs/utilities.  
       - **Defensible Simplification**: Savage's theorem *constructs* probabilities/utilities from preferences over acts.  
       - **Rejected**:  
         - **Uniqueness issues**: Beliefs/utilities are *not unique* without additional assumptions (e.g., state-dependent utility requires normalization).  
         - **Frame-dependence**: Choices can shift under descriptively equivalent frames (Tversky/Kahneman), violating "beliefs/desires read off" if frames aren't specified.  
       - **Critics**: Argue this conflates *representation* with *ontology*—choices may not reveal "true" beliefs/desires (e.g., Sen's menu-dependent preferences).  

  4. **"The axioms are just canons of logic, so an agent who violates them is provably irrational."**  
     - **Assessment**: **R** (overreaching).  
     - **Details**:  
       - **Accepted**: Defenders (e.g., Ramsey) treat axioms as minimal logic for coherent thought. Transitivity violations *can* lead to irrationality (e.g., money pumps).  
       - **Rejected**:  
         - **Not "logic"**: Axioms are *normative*, not logical truths (e.g., completeness isn't a law of logic).  
         - **"Provably irrational"**: This assumes axioms *define* rationality—a normative leap. Critics (e.g., Sugden) argue rationality sometimes permits violations:  
           - Incompleteness: Deliberation under uncertainty.  
           - Independence: Context-sensitive values (e.g., fairness in allocations).  
       - **Conflation**: "Provably irrational" confuses *instrumental rationality* (achieving goals) with *formal coherence*. Violations may reflect rational sensitivity to non-EU considerations (e.g., uncertainty in Knightian terms).  

  5. **"That is why the money-pump argument works, since anyone with intransitive preferences can be bled dry by a sequence of trades each one of which he prefers to the one before."**  
     - **Assessment**: **DS** (vivid but incomplete).  
     - **Details**:  
       - **Accepted**: Money pumps (e.g., Davidson et al.) are a standard argument for transitivity.  
       - **Defensible Simplification**: Intransitive preferences *can* lead to exploitation.  
       - **Rejected**:  
         - **Avoidability**: Agents may avoid pumps through foresight (e.g., resolute choice, McClennen) or institutional constraints.  
         - **Scope**: Pumps apply mainly to *cyclic* preferences—not all violations (e.g., incompleteness) are pumpable.  
       - **Critics**: Note that "prefers" here assumes stable preferences, which may not hold dynamically (e.g., hyperbolic discounting).  

  6. **"Therefore expected utility maximization is the only decision rule that reason permits, full stop, and once you grant the axioms there is nothing substantive left to argue about."**  
     - **Assessment**: **R** (normative overreach).  
     - **Details**:  
       - **Accepted**: *If* axioms are granted, EU follows representationally (A). Defenders (e.g., Maher) argue the axioms *are* rational requirements.  
       - **Rejected**:  
         - **"Only decision rule"**: False. Alternatives exist (e.g., minimax, prospect theory, rank-dependent utility) that violate axioms but capture rational behaviors (e.g., loss aversion).  
         - **"Nothing substantive left"**: Ignores interpretation (e.g., what "utility" represents) and application (e.g., how to model states).  
       - **Normative Leap**: Assumes coherence axioms exhaust rationality. Critics (e.g., Nozick) argue rationality includes epistemic virtues (e.g., truth-tracking) or moral constraints beyond coherence.  

  7. **"An incoherent agent is doomed in any competitive setting: a coherent opponent can predict it and strip it of everything it has."**  
     - **Assessment**: **DS** (plausible but not universal).  
     - **Details**:  
       - **Accepted**: In game theory, EU-coherent agents can exploit incoherent ones (e.g., in zero-sum games).  
       - **Defensible Simplification**: Highlights strategic risks of inconsistency.  
       - **Rejected**:  
         - **Not "doomed"**: Incoherence might be unpredictable (e.g., random choices), evading exploitation.  
         - **Competitive settings**: Assumes perfect information/rationality; with bounded rationality (Simon), incoherence may not be penalized.  

  ---

  ### Summary of Corrections  
  - **What defenders disavow**: The "trivial bookkeeping" and "full stop" claims. Defenders (e.g., Binmore) acknowledge axioms are substantive normative commitments, not logic.  
  - **Standard objections**:  
    - Axioms (e.g., completeness, independence) are descriptively false and normatively optional (e.g., Allais paradox).  
    - Money pumps assume unrealistic dynamism (e.g., no learning or commitment).  
    - Rationality includes more than coherence (e.g., ecological adaptation).  
  - **Conflation repairs**:  
    - Separated *representational* results (preferences → EU model) from *normative* claims (you *ought* to have such preferences).  
    - Distinguished *coherence* (internal consistency) from *rationality* (broader reasonableness).  

  ---

  ### Does the Conclusion Hold After Corrections?  
  **No**—the conclusion that EU is *uniquely rational* does not follow solely from the corrected claims. It requires an **extra premise**:  
  > *The coherence axioms (e.g., completeness, transitivity, independence) are necessary and sufficient conditions for rationality.*  

  **Why it fails without this premise**:  
  1. **Representation ≠ Rationality**: The theorems show that *if* you satisfy the axioms, you *can be modeled* as EU-maximizing. They do not show that violating axioms is *irrational*—only that it prevents EU representation.  
  2. **Critics challenge necessity**: Rational agents may violate axioms for good reasons (e.g., ambiguity aversion as prudent under uncertainty).  
  3. **Critics challenge sufficiency**: Coherent EU-maximizers can act irrationally (e.g., ignoring moral side-constraints, or when probabilities/utilities are mis-specified).  

  **What could salvage it?** A defender might argue:  
  - *Pragmatic justification*: Violating axioms leads to dominated outcomes (e.g., money pumps), so rationality *requires* coherence.  
  - *Formal justification*: Rationality *just is* coherence (e.g., "structural rationality" view).  

  But both moves are contested:  
  - Pragmatism: Avoidable pumps or non-pumpable violations weaken the argument.  
  - Formalism: Reduces rationality to math, ignoring context (e.g., a coherent agent assigning utility 0 to survival is "rational" but insane).  

  **The joint where it pulls apart**: Between coherence and rationality. Coherence is necessary for EU-representability, but rationality may demand more (or less, in edge cases). The friend's summary implicitly equates them, but this is the core dispute in decision theory.  

  ### Final Shape of the Argument  
  - **Representation theorems**: Show that coherent preferences (per axioms) imply EU-representability.  
  - **Normative arguments** (e.g., money pumps): Suggest coherence is pragmatically rational.  
  - **Gap**: No theorem *proves* coherence is necessary for rationality—it is a philosophical commitment. Thus, EU-maximization is uniquely rational *only if* you accept the axioms as constitutive of rationality. Without that, it is one rational strategy among others.
