prompt: |-
  I'm a tort lawyer — ten years of personal-injury and product-liability work, so I'm at home with but-for causation, the NESS test, proximate cause, intervening and superseding causes, and the whole swamp of redundant causation (two fires meeting at the same house, two shooters firing at once, the market-share apportionment cases). I've been reading round the causal exclusion argument against mental causation and I keep feeling its arguing about something my patch of law has been fighting over for a century, though I can't tell if that's a genuine parallel or me just pattern-matching.

  So here's what I want. Restate the exclusion argument in my vocabulary. Supervenience of the mental on the physical, the causal closure of the physical, no systematic overdetermination, so the mental gets squeezed out as a cause — put all of that into the language I actually use: cause-in-fact, sufficient sets, but-for and NESS reasoning, superseding cause, apportionment of liability between defendants. Be as faithful as you can and don't just relabel things that don't fit. Then give me the residue report: which steps translate cleanly into how the law handles cause, which only go through if you fudge them, and which have no counterpart at all in legal causation. Finish with your view on whether what's left over is the law missing something real, or the philosophers' puzzle being less sharp than it looks.

  Give it to me as exactly five numbered points, a couple of sentences each, no intro and no wrap-up at the end.
reasoning: |-
  Okay, let me tackle this tort lawyer's request. They're deeply familiar with legal causation concepts like but-for, NESS, superseding causes, and apportionment. They see parallels with the philosophical exclusion argument about mental causation but want it translated into their legal vocabulary. 

  First, I need to map exclusion argument components to tort concepts:
  Supervenience becomes the physical basis requirement - just like how liability depends on underlying facts. Causal closure translates to physical sufficiency, mirroring how law traces all events back to physical acts. The overdetermination ban resembles how courts avoid liability overlaps. The exclusion step feels like dismissing mental states as non-causes, similar to how superseding causes break chains. Finally, the residue report must show where legal practice diverges - like apportionment handling what philosophy calls overdetermination.

  I notice key differences: tort law comfortably handles concurrent causes through apportionment, while philosophy treats them as problematic. Legal tests like but-for have practical thresholds philosophers ignore. And causation in law serves policy goals unlike metaphysical debates. 

  The challenge is preserving precision - no forcing square philosophical pegs into round legal holes. For example, superseding cause is a doctrinal tool, not a perfect match for exclusion. And market-share liability shows law's flexibility where philosophy sees contradiction.
answer: |-
  Here are five numbered points translating the causal exclusion argument into tort causation vocabulary, with residue assessment:

  1.  **Supervenience as Physical Basis Requirement:** The mental "supervenes" on the physical like liability supervenes on a specific factual basis (e.g., duty/breach/damage). A mental state (like intent) isn't a free-floating cause; its causal potential entirely depends on the underlying physical state (brain state), just as liability depends on the underlying injurious act/omission. **Translates cleanly:** Law requires a physical factual predicate for attributing causal/legal significance to abstract concepts like mental states.

  2.  **Causal Closure as Physical Sufficiency:** The "causal closure of the physical" means the actual physical state (brain state P1) plus the physical laws form a *sufficient set* (in the NESS sense) for the later physical state (behavior/movement P2). Any complete causal story for P2 *must* include the physical antecedents; it's causally closed like tracing a chain of physical events leading to injury. **Translates cleanly:** Law inherently seeks the physical chain of events (the mechanics of the accident, toxin exposure, etc.) as the primary locus of cause-in-fact.

  3.  **Systematic Overdetermination Ban as No Liability Overlap:** "No systematic overdetermination" rejects treating both the physical state (P1) and the mental state (M) it realizes as *simultaneous, independent sufficient causes* for P2. Legally, this parallels rejecting liability where two *truly independent* sufficient causes exist (like two fires converging), *unless* apportionment applies. For the mind, apportionment seems nonsensical. **Fudges:** Law *does* recognize multiple sufficient sets (NESS) and apportions liability (market-share, concurrent tortfeasors). Philosophers treat this as deeply problematic "systematic overdetermination," while law sees it as routine.

  4.  **Exclusion as Superseding Cause or Non-Fact:** Since P1 is sufficient for P2 (Point 2), and M isn't independent of P1 (Point 1), positing M as an *additional* cause makes it seem like a redundant, non-butt-for factor or an intervening cause superseded by the physical cause. M gets "squeezed out" like a superseded cause or a factor failing but-for (if P1 alone is sufficient). **Fudges:** Superseding cause requires novelty/abnormality; exclusion argues M is *always* superseded. But-for often finds multiple causes necessary within a sufficient set (NESS); exclusion treats sufficiency of P1 as automatically making M non-necessary.

  5.  **Residue Report & Assessment:** The core tension (physical sufficiency vs. mental efficacy) translates, but law handles "overdetermination" via apportionment (no counterpart in exclusion) and employs context/policy-driven thresholds for cause-in-fact that exclusion ignores. **View:** The "residue" is partly law's pragmatic tools handling what philosophy finds paradoxical (apportionment), and partly the exclusion argument's artificial sharpness – its demand for a *unique* sufficient cause clashes with law's pluralistic, NESS-based reality. Law isn't missing a real problem but highlights the exclusion argument's oversimplification of causation.
