  The user emphasizes that the causal story and epistemic story must come apart. The object should be present and causally upstream, yet the experience shouldn't count as perception. They want five numbered items: the case, disjunctivist view, common-kind view, the key feature, and a steelman response with a disjunctivist reply.

  First, I need to craft a scenario that fits. The kitchen setting is relatable. The subject, Maya, sees a red bowl. In the veridical case, it's a real bowl. In the non-veridical, she has a migraine aura causing a hallucination, but coincidentally, there's a red bowl in the cupboard. The bowl is causally upstream because she wouldn't have the hallucination without it, but the experience isn't caused by seeing the bowl directly.

  For the disjunctivist, in the veridical case, Maya knows there's a red bowl because it's a genuine perception. In the hallucination, even though the bowl is there, she doesn't know because the experience isn't constitutively linked to the object. The common-kind theorist disagrees, saying both episodes share the same mental state; knowledge depends on external factors, but the experience type is identical.

  The load-bearing feature is the object's causal role without being the direct cause of the experience. Removing this collapses the case into a standard illusion argument. The common-kind steelman argues that the hallucination is screened off by the aura, so the bowl's presence is irrelevant. The disjunctivist counters by emphasizing that perception requires direct conscious relation, not just causation.

  I need to ensure all five points are addressed concisely. Checking the spec: mundane causes, fixed phenomenology, causal vs. epistemic divergence. The steelman and reply are crucial for the crux of their debate. Making sure the example clearly separates causation from perceptual relation to highlight disjunctivism's point about the nature of experience.
answer: |-
  Here's the thought experiment tailored to your specifications:

  1. **The Case**:  
     Maya sits at her kitchen table. In Episode A, a red ceramic bowl is on the table; she sees it clearly under normal lighting. In Episode B, Maya experiences a vivid migraine aura: she hallucinates an identical red bowl on the table. Unbeknownst to her, an identical red bowl *is* in the closed cupboard directly behind her, and its presence subtly altered the room’s acoustics earlier, indirectly triggering her light-sensitive migraine (which caused the aura). The bowl is causally upstream, but her visual experience is directly caused by the neurological event, not light reflecting from the cupboard bowl.

  2. **Disjunctivist View**:  
     In Episode A, Maya knows there’s a red bowl on the table because her experience is a veridical perception constitutively linked to the bowl. In Episode B, she does *not* know the cupboard bowl exists: her hallucinatory experience isn’t a perception *of that bowl*, despite its indirect causal role. Subjectively indistinguishable, she cannot tell which episode she’s in, so she lacks knowledge in B.

  3. **Common-Kind/Representationalist View**:  
     Both episodes share an identical internal state with the same representational content ("red bowl here"). Epistemic justification depends solely on this state plus external facts. They peel off at causation: for them, if the cupboard bowl caused the hallucination (even indirectly), Episode B *is* a misperception *of that bowl*. The disjunctivist denies this, insisting only A is a genuine perception.

  4. **Load-Bearing Feature & Collapse Risk**:  
     The key is **causal mediation**: the cupboard bowl triggers a *distal cause* (migraine) that *screen-off* its direct influence on the experience. Delete this (e.g., if light from the cupboard bowl *directly* caused a distorted image), and the cases collapse into standard veridical/misperception—losing the causal/epistemic split. Retaining it makes the disagreement substantive, not verbal.

  5. **Common-Kind Steelman & Disjunctivist Reply**:  
     **Steelman**: "The cupboard bowl is causally redundant: the migraine alone suffices to explain the hallucination. Its presence is epistemically irrelevant—Maya gains no perceptual access to it. The ‘common kind’ is the experience’s intrinsic character, which screens off external causes."  
     **Disjunctivist Reply**: "This concedes the point: if the bowl’s role is screened off, it isn’t a *perceptual* object. Perception requires the object to be the *direct conscious ground* of the experience, not a background cause. Epistemic access in perception demands unmediated explanatory relevance, which B lacks."

  ---

  **Key Clarifications**:  
  - **Causal/Epistemic Split**: The cupboard bowl is a *necessary background condition* for the migraine (remove it, no hallucination), but not the *proximate cause* of the experience. This decouples causal contribution from perceptual relation.  
  - **Anti-Luck**: The bowl’s presence in B is Gettier-style lucky coincidence—further isolating causation from justification.  
  - **Disjunctivist Core**: They deny experiences in A/B share a fundamental "common kind" (hence *disjunctivism*: veridical perception and hallucination are metaphysically distinct).  
  - **Your Crux**: This forces the debate onto whether perception is defined by causal history *or* by a direct relational property—and whether epistemic status derives from the experience’s nature or external facts.
