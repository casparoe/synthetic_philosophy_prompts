prompt: |-
  Ok so I'm assembling a little thought-experiment pack on perception for my reading group and I need one built to spec rather than yet another brain-in-a-vat. Topic is disjunctivism vs the argument from illusion.

  The spec: one subject, two episodes, subjectively indistinguishable from the inside, but the world differs between them, and the disjunctivist ends up saying she knows something in one episode and doesn't in the other even though she has no way of telling which episode she's in. Keep it mundane -- a kitchen, a bus stop, a waiting room. No vats, no demons, no sci-fi, and the non-veridical episode needs a boring real cause (migraine aura, sleep deprivation, fever, Charles-Bonnet-type stuff). Hold the phenomonology, her beliefs, and her evidence fixed. And here's the part I actually care about: make the causal story and the epistemic story come apart, so that the real object being present and causally upstream of the experience doesn't by itself make it a perception of that object -- I want a case where the object is there, the experience is downstream of it, and yet the experience still isn't a perception of it.

  Then give me exactly five numbered items, a sentence or two each, no intro and no outro:

  1. the case itself, told straight
  2. what the disjunctivist says about what she knows in each episode and why
  3. what a common-kind / representationalist says, and the precise point where they peel off from the disjunctivist
  4. which single feature is doing the load-bearing work, and whether deleting it collapses the disagreement into something merely verbal
  5. how a common-kind theorist would steelman their pushback (I assume the screening-off / highest-common-factor move) and whether the disjunctivist has a decent reply

  Thanks, this whole thing is kind of the crux for me.
