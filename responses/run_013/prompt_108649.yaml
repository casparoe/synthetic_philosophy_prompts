answer: |-
  Your inquiry cuts to the heart of historical epistemology—the tension between empirical evidence and narrative construction. This phenomenon has been analyzed but lacks a universally accepted term. I propose **narrative valence** as the most precise descriptor for the "specific item" you identify, with **keystone events** as its primary mechanism. Here's a breakdown:

  ### The Concept: Narrative Valence
  - **Definition**: *The implicit causal and emotional weight assigned to events within a historical narrative, determining their perceived influence on outcomes. This weighting governs how events are sequenced, juxtaposed, and emphasized to create coherence, inevitability, or contingency.*  
  - **Key Mechanism**: **Keystone Events**—events selected as narrative pivots that bear disproportionate explanatory weight (e.g., your assassination vs. harvest). These are not "facts" but *interpretive anchors*.

  ---

  ### How It Differs from Related Concepts
  1. **Selection vs. Valence**:  
     Selection chooses *which* events to include; valence decides *how* they function. Two histories may select identical facts but assign opposing valence (e.g., a drought as "context" vs. "catalyst").  

  2. **Rhetoric/Style vs. Valence**:  
     Rhetoric concerns *persuasive language*; valence concerns *structural causality*. An author may write dispassionately yet frame a battle as decisive (high valence) or incidental (low valence) through placement and pacing.  

  3. **Presentism vs. Valence**:  
     Presentism imposes *modern values* on the past. Valence arises from *narrative necessity*: how events must relate to satisfy internal coherence, regardless of the author's era.  

  4. **Emplotment (Hayden White)**:  
     White’s term for story-shaping (romance, tragedy, etc.) is closer but focuses on *genre*. Valence operates at a granular level: the gravity assigned to *specific events* within the plot.  

  ---

  ### Defensibility Criteria: When is Valence "Better"?  
  An arrangement is **defensible** when it:  
  - **Minimizes Narrative Friction**: Avoids forced coincidences or unexplained gaps (e.g., if an "inevitable" narrative requires ignoring credible contingency plans).  
  - **Absorbs Anomalies**: Explains "outlier" evidence without ad hoc rationalizations (e.g., a "decline" narrative accounting for temporary victories).  
  - **Maintains Causal Parsimony**: Uses the fewest keystone events needed for coherence. Adding valence where evidence is thin is arbitrary.  
  - **Aligns with Temporal Perception**: Reflects how actors *experienced* uncertainty (e.g., a "near-run thing" narrative capturing contemporary diaries’ anxiety).  

  An arrangement is **arbitrary** when:  
  - Valence contradicts actors’ motivations (e.g., downplaying a leader’s stated fears).  
  - It requires dismissing coherent evidence clusters (e.g., ignoring economic data to foreground politics).  

  ---

  ### Why This Matters  
  Historians like Richard Evans argue that while facts constrain narratives, valence determines their *meaning*. Your case—two histories agreeing on facts but disagreeing on inevitability—exposes history’s **double illusion**:  
  - The illusion of inevitability in retrospect.  
  - The illusion of contingency in the moment.  

  **Narrative valence** mediates this. A "recovery" story might give high valence to resilient institutions; a "decline" story might valence the same institutions as fragile. Neither is false; both reveal facets of ambiguity.  

  ---

  ### Historical Precedents  
  - **Leopold von Ranke**: His "show what actually happened" ideal clashes with valence—he emphasized political diplomacy, valencing treaties over social currents.  
  - **Annales School**: Reacted by valencing geography/economy (your "harvest" example), making politics episodic.  
  - **Microhistory**: Exposes valence arbitrariness by showing how shifting keystone events (e.g., a trial vs. a village ritual) alters a story’s arc.  

  ### Conclusion  
  **Narrative valence**—manifested through **keystone events**—names the "disagreement carrier" you seek. It is the architecture of historical explanation: the silent grammar turning facts into fate or fluke. No arrangement is "true," but the best ones make the past *intelligible* without simplifying its chaos. As Marc Bloch noted, history is "man in time"; valence is how we hear his heartbeat.
