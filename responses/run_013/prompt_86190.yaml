  Alternatively, the scrip is free to use to play? But then the casino has no revenue. So let's assume the casino sells the initial scrip for real money, and then the winnings are in scrip which can be used to play again without further payment? Then the value of the scrip would be the expected value of the game in real money that you saved by not having to pay? But how much real money did you pay for the initial scrip? It's circular.

  This is getting very meta. Perhaps the joke can be:

  A man wins the St. Petersburg game at a casino that pays in its own scrip. He's thrilled until he tries to spend it: the only store that accepts it is the casino's own game parlor, where he can buy back in. He flips again, wins 2 scrip, and realizes he's stuck in an infinite loop of diminishing returns.

  But that doesn't capture the circularity of the value and the expected value.

