  The casino owner brags, "Our St. Petersburg game has infinite expected value!" A mathematician replies, "But your scrip is only backed by your game." The owner says, "Exactly! So the value of the scrip is the expected value of the game." The mathematician then asks, "And what is the expected value of the game in scrip?" The owner: "Infinite!" The mathematician: "So the value of the scrip is infinite? Then why does it cost only $1 to buy in?"

  But then the owner might say: "Because we set the buy-in in dollars, and the scrip is just a token for the game." That breaks the circularity.

