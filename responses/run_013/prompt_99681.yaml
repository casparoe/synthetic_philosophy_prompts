prompt: |-
  I am a software engineer on the clinical product team at a company that makes a mental-health self-assessment and triage app. A user answers a fixed questionnaire; our service assigns one of a small number of screening categories — for example, "likely depression," "likely anxiety," "elevated risk of self-harm" — and recommends a next step, ranging from self-guided material up to a human crisis line. The clinical lead signs off on the wording of each category and on the thresholds, but my team owns the questionnaire items, the scoring logic, the classifier, and the copy that explains a category to users and to the partner clinics that receive our referrals. I have no clinical or philosophical training, and neither does anyone else on the team.

  Two experiences have convinced me that we need a standing rule rather than case-by-case judgment. First, three years ago we introduced a mild category intended to catch distress earlier. Neither the items nor the thresholds have changed since, but the share of users who meet that category has roughly doubled, and the clinical lead believes the category itself may have taught a subset of users a new vocabulary for describing ordinary unhappiness, which they then report back to us. Second, our relapse-risk model sends a supportive check-in message to flagged users. A retrospective look suggests that flagged users' self-reported symptoms rise in the weeks after the message, and we cannot tell whether the message detects a trajectory that was already there or contributes to it. In both cases, the thing we measured appears to have moved because we measured it.

  I have read enough to recognize this as the family of problems Ian Hacking describes as looping effects: classifications of people, as opposed to classifications of minerals or electrons — "interactive" rather than "indifferent" kinds — can be taken up by the people classified, change how they understand and present themselves, change who shows up to be counted, and in some cases bring new ways of being into existence. The underlying view is sometimes called dynamic nominalism. I cannot pursue the literature myself and I do not want a reading list or a bibliography; I need operational content.

  Please write a decision procedure my team can actually run. Requirements:

  Trigger and budget. It runs whenever we propose adding, splitting, merging, retiring, or re-thresholding a category, or changing what a category's feedback says or does; and once per quarter as a standing review of categories already in production. It should cost one engineer about an hour plus a thirty-minute conversation with the clinical lead, who is the only person who can sign off, and it has to fit on two wiki pages.

  Form. An ordered list of questions, and for each one: what counts as a sufficient answer, what data we need to answer it, what to do with each possible answer, where the procedure stops with a decision not to ship, and where it hands the question to the clinical lead because it is a question of values rather than facts — including what we must tell them so that they can decide well.

  Conceptual content. Keep whatever in the looping-effects idea changes what an engineer should actually do, and drop whatever is of interest only to philosophers. In particular, at each step the procedure must distinguish among four possibilities and say how to tell them apart with data a small team can realistically obtain: (a) the category has changed the underlying condition; (b) it has changed only how people describe themselves to us, while the condition is unchanged; (c) it has changed who comes to us at all, so our user mix has shifted; (d) there is no loop, and we are seeing ordinary drift or an artifact of our own analysis. I expect these are not always separable in practice; where they are not, the procedure should say so rather than pretend otherwise.

  Two complications it must handle. First, loops that run through institutions rather than self-conception: if a category now carries something concrete — a referral, an accommodation letter, insurance coverage, admission to a support community — people's reports may shift because the label buys them something, and the loop will look different from one driven by self-understanding. Second, semantic drift: a label we publish can change meaning as users adopt it into ordinary speech, so an item that was valid when we wrote it may decay without our touching it. The procedure should also make clear that a loop is not automatically a defect — some feedback is the point, if it helps people get help — so it must not collapse into "any feedback, do not ship."

  Monitoring. Say what we must measure before release and after, over what window, and what we do if the loop appears: roll back, reword, keep but monitor, or something else, with an accountable person named for each branch. Assume we can run A/B tests for some changes but not for anything that withholds a crisis intervention, and that we have no ethics board and no ability to run long studies.

  Then run the procedure on three proposals:

  1. Adding "burnout" as its own category rather than routing those users into the depression screen.
  2. Lowering the threshold on the anxiety screen by one response level, which would flag roughly fifteen percent more users. Growth wants this; the clinical lead is unsure.
  3. Changing the relapse-risk check-in from a clinician-facing silent flag into a message shown directly to the user. My expectation is that this is the case where the procedure tells us something we will not want to hear, since the honest answer may be that we should either ship it only as a controlled experiment or not ship it at all, and both are expensive. If that is what the procedure implies, say so plainly and give me the least bad option.

  For each case, give the verdict, the reasoning step by step, and the point where the procedure stops or defers. Close with a short list of what the procedure cannot do, and the questions it will answer with false confidence. Write the deliverable as a checklist with decision points, in the plain language of a software team, not as an essay.
reasoning: |-
  We are designing a decision procedure for the team to evaluate changes to screening categories in the mental health app, considering the potential for looping effects (interactive kinds). The procedure must be practical, fit on two wiki pages, and be executable in about an hour by an engineer plus a 30-minute conversation with the clinical lead.

  The procedure will be triggered by:
  - Proposals to add, split, merge, retire, or re-threshold a category.
  - Changes to the feedback (copy or action) associated with a category.
  - Standing quarterly review of existing categories.

  We break the procedure into an ordered list of questions. For each question, we specify:
  - What counts as a sufficient answer.
  - Required data.
  - Actions based on the answer.
  - Where the procedure stops (if we decide not to ship) or defers to the clinical lead (for value judgments).
  - How to distinguish among four possibilities: 
      (a) The category changed the underlying condition.
      (b) Changed only self-description (condition unchanged).
      (c) Changed user mix (who comes to us).
      (d) No loop (ordinary drift or analysis artifact).

  We must handle two complications:
  1. Loops through institutions (when the label provides concrete benefits).
  2. Semantic drift (the meaning of a label changes over time in the user population).

  We note that a loop is not automatically bad (e.g., if it helps people get help). Therefore, the procedure does not default to blocking changes.

  Monitoring: We specify what to measure before and after release, over what time window, and actions if a loop is detected (roll back, reword, keep but monitor, etc.), with accountable persons.

  Finally, we run the procedure on the three proposals.

  ---

  **Decision Procedure: Evaluating Looping Effects in Clinical Categories**

  **Overview**: This procedure evaluates proposed changes to clinical categories (or existing categories in quarterly review) for potential "looping effects" — where the category itself may alter user behavior, self-understanding, or the population we serve. It aims to distinguish between actual changes in mental health conditions, changes in reporting, changes in user mix, and non-looping explanations. The clinical lead must be consulted for value judgments (marked with ⚠️).

  **Pre-requisites for running the procedure**:
  - For new categories or changes: A clear specification of the category, its thresholds, feedback (copy and actions), and the target population.
  - For existing categories in quarterly review: Historical data on category assignment rates and user characteristics.

  **Procedure Steps**:

  1. **Question 1: Could this category (or change) plausibly interact with user self-understanding, behavior, or incentives?**
     - *What counts as sufficient*: A yes/no based on team discussion. Consider:
          - Does the category label or feedback introduce new concepts or vocabulary?
          - Does the category trigger a concrete benefit (e.g., referral, accommodation, access to support)?
          - Is the category about a socially contested or evolving concept (e.g., burnout, which has entered popular discourse)?
     - *Data needed*: None for this step; it's a conceptual discussion.
     - *Actions*:
          - **No**: Proceed to Step 3 (monitoring plan). Skip Step 2.
          - **Yes**: Proceed to Step 2.
          - **Unclear**: Proceed to Step 2 (treat as "Yes" to be safe).

  2. **Question 2: What is the primary mechanism of the expected loop?**
     - *What counts as sufficient*: Categorize the mechanism as:
          - **Self-understanding**: The category may change how users interpret their experiences (e.g., teaching new vocabulary).
          - **Institutional**: The category provides a tangible benefit (e.g., referral, accommodation) that may incentivize reporting.
          - **Semantic drift**: The label is already in public use and may change meaning over time (for existing categories) or be adopted in unpredictable ways (for new categories).
          - **Multiple/Other**: More than one mechanism or a different one.
     - *Data needed*: None; team's assessment based on the category design and context.
     - *Actions*:
          - Record the mechanism(s). This informs Steps 3 and 4.
          - Proceed to Step 3.

  3. **Question 3: Can we measure the loop and distinguish its type (a, b, c, d) with available data?**
     - *What counts as sufficient*: Design a monitoring plan that includes:
          - **Baseline measurement** (for new categories, use the closest proxy category or user segment; for changes, use pre-change data).
          - **Post-release metrics** to track over time (minimum 1 quarter for quarterly reviews; for new changes, at least 8 weeks).
          - **Comparison groups**: If possible, use A/B testing (except for crisis interventions) or natural experiments (e.g., phased rollout). For existing categories, compare with historical baselines and control for seasonality and user growth.
     - *Metrics to collect*:
          - **Assignment rate**: Proportion of users assigned the category.
          - **User characteristics**: Demographics, referral source, app engagement, and other category assignments (to detect user mix shifts).
          - **Downstream outcomes** (if available): User engagement with recommended resources, self-reported symptoms in follow-ups (if collected), and drop-off rates.
          - **For institutional loops**: Track usage of the concrete benefit (e.g., referral uptake) and compare with similar categories.
     - *Distinguishing loop types*:
          - **(d) No loop / artifact**: If assignment rate changes are explained by external factors (e.g., a marketing campaign that changed user mix) or analysis errors (e.g., a bug in scoring). Check by correlating with known external events or by re-running analysis with corrected methods.
          - **(c) User mix shift**: If the change in assignment rate is accompanied by shifts in user characteristics (e.g., age, referral source) without changes in other categories' rates for similar users. Control by segmenting users.
          - **(b) Self-description change**: If assignment rate increases but downstream outcomes (like resource engagement or symptom severity) do not change, or if users' responses to specific items shift without a corresponding shift in related items (if available). May require follow-up surveys (which we may not have).
          - **(a) Condition change**: If assignment rate increases AND downstream outcomes worsen (or improve) in a way that suggests actual change in condition. Very hard to prove without controlled studies. We typically cannot distinguish (a) from (b) with our data alone.
     - *Actions*:
          - **We can measure and distinguish**: Proceed to Step 4.
          - **We cannot measure** (e.g., no follow-up data to distinguish (a) from (b)): 
              - ⚠️ **Defer to clinical lead** with the following information: "We cannot rule out that this change might alter users' self-understanding or behavior without our being able to measure it. The potential mechanisms are [mechanism from Step 2]. You must decide if the potential benefit justifies this uncertainty." Proceed to Step 4 only for the monitoring plan.
          - **We can measure but not distinguish (a) from (b)**: 
              - Proceed to Step 4 and note the ambiguity in the monitoring plan.

  4. **Question 4: What is the risk of harm?**
     - *What counts as sufficient*: A risk assessment based on:
          - The mechanism (Step 2).
          - The category's severity (e.g., crisis vs. mild distress).
          - The feedback action (e.g., self-help vs. crisis intervention).
          - The potential for over-pathologizing (e.g., turning normal unhappiness into a medical category) or under-pathologizing (e.g., missing a severe condition).
     - *Data needed*: None; this is a judgment call.
     - *Actions*:
          - ⚠️ **Defer to clinical lead** with the following information: 
              - "The proposed change has looping potential via [mechanism]. We expect to see effects in [metrics]. The potential harms include [e.g., increased anxiety due to labeling, or reduced access to care if the category becomes stigmatized]. The potential benefits are [e.g., earlier intervention]. 
              - Given the risk level (low/medium/high, based on severity and feedback), do you approve the change with the monitoring plan? If medium/high risk, should we limit the rollout (e.g., A/B test, phased release)?" 
          - **Clinical lead approves**: Proceed to Step 5 (monitoring plan) and ship with monitoring.
          - **Clinical lead rejects**: Stop. Do not ship or revert if already shipped.

  5. **Question 5: Monitoring and Response Plan**
     - *What counts as sufficient*: A clear plan with:
          - **Metrics and frequency**: What to track, how often (e.g., weekly for first month, then quarterly), and for how long (at least one quarter).
          - **Thresholds for action**: What change in assignment rate or other metrics triggers a review (e.g., >10% increase in category assignment without a clear external cause, or a significant shift in user mix).
          - **Response actions**:
              - **Roll back**: If a severe harm is suspected (e.g., increased crisis reports after a change). Accountable: Engineering lead.
              - **Reword feedback**: If the loop seems driven by copy (e.g., users are misinterpreting the category). Accountable: Product manager.
              - **Adjust thresholds**: If the loop is due to over/under sensitivity. Accountable: Clinical lead.
              - **Keep and monitor**: If the loop is likely beneficial or neutral. Accountable: Clinical lead.
          - **Review cadence**: Quarterly review for the category, using this procedure.
     - *Data needed*: None; this is a plan.
     - *Actions*:
          - Document and implement the plan.
          - Ship the change (if new) or continue (if existing).

  **What this procedure cannot do**:
  - Prove causality without controlled experiments.
  - Distinguish between changes in self-description (b) and changes in underlying condition (a) without long-term follow-up data we don't have.
  - Capture long-term cultural shifts beyond our monitoring window.
  - Address ethical issues beyond looping effects (e.g., privacy, bias) — those require separate reviews.

  **False confidence risks**:
  - The procedure may miss slow-moving loops (e.g., semantic drift over years).
  - It may misattribute a loop to (b) or (c) when it's actually (a) due to lack of outcome data.
  - It assumes that the clinical lead can accurately weigh risks without outcome data.

  ---

  **Running the Procedure on Proposals**

  **Proposal 1: Adding "burnout" as its own category.**

  - **Step 1**: Yes. "Burnout" is a socially evolving concept; introducing it may teach users to interpret stress as burnout.
  - **Step 2**: Mechanism: Self-understanding (primary) and semantic drift (since burnout is in popular discourse).
  - **Step 3**: We can measure assignment rate and user mix. We cannot easily distinguish (a) from (b) because we lack long-term outcome data. 
      - Action: Defer to clinical lead with uncertainty about (a) vs. (b).
  - **Step 4**: Risk: Medium. Harm could be pathologizing normal stress; benefit could be directing users to appropriate resources. 
      - Clinical lead input: They must weigh the uncertainty.
  - **Step 5**: Monitoring plan: Track burnout assignment rate weekly for 8 weeks, then quarterly. Compare with stress-related categories. If assignment rises >20% without user mix shift, review wording and thresholds. Response: Reword or adjust thresholds (clinical lead accountable).

  **Verdict**: Ship with monitoring if clinical lead approves, given the medium risk and uncertainty. Defer at Step 4 to clinical lead for risk assessment.

  **Proposal 2: Lowering the anxiety threshold by one response level (15% more users flagged).**

  - **Step 1**: Yes. A lower threshold may capture users with milder symptoms, potentially changing self-description or user mix (if the app becomes known as more "anxiety-sensitive").
  - **Step 2**: Mechanism: Self-understanding (if users reframe mild stress as anxiety) and institutional (if the label provides access to resources).
  - **Step 3**: We can A/B test the new threshold (withhold from a random group) because it's not a crisis intervention. 
      - Metrics: Compare assignment rates, user characteristics, and downstream outcomes (e.g., resource use) between groups. 
      - We can distinguish:
          - (c) User mix: If the treatment group has different demographics/referrals.
          - (b) Self-description: If assignment increases but outcomes don't change.
          - (d) Artifact: If the change is due to scoring error (unlikely).
          - (a) Condition change: Hard to prove, but if outcomes worsen in treatment group, it might indicate harm.
      - Action: Proceed to Step 4.
  - **Step 4**: Risk: Low to medium. Harm: Overdiagnosis of anxiety; benefit: Earlier intervention. 
      - Clinical lead must approve given Growth's push.
  - **Step 5**: Monitoring: A/B test for 4 weeks. If the treatment group shows increased assignment without improved outcomes (or worsened outcomes), revert or adjust. Response: Roll back if harm (engineering lead) or adjust threshold (clinical lead).

  **Verdict**: Ship as an A/B test, then full rollout if no harm. No deferral at Step 4 (clinical lead approves risk).

  **Proposal 3: Changing relapse-risk check-in from silent flag to user message.**

  - **Step 1**: Yes. The message may cause users to reflect on symptoms differently (self-understanding) and could trigger anxiety.
  - **Step 2**: Mechanism: Self-understanding and possibly institutional (if the message offers resources).
  - **Step 3**: Cannot A/B test if the message is considered a crisis intervention (withholding from control may be unethical). Without A/B, we rely on pre/post comparison. 
      - We can track:
          - Assignment rate of relapse-risk flag (if the message changes reporting).
          - Self-reported symptoms in the weeks after (if collected).
      - But: We cannot distinguish (a) from (b). If symptoms rise post-message, is it because the message made users more aware (b) or because it caused distress (a)? 
      - Action: Defer to clinical lead with high uncertainty: "We cannot measure the loop type. Symptoms may rise due to the message itself."
  - **Step 4**: Risk: High. Harm: The message could increase distress; benefit: Early relapse detection. 
      - Clinical lead must decide given the high risk and uncertainty.
  - **Step 5**: If approved, monitor closely: Track symptom scores 1 week and 4 weeks post-message vs. pre-message. If symptom scores increase significantly, roll back (engineering lead).

  **Verdict**: The procedure implies we should not ship without a controlled experiment (which is expensive) or not at all. Least bad option: 
  - If an A/B test is unethical, do a phased rollout to a low-risk user segment (e.g., those with mild relapse risk) and monitor intensively. 
  - If the clinical lead approves the high risk, ship with an immediate rollback plan. 
  - Defer at Step 4 to clinical lead with a strong warning.

  **Procedure Summary**:
  - **Proposal 1**: Clinical lead decides with medium risk; ship with monitoring.
  - **Proposal 2**: A/B test; ship if safe.
  - **Proposal 3**: High risk and uncertainty; clinical lead decides with caution.

  **Final Note**: The procedure surfaces risks but cannot eliminate them. It relies heavily on the clinical lead's judgment. For Proposal 3, the team should consider whether a less direct message (e.g., "Here are resources you can use anytime") reduces potential harm.
answer: |-
  ### Decision Procedure: Looping Effects Evaluation for Clinical Categories  
  **Purpose**: Evaluate proposed category changes for looping risks (self-understanding, institutional, semantic drift, user mix shifts). Not all loops are bad—some may increase help-seeking. Fit: 2 wiki pages. Time: 1 engineer-hour + 30-min clinical lead sync.  
  **Trigger**: New category, threshold change, feedback change, or quarterly review of live categories.  
  **Rules**:  
  - Stop and do not ship if the procedure blocks at any step.  
  - Defer to clinical lead at ⚠️ steps (values/risk decisions).  
  - Track all answers in a shared doc for audit.  

  ---

  #### Step 1: Could this change create a loop?  
    - **Sufficient answer**: Yes/no + brief rationale.  
    - **Data needed**: None (conceptual analysis).  
    - **Actions**:  
      - **No** → Proceed to Step 5 (monitoring baseline).  
      - **Yes** → Proceed to Step 2.  
    - **Distinguish loops**:  
      - (a) *Condition change*: Unlikely without external evidence (e.g., new therapy).  
      - (b) *Self-description change*: Likely if new label/vocabulary is introduced.  
      - (c) *User mix shift*: Likely if change affects referrals or app positioning.  
      - (d) *No loop*: Only if all other explanations ruled out.  

  #### Step 2: What loop mechanisms apply? (Select all)  
    - **Sufficient answer**: Check ≥1:  
      - `Self-understanding` (users adopt new labels/vocabulary).  
      - `Institutional` (label grants concrete benefits, e.g., referrals).  
      - `Semantic drift` (label meaning evolves in public discourse).  
      - `User mix shift` (change attracts different users).  
    - **Data needed**: None (design analysis).  
    - **Actions**:  
      - If `Self-understanding` or `Semantic drift` → Proceed to Step 3.  
      - If `Institutional` or `User mix shift` → Proceed to Step 4.  
      - If multiple → Proceed to both Steps 3 and 4.  

  #### Step 3: Can we detect self-understanding/semantic drift?  
    - **Sufficient answer**: Yes/no + detection method.  
    - **Data needed**:  
      - Pre-change: Category assignment rates, user demographics.  
      - Post-change: Same metrics + optional user surveys (e.g., "What does [label] mean to you?").  
    - **Actions**:  
      - **Yes** (e.g., via A/B test or surveys) → Proceed to Step 5.  
      - **No** (no feasible measurement) → ⚠️ **Defer to clinical lead**. Tell them:  
        *"We cannot rule out self-description changes. Risk: Users may over-identify with the label. Benefit: May increase help-seeking. Do you accept this uncertainty?"*  

  #### Step 4: Can we detect institutional/user mix loops?  
    - **Sufficient answer**: Yes/no + detection method.  
    - **Data needed**:  
      - Pre-change: User acquisition sources, referral rates.  
      - Post-change: Same + track benefit usage (e.g., referral claims).  
    - **Actions**:  
      - **Yes** → Proceed to Step 5.  
      - **No** → ⚠️ **Defer to clinical lead**. Tell them:  
        *"We cannot track if benefits/incentives distort reporting. Risk: Users may game the system. Benefit: Access to care. Do you accept this?"*  

  #### Step 5: Pre-release baseline & monitoring plan  
    - **Sufficient answer**: Defined metrics, thresholds, response actions.  
    - **Data needed**:  
      - **Baseline**: Current assignment rates, user demographics, symptom scores (if available).  
      - **Monitoring**: Track weekly for 8 weeks, then quarterly.  
    - **Distinguish loops post-release**:  
      - **(b) Self-description**: Assignment rate ↑, symptom scores stable, user mix stable.  
      - **(c) User mix**: Assignment rate ↑ + new acquisition channels/demographics.  
      - **(d) No loop**: Assignment rate stable or changes explained by external events (e.g., media coverage).  
      - **(a) Condition change**: Symptom scores worsen—**rarely distinguishable** without clinical studies.  
    - **Actions**:  
      - Finalize monitoring plan → **Ship or keep category**.  

  #### Step 6: Response plan for detected loops  
    - **Sufficient answer**: Action owner + trigger.  
    - **Actions if loop detected**:  
      - Harmful loop (e.g., symptoms worsen): **Roll back** (Owner: Engineering Lead).  
      - Neutral/uncertain loop: **Reword feedback** (Owner: Product Manager) + re-monitor.  
      - Beneficial loop (e.g., help-seeking ↑): **Keep but monitor** (Owner: Clinical Lead).  
    - Loop not detected → Continue quarterly reviews.  

  ---

  ### Procedure Outputs for Proposals  
  *Using the checklist above:*

  #### **Proposal 1: Add "Burnout" category**  
  1. **Step 1**: Yes (new label may reframe unhappiness as burnout).  
  2. **Step 2**: `Self-understanding` + `Semantic drift` (burnout is a evolving cultural term).  
  3. **Step 3**: No (cannot survey all users pre/post) → ⚠️ **Defer to clinical lead**.  
     - *Clinical input needed*: "Burnout may pathologize normal stress. Tradeoff: Earlier help vs. over-reporting. Proceed?"  
  4. **Verdict**: Ship only if clinical lead approves. Add post-release monitoring: Track burnout assignment biweekly; if >10% rise in 8 weeks without user-mix shift, reword feedback.  

  #### **Proposal 2: Lower anxiety threshold (15% more users)**  
  1. **Step 1**: Yes (lower bar may increase self-reporting of mild anxiety).  
  2. **Step 2**: `Self-understanding` + `Institutional` (anxiety label unlocks resources).  
  3. **Step 3**: Yes—A/B test feasible (non-crisis). Split users: 50% get new threshold, 50% old.  
  4. **Step 4**: Yes—Track referral claims in A/B test.  
  5. **Step 5**: Baseline: Current anxiety assignment. Monitor: Assignment rate, symptom scores.  
  6. **Distinguish post-release**:  
     - If assignment ↑ in test group but symptoms stable → **(b) Self-description**.  
     - If assignment ↑ + new user demographics → **(c) User mix**.  
  7. **Verdict**: Ship as A/B test. If self-description loop detected, keep change but reword feedback to avoid over-medicalizing stress.  

  #### **Proposal 3: Show relapse-risk message to users**  
  1. **Step 1**: Yes (message may increase symptom awareness).  
  2. **Step 2**: `Self-understanding` (message may change self-perception).  
  3. **Step 3**: No—A/B test unethical (crisis intervention). Pre/post comparison only.  
     → ⚠️ **Defer to clinical lead with warning**: "High risk: Message may amplify symptoms. Data cannot confirm if (a) or (b)."  
  4. **Least bad option**:  
     - Phased rollout to low-risk users first (e.g., mild relapse scores).  
     - Monitor symptom scores 1/2/4 weeks post-message.  
     - If symptoms rise >15%, roll back immediately (Owner: Engineering Lead).  
  5. **Verdict**: Do not ship without phased rollout + aggressive monitoring. Clinical lead must approve high risk.  

  ---

  ### Limitations of This Procedure  
  **Cannot**:  
  1. Prove causality without long-term studies.  
  2. Distinguish self-description (b) from condition change (a) reliably.  
  3. Capture loops slower than 2 quarters.  
  4. Handle system-level feedback (e.g., category changes affecting app reputation).  

  **False confidence risks**:  
  - Will miss slow semantic drift (e.g., category meaning shifts over years).  
  - May misclassify user-mix shifts as self-description changes.  
  - Over-relies on clinical lead for ethics decisions.  

  ---  
  **Final Checks**:  
  - Engineer documents answers in wiki.  
  - Clinical lead signs off at defer steps.  
  - Monitoring plans enforced via alerting dashboards.
