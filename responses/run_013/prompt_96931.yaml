answer: |-
  The linoleum dust hung thick in the air of the Harbor City Institute for Visual Statistics. It coated the drafting tables, the racks of meticulously filed symbols – little linoleum men carrying sacks (labor), identical stacked blocks (housing), stylized ships (trade) – and the fingers of the three cutters, Anya, Pavel, and Willem, who hunched over their work like monks illuminating manuscripts. At the center of this purposeful industry sat Felix Adler, the transformer, his desk an island of paper amidst the linoleum sea. Spread before him were the latest municipal tables: *Employment & Relief, District 8, Quarter 3, 1936.*

  Director Hahn swept in, radiating his usual zealous energy. "Progress, Felix? The Maritime Workers' Congress convenes next month in Antwerp. They need clear visuals! No jargon, no tangled syntax – pure, objective truth these symbols can carry across any linguistic gulf." He tapped a stack of freshly printed charts destined for Scandinavia. "Proof that the human story *can* be told without the distortions of words."

  Felix nodded, pushing his spectacles up his nose. "Almost ready for the cutters, Director. Just... reconciling the relief figures against the employment decline."

  "Decline?" Hahn peered over his shoulder. "The figures show stability! See?" He pointed to the column labeled *Registered Unemployed*. "Consistent. Steady. A neutral fact."

  Felix’s finger traced a different column: *Municipal Relief Applications – Denied*. "But look here, Director. Denials spiked this quarter. Sharply. While unemployment stays flat."

  Hahn waved a dismissive hand. "Administrative backlog, perhaps. Or stricter verification. Not relevant to the *core fact* of unemployment levels. Our task is the core fact. The pictogram doesn’t lie. One symbol per hundred unemployed men. Count them." He gestured to the wall chart where identical, slightly stooped figures represented the jobless. "Clarity. Universality."

  "But," Felix persisted softly, "if men are being denied relief *while* unemployed... doesn’t that change the picture? It’s not just *unemployed*, it’s... *unemployed and unsupported*."

  "The symbol represents *unemployed*," Hahn stated firmly. "That is the measurable state. *Why* they lack relief is interpretation. Opinion. The very 'metaphysical baggage' we avoid. Our figures are neutral signposts."

  Later, over weak tea in the cramped kitchenette, Anya blew linoleum dust off her bread. "Heard you tangled with Hahn over the District 8 figures." Her voice was low, sympathetic. Pavel and Willem paused their quiet argument over the exact curvature needed for a 'declining birth rate' arrow.

  Felix sighed. "How do we show that the number stayed the same, but the *situation* got worse? That the flat line hides desperation?"

  Pavel grunted. "Bigger symbol for 'unemployed'? But Hahn insists identical size. Counting, not eyeballing."

  "Different colour?" Willem offered. "Red for 'unsupported unemployed'?"

  "And where's the symbol for 'unsupported'?" Anya countered. "We have 'unemployed'. We have 'receiving relief' – that happy little man with the sack. But 'denied relief'? Not in the catalogue. Hahn says it implies a negative action, a judgment. Too... verbal."

  Felix stared into his tea. The wall. It wasn't just about complexity; it was about *absence* and *causality*. The system brilliantly showed what *was*, what *existed* in quantity. But how to show what *wasn't* there (relief that should have been granted)? Or the invisible bureaucratic hand that *caused* the denial? The flat unemployment figure wasn't false, but without the context of the denied relief, it felt like a lie by omission – an omission the pictograms seemed structurally incapable of rectifying.

  The crisis crystallized when the charts came back from proofing. Felix had reluctantly presented only the flat unemployment trend, symbolized by the standard stooped figures. But the Sponsor, Herr Voss from the Mayor's Office, stormed in, brandishing the proof.

  "Hahn! This is useless! Flat? After the relief cuts? The District 8 Alderman is screaming! Anyone with half a brain knows things are *worse*. My contacts in Antwerp will see this as whitewashing!"

  Hahn remained calm, almost serene. "Herr Voss, the statistics *show* stability. Our symbols represent the statistical reality. We present facts, not... atmospherics."

  "Atmospherics?!" Voss slammed the proof down. "It's omission! You need to show the *effect*!"

  "The effect is not statistically quantified in a single, clear variable," Hahn replied. "We show the *state*. Unemployment."

  "Show the denials then! Side-by-side!"

  Felix saw his opening. "We could... juxtapose the unemployment figures with the *denied relief* figures? Same scale? One set of symbols next to the other?"

  Hahn frowned. "Two distinct datasets. Juxtaposition implies... what? Correlation? Causation? That is interpretation. Our symbols stand alone for objective clarity."

  Anya, bold from the corner, spoke up. "Director, what if... a small modification? A diagonal line through the 'unemployed' symbol? To signify... complication?"

  "Modification?!" Hahn looked aghast. "The symbol *is* the concept! Altering it introduces ambiguity! A diagonal line could mean illness, strike action, anything! No. Uniformity is paramount."

  Voss threw his hands up. "Fine! But this chart goes nowhere unless it reflects the *reality on the docks*. Find a way. Or the funding dries up." He stormed out.

  Silence descended, thick with linoleum dust and tension. The cutters looked at Felix. The wall loomed larger than ever. How to depict a negative? How to imply consequence without narrative?

  Felix returned to his desk. The numbers mocked him: Unemployed: 1,200. Relief Denied: 480. The flat line hiding the plunge. He stared at the symbol for 'unemployed' – the simple, stooped figure. Then at the symbol for 'relief' – the little sack. He couldn't show the sack being withheld. He couldn't show the *reason* for the denials.

  His pencil moved almost without conscious thought. He sketched the standard unemployment row: twelve identical stooped figures. Then, beside it, not a separate row, but interwoven. For every five unemployed figures, he drew one with a subtle difference. Not a crossed-out sack – that wasn't a symbol. Instead, he drew the figure... *fainter*. Lighter lines, a suggestion of transparency. And beside this fainter figure, almost like a footnote glyph, he placed the symbol for 'question mark' – a small, non-standard element they sometimes used internally for data verification flags.

  He took it to the cutters. Anya studied it. "Faint figures? And the question mark... it's not approved."

  "It's not *in* the chart legend," Felix argued, his voice tight. "It's... adjacent. An annotation. Like a scale indicator. The faintness... suggests reduction. Diminishment. The question mark... implies an uncertainty around *those specific* unemployed. Not the state itself, but... the circumstance."

  Pavel scratched his head. "Hahn will hate the faintness. Uniformity."

  "But it *is* uniform," Willem countered slowly. "All faint figures are identical. You can still count the faint ones separately from the solid ones. It shows... a subset."

  Anya picked up a fresh square of linoleum and a gouge. "Let's cut one faint man. And the question mark. See how Hahn reacts. Voss will back us if it shows the problem."

  Director Hahn recoiled when he saw the proof. "Felix! This is... contamination! The symbols are compromised! This 'faintness' – it's subjective! And the question mark? It imports verbal uncertainty! It’s a Trojan horse for ambiguity!"

  "But Director," Felix pleaded, exhaustion and defiance warring in him, "doesn't the *flat line itself* become misleading? Doesn't the absence of *any* indication about the denials distort the fact *more* than this... this visual qualification? The question mark isn't language, it's... a visual flag. Like an asterisk."

  "It is a *stain*!" Hahn insisted. "It admits the system's incompleteness! We are building a *self-sufficient* visual language!"

  Voss arrived, took one look at the modified proof, and grunted. "Better. Shows something's off. The faint ones look... ghostly. Unsettling. Good. Print them."

  Hahn looked stricken. He touched the faint symbol on the proof, the small, sharp question mark beside it. It was a tiny crack in his perfect, wordless edifice. He saw his team looking at him, waiting – Anya holding the faint linoleum man, Pavel and Willem poised at their tables. He saw Felix's weary, determined face. He saw Herr Voss's impatient glare.

  He closed his eyes for a moment, breathing in the sharp scent of linoleum. "Use it," he said, his voice barely above a whisper. "For this chart only. It is... a concession. Not a precedent." He turned and walked quickly back to his office, the door closing with a soft, definitive click.

  The team worked silently to finalize the chart. Felix watched Anya ink the faint symbol block. The question mark, tiny yet stark, was cut separately. When pressed onto the chart beside the faint figures, it looked alien, a punctuation mark trespassing in a world meant to be beyond grammar. It held the unspoken weight of the denied relief, the bureaucratic cause, the hidden desperation – not by explaining it, but by visually *pointing* to its absence, its unsettling presence-in-absence. It wasn't language. It was a desperate, smuggled gesture towards the wall that language was built to scale, a visual admission that some silences spoke louder than any symbol. The dust settled on the finished charts, ready for Antwerp, carrying not pure objective truth, but a complex, qualified, faintly haunted picture of Harbor City's docks.
