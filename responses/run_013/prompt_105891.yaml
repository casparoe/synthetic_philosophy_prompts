prompt: |-
  I cover science and ideas for a mid-sized daily, and I keep bumping into the Condorcet jury theorem in op-eds about democracy and in think-tank reports, but I know it best through the polling beat. I know sampling error, house effects, herding, partisan nonresponse, correlated errors from shared assumptions, the difference between a poll being noisy and a poll being biased, and why averaging polls helps when errors are independent but not when everyone is drinking from the same firehose. So: restate the main claims and critiques of the Condorcet jury theorem in that vocabulary, as faithfully as you can. Then give me the residue report. Which parts of the theorem map cleanly onto polling concepts, which parts only map with distortion, and which parts have no counterpart at all in how pollsters and election modelers actually think? For instance, does the theorem's distinction between competence and bias survive translation into margin of error and house effects, or does it collapse? And when the philosophers talk about independence, are they talking about the same thing as when pollsters worry about correlated errors, or is there a gap? I'm especially interested in the case where each voter is more likely than not to be right but the errors are correlated through a shared misinformation environment. Does the theorem have anything to say there that a pollster's vocabulary can't say, and is that a point in the philosophers' favor or just a sign that they're idealizing away the interesting part? Ive been burned by think pieces that just relabel the theorem with polling words, so keep it honest: tell me what gets lost, and dont smuggle in the pollsters assumptions and call it a translation.
reasoning: |-
  Okay, let me tackle this query. The user is a science journalist who understands polling intricacies deeply and wants a no-nonsense translation of the Condorcet jury theorem into polling terms. They're wary of superficial analogies and want to know where the theorem holds up and where it breaks in real-world polling contexts.

  First, I need to recall the theorem's core: binary choices, independent voters with constant competence above 50%, and majority rule improving accuracy as group size increases. Now, how do these map to polling? 

  Competence seems like accuracy probability, but polling has systematic bias (house effects) and noise (margin of error). The theorem treats these as identical - both reduce "competence" - but in reality, bias persists while noise averages out. That's a fundamental mismatch.

  Independence is another big one. Philosophers mean statistical independence - one voter's error doesn't affect another's. But pollsters see correlated errors everywhere: shared methodology, herding, partisan nonresponse. When everyone uses the same likely-voter model, errors compound. The theorem's independence assumption is practically impossible in modern polling.

  The shared misinformation case is telling. The theorem would say correlated errors collapse the group into one "super voter" - making large groups pointless. But pollsters already know this through concepts like herding or correlated errors. The added value? The theorem quantifies exactly how damaging correlation is, which polling models might not explicitly do.

  Where the theorem still offers value is in isolating variables: it shows cleanly why independence matters and how competence thresholds work. But its idealizations - constant competence, no strategic voting, perfect information - ignore dynamics like changing voter preferences or media effects. Pollsters live in that messy reality.

  The residue? Theorem's competence collapses bias and noise; its independence ignores structural correlations; its binary choice misses undecided voters. But its core warning - correlated errors destroy the wisdom of crowds - remains vital. Maybe that's what philosophers offer: a stark mathematical lens showing why our polling fixes often fail.
answer: |-
  Here’s a strict, residue-aware translation of the Condorcet jury theorem (CJT) into polling vocabulary, followed by a breakdown of what maps cleanly, what distorts, and what’s missing entirely. No smuggling—just friction points.

  ---

  ### **Condorcet Jury Theorem: Core Claims (Polling Translation)**
  1.  **Binary Choice:** Voters face a simple yes/no question (e.g., "Will Candidate A win?"). *Polling counterpart:* Polls asking vote intention (binary choice implied).  
  2.  **Constant Competence (p):** Each voter has probability *p* > 0.5 of being "correct" (p=0.51 to p=0.99). *Polling counterpart:* Voter accuracy rate (probability of picking the actual winner).  
  3.  **Independence:** Voter errors are statistically independent. One voter being wrong doesn’t make another more likely to be wrong. *Polling counterpart:* Uncorrelated errors across voters.  
  4.  **Majority Rule:** The group decision is whichever option gets >50% of votes.  
  5.  **The Punchline:**  
      -   As group size (*n*) increases, the probability the majority is correct → 1.  
      -   Larger groups are more accurate than smaller groups or individuals.  

  ---

  ### **Critiques in Polling Vocabulary**  
  1.  **Competence ≠ Constant:**  
      -   *CJT Assumes:* All voters have identical, fixed *p* (e.g., everyone is 55% likely to be right).  
      -   *Polling Reality:* "Competence" varies wildly (knowledge gaps, partisan lenses). **No clean counterpart** to constant *p*. Pollsters model *heterogeneity* (demographic splits, turnout likelihoods), not uniform accuracy.  
  2.  **Independence is Unrealistic:**  
      -   *CJT Assumes:* Errors are independent random variables.  
      -   *Polling Reality:** Errors are **correlated** (shared information environments, media bubbles, partisan messaging). This is the **core critique**. Correlated errors mean:  
          -   **Herding:** Pollsters using similar models/methodologies → errors compound.  
          -   **Shared Assumptions:** Incorrect turnout models or demographic shifts affect *all* voters in a group similarly.  
          -   **Partisan Nonresponse:** If nonresponse is correlated with vote choice (e.g., shy Trump voters), errors aren’t random.  
  3.  **Bias vs. Noise Collapse:**  
      -   *CJT Treats:* Low *p* (e.g., p=0.51) as "low competence."  
      -   *Polling Distinction:* Low *p* could stem from:  
          - **Noise** (random error, reducible by averaging *if* independent) → MOE.  
          - **Bias** (systematic error, e.g., undersampling non-college whites) → house effects.  
      -   **Distortion:** CJT **cannot distinguish** bias from noise. Both reduce *p*. In polling, averaging fixes noise but entrenches bias if shared.  
  4.  **Misinformation Environments (Your Key Case):**  
      -   *CJT Prediction:* If *p* > 0.5 *and* independence holds, larger groups → near-certain accuracy.  
      -   *Reality with Correlation:* Shared misinformation makes errors **dependent**. If misinformation sways 60% of voters (i.e., *p* < 0.4 for those exposed), the majority becomes *more likely to be wrong* as group size grows.  
      -   *Polling Insight:* This is **correlated error on steroids**. CJT mathematically confirms pollsters' fear: correlation destroys the wisdom of crowds. A group exposed to the same flawed info acts like a single error-prone unit, not *n* independent judges.  

  ---

  ### **The Residue Report: What Maps, Distorts, or Vaporizes**  
  | **CJT Concept**       | **Polling Counterpart**                     | **Fidelity**                | **Residue**                                                                 |
  |------------------------|---------------------------------------------|-----------------------------|-----------------------------------------------------------------------------|
  | **Binary Choice**      | Vote intention polls                        | **Clean map**               | Real polls include undecideds/third parties → not purely binary.            |
  | **Competence (p>0.5)** | Voter accuracy probability                  | **Distorts**                | Pollsters see *p* as unstable, heterogeneous. CJT ignores swing voters.    |
  | **Constant p**         | N/A                                         | **No counterpart**          | Pollsters model voter segments with *different* accuracy probabilities.     |
  | **Independence**       | Uncorrelated errors                         | **Theoretical map only**    | Real voters have **structurally correlated errors** (media, methodology). |
  | **Majority Accuracy ↑**| Wisdom of crowds (in theory)                | **Maps ideally, fails IRL** | Only true if independence holds. Correlated errors break it.                |
  | **Large n → Certainty**| Law of Large Numbers (for noise reduction)  | **Distorts**                | LLN reduces *noise*; CJT ignores *bias*, which LLN amplifies if correlated. |

  ---

  ### **Gaps & Philosophers vs. Pollsters**  
  1.  **Independence Gap:**  
      -   Philosophers mean strict **statistical independence** ("my error doesn’t affect yours").  
      -   Pollsters mean **methodological/contextual independence** ("different sampling frames/models").  
      -   **Verdict:** Philosophers expose a **fatal flaw** CJT can't solve. Pollsters know correlated errors exist but lack CJT's math to quantify *how* they destroy convergence. That’s a point for philosophers.  
  2.  **What CJT Misses Entirely:**  
      -   **Undecided Voters:** CJT assumes forced binary choices. Real polls model uncertainty in voter preferences.  
      -   **Strategic Voting:** Voters optimizing against others (not in CJT’s "truth-seeking" model).  
      -   **Dynamic Competence:** *p* changes with events, ads, scandals. CJT is static.  
      -   **Margin of Error:** CJT cares about binary correctness; pollsters care about **magnitude** (e.g., ±3% vs. ±0.5%).  
  3.  **What Pollsters Can’t Borrow:**  
      CJT’s clean convergence proof is useless when errors are correlated. Its value is **diagnostic**: it shows *why* shared biases/herding make large polls fail. Philosophers idealize away the mess, but that idealization reveals *why* the mess matters.  

  ---

  ### **Your Bottom Line**  
  - **Where CJT Holds:** For uncorrelated, binary decisions with homogeneous competence, it mathematically justifies poll-averaging and large samples.  
  - **Where it Cracks:** Correlated errors (shared assumptions, herding, misinformation) collapse CJT’s logic. Here, pollsters' vocabulary (**house effects, correlated errors, partisan nonresponse**) is *more precise* because it addresses real mechanisms.  
  - **Residue Worth Keeping:** CJT’s treatment of independence is a **rigorous warning** against correlated errors. When philosophers say, "With dependence, large groups act like a single voter," they’re giving you a mathematical lens pollsters lack. But they offer no solution—just a stark limit.  

  **TL;DR:** CJT is a perfect sphere in a vacuum; polling is a rusted gearbox. The theorem’s math explains *why* correlated errors break everything, but pollsters already smell the smoke. Don’t let op-eds pretend CJT endorses real-world democracy—its assumptions are the very things modern polling fights.
