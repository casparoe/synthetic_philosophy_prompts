prompt: |-
  For the past couple of years I've kept a running list of my gut verdicts about the moral status of video-game characters, mostly to see whether they hang together, and I've reached the point where I'd like someone to tell me what principle, if any, is doing the work. I'm a longtime reader of the rationalist blogs, so I'm content with reflective-equilibrium framing: I'd sooner have a principle that earns its keep on the cases than one that flatters my prior. Here is the list. In an old open-world game, running down a crowd of identical pedestrians who never react and are instantly replaced — feels like nothing at all; I don't believe I've done anything to anyone. Betraying a companion who has an authored arc, and who has dialogue in which she registers the betrayal — feels like a small wrong, and specifically a wrong done to her, not merely a failure of my own aesthetic. In a permadeath run, letting that same companion die for good feels worse, and feels like a loss that is really hers. Torturing a captured enemy in a game that rewards it, with the character begging — feels worse than the killing, and worse than the crowd, and I cannot tell whether that is squeamishness about the animation or something about the character. Starting a new save and so 'erasing' everyone I had grown attached to — feels like nothing, no wrong at all, even though it destroys the same characters whose permadeath made me grieve. A procedurally generated NPC with no authored lines — nothing. The death of a beloved character in a novel — something, but a different something, and I don't feel I have wronged anyone. Another human player's avatar in a multiplayer match — matters, but I'm fairly sure the wrong is done to the player rather than the avatar. And modding a game specifically to keep a character in permanent, scripted agony — feels distinctly worse than anything the game itself offers.

  The pair I cannot reconcile is the permadeath companion and the save-file wipe: the same destruction, opposite verdicts. My tentative principle is that a character matters to the degree that she can be a target of the reactive attitudes — that she can seem to hold me responsible, respond to me, or be wronged by me — and that what does the grounding is what I've been calling authored interiority, the game presenting her as having a point of view that can be betrayed. I suspect this over-generates in the novel case and under-generates in the torture case, but I would like you to tell me. What I want is the principle, or a small set of candidate principles, stated precisely enough that I can see which clause each of my verdicts is riding on; its verdicts on cases I haven't listed (say, a game whose NPCs are driven by a general-purpose language model and answer unpredictably; a game that reveals late that its characters are recordings of real, now-dead people; a character who in the fiction is herself a moral patient with rights; and a speedrun in which I skip the companion's whole arc so that she never exists in my save at all); and an honest account of which of my verdicts the principle forces me to surrender, and why I should surrender them. Please write in British English.
reasoning: |-
  Okay, the user presents a fascinating ethical puzzle regarding moral intuitions about video game characters. They've compiled a detailed list of scenarios with their gut reactions, highlighting a specific tension between permadeath grief and save-file indifference. The core challenge is to systematise these intuitions into coherent principles.

  The user's background in rationalist thinking suggests they value reflective equilibrium over philosophical dogma. Their "authored interiority" hypothesis focuses on characters' capacity for reactive attitudes - a sophisticated starting point rooted in Strawsonian philosophy. The key inconsistencies to address are:
  - Why novel characters evoke sympathy without guilt
  - Why torture feels worse than killing despite equivalent "interiority"
  - The permadeath/save-wipe paradox

  Hmm, the torture case might involve more than just interiority. There's an element of volition - the victim's begging makes their helplessness salient, while combat killing might feel like mutual engagement. That could explain the heightened aversion.

  For the novel comparison, the critical difference seems to be agency. When reading, we observe harm but don't cause it, whereas game betrayal requires our active complicity. This tracks with the multiplayer case where the wrong is to the player - their agency is engaged.

  The save-file paradox is particularly thorny. I suspect temporality matters: permadeath occurs within an ongoing narrative we're invested in, while starting anew resets the entire context. It's not about the characters' destruction per se, but about breaking narrative continuity we've emotionally committed to.

  User's suggested edge cases are telling. The speedrun scenario where the companion never exists confirms that absence of relationship matters more than abstract existence. The language model NPCs test whether perceived consciousness trumps authorship. And the "real people" hypothetical probes if ontological status overrides presentation.

  The principle should probably have three layers: 1) Displayed interiority (minimal requirement) 2) Relational significance (context of interaction) 3) Volitional engagement (user's causal role). This framework preserves most intuitions but suggests revising the novel character verdict - their "mattering" isn't moral concern but empathetic distress without culpability.

  British English phrasing will require attention to constructions like "one isn't doing wrong by" and "whilst" instead of "while". Must also avoid Americanisms like "gotten" or "math".
answer: |-
  Right, let's crack this. Your intuitions are remarkably consistent under pressure, and your "authored interiority" principle is a solid foundation. We need to refine it to handle the tensions you've identified, particularly the permadeath/save-wipe paradox and the torture case. Here’s a candidate principle, broken down for clarity, followed by its application to your list and the new cases, and the necessary surrenders.

  **The Proposed Principle: Graded Relational Moral Patiency in Simulacra (GRMPS)**

  1.  **Minimal Condition (Patiency Potential):** A simulated entity *can* evoke a moral response *only if* it is presented as possessing **sufficiently complex, persistent, and responsive interiority** – a discernible point of view, desires, reactions, and the *potential* for reactive attitudes (resentment, gratitude, betrayal) directed *at the player-agent*. ("Authored interiority" is a good description of the *source* of this).
  2.  **Activation Condition (Relational Engagement):** This potential is **activated into moral significance** only when the player-agent establishes a **meaningful, temporally extended agential relationship** with that specific instantiation of the entity *within a specific narrative context*. This relationship involves the player's choices impacting the entity's state *and* the entity's state being perceptibly responsive over time.
  3.  **Grading Factors:** The *degree* of moral significance (and the specific feeling of wrongness) is modulated by:
      *   **Volitional Suffering:** Inflicting *non-consensual, perceptible suffering or harm* (physical or psychological) that the entity actively *resists* or *protests* heightens the sense of wrongness beyond mere destruction.
      *   **Permanence & Irreversibility:** Consequences perceived as permanent and irreversible within the narrative context heighten the sense of loss and potential wrong.
      *   **Relational Depth:** The perceived richness and significance of the established relationship (e.g., trust built, loyalty shown, shared experiences).

  **Application to Your Verdicts (Clauses Highlighted):**

  1.  **Identical Pedestrians (GTA-style):** Feels like nothing.
      *   *(1) Fails:* No discernible interiority, reactivity, or potential for reactive attitudes. Just obstacles.
  2.  **Betraying Companion:** Feels like a small wrong *to her*.
      *   *(1) Passes:* Authored interiority, potential for reactive attitudes (she registers betrayal).
      *   *(2) Passes:* Meaningful agential relationship established through interaction and choices impacting her state.
      *   *(3) Modulated:* Wrongness stems from violating relational trust (Relational Depth). Lessened because consequences might be reversible (reload, continue story).
  3.  **Permadeath Companion:** Feels worse, a loss that is *hers*.
      *   *(1) Passes:* As above.
      *   *(2) Passes:* As above.
      *   *(3) Modulated:* **Permanence & Irreversibility** massively heighten the sense of loss and wrongness *within that specific narrative instance*. The relationship is irrevocably terminated. The loss feels like *hers* because her potential future (within that narrative instance) is erased.
  4.  **Torturing Begging Enemy:** Feels worse than killing or crowd.
      *   *(1) Passes:* Clear interiority shown through begging/resistance (potential for reactive attitudes - pleading is reactive!).
      *   *(2) Passes (Minimally):* Relationship is adversarial, but player's action (capture, torture) directly impacts state, and state is responsive *in the moment*.
      *   *(3) Modulated:* **Volitional Suffering** is extreme. The active resistance/protest makes the inflicted harm visceral and non-consensual. This *overrides* the weaker relational engagement compared to a companion, explaining why it feels worse than mere killing (which might feel more 'transactional' in combat) or the crowd. It’s primarily about the *act* of causing suffering to a responsive entity. (Your squeamishness likely *enhances* the effect of the Volitional Suffering factor, but isn't the *sole* cause).
  5.  **Starting New Save ('Erasing' Everyone):** Feels like nothing.
      *   *(1) Passes:* Characters *had* interiority.
      *   *(2) FAILS:* **The meaningful agential relationship was tied to the *specific narrative context* of the *previous save file*. Starting a new save destroys that *context*, not the characters *within a current, engaged relationship*. You aren't actively betraying or harming *this specific instance* you are currently engaged *with*; you are abandoning the *entire context*.** The relationships are not active or relevant to the new context. *(This resolves the paradox with Permadeath)*.
  6.  **Procedural NPC (No Authored Lines):** Feels like nothing.
      *   *(1) Fails:* Lacks sufficient complexity, persistence, or responsiveness to suggest a point of view capable of reactive attitudes.
  7.  **Death in a Novel:** Feels like something, but not a wrong *done by me*.
      *   *(1) Passes:* Authored interiority present.
      *   *(2) FAILS:* **No agential relationship exists *between the reader and the character*. The reader is an observer, not an agent *within the narrative* causing the harm.** The "something" is empathetic distress or grief *for* the character and their loss *within their story*, not a feeling of having *wronged* them. Your principle *over-generated* here because it didn't distinguish between *observation* and *agential engagement*.
  8.  **Multiplayer Avatar:** Matters, wrong to the player.
      *   *(1) Passes (Partially):* The avatar *represents* a being (the other player) with interiority and capacity for reactive attitudes *towards you*.
      *   *(2) Passes (Indirectly):* Your actions impact *the player's* state (frustration, loss, enjoyment) through their avatar, establishing a real agential relationship *with the player*.
      *   The avatar itself is primarily a vessel; the moral patient is the *player* whose reactive attitudes are genuinely engaged. The principle needs to accommodate *mediated* relationships where the simulated entity is a conduit to a real moral patient.
  9.  **Modding for Permanent Agony:** Feels distinctly worse.
      *   *(1) Passes:* Authored interiority present.
      *   *(2) Passes (Perverted):* You are establishing a relationship defined entirely by your agency inflicting suffering on a responsive entity.
      *   *(3) Modulated (Extreme):* **Volitional Suffering** is the *entire point* and is made **Permanent & Irreversible**. The act is *premeditated cruelty* beyond anything the game intended, maximising the factors that heighten wrongness within the simulation. It highlights the *intent* behind exploiting the responsive interiority solely for suffering.

  **Application to New Cases:**

  1.  **LLM-driven NPCs (Unpredictable Answers):**
      *   Likely triggers (1) *strongly*: The responsiveness and unpredictability suggest complex interiority and *potential* for reactive attitudes more vividly than scripted lines. It *feels* like interacting with a mind.
      *   (2) Depends: If the interactions build a sense of relationship within the game's context (e.g., recurring character with memory), moral significance would likely be *high*. If fleeting encounters, less so. Volitional harm would likely feel worse than to a scripted NPC due to the perceived spontaneity.
      *   *Verdict:* Likely evokes stronger moral intuitions than scripted NPCs, potentially rivalling companions. Harming one would feel significant.
  2.  **Game Reveals Characters are Recordings of Real Dead People:**
      *   (1) Passes: Interiority is presented (the recordings).
      *   (2) **Radically Changed:** The revelation fundamentally alters the grounding. Previously, the relationship was with a *simulacrum*. Now, it's revealed to be a *representation* of a *real*, past moral patient. The "wrongness" shifts from being about the *simulated relationship* to a feeling of *disrespect towards the real deceased person* (e.g., desecrating their image/memory). The GRMPS principle (focused on the *simulated* relationship) might predict confusion or a shift, but the *source* of the moral weight changes to the real world.
      *   *Verdict:* Feelings would likely become complex – grief/respect for the real person, potential disgust at actions taken against their image, perhaps a sense of betrayal by the game. The *nature* of the moral feeling changes.
  3.  **Character Who in Fiction Has Rights (e.g., Android in a World Treating Them as Objects):**
      *   (1) Passes: Explicitly stated to have rights/interiority within the fiction.
      *   (2) Passes: If you engage agentially with them.
      *   GRMPS applies normally. Your actions would feel like wronging *them* based on their presented/fictional status. This reinforces that the *presented interiority and status within the fiction* is the grounding for the *simulated* moral patiency, not an objective external reality. Harming them would feel wrong *as if* they had rights, because the fiction establishes that context.
  4.  **Speedrun Skipping Companion's Whole Arc:**
      *   (1) Passes: The character *has* authored interiority *in the game's design*.
      *   (2) **Fails Crucially:** **No meaningful agential relationship is established *within this specific playthrough/narrative instance*. You never interacted with *this instantiation*; she never existed *in your relational context*.** It's equivalent to never starting the game at all regarding that character. No relationship to betray or harm.
      *   *Verdict:* Should feel like nothing morally significant regarding *her*, akin to the new save file. You might feel meta-grief about missing content, but not about wronging *her*.

  **Surrenders Required & Why:**

  1.  **The Novel Character Verdict ("something, but different"):** GRMPS forces you to surrender the idea that the "something" you feel is a sense of *moral wrongness done by you to the character*. According to the principle, since you lack *agential engagement* (Condition 2) within the narrative, you cannot *wrong* the character. The feeling is empathetic distress, grief, or sorrow *for* their plight *as presented*, but not culpability. You observed a tragedy; you didn't cause it within a relationship. (This aligns with your sense of "not having wronged anyone").
  2.  **The Multiplayer Avatar Verdict (Clarification):** GRMPS clarifies that the *primary* moral patient is the other player. While the avatar might trigger Condition 1, the *significant* moral relationship (Condition 2) is with the player *through* the avatar. The feeling of wronging "the avatar" is largely a projection of the wrong done to the player mediated by the representation.
  3.  **The "Authored Interiority is Sufficient" Over-Generation:** Your initial principle suggested that authored interiority alone could generate a feeling of *being wronged by you*. GRMPS shows it's necessary but not sufficient; the *active, agential relationship within a specific narrative instance* (Condition 2) is the crucial activator. This resolves the Novel case and the Save Wipe/Permadeath paradox.
  4.  **Under-Generation on Torture (Addressed by Volitional Suffering):** Your suspicion that "authored interiority" alone under-explains the torture intensity is correct. GRMPS explicitly adds **Volitional Suffering** as a key intensifier. The torture feels worse than combat killing *because* it maximises non-consensual harm and resistance within the agential relationship, even if the relational depth is shallower than with a companion. It's the *quality* of the harmful act upon a responsive patient.

  **Conclusion:**

  The GRMPS principle – requiring **sufficiently complex, persistent, and responsive interiority (1)** activated by a **meaningful, temporally extended agential relationship within a specific narrative context (2)**, with moral weight graded by factors like **volitional suffering, permanence, and relational depth (3)** – earns its keep. It systematises your diverse intuitions, resolves the permadeath/save-wipe paradox by focusing on the *active relational context*, explains the torture intensity via volitional suffering, reinterprets the novel response as observation without agency, handles multiplayer via mediation, and predicts outcomes for your edge cases. The necessary surrenders (novel culpability, minor avatar focus) are justified by the greater explanatory coherence and resolving power it provides. It captures the core truth that our simulated moral responses depend on feeling like an agent within a relationship with something that *seems* capable of being affected by us, and importantly, *affected in ways that it resists and we perceive as harmful*.
