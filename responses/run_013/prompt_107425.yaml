  Here's a pantoum capturing the incommensurability deadlock, set in the mundane modern context of choosing between job offers:

  ### The Folders
  **(A Pantoum)**

  Line 1: **Two folders lie upon the desk: one blue, one grey.**
  Line 2: **The blue one holds a salary that makes the rent seem light.**
  Line 3: **The grey one holds a purpose, meaning, every working day.**
  Line 4: **The blue one adds an hour's drive to morning and to night.**

