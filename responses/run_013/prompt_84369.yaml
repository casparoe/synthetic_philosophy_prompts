prompt: |-
  I chair the steering committee thats standing up a war-crimes tribunal for the old regime, and I need a short written opinion from you before we vote on the statute next week. The fight is the headline count: the draft charges the former defence minister with planning and starting the war itself, and his lawyers say that back when he did it, that wasn't a crime anywhere you could actually be prosecuted for -- we only made aggression an offence after we won. People keep invoking Nuremberg and Tokyo at me, not as a compliment: law fitted to the accused, a bench drawn only from the side that won, our own coalition's militia having shelled more civilians than his army did, and a promise in the peace deal that the man who actually gave the orders walks free. I'm told the line that matters is between inventing a new crime and merely inventing a new court to try an old one, and I'm not sure it holds. So give me a bottom line I can defend in the vote -- keep the count, drop it, or keep it in amended form -- with the reasoning, an honest pass at the best argument aginst whatever you recommend, and what we should do about the immunity we promised. And say when we have to decide, since we're supposed to open in the spring.
reasoning: |-
  Okay, the user chairs a steering committee for a war-crimes tribunal dealing with the old regime. They need a short written opinion before next week's vote on the statute. The main issue is whether to charge the former defense minister with planning and starting the war itself. The defense argues that aggression wasn't a crime when it happened and that they only made it an offense after winning. 

  Hmm, the user mentions comparisons to Nuremberg and Tokyo being used negatively—accusations of victor's justice, biased benches, and their own coalition's militia having committed atrocities. Plus, there's a peace deal promising immunity to the man who gave the orders. The user is unsure about the distinction between inventing a new crime versus creating a new court for an existing crime. They need a bottom line: keep the charge, drop it, amend it, and address the immunity issue. They also need a deadline for the decision since the tribunal is supposed to open in spring.

  First, I need to unpack the legal and ethical challenges here. The core issue is ex post facto law—charging someone for an act that wasn't criminal when committed. The defense is claiming that aggression wasn't prosecutable before their statute made it one. But international law has evolved. Nuremberg prosecuted aggression as a crime against peace, even though it wasn't codified before. The principle from Nuremberg is that some acts are inherently criminal, even without prior written law. That's key here.

  Then there's the victor's justice problem. The tribunal's bench comes only from the winning coalition, which undermines legitimacy. Plus, the user's coalition's militia committed similar or worse atrocities. This hypocrisy could discredit the tribunal. The immunity deal for the higher-up complicates things further—prosecuting the defense minister but not the actual order-giver seems unfair and selective.

  The user needs a defensible position. They might be looking for a way to uphold justice without appearing hypocritical or breaching legal principles. Their deeper concern is likely the tribunal's credibility and long-term acceptance, both domestically and internationally. They might also worry about setting a precedent that could affect future conflicts or peace negotiations.

  Considering the options: Keeping the charge as is risks ex post facto challenges and accusations of hypocrisy. Dropping it avoids those issues but might signal impunity for starting unjust wars. Amending it to reflect a broader crime against peace or tying it to existing international norms could bridge the gap. 

  The immunity deal is tricky. Reneging could damage trust in future negotiations, but upholding it might be seen as unjust. Perhaps a middle ground—amending the charge to focus on conduct during the war that was criminal at the time, like war crimes or crimes against humanity. That shifts focus to acts that were clearly illegal, avoiding the ex post facto problem. 

  The deadline is tight—they need to decide by the vote next week. The tribunal opens in spring, so statutes must be finalized soon to allow preparation. Procrastination isn't an option. 

  Ultimately, the recommendation should balance legal integrity and practical legitimacy. Amending the charge to existing crimes, while publicly explaining the immunity deal as a necessary compromise for peace, might be the most viable path. This approach maintains the tribunal's credibility without overreaching legally.
answer: |-
  Here is a concise legal opinion addressing your core concerns and recommended path forward:

  **Bottom Line Recommendation: Keep the aggression charge, but amend the statute to explicitly ground the offense in the pre-existing customary international law prohibition on wars of aggression as recognized at least since the Nuremberg Charter (1945) and UN Charter (1945). Do *not* rely solely on the tribunal's post-hoc statute. Simultaneously, publicly reaffirm (but do not renegotiate) the immunity deal for the head of state, focusing prosecution of aggression solely on the former Defence Minister.**

  ## Reasoning
  1.  **The Legal Line Holds (with Nuance):** The core distinction – prohibiting the *creation* of new crimes ex post facto versus establishing a *new court* to prosecute *existing* crimes – is sound under international law. The prohibition on aggressive war was crystallized in customary international law long before your conflict, primarily through:
      *   **The Nuremberg Charter & Judgment (1945):** Explicitly defined "Crimes Against Peace" (planning/preparing/initiating/waging aggressive war) and convicted individuals for it. The Nuremberg Tribunal famously rejected the "ex post facto" defense, stating aggressive war was already "illegal" and those who planned/waged it were "committing a crime."
      *   **UN Charter (1945):** Article 2(4) prohibits the "use of force against the territorial integrity or political independence of any state." While primarily binding states, it reinforces the fundamental illegality of aggression.
      *   **Subsequent State Practice & Opinio Juris:** Widespread condemnation of aggression (e.g., Iraq's invasion of Kuwait) and acceptance of the Nuremberg principles demonstrate this was not a novel crime invented *after* your conflict.

  2.  **Addressing Ex Post Facto Concerns:** The key is framing. Your draft statute should **not** read as *creating* the crime. It must **define** the crime of aggression **by referencing its pre-existing status under customary international law** ("recognizing the crime of aggression as defined under customary international law, as reflected in the Nuremberg Charter and Judgment..."). This anchors the charge in established law, mitigating the ex post facto argument.

  3.  **Why Keep the Charge:**
      *   **Core Injustice:** Starting an aggressive war is often the root atrocity enabling all others. Ignoring it undermines the tribunal's purpose and historical record.
      *   **Nuremberg Precedent:** While criticized, Nuremberg established the principle of individual criminal responsibility for aggression. Failing to apply it here, where arguably clearer law exists now, weakens the international legal order.
      *   **Deterrence:** Holding planners accountable specifically for aggression is crucial for future deterrence.
      *   **Legitimacy:** Omitting the crime that started the conflict risks appearing cowardly or politically compromised, potentially damaging the tribunal's legitimacy more than the victor's justice critique.

  ## Best Argument Against This Recommendation (Honest Pass)
  *   **"Victor's Justice" Hypocrisy is Inescapable & Damning:** The core argument against isn't purely legal; it's political and moral. Your coalition's forces committed atrocities (shelling civilians). The bench is solely comprised of your allies/victors. Critically, the *principal perpetrator* (the Head of State) walks free due to *your* peace deal. Prosecuting the Defence Minister alone, especially for the foundational crime, will look like selective, hypocritical scapegoating by the victors. It validates the "law fitted to the accused" critique far more powerfully than any legalistic argument about customary law. This profound lack of even-handedness could irreparably damage the tribunal's perceived legitimacy domestically and internationally, making its judgments appear politically motivated rather than just. It risks fueling resentment and undermining long-term peace.

  ## Addressing the Immunity Promise
  1.  **Do Not Renegotiate or Violate:** Breaking the immunity deal would be a catastrophic breach of faith, damaging future peace negotiations everywhere and inviting immediate challenges to the tribunal's integrity.
  2.  **Acknowledge & Contextualize Publicly:** The Prosecutor and Tribunal President should make clear public statements:
      *   Acknowledging the immunity deal as a painful but necessary compromise to end the bloodshed and save lives.
      *   Emphasizing that the deal binds *this tribunal* regarding the Head of State, but does not preclude charges against others not covered by its specific terms (like the Defence Minister).
      *   Stating that while the Head of State avoids *this* tribunal, his role is part of the historical record, and immunity does not equate to moral absolution.
      *   Focusing the aggression charge on the Defence Minister's *specific, indispensable role* in planning and initiating the war, distinct from the Head of State's ultimate authority.

  ## When You Must Decide
  **The statute must be finalized and adopted *before* the tribunal opens in the Spring. The vote next week on the statute, including the aggression charge in its proposed amended form, is the critical decision point.** Delaying this vote creates uncertainty, hampers prosecution preparation (especially for such a complex charge), and risks pushing the tribunal's opening timeline. **Decide next week.**

  ## Conclusion
  The legal basis for charging aggression exists if framed correctly within customary international law. While the "victor's justice" critique is powerful and the immunity deal is deeply problematic, dropping the charge entirely surrenders a core aspect of accountability and sets a poor precedent. Amending the statute to ground the charge firmly in pre-existing customary law (Nuremberg/UN Charter) is the legally defensible path. Publicly confronting the immunity deal's implications honestly, while adhering to it strictly, is the necessary political counterpart. Proceed with the charge, amended, and the contextualization strategy.
