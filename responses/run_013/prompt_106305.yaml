answer: |-
  (poem)

  This hand begins the other's curve,
  Defines the knuckle, grants it nerve.
  It lifts the pen that gives this one
  Its contour, weight, where it's begun.

  That hand sustains the first's design,
  Traces the lifeline, makes it mine.
  Its pressure shapes the very wrist
  That guides *its* stroke through inked mist.

  **Yet neither hand can touch the sheet,**
  **The empty ground where both must meet.**

  This hand, conjured by its twin's decree,
  Now draws the arm that summons *me*.
  My ink becomes the blood and bone
  Of that which claims me as its own.

  That hand, emerging from my mark,
  Fills in the shadow, finds the dark
  That gives this form its depth and hold,
  A story neither hand has told.

  This hand begins the other's curve.

  *(Commentary)*

  The central, un-indented line acts as the inviolate level: the paper/sheet enabling the loop, stated but unreachable by the hands' reciprocal drawing within the poem's circular structure.
