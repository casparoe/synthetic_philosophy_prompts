prompt: |-
  Two colleagues of mine fell into an argument after a seminar, and I ended up as the only other person at the table. One of them, a historian of nineteenth-century philosophy, had been talking about Henry Sidgwick's long involvement with the Society for Psychical Research — he was its first president, and his circle included figures like Frederic Myers and Edmund Gurney — and she treated it as a straightforward extension of his intellectual character. The other, a contemporary ethicist, thought that reading was too tidy, and what follows is the exchange roughly as it happened.

  (1) The historian said that Sidgwick's psychical research is exactly what one would predict from the author of The Methods of Ethics: a man who had resigned a Trinity fellowship rather than subscribe to doctrinal formulas he could not honestly affirm, applying the same evidential discipline to claims about apparitions, telepathy and survival that he applied to moral claims. On her view, the research programme — the census of hallucinations, the attention to testimony, the refusal to let the desire for a result stand in for a result — is continuous with the rest of his work, and the ethics is left untouched by it.

  (2) The ethicist said that continuity of method is not the interesting question. The interesting question is why these particular questions and not others. He pointed out that Sidgwick's ethical theory famously ends in a dualism of practical reason: the demands of rational egoism and the demands of universal benevolence are both defensible, and nothing in the Methods shows they must coincide in this life. On his reading, psychical research was where Sidgwick went looking for the missing harmony — for a cosmos in which the two standpoints could be reconciled — and that hope, not the method, explains the shape of the programme. He conceded that Sidgwick's evidential standards were never lowered, but said that being rigorous about the evidence is compatible with having a preferred answer.

  (3) She answered that this conflates motive with warrant. Every research programme is started by someone who cares about the answer, and if having a preferred outcome discredited a line of inquiry, we would have to discard most of the history of science. What matters is whether the inquiry was structured so that the preferred answer could fail. She said it plainly could, and did: the results Sidgwick and his colleagues reported were largely negative or inconclusive, and he said so in print.

  (4) He replied that this proves less than she thinks. It shows Sidgwick was honest at the point of reporting, not that the questions were framed neutrally from the start. He claimed the framing gives the preference away — why survival, why telepathy, why the specific hope that mind might not be exhausted by the body? He also put a further point, which is the one I found hardest to assess. On Sidgwick's own utilitarianism, he said, the truth of survival would not be practically idle. If consequences extend beyond death, the expected value of our present actions changes, and so does the weight we should give to things we now treat as terminal. So the question cannot be filed away as a private curiosity with no bearing on the ethics.

  (5) She said that last move gets Sidgwick backwards. His ethics was built to deliver guidance that holds whether or not we survive, and he was explicit that practical reason does not wait on metaphysical discoveries. The fact that survival would alter a consequentialist calculus is a fact about a calculus he did not take himself to be running on that question. She also said that if anything, the negative outcome is evidence for her reading: a man in search of consolation would have found some.

  (6) He said that is a psychological conjecture, not an argument, and that a person can want a conclusion for decades without manufacturing it, and still have wanted it. She said that is true, and that it is also true that wanting it leaves no trace in the argument, which was her original point.

  I have no stake in either side and I could not referee this myself. Please adjudicate it move by move: for each of the six moves, say whether it is right, mistaken, or partly both, and why. I am especially interested in (a) whether the distinction between a research programme having a preferred outcome and that outcome shaping the programme is being used legitimately here, and (b) whether the ethicist's claim about survival changing the utilitarian calculus is a serious point about Sidgwick or a category error about what his ethics was for. Say what, if anything, both of them are missing, and identify which parts of the dispute turn on matters that are settled among people who know the period and which turn on genuinely contested interpretations, so that I am not left thinking a disputed reading is the consensus. Please write in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a detailed philosophical debate between two colleagues about Henry Sidgwick's psychical research and its relationship to his ethics, requesting a move-by-move adjudication with specific focus points.

  First, I need to unpack the core disagreement: the historian sees methodological continuity between Sidgwick's ethics and psychical research, while the ethicist sees a substantive motivational link to his unresolved dualism of practical reason. The user specifically wants analysis of (a) the preferred outcome vs. programme shaping distinction, and (b) whether survival's impact on utilitarian calculus is valid or a category error.

  For move (1): The historian's methodological continuity argument holds well. Sidgwick's resignation from Trinity and consistent evidential rigor support this. But she slightly overstates "untouched" ethics - the research's existence implies some relevance, even if indirect.

  For move (2): The ethicist correctly identifies Sidgwick's dualism as motivation, but risks overstatement. His point about rigor coexisting with preference is valid, though "framing gives preference away" needs evidence. The survival-utilitarianism point is significant but requires nuance - Sidgwick's ethics was designed to function without metaphysical certainty.

  Move (3) is strong: the historian rightly separates motive from warrant and notes negative outcomes as evidence of integrity. Her science history analogy effectively counters the "preferred outcome invalidates research" claim.

  Move (4) is weaker: the ethicist's framing criticism needs textual support. The utilitarianism-survival point has merit but overstates Sidgwick's position - he explicitly separated practical ethics from metaphysical proofs.

  Move (5) is the historian's strongest: she correctly reverses the burden of proof regarding ethics and metaphysics, and turns negative results into supporting evidence. Her reading aligns with Sidgwick's own writings on practical reason.

  Move (6) sees both partially right but talking past each other: the ethicist correctly notes persistent motivation doesn't require fabrication, while the historian maintains methodological integrity.

  On the user's specific queries:
  (a) The preferred outcome/programme shaping distinction is used legitimately but imperfectly - the ethicist conflates them while the historian oversimplifies the motivational aspect.
  (b) The survival-calculus point is conceptually serious but becomes a category error when implying Sidgwick's ethics depended on it.

  The main gap is Sidgwick's own writings on the relationship between ethics and psychical research. The dispute involves both settled methodological consensus (his evidential rigor) and legitimately contested interpretations (the depth of motivation from dualism). Victorian intellectual context is crucial - psychical research wasn't marginal then as now.
answer: |-
  Here is a move-by-move adjudication of the dispute, addressing your specific queries (a) and (b), identifying gaps, and clarifying the status of interpretations within Sidgwick scholarship. I'll use British English throughout.

  **Overall Context:** The core disagreement centres on whether Sidgwick's psychical research (PSR) was primarily a *methodological* extension of his ethics (Historian) or a *motivational* quest driven by the unresolved "dualism of practical reason" in his ethics (Ethicist). Both readings have scholarly support, making some aspects genuinely contested.

  **(1) Historian’s Opening (Methodological Continuity)**
  *   **Assessment: Largely Right, but slightly overstates "untouched".**
  *   **Why:** She correctly identifies Sidgwick’s profound commitment to evidential rigour, intellectual honesty (resigning fellowship), and methodological discipline as a core character trait permeating *both* ethics and PSR. The emphasis on testimony, large-scale surveys (census), and resisting wishful thinking are indeed hallmarks of his approach in both domains.
  *   **Gap:** Saying the ethics is "left untouched" is too strong. While PSR didn't *change* the *arguments* within *Methods*, its very *existence* suggests Sidgwick believed answers to metaphysical questions *might* have *some* bearing on ethics or the human condition, even if his ethical system was designed to function without them. It implies a perceived *potential* relevance.
  *   **Scholarly Status:** The characterisation of Sidgwick's intellectual integrity and methodological rigour as consistent across his work is widely accepted and well-documented (e.g., Schultz’s biography). The claim that his ethics *as presented in Methods* doesn't *depend* on PSR findings is also standard.

  **(2) Ethicist’s Response (Motivation: Dualism & Preferred Answer)**
  *   **Assessment: Partly Both (Insightful on motivation, overstates on framing/impact, serious point on calculus).**
  *   **Why:** 
      *   **Insightful:** He astutely identifies the "dualism of practical reason" (the unresolved conflict between egoism and utilitarianism) as a profound personal and intellectual crisis for Sidgwick. The suggestion that PSR was motivated by a hope (even if unfulfilled) to find a cosmic harmony reconciling this dualism (e.g., via evidence of post-mortem rewards/punishments ensuring virtue/happiness coincide) is a powerful and plausible *interpretation* supported by Sidgwick’s private letters and some scholars (e.g., Gauld, Parfit). His point that rigorous methodology is compatible with a "preferred answer" is correct.
      *   **Overstates:** Claiming "the framing gives the preference away" needs more nuance. While the *choice* of questions (survival, telepathy) undoubtedly reflects deep personal interest and hope, framing a large-scale, empirically based "census of hallucinations" aimed at establishing base rates for *spontaneous* phenomena *before* investigating potentially significant ones *is* a methodologically sound way to approach anomalous claims neutrally. The *specific hope* doesn't *necessarily* dictate a *biased framing* if the methodology allows falsification.
      *   **Serious Point (Re: Calculus):** His point about survival altering utilitarian calculus is **conceptually serious and relevant to Sidgwick**. If consequences extend beyond death (e.g., post-mortem rewards/punishments affecting aggregate happiness), this *would* materially impact the expected utility calculations of a consequentialist like Sidgwick. Sidgwick *was* concerned with the ultimate justification of morality, which the dualism threatened. Seeking evidence that could potentially resolve it *is* relevant to his ethical project, even if *Methods* itself brackets the question. It’s not *just* a "private curiosity".
  *   **Scholarly Status:** The motivational link between the dualism and PSR is a major and **genuinely contested interpretation**. Scholars like Schultz emphasise Sidgwick's genuine scientific curiosity and broad interest in the "deepest problems", downplaying the *dominance* of the dualism motive. Others (like Gauld, Parfit) give it central place. The point about calculus impact is logical and acknowledged within scholarship as a potential *reason* for Sidgwick's *interest*, though not as a *flaw* in *Methods*' structure.

  **(3) Historian’s Rebuttal (Motive vs. Warrant, Negative Results)**
  *   **Assessment: Strong and Largely Right.**
  *   **Why:** She effectively distinguishes between the *motive* for starting research (which often involves a hypothesis or hope) and the *warrant* of the research itself (its structure and ability to yield negative results). Her analogy to the history of science is apt – many major discoveries began with strong hopes or hypotheses. Crucially, she points to the *actual outcome*: Sidgwick consistently reported *negative or inconclusive* results publicly (e.g., his final address to the SPR). This is powerful evidence that the methodology *was* structured to allow failure and that Sidgwick adhered to his evidential standards in reporting, regardless of his hopes. Her point that a "man in search of consolation" might have found/made some is a valid counter to the strongest version of the Ethicist's motivation claim.
  *   **Gap:** While devastating against the claim that Sidgwick *compromised* his standards, it doesn't fully negate the Ethicist's point about the *initial choice* of questions being driven by a deep-seated *hope* linked to the dualism, nor the *potential* relevance of a positive finding to the *justification* of ethics (even if not its immediate practical guidance).
  *   **Scholarly Status:** Sidgwick's honesty in reporting negative results and the methodological rigour of the early SPR under his leadership (e.g., the census) are **well-documented and settled facts**.

  **(4) Ethicist’s Counter (Framing Bias, Calculus Impact Revisited)**
  *   **Assessment: Partly Both (Weak on framing, Stronger on calculus relevance).**
  *   **Why:** 
      *   **Framing Bias:** His claim that the framing inherently reveals bias ("why survival, why telepathy?") is **weak and potentially mistaken**. Choosing to investigate a domain where one has a strong interest/hope is not *inherently* biasing the *methodology* of the investigation itself. Sidgwick chose to investigate phenomena that were widely reported and seemed amenable (in principle) to empirical scrutiny. The SPR's methods aimed for objectivity *despite* the personal interests of its founders. His point needs evidence of *actual methodological skew* due to preference, which the negative results undermine.
      *   **Calculus Impact:** He effectively reiterates the **serious point** that proving survival *would* have tangible consequences for a consequentialist ethical calculus concerning the *ultimate* coincidence of duty and happiness. This makes it hard to dismiss purely as "idle curiosity" unrelated to his ethical concerns. It *could* (in theory) resolve the dualism.
      *   **Category Error? (Addressing Query b):** This is **not a category error** regarding Sidgwick's ethics. Sidgwick *was* a utilitarian concerned with *maximising happiness*. If the scope of consequences extends beyond death, the calculus must account for it. Sidgwick’s ethics *in practice* was designed for *this life* precisely because survival couldn't be proven, making it a *practical necessity* to bracket it, not a *theoretical denial* of its potential relevance. The ethicist correctly identifies a *theoretical* implication Sidgwick himself grappled with.
  *   **Scholarly Status:** Accusations of *inherent* bias in the SPR's framing due to member hopes are **contested and generally seen as overstated** by historians of the SPR who focus on its methodology. The *potential* relevance of survival to resolving the dualism and impacting consequentialism is **acknowledged within Sidgwick scholarship** as part of understanding his motivations and the *limits* of *Methods*' resolution.

  **(5) Historian’s Final Rebuttal (Ethics Independent, Negative as Evidence)**
  *   **Assessment: Very Strong and Largely Right.**
  *   **Why:** 
      *   **Independence of Ethics:** She is **absolutely correct** that Sidgwick designed his ethics in *Methods* to provide practical guidance *without* relying on unprovable metaphysical claims like survival. He explicitly argued that practical reason must proceed on the basis of the known world. The structure of his utilitarianism, intuitionism, and egoism discussion operates *within* this life. The *potential* impact of survival on calculus is real, but Sidgwick consciously built his system *not to require it*.
      *   **Negative Results as Evidence:** Her point that the negative outcome *supports* her reading (a truly consoled seeker might have distorted results) is a **powerful and valid argument**. Sidgwick's public acknowledgment of failure, despite decades of effort driven by deep personal hope, is strong evidence for the supremacy of his evidential standards over his desires.
  *   **Gap:** While establishing the *functional independence* of his ethical *system*, it doesn't fully engage with the *psychological* depth of the dualism as a motivator for seeking *any* potential resolution, even if the ethics was built to function without it.
  *   **Scholarly Status:** Sidgwick's insistence that ethics must be practical and not wait on metaphysics is **clearly stated in *Methods*** and is a **settled point** of his philosophy. His personal despair over the dualism and negative PSR results is also **well-established** via letters and memoirs.

  **(6) Closing Exchange (Wants vs. Arguments)**
  *   **Assessment: Both Partly Right.**
  *   **Why:** 
      *   **Ethicist:** He is right that a person can desperately want a conclusion for decades without fabricating it, and that this persistent desire is a significant biographical fact. Sidgwick’s hope (tied to the dualism) was clearly profound and long-lasting.
      *   **Historian:** She is right that Sidgwick’s *published arguments and reported results* in PSR show no trace of his personal hopes compromising the evidential standards or conclusions. Her "original point" about the separation of warrant and motive in the *conduct and reporting* of the research stands firm.
  *   **Scholarly Status:** Sidgwick’s profound personal desire for evidence of survival/harmony is **well-documented** (letters, memoirs). His scrupulous honesty in reporting negative results is equally **well-documented and uncontested**.

  **Summary Adjudication & Answers to Specific Queries:**

  *   **(a) Preferred Outcome vs. Programme Shaping:** The distinction is **used legitimately by the Historian, but imperfectly handled by the Ethicist.**
      *   The Historian correctly insists that having a preferred outcome doesn't invalidate research *if* the methodology allows falsification and is adhered to (as Sidgwick's was). The negative results prove this.
      *   The Ethicist conflates the *existence* of a preferred outcome/hope (which Sidgwick undeniably had) with the claim that it *shaped the programme* in a way that biased outcomes *despite* the methodology. He provides no evidence for actual biasing *within* the programme's conduct/reporting, and the negative results count heavily against it. His stronger point is that the *choice* of research domain was *motivated* by the hope linked to the dualism.
  *   **(b) Survival Changing Calculus:** This is a **serious and relevant point about Sidgwick**, **not a category error.** Sidgwick’s utilitarian calculus is fundamentally concerned with maximising happiness. If consequences extend beyond death, this logically affects the calculation. Sidgwick knew this. His ethics was *built* to function *without* needing this knowledge because it was unprovable, but the *theoretical possibility* was highly relevant to his search for a rational foundation for morality that resolved the dualism. The Ethicist is right that it couldn't be dismissed as mere "private curiosity" with no *potential* bearing on his deepest ethical concerns.

  **What Both Are Missing:**
  1.  **The Broader Victorian Context:** PSR, while fringe *now*, was seen by many serious Victorian intellectuals (including scientists like Rayleigh, Lodge, and Crookes) as a legitimate, even cutting-edge, attempt to apply scientific methods to profound questions of mind, matter, and potential transcendence, reflecting crises in faith and materialism. Sidgwick’s involvement wasn't *just* about his dualism or methodology; it was part of this wider cultural/scientific moment.
  2.  **Sidgwick’s Own Nuance:** Sidgwick was complex. He *did* hope PSR might resolve the dualism, *and* he was rigorously scientific, *and* his ethics was designed to work regardless. He held these threads in tension. Reducing it solely to either "just methodology" or "just motivated by dualism" oversimplifies. The *Methods* ethics stands independently, *but* the *quest* for PSR was deeply intertwined with his personal philosophical anxieties stemming *from* that ethics.
  3.  **The Scope of "Ethics":** The Historian focuses narrowly on *The Methods of Ethics* as a self-contained system. The Ethicist focuses on the *justification* of ethics (resolving the dualism) which troubled Sidgwick deeply. Sidgwick saw these as connected parts of the larger philosophical enterprise. PSR speaks more to the latter.

  **Disputed vs. Settled:**
  *   **Settled:** Sidgwick's intellectual integrity, methodological rigour in both ethics and PSR, his adherence to evidence despite personal hopes (shown by negative reporting), and his design of *Methods* to provide practical guidance independent of unprovable metaphysics.
  *   **Genuinely Contested:** The *primary* motivation for his deep involvement in PSR (scientific curiosity vs. desperate hope for resolving the dualism) and the *extent* to which the dualism crisis *drove* the specific shape and persistence of his PSR work. Scholars continue to debate the relative weight of these factors. Neither colleague's view represents a definitive consensus; both capture aspects of the truth.
