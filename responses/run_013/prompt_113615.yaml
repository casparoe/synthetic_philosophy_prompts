prompt: |-
  You are a careful reader of nineteenth-century naturalist prose, and I need help with a passage I find genuinely difficult rather than merely old-fashioned. Before you settle on a reading, brainstorm two or three competing ways of taking the passage, then argue for one. Work from the sentences themselves; I don't need a report on the scholarly literature, and I'd rather you not give me citations or a reading list — if you attach a label to an interpretation, make clear that the label is your own.

  The text is from chapter 4 of Darwin's *The Descent of Man*, the chapter on the moral sense:

  "It may be well first to premise that I do not wish to maintain that any strictly social animal, if its intellectual faculties were to become as active and as highly developed as in man, would acquire exactly the same moral sense as ours. In the same manner as various animals have some sense of beauty, though they admire widely different objects, so they might have a sense of right and wrong, though led by it to follow widely different lines of conduct. If, for instance, to take an extreme case, men were reared under precisely the same conditions as hive-bees, there can hardly be a doubt that our unmarried females would, like the worker-bees, think it a sacred duty to kill their brothers, and mothers would strive to kill their fertile daughters; and no one would think of interfering. Nevertheless, the bee, or any other social animal, would gain in our supposed case, as it appears to me, some feeling of right or wrong, or a conscience. For each individual would have an inward sense of possessing certain stronger or more enduring instincts, and others less strong or enduring; so that there would often be a struggle as to which impulse should be followed; and satisfaction, dissatisfaction, or even misery would be felt, as past impressions were compared during their incessant passage through the mind."

  My difficulty is that this seems to describe something quite different from what the chapter announces at its opening, where conscience is "that short but imperious word ought" and leads a man "without a moment's hesitation to risk his life for that of a fellow-creature." Here the moral sense looks like a felt ranking of competing instincts — a registration of which impulse is more enduring — rather than a judgment that some course of action is right. Please help me with three things: what the hive-bee counterfactual is doing in the argument, given that Darwin concedes the resulting conscience would endorse conduct we would call monstrous; whether the "inward sense of possessing certain stronger or more enduring instincts" can really be the same thing as the imperious "ought," or whether two different notions of conscience are being run together; and if they are two notions, which of them his account of the social instincts is actually equipped to deliver. Where the passage is silent, say so, and say what the silence costs the argument.
