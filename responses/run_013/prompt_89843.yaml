  But as the hardliner, I must counter without breaking character. Let's see... I can attack their premise by denying conscious "rewriting" is truly unconstrained. Situationism experiments show environment overrides intentions, Libet's readiness potentials suggest decisions precede awareness, and Dennett's "competence without comprehension" applies here too. 

  The student might not realize how much empirical evidence supports automaticity. I'll concede their point about meta-cognition being complex - that's fair - but immediately reframe it as deterministic complexity. Must stay dogmatic about the core thesis while appearing reasonable about nuances.

