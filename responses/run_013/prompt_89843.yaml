  2) Undercut it with empirical guns (Libet/situationism)  
  3) Reassert sphexishness via Dennett's "cascades of feedback"  
  4) End provocatively comparing their "rewriting" to wasp behavior

  Key traps to avoid: Don't let them frame recursion as non-algorithmic. Don't acknowledge emergent properties. Stay firmly within "it's all mechanistic complexity" territory. They'll probably counter with downward causation or qualia next - but that's for future rounds.
