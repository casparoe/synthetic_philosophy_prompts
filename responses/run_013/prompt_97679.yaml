  The concurrent/residual distinction is crucial here. I'll define these clearly: concurrent being active hypocrisy (blaming while doing the same thing), residual being past hypocrisy (blaming after reform). The three test cases will examine this distinction: the reformed wrongdoer, the non-participant who benefits from the system, and the representative blamer from a complicit group.

