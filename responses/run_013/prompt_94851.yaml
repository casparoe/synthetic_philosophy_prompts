  ### Design of the Epistemic Ladder Game

  **Core Structure**: Participants receive private, noisy signals about a numerical state and repeatedly guess whether it is "high" (≥50) or "low" (<50) across multiple rounds. They then choose a "claim level" (0–3) representing escalating epistemic assertions about their guess. Payoffs reward correct guesses and appropriately claimed levels but penalize over-claiming (claiming a level beyond what their signal entitles them to) and under-claiming (stopping short of their entitlement). The key insight emerges as participants see that higher claim levels require more extreme signals, creating a fixed ceiling on attainable knowledge levels regardless of confidence.

  **State Space and Signals**:
  - **State**: An integer from 0 to 100 (inclusive), drawn uniformly at random each round.
  - **Signal**: For a true state `s`, each participant receives `s + e`, where `e` is an integer error uniformly drawn from {−10, −9, ..., 9, 10}. Signals are clipped to [0, 100].
  - **Example**: If the true state is 55, a participant might receive signals like 50, 55, or 60.

  **Claim Levels and Meaning** (explained simply to participants):
  - **Level 0**: "I think it’s high/low." (No knowledge claim)  
  - **Level 1**: "I know it’s high/low."  
  - **Level 2**: "I know that I know it’s high/low."  
  - **Level 3**: "I know that I know that I know it’s high/low."  

  **Entitlement Rules** (computed by facilitator; *not* told to participants):  
  A participant is **entitled** to claim level `L` only if their signal meets these thresholds for their guess (high/low):  
  | Guess | Level 1         | Level 2         | Level 3         |
  |-------|-----------------|-----------------|-----------------|
  | High  | Signal ≥ 60     | Signal ≥ 70     | Signal ≥ 80     |
  | Low   | Signal ≤ 40     | Signal ≤ 30     | Signal ≤ 20     |

  *Why these thresholds?*  
  - **Level 1**: Signal guarantees the state is truly high/low (e.g., signal ≥60 implies state ≥50).  
  - **Level 2**: Signal guarantees that in all possible states (given the signal), the participant would be entitled to Level 1.  
  - **Level 3**: Signal guarantees entitlement to Level 2 in all possible states.  
  This creates a "ladder" where each level requires stronger evidence (more extreme signals) than the last. The ceiling arises because signals near 50 cannot support high levels.

  ---

  ### 1. Rules for Facilitator  
  **Materials**:  
  - Whiteboard (to display true state after each round).  
  - Index cards (one per participant per round) for signals.  
  - Pen/paper for participants to record guesses/claims.  
  - Printed facilitator cheat sheet (entitlement thresholds and scoring).  

  **Prep** (5 min before start):  
  - Write claim levels (0–3) and their meanings on the board.  
  - Prepare a bag/box with numbers 0–100 for state draws.  

  **Per Round** (≤5 min/round; 6 rounds total):  
  1. **Draw State**: Randomly pick a state (0–100) and note it secretly.  
  2. **Generate Signals**: For each participant, draw error `e` from {−10, ..., 10}, compute `signal = state + e`, clip to [0,100], and write on index cards.  
  3. **Distribute Signals**: Hand cards face down. Participants keep signals private.  
  4. **Guess and Claim**: Each participant:  
     - **Guesses** "high" (≥50) or "low" (<50).  
     - **Claims a level** (0, 1, 2, or 3).  
     Write guesses/claims on paper.  
  5. **Reveal State**: Display true state on board.  
  6. **Score**: Use cheat sheet (below) to score each participant. Annotate a leaderboard.  

  **Rounds**: 6 rounds (allows patterns to emerge; ~30 min).  

  ---

  ### 2. Payoff Scheme  
  **Scoring per Round**:  
  - **Correct guess (base reward)**: +10 points.  
  - **Bonus for claimed level `L` (only if entitled to `L`)**: +5 × `L` points.  
  - **No penalty for incorrect guesses or claims**.  

  **Example**:  
  - State = 65, signal = 68 (entitled to Level 1 for "high", not higher).  
  - Claim Level 1 (correct guess + entitled): 10 + (5×1) = 15.  
  - Claim Level 2 (correct guess but not entitled): 10 + 0 = 10.  
  - Claim Level 0 (under-claiming): 10 + 0 = 10 (missed bonus).  

  **Why These Numbers?**  
  - **Base reward (10)**: Ensures participation even at Level 0.  
  - **Bonus (5×L)**: Incentivizes climbing the ladder (Level 2 gives double Level 1), but over-claiming forfeits bonus. Under-claiming leaves money on the table (e.g., claiming Level 1 when entitled to Level 2 yields 15 vs. 20).  
  - **No penalties**: Avoids fear-driven under-claiming; opportunity cost (forfeited bonus) suffices to punish mistakes.  

  **Facilitator Cheat Sheet (Entitlement & Scoring)**:  
  | Condition          | Bonus for Claimed Level `L` |  
  |--------------------|-------------------------------|  
  | Correct guess + entitled to `L` | +5×`L` |  
  | Correct guess + not entitled to `L` | +0 |  
  | Incorrect guess     | 0 (no bonus) |  

  **Entitlement Thresholds (Quick Reference)**:  
  - **High guess**: L1 if signal≥60, L2 if≥70, L3 if≥80.  
  - **Low guess**: L1 if signal≤40, L2 if≤30, L3 if≤20.  

  ---

  ### 3. Timeline (75 Minutes Total)  
  - **0:00–0:10** (10 min): **Setup**  
    - Explain rules (state 0–100, signal = state + noise, guess high/low, claim levels 0–3).  
    - Clarify: "Your signal is private. Claim levels are about your certainty in your guess."  
  - **0:10–0:40** (30 min): **Game Rounds 1–6**  
    - Repeat: State draw → signal distribution → guess/claim → state reveal → scoring.  
    - After Round 3: Pause. Ask, "What patterns are you noticing in scores?" (Do *not* explain yet).  
  - **0:40–0:60** (20 min): **Debrief** (see section 4).  
  - **0:60–0:70** (10 min): **Discussion**  
    - "When did you feel confident but got penalized? Why?"  
    - "Could you climb higher with better signals? Why/why not?"  
  - **0:70–0:75** (5 min): **Wrap-up**  
    - Summarize philosophical implications (section 4).  

  ---

  ### 4. Debrief: Mapping Activity to Philosophy  
  After Round 6, use whiteboard to reconstruct:  
  - **The Ladder’s Ceiling**:  
    - Plot signals (x-axis) vs. max entitled level (y-axis) from rounds.  
    - Point: "Level 3 requires signals ≤20 or ≥80—way stricter than Level 1 (≤40 or ≥60). Each level *strictly shrinks* the set of signals that support it."  
    - **Why a ceiling?** "Your signal could have come from a nearby state where the fact fails. E.g., signal=65 suggests state≈65, but it could be from state=55 (where you *wouldn’t* know it’s high). Nothing in the signal rules this out, so you can’t know you know."  
    - **Fixed by noise, not confidence**: "The ceiling depends on the noise range (±10). Sharper reports (smaller noise) might raise it, but *no* noise would be needed for infinite climbing—which never happens with fallible evidence."  
  - **Confidence vs. Entitlement**:  
    - Use an example where someone claimed Level 2 with signal=68 (state=65).  
    - "You were right (state≥50), and felt sure. But your signal=68 *could* have come from state=58 (where state<60, so you *wouldn’t* be entitled to Level 1). So you weren’t entitled to Level 2."  
  - **"I Really Did Know!" Moments**:  
    - "When you claimed Level 1 with signal=62 (state=60), you *did* know it was high. But you couldn’t claim Level 2 because you couldn’t *know* you knew—the same signal might have come from state=52, where you’d *not* know (state=52 is high, but your signal could be 52, and you’d have the same uncertainty)."  
  - **General Implication**: "No interesting self-knowledge (e.g., 'I know X') is *always* knowable when true. There are truths about your mind (like whether you know X) that you can't always access."  

  ---

  ### 5. Predictable Problems and Solutions  
  - **Problem 1: Treating as Risk-Tolerance Game**  
    - *Symptoms*: Participants claim Level 3 constantly, ignoring signals.  
    - *Solution*: After Round 2, remind: "This is about what your signal *entitles* you to claim, not guts. Watch the scores." Use leaderboard to show over-claimers falling behind.  
  - **Problem 2: Dismissing as Artifact of Numbers**  
    - *Symptoms*: "If signals were exact, I’d climb forever!"  
    - *Solution*: In debrief, stress: "Exact signals would require infallible evidence, which we never have. The takeaway is that *any* noise creates a ceiling—the ceiling height is adjustable, but its existence isn’t."  
  - **Problem 3: Confusion About Entitlement**  
    - *Symptoms*: "Why isn’t my correct guess enough for Level 1?"  
    - *Solution*: Use a signal-state mismatch (e.g., signal=55, state=50) to show: "Your guess was right, but your signal didn’t *guarantee* it (state=45 would give similar signals)."  
  - **Problem 4: Under-Claiming Dominates**  
    - *Symptoms*: Everyone claims Level 0 or 1.  
    - *Solution*: Highlight a player who claimed Level 2 appropriately and earned 20 points vs. 10 for Level 0. Emphasize opportunity cost.  

  ---

  ### 6. What the Game Cannot Reproduce  
  **The Missing Element**: The game cannot fully replicate the *internal, first-person aspect* of epistemic justification. In the activity, entitlement is computed externally (by the facilitator) using predefined thresholds. But in real self-knowledge, the agent must *internally assess* whether their evidence meets justificatory standards. This assessment itself could be fallible, creating regress ("Do I *know* that I know, or just believe it?"). The game sidesteps this by outsourcing the standard, whereas real agents grapple with it subjectively.  

  **Why It’s Left Out**: Games need clear, objective scoring. Subjective justification would require participants to introspect or debate standards, which is infeasible in a timed exercise. Thus, you must verbally emphasize: "In life, you set your own thresholds for 'knowing'—but the same structural limits apply. Your confidence doesn’t control whether you *truly* meet those thresholds."  

  ---  
  **Final Notes**: This design embeds epistemology in visceral choices, letting participants *experience* the gap between truth and knowability. By Round 4, the ceiling effect emerges organically, and the debrief ties it to the fragility of self-knowledge. All materials fit on one cheat sheet, and rounds run quickly with minimal setup.
