prompt: |-
  I'm three weeks into a small reading group on Augustine's two books on lying, and the guy who runs it keeps summing the whole thing up as "so you can never say anything false, ever," which I'm fairly sure is not the view, and I want one worked case to show why. So: build me a single scene, ordinary life (a shared office, a house, a group of friends -- no martyrs, no heretics, nobody hiding a fugitive from soldiers), in which at least three people say things about the same fact and come out three different ways on Augustine's view: one says something false and isn't lying; one says something true and is lying; one tells a lie for a good end and is still sinning, since I gather he doesn't budge on that. It has to be one scene rather than three seperate vignettes stapled together, and the falsity of the words and the state of the speaker's mind have to cut across each other, so a reader can see that neither the falseness nor the damage done is what's doing the work -- the line I keep coming back to is that "from the sense of his own mind, not from the verity or falsity of the things themselves, is he to be judged to lie or not to lie." If you can also fold in somebody who's just repeating what they were wrongly told, and somebody who's joking, without it turning into a checklist, please do; I noticed he waves jokes aside as never having been lies at all, on the grounds that the tone gives the game away, and I want to see how much weight that can bear.

  Then the part I actually need. After the scene, go utterance by utterance and show why the theory lands where it does -- don't just tag each one "lie" or "not a lie." Tell me which single feature of the case is doing all the work, and what happens when I take it away (the joke lands flat and everyone takes it straight; the person who was misinformed had every reason to check). Rank the lies in the scene against each other, since he plainly thinks some lies are worse than others depending on what they're for, and say which he'd call worst and why. And finish with the strongest move available to someone who actually likes his view -- how would they attack the case? -- and be honest about whether it survives that, or whether I've built it in a way that quietly assumes the answer. I don't need page numbers or anything, just the argument.
