          - Take the other team's final row (after move4) and recode it by reading right to left.
          - Then, apply move3 and move4 to that recoded row (using their own team's rules for breaking ties) and write down the new row.
          - Then, read that new row right to left again (to get back to the original orientation) and compare it to their own team's original result (after move4).

     They will find that they get the other team's result! 

     This shows that the two patterns are not representation-invariant individually, but together they form a consistent pair under the recoding.

     We then explain in the debrief that the recoding round shows that the two different patterns are actually related by a symmetry (reversal).

     Alternatively, we could have chosen a recoding that breaks one of the patterns, but in this case, it didn't break.

     Given the complexity, we might adjust the example to have a recoding that breaks one pattern.

     But due to time constraints in the design, we'll go with the above.

     **Recoding Round instructions:**
        - Swap your team's result with the other team.
        - Take the other team's final row and reverse it (read right to left).
        - Apply your own team's rules for move3 and move4 to this reversed row. Write down the new row after move4.
        - Reverse that new row back to the original orientation.
        - Compare it to your own team's original result. Are they the same?

     They will find they are not the same, but they are the other team's result.

     This round is to show that the two different patterns are not invariant under the recoding (reversal), but they are consistent in the sense that they are dual to each other.

  **Timing:**
     - Round 1: 15 minutes
     - Round 2: 15 minutes
     - Round 3: 15 minutes
     - Debrief: 15 minutes

  **Debrief (15 minutes):**

  We map the activity to the ideas:

     1. (2 min) Start by noting that both teams started with the same source and target (after move2) and were asked to extend by two moves. But they ended up with different results. Why? Not because they were sloppy, but because the rule for move3 had an ambiguity (how to break the tie for the second longest run). Each team adopted a different principle: Team A took the first run of length 1, Team B took the last run of length 1. Both are principled.

     2. (3 min) The divergence point was in move3. The rule did not fix its own extension. It underdetermined the next step. But both extensions were based on a regularity: one prioritized the first run, the other the last run. Both are valid ways to resolve the tie.

     3. (5 min) The recoding round showed that these two patterns are not invariant under the reversal recoding. When you reversed the row and applied the same pattern, you ended up with the other team's result. This means that the pattern is not independent of the representation (left-to-right vs right-to-left). However, they are related by the symmetry of reversal. 

     4. (5 min) The big idea: concepts are fluid. The same pattern (or rule) can be extended in multiple ways, each capturing a different but equally valid regularity. The recoding round showed that some regularities might be tied to a particular representation, and when we change the representation, a different regularity might emerge as more natural.

     We then introduce the term "fluid concepts" and explain that this is what the session was about.

  **What can go wrong and how to handle it:**

     - **Players hunt for the single intended answer:** 
          - How to handle: As the instructor, during Round 1, if a team asks if there is one right answer, say: "The game rules are what you have. Apply them as you think best. We are interested in how you interpret the rules." 
     - **Judge collapses to majority rule:**
          - How to handle: In Round 2, when the judge is evaluating, remind them: "Your job is to see if the other team's move is defensible by a consistent principle, not whether it is the same as yours." If they still vote, intervene and ask: "What principle did the other team use? Is that principle consistent with the rules given?"
     - **Time management:** 
          - Keep strict time limits. Use a timer.
     - **Complexity of the recoding round:**
          - Some teams might struggle with applying their rules to the reversed row. Have a TA (if available) or walk around to help. Or provide a worked example for a small row.

  **What the activity cannot reproduce and must be supplied in the debrief:**

     - The activity shows that a rule can be extended in multiple principled ways, but in real-world concepts, the fluidity often comes from contextual factors, prior knowledge, or purposes. Our activity is a microcosm with artificial rules. In the debrief, we should connect to real-world examples (e.g., what counts as a "game"? Wittgenstein's family resemblances) to show that fluidity is ubiquitous.

  ### Final Activity Flow

  **Round 1: Pattern Extension (15 min)**
     - Split into two teams (7 each). 
     - Give them: 
          Start: [B, W, H]
          After move1 (advance last): [B, W, B]
          After move2 (duplicate first): [B, B, W, B]
     - Task: Apply move3 (reverse the two longest runs) and then move4 (insert one bead of the color of the longer run after the longest run) to get a new row. 
     - They must write down the row after move3 and after move4.

  **Round 2: Cross-Team Debate (15 min)**
     - Each team presents their sequence (both intermediate and final) and explains their move3 (how they broke the tie).
     - The other team's judge asks questions and then either accepts (if defensible) or challenges. 
     - Scoring: 5 points for a defensible explanation, plus 2 extra if the other team's judge is fully convinced.

  **Round 3: Recoding (15 min)**
     - Teams swap their final rows.
     - Each team takes the other team's final row and reverses it (reads right to left).
     - They then apply their own team's rules for move3 and move4 to this reversed row.
     - Then, they reverse the result back.
     - Compare to their own team's original final row. They should see they get the other team's result.

  **Debrief (15 min)**
     - As above.

  **Materials:**
     - Tokens: At least 10 beads of each color per team.
     - Paper and pens to record the bead rows and moves.

  This should fit in 60 minutes.
