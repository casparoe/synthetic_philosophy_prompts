  ### Activity Design: "Bead Pattern Continuation"

  **Core Structure:** Three rounds (15 min each) with 5-minute transitions, plus 15-minute debrief. Teams of 7 students each (Team A and Team B), competing for "Pattern Points" (PP) tracked on a board. Points translate to small stakes: Winning team chooses the music for next session or gets first pick of snack options (bring cookies).

  **Materials per Team:**
  - 20 black beads (●), 20 white beads (○), 20 half beads (◑) (e.g., painted pebbles).
  - 1 large sheet of paper with the rule list:
    1. **Advance last**: Cycle last bead: ●→○, ○→◑, ◑→●.
    2. **Duplicate first**: Copy first bead to front.
    3. **Reverse runs**: Swap order of the **two longest contiguous same-color runs**.
    4. **Insert after longest**: Place a bead matching the longest run's color after that run.
  - Pens and paper for recording moves.

  **Setup:**
  - Two tables (Team A and Team B), each with beads and rule sheet.
  - Scoreboard visible to all.

  ---

  ### Rounds in Order:

  #### **Round 1: Pattern Extension (15 min)**
  - **Task:** Extend a pattern from a source to target, then propose the next step.
  - **Given to both teams:**
    - **Source:** ● ○ ◑  
      *(Visually: ● then ○ then ◑)*
    - **Target:** ● ● ○ ●  
      *(Derived by: Advance last [● ○ ◑ → ● ○ ●], then Duplicate first [● ● ○ ●])*
    - **Prompt:** *"Apply one move to transform the Target into a new position. Defend your move as the 'natural next step' of the pattern."*
  - **Instructions:**
    1. Teams work together to pick one move (from rules 1–4) to apply to **Target**.
    2. Record the new position and write a one-sentence justification.
    3. Appoint a **Proposer** (presents the move) and **Judge** (defends the team's logic later).
  - **Divergence Trigger:**  
    The Target (● ● ○ ●) has three runs: Run1=●● (length 2), Run2=○ (length 1), Run3=● (length 1). **Rule 3 (Reverse runs)** is ambiguous:  
    - *Team A likely interprets:* "Two longest" = longest (●●) and **first** of the tied short runs (○). Reverse order: ○ then ●●, then ● → ○ ● ● ●.  
    - *Team B likely interprets:* "Two longest" = longest (●●) and **last** of the tied short runs (●). Reverse order: ● then ●●, then ○ → ● ● ● ○.  
    Other moves (e.g., Advance last) avoid ambiguity but are less "pattern-extending"; teams are subtly nudged toward Rule 3 by the prompt's emphasis on "pattern."

  #### **Round 2: Cross-Team Challenge (15 min)**
  - **Task:** Teams critique each other's extensions.
  - **Structure:**
    1. **Proposer from Team A** presents their move + new position + justification.
    2. **Judge from Team B** questions Team A (e.g., *"Why prioritize the first run?"*).
    3. **Proposer from Team B** presents; **Judge from Team A** questions.
    4. **Scoring:**  
       - Judges award 1 PP to the other team if they cannot refute the justification.  
       - Teams earn 1 PP if their justification cites a consistent principle (e.g., "We always pick the leftmost run in ties").
  - **Key Moment:**  
    When Judges realize both interpretations are defensible (e.g., Team A: "Leftmost is principled for left-right reading"; Team B: "Rightmost aligns with the 'last' in Rule 1"). **Divergence solidifies** as teams see neither is "wrong."

  #### **Round 3: Recoding Round (15 min)**
  - **Task:** Test if extensions survive a change in representation.
  - **Given to both teams:**  
    Recoding rule: **"Reverse the sequence (read right-to-left) and swap ● and ○."**  
    Example: ● ● ○ ◑ → ◑ ● ○ ○ (original: ● ● ○ ◑ → right-left: ◑ ○ ● ● → swap ●/○: ◑ ● ○ ○).
  - **Steps:**
    1. Teams apply the recoding to their Round 1 **result** (e.g., Team A’s ○ ● ● ● → ◑ ○ ○ ○).
    2. They then apply *their same Round 1 move* to this recoded position.
    3. Finally, they reverse the recoding on the new result.
  - **Purpose:**  
    Show which concepts are **representation-invariant**.  
    - *Team A (prioritized leftmost run):* Their logic fails under recoding (left/right swap breaks consistency).  
    - *Team B (prioritized rightmost run):* Their logic *survives* (rightmost in original = leftmost in recoded).  
    Teams see Team B’s extension "works" in the new system, while Team A’s does not. This reveals that Team B’s regularity is more robust to frame shifts.

  ---

  ### Debrief (15 min)
  - **0:00–0:03 (Underdetermination):**  
    *"In Round 1, both teams started from the same Target (●●○●) but got different results. Why?"*  
    → Highlight: The rule ("reverse two longest runs") didn’t specify *which* short run to pick. Its extension was **underdetermined**—no "right" answer existed.
  - **0:03–0:08 (Principled Slippage):**  
    *"In Round 2, both teams defended their choices. Were they being sloppy?"*  
    → Map: Team A’s "leftmost" and Team B’s "rightmost" are **equally principled regularities** (e.g., consistent with reading order vs. cycle rules). Slippage isn’t noise—it reflects deeper intuitions.
  - **0:08–0:12 (Representation Invariance):**  
    *"In Round 3, why did Team B’s move survive recoding?"*  
    → Explain: Team B’s "rightmost" logic aligned with the recoding’s symmetry. **Concepts tied to context** (like reading order) break when the frame changes; **invariant concepts** (like cycle direction) persist.  
  - **0:12–0:15 (The Big Idea):**  
    *"This is fluidity: Concepts aren’t fixed by rules. People extend them differently by latching onto *different regularities* in the same data. And not all regularities survive when the world changes."*  
    → Connect to cognition: Prototypes, analogies, and real-world concepts (e.g., "justice") work this way.

  ---

  ### Predictable Problems & Fixes
  1. **"Hunting for the hidden key":**  
     - *Sign:* Teams insist there’s one right answer.  
     - *Fix:* Redirect with, "Your goal is to *defend* your choice, not guess mine. What principle makes your move valid?"
  2. **Judge collapses to majority rule:**  
     - *Sign:* Judges award points based on popularity.  
     - *Fix:* Intervene privately: "Ask: ‘Does their principle *consistently* explain their move?’ Not if you agree."
  3. **Recoding confusion:**  
     - *Sign:* Teams misapply recoding.  
     - *Fix:* Demo a simple example (e.g., recode ●○) before Round 3.

  ### What the Activity *Can’t* Show
  **Real-world grounding:** The activity abstracts concepts into beads/rules. In the debrief, explicitly **bridge to cognition**:  
  - *"In life, we see this when people categorize ‘whales’ as fish (similarity-based) or mammals (rule-based), or extend ‘democracy’ differently. Fluidity arises because we weight regularities (function, appearance, history) based on context—just like you weighted ‘leftmost’ vs. ‘last’."*
