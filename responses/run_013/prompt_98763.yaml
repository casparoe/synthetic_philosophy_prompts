prompt: |-
  I am convening the next meeting of a cross-departmental reading group: the members are doctoral students and faculty from economics, biology, and law, plus two philosophers, but none of them works on decision theory or on artificial intelligence. The session runs seventy-five minutes with no slides, and the topic I have been asked to lead is acausal threats and surrogate goals. Do not explain the topic to me; I want you to plan how I should teach it.

  By an acausal threat I mean the kind of extortion that can be pressed by an agent that has no causal channel to its target, no way to reach or punish or reward it after the fact, yet whose behaviour is nevertheless correlated with the target's, so that what the target does is evidence about what the threatener will do, whether because the threatener predicted the target in advance or because both are the sort of agent that reasons to the same conclusion from the same structure. By a surrogate goal I mean the defensive move in which an agent deliberately acquires a new and otherwise worthless objective, a decoy that is cheap to satisfy and orthogonal to its real aims, so that threats get redirected onto the decoy rather than onto the things it actually cares about.

  I need the plan to accomplish five things. First, the order of ideas: what must be in place before the next piece makes sense, and why each dependency runs the way it does, in particular where the notion of correlation without causation has to land before either the threat or the decoy can be understood, and whether commitment or prediction should be introduced first. Second, the single carrying example that holds the whole session together: what it must contain and what it must avoid. I want one example rather than a zoo of them, and it should make the correlation vivid without leaning on superintelligence, on simulation, or on a named decision theory treated as an unexplained primitive; it should also let the audience feel, not merely be told, why a threat with no causal teeth can still be taken seriously. Tell me what the example must have and must lack, and what the failure modes of a bad example would be. Third, the misconceptions to expect, in the order the audience will form them, and exactly where in the sequence to head each one off. I am already guessing three: that acausal means supernatural or psychic; that a threat is only effective if the threatener can later punish you; and that a surrogate goal is a bluff or a lie rather than something the agent genuinely comes to value. Tell me what else they will get wrong, since I suspect they will also think the decoy is meant to be achieved, or that any spare goal will do. Fourth, the criteria by which the audience should be able to judge a proposed surrogate goal once they leave. I want them to carry away a short checklist: the decoy must not interfere with the agent's real goals when no threat is on the table, it must be orthogonal enough that a threatener cannot target it and the original aim at once, and it must be credible to the threatener in the first place. The plan should say at which point in the sequence each of these criteria becomes discussable. Fifth, the check at the end that would tell me whether they have understood the question rather than merely learned two pieces of jargon, together with the parts I should openly decline to cover at this level and flag as such.

  Please give me the pedagogical structure, the dependency chain, the carrying example, and the misconception map, with the reasoning behind each choice. I do not want a reading list or citations.
reasoning: |-
  Hmm, the user is convening a cross-departmental reading group with doctoral students and faculty from economics, biology, law, and philosophy. They need help planning a 75-minute session on acausal threats and surrogate goals without slides. They've clearly defined the concepts: acausal threats involve extortion without causal influence, relying on correlation; surrogate goals are decoy objectives to redirect such threats.

  The user wants five specific elements in the plan:
  1. A logical sequence of ideas with clear dependencies
  2. A single robust example that avoids superintelligence/simulation/named theories
  3. Anticipated misconceptions and when to address them
  4. A takeaway checklist for evaluating surrogate goals
  5. An understanding check and clear scope boundaries

  This audience is academically sophisticated but lacks decision theory/AI background. I should avoid jargon while respecting their intelligence. The key challenge is making correlation-as-evidence feel visceral without familiar crutches like supernatural tropes or punishment mechanisms.

  For the sequence, I'll start with correlation without causation since it's foundational. Then introduce precommitment as a familiar concept (law/economics will recognize contractual parallels) before showing its failure against prediction (biology/philosophy will appreciate the evolutionary tension). This sets up the threat naturally. Surrogate goals come last as the solution.

  The carrying example must be mundane yet rich. A business negotiation works well: two firms choosing cities independently, where one threatens to mirror the other's choice. Real-world analogues exist (market entry games), it avoids sci-fi tropes, and "choosing headquarters" is concrete. Crucially, it lets the threat feel credible - if Firm A sees choosing Boston as evidence Firm B will too, the correlation does the work of punishment via competition.

  Misconceptions will likely include:
  - Equating "acausal" with psychic phenomena (address when defining terms)
  - Assuming threats require enforcement capability (demolish during the threat example)
  - Seeing surrogate goals as dishonest (clarify during decoy introduction)
  - Believing decoys should be achieved (preempt with checklist)
  - Thinking any irrelevant goal suffices (show orthogonality matters)

  The checklist should emerge organically:
  1. Non-interference (when contrasting with precommitment)
  2. Orthogonality (during threat demonstration)
  3. Credibility (when discussing decoy adoption)

  For the understanding check, I'll use a diagnostic question about modifying the example, avoiding jargon recall. Scope boundaries should explicitly exclude decision theory specifics, infinite computation, and moral implications.

  The 75-minute flow will be tight: 15 minutes on foundations, 25 on threat mechanics, 20 on surrogate solution, 15 for checklist/check/scope. Pacing is critical - philosophical depth mustn't sacrifice clarity.
answer: |-
  Here’s a pedagogical structure for your 75-minute session, optimized for logical flow, misconception prevention, and conceptual retention. The focus is on *experiential understanding* through a single, tightly designed example.

  ---

  ### **Pedagogical Structure & Timing**
  **Total: 75 mins**  
  *(Strict timing is critical; use a visible timer)*

  #### **I. Foundations: Correlation Without Causation (15 mins)**  
     - **Goal:** Establish that correlation can be evidence *without* causal pathways.  
     - **Sequence:**  
       1. **Start with intuition:** "If two people independently solve the same math puzzle, their answers correlate. Does one *cause* the other? No. But if I see your answer, I update my belief about theirs." *(Audience nods: familiar)*  
       2. **Introduce stakes:** "Now imagine their choices affect each other’s outcomes *because* of this correlation."  
     - **Why first?** Without this, "acausal" feels mystical. Uses their existing stats/econ literacy.

  #### **II. The Threat Mechanism: Commitment vs. Prediction (25 mins)**  
     - **Goal:** Show why precommitment fails against prediction, creating the threat.  
     - **Sequence:**  
       1. **Commitment first (familiar anchor):** "A company precommits to enter a market to deter competitors. *Causal* threat: if you enter, they fight." (Law/econ recognize game theory).  
       2. **Break commitment with prediction:** "But what if the competitor *predicts* your move? If they know you’ll enter, they preempt you. Your 'deterrence' fails."  
       3. **Introduce the acausal threat:** "Now imagine the competitor says: *‘We’ll enter if you enter. We have no spies—we just predict you. If you doubt us, test us: enter and see.’* No causal lever, but entering *is evidence* they’ll enter too, hurting you."  
     - **Why this order?** Commitment is intuitive; prediction subverts it, forcing the "evidence = consequence" insight.

  #### **III. Surrogate Goals: The Decoy Defense (20 mins)**  
     - **Goal:** Show how a decoy absorbs the threat while preserving real goals.  
     - **Sequence:**  
       1. **Frame the problem:** "How to neutralize the prediction? If you *don’t care* whether they enter, their threat to mirror you is empty."  
       2. **Introduce the surrogate:** "So you adopt a *new*, trivial goal: e.g., ‘I want my logo to be blue on Tuesday.’ Now, if they threaten to enter if you enter, you think: *‘I’ll enter—who cares? My real goal is safe, and my logo can still be blue.’*"  
       3. **Contrast with failed fixes:** "Without the decoy, refusing to enter (to avoid prediction) costs you the market. With it, you enter freely."  
     - **Why here?** The threat must feel urgent before the solution is meaningful.

  #### **IV. Checklist & Synthesis (15 mins)**  
     - **Goal:** Embed criteria for judging decoys + verify understanding.  
     - **Sequence:**  
       1. **Elicit checklist from audience:** "What made the decoy work?" Guide them to:  
          - *Non-interference:* "Does it break anything if there’s no threat?" (From Part III).  
          - *Orthogonality:* "Can the threatener target both decoy and real goals?" (Use Part II’s threat to show a bad decoy, e.g., "I’ll enter *small markets*" – still targetable).  
          - *Credibility:* "Will the threatener *believe* you care?" (Tie to Part I: correlation requires predictability).  
       2. **Understanding check:** Pose: *"In our example, could the decoy be ‘maximize profit’?"*  
          - **Correct answer:** No (fails orthogonality and non-interference). If they see why, core ideas landed.  
       3. **Explicitly exclude:** Flag *"We’re not covering: How agents acquire values (psych/phil), superintelligence, or which decision theory ‘wins.’ This is about the *structure* of threats."*  

  ---

  ### **The Carrying Example: "The Headquarters Game"**  
  **Why this works:**  
  - **Setup:** Two firms (A and B) choose HQ cities. Cities have fixed "synergy" if one firm is alone, but competition if both pick same city. Firm B (Threatener) says: *"We’ll choose whichever city you choose."*  
  - **Must have:**  
    - **Tangible stakes:** "If both in Boston: both lose $10M. If alone: gain $5M." (Econ/biology grasp incentives).  
    - **No causal link:** B has no spies, no way to punish A later—only prediction/correlation.  
    - **Decoy trigger:** A adopts "I want my CEO in a city starting with ‘B’" (trivial; Boston/Berlin).  
  - **Must avoid:**  
    - Superintelligence (B is just good at market research).  
    - Simulation (no "AIs predicting each other").  
    - Named theories (no "CDT vs. EDT").  
  - **Failure modes of bad examples:**  
    - Psychic tropes → undermines "correlation without causation."  
    - Punishment mechanisms → obscures acausality.  
    - Overly complex stakes → loses non-experts.  

  ---

  ### **Misconception Map & Preemption**  
  1. **"Acausal = supernatural"**  
     - *When:* During Part I (Foundations).  
     - **Preempt:** Stress *"Like independent math solvers—no spooky action, just shared reasoning or data."*  

  2. **"Threats require punishment power"**  
     - *When:* Introducing the threat (Part II).  
     - **Preempt:** *"B can’t punish A. But if A enters Boston, that’s* evidence *B will too—so A punishes itself by entering."*  

  3. **"Surrogate goals are bluffs"**  
     - *When:* Introducing the decoy (Part III).  
     - **Preempt:** *"A* genuinely *cares about the decoy (e.g., blue logos). Otherwise, B won’t believe the correlation."*  

  4. **"The decoy is meant to be achieved"**  
     - *When:* Checklist synthesis (Part IV).  
     - **Preempt:** *"Its purpose is to be threatened, not ‘won.’ If B threatens to ruin your blue logo, you shrug—your real goals are safe."*  

  5. **"Any irrelevant goal works"**  
     - *When:* Orthogonality in checklist.  
     - **Preempt:** *"If A picks ‘maximize profit’ as a decoy, B can still threaten profit. The decoy must be* unthreatening *to sacrifice."*  

  6. **"Correlation implies causation"** (Biology/law bias)  
     - *When:* Foundations (Part I).  
     - **Preempt:** *"Think natural experiments: two hospitals see fewer infections on Fridays. Not causation—just a scheduling correlation."*  

  ---

  ### **Why This Sequence Works**  
  - **Dependency chain:** Correlation → Commitment → Prediction subverts commitment → Threat emerges → Decoy neutralizes threat. Each step forces the next.  
  - **Carrying example:** Concrete, familiar, and self-contained. Reveals mechanics without exotic assumptions.  
  - **Misconceptions:** Addressed *proactively* when the concept first appears, using audience’s home disciplines (e.g., law understands binding commitments; biology knows spurious correlations).  
  - **Checklist:** Derived inductively from the example during synthesis—not handed down.  
  - **Understanding check:** Tests application, not definitions. Diagnoses whether they see *why* a bad decoy fails.  

  **Final tip:** Use Socratic questioning. Start each section with "What if...?" and cold-call diverse disciplines (e.g., philosophers on "genuine valuing," economists on incentives). The example is your engine—run it hard.
