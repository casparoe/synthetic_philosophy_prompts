prompt: |-
  I got into a dumb argument with a friend who used to be an astronomer about whether Pluto is a planet, and now I want to turn it into the term paper for a seminar that's basically all Kripke on rule-following, so I'm asking you to do the actual work for me. Here's the episode as I have it, tell me if I've garbled anything: the IAU at its general assembly in Prague in August 2006 voted through a definition of planet requiring that the body orbit the Sun, that it be massive enough for its own gravity to have pulled it round, and that it have swept the neighbourhood of its orbit clear of comparable bodies; Pluto meets the first two and not the third, so it got demoted to dwarf planet, and the thing that forced the issue was Eris, announced in 2005, which turned out to be more massive than Pluto, so either we suddenly had a tenth planet or Pluto had never been one. As I understand it the vote was a show of hands near the end of the assembly with only a few hundred people in the room, and plenty of working planetary scientists said afterwards that they'd keep calling Pluto a planet, that a roomful of people voting doesn't change what a word means. (I'm also told the same sort of thing happened with Ceres and the asteroids back in the 1800s, when the planet count ballooned and astronomers quietly reclassified, but I don't know those details and I don't want the paper to hinge on them.)

  What I want is not a summary of the rule-following problem -- I can recite the plus/quus business, the finite-past-uses move, and the community-dispositional reply, and I'd get no marks for it. I want a real case analysis, and I want it disciplined. Who counts as the rule-follower here, what exactly is the rule, what are the past uses that are supposed to have fixed the extension of planet before 2006, and what would it even be for the IAU to have gone on in the same way rather than changed the subject? Kripke's paradox says nothing in my past usage fixes what I should say next; does the Pluto case bear that out -- was there simply no fact before 2006 that settled Eris and Pluto, so that the whole fight was the paradox happening in public -- or does it show the paradox misdescribes the dispute, since the participants took themselves to be disagreeing and gave each other reasons rather than just manifesting different dispositions? And don't let the new definition off the hook: it's itself a rule that has to be applied to cases nobody thought about, and its third clause is graded rather than binary (Neptune shares its zone with Pluto and is still a planet; Mercury apparently isn't even in hydrostatic equilibrium but was grandfathered in; a Mars-sized body way out in the Oort cloud would fail the clearing test no matter what it was made of) -- so the stipulated definition seems to inherit the very problem it was supposed to solve.

  Then run it the other way and tell me what the episode shows about the theory: a confirmation, an anomaly, or a case Kripkenstein never anticipated, given that this rule was legislated by a self-selected body rather than grown out of a practice, and given that most people who use the word planet had no say in it and just went along afterwards -- whose dispositions are supposed to fix the meaning, and does the theory have anything to say about that? I gather one of the options the IAU committee floated was, roughly, that a planet is whatever enough people are willing to call a planet, and that a rival proposal folding the dwarf planets in as a subcategory of planets lost the vote -- I'd like to know whether that makes things better or worse for the communitarian reading, since a vote is a funny way to locate a disposition. And the honest part, please: where the theory is silent, what it explains that a flat appeal to vagueness or to conceptual change wouldn't, and whether the comparison to arithmetic is doing any real work or just dressing up a fight about authority. No bibliography or reading list, I'll add citations myself -- I want the argument, and I'm slightly embarassed by how much this bugs me, so I'd rather you tell me the case breaks the theory than force the fit.
reasoning: |-
  Okay, the user is really passionate about this Pluto debate and wants to tie it into Kripke's rule-following paradox for a term paper. Let me start by understanding their main points. They described the IAU's 2006 decision, the criteria that demoted Pluto, and the controversy around the vote. They mentioned that many astronomers still call Pluto a planet, arguing that a vote doesn't change word meaning. The user wants to analyze this through Kripke's lens: who are the rule-followers, what's the rule, past uses, and whether the IAU's action was continuing the same rule or changing it.

  First, I need to outline the key elements of Kripke's paradox. The problem is that past uses don't determine future applications, leading to skepticism about meaning. The user wants to see if the Pluto case exemplifies this. They also question if the new definition just shifts the problem, since the third criterion (clearing the orbit) has its own ambiguities.

  The user’s deeper need is a rigorous philosophical analysis without rehashing basic Kripke. They want to know if the case confirms, challenges, or is outside Kripke's theory. They’re also interested in how authority (like the IAU) fits into communitarian views, and whether a vote reflects dispositions. Plus, they want honesty on where the theory falls short.

  I should start by defining the rule-followers. Astronomers are the primary community, but the public also uses the term. Past uses include the nine planets before 2006, with Pluto as an outlier. The problem is that past usage didn't anticipate objects like Eris. Kripke’s paradox suggests no fact settled Pluto’s status beforehand, which matches the IAU's struggle. The dispute shows astronomers giving reasons, implying they believed there was a fact, but Kripke would say they’re wrong—there’s no fact, just dispositions.

  The new definition’s vagueness in "clearing the neighborhood" mirrors the initial problem. Neptune and Pluto share orbits, Mercury’s status, Oort cloud bodies—all show the rule’s application is uncertain. Legislating a rule doesn’t solve the paradox; it just creates new areas of doubt.

  Regarding communitarianism, the IAU’s vote is a meta-disposition—dispositions about dispositions. But excluding many scientists challenges whose dispositions matter. The rival proposal (defining planets by what people call planets) is circular under Kripke, but the vote lost, so the IAU opted for stipulation. This highlights that meaning isn’t just dispositions but can be imposed by authority.

  Comparing to math: math rules are necessary, while "planet" is empirical and contingent. The Pluto case involves discovery and empirical adjustments, unlike math’s fixed rules. Authority plays a bigger role here, which Kripke didn’t address.

  Strengths of Kripke’s view: it explains the pre-2006 indeterminacy and why the dispute happened—no fact of the matter. Weaknesses: it doesn’t handle stipulative changes well, and the role of authority is unaccounted for. A vagueness or conceptual change approach might be simpler but misses the rule-following skepticism.

  The user might also be interested in how social authority interacts with meaning, which Kripke doesn’t cover. The case shows that meaning can be legislated, challenging the communitarian idea. They should note that Kripke’s theory explains the indeterminacy but not the resolution via authority. The comparison to math is limited because planetary science involves empirical discovery, not just rule application.

  In conclusion, the Pluto case both confirms Kripke’s skepticism (no fact pre-2006) and challenges it by introducing authority-driven stipulation, which isn’t addressed in the original paradox. The user should present this as a real-world instance of the paradox playing out, with the added complexity of institutional intervention.
answer: |-
  Here's a disciplined Kripkean analysis of the Pluto case, structured to address your core questions and leveraging the episode to probe the rule-following paradox:

  **1. Setting the Stage: Rule-Followers, Rule, and Past Uses**
      *   **Rule-Followers:** Primarily the community of professional astronomers (specifically, those engaged in solar system dynamics and taxonomy). Crucially, *before 2006*, this community overlapped significantly with the wider public and educators in their usage ("9 planets"). Post-2006, a divergence occurred: many planetary scientists (especially those studying Pluto/Kuiper Belt Objects - KBOs) and the public continued using "planet" inclusively, while the IAU-endorsed definition became dominant in official contexts.
      *   **The Rule (Pre-2006):** There was no explicit, universally agreed-upon rule. The *implicit* rule was a disjunctive, fuzzy cluster: "A planet is a large, non-stellar, non-satellite body orbiting the Sun, historically recognized as such (e.g., Mercury through Pluto), and distinguished from asteroids/comets by relative size and orbital characteristics." This rule was grounded in observational history and lacked precise criteria for "large" or "orbital characteristics."
      *   **Past Uses (The "Training"):** The extension was fixed by ostension: "These are the planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto." Pluto was the problematic "training example" – included historically due to perceived uniqueness and size relative to known asteroids, but later understood to be one of many KBOs. Ceres (briefly a planet) and other asteroids were "past corrections" showing the instability of purely historical enumeration.

  **2. Kripke's Paradox and the Pre-2006 Indeterminacy**
      *   **The Paradox Applied:** Kripke's skeptic argues that no finite list of past uses ("plus" applied to specific numbers) *necessitates* a unique application in a new case ("68+57"). Similarly, the past uses of "planet" (the ostended list of 9) did not *necessitate* how to apply the term to newly discovered bodies like Eris (or even retroactively to Pluto in light of Eris). The historical inclusion of Pluto was a contingent fact, not proof that Pluto *met essential criteria* that Eris also met. The fuzzy pre-2006 "rule" was radically underdetermined.
      *   **Does the Case Bear This Out? Absolutely.**
          *   **No Fact of the Matter:** Pre-2006, there *was* no fact of the matter about whether Pluto *or* Eris were "planets" in any robust, essentialist sense. The historical practice (including Pluto) did not fix the application to new edge cases. Kripke's paradox perfectly captures this indeterminacy.
          *   **Disagreement vs. Dispositions:** The passionate disagreement *is consistent* with the paradox. Participants *took themselves* to be disagreeing about a shared concept (a "fact"), but Kripke argues this feeling is illusory. They were, fundamentally, manifesting different dispositions shaped by different weightings of historical precedent, dynamical considerations, geophysical characteristics, and cultural attachment. Their "reasons" were attempts to justify these differing dispositions post-hoc or to persuade others to adopt their dispositional stance, not appeals to a pre-existing, fully determined rule. The public fight *was* the paradox playing out – the community grappling with the underdetermination of the rule by past practice.

  **3. The Stipulated Definition: Inheriting the Paradox**
      *   **The New Rule (IAU 2006):** "A celestial body that (a) is in orbit around the Sun, (b) has sufficient mass for its self-gravity to overcome rigid body forces so that it assumes a hydrostatic equilibrium (nearly round) shape, and (c) has cleared the neighbourhood around its orbit."
      *   **Inheriting the Problem:** Kripke's skeptic would immediately pounce:
          *   **"Cleared the neighbourhood":** This is the new "quus." What *exactly* constitutes "cleared"? Is it a binary state? Neptune doesn't clear Pluto; Jupiter doesn't clear the Trojans. Mercury's hydrostatic equilibrium is debated. Is "clearing" a threshold? What metric? (e.g., Stern-Levison parameter). Applying this clause *to new, unforeseen cases* (like your hypothetical Mars-sized Oort Cloud object) is just as underdetermined by the definition as Eris was by the old practice. The definition didn't solve the paradox; it *created a new, slightly more precise, but still vulnerable rule*. Grandfathering (accepting Mercury despite potential hydrostatic issues, Neptune despite Pluto) highlights the *persistence of historical practice* even within the new rule, further muddying its essentialism.
          *   **Application Requires Judgment:** Determining hydrostatic equilibrium or orbital clearance often involves modeling and interpretation, introducing new points of potential divergence in "going on in the same way." The rule doesn't apply itself.

  **4. The IAU Vote and Communitarianism: A Challenge**
      *   **Whose Dispositions?** The Kripkean communitarian ("Kripkenstein") faces a problem: whose dispositions fix meaning? Pre-vote, it was the diffuse, conflicted dispositions of astronomers and the public. The IAU vote was an *attempt* by a subset (a self-selected group present at the end of a conference) to *legislate* dispositions for the wider community.
      *   **The Vote as Meta-Disposition:** The vote itself can be seen as a manifestation of a *disposition within that subgroup* to *fix the rule by fiat*. However, the subsequent rejection by many planetary scientists shows that the dispositions of the *relevant linguistic community* (solar system scientists) were not unanimous. Kripkenstein struggles to explain why the IAU subgroup's dispositions *should* override those of other competent practitioners who rejected the definition. Does "community" mean "majority," "experts," or "designated authority"? The theory is silent on *which* community's dispositions matter when they conflict and an authority intervenes.
      *   **The Rival Proposals:**
          *   **"Anything Round" (Planetary Geophysicists' Disposition):** This lost proposal reflected the disposition of scientists focused on intrinsic properties. Kripkenstein would say this *was* their disposition, but the vote revealed a *different* disposition (dynamics-focused) held by the subgroup *and* a disposition to empower the IAU to decide.
          *   **"Whatever People Call a Planet" (Circularity):** This proposal is almost explicitly Kripkensteinian! It directly equates meaning with community dispositions. However, Kripke's skeptic would point out its vacuity: "How do we know what people are disposed to call a planet?" leads right back to the paradox. Its defeat highlights that many astronomers felt a need for a *stipulated rule*, not pure disposition-tracking, arguably trying to *escape* the vagaries of pure communitarianism with a definition. This is awkward for a strict Kripkenstein reading.

  **5. What the Episode Shows About the Theory**
      *   **Confirmation:** The pre-2006 period is a textbook case of Kripkean indeterminacy. Past uses (the 9 planets) provided no fact of the matter for Eris/Pluto. The intense disagreement *without* a pre-existing decisive rule strongly supports the paradox.
      *   **Anomaly/Extension:** The episode pushes the theory in new directions:
          *   **Stipulation & Authority:** Kripke focuses on rules arising from practice. The IAU *legislated* a rule. While the *acceptance* of the rule relies on community dispositions, the *act of legislation* introduces an element of *authority* not central to Kripke's original math example. The theory doesn't adequately account for how formal stipulation by a recognized (but contested) authority interacts with background dispositions to *change* the rule-following practice. Does the vote create a *new* rule-following game?
          *   **Contested Community:** The post-vote split highlights that identifying *the* relevant linguistic community can be contentious. Kripkenstein assumes a relatively homogeneous community. The Pluto case shows a fragmented one.
      *   **Comparison to Arithmetic:** This comparison is **limited but revealing**.
          *   **Limitation:** Arithmetic rules (like addition) are necessary, abstract, and defined by explicit algorithms. "Planet" is empirical, contingent, and historically rooted. Discovering Eris was like finding a new number combination, not proving 2+2=5.
          *   **Revealing:** The comparison *does* work in exposing the core rule-following problem: just as nothing in "plus" applied to small numbers fixes its application to 68+57, nothing in "planet" applied to the 4 inner/4 gas giants fixed Pluto/Eris. The key similarity is the *underdetermination of future application by past use*.
          *   **Fight about Authority:** The comparison *does* dress up a fight about authority, but importantly, it reveals that the *source* of the authority conflict is the *prior indeterminacy* Kripke identifies. If past use *had* fixed the meaning unambiguously, the IAU vote would have been unnecessary or obviously wrong. The indeterminacy *created the space* for the authority fight.

  **6. Honest Assessment: Strengths, Weaknesses, and Alternatives**
      *   **Where Kripke Excels:** Explaining the *necessity* and *nature* of the pre-2006 disagreement. A "flat appeal to vagueness" might say the concept was fuzzy, but Kripke provides a deeper *reason* for the fuzziness: the rule-following paradox itself. "Conceptual change" describes the *outcome* (meaning changed), but Kripke explains the *mechanism of the change* – the community grappling with the underdetermination inherent in their prior practice and attempting (via vote) to establish a new standard for "going on."
      *   **Where Kripke is Silent/Strained:** Handling deliberate stipulation by contested authority and fragmented communities. The theory struggles to explain why the IAU's disposition (manifested in the vote) *prevailed* in official contexts despite opposition from a significant part of the relevant scientific community. It doesn't fully account for the *normative force* some attributed to the vote itself, beyond mere disposition.
      *   **Does it Break the Theory?** Not fundamentally. It confirms the core paradox spectacularly. However, it **exposes a limitation**: Kripke's framework, focused on rules emerging organically from practice, is less equipped to analyze cases where an authority *imposes* a new rule to resolve the very indeterminacy the paradox reveals. The episode shows the paradox in action *and* shows a community attempting an institutional "solution" that itself becomes a new rule-following game with its own potential indeterminacies ("clearing the neighbourhood?"). The theory explains *why* the fight happened, but less cleanly *how* it was (partially) resolved.

  **In Conclusion for Your Paper:**

  The Pluto saga is a profound real-world manifestation of Kripke's rule-following paradox. Pre-2006, the meaning of "planet" was radically underdetermined by past usage; there was no fact of the matter about Pluto or Eris. The intense disagreement reflected conflicting dispositions within the astronomical community, not a dispute over a fixed rule. The IAU vote was an attempt to *stipulate* a new rule to resolve this indeterminacy. However, this stipulated rule ("clearing the neighbourhood") immediately inherits the same vulnerability to skeptical doubt that plagued the old practice. The episode confirms Kripke's central insight about the underdetermination of meaning by past use but also highlights challenges for the communitarian response: the fragmentation of the relevant linguistic community and the role of contested authority in imposing new rules expose limitations in the theory's original formulation. The comparison to arithmetic effectively illuminates the core paradox of underdetermination but falters when confronted with the empirical, historical, and institutional complexities of scientific taxonomy. Ultimately, the case shows Kripke's paradox not as an abstract puzzle but as an engine driving real conceptual conflict and change.
