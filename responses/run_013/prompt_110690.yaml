  The reconstruction section is crucial. I think a moderate situationist view (e.g., traits as probabilistic situation-specific dispositions) could actually preserve most practices if we tweak language. Letters might say "consistently diligent in seminar settings" rather than "fundamentally diligent". 

  Finally, the replacement scenarios need to be vivid: if we drop cross-situational stability, letters become narrower; if we drop causal efficacy, conduct boards lose "true self" rhetoric but keep sanctions. The bottom line should validate their hunch - the practice runs on thinner assumptions than it professes, but can't escape all metaphysical commitments.

  Key pitfalls to avoid:
