prompt: |-
  I am preparing a prospectus for a one-semester research paper (roughly 8,000 words) in the philosophy of language, and I would like help turning a half-formed idea into a proper proposal. The idea is this. The familiar Twin Earth construction is normally read as establishing that the content of a natural-kind term is fixed by the environment rather than by anything inside the speaker's head. But the construction moves two things at once, and I suspect the debate has drawn a confidence from that coincidence that the cases themselves do not license. The first thing is contact: whether the individual speaker, or anyone she has actually interacted with, has been causally acquainted with instances of the kind. The second is practice: what the community's norms of use are anchored in — which objects the word was originally introduced for, and how the deference structure of the community runs. In the standard case the speaker belongs to precisely the community whose practice is anchored in the very environment she inhabits, so contact, practice, and original anchor all point the same way, and rival positions that ought to diverge deliver identical verdicts. The disagreement then looks smaller and better understood than it is.

  I want to design cases in which the three come apart, restricting myself to natural-kind terms, and to ask which of them the content actually tracks. The candidate cases I have so far are these. First, a community whose word was anchored, generations ago, in a region it has since abandoned, so that the speakers' present environment, the community's anchoring history, and any individual speaker's contact all diverge. Second, a community on a world containing no instances of the kind at all, whose word is sustained entirely by testimony, theory, and instrument readings of traces — is such a term empty, indeterminate, or fully contentful by virtue of the practice alone? Third, a deference chain that terminates in an authority who turns out never to have existed, so that the anchor is a fiction while the practice is robust and stable.

  Turn this into a proposal. I want the question stated so that it has a determinate answer, together with a clear account of why the existing positions leave it open rather than settling it. I want the method described concretely enough that I could begin tomorrow: how the cases are built as minimal pairs, what predictions each position is committed to before I look at the cases, how I check that the verdicts are driven by semantics rather than by pragmatics, and what becomes of the cases when they are embedded in belief and quotation contexts. I want a statement of what a real result would look like, and of what would count as the project failing — including the failure mode in which every position accommodates every case with a small epicycle, and the one in which I have merely rediscovered the internalism–externalism dispute under new labels. Finally, give me a realistic plan for a single semester, with an honest assessment of which part is likely to prove too large. I do not need a literature review or a bibliography; refer to positions and arguments by description, and I will attach the citations myself.
reasoning: |-
  Okay, the user is working on a philosophy of language prospectus about Twin Earth and natural-kind terms. They have a half-formed idea that the standard Twin Earth argument conflates contact, practice, and anchoring. Their core insight is that by designing cases where these three diverge, they can test which factor truly determines content. 

  Hmm, they seem frustrated with how the existing debate glosses over this conflation. They want to expose that what looks like consensus is actually masking deeper disagreements. Smart. Their proposed cases are inventive – abandoned regions, testimony-only worlds, fictional anchors – but they need help structuring this into a rigorous proposal.

  First, I should identify their unspoken needs. They clearly crave methodological precision: they emphasize "how to begin tomorrow" and want concrete failure conditions. That suggests past experiences with vagueness derailing projects. Also, they dismiss "rediscovering internalism-externalism with new labels" – they're terrified of triviality. The push for determinate answers implies they want to force the debate into uncomfortable corners.

  Right, framing the question. Must avoid vagueness. Instead of "which factor matters," we need: which combination is necessary/sufficient for content determination? That forces binary outcomes in test cases. Existing positions’ predictions should be tabulated – Putnam would say anchor is necessary, Burge might say practice suffices, etc. 

  For cases, minimalism is key. Each scenario isolates one variable: Case 1 severs environment from anchoring, Case 2 removes contact entirely, Case 3 falsifies the anchor. Crucially, we’ll need to test these in belief contexts ("Oscar believes water is wet") to see if truth-values shift – that’s the litmus test for semantic content vs. pragmatic loosening.

  The semester plan feels tight. Building airtight thought experiments might consume weeks, and belief-context testing could spiral. I’ll flag that as the likely bottleneck. For failure modes, we’ll define "epicycle accommodation" as when theories tweak but don’t falsify – e.g., if internalists just call fictional anchors "mental templates."

  User’s ambition is impressive but risky. They’re attempting to fracture a 50-year consensus. If they pull it off though… that’s how paradigms shift.
answer: |-
  Here’s a streamlined prospectus framing your project with methodological rigor, clear stakes, and a realistic semester plan:

  **Prospectus: Contact, Practice, and Anchoring in Natural-Kind Term Semantics**  
  **Core Question:** For a natural-kind term to possess determinate extension, is causal contact with the kind by *some* agent in the deference chain *necessary* (Contact Thesis), or can stable communal practice alone suffice when grounded in a (potentially non-veridical) anchoring event (Practice Thesis), irrespective of the speaker's local environment?  

  ### Why Existing Positions Leave This Open
  - **Standard Externalism (Putnam/Burge):** Conflates contact (via causal chains) and practice (via deference). In Twin Earth, both converge: Earth speakers contact H₂O *and* practice traces to H₂O; Twin speakers contact XYZ *and* practice traces to XYZ. The view doesn’t isolate which factor is essential when they diverge.  
  - **Internalism/Descriptivism:** Typically rejects *both* contact and historical anchoring, making content wholly internal/conceptual. But it struggles to explain reference shift and deference, leaving practice underspecified.  
  - **Hybrid Views:** Often lack criteria to weight contact vs. practice when in tension.  

  ### Method: Constructing Minimal Pairs & Testing Predictions  
  1. **Case Design (Minimal Pairs):**  
     - **Case 1 (Diverging Region):** Community emigrates from region with substance *A* to region with distinct substance *B*.  
       - *Practice Anchored in A*: Original baptism of "Glub" was for *A*; deference traces to emigrant experts.  
       - *Contact Only with B*: Current speakers interact solely with *B*; no access to *A*.  
       - *Environment is B*: Local samples are *B*.  
       → *Question:* Does "Glub" refer to *A*, *B*, or nothing?  
     - **Case 2 (Testimony-Only World):** Community on "Desert World" has "Water," introduced via ancient records/equipment purporting to detect H₂O, but *no actual water exists*. Practice is robust (experts affirm "water" theory, instruments "detect" it in traces).  
       → *Question:* Is "water" empty, indeterminate, or does it refer to H₂O?  
     - **Case 3 (Fictional Anchor):** "Phlogiston"-like term "Caloric" introduced by a fictional "discoverer" (later revealed as myth), but practice is scientifically entrenched (experts defer to the myth, instruments measure "caloric flow").  
       → *Question:* Does "caloric" refer to a postulated kind, nothing, or acquire content via practice?  

  2. **Predictions from Positions:**  
     | **Position**          | **Case 1 (Glub)** | **Case 2 (Desert Water)** | **Case 3 (Caloric)** |  
     |------------------------|-------------------|---------------------------|----------------------|  
     | **Contact Thesis**     | Refers to *B*     | Empty                     | Empty                |  
     | **Practice Thesis**    | Refers to *A*     | Refers to H₂O             | Refers to postulated kind |  
     | **Internalism**        | Ambiguous/descriptive | Descriptive content | Descriptive content |  
     | **Standard Externalism** | ? (Undetermined) | ? (Undetermined)          | ? (Undetermined)     |  

  3. **Isolating Semantics (Testing in Intensional Contexts):**  
     - Embed terms in belief reports: *"Oscar believes Glub is potable."*  
       - Vary facts about *A*/*B* (e.g., *A* is toxic, *B* safe).  
       - If truth-value hinges on *A* (despite contact with *B*), practice dominates; if on *B*, contact dominates.  
     - Test empty terms in negative existentials: *"Caloric does not exist."*  
       - If true, term is empty; if false, practice confers content.  
     - **Control:** Check pragmatic effects (e.g., speaker intentions, error theories) by varying contextual cues. If verdicts persist despite pragmatic "fixes," content is semantic.  

  ### What Constitutes a Result  
  - **Success:** Demonstrates that **no existing theory predicts all cases without ad hoc adjustments**, revealing the contact/practice gap as a fundamental fissure in externalism. Shows either:  
    (a) Contact is necessary (undermining pure practice views),  
    (b) Practice suffices (changing the burden for externalism), or  
    (c) A new hybrid is required (e.g., "anchored practice" with veridicality constraints).  
  - **Failure Modes:**  
    - **Epicycle Accommodation:** Theories tweak criteria (e.g., "fictional anchors create abstract kinds") to preserve prior commitments without falsifiability.  
    - **Rediscovered Internalism-Externalism:** Verdicts map neatly onto traditional divides (e.g., internalists always favor practice, externalists contact).  
    - **Indeterminacy:** All cases yield ambiguous intuitions; no clear semantic verdicts emerge.  

  ### Semester Plan (Realistic Workflow)  
  1. **Weeks 1–3:** Finalize case design + predictions table.  
     - *Risk:* Over-engineering cases; focus on *one* variable change per case.  
  2. **Weeks 4–6:** Develop intensional tests (belief/quote contexts) and controls.  
     - *Risk:* Belief contexts introduce noise; pilot with peers to filter pragmatic intrusions.  
  3. **Weeks 7–9:** Analyze cases against positions; identify where theories strain or break.  
     - *Honest Assessment:* This is the bottleneck. Weighing "epicycles" vs. genuine falsification requires deep engagement.  
  4. **Weeks 10–12:** Draft paper; test failure modes. If epicycles dominate, pivot to diagnosing why the debate resists resolution.  
  5. **Week 13:** Polish; specify where results point (new synthesis? stalemate?).  

  **Feasibility:** 8,000 words is tight but viable if cases are precise and analysis focused. The biggest risk is **Week 7–9 analysis** – philosophers excel at ad hoc rescues. Mitigate by pre-defining what counts as an "epicycle" (e.g., any move not in a position’s original papers). If cases are robust, even a stalemate is a result: it shows the debate *cannot* resolve content without untangling contact and practice.  

  **Outcome:** Either a new map of the externalist landscape, or proof that its core challenge runs deeper than Twin Earth revealed. No trivial rediscovery.  

  ---  
  *This framework forces existing theories to confront cases they weren’t designed to handle. By making contact, practice, and anchoring* independently variable, *you expose assumptions buried in the literature – and that’s a result whatever the verdicts.*
