  First, I need to recall Anscombe's actual positions. Her famous pamphlet "Mr. Truman's Degree" argues that targeting civilians is murder, emphasizing the intention/foresight distinction. She opposed consequentialism, especially in life-and-death decisions. The user wants a nuanced reconstruction, not a caricature. They’re likely familiar with her work but need help applying it to contemporary issues.

  The user’s deeper need might be to challenge students with Anscombe’s rigor in today’s context. They might want to show how her absolutism confronts modern ethical evolutions, especially in military tech. The mention of "longtermists" and "expected-value arithmetic" suggests they’re interested in how her views clash with utilitarian trends.

  For the responsibility gap, Anscombe would likely see it as a red herring. Her focus on intention means that creating systems that could kill without direct human intent is already wrong. She’d argue that the designers and deployers intend the foreseeable deaths, thus bearing responsibility. Meaningful human control wouldn’t satisfy her if it’s just a procedural fix; she’d demand no intentional targeting of non-combatants.

  On drones, operators foreseeing civilian deaths might not be culpable if they don’t intend it, but only under strict double effect conditions. But she’d be suspicious of remote warfare enabling moral detachment. Autonomous weapons? She’d reject them outright as they bypass human agency in targeting, violating the absolute prohibition against murder.

  Regarding consequentialism, her hunch is correct. She’d dismiss shortening the war or nuclear risk calculations as irrelevant to the intrinsic wrong of killing innocents. Her absolutism offers no room for such trade-offs. The reconstruction here is based on her principles, as she never addressed modern tech, but her ethical framework is consistent.

  The user might also want to provoke discussion on whether Anscombe’s stance is adaptable today. She’d likely critique modern just-war theory for diluting absolute prohibitions with proportionality calculations. Her concessions? Maybe acknowledging technological complexity, but without bending core principles.

