prompt: |-
  Ok so I'm running a small reading group on decision theory and we're doing the Pasadena game next week, and I want to open with the spec rather than the puzzle. Rough setup, in case it's useful: fair coin flipped until it lands heads; if the first heads is on flip n, you win 2^n/n dollars when n is odd and lose 2^n/n when n is even. The expected value is the series of plus and minus 1/n terms, which doesn't settle anywhere — reorder it and you can get any real number, or ±infinity. (Summed in the natural order you get ln 2, which is itself part of the problem.) So the standard rule, pick the option with the highest expected value, just goes silent.

  What I want from you is the desiderata list for a theory of rational choice under this kind of uncertainty: the requirements a theory has to meet to count as adequate here, each with the case or consideration that motivates it, and your call on which requirements are non-negotiable and which are just preferences of one camp. Don't feel bound by my list, these are just the cases I keep coming back to:

  - Pasadena itself. Must the theory return a verdict, or is principled silence fine? And if it's silent, is playing permissible, impermissible, or neither? Silence that quietly becomes permissiveness seems like a bug.
  - Reordering. The value depends on the order of summation, so any rule that picks an order is picking a convention. Is order-invariance non-negotiable?
  - The same game with a dollar added to every payoff (some people call this the Altadena game, I think). Still no expectation, but it obviously beats Pasadena and beats a sure dollar. Any theory that says never play an undefined-expectation game refuses it, which looks like a reductio. Same trick with a million added everywhere.
  - Pasadena mixed 50/50 with its mirror image, where every payoff has the sign flipped. Each component has no expectation; the mixture has a perfectly well-defined expectation of zero. Can a theory treat the parts as unrankable and the whole as worth zero? Is that coherent?
  - St Petersburg as a contrast. Infinite expectation, so a different failure mode, and intution says play. Does a fix for Pasadena keep St Petersburg playable?
  - Finite approximations. Every truncation of the game has a well-defined value, but which truncation you take changes what the values converge to. Must the theory say how the infinite case relates to its finite approximations, and can it do that without privileging a summation order?
  - Forced choice. The usual dodge is that you can always refuse a bad bet. That doesn't work when you have to pick between two undefined options. Does the theory handle that, or does it only handle opt-in lotteries?
  - Description-invariance. Same gamble, described as one draw from an infinite partition versus a sequence of flips resolved in a different order. Verdicts shouldn't turn on bookkeeping.
  - Money versus utility. If the payoffs are already utilities and utility is bounded, the game is well-defined and boring. Is bounding utility a principled constraint or a fiat that dodges the case?
  - Completeness versus restraint. Refuse to privilege any summation order and you probably get massive incomparability; a theory that declares almost everything incomparable stops guiding choice. Is completeness a requirement or a luxury?

  Then flag any pair or trio you think can't be jointly satisfied — I suspect order-invariance plus always giving a verdict plus respecting dominance is one such set, but tell me if I'm wrong and why. And in a few sentences, which going line does best againt the list (canonical-order summation, bounded utility, dominance-only, whatever else there is). No citations, I'll handle references. Cap it at 800 words.
reasoning: |-
  Okay, the user is running a reading group on decision theory focusing on the Pasadena game. They want to start with the specification rather than the puzzle itself. The Pasadena game involves flipping a fair coin until heads appears, with payoffs of +2^n/n for odd n and -2^n/n for even n. The expected value series diverges and can be reordered to yield any real number or ±infinity. This breaks the standard expected value rule, so the user wants desiderata for a rational choice theory under such uncertainty.

  The user provided a list of cases and considerations they want covered: Pasadena itself (verdict or silence?), reordering (is order-invariance essential?), Altadena (adding a dollar to all payoffs), mixing Pasadena with its mirror image, St Petersburg as contrast, finite approximations, forced choice between undefined options, description-invariance, money vs utility, and completeness vs restraint. They also want to know which desiderata conflict and which approaches handle them best.

  Looking at these, the core tension seems to be between requiring definite verdicts and respecting the mathematical indeterminacy. Order-invariance clashes with the need for a verdict and dominance principles. The Altadena game shows dominance must be respected, while the mixture case illustrates that components can be undefined while aggregates are defined. Finite approximations highlight convergence issues depending on truncation point.

  For desiderata, I consider several key principles: verdict requirement (must give permissibility judgment), order-invariance (evaluation independent of payoff sequencing), dominance (Altadena dominates Pasadena and dominates $1), description-invariance (same underlying gamble treated consistently), and continuity (relation to finite cases). There are also pragmatic concerns like avoiding "silent permissiveness" and maintaining comparability.

  The conflicts are stark: order-invariance + verdict + dominance form an impossible trio. Any solution must sacrifice one. Approaches like canonical-order summation (e.g., natural order giving ln2) violate order-invariance but provide verdicts. Bounded utility avoids the issue but seems ad hoc. Dominance-only approaches (like Levi-admissibility) respect dominance but yield incomparability elsewhere.

  For the user's purpose, I'll organize the desiderata clearly, highlight the key conflicts, and evaluate approaches against their list. The Altadena case is particularly damning for theories that reject all undefined-expectation games, while the mixture case challenges component-wise versus aggregate evaluation. I think stressing the forced choice and description-invariance points will strengthen their discussion, as these test the theories' coherence in practical application.
answer: |-
  Here's a desiderata list for rational choice under the indeterminacy exemplified by the Pasadena game, structured by your cases, with conflicts and a brief evaluation of approaches.

  **Core Desiderata & Motivations:**

  1.  **Verdict Requirement (Motivated by: Forced Choice, Guiding Action):** The theory must deliver a permissibility verdict (play/don't play; prefer A to B) in well-specified choice situations, including forced choices between gambles. Principled silence is inadequate for guiding action. *Status: Non-negotiable for a prescriptive theory.*
  2.  **Dominance Respect (Motivated by: Altadena Game):** If Gamble A pays strictly more than Gamble B in every possible state of the world, the theory must strictly prefer A to B. *Status: Non-negotiable.*
  3.  **Order-Invariance (Motivated by: Reordering, Description-Invariance):** The evaluation of a gamble must depend solely on the set of possible outcomes and their probabilities, *not* on the order in which states are described, listed, or summed. *Status: Strongly desirable, core to probabilistic consistency.*
  4.  **Aggregation Consistency (Motivated by: Pasadena Mixture):** If combining two gambles (e.g., mixing 50/50) yields a gamble with a well-defined, finite expectation (like 0), the theory must recognize this aggregate value. It cannot treat the components as utterly incomparable while the whole is clearly evaluable. *Status: Highly desirable; avoids incoherence in compound lotteries.*
  5.  **Continuity / Finite Approximation (Motivated by: Finite Approximations):** The theory must specify how the evaluation of the infinite case relates to its finite truncations. It should ideally justify *why* a particular truncation method (e.g., sequential, by probability, by payoff magnitude) is relevant. *Status: Important for justification and grounding.*
  6.  **Description-Invariance (Motivated by: Description-Invariance):** The evaluation must be invariant under equivalent redescriptions of the same underlying probabilistic structure (e.g., single draw from an infinite partition vs. sequential coin flips). *Status: Non-negotiable; a requirement of rationality.*
  7.  **Boundedness Handling (Motivated by: Money vs Utility, St. Petersburg):** The theory must consistently handle gambles with unbounded utility *and* those with bounded utility. Relying solely on bounded utility as a solution dodges the core problem. It should ideally explain *why* St. Petersburg (infinite expectation) seems playable while Pasadena (undefined expectation) is problematic. *Status: Crucial for generality.*

  **Pragmatic / Structural Desiderata:**

  8.  **Avoid Silent Permissiveness (Motivated by: Pasadena itself):** If the theory is "silent" on a gamble, this silence must not functionally equate to deeming the gamble permissible by default. Silence needs clear implications for choice (e.g., incomparability). *Status: Non-negotiable implication of Verdict Requirement.*
  9.  **Comparability Scope (Motivated by: Completeness vs Restraint):** The theory should strive for sufficient comparability to guide non-trivial choices without resorting to arbitrary conventions. Extreme incomparability is a significant weakness. *Status: Strong preference; a practical necessity for a useful theory.*

  **Key Conflicts:**

  *   **The Impossible Trio:** **Order-Invariance + Verdict Requirement + Dominance Respect** are jointly unsatisfiable for the Pasadena/Altadena class.
      *   *Why:* Dominance requires playing Altadena over Pasadena and over $1. But Order-Invariance implies *no* real number consistently represents Pasadena's value. Providing a definite Verdict for Altadena vs Pasadena (or vs $1) requires assigning them specific values, violating Order-Invariance. Any value assigned to Pasadena privileges an order.
  *   **Aggregation vs. Component Silence:** Treating the Pasadena/Mirror mixture as worth 0 (Aggregation Consistency) while potentially having no defined value for either component challenges theories that demand a verdict for every simple gamble.

  **Evaluation of Approaches (Brief):**

  1.  **Canonical-Order Summation (e.g., natural order = ln2):** Fails **Order-Invariance** and **Description-Invariance** spectacularly. Provides a **Verdict**, handles **Altadena** via dominance (if Altadena uses same order), respects the **Mixture**, relates to one **Finite Approximation**. Poor on **Forced Choice** between different undefined gambles.
  2.  **Bounded Utility:** Solves the problem technically (**Verdict**, **Order-Invariance**, **Dominance**, **Mixture**, **Finite Approx**, **Description-Inv**, **St. Pete**) but fails **Boundedness Handling** - it *imposes* boundedness as a fiat constraint, avoiding rather than resolving the core indeterminacy.
  3.  **Dominance-Only / Levi-Admissibility:** Accepts fundamental **Incomparability**. Satisfies **Order-Invariance**, **Description-Invariance**, **Dominance** (by definition), **Boundedness Handling**. **Verdict Requirement** is partially met: it identifies *admissible* options (undominated) but often cannot rank them. May struggle with **Aggregation Consistency** (is the mixture admissible if components aren't evaluable?) and provides weak guidance (**Comparability Scope**) in complex choices. Handles **Forced Choice** by allowing any admissible choice. **Finite Approximations** become less central justifications.
  4.  **Weak Expectations / Statewise Dominance Refinements:** Attempts to extend Dominance-Only (e.g., requiring statewise dominance over some "status quo" gamble). Can improve **Comparability Scope** slightly but often relies on arbitrary benchmarks or runs into similar problems as canonical order. Difficult to satisfy **Order/Description-Invariance** robustly.

  **Dominance-Only/Admissibility** arguably handles the most *non-negotiable* desiderata (**Order-Invariance, Description-Invariance, Dominance, Boundedness Handling**) at the cost of widespread **Incomparability**, making it the most coherent, if less decisive, approach against your list. **Bounded Utility** "solves" it by changing the subject. **Canonical Order** violates core consistency requirements.
