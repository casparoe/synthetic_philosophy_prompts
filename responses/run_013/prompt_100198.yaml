prompt: |-
  Hey, I'm putting together a short essay for a blog on consequentialist cluelessness and I'd love your comments — I'll paste my notes rather than the messy draft.

  Thesis: cluelessness is fatal for consequentialism but not for deontology. Consequentialism says an act is right just in case it has the best consequences, but chaos theory means any act can have huge unforeseen downstream effects, so we can never actually know an act's consequences, so consequentialism can never tell us what to do. Deontology is the practical theory here, since rules like keep your promises and dont lie can be followed without knowing the future.

  Then I want to argue cluelessness is really just the same thing as moral uncertainty (like not being sure whether eating meat is wrong), and I'll gesture at the simple/complex cluelessness distinction, though I'm probably using it wrong. And my proposed fix is that we should all just become rule consequentialists who follow heuristics, which sidesteps cluelessness altogether.

  Can you tell me how accurate this is and where I'm oversimplifying or flat-out wrong? Be blunt if the whole thesis is confused — I'd rather get that than a polite "nice start."
