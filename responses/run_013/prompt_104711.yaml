    - Then ask for volunteers to share their theory and prediction. We expect linear. If someone proposes something else, we note it.
    - Then reveal: "I have another theory that fits the data equally well: x = t + t(t-1)(t-2). Let's check: at t=0:0, t=1:1, t=2:2. At t=3: 3+3*2*1=9. So it predicts 9."
    - Discuss briefly: "Why did you choose the linear one? What makes it better? Could there be others?"

  20-55 min: Pair 2 activity (adjusting the time: we are behind? Let's reassign time)

  Revised timeline:

  0-5 min: Introduction

  Pair 1:
    5-10 min: Individual work on Pair 1.
    10-15 min: Sharing and reveal.
    15-20 min: Quick discussion.

  Pair 2:
    20-25 min: Distribute the Pair 2 handout (distances) and ask them to work in groups of 4 to assign coordinates to the points.
    25-35 min: Group work.
    35-40 min: Each group reports their coordinates (write on board).
    40-45 min: Reveal that these are all related by rigid motions and thus the same distances. And that even with more points, we cannot break the symmetry.

  45-55 min: General discussion and debrief.

  But we have 90 minutes, so we can extend.

  Alternatively, to save time, we can do Pair 2 in 25 minutes:

    20-30 min: Group work on Pair 2.
    30-35 min: Report.
    35-40 min: Reveal and discussion.

  Then 40-50 min: General debrief.

  Stakes or payoffs:

    We want pressure to commit. We can use:

    - For Pair 1: Announce that the group (or individual) that gets the closest prediction will get a privilege (e.g., choose the next topic or get a token for class participation). But note: if they predict 3 and we reveal 9, then they are wrong. But we want them to commit. Alternatively, we can say that they have to stake their reputation: they must be willing to defend their theory.

    We can frame it as: "You are scientists under pressure to publish your theory and prediction. If your prediction is verified, your theory will be accepted. If not, it will be rejected."

    But we don't have future data. We are not going to collect real data. So we can't verify.

    Instead, we can have them write their prediction publicly on the board. Then the reveal will show that they could have been wrong if we had taken more data.

    For Pair 2, the pressure is to get a unique answer? But there isn't one.

    We can say: "You are a team of surveyors and you have to assign coordinates to these points. Your company expects a single, unambiguous answer."

    Then they will be motivated to choose one, even though there are many.

  Handling a student who defends a third model:

    In Pair 1, a student might propose a different model, e.g., x = t^2 - 3t + 2. But at t=0: 2, doesn't fit. Or they might propose a step function. But we have to check if it fits the data.

    We will say: "Does your model fit all the given data? Let's check." If it does, then we include it. But then we reveal that there are at least two (or more) models that fit.

    In Pair 2, if a group assigns coordinates that are not a rigid motion of the others, then we can check the distances. If they are correct, then it must be a rigid motion or reflection. In the plane, two sets of points with the same pairwise distances are related by a rigid motion (isometry). So it will be in the same equivalence class.

  Debrief:

    We need to highlight:

    - The gap between evidence and theory: the data we have does not logically entail one theory over the other.
    - The role of theoretical virtues: simplicity (linear vs cubic), or in Pair 2, the choice of coordinate system is arbitrary.
    - The difference between weak and strong underdetermination:
          Pair 1: Weak - we can break the tie by a new observation (at t=3).
          Pair 2: Strong - no observation (of distances) can break the tie.

    And we have to be frank about one feature that the activity cannot reproduce: 

        In the strong underdetermination case, we are assuming that we can only measure distances. In reality, if we could measure absolute position (relative to a fixed background) then we could break the tie. But we have defined the background as unobservable. We have to explain that in science, we often have to choose what is observable. The underdetermination arises because of the choice of observable quantities.

    The obstruction for strong underdetermination in general is that it requires a global symmetry that makes the two theories physically equivalent. In the activity, we have simulated it by restricting to distance measurements. But in reality, if there were a way to break the symmetry, then it wouldn't be strong. So we have to carefully choose the observable.

  Three ways it can go wrong:

    1. Students may not be able to come up with any theory for Pair 1. Solution: Have a backup, such as prompting with "What is the simplest pattern you see?" or providing an example theory.

    2. In Pair 2, students may not understand how to assign coordinates. Solution: Provide graph paper and a brief explanation: "You are to place three points in the plane such that the distances between them are AB=5, BC=4, AC=3. Assign coordinates to each point."

    3. The reveal for Pair 1 might not be surprising because the cubic model might seem artificial. Solution: Acknowledge that, and ask why they didn't propose it. Then discuss theoretical virtues (simplicity).

  Let's write the debrief explicitly:

  Debrief:

    Pair 1:
      - The data was consistent with at least two theories: linear and cubic.
      - The linear theory is simpler and thus preferred, but the data alone did not force this choice.
      - This is weak underdetermination because a new observation (at t=3) could distinguish them.

    Pair 2:
      - The data (distances) was consistent with many coordinate assignments.
      - These assignments are related by rigid motions (isometries) and thus preserve the distances.
      - No future measurement of distances can break the underdetermination because the symmetry applies to any new point: its position is only defined up to the same rigid motion.
      - This is strong underdetermination.

    Then we draw out the philosophical points:

      - Underdetermination: the evidence does not uniquely determine the theory.
      - Theoretical virtues (simplicity, elegance, familiarity) are used to break ties, but they are not dictated by the evidence.
      - The difference between weak and strong underdetermination: weak can be broken by new evidence; strong cannot.

    The one feature the activity cannot reproduce is the global aspect of strong underdetermination. In the activity, we only have three points, but we claimed that the underdetermination holds for any number of points. We have to explain that this is a consequence of the symmetry of the laws (here, the Euclidean geometry) and that we are assuming that the symmetry holds globally. In a real scientific theory, the strong underdetermination arises from a global symmetry (like gauge invariance or general covariance) that makes the theories physically equivalent. We cannot demonstrate an infinite set of points in the activity, so we rely on the mathematical principle.

    Three predictable problems and solutions:

      1. Problem: Students might be hung up on the cubic model in Pair 1, arguing that it is contrived.
         Solution: Acknowledge that it is more complex, and that scientists often prefer simpler models. This is exactly the point: we use extra-empirical criteria to choose.

      2. Problem: In Pair 2, students might propose using a fixed coordinate system (e.g., using the fixed stars) to break the underdetermination.
         Solution: Explain that in our activity, we have defined the observable as only the distances, so any fixed background is not available. In science, what counts as observable is part of the theory.

      3. Problem: The activity may run short or long.
         Solution: Keep a close eye on time. If short, have a discussion on other examples. If long, cut the group work short and have fewer groups report.

  Now we write the materials and step-by-step.
answer: |-
  ### Classroom Activity: The Theory Underdetermination Challenge  
  **Duration:** 90 minutes  
  **Students:** 16 (no prior reading)  
  **Goal:** Experience underdetermination of theory by evidence through two pairs of rival models, contrasting weak (future-observable) and strong (permanently unobservable) underdetermination.  

  ---

  #### **Materials**  
  1. **Handout 1 (Pair 1 - Weak Underdetermination):**  
     - Table of data:  
       | Time (t) | Observation (x) |  
       |----------|-----------------|  
       | 0        | 0               |  
       | 1        | 1               |  
       | 2        | 2               |  

  2. **Handout 2 (Pair 2 - Strong Underdetermination):**  
     - Distances between three points:  
       - AB = 5 units  
       - BC = 4 units  
       - AC = 3 units  

  3. **Additional Tools:**  
     - Graph paper (for Pair 2 group work)  
     - Whiteboard for group predictions  
     - Timer  

  ---

  #### **Roles and Rules**  
  - **No fixed roles.** Students work individually (Pair 1) and in groups (Pair 2).  
  - **Rules:**  
    - **Commitment Pressure:** Students must publicly write their theory/prediction on the board. The "stake" is **scientific reputation**: If their prediction is "verified" (matches the facilitator’s hidden model), their theory is "accepted" (symbolic victory). If not, it is "falsified" (gentle ribbing).  
    - **No New Data:** Only the given data may be used; no external knowledge (e.g., Occam’s razor) is banned, but students must justify choices.  
    - **Reveal Moment:** After predictions, the facilitator unveils the rival model.  

  ---

  #### **Timeline (90 Minutes)**  
  **0–5 min: Introduction**  
  - Frame the activity: "You are scientists discovering laws from data. Propose a theory that fits all observations, predict the next data point, and defend it."  
  - **Key Vivid Feature:** Gap between evidence and theory.  

  **5–25 min: Pair 1 - Weak Underdetermination**  
  - Distribute **Handout 1**.  
  - **Task (5 min):** *Individually*, state a theory (formula/rule) and predict \( x \) at \( t = 3 \). Write both on the board.  
  - **Pressure:** Emphasize: "Your reputation hinges on your prediction!"  
  - **Expected Responses:** 95% will pick linear theory (\( x = t \)), predicting \( x = 3 \).  
  - **Reveal (5 min):** Show the cubic rival: \( x = t + kt(t-1)(t-2) \). For \( k=1 \), \( x=9 \) at \( t=3 \).  
    - Both models fit all given data but diverge at \( t=3 \).  
  - **Discussion (5 min):** "Why did you commit to linearity? Could another theory fit? What makes yours better?"  
  - **Key Vivid Features:**  
    - Evidence alone doesn’t force a choice (underdetermination).  
    - Theoretical virtues (simplicity) act as tie-breakers, not deductions.  

  **25–50 min: Pair 2 - Strong Underdetermination**  
  - Distribute **Handout 2**. Divide into 4 groups.  
  - **Task (10 min):** As a *group*, assign coordinates to points A, B, C in 2D space. Graph and write coordinates on the board.  
  - **Pressure:** "Your survey company demands a unique, precise answer!"  
  - **Expected Responses:** Groups pick different coordinate systems (e.g., A at (0,0), B at (5,0), C at (1.8, 2.4) or A at (1,1), B at (6,1), C at (2.8, 3.4)).  
  - **Reveal (5 min):** Show all coordinate systems are related by rigid motion (translation/rotation). Calculate distances: all yield AB=5, BC=4, AC=3.  
    - **No observation (even with new points) can break symmetry** if only distances are measurable.  
  - **Discussion (5 min):** "Why did your coordinates differ? Could you ever prove yours is ‘true’ with more distance data?"  
  - **Key Vivid Features:**  
    - Strong underdetermination: No possible observation can distinguish theories.  
    - Theories are empirically equivalent due to symmetry (rigid motion invariance).  

  **50–75 min: Debrief**  
  - **Contrast the Pairs (10 min):**  
    - **Pair 1 (Weak):** Divergence at \( t=3 \) shows underdetermination is *temporary*. New data (e.g., \( t=3 \)) breaks the tie.  
    - **Pair 2 (Strong):** Rigid motion symmetry makes underdetermination *permanent*. All observations (present/future) are identical.  
  - **Philosophical Insights (10 min):**  
    1. **Evidence-Theory Gap:** Data constrains but doesn’t dictate theory.  
    2. **Tie-Breakers:** Simplicity/parsimony (Pair 1) and conventions (distance-only observables in Pair 2) resolve underdetermination.  
    3. **Revising Background Assumptions:** In Pair 2, adding "absolute position" as observable breaks symmetry—but this is a *choice*, not evidence.  
  - **Frank Admission (5 min):**  
    - **Unreproducible Feature:** Global symmetry (strong underdetermination) relies on assuming *all possible observations* obey the same invariance.  
    - **Why Staging Is Impossible:** Demonstrating infinite future observations is infeasible. We use math (rigid motion proof) to *simulate* permanence.  

  **75–90 min: Q&A and Reflections**  
  - Open floor for questions, real-world examples (e.g., heliocentric vs. geocentric models with relative motion).  

  ---

  #### **Handling Unanticipated Models**  
  - **Scenario:** A student proposes a third model (e.g., for Pair 1: \( x = |t-1| + 1 \) predicting \( x=3 \) at \( t=3 \)).  
  - **Response:**  
    1. **Validate:** "Does it fit all given data? Let’s check: at \( t=0 \), \( |0-1|+1=2 \), but data says 0. Rejected!"  
    2. **Incorporate:** If it fits (e.g., \( x = t \) for integers only), add it as a *third rival*. Highlight: "This deepens underdetermination!"  

  ---

  #### **Predictable Problems and Solutions**  
  1. **Problem:** Students cannot derive theories (e.g., struggle with Pair 2 coordinates).  
     **Solution:** Provide hints: "Sketch a triangle with sides 3,4,5" or "Place point A at (0,0), B at (5,0)."  

  2. **Problem:** Students resist committing (e.g., "All models are equally good!").  
     **Solution:** Increase stakes: "In real science, you must commit to test predictions. Write one theory or your ‘survey company’ fires you!"  

  3. **Problem:** Post-reveal debate dominates, derailing the timeline.  
     **Solution:** Park discussions: "This is a key insight—let’s explore it in debrief." Use a timer strictly.  

  ---

  **Outcome:** Students confront underdetermination experientially. Pair 1 reveals the *provisionality* of theory choice; Pair 2 exposes the *conventionality* of interpretation when symmetries hide truth. The debrief crystallizes philosophy from their frustration.
