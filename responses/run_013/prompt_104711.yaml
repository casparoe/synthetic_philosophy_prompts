  We are designing a classroom activity for a philosophy of science seminar. The goal is for students to encounter the underdetermination of theory by evidence without prior knowledge of the concept. The activity will use two pairs of rival models. The first pair will be empirically equivalent only so far (future observations could separate them) and the second pair will be empirically equivalent in a stronger sense (no observation could tell them apart). 

  We'll use a finite set of observational data. The students will be given the data and asked to propose a theory that explains the data and to make a prediction for the next data point. The twist is that there are two pre-constructed models that fit all the given data but make different predictions for the next point (for the first pair) or are indistinguishable by any observation (for the second pair). 

  We need two pairs of models:

  Pair 1 (weak underdetermination): Models that agree on all given data but differ on some future prediction. Example: linear vs quadratic models that are identical at the given points but diverge elsewhere.

  Pair 2 (strong underdetermination): Models that are observationally equivalent. Example: two theories that are isomorphic in terms of observable predictions. However, note that constructing a genuine example of strong underdetermination that is evident in a finite set of data is challenging. We might use a trick with unobservable entities or conventions. One classic example is the underdetermination between a geocentric and heliocentric model if we only consider relative positions (without absolute space). But for simplicity and within the constraints of a 90-minute activity, we might use a more elementary example.

  However, note: it is difficult to create a pair of models that are empirically equivalent in the strong sense (no observation can tell them apart) without introducing unobservable entities or conventions. For the strong pair, we can use a simple example with two theories that are interdefinable, such as:

  Example for strong underdetermination: 
    Theory A: The world is as we see it. 
    Theory B: There is a demon who systematically alters our perceptions in such a way that we see exactly what we see, but the demon is undetectable. 

  But this might be too abstract. Alternatively, we can use a mathematical example with a simple transformation that leaves the data invariant. However, in a finite set of data, it is hard to show that no future observation can tell them apart. Therefore, we might have to admit that we cannot honestly build a strong underdetermination example in this activity and instead explain the obstruction.

  But let's try:

  Pair 2: We can use a simple example with a constant function and a periodic function that coincide at the observed points. However, with future observations we can tell them apart. So that is weak again.

  For strong underdetermination, we need a pair that is empirically equivalent for all time. One idea is to use a symmetry. For example:

    Theory 1: The data is generated by a function f(t).
    Theory 2: The data is generated by f(t) + g(t) where g(t) is a function that is zero at all observed times and non-zero elsewhere? But that is not empirically equivalent for all time because we can check at a new time.

