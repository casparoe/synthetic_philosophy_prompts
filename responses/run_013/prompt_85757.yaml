prompt: |-
  hi! im in yr12 and i need a poem for the school lit mag, philosophy club edition. its on vagueness, the sorites thing with the heap and the bald guy, but i really dont want the poem everyone writes where its just "one grain cant make a heap" said five times and then a clever last line. what i want instead is it done on something that actually happens to people, like how many times a friend can flake on you before there not really your friend anymore, or how many late homeworks before your not "a student who does the work". and i want the form to carry it, not just the words: give me 14 to 16 lines, no rhyme scheme needed, but with one line that repeats word for word every few lines, and that repeated line has to be the "one more cant possibly change it" move. the key bit is the poem must never have a stanza where you can point at it and say thats where it happened — no flip, no turn, nothing to circle — and by the end that repeated line should sound obviously false even though its the exact same words. it also has to stay out of the argument about whether theres a line but we just cant see it vs theres really no line at all, and same for the edge of the edge (is there a line between "definately still my friend" and "sort of drifting"?) cause thats still being fought over and the poem shouldnt pretend its settled either way. no ending where it goes all "and thats ok, vagueness is beautiful". if someone whos done this stuff in a seminar reads it they should nod, not wince. and not too depressing pls, its a lit mag lol
