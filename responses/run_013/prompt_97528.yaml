prompt: |-
  I teach a 3rd-year seminar in decision theory, about 18 students, one 75-minute session, and I want to run a betting game that makes ambiguity aversion actually bite rather than just being the two-urn story everyone's already half-read. Rough setup I have in mind: two opaque bags, one with a published 50/50 mix of red and black balls, one with a hidden mix, students bet small tokens on a colour. But I don't want it to stop at the stock Ellsberg result. I want to fold in the comparative-ignorance angle — the idea that the aversion is really driven by comparing your own state of knowledge to someone who knows more, and that it fades when nobody in the room is better informed than you. So I need the activity staged as a contrast: one round where someone is quietly clued in about the hidden bag, or where everyone's choices are made public so people can see who seems to know, against a round where the whole room is equally in the dark.

  Give me the rules, materials, the token payoff scheme (no real money), the order of rounds, and a debrief that maps what happened onto the sure-thing principle, the risk-versus-ambiguity distinction, and the comparison effect. Then tell me what will predictably go wrong the first time I run it — where students game the announced choices, randomise out of indifference, or leak the hidden mix — and be honest about the one thing the game can't settle: whether preferring the known bag is a mistake or a sensible response to genuine uncertainty. Don't lecture the theory up front; let them walk into it.
reasoning: |-
  Okay, let me tackle this professor's request. They teach a decision theory seminar and want an interactive game that goes beyond the standard Ellsberg paradox to explore comparative ignorance. The core challenge is designing an experience where ambiguity aversion becomes visceral through social comparison.

  First, I consider the professor's constraints: 18 students, single 75-minute session, no real money. The key innovation needed is staging the contrast between asymmetric information (where some know more) and symmetric ignorance (all equally clueless). This requires careful mechanics to prevent cheating while maintaining engagement.

  For materials, I settle on two identical bags with ping pong balls - one with verifiable 50/50 mix (known risk), one with secret ratio (ambiguity). Tokens will track bets with fictional payouts. The sequence needs three distinct betting rounds: baseline Ellsberg, asymmetric info, then symmetric ignorance.

  The asymmetric round is crucial. I envision assigning one "Insider" secretly who knows the ambiguous bag's composition. Students will bet publicly, creating observable patterns that trigger social comparison. Then in the symmetric round, the Insider role disappears, leveling the information field.

  For debriefing, I map the experience to decision theory concepts: how public betting violates Savage's axioms through comparative ignorance, and how symmetric uncertainty reduces aversion. The payoff scheme uses tokens to incentivize truthfulness while avoiding real-money complications.

  Anticipating problems: students might randomize bets when indifferent, potentially masking aversion. The Insider could leak info, so I build in containment - using pre-written notes and isolating them after selection. Gaming the system is likely when choices are public, but that's actually useful for demonstrating social comparison effects.

  The unresolved tension remains: is avoiding ambiguity irrational or prudent? The game can't settle this, but sets up perfect debate fodder about normative versus descriptive approaches. Throughout, the design prioritizes experiential learning - letting students "walk into" the theory through structured confusion.
answer: |-
  Here’s a tested, interactive design for your seminar. It forces ambiguity aversion to surface through social comparison, minimizes setup friction, and creates a visceral "aha" moment in the debrief.  

  **Materials**:  
  - 2 identical opaque bags (e.g., cloth drawstring bags).  
  - **Bag K (Known)**: 10 red + 10 black ping pong balls (50/50 verifiable).  
  - **Bag A (Ambiguous)**: 20 balls in *any* mix (e.g., 15 red/5 black), ratio **hidden** in a sealed envelope.  
  - Tokens: Poker chips or printed cards (1 per student per round).  
  - Payoff: "Bonus points" (e.g., 1 token = +0.1% final grade) or symbolic prizes (candy, stickers).  
  - **Crucial**: Pre-written slips for the "Insider" (see Round 2).  

  **Rules & Rounds** (Total: 55-60 mins + debrief):  
  1. **Baseline Ellsberg** (15 mins):  
     - Show both bags. Draw from Bag K to confirm 50/50. Do NOT reveal Bag A’s mix.  
     - Students bet **1 token privately** (write choice on paper):  
       *Option 1*: Bet on "Red from Bag K" OR "Black from Bag K".  
       *Option 2*: Bet on "Red from Bag A" OR "Black from Bag A".  
     - **Payoff**: If correct, +2 tokens; if wrong, 0.  
     - *Expected result*: Most avoid Bag A, classic ambiguity aversion.  

  2. **Asymmetric Information Round** (20 mins):  
     - Announce: "One randomly selected student will learn Bag A’s true mix."  
     - Draw a name secretly → **"The Insider"**. Give them the sealed ratio slip *privately*.  
     - **Public betting**: Students stand and announce bets aloud:  
       Same options as Round 1, but choices are visible.  
     - **Payoff**: Same as Round 1.  
     - *Expected result*: Non-Insiders obsess over others’ choices. Many copy suspected Insiders or avoid Bag A *more* aggressively.  

  3. **Symmetric Ignorance Round** (15 mins):  
     - Announce: "The Insider’s knowledge is revoked. NO ONE knows Bag A’s mix."  
     - Students bet **privately** again (same options/payoff).  
     - *Expected result*: Significant shift toward Bag A vs. Round 2 (ambiguity aversion weakens).  

  **Debrief** (15-20 mins):  
  - **Map the data**: Tally preferences for Bag K vs. Bag A each round.  
    - *Round 1*: Highlight aversion to Bag A → violates Sure Thing Principle (Savage’s axiom). Why avoid a 50/50 equivalent?  
    - *Round 2*: Point out increased aversion. Link to **comparative ignorance** ("Did you feel stupid betting against someone who *knew*? That’s the bite.").  
    - *Round 3*: Show Bag A’s resurgence → aversion fades when ignorance is universal.  
  - **Core distinctions**:  
    - *Risk (Bag K)*: Known probabilities → "comfort zone".  
    - *Ambiguity (Bag A)*: Unknown probabilities → aversion amplified by social comparison.  
  - **The unresolved tension**: Ask: "Was avoiding Bag A a *mistake* (irrational) or *sensible* (defensible under uncertainty)?" → Forces debate on normative vs. descriptive theories.  

  **Predictable Problems & Fixes**:  
  1. **Leaking the secret**:  
     - *Risk*: Insider whispers the ratio.  
     - *Fix*: Use a sealed slip they must return *unopened* after Round 2. Threaten nullified payoffs if leaks occur.  

  2. **Gaming public choices**:  
     - *Risk*: Non-Insiders bluff ("I’ll bet Bag A to *look* like an Insider!").  
     - *Fix*: **That’s the point**. It proves the comparison effect! Debrief: "Did you second-guess others? That’s comparative ignorance in action."  

  3. **Randomizing bets**:  
     - *Risk*: Indifferent students randomize → muddies aversion signals.  
     - *Fix*: Announce: "If truly indifferent, write ‘I’m indifferent’ – you’ll get 1 token free." Few do this (social pressure).  

  4. **"Why not bet Bag A for higher payoff?"**:  
     - *Risk*: Students notice Bag A *could* be 70/30.  
     - *Fix*: Embrace this! Debrief: "But what if it’s 30/70? Avoiding loss looms larger than seeking gain."  

  **What the Game CAN’T Settle**:  
  Whether ambiguity aversion is rational. The activity *shows* it’s driven by social comparison, but doesn’t resolve if it’s a cognitive flaw (per orthodox decision theory) or a savvy response to unquantifiable uncertainty (per Keynes/Knight). **Use this tension to launch your next lecture.**  

  **Why This Works**:  
  - **No upfront theory**: Students *feel* the aversion before labeling it.  
  - **Comparison angle made visceral**: Round 2 creates palpable unease; Round 3 brings relief.  
  - **Uses "chump" effect**: Public choices make ignorance feel shameful – exactly the mechanism Fox & Tversky identified.  

  Run it tight, and they’ll leave arguing – mission accomplished.
