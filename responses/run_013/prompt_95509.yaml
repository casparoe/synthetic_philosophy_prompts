answer: |-
  Here's a breakdown of the core desiderata for an adequate theory of convention (in the Lewisian/coordination-problem sense), designed to meet your specific needs. I've structured it to clearly flag settled ground, contested points, tensions, and the rationale behind each requirement.

  **The Core Desiderata (The Non-Negotiables):**

  These are widely accepted as *necessary* for something to be a convention (as opposed to a mere regularity, norm, etc.), though *how* they are satisfied is hotly debated.

  1.  **Solves a Coordination Problem:**
      *   **What it delivers:** Must explain how the convention resolves a recurring situation where individuals have a *common interest* in coordinating their actions (everyone wants *some* coordinated outcome), but *multiple, distinct* coordinated equilibria are possible (several specific outcomes would work equally well *if* everyone did it).
      *   **Case/Rationale:** Driving side (left/right), language (which sound means "dog"), currency (what counts as money), meeting points. Without a coordination problem element, it's just a habit or norm. Distinguishes it from pure conflict games (like Prisoner's Dilemma) or pure harmony games (where only one best outcome exists).
      *   **Settled Status:** Highly settled. This defines the *type* of problem conventions solve.

  2.  **Arbitrariness (Replaceability):**
      *   **What it delivers:** Must explain why *this specific* solution prevails, even though *at least one other distinct solution* would have worked just as well *before* the convention was established. The convention itself makes the chosen option salient/binding, *not* its inherent superiority.
      *   **Case/Rationale:** Driving on left *vs.* right (neither is inherently better for coordination pre-convention); "Hello" *vs.* "Hola" for greeting; QWERTY *vs.* Dvorak keyboard layouts (pre-adoption). Explains why we drive on the *established* side even if the other might *now* seem slightly better for some reason (e.g., dominant hand). **Crucially distinguishes convention from non-arbitrary coordination** (e.g., everyone converging on the *only* bridge across a chasm – no alternative exists).
      *   **Settled Status:** Highly settled as a defining *feature*. The point of major contention is *how strict* this arbitrariness is (must *all* alternatives be *exactly* equal initially? Or just "good enough"?).

  3.  **Dependence on Mutual Expectations:**
      *   **What it delivers:** Must explain that individuals follow the convention primarily *because* they expect others to follow it, and they expect others to expect them to follow it (and so on, to some degree). The expectations *sustain* the behavior.
      *   **Case/Rationale:** You drive on the right because you expect others to, and you know they drive on the right because they expect you (and others) to. If everyone suddenly expected a switch (like Sweden), behavior changes. **Distinguishes convention from:**
          *   **Mere Regularity:** (e.g., everyone eats lunch at noon) – not sustained by expectations *about the regularity itself* coordinating actions.
          *   **Norm Held by Sanctions:** (e.g., wearing a tie) – sustained by fear of disapproval, *not* primarily by the expectation that others wear ties *in order to coordinate*. (Sanctions *can* reinforce conventions, but the core engine is expectation).
      *   **Settled Status:** Settled that expectations are central. **MAJOR CONTENTION:** The *degree* of expectation and cognitive sophistication required (see "The Big Tension" below).

  4.  **Path-Dependence & Inertia:**
      *   **What it delivers:** Must explain how the convention gets established in the first place (often from small beginnings, accidents, or asymmetry) and why it persists ("locks in") even if a *different* convention would *now* be slightly better for everyone ("Pareto superior"). Must also explain how *switching* can occur despite this inertia (like Sweden!).
      *   **Case/Rationale:** QWERTY keyboard persisting despite Dvorak's potential efficiency; driving side inertia; VHS vs. Betamax. Sweden switching required massive coordinated publicity, education, and a specific switchover moment – overcoming inertia is hard! Explains why suboptimal conventions can stick.
      *   **Settled Status:** Settled that conventions exhibit path-dependence and inertia. Contention exists over the *mechanisms* of initiation (salience, precedent, imitation, payoff-biased learning) and switching (critical mass, top-down intervention, gradual drift).

  **Important, But Contested or Nuanced Desiderata:**

  These are often seen as requirements by specific camps or involve significant debate about how they manifest.

  5.  **Emergence Without Explicit Agreement:**
      *   **What it delivers:** Must explain how conventions arise spontaneously among agents who may not communicate directly, lack a central authority, and certainly never sat down and formally "agreed" to the rule.
      *   **Case/Rationale:** Driving conventions evolving in disparate regions; language emergence; traffic flow in crowds. Core to the puzzle of social order without design.
      *   **Settled Status?** Settled that conventions *can* and often *do* emerge this way. **Contention:** Rational-choice models (Lewis) emphasize tacit agreement via rational response to expectations (which *is* a kind of agreement). Evolutionary models (Skyrms, Young) emphasize learning, imitation, and stochastic dynamics *without* requiring agents to explicitly reason about expectations as such. Whether "agreement" (even tacit) is *necessary* is debated.

  6.  **Accommodating Sanctions, Imitation & Evolutionary Stability:**
      *   **What it delivers:** Must explain the relationship between convention and other sustaining mechanisms. How does behavior change when sanctions (punishment for driving on the wrong side) or strong imitation ("monkey see, monkey do") become the *primary* driver? How does a convention relate to an Evolutionarily Stable Strategy (ESS) where no mutant strategy can invade?
      *   **Case/Rationale:** Driving on the correct side is *both* conventional (expectations) *and* often sanctioned (fines). Wearing a business suit might start as convention but become a strictly enforced norm. Imitation drives fashion conventions. Many conventions *are* ESSs, but not all ESSs are conventions (e.g., pure conflict ESSs).
      *   **Settled Status:** Highly contested. Lewisians argue sanctions/strong imitation *transform* the practice into a *norm* distinct from pure convention. Evolutionary game theorists see sanctions/imitation as *learning mechanisms* or *stabilizing forces* that can *reinforce* the conventional equilibrium within the coordination framework. **Key Question:** Is the core *reason* for compliance expectation-based coordination, or something else? Theories differ.

  7.  **Scalability & Population Dynamics:**
      *   **What it delivers:** Must explain how conventions spread through populations and stabilize at large scales, and how individuals entering the population (new drivers, children) learn the convention. Should ideally handle heterogeneous populations.
      *   **Case/Rationale:** How a local driving practice becomes national; how language conventions are transmitted to new generations.
      *   **Settled Status:** Generally accepted as important. Contention exists over mechanisms: rational-choice models emphasize networks of mutual knowledge/beliefs; evolutionary models emphasize imitation, learning dynamics, and population turnover.

  **The Big Tension (You Called It!):**

  *   **Common/Belief Knowledge (Lewis Camp) vs. Explaining Conventions in Simpler Agents (Evolutionary Camp):**
      *   **The Tension:** Lewis's core definition requires agents to have *reason* to follow the convention based on *mutual expectations* (I follow because I expect you to follow, I expect you to follow because you expect me to follow...). This implies high-order beliefs (beliefs about beliefs) and rationality – **common knowledge** or **mutual belief** is often seen as necessary. This struggles to explain conventions in animals, young children, or large/complex societies where such sophisticated cognition is implausible. Evolutionary models (Skyrms, Binmore, Young) show how conventions can emerge from simple reinforcement learning, imitation, or random matching dynamics *without* agents needing to form explicit expectations about others' expectations or even understand the coordination problem. They follow because it "worked" before or they copied someone successful.
      *   **Is it a Genuine Result?** Absolutely. This is a fundamental divide in the field. The Lewisian camp argues that without the cognitive element of expectations guiding rational choice, you lose the *distinctive* nature of convention (especially its arbitrariness and the binding force of mutual expectation). The evolutionary camp argues that Lewis's requirements are too demanding to explain the *actual prevalence* of convention-like phenomena and that their models capture the core functional outcome (sustained coordination on an arbitrary equilibrium) with more plausible cognitive foundations. **This is the core unresolved debate.**

  **Which Requirement Rules Out Popular Accounts?**

  *   **Arbitrariness (Replaceability)** does the most heavy lifting here. Many popular or intuitive "accounts" of conventions fail this test:
      *   **"It's the Best Option" Accounts:** Rules out explanations claiming we drive on the right *because* it's inherently safer/better (if it were demonstrably better, it wouldn't be arbitrary; driving side is a paradigmatic convention).
      *   **Functionalist Accounts:** Rules out claims that conventions exist *because* they are socially optimal. While they *solve* a problem, their *specific form* isn't explained by optimality – suboptimal conventions (QWERTY) exist and persist.
      *   **Natural Law/Inherent Meaning Accounts:** Rules out claims that words or symbols have inherent, non-arbitrary connections to their meanings. The arbitrariness of linguistic signs is foundational.
      *   **Simple Efficiency Accounts:** Rules out claims that conventions are just the simplest or most efficient way – often, they are not (again, QWERTY).

  **Summary of Key Contours:**

  *   **Settled:** Conventions solve coordination problems, are arbitrary (replaceable), depend on mutual expectations (in some form), and exhibit path-dependence/inertia.
  *   **Core Contention:** The **cognitive and epistemic requirements** for agents (Common Knowledge/Rational Expectations vs. Simple Learning/Imitation). This fundamentally shapes how theorists address emergence, scalability, and the role of sanctions/imitation.
  *   **Other Contentions:** Strictness of arbitrariness; whether sanctions/imitation transform conventions into norms or are compatible reinforcements; precise mechanisms of initiation and switching.
  *   **Key Tension:** Common Knowledge requirement vs. Explaining conventions in cognitively simple agents/populations.
  *   **Popular Account Killer:** Arbitrariness.

  This list gives you the critical framework to structure your "state of the question" around the criteria and the fault lines in the debate, without papering over the genuine disagreements, especially that central cognitive tension. Good luck with your final! Sweden is a fine example for inertia/switching, just acknowledge the massive coordination effort required.
