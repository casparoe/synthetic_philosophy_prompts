prompt: |-
  Okay so I'm taking this seminar that started with Lewis on convention and then moved into the more evolutionary, game-theoretic work on how norms and conventions actually get off the ground, and for my final I have to write a "state of the question" thing that's really about the criteria rather than the answers. So what I want from you is the desiderata -- what does any adequate theory of convention actually have to deliver? Not convention in the loose everyday sense, but convention as a solution to a coordination problem: how you'd distinguish it from a mere regularity that just happens to hold, from a norm that's held up by sanctions or disapproval, and from coordination that isn't conventional at all because the option everyone converged on is simply the best one. Give me the list of requirements, each with the case or consideration behind it. The stuff I keep bumping into and want the list to cover: how a convention gets going among people who never agreed to anything and might not even be able to communicate; why it's arbitrary that we drive on one side of the road rather than the other, and yet once it's in place the arbitrariness doesn't make it any less binding; how a convention can stick around even when a different one would be better for everyone, and how an entire population can switch over (I keep using Sweden flipping which side of the road it drives on as my example, though I'm not sure it's a fair one); and what actually changes when the thing keeping the behavior going isn't mutual expectation but sanctions, or imitation, or just the fact that it's evolutionarily stable with nobody thinking about it at all. Also tell me which requirements are non-negotiable and which are just the commitments of one camp -- the rationality-and-common-knowledge crowd versus the evolutionary crowd -- and flag any pair of desiderata you suspect can't be jointly satisfied. I have a hunch that the common-knowledge requirement and the "explain conventions in creatures that have no common knowledge" requirement are in genuine tension, and I'd like to know whether that's a real result or just me. And if you can, tell me which single requirement does the most to rule out the popular accounts.

  One thing I care about a lot here: separate what's actually settled among people who work on this from what's genuinely contested, and dont serve me a contested reading as if it were the consensus. I'd rather have a shorter, honest list that flags the live disagreements than a tidy one that papers over them. And it's going to a US audience, so please write in American English, and skip the bibliography -- I can find sources myself.
