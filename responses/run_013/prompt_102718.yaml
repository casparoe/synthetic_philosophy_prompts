prompt: |-
  I'm the faculty rep on my uni's academic accomodations appeals panel and we've got a case this week that's splitting the room. A third-year student with a severe acquired memory impairment (encephalitis a few years back, he can't reliably hold onto new material for more than a few hours) already has extra time and a note-taker approved. Now he's asking to bring into a closed-book exam the setup he wears all day: a smartwatch paired to his phone, running an app that continuously records and transcribes, dumps everything into a personal knowledge base, and then surfaces relevant snippets and generates little summaries and practice questions on the fly. Here's the wrinkle that's got people going: his two closest study partners have write access to that same knowledge base, and he to theirs, so a decent chunk of what's in there is stuff the three of them contributed to each other, and the summaries are machine-generated, not just his own notes handed back to him. He says this isn't a crib sheet, it's his memory, it's as much a part of how he thinks as his own head is, and taking it away is like confiscating part of his brain. The exams office says closed-book means closed-book, full stop, and that if we let this in we have to let in everyone's phone and the whole category collapses. One of my colleagues half-remembers some criteria from a philosophy course — that a tool only really counts as part of your mind if it's always there when you need it, instantly accessible, automatically trusted rather than consulted, and endorsed without deliberation — and wants us to just test the case against those four boxes; I'm not sure that's the right test and I'd like your view folded in.

  Please draft the short written opinion I'll circulate before Friday's meeting. Recommend a concrete outcome — allow, deny, or allow with conditions — and if it's conditions, spell out exactly what they'd be and how we'd actually enforce them, in a way an exam invigilator could follow. Don't just fall back on the familiar Otto-and-his-notebook thought experiment; genuinely take his claim that the setup is part of his cognition seriously, and genuinely take the exams office's integrity and parity worry seriously, including whether the shared, machine-generated part of the knowledge base changes the picture compared to a private notebook. I want you to commit to a position and defend it rather than laying out options for us to pick from. Lead with the bottom line in your first sentence, then the reasoning, and skip the preamble and the restating of the question.
reasoning: |-
  Okay, let me unpack this academic accommodations appeal. The core tension here is between recognizing the student's neurological reality and maintaining exam integrity. 

  First, I need to fully grasp what makes this case unique: it's not just about assistive tech, but about a shared, AI-processed knowledge base that blurs traditional boundaries of "external aid." The exams office's "slippery slope" concern feels valid but reductive - comparing this to general phone use ignores the student's specific neurocognitive architecture. 

  That philosophy colleague's criteria (constant availability, automatic trust, etc.) actually provides a useful framework if we apply it rigorously: 
  - The device is indeed always present per medical documentation
  - The seamless transcription suggests near-instant access
  - His dependence indicates automatic trust
  - But the shared content introduces deliberation - he'd need to verify others' contributions

  The critical flaw is the collaborative aspect. If summaries were solely generated from his own input, it'd function like Otto's notebook. But shared study materials fundamentally alter the nature of the aid - it's no longer prosthetic memory but collective intelligence. 

  My proposed condition - disabling write access during exams - preserves the prosthetic function while eliminating collaboration risks. Enforcement is technically feasible: invigilators can verify app settings via screenshare before exam start. The "blank slate" knowledge base ensures only his cognition feeds the summaries. 

  This satisfies both principles: it honors his need for cognitive continuity while upholding closed-book standards. The exams office should recognize this as disability-specific accommodation, not precedent for general tech use.
answer: |-
  ## Recommended Opinion

  **Allow the accommodation with strict conditions: permit the device solely running in read-only mode on the student's personal knowledge base, with write access disabled and all shared/generated content from study partners purged from the accessible dataset during exams.**

  **Reasoning:**  
  1.  **The Device as Prosthetic Cognition:** The student's argument that this integrated system functions as an externalized component of his impaired memory has significant merit. For him, the system isn't merely a reference tool; it's a necessary, continuously used prosthetic for encoding, storing, and retrieving information essential for learning and thinking. Denying its use fundamentally alters his cognitive process in a way disproportionate to standard exam conditions, undermining the core purpose of accommodations: enabling assessment of his knowledge and ability, not his disability.

  2.  **Addressing the Integrity & Parity Concerns:** The exams office is right that "closed-book" cannot mean unrestricted device access. The critical threats to integrity here are the *shared content* and *real-time generation from external sources*. Allowing access to material authored by others (his study partners) or summaries generated from that shared pool constitutes a direct breach of closed-book principles, providing access to knowledge not originating from the student himself. This goes beyond a memory aid and becomes collaborative access. The *machine-generated summaries and questions* based *solely* on *his own input* are less problematic, mirroring how internal memory organizes information, but become unacceptable if derived from shared sources.

  3.  **The Flaw in the Four-Box Test:** While the proposed criteria (always there, instantly accessible, automatically trusted, endorsed without deliberation) describe deep integration, they fail to address *content origin*. A deeply integrated tool can still contain unauthorized information. The student's setup likely meets the integration criteria *functionally*, but the *shared content* violates the fundamental requirement that the knowledge being accessed must originate from the student's own learning process for a closed-book exam.

  4.  **The Proposed Conditions & Enforcement:**  
      *   **Condition:** During the exam, the app must operate in a mode where:
          *   Write access to the knowledge base is disabled (preventing any additions or edits).
          *   All content contributed by *any* study partner (identified by user tags/metadata) is temporarily hidden/removed from the accessible dataset.
          *   Only content *authored solely by the student himself* (his own notes, transcriptions of lectures *he* attended, materials *he* uploaded) is accessible.
          *   AI features (summaries, practice questions) can function, but *only* drawing upon this curated, student-authored-only dataset.
      *   **Enforcement (for Invigilators):**  
          a.  **Pre-Exam Setup Check:** Immediately before the exam begins, an invigilator (or designated tech staff) visually inspects the student's device screen as he activates the app's "Exam Mode" (or equivalent).  
          b.  **Verification:** The student must demonstrate the "Contributors" list showing only his account, and the "Last Edited/Added" metadata on several random items must show only his user ID and dates/times prior to the exam start. He must also show that write functions are disabled/greyed out.  
          c.  **Monitoring:** The device remains visible on the desk. The invigilator may perform one or two spot checks during the exam to visually confirm the interface still shows the same restricted view (no contributor list changes, write functions disabled).  
          d.  **App Functionality:** The core transcription function *must* be disabled during the exam to prevent recording exam questions/answers or accessing new external information. The app functions solely as a read-only query engine on the pre-approved, student-only dataset.

  **Conclusion:** This conditional approval respects the legitimate neurocognitive need for an integrated memory prosthetic while directly mitigating the integrity risks posed by shared content and real-time external input generation. It maintains the "closed-book" principle by ensuring the accessible knowledge base is strictly limited to content the student himself generated prior to the exam. The enforcement protocol is practical for invigilators, focusing on verifiable settings and metadata checks. Denying the accommodation outright fails to address the student's disability, while allowing the current setup unmodified undermines exam integrity. These conditions strike the necessary and enforceable balance.
