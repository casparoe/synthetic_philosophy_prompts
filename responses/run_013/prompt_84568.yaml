prompt: |-
  Ok so I've been reading about constitutional monarchies for fun, which is a wierd hobby, and I keep noticing a pattern I don't have a name for.

  Take the monarch's power to refuse to sign a bill. Everyone agrees it's still there — nobody repealed it, it's on the books — and as far as I can tell it hasn't been used since the early 1700s. But the reason it hasn't been used isn't that anyone would get arrested. It's that using it would be the last thing the monarchy ever did. So it's a power that only works while it sits there unused, and it stops being a power the second it's used. That's backwards from every other kind of power I know of, where using it is how you find out if it's real.

  Same shape with picking a prime minister when the election doesn't decide it. Everyone says the monarch chooses someone, and everyone also says the monarch has no choice. Both of those are supposed to be true at once. And it holds together because nobody can pin it down: if you actually wrote a rule — the monarch shall ask the leader of the largest party, say — you'd either be handing the monarch real discretion or taking it away, and either way the thing you were trying to preserve is dead.

  Then there's the private meeting. Some Victorian or other said the monarch's whole job is three things: being consulted, encouraging, warning. And the reason that's the entire job is that advice given in private can't be quoted back at the government, and the day it can, it's over. Influence that has to stay invisible in order to exist.

  I don't think it's only monarchies. My old boss could overrule any decision in our department and never once did, and we all knew it, and it changed what we bothered to propose. My mother-in-law gets consulted about everything and decides nothing, and yet nothing happens without her. A union guy I know can call a strike and hasn't in fifteen years, and the company quietly gives him things so he won't.

  So is there a name for this? Unwritten rule and convention aren't it — those just tell me it isn't in a statute. Strategic ambiguity is about what you tell an adversary, not about the authority you're holding. Deterrence covers the unused-power half until you notice that deterrence gets stronger once it's been tested, and this thing dies. A taboo is enforced by disgust, not by the fear that using it would dissolve it. What I'm after is narrower: rules that only work while they stay vague, powers that only work while unused — and I'm honestly not sure those are one phenomenon or two, so if it's two, tell me what seperates them. I don't need a label so much as the carving: what exactly the thing is, what it isn't, where its edges are. And which of my examples isn't actually an example, because I suspect the mother-in-law is doing something different from the king.
reasoning: |-
  Okay, the user is describing a fascinating pattern they've noticed in constitutional monarchies and beyond. They've identified powers that exist only when unused, or influence that functions only when unacknowledged. 

  Hmm, they're clearly well-read on constitutional theory - referencing Victorian-era concepts like Bagehot's three rights shows depth. Their real-world analogies (boss, mother-in-law, union rep) suggest they're trying to ground abstract political concepts in lived experience. Smart approach.

  The core tension they're wrestling with is ontological: how can something be real if its exercise would destroy it? And they're right that existing terms like "convention" or "taboo" don't quite capture this. "Convention" is too broad, "taboo" misses the structural fragility aspect.

  Let me break this down systematically. First, the monarch examples form a triad: legislative veto (unusable power), PM selection (indeterminate choice), private influence (unacknowledged action). Each manifests the same paradox differently. Then their personal examples show this scales to micro-level social dynamics.

  Key insight: all cases involve a delicate equilibrium maintained through strategic inaction. The power isn't illusory - it shapes behavior precisely because everyone knows its exercise would collapse the system. Like Schrödinger's cat but for authority.

  The union example is particularly telling. The credible threat of strike only works if unused, yet requires constant reinforcement through smaller concessions. Exactly like nuclear deterrence, except that paradoxically, tested deterrence (like Cuba) can strengthen credibility, whereas here any use destroys the mechanism. Important distinction.

  For labeling... "latent power" captures the dormancy aspect but misses the fragility. "Self-negating authority" is clunky but accurate. Best might be distinguishing between self-negating powers (like veto) and self-concealing influence (like royal advice). The mother-in-law case is different - that's more about soft power via gatekeeping than constitutional fragility.

  User's suspicion about the mother-in-law example is astute. That's more about informal network centrality than systemic fragility. Should clarify that while the influence pattern resembles royal advisory roles, the stakes and mechanisms differ.

  Ultimately they want conceptual precision, not just terminology. Need to map the boundaries: what phenomena share these traits? Constitutional conventions (when breach would cause crisis), certain market behaviors (cornering commodities), even social norms like "don't test your parachute". The unifying thread is metastability - systems that work only because their failure conditions aren't triggered.

  ...And should acknowledge their sharp observation about deterrence theory's difference - most users wouldn't catch that nuance.
answer: |-
  You've hit upon a profound and subtle dynamic of power – one that lacks a single perfect name but is absolutely central to understanding how many unwritten systems function. Let's carve this at the joints:

  **The Core Phenomenon: Metastable Authority / Self-Negating Power**

  The unifying principle is **metastability**. These are powers or influence structures existing in a precarious equilibrium. They function *only* because they remain unexercised, unacknowledged, or undefined. Using them destroys the very conditions that make them possible. It's power that derives its *reality* from its *potential*, but *only* if that potential remains unrealized.

  **Distinguishing the Two Main Flavors:**

  While intertwined, your examples reveal two distinct (but related) mechanisms:

  1.  **The Unusable Power (The Veto, The Strike Threat, The Boss's Overrule):**
      *   **What it is:** A formal or widely acknowledged authority that exists *de jure* (in law or explicit agreement) but whose *de facto* exercise would be catastrophic for the holder's position or the system itself.
      *   **Mechanism:** Deterrence via self-destruction. The threat is credible *precisely because* everyone knows using it would obliterate the wielder's legitimacy, trigger overwhelming backlash, or collapse the system. Its power lies entirely in the shared understanding of its unusability.
      *   **Why "deterrence" isn't quite right:** Traditional deterrence (like nuclear) *gains* credibility from the *possibility* of use and can sometimes be *strengthened* by demonstrating resolve through limited actions or near-use. This power *loses* all credibility and function the *moment* it's used. Its strength is inversely proportional to its actualization.
      *   **Edge Cases:** It remains "real" only as long as the catastrophic consequences of its use are universally accepted *and* the holder maintains sufficient residual legitimacy that the threat itself is meaningful. If the holder becomes utterly powerless or irrelevant, the "threat" vanishes. If the consequences are deemed acceptable by the wielder (or no longer catastrophic), the power becomes usable again, but fundamentally changes nature.
      *   **Label Suggestions:** "Self-Negating Power," "The Unusable Veto," "Metastable Authority," "Dormant Nuclear Option."

  2.  **The Unacknowledged Influence (The Private Meeting, The Mother-in-Law, Implied Discretion):**
      *   **What it is:** Influence derived from access, tradition, respect, or undefined procedural space, which *requires* operating in the shadows or within ambiguity to be effective. Acknowledgement destroys it.
      *   **Mechanism:** Plausible Deniability & Trust. Influence flows through confidential advice, implicit understandings, and the respect granted to a position or person. Making the influence explicit forces it into the open political arena, subjecting it to scrutiny, challenge, and accountability it cannot withstand. Its power relies on being unprovable and unchallenged.
      *   **Edge Cases:** This influence persists only as long as the confidentiality/ambiguity is maintained *and* the recipient values the input enough to keep listening secretly. If the advice is consistently terrible or ignored, the influence evaporates. If the ambiguity is codified (e.g., "The Monarch *must* be consulted"), it either becomes a hollow ritual or transforms into a potential source of friction if ignored.
      *   **Label Suggestions:** "Hidden Hand Influence," "Ambiguity-Dependent Influence," "The Power of Confidential Counsel," "Soft Power Requiring Opacity."

  **How They Interrelate:**

  *   The **Unusable Power** often *enables* the **Unacknowledged Influence**. The monarch's residual, unusable formal powers (like veto, dissolution) give weight to their confidential advice ("encouraging, warning"). The boss's theoretical overrule makes their unspoken preferences influential. The union leader's unused strike threat gives teeth to their quiet negotiations.
  *   Both rely on **strategic ambiguity**, but for different purposes. For Unusable Power, ambiguity surrounds the *likelihood/consequences* of use. For Unacknowledged Influence, ambiguity surrounds the *existence and impact* of the influence itself.
  *   Both are forms of **metastable equilibrium**.

  **Dissecting Your Examples:**

  1.  **Monarch's Veto:** **Pure Unusable Power.** Using it destroys monarchy's legitimacy in a democratic age. Its power is *only* as a universally understood, unusable threat.
  2.  **Picking the PM:** **Hybrid.** The *discretion* itself is the **Unusable Power**. Actually using non-trivial discretion would cause a crisis. But the *act* of "choosing" relies on **Unacknowledged Influence** – the Monarch's private soundings, subtle pressures, and the advice they receive operate within ambiguity. Codifying the rule *either* makes the discretion real (risking crisis later) *or* removes the Monarch entirely (killing the symbolic unity role). The ambiguity *is* the mechanism.
  3.  **Private Meeting (Consult, Encourage, Warn):** **Pure Unacknowledged Influence.** The influence *depends* on privacy. Public revelation turns advice into political interference.
  4.  **Your Old Boss:** **Primarily Unacknowledged Influence enabled by Unusable Power.** Their influence came from the unspoken threat of overrule (Unusable Power) shaping proposals *before* they were made. The influence itself operated subtly.
  5.  **Your Mother-in-Law:** **Primarily Unacknowledged Influence.** This is about soft power – respect, family dynamics, emotional leverage, gatekeeping information ("being consulted"). Her power stems from her position in the network and the value others place on her opinion *when given confidentially or informally*. If she tried to issue formal decrees, her influence would likely collapse. It's less about a catastrophic self-negating power and more about influence residing in informal channels. *(You were right to suspect it's slightly different – it lacks the formal, systemic, self-destruct mechanism of the monarchical examples).*
  6.  **Union Guy:** **Pure Unusable Power.** The strike threat is the weapon. Using it burns bridges, costs workers dearly, and might fail. Its *ongoing* power to extract concessions relies entirely on the credible threat *not* to use it unless absolutely forced. Each concession reinforces the credibility of the *future* threat, as long as the ultimate weapon remains sheathed.

  **Carving the Boundaries - What It Is NOT:**

  *   **Not just "Convention":** Conventions are the *rules* governing this behavior (e.g., "the monarch assents"), but they don't capture the *metastable, self-negating* nature of the *power itself*.
  *   **Not "Taboo":** Taboos are enforced by social disgust/revulsion. This is enforced by *systemic consequence* (loss of legitimacy, collapse of role). A taboo violation might make someone an outcast; using the Royal Veto makes the monarchy politically untenable.
  *   **Not "Deterrence" (in the classic sense):** As you noted, classic deterrence can be strengthened by demonstration. This power is destroyed by demonstration.
  *   **Not "Soft Power" alone:** Soft power (attraction, persuasion) is part of Unacknowledged Influence, but Unusable Power often involves hard, formal authority that's simply rendered inert by context.
  *   **Not "Cheap Talk":** Cheap talk is non-credible, non-binding communication. The Unusable Power is a *very real* threat, precisely *because* its use would be catastrophic. It's "expensive" talk made credible by the cost of acting.

  **Conclusion:**

  You've identified a crucial category of power: **metastable authority structures**. These are powers and influences that function *because* they remain potential, not actual; hidden, not revealed; ambiguous, not defined. They are **Self-Negating Powers** (where use destroys the power) and **Unacknowledged Influence** (where revelation destroys the influence), often working in tandem. Their strength lies in their dormancy and opacity, making them uniquely fragile and powerful simultaneously. They are the lubricant and hidden reinforcement in many unwritten systems, from constitutional monarchies to family dynamics to workplace politics, allowing systems to function smoothly precisely because certain levers are never pulled and certain conversations never see the light.
