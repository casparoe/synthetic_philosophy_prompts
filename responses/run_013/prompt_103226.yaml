  ### Worked Case: Dividing Chores with Epistemic Game Theory

  Consider two players, Alex and Bailey, dividing three chores: **Dishes (D)**, **Laundry (L)**, and **Vacuuming (V)**. Each must choose one chore to do. The costs (negative utilities) reflect the effort required, and the payoffs (shown as utilities) are structured such that avoiding chores creates mutual penalties. The normal-form game is:

  #### Payoff Matrix
  Alex chooses rows, Bailey chooses columns. Payoffs are (Alex, Bailey).  
  Assume chores not done incur a penalty of 0.5 to both players (e.g., if a chore is unclaimed, both suffer a penalty).

  |          | **Dishes (D)** | **Laundry (L)** | **Vacuuming (V)** |
  |----------|----------------|-----------------|-------------------|
  | **Dishes (D)** | 1, 1          | 1, 0.5          | 0.5, 0.5          |
  | **Laundry (L)** | 0.5, 1        | 2, 2            | 0.5, 0.5          |
  | **Vacuuming (V)** | 0.5, 0.5      | 0.5, 0.5        | 3, 3              |

  **Interpretation of payoffs**:
  - If both choose the same chore (diagonal), they share the workload and avoid penalties, but the intrinsic cost varies (e.g., Vacuuming is hardest, so mutual payoff is highest at 3,3).
  - If Alex does Dishes and Bailey does Laundry, Alex gets 1 (no penalty), but Bailey’s chore is undone, so Bailey gets 0.5 (penalty) and Alex avoids penalty by doing their chore.
  - If a chore is unclaimed (e.g., both avoid Vacuuming), both get 0.5 (penalty for undone work).

  ---

  ### Step 1: Weaker Reading of CKR  
  *Common knowledge that neither uses a **strictly dominated** strategy.*  
  **Iterated Elimination of Strictly Dominated Strategies (IESDS)**:
  - **Strict domination**: Strategy \(s_i\) is strictly dominated if another strategy \(s_i'\) yields a strictly higher payoff for *all* opponent strategies.  
  - **Initial matrix** (no strict domination yet):  
    - Alex: No strategy is strictly dominated.  
      - If Bailey plays D: Alex’s payoffs are D=1, L=0.5, V=0.5 → D best.  
      - If Bailey plays L: Alex’s payoffs are D=1, L=2, V=0.5 → L best.  
      - If Bailey plays V: Alex’s payoffs are D=0.5, L=0.5, V=3 → V best.  
    - Bailey: No strategy is strictly dominated.  
      - If Alex plays D: Bailey’s payoffs are D=1, L=0.5, V=0.5 → D best.  
      - If Alex plays L: Bailey’s payoffs are D=1, L=2, V=0.5 → L best.  
      - If Alex plays V: Bailey’s payoffs are D=0.5, L=0.5, V=3 → V best.  

  **Result**: No strategies eliminated. All 9 cells survive.  
  **Prediction under weaker reading**: No particular outcome is predicted. Multiple equilibria are possible, including (D,D), (L,L), and (V,V).

  ---

  ### Step 2: Stronger Reading of CKR  
  *Common knowledge that neither uses a **weakly dominated** strategy.*  
  **Iterated Elimination of Weakly Dominated Strategies (IEWDS)**:  
  - **Weak domination**: Strategy \(s_i\) is weakly dominated if another strategy \(s_i'\) yields a strictly higher payoff for *some* opponent strategies and at least as high for *all* others.  
  - **Order matters**: The final surviving cell depends on the order of elimination.  

  #### **Elimination Order 1: Bailey’s Strategies First**  
  1. Eliminate Bailey’s **V**:  
     - Compare Bailey’s strategies:  
       - Against Alex’s D: Bailey’s payoffs → D=1, L=0.5, **V=0.5** (V weakly dominated by D: 1 > 0.5).  
       - Against Alex’s L: Bailey’s payoffs → D=1, L=2, **V=0.5** (V weakly dominated by L: 2 > 0.5).  
       - Against Alex’s V: Bailey’s payoffs → D=0.5, L=0.5, **V=3** (V *not* dominated here).  
     - **V is weakly dominated by both D and L** in all cases except when Alex plays V. But since weak domination only requires V to be ≤ D and ≤ L in all cases and < in some, V is weakly dominated.  
     - *Eliminate V*. Reduced matrix:  

       |          | D       | L       |
       |----------|---------|---------|
       | **D**     | 1, 1    | 1, 0.5  |
       | **L**     | 0.5, 1  | 2, 2    |
       | **V**     | 0.5, 0.5| 0.5, 0.5|

  2. Eliminate Alex’s **V**:  
     - Alex’s strategies:  
       - Against Bailey’s D: Alex’s payoffs → D=1, L=0.5, **V=0.5** (V weakly dominated by D: 1 > 0.5).  
       - Against Bailey’s L: Alex’s payoffs → D=1, L=2, **V=0.5** (V weakly dominated by L: 2 > 0.5).  
     - *Eliminate V*. Reduced matrix:  

       |          | D       | L       |
       |----------|---------|---------|
       | **D**     | 1, 1    | 1, 0.5  |
       | **L**     | 0.5, 1  | 2, 2    |

  3. Eliminate Bailey’s **L**:  
     - Bailey’s strategies:  
       - Against Alex’s D: Bailey’s payoffs → D=1, **L=0.5** (L weakly dominated by D: 1 > 0.5).  
       - Against Alex’s L: Bailey’s payoffs → D=1, **L=2** (L *not* dominated here).  
     - **L is weakly dominated by D** (D ≥ L in all cases, and D > L when Alex plays D).  
     - *Eliminate L*. Reduced matrix:  

       |          | D       |
       |----------|---------|
       | **D**     | 1, 1    |
       | **L**     | 0.5, 1  |

  4. Eliminate Alex’s **L**:  
     - Alex’s strategies against Bailey’s D: D=1, **L=0.5** (L weakly dominated by D: 1 > 0.5).  
     - *Eliminate L*. **Surviving cell: (D, D)**.  

  **Prediction for Order 1**: Alex and Bailey both do Dishes, yielding (1,1).

  #### **Elimination Order 2: Alex’s Strategies First**  
  1. Eliminate Alex’s **D**:  
     - Alex’s strategies:  
       - Against Bailey’s D: Alex’s payoffs → **D=1**, L=0.5, V=0.5 (D *not* dominated).  
       - Against Bailey’s L: Alex’s payoffs → **D=1**, L=2, V=0.5 (D weakly dominated by L: 2 > 1).  
       - Against Bailey’s V: Alex’s payoffs → **D=0.5**, L=0.5, V=3 (D weakly dominated by V: 3 > 0.5).  
     - **D is weakly dominated by L and V** (L and V ≥ D in all cases, and > in some).  
     - *Eliminate D*. Reduced matrix:  

       |          | D       | L       | V       |
       |----------|---------|---------|---------|
       | **L**     | 0.5, 1  | 2, 2    | 0.5, 0.5|
       | **V**     | 0.5, 0.5| 0.5, 0.5| 3, 3    |

  2. Eliminate Bailey’s **D**:  
     - Bailey’s strategies:  
       - Against Alex’s L: Bailey’s payoffs → **D=1**, L=2, V=0.5 (D weakly dominated by L: 2 > 1).  
       - Against Alex’s V: Bailey’s payoffs → **D=0.5**, L=0.5, V=3 (D weakly dominated by V: 3 > 0.5).  
     - *Eliminate D*. Reduced matrix:  

       |          | L       | V       |
       |----------|---------|---------|
       | **L**     | 2, 2    | 0.5, 0.5|
       | **V**     | 0.5, 0.5| 3, 3    |

  3. Eliminate Alex’s **L**:  
     - Alex’s strategies against Bailey’s V: L=0.5, **V=3** (L weakly dominated by V: 3 > 0.5).  
     - *Eliminate L*. Reduced matrix:  

       |          | L       | V       |
       |----------|---------|---------|
       | **V**     | 0.5, 0.5| 3, 3    |

  4. Eliminate Bailey’s **L**:  
     - Bailey’s strategies against Alex’s V: L=0.5, **V=3** (L weakly dominated by V: 3 > 0.5).  
     - *Eliminate L*. **Surviving cell: (V, V)**.  

  **Prediction for Order 2**: Alex and Bailey both Vacuum, yielding (3,3).

  ---

  ### Summary of Predictions
  - **Weaker reading (avoid strict dominance)**: No elimination. Predicts **no particular outcome** (multiple cells possible).  
  - **Stronger reading (avoid weak dominance)**: Predicts **one outcome, but it depends on elimination order**:  
    - Order 1: **(D, D)** with payoff (1,1).  
    - Order 2: **(V, V)** with payoff (3,3).  

  ---

  ### Structural Feature Enabling Divergence
  The key structural feature is **asymmetric weak dominance relationships tied to penalty-avoidance**.  
  - **Dishes (D)** is weakly dominant for Alex when Bailey might avoid chores (penalizing Alex), but **Vacuuming (V)** is weakly dominant when Bailey might coordinate on high-value chores.  
  - Weakly dominated strategies exist (e.g., Bailey’s **V** in Order 1), but their elimination depends on which player’s strategies are eliminated first, due to **interdependence in penalty avoidance**.  
  - **Penalties for undone chores** create off-diagonal payoffs where one player’s choice to avoid a chore (e.g., Bailey choosing **L** over **D**) weakly dominates only if the opponent’s strategy is fixed, but not universally.  

  ### Reconciling the Readings
  To make the two readings agree:  
  1. **Remove penalty asymmetry**: Set all off-diagonal payoffs to (0,0). Now:  
     - (D,D) = (1,1), (L,L) = (2,2), (V,V) = (3,3), and off-diagonals = (0,0).  
     - IESDS: No strict domination → no elimination.  
     - IEWDS: **D** is weakly dominated by **L** and **V** for both players → eliminate **D**, then **L** is weakly dominated by **V** → only **(V,V)** survives, regardless of order.  
  2. **Add a dominant strategy**: Ensure one strategy strictly dominates for both players (e.g., add a high payoff for **(V,V)** universally).  

  ### Critique: Avoiding Weak Dominance
  A critic denying that avoiding weak dominance is part of rationality would argue:  
  - **Weak dominance is order-dependent**: The "unique" prediction is an artifact of elimination sequence, not rationality. Rational players might not coordinate on the same elimination order without communication.  
  - **No epistemic justification**: Common knowledge of rationality (CKR) does not require players to avoid weakly dominated strategies, as these may be rational if opponents play certain strategies (e.g., Bailey might rationally play **V** if she believes Alex plays **V**, but not if Alex plays **D**).  
  - **Equilibrium selection issue**: Both (D,D) and (V,V) are Nash equilibria. IEWDS arbitrarily selects one based on order, but rational players could coordinate on either.  

  ---

  ### Conclusion for the Post
  Common knowledge of rationality (CKR) is not a monolithic assumption. Under a **weaker reading** (avoiding strict dominance), CKR predicts **nothing** in this game. Under a **stronger reading** (avoiding weak dominance), CKR predicts a **unique outcome but order-dependent**, highlighting that "rationality" is ambiguous. The structural driver is **penalty-avoidance asymmetry in payoffs**, which creates context-dependent weak dominance. Critics rightly note that weak dominance elimination is sensitive to sequence, making its epistemic justification less robust than strict dominance.
