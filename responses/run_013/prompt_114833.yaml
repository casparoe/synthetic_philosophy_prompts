prompt: |-
  I've read about multipolar traps for years — arms races, races to the bottom, tragedy-of-the-commons dynamics, all of it filed under the Moloch metaphor — and I've come to think the idea is asked to do more work than any specification of it can support. Before I read another essay that invokes it, I want the desiderata written out: what any adequate theory of a multipolar trap has to deliver — the cases it must get right, the distinctions it must not collapse, the results it must be consistent with — each with the case or consideration behind it, and each labeled either a genuine requirement or a prejudice of a particular camp (the game-theoretic, the evolutionary, the moralizing).

  Write the list so that it serves one purpose: telling me, from the structure of a situation and in advance, whether a competitive dynamic will lock into a race to the bottom, and where the intervention points are. That purpose should shape the list — a criterion that cannot help me predict or intervene is probably not a criterion.

  The list needs to force a theory to handle at least these, which is where I think the popular accounts go soft: (a) cases where every participant would prefer that all of them stop, knows the others would prefer it too, and yet the racing continues, as against cases where the participants privately prefer the racing and merely call it a trap; (b) cases where the pressure comes from outsiders' expectations — third parties who will read any restraint as a signal — rather than from the competitors' own preferences; (c) cases where exit is available but its cost falls on someone who is not a player; (d) cases with one dominant player who could stop the race unilaterally and does not; and (e) the documented cases of communities that sustain a shared resource without privatization or an external enforcer, which any claim that the structure alone forces the bad outcome has to accommodate.

  Tell me which single requirement does the most to exclude the popular accounts, and flag any pair of requirements that looks jointly unsatisfiable — that part is what I most want. Keep the scoring of particular accounts to a sentence each; the criteria are the deliverable. Separate what is settled from what is genuinely contested among people who have thought hard about this, and do not present a contested reading as the consensus.
reasoning: |-
  Okay, the user is asking for a structured list of criteria to evaluate theories of multipolar traps (MPTs), specifically to predict when a competitive dynamic becomes a race to the bottom and identify intervention points. They've expressed skepticism about popular accounts that use the Moloch metaphor, finding them underspecified and unable to handle key nuances.  

  The user mentions five challenging cases (a-e) where existing theories often fail, and emphasizes practical utility: the criteria must help predict outcomes and find interventions. They also want clarity on settled vs. contested points among experts.  

  First, I need to map their core frustrations:  
  - Popular theories overextend the Moloch metaphor without rigor.  
  - They collapse distinctions (e.g., actual traps vs. disguised preferences).  
  - They ignore external pressures (e.g., third-party signaling).  
  - They overlook exit dynamics or dominant players.  
  - They can't explain successful commons without privatization/enforcers.  

  The user is likely well-read in rationality/EA communities but seeks analytical tools, not just metaphors. Their demand for "desiderata" suggests academic rigor—this isn't casual curiosity.  

  For the list, I'll prioritize:  
  1. **Predictive power**: Criteria must link situation structure to outcomes.  
  2. **Intervention levers**: Each requirement should imply "where to push."  
  3. **Edge cases**: Explicitly cover their (a-e) challenges.  

  Key insights I'll structure:  
  - **Requirement 1** (Preference-Outcome Gap) addresses point (a): distinguishing true traps ("we all want to stop") from hidden preferences ("I like racing but call it a trap").  
  - **Requirement 2** (Incentive Misalignment) handles (b), where third-party signals (e.g., markets punishing restraint) drive the race.  
  - **Requirement 4** (Constraint Symmetry) tackles (d): dominant players who *could* stop but don’t (e.g., tech monopolies avoiding regulation).  
  - **Requirement 5** (Endogenous Enforcement) answers (e) by requiring theories to explain successful commons (like Ostrom's work) without external cops.  
  - **Requirement 3** (Exit Asymmetry) covers (c): when exit costs hit non-players (e.g., polluting factories leaving communities bankrupt).  

  The **most excluding requirement** for popular accounts is **Preference-Outcome Gap**: many essays assume participants want to stop but can't, ignoring that some benefit privately. This conflates true traps with faux-traps (e.g., arms dealers who profit while lamenting "inevitable" wars).  

  **Jointly hardest pair** is **Incentive Misalignment** (pressures from outsiders) + **Endogenous Enforcement** (self-policed commons). Outsiders often undermine community trust—e.g., markets may punish a fishing coop’s restraint as "weakness," making self-enforcement unstable. Few theories reconcile this tension well.  

  On settled vs. contested:  
  - **Settled**: MPTs require mutual preference for cooperation (Requirement 1) but fail without enforcement.  
  - **Contested**: *Why* dominant players don’t stop races (Requirement 4)—is it short-term greed, or are they trapped too? Also hotly debated: how often endogenous solutions (Requirement 5) scale beyond small groups.  

  Finally, I'll keep scoring of accounts brief (e.g., "Moloch metaphor often fails Requirement 1 by assuming uniform suffering"), focusing on criteria as the deliverable. The tone stays clinical: the user wants tools, not polemics.
answer: |-
  Here is a structured list of desiderata for evaluating theories of multipolar traps (MPTs), designed to predict lock-in to races to the bottom and identify intervention points. Each requirement is grounded in empirical or logical cases, labeled as **genuine requirement** (GR) or **camp prejudice** (CP), and annotated with the case(s) it addresses (a-e). The list prioritizes predictive and actionable rigor.

  ---

  ### **Core Desiderata for an Adequate Theory of Multipolar Traps**
  1. **Preference-Outcome Gap Distinction** (GR)  
     *Must distinguish:* Cases where all players *genuinely prefer mutual cooperation* but race anyway (true trap), vs. cases where players *privately prefer racing* but frame it as a trap (faux-trap).  
     **Case:** (a)  
     **Why essential:** Predicts true traps only when verified preference misalignment exists. Interventions differ: true traps require coordination mechanisms; faux-traps require preference revelation.  
     **Predictive test:** If players would accept a binding "all stop" pact, it’s a true trap; if not, faux-trap.  

  2. **Third-Party Incentive Mapping** (GR)  
     *Must explain:* How external actors (e.g., markets, voters, media) penalize restraint or reward defection, independent of competitors' preferences.  
     **Case:** (b)  
     **Why essential:** Outsiders drive traps where direct competitors lack malice (e.g., corporations cutting safety to meet investor expectations). Interventions must target *signal receivers* (e.g., reshaping investor metrics).  

  3. **Exit Cost Externalization** (GR)  
     *Must model:* Who bears the cost of exit (e.g., workers, ecosystems, future generations) and how this enables traps.  
     **Case:** (c)  
     **Why essential:** Traps persist when exit harms non-players (e.g., polluters relocating to weak-regulation zones). Intervention: internalize costs (e.g., liability regimes).  

  4. **Dominant Player Inaction** (GR)  
     *Must explain:* Why a dominant player (with power to unilaterally halt the race) chooses not to, despite net benefits.  
     **Case:** (d)  
     **Why essential:** Distinguishes structural traps (e.g., collective action problems) from agency failures (e.g., short-termism in monopolies). Intervention: alter dominant player’s incentives or replace leadership.  

  5. **Endogenous Cooperation Proof** (GR)  
     *Must accommodate:* Documented cases of self-sustaining cooperation without privatization or external enforcement (e.g., Ostrom’s commons).  
     **Case:** (e)  
     **Why essential:** Theories claiming traps are *inevitable* absent top-down control must explain counterexamples (e.g., alpine pasture sharing). Intervention: foster trust-building institutions.  

  6. **Intervention Point Typology** (GR)  
     *Must identify:* Which levers break the trap: (1) Preference alignment (e.g., side payments), (2) Rule enforcement (e.g., treaties), (3) Signal manipulation (e.g., changing third-party perceptions), or (4) Cost reallocation (e.g., taxing exit).  
     **Why essential:** Separates fatalism ("traps are inevitable") from actionable solutions.  

  7. **Temporal Discounting Clarity** (GR)  
     *Must quantify:* How players value short-term gains vs. long-term losses (e.g., high discount rates enable traps).  
     **Why essential:** Predicts when racing dominates (e.g., quarterly profits vs. climate collapse). Intervention: reduce discount rates (e.g., via governance).  

  8. **Evolutionary vs. Intentional Dynamics** (CP: Evolutionary Camp)  
     *Often overemphasized:* Traps as "selection pressures" (e.g., firms racing or dying).  
     **Risk:** Collapses human agency; ignores that players can renegotiate rules. Not all traps are Darwinian.  

  9. **Moral Hazard Exclusion** (CP: Moralizing Camp)  
     *Often smuggled in:* Assumes racing stems from "greed" or "short-sightedness."  
     **Risk:** Obscures structural fixes (e.g., if incentives change, behavior changes).  

  ---

  ### **Critical Tensions & Exclusions**
  - **Most Excluding Requirement:** **#1 (Preference-Outcome Gap)**. Popular accounts (e.g., Moloch essays) often conflate true and faux-traps, assuming universal suffering. But in cases like *luxury goods markets* or *social media virality races*, players may privately prefer racing while publicly lamenting it.  
  - **Jointly Unsatisfiable Pair:** **#2 (Third-Party Incentives) + #5 (Endogenous Cooperation)**. Outsider pressures (e.g., stock markets) can sabotage community trust (e.g., co-ops pressured to cut wages). Few theories resolve this tension—Ostrom-style systems often *fail* under strong external markets.  

  ---

  ### **Settled vs. Contested**  
  - **Settled:**  
    - MPTs require mutual preference for cooperation over racing (GR #1).  
    - Externally enforced rules *can* break traps (GR #6).  
  - **Contested:**  
    - Whether dominant player inaction (GR #4) stems from *structural constraints* (e.g., shareholder demands) or *agency failure* (e.g., irrational leaders).  
    - Scalability of endogenous solutions (GR #5): Do Ostrom’s principles work for global commons (e.g., oceans)?  
    - Whether "racing" is ever Pareto-efficient (e.g., high-stakes R&D).  

  ---

  ### **Scoring Popular Accounts**  
  - **Moloch Metaphor:** Fails GR #1 (assumes universal suffering), GR #5 (ignores endogenous solutions), GR #8 (overly evolutionary).  
  - **Classic Game Theory (Prisoner’s Dilemma):** Fails GR #2 (no third parties), GR #4 (no dominant players), GR #5 (requires external enforcer).  
  - **Evolutionary Models:** Fails GR #1 (preferences fixed by selection), GR #4 (no strategic agency).  

  This framework forces theories to confront messy realities—not just elegant abstractions—and isolates where interventions can bite.
