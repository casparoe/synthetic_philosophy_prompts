  Final Procedure Document:

  **Procedure for Assigning Causal Labels**

  1. **List Candidate Factors**  
     From the file, list every event, condition, or omission that might have played a role in the death.

  2. **Filter Background Conditions**  
     Ask: *"Is this factor a general, stable condition that is always or usually present in the context and not a specific deviation?"*  
     - If yes, assign "background condition" and set aside.  
     - If no, proceed.

  3. **Counterfactual Test**  
     Ask: *"If this factor had been different in the specific way that would have been normal or expected (for an omission: if the omitted action had been performed; for an event: if it hadn't occurred), would the death have been prevented in the same circumstances (all else equal)?"*  
     - If no, set aside (or consider for contributing factor in step 7).  
     - If yes, proceed.  
     - *Note: For omissions, this tests the absence, not the agent's failure.*

  4. **Normative Test (for omissions only)**  
     Ask: *"Was there a duty (legal, role-based, or established practice) for an agent to perform the omitted action?"*  
     - If yes, the candidate is the agent's failure (e.g., "the landlord's failure to maintain the alarm").  
     - If no, the candidate is the absence (e.g., "the absence of a sprinkler system").  
