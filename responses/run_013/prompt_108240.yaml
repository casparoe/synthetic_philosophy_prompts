  6. Overdetermination: Multiple factors passed. All are causes? But note: the fire starting is also a cause. However, we might focus on the preventable factors.

  Sorting:
  - Cause: 
    - Landlord's failure to maintain smoke alarm (omission with duty).
    - Absence of sprinkler (omission without duty, so state as absence).
    - Delay in calling (omission without duty, state as absence).
    - Victim's intoxication (condition, but note: we might consider if it was a voluntary act. However, we treat it as a condition. If it is a background condition? Step 2: not stable? It was specific to the victim that night. So cause? But note: we might not want to blame the victim. Policy: avoid victim-blaming. So perhaps label as contributing? But the procedure says if it passes counterfactual, it's a cause. This might be unwelcome.

