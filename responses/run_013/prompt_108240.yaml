     - **Cause**: Any factor that passed steps 3 and 5. State it in the contrastive form.  
     - **Contributing Factor**: Any factor that:  
       - Did not pass the counterfactual test (step 3) but made the death more likely or severe, or  
       - Passed step 3 but not step 5 (no plausible contrast), or  
       - Is an omission by the board (to avoid conflict).  
