prompt: |-
  I sit on the findings panel of a state-level accident investigation board. We investigate fatal fires, industrial deaths, and marine casualties, and each report ends in a Findings section that names the causes of the death. Our findings are read by bereaved families, are routinely subpoenaed in civil litigation, and are picked up in later criminal proceedings; the report is signed by the panel chair only after counsel has reviewed it. I need a procedure I can hand to an investigator with no philosophy training, one they can run in an afternoon with the file in front of them.

  The background you need is that our standing vocabulary has three labels — cause, contributing factor, background condition — and we have never had a principled way of assigning them. The fights are always about omissions: no sprinkler system, no working smoke alarm, no inspection carried out, a safety recommendation made years ago and never implemented, a screening programme defunded, a forecast not checked, a device not fitted, a person not rescued. Half the panel holds that an omission can never be a cause, because a cause has to be something that happened; the other half thinks that view is simply a way of letting institutions off the hook. Counsel wants every finding phrased so that it cannot be read as a statement of legal liability.

  Please write the procedure. I want the questions the investigator asks, in order; what counts as a sufficient answer at each step; where the procedure terminates in "no causal finding" and where it terminates in "cause"; how it sorts the surviving candidates into the three labels; and, marked explicitly, the points where the procedure cannot decide and a person must, together with what kind of question that is — a question of fact, of jurisdiction, or of policy.

  Three constraints. First, every causal finding must be stated contrastively, in the form "the death occurred because A rather than B," with the contrast made explicit and defended; tell me how the investigator is supposed to supply B and what to do when no plausible B exists. Second, where the candidate is an omission, the procedure must distinguish naming the negative fact (the absence of a working alarm) from naming the agent's failure (the landlord's failure to maintain it), and must say when the report should do which, given that the two carry different consequences downstream. Third, the procedure must say how to treat a candidate omission by an actor who was under no duty — no legal duty, no role-based duty, and no established practice of doing the thing — and a candidate omission by this board itself.

  Then run it on three cases: a fatal house fire with several candidate omissions of different kinds, at least one of them lawful at the time; a death from a cancer that a defunded national screening programme would probably have caught; and a death that two independent omissions would each on its own have prevented. At least one of the three should come out in a way the panel will find unwelcome; say which, and why we should accept it.

  Ground the procedure in the actual state of the philosophical debate about whether and when omissions cause — counterfactual analyses and their counterexamples, accounts that make a norm or a duty essential to counting an omission as a cause, contrastive accounts — and be explicit where that debate is unresolved, so I can see which steps rest on a contested view rather than on settled analysis. I do not need a literature review or a reading list; I need the tests and the reasons for them. Finish by saying how confident you are in the procedure as a whole, and which single step you are least confident about.
reasoning: |-
  We are designing a procedure to assign one of three labels: cause, contributing factor, or background condition. The key challenge is handling omissions. The procedure must:
  1. Be usable by an investigator without philosophy training.
  2. Produce contrastive causal statements (A rather than B).
  3. Distinguish between the absence and the agent's failure.
  4. Handle omissions by actors with no duty and by the board itself.
  5. Avoid implying legal liability.

  We'll ground the procedure in philosophical debates about omissions as causes. Key points from the debate:
  - Counterfactual view: An omission is a cause if, had it occurred, the outcome would not have happened. But this faces counterexamples (e.g., preemption, overdetermination).
  - Norm-based view: An omission is a cause only if there was a duty to act. This avoids some counterexamples but requires a normative judgment.
  - Contrastive view: Causation is always relative to a contrast. We ask "Why A rather than B?" and look for a difference-maker.

  We'll use a hybrid approach that relies on counterfactuals and normative considerations (duty) to sort omissions.

  Procedure Steps:

  1. **List Candidate Factors**: From the file, list every event, condition, or omission that might have played a role. Include both positive events and omissions.

  2. **Preliminary Filter: Background Conditions?**
     - Ask: "Is this factor a general, stable condition that is always or usually present in the context, and not a specific deviation?"
       - If yes, label as "background condition" and set aside.
       - Examples: the presence of oxygen in air (for a fire), gravity (in a fall). These are necessary but not specific to the accident.
     - If not, proceed.

  3. **Counterfactual Test for Causation** (for each remaining candidate):
     - Ask: "If this factor had been different in the specific way that would have been normal or expected (for an omission: if the omitted action had been performed; for an event: if it hadn't occurred), would the death have been prevented in the same circumstances (all else being equal)?"
     - Note: We are not asking for the only factor, but whether it was a difference-maker.
     - If the answer is "no", then this factor is not a cause. Set aside or label as "contributing factor" only if it meets step 5.
     - If "yes", proceed.

     Special for Omissions:
     - We must distinguish between:
       - The absence of X (e.g., no working smoke alarm).
       - The failure of agent Y to provide X (e.g., the landlord's failure to maintain the alarm).
     - At this step, we are testing the absence. We ask: "Had there been a working smoke alarm, would the death have been prevented?" (This is a counterfactual about the absence.)

  4. **Normative Test for Omissions** (only if the candidate is an omission and passed the counterfactual test):
     - Ask: "Was there a duty (legal, role-based, or established practice) for an agent to perform the omitted action?"
       - If yes, then we can consider the agent's failure as a candidate cause (but note: we are not assigning legal liability, just factual causation with a normative element for selection).
       - If no, then the omission is not attributed to an agent's failure. We might still consider the absence as a cause if the counterfactual test is strong, but without naming an agent.
     - For omissions by the board itself: we must be cautious. The board's role is oversight, so a duty may exist by role. But note: the report must avoid self-incrimination or bias. We might label such omissions as "contributing factor" rather than "cause" to avoid the appearance of conflict.

  5. **Contrastive Formulation**:
     - For every candidate that passes step 3 (and step 4 for omissions), we must state it contrastively: "because A rather than B".
     - How to choose B?
       - The investigator must identify the "normal" or "expected" alternative. For example:
         - For an event: "the fire started because of a short circuit (A) rather than being caused by an open flame (B)".
         - For an omission: "the death occurred because there was no sprinkler (A) rather than there being a sprinkler (B)".
       - If no plausible alternative exists (e.g., if the only way the death could have been prevented is by an extraordinary measure), then the candidate might not be a cause. But note: the alternative must be a realistic possibility in the context.
       - Rule: B should be the most salient alternative that would have prevented the death, and it should be something that could reasonably have been expected in the circumstances.
       - If the investigator cannot find a plausible B, then the candidate fails the contrastive test and should be labeled as a "contributing factor" or dropped.

  6. **Overdetermination and Multiple Causes**:
     - If two or more factors each pass the counterfactual test on their own (i.e., either one would have been sufficient to prevent the death), then:
       - We do not call either a cause? Or do we call both causes? In law and philosophy, overdetermination is tricky.
       - Our approach: If each omission would have been sufficient, then we can list both as causes, but we must state them contrastively and note that either would have sufficed. However, this might be unwelcome because it dilutes responsibility.
       - Alternatively, we might look for the most proximate or salient factor. But the procedure should be consistent.
       - We'll say: If two independent omissions would each have prevented the death, then both are causes. We state each one contrastively. Example: "The death occurred because the lifeguard was not on duty (rather than being on duty) and because the safety net was not installed (rather than being installed)."

  7. **Sorting into Labels**:
     - Cause: A factor that passes the counterfactual test (step 3) and the contrastive test (step 5). For omissions, if there was a duty (step 4), we name the agent's failure; if no duty, we name the absence.
     - Contributing Factor: A factor that does not pass the counterfactual test as a difference-maker for the death (i.e., its absence would not have prevented the death) but it made the death more likely or severe. Also, if the contrastive test fails (no plausible B) but the factor is important, we might label it as contributing.
     - Background Condition: As per step 2.

  8. **Termination**:
     - The procedure terminates in "no causal finding" if no candidate passes the counterfactual test and the contrastive test.
     - It terminates in "cause" for each candidate that passes both tests.

  9. **Points Requiring Human Judgment** (marked explicitly):
     - Step 2: Deciding what is a "general, stable condition" is a matter of context and judgment (factual and policy).
     - Step 3: The counterfactual test requires judgment about what would have happened. This is a question of fact, but often involves uncertainty. The investigator must rely on evidence and expert opinions in the file.
     - Step 4: Determining the existence of a duty (legal, role-based, established practice) may involve legal interpretation (jurisdiction) and policy. The investigator should consult counsel if there is doubt.
     - Step 5: Choosing a plausible contrast (B) is a matter of context and salience (factual and policy).
     - Step 6: Handling overdetermination may require policy decisions (e.g., whether to list multiple causes). The board may have a policy on this.

  10. **Avoiding Legal Liability**:
      - The report must not assign blame or liability. We state facts and causal relations without using language like "negligent" or "breach of duty". We use neutral language: "the absence of X", "the failure of Y to do Z" (if there was a duty, but without asserting that the duty was legally binding). We rely on step 4 to use "failure" only when there is a non-controversial duty (e.g., established practice).

  Now, let's run the procedure on three cases.

  **Case 1: Fatal House Fire**
  - Facts: A fire breaks out in an apartment building. There was no working smoke alarm (landlord had a legal duty to maintain it), no sprinkler system (not legally required at the time of construction), and the fire department was not called until 30 minutes after the fire started (a neighbor saw the fire but delayed calling). The victim was intoxicated and could not escape.

  Candidate factors:
  1. The fire starting (event).
  2. Absence of a working smoke alarm (omission by landlord).
  3. Absence of a sprinkler system (omission by builder/owner).
  4. Delay in calling the fire department (omission by neighbor).
  5. Victim's intoxication (condition).

  Steps:
  1. List: all above.
  2. Background? 
     - The fire starting: not background (specific event).
     - Others: proceed.
  3. Counterfactual:
     - Smoke alarm: Had there been a working alarm, the victim would have been alerted earlier and might have escaped? (Assume evidence shows yes.) Pass.
     - Sprinkler: Had there been a sprinkler, the fire might have been suppressed? (Assume yes.) Pass.
     - Delay in calling: Had the neighbor called immediately, the fire department would have arrived earlier and rescued the victim? (Assume yes.) Pass.
     - Victim's intoxication: Had the victim been sober, they might have escaped? (Assume yes.) Pass.
  4. Normative for Omissions:
     - Smoke alarm: Landlord had a legal duty. So we can name "landlord's failure to maintain the alarm".
     - Sprinkler: No legal duty (not required at time). Also, no role-based duty or established practice? (Assume no.) So we note the absence but not an agent's failure.
     - Delay: Neighbor under no legal duty? (Good Samaritan laws might encourage but not require.) No role-based duty (not a caretaker). Established practice? Not really. So we note the absence of an early call but not an agent's failure.
  5. Contrastive:
