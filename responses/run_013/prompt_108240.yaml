answer: |-
  ### Causal Assignment Procedure for Accident Investigators  
  This procedure provides a step-by-step method to assign labels (**cause**, **contributing factor**, or **background condition**) to factors in fatal incidents. It addresses omissions, ensures contrastive statements ("A rather than B"), avoids legal liability implications, and incorporates philosophical insights (counterfactual, normative, and contrastive theories). The unresolved philosophical debate centers on whether omissions can be causes (e.g., counterfactual views face issues like preemption; norm-based views require duties; contrastive views rely on context). The procedure resolves this pragmatically: omissions are treated as causes only if they pass a counterfactual test and (for agent-specific blame) a duty test.  

  **Key Definitions:**  
  - **Cause**: A factor that directly made the difference in the death occurring. Must be stated contrastively.  
  - **Contributing factor**: A factor that increased risk or severity but was insufficient alone to cause death.  
  - **Background condition**: A stable, ever-present factor that enabled the incident but is not a specific deviation (e.g., gravity, oxygen in air).  
  - **Omission**: The absence of an action or thing. Distinguished as:  
    - **Absence**: The negative fact (e.g., "no working smoke alarm"). Use when no duty exists.  
    - **Agent failure**: An agent’s failure to act (e.g., "landlord’s failure to maintain alarm"). Use only when a duty exists.  

  **Procedure Steps**  
  *Run in order; terminate early if criteria are unmet. Use file evidence (witness statements, expert reports, physical evidence) for answers. Consult counsel at starred (*) steps if legal ambiguity arises.*  

  1. **List Candidate Factors**  
     - *Ask:* "What events, conditions, or omissions are mentioned in the file as potentially relevant to the death?"  
     - *Sufficient answer:* A bullet-point list of all candidates (e.g., "faulty wiring," "no sprinkler," "operator not trained").  
     - *Terminates if:* No candidates exist. Output: "No causal findings."  

  2. **Filter Background Conditions**  
     - *Ask:* "Is this candidate a general, stable condition that is always present in this context and not a specific deviation?"  
       - *Yes →* Label as **background condition**. Set aside.  
       - *No →* Proceed to Step 3.  
     - *Examples:* Oxygen in air (fire cases) = background; "building had combustible materials" = not background (specific to incident).  
     - *Judgment required:* Factual/policy question (what counts as "general" or "stable" in this context?).  

  3. **Test Counterfactual Dependence**  
     - *Ask:* "If this candidate had been different in the normal/expected way (e.g., event didn’t occur; omission was acted on), would the death likely have been prevented, all else equal?"  
       - *Yes →* Proceed to Step 4.  
       - *No →* Set aside (not a cause).  
     - *For omissions:* Test the **absence**, not the agent (e.g., "Had a working smoke alarm been present, would death have been avoided?").  
     - *Terminates if:* All candidates fail. Output: "No causal findings."  
     - *Judgment required:* Factual question (relies on evidence; e.g., expert testimony on outcomes).  

  4. **For Omissions: Assign Absence or Agent Failure**  
     - *Ask:* "Was there a duty (legal, role-based, or established practice) for a specific agent to perform the omitted action?"  
       - *Yes →* Candidate is **agent failure** (e.g., "operator’s failure to check forecast").  
       - *No →* Candidate is **absence** (e.g., "no safety device fitted").  
     - *Special cases:*  
       - **No-duty omission** (no legal/role-based duty or established practice): Always label as **absence** (not agent failure).  
       - **Board omission** (this board’s failure): Label as **absence** and treat as **contributing factor** (not cause) to avoid conflict of interest.  
     - *Judgment required:* Jurisdictional/policy question (what counts as "duty" or "established practice"? Consult counsel).  

  5. **Formulate Contrastive Statement**  
     - *Ask:* "For each candidate from Step 4, what is the most plausible alternative (B) that would have prevented death?"  
       - *Rules for B:*  
         - B must be realistic (possible in context) and salient (relevant to the incident).  
         - B should reflect the normal/expected state (e.g., for "no alarm," B = "working alarm present").  
       - *If no plausible B exists* (e.g., alternatives are speculative or unrealistic): Candidate cannot be a cause. Reassign to **contributing factor** or drop.  
       - *Phrase:* "The death occurred because [A] rather than [B]."  
     - *Examples:*  
       - Absence: "Death occurred because no working smoke alarm was present rather than one being present."  
       - Agent failure: "Death occurred because the landlord failed to maintain the alarm rather than maintaining it."  
     - *Judgment required:* Policy/factual question (what is "plausible" in this context?).  

  6. **Resolve Overdetermination (Multiple Sufficient Omissions)**  
     - *Ask:* "Would the death have been prevented if *any one* of these candidates was different, even if others remained the same?"  
       - *Yes* (e.g., two omissions, each sufficient alone) → All are **causes**. State each contrastively.  
       - *No* (e.g., both required) → Treat as a single cause or reassign (see below).  
     - *Labeling:*  
       - If multiple sufficient causes: Assign all as **causes**.  
       - If uncertainty: Reassign extras to **contributing factors**.  

  7. **Assign Final Labels**  
     - **Cause**: Candidates passing Steps 3–6 with a contrastive statement.  
     - **Contributing factor**: Candidates that:  
       - Failed Step 5 (no plausible B) but were important.  
       - Failed Step 3 but increased risk (e.g., "poor weather" made rescue harder).  
       - Are board omissions (from Step 4).  
     - **Background condition**: Assigned in Step 2.  
     - *Terminates in output:* List of causes (contrastive), contributing factors, background conditions.  

  **Philosophical Grounding**  
  - **Omissions as causes**: Uses a hybrid approach. Counterfactual test (Lewis) identifies difference-makers; normative filter (Schaffer) avoids over-ascribing blame; contrastive form (Schaffer) provides context.  
  - **Unresolved debates**:  
    - Counterfactual view: Rejected pure versions (e.g., "preemption" counterexamples: omission wouldn’t change outcome if another cause existed).  
    - Norm-based view: Duties are essential to name *agent failures* but not absences (agrees with McGrath; counters Moore’s "only events cause" view).  
    - Contrastive view: Critical for plausibility but context-dependent (agrees with Schaffer).  
  - Steps 4–5 rest on contested norms/contrasts; others use settled counterfactual logic.  

  ---  
  ### Procedure Applied to Cases  
  **Case 1: Fatal House Fire**  
  *Facts: Tenant dies in fire. Candidates: (1) No working smoke alarm (landlord had legal duty); (2) No sprinkler system (not legally required); (3) Fire department not called early (neighbor saw fire but delayed; no duty); (4) Victim intoxicated (impaired escape).*  
  - **Step 1**: List all.  
  - **Step 2**: None are background.  
  - **Step 3**: All pass counterfactual (alarm/sprinkler would alert; early call rescue; sobriety enables escape).  
  - **Step 4**:  
    - (1) Landlord had duty → Agent failure.  
    - (2) No duty → Absence.  
    - (3) No duty → Absence.  
    - (4) Not omission → N/A.  
  - **Step 5**:  
    - (1) "Death because landlord failed to maintain alarm rather than maintaining it." (B = maintained alarm).  
    - (2) "Death because no sprinkler system was present rather than one being present." (B = present sprinkler).  
    - (3) "Death because no early call was made rather than one being made." (B = early call made).  
    - (4) "Death because victim was intoxicated rather than sober." (B = sobriety).  
  - **Step 6**: No overdetermination (all necessary).  
  - **Step 7**:  
    - Causes: (1) Agent failure, (2) Absence, (3) Absence, (4) Victim condition (not omission).  
    - Contributing/background: None.  
  - **Unwelcome outcome**: Victim intoxication as cause. **Why accept?** Procedure is consistent: intoxication was a difference-maker. Contrastive phrasing ("rather than sober") shows it’s factual, not blame-focused.  

  **Case 2: Death from Cancer**  
  *Facts: Patient dies from cancer. A national screening program (detects this cancer early) was defunded 2 years prior; death would likely have been prevented if funded. Defunding was lawful policy decision; no legal duty to maintain it.*  
  - **Step 1**: Candidates: (1) Cancer; (2) Absence of screening program.  
  - **Step 2**: Cancer = background (disease process). Set aside.  
  - **Step 3**: Absence passes (screening would have prevented death).  
  - **Step 4**: No duty → **Absence** (not agent failure).  
  - **Step 5**: "Death occurred because no screening program was available rather than one being available." (B = program available).  
  - **Step 6**: No overdetermination.  
  - **Step 7**: Cause: Absence of screening. Contributing: None.  
  - **Unwelcome outcome**: None. Absence is named without blaming agents (since no duty).  

  **Case 3: Death Preventable by Two Independent Omissions**  
  *Facts: Worker dies in fall. Two omissions: (1) Employer failed to provide safety harness (legal duty); (2) Worker failed to use available safety line (role-based duty). Either alone would have prevented death.*  
  - **Step 1**: Candidates: (1) Employer omission; (2) Worker omission.  
  - **Step 2**: Neither background.  
  - **Step 3**: Both pass (harness or line would prevent death).  
  - **Step 4**: Both had duties → **Agent failures**.  
  - **Step 5**:  
    - (1) "Death because employer failed to provide harness rather than providing it." (B = harness provided).  
    - (2) "Death because worker failed to use safety line rather than using it." (B = line used).  
  - **Step 6**: Overdetermination → Both are **causes**.  
  - **Step 7**: Causes: Both agent failures.  
  - **Unwelcome outcome**: Worker’s failure as cause. **Why accept?** Both were sufficient and duties existed. Contrastive statements show factual prevention, not liability.  

  ---  
  **Confidence Assessment**  
  - **Overall confidence**: Moderate-high. The procedure is philosophically robust, handles omissions pragmatically, and avoids legal liability. It is testable, repeatable, and covers edge cases (e.g., no-duty omissions, board involvement).  
  - **Least confident step**: Step 4 (duty test). Determining "established practice" or "role-based duty" is context-dependent and philosophically contested (norms are not universally defined). This could lead to inconsistent assignments without clear guidance from counsel.  

  **Procedure Output Template**  
  ```  
  FINDINGS  
  - Cause: [Contrastive statement, e.g., "The death occurred because A rather than B."]  
  - Contributing factor: [Factor, e.g., "Absence of X"]  
  - Background condition: [Factor, e.g., "Presence of Y"]  
  ```  
  This procedure ensures clarity, defensibility, and family/litigation readiness while respecting philosophical and legal constraints.
