  The procedure uses a counterfactual test (Lewis) combined with a normative filter (Schaffer, McGrath). The contrastive requirement (Schaffer) helps avoid spurious causes. However, the role of norms in causation is debated: some philosophers (e.g., Moore) argue that only events can be causes, while others (e.g., Schaffer) allow omissions when there is a duty. The procedure adopts the latter view for omissions. The unresolved debate is whether norms are part of causation or merely a way of selecting which causes to mention. We use them for selection and to avoid over-ascribing causation.

  **Confidence**  
