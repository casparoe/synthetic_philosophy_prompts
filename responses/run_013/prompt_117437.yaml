prompt: |-
  My friend and I spent most of last night arguing about herd behavior, and I want to move the argument somewhere it can actually be settled rather than merely repeated. Her claim was that when a crowd converges on a single answer, that convergence is itself the proof that the crowd is not thinking: a few people choose, everyone downstream follows, and you are left with a room of privately doubtful people deferring to a consensus none of them believes. My claim was that this gets the rationality backwards. Consider any individual in that room at the moment she chooses: given what she has seen and what she privately knows, joining the crowd may be exactly what her evidence recommends — and the group can still walk, with every individual fully justified at her own step, to a conclusion that is simply false. She regards that as a contradiction in terms and is convinced I have smuggled an error in somewhere. I want a room of students to run into the possibility with their own choices before anyone names it, and I want them to feel how thin the consensus is.

  Here is what I have to work with. It is an upper-level undergraduate seminar, roughly eighteen students, meeting once for ninety minutes in an ordinary classroom with no money available. I would like an in-class activity — a game with rules and payoffs, not a lecture — that makes the participants feel the force of the point I was defending. The phenomenon should live in the rules, the sequence, and the incentives, so that they produce it themselves; the concepts should arrive only in the debrief, and I should be able to run the first rounds without the vocabulary at all.

  Some constraints I care about more than elegance. Each participant should choose in turn, holding one private piece of evidence and seeing what everyone before them chose, under a payoff scheme that makes going with the crowd individually sensible; points and a trivial prize are fine in place of money. The activity must contain at least one round in which the group settles on the wrong answer and this is revealed only at the end, and that outcome should be engineered deliberately rather than left to luck — through pre-briefed early choosers or through my control of the underlying state — because the point is lost if the wrong cascade never happens. I also want a phase that exposes the fragility of the consensus: after the group has locked in, introduce one late participant whose choice is known to rest on better evidence than anyone else's, and let the students watch the entire room reverse on the strength of a single new public signal. If time allows, add a third phase in which each participant may pay a small cost for a second private draw, so that they can see for themselves how many people free-ride on the information the crowd has already revealed instead of buying their own.

  A version I have sketched uses a private draw that is correct about the underlying state two times in three; I believe that makes the third chooser follow the crowd even when her own draw disagrees, but please check the arithmetic, because I want the cascade forced by the numbers rather than by any felt social pressure. The deliverable should include the rules, the materials, the sequence and timings, the payoff scheme, the lines I deliver and when (without naming the mechanism), and a debrief that maps specific moments of the session onto the underlying ideas — why imitation can be rational, why private information stops entering the record once a consensus forms, why the early choosers' information behaves like a public good, and why the resulting consensus is both confident and brittle. Tell me what will predictably go wrong the first time I run it and how to handle each failure, and be honest about what the activity cannot reproduce and that I will have to supply it myself. What I most want them to leave able to say, in their own words, is why "everyone behaved rationally" and "the group was wrong" are not in tension — and I would like to be able to make the same case to my friend afterward.
reasoning: |-
  We are going to design an in-class activity that models an information cascade. The goal is to show that individuals, acting rationally on their private information and the public information of others' choices, can lead the group to a wrong consensus. The activity will have three phases: 
  1. The cascade formation phase (with the possibility of a wrong cascade).
  2. The fragility phase (where a late participant with better evidence can break the cascade).
  3. (If time) An optional phase where participants can pay for an additional private signal.

  The setup:
  - There is an underlying state of the world, which we will represent as a binary variable: say, either A or B. For concreteness, let's say the state is which of two cities has a larger population: City A or City B. (We'll pick two real cities that are not well-known to the students to ensure they rely on the signals.)

  Rules and Payoffs:
  - Each student, in sequence, must choose either A or B.
  - Before the first student, the true state is determined randomly (by the instructor) with equal probability (50% A, 50% B). But note: we want to engineer a wrong cascade, so in one round we will fix the state (or use pre-briefed students) to ensure a cascade in the wrong direction.
  - Each student receives a private signal: a piece of evidence about the state. The signal is correct with probability p. We set p=2/3 (so two-thirds of the time the signal is correct, one-third wrong).
  - The students choose in a fixed order. Each student sees the choices of all previous students (but not their private signals) and then makes their own choice.
  - Payoff: Each student gets 1 point if they choose the true state and 0 otherwise. We can offer a trivial prize (e.g., candy) for the student(s) with the most points at the end.

  Phase 1: Cascade Formation
  - We will run at least two rounds. In the first round, we let the natural process occur. But to ensure a wrong cascade in one round, we can either:
      a) Fix the state (e.g., tell the class the state is A) but then we must rig the signals to create a wrong cascade, or 
      b) Use pre-briefed early choosers (the first two or three) who are instructed to choose a particular option regardless of their signal (to set up the cascade in the wrong direction). This is less transparent and might be seen as cheating, so we must be careful.

  Alternative: We can run multiple rounds and in one round we fix the state and the signals of the first two or three to be wrong. But to keep it natural, I propose:

  We run two rounds. In the first round, we let it happen naturally. Then we run a second round in which we want to force a wrong cascade. How? We can fix the state (say, true state is A) and then we (the instructor) will generate the private signals for the first two students to be both B (wrong). Then the third student, regardless of their own signal, will follow the crowd (as we will see in the arithmetic below). We can do this by having the first two students be confederates (if we have two volunteers we can brief before class) or by having the first two students be real participants but we (the instructor) give them a predetermined signal that is wrong (without telling the class we are doing so). However, to maintain integrity, it's better to use real signals but fix the state and the first two signals arbitrarily (by the instructor) to be wrong.

  But note: we want the students to feel the rationality, so we must be clear that the signals are drawn randomly and independently. So we can do:

  - The instructor flips a coin to determine the true state (say, heads = A, tails = B). But for the round where we want a wrong cascade, we will secretly set the state to A (without flipping) and then set the first two signals to be B (wrong). Then for the rest of the students, we draw their signals randomly with p=2/3 (so they are independent and correct with 2/3 probability). 

  Alternatively, to avoid any deception, we can run the activity multiple times and hope that a wrong cascade occurs naturally. But we cannot rely on that. Therefore, I propose:

  We run two rounds. In the first round, we do everything honestly (flip for state, draw signals randomly). Then we run a second round in which we want to force a wrong cascade. We tell the class: "In this round, we are going to set the state to be A (without flipping) and we are going to assign the first two signals to be B (wrong). Then the rest of the signals will be drawn randomly as before." We explain that we are doing this to show a particular phenomenon. This is acceptable because we are not deceiving the students about the process.

  Phase 2: Fragility
  - After the group has formed a consensus (say, all or most choosing B in the wrong cascade round), we introduce a late participant. We tell the class that one more student (we can pick one) will get to choose, but this student gets a signal that is more accurate (say, p=0.9, i.e., 90% accurate). We call this student the "expert". The expert sees the entire history (all previous choices) and then gets their private signal (which we draw with 90% chance of being correct). Then the expert chooses. We then reveal the true state and see if the expert breaks the cascade.

  Phase 3: Buying Additional Information (Optional)
  - We run a third round (or modify the rules for a new round) where each student, before making their choice, can decide to pay a small cost (say, 0.2 points) to get a second private signal. The second signal is independent and also with p=2/3. Then they make their choice. The payoff is 1 point for a correct choice minus any cost. This models the trade-off between free-riding on public information and buying more private information.

  Arithmetic for the cascade:

  Suppose the true state is A. 
  - Student 1 gets a signal. With 2/3 chance, it's A (correct) and they choose A. With 1/3 chance, it's B (wrong) and they choose B.
  - Student 2: 
     - If student 1 chose A, then student 2 sees A. They get their own signal. 
          - If they get A, they choose A. 
          - If they get B, they are indifferent? Actually, with two signals (one from student 1 and their own) they have two signals. But note: student 1's choice is based on one signal. So the public information is one signal for A. Student 2's private signal: if it's A, then two signals for A -> choose A. If it's B, then one for A and one for B -> they are indifferent. We need to break ties. We can say: if indifferent, the student flips a coin. Alternatively, we can set the prior to be 50-50 and then update with the signals. 

  But note: the students are Bayesian. They know that each signal is correct with 2/3. They also know the prior (50-50). So let's model:

  After seeing the choices of previous students, a student updates the probability of the state.

  Case: Student 1 chooses A. What does that tell student 2?
  - If the state is A, the probability that student 1 gets a signal A (and chooses A) is 2/3.
  - If the state is B, the probability that student 1 gets a signal A (and chooses A) is 1/3.

  So the posterior for student 2 (before seeing their own signal) is:
  P(state=A | student1 chose A) = [P(choose A|A) * P(A)] / [P(choose A|A)*P(A) + P(choose A|B)*P(B)] 
  = ( (2/3)*(1/2) ) / ( (2/3)*(1/2) + (1/3)*(1/2) ) = (1/3) / (1/3 + 1/6) = (1/3) / (1/2) = 2/3.

  So student 2, before their own signal, believes that state A is 2/3 likely.

  Now student 2 gets their own signal. Suppose it's A. Then they have:
  - Two signals for A: the first student's choice (which is one signal for A) and their own for A. The likelihood ratio for A vs B given two signals for A:
  P(two A signals | A) = (2/3)*(2/3) = 4/9
  P(two A signals | B) = (1/3)*(1/3) = 1/9
  So the posterior for A: (4/9 * 1/2) / [ (4/9 * 1/2) + (1/9 * 1/2) ] = (4/9)/(5/9) = 4/5 = 0.8.

  But note: the first student's choice is not the same as seeing the signal. The first student's choice is the same as their signal because they only had the signal. So student 2 can treat student 1's choice as one signal.

  Alternatively, if student 2 gets a signal B, then they have one signal for A (from student1) and one for B (their own). The posterior:
  P(A | one A and one B) = P(one A and one B | A) * P(A) / P(evidence) 
  = [P(signal1=A, signal2=B | A)] * P(A) / [ ... ]
  = [ (2/3)*(1/3) * 1/2 ] / [ (2/3)*(1/3)*1/2 + (1/3)*(2/3)*1/2 ] 
  = [ (2/9)/2 ] / [ (2/9)/2 + (2/9)/2 ] = (1/9) / (2/9) = 1/2.

  So they are indifferent. We must have a rule for ties. We can say: if indifferent, the student follows their own signal. But then they might break the cascade. Alternatively, we can set that they must choose either A or B arbitrarily. However, to make the cascade happen, we want that after two identical choices, the next student ignores their own signal.

  So let's see what happens for student 3.

  Case 1: The first two students both choose B (which we have set in the forced round to be wrong).

  What does student 3 see? They see two B's.

  They update:
  P(state=B | two B choices) = [P(two B|B)*P(B)] / [P(two B|B)*P(B) + P(two B|A)*P(A)]
  P(two B|B) = P(student1 gets B signal | B) * P(student2 gets B signal | B) = (2/3)*(2/3) = 4/9? But wait, student2's choice might depend on student1's.

  Actually, we have to consider the path:

  - For the first student to choose B: the signal must be B (which happens with prob 1/3 if state=A, 2/3 if state=B).
  - For the second student to choose B: they see the first chose B. Then they get their own signal. They choose B if their own signal is B OR if they are indifferent and we break the tie in favor of their own signal? But in the case where the first student chose B, the second student's posterior for state=B is 2/3 (by symmetry with the above calculation for A). Then if the second student gets a signal for B, they choose B. If they get a signal for A, they are indifferent (posterior 1/2). We must decide: what do they do when indifferent?

  We have to specify a rule for when a student is indifferent. We will say: if the posterior is exactly 1/2, the student follows their own signal. Why? Because the private signal is the only new information they have and it's unbiased.

  But note: in the case of the second student, if they see the first chose B and they get signal A, then they are indifferent. They would then choose A (following their own signal). So for the first two to both choose B, we require:
  - Student 1: gets signal B (so chooses B).
  - Student 2: sees student1 chose B, then gets their own signal: they must get signal B to choose B. If they get signal A, they choose A.

  Therefore, the probability that the first two both choose B when the state is A is: 
  P(signal1=B) * P(signal2=B) = (1/3) * (1/3) = 1/9.

  But we want to force this to happen in our round. So we set the state to A and assign the first two signals to be B (so both students choose B).

  Now student 3 sees two B's. What do they do?

  They update the posterior for state=B given two B choices.

  P(state=B | two B choices) = [ P(two B|B) * P(B) ] / [ P(two B|B)*P(B) + P(two B|A)*P(A) ]

  We need P(two B|B) and P(two B|A).

  - P(two B|B): 
     - Student1: gets signal B (correct) with prob 2/3 -> chooses B.
     - Student2: sees B, then gets their own signal. They choose B if they get signal B (with prob 2/3) OR if they get signal A (which would make them indifferent) and then they choose A? But wait: we have a rule that if indifferent, they follow their own signal. So if they get A, they choose A. Therefore, for student2 to choose B, they must get signal B. So P(two B|B) = P(signal1=B) * P(signal2=B) = (2/3)*(2/3)=4/9.

  - P(two B|A): 
     - Student1: gets signal B (wrong) with prob 1/3 -> chooses B.
     - Student2: sees student1 chose B, then if they get signal B (wrong, prob 1/3) they choose B. If they get signal A, they are indifferent and choose A. So for two B's we require student2 also gets signal B. So P(two B|A) = (1/3)*(1/3)=1/9.

  Then:
  P(state=B | two B choices) = [ (4/9)*(1/2) ] / [ (4/9)*(1/2) + (1/9)*(1/2) ] = (4/18) / (5/18) = 4/5.

  So student3, before seeing their own signal, already believes state=B with 80% probability.

  Now they get their own signal. Suppose they get a signal for A (which is more likely to be correct? but note the state is A, so the signal is correct with 2/3, but we are in the forced round so we can assign the signal arbitrarily to show what happens).

  They update with their own signal A. The likelihood of observing the two B choices and their own signal A, given the state:

  But note: the two B choices are public information, and the private signal is independent.

  So the posterior for state=B:
  P(B | two B choices and signal A) = P(two B choices and signal A | B) * P(B) / P(evidence)

  But the signals are independent conditional on the state.

  P(two B choices and signal A | B) = P(two B choices | B) * P(signal A | B) = (4/9) * (1/3) = 4/27.
  P(two B choices and signal A | A) = P(two B choices | A) * P(signal A | A) = (1/9) * (2/3) = 2/27.

  So:
  P(B | evidence) = [ (4/27)*(1/2) ] / [ (4/27)*(1/2) + (2/27)*(1/2) ] = (4/54) / (6/54) = 4/6 = 2/3.

  And P(A | evidence) = 1/3.

  Therefore, even though their own signal is A, they believe state=B is more likely (2/3 > 1/3). So they choose B.

  Moreover, note that if they had gotten a signal for B, they would have been even more sure of B.

  Therefore, after two identical choices (B), the third student will always choose B, regardless of their own signal. This is the start of the cascade.

  Then every subsequent student, seeing two B's and then a third B, will have even more reason to choose B. In fact, after two B's, the public information becomes so strong that no one's private signal (of strength 2/3) can change it.

  Therefore, we can force a wrong cascade by setting the state to A and giving the first two students the wrong signal (B). Then the third student will choose B regardless of their signal, and then all the rest will choose B.

  Phase 2: Fragility
  After, say, 10 students have chosen (all B), we introduce the "expert" (student 11). We tell the class that this student gets a more accurate signal: with 90% chance correct. We draw a signal for the expert. Since the true state is A, we want the expert to get a signal A (we can set it to A to show the break, or draw randomly and hope it's A). But to ensure the effect, we can set it to A (the correct signal). 

  The expert sees 10 B choices. They update:

  P(state=B | ten B choices) = [ P(ten B|B)*P(B) ] / [ P(ten B|B)*P(B) + P(ten B|A)*P(A) ]

  How to compute P(ten B|B) and P(ten B|A)? 

  Note: the cascade started at the third student. So the first two choose B (which in state B would have happened with prob (2/3)^2 = 4/9, and in state A with (1/3)^2=1/9). Then from student3 onward, they all choose B regardless of their signal. So the probability of ten B choices in a row:

  - If state=B: 
     - The first two: prob = (2/3)^2 = 4/9.
     - The next eight: each chooses B with probability 1 (because they ignore their signal and follow the cascade). So overall: 4/9.

  - If state=A:
     - The first two: prob = (1/3)^2 = 1/9.
     - The next eight: each chooses B with probability 1. So overall: 1/9.

  Therefore:
  P(state=B | ten B choices) = [ (4/9)*(1/2) ] / [ (4/9)*(1/2) + (1/9)*(1/2) ] = (4/18) / (5/18) = 4/5.

  So the expert, before their own signal, thinks state=B with 80% probability.

  But then they get a signal A (with 90% accuracy). Now update:

  P(B | ten B and signal A) = [ P(ten B|B) * P(signal A|B) * P(B) ] / [ P(evidence) ]
  = [ (4/9) * (0.1) * (1/2) ] / [ ... ]
  P(A | ten B and signal A) = [ P(ten B|A) * P(signal A|A) * P(A) ] = [ (1/9) * (0.9) * (1/2) ]

  Compute the ratio:
  = [ (4/9)*0.1 ] / [ (1/9)*0.9 ] = (4*0.1) / (0.9) = 0.4/0.9 = 4/9.

  So the posterior odds of B to A are 4:9, meaning P(B) = 4/(4+9)=4/13, which is about 0.307. Therefore, P(A)=9/13≈0.693.

  So the expert will choose A (since A is more likely).

  This breaks the cascade. Then the next student (if we had more) would see: ten B's and then one A. How would they update? They would have to consider the possibility that the expert had a strong signal. But note: the expert's choice is public and it's a strong signal because the expert had a high-quality signal.

  But we don't need to go further. We reveal the true state (A) and show that the group was wrong.

  Phase 3: Buying Additional Signals (Optional)
  We run a new round. The state is determined randomly (flip a coin). Each student, when it is their turn, can choose to buy a second private signal at a cost of 0.2 points. They must decide before seeing the second signal. They get the first signal for free. Then they make their choice. Payoff: 1 point for a correct choice minus any cost (so if they buy and are correct, they get 0.8; if they don't buy and are correct, they get 1; if they are wrong, they get 0 minus cost if they bought).

  We expect that early students will buy the second signal more often because the public information is weak. Later students, seeing a strong public signal, may choose to free-ride and not buy the extra signal.

  Now, the activity plan:

  Materials:
  - A coin to flip for the state (except in the forced round).
  - A way to generate private signals. We can use a bag with two colors of balls (say, blue for A, red for B) but with the appropriate proportions? We need to simulate a 2/3 chance. Alternatively, we can use a die: if we roll a die, 1-4 for correct, 5-6 for wrong? But that's 2/3 in a 6-sided die: 4 faces for correct, 2 for wrong. But we have to do it for each student. Alternatively, we can use a computer, but if we don't have one, we can use a bag with 4 blue and 2 red (for state A: blue is correct, so if state A, then blue is the correct signal; if state B, then red is the correct signal). But we have to change the bag for each state? 

  Alternatively, we can pre-generate the signals for each student for each round (on paper) to save time.

  I recommend: for each round, we have a deck of cards or slips of paper for the signals. For the forced round, we pre-set the first two to be wrong and the rest randomly (with 2/3 correct). For the expert, we have a separate bag for 90%: e.g., 9 blue and 1 red (if state A, blue is correct) but we set the state so we know what is correct.

  To save time, we can have the signals pre-generated on index cards for each student in each round.

  Sequence:

  Total time: 90 minutes.

  Phase 1: Cascade Formation (25 minutes)
  - Round 1 (natural): 5 minutes
      - Flip coin for state (e.g., heads=A, tails=B).
      - For each student in order (1 to 18), draw a private signal (using the 2/3 bag or pre-drawn card). The student sees the history (previous choices) and then makes a choice (A or B). They write it on the board so the next sees.
      - At the end, reveal the state. Discuss briefly: did the group get it right? How did people feel? (But don't dive into concepts yet.)
  - Round 2 (forced wrong cascade): 10 minutes
      - Announce: "This round, we are setting the state to A. We are also assigning the first two signals to be B (wrong). The rest of the signals will be drawn randomly with 2/3 chance of being correct (A)."
      - Run the round: first two students are given the signal B (so they choose B). Then for students 3 to 18, draw their signals randomly (with 2/3 chance of A, 1/3 of B). They choose in order, seeing the history.
      - We expect that from student3 onward, they all choose B regardless of their signal.
      - At the end, reveal the state (A) and show that the group is wrong.

  Phase 2: Fragility (15 minutes)
  - Round 2 continued: "Now we are going to add one more participant, the expert. The expert gets a signal that is 90% accurate. We'll draw their signal now."
  - Draw the expert's signal (we will set it to A, the correct one) and give it to the expert (student19). The expert sees the entire history (all 18 chose B) and then makes their choice.
  - We expect the expert to choose A (as calculated).
  - Then reveal the state (A) and note that the expert broke the cascade.

  Phase 3: Buying Additional Signals (20 minutes, optional if time)
  - Round 3: 15 minutes
      - Flip coin for state.
      - Each student, when called, first decides whether to buy a second signal (cost 0.2 points). They announce their decision.
          - If they buy, they draw two private signals (both 2/3 accurate) and use both to make their choice.
          - If not, they get one signal and use that along with the public history.
      - They make their choice and write it on the board.
      - After all, reveal the state and calculate payoffs.

  Debrief (20-30 minutes)
  - Start by asking the students about their experience: 
      - In the forced round, why did you choose B even if you got an A signal? (For student3 and beyond, if anyone did get an A signal and still chose B, they might speak up.)
      - How did it feel to be in a cascade?
      - What happened when the expert came in?
  - Then explain the concepts:
      - Rational imitation: each student was using Bayes' rule to combine their private signal with the public information (the choices of others). Show the calculations for student3 in the forced round.
      - The cascade: once the public information becomes strong enough (after two identical choices) that it outweighs any individual's private signal, then individuals ignore their own signal and follow the crowd. This is rational for them because the crowd's choice represents the accumulated information of previous signals.
      - Why the group can be wrong: the early signals were wrong by chance. Because the cascade starts, no further private information is added to the public record. So the group stops learning.
      - Public good aspect: the early choosers' information is a public good. Once a cascade starts, later individuals free-ride on the public information and don't contribute their own. This is why the cascade is brittle: if a latecomer has a very strong signal (like the expert), they can break it.
      - In the buying phase: we see that early individuals have an incentive to buy more information because the public information is weak. Later individuals, in a cascade, have no incentive to buy because they are already following the crowd.

  What might go wrong:
  1. In the forced round, a student might break the cascade. For example, if a student after the first two gets an A signal and decides to go with it, they might choose A. But our calculation showed that student3 should choose B even with an A signal. But if the student does not follow Bayes and instead follows their gut, they might choose A. How to prevent: we must stress that the goal is to maximize the chance of being correct and that they should use the information rationally. We can give them the calculation: 
     - "You see two Bs. Without your own signal, the probability of B is 4/5. Now you get a signal for A. The probability of A becomes 1/3 and B 2/3. So you should choose B to maximize your chance of being correct."

     Alternatively, we can provide a decision rule: choose the option that has the higher posterior probability.

  2. Time: 90 minutes might be tight. We can skip the first natural round if needed and go straight to the forced round. Or reduce the number of students (but 18 is the class size). We can run the cascade with only 10 students and then add the expert.

  3. The students might not understand the updating. We can provide a worksheet for the first few students to write down their reasoning? But that might take too long. Alternatively, after the activity, we show the Bayes calculation for the first few steps.

  4. In the fragility phase, the expert might not break the cascade if their signal is wrong (if we don't set it). To ensure the effect, we set the expert's signal to be correct.

  What the activity cannot reproduce:
  - In real life, people might not be Bayesian. They might have social pressure to conform. This activity isolates the informational reason for herd behavior.
  - The activity uses a very stylized setting. Real cascades might be more complex.

  Deliverable: Rules, Materials, Sequence, Payoff, Script, and Debrief.

  Rules Handout for Students:

  Objective: Choose the true state (A or B) to earn 1 point per correct choice.

  Rules for each round:
  1. The instructor determines the true state (A or B) by a coin flip (except in round 2, where it is set to A).
  2. Students are called in order (1 to 18). 
  3. Each student receives a private signal (unless they buy a second one in phase 3). The signal is correct with 2/3 probability (i.e., it matches the true state 2/3 of the time).
  4. The student sees the choices of all previous students (written on the board) and then makes their own choice (A or B). They write their choice on the board.
  5. After all choices, the true state is revealed.

  Phase 2 (fragility) additional rule: The last student (expert) receives a signal that is correct with 90% probability.

  Phase 3 (buying) additional rule: When called, the student first decides whether to buy a second private signal at a cost of 0.2 points. If they buy, they receive two independent signals (each 2/3 accurate) and must use both to make their choice. If not, they use one signal. Their payoff: 1 point for correct choice minus 0.2 if they bought.

  Script for Instructor:

  Introduction (5 minutes):
