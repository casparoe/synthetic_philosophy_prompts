answer: |-
  Below is a comprehensive in-class activity designed to demonstrate rational herd behavior, information cascades, and the brittleness of consensus. It meets all your constraints: sequential choices, private signals, engineered wrong cascade, fragility demonstration, and optional signal-buying phase. The activity uses a simple binary choice (e.g., "City A vs. City B has a larger population") with private signals of 2/3 accuracy. I'll provide the full blueprint, including rules, materials, script, timing, payoff scheme, and debrief. The arithmetic for cascades is pre-tested (details in **Phase 1**), and failures are addressed in **Predictable Problems**.

  ---

  ### **Activity Blueprint: The Cascade Game**

  #### **Learning Goal**  
  Students experience how rational individuals, using private and public information, can collectively reach a wrong consensus. They see why:  
  - Imitation is individually rational.  
  - Cascades "freeze" new private information.  
  - Early signals act like public goods.  
  - Consensus is confident but brittle.  

  ---

  ### **Rules Summary**  
  - **State of the world**: Two possibilities (A or B), one is randomly true (e.g., "City A is larger than City B").  
  - **Private signal**: Each student gets one (free) clue: 2/3 chance of being correct.  
  - **Sequence**: Students choose in fixed order (1 to 18). Each sees all prior choices but not private signals.  
  - **Payoff**: 1 point for correct choice, 0 for wrong. Small prize (e.g., candy) for top scorer.  
  - **Phases**:  
    1. **Cascade Formation**: Two rounds (one natural, one engineered wrong cascade).  
    2. **Fragility**: Add an "expert" (90%-accurate signal) to break consensus.  
    3. **Signal-Buying (Optional)**: Students pay points for a second private signal.  

  ---

  ### **Materials**  
  - **Signals**: Two bags/boxes labeled "Signals":  
    - Bag 1: 4 blue cards ("A"), 2 red cards ("B") → *If true state is A, blue is correct (P=2/3)*.  
    - Bag 2: 4 red cards ("B"), 2 blue cards ("A") → *If true state is B, red is correct (P=2/3)*.  
  - **Expert signals**: Separate bag with 9 correct/1 incorrect card (90% accuracy).  
  - **Choice board**: Whiteboard to display choices (e.g., "Student 1: B, Student 2: B...").  
  - **Coin**: To flip for true state (except in engineered round).  
  - **Timer**: For 90-minute management.  

  ---

  ### **Sequence & Script**  
  **Total Time**: 90 minutes (adjust phases if short).  
  **Instructor Script** is in *italics*.  

  #### **Setup (5 min)**  
  *"We’re playing a game about guessing the true state of the world. There are two possibilities: A or B (e.g., which city is larger). Each of you will get a private clue and see what others chose before you. Your goal is to be correct—you earn 1 point per correct choice. The top scorer gets a prize. I’ll flip a coin to pick the true state, but I won’t reveal it until the end. Let’s begin!"*  

  ---

  #### **Phase 1: Cascade Formation (30 min)**  
  **Goal**: Engineered wrong cascade where all follow despite contrary signals.  
  **Rounds**:  
  - **Round 1 (Natural, 10 min)**:  
    - Flip coin: Heads = A, Tails = B (record secretly).  
    - Signals: Use bag matching true state (e.g., if A, use Bag 1).  
    - Students choose in order:  
      1. Student 1 sees no history → chooses based on their signal.  
      2. Student 2 sees Student 1’s choice → combines with their signal.  
      3. Continue to Student 18.  
    - *Reveal true state*. Discuss briefly: *"Did the group get it right? How did your choices feel?"* (No concepts yet).  

  - **Round 2 (Engineered Wrong Cascade, 20 min)**:  
    - *"This round, I’m setting the true state to A. But—here’s the twist—I’m also setting the first two signals to 'B' (wrong). The rest of you will get random signals, with 2/3 accuracy as before."*  
    - **Why this works**:  
      - Student 1: Forced signal "B" → chooses B.  
      - Student 2: Forced signal "B" → chooses B.  
      - Student 3: Sees two B’s. Even if their signal is "A" (which occurs 1/3 of the time), Bayes’ rule shows choosing B is rational:  
        - Prior odds (A:B) = 1:1. After two B’s, P(B) = 4/5 (see **Arithmetic Check** below).  
        - With a conflicting "A" signal, P(B) = 2/3 > 50% → Student 3 chooses B.  
      - Students 4–18: See unanimous B’s → ignore private signals (even "A") and choose B.  
    - *Run round*: First two get "B" signals. Students 3–18 draw from Bag 1 (true state A, so blue="A" is correct).  
    - *Reveal true state (A)* → Group is wrong.  

  **Arithmetic Check**:  
  - After two B’s, P(B) = [P(two B’s|B) × P(B)] / [P(two B’s|B)×P(B) + P(two B’s|A)×P(A)] = [(4/9 × 1/2) / ((4/9 × 1/2) + (1/9 × 1/2))] = 4/5.  
  - Student 3 gets "A" signal: Combines with two B’s → P(B) = [4/5 × 1/3] / [4/5 × 1/3 + 1/5 × 2/3] = 2/3. Choosing B maximizes expected payoff.  

  ---

  #### **Phase 2: Fragility (20 min)**  
  **Goal**: Expert breaks consensus with better signal.  
  *"Now, we add one more player—an 'expert' with a stronger clue (90% accurate). Let’s see what happens after the group has locked in."*  
  - **Round 2 Resumed**:  
    - Students 1–18 have chosen B (visible on board).  
    - **Student 19 (Expert)**:  
      - Sees all 18 B’s.  
      - Draws from expert bag (90% accurate; set to "A" to ensure break).  
      - Updates beliefs:  
        - Prior from 18 B’s: P(B) ≈ 1 (but technically 0.999+).  
        - With "A" signal: P(A) = [P(18 B’s|A) × P(A|expert signal)] / total ≈ 0.69 (see math below) → Chooses A.  
      - Writes choice on board.  
    - *Reveal true state (A)* → Show group was wrong, but expert broke consensus.  

  **Arithmetic Check**:  
  - P(18 B’s|A) = (1/3)^2 × 1^16 = 1/9 (first two wrong, rest cascade).  
  - P(18 B’s|B) = (2/3)^2 × 1^16 = 4/9.  
  - Expert signal "A": P(A|evidence) = [P(18 B’s|A) × 0.9] / [P(18 B’s|A)×0.9 + P(18 B’s|B)×0.1] ≈ 0.69.  

  ---

  #### **Phase 3: Signal-Buying (Optional, 20 min)**  
  **Goal**: Show free-riding on public information.  
  *"New rule: Before choosing, you can pay 0.2 points for a second private signal. Ask yourself: Is buying extra information worth it?"*  
  - **Round 3 (10 min)**:  
    - Flip coin for true state.  
    - Each student decides to buy before seeing signals:  
      - **Cost**: 0.2 points (deducted even if wrong).  
      - **Benefit**: Two independent signals (each 2/3 accurate).  
    - Students choose in order, seeing history.  
  - **Expected Result**: Early students buy signals (weak public info); late students in cascades free-ride (strong public info makes buying useless).  

  ---

  #### **Debrief (15 min)**  
  **Map Experiences to Concepts**:  
  - **Q1**: *"In Round 2, why did you choose B even with an 'A' signal?"*  
    → **Rational Imitation**: "Your private signal was outweighed by public information. Choosing B was statistically optimal (P(B)=2/3 > 50%)."  
    → **Key Point**: Individuals are rational, but the group fails.  

  - **Q2**: *"Why did the group settle on the wrong answer?"*  
    → **Information Cascade**: "After two B’s, no new private signals entered the public record. Choices just copied the crowd."  
    → **Public Good**: "Early students' signals guided everyone. Later students free-rode on that info."  

  - **Q3**: *"Why did the expert change everything?"*  
    → **Brittle Consensus**: "One strong signal overruled the cascade because public info was built on only two real signals."  

  - **Q4 (If signal-buying)**: *"Who bought a second signal? Why/why not?"*  
    → **Free-Riding**: "In cascades, buying is pointless—public info is dominant. Early on, it’s valuable."  

  **Conclusion**:  
  *"Today, you saw why 'everyone acted rationally' and 'the group was wrong' aren’t contradictions. Herd behavior isn’t stupidity—it’s rational people responding to limited information. But it can go wrong if early signals are misleading, and it’s fragile because the crowd stops updating. That’s why real-world consensus often feels thin!"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Student 3 breaks the cascade in Round 2**:  
     - *Why*: Misunderstanding Bayes or social defiance.  
     - **Fix**: Pre-brief: *"You’re trying to maximize your points—use math, not gut. If you see two B’s, P(B) ≥ 2/3 even with an 'A' signal."*  

  2. **Time runs short**:  
     - **Fix**: Skip Round 1 or signal-buying. Fragility phase is critical.  

  3. **Expert doesn’t break cascade**:  
     - *Why*: If their signal is wrong (10% chance).  
     - **Fix**: Rig the expert signal (set to correct) to ensure the effect. Admit this in debrief: *"In reality, experts aren’t perfect, but we forced it to show the possibility."*  

  4. **Confusion about signals**:  
     - **Fix**: Use physical cards (blue/red) and label bags: *"Bag for True State A: 4 blue (A), 2 red (B)"*.  

  ---

  ### **What the Activity Cannot Do**  
  - **Social Pressure**: This model isolates *informational* herding. Social conformity (e.g., fear of standing out) isn’t captured—you’ll need to discuss this separately.  
  - **Complex Real-World Dynamics**: Cascades in markets/politics involve emotions, media, etc. Use debrief to connect: *"This is a simplified lab version—real life adds layers."*  

  ---

  ### **Argument for Your Friend**  
  After the activity, you can say:  
  *"The group was wrong, but every person acted rationally. Each student, at their turn, chose what their evidence recommended—public choices revealed others' signals, and copying became optimal. But because the first two signals were wrong, the crowd locked in error. Worse, no one’s private doubts entered the record once copying started. That’s why consensus feels hollow: it’s not that people are lying; it’s that rational imitation hides their uncertainty. And it’s brittle—one strong signal shattered it. Herd behavior isn’t proof of irrationality; it’s proof that rationality + limited information can fail collectively."*  

  This activity gives students (and your friend) visceral proof. Run it—then reopen the debate!
