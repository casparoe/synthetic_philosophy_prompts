prompt: |-
  I'm a second-year PhD in metaphysics and I'm trying to work out how much of a lecture handout I can trust. We had a visitor give a talk on dispositions last term and his handout compressed the whole finks-and-masks business into a paragraph. Reconstructed from memory, roughly:

  'The simple conditional analysis says that to be fragile is just to break if struck. Finkish cases refute it: the glass under a spell that would toughen it the instant it's struck is still fragile, but it won't break when struck, so the conditional comes out false. Masks are really finks under another name. In both cases the glass doesn't break when struck, and in both cases it's the surroundings rather than the glass that decide what happens; the bubble wrap is just a fink that happens to sit outside the glass. That's why the analysis needs a ceteris paribus clause, and once you have it -- fragile means breaks when struck unless something prevents it -- the analysis works and the rest of the literature is cleanup. The real lesson is that dispositions aren't intrinsic to their bearers at all: since what a thing does depends on what's around it, fragility is a relation between the glass and the things that can interfere with it, which is why people now treat dispositional predicates as describing ideal-case behaviour rather than as picking out properties.'

  I'm fairly confident the fink case is real, and the last sentence smells like an overreach, but I cant tell where the line is. Go through it clause by clause: what someone who actually works on dispositions would accept, what they'd wince at, what's flatly wrong. Three things I specifically want sorted out. (a) Are masks and finks really the same phenomenon, or is that a live dispute being sold to me as settled? (b) Is the ceteris paribus fix as unproblematic as he makes it sound? I have a vague memory of a vacuity or triviality objection here -- if there is one, does it sink the analysis or just force a different repair? (c) Does the final claim about dispositions not being intrinsic follow from anything true in the rest? And one more thing I half-remember from somewhere: isn't there a third kind of case that cuts the other way -- something that does the characteristic thing without having the disposition at all, so the conditional is too weak rather than too strong? If that's a real category, say where it fits and whether his 'it's the surroundings that decide' story can absorb it. Don't just give me the received view -- tell me which sentences are contested and which side I'd be buying into if I repeated them.
reasoning: |-
  Okay, let me unpack this query from a second-year PhD student in metaphysics. They're grappling with a lecture handout on dispositions that simplifies complex debates around finks and masks. The student wants a granular critique—line by line—with special attention to three issues: (a) the equivalence of finks and masks, (b) viability of the ceteris paribus fix, and (c) whether dispositions' extrinsic nature follows. They also hint at a possible third type of counterexample (mimics?) and want to know contested positions.

  First, I need to verify the accuracy of each claim in the reconstructed handout. The simple conditional analysis (SCA) framing seems standard: fragility = break when struck. Finkish cases (like Martin's spell-protected glass) are indeed canonical counterexamples—they show the conditional fails because the disposition vanishes when triggered. The handout's claim that masks are "just finks under another name" is where things get dicey. While both involve extrinsic interference, the mechanisms differ: finks remove the disposition *during* triggering, while masks allow the disposition to persist but prevent manifestation. Bird's distinction here is crucial—lumping them together oversimplifies active debates in the literature. 

  On the ceteris paribus clause: the handout presents it as an easy fix, but I recall Lewis's reformulation faced vacuity objections ("unless prevented" could cover *any* failure, making the analysis circular). Fara's habitual response might dodge this, but it shifts from conditionals to generics—hardly a straightforward repair. The student's vague memory about a "third kind" case likely points to mimics (reverse finks?) or antidotes, where non-fragile things break when struck (e.g., a stable vase hit by a wrecking ball). These challenge the conditional's sufficiency and aren't neatly explained by "surroundings decide" since the object itself lacks the disposition.

  The handout's concluding leap—that dispositions aren't intrinsic—is partially defensible (interference cases show extrinsic dependence), but controversial. Molnar/Fara argue for intrinsic bases even if manifestations require cooperative conditions. The "ideal-case behavior" framing leans toward Carnap-style operationalism, which many reject for obscuring dispositional properties. 

  For the student's specific asks: (a) Masks≠finks is a live dispute; (b) ceteris paribus fixes are far from unproblematic (vacuity looms); (c) the extrinsic claim doesn't strictly follow (intrinsic bases can exist). The mimic cases (third kind) do exist and strain the "surroundings decide" account. I should flag which claims are minority views versus consensus, and note how repeating the handout's lines might align them with specific camps (e.g., Bird on masks/finks, Mumford on vacuity). 

  Need to emphasize where the lecturer oversimplifies: equating masks/finks ignores mechanistic differences, the cp clause isn't a panacea, and the extrinsic conclusion overreaches. The student's skepticism about the last line is spot-on.
answer: |-
  Let's dissect this handout line-by-line, highlighting consensus, controversy, and errors from the perspective of contemporary disposition literature. Your instincts about overreach are good.

  **Line-by-Line Breakdown:**

  1.  **'The simple conditional analysis says that to be fragile is just to break if struck.'**
      *   **Status:** Accurate description of SCA. Foundational starting point.
      *   **Contested?** SCA itself is *widely rejected* today due to counterexamples. This is merely stating what SCA *is*.

  2.  **'Finkish cases refute it: the glass under a spell that would toughen it the instant it's struck is still fragile, but it won't break when struck, so the conditional comes out false.'**
      *   **Status:** **Correct.** This is C.B. Martin's classic finkish case. It's the *locus classicus* for showing SCA fails on sufficiency (the conditional is false, but the disposition is present). Universally accepted as a refutation of the *naive* SCA.

  3.  **'Masks are really finks under another name.'**
      *   **Status:** **Highly Controversial / Likely False.**
      *   **Contested?** **YES, this is a major simplification bordering on error.** Here's the distinction crucial to current debates:
          *   **Finks:** The disposition *ceases to exist* (or is removed) precisely *at the moment* it is needed (triggered). (The spell *makes it not fragile* when struck).
          *   **Masks:** The disposition *remains intact*, but something *external* prevents the manifestation *despite* the triggering. (Bubble wrap prevents the struck glass from breaking, but the glass *remains fragile*).
      *   **Why it matters:** Many proposed analyses (like Lewis's reformed conditional analysis) can handle finks *or* masks, but struggle with the other. Treating them as identical obscures important differences in *how* the manifestation is blocked and what that implies for the nature of the disposition itself. **Claiming they are the same phenomenon is not settled; it's a significant point of contention.** Alexander Bird is a prominent proponent of seeing masks as a distinct challenge; David Lewis treated them separately.

  4.  **'In both cases the glass doesn't break when struck...'**
      *   **Status:** True, but superficial.

  5.  **'...and in both cases it's the surroundings rather than the glass that decide what happens;'**
      *   **Status:** **Overgeneralization / Partially True but Misleading.**
      *   **Contested?** **YES.** While the *manifestation failure* is caused by the surroundings in both cases, this phrasing strongly suggests the *disposition itself* (fragility) is constituted by or dependent on the surroundings. This directly feeds into the handout's controversial conclusion. Many dispositional realists (e.g., Stephen Mumford, Rani Anjum, Jennifer McKitrick) argue the disposition (the *causal power*) is an intrinsic property of the object *at the time of triggering*, even if its manifestation requires cooperative circumstances. The surroundings *interfere* with the manifestation of an intrinsic power, they don't necessarily "decide" the nature of the power itself. This is a core metaphysical debate.

  6.  **'...the bubble wrap is just a fink that happens to sit outside the glass.'**
      *   **Status:** **False / Illustrates the Error in Point 3.** Bubble wrap is the *paradigm case of a mask*, not a fink. The glass under bubble wrap *remains fragile* (its intrinsic structure hasn't changed), the wrap simply absorbs the impact. A fink would actively change the glass's structure upon impact to make it non-fragile at that moment. Conflating them is a significant mistake.

  7.  **'That's why the analysis needs a ceteris paribus clause, and once you have it -- fragile means breaks when struck unless something prevents it -- the analysis works and the rest of the literature is cleanup.'**
      *   **Status:** **Wildly Overoptimistic / Incorrect.**
      *   **Contested?** **YES, emphatically.** Adding "unless something prevents it" (a *ceteris paribus* or proviso) is the *first step*, not the final solution. The major problem is **triviality/vacuity**:
          *   **The Problem:** What does "unless something prevents it" mean? If it means "unless something prevents the manifestation *of the disposition*", then the analysis becomes circular: "X is disposed to M when S iff X would M when S, *unless it isn't disposed to M when S*." It explains dispositions in terms of themselves.
          *   **Lewis's Reformed Analysis:** David Lewis proposed a more sophisticated reformed conditional analysis (RCA) using the idea of the disposition *retaining* its "causal basis" during the test. RCA handles finks well but struggles notoriously with masks (Bird's objections) and the mimics you recall (see below).
          *   **Not "Cleanup":** The literature exploded *after* these analyses (RCA, Martin, Bird, Fara, Choi, etc.) precisely because the problems (masks, mimics, vacuity) are deep and persistent. **Claiming the CP clause fixes it and the rest is cleanup is flatly wrong and ignores decades of complex debate.** The vacuity problem is particularly serious and arguably *does* sink simple CP fixes; it forces much more complex analyses (like RCA or moving away from conditionals entirely).

  8.  **'The real lesson is that dispositions aren't intrinsic to their bearers at all...'**
      *   **Status:** **Highly Controversial Conclusion / Not Necessarily Follows.**
      *   **Contested?** **YES, strongly.** While the counterexamples show that the *manifestation* of a disposition depends on extrinsic circumstances (absence of finks, masks, etc.), it **does not follow** that the disposition *itself* is not an intrinsic property. This is the core of the debate:
          *   **Intrinsic Base View:** (e.g., Mumford, Anjum, McKitrick, Molnar, many scientific realists) The disposition is grounded in an intrinsic, categorical (or powerful) property of the object. The glass's fragility is intrinsic, rooted in its molecular structure. The *exercise* of the power requires extrinsic conditions to be "right" (no interference). The power itself is intrinsic. Counterexamples show the *manifestation conditions* are extrinsic, not necessarily the power.
          *   **Extrinsic/Relational View:** (e.g., some interpretations of conditional analyses, perhaps the lecturer) The disposition *just is* the reliable connection between stimulus and manifestation under normal conditions. Since what counts as "normal" or the absence of interferers is extrinsic, the disposition is fundamentally relational. Counterexamples reveal this relational nature.
      *   **Does it follow?** **No.** Point 5 (surroundings "decide") was already contentious. The counterexamples show extrinsic factors can *prevent manifestation* or *remove the disposition temporarily* (finks), but they don't *force* the conclusion that the disposition, when present, isn't an intrinsic feature. The intrinsic base view offers a coherent alternative explanation.

  9.  **'...since what a thing does depends on what's around it, fragility is a relation between the glass and the things that can interfere with it...'**
      *   **Status:** **Controversial Interpretation.** Repetition of the extrinsic view. "What a thing *does*" (its behavior/manifestation) indeed depends on surroundings. But "fragility *is* a relation" is the contentious metaphysical claim derived from this observation, which the intrinsic base view rejects. It defines fragility *as* the relation, rather than an intrinsic property whose *manifestation* is relationally sensitive.

  10. **'...which is why people now treat dispositional predicates as describing ideal-case behaviour rather than as picking out properties.'**
      *   **Status:** **Misleading / Overgeneralization / Partly False.**
      *   **Contested?** **YES.** While *some* philosophers (often those influenced by operationalism or Carnap) lean towards this, it is **not** the dominant view in contemporary metaphysics of dispositions. Most realists actively argue dispositional predicates *do* pick out genuine properties (powers, capacities) of objects, even if their ascription depends implicitly on normal conditions. The debate is about the *nature* of those properties (intrinsic vs. relational), not whether they are properties at all. Framing it as "ideal-case behaviour" leans towards an anti-realist or reductionist view that many dispositional realists explicitly reject. The "ideal case" language also risks trivializing the complex interplay between intrinsic powers and extrinsic manifestation conditions.

  **Addressing Your Specific Queries:**

  1.  **(a) Are masks and finks really the same phenomenon?**
      *   **Answer: No, they are widely regarded as distinct challenges.** While *both* show the stimulus-manifestation connection isn't reliable, they do it in different ways with different implications:
          *   **Finks:** Attack the persistence of the disposition *itself* during triggering. Challenge the *stability* requirement.
          *   **Masks:** Allow the disposition to persist intact but prevent the manifestation. Challenge the idea that the disposition alone guarantees manifestation under triggering. They highlight the need for *manifestation partners* or the absence of *antidotes*.
      *   **Contested?** The lecturer's claim that they are the same is **not the mainstream view and is actively contested** (e.g., by Bird). Treating them as identical oversimplifies the landscape and obscures why some analyses (like Lewis's RCA) handle one better than the other. By repeating "masks are finks," you'd be aligning with a minority and overly simplistic position.

  2.  **(b) Is the ceteris paribus fix unproblematic?**
      *   **Answer: Absolutely not. The vacuity/triviality problem is a major objection.** Simply adding "unless prevented" makes the analysis circular if "prevented" means "prevents the manifestation *of this very disposition*". It doesn't provide an informative, non-circular analysis.
      *   **Does it sink SCA?** Yes, it sinks the *simple* CP fix. It forces proponents of conditional analyses towards much more sophisticated versions like Lewis's RCA (which appeals to a persisting "causal basis" - itself a contentious notion) or alternative approaches like Manley and Wasserman's *graded* dispositions or Fara's *habitual* analysis (using generics: "would *characteristically* break if struck"). **The lecturer's claim that the CP fix works and the rest is "cleanup" is profoundly misleading and ignores the central difficulties that define the field.** The problems are deep and ongoing.

  3.  **(c) Does the final claim about dispositions not being intrinsic follow?**
      *   **Answer: No, it does not strictly follow from the counterexamples.** While the counterexamples show that the *manifestation* of a disposition is sensitive to extrinsic factors (a point agreed upon by both sides), they are compatible with the disposition *itself* being an intrinsic property. The intrinsic base view provides a coherent alternative explanation: the object has an intrinsic power; finks temporarily remove that intrinsic power; masks allow the intrinsic power to exist but block its typical effect. **The leap to "dispositions aren't intrinsic at all" is a substantive (and contested) metaphysical claim, not a logical consequence of the counterexamples.** By repeating this, you'd be endorsing a specific (and controversial) ontological stance in the intrinsic/extrinsic debate.

  4.  **The Third Kind of Case (Mimics / Reverse Finks / Antidotes?):**
      *   **Yes! You recall correctly.** These are cases where the conditional is *true* (the thing manifests M when S), but the disposition is *absent*. They challenge the *necessity* of the conditional for having the disposition.
          *   **Mimics/Reverse Finks:** (e.g., Sungho Choi) A non-fragile object (e.g., a specially treated super-tough glass) is under a spell that *makes it fragile* only at the instant it is struck. It *breaks when struck* (so the conditional is true), but intuitively, it *wasn't fragile* before being struck. The disposition is *finkishly acquired*.
          *   **Antidotes (acting on the manifestation):** While masks prevent manifestation *despite* the disposition, mimics make the manifestation happen *without* the stable disposition. Mimics show the conditional is too *weak* (something can satisfy it without having the disposition) just as finks/masks show it's too *strong* (something can have the disposition without satisfying it).
      *   **Can the "surroundings decide" story absorb it? Not easily, and it strains the handout's narrative:**
          *   Mimics involve the surroundings *conferring* the disposition (or its manifestation) temporarily, not *interfering* with an existing intrinsic disposition. This fits awkwardly with the handout's claim that fragility is "a relation between the glass and things that can interfere with it". Here, the surroundings are *creating* the manifestation relation where it didn't intrinsically exist.
          *   Mimics directly challenge the handout's final claim that disposition predicates describe "ideal-case behaviour". What's the "ideal case" for the super-tough glass? Not breaking? But it *does* break when struck (due to the spell). The mimic case shows that reliably manifesting behavior under triggering conditions isn't sufficient for having the disposition *in the intended sense* (a stable property).

  **Summary & Where the Lecturer Goes Wrong:**

  *   **Good:** Correctly states SCA and the fink counterexample.
  *   **Major Error 1:** Equating masks and finks. They are distinct problems.
  *   **Major Error 2:** Presenting the simple "unless prevented" CP clause as an unproblematic fix. It faces devastating circularity/vacuity objections, forcing complex reforms or alternative approaches. The claim that the rest is "cleanup" is absurd.
  *   **Overreach/Controversial Leap:** Concluding dispositions are not intrinsic at all. This doesn't follow from the counterexamples; it's a contested ontological claim. Counterexamples show extrinsic *manifestation* dependence, not necessarily extrinsic *disposition* constitution.
  *   **Missing Key Challenge:** Ignores mimic cases which show the conditional is insufficient (too weak).
  *   **Misleading Framing:** Overgeneralizing the "surroundings decide" point and suggesting the "ideal-case behaviour" view is dominant when realism about dispositional properties is widespread.

  **If you repeat the handout:** You'd be endorsing a view that conflates distinct problems (masks/finks), dismisses serious objections (vacuity), ignores significant counterexamples (mimics), and advocates for a highly controversial metaphysical conclusion (non-intrinsicality) under the guise of it being the settled lesson of the counterexamples. Stick to the well-established points (SCA, finks, masks as distinct problems, the *manifestation* dependence on surroundings) and acknowledge the deep controversies surrounding the analysis and metaphysics.
