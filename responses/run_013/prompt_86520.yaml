prompt: |-
  Ok, phil of mind PhD student here, writing a chapter that touches Molyneux, and I keep running into sensory substitution stuff. You know the drill: a camera feeds a grid of electrodes on someone's tongue or back, or converts the image into a soundscape, and after weeks or months of training a blind user can reach out and grab a cup, tell a square from a triangle, dodge obstacles. Everyone describes the result as the person now seeing, or seeing with their tongue, and I think that description is smuggling in a whole theory nobody bothers to argue for.

  So what does the practice presuppose? Does building and using one of these devices require that there be a shared spatial content -- the same square, the same layout -- that can ride on any channel, so that shape content is amodal and what makes something a case of seeing is the information it carries rather than the organ carrying it? Or is the weaker claim enough, that there's just an isomorphism between the stimulation pattern and the layout, which is compatible with the user never perceiving anything visual at all? And here's what bugs me: the months of training look like the empiricist answer to Molyneux, while the its-basically-seeing framing looks like the nativist one. Do those have to conflict, or is one of them just packaging?

  I want the implicit theory reconstructed: what the practice strictly presupposes vs what it merely fits nicely with, which rival views of perceptual content it quietly rules out, and what would actually have to change in how the devices are built or pitched if you adopted a rival -- say, modality-specific content and no shared square. Keep it tight, I don't need a lit review.
reasoning: |-
  Okay, this user is a philosophy of mind PhD student working on a chapter involving Molyneux's problem, and they're grappling with sensory substitution devices (SSDs). They're frustrated that everyone just assumes these devices enable "seeing" without arguing for it. They want to unpack the presuppositions behind SSD research and figure out what's truly necessary versus what's just convenient packaging.

  First, I need to recall Molyneux's question: If a blind person gains sight, could they immediately recognize shapes they knew by touch? Empiricists say no—experience needed; nativists say yes—innate spatial concepts. SSDs seem relevant here because they're sort of answering a modern version of that question. 

  The user mentions that SSD training takes months, which feels empiricist, but the "it's basically seeing" framing seems nativist. That's an interesting tension. Are these conflicting or just different levels of description? 

  Breaking down what SSDs presuppose: At minimum, they need spatial isomorphism—that patterns on the tongue or back can correspond to visual space. But the stronger claim is that the content is amodal—the same spatial info regardless of the sense. The user wants to know if the weaker claim is sufficient, or if the practice secretly requires the stronger one.

  Also, what views does this quietly rule out? If someone thinks perceptual content is strictly modality-specific, like vision has inherently visual qualia, that might clash with calling SSD use "seeing." But SSD researchers probably don't care about qualia—they're about functional equivalence. 

  The user asks what would change if we adopted modality-specific content. Probably the pitch: instead of "seeing," we'd say "spatial sensing." But the device design might not change, because isomorphism is all you need for function. Training might still be lengthy, emphasizing cross-modal learning. 

  I should clarify that empiricism/nativism here is about concept acquisition, not necessarily conflicting with SSD success. The long training fits empiricism, but the nativist could argue innate concepts just need unlocking via the right input. 

  Key points: SSD practice minimally requires isomorphism and functional equivalence. Calling it "seeing" is optional and theory-laden. Modality-specific views would just avoid that label but wouldn't break the tech. The tension between empiricist training and nativist framing is superficial—both can coexist if we separate mechanism from phenomenology. 

  Need to keep it tight for the user—no lit review, just crisp analysis of presuppositions versus extras.
answer: |-
  Here's a tight reconstruction of the implicit theoretical commitments in SSD research and practice, separating strict presuppositions from optional packaging:

  **1. Strict Presuppositions (Non-Negotiable for SSD Function):**
     - **Spatial Isomorphism:** There *must* be a learnable structural correspondence (isomorphism) between patterns in the sensory input (electrodes, soundscapes) and spatial properties/distal objects. This is foundational for training to succeed.
     - **Information Commonality:** Spatial layout information *can be extracted* from a novel sensory channel. The world's spatial structure is detectable via non-standard inputs.
     - **Functional Plasticity:** The brain *can learn* to use this novel input to guide spatially appropriate behavior (dodging, grasping) and make distinctions (square vs. circle). This requires cross-modal or amodal processing capabilities.
     - **Empiricist-Compatible Learning:** Significant, structured training *is essential* to achieve functional competence. This presupposes no *immediate* recognition upon receiving the new input.

  **2. "It's Basically Seeing" Framing (Optional Packaging, Not Strictly Required):**
     - **Amodal Spatial Content (Strong Claim):** This framing often smuggles in the idea that spatial content (the layout, the shape) is fundamentally amodal. The "same" content (e.g., the squareness) is delivered via a different channel, implying that modality is incidental to the core spatial representation.
     - **Functionalism About Perception:** Perception is defined by its *role* (guiding action based on distal object properties) rather than by its sensory modality or specific qualitative feel (qualia). If the SSD user performs visual tasks using spatial information, it's functionally equivalent to seeing.
     - **Phenomenological Ambition/Anti-Qualia Zeal:** The language often hints that the *experience itself* becomes quasi-visual or that the modality-specific qualia don't matter (or don't exist in a strong sense). This is an *interpretation*, not a requirement of the device's function.

  **3. Rival Views Quietly Ruled Out (or Made Awkward):**
     - **Strong Modality-Specific Content (Sense-Datum Theories, Some Direct Realism):** Views holding that the *intrinsic character* of the sensory experience (e.g., visual qualia) is essential to the content ("*seeing* a square requires *visual* sensations") are undermined. SSDs show successful spatial behavior *without* the assumed modality-specific input.
     - **Strict Nativist Answer to Molyneux:** The *necessity of extensive training* directly contradicts the notion that innate spatial concepts would allow *immediate* transfer upon receiving new sensory input matching the spatial structure. SSDs empirically support the empiricist emphasis on learning.
     - **Radical Enactive/Embodied Views (No Shared Content):** If perception is fundamentally action-oriented with *no* amodal spatial content shared across modalities, the very premise of *transferring* spatial layout information via a new channel becomes incoherent. SSDs require *some* level of shared, extractable structure.

  **4. What Changes with a Modality-Specific Rival View (e.g., "No Shared Square"):**
     - **Pitching/Description:** You'd *never* call it "seeing" or even imply quasi-visual phenomenology. You'd describe it as "learning a novel **spatial sensing skill**" or "acquiring **tactile/spatial expertise** using encoded visual information." Focus shifts entirely to skillful action based on a learned *code*.
     - **Training Emphasis:** Training would be framed as learning arbitrary mappings or complex sensorimotor contingencies (like learning Morse code or Braille), not "opening a new perceptual channel." The "square" felt via the tongue isn't the *same* square content as vision; it's a distinct tactile-spatial representation triggered by the same distal object.
     - **Device Design (Possibly):** If the content *must* be modality-specific, designers might prioritize optimizing for *tactile* discriminability or *auditory* pattern recognition efficiency, rather than trying to preserve an abstract "visual" spatial structure. The goal becomes effective *sensory signaling*, not faithful spatial content transmission. However, the core isomorphism needed for function might look similar.

  **Reconciling Empiricism & "Nativist-Lite" Framing:**
  The long training is *strictly* empiricist. The "it's seeing" framing *isn't* truly nativist. Nativism (in the Molyneux context) claims *immediate* recognition via innate concepts. SSD success *after training* is compatible with:
  - **Weak Nativism:** An innate *capacity* for amodal spatial representation that *requires* sensory input (of *any* learnably isomorphic kind) and learning to activate/utilize it. The neural "hardware" for space is innate; the "software driver" for the new input is learned.
  - **Functional Equivalence Without Identity:** Achieving the same behavioral outcomes (grasping cups) doesn't require identical perceptual content or phenomenology. The framing is often pragmatic overdrive, not a philosophical claim about content identity.

  **In essence:** SSD practice *requires* isomorphism, information extraction, and learning. Calling it "seeing" *suggests* amodal content, functionalism, and downplays modality-specific qualia. It *rules out* views demanding immediate nativist transfer or denying any common spatial information. Adopting a modality-specific rival changes the description and possibly the training theory, but the core tech (relying on isomorphism) endures. The "empiricist training" and "nativist-lite framing" conflict is mostly superficial packaging – the core presupposition is plasticity enabling *learned* functional equivalence.
