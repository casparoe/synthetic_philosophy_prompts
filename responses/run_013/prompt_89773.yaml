prompt: |-
  I'm a third-year political theory student living a strange double life, and the strangeness is why I'm writing. My dissertation is on the boundary problem: the suspicion that any democratic procedure for deciding who belongs to the demos must already presuppose a demos entitled to run that procedure, so the founding decision about membership cannot itself be democratic. Meanwhile I've drifted onto the advisory group for a small charter city — a new municipality with negotiated legal autonomy, perhaps ten thousand residents over its first decade, whose founding rules (including who counts as a founder, and who counts as a resident once the doors open) will be drafted before anyone lives there. The two halves keep contaminating each other, and I've lost the ability to tell which parts of the theoretical literature are load-bearing for the practical problem and which are just professional furniture.

  So: given three years of one philosopher's time, and the constraint that whatever I work on should be able to change what actually gets written into a founding charter, which of the open questions in the boundary problem should I prioritize, and in what order? I want the ordering defended against explicit criteria — how many other questions in democratic theory and constitutional design depend on the answer; whether it can be settled by argument alone, without the empirical work I'm not trained for; and whether the answer would alter a founding document rather than only a footnote. Two distinctions I'd especially like you to take a position on, because I suspect one of them is where the real work lies. First, whether the founding case and the revision case are governed by the same principles at all: demos boundaries drift constantly through migration, expatriates, children aging in, residents of dependencies, and I genuinely don't know whether a principle that legitimates an initial boundary has anything to say about a boundary being quietly renegotiated for the fifth time. Second, whether the self-selection answer — whoever accepts the rules and shows up constitutes the demos — is a solution or merely a relocation of the problem into the conditions under which self-selection means anything: exit costs, information, whether anyone had an alternative.

  Rank at most four items, most important first, and for each say what would move it up or down my list over the next two years. Close with the questions you'd tell me to deliberately ignore, and be willing to say outright if the honest answer is that the founding case is a philosopher's puzzle and the practical drafting should ignore it entirely. Cap the whole response at 700 words, in continuous prose with the ranking clearly marked — no reading list.
reasoning: |-
  Okay, the user is a political theory student working on their dissertation about the boundary problem in democracy—basically, the paradox that you need a predefined group (the demos) to decide who gets to be in that group. Meanwhile, they're also advising on a real-world charter city project where founding rules, including membership, are being drafted before anyone lives there. They're feeling this tension between theory and practice and want help prioritizing which aspects of the boundary problem they should focus on to actually influence the charter.  

  First, I need to unpack their core request. They want a ranked list (max four items) of open questions in the boundary problem that meet specific criteria:  
  - **Impact**: How many other democratic/constitutional questions depend on solving this?  
  - **Settlability**: Can it be resolved through argument alone (no empirical work)?  
  - **Practicality**: Would the answer change a founding document, not just a footnote?  
  They also explicitly want me to take a stance on two distinctions:  
  1. Whether founding (initial boundary) and revision (ongoing changes) cases follow the same principles.  
  2. Whether self-selection (e.g., "show up and accept rules") is a solution or just relocates the problem to exit costs/information.  

  The user’s unspoken struggles seem deeper:  
  - **Cognitive dissonance**: Theory feels abstract while drafting demands concrete rules. They’re worried their academic work is "professional furniture" (decorative but useless).  
  - **Anxiety about relevance**: Will their dissertation matter beyond academia? The charter city is a rare chance for real impact.  
  - **Urgency**: They have three years and want actionable priorities.  
  - **Identity conflict**: The "strange double life" suggests they feel split between theorist and advisor roles.  

  Now, assessing the two distinctions they raised:  
  - **Founding vs. revision**: I lean toward them being governed by *different* principles. Founding is about bootstrapping legitimacy from scratch (e.g., hypothetical consent), while revision involves path dependence and existing stakeholders. Treating them as the same risks forcing impractical rigidity onto the charter.  
  - **Self-selection**: It’s not a solution—it just shifts the problem to the *conditions* of choice (exit costs, information asymmetry). For the charter, this means self-selection only works if baseline access/fairness is guaranteed first.  

  Ranking priorities (most important first):  
  1. **Self-selection’s enabling conditions**: Directly shapes charter rules about residency requirements, disclosure obligations, and exit rights. High impact (affects all membership questions), settable via argument (e.g., Rawlsian fairness), and would change the document (e.g., clauses on transparent governance).  
  2. **Founding-revision distinction**: Crucial because conflating them could lock the charter into unworkable rigidity. Affects amendment procedures and legitimacy over time. Settable theoretically (e.g., constituent power vs. constituted power debates).  
  3. **Scope of democratic closure**: Determines which entities (e.g., future residents, affected outsiders) the demos must consider. Impacts voting rights and procedural fairness in the charter. Requires argument but might need light empirical input (e.g., "affected" thresholds).  
  4. **Constitutive paradox resolution**: While foundational, it’s less practical—most charters sidestep it via proceduralism. Lowers it in priority unless new scholarship emerges that bridges theory/practice.  

  Questions to ignore:  
  - **Ideal demography debates** (e.g., "optimal" size/heterogeneity): Too abstract and empirically tangled.  
  - **Full dissolution/reconstitution cases**: Irrelevant to a stable charter city.  
  - **The "honest answer"**: The founding case *is* a philosopher’s puzzle—but by tackling priorities 1-3, they’ll indirectly address its practical shadow (e.g., via procedural fairness). The charter should avoid metaphysical justifications and focus on reversible, transparent rules.  

  Final framing: The goal isn’t to "solve" the boundary problem but to make the charter’s membership rules *contestable* and *adaptable*—which is the most democratic outcome possible.
answer: |-
  Here is your prioritized research agenda, ranked by impact on charter drafting within your constraints:

  **#1: Self-selection’s enabling conditions.** This isn't a solution but the *core practical framing*. Prioritize rigorously defining the minimal conditions under which "accepting the rules and showing up" constitutes meaningful consent. Key: **Exit costs** (can residents practically leave without ruin?), **information asymmetry** (what baseline transparency is required pre-commitment?), and **availability of alternatives** (does rejecting the charter imply subjection to a worse default state?). *Why first?* It directly dictates charter clauses on resident rights (e.g., exit visas, property portability), founder disclosure obligations, and transition rules for initial cohorts. High leverage: gets constitutional basics right. Settable via argument (e.g., contractarian thresholds). *Moves down* only if empirical data emerges proving your target founders already guarantee these conditions (unlikely).

  **#2: Foundational vs. Revisionary Boundaries (your first distinction).** Treat them as **distinct problems requiring distinct principles**. Founding legitimacy stems from *procedural fairness in constitution-making* and *avoiding irreversible harm*. Revision legitimacy requires *inclusion of existing stakeholders* and *path-dependent fairness* (e.g., protecting acquired rights). *Why second?* Conflating them risks either paralyzing amendments (demanding impossible "refounding" rigor) or undermining initial legitimacy (applying easy revision standards ex nihilo). Affects charter design: founding requires supermajorities/ratification hurdles; revision needs accessible amendment paths for residents. Highly settable theoretically (e.g., constituent vs. constituted power). *Moves up* if charter debates reveal founders dangerously blurring this line.

  **#3: Scope of democratic closure.** Focus: Who is *owed justification* even if excluded? Prioritize the "all subjected" principle: does the charter’s authority impose binding coercion (taxes, laws) on non-resident workers, ecosystem dependents, or neighboring communities? *Why third?* Forces concrete charter provisions: external arbitration mechanisms, environmental impact bonds, or defined spheres of non-jurisdiction. Impacts broader legitimacy and stability. Mostly settable by argument (clarifying "subjection"), though threshold questions ("significantly affected") need light empirics. *Moves up* if early land/seabed acquisitions suggest major externalities.

  **#4: Constitutive paradox resolution (the "puzzle").** Address only via **pragmatic proceduralism**: the charter must explicitly authorize a future resident body to revisit foundational rules, treating the initial demos as trustees, not owners. *Why last?* Philosophically deep but operationally narrow: any plausible charter answer will be procedural (e.g., "first residents ratify/amend within X years"). Settable by synthesizing trustee models (e.g., Waldron on precommitment). Low document impact beyond mandating a ratification referendum. *Moves up* only if founders resist sunset clauses for their authority.

  **Ignore deliberately:**  
  - Ideal demography (optimal size/diversity): empirically intractable and charter-scale is fixed.  
  - Historical entitlement claims: irrelevant for new territory.  
  - Full dissolution/reconstitution edge cases: impractical for a stable municipality.  

  **The honest answer:** The founding case *is* largely a philosopher’s puzzle. **Ignore attempts to "democratically justify" the initial boundary.** No such justification exists without circularity. Instead, focus your practical drafting energy on:  
  1. **Mitigating founding power imbalances** (via your #1 on self-selection conditions).  
  2. **Ensuring the revision process (#2) is robustly democratic early on.**  
  3. **Minimizing coercive spillovers on outsiders (#3).**  
  The charter gains legitimacy not by solving the paradox, but by making boundaries *contestable and reversible* by those living under them. Prioritize mechanisms, not metaphysics.
