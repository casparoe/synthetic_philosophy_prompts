  ### Decision Tree for Newcomb's Problem Variants

  **Root: Standard Newcomb Setup**  
  Predictor is 99% reliable. You choose between one box (opaque) or two boxes (opaque + transparent $1,000).  
  - **If you one-box:**  
    → Proceed to **Variant 5: Altruistic Payoff**  
  - **If you two-box:**  
    → Proceed to **Variant 3: Copy Predictor**  

  ---

  #### **Variant 5: Altruistic Payoff**  
  *The $1M/$0 and $1,000 go to a stranger you care about equally to yourself. Predictor remains 99% reliable.*  
  - **If you one-box (for the stranger):**  
    → *Leaf: **Evidential Decision Theory (EDT) or Functional Decision Theory (FDT/TDT/UDT)***  
    - *Hardest commitment:* EDT must reject smoking in the Smoking Lesion (even when smoking doesn’t cause cancer) to avoid evidence of a cancer-causing lesion. FDT must accept "commitment races" (e.g., in counterfactual mugging, paying a stranger who correctly guesses your algorithm's output).  
  - **If you two-box (for the stranger):**  
    → *Leaf: **Self-Interest-Prioritizing Hybrid (SIPH)***  
    - *Hardest commitment:* Applying evidential reasoning only to *personal* gain (one-boxing for yourself) but causal reasoning for others (two-boxing here), despite identical stakes.  

  ---

  #### **Variant 3: Copy Predictor**  
  *Predictor is a perfect copy of you, running 1 second ahead. Choice and payout are as in standard Newcomb.*  
  - **If you one-box:**  
    → *Leaf: **Functional Decision Theory (FDT)***  
    - *Hardest commitment:* Cooperating in a one-shot Prisoner’s Dilemma against a known identical copy, risking exploitation if the copy isn’t perfectly aligned.  
  - **If you two-box:**  
    → *Leaf: **Causal Decision Theory (CDT)***  
    - *Hardest commitment:* Two-boxing even in this variant, leaving $999,000 on the table, as your choice doesn’t "cause" the copy’s past action.  

  ---

  ### Unseparated Leaves & Unexplored Combinations  
  1. **EDT vs. FDT/TDT/UDT (Leaf A1)**:  
     - The tree *cannot separate* EDT from FDT/TDT/UDT. Both one-box in standard and altruistic Newcomb. Use the **Smoking Lesion problem** to split them: EDT one-boxes/skips smoking; FDT two-boxes/smokes.  
  2. **Unexplored Combination**:  
     - **Standard: two-box → Altruistic: one-box**  
       - *Diagnosis:* Unattractive. Two-boxing in standard implies rejecting evidential logic, but one-boxing for a stranger requires it. No theory advocates this.  
     - **Standard: one-box → Copy: two-box**  
       - *Diagnosis:* Incoherent. If you one-box in standard due to predictor-algorithm correlation, the copy variant intensifies this link. Two-boxing here denies the core premise of your initial choice.  

  ### Key  
  - **EDT**: Acts on evidence (P(outcome|action)).  
  - **CDT**: Acts on causality (do-calculus).  
  - **FDT/TDT/UDT**: Acts on output of decision algorithm (cross-temporal consistency).  
  - **SIPH**: Self-Interested-Prioritizing Hybrid (evidential for self, causal for others).  

  This tree uses concrete choices to reveal commitments, avoiding theory labels. Variants 2 (transparent box) and 4 (source code) were omitted as they fail to split theories (all agents two-box when boxes are transparent; source code mirrors standard FDT). The 60% reliable predictor also fails to split (EDT and FDT both two-box when predictor reliability <50.05%).
