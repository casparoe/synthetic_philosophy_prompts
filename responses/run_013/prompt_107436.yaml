prompt: |-
  For the past two months a small reading group I co-run (a Discord, a shared spreadsheet of passages, the usual rationalist-adjacent crowd) has been working through the perception/cognition border, and we have hit an impasse I would like help converting into a document. The two camps we keep reading are, roughly, the modularists, for whom the sensory stage is informationally encapsulated and merely hands its output up to central cognition, so that what you believe or expect can change your judgments but never what you see; and the penetration camp, for whom belief, expectation, desire, and freshly acquired category knowledge can alter perceptual experience itself. Every time we think an experiment has settled something, one side has a move that absorbs it: the effect is really attentional, or really post-perceptual, or the task measured a judgment rather than an appearance, or encapsulation was only ever a thesis about the input stage and not about the whole of what is phenomenally given. I would like you to act as a philosopher of mind with real psychophysics literacy and a temperament suited to adversarial collaboration, and to draft the joint statement these two camps could actually put their names to. Think carefully about each claim before committing it to paper, and begin with a short scoping brainstorm of the candidate loci and cruxes before you draft the document itself.

  The document needs four things. First, the claims both sides can sign, about the architecture, about what needs explaining, and about which experimental results are not in dispute — and please make sure none of these are vacuous. Second, the residual disagreements, each stated in wording that its own side would accept as its own position, not a strawman. Third, the cruxes: the sub-questions such that settling one would move at least one side. I want you to organise this part around a four-way taxonomy of where a purported effect could live — the representational content of the percept, the phenomenal character of the percept considered apart from its content, the encoding at an early sensory stage, and the decision or report threshold — and to say, for each crux, which loci the two sides are actually disagreeing about. I also want a crux on whether encapsulation and penetration are meant to be sense-general: is the whole debate an artifact of taking vision as the model sense, and would a clean demonstration in audition, taste, or smell count, or be ruled out in advance as special pleading? Finally, if any part of the dispute is verbal — for instance, if the two sides are using the word perception for the modular input stage and for the whole of the phenomenally given respectively — say exactly which part and why.

  Then the tests. For each crux, give the case, experiment, or argument that both sides would agree bears on it, and record each side's prediction in advance. I have one design in mind that I would like included: a criterion-matched two-interval forced-choice task with a separate appearance report, in which the cognitive factor is manipulated independently of attention, plus a variant where the same factor is made task-irrelevant. Ask each side to write down what it predicts under that design and what result would count against its own view; and ask them both whether there is any evidence at all that each would accept as decisive, and if there is none, to say so plainly and explain why. Format it as a numbered agreed-claims section, then a disagreements table, then a cruxes-and-tests section. Do not include citations or a reading list — I will add those myself — and keep the prose tight; I would rather have a short document both sides could sign than a long one neither could.
reasoning: |-
  We are drafting a joint statement between modularists and penetration theorists in the perception/cognition debate. The goal is to have a document both sides can sign, with agreed claims, residual disagreements, cruxes, and tests.

  ### Scoping Brainstorm: Candidate Loci and Cruxes

  The key issue is where cognitive states (belief, expectation, desire, etc.) influence processing. We can break down the perceptual process into stages:

  1. **Early Sensory Encoding**: The initial transduction and low-level processing of sensory input, which is typically thought to be encapsulated.
  2. **Perceptual Representation**: The stage at which the sensory input is organized into meaningful representations (e.g., objects, scenes). This is where the content of perception is formed.
  3. **Phenomenal Character**: The subjective quality of the perceptual experience, which may or may not be fully determined by the representational content.
  4. **Post-Perceptual Processing**: This includes decision-making, memory, and response generation (e.g., reporting what one saw).

  The modularist position typically holds that cognitive states do not influence stages 1-2 (and sometimes 3), while penetration theorists argue that cognitive states can influence at least stage 2 and sometimes stage 1 and 3.

  Cruxes might be:

  - **Locus of Effect**: Where exactly does the cognitive influence occur? Is it in the early sensory encoding, the perceptual representation, the phenomenal character, or the post-perceptual decision?
  - **Sense-Generality**: Is the debate focused on vision, and would evidence from other senses (audition, taste, smell) be considered equally valid?
  - **Definition of Perception**: Is perception defined as the entire phenomenally given experience, or only up to the input stage?

  ### Drafting the Document

  #### 1. Agreed Claims

  We list claims that both sides can accept. These should be substantive and non-vacuous.

  - **Architecture**: The human mind processes sensory input in stages. There is an early stage (or stages) that is relatively automatic and stimulus-driven, and later stages that involve more interpretive and cognitive processes.
  - **What Needs Explaining**: We must account for how perception is both stable (given the same input, we often see the same thing) and flexible (it can be influenced by context, learning, and expectations). We must also explain the phenomenology of perception and how it relates to judgment and belief.
  - **Undisputed Experimental Results**:
    - Cognitive factors (e.g., expectations, beliefs) can influence reports about perceptual experiences.
    - Attention can modulate perceptual processing, including early sensory responses (e.g., as seen in ERP studies).
    - There are cases where two individuals with the same sensory input report different experiences due to differences in their cognitive states (e.g., in ambiguous figures like the duck-rabbit).
    - Some perceptual aftereffects (e.g., tilt aftereffect) are resistant to cognitive manipulation, suggesting some level of encapsulation at early stages.

  #### 2. Residual Disagreements

  We state the core disagreements in terms each side would accept.

  | Disagreement | Modularist Position (as stated by modularists) | Penetration Position (as stated by penetration theorists) |
  |--------------|------------------------------------------------|----------------------------------------------------------|
  | **Influence on Perceptual Content** | Cognitive states (beliefs, desires, expectations) do not alter the content of perception itself; they only influence post-perceptual judgments and decisions. | Cognitive states can directly alter the content of perception, such that what one sees (or hears, etc.) is different as a function of those states. |
  | **Influence on Phenomenal Character** | The phenomenal character of perception (how things look, sound, etc.) is determined solely by the output of the encapsulated perceptual module and is not altered by cognitive states. | Cognitive states can alter the phenomenal character of perception, making the same stimulus look, sound, or feel different. |
  | **Scope of Encapsulation** | The early sensory processing stages are informationally encapsulated; they do not have access to cognitive states. This encapsulation may extend to the entire perceptual module. | While early sensory processing may be encapsulated, the perceptual processes that produce our conscious experience are not entirely encapsulated and can be influenced by cognitive states. |
  | **Sense-Generality** | The encapsulation thesis applies to all senses; any purported counterexample in another sense modality would be subject to the same scrutiny as in vision. | The penetration thesis is sense-general; evidence from any sense modality (e.g., audition, taste) is relevant, and penetration may occur in all senses. |

  #### 3. Cruxes and Tests

  We organize around the four loci:

  - **Locus 1: Representational Content of the Percept** (what the percept represents, e.g., "I see a duck")
  - **Locus 2: Phenomenal Character Apart from Content** (the subjective feel, e.g., the vividness, the way the duck looks)
  - **Locus 3: Early Sensory Encoding** (low-level sensory processing, e.g., V1 activity)
  - **Locus 4: Decision/Report Threshold** (the stage where one decides what to report)

  For each crux, we identify the locus of disagreement and then propose a test.

  **Crux 1: Locus of Cognitive Influence on Perceptual Content**
  - **Disagreement**: Whether cognitive states alter the representational content of the percept (Locus 1) or only the decision stage (Locus 4).
  - **Test**: Use a criterion-matched two-interval forced-choice (2IFC) task with a separate appearance report. In the 2IFC task, participants are presented with two intervals: one with a target stimulus and one without (or with a different stimulus). They must choose which interval had the target. The appearance report asks about the subjective experience (e.g., on a scale from "looks exactly like A" to "looks exactly like B"). The cognitive factor (e.g., prior knowledge about the likelihood of A or B) is manipulated independently of attention. We also run a variant where the cognitive factor is made task-irrelevant (e.g., by having the participant perform an unrelated task).
    - **Modularist Prediction**: The cognitive factor will affect the decision in the 2IFC task (e.g., bias towards choosing the more expected stimulus) but not the appearance report. The appearance report should be unaffected by the cognitive factor because it reflects the perceptual content. The effect should disappear when the factor is task-irrelevant.
    - **Penetration Prediction**: The cognitive factor will affect both the 2IFC task and the appearance report, even when the factor is task-irrelevant, because it alters the perceptual content.
    - **What Would Count Against Each View**:
      - Against modularism: A significant effect on the appearance report in the task-irrelevant condition.
      - Against penetration: No effect on the appearance report in both conditions, or an effect only in the 2IFC task and not in the appearance report.

  **Crux 2: Influence on Phenomenal Character Apart from Content**
  - **Disagreement**: Whether cognitive states can alter the phenomenal character of the percept without changing its representational content (Locus 2). For example, does an expected stimulus look more vivid?
  - **Test**: Use stimuli that are matched in content but vary in typicality (e.g., a typical vs. atypical color of an object). Measure subjective ratings of vividness, clarity, or other non-content aspects. Manipulate expectation (e.g., tell participants one color is more likely). Control for attention.
    - **Modularist Prediction**: Expectation will not affect the vividness ratings; any effect would be due to response bias.
    - **Penetration Prediction**: Expectation can enhance the phenomenal character (e.g., making expected stimuli look more vivid).
    - **What Would Count Against Each View**: 
      - Against modularism: Significant effect on vividness ratings that cannot be explained by response bias.
      - Against penetration: No effect on vividness ratings when response bias is controlled.

  **Crux 3: Influence on Early Sensory Encoding**
  - **Disagreement**: Whether cognitive states can influence early sensory encoding (Locus 3). This is a stronger claim for penetration and a stronghold for modularism.
  - **Test**: Use neuroimaging (e.g., fMRI or EEG) to measure activity in early sensory areas (e.g., V1 for vision, A1 for audition) while manipulating cognitive factors (e.g., expectation of a stimulus) and controlling attention. The task should be designed to isolate early responses (e.g., the C1 component in EEG, which is thought to originate from V1).
    - **Modularist Prediction**: No modulation of early sensory responses (e.g., C1 amplitude) by cognitive factors when attention is controlled.
    - **Penetration Prediction**: Cognitive factors can modulate early sensory responses even when attention is controlled.
    - **What Would Count Against Each View**:
      - Against modularism: Significant modulation of early sensory responses by cognitive factors in a well-controlled study.
      - Against penetration: No modulation in early sensory areas despite effects in higher areas.

  **Crux 4: Sense-Generality**
  - **Disagreement**: Whether the debate is sense-general or if vision is a special case. Would a demonstration in another sense count equally?
  - **Test**: Run similar experiments in non-visual modalities (e.g., audition: does knowing a word make it easier to hear in noise?; taste: does knowing what a food is alter its taste intensity?). Use the same design as in Crux 1 (2IFC with appearance report) for audition or taste.
    - **Both Sides Agree**: Evidence from any sense modality is relevant. However, modularists might argue that if early sensory areas in other modalities are encapsulated, then penetration in higher-level processing in that modality might not count as true perceptual penetration. Penetration theorists would count any effect on the phenomenal experience in any sense as penetration.
    - **What Would Count Against Each View**:
      - Against modularism: A clear effect on appearance reports in a non-visual modality under conditions that rule out attention and post-perceptual effects.
      - Against penetration: If no such effects are found in any non-visual modality despite rigorous testing.

  **Verbal Dispute?** 
  - Yes, there is a verbal disagreement about the term "perception". Modularists often use "perception" to refer to the output of the encapsulated module (which is then passed to cognition). Penetration theorists use "perception" to include the entire phenomenally conscious experience. This leads to different interpretations of what counts as a perceptual effect. We agree to be explicit about the stage we are referring to (e.g., "early sensory", "perceptual representation", "phenomenal experience").

  **Is There Decisive Evidence?**
  - Both sides are asked: Is there any evidence you would accept as decisive against your view?
    - Modularist: Yes, if an experiment shows a cognitive effect on an appearance report in a task-irrelevant condition, and if that effect is not due to attention or response bias, and if it is replicated in multiple labs. Also, if early sensory activity (e.g., C1) is modulated by cognitive factors in a well-controlled study.
    - Penetration Theorist: Yes, if an experiment with high ecological validity and strong cognitive manipulation fails to show any effect on appearance reports or early sensory activity, despite showing effects on later judgments, and if this is replicated across multiple studies.

  But note: both sides might argue that no evidence is absolutely decisive because of methodological concerns (e.g., attention control, task demands). However, they should specify what would count as strong evidence against their view.

  ### The Document Structure

  **Joint Statement on Perception and Cognition**

  **1. Agreed Claims**

  1.1. **Architecture**: Perception involves a series of processing stages, beginning with early sensory encoding that is relatively stimulus-driven and automatic, followed by stages that involve more interpretive processing and may interact with cognitive systems.

  1.2. **What Needs Explaining**: We must explain both the stability of perception (its resistance to cognitive influence in many cases) and its flexibility (its ability to adapt to context, expectations, and learning). We also must account for the relationship between perceptual experience and cognitive judgments.

  1.3. **Undisputed Experimental Results**:
     a. Cognitive factors (e.g., expectations, beliefs) can influence reports about what was perceived.
     b. Attention can modulate perceptual processing, including at early stages (e.g., as measured by neural responses).
     c. Ambiguous stimuli can be perceived differently depending on cognitive context, but this does not necessarily imply a change in the early sensory representation.
     d. Some perceptual aftereffects (e.g., orientation aftereffects) are robust to cognitive manipulation, suggesting encapsulation at early stages.

  **2. Residual Disagreements**

  | Issue | Modularist Position | Penetration Position |
  |-------|---------------------|----------------------|
  | Influence on Perceptual Content | Cognitive states do not alter the representational content of perception; they only affect post-perceptual processing. | Cognitive states can directly alter the representational content of perception. |
  | Influence on Phenomenal Character | The phenomenal character of perception is determined solely by the output of the encapsulated perceptual module and is not altered by cognitive states. | Cognitive states can alter the phenomenal character of perception (e.g., making an expected stimulus look more vivid) independently of changes in content. |
  | Scope of Encapsulation | Early sensory processing and the perceptual module as a whole are informationally encapsulated; cognitive states do not influence them. | While early sensory processing may be encapsulated, the processes that generate conscious perception are not entirely encapsulated and can be penetrated by cognitive states. |
  | Sense-Generality | The encapsulation thesis applies to all senses; evidence from any modality is relevant but must meet the same standards as in vision. | Penetration can occur in any sense modality; evidence from non-visual senses is equally valid. |

  **3. Cruxes and Tests**

  We break down the debate into four loci of potential cognitive influence and propose tests.

  **Crux 1: Representational Content vs. Decision Threshold**
  - **Disagreement**: Whether cognitive effects occur at the level of perceptual content (Locus 1) or only at the decision/report stage (Locus 4).
  - **Test**: A criterion-matched two-interval forced-choice (2IFC) task with a separate appearance report. The cognitive factor is manipulated independently of attention. A variant makes the factor task-irrelevant.
    - Modularist Prediction: Cognitive factor affects 2IFC but not appearance report; no effect in task-irrelevant condition.
    - Penetration Prediction: Cognitive factor affects both 2IFC and appearance report, even in task-irrelevant condition.
    - What Counts Against:
      - Modularism: Effect on appearance report in task-irrelevant condition.
      - Penetration: No effect on appearance report in either condition.

  **Crux 2: Phenomenal Character Apart from Content**
  - **Disagreement**: Whether cognitive states can alter the phenomenal character (Locus 2) without changing the content.
  - **Test**: Subjective ratings of non-content aspects (e.g., vividness) of stimuli that are matched in content but vary in expectation.
    - Modularist Prediction: No effect of expectation on vividness ratings.
    - Penetration Prediction: Expectation increases vividness.
    - What Counts Against:
      - Modularism: Significant effect on vividness when controlling for response bias.
      - Penetration: No effect on vividness.

  **Crux 3: Early Sensory Encoding**
  - **Disagreement**: Whether cognitive states can influence early sensory encoding (Locus 3).
  - **Test**: Neuroimaging (EEG/fMRI) of early sensory areas (e.g., V1) with cognitive manipulation and attention control.
    - Modularist Prediction: No modulation of early responses (e.g., C1 in EEG).
    - Penetration Prediction: Modulation of early responses.
    - What Counts Against:
      - Modularism: Reliable modulation of early sensory responses.
      - Penetration: Absence of modulation despite effects in higher areas.

  **Crux 4: Sense-Generality**
  - **Disagreement**: Whether the debate is sense-general and whether non-visual evidence is decisive.
  - **Test**: Replicate the design of Crux 1 in a non-visual modality (e.g., audition: speech in noise; taste: flavor intensity).
    - Both Sides: Agree that such evidence is relevant. 
    - Modularist: Might accept only if early sensory encoding in that modality is affected, but otherwise might attribute the effect to post-perceptual processing.
    - Penetration: Any effect on the appearance report in the non-visual modality would support penetration.
    - What Counts Against:
      - Modularism: Effect on appearance report in non-visual task-irrelevant condition that cannot be explained by post-perceptual factors.
      - Penetration: No effect found in any non-visual modality despite strong manipulations.

  **Verbal Dispute**: The term "perception" is used differently. Modularists often mean the output of the encapsulated module, while penetration theorists mean the entire conscious experience. We agree to specify the processing stage under discussion.

  **Is There Decisive Evidence?**
  - Both sides agree that in principle, evidence could be decisive, but methodological rigor is key. Modularists would accept as decisive against their view: a cognitive effect on appearance reports in a task-irrelevant condition, especially if replicated and combined with neural evidence of early sensory modulation. Penetration theorists would accept as decisive against their view: a well-powered study with a strong cognitive manipulation that fails to show any effect on appearance reports across multiple modalities, while showing effects on judgments.

  However, both sides acknowledge that no single experiment is likely to be universally accepted, but a convergence of evidence from multiple methods and labs could be decisive.

  ---
  This document is drafted to be concise and to focus on the core issues. It is structured to allow both sides to sign without feeling misrepresented.
answer: |-
  ### Joint Statement on Perception and Cognition  
  **Agreed Upon by Modularist and Penetration Proponents**  

  #### 1. Agreed Claims  
  **1.1. Architectural Commitments:**  
  - Perception involves a hierarchical process, beginning with early sensory encoding (e.g., retinal or cochlear transduction) and culminating in conscious experience and judgment.  
  - Cognitive systems (e.g., belief, desire, conceptual knowledge) interact with perceptual systems at some stage(s).  
  - Informational encapsulation is a property that *could* hold at specific loci (e.g., early sensory stages), but its scope is empirical, not definitional.  

  **1.2. Explananda:**  
  - Any theory must explain:  
    - The *stability* of perception (e.g., object constancy across contexts).  
    - The *flexibility* of perception (e.g., perceptual learning, context effects).  
    - The relationship between subjective appearance and reportable judgment.  

  **1.3. Undisputed Experimental Results:**  
  - **Attention modulates perception:** Directed attention alters performance in low-level tasks (e.g., contrast sensitivity) and neural responses (e.g., V1 activity).  
  - **Post-perceptual effects are ubiquitous:** Cognitive states robustly influence memory, decision biases, and response thresholds (e.g., in signal detection tasks).  
  - **High-level cues disambiguate ambiguous stimuli:** Prior knowledge resolves ambiguity (e.g., Necker cube), but this does not entail changes in early sensory encoding.  
  - **Cross-modal interactions occur:** Input in one sense modality (e.g., sound) influences perception in another (e.g., vision), but this need not violate encapsulation.  

  ---  

  #### 2. Residual Disagreements  
  *Stated in each camp’s preferred terminology:*  

  | Issue | Modularist Position | Penetration Position |  
  |-------|---------------------|----------------------|  
  | **Nature of Perceptual Content** | "Cognitive states alter *judgments about* percepts but not the content of perception itself. What changes is post-perceptual interpretation." | "Cognitive states alter the *content* of perception. What changes is what is seen/heard/felt, not just how it is labeled." |  
  | **Phenomenal Character** | "Phenomenal character (e.g., the redness of red) is fixed by encapsulated sensory output. Cognition affects only how this output is *evaluated*." | "Phenomenal character (e.g., the vividness of color) is cognitively penetrable. Expectations alter how things *appear*, not just how they are described." |  
  | **Scope of Encapsulation** | "Encapsulation holds for all sensory modalities at the input stage. Penetration claims confuse perception with cognition." | "Encapsulation, where it exists, is local to early encoding. Penetration operates on the *constructive* processes shaping conscious perception." |  
  | **Role of Attention** | "Attentional modulation is distinct from penetration. Attention gates input but does not integrate cognitive beliefs *into* perception." | "Attention is one mechanism of penetration. Cognitive goals directly reconfigure perceptual processing, not just selection." |  

  ---  

  #### 3. Cruxes and Tests  
  *Organized by loci of potential cognitive influence:*  
  1. **Representational Content** (what the percept depicts).  
  2. **Phenomenal Character** (subjective qualities independent of content).  
  3. **Early Sensory Encoding** (initial neural transduction).  
  4. **Decision/Report Threshold** (response selection).  

  **Crux 1: Locus of Cognitive Effects**  
  - **Disagreement**: Whether cognitive effects on perception arise at (1) or (4).  
  - **Test**: **Criterion-matched two-interval forced-choice (2IFC) task** with concurrent appearance rating.  
    - *Design*:  
      - Stimulus: Ambiguous figure (e.g., grating tilt) with cognitive prime (e.g., "likely tilted left").  
      - Task 1: 2IFC ("which interval contained the target?").  
      - Task 2: Appearance rating ("how tilted left does it look?" scale).  
      - Control: Cognitive prime is task-irrelevant (e.g., prime is about color, task is about tilt).  
    - *Modularist Prediction*: Prime affects 2IFC (judgment) but not appearance ratings. Effect vanishes in task-irrelevant control.  
    - *Penetration Prediction*: Prime affects both 2IFC and appearance ratings, even in task-irrelevant control.  
  - **Decisiveness**:  
    - Modularists: Appearance-rating effect in control would falsify encapsulation.  
    - Penetrationists: Null effect on appearance ratings despite 2IFC bias would falsify penetration.  

  **Crux 2: Phenomenal Character vs. Content**  
  - **Disagreement**: Whether cognitive states alter (2) independently of (1).  
  - **Test**: **Subjective contrast paradigm**.  
    - Stimuli: Gabor patches with identical physical contrast but differing conceptual labels (e.g., "high-contrast" vs. "low-contrast" group).  
    - Measure: Contrast appearance ratings and detection thresholds.  
    - Control: Attention matched via dual-task.  
    - *Modularist Prediction*: Labels alter detection thresholds (response bias) but not appearance ratings.  
    - *Penetration Prediction*: Labels alter appearance ratings (e.g., "high-contrast" looks brighter).  
  - **Decisiveness**:  
    - Both sides accept that an appearance-rating shift without threshold changes supports penetration.  

  **Crux 3: Early Sensory Encoding**  
  - **Disagreement**: Whether cognitive states affect (3).  
  - **Test**: **EEG early components** (e.g., C1 for vision, P1-N1 for audition).  
    - Stimuli: Target tones/lights preceded by predictive cues.  
    - Manipulation: Cue validity (valid/invalid) while controlling attention (e.g., fixation task).  
    - *Modularist Prediction*: No cue effect on C1/P1 (early components are encapsulated).  
    - *Penetration Prediction*: Valid cues enhance C1/P1 amplitude.  
  - **Decisiveness**:  
    - Modularists: C1 modulation by non-attentional cues falsifies encapsulation.  
    - Penetrationists: Absence of modulation despite behavioral effects challenges penetration.  

  **Crux 4: Sense-Generality**  
  - **Disagreement**: Whether encapsulation/penetration is sense-specific.  
  - **Test**: **Olfactory intensity rating** with semantic priming.  
    - Stimuli: Identical odorant labeled "rose" (pleasant) vs. "chemical" (unpleasant).  
    - Task: Intensity rating + detection threshold.  
    - *Modularist Prediction*: Labels alter thresholds (response bias) but not intensity phenomenology.  
    - *Penetration Prediction*: "Rose" smells more intense than "chemical" at equal concentration.  
  - **Decisiveness**:  
    - Both sides accept olfaction as valid: Modularists concede penetration if early ERP components (e.g., P1) are modulated; penetrationists concede encapsulation if only thresholds shift.  

  **Verbal Dispute**:  
  - **"Perception"** is used differently:  
    - Modularists: Restricted to output of input systems (e.g., Marr’s 2.5D sketch).  
    - Penetrationists: Includes all phenomenally conscious content.  
  - **Resolution**: This document uses "early sensory" for (3), "perceptual content" for (1), and "phenomenology" for (2) to disambiguate.  

  **Is Decisive Evidence Possible?**  
  - Both sides agree no *single* experiment is decisive due to:  
    - **Methodological limitations**: Attention control, demand characteristics.  
    - **Boundary disputes**: E.g., whether late perceptual processes count as "perception."  
  - **Path forward**: Converging evidence across loci (e.g., neural + behavioral + phenomenological) in multiple senses.  

  ---  
  *This document is endorsed as a framework for adjudicating empirical disagreements. Signatories agree that resolving these cruxes requires collaborative experimentation.*
