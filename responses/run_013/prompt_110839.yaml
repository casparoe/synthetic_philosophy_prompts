prompt: |-
  I'm a novelist and I've been ambushed. A friend of mine is doing a PhD in philosophy and he walked me through the following on a long drive, and I wrote it down on the back of a receipt. Now I can't get it out of my head, and I need someone to tell me which line to cut and what I'm paying when I cut it.

  (1) Some things are made of other things. My desk is made of a top and legs, a book is made of pages, a person is made of cells. Take this as given; I need it.

  (2) If some things compose something, then for any given bunch of things there's a fact of the matter: either they make up a whole or they don't. No "sort of."

  (3) It can't be vague whether a bunch of things composes something. If it were vague, it would be vague whether the whole existed — and things don't "sort of" exist. Either there's an object there or there isn't. He hit this one hard and I definately couldn't find the gap.

  (4) So there's a sharp, no-exceptions rule for when composition happens.

  (5) Any rule of the form "they compose when they're fused / glued / stuck together / grown from one seed / working together as a unit" has borderline cases. Cloud, pile of sand, puddle, tumour, coral, slime mold, a person in a coma, a corporation. Whatever line you draw, I can describe a case one hair to the wrong side of it, and the line will look like a coin toss.

  (6) A rule can't be both sharp and a coin toss. So the only sharp rules that aren't arbitrary are "always" and "never."

  (7) "Never" is a non-starter — no desks, no books, no me. Just particles and nothing built out of them.

  (8) So it's "always": any things you like compose something.

  (9) Which gives me an object made of my left shoe and the moon. An object made of the mug on my desk, the Suez Canal, and one particular hydrogen atom in your body. Objects blinking in and out of existence every time a dust mote drifts past another. I can't write a novel set in that world, or at least I can't take it seriously.

  I won't give up (1) and I absolutely won't give up (7), so the bad step is in there somewhere and I can't see it. A seperate friend says the real exit is to say the question is malformed, that "when do things compose" is a pseudo-question like "when does a heap become a heap" — but I can't tell if that's a real position or a shrug wearing a hat.

  One more thing that might matter. I write fiction, so I already believe in things that aren't made of anything at all — my characters. If I'm relaxed about those, maybe the moon-and-shoe object isn't the horror I think it is, and my gut reaction to (9) is doing work it shouldn't.

  When you answer: tell me which step to reject and what rejecting it costs me, and be straight about which parts of this are actually settled and which are still genuinely contested by the people who work on it. Don't sell me a contested view as the consensus — I'd rather know there are three camps shouting past each other than get a tidy answer that isn't one.
reasoning: |-
  Okay, the user is a novelist who got ambushed by a philosopher friend with this composition puzzle. They're stuck between denying reality (no composite objects) or accepting absurd objects like "moon-and-shoe." They need to know which step to reject and what it costs, with full transparency about philosophical disputes.

  Hmm, first let's map their dilemma: Their core tension is between (1) composition happens (desks exist!) and (7) nihilism is unacceptable. The friend's argument forces them to universalism (absurd objects) unless they find a flaw. But their fiction-writing background makes them wonder if they're overreacting to (9).

  Ah, their hidden question: "Is my discomfort with moon-and-shoe objects just artistic bias?" Clever. Also they want truth about scholarly consensus—no fake closures.

  Breaking down the argument... Step (3) is the linchpin: "No vague existence." But van Inwagen's non-vague nihilism avoids vagueness by denying composition altogether! Yet they reject nihilism. 

  The real fracture point is step (5). The friend claims all composition rules must have borderline cases. But what about causal integration? A living organism vs. corpse might be sharp. Or functional unity—a working heart is clearer than "things glued." Still, tumors and comas complicate it. 

  Scholarly landscape: Universalists embrace (9) and say moon-and-shoes exist but are negligible. Nihilists bite the bullet on (7). But most metaphysicians are moderate—they accept some vagueness despite (3), or propose privileged relations (like life). 

  Cost analysis: If they reject (3), existence can be vague. Then a coma patient might "sort of exist" as a person. That's rough for novels about identity. If they reject (5), they need a non-arbitrary sharp rule—good luck defending that. 

  Best path: Target (5). Admit some borderline cases but argue life/organic unity avoids arbitrariness. Cost? Must accept that "person" might not apply cleanly to embryos or brain-dead patients. But preserves desks and avoids moon-shoes. 

  Should mention: Their fiction analogy is revealing. If fictional characters (non-concrete) are acceptable, why not abstract moon-shoe objects? But they'd counter that fictional characters have narrative cohesion—which circles back to needing a composition principle.
answer: |-
  You've hit the motherlode of metaphysical debates: the Special Composition Question. Your philosopher friend walked you through Peter van Inwagen's *Material Beings* argument, which forces a brutal trilemma. **Reject Step (3)**. Here's why, what it costs, and the messy scholarly landscape:

  ### The Flaw: Step (3) is the Weak Link
  *   **The Claim:** "It can't be vague whether composition occurs. Existence isn't vague."
  *   **The Rejection:** Existence *can* be vague for composite objects. The world doesn't demand razor-sharp boundaries for everything that exists. "Sort of existing" isn't incoherent; it reflects epistemic or ontological indeterminacy in how we *carve up* reality, not necessarily a flaw in reality itself.
  *   **The Gap Your Friend Missed:** He assumes "existence" is a binary, all-or-nothing property *for composite objects*. But why must *composites* inherit the absolute precision of fundamental particles? Maybe "desk" denotes a vague region of spacetime with slightly indeterminate boundaries, yet the fundamental particles exist precisely.

  ### What Rejecting (3) Costs You
  1.  **Loss of Metaphysical Sharpness:** You must accept that *for composite objects*, there are borderline cases where it's genuinely indeterminate whether "a thing" exists. Is a cloud a *single object* or just scattered droplets? Is a severed limb still "part of" a person during surgery? There might be no cosmic fact of the matter.
  2.  **Epistemic Humility:** You can't always point to a definitive rule separating "whole" from "mere collection." Your "desk" relies on human interests (function, cohesion) that nature doesn't perfectly mirror.
  3.  **Potential for Slippery Slopes:** If composition is vague, does this infect *all* composites? Where does it stop? (Defenders argue vagueness is localized to specific, complex arrangements).

  ### Why This is Preferable (Based on Your Constraints)
  *   **Preserves (1):** Desks, books, and people still exist. They are made of parts.
  *   **Avoids (7) Nihilism:** You don't have to deny composite objects.
  *   **Avoids (9) Universalism:** You escape the horror of moon-shoe objects and dust-mote compositions. Only *some* collections compose objects, even if the line is fuzzy.
  *   **Resonates with Fiction:** Your comfort with characters (abstract/non-concrete objects) shows you're okay with non-fundamental entities. Rejecting (3) lets composites be "real enough" without demanding absurd precision.

  ### The Scholarly Landscape (No Tidy Consensus!)
  *   **The Big Three (Still Shouting):**
      *   **Nihilism (Accepts 7):** Only fundamental particles exist. "Desk" is just a useful label for particles arranged desk-wise. **Champions:** Trenton Merricks, Cian Dorr. **Cost:** Denies obvious reality of tables, organisms. Radically counterintuitive.
      *   **Universalism (Accepts 9):** *Every* collection composes an object. Moon-shoe objects exist but are negligible/ignorable. **Champions:** David Lewis, Josh Parsons. **Cost:** Explodes ontology with gerrymandered junk; violates strong intuitions about unity.
      *   **Moderate/Conservative Views (Reject 3 or 5):** Composition only occurs under specific (often vague) conditions like cohesion, function, or life. **Champions:** van Inwagen (life only!), Lynne Baker, Mark Johnston, Eli Hirsch. **Cost:** Must defend a non-arbitrary (or accept vaguely arbitrary) principle; faces borderline cases.
  *   **The "Pseudo-Question" Exit (Your Separate Friend):** This is **Ontological Deflationism** or Conceptual Relativity. **Champions:** Hilary Putnam, Amie Thomasson. **View:** "When do things compose?" isn't about discovering a deep metaphysical fact. It's about how *we* choose to use concepts like "object" based on our interests and language. "Existence" of composites is trivial once we have the concept. **Cost:** Feels like a "shrug in a hat" to realists; doesn't resolve *why* some conceptual schemes seem more natural. **Status:** Respected minority view, gaining traction.
  *   **Step (5) is Contested:** Some argue certain rules *can* be sharp and non-arbitrary (e.g., van Inwagen's "they compose something iff their activity constitutes a life"). Others argue causal integration or spacetime continuity provide non-vague bases. **Status:** Heavily debated. Most concede *some* vagueness exists, but dispute its scope and significance.

  ### Your Novelist's Gut & (9)
  Your instinct against (9) is widely shared. Fiction thrives on salient unities (characters, plot points). Moon-shoe objects lack the causal cohesion, functional unity, or narrative significance that makes a "thing" relevant. Rejecting (3) lets you keep composites that *matter* (desks, people, characters) without being forced to acknowledge every arbitrary sum. Your characters aren't a problem – they highlight that "existence" comes in flavors (concrete vs. abstract, fundamental vs. composite), and composition issues primarily concern concrete composites.

  **The Verdict:** **Cut Step (3).** Pay the price of accepting vague existence for composites and borderline cases. You keep your desk, your characters, and your sanity, while avoiding nihilism and universalism's excesses. The cost is metaphysical messiness, but that messiness reflects the world (or our grasp of it) better than the false precision of (3). The debate is wide open, but rejecting (3) is the most popular escape route from the trilemma among working metaphysicians who want composites but not junk.
