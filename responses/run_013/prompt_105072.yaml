  **What has no counterpart?**
  - **Vagueness and interpretation**: Legal rules often have vague terms (e.g., "the workshop is on fire" in Rule 105). In software, we would have to define precisely what that means (e.g., a sensor reading? a declaration by the gavel-holder?). The need for human judgment (like the gavel-holder in Rule 104) doesn't translate cleanly to automated systems.
