  This means Rule 102 is ineffective. So is entrenchment impossible? Not exactly: we could have written Rule 102 with a lower number than Rule 101. Then Rule 102 would win. But we didn't. So the problem is the numbering.

  But note: Rule 102 is about amending Rule 101. If we make Rule 102 have a lower number, then Rule 102 would win, but then how do we amend Rule 102? We might need a Rule 100 that says Rule 102 can only be amended by ... but then we get an infinite regress.

  In software, we can model the rules as a chain: the rule with the lowest number that applies sets the standard? But that doesn't capture the idea that multiple rules might set conditions that are additive (like requiring both A and B). But in this case, the conditions are on the same thing (the required vote for an amendment).

