  Recommendation: Remove Rule 103 and instead use a principle that the most specific rule wins, or that all rules must be satisfied. Then Rule 102 would add an additional condition (unanimity) for amending Rule 101, and both the general condition (2/3) and the specific condition (unanimity) must be met. Similarly, Rule 106 would add a condition (gavel-holder must propose) for Rule 104, and both must be satisfied.

