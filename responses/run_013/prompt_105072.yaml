  3. If the rules are not in agreement (e.g., one says pass and one says fail), then check Rule 103: which says the lower-numbered rule wins.

  But then for an amendment to Rule 101, we have:

  - Rule 101: requires 2/3 -> if the vote is 80%, it says pass.
  - Rule 102: requires unanimity -> if the vote is 80%, it says fail.

  Conflict: they disagree. Rule 103 says Rule 101 (lower) wins -> so we take pass.

  But what if we have an amendment to Rule 102? Then Rule 101 applies (any rule can be amended by 2/3) and Rule 102 does not apply (because the amendment is not to Rule 101). So only Rule 101 applies -> 2/3.

  So Rule 102 can be amended by 2/3? That might be acceptable.

  Now, the entrenchment issue: Rule 102 was intended to protect Rule 101 by making it harder to change. But because of Rule 103 and the numbering, it fails. So we have a bug in the rule set.

  How to fix? We could change the numbers. Make Rule 102 have a lower number than Rule 101? But then:

