  5. **Interpreter regress**:
     - Rule 104 says the gavel-holder is the final interpreter. This is like having a human in the loop. 
     - In software: We can model the gavel-holder as the one who runs the CI or has merge rights. But Rule 104 says they are the interpreter, meaning they decide what the rules mean in case of ambiguity. 
     - This is like having a function that takes the rule set and the amendment and returns an interpretation. But then who interprets the interpreter? Rule 106 says that Rule 104 can only be amended by the gavel-holder. So the gavel-holder has the power to change the rule about interpretation. 
     - This is similar to having a superuser who can change the rules about who is superuser. In software, we might have a root user.

  6. **Can a rule bind its own amendment?**
     - For example, Rule 101 can be amended by a 2/3 vote. But if we change it to require unanimity, then we are binding future amendments to a stricter condition. But the amendment itself was done under the old condition. 
     - In software: This is like a function that, when run, changes its own code to require a higher threshold for the next change. That is allowed because the change is done under the current code.

  Now, the residue report:

  **What translates cleanly?**
  - The mutable codebase model with commits and CI is a very good fit for the amendment process. Each amendment is a commit. The vote is the CI test: it runs the current rules against the proposed change. The chair is the one with merge rights. The minutes are the commit log.
  - Self-amendment is like modifying the code that defines the amendment process, and it is handled naturally by versioning: the current rules (at HEAD) are used to validate the next amendment.
  - Circular validity (bootstrapping) is handled by an initial commit that sets the starting rules.

  **What had to be fudged?**
  - **Conflict resolution**: Rule 103 (lower-numbered wins) is a global conflict resolution strategy. In software, we might handle conflicts by explicit priority or by the order of execution. But in this case, the conflict is about the same aspect (e.g., required vote) and we have a rule that breaks the tie. Without Rule 103, we would have to define how multiple constraints are combined (e.g., take the strictest). But Rule 103 introduces a numbering-based priority which might not be intuitive and leads to the entrenchment problem.
