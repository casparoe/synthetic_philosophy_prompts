  - Rule 102: only applies to Rule 101, so not applicable.

  So Rule 102 can be amended by 2/3. But what if we want to entrench Rule 102? We might need another rule for that.

  Alternatively, we could change Rule 103 to say that a rule that specifically mentions another rule takes precedence? But that's not in the current rules.

  Now, the circular validity: the rules are in force because Rule 101 says so. How does that work?

  In software, we have a bootstrapping problem. The initial rule set must be accepted by some other means (e.g., all members agreed to it initially). Then, Rule 101 provides the authority for future amendments. But Rule 101 itself can be amended, so the authority for the rules is the rule set itself. This is circular but self-consistent as long as we start with a valid initial state.

  Now, let's address the user's request: restate the standard self-amendment paradoxes in software vocabulary.

  1. **Entrenchment**: 
     - In software: We want a function (rule) to be protected so that it can only be changed under stricter conditions. But if the protection rule (e.g., Rule 102) has a higher number than the rule it protects (Rule 101) and we have a conflict resolution rule (Rule 103) that gives priority to lower numbers, then the protection rule can be overridden. 
