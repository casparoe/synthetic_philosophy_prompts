  2. **Self-reference**:
     - A rule that refers to itself. For example, Rule 101 allows amending any rule, including itself. So we can use Rule 101 to amend Rule 101. But if we change Rule 101 to require unanimity, then we have a paradox: to change Rule 101 from 2/3 to unanimity, we need 2/3 (by current Rule 101) but after the change, we would have required unanimity. But that's not a paradox because the change was done under the old rule. 
     - In software: We are modifying a function while it is running? But in a versioned system, we are changing the function for the next run. So when we run the CI for the amendment, we use the current rules (at HEAD) to validate the amendment. After the amendment is merged, the new rule is in effect for the next amendment.

  3. **Validity**: 
