  But Rule 102 is intended to entrench Rule 101. Is entrenchment impossible?

  Software translation:

  - Each rule is a function that returns a boolean (valid or not) or a value (like the required majority). But more accurately, we can think of the rule set as a set of constraints that must be satisfied for an amendment to be valid.

  - An amendment (commit) is a proposed change to the rules. It must pass the CI (vote) which enforces the current rules.

  - The chair (merge rights) can merge the commit if the CI passes.

