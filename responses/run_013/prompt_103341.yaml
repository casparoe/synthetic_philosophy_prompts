answer: |-
  Below is a decision tree designed to sort readers into positions on what makes an act corrupt, based on concrete cases and logical commitments. The tree avoids self-labeling and forces distinctions through real-world scenarios. It uses **11 internal nodes** (questions anchored in cases) and **8 leaves** (named positions with their most awkward commitment). The tree starts with the most fundamental divide—whether corruption depends on written rules—and branches through the key distinctions you specified, including the source of standards, the location of wrongness, and the role of motives, systemic factors, and cultural imposition.

  ### Key Design Notes:
  - **Cases used**: All your specified cases are integrated, plus two additions for clarity:  
    - *A police officer paid to ignore a minor violation* (to test motive vs. harm).  
    - *A company that lobbies for a law change to benefit itself* (to separate harm from role betrayal).  
  - **Logical space**: The tree identifies 5 coherent combinations of answers that lead to named positions. Two combinations are unoccupied (explained below).  
  - **Unseparated positions**:  
    - *Legalist vs. Conventionalist*: Not separable if laws perfectly track societal norms (e.g., in a homogeneous society). The tree forces separation by using cases where rules and norms diverge (e.g., customs officer case).  
    - *Principal-Agent vs. Collective-Action*: Not separable when the principal (e.g., the public) is complicit in corruption. The tree addresses this by asking about individual blame in Node 9.  
  - **Unoccupied combinations**:  
    - *"Harm is the only wrongness + Motive/form irrelevant"* leads to no named position. Functionalists care about harm but also weigh efficiency and context; universalists care about harm but often include role-based wrongs. This combination is incoherent because harm analysis usually requires contextual factors like motive.  
    - *"Wrongness is conventional + Systemic explanation"* is unexplored. If corruption is merely conventional (no inherent wrong), systemic analysis becomes redundant, making this combination unattractive.  
  - **Output**: Indented tree format, with questions on branches and positions at leaves. Each leaf includes a one-sentence awkward commitment.

  ---

  ### Decision Tree

  1. **Case: A customs officer is paid a customary fee to process a shipment that would otherwise sit for weeks. This violates the agency's written rules but aligns with local norms.**  
     Is this corrupt?  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Case: A manager hires a qualified cousin over a marginally better-qualified stranger in a society with strong family obligations and no anti-nepotism rules.**  
     Is this corrupt?  
     - **Yes** → Go to 4  
     - **No** → **Legalist/Formalist**  
       *Awkward commitment: In a society with no bribery laws, bribes are not corrupt because they violate no written rules.*  

  3. **Case: A firm pays a local official's nephew's tuition to be shortlisted for a contract, which is common and expected in that society.**  
     Is this corrupt?  
     - **Yes** → Go to 7  
     - **No** → Go to 8  

  4. **Case: A patient's family gives a surgeon a gift after a successful operation in a society where this is common; the surgeon did not expect it and it didn't influence care.**  
     Is this corrupt?  
     - **Yes** → Go to 5  
     - **No** → **Principal-Agent**  
       *Awkward commitment: Even if an act is legal and culturally expected, it is corrupt if it violates a role-based duty (e.g., the surgeon's duty to avoid future bias).*  

  5. **Case: A police officer is paid to ignore a minor traffic violation. The payer is a struggling driver who avoids a fine; the officer uses the cash for family needs.**  
     Does the officer's motive (helping family) or the form (cash vs. gift) change whether it's corrupt?  
     - **Yes** → Go to 6  
     - **No** → **Universalist**  
       *Awkward commitment: A society can be morally wrong about its own norms—e.g., nepotism is always corrupt even if universally accepted.*  

  6. **Case: A company obeys local anti-bribery laws in a foreign country but violates its home country's stricter laws.**  
     Is the act corrupt in the host country?  
     - **Yes** → **Two-Level View**  
       *Awkward commitment: An act can be definitionally corrupt (breaking a role-based norm) but the actor blameless due to systemic pressures.*  
     - **No** → **Functionalist**  
       *Awkward commitment: Calling a harmful bribe "corrupt" is ethnocentric if it is locally efficient (e.g., speeding up customs).*  

  7. **Case: A ceremonial gift to a tribal leader functions as an entry fee to a market; it is traditional and not viewed as a bribe locally.**  
     Is this corrupt?  
     - **Yes** → **Universalist** (same as above)  
     - **No** → Go to 9  

  8. **Case: A legislator directs public funds to their own district for popular projects, securing re-election in a system where this is standard practice.**  
     Is this corrupt?  
     - **Yes** → Go to 10  
     - **No** → **Conventionalist**  
       *Awkward commitment: If a society's norms allow bribery, it is not corrupt—e.g., bribes for basic services are acceptable if normalized.*  

  9. **In a society where bribery is widespread for basic services (e.g., to get a school permit), is an individual who pays a bribe primarily at fault?**  
     - **Yes** → **Virtue/Character View**  
       *Awkward commitment: A harmless, rule-compliant act (e.g., a small gift) can be corrupt if it reveals a "corrupt character."*  
     - **No** → **Collective-Action/Systemic View**  
       *Awkward commitment: Blaming individuals for corruption is misguided—e.g., a customs officer taking bribes is not corrupt if the system rewards it.*  

  10. **Case: A company lobbies for a law change that benefits its industry but harms competitors, under legal lobbying rules.**  
      Is the wrongness in the harm or in violating a role?  
      - **Harm** → **Functionalist** (same as above)  
      - **Violating a role** → **Principal-Agent** (same as above)  

  ---

  ### How the Tree Covers Your Requirements:
  - **Source of standards**: Handled in Nodes 1 (rules vs. norms), 3 (norms as final word), and 7 (societal wrongness).  
  - **Wrongness location**: Role betrayal (Nodes 4, 10), harm (Nodes 6, 10), conventional (Node 8).  
  - **Motive/form impact**: Explicit in Node 5.  
  - **Systemic vs. individual**: Central to Node 9.  
  - **Political imposition**: Embedded in Functionalist and Conventionalist leaves (rejecting external judgments).  
  - **Positions covered**: All eight named positions appear, with Principal-Agent and Collective-Action separated by Node 9 (individual blame).  

  This tree sorts readers by their intuitions about cases, revealing their position through commitments rather than labels. Use it as a talk/blog tool to map audience beliefs and spark debate.
