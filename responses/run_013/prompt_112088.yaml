answer: |-
  Here is an address that meets your requirements, weaving the "seem/is" asymmetry throughout, addressing each audience directly within the framework, and delivering the necessary candor:

  **Opening Address: The Centre for the Study of Consciousness**

  Good evening. We stand today at the threshold of a unique endeavour: this Centre for the Study of Consciousness. Its purpose is ambitious: to understand how creatures like us come to have the distinctive inner lives we report. How do thoughts, sensations, colours, sounds, pains, and joys arise within us? And crucially, why does this inner world feel so profoundly real, so utterly private, and often, so deeply mysterious?

  To our generous funders and guests: you have invested in a genuine enigma. Consciousness *feels* elemental, the bedrock of existence. We wake into it, bathe in it, and it vanishes only in sleep or death. It seems the most obvious thing in the world, and yet, pinning it down scientifically has proven extraordinarily difficult. You will hear tonight that we do *not* come armed with the solution to the so-called "hard problem" – the question of how subjective experience arises from objective biology. We come instead with a rigorous method to investigate the *manifestations* of consciousness, the reports and behaviors that convince us we *have* this inner world. Our promise is not a magic key revealed tonight, but a sustained, disciplined effort to map the territory from which that sense of mystery inevitably springs. We aim to understand *why* consciousness feels like the hardest problem, not necessarily to dissolve that feeling prematurely.

  To our colleagues from the phenomenological tradition: your presence honours us and challenges us. You train in the meticulous exploration of lived experience from within. You suspect, rightly, that many scientific approaches risk explaining away the very phenomenon they claim to study, reducing the richness of subjective life to mere neural correlates or external behaviors. We hear your skepticism. The methodology we adopt here, heterophenomenology, is designed precisely to bridge this gap. It treats the *report* of conscious experience – everything a subject says about how things seem to them – with utmost seriousness. We record it meticulously, we strive to build a faithful model of *their* subjective world, just as a careful reader interprets the world of a novel. We do not dismiss their testimony as irrelevant noise. We take it as the core data.

  But here lies the crucial asymmetry, the cornerstone of our method: **The subject has complete and unchallengeable authority over *how things seem to them*. They are the sole expert on their own experience as reported. However, they have no special authority over *how things actually are* in the mechanisms that produce those reports and that sense of seeming.** Our laboratory's task is to explain *why* things seem the way they do to the subject, using all the tools of neuroscience, psychology, computation, and more. We are not here to certify their reports as infallible descriptions of reality, any more than we would certify a novel's description of dragons. Nor are we here to correct them, telling them what they *should* be experiencing. We are here to explain *the fact of the report itself* and the conviction that accompanies it. We start with the seeming; we seek the underlying *is*.

  This neutrality towards the subject's report is fundamental. We bracket the question of whether the properties the subject describes – the intrinsic redness of red, the raw feel of pain – actually exist *as described*, independent of their reporting mechanism. Our method requires only that we take the *reporting* seriously, not that we endorse the ontology implied within the report. However – and this is vital – **the neutrality of the method does not guarantee the neutrality of its results.** The explanations we eventually find *might* reveal that the properties we seem to encounter directly in consciousness are not fundamental aspects of reality, but rather intricate constructions of our cognitive systems. If the method successfully explains every report without needing to invoke those intrinsic properties, that *is* a result. It is the result of the investigation, not a presupposition smuggled in. We start neutral; we follow the evidence where it leads. Tonight, we commit only to the starting point of neutrality in collecting and modelling the reports.

  Our core research question, therefore, reframes the mystery: **Why are beings like us so powerfully, unshakably convinced that consciousness presents us with irreducible, intrinsic qualities – that there is "something it is like" – when the science of our own mechanisms might ultimately explain that conviction itself?** We are not conceding that consciousness *is* a mystery in the way it seems; we are making the persistent *sense* of mystery the very object of our study. We study the conviction, not merely assume its object.

  Consider a simple, everyday phenomenon: the apparent smooth continuity of our visual world. If I move my eyes rapidly across this room, I *report* seeing a continuous, stable scene. It *seems* seamless. Yet, we know our eyes make rapid, jerky movements (saccades), and vision is suppressed during these movements. The brain fills in the gaps, stitching together snapshots to create the *seemingly* uninterrupted flow I describe. **My report describes a smooth visual field; the mechanism involves discrete snapshots and active construction.** Explaining this gap – why the mechanism feels like a seamless flow – is precisely the kind of result we seek: it explains the *seeming* by revealing the underlying *is*.

  To the journalists and our own students who will carry these ideas forward: report accurately. Scrutinize our claims. Hold us to the highest standards of evidence and logic. We offer you a challenging path, demanding intellectual honesty about both the data of experience and the mechanisms that produce it.

  To everyone here tonight: We make you this commitment. **Within five years, we will publish a concrete, falsifiable explanation for a specific, robust aspect of why conscious experience *feels* the way it does – an explanation that rigorously navigates the gap between the subject's authority over the seeming and the laboratory's investigation into the underlying reality.** This is a commitment we can fail at. It demands progress. It demands results that speak to the funder’s expectation of genuine insight, to the phenomenologist’s demand for engagement with the subjective, and to the scientific community's requirement for testable theory. It binds us to the hard work of turning the asymmetry between seeming and being from a philosophical principle into an engine of discovery.

  We embark not to dismiss the profound feel of consciousness, but to understand its genesis. We begin with the reports, we respect the seeming, and we seek the explanation. Thank you.
