prompt: |-
  I sit on the ethics & public policy committee of a mid-sized professional association (~40,000 members, mostly clinicians), and at next month's meeting we have to vote on a 'personal climate responsibility' resolution that our sustainability working group drafted. As written it (1) urges members to cut their own air travel and red meat, (2) asks them to log whatever they cut in a voluntary app, and (3) commits the association to match every logged kilo of CO2 with an offset purchase out of our own budget, up to a cap. It was written mostly by junior members.

  Two things make this hard. A past president I respect has circulated a one-page dissent saying the whole thing is incoherent: no single member's flight or steak makes any measurable difference to anything, so the resolution either demands something that can't be justified or it's moral theatre, and either way we spend our credibility on the easy thing while our pension still holds a serious chunk of fossil fuel equities — which he says is the only item actually on the table that moves emissions, and the one we're not touching. The working group's reply is that his argument would dissolve every collective obligation anyone has ever had, and that a body like ours has to say something.

  I don't need a survey of the free-rider / collective action literature; I've read the usual drop-in-the-bucket material, and so has everyone else on the commitee. What I need is the written opinion I'll circulate before the vote: a concrete recommendation (adopt as written, adopt with specified amendments, reject, or defer to a named date on a named condition), the reasoning for it, and a fair statement of the strongest case against my own recommendation — including the pension point, which I suspect is the real crux and which I don't want waved away. Be straight with me about which parts of this are genuinely settled among people who work on it and which are live disputes, and don't hand me a contested line as if it were the consensus.

  Then a short JSON block I can paste into the minutes, with fields: recommendation (string), one_line_reason (string), amendments (array of strings, empty if none), strongest_objection (string), settled_vs_contested (object with two arrays of strings: settled, contested), what_would_change_the_recommendation (array of strings), and confidence (number between 0 and 1).
reasoning: |-
  Hmm, the user is on an ethics committee for a professional association and needs help drafting a recommendation for a climate resolution. They've presented a complex situation with competing viewpoints.

  First, let's unpack the key elements: The resolution has three parts - personal behavior changes, voluntary logging, and association-funded offsets. The main opposition comes from a respected past president who argues it's either incoherent or moral theater, while pointing out the pension fund's fossil fuel investments as the real leverage point. The working group counters with the importance of collective action.

  The user explicitly doesn't want philosophical debates about collective action problems - they've already read that literature. They need a concrete, actionable recommendation with balanced reasoning. The pension fund issue seems particularly sticky.

  I'm considering how to structure this. The recommendation should probably reject the current resolution because it has several flaws: it focuses on individual actions that won't make measurable impact, creates potential privacy issues with logging, and misses the bigger opportunity with the pension fund. The "moral theater" critique seems valid here - it looks good but changes little.

  For amendments, I should suggest alternatives that would make the resolution worthwhile: dropping the personal exhortations and logging, focusing instead on the pension fund divestment and using the offset budget for more strategic purposes. That addresses the past president's main concern while keeping the working group's desire for action.

  The JSON output needs careful construction. Confidence should be high (0.8) since the pension fund leverage point is objectively more significant. The "what would change" section should include substantive concessions like removing the personal responsibility language.

  I need to be transparent about what's settled (individual actions being drops in the bucket) versus contested (whether symbolic actions have value). The strongest objection will be that rejecting this might mean doing nothing - which I can counter by showing how the amendments create more meaningful action.

  The tone should be professional but direct - they're ethics committee members who want substance over platitudes. I'll make sure to give the pension issue its due weight rather than dismissing it.
answer: |-
  Here is a comprehensive recommendation for the committee vote, grounded in the specifics of your resolution and the dissent, followed by the requested JSON block:

  **Recommendation:** **Reject the resolution as written. Move to amend the core mandate of the Sustainability Working Group to develop a revised proposal addressing systemic levers (specifically pension fund investment review) alongside exploring strategic, evidence-based offset partnerships, to be presented at the next scheduled committee meeting (e.g., Month/Year).**

  **Reasoning:**

  1.  **The "Personal Responsibility" Focus is Misplaced and Ineffective:** The past president is correct that individual member actions (flight/meat reduction) are drops in the ocean regarding measurable climate impact. Urging them is unlikely to achieve significant aggregate change and risks being perceived as preachy, intrusive, or performative ("moral theatre"), potentially damaging member engagement and association credibility. Logging personal consumption via an app raises significant privacy concerns and administrative burden with negligible benefit.
  2.  **The Offset Mechanism is Inefficient:** Using association funds to match voluntary, unverified, and inherently limited individual reductions is a poor use of resources. The impact per dollar spent is questionable. The cap is prudent but underscores the limited scale achievable.
  3.  **The Pension Fund Point is the Material Lever:** The past president identifies the association's most concrete, high-impact potential lever: its financial investments. Divestment from fossil fuels (or active shareholder engagement) is a demonstrably impactful strategy for institutional investors to influence corporate behavior and capital allocation. *This* is where the association's agency and potential impact lie, and the resolution glaringly ignores it while focusing on low-impact individual actions.
  4.  **Credibility and Coherence:** Adopting the resolution as written risks appearing hypocritical or out-of-touch. It spends political capital and member goodwill on actions with minimal impact while avoiding the harder, more substantive conversation about the association's own capital. This damages credibility on climate issues. The working group's "must say something" argument is weak; saying something *ineffective* or *contradictory* is worse than strategic silence pending a more robust proposal.
  5.  **A Better Path Exists:** Rejecting this resolution isn't inaction. It directs the Working Group to refocus on systemic action:
      *   **Mandate Amendment:** Explicitly task them with investigating and proposing concrete actions regarding the association's pension fund investments (e.g., divestment criteria, ESG integration, shareholder engagement strategies).
      *   **Strategic Offsets:** Explore if association funds could be better used to purchase high-quality, verified offsets (e.g., permanent removals, community-based projects) as part of a broader *organizational* sustainability strategy, *independent* of individual member logging. This could be a component of the revised proposal.
      *   **Evidence-Based Advocacy:** Develop resources for members based on evidence of impact (e.g., advocating for systemic changes in healthcare delivery/energy, not just personal consumption).

  **Strongest Case Against this Recommendation:**

  *   **Paralysis by Analysis / Lost Momentum:** Rejecting this resolution, even with a directive for revision, signals inaction to members who demand the association take a stand *now* on climate. The working group invested effort, and this proposal, while imperfect, represents tangible progress. Focusing solely on the pension fund (a complex, slow-moving issue) risks delaying *any* visible action indefinitely. Symbolic actions and fostering a culture of responsibility *do* have value, even if their direct carbon impact is small. They raise awareness, normalize concern, and can catalyze further action. Ignoring the "say something" imperative could demoralize engaged members and make the association appear indifferent on a critical ethical issue.

  **Settled vs. Contested:**

  *   **Settled:**
      *   Individual actions (like one less flight or steak) have negligible *measurable* impact on global climate metrics.
      *   Collective action problems are real (free-riding, drop-in-the-bucket).
      *   Institutional investors (like pension funds) divesting from fossil fuels *can* materially impact capital flows and corporate behavior (though the *precise* impact on emissions reduction is complex).
      *   High-quality, verified offsets are preferable to low-quality ones (though verification standards are contested).
  *   **Contested:**
      *   **The efficacy and ethics of divestment vs. engagement:** Is pulling capital more impactful than using shareholder power to push for change from within? (Strong arguments on both sides).
      *   **The value of symbolic/signaling actions:** Do resolutions like this, even if low-impact, serve a vital function in norm-setting, member education, and maintaining organizational credibility on an issue? Or are they counterproductive "greenwashing"?
      *   **The role of personal responsibility vs. systemic change:** While systemic change is essential, is there *no* legitimate role for professional associations in encouraging sustainable practices among members? What form should that take?
      *   **Optimal use of offset funds:** What types of offsets deliver the most genuine, additional, permanent impact per dollar? (Significant debate on methodologies and project types).

  **What Would Change This Recommendation (to Adopt or Amend):**

  1.  **Striking Sections 1 & 2:** If the resolution *only* committed the association to strategically purchase a set amount of high-quality offsets from its own budget (without member logging or urging personal cuts), it becomes a concrete, manageable organizational action. This could be a defensible standalone step.
  2.  **Incorporating the Pension Lever:** If the resolution included a *binding commitment* to immediately initiate a formal, time-bound review of the pension fund's fossil fuel holdings with clear options for action (divestment, engagement targets) presented to the board within 6 months, *alongside* a significantly revised (or removed) personal responsibility/offset-matching scheme, it addresses the core critique and leverages real power.
  3.  **Strong Evidence of Demand & Efficacy:** If presented with compelling data showing a large majority of members actively demand *this specific form* of personal-focus resolution AND evidence that similar schemes in comparable associations led to measurable aggregate reductions or significant shifts in member behavior/culture, the "symbolic/norm-setting" argument gains substantial weight.

  **Confidence:** 0.85 (High confidence in rejecting the current form due to its flaws and the strength of the pension argument. Confidence is slightly tempered by the legitimate concern about appearing inactive and the contested value of symbolism.)

