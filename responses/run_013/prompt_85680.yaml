  Okay, the user is an academic preparing for a theory seminar talk defending superrationality against standard game theory critiques. They need a tactical Q&A prep sheet targeting specific audience archetypes. 

  First, let's unpack the core tension: the audience sees rationality as individual best-response calculus, while the user argues for symmetric policy optimization. The real disagreement is metaphysical - they view the "shared policy" premise as either incoherent (game theorists) or redundant (team-reasoning philosopher). 

  For the prep sheet, I'll prioritize objections by damage: highest risk is the causal decision theorist yelling "spooky action at a distance!" because it frames the whole approach as irrational. The Bayesian games specialist's "category error" charge is equally dangerous as it challenges the foundation. Must win those two battles.

  The philosopher of action might actually be an ally if handled right - concede her point about team reasoning similarities but emphasize the policy-as-shared-solution angle avoids her metaphysical baggage. That's a strategic concession.

  The unaskable question? "If agents have different priors, doesn't your symmetry assumption collapse?" That exposes the model's fragility - better to preempt by emphasizing common knowledge of symmetry in the setup.

  For delivery: open by granting that standard equilibrium concepts work for competitive games (disarms refinements theorists) and that superrationality requires symmetry (satisfies behavioral economist). The make-or-break reply is reframing "deviation" as changing the policy itself - that's the pivot point.
answer: |-
  Here is your Q&A prep sheet, designed for tactical deployment at the lectern. The diagnosis and priorities are upfront.

  **Diagnosis of Core Disagreement:**  
  This audience fundamentally rejects the *primacy of symmetric policy optimization* over individual strategic response. They see your "shared policy" as either (a) an arbitrary coordination device masquerading as rationality (game theorists), (b) smuggled-in group agency (philosopher), or (c) mystical thinking (causal theorist). Their burden of proof is: *"Show why an individual, absent explicit coordination or causal influence, should not simply best-respond to their beliefs about others."* They will attack Claim 1 (policy focus) and Claim 4 (legitimacy of equilibrium reasoning).

  **Objections & Replies (Ordered by Expected Damage):**

  1.  **Objector: Causal Decision Theorist**  
      *Objection:* "This is just Newcomb's Problem dressed up. Your 'policy' is a fancy word for acting like a one-boxer, ignoring your causal influence. In Platonia, *my* sending a telegram doesn't affect *their* choices. Why sacrifice a chance at $1B for some 'symmetric optimum' I can't control?"  
      *Reply:* "This isn't Newcomb. There's no predictor, no correlation without causation. It's about what constitutes the *object of choice*. I'm not choosing 'send' or 'don't send' in isolation; I'm choosing which *rule* to follow for symmetric problems. The causal inefficacy of my *act* is irrelevant; the question is the rationality of the *rule*. The rule 'send with p=1/20' yields a higher *ex ante* joint payoff expectation than any asymmetric best-response rule under symmetry. Causal influence operates *within* a play of the game, not on the selection of the rule governing symmetric plays."  
      *Soft Spot:* Distinguishing "choosing a rule" from "causally influencing others" feels slippery to CDT adherents.

  2.  **Objector: Bayesian-Games Specialist**  
      *Objection:* "You're conflating the strategy space. A strategy *is* a complete contingency plan. What you call a 'policy' *is* a strategy – specifically, a symmetric mixed strategy. Calling it something else doesn't change that the Nash equilibrium of that mixed strategy is the solution. Equilibrium *is* the requirement of no profitable unilateral deviation from that plan."  
      *Reply:* "The conflation is on your side. A strategy in the formal game *assumes* the game is isolated. My argument is that the *rational deliberation* for symmetric agents isn't about finding a best response *within* that isolated game matrix. It's about selecting the *type* of strategy (symmetric policy) that makes sense *across* such symmetric predicaments. The equilibrium condition formalizes consistency *given* that policy is played; it doesn't explain *why* that symmetric policy is rationally selected over others in the first place. You're taking the symmetry as given; I'm arguing it's rationally mandated."  
      *Soft Spot:* Accusation of verbal sleight-of-hand ("policy" vs "strategy") resonates in a formal room.

  3.  **Objector: Refinements Theorist #1**  
      *Objection:* "Symmetry arguments are just one equilibrium selection principle among many, useful sometimes but not fundamental. Why is this symmetric mixed strategy more 'required' by rationality than, say, a pure strategy equilibrium if one existed? Your 'requirement' seems arbitrary."  
      *Reply:* "Because the problem's symmetry is fundamental to the agents' knowledge and deliberation. Given perfect symmetry and common knowledge thereof, any asymmetric pure strategy profile is inherently unstable – each agent, knowing the others are identical and rational, would have no reason to believe they alone would play 'send' or 'don't send'. Only symmetric profiles (pure coordination or mixed) are even candidates. Among symmetric candidates, the mixed strategy with p=1/20 uniquely maximizes the *ex ante* probability of success (exactly one sending). It's not just *an* equilibrium; it's the only rationally sustainable *type* of solution under symmetry."  
      *Soft Spot:* "Uniquely maximizes success" assumes the symmetric policy framework they reject.

  4.  **Objector: Philosopher of Action (Team Reasoning)**  
      *Objection:* "This sounds like team reasoning lite. You want the benefits of collective rationality – maximizing the chance *someone* wins in Platonia – without the commitment to group agency or 'we-mode'. You can't have it both ways. Either you're reasoning as an individual maximizing individual payoff (leading to equilibrium analysis), or you're adopting a group perspective. Your 'shared policy' is just the group perspective in disguise."  
      *Reply:* "Not quite. Team reasoning explicitly shifts the subject to 'what should *we* do?'. I don't require that. Each individual asks 'what kind of *individual* rule should *I* adopt for problems like this, knowing others like me will adopt the same rule?'. The goal remains individual payoff maximization. Crucially, in Platonia, the *only* way I get the billion is if exactly one sends. The symmetric rule p=1/20 maximizes the chance *I* am that one, conditional on success occurring. It's individually rational ex ante under the symmetry constraint."  
      *Soft Spot:* Distinction between "rule optimized for symmetry" and "group goal" is subtle and easily challenged.

  5.  **Objector: Behavioral Economist**  
      *Objection:* "Who actually thinks like this? Calculating p=1/20 requires precise knowledge of N and common knowledge of rationality/symmetry. In Luring Lottery, people sent googolplexes! This might be a cute formal artifact, but it fails as a model of *practical* rationality for real humans."  
      *Reply:* "Two points. First, the argument is normative, not descriptive. It asks what idealized practical rationality demands *given* symmetry and common knowledge. Second, the policy is surprisingly robust. Approximate knowledge of N, a rough sense of symmetry, and aiming for low probability suffices to outperform naive 'enter big' or 'never enter' in Luring Lottery, or 'always send'/'never send' in Platonia. The googolplex entries prove people *sensed* a coordination problem but lacked the right normative framework."  
      *Soft Spot:* Concedes the framework is highly idealized; behavioral evidence weakens the "practical" claim.

  6.  **Objector: Refinements Theorist #2**  
      *Objection:* "What about asymmetric information or slight asymmetries? Your whole edifice crumbles. Equilibrium analysis handles perturbations. Your 'required' policy doesn't."  
      *Reply:* "Absolutely. This approach is explicitly for symmetric common-knowledge problems. It's not a general solution concept replacing Nash. It's arguing that *within its specific domain* (high symmetry, common knowledge), it provides a more compelling rational requirement than the equilibrium analysis of the isolated game. For asymmetric cases, standard tools reign supreme. Platonia and Luring Lottery *are* symmetric problems."  
      *Soft Spot:* Highlights the niche applicability, making it seem less foundational.

  7.  **Objector: Graduate Student**  
      *Objection:* "In Luring Lottery, if I believe others play superrationally with low p, isn't my best response to enter with a huge number, exploiting their low entries to grab a larger share if I win?"  
      *Reply:* "Only if you believe you alone will defect! But if you understand the symmetric policy logic, you must recognize that *if* others are following it, they expect *you* to follow it too. If you defect to a huge entry, you undermine the very symmetry the policy relies on. Crucially, your defection doesn't just change *your* entry; it changes the *expected class of policies* others attribute to rational agents like you. In a world where huge entries are possible, the symmetric policy collapses. Sticking to the low-p policy is stable *only if* everyone expects everyone else to stick to it *because* it's the rational symmetric rule. Defecting breaks the common knowledge of rationality under symmetry."  
      *Soft Spot:* Relies on the controversial idea that deviating changes the perceived "rules of rationality."

  8.  **Objector: Refinements Theorist #3 / General**  
      *Objection:* "Isn't this just Harsanyi's tracing procedure or risk-dominance applied to an unusual game? Why invent new terminology?"  
      *Reply:* "Superficially similar, but different foundation. Tracing starts with priors and converges to equilibrium. Risk-dominance selects among equilibria. This starts with the rational requirement for a symmetric policy *prior* to defining the game matrix in a way that assumes isolated acts. The 'game' we analyze with Nash is a *consequence* of failing to recognize the symmetric policy requirement. The symmetric mixed strategy isn't *selected*; it's *constitutive* of rational choice in this symmetric context."  
      *Soft Spot:* Sounds like denial of established tools without clear payoff.

  **Concessions to Make Up Front:**
  1.  "Equilibrium analysis is the correct and powerful tool for the vast majority of strategic interactions, especially competitive or asymmetric ones."
  2.  "Superrational reasoning relies critically on strong symmetry and common knowledge assumptions; perturb these, and standard methods are necessary."
  3.  "This is not a descriptive theory of how humans *actually* behave (as the Luring Lottery entries show), but a normative claim about practical rationality under idealized symmetry."

  **The Make-or-Break Reply (Must Land):**  
  The reply to the **Causal Decision Theorist (Objection 1)**. If the room accepts that the "object of choice" is the symmetric *rule/policy* and that causal inefficacy *within* a play of the isolated game is irrelevant to the rationality of *selecting that rule*, you have a foothold. If they dismiss this as "changing the question," the core argument collapses. Hammer the distinction: "We aren't playing *this* Platonia game in isolation; we are deciding *how to approach all such symmetric problems*."

  **The Dangerous Unaskable Question:**  
  **"If two identically rational agents face Platonia but have different, logically defensible prior beliefs about the probability others will send a telegram (both consistent with common knowledge of rationality and symmetry), must they still choose p=1/20? If not, doesn't your 'requirement' dissolve into subjective priors?"**  
  *Why Dangerous:* It exposes a deep fissure. Your argument relies on symmetry *implying* a unique rational policy. If different priors are possible while respecting symmetry and rationality, then the "requirement" vanishes, collapsing back into equilibrium selection based on beliefs (the standard view). Defending uniqueness requires claiming symmetry + rationality uniquely determines the prior (deep and controversial waters) or that the policy *defines* the rational prior (circular).

  ---

  **Use at Lectern:** Keep the diagnosis and concessions in mind during the talk. Flag concessions early. When objections arise, identify the archetype, state their objection clearly ("I think the causal decision theorist might ask..."), then deliver the concise reply. If the CDT objection comes, deploy the make-or-break reply with maximum clarity. If the dangerous question surfaces, acknowledge its depth, restate your core claim about symmetry mandating the policy, and offer to discuss priors offline – don't get bogged down. Good luck.
