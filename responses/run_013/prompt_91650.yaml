  ### The Shifting Shore  

  **Voice One (Epistemicist):**  
  A thousand grains, a sloping crest—  
  the tide withdraws, but leaves no test  
  to mark the moment waves retreat.  
  *This is still the shore.*  

  **Voice Two (Supervaluationist):**  
  One grain less, the wet sand gleams.  
  No single loss unmakes the seams  
  that bind the border to the beach.  
  *This is still the shore.*  

  **Voice One:**  
  The water ebbs; the margin thins.  
  A hidden line, where truth begins,  
  lies fixed beyond what eyes explore.  
  *This is still the shore.*  

  **Voice Two:**  
  Where sea and land refuse to choose,  
  each sharpening the scene must lose.  
  *It drowns or stands—that much is sure.*  
  *This is still the shore.*  

  **Voice One:**  
  Sand dwindles where the breakers roar.  
  I feel the boundary at my core:  
  a step exists no step could prove.  
  *This is still the shore.*  

  **Voice Two:**  
  A ripple now, no land in view.  
  No fact adheres where meanings slew  
  the solid ground we hoped to keep.  
  *This is still the shore.*  

  **Voice One:**  
  The tide has won, the coast is gone—  
  yet where it fled, the unknown drawn  
  still cuts the world I can’t restore.  
  *This is still the shore.*  

  **Voice Two:**  
  Just water here, a seamless blue.  
  What never was can’t be untrue.  
  The line we spoke is speech, no more.  
  *This is still the shore.*  

  ---

  ### Explanation  
  - **Structure & Refrain:** The poem alternates between two voices across seven stanzas (24 lines total). Each stanza ends with the shared refrain, *"This is still the shore,"* reflecting a Sorites progression where a shoreline recedes incrementally.  
  - **Epistemicist Voice (One):** Asserts a sharp, unknowable boundary. Refrains sound definitive yet elusive ("a step exists no step could prove").  
  - **Supervaluationist Voice (Two):** Denies a single fact in borderline cases. Refrains feel ambiguous, like a line "drawn everywhere at once" ("No fact adheres where meanings slew").  
  - **Key Elements:**  
    - **Disjunction (Stanza 4):** "*It drowns or stands—that much is sure*" is determinately true under supervaluationism, though neither disjunct holds alone.  
    - **Clash Exposed (Final Stanzas):** Epistemicist laments an inaccessible fact ("the unknown drawn still cuts the world"). Supervaluationist sees only linguistic indeterminacy ("What never was can’t be untrue").  
  - **Accuracy & Clarity:** Philosophers will recognize epistemicism’s "unknowable sharp boundary" vs. supervaluationism’s "truth in disjunction without determinate facts." New readers grasp the conflict through imagery (shoreline) and refrain shifts—true, then indeterminate, finally false.  
  - **Unsettled Dispute:** Neither voice is refuted; the refrain’s recurrence in borderline zones upholds both theories’ coherence.
