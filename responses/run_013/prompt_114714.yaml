prompt: |-
  I'm an undergraduate taking a metaphysics course and I work part-time in my university museum's collections office. We repeatedly have to decide whether a conserved or reconstructed artifact is still the same object for cataloguing, loans, and insurance: a ceramic vessel with a replaced handle, a painting that has been relined and retouched, a fossil skeleton reassembled from fragments, a plaster cast taken from an original mold, a digital model substituted for a fragile original. We keep three things separate in principle—the accession identity (the catalogue number), the physical-object identity (the material thing), and the display identity (what visitors are shown)—but in practice they collapse, and our current rule of thumb, 'if most of the original material is gone, it's a new object,' produces fights because the archaeologist, the conservator, and the insurer are answering different questions. Please turn the material-constitution literature (the statue and the clay, sortal relativity, constitution without identity, four-dimensionalism, mereological essentialism) into a decision procedure my office can actually run: the questions to ask in order, what counts as a sufficient answer, where it stops with 'same object' or 'different object', and where it must hand the call to a person because the issue is policy or values rather than metaphysics. I have about ten minutes per item, and the registrar and curator have to sign off. Include two or three worked cases, at least one where the procedure yields 'different object' even though the museum would prefer 'same'. Then say what the procedure cannot do, and where the theory is too contested to settle the case. I'd rather have an honest, self-critical procedure that flags its limits than a tidy one that pretends metaphysics decides everything; if my framing is confused—for instance, if 'same object' is doing several different jobs at once—say so and suggest how to separate them.
reasoning: |-
  Okay, the user is an undergraduate working in a museum collections office. They're dealing with the challenge of determining whether conserved or reconstructed artifacts are still the same object for cataloging, loans, and insurance purposes. They've mentioned examples like a ceramic vessel with a replaced handle, a relined painting, a fossil skeleton, a plaster cast, and a digital model. Their current rule of thumb—based on the amount of original material—is causing disputes among archaeologists, conservators, and insurers who have different perspectives.

  The user is asking for a decision procedure based on metaphysical literature about material constitution. They want a practical step-by-step process they can apply in about 10 minutes per item, with clear questions to ask, thresholds for determining "same" or "different" object, and acknowledgment of where metaphysics ends and policy/value judgments begin. They also want worked examples (including one where the museum would prefer "same" but the procedure yields "different") and an honest assessment of the procedure's limitations.

  I need to draw from key concepts in metaphysics: the statue/clay distinction showing how one matter can constitute different objects, sortal relativity (how identity depends on what kind of thing we're considering), constitution without identity (the statue is constituted by clay but isn't identical to it), four-dimensionalism (objects as space-time worms), and mereological essentialism (if any part changes, it's a different object).

  The challenge is turning this abstract theory into a practical tool. I'll structure it as a flowchart with key questions:
  1. What is the primary sortal? (What kind of thing is this?)
  2. What constitutes persistence for this sortal?
  3. How much change has occurred? (Material/structural/functional)
  4. Is there continuity of constitution?

  Then add policy layers:
  - Accession identity: linked to provenance
  - Physical-object identity: material persistence
  - Display identity: what's shown to visitors

  I'll include worked examples: 
  - The ceramic vessel (same object despite handle replacement)
  - The relined painting (same object with significant intervention)
  - The fossil skeleton (different object if most material is replica, even if museum prefers "same" for display continuity)
  - The plaster cast (different object from the mold)
  - The digital model (clearly different, derivative)

  I need to explicitly state limitations:
  - Metaphysics can't resolve value disputes (e.g., historical significance vs. material authenticity)
  - Borderline cases will always exist
  - Sortal dependence means different experts will prioritize different criteria
  - The "same object" question collapses multiple concerns (material continuity, functional identity, historical value)

  The procedure should flag when a decision requires policy input (e.g., insurance may care about material authenticity while education prioritizes display continuity). I'll emphasize that this is a framework for structured discussion, not an algorithmic solution, and that registrar/curator sign-off remains essential for those value judgments.
answer: |-
  Here's a practical, metaphysically-informed decision procedure for your museum, designed for ~10 minute assessments. It separates questions of *material persistence* (metaphysics) from *institutional function* (policy/values), flags its own limits, and forces explicit policy decisions where metaphysics runs out. The core insight is: **"Same object" is context-dependent and sortal-relative.** Your framing isn't confused – you've correctly identified that "same object" is doing multiple jobs (material continuity, catalog identity, display function). This procedure unpacks those.

  ---

  ### **The Decision Procedure: 4 Questions + Policy Override**
  **Time Target:** 5-7 mins for Q1-Q3, 2-3 mins for Q4/policy. Document rationale for registrar/curator sign-off.

  1.  **Q1: What is the PRIMARY SORTAL (kind/category) governing persistence?** (*Metaphysical Foundation*)
      *   **Ask:** "What *type* of thing is this fundamentally? (e.g., *historical artifact*, *artwork*, *scientific specimen*, *cultural object*, *information carrier*)? Be specific (e.g., 'Attic Red-Figure Amphora', 'Holotype *T. rex* femur', '19th-C Oil Portrait')."
      *   **Sufficient Answer:** A single, institutionally-agreed primary sortal relevant to the object's *core purpose* in the collection. *Must be recorded.*
      *   **Why?** Identity is sortal-relative (Wiggins, Lowe). A ship (artifact) persists through part replacement (Theseus' ship); a mineral specimen (natural kind) may not. *This is the most crucial step.*
      *   **Stop If:** Ambiguity or disagreement on the primary sortal. *Flag for curator/registrar policy input.* (e.g., Is a sacred object primarily a ritual item or an artifact? Policy decides.)

  2.  **Q2: What constitutes PERSISTENCE for this sortal?** (*Metaphysical Criteria*)
      *   **Ask:** "For this specific sortal, what changes are compatible with it remaining numerically the same thing? Consider: (a) *Material Continuity* (% original matter? Key parts?), (b) *Structural Continuity* (original form/configuration essential?), (c) *Functional/Historical Continuity* (same history, purpose, or information content?), (d) *Spatio-Temporal Continuity* (unbroken existence?)."
      *   **Sufficient Answer:** Identify the dominant persistence criterion/criteria for the sortal based on scholarly/conservation norms. Refer to policy guidelines if they exist (e.g., "For archaeological ceramics, >70% original material + intact form is standard for 'same object' persistence").
      *   **Why?** Different sortals have different persistence conditions. Mereological essentialism (all parts essential) is rarely practical for artifacts. Four-dimensionalism (object as spacetime worm) helps with gradual change but clashes with common sense. Constitution theory (clay/statue) shows material and functional object can coexist but differ.
      *   **Stop If:** Clear answer based on sortal norms. Proceed to Q3.

  3.  **Q3: Does the current item MEET the persistence criteria for its sortal?** (*Metaphysical Judgment*)
      *   **Ask:** "Based on Q1 & Q2, does the conserved/reconstructed item satisfy the conditions for being the *same* instance of that sortal? Consider documented interventions (replacement, addition, loss)."
      *   **Sufficient Answer:** Yes/No/Unclear. Must reference Q1 & Q2.
      *   **Thresholds:**
          *   **"Same Object" (Material Persistence):** Meets the dominant persistence criteria for the sortal (e.g., >70% original ceramic, core canvas intact despite relining, fossil holotype bone present).
          *   **"Different Object" (Material Persistence):** Fails core persistence criteria (e.g., <30% original matter, replica parts alter defining structure, original information carrier destroyed and replaced by digital surrogate).
          *   **"Constitutionally Related" (Common Outcome):** Original material constitutes a new or modified functional object (Baker). *Flag as borderline; often requires policy decision.* (e.g., A heavily restored vase is materially the *same* ceramic shards but constitutes a *different* display artifact).
      *   **Why?** Applies the theory. Constitution without identity (Baker) is often the most realistic model here – the original matter *constitutes* the artifact but isn't strictly identical to it, especially post-intervention.
      *   **Stop If:** Clear "Same" or "Different". If "Unclear" or "Constitutionally Related", proceed to Q4.

  4.  **Q4: What does the INSTITUTION require for this CONTEXT?** (*Policy/Values Override*)
      *   **Ask:** "Given the metaphysical status (Q3), what do our institutional needs (cataloguing, loans, insurance, display, ethics) demand for *this specific purpose*? Does policy provide guidance?"
      *   **Sufficient Answer:** A policy-driven decision, explicitly stated (e.g., "For insurance (value based on provenance), treat as same; for display label (material authenticity), note significant reconstruction").
      *   **Key Considerations:**
          *   **Accession Identity (Provenance):** Almost always stays with the *original historical entity*. Policy: *Rarely changes.*
          *   **Physical-Object Identity (Material):** Defined by Q1-Q3.
          *   **Display Identity (Function):** What visitors see. Policy: May differ from material identity (e.g., display a high-quality replica as "The Vase" while cataloging original fragments separately).
          *   **Loans/Insurance:** Often care about material authenticity (risk) *and* provenance (value). Policy must bridge Q1-Q3 and contract terms.
      *   **Why?** Metaphysics can't decide values. Insurers care about material risk, archaeologists about historical continuity, educators about communicative function.
      *   **Final Output:** A decision for the *specific purpose* (e.g., "For loan agreement: Same Accession (provenance), Different Physical Object (fragile original vs. display replica)"). Registrar/Curator sign-off happens *here*, accepting the rationale from Q1-Q4.

  ---

  ### **Worked Cases**

  **Case 1: Ceramic Vessel (Handle Replaced)**
  *   **Q1:** Sortal = *Archaeological Artifact* (Specifically, a complete utilitarian vessel).
  *   **Q2:** Persistence = Moderate Material Continuity (>50% original) + Structural/Functional Continuity (recognizable form/use). Handle is replaceable part.
  *   **Q3:** **Same Object.** Original body intact, handle non-defining part replaced. Constitutionally, original clay constitutes the same functional vessel.
  *   **Q4:** Policy: Accession ID same. Physical ID same. Display ID same (note restoration). Loan/Insurance: Treat as same object (minor intervention). **OUTPUT: SAME OBJECT** (All identities aligned).

  **Case 2: Fossil Skeleton (Reassembled with >60% Replica Bones)**
  *   **Q1:** Sortal = *Palaeontological Holotype Specimen* (Defining reference specimen for a species).
  *   **Q2:** Persistence = High Material Continuity (Original bone is irreplaceable data source) + Essential Structural Continuity (Defining morphology).
  *   **Q3:** **Different Object (Material Persistence).** Critical mass of original defining material lost/replaced. The replica bones constitute a *new* display model. Original fragments = original specimen; mounted skeleton = new composite object.
  *   **Q4:**
      *   *Museum Preference Conflict:* They *want* "Same" for display impact and provenance.
      *   Policy Required:
          *   Accession ID: Stays with original holotype fragments.
          *   Physical ID: Mounted skeleton = new object derived from original.
          *   Display ID: Can be labeled as "Cast Reconstruction of *T. rex* Holotype [Accession #]" (Honest, separates identities).
          *   Loan: Likely impossible (original too valuable/fragmented? Replica not the holotype?).
          *   Insurance: Original fragments insured as holotype; mounted replica insured as separate model (lower value?).
      *   **OUTPUT:** **DIFFERENT PHYSICAL OBJECT** from the original holotype specimen. Policy manages display identity and access.

  **Case 3: Painting (Relined, Significant Retouching - 30% Loss/Overpaint)**
  *   **Q1:** Sortal = *Artwork* (Unique aesthetic creation).
  *   **Q2:** Persistence = Key Original Surface Continuity (Artist's hand) + Structural Continuity (Original support layer integrity compromised by relining? Debate!). High tolerance for restoration if documented.
  *   **Q3:** **Unclear/Constitutionally Related.** Original canvas fragments + new lining constitute the current physical support. Original paint + overpaint constitute the visible surface. Is it the *same artwork*? Likely yes (spatiotemporal continuity, core image intact). Is it the *same physical object*? Debatable.
  *   **Q4:** Policy Crucial:
      *   Accession ID: Same (Provenance).
      *   Physical ID: Borderline - Policy may dictate "Same" if key design layers original, or flag significant intervention.
      *   Display ID: "Artist's Work, with significant later restoration."
      *   Loans/Insurance: Treat as same artwork (high value), but condition report MUST detail interventions impacting material identity. Insurer may adjust premium based on % loss.
      *   **OUTPUT:** **SAME ACCESSION OBJECT**, **PHYSICAL OBJECT BORDERLINE (Policy: Treat as Same with Major Intervention Flagged)**. Display identity managed with label.

  ---

  ### **What the Procedure CANNOT Do (Limits & Theory Contests)**

  1.  **Resolve Fundamental Metaphysical Disputes:** It *uses* concepts but doesn't solve debates (e.g., 3D vs. 4D persistence, strict vs. loose mereological essentialism). It forces choosing *one* applicable model (Q2) based on sortal/policy.
  2.  **Define the 'Correct' Sortal (Q1):** This is often value-laden (Is it art? Artifact? Specimen?). The procedure *exposes* this and kicks it to policy.
  3.  **Set Quantitative Thresholds:** Is 51% original "most"? Procedure relies on institutional norms/policy for Q2 criteria.
  4.  **Handle True Borderline Cases:** Some objects exist in a metaphysical gray zone (Ship of Theseus mid-restoration). The procedure will flag this (Q3 Unclear) and demand a *policy* decision (Q4).
  5.  **Replace Value Judgments:** Insurance value, cultural significance, display pedagogy – these are *not* metaphysical questions. The procedure separates them (Q4) but doesn't answer them.
  6.  **Solve "Constitution" Ambiguity:** When does constituted object B (restored vase) become distinct from original matter A? Theory is contested. Procedure flags "Constitutionally Related" and relies on policy.
  7.  **Fully Separate "Same Object" Meanings:** While it distinguishes Accession (Provenance), Physical (Material), and Display (Function) identities, in practice, institutions often *need* to collapse them for simplicity (e.g., one catalogue number). The procedure forces *awareness* of the collapse and documents the rationale.

  ### **Key Strength: Honesty & Structure**
  This procedure doesn't promise metaphysical certainty. It uses metaphysics to clarify *what kind of question is being asked* (material persistence under a sortal) and isolates it from policy needs. By requiring explicit sortal choice (Q1), persistence criteria (Q2), and policy justification (Q4), it structures arguments, reduces unspoken assumptions, and provides an audit trail for registrar/curator decisions. It accepts that "same object" is often a useful fiction masking complex metaphysical and institutional realities, but provides tools to manage that complexity transparently. Ten minutes is tight, but focused on these questions with pre-agreed sortal/policy guidelines, it's achievable. The real win is reducing fights by showing *why* people disagree – is it the sortal (Q1), the criteria (Q2), the assessment (Q3), or the policy (Q4)?
