prompt: |-
  Last weekend I got into a four-hour argument with a friend who builds RL systems for a living about 'agentic AI.' His line: an agent is just a policy with a long horizon and a memory, end of story. Mine: no, 'agent' is a stance we take, not a fact about the system. A system is a tool if every goal it serves is handed to it at call time, and an agent only if it carries goals of its own across calls — and by that definition most of what ships as agentic AI is a tool in a costume, which is why 'delegation' should be doing the work that 'agency' is doing in these debates. Anyway, I'm definately going to get killed in the Q&A, because I have to give this as a 20-minute talk to our CS department seminar next month: mostly RL and robotics people, two HCI researchers who study how people actually use chatbots, and one philosopher of mind who always asks the question I can't answer. Prep me. I want the eight or so objections this specific room will actually raise, ranked by how likely and how much damage they do, phrased the way each group would put it, each with a short reply and an honest note about where that reply is weakest. Tell me what to concede up front so I don't look evasive, and which question I'm secretly hoping nobody asks. American English.
