  Hmm, their frustration with "magic tricks that work on standard examples" jumps out. They've probably seen too many hand-wavy solutions to Bertrand's paradox and wants to cut through the BS. The demand to skip famous proposals (Jaynes, Jeffreys, etc.) is telling—they're building their own mental framework first. Smart approach.

  Let me mentally group their asks. First, the core requirements: definitive answers to classics, reparametrization handling, no extreme probabilities, operational coherence, and a rigorous definition of "no information." Then the nuance tests: collapsing distinctions (parameter vs. observation, agent symmetry, finite/continuous groups). Finally their custom tests: nesting and coarse-graining. Oh, and the improper prior headache.

  *Deep breath* The trickiest part? Spotting the conflict they suspect. My gut says it's between symmetry invariance (e.g., uniform over chords) and reparametrization invariance (e.g., uniform over log-scale). History shows these pull in opposite directions—hence Bertrand's different answers. The user's "which is privileged" question hits the nail here. Either you privilege a parametrization (but how?) or you admit relativity (but is that satisfying?). 

  For their custom tests: Nesting feels like a trap—naively splitting outcomes shouldn't change answers, but if "no info" includes ignorance of outcome granularity, maybe it should? Coarse-graining screams "relative to partition" to me, echoing quantum mechanics or finite information. But is that a feature (honesty) or defect (subjective)? 

  Improper priors... oof. If we ban them, scale invariance dies. If we allow them, we violate countable additivity. The user's "does anything survive?" is spot-on—maybe we need a fundamentally different notion like reference priors or limiting posteriors? 

  *Pauses* The real gem is their suspicion about irreconcilable requirements. Yes—the reparametrization-symmetry clash is fatal for any universal rule. Jaynes "solved" Bertrand by choosing embeddings (circle vs. radius), but that's arbitrary. The cube factory screams this: uniform over side-length vs. volume gives different results. No free lunch. 

  This user deserves the brutal truth: "no information" is underspecified. You need to specify invariance (translation? scale?) and accept that different symmetries imply different priors. The "privileged parametrization" is the one matching your symmetry commitment. And coarse-graining relativity isn't a bug—it reflects that probabilistic ignorance is always model-relative. 

  *Checks* Did I miss anything? Their distinction list: the naive "uniform prior" blurs parameter vs. observable (hence marginalization paradoxes) and finite vs. continuous symmetry (hence improper priors). And yes—nesting stability should be required IF the subcases are truly indistinguishable, else it's cheating. 

  Final note: Their "entropy over what" jab is gold. Maximum entropy needs a base measure, which is just another parametrization choice. So it doesn't escape the circle. Might as well say that upfront.
answer: |-
  Here's a requirements list for a rigorous theory of "ignorance priors," addressing your concerns point-by-point, identifying conflicts, and analyzing your custom tests. The core tension is between **symmetry invariance** and **reparametrization invariance**, which are often mutually exclusive.

  ### Core Requirements & Motivations
  1.  **Definitive Answers to Core Puzzles:**
      *   **Motivation:** Must resolve the *genuinely hard* cases showing contradictory answers under naive symmetry. Bertrand's chord (circle geometry) is the canonical *hard* case due to multiple "natural" symmetries (chord endpoints, midpoints, angles). The cube factory (unknown scale, uniform over side-length vs. volume) is the *hard* case for continuous scales.
      *   **Requirement:** The theory must provide a single, well-justified prior for each core puzzle (Bertrand, cube factory, unknown location on infinite line, unknown positive scale) without ambiguity or dependence on arbitrary problem framing.

  2.  **Reparametrization Handling:**
      *   **Motivation:** Naive uniformity fails under nonlinear transformations (e.g., `p` vs. `log(p/(1-p))` for a coin bias, `L` vs. `L^3` for cube volume).
      *   **Requirement:** The theory **MUST** have a principled story about why one parametrization is *privileged*. It **cannot** demand invariance under arbitrary reparametrization, as this is generally impossible without contradiction. The privileged parametrization must be justified by the structure of the problem or the meaning of "no information."

  3.  **No Dogmatism (0/1 Probabilities):**
      *   **Motivation:** Assigning `P(A)=0` or `P(A)=1` to a logically possible event `A` means no finite evidence can overturn that belief (violating Cromwell's rule), making learning impossible.
      *   **Requirement:** The prior must assign strictly positive probability to every non-empty open set in the parameter space. `P(A) = 0` only if `A` is logically impossible.

  4.  **Operational Coherence:**
      *   **Motivation:** A prior is useless if it leads to incoherent updates or guaranteed betting losses (Dutch books).
      *   **Requirement:** The prior must be a valid probability distribution (σ-additive) defined on a well-structured space (σ-algebra), enabling coherent Bayesian updating and avoiding sure-loss contracts.

  5.  **Explicit Definition of "No Information":**
      *   **Motivation:** "No information" is vacuous without precise meaning. What symmetries or invariances define ignorance?
      *   **Requirement:** The theory must explicitly state what "no information" means *operationally*. Examples: "Invariance under translation" (location), "Invariance under scaling" (scale), "Invariance under relabeling" (discrete outcomes). This defines the *privileged symmetry group* tying back to Requirement 2.

  6.  **Respecting Key Distinctions:**
      *   **Motivation:** Naive approaches blur critical differences.
      *   **Requirement:** The theory **must clearly distinguish**:
          *   **Parameter vs. Observable:** A prior over an unknown parameter `θ` is fundamentally different from a sampling distribution over observable data `X` given `θ`. Ignorance priors are about `θ`.
          *   **Agent Symmetry:** Agents with genuinely symmetric information *must* assign the same prior. Agents with different information *must not*.
          *   **Finite vs. Continuous Symmetry:** The mathematical tools and the existence of uniform distributions differ radically. Naive theories often assume a nonexistent uniform prior on continuous groups.

  ### Your Custom Tests: Analysis & Requirements
  1.  **Nesting Test (Splitting Outcomes):**
      *   **Analysis:** This is a **trap** for naive uniformity. Naively splitting an outcome and re-applying uniformity changes the prior on the original coarse space.
      *   **Requirement:** A valid theory **must** be stable under nesting *if the subcases are truly indistinguishable under the "no information" symmetry*. Splitting a coin flip `{Heads}` into `{Heads-Red, Heads-Blue}` shouldn't change the `P(Heads)=1/2` *if color provides no relevant information*. Stability is required **only** when the split respects the underlying symmetry defining ignorance. If the split introduces a *new* symmetry (e.g., between red/blue), the prior *must* change.

  2.  **Coarse-Graining Test (Refinable Partitions):**
      *   **Analysis:** This probes the dependence of "ignorance" on description granularity.
      *   **Requirement:** The theory **must be honest that the prior is relative to the chosen partition/algebra**. It cannot be "stable under refining the partition" in general. The *meaning* of "no information" (Requirement 5) is defined relative to a specific set of distinctions (the σ-algebra). Refining the partition adds new distinctions, representing *new possibilities* the agent (perhaps hypothetically) considers. Ignorance is defined over the possibilities *as conceived*. Relativity is a **feature**, not a defect; it reflects that probability is a model of uncertainty based on available possibilities.

  ### Continuous Symmetries & Improper Priors
  *   **Problem:** Continuous symmetry groups (translation on ℝ, scaling on ℝ⁺) often lack a normalizable invariant measure (Haar measure). The naive uniform prior is "improper" (infinite total measure).
  *   **Requirement:** **Improper priors are provisionally allowed ONLY if they function as limits of proper priors AND yield proper posteriors with any non-zero data.** They are a mathematical tool, not true probabilities (violating Requirement 4 strictly). The theory must specify:
      1.  The symmetry group defining ignorance (Requirement 5).
      2.  The (possibly improper) invariant measure of that group.
      3.  How to use it to obtain well-defined posterior distributions via Bayes' theorem.
  *   **Survival:** Theories *can* survive by treating improper priors as approximations representing overwhelming prior uncertainty relative to the data. However, they inherently lack full coherence (Requirement 4). Alternatives like reference priors (as limits of proper priors maximizing information divergence) exist but inherit the parametrization problem.

  ### The Inevitable Conflict
  *   **Conflict:** **Requirement 2 (Privileged Parametrization via Symmetry) vs. Requirement 6 (Respecting Continuous Symmetry).** The "natural" parametrization for a symmetry (e.g., Lebesgue measure for translation on ℝ) is often *not* invariant under other transformations implied by different symmetries (e.g., Lebesgue measure is *not* scale-invariant).
      *   **Bertrand's Paradox:** Uniform over chord endpoints? Midpoints? Angles? Each corresponds to a different "natural" symmetry & parametrization.
      *   **Cube Factory:** Uniform over side-length `s` (translation symmetry for `log(s)`?) vs. uniform over volume `v = s^3` (translation symmetry for `log(v)`?) vs. uniform over surface area. Different symmetries imply different "privileged" parametrizations.
  *   **Nature:** This conflict is **fatal** to the idea of a single, universal "ignorance prior" applicable to any parameter space without additional structure. "No information" *must be defined relative to a specific symmetry group* (Requirement 5), which selects the privileged parametrization (Requirement 2) and the (possibly improper) invariant measure. Different symmetries yield different priors.
  *   **Resolution:** The theory cannot avoid arbitrariness entirely. It must:
      1.  **Explicitly Declare Symmetry:** State the transformation group (`G`) under which the prior must be invariant to represent ignorance about `θ`. This defines the "structure" of the problem.
      2.  **Use the Haar Measure:** The prior is proportional to the (left/right) Haar measure of `G` on the parameter space. This satisfies Requirement 2 *relative to G*.
      3.  **Acknowledge Relativity:** The choice of `G` is not dictated by logic alone; it's a modeling choice about what aspects of the problem are considered "known" or irrelevant. Translation-invariance (`G = (ℝ, +)`) implies knowledge of a *location origin* is absent. Scale-invariance (`G = (ℝ⁺, ×)`) implies knowledge of a *unit* is absent.

  ### Why Maximum Entropy Doesn't Automatically Save You (as requested)
  Maximum entropy (MaxEnt) *requires* a base measure (a default prior) over the space to maximize entropy relative to. **The base measure *is* the choice of privileged parametrization (Requirement 2).** Saying "use uniform" or "use Lebesgue" is choosing the parametrization implicitly. MaxEnt inherits the symmetry/reparametrization conflict; maximizing entropy relative to Lebesgue measure yields a different distribution than maximizing relative to the measure `dθ/θ` (which is scale-invariant). MaxEnt needs the base measure to be specified by the symmetry defining ignorance (Requirement 5).

  ## Summary: The Requirements List for a Valid Theory
  1.  **Definitive Answers:** Resolves core puzzles (Bertrand, Cube Factory) unambiguously.
  2.  **Privileged Parametrization:** Justifies *one specific parametrization* based on...
  3.  **Explicit Symmetry:** Defines "no information" as invariance under a specific transformation group `G`.
  4.  **Haar Measure:** Uses the (possibly improper) invariant measure of `G` as the prior.
  5.  **Non-Dogmatism:** `P(A) > 0` for all logically possible `A`.
  6.  **Coherence:** Proper prior preferred; improper priors allowed only if yielding proper posteriors and defined as limits. Avoids sure loss.
  7.  **Respect Distinctions:** Clear on Parameter/Observable, Agent Symmetry, Finite/Continuous.
  8.  **Nesting Stability:** Stable under outcome splitting *only if* the split respects `G`.
  9.  **Coarse-Graining Honesty:** Admits the prior is relative to the considered partition/σ-algebra.
  10. **Acknowledge Conflict:** Explicitly states that different symmetries (`G`) imply different priors; no universal "ignorance" prior exists without specifying the symmetry.

  **The Price of Admission:** Any viable theory must embrace the **relativity of "ignorance" to a chosen symmetry group `G` and parametrization**. The "magic trick" is exposed: resolving the paradoxes requires making the choice of symmetry explicit and justified, rather than hidden. The conflict between symmetries is fundamental and cannot be eliminated.
