answer: |-
  ### Diagnosis of the Language-of-Thought Debate

  Your working hypothesis—that this is a "levels-of-explanation confusion"—is insightful but incomplete. Let me dismantle it step by step using the core arguments from both sides, then evaluate your alternatives.

  #### Step 1: Plausible Diagnoses
  1. **Levels-confusion**: Classicists (Fodor, Pylyshyn) operate at Marr's *computational* level (what cognitive capacities exist and why), demanding a *principled* explanation for systematicity. Connectionists (Smolensky, McClelland) often focus on *implementational* mechanisms (how neural networks realize cognition), arguing distributed representations suffice without discrete symbols.  
  2. **Verbal dispute**: "Language-like" might be ambiguously stretched, with classicists insisting on *combinatorial syntax/semantics* while connectionists redefine "compositionality" as statistical approximation (e.g., tensor product binding).  
  3. **Underdetermined-substantive disagreement**: Genuine conflict about representational format (discrete symbolic vs. distributed sub-symbolic), but behavioral data (systematicity failures, novel thought) and neural data (distributed activation patterns) can’t decisively refute either.  
  4. **Ill-posed problem**: The debate presupposes a false dichotomy—cognition might use *multiple formats* (e.g., LOT for reasoning, depictive for imagery), rendering the "either/or" meaningless.  

  #### Step 2: Arguing Down the Options
  - **Against levels-confusion**: Fodor explicitly targets *cognitive architecture*, not just computational abstractions. He argues connectionism fails *even as implementation* because distributed systems lack intrinsic structure-sensitive operations (e.g., variable-binding without ad hoc circuitry). Conversely, connectionists like Smolensky claim their models *are* computational explanations (e.g., Harmonic Grammar explaining systematicity gradients). **Verdict**: Levels matter, but both engage at multiple levels—it’s not *just* miscommunication.  
  - **Against verbal dispute**: When Fodor says "language-like," he means a *formal system with atomic constituents, recursive combination, and syntax-driven processes*. Connectionists don’t dispute this definition; they deny it’s necessary (e.g., using superpositional storage to mimic compositionality). The imagery debate amplifies this: depictive formats (Kosslyn) *cannot* be reduced to LOT without losing spatial properties (e.g., mental scanning times), suggesting a real format distinction. **Verdict**: Disagreement is substantive, not terminological.  
  - **Against ill-posed**: Pluralism (e.g., Camp’s "conceptual engineers") is tempting, but classicists insist systematicity/productivity *must* have a unified architectural basis—otherwise, we’d see cognitive systems that lack these features. Since we don’t, they argue a single format (LOT) is necessary.  

  This leaves **underdetermined-substantive disagreement** as the strongest candidate. Here’s why:  
  1. Classicists demand a *deductive* explanation: systematicity follows *necessarily* from LOT’s combinatorial structure. Connectionists offer *inductive* explanations: systematicity *emerges* statistically in networks (e.g., transformers generalizing to novel sentences).  
  2. Both sides reject the other’s "explanation":  
     - Classicists see connectionist "systematicity" as *approximate* (e.g., LLMs failing on recursive nesting like "the man the boy the dog bit kissed fled") and thus not true productivity.  
     - Connectionists see LOT as *empirically empty*—it doesn’t predict *which* systematic patterns exist (e.g., why we infer "Mary loves John" from "John loves Mary" but not "John is to the left of Mary" from "Mary is to the left of John").  
  3. **Neuroscience underdetermines it**: Distributed activations (e.g., in fMRI) could implement symbolic operations (via dynamic binding) *or* subsymbolic statistics. Neither side’s predictions are falsifiable at scale.  

  #### Step 3: What Would Move the Debate?
  Progress requires **resolving the underdetermination** by forcing a falsifiable clash. This demands:  
  - **A formal result**: Prove that *any* system achieving human-like systematicity/productivity *must* (or *must not*) use classical compositionality. Some attempts exist (e.g., Fodor & McLaughlin on "vanishing" systematicity in nets), but connectionists counter with architectures like Vector Symbolic Architectures (VSAs).  
  - **A new experiment**: Exploit the *imagery parallel*. If mental rotation (depictive) shows analogue, non-propositional properties (e.g., continuous transformation speed), while logical inference requires LOT, we might identify *format-specific neural signatures*. Current tools (fMRI, EEG) lack resolution; advances in single-neuron recording or optogenetics could help.  
  - **Shift the question**: Instead of "Is there LOT?", ask "When does cognition *require* symbolic formats?" (e.g., in hierarchical planning vs. pattern recognition). LLMs deepen this: their success in *statistical* systematicity (e.g., few-shot learning) but failure in *rigorous* compositionality (e.g., hierarchical reasoning) suggests systematicity isn’t monolithic—grading it might dissolve the binary.  

  **If no progress occurs**, it’s because the debate conflates two issues: (1) the *existence* of structured representations (undeniable) and (2) the *necessity of a single, amodal format* for all thought (unfalsifiable). Connectionists win on implementation, classicists on computational constraints—but neither monopolizes the truth.  

  #### Final Verdict  
  This is a substantive disagreement about cognitive architecture that remains underdetermined by current empirical and theoretical tools, with progress hinging on crisper operationalization of "systematicity" and format-specific neural markers.  
  \answer{underdetermined-substantive}
