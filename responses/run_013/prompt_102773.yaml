answer: |-
  ### Verdict
  No established term cleanly captures this specific phenomenon. While adjacent concepts like "scope insensitivity" or "aggregation debates" touch on aspects of it, none precisely names the *opportunistic toggling* between aggregation and non-aggregation stances within a single argumentative context to defend a pre-existing conclusion. The phenomenon is best understood as a distinct form of motivated reasoning applied to the ethics of summing harms/benefits.

  ### Nearest Concepts
  1. **Scope Insensitivity/Scope Neglect**:  
     *Captures*: The psychological tendency to underreact to quantitative changes in the magnitude of harm/benefit (e.g., saving 2,000 vs. 200,000 lives feels similarly urgent).  
     *Falls short*: This is about *underestimating* large numbers, not *deliberately rejecting aggregation* as invalid in one case while embracing it in another. Your cases involve explicit rationalization ("you may not heap up harms"), not mere cognitive neglect.  

  2. **Aggregation Debate in Ethics**:  
     *Captures*: Philosophical disputes over whether small harms can sum to outweigh large ones (e.g., Taurek's "numbers don't matter" vs. utilitarian summation).  
     *Falls short*: This debate concerns *which principle is correct*. Your phenomenon involves one agent *inconsistently applying both principles* without acknowledging the contradiction. It’s tactical switching, not theoretical disagreement.  

  3. **Motivated Reasoning**:  
     *Captures*: How people selectively interpret evidence to favor desired conclusions.  
     *Falls short*: While your phenomenon fits under this umbrella, it’s too broad. Motivated reasoning lacks specificity about the *unique mechanism*: exploiting ambiguity in aggregation ethics to toggle between totalist and individualist moral frameworks.  

  ---

  ### The Carving  
  **Core Phenomenon**: The asymmetric application of aggregation logic—summing small harms/benefits when it supports one’s preferred moral or policy conclusion, but rejecting summation as invalid when it opposes that conclusion—within a coherent argumentative stance, without acknowledging the inconsistency.  

  **Key Features**:  
  - **Numerical Asymmetry**: Relies on large numbers of trivial events vs. fewer severe events.  
  - **Logical Toggling**: Treats summation as morally permissible or impermissible based solely on which outcome it favors.  
  - **Unacknowledged Inconsistency**: The agent does not concede a change in principle; the switch is implicit.  

  **Boundaries**:  
  - *Not* **inconsistent principles across contexts**: E.g., always rejecting aggregation in risk contexts but accepting it in taxation is coherent if argued separately. Your cases involve *same context* (e.g., micro-harms/benefits).  
  - *Not* **scope neglect**: If someone says "1M risks don’t matter" due to *emotional numbness*, it’s neglect. If they say "summing imperceptible harms is *logically invalid*" in Case A but valid in Case B, it’s this phenomenon.  
  - *Not* **pure hypocrisy**: The inconsistency is masked by appeals to moral intuition ("you can’t compare!") rather than naked self-interest.  

  **Edge Case**: If someone argues aggregation is invalid *only* for harms above a severity threshold (e.g., "no sum for torture, but sum for headaches"), that *could* be consistent. The flaw arises when the threshold shifts opportunistically (e.g., rejecting summation for mild suffering vs. a broken limb *only* when totals clash with their view).  

  ---

  ### A Term  
  **Proposed Term**: **Aggregative Opportunism**  

  **Definition**: The rhetorical practice of opportunistically affirming or denying the permissibility of summing small harms/benefits across individuals to determine net moral or practical outcomes, where the stance adopted (totalist or non-aggregative) correlates reliably with supporting a predetermined conclusion, without acknowledgment of the inconsistency.  

  **Boundary Cases**:  
  - **Inside**: An activist argues that noise pollution from a festival (disrupting 10,000 people’s sleep for one night) cannot be justified by charitable funds raised (non-aggregation), but later defends a tax on private jets (harming 100 wealthy users) to fund public parks (benefiting 500,000 mildly), citing "net social good" (aggregation).  
  - **Outside**: A philosopher consistently rejects *all* aggregation of small harms/benefits, arguing that even trivial harms to millions never outweigh severe harm to one. This is principled non-aggregation, not opportunism.  

  ---

  ### The Decisive Case  
  **Scenario**: A policy imposes 10 seconds of moderate discomfort (e.g., a pinprick blood test) on 1 million people to prevent one person from enduring 48 hours of severe, untreated pain.  

  - **Aggregative Opportunism Prediction**:  
    - If the agent *opposes* the policy, they argue: "No sum of trivial discomforts can *ever* justify overriding one person’s intense suffering."  
    - If they *support* it, they argue: "1 million × 10 seconds = 278 hours of suffering averted versus 48 hours caused—clearly net positive."  
    The stance flips based on their prior view of the policy.  
  - **Scope Neglect Prediction**:  
    The agent might *underweight* the 1 million discomforts ("it’s just a pinprick!") and oppose the policy, or *overweight* the single suffering ("48 hours is eternity!") and oppose it—but they wouldn’t *toggle the logic of aggregation itself*.  
  - **Principled Non-Aggregation Prediction**:  
    Consistently rejects the policy regardless of numbers: "The pinpricks and the severe pain are incomparable; summation is invalid." No flip occurs.
