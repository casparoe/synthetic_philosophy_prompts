prompt: |-
  Ok so my friend and I got into this stupidly long argument last night about Frege's puzzle — the Hesperus/Phosphorus kind of thing — and his whole line was that the "puzzle" is really just about people not knowing that two names pick out the same object, so once you learn the identity the interesting part evaporates. I dont buy it, but I couldnt build a case on the spot to shut him up. Can you do it for me? You're a philosopher of language working on reference, so think carefully and maybe brainstorm two or three candidate scenarios before you commit to one.

  Here's the spec. Give me one ordinary-life scenario — a workplace, a family situation, whatever, nothing sci-fi — in which a single person sincerely assents to one sentence and sincerely dissents from another, where the only relevant difference between the two sentences is that one contains a term a and the other contains a term b, and a and b co-refer. The hard constraint: the person fully knows that a = b. So the difference in how the two sentences strike them can't be written off as ignorance of the identity. No Hesperus/Phosphorus, no real proper names of actual people, keep it to a paragraph or two.

  Then do the check. What does the Fregean say is going on (sense vs. reference, cognitive significance)? What does a Millian / direct-reference person have to say instead — presumably that the person is just being irrational, or is confusing modes of presentation with content? And what does the old description theory say? Tell me which feature of the case is really doing the work, what happens if I strip that feature out, and how a Millian would attack the case to try to make it not count. Last thing, and be straight with me: where is your own reasoning weakest here? Which consideration would actually make you change your verdict, and is there a tweak to the scenario that would flip it?
