  Hmm... workplace contexts might work best. Consider a company with an anonymous feedback system. Imagine a manager, Alex, who receives criticism signed "The Compliance Hawk" about their aggressive sales tactics. Later, Alex learns their trusted colleague Sam is The Compliance Hawk. 

  The key is crafting sentences where Alex would assent to "The Compliance Hawk thinks I'm unethical" but dissent from "Sam thinks I'm unethical", despite knowing Sam is the Hawk. The psychological tension comes from the emotional disconnect between the anonymous critic persona and the familiar colleague.

  For the analysis part: Frege would say the two names have different senses (impersonal critic vs. friend), Millians would call this irrational confusion of presentation with reference, while descriptivists might focus on how "The Compliance Hawk" implies specific attributes. 

