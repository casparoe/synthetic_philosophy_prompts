  Please work with three tools. (1) Spell out the difference between what I'll call the removal reading and the replacement reading of the antecedent, saying exactly what each holds fixed. (2) Treat the structural conditions of the early 1930s as having made a far-right takeover probable rather than certain, and address whether a counterfactual of this kind can have a determinate truth value at all when it is chancy. (3) Keep the description of the outcome under control: "a fascist regime," "a regime that plunges Europe into war," and "Nazi Germany" may come apart, and I want you to say which description my argument actually needs.

  Start with a short brainstorm listing the strongest moves available to each side and identifying where they are talking past each other, then write the paper itself in continuous prose. Be rigorous rather than comprehensive, and don't retreat into "both sides have a point."
