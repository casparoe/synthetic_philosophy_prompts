answer: |-
  ### Decision Procedure: Premise-Based Aggregation (PBA)  
  **Core Idea:** Vote only on the criteria (premises). The funding decision (conclusion) is **automatically determined** by the criteria votes. This avoids inconsistencies and forces adherence to the rule that all criteria must pass for funding.  

  ---

  ### One-Page Briefing Pack  
  **1. Order of Operations**  
  - **Step 1: Pre-meeting criteria-setting**  
    - Chair proposes criteria wording. Committee must approve it by simple majority.  
    - Criteria must be **exhaustive, necessary, and sufficient** (e.g., "Funding requires ALL criteria; no other factors matter").  
  - **Step 2: Voting**  
    - Vote **only on criteria** (e.g., "Feasibility: Yes/No/Abstain").  
    - No separate vote on funding.  
  - **Step 3: Outcome**  
    - A criterion **passes** if votes FOR > votes AGAINST (abstentions ignored). Tie = fail.  
    - Funding approved **iff all criteria pass**.  

  **2. Recording Minutes**  
  - List votes per criterion (e.g., "Feasibility: 4 Yes, 2 No → Pass").  
  - State funding outcome: "Approved: All criteria passed" or "Rejected: [List failed criteria]".  
  - **No ambiguity:** Feedback to applicants cites specific failed criteria.  

  **3. Handling Edge Cases**  
  - **Abstentions:** Ignored in tally (e.g., 3 Yes, 3 No → tie → fail).  
  - **Strategic voting:** Recorded transparently (e.g., "Member X voted No on Feasibility").  
  - **Refusal to vote on premises:** Treated as abstention.  
  - **Tie:** Criterion fails (no chair override).  
  - **Chair’s power:** Limited to initial criteria proposal; committee approval required.  

  **4. Judgment Calls vs. Mechanics**  
  - **Judgment:** Setting/approving criteria (pre-meeting).  
  - **Mechanical:** Voting, tallying, outcome determination (during meeting).  

  **5. Failure Modes**  
  - **Misfires if:** Criteria are poorly defined (non-exhaustive).  
  - **Cannot prevent:** Strategic voting (but exposes it).  
  - **Impossibility sacrifice:** We sacrifice "independent conclusion voting" to avoid irrational outcomes (discursive dilemma: majority premises + majority conclusion can conflict).  

  ---

  ### Walkthrough of Cases  
  **Case 1: Original March-Style Profile**  
  - **Votes:**  
    - Feasibility: 4 Yes, 2 No → Pass  
    - Track Record: 4 Yes, 2 No → Pass  
    - Fit: 4 Yes, 2 No → Pass  
  - **Outcome:** Funding approved (all criteria pass).  
  - **Minutes:** "Approved: Feasibility (4Y/2N), Track Record (4Y/2N), Fit (4Y/2N) all passed."  
  - **Response to complaint:**  
    > "Our rules require funding if all criteria pass. The committee judged all criteria met, so funding is automatic. The separate funding vote was discontinued to prevent logical inconsistencies. Feedback will cite specific criteria failures; here, none occurred."  

  **Case 2: Fit Criterion Split into Two**  
  - **Votes (e.g., Fit → Fit-A and Fit-B):**  
    - Feasibility: 4 Yes, 2 No → Pass  
    - Track Record: 4 Yes, 2 No → Pass  
    - Fit-A: 3 Yes, 3 No → Tie → Fail  
    - Fit-B: 5 Yes, 1 No → Pass  
  - **Outcome:** Funding rejected (Fit-A failed).  
  - **Why change?**  
    Splitting a criterion increases granularity. Here, Fit-A failed due to a tie, which wouldn’t have occurred under the broader original criterion. This exposes hidden dissent but aligns with the rule: **all** criteria must pass.  

  **Case 3: Unwelcome Outcome**  
  - **Scenario:**  
    - Feasibility: 0 Yes, 6 No → Fail  
    - Track Record: 6 Yes, 0 No → Pass  
    - Fit: 6 Yes, 0 No → Pass  
  - **Outcome:** Funding rejected (Feasibility failed).  
  - **Why unwelcome?**  
    Even if the project is brilliant (Track Record/Fit perfect), one critical flaw (Feasibility) sinks it. This feels harsh but enforces **rule consistency** and prevents "exceptions" that undermine feedback integrity.  

  ---

  ### Why This Works  
  - **Solves inconsistencies:** Premise-based aggregation avoids conflicts between criteria and funding votes.  
  - **Constrains chair:** Criteria approved by committee; voting is mechanical.  
  - **Handles real-world mess:** Abstentions/refusals are neutralized; strategic votes are visible.  
  - **Tradeoff:** We sacrifice "conclusion voting" (which caused problems) for logical coherence.  

  \answer{Premise-Based Voting}
