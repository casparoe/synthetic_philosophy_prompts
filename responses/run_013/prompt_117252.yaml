prompt: |-
  I chair the selection panel for our faculty's internal seed-funding scheme and I've hit something I can't figure out on my own. It's me plus five colleagues, we get through maybe thirty-five applications a year, each one between £15k and £40k, and everything is minuted because unsuccessful applicants are entitled to written feedback and about one in ten appeals. Our stated rule is that a project gets funded only if all three of the following hold: it's doable in the twelve months with the money asked for, there's a credible track record behind it, and it fits the aims the scheme was set up for. In practice we vote yes/no on each of the three criteria, then vote yes/no on the overall question of whether to fund, and up to now I'd always assumed those two votes would agree. Last month they didn't. Every one of the three criteria passed with four votes out of six, and the funding question failed three to two. I went back and forth on which number to write into the minutes and ended up writing the funding vote, but I genuinely don't know if that was right, and a member has since complained that the minutes now misrepresent the comittee's reasons. (I think the other direction — funding passing while a criterion fails — can't actually happen if everyone is internally consistent, but tell me if that's wrong.) Two other things have shaken my confidence. In March I reworded one criterion, splitting what had been a single 'fit with the scheme's aims' question into two separate ones, and a decision flipped as a result — same panel, same applications, same views, different answer. And one member has started saying they don't really engage with the criteria at all and just want to vote on the bottom line, while another insists the criteria are the whole point and the bottom-line vote is a formality. I'm not a philosopher; I did one term of political philosophy as an undergrad and that's the extent of it.

  What I want from you, as someone who actually knows the formal work on group decision-making and can also write for non-specialists, is a decision procedure I can run in a ninety-minute meeting and put in the chair's briefing pack on one page. It should tell me: the order of operations for taking votes, whether we take premise votes, a conclusion vote, or both, what to do when they come apart (and I want a rule, not 'use your discretion'), how to record the outcome so the minutes can't be accused of misrepresenting anyone, and how to word criteria before the meeting starts so that the wording can't be quietly doing the work. It needs to survive the things that actually happen to us: a member who abstains on a criterion they feel unqualified to judge, a member who votes strategically (I've watched someone vote yes on feasibility for a project they'd told me privately was unfeasible, and I'm fairly sure it was to help the overall outcome), a member who refuses to vote on the premises at all, a two-way tie, and me — the chair — being the one who decides what the criteria are and how they're worded, which I now realise is a lot of power and which I'd like the procedure to constrain rather than flatter. Say plainly which steps are mechanical and which are judgment calls in disguise, and tell me the failure modes: where will this procedure misfire, and what can it not do no matter how I set it up? If there's an impossibility result lurking here — some list of good properties no rule can have all of at once — I'd rather know which property we're giving up and why that one.

  Then run it on three cases. First, our March-style profile: six members, the three criteria each passing four to two, and the funding question failing three to two — walk me through exactly what the procedure outputs and what I say to the member who complained. Second, the same six members' views but with the third criterion split in two, showing what changes and why. Third, invent a case where your procedure tells me to do something I won't like — I don't know what that'll be, but I want to see one, because if the procedure never produces an unwelcome answer it isn't doing anything. Don't give me a reading list or citations, I won't follow them up; if you want to name a result or an idea, name it and explain it in a sentence. Think it through properly before you commit — sketch the candidate rules and what each does to case one, then pick one and defend the pick — and don't smooth over the parts where the formal literature and a real committee with tired members in a Tuesday afternoon meeting come apart. Finish with a final line of exactly the form \answer{...} containing only the short name I should give the default rule in the briefing pack, a few words at most.
reasoning: |-
  We are designing a decision procedure for a committee of six members (including the chair) evaluating grant applications based on three criteria: 
   C1: Feasibility (doable in 12 months with the money)
   C2: Track record (credible track record)
   C3: Fit with the scheme's aims

   The problem: 
   - Previously, they voted on each criterion (premises) and then on the overall funding (conclusion). 
   - They encountered a case where all three criteria passed (each 4-2) but the funding vote failed (3-2, with one abstention? note: 3 to 2 implies 3 in favor, 2 against, and 1 abstention? but the problem says "failed three to two", meaning 3 against and 2 in favor? Let me clarify: the funding vote failed 3 to 2, meaning 3 voted against funding and 2 in favor. Since there are six members, one must have abstained or not voted? The problem doesn't specify. We must account for abstentions.

   Requirements for the procedure:
   1. Must be runnable in a 90-minute meeting and fit on one page.
   2. Must specify: order of votes, whether to take premise votes and/or conclusion vote, what to do when they conflict, how to record the outcome, how to word criteria to avoid wording doing the work.
   3. Must handle: abstentions, strategic voting, a member refusing to vote on premises, ties, and the chair having the power to set criteria but the procedure should constrain that power.
   4. Must be transparent about which steps are mechanical and which are judgment calls.
   5. Must identify failure modes and any impossibility results (and which property is being sacrificed).

   Important observations:
   - The committee has encountered a situation where the premises (criteria) are individually satisfied (by majority) but the conclusion (funding) is rejected by majority. This is similar to the "discursive dilemma" in judgment aggregation.
   - The discursive dilemma shows that it is impossible to have a procedure that always satisfies three desirable properties: 
        a. Universal domain (any set of individual judgments is allowed)
        b. Rationality (the group judgment is consistent with the logical constraints, e.g., if all premises are true then the conclusion must be true)
        c. Systematicity (the group judgment on each proposition is determined by the individual judgments on that proposition via a fixed rule, e.g., majority)
     The typical impossibility result (e.g., List and Pettit) shows that no aggregation rule can satisfy all three.

   In practice, we must give up one. The current procedure uses majority on each proposition independently (systematicity) and allows any profile (universal domain) but then may produce irrational outcomes (as in the case where all criteria pass but funding fails). 

   Proposed approach:
   We want to avoid irrational outcomes. Therefore, we might give up systematicity. One common approach is to use a "premise-based" procedure: 
     - Vote only on the premises (the criteria). 
     - Then, if all premises pass (by the chosen voting rule, e.g., majority), then the conclusion (funding) is automatically passed. 
     - But note: what if a member thinks the premises are met but the project should not be funded for other reasons? The procedure must be defined to not allow other reasons. The criteria must be exhaustive.

   Alternatively, we could use a "conclusion-based" procedure:
     - Vote only on the conclusion (funding).
     - But then we lose the ability to give feedback on specific criteria.

   Given the requirement for written feedback on why an application failed (based on the criteria), the premise-based approach is more aligned.

   However, the problem states that the criteria are defined as necessary and jointly sufficient: 
     "a project gets funded only if all three of the following hold"

   Thus, by the committee's own rule, if all three criteria are satisfied, then the project should be funded. Therefore, the premise-based procedure (with the conclusion determined by the premises) would be consistent.

   But note: the current procedure has a separate vote on the conclusion. This is where the inconsistency arises.

   Revised procedure:

   Step 1: Before the meeting, the chair (with input from the committee) must define the criteria such that they are necessary and jointly sufficient. That is, the project is funded if and only if all criteria are satisfied. This constrains the chair: the criteria must be exhaustive and the only factors considered.

   Step 2: During the meeting, for each application:
     a. Vote on each criterion individually. Each member votes "yes", "no", or "abstain" on each criterion.
     b. The outcome for a criterion is determined by a majority of the non-abstaining votes. In case of a tie, the criterion fails (since it must pass for funding and we are being conservative). Alternatively, we could have the chair break ties? But to constrain chair power, let's have a tie mean failure.

     However, note: the problem requires handling abstentions and a member who refuses to vote on a premise. Abstention is effectively not voting. So for each criterion, we count only the votes cast (yes and no). If there is a tie, then the criterion fails.

   Step 3: The funding decision is then determined by the criteria votes: 
        Fund if and only if all criteria pass.

   Step 4: Do we need a separate vote on the conclusion? No, because by the rule, the conclusion is determined by the criteria. This avoids the inconsistency.

   But what about the member who wants to vote on the bottom line? We are not taking that vote. We are only taking the votes on the criteria and then deriving the conclusion. This satisfies the member who thinks the criteria are the whole point. The member who wants to vote on the bottom line might be unhappy. However, we can explain that the criteria are exhaustive and the rule is fixed: if all criteria pass, then funding passes.

   How to record the minutes:
     For each application, record the votes on each criterion and the resulting funding decision. For feedback to unsuccessful applicants, we can state which criterion (or criteria) failed. 

   However, what about the case where a criterion passes by majority but a member feels so strongly about a failing criterion that they would have voted against funding even if the other criteria are passed? This is the point of having a conclusion vote. But note: the rule says that if all criteria are satisfied, then the project should be funded. Therefore, any member who votes "no" on funding when all criteria are passed is not following the rule. The procedure must enforce the rule.

   But what if the criteria are not exhaustive? Then we have a problem. This is why Step 1 is critical: the criteria must be defined as both necessary and sufficient.

   How to word the criteria: 
     The chair must work with the committee to define the criteria so that they are clear and exhaustive. The criteria should be the only factors that matter. If there are other factors, they should be included as a criterion. 

   Handling strategic voting: 
     Under the premise-based procedure, strategic voting is still possible. For example, a member might vote against a criterion they actually believe is met in order to sink the project. However, this is harder to justify in feedback. The procedure does not eliminate strategic voting but makes it more transparent (because each vote is recorded per criterion).

   Handling a member who refuses to vote on the premises: 
     If a member refuses to vote on a criterion, that is treated as an abstention. The outcome for that criterion is then determined by the other votes. 

   Handling a two-way tie: 
     For a criterion, if the votes are tied (e.g., 3-3), then we count that criterion as failed. 

   The chair's role: 
     The chair sets the agenda and the criteria, but the criteria must be agreed upon as exhaustive. The voting is mechanical: the chair does not have discretion to override the votes on the criteria. The chair breaks ties only if the procedure specifies. We have specified that a tie in a criterion vote means failure, so no chair discretion there.

   Failure modes:
     - If the criteria are not exhaustive, then the premise-based procedure may fund a project that the committee feels should not be funded (for reasons outside the criteria) or fail to fund one that should be funded. Solution: careful formulation of criteria.
     - Strategic voting: a member may vote against a criterion they believe is true to block a project they dislike for other reasons. This violates the spirit but is hard to prevent. The minutes will record their vote, so they must be prepared to justify it in feedback.
     - Abstentions: if too many abstentions occur, then a criterion might be decided by a small number of votes. We accept that because we require a majority of non-abstaining votes.

   Impossibility: We are giving up the conclusion vote (which is a form of systematicity on the conclusion) to avoid irrationality. We are also giving up universal domain in the sense that we are forcing the conclusion to be consistent with the premises. But note: we are not restricting the domain of individual judgments; we are just aggregating only the premises and then deriving the conclusion. The individual judgments on the conclusion are not taken. 

   Now, run the three cases:

   Case 1: March-style profile (without the split)
     Six members, three criteria: 
        C1: 4 yes, 2 no -> passes
        C2: 4 yes, 2 no -> passes
        C3: 4 yes, 2 no -> passes
     Then by the rule, funding is approved.

     But in the original, the funding vote was 3 against, 2 in favor (and one abstention? or one absent? the problem says 3 to 2, so 3 against, 2 in favor -> fails). 

     Under our procedure, we do not take a funding vote. We derive the funding decision from the criteria. So we fund.

     What to say to the member who complained? 
        "The committee's rule states that a project is funded if it meets all three criteria. The committee voted that it met each criterion, so by the rule it must be funded. The separate funding vote was not taken because it is redundant under the rule and could lead to inconsistencies. The minutes record that the project was funded because it met all three criteria, and we will provide feedback accordingly to unsuccessful applicants by indicating which criteria they failed."

     Note: the member who abstained in the funding vote in the original might have been the one who caused the inconsistency. In our procedure, that member must vote on the criteria. If they abstain on a criterion, then that criterion might still pass by the votes of others.

   Case 2: The same six members but with the third criterion split in two.
     Suppose originally C3 was "fit with the scheme's aims". Now split into:
          C3a: fit with aim A
          C3b: fit with aim B

     Now we have four criteria: C1, C2, C3a, C3b.

     The project must pass all four.

     How do the votes go?
        We know that in the original, C3 passed 4-2. But now split, the votes on C3a and C3b might be different.

     Example: 
          Suppose the two members who voted against C3 now vote as follows: 
            One votes against C3a and for C3b.
            The other votes for C3a and against C3b.
          And the other four members vote for both C3a and C3b.

          Then:
            C3a: 5 yes (the four plus the one who split) and 1 no -> passes.
            C3b: 5 yes and 1 no -> passes.

          So the project passes.

     But what if the split causes one of the new criteria to fail?
          Suppose the two members who were against C3 now both vote against C3a but for C3b, and the other four vote for both.
          Then:
            C3a: 4 yes, 2 no -> passes (if majority of non-abstaining? yes, 4 out of 6 is majority).
            C3b: 6 yes -> passes.
          Still passes.

     Now suppose a different scenario: 
          The two members who were against C3 now both vote against C3a and against C3b. The other four vote for both.
          Then:
            C3a: 4 yes, 2 no -> passes.
            C3b: 4 yes, 2 no -> passes.
          Passes.

     But what if one member of the original four who voted for C3 now votes against C3a? 
          Suppose the votes on C3a: 
            3 yes (from the original four minus one) and 3 no (the two original against plus one from the original for) -> tie -> fails.
          Then the project fails because C3a fails.

     This shows that splitting a criterion can change the outcome. This is because the aggregation is done per criterion. 

     Why is this acceptable? 
          Because the criteria are supposed to reflect the necessary conditions. If the chair splits a criterion, it becomes harder to pass (because now two conditions must be passed instead of one). The chair must be cautious in splitting criteria and must ensure that the criteria are still necessary and that the set remains exhaustive.

     The procedure requires that the criteria are set before the meeting and are agreed upon. The chair should not change the criteria during the meeting without good reason and consensus.

   Case 3: A case where the procedure produces an unwelcome outcome.

     Example: 
          Suppose there is a project that is very strong on two criteria but weak on the third. The committee is split on the third criterion:

            C1: 6 yes
            C2: 6 yes
            C3: 3 yes, 3 no -> fails (tie)

          Therefore, the project is not funded.

          However, the chair and some members might feel that the project is so strong that it should be funded. But the rule says all criteria must pass. 

          This outcome is unwelcome but is a direct consequence of the rule and the tie-breaking. 

          What can be done? 
            - Change the tie-breaking rule? But we set it to fail on tie to be conservative and to avoid chair discretion.
            - Alternatively, the chair could have defined the criteria differently? But that must be done in advance.

          This failure mode is inherent: the procedure is mechanical and follows the rules. The only way to avoid it is to design the criteria and the voting rule appropriately.

          Another example: strategic voting.
            Suppose a member strongly opposes a project for reasons outside the criteria. They might vote against C1 even though they believe it is feasible. Then C1 fails and the project is not funded. The minutes will show that the project failed because of C1, and the feedback to the applicant will say that. But the applicant might have been misled. This is a risk.

          We accept this because we cannot prevent strategic voting, but the transparency of the vote might deter it (as the member must justify their vote if asked).

   Summary of the procedure:

     Name: Premise-Based Aggregation (PBA)

     Steps:

     1. (Before the meeting) The chair, in consultation with the committee, defines a set of criteria that are necessary and jointly sufficient for funding. The criteria must be clear and exhaustive. The rule is: the project is funded if and only if all criteria are passed.

     2. For each application:
          a. For each criterion, the committee members vote "yes", "no", or "abstain". 
          b. For each criterion, if the number of "yes" votes is greater than the number of "no" votes, the criterion passes. Otherwise (including ties), it fails.
          c. The project is funded if and only if all criteria pass.

     3. The minutes record:
          - The votes on each criterion (including abstentions)
          - The resulting funding decision
          - For unsuccessful applications, the criteria that failed (which will be the basis for feedback)

     4. There is no separate vote on the funding decision.

     Handling special situations:
        - Abstention: treated as not voting, so only yes and no votes count for majority.
        - Strategic voting: not prevented, but the votes are recorded and must be defensible.
        - Member refuses to vote on a premise: treated as abstention for that criterion.
        - Tie in a criterion: fails.
        - Chair's power: constrained to the definition of criteria, which must be done in advance and cannot be changed during the meeting without a full committee agreement (and ideally not during the evaluation of applications).

     Failure modes:
        - The criteria might not be exhaustive: then a project that meets all criteria might still be undesirable. Solution: careful formulation.
        - Splitting criteria can change outcomes: so the chair must be cautious and get agreement on the criteria set.
        - Ties cause failure: which might be too harsh for borderline projects. But it is conservative and avoids chair discretion.

     The procedure is mechanical except for the initial setting of the criteria (which is a judgment call) and the voting by members (which is their judgment). The aggregation is mechanical.

     Answer: Premise-Based Aggregation

     However, note: the problem says that one member doesn't want to vote on premises and just on the bottom line. Our procedure requires them to vote on premises. We can allow them to abstain on premises? But then they are not contributing to the criteria votes. Alternatively, we could have a rule that if a member refuses to vote on a criterion, they are recorded as abstaining. That is acceptable.

     But what if the member insists on a bottom-line vote? We have to explain that the procedure does not include that vote. We are using a premise-based procedure to ensure consistency and to provide feedback.

     Final note: the impossibility result (discursive dilemma) is avoided by not having independent aggregation on the conclusion. We are giving up systematicity for the conclusion to achieve consistency.

   The answer for the briefing pack: Premise-Based Voting

