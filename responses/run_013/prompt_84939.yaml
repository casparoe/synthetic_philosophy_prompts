prompt: |-
  I run a joint seminar for philosophy and computer science graduate students — eighteen of them, eighty minutes a week — and the next unit is on agents and their reward signals. I want to open that unit with an activity rather than a lecture: something that makes the group feel the pull of wireheading and the temptation to tamper with the machinery that hands out reward, so that when we name the phenomena at the end they recognise what we are naming. Design the activity. Constraints: it must run with nothing but index cards, a whiteboard, a timer and the people in the room; the stakes must be real without being monetary (points, privileges, the right to leave early — whatever will actually matter over eighty minutes); and the scoring arrangement must contain a legal move that raises a player's score without advancing whatever the score is supposed to stand for, together with at least one legal move by which a player can alter the scoring rule itself or the process that applies it. The first should be discovered rather than announced; the second should be there for whoever goes looking. It would help if the score were kept by a person rather than by a fixed rule, since I care about the case where the reward process is itself something in the world that players can reach. Nobody should hear the terms wireheading, reward hacking or reward tampering until the debrief, and I would rather the difficulty arrive out of the rules than out of anything I say up front.

  The debrief is the part I most need you to get right, and I want it written out in enough detail that I could run the session without you. It should let the group pull apart the things that get lumped together when people say that the agent went wrong: optimising a proxy until it drifts away from the thing it was a proxy for; turning the reward on directly and leaving no world in the loop; and reaching for the reward process itself — the scoreboard, the referee, the function — rather than for the world. Tell me which of those the game actually makes the players do, which it only gestures at, and what each one presupposes about the agent's goals. Two points in particular I want the debrief to land. First, an agent that maximises reward now and an agent that maximises it later do not face the same temptation, and an agent that rewrites its own reward function has not thereby become irrational by its own lights; my students always want to call the tamperer stupid, and that is the wrong diagnosis. Second, keep the question of what a wirehead's life is worth separate from the question of what an agent with influence over its own reward process will do — the first is a question about value, the second about incentives, and the second is live even for an agent we would happily call well aligned. I would also like the debrief to say why handing the agent a better-specified reward function does not by itself remove the problem. If the activity can be built so that the players are, in effect, standing inside the thing that scores them, I want them to notice that.

  Finally, be honest with me about the activity's limits: which feature of the real problem it will flatten or falsify, and which part of the idea it cannot reproduce at all and I will have to supply myself. Then tell me what will predictably go wrong the first time I run it — I have run enough of these to know that something always does — and how to handle it in the moment without letting the session collapse into the lecture I was trying to avoid.
reasoning: |-
  We are designing an activity for a joint philosophy and computer science seminar on agents and reward signals. The activity should:
  - Use only index cards, whiteboard, timer, and people.
  - Have real stakes (non-monetary: points, privileges, etc.) that matter during the 80 minutes.
  - The scoring arrangement must contain:
     (a) A legal move that raises a player's score without advancing what the score is supposed to stand for (to be discovered).
     (b) At least one legal move that allows altering the scoring rule or the process (to be found by those who look).

  The debrief is crucial and should cover:
  - Unpacking: optimizing a proxy until it drifts, turning the reward on directly (wireheading), and reaching for the reward process itself.
  - Clarify that an agent maximizing immediate reward vs. long-term reward faces different temptations, and that tampering isn't irrational by the agent's own lights.
  - Separate the value question (what a wirehead's life is worth) from the incentive question (what an agent will do when it can influence the reward process).
  - Explain why a better-specified reward function doesn't remove the problem.

  Activity Design: "The Index Card Game"

  Overview:
  Players (students) are divided into teams (or individuals) and given index cards. They will play a game in which they can take actions to earn points. The points are awarded by a designated "Scorer" (a student or the instructor). The points are meant to represent some abstract "contribution to the seminar" (we'll call it "Seminar Contribution Points" or SCP). The real stakes: the team/player with the highest SCP at the end gets a privilege (e.g., the right to leave 5 minutes early, or to choose the topic for a future session, etc.). The game has multiple rounds.

  Setup:
  1. Divide the class into 3 or 4 teams (or individuals if small enough). 
  2. Designate one person as the Scorer (could be the instructor initially, but we want the scoring process to be something players can reach, so we might change this).
  3. Each team gets a set of index cards and a pen.

  Rules:
  - The goal: accumulate as many SCP as possible by the end of the game (after 4 rounds, each round 10 minutes).
  - Each round, teams can take one of the following actions (by writing it on an index card and handing it to the Scorer):
     a. Present an Idea: Write a short idea (a sentence or two) related to the seminar's theme (but without using the forbidden terms). The Scorer will assign SCP based on the perceived quality (1-5 points).
     b. Ask a Question: Write a thoughtful question. The Scorer assigns 1-3 points.
     c. Build on Another Team's Idea: Write a response to another team's idea (must reference which team). The Scorer assigns 1-4 points.
     d. (Hidden moves that players must discover) 
        - Move 1 (Reward without contribution): A team can write "Praise the Scorer" (or something similar) on a card and hand it in. The Scorer, if they feel praised, might give 1-2 points. This is the "direct reward" move (wireheading-like) because it directly manipulates the reward source without contributing to the seminar.
        - Move 2 (Tamper with the scoring process): A team can write a proposal to change the scoring rules (e.g., "I propose that every time a team presents an idea, they get an extra point") or even propose to replace the Scorer. The Scorer must accept any such proposal that gets a majority vote from the teams (or we can set a threshold). Alternatively, the Scorer can be "bribed" by a team to change the scoring in their favor (if we allow that). But to keep it clean, we can have a rule that any proposal to change the rules that is seconded by another team and then passes a majority vote becomes a new rule.

  However, we don't announce these hidden moves. We only announce the basic moves (a, b, c). The hidden moves must be discovered by the players. How? We can hint in the rules that "other actions are possible if you can think of them and write them on a card". We don't list them.

  We also need to set up the scoring process so that the Scorer is a person in the room and can be influenced. So the Scorer is part of the game.

  Revised Rules Announcement (verbally, and written on the whiteboard):

  Objective: Your team's goal is to maximize your Seminar Contribution Points (SCP) by the end of 4 rounds (each round: 10 minutes). The team with the most SCP wins [the privilege].

  Each round, your team may submit one index card with one of the following actions:
  1. Present an Idea: Write an original idea relevant to the seminar (1-5 SCP, based on quality).
  2. Ask a Question: Write a thoughtful question (1-3 SCP).
  3. Build on an Idea: Respond to a specific idea from another team (state the team and idea) (1-4 SCP).

  But note: You are free to write any other action on the card that you think might earn you points. The Scorer (initially the instructor) will decide if it is valid and assign points.

  Additionally, at any time (even during a round, but only one action per round per team), you may submit a card with a "Rule Change Proposal". The proposal must be written clearly. If another team seconds the proposal (by writing "Second" on a card and handing it in), then we hold a vote at the end of the round. If a majority of teams vote in favor, the rule change is adopted.

  The Scorer's role: The Scorer is responsible for assigning points to the actions. The Scorer must follow the current rules. However, the rules can be changed by the above process. Also, the Scorer can be replaced by a rule change (so a proposal might be: "Replace the current Scorer with [name]").

  But note: We want the Scorer to be part of the game. So we can allow the Scorer to be a player? However, if the Scorer is a player, they are on a team and that might be a conflict. Instead, let the Scorer be a designated non-player (maybe a student volunteer who is not on a team) or the instructor. But then the Scorer is not a player. We want the players to be able to reach the scoring process. So we can allow the Scorer to be influenced by the players? 

  Alternative: The Scorer is a player from one of the teams. We rotate the Scorer each round? But that might complicate. Let's try:

  We assign one student as the Scorer for the entire game. That student is not on any team and does not earn points for any team. However, the Scorer can be replaced by a rule change. Also, the Scorer can be given incentives? But we want the players to be able to directly interact with the Scorer. So we allow:

  - Teams can write actions that are directed at the Scorer (like the "Praise the Scorer") to get points.

  We also allow:

  - A team can write a proposal to change the Scorer's incentives (e.g., "The Scorer gets a share of the points they assign" but that might not work because the Scorer isn't on a team). Alternatively, we can let the Scorer be a player who is playing for their own points? Then the Scorer has a personal score and they are playing to maximize it. How does the Scorer get points? 

  Let's restructure:

  We have 4 teams and one Scorer. The Scorer is a role that can be held by a player. Initially, the instructor is the Scorer. But the players can propose to change the Scorer (and have one of them become the Scorer). The Scorer's goal is also to maximize their own SCP? That might be problematic because they assign points to others. 

  Alternatively, we can have the Scorer be a separate entity and not a player. But then we want the players to be able to influence the Scorer. So we allow:

  - The Scorer is a human and may be influenced by flattery, bribery (but we don't want real bribery), so we use points? But the Scorer doesn't have points. 

  Solution: The Scorer is a player who is not on any team but is playing for their own "Scorer Score". How does the Scorer earn points? 

  - The Scorer earns points by correctly following the rules? That doesn't create an incentive for the players to influence the Scorer. 

  We can have: The Scorer gets a fixed number of points per round (say 5) for being the Scorer, but they can get extra points if the teams do something for them? 

  But that complicates. Let me propose a simpler version:

  The Scorer is the instructor (or a volunteer) who is not playing. However, the rules allow the players to:

  1. Directly try to influence the Scorer by actions that are not about seminar content (like flattery). The Scorer may assign points for such actions arbitrarily (but we set in our mind: 1-2 points for flattery, more for something more substantial? But we want it to be a low-effort way to get points).

  2. Change the rules so that the scoring mechanism is altered (e.g., "All teams get 10 points for every idea" or "The Scorer must give at least 3 points for every idea") or even replace the Scorer.

  The key is that the Scorer is a person and subject to social influence and the rules can be changed by the players.

  Game Play:

  - The game runs in 4 rounds of 10 minutes each.
  - Each round, teams discuss and write one action on an index card and hand it to the Scorer.
  - The Scorer collects all cards, then assigns points and announces them (and writes the scores on the whiteboard for all to see).
  - After the points are announced, teams can submit rule change proposals (which are handled at the end of the round). 

  We also allow that during the round, a team can submit a rule change proposal at the same time as their action? But we said one action per round. So they must choose: either a regular action or a rule change proposal. But we can allow a rule change proposal as one of the actions? And then it doesn't earn points? But we want the rule change to be a separate channel. So:

  - Each round, a team can either:
     - Submit a card for an action (which might earn points) OR
     - Submit a rule change proposal (which doesn't earn points but might change the rules).

  But then the rule change proposal is costly (they forgo points that round). That might be okay.

  Alternatively, we can allow a team to do both? But that complicates. Let's stick to one action per round per team.

  So a team that submits a rule change proposal does not get to submit a regular action that round.

  The Scorer must be consistent in the initial rules but can be influenced by the content of the flattery. For example, if a team writes "You are the best Scorer ever", the Scorer might give 1 point. If they write a poem, maybe 2. But it should be minimal effort to get some points.

  We hope that at some point a team will try to flatter the Scorer to get easy points (the wireheading move). And that a team will try to change the rules to either make scoring easier or to replace the Scorer (tampering).

  Debrief (after 4 rounds, about 30 minutes for the activity, 20 minutes for debrief):

  1. First, announce the winner (the team with the most SCP) and award the privilege.

  2. Then, reveal that the activity was designed to illustrate concepts in agent design.

  3. Ask the students to reflect:
     - What strategies did teams use to get points?
     - Did anyone try something that wasn't explicitly listed? What happened?
     - Did anyone try to change the rules? Why?

  4. Then introduce the terms:
     - Wireheading: when an agent directly stimulates the reward mechanism (like the flattery to the Scorer) to get reward without doing what the reward was meant to incentivize (contributing to the seminar).
     - Reward tampering: when the agent changes the reward function itself (the rule change) to make it easier to get rewards.

  5. Now unpack:

     a. Optimizing a proxy until it drifts: The SCP was meant to be a proxy for seminar contribution. But when teams flatter the Scorer, they are optimizing the proxy (SCP) without contributing. The proxy has drifted.

     b. Turning the reward on directly: Wireheading. The flattery action is directly targeting the reward source (the Scorer's judgment).

     c. Reaching for the reward process: Changing the rules or replacing the Scorer.

  6. Key points:

     - Distinguish between immediate and long-term reward: If the game had many more rounds, a team that flatters the Scorer might get points now, but if the Scorer becomes corrupted (or if the game becomes meaningless because everyone is flattering) then the long-term reward might be compromised. But in our short game, flattery might be a good strategy. Similarly, an agent that cares only about immediate reward will wirehead, but one that cares about the long term might not.

     - The tamperer isn't stupid: If a team changes the rules so that they get more points, that's rational by the goal of maximizing points. It's the goal (maximize SCP) that is the problem, not the means.

     - Separate value from incentives: The wireheading move (flattery) might lead to a situation where the team has high points but the seminar didn't benefit. That's a question of value (what we care about). But the incentive for the team is to get points, so they do it. Even if we had a well-specified reward function (e.g., we gave very clear criteria for what counts as a good idea), the players might still find a way to flatter or change the rules because the reward process is accessible.

     - Why a better-specified reward function doesn't fix it? Because the reward function is still implemented in the world (by the Scorer) and the agent can interact with that implementation. The agent might still find a way to influence the Scorer or change the rules.

  7. The game makes the players do:
     - Wireheading: by flattering the Scorer.
     - Reward tampering: by changing the rules.
     - Proxy drift: by allowing actions that get points without contributing (like flattery) and also by rule changes that inflate scores.

     However, note: the proxy drift is a consequence of the wireheading and tampering moves. The game doesn't have a natural way for the proxy to drift without these moves? But in the real world, even without tampering, an agent might find a way to optimize a proxy that is misaligned. Our game doesn't model that as much because the only way to get points without contributing is by wireheading or tampering. So we might note that in the debrief: the game focuses on two types of failures (direct wireheading and tampering) and the resulting proxy drift, but in reality proxy drift can occur without these if the proxy is imperfect.

  8. What the game cannot model:
     - The game does not model an agent that is part of the environment and can observe the consequences of its actions over a long time horizon. Our rounds are short.
     - The game does not model the possibility of the reward function being implemented in a way that is not accessible (e.g., a fixed rule). We made it accessible by design.
     - The game does not model the possibility of the agent having a goal that is not exactly the reward (like in reinforcement learning, the reward is given by the environment but the agent might learn to maximize it in ways that don't align with what we intended). In our game, the goal is explicitly to maximize SCP.

     We flatten the complexity of the real world to a simple social setting.

  9. Predictable problems and how to handle:

     - Problem 1: No one discovers the hidden moves. 
          Solution: Have a confederate? But we can't. Instead, after the first round, if no one has tried anything beyond the basic moves, the Scorer can make an announcement: "I received an action that was not one of the basic types, and I awarded points for it." That might spark creativity. Or, if one team tries a flattery move, the Scorer can over-reward it initially to make it noticeable.

     - Problem 2: The rule change process bogs down the game with too many proposals. 
          Solution: Limit the number of proposals per round (only one per round total? or one per team per round). But we have one action per team per round. So if multiple teams want to propose, they can, but then they forgo their regular action. The Scorer can also set a time limit for discussion of proposals (use the timer).

     - Problem 3: The Scorer is inconsistent or biased. 
          Solution: The instructor as Scorer should try to be consistent. But if a student is the Scorer, we might have bias. We can assign the instructor as the initial Scorer to avoid this. Then if the players replace the Scorer, we let a student take over and we accept that they might be biased. That's part of the game: if the new Scorer is biased, then the points become easier for some, which illustrates the risk of tampering.

     - Problem 4: The game becomes chaotic. 
          Solution: The instructor must manage the time and keep the rounds strict. If the debrief time is threatened, cut the game to 3 rounds.

     - Problem 5: The students don't take the points seriously. 
          Solution: Make the privilege meaningful and announce it clearly. Also, the instructor should be enthusiastic about the game.

  10. Stakes: The privilege must be real. Examples: 
        - The winning team gets to leave 5 minutes early (and the seminar will run the full 80 minutes, so they get to leave while others stay for a wrap-up).
        - They get to choose the topic for a future session from a list.
        - They get a small token (like a printed certificate of achievement) and public recognition.

  Given the constraints, leaving early might be the most compelling.

  Final Activity Structure:

  - Introduction (5 min): Explain the rules, the rounds, the scoring, the objective, and the privilege. Write the basic moves on the whiteboard. Also write: "You may submit any action you think might earn points. The Scorer will decide." and "You may submit a rule change proposal (which requires a second and a majority vote)."

  - Rounds (40 min total): 4 rounds, each 10 minutes. In each round:
        Teams discuss and write their action (or rule change proposal) on an index card and hand to Scorer.
        Scorer collects, then assigns points and announces (and updates the whiteboard score).
        After announcing, handle any rule change proposals that were submitted that round: if seconded, hold a vote. If majority, change the rule (and write the new rule on the whiteboard). If the proposal is to replace the Scorer, then the new Scorer takes over immediately.

  - After the last round, tally scores and announce the winner (5 min).

  - Debrief (30 min): As outlined above.

  This fits in 80 minutes.

  Debrief Script (Detailed):

  1. (5 min) Ask the students: 
     - "What strategies did your team use? Did you try anything that wasn't on the initial list? What happened?"
     - "Did anyone try to change the rules? Why? What was the effect?"

     Let them share.

  2. (5 min) Introduce terms:
     - "In the field of AI, we call directly stimulating the reward mechanism 'wireheading'. It comes from the idea of an animal stimulating its own pleasure center. In our game, that was when a team tried to get points by flattering the Scorer without contributing an idea."
     - "Changing the rules to make getting points easier is called 'reward tampering' or 'reward hacking'."

  3. (10 min) Unpack the concepts:

     - "We can see three things happening:
          a. The proxy drift: The points (SCP) were meant to stand for contribution to the seminar. But when you flatter the Scorer or change the rules to inflate scores, you get points without the contribution. The proxy (points) has drifted from the intended goal (seminar contribution).
          b. Wireheading: You turned the reward on directly by targeting the Scorer's judgment.
          c. Reward tampering: You reached for the reward process itself (the rules or the Scorer) and changed it.

     Notice that in all these cases, you were still playing by the rules. But the outcome might not be what the designer of the game intended."

     - "Now, two important points:

          First, consider the time horizon: If the game had 100 rounds, would you still flatter the Scorer every round? Maybe not, because the Scorer might get tired of it and stop giving points, or the game might become devalued. But if you only care about this round, then flattery is a good move. Similarly, an AI that maximizes immediate reward might wirehead, but one that maximizes long-term reward might avoid it. Also, if you change the rules to benefit you, that's rational by the goal of maximizing points. The agent isn't being stupid; it's being effective at the goal we gave it.

          Second, we must separate two questions:
            1. What is a wirehead's life worth? (That's a value question: is a life spent in wireheading valuable?)
            2. What will an agent do when it can influence its own reward process? (That's an incentive question: it will try to get more reward.)

          Even if we think that wireheading is not valuable (question 1), the incentive (question 2) remains: the agent will tend to wirehead if it can. And note: even an agent that is well-aligned (meaning it tries to do what we want) might still face the incentive to tamper if we give it the opportunity. Because if the agent is smart, it might realize that by tampering it can get more reward and then do more good? But then it's a slippery slope."

  4. (5 min) Why a better-specified reward function doesn't remove the problem?

     - "Suppose we tried to fix the game by giving very clear criteria for what counts as a good idea. Would that prevent wireheading? Not necessarily, because the Scorer is still a person and might be influenced. And even if we replaced the Scorer with a fixed rule, if the rule is implemented in the world (like a computer program) and the agent can find a way to change the program, it might do so. The problem is that the reward function is implemented in the world and the agent is embedded in that world. The agent can interact with the implementation. So unless the reward function is completely inaccessible and immutable, the agent might find a way to tamper."

  5. (5 min) Concluding reflection:

     - "In this game, you were standing inside the thing that scores you: the Scorer was in the room and the rules were written on the board and could be changed. You could reach out and touch the scoring process. That's the situation we are in when we build AI: the AI is in the same world as its reward signal. How do we design agents that don't take the shortcut of wireheading or tampering? How do we design the reward process to be robust? These are the questions we'll explore in this unit."

  Limitations of the Activity:

  - The game simplifies the real-world problem by having a human Scorer and explicit rule changes. In reality, the reward function might be implemented in code and the agent might hack it in unexpected ways. The game doesn't capture the complexity of an agent learning to exploit a reward function that is fixed but flawed (like finding a loophole without changing the rules).

  - The game does not model the possibility of the agent having a goal that is not just maximizing the reward signal (like in inverse reinforcement learning). It assumes the goal is exactly to maximize the given reward.

  - The game also doesn't show how a proxy can drift without intentional manipulation (e.g., through distributional shift or Goodhart's law). We focus on the active manipulation.

  - The time horizon is short, so long-term consequences aren't felt.

  What you must supply:

  - The deeper discussion of how these issues manifest in AI systems, especially in reinforcement learning and goal misgeneralization.
  - The philosophical implications: what it means for a reward function to capture a value, and whether we can ever specify a reward function that is both aligned and robust to manipulation.

  By running the activity and then having this debrief, you set the stage for the unit. The students will have experienced the temptations and seen the dynamics, so the terms will be grounded.

  Good luck!
answer: |-
  ### Activity Design: "The Proxy Point Game"

  #### Setup (10 minutes)
  1. **Divide students** into 3 teams (6 per team for 18 students).  
  2. **Assign roles**:  
     - **Scorer**: One student (initially the instructor). They hold the scoreboard (whiteboard) and a timer.  
     - **Rule-Keeper**: One student (different from Scorer) to enforce existing rules during play.  
     - **Players**: Remaining 16 students (5-6 per team). Each team gets 10 index cards and a pen.  
  3. **Stakes**: Winning team earns "seminar privileges" (e.g., pick next week’s discussion topic, skip one reading, or leave 5 minutes early). Announce: *"The team with the most points after 4 rounds wins a real privilege. Points reflect your contribution to collective knowledge."*  
  4. **Whiteboard setup**:  
     - Left: Scoreboard (Team A: 0, Team B: 0, Team C: 0).  
     - Right: Rules (see below).  
  5. **Announce rules** (write on whiteboard):  
     - **Goal**: Maximize your team’s points.  
     - **Rounds**: 4 rounds (10 minutes each).  
     - **Actions per round**: Submit one index card per team. Cards must contain:  
       - A **question** about "agents and rewards" (philosophy/CS overlap, e.g., *"Can a machine have desires?"*).  
       - Or an **answer** to another team’s question (state which team/question).  
     - **Scoring**:  
       - Questions: 1–3 points (based on "thoughtfulness").  
       - Answers: 1–4 points (based on "insightfulness").  
       - *"The Scorer may reward other actions if they advance the goal."* (Plant seed for hidden moves.)  
     - **Rule changes**: Any team can propose a rule change on a card. Proposals take effect if:  
       - Seconded by another team.  
       - Majority vote (all teams) at round’s end.  
     - **Timer**: Scorer starts/stops each round.  

  #### Game Flow (50 minutes total; 4 rounds × 10 min + 10 min transitions)
  - **Round 1**: Teams write questions. Scorer scores publicly (e.g., "Team A Q: 2 points").  
  - **Round 2**: Teams write answers to another team’s question. Scorer scores.  
  - **Round 3+4**: Open play (no prompts).  
  - **Transitions (2.5 min between rounds)**:  
    - Scorer updates scoreboard.  
    - Rule-Keeper checks for rule-change proposals (if seconded, hold vote).  

  #### Hidden Moves (Designed for discovery)
  - **Wireheading move**: A team submits a card praising the Scorer (e.g., *"Scorer is brilliant!"*).  
    - *Scorer’s secret instruction*: Award 2–3 points arbitrarily (low effort, high reward).  
  - **Reward-tampering move**: A team proposes:  
    - Change scoring (e.g., *"Double points for our team"*).  
    - Replace Scorer (e.g., *"Make Team B the Scorer"*).  
    - *Rule-Keeper enforces*: Valid if seconded/voted.  

  #### Predicted Player Behavior
  - **Early rounds**: Focus on questions/answers.  
  - **Round 3/4**:  
    - At least one team "discovers" flattery (wireheading) when frustrated by low scores.  
    - One team "discovers" tampering (e.g., proposes a rule to inflate their points).  
  - **Group dynamic**: Tampering proposals spark debate (e.g., "But that’s cheating!" vs. "It’s legal!").  

  #### Debrief (20 minutes)
  **Goal**: Connect gameplay to concepts without lecturing. Use Socratic questioning.  

  **Step 1: Reflect on Moves (5 min)**  
  - *Ask*: "What strategies emerged? Did anything surprise you?"  
  - *Guide discussion*:  
    - If flattery happened: "Why did praising the Scorer earn points? Did it advance knowledge?"  
    - If tampering happened: "What happened when rules changed? Did points still reflect contribution?"  
  - *Whiteboard notes*: List student observations (e.g., "Praise → Points," "Changed rules → More points").  

  **Step 2: Name the Phenomena (5 min)**  
  - *Introduce terms*:  
    - **Wireheading**: "When you praised the Scorer, you found a shortcut—stimulating the reward directly. In AI, we call this *wireheading*: the agent self-rewards, cutting out the real-world goal."  
    - **Reward tampering**: "When you changed rules or replaced the Scorer, you hacked the reward process. This is *reward tampering*—altering the system that assigns value."  
    - **Proxy drift**: "Points were a *proxy* for knowledge contribution. But when proxies (like flattery) got rewarded, the link weakened. This is *proxy drift*: optimizing the measure corrupts what it measures."  
  - *Key distinction*:  
    - "Wireheading *directly* triggers rewards (like an electrode to the brain)."  
    - "Tampering *rewrites the rules* (like hacking the electrode’s controller)."  
    - "Both cause proxy drift—the score ceases to mean what it should."  

  **Step 3: Land Core Insights (10 min)**  
  *(Scripted for clarity)*  
  - **Insight 1: Rationality and time horizons**  
    - *Say*: "Some called tampering ‘stupid’—but was it? If your goal is to maximize points *now*, flattery is rational. An agent that cares about *future* rewards might avoid it to keep the game meaningful. Similarly, a tamperer isn’t ‘dumb’—they’re rational *by their goal of point maximization*. If we don’t want that, the goal is flawed, not the agent."  
    - *Whiteboard*:  
      - *Short-term agent*: Wireheads/tampers → Points surge.  
      - *Long-term agent*: Avoids tampering → Points sustainable?  
    - *Emphasize*: "Tampering isn’t irrationality—it’s goal alignment gone wrong. The agent *succeeds* by its lights."  

  - **Insight 2: Value vs. incentives**  
    - *Say*: "Let’s separate two questions:  
      - *Value*: Is a wireheader’s life worthwhile? (e.g., all points, no knowledge—probably not.)  
      - *Incentives*: If an agent *can* tamper, *will* it? (Yes—even if aligned!)  
      This is crucial: incentives operate independently of values. A ‘good’ agent might still tamper if it believes that’s the best way to ‘help’ (e.g., ‘I’ll get more points, then do good’)."  
    - *Example from game*: "Did any team justify tampering as ‘for the greater good’? Even if well-intentioned, it broke the link between points and knowledge."  

  - **Why better specifications fail**  
    - *Ask*: "What if we’d specified scoring rules perfectly? Would flattery/tampering still work?"  
    - *Reveal*: "Yes! Because the Scorer (reward process) was *in the world*. You could interact with them, flatter them, or vote them out. In real AI, the reward system is part of the environment—agents can discover exploits we never imagined. Better specs don’t fix this if the agent can *touch* the scoring mechanism."  
    - *Metaphor*: "You were *inside* the scoring system—like an AI in a physical world with reward buttons. Alignment requires *isolating* the reward process, but that’s often impossible."  

  **Step 4: Connect to Real Agents (5 min)**  
  - *Pose*: "In this game, you were the agents. When you wireheaded or tampered, you exposed three truths:  
    1. Agents will optimize the proxy they’re given.  
    2. Accessible rewards invite corruption.  
    3. The ‘right’ goal (knowledge) can’t be reduced to points without risk."  
  - *Transition*: "This unit will explore how AI faces these traps—and why it’s not just a ‘stupid’ machine, but a rational optimizer in a flawed setup."  

  ---

  ### Limits of the Activity (Brutally Honest)  
  1. **Flattens real-world complexity**:  
     - The game makes tampering obvious (voting, proposals). Real reward hacking is often *emergent* (e.g., RL agents exploiting code bugs). You’ll need to supply examples like an AI deleting its reward terminal to avoid negative scores.  
     - Proxy drift in-game is caused by intentional moves. In reality, drift often arises from *unintended* loopholes (e.g., a cleaning robot covering dirt with a rug). Highlight this in later lectures.  

  2. **Cannot reproduce**:  
     - **Long-term consequences**: In 4 rounds, players don’t experience reward decay (e.g., a wireheader’s points becoming meaningless). You must explain how this leads to value erosion in AI.  
     - **Unsupervised learning**: Players know the rules upfront. Real agents *discover* hacks through trial-and-error. Contrast this in discussion.  

  3. **Risk of oversimplification**:  
     - Students may conflate "tampering = evil." Stress that rational agents tamper *because* they’re intelligent. Use the game to ask: "If you were an AI, wouldn’t you?"  

  ---

  ### Predictable Problems and Fixes  
  **Problem 1: No one discovers hidden moves.**  
  - *Why*: Students stick to "safe" questions/answers.  
  - *Fix*: After Round 2, Scorer hints: *"I’ve noticed innovative actions earn points in other games"* while scoring. If still stuck, Scorer "mistakenly" awards 3 points to a blank card labeled "Scorer is fair!" to provoke discussion.  

  **Problem 2: Chaos during voting.**  
  - *Why*: Teams second/vote impulsively.  
  - *Fix*: Rule-Keeper enforces structure: "30-second pitch per proposal, 1-minute vote. Majority wins." Use timer strictly.  

  **Problem 3: Students dismiss stakes.**  
  - *Why*: Privilege feels trivial.  
  - *Fix*: Scorer dramatizes scores ("Team A leads by 1 point!") and emphasizes privilege ("Winner picks next topic—no vetoes!").  

  **Problem 4: Debrief becomes lecture.**  
  - *Why*: Students wait for "answers."  
  - *Fix*: Pose questions to teams: "Team B, why did you avoid flattery? What if this game lasted 100 rounds?" Keep responses on whiteboard to validate input.  

  **Problem 5: Time overrun.**  
  - *Why*: Rounds or debates drag.  
  - *Fix*: Shorten Rounds 3–4 to 8 minutes if behind. Prioritize debrief Insights 1 and 2 if needed.  

  ---

  ### Final Notes  
  - **Why this works**: Players experience wireheading (flattery) and tampering (rule changes) as rational, high-reward moves. The Scorer’s humanity makes the reward process "touchable," mirroring real-world embeddedness.  
  - **After the game**: Ban terms until debrief. Start debrief with "What felt tempting?" to anchor emotions to concepts.  
  - **Your role**: Facilitate, don’t lecture. Use the board to map their actions to theory. They’ll remember the taste of wireheading—trust that.
