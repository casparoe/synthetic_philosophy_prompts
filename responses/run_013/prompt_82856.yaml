answer: |-
  ### Path Dependence Simulation: "The Convention Game"  
  **Designed for a 90-minute upper-level seminar | 20 students | 4 tables of 5 students each**  

  ---

  #### **Core Learning Goals**  
  - Students experience **path dependence from the inside**: the tension between contingency (outcome could have been different) and perceived inevitability (outcome feels determined by rational forces).  
  - Key concepts emerge experientially: **increasing returns**, **lock-in**, **inefficient vs. merely different outcomes**, **contingency vs. functional convergence**, and the **counterfactual problem**.  
  - **No mention of "path dependence" until debrief**. Students articulate the tension first.  

  ---

  #### **Materials**  
  1. **Convention Cards**: 5 types (A, B, C, D, E) per table. Each card displays a nonsense symbol (e.g., △, ◯, □, ☆, ⧫) to avoid semantic associations.  
     - *Per table*: 10 copies of each card (to allow switching).  
  2. **Player Tally Sheets** (1 per student): Track convention held, payoff per round, and cumulative score.  
  3. **Table Tally Sheet** (1 per table, managed by Recorder): Grid to record all players’ conventions and payoffs each round.  
  4. **Chronicle Slips** (1 per table post-game): For writing 3-sentence explanations.  
  5. **Stopwatch/timer** for rounds.  

  ---

  #### **Setup (5 min)**  
  1. Divide students into 4 settlements (tables) of 5.  
  2. Assign roles per table:  
     - **4 Players**: Hold conventions, make decisions.  
     - **1 Recorder**: Tallies conventions, calculates payoffs, enforces rules (rotate if needed).  
  3. Distribute materials:  
     - Each *Player* starts with one unique convention card (A–E).  
     - Each *Player* gets a **Tally Sheet**.  
     - *Recorder* gets **Table Tally Sheet** and a deck of spare convention cards.  

  ---

  #### **Rules (Read Aloud to Class, 5 min)**  
  > "You are settlers establishing a shared convention (e.g., a technology, norm, or practice). Your goal: maximize personal points over 8 rounds.  
  > **How to play**:  
  > 1. **Simultaneous Reveals**: Each round, players *silently* choose to **keep** or **switch** their convention. To switch, trade your card for a new one from the deck.  
  > 2. **Information Restriction**: You may only see the cards of **two neighbors** (left/right). *No table-wide communication.*  
  > 3. **Payoff Calculation**:  
  >    - Base points = # of players in your settlement holding your convention *this round*.  
  >    - If you switched this round, subtract a **switching cost** (2 points).  
  >    - **Round 5 update**: The convention with the *fewest holders at your table* at the start of Round 5 pays **double points** for Rounds 5–8.  
  > 4. **Recorder’s Job**:  
  >    - Collect cards, tally conventions, announce *only* individual payoffs (e.g., "Player 3: 4 points").  
  >    - *Do not announce table-wide totals or which convention is doubling.*  
  > 5. **No talking or coordination**. Decisions are individual."  

  ---

  #### **Payoff Table & Critical Numbers**  
  - **Base Payoff** = Number of holders of your convention.  
  - **Switching Cost** = 2 points (subtracted if you switch).  
  - **Discovery Bonus** (Rounds 5–8): Double points for the convention with fewest holders *at start of Round 5*.  
  - **Why these numbers?**  
    - Switching alone is punished: Switching to a convention with 1 holder → 1 (base) - 2 (cost) = -1 (worse than keeping).  
    - Coordinated switching rewarded: If all 5 switch together → 5 - 2 = 3 points each (vs. 1 if all keep different conventions).  
    - **Discovery twist**: If the minority convention doubles, *coordinated* switching to it pays (e.g., all 5 switch → [5×2] - 2 = 8 points), but *individual* switching fails (e.g., 1 switcher → [1×2] - 2 = 0).  

  ---

  #### **Round-by-Round Timeline (Total: 20–25 min)**  
  - **Rounds 1–4** (2 min/round):  
    1. Players silently choose to keep/switch.  
    2. Recorder collects cards, tallies conventions on Table Sheet.  
    3. Recorder calculates payoffs (using rules) and whispers them to each player.  
    4. Players record payoffs on Tally Sheets.  
    5. Recorder returns cards.  
  > *After Round 4*: Recorder identifies the convention with fewest holders (use alphabetical tie-breaker if tied). Announces: **"Starting next round, one convention at your table pays double points. It is the one with fewest holders right now."**  

  - **Rounds 5–8** (2 min/round):  
    - Repeat above, applying double points to the "discovery" convention.  

  - **After Round 8**:  
    1. Recorder announces final convention distribution at the table.  
    2. Players calculate total scores.  
    3. Appoint a **Chronicler** (not Recorder) to write:  
       > *"Three sentences explaining why [table’s majority convention] won. Do not reference specific players or rounds."*  
       *(Example: "△ won because it was easiest to adopt early on. Once a few people used it, others joined for higher rewards. By Round 5, switching was too costly.")*  

  ---

  #### **Chronicle Guessing & Re-run (10 min)**  
  1. Collect chronicles, shuffle, and read aloud.  
  2. Class guesses which table each chronicle belongs to.  
  3. **Re-run contingency (if time)**:  
     - Pick one table. Shuffle and redistribute conventions.  
     - Replay 4 rounds (no discovery twist). Compare outcomes.  

  ---

  #### **Debrief (30 min)**  
  **Start with student observations**:  
  > *"What did you notice? When did you feel stuck? What surprised you?"*  

  **Map experiences to concepts**:  
  | **What happened**          | **Concept**                          | **Philosophical Question**                                                                 |  
  |----------------------------|--------------------------------------|--------------------------------------------------------------------------------------------|  
  | Early switches changed outcomes | **Contingency**                  | *"Could things have gone differently? How do we know if it was luck vs. necessity?"*       |  
  | Payoffs increased with adoption | **Increasing returns**           | *"Does ‘more popular’ mean ‘better’? Or just self-reinforcing?"*                           |  
  | Hard to switch after Round 4   | **Lock-in**                      | *"Why can’t we escape suboptimal outcomes even when we know they’re suboptimal?"*          |  
  | Discovery convention wasn’t always adopted | **Inefficient outcome**      | *"Is inefficiency objective? Or is ‘better’ only defined in hindsight?"*                  |  
  | Chronicles sounded plausible regardless | **Narrative bias**         | *"Can we trust post-hoc stories? Do they confuse causality with hindsight?"*               |  
  | Re-run produced different outcomes | **Counterfactual problem** | *"Historians can’t rerun the world. How do we judge contingency without experiments?"* |  

  **Address QWERTY briefly**:  
  > *"We all know the keyboard story. But note: some argue QWERTY wasn’t inefficient, just different—which highlights today’s point. Was your ‘discovery convention’ truly better? Or did we just define it that way?"*  

  ---

  #### **Predictable Failure Modes & Fixes**  
  1. **Public coordination attempts**:  
     - *Risk*: Players whisper, "Let’s all pick △!"  
     - *Fix*: Pause and restate: **"No talking. Your neighbors are your only information source."** Penalize by deducting 5 points.  

  2. **Collapse to majority by Round 2**:  
     - *Risk*: Players abandon conventions early to join the biggest group.  
     - *Why it’s okay*: This *is* path dependence! Lock-in happens fast. Use in debrief: *"Did your outcome feel inevitable? Could it have been different if one person switched earlier?"*  

  3. **Recorder errors**:  
     - *Risk*: Miscounting conventions or payoffs.  
     - *Fix*: Simplify tally sheets. Have players double-check payoffs silently.  

  4. **Discovery convention ignored**:  
     - *Risk*: No one switches to the doubling convention due to high switching costs.  
     - *Why it’s okay*: Illustrates lock-in and coordination problems. Ask: *"Why didn’t you switch? Was it fear of being alone?"*  

  5. **Chronicles reference rules**:  
     - *Risk*: "△ won because it got doubled."  
     - *Fix*: Clarify: **"Explain why it won *from the settlers’ perspective*, not game mechanics."**  

  ---

  #### **Limitations (Facilitator Notes)**  
  > **Explicitly state these in debrief**:  
  > - **"Better" is defined by the designer**: In this game, I decided which convention paid double. In real life, "better" is contested (e.g., QWERTY efficiency debates). Path dependence isn’t just about inefficiency—it’s about whether "best" even exists independently of the path.  
  > - **No losers**: Real path dependence creates winners and losers (e.g., Betamax adopters). Here, players don’t lose everything—they just score lower.  
  > - **We can rerun history**: Historians can’t test contingency by replaying worlds. Our re-run is a luxury they lack.  
  > - **Perfect information problem**: Players knew the payoff rules. In reality, returns and costs are often unknown.  

  ---

  #### **Timeline Summary**  
  - Setup + Rules: 10 min  
  - Rounds 1–8: 25 min  
  - Chronicles + Guessing: 10 min  
  - Re-run (optional): 10 min  
  - Debrief: 30 min  
  - Buffer: 5 min  

  **Total**: 90 min  

  This design forces students to confront the "accident vs. inevitability" tension experientially. By the debrief, they’ll feel the frustration of not knowing if their outcome was necessary—and grasp why philosophers care.
