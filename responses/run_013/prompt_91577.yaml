prompt: |-
  Late in a career in physical chemistry I began noticing a pattern that I suspect philosophy has a name for, though I have not seen it stated in the form I have in mind. Set a higher-level feature that plainly does explanatory work — the temperature of a sample, the acidity of a solution, the fitness of a trait — beside the lower-level facts that realize it. Fix the lower-level facts, and the higher-level feature stops adding anything: the coarse description is redundant once the fine one is in hand. Yet we go on explaining and intervening at the coarse level, and nobody concludes that temperature is causally idle, even though it is redundant in precisely this way. Some writers, however, seem to treat such redundancy as proof that a higher-level feature — consciousness, say — does no causal work; applied uniformly, the same argument would strip causation from most of the sciences. Is there an established name for the redundancy itself, and separately for the inference from redundancy to causal idleness? What are the nearest named ideas, and how does the received discussion carve the territory differently from my description? A bare label will not satisfy me: I want to know what the described thing is and is not, where its edges lie, and which of the nearby notions fits it best.
reasoning: |-
  Okay, the user is a physical chemist who's noticed a recurring pattern in scientific explanations. They're pointing out that higher-level properties like temperature or acidity seem redundant once you have all the lower-level molecular details. Yet scientists still find these higher-level concepts useful for explanation and intervention. 

  Hmm, what's really bothering them is how some philosophers use this redundancy to argue that consciousness or other emergent properties are causally idle. That must feel frustrating—seeing a tool you use daily in chemistry being weaponized against phenomena you consider real. 

  The core tension they're describing is between reductionism and emergence. In chemistry, they know temperature isn't "just" molecular motion—it's a thermodynamic gateway for predictions and control. But philosophers like Kim push reductionism further, demanding causal exclusion. 

  I should clarify: the redundancy they observe is multiple realizability (temperature exists across different microstates) plus explanatory pragmatism (we use coarse descriptions because they're efficient). But causal exclusion arguments wrongly equate redundancy with epiphenomenalism. 

  Their unspoken concern might be defending the reality of emergent phenomena against overzealous reductionism. They want philosophical tools to push back against claims that consciousness isn't causal. 

  Notably, they reject simple labels—they want nuanced boundaries. So I'll contrast supervenience vs realization, distinguish causal exclusion from explanatory exclusion, and emphasize pragmatic indispensability. 

  The example of interventions is key: we cool reactors by lowering temperature, not by tracking individual molecules. That pragmatic efficacy matters more than metaphysical arguments about "real" causality. 

  They'd probably appreciate Dennett's "real patterns" and Jackson/Pettit's program explanations—frameworks where higher-level properties remain causal despite supervenience. And Cartwright's pluralism showing why reductionism often fails in practice. 

  Must stress: redundancy ≠ idleness. Temperature's causal power comes from its relational stability across microstates—exactly what makes it reducible yet indispensable. Consciousness could work similarly. 

  Their frustration with philosophers stems from seeing a valid observation (redundancy) twisted into invalid conclusions (epiphenomenalism). Need to validate their intuition while sharpening the terminology.
answer: |-
  You've articulated a profound tension at the heart of reductionism, emergence, and causation in science and philosophy. The pattern you observe is widely recognized, though terminology and interpretations vary. Here's a breakdown of the key concepts, their boundaries, and the relevant debates:

  ### 1. **The Core Redundancy: Supervenience with Multiple Realizability**
     - **What it is:** The higher-level property (temperature, pH, fitness) *supervenes* on the lower-level state (molecular kinetic energy, H⁺ ion concentration, genetic variation). Fixing the lower-level state *necessitates* the higher-level state, but the same higher-level state can be *multiply realized* by many different lower-level states.
     - **Name:** **Supervenience** (Donald Davidson, Jaegwon Kim). Crucially, this is typically **multiple realizability** (Hilary Putnam, Jerry Fodor).
     - **Edges and Nuances:**
       - **Not Identity:** Temperature ≠ mean kinetic energy; it can be realized by different particle configurations/systems (e.g., ideal gas vs. plasma).
       - **Not Mere Correlation:** Supervenience implies dependency: no change at the higher level without a change at the lower level.
       - **Not Downward Causation (yet):** The redundancy implies that lower-level states *fix* higher-level properties, but doesn't resolve whether higher-level properties have independent causal power.

  ### 2. **The Inference from Redundancy to Causal Idleness: Causal Exclusion**
     - **What it is:** If a lower-level state (L) fully causally determines an outcome (O), and a supervenient higher-level property (H) is fixed by L, then H appears redundant. Any apparent causal work by H is "preempted" by L.
     - **Name:** **The Causal Exclusion Argument** (most associated with **Jaegwon Kim**).
     - **Kim's Formulation:**
       1. *Closure of Physics:* Physical effects have sufficient physical causes.
       2. *Supervenience:* H supervenes on L (e.g., mental states on neural states).
       3. *Exclusion:* If L is sufficient for O, then H cannot be a separate cause of O without overdetermination.
       4. *Conclusion:* H is causally inert ("epiphenomenal").
     - **Edges and Nuances:**
       - **Applies Uniformly:** As you note, this would threaten *all* special sciences (biology, chemistry, economics) if accepted.
       - **Overdetermination Worry:** Kim rejects systematic overdetermination (two *independent* causes for the same effect) but allows that H and L may not be independent. His argument targets non-reductive physicalism.

  ### 3. **Why Your Examples Defy the Inference: Explanatory Pragmatics & Interventionism**
     - **The Disconnect:** Kim's exclusion argument conflates *causal sufficiency* with *causal exclusivity*. Your examples show higher-level properties are:
       - **Explanatorily Indispensable:** We explain metal fatigue with temperature, not particle trajectories.
       - **Indispensable for Intervention:** We cool reactors by lowering temperature, not by micromanaging molecules.
     - **Key Concepts:**
       - **Explanatory Exclusion ≠ Causal Exclusion:** Even if L *underlies* H, H can be the *proximate cause* in an explanatory model (Peter Railton, Philip Kitcher).
       - **Interventionist Causation (James Woodward):** H is causal if intervening on H (while holding fixed *other* higher-level variables) changes O. Temperature passes this test; holding pressure constant, changing temperature changes volume.
       - **Pragmatic Virtues:** Higher-level properties provide *computational tractability*, *stability across realizations*, and *counterfactual robustness* (Daniel Dennett's "Real Patterns," Frank Jackson & Philip Pettit's "Program Explanation").

  ### 4. **Established Rebuttals to Causal Exclusion**
     - **Non-Reductive Physicalism:**
       - **Realizationism (Carl Gillett):** H is *realized by* L but has causal powers *in virtue of* its structural/organizational properties, not despite them.
       - **Meso-Level Causation (Nancy Cartwright):** Causes operate at specific scales; quarks don't cause traffic jams.
     - **Emergence (Weak Emergence):** Higher-level properties have *autonomy* due to constraints, feedback loops, or collective dynamics (Mark Bedau). Temperature *constrains* particle motion.
     - **Mechanistic Explanation (Carl Craver):** Higher-level variables (e.g., action potentials) are *components* in multi-level mechanisms; they play causal roles within their context.

  ### 5. **Nearest Named Ideas & Territory Carving**
     | **Concept**              | **Relation to Your Observation**                                                                 | **Divergence**                                                                 |
     |--------------------------|--------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
     | **Supervenience**        | Captures dependency: fixing low-level fixes high-level.                                          | Neutral on causation; doesn't resolve redundancy tension.                      |
     | **Multiple Realizability**| Explains *why* H is redundant given L, yet stable across L-variants.                             | Doesn't address causal efficacy.                                               |
     | **Causal Exclusion**     | Formalizes the inference you reject (redundancy → idleness).                                     | Assumes causal closure + anti-overdetermination; contested in special sciences.|
     | **Program Explanation (Jackson & Pettit)**| H "programs for" O by ensuring *some* L-state causes O, even if L varies.                    | Distinguishes *causing* vs. *ensuring* causation; H explains O's inevitability.|
     | **Mechanistic Causation**| H is causal if it's a manipulable component in a mechanism.                                       | Focuses on how levels integrate, not compete.                                  |
     | **Explanatory Fundamentalism** | The view you criticize: only fundamental levels are causal.                                   | Ignores explanatory pragmatics and intervention efficacy.                      |

  ### Why Philosophers Disagree
  The "received discussion" often splits between:
  - **Reductionists/Hard Exclusionists (Kim, David Papineau):** Argue causal power resides *only* at the fundamental level; higher levels are "mere shadows."
  - **Non-Reductionists (Ned Block, Terence Horgan):** Maintain higher-level properties are causal *if they figure in laws or reliable generalizations*.
  - **Pragmatists (Dennett, Woodward):** Reject metaphysics-first approaches; causation is tied to explanatory contexts and interventions.

  ### Conclusion
  Your observation epitomizes the **causal exclusion problem** applied to **multiply realizable, supervenient properties**. The redundancy is best described as **supervenience with multiple realizability**, while the inference to causal idleness is **causal exclusion**. Crucially, most scientific practice implicitly rejects this inference by embracing **explanatory pluralism** and **interventionist causality**. The higher-level property isn't redundant *causally*—it captures *invariant relations* that are projectible, intervenable, and indispensable for prediction/control, even if metaphysically dependent on lower levels. Consciousness debates often founder by ignoring how chemistry or biology successfully navigates this tension.
