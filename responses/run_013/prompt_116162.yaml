answer: |-
  ## The Welder's Knot: A Dialogue on Knowing-How

  **Characters:**
  *   **Alex (Intellectualist):** Believes knowing-how is fundamentally a species of knowing-that (propositional knowledge).
  *   **Sam (Anti-Intellectualist/Rylean):** Believes knowing-how is a distinct, non-propositional state – fundamentally an ability or complex disposition.

  **(Setting: University common room after a seminar)**

  **Sam:** Alex, I keep circling back to Kasia. She *knows-how* to feel a failing weld. But she *doesn't know-that* any accurate proposition describing *how* she does it. Her verbal rules are wrong! How does your "it's all propositions" view handle that? It's pure ability, manifest in action, not in correct statements.

  **Alex:** Hold on, Sam. Just because she can't articulate the *correct* proposition doesn't mean she lacks propositional knowledge. Think about implicit knowledge. She might know-that *a specific pattern of sensory feedback (heat differential? vibration frequency?)* correlates with imminent failure. She grasps that fact *practically*, through her trained perception and motor skills. Her verbal failure shows a lack of *theoretical* or *descriptive* knowledge about *why* it works, not a lack of the underlying *practical* knowledge-that guiding her action.

  **Sam:** But Alex, that "practical grasp" *is* the ability! You're smuggling the ability *back in* as a "mode of presentation" for your proposition. What *is* this "practical mode" if not the disposition to act skillfully? When she feels that specific feedback pattern, she *just acts* – she doesn't consult an internal sentence. The knowing *is* the reliable disposition triggered by the situation.

  **Alex:** Maybe, but here's the hypnosis wrinkle. Under hypnosis, or if you trick her about the tool, the ability vanishes. Poof. She *cannot* detect the failing weld. But according to you, the disposition *is* the knowledge. So, has the knowledge vanished? If the disposition is gone, the know-how is gone, right?

  **Sam:** Not necessarily! Think of a skilled pianist with tied hands. The *ability to play* is masked, but the knowledge-how isn't *gone*. It's still there, latent. The disposition is *present but interfered with*. Hypnosis or the tool deception is like tying Kasia's epistemic hands. It introduces a defeating condition – it disrupts the normal coupling between her perception and her action, blocking the manifestation of the disposition. The knowledge, the dispositional state, remains intact.

  **Alex:** Ah, the "masked disposition" dodge! But Sam, how is that *not* just an empty label you invoke whenever the ability fails? What evidence *could* possibly show the disposition is *actually gone* rather than merely masked? If the ability is absent, and you *always* say "Oh, it's just masked," then "disposition" becomes unfalsifiable. It explains everything and nothing. With Kasia hypnotized, what observable difference is there between "disposition masked" and "disposition destroyed"?

  **Sam:** Fair challenge. Evidence? Look at the *speed and nature of recovery*. If it's truly masked, removing the interfering condition (hypnosis, the false belief about the tool) should *immediately* restore the ability, like untying the pianist's hands. If the disposition were *destroyed* – say, by brain damage – recovery would require re-learning, practice. Kasia snaps right back, doesn't she? That rapid return points to the underlying dispositional structure being preserved, merely blocked. Destruction implies a need for reconstruction.

  **Alex:** Hmm, the recovery speed is a good point. But let me push back on a different front: gradability. Kasia knows-how to weld *better* than she knows-how to do pipefitting. She's better at welding than her colleagues. How does propositional knowledge-that come in degrees like that? I either know that Paris is the capital of France, or I don't. I might be more *confident*, but the knowledge itself isn't "better" or "worse." Abilities clearly *are* gradable – you can possess them to greater or lesser degrees.

  **Sam:** Exactly! Abilities admit of refinement, fluency, nuance – degrees of skill. That's intrinsic to their nature. Propositional knowledge is binary, all-or-nothing. Knowing-how's gradability is a mark of its distinctness.

  **Alex:** Not so fast. Couldn't "knowing-how better" just mean possessing a *richer, more complex set* of true propositional knowledges? Kasia might know-that *more subtle variations* in feedback correlate with failure, know-that *more precise adjustments* are needed for different joint types, know-that *faster recognition patterns* apply. Her superior welding know-how *is* her superior grasp of this intricate network of practical propositions. The "degree" reflects the scope and complexity of the propositional set she possesses.

  **Sam:** But Alex, that feels like post-hoc redescription! You're taking the *manifestation* of the skill – the fine-grained discrimination and action – and *imagining* a correspondingly fine-grained set of propositions she "knows." But Kasia demonstrably *doesn't* know the propositions that *accurately describe* her actions! She gives false rules. Your "rich set" seems inferred from her ability, not constitutive of it. Isn't "practical mode of presentation" just a fancy way of saying "the ability component I can't reduce away"?

  **Alex:** It's not *just* the ability! It's the specific *cognitive architecture* implementing the ability. The "practical mode" is how the propositional content is encoded and processed – not as a verbal theory, but as sensorimotor schemas, pattern recognition routines. The hypnosis case is key here: It disrupts *that specific mode of access* to her knowledge. It doesn't destroy the underlying encoded information (the propositions about feedback-failure correlations), but it blocks her *ability to utilize it* in that practical, embodied way. The knowledge-that *remains*, but its *practical deployment mechanism* is disabled. That's why the ability vanishes while the knowledge (in one sense) persists.

  **Sam:** So you're cleaving "knowledge-that" from its *use*? That seems odd. If she possesses the proposition but cannot *use* it to guide action in the relevant context, can she truly be said to "know how" at that moment? Isn't the capacity for use *part* of what it means to know-how? Your "practical deployment mechanism" sounds suspiciously like... an ability. You've just relocated the irreducible ability *inside* the propositional system as a "mode." I still think the core state is the reliable, gradable disposition to perform.

  **Alex:** And I still think you risk making "disposition" a black box that explains nothing. But let's locate the disagreement. Is it about Kasia *under hypnosis*? You say she *still knows-how* (disposition masked). I say she temporarily *lacks* the know-how because the specific cognitive state enabling its practical deployment is disrupted, though the underlying informational content might remain stored.

  **Sam:** Agreed. And the evidence hinges on interpretation: Does rapid recovery point to preserved disposition (masked), or merely rapid re-access to stored propositions? The gradability point stands as a challenge: Can your "richer proposition set" account *really* capture the fluid, non-inferential nature of increasing skill without just mapping the ability's contours? And fundamentally: Is the "practical mode of presentation" a genuine component of propositional knowledge, or is it an admission that ability can't be fully propositionalized?

  **Alex:** Conversely, Sam, is "masked disposition" a substantive explanatory concept, or just a label for when the ability isn't manifesting? And can your dispositional view adequately explain why Kasia *fails* under hypnosis without smuggling in *something* about her cognitive state being altered – a state that isn't *just* the disposition, but what *grounds* it?

  **Sam:** So, we're stuck on ontology: Is knowing-how fundamentally a *state* with propositional content (however accessed), or is it fundamentally a *dispositional property* of the agent? And the hypnosis case tests the resilience of each view under interference. We agree Kasia has know-how when welding normally. We agree she lacks the *manifest ability* under hypnosis. The fight is over what persists: Is it the core propositional content (Alex), or the core disposition (Sam), masked by the hypnosis?

  **Alex:** Precisely. And the resolution might lie in getting clearer on what "the self" or "the agent" *is* in the dispositional view when we talk about masking. What part of Kasia is the disposition *attached to* that persists unchanged? Is it her brain? Her body schema? Her identity as a welder? Your view needs that anchor. Mine needs the anchor of stored, even if non-verbally accessible, informational content. The disagreement is sharper, but the ground is rockier.

  **Sam:** Rockier, but at least we've dug past the toddler points. Progress? Maybe not agreement. But the fault lines are clearer. Next time: What *is* this "self" that holds dispositions or propositions when the usual abilities are offline? Pass the coffee. This isn't over.

  **Alex:** (Raises mug) Never is. To Kasia, and her inconveniently hypnotizable know-how.
