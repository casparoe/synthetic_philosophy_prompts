  I gave — that this is close to a category mistake — is the thing I want tested. My claim is that the play only looks like a whodunit about a priest because Sister Aloysius forces her religious certainty into the grammar of evidence and procedure; on a Wittgensteinian reading, the real drama is what happens when a form of life that is not answerable to evidence is put on trial by a form of life that is. I want you to act as a philosopher of religion with a specialist's command of Wittgenstein's Lectures on Religious Belief, On Certainty, and the surrounding secondary discussion, and to think carefully before you commit to a line.

  Please begin by brainstorming the different ways a Wittgensteinian could take the play — at least three — and say which one you think is strongest and why. Then give me a sustained reading with the following components. First, explain the relevant Wittgensteinian apparatus in your own terms: the idea that religious belief is not a hypothesis, that it is more like a picture that regulates a life than a proposition that competes for evidential support, that the believer and the superstitious person are not the same figure, and that doubt in a religious life presupposes a form of life in which the doubted thing has a place. Second, apply this to the play scene by scene where it matters: the opening sermon about doubt as a bond as powerful and sustaining as certainty; the confrontations in Aloysius's office; the scene with Mrs. Muller; Sister James's wavering between suspicion and innocence; and the final scene, where Aloysius admits she has doubts and is comforted by Sister James. Third, and this is the part I care most about, say where the reading fails. Does the play actually stage a Wittgensteinian point, or does it stage a conventional mystery and leave the audience to supply the philosophy? Is Sister Aloysius's final doubt religious doubt, or the collapse of the form of life that made her certainty possible — and does the play know the difference? Is Sister James's 'innocence' a form of religious life or a failure of moral perception? And what does the play contribute to the philosophical debate that the Lectures don't already say?

  Write this for someone who is preparing a seminar on the play and Wittgenstein and will have to defend the reading in front of a skeptical colleague. Do not give me a bibliography or citations; I'll fill those in myself. Assume no internet access. Do not quote the play or Wittgenstein verbatim; paraphrase. Aim for the kind of reading that is faithful in both directions — it shouldn't reduce the play to an illustration of Wittgenstein, and it shouldn't bend Wittgenstein to make the play come out looking philosophical."
