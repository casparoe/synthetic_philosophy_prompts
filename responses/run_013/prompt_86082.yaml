  First, I need to unpack their examples: contract law binding future selves, advance directives for dementia patients, and organ sale bans citing harm to "different" future selves. The core tension is whether institutions consistently view identity as persistent or stage-based.

  Hmm, the contract example suggests institutions treat identity as continuous - that signature at 18 genuinely obligates the 48-year-old. But the organ sale ban's "different person" argument implies a stage-based view where future selves can be distinct. That's interesting - same legal system using conflicting metaphysical assumptions when convenient.

  I recall Parfit's psychological continuity theory might resolve this. Perhaps institutions care less about strict identity and more about psychological connections. For contracts, we assume sufficient future psychological links to hold obligations. For organ sales, we worry when future selves might lack continuity with present decision-makers. 

  The advance directive case is especially tricky. We enforce them against "changed" dementia patients, prioritizing past autonomy over present preferences. This privileges psychological connectedness to the past self over current welfare - almost the opposite of the organ sale logic. 

  Realistically though, institutions probably don't consciously adopt any theory. They evolve practical solutions: contracts enable social cooperation, advance directives address dementia dilemmas, organ bans prevent exploitation. The "different person" language in organ debates might just be rhetorical - a convenient way to express concern for future welfare without metaphysical commitment.

  For their paper, I should emphasize that practices reveal not theoretical consistency but context-dependent priorities: autonomy in contracts, welfare in organ sales, precedent autonomy in directives. The rival theories license similar rules as long as they value psychological connections or future wellbeing similarly.
answer: |-
  Your analysis of institutional tensions around personal identity is astute. These practices reveal deep, often conflicting presuppositions about persistence over time. Here’s a reconstruction of the implicit theories, their tensions, and compatible philosophical frameworks:

  ### 1. **Contract Law & Advance Directives: Endurantist Leaning**
     - **Presupposition:** A single persisting entity (*you*) exists continuously from contract signing to enforcement (or from directive creation to medical implementation).  
     - **Mechanism:**  
       - *Contracts* bind future selves because they are *you* – obligations attach to the identical person across time.  
       - *Advance directives* prioritize the autonomous past self over the present self’s changed preferences, implying the *past you* has authority over the *future you* as the same entity.  
     - **Compatible Theories:**  
       - **Endurantism** (you wholly exist at each time, numerically identical).  
       - **Substance Dualism** (an immutable soul guarantees identity).  
       - **Psychological Continuity** (if construed as *strong* continuity, e.g., Lockean persistence through overlapping memories/plans).

  ### 2. **Organ Sale Ban: Perdurantist/Stage-Theory Leaning**
     - **Presupposition:** The "future self" bears harm is meaningfully distinct from the "present self" who benefits.  
     - **Mechanism:**  
       - The ban treats the future self as a *different moral patient* who did not consent. This resonates with viewing persons as temporal parts (*stages*).  
       - Harm to a future stage isn’t fully compensated by benefits to a prior stage if they lack robust psychological ties.  
     - **Compatible Theories:**  
       - **Perdurantism** (you are a 4D "spacetime worm" composed of temporal parts).  
       - **Stage Theory** (only momentary stages exist; "identity" is a relation between stages).  
       - **Bodily Continuity** (if future harm targets a *physically altered body* seen as distinct).

  ### The Tension: Autonomy vs. Welfare Across Time
  - **Contract/Directives** prioritize **past autonomy** of a numerically identical self.  
  - **Organ Ban** prioritizes **future welfare** of a potentially distinct self.  
  - **Inconsistency?** Institutions *never formally commit to a metaphysics*. Instead, they adopt **pragmatic fictions**:  
    - When enforcing contracts/directives, they *pretend* we endure identically.  
    - When preventing rash organ sales, they *pretend* future selves are "others" to protect them.  

  ### Rival Theories Licensing the Same Rules
  1. **Psychological Continuity (Parfitian Reductionism)**  
     - *Same rules possible:*  
       - Contracts bind if future self is *psychologically continuous* (e.g., maintains goals/memories).  
       - Advance directives hold if dementia *severs psychological continuity* with the past self.  
       - Organ sales banned if future self lacks continuity (e.g., due to trauma/regret), making consent irrelevant.  
     - *Why?* Focuses on connections (memory, intention) rather than strict identity.

  2. **Narrative Identity**  
     - *Same rules possible:*  
       - Contracts honor the life-story commitment.  
       - Directives preserve the narrative arc (e.g., "dignified exit").  
       - Organ ban protects the integrity of the future life-narrative from present exploitation.  
     - *Why?* Identity is a constructed story; institutions preserve coherent self-narratives.

  3. **Conventionalism (Humean)**  
     - *Same rules possible:* Institutions define identity-conventions contextually:  
       - Legal identity endures for contracts.  
       - Medical identity fragments for organ sales.  
     - *Why?* Identity is a bundle of perceptions; society chooses useful conventions.

  ### Key Philosophical Insight
  - **Parfit’s Relevance:** His claim that "identity isn’t what matters" explains the tension. Institutions care about:  
    - **Relational facts** (psychological connectedness, future suffering).  
    - **Social utility** (enforcing promises vs. preventing irreversible harm).  
  - **Resolution?** Practices don’t require metaphysical consistency. They reflect:  
    - **Moral caution** (protecting vulnerable future stages).  
    - **Practical necessity** (honoring past commitments for social order).  

  ### Conclusion for Your Paper
  The institutions reveal a **dialectic without resolution**: they invoke *endurance* when binding future selves (upholding autonomy) but invoke *stage-distinctness* when protecting future selves (upholding welfare). No single theory of identity is strictly presupposed; instead, rules emerge from **competing ethical priorities** (autonomy, beneficence, non-maleficence) applied to different temporal relations. Rival theories like Parfitian reductionism or narrative identity can justify the same practices by emphasizing *what matters* (connections, stories) over numerical identity. The inconsistency isn’t in metaphysics but in the values institutions prioritize across time.
