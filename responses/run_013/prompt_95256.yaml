prompt: |-
  I am a software engineer with no formal training in philosophy, but for the past several months I have been reading around the debate over markets in things that many people find repugnant — selling a kidney, selling a vote, price-gouging during a shortage — and I keep noticing that the two sides are not really disagreeing about facts. They are disagreeing about what a theory in this area is even supposed to explain, and nobody ever writes that part down. Before I read another argument, I would like the specification itself: the desiderata that any adequate theory of repugnance — an account of when an exchange is objectionable in itself, as opposed to merely harmful or unfair — has to satisfy. For each requirement, give me the case or consideration that motivates it, and say whether it is a genuine constraint on any such theory or merely a prejudice of one camp. I am most interested in where the demands pull against one another, so please flag any pair you suspect cannot be jointly satisfied; if the list itself shows that no single theory can meet all of it, that is the result I want to see, more than any scorecard of which contender does best.

  A handful of puzzles keep tripping me up, and you may treat them as constraints I want the theory to handle. First, the pattern of permission seems unpredictable: we forbid paying for a kidney yet allow payment for plasma and for genuinely dangerous work, and we are untroubled by paying someone to move our furniture but many people recoil at paying someone to be our friend. Second, the repugnance is usually felt by people who are not party to the exchange at all, and sometimes the very people we claim to be protecting say they would gladly take the deal, so a theory has to say something about whose reaction counts and why. Third, whatever signal the feeling carries has plainly misfired before — plenty of arrangements we now accept were once widely found degrading — so a theory cannot simply treat repugnance as evidence of a real wrong, yet it also cannot wave it away as mere disgust without explaining why some of our revulsion tracks something real and some does not. Fourth, I have read that paying for a thing can sometimes reduce how much of it people are willing to provide, and I want to know whether a theory has to accommodate that or may file it under empirical footnote. No reading list or citations, please — I want the criteria and the reasoning behind them. Write the answer in American English.
reasoning: |-
  Okay, the user is a software engineer diving into philosophy, specifically the ethics of repugnant markets. They've noticed that debates aren't about facts but about what a theory should explain. They want a clear set of desiderata for any theory of repugnance, with cases that motivate each requirement, and to see where these requirements conflict. They also have four specific puzzles.

  First, I need to unpack their request. They want the specification for a theory of repugnance—what makes an exchange objectionable in itself, not just harmful or unfair. The desiderata should be clear criteria, each motivated by a real case, and I should note if it's a genuine constraint or a camp's bias. Highlighting conflicts between desiderata is crucial; if they're incompatible, that's a valuable insight.

  Their puzzles: unpredictable permissions (e.g., kidneys vs. plasma), third-party repugnance vs. participant consent, historical misfires of repugnance (like past taboos now accepted), and whether crowding-out effects (paying reduces supply) must be included. These should inform the desiderata.

  Now, thinking about the user's deeper needs. As a software engineer, they might be used to formal specifications and clear requirements. They're frustrated by unstated assumptions in philosophical debates. They want a structured framework to evaluate theories, not just more arguments. Unspoken needs: clarity to cut through jargon, practical applicability (since they're action-oriented), and maybe a way to reconcile logic with moral intuition in their own work or life.

  For the desiderata, I'll draw from common philosophical positions without citations. Start with core constraints any theory must handle, based on their puzzles. For example:  
  - **Non-Derivativeness**: Repugnance isn't just about harm/unfairness; e.g., kidney sales feel wrong even if safe. Motivated by their first puzzle.  
  - **Scope Determination**: Why some exchanges (friendship) are repugnant but similar ones (furniture moving) aren't. This addresses unpredictability.  
  - **Third-Party Authority**: Whose reaction counts? Outsiders often object, but participants might consent. Cases like kidney sellers vs. voters show tension.  
  - **Fallibility**: Repugnance isn't always right (historical changes), so a theory can't blindly trust it. E.g., past disgust at interracial marriage.  
  - **Crowding-Out Accommodation**: Must the theory explain how payment can reduce supply? E.g., blood donations dropping when paid. They want to know if this is core or optional.  

  Now, conflicts:  
  - **Consent vs. Societal Judgment**: If participants consent (e.g., kidney sellers), why do outsiders override them? This pits autonomy against collective values.  
  - **Fallibility vs. Reliability**: How can repugnance be fallible yet sometimes track real wrongs? Hard to distinguish "valid" vs. "invalid" disgust without circularity.  
  - **Crowding-Out**: If a theory must include it, it might overcomplicate; if optional, it ignores a real effect.  

  Also, some desiderata might be camp-specific. E.g., "Commodification" is key for anti-market views but contested by economists who see markets as neutral tools.  

  For the answer structure: List each desideratum with a short name, case, motive, and constraint type. Then group conflicts. End with synthesis: likely no single theory satisfies all, showing the debate's depth.  

  Ensure language is American English: avoid British spellings, keep it conversational but precise. No citations—focus on reasoning.  

  Finally, reassure that the incompatibilities are the point; they want to see why the debate persists. That's the "result" they seek.
answer: |-
  Below is a specification of desiderata for a theory of "repugnant markets"—i.e., an account of why certain exchanges are deemed intrinsically objectionable (not merely harmful, risky, or unfair). Each requirement is motivated by a core puzzle or case, labeled as **Constraint** (if essential to *any* adequate theory) or **Prejudice** (if it reflects a camp-specific bias). Conflicts between desiderata are flagged explicitly. Your four puzzles are integrated throughout.

  ---

  ### **Desiderata for a Theory of Repugnance**  
  *(Sorted by foundational constraints, then tensions)*

  1.  **Non-Derivativeness**  
      **Motivation:** Kidney sales are banned even if regulated to be safe, fair, and mutually beneficial. Yet dangerous jobs (e.g., logging) or plasma donation are permitted. A theory must explain why kidney sales feel *inherently* wrong, not just derivatively harmful.  
      **Constraint:** Essential. The theory must isolate intrinsic wrongness from contingent harms.

  2.  **Scope Determination**  
      **Motivation:** Paying for friendship feels repugnant; paying for furniture-moving does not. Yet both involve "services." A theory must define the *boundaries* of what can permissibly be commodified (treated as a market good).  
      **Constraint:** Essential. Without this, the theory cannot predict which exchanges trigger repugnance.

  3.  **Third-Party Authority**  
      **Motivation:** Outsiders object to vote-selling even if voter and buyer consent. Conversely, participants in "repugnant" exchanges (e.g., kidney sellers) often defend them. A theory must explain why non-participants' judgments override consent.  
      **Constraint:** Essential. The theory must justify whose reactions matter and why (e.g., societal norms vs. individual autonomy).  
      **Conflict:** Tensions with **Participant Primacy** (see below).

  4.  **Fallibility & Social Evolution**  
      **Motivation:** Past societies found interracial marriage or bank lending repugnant; most now reject this. Yet some repugnance (e.g., toward slavery) tracks enduring wrongs. A theory must distinguish "reliable" repugnance from obsolete prejudice without circularity.  
      **Constraint:** Essential. The theory cannot treat repugnance as infallible moral intuition.

  5.  **Crowding-Out Accommodation**  
      **Motivation:** Paying for blood donation can reduce supply (vs. voluntary giving), as in some empirical studies. But is this a *cause* of repugnance or a side effect?  
      **Prejudice:** Optional. Economists often treat this as empirical; philosophers may see it as signaling corruption of motive.  
      **Conflict:** Risks conflating intrinsic wrongness with instrumental harms.

  ---

  ### **Tensions & Likely Incompatibilities**  
  These desiderata create fault lines. No theory satisfies all without trade-offs:

  -   **A. Consent vs. Societal Judgment**  
      - *Requirement:* **Participant Primacy** (Prejudice): If both parties consent and understand consequences, the exchange is permissible (e.g., a poor kidney seller claiming autonomy).  
      - *Conflict:* Clashes with **Third-Party Authority**. If society can override consent, the theory must justify when/why without paternalism.  
      - *Sticking Point:* Vote-selling—individuals may consent, but society bans it to protect democracy. Which value trumps?

  -   **B. Universality vs. Relativism**  
      - *Requirement:* **Cross-Cultural Anchors** (Constraint): The theory must identify objective wrongs (e.g., slavery) while accommodating cultural variation (e.g., dowries).  
      - *Conflict:* Undercuts **Fallibility**. If repugnance evolves, how can anything be universally repugnant? Historical "errors" imply no stable anchor.  
      - *Case:* Surrogacy is accepted in some cultures, repugnant in others. Is there a fact of the matter?

  -   **C. Harm-Independence vs. Crowding-Out**  
      - *Requirement:* **Intrinsic Wrongness** (Constraint): Repugnance must persist even if harms are eliminated (e.g., safe, regulated kidney markets).  
      - *Conflict:* **Crowding-Out Accommodation** focuses on consequences (e.g., paying reduces altruism). If the theory requires this, it risks reducing repugnance to instrumental harm.  
      - *Case:* Paying for friendship might "crowd out" genuine care, but is *that* why it feels wrong?

  - **D. Emotion vs. Principle**  
      - *Requirement:* **Anti-Squeamishness** (Prejudice): Disgust (e.g., toward organ sales) is not a moral argument; the theory must provide rational principles.  
      - *Conflict:* **Fallibility** demands this, but **Scope Determination** requires explaining why disgust tracks *some* truths (e.g., necrophilia) but not others (e.g., homosexuality).  
      - *Sticking Point:* If repugnance is fallible, what non-emotional criterion distinguishes valid from invalid objections?

  ---

  ### **Synthesis: Why No Theory Satisfies All**  
  Your core insight is correct: **the debate is about what counts as an "explanation."**  
  - **Pro-Market Camp** treats repugnance as irrational unless linked to harm/unfairness (prioritizing **Participant Primacy**, **Anti-Squeamishness**).  
  - **Anti-Market Camp** sees repugnance as protecting social goods like dignity (prioritizing **Third-Party Authority**, **Scope Determination**).  

  **The irreconcilable tension:** A theory must both take repugnance seriously (**Fallibility**, **Third-Party Authority**) and subject it to rational scrutiny (**Anti-Squeamishness**, **Participant Primacy**). But if repugnance is fallible (**Constraint #4**), no internal feature reliably marks it as "correct." External principles (e.g., autonomy, human dignity) must be invoked—and those are precisely what the camps dispute. Worse, **Third-Party Authority** and **Participant Primacy** cannot both be fully satisfied: one always overrides the other.  

  **Result:** No theory meets all constraints without privileging some desiderata as foundational (and thus exposing its prejudices). The specification itself reveals why the debate persists: it’s about which values (consent, dignity, fairness, social stability) a theory *should* explain, not just how it explains them.
