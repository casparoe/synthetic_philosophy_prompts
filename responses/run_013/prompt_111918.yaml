  Biggest technical hurdle: crafting case 3's "pain absent is good" and case 4's "pleasure absent is not bad" with near-identical syntax. Need to choose the pivot word carefully - probably "nobody" vs "someone" or similar. The rhythm must match beat-for-beat so the difference is purely lexical.

  Also important: avoid making case 4 feel like "nothing." Even without deprivation, the absence should have presence in the poem. Maybe use parallel negation structures? 

