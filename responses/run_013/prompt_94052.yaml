  ### Analysis of R* and Unrestricted Reflection

  The principle R* proposes that the Reflection principle should be restricted to cases where the future self is an "evidential successor" (i.e., differing only due to new evidence and its logical consequences). In non-evidential cases—such as a pill that improves calibration without adding or removing evidence—R* holds that no deference is required, even as a coherence requirement. Ada's case illustrates this: she knows her credence will shift from 0.9 to 0.6 due to a pill that improves calibration, but she cannot adopt 0.6 voluntarily. This setup tests whether unrestricted Reflection (deference to any certain future credence) is defensible.

