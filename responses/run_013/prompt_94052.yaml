  The credence in R* depends on five sub-questions. Probabilities reflect confidence in statements supporting R* (e.g., "Reflection is solely about coherence"). Roles indicate how each supports or undercuts R*. Weights measure each component’s contribution to credence movement (summing to 1). Components combine via a weighted average, as they are partially interdependent but capture distinct facets.

