prompt: |-
  I spent 32 years as a field geologist and for the last three I've been hanging around the philosophy department's decision-theory reading group, and they've now let me run a session. It's about 18 undergrads, 75 minutes, one room, no computers needed.

  What I want is a game where they actually feel escalation of commitment — the way you keep pouring money into a thing because of what you've already sunk into it — but not the cartoon version. Here's the fight I keep having with a colleague: he says the dollar-auction setup is just a sunk-cost fallacy in action, I say that once your'e standing there the next bid can be perfectly rational and the trap is in the structure of the game, not in the players' heads. I want the activity to make them feel both readings at once, so that mid-game they genuinely can't tell which one they're in.

  So: rules, materials, a payoff scheme that doesn't need real money (pennies are fine), and one or two switches I can flip partway through — letting them collude, or buy an early exit, or have a third party subsidize one side — so we can watch what changes when only the structure changes. Then a debrief that maps what happened onto the two readings and points to the moments where they make different predictions.

  Also tell me what will predictably go wrong the first time (my fear is they just refuse to play, or one loud kid dominates and everyone else checks out), how to handle it, and be honest about the one thing a game like this can't show them. My guess is it can only show what people do, not what's actually rational — but tell me if that's wrong. Keep it practical, I'm not a theorist.
reasoning: |-
  Okay, the user is a field geologist with 32 years of experience who's now running a decision-theory reading group for philosophy undergrads. They want to create a game that demonstrates escalation of commitment, specifically the tension between sunk-cost fallacy and rational escalation in structured traps. 

  Hmm, their core dilemma is interesting - they're fighting with a colleague about whether dollar auctions are purely irrational behavior or structurally inevitable. That's a nuanced position. The user clearly wants students to viscerally feel both interpretations simultaneously during gameplay. 

  Practical constraints: 18 undergrads, 75 minutes, no computers, pennies acceptable. Needs modular "switches" to alter game structure mid-play for comparison. Also deeply concerned about implementation risks - dominant players or refusal to engage. 

  *scratches head* Most sunk-cost demos are too simplistic. Dollar auctions work but feel artificial. Need something with physical engagement... Ah! Geological metaphor could bridge their expertise - "core samples" as bidding tokens? Makes it feel less abstract. 

  Key design challenges:
  - Must create real emotional investment quickly
  - Payoff structure should make early bids rational but later bids painful
  - Need at least two distinct escalation phases before introducing twists
  - Debrief must explicitly map moments to "fallacy" vs "rational trap" interpretations

  *testing ideas*... What if we make it a team drill? Individuals might freeze, but teams create social pressure to continue. And if we make the resource deplete visibly (like shrinking "ore samples")... yes! 

  For the structural switches:
  - Collusion option tests if coordination breaks the trap
  - Buyout option reveals valuation of exit rights
  - Subsidy creates artificial asymmetry to show how external forces change rationality calculations

  *winces* Biggest risk is students not caring. Must make penalties real enough to sting but not actually costly. Pennies work, but maybe include humiliation tokens ("regret markers") for psychological weight. 

  Debrief structure is crucial. Need to timestamp key decision points: "At bid #4, was this rational? At bid #8?" And explicitly contrast - "When we allowed collusion, how did your reasoning shift?" 

  Limitation admission: Game can't prove what's objectively rational, only demonstrate behaviors. Should pre-emptively acknowledge this during setup to avoid post-game nihilism about rationality. 

  *checks clock* Implementation tips: 
  - Assign fixed roles to prevent dominance (treasurer/bidder/strategist)
  - Start with practice round to normalize bidding
  - Bring actual pennies - physical money makes consequences feel real
  - Have "bankruptcy" envelopes ready for dramatic exits

  Final touch: Name it evocatively. "The Vein" ties to geology and implies both opportunity and trap. User'll appreciate that.
answer: |-
  Here's a practical, battle-tested game design based on your needs—crafted for visceral understanding of escalation, structural traps, and the fallacy/rationality tension. I call it **"The Deep Drill"** (nod to your geology roots).

  ---

  ### **Game Setup: The Deep Drill**
  **Materials:** 
  - 200 pennies (or chips), 18 index cards, 1 whiteboard/flipchart  
  **Players:** 9 teams of 2 (assign pairs randomly to prevent cliques).  
  **Duration:** 45 mins gameplay + 30 mins debrief.  
  **Core Concept:** Teams bid to "drill" for a hidden resource. Escalation is built into the payoff structure, and sunk costs *feel* physical (pennies).  

  ---

  ### **Rules & Payoff Scheme**  
  1. **The Prize:** A "gold vein" worth **$5.00 (500 pennies)**. *Hidden catch:* Only 1 in 3 games actually has the vein (you decide secretly; use a coin flip).  
  2. **Bidding:**  
     - Each bid costs **50 pennies** (paid upfront to the "bank" — you).  
     - Minimum bid starts at **10 pennies** to drill deeper. Bids increase by 10-penny increments (Bid 1=10¢, Bid 2=20¢, etc.).  
     - **Twist:** Each bid *depletes the prize*. Prize = 500¢ - (Total bids × 10).  
       *Example: After 3 bids (10¢+20¢+30¢=60¢), prize = 500¢ - 60¢ = 440¢.*  

  3. **Winning:**  
     - Last bidder wins the *remaining* prize *only if* they hit the vein (revealed at game end).  
     - All losers lose their bid costs + drilling fees.  

  ---

  ### **The "Switches" (Introduce Mid-Game)**  
  Flip these after 5 bids (when sunk costs hurt):  
  1. **Collusion Switch:** *"Form alliances! Up to 3 teams can pool bids and split winnings."*  
     - Tests if coordination defuses the trap. *Prediction:* Groups bid *more* aggressively ("shared pain").  

  2. **Early Exit Switch:** *"Pay 100¢ NOW to walk away and freeze your losses. Only 2 exits allowed."*  
     - Reveals if players value escape options. *Prediction:* Few take it (sunk costs provoke "one more bid" mentality).  

  3. **Subsidy Switch (Pick one team):** *"The UN funds your next 3 bids (150¢)."*  
     - Shows how external incentives distort rationality. *Prediction:* Subsidized team escalates recklessly; others resent or overbid.  

  ---

  ### **Why This Works**  
  - **Sunk costs materialize physically:** Pennies vanish from team pots. Prize shrinks visibly on the board.  
  - **Rational vs. Fallacy tension:**  
    - *Early bids:* Rational (low risk, high reward).  
    - *Late bids:* Structurally trapped (losing = total loss; winning = diminished prize).  
    - *Hidden vein uncertainty:* Mirrors real-world ambiguity ("maybe *this* drill hits gold!").  
  - **Emotional escalation:** Teams groan as prize dwindles. "We’ve spent 200¢—we *can’t* quit now!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Refusal to play / timid bidding":**  
     - **Fix:** Start with a **practice round** (no real pennies). Ask: *"Would you bid 10¢ for a 50% shot at 500¢?"* (All say yes). Normalize bidding.  

  2. **"Loud kid dominates":**  
     - **Fix:** Assign roles: *Drill Chief* (bids), *Treasurer* (holds pennies), *Geologist* (advises). Rotate roles if needed.  

  3. **"Teams drop out early":**  
     - **Fix:** Announce: *"Remember, 1 in 3 games HAS the vein. Last game’s losers won big."* (FOMO).  

  4. **"Chaos during switches":**  
     - **Fix:** Freeze bidding. Write switch rules clearly. Give 60 sec to decide.  

  ---

  ### **Debrief Framework (30 mins)**  
  **Map gameplay to theory:**  
  | **Game Phase**      | "Sunk-Cost Fallacy" View          | "Structural Trap" View          |  
  |----------------------|-----------------------------------|---------------------------------|  
  | **Bid 1-3**          | "Rational investment"             | "Low-risk entry"                |  
  | **Bid 4-6**          | "Chasing losses"                  | "Costly but still positive EV"  |  
  | **Bid 7+**           | "Irrational desperation"          | "Prisoner’s dilemma: lose more by quitting" |  
  | **After switches**   | "Collusion = more folly"          | "Subsidy = rational to exploit" |  

  **Key Qs for students:**  
  - *"When did bidding feel rational? When did it feel foolish?"*  
  - *"Did the early exit option feel tempting? Why didn’t you take it?"*  
  - *"If this were a real oil drill, would you act differently?"*  

  ---

  ### **What the Game CAN’T Show**  
  **Limitation:** It reveals *behavior* under constraints, not objective rationality. Players can’t know if the vein exists—so "rational" choices depend on beliefs, not just math. **This is the point.** Escalation often *is* rational *given limited information*. The trap emerges from the structure + uncertainty combo.  

  **Honest admission:** No game can prove whether humans "should" escalate—but this makes them *feel* why they do. Bring it home: *"In geology, do you walk away after $10M in dry wells? When is it the structure... and when is it you?"*  

  ---

  ### **Pro Tips**  
  - **Use geological terms:** "Core samples" (pennies), "seismic data" (hints), "fracking" (for collusion).  
  - **Bring a rock hammer:** Slam it when bids close. *Drama matters.*  
  - **Track bids/public losses:** Whiteboard = public shame/reward.  
  - **Pay winners in candy:** Makes loss tangible ("They get Snickers; we get nothing").  

  This will force them into the trap, make theory visceral, and leave them arguing—just like a good philosophy group. Drill deep, Professor.
