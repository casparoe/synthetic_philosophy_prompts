prompt: |-
  I'm taking a democratic theory seminar this term and last week we did a session on futarchy — the idea where instead of voting on policies you vote on a metric you care about (GDP, life expectancy, whatever) and then let a prediction market pick the policy, on the theory that markets are better at aggregating beliefs about consequences than voters are at guessing them. The discussion went badly in an interesting way: half the room argued about whether prediction markets actually forecast well, the other half argued about whether it's acceptable for capital-weighted bets to bind everyone, and a third group (me) kept pointing out that those aren't the same objection. I want to write a handout that sorts the positions out properly instead of rehashing the same two takes, because right now "I'm pro-futarchy" seems to mean about six different things.

  So: give me a decision tree / taxonomy of the positions on governing by prediction markets. Build it from the logical space first — each internal node should be a question that genuinely splits the positions below it, phrased so that someone can answer it without already knowing which leaf it leads to (so no nodes like "do you think markets work well?" or "are you a democrat or a technocrat?"). Each leaf should carry the name of the position (or "unnamed" if it's a cell nobody occupies) plus one sentence on its most awkward commitment. I want around ten leaves. The distinctions I actually care about, roughly in the order I'd want them asked: (1) do markets decide policy or only inform a decider; (2) if they decide, what do they decide — the policy, a threshold or parameter, or the metric itself; (3) is the metric fixed in advance by a vote, or is it also up for market determination, and what happens to the regress if it is; (4) the mechanics of the conditional bet — when a trader bets that things go better under policy X, does the payout depend on X actually being adopted, and if it does, how do you stop the price from feeding back into the adoption decision it's supposed to be informing; (5) who gets to trade and how bets are weighted (raw capital, person-weighted, subsidized market maker) and what that does to the manipulation and last-trader problems; (6) whether the market is aggregating values at all or only beliefs, given that prices can't rank outcomes by themselves; (7) the legitimacy question — is a good track record enough, or does the decision rule itself need democratic authorization from the people it binds; (8) measurability and resolution for policies whose effects are diffuse and decades out.

  Two more things. Where the tree can't separate two positions, say so instead of papering over it — I suspect "markets decide" and "markets advise" collapse into each other whenever the decider credibly commits to following the price, and I want to know if there are others like that. And for the empty cells, tell me why they're empty: incoherent, unattractive, or just unexplored. Keep it for undergrads in the seminar — a few of them are econ majors, most aren't — so keep the jargon down and don't assume anyone has read the futarchy literature. Its for a two-page handout.
reasoning: |-
  Okay, let me tackle this democratic theory seminar question about futarchy. The user wants a logical taxonomy of positions governing by prediction markets, structured as a decision tree with meaningful splits and clear labels.

  First, I need to identify the core logical questions that genuinely divide different viewpoints. The user listed eight key distinctions, so I'll build the tree around those. The sequence matters - starting with whether markets decide or advise seems fundamental since it shapes everything else. 

  For the first split, "Who formally adopts policies?" creates a clean break between market-as-decider and market-as-advisor positions. This avoids vague terms like "technocracy" while capturing the practical difference in authority. 

  Moving to the "markets decide" branch, the next natural question is "What do markets decide?" with options like specific policies, thresholds, or metrics. This addresses the user's concern about collapsing distinctions - choosing policies versus parameters creates meaningfully different governance models.

  The metric determination question needs special handling. "How is the metric set?" must include options for fixed, voted, or market-determined metrics, while acknowledging the regress problem if markets set their own success criteria. I'll note this creates a circularity issue.

  For conditional bets, I'm considering "Does payout depend on policy adoption?" as the key question. This exposes the feedback loop problem between market prices and policy decisions - a crucial technical challenge in futarchy designs.

  On trader participation, "Who trades and how are bets weighted?" must cover capital-weighting, person-weighting, and subsidized market makers. Each has different implications for manipulation and whose beliefs get amplified.

  The values-vs-beliefs distinction is tricky. "What do prices represent?" helps separate whether markets only aggregate factual predictions or also incorporate value judgments. This connects to the deeper philosophical debate about preference aggregation.

  Legitimacy requires "Why should we obey?" with options like performance legitimacy versus democratic authorization. This addresses the normative concerns raised in the seminar.

  Finally, measurability gets "Can outcomes be measured?" to surface practical implementation issues. Some positions might consider this secondary if they reject futarchy on earlier grounds.

  Throughout, I'll watch for:
  - Genuine splits (no false distinctions)
  - Avoiding econ jargon
  - Flagging where positions collapse (like committed advisors becoming de facto deciders)
  - Explaining why some cells are empty (either incoherent or politically untenable)
  - Keeping each leaf's "awkward commitment" punchy and revealing

  The user mentioned this is for a 2-page undergrad handout, so I'll aim for about 10 terminal positions with clear labels. The "unnamed" positions are valuable too - they show conceptual boundaries and might inspire new research angles. I'll make sure to explain why those cells are empty (logical flaws vs mere unpopularity).
answer: |-
  Here's a decision tree taxonomy based on your core distinctions, designed for clarity and logical progression:

  **Decision Tree: Governing by Prediction Markets**

  1.  **Q1: Who formally adopts binding policies?**
      *   **A1: The prediction market mechanism itself.** → Go to Q2
      *   **A2: A separate decision-maker (e.g., legislature, executive, judge) informed by the market.** → Go to Q7

  ---

  **Branch: Markets Decide (A1)**

  2.  **Q2: What does the market directly decide?**
      *   **A1: Specific policies.** → Position: **Pure Policy Futarchy**  
          *(Awkward Commitment: Requires defining every possible policy option in advance for trading.)*
      *   **A2: Policy parameters/thresholds (e.g., tax rate %, spending cap).** → Position: **Parameter Futarchy**  
          *(Awkward Commitment: Struggles with complex policies needing multi-dimensional adjustments.)*
      *   **A3: The metric of success itself.** → Position: **Meta-Futarchy**  
          *(Awkward Commitment: Faces infinite regress – what market decides the metric for *this* market?)*

  3.  **Q3 (For A1/A2 above): How is the "success metric" defined?**
      *   **A1: Fixed in the constitution/law.** → Position: **Fixed-Metric Futarchy**  
          *(Awkward Commitment: Rigidity; struggles if societal values shift away from the fixed metric.)*
      *   **A2: Chosen periodically by democratic vote.** → Position: **Democratically Mandated Futarchy**  
          *(Awkward Commitment: Voters must understand complex metrics; introduces electoral politics into metric choice.)*
      *   **A3: Determined by a separate prediction market.** → *See Meta-Futarchy (Q2A3). (This leads back to regress.)*

  4.  **Q4: How are conditional policy bets structured?**
      *   **A1: Payout depends ONLY on the measured outcome, NOT on whether the policy is adopted.** → Position: **Outcome-Only Bets**  
          *(Awkward Commitment: Traders have no direct stake in adoption; market may predict well but lack influence.)*
      *   **A2: Payout depends on BOTH the outcome AND the policy being adopted.** → Position: **Adoption-Conditional Bets**  
          *(Awkward Commitment: Creates a feedback loop – the market price influences adoption which influences price. Requires a separate, non-market trigger for adoption based on price.)*

  5.  **Q5: Who can trade and how are bets weighted?**
      *   **A1: Anyone; weighted by capital.** → Position: **Capital-Weighted Futarchy**  
          *(Awkward Commitment: Decisions biased towards wealthy interests; vulnerable to capital-rich manipulators.)*
      *   **A2: Anyone; weighting subsidized (e.g., LMSR market maker).** → Position: **Liquidity-Subsidized Futarchy**  
          *(Awkward Commitment: Requires significant public subsidy; vulnerable to "last trader" manipulation near decision time.)*
      *   **A3: Citizens only; one-person-one-bet.** → Position: **Citizen Prediction Pool**  
          *(Awkward Commitment: Requires secure, universal citizen access; limits liquidity and potentially expert participation.)*

  6.  **Q6: What do the market prices primarily aggregate?**
      *   **A1: Only factual beliefs about outcomes under policies.** → Position: **Belief-Aggregation Futarchy**  
          *(Awkward Commitment: Assumes the chosen metric perfectly captures societal values; ignores value disagreements.)*
      *   **A2: Both beliefs *and* subjective values/trade-offs (via willingness to bet).** → Position: **Value-Encoding Futarchy**  
          *(Awkward Commitment: Requires individuals to accurately price their complex values into bets; conflates intensity of belief with intensity of preference.)* *// Note: This is highly contested. Many argue markets *only* aggregate beliefs, not values.//*

  7.  **Q7: Why should citizens accept market-decided policies as legitimate?**
      *   **A1: Because the system demonstrably produces better outcomes (Performance Legitimacy).** → Position: **Consequentialist Futarchy**  
          *(Awkward Commitment: What if it produces "good" outcomes deemed unjust or undemocratic? Requires long track record to establish.)*
      *   **A2: Because the rule (markets decide on metric Y) was democratically authorized.** → Position: **Procedurally Authorized Futarchy**  
          *(Awkward Commitment: Legitimacy hinges entirely on the initial authorization; subsequent market decisions are not themselves democratic.)*
      *   **A3: Because it's a superior form of rational decision-making.** → Position: **Epistocratic Futarchy**  
          *(Awkward Commitment: Directly conflicts with democratic equality; "superior" is contestable.)*

  8.  **Q8: Can the success metric be measured objectively and timely for relevant policies?**
      *   **A1: Yes, sufficiently for most critical decisions.** → *Implied by most "Markets Decide" positions above.*
      *   **A2: No, many crucial effects (long-term, diffuse) are unmeasurable.** → Position: **Skeptical Futarchy**  
          *(Awkward Commitment: If true, futarchy's core mechanism fails for the most important policy questions.)* *// This can be a terminal position OR a reason to reject futarchy entirely.//*

  ---

  **Branch: Markets Advise (A1 from Q1)**

  7.  **Q7: How binding is the advice?**
      *   **A1: The decider credibly commits to *always* follow the market signal.** → **Collapse Point:** This is functionally identical to "Markets Decide" (A1 from Q1) regarding outcomes. The commitment mechanism *is* the adoption rule. Distinction becomes purely formal.
      *   **A2: The decider uses it as strong input but retains discretion.** → Position: **Predictive Advisory System**  
          *(Awkward Commitment: Risk of decider ignoring inconvenient market predictions, undermining market purpose.)*

  8.  **Q8 (For A2 above): Who can trade? (Similar weighting issues apply)**
      *   *(Sub-positions analogous to Q5, but less critical as markets don't bind e.g., Capital-Weighted Advisory, Citizen Advisory Pool, etc.)*

  ---

  **Key Collapse Points & Empty Cells**

  1.  **"Decide" vs. "Advise" (with Commitment):** As noted, a decider credibly committed to *always* follow the market price is indistinguishable in practice from the market deciding. The commitment mechanism *is* the decision rule.
  2.  **Meta-Futarchy Regress (Q2A3/Q3A3):** The "Meta-Futarchy" cell (market decides metric) is logically coherent but practically empty due to the infinite regress problem (what decides the metric for that market?). It's generally considered unattractive and unexplored beyond theoretical critiques.
  3.  **Value-Aggregation Futarchy (Q6A2):** This position is highly contested and arguably incoherent to many. Market prices reflect *expected value*, but that value is defined by the *externally set metric*. Prices aggregate beliefs *about* achieving that value, not the value itself. Genuine value aggregation through markets alone remains theoretically dubious and unexplored in viable proposals.
  4.  **Pure Outcome-Only Bets (Q4A1):** While logically possible, this position is largely unexplored and potentially unattractive. If payout doesn't depend on adoption, traders have no stake in the policy being chosen, potentially weakening the market's connection to actual governance impact. It risks becoming just an informative game.
  5.  **Epistocratic Futarchy without Performance (Q7A3):** This position (legitimacy solely from being epistemically superior, without democratic authorization *or* proven results) is largely empty/unattractive. It offers no compelling justification for overriding democratic principles beyond assertion.

  **Why this Structure Works:**

  *   **Logical Progression:** Starts with authority (Q1), then what/how markets decide (Q2-Q6), then legitimacy (Q7), then feasibility (Q8). Advice branch is simpler.
  *   **Clear Splits:** Each question forces a distinct choice about mechanism or justification.
  *   **Avoids Jargon:** Uses plain language (e.g., "Who formally adopts?", "payout depends on...").
  *   **Highlights Collapses & Emptiness:** Explicitly notes where distinctions blur (Commitment) and why certain cells are empty (regress, incoherence, unattractiveness).
  *   **Undergrad Friendly:** Focuses on conceptual choices, not intricate market mechanics or dense literature.
  *   **~10 Positions:** The tree generates the target number of distinct terminal positions/nodes.

  This taxonomy should help your seminar move beyond the "markets work/don't work" and "democracy/technocracy" binaries by forcing clarity on the *specific mechanisms and justifications* underlying different stances towards governing with prediction markets. Good luck with the handout!
