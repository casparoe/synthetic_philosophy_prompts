prompt: |-
  I retired a few years back after 35 years of building particle detectors, and I've been teaching myself philosophy of science since — mostly probability and confirmation, since that's where my math is still half-decent. I've hit a snag and I'd rather have a proper map of the positions than read another intro chapter.

  Here's the snag. I'm a card-carrying Bayesian about updating: new certain evidence E comes in, you condition, P(H | E). Fine. But in my old line of work the evidence was never certain — a detector would give me a readout that shifted my credence over, say, {signal, background} to 0.7 / 0.3, not a clean fact. So I went looking and found the rule where instead of conditioning on an event you shift your credences over a partition and re-weight the cells — Richard Jeffrey's thing. It looked right until I tried a toy case: I recieve two independent noisy reports in a row, and updating on them in one order lands me somewhere different than updating in the other order. That can't be right — the order I happen to read my instruments in shouldn't change what I ought to believe. So now I don't know whether I've misread the rule, or the rule really has that hole, or the whole notion of uncertain evidence is where the trouble starts.

  What I want is a decision tree / taxonomy I can pin above my desk. Start from someone who already accepts ordinary conditionalization on certain evidence and walk them, node by node, to a named position on what to do when the evidence itself is uncertain. Every branch point should be a question I could answer without already knowing which label it leads to — something like: do you think there's any such thing as evidence you're less than certain of, or does every real learning event reduce to becoming certain of some fact about your own mental state? If the shift is over a partition, must your credences conditional on each cell stay put while only the cells' weights change? Does the order-dependence bother you, and if so do you patch the rule or throw it out? Keep going until every leaf is either a named position or an honest nobody-really-holds-this.

  A few things I'd like you to do:

  - Don't just list names. Build the space first out of the yes/no questions, then drop the actual positions into it. If some combination of answers is empty, say so and tell me whether it's empty because it's incoherent, because it's merely unattractive, or because nobody's bothered to occupy it.
  - Make sure these turn up somewhere as leaves: the plain view that all evidence is really certain, so you just condition on the fact that you saw the readout; the partition re-weighting rule; the move of making the uncertain report itself the certain thing you condition on; and a leaf for people who think the question is malformed from the start.
  - If two leaves come out the same on every question I can actually answer, flag them as ones the tree can't seperate — don't fake a distinction to make the picture tidier.
  - The order-dependence case above should be one of the branch nodes, not an afterthought tacked on at the end.
  - Keep it to something I can actually draw on one sheet of paper — say eight or so questions, and however many leaves that gives you.
reasoning: |-
  Alright, let me tackle this retired physicist's problem. He's coming from a background in particle detectors, where evidence is always noisy—never certain. He's comfortable with Bayesian updating for certain evidence but hit a snag with Jeffrey's rule for uncertain evidence. Specifically, he found that updating on two independent noisy reports in different orders gives different results, which seems wrong. Now he wants a decision tree to map out the philosophical positions on handling uncertain evidence.

  First, I need to understand his core issue. He's using Jeffrey conditionalization, which updates credences over a partition without certain evidence. But the order dependence bothers him because independent reports shouldn't affect beliefs based on order. The key question is whether this order dependence is a flaw in Jeffrey's rule, a misapplication, or a sign that uncertain evidence isn't handled correctly this way.

  The user wants a taxonomy built from yes/no questions leading to named positions. Important leaves include: all evidence is certain (condition on the observation event), Jeffrey's rule, conditioning on the report itself, and the view that the question is malformed. Order dependence must be a branch point. The tree should be concise—about 8 questions, with leaves clearly marked.

  Starting the decision tree:

  1. **Is all learning reducible to becoming certain of some proposition?**  
     - If yes, then uncertain evidence isn't a thing; it's always about certain mental states. This leads to conditioning on the observation (e.g., "I saw the detector readout as X").  
     - If no, then uncertain evidence exists, moving to Jeffrey's territory.

  2. **For shifts over a partition, must conditional credences remain fixed?**  
     - Jeffrey's rule assumes that when credences over a partition shift, the conditional probabilities given each cell stay the same. If yes, this is Jeffrey's rule. But here's where order dependence appears.  
     - If no, then other methods might be considered, but Jeffrey's rule is the main one here.

  3. **Does order dependence in updates bother you?**  
     - If using Jeffrey's rule and order dependence is a problem, one might reject Jeffrey's approach. If not bothered, stick with Jeffrey despite the issue.  
     - Those bothered might explore patches like "rigidity" (ensuring conditional probabilities stay fixed across updates) or alternative frameworks like radical probabilism.

  4. **Can the update be modeled by conditioning on a certain proxy?**  
     - Some suggest that uncertain evidence can be treated as conditioning on a proxy proposition (e.g., "the detector reports X"). This avoids order dependence if the proxy captures all relevant info.  
     - But if the proxy is just the report itself, it might not fully represent the learning process, leading back to the mental state approach.

  Handling the leaves:
  - **Strict Conditionalization**: All evidence is certain; condition on the observation event.
  - **Jeffrey Conditionalization**: Accept partition shifts with fixed conditionals, tolerate order dependence.
  - **Proxy Conditioning**: Condition on the report as a certain fact.
  - **Radical Probabilism (Skyrms)**: Reject fixed conditional probabilities; update based on dynamic constraints.
  - **Subjectivist Stance (Diaconis, Zabell)**: Focus on symmetry arguments to justify updates.
  - **Foundationalist Critique**: The question is malformed; evidence isn't probabilistic.

  Ensuring order dependence is a key branch. If Jeffrey's rule is used and order dependence is problematic, it leads to questioning the rigidity assumption. If proxies are used, order dependence shouldn't occur if the proxy is sufficient. The tree must show that some paths are unattractive or unexplored, like rejecting rigidity without a clear alternative.
answer: |-
  Below is a decision tree / taxonomy for handling uncertain evidence in Bayesian updating, built from first principles for someone who already accepts standard conditionalization (i.e., updating on certain evidence via \(P_{\text{new}}(H) = P(H \mid E)\)). The tree is structured as a series of yes/no questions, with each branch point addressing a conceptual choice. It leads to named positions (or dead ends) at the leaves, with the order-dependence problem explicitly integrated. I've kept it to **8 questions** and **9 leaves**, ensuring it fits on one page. Each question is phrased to be answerable without knowing the labels, and the tree avoids false distinctions.

  ### Key for Reading the Tree
  - **Q1, Q2, ...**: Branching questions (answer Yes/No).
  - **Leaf**: Terminal position (named or described). Coherent positions are in **bold**; incoherent/unattractive paths are *italicized*.
  - **Order-dependence**: Explicitly addressed at Q6 based on your toy case (updating on two independent noisy reports yields different results depending on order).
  - **Symbols**: 
    - \(E\): Certain evidence (e.g., a detector readout value).
    - \(R\): Uncertain evidence report (e.g., credence shift to {signal: 0.7, background: 0.3}).
    - \(\mathcal{P}\): Partition (e.g., {signal, background}).
    - \(P_{\text{old}}\), \(P_{\text{new}}\): Credence functions before/after updating.

  ---

  ### Decision Tree
  **Start**: You accept standard conditionalization for certain evidence \(E\).

  1. **Q1: Is all learning fundamentally reducible to becoming certain of *some* proposition?**  
     - **Yes** → Uncertain evidence isn't real; all updates reduce to conditioning. Go to Q2.  
     - **No** → Uncertain evidence exists as a distinct phenomenon. Go to Q3.  

  2. **Q2: When you observe uncertain evidence \(R\) (e.g., a detector readout), is the proposition you become certain of about *your mental state* (e.g., "I seem to see a readout favoring signal")?**  
     - **Yes** → **Leaf: Strict Conditionalization via Mental States** (e.g., Savage, Jeffrey early work). Position: Treat \(R\) as certain evidence about your subjective experience: \(P_{\text{new}}(H) = P_{\text{old}}(H \mid \text{"I observe } R\text{"})\). Order-independent, but may lead to "belief inertia" (credences never update beyond initial biases).  
     - **No** → **Leaf: Strict Conditionalization via Physical Proxies** (e.g., Lewis's "Expert Principle"). Position: Treat \(R\) as certain evidence about a physical event (e.g., "The detector output is X"), not your mind. \(P_{\text{new}}(H) = P_{\text{old}}(H \mid \text{detector output})\). Order-independent if reports are independent.  

  3. **Q3: When uncertain evidence shifts your credences over a partition \(\mathcal{P}\), must your conditional credences *given each cell* of \(\mathcal{P}\) remain fixed?** (E.g., if \(\mathcal{P} =\) {signal, background}, \(P(H \mid \text{signal})\) stays the same.)  
     - **Yes** → This is Jeffrey conditionalization. Go to Q4.  
     - **No** → Go to Q7.  

  4. **Q4: In Jeffrey's rule, is the credence shift over \(\mathcal{P}\) triggered by a *single, well-defined experience*?** (E.g., one detector readout.)  
     - **Yes** → **Leaf: Jeffrey Conditionalization** (Richard Jeffrey's standard rule). Position: For shift \(P_{\text{new}}(\mathcal{P}) = \{p_1, \dots, p_n\}\), \(P_{\text{new}}(H) = \sum_i P_{\text{new}}(P_i) \cdot P_{\text{old}}(H \mid P_i)\). Rigid conditionals preserve diachronic coherence.  
     - **No** → Go to Q5.  

  5. **Q5: Can multiple uncertain updates (e.g., two reports) be combined into a single shift over a *joint partition*?** (E.g., treat two reports as one event over {signal & report1, signal & report2, ...}.)  
     - **Yes** → **Leaf: Coarse-Grained Jeffrey** (e.g., Jeffrey's later work). Position: Force all updates into one partition shift to avoid order-dependence. Unattractive for complex cases—requires ad hoc partitioning.  
     - **No** → Go to Q6.  

  6. **Q6: Does the order-dependence in sequential Jeffrey updates (e.g., two reports) *bother* you?** (As in your toy case: order changes final credences.)  
     - **Yes** → **Leaf: Reject Jeffrey Conditionalization** (e.g., Diaconis, Zabell). Position: Order-dependence violates commutativity (updates should be path-independent). Jeffrey's rule is flawed for sequential evidence; seek alternatives (e.g., radical probabilism).  
     - **No** → **Leaf: Pragmatic Jeffrey Conditionalization** (e.g., van Fraassen). Position: Order-dependence reflects context-dependence of learning. Jeffrey's rule is still valid if shifts are "experience-relative," but not for objective evidence.  

  7. **Q3 → No: Must conditional credences stay fixed?**  
     - Now at Q7: **Do you require updates to be *uniquely determined* by the constraints of the learning event?**  
       - **Yes** → **Leaf: Radical Probabilism** (e.g., Skyrms). Position: Learning under uncertainty has no fixed rule. Updates minimize divergence from prior subject to constraints (e.g., new partition probabilities), but conditionals aren't rigid. Order-dependence may persist, but it's acceptable.  
       - **No** → Go to Q8.  

  8. **Q8: Can uncertain evidence \(R\) be treated as a *certain proposition* to condition on, even if it's not directly observed?** (E.g., condition on "The detector *reports* signal with 70% credence.")  
     - **Yes** → **Leaf: Proxy Conditionalization** (e.g., Greaves, Wallace). Position: Reduce uncertain evidence to certain evidence about \(R\) itself: \(P_{\text{new}}(H) = P_{\text{old}}(H \mid R)\). Order-independent if \(R\) is well-defined, but \(R\) may be hard to specify (e.g., what *is* "a report"?).  
     - **No** → **Leaf: Foundationalist Critique** (e.g., Carnap, strict Bayesians). Position: The question is malformed—evidence must be certain. "Uncertain evidence" is incoherent; reject the premise.  

  ---

  ### Taxonomy Map (Simplified for a Desk Diagram)
  ```mermaid
  graph TD
      Start[Accept standard conditionalization] --> Q1
      Q1[Q1: All learning reducible to certainty?] -->|Yes| Q2
      Q1 -->|No| Q3
      Q2[Q2: Certainty about mental state?] -->|Yes| Leaf1[Strict Conditionalization via Mental States]
      Q2 -->|No| Leaf2[Strict Conditionalization via Physical Proxies]
      Q3[Q3: Fixed conditionals given partition?] -->|Yes| Q4
      Q3 -->|No| Q7
      Q4[Q4: Single experience?] -->|Yes| Leaf3[Jeffrey Conditionalization]
      Q4 -->|No| Q5
      Q5[Q5: Combine into joint partition?] -->|Yes| Leaf4[Coarse-Grained Jeffrey]
      Q5 -->|No| Q6
      Q6[Q6: Order-dependence bothers you?] -->|Yes| Leaf5[Reject Jeffrey Conditionalization]
      Q6 -->|No| Leaf6[Pragmatic Jeffrey Conditionalization]
      Q7[Q7: Uniquely determined updates?] -->|Yes| Leaf7[Radical Probabilism]
      Q7 -->|No| Q8
      Q8[Q8: Condition on proxy?] -->|Yes| Leaf8[Proxy Conditionalization]
      Q8 -->|No| Leaf9[Foundationalist Critique]
  ```

  ### Notes on Leaves
  1. **Strict Conditionalization via Mental States**: Certain evidence about subjective experience. Order-independent.  
  2. **Strict Conditionalization via Physical Proxies**: Certain evidence about physical events. Order-independent if proxies capture all info.  
  3. **Jeffrey Conditionalization**: Rigid conditionals, partition shifts. Order-dependent for sequential updates (your snag).  
  4. **Coarse-Grained Jeffrey**: Force multiple reports into one partition. Avoids order-dependence but ad hoc.  
  5. **Reject Jeffrey Conditionalization**: Order-dependence is fatal; seek non-rigid updates.  
  6. **Pragmatic Jeffrey Conditionalization**: Accept order-dependence as context-dependent.  
  7. **Radical Probabilism**: No fixed rule; minimize divergence with constraints. Order-dependence possible.  
  8. **Proxy Conditionalization**: Condition on \(R\) as certain. Order-independent but proxies may be vague.  
  9. **Foundationalist Critique**: Uncertain evidence is incoherent; reject the framework.  

  ### Key Observations
  - **Order-dependence**: Arises at Q6 (for Jeffrey updates). It's a core reason to reject or modify the rule.  
  - **Unoccupied/Incoherent Paths**: 
    - *Q5 → No + Q6 → No*: Pragmatic Jeffrey is occupied, but rarely defended formally.  
    - *Q7 → No + Q8 → No*: This path (Leaf 9) is coherent but rejects the problem.  
  - **Undistinguished Positions**: 
    - **Proxy Conditionalization** (Leaf 8) and **Physical Proxy Conditionalization** (Leaf 2) are similar in practice—both condition on a certain proposition. The tree distinguishes them because Leaf 2 answers "Yes" to Q1 (all learning is certain), while Leaf 8 answers "No" to Q1 but "Yes" to Q8.  
    - **Radical Probabilism** (Leaf 7) and **Reject Jeffrey** (Leaf 5) both avoid rigidity, but Leaf 5 explicitly rejects Jeffrey due to order-dependence, while Leaf 7 is more general.  
  - **Your Toy Case**: Explained by order-dependence in Jeffrey's rule (Leaf 3 and Leaf 6). Fixes include moving to Leaf 1, 2, 4, 5, 7, or 8.  
  - **Recommendation**: For particle detectors, **Proxy Conditionalization** (Leaf 8) is popular—treat the readout itself as certain evidence \(R\) (e.g., "detector outputs voltage V"). Avoids order-dependence and leverages your existing math.  

  This tree covers the major positions (Jeffrey, Skyrms, Lewis, etc.) while fitting your constraints. Print it as a flowchart—it should fit on one A4 sheet!
