prompt: |-
  I'm an undergraduate in a course on twentieth-century existentialism, and next week I'm responsible for leading the seventy-five-minute discussion section on Sartre's account of freedom and bad faith. The assigned reading is the relevant stretch of Being and Nothingness, but I've been told not to lecture and not to spend the hour walking through the text's architecture; the students will have read it, badly, and my job is to make it land. What I want from you is not an explanation of the material but a teaching plan: the order in which the ideas have to be introduced so that each one is doing work the next one depends on, the single case I should build the whole session around, the misunderstandings that will form in the room and exactly where in that order I should head each one off, and the question I should put to them at the end to find out whether the idea has actually landed rather than merely been repeated back to me.

  A few constraints on the case. I don't want to use the café waiter. I understand why it's the canonical illustration, but everyone in the room has already met it and it has hardened into a set piece they can recite; I want a case that does the same structural work but that they have to think through along with me. It has to be a case where the person's situation genuinely constrains them — real obstacles, real history, no costless exit — so that the session doesn't collapse into the lazy reading on which being free just means being able to do otherwise. And it has to be a case where what the person is doing is best described as a way of relating to their own situation rather than a belief they hold, so that we can see why Sartre treats bad faith as a matter of the shape of a life rather than a false proposition someone assents to.

  Two things I specifically need the plan to solve. First, there's a circularity I can't get past on my own: bad faith seems to require someone who is at once the one deceived and the one deceiving, which sounds like it needs a divided self, and Sartre's own picture seems to rule that out. I want to know whether this is a real problem, a misreading, or something he simply accepts and turns into a feature, and where in the sequence it should surface so that it sharpens the session instead of derailing it. Second, I want to handle the objection that will come up in the first ten minutes from the psychology students in the room — that talk of choosing one's attitude is naïve in light of everything we now know about how behaviour is caused — and I don't want to deflect it with a shrug about different senses of freedom; I want it to arrive at a point in the sequence where the class already has the vocabulary to see exactly what is and isn't being claimed.

  The misconceptions I already expect, in no particular order: that bad faith is just lying to yourself, or self-deception in the ordinary sense; that radical freedom means you can do anything you want regardless of circumstance, so that Sartre has nothing to say about oppression or constraint; that if you are responsible for everything about yourself then you are to blame for your own suffering, which is what makes the view cruel and obviously false; and that the whole thing is refuted the moment someone mentions determinism. Tell me which of these are actually the same mistake wearing different clothes, and which order they will really arise in — the order I should be ready for, not the order that would be tidy.

  Finally, tell me what to leave out and say that I'm leaving it out, and why that is the right call at this level rather than a cop-out.
reasoning: |-
  Okay, let me try to unpack this user's request. They're an undergrad leading a discussion on Sartre's freedom and bad faith. The main challenge is making complex ideas click without lecturing, using a fresh case study. 

  First, I notice they're rejecting the café waiter example - smart move since it's overused. They want something structurally similar but unfamiliar. The constraints are crucial: real constraints (not "just do otherwise"), and showing bad faith as a lived pattern, not just false beliefs. That tells me the case needs visceral stuckness - maybe addiction, caregiving or chronic unemployment.

  Hmm... the caregiver example feels right. Trapped between duty and resentment, no clean exit. "I have no choice" echoes both truth (material limits) and bad faith (denying their attitude-choice). Perfect for showing how constraint and freedom coexist.

  Now the circularity problem: how can one person be both deceiver and deceived without a divided self? Ah - this is where the pre-reflective vs reflective consciousness distinction matters. Need to show how the "lie" happens at the immediate level of living, not cognitive contradiction. Should surface this after establishing facticity/transcendence but before defining bad faith.

  For the psych students' determinism objection... timing is key. If it comes too early, it derails; too late, feels dodged. Best to park it initially ("We'll return to causation"), then unpack after they grasp phenomenological freedom. Contrast causal vs ontological claims - Sartre isn't denying causes, but saying we're condemned to interpret them.

  Major misconceptions to preempt:
  - "Bad faith = lying to self" → show it's pattern of avoiding anguish
  - "Freedom = doing anything" → anchor in caregiver's concrete limits
  - "Responsibility = blame" → emphasize it's about authorship, not moral fault
  - "Determinism refutes it" → already addressed via causation distinction

  The killer question at the end: "Where do you see the gap between your situation and your grip on it?" Makes them locate their own bad faith - if they can, it landed.

  Cutting the master/slave dialectic section? Yes. Too tangential for 75 mins. Name the omission to show pedagogical intent.

  Structure sequence carefully:
  1. Open with caregiver case → hook with relatable stuckness
  2. Facticity/transcendence via case details → build dual-aspect foundation
  3. Pre-reflective consciousness → solve circularity here
  4. Bad faith definition → now they see it as lived
  5. Park determinism → then crush it with ontology/causation distinction
  6. Responsibility ≠ blame → separate authorship from judgment
  7. Final question → self-application as success metric

  This should make freedom feel visceral, not abstract. And the caregiver case? Raw enough that "I have no choice" won't sound like philosophical boilerplate.
answer: |-
  Here’s a structured teaching plan designed to make Sartre’s freedom/bad faith dynamic **land** through a single case, preempt misconceptions, and resolve your two core problems. The sequence builds each idea on the last, using **a family caregiver** (e.g., someone trapped caring for an ailing parent) as the central case.

  ---

  ### **Teaching Plan: 75-Minute Discussion**  
  **Core Case: Maria**  
  *Maria, 32, gave up her career to care for her dementia-stricken mother. She says: "I have no choice. This is just who I am — a devoted daughter." She feels trapped, bitter, and exhausted, but dismisses offers of help.*  

  #### **Phase 1: Establish Constraint & "Facticity" (15 mins)**  
  - **Opening Question:** *"What *genuinely* constrains Maria? List concrete obstacles."*  
    (Students identify: financial limits, mother’s medical needs, social expectations, emotional guilt.)  
  - **Key Move:** Affirm these as **facticity** (Sartre’s "given" — history, body, social role). Stress: *These are real. Freedom doesn’t erase them.*  
  - **Preempt Misconception:** *"If freedom is real, why can’t Maria just leave?"* → Freedom operates *within* facticity, not by denying it.  

  #### **Phase 2: Introduce Transcendence & the "Attitude Gap" (20 mins)**  
  - **Pivot Question:** *"Maria says she ‘has no choice.’ Is that true? What *is* she choosing, even within constraints?"*  
    - Guide students to: Her **interpretation** of duty ("I must do everything myself"), **refusal of help**, **suppressed resentment**.  
  - **Key Move:** Define **transcendence**: Her capacity to *relate* to facticity (e.g., resent it, accept help, see it as temporary). Contrast:  
    - **Facticity**: "Mother needs care."  
    - **Transcendence**: "I am *defined* by this duty" vs. "This is one chapter of my life."  
  - **Solve Circularity Problem Here:**  
    - *Problem:* "How can Maria deceive herself without two ‘selves’?"  
    - *Solution:* Sartre’s **pre-reflective consciousness**. Maria isn’t "lying"; she’s *living* her role to **flee anguish** (awareness she *could* interpret/act otherwise).  
    - **Analogy:** Avoiding eye contact with an elephant in the room. You’re not "lying" — you’re *acting as if* it’s not there. Bad faith is a lived **posture**, not a cognitive lie.  

  #### **Phase 3: Define Bad Faith as Lived Structure (15 mins)**  
  - **Question:** *"Maria says this is ‘just who I am.’ What is she refusing to acknowledge?"*  
    - Target: She denies her **transcendence** (she *could* ask for help/feel anger) by **over-identifying with facticity** ("I am only a daughter").  
  - **Contrast with Self-Deception:**  
    - Ordinary self-deception: "I believe X but act as if not-X."  
    - Sartrean bad faith: **Collapsing transcendence into facticity** ("I *am* this role") OR **denying facticity** ("I could walk away guilt-free"). Maria does the former.  
  - **Why a "Shape of Life"?** Her avoidance is in **every action**: refusing respite care, shutting down conversations, performing martyrdom.  

  #### **Phase 4: Confront Determinism/Objections (15 mins)**  
  - **Trigger the Psychology Student:** *"But isn’t Maria’s behavior *caused* by upbringing/guilt neurons? Where’s the ‘choice’?"*  
    - **Timing Advantage:** Students now have vocabulary to respond.  
    - **Key Move:** *"Sartre agrees: psychology explains *why* she’s prone to bad faith. But it can’t erase her ontological freedom — her unavoidable responsibility to *live* her causes in a particular way.*"  
    - **Crucial Distinction:**  
      - **Causation:** *Why* Maria feels trapped.  
      - **Freedom:** *That* she must choose how to *inhabit* that feeling (e.g., as fate vs. a challenge).  
    - **Analogy:** A rock’s fall is *caused*; how Maria *interprets* carrying the rock is free. Psychology studies the weight; Sartre studies the carrying.  

  #### **Phase 5: Responsibility ≠ Blame & Oppression (5 mins)**  
  - **Question:** *"If Maria is ‘free,’ is she *to blame* for suffering?"*  
    - **Emphasize:** Responsibility ≠ moral fault. It means she’s the **author** of her *attitude* toward suffering. Society *caused* her burden; her bad faith *denies she can shape its meaning*.  
    - **Oppression Insight:** Bad faith lets oppressors off the hook ("They choose their suffering!") → **Correct:** Sartre *exposes* how bad faith *internalizes* oppression ("I deserve this") — it doesn’t *create* oppression.  

  #### **Closing Question to Test "Landing" (5 mins)**  
  > *"Describe a situation where you’ve said, ‘I had no choice.’*  
  > *Now: What facticity constrained you?*  
  > *And: What attitude did your ‘no choice’ claim help you avoid choosing?"*  

  This forces self-application. If they identify their *own* facticity/transcendence gap, Sartre landed. If they parrot Maria, it didn’t.  

  ---

  ### **Misconception Management**  
  - **Order They’ll Arise:**  
    1. **"Freedom = Can do anything!"** (Phase 1: Constraint discussion).  
    2. **"Determinism refutes this!"** (Phase 4: Preloaded with causation/freedom distinction).  
    3. **"Bad faith = lying to yourself"** (Phase 3: Lived structure vs. cognitive lie).  
    4. **"Responsibility = Blame"** (Phase 5: Explicitly decoupled).  
  - **Same Mistake?** "Freedom = no constraints" and "Responsibility = blame" both **flatten ontology into ethics**. Treat separately: first is about facticity, second about agency.  

  ---

  ### **What to Cut & Why**  
  - **Leave out:** The "look" or "pure reflection" as escape from bad faith.  
  - **Why:** At the undergraduate level, this risks mysticizing Sartre. Focus on the *diagnosis* of bad faith, not the cure. Say: *"We’re focusing on how bad faith operates, not Sartre’s full account of authenticity — that’s next week!"* This isn’t a cop-out; it ensures core ideas land without overload.  

  ---

  ### **Why This Works**  
  - **Maria** replaces the waiter: Same structure (role-playing as "essence"), but fresher, with *inescapable* constraints and visceral emotional stakes.  
  - **Circularity:** Solved by anchoring in pre-reflective consciousness (Phase 2) — bad faith as a *unified act* of flight, not self-debate.  
  - **Determinism:** Addressed when students can *use* facticity/transcendence to dissect causation vs. choice.  
  - **End Goal:** They don’t just "understand" bad faith; they *locate it in their lives*. That’s when it lands.
