prompt: |-
  I write a column on puzzles and paradoxes for a science-and-ideas outlet, and I've been stuck on the surprise exam for weeks now. You know the setup: the teacher says there'll be an exam next week, on a day you won't be able to predict the night before; the clever student runs the backwards induction, rules out Friday, then Thursday, all the way down to Monday, concludes there can't be an exam at all, and then gets blindsided on Wednesday. I'm not after "the solution" -- I've read enough hand-waving about knowledge and common knowledge to last me a lifetime. What I want, before I write a word, is the spec. What does any theory that claims to resolve this actually have to deliver? Give me the desiderata list. Which versions of the story must it get right -- the full five-day case, the stripped-down one-day case where the teacher says surprise exam tomorrow, a case where the announcement is made to only one student while the others hear nothing, a case where the teacher is known to be truthful versus known to be a joker who sometimes cancels, and two I made up: one where the teacher makes the announcement and then the principal backs it up by announcing that whatever the teacher just said is true, and one where two teachers each promise a surprise exam in the same week. And the distinctions it has to keep straight -- between the students not being able to derive the day and the day not being derivable, between the announcement being true and the students knowing it's true, between a surprise about the fact of the exam and a surprise about its timing, between the teacher being an ideal reasoner and the students merely believing he is one. For each requirement, tell me the case or consideration that puts it on the list.

  Then the part I actually care about: are any of these jointly unsatisfiable? I have a hunch that the announcement being consistent, the students being ideal reasoners, and the students knowing the teacher is telling the truth can't all hold at once in the one-day version but might in the five-day one, and I want to know whether thats a real tension or just me confusing myself. Flag which requirements are non-negotiable and which are just something one camp happens to like, and tell me which single requirement does the most to kill off the tidy answers -- the ones that either declare the announcement simply false or declare the student's reasoning simply silly. Oh, and if a candidate theory can only save the puzzle by quietly redefining what surprise means, say so plainly, because that's the move I most want to call out in the piece.
reasoning: |-
  Okay, the user is working on a column about the surprise exam paradox and they're stuck. They don't want the solution; they want the criteria for evaluating any proposed resolution. They mentioned several versions of the puzzle and distinctions that need to be addressed. Let me start by breaking down their main requests.

  First, they want a list of desiderata—what any theory must deliver. They listed multiple scenarios: the standard five-day, one-day with "surprise exam tomorrow," announcement to one student, truthful vs. joker teacher, principal backing up, and two teachers promising exams. Plus, they want certain distinctions like derivability vs. inability to derive, announcement truth vs. knowledge of truth, surprise about fact vs. timing, teacher as ideal reasoner vs. students' belief.

  I need to consider each case and why it's important. For example, the one-day scenario tests if surprise is possible when there's only one day. If a theory can't handle that, it's a problem. The single-student announcement tests common knowledge. The joker teacher introduces the possibility of false announcements, affecting how students interpret the announcement.

  The distinctions are crucial. The difference between the day not being derivable and students not being able to derive it relates to the students' reasoning limitations versus logical impossibility. This ties into whether the students are ideal reasoners or if there's bounded rationality.

  The user suspects a tension in the one-day version: consistent announcement, ideal reasoners, and knowledge of truth might be incompatible. That's a key point. In the one-day case, if the teacher says a surprise exam tomorrow, but the student knows it must be a surprise, they might conclude it can't happen. Yet if it happens, they're surprised. But how can they be surprised if they knew it was possible? That's the crux. 

  I recall that some resolutions involve redefining "surprise" or introducing probabilistic elements. But the user wants to avoid hand-wavy solutions. They especially want to flag theories that redefine "surprise" without acknowledgment. So, desiderata must include that "surprise" should be epistemic (unpredictable given current knowledge) without shifting definitions.

  Another point: the principal's announcement adds common knowledge. If the teacher says it, students might doubt, but the principal confirming should reinforce. But does that change anything? In standard logic, common knowledge is key to the paradox, so a theory needs to explain why adding more layers doesn't resolve the contradiction.

  The two-teachers scenario is interesting. If both promise surprise exams, but only one exam happens, how do students reconcile that? This tests if the theory can handle multiple announcements and their interactions. 

  Now, the user's hunch about the one-day case. They think consistent announcement, ideal reasoners, and knowledge of teacher's truthfulness can't coexist in one-day but might in five-day. Let me think. In one-day, if the exam is on the only day, how can it be a surprise? The student expects it. But if no exam, the announcement is false. So the only consistent outcome is the exam happening without surprise? But then the announcement is falsified because it wasn't a surprise. That’s the tension. Some argue the announcement is self-refuting, making it impossible to satisfy all conditions simultaneously in the one-day case. For five-day, the backward induction creates a similar issue, but the last day (Friday) is eliminated first, leading to contradiction earlier. So the desiderata must include handling this tension explicitly.

  Non-negotiable requirements: the exam must occur as announced, it must be a surprise, and the reasoning should reflect actual student/teacher behavior. However, ideal reasoners might be negotiable if bounded rationality is introduced. But the user wants to know which are essential.

  The requirement that kills tidy answers: the exam actually happening as a surprise. Tidy answers either say the announcement is false (but it's true in the story) or the student's reasoning is flawed (but they're ideal). This requirement forces theories to grapple with the paradox without dismissing it.

  Finally, redefining "surprise" is a red flag. For example, if a theory says "surprise" means low probability, but the paradox uses logical unpredictability, that's a quiet redefinition. The desiderata must demand that "surprise" remains epistemic unpredictability without shifting to probabilistic or subjective measures unless explicitly stated.
answer: |-
  Here's a rigorous spec for evaluating any "surprise exam" resolution theory, built from your cases and distinctions. The core challenge is satisfying the *apparent* inconsistency between the teacher's announcement and the students' ideal reasoning, while preserving the core phenomenon of surprise.

  **The Non-Negotiable Desiderata (What *Must* Be Saved):**

  1.  **The Exam Must Happen & Be a Surprise (Phenomenological Core):**
      *   **Case:** The standard 5-day narrative and its stripped-down variants (like 2-day or 3-day).
      *   **Why:** The essence of the paradox is that the exam *does* occur, and the student *is* genuinely surprised (e.g., blindsided on Wednesday). A theory that concludes the exam *cannot* happen or *cannot* be surprising fails the core narrative. Similarly, a theory where the student *shouldn't* be surprised also fails.
      *   **Distinction:** Surprise must be epistemic (unpredictability *given the student's knowledge and reasoning*) at the relevant time (the night before).

  2.  **The Announcement Must Be True (Minimal Fidelity):**
      *   **Case:** The teacher is known to be truthful (the standard setup).
      *   **Why:** The puzzle starts with a truthful announcement. A theory that simply declares the announcement false (e.g., "it was impossible, so the teacher lied") violates the story's premise, where the exam *does* happen as a surprise. Truth is foundational.
      *   **Distinction:** Truth of the announcement ("There *will* be a surprise exam next week") must hold.

  3.  **The Students' Reasoning Must Be Logically Valid (Respecting the Cleverness):**
      *   **Case:** The standard backward induction.
      *   **Why:** The paradox arises *because* the student's step-by-step elimination (Fri -> Thu -> ... -> Mon) seems flawless within the context of their knowledge. A theory that dismisses this reasoning as simply "silly" or "invalid" ignores the puzzle's power. The resolution must *explain* why this seemingly valid reasoning fails, not just deny its validity.
      *   **Distinction:** The reasoning must be logically sound *given the premises the student holds at each step*. The flaw must be found in the premises or their application, not the logic itself.

  4.  **The Teacher Must Be Able to Consistently Make the Announcement (Teacher's Rationality):**
      *   **Case:** All versions where the teacher is truthful and intends to give a surprise exam.
      *   **Why:** The teacher isn't depicted as irrational or lying in the core story. A resolution shouldn't require the teacher to be acting incoherently or making an impossible promise from *their* perspective at the time of announcement. The plan must be feasible for the teacher.

  **The Critical Test Cases (What A Robust Theory *Should* Handle):**

  5.  **The One-Day "Surprise Exam Tomorrow" Case (The Crucible):**
      *   **Case:** Teacher says: "There will be a surprise exam tomorrow."
      *   **Why:** This isolates the core tension. Can a single-day surprise *ever* occur under the announcement? The student reasons: "If it's tomorrow, I know it's tomorrow, so it can't be a surprise. Therefore, it won't happen." The exam then happens, surprising the student. How is this possible? Any theory *must* grapple with this minimal paradox. Failure here often dooms the theory.
      *   **Tension:** This is where your hunch hits hardest. Consistent Announcement (True & Possible) + Ideal Student Reasoners + Student Knows Teacher is Truthful *appear* jointly unsatisfiable. If the student *knows* the teacher is truthful, and the teacher *says* a surprise exam is tomorrow, the student *must* conclude it's impossible (as they do), seemingly falsifying the announcement *in advance*. Yet, it happens. Resolutions must break this apparent deadlock.

  6.  **Partial Knowledge (The Single-Student Case):**
      *   **Case:** The teacher makes the announcement privately to one student; others hear nothing.
      *   **Why:** Tests the role of **common knowledge** vs. mere individual knowledge. The informed student *should* be able to run the backward induction and be surprised. The uninformed students *shouldn't* be surprised (they had no warning), but the exam should still be a surprise *for the informed student*. A theory relying solely on common knowledge failure struggles here, as the informed student *individually* faces the paradox.

  7.  **The Unreliable Teacher (The Joker):**
      *   **Case:** The teacher is known to occasionally make false announcements or cancel plans.
      *   **Why:** Tests the necessity of **certainty** about the teacher's truthfulness/intent. If surprise can occur even when the student *lacks* absolute certainty the exam will happen (only believes it's *likely* or *possible*), it weakens arguments relying solely on the impossibility derived under perfect certainty. It points towards probabilistic or belief-revision models.

  8.  **Reinforced Announcement (Principal's Backup):**
      *   **Case:** Teacher announces, then Principal immediately announces: "What the teacher just said is true."
      *   **Why:** Tests the robustness of **common knowledge generation**. If the teacher's announcement alone was insufficient for the students to definitively run the induction (e.g., due to doubts about the teacher's meaning or intent), the Principal's statement should solidify it. Does this reinforcement make the paradox *worse* (strengthening the impossibility argument) or change nothing? A theory needs to explain why extra layers of confirmation don't necessarily prevent the surprise.

  9.  **Competing Announcements (Two Teachers):**
      *   **Case:** Teacher A: "I will give a surprise exam sometime next week." Teacher B: "*I* will give a surprise exam sometime next week." (Only one exam actually occurs).
      *   **Why:** Tests the **scope of the prediction** and **resource constraints**. The students know only one exam *can* happen. How do they reason? Do they run inductions for each teacher separately? Do they try to predict which teacher will act? Does this scenario make surprise *easier* or *harder* to achieve? Highlights if the surprise is relative to a specific commitment.

  **Essential Distinctions A Theory Must Respect:**

  10. **Not Derivable vs. Cannot Derive (The Knowledge Gap):**
      *   **Distinction:** Is the day *logically undecidable* from the announcement + knowledge (stronger), or is it merely that the *students*, due to their reasoning limitations or epistemic state, *cannot* derive it (weaker)?
      *   **Why:** Critical for pinpointing the flaw. Does the backward induction fail because the conclusion "no exam possible" is *actually false* (day is not derivable), or because the students *mistakenly believe* they've derived it (they cannot derive the correct day)? Most resolutions hinge on this.
      *   **Case:** Relevant to all versions, especially contrasting ideal vs. bounded reasoning theories.

  11. **Announcement True vs. Known True (The Epistemic Layer):**
      *   **Distinction:** The announcement *is* true vs. the students *know* (or justifiably believe) the announcement is true.
      *   **Why:** The paradox often arises from what the students *know* and *when* they know it. A truthful announcement doesn't guarantee the students have perfect, immutable knowledge of its truth or implications at all times. Their knowledge/belief state may evolve.
      *   **Case:** Central to the one-day case and the unreliable teacher case.

  12. **Surprise (Fact) vs. Surprise (Timing):**
      *   **Distinction:** Being surprised *that* the exam happens at all vs. being surprised *when* it happens (knowing it *will* happen sometime).
      *   **Why:** The standard announcement ("sometime next week") implies the exam *will* happen; the surprise is purely about the timing. The one-day announcement ("tomorrow") potentially mixes surprise about fact *and* timing. A theory must clarify what "surprise" refers to in each context.
      *   **Case:** Crucial distinction between the standard multi-day case and the one-day case.

  13. **Teacher Ideal Reasoner vs. Students Believe Teacher Is:**
      *   **Distinction:** The teacher *is* an ideal reasoner vs. the students merely *believe* the teacher is an ideal reasoner (even if they aren't).
      *   **Why:** Impacts the students' trust in the feasibility of the teacher's plan. If students believe the teacher is ideal, they might trust that the teacher *can* pull off a surprise, affecting their own reasoning. The teacher's actual reasoning capacity might be irrelevant if the students impute idealness.
      *   **Case:** Relevant when considering if the teacher's plan relies on anticipating student reasoning.

  **Identifying Tensions and Problem Areas:**

  *   **Your Hunch is Correct (The One-Day Crucible):** The requirement that the **Exam Must Happen & Be a Surprise (1)** under the conditions of **Ideal Student Reasoners (3)** and **Students Know Teacher is Truthful (implied by 2 & context)** in the **One-Day Case (5)** creates the most intense tension. It *feels* logically impossible. Resolutions *must* break one of these *for the student at a specific time*:
      *   **Deny Ideal Reasoning:** Argue the student isn't truly ideal/perfectly rational at the moment of reasoning (e.g., due to self-referential confusion, belief revision).
      *   **Deny Full Knowledge:** Argue the student doesn't *know* the exam is impossible at the time they reason (e.g., the announcement creates a context where the conclusion "no exam" is unstable; knowledge evolves).
      *   **Redefine Surprise (Carefully):** Argue "surprise" doesn't mean "logically impossible to predict" but something weaker (e.g., "not assigned high probability," "not expected *with certainty*"). *(See "Redefining Surprise" below)*.
      *   **Deny Consistency (Subtly):** Argue the announcement, while true, makes the student's *initial belief state* inconsistent, forcing a revision *when the exam happens* that explains the surprise. The surprise wasn't possible *given their initial beliefs after the announcement*, but the exam forces a belief update.

  *   **The Tidy Answer Killer:** The single requirement that most effectively dismantles the "tidy answers" (declaring announcement false or student reasoning silly) is **Requirement 1: The Exam Must Happen & Be a Surprise**. Any theory that concludes the exam *can't* happen (making the announcement false) or that the student *shouldn't* be surprised (making their reasoning irrelevant to the actual surprise) blatantly contradicts the core narrative we're trying to explain.

  *   **Redefining Surprise (The Cardinal Sin):** This is the most common sleight of hand. Watch for theories that:
      *   **Shift to Probability:** Defining "surprise" as "low probability" or "unexpected" instead of "unpredictable *with certainty* the night before." This fundamentally changes the puzzle. The student's backward induction relies on *certainty* of elimination ("It *can't* be Friday...").
      *   **Shift to Psychological State:** Defining surprise purely as a subjective feeling disconnected from the logical implications of their knowledge. The puzzle is about rational prediction failure.
      *   **Shift to Ignorance of Meaning:** Suggesting the students misinterpret "surprise" or the teacher's intent. The standard puzzle assumes shared understanding.
      *   **Why it's a problem:** It changes the rules. The paradox arises specifically from the *logical* interpretation of "surprise" as "unpredictable with certainty." Redefining it post-hoc to avoid the contradiction dodges the genuine logical puzzle. A good theory must preserve the core epistemic meaning of surprise as *unpredictability based on current knowledge* while resolving the inconsistency.

  *   **Negotiable Requirements:** While core, **Ideal Student Reasoners (3)** is often the lever pulled by resolutions (e.g., introducing bounded rationality, belief revision dynamics, or semantic instability). Similarly, the strength of **Students Know Teacher is Truthful** can be nuanced, especially in the Unreliable Teacher case **(7)**. **Common Knowledge** is frequently identified as the root issue, making requirements depending on it (like the flawless backward induction requiring it) potentially resolvable by its absence or fragility.

  **In Summary:**

  A viable resolution theory must:
  1.  **Preserve the Phenomenon:** Explain how the exam happens and surprises the student(s).
  2.  **Maintain Truth:** Keep the teacher's announcement true.
  3.  **Respect the Reasoning:** Explain why the backward induction *seems* valid but fails, without dismissing it as illogical.
  4.  **Pass the One-Day Test:** Provide a coherent account of the minimal paradox.
  5.  **Handle Key Variations:** Explain the impact of partial knowledge, unreliability, reinforcement, and competition.
  6.  **Respect Distinctions:** Clearly address derivability, knowledge states, surprise types, and reasoner assumptions.
  7.  **Avoid Definitional Drift:** Keep "surprise" firmly in the epistemic/logical realm of unpredictability without resorting to probabilistic or subjective redefinitions to dodge the contradiction.

  The fundamental tension lies in the One-Day Crucible **(5)** where requirements **1** (Happen/Surprise), **2** (True Announcement), **3** (Ideal Students), and the implied knowledge of the teacher's truthfulness collide. Breaking this tension without redefining the core terms is the litmus test. Any theory that quietly changes what "surprise" means to avoid this clash deserves the scrutiny you plan to give it. Good luck with the column! This paradox remains deliciously thorny precisely because it probes the foundations of knowledge, prediction, and self-reference.
