  The user provided four fixed cases the theory must handle: the ventilator pair (withdrawal vs non-initiation), sustained rescue (continuous intervention), engineered omission (pre-planned inaction), and institutional omission (system-level patterns). The key challenge is to identify conflicting desiderata that can't be jointly satisfied.

  Hmm, the most significant tension arises between the baseline flexibility requirement (Desideratum 4) and the intervention problem (Desideratum 3). Flexible baselines are needed to explain shifting intuitions across cases, but this clashes with cases where artificial interventions sustain life - here the "natural course" baseline fails, yet we still see withdrawal as allowing rather than doing. Meanwhile, the normative weight requirement (Desideratum 1a) pressures the theory to connect the distinction to permissibility, but this risks circularity if the distinction itself depends on prior normative judgments about what counts as interference.

  The baseline problem seems most exclusionary against standard accounts because it undermines both causal theories (relying on natural course) and status-quo theories (which fix baselines arbitrarily). Even sophisticated counterfactual approaches struggle with engineered omissions where the pre-arranged scenario becomes the new normal. This core difficulty persists across causal, intention-based, and status-quo accounts.

  For the incompatibility argument: Desideratum 3 demands that withdrawing artificial sustenance counts as allowing, yet Desideratum 4 requires variable baselines. But if the baseline shifts to include life-support as the status quo, withdrawal should then count as doing harm - yet we intuitively judge it as allowing. This contradiction can only be resolved by either abandoning the intervention intuition (unacceptable given ventilator cases) or conceding that baselines are normatively loaded from the start - which collapses the distinction with the normative question.
answer: |-
  Here is a specification of desiderata for an adequate theory of the doing/allowing distinction, presented as a numbered list incorporating your requirements and fixed points. Following this, I identify the core incompatibility and the most exclusionary requirement.

  **Specification of Desiderata for an Adequate Theory of the Doing/Allowing Distinction:**

  1.  **Normative Weight & Case Classification:**
      *   *Requirement:* The theory must correctly classify paradigm cases of doing (e.g., pushing into a river) and allowing (e.g., failing to throw a lifebuoy) and explain *why* the distinction makes a normative difference where it does (e.g., intuitively, killing is harder to justify than letting die) *and* why it is normatively inert where it is (e.g., cases where letting die seems as wrong as killing). It must yield verdicts consistent with our core intuitions about permissibility and impermissibility across cases where these diverge.
      *   *Motivation:* The distinction is philosophically significant primarily because it often tracks differences in normative assessment (e.g., justification, blame). A theory failing this cannot explain *why* we care about the distinction. The fixed points (a, b, c, d) are key test cases.

  2.  **Distinction Preservation:**
      *   *Requirement:* The theory must maintain the conceptual and practical separation between (i) *doing harm* versus *allowing harm*, (ii) *intending harm as a means or end* versus *merely foreseeing harm*, and (iii) the *causal* question (what event or absence made the crucial difference) versus the *normative* question (what conduct is permissible). It cannot reduce (i) to (ii) or (iii).
      *   *Motivation:* Collapsing these distinctions obscures distinct moral phenomena and explanatory resources. For example, intending versus foreseeing operates differently in double effect reasoning; conflating doing/allowing with causation ignores normative dimensions of agency. Fixed point (b) highlights the need to distinguish causal action (initiating poison) from action sustaining life (maintaining a pump), both involving "positive acts" but differing normatively.

  3.  **Intervention Problem:**
      *   *Requirement:* The theory must accommodate the intuition that ceasing life-sustaining interventions like turning off a ventilator or stopping a feeding pump counts as *allowing to die*, not *killing*, despite the continuous prior positive action required to sustain life. It cannot rely on a simplistic notion of a "natural course" unaffected by human technology.
      *   *Motivation:* The intuitive verdict in withdrawal-of-care cases (fixed point a) and sustained rescue cases (fixed point b) challenges accounts defining allowing solely in terms of non-interference with a pre-existing natural state.

  4.  **Baseline Flexibility:**
      *   *Requirement:* The theory must provide a plausible and non-arbitrary account of the *baseline* relative to which an omission is identified (i.e., what the agent is expected *not* to do). Crucially, it must explain why the intuitively correct baseline shifts across contexts (e.g., not donating a kidney vs. not providing basic nourishment).
      *   *Motivation:* Identifying an omission requires knowing what constitutes "normal" or "expected" non-action in that context. The baseline problem is pervasive: fixed point (a) contrasts non-initiation vs. withdrawal (different baselines?), fixed point (c) involves deliberately creating a future baseline where non-action causes harm, and fixed point (d) involves institutional rules defining systemic baselines.

  5.  **Conduct vs. Motive:**
      *   *Requirement:* The theory must ground the doing/allowing distinction primarily in features of the *agent's conduct* (what they physically did or didn't do, their causal role) rather than solely in their *intentions*, while acknowledging intention's role in normative assessment. The distinction itself should not be *defined* by intention.
      *   *Motivation:* Legal liability (criminal law, tort) and core ethical reasoning (e.g., in clinical ethics) often require assessing conduct independently of motive to ensure objective standards and practical applicability. Fixed point (c) (engineered omission) tests whether deliberate planning converts omission into doing purely via intention.

  6.  **Scalarity & Practical Application:**
      *   *Requirement:* The theory must clarify whether the distinction is fundamentally binary (doing/allowing) or scalar (degrees of involvement), and if scalar, how it integrates with binary rules (e.g., "Do not kill"). Crucially, it must be applicable by agents with limited epistemic access (especially to others' motives) and limited time.
      *   *Motivation:* Rules relying on the distinction (e.g., end-of-life decisions, rescue laws) must be usable in real-world decision-making. If the distinction is overly complex or requires inaccessible knowledge (like precise intentions), its practical utility is undermined. Fixed points (d) (institutional omission) and (c) (engineered omission) test the need for clear, applicable criteria often divorced from individual intent.

  **The Core Incompatibility:**

  The most significant tension arises between **Desideratum 4 (Baseline Flexibility)** and **Desideratum 3 (Intervention Problem)**.

  *   **Desideratum 4** demands that the baseline defining what counts as an omission (and hence allowing) is context-sensitive and shifts intuitively across cases (e.g., not starting ventilation vs. stopping it; not donating a rare organ vs. not giving bread to a starving person).
  *   **Desideratum 3** demands that stopping an artificial intervention (like a ventilator) counts as allowing, *even though* the baseline state (the patient alive) is entirely dependent on that intervention. The "natural course" without intervention is death.
  *   **The Conflict:** To satisfy Desideratum 3, the theory must explain why stopping the ventilator is allowing death, not causing it. This seems to require adopting the *current artificially sustained state* (patient alive on vent) as the baseline relative to which stopping the vent is an omission. However, Desideratum 4 requires that baselines shift. In the *non-initiation* case (fixed point a), the intuitive baseline is the *pre-intervention state* (patient dying naturally), making non-initiation an omission relative to *that* baseline. A theory using a single, fixed baseline (e.g., always the "natural" state) violates Desideratum 3 (stopping the vent should be allowing, not doing). A theory using a shifting baseline faces the challenge of non-arbitrarily specifying *which* baseline applies in *which* context without collapsing into circularity (defining the baseline by the desired verdict) or normatively loading the baseline itself, potentially conflicting with Desideratum 2 (distinction preservation, especially causal vs. normative). Defining the baseline often seems to presuppose a prior normative judgment about what the agent was required to do or not do, threatening the distinction's independence.

  **The Most Exclusionary Requirement:**

  **Desideratum 4 (Baseline Flexibility)** is the primary obstacle for standard accounts.

  *   Causal accounts struggle because the "normal course" is disrupted by technology (Intervention Problem), and causal relevance often depends on the chosen baseline.
  *   Intention-based accounts fail because the distinction is meant to track conduct, not motive (Desideratum 5), and baseline shifts occur independently of intent.
  *   Status-quo or counterfactual baseline accounts face the inherent difficulty of non-arbitrarily selecting *which* status quo or counterfactual scenario defines the omission across diverse contexts like non-initiation vs. withdrawal, or engineered scenarios (fixed point c), without the baseline itself being determined by antecedent normative judgments about duties, thereby collapsing the distinction with the normative question it's meant to inform (Desideratum 2). The requirement for flexibility exposes the deep challenge of grounding the distinction in a purely descriptive feature of the world or agency.
