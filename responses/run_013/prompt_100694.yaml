  ### Final Activity Design: The Three Stances Game

  #### Machine Specifications
  **Grid**: 6x6 toroidal (wrap-around) grid. Coordinates (x,y) where x (row) and y (col) range from 0 to 5. Wrap is handled via modulo 6.  
  **Markers**:  
  - F1 starts at (0,0)  
  - F2 starts at (5,5)  

  **Machine Behavior**:  
  - **Machine A (Dynamic Marker Tracker)**: Always moves toward the *current* position of the nearer marker (F1 or F2). Ties favor F1. On reaching a marker, it pauses for 1 tick, then heads to the other marker.  
  - **Machine B (Fixed Marker Tracker)**: Same as A, but uses *initial* marker positions (0,0) and (5,5) exclusively, ignoring any changes.  

  **Movement Rules (Both Machines)**:  
  1. **Distance Calculation**: Manhattan distance with wrap:  
     ```  
     dx = min(|x1 - x2|, 6 - |x1 - x2|)  
     dy = min(|y1 - y2|, 6 - |y1 - y2|)  
     distance = dx + dy  
     ```  
  2. **Choosing Direction**:  
     - Compute distance to target marker (F1 or F2).  
     - Move to the adjacent cell (up, down, left, right) that minimizes distance.  
     - **Tie-breaking** (if multiple moves yield same min distance): Prefer **right** → **left** → **down** → **up**.  
  3. **Pausing Logic**:  
     - Upon landing on a marker, output the same position for 1 tick (pause), then switch target.  
     - Pausing occurs *after* landing; movement resumes on the next non-pause tick.  

  **Initial State (Both Machines)**:  
  - Start position: (3,3)  
  - Initial target: F2 (distance to F1=6, F2=4)  
  - Pausing: `False`  

  **Output**: Sequence of positions (x,y) at each tick. Tapes for A and B are identical for the first 60+ ticks with markers fixed.  

  ---

  #### Round 1: Prediction Challenge (30 mins)  
  - **Teams**: 4-5 teams of 3-4 students.  
  - **Given**: Tape of **first 60 ticks** (positions 0-59) from **either A or B** (tapes identical).  
    ```  
    Tick  0: (3,3)    Tick 20: (0,0)    Tick 40: (0,0)  
    Tick  1: (3,4)    Tick 21: (0,5)    Tick 41: (0,5)  
    Tick  2: (3,5)    Tick 22: (5,5)    Tick 42: (5,5)  
    Tick  3: (4,5)    Tick 23: (5,5)    Tick 43: (5,5)  
    Tick  4: (5,5)    Tick 24: (5,0)    Tick 44: (5,0)  
    Tick  5: (5,5)    Tick 25: (0,0)    Tick 45: (0,0)  
    ... (pattern repeats every 6 ticks from tick 8)  
    Tick 59: (5,5)  [Full tape in [Appendix A](https://gist.github.com/yourusername/tape)]  
    ```  
  - **Task**:  
    - **Submit**:  
      1. **Description**: Concise explanation of behavior.  
      2. **Prediction**: Positions for ticks 60-69.  
    - **Scoring** (per team):  
      - `Score = (Number of correct predictions) - (Word count of description)`  
      - **Word count rule**: All non-whitespace tokens count. "It moves" = 2 words.  
  - **Rules**:  
    - May request **additional ticks** (forward only, no backtracking).  
    - Minimalist descriptions encouraged (e.g., "Seeks nearest marker, bounces between them" = 6 words).  

  ---

  #### Round 2: Intervention (20 mins)  
  - **Intervention**: Move F1 to (1,0) at **tick 60** (after initial 60 ticks).  
  - **Run both machines** for ticks 60-69 with new F1 position:  
    - **Machine A (adjusts)**:  
      ```  
      Tick 60: (5,5)  // Pauses at F2 (now at (5,5))  
      Tick 61: (5,0)  // Heads to new F1 (1,0)  
      Tick 62: (0,0)  // Continues toward (1,0)  
      ...  
      ```  
    - **Machine B (breaks)**:  
      ```  
      Tick 60: (5,5)  // Pauses at original F2 (5,5)  
      Tick 61: (5,0)  // Heads to original F1 (0,0)  
      Tick 62: (0,0)  // "Finds" F1 at (0,0) (but marker moved!)  
      ...  
      ```  
    - **Full tapes in [Appendix B](https://gist.github.com/yourusername/intervention)**.  
  - **Reveal**: Show both tapes. Emphasize that the *same intervention* produces divergent outcomes.  

  ---

  #### Round 3: Underdetermination Challenge (20 mins, optional)  
  - **Task**: Design an intervention to distinguish two hypotheses that:  
    1. Fit the initial tape (ticks 0-59).  
    2. Survive the Round 2 intervention (moving F1 to (1,0)).  
  - **Example Hypotheses**:  
    - **H1**: Tracks markers dynamically (like A).  
    - **H2**: Follows a fixed path cycle (ignoring markers entirely).  
  - **Sample Intervention**:  
    - **Teleport machine** to (2,2) at tick 70.  
    - **H1** recalculates path to nearest *current* marker.  
    - **H2** continues fixed cycle from (2,2), ignoring markers.  

  ---

  #### Debrief (10 mins)  
  - **Map to Dennett's Stances**:  
    - **Physical Stance**: Predicting from low-level mechanics (e.g., code, transition tables). *Revealed by machine specs*.  
    - **Design Stance**: Predicting from functional design (e.g., "seeks nearest marker"). *Used in descriptions*.  
    - **Intentional Stance**: Attributing beliefs/desires (e.g., "it wants F1"). *Emerges in anthropomorphism of B*.  
  - **Real Patterns**:  
    - **Compression**: A short description (e.g., "bounces between markers") compresses 60 ticks.  
    - **Projectibility**: Good descriptions predict future states (e.g., tick 60-69).  
    - **Reality**: Patterns are "real" if they support **counterfactual reasoning** (e.g., "if F1 moves, it should adjust").  
  - **Limitations of Activity**:  
    - **Mind-independent patterns?** No—patterns depend on interventions (B’s pattern breaks when markers move).  
    - **Rationality/idealization?** Cannot show the intentional stance’s reliance on *idealized rationality* (e.g., B is "irrational" after intervention but still follows its design).  
    - **Underdetermination depth**: Round 3 may not resolve if hypotheses are too similar or interventions too weak.  

  ---

  #### Pitfalls & Mitigation  
  1. **"Intervention is cheating"**:  
     - Frame it as **scientific testing** ("Your model must survive experiments").  
  2. **Anthropomorphizing B**:  
     - Leverage in debrief: "Why did we call B 'stubborn'? Is this intentional stance useful?"  
  3. **Overfitting descriptions**:  
     - Example: "Cycle: (0,0),(0,5),(5,5)..." fits ticks 8-59 but misses initial 8 ticks.  
     - **Scoring handles this**: Overfitted rules fail prediction (e.g., tick 60 = (5,5), not (5,0)). Allow submissions—let scoring penalize poor predictions.  
  4. **Time crunch**:  
     - Skip Round 3 if short on time; use extra time for debrief.  

  ---

  #### Confidence & Weak Points  
  - **Confidence**: **High** that the "aha" moment emerges when:  
    - Teams see identical tapes diverge after intervention.  
    - Minimalist descriptions (intentional/design stance) outperform physical-stance attempts.  
  - **Least Confident Part**: **Round 3**. Generating robust hypotheses that survive initial intervention is challenging. Mitigate by prepping example hypotheses.  

  ### Appendices (External Links)  
  - **[Appendix A: Full Tape (Ticks 0-59)](https://gist.github.com/yourusername/tape)**  
  - **[Appendix B: Post-Intervention Tapes (A vs B)](https://gist.github.com/yourusername/intervention)**  
  - **[Python Simulation Code](https://gist.github.com/yourusername/code)** (Run to validate tapes or extend the activity)  

  ---  
  **Run it**: Print tapes, scoring sheets, and machine specs. Emphasize prediction-intervention links to stances. Good luck!
