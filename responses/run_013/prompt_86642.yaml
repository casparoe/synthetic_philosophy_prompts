  Here is the adversarial collaboration statement on the Argument from Illusion, structured as requested. It incorporates the "looks-the-same"/"is-the-same" distinction as a central tool and focuses squarely on the illusion case.

  **Joint Adversarial Collaboration Statement: On the Argument from Illusion**

  **Authors:** [Disjunctivist Signatory] & [Sense-Datum/Representationalist Signatory]
  **Date:** October 26, 2023
  **Subject:** Addressing the Argument from Illusion: Common Ground, Disagreements, and Cruxes

  **Preamble:** This document addresses the specific challenge posed by *perceptual illusions* (e.g., a straight stick partially submerged in water appearing bent) to theories of perception. We focus on whether such cases necessitate a "common factor" shared between veridical perception and illusion, distinct from the perceived object itself. We distinguish carefully between **phenomenal similarity** ("looks-the-same" - how the experience feels/subjectively seems) and **metaphysical sameness of kind** ("is-the-same" - the fundamental nature of the experience/mental state). We bracket discussions of hallucination for this specific analysis.

  **Section 1: Agreed Claims** (Both signatories endorse the following statements)

  1.  **The Illusion Scenario is Real & Relevant:** The case of a straight stick appearing bent when partially submerged in water is a genuine and important phenomenon that any adequate theory of perception must explain.
  2.  **The Argument from Illusion's Core Premise:** In the illusion case, the subject has a perceptual experience *as of* a bent stick, even though they are veridically perceiving (i.e., causally interacting with) a straight stick.
  3.  **The Phenomenal Character:** The phenomenal character of the experience in the illusion case (what it's like to see the stick *as bent*) is different from the phenomenal character that would accompany the veridical perception of a genuinely bent stick in air. The illusion has its *own* distinctive subjective character: "seeming bentness despite knowing/deducing straightness."
  4.  **No Simple Object-Property Matching:** The illusion case demonstrates that the phenomenal properties of a perceptual experience (how things appear) do not always perfectly match the actual, mind-independent properties of the perceived object(s) (in this case, the stick's shape).
  5.  **The Explanandum:** Any theory of perception owes a substantive explanation of *why* the straight stick appears bent in these specific conditions. This explanation must account for the *phenomenal character* of the illusion.
  6.  **"Looks-the-Same" vs. "Is-the-Same":** It is crucial to distinguish:
      *   **(LTS) Phenomenal Similarity ("Looks-the-same"):** Whether two experiences are subjectively indistinguishable for the subject.
      *   **(ITS) Metaphysical Sameness of Kind ("Is-the-same"):** Whether two experiences belong to the same fundamental kind of mental state or share an identical constituent element (e.g., a sense-datum, a representational content).
  7.  **Illusion ≠ Hallucination:** The illusion case differs significantly from hallucination. In illusion:
      *   There *is* a perceived object (the stick).
      *   The subject *is* in causal perceptual contact with that object.
      *   Some properties of the object are veridically perceived (e.g., its color out of water, its location).
      *   The *specific* misleading appearance (bentness) is demonstrably caused by the interaction between the object, the subject, and the environment (water, light).
  8.  **The Argument Doesn't *Automatically* Establish Sense-Data:** The mere existence of illusion does not, by itself, *force* the acceptance of sense-data as non-physical objects or an irreducible relational component. Alternative explanations (representational, purely physical-dispositional, etc.) are possible in principle and must be evaluated on their merits.
  9.  **Disjunctivism Needs Specific Handling Here:** The disjunctivist position that veridical perception and non-veridical experience (hallucination) are fundamentally different kinds of states with no common element requires careful articulation when applied to *illusion*, where the "non-veridical" aspect is partial and occurs *within* a state of veridical perceptual contact.

  **Section 2: Disagreements & Cruxes**

  | Disagreement Point (Stated in Endorsable Terms)                                                                                                  | Disjunctivist Stance                                                                 | Sense-Datum/Rep Stance                                                                                      | **The Crux**                                                                                                  | **Test Case / Argument**                                                                                                                               | Disjunctivist Prediction                                                                                     | Sense-Datum/Rep Prediction                                                                                   |
  | :---------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- |
  | **D1/SDR1: The Fundamental Nature of the Illusion Experience:** Does the illusory experience (seeing straight stick *as bent*) share a *fundamental constituent or metaphysical kind* (ITS) with a veridical experience of a bent stick? | **No.** The illusory state is a complex state of *veridically seeing a straight stick under distorting conditions*. Its "bent-seeming" aspect is not a shared constituent but a relational property of this specific perceptual episode with the world. | **Yes.** The core subjective character "bent-stick-ishness" is a shared element (e.g., a sense-datum possessing bentness, or an identical representational content). | **Does the illusory 'bent-seeming' possess the same metaphysical status (e.g., object, content, property-instance) as the 'bent-seeming' in a veridical bent-stick experience?** | **The "Illusory Bentness" Itself:** Analyze the *ontological status* of the apparent bentness in the illusion. Is it an *instance* of the same type of property (e.g., phenomenal bentness) that occurs veridically? | The illusory bentness is *not* an instance of the same fundamental phenomenal property or object; it's an aspect of how the straight stick is *manifesting* under water. | The illusory bentness *is* an instance of the same fundamental phenomenal property (or involves the same type of sense-datum) as in veridical bent-stick perception. |
  | **D2/SDR2: Explaining Phenomenal Character (LTS):** What primarily explains why the illusion *feels the way it does* (LTS with a hypothetical veridical bent-stick experience in air)? | The phenomenal character is explained by the *actual properties of the object and the environment* (light refraction at water/air interface) causing the subject's perceptual system to respond *as it would* to a bent stick. The explanation is world + perceptual system focused. | The phenomenal character is explained by the presence of a specific *mental item* (sense-datum) with bentness or a specific *representational content* ("bent stick here"). The explanation is mental-state focused. | **Is the immediate cause and bearer of the specific phenomenal character *intrinsic to the subject's current mental state* or *extrinsic* (a relation to the object/environment causing a specific response)?** | **Perfect Neural Replication:** Imagine science perfectly isolates and replicates *only* the brain state corresponding to the "bent-stick-ishness" core of the illusion experience, detached from any external object or refraction. Would this state *feel* like seeing a bent stick? | **No.** The feeling of bentness is inseparable from the specific causal-perceptual relation to the *refracting environment*. A detached neural state might feel strange or like *nothing* recognizable. | **Yes.** The specific phenomenal character (LTS) is carried by the intrinsic properties of the brain state/sense-datum/content. The replicated state would feel *exactly* like the core "bent-stick-ishness". |
  | **D3/SDR3: The Role of the Common Factor:** Does the illusion case demonstrate the necessity of a common factor (ITS) *between veridical perception and illusion itself*? | **No.** The illusion is a case of *veridical perception under non-standard conditions*. There is no "common factor" shared between veridical and illusory experiences *in general*; each successful perceptual episode is constitutively tied to the objects perceived. The stick case is just seeing a straight stick *in water*. | **Yes.** The fact that the same phenomenal character (LTS) can be caused either by a bent stick (veridical) or by a straight stick in water (illusion) demonstrates that this phenomenal character (and its bearer/content) is a distinct element (ITS) common to both kinds of episodes. | **Is the phenomenal character (LTS) sufficient to define a kind of mental state (ITS) that can occur regardless of the external cause (bent stick or straight stick + water)?** | **The Phenomenal Kind Argument:** Consider the property *having an experience with phenomenal character C* (where C = "bent-stick-ishness"). Can this property C be instantiated in both the veridical bent-stick case and the straight-stick-in-water illusion case? | **Yes, but...** LTS is a *property* of the experience, but it doesn't define ITS. The *fundamental kind* of state (veridical seeing vs. illusion) differs, even if they share the property LTS. C is a property of different kinds of states. | **Yes, decisively.** The property *having an experience with phenomenal character C* is the *defining characteristic* of a specific kind of mental state (e.g., sensing a bent-stick sense-datum, tokening "bent-stick" content). Instantiating C *is* being in that state, regardless of cause. |

  **Section 3: Terminological Flag**

  *   **"Experience":** A significant portion of the disagreement stems from the ambiguity of the term "experience." The Disjunctivist primarily uses "experience" to denote *the successful perceptual relation to the object* (an achievement verb), where the illusion is a specific, complex way this relation manifests. The Sense-Datum/Representationalist primarily uses "experience" to denote *the conscious mental state with its intrinsic phenomenal character* (LTS), considered somewhat independently of the external cause. **This difference affects disagreements D1/SDR1 and D3/SDR3 fundamentally.** When the Disjunctivist says "No common factor," they mean no common fundamental *relational state*. When the Sense-Datum/Representationalist says "Common factor," they mean a common *phenomenal state or constituent*. The "looks-the-same" (LTS) vs. "is-the-same" (ITS) distinction helps isolate this, but the core dispute over what constitutes the primary "experience" remains.

  **Conclusion:** This statement clarifies our points of agreement regarding the illusion case and the Argument from Illusion. It identifies three core disagreements (D1/SDR1, D2/SDR2, D3/SDR3), each hinging on a specific crux question. For each crux, we propose a test case or argument and state our divergent predictions. Resolving these cruxes requires deeper investigation into the metaphysics of phenomenal properties, the causal basis of subjective character, and the fundamental categories of perceptual states. The terminological flag regarding "experience" highlights a persistent source of potential misunderstanding that must be navigated carefully. We agree that focusing on *illusion* forces a more nuanced confrontation than the hallucination debate alone.

