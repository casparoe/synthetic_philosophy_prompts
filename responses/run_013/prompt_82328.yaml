prompt: |-
  For most of the past year a friend and I have been re-litigating the anthropics debates over email, and I've come to suspect that the way both sides frame the disagreement is doing more of the work than either side admits. As I understand the two principles: the self-sampling assumption says that, all else equal, you should reason as though you had been drawn at random from among the observers who actually exist in your reference class; the self-indication assumption says that, all else equal, you should reason as though you had been drawn at random from all the observers who could possibly exist, weighted by how likely each is to exist, which is why on that assumption the bare fact that you exist is itself evidence that there are many observers rather than few. The standard illustrations are by now almost liturgical. The presumptuous philosopher is told that two rival theories remain, one on which the universe holds a modest number of observers and one on which it holds an astronomical number, and the self-indication assumption tells him he can settle the question from the armchair, near-certain of the astronomical version, which everyone agrees is absurd. The doomsday argument runs the other way: the self-sampling assumption, applied to the fact that your birth rank among all humans ever born is comparatively low, makes an early end to the species likely. If I have mangled either principle, correct my formulation before you use it.

  What I want from you is an example of a case that runs the presumptuous-philosopher complaint in reverse, one in which it is the self-sampling assumption, not the self-indication assumption, that manufactures the absurd degree of confidence. Two constraints. First, it has to be a case that a single person could actually be in and could have to act on, with the two assumptions recommending different actions and not merely different credences; I am not interested in the fate of the species or the size of the universe. I am not under the illusion that the disagreement can show up anywhere other than in a difference in how many observers the rival hypotheses posit, so if that is wrong, say so, but I do want the case packaged as something a person could face rather than as a question about cosmology or extinction. Second, I want to see the arithmetic, since the whole point is to watch a sampling rule do the damage, and I want the conclusion the self-sampling assumption reaches to be one its own defenders would be uncomfortable defending out loud.

  My own attempt, which I do not trust: a fair coin is tossed; on heads, one copy of me is created, in a single room with a red light; on tails, a thousand copies of me are created, one per room, and the experimenter has arranged that exactly one of the thousand rooms is lit red while the other nine hundred and ninety-nine are lit blue. I wake up in my room, see that the light is red, and am offered a bet: a dollar to me if I am the lone copy, a dollar ten from me if I am not. Work out what each assumption says about my credence and about whether I should take the bet; tell me honestly whether the case does the work I want or collapses into something I have misdescribed; and then give me the example you would actually put in print, the cleanest case you know of in which self-sampling rather than self-indication is the presumptuous one. Finally, if the two objections really are mirror images, say what that does to the force of the presumptuous-philosopher argument. As far as I can tell, each principle multiplies in the same observer-count factor and merely places it differently, one in the prior and one in the likelihood; I want to know whether that makes the argument a wash, or whether something breaks the symmetry.
reasoning: |-
  Okay, the user and their friend have been deep into anthropic reasoning debates for a year. They're questioning if the framing of self-sampling (SSA) and self-indication (SIA) assumptions hides deeper issues. The user wants a concrete example where SSA leads to absurd confidence, not SIA—like a reverse presumptuous philosopher. 

  First, I need to recall the core principles: SSA treats you as a random sample from actual observers, while SIA weights you by possible observers. The classic complaints are SIA making cosmology too easy (presumptuous philosopher) and SSA predicting doom (doomsday argument). 

  The user's constraints are strict: no big-picture scenarios, just personal actionable cases with clear math. Their own coin-toss/rooms example is a good start but flawed—it accidentally sneaks in SIA-like reasoning via the red light evidence. I should fix that. 

  Ah—the "Coin and Rooms" problem they proposed has a hidden flaw. When they condition on seeing red light, they're creating an uneven evidence weighting. Heads has 100% red observers, tails only 0.1%. That asymmetry artificially favors tails. To truly isolate SSA vs SIA, evidence must be unavoidable for all observers. 

  Better idea: remove the light entirely. Just wake up with no information. Now SSA says: 1000x more likely to be in tails world since more observers exist there. That's the absurd confidence—SSA alone makes you 99.9% sure of tails without evidence. Meanwhile SIA balances it back to 50-50. Perfect mirror of presumptuous philosopher! 

  For the bet: SSA says reject any wager below $999 payout (since tails is near-certain). SIA says accept even $1.01. And crucially, SSA defenders would squirm at claiming 99.9% certainty here—it feels wrong to decide a coin flip based on copies. 

  The symmetry insight: both principles multiply by observer count, but SIA puts it in the prior (correcting for selection bias) while SSA puts it in the update (treating existence as data). Neither is inherently absurd—context decides which selection effect applies. 

  Final polish: emphasize that in "no evidence" cases, SSA becomes the presumptuous one. That flips the script beautifully. User gets their reverse example, the math is clean, and the meta-point about framing lands. 

  ...Double-checking: does this satisfy "actionable bet"? Yes. "Arithmetic shown"? Yes. "SSA defenders uncomfortable"? Absolutely—claiming 99.9% on a fair coin feels silly. And it mirrors the philosopher's cosmic overconfidence. Nailed it.
answer: |-
  You've grasped the core principles well, and your frustration about framing is astute. Your "Coin and Rooms" example *almost* works but contains a subtle flaw that undermines it. Let's fix it, show the arithmetic, and then present the clean reverse-presumptuous case.

  **Fixing Your Example: The Flaw**
  The flaw is conditioning on seeing the red light *before* applying the anthropic principle. This introduces evidence that isn't "the bare fact that you exist." Observing red *is* informative evidence under both SSA and SIA because:
  *   On Heads, *all* observers see red (P(Red|Heads) = 1).
  *   On Tails, only *1/1000* observers see red (P(Red|Tails) = 0.001).

  Conditioning on red strongly favors Heads under both principles. The anthropic disagreement is masked by this strong conventional evidence.

  **The Reverse-Presumptuous Case: The Coin and Rooms (No Light Version)**

  Here’s the case satisfying your constraints:

  1.  **Setup:** A fair coin is tossed.
      *   **Heads (H):** One copy of you is created in Room 1.
      *   **Tails (T):** One thousand copies of you are created, one in each of Rooms 1 through 1000.
  2.  **Experience:** You wake up in a room. You have *no information* about the coin outcome or your room number. You just know the setup.
  3.  **Action:** You are offered a bet: "If the coin landed Heads (you are the only copy), you win $X. If it landed Tails (you are one of 1000 copies), you lose $1."
      *   **Question:** What is the smallest X where taking the bet has positive expected value according to SSA? According to SIA?
  4.  **The Absurdity:** We'll see SSA demands an absurdly high X, implying near-certainty you are in Tails.

  **The Arithmetic**

  Let:
  *   P(H) = P(T) = 0.5 (Fair coin prior)
  *   N_H = 1 (Observer count if Heads)
  *   N_T = 1000 (Observer count if Tails)

  **A. Self-Sampling Assumption (SSA)**
  *   **Reasoning:** You reason as if randomly sampled from the set of *actual* observers.
  *   **Probability of being "you" given a world:**
      *   P(You|H) = 1 / N_H = 1 / 1 = 1 (You are certainly the one observer)
      *   P(You|T) = 1 / N_T = 1 / 1000 (You are one random observer among 1000)
  *   **Applying Bayes' Theorem (Credence in Heads):**
      P(H|You) = [P(You|H) * P(H)] / [P(You|H) * P(H) + P(You|T) * P(T)]
                = [1 * 0.5] / [1 * 0.5 + (1/1000) * 0.5]
                = [0.5] / [0.5 + 0.0005]
                = 0.5 / 0.5005 ≈ **0.000998** (≈ 0.1%)
  *   **Credence in Tails:** P(T|You) ≈ 1 - 0.000998 = **0.999002** (≈ 99.9%)
  *   **Expected Value (EV) of the Bet:**
      EV = [P(H|You) * X] + [P(T|You) * (-1)]
          ≈ [0.000998 * X] + [0.999002 * (-1)]
          ≈ 0.000998X - 0.999002
  *   **Break-Even Point (Set EV >=0):**
      0.000998X - 0.999002 >= 0
      0.000998X >= 0.999002
      X >= 0.999002 / 0.000998 ≈ **1001.00**
  *   **SSA Conclusion:** You need to win **at least $1001** if Heads to consider taking the bet. SSA makes you **99.9% confident** you are in the Tails world (with 1000 copies) solely because you exist. This is the presumptuousness: near-certainty about the coin flip (and thus the number of observers) based *only* on the fact you exist.

  **B. Self-Indication Assumption (SIA)**
  *   **Reasoning:** You reason as if randomly sampled from all *possible* observers, weighted by the probability those observers exist.
  *   **Probability of being "you" given a world:** SIA effectively cancels the observer-count effect in the likelihood. Your existence is equally expected under both hypotheses *given their prior probabilities and observer counts*.
      *   P(You|H) ∝ P(H) * N_H = 0.5 * 1 = 0.5
      *   P(You|T) ∝ P(T) * N_T = 0.5 * 1000 = 500
  *   **Normalizing for Credence:**
      P(H|You) = P(You|H) / [P(You|H) + P(You|T)] = 0.5 / (0.5 + 500) = 0.5 / 500.5 ≈ **0.000998** (≈ 0.1%)
      P(T|You) = P(You|T) / [P(You|H) + P(You|T)] = 500 / (0.5 + 500) = 500 / 500.5 ≈ **0.999002** (≈ 99.9%)
      *Wait, that looks identical!?* **This is the critical mistake.** SIA modifies the *prior*, not the likelihood applied to the evidence "I exist". The correct application is simpler:

  *   **SIA Adjusted Prior:** SIA says your existence is evidence *for* worlds with more observers. It shifts the prior probability of a hypothesis proportionally to its predicted number of observers before conditionalizing on "I exist".
      *   Original Prior: P(H) = P(T) = 0.5
      *   SIA Prior: P_SIA(H) ∝ P(H) * N_H = 0.5 * 1 = 0.5
               P_SIA(T) ∝ P(T) * N_T = 0.5 * 1000 = 500
      *   Normalize: Total = 0.5 + 500 = 500.5
               P_SIA(H) = 0.5 / 500.5 ≈ **0.001** (≈ 0.1%)
               P_SIA(T) = 500 / 500.5 ≈ **0.999** (≈ 99.9%)
  *   **Credence:** Since you have *no other evidence* ("I exist" is the only data, and SIA already accounted for it in the prior), your posterior credence is just the SIA prior:
      P_SIA(H|You) = P_SIA(H) ≈ **0.001** (≈ 0.1%)
      P_SIA(T|You) = P_SIA(T) ≈ **0.999** (≈ 99.9%)
  *   **Expected Value (EV) of the Bet:**
      EV_SIA = [P_SIA(H|You) * X] + [P_SIA(T|You) * (-1)] ≈ [0.001 * X] + [0.999 * (-1)] ≈ 0.001X - 0.999
  *   **Break-Even Point (Set EV >=0):**
      0.001X - 0.999 >= 0
      0.001X >= 0.999
      X >= 0.999 / 0.001 = **999**
  *   **SIA Conclusion:** You need to win **at least $999** if Heads to consider taking the bet. SIA *also* makes you **99.9% confident** you are in the Tails world. This seems problematic!

  **Resolution & The Clean Example: The Coin and Rooms (Indexical Evidence Version)**

  The flaw above is that "I exist" isn't the *only* data. You also have indexical data: "I am *this specific* observer experiencing *this specific* awakening." SSA and SIA handle this differently.

  1.  **Setup:** Same as before (Fair coin: Heads=1 copy, Tails=1000 copies in Rooms 1-1000).
  2.  **Experience:** You wake up in a room. Crucially, **you learn your room number is 1**. (This is unavoidable; you always have *some* identifying indexical information).
  3.  **Action:** Same bet: Win $X if Heads, Lose $1 if Tails.
  4.  **The Absurdity:** SSA *still* produces extreme confidence in Tails based solely on the number of observers, even though your specific identity is equally consistent with both worlds.

  **The Arithmetic (With Room Number 1)**

  **A. Self-Sampling Assumption (SSA)**
  *   **Reference Class:** All actual observers.
  *   **Probability of being in Room 1:**
      *   P(Room1|H) = 1 (The one observer is in Room 1)
      *   P(Room1|T) = 1/1000 (One observer out of 1000 is in Room 1)
  *   **Applying Bayes' Theorem:**
      P(H|Room1) = [P(Room1|H) * P(H)] / [P(Room1|H) * P(H) + P(Room1|T) * P(T)]
                 = [1 * 0.5] / [1 * 0.5 + (1/1000) * 0.5]
                 = [0.5] / [0.5 + 0.0005] = 0.5 / 0.5005 ≈ **0.000998** (≈ 0.1%)
      P(T|Room1) ≈ **99.9%**
  *   **Expected Value & Bet:** Same as before. Needs X >= ~$1001. SSA says: **99.9% chance of Tails**.
  *   **The Absurdity:** You are in Room 1. This room exists in *both* possible worlds. There is nothing special about your experience or identity that distinguishes the worlds. Yet, SSA tells you you are almost certainly in the Tails world with 999 other copies, solely because more copies exist *there*. This is clearly presumptuous. Defenders *should* be uncomfortable claiming near-certainty about the coin flip based only on the *possibility* of other observers.

  **B. Self-Indication Assumption (SIA)**
  *   **Adjust Prior:** As before, SIA shifts prior probability mass towards worlds with more observers.
      *   P_SIA(H) ∝ 0.5 * 1 = 0.5
      *   P_SIA(T) ∝ 0.5 * 1000 = 500
      *   Normalize: P_SIA(H) = 0.5 / 500.5 ≈ 0.001; P_SIA(T) = 500 / 500.5 ≈ 0.999
  *   **Probability of Room 1 given world (Likelihood):** This is now conventional evidence. Who is in Room 1 doesn't depend on the total number of observers in a way SIA modifies *further*.
      *   P(Room1|H) = 1
      *   P(Room1|T) = 1/1000
  *   **Applying Bayes' Theorem with SIA Prior:**
      P_SIA(H|Room1) = [P(Room1|H) * P_SIA(H)] / [P(Room1|H) * P_SIA(H) + P(Room1|T) * P_SIA(T)]
                     = [1 * 0.001] / [1 * 0.001 + (0.001) * 0.999]
                     = [0.001] / [0.001 + 0.000999] ≈ 0.001 / 0.001999 ≈ **0.50025** (≈ 50.025%)
      P_SIA(T|Room1) ≈ **49.975%**
  *   **Expected Value (EV) of the Bet:**
      EV_SIA ≈ [0.50025 * X] + [0.49975 * (-1)] ≈ 0.50025X - 0.49975
  *   **Break-Even Point (Set EV >=0):**
      0.50025X - 0.49975 >= 0
      0.50025X >= 0.49975
      X >= 0.49975 / 0.50025 ≈ **$0.999** (≈ $1.00)
  *   **SIA Conclusion:** You need to win just **over $1.00** (e.g., $1.01) if Heads to take the bet. SIA says you are **approximately 50% confident** in Heads/Tails. Learning your specific room number (which is compatible with both worlds) counteracts the prior weighting towards many observers induced by SIA, bringing you back to near indifference.

  **Why This is the Reverse-Presumptuous Case & Satisfies Your Constraints**

  1.  **Personal & Actionable:** A single person wakes up, learns their room number, and must decide on a bet based *only* on the setup and their existence/identity. No cosmology, no species extinction.
  2.  **SSA Manufactures Absurd Confidence:** SSA produces **99.9% confidence** you are in the Tails world (1000 copies) solely because more observers exist there, even though your *specific* experience (being in Room 1) is *exactly equally* consistent with the Heads world (only Room 1 exists). This is profoundly presumptuous. Defenders would indeed struggle to justify this level of certainty based *only* on the potential for more observers. "I exist, and I'm in Room 1" should not make you 99.9% sure a fair coin landed tails and created 999 other rooms you have no evidence for.
  3.  **SIA Avoids Absurdity:** SIA, by weighting the prior by observer count and *then* conditioning on the indexical evidence (Room 1), yields near **50% confidence**, reflecting the symmetry of the situation. The bet recommendation is sensible.
  4.  **Arithmetic Shown:** The calculations clearly show the observer-count factor (N_T / N_H = 1000) dominating under SSA in the likelihood term (P(You|World)), leading to extreme confidence. Under SIA, the observer-count factor is placed in the prior adjustment, but conditioning on specific indexical evidence washes it out.
  5.  **Mirror Image Achieved:** The standard Presumptuous Philosopher uses SIA's prior shift (∝ N) to become absurdly confident in large universes *without needing any specific evidence*. This case uses SSA's likelihood shift (∝ 1/N) to become absurdly confident in the world with many observers *even when your specific evidence is perfectly compatible with the small world*.

  **The Symmetry and the Force of the Argument**

  You are correct: both principles involve multiplying by the observer-count factor (N), just in different places:
  *   **SIA:** P(SIA)(Hypothesis) ∝ P(Standard)(Hypothesis) * N (Prior adjustment)
  *   **SSA:** P(Data|Hypothesis) ∝ 1 / N (Likelihood adjustment for indexical data "I am a random observer")

  The Presumptuous Philosopher attacks SIA by showing its prior shift leads to absurd overconfidence in large-N hypotheses *without needing data*. The Reverse-Presumptuous case attacks SSA by showing its likelihood shift leads to absurd overconfidence in large-N hypotheses *even when the specific data is equally expected under small-N*.

  **Does this make the argument a wash?** Not entirely. Something breaks the symmetry: **the nature of the evidence.**

  1.  **"I exist" vs. Specific Indexical Data:** The bare datum "I exist" *is* more likely in a large universe under *any* sampling assumption that includes you in the reference class. SIA explicitly corrects for this selection effect by boosting large-N hypotheses *before* you conditionalize on "I exist". SSA applies the correction *after*, when interpreting "I exist" as "I am a random sample". Which approach is "correct" depends on whether you see "I exist" as a selection effect needing correction (SIA) or as the fundamental data to condition on (SSA). The reverse case highlights that SSA's conditioning on specific indexical data ("I am *this* observer") *combined* with its likelihood rule leads to overconfidence even when that specific data doesn't favor large-N.
  2.  **The Presumptuous Philosopher's Vulnerability:** The standard Presumptuous Philosopher is vulnerable because it relies *only* on the prior shift under SIA with *no* specific confirming evidence. The reverse case shows SSA is vulnerable when there *is* specific indexical evidence that *doesn't* favor large-N, yet SSA's likelihood rule still forces extreme confidence in large-N.
  3.  **Conclusion on Symmetry:** The objections *are* strong mirror images. Each principle, applied naively in the scenario designed to challenge the other, leads to an unacceptable, presumptuous degree of confidence driven solely by the observer-count factor. This symmetry significantly weakens the *unique* force of the Presumptuous Philosopher argument *against SIA*. It shows that SSA is just as susceptible to producing absurd overconfidence based on observer counts, just in a different class of problems (those involving specific indexical identification). The debate cannot be settled by simply pointing to the Presumptuous Philosopher; one must grapple with the reverse case too, suggesting anthropic reasoning is fundamentally thorny and no single simple principle (SSA or SIA) is universally valid without careful consideration of context and the type of evidence available. The symmetry pushes us towards more nuanced models (like Full Non-indexical Conditioning or approaches using indifference in centered propositions) or context-dependent application.
