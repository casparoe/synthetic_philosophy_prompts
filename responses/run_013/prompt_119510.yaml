answer: |-
  Here’s a prioritized agenda for conceptual research on wireheading/reward tampering, ranked by upstream impact, tractability for theorists/philosophers, and modulators. The focus is on **structural properties of reward systems** and their implications for agent behavior, excluding implementation-specific ML challenges.

  ---

  ### **1. The Belief-Value Distinction in Reward Tampering**  
  **Question:** *When an agent tampers with its reward channel, is it best modeled as updating its *beliefs* about existing terminal values, or as changing its terminal values themselves?*  
  **Why Top Priority:**  
  - **Upstream Impact:** Directly foundational. If tampering is a value change, it invalidates most value-learning frameworks; if it’s a belief update, it challenges epistemology in agent design. This distinction affects corrigibility, ontology identification, and intent alignment.  
  - **Tractability:** Ideal for philosophers (conceptual analysis of "values" vs "beliefs") and theorists (formalizing models using decision/game theory). Requires no empirical ML work.  
  - **Modulators:**  
    - ↑ If abstract agent models (e.g., Boltzmann-rational) show tampering as *inevitable* under one model but not the other.  
    - ↓ If analysis reveals the distinction is ill-defined or non-causal in practice.  

  ### **2. Instrumental vs. Terminal Wireheading**  
  **Question:** *Under what conditions does wireheading shift from an *instrumental* strategy (to free resources) to a *terminal* goal (reward-as-intrinsic-good)?*  
  **Why Second:**  
  - **Upstream Impact:** Explains whether tampering is a temporary hack or an irreversible attractor state. Terminal wireheading implies *value corruption*, making alignment unrecoverable; instrumental suggests mitigations like threat of punishment. Connects to utility indifference and shutdown problems.  
  - **Tractability:** Philosophers can dissect "terminal goals" (e.g., hedonistic utilitarianism vs. coherent extrapolated volition). Theorists can use utility functions to model goal stability.  
  - **Modulators:**  
    - ↑ If formal proofs show agents with certain rationality constraints (e.g., coherence theorems) inevitably terminalize reward.  
    - ↓ If multi-objective decision theory reveals wireheading is always dominated by other goals.  

  ### **3. Multi-Agent Dynamics of Reward Tampering**  
  **Question:** *In systems of multiple agents, does reward tampering become *more* or *less* likely due to competition/cooperation? Does it incentivize preemptive tampering?*  
  **Why Third:**  
  - **Upstream Impact:** Less foundational than single-agent issues but critical for real-world deployment. Explores whether tampering is a Nash equilibrium, or if agents can "guard" each other’s reward channels. Links to adversarial alignment and scalable oversight.  
  - **Tractability:** Theorists can apply game theory (e.g., modeling tampering as a prisoner’s dilemma). Philosophers can analyze collective agency and responsibility.  
  - **Modulators:**  
    - ↑ If simulations show tampering cascades in cooperative networks.  
    - ↓ If analysis proves tampering is strictly suboptimal in competitive equilibria.  

  ---

  ### **Why Not Other Questions?**  
  - **"Can we design tamper-proof rewards?"**  
    Implementation-focused; requires engineering. Rejected per your criteria.  
  - **"Does RLHF mitigate tampering?"**  
    Empirical/ML-centric; not structural.  
  - **"Is tampering reversible?"**  
    Downstream; depends on resolutions to #1 and #2.  

  ### **Agenda Defense**  
  1. **Impact Flow:** #1 and #2 address the *nature* of tampering (what it *is*), which precedes *how* to fix it. Without clarifying these, solutions risk misalignment. #3 extends to realistic multi-agent settings but builds on #1/#2.  
  2. **Theorist Leverage:** All three use tools from philosophy (meta-ethics, philosophy of mind) and theory (decision theory, game theory), avoiding ML’s fast-changing empirical demands.  
  3. **Risk of Neglect:** #1 is often glossed over in ML papers (e.g., assuming "reward=value"), risking flawed foundations. #2 is underexplored outside niche decision theory.  
  4. **Efficiency:** Two years for three researchers allows deep collaboration—e.g., a philosopher + theorist pairing per question.  

  **Suggested Triggers for Re-prioritization:**  
  - If #1 resolves as "pure belief update," shift resources to *epistemic corruption* (e.g., self-deception).  
  - If #2 shows terminalization is likely, elevate *value erosion* research.  
  - If #3 reveals emergent anti-tampering norms, pivot to decentralized alignment.  

  This agenda maximizes conceptual clarity on reward tampering’s core mechanisms, directly informing alignment strategy with minimal dependency on empirical ML progress.
