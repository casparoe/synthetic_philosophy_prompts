answer: |-
  Here is a specification of requirements for an adequate formulation of the Precautionary Principle (PP), grounded in philosophy of science, decision theory, and regulatory realities. I begin with brainstorming and proceed to the structured list.

  **Brainstorming: Demands & Desiderata**

  *   **Genuine Desiderata (Core Needs):**
      *   **Action-Guidance under Epistemic Scarcity:** Must provide practical direction when facing risk, uncertainty, ambiguity, or ignorance (per your stipulation).
      *   **Epistemic Humility:** Must acknowledge the limits of knowledge and the possibility of unforeseen consequences without collapsing into nihilism.
      *   **Avoidance of Paralysis:** Must not logically demand inaction in all circumstances due to ubiquitous ignorance or the principle's own application. Must enable decision-making.
      *   **Regulatory Feasibility:** Must be usable by bounded regulators with finite resources, time, and political capital. Requires procedural clarity and manageability.
      *   **Distinguish Prevention & Precaution:** Must conceptually or operationally differentiate action against specifiable risks (prevention) from action against poorly understood or currently unspecifiable potential threats (precaution).
      *   **Address Asymmetry & Power:** Must account for situations where the proponent of an activity controls the evidence or where harms disproportionately affect vulnerable groups.
      *   **Self-Consistency:** Must not undermine its own application or mandate impossible levels of proof when applied recursively.
  *   **Camp-Specific Commitments (Often Presented as Universal):**
      *   **Burden of Proof Shifting:** Demanding *always* shifting the burden onto proponents is a strong normative stance, not a neutral criterion. A weaker version (requiring proponents to *contribute* evidence) is more defensible.
      *   **"Strong" vs. "Weak" PP:** The degree of required protection (ban vs. monitoring) reflects value choices about acceptable risk/innovation levels, not inherent adequacy.
      *   **Rejection of Cost-Benefit Analysis (CBA):** Demanding the PP *replace* CBA entirely reflects a specific distrust of quantification/monetization. A more neutral demand is that the PP *constrain* or *inform* CBA under specific epistemic conditions.
      *   **Inherent Status Quo Bias:** Assuming the status quo is always safer is often empirically false (consider replacing lead pipes). The principle shouldn't *inherently* favor the status quo; it should evaluate *change* cautiously based on the specific epistemic context.
      *   **Ignoring Public Perception:** Demanding regulators *always* override public dread/novelty aversion ignores legitimate democratic input and the potential epistemic value of lay observations. The requirement should be to *consider* perception critically, not ignore or slavishly follow it.

  **Specification: Requirements for an Adequate Formulation**

  Ordered by narrowing power (most eliminative first):

  1.  **Epistemic Accommodation:** *Must explicitly define its scope and provide action-guidance for all four stipulated decision contexts (Risk, Uncertainty, Ambiguity, Ignorance), either via a single rule or a differentiated framework.*
      *   *Rationale:* The core justification for the PP is situations beyond standard probabilistic risk assessment (i.e., beyond "Risk"). A formulation silent on Ambiguity or Ignorance fails its primary purpose. This requirement immediately disqualifies formulations applicable only to "Risk" or "Uncertainty".

  2.  **Non-Paralysis (Decidability):** *Must logically permit action (including regulatory inaction) without requiring absolute certainty of safety or proof of the non-existence of harm under Ignorance. Must provide a pathway to make a decision even under profound ignorance.*
      *   *Rationale:* The fundamental paradox of precaution – acting to avoid unknown harms might *cause* unknown harms. A principle mandating precaution against *all* conceivable unknowns leads to infinite regress and paralysis. It must incorporate a stopping rule or prioritization mechanism.

  3.  **Self-Consistency under Ignorance:** *When applied recursively to the decision to invoke the PP itself (or to the actions it mandates), the principle must not demand levels of proof or certainty about its *own* consequences that are impossible under Ignorance, leading to self-defeat or infinite regress.*
      *   *Rationale:* If invoking the PP *is* an "activity" carrying potential unknown downsides (opportunity costs, displacement risks, unforeseen consequences of regulation), applying the PP *to itself* could forbid its own use. An adequate formulation must avoid this trap by design (e.g., through procedural focus, tiered triggers, or acknowledging irreducible judgment).

  4.  **Action-Guidance:** *Must provide concrete, non-tautological direction for decision-makers (regulators, firms, individuals) relevant to their level and resources. Must specify triggers, considerations, and permissible responses.*
      *   *Rationale:* Vague appeals to "caution" are useless. The PP must move beyond platitudes to offer operational rules or heuristics. Guidance must be scalable (different for a regulator vs. an individual) and resource-aware.

  5.  **Procedural Legitimacy & Feasibility:** *Must be implementable within realistic institutional constraints (resources, expertise, time, authority). Must specify processes for evidence gathering, evaluation (handling genuine vs. manufactured dissent), burden allocation, review, and revision. Must account for enforcement limitations.*
      *   *Rationale:* A beautiful theory unusable in practice is inadequate for public policy. Requires clear procedures for managing contested science, defining what constitutes "sufficient" evidence for triggers, and ensuring decisions can be reviewed as knowledge evolves. Must acknowledge that perfect compliance is impossible.

  6.  **Opportunity Cost & Foregone Benefit Accounting:** *Must explicitly require consideration of the reasonably foreseeable harms caused by applying precautionary measures, including displaced activities, delayed beneficial technologies, and the distributional impacts of both action and inaction.*
      *   *Rationale:* Precautionary measures are not cost-free. Foregone benefits (e.g., lives saved by a delayed medical technology) are real harms, often borne by vulnerable populations. Ignoring these is myopic and unethical. Requires comparative risk assessment, even if qualitative.

  7.  **Distinction Maintenance:** *Must conceptually or operationally distinguish between:*
      *   *Precaution (acting against poorly specifiable/unknown threats) vs. Prevention (acting against known/specifiable risks).*
      *   *Trigger (epistemic threshold for invoking precaution) vs. Strength (degree of protective action demanded) vs. Burden (evidentiary obligations).*
      *   *Magnitude/Potential Irreversibility of Harm (central to PP justification) vs. Probability (often unknown).*
      *   *Level of Application (defining appropriate triggers/actions for individuals, firms, regulators, courts).*
      *   *Rationale:* Conflating these leads to conceptual muddle and poor policy. Prevention uses different tools (e.g., safety factors). A weak trigger might demand weak action; a strong trigger might demand strong action – but these need separate calibration. Courts applying PP as a blunt instrument differs from regulators using it procedurally.

  8.  **Accommodation of Temporal Dynamics:** *Must account for lags, option values, and path-dependence. Specifically, must handle cases where delaying a decision closes off future options or where learning takes time.*
      *   *Rationale:* Decisions aren't static. Delaying a risky tech might allow learning, but delaying a harm-reducing tech *causes* ongoing harm. Inaction isn't neutral if it forfeits future flexibility ("option lapse"). PP must guide *when* to decide as well as *what* to decide.

  **Handling Your Cases & Distinctions:** The requirements above are designed to ensure the formulation *can* correctly handle your cases:
  *   **Early Evidence/Producer Bias:** Covered by Procedural Legitimacy (handling dissent, conflicts) and Action-Guidance (what to do with early warnings).
  *   **Delay of Beneficial Tech:** Covered by Opportunity Cost Accounting and Temporal Dynamics.
  *   **Risk Displacement:** Covered by Opportunity Cost Accounting and Non-Paralysis (demanding comparative assessment).
  *   **Status Quo vs. New Tech:** Covered by rejecting inherent Status Quo Bias (Req 7 distinction maintenance) – PP should focus on *change* and epistemic quality, not age. Favoring established tech *only* if evidence quality is truly identical *and* displacement risks are lower might be justified by Opportunity Cost/Comparative Assessment.
  *   **Unframed Harm:** Covered by Epistemic Accommodation (Ignorance) and Non-Paralysis (cannot demand proof of unframed harm).
  *   **Option Lapse:** Covered by Temporal Dynamics.
  *   **Infinite Loss/Small Probability:** Covered by Epistemic Accommodation (Uncertainty/Ignorance), Distinction Maintenance (Magnitude vs. Probability), and potentially influencing Trigger/Strength.
  *   **Prevention vs. Precaution, Triggers, etc.:** Explicitly covered by Req 7 (Distinction Maintenance).
  *   **SEU, Safety Factors, Perception, Compliance:** Covered by Action Guidance, Procedural Legitimacy, Opportunity Cost Accounting, and acknowledging SEU as a baseline constrained by PP under specific conditions.

  **Non-Negotiables vs. Preferences & Trade-offs:**

  *   **Non-Negotiable (Core Functionality):** 1 (Epistemic Accommodation), 2 (Non-Paralysis), 3 (Self-Consistency under Ignorance), 4 (Action-Guidance - at least minimally), 6 (Opportunity Cost Accounting).
  *   **Negotiable (Implementation Choices):** *How* burden is allocated (part of Req 5/7), *Degree* of protection (Strength in Req 7), Specific weight given to public perception (handled within Req 5/7), *Precise* procedural steps (Req 5).
  *   **Potential Trade-off/Conflict:** Achieving strong **Action-Guidance** (Req 4) under profound **Ignorance** (part of Req 1) without leading to **Paralysis** (Req 2) or **Self-Defeat** (Req 3) is the core tension. Robust **Procedural Legitimacy** (Req 5) is likely the key to resolving this, but it might make the principle less prescriptive ("strong") than some desire. **Opportunity Cost Accounting** (Req 6) might conflict with demands for maximal protection regardless of cost (**Strength** in Req 7).

  **The Crucial Requirement:** If keeping only one, **Epistemic Accommodation (Req 1)** eliminates the most candidates. Formulations ignoring Ambiguity or Ignorance (common in weaker versions or CBA-with-safety-margin) fail immediately. It forces the principle to confront its hardest justification.

  **Scoring Main Formulation Families:**

  | Requirement                 | Strong PP (Decision Rule - e.g., "Ban if doubt exists") | Burden of Proof Shift (e.g., "Proponent must prove safety") | Procedural PP (e.g., "Invoke process X under condition Y") | CBA with Safety Margin (e.g., "Apply discount rate Y or safety factor Z") |
  | :-------------------------- | :------------------------------------------------------ | :--------------------------------------------------------- | :--------------------------------------------------------- | :----------------------------------------------------------------------- |
  | **1. Epistemic Accommodation** | Poor (Ignores Ambiguity/Ignorance; focuses on doubt)    | Poor (Same as Strong; burden impossible under Ignorance)   | **Good** (Can explicitly design processes for each context) | Poor (Only handles Risk/Uncertainty; struggles with Ambiguity/Ignorance) |
  | **2. Non-Paralysis**        | **Fail** (Leads to bans/inaction for all unknowns)      | **Fail** (Proof under Ignorance impossible; paralysis)     | **Good** (Process mandates decision; iterative learning)   | **Good** (Always produces an answer)                                     |
  | **3. Self-Consistency (Ign)**| **Fail** (Applying it to itself forbids use)            | **Fail** (Same as Strong)                                  | **Good** (Processes apply to regulatory actions too)       | **Good** (Applies its own calculus consistently)                         |
  | **4. Action-Guidance**      | **Good** (Clear, if blunt)                              | Moderate (Shifts burden, but action still needs defining)  | Moderate (Guides process, not final decision directly)     | **Good** (Clear quantitative output)                                     |
  | **5. Procedural Legitimacy**| Poor (Ignores process, dissent, resources)              | Poor (Focuses only on burden)                              | **Good** (Core focus is legitimate process)                | Moderate (Relies on technical process, but can lack transparency)        |
  | **6. Opp. Cost Accounting** | Poor (Ignores costs of ban/displacement)                | Poor (Focuses only on activity's risks)                    | **Good** (Can mandate comparative assessment)              | **Good** (Core component)                                                |
  | **7. Distinction Maint.**   | Poor (Conflates everything)                             | Poor (Conflates trigger/burden/strength)                   | **Good** (Can define distinct triggers, processes, actions)| Moderate (Handles mag/prob via utility, less clear on Prec vs. Prev)     |
  | **8. Temporal Dynamics**    | Poor (Static)                                           | Poor (Static)                                              | **Good** (Can build in review, sunset clauses, option val)| Moderate (Discounting handles time, but poorly for option lapse)         |

  **Summary:** The **Procedural PP** formulation best satisfies the core non-negotiable requirements (especially 1, 2, 3, 5, 6), particularly crucial for handling Ignorance without paralysis. It struggles slightly with providing the most direct Action-Guidance (Req 4), as it mandates *how* to decide rather than *what* to decide. **CBA with Safety Margin** handles Risk/Uncertainty well but fails Epistemic Accommodation for Ambiguity/Ignorance. **Strong PP** and **Burden Shift** formulations fail catastrophically on Non-Paralysis and Self-Consistency under Ignorance, though they score well on direct Action-Guidance. An adequate formulation must be fundamentally *procedural* and *iterative* to navigate deep uncertainty and ignorance while avoiding paralysis and self-defeat.
