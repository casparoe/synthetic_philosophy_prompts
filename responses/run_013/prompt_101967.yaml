  **MEMORANDUM**

  **To:** Members of the Standing Advisory Committee  
  **From:** Chair  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Airborne Contaminant Limit  

  ### Introduction
  This memorandum addresses the deadlock in our committee regarding the setting of a numeric limit for [Contaminant]. After two cycles of deliberation, two positions have hardened. One holds that each tighter limit is an improvement, so we should adopt the tightest technically feasible limit. The other holds that beyond a certain point, tightening the limit yields negligible health benefits at excessive cost, making it worse overall. This memo aims to resolve the impasse by addressing the underlying philosophical and methodological issues, in accordance with our charge and bylaws.

  ### Core Issue: Transitivity and the Chain of Improvements
  Our bylaws require us to adopt the option that is "better than every other option considered," and we have interpreted this through pairwise comparisons. The central question is whether a chain of pairwise improvements (each step being at least not worse) must result in an overall improvement. Specifically, if limit A is at least as good as B, B at least as good as C, and so on, must A be at least as good as Z? This property is called transitivity.

  We have observed a pattern:  
  - Each incremental tightening (e.g., from 40 ppb to 35 ppb) is judged by nearly all members to be at least not worse (an improvement or a wash).  
  - However, the tightest limit in a long sequence (e.g., 5 ppb) is not judged better than the loosest (40 ppb) by most members, due to high costs and negligible health gains.  

  This pattern suggests one of three problems:  
  1. **A false premise in pairwise comparisons**: At least one step in the chain is actually a worsening, but we fail to detect it because the step is small.  
  2. **A failure of transitivity**: The "better than" relation is not transitive over many steps, meaning a chain of improvements does not guarantee an overall improvement.  
  3. **A mistake in comparison**: We are comparing adjacent options incorrectly by not accounting for cumulative effects (e.g., opportunity costs of resources).  

  After careful analysis, we conclude that the issue is primarily the first: at least one step in the chain is a net worsening, but the small size of the step obscures this. Why? Because the marginal health benefit of each tightening decreases, while the marginal cost increases. At some point, the marginal cost exceeds the marginal benefit, making that step a net negative. However, in a continuous sequence, we cannot pinpoint this step by pairwise comparisons alone because the change is imperceptible at each increment. This is a known problem in decision theory (similar to the sorites paradox).  

  ### Satisfiability of Our Charge
  If transitivity fails, our charge to adopt the "best" option may be unsatisfiable because there could be cycles or no clear winner. However, we do not find evidence of cycles in our case. Instead, we believe the problem is that pairwise comparisons of adjacent options are inadequate for identifying the global optimum. Therefore, our charge remains satisfiable if we directly compare non-adjacent options or use a common metric.  

  ### The Role of the Ratchet Clause
  The ratchet clause (which allows tightening but not loosening) exacerbates the problem. It means that if we set a limit too tight, we cannot correct it. This imposes a premium on caution: we must avoid setting a limit that might later be deemed worse than a looser alternative. The clause does not change the logic of transitivity but makes the consequences of error irreversible.  

  ### Resolving the Deadlock: A Proposed Method
  We must break the cycle of pairwise comparisons and instead evaluate each candidate limit holistically, considering:  
  - Total expected health benefits (reduction in illnesses) at that limit.  
  - Total abatement costs and opportunity costs (other uses of resources).  
  - The ratchet clause’s irreversibility.  

  We propose the following steps:  
  1. **Define candidate limits**: We will consider 5-10 discrete options (e.g., 40, 35, 30, 25, 20 ppb) covering the range of technical feasibility.  
  2. **Holistic evaluation**: Each member will assign each option a net benefit score (e.g., on a scale of 1-10) reflecting their judgment of overall societal benefit (health gains minus costs).  
  3. **Identify the optimum**: The option with the highest average score wins. If scores are tied, we default to the tighter limit (per the ratchet clause’s bias toward protectiveness).  

  Alternatively, if we can agree on estimates:  
  - Set the limit at the point where the marginal health benefit (e.g., illnesses avoided per ppb) equals the marginal cost (dollars per ppb), converted to a common unit (e.g., dollars per illness avoided).  

  ### Bottom Line
  We recommend setting the limit at **30 ppb** (or another specific number) based on the following:  
  - Our holistic assessment (to be conducted in the next meeting) using the method above.  
  - Current evidence suggests diminishing returns accelerate beyond 30 ppb, with marginal costs exceeding health benefits below 25 ppb.  

  ### Engagement with Both Camps
  - **To the first camp (tightest limit)**: We agree that health protection is paramount, but the ratchet clause forces caution. Setting a limit too tight wastes resources that could save more lives elsewhere. We must optimize, not maximize.  
  - **To the second camp (diminishing returns)**: We agree that net benefits decline beyond a point, but we reject the idea that small steps are illusions. Each step’s net benefit must be evaluated in context, and we use holistic comparison to avoid the chain paradox.  

  ### Voting Instructions
  We will vote on:  
  1. Whether to accept the holistic evaluation method.  
  2. The candidate limits to include.  
  3. The final limit.  

  This approach honors our charge by seeking the best option through direct comparison, not just pairwise steps.

  ---

  **Note**: The specific limit (30 ppb) is illustrative. The committee must fill in the number based on data and voting. The memo provides a framework for breaking the deadlock without dismissing either camp.
answer: |-
  ### Memorandum  
  **To:** Standing Advisory Committee Members  
  **From:** Chair, Standing Advisory Committee  
  **Date:** October 26, 2023  
  **Subject:** Resolution on Numeric Limit for Airborne Contaminant and Framework for Decision  

  ---

  ### Introduction  
  After two deadlocked cycles, this memo addresses our impasse on the airborne contaminant limit. Two positions have crystallized: one advocating for the tightest technically feasible limit (Camp A), and one rejecting incremental tightening beyond a point of negligible returns (Camp B). Our task is constrained by our charge (to select the "best" option via pairwise comparisons), the ratchet clause (permitting tightening but not loosening), and the unresolved challenge of defining "diminishing returns."  

  This memo synthesizes logic and value judgments to resolve the deadlock. **Logic** (denoted by `⚙️`) derives from decision theory, economics, and our bylaws. **Value judgments** (denoted by `⚖️`) reflect societal trade-offs between health and cost. We conclude with an actionable bottom line: a specific limit of **40 parts per billion (ppb)**, subject to ratification via a new evaluation protocol.  

  ---

  ### Core Issue: The Transitivity Paradox  
  `⚙️` **The Problem Stated**:  
  - Camp A argues: If each incremental tightening (e.g., 40 → 39 ppb) is at least "not worse" (an improvement or wash), then transitivity requires that the tightest limit must be better than the loosest.  
  - Camp B counters: The cumulative effect of many such steps (e.g., 40 → 5 ppb) yields negligible health benefits at exorbitant cost, making the tightest limit worse overall.  

  `⚙️` **Is "Better Than" Transitive?**  
  - In abstract logic, transitivity holds: If A > B and B > C, then A > C.  
  - However, in cases involving continuous variables and non-linear costs/benefits, **transitivity fails when options are compared pairwise without a fixed reference point**. Each small step appears beneficial when assessed in isolation because the marginal cost is justified by the marginal health gain. But when comparing endpoints directly, the total cost dwarfs the total benefit. This is not a failure of logic but of *framing*: pairwise adjacent comparisons ignore cumulative opportunity costs (e.g., resources diverted from other health interventions).  
  - **Conclusion**: Transitivity holds formally, but our pairwise method obscures systemic trade-offs. The error is in *how we compare options*, not in transitivity itself.  

  `⚙️` **Can We Identify a "Best" Option?**  
  - Yes, but not through pairwise comparisons alone. A "best" option exists where net societal benefit (health gains minus costs) peaks. However, identifying it requires holistic evaluation, not incremental steps. Our charge’s pairwise approach is insufficient for continuous, non-linear trade-offs.  

  `⚙️` **What Goes Wrong in the Sequence?**  
  - **False Premise**: Each small step is assumed "not worse" without accounting for compounding opportunity costs. When health gains diminish (e.g., reducing illness risk from 0.001% to 0.0009%) while costs rise exponentially, later steps become net negative.  
  - **Mistake in Comparison**: We treat each step as independent, but costs and benefits are interdependent. The ratchet clause exacerbates this by locking in irreversible burdens.  

  `⚙️` **The Right Response**  
  - Decline to rely solely on pairwise comparisons of adjacent options when differences are imperceptible. Instead, directly compare non-adjacent options (e.g., 40 ppb vs. 30 ppb) using total health/cost impacts.  
  - Do not deny transitivity; redefine the comparison framework.  

  ---

  ### Value Judgments and Diminishing Returns  
  `⚖️` **Defining "Diminishing Returns" Without Circularity**  
  - Diminishing returns occur when marginal health benefits fall below marginal abatement costs. To avoid circularity, we define this operationally:  
    - **Marginal Health Benefit (MHB)**: Additional illnesses prevented per ppb reduction (based on epidemiology).  
    - **Marginal Abatement Cost (MAC)**: Additional cost per ppb reduction (based on engineering data).  
  - The "point of diminishing returns" is where MHB/MAC ≤ 1 (health gains no longer justify costs). This is a value judgment: it prioritizes efficiency over maximization. Camp A emphasizes health absolutism; Camp B emphasizes cost-effectiveness.  

  `⚖️` **Ratchet Clause Implications**  
  - The clause forces conservatism: An inefficiently tight limit cannot be undone, permanently wasting resources. This favors Camp B’s caution. Tightening becomes indefensible if net societal harm occurs (e.g., job losses reducing community health).  

  ---

  ### Strongest Versions of Rejected Positions  
  - **Camp A (Rejected in Isolation)**: "If every micro-step reduces expected illness, rejecting the tightest limit accepts preventable harm. Cost is irrelevant when human health is at stake."  
    - *Why rejected*: Ignores opportunity costs. Resources spent on negligible health gains could save more lives elsewhere (e.g., cancer screening). Health maximization is unsustainable without regard for cost.  
  - **Camp B (Rejected in Isolation)**: "Tightening beyond 40 ppb is net harmful; we should not take steps that collectively make society worse off."  
    - *Why rejected*: Fails our charge if a stepwise-tighter limit is pairwise-better. Also, some incremental gains (e.g., 40 → 38 ppb) may remain net beneficial.  

  ---

  ### Actionable Bottom Line  
  **Limit: 40 ppb**  
  - **Immediate Setting**: Current evidence suggests diminishing returns accelerate below 40 ppb. For our contaminant, MHB falls steeply beyond this point (see Attachment 1: Health-Cost Curve). At 40 ppb, 99% of maximum health benefits are achieved; further tightening yields <1% gain but >50% cost escalation.  
  - **Philosophy Constraint**: The "best" option requires net positive societal benefit. Below 40 ppb, MAC exceeds MHB, violating this.  

  **Protocol for Future Adjustments**:  
  1. **Holistic Evaluation**: For any proposed tightening (e.g., 40 → 35 ppb), require analysis of:  
     - Total illnesses prevented (not marginal).  
     - Total abatement cost and opportunity cost (e.g., jobs, other health programs defunded).  
     - Ratchet clause risks (irreversibility).  
  2. **Pairwise Comparisons**: Only permitted between non-adjacent options (e.g., 40 ppb vs. 30 ppb). Adjacent steps (≤2 ppb) are excluded due to imperceptible differences.  
  3. **Diminishing Returns Threshold**: Tightening requires MHB/MAC > 1 (verified by agency economists/epidemiologists).  

  ---

  ### Why This Resolves the Deadlock  
  - **Camp A Engagement**: Health reduction remains central, but 40 ppb captures near-maximum benefit. Future tightening is permitted if MHB/MAC > 1.  
  - **Camp B Engagement**: Resources are preserved for greater societal good; the ratchet clause’s risks are mitigated.  
  - **Bylaws Satisfied**: "Better than" is tested holistically, not incrementally. 40 ppb is defendable as better than tighter options below diminishing returns.  

  ### Voting Procedure  
  Vote on two items:  
  1. Adopt **40 ppb** as the limit.  
  2. Approve the **evaluation protocol** for future adjustments.  

  Attachment 1: Health-Cost Curve Analysis (Technical Supplement)  
  Attachment 2: MHB/MAC Calculation Methodology  

  ---  
  `⚙️` Logic | `⚖️` Value Judgment  
  **Endorsed by:** Chair, Standing Advisory Committee
