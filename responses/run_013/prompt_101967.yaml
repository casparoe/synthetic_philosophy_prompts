  We are faced with a deep conceptual problem that has caused deadlock. The core issue is whether a chain of pairwise improvements (each step being at least not worse) must lead to an overall improvement. This is the question of transitivity: if A is better than B, and B is better than C, then A is better than C. But note: in our case, we are considering a chain of steps where each step (say, from limit L_i to L_{i+1}, a tighter limit) is considered at least not worse (i.e., an improvement or a wash). So we are asking: if L_1 is at least as good as L_2, L_2 at least as good as L_3, ... , L_{n-1} at least as good as L_n, then must L_1 be at least as good as L_n? This is transitivity of the relation "at least as good as".

  However, the pattern you describe shows that even if each step is granted as not worse (or even slightly better), the cumulative effect of many steps might lead to a situation where the tightest limit is clearly worse than the loosest when considering the entire chain. This suggests a failure of transitivity? Or is it that the initial pairwise judgments are flawed?

  But note: the two camps have different views. The first camp says: because each step is an improvement (or at least not a worsening), then the chain must lead to a better outcome. The second camp says: the fact that the chain leads to a clearly worse outcome (enormous cost for negligible gain) shows that at least one of the steps must have been a worsening, even if we didn't notice it at the time.

  However, there is a third possibility: that the pairwise comparison of adjacent steps is not the same as comparing non-adjacent steps because of the way costs and benefits interact. Specifically, the marginal health benefit per unit cost might be decreasing and eventually become negative (when the cost becomes too high for the tiny health gain). But in each small step, the cost might be justified by the health gain? Or perhaps not? This is the point of diminishing returns.

  But the problem is that we cannot identify a single step where the marginal benefit becomes less than the marginal cost? Why? Because the steps are small and the change is continuous.

  This is reminiscent of the "sorites paradox" (the paradox of the heap). We have a continuum of possible limits. The relation "better than" is not transitive over a long chain of very small improvements? Or is it?

  Alternatively, we might be making a mistake in the pairwise comparisons. In each adjacent pair, we are comparing the costs and benefits of tightening by that small increment. But when we compare non-adjacent options (like the first and last), we are looking at the total cost and total benefit. It is possible that each step taken in isolation (with the current technology and starting point) is justified, but the entire chain is not? But that seems inconsistent.

  Alternatively, we might be failing to account for the opportunity cost of the resources used in abatement. The resources used for abatement could be used for other health or social benefits. When we take a small step, the opportunity cost of that step (the resources used for that increment of abatement) might be small and the health gain might be worth it. But when we take many steps, the total opportunity cost becomes very large and the total health gain small, so the net effect is negative. This suggests that each step is indeed an improvement when considered in isolation (because the opportunity cost of that small resource diversion is small and the health gain is positive) but the cumulative effect is negative because the opportunity cost adds up to a huge amount and the health gains don't.

  However, this explanation requires that the opportunity cost of each step is borne in a way that doesn't interact with the previous steps. But in reality, the opportunity cost is about the total resources used. So when we evaluate step i, we are considering the cost of that step and the health benefit of that step. But if we have already taken steps 1 to i-1, then the cost of step i is the marginal cost of tightening from L_i to L_{i-1} (note: we are going from looser to tighter, so let's index from loose to tight: L0 (loosest) to Ln (tightest)). Then step i is moving from L_{i-1} to L_i. The health benefit of step i is the marginal health benefit of that step, and the cost is the marginal cost. If at each step the marginal health benefit is greater than the marginal cost (in terms of opportunity cost), then each step is an improvement. But then the entire chain should be an improvement. But that leads to the uncomfortable conclusion that Ln is better than L0.

  But the second camp says that Ln is worse than L0. Therefore, they must deny that every step is an improvement. They might argue that at some point the marginal cost exceeds the marginal benefit, but we cannot identify exactly where. So in the chain of pairwise comparisons, they would say that for some step i, moving from L_{i-1} to L_i is actually a worsening. But because the step is small, we cannot perceive it? Or because we are not measuring the opportunity cost correctly?

  This leads to the idea of "diminishing returns" and eventually negative returns. The point of diminishing returns is where the marginal benefit per unit cost starts to decrease. But even beyond that, as long as marginal benefit is positive and greater than marginal cost, it's still an improvement. The point where it becomes a worsening is when marginal cost exceeds marginal benefit.

  But the problem is that we cannot identify that point without circularity? Why? Because we are trying to set the limit and we don't have a clear way to measure the health benefits and costs in a way that allows us to compare them? Or because the committee cannot agree on how to value health vs. cost?

  Given the instructions, we must produce a written opinion that addresses:

  1. Whether "better than" is transitive? (If A is better than B and B is better than C, then A is better than C.)
  2. Whether the instruction to adopt the best option is satisfiable if transitivity fails?
  3. What goes wrong in the sequence: a false premise at some step, a failure of transitivity, or a mistake in how we compare options?
  4. The right response: accept the uncomfortable conclusion, deny transitivity, or decline to compare options that differ by imperceptible degrees?
  5. How the ratchet clause changes the answer.

  We must also reach an actionable bottom line.

  Proposed Structure for the Memo:

  1. Acknowledge the deadlock and the two positions.
  2. Analyze the transitivity question and the pattern of pairwise vs. cumulative comparisons.
  3. Conclude on what the problem is and how to resolve it.
  4. State the bottom line: a specific limit or a method to set it.

  Key Points:

  - The relation "at least as good as" (which we use for pairwise comparisons) is typically assumed to be transitive. But in this context, because of the continuous nature of the variable and the non-linear relationship between cost and benefit, we may be facing a situation where transitivity breaks down when we chain many steps. This is similar to the sorites paradox. However, in economics, we usually assume that preferences are transitive.

  - Alternatively, the problem may be that we are not using a common metric to evaluate the options. If we had a single metric (like net social benefit: health benefits minus costs, converted to a common unit), then transitivity would hold because the metric is a real number and the "better than" relation would be defined by that number. But we don't have such a metric. The committee is making holistic judgments.

  - The pattern you describe (each step is an improvement but the chain is not) suggests that the pairwise comparisons are being made with incomplete information. Specifically, when we compare adjacent limits, we are not considering the cumulative effect of the entire chain. We are only looking at the marginal step. But the resources used in each step have an opportunity cost that is not fully captured in the pairwise comparison because we are not accounting for the total resources that will be used. However, if each step is evaluated as having a positive net benefit (when considered in the context of the current starting point), then the chain should be positive. 

  - The second camp's point is that the cumulative cost is too high for the cumulative health gain. This suggests that we must look at the entire picture. Therefore, we should not rely solely on pairwise comparisons of adjacent limits. We must also consider non-adjacent comparisons.

  - Our bylaws require us to adopt the option that is better than every other option considered. But if we consider a set of options that are linearly ordered (each tighter than the next) and we find that each adjacent pair shows the tighter as at least as good, then by transitivity the tightest would be better than the loosest. But if we don't believe that, then we are forced to deny transitivity or to deny that the pairwise comparisons are correct.

  - The proposal to set the limit at the point of diminishing returns is attractive, but we must define it without circularity. We need an operational definition.

  Given the above, the memo might conclude:

  - We must reject the idea that every step is an improvement. The fact that the chain leads to an outcome that is clearly worse (by the committee's judgment) than the starting point indicates that at least one step in the chain must be a worsening. However, we cannot identify which step. Therefore, we need a method to find the point where the marginal benefit of tightening the limit equals the marginal cost.

  - But we don't have a common metric. Therefore, we must use the committee's collective judgment to directly compare non-adjacent options. We must break the deadlock by considering the entire range.

  - The ratchet clause makes it imperative that we do not set the limit too tight because we cannot loosen it. Therefore, we should be cautious and set the limit at a point that we are confident is net beneficial, even if we cannot prove it by pairwise steps.

  Actionable Bottom Line:

  Given the deadlock and the pattern, we conclude that the pairwise comparison method (comparing adjacent limits) is insufficient and potentially misleading. Therefore, we must consider the entire range of candidate limits and choose the one that we judge to be the best overall, using a holistic assessment of total health benefits and total costs.

  We will conduct a new evaluation of the candidate limits (say, at 5 ppb intervals) and have each member rate each candidate limit on a scale from "clearly unacceptable" to "clearly acceptable" (or provide a net benefit score). Then we will choose the tightest limit that receives a majority vote as "acceptable" or the limit with the highest net benefit score (if we can agree on a scoring system).

  Alternatively, we can set the limit at the point where the marginal health benefit of a one-unit tightening is approximately equal to the marginal cost. We would need to agree on estimates of both. This avoids circularity if we use independent estimates.

  But the memo must address the philosophical questions.

